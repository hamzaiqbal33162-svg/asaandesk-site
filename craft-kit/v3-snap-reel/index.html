<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();

<style>
  /* ---------- Colours: tomato and saffron on warm cream; charcoal and ember at night ---------- */
  :root {
    color-scheme: light;
    --bg: #fbeee0;
    --bg2: #f7d9bd;
    --card: #fffaf3;
    --card2: #fff3e6;
    --chip: #fff;
    --rule: #f0dfcc;
    --ink: #2a1a12;
    --ink2: #7a5f50;
    --soft: #b89c89;
    --red: #e8452e;
    --red2: #c23420;
    --saff: #f5a51b;
    --mint: #22a77f;
    --steel: #b9c1cc;
    --shadow: rgba(110, 50, 20, .22);
    --focus: #c23420;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #140f0d;
    --bg2: #2a1610;
    --card: #1d1613;
    --card2: #241b17;
    --chip: #2b211c;
    --rule: #3a2c25;
    --ink: #fbefe6;
    --ink2: #c9ad9c;
    --soft: #7f675a;
    --red: #ff6a3f;
    --red2: #e04d26;
    --saff: #ffb84a;
    --mint: #3cd3a2;
    --steel: #8d96a3;
    --shadow: rgba(0, 0, 0, .6);
    --focus: #ffa37f;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: radial-gradient(60% 50% at 50% 0%, var(--bg2), transparent 70%), var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px 14px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .app {
    --sp: 112px;
    position: relative;
    width: min(860px, 100%);
    padding: 16px 18px 18px;
    border-radius: 28px;
    background: linear-gradient(180deg, var(--card), var(--card2));
    box-shadow: 0 44px 90px -50px var(--shadow), 0 0 0 1px var(--rule);
  }
  .dots { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  .dots i { position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }

  /* ---------- Header ---------- */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo { flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(150deg, var(--saff), var(--red)); box-shadow: 0 12px 20px -12px var(--red2); }
  .logo svg { width: 24px; height: 24px; }
  .brand b { display: block; font-size: 17px; letter-spacing: -.02em; }
  .brand small { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
  .brand small i { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mint) 25%, transparent); }
  .cart { position: relative; flex: none; width: 46px; height: 46px; border: 0; border-radius: 15px; display: grid; place-items: center; background: var(--chip); box-shadow: 0 0 0 1px var(--rule), 0 10px 18px -14px var(--shadow); transition: transform .3s var(--spring); }
  .cart svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cart:active { transform: scale(.92); }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center; background: var(--red); color: #fff; font-size: 11.5px; font-weight: 800; box-shadow: 0 0 0 3px var(--card); transform: scale(0); transition: transform .45s var(--spring); }
  .badge.on { transform: scale(1); }
  h1 { margin: 14px 0 2px; font-size: clamp(21px, 4.4vw, 28px); letter-spacing: -.03em; line-height: 1.12; }
  .lead { margin: 0; font-size: 13.5px; color: var(--ink2); }

  /* ---------- The reel: chips on a curved drum, the magnet in the middle ---------- */
  .reelwrap { position: relative; margin: 10px -18px 4px; height: 190px; }
  .reel {
    position: absolute; inset: 0; overflow: hidden; perspective: 900px; touch-action: pan-y; cursor: grab; user-select: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
  }
  .reel.grab { cursor: grabbing; }
  .slot {
    position: absolute; left: 50%; top: 58%; width: 112px; height: 124px; margin: -62px 0 0 -56px; border-radius: 30px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--saff) 32%, transparent), transparent);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--red) 28%, transparent);
    transform: scale(calc(1 + var(--pull, 0) * .06));
  }
  .slot::before, .slot::after { content: ""; position: absolute; left: 50%; width: 2px; height: 10px; margin-left: -1px; background: color-mix(in srgb, var(--red) 50%, transparent); border-radius: 1px; }
  .slot::before { top: -16px; }
  .slot::after { bottom: -16px; }
  .chip {
    --near: 0;
    position: absolute; left: 50%; top: 58%; width: 94px; height: 108px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 0; border: 0; border-radius: 26px;
    background: color-mix(in srgb, var(--red) calc(var(--near) * 100%), var(--chip));
    color: color-mix(in srgb, #fff calc(var(--near) * 100%), var(--ink));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--rule) calc(100% - var(--near) * 100%), transparent), 0 calc(10px + var(--near) * 14px) calc(18px + var(--near) * 10px) -14px var(--shadow);
    font-size: 13.5px; font-weight: 800; letter-spacing: -.01em;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .chip svg { width: 50px; height: 50px; transition: transform .4s var(--spring); }
  .chip:focus-visible { outline-offset: 4px; }
  .chip[aria-selected="true"] svg { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
  .magnet { position: absolute; left: 50%; top: 4px; width: 44px; height: 44px; margin-left: -22px; z-index: 3; pointer-events: none; }
  .magnet svg { width: 100%; height: 100%; overflow: visible; }
  .hum { animation: hum .18s linear infinite alternate; opacity: calc(.25 + var(--pull, 0) * .75); }
  @keyframes hum { to { transform: translateY(1px); } }
  .field { position: absolute; left: 50%; top: 34px; width: 120px; height: 30px; margin-left: -60px; z-index: 2; pointer-events: none; overflow: visible; opacity: var(--fx, 0); }
  .field path { fill: none; stroke: var(--saff); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 7; animation: march .5s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -10; } }
  .spark { position: absolute; left: 50%; top: 58%; width: 3px; height: 14px; margin: -7px 0 0 -1.5px; border-radius: 2px; background: var(--saff); pointer-events: none; z-index: 4; }
  .nav { position: absolute; top: 58%; z-index: 5; width: 40px; height: 40px; margin-top: -20px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--chip); box-shadow: 0 0 0 1px var(--rule), 0 10px 18px -12px var(--shadow); transition: transform .3s var(--spring), opacity .3s; }
  .nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .nav:active { transform: scale(.9); }
  .nav[disabled] { opacity: .35; cursor: default; }
  .prev { left: 16px; }
  .next { right: 16px; }
  .finger { position: absolute; left: 50%; top: 62%; z-index: 6; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--ink) 8%, transparent); opacity: 0; pointer-events: none; }

  /* ---------- Dishes ---------- */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 2px 10px; }
  .head h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
  .head span { font-size: 12.5px; color: var(--ink2); }
  .dishes { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-height: 140px; overflow-x: clip; }
  .dish { display: grid; grid-template-columns: 46px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 10px; align-items: center; padding: 12px; border-radius: 18px; background: var(--chip); box-shadow: 0 0 0 1px var(--rule), 0 14px 22px -20px var(--shadow); }
  .dish .ic { grid-row: span 3; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--saff) 18%, transparent); }
  .dish .ic svg { width: 32px; height: 32px; }
  .dish b { font-size: 14.5px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dish small { font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dish .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
  .price { font-weight: 800; font-size: 13.5px; }
  .add { display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 12.5px; font-weight: 800; transition: transform .3s var(--spring), background .25s; }
  .add:active { transform: scale(.9); }
  .add.got { background: var(--mint); color: #fff; }

  /* ---------- Bag bar ---------- */
  .bag { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 10px 10px 10px 16px; border-radius: 18px; background: var(--ink); color: var(--card); }
  .bag p { margin: 0; font-size: 14px; font-weight: 700; }
  .bag p span { opacity: .7; font-weight: 600; }
  .go { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 14px; background: var(--red); color: #fff; font-weight: 800; font-size: 14px; transition: transform .3s var(--spring), background .3s; white-space: nowrap; }
  .go:active { transform: scale(.95); }
  .go[disabled] { opacity: .45; cursor: default; }
  .go.done { background: var(--mint); }
  .go .sp { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff; display: none; animation: spin .8s linear infinite; }
  .go.work .sp { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 680px) {
    .dishes { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 520px) {
    .app { --sp: 88px; padding: 14px 12px 14px; border-radius: 22px; }
    .reelwrap { margin: 8px -12px 2px; height: 170px; }
    .chip { width: 78px; height: 92px; border-radius: 22px; font-size: 12px; }
    .chip svg { width: 40px; height: 40px; }
    .slot { width: 92px; height: 106px; margin: -53px 0 0 -46px; }
    .nav { width: 34px; height: 34px; margin-top: -17px; }
    .prev { left: 8px; } .next { right: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  </section>
</main>

    { id: "pizza", name: "Pizza", eta: 35, dishes: [["Margherita", "Tomato, mozzarella, basil", 1200], ["Tikka pizza", "Chicken tikka, onions", 1450], ["Fajita pizza", "Peppers, olives", 1500]] },
    { id: "desserts", name: "Desserts", eta: 20, dishes: [["Kheer", "Rice pudding, pistachio", 320], ["Gulab jamun, 4", "Warm, in syrup", 280], ["Kulfi", "Malai, on a stick", 250]] },
    { id: "chai", name: "Chai", eta: 15, dishes: [["Karak milk tea", "Strong and sweet", 150], ["Pink Kashmiri tea", "Salted, with almonds", 220], ["Cardamom green tea", "Light and fresh", 160]] }
  ];
  const svg = (id) => '<svg viewBox="0 0 50 50" aria-hidden="true">' + ICON[id] + "</svg>";

  // ---------- Build the reel ----------
  const app = $("#app"), reel = $("#reel"), wrap = $("#reelwrap");
  const chips = CATS.map((c, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", "false");
    b.setAttribute("aria-controls", "dishes");
    b.tabIndex = -1;
    b.innerHTML = svg(c.id) + "<span>" + c.name + "</span>";
    reel.appendChild(b);
    return b;
  });
  const N = CATS.length;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const spacing = () => parseFloat(getComputedStyle(app).getPropertyValue("--sp")) || 112;

  // ---------- Physics: a spring towards the target, extra pull close to the magnet ----------
  let x = 0, v = 0, target = 0, shown = -1, dragging = false, crossed = true, lastT = performance.now();
  function render() {
    const SP = spacing();
    let pull = 0;
    chips.forEach((c, i) => {
      const o = i - x, a = Math.abs(o);
      const tx = o * SP, ry = clamp(-o * 17, -62, 62), tz = -Math.min(a, 4) * 36, s = 1 + Math.max(0, 1 - a) * .14;
      c.style.transform = "translate(-50%,-50%) translateX(" + tx.toFixed(1) + "px) translateZ(" + tz.toFixed(1) + "px) rotateY(" + ry.toFixed(1) + "deg) scale(" + s.toFixed(3) + ")";
      c.style.opacity = a > 4.2 ? "0" : String(clamp(1 - Math.max(0, a - 2.6) * .6, 0, 1));
      const near = Math.max(0, 1 - a * 1.6);
      c.style.setProperty("--near", near.toFixed(3));
      pull = Math.max(pull, near);
    });
    wrap.style.setProperty("--pull", (dragging ? pull * .6 : pull).toFixed(3));
    // field lines only while a chip is being pulled in
    wrap.style.setProperty("--fx", (dragging ? 0 : clamp(Math.abs(target - x) * 5 + Math.abs(v) * 25, 0, 1) * pull).toFixed(3));
  }
  function frame(now) {
    const dt = Math.min(40, now - lastT) / 16.67;
    lastT = now;
    if (!dragging) {
      const d = target - x;
      const k = Math.abs(d) < .5 ? .14 : .07; // the magnet grabs harder near the middle
      v += d * k * dt;
      v *= Math.pow(.72, dt);
      const before = d;
      x += v * dt;
      const after = target - x;
      if (!crossed && (Math.sign(before) !== Math.sign(after) || (Math.abs(after) < .01 && Math.abs(v) < .01))) { crossed = true; snap(target); }
      if (Math.abs(after) < .0005 && Math.abs(v) < .0005) { x = target; v = 0; }
    }
    render();
    requestAnimationFrame(frame);
  }
  function goTo(i) {
    target = clamp(Math.round(i), 0, N - 1);
    crossed = false;
    if (reduce) { x = target; v = 0; crossed = true; snap(target); }
    navState();
  }
  function navState() { $("#prev").disabled = target <= 0; $("#next").disabled = target >= N - 1; }

  // The satisfying bit: the magnet clacks, sparks fly, the field lines flash
  function snap(i) {
    if (!reduce) {
      const mag = wrap.querySelector(".magnet");
      mag.animate([{ transform: "none" }, { transform: "translateY(5px) scaleY(.92)" }, { transform: "translateY(-2px)" }, { transform: "none" }], { duration: 360, easing: "cubic-bezier(.3,.8,.4,1)" });
      for (let k = 0; k < 10; k++) {
        const sp = document.createElement("span");
        sp.className = "spark";
        wrap.appendChild(sp);
        const ang = (k / 10) * 360 + Math.random() * 18;
        sp.animate([
          { transform: "rotate(" + ang + "deg) translateY(-50px) scaleY(.4)", opacity: 1 },
          { transform: "rotate(" + ang + "deg) translateY(-82px) scaleY(1)", opacity: 0 }
        ], { duration: 420 + Math.random() * 160, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => sp.remove();
      }
      chips[i].animate([{ filter: "brightness(1.25)" }, { filter: "none" }], { duration: 420 });
    }
    chips.forEach((c, k) => { c.setAttribute("aria-selected", String(k === i)); c.tabIndex = k === i ? 0 : -1; });
    if (i !== shown) showDishes(i, i > shown ? 1 : -1);
  }

  // ---------- Dish cards ----------
  const dishes = $("#dishes");
  const bag = new Map();
  function showDishes(i, dir) {
    const c = CATS[i];
    shown = i;
    $("#catName").textContent = c.name;
    $("#catNote").textContent = c.dishes.length + " dishes · " + c.eta + " min";
    say(c.name + ", " + c.dishes.length + " dishes");
    const html = c.dishes.map((d, k) => {
      const id = c.id + "-" + k, q = bag.get(id) || 0;
      return '<div class="dish"><span class="ic">' + svg(c.id) + "</span><b>" + d[0] + "</b><small>" + d[1] + '</small><div class="row"><span class="price">' + pkr(d[2]) + '</span><button type="button" class="add' + (q ? " got" : "") + '" data-id="' + id + '" data-p="' + d[2] + '" data-n="' + d[0] + '" aria-label="Add ' + d[0] + '">' + (q ? "✓ " + q : "+ Add") + "</button></div></div>";
    }).join("");
    const old = [...dishes.children];
    if (reduce || !old.length) { dishes.innerHTML = html; return; }
    old.forEach((el, k) => el.animate([{ transform: "none", opacity: 1 }, { transform: "translateX(" + (-dir * 40) + "px)", opacity: 0 }], { duration: 180, delay: k * 30, fill: "forwards", easing: "ease-in" }));
    setTimeout(() => {
      dishes.innerHTML = html;
      [...dishes.children].forEach((el, k) => el.animate(
        [{ transform: "translateX(" + (dir * 60) + "px) scale(.95)", opacity: 0 }, { transform: "none", opacity: 1 }],
        { duration: 560, delay: k * 70, easing: "cubic-bezier(.34,1.45,.64,1)", fill: "backwards" }
      ));
    }, 230);
  }
  const prices = new Map();
  function refreshBag(bump) {
    let n = 0, t = 0;
    bag.forEach((q, id) => { n += q; t += q * prices.get(id); });
    const badge = $("#badge");
    badge.textContent = n; badge.classList.toggle("on", n > 0);
    $("#cartBtn").setAttribute("aria-label", n ? "Bag, " + n + " items, " + pkr(t) : "Bag, empty");
    $("#bagText").innerHTML = n ? n + (n === 1 ? " item" : " items") + " <span>· " + pkr(t) + "</span>" : "Your bag is empty <span>· add a dish</span>";
    $("#goBtn").disabled = n === 0;
    if (bump && !reduce) $("#cartBtn").animate([{ transform: "none" }, { transform: "scale(1.2) rotate(-8deg)" }, { transform: "scale(.95) rotate(4deg)" }, { transform: "none" }], { duration: 560, easing: "cubic-bezier(.3,.8,.4,1)" });
  }
  function flyDot(from) {
    if (reduce) return Promise.resolve();
    const a = app.getBoundingClientRect(), f = from.getBoundingClientRect(), t = $("#cartBtn").getBoundingClientRect();
    const d = document.createElement("i");
    $("#dots").appendChild(d);
    const x0 = f.left - a.left + f.width / 2 - 7, y0 = f.top - a.top + f.height / 2 - 7, x1 = t.left - a.left + t.width / 2 - 7, y1 = t.top - a.top + t.height / 2 - 7;
    const frames = [];
    for (let k = 0; k <= 8; k++) { const s = k / 8; frames.push({ transform: "translate(" + (x0 + (x1 - x0) * s) + "px," + (y0 + (y1 - y0) * s - Math.sin(s * Math.PI) * 120) + "px) scale(" + (1 - s * .4) + ")" }); }
    return d.animate(frames, { duration: 640, easing: "cubic-bezier(.4,0,.3,1)" }).finished.then(() => d.remove()).catch(() => d.remove());
  }
  dishes.addEventListener("click", async (e) => {
    const b = e.target.closest(".add");
    if (!b) return;
    const btn = b; // keep the element before any await
    const id = btn.dataset.id;
    prices.set(id, Number(btn.dataset.p));
    bag.set(id, (bag.get(id) || 0) + 1);
    btn.classList.add("got");
    btn.textContent = "✓ " + bag.get(id);
    btn.animate([{ transform: "scale(1)" }, { transform: "scale(1.2)" }, { transform: "scale(1)" }], { duration: 380, easing: "cubic-bezier(.34,1.56,.64,1)" });
    say(btn.dataset.n + " added");
    await flyDot(btn);
    refreshBag(true);
  });
  $("#goBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget, t = btn.querySelector(".t");
    if (btn.disabled) return;
    btn.disabled = true; btn.classList.add("work"); t.textContent = "Placing order…";
    say("Placing your order");
    await sleep(1400);
    btn.classList.remove("work"); btn.classList.add("done"); t.textContent = "Order placed ✓";
    say("Order placed, a rider is on the way");
    $("#bagText").innerHTML = "Rider on the way <span>· about " + CATS[shown].eta + " min</span>";
    await sleep(2200);
    bag.clear(); btn.classList.remove("done"); t.textContent = "Checkout";
    refreshBag(false);
    showDishes(shown, 1);
  });
  $("#cartBtn").addEventListener("click", () => {
    let n = 0; bag.forEach((q) => { n += q; });
    say(n ? "Your bag has " + n + " items" : "Your bag is empty");
    $("#goBtn").animate([{ transform: "none" }, { transform: "translateY(-4px)" }, { transform: "none" }], { duration: 400, easing: "cubic-bezier(.34,1.56,.64,1)" });
  });

  // ---------- Input: drag and flick, wheel, click, arrows, keys ----------
  let down = null;
  reel.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    down = { id: e.pointerId, px: e.clientX, x0: x, lastX: e.clientX, lastT: performance.now(), vel: 0, moved: false };
  });
  reel.addEventListener("pointermove", (e) => {
    if (!down || e.pointerId !== down.id) return;
    const dx = e.clientX - down.px;
    if (!down.moved && Math.abs(dx) > 6) { down.moved = true; dragging = true; reel.setPointerCapture(e.pointerId); reel.classList.add("grab"); }
    if (!down.moved) return;
    const SP = spacing();
    let nx = down.x0 - dx / SP;
    if (nx < 0) nx = nx * .35; // rubber band past the ends
    if (nx > N - 1) nx = N - 1 + (nx - N + 1) * .35;
    const now = performance.now(), dtm = Math.max(1, now - down.lastT);
    down.vel = (-(e.clientX - down.lastX) / SP) / (dtm / 16.67);
    down.lastX = e.clientX; down.lastT = now;
    x = nx;
  });
  function release(e) {
    if (!down || (e && e.pointerId !== down.id)) return;
    if (down.moved) {
      dragging = false;
      reel.classList.remove("grab");
      v = down.vel;
      goTo(x + v * 7);
    }
    down = null;
  }
  reel.addEventListener("pointerup", release);
  reel.addEventListener("pointercancel", release);
  chips.forEach((c, i) => c.addEventListener("click", () => { if (!dragging) goTo(i); }));
  let wheelAcc = 0, wheelT = 0;
  reel.addEventListener("wheel", (e) => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    e.preventDefault();
    wheelAcc += d;
    const now = performance.now();
    if (Math.abs(wheelAcc) > 40 && now - wheelT > 160) { goTo(target + Math.sign(wheelAcc)); wheelAcc = 0; wheelT = now; }
  }, { passive: false });
  $("#prev").addEventListener("click", () => goTo(target - 1));
  $("#next").addEventListener("click", () => goTo(target + 1));
  reel.addEventListener("keydown", (e) => {
    const map = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    let to = null;
    if (map[e.key]) to = target + map[e.key];
    if (e.key === "Home") to = 0;
    if (e.key === "End") to = N - 1;
    if (to === null) return;
    e.preventDefault();
    goTo(to);
    chips[target].focus({ preventScroll: true });
  });

  // ---------- Start: the reel spins in from the far end and snaps onto Biryani ----------
  showDishes(0, 1);
  if (reduce) { x = 0; snap(0); } else { x = 3.4; v = 0; goTo(0); }
  chips[0].tabIndex = 0;
  navState();
  refreshBag(false);
  requestAnimationFrame(frame);

  // ---------- Auto demo: a finger drags and flicks the reel, sometimes adds a dish ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) { demo = false; finger.style.opacity = "0"; } };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  const finger = $("#finger");
  async function fingerDrag(steps) {
    const SP = spacing(), x0 = x, dur = 620;
    finger.style.opacity = "1";
    finger.animate([{ transform: "scale(.6)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 200 });
    await sleep(220);
    if (!demo) return;
    dragging = true;
    const t0 = performance.now();
    await new Promise((res) => {
      const step = (now) => {
        if (!demo) { res(); return; }
        const t = Math.min(1, (now - t0) / dur), e = t * t * (3 - 2 * t);
        x = x0 + steps * .75 * e;
        finger.style.transform = "translateX(" + (-steps * .75 * e * SP * .6) + "px)";
        if (t < 1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    dragging = false;
    v = steps * .06;
    goTo(x0 + steps);
    finger.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: "forwards" }).onfinish = () => { finger.style.opacity = "0"; finger.style.transform = ""; };
  }
  (async () => {
    await sleep(1700);
    let dir = 1, k = 0;
    while (demo) {
      let steps = (k % 3 === 2 ? 1 : 2) * dir;
      if (target + steps > N - 1 || target + steps < 0) { dir = -dir; steps = -steps; }
      await fingerDrag(steps);
      if (!demo) break;
      await sleep(1500);
      if (!demo) break;
      if (k % 2 === 1) {
        let n = 0; bag.forEach((q) => { n += q; });
        if (n >= 4) { bag.clear(); refreshBag(false); showDishes(shown, 1); }
        else { const b = dishes.querySelector(".add"); if (b) b.click(); }
      }
      k++;
      await sleep(1300);
    }
  })();
})();
</script>
</body>
</html>
