<!doctype html>
<!-- Chill and Craft · Strongbox · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strongbox · safe dial code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #e6e9ed;
    --text: #1f262e;
    --muted: #5d6874;
    --frame: #8d96a1;
    --door-1: #d3d8de;
    --door-2: #9aa4af;
    --edge: #6f7883;
    --recess: #22272e;
    --wheel-1: #15181c;
    --wheel-2: #3c434c;
    --numeral: #f3ead6;
    --brass: #c79a3b;
    --brass-hi: #f2d38b;
    --inside: #171a1f;
    --good: #1f9d55;
    --bad: #d93a3a;
    --wait: #e7a51c;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #0d0f12;
    --text: #e8ecf1;
    --muted: #9aa5b1;
    --frame: #2a2f36;
    --door-1: #545d68;
    --door-2: #2c3239;
    --edge: #1c2026;
    --recess: #0b0d10;
    --brass: #d4a64a;
    --inside: #08090b;
    --good: #3ddc84;
    --bad: #ff5c5c;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px 16px;
    color: var(--text);
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--stage) 85%, #fff), var(--stage) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .room { width: min(100%, 380px); text-align: center; }
  h1 { margin: 0 0 4px; font-size: clamp(20px, 5.4vw, 24px); }
  .sub { margin: 0 0 16px; font-size: 14px; color: var(--muted); }

  /* ---------- The safe: frame, inside and door ---------- */
  .safe {
    position: relative;
    height: 272px;
    border-radius: 22px;
    padding: 8px;
    background: var(--frame);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25), 0 22px 40px -20px rgba(0, 0, 0, .6);
    perspective: 1100px;
  }
  .inside {
    position: absolute;
    inset: 8px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 8px;
    color: #f6e7be;
    background:
      linear-gradient(transparent 62%, rgba(255, 255, 255, .06) 62% 64%, transparent 64%),
      radial-gradient(circle at 50% 40%, #2a2416, var(--inside) 70%);
    box-shadow: inset 0 0 30px rgba(0, 0, 0, .9);
  }
  .inside svg { width: 150px; height: 70px; }
  .inside p { margin: 0; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
  .door {
    position: absolute;
    inset: 8px;
    border-radius: 16px;
    padding: 18px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 4px),
      linear-gradient(145deg, var(--door-1), var(--door-2));
    box-shadow: inset 0 0 0 2px var(--edge), inset 0 2px 0 rgba(255, 255, 255, .35), 4px 0 10px rgba(0, 0, 0, .35);
    transform-origin: left center;
    transition: transform 1.1s cubic-bezier(.45, 0, .25, 1.25);   /* swings a little past, then settles */
  }
  .safe.open .door { transform: rotateY(-78deg); }

  /* Inside: warm light spills out and the gold bars bounce up */
  .safe.open .inside { animation: glow 1.6s ease .3s; }
  @keyframes glow { 40% { box-shadow: inset 0 0 30px rgba(0, 0, 0, .9), inset 0 0 80px rgba(255, 200, 90, .55); } }
  .inside svg, .inside p { opacity: 0; transform: translateY(18px) scale(.8); transition: opacity .3s, transform .6s cubic-bezier(.34, 1.56, .64, 1); }
  .safe.open .inside svg { opacity: 1; transform: none; transition-delay: .45s; }
  .safe.open .inside p { opacity: 1; transform: none; transition-delay: .65s; }

  /* Bolts that slide into the frame */
  .bolt {
    position: absolute;
    width: 16px;
    height: 26px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--brass), var(--brass-hi), var(--brass));
    transition: transform .4s ease;
  }
  .bolt.l1 { left: -8px; top: 46px; }
  .bolt.l2 { left: -8px; bottom: 46px; }
  .bolt.r1 { right: -8px; top: 46px; }
  .bolt.r2 { right: -8px; bottom: 46px; }
  .safe.unbolted .bolt.l1, .safe.unbolted .bolt.l2 { transform: translateX(10px); }
  .safe.unbolted .bolt.r1, .safe.unbolted .bolt.r2 { transform: translateX(-10px); }

  .plate { font-size: 10px; font-weight: 800; letter-spacing: .3em; color: var(--edge); text-shadow: 0 1px 0 rgba(255, 255, 255, .35); }

  /* ---------- Number wheels (each one wraps a real input) ---------- */
  .window {
    display: flex;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 12px;
    background: var(--recess);
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .3);
  }
  .wheel {
    position: relative;
    width: clamp(34px, 10vw, 44px);
    height: 56px;
    overflow: hidden;
    border-radius: 7px;
    background: linear-gradient(var(--wheel-1), var(--wheel-2) 50%, var(--wheel-1));
  }
  .wheel::after {           /* cylinder shading + index line */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0, 0, 0, .65), transparent 30% 70%, rgba(0, 0, 0, .65));
    pointer-events: none;
  }
  .strip {
    --pos: 0;
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    transform: translateY(calc(var(--pos) * -56px));
    transition: transform .45s cubic-bezier(.3, 1.3, .5, 1);
  }
  .strip span {
    display: block;
    height: 56px;
    line-height: 56px;
    font: 700 26px/56px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--numeral);
  }
  .strip span:first-child { color: #6b7380; }
  .wheel input {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: transparent;
    text-align: center;
    outline: none;
    cursor: pointer;
  }
  .wheel input::selection { background: transparent; }
  .wheel:focus-within { box-shadow: 0 0 0 2px var(--recess), 0 0 0 4px var(--brass-hi); }
  .wheel:hover:not(:focus-within) { box-shadow: 0 0 0 2px var(--recess), 0 0 0 4px rgba(242, 211, 139, .35); }
  .wheel.filled .strip span { color: var(--brass-hi); }
  /* Each new digit lands with a mechanical clunk */
  .wheel.tick { animation: clunk .35s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes clunk {
    30% { transform: translateY(3px) scale(.95); box-shadow: 0 0 0 2px var(--recess), 0 0 0 4px var(--brass-hi), 0 0 14px var(--brass-hi); }
  }
  .safe.denied .window { animation: shake .45s ease; }
  @keyframes shake {
    20%, 60% { transform: translateX(-7px); }
    40%, 80% { transform: translateX(7px); }
  }

  /* ---------- Handle and status light ---------- */
  .controls { display: flex; align-items: center; gap: 16px; }
  .handle {
    width: 70px;
    height: 70px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  .handle svg { width: 100%; height: 100%; transition: transform .9s cubic-bezier(.5, 0, .3, 1.3); }
  .safe.unbolted .handle svg { transform: rotate(270deg); }
  .handle { transition: transform .4s cubic-bezier(.34, 1.56, .64, 1); }
  .handle:hover:not(:disabled) { transform: rotate(20deg); }
  .handle:active:not(:disabled) { transform: rotate(45deg) scale(.94); transition-duration: .1s; }
  .handle:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 2px; }
  .led {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #555;
    box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .5);
  }
  .led[data-state="wait"] { background: var(--wait); box-shadow: 0 0 10px var(--wait); animation: blink .35s steps(2) infinite; }
  .led[data-state="good"] { background: var(--good); box-shadow: 0 0 12px var(--good); }
  .led[data-state="bad"] { background: var(--bad); box-shadow: 0 0 12px var(--bad); animation: blink .25s steps(2) 4; }
  @keyframes blink { 50% { opacity: .25; } }
  .led-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--edge); }
  [data-theme="dark"] .led-label, [data-theme="dark"] .plate { color: #aab3be; text-shadow: none; }

  /* ---------- Status, slip and buttons ---------- */
  .status { min-height: 22px; margin: 16px 0 6px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--good); }
  .status[data-tone="bad"] { color: var(--bad); }
  .slip {
    display: inline-block;
    margin: 4px 0 6px;
    padding: 8px 14px;
    background: #fff8dc;
    color: #4a3b12;
    font-size: 13px;
    transform: rotate(-2deg);
    box-shadow: 0 6px 12px -6px rgba(0, 0, 0, .4);
  }
  .slip b { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .25em; margin-left: 4px; }
  .tip { margin: 6px 0 12px; font-size: 12.5px; color: var(--muted); }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .actions button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    border: 1.5px solid var(--frame);
    background: transparent;
    color: var(--text);
  }
  .actions .solid { border-color: var(--brass); background: var(--brass); color: #231904; }
  .actions button:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  .actions button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, border-color .2s; }
  .actions button:hover { transform: translateY(-2px); border-color: var(--brass); box-shadow: 0 8px 16px -10px rgba(0, 0, 0, .6); }
  .actions button:active { transform: scale(.94); box-shadow: none; transition-duration: .08s; }
  .slip { transition: transform .35s cubic-bezier(.34, 1.56, .64, 1); }
  .slip:hover { transform: rotate(1deg) scale(1.04); }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Celebration particles: gold coins ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3c4, #e2b24a 55%, #9a6d1c);
    box-shadow: inset 0 0 0 2px rgba(122, 86, 20, .5);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <main class="room">
    <h1 id="title">Open the strongbox</h1>
    <p class="sub">Dial in the 6-digit code from your authenticator app.</p>

    <div class="safe" id="safe">
      <!-- What is behind the door -->
      <div class="inside" aria-hidden="true">
        <svg viewBox="0 0 150 70">
          <defs>
            <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe7a1"/>
              <stop offset="1" stop-color="#b9862a"/>
            </linearGradient>
          </defs>
          <path d="M10 64l10-24h40l10 24z" fill="url(#bar)"/>
          <path d="M80 64l10-24h40l10 24z" fill="url(#bar)"/>
          <path d="M45 38l10-24h40l10 24z" fill="url(#bar)"/>
          <path d="M60 18h30" stroke="#fff6d6" stroke-width="2" stroke-linecap="round" opacity=".8"/>
        </svg>
        <p>Unlocked</p>
      </div>

      <div class="door" id="door">
        <span class="bolt l1" aria-hidden="true"></span>
        <span class="bolt l2" aria-hidden="true"></span>
        <span class="bolt r1" aria-hidden="true"></span>
        <span class="bolt r2" aria-hidden="true"></span>
        <span class="plate" aria-hidden="true">MODEL K-6</span>

        <!-- Six number wheels -->
        <div class="window" id="window" role="group" aria-labelledby="title" aria-describedby="hint tip">
          <label class="wheel"><span class="strip" aria-hidden="true"><span>–</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span><input inputmode="numeric" autocomplete="one-time-code" aria-label="Wheel 1 of 6"></label>
          <label class="wheel"><span class="strip" aria-hidden="true"><span>–</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span><input inputmode="numeric" autocomplete="off" aria-label="Wheel 2 of 6"></label>
          <label class="wheel"><span class="strip" aria-hidden="true"><span>–</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span><input inputmode="numeric" autocomplete="off" aria-label="Wheel 3 of 6"></label>
          <label class="wheel"><span class="strip" aria-hidden="true"><span>–</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span><input inputmode="numeric" autocomplete="off" aria-label="Wheel 4 of 6"></label>
          <label class="wheel"><span class="strip" aria-hidden="true"><span>–</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span><input inputmode="numeric" autocomplete="off" aria-label="Wheel 5 of 6"></label>
          <label class="wheel"><span class="strip" aria-hidden="true"><span>–</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span><input inputmode="numeric" autocomplete="off" aria-label="Wheel 6 of 6"></label>
        </div>

        <div class="controls">
          <span class="led-label" aria-hidden="true">Lock</span>
          <span class="led" id="led" aria-hidden="true"></span>
          <!-- The handle is a real button: it tries to open the door -->
          <button type="button" class="handle" id="handle" aria-label="Turn the handle to open">
            <svg viewBox="0 0 70 70" aria-hidden="true">
              <g stroke="var(--brass)" stroke-width="6" stroke-linecap="round">
                <path d="M35 35V7M35 35L10.8 49M35 35l24.2 14"/>
              </g>
              <circle cx="35" cy="7" r="5.5" fill="var(--brass-hi)"/>
              <circle cx="10.8" cy="49" r="5.5" fill="var(--brass-hi)"/>
              <circle cx="59.2" cy="49" r="5.5" fill="var(--brass-hi)"/>
              <circle cx="35" cy="35" r="13" fill="var(--brass)"/>
              <circle cx="35" cy="35" r="7" fill="var(--brass-hi)"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="slip" id="hint">Demo code<b id="demo"></b></p>
    <p class="tip" id="tip">Type or paste the code. Up and Down arrows roll a wheel, Enter turns the handle.</p>
    <div class="actions">
      <button type="button" id="resend">New code</button>
      <button type="button" class="solid" id="again" hidden>Close the door</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const safe = document.getElementById("safe");
  const wheels = Array.from(document.querySelectorAll(".wheel"));
  const boxes = wheels.map((w) => w.querySelector("input"));
  const strips = wheels.map((w) => w.querySelector(".strip"));
  const led = document.getElementById("led");
  const handle = document.getElementById("handle");
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");
  let demo = "";
  let busy = false;

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo;
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    restart(statusEl, "pop");
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;              // reflow so the animation plays again
    el.classList.add(cls);
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    // Position 0 is the blank dash, positions 1 to 10 are the digits 0 to 9
    strips[i].style.setProperty("--pos", d === "" ? 0 : Number(d) + 1);
    wheels[i].classList.toggle("filled", d !== "");
    if (d) {
      restart(wheels[i], "tick");     // mechanical clunk
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
    }
  }

  // ---- Celebration: coins tumble out of the open safe ----
  const fx = document.getElementById("fx");
  function coins() {
    if (reduce) return;
    const r = safe.getBoundingClientRect();
    for (let n = 0; n < 30; n++) {
      const p = document.createElement("i");
      fx.append(p);
      const x0 = r.left + r.width * (0.3 + Math.random() * 0.4);
      const y0 = r.top + r.height * 0.55;
      const dx = (Math.random() - 0.5) * 320;
      const up = 80 + Math.random() * 160;
      const flip = 2 + Math.floor(Math.random() * 4);
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.4) rotateY(0)", opacity: 1 },
        { transform: "translate(" + (x0 + dx * 0.5) + "px," + (y0 - up) + "px) scale(1) rotateY(" + flip * 90 + "deg)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + 220) + "px) scale(.9) rotateY(" + flip * 360 + "deg)", opacity: 0 }
      ], { duration: 1400 + Math.random() * 700, delay: Math.random() * 300, easing: "cubic-bezier(.25, .6, .4, 1)", fill: "backwards" }).onfinish = () => p.remove();
    }
  }
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
    handle.disabled = locked;
  }
  function roll(i, step) {
    // Up and Down arrows turn a wheel one notch
    const cur = vals[i] === "" ? (step > 0 ? -1 : 10) : Number(vals[i]);
    setDigit(i, String((cur + step + 10) % 10));
  }
  function tryHandle() {
    if (busy) return;
    const empty = vals.indexOf("");
    if (empty !== -1) {
      say("The handle won't turn yet. Set all 6 wheels first.", "bad");
      focusBox(empty);
      return;
    }
    verify(vals.join(""));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "ArrowUp": e.preventDefault(); roll(i, 1); break;
        case "ArrowDown": e.preventDefault(); roll(i, -1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
        case "Enter": e.preventDefault(); tryHandle(); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });

    // Scroll on a wheel also rolls it
    wheels[i].addEventListener("wheel", (e) => {
      if (busy) return;
      e.preventDefault();
      roll(i, e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
  });

  handle.addEventListener("click", tryHandle);

  // ---- Check the code and open the door ----
  async function verify(code) {
    busy = true;
    setLocked(true);
    led.dataset.state = "wait";
    say("Checking the combination…");
    await wait(900);

    if (code === demo) {
      led.dataset.state = "good";
      safe.classList.add("unbolted");      // handle spins, bolts slide back
      say("Combination accepted…");
      await wait(850);
      safe.classList.add("open");          // the door swings open
      await wait(650);
      coins();                             // light spills out, bars rise, coins fly
      say("Unlocked. The strongbox is open.", "good");
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      led.dataset.state = "bad";
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      safe.classList.add("denied");
      say("Wrong combination. The wheels have been reset.", "bad");
      await wait(500);
      safe.classList.remove("denied");
      strips.forEach((s) => s.style.setProperty("--pos", 10));   // wheels spin all the way round…
      await wait(380);
      clearAll();                         // …and roll back to blank
      await wait(500);
      led.dataset.state = "";
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", async () => {
    againBtn.hidden = true;
    safe.classList.remove("open");
    await wait(900);
    safe.classList.remove("unbolted");
    led.dataset.state = "";
    clearAll();
    newCode();
    busy = false;
    setLocked(false);
    say("Door closed and locked. A new demo code is ready.");
    focusBox(0);
  });

  resendBtn.addEventListener("click", () => {
    if (busy) return;
    newCode();
    clearAll();
    say("New code generated. Dial it in.");
    focusBox(0);
  });

  newCode();
})();
</script>
</body>
