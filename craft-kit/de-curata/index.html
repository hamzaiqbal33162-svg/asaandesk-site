<script>/* Pick the theme before first paint: ?theme= wins, then the saved choice, then the default */(function(k,d){var t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(k+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})('curata','');</script>
<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Curata look: gallery sand and terracotta, serif display, arches and hairlines ================= */
:root{--font:"Gill Sans","Gill Sans MT","Optima","Segoe UI",system-ui,sans-serif;--serif:"Didot","Bodoni 72","Bodoni MT","Libre Bodoni",Georgia,serif;--rb:999px;--ri:6px;--rm:10px;--rp:8px;
--bg:#f3ece0;--surface:#fbf7f0;--surface2:#f1e8da;--line:#e0d3bf;--text:#2b211b;--muted:#7c6d5f;--hover:rgba(120,70,30,.07);--accent:#b5532c;--on-accent:#fff;--gold:#a8823a;--ok:#5f7f52;--warn:#c18b1f;--danger:#b8352f;--info:#4f6d8a;--field:#fffdf9;
--c1:#b5532c;--c2:#7a8f6a;--c3:#c9a24a;--c4:#7b4b6a;--c5:#4f6d8a;--c6:#d48c84;--floor:#efe5d4;--wall:#2b211b;--shadow:0 22px 40px -30px rgba(70,40,20,.5)}
[data-theme="dark"]{--bg:#15110e;--surface:#1e1915;--surface2:#272019;--line:#3a3028;--text:#f1e8dc;--muted:#a8998a;--hover:rgba(255,220,180,.06);--accent:#e07a4f;--on-accent:#1a0f08;--gold:#d8b46a;--ok:#9fbf8c;--warn:#e8b64a;--danger:#ef6d62;--info:#8fb0d0;--field:#18130f;
--c1:#e07a4f;--c2:#a4bb92;--c3:#e0bd63;--c4:#c48ab0;--c5:#88a9c8;--c6:#eaa79f;--floor:#231d18;--wall:#d9cbb8;--toast-bg:#3a2f27;--shadow:0 22px 40px -26px rgba(0,0,0,.8)}
.serif,h1,h2.serif{font-family:var(--serif);font-weight:400}
.btn{font-weight:600;letter-spacing:.02em}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
/* Sidebar as a gallery wall label */
.side{position:sticky;top:0;height:100vh;padding:24px 20px;display:flex;flex-direction:column;gap:20px;overflow:auto;border-right:1px solid var(--line);background:var(--surface);z-index:40}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{position:relative;display:grid;gap:1px;padding-left:14px}
.nav::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
.nav a{display:flex;align-items:baseline;gap:12px;padding:9px 6px;color:var(--muted);text-decoration:none;font-size:14px;transition:color .25s,padding .25s}
.nav a .rn{font-family:var(--serif);font-size:13px;min-width:26px;color:var(--gold)}
.nav a:hover{color:var(--text);padding-left:10px}
.nav a[aria-current="page"]{color:var(--text);padding-left:10px}
.nav-marker{position:absolute;left:-1px;width:3px;top:0;background:var(--accent);transition:transform .55s cubic-bezier(.6,0,.2,1),height .3s;pointer-events:none}
.livebox{margin-top:auto;padding:16px;border:1px solid var(--line);border-radius:140px 140px 8px 8px;text-align:center;background:var(--surface2)}
.livebox small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.livebox b{display:block;font-family:var(--serif);font-size:44px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.livebox span{font-size:12px;color:var(--muted)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.main-wrap{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:14px 30px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .sp{flex:1}
.top .date{font-family:var(--serif);font-size:16px}
.menu-btn{display:none}
main{padding:6px 30px 50px;outline:none}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ph h1{font-size:40px;line-height:1.05;letter-spacing:-.01em;margin-top:4px}
.ph-a{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g{display:grid;gap:20px;margin-bottom:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.8fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h2{font-family:var(--serif);font-weight:400;font-size:21px}
.ch p{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
.kpi .kf{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--muted)}
/* Floor plan (signature) */
.fp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fp-stage{perspective:1400px}
.fp{display:block;width:100%;height:auto;transform-origin:50% 60%;animation:floorIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes floorIn{from{opacity:0;transform:rotateX(38deg) translateY(30px) scale(.94)}}
.fp .floor{fill:var(--floor);stroke:var(--wall);stroke-width:3}
.fp .room{stroke:var(--wall);stroke-width:1.5;cursor:pointer;transition:fill .8s,opacity .3s;outline:none}
.fp .room:hover,.fp .room:focus-visible{stroke:var(--accent);stroke-width:3}
.fp .room.closed{fill:url(#hatch)!important}
.fp .lbl{font-family:var(--serif);font-size:15px;fill:var(--text);pointer-events:none}
.fp .sub{font-size:11px;fill:var(--muted);pointer-events:none;letter-spacing:.04em}
.fp .cnt{font-size:12px;fill:var(--text);font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
.fp .door{stroke:var(--floor);stroke-width:6}
.fp .dot{fill:var(--accent);transition:transform 1.9s cubic-bezier(.45,.05,.3,1);pointer-events:none;opacity:.85}
.fp .dot.g{fill:var(--c5)}
.fp .stair{fill:none;stroke:var(--muted);stroke-width:1}
.heatleg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.heatleg i{width:120px;height:8px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 6%,var(--floor)),var(--accent))}
/* Desk widgets */
.slots{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px;align-items:end;height:170px}
.slot{position:relative;height:100%;border:0;background:var(--surface2);border-radius:999px 999px 4px 4px;padding:0;overflow:hidden;cursor:pointer;transition:transform .2s}
.slot:hover{transform:translateY(-3px)}
.slot i{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--sc,var(--c3));border-radius:inherit;animation:fillUp 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*40ms)}
.slot.full i{--sc:var(--accent)}
.slot.past{opacity:.45}
@keyframes fillUp{from{height:0}}
.slot-l{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px;font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
.sale{display:grid;gap:8px}
.tt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tt .grow{flex:1}.tt b{display:block;font-size:13.5px}.tt small{color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{width:32px;height:30px;border:0;background:transparent;font-size:16px;color:var(--text)}
.step button:hover{background:var(--hover)}
.step output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.total b{font-family:var(--serif);font-size:30px;font-weight:400}
.scanrow{display:flex;gap:8px}
.scanrow input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.list{list-style:none;margin:0;padding:0;display:grid}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}.li b{display:block;font-size:13.5px}.li small{display:block;color:var(--muted);font-size:12px}
.tm{font-family:var(--serif);font-size:16px;min-width:70px;color:var(--gold)}
/* Exhibitions */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.arch{height:170px;border-radius:999px 999px 6px 6px;overflow:hidden;margin-bottom:14px;position:relative;background:var(--surface2);border:1px solid var(--line)}
.arch svg{width:100%;height:100%;display:block}
.arch svg *{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.card:hover .arch .a1{transform:translate(8px,-6px)}
.card:hover .arch .a2{transform:translate(-10px,4px) rotate(8deg)}
.ex-h b{font-family:var(--serif);font-size:20px;font-weight:400;display:block}
.ex-h small{color:var(--muted);font-size:12px}
.gantt{display:grid;gap:8px}
.gr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:12.5px}
.gr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{position:relative;height:18px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px) calc(100%/12))}
.gt i{position:absolute;top:2px;bottom:2px;border-radius:9px;background:var(--gc);left:var(--l);width:var(--w);animation:gIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gIn{from{width:0}}
.gt .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent)}
.gm{display:grid;grid-template-columns:150px repeat(12,1fr);gap:0 10px;font-size:10.5px;color:var(--muted)}
/* Tours */
.tours{display:grid;gap:12px}
.tour{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:transform .25s}
.tour:hover{transform:translateX(4px)}
.tour .tm{font-size:22px}
.tour b{font-family:var(--serif);font-weight:400;font-size:18px;display:block}
.tour small{color:var(--muted)}
.cap{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px;max-width:260px}
.cap i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:6px;animation:hbw 1s both}
/* Ticket drawer */
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:168px;height:168px;margin:6px auto 14px;padding:8px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.qr i{background:#1a1410}
.qr i.o{background:transparent}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px}
.dlist dt{color:var(--muted)}.dlist dd{margin:0;font-weight:600}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}.set-row b{display:block}.set-row small{color:var(--muted)}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-102%);transition:transform .4s cubic-bezier(.6,0,.2,1)}body.nav-open .side{transform:none;box-shadow:var(--shadow)}.scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(30,20,10,.4);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top,main{padding-left:16px;padding-right:16px}.slots,.slot-l{grid-template-columns:repeat(8,minmax(0,1fr))}.slot-l span:nth-child(2n){display:none}.slots{height:130px}}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:30px}.top .date{display:none}.gr,.gm{grid-template-columns:90px 1fr}.gm span:nth-child(n+3){display:none}.tour{grid-template-columns:70px 1fr}.tour>div:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><svg width="40" height="46" viewBox="0 0 40 46" aria-hidden="true"><path d="M3 44V20a17 17 0 0134 0v24z" fill="none" style="stroke:var(--accent)" stroke-width="2.5"/><path d="M11 44V22a9 9 0 0118 0v22" fill="none" style="stroke:var(--gold)" stroke-width="2"/><path d="M1 44h38" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="13" r="2.4" style="fill:var(--accent)"/></svg><div><b>Curata</b><small>Visitor desk</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker"></span></nav>
    <div class="livebox" aria-live="polite"><small><span class="pulse" aria-hidden="true"></span>In the building</small><b id="liveN">0</b><span id="liveCap">of 420 capacity</span></div>
  </aside>
  <div class="scrim" data-scrim></div>
  <div class="main-wrap">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="side"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="date" id="topDate"></span>
      <span class="sp"></span>
      <button type="button" class="icon-btn" data-cmdk aria-label="Search (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg></button>
      <button type="button" class="icon-btn" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = n => (n < 0 ? '-$' : '$') + num(Math.abs(n));
const short = n => { const a = Math.abs(n), s = (v, u) => (Math.round(v * 10) / 10).toString() + u; return a >= 1e9 ? s(n / 1e9, 'B') : a >= 1e6 ? s(n / 1e6, 'M') : a >= 1e3 ? s(n / 1e3, 'K') : String(Math.round(n * 10) / 10); };
const pct = n => (n > 0 ? '+' : '') + dec(n, 1) + '%';
const FMT = { num, rs, usd, usd0, short, pct, dec1: n => dec(n, 1), raw: n => String(Math.round(n)), rsShort: n => 'Rs ' + short(n), pctPlain: n => Math.round(n) + '%', usdShort: n => '$' + short(n) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pdate = s => { if (s instanceof Date) return s; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fdate = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fday = s => { const d = pdate(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fshort = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dayDiff = (a, b) => Math.round((pdate(a) - pdate(b)) / 864e5);
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60) % 24, m = min % 60; return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : Math.floor(s / 86400) + ' d ago'; };

/* Storage that never breaks when the browser blocks it */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* Icons: simple stroke drawings, 24x24 */
const ICONS = {
  home: 'M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10', cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', users: 'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3-6 7-6s7 2 7 6M16 3.5a4 4 0 010 7.5M18 15c2.5.7 4 2.6 4 6',
  user: 'M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7', file: 'M6 2h8l5 5v15H6zM14 2v5h5M9 13h7M9 17h7', pill: 'M10.5 3.5a5 5 0 017 7l-7 7a5 5 0 01-7-7zM7 7l7 7',
  heart: 'M12 20s-8-4.6-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 2.5C20 15.4 12 20 12 20z', chart: 'M3 21h18M6 18v-7M11 18V6M16 18v-4M21 18V9', gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  bell: 'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4', search: 'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5', plus: 'M12 5v14M5 12h14', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',
  chevL: 'M15 6l-6 6 6 6', chevR: 'M9 6l6 6-6 6', chevD: 'M6 9l6 6 6-6', menu: 'M4 7h16M4 12h16M4 17h16',

  el.innerHTML = `<div class="ph" data-rise><div><small>Reports</small><h1>Visitors</h1></div><div class="ph-a">${segc('Range', ['7D', '30D', '12M'], repR)}<button type="button" class="btn" data-a="export">${ic('download')}Export</button></div></div>
  <section class="card" style="margin-bottom:20px"><div class="ch"><h2>Visitors over time</h2><p>Closed on Mondays</p></div><div id="vc"></div></section>
  <div class="g g3"><section class="card"><div class="ch"><h2>Ticket mix</h2></div><div id="mx"></div></section><section class="card"><div class="ch"><h2>Busiest rooms now</h2></div>${hbars(ROOMS.slice().sort((a, b) => D.counts[b.id] - D.counts[a.id]).slice(0, 6).map(r => ({ label: r.name, value: D.counts[r.id] })), v => v + ' people')}</section><section class="card"><div class="ch"><h2>By weekday</h2><p>Average visitors, last 12 weeks</p></div>${heatHTML(['Visitors'], ['Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], (r, c) => { const d = [2, 3, 4, 5, 6, 0][c], h = D.hist.slice(-84).filter(x => pdate(x.d).getDay() === d); return Math.round(sum(h.map(x => x.v)) / Math.max(1, h.length)); }, { color: 'var(--accent)', f: v => v + ' a day', label: 'Visitors by weekday' })}</section></div>`;
  const args = () => { if (repR === '12M') { const L = [], v = []; for (let i = 11; i >= 0; i--) { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1), k = iso(d).slice(0, 7); L.push(MON[d.getMonth()]); v.push(sum(D.hist.filter(h => h.d.slice(0, 7) === k).map(h => h.v))); } return { labels: L, series: [{ name: 'Visitors', data: v, color: 'var(--accent)' }], h: 240 }; } const n = repR === '7D' ? 7 : 30, h = D.hist.slice(-n); return { labels: h.map(x => n === 7 ? DOW[pdate(x.d).getDay()] : fshort(x.d)), series: [{ name: 'Visitors', data: h.map(x => x.v), color: 'var(--accent)' }, { name: 'Last year', data: h.map((x, i) => Math.round(x.v * (.82 + Math.sin(i) * .06))), color: 'var(--c3)', dash: true }], h: 240 }; };
  lineChart($('#vc', el), { ...args(), fmt: short, tfmt: v => num(v) + ' visitors' });
  donut($('#mx', el), { data: mix, size: 140, thick: 18, center: { value: sum(mix.map(m => m.value)), label: 'tickets' } });
  segBind(el, 'seg', v => { repR = v; lineChart($('#vc', el), { ...args(), fmt: short, tfmt: v2 => num(v2) + ' visitors' }); });
}

/* ---------- Page: Settings ---------- */
function pSettings(el) {
  el.innerHTML = `<div class="ph" data-rise><div><small>Settings</small><h1>The museum</h1></div></div><div class="g g2"><section class="card"><div class="ch"><h2>Details</h2></div><form class="frm" id="mf" novalidate>${fieldHTML({ k: 'name', label: 'Museum name', req: true }, D.museum.name)}${fieldHTML({ k: 'city', label: 'City', half: true }, D.museum.city)}${fieldHTML({ k: 'phone', label: 'Phone', type: 'tel', half: true }, D.museum.phone)}${fieldHTML({ k: 'hours', label: 'Opening hours' }, D.museum.hours)}<div><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card"><div class="set-row"><div><b>Theme</b><small>Daylight gallery or evening opening. ?theme=dark also works.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div><div class="set-row"><div><b>Building capacity</b><small>${BUILD_CAP} people across both floors</small></div><span class="badge">Fire code</span></div><div class="set-row"><div><b>Reopen all rooms</b><small>${Object.keys(D.closed).length} closed right now</small></div><button type="button" class="btn" data-a="reopen">Reopen</button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample bookings and floors</small></div><button type="button" class="btn danger" data-a="reset">Reset</button></div></section></div>`;
  syncThemeBtns();
  $('#mf', el).onsubmit = e => { e.preventDefault(); const f = e.target, n = f.elements.name; if (!n.value.trim()) { n.setAttribute('aria-invalid', 'true'); $('#' + n.id + '-e').textContent = 'Name is required'; return; } n.removeAttribute('aria-invalid'); $('#' + n.id + '-e').textContent = ''; ['name', 'city', 'phone', 'hours'].forEach(k => D.museum[k] = f.elements[k].value.trim()); save(); toast('Museum details saved'); };
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'desk', label: 'Visitor desk', render: pDesk }, { id: 'floors', label: 'Floor plan', render: pFloors }, { id: 'tickets', label: 'Tickets', render: pTickets }, { id: 'exhibitions', label: 'Exhibitions', render: pExhibits },
  { id: 'tours', label: 'Tours', render: pTours }, { id: 'members', label: 'Members', render: pMembers }, { id: 'reports', label: 'Reports', render: pReports }, { id: 'settings', label: 'Settings', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map((r, i) => `<a href="#/${r.id}" data-route="${r.id}"><span class="rn">${RN[i]}</span><span>${r.label}</span></a>`).join(''));
$('#topDate').textContent = fday(TODAY) + ' ' + TODAY.getFullYear();
document.addEventListener('click', e => {
  const t = e.target;
  const sl = t.closest('[data-slot]'); if (sl) { const s = +sl.dataset.slot; if (slotSold(s) >= SLOT_CAP) { toast(`${hm(s)} is sold out`, 'err'); return; } bookingForm(s); return; }
  const ci = t.closest('[data-checkin]'); if (ci) { checkIn(D.bookings.find(b => b.id === ci.dataset.checkin)); return; }
  const ed = t.closest('[data-exed]'); if (ed) { exhibitForm(D.exhibits.find(x => x.id === ed.dataset.exed)); return; }
  const er = t.closest('[data-exroom]'); if (er) { curFloor = room(er.dataset.exroom).floor; ROUTER.go('floors'); setTimeout(() => roomDrawer(er.dataset.exroom), 120); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'booking') bookingForm(); else if (a === 'exhibit') exhibitForm(null);
  else if (a === 'tour') formModal({ title: 'New guided tour', submit: 'Add tour', values: { date: iso(TODAY), time: 900, cap: 20, guide: D.guides[0], lang: 'English' }, fields: [{ k: 'name', label: 'Tour name', req: true }, { k: 'date', label: 'Date', type: 'date', half: true, req: true, check: v => v < iso(TODAY) ? 'Pick today or later' : '' }, { k: 'time', label: 'Time', type: 'select', half: true, opts: [600, 660, 720, 780, 840, 900, 960, 1020].map(m => ({ v: m, l: hm(m) })) }, { k: 'guide', label: 'Guide', type: 'select', half: true, opts: D.guides }, { k: 'lang', label: 'Language', type: 'select', half: true, opts: ['English', 'Urdu', 'Punjabi'] }, { k: 'cap', label: 'Places', type: 'number', min: 2, max: 60, req: true, half: true }, { k: 'group', label: 'School or group (optional)', half: true }], onSubmit(v) { D.tours.push({ id: 'T' + uid(), ...v, time: +v.time, booked: 0 }); save(); tourDay = v.date; toast(`${v.name} added for ${fday(v.date)}`); refresh(); } });
  else if (a === 'member') formModal({ title: 'Add a member', submit: 'Add', values: { tier: 'Friend' }, fields: [{ k: 'name', label: 'Full name', req: true }, { k: 'phone', label: 'Phone', type: 'tel', req: true, half: true }, { k: 'tier', label: 'Tier', type: 'select', half: true, opts: ['Friend', 'Family', 'Patron'] }], onSubmit(v) { D.members.unshift({ id: 'M' + (300 + D.members.length), ...v, since: iso(TODAY), renew: iso(addDays(TODAY, 365)), visits: 0 }); save(); toast(`${v.name} joined as a ${v.tier}`); refresh(); } });
  else if (a === 'reopen') { D.closed = {}; save(); toast('All rooms are open'); refresh(); }
  else if (a === 'export') toast(`Exported ${D.bookings.length} bookings and ${D.hist.length} days of visits`);
  else if (a === 'reset') confirmBox('Put back the sample museum data? Your changes will be lost.', () => { store.del(KEY); D = makeData(); save(); updLive(); toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: 'arrowR', run: () => ROUTER.go(r.id) })), ...ROOMS.map(r => ({ label: r.name, hint: 'Room · ' + (r.floor === 'G' ? 'ground' : 'first') + ' floor', icon: 'map', run: () => { curFloor = r.floor; ROUTER.go('floors'); setTimeout(() => roomDrawer(r.id), 120); } })), { label: 'New booking', hint: 'Action', icon: 'ticket', run: () => bookingForm() }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }];

/* Start */
initTheme('curata', '');
addNote(`${today().filter(b => b.chan === 'School group').length || 2} school groups arrive today`, 'info', new Date(Date.now() - 4e6));
addNote('Temporary Hall: Monsoon Machines opens next month', 'info', new Date(Date.now() - 6e7));
const renewDue = D.members.filter(m => m.renew < iso(addDays(TODAY, 30))).length; if (renewDue) addNote(`${renewDue} memberships need renewing this month`, 'warn', new Date(Date.now() - 3e7));
const busy = ROOMS.find(r => D.counts[r.id] / r.cap > .6); if (busy) addNote(`${busy.name} is getting busy`, 'warn', new Date(Date.now() - 6e5));
updLive(); every(2000, tickLive, false); save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'desk', title: 'Curata' });
</script>
</body>
</html>
