<!doctype html>
<!-- Chill and Craft · Swipe Pay · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe Pay · Chill and Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #fbe8f0;
    --card: #fffafc;
    --ink: #2a0f2e;
    --muted: #8a6a86;
    --line: #f0d6e2;
    --body-1: #4a1752;
    --body-2: #2a0f2e;
    --pink: #ff3d8b;
    --amber: #fbbf24;
    --green: #34d399;
    --paper: #ffffff;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #12060f;
    --card: #1d0c1a;
    --ink: #fbe6f1;
    --muted: #c099b6;
    --line: #3a1a35;
    --body-1: #5b1d66;
    --body-2: #34113b;
    --pink: #ff5c9e;
    --paper: #f8f1f5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--stage);
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .card {
    width: 100%; max-width: 350px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 26px 50px -30px rgba(74, 23, 82, .55);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  .bill-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 17px; }
  .table { font-size: 12px; color: var(--muted); text-align: right; }
  .bill { margin: 0 0 12px; padding: 0; list-style: none; font-size: 13.5px; }
  .bill li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dotted var(--line); animation: rowIn .5s var(--spring) backwards; }
  .bill li:nth-child(2) { animation-delay: .07s; }
  .bill li:nth-child(3) { animation-delay: .14s; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } }

  fieldset { border: 0; margin: 0 0 14px; padding: 0; }
  legend { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tips label { position: relative; }
  .tips input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .tips span {
    display: block; text-align: center;
    padding: 8px 4px; border-radius: 12px;
    border: 1.5px solid var(--line);
    font-size: 13px; font-weight: 700;
    transition: transform .4s var(--spring), background .2s, color .2s, border-color .2s;
  }
  .tips label:hover span { transform: translateY(-2px); border-color: var(--pink); }
  .tips input:checked + span { background: var(--ink); color: var(--card); border-color: var(--ink); animation: chosen .4s var(--spring); }
  @keyframes chosen { 40% { transform: scale(1.08); } }
  .tips input:focus-visible + span { outline: 3px solid var(--pink); outline-offset: 2px; }

  /* ---------- The reader button ---------- */
  .swipe {
    position: relative; z-index: 2;
    width: 100%; height: 78px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px 0 10px;
    border: 0; border-radius: 20px;
    background: linear-gradient(160deg, var(--body-1), var(--body-2));
    color: #fff;
    font: inherit; text-align: left;
    cursor: pointer;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 14px 26px -16px var(--body-1);
    transition: box-shadow .3s, transform .45s var(--spring);
    -webkit-tap-highlight-color: transparent;
  }
  .swipe:not([aria-disabled]):hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 20px 30px -16px var(--body-1); }
  .swipe:not([aria-disabled]):active { transform: scale(.97); transition-duration: .08s; }
  .swipe.press { animation: squash .35s var(--spring); }
  @keyframes squash { 35% { transform: scale(1.03, .88); } 70% { transform: scale(.99, 1.03); } }
  .swipe:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  .swipe[aria-disabled="true"] { cursor: default; }
  .swipe[data-state="ok"] { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 0 0 3px rgba(52, 211, 153, .5), 0 14px 30px -12px rgba(52, 211, 153, .6); }
  .swipe::after { /* ripple on approval */
    content: ""; position: absolute; left: 40px; top: 50%; width: 40px; height: 40px; margin-top: -20px;
    border-radius: 50%; background: rgba(52, 211, 153, .45); transform: scale(0); opacity: 0;
  }
  .swipe[data-state="ok"]::after { animation: ripple .8s ease-out; }
  @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(10); opacity: 0; } }

  /* Slot area: a card passes through the dark slit */
  .slotbox { position: relative; flex: none; width: 78px; height: 58px; border-radius: 14px; background: rgba(0, 0, 0, .25); overflow: hidden; }
  .card-ico {
    position: absolute; left: 3px; top: 16px;
    width: 38px; height: 26px; border-radius: 4px;
    background: linear-gradient(135deg, var(--pink), #ff9a5c);
    box-shadow: 0 2px 4px rgba(0, 0, 0, .35);
    transition: transform .45s var(--spring);
  }
  .card-ico::before { /* magnetic stripe */
    content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 5px; background: #2a0f2e; opacity: .7;
  }
  .card-ico::after { /* chip */
    content: ""; position: absolute; left: 5px; bottom: 4px; width: 8px; height: 6px; border-radius: 1.5px; background: #fde68a;
  }
  .swipe:not([aria-disabled]):hover .card-ico { transform: translateX(4px) rotate(-6deg); }
  .slit {
    position: absolute; left: 41px; top: 6px; width: 7px; height: 46px; border-radius: 4px;
    background: #12050f;
    box-shadow: inset 1px 0 0 rgba(255, 255, 255, .25), 2px 0 0 rgba(255, 255, 255, .06);
    transition: box-shadow .2s;
  }
  .swipe[data-state="read"] .slit { box-shadow: inset 1px 0 0 rgba(255, 255, 255, .25), 0 0 10px var(--amber); }
  /* Anticipation: card lifts back; then the fast swipe with a stretch */
  .swipe[data-state="ready"] .card-ico { transform: translateX(-6px) rotate(8deg) scale(1.05); }
  .swipe[data-state="read"] .card-ico { animation: swipe .75s cubic-bezier(.6, 0, .25, 1) forwards; }
  .swipe[data-state="auth"] .card-ico, .swipe[data-state="ok"] .card-ico { opacity: 0; transform: translateX(42px); }
  @keyframes swipe {
    0% { transform: translateX(-6px) rotate(8deg); }
    45% { transform: translateX(14px) scaleX(1.25) rotate(0); }
    80% { transform: translateX(42px) scaleX(1); opacity: 1; }
    100% { transform: translateX(46px); opacity: 0; }
  }

  .text { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .label { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .label.swap { animation: swap .35s var(--spring); }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } }
  .label svg { flex: none; width: 18px; height: 18px; }
  .label svg path { stroke-dasharray: 22; stroke-dashoffset: 0; animation: draw .4s ease-out; }
  @keyframes draw { from { stroke-dashoffset: 22; } }
  .sub { font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .auth { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .18); overflow: hidden; margin-top: 4px; opacity: 0; transition: opacity .2s; }
  .auth i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--amber), var(--green)); }
  .swipe[data-state="auth"] .auth { opacity: 1; }
  .swipe[data-state="auth"] .auth i { width: 100%; transition: width 1.1s cubic-bezier(.5, 0, .3, 1); }
  @media (max-width: 380px) {
    .swipe { gap: 9px; padding-right: 12px; }
    .label { font-size: 15.5px; }
    .sub { font-size: 11px; }
  }

  /* Three status lights */
  .leds { flex: none; display: flex; gap: 5px; }
  .leds i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .2); transition: background .2s, box-shadow .2s; }
  .swipe:not([aria-disabled]):hover .leds i { animation: shimmer 1.2s ease-in-out infinite; }
  .swipe:not([aria-disabled]):hover .leds i:nth-child(2) { animation-delay: .15s; }
  .swipe:not([aria-disabled]):hover .leds i:nth-child(3) { animation-delay: .3s; }
  @keyframes shimmer { 50% { background: rgba(255, 255, 255, .55); } }
  .swipe[data-state="read"] .leds i, .swipe[data-state="auth"] .leds i { animation: led .4s ease-in-out infinite alternate; }
  .swipe[data-state="read"] .leds i:nth-child(2), .swipe[data-state="auth"] .leds i:nth-child(2) { animation-delay: .13s; }
  .swipe[data-state="read"] .leds i:nth-child(3), .swipe[data-state="auth"] .leds i:nth-child(3) { animation-delay: .26s; }
  .swipe[data-state="ok"] .leds i { background: var(--green); box-shadow: 0 0 8px var(--green); animation: on .4s var(--spring) backwards; }
  .swipe[data-state="ok"] .leds i:nth-child(2) { animation-delay: .1s; }
  .swipe[data-state="ok"] .leds i:nth-child(3) { animation-delay: .2s; }
  @keyframes led { to { background: var(--amber); box-shadow: 0 0 8px var(--amber); } }
  @keyframes on { from { transform: scale(0); } }

  /* ---------- Receipt tray under the button ---------- */
  .tray {
    position: relative; z-index: 1;
    height: 104px; margin: -10px 18px 0;
    border: 1.5px dashed var(--line); border-top: 0;
    border-radius: 0 0 14px 14px;
    overflow: hidden;
  }
  .tray-hint { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 10px; font-size: 12px; color: var(--muted); transition: opacity .2s; }
  .receipt {
    position: absolute; left: 10px; right: 10px; top: 0;
    padding: 18px 12px 14px;
    background: var(--paper); color: #2a0f2e;
    font: 12px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    transform: translateY(-105%);
    transform-origin: 50% 0;
    -webkit-mask: radial-gradient(6px at 6px 100%, transparent 98%, #000) -6px 0 / 12px 100% repeat-x;
    mask: radial-gradient(6px at 6px 100%, transparent 98%, #000) -6px 0 / 12px 100% repeat-x;
  }
  .receipt b { display: block; text-align: center; letter-spacing: .14em; }
  .receipt div { display: flex; justify-content: space-between; }
  .tray.print .receipt { transform: translateY(0); transition: transform 1.1s steps(9, end); }
  .tray.tear .receipt { animation: tear .7s ease-in forwards; }
  @keyframes tear {
    0% { transform: translateY(0); }
    25% { transform: translateY(4px) rotate(-2deg); }
    100% { transform: translate(60px, 50px) rotate(18deg); opacity: 0; }
  }
  .tray.print .tray-hint, .tray.tear .tray-hint { opacity: 0; }

  .bit { position: fixed; z-index: 30; width: 7px; height: 11px; margin: -5px 0 0 -3px; border-radius: 2px; pointer-events: none; }
  .bit.round { width: 8px; height: 8px; border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="billTitle">
    <div class="bill-head">
      <h1 id="billTitle">Kehwa House</h1>
      <span class="table">Table 6 · F-7, Islamabad</span>
    </div>
    <ul class="bill">
      <li><span>Karak chai ×2</span><span>Rs 500</span></li>
      <li><span>Club sandwich</span><span>Rs 1,050</span></li>
      <li><span>Masala fries</span><span>Rs 600</span></li>
    </ul>

    <fieldset>
      <legend>Add a tip?</legend>
      <div class="tips">
        <label><input type="radio" name="tip" value="0" checked><span>No tip</span></label>
        <label><input type="radio" name="tip" value="5"><span>5%</span></label>
        <label><input type="radio" name="tip" value="10"><span>10%</span></label>
      </div>
    </fieldset>

    <button class="swipe" id="swipe" type="button" data-state="idle">
      <span class="slotbox" aria-hidden="true"><span class="card-ico"></span><span class="slit"></span></span>
      <span class="text">
        <span class="label" id="label">Pay Rs 2,150</span>
        <span class="sub" id="sub">Tap to swipe your card</span>
        <span class="auth" aria-hidden="true"><i></i></span>
      </span>
      <span class="leds" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>

    <div class="tray" id="tray">
      <span class="tray-hint" aria-hidden="true">Your receipt prints here</span>
      <div class="receipt" id="receipt" aria-hidden="true">
        <b>APPROVED</b>
        <div><span>Kehwa House</span><span id="rTime">--:--</span></div>
        <div><span>Total</span><span id="rTotal">Rs 2,150</span></div>
        <div><span>Ref</span><span id="rRef">000000</span></div>
      </div>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const BILL = 2150;
    const btn = document.getElementById("swipe");
    const label = document.getElementById("label");
    const sub = document.getElementById("sub");
    const tray = document.getElementById("tray");
    const live = document.getElementById("live");
    const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const money = (n) => "Rs " + n.toLocaleString("en-US");
    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 100) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps the receipt readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const total = () => BILL + Math.round((BILL * Number(document.querySelector('input[name="tip"]:checked').value)) / 100);
    const state = (s) => btn.setAttribute("data-state", s);

    function setLabel(text, small, withCheck) {
      label.textContent = text;
      if (withCheck) label.insertAdjacentHTML("afterbegin", CHECK);
      sub.textContent = small;
      replay(label, "swap");
    }
    function paintIdle() { setLabel("Pay " + money(total()), "Tap to swipe your card"); }

    // Confetti from the slot side of the button
    function confetti(n) {
      if (RM || !btn.animate) return;
      const r = btn.getBoundingClientRect();
      const colors = ["#ff3d8b", "#34d399", "#fbbf24", "#ffffff", "#a855f7"];
      for (let i = 0; i < n; i++) {
        const b = document.createElement("i");
        b.className = "bit" + (i % 3 ? "" : " round");
        b.style.left = r.left + 50 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = colors[i % colors.length];
        document.body.appendChild(b);
        const a = -Math.PI / 2 + (Math.random() - 0.3) * 2.4;
        const d = 70 + Math.random() * 80;
        const x = Math.cos(a) * d, y = Math.sin(a) * d, spin = (Math.random() - 0.5) * 900;
        b.animate([
          { transform: "translate(0,0) scale(.3)", opacity: 1 },
          { transform: `translate(${x}px,${y}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(${x * 1.2}px,${y + 110}px) rotate(${spin}deg) scale(.7)`, opacity: 0 }
        ], { duration: 1200 + Math.random() * 400, easing: "cubic-bezier(.15,.7,.35,1)" }).onfinish = () => b.remove();
      }
    }

    // Tip changes the amount on the button (only while idle)
    document.querySelectorAll('input[name="tip"]').forEach((r) => {
      r.addEventListener("change", () => { if (btn.getAttribute("data-state") === "idle") paintIdle(); });
    });

    btn.addEventListener("click", async () => {
      if (btn.getAttribute("data-state") !== "idle") return;
      const amount = total();
      btn.setAttribute("aria-disabled", "true");
      tray.classList.remove("tear", "print");

      // 1. Anticipation: squash, the card lifts back
      replay(btn, "press");
      state("ready");
      setLabel("Get ready…", "Card lining up");
      await wait(380);
      // 2. Swipe through the slot
      state("read");
      setLabel("Reading…", "Keep it steady");
      live.textContent = "Reading your card.";
      await wait(800);
      // 3. Progress: authorising bar fills while the lights chase
      state("auth");
      setLabel("Authorising", "Talking to your bank");
      await wait(1150);

      // 4. Approved: green lights, ripple, confetti, receipt prints
      const now = new Date();
      const ref = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById("rTime").textContent = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
      document.getElementById("rTotal").textContent = money(amount);
      document.getElementById("rRef").textContent = ref;
      state("ok");
      setLabel("Paid " + money(amount), "Approved · ref " + ref, true);
      confetti(22);
      tray.classList.add("print");
      live.textContent = "Approved. " + money(amount) + " paid. Reference " + ref + ".";
      await hold(3000);

      // 5. Tear off the receipt, then reset
      tray.classList.remove("print");
      tray.classList.add("tear");
      await wait(700);
      tray.classList.remove("tear");
      state("idle");
      btn.removeAttribute("aria-disabled");
      paintIdle();
    });

    paintIdle();
  })();
</script>
</body>
</html>
