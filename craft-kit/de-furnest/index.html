<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Furnest look: soft neumorphic surfaces; the accent colour morphs to the chosen pet ================= */
@property --ph{syntax:'<number>';inherits:true;initial-value:262}
:root{--ph:262;--font:"Quicksand","Varela Round","Nunito","Segoe UI",system-ui,sans-serif;--rb:16px;--ri:14px;--rm:26px;--rp:18px;transition:--ph .8s ease;
--bg:#e9ecf3;--surface:#e9ecf3;--surface-solid:#f2f4f9;--surface2:#e1e5ee;--line:#d3d9e4;--text:#2c3146;--muted:#6f7590;--hover:rgba(60,70,110,.06);--field:#f4f6fa;
--accent:hsl(var(--ph) 68% 58%);--accent2:hsl(var(--ph) 75% 90%);--on-accent:#fff;--ok:#2fa57a;--warn:#d99418;--danger:#e0546b;--info:#5a7ae6;
--c1:hsl(var(--ph) 68% 58%);--c2:#ff9b6a;--c3:#4fb8c9;--c4:#f2c14e;--c5:#9a7bf0;--c6:#78c27a;
--n1:7px 7px 16px #c8ccd8,-7px -7px 16px #ffffff;--n2:inset 5px 5px 10px #c8ccd8,inset -5px -5px 10px #ffffff;--n3:3px 3px 8px #c8ccd8,-3px -3px 8px #ffffff}
[data-theme="dark"]{--bg:#22252f;--surface:#22252f;--surface-solid:#272b36;--surface2:#1d2029;--line:#323745;--text:#e6e9f4;--muted:#9aa0b8;--hover:rgba(255,255,255,.05);--field:#1d2029;
--accent:hsl(var(--ph) 75% 68%);--accent2:hsl(var(--ph) 35% 26%);--on-accent:#141622;--ok:#5fd6a5;--warn:#f2bb4a;--danger:#ff7a8c;--info:#8aa2ff;
--c1:hsl(var(--ph) 75% 68%);--c2:#ffad85;--c3:#6fd0df;--c4:#f7d26e;--c5:#b9a2ff;--c6:#93d896;
--n1:7px 7px 16px #171920,-7px -7px 16px #2d313e;--n2:inset 5px 5px 10px #171920,inset -5px -5px 10px #2d313e;--n3:3px 3px 8px #171920,-3px -3px 8px #2d313e;--toast-bg:#323745}
body{font-weight:500}
h1,h2,h3{font-weight:700}
.btn{border:0;box-shadow:var(--n3);background:var(--surface);font-weight:700}
.btn:hover{box-shadow:var(--n1)}
.btn:active{box-shadow:var(--n2);transform:none}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 20px -10px var(--accent)}
.btn.ghost{box-shadow:none;background:transparent}
.chip{border:0;box-shadow:var(--n3);color:var(--text)}
.chip[aria-pressed="true"]{box-shadow:var(--n2);background:var(--surface);color:var(--accent)}
.segc{background:var(--surface);box-shadow:var(--n2)}
.segc button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--n3);color:var(--accent)}
.search{border:0;box-shadow:var(--n2);background:var(--surface)}
.fld input,.fld select,.fld textarea,.inp{border:0;box-shadow:var(--n2);background:var(--surface)}
.modal,.drawer,.pop{border:0;background:var(--surface-solid)}
.app{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:100vh}
/* Neumorphic sidebar: raised links, the active one sits pressed in a sliding groove */
.side{position:sticky;top:0;height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:20px;overflow:auto;z-index:40;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.01em;padding:0 4px}
.brand .bl{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;box-shadow:var(--n1);color:var(--accent)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.nav{position:relative;display:grid;gap:8px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;transition:color .3s}
.nav a .ic{width:20px;height:20px}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--accent)}
.nav-marker{position:absolute;left:0;right:0;top:0;border-radius:16px;box-shadow:var(--n2);transition:transform .5s cubic-bezier(.3,1.3,.5,1),height .3s;pointer-events:none}
.family{margin-top:auto;padding:14px;border-radius:20px;box-shadow:var(--n1);font-size:12.5px;display:grid;gap:8px}
.family b{font-size:13.5px}
.family .row{display:flex}
.family .row .av{margin-right:-8px;border:3px solid var(--bg)}
.main-wrap{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .sp{flex:1}
.top .icon-btn{box-shadow:var(--n3);border-radius:14px;width:40px;height:40px}
.switcher{display:flex;gap:10px;align-items:center}
.pbtn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:0;border-radius:99px;background:var(--surface);box-shadow:var(--n3);font-weight:700;font-size:13px;color:var(--muted);transition:box-shadow .3s,color .3s}
.pbtn svg{width:34px;height:34px;border-radius:50%;background:var(--surface2)}
.pbtn[aria-pressed="true"]{box-shadow:var(--n2);color:var(--text)}
.menu-btn{display:none}
main{padding:8px 24px 46px;outline:none}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.ph h1{font-size:28px;letter-spacing:-.02em}
.ph p{color:var(--muted);margin-top:4px}
.ph-a{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g{display:grid;gap:20px;margin-bottom:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.card{background:var(--surface);border-radius:26px;padding:18px;min-width:0;box-shadow:var(--n1);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-3px)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:16px}
.ch p{font-size:12.5px;color:var(--muted)}
.well{border-radius:18px;box-shadow:var(--n2);padding:12px}
/* Hero pet (signature) */
.hero{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent2),transparent 70%);pointer-events:none}
.stagepet{width:230px;height:200px;border-radius:24px;box-shadow:var(--n2);display:grid;place-items:end center;overflow:hidden;background:radial-gradient(circle at 50% 110%,var(--accent2),transparent 70%)}
.stagepet svg{width:210px;height:190px;animation:petIn .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes petIn{from{transform:translateY(40px) scale(.7);opacity:0}}
.pet .tail{transform-box:fill-box;animation:wag .5s ease-in-out infinite alternate}
.pet.cat .tail{transform-origin:0% 100%;animation:swish 2.2s ease-in-out infinite alternate}
.pet.dog .tail{transform-origin:0% 100%}
.pet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.pet .earL,.pet .earR{transform-box:fill-box;animation:twitch 6s infinite}
.pet .earL{transform-origin:100% 0}.pet .earR{transform-origin:0 0;animation-delay:-3s}
.pet .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
@keyframes swish{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twitch{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}94%{transform:rotate(4deg)}}
@keyframes breathe{50%{transform:scaleY(1.03)}}
.hero-info h2{font-size:30px;letter-spacing:-.02em}
.hero-info p{color:var(--muted)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.stat{padding:10px 14px;border-radius:16px;box-shadow:var(--n2);min-width:96px}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px}
.mood{display:flex;gap:4px;margin-top:4px}
.mood i{width:16px;height:8px;border-radius:4px;background:var(--surface2);box-shadow:var(--n2)}
.mood i.on{background:var(--accent);box-shadow:none}
/* Care checklist */
.carelist{display:grid;gap:10px}
.cpet{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.cpet .mini{width:42px;height:42px;border-radius:50%;box-shadow:var(--n3);overflow:hidden;background:var(--surface2)}
.cpet .mini svg{width:42px;height:42px}
.tasks{display:flex;gap:6px;flex-wrap:wrap}
.task{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:0;border-radius:99px;background:var(--surface);box-shadow:var(--n3);font-size:12px;font-weight:700;color:var(--muted);transition:box-shadow .25s,color .25s,background .25s}
.task .tk{width:16px;height:16px;border-radius:50%;box-shadow:var(--n2);display:grid;place-items:center;color:transparent}
.task .tk .ic{width:11px;height:11px;stroke-width:3}
.task[aria-pressed="true"]{box-shadow:var(--n2);color:var(--text)}
.task[aria-pressed="true"] .tk{background:var(--pc,var(--accent));color:#fff;box-shadow:none;animation:pop .4s}
@keyframes pop{50%{transform:scale(1.4)}}
/* Lists */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;box-shadow:var(--n3)}
.li .grow{flex:1;min-width:0}.li b{display:block;font-size:13.5px}.li small{display:block;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:6px}
/* Pets page */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.pcard .art{height:170px;border-radius:20px;box-shadow:var(--n2);display:grid;place-items:end center;overflow:hidden;margin-bottom:14px;background:radial-gradient(circle at 50% 120%,hsl(var(--h) 80% 85% / .7),transparent 70%)}
[data-theme="dark"] .pcard .art{background:radial-gradient(circle at 50% 120%,hsl(var(--h) 40% 30% / .8),transparent 70%)}
.pcard .art svg{width:180px;height:160px}
.pcard h3{font-size:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
/* Health */
.vax{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px}
.vbar{position:relative;height:12px;border-radius:8px;box-shadow:var(--n2)}
.vbar i{position:absolute;top:2px;bottom:2px;left:2px;width:calc(var(--w) - 4px);border-radius:6px;background:var(--vc);animation:hbw 1s both}
.sym{display:flex;gap:10px;align-items:flex-start}
.sev{display:inline-flex;gap:3px}
.sev i{width:8px;height:14px;border-radius:3px;background:var(--surface2)}
.sev i.on{background:var(--danger)}
/* Week care grid */
.cgrid-wrap{overflow-x:auto}
.cgrid{display:grid;grid-template-columns:150px repeat(7,minmax(46px,1fr));gap:8px;min-width:560px;align-items:center}
.cgrid .hd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cgrid .hd.today{color:var(--accent)}
.cgrid .rl{font-size:13px;font-weight:700}
.cell{height:38px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--n3);display:grid;place-items:center;color:transparent;transition:box-shadow .2s,background .2s}
.cell[aria-pressed="true"]{box-shadow:var(--n2);color:var(--accent)}
.cell.fut{opacity:.4;cursor:not-allowed}
/* Settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}.set-row b{display:block}.set-row small{color:var(--muted)}
.switch{position:relative;width:50px;height:28px;border-radius:99px;border:0;background:var(--surface);box-shadow:var(--n2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .3s}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent)}
.plan{background:linear-gradient(135deg,var(--accent),hsl(calc(var(--ph) + 40) 70% 60%));color:#fff}
.plan .btn{background:#fff;color:#2c3146;box-shadow:none}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}.switcher .pbtn span{display:none}.switcher .pbtn{padding:5px}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-104%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}body.nav-open .side{transform:none;box-shadow:var(--n1)}.scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(20,22,30,.35);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top,main{padding-left:14px;padding-right:14px}.hero{grid-template-columns:minmax(0,1fr)}.stagepet{width:100%}}
@media (max-width:560px){.top [data-cmdk]{display:none}.top{gap:6px}.g4,.g2{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:23px}.hero-info h2{font-size:24px}.cpet{grid-template-columns:auto 1fr}.cpet>.ring,.cpet>svg:last-child{display:none}.vrow{grid-template-columns:90px 1fr}.vrow>span:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><span class="bl"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 23c-5 0-8-2.5-8-6 0-4 4-7 8-7s8 3 8 7c0 3.5-3 6-8 6z" fill="currentColor"/><circle cx="5" cy="9" r="2.6" fill="currentColor"/><circle cx="21" cy="9" r="2.6" fill="currentColor"/><circle cx="9.5" cy="4.6" r="2.4" fill="currentColor"/><circle cx="16.5" cy="4.6" r="2.4" fill="currentColor"/><path d="M10 16.5c1.5 1.4 4.5 1.4 6 0" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><div>Furnest<small>Pet health at home</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker"></span></nav>
    <div class="family"><b id="homeName">The Mirza home</b><div class="row" id="famRow"></div><span class="muted" id="famTxt"></span></div>
  </aside>
  <div class="scrim" data-scrim></div>
  <div class="main-wrap">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="side"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="switcher" id="switcher" role="group" aria-label="Choose a pet"></div>
      <span class="sp"></span>
      <button type="button" class="icon-btn" data-cmdk aria-label="Search (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg></button>
      <button type="button" class="icon-btn" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = n => (n < 0 ? '-$' : '$') + num(Math.abs(n));
const short = n => { const a = Math.abs(n), s = (v, u) => (Math.round(v * 10) / 10).toString() + u; return a >= 1e9 ? s(n / 1e9, 'B') : a >= 1e6 ? s(n / 1e6, 'M') : a >= 1e3 ? s(n / 1e3, 'K') : String(Math.round(n * 10) / 10); };
const pct = n => (n > 0 ? '+' : '') + dec(n, 1) + '%';
const FMT = { num, rs, usd, usd0, short, pct, dec1: n => dec(n, 1), raw: n => String(Math.round(n)), rsShort: n => 'Rs ' + short(n), pctPlain: n => Math.round(n) + '%', usdShort: n => '$' + short(n) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pdate = s => { if (s instanceof Date) return s; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fdate = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fday = s => { const d = pdate(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fshort = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dayDiff = (a, b) => Math.round((pdate(a) - pdate(b)) / 864e5);
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60) % 24, m = min % 60; return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : Math.floor(s / 86400) + ' d ago'; };

/* Storage that never breaks when the browser blocks it */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* Icons: simple stroke drawings, 24x24 */
const ICONS = {
  home: 'M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10', cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', users: 'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3-6 7-6s7 2 7 6M16 3.5a4 4 0 010 7.5M18 15c2.5.7 4 2.6 4 6',

/* Little inline charts that return HTML strings */
function sparkSVG(d, { w = 110, h = 34, color = 'var(--accent)', tipText } = {}) {
  if (!d || !d.length) return '';
  const lo = Math.min(...d), hi = Math.max(...d), r = hi - lo || 1, id = 'sp' + (++GID);
  const p = d.map((v, i) => [d.length === 1 ? w / 2 : 2 + i * (w - 4) / (d.length - 1), h - 3 - (v - lo) / r * (h - 6)]), path = smoothPath(p);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" data-tip="${esc(tipText || `Low ${short(lo)} · High ${short(hi)}`)}" role="img" aria-label="Trend"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path d="${path}L${w - 2},${h}L2,${h}Z" fill="url(#${id})" class="area"/><path d="${path}" class="line draw" pathLength="1" style="stroke:${color}"/></svg>`;
}
function ringSVG(p, { size = 56, thick = 6, color = 'var(--accent)', tipText } = {}) {
  const r = (size - thick) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" ${tipText ? `data-tip="${esc(tipText)}" role="img" aria-label="${esc(tipText)}"` : 'aria-hidden="true"'}><circle r="${r}" cx="${size / 2}" cy="${size / 2}" class="ring-bg" style="stroke-width:${thick}"/><circle r="${r}" cx="${size / 2}" cy="${size / 2}" class="ring-fg" transform="rotate(-90 ${size / 2} ${size / 2})" style="stroke:${color};stroke-width:${thick};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${(c * (1 - clamp(p, 0, 1))).toFixed(2)};--c:${c.toFixed(2)}"/></svg>`;
}
function gaugeSVG(p, { w = 180, thick = 14, color = 'var(--accent)', tipText } = {}) {
  const r = (w - thick) / 2, h = r + thick, c = Math.PI * r, d = `M${thick / 2},${r + thick / 2} A${r},${r} 0 0 1 ${w - thick / 2},${r + thick / 2}`;
  return `<svg class="gauge" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" ${tipText ? `data-tip="${esc(tipText)}" role="img" aria-label="${esc(tipText)}"` : 'aria-hidden="true"'}><path d="${d}" class="ring-bg" style="stroke-width:${thick}"/><path d="${d}" class="ring-fg" style="stroke:${color};stroke-width:${thick};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${(c * (1 - clamp(p, 0, 1))).toFixed(2)};--c:${c.toFixed(2)}"/></svg>`;
}
/* Horizontal bars as HTML */
const hbars = (list, f = num, color = 'var(--accent)') => { const mx = Math.max(1, ...list.map(x => x.value)); return `<div class="hbars">${list.map((x, i) => `<div class="hb" data-tip="${esc(x.label)}: ${esc(f(x.value))}"><span class="hb-l">${esc(x.label)}</span><span class="hb-t"><i style="--w:${(x.value / mx * 100).toFixed(1)}%;--i:${i};background:${x.color || color}"></i></span><b>${esc(f(x.value))}</b></div>`).join('')}</div>`; };
/* Heatmap grid as HTML: rows x cols, values 0..max */
function heatHTML(rows, cols, val, { f = num, color = 'var(--accent)', label = '' } = {}) {
  let mx = 1; rows.forEach((_, r) => cols.forEach((_, c) => { mx = Math.max(mx, val(r, c)); }));
  return `<div class="heat" style="--cols:${cols.length}" role="img" aria-label="${esc(label || 'Heatmap')}"><span></span>${cols.map(c => `<span class="hx">${esc(c)}</span>`).join('')}${rows.map((rw, r) => `<span class="hy">${esc(rw)}</span>${cols.map((c, ci) => { const v = val(r, ci); return `<i style="--a:${(0.08 + 0.92 * v / mx).toFixed(2)};--i:${r + ci};background:${color}" data-tip="${esc(rw)} · ${esc(c)}: ${esc(f(v))}"></i>`; }).join('')}`).join('')}</div>`;
}

  barChart($('#ex', el), { labels: ms.map(m => m.l), stacked: true, h: 240, fmt: v => '$' + short(v), tfmt: usd, series: ECATS.map(c => ({ name: c, color: ECOL[c], data: ms.map(m => +sum(D.exp.filter(e => e.date.slice(0, 7) === m.k && e.cat === c).map(e => e.amt)).toFixed(2)) })) });
  donut($('#ep', el), { data: D.pets.map(p => ({ label: p.name, value: +sum(D.exp.filter(e => e.pet === p.id && e.date >= iso(addDays(TODAY, -365))).map(e => e.amt)).toFixed(2), color: pcol(p) })), size: 140, thick: 18, fmt: usd, center: { value: yr, label: 'per year', fmt: 'usdShort' } });
  makeTable($('#et', el), { rows: () => D.exp.slice().sort((a, b) => b.date.localeCompare(a.date)).map(e => ({ ...e, ref: e, pn: pet(e.pet).name })), unit: 'expense', units: 'expenses', ph: 'Search expenses…', keys: ['what', 'cat', 'pn'], pageSize: 8, chips: { k: 'cat', opts: ['All', ...ECATS] },
    cols: [{ k: 'date', label: 'Date', f: v => fshort(v) }, { k: 'what', label: 'What', f: v => `<b>${esc(v)}</b>` }, { k: 'pn', label: 'Pet', f: (v, r) => `<span class="dot" style="--pc:${pcol(pet(r.pet))}"></span>${esc(v)}` }, { k: 'cat', label: 'Category' }, { k: 'amt', label: 'Amount', num: true, f: v => usd(v) }, { k: 'x', label: '', sort: false, f: () => `<button type="button" class="btn sm ghost" data-act="del" aria-label="Delete">${ic('trash')}</button>` }],
    onAct: (a, r) => confirmBox(`Delete "${r.what}" (${usd(r.amt)})?`, () => { D.exp = D.exp.filter(x => x !== r.ref); save(); toast('Expense deleted', 'warn'); refresh(); }) });
}

/* ---------- Page: Settings ---------- */
function pSettings(el) {
  const sw = (k, l, s) => `<div class="set-row"><div><b>${l}</b><small>${s}</small></div><button type="button" class="switch" role="switch" data-sw="${k}" aria-checked="${!!D.set[k]}" aria-label="${l}"></button></div>`;
  el.innerHTML = `<div class="ph" data-rise><div><h1>Home settings</h1><p>Family, reminders, plan and demo data</p></div></div><div class="g g2"><section class="card"><div class="ch"><h2>The home</h2></div><form class="frm" id="hf" novalidate>${fieldHTML({ k: 'name', label: 'Home name', req: true }, D.home.name)}${fieldHTML({ k: 'members', label: 'People (comma separated)', req: true }, D.home.members.join(', '))}${fieldHTML({ k: 'budget', label: 'Monthly budget ($)', type: 'number', min: 0, max: 100000 }, D.home.budget)}<div><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card plan"><p>Your plan</p><h2 style="font-size:28px;margin:6px 0">Furnest ${esc(D.plan)}</h2><p>${D.plan === 'Family' ? 'Up to 6 pets and 5 people · $3.99 a month' : 'One pet · free forever'}</p><div class="ph-a" style="margin-top:14px"><button type="button" class="btn" data-a="plan">${D.plan === 'Family' ? 'Switch to Free' : 'Upgrade to Family'}</button></div></section></div>
  <section class="card">${sw('remind', 'Care reminders', 'A nudge when a task is still open at 8 PM')}${sw('share', 'Share with family', 'Everyone in the home can tick tasks')}${sw('weekly', 'Weekly vet summary', 'Email a summary every Sunday')}<div class="set-row"><div><b>Theme</b><small>Soft light or soft dark. ?theme=dark works too.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back Bruno, Coco and Mishi</small></div><button type="button" class="btn" data-a="reset" style="color:var(--danger)">${ic('refresh')}Reset</button></div></section>`;
  syncThemeBtns();
  el.addEventListener('click', e => { const s = e.target.closest('[data-sw]'); if (!s) return; D.set[s.dataset.sw] = !D.set[s.dataset.sw]; s.setAttribute('aria-checked', String(D.set[s.dataset.sw])); save(); toast(`${s.getAttribute('aria-label')} ${D.set[s.dataset.sw] ? 'on' : 'off'}`); });
  $('#hf', el).onsubmit = e => { e.preventDefault(); const f = e.target, n = f.elements.name, m = f.elements.members; let ok = true; [n, m].forEach(x => { x.removeAttribute('aria-invalid'); $('#' + x.id + '-e').textContent = ''; }); if (!n.value.trim()) { n.setAttribute('aria-invalid', 'true'); $('#' + n.id + '-e').textContent = 'Give the home a name'; ok = false; } const mem = m.value.split(',').map(x => x.trim()).filter(Boolean); if (!mem.length) { m.setAttribute('aria-invalid', 'true'); $('#' + m.id + '-e').textContent = 'Add at least one person'; ok = false; } if (!ok) return; D.home = { name: n.value.trim(), members: mem, budget: +f.elements.budget.value || 0 }; save(); paintSwitcher(); toast('Home saved'); };
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'home', label: 'Home', icon: 'home', render: pHome }, { id: 'pets', label: 'Pets', icon: 'paw', render: pPets }, { id: 'health', label: 'Health', icon: 'heart', render: pHealth }, { id: 'care', label: 'Care', icon: 'check', render: pCare },
  { id: 'visits', label: 'Vet visits', icon: 'cal', render: pVisits }, { id: 'activity', label: 'Activity', icon: 'activity', render: pActivity }, { id: 'expenses', label: 'Expenses', icon: 'wallet', render: pExpenses }, { id: 'settings', label: 'Settings', icon: 'gear', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}">${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
document.addEventListener('click', e => {
  const t = e.target;
  const pb = t.closest('[data-pet]'); if (pb) { const go = pb.dataset.go; if (go) { setPet(pb.dataset.pet, true); ROUTER.go(go); } else setPet(pb.dataset.pet); return; }
  const cr = t.closest('[data-care]'); if (cr) { const [pid, r] = cr.dataset.care.split('|'), day = D.care[pid][iso(TODAY)]; day[r] = !day[r]; save(); const p = pet(pid); if (Object.values(day).every(Boolean)) { toast(`All done for ${p.name} today! 🎉`); addNote(`${p.name}'s care is complete for today`, 'ok'); } else toast(day[r] ? `${r} done for ${p.name}` : `${r} unticked`); refresh(); return; }
  const cg = t.closest('[data-cg]'); if (cg) { const [d, r] = cg.dataset.cg.split('|'), p = cur(); D.care[p.id][d] = D.care[p.id][d] || {}; D.care[p.id][d][r] = !D.care[p.id][d][r]; save(); cg.setAttribute('aria-pressed', String(D.care[p.id][d][r])); toast(`${r} on ${fday(d)}: ${D.care[p.id][d][r] ? 'done' : 'not done'}`); return; }
  const vg = t.closest('[data-vgive]'); if (vg) { const v = D.vax.find(x => x.id === vg.dataset.vgive); v.given = iso(TODAY); v.due = iso(addDays(TODAY, v.every)); D.exp.push({ id: uid(), date: iso(TODAY), cat: 'Vet', pet: v.pet, what: v.name + ' vaccine', amt: 28 }); save(); toast(`${v.name} recorded for ${pet(v.pet).name}. Next due ${fdate(v.due)}`); refresh(); return; }
  const rf = t.closest('[data-refill]'); if (rf) { const m = D.meds.find(x => x.id === rf.dataset.refill); m.left = m.per; D.exp.push({ id: uid(), date: iso(TODAY), cat: 'Medicine', pet: m.pet, what: m.name + ' refill', amt: +rand(8, 30).toFixed(2) }); save(); toast(`${m.name} refilled`); refresh(); return; }
  const ds = t.closest('[data-dose]'); if (ds) { const m = D.meds.find(x => x.id === ds.dataset.dose); if (!m.left) { toast('None left. Refill first.', 'err'); return; } m.left--; save(); toast(`${m.name} given to ${pet(m.pet).name} · ${m.left} left`); if (m.left / m.per < .2) addNote(`${m.name} is running low (${m.left} left)`, 'warn'); refresh(); return; }
  const md = t.closest('[data-mdel]'); if (md) { const m = D.meds.find(x => x.id === md.dataset.mdel); confirmBox(`Stop ${m.name} for ${pet(m.pet).name}?`, () => { D.meds = D.meds.filter(x => x !== m); save(); toast('Medicine removed', 'warn'); refresh(); }, { yes: 'Remove' }); return; }
  const sd = t.closest('[data-sdel]'); if (sd) { D.symptoms = D.symptoms.filter(x => x.id !== sd.dataset.sdel); save(); toast('Symptom removed', 'warn'); refresh(); return; }
  const pe = t.closest('[data-pedit]'); if (pe) { petForm(pet(pe.dataset.pedit)); return; }
  const vd = t.closest('[data-vdone]'); if (vd) { const v = D.visits.find(x => x.id === vd.dataset.vdone); formModal({ title: `How did ${pet(v.pet).name}'s visit go?`, submit: 'Save visit', values: { cost: v.cost }, fields: [{ k: 'notes', label: "Vet's notes", type: 'textarea', rows: 3, req: true }, { k: 'cost', label: 'Final cost ($)', type: 'number', min: 0, max: 5000, req: true }], onSubmit(x) { Object.assign(v, { notes: x.notes, cost: +x.cost, status: 'Done' }); D.exp.push({ id: uid(), date: iso(TODAY), cat: 'Vet', pet: v.pet, what: v.why, amt: +x.cost }); save(); toast('Visit saved to history'); refresh(); } }); return; }
  const ve = t.closest('[data-vedit]'); if (ve) { visitForm(D.visits.find(x => x.id === ve.dataset.vedit)); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a, p = cur();
  if (a === 'visit') visitForm(null); else if (a === 'addpet') petForm(null);
  else if (a === 'weigh') formModal({ title: `Weigh ${p.name}`, submit: 'Save weight', values: { kg: p.w[p.w.length - 1] }, fields: [{ k: 'kg', label: 'Weight (kg)', type: 'number', step: 'any', min: .1, max: 100, req: true, check: v => Math.abs(v - p.w[p.w.length - 1]) > p.w[p.w.length - 1] * .3 ? 'That is a big change. Check the scale?' : '' }], onSubmit(v) { p.w[p.w.length - 1] = +v.kg; save(); const diff = v.kg - p.target; toast(Math.abs(diff) < p.target * .03 ? `${p.name} is right on goal` : `${p.name} is ${dec(Math.abs(diff), 1)} kg ${diff > 0 ? 'above' : 'below'} goal`); refresh(); } });
  else if (a === 'treat') { p.energy = Math.min(5, p.energy + 1); save(); toast(`${p.name} loved that treat!`); refresh(); }
  else if (a === 'symptom') formModal({ title: 'Log a symptom', submit: 'Save', values: { pet: D.cur, sev: 1, date: iso(TODAY) }, fields: [{ k: 'pet', label: 'Pet', type: 'select', opts: D.pets.map(x => ({ v: x.id, l: x.name })) }, { k: 'what', label: 'What did you notice?', req: true }, { k: 'sev', label: 'How serious (1–3)', type: 'number', min: 1, max: 3, req: true, half: true }, { k: 'date', label: 'Date', type: 'date', req: true, half: true, check: v => v > iso(TODAY) ? 'Cannot be in the future' : '' }], onSubmit(v) { D.symptoms.push({ id: uid(), ...v }); save(); toast('Symptom logged'); if (v.sev >= 3) addNote(`${pet(v.pet).name}: ${v.what}. Consider a vet visit.`, 'danger'); refresh(); } });
  else if (a === 'addmed') formModal({ title: 'Add a medicine', submit: 'Add', values: { pet: D.cur, per: 30, left: 30, when: 'Every morning' }, fields: [{ k: 'pet', label: 'Pet', type: 'select', opts: D.pets.map(x => ({ v: x.id, l: x.name })) }, { k: 'name', label: 'Medicine', req: true }, { k: 'dose', label: 'Dose', req: true, half: true }, { k: 'when', label: 'When', type: 'select', half: true, opts: ['Every morning', 'Every evening', 'Twice a day', 'Weekly', 'Monthly, on the 1st'] }, { k: 'left', label: 'In the pack', type: 'number', min: 0, max: 500, req: true, half: true }, { k: 'per', label: 'Pack size', type: 'number', min: 1, max: 500, req: true, half: true }], onSubmit(v) { D.meds.push({ id: 'm' + uid(), ...v, until: '' }); save(); toast(`${v.name} added`); refresh(); } });
  else if (a === 'walk') formModal({ title: 'Log activity', submit: 'Save', values: { pet: D.cur, mins: 30 }, fields: [{ k: 'pet', label: 'Pet', type: 'select', opts: D.pets.map(x => ({ v: x.id, l: x.name })) }, { k: 'mins', label: 'Minutes', type: 'number', min: 1, max: 600, req: true }], onSubmit(v) { const L = D.act[v.pet]; L[L.length - 1].mins += v.mins; save(); toast(`${v.mins} minutes added for ${pet(v.pet).name}`); refresh(); } });
  else if (a === 'water') { D.pets.forEach(x => { const L = D.act[x.id]; L[L.length - 1].water++; }); save(); toast('Bowls refilled'); refresh(); }
  else if (a === 'expense') formModal({ title: 'Add an expense', submit: 'Add', values: { pet: D.cur, cat: 'Food', date: iso(TODAY) }, fields: [{ k: 'what', label: 'What', req: true }, { k: 'pet', label: 'Pet', type: 'select', half: true, opts: D.pets.map(x => ({ v: x.id, l: x.name })) }, { k: 'cat', label: 'Category', type: 'select', half: true, opts: ECATS }, { k: 'amt', label: 'Amount ($)', type: 'number', step: 'any', min: .01, max: 100000, req: true, half: true }, { k: 'date', label: 'Date', type: 'date', req: true, half: true }], onSubmit(v) { D.exp.push({ id: uid(), ...v, amt: +v.amt }); save(); toast(`${usd(v.amt)} added`); refresh(); } });
  else if (a === 'plan') { D.plan = D.plan === 'Family' ? 'Free' : 'Family'; save(); toast(`You are on Furnest ${D.plan}`); refresh(); }
  else if (a === 'reset') confirmBox('Bring back the sample home and pets? Your changes will be lost.', () => { store.del(KEY); D = makeData(); save(); setPet(D.cur, true); toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), ...D.pets.map(p => ({ label: 'Switch to ' + p.name, hint: p.breed, icon: 'paw', run: () => setPet(p.id) })), { label: 'Book vet visit', hint: 'Action', icon: 'cal', run: () => visitForm(null) }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }];

/* Start */
initTheme('furnest', '');
setPet(D.cur, true);
D.vax.filter(v => vaxSt(v)[1] === 'danger').slice(0, 2).forEach(v => addNote(`${pet(v.pet).name}: ${v.name} vaccine is overdue`, 'danger', new Date(Date.now() - 5e6)));
const lowM = D.meds.find(m => m.left / m.per < .3); if (lowM) addNote(`${lowM.name} for ${pet(lowM.pet).name} is running low`, 'warn', new Date(Date.now() - 2e6));
addNote('Weekly summary: everyone walked more than last week', 'ok', new Date(Date.now() - 8e7));
save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'home', title: 'Furnest' });
</script>
</body>
</html>
