<!doctype html>
<!-- Chill & Craft · Postcard · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Postcard · Write, stamp and post a card</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: a writing desk, cream card stock, airmail red and blue ---------- */
  :root {
    --bg: #d9e6e3;
    --desk: #c8dad6;
    --paper: #fffaf0;
    --paper2: #f4ecdc;
    --ink: #22303a;
    --muted: #6e7b80;
    --line: rgba(34, 48, 58, 0.14);
    --rule: rgba(50, 90, 140, 0.22);
    --red: #d8433a;
    --blue: #2f5fa8;
    --pen: #23408a;
    --postmark: #2c2748;
    --accent: #1f7a6d;
    --accent2: #155f55;
    --ok: #1f9a62;
    --shadow: rgba(30, 60, 60, 0.4);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1a1c;
    --desk: #142427;
    --paper: #f6efe0;
    --paper2: #e9dfca;
    --ink: #e8f0f0;
    --muted: #8fa3a6;
    --line: rgba(232, 240, 240, 0.12);
    --accent: #35b3a0;
    --accent2: #22917f;
    --ok: #3fd193;
    --shadow: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input, select, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hand { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive; }

  /* ---------- Stage: a desk with a soft lamp light ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; isolation: isolate; background: radial-gradient(60% 55% at 45% 35%, color-mix(in srgb, #fff 30%, transparent), transparent 70%), repeating-linear-gradient(0deg, transparent 0 22px, color-mix(in srgb, var(--ink) 2.5%, transparent) 22px 23px), var(--desk); }
  :root[data-theme="dark"] .stage { background: radial-gradient(60% 55% at 45% 35%, rgba(255, 220, 160, 0.09), transparent 70%), var(--desk); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) rotate(-2deg); } }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 20px; width: min(780px, 100%); align-items: center; }

  /* ---------- The postcard: two faces on a 3D flipper ---------- */
  .pc { position: relative; perspective: 1500px; container-type: inline-size; animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .flip { position: relative; aspect-ratio: 3 / 2; transform-style: preserve-3d; transition: transform 0.95s cubic-bezier(0.3, 1.25, 0.4, 1); }
  .flip.front { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; overflow: hidden; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 30px 50px -26px var(--shadow), 0 2px 4px rgba(0, 0, 0, 0.12); }
  .face.f { transform: rotateY(180deg); }
  .face.f svg { display: block; width: 100%; height: 100%; }
  /* back: airmail edge, message left, stamp and address right */
  .face.b { padding: 9px; background: repeating-linear-gradient(-45deg, var(--red) 0 12px, var(--paper) 12px 18px, var(--blue) 18px 30px, var(--paper) 30px 36px); }
  .sheet { position: relative; display: grid; grid-template-columns: 1.12fr 1fr; height: 100%; border-radius: 5px; background: linear-gradient(160deg, var(--paper), var(--paper2)); color: #22303a; }
  .sheet::after { content: ""; position: absolute; left: 52.8%; top: 12%; bottom: 12%; width: 1.5px; background: rgba(34, 48, 58, 0.18); }
  .msg { display: flex; flex-direction: column; padding: 5cqw 3cqw 4cqw 4.4cqw; min-width: 0; }
  .msg textarea { flex: 1; width: 100%; padding: 0; border: 0; resize: none; background: repeating-linear-gradient(180deg, transparent 0 calc(1.6em - 1px), var(--rule) calc(1.6em - 1px) 1.6em); background-attachment: local; color: var(--pen); font-size: clamp(12px, 3cqw, 17px); line-height: 1.6; }
  .msg textarea::placeholder { color: rgba(35, 64, 138, 0.4); }
  .msg textarea:focus { outline: none; background-color: rgba(47, 95, 168, 0.05); border-radius: 4px; }
  .sig { margin-top: 0.6cqw; color: var(--pen); font-size: clamp(11px, 2.6cqw, 15px); }
  .addr { position: relative; display: flex; flex-direction: column; padding: 3.6cqw 4cqw 4cqw 4.4cqw; min-width: 0; }
  .stampbox { position: relative; align-self: flex-end; width: 13.2cqw; height: 15.6cqw; border: 1.5px dashed rgba(34, 48, 58, 0.3); border-radius: 3px; display: grid; place-items: center; color: rgba(34, 48, 58, 0.45); font-size: clamp(7px, 1.5cqw, 10px); font-weight: 800; text-align: center; letter-spacing: 0.06em; line-height: 1.2; transition: border-color 0.25s, background 0.25s; }
  .stampbox.need { border-color: var(--red); background: rgba(216, 67, 58, 0.08); animation: need 0.5s; }
  @keyframes need { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  .stampbox .stamp { position: absolute; inset: -2px; width: auto; }
  .lines { display: grid; gap: 1.6cqw; margin-top: auto; }
  .ln { display: flex; align-items: baseline; gap: 6px; border-bottom: 1.5px solid rgba(34, 48, 58, 0.25); padding-bottom: 2px; font-size: clamp(11px, 2.5cqw, 15px); }
  .ln small { flex: none; font-family: system-ui, sans-serif; font-size: clamp(8px, 1.6cqw, 10px); font-weight: 800; letter-spacing: 0.1em; color: rgba(34, 48, 58, 0.5); }
  .ln input, .ln select { flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--pen); font-size: inherit; }
  .ln select { appearance: none; -webkit-appearance: none; cursor: pointer; }
  .ln input:focus, .ln select:focus { outline: none; }
  .ln:focus-within { border-bottom-color: var(--blue); }
  .ln.need { border-bottom-color: var(--red); animation: need 0.5s; }
  .ln .fixed { color: var(--pen); }
  /* the postmark and wavy cancel lines are drawn on top of the stamp after posting */
  .postmark { position: absolute; right: 1.5cqw; top: 1.2cqw; width: 34cqw; height: 20cqw; pointer-events: none; overflow: visible; opacity: 0; }
  .postmark * { transform-box: view-box; }

  /* the rubber stamper that comes down onto the card */
  .stamper { position: absolute; z-index: 4; right: 18cqw; top: -9cqw; width: 18cqw; pointer-events: none; opacity: 0; transform-origin: 50% 100%; }

  /* ---------- Stamp sheet ---------- */
  .side { display: grid; gap: 12px; justify-items: center; }
  .sheetbox { display: grid; grid-template-columns: repeat(2, 64px); gap: 6px; padding: 10px; border-radius: 10px; background: color-mix(in srgb, var(--paper) 92%, transparent); box-shadow: 0 18px 30px -20px var(--shadow), 0 0 0 1px var(--line); transform: rotate(3deg); }
  .sheetbox .cap { grid-column: 1 / -1; font-size: 0.62rem; font-weight: 850; letter-spacing: 0.12em; color: #6e7b80; text-align: center; }
  .sb { position: relative; width: 64px; height: 76px; padding: 0; border: 0; background: transparent; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .sb::before { content: ""; position: absolute; inset: 2px; border: 1.5px dashed rgba(34, 48, 58, 0.2); border-radius: 2px; }
  .sb:hover .stamp { transform: translateY(-3px) rotate(-3deg); }
  .sb[aria-pressed="true"] .stamp { visibility: hidden; }
  .stamp { position: relative; display: block; width: 100%; height: 100%; padding: 4px; background: #fff; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.18));
    -webkit-mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle at center, transparent 2.1px, #000 2.6px) -3.5px -3.5px / 7px 7px round;
    mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle at center, transparent 2.1px, #000 2.6px) -3.5px -3.5px / 7px 7px round; }
  .stamp svg { display: block; width: 100%; height: 100%; }
  .price { font-size: 0.74rem; color: var(--muted); }
  .price b { color: var(--ink); }

  /* ---------- Controls and tracking ---------- */
  .controls { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .lbl { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 36px; padding: 0 13px; border: 1.5px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--paper) 50%, transparent); font-size: 0.8rem; font-weight: 750; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), border-color 0.2s, background 0.2s; }
  .chip:hover { transform: translateY(-1px); border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grow { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--paper) 50%, transparent); font-weight: 850; font-size: 0.88rem; cursor: pointer; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.95); }
  .btn svg { width: 19px; height: 19px; }
  .btn.post { border: 0; padding: 0 22px; background: linear-gradient(180deg, var(--red), #b8322b); color: #fff; box-shadow: 0 14px 22px -14px #b8322b, inset 0 -3px 0 rgba(0, 0, 0, 0.16); }
  .btn.post.done { background: linear-gradient(180deg, var(--ok), color-mix(in srgb, var(--ok) 80%, #000)); }
  .btn[aria-disabled="true"] { cursor: progress; }
  .track { grid-column: 1 / -1; position: relative; padding: 12px 16px 10px; border-radius: 16px; background: color-mix(in srgb, var(--paper) 70%, transparent); box-shadow: 0 0 0 1px var(--line); }
  :root[data-theme="dark"] .track, :root[data-theme="dark"] .chip, :root[data-theme="dark"] .btn:not(.post) { background: rgba(255, 255, 255, 0.04); }
  .track header { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: var(--muted); }
  .track header b { color: var(--ink); }
  .track svg { display: block; width: 100%; height: 34px; margin-top: 4px; overflow: visible; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 0.68rem; font-weight: 750; color: var(--muted); }
  .steps span:nth-child(2) { text-align: center; padding-right: 8%; }
  .steps span:nth-child(3) { text-align: center; padding-left: 8%; }
  .steps span:last-child { text-align: right; }
  .steps span.on { color: var(--accent); }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .fx .stamp { position: absolute; left: 0; top: 0; width: 64px; height: 76px; }
  .conf { position: absolute; left: 0; top: 0; width: 8px; height: 10px; border-radius: 1px; }

  @media (max-width: 700px) {
    .desk { grid-template-columns: 1fr; }
    .side { grid-template-columns: auto auto; align-items: center; justify-content: center; }
    .sheetbox { grid-template-columns: repeat(4, 52px); transform: none; padding: 8px; }
    .sb { width: 52px; height: 62px; }
    .controls .grow { display: none; }
  }
  @media (max-width: 420px) {
    .sheetbox { grid-template-columns: repeat(4, 48px); }
    .sb { width: 48px; height: 57px; }
    .side .price { display: none; }
    .controls { gap: 8px; }
    .btn.post { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pc, .stampbox.need, .ln.need { animation: none !important; }
    .flip, .chip, .btn, .sb, .stamp { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="desk">
      <section class="pc" id="pc" aria-labelledby="title">
        <h1 class="sr-only" id="title">Postcard: write it, stamp it, post it</h1>
        <div class="flip" id="flip">
          <!-- back: the writing side -->
          <div class="face b" id="back">
            <div class="sheet">
              <div class="msg">
                <label class="sr-only" for="msgText">Message</label>
                <textarea class="hand" id="msgText" maxlength="140" placeholder="Write something nice…"></textarea>
                <div class="sig hand" id="sig">— Hina</div>
              </div>
              <div class="addr">
                <div class="stampbox" id="stampbox">PLACE<br />STAMP<br />HERE</div>
                <div class="lines">
                  <label class="ln" id="lnName"><small>TO</small><input class="hand" id="toName" maxlength="20" autocomplete="off" placeholder="Name" /></label>
                  <label class="ln"><small>CITY</small><select class="hand" id="toCity"><option>Karachi</option><option>Lahore</option><option>Islamabad</option><option>Peshawar</option><option>Quetta</option><option>Multan</option></select></label>
                  <div class="ln"><small>COUNTRY</small><span class="fixed hand">Pakistan</span></div>
                </div>
              </div>
              <svg class="postmark" id="postmark" viewBox="0 0 200 118" aria-hidden="true">
                <!-- the round date stamp sits left of the stamp; the wavy cancel lines run across it -->
                <defs><path id="pmArc" d="M28 59a30 30 0 1 1 60 0a30 30 0 1 1-60 0" /></defs>
                <g fill="none" stroke="var(--postmark)" stroke-linecap="round" id="waves" opacity=".82">
                  <path d="M96 41c10-7 20 7 30 0s20 7 30 0 20 7 30 0" stroke-width="3" />
                  <path d="M96 53c10-7 20 7 30 0s20 7 30 0 20 7 30 0" stroke-width="3" />
                  <path d="M96 65c10-7 20 7 30 0s20 7 30 0 20 7 30 0" stroke-width="3" />
                  <path d="M96 77c10-7 20 7 30 0s20 7 30 0 20 7 30 0" stroke-width="3" />
                </g>
                <g id="ring" opacity=".85">
                  <circle cx="58" cy="59" r="40" fill="none" stroke="var(--postmark)" stroke-width="3" />
                  <circle cx="58" cy="59" r="24" fill="none" stroke="var(--postmark)" stroke-width="2" />
                  <text font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" letter-spacing="1.8" fill="var(--postmark)"><textPath href="#pmArc" id="pmCity">SKARDU · PAKISTAN ·</textPath></text>
                  <text id="pmDate" x="58" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="var(--postmark)">21 NOV</text>
                  <text x="58" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="var(--postmark)">2026</text>
                </g>
              </svg>
            </div>
          </div>
          <!-- front: the picture side -->
          <div class="face f" id="front" aria-hidden="true"><svg id="art" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice"></svg></div>
        </div>
        <!-- the rubber stamper -->
        <svg class="stamper" id="stamper" viewBox="0 0 80 110" aria-hidden="true">
          <circle cx="40" cy="16" r="13" fill="#b4683c" /><circle cx="35" cy="12" r="4" fill="#fff" opacity=".3" />
          <path d="M33 26h14l4 42H29Z" fill="#8a4a28" />
          <rect x="10" y="66" width="60" height="18" rx="4" fill="#5a3320" />
          <rect x="13" y="84" width="54" height="12" rx="2" fill="#2c2748" />
        </svg>
      </section>

      <aside class="side">
        <div class="sheetbox" id="sheet" role="group" aria-label="Stamps"><span class="cap">STAMPS · TAP ONE</span></div>
        <p class="price" id="price">Postage <b>none yet</b></p>
      </aside>

      <div class="controls">
        <span class="lbl" id="fromLbl">Greetings from</span>
        <div class="chips" id="from" role="group" aria-labelledby="fromLbl"></div>
        <span class="grow"></span>
        <button class="btn" id="flipBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5" /></svg><span id="flipText">See front</span></button>
        <button class="btn post" id="post" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M3 8l9 6 9-6" /></svg><span id="postText">Post it</span></button>
      </div>

      <div class="track" aria-live="polite">
        <header><span id="route">Not posted yet</span><span id="trackNo"></span></header>
        <svg viewBox="0 0 600 34" preserveAspectRatio="none" aria-hidden="true">
          <path id="routeP" d="M8 22Q300 -6 592 22" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" vector-effect="non-scaling-stroke" />
          <path id="routeDone" d="M8 22Q300 -6 592 22" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
        </svg>
        <div class="steps" id="steps"><span>Posted</span><span>Sorting</span><span>On the way</span><span>Delivered</span></div>
        <p class="sr-only" id="status"></p>
      </div>
    </div>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Postcard: pick a picture, write, tear off a stamp, post it and follow it home ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { $("#status").textContent = t; };
  const fx = $("#fx"), flip = $("#flip");

  // ---------- Front pictures (drawn here, no images) ----------
  const SCENES = {
    Skardu: '<defs><linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ec8f2" /><stop offset="1" stop-color="#e9f6ff" /></linearGradient><linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2bb3c9" /><stop offset="1" stop-color="#11718f" /></linearGradient></defs><rect width="300" height="200" fill="url(#s1)" /><circle cx="236" cy="48" r="18" fill="#fff4c4" /><path d="M0 128 52 60 78 92 118 40 168 110 206 70 252 112 300 80V200H0Z" fill="#7b88ad" /><path d="M52 60 62 78 70 72 78 92 66 84 58 90ZM118 40 132 62 140 56 150 76 134 66 124 74ZM206 70 216 86 224 82 230 94 218 88 210 92Z" fill="#fff" /><path d="M0 140 60 118 120 136 190 116 300 134V200H0Z" fill="#4b8a5e" /><rect y="150" width="300" height="50" fill="url(#w1)" /><path d="M20 164h40M120 172h56M210 162h50" stroke="#fff" stroke-width="2.4" opacity=".5" stroke-linecap="round" /><g fill="#2f6a45"><path d="M30 150 40 118 50 150Z" /><path d="M46 150 54 126 62 150Z" /><path d="M250 150 260 114 270 150Z" /></g>',
    Karachi: '<defs><linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a6b" /><stop offset=".6" stop-color="#ffd59a" /><stop offset="1" stop-color="#fff0d6" /></linearGradient><linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa0c9" /><stop offset="1" stop-color="#1e5f8f" /></linearGradient></defs><rect width="300" height="200" fill="url(#s2)" /><circle cx="150" cy="118" r="36" fill="#fff3c4" /><rect y="118" width="300" height="82" fill="url(#w2)" /><path d="M110 128h80M124 138h52M136 148h28" stroke="#ffe3a8" stroke-width="3" stroke-linecap="round" opacity=".8" /><path d="M0 168c30-8 60 8 90 0s60 8 90 0 60 8 120 0V200H0Z" fill="#f1d7a6" /><path d="M222 118l6-18 22 18Z" fill="#fff" /><path d="M212 120h44l-6 8h-32Z" fill="#7a3f2a" /><path d="M228 100v18" stroke="#7a3f2a" stroke-width="2" /><path d="M42 170c2-30 0-52 6-70" fill="none" stroke="#6b4a2a" stroke-width="5" stroke-linecap="round" /><path d="M48 100c-18-6-30 0-38 10 14-4 24-4 38-10ZM48 100c16-10 30-8 40 0-14-2-26 0-40 0ZM48 100c-8-14-4-26 6-32-2 12-2 22-6 32ZM48 100c14 2 22 12 24 22-8-8-16-14-24-22Z" fill="#2f7a4a" />',
    Lahore: '<defs><linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20184a" /><stop offset="1" stop-color="#6a3d78" /></linearGradient><radialGradient id="l3"><stop offset="0" stop-color="#ffe9a0" /><stop offset="1" stop-color="#ff9a3c" /></radialGradient></defs><rect width="300" height="200" fill="url(#s3)" /><g fill="#fff"><circle cx="40" cy="30" r="1.2" /><circle cx="120" cy="20" r="1" /><circle cx="210" cy="36" r="1.3" /><circle cx="270" cy="18" r="1" /></g><path d="M250 40a16 16 0 1 0 12 26 13 13 0 1 1-12-26Z" fill="#fff1c9" /><path d="M0 200V140h30v-20h12v-14a14 14 0 0 1 28 0v14h12v20h40v-30a28 28 0 0 1 56 0v30h40v-20h12v-14a14 14 0 0 1 28 0v14h12v20h30V200Z" fill="#170f2e" /><path d="M96 110v-24M204 116v-24M150 82v-12" stroke="#170f2e" stroke-width="4" /><path d="M0 60Q150 100 300 56" fill="none" stroke="#c9a2e6" stroke-width="1" opacity=".6" /><g><circle cx="40" cy="70" r="7" fill="url(#l3)" /><circle cx="90" cy="80" r="7" fill="url(#l3)" /><circle cx="150" cy="84" r="7" fill="url(#l3)" /><circle cx="210" cy="78" r="7" fill="url(#l3)" /><circle cx="262" cy="66" r="7" fill="url(#l3)" /></g><path d="M178 26l14 14-14 18-14-18Z" fill="#ff5d8f" /><path d="M178 58c-6 14 10 22 2 40" fill="none" stroke="#ff5d8f" stroke-width="1.2" />'
  };
  function drawFront(city) {
    $("#art").innerHTML = SCENES[city] +
      '<g font-family="system-ui, sans-serif" font-weight="900"><text x="16" y="34" font-size="11" fill="#fff" letter-spacing="2" opacity=".95" stroke="rgba(0,0,0,.25)" stroke-width="3" paint-order="stroke">GREETINGS FROM</text>' +
      '<text x="14" y="70" font-size="38" fill="#fff" stroke="' + (city === "Lahore" ? "#ff5d8f" : "#d8433a") + '" stroke-width="5" paint-order="stroke" letter-spacing="1">' + city.toUpperCase() + "</text></g>";
  }

  // ---------- Stamps ----------
  const STAMPS = [
    { id: "markhor", name: "Markhor", pkr: 20, bg: "#1f8a80", art: '<g transform="translate(0 7)"><path d="M24 40c-4-10 0-18 6-18s10 8 6 18l-6 12Z" fill="#f4e3c3" /><path d="M27 24c-8-4-10-12-4-16 4-3 8 2 4 6M33 24c8-4 10-12 4-16-4-3-8 2-4 6" fill="none" stroke="#f4e3c3" stroke-width="2.6" stroke-linecap="round" /><circle cx="27.5" cy="32" r="1.3" fill="#1d2b2a" /><circle cx="32.5" cy="32" r="1.3" fill="#1d2b2a" /></g>' },
    { id: "jasmine", name: "Jasmine", pkr: 30, bg: "#e9779a", art: '<g transform="translate(30 32)"><path d="M-14 12c6-4 10-4 14 0M14 12c-6-4-10-4-14 0" stroke="#2f7a4a" stroke-width="3" fill="none" /><g fill="#fff"><ellipse cy="-8" rx="5" ry="8" /><ellipse cy="-8" rx="5" ry="8" transform="rotate(72)" /><ellipse cy="-8" rx="5" ry="8" transform="rotate(144)" /><ellipse cy="-8" rx="5" ry="8" transform="rotate(216)" /><ellipse cy="-8" rx="5" ry="8" transform="rotate(288)" /></g><circle r="3.5" fill="#ffd23f" /></g>' },
    { id: "rosette", name: "Truck art", pkr: 50, bg: "#f3b72a", art: '<g transform="translate(30 32)"><circle r="16" fill="#d8433a" /><g fill="#2f5fa8"><circle cy="-11" r="4.5" /><circle cy="11" r="4.5" /><circle cx="-11" r="4.5" /><circle cx="11" r="4.5" /></g><g fill="#1f8a80"><circle cx="-8" cy="-8" r="3" /><circle cx="8" cy="8" r="3" /><circle cx="8" cy="-8" r="3" /><circle cx="-8" cy="8" r="3" /></g><circle r="5.5" fill="#fff" /><circle r="2.5" fill="#d8433a" /></g>' },
    { id: "crescent", name: "Crescent", pkr: 80, bg: "#1f2a5a", art: '<path d="M8 52c10-8 18-10 24-8s14 4 20 8V60H8Z" fill="#2f7a4a" /><path d="M34 14a12 12 0 1 0 8 20 10 10 0 1 1-8-20Z" fill="#fff1c9" /><g fill="#fff"><circle cx="16" cy="18" r="1.4" /><circle cx="22" cy="30" r="1" /><circle cx="48" cy="22" r="1.2" /></g>' }
  ];
  const stampSvg = (s) => '<svg viewBox="0 0 60 72" aria-hidden="true"><rect width="60" height="72" fill="' + s.bg + '" /><text x="30" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="900" letter-spacing="1" fill="#fff" opacity=".85">PAKISTAN</text>' + s.art + '<text x="30" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#fff">PKR ' + s.pkr + "</text></svg>";
  STAMPS.forEach((s) => $("#sheet").insertAdjacentHTML("beforeend", '<button class="sb" type="button" data-id="' + s.id + '" aria-pressed="false" aria-label="' + s.name + " stamp, PKR " + s.pkr + '"><span class="stamp">' + stampSvg(s) + "</span></button>"));
  let stamp = null, busy = false;
  $("#sheet").addEventListener("click", (e) => { const b = e.target.closest(".sb"); if (b && !busy) useStamp(b.dataset.id); });
  async function useStamp(id) {
    const s = STAMPS.find((x) => x.id === id);
    if (stamp && stamp.id === id) return;
    const box = $("#stampbox"), btn = document.querySelector('.sb[data-id="' + id + '"]');
    box.classList.remove("need");
    // the old stamp goes back on the sheet
    if (stamp) { const ob = document.querySelector('.sb[data-id="' + stamp.id + '"]'); ob.setAttribute("aria-pressed", "false"); play(ob.firstChild, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: 400, easing: "cubic-bezier(.3,1.7,.5,1)" }); }
    stamp = s;
    btn.setAttribute("aria-pressed", "true");
    box.innerHTML = "";
    $("#price").innerHTML = "Postage <b>PKR " + s.pkr + "</b>";
    say(s.name + " stamp, PKR " + s.pkr);
    // tear it off the sheet and fly it onto the card
    if (!calm()) {
      const r = btn.getBoundingClientRect(), t = box.getBoundingClientRect();
      const node = document.createElement("span");
      node.className = "stamp";
      node.innerHTML = stampSvg(s);
      fx.appendChild(node);
      const sx = r.left + (r.width - 64) / 2, sy = r.top + (r.height - 76) / 2, k = (t.width + 4) / 64;
      const ex = t.left + t.width / 2 - 32, ey = t.top + t.height / 2 - 38;
      await node.animate([
        { transform: "translate(" + sx + "px," + sy + "px) rotate(0) scale(" + r.width / 64 + ")" },
        { transform: "translate(" + (sx - 4) + "px," + (sy - 10) + "px) rotate(-12deg) scale(" + r.width / 64 * 1.05 + ")", offset: 0.18 },
        { transform: "translate(" + ((sx + ex) / 2) + "px," + (Math.min(sy, ey) - 50) + "px) rotate(18deg) scale(" + Math.max(k, 1) * 1.2 + ")", offset: 0.6 },
        { transform: "translate(" + ex + "px," + ey + "px) rotate(-3deg) scale(" + k + ")" }
      ], { duration: 720, easing: "cubic-bezier(.45,0,.3,1)" }).finished.catch(() => {});
      node.remove();
    }
    if (stamp !== s) return; // another stamp was picked meanwhile
    box.innerHTML = '<span class="stamp">' + stampSvg(s) + "</span>";
    play(box.firstChild, [{ transform: "scale(1.25) rotate(-6deg)" }, { transform: "scale(.94) rotate(-2deg)", offset: 0.6 }, { transform: "rotate(-3deg)" }], { duration: 420, easing: "ease-out", fill: "forwards" });
  }

  // ---------- Picture side and flip ----------
  let from = "Skardu";
  Object.keys(SCENES).forEach((c) => $("#from").insertAdjacentHTML("beforeend", '<button class="chip" type="button" data-c="' + c + '" aria-pressed="false">' + c + "</button>"));
  function setFrom(c, peek) {
    from = c;
    document.querySelectorAll("#from .chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === c)));
    drawFront(c);
    $("#pmCity").textContent = c.toUpperCase() + " · PAKISTAN ·";
    renderRoute();
    if (peek) peekFront();
  }
  $("#from").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b && !busy) setFrom(b.dataset.c, true); });
  function showFront(on) {
    flip.classList.toggle("front", on);
    $("#front").setAttribute("aria-hidden", String(!on));
    $("#back").setAttribute("aria-hidden", String(on));
    $("#flipBtn").setAttribute("aria-pressed", String(on));
    $("#flipText").textContent = on ? "See back" : "See front";
  }
  let peekT = 0;
  function peekFront() { showFront(true); clearTimeout(peekT); peekT = setTimeout(() => { if (!busy) showFront(false); }, 1500); }
  $("#flipBtn").addEventListener("click", () => { if (busy) return; clearTimeout(peekT); showFront(!flip.classList.contains("front")); });

  // ---------- Route and tracking strip ----------
  const steps = [...document.querySelectorAll("#steps span")];
  function renderRoute() { if (!busy) $("#route").innerHTML = "From <b>" + from + "</b> to <b>" + $("#toCity").value + "</b>"; }
  $("#toCity").addEventListener("change", renderRoute);
  $("#toName").addEventListener("input", () => $("#lnName").classList.remove("need"));
  function trackTo(p, dur) {
    const done = $("#routeDone");
    const from0 = parseFloat(done.getAttribute("stroke-dashoffset"));
    const to = 100 - p * 100;
    if (calm()) { done.setAttribute("stroke-dashoffset", String(to)); return Promise.resolve(); }
    return new Promise((res) => { const t0 = performance.now(); const f = (now) => { const k = Math.min(1, Math.max(0, now - t0) / dur), e = 1 - Math.pow(1 - k, 3); done.setAttribute("stroke-dashoffset", (from0 + (to - from0) * e).toFixed(2)); if (k < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
  }
  const setStep = (n) => steps.forEach((s, i) => s.classList.toggle("on", i < n));

  // ---------- Post: check, stamp down, cancel lines, flip, fly away, track to delivered ----------
  const post = $("#post");
  post.addEventListener("click", () => send());
  async function send() {
    if (busy) return;
    const name = $("#toName").value.trim();
    if (!stamp || !name) {
      if (flip.classList.contains("front")) showFront(false);
      if (!stamp) { const b = $("#stampbox"); b.classList.remove("need"); void b.offsetWidth; b.classList.add("need"); }
      if (!name) { const l = $("#lnName"); l.classList.remove("need"); void l.offsetWidth; l.classList.add("need"); }
      say(!stamp && !name ? "Add a stamp and a name first" : !stamp ? "Add a stamp first: tap one on the sheet" : "Who is it for? Add a name");
      return;
    }
    busy = true;
    post.setAttribute("aria-disabled", "true");
    post.classList.remove("done");
    clearTimeout(peekT);
    const wasFront = flip.classList.contains("front");
    showFront(false);
    // clear the strip from the last card
    $("#routeDone").setAttribute("stroke-dashoffset", "100");
    setStep(0); $("#trackNo").textContent = "";
    await wait(calm() ? 0 : wasFront ? 800 : 150);
    const city = $("#toCity").value;
    $("#postText").textContent = "Stamping…";
    // 1. anticipation: the stamper comes down, hovers, then slams
    const st = $("#stamper");
    const pm = $("#postmark");
    const d = new Date();
    $("#pmDate").textContent = d.getDate() + " " + d.toLocaleString("en", { month: "short" }).toUpperCase();
    if (!calm()) {
      st.style.opacity = "1";
      await st.animate([{ transform: "translateY(-120%) rotate(8deg)", opacity: 0 }, { transform: "translateY(-30%) rotate(-4deg)", opacity: 1 }], { duration: 420, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" }).finished.catch(() => {});
      await st.animate([{ transform: "translateY(-30%) rotate(-4deg)" }, { transform: "translateY(-38%) rotate(-2deg)" }], { duration: 220, easing: "ease-out", fill: "forwards" }).finished.catch(() => {});
      await st.animate([{ transform: "translateY(-38%) rotate(-2deg)" }, { transform: "translateY(18%) rotate(0) scaleY(.94)" }], { duration: 120, easing: "cubic-bezier(.6,0,1,.6)", fill: "forwards" }).finished.catch(() => {});
      play($("#pc"), [{ transform: "scale(1)" }, { transform: "scale(.985) translateY(2px)" }, { transform: "scale(1)" }], { duration: 260 });
    }
    // the ink lands: ring stamps on, the cancel waves draw across the stamp
    pm.style.opacity = "1";
    play(pm, [{ opacity: 0, transform: "scale(1.05)" }, { opacity: 1, transform: "scale(1)" }], { duration: 160 });
    pm.querySelectorAll("#waves path").forEach((p, i) => { const L = p.getTotalLength(); play(p, [{ strokeDasharray: L + "px", strokeDashoffset: L + "px" }, { strokeDasharray: L + "px", strokeDashoffset: "0px" }], { duration: 380, delay: i * 40, easing: "ease-out" }); });
    say("Postmarked in " + from);
    if (!calm()) {
      await wait(160);
      await st.animate([{ transform: "translateY(18%) scaleY(.94)", opacity: 1 }, { transform: "translateY(-140%) rotate(10deg)", opacity: 0 }], { duration: 500, easing: "cubic-bezier(.3,0,.3,1)", fill: "forwards" }).finished.catch(() => {});
      st.getAnimations().forEach((a) => a.cancel());
      st.style.opacity = "0";
    }
    // 2. main: flip to the picture, then the card lifts and sails off
    $("#postText").textContent = "Posting…";
    showFront(true);
    await wait(calm() ? 0 : 1100);
    await play($("#pc"), [
      { transform: "none", opacity: 1 },
      { transform: "translateY(-10px) rotate(-2deg) scale(1.02)", opacity: 1, offset: 0.25 },
      { transform: "translate(60%, -40%) rotate(14deg) scale(.35)", opacity: 0 }
    ], { duration: 820, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
    // 3. progress: follow it along the route
    const no ="PC-" + Math.random().toString(36).slice(2, 6).toUpperCase() + "-" + (10 + Math.floor(Math.random() * 89));
    $("#trackNo").textContent = no;
    $("#route").innerHTML = "<b>" + from + "</b> to <b>" + esc($("#toName").value.trim()) + "</b>, " + city;
    setStep(1); say("Posted. Tracking number " + no);
    await trackTo(0.34, 700); setStep(2); say("Sorting at the " + from + " post office");
    await wait(calm() ? 0 : 350);
    await trackTo(0.68, 800); setStep(3); say("On the way to " + city);
    await wait(calm() ? 0 : 350);
    await trackTo(1, 800); setStep(4);
    // 4. finish: delivered, a shower of tiny stamps over the strip
    const tr = document.querySelector(".track").getBoundingClientRect();
    confetti(tr.right - 40, tr.top + 20);
    say("Delivered to " + $("#toName").value.trim() + " in " + city);
    post.classList.add("done");
    $("#postText").textContent = "Delivered";
    $("#route").innerHTML = "Delivered to <b>" + esc($("#toName").value.trim()) + "</b> in " + city;
    // 5. reset: a fresh card slides in from the pile; the strip keeps the result
    await wait(calm() ? 300 : 1200);
    fresh();
    post.removeAttribute("aria-disabled");
    busy = false;
  }
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function confetti(x, y) {
    if (calm()) return;
    const cols = STAMPS.map((s) => s.bg).concat(["#fff", "#d8433a"]);
    for (let i = 0; i < 24; i++) {
      const c = document.createElement("i");
      c.className = "conf";
      c.style.background = cols[i % cols.length];
      fx.appendChild(c);
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 60 + Math.random() * 80;
      c.animate([
        { transform: "translate(" + x + "px," + y + "px) rotate(0)", opacity: 1 },
        { transform: "translate(" + (x + Math.cos(a) * v) + "px," + (y + Math.sin(a) * v) + "px) rotate(" + Math.random() * 400 + "deg)", opacity: 1, offset: 0.5 },
        { transform: "translate(" + (x + Math.cos(a) * v * 1.3) + "px," + (y + Math.sin(a) * v + 70) + "px) rotate(" + Math.random() * 800 + "deg)", opacity: 0 }
      ], { duration: 1200 + Math.random() * 500, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => c.remove();
    }
  }

  // ---------- A fresh card slides in from the pile ----------
  function fresh() {
    post.classList.remove("done");
    $("#postText").textContent = "Post it";
    $("#msgText").value = ""; $("#toName").value = "";
    if (stamp) document.querySelector('.sb[data-id="' + stamp.id + '"]').setAttribute("aria-pressed", "false");
    stamp = null;
    $("#stampbox").innerHTML = "PLACE<br />STAMP<br />HERE";
    $("#price").innerHTML = "Postage <b>none yet</b>";
    $("#postmark").style.opacity = "0";
    const pc = $("#pc");
    pc.getAnimations().forEach((a) => a.cancel());
    flip.style.transition = "none"; showFront(false); void flip.offsetWidth; flip.style.transition = "";
    play(pc, [{ transform: "translateX(-40%) rotate(-8deg)", opacity: 0 }, { transform: "translateX(3%) rotate(1deg)", opacity: 1, offset: 0.7 }, { transform: "none", opacity: 1 }], { duration: 700, easing: "cubic-bezier(.2,.8,.3,1)" });
    document.querySelectorAll(".sb .stamp").forEach((s, i) => play(s, [{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 400, delay: 200 + i * 70, easing: "cubic-bezier(.3,1.7,.5,1)", fill: "backwards" }));
    say("A fresh postcard");
  }

  // ---------- Auto-demo: peek at the picture, write, address, stamp, post ----------
  const DEMO = [
    { from: "Skardu", to: "Karachi", name: "Ayesha", stamp: "markhor", text: "Wish you were here! The lake is so blue and the apricots are everywhere." },
    { from: "Karachi", to: "Lahore", name: "Bilal", stamp: "jasmine", text: "Sea breeze, corn on the beach and a sunset that went on forever." },
    { from: "Lahore", to: "Islamabad", name: "Mariam", stamp: "rosette", text: "Food street until midnight, then kites on the roof. Come next time!" }
  ];
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function type(el, text, ms) { for (let i = 1; i <= text.length; i++) { if (!demoOn) return false; el.value = text.slice(0, i); await wait(calm() ? 0 : ms); } return true; }
  async function runDemo() {
    if (!demoOn || busy) return;
    const d = DEMO[round++ % DEMO.length];
    setFrom(d.from, true);
    await wait(1700);
    if (!demoOn) return;
    if (!(await type($("#msgText"), d.text, 22))) return;
    $("#toCity").value = d.to; renderRoute();
    if (!(await type($("#toName"), d.name, 60))) return;
    await wait(300);
    if (!demoOn) return;
    await useStamp(d.stamp);
    await wait(700);
    if (!demoOn) return;
    await send();
    queueDemo(2600);
  }

  // ---------- Start ----------
  setFrom("Skardu", false);
  queueDemo(600);
</script>
</body>
</html>
