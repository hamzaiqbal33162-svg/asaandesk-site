<!doctype html>
<!-- Chill and Craft · Ember · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember · spice level slider</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #fbf1e6;
    --card: #fffaf4;
    --ink: #2d1d16;
    --muted: #87695b;
    --line: #f0dfd0;
    --hero: #fde8d4;
    --pan: #3a332f;
    --accent: #e4402b;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #120c0a;
    --card: #1d1512;
    --ink: #fbeee6;
    --muted: #bfa293;
    --line: #36261f;
    --hero: #2a1a14;
    --pan: #0d0b0a;
    --accent: #ff6a4d;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    color: var(--ink);
    background: var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    --chili: #67b346;
    --flame: 0;
    --glow: 0;
    --amp: .6;
    --speed: 2.4s;
    position: relative;
    isolation: isolate;
    width: min(100%, 400px);
    padding: 16px 18px 18px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px rgba(120, 40, 10, .5);
  }
  /* Heat glow behind everything, stronger at hotter levels */
  .card::before {
    content: "";
    position: absolute;
    inset: -1px;
    z-index: -1;
    border-radius: inherit;
    background: radial-gradient(circle at 78% 18%, rgba(255, 90, 30, .55), transparent 60%);
    opacity: var(--glow);
    transition: opacity .5s;
  }
  .card[data-level="4"]::before { animation: heat .7s ease-in-out infinite alternate; }
  @keyframes heat { to { opacity: .55; } }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .tag { margin: 0; padding: 4px 10px; border-radius: 999px; background: var(--hero); color: var(--accent); font-size: 12px; font-weight: 700; }
  .cart {
    position: relative;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), border-color .2s;
  }
  .cart svg { width: 22px; height: 22px; }
  .cart:hover { transform: translateY(-2px) rotate(-6deg); border-color: var(--accent); }
  .cart:active { transform: scale(.9); }
  .cart.bump { animation: bump .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes bump { 35% { transform: scale(1.25) rotate(-10deg); } 65% { transform: scale(.92) rotate(4deg); } }
  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    line-height: 20px;
    transform: scale(0);
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .badge.on { transform: scale(1); }

  /* ---------- Hero: the dish and the chili ---------- */
  .hero {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 156px;
    margin: 10px 0 12px;
    padding: 0 10px;
    border-radius: 22px;
    background: radial-gradient(circle at 30% 80%, color-mix(in srgb, var(--chili) 20%, var(--hero)), var(--hero) 70%);
    transition: background .5s;
    overflow: hidden;
  }
  .dish { width: 62%; max-width: 210px; height: auto; margin-bottom: 4px; }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; opacity: .5; animation: steam 2.4s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: -.8s; }
  .steam path:nth-child(3) { animation-delay: -1.6s; }
  @keyframes steam {
    0% { transform: translateY(8px); opacity: 0; }
    40% { opacity: .55; }
    100% { transform: translateY(-14px); opacity: 0; }
  }
  .chili-wrap { position: relative; width: 34%; max-width: 96px; transition: transform .3s; }
  .chili-wrap.jump { animation: jump .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes jump { 35% { transform: translateY(-16px) scale(1.12, .92) rotate(-6deg); } 70% { transform: translateY(2px) scale(.96, 1.05); } }
  .chili-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chili { transform-box: fill-box; transform-origin: 50% 20%; animation: wobble var(--speed) ease-in-out infinite alternate; }
  @keyframes wobble { from { transform: rotate(calc(var(--amp) * -1deg)); } to { transform: rotate(calc(var(--amp) * 1deg)); } }
  .pod { fill: var(--chili); transition: fill .45s; }
  .flames { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(var(--flame)); opacity: min(1, calc(var(--flame) * 2)); transition: transform .55s cubic-bezier(.34, 1.56, .64, 1), opacity .3s; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .42s ease-in-out infinite alternate; }
  .flame.b { animation-duration: .35s; animation-delay: -.2s; }
  .flame.c { animation-duration: .5s; animation-delay: -.1s; }
  @keyframes flicker { from { transform: scaleY(.84) skewX(-5deg); } to { transform: scaleY(1.14) skewX(6deg); } }
  .sweat { opacity: 0; transition: opacity .3s; }
  .card[data-level="4"] .sweat, .card[data-level="3"] .sweat { opacity: 1; }
  .sweat circle { animation: drip 1.1s ease-in infinite; }
  .sweat circle:nth-child(2) { animation-delay: -.55s; }
  @keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(12px); opacity: 0; } }

  /* ---------- Dish details ---------- */
  .name { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-size: clamp(19px, 5.2vw, 22px); }
  .price { font-weight: 800; white-space: nowrap; }
  .serves { margin: 2px 0 12px; font-size: 13px; color: var(--muted); }

  /* ---------- Spice slider ---------- */
  .spice-head { display: flex; justify-content: space-between; align-items: baseline; }
  .spice-head label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .level { font-size: 18px; font-weight: 800; color: color-mix(in srgb, var(--chili) 75%, var(--ink)); transition: color .4s; }
  .level.pop { animation: levelPop .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes levelPop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } }
  .desc { min-height: 18px; margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
  input[type="range"] {
    width: 100%;
    height: 30px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 10px; background: linear-gradient(90deg, #67b346, #b5c938, #f2a12b, #e4402b, #b5121e); }
  input[type="range"]::-moz-range-track { height: 10px; border-radius: 10px; background: linear-gradient(90deg, #67b346, #b5c938, #f2a12b, #e4402b, #b5121e); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    margin-top: -9px;
    border-radius: 50%;
    background: var(--card);
    border: 6px solid var(--chili);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), border-color .4s;
  }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 6px solid var(--chili); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
  input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.3); }
  input[type="range"]:hover::-moz-range-thumb { transform: scale(1.12); }
  input[type="range"]:active::-moz-range-thumb { transform: scale(1.3); }
  input[type="range"]:focus { outline: none; }
  input[type="range"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
  .ticks { display: grid; grid-template-columns: repeat(5, 1fr); margin: 2px -6px 14px; }
  .ticks button {
    padding: 4px 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), color .2s;
  }
  .ticks button:hover { color: var(--ink); transform: translateY(-2px); }
  .ticks button[aria-pressed="true"] { color: color-mix(in srgb, var(--chili) 75%, var(--ink)); }
  .ticks button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }

  /* ---------- Quantity and add button ---------- */
  .buy { display: flex; gap: 10px; align-items: stretch; }
  .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 16px; }
  .qty button {
    width: 38px;
    height: 46px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 14px;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s;
  }
  .qty button:hover:not(:disabled) { background: var(--hero); }
  .qty button:active:not(:disabled) { transform: scale(.85); }
  .qty button:disabled { opacity: .35; cursor: default; }
  .qty output { min-width: 18px; text-align: center; font-weight: 800; }
  .qty output.pop { animation: levelPop .4s cubic-bezier(.34, 1.56, .64, 1); }
  .add {
    position: relative;
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 16px;
    padding: 0 14px;
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(120deg, var(--accent), #ff8a3d);
    box-shadow: 0 12px 22px -14px var(--accent);
    cursor: pointer;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, background .3s;
  }
  .add:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 26px -14px var(--accent); }
  .add:active:not(:disabled) { transform: scale(.95); }
  .add:disabled { cursor: default; }
  .add.done { background: linear-gradient(120deg, #1f9d61, #39c47f); }
  .add .spin { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px; border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .add .label { display: inline-block; }
  .add .label.pop { animation: levelPop .45s cubic-bezier(.34, 1.56, .64, 1); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; border-radius: 50%; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    .chili, .flame, .steam path, .card::before { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="card" id="card" data-level="0">
    <div class="top">
      <p class="tag">Chef's special</p>
      <button type="button" class="cart" id="cart" aria-label="Cart, 0 items">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.5 9.5a2 2 0 0 1-2 1.5h-7a2 2 0 0 1-2-1.5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span class="badge" id="badge" aria-hidden="true">0</span>
      </button>
    </div>

    <div class="hero" aria-hidden="true">
      <!-- A karahi pan with curry, drawn in SVG -->
      <svg class="dish" id="dish" viewBox="0 0 160 110">
        <g class="steam">
          <path d="M60 30c-6-6 6-10 0-18"/>
          <path d="M80 28c-6-6 6-10 0-18"/>
          <path d="M100 30c-6-6 6-10 0-18"/>
        </g>
        <circle cx="16" cy="58" r="9" fill="none" stroke="var(--pan)" stroke-width="5"/>
        <circle cx="144" cy="58" r="9" fill="none" stroke="var(--pan)" stroke-width="5"/>
        <path d="M18 56c0 30 28 46 62 46s62-16 62-46z" fill="var(--pan)"/>
        <ellipse cx="80" cy="56" rx="62" ry="16" fill="#5b524c"/>
        <ellipse cx="80" cy="57" rx="56" ry="12" fill="#c4561f"/>
        <ellipse cx="62" cy="55" rx="11" ry="6" fill="#e48a4c"/>
        <ellipse cx="88" cy="59" rx="12" ry="6" fill="#d97a3c"/>
        <ellipse cx="104" cy="53" rx="9" ry="5" fill="#e48a4c"/>
        <path d="M50 60l6-3M74 52l5 3M96 61l6-2M112 57l4 3" stroke="#3e9a3a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M68 61l7-1M83 51l6 1" stroke="#f5d06b" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <!-- The chili with flames that grow with the spice level -->
      <div class="chili-wrap" id="chiliWrap">
        <svg class="chili-svg" id="chiliSvg" viewBox="0 0 100 150">
          <g class="flames">
            <g transform="translate(50 62)">
              <path class="flame a" d="M0 0C-16-6-14-30-3-46c0 14 9 16 6 30 8-8 10-18 6-28 14 18 10 40-9 44z" fill="#ff7a1a"/>
              <path class="flame b" d="M-18 2C-28-4-26-20-18-30c0 10 6 12 4 22 4-4 6-10 4-16 8 12 6 26-8 26z" fill="#ff9a2e"/>
              <path class="flame c" d="M18 2C8-4 10-20 18-30c0 10 6 12 4 22 4-4 6-10 4-16 8 12 6 26-8 26z" fill="#ff9a2e"/>
              <path class="flame b" d="M0 0C-8-4-8-18-1-26c0 8 5 10 3 17 4-4 5-9 3-14 7 10 5 22-5 23z" fill="#ffd34d"/>
            </g>
          </g>
          <g class="chili">
            <path class="pod" d="M42 66C62 60 74 82 68 108 62 130 42 144 24 140 40 130 46 114 44 94 43 82 36 74 42 66z"/>
            <path d="M50 76c8 4 10 16 8 28" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>
            <path d="M38 68c4-9 18-10 24-2-7-2-15-1-24 2z" fill="#2f8f3a"/>
            <path d="M50 62c0-8 5-14 12-16" fill="none" stroke="#2f8f3a" stroke-width="4" stroke-linecap="round"/>
            <g class="sweat" fill="#8fd3ff">
              <circle cx="74" cy="84" r="3"/>
              <circle cx="20" cy="100" r="2.5"/>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <div class="name">
      <h1>Chicken Karahi</h1>
      <span class="price">PKR 1,450</span>
    </div>
    <p class="serves">Half karahi · serves 2 · fresh naan included</p>

    <div class="spice-head">
      <label for="spice">Spice level</label>
      <span class="level" id="level">No heat</span>
    </div>
    <p class="desc" id="desc">Gentle and warming, good for kids.</p>
    <input type="range" id="spice" min="0" max="4" step="1" value="0" aria-valuetext="No heat">
    <div class="ticks" id="ticks">
      <button type="button" data-v="0" aria-pressed="true">None</button>
      <button type="button" data-v="1" aria-pressed="false">Mild</button>
      <button type="button" data-v="2" aria-pressed="false">Medium</button>
      <button type="button" data-v="3" aria-pressed="false">Hot</button>
      <button type="button" data-v="4" aria-pressed="false">Fire</button>
    </div>

    <div class="buy">
      <div class="qty" role="group" aria-label="Quantity">
        <button type="button" id="minus" aria-label="One less" disabled>−</button>
        <output id="qty" aria-live="polite">1</output>
        <button type="button" id="plus" aria-label="One more">+</button>
      </div>
      <button type="button" class="add" id="add"><span class="label" id="addLabel">Add · PKR 1,450</span></button>
    </div>
    <p class="sr" id="announce" role="status" aria-live="polite"></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const card = $("card");
  const spice = $("spice");
  const fx = $("fx");
  const ticks = Array.from(document.querySelectorAll("#ticks button"));

  // ---- Spice levels: colour, flame size, wobble and words ----
  const LEVELS = [
    { name: "No heat", desc: "Gentle and warming, good for kids.", chili: "#67b346", flame: 0, glow: 0, amp: 0.6, speed: "2.4s" },
    { name: "Mild", desc: "A soft hint of black pepper.", chili: "#a9c23a", flame: 0, glow: 0.1, amp: 1.2, speed: "1.6s" },
    { name: "Medium", desc: "The classic way most people like it.", chili: "#f29a25", flame: 0.38, glow: 0.25, amp: 2, speed: ".9s" },
    { name: "Hot", desc: "For spice lovers. Keep water close.", chili: "#e4402b", flame: 0.72, glow: 0.55, amp: 3.5, speed: ".32s" },
    { name: "Fire", desc: "Extreme heat. You have been warned!", chili: "#b5121e", flame: 1.05, glow: 0.9, amp: 5, speed: ".12s" }
  ];
  const PRICE = 1450;
  let level = 0;
  let qty = 1;
  let cartCount = 0;
  let emberTimer = 0;

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;          // reflow so the animation plays again
    el.classList.add(cls);
  }

  function setLevel(v, fromSlider) {
    v = Math.max(0, Math.min(4, Number(v)));
    const changed = v !== level;
    level = v;
    const L = LEVELS[v];
    if (!fromSlider) spice.value = v;
    card.dataset.level = v;
    card.style.setProperty("--chili", L.chili);
    card.style.setProperty("--flame", L.flame);
    card.style.setProperty("--glow", L.glow);
    card.style.setProperty("--amp", L.amp);
    card.style.setProperty("--speed", L.speed);
    $("level").textContent = L.name;
    $("desc").textContent = L.desc;
    spice.setAttribute("aria-valuetext", L.name + ". " + L.desc);
    ticks.forEach((t) => t.setAttribute("aria-pressed", String(Number(t.dataset.v) === v)));
    if (changed) {
      restart($("level"), "pop");
      restart($("chiliWrap"), "jump");
    }
    // Embers rise from the chili at Hot and Fire
    clearInterval(emberTimer);
    if (v >= 3 && !reduce) emberTimer = setInterval(ember, v === 4 ? 90 : 220);
  }

  function ember() {
    const r = $("chiliSvg").getBoundingClientRect();
    const p = document.createElement("i");
    const s = 3 + Math.random() * 4;
    p.style.width = p.style.height = s + "px";
    p.style.background = Math.random() < 0.5 ? "#ffb02e" : "#ff5a1f";
    p.style.boxShadow = "0 0 6px #ff8a2e";
    fx.append(p);
    const x0 = r.left + r.width * (0.35 + Math.random() * 0.3);
    const y0 = r.top + r.height * 0.3;
    const sway = (Math.random() - 0.5) * 40;
    const rise = 50 + Math.random() * 70;
    p.animate([
      { transform: "translate(" + x0 + "px," + y0 + "px) scale(1)", opacity: 1 },
      { transform: "translate(" + (x0 + sway) + "px," + (y0 - rise) + "px) scale(.3)", opacity: 0 }
    ], { duration: 700 + Math.random() * 500, easing: "ease-out" }).onfinish = () => p.remove();
  }

  spice.addEventListener("input", () => setLevel(spice.value, true));
  ticks.forEach((t) => t.addEventListener("click", () => setLevel(t.dataset.v, false)));

  // ---- Quantity and price ----
  const fmt = (n) => "PKR " + n.toLocaleString("en-US");
  function setQty(n) {
    qty = Math.max(1, Math.min(9, n));
    $("qty").textContent = qty;
    restart($("qty"), "pop");
    $("minus").disabled = qty === 1;
    $("plus").disabled = qty === 9;
    $("addLabel").textContent = "Add · " + fmt(PRICE * qty);
  }
  $("minus").addEventListener("click", () => setQty(qty - 1));
  $("plus").addEventListener("click", () => setQty(qty + 1));

  // ---- Add to order: adding → flies to the cart → added → back to normal ----
  const add = $("add");
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 100) : ms));
  function flyToCart() {
    if (reduce) return Promise.resolve();
    const a = $("dish").getBoundingClientRect();
    const b = $("cart").getBoundingClientRect();
    const p = document.createElement("i");
    p.style.width = p.style.height = "34px";
    p.style.background = "radial-gradient(circle at 40% 35%, #e48a4c, #c4561f 60%, #3a332f 62%)";
    fx.append(p);
    const x0 = a.left + a.width / 2 - 17, y0 = a.top + a.height / 2 - 17;
    const x1 = b.left + b.width / 2 - 17, y1 = b.top + b.height / 2 - 17;
    const anim = p.animate([
      { transform: "translate(" + x0 + "px," + y0 + "px) scale(1)" },
      { transform: "translate(" + (x0 + (x1 - x0) * 0.5) + "px," + (Math.min(y0, y1) - 70) + "px) scale(.8) rotate(160deg)", offset: 0.5 },
      { transform: "translate(" + x1 + "px," + y1 + "px) scale(.25) rotate(320deg)", opacity: 0.6 }
    ], { duration: 750, easing: "cubic-bezier(.45, 0, .55, 1)" });
    return anim.finished.then(() => p.remove());
  }

  add.addEventListener("click", async () => {
    if (add.disabled) return;
    add.disabled = true;
    const label = $("addLabel");
    add.insertAdjacentHTML("afterbegin", '<span class="spin" aria-hidden="true"></span>');
    label.textContent = "Adding…";
    await wait(450);
    await flyToCart();
    cartCount += qty;
    const badge = $("badge");
    badge.textContent = cartCount;
    badge.classList.add("on");
    restart($("cart"), "bump");
    $("cart").setAttribute("aria-label", "Cart, " + cartCount + " items");
    add.querySelector(".spin").remove();
    add.classList.add("done");
    label.textContent = "Added ✓";
    restart(label, "pop");
    $("announce").textContent = "Added " + qty + " Chicken Karahi, " + LEVELS[level].name + ", to your order. Cart has " + cartCount + " items.";
    await wait(1600);
    add.classList.remove("done");
    setQty(1);
    restart(label, "pop");
    add.disabled = false;
  });

  setLevel(0, false);
  setQty(1);
})();
</script>
</body>
</html>
