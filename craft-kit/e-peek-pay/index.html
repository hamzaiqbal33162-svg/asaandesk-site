<!doctype html>
<!-- Chill & Craft · Peek Pay · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peek Pay · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #e9ecf2;
    --card: #ffffff;
    --ink: #0c0d10;
    --muted: #6b7180;
    --line: #e3e6ec;
    --btn: #0c0d10;
    --on-btn: #ffffff;
    --scan: #06b6d4;
    --ok: #16a34a;
    --bad: #e11d48;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #090a0d;
    --card: #14161b;
    --ink: #f3f4f6;
    --muted: #9aa1ae;
    --line: #262a33;
    --btn: #f3f4f6;
    --on-btn: #0c0d10;
    --scan: #22d3ee;
    --ok: #22c55e;
    --bad: #fb7185;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(500px 340px at 50% 30%, rgba(6, 182, 212, .12), transparent 70%), var(--stage);
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .card {
    width: 100%; max-width: 360px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 22px 20px 18px;
    box-shadow: 0 30px 60px -36px rgba(0, 0, 0, .5);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  .merchant { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .avatar { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #fde68a; color: #7c2d12; font-weight: 800; transition: transform .5s var(--spring); }
  .merchant:hover .avatar { transform: rotate(-10deg) scale(1.08); }
  .merchant b { display: block; font-size: 15px; }
  .merchant small { color: var(--muted); font-size: 12.5px; }
  .amount { position: relative; display: inline-block; font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 12px; }
  .amount span { font-size: 16px; color: var(--muted); font-weight: 600; margin-right: 4px; }
  .paid-badge {
    position: absolute; right: -78px; top: 6px;
    padding: 3px 8px; border: 2px solid var(--ok); border-radius: 8px;
    color: var(--ok); font-size: 13px; font-weight: 900; font-style: normal; letter-spacing: .12em;
    transform: rotate(-12deg) scale(0); opacity: 0;
  }
  .amount.paid .paid-badge { opacity: 1; transform: rotate(-12deg) scale(1); transition: transform .45s var(--spring), opacity .2s; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; font-size: 13.5px; }
  li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); }
  li span:last-child { font-weight: 650; }

  /* ---------- Pay button ---------- */
  .pay {
    position: relative;
    width: 100%; height: 66px;
    border: 0; border-radius: 20px;
    background: var(--btn); color: var(--on-btn);
    font: 750 16.5px system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    cursor: pointer; overflow: hidden;
    transition: background .35s, color .35s, box-shadow .35s, transform .45s var(--spring);
    -webkit-tap-highlight-color: transparent;
  }
  .pay:not([aria-disabled]):hover { transform: translateY(-2px); box-shadow: 0 14px 26px -14px rgba(0, 0, 0, .6); }
  .pay:not([aria-disabled]):active { transform: scale(.96); transition-duration: .08s; }
  .pay.press { animation: squash .35s var(--spring); }
  @keyframes squash { 35% { transform: scale(1.03, .88); } 70% { transform: scale(.99, 1.03); } }
  .pay::after { /* soft moving sheen */
    content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .18), transparent);
    animation: sheen 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen { 0%, 60% { left: -40%; } 100% { left: 120%; } }
  .pay::before { /* ripple on success */
    content: ""; position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: rgba(255, 255, 255, .35); transform: scale(0); opacity: 0;
  }
  .pay[data-state="done"]::before { animation: ripple .7s ease-out; }
  @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(9); opacity: 0; } }
  .pay:focus-visible { outline: 3px solid var(--scan); outline-offset: 3px; }
  .pay[aria-disabled="true"] { cursor: default; }

  .face { position: relative; width: 38px; height: 38px; flex: none; transition: transform .45s var(--spring); }
  .face svg { width: 100%; height: 100%; overflow: visible; }
  .face path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .face .brk { transform-box: view-box; transform-origin: 20px 20px; transition: stroke .3s, transform .45s var(--spring); }
  .face .eyes { transition: transform .3s; }
  .pay:not([aria-disabled]):hover .eyes { animation: glance 1.2s ease-in-out; }
  .pay:not([aria-disabled]):hover .brk { transform: scale(1.08); }
  @keyframes glance { 25% { transform: translateX(-2px); } 60% { transform: translateX(2px); } }
  .face .smile, .face .frown, .face .tick { opacity: 0; }
  .face .tick { stroke-dasharray: 30; stroke-dashoffset: 30; }
  .face .scanline { fill: var(--scan); opacity: 0; }
  .face .orbit { fill: none; stroke: var(--scan); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 145; stroke-dashoffset: 145; opacity: 0; transform: rotate(-90deg); transform-origin: 20px 20px; }
  .label { position: relative; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .label.swap { animation: swap .35s var(--spring); }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } }

  /* Anticipation: the face glances around */
  .pay[data-state="look"] .eyes { animation: glance .5s ease-in-out; }
  .pay[data-state="look"] .face { transform: scale(1.1); }

  /* Scanning: progress ring fills, scan line sweeps, brackets hunt */
  .pay[data-state="scan"] { box-shadow: 0 0 0 4px rgba(6, 182, 212, .25), 0 0 30px rgba(6, 182, 212, .35); }
  .pay[data-state="scan"] .face { transform: scale(1.2); }
  .pay[data-state="scan"] .brk { stroke: var(--scan); animation: hunt 1s ease-in-out infinite; }
  .pay[data-state="scan"] .scanline { opacity: .9; animation: sweep .8s ease-in-out infinite alternate; }
  .pay[data-state="scan"] .orbit { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1.6s linear; }
  .pay[data-state="scan"] .eyes { animation: blink 1.6s steps(1) infinite; }
  @keyframes hunt { 50% { transform: scale(.9); opacity: .6; } }
  @keyframes sweep { from { transform: translateY(0); } to { transform: translateY(22px); } }
  @keyframes blink { 0%, 70% { opacity: 1; } 75% { opacity: 0; } 80% { opacity: 1; } }

  /* Matched: brackets snap in, smile, then the face becomes a tick */
  .pay[data-state="ok"], .pay[data-state="done"] { background: var(--ok); color: #fff; box-shadow: 0 0 30px rgba(22, 163, 74, .35); }
  .pay[data-state="ok"] .brk { stroke: #fff; transform: scale(.86); }
  .pay[data-state="ok"] .smile { opacity: 1; }
  .pay[data-state="ok"] .flat { opacity: 0; }
  .pay[data-state="ok"] .face { transform: scale(1.2); }
  .pay[data-state="done"] .brk, .pay[data-state="done"] .eyes, .pay[data-state="done"] .nose, .pay[data-state="done"] .flat { opacity: 0; transition: opacity .2s; }
  .pay[data-state="done"] .tick { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .35s ease-out .1s; }
  .pay[data-state="done"] .face { animation: boing .5s var(--spring); }
  @keyframes boing { 40% { transform: scale(1.35); } 100% { transform: scale(1.1); } }

  /* No match */
  .pay[data-state="fail"] { background: var(--bad); color: #fff; }
  .pay[data-state="fail"] .face { animation: shake .45s ease-in-out 2; }
  .pay[data-state="fail"] .flat { opacity: 0; }
  .pay[data-state="fail"] .frown { opacity: 1; }
  @keyframes shake { 25% { transform: translateX(-5px) rotate(-6deg); } 75% { transform: translateX(5px) rotate(6deg); } }

  /* ---------- Options and receipt ---------- */
  .opts { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 36px; height: 22px; border-radius: 11px; background: var(--line); position: relative; transition: background .2s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .35s var(--spring), width .2s; }
  .switch:active .track::after { width: 20px; }
  .switch input:checked + .track { background: var(--bad); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--scan); outline-offset: 2px; }
  .receipt { display: flex; gap: 10px; align-items: center; margin: 12px 0 0; padding: 10px 12px; border-radius: 14px; border: 1px dashed var(--line); font-size: 13px; animation: slip .5s var(--spring); }
  .receipt[hidden] { display: none; }
  .receipt svg { flex: none; width: 22px; height: 22px; color: var(--ok); }
  @keyframes slip { from { opacity: 0; transform: translateY(-10px) scale(.95); } }

  .bit { position: fixed; z-index: 30; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; pointer-events: none; }

  @media (max-width: 380px) { .paid-badge { right: -70px; font-size: 11px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .pay::after { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="payTitle">
    <div class="merchant">
      <span class="avatar" aria-hidden="true">N</span>
      <div><b id="payTitle">Noor Bakers</b><small>MM Alam Road, Lahore</small></div>
    </div>
    <div class="amount" id="amount"><span>Rs</span>12,400<em class="paid-badge" aria-hidden="true">PAID</em></div>
    <ul>
      <li><span>Birthday cake, 2 kg</span><span>Rs 9,800</span></li>
      <li><span>Cupcakes ×12</span><span>Rs 2,600</span></li>
    </ul>

    <button class="pay" id="pay" type="button" data-state="idle">
      <span class="face" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle class="orbit" cx="20" cy="20" r="23"/>
          <path class="brk" d="M4 13V8a4 4 0 0 1 4-4h5M27 4h5a4 4 0 0 1 4 4v5M36 27v5a4 4 0 0 1-4 4h-5M13 36H8a4 4 0 0 1-4-4v-5"/>
          <path class="eyes" d="M14 15v3M26 15v3"/>
          <path class="nose" d="M20 15v7h-2"/>
          <path class="flat" d="M15 27.5h10"/>
          <path class="smile" d="M14 26c3.5 3.5 8.5 3.5 12 0"/>
          <path class="frown" d="M14 29.5c3.5-3.2 8.5-3.2 12 0"/>
          <path class="tick" d="M11 20.5l6 6L29.5 14"/>
          <rect class="scanline" x="6" y="8" width="28" height="2" rx="1"/>
        </svg>
      </span>
      <span class="label" id="label">Pay Rs 12,400</span>
    </button>

    <div class="opts">
      <span>Saved card ending 4821</span>
      <label class="switch">
        <input type="checkbox" id="failToggle" role="switch">
        <span class="track" aria-hidden="true"></span>
        Simulate no match
      </label>
    </div>
    <p class="receipt" id="receipt" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".15"/><path d="m7 12.5 3.5 3.5L17 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="receiptText"></span>
    </p>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pay = document.getElementById("pay");
    const label = document.getElementById("label");
    const amount = document.getElementById("amount");
    const failToggle = document.getElementById("failToggle");
    const receipt = document.getElementById("receipt");
    const receiptText = document.getElementById("receiptText");
    const live = document.getElementById("live");
    const AMOUNT = "Rs 12,400";

    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 120) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps results readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

    function set(state, text, say) {
      pay.setAttribute("data-state", state);
      if (text && label.textContent !== text) { label.textContent = text; replay(label, "swap"); }
      if (say) live.textContent = say;
      if (state === "idle") pay.removeAttribute("aria-disabled");
      else pay.setAttribute("aria-disabled", "true");
    }

    // Green sparks flying out of the face icon
    function sparks() {
      if (RM || !pay.animate) return;
      const r = pay.querySelector(".face").getBoundingClientRect();
      for (let i = 0; i < 16; i++) {
        const b = document.createElement("i");
        b.className = "bit";
        b.style.left = r.left + r.width / 2 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = ["#22c55e", "#bbf7d0", "#ffffff", "#06b6d4"][i % 4];
        document.body.appendChild(b);
        const a = (Math.PI * 2 * i) / 16, d = 40 + Math.random() * 40;
        b.animate([
          { transform: "translate(0,0) scale(1.2)", opacity: 1 },
          { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }
        ], { duration: 700 + Math.random() * 300, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => b.remove();
      }
    }

    // Count the scan from 0 to 100 percent on the label
    function countScan(ms) {
      return new Promise((resolve) => {
        if (RM) { label.textContent = "Scanning…"; setTimeout(resolve, 400); return; }
        const start = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - start) / ms);
          label.textContent = "Scanning " + Math.round(p * 100) + "%";
          if (p < 1) requestAnimationFrame(step); else resolve();
        };
        requestAnimationFrame(step);
      });
    }

    pay.addEventListener("click", async () => {
      if (pay.getAttribute("data-state") !== "idle") return;
      receipt.hidden = true;
      amount.classList.remove("paid");

      // 1. Anticipation: squash, the face glances around
      replay(pay, "press");
      set("look", "Look at the screen", "Hold still. Checking your face.");
      await wait(550);
      // 2. Progress: ring fills, scan line sweeps, percent counts up
      set("scan");
      await countScan(1600);

      if (failToggle.checked) {
        // 3b. No match: red shake, then let the shopper try again
        set("fail", "Not recognised", "Face not recognised. Payment not made.");
        await hold(1900);
        set("idle", "Try again · " + AMOUNT);
        return;
      }
      // 3. Match: brackets snap in and the face smiles
      set("ok", "Face matched", "Face matched.");
      await wait(600);
      // 4. Done: tick, ripple, sparks, PAID badge and receipt
      const ref = "PP-" + Math.floor(100000 + Math.random() * 900000);
      set("done", "Paid " + AMOUNT, "Payment approved. " + AMOUNT + " paid to Noor Bakers. Reference " + ref + ".");
      sparks();
      amount.classList.add("paid");
      receiptText.textContent = "Paid " + AMOUNT + " to Noor Bakers · Ref " + ref;
      receipt.hidden = false;
      await hold(3000);
      // 5. Reset
      set("idle", "Pay " + AMOUNT);
    });
  })();
</script>
</body>
</html>
