<title>Bead Jar · stats that fill jars with beads</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");

    if (mq.addEventListener) mq.addEventListener("change", apply);

<style>
  /* ---------- Colours: warm sand (light) and cocoa night (dark); bead colours live in the script ---------- */
  :root {
    --bg: #f3e9d7; --bg-2: #fffaf1; --ink: #3b2a1a; --muted: #8a7660; --card: #fffdf8; --line: rgba(59, 42, 26, 0.12);
    --glass: rgba(255, 255, 255, 0.4); --glass-edge: rgba(59, 42, 26, 0.3); --floor: rgba(90, 60, 20, 0.2);
    --shelf-1: #e3c69c; --shelf-2: #b98d5c; --good: #1d8f63; --focus: #3b2a1a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #120e0a; --bg-2: #261d15; --ink: #f6ebdb; --muted: #b8a38a; --card: #2a2119; --line: rgba(255, 235, 210, 0.1);
    --glass: rgba(255, 255, 255, 0.05); --glass-edge: rgba(255, 235, 210, 0.32); --floor: rgba(0, 0, 0, 0.55);
    --shelf-1: #6d5236; --shelf-2: #3f2d1c; --good: #4fd29a; --focus: #ffd27a;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background: radial-gradient(75% 60% at 50% 25%, var(--bg-2), var(--bg));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }

  .stage { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 14px 20px; }
  .head { text-align: center; max-width: 540px; }
  .eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: clamp(25px, 4.3vw, 40px); line-height: 1.07; letter-spacing: -0.03em; font-weight: 800; }
  .lede { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }

  /* ---------- Year tabs with a bead that rolls to the chosen year ---------- */
  .years { position: relative; display: inline-flex; gap: 4px; margin-top: 18px; padding: 4px 4px 12px; }
  .years button { appearance: none; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 750; color: var(--muted); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-variant-numeric: tabular-nums; transition: color 0.3s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .years button[aria-selected="true"] { color: var(--ink); transform: translateY(-2px); }
  .years button:hover { color: var(--ink); }
  .track { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 2px; border-radius: 2px; background: var(--line); }
  .roller {
    position: absolute; bottom: 1px; left: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 12%, #f06a7a 30%, #c22f45 85%);
    transform: translateX(var(--x, 0px)) rotate(var(--spin, 0deg));
    transition: transform 0.75s cubic-bezier(0.3, 1.3, 0.45, 1);
    box-shadow: 0 3px 5px -2px rgba(150, 30, 50, 0.5);
  }

  /* ---------- Jars ---------- */
  /* the canvas reaches 60px above each jar for falling beads and the popping lid, so leave room above */
  .jars { display: grid; grid-template-columns: repeat(4, 176px); gap: 66px 26px; justify-content: center; margin-top: 64px; }
  .stat { margin: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .jar { position: relative; display: block; width: 150px; height: 172px; padding: 0; border: 0; border-radius: 26px; background: none; cursor: pointer; transform-origin: 50% 100%; }
  .jar canvas { position: absolute; left: 0; bottom: 0; width: 150px; height: 232px; pointer-events: none; }
  .jar::after { /* the shelf it stands on */ content: ""; position: absolute; left: -16px; right: -16px; bottom: -9px; height: 9px; border-radius: 5px; background: linear-gradient(180deg, var(--shelf-1), var(--shelf-2)); box-shadow: 0 8px 12px -8px var(--floor); }
  .jar.wobble { animation: wobble 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes wobble { 20% { transform: rotate(-4deg); } 45% { transform: rotate(3deg); } 70% { transform: rotate(-1.5deg); } }
  .jar.shake { animation: shake 0.5s ease-in-out; }
  @keyframes shake { 15%, 55% { transform: translateX(-5px) rotate(-3deg); } 35%, 75% { transform: translateX(5px) rotate(3deg); } }
  .stat figcaption { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .num { font-size: 30px; line-height: 1.05; font-weight: 820; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .num small { font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: 0; }
  .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
  .chip { margin-top: 5px; font-size: 11.5px; font-weight: 750; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); transform: scale(0.6); opacity: 0; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1), opacity 0.25s; }
  .chip.flat { background: var(--line); color: var(--muted); }
  .chip.pop { transform: none; opacity: 1; }

  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; margin: -3px 0 0 -4px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 80vw), var(--gy, 110vh)); transition: transform 0.7s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #e0475b; opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  /* ---------- Phones: two jars per shelf ---------- */
  @media (max-width: 820px) {
    .stage { padding: 12px 14px; }
    .lede .long { display: none; }
    .jars { grid-template-columns: repeat(2, 150px); gap: 48px 34px; margin-top: 46px; }
    .jar { width: 124px; height: 136px; }
    .jar canvas { width: 124px; height: 182px; }
    .head h1 { font-size: 27px; }
    .lede { font-size: 13.5px; }
    .years { margin-top: 12px; }
    .stat figcaption { margin-top: 15px; }
    .num { font-size: 25px; }
    .lbl { font-size: 12px; }
    .chip { margin-top: 3px; }
  }
  @media (max-width: 360px) { .jars { gap: 14px 18px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="head">
    <p class="eyebrow">By the numbers</p>
    <h1>Our year, one bead at a time</h1>
    <p class="lede"><span class="long">Each jar fills to its share of the goal. </span>Pick a year, or tap a jar to shake it.</p>
  </header>
  <div class="years" role="tablist" aria-label="Year">
    <span class="track" aria-hidden="true"><span class="roller" id="roller"></span></span>
  </div>
  <section class="jars" id="jars" aria-label="Stats"></section>
  <p class="sr-only" aria-live="polite" id="status"></p>
</main>
<div class="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

          var p = Math.max(0, Math.min(1, (b.y - b.y0) / Math.max(1, b.ty - b.y0)));
          b.x = b.x0 + (b.tx - b.x0) * (p * p * (3 - 2 * p));
          if (b.y >= b.ty && b.vy > 0) {
            b.y = b.ty; b.vy = -b.vy * 0.3; b.hops++;
            if (b.hops > 2 || Math.abs(b.vy) < 45) { b.st = "rest"; b.y = b.ty; b.x = b.tx; b.vy = 0; }
          }
        });
        (jar.out || []).forEach(function (b) {
          if (b.wait > 0) { b.wait -= dt * 1000; return; }
          b.vy += 1500 * dt; b.y += b.vy * dt; b.x += b.vx * dt; b.a = Math.max(0, b.a - dt * 1.6);
        });
        if (jar.out) jar.out = jar.out.filter(function (b) { return b.a > 0 && b.y < g.H + 20; });

        // draw: floor shadow, glass back, beads, glass front, lid, sparkles
        c.clearRect(0, 0, g.W, g.H);
        c.globalAlpha = 1;
        c.fillStyle = theme["--floor"];
        c.beginPath(); c.ellipse(g.W / 2, g.b + 1, g.W * 0.44, 4, 0, 0, Math.PI * 2); c.fill();
        jarPath(c, g); c.closePath(); c.fillStyle = theme["--glass"]; c.fill();
        c.save(); jarPath(c, g); c.closePath(); c.clip();
        jar.beads.forEach(function (b) { if (b.st === "rest") drawBead(c, b, r); });
        c.restore();
        jar.beads.forEach(function (b) { if (b.st === "fall") drawBead(c, b, r); });
        (jar.out || []).forEach(function (b) { if (b.wait <= 0) drawBead(c, b, r); });
        c.globalAlpha = 1;
        // glass edge and highlights
        c.lineWidth = 2; c.strokeStyle = theme["--glass-edge"]; jarPath(c, g); c.stroke();
        var hl = c.createLinearGradient(g.l + 8, 0, g.l + 20, 0);
        hl.addColorStop(0, "rgba(255,255,255,0)"); hl.addColorStop(0.5, "rgba(255,255,255,0.55)"); hl.addColorStop(1, "rgba(255,255,255,0)");
        c.fillStyle = hl; c.beginPath(); c.roundRect ? c.roundRect(g.l + 9, g.t + 18, 9, g.b - g.t - 46, 5) : c.rect(g.l + 9, g.t + 18, 9, g.b - g.t - 46); c.fill();
        c.fillStyle = "rgba(255,255,255,0.3)"; c.beginPath(); c.ellipse(g.r - 16, g.t + 26, 3, 9, 0.2, 0, Math.PI * 2); c.fill();
        // lid
        c.save();
        c.translate(g.W / 2, g.top + 9 + L.y); c.rotate(L.r);
        var lw = g.nr - g.nl + 12, lg = c.createLinearGradient(0, -8, 0, 8);
        lg.addColorStop(0, jar.s.c[1]); lg.addColorStop(0.45, jar.s.c[0]); lg.addColorStop(1, jar.s.c[2]);
        c.fillStyle = lg; c.beginPath();
        if (c.roundRect) c.roundRect(-lw / 2, -8, lw, 15, 5); else c.rect(-lw / 2, -8, lw, 15);
        c.fill();
        c.fillStyle = "rgba(255,255,255,0.35)"; c.fillRect(-lw / 2 + 6, -5, lw - 12, 2);
        c.restore();
        // sparkles
        jar.sparks.forEach(function (s) {
          s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 40 * dt;
          var a = Math.max(0, 1 - s.life / 0.8), z = s.s * (0.6 + a * 0.6);
          c.globalAlpha = a; c.fillStyle = jar.s.c[1];
          c.beginPath(); c.moveTo(s.x, s.y - z); c.lineTo(s.x + z * 0.3, s.y - z * 0.3); c.lineTo(s.x + z, s.y); c.lineTo(s.x + z * 0.3, s.y + z * 0.3);
          c.lineTo(s.x, s.y + z); c.lineTo(s.x - z * 0.3, s.y + z * 0.3); c.lineTo(s.x - z, s.y); c.lineTo(s.x - z * 0.3, s.y - z * 0.3); c.fill();
        });
        jar.sparks = jar.sparks.filter(function (s) { return s.life < 0.8; });
        c.globalAlpha = 1;
      });
      requestAnimationFrame(frame);
    }

    /* ---------- Auto-demo ---------- */
    var ghost = $(".ghost"), demoOn = !reduce.matches, timers = [], round = 0;
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function ghostAt(x, y) { ghost.style.setProperty("--gx", x + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function ghostOver(el, fx, fy) { var r = el.getBoundingClientRect(); ghost.classList.add("show"); ghostAt(r.left + r.width * fx, r.top + r.height * fy); }
    function tap(then) { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); then(); }, 170); }
    function stopDemo() { if (!demoOn) return; demoOn = false; timers.forEach(clearTimeout); ghost.classList.remove("show", "tap"); }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) {
      addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true });
    });
    function demo() {
      if (!demoOn) return;
      var seq = [2025, 2024, 2026], y = seq[round % 3];
      round++;
      var t = tabs[YEARS.indexOf(y)];
      later(function () { ghostOver(t, 0.55, 0.6); }, 0);
      later(function () { tap(function () { setYear(y); }); }, 780);
      if (round % 3 === 0) {
        later(function () { ghostOver(J[1].btn, 0.5, 0.6); }, 3300);
        later(function () { tap(function () { shake(J[1]); }); }, 4100);
      }
      later(function () { ghost.classList.remove("show"); }, round % 3 === 0 ? 4800 : 3300);
      later(demo, round % 3 === 0 ? 6200 : 5000);
    }

    /* ---------- Start ---------- */
    readTheme();
    J.forEach(layoutJar);
    var mq = matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { setTimeout(readTheme, 0); });
    var rt = 0;
    addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { J.forEach(layoutJar); moveRoller(YEARS.indexOf(year)); }, 120); });
    requestAnimationFrame(frame);
    ghostAt(innerWidth * 0.8, innerHeight + 40);
    roller.style.transition = "none";
    moveRoller(2);
    void roller.offsetWidth;
    roller.style.transition = "";
    setTimeout(function () { setYear(2026); }, reduce.matches ? 0 : 250);
    if (demoOn) later(demo, 3000);
  })();
</script>
