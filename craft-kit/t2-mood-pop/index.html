<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mood Pop · Reaction burst button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg-a: #ff5f8f;
    --bg-b: #ffb35c;
    --card: #ffffff;
    --ink: #2a1530;
    --muted: #7a6680;
    --line: rgba(42, 21, 48, 0.1);
    --soft: #fbf3f7;
    --tray: #ffffff;
    --focus: #d12a6a;
    --shadow: rgba(120, 20, 60, 0.45);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg-a: #3a0f2c;
    --bg-b: #2a1608;
    --card: #221626;
    --ink: #fbeef6;
    --muted: #b8a2bf;
    --line: rgba(251, 238, 246, 0.1);
    --soft: #2f2034;
    --tray: #33233a;
    --focus: #ff7fb0;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg-b);
  }

  /* ---------- Stage: a sunset gradient with floating dots ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; background: linear-gradient(150deg, var(--bg-a), var(--bg-b)); }
  .dot { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.18); pointer-events: none; animation: drift 14s ease-in-out infinite; }
  @keyframes drift { 50% { transform: translate(20px, -26px); } }

  /* ---------- Post card ---------- */
  .card { position: relative; width: min(430px, 100%); padding: 16px clamp(14px, 4vw, 20px) 14px; border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 40px 80px -42px var(--shadow); }
  .head { display: flex; align-items: center; gap: 10px; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; color: #fff; background: linear-gradient(135deg, #7a5cff, #ff3b6b); }
  .head b { display: block; font-size: 0.92rem; }
  .head small { color: var(--muted); font-size: 0.75rem; }
  .text { margin: 12px 0; font-size: 0.9rem; line-height: 1.5; }
  .pic { border-radius: 18px; overflow: hidden; }
  .pic svg { display: block; width: 100%; height: auto; }
  .flag { transform-box: fill-box; transform-origin: 50% 0; animation: flap 2.6s ease-in-out infinite; }
  .flag:nth-child(2n) { animation-delay: -1.1s; }
  .flag:nth-child(3n) { animation-delay: -1.9s; }
  @keyframes flap { 50% { transform: rotate(8deg) skewX(-6deg); } }
  .steam { animation: steam 3s ease-in-out infinite; }
  @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: 0.8; } 100% { transform: translateY(-10px); opacity: 0; } }

  /* ---------- Summary and actions ---------- */
  .summary { display: flex; align-items: center; gap: 8px; margin: 12px 0 10px; min-height: 26px; font-size: 0.78rem; color: var(--muted); }
  .stack { display: inline-flex; }
  .stack svg { width: 22px; height: 22px; margin-left: -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
  .stack svg:first-child { margin-left: 0; }
  .bar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .react, .more {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 14px 0 9px;
    border: 0;
    border-radius: 14px;
    background: var(--soft);
    color: var(--ink);
    font: inherit;
    font-size: 0.88rem;
    font-weight: 750;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, transform 0.35s cubic-bezier(0.3, 1.7, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .react:hover, .more:hover { transform: translateY(-2px); }
  .react:focus-visible, .more:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .react .ri { width: 26px; height: 26px; display: grid; place-items: center; }
  .react .ri svg { width: 100%; height: 100%; display: block; }
  .react.has { color: var(--rc); background: color-mix(in srgb, var(--rc) 14%, var(--soft)); }
  .rl { display: inline-grid; overflow: hidden; height: 1.3em; line-height: 1.3em; }
  .rl span { grid-area: 1 / 1; }
  .more { padding: 0 12px; font-size: 0.78rem; font-weight: 650; color: var(--muted); }
  .more svg { width: 14px; height: 14px; transition: transform 0.35s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .more[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* ---------- The tray of faces ---------- */
  .tray { position: absolute; z-index: 10; left: -4px; bottom: calc(100% - 2px); display: flex; gap: 4px; padding: 6px 8px; border-radius: 999px; background: var(--tray); box-shadow: 0 0 0 1px var(--line), 0 22px 40px -18px var(--shadow); transform-origin: 30px 100%; }
  .tray[hidden] { display: none; }
  .face { position: relative; width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .face:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .face .fz { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; transition: transform 0.22s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .face svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .face[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--focus); }
  .tip { position: absolute; z-index: 11; left: 0; bottom: calc(100% + 90px); padding: 4px 9px; border-radius: 8px; background: var(--ink); color: var(--card); font-size: 0.72rem; font-weight: 750; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateX(-50%); transition: opacity 0.15s; }
  .tip.show { opacity: 1; }
  /* little life in each face while the tray is open */
  .tray .f-love .eyes { transform-box: fill-box; transform-origin: center; animation: pulse 0.9s ease-in-out infinite; }
  .tray .f-haha { animation: giggle 0.5s ease-in-out infinite; }
  .tray .f-wow .eyes { transform-box: fill-box; transform-origin: center; animation: pop 1.4s ease-in-out infinite; }
  .tray .f-yay .eyes path { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
  .tray .f-hmm { transform-origin: 50% 80%; animation: tilt 2.2s ease-in-out infinite; }
  .tray .f-sad .tear { animation: drip 1.6s ease-in infinite; }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  @keyframes giggle { 50% { transform: translateY(-1.5px) rotate(-4deg); } }
  @keyframes pop { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.3); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes tilt { 50% { transform: rotate(-10deg); } }
  @keyframes drip { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }

  /* ---------- Breakdown ---------- */
  .break { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s cubic-bezier(0.3, 1.2, 0.5, 1); }
  .break.open { grid-template-rows: 1fr; }
  .break > div { overflow: hidden; }
  .rows { list-style: none; margin: 0; padding: 12px 2px 4px; display: grid; gap: 7px; }
  .rows li { display: grid; grid-template-columns: 20px 52px 1fr 26px; align-items: center; gap: 8px; font-size: 0.76rem; }
  .rows svg { width: 20px; height: 20px; display: block; }
  .meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: inherit; background: var(--c); transition: width 0.6s cubic-bezier(0.3, 1.3, 0.5, 1); }
  .rows b { text-align: right; font-variant-numeric: tabular-nums; }
  .fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 20; }
  .fx svg { width: 100%; height: 100%; display: block; }
  .ringfx { border-radius: 50%; border: 3px solid var(--c); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.2; } }
  @media (prefers-reduced-motion: reduce) {
    .dot, .flag, .steam, .tray .f-love .eyes, .tray .f-haha, .tray .f-wow .eyes, .tray .f-yay .eyes path, .tray .f-hmm, .tray .f-sad .tear { animation: none; }
    .react, .more, .more svg, .face .fz, .break, .meter i { transition: none; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="fg" cx="0.4" cy="0.32" r="0.78"><stop offset="0" stop-color="#fff4a8" /><stop offset="0.55" stop-color="#ffd23f" /><stop offset="1" stop-color="#f29c00" /></radialGradient>
    </defs>
  </svg>
  <main class="stage">
    <i class="dot" style="width: 90px; height: 90px; left: 8%; top: 12%" aria-hidden="true"></i>
    <i class="dot" style="width: 50px; height: 50px; right: 10%; top: 20%; animation-delay: -4s" aria-hidden="true"></i>
    <i class="dot" style="width: 130px; height: 130px; right: -30px; bottom: 8%; animation-delay: -8s" aria-hidden="true"></i>
    <article class="card" id="card" aria-labelledby="who">
      <header class="head">

      <div class="pic" aria-hidden="true">

          <rect width="400" height="150" fill="url(#sky)" />

          <g>
            <path class="flag" d="M44 30 l12 4 -6 16z" fill="#ff3b6b" /><path class="flag" d="M84 36 l12 3 -7 16z" fill="#ffd23f" /><path class="flag" d="M124 41 l12 2 -6 16z" fill="#3fc1a5" />
            <path class="flag" d="M164 43 l12 1 -6 16z" fill="#7a5cff" /><path class="flag" d="M204 44 l12 0 -6 16z" fill="#ff8a00" /><path class="flag" d="M244 43 l12 -1 -6 16z" fill="#ff3b6b" />
            <path class="flag" d="M284 41 l12 -2 -6 16z" fill="#ffd23f" /><path class="flag" d="M324 37 l12 -3 -6 16z" fill="#3fc1a5" />
          </g>
          <rect x="60" y="70" width="280" height="80" fill="#c86a3a" />
          <path d="M50 70 H350 L340 58 H60 Z" fill="#ff5f8f" /><path d="M50 70 H350 V76 H50 Z" fill="#d63a6d" />
          <g><rect x="84" y="94" width="10" height="34" fill="#3f6fd8" /><rect x="96" y="90" width="12" height="38" fill="#ffd23f" /><rect x="110" y="98" width="9" height="30" fill="#3fc1a5" /><rect x="121" y="92" width="11" height="36" fill="#7a5cff" /><rect x="134" y="96" width="10" height="32" fill="#ff8a00" /></g>
          <g><rect x="250" y="112" width="60" height="8" rx="2" fill="#3f6fd8" /><rect x="254" y="104" width="54" height="8" rx="2" fill="#ffd23f" /><rect x="250" y="96" width="58" height="8" rx="2" fill="#ff3b6b" /></g>
          <g transform="translate(196 104)"><rect x="-12" y="0" width="24" height="20" rx="4" fill="#fff" /><path d="M12 5 h5 a5 5 0 0 1 0 10 h-5" fill="none" stroke="#fff" stroke-width="3" /><rect x="-12" y="2" width="24" height="6" fill="#b0623a" opacity="0.5" /><path class="steam" d="M-4 -4 q-3 -5 0 -10 M4 -4 q3 -5 0 -10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" /></g>
          <text x="200" y="144" text-anchor="middle" font-size="9" font-weight="800" fill="#fff3e4" font-family="system-ui, sans-serif" letter-spacing="2">STALL 42</text>
        </svg>
      </div>
      <p class="summary"><span class="stack" id="stack" aria-hidden="true"></span><span id="names">Hira, Danish and 84 others</span></p>
      <div class="bar">
        <button class="react" id="react" type="button" aria-expanded="false" aria-controls="tray"><span class="ri" id="ri" aria-hidden="true"></span><span class="rl" id="rl"><span>React</span></span></button>
        <button class="more" id="more" type="button" aria-expanded="false" aria-controls="break"><span><span id="total">86</span> reactions</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
        <div class="tray" id="tray" role="group" aria-label="Pick a reaction" hidden></div>

<script>
  // Mood Pop: a React button that opens a tray of six drawn faces.
  // Open = the tray springs out of the button and the faces pop up one by one, each with its own little habit;
  // they swell like a dock under your pointer. Pick = the face puffs up, the others shrink away, it flies along an arc
  // into the button → the button squashes and bursts: a ring, a spray of tiny copies and sparkles, and the counts update.
  // Picking your current face again takes the reaction back with a sad little drop.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var card = $("card"), reactBtn = $("react"), ri = $("ri"), rl = $("rl"), tray = $("tray"), tip = $("tip"), moreBtn = $("more"), brk = $("break");
    var rowsEl = $("rows"), stackEl = $("stack"), namesEl = $("names"), totalEl = $("total"), status = $("status");
    var KINDS = [
      { k: "love", name: "Love", c: "#ff3b6b", n: 41 },
      { k: "haha", name: "Haha", c: "#e99500", n: 23 },
      { k: "wow", name: "Wow", c: "#ff7a00", n: 12 },
      { k: "yay", name: "Yay", c: "#7a5cff", n: 6 },
      { k: "hmm", name: "Hmm", c: "#1f9e8f", n: 3 },
      { k: "sad", name: "Sad", c: "#3d8bff", n: 1 }
    ];
    var mine = -1, open = false, hot = 0, busy = false;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function done(a) { return a.finished.catch(function () {}); }
    function spring(stiff, damp) {
      var x = 0, v = 0, out = [0];
      for (var i = 0; i < 240; i++) { v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; out.push(x); if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break; }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiff, damp, delay) {
      var c = spring(stiff, damp);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear", delay: delay || 0, fill: "backwards" });
    }

    // ---------- Drawn faces (all share one gradient) ----------
    var MOUTH = 'fill="none" stroke="#6b3300" stroke-width="2" stroke-linecap="round"';
    function face(k) {
      var s = '<svg viewBox="0 0 40 40" class="f-' + k + '"><circle cx="20" cy="20" r="18" fill="url(#fg)"/><circle cx="20" cy="20" r="17.5" fill="none" stroke="rgba(150,80,0,0.28)"/>';
      if (k === "love") s += '<g class="eyes" fill="#ff3b6b"><path d="M11.4 15.4c0-2.3 3-2.9 3.7-.8.7-2.1 3.7-1.5 3.7.8 0 2.2-3.7 4.4-3.7 4.4s-3.7-2.2-3.7-4.4z"/><path d="M21.2 15.4c0-2.3 3-2.9 3.7-.8.7-2.1 3.7-1.5 3.7.8 0 2.2-3.7 4.4-3.7 4.4s-3.7-2.2-3.7-4.4z"/></g><path d="M12.5 24.5c2.4 4.4 12.6 4.4 15 0" ' + MOUTH + '/><circle cx="9.5" cy="23.5" r="2.6" fill="#ff7f9a" opacity="0.55"/><circle cx="30.5" cy="23.5" r="2.6" fill="#ff7f9a" opacity="0.55"/>';
      else if (k === "haha") s += '<path d="M10.5 16.5l4-2.4 4 2.4M21.5 16.5l4-2.4 4 2.4" ' + MOUTH + '/><path d="M10.5 21.5h19c0 6-4.2 9.5-9.5 9.5s-9.5-3.5-9.5-9.5z" fill="#5a2600"/><path d="M14.5 27.6c2.6-2.4 8.4-2.4 11 0-2.6 2.4-8.4 2.4-11 0z" fill="#ff6b81"/><path class="tear" d="M7.6 18.5c-1.2 2.2-1.6 3.6-.2 4.2 1.4.6 2.4-.9 1.3-4.2z" fill="#5ec8ff"/><path class="tear" d="M32.4 18.5c1.2 2.2 1.6 3.6.2 4.2-1.4.6-2.4-.9-1.3-4.2z" fill="#5ec8ff"/>';
      else if (k === "wow") s += '<path d="M10.5 10.5q3.5-2.6 7 0M22.5 10.5q3.5-2.6 7 0" ' + MOUTH + '/><g class="eyes"><circle cx="14" cy="16.5" r="3.8" fill="#fff"/><circle cx="26" cy="16.5" r="3.8" fill="#fff"/><circle cx="14" cy="17" r="2" fill="#3a1a00"/><circle cx="26" cy="17" r="2" fill="#3a1a00"/></g><ellipse cx="20" cy="27.5" rx="3.4" ry="4.4" fill="#5a2600"/>';
      else if (k === "yay") s += '<g class="eyes" fill="#ff7a00"><path d="M14 11.6l1.3 2.7 3 .4-2.2 2 .6 3-2.7-1.5-2.7 1.5.6-3-2.2-2 3-.4z"/><path d="M26 11.6l1.3 2.7 3 .4-2.2 2 .6 3-2.7-1.5-2.7 1.5.6-3-2.2-2 3-.4z"/></g><path d="M11.5 22.5h17c0 5.2-3.8 8.2-8.5 8.2s-8.5-3-8.5-8.2z" fill="#5a2600"/><path d="M15 23h10v2.2H15z" fill="#fff" opacity="0.9"/>';
      else if (k === "hmm") s += '<path d="M10.5 12.5h6M22.5 10.5l6 1.6" ' + MOUTH + '/><circle cx="14" cy="17" r="2.1" fill="#3a1a00"/><circle cx="26" cy="17" r="2.1" fill="#3a1a00"/><path d="M14 27.5l12-2.4" ' + MOUTH + '/>';
      else s += '<path d="M10.5 13.5l6-2M29.5 13.5l-6-2" ' + MOUTH + '/><path d="M11.5 18.5q2.5 1.6 5 0M23.5 18.5q2.5 1.6 5 0" ' + MOUTH + '/><path d="M13.5 29q6.5-5.4 13 0" ' + MOUTH + '/><path class="tear" d="M13 21.5c-1.2 2.2-1.6 3.6-.2 4.2 1.4.6 2.4-.9 1.3-4.2z" fill="#5ec8ff"/>';
      return s + "</svg>";
    }
    var BLANK = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="14.5" cy="17" r="2" fill="currentColor"/><circle cx="25.5" cy="17" r="2" fill="currentColor"/><path d="M13 24c2.2 3.4 11.8 3.4 14 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M31 5v8M27 9h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

    // ---------- Build the tray and the breakdown ----------
    var faces = KINDS.map(function (r, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "face";
      b.tabIndex = -1;
      b.setAttribute("aria-label", r.name);
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="fz">' + face(r.k) + "</span>";
      b.addEventListener("click", function () { pick(i, true); });
      b.addEventListener("focus", function () { setHot(i); });
      tray.appendChild(b);
      return b;
    });
    var rowMeters = KINDS.map(function (r) {
      var li = document.createElement("li");
      li.innerHTML = face(r.k) + "<span>" + r.name + '</span><span class="meter" style="--c:' + r.c + '"><i></i></span><b></b>';
      rowsEl.appendChild(li);
      return { i: li.querySelector(".meter i"), b: li.querySelector("b") };
    });
    ri.innerHTML = BLANK;

    // ---------- Counts, summary and the face stack ----------
    function count(i) { return KINDS[i].n + (mine === i ? 1 : 0); }
    var lastTop = "";
    function summarise() {
      var total = 0, max = 0;
      KINDS.forEach(function (r, i) { total += count(i); max = Math.max(max, count(i)); });
      totalEl.textContent = total;
      namesEl.textContent = mine >= 0 ? "You, Hira and " + (total - 2) + " others" : "Hira, Danish and " + (total - 2) + " others";
      rowMeters.forEach(function (m, i) { m.i.style.width = ((count(i) / max) * 100).toFixed(1) + "%"; m.b.textContent = count(i); });
      var top = KINDS.map(function (r, i) { return i; }).sort(function (a, b) { return count(b) - count(a) || a - b; }).slice(0, 3);
      // your own reaction always shows in the stack
      if (mine >= 0 && top.indexOf(mine) < 0) top[2] = mine;
      var key = top.join();
      if (key !== lastTop) {
        lastTop = key;
        stackEl.innerHTML = top.map(function (i) { return face(KINDS[i].k); }).join("");
        if (!calm.matches && mine >= 0) {
          var mineEl = stackEl.children[top.indexOf(mine)];
          if (mineEl) springTo(mineEl, function (p) { return { transform: "scale(" + (0.2 + 0.8 * p).toFixed(3) + ")" }; }, 280, 11);
        }
      }
    }
    summarise();

    // ---------- Dock-style swelling ----------
    function swell(weights) {
      faces.forEach(function (f, i) {
        var s = 1 + weights[i] * 0.55;
        f.firstElementChild.style.transform = "translateY(" + (-(s - 1) * 22).toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
      });
    }
    function setHot(i) {
      hot = i;
      faces.forEach(function (f, j) { f.tabIndex = j === i ? 0 : -1; });
      if (calm.matches) { swell(faces.map(function (f, j) { return j === i ? 0.5 : 0; })); }
      else swell(faces.map(function (f, j) { var d = Math.abs(j - i); return d === 0 ? 1 : d === 1 ? 0.35 : 0; }));
      var f = faces[i], br = tray.parentNode.getBoundingClientRect(), fr = f.getBoundingClientRect(), k = br.width / tray.parentNode.offsetWidth || 1;
      tip.textContent = mine === i ? KINDS[i].name + " · tap to remove" : KINDS[i].name;
      tip.style.left = ((fr.left - br.left + fr.width / 2) / k).toFixed(1) + "px";
      tip.classList.add("show");
    }
    tray.addEventListener("pointermove", function (e) {
      if (e.pointerType === "touch") return;
      var w = faces.map(function (f) { var r = f.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)); return Math.max(0, 1 - d / 64); });
      swell(w);
      var best = w.indexOf(Math.max.apply(null, w));
      if (best >= 0 && best !== hot) setHot(best);
      swell(w); // smooth dock swelling follows the pointer itself
    });
    tray.addEventListener("pointerleave", function () { swell(faces.map(function () { return 0; })); tip.classList.remove("show"); });

    // ---------- Open and close the tray ----------
    function openTray(fromDemo) {
      if (open || busy) return;
      open = true;
      reactBtn.setAttribute("aria-expanded", "true");
      tray.hidden = false;
      tray.getAnimations().forEach(function (a) { a.cancel(); });
      faces.forEach(function (f, i) { f.getAnimations().forEach(function (a) { a.cancel(); }); f.setAttribute("aria-pressed", String(mine === i)); });
      var start = mine >= 0 ? mine : 0;
      setHot(start);
      if (!fromDemo) faces[start].focus();
      if (calm.matches) return;
      springTo(tray, function (p) { return { transform: "translateY(" + ((1 - p) * 12).toFixed(1) + "px) scale(" + (0.35 + 0.65 * p).toFixed(3) + ")", opacity: Math.min(1, p * 2.5) }; }, 300, 18);
      faces.forEach(function (f, i) { springTo(f, function (p) { return { transform: "translateY(" + ((1 - p) * 22).toFixed(1) + "px) scale(" + (0.3 + 0.7 * p).toFixed(3) + ")", opacity: Math.min(1, p * 2) }; }, 260, 13, 40 + i * 38); });
    }
    function closeTray(returnFocus, keep) {
      if (!open) return Promise.resolve();
      open = false;
      reactBtn.setAttribute("aria-expanded", "false");
      tip.classList.remove("show");
      if (returnFocus) reactBtn.focus();
      if (calm.matches) { tray.hidden = true; swell(faces.map(function () { return 0; })); return Promise.resolve(); }
      faces.forEach(function (f, i) {
        if (i === keep) return;
        f.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(10px) scale(0.3)", opacity: 0 }], { duration: 180, delay: Math.abs(i - (keep == null ? 2 : keep)) * 30, easing: "ease-in", fill: "forwards" });
      });
      var a = tray.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(8px) scale(0.9)" }], { duration: 200, delay: 140, easing: "ease-in", fill: "forwards" });
      return done(a).then(function () {
        if (open) return;
        tray.hidden = true;
        tray.getAnimations().forEach(function (x) { x.cancel(); });
        faces.forEach(function (f) { f.getAnimations().forEach(function (x) { x.cancel(); }); });
        swell(faces.map(function () { return 0; }));
      });
    }

    // ---------- Pick a reaction: flight and burst ----------
    function local(el) { var r = el.getBoundingClientRect(), c = card.getBoundingClientRect(), k = c.width / card.offsetWidth || 1; return { x: (r.left - c.left) / k, y: (r.top - c.top) / k, w: r.width / k, h: r.height / k }; }
    function setLabel(text) {
      var old = rl.lastElementChild;
      if (old && old.textContent === text) return;
      var next = document.createElement("span");
      next.textContent = text;
      rl.appendChild(next);
      if (calm.matches || !old) { if (old) old.remove(); return; }
      done(old.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-110%)", opacity: 0 }], { duration: 200, easing: "ease-in", fill: "forwards" })).then(function () { old.remove(); });
      springTo(next, function (p) { return { transform: "translateY(" + ((1 - p) * 110).toFixed(1) + "%)" }; }, 280, 15);
    }
    function burst(at, i) {
      var r = KINDS[i], ring = document.createElement("i");
      ring.className = "fx ringfx";
      ring.style.setProperty("--c", r.c);
      ring.style.width = ring.style.height = "40px";
      card.appendChild(ring);
      done(ring.animate([{ transform: "translate(" + (at.x - 20) + "px," + (at.y - 20) + "px) scale(0.4)", opacity: 1 }, { transform: "translate(" + (at.x - 20) + "px," + (at.y - 20) + "px) scale(2.4)", opacity: 0 }], { duration: 520, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" })).then(function () { ring.remove(); });
      for (var n = 0; n < 14; n++) {
        var mini = n < 9, e = document.createElement("i");
        e.className = "fx";
        var size = mini ? 16 + Math.random() * 6 : 6;
        e.style.width = e.style.height = size + "px";
        if (mini) e.innerHTML = face(r.k);
        else { e.style.background = n % 2 ? r.c : "#ffd23f"; e.style.clipPath = "polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%)"; }
        card.appendChild(e);
        var a = -Math.PI / 2 + (n / 13 - 0.5) * Math.PI * 1.5 + (Math.random() - 0.5) * 0.3, sp = 90 + Math.random() * 70, frames = [];
        for (var s = 0; s <= 18; s++) {
          var t = (s / 18) * 0.85, x = at.x - size / 2 + Math.cos(a) * sp * t, y = at.y - size / 2 + Math.sin(a) * sp * t + 260 * t * t;
          frames.push({ transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + ((n % 2 ? 1 : -1) * t * 300).toFixed(0) + "deg) scale(" + (s < 3 ? 0.4 + s * 0.2 : 1).toFixed(2) + ")", opacity: s > 12 ? (18 - s) / 6 : 1 });
        }
        done(e.animate(frames, { duration: 820 + Math.random() * 260, easing: "linear", fill: "forwards" })).then((function (el) { return function () { el.remove(); }; })(e));
      }
    }
    async function pick(i, focusBack) {
      if (busy) return;
      var removing = mine === i, prev = mine;
      busy = true;
      var from = local(faces[i]);
      mine = removing ? -1 : i;
      if (!removing && !calm.matches) {
        // the chosen face puffs up before it leaves the tray
        await done(faces[i].firstElementChild.animate([{ transform: faces[i].firstElementChild.style.transform || "none" }, { transform: "translateY(-14px) scale(1.7)" }], { duration: 140, easing: "ease-out", fill: "forwards" }));
      }
      closeTray(focusBack, removing ? null : i);
      summarise();
      status.textContent = removing ? "Reaction removed." : "You reacted " + KINDS[i].name + ". " + totalEl.textContent + " reactions.";
      if (removing) {
        reactBtn.classList.remove("has");
        setLabel("React");
        if (!calm.matches) {
          // a sad little drop out of the button
          var ghost = document.createElement("i"), at = local(ri);
          ghost.className = "fx";
          ghost.style.width = ghost.style.height = at.w + "px";
          ghost.innerHTML = face(KINDS[prev].k);
          card.appendChild(ghost);
          done(ghost.animate([{ transform: "translate(" + at.x + "px," + at.y + "px)", opacity: 1 }, { transform: "translate(" + at.x + "px," + (at.y + 26) + "px) rotate(-30deg) scale(0.5)", opacity: 0 }], { duration: 480, easing: "cubic-bezier(0.5, 0, 0.8, 0.4)" })).then(function () { ghost.remove(); });
        }
        ri.innerHTML = BLANK;
        if (!calm.matches) springTo(ri, function (p) { return { transform: "scale(" + (0.4 + 0.6 * p).toFixed(3) + ")" }; }, 260, 12);
        busy = false;
        return;
      }
      var r = KINDS[i];
      if (calm.matches) { ri.innerHTML = face(r.k); reactBtn.style.setProperty("--rc", r.c); reactBtn.classList.add("has"); setLabel(r.name); busy = false; return; }
      // the face flies along an arc into the button
      var to = local(ri), g = document.createElement("i");
      g.className = "fx";
      g.style.width = g.style.height = from.w + "px";
      g.innerHTML = face(r.k);
      card.appendChild(g);
      var dx = to.x + to.w / 2 - (from.x + from.w / 2), dy = to.y + to.h / 2 - (from.y + from.h / 2), frames = [];
      for (var s = 0; s <= 22; s++) {
        var t = s / 22, e = 1 - Math.pow(1 - t, 2.4), h = Math.sin(t * Math.PI);
        frames.push({ transform: "translate(" + (from.x + dx * e).toFixed(1) + "px," + (from.y - 14 + (dy + 14) * e - h * 40).toFixed(1) + "px) rotate(" + (t * 360).toFixed(0) + "deg) scale(" + (1.6 - t * (1.6 - to.w / from.w)).toFixed(3) + ")" });
      }
      ri.style.opacity = "0";
      await done(g.animate(frames, { duration: 520, easing: "linear", fill: "forwards" }));
      g.remove();
      ri.style.opacity = "";
      ri.innerHTML = face(r.k);
      reactBtn.style.setProperty("--rc", r.c);
      reactBtn.classList.add("has");
      setLabel(r.name);
      // the button squashes, then everything bursts out of it
      reactBtn.animate([{ transform: "scale(1)" }, { transform: "scale(0.88, 0.94)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
      springTo(ri, function (p) { return { transform: "scale(" + (0.5 + 0.5 * p).toFixed(3) + ") rotate(" + ((1 - p) * 30).toFixed(1) + "deg)" }; }, 300, 9);
      var at = local(ri);
      burst({ x: at.x + at.w / 2, y: at.y + at.h / 2 }, i);
      busy = false;
    }

    // ---------- Events ----------
    reactBtn.addEventListener("click", function () { if (open) closeTray(false); else openTray(false); });
    tray.addEventListener("keydown", function (e) {
      var n = faces.length, i = hot;
      if (e.key === "ArrowRight") i = (hot + 1) % n;
      else if (e.key === "ArrowLeft") i = (hot - 1 + n) % n;
      else if (e.key === "Home") i = 0;
      else if (e.key === "End") i = n - 1;
      else if (e.key === "Escape") { e.preventDefault(); closeTray(true); return; }
      else if (e.key === "Tab") { closeTray(false); return; }
      else return;
      e.preventDefault();
      faces[i].focus();
    });
    document.addEventListener("pointerdown", function (e) { if (open && !tray.contains(e.target) && e.target !== reactBtn && !reactBtn.contains(e.target)) closeTray(false); });
    moreBtn.addEventListener("click", function () {
      var on = moreBtn.getAttribute("aria-expanded") !== "true";
      moreBtn.setAttribute("aria-expanded", String(on));
      brk.classList.toggle("open", on);
    });

    // ---------- Auto demo: open, sweep across, pick; switch; take it back ----------
    var demoOn = !calm.matches, timer = 0, rounds = [[0, 2], [0, 1, 2, 3], [3]], r = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function later(ms) { return new Promise(function (res) { timer = setTimeout(res, ms); }); }
    async function demo() {
      while (demoOn) {
        var path = rounds[r++ % rounds.length];
        await later(r === 1 ? 350 : 1900);
        if (!demoOn) return;
        openTray(true);
        for (var s = 0; s < path.length; s++) {
          await later(s === 0 ? 420 : 230);
          if (!demoOn) return;
          setHot(path[s]);
        }
        await later(380);
        if (!demoOn) return;
        await pick(path[path.length - 1], false);
      }
    }
    if (demoOn) demo();
  })();
</script>
