<!doctype html>
<!-- Chill & Craft · Turf Live · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Turf Live · live hockey scorecard with a moving pitch</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: an electric blue pitch, orange Falcons, magenta Tides, a black scoreboard ---------- */
  :root {
    --bg: #e4eaf4; --bg-2: #f7f9fd; --card: #ffffff; --edge: rgba(13, 24, 48, 0.1); --ink: #0d1830; --muted: #5d6a82; --soft: #f0f3f9; --soft-2: #dfe5f0;
    --home: #ff8a1f; --away: #e8458b; --pitch: #1d5fc4; --pitch-2: #1a56b2; --board: #0b111f; --amber: #ffc94d; --live: #ff3b4e; --good: #1f9d66; --shadow: rgba(10, 30, 70, 0.3); --focus: #1d5fc4;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #04070e; --bg-2: #0f1830; --card: #0c1324; --edge: rgba(255, 255, 255, 0.08); --ink: #eaf0ff; --muted: #94a2c0; --soft: #141d33; --soft-2: #1f2a45;
    --home: #ff9a3c; --away: #ff5d9e; --pitch: #1b56b4; --pitch-2: #184ea3; --board: #060a14; --amber: #ffd36b; --live: #ff5566; --good: #4fd394; --shadow: rgba(0, 0, 0, 0.7); --focus: #ffd36b;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(50% 40% at 15% 0%, rgba(255, 255, 255, 0.7), transparent 70%), radial-gradient(40% 50% at 100% 100%, var(--soft-2), transparent 70%), var(--bg); }
  :root[data-theme="dark"] .stage { background: radial-gradient(50% 40% at 15% 0%, #13224a, transparent 70%), var(--bg); }
  /* floodlight beams */
  .beam { position: absolute; top: -20%; width: 40vmax; height: 140%; background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), transparent 70%); filter: blur(30px); opacity: 0.35; transform-origin: top center; pointer-events: none; animation: sweep 9s ease-in-out infinite alternate; }
  :root[data-theme="dark"] .beam { background: linear-gradient(180deg, rgba(150, 190, 255, 0.25), transparent 70%); }
  .beam.b1 { left: -10%; transform: rotate(-24deg); } .beam.b2 { right: -10%; transform: rotate(24deg); animation-delay: -4s; }
  @keyframes sweep { to { opacity: 0.15; } }

  .card { position: relative; width: min(1000px, 100%); display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; padding: 18px; border-radius: 30px; background: var(--card); border: 1px solid var(--edge); overflow: hidden;
    box-shadow: 0 50px 90px -50px var(--shadow), 0 12px 28px -20px var(--shadow); animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(0.96); } }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(70% 60% at 50% 35%, var(--fc, var(--home)), transparent 70%); mix-blend-mode: soft-light; z-index: 5; }
  .flash.on { animation: flash 1.1s ease-out; }
  @keyframes flash { 10% { opacity: 1; } 100% { opacity: 0; } }
  .main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  /* ---------- Top bar ---------- */
  .bar { display: flex; align-items: center; gap: 10px; }
  .comp { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 750; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp b { color: var(--ink); }
  .live { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: rgba(255, 59, 78, 0.12); color: var(--live); font-size: 11.5px; font-weight: 850; letter-spacing: 0.08em; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 78, 0.6); } 80%, 100% { box-shadow: 0 0 0 7px rgba(255, 59, 78, 0); } }
  .live.off { background: var(--soft); color: var(--muted); }
  .live.off i { animation: none; }
  .ib { flex: none; height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--edge); background: var(--soft); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 750; transition: transform 0.3s cubic-bezier(0.3, 1.8, 0.5, 1), background 0.25s, color 0.25s; }
  .ib:active { transform: scale(0.92); }
  .ib svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ib[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .ib.ring svg { animation: ring 0.8s ease-in-out; transform-origin: 50% 10%; }
  @keyframes ring { 15% { transform: rotate(22deg); } 30% { transform: rotate(-18deg); } 45% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 75% { transform: rotate(4deg); } }

  /* ---------- Scoreboard ---------- */
  .board { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 14px 16px 12px; border-radius: 20px; background: var(--board); color: #fff; overflow: hidden; }
  .board::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.2px); background-size: 6px 6px; pointer-events: none; }
  .team { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .crest { flex: none; width: 46px; height: 52px; }
  .crest.bump { animation: bump 0.8s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes bump { 30% { transform: scale(1.3) rotate(-8deg); } }
  .team > div { min-width: 0; }
  .team strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team span { display: block; font-size: 11.5px; font-weight: 700; opacity: 0.6; letter-spacing: 0.06em; }
  .score { position: relative; display: flex; align-items: center; gap: 8px; font-size: 50px; font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; color: var(--amber); text-shadow: 0 0 18px rgba(255, 201, 77, 0.45); }
  .score .sep { opacity: 0.5; font-size: 34px; }
  .odo { display: inline-block; height: 1em; overflow: hidden; }
  .odo .col { display: flex; flex-direction: column; transition: transform 0.8s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .odo .col span { height: 1em; }
  .clock { position: relative; grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 800; }
  .clock .q { padding: 3px 8px; border-radius: 7px; background: rgba(255, 255, 255, 0.1); }
  .clock .m { font-variant-numeric: tabular-nums; color: var(--amber); }
  .qbar { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .qbar i { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); overflow: hidden; position: relative; }
  .qbar i b { position: absolute; inset: 0; width: calc(var(--f, 0) * 100%); background: var(--amber); border-radius: inherit; }
  .goalword { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; }
  .goalword span { font-size: 56px; font-weight: 900; letter-spacing: 0.06em; color: #fff; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45); opacity: 0; }
  .goalword.on span { animation: slam 1.6s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes slam { 0% { opacity: 0; transform: scale(2.4) rotate(-6deg); } 18% { opacity: 1; transform: scale(0.94); } 28% { transform: scale(1.04); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
  .goalword small { position: absolute; bottom: 14%; font-size: 13px; font-weight: 800; color: #fff; opacity: 0; letter-spacing: 0.04em; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }
  .goalword.on small { animation: sub 1.6s ease forwards; }
  @keyframes sub { 15% { opacity: 0; transform: translateY(8px); } 30%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  /* ---------- Pitch ---------- */
  .pitch { position: relative; border-radius: 18px; overflow: hidden; background: var(--pitch); aspect-ratio: 2 / 1; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lines { fill: none; stroke: rgba(255, 255, 255, 0.85); stroke-width: 2; }
  .net { fill: rgba(255, 255, 255, 0.15); stroke: #fff; stroke-width: 1.6; transform-box: fill-box; }
  .net.rip { animation: rip 0.7s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .net.r { transform-origin: 0 50%; } .net.l { transform-origin: 100% 50%; }
  @keyframes rip { 30% { transform: scaleX(1.7) scaleY(1.08); } 60% { transform: scaleX(0.85); } }
  .pl circle.body { stroke: rgba(0, 0, 0, 0.25); stroke-width: 1.5; }
  .pl.h circle.body { fill: var(--home); } .pl.a circle.body { fill: var(--away); }
  .pl.gk circle.body { stroke: #fff; stroke-width: 2.5; }
  .pl .sh { fill: rgba(0, 0, 0, 0.22); }
  .ball { fill: #fff; filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.9)); }
  .trail { fill: #fff; }
  .hint { position: absolute; left: 12px; top: 10px; padding: 4px 9px; border-radius: 99px; background: rgba(0, 10, 40, 0.45); color: #fff; font-size: 11.5px; font-weight: 750; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 6px; }
  .hint i { width: 8px; height: 8px; border-radius: 50%; background: var(--home); transition: background 0.3s; }
  .hint.a i { background: var(--away); }
  .banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.7); padding: 12px 20px; border-radius: 16px; background: rgba(5, 10, 25, 0.82); color: #fff; text-align: center; opacity: 0; transition: opacity 0.35s, transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; backdrop-filter: blur(6px); }
  .banner.on { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  .banner strong { display: block; font-size: 18px; }
  .banner span { display: block; font-size: 12.5px; opacity: 0.75; margin-top: 2px; }
  .banner button { margin-top: 10px; border: 0; border-radius: 12px; padding: 9px 14px; background: var(--amber); color: #2a1c00; font-weight: 850; font-size: 13px; }

  /* ---------- Momentum ---------- */
  .mom { display: flex; align-items: center; gap: 10px; }
  .mom small { flex: none; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); width: 74px; }
  .mom svg { flex: 1; height: 46px; display: block; min-width: 0; }
  .mom .mid { stroke: var(--soft-2); stroke-width: 1; }
  .mom .h { fill: var(--home); opacity: 0.85; } .mom .a { fill: var(--away); opacity: 0.85; }

  /* ---------- Side panel with tabs ---------- */
  .side { min-width: 0; display: flex; flex-direction: column; border-radius: 22px; background: var(--soft); padding: 6px; }
  .tabs { position: relative; display: flex; padding: 4px; gap: 2px; }
  .tabs .ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 12px; background: var(--card); box-shadow: 0 6px 14px -8px var(--shadow), 0 0 0 1px var(--edge); transition: transform 0.5s cubic-bezier(0.3, 1.45, 0.5, 1), width 0.5s cubic-bezier(0.3, 1.45, 0.5, 1); }
  .tab { position: relative; flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 12px; font-size: 13px; font-weight: 750; color: var(--muted); transition: color 0.2s; }
  .tab[aria-selected="true"] { color: var(--ink); }
  /* the panel takes whatever height the card gives it and scrolls; its own content never stretches the card */
  .panel { position: relative; flex: 1 1 0px; min-height: 0; height: 0; overflow: auto; padding: 8px 8px 10px; scrollbar-width: thin; }
  .panel[hidden] { display: none; }
  .panel.in { animation: pin 0.45s cubic-bezier(0.3, 1.4, 0.5, 1); }
  @keyframes pin { from { opacity: 0; transform: translateY(8px); } }
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .ev { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--edge); animation: evin 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes evin { from { opacity: 0; transform: translateY(-12px) scale(0.96); } }
  .ev .min { flex: none; width: 32px; font-size: 12.5px; font-weight: 850; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev .ic { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--soft); }
  .ev .ic svg { width: 17px; height: 17px; }
  .ev .tx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .ev .tx b { display: block; font-size: 13.5px; }
  .ev .tx span { color: var(--muted); font-size: 12px; }
  .ev.goal { border-color: transparent; background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 20%, var(--card)), var(--card)); }
  .ev.goal .ic { background: var(--tc); }
  .ev .tm { flex: none; width: 4px; align-self: stretch; border-radius: 4px; background: var(--tc); }
  .stats { display: grid; gap: 14px; padding: 6px 4px; }
  .st .row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .st .row span { color: var(--muted); font-weight: 700; font-size: 12px; }
  .st .bars { display: flex; gap: 4px; margin-top: 6px; }
  .st .bars i { height: 8px; border-radius: 99px; transition: flex-grow 0.8s cubic-bezier(0.3, 1.4, 0.5, 1); flex-basis: 0; min-width: 6px; }
  .st .bars .h { background: var(--home); } .st .bars .a { background: var(--away); }
  .pred { padding: 6px 4px; }
  .pred h3 { margin: 2px 0 4px; font-size: 16px; }
  .pred p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .picks { display: grid; gap: 8px; }
  .pk { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; border: 1.5px solid var(--edge); background: var(--card); text-align: left; font-weight: 750; font-size: 14px; transition: border-color 0.25s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1), background 0.25s; }
  .pk:active { transform: scale(0.96); }
  .pk i { width: 14px; height: 14px; border-radius: 50%; background: var(--tc); flex: none; }
  .pk em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 800; color: var(--muted); }
  .pk[aria-pressed="true"] { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, var(--card)); }
  .pk[aria-pressed="true"] em { color: var(--ink); }
  .points { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 16px; background: var(--board); color: #fff; }
  .points b { font-size: 22px; color: var(--amber); font-variant-numeric: tabular-nums; }
  .points.win { animation: win 0.8s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes win { 30% { transform: scale(1.06); } }
  .toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -70px); padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 750; white-space: nowrap; z-index: 6; transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
  .toast.on { transform: translate(-50%, 0); }

  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.82); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--amber); opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  @media (max-width: 820px) {
    .card { grid-template-columns: minmax(0, 1fr); max-width: 480px; padding: 12px; gap: 10px; border-radius: 26px; }
    .main { gap: 10px; }
    .board { padding: 12px 12px 10px; gap: 6px; }
    .crest { width: 36px; height: 41px; }
    .team strong { display: none; }
    .team span { font-size: 15px; opacity: 1; letter-spacing: 0.08em; font-weight: 850; }
    .score { font-size: 40px; gap: 6px; }
    .goalword span { font-size: 40px; }
    .panel { flex: none; height: 214px; }
    .mom svg { height: 38px; }
    .mom small { width: 64px; font-size: 10px; }
    .comp .long { display: none; }
    .ib .lbl { display: none; }
    .ib { padding: 0 10px; }
  }
  @media (max-width: 380px) { .team span { display: none; } .score { font-size: 34px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <span class="beam b1"></span><span class="beam b2"></span>
  <article class="card" id="card" aria-labelledby="matchT">
    <div class="flash" id="flash"></div>
    <div class="main">
      <div class="bar">
        <span class="live" id="live"><i></i><span id="liveT">LIVE</span></span>
        <div class="comp" id="matchT"><b>National Hockey Cup</b><span class="long"> · Final</span></div>
        <button class="ib" id="follow" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg><span class="lbl">Goal alerts</span></button>
        <button class="ib" id="pause" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" id="pauseIc"><path d="M8 5v14M16 5v14"/></svg><span class="lbl" id="pauseT">Pause</span></button>
      </div>

      <div class="board" id="board">
        <div class="team home"><svg class="crest" id="crestH" viewBox="0 0 46 52" aria-hidden="true"><path d="M23 2l20 6v16c0 13-9 22-20 26C12 46 3 37 3 24V8z" fill="#ff8a1f"/><path d="M23 6l16 5v13c0 10-7 18-16 21C14 42 7 34 7 24V11z" fill="#1a1208"/><path d="M12 28c6-2 9-8 11-14 2 6 5 12 11 14-5 1-8 4-11 9-3-5-6-8-11-9z" fill="#ff8a1f"/></svg><div><strong>Lahore Falcons</strong><span>LHR</span></div></div>
        <div class="score" aria-hidden="true"><span class="odo" id="sH"></span><span class="sep">–</span><span class="odo" id="sA"></span></div>
        <div class="team away"><svg class="crest" id="crestA" viewBox="0 0 46 52" aria-hidden="true"><path d="M23 2l20 6v16c0 13-9 22-20 26C12 46 3 37 3 24V8z" fill="#e8458b"/><path d="M23 6l16 5v13c0 10-7 18-16 21C14 42 7 34 7 24V11z" fill="#fff"/><path d="M9 30c4-4 7-4 10 0s7 4 10 0 6-4 9 0M9 22c4-4 7-4 10 0s7 4 10 0 6-4 9 0" fill="none" stroke="#e8458b" stroke-width="3" stroke-linecap="round"/></svg><div><strong>Karachi Tides</strong><span>KHI</span></div></div>
        <div class="clock"><span class="q" id="qT">Q3</span><span class="m" id="mT">31'</span><div class="qbar" id="qbar"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div></div>
        <div class="goalword" id="goalword"><span>GOAL!</span><small id="goalBy"></small></div>
        <p class="sr-only" aria-live="assertive" id="scoreSr">Lahore Falcons 1, Karachi Tides 1</p>
      </div>

      <div class="pitch" id="pitch">
        <svg viewBox="0 0 600 300" aria-label="Live pitch view" role="img">
          <defs><pattern id="stripes" width="60" height="300" patternUnits="userSpaceOnUse"><rect width="30" height="300" fill="var(--pitch)"/><rect x="30" width="30" height="300" fill="var(--pitch-2)"/></pattern></defs>
          <rect width="600" height="300" fill="url(#stripes)"/>
          <g class="lines">
            <rect x="14" y="14" width="572" height="272" rx="2"/><path d="M300 14v272M157 14v272M443 14v272" stroke-dasharray="2 0"/>

      for (var i = 0; i < 70; i++) { var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 4 + Math.random() * 7; bits.push({ x: r.left + r.width * (t ? 0.8 : 0.2), y: r.top + r.height * 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % 4], life: 0 }); }
      if (!fxRaf) fxRaf = requestAnimationFrame(fxStep);
    }
    function fxStep() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      bits = bits.filter(function (b) { return b.life < 90; });
      bits.forEach(function (b) { b.life++; b.vy += 0.2; b.vx *= 0.98; b.x += b.vx; b.y += b.vy; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.min(1, (90 - b.life) / 22); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2 * Math.abs(Math.cos(b.life * 0.2))); ctx.restore(); });
      fxRaf = bits.length ? requestAnimationFrame(fxStep) : 0;
    }

    /* ---------- Auto-demo: plays on load and every few seconds; any real input stops it ---------- */
    var ghost = $("#ghost"), demoOn = !reduce.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function aim(x, y) { ghost.style.setProperty("--gx", Math.min(innerWidth - 30, x) + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function ghostTo(el, then) {
      var r = el.getBoundingClientRect(); ghost.classList.add("show"); aim(r.left + Math.min(r.width * 0.55, 80), r.top + r.height * 0.6);
      later(function () { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (demoOn && then) then(); }, 170); }, 820);
    }
    function stopDemo() { if (!demoOn) return; demoOn = false; timers.forEach(clearTimeout); ghost.classList.remove("show", "tap"); }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }); });
    function demo() {
      if (!demoOn) return;
      later(function () { ghostTo($("#tb2"), function () { selTab(2); }); }, 200);
      later(function () { ghostTo($('.pk[data-t="0"]'), function () { $('.pk[data-t="0"]').click(); S.forceGoal = 0; if (S.min < 56) S.script[S.min + 3] = function () { S.pos = 0; hintUI(); shot(0); }; }); }, 1700); // the demo makes sure its pick pays off
      later(function () { ghostTo($("#follow"), function () { if ($("#follow").getAttribute("aria-pressed") !== "true") $("#follow").click(); }); }, 3300);
      later(function () { ghostTo($("#tb0"), function () { selTab(0); }); }, 5000);
      later(function () { ghost.classList.remove("show"); }, 6300);
      later(function () { ghostTo($("#tb1"), function () { selTab(1); }); }, 11500);
      later(function () { ghostTo($("#tb0"), function () { selTab(0); }); }, 15500);
      later(function () { ghost.classList.remove("show"); }, 16800);
      later(demo, 24000);
    }

    /* ---------- Start: join the final in the third quarter, 1-1 ---------- */
    S.score = [1, 1]; S.st = { posMin: [16, 15], shots: [6, 5], circle: [9, 8], pc: [3, 2], saves: [3, 4], cards: [1, 0] };
    for (var i = 0; i < 24; i++) S.mom.push(Math.sin(i * 0.9) * 0.6 + (rnd() - 0.5) * 0.5);
    [[9, 0, "goal", "Goal! LHR 1–0", "Zain Abbas finishes a short corner"], [18, 1, "card", "Green card", "Rehan Butt off for two minutes"], [24, 1, "goal", "Goal! KHI 1–1", "Kashan Mir slaps it in at the near post"], [30, -1, "whistle", "End of quarter 2", "LHR 1–1 KHI"]].forEach(function (e) { S.min = e[0]; addEv(e[1], e[2], e[3], e[4]); });
    S.min = 31; S.script[33] = function () { S.forceGoal = 0; shot(0); }; // the preview always gets a goal in its first seconds
    $$(".ev").forEach(function (e) { e.style.animation = "none"; });
    scoreUI(); clockUI(); drawMom(); statsUI(); hintUI(); selTab(0); sizeFx();
    addEventListener("resize", function () { sizeFx(); selTab(tabs.findIndex(function (t) { return t.getAttribute("aria-selected") === "true"; })); });
    setTimeout(function () { passLoop(); tickMinute(); }, 700);
    if (demoOn) later(demo, 4200);
  })();
</script>
