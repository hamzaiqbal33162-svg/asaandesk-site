<style>
/* ---------- theme tokens: frosted navy glass over streaks of blue light; a frosted daylight version ---------- */
:root{--font:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
--bg:#e8eefb;--surface:rgba(255,255,255,.58);--surface-solid:#f6f9ff;--surface-2:rgba(255,255,255,.55);--text:#0b1b3a;--muted:#52628a;--line:rgba(80,110,170,.2);--hover:rgba(37,99,235,.08);--accent:#2563eb;--on-accent:#fff;--ring:rgba(37,99,235,.22);
--c1:#2563eb;--c2:#0891b2;--c3:#7c3aed;--c4:#db2777;--c5:#d97706;--c6:#059669;--ok:#047857;--ok-bg:rgba(5,150,105,.12);--bad:#e11d48;--bad-bg:rgba(225,29,72,.1);--warn:#b45309;--warn-bg:rgba(217,119,6,.13);--info-bg:rgba(37,99,235,.1);
--glass-b:rgba(255,255,255,.75);--glass-sh:0 10px 40px -18px rgba(30,60,140,.35),inset 0 1px 0 rgba(255,255,255,.9);--s1:#9cc0ff;--s2:#99f0ff;--s3:#c4b5fd;--streak:rgba(255,255,255,.9);--grid:rgba(11,27,58,.08);--glow:rgba(37,99,235,.35);--r:22px;--r-btn:12px;--r-in:12px;--r-seg:12px;--r-modal:22px;--scrim:rgba(20,40,90,.25)}
[data-theme="dark"]{--bg:#050a1c;--surface:rgba(18,32,72,.42);--surface-solid:#0e1a3c;--surface-2:rgba(40,64,130,.22);--text:#e6eeff;--muted:#8fa3cf;--line:rgba(148,180,255,.16);--hover:rgba(125,170,255,.1);--accent:#60a5fa;--on-accent:#06102a;--ring:rgba(96,165,250,.28);
--c1:#60a5fa;--c2:#22d3ee;--c3:#a78bfa;--c4:#f472b6;--c5:#fbbf24;--c6:#34d399;--ok:#34d399;--ok-bg:rgba(52,211,153,.12);--bad:#fb7185;--bad-bg:rgba(251,113,133,.12);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--info-bg:rgba(96,165,250,.15);
--glass-b:rgba(148,180,255,.2);--glass-sh:0 20px 50px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07);--s1:#1d4ed8;--s2:#0e7490;--s3:#4338ca;--streak:rgba(125,190,255,.55);--grid:rgba(230,238,255,.07);--glow:rgba(96,165,250,.6);--scrim:rgba(2,6,20,.55);--toast-bg:#0e1a3c}
/* ---------- Core UI kit (shared parts, coloured by the theme tokens above) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--field,var(--surface-2));border:1px solid var(--line);border-radius:var(--r-in,10px);padding:.58em .75em;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio],input[type=range],input[type=color]{width:auto;padding:0;box-shadow:none}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:var(--iw,1.8);stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.num,.tnum{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--surface);padding:.55em .95em;border-radius:var(--r-btn,10px);font-weight:600;font-size:.88rem;line-height:1.2;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:.36em .65em;font-size:.78rem}
.btn:disabled{opacity:.5;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-btn,10px);position:relative;color:inherit;transition:background-color .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--hover)}
.ibtn:active{transform:scale(.9)}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);animation:dotPop .4s var(--ease)}
.ibtn .dot[hidden]{display:none}
@keyframes dotPop{from{transform:scale(0)}}
/* segmented control with a sliding pill */
.seg{position:relative;display:inline-flex;padding:3px;background:var(--surface-2);border-radius:var(--r-seg,10px);border:1px solid var(--line);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;padding:.36em .8em;font-size:.8rem;font-weight:600;color:var(--muted);border-radius:calc(var(--r-seg,10px) - 3px);transition:color .2s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--seg-on,var(--text))}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-seg,10px) - 3px);background:var(--seg-pill,var(--surface));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .38s var(--ease),width .38s var(--ease)}
/* badges, deltas, avatars */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg,var(--ring));color:var(--accent)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:.78rem;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.delta .i{width:.95em;height:.95em}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;font-weight:700;flex:none;background:hsl(var(--h) 62% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 75% 86%)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:.76rem}
/* switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background-color .25s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-weight:650;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2,var(--line));white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background-color .15s;cursor:pointer;animation:rowIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num .th-sort{flex-direction:row-reverse}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.th-sort{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.th-sort .i{opacity:.3;transition:transform .25s var(--ease),opacity .2s}
th[aria-sort] .th-sort .i{opacity:1}
th[aria-sort="ascending"] .th-sort .i{transform:rotate(180deg)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 180px;max-width:300px;display:block}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:.34em .8em;border-radius:99px;border:1px solid var(--line);font-size:.78rem;font-weight:650;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--chip-on,var(--accent));border-color:transparent;color:var(--on-accent,#fff)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);font-weight:650;color:var(--text);transition:background-color .2s,transform .15s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent}
.pager button:disabled{opacity:.35;cursor:default}
.empty{display:grid;place-items:center;gap:6px;padding:26px 12px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.55}
/* overlays: modal, drawer */
.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(8,10,20,.48));opacity:0;transition:opacity .24s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ovl.open{opacity:1}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--r-modal,16px);box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line);transform:translateY(18px) scale(.96);transition:transform .34s var(--ease)}
.modal.wide{width:min(780px,100%)}
.ovl.open .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
.m-head h2{font-size:1.06rem}
.m-body{padding:10px 18px 18px;display:grid;gap:12px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.m-text{color:var(--muted)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:650;color:var(--muted)}
.err{color:var(--bad);font-size:.75rem}
.err:empty{display:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100vw);height:100%;background:var(--surface-solid,var(--surface));border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.25);transform:translateX(104%);transition:transform .38s var(--ease);display:flex;flex-direction:column;color:var(--text)}
.ovl.open .drawer{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.06rem}
.d-body{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.d-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
/* popovers and menus */
.pop{position:fixed;z-index:90;min-width:200px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:6px;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:.86rem}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.on{font-weight:700;color:var(--accent)}
.mi.danger{color:var(--bad)}
.pop-t{padding:6px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.notes{max-height:330px;overflow:auto;display:grid;gap:2px}
.note{display:flex;gap:10px;padding:9px 8px;border-radius:8px;font-size:.84rem;align-items:flex-start}
.note .i{margin-top:2px;color:var(--accent)}
.note.new{background:var(--hover)}
.note small{color:var(--muted)}
/* command search */
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);background:var(--surface-solid,var(--surface));border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease);color:var(--text)}
.ovl.open .cmdk{transform:none}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:transparent;box-shadow:none;padding:6px 0;font-size:1rem}
kbd{font:600 .7rem/1 var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.cmdk-list{max-height:min(360px,55vh);overflow:auto;padding:6px}
.cmdk-it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.cmdk-it small{margin-left:auto;color:var(--muted)}
.cmdk-it[aria-selected="true"]{background:var(--hover);color:var(--accent)}
/* toasts */
.toasts{position:fixed;z-index:100;right:16px;bottom:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);box-shadow:0 12px 30px rgba(0,0,0,.28);font-size:.86rem;animation:toastIn .4s var(--ease);transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px) scale(.97)}
.toast.ok .i{color:#7be3a6}.toast.err .i{color:#ff8f8f}.toast.info .i{color:#9cc4ff}
.t-act{font-weight:700;color:#9cc4ff;margin-left:4px;padding:2px 4px;border-radius:6px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* chart tooltip */
.tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;background:var(--tip-bg,rgba(14,17,27,.95));color:var(--tip-fg,#fff);padding:8px 11px;border-radius:10px;font-size:.78rem;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:opacity .12s;min-width:120px;max-width:260px}
.tip.on{opacity:1}
.tip .tr{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;opacity:.82}
.tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.ch{display:block;overflow:visible;max-width:100%;outline:none}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ch text{font-size:11px;fill:var(--axis,var(--muted));font-family:var(--font)}
.ch .grid{stroke:var(--grid,var(--line));stroke-width:1;stroke-dasharray:var(--grid-dash,3 4)}
.ch .zero{stroke:var(--axis,var(--muted));stroke-width:1;opacity:.5}
.ch-line{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ch-line.dash{stroke-dasharray:5 5;stroke-width:1.8;opacity:.85}
.ch.enter .ch-line:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.3s var(--ease) .1s forwards}
.ch.enter .ch-area,.ch.enter .ch-line.dash,.ch.enter .tgt{animation:chFade 1s ease .3s both}
.tgt{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:6 4}
.guide{stroke:var(--axis,var(--muted));stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.hdot{fill:var(--surface-solid,var(--surface));stroke-width:2.5;opacity:0;transition:opacity .15s}
.ch.hover .guide,.ch.hover .hdot{opacity:1}
.ch-bar{transition:opacity .2s}
.ch.enter .ch-bar{transform-box:fill-box;transform-origin:50% 100%;animation:chGrow .8s var(--ease) both;animation-delay:calc(var(--i) * 26ms)}
.ch.enter .ch-bar.neg{transform-origin:50% 0}
.ch.colhover .col:not(.on) .ch-bar{opacity:.38}
.ch-seg{fill:none;transition:stroke-width .25s var(--ease),opacity .2s;cursor:pointer}
.ch-seg.dim{opacity:.35}
.ch.enter .ch-seg{animation:chSweep 1.1s var(--ease) both;animation-delay:calc(var(--i) * 110ms)}
.ch-cell{transform-box:fill-box;transform-origin:center;transition:opacity .15s}
.ch.enter .ch-cell,.ch.enter .ch-cellt{animation:chPop .55s var(--ease) both;animation-delay:calc(var(--i) * 12ms)}
.ch .ch-cellt{font-size:10px;font-weight:600;pointer-events:none}
.ch .ch-cellt.hi{fill:#fff}
.ch.enter .ch-fun{transform-box:fill-box;transform-origin:50% 50%;animation:chGrowX .8s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.ch.enter .ch-gauge{animation:chSweep 1.4s var(--ease) both}
.spark{display:block;overflow:visible}
.sp-l{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.2s var(--ease) .25s forwards}
@keyframes chDraw{to{stroke-dashoffset:0}}
@keyframes chFade{from{opacity:0}}
@keyframes chGrow{from{transform:scaleY(0)}}
@keyframes chGrowX{from{transform:scaleX(0)}}
@keyframes chSweep{from{stroke-dasharray:0 100}}
@keyframes chPop{from{opacity:0;transform:scale(.4)}}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;font-size:.76rem}
.lg button{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:650;padding:2px 0;transition:opacity .2s}
.lg button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn .ch{flex:none}
.dn-l{display:grid;gap:6px;flex:1;min-width:150px;font-size:.82rem}
.dn-l button{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;text-align:left;padding:3px 4px;border-radius:6px}
.dn-l button:hover,.dn-l button:focus-visible{background:var(--hover)}

/* horizontal bar list (HTML): o = {items:[{label,value,color}], fmt, max} */

/* sparkline (returns an SVG string) */
function spark(data, o = {}) {
  const w = o.w || 96, h = o.h || 28, color = o.color || 'var(--accent)';
  if (!data || data.length < 2) return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"></svg>`;

  const pts = data.map((v, i) => [1 + (i * (w - 2)) / (data.length - 1), h - 2 - ((v - mn) / sp) * (h - 4)]), d = pathOf(pts, 'smooth', 0, h);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><title>Trend: ${esc(short(data[0]))} to ${esc(short(data[data.length - 1]))}</title>${o.area === false ? '' : `<path d="${d}L${w - 1},${h}L1,${h}Z" style="fill:${color};opacity:.13"/>`}<path class="sp-l" pathLength="1" d="${d}" style="stroke:${color}"/></svg>`;
}

function makeData() {
  seed(31415);

  const A = ['Arctic', 'Blue', 'Cobalt', 'Crystal', 'Drift', 'Frost', 'Glacier', 'Harbor', 'Iris', 'Lumen', 'Mist', 'North', 'Opal', 'Polar', 'Quartz', 'Silver', 'Snow', 'Tide', 'Vale', 'Zephyr'];
  const B = ['Labs', 'Studio', 'Health', 'Legal', 'Media', 'Partners', 'Works', 'Systems', 'Clinic', 'Academy', 'Retail', 'Ventures'];
  const subs = [];
  for (let k = 0; k < 380; k++) {

    const plan = r < 0.4 ? 'personal' : r < 0.85 ? 'team' : 'biz', seats = plan === 'personal' ? 1 : plan === 'team' ? rint(2, 9) : rint(6, 22), p = plans.find(x => x.id === plan);
    const ev = [{ d: isoD(start), plan, seats, price: p.price * seats }];
    const hz = { personal: 0.0016, team: 0.0009, biz: 0.0005 }[plan]; let cancel = null;
    const life = Math.round(-Math.log(1 - rand()) / hz); if (life < age) cancel = isoD(addDays(start, life));
    const lastDay = cancel ? life : age;
    if (plan !== 'personal' && rand() < 0.35 && lastDay > 40) { const at = rint(20, lastDay - 5), s2 = seats + rint(1, plan === 'team' ? 5 : 8); ev.push({ d: isoD(addDays(start, at)), plan, seats: s2, price: p.price * s2 }); }
    else if (plan === 'personal' && rand() < 0.12 && lastDay > 40) { const at = rint(20, lastDay - 5), s2 = rint(2, 4); ev.push({ d: isoD(addDays(start, at)), plan: 'team', seats: s2, price: 29 * s2 }); }
    else if (plan !== 'personal' && rand() < 0.08 && lastDay > 40) { const at = rint(20, lastDay - 5), s2 = Math.max(1, seats - rint(1, 3)); ev.push({ d: isoD(addDays(start, at)), plan, seats: s2, price: p.price * s2 }); }
    const name = `${pick(A)} ${pick(B)}`;
    subs.push({ id: 's' + k, name, email: `admin@${slugify(name)}${k}.example`, country: pick(['Pakistan', 'UAE', 'United Kingdom', 'Germany', 'Canada', 'United States', 'Saudi Arabia', 'Malaysia']), start: isoD(start), cancel, ev, card: pick(['card', 'card', 'card', 'bank transfer']) });
  }

  const invs = []; let n = 1040;
  subs.filter(s => !s.cancel).sort((a, b) => b.ev[b.ev.length - 1].price - a.ev[a.ev.length - 1].price).slice(0, 60).forEach((s, i) => {
    const day = parseD(s.start).getDate();
    [1, 0].forEach(m => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - m, Math.min(28, day)); if (d > TODAY || d < D0) return; const r = rand(); invs.push({ id: 'INV-' + (n++), sub: s.id, date: isoD(d), amount: s.ev[s.ev.length - 1].price, status: m ? (r < 0.92 ? 'Paid' : r < 0.97 ? 'Overdue' : 'Refunded') : r < 0.7 ? 'Paid' : r < 0.85 ? 'Open' : r < 0.95 ? 'Failed' : 'Overdue' }); });

/* ---------- daily MRR for a year and month-end snapshots, cached ---------- */
function M() {
  if (CACHE) return CACHE;
  const daily = new Array(DAYS).fill(0), byPlan = {}; DB.plans.forEach(p => { byPlan[p.id] = new Array(DAYS).fill(0); });
  DB.subs.forEach(s => {
    const a = Math.max(0, daysBetween(D0, s.start)), b = s.cancel ? Math.min(DAYS, daysBetween(D0, s.cancel)) : DAYS;
    let k = 0;
    for (let i = a; i < b; i++) { const iso = DISO[i]; while (k + 1 < s.ev.length && s.ev[k + 1].d <= iso) k++; if (s.ev[k].d > iso) continue; daily[i] += s.ev[k].price; if (byPlan[s.ev[k].plan]) byPlan[s.ev[k].plan][i] += s.ev[k].price; }
  });
  const ends = MB.map(d => isoD(monthEnd(d))), starts = MB.map(d => isoD(d));
  const mv = { new: [], exp: [], con: [], churn: [] }, cust = [], lost = [];
  MB.forEach((d, m) => {
    const prevEnd = isoD(addDays(d, -1)), end = ends[m]; let n = 0, e = 0, c = 0, ch = 0, active = 0, lo = 0;
    DB.subs.forEach(s => { const a = mrrOf(s, prevEnd), b = mrrOf(s, end); if (b) active++; if (!a && b && s.start >= starts[m]) n += b; else if (a && !b) { ch += a; lo++; } else if (a && b > a) e += b - a; else if (a && b && b < a) c += a - b; });
    mv.new.push(n); mv.exp.push(e); mv.con.push(c); mv.churn.push(ch); cust.push(active); lost.push(lo);
  });
  const mrrEnd = ends.map(iso => sum(DB.subs.map(s => mrrOf(s, iso))));
  const prevM = isoD(addDays(MB[0], -1)), mrrPrev0 = sum(DB.subs.map(s => mrrOf(s, prevM))), custPrev0 = DB.subs.filter(s => mrrOf(s, prevM)).length;
  const logo = cust.map((_, m) => { const base = m ? cust[m - 1] : custPrev0; return base ? (lost[m] / base) * 100 : 0; });
  const rev = mrrEnd.map((_, m) => { const base = m ? mrrEnd[m - 1] : mrrPrev0; return base ? ((mv.churn[m] + mv.con[m]) / base) * 100 : 0; });
  const yr = isoD(addDays(TODAY, -365)); let t0 = 0, t1 = 0; DB.subs.forEach(s => { const a = mrrOf(s, yr); if (a) { t0 += a; t1 += mrrOf(s, isoD(TODAY)); } });
  CACHE = { daily, byPlan, mv, cust, lost, mrrEnd, logo, rev, nrr: t0 ? (t1 / t0) * 100 : 100 };
  return CACHE;
}

/* ---------- signature: a comet runs along the MRR line ---------- */
function comet(el, delay) {
  if (RM || !el) return;
  setTimeout(() => {
    const svg = $('svg', el), line = svg && $('.ch-line:not(.dash)', svg); if (!line || !line.getTotalLength) return;
    let L = 0; try { L = line.getTotalLength(); } catch (e) { return; } if (!L) return;
    $$('.comet,.comet-tail', svg).forEach(x => x.remove());
    const NS = 'http://www.w3.org/2000/svg', seg = L * 0.14, t = document.createElementNS(NS, 'path'), h = document.createElementNS(NS, 'circle');
    t.setAttribute('d', line.getAttribute('d')); t.setAttribute('class', 'comet-tail'); t.style.strokeDasharray = `${seg} ${L + seg}`; t.style.strokeDashoffset = seg;
    h.setAttribute('class', 'comet'); h.setAttribute('r', '5'); svg.append(t, h);
    tween(1500, e => { const pos = e * L, p = line.getPointAtLength(pos); h.setAttribute('cx', p.x); h.setAttribute('cy', p.y); t.style.strokeDashoffset = seg - pos; }, () => { h.classList.add('gone'); t.classList.add('gone'); setTimeout(() => { h.remove(); t.remove(); }, 700); }, t2 => 1 - Math.pow(1 - t2, 2));
  }, delay);
}

  }
});
ACT.goal = () => modal({ title: 'ARR goal', ok: 'Save', body: field('Goal (USD per year)', 'g', { type: 'number', value: DB.goal, min: 1000, step: 1000 }), onOk: f => { if (!validate(f, { g: V.num(1000, 1e10) })) return false; DB.goal = +f.elements.g.value; save(); refresh(); sideArr(); toast('Goal saved'); } });
ACT.exportRev = () => { const x = M(); download('frostline-mrr-daily.csv', csv([['Date', 'MRR', ...DB.plans.map(p => p.name)], ...x.daily.map((v, i) => [DISO[i], v, ...DB.plans.map(p => x.byPlan[p.id][i])])])); };

page('retention', {
  title: 'Retention', icon: 'grid',
  html: () => `<div class="ph rise"><div><h1><b>Retention</b> and churn</h1><p>Monthly cohorts by first payment.</p></div><div class="ph-act">${seg('coh', [['logo', 'Accounts'], ['rev', 'Revenue']], UI.coh, 'Measure')}</div></div>
  <article class="card rise"><div class="card-h"><h2 id="c-h">Account retention</h2><small class="muted" id="c-note"></small></div><div id="c-heat"></div></article>
  <section class="g-2"><article class="card rise"><div class="card-h"><h2>Churn rate</h2></div><div id="c-rate"></div></article><article class="card rise"><div class="card-h"><h2>Lost this month</h2></div><div id="c-lost"></div></article></section>`,
  fill: () => {
    const x = M(), rows = [], data = [], sizes = [];
    MB.forEach((d, s) => {
      const st = isoD(d), en = isoD(monthEnd(d)), mem = DB.subs.filter(z => z.start >= st && z.start <= en), m0 = sum(mem.map(z => z.ev[0].price));
      rows.push(`${MLB[s]} · ${mem.length}`); sizes.push(mem.length);
      data.push(Array.from({ length: 12 }, (_, k) => { if (s + k > 11 || !mem.length) return null; const e = isoD(monthEnd(MB[s + k])); return UI.coh === 'logo' ? (mem.filter(z => mrrOf(z, e) > 0).length / mem.length) * 100 : (sum(mem.map(z => mrrOf(z, e))) / (m0 || 1)) * 100; }));
    });
    $('#c-h').textContent = UI.coh === 'logo' ? 'Account retention' : 'Revenue retention'; $('#c-note').textContent = UI.coh === 'logo' ? 'share still paying' : 'MRR vs the first month, can pass 100%';
    plot('#c-heat', 'heat', { rows, cols: Array.from({ length: 12 }, (_, k) => 'M' + k), data, fmt: 'pct0', max: UI.coh === 'logo' ? 100 : 130, color: 'var(--c2)', lw: 74, ch: 28, rx: 9, valueLabel: UI.coh === 'logo' ? 'Still paying' : 'Revenue kept' });
    plot('#c-rate', 'line', { labels: MLB, series: [{ name: 'Accounts', data: x.logo, color: 'var(--c4)' }, { name: 'Revenue', data: x.rev, color: 'var(--c5)' }], fmt: 'pct', h: 220 });
    const lost = DB.subs.filter(s => s.cancel && s.cancel >= isoD(MB[11])).sort((a, b) => b.cancel.localeCompare(a.cancel));
    $('#c-lost').innerHTML = lost.length ? `<div class="ticker" style="max-height:none">${lost.slice(0, 6).map(s => `<button type="button" class="tk" data-act="subOpen" data-id="${s.id}" style="text-align:left;width:100%">${avatar(s.name)}<span>${esc(s.name)} · ${dd(s.cancel)}</span><b class="neg">−${money(mrrOf(s, isoD(addDays(parseD(s.cancel), -1))))}</b></button>`).join('')}</div>` : `<div class="empty">${ic('heart')}<p>No one left this month</p></div>`;
  }
});
SEG.coh = v => { UI.coh = v; refresh(); };

page('plans', {
  title: 'Plans', icon: 'layers',
  html: () => `<div class="ph rise"><div><h1><b>Plans</b> and pricing</h1><p>What each plan brings in, and a price editor.</p></div></div><section class="plans" id="plans"></section>
  <article class="card rise"><div class="card-h"><h2>Seats sold per plan</h2></div><div id="p-seats"></div></article>`,
  fill: () => {
    const x = M(), today = isoD(TODAY);
    $('#plans').innerHTML = DB.plans.map(p => { const on = activeSubs().filter(s => at(s, today).plan === p.id), seats = sum(on.map(s => at(s, today).seats)), mrr = x.byPlan[p.id][DAYS - 1]; return `<article class="card plan rise" style="--pc:${PCOL[p.id]}"><div class="row" style="justify-content:space-between"><b><span class="dotp"></span>${esc(p.name)}</b><span class="badge">${esc(p.note)}</span></div><div class="price">${money(p.price)}<small> ${esc(p.unit)} / month</small></div><dl><dt>Accounts</dt><dd>${num(on.length)}</dd><dt>Seats</dt><dd>${num(seats)}</dd><dt>MRR</dt><dd>${money(mrr)}</dd><dt>Share of MRR</dt><dd>${pct((mrr / (x.daily[DAYS - 1] || 1)) * 100)}</dd></dl>${spark(tail(x.byPlan[p.id], 90), { w: 280, h: 36, color: PCOL[p.id] })}<div class="row" style="margin-top:12px"><button type="button" class="btn sm primary" data-act="price" data-id="${p.id}">${ic('edit')}Change price</button></div></article>`; }).join('');
    plot('#p-seats', 'bar', { labels: MLB, series: DB.plans.map(p => ({ name: p.name, data: MB.map(d => sum(DB.subs.map(s => { const e = at(s, isoD(monthEnd(d))); return e && e.plan === p.id ? e.seats : 0; }))), color: PCOL[p.id] })), stack: true, h: 230 });
  }
});
ACT.price = b => {
  const p = planBy(b.dataset.id);
  modal({ title: `Price for ${p.name}`, ok: 'Save price', body: field(`Price ${p.unit} per month (USD)`, 'price', { type: 'number', value: p.price, min: 1, step: 1 }) + `<label class="ck"><input type="checkbox" name="all"> <span>Also move current ${esc(p.name)} accounts to the new price today. MRR changes right away.</span></label>`,
    onOk: f => {
      if (!validate(f, { price: V.num(1, 10000) })) return false;
      const np = +f.elements.price.value, all = f.elements.all.checked, today = isoD(TODAY); let moved = 0;
      p.price = np;
      if (all) activeSubs().forEach(s => { const e = at(s, today); if (e.plan !== p.id) return; const ex = s.ev.find(v => v.d === today); if (ex) ex.price = np * ex.seats; else s.ev.push({ d: today, plan: p.id, seats: e.seats, price: np * e.seats }); moved++; });
      save(); refresh(); sideArr(); toast(all ? `${p.name} is ${money(np)} now · ${moved} accounts moved` : `${p.name} is ${money(np)} for new sign-ups`);
      if (all) note(`${p.name} price change applied to ${moved} accounts`, 'layers');
    } });
};

page('customers', {
  title: 'Customers', icon: 'users', count: () => activeSubs().length,
  html: () => `<div class="ph rise"><div><h1><b>Customers</b></h1><p>Every subscription, current and past.</p></div><div class="ph-act"><button type="button" class="btn primary" data-act="newSub">${ic('plus')}Add subscription</button></div></div><article class="card rise"><div id="cu"></div></article>`,
  fill: () => {
    const today = isoD(TODAY);
    table('#cu', { ph: 'Search company, email or country…', size: 9, sort: 'mrr', dir: -1, keys: ['name', 'email', 'country', 'planName'], chips: { k: 'status', values: ['Active', 'Cancelled'] },
      rows: () => DB.subs.map(s => { const e = at(s, today) || s.ev[s.ev.length - 1]; return { id: s.id, name: s.name, email: s.email, country: s.country, plan: e.plan, planName: planBy(e.plan).name, seats: e.seats, mrr: mrrOf(s, today), status: mrrOf(s, today) ? 'Active' : 'Cancelled', start: s.start }; }),
      cols: [{ k: 'name', label: 'Company', f: (v, r) => `<div class="who">${avatar(v)}<span><b>${esc(v)}</b><small>${esc(r.email)}</small></span></div>` }, { k: 'planName', label: 'Plan', f: (v, r) => `<span class="dotp" style="--pc:${PCOL[r.plan]}"></span>${esc(v)}` }, { k: 'seats', label: 'Seats', num: true }, { k: 'status', label: 'Status', f: v => `<span class="badge ${v === 'Active' ? 'ok' : 'bad'}">${v}</span>` }, { k: 'start', label: 'Since', f: v => ddy(v) }, { k: 'country', label: 'Country' }, { k: 'mrr', label: 'MRR', num: true, f: v => `<b>${money(v)}</b>` }],
      onRow: r => subDrawer(subBy(r.id)) });
  }
});
function subDrawer(s) {
  if (!s) return;
  const today = isoD(TODAY), e = at(s, today), last = e || s.ev[s.ev.length - 1], hist = MB.map(d => mrrOf(s, isoD(monthEnd(d))));
  drawer({ title: s.name, kicker: `${s.country} · pays by ${s.card}`,
    body: `<dl class="kv"><dt>Status</dt><dd>${e ? 'Active' : 'Cancelled ' + dd(s.cancel)}</dd><dt>Plan</dt><dd>${esc(planBy(last.plan).name)} · ${last.seats} seat${last.seats > 1 ? 's' : ''}</dd><dt>MRR</dt><dd>${money(e ? e.price : 0)}</dd><dt>Customer since</dt><dd>${ddy(s.start)}</dd><dt>Paid in the last year</dt><dd>${money(sum(hist))}</dd></dl><div><b>MRR by month</b><div id="sd"></div></div><div><b>Invoices</b><div style="margin-top:6px">${DB.invs.filter(i => i.sub === s.id).map(i => `<div class="set-row"><span>${i.id}<small>${dd(i.date)}</small></span><span class="row">${money(i.amount)} <span class="badge ${invKind(i.status)}">${i.status}</span></span></div>`).join('') || '<p class="muted">No recent invoices</p>'}</div></div>`,
    foot: e ? `<button type="button" class="btn danger" data-act="subCancel" data-id="${s.id}">${ic('x')}Cancel</button><div class="grow"></div><button type="button" class="btn primary" data-act="subSeats" data-id="${s.id}">${ic('users')}Change plan or seats</button>` : `<div class="grow"></div><button type="button" class="btn primary" data-act="subBack" data-id="${s.id}">${ic('refresh')}Reactivate</button>`,
    mount: w => plot($('#sd', w), 'bar', { labels: MLB, series: [{ name: 'MRR', data: hist, color: PCOL[last.plan] }], fmt: 'money', h: 150 }) });
}
function pushEv(s, plan, seats) { const today = isoD(TODAY), price = planBy(plan).price * seats, ex = s.ev.find(v => v.d === today); if (ex) Object.assign(ex, { plan, seats, price }); else s.ev.push({ d: today, plan, seats, price }); }
ACT.subOpen = b => subDrawer(subBy(b.dataset.id));
ACT.subSeats = b => {
  const s = subBy(b.dataset.id), e = at(s, isoD(TODAY)); closeLayers();
  modal({ title: `Change plan · ${s.name}`, ok: 'Apply today', body: `<div class="grid2">${field('Plan', 'plan', { type: 'select', value: e.plan, opts: DB.plans.map(p => [p.id, `${p.name} · ${money(p.price)}`]) })}${field('Seats', 'seats', { type: 'number', value: e.seats, min: 1 })}</div><p class="m-text" id="pv-note"></p>`,
    mount: (w, f) => { const upd = () => { const np = planBy(f.elements.plan.value).price * (+f.elements.seats.value || 0); $('#pv-note', w).textContent = `New MRR ${money(np)} (${np >= e.price ? '+' : '−'}${money(Math.abs(np - e.price))})`; }; f.addEventListener('input', upd); upd(); },
    onOk: f => { if (!validate(f, { seats: v => V.num(1, 5000)(v) || (f.elements.plan.value === 'personal' && +v > 1 ? 'Personal is one user' : '') })) return false; const d = formData(f); pushEv(s, d.plan, +d.seats); save(); refresh(); sideArr(); toast('Subscription updated'); } });
};
ACT.subCancel = async b => { const s = subBy(b.dataset.id); if (!(await confirmBox('Cancel subscription?', `${s.name} stops paying ${money(mrrOf(s, isoD(TODAY)))} a month from today.`, 'Cancel subscription'))) return; s.cancel = isoD(TODAY); save(); closeLayers(); refresh(); sideArr(); toast(`${s.name} cancelled`, 'ok', { label: 'Undo', fn: () => { s.cancel = null; save(); refresh(); sideArr(); } }); };
ACT.subBack = b => { const s = subBy(b.dataset.id); const last = s.ev[s.ev.length - 1]; s.cancel = null; pushEv(s, last.plan, last.seats); save(); closeLayers(); refresh(); sideArr(); toast(`${s.name} reactivated`); };
ACT.newSub = () => modal({ title: 'Add subscription', ok: 'Add', body: field('Company', 'name') + field('Admin email', 'email', { type: 'email' }) + `<div class="grid2">${field('Plan', 'plan', { type: 'select', value: 'team', opts: DB.plans.map(p => [p.id, p.name]) })}${field('Seats', 'seats', { type: 'number', value: 3, min: 1 })}</div>`, onOk: f => { if (!validate(f, { name: V.min(2), email: V.email, seats: V.num(1, 5000) })) return false; const d = formData(f), sd = d.plan === 'personal' ? 1 : +d.seats; DB.subs.push({ id: uid('s'), name: d.name, email: d.email, country: 'Pakistan', start: isoD(TODAY), cancel: null, card: 'card', ev: [{ d: isoD(TODAY), plan: d.plan, seats: sd, price: planBy(d.plan).price * sd }] }); save(); refresh(); sideArr(); toast(`${d.name} added · +${money(planBy(d.plan).price * sd)} MRR`); note(`New subscription: ${d.name}`, 'sparkle'); } });

const invKind = s => ({ Paid: 'ok', Open: 'info', Overdue: 'warn', Failed: 'bad', Refunded: '' }[s]);
page('invoices', {
  title: 'Invoices', icon: 'file', count: () => DB.invs.filter(i => ['Failed', 'Overdue'].includes(i.status)).length,
  html: () => `<div class="ph rise"><div><h1><b>Invoices</b></h1><p>Recent billing for the larger accounts.</p></div><div class="ph-act"><button type="button" class="btn" data-act="remindAll">${ic('mail')}Remind all overdue</button></div></div>
  <section class="inv-kpis">${kpi('i-paid', 'Collected')}${kpi('i-open', 'Open')}${kpi('i-risk', 'Failed or overdue')}${kpi('i-ref', 'Refunded')}</section>
  <article class="card rise"><div id="inv"></div></article>`,
  fill: () => {
    const T = st => sum(DB.invs.filter(i => i.status === st).map(i => i.amount));
    setNum('#i-paid', T('Paid'), 'money'); $('#i-paid-f').innerHTML = `<span>${DB.invs.filter(i => i.status === 'Paid').length} invoices</span>`;
    setNum('#i-open', T('Open'), 'money'); setNum('#i-risk', T('Failed') + T('Overdue'), 'money'); $('#i-risk-f').innerHTML = DB.profile.dunning ? '<span>auto-retry is on</span>' : '<span>auto-retry is off</span>'; setNum('#i-ref', T('Refunded'), 'money');
    table('#inv', { ph: 'Search invoice or company…', size: 9, sort: 'date', dir: -1, keys: ['id', 'name'], chips: { k: 'status', values: ['Paid', 'Open', 'Overdue', 'Failed', 'Refunded'] },
      rows: () => DB.invs.map(i => ({ ...i, name: (subBy(i.sub) || { name: 'Deleted' }).name })),
      cols: [{ k: 'id', label: 'Invoice', f: v => `<b>${v}</b>` }, { k: 'name', label: 'Company' }, { k: 'date', label: 'Date', f: v => dd(v) }, { k: 'status', label: 'Status', f: v => `<span class="badge ${invKind(v)}">${v}</span>` }, { k: 'amount', label: 'Amount', num: true, f: v => `<b>${money(v)}</b>` }],
      acts: () => `<button type="button" class="ibtn" data-ra="more" aria-label="Invoice actions">${ic('more')}</button>`,
      onAct: (a, r, b) => invMenu(b, DB.invs.find(i => i.id === r.id)), onRow: r => invMenu(null, DB.invs.find(i => i.id === r.id)) });
  }
});
function invMenu(btn, inv) {
  const items = [];
  if (['Open', 'Overdue', 'Failed'].includes(inv.status)) items.push({ label: 'Mark as paid', icon: 'check', fn: () => setInv(inv, 'Paid', 'Marked as paid') });
  if (inv.status === 'Failed') items.push({ label: 'Retry the charge', icon: 'refresh', fn: () => { const ok = Math.random() < 0.7; setInv(inv, ok ? 'Paid' : 'Failed', ok ? 'Charge went through' : 'Card declined again'); } });
  if (['Open', 'Overdue'].includes(inv.status)) items.push({ label: 'Send a reminder', icon: 'mail', fn: () => { toast(`Reminder sent for ${inv.id}`); note(`Reminder sent for ${inv.id}`, 'mail'); } });
  if (inv.status === 'Paid') items.push({ label: 'Refund', icon: 'repeat', danger: true, fn: async () => { if (await confirmBox('Refund this invoice?', `${money(inv.amount)} goes back to the customer.`, 'Refund')) setInv(inv, 'Refunded', 'Refunded'); } });
  items.push({ label: 'Download as text', icon: 'download', fn: () => { const s = subBy(inv.sub) || { name: '' }; download(`${inv.id}.txt`, `${DB.profile.company}\nInvoice ${inv.id}\nDate: ${ddy(inv.date)}\nBill to: ${s.name}\nAmount: ${money(inv.amount)}\nStatus: ${inv.status}\n`, 'text/plain'); } });
  if (btn) popMenu(btn, items, { title: inv.id });
  else drawer({ title: inv.id, kicker: `${(subBy(inv.sub) || { name: '' }).name} · ${ddy(inv.date)}`, body: `<dl class="kv"><dt>Amount</dt><dd>${money(inv.amount)}</dd><dt>Status</dt><dd>${inv.status}</dd></dl><div class="d-list" style="display:grid;gap:8px">${items.map((it, i) => `<button type="button" class="btn${it.danger ? ' danger' : ''}" data-act="invDo" data-i="${i}">${ic(it.icon)}${esc(it.label)}</button>`).join('')}</div>`, mount: w => { w._items = items; } });
}
ACT.invDo = b => { const w = b.closest('.ovl'); const it = w && w._items && w._items[+b.dataset.i]; closeLayers(); if (it) it.fn(); };
function setInv(inv, st, msg) { inv.status = st; save(); refresh(); toast(`${inv.id}: ${msg}`, st === 'Failed' ? 'err' : 'ok'); }
ACT.remindAll = () => { const n = DB.invs.filter(i => i.status === 'Overdue').length; toast(n ? `Reminders sent for ${n} overdue invoice${n > 1 ? 's' : ''}` : 'Nothing is overdue', n ? 'ok' : 'info'); if (n) note(`${n} overdue reminders sent`, 'mail'); };

page('settings', {
  title: 'Settings', icon: 'cog',
  html: () => `<div class="ph rise"><div><h1><b>Settings</b></h1></div></div>
  <section class="g-2"><article class="card rise"><div class="card-h"><h2>Company</h2></div><form id="co" class="form-grid" novalidate>${field('Company name', 'company', { value: DB.profile.company })}${field('Finance email', 'email', { type: 'email', value: DB.profile.email })}<div><button type="submit" class="btn primary">${ic('check')}Save</button></div></form></article>
  <article class="card rise"><div class="card-h"><h2>Billing and display</h2></div>
    <div class="set-row"><span><b>Auto-retry failed payments</b><small>Try again after 3, 5 and 7 days</small></span><label class="switch"><input type="checkbox" data-p="dunning"${DB.profile.dunning ? ' checked' : ''} aria-label="Auto-retry failed payments"><span></span></label></div>
    <div class="set-row"><span><b>Weekly revenue digest</b><small>Monday morning email</small></span><label class="switch"><input type="checkbox" data-p="digest"${DB.profile.digest ? ' checked' : ''} aria-label="Weekly revenue digest"><span></span></label></div>
    <div class="set-row"><span><b>Theme</b><small>Frosted navy or frosted daylight</small></span><button type="button" class="btn" data-act="theme" data-label="1">Theme</button></div>
    <div class="set-row"><span><b>Demo data</b><small>Rebuild the sample subscriptions</small></span><button type="button" class="btn danger" data-act="reset">${ic('refresh')}Reset demo data</button></div></article></section>`,
  fill: () => {
    const f = $('#co'); if (f._on) return; f._on = 1;
    f.addEventListener('submit', e => { e.preventDefault(); if (!validate(f, { company: V.min(2), email: V.email })) return; Object.assign(DB.profile, formData(f)); save(); $('.top h2 b').textContent = DB.profile.company; toast('Saved'); });
    $$('[data-p]').forEach(c => c.addEventListener('change', () => { DB.profile[c.dataset.p] = c.checked; save(); toast(`${c.getAttribute('aria-label')}: ${c.checked ? 'on' : 'off'}`); }));
  }
});

/* ---------- start ---------- */
APP.cmds = [{ label: 'Add subscription', icon: 'plus', fn: () => ACT.newSub() }, { label: 'Set ARR goal', icon: 'target', fn: () => ACT.goal() }, { label: 'Export daily MRR CSV', icon: 'download', fn: () => ACT.exportRev() }, { label: 'Switch theme', icon: 'moon', fn: () => ACT.theme() }];
APP.onRoute = () => sideArr();
APP.onTheme = () => { if (APP.cur === 'overview') comet($('#o-line'), 50); };
$('#nav').insertAdjacentHTML('beforeend', navLinks());
$('.top h2 b').textContent = DB.profile.company;
note('Glacier Health moved to Business (+$472 MRR)', 'up', 18);
note('2 card payments failed overnight', 'alert', 260);
note('October revenue report is ready', 'file', 60 * 40, true);
startApp();
</script>
</body>
</html>
