  const sk = !!V.sk && !keep && !RM;
  if (sk) { view.classList.add("loading"); skT = setTimeout(() => view.classList.remove("loading"), 380); }
  if (!keep) { view.classList.add("swap"); enter(view); if (prev !== name) window.scrollTo(0, 0); }
  const later = (fn) => (sk ? setTimeout(() => { if (tok === renderTok) fn(); }, 380) : fn());
  const run = (e) => { const b = e.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a; if (GLOBAL_ACTS[a]) GLOBAL_ACTS[a](b); else if (V.act) V.act(a, b, e); };
  view.addEventListener("click", run);
  $("#acts").onclick = run;
  V.wire(view, later, keep);
  countAll(view);
}
const rerender = () => render(UI.cur, true);
FMT.int = (v) => num(Math.round(v));
FMT.pct0 = (v) => Math.round(v) + "%";
FMT.dec1 = (v) => v.toFixed(1) + " days";

function bellCount() { const n = S.notes.filter((x) => !x.read).length; $("#bellN").textContent = n ? String(n) : ""; }
function bellPop(b) {
  popover(b, `<div class="pop-h"><b>Notifications</b><button class="link-btn" type="button" data-read>Mark all read</button></div><ul class="pop-list">${S.notes.slice(0, 6).map((n) => `<li class="${n.read ? "" : "unread"}"><span class="ico acc">${ic("bell")}</span><span>${esc(n.text)}<small>${ago(n.t)}</small></span></li>`).join("")}</ul>`, (p, close) => {
    p.addEventListener("click", (e) => { if (e.target.closest("[data-read]")) { S.notes.forEach((n) => (n.read = true)); save(); bellCount(); close(); toast("All caught up"); } });
  });
}
function mePop(b) {
  popover(b, `<div class="pop-h"><span style="display:flex;gap:10px;align-items:center">${avatar("Hira Qureshi")}<span><b>Hira Qureshi</b><small class="muted" style="display:block;font-size:11.5px">Operations lead · ${city(S.cfg.city)} head office</small></span></span></div><div style="display:flex;gap:8px;padding:6px 14px 14px;flex-wrap:wrap"><a class="btn sm" href="#/settings">${ic("sliders")}Settings</a><button class="btn sm" type="button" data-theme-toggle>${ic("moon")}Switch theme</button></div>`, (p, close) => {
    p.addEventListener("click", (e) => { if (e.target.closest("a, [data-theme-toggle]")) setTimeout(close, 10); });
  });
}
/* Live: a scan somewhere in the network every few seconds */
function scanTick() {
  if (!S || document.hidden) return;
  let p, e;
  if (Math.random() < 0.22) {
    const sl = S.sellers[Math.floor(Math.random() * S.sellers.length)];
    const to = HUBS[Math.floor(Math.random() * HUBS.length)].id;
    p = newBookingFrom({ s: sl.id, to, area: AREAS[to][Math.floor(Math.random() * AREAS[to].length)], rcv: FIRST[Math.floor(Math.random() * FIRST.length)] + " " + LAST[Math.floor(Math.random() * LAST.length)], ph: "03" + Math.floor(Math.random() * 50 + 10) + "-" + Math.floor(1e6 + Math.random() * 9e6), svc: sl.hub === to ? "Same day" : "Overnight", kg: 1, cod: Math.round((800 + Math.random() * 5000) / 50) * 50 });
    e = p.ev[0];
  } else {
    /* never the parcel someone is looking at: its buttons would move under the pointer */
    const pool = S.parcels.filter((x) => ["picked", "origin", "transit", "dest", "out", "booked"].includes(x.st) && !(UI.cur === "parcels" && x.id === UI.sel)).slice(0, 80);
    if (!pool.length) return;
    p = pool[Math.floor(Math.random() * pool.length)];
    e = p.st === "out" && Math.random() < 0.12 ? failP(p, REASONS[Math.floor(Math.random() * REASONS.length)]) : advance(p);
  }
  if (!e) return;
  pushFeed(p, e);
  parcelLive(p);
}
/* Live: a rider collects cash on a doorstep */
function codTick() {
  if (!S || document.hidden) return;
  const on = S.riders.filter((r) => r.status === "On route");
  if (!on.length) return;
  const r = on[Math.floor(Math.random() * on.length)];
  S.day.delivered++;
  collect((Math.floor(Math.random() * 150) + 12) * 50, r, AREAS[r.hub][Math.floor(Math.random() * AREAS[r.hub].length)], r.hub);
}
function init() {
  S = store.get(KEY, null);
  if (!S || S.v !== 1 || !Array.isArray(S.parcels) || !S.parcels.length) { S = seed(); save(); }
  $("#nav").insertAdjacentHTML("beforeend", PAGES.map(([id, label, icon]) => `<a href="#/${id}">${ic(icon)}<span>${label}</span>${id === "cod" ? '<i aria-hidden="true"></i>' : id === "returns" ? '<i class="red" aria-hidden="true"></i>' : ""}</a>`).join(""));
  $(".search-btn").insertAdjacentHTML("afterbegin", ic("search"));
  $("[data-theme-toggle]").innerHTML = ic("moon", "i-moon") + ic("sun", "i-sun");
  $("#bell").insertAdjacentHTML("afterbegin", ic("bell"));
  $(".new-btn").innerHTML = ic("plus") + "<span>New booking</span>";
  $("[data-menu]").innerHTML = ic("menu");
  bellCount();
  initShell(() => pageCmds(PAGES).concat([
    { label: "New booking", icon: "plus", hint: "Bookings", run: newBooking },
    { label: "Scan a parcel", icon: "scan", hint: "Parcels", run: scanDialog },
    { label: "Pay all sellers", icon: "send", hint: "COD", run: () => payDialog(S.sellers.map((s) => s.id)) },
    { label: "New claim", icon: "alert", hint: "Returns", run: claimForm },
    { label: "Plan a line haul truck", icon: "truck", hint: "Hubs", run: tripForm },
    { label: "Add a rider", icon: "user", hint: "Riders", run: riderForm },
    { label: "Collect all riders' cash", icon: "cash", hint: "COD", run: collectAll },
    { label: "Switch theme", icon: "moon", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
    { label: "Reset demo data", icon: "refresh", hint: "Settings", run: resetData },
  ]).concat(S.parcels.slice(0, 30).map((p) => ({ label: "Track " + fmtTN(p.id) + " · " + p.rcv, icon: "box", hint: LBL[p.st], run: () => openParcel(p.id) }))));
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-new]")) newBooking();
    const b = e.target.closest("#bell");
    if (b) bellPop(b);
    const m = e.target.closest("#me");
    if (m) mePop(m);
  });
  addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 4), { passive: true });
  addEventListener("load", moveMarkers);
  setTimeout(moveMarkers, 400);
  startRouter(PAGES.map((p) => p[0]), "overview", render);
  every(2600, scanTick);
  every(3900, codTick);
  every(1000, countdown);
}
init();
</script>
