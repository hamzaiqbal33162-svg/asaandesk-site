<!doctype html>
<!-- Chill & Craft · Courier Desk · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier Desk · Parcels, riders and COD for a courier company</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: night navy with one signal-yellow accent (dark) / paper white with navy ink (light) ---------- */
  :root {
    --bg: #eef1f7; --glow-a: rgba(245, 197, 24, .12); --glow-b: rgba(51, 102, 214, .08);
    --surface: #ffffff; --surface-2: #f2f4f9; --surface-3: #e6eaf3; --panel: #ffffff;
    --ink: #0c1430; --ink-2: #29324f; --muted: #5d6886; --faint: #8b94ad;
    --line: rgba(12, 20, 48, .09); --line-2: rgba(12, 20, 48, .16); --grid: rgba(12, 20, 48, .07);
    --accent: #f5c518; --accent-ink: #161000; --accent-text: #8a6500; --accent-soft: rgba(245, 197, 24, .2);
    --good: #12936a; --bad: #d4453f; --warn: #b87300; --info: #3366d6;
    --good-soft: rgba(18, 147, 106, .12); --bad-soft: rgba(212, 69, 63, .1); --warn-soft: rgba(184, 115, 0, .12); --info-soft: rgba(51, 102, 214, .1);
    --c2: #3d6fe0; --c3: #9aa6c4;
    --t-blue: rgba(61, 111, 224, .09); --t-amber: rgba(245, 197, 24, .18); --t-teal: rgba(18, 147, 106, .1); --t-rose: rgba(212, 69, 63, .08);
    --shadow: 0 1px 2px rgba(12, 20, 48, .05), 0 10px 28px -16px rgba(12, 20, 48, .22);
    --radius: 16px; --radius-sm: 10px;
    --tip-bg: #0c1430; --tip-ink: #fff; --overlay: rgba(8, 12, 28, .45);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #060b18; --glow-a: rgba(255, 210, 63, .06); --glow-b: rgba(80, 110, 210, .12);
    --surface: #0c1427; --surface-2: #121c34; --surface-3: #1a2643; --panel: #0e172c;
    --ink: #e8edf9; --ink-2: #c3cbe1; --muted: #8d99b8; --faint: #5f6b8a;
    --line: rgba(150, 172, 225, .11); --line-2: rgba(150, 172, 225, .2); --grid: rgba(150, 172, 225, .08);
    --accent: #ffd23f; --accent-ink: #171100; --accent-text: #ffd23f; --accent-soft: rgba(255, 210, 63, .13);
    --good: #3fd69a; --bad: #ff6b6b; --warn: #ffb547; --info: #79a6ff;
    --good-soft: rgba(63, 214, 154, .13); --bad-soft: rgba(255, 107, 107, .13); --warn-soft: rgba(255, 181, 71, .13); --info-soft: rgba(121, 166, 255, .13);
    --c2: #6f8fdc; --c3: #46557a;
    --t-blue: rgba(90, 125, 225, .16); --t-amber: rgba(255, 210, 63, .11); --t-teal: rgba(63, 214, 154, .09); --t-rose: rgba(255, 107, 107, .09);
    --shadow: inset 0 1px 0 rgba(255, 255, 255, .03), 0 18px 40px -26px rgba(0, 0, 0, .8);
    --tip-bg: #f3f6fd; --tip-ink: #0c1430; --overlay: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
  /* "Night" cards (hub map, cash counter) stay navy in both themes */
  .night {
    --surface: #0c1427; --surface-2: #131d36; --surface-3: #1b2745;
    --ink: #e8edf9; --ink-2: #c3cbe1; --muted: #8d99b8; --faint: #5f6b8a;
    --line: rgba(150, 172, 225, .13); --line-2: rgba(150, 172, 225, .22); --grid: rgba(150, 172, 225, .08);
    --accent: #ffd23f; --accent-text: #ffd23f; --accent-soft: rgba(255, 210, 63, .14);
    --good: #3fd69a; --bad: #ff6b6b; --warn: #ffb547; --good-soft: rgba(63, 214, 154, .14); --bad-soft: rgba(255, 107, 107, .14); --warn-soft: rgba(255, 181, 71, .14);
    color: var(--ink);
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* =====================================================================
     Courier Desk: app styles
     ===================================================================== */
  html { font-size: 14px; }
  :root { --chart-a: #d9a300; --chart-b: #3d6fe0; --chart-c: #9aa6c4; }
  [data-theme="dark"] { --chart-a: #ffd23f; --chart-b: #6f8fdc; --chart-c: #4b5a80; }
  [data-theme="dark"] .i-moon, :root:not([data-theme="dark"]) .i-sun { display: none; }
  a.btn { text-decoration: none; }
  .cc-chip .cnt { font-weight: 500; opacity: .6; margin-left: 2px; }
  .cc-in { animation-duration: .45s; animation-delay: calc(var(--i, 0) * 40ms); }
  body {
    background:
      radial-gradient(900px 520px at 6% -8%, var(--glow-a), transparent 70%),
      radial-gradient(900px 600px at 96% -12%, var(--glow-b), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font: 13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { color: var(--ink); }
  a { color: inherit; }
  .muted { color: var(--muted); }
  .grow { flex: 1 1 auto; }
  .num, .tab { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: -.01em; }
  .ic { width: 16px; height: 16px; }
  .cc-chart text, .cc-gauge text { font-size: 10.5px; }
  .cc-draw { animation-duration: .85s; }
  .cc-tbl table { font-size: 12.5px; }
  .cc-tbl th { font-size: 10.5px; padding: 8px 10px; }
  .cc-tbl td { padding: 9px 10px; }
  .cc-tbl td.r { white-space: nowrap; }
  .cc-chip { min-height: 30px; font-size: 12px; }
  .cc-chip[aria-pressed="true"] { color: var(--accent-ink); }
  .cc-pages button[aria-current="page"] { color: var(--accent-ink); }
  .cc-dialog { border-radius: 18px; }
  .cc-field label { font-size: 12px; }
  .cc-field input, .cc-field select, .cc-field textarea { min-height: 38px; font-size: 13px; }
  .btn { min-height: 36px; padding: 0 14px; font-size: 13px; font-weight: 600; border-radius: 10px; }
  .btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
  .btn.primary { color: var(--accent-ink); box-shadow: 0 8px 20px -12px var(--accent); }
  .btn .ic { width: 15px; height: 15px; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.icon { width: 32px; padding: 0; min-height: 32px; }

  /* ---------- Top bar: brand, pill nav with a sliding marker, tools ---------- */
  .top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 16px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
  .top.scrolled { border-bottom-color: var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 750; font-size: 16px; letter-spacing: -.02em; white-space: nowrap; flex: none; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin-top: -2px; }
  .nav { position: relative; display: flex; gap: 2px; padding: 4px; margin: 0 auto; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 560; font-size: 13px; white-space: nowrap; transition: color .25s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--accent-ink); }
  .nav a .ic { display: none; }
  .nav a i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .nav a i.red { background: var(--bad); }
  .nav a[aria-current="page"] i { background: var(--accent-ink); }
  .nav .mark { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--accent); box-shadow: 0 6px 18px -8px var(--accent); transition: transform .45s cubic-bezier(.3, 1.2, .5, 1), width .35s; }
  .tools { display: flex; align-items: center; gap: 8px; flex: none; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); transition: transform .15s, background .2s, border-color .2s; }
  .icon-btn:hover { border-color: var(--line-2); background: var(--surface-2); }
  .icon-btn:active { transform: scale(.93); }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
  .badge:empty { display: none; }
  .search-btn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 7px 0 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; }
  .search-btn:hover { border-color: var(--line-2); }
  kbd { padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-2); font: 600 10.5px/1.5 inherit; color: var(--muted); background: var(--surface-2); }
  .me { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 750; font-size: 12px; position: relative; }
  .me::after { content: ""; position: absolute; right: -2px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); border: 2px solid var(--bg); }
  .menu-btn, .scrim { display: none; }

  /* ---------- Page head ---------- */
  main { max-width: 1680px; margin: 0 auto; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 18px 28px 16px; }
  .page-h h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 720; letter-spacing: -.028em; }
  .page-h p { margin: 6px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--muted); font-size: 13px; }
  .page-h p span { display: inline-flex; align-items: center; gap: 7px; }
  .page-h p b { color: var(--ink-2); font-weight: 650; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); animation: livePulse 2s infinite; flex: none; }
  @keyframes livePulse { 50% { box-shadow: 0 0 0 6px transparent; } }
  #view { padding: 0 28px 44px; overflow-x: clip; }
  #view.swap { animation: viewIn .32s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- Grid + cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .grid + .grid { margin-top: 16px; }
  .grid > * { min-width: 0; }
  /* a column of cards inside the grid; minmax(0, 1fr) keeps wide tables inside their own scroll box */
  .stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-content: start; }
  .stack > * { min-width: 0; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
  .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
  .stretch { align-self: stretch; }
  .card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-h h2 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .card-h p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .card-h .seg, .card-h .btn { flex: none; }
  .lift { transition: transform .2s, box-shadow .2s, border-color .2s; }
  .lift:hover { transform: translateY(-2px); border-color: var(--line-2); box-shadow: 0 18px 36px -22px rgba(0, 0, 0, .45); }
  .night { background: radial-gradient(520px 300px at 18% 0%, rgba(255, 210, 63, .07), transparent 70%), radial-gradient(600px 380px at 100% 100%, rgba(90, 125, 225, .12), transparent 70%), #0a1124; border-color: rgba(150, 172, 225, .14); }
  .divider { height: 1px; background: var(--line); margin: 12px 0; border: 0; }

  /* Segmented control */
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface-3); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }

  /* Pills */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); line-height: 1.6; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.plain::before { display: none; }
  .p-good { background: var(--good-soft); color: var(--good); }
  .p-bad { background: var(--bad-soft); color: var(--bad); }
  .p-warn { background: var(--warn-soft); color: var(--warn); }
  .p-info { background: var(--info-soft); color: var(--info); }
  .p-acc { background: var(--accent-soft); color: var(--accent-text); }
  .p-mute { background: var(--surface-2); color: var(--muted); }
  .code { display: inline-grid; place-items: center; min-width: 36px; height: 22px; padding: 0 6px; border-radius: 6px; font: 700 10.5px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; color: var(--accent-text); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .delta { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 6px; font-size: 11px; font-weight: 650; background: var(--good-soft); color: var(--good); }
  .delta.down { background: var(--bad-soft); color: var(--bad); }

  /* KPI tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .tile { position: relative; overflow: hidden; border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); background: linear-gradient(160deg, var(--tint, var(--surface-2)), transparent 140%), var(--surface); box-shadow: var(--shadow); }
  .tile.t-blue { --tint: var(--t-blue); } .tile.t-amber { --tint: var(--t-amber); } .tile.t-teal { --tint: var(--t-teal); } .tile.t-rose { --tint: var(--t-rose); }
  .tile .lbl { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 550; }
  .tile .lbl .ic { color: var(--ink-2); }
  .tile .val { display: block; margin: 8px 0 4px; font-size: 26px; font-weight: 720; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .tile .cc-spark { position: absolute; right: 12px; top: 14px; opacity: .9; }

  /* Lists */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows > li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .rows > li:first-child { border-top: 0; padding-top: 2px; }
  .rows b { font-weight: 620; }
  .rows small { display: block; font-size: 11.5px; color: var(--muted); }
  .rows .amt { margin-left: auto; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); color: var(--ink-2); flex: none; }
  .ico.acc { background: var(--accent-soft); color: var(--accent-text); }
  .ico.good { background: var(--good-soft); color: var(--good); }
  .ico.bad { background: var(--bad-soft); color: var(--bad); }
  .ico.info { background: var(--info-soft); color: var(--info); }
  .feed > li { animation: feedIn .5s cubic-bezier(.2, .9, .3, 1.1) both; }
  .feed > li.new { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-8px); } }
  .bar { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  .bar.blue i { background: var(--c2); }
  .bar.good i { background: var(--good); }
  .bar.bad i { background: var(--bad); }

  /* Skeleton shimmer shown for ~400 ms on data-heavy pages */
  .loading [data-sk] { position: relative; }
  .loading [data-sk] > * { visibility: hidden; }
  .loading [data-sk]::after { content: ""; position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 40%, var(--surface-2) 80%); background-size: 220% 100%; animation: shimmer 1s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  /* ---------- Signature 1: the hub map ---------- */
  .net { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .net > * { min-width: 0; }
  .map { position: relative; border-radius: 12px; overflow: hidden; }
  .map svg { display: block; width: 100%; height: auto; }
  .map .land { fill: rgba(120, 145, 210, .05); stroke: rgba(150, 172, 225, .22); stroke-width: 1; stroke-linejoin: round; }
  .map .dots { fill: rgba(150, 172, 225, .3); }
  .map .river { fill: none; stroke: rgba(110, 160, 255, .22); stroke-width: 1.4; stroke-linecap: round; }
  .map .spoke { stroke: rgba(150, 172, 225, .2); stroke-width: .8; stroke-dasharray: 2 3; }
  .map .town { fill: #8d99b8; }
  .map .town-l { font-size: 8.5px; fill: #8d99b8; }
  .map .lane { fill: none; stroke: rgba(255, 210, 63, .28); stroke-width: 1.3; stroke-dasharray: 3 5; animation: laneFlow 1.6s linear infinite; transition: stroke .3s, opacity .3s; }
  .map .lane-glow { fill: none; stroke: rgba(255, 210, 63, .08); stroke-width: 6; stroke-linecap: round; }
  .map.focus .lane { opacity: .18; }
  .map.focus .lane.on { opacity: 1; stroke: rgba(255, 210, 63, .8); }
  @keyframes laneFlow { to { stroke-dashoffset: -16; } }
  .map .hub-dot { fill: #ffd23f; stroke: #0a1124; stroke-width: 2; }
  .map .hub-ring { fill: none; stroke: #ffd23f; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
  .map .hub-ping { fill: rgba(255, 210, 63, .35); transform-box: fill-box; transform-origin: center; opacity: 0; }
  .map .hub-ping.go { animation: ping .7s ease-out; }
  @keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  @keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(3); opacity: 0; } }
  .map .hub-l { font-size: 11px; font-weight: 700; fill: #e8edf9; paint-order: stroke; stroke: #0a1124; stroke-width: 3px; }
  .map .hub-n { font-size: 9.5px; font-weight: 600; fill: #ffd23f; paint-order: stroke; stroke: #0a1124; stroke-width: 3px; }
  .map .hub { cursor: pointer; }
  .map .hub:focus { outline: none; }
  .map .hub:focus-visible .hub-dot { stroke: #fff; }
  .map .parcel rect { fill: #ffd23f; }
  .map .parcel path { stroke: #7a5b00; stroke-width: 1; }
  .map .parcel.back rect { fill: #ff8f6b; }
  .map-legend { position: absolute; left: 10px; top: 8px; display: flex; gap: 12px; font-size: 10.5px; color: var(--muted); }
  .map-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .map-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #ffd23f; }
  .map-legend i.h { border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 210, 63, .35); }
  .map-legend i.r { background: #ff8f6b; }
  .hubs-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .hubs-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 11px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); cursor: pointer; transition: border-color .2s, background .2s; }
  .hubs-list li:hover, .hubs-list li[aria-pressed="true"] { border-color: rgba(255, 210, 63, .45); background: rgba(255, 210, 63, .05); }
  .hubs-list li.ping { animation: rowPing .7s; }
  @keyframes rowPing { 30% { background: rgba(255, 210, 63, .14); } }
  .hubs-list b { font-weight: 650; }
  .hubs-list small { color: var(--muted); font-size: 11.5px; }
  .hubs-list .io { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hubs-list .io em { font-style: normal; color: var(--ink); font-weight: 650; }
  .hubs-list .bar { grid-column: 2 / 4; height: 4px; }
  .net-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .net-foot div { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
  .net-foot small { display: block; font-size: 11px; color: var(--muted); }
  .net-foot b { font-size: 15px; font-variant-numeric: tabular-nums; }

  /* ---------- Signature 2: the rolling COD cash counter ---------- */
  .odo { --h: 1.3em; min-height: calc(var(--h) + 2px); display: flex; align-items: center; gap: 4px; font-size: 38px; font-weight: 760; font-variant-numeric: tabular-nums; line-height: 1; color: var(--accent-text); margin: 6px 0 2px; }
  .odo .cur { font-size: 15px; font-weight: 700; color: var(--muted); margin-right: 6px; align-self: center; letter-spacing: .04em; }
  .od { position: relative; display: inline-block; width: .74em; height: var(--h); overflow: hidden; border-radius: 9px; background: linear-gradient(180deg, #16223f, #0c1428 48%, #0a1122 52%, #121c35); border: 1px solid rgba(150, 172, 225, .16); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45), 0 6px 16px -10px rgba(255, 210, 63, .5); }
  .od::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .55); box-shadow: 0 1px 0 rgba(255, 255, 255, .05); }
  .od::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0, 0, 0, .35), transparent 30%, transparent 70%, rgba(0, 0, 0, .35)); pointer-events: none; }
  .ods { display: block; transform: translateY(calc(var(--d, 0) * var(--h) * -1)); transition: transform 1.1s cubic-bezier(.2, .85, .25, 1); text-shadow: 0 0 18px rgba(255, 210, 63, .35); }
  .ods.snap { transition: none; }
  .ods i { display: block; height: var(--h); line-height: var(--h); text-align: center; font-style: normal; }
  .odo .sep { width: 6px; align-self: flex-end; margin-bottom: 4px; height: 8px; border-radius: 2px; background: var(--accent-text); opacity: .7; }
  .odo.sm { font-size: 26px; gap: 3px; }
  .odo.sm .od { border-radius: 7px; }
  .cod-flash { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 12px; color: var(--muted); }
  .cod-flash b { color: var(--good); font-variant-numeric: tabular-nums; }
  .cod-flash.go { animation: flash .9s; }
  @keyframes flash { 20% { color: var(--ink); } }
  .coin { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #171100; font-size: 10px; font-weight: 800; flex: none; }
  .cod-flash.go .coin { animation: coin .6s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes coin { from { transform: translateY(-10px) rotate(-90deg) scale(.6); } }
  .split { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-3); gap: 2px; margin: 12px 0 8px; }
  .split i { display: block; height: 100%; transition: flex-grow 1s cubic-bezier(.2, .8, .2, 1); flex: 0 0 auto; }
  .split-l { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 11.5px; color: var(--muted); }
  .split-l b { display: block; color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
  .split-l span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c, var(--accent)); }

  /* Line haul photo card */
  .photo-card { position: relative; overflow: hidden; padding: 0; min-height: 300px; display: flex; flex-direction: column; justify-content: flex-end; }
  .photo-card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 11, 24, .15), rgba(6, 11, 24, .55) 40%, rgba(6, 11, 24, .94)); }
  .photo-card .in { position: relative; padding: 16px 18px; color: #e8edf9; }
  .photo-card .in small { color: #b7c1dc; }
  .photo-card .kick { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: #ffd23f; letter-spacing: .02em; }
  .count3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .count3 div { text-align: center; padding: 8px 0 6px; border-radius: 10px; background: rgba(10, 17, 36, .7); border: 1px solid rgba(150, 172, 225, .18); backdrop-filter: blur(6px); }
  .count3 b { display: block; font-size: 22px; font-weight: 720; font-variant-numeric: tabular-nums; color: #fff; }
  .count3 small { font-size: 10px; letter-spacing: .08em; color: #8d99b8; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 12.5px; cursor: pointer; }
  .check input { width: 17px; height: 17px; accent-color: #ffd23f; margin: 0; }

  /* Media card with a photo on top */
  .media { margin: -16px -18px 14px; height: 150px; border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; position: relative; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  .card:hover .media img { transform: scale(1.04); }

  /* ---------- Bookings ---------- */

  .label-sheet { border: 2px solid var(--ink); border-radius: 12px; padding: 14px; font-size: 12px; background: #fff; color: #0c1430; }

  /* ---------- Parcels: list + tracking timeline ---------- */

  .tl { list-style: none; margin: 0; padding: 0; position: relative; }

  .tl li::before { content: ""; position: absolute; left: 13px; top: 24px; bottom: -2px; width: 2px; background: var(--line-2); }
  .tl li.done::before { background: var(--accent); }
  .tl li:last-child::before { display: none; }
  .tl .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--line-2); color: var(--muted); z-index: 1; }

  .tl li.now .dot { background: var(--surface); border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 0 var(--accent-soft); animation: nowPulse 1.8s infinite; }

  .tl b { font-weight: 640; }
  .tl small { display: block; color: var(--muted); font-size: 11.5px; }

  /* ---------- Riders ---------- */
  .prog { display: grid; gap: 4px; min-width: 110px; }

  const prev = document.activeElement;
  const id = "dlg-" + uid();
  const wrap = document.createElement("div");
  wrap.className = "cc-overlay" + (drawer ? " is-drawer" : "") + (cls ? " " + cls : "");
  wrap.innerHTML = `<div class="cc-back" data-close></div>
    <div class="cc-dialog${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="${id}">
      <header class="cc-dh"><h2 id="${id}">${esc(title)}</h2><button type="button" class="cc-x" data-close aria-label="Close">${ic("x")}</button></header>
      <div class="cc-db">${html}</div>
      ${actions ? '<footer class="cc-df"></footer>' : ""}
    </div>`;
  const dlg = $(".cc-dialog", wrap);
  const api = { el: dlg, body: $(".cc-db", wrap), wrap, close };
  if (actions) {
    const f = $(".cc-df", wrap);
    actions.forEach((a) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.kind || "ghost");
      b.textContent = a.label;
      b.addEventListener("click", () => { const keep = a.fn ? a.fn(api) === false : false; if (!keep && a.close !== false) close(); });
      f.appendChild(b);
    });

  let closed = false;
  function close() {
    if (closed) return;
    closed = true;
    wrap.classList.remove("open");
    setTimeout(() => wrap.remove(), RM ? 0 : 280);
    const at = modals.indexOf(api);
    if (at >= 0) modals.splice(at, 1);
    if (onClose) onClose();
    if (prev && prev.focus && document.contains(prev)) prev.focus();
  }
  wrap.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
  wrap.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = $$(FOCUSABLE, dlg).filter((x) => x.offsetParent !== null || x === document.activeElement);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  document.body.appendChild(wrap);
  modals.push(api);
  requestAnimationFrame(() => wrap.classList.add("open"));
  if (onOpen) onOpen(api);
  const first = $("[autofocus]", dlg) || $$(FOCUSABLE, $(".cc-db", wrap))[0] || $(".cc-x", wrap);
  if (first) setTimeout(() => first.focus(), 30);
  return api;
}

    dots.forEach((d, k) => { const v = S[k].data[i]; if (v == null) return d.classList.remove("on"); d.setAttribute("cx", X(i)); d.setAttribute("cy", Y(v)); d.classList.add("on"); });
    tip.show(e, `<b>${esc((o.labels || [])[i] || "")}</b>` + S.map((x) => x.data[i] == null ? "" : `<div><i style="background:${x.color}"></i>${esc(x.name)}<em>${esc((o.tipFmt || f)(x.data[i]))}</em></div>`).join(""));
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hide(); guide.classList.remove("on"); dots.forEach((d) => d.classList.remove("on")); });
}

/* Bar chart (grouped or stacked). o = {labels, series:[{name,data,color}], stacked, height, fmt} */
function barChart(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, H = o.height || 220, W = Math.max(260, el.clientWidth || 640);
    const S = o.series, n = (o.labels || []).length;
    if (!n || !S.length) return emptyChart(el, H);
    const tot = (i) => sum(S.map((s) => Math.max(0, s.data[i] || 0)));
    const neg = (i) => sum(S.map((s) => Math.min(0, s.data[i] || 0)));
    const all = o.stacked ? o.labels.flatMap((_, i) => [tot(i), neg(i)]) : S.flatMap((s) => s.data);
    const sc = ticksFor(Math.min(0, ...all), Math.max(0, ...all), 4), f = o.fmt || short;
    const P = { l: o.padL || 46, r: 10, t: 12, b: 26 }, iw = W - P.l - P.r, ih = H - P.t - P.b;
    const Y = (v) => P.t + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih;
    const band = iw / n, gw = band * (o.gap || 0.62), bw = o.stacked ? gw : gw / S.length;
    const every_ = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 46))));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Bar chart")}" class="cc-chart${again ? " cc-static" : ""}">`;
    s += sc.ticks.map((t) => `<g class="cc-grid"><line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${P.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(f(t))}</text></g>`).join("");
    for (let i = 0; i < n; i++) {
      const x0 = P.l + band * i + (band - gw) / 2;
      let up = 0, dn = 0;
      S.forEach((x, k) => {
        const v = x.data[i] || 0;
        let y, h;
        if (o.stacked) { const base = v >= 0 ? up : dn; y = v >= 0 ? Y(base + v) : Y(base); h = Math.abs(Y(base + v) - Y(base)); if (v >= 0) up += v; else dn += v; }
        else { y = v >= 0 ? Y(v) : Y(0); h = Math.abs(Y(v) - Y(0)); }
        const bx = o.stacked ? x0 : x0 + bw * k;
        const rr = Math.min(o.radius != null ? o.radius : 4, bw / 2, h / 2);
        s += `<rect class="cc-bar${v < 0 ? " neg" : ""}" x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw - (o.stacked ? 0 : 2)).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="${rr}" style="fill:${x.color};animation-delay:${i * 35 + k * 60}ms"/>`;
      });
      if (i % every_ === 0) s += `<text class="cc-xl" x="${(x0 + gw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
      s += `<rect class="cc-hit" data-i="${i}" x="${P.l + band * i}" y="${P.t}" width="${band}" height="${ih}" fill="transparent"/>`;
    }
    s += `<line class="cc-zero" x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}"/></svg>`;
    el.innerHTML = s + legendHTML(S);
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => {
      const h = e.target.closest(".cc-hit"); if (!h) return tip.hide();
      const i = +h.dataset.i;
      $$(".cc-hit", svg).forEach((x) => x.classList.toggle("on", x === h));
      tip.show(e, `<b>${esc(o.labels[i])}</b>` + S.map((x) => `<div><i style="background:${x.color}"></i>${esc(x.name)}<em>${esc((o.tipFmt || f)(x.data[i] || 0))}</em></div>`).join("") + (o.stacked && S.length > 1 ? `<div class="cc-tip-tot">Total<em>${esc((o.tipFmt || f)(tot(i) + neg(i)))}</em></div>` : ""));
    });
    svg.addEventListener("pointerleave", () => { tip.hide(); $$(".cc-hit", svg).forEach((x) => x.classList.remove("on")); });
  });
}

/* Donut that sweeps in. o = {items:[{label,value,color}], size, thick, fmt, center:[big, small], legend} */
function donut(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, D = o.size || 180, T = o.thick || 22, r = (D - T) / 2 - 4, C = 2 * Math.PI * r;
    const items = o.items.filter((x) => x.value > 0), tot = sum(items.map((x) => x.value)), f = o.fmt || ((v) => short(v));
    let acc = 0;
    const segs = items.map((x) => { const len = tot ? (x.value / tot) * C : 0, s0 = acc; acc += len; return { ...x, len, s0 }; });
    const gap = items.length > 1 ? Math.min(3, C * 0.006) : 0;
    let s = `<div class="cc-donut-wrap"><div class="cc-donut" style="width:${D}px;height:${D}px"><svg viewBox="0 0 ${D} ${D}" width="${D}" height="${D}" role="img" aria-label="${esc(o.aria || "Donut chart")}"><circle class="cc-track" cx="${D / 2}" cy="${D / 2}" r="${r}" style="stroke-width:${T}"/>`;
    s += segs.map((x, i) => `<circle class="cc-seg" data-i="${i}" cx="${D / 2}" cy="${D / 2}" r="${r}" transform="rotate(-90 ${D / 2} ${D / 2})" style="stroke:${x.color};stroke-width:${T}" stroke-dasharray="0 ${C}" stroke-dashoffset="${-x.s0}"/>`).join("");
    s += `</svg><div class="cc-donut-c">${o.center ? `<b data-count>${esc(o.center[0])}</b><small>${esc(o.center[1] || "")}</small>` : ""}</div></div>`;
    if (o.legend !== false) s += `<ul class="cc-dlegend">${segs.map((x, i) => `<li data-i="${i}"><i style="background:${x.color}"></i><span>${esc(x.label)}</span><em>${esc(f(x.value))}</em><small>${tot ? Math.round((x.value / tot) * 100) : 0}%</small></li>`).join("")}</ul>`;
    el.innerHTML = s + "</div>";
    if (!tot) $(".cc-donut-c", el).innerHTML = "<b>—</b><small>No data</small>";
    const cs = $$(".cc-seg", el);
    const setT = (t) => cs.forEach((c, i) => c.setAttribute("stroke-dasharray", `${Math.max(0, segs[i].len * t - gap)} ${C}`));
    if (again) setT(1); else tween(1000, setT);
    const hl = (i, e) => {
      cs.forEach((c, k) => c.classList.toggle("dim", i != null && k !== i));
      $$(".cc-dlegend li", el).forEach((li, k) => li.classList.toggle("on", k === i));
      if (i != null && e) tip.show(e, `<b>${esc(segs[i].label)}</b><div><i style="background:${segs[i].color}"></i>${esc(f(segs[i].value))}<em>${Math.round((segs[i].value / tot) * 100)}%</em></div>`);
    };
    el.onpointermove = (e) => { const t = e.target.closest("[data-i]"); if (t) hl(+t.dataset.i, e); else { hl(null); tip.hide(); } };
    el.onpointerleave = () => { hl(null); tip.hide(); };
  });
}

/* Half-circle gauge. o = {value, max, color, label, fmt, size} */
function gauge(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, W = o.size || 200, H = W * 0.62, r = W / 2 - 14, cx = W / 2, cy = W / 2;
    const p = clamp((o.value || 0) / (o.max || 1), 0, 1);
    const arc = `M${cx - r},${cy} A${r},${r} 0 0 1 ${cx + r},${cy}`;
    el.innerHTML = `<div class="cc-gauge"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${esc((o.label || "Gauge") + ": " + Math.round(p * 100) + "%")}"><path class="cc-track" d="${arc}" style="stroke-width:${o.thick || 14}"/><path class="cc-gfill" d="${arc}" pathLength="100" style="stroke:${o.color};stroke-width:${o.thick || 14}" stroke-dasharray="0 100"/><circle class="cc-gknob" r="5" cx="${cx - r}" cy="${cy}" style="fill:${o.color}"/></svg><div class="cc-gauge-c"><b>${esc((o.fmt || ((v) => Math.round(v * 100) + "%"))(p))}</b><small>${esc(o.label || "")}</small></div></div>`;
    const fill = $(".cc-gfill", el), knob = $(".cc-gknob", el);
    const set = (t) => { const q = p * t; fill.setAttribute("stroke-dasharray", `${q * 100} 100`); const a = Math.PI * (1 - q); knob.setAttribute("cx", cx + r * Math.cos(a)); knob.setAttribute("cy", cy - r * Math.sin(a)); };
    if (again) set(1); else tween(1100, set);
    el.onpointermove = (e) => tip.show(e, `<b>${esc(o.label || "")}</b><div>${esc(o.tip || Math.round(p * 100) + "% of target")}</div>`);
    el.onpointerleave = () => tip.hide();
  });
}

/* Sparkline as an SVG string (for KPI cards and table rows) */
function spark(data, color = "currentColor", w = 96, h = 30, area = true) {
  if (!data || data.length < 2) return "";
  const lo = Math.min(...data), hi = Math.max(...data), rg = hi - lo || 1;
  const pts = data.map((v, i) => [(i * (w - 2)) / (data.length - 1) + 1, h - 3 - ((v - lo) / rg) * (h - 6)]);
  const d = pathD(pts, true), id = "sp" + uid();
  return `<svg class="cc-spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${area ? `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path class="cc-fade" d="${d}L${w - 1},${h}L1,${h}Z" fill="url(#${id})"/>` : ""}<path class="cc-line cc-draw" pathLength="1" d="${d}" style="stroke:${color}"/></svg>`;
}

/* Heatmap grid. o = {rows, cols, data:[[v]], color, fmt, cell} */
function heatmap(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, W = Math.max(260, el.clientWidth || 640), L = o.padL || 40, T = 18;
    const cw = (W - L) / o.cols.length, ch = o.cell || Math.min(26, cw);
    const H = T + ch * o.rows.length + 4, all = o.data.flat(), hi = Math.max(...all, 1), f = o.fmt || short;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Heatmap")}" class="cc-chart${again ? " cc-static" : ""}">`;
    const every_ = Math.max(1, Math.ceil(o.cols.length / Math.floor((W - L) / 34)));
    s += o.cols.map((c, j) => (j % every_ === 0 ? `<text class="cc-xl" x="${L + cw * j + cw / 2}" y="12" text-anchor="middle">${esc(c)}</text>` : "")).join("");
    o.rows.forEach((rw, i) => {
      s += `<text class="cc-xl" x="${L - 6}" y="${T + ch * i + ch / 2 + 4}" text-anchor="end">${esc(rw)}</text>`;
      o.cols.forEach((c, j) => { const v = o.data[i][j] || 0; s += `<rect class="cc-cell" data-r="${i}" data-c="${j}" x="${(L + cw * j + 1.5).toFixed(1)}" y="${T + ch * i + 1.5}" width="${Math.max(1, cw - 3).toFixed(1)}" height="${Math.max(1, ch - 3)}" rx="${Math.max(0, Math.min(5, ch / 4))}" style="fill:${o.color};fill-opacity:${(0.08 + (v / hi) * 0.92).toFixed(2)};animation-delay:${(i + j) * 18}ms"/>`; });
    });
    el.innerHTML = s + "</svg>";
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => { const c = e.target.closest(".cc-cell"); if (!c) return tip.hide(); tip.show(e, `<b>${esc(o.rows[+c.dataset.r])} · ${esc(o.cols[+c.dataset.c])}</b><div>${esc(f(o.data[+c.dataset.r][+c.dataset.c]))}</div>`); });
    svg.addEventListener("pointerleave", () => tip.hide());
  });
}

/* Pointer drag helper (mouse, touch and pen) */
function dragify(el, { start, move, end }) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    const s = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, e };
    if (start && start(s, e) === false) return;
    if (el.setPointerCapture && e.pointerId != null) try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const mv = (ev) => { s.dx = ev.clientX - s.x; s.dy = ev.clientY - s.y; if (Math.abs(s.dx) + Math.abs(s.dy) > 4) s.moved = true; if (move) move(s, ev); };
    const up = (ev) => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); if (end) end(s, ev); };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  });
}

/* Price of one parcel: base + each extra kg + fuel surcharge + COD fee */
function price(o, cfg) {
  cfg = cfg || (S ? S.cfg : CFG0);
  const r = cfg.rates[o.svc] || cfg.rates.Overnight;
  const kg = Math.max(0.5, +o.kg || 0);
  const extra = Math.max(0, Math.ceil(kg) - 1) * r.kg;
  const fuel = Math.round(((r.base + extra) * cfg.fuel) / 100);
  const codFee = o.cod > 0 ? Math.max(20, Math.round((o.cod * cfg.codPct) / 100)) : 0;
  return { base: r.base, extra, fuel, codFee, total: r.base + extra + fuel + codFee };
}

/* One tracking event: what happened, where, and by whom */
function mkEvent(p, k, t, reason) {
  const sl = seller(p.s), rd = rider(p.rd);
  const W = {
    booked: [sl.name + ", " + sl.area, "Booked on the seller portal"],
    picked: [sl.area + ", " + city(p.from), "Picked up by the " + city(p.from) + " pickup team"],
    origin: [city(p.from) + " hub", "Sorted for " + (p.from === p.to ? "local delivery" : city(p.to))],
    transit: ["Line haul " + city(p.from) + " to " + city(p.to), "On truck " + PLATE[p.from] + "-" + (4400 + HUBS.findIndex((h) => h.id === p.to) * 137)],
    dest: [city(p.to) + " hub", "Arrived and sorted for delivery"],
    out: [p.area + ", " + city(p.to), "With rider " + (rd ? rd.name : "on duty")],
    delivered: [p.area + ", " + city(p.to), p.cod ? "Rs " + num(p.cod) + " collected in cash" : "Prepaid, signed by the receiver"],
    failed: [p.area + ", " + city(p.to), reason || p.reason || "Receiver not reachable"],
    returning: [city(p.to) + " hub", "Going back to " + sl.name],
    returned: [sl.name + ", " + city(p.from), "Signed for by the seller"],
    cancelled: [sl.name, "Cancelled before pickup"],
  }[k];
  return { k, t, w: W[0], b: W[1] };
}

/* Next step for a parcel (null when it is finished) */
function nextOf(p) {
  if (p.st === "failed") return "out";
  if (p.st === "returning") return "returned";
  if (["delivered", "returned", "cancelled"].includes(p.st)) return null;
  const s = stepsFor(p);
  return s[s.indexOf(p.st) + 1] || null;
}
const riderAt = (hub) => { const list = S.riders.filter((r) => r.hub === hub && r.status === "On route"); return list.length ? list[Math.floor(Math.random() * list.length)] : S.riders.find((r) => r.hub === hub); };
function advance(p) {
  const k = nextOf(p);
  if (!k) return null;
  if (k === "out") p.rd = riderAt(p.to).id;
  const e = mkEvent(p, k, Date.now());
  if (p.st === "failed" && k === "out") e.b = "Second try with rider " + rider(p.rd).name;
  p.ev.push(e);
  p.st = k;
  if (k === "delivered") { S.day.delivered++; if (p.cod) collect(p.cod, rider(p.rd), p.area, p.to); }
  return e;
}
function failP(p, reason) { p.reason = reason; p.att++; const e = mkEvent(p, "failed", Date.now(), reason); p.ev.push(e); p.st = "failed"; return e; }
function returnP(p) { const e = mkEvent(p, "returning", Date.now()); p.ev.push(e); p.st = "returning"; return e; }
function newBookingFrom(o) {

  p.fee = price(p).total;
  p.ev = [mkEvent(p, "booked", p.t0)];
  if (o.by) p.ev[0].b = o.by;

}

}

let DOTS = "";
function inside(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const hubXY = (id) => proj(HUB[id].lon, HUB[id].lat);
function laneD(a, b, bend) {
  const [ax, ay] = hubXY(a), [bx, by] = hubXY(b);
  const dx = bx - ax, dy = by - ay;
  const cx = (ax + bx) / 2 - dy * bend, cy = (ay + by) / 2 + dx * bend;
  return `M${ax},${ay}Q${cx.toFixed(1)},${cy.toFixed(1)} ${bx},${by}`;
}
function mapSVG() {
  const poly = PK.map((p) => proj(p[0], p[1]));
  if (!DOTS) {
    let d = "";
    for (let y = 4, row = 0; y < MH; y += 7, row++) for (let x = 4 + (row % 2) * 3.5; x < MW; x += 7) if (inside(x, y, poly)) d += `M${(x - 1.3).toFixed(1)} ${y}a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0`;
    DOTS = d;
  }
  let s = `<svg viewBox="0 0 ${MW} ${MH}" role="group" aria-label="Map of Pakistan with the five hubs and parcels moving between them">`;
  s += `<path class="land" d="M${poly.map((p) => p.join(",")).join("L")}Z"/><path class="dots" d="${DOTS}"/>`;
  s += `<path class="river" d="${pathD(INDUS.map((p) => proj(p[0], p[1])))}"/>`;
  TOWNS.forEach((t) => {
    const [x, y] = proj(t.lon, t.lat), [hx, hy] = hubXY(t.hub);
    s += `<line class="spoke" x1="${x}" y1="${y}" x2="${hx}" y2="${hy}"/><circle class="town" cx="${x}" cy="${y}" r="1.9"/>`;
    if (t.n) s += `<text class="town-l" x="${x + (t.l === "end" ? -5 : t.l === "start" ? 5 : 0)}" y="${y + (t.l === "middle" ? -6 : 3)}" text-anchor="${t.l}">${t.n}</text>`;
  });
  LANES.forEach(([a, b, bend], i) => { const d = laneD(a, b, bend); s += `<path class="lane-glow" d="${d}"/><path class="lane" id="ln${i}" data-la="${a}" data-lb="${b}" d="${d}"/>`; });
  s += '<g id="tokens"></g>';
  HUBS.forEach((h) => {
    const [x, y] = hubXY(h.id), tx = x + h.lx, ty = y + h.ly;
    s += `<g class="hub" data-h="${h.id}" tabindex="0" role="button" aria-label="${h.city} hub, ${num(S.hubs[h.id].in)} parcels in today"><circle class="hub-ring" cx="${x}" cy="${y}" r="6"/><circle class="hub-ping" cx="${x}" cy="${y}" r="6"/><circle class="hub-dot" cx="${x}" cy="${y}" r="5"/><text class="hub-l" x="${tx}" y="${ty}" text-anchor="${h.anchor}">${h.city}</text><text class="hub-n" id="hn-${h.id}" x="${tx}" y="${ty + 11}" text-anchor="${h.anchor}">${num(S.hubs[h.id].in)} in</text></g>`;

}
let mapRAF = 0;
function startMap() {
  cancelAnimationFrame(mapRAF);
  const svg = $("#map svg");
  if (!svg) return;
  const lanes = $$(".lane", svg).map((el) => ({ el, a: el.dataset.la, b: el.dataset.lb, L: el.getTotalLength ? el.getTotalLength() : 100 }));
  const weights = LANES.map(([a, b]) => HUB[a].w + HUB[b].w);
  const pickLane = () => { let r = Math.random() * sum(weights); for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; } return 0; };
  const tok = (k, t0) => ({ li: pickLane(), dir: Math.random() < 0.5 ? 1 : -1, t: t0, px: 16 + Math.random() * 14, back: k < 2 });
  const toks = Array.from({ length: 16 }, (_, k) => tok(k, Math.random()));
  const g = $("#tokens", svg);
  g.innerHTML = toks.map((t) => `<g class="parcel${t.back ? " back" : ""}"><rect x="-3.5" y="-3.5" width="7" height="7" rx="1.6"/><path d="M-3.5 0h7"/></g>`).join("");
  const els = Array.from(g.children);
  const place = (k) => {
    const t = toks[k], ln = lanes[t.li];
    if (!ln.el.getPointAtLength) return;
    const p = ln.el.getPointAtLength((t.dir > 0 ? t.t : 1 - t.t) * ln.L);
    els[k].setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
  };
  toks.forEach((_, k) => place(k));
  if (RM) return;
  let last = performance.now();
  const step = (now) => {
    if (!svg.isConnected) return;
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    toks.forEach((t, k) => {
      t.t += (t.px * dt) / Math.max(20, lanes[t.li].L);
      if (t.t >= 1) {
        arrive(t.dir > 0 ? lanes[t.li].b : lanes[t.li].a);

}

  r.stops = Array.from({ length: r.assigned }, (_, i) => ({ area: pk(AREAS[r.hub]), rcv: pk(FIRST) + " " + pk(LAST), cod: rr() < 0.8 ? Math.round((600 + rr() * 6000) / 50) * 50 : 0, ok: i < r.done }));

    title: r.name + " · run sheet", drawer: true,
    html: `<p class="muted" style="margin:0 0 10px">${city(r.hub)} hub · bike ${r.plate} · <b id="rsCnt" style="color:var(--ink)">${r.done} of ${r.assigned}</b> stops done · cash in hand <b id="rsCash" style="color:var(--ink)">${money(r.cash)}</b></p><div class="bar" style="margin-bottom:8px"><i id="rsBar" style="width:${r.assigned ? Math.round((r.done / r.assigned) * 100) : 0}%"></i></div>${r.assigned ? `<ul class="stops" id="rsList">${r.stops.map(stopLi).join("")}</ul>` : `<div class="cc-empty">${ic("bike")}<b>No stops today</b><span>${esc(r.name)} is off duty.</span></div>`}`,
  });

/* ---------- Hubs ---------- */

const tripPill = (st) => `<span class="pill ${st === "Departed" ? "p-acc" : st === "Loading" ? "p-warn" : st === "Arrived" ? "p-good" : "p-mute"}">${st}</span>`;
const tripRow = (t, i) => `<tr data-t="${t.id}" style="--r:${i}"><td class="tab"><b>${cut12(t.dep)}</b></td><td><span style="display:inline-flex;gap:6px;align-items:center"><span class="code">${t.from}</span>${ic("arrowR")}<span class="code">${t.to}</span></span></td><td><span class="who"><b>${t.truck}</b><small>${esc(t.drv)}</small></span></td><td class="r">${num(t.n)}</td><td>${tripPill(t.st)}</td><td class="r">${tripNext[t.st] ? `<button class="btn sm" type="button" data-a="trip" data-t="${t.id}">${tripNext[t.st][0]}</button>` : '<span class="muted">Done</span>'}</td></tr>`;
function hubBody() {

      <dl class="kv"><dt>Hub manager</dt><dd>${esc(h.mgr)}</dd><dt>Night shift</dt><dd>8 pm to 4 am</dd><dt>Phone</dt><dd>${h.phone}</dd><dt>Loading docks</dt><dd>${busy} of ${h.docks} busy</dd></dl>
      <div id="hubGauge" style="margin-top:14px"></div></div></section>

    <section class="card s4 stretch"><div class="card-h"><div><h2>Waiting by destination</h2><p>Sorted and ready for the next truck</p></div></div><div class="hbars" id="hubWait" data-sk></div></section>
  </div>
  <div class="grid"><section class="card s12"><div class="card-h"><div><h2>Parcels between hubs today</h2><p>Rows send, columns receive. A brighter cell means more parcels.</p></div></div><div id="hubHeat" data-sk></div></section></div>`;
}
function hubCharts() {
  const h = HUB[UI.hub], st = S.hubs[h.id], rr = seeded(hash(h.id));
  const labels = ["12am", "2am", "4am", "6am", "8am", "10am", "12pm", "2pm", "4pm", "6pm", "8pm", "10pm"];
  const inC = [0.9, 1.3, 1.1, 0.6, 0.4, 0.5, 0.6, 0.7, 0.8, 1.0, 1.2, 1.3], outC = [0.4, 0.3, 0.5, 1.1, 1.4, 1.2, 0.8, 0.7, 0.6, 0.8, 1.2, 1.1];
  barChart($("#hubChart"), { labels, series: [{ name: "In", data: inC.map((c) => Math.round((st.in / 12) * c * (0.9 + rr() * 0.2))), color: "var(--chart-a)" }, { name: "Out", data: outC.map((c) => Math.round((st.out / 12) * c * (0.9 + rr() * 0.2))), color: "var(--chart-b)" }], height: 236, padL: 36, tipFmt: (v) => num(v) + " parcels", aria: "Parcels in and out by hour" });
  gauge($("#hubGauge"), { value: st.load, max: 100, color: st.load > 82 ? "var(--bad)" : "var(--chart-a)", label: "of floor space in use", size: 170, tip: st.load + "% of the hub floor is in use" });
  const others = HUBS.filter((x) => x.id !== h.id);
  const tw = sum(others.map((x) => x.w));
  const rows = others.map((x) => ({ n: x.city, v: Math.round((st.wait * 0.8 * x.w) / tw) })).concat([{ n: "Local delivery", v: Math.round(st.wait * 0.2) }]).sort((a, b) => b.v - a.v);
  $("#hubWait").innerHTML = rows.map((r, i) => `<div class="hb"><span>${r.n}</span><span class="track"><i style="--c:${PAL[i]}" data-w="${((r.v / rows[0].v) * 100).toFixed(1)}"></i></span><em>${num(r.v)}</em></div>`).join("");
  fillBars($("#hubWait"));
  const hr = seeded(99);
  heatmap($("#hubHeat"), { rows: HUBS.map((x) => x.city), cols: HUBS.map((x) => x.city), data: HUBS.map((a) => HUBS.map((b) => Math.round(a.w * b.w * (a.id === b.id ? 16000 : 9000) * (0.85 + hr() * 0.3)))), color: "var(--chart-a)", cell: 34, padL: 78, fmt: (v) => num(v) + " parcels", aria: "Parcels between hubs" });
}
VIEWS.hubs = {
  sk: true,
  head() {
    const dep = S.trips.filter((t) => t.st === "Departed").length;
    return { t: "Hubs", s: `<span><b>5</b> city hubs</span><span><b>${dep}</b> line haul trucks on the road</span><span>Sorting <b>${num(sum(HUBS.map((h) => S.hubs[h.id].rate)))}</b> parcels an hour</span>`, a: `<button class="btn primary" type="button" data-a="add-trip">${ic("truck")}Plan line haul</button>` };

  wire(view, later) {
    later(hubCharts);

      UI.hub = id;

      t.st = tripNext[t.st][1];
      if (t.st === "Arrived") S.hubs[t.to].in += t.n;
      if (t.st === "Departed") S.hubs[t.from].out += t.n;
      save();
      const tr = el.closest("tr");
      tr.outerHTML = tripRow(t, 0);
      toast(`Truck ${t.truck}: ${t.st.toLowerCase()}${t.st === "Arrived" ? ", " + num(t.n) + " parcels in at " + city(t.to) : ""}`);
    }
  },
};

/* ---------- COD and payouts ---------- */

  return `<tr data-s="${s.id}" class="${flash ? "paid-anim" : ""}" style="--r:${i}"><td><input type="checkbox" class="tick" data-sel="${s.id}"${UI.paySel.has(s.id) ? " checked" : ""}${d > 0 ? "" : " disabled"} aria-label="Select ${esc(s.name)}"></td><td>${who(s.name, esc(s.cat) + " · " + city(s.hub))}</td><td class="r">${num(s.delivered)}</td><td class="r">${money(s.cod)}</td><td class="r muted">${s.charges ? "−" + money(s.charges) : "Rs 0"}</td><td class="r"><b>${d > 0 ? money(d) : '<span class="pill p-good">Paid</span>'}</b></td><td><span class="who"><b style="font-weight:500">${esc(s.method)}</b><small>${esc(s.acct)}</small></span></td><td class="muted">${fdate(s.lastPaid)}</td></tr>`;

function drawSellers(flash = []) {
  const tb = $("#selBody");

  const list = S.sellers.filter((s) => !q || s.name.toLowerCase().includes(q) || city(s.hub).toLowerCase().includes(q) || s.cat.toLowerCase().includes(q)).sort((a, b) => due(b) - due(a));
  tb.innerHTML = list.length ? list.map((s, i) => sellerRow(s, i, flash.includes(s.id))).join("") : `<tr><td colspan="8"><div class="cc-empty">${ic("search")}<b>No sellers match</b></div></td></tr>`;

function selBar() {

  bar.classList.toggle("on", ids.length > 0);

  $("#selAmt").textContent = money(sum(ids.map((id) => due(S.sellers.find((x) => x.id === id)))));

}
const histLi = (p) => `<li><span class="ico acc">${ic("send")}</span><span class="grow" style="min-width:0"><b>${p.id}</b><small>${p.n} sellers · ${esc(p.method)} · ${fdate(p.t)}</small></span><span class="amt">${money(p.amt)}</span></li>`;
function drawHistory() { const el = $("#hist"); if (el) el.innerHTML = S.payouts.slice(0, 6).map(histLi).join(""); }

/* ---------- Returns and claims ---------- */
const COLS = [["new", "New"], ["review", "Reviewing"], ["approved", "Approved"], ["settled", "Settled"]];
const NEXT_COL = { new: ["review", "Review"], review: ["approved", "Approve"], approved: ["settled", "Pay out"] };
const claimCard = (c, moved) => `<article class="claim${moved ? " moved" : ""}" draggable="true" data-c="${c.id}" tabindex="0" aria-label="Claim ${c.id}, ${c.type}, ${money(c.amt)}"><div class="top-row"><b>${c.id}</b><span class="pill ${c.type === "Lost" ? "p-bad" : c.type === "Damaged" ? "p-warn" : "p-info"}">${c.type}</span></div><small>${esc(seller(c.s).name)} · <span class="tn" style="font-size:11px">${fmtTN(c.p)}</span> · ${ago(c.t)}</small><div class="acts-row">${NEXT_COL[c.col] ? `<button class="btn sm" type="button" data-a="claim-next" data-c="${c.id}">${NEXT_COL[c.col][1]}</button>` : `<span class="pill ${c.res === "Rejected" ? "p-bad" : "p-good"}">${c.res || "Paid"}</span>`}${c.col === "new" || c.col === "review" ? `<button class="btn sm ghost icon" type="button" data-a="claim-reject" data-c="${c.id}" aria-label="Reject claim ${c.id}">${ic("x")}</button>` : ""}<span class="amt">${money(c.amt)}</span></div></article>`;
function drawBoard(moved) {
  const el = $("#board");
  if (!el) return;
  el.innerHTML = COLS.map(([k, n]) => { const list = S.claims.filter((c) => c.col === k); return `<div class="col" data-col="${k}"><h3>${n}<em>${list.length}</em><span class="grow"></span><span class="muted" style="font-weight:500;font-size:11.5px">${money(sum(list.map((c) => c.amt)))}</span></h3>${list.map((c) => claimCard(c, c.id === moved)).join("") || '<p class="muted" style="margin:6px 4px;font-size:12px">Drop a claim here</p>'}</div>`; }).join("");
}
function moveClaim(id, col, res) {
  const c = S.claims.find((x) => x.id === id);
  if (!c || (c.col === col && !res)) return;
  c.col = col;
  c.res = col === "settled" ? res || c.res || "Paid" : "";
  save(); drawBoard(id); updReturnsTiles();
  toast(`${c.id}: ${col === "settled" ? c.res.toLowerCase() : COLS.find((x) => x[0] === col)[1].toLowerCase()}`, c.res === "Rejected" ? "warn" : "");
}
const returnsAll = () => S.parcels.filter((p) => ["failed", "returning", "returned"].includes(p.st));
function updReturnsTiles() {
  const open = S.claims.filter((c) => c.col !== "settled");
  const t = $("#tClaims"); if (t) countUp(t, sum(open.map((c) => c.amt)), FMT.money, 600);
}

const METRICS = [["delivered", "Parcels delivered"], ["cod", "COD collected"], ["first", "First-try rate"], ["returns", "Returns"]];
const GROUPS = [["city", "City"], ["service", "Service"], ["seller", "Seller"], ["rider", "Rider"]];
const RANGES = [[7, "7 days"], [30, "30 days"], [90, "90 days"]];
function repItems(g) {
  if (g === "city") return HUBS.map((h) => ({ name: h.city, w: h.w }));
  if (g === "service") return [["Overnight", 0.61], ["Economy", 0.21], ["Same day", 0.18]].map(([name, w]) => ({ name, w }));
  if (g === "seller") return S.sellers.map((s) => ({ name: s.name, w: s.size }));
  return S.riders.filter((r) => r.week).map((r) => ({ name: r.name, w: r.week / 7 / 1250 }));
}
function repRows() {
  const { metric: m, group: g, range } = UI.rep;
  return repItems(g).map((it) => {
    const rr = seeded(hash(m + g + it.name + range));
    const cnt = it.w * 1250 * range * (0.88 + rr() * 0.24);
    const v = m === "delivered" ? Math.round(cnt) : m === "cod" ? Math.round((cnt * 0.82 * (2100 + rr() * 1400)) / 100) * 100 : m === "first" ? +(80 + rr() * 14).toFixed(1) : Math.round(cnt * (0.02 + rr() * 0.045));
    return { name: it.name, v, w: cnt };
  }).sort((a, b) => b.v - a.v).slice(0, 8);
}
const repFmt = () => (UI.rep.metric === "first" ? (v) => v.toFixed(1) + "%" : UI.rep.metric === "cod" ? (v) => moneyShort(v) : (v) => num(Math.round(v)));
function drawReport(morph) {
  const { metric: m, group: g, range } = UI.rep;
  const rows = repRows(), f = repFmt(), isRate = m === "first";
  const tot = isRate ? sum(rows.map((r) => r.v * r.w)) / sum(rows.map((r) => r.w)) : sum(rows.map((r) => r.v));
  const T = $("#rTot");
  if (!T) return;
  countUp(T, tot, f, 700);
  $("#rTotS").textContent = `${METRICS.find((x) => x[0] === m)[1]} · by ${GROUPS.find((x) => x[0] === g)[1].toLowerCase()} · last ${range} days${g === "seller" || g === "rider" ? " · top 8" : ""}`;
  const max = isRate ? 100 : Math.max(...rows.map((r) => r.v), 1);
  $("#rBars").innerHTML = rows.map((r, i) => `<div class="hb"><span title="${esc(r.name)}">${esc(r.name)}</span><span class="track"><i style="--c:${PAL[i % PAL.length]}" data-w="${((r.v / max) * 100).toFixed(1)}"></i></span><em>${f(r.v)}</em></div>`).join("");
  fillBars($("#rBars"));
  const rr = seeded(hash(m + range)), n = range;
  const labels = dayLabels(n), daily = isRate ? null : tot / n;
  const data = labels.map((_, i) => { const wd = addDays(TODAY, i - n + 1).getDay(), fct = wd === 0 ? 0.7 : wd === 6 ? 0.88 : 1.06; return isRate ? +(tot + (rr() - 0.5) * 4).toFixed(1) : Math.round(daily * fct * (0.9 + rr() * 0.2)); });
  lineChart($("#rLine"), { labels, series: [{ name: METRICS.find((x) => x[0] === m)[1], data, color: "var(--chart-a)" }], area: true, height: 170, padL: 44, zero: !isRate, fmt: isRate ? (v) => v.toFixed(0) + "%" : m === "cod" ? (v) => short(v) : (v) => short(v), tipFmt: f, aria: "Daily trend" }, morph);
  const totAll = sum(rows.map((r) => r.v));
  $("#rTblB").innerHTML = rows.map((r, i) => `<tr style="--r:${i}"><td><span style="display:inline-flex;align-items:center;gap:8px"><i style="width:8px;height:8px;border-radius:50%;background:${PAL[i % PAL.length]}"></i>${esc(r.name)}</span></td><td class="r">${f(r.v)}</td><td class="r muted">${isRate ? "–" : Math.round((r.v / totAll) * 100) + "%"}</td></tr>`).join("");
  $("#rTblH").textContent = GROUPS.find((x) => x[0] === g)[1];
  $("#rTblV").textContent = METRICS.find((x) => x[0] === m)[1];
}
