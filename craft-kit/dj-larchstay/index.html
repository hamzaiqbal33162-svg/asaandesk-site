<!doctype html>
<!-- Chill & Craft · Larchstay · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Larchstay · host app for six holiday cabins</title>
<style>
/* ===== Core: reset, charts, toasts, modals, tables (theme comes from variables) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:var(--bg);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:200;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 46%);flex:none}
/* entrance */
.cc-in{animation:var(--enter,ccRise) .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes ccFade{from{opacity:0}}
/* charts */
.cc-chart{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.cc-grid{stroke:var(--grid,var(--line));stroke-width:1}
.cc-ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,0,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.cc-area{animation:ccFade 1s .35s both}
.cc-guide{stroke:var(--mut);stroke-dasharray:3 3;pointer-events:none}
.cc-dots{pointer-events:none}.cc-dots circle{stroke:var(--card-solid,#fff);stroke-width:2}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.cc-col{fill:var(--fg);fill-opacity:0;transition:fill-opacity .15s}.cc-col:hover{fill-opacity:.06}
.cc-seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke-width .2s}
.cc-seg:hover{stroke-width:calc(var(--th) + 5px)!important}
.cc-cell{animation:ccFade .5s both;animation-delay:calc(var(--i,0) * 7ms)}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.cc-legend i,.cc-tip i,.cc-dleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none}
.cc-tip{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:240px}
.cc-tip b{font-weight:700}
.cc-empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:14px}
.cc-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cc-donut-w{position:relative;flex:none}
.cc-donut-w svg{display:block}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:20px;line-height:1.1}.cc-donut-c span{font-size:11px;color:var(--mut)}
.cc-dleg{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:13px}
.cc-dleg li{display:flex;align-items:center;gap:4px}.cc-dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc-dleg em{font-style:normal;color:var(--mut);width:38px;text-align:right}
.cc-gauge{position:relative;margin:auto}.cc-gauge svg{display:block}
.cc-gv{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.cc-gauge-c{position:absolute;inset:0 0 10% 0;display:grid;place-content:center;text-align:center}
.cc-gauge-c b{font-size:24px;line-height:1.1}.cc-gauge-c span{font-size:11px;color:var(--mut)}
.cc-hbars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cc-hbars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.cc-hbars i{grid-column:1/-1;height:7px;border-radius:9px;background:var(--track,var(--line));overflow:hidden}
.cc-hbars em{display:block;height:100%;width:var(--w);border-radius:inherit;animation:ccBarW .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes ccBarW{from{width:0}}
.cc-ringv{animation:ccRing 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ccRing{from{stroke-dasharray:0 var(--c)}}
/* toasts */
.cc-toasts{position:fixed;z-index:1001;bottom:16px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.cc-toast{pointer-events:auto;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;animation:ccToast .38s cubic-bezier(.2,.8,.2,1)}
.cc-toast .ic{width:18px;height:18px;color:var(--ok,#3c9)}.cc-toast.bad .ic{color:var(--bad,#e55)}
.cc-toast.out{opacity:0;transform:translateY(8px);transition:.25s}
.cc-toast button{background:none;border:0;color:var(--tipacc,var(--acc));font-weight:700;padding:0 0 0 6px}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* modal and drawer */
.cc-back{position:fixed;inset:0;z-index:900;background:var(--scrim,rgba(8,10,14,.5));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cc-back.cc-on{opacity:1}.cc-back.cc-out{opacity:0;pointer-events:none}
.cc-modal{background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:var(--rm,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:none}
.cc-on .cc-modal{transform:none}
.cc-small{width:min(420px,100%)}
.cc-drawer-back{place-items:stretch end;padding:0}
.cc-drawer{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rm,16px) 0 0 var(--rm,16px);transform:translateX(100%)}
.cc-mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:2}
.cc-mhead h2{margin:0;font-size:18px;line-height:1.25}
.cc-x{background:none;border:0;padding:6px;border-radius:10px;display:grid;color:var(--mut)}
.cc-x:hover{background:var(--hover)}
.cc-mbody{padding:8px 20px 20px}
.cc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cc-confirm{margin:4px 0 0;color:var(--mut)}
.cc-hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cc-field.full{grid-column:1/-1}
.cc-field label{font-size:12px;font-weight:600;color:var(--mut)}
.cc-field input,.cc-field select,.cc-field textarea{border:1px solid var(--line);background:var(--inp,transparent);border-radius:var(--ri,10px);padding:9px 11px;min-width:0;width:100%}
.cc-field select option{background:var(--card-solid,#fff);color:var(--fg)}
.cc-field [aria-invalid=true]{border-color:var(--bad,#e55)}
.cc-err{color:var(--bad,#e55);font-size:12px}
.cc-err:empty{display:none}
.cc-shake{animation:ccShake .38s}
@keyframes ccShake{25%{translate:-7px 0}75%{translate:7px 0}}
@media (max-width:520px){.cc-fields{grid-template-columns:1fr}.cc-drawer{border-radius:0}}
/* table */
.cc-ttools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cc-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:1 1 180px;max-width:320px;color:var(--mut);background:var(--inp,transparent)}
.cc-search .ic{width:16px;height:16px}
.cc-search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--fg)}
.cc-search:focus-within{outline:2px solid var(--focus,var(--acc));outline-offset:1px}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap}
.cc-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);transition:background .2s,color .2s,border-color .2s}
.cc-chip:hover{color:var(--fg)}
.cc-chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.cc-twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.cc-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cc-table th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.cc-table th button:focus-visible{outline:2px solid var(--focus,var(--acc))}
.cc-sort::after{content:"\2195";opacity:.35;font-style:normal}
[aria-sort=ascending] .cc-sort::after{content:"\2191";opacity:1}
[aria-sort=descending] .cc-sort::after{content:"\2193";opacity:1}
.cc-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table .num{text-align:right;font-variant-numeric:tabular-nums}
.cc-table th.num button{flex-direction:row-reverse}
.cc-click{cursor:pointer;transition:background .15s}.cc-click:hover{background:var(--hover)}
.cc-pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.cc-pager div{display:flex;gap:6px}
/* popovers, menus, bell */
.cc-pop{position:fixed;z-index:950;background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);min-width:220px;max-width:min(340px,calc(100vw - 16px));opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.cc-pop.cc-on{opacity:1;transform:none}
.cc-menu{display:flex;flex-direction:column;padding:6px;max-height:60vh;overflow:auto}
.cc-menu-t{font-size:12px;color:var(--mut);padding:6px 10px}
.cc-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}
.cc-menu button:hover,.cc-menu button:focus{background:var(--hover)}
.cc-bell{width:320px;max-width:100%}
.cc-bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cc-bell ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.cc-bell li button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px;border-radius:10px;font-size:13px;align-items:flex-start}
.cc-bell li button:hover{background:var(--hover)}
.cc-bell li.unread button{font-weight:600}
.cc-bell li.unread button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin:6px 0 0 auto;flex:none}
.cc-bell small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.cc-link{background:none;border:0;color:var(--acc);font-size:12px;font-weight:600;padding:2px}
.cc-clear{display:block;margin:0 auto 10px}
.cc-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad,#e5484d);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes ccPop{from{transform:scale(0)}}
/* range switch */
.cc-seg{position:relative;display:inline-flex;background:var(--seg,var(--hover));border-radius:999px;padding:3px;flex:none}
.cc-seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut);border-radius:999px;transition:color .2s}
.cc-seg button[aria-pressed=true]{color:var(--segfg,var(--fg))}
.cc-seg-ind{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:999px;background:var(--segind,var(--card-solid,#fff));box-shadow:0 1px 5px rgba(0,0,0,.16);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s}
/* drag and drop */
.cc-ghost{opacity:.94;box-shadow:0 22px 44px rgba(0,0,0,.32)!important;animation:none!important;transition:none!important}
.cc-dragging{opacity:.35}
.cc-over{outline:2px dashed var(--acc)!important;outline-offset:-3px}
.cc-dragmode,.cc-dragmode *{cursor:grabbing!important;user-select:none}
/* command search */
.cc-cmdk{width:min(560px,100%);align-self:start;margin-top:10vh}
.cc-cmdk-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--inp,transparent);outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0}
.cc-cmdk-list button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.cc-cmdk-list [aria-selected=true] button{background:var(--hover);color:var(--acc)}
.cc-hidden *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.cc-draw{stroke-dashoffset:0}}
/* ===== Larchstay look: pine green and ember on cream, rounded and airy ===== */
:root{--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--bg:#f3f1ea;--card:#fff;--card-solid:#fff;--modal:#fff;--fg:#1b2a22;--mut:#69776e;--line:#e6e3da;--grid:#efede6;--hover:rgba(31,107,79,.07);--track:#ecebe4;--inp:#fbfaf6;
--acc:#1f6b4f;--onacc:#fff;--acc2:#e8833a;--c1:#1f6b4f;--c2:#e8833a;--c3:#6f9fc4;--c4:#c9a33f;--c5:#a65e46;--ok:#2f8a5f;--warn:#d98a1d;--bad:#c4473a;
--tipbg:#1b2a22;--tipfg:#fff;--tipacc:#ffb27a;--sky1:#bfe0ef;--sky2:#f3f1ea;--mt:#9fb3bf;--mt2:#7f97a4;--hill:#7aa267;--hill2:#5f8a52;--pine:#2f5e45;--lake:#7fb4d6;--wood:#9a6a43;--roof:#5a3b2a;--rm:22px;--ri:12px;--enter:lsIn}
[data-theme=dark]{--bg:#0e1612;--card:#15201b;--card-solid:#18241e;--modal:#18241e;--fg:#e7efe9;--mut:#93a39a;--line:#24342c;--grid:#1d2a24;--hover:rgba(120,220,170,.07);--track:#22312a;--inp:#121c17;
--acc:#4fbf8c;--onacc:#0b1410;--acc2:#ff9d57;--c1:#4fbf8c;--c2:#ff9d57;--c3:#7fb6e0;--c4:#e2c262;--c5:#e08a6e;--ok:#5fd39b;--warn:#f0b14f;--bad:#f07a6a;
--tipbg:#e7efe9;--tipfg:#0e1612;--tipacc:#1f6b4f;--sky1:#0b1424;--sky2:#1b2b3a;--mt:#33475a;--mt2:#26384a;--hill:#20402f;--hill2:#183526;--pine:#0f281d;--lake:#1d3b55;--wood:#6b4a32;--roof:#3a271b}
@keyframes lsIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
body{background:var(--bg)}
/* top bar with tab navigation */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 24px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo svg{width:34px;height:34px}
.nav{position:relative;display:flex;gap:2px;margin:0 auto}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;transition:color .2s}
.nav a .ic{width:17px;height:17px}
.nav a:hover{color:var(--fg)}.nav a[aria-current=page]{color:var(--acc)}
.nav-marker{position:absolute;left:0;top:0;border-radius:12px;background:var(--hover);transition:transform .45s cubic-bezier(.3,1.2,.4,1),width .35s}
.nav-marker::after{content:"";position:absolute;left:22%;right:22%;bottom:-13px;height:3px;border-radius:3px;background:var(--acc)}
.prop{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}.prop b{color:var(--fg);display:block;font-size:14px}
.ib{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);transition:transform .15s,background .2s}
.ib:hover{background:var(--hover)}.ib:active{transform:scale(.92)}
[data-theme=dark] .ib .sun,[data-theme=light] .ib .moon{display:none}
.menu{display:none}
.drawer-nav{display:none}
.view{max-width:1320px;margin:auto;padding:22px 24px 60px;overflow-x:clip}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:30px;letter-spacing:-.03em}.ph p{margin:4px 0 0;color:var(--mut)}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.g{display:grid;gap:18px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 1px 2px rgba(20,40,30,.05),0 14px 34px -22px rgba(20,60,40,.35);min-width:0;position:relative;transition:translate .25s,box-shadow .25s}
.card:hover{translate:0 -2px;box-shadow:0 1px 2px rgba(20,40,30,.05),0 22px 40px -22px rgba(20,60,40,.45)}
[data-theme=dark] .card{box-shadow:0 0 0 1px var(--line),0 18px 40px -24px rgba(0,0,0,.8)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}.ch h2 .ic{color:var(--acc);width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 15px;font-weight:700;font-size:14px;color:var(--fg);transition:transform .12s,background .2s,box-shadow .2s;text-decoration:none}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.95)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);box-shadow:0 10px 22px -12px var(--acc)}
.btn.ember{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}.btn .ic{width:17px;height:17px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ki{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--hover);color:var(--acc);flex:none}
.kpi p{margin:0;font-size:13px;color:var(--mut)}.kpi b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.kpi small{font-size:12px;color:var(--mut)}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}.full{grid-column:1/-1}
.ov{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
/* site map */
.map svg{display:block;width:100%;height:auto;border-radius:16px}
.map .stars{opacity:0;transition:opacity .8s}[data-theme=dark] .map .stars{opacity:1}
.map .sun{transition:transform 1s}
.cab{cursor:pointer;outline:none}
.cab .shape{transition:transform .3s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.cab:hover .shape,.cab:focus-visible .shape{transform:scale(1.08) translateY(-3px)}
.cab:focus-visible .lab rect{stroke:var(--acc);stroke-width:2}
.cab .win{fill:#2c3a44;transition:fill .5s}

.row{display:flex;align-items:center;gap:10px}.sp{flex:1}

.task b{display:block}.task .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.task .acts{display:flex;gap:6px;margin-top:10px}
.prog{height:6px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);width:var(--w);transition:width .4s}
.checks{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}

.thread{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px;color:var(--fg);transition:background .2s}
.thread:hover{background:var(--hover)}.thread[aria-current=true]{background:var(--hover);box-shadow:inset 3px 0 0 var(--acc)}

.unread{min-width:20px;height:20px;border-radius:10px;background:var(--acc2);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px}

.convo-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}

.av{background:hsl(var(--h) 38% 42%)}
.av.sm{width:24px;height:24px;font-size:10px}

.tl li{position:relative;font-size:14px}.tl li::before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--card)}
.tl li.no::before{background:var(--line)}.tl small{color:var(--mut);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:6px 0 16px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
.sw{width:44px;height:25px;border-radius:99px;background:var(--track);border:0;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}

.scrim{display:none}
@media (max-width:1500px){.nav a .ic{display:none}.nav a{padding:9px 11px}}

 .drawer-nav{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;width:250px;z-index:40;background:var(--card);padding:20px 14px;transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 50px rgba(0,0,0,.25)}
 .nav-open .drawer-nav{transform:none}
 .drawer-nav a{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600}.drawer-nav a[aria-current=page]{background:var(--hover);color:var(--acc)}
 .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}.nav-open .scrim{opacity:1;pointer-events:auto}
 .inbox{grid-template-columns:1fr}.threads{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:640px){.view{padding:16px 16px 50px}.top-in{padding:10px 16px}.kpis,.ov,.c2,.c3,.cabins{grid-template-columns:1fr}.span2{grid-column:auto}.ph h1{font-size:25px}.kpi b{font-size:22px}.msg{max-width:88%}.sbtn{display:none}}

<script>
/* ===== Core helpers: DOM, numbers, seeded data ===== */
const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');

const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

const fromIso = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };

const ago = (d) => { const s = (Date.now() - d) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : Math.floor(s / 86400) + ' d ago'; };
const monthsBack = (n) => [...Array(n)].map((_, i) => MON[(TODAY.getMonth() - n + 1 + i + 120) % 12]);
const daysBack = (n) => [...Array(n)].map((_, i) => dfmt(addDays(TODAY, i - n + 1)));
/* Storage that never throws (works when storage is blocked) */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};
