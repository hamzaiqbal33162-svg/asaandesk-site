<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarly · Money jars for freelancers</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: warm cream + terracotta (light), cocoa + ember (dark) ---------- */
  :root {
    --bg: #f5efe6; --side: #efe5d7; --surface: #fffaf3; --surface-2: #f3eadf; --panel: #fffaf3;
    --ink: #2b211b; --muted: #85766a; --line: #e5d8c7; --grid: #ece2d4;
    --accent: #d2602f; --accent-ink: #fff; --accent-soft: #f7dccb; --good: #4f9a5a; --bad: #d2463d; --warn: #d98b1f;
    --glass: rgba(255,255,255,.55); --glass-line: #cdbca6;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -18px rgba(90,55,25,.35);
    --shadow-lg: 0 18px 40px -18px rgba(90,55,25,.45);
    --radius: 24px; --radius-sm: 14px; --tip-bg: #2b211b; --tip-ink: #fff7ee;
    --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #17110e; --side: #1d1612; --surface: #231a15; --surface-2: #2d221c; --panel: #261c17;
    --ink: #f7ece1; --muted: #b29f90; --line: #3a2d25; --grid: #33271f;
    --accent: #f07c48; --accent-ink: #1c120d; --accent-soft: #4a2a1b; --good: #78c07f; --bad: #f06a5f; --warn: #f0aa45;
    --glass: rgba(255,240,225,.06); --glass-line: #5b4738;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px -20px rgba(0,0,0,.8);
    --shadow-lg: 0 22px 44px -20px rgba(0,0,0,.9);
    --tip-bg: #f7ece1; --tip-ink: #231a15;
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- App shell ---------- */
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; transition: background .3s, color .3s; }
  .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
  .brand svg { width: 36px; height: 36px; }
  .nav { position: relative; display: grid; gap: 4px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 16px; color: var(--muted); text-decoration: none; font-weight: 650; transition: color .25s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--accent); }
  .nav .ic { width: 20px; height: 20px; }
  .nav .mark { position: absolute; left: 0; right: 0; top: 0; height: 44px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); transition: transform .5s cubic-bezier(.3,1.35,.5,1), height .3s, opacity .2s; }
  .nav .mark::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: var(--accent); }
  .side-foot { margin-top: auto; display: grid; gap: 12px; }
  .tip-card { padding: 14px; border-radius: 18px; background: var(--accent-soft); font-size: .85rem; }
  .tip-card b { display: block; margin-bottom: 4px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px; font-size: .86rem; }
  .me small { display: block; color: var(--muted); }
  main { min-width: 0; padding: 20px 28px 48px; overflow-x: clip; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .top h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.03em; }
  .top p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .top .grow { flex: 1; min-width: 0; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .15s, border-color .2s; }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn .ic { width: 20px; height: 20px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 800; display: grid; place-items: center; }
  .badge:empty { display: none; }
  .search-btn { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); min-width: 200px; }
  .search-btn kbd { margin-left: auto; font: inherit; font-size: .75rem; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }

/* Bar chart (grouped or stacked). o = {labels, series:[{name,data,color}], stacked, height, fmt} */

    el.innerHTML = s + "</div>";

/* Half-circle gauge. o = {value, max, color, label, fmt, size} */

    const o = el._o, W = o.size || 200, H = W * 0.62, r = W / 2 - 14, cx = W / 2, cy = W / 2;
    const p = clamp((o.value || 0) / (o.max || 1), 0, 1);

    el.innerHTML = `<div class="cc-gauge"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${esc((o.label || "Gauge") + ": " + Math.round(p * 100) + "%")}"><path class="cc-track" d="${arc}" style="stroke-width:${o.thick || 14}"/><path class="cc-gfill" d="${arc}" pathLength="100" style="stroke:${o.color};stroke-width:${o.thick || 14}" stroke-dasharray="0 100"/><circle class="cc-gknob" r="5" cx="${cx - r}" cy="${cy}" style="fill:${o.color}"/></svg><div class="cc-gauge-c"><b>${esc((o.fmt || ((v) => Math.round(v * 100) + "%"))(p))}</b><small>${esc(o.label || "")}</small></div></div>`;
    const fill = $(".cc-gfill", el), knob = $(".cc-gknob", el);
    const set = (t) => { const q = p * t; fill.setAttribute("stroke-dasharray", `${q * 100} 100`); const a = Math.PI * (1 - q); knob.setAttribute("cx", cx + r * Math.cos(a)); knob.setAttribute("cy", cy - r * Math.sin(a)); };

    el.onpointermove = (e) => tip.show(e, `<b>${esc(o.label || "")}</b><div>${esc(o.tip || Math.round(p * 100) + "% of target")}</div>`);
    el.onpointerleave = () => tip.hide();
  });
}

/* Sparkline as an SVG string (for KPI cards and table rows) */
function spark(data, color = "currentColor", w = 96, h = 30, area = true) {
  if (!data || data.length < 2) return "";
  const lo = Math.min(...data), hi = Math.max(...data), rg = hi - lo || 1;
  const pts = data.map((v, i) => [(i * (w - 2)) / (data.length - 1) + 1, h - 3 - ((v - lo) / rg) * (h - 6)]);
  const d = pathD(pts, true), id = "sp" + uid();
  return `<svg class="cc-spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${area ? `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path class="cc-fade" d="${d}L${w - 1},${h}L1,${h}Z" fill="url(#${id})"/>` : ""}<path class="cc-line cc-draw" pathLength="1" d="${d}" style="stroke:${color}"/></svg>`;
}

/* Heatmap grid. o = {rows, cols, data:[[v]], color, fmt, cell} */
function heatmap(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, W = Math.max(260, el.clientWidth || 640), L = o.padL || 40, T = 18;
    const cw = (W - L) / o.cols.length, ch = o.cell || Math.min(26, cw);
    const H = T + ch * o.rows.length + 4, all = o.data.flat(), hi = Math.max(...all, 1), f = o.fmt || short;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Heatmap")}" class="cc-chart${again ? " cc-static" : ""}">`;
    const every_ = Math.max(1, Math.ceil(o.cols.length / Math.floor((W - L) / 34)));
    s += o.cols.map((c, j) => (j % every_ === 0 ? `<text class="cc-xl" x="${L + cw * j + cw / 2}" y="12" text-anchor="middle">${esc(c)}</text>` : "")).join("");
    o.rows.forEach((rw, i) => {
      s += `<text class="cc-xl" x="${L - 6}" y="${T + ch * i + ch / 2 + 4}" text-anchor="end">${esc(rw)}</text>`;
      o.cols.forEach((c, j) => { const v = o.data[i][j] || 0; s += `<rect class="cc-cell" data-r="${i}" data-c="${j}" x="${(L + cw * j + 1.5).toFixed(1)}" y="${T + ch * i + 1.5}" width="${Math.max(1, cw - 3).toFixed(1)}" height="${Math.max(1, ch - 3)}" rx="${Math.max(0, Math.min(5, ch / 4))}" style="fill:${o.color};fill-opacity:${(0.08 + (v / hi) * 0.92).toFixed(2)};animation-delay:${(i + j) * 18}ms"/>`; });
    });
    el.innerHTML = s + "</svg>";
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => { const c = e.target.closest(".cc-cell"); if (!c) return tip.hide(); tip.show(e, `<b>${esc(o.rows[+c.dataset.r])} · ${esc(o.cols[+c.dataset.c])}</b><div>${esc(f(o.data[+c.dataset.r][+c.dataset.c]))}</div>`); });
    svg.addEventListener("pointerleave", () => tip.hide());
  });
}

/* Pointer drag helper (mouse, touch and pen) */
function dragify(el, { start, move, end }) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    const s = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, e };
    if (start && start(s, e) === false) return;
    if (el.setPointerCapture && e.pointerId != null) try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const mv = (ev) => { s.dx = ev.clientX - s.x; s.dy = ev.clientY - s.y; if (Math.abs(s.dx) + Math.abs(s.dy) > 4) s.moved = true; if (move) move(s, ev); };
    const up = (ev) => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); if (end) end(s, ev); };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  });
}

/* Animate a number inside every [data-count] element of a root */

function jarCard(j) {

    <div class="grab" title="Drag onto another jar to pour">${jarSVG(j)}</div>

  </article>`;

function wireJars() {
  const box = $("#jarsBox");
  /* Drag sources: every jar's glass, plus the coin pot */
  [...$$(".jar .grab", box), $("#pot")].forEach((h) => {
    const card = h.closest("[data-jar]");
    let targets = [], over = null;
    dragify(h, {
      start: (s, e) => {
        if (balOf(card.dataset.jar) <= 0) { toast("That one is empty", "warn"); return false; }
        targets = $$("[data-jar]", view).filter((x) => x !== card).map((el) => ({ el, r: el.getBoundingClientRect() }));
        card.classList.add("drag", "live");
        tip.hide();
      },
      move: (s, e) => {
        card.style.transform = `translate(${s.dx}px,${s.dy}px) rotate(${clamp(s.dx / 9, -22, 22)}deg)`;
        const t = targets.find((t) => e.clientX >= t.r.left && e.clientX <= t.r.right && e.clientY >= t.r.top && e.clientY <= t.r.bottom) || null;
        if (over !== t) { if (over) over.el.classList.remove("target"); over = t; if (over) over.el.classList.add("target"); }
      },
      end: () => {
        card.classList.remove("drag", "live");
        card.style.transform = "";
        if (over) { over.el.classList.remove("target"); askPour(card.dataset.jar, over.el.dataset.jar); }
        over = null;
      },
    });
  });
  box.addEventListener("click", (e) => {
    const card = e.target.closest("[data-jar]");
    if (!card) return;
    const id = card.dataset.jar;
    if (e.target.closest("[data-pour]")) pickBox("Pour from " + nameOf(id) + " into…", [{ value: "un", label: "Waiting to sort", icon: "coin" }].concat(S.jars.filter((j) => j.id !== id).map((j) => ({ value: j.id, label: j.name, icon: j.icon, hint: money(j.bal) })))).then((to) => { if (to) askPour(id, to); });
    if (e.target.closest("[data-edit]")) jarForm(jarOf(id));
    if (e.target.closest("[data-del]")) confirmBox(`Delete the jar "${nameOf(id)}"? Its ${money(balOf(id))} moves back to Waiting to sort.`).then((ok) => { if (!ok) return; S.un += balOf(id); S.jars = S.jars.filter((j) => j.id !== id); save(); toast("Jar deleted"); rerender(); });
  });
  $("#autoSplit").addEventListener("click", autoSplit);
  $("#newJar").addEventListener("click", () => jarForm(null));
}
function askPour(from, to) {
  const have = balOf(from);
  if (have <= 0) return toast(nameOf(from) + " is empty", "warn");
  formModal({
    title: `Pour into ${nameOf(to)}`,
    intro: `From <b>${esc(nameOf(from))}</b>, which holds ${money(have)}.`,
    values: { amt: Math.max(100, Math.round((have * 0.25) / 100) * 100) },
    fields: [{ name: "amt", label: "How much? (Rs)", type: "number", required: true, min: 1, max: have, hint: "Tip: pour the whole lot by typing " + num(have) }],
    submit: "Pour",
    onSubmit: (v) => { setTimeout(() => doPour(from, to, v.amt), 120); },
  });
}
function doPour(from, to, amt, quiet) {
  amt = Math.min(amt, balOf(from));
  if (amt <= 0) return;
  addBal(from, -amt); addBal(to, amt);
  S.pours.unshift({ id: uid(), date: iso(TODAY), from, to, amt });
  save();
  pourAnim(from, to);
  if (!quiet) { toast(`Poured ${money(amt)} into ${nameOf(to)}`); if (jarOf(to) && jarOf(to).bal >= jarOf(to).goal) note(nameOf(to) + " reached its goal", "star"); }
  clearTimeout(doPour.t);
  doPour.t = setTimeout(() => { if (current === "jars" && $("#pourTbl")) drawPourSide(); }, 1300);
}
/* Update levels + numbers in place so the liquid animates */
function refreshJarEls() {
  $$("[data-jar]").forEach((el) => {
    const id = el.dataset.jar, j = jarOf(id);
    const a = $("[data-amt]", el);
    if (a) { if (a.dataset.to != null || a.dataset.v != null) countUp(a, balOf(id), (v) => money(v)); else a.textContent = money(balOf(id)); }
    if (!j) { if (id === "un") { const c = $(".coins", el); if (c) c.outerHTML = coinsSVG(S.un); } return; }
    const l = $(".liq", el); if (l) l.style.transform = `translateY(${levelY(j)}px)`;
    const p = Math.round((j.bal / (j.goal || 1)) * 100);
    const pe = $("[data-pct]", el); if (pe) pe.textContent = p + "%";
    const pr = $(".prog i", el); if (pr) pr.style.width = clamp(p, 0, 100) + "%";
  });
}
function pourAnim(from, to) {
  const box = $("#jarsBox"), a = $(`[data-jar="${from}"]`, view), b = $(`[data-jar="${to}"]`, view);
  if (!box || !a || !b || RM) { refreshJarEls(); return; }
  const br = box.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const sx = ra.left + ra.width / 2 - br.left, sy = ra.top + 26 - br.top, tx = rb.left + rb.width / 2 - br.left, ty = rb.top + 34 - br.top;
  const cx = (sx + tx) / 2, cy = Math.min(sy, ty) - 110;
  a.style.setProperty("--tilt", (tx >= sx ? 1 : -1) * 34 + "deg");
  a.classList.add("tilt", "live"); b.classList.add("fill", "live");
  const svg = $("#stream"), col = colorOf(from);
  svg.setAttribute("viewBox", `0 0 ${br.width || 1} ${br.height || 1}`);
  svg.innerHTML = `<path class="cc-draw" pathLength="1" d="M${sx},${sy} Q${cx},${cy} ${tx},${ty}" style="stroke:${col}"/>` + [0, 1, 2, 3, 4, 5].map((i) => `<circle r="${6 - i * 0.7}" style="fill:${col};opacity:0"/>`).join("");
  const drops = $$("circle", svg), qb = (t, p0, p1, p2) => (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * p1 + t * t * p2;
  setTimeout(refreshJarEls, 380);
  tween(1200, (t) => drops.forEach((d, i) => { const u = clamp(t * 1.35 - i * 0.07, 0, 1); d.setAttribute("cx", qb(u, sx, cx, tx)); d.setAttribute("cy", qb(u, sy, cy, ty)); d.style.opacity = u > 0 && u < 1 ? 1 : 0; }), () => {
    svg.innerHTML = "";
    a.classList.remove("tilt", "live"); b.classList.remove("fill", "live");
  });
}
function autoSplit() {
  const total = S.un, rules = S.jars.filter((j) => j.rule > 0);
  if (total <= 0) return toast("Nothing is waiting to sort", "warn");
  if (!rules.length) return toast("Set split rules in Settings first", "warn");
  rules.forEach((j, i) => setTimeout(() => doPour("un", j.id, Math.round((total * j.rule) / 100), true), RM ? 0 : i * 420));
  setTimeout(() => { toast(`Split ${money(total)} across ${rules.length} jars`); note("Auto-split sorted " + money(total), "bolt"); save(); }, RM ? 10 : rules.length * 420 + 300);
}

    title: inv.no, drawer: true,
    html: `<div class="inv-head"><div><small class="muted">Billed to</small><div><b>${esc(inv.client)}</b></div><small class="muted">Issued ${fdateY(inv.issued)} · due ${fdateY(inv.due)}</small></div><span class="pill st-${inv.status}"><i style="background:currentColor"></i>${inv.status}</span></div>
      <table class="inv-lines"><tbody>${lines.map(([l, f]) => `<tr><td>${esc(l)}</td><td>${money(Math.round(inv.amt * f))}</td></tr>`).join("")}<tr><td><b>Total</b></td><td><b>${money(inv.amt)}</b></td></tr></tbody></table>
      <div class="drawer-acts">${inv.status !== "Paid" ? `<button class="btn primary" data-a="paid">${ic("check")}Mark as paid</button>` : ""}${inv.status === "Draft" ? `<button class="btn" data-a="send">${ic("send")}Send</button>` : ""}${inv.status === "Sent" || inv.status === "Overdue" ? `<button class="btn" data-a="remind">${ic("bell")}Send reminder</button>` : ""}<button class="btn" data-a="del">${ic("trash")}Delete</button></div>`,
  });
  m.body.addEventListener("click", (e) => {
    const a = e.target.closest("[data-a]");
    if (!a) return;
    const act = a.dataset.a;
    if (act === "paid") { inv.status = "Paid"; S.tx.unshift({ id: uid(), type: "in", what: inv.client, cat: "Client work", amt: inv.amt, date: iso(TODAY) }); S.un += inv.amt; note(`${inv.client} paid ${inv.no}`, "in"); toast(`${money(inv.amt)} landed in Waiting to sort`); }
    if (act === "send") { inv.status = "Sent"; toast(inv.no + " sent to " + inv.client); }
    if (act === "remind") { toast("Friendly reminder sent to " + inv.client); }
    if (act === "del") { m.close(); return confirmBox(`Delete invoice ${inv.no}?`).then((ok) => { if (ok) { S.inv = S.inv.filter((x) => x !== inv); save(); toast("Invoice deleted"); rerender(); } }); }
    save(); m.close(); rerender();
  });
}
PAGE.invoices = () => {
  const tot = (s) => sum(S.inv.filter((i) => i.status === s).map((i) => i.amt));
  const cnt = (s) => S.inv.filter((i) => i.status === s).length;
  const col = { Draft: "var(--muted)", Sent: "#3f84c4", Overdue: "var(--bad)", Paid: "var(--good)" };
  view.innerHTML = `<div class="grid">
    ${STATUS.map((s) => `<div class="card kpi s3"><div class="lbl"><span style="color:${col[s]}">${ic(s === "Paid" ? "check" : s === "Overdue" ? "clock" : s === "Sent" ? "send" : "edit")}</span>${s}</div><div class="val" data-to="${tot(s)}">${money(0)}</div><small class="muted">${cnt(s)} invoice${cnt(s) === 1 ? "" : "s"}</small></div>`).join("")}
    <section class="card s12"><div class="card-h"><h2>Invoices</h2><small>click a row to open it</small><span class="grow"></span><button class="btn primary" id="newInv">${ic("plus")}New invoice</button></div><div id="invTbl"></div></section>
  </div>`;
  $("#newInv").addEventListener("click", invoiceForm);
  dataTable($("#invTbl"), {
    rows: () => S.inv, search: "Search invoices…", sort: "issued",
    chips: { k: "status", values: ["All"].concat(STATUS) },
    cols: [{ k: "no", label: "Invoice" }, { k: "client", label: "Client" }, { k: "note", label: "Work" }, { k: "issued", label: "Issued", f: (v) => fdate(v) }, { k: "due", label: "Due", f: (v) => fdate(v) }, { k: "status", label: "Status", f: (v) => `<span class="pill st-${v}"><i style="background:currentColor"></i>${v}</span>` }, { k: "amt", label: "Amount", cls: "r", f: (v) => money(v) }],
    onRow: invoiceDrawer, empty: "No invoices match", emptyIcon: "file",
  });
};

/* ---------- Reports ---------- */
let repRange = "12M";
PAGE.reports = () => {
  const mi = monthly("in"), mo = monthly("out");
  const outs = S.tx.filter((t) => t.type === "out");
  const cats = Object.keys(CATS).map((c) => ({ c, v: sum(outs.filter((t) => t.cat === c).map((t) => t.amt)) })).sort((x, y) => y.v - x.v);
  const topV = cats[0] ? cats[0].v || 1 : 1;
  view.innerHTML = `<div class="grid">
    <section class="card s8"><div class="card-h"><h2>Earned, spent and kept</h2><span class="grow"></span><div class="seg" role="group" aria-label="Range">${["6M", "12M"].map((r) => `<button type="button" data-r="${r}" aria-pressed="${r === repRange}">${r}</button>`).join("")}</div></div><div id="repLine"></div></section>
    <section class="card s4"><div class="card-h"><h2>Savings rate</h2><small id="rateR"></small></div><div id="rate"></div><p class="muted" style="text-align:center;margin:8px 0 0" id="rateTxt" aria-live="polite"></p></section>
    <section class="card s6"><div class="card-h"><h2>Biggest categories</h2><small>last 2 months</small></div><div class="hbar">${cats.slice(0, 7).map((x, i) => `<div><span>${esc(x.c)}</span><span class="track"><i data-w="${(x.v / topV) * 100}" style="background:${PALETTE[i % PALETTE.length][0]}"></i></span><b>${moneyShort(x.v)}</b></div>`).join("")}</div></section>
    <section class="card s6"><div class="card-h"><h2>Jar goals</h2></div><div class="hbar">${S.jars.map((j) => `<div><span>${esc(j.name)}</span><span class="track"><i data-w="${clamp((j.bal / j.goal) * 100, 0, 100)}" style="background:${j.color}"></i></span><b>${Math.round((j.bal / j.goal) * 100)}%</b></div>`).join("")}</div></section>
    <section class="card s12"><div class="card-h"><h2>Kept each month</h2><small>money in minus money out</small></div><div id="keptBars"></div></section>
  </div>`;
  /* Range switch: the line morphs, the gauge and bars redraw */
  const drawRep = (morph) => {
    const n = repRange === "6M" ? 6 : 12, a = mi.slice(12 - n), b = mo.slice(12 - n), saved = a.map((v, i) => v - b[i]);
    const rate = sum(a) ? (sum(saved) / sum(a)) * 100 : 0;
    lineChart($("#repLine"), { labels: monthLabels(12).slice(12 - n), area: true, height: 250, series: [{ name: "Earned", data: a, color: "var(--good)" }, { name: "Spent", data: b, color: "var(--accent)" }, { name: "Kept", data: saved, color: "#4a8bc4", dash: true }], tipFmt: (v) => money(v) }, morph);
    gauge($("#rate"), { value: clamp(rate, 0, 100), max: 100, color: "var(--good)", label: "of income kept", fmt: () => Math.round(rate) + "%", tip: "Target: keep 30% or more" });
    barChart($("#keptBars"), { labels: monthLabels(12).slice(12 - n), series: [{ name: "Kept", data: saved, color: "var(--accent)" }], height: 200, tipFmt: (v) => money(v) });
    $("#rateR").textContent = repRange;
    $("#rateTxt").innerHTML = `You kept <b>${money(sum(saved))}</b> of ${money(sum(a))} earned.`;
  };
  drawRep(false);
  requestAnimationFrame(() => $$("[data-w]", view).forEach((i) => (i.style.width = i.dataset.w + "%")));
  $$(".seg button", view).forEach((b) => b.addEventListener("click", () => { repRange = b.dataset.r; $$(".seg button", view).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); drawRep(true); }));
};

/* ---------- Settings ---------- */
PAGE.settings = () => {
  view.innerHTML = `<div class="grid">
    <section class="card s6"><div class="card-h"><h2>Profile</h2></div>
      <form id="prof" class="cc-form" novalidate><div class="cc-fields">
        <div class="cc-field"><label for="pName">Your name</label><input id="pName" name="name" value="${esc(S.profile.name)}" required aria-describedby="pNameE"><small class="cc-err" id="pNameE"></small></div>
        <div class="cc-field"><label for="pRole">What you do</label><input id="pRole" name="role" value="${esc(S.profile.role)}"></div>
        <div class="cc-field"><label for="pCur">Currency</label><select id="pCur" disabled><option>Pakistani rupee (Rs)</option></select><small class="cc-hint">Amounts are shown in rupees.</small></div>
      </div><div class="cc-df"><button class="btn primary" type="submit">Save profile</button></div></form></section>
    <section class="card s6"><div class="card-h"><h2>Auto-split rules</h2><span class="grow"></span><small id="ruleSum"></small></div>
      <form id="rules" novalidate><div class="rules">${S.jars.map((j) => `<label><span class="chipjar"><i style="background:${j.color}"></i>${esc(j.name)}</span><input type="number" min="0" max="100" name="${j.id}" value="${j.rule}" aria-label="${esc(j.name)} percent"></label>`).join("")}</div><p class="cc-err" id="ruleErr" role="alert"></p><div class="cc-df"><button class="btn primary" type="submit">Save rules</button></div></form></section>
    <section class="card s12"><div class="card-h"><h2>App</h2></div>
      <div class="set-row"><div><b>Theme</b><small>Light cream or dark cocoa</small></div><div class="seg" role="group" aria-label="Theme"><button type="button" data-th="light" aria-pressed="${APP.theme() === "light"}">Light</button><button type="button" data-th="dark" aria-pressed="${APP.theme() === "dark"}">Dark</button></div></div>
      <div class="set-row"><div><b>Notifications</b><small>${S.notes.length} saved notes</small></div><button class="btn" id="clearNotes">${ic("bell")}Clear notifications</button></div>
      <div class="set-row"><div><b>Reset demo data</b><small>Puts every jar, payment and invoice back to the start</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div>
    </section>
  </div>`;
  const sumRules = () => sum($$("#rules input").map((i) => +i.value || 0));
  const showSum = () => { const s = sumRules(); $("#ruleSum").textContent = s + "% of new money" + (s < 100 ? " · " + (100 - s) + "% stays unsorted" : ""); };
  showSum();
  $("#rules").addEventListener("input", showSum);
  $("#rules").addEventListener("submit", (e) => {
    e.preventDefault();
    const s = sumRules(), bad = $$("#rules input").find((i) => i.value === "" || +i.value < 0 || +i.value > 100);
    if (bad) { $("#ruleErr").textContent = "Each rule must be between 0 and 100."; bad.focus(); return; }
    if (s > 100) { $("#ruleErr").textContent = `Rules add up to ${s}%. Bring them down to 100% or less.`; return; }
    $("#ruleErr").textContent = "";
    $$("#rules input").forEach((i) => (jarOf(i.name).rule = +i.value));
    save(); toast("Split rules saved");
  });
  $("#prof").addEventListener("submit", (e) => {
    e.preventDefault();
    const n = $("#pName").value.trim();
    $("#pNameE").textContent = n ? "" : "Please enter your name";
    n ? $("#pName").removeAttribute("aria-invalid") : $("#pName").setAttribute("aria-invalid", "true");
    if (!n) return $("#pName").focus();
    S.profile = { name: n, role: $("#pRole").value.trim() };
    save(); drawMe(); toast("Profile saved");
  });
  $$("[data-th]").forEach((b) => b.addEventListener("click", () => { setTheme(b.dataset.th); $$("[data-th]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
  $("#clearNotes").addEventListener("click", () => confirmBox("Clear all notifications?", "Clear").then((ok) => { if (ok) { S.notes = []; save(); drawBell(); toast("Notifications cleared"); rerender(); } }));
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data? Your changes will be lost.", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); save(); drawMe(); drawBell(); toast("Demo data reset"); rerender(); } }));
};

/* ---------- Start ---------- */
drawMe();
drawBell();
initShell(() => pageCmds(PAGES, [
  { label: "Add money in", icon: "plus", run: () => addIncome() },
  { label: "Add spending", icon: "out", run: () => expenseForm() },
  { label: "New invoice", icon: "file", run: invoiceForm },
  { label: "Auto-split waiting money", icon: "bolt", run: () => { location.hash = "#/jars"; setTimeout(autoSplit, 400); } },
  { label: "New jar", icon: "jar", run: () => jarForm(null) },
  { label: "Toggle theme", icon: "moon", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
]));
startRouter(PAGES.map((p) => p[0]), "overview", render);
</script>
</body>
</html>
