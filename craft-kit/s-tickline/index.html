<!doctype html>
<!-- Chill & Craft · Tickline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tickline · Chat send with delivery ticks</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #eceefb;
    --blob1: #c9cffd;
    --blob2: #f3d3fb;
    --card: #ffffff;
    --ink: #1c1a3a;
    --muted: #6d6b8f;
    --line: rgba(28, 26, 58, 0.09);
    --in: #f1f0fa;
    --out1: #5646ee;
    --out2: #9256f4;
    --read: #8ff5df;
    --tip: #1c1a3a;
    --tip-ink: #fff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b0b1c;
    --blob1: #2a2775;
    --blob2: #4a1a6b;
    --card: #15152d;
    --ink: #ecebff;
    --muted: #9a98c4;
    --line: rgba(255, 255, 255, 0.08);
    --in: #232348;
    --out1: #5e4ff5;
    --out2: #9a5cf7;
    --read: #7ef0d6;
    --tip: #ecebff;
    --tip-ink: #15152d;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Stage: soft drifting blobs behind the chat ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; isolation: isolate; }
  .stage::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(var(--line) 1px, transparent 1.4px); background-size: 22px 22px; mask: radial-gradient(60% 60% at 50% 50%, #000, transparent); -webkit-mask: radial-gradient(60% 60% at 50% 50%, #000, transparent); }
  .blob { position: absolute; z-index: -2; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(60px); opacity: 0.75; }
  .b1 { background: var(--blob1); left: -12vmax; top: -14vmax; animation: drift1 16s ease-in-out infinite alternate; }
  .b2 { background: var(--blob2); right: -14vmax; bottom: -16vmax; animation: drift2 19s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(10vmax, 8vmax) scale(1.1); } }
  @keyframes drift2 { to { transform: translate(-9vmax, -7vmax) scale(0.92); } }

  /* ---------- Chat card ---------- */
  .chat {
    position: relative;
    width: min(380px, 100%);
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 40px 70px -40px rgba(50, 30, 140, 0.55), 0 0 0 1px var(--line);
    display: flex;
    flex-direction: column;
    animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(0.97); } }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .ava { position: relative; width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.86rem; letter-spacing: 0.02em; color: #fff; background: linear-gradient(135deg, #f472b6, #a855f7); }
  .ava .on { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2.5px solid var(--card); }
  .ava .on::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid #22c55e; animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 70%, 100% { transform: scale(1.8); opacity: 0; } }
  .who { display: grid; line-height: 1.25; flex: 1; min-width: 0; }
  .who strong { font-size: 1rem; }
  .state { display: block; height: 1.25em; overflow: hidden; font-size: 0.8rem; color: var(--muted); }
  .state span { display: block; }
  .state.typing { color: var(--out1); font-weight: 600; }
  .head .icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--in); }
  .head .icon svg { width: 18px; height: 18px; }

  /* ---------- Thread: anchored to the bottom, old messages slide out under a fade ---------- */
  .thread {
    list-style: none;
    margin: 0;
    padding: 18px 16px 10px 34px;
    height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    overflow: hidden;
    -webkit-mask: linear-gradient(to bottom, transparent 0, #000 56px);
    mask: linear-gradient(to bottom, transparent 0, #000 56px);
  }
  .day { align-self: center; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--in); }
  .msg {
    position: relative;
    max-width: 80%;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: flex-end;
    column-gap: 8px;
    padding: 8px 12px 7px;
    border-radius: 18px;
    font-size: 0.93rem;
    line-height: 1.35;
    flex: none;
  }
  .msg p { margin: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
  .meta { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; font-size: 0.68rem; opacity: 0.78; white-space: nowrap; }
  .in { align-self: flex-start; background: var(--in); border-bottom-left-radius: 6px; }
  .out { align-self: flex-end; color: #fff; background: linear-gradient(135deg, var(--out1), var(--out2)); border-bottom-right-radius: 6px; box-shadow: 0 10px 20px -12px var(--out1); }
  .in .meta { color: var(--muted); opacity: 1; }

  /* Delivery ticks: clock while sending, one tick sent, two delivered, mint when read */
  .ticks { width: 17px; height: 13px; overflow: visible; }
  .ticks path, .ticks circle { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ticks .t1, .ticks .t2 { stroke-dasharray: 1 2; stroke-dashoffset: 1; transition: stroke-dashoffset 0.38s cubic-bezier(0.6, 0, 0.2, 1), stroke 0.5s ease; }
  .ticks .clock { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.3); transition: opacity 0.2s, transform 0.3s; }
  .ticks .hand { transform-box: fill-box; transform-origin: 50% 100%; }
  .msg[data-s="sending"] .clock { opacity: 1; transform: none; }
  .msg[data-s="sending"] .hand { animation: tick 0.9s linear infinite; }
  @keyframes tick { to { transform: rotate(360deg); } }
  .msg:is([data-s="sent"], [data-s="delivered"], [data-s="read"]) .t1 { stroke-dashoffset: 0; }
  .msg:is([data-s="delivered"], [data-s="read"]) .t2 { stroke-dashoffset: 0; transition-delay: 0.05s; }
  .msg[data-s="read"] .ticks .t1, .msg[data-s="read"] .ticks .t2 { stroke: var(--read); }
  .msg[data-s="read"] .meta { opacity: 1; }

  /* Tiny "seen" avatar that hops to the latest read message */
  .seen { position: absolute; left: -24px; bottom: 1px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 6.5px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #f472b6, #a855f7); box-shadow: 0 0 0 2px var(--card); }

  /* Reaction pinned on a bubble */
  .react { position: absolute; top: -9px; left: -10px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--line); }
  .react svg { width: 13px; height: 13px; }

  /* Typing bubble */
  .typing { padding: 12px 14px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: hop 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hop { 0%, 60%, 100% { transform: none; opacity: 0.45; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* Ghost bubble that flies from the input to the thread */
  .ghost { position: fixed; z-index: 20; margin: 0; pointer-events: none; color: #fff; background: linear-gradient(135deg, var(--out1), var(--out2)); border-radius: 18px 18px 6px 18px; padding: 8px 12px 7px; font-size: 0.93rem; line-height: 1.35; overflow: hidden; box-shadow: 0 18px 30px -14px var(--out1); }

  /* ---------- Composer ---------- */
  .composer { position: relative; display: flex; gap: 8px; align-items: center; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .field { position: relative; flex: 1; min-width: 0; }
  #text { width: 100%; height: 46px; border-radius: 23px; border: 1.5px solid transparent; background: var(--in); color: var(--ink); padding: 0 16px; font: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  #text::placeholder { color: var(--muted); }
  #text:focus-visible { border-color: var(--out1); box-shadow: 0 0 0 4px rgba(86, 70, 238, 0.18); }
  .send {
    position: relative;
    width: 46px;
    height: 46px;
    flex: none;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--out1), var(--out2));
    box-shadow: 0 10px 20px -10px var(--out1);
    transition: filter 0.3s, opacity 0.3s, transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .send.empty { filter: saturate(0.25); opacity: 0.6; transform: scale(0.92); }
  .send:not(.empty):hover { transform: scale(1.06) rotate(-6deg); }
  .send:focus-visible { outline: 3px solid var(--out1); outline-offset: 3px; }
  .send svg { width: 20px; height: 20px; overflow: visible; }
  .send .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--out2); opacity: 0; pointer-events: none; }
  .hint { position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); white-space: nowrap; padding: 7px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; background: var(--tip); color: var(--tip-ink); pointer-events: none; transition: opacity 0.2s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .hint:empty { opacity: 0; transform: translate(-50%, 6px); }

  .spark { position: fixed; z-index: 30; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; }

  /* Roomier on big screens */
  @media (min-width: 1000px) and (min-height: 720px) {
    .chat { width: 410px; }
    .thread { height: 360px; }
    .msg, .ghost { font-size: 0.97rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .ava .on::after, .dots i, .msg[data-s="sending"] .hand, .chat { animation: none; }
    .ticks .t1, .ticks .t2, .send, .hint { transition: none; }
    .spark { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="blob b1" aria-hidden="true"></div>
    <div class="blob b2" aria-hidden="true"></div>

    <section class="chat" aria-label="Chat with Zara Khan">
      <header class="head">
        <span class="ava" aria-hidden="true">ZK<i class="on"></i></span>
        <div class="who">
          <strong>Zara Khan</strong>
          <span class="state" id="presence"><span>online</span></span>
        </div>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" /></svg>
        </span>
      </header>

      <ol class="thread" id="thread" aria-label="Messages">
        <li class="day">Today</li>
        <li class="msg in"><p>Are we still on for chai at 5?</p><span class="meta">4:52</span></li>
        <li class="msg out" data-s="read"><p>Yes! Leaving the office now</p><span class="meta">4:53</span></li>
        <li class="msg in"><p>I'll grab a table outside, it's lovely today</p><span class="meta">4:55</span></li>
      </ol>

      <form class="composer" id="composer" autocomplete="off">
        <p class="hint" id="hint" aria-live="polite"></p>
        <div class="field">
          <label class="sr-only" for="text">Message to Zara</label>
          <input id="text" type="text" maxlength="120" placeholder="Message Zara" enterkeyhint="send" />
        </div>
        <button class="send empty" id="send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g class="arrow" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-5 16-3-7-8-1Z" /><path d="m12 13 8-9" /></g></svg>
          <span class="ring" aria-hidden="true"></span>
        </button>
      </form>
    </section>

    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

<script>
  // ---------- Tickline: chat send with clock → sent → delivered → seen ticks ----------
  const $ = (s, r = document) => r.querySelector(s);
  const thread = $("#thread");
  const form = $("#composer");
  const input = $("#text");
  const sendBtn = $("#send");
  const arrow = sendBtn.querySelector(".arrow");
  const ring = sendBtn.querySelector(".ring");
  const hint = $("#hint");
  const status = $("#status");
  const presence = $("#presence");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // A real spring curve where supported, a bouncy cubic-bezier elsewhere
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";

  function play(el, frames, opts) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { status.textContent = t; };
  const now = () => { const d = new Date(); return (d.getHours() % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0"); };

  const TICKS = '<svg class="ticks" viewBox="0 0 17 14" aria-hidden="true"><g class="clock"><circle cx="7" cy="7" r="5" /><path class="hand" d="M7 7V4.2" /></g>' +
    '<path class="t1" pathLength="1" d="M1.5 7.6 4.6 10.6 10.8 4.4" /><path class="t2" pathLength="1" d="M7.4 10.3 7.7 10.6 13.9 4.4" /></svg>';
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f43f5e" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21Z"/></svg>';

  // Give the starter message its ticks and the seen avatar
  const seen = document.createElement("span");
  seen.className = "seen";
  seen.setAttribute("aria-hidden", "true");
  seen.textContent = "ZK";
  thread.querySelectorAll(".out .meta").forEach((m) => m.insertAdjacentHTML("beforeend", TICKS));
  thread.querySelector(".out").appendChild(seen);

  // Entrance: the starter bubbles pop in one by one
  [...thread.children].forEach((li, i) => play(li, [{ opacity: 0, transform: "translateY(14px) scale(.92)" }, { opacity: 1, transform: "none" }], { duration: 620, delay: 180 + i * 110, easing: SPRING, fill: "backwards" }));

  // ---------- Thread helpers (FLIP: older bubbles glide up when a new one arrives) ----------
  function shiftAround(change) {
    const items = [...thread.children];
    const before = items.map((el) => el.getBoundingClientRect().top);
    change();
    items.forEach((el, i) => {
      if (!el.isConnected) return;
      const d = before[i] - el.getBoundingClientRect().top;
      if (Math.abs(d) > 0.5) play(el, [{ transform: "translateY(" + d + "px)" }, { transform: "none" }], { duration: 560, easing: SPRING });
    });
    // keep the list short: anything above the fade is already out of view
    while (thread.children.length > 9) thread.firstElementChild.remove();
  }

  function makeOut(text) {
    const li = document.createElement("li");
    li.className = "msg out";
    const p = document.createElement("p");
    p.textContent = text;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = now();
    meta.insertAdjacentHTML("beforeend", TICKS);
    li.append(p, meta);
    return li;
  }

  // Header status rolls up like a ticker: the old line leaves upward while the new one rises in
  function setPresence(text, typing) {
    while (presence.children.length > 1) presence.firstElementChild.remove();
    const old = presence.firstElementChild;
    if (old) old.style.transform = "";
    const span = document.createElement("span");
    span.textContent = text;
    presence.classList.toggle("typing", !!typing);
    presence.appendChild(span);
    if (calm() || !old || !old.animate) { if (old) old.remove(); return; }
    // both lines sit in one column; hold them one line up until the old one is gone
    span.style.transform = old.style.transform = "translateY(-100%)";
    Promise.all([
      play(old, [{ transform: "none", opacity: 1 }, { transform: "translateY(-100%)", opacity: 0 }], { duration: 260, easing: "ease-in", fill: "forwards" }),
      play(span, [{ transform: "translateY(0)", opacity: 0 }, { transform: "translateY(-100%)", opacity: 1 }], { duration: 440, easing: SPRING })
    ]).then(() => { old.remove(); span.style.transform = ""; });
  }

  // Small burst of sparks / hearts around a point
  function burst(x, y, colors, count, spread) {
    if (calm()) return;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.left = x - 3.5 + "px";
      s.style.top = y - 3.5 + "px";
      s.style.background = colors[i % colors.length];
      if (i % 3 === 0) s.style.borderRadius = "2px";
      document.body.appendChild(s);
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.5;
      const d = spread * (0.6 + Math.random() * 0.6);
      s.animate([
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * d + "px," + (Math.sin(a) * d - 8) + "px) scale(.9) rotate(120deg)", opacity: 1, offset: 0.7 },
        { transform: "translate(" + Math.cos(a) * d * 1.15 + "px," + (Math.sin(a) * d + 6) + "px) scale(.2)", opacity: 0 }
      ], { duration: 700 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Send button state ----------
  function updateBtn() { sendBtn.classList.toggle("empty", !input.value.trim()); }
  input.addEventListener("input", updateBtn);

  let hintTimer = 0;
  function nudge() {
    hint.textContent = "Type a message first";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hint.textContent = ""; }, 2200);
    play(input, [{ transform: "none" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-4px)" }, { transform: "translateX(2px)" }, { transform: "none" }], { duration: 420 });
    play(sendBtn, [{ transform: "rotate(0)" }, { transform: "rotate(-14deg)" }, { transform: "rotate(10deg)" }, { transform: "rotate(0)" }], { duration: 380 });
    input.focus();
  }

  // ---------- The send sequence ----------
  let flying = false;
  let convo = 0;

  async function send(raw) {
    const text = raw.trim();
    if (flying) return;
    if (!text) { nudge(); return; }
    flying = true;
    const my = ++convo;
    hint.textContent = "";

    // 1. Anticipation: the button squashes, the arrow pulls back, then shoots off
    play(sendBtn, [{ transform: "scale(1)" }, { transform: "scale(.8)", offset: 0.25 }, { transform: "scale(1.14)", offset: 0.55 }, { transform: "scale(1)" }], { duration: 620, easing: "ease-out" });
    play(arrow, [
      { transform: "translate(0,0)", opacity: 1 },
      { transform: "translate(-3px,3px)", opacity: 1, offset: 0.22 },
      { transform: "translate(26px,-26px)", opacity: 0, offset: 0.5 },
      { transform: "translate(-22px,22px)", opacity: 0, offset: 0.51 },
      { transform: "translate(0,0)", opacity: 1 }
    ], { duration: 760, easing: "cubic-bezier(.5,0,.3,1)" });
    play(ring, [{ transform: "scale(1)", opacity: 0.8 }, { transform: "scale(1.9)", opacity: 0 }], { duration: 600, delay: 160, easing: "ease-out" });
    await wait(calm() ? 0 : 140);

    // 2. The text lifts out of the field as a bubble and flies up into the thread
    const from = input.getBoundingClientRect();
    input.value = "";
    updateBtn();
    const li = makeOut(text);
    li.style.visibility = "hidden";
    shiftAround(() => thread.appendChild(li));
    if (!calm()) {
      const to = li.getBoundingClientRect();
      const g = document.createElement("p");
      g.className = "ghost";
      g.textContent = text;
      Object.assign(g.style, { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" });
      document.body.appendChild(g);
      const dx = from.left + 4 - to.left;
      const dy = from.top + (from.height - to.height) / 2 - to.top;
      await play(g, [
        { transform: "translate(" + dx + "px," + dy + "px) scale(.9)", borderRadius: "23px", opacity: 0.6 },
        { transform: "translate(" + dx * 0.4 + "px," + (dy * 0.5 - 24) + "px) scale(1.05) rotate(-2deg)", borderRadius: "20px", opacity: 1, offset: 0.45 },
        { transform: "translate(0,0) scale(1)", borderRadius: "18px 18px 6px 18px", opacity: 1 }
      ], { duration: 600, easing: "cubic-bezier(.35,.7,.25,1)" });
      g.remove();
    }
    li.style.visibility = "";
    li.dataset.s = "sending";
    play(li, [{ transform: "scale(1.04, .94)" }, { transform: "scale(.98, 1.03)" }, { transform: "none" }], { duration: 420, easing: "ease-out" });
    say("Sending…");
    flying = false;

    // 3. Progress: clock → one tick → two ticks
    await wait(700);
    li.dataset.s = "sent";
    say("Sent");
    await wait(750);
    li.dataset.s = "delivered";
    say("Delivered");
    await wait(850);

    // 4. Seen: ticks turn mint, glow, and the little avatar hops down to this message
    let reached = false;
    thread.querySelectorAll(".out").forEach((m) => { if (!reached) m.dataset.s = "read"; if (m === li) reached = true; });
    const tk = li.querySelector(".ticks");
    play(tk, [{ transform: "scale(1)", filter: "drop-shadow(0 0 0 transparent)" }, { transform: "scale(1.45)", filter: "drop-shadow(0 0 5px " + getComputedStyle(document.documentElement).getPropertyValue("--read").trim() + ")" }, { transform: "scale(1)", filter: "drop-shadow(0 0 0 transparent)" }], { duration: 520, easing: "ease-out" });
    moveSeen(li);
    say("Seen by Zara");
    if (my !== convo) return; // a newer message will get the reply

    // 5. Zara types, replies and reacts to your message
    await wait(450);
    setPresence("typing…", true);
    const typing = document.createElement("li");
    typing.className = "msg in typing";
    typing.innerHTML = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="sr-only">Zara is typing</span>';
    shiftAround(() => thread.appendChild(typing));
    play(typing, [{ transform: "scale(.4)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 500, easing: SPRING });
    await wait(1500);
    if (my !== convo) { shiftAround(() => typing.remove()); return; }

    const reply = document.createElement("li");
    reply.className = "msg in";
    const rp = document.createElement("p");
    rp.textContent = REPLIES[my % REPLIES.length];
    const rm = document.createElement("span");
    rm.className = "meta";
    rm.textContent = now();
    reply.append(rp, rm);
    reply.style.transformOrigin = "0 100%";
    shiftAround(() => typing.replaceWith(reply));
    play(reply, [{ transform: "scale(.55)", opacity: 0.4 }, { transform: "none", opacity: 1 }], { duration: 560, easing: SPRING });
    setPresence("online", false);
    say("Zara: " + rp.textContent);

    await wait(420);
    if (li.isConnected) {
      const r = document.createElement("span");
      r.className = "react";
      r.innerHTML = HEART;
      li.appendChild(r);
      play(r, [{ transform: "scale(0) rotate(-40deg)" }, { transform: "scale(1.35) rotate(10deg)", offset: 0.55 }, { transform: "none" }], { duration: 560, easing: "ease-out" });
      const b = r.getBoundingClientRect();
      burst(b.left + b.width / 2, b.top + b.height / 2, ["#f43f5e", "#fb7185", "#fda4af", "#a855f7"], 10, 30);
    }
    if (demoOn) queueDemo(3000);
  }

  function moveSeen(li) {
    const had = seen.isConnected;
    const old = seen.getBoundingClientRect();
    li.appendChild(seen);
    if (!had || !old.width) {
      play(seen, [{ transform: "scale(0)" }, { transform: "none" }], { duration: 480, easing: SPRING });
      return;
    }
    const nw = seen.getBoundingClientRect();
    const dx = old.left - nw.left;
    const dy = old.top - nw.top;
    play(seen, [
      { transform: "translate(" + dx + "px," + dy + "px)" },
      { transform: "translate(" + dx * 0.5 + "px," + (dy * 0.5 - 14) + "px) scale(1.25)", offset: 0.45 },
      { transform: "none" }
    ], { duration: 640, easing: "cubic-bezier(.3,.8,.3,1.2)" });
  }

  const REPLIES = ["Perfect, see you there!", "Ha, save me a seat", "Don't forget the samosas", "On my way too", "Noted, thank you!"];

  form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });

  // ---------- Auto-demo: types and sends a sample on load and every few seconds while idle ----------
  // Any real tap, click or key press stops it for good.
  let demoOn = true;
  let demoTimer = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }

  const DEMO = ["Bringing samosas too", "Grab the window table?", "Five minutes away!", "Parked outside"];
  let demoIndex = 0;
  async function runDemo() {
    if (!demoOn) return;
    if (flying) { queueDemo(1200); return; }
    const text = DEMO[demoIndex++ % DEMO.length];
    input.value = "";
    for (const ch of text) {
      if (!demoOn) return;
      input.value += ch;
      updateBtn();
      await wait(calm() ? 10 : 34 + Math.random() * 36);
    }
    await wait(240);
    if (demoOn) send(input.value);
  }
  queueDemo(420);
</script>
</body>
</html>
