<!doctype html>
<!-- Chill & Craft · Lift Shaft · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Shaft · expanding side rail</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: graphite steel rail, amber lamps ---------- */
  :root {
    color-scheme: light;
    --bg1: #e9e6df;
    --bg2: #d6d1c6;
    --app: #f6f4ef;
    --card: #ffffff;
    --line: #e6e1d7;
    --ink: #1d2027;
    --ink2: #5d6270;
    --soft: #9196a2;
    --rail1: #2a2e36;
    --rail2: #1b1e24;
    --shaft: #14161b;
    --steel1: #8f97a3;
    --steel2: #d3d8df;
    --steel3: #a4abb6;
    --on-rail: #e9ebef;
    --on-rail2: #8a919e;
    --amber: #ffb020;
    --amber2: #ffd27a;
    --good: #1f9d6b;
    --bad: #d6453b;
    --chip: #f2efe8;
    --focus: #ffb020;
    --spring: cubic-bezier(.34, 1.5, .64, 1);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #16181d;
    --bg2: #08090b;
    --app: #101216;
    --card: #171a20;
    --line: #252932;
    --ink: #eef0f4;
    --ink2: #a8aebb;
    --soft: #6f7684;
    --rail1: #1a1d23;
    --rail2: #0c0d10;
    --shaft: #07080a;
    --steel1: #6c737e;
    --steel2: #b4bac4;
    --steel3: #858c97;
    --chip: #1f232b;
    --good: #3ccf91;
    --bad: #ff6b5e;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2));
    overflow: hidden;
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .app {
    position: relative;
    display: flex;
    width: min(1100px, 100%);
    height: min(640px, calc(100vh - 48px));
    min-height: 540px;
    border-radius: 24px;
    background: var(--app);
    box-shadow: 0 50px 100px -60px rgba(10, 12, 20, .8), 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 10px; }

  /* ---------- The rail ---------- */
  .rail {
    --w: 96px;
    position: relative; z-index: 4;
    flex: none;
    display: flex; flex-direction: column;
    width: var(--w);
    padding: 14px 10px 12px;
    background: linear-gradient(180deg, var(--rail1), var(--rail2));
    color: var(--on-rail);
    transition: width .6s var(--spring);
  }
  .rail.wide { --w: 256px; }
  .top { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; }
  .mark { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(145deg, var(--amber2), var(--amber)); color: #2a1a00; font-weight: 800; font-size: 15px; box-shadow: 0 8px 18px -10px var(--amber); }
  .brand { font-weight: 750; font-size: 16px; white-space: nowrap; }
  .toggle {
    position: absolute; top: 22px; right: -15px; z-index: 6;
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%; cursor: pointer;
    background: var(--amber); color: #2a1a00;
    box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .6), 0 0 0 3px var(--app);
    transition: transform .5s var(--spring);
  }
  .toggle:hover { transform: scale(1.1); }
  .toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s var(--spring); }
  .rail.wide .toggle svg { transform: rotate(180deg); }

  /* floor display: amber digits like a lift panel */
  .panel {
    display: flex; align-items: center; gap: 5px;
    height: 46px; margin: 14px 2px 12px; padding: 0 6px;
    border-radius: 12px;
    background: #060708;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .06);
    overflow: hidden;
  }
  .arrows { display: grid; gap: 3px; }
  .arrows svg { width: 10px; height: 7px; fill: #3a2a0c; transition: fill .2s; }
  .arrows svg.lit { fill: var(--amber); filter: drop-shadow(0 0 4px var(--amber)); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .digits { position: relative; flex: none; font: 700 20px/1 var(--mono); letter-spacing: .04em; }
  .digits .ghost { color: #2a1f0a; }
  .digits .num { position: absolute; left: 0; top: 0; color: var(--amber); text-shadow: 0 0 10px rgba(255, 176, 32, .7); }
  .digits.flash .num { animation: flash .5s ease-out 2; }
  @keyframes flash { 50% { color: #fff3d6; text-shadow: 0 0 18px var(--amber); } }
  .pname { color: var(--amber2); font: 600 12px/1.1 var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; opacity: 0; transform: translateX(-6px); transition: opacity .3s, transform .4s var(--spring); }
  .rail.wide .pname { opacity: .9; transform: none; transition-delay: .2s; }

  /* the shaft: guide rails, the car, its doors, the cable and the counterweight */
  .shaft { position: relative; flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 6px 0; margin: 0 2px; border-radius: 16px; background: linear-gradient(90deg, rgba(0, 0, 0, .25), rgba(0, 0, 0, .05) 30%, rgba(0, 0, 0, .05) 70%, rgba(0, 0, 0, .25)), var(--shaft); }
  .guide { position: absolute; top: 8px; bottom: 8px; width: 2px; background: repeating-linear-gradient(180deg, #3a3f49 0 6px, #2a2e35 6px 8px); opacity: .9; }
  .cable { position: absolute; left: 50%; top: 0; width: 2px; margin-left: -1px; background: linear-gradient(90deg, #6b717c, #babfc8, #6b717c); transform-origin: top; }
  .cw { position: absolute; right: 3px; top: 0; width: 5px; height: 40px; border-radius: 2px; background: linear-gradient(90deg, #4a4f58, #7b818c); }
  .car, .doors { position: absolute; left: 6px; right: 6px; top: 0; height: 56px; border-radius: 12px; will-change: transform; }
  .car {
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(255, 196, 92, .4), transparent 80%),
      linear-gradient(180deg, #2c2a26, #191816);
    box-shadow: inset 0 0 0 1.5px #4d4a43, inset 0 2px 0 rgba(255, 210, 122, .35), 0 8px 18px -8px rgba(0, 0, 0, .9);
  }
  .car::before { content: ""; position: absolute; left: 22%; right: 22%; top: 3px; height: 2px; border-radius: 2px; background: var(--amber2); box-shadow: 0 0 10px 2px rgba(255, 176, 32, .55); }
  .doors { z-index: 3; overflow: hidden; pointer-events: none; }
  .door {
    position: absolute; top: 0; bottom: 0; width: 50.5%;
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, var(--steel1), var(--steel2) 45%, var(--steel3));
    transition: transform .26s cubic-bezier(.6, 0, .3, 1);
  }
  .door.l { left: 0; transform: translateX(-102%); box-shadow: inset -1px 0 0 rgba(0, 0, 0, .35); }
  .door.r { right: 0; transform: translateX(102%); box-shadow: inset 1px 0 0 rgba(255, 255, 255, .4); }
  .doors.shut .door { transform: none; }
  .doors.shut .door.l::after { content: ""; position: absolute; right: 8px; top: 50%; width: 4px; height: 16px; margin-top: -8px; border-radius: 2px; background: rgba(0, 0, 0, .25); }
  .doors.shut .door.r::after { content: ""; position: absolute; left: 8px; top: 50%; width: 4px; height: 16px; margin-top: -8px; border-radius: 2px; background: rgba(0, 0, 0, .25); }

  .floor {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 12px;
    flex: 1; min-height: 44px; max-height: 56px; width: 100%;
    padding: 0 0 0 30px;
    border: 0; border-radius: 12px; background: none; cursor: pointer;
    color: var(--on-rail2);
    text-align: left;
    transition: color .25s;
  }
  .floor:hover { color: var(--on-rail); }
  .floor.on { color: var(--on-rail); }
  .floor svg { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .floor.on svg { stroke: var(--amber); filter: drop-shadow(0 0 6px rgba(255, 176, 32, .5)); }
  .floor.pop svg { animation: pop .6s var(--spring); }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } }
  .fl { font-size: 14.5px; font-weight: 600; white-space: nowrap; opacity: 0; transform: translateX(-8px); transition: opacity .2s, transform .35s var(--spring); }
  .rail.wide .fl { opacity: 1; transform: none; transition-delay: calc(.12s + var(--k) * 35ms); }
  .cnt { margin-left: auto; margin-right: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--on-rail); font: 700 11px/1 var(--mono); opacity: 0; transition: opacity .25s; }
  .rail.wide .cnt { opacity: 1; transition-delay: calc(.2s + var(--k) * 35ms); }
  .no { position: absolute; left: 8px; top: 50%; margin-top: -6px; font: 700 9.5px/12px var(--mono); color: #6b7280; }
  .lamp { position: absolute; right: 10px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: #3a2e17; transition: background .2s, box-shadow .2s; }
  .rail.wide .lamp { right: auto; left: 9px; top: 9px; }
  .lamp.on { background: var(--amber); box-shadow: 0 0 8px 2px rgba(255, 176, 32, .7); }
  .ring { position: absolute; width: 6px; height: 6px; border-radius: 50%; border: 2px solid var(--amber); pointer-events: none; opacity: 0; z-index: 4; }
  .ring.go { animation: ring .8s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(9); } }
  .who { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 6px 0; border-top: 1px solid rgba(255, 255, 255, .07); white-space: nowrap; overflow: hidden; }
  .who i { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #6c8cff, #a76cf0); font: 700 14px/1 var(--sans); font-style: normal; color: #fff; }
  .who b { display: block; font-size: 13.5px; }
  .who small { color: var(--on-rail2); font-size: 12px; }
  .who span { opacity: 0; transition: opacity .3s; }
  .rail.wide .who span { opacity: 1; transition-delay: .25s; }
  .tip {
    position: absolute; left: calc(var(--w) + 10px); z-index: 7;
    padding: 7px 11px; border-radius: 9px;
    background: var(--rail1); color: var(--on-rail);
    font-size: 13px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 10px 22px -10px rgba(0, 0, 0, .6);
    opacity: 0; transform: translateX(-6px); pointer-events: none;
    transition: opacity .2s, transform .3s var(--spring);
  }
  .tip.on { opacity: 1; transform: none; }
  .rail.wide .tip { display: none; }

  /* ---------- Main area ---------- */
  .main { position: relative; flex: 1; min-width: 0; padding: 26px 30px; overflow: hidden; }
  .scrim { display: none; }
  .content > * { will-change: transform, opacity; }
  .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .hd small { color: var(--amber); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); font: 700 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .hd h1 { margin: 6px 0 4px; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.02em; }
  .hd p { margin: 0; color: var(--ink2); font-size: 14.5px; }
  .act { padding: 10px 16px; border: 0; border-radius: 11px; background: var(--ink); color: var(--app); font-weight: 650; font-size: 13.5px; cursor: pointer; transition: transform .35s var(--spring); }
  .act:hover { transform: translateY(-2px); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .tile { padding: 14px 16px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  .tile small { color: var(--soft); font-size: 12.5px; }
  .tile b { display: block; margin: 6px 0 6px; font-size: 22px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .delta { display: inline-block; padding: 3px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .delta.dn { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .list { border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--line); padding: 6px 16px; }
  .log { margin-top: 14px; padding: 12px 16px 14px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  .rides { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 8px; padding: 0; list-style: none; }
  .rides li { padding: 6px 10px; border-radius: 999px; background: var(--chip); color: var(--ink2); font: 650 12px/1 var(--mono); white-space: nowrap; }
  .rides li.now { background: linear-gradient(135deg, var(--amber2), var(--amber)); color: #2a1a00; box-shadow: 0 6px 14px -8px var(--amber); }
  .rides li.arr { padding: 0; background: none; color: var(--soft); }
  .log small { color: var(--soft); font-size: 12.5px; }
  .list h2, .log h2 { margin: 10px 0 4px; color: var(--soft); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .li:first-of-type { border-top: 0; }
  .dot { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); font: 700 12px/1 var(--mono); color: var(--ink2); }
  .li b { display: block; font-size: 14px; }
  .li small { color: var(--soft); font-size: 12.5px; }
  .li .r { margin-left: auto; color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { width: 90px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; width: var(--p); border-radius: 3px; background: linear-gradient(90deg, var(--amber), var(--amber2)); animation: grow .9s var(--spring) both .3s; }
  @keyframes grow { from { width: 0; } }
  .sw { position: relative; width: 44px; height: 26px; border: 0; border-radius: 13px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: background .25s; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .3); transition: transform .4s var(--spring); }
  .sw[aria-checked="true"] { background: var(--amber); }
  .sw[aria-checked="true"]::after { transform: translateX(18px); }

  /* ---------- Narrow frames: the wide rail slides over the content ---------- */
  @media (max-width: 700px) {
    .stage { padding: 12px; }
    .app { height: min(700px, calc(100vh - 24px)); }
    .rail { --w: 72px; position: absolute; top: 0; bottom: 0; left: 0; padding: 12px 7px 10px; }
    .rail.wide { --w: 232px; box-shadow: 20px 0 40px -20px rgba(0, 0, 0, .7); }
    .top { padding: 0 2px; }
    .mark { width: 38px; height: 38px; }
    .main { margin-left: 72px; padding: 18px 16px; }
    .scrim { display: block; position: absolute; inset: 0; z-index: 3; background: rgba(10, 12, 16, .45); opacity: 0; pointer-events: none; transition: opacity .3s; }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .floor { padding-left: 24px; }
    .no { left: 5px; }
    .panel { padding: 0 5px; }
    .digits { font-size: 18px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { padding: 11px 12px; }
    .tile b { font-size: 18px; }
    .tile:nth-child(3) { display: none; }
    .bar { width: 54px; }
    .act { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Main">
      <div class="top"><span class="mark" aria-hidden="true">K</span><span class="brand fl" style="--k:0">Kiosk Works</span></div>
      <button class="toggle" id="toggle" type="button" aria-expanded="false" aria-controls="rail" aria-label="Expand menu"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2.5 9.5 7 5 11.5"/></svg></button>
      <div class="panel" aria-hidden="true">
        <span class="arrows"><svg id="up" viewBox="0 0 10 7"><path d="M5 0l5 7H0z"/></svg><svg id="dn" viewBox="0 0 10 7"><path d="M0 0h10L5 7z"/></svg></span>
        <span class="digits" id="digits"><span class="ghost">88</span><span class="num" id="num">01</span></span>
        <span class="pname" id="pname">Overview</span>
      </div>
      <div class="shaft" id="shaft">
        <i class="guide" style="left:3px"></i><i class="guide" style="right:12px"></i>
        <i class="cable" id="cable"></i><i class="cw" id="cw"></i>
        <div class="car" id="car" aria-hidden="true"></div>
        <div class="doors shut" id="doors" aria-hidden="true"><i class="door l"></i><i class="door r"></i></div>
      </div>
      <div class="who"><i aria-hidden="true">SM</i><span><b>Sana Malik</b><small>Operations lead</small></span></div>
      <div class="tip" id="tip" aria-hidden="true"></div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <section class="main" id="main"><div class="content" id="content"></div></section>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let run = 0; // trip token: a newer call takes over the car

  function tween(ms, fn, ease = (t) => t, token = run) {
    return new Promise((res) => {
      const t0 = performance.now();
      const f = (now) => {
        if (token !== run) return res(false);
        const p = Math.max(0, Math.min(1, (now - t0) / ms));
        fn(ease(p), p);
        if (p < 1) requestAnimationFrame(f); else res(true);
      };
      requestAnimationFrame(f);
    });
  }
  const inOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ---------- Floors and what each page shows ----------
  const I = {
    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
    box: '<path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="M4 8.5 12 13l8-4.5M12 13v7"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    chat: '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17A2.5 2.5 0 0 1 4 14.5z"/>',
    file: '<path d="M6 3.5h8l4.5 4.5v12.5H6z"/><path d="M14 3.5V8h4.5M9 13h6M9 16.5h4"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/>',
  };
  const F = [
    { name: "Overview", icon: "grid", cnt: "", sub: "Tuesday, 18 November · all branches", act: "Export report",
      tiles: [["Revenue this week", "PKR 4.2M", "+12%"], ["Orders", "1,284", "+8%"], ["Average delivery", "2.1 days", "-0.3 d"]],
      list: ["Today", [["LHR", "Lahore branch", "312 orders", "PKR 1.1M"], ["KHI", "Karachi branch", "455 orders", "PKR 1.6M"], ["ISB", "Islamabad branch", "187 orders", "PKR 0.7M"]]] },
    { name: "Projects", icon: "box", cnt: "12", sub: "12 active, 4 due this week", act: "New project",
      tiles: [["Active", "12", "+2"], ["Due this week", "4", "+1"], ["On hold", "2", "-1"]],
      list: ["In progress", [["01", "New Gulberg store fit-out", "Due 24 Nov", 0.72], ["02", "Winter catalogue shoot", "Due 28 Nov", 0.45], ["03", "Courier switch to next-day", "Due 2 Dec", 0.2]]] },
    { name: "Calendar", icon: "cal", cnt: "5", sub: "5 meetings today, 3.5 free hours", act: "Book a slot",
      tiles: [["Meetings today", "5", "+1"], ["Free hours", "3.5 h", "+0.5 h"], ["Next up", "2:30 pm", ""]],
      list: ["Today", [["10:00", "Supplier call · Faisalabad mills", "30 min · video", "Done"], ["14:30", "Store review with Imran", "45 min · room 2", "Next"], ["17:00", "Payroll sign-off", "15 min · finance", "Later"]]] },
    { name: "Messages", icon: "chat", cnt: "9", sub: "9 unread, average reply 18 minutes", act: "New message",
      tiles: [["Unread", "9", "+3"], ["Replied today", "41", "+6"], ["Average reply", "18 min", "-4 min"]],
      list: ["Unread", [["HR", "Hira Rashid", "Can we move the store review to 3?", "2 min"], ["UK", "Usman Khan", "Karachi stock count is attached", "14 min"], ["AF", "Ayesha Farooq", "New courier rates look good", "1 h"]]] },
    { name: "Files", icon: "file", cnt: "", sub: "38 of 100 GB used", act: "Upload",
      tiles: [["Storage used", "38 GB", "+1.2 GB"], ["Shared files", "126", "+9"], ["Uploads today", "14", "+14"]],
      list: ["Recent", [["PDF", "November payroll.pdf", "Finance · 2.4 MB", "10:12"], ["XLS", "Branch stock count.xlsx", "Karachi · 820 KB", "09:40"], ["JPG", "Gulberg store plan.jpg", "Projects · 5.1 MB", "Yesterday"]]] },
    { name: "Settings", icon: "gear", cnt: "", sub: "Team of 8 · Business plan", act: "Invite people",
      tiles: [["Team", "8 people", "+1"], ["Plan", "Business", ""], ["Security", "Strong", ""]],
      list: ["Notifications", [["@", "Email me daily totals", "Every evening at 9 pm", "sw1"], ["!", "Alert on late deliveries", "When a parcel is 2 days late", "sw2"], ["$", "Weekly payroll reminder", "Fridays at 11 am", "sw3"]]] },
  ];

  const rail = $("rail"), shaft = $("shaft"), car = $("car"), doors = $("doors"), cable = $("cable"), cw = $("cw");
  const num = $("num"), digits = $("digits"), pname = $("pname"), up = $("up"), dn = $("dn"), tip = $("tip");
  const content = $("content"), live = $("live"), toggle = $("toggle"), scrim = $("scrim");
  // build the floor buttons
  F.forEach((f, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "floor";
    b.innerHTML = `<span class="no" aria-hidden="true">0${k + 1}</span><i class="lamp" aria-hidden="true"></i><svg viewBox="0 0 24 24" aria-hidden="true">${I[f.icon]}</svg><span class="fl" style="--k:${k + 1}">${f.name}</span>${f.cnt ? `<span class="cnt" aria-label="${f.cnt} new">${f.cnt}</span>` : ""}`;
    b.setAttribute("aria-label", f.name + (f.cnt ? `, ${f.cnt} new` : ""));
    shaft.appendChild(b);
  });
  const fl = [...shaft.querySelectorAll(".floor")];
  const lamps = fl.map((b) => b.querySelector(".lamp"));

  // ---------- Page content ----------
  const toggles = { sw1: true, sw2: true, sw3: false };
  const rides = [0]; // the last floors visited, newest last
  let trips = 0, floors = 0;
  function page(i) {
    const f = F[i];
    const tiles = f.tiles.map(([l, v, d]) => `<div class="tile"><small>${l}</small><b>${v}</b>${d ? `<span class="delta${/^-/.test(d) && !/delivery|reply|hold/i.test(l) ? " dn" : ""}">${d}</span>` : '<span class="delta" style="visibility:hidden">·</span>'}</div>`).join("");
    const rows = f.list[1].map(([a, t, s, r]) => {
      let right = `<span class="r">${r}</span>`;
      if (typeof r === "number") right = `<span class="r"><span class="bar"><i style="--p:${Math.round(r * 100)}%"></i></span></span>`;
      if (/^sw\d$/.test(r)) right = `<button class="sw r" type="button" role="switch" aria-checked="${toggles[r]}" data-k="${r}" aria-label="${t}"></button>`;
      return `<div class="li"><span class="dot" aria-hidden="true">${a}</span><span><b>${t}</b><small>${s}</small></span>${right}</div>`;
    }).join("");
    return `<div class="hd"><div><small>Floor 0${i + 1}</small><h1>${f.name}</h1><p>${f.sub}</p></div><button class="act" type="button">${f.act}</button></div>
      <div class="tiles">${tiles}</div><div class="list"><h2>${f.list[0]}</h2>${rows}</div>
      <div class="log"><h2>Lift log</h2><ol class="rides" aria-label="Recent rides">${rides.map((r, k) => (k ? '<li class="arr" aria-hidden="true">→</li>' : "") + `<li class="${k === rides.length - 1 ? "now" : ""}">0${r + 1} ${F[r].name}</li>`).join("")}</ol><small>${trips} trip${trips === 1 ? "" : "s"} · ${floors} floor${floors === 1 ? "" : "s"} travelled today</small></div>`;
  }
  function showPage(i, dir) {
    content.innerHTML = page(i);
    content.querySelectorAll(".sw").forEach((s) => s.addEventListener("click", () => {
      const k = s.dataset.k; toggles[k] = !toggles[k];
      s.setAttribute("aria-checked", toggles[k]);
      live.textContent = `${s.getAttribute("aria-label")} ${toggles[k] ? "on" : "off"}`;
    }));
    content.querySelector(".act").addEventListener("click", () => { live.textContent = `${F[i].act}: opened`; });
    if (reduce) return;
    [...content.querySelectorAll(".hd, .tile, .list, .log")].forEach((el, k) => {
      el.animate([{ opacity: 0, transform: `translateY(${dir * 38}px)` }, { opacity: 1, transform: "none" }], { duration: 620, delay: k * 60, easing: "cubic-bezier(.3,1.3,.5,1)", fill: "backwards" });
    });
  }

  // ---------- Car geometry ----------
  let cur = 0, carY = 0, shownFloor = 0;
  const floorY = (i) => fl[i].offsetTop;
  function placeCar(y) {
    const h = fl[cur].offsetHeight, H = shaft.clientHeight;
    car.style.height = doors.style.height = h + "px";
    car.style.transform = doors.style.transform = `translateY(${y.toFixed(1)}px)`;
    cable.style.height = Math.max(0, y) + "px";
    cw.style.transform = `translateY(${Math.max(0, H - y - h * .8 - 40).toFixed(1)}px)`;
    // the display shows the floor the car is passing
    let near = 0, best = 1e9;
    fl.forEach((b, k) => { const d = Math.abs(b.offsetTop - y); if (d < best) { best = d; near = k; } });
    if (near !== shownFloor) { shownFloor = near; num.textContent = "0" + (near + 1); }
  }
  function ding(i) {
    const r = document.createElement("i");
    r.className = "ring";
    const l = lamps[i];
    r.style.left = l.offsetLeft + "px"; r.style.top = fl[i].offsetTop + l.offsetTop + "px";
    shaft.appendChild(r);
    requestAnimationFrame(() => r.classList.add("go"));
    setTimeout(() => r.remove(), 900);
    digits.classList.remove("flash"); void digits.offsetWidth; digits.classList.add("flash");
  }

  // ---------- A trip: call lamp, doors close, travel past each floor, overshoot, ding, doors open ----------
  async function call(j) {
    if (j === cur && !doors.classList.contains("shut")) return;
    const token = ++run, from = cur, dir = Math.sign(j - from) || 1;
    cur = j;
    trips++; floors += Math.abs(j - from);
    rides.push(j); if (rides.length > 5) rides.shift();
    fl.forEach((b, k) => (k === j ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    live.textContent = `Floor ${j + 1}, ${F[j].name}`;
    pname.textContent = reduce ? F[j].name : "to " + F[j].name;
    lamps.forEach((l, k) => l.classList.toggle("on", k === j));
    if (reduce) {
      fl.forEach((b, k) => b.classList.toggle("on", k === j));
      carY = floorY(j); placeCar(carY); doors.classList.remove("shut"); lamps[j].classList.remove("on");
      showPage(j, dir);
      return;
    }
    fl[from].classList.remove("on");
    // 1. doors close
    if (!doors.classList.contains("shut")) {
      doors.classList.add("shut");
      await sleep(280);
      if (token !== run) return;
    }
    // 2. travel: ease in and out, the arrow blinks, the digits count through the floors
    (dir > 0 ? dn : up).classList.add("lit"); (dir > 0 ? up : dn).classList.remove("lit");
    const y0 = carY, y1 = floorY(j), n = Math.max(1, Math.abs(y1 - y0) / Math.max(1, fl[0].offsetHeight));
    let paged = false;
    const ok = await tween(360 + n * 130, (e, p) => {
      carY = y0 + (y1 - y0) * e + (p > .1 && p < .9 ? Math.sin(p * 80) * .6 : 0);
      placeCar(carY);
      if (!paged && p > .55) { paged = true; showPage(j, dir); }
    }, inOut, token);
    if (!ok) return;
    if (!paged) showPage(j, dir);
    // 3. a small overshoot as the brakes catch, then settle
    const s = Math.sign(y1 - y0) || 1;
    if (!(await tween(320, (e) => { carY = y1 + s * 5 * Math.sin(e * Math.PI * 1.5) * (1 - e); placeCar(carY); }, (t) => t, token))) return;
    carY = y1; placeCar(carY);
    up.classList.remove("lit"); dn.classList.remove("lit");
    // 4. ding, lamp off, doors open on the new floor
    ding(j);
    pname.textContent = F[j].name;
    lamps[j].classList.remove("on");
    await sleep(140);
    if (token !== run) return;
    doors.classList.remove("shut");
    fl.forEach((b, k) => b.classList.toggle("on", k === j));
    fl[j].classList.remove("pop"); void fl[j].offsetWidth; fl[j].classList.add("pop");
  }

  // ---------- Expand / collapse ----------
  const narrow = () => matchMedia("(max-width: 700px)").matches;
  function setWide(on, save = true) {
    rail.classList.toggle("wide", on);
    toggle.setAttribute("aria-expanded", on);
    toggle.setAttribute("aria-label", on ? "Collapse menu" : "Expand menu");
    scrim.classList.toggle("on", on && narrow());
    if (save) try { localStorage.setItem("cc-lift-shaft-wide", on ? "1" : "0"); } catch (e) { /* not saved */ }
    // keep the car glued to its floor while the rail changes width
    const t0 = performance.now();
    const follow = (now) => { placeCar(carY = floorY(cur)); if (now - t0 < 700) requestAnimationFrame(follow); };
    requestAnimationFrame(follow);
  }
  toggle.addEventListener("click", () => setWide(!rail.classList.contains("wide")));
  scrim.addEventListener("click", () => setWide(false));

  // ---------- Input ----------
  fl.forEach((b, i) => {
    b.addEventListener("click", () => { call(i); if (narrow()) setWide(false); });
    const show = () => {
      if (rail.classList.contains("wide")) return;
      tip.textContent = F[i].name;
      tip.style.top = shaft.offsetTop + b.offsetTop + b.offsetHeight / 2 - 15 + "px";
      tip.classList.add("on");
    };
    b.addEventListener("pointerenter", show);
    b.addEventListener("focus", show);
    b.addEventListener("pointerleave", () => tip.classList.remove("on"));
    b.addEventListener("blur", () => tip.classList.remove("on"));
    b.addEventListener("keydown", (e) => {
      const k = { ArrowDown: 1, ArrowUp: -1 }[e.key];
      if (!k) return;
      e.preventDefault();
      fl[(i + k + fl.length) % fl.length].focus();
    });
  });
  document.addEventListener("keydown", (e) => {
    if (/^[1-6]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) call(+e.key - 1); // press a floor number
    if (e.key === "Escape" && rail.classList.contains("wide") && narrow()) setWide(false);
  });
  let rt = 0;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { carY = floorY(cur); placeCar(carY); }, 80); });

  // ---------- Start: doors open on floor 1, then a demo ride until someone takes over ----------
  let saved = null;
  try { saved = localStorage.getItem("cc-lift-shaft-wide"); } catch (e) { /* no storage */ }
  if (saved === "1" && !narrow()) setWide(true, false);
  carY = floorY(0); placeCar(carY);
  fl[0].setAttribute("aria-current", "page");
  showPage(0, 1);
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  (async () => {
    await sleep(reduce ? 0 : 320);
    if (run === 0) { // nobody called the car yet: open on floor 1
      ding(0);
      doors.classList.remove("shut");
      fl[0].classList.add("on", "pop");
    }
    const steps = [["wide"], [3], ["narrow"], [1], [5], ["wide"], [2], ["narrow"], [0]];
    let k = 0;
    while (demo) {
      await sleep(k === 0 ? 650 : 1700);
      if (!demo) break;
      const s = steps[k++ % steps.length][0];
      if (s === "wide" || s === "narrow") { setWide(s === "wide", false); continue; }
      await call(s);
    }
  })();
})();
</script>
</body>
