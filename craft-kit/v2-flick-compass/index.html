<html lang="en">
<head>

<title>Flick Compass · marking menu navigation</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: an old sea chart in parchment, brass and oxblood; night mode is red instrument light ---------- */
  :root {
    color-scheme: light;
    --paper: #f3e6cb;
    --paper2: #e6d2a9;
    --card: #fbf4e3;
    --card2: #f4e8cd;
    --line: #e0cba2;
    --ink: #3a2918;
    --ink2: #7a6146;
    --soft: #a88f70;
    --brass: #c8963e;
    --brass2: #8c621f;
    --red: #9b2c2c;
    --sea: #8fb6b0;
    --contour: rgba(120, 88, 45, .16);
    --shadow: rgba(80, 50, 15, .3);
    --focus: #9b2c2c;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #120f0e;
    --paper2: #1c1615;
    --card: #1b1513;
    --card2: #231b18;
    --line: #382a24;
    --ink: #f5d8c8;
    --ink2: #b88c7a;
    --soft: #7d5f53;
    --brass: #e0704f;
    --brass2: #a3442b;
    --red: #ff5a4f;
    --sea: #3d2724;
    --contour: rgba(255, 90, 79, .09);
    --shadow: rgba(0, 0, 0, .65);
    --focus: #ff5a4f;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { min-height: 100vh; font-family: var(--sans); color: var(--ink); background: radial-gradient(70% 60% at 50% 40%, var(--paper), var(--paper2)); }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px 12px; overflow: hidden; }
  .contours { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .contours path { fill: none; stroke: var(--contour); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }

  /* ---------- App card ---------- */
  .app { position: relative; width: min(860px, 100%); height: min(680px, calc(100vh - 32px)); min-height: 580px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-radius: 28px; background: var(--card); box-shadow: 0 50px 90px -50px var(--shadow), 0 0 0 1px var(--line); overflow: hidden; }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--card2); }
  .seal { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--brass) 70%, #fff), var(--brass2)); color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .02em; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); transition: transform .6s var(--spring); }
  .seal.spin { animation: sealspin .7s var(--spring); }
  @keyframes sealspin { 40% { transform: rotate(-200deg) scale(1.15); } 100% { transform: rotate(-360deg); } }
  .ttl { min-width: 130px; margin-right: auto; }
  .ttl small { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
  .ttl .roll { position: relative; height: 26px; overflow: hidden; }
  .ttl .roll b { position: absolute; left: 0; top: 0; font-size: 20px; letter-spacing: -.02em; white-space: nowrap; }
  .ship { font-size: 12.5px; font-weight: 700; color: var(--ink2); text-align: right; white-space: nowrap; }
  .ship b { display: block; color: var(--ink); font-size: 13.5px; }

  /* ---------- Pages ---------- */
  .view { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .page { position: absolute; inset: 0; padding: 18px 18px 14px; overflow: hidden; will-change: transform, opacity; }
  .page h2 { margin: 0; font-size: clamp(22px, 5vw, 30px); letter-spacing: -.03em; }
  .page .lead { margin: 4px 0 14px; color: var(--ink2); font-size: 14px; }
  .page .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { padding: 12px; border-radius: 16px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); }
  .tile small { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
  .tile b { display: block; margin-top: 4px; font-size: clamp(17px, 4.4vw, 22px); letter-spacing: -.02em; }
  .chart { width: 100%; height: clamp(180px, 38vh, 300px); border-radius: 18px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); }
  .chart .land { fill: var(--paper2); stroke: var(--brass2); stroke-width: 1.2; }
  .chart .route { fill: none; stroke: var(--red); stroke-width: 2.2; stroke-dasharray: 6 6; animation: march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -24; } }
  .chart text { fill: var(--ink2); font: 700 11px var(--sans); }
  .chart .port { fill: var(--red); }
  .chart .boat { fill: var(--ink); }
  .rows { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .rows li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); font-size: 14px; }
  .rows li b { display: block; }
  .rows li small { color: var(--ink2); font-size: 12.5px; }
  .rows li em { margin-left: auto; font-style: normal; font-weight: 750; font-size: 13px; white-space: nowrap; }
  .av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: #fff; font-weight: 800; font-size: 13px; }
  .watch { margin-left: auto; height: 32px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 1px var(--line); font-size: 12.5px; font-weight: 750; transition: transform .3s var(--spring), background .3s; }
  .watch[aria-pressed="true"] { background: var(--red); color: #fff; box-shadow: none; }
  .watch:active { transform: scale(.9); }
  .chk { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .chk input { width: 20px; height: 20px; accent-color: var(--red); }
  .bar { height: 8px; margin-top: 12px; border-radius: 4px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--red); border-radius: 4px; transition: width .5s var(--spring); }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); font-size: 14px; }
  .add button, .save { height: 42px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--ink); color: var(--card); font-weight: 750; }
  textarea { width: 100%; height: 150px; padding: 12px; border: 0; border-radius: 14px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); font-size: 14.5px; line-height: 1.55; resize: none; user-select: text; }
  .count { margin: 6px 0 0; font-size: 12.5px; color: var(--ink2); }
  .tide { width: 100%; height: 150px; margin-top: 4px; border-radius: 16px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); }
  .tide .wave { fill: color-mix(in srgb, var(--sea) 55%, transparent); stroke: var(--brass2); stroke-width: 1.5; }
  .tide .now { stroke: var(--red); stroke-width: 2; stroke-dasharray: 3 3; }
  .tide circle { fill: var(--red); }
  .wind { display: inline-block; transform: rotate(45deg); animation: gust 2.4s ease-in-out infinite; }
  @keyframes gust { 50% { transform: rotate(52deg) translateY(-2px); } }

  .mark { position: absolute; right: -80px; bottom: -90px; width: 320px; height: 320px; opacity: .08; pointer-events: none; animation: turn 140s linear infinite; }
  .mark path { fill: var(--brass2); } .mark circle { fill: none; stroke: var(--brass2); stroke-width: 2; }
  @keyframes turn { to { transform: rotate(1turn); } }
  .near { position: absolute; left: 18px; right: 18px; bottom: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .nb { display: flex; align-items: center; gap: 8px; min-width: 0; height: 46px; padding: 0 10px; border: 0; border-radius: 14px; background: color-mix(in srgb, var(--card2) 85%, transparent); box-shadow: 0 0 0 1px var(--line); text-align: left; font-size: 13px; font-weight: 750; transition: transform .35s var(--spring), box-shadow .2s; }
  .nb:hover { transform: translateY(-2px); box-shadow: 0 0 0 1.5px var(--brass); }
  .nb svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .nb span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 420px) { .near { left: 14px; right: 14px; gap: 6px; } .nb { gap: 6px; padding: 0 8px; font-size: 12.5px; } .nb svg { width: 16px; height: 16px; } }
  .nb small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--ink2); }
  .swoosh { position: absolute; inset: -60%; pointer-events: none; background: linear-gradient(90deg, transparent 42%, color-mix(in srgb, var(--brass) 30%, transparent) 49%, rgba(255, 255, 255, .5) 50%, transparent 58%); }

  /* ---------- Hint and the compass button ---------- */
  .foot { display: flex; align-items: center; gap: 12px; padding: 10px 14px 12px 18px; border-top: 1px solid var(--line); background: var(--card2); }
  .hint { display: flex; align-items: center; gap: 8px; margin-right: auto; font-size: 13px; font-weight: 650; color: var(--ink2); }
  .hint svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--brass2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: nudge 2.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translate(4px, -4px); } }
  .fab { flex: none; width: 54px; height: 54px; border: 0; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--brass) 70%, #fff), var(--brass2)); box-shadow: 0 12px 22px -12px var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, .25); transition: transform .3s var(--spring); }
  .fab:active { transform: scale(.9); }
  .fab svg { width: 34px; height: 34px; }
  .fab .ndl { transform-origin: 17px 17px; transition: transform .9s var(--spring); }

  /* ---------- The compass rose ---------- */
  .compass { position: absolute; z-index: 10; left: 0; top: 0; width: 260px; height: 260px; margin: -130px 0 0 -130px; pointer-events: none; }
  .compass.click { pointer-events: auto; }
  .compass .body { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .compass.open .body { animation: bloom .6s var(--spring); }
  .compass.gone .body { animation: shrink .38s cubic-bezier(.5, 0, .8, .3) forwards; }
  .compass.ghost .body { opacity: .55; }
  @keyframes bloom { from { transform: scale(.2) rotate(-50deg); opacity: 0; } }
  @keyframes shrink { to { transform: translate(var(--gx, 0), var(--gy, 0)) scale(.1) rotate(40deg); opacity: 0; } }
  .rose { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 26px var(--shadow)); }
  .rose .face { fill: var(--card); stroke: var(--brass2); stroke-width: 2; }
  .rose .rim { fill: none; stroke: var(--brass); stroke-width: 9; }
  .rose .tick { stroke: var(--brass2); stroke-linecap: round; }
  .rose .wedge { fill: transparent; stroke: var(--line); stroke-width: 1; transition: fill .2s; }
  .rose .wedge.on { fill: color-mix(in srgb, var(--red) 22%, transparent); }
  .rose .wedge.cur { fill: color-mix(in srgb, var(--brass) 16%, transparent); }
  .rose .wedge.flash { animation: flash .4s ease-out 2; }
  @keyframes flash { 50% { fill: color-mix(in srgb, var(--red) 55%, transparent); } }
  .rose .star { fill: color-mix(in srgb, var(--brass) 26%, transparent); }
  .rose text { fill: var(--brass2); font: 900 12px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .rose text.n { fill: var(--red); }
  .dir { position: absolute; left: 50%; top: 50%; width: 60px; height: 46px; margin: -23px 0 0 -30px; padding: 0; border: 0; border-radius: 12px; background: none; display: grid; justify-items: center; align-content: center; gap: 1px; color: var(--ink); font-size: 11px; font-weight: 800; transform: rotate(var(--a)) translateY(-80px) rotate(calc(-1 * var(--a))); transition: transform .3s var(--spring), color .2s; }
  .compass.open .dir { animation: fanout .55s var(--spring) backwards; animation-delay: calc(var(--k) * 35ms + 60ms); }
  @keyframes fanout { from { transform: rotate(var(--a)) translateY(0) rotate(calc(-1 * var(--a))) scale(.3); opacity: 0; } }
  .dir svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dir.on { color: var(--red); transform: rotate(var(--a)) translateY(-86px) rotate(calc(-1 * var(--a))) scale(1.14); }
  .dir:focus-visible { outline-offset: 0; }
  .needle { position: absolute; left: 50%; top: 50%; width: 30px; height: 130px; margin: -65px 0 0 -15px; overflow: visible; will-change: transform; }
  .needle .nh { fill: var(--red); } .needle .sh { fill: color-mix(in srgb, var(--ink) 75%, transparent); } .needle .ln { stroke: rgba(255, 255, 255, .45); stroke-width: 1; }
  .cap { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6dc, var(--brass) 50%, var(--brass2)); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
  .cap.clack { animation: clack .35s var(--spring); }
  @keyframes clack { 40% { transform: scale(1.5); } }
  .press { position: absolute; z-index: 9; left: 0; top: 0; width: 70px; height: 70px; margin: -35px; border-radius: 50%; border: 2.5px solid var(--red); opacity: 0; pointer-events: none; }
  .press.on { animation: charge .28s linear forwards; }
  @keyframes charge { from { transform: scale(1.2); opacity: .2; } to { transform: scale(.35); opacity: .9; } }
  .finger { position: absolute; z-index: 12; left: 0; top: 0; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: rgba(255, 255, 255, .5); box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 55%, transparent), 0 8px 18px rgba(0, 0, 0, .2); opacity: 0; pointer-events: none; transition: opacity .2s, scale .2s; }
  .finger.on { opacity: 1; } .finger.down { scale: .8; }

  @media (max-width: 420px) { .ship { display: none; } .page { padding: 16px 14px 12px; } .tiles { gap: 6px; } .tile { padding: 10px 8px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <svg class="contours" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M-5 20q20-8 40 0t40 0 30-2M-5 40q22-10 44 0t40 2 26-4M-5 62q18-8 38 0t42-2 30 2M-5 84q24-10 46 0t36-2 28 2"/></svg>
  <section class="app" aria-label="Harbour Log sailing app">
    <header class="head">
      <span class="seal" id="seal" aria-hidden="true">E</span>
      <div class="ttl"><small>Harbour Log</small><div class="roll" id="roll"><b>Crew</b></div></div>
      <div class="ship"><b>Sea Swallow</b>Karachi · 24.8° N</div>
    </header>
    <div class="view" id="view"><svg class="mark" viewBox="-100 -100 200 200" aria-hidden="true"><circle r="92"/><circle r="70"/><path d="M0-96 9-9 96 0 9 9 0 96-9 9-96 0-9-9Z"/><path d="M0-60 6-6 60 0 6 6 0 60-6 6-60 0-6-6Z" transform="rotate(45)"/></svg></div>
    <footer class="foot">
      <p class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10l4 .8a2 2 0 0 1 1.6 2.3l-.8 4.4a3 3 0 0 1-3 2.5h-2.6a3 3 0 0 1-2.4-1.2L5.5 15a1.5 1.5 0 0 1 2.3-1.9L9 14.5"/><path d="M15 3.5l2-2M18 6.5l2.5-.5"/></svg><span>Hold anywhere and flick toward a page</span></p>
      <button class="fab" id="fab" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="compass" aria-label="Open the compass menu">
        <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="13" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/><g class="ndl" id="fabNeedle"><path d="M17 5l3.2 12h-6.4Z" fill="#fff"/><path d="M17 29l-3.2-12h6.4Z" fill="#fff" fill-opacity=".45"/></g><circle cx="17" cy="17" r="2" fill="#fff"/></svg>
      </button>
    </footer>
    <div class="compass" id="compass" role="menu" aria-label="Pages by direction" hidden>
      <div class="body" id="cbody">
        <svg class="rose" viewBox="-130 -130 260 260" aria-hidden="true" id="rose"></svg>
        <div id="dirs"></div>
        <svg class="needle" id="needle" viewBox="-15 -65 30 130" aria-hidden="true"><path class="nh" d="M0-62 9 0H-9Z"/><path class="sh" d="M0 62 9 0H-9Z"/><path class="ln" d="M0-58V58"/></svg>

    <div class="finger" id="finger" aria-hidden="true"></div>

</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 60) : ms));
  const D2R = Math.PI / 180;
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 30); };
  const I = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;

  // ---------- Eight pages, one per point of the compass (clockwise from north) ----------
  const PAGES = [
    { d: "N", name: "Chart", icon: I('<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2Z"/><path d="M9 4v14M15 6v14"/>'), html: () => `
      <h2>Chart</h2><p class="lead">Next leg: Ormara, 128 nm · about 14 hours at 9 knots</p>
      <svg class="chart" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid meet" aria-label="Chart of the route from Karachi to Gwadar">
        <path class="land" d="M0 0h400v70c-30 6-50-4-80 2s-40 22-70 18-46-14-74-8-40 20-66 16S40 72 0 80Z"/>
        <path class="route" id="route" d="M352 92C300 120 250 112 210 118S120 140 48 126"/>
        <circle class="port" cx="352" cy="92" r="5"/><circle class="port" cx="210" cy="118" r="4"/><circle class="port" cx="48" cy="126" r="4"/>
        <text x="330" y="80">Karachi</text><text x="192" y="104">Ormara</text><text x="30" y="114">Gwadar</text>
        <path class="boat" id="boat" d="M-7 0h14l-3 5h-8Zm6-1V-12l6 10Z"/>
        <text x="300" y="200">Arabian Sea</text>
      </svg>` },
    { d: "NE", name: "Weather", icon: I('<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.4A3.5 3.5 0 1 1 17 18Z"/>'), html: () => `
      <h2>Weather</h2><p class="lead">Fair sailing until evening, wind easing after 18:00</p>
      <div class="tiles"><div class="tile"><small>Wind</small><b><span class="wind">↑</span> 14 kn</b></div><div class="tile"><small>Waves</small><b>1.2 m</b></div><div class="tile"><small>Seeing</small><b>9 nm</b></div></div>
      <ul class="rows"><li><span><b>12:00</b><small>Sunny, wind NE 14 kn</small></span><em>31°</em></li><li><span><b>15:00</b><small>Haze, wind NE 12 kn</small></span><em>30°</em></li><li><span><b>18:00</b><small>Clear, wind N 8 kn</small></span><em>27°</em></li></ul>` },
    { d: "E", name: "Crew", icon: I('<circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14a4.5 4.5 0 0 1 5.5 5"/>'), html: () => `
      <h2>Crew</h2><p class="lead">Four aboard · tap to set who is on watch</p>
      <ul class="rows">${[["AK", "Ayesha Khan", "Skipper"], ["BA", "Bilal Ahmed", "Navigator"], ["HQ", "Hamza Qureshi", "Engineer"], ["SM", "Sana Mirza", "Cook and first aid"]].map(([a, n, r], i) => `<li><span class="av">${a}</span><span><b>${n}</b><small>${r}</small></span><button class="watch" type="button" data-w="${i}" aria-pressed="${watch[i]}">${watch[i] ? "On watch" : "Off"}</button></li>`).join("")}</ul>` },
    { d: "SE", name: "Ports", icon: I('<path d="M12 3v14M7 8h10"/><path d="M5 13a7 7 0 0 0 14 0"/><circle cx="12" cy="3.5" r="1.5"/>'), html: () => `
      <h2>Ports</h2><p class="lead">Along the Makran coast, from home</p>
      <ul class="rows"><li><span><b>Karachi</b><small>Home berth · fuel, water, repairs</small></span><em>0 nm</em></li><li><span><b>Ormara</b><small>Fuel and water</small></span><em>128 nm</em></li><li><span><b>Pasni</b><small>Water only</small></span><em>210 nm</em></li><li><span><b>Gwadar</b><small>Fuel, water, market</small></span><em>290 nm</em></li></ul>` },
    { d: "S", name: "Log", icon: I('<path d="M6 3h10l3 3v15H6Z"/><path d="M9 9h7M9 13h7M9 17h4"/>'), html: () => `
      <h2>Log</h2><p class="lead">What happened on this passage</p>
      <form class="add" id="logForm"><input id="logIn" placeholder="Add a log entry" aria-label="New log entry" maxlength="60"><button type="submit">Add</button></form>
      <ul class="rows" id="logList">${log.slice(0, 4).map(([t, x]) => `<li><b>${t}</b><small>${x}</small></li>`).join("")}</ul>` },
    { d: "SW", name: "Tides", icon: I('<path d="M3 14c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/><path d="M3 19c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/>'), html: () => `
      <h2>Tides</h2><p class="lead">Karachi harbour · today</p>
      <svg class="tide" viewBox="0 0 400 150" preserveAspectRatio="none" aria-label="Tide curve with high water at 09:40 and 22:05"><path class="wave" d="M0 110C50 110 60 30 110 30S180 120 230 120 300 40 350 40 390 90 400 95V150H0Z"/><line class="now" x1="168" y1="0" x2="168" y2="150"/><circle cx="168" cy="76" r="5"/></svg>
      <div class="tiles" style="margin-top:10px"><div class="tile"><small>High</small><b>09:40</b></div><div class="tile"><small>Low</small><b>16:10</b></div><div class="tile"><small>Next high</small><b>22:05</b></div></div>` },
    { d: "W", name: "Gear", icon: I('<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/>'), html: () => `
      <h2>Gear</h2><p class="lead" id="gearLead"></p>
      <ul class="rows">${GEAR.map((g, i) => `<li><label class="chk"><input type="checkbox" data-g="${i}" ${gear[i] ? "checked" : ""}><span>${g}</span></label></li>`).join("")}</ul>
      <div class="bar"><i id="gearBar"></i></div>` },
    { d: "NW", name: "Notes", icon: I('<path d="M4 20l4-1 11-11-3-3L5 16Z"/><path d="M14 6l3 3"/>'), html: () => `
      <h2>Notes</h2><p class="lead">Kept on this device for the trip</p>
      <textarea id="notes" maxlength="280" aria-label="Trip notes">${notes}</textarea><p class="count" id="count"></p>` }
  ];
  const GEAR = ["Life jackets for four", "Flares and horn", "VHF radio, charged", "First aid kit", "Spare fuel can"];
  const watch = [true, false, false, true], gear = [true, true, false, true, false];
  const log = [["06:10", "Left Karachi, wind light from the north"], ["08:45", "Dolphins off the bow"], ["10:20", "Changed course to 265°"]];
  let notes = "Buy ice in Ormara. Check the bilge pump before night.";

  // ---------- Build the compass rose ----------
  const rose = $("#rose"), dirs = $("#dirs");
  const polar = (r, deg) => [(r * Math.sin(deg * D2R)).toFixed(2), (-r * Math.cos(deg * D2R)).toFixed(2)];
  const wedge = (k) => { const c = k * 45, [x1, y1] = polar(116, c - 22.5), [x2, y2] = polar(116, c + 22.5), [x3, y3] = polar(42, c + 22.5), [x4, y4] = polar(42, c - 22.5); return `M${x1} ${y1}A116 116 0 0 1 ${x2} ${y2}L${x3} ${y3}A42 42 0 0 0 ${x4} ${y4}Z`; };
  let ticks = "";
  for (let a = 0; a < 360; a += 5) { const long = a % 45 === 0, mid = a % 15 === 0, [x1, y1] = polar(121, a), [x2, y2] = polar(long ? 131 : mid ? 128 : 125, a); ticks += `<line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${long ? 2.4 : 1.2}"/>`; }
  const star = [0, 90, 180, 270].map((a) => { const [x1, y1] = polar(40, a), [x2, y2] = polar(10, a + 45), [x3, y3] = polar(10, a - 45); return `<path class="star" d="M${x1} ${y1}L${x2} ${y2}L0 0L${x3} ${y3}Z"/>`; }).join("");
  rose.innerHTML = `<circle class="face" r="118"/><circle class="rim" r="122"/>${ticks}${PAGES.map((_, k) => `<path class="wedge" data-k="${k}" d="${wedge(k)}"/>`).join("")}${star}<circle r="42" fill="none" stroke="var(--line)"/>
    ${[["N", 0], ["E", 90], ["S", 180], ["W", 270]].map(([t, a]) => { const [x, y] = polar(106, a); return `<text class="${t === "N" ? "n" : ""}" x="${x}" y="${y}">${t}</text>`; }).join("")}`;
  dirs.innerHTML = PAGES.map((p, k) => `<button class="dir" type="button" role="menuitem" data-k="${k}" style="--a:${k * 45}deg;--k:${k}" aria-label="${p.name}, ${p.d}" tabindex="-1">${p.icon}<span>${p.name}</span></button>`).join("");
  const wedges = $$(".wedge", rose), dirBtns = $$(".dir", dirs);

  // ---------- Pages ----------
  const view = $("#view");
  let cur = 2; // start on Crew, east
  function pageEl(k) {
    const el = document.createElement("section");
    el.className = "page"; el.dataset.k = k;
    el.setAttribute("aria-label", PAGES[k].name);
    el.innerHTML = PAGES[k].html();
    // the neighbours on the rose, as buttons that teach which way to flick
    const near = [(k + 7) % 8, (k + 4) % 8, (k + 1) % 8];
    el.insertAdjacentHTML("beforeend", `<nav class="near" aria-label="Nearby pages">${near.map((n) => `<button class="nb" type="button" data-go="${n}" aria-label="Go to ${PAGES[n].name}, ${PAGES[n].d}"><svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(${n * 45}deg)"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span><small>${PAGES[n].d}</small>${PAGES[n].name}</span></button>`).join("")}</nav>`);
    return el;
  }
  function wire(el) {
    const k = +el.dataset.k;
    if (k === 0) sail(el);
    $$(".nb", el).forEach((b) => b.addEventListener("click", () => navigate(+b.dataset.go)));
    $$(".watch", el).forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.w; watch[i] = !watch[i]; b.setAttribute("aria-pressed", String(watch[i])); b.textContent = watch[i] ? "On watch" : "Off"; }));
    const form = $("#logForm", el);
    if (form) form.addEventListener("submit", (e) => {
      e.preventDefault();
      const inp = $("#logIn", el), v = inp.value.trim(); if (!v) { inp.focus(); return; }
      const t = new Date().toTimeString().slice(0, 5);
      log.unshift([t, v]); inp.value = "";
      const li = document.createElement("li"); li.innerHTML = `<b>${t}</b><small></small>`; li.querySelector("small").textContent = v;
      $("#logList", el).prepend(li);
      if (!reduce) li.animate([{ transform: "translateY(-12px) scale(.96)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 500, easing: "cubic-bezier(.34,1.56,.64,1)" });
      const items = $$("#logList li", el); if (items.length > 4) items[items.length - 1].remove();
      say("Log entry added");
    });
    const gl = () => { const n = gear.filter(Boolean).length, lead = $("#gearLead", el), bar = $("#gearBar", el); if (lead) { lead.textContent = `${n} of ${GEAR.length} packed${n === GEAR.length ? " · ready to sail" : ""}`; bar.style.width = n / GEAR.length * 100 + "%"; } };
    $$("input[data-g]", el).forEach((c) => c.addEventListener("change", () => { gear[+c.dataset.g] = c.checked; gl(); }));
    gl();
    const ta = $("#notes", el);
    if (ta) { const cnt = () => { $("#count", el).textContent = `${ta.value.length} of 280 characters · saved`; notes = ta.value; }; ta.addEventListener("input", cnt); cnt(); }
  }
  // the little boat sails along the dotted route on the chart
  function sail(el) {
    const route = $("#route", el), boat = $("#boat", el); if (!route || !boat) return;
    const len = route.getTotalLength(), t0 = performance.now();
    const f = (now) => {
      if (!el.isConnected) return;
      const t = reduce ? .35 : ((now - t0) / 14000) % 1, p = route.getPointAtLength(len * t), q = route.getPointAtLength(Math.min(len, len * t + 2));
      const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 180;
      boat.setAttribute("transform", `translate(${p.x} ${p.y + Math.sin(now / 300) * 1.2}) rotate(${ang})`);
      if (!reduce) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }
  let page = pageEl(cur); view.appendChild(page); wire(page);

  // header: the direction seal spins and the title rolls
  function setHead(k, animate) {
    const p = PAGES[k], seal = $("#seal"), roll = $("#roll");
    seal.textContent = p.d;
    const nb = document.createElement("b"); nb.textContent = p.name;
    const old = roll.querySelector("b");
    roll.appendChild(nb);
    if (animate && !reduce && old) {
      seal.classList.remove("spin"); void seal.offsetWidth; seal.classList.add("spin");
      old.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-26px)", opacity: 0 }], { duration: 280, easing: "ease-in", fill: "forwards" }).onfinish = () => old.remove();
      nb.animate([{ transform: "translateY(28px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 520, delay: 90, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "backwards" });
    } else if (old) old.remove();
    $("#fabNeedle").style.transform = `rotate(${k * 45}deg)`;
    wedges.forEach((w, i) => w.classList.toggle("cur", i === k));
  }
  setHead(cur, false);

  // the page arrives from the direction you flicked; the old one leaves the other way, with a swoosh of foam
  let navBusy = false;
  async function navigate(k) {
    if (k === cur || navBusy) return;
    navBusy = true;
    const th = k * 45 * D2R, dx = Math.sin(th), dy = -Math.cos(th);
    const old = page, nu = pageEl(k);
    view.appendChild(nu); wire(nu);
    cur = k; page = nu;
    setHead(k, true);
    say(`${PAGES[k].name}, ${PAGES[k].d}`);
    if (!reduce) {
      const sw = document.createElement("div"); sw.className = "swoosh"; view.appendChild(sw);
      sw.animate([{ transform: `rotate(${k * 45 - 90}deg) translateX(45%)`, opacity: 1 }, { transform: `rotate(${k * 45 - 90}deg) translateX(-45%)`, opacity: 0 }], { duration: 700, easing: "cubic-bezier(.3,.6,.4,1)" }).onfinish = () => sw.remove();
      old.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${-dx * 34}%, ${-dy * 34}%) scale(.92)`, opacity: 0 }], { duration: 420, easing: "cubic-bezier(.5,0,.75,.4)", fill: "forwards" });
      await nu.animate([{ transform: `translate(${dx * 70}%, ${dy * 70}%) scale(1.03)`, opacity: 0 }, { opacity: 1, offset: .5 }, { transform: "none", opacity: 1 }], { duration: 720, delay: 110, easing: "cubic-bezier(.2,1.2,.35,1)", fill: "backwards" }).finished.catch(() => {});
    }
    old.remove();
    navBusy = false;
  }

  // ---------- Compass state: the needle is a spring that chases the pointer ----------
  const compass = $("#compass"), cbody = $("#cbody"), needle = $("#needle"), cap = $("#cap"), app = $(".app");
  const N = { a: 0, v: 0, t: 0 };
  let shown = false, mode = "", sel = -1, cx = 0, cy = 0, lastT = performance.now(), running = false;
  function needleFrame(now) {
    const dt = Math.min(.032, (now - lastT) / 1000); lastT = now;
    const diff = ((N.t - N.a + 540) % 360) - 180;
    N.v += (130 * diff - 9 * N.v) * dt; N.a += N.v * dt;
    if (reduce) N.a = N.t;
    needle.style.transform = `rotate(${N.a}deg)`;
    if (shown) requestAnimationFrame(needleFrame); else running = false;
  }
  function placeCompass(x, y) {
    const r = app.getBoundingClientRect(), vr = view.getBoundingClientRect();
    // keep the whole rose inside the page area; on a narrow screen it simply centres
    cx = Math.max(vr.left - r.left + 132, Math.min(vr.right - r.left - 132, x - r.left));
    cy = Math.max(vr.top - r.top + 132, Math.min(vr.bottom - r.top - 132, y - r.top));
    if (vr.width < 272) cx = (vr.left + vr.right) / 2 - r.left;
    if (vr.height < 272) cy = (vr.top + vr.bottom) / 2 - r.top;
    compass.style.left = cx + "px"; compass.style.top = cy + "px";
  }
  function showCompass(x, y, how) {
    placeCompass(x, y);
    mode = how; shown = true; sel = -1;
    compass.hidden = false;
    compass.classList.remove("gone", "open", "ghost", "click"); void compass.offsetWidth;
    compass.classList.add("open"); if (how === "click") compass.classList.add("click"); if (how === "ghost") compass.classList.add("ghost");
    N.a = -40; N.v = 0; N.t = cur * 45; // the needle swings in to point at the page you are on
    if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(needleFrame); }
    highlight(-1);
    $("#fab").setAttribute("aria-expanded", "true");
    dirBtns.forEach((b) => { b.tabIndex = how === "click" ? 0 : -1; });
  }
  function highlight(k) {
    sel = k;
    wedges.forEach((w, i) => w.classList.toggle("on", i === k));
    dirBtns.forEach((b, i) => b.classList.toggle("on", i === k));
    if (k >= 0) N.t = k * 45;
  }
  function hideCompass(toward) {
    if (!shown) return;
    shown = false;
    $("#fab").setAttribute("aria-expanded", "false");
    dirBtns.forEach((b) => { b.tabIndex = -1; });
    if (reduce) { compass.hidden = true; return; }
    const th = (toward ?? -1) >= 0 ? toward * 45 * D2R : 0, d = toward >= 0 ? 90 : 0;
    compass.style.setProperty("--gx", (Math.sin(th) * d).toFixed(0) + "px");
    compass.style.setProperty("--gy", (-Math.cos(th) * d).toFixed(0) + "px");
    compass.classList.remove("open"); compass.classList.add("gone");
    setTimeout(() => { if (!shown) { compass.hidden = true; compass.classList.remove("gone"); } }, 400);
  }
  // pick: the wedge flashes, the needle locks with a clack, the rose flies off toward that page
  async function pick(k) {
    if (k < 0) { hideCompass(-1); return; }
    highlight(k);
    wedges[k].classList.remove("flash"); void wedges[k].getBoundingClientRect(); wedges[k].classList.add("flash");
    cap.classList.remove("clack"); void cap.offsetWidth; cap.classList.add("clack");
    N.t = k * 45; N.v += 260;
    await sleep(mode === "ghost" ? 120 : 220);
    hideCompass(k);
    if (k === cur) { say(`${PAGES[k].name} is already open`); return; }
    navigate(k);
  }
  const angleIndex = (dx, dy) => { const deg = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360; return Math.round(deg / 45) % 8; };

  // ---------- The gesture: hold to open, drag to aim, let go to go; a quick flick skips the menu ----------
  const press = $("#press");
  let g = null;
  const HOLD = 280, DEAD = 34;
  view.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || shown || navBusy || e.target.closest("button, input, textarea, label, a, form")) return;
    const r = app.getBoundingClientRect();
    g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), open: false, flick: false };
    try { view.setPointerCapture(e.pointerId); } catch (_) {}
    press.style.left = e.clientX - r.left + "px"; press.style.top = e.clientY - r.top + "px";
    press.classList.remove("on"); void press.offsetWidth; press.classList.add("on");
    g.timer = setTimeout(() => { if (g && !g.flick) { g.open = true; press.classList.remove("on"); showCompass(g.x0, g.y0, "drag"); } }, HOLD);
  });
  view.addEventListener("pointermove", (e) => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0, dist = Math.hypot(dx, dy);
    if (!g.open) { if (dist > 14) { g.flick = true; clearTimeout(g.timer); press.classList.remove("on"); } return; }
    const r = app.getBoundingClientRect(), ax = e.clientX - r.left - cx, ay = e.clientY - r.top - cy;
    if (Math.hypot(ax, ay) > DEAD) highlight(angleIndex(ax, ay)); else { highlight(-1); N.t = Math.atan2(ax, -ay) * 180 / Math.PI; }
  });
  function endGesture(e) {
    if (!g || (e && e.pointerId !== g.id)) return;
    clearTimeout(g.timer); press.classList.remove("on");
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0, dist = Math.hypot(dx, dy), ms = performance.now() - g.t0;
    const was = g; g = null;
    if (was.open) { if (e.type === "pointerup" && sel >= 0) pick(sel); else hideCompass(-1); return; }
    if (was.flick && e.type === "pointerup" && dist > 40 && ms < 650) {
      // expert flick: a faint compass flashes where you started, then off you go
      const k = angleIndex(dx, dy);
      showCompass(was.x0, was.y0, "ghost"); highlight(k); pick(k);
    }
  }
  view.addEventListener("pointerup", endGesture);
  view.addEventListener("pointercancel", endGesture);
  view.addEventListener("contextmenu", (e) => { if (e.target.closest("input, textarea")) return; e.preventDefault(); if (!shown) showCompass(e.clientX, e.clientY, "click"); });

  // ---------- Button and keyboard ----------
  const fab = $("#fab");
  fab.addEventListener("click", () => {
    if (shown) { hideCompass(-1); return; }
    const vr = view.getBoundingClientRect();
    showCompass(vr.left + vr.width / 2, vr.top + vr.height / 2, "click");
    highlight(cur);
    setTimeout(() => dirBtns[cur].focus({ preventScroll: true }), reduce ? 0 : 120);
  });
  dirs.addEventListener("click", (e) => { const b = e.target.closest(".dir"); if (b && mode === "click") pick(+b.dataset.k); });
  dirs.addEventListener("pointerover", (e) => { const b = e.target.closest(".dir"); if (b && mode === "click") highlight(+b.dataset.k); });
  dirs.addEventListener("keydown", (e) => {
    const k = sel < 0 ? cur : sel;
    const map = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    let n = -1;
    if (e.key in map) n = (k + map[e.key] + 8) % 8;
    else if (/^[1-8]$/.test(e.key)) n = +e.key - 1;
    else if (e.key === "Escape" || e.key === "Tab") { e.preventDefault(); hideCompass(-1); fab.focus(); return; }
    if (n < 0) return;
    e.preventDefault(); highlight(n); dirBtns[n].focus();
  });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && shown) { hideCompass(-1); fab.focus(); } });
  addEventListener("pointerdown", (e) => { if (shown && mode === "click" && !compass.contains(e.target) && !fab.contains(e.target)) hideCompass(-1); });

  // ---------- Auto demo: a ghost finger holds, aims and lets go; sometimes a quick flick ----------
  let demo = !reduce;
  const finger = $("#finger");
  const stop = (e) => { if (e.isTrusted) { demo = false; finger.classList.remove("on", "down"); } };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  const at = (x, y) => { finger.style.transform = `translate(${x}px, ${y}px)`; };
  async function move(x0, y0, x1, y1, ms) {
    const t0 = performance.now();
    await new Promise((res) => { const f = (now) => { const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; const x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e; at(x, y); if (shown && mode === "drag") { const ax = x - cx, ay = y - cy; if (Math.hypot(ax, ay) > DEAD) highlight(angleIndex(ax, ay)); } if (t < 1 && demo) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
  }
  (async () => {
    await sleep(1100);
    const plan = [[3, 0], [5, 0], [0, 0], [4, 1], [6, 0], [1, 0], [7, 1], [2, 0]];
    let k = 0;
    while (demo) {
      const [to, quick] = plan[k++ % plan.length];
      if (to === cur) continue;
      const r = app.getBoundingClientRect(), vr = view.getBoundingClientRect();
      const x = vr.left - r.left + vr.width * (.45 + (k % 3) * .05), y = vr.top - r.top + vr.height * .55;
      at(x, y); finger.classList.add("on"); await sleep(350); if (!demo) break;
      finger.classList.add("down");
      const th = to * 45 * D2R;
      if (quick) {
        await move(x, y, x + Math.sin(th) * 90, y - Math.cos(th) * 90, 180); if (!demo) break;
        finger.classList.remove("down"); showCompass(x + r.left, y + r.top, "ghost"); highlight(to); pick(to);
      } else {
        press.style.left = x + "px"; press.style.top = y + "px"; press.classList.remove("on"); void press.offsetWidth; press.classList.add("on");
        await sleep(HOLD); if (!demo) break;
        press.classList.remove("on"); showCompass(x + r.left, y + r.top, "drag");
        await sleep(450); if (!demo) break;
        await move(x, y, cx + Math.sin(th) * 92, cy - Math.cos(th) * 92, 520); if (!demo) break;
        await sleep(260); if (!demo) break;
        finger.classList.remove("down"); pick(to);
      }
      await sleep(260); finger.classList.remove("on");
      await sleep(2300);
    }
    if (shown && mode !== "click") hideCompass(-1);
  })();
})();
</script>
