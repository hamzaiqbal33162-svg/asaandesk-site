<!doctype html>
<!-- Chill & Craft · Stridewell · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stridewell · Fitness studio dashboard</title>
<meta name="description" content="Stridewell: a dashboard for a chain of fitness studios with a live studio floor, heart-rate zones, schedule, members, trainers and memberships.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: near-black studio with hot coral + lime (dark) / chalk paper (light) ---------- */
  :root {
    --bg: #efede8; --surface: #ffffff; --surface-2: #f6f5f1; --surface-3: #ebe9e3; --panel: #ffffff;
    --line: rgba(24,22,20,.09); --line-2: rgba(24,22,20,.17); --grid: rgba(24,22,20,.07);
    --ink: #17171b; --muted: #6b6a71; --faint: #a5a3aa;
    --coral: #e2412b; --coral-bg: rgba(226,65,43,.1); --lime: #93cc12; --lime-tx: #4a7400; --lime-bg: rgba(130,190,10,.15); --lime-ink: #142003;
    --k-str: #e2412b; --k-run: #78b000; --k-flow: #2a8bd2; --k-box: #d98300; --k-hiit: #9752d4;
    --z1: #8d94a6; --z2: var(--k-flow); --z3: var(--k-run); --z4: var(--k-box); --z5: var(--k-str);
    --accent: #e2412b; --accent-ink: #fff; --good: #4a7400; --bad: #d23a26; --warn: #b86f00;
    --wall: #34343c; --floor: #f8f7f3; --spot: rgba(24,22,20,.12);
    --radius: 14px; --radius-sm: 10px; --overlay: rgba(24,22,20,.38); --tip-bg: #17171b; --tip-ink: #fff; --track: var(--surface-3);
    --shadow: 0 1px 2px rgba(24,22,20,.05), 0 12px 28px -20px rgba(24,22,20,.3);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #09090b; --surface: #121215; --surface-2: #18181c; --surface-3: #222228; --panel: #151519;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.14); --grid: rgba(255,255,255,.045);
    --ink: #f4f2ee; --muted: #8e8c95; --faint: #5c5a62;
    --coral: #ff5b46; --coral-bg: rgba(255,91,70,.13); --lime: #c8f53e; --lime-tx: #c8f53e; --lime-bg: rgba(200,245,62,.11); --lime-ink: #131a03;
    --k-str: #ff5b46; --k-run: #c8f53e; --k-flow: #69c0ff; --k-box: #ffb444; --k-hiit: #c79bff;
    --accent: #ff5b46; --accent-ink: #1c0703; --good: #c8f53e; --bad: #ff6b57; --warn: #ffb444;
    --wall: #3b3b44; --floor: #0d0d10; --spot: rgba(255,255,255,.1);
    --overlay: rgba(0,0,0,.62); --tip-bg: #f4f2ee; --tip-ink: #111;
    --shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 22px 40px -26px rgba(0,0,0,.9);
    color-scheme: dark;
  }
/* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
/* no sideways page scroll, whatever a wide header or an entrance animation does */
body{margin:0;overflow-x:clip;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em;}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px;}
.cc-av{--h:200;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;font-size:.8em;font-weight:700;color:hsl(var(--h) 60% 22%);background:hsl(var(--h) 70% 84%);flex:none;letter-spacing:.02em;}
[data-theme="dark"] .cc-av{color:hsl(var(--h) 80% 88%);background:hsl(var(--h) 35% 28%);}
/* Buttons used by dialogs (apps restyle .btn to fit their look) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:38px;padding:0 16px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:translateY(1px) scale(.97);}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink,#fff);}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -8px var(--accent);}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:30px;padding:0 11px;font-size:.86em;}
.btn[disabled]{opacity:.5;pointer-events:none;}
/* Toasts */
.cc-toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:grid;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none;}
.cc-toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm,10px);background:var(--tip-bg,#111);color:var(--tip-ink,#fff);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-size:.92rem;animation:ccToast .35s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto;}
.cc-toast .ic{color:var(--good);}
.cc-toast.bad .ic{color:var(--bad);}
.cc-toast.warn .ic{color:var(--warn);}
.cc-toast.out{animation:ccToastOut .3s ease forwards;}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.96);}}
@keyframes ccToastOut{to{opacity:0;transform:translateX(30px);}}
/* Modal + drawer */
.cc-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;}
.cc-back{position:absolute;inset:0;background:var(--overlay,rgba(10,12,20,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;}
.cc-dialog{position:relative;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel,var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius,16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.1);}
.cc-dialog.wide{width:min(720px,100%);}
.cc-overlay.open .cc-back{opacity:1;}
.cc-overlay.open .cc-dialog{opacity:1;transform:none;}
.cc-overlay.is-drawer{place-items:stretch end;padding:0;}
.cc-overlay.is-drawer .cc-dialog{width:min(440px,100%);height:100%;max-height:none;border-radius:var(--radius,16px) 0 0 var(--radius,16px);transform:translateX(40px);}
.cc-overlay.is-drawer.open .cc-dialog{transform:none;}
.cc-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:1;}
.cc-dh h2{margin:0;font-size:1.12rem;}
.cc-x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;}
.cc-x:hover{background:var(--surface-2);}
.cc-db{padding:8px 20px 20px;}
.cc-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap;}
.cc-db .cc-df{padding:14px 0 0;}
.cc-confirm{margin:6px 0 0;color:var(--muted);line-height:1.5;}
.cc-picks{display:grid;gap:6px;}
.cc-pick{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface-2);}
.cc-pick:hover,.cc-pick:focus-visible{border-color:var(--accent);}
.cc-pick small{margin-left:auto;color:var(--muted);}
/* Forms */
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.cc-field{display:grid;gap:5px;grid-column:span 2;}
.cc-field.half{grid-column:span 1;}
.cc-field label{font-size:.84rem;font-weight:600;color:var(--muted);}
.cc-field input,.cc-field select,.cc-field textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
.cc-field input:focus,.cc-field select:focus,.cc-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);}
.cc-field [aria-invalid="true"]{border-color:var(--bad);}
.cc-err{color:var(--bad);font-size:.8rem;min-height:0;}
.cc-err:empty{display:none;}
.cc-hint{color:var(--muted);font-size:.78rem;}
.cc-intro{margin:0 0 12px;color:var(--muted);}
.cc-range{display:flex;gap:10px;align-items:center;}
.cc-range input{padding:0;min-height:0;accent-color:var(--accent);border:0;background:none;}
.cc-range output{min-width:3.5em;text-align:right;font-weight:700;}
.cc-form.shake{animation:ccShake .35s;}
@keyframes ccShake{25%{transform:translateX(-6px);}50%{transform:translateX(5px);}75%{transform:translateX(-3px);}}
@media (max-width:480px){.cc-field.half{grid-column:span 2;}}
/* Popover + tooltip */
.cc-pop{position:fixed;z-index:85;max-height:70vh;overflow:auto;background:var(--panel,var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm,12px);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .25s;}
.cc-pop.open{opacity:1;transform:none;}
.cc-tip{position:fixed;z-index:95;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111);color:var(--tip-ink,#fff);font-size:.8rem;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;}
.cc-tip.on{opacity:1;}
.cc-tip b{display:block;margin-bottom:3px;}
.cc-tip div{display:flex;align-items:center;gap:6px;}
.cc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.cc-tip em{margin-left:auto;padding-left:10px;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;}
.cc-tip-tot{border-top:1px solid rgba(255,255,255,.18);margin-top:4px;padding-top:4px;}
/* Command search */
.cc-cmdk .cc-dialog{align-self:start;margin-top:10vh;}
.cc-cmdk-q{width:100%;min-height:46px;padding:0 14px;border-radius:var(--radius-sm,10px);border:1px solid var(--accent);background:var(--surface-2);font-size:1rem;}
.cc-cmdk-q:focus{outline:none;}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto;}
.cc-cmdk-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;}
.cc-cmdk-list li[aria-selected="true"],.cc-cmdk-list li:hover{background:var(--surface-2);color:var(--accent);}
.cc-cmdk-list small{margin-left:auto;color:var(--muted);}
.cc-cmdk-foot{margin:10px 0 0;font-size:.76rem;color:var(--muted);}
.cc-cmdk-foot kbd{padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid var(--line);font-family:inherit;}
.cc-empty-li{color:var(--muted);cursor:default !important;}
/* Data table */
.cc-tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
.cc-search{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:320px;min-height:38px;padding:0 12px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);}
.cc-search:focus-within{border-color:var(--accent);}
.cc-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap;}
.cc-chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;transition:background .2s,color .2s;}
.cc-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink,#fff);border-color:transparent;}
.cc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cc-tbl table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px;}
.cc-tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.cc-tbl th button{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;}
.cc-tbl th svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5;}
.cc-tbl th[aria-sort="ascending"] svg,.cc-tbl th[aria-sort="descending"] svg{opacity:1;color:var(--accent);}
.cc-tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.cc-tbl tbody tr{animation:ccRow .35s both;animation-delay:calc(var(--r,0) * 25ms);transition:background .15s;}
.cc-tbl tbody tr[tabindex="0"]{cursor:pointer;}
.cc-tbl tbody tr[tabindex="0"]:hover{background:var(--surface-2);}
.cc-tbl .r,.cc-tbl th.r{text-align:right;font-variant-numeric:tabular-nums;}
.cc-tbl th.r button{flex-direction:row-reverse;}
@keyframes ccRow{from{opacity:0;transform:translateY(6px);}}
.cc-pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.84rem;color:var(--muted);}
.cc-pages{display:flex;gap:4px;align-items:center;}
.cc-pages button{min-width:32px;height:32px;padding:0 6px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);}
.cc-pages button[aria-current="page"]{background:var(--accent);color:var(--accent-ink,#fff);border-color:transparent;}
.cc-pages button:disabled{opacity:.4;cursor:default;}
.cc-empty{display:grid;place-items:center;align-content:center;gap:6px;padding:28px 12px;text-align:center;color:var(--muted);}
.cc-empty .ic{width:30px;height:30px;opacity:.6;}
.cc-empty b{color:var(--ink);}
/* Charts */
.cc-chart{display:block;overflow:visible;}
.cc-grid line{stroke:var(--grid,var(--line));stroke-dasharray:3 4;}
.cc-zero{stroke:var(--line);}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards;}
.cc-fade{animation:ccFade .9s .3s both;}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both;transition:opacity .2s;}
.cc-bar.neg{transform-origin:50% 0;}
.cc-cell{animation:ccPop .5s both;transform-box:fill-box;transform-origin:center;}
.cc-static .cc-draw,.cc-static .cc-fade,.cc-static .cc-bar,.cc-static .cc-cell{animation:none;stroke-dashoffset:0;}
.cc-guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;}
.cc-guide.on{opacity:.7;}
.cc-dot{opacity:0;stroke:var(--surface);stroke-width:2;}
.cc-dot.on{opacity:1;}
.cc-hit.on{fill:var(--ink);fill-opacity:.05;}
@keyframes ccDraw{to{stroke-dashoffset:0;}}
@keyframes ccFade{from{opacity:0;}}
@keyframes ccGrow{from{transform:scaleY(0);}}
@keyframes ccPop{from{opacity:0;transform:scale(.4);}}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted);}
.cc-legend span{display:inline-flex;align-items:center;gap:6px;}
.cc-legend i,.cc-dlegend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
.cc-donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px;}
.cc-donut{position:relative;flex:none;}
.cc-donut svg{display:block;}
.cc-track{fill:none;stroke:var(--track,var(--surface-2));stroke-linecap:round;}
.cc-seg{fill:none;transition:opacity .2s,stroke-width .2s;cursor:pointer;}
.cc-seg.dim{opacity:.3;}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;}
.cc-donut-c b{font-size:1.25rem;font-variant-numeric:tabular-nums;}
.cc-donut-c small{color:var(--muted);font-size:.76rem;}
.cc-dlegend{list-style:none;margin:0;padding:0;flex:1 1 160px;display:grid;gap:4px;font-size:.86rem;}
.cc-dlegend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;transition:background .2s;}
.cc-dlegend li.on{background:var(--surface-2);}
.cc-dlegend em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;}
.cc-dlegend small{color:var(--muted);min-width:2.6em;text-align:right;}
.cc-spark{display:block;overflow:visible;}
.cc-spark .cc-line{stroke-width:1.8;}
/* Page entrance (apps can swap the keyframes via --enter) */
.cc-in{animation:var(--enter,ccRise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms);}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985);}}
/* Reduced motion: everything still works, without big movement */
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
.cc-draw{stroke-dashoffset:0;}
}
/* ---------- Stridewell base ---------- */
html{font-size:14px;}
body{background:var(--bg);color:var(--ink);font:13px/1.45 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(860px 380px at 6% -6%,color-mix(in srgb,var(--coral) 11%,transparent),transparent 70%),radial-gradient(700px 360px at 104% -4%,color-mix(in srgb,var(--lime) 8%,transparent),transparent 70%);}
a{color:inherit;}
h1,h2,h3,p{margin:0;}
.disp{font-family:"Roboto Condensed","Arial Narrow",sans-serif-condensed,"Inter",ui-sans-serif,system-ui,sans-serif;font-stretch:condensed;}
.tn{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.grow{flex:1;min-width:0;}
.nowrap{white-space:nowrap;}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* ---------- Header: two tiers, lime underline on the active tab ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line);animation:topIn .5s cubic-bezier(.2,.8,.2,1) both;}
@keyframes topIn{from{opacity:0;transform:translateY(-10px);}}
.tier{display:flex;align-items:center;gap:10px;max-width:1440px;margin:0 auto;padding:10px 24px 4px;}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:16.5px;letter-spacing:-.03em;margin-right:8px;}
.brand svg{width:30px;height:30px;flex:none;}
.chipbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:12.5px;white-space:nowrap;}
.chipbtn:hover{border-color:var(--line-2);}
.chipbtn .ic{width:15px;height:15px;color:var(--muted);}
.chipbtn .sw{width:8px;height:8px;border-radius:2px;background:var(--coral);}
.livechip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;background:var(--lime-bg);color:var(--lime-tx);font-weight:700;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none;animation:pulse 1.8s infinite;}
.pulse.coral{background:var(--coral);animation-name:pulseC;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 65%,transparent);}70%,100%{box-shadow:0 0 0 8px transparent;}}
@keyframes pulseC{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--coral) 65%,transparent);}70%,100%{box-shadow:0 0 0 8px transparent;}}
.searchbtn{display:flex;align-items:center;gap:8px;width:280px;height:34px;padding:0 7px 0 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;text-align:left;}
.searchbtn:hover{border-color:var(--line-2);}
.searchbtn span{flex:1;}
.searchbtn .ic{width:15px;height:15px;}
kbd{font:650 10.5px/1 "Inter",ui-sans-serif,system-ui,sans-serif;padding:4px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface-2);}
.icon-btn{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;transition:transform .15s,border-color .2s;}
.icon-btn:hover{border-color:var(--line-2);}
.icon-btn:active{transform:scale(.93);}
.icon-btn .ic{width:17px;height:17px;}
.badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);}
.badge:empty{display:none;}
[data-theme="dark"] .t-sun,[data-theme="light"] .t-moon{display:none;}
.me{display:flex;align-items:center;gap:8px;padding-left:4px;line-height:1.2;}
.me .cc-av{width:32px;height:32px;font-size:11px;}
.me b{display:block;font-size:12.5px;}
.me small{color:var(--muted);font-size:11px;}
.menu-btn,.scrim{display:none;}
.tabs{position:relative;display:flex;gap:2px;max-width:1440px;margin:0 auto;padding:0 24px;}
.tabs a{display:flex;align-items:center;gap:7px;padding:9px 11px 11px;color:var(--muted);text-decoration:none;font-weight:650;font-size:12.5px;white-space:nowrap;transition:color .2s;}
.tabs a:hover,.tabs a[aria-current="page"]{color:var(--ink);}
.tabs a .ic{width:15px;height:15px;transition:color .2s;}
.tabs a[aria-current="page"] .ic{color:var(--lime-tx);}
.tabs .n{min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--coral-bg);color:var(--coral);font-size:10.5px;font-weight:800;display:grid;place-items:center;}
.tabs .n.g{background:var(--lime-bg);color:var(--lime-tx);}
.tabs .mark{position:absolute;bottom:-1px;left:0;height:2px;border-radius:2px;background:var(--lime);box-shadow:0 0 14px var(--lime);transition:transform .45s cubic-bezier(.3,1.25,.5,1),width .3s;}
/* ---------- Page ---------- */
main{max-width:1440px;margin:0 auto;padding:16px 24px 44px;}
.page-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.page-h h1{font-size:28px;line-height:1.15;font-weight:760;letter-spacing:-.035em;}
.page-h h1 em{font-style:normal;color:var(--coral);}
.page-h p{margin-top:5px;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap;}
.page-h p span{display:inline-flex;align-items:center;gap:6px;}
.page-h p b{color:var(--ink);font-weight:650;}
.acts{display:flex;gap:8px;flex-wrap:wrap;}
#view{min-height:60vh;}
#view.swap{animation:viewIn .32s cubic-bezier(.2,.8,.2,1) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}}
.tabs .n:empty{display:none;}
.cc-in{animation-duration:.45s;animation-delay:calc(var(--i,0) * 32ms);}
.cc-pick[aria-pressed="true"]{border-color:var(--lime);}
.fillcol{display:flex;flex-direction:column;overflow:hidden;}
.fillcol>.fl,.fillcol>.hrbox,.hrbox>.fl{flex:1 1 0;min-height:0;overflow:auto;}
.fillcol>.feed.fl,.fillcol>.hrbox,.hrbox>.fl{overflow:hidden;}
.hrbox{display:flex;flex-direction:column;}
@media (max-width:1200px){.fillcol>.fl,.fillcol>.hrbox,.hrbox>.fl{flex:none;}.fillcol>.fl{max-height:520px;}}
.btn{min-height:34px;padding:0 13px;border-radius:10px;font-size:12.5px;font-weight:650;background:var(--surface);border-color:var(--line-2);}
.btn .ic{width:15px;height:15px;}
.btn.primary{background:var(--coral);color:var(--accent-ink);}
.btn.primary:hover{box-shadow:0 8px 22px -10px var(--coral);}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent;}
.btn.lime:hover{box-shadow:0 8px 22px -10px var(--lime);border-color:transparent;}
.btn.sm{min-height:28px;padding:0 10px;font-size:11.5px;border-radius:8px;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line);}
.linkbtn{border:0;background:none;padding:0;color:var(--lime-tx);font-weight:650;font-size:12px;display:inline-flex;align-items:center;gap:4px;}
.linkbtn .ic{width:14px;height:14px;}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;}
.grid + .grid{margin-top:14px;}
.s2{grid-column:span 2;}.s3{grid-column:span 3;}.s4{grid-column:span 4;}.s5{grid-column:span 5;}.s6{grid-column:span 6;}.s7{grid-column:span 7;}.s8{grid-column:span 8;}.s9{grid-column:span 9;}.s12{grid-column:span 12;}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.2,.5,1),border-color .25s,box-shadow .3s;}
.card:hover{transform:translateY(-2px);border-color:var(--line-2);}
.card.still:hover{transform:none;}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:28px;}
.card-h h2{font-size:13.5px;font-weight:680;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.card-h h2 .ic{width:16px;height:16px;color:var(--muted);}
.card-h small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;font-weight:400;}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);flex:none;}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:11.5px;font-weight:650;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s;}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);}
.cc-chip{min-height:28px;padding:0 11px;font-size:11.5px;border-radius:8px;}
.cc-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
.cc-search{min-height:34px;border-radius:10px;}
.cc-tbl table{font-size:12.5px;}
.cc-tbl th{font-size:10.5px;padding:8px 10px;}
.cc-tbl td{padding:8px 10px;}
.cc-pages button{min-width:28px;height:28px;}
.cc-pages button[aria-current="page"]{background:var(--ink);color:var(--bg);}
.cc-dialog{border-radius:16px;}
.cc-dh h2{font-size:15px;}
.cc-field label{font-size:11.5px;}
.cc-field input,.cc-field select,.cc-field textarea{min-height:36px;font-size:13px;}
.cc-legend{font-size:11.5px;margin-top:6px;}
.cc-dlegend{font-size:12px;}
.cc-dlegend li{padding:3px 6px;}
/* KPI tiles */
.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:end;padding:12px 14px;}
.kpi .lbl{grid-column:1 / -1;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:600;}
.kpi .lbl .ic{width:15px;height:15px;}
.kpi .lbl i.k{width:8px;height:8px;border-radius:2px;background:var(--k,var(--coral));}
.kpi .val{font-size:27px;font-weight:720;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px;letter-spacing:0;}
.kpi .foot{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.kpi .spk{grid-column:2;grid-row:2 / 4;align-self:end;color:var(--k,var(--lime));}
.delta{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:6px;font-weight:750;font-size:11px;white-space:nowrap;}
.delta .ic{width:12px;height:12px;}
.delta.up{background:var(--lime-bg);color:var(--lime-tx);}
.delta.dn{background:var(--coral-bg);color:var(--coral);}
/* tags, faces, capacity */
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--surface-3);color:var(--muted);flex:none;}
.tag.live{background:var(--lime-bg);color:var(--lime-tx);}
.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.25;}}
.tag.hot{background:var(--coral-bg);color:var(--coral);}
.tag.warn{background:color-mix(in srgb,var(--k-box) 15%,transparent);color:var(--warn);}
.tag.cool{background:color-mix(in srgb,var(--k-flow) 14%,transparent);color:var(--k-flow);}
.tag.k{background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k);}
[data-theme="light"] .tag.k{color:color-mix(in srgb,var(--k) 75%,#000);}
.face{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;display:block;background:var(--surface-3);}
.cc-av.face{display:inline-grid;font-size:10.5px;}
.face.lg{width:44px;height:44px;}.cc-av.face.lg{font-size:14px;}
.face.xl{width:64px;height:64px;}.cc-av.face.xl{font-size:19px;}
.face.sm{width:22px;height:22px;}.cc-av.face.sm{font-size:8.5px;}
.stack{display:flex;}.stack .face{border:2px solid var(--surface);margin-left:-7px;}.stack .face:first-child{margin-left:0;}
.who{display:flex;align-items:center;gap:9px;min-width:0;}
.who b{display:block;font-weight:650;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cap{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);min-width:0;}
.cap .bar{flex:1;position:relative;height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:40px;}
.cap .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--k,var(--lime));transition:width 1s cubic-bezier(.3,1,.4,1);}
.cap .bar i.bk{opacity:.38;}
.cap b{color:var(--ink);font-weight:680;font-variant-numeric:tabular-nums;white-space:nowrap;}
.cap .wl{color:var(--coral);font-weight:700;white-space:nowrap;}
.meter{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.meter i{display:block;height:100%;width:0;border-radius:4px;background:var(--k,var(--lime));transition:width 1s cubic-bezier(.3,1,.4,1);}
/* lists */
.list{list-style:none;margin:0;padding:0;}
.list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0;}
.list li:last-child{border-bottom:0;}
.list .end{margin-left:auto;text-align:right;flex:none;font-size:11.5px;color:var(--muted);}
.list .end b{display:block;color:var(--ink);font-size:12.5px;}
/* ---------- Signature: the studio floor ---------- */
.floor{position:relative;display:grid;grid-template-columns:1.08fr 1.12fr 1fr;grid-template-rows:minmax(0,1fr) 32px minmax(0,1fr);height:372px;border:2px solid var(--wall);border-radius:12px;background-color:var(--floor);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;overflow:hidden;}
.room{position:relative;display:flex;flex-direction:column;gap:3px;padding:10px 12px 9px;min-width:0;cursor:pointer;border:0 solid var(--wall);transition:background-color .3s;text-align:left;color:var(--ink);background:transparent;font:inherit;}
.room.r0{border-bottom-width:2px;}.room.r1{border-top-width:2px;}
.room.c0,.room.c1{border-right-width:2px;}
.room.r0::after,.room.r1::after{content:"";position:absolute;width:30px;height:2px;background:var(--floor);}
.room.r0::after{left:22px;bottom:-2px;}.room.r1::after{left:64px;top:-2px;}
.room:hover,.room:focus-visible{background-color:color-mix(in srgb,var(--k) 7%,transparent);}
.room.live{background-image:radial-gradient(120% 80% at 70% 100%,color-mix(in srgb,var(--k) 16%,transparent),transparent 70%);}
.room.live .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 70% 85%,color-mix(in srgb,var(--k) 18%,transparent),transparent 70%);animation:breathe 3.2s ease-in-out infinite;}
@keyframes breathe{50%{opacity:.35;}}
.room .rh{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:750;min-height:20px;}
.room .rnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.room .rh i{width:8px;height:8px;border-radius:2px;background:var(--k);flex:none;}
.room .rh .tag{margin-left:auto;letter-spacing:0;text-transform:none;}
.room .rn{display:block;font-size:14px;font-weight:720;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;}
.room .rt{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;}
.room .rt .face{display:inline-grid;vertical-align:-5px;margin-right:5px;}
.room .rt .face{width:18px;height:18px;}
.room .rt .cc-av.face{font-size:7px;}
.spots{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px;position:relative;}
.spot{width:12px;height:12px;border-radius:50%;background:var(--spot);transition:background-color .35s,box-shadow .35s;}
.spot.bk{background:transparent;box-shadow:inset 0 0 0 1.6px color-mix(in srgb,var(--k) 75%,transparent);}
.spot.in{background:var(--k);box-shadow:0 0 9px color-mix(in srgb,var(--k) 55%,transparent);}
.spot.wl{background:transparent;box-shadow:inset 0 0 0 1.4px var(--coral);opacity:.8;border-radius:3px;transform:scale(.85);}
.spot.pop{animation:spotPop .7s cubic-bezier(.3,1.7,.5,1);}
.spot.ent{animation:spotIn .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--d) * 22ms + 200ms);}
@keyframes spotPop{0%{transform:scale(.2);}55%{transform:scale(1.7);}100%{transform:scale(1);}}
@keyframes spotIn{from{transform:scale(0);opacity:0;}}
.room .rf{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:5px;position:relative;white-space:nowrap;}
.room .rf b{color:var(--ink);font-variant-numeric:tabular-nums;}
.room .rf .w{color:var(--coral);font-weight:700;}
.corr{grid-column:1 / -1;position:relative;display:flex;align-items:center;gap:10px;padding:0 12px 0 0;font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:750;}
.corr .door{display:flex;align-items:center;gap:7px;height:100%;padding:0 12px;color:var(--lime-tx);background:linear-gradient(90deg,var(--lime-bg),transparent);}
.corr .door .ic{width:14px;height:14px;}
.corr .lane{flex:1;height:0;border-top:1px dashed var(--line-2);}
.corr .cnt{color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums;}
.open-gym{position:relative;overflow:hidden;}
.open-gym .og{position:absolute;inset:72px 14px 26px 14px;}
.og i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.75;animation:drift var(--t,9s) ease-in-out infinite alternate;animation-delay:var(--dl,0s);}
.og i.new{background:var(--lime);box-shadow:0 0 10px var(--lime);opacity:1;}
@keyframes drift{0%{transform:translate(0,0);}33%{transform:translate(var(--x1),var(--y1));}66%{transform:translate(var(--x2),var(--y2));}100%{transform:translate(var(--x1),calc(var(--y2) * -1));}}
.open-gym .eq{position:absolute;border:1px solid var(--line-2);border-radius:4px;opacity:.6;}
.runner{position:absolute;left:0;top:0;z-index:4;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 25%,transparent),0 0 16px var(--lime);pointer-events:none;}
.floor-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--muted);align-items:center;}
.floor-legend span{display:inline-flex;align-items:center;gap:6px;}
.floor-legend .spot{--k:var(--lime);}
/* ---------- Signature: heart-rate zones ---------- */
.hr-top{display:flex;align-items:center;gap:10px;}
.hr-top .who b{font-size:13.5px;}
.hr-clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:750;font-size:15px;line-height:1.1;}
.hr-clock small{display:block;color:var(--muted);font-size:10.5px;font-weight:600;}
.prog{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:9px 0 10px;}
.prog i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--z2),var(--z3),var(--z4),var(--z5));transition:width 1.2s linear;}
.zmix{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;height:58px;align-items:end;}
.big .zmix{height:84px;grid-template-columns:repeat(5,minmax(0,120px));justify-content:center;gap:18px;}
.big .zl{grid-template-columns:repeat(5,minmax(0,120px));justify-content:center;gap:18px;}
.zmix div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:3px;}
.zmix b{font-size:11px;text-align:center;font-variant-numeric:tabular-nums;}
.zmix i{display:block;border-radius:6px 6px 2px 2px;background:var(--z);height:3%;min-height:3px;transition:height .9s cubic-bezier(.3,1.1,.4,1);box-shadow:0 0 14px -4px var(--z);transform-origin:50% 100%;animation:zGrow .9s .15s cubic-bezier(.3,1.1,.4,1) both;}
@keyframes zGrow{from{transform:scaleY(0);}}
.zl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:10px;color:var(--muted);text-align:center;margin:5px 0 10px;font-weight:650;letter-spacing:.02em;}
.hr-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.hr-row{display:grid;grid-template-columns:26px minmax(0,1fr) 44px;gap:9px;align-items:center;}
.hr-row .face{width:26px;height:26px;}
.hr-row .nm{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;}
.hr-row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hr-row .nm em{font-style:normal;color:var(--muted);font-weight:600;font-size:11px;font-variant-numeric:tabular-nums;}
.zbar{position:relative;height:7px;border-radius:4px;margin-top:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--z1) 22%,transparent) 0 20%,color-mix(in srgb,var(--z2) 22%,transparent) 20% 40%,color-mix(in srgb,var(--z3) 22%,transparent) 40% 60%,color-mix(in srgb,var(--z4) 22%,transparent) 60% 80%,color-mix(in srgb,var(--z5) 22%,transparent) 80% 100%);}
.zbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--z,var(--z3));transition:width 1.3s cubic-bezier(.3,1,.4,1),background-color .5s;box-shadow:0 0 10px -2px var(--z,var(--z3));}
.zbar i::after{content:"";position:absolute;right:-2px;top:-3px;width:4px;height:13px;border-radius:2px;background:var(--ink);}
.bpm{text-align:right;font-weight:780;font-variant-numeric:tabular-nums;font-size:15px;line-height:1;}
.bpm small{display:block;font-size:9.5px;color:var(--muted);font-weight:650;margin-top:2px;letter-spacing:.04em;}
.bpm.beat{animation:beat .45s;}
@keyframes beat{30%{transform:scale(1.12);color:var(--coral);}}
.tiz{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:3px;gap:1px;}
.tiz i{display:block;height:100%;background:var(--z);transition:flex-grow 1s;}
/* ---------- Live feed ---------- */
.feed{list-style:none;margin:0;padding:0;overflow:hidden;}
.feed li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);border-radius:8px;}
.feed li:last-child{border-bottom:0;}
.feed li .face{width:30px;height:30px;}
.feed li.new{animation:feedIn .8s cubic-bezier(.2,.9,.3,1.1);}
@keyframes feedIn{0%{opacity:0;transform:translateY(-12px);background:var(--lime-bg);}40%{opacity:1;background:var(--lime-bg);}100%{background:transparent;}}
.feed b{font-size:12.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.feed small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;}
.feed small i{width:7px;height:7px;border-radius:2px;background:var(--k,var(--faint));flex:none;}
.feed .t{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.feed .t b{font-size:11px;color:var(--lime-tx);}
/* ---------- Class lists + schedule ---------- */
.tl{list-style:none;margin:0;padding:0;}
.tl li{display:grid;grid-template-columns:52px 4px minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.4fr) 84px;gap:12px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;transition:background .2s;}
.tl li + li{border-top:1px solid var(--line);}
.tl li:hover,.tl li:focus-visible{background:var(--surface-2);}
.tl .tm{font-weight:750;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.2;}
.tl .tm small{display:block;color:var(--muted);font-weight:500;font-size:11px;}
.tl .stripe{width:4px;height:30px;border-radius:3px;background:var(--k);}
.tl .tg{text-align:right;}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start;}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0;box-shadow:var(--shadow);}
.day.today{border-color:color-mix(in srgb,var(--lime) 50%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--lime) 22%,transparent) inset,var(--shadow);}
.day-h{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;margin-bottom:8px;border-bottom:1px solid var(--line);}
.day-h .dn{font-size:21px;font-weight:760;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;}
.day-h b{display:block;font-size:12px;}.day-h small{display:block;color:var(--muted);font-size:10.5px;}
.day.today .dn{color:var(--lime-tx);}
.cls{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--k);background:var(--surface-2);border-radius:9px;padding:6px 8px 7px;margin-bottom:6px;color:var(--ink);transition:transform .2s,border-color .2s,background .2s;}
.cls:hover,.cls:focus-visible{transform:translateY(-1px);border-color:var(--line-2);border-left-color:var(--k);background:var(--surface-3);}
.cls .ct{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:650;}
.cls b{display:block;font-size:12.5px;margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cls .cm{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cls .cap{margin-top:5px;font-size:10.5px;gap:6px;}
.cls .cap .bar{height:5px;}
.cls.done{opacity:.55;}
.cls.live{box-shadow:0 0 0 1px color-mix(in srgb,var(--lime) 55%,transparent);}
.cls.off{opacity:.45;text-decoration:line-through;}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.toolbar .grow{flex:1;}
.sel{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;min-width:0;}
select.sel{padding-right:28px;}
input.sel{background:var(--surface-2);font-weight:500;}
.sel:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-bg);}
.ministats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px;}
/* ---------- Class detail ---------- */
.picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.picker button{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:650;}
.picker button i{width:7px;height:7px;border-radius:2px;background:var(--k);}
.picker button[aria-pressed="true"]{color:var(--ink);border-color:var(--k);background:color-mix(in srgb,var(--k) 10%,var(--surface));}
.picker button .tn{color:var(--ink);}
.chero{display:grid;grid-template-columns:290px minmax(0,1fr);padding:0;overflow:hidden;}
.chero .ph{position:relative;min-height:236px;background:var(--surface-3);}
.chero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.chero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,var(--surface));}
.chero .ph .tag{position:absolute;left:12px;top:12px;z-index:1;}
.chero .bd{padding:16px 18px 16px 6px;min-width:0;display:flex;flex-direction:column;gap:10px;}
.chero h2{font-size:24px;font-weight:760;letter-spacing:-.03em;line-height:1.1;}
.chero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;}
.chero .meta span{display:inline-flex;align-items:center;gap:6px;}
.chero .meta .ic{width:14px;height:14px;}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.facts div{padding:9px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);min-width:0;}
.facts b{display:block;font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.facts small{color:var(--muted);font-size:11px;white-space:nowrap;}
.hr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 22px;}
.wlist li .pos{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--coral-bg);color:var(--coral);font-weight:800;font-size:11.5px;flex:none;}
.wlist li.promo{animation:promo .9s ease;}
@keyframes promo{0%{background:var(--lime-bg);transform:translateX(0);}100%{background:transparent;transform:translateX(0);}}
.rowbtns{display:flex;gap:4px;flex:none;}
.rowbtns button{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);}
.rowbtns button:hover{color:var(--ink);border-color:var(--line-2);}
.rowbtns button .ic{width:14px;height:14px;}
.switch{position:relative;width:38px;height:22px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface-3);flex:none;padding:0;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .3s cubic-bezier(.3,1.5,.5,1),background .2s;}
.switch[aria-checked="true"]{background:var(--lime-bg);border-color:color-mix(in srgb,var(--lime) 50%,transparent);}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--lime);}
[data-theme="light"] .switch[aria-checked="true"]::after{background:var(--lime-tx);}
.scrolly{max-height:330px;overflow:auto;margin-right:-8px;padding-right:8px;}
/* ---------- Trainers ---------- */
.coaches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
.coach{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;}
.coach .ph{position:relative;aspect-ratio:16 / 10;background:var(--surface-3);overflow:hidden;}
.coach .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1);}
.coach:hover .ph img{transform:scale(1.05);}
.coach .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.55));}
.coach .ph .tag{position:absolute;left:10px;top:10px;z-index:1;background:rgba(10,10,12,.74);color:#e9e7e2;}
.coach .ph .tag.live{color:#c8f53e;}
.coach .ph .rate{position:absolute;right:10px;bottom:9px;z-index:1;color:#fff;font-weight:750;font-size:12px;display:flex;align-items:center;gap:4px;}
.coach .ph .rate .ic{width:13px;height:13px;fill:#ffd25a;stroke:#ffd25a;}
.coach .ph .nophoto{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:-.03em;color:color-mix(in srgb,var(--k) 80%,var(--ink));background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--k) 30%,transparent),transparent 60%),repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface-3) 8px 9px);}
.coach .ph.np::after{display:none;}
.coach .ph.np .rate{color:var(--ink);}
.coach .ph.np .nophoto{background:radial-gradient(circle at 75% 20%,color-mix(in srgb,var(--k) 28%,transparent),transparent 55%),radial-gradient(circle at 15% 90%,color-mix(in srgb,var(--k) 16%,transparent),transparent 50%),var(--surface-2);font-size:40px;}
.coach .bd{padding:11px 14px 13px;display:flex;flex-direction:column;gap:8px;}
.coach h3{font-size:14px;font-weight:720;letter-spacing:-.01em;}
.coach .role{color:var(--muted);font-size:11.5px;}
.kinds{display:flex;gap:5px;flex-wrap:wrap;}
.cstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.cstats div{background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0;}
.cstats b{display:block;font-size:14px;font-variant-numeric:tabular-nums;}
.cstats small{color:var(--muted);font-size:10.5px;white-space:nowrap;}
.spot-card{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);min-height:246px;}
.spot-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:85% 30%;}
.spot-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,10,.92) 30%,rgba(8,8,10,.2) 75%,transparent);}
.spot-card .bd{position:relative;z-index:1;padding:18px;color:#f4f2ee;display:flex;flex-direction:column;gap:8px;max-width:70%;justify-content:flex-end;}
.spot-card .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#c8f53e;font-weight:800;}
.spot-card h2{font-size:26px;letter-spacing:-.03em;font-weight:780;line-height:1.05;}
.spot-card p{color:rgba(244,242,238,.75);font-size:12.5px;max-width:360px;}
.spot-card .facts div{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);}
.spot-card .facts small{color:rgba(244,242,238,.65);}
/* ---------- Members / billing / retention / settings ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;white-space:nowrap;}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint));}
.vis{display:flex;align-items:center;gap:8px;}
.vis .meter{width:64px;}
.plans{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
.plan{display:flex;flex-direction:column;gap:8px;}
.plan .pp{font-size:24px;font-weight:760;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.plan .pp small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;}
.plan .ph{display:flex;align-items:center;gap:8px;}
.plan .ph i{width:10px;height:10px;border-radius:3px;background:var(--k);}
.plan .ph b{font-size:13px;}
.plan .ph .tag{margin-left:auto;}
.plan .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);}
.plan .row b{color:var(--ink);font-variant-numeric:tabular-nums;}
.money-in{color:var(--good);font-weight:700;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);}
.set-row:last-child{border-bottom:0;}
.set-row b{display:block;font-size:12.5px;font-weight:650;}
.set-row small{display:block;color:var(--muted);font-size:11.5px;}
.set-row input[type="range"]{width:160px;accent-color:var(--coral);}
.set-row output{min-width:54px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
.hours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.hours div{text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;font-size:11px;color:var(--muted);}
.hours b{display:block;color:var(--ink);font-size:12px;}
.studio-list li .sq{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none;}
.suggest{list-style:none;margin:4px 0 0;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);max-height:170px;overflow:auto;}
.suggest:empty{display:none;}
.suggest li{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:12.5px;}
.suggest li:hover,.suggest li[aria-selected="true"]{background:var(--surface-3);}
.desk-form{display:grid;gap:10px;}
.desk-form label{font-size:11.5px;font-weight:650;color:var(--muted);display:grid;gap:5px;}
.desk-form input,.desk-form select{width:100%;min-width:0;min-height:36px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;}
.desk-form input:focus,.desk-form select:focus{outline:none;border-color:var(--coral);}
.desk-form .err{color:var(--bad);font-size:11.5px;min-height:0;}
.arrive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-top:8px;}
.arrive li{padding:6px 0;}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted);}
.note .ic{width:15px;height:15px;color:var(--lime-tx);flex:none;margin-top:1px;}
.note b{color:var(--ink);}
.pick-chip{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:1px dashed var(--line-2);font-size:12.5px;}
/* Skeleton shimmer on data-heavy pages */
.sk-wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;}
.sk{border-radius:var(--radius);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-3) 50%,var(--surface) 70%) 0 0 / 300% 100%;border:1px solid var(--line);animation:shimmer 1s linear infinite;}
@keyframes shimmer{from{background-position:100% 0;}to{background-position:0 0;}}
/* Profile drawer */
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.prof h3{font-size:17px;letter-spacing:-.02em;}
.prof p{color:var(--muted);font-size:12px;}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px;}
.kv div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.kv small{display:block;color:var(--muted);font-size:11px;}
.kv b{font-size:13px;}
.dr-sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:750;margin:14px 0 6px;}
/* ---------- Responsive ---------- */
@media (max-width:1360px){.searchbtn{width:200px;}.me div{display:none;}}
@media (max-width:1280px){.tabs a{padding:9px 9px 11px;}.livechip .lc-t{display:none;}}
@media (max-width:1200px){.tabs a .ic{display:none;}.s3{grid-column:span 6;}.s4,.s5,.s7,.s8{grid-column:span 12;}.s6{grid-column:span 12;}.s9{grid-column:span 12;}.plans{grid-template-columns:repeat(3,minmax(0,1fr));}.coaches{grid-template-columns:repeat(3,minmax(0,1fr));}.week{grid-template-columns:repeat(4,minmax(0,1fr));}.searchbtn span,.searchbtn kbd{display:none;}.searchbtn{width:34px;padding:0;justify-content:center;}}
@media (max-width:900px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr));}.ministats{grid-template-columns:repeat(2,minmax(0,1fr));}.chero{grid-template-columns:1fr;}.chero .ph{min-height:180px;}.chero .ph::after{background:linear-gradient(180deg,transparent 50%,var(--surface));}.chero .bd{padding:4px 16px 16px;}.hr-grid{grid-template-columns:1fr;}.week{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:760px){
.page-h{flex-direction:column;align-items:stretch;gap:10px;}
.page-h p span{white-space:nowrap;}
.kpi.s3{grid-column:span 6;}
.card-h{flex-wrap:wrap;}
.room .rf{flex-wrap:wrap;gap:0 8px;}
.room .rh .tag{font-size:10px;padding:0 5px;}
.arrive{grid-template-columns:1fr;}
.tier{padding:8px 14px;gap:8px;}
.tier .livechip,.tier .chipbtn .lbl{display:none;}
.tabs{position:fixed;top:60px;left:10px;right:10px;z-index:45;flex-direction:column;gap:2px;padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line-2);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);transform:translateY(-10px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;max-height:calc(100vh - 80px);overflow:auto;}
.tabs a{padding:11px 12px;border-radius:10px;}
.tabs a .ic{display:inline;}
.tabs a[aria-current="page"]{background:var(--surface-2);}
.tabs .mark{display:none;}
.nav-open .tabs{transform:none;opacity:1;pointer-events:auto;}
.nav-open .scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--overlay);}
.menu-btn{display:grid;}
.me{display:none;}
main{padding:14px 14px 40px;}
.page-h h1{font-size:23px;}
.s3,.s6{grid-column:span 12;}
.grid{gap:12px;}
.plans,.coaches{grid-template-columns:repeat(2,minmax(0,1fr));}
.week,.lanes{grid-template-columns:1fr;}
.floor{grid-template-columns:1fr 1fr;grid-template-rows:auto auto 32px auto auto;height:auto;}
.floor .room{min-height:150px;border-width:0 !important;border-bottom:2px solid var(--wall) !important;}
.floor .room::before,.floor .room::after{display:none;}
.floor .room:nth-child(odd){border-right:2px solid var(--wall) !important;}
.floor .room .rh{padding-left:0;}
.floor .corr{grid-row:3;}
.tl li{grid-template-columns:46px 4px minmax(0,1fr) 70px;}
.tl li .hide-s{display:none;}
.facts{grid-template-columns:repeat(2,minmax(0,1fr));}
.spot-card .bd{max-width:100%;}
.set-row{flex-wrap:wrap;}
.hours{grid-template-columns:repeat(4,minmax(0,1fr));}
}
@media (max-width:480px){.kpi .spk{display:none;}.kpi .foot .ell{display:none;}.tier [data-theme-toggle]{display:none;}.plans,.coaches{grid-template-columns:1fr;}.ministats{grid-template-columns:1fr 1fr;}.kpi .val{font-size:23px;}.brand b{font-size:15px;}}

  <div class="tier">

<script>
/* =====================================================================
   Core helpers (shared by every Chill & Craft dashboard, inlined here)
   DOM, formatting, seeded data, router, toasts, modals, forms, tables,
   command search, timers and small SVG charts. No libraries.
   ===================================================================== */
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 9);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

/* ---------- Seeded random: the demo data is the same on every load ---------- */
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6d2b79f5;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = seeded(11);
const reseed = (n) => (R = seeded(n));
const rand = (a, b) => a + R() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (a) => a[Math.floor(R() * a.length)];

/* ---------- Number, money and date formats ---------- */

/* ---------- Toasts (announced politely to screen readers) ---------- */
function toast(msg, kind = "") {
  let box = $("#cc-toasts");
  if (!box) {
    box = document.createElement("div");
    box.id = "cc-toasts";
    box.className = "cc-toasts";
    box.setAttribute("role", "status");
    box.setAttribute("aria-live", "polite");
    document.body.appendChild(box);
  }
  const t = document.createElement("div");
  t.className = "cc-toast " + kind;
  t.innerHTML = ic(kind === "bad" ? "x" : kind === "warn" ? "bell" : "check") + "<span>" + esc(msg) + "</span>";
  box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 2800);
}

/* Confirm dialog: resolves true when the person confirms */
function confirmBox(text, ok = "Delete", kind = "danger") {
  return new Promise((res) => {
    let done = false;
    openModal({
      title: "Please confirm",
      html: `<p class="cc-confirm">${esc(text)}</p>`,
      actions: [{ label: "Cancel" }, { label: ok, kind, fn: () => { done = true; res(true); } }],
      onClose: () => { if (!done) res(false); },
    });
  });
}

/* Pick one option (keyboard friendly "Move to..." menu) */

      title,

const HR = {};

const ZN = ["Warm-up", "Easy", "Aerobic", "Threshold", "Max"];

  const off = ((hue(mid + c.id) % 13) - 6) * 0.75;

  if (f < 0.12) p = 60 + (f / 0.12) * 13;
  else if (f > 0.86) p = 79 - ((f - 0.86) / 0.14) * 17;
  else if (c.kind === "Flow") p = 63 + 5 * Math.sin((f - 0.12) * Math.PI * 3);
  else { const w = Math.sin((f - 0.12) * Math.PI * 6); p = 77 + 13 * w * w + (c.kind === "Run" ? 2 : 0); }
  return clamp(p + off, 52, 98);
}
function hrState(c) {
  if (HR[c.id]) return HR[c.id];
  const st = {}, el = clamp(nowMin() - c.m, 0, c.dur);
  c.ci.forEach((mid) => {
    const tz = [0, 0, 0, 0, 0];
    for (let t = 0; t < el; t += 1) tz[zoneOf(target(c, t / c.dur, mid))] += 1;
    const pct = el > 0 ? target(c, el / c.dur, mid) : 55;

    const x = st[mid];

  const ey = er.top - by + er.height / 2, ex = er.left - bx + 16;
  const narrow = innerWidth <= 760;

  const doorY = room.classList.contains("r0") ? rr.bottom - by - 12 : rr.top - by + 12;

  el.className = "runner";
  fl.appendChild(el);
  const T = (x, y) => ({ transform: `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)` });

/* Add a class: validates trainer skills, capacity and room clashes */

  const st = S.studio === "all" ? "canal" : S.studio;

    title: "Add a class", submit: "Add to schedule", drawer: true,
    intro: "New classes open for booking straight away. Members on the waitlist of a full class of the same kind get a message.",
    values: { name: "", kind: pre.kind || "Run", st, d: String(Math.max(TI, 0)), start: "19:45", dur: "45", tr: "jonah", cap: 16 },
    fields: [
      { name: "name", label: "Class name", required: true, placeholder: "e.g. Sunset Tread", check: (v) => (v.length < 3 ? "Use at least 3 letters" : "") },

      { name: "st", label: "Studio", type: "select", half: true, options: STUDIOS.map((s) => [s.id, studioOf(s.id).name]) },

      } },

      { name: "cap", label: "Spots", type: "number", half: true, required: true, min: 4, max: 30, check: (v, vals) => (v > roomOf(KIND[vals.kind].room).cap ? roomOf(KIND[vals.kind].room).name + " holds " + roomOf(KIND[vals.kind].room).cap : "") },

    ],

      note(`${trn(c.tr).name} is teaching a new class: ${c.name}`);
      if (current === "schedule" || current === "today") rerender();
    },
  });
}

      <form id="stForm" novalidate><div class="set-row"><div><b>Brand name</b><small>Shown in the header and on receipts</small></div><input class="sel" style="width:220px" id="brand" value="${esc(cfg.brand)}" aria-label="Brand name"></div>
      ${STUDIOS.map((s, i) => `<div class="set-row"><div style="display:flex;gap:10px;align-items:center"><span class="sq" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3)">${ic("pin")}</span><div><b>${esc(studioOf(s.id).name)}</b><small>${esc(s.area)} · ${S.members.filter((m) => m.st === s.id && m.status === "Active").length} active members</small></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="sel" style="width:150px" name="n${i}" value="${esc(studioOf(s.id).name)}" aria-label="${esc(s.name)} name"><input class="sel" style="width:120px" name="h${i}" value="${esc(studioOf(s.id).hours)}" aria-label="${esc(s.name)} opening hours"></div></div>`).join("")}
      <p class="cc-err" id="stErr" role="alert"></p><div style="display:flex;justify-content:flex-end;padding-top:10px"><button class="btn primary" type="submit">${ic("check")}Save studios</button></div></form></section>
    <section class="card s5 still"><div class="card-h"><div><h2>${ic("calendar")}Booking rules</h2><small>Applied to every studio</small></div></div>
      <div class="set-row"><div><b>Late cancel window</b><small>Cancelling later than this counts as a no-show</small></div><div style="display:flex;align-items:center;gap:8px"><input type="range" min="1" max="24" value="${cfg.late}" id="late" aria-label="Late cancel window in hours"><output id="lateO">${cfg.late} h</output></div></div>
      <div class="set-row"><div><b>No-show fee</b><small>Charged when a desk marks a no-show</small></div><div style="display:flex;align-items:center;gap:8px"><input type="range" min="0" max="30" step="1" value="${cfg.fee}" id="fee" aria-label="No-show fee in dollars"><output id="feeO">${money(cfg.fee)}</output></div></div>
      <div class="set-row"><div><b>Auto-promote the waitlist</b><small>Next person in line gets the spot and a message</small></div><button type="button" class="switch" role="switch" id="autoSw2" aria-checked="${cfg.auto}" aria-label="Auto-promote the waitlist"></button></div>
      <div class="set-row"><div><b>Booking opens</b><small>How far ahead members can book a spot</small></div><select class="sel" id="win" aria-label="Booking opens">${[3, 7, 14].map((n) => `<option value="${n}"${n === (cfg.win || 7) ? " selected" : ""}>${n} days ahead</option>`).join("")}</select></div>
      <div class="set-row"><div><b>Classes per member per day</b><small>Stops people booking spots they will not use</small></div><select class="sel" id="maxDay" aria-label="Classes per member per day">${[1, 2, 3, 4].map((n) => `<option${n === cfg.maxDay ? " selected" : ""}>${n}</option>`).join("")}</select></div></section>
  </div>
  <div class="grid" style="margin-top:14px">
    <section class="card s7 still"><div class="card-h"><div><h2>${ic("door")}Rooms</h2><small>Spots per room for classes that have not started yet</small></div></div>
      ${ROOMS.map((r) => { const cap = cfg.caps[r.id] || r.cap; return `<div class="set-row" style="--k:${KIND[r.kind].k}"><div style="display:flex;gap:10px;align-items:center">${kindTag(r.kind)}<div><b>${esc(r.name)}</b><small>${S.classes.filter((c) => c.room === r.id && !c.off).length} classes this week across all studios</small></div></div><div style="display:flex;align-items:center;gap:6px"><button class="btn sm" data-cap="${r.id}" data-dv="-1" aria-label="Fewer spots in ${esc(r.name)}">${ic("minus")}</button><b class="tn" style="min-width:56px;text-align:center">${cap} spots</b><button class="btn sm" data-cap="${r.id}" data-dv="1" aria-label="More spots in ${esc(r.name)}">${ic("plus")}</button></div></div>`; }).join("")}</section>
    <section class="card s5 still"><div class="card-h"><div><h2>${ic("bell")}Alerts</h2><small>What lands in the bell</small></div></div>
      ${sw("full", "A class fills up", "With the waitlist size")}${sw("failed", "A payment fails", "Card and direct debit")}${sw("risk", "A member goes quiet", "No visit in 14 days")}${sw("digest", "Daily summary at 21:00", "Check-ins, revenue and no-shows")}
      <div class="set-row"><div><b>Theme</b><small>Night studio or chalk paper</small></div><button class="btn sm" data-theme-toggle>${ic("moon")}Switch theme</button></div>
      <div class="set-row"><div><b>Reset demo data</b><small>Members, classes, check-ins and payments</small></div><button class="btn sm" id="reset" style="color:var(--coral)">${ic("refresh")}Reset demo data</button></div></section>
  </div>`;
  $("#late").addEventListener("input", (e) => { cfg.late = +e.target.value; $("#lateO").textContent = cfg.late + " h"; save(); });
  $("#fee").addEventListener("input", (e) => { cfg.fee = +e.target.value; $("#feeO").textContent = money(cfg.fee); save(); });
  $("#autoSw2").addEventListener("click", (e) => { cfg.auto = !cfg.auto; e.currentTarget.setAttribute("aria-checked", String(cfg.auto)); save(); toast("Auto-promote " + (cfg.auto ? "on" : "off")); });
  $("#win").addEventListener("change", (e) => { cfg.win = +e.target.value; save(); toast("Booking opens " + cfg.win + " days ahead"); });
  $("#maxDay").addEventListener("change", (e) => { cfg.maxDay = +e.target.value; save(); toast("Members can book " + cfg.maxDay + " a day"); });
  $$("[data-n]", view).forEach((b) => b.addEventListener("click", () => { cfg.notif[b.dataset.n] = !cfg.notif[b.dataset.n]; b.setAttribute("aria-checked", String(cfg.notif[b.dataset.n])); save(); }));
  $$("[data-cap]", view).forEach((b) => b.addEventListener("click", () => {
    const r = roomOf(b.dataset.cap), cur = cfg.caps[r.id] || r.cap, nx = clamp(cur + +b.dataset.dv, 4, 30);
    if (nx === cur) return toast("Rooms hold between 4 and 30 spots", "warn");
    cfg.caps[r.id] = nx;
    let n = 0; S.classes.forEach((c) => { if (c.room === r.id && status(c) === "later" && c.bk.length <= nx) { c.cap = nx; n++; } });
    save(); toast(`${r.name}: ${nx} spots on ${n} upcoming classes`); rerender();
  }));
  $("#stForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.currentTarget, brand = $("#brand").value.trim(), names = STUDIOS.map((_, i) => f.elements["n" + i].value.trim()), hours = STUDIOS.map((_, i) => f.elements["h" + i].value.trim());
    const bad = !brand ? "Add a brand name" : names.some((n) => n.length < 2) ? "Every studio needs a name" : hours.some((h) => !/^\d\d:\d\d\s*[–-]\s*\d\d:\d\d$/.test(h)) ? "Write hours like 06:00–21:30" : "";
    $("#stErr").textContent = bad;
    if (bad) { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("cc-form", "shake"); return; }
    cfg.brand = brand; cfg.names = names; cfg.hours = hours.map((h) => h.replace(/\s*[–-]\s*/, "–")); save(); drawShell(); toast("Studios saved");
  });
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data? Members, classes, check-ins and payments go back to the start.", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); for (const k in HR) delete HR[k]; save(); drawShell(); toast("Demo data reset"); render("settings", false); } }));
};

/* ---------- Start ---------- */
drawShell();
drawClock();
every(1000, drawClock);
every(3200, () => { liveTick(); });
every(1500, hrTick);
every(20000, () => { tickTimes(); drawShell(); if (current === "today") paintFloor(); });
initShell(() => pageCmds(PAGES, [
  { label: "Check in a member", icon: "scan", hint: "Front desk", run: () => { location.hash = "#/checkins"; setTimeout(() => { const q = $("#deskQ"); if (q) q.focus(); }, 520); } },
  { label: "Add a class", icon: "plus", hint: "Schedule", run: () => classForm() },
  { label: "Add a member", icon: "user", hint: "Members", run: () => memberForm() },
  { label: "Switch theme", icon: "moon", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
].concat([["all", "All studios"]].concat(STUDIOS.map((s) => [s.id, studioOf(s.id).name])).map(([id, n]) => ({ label: "Show " + n, icon: "pin", hint: "Studio", run: () => setStudio(id) })))
  .concat(S.classes.filter((c) => c.d === TI && inStudio(c.st)).map((c) => ({ label: "Class: " + c.name + " " + hm(c.m) + " · " + studioOf(c.st).name.split(" ")[0], icon: kc(c).icon, hint: status(c) === "live" ? "Live" : "Today", run: () => (location.hash = "#/class/" + c.id) })))
  .concat(S.members.slice(0, 240).map((m) => ({ label: "Member: " + m.name, icon: "user", hint: planOf(m.plan).name, run: () => memberDrawer(m) })))));
startRouter(PAGES.map((p) => p[0]), "today", render);
</script>
</body>
</html>
