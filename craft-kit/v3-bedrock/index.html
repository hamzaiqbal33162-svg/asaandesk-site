<!doctype html>
<!-- Chill & Craft · Bedrock · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedrock · mega footer with folding columns</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: rolling green hills over rich soil ---------- */
  :root {
    color-scheme: light;
    --bg: #e7efe4;
    --bg2: #d6e6d3;
    --page: #f6faf3;
    --ink: #17251c;
    --ink2: #55685a;
    --rule: #dbe6d6;
    --h1: #8fcf86;
    --h2: #5fae6a;
    --h3: #3d8a52;
    --soil: #1f3526;
    --soil2: #182b1f;
    --soil3: #2a4532;
    --ftx: #e9f3e6;
    --ftx2: #a9c2ae;
    --lime: #b6e36b;
    --clay: #d9844f;
    --seed: #8a5a2b;
    --shadow: rgba(20, 50, 30, .25);
    --focus: #b6e36b;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #08100b;
    --bg2: #12241a;
    --page: #0f1a13;
    --ink: #e6f1e7;
    --ink2: #93ab98;
    --rule: #1f3326;
    --h1: #3f7a48;
    --h2: #2e6139;
    --h3: #22492b;
    --soil: #111f16;
    --soil2: #0c1610;
    --soil3: #1b2e21;
    --ftx: #e3efe2;
    --ftx2: #8ea596;
    --lime: #c2ef77;
    --clay: #e39462;
    --seed: #a46c36;
    --shadow: rgba(0, 0, 0, .6);
    --focus: #c2ef77;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: radial-gradient(60% 50% at 20% 0%, var(--bg2), transparent 70%), var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px 14px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .site {
    position: relative;
    width: min(980px, 100%);
    max-height: calc(100vh - 36px);
    overflow-y: auto; overflow-x: hidden;
    border-radius: 28px;
    background: var(--page);
    box-shadow: 0 44px 90px -50px var(--shadow), 0 0 0 1px var(--rule);
    scrollbar-width: thin;
  }

  /* ---------- The end of the page, just above the footer ---------- */
  .cta { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 30px 34px 26px; }
  .cta h2 { margin: 0 0 4px; font-size: clamp(22px, 3.6vw, 30px); letter-spacing: -.03em; line-height: 1.12; }
  .cta p { margin: 0; color: var(--ink2); font-size: 14.5px; }
  .pill { display: inline-flex; align-items: center; gap: 9px; padding: 12px 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--page); font-weight: 750; font-size: 14.5px; transition: transform .3s var(--spring); }
  .pill:hover { transform: translateY(-2px); }
  .pill:active { transform: scale(.96); }
  .pill.ok { background: var(--h3); color: #fff; }

  /* ---------- Footer ---------- */
  .foot { position: relative; color: var(--ftx); background: linear-gradient(180deg, var(--soil), var(--soil2)); }
  .hills { position: relative; display: block; width: 100%; height: 70px; margin-bottom: -1px; background: var(--page); }
  .hills path { transform-box: fill-box; }
  .hill1 { fill: var(--h1); animation: drift 9s ease-in-out infinite; }
  .hill2 { fill: var(--h2); animation: drift 12s ease-in-out infinite reverse; }
  .hill3 { fill: var(--h3); }
  .hill4 { fill: var(--soil); }
  @keyframes drift { 50% { transform: translateX(-18px); } }
  .strata { position: absolute; inset: 70px 0 0; pointer-events: none; opacity: .5; background: repeating-linear-gradient(180deg, transparent 0 46px, rgba(255, 255, 255, .025) 46px 48px, transparent 48px 96px, rgba(0, 0, 0, .12) 96px 99px); }
  .pebble { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .06); pointer-events: none; }
  .inner { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 26px 34px; padding: 12px 34px 20px; }

  .lead b.logo { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: -.02em; }
  .lead b.logo svg { width: 30px; height: 30px; }
  .lead p { margin: 8px 0 14px; color: var(--ftx2); font-size: 13.5px; line-height: 1.55; max-width: 34ch; }
  .news label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 700; color: var(--ftx2); }
  .field { display: flex; gap: 6px; padding: 5px; border-radius: 15px; background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); }
  .field input { flex: 1; min-width: 0; padding: 8px 10px; border: 0; border-radius: 11px; background: transparent; font-size: 14px; color: var(--ftx); }
  .field input::placeholder { color: var(--ftx2); opacity: .8; }
  .field input:focus-visible { outline-offset: 0; }
  .field.bad { animation: shake .42s; box-shadow: inset 0 0 0 1.5px var(--clay); }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .plant { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border: 0; border-radius: 11px; background: var(--lime); color: #17251c; font-weight: 800; font-size: 13.5px; transition: transform .3s var(--spring), background .3s; white-space: nowrap; }
  .plant:active { transform: scale(.94); }
  .plant.done { background: #7fd28a; }
  .msg { min-height: 1.4em; margin: 7px 2px 0; font-size: 12.5px; color: var(--ftx2); }
  .msg.good { color: var(--lime); }
  .bed { position: relative; height: 54px; margin-top: 4px; border-radius: 12px; overflow: hidden; background: radial-gradient(circle at 20% 80%, rgba(255, 255, 255, .05) 0 2px, transparent 3px) 0 0 / 14px 12px, linear-gradient(180deg, transparent 0 34px, var(--soil3) 34px); }
  .bed::after { content: ""; position: absolute; left: 0; right: 0; top: 33px; height: 3px; background: repeating-linear-gradient(90deg, var(--seed) 0 6px, transparent 6px 9px); opacity: .55; }
  .bed small { position: absolute; right: 8px; bottom: 3px; font-size: 10.5px; color: var(--ftx2); }
  .sprout { position: absolute; bottom: 18px; width: 30px; height: 40px; overflow: visible; }
  .sprout .stem { fill: none; stroke: var(--lime); stroke-width: 2.6; stroke-linecap: round; }
  .sprout .lf { fill: var(--lime); transform-box: fill-box; }
  .sprout .lf.l { transform-origin: 100% 100%; }
  .sprout .lf.r { transform-origin: 0 100%; }
  .sprout.idle { animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 50% { transform: rotate(4deg); } }
  .seedball { position: absolute; left: 0; top: 0; z-index: 40; width: 10px; height: 7px; border-radius: 50%; background: var(--seed); box-shadow: inset -2px -1px 0 rgba(0, 0, 0, .25); pointer-events: none; }
  .dirt { position: absolute; z-index: 40; width: 5px; height: 5px; border-radius: 50%; background: var(--seed); pointer-events: none; }

  .cols-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .cols-head small { font-size: 12px; color: var(--ftx2); letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
  .all { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--ftx); font-size: 12.5px; font-weight: 700; transition: background .25s; }
  .all:hover { background: rgba(255, 255, 255, .14); }
  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 18px; align-items: start; }
  .col { border-top: 2px solid rgba(255, 255, 255, .1); }
  .col h3 { margin: 0; }
  .colh { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 11px 2px 9px; border: 0; background: none; font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; color: var(--ftx); text-align: left; }
  .colh .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
  .colh span { display: inline-flex; align-items: center; }
  .colh svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s var(--spring); opacity: .7; }
  .col.closed .colh svg { transform: rotate(-90deg); }
  .colw { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .55s cubic-bezier(.3, .8, .3, 1); }
  .col.closed .colw { grid-template-rows: 0fr; }
  .colw ul { min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 0 0 6px; }
  .colw li { transition: opacity .35s, transform .5s var(--spring); transition-delay: calc(var(--i) * 45ms); }
  .col.closed li { opacity: 0; transform: translateY(-12px) scale(.96); transition-delay: calc((4 - var(--i)) * 28ms); }
  .colw a {
    display: inline-block; padding: 5px 0; font-size: 13.5px; color: var(--ftx2); text-decoration: none;
    background: linear-gradient(var(--lime), var(--lime)) 0 100% / 0 2px no-repeat;
    transition: color .25s, background-size .4s cubic-bezier(.3, .8, .3, 1);
  }
  .colw a:hover, .colw a:focus-visible { color: var(--ftx); background-size: 100% 2px; }
  .new { margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--clay); color: #fff; font-size: 10.5px; font-weight: 800; vertical-align: 1px; }

  /* ---------- Base strip: worm tunnel, small print, back to top ---------- */
  .base { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 34px 18px; border-top: 1px solid rgba(255, 255, 255, .08); font-size: 12.5px; color: var(--ftx2); overflow: hidden; }
  .base > span:not(.worm), .base nav { position: relative; z-index: 1; text-shadow: 0 0 6px var(--soil2), 0 0 2px var(--soil2); }
  .base nav { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .base .top { z-index: 1; }
  .base nav a { text-decoration: none; }
  .base nav a:hover { color: var(--ftx); }
  .tunnel { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; opacity: .5; }
  .tunnel path { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 9; stroke-linecap: round; }
  .worm { position: absolute; left: 0; top: 0; width: 8px; height: 8px; border-radius: 50%; background: #e7a1a0; offset-path: path("M -20 40 C 120 10 220 60 360 34 S 600 10 760 40 S 980 20 1100 36"); offset-rotate: 0deg; animation: crawl 26s linear infinite; pointer-events: none; opacity: .85; }
  @keyframes crawl { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  .top {
    position: relative; display: inline-flex; align-items: center; gap: 8px; overflow: hidden;
    padding: 8px 14px 8px 8px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .09); color: var(--ftx); font-weight: 750; font-size: 13px;
    transition: transform .3s var(--spring), background .25s;
  }
  .top:hover { background: rgba(255, 255, 255, .15); }
  .top .pod { position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: #17251c; }
  .top .pod svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .leafbit { position: absolute; z-index: 40; width: 9px; height: 6px; border-radius: 0 100% 0 100%; background: var(--lime); pointer-events: none; }
  .toast { position: absolute; left: 50%; bottom: 74px; z-index: 50; padding: 9px 14px; border-radius: 12px; background: var(--ink); color: var(--page); font-size: 13px; font-weight: 650; box-shadow: 0 16px 30px -16px rgba(0, 0, 0, .5); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: opacity .3s, transform .45s var(--spring); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    .inner { grid-template-columns: 1fr; padding: 8px 18px 14px; }
    .cols { grid-template-columns: 1fr; gap: 0; }
    .cta { padding: 22px 18px; }
    .base { padding: 14px 18px 16px; }
    .site { border-radius: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="site" id="site">
    <section class="cta" id="pageTop" aria-labelledby="ctaH">
      <div>
        <h2 id="ctaH">Ready for a greener balcony?</h2>
        <p>Plants, pots and care plans, delivered across Islamabad and Rawalpindi.</p>
      </div>
      <button class="pill" id="planBtn" type="button">Start a plant plan</button>
    </section>

    <footer class="foot" id="foot">
      <svg class="hills" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-hidden="true">
        <path class="hill1" d="M-40 46 C 80 10 200 12 320 34 S 560 60 700 26 S 920 6 1040 30 V 70 H -40 Z"/>
        <path class="hill2" d="M-40 54 C 120 30 260 40 380 52 S 620 30 760 44 S 940 58 1040 40 V 70 H -40 Z"/>
        <path class="hill3" d="M-10 62 C 140 50 300 58 460 60 S 760 50 1010 58 V 70 H -10 Z"/>
        <path class="hill4" d="M0 68 H 1000 V 70 H 0 Z"/>
      </svg>
      <div class="strata" aria-hidden="true"></div>
      <span class="pebble" style="width:14px;height:9px;left:6%;top:180px" aria-hidden="true"></span>
      <span class="pebble" style="width:9px;height:6px;left:44%;top:120px" aria-hidden="true"></span>
      <span class="pebble" style="width:18px;height:11px;right:8%;top:240px" aria-hidden="true"></span>

      <div class="inner">
        <div class="lead">
          <b class="logo"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="var(--lime)"/><path d="M15 24V13" stroke="#17251c" stroke-width="2.4" stroke-linecap="round"/><path d="M15 15c-5 0-7-3-7-7 5 0 7 3 7 7Zm0 0c4 0 6-2 6-6-4 0-6 2-6 6Z" fill="#17251c"/></svg>Greenrow</b>
          <p>A plant nursery that lives online. Healthy plants, honest care advice and pots made by potters in Gujrat.</p>
          <form class="news" id="news" novalidate>
            <label for="email">Plant your email: one useful letter a month</label>
            <div class="field" id="field">
              <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-describedby="msg">
              <button class="plant" id="plantBtn" type="submit">Plant it</button>
            </div>
            <p class="msg" id="msg" aria-live="polite"></p>
          </form>
          <div class="bed" id="bed" aria-hidden="true"><small id="count">0 seeds planted</small></div>
        </div>

        <nav aria-label="Site map">
          <div class="cols-head"><small>Explore</small><button class="all" id="allBtn" type="button" aria-pressed="false">Fold all</button></div>
          <div class="cols" id="cols"></div>
        </nav>
      </div>

      <div class="base">
        <svg class="tunnel" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"><path d="M -20 40 C 120 10 220 60 360 34 S 600 10 760 40 S 980 20 1100 36"/></svg>
        <span class="worm" aria-hidden="true"></span><span class="worm" style="animation-delay:-.35s;width:7px;height:7px" aria-hidden="true"></span><span class="worm" style="animation-delay:-.7s;width:6px;height:6px" aria-hidden="true"></span>
        <span>© 2026 Greenrow, Islamabad</span>
        <nav aria-label="Legal"><a href="#privacy">Privacy</a><a href="#terms">Terms</a><a href="#cookies">Cookies</a></nav>
        <button class="top" id="topBtn" type="button"><span class="pod"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M3 6l4-4 4 4"/></svg></span>Back to top</button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </footer>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </div>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 40); };
  const site = $("#site");
  const narrow = () => matchMedia("(max-width: 760px)").matches;

  // ---------- Footer columns ----------
  const COLS = [
    { name: "Shop", c: "#b6e36b", links: ["Indoor plants", "Balcony kits", "Seeds and bulbs", "Pots and planters", "Gift cards"], fresh: 1 },
    { name: "Learn", c: "#7fd2c4", links: ["Plant care guides", "Watering calendar", "Pest helpline", "Video lessons", "Glossary"], fresh: 1 },
    { name: "Company", c: "#f2c46b", links: ["Our story", "Nurseries we work with", "Careers", "Press", "Sustainability"], fresh: -1 },
    { name: "Help", c: "#e39462", links: ["Delivery areas", "Returns", "Track an order", "Contact us", "Questions"], fresh: -1 }
  ];
  const colsEl = $("#cols");
  const slug = (s) => s.toLowerCase().replace(/[^a-z]+/g, "-");
  const cols = COLS.map((c, k) => {
    const el = document.createElement("div");
    el.className = "col";
    el.style.setProperty("--c", c.c);
    el.innerHTML = '<h3><button class="colh" type="button" aria-expanded="true" aria-controls="cw' + k + '"><span><i class="dot" aria-hidden="true"></i>' + c.name + '</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></h3>' +
      '<div class="colw" id="cw' + k + '"><ul>' + c.links.map((l, i) => '<li style="--i:' + i + '"><a href="#' + slug(l) + '">' + l + "</a>" + (i === c.fresh ? '<span class="new">New</span>' : "") + "</li>").join("") + "</ul></div>";
    colsEl.appendChild(el);
    return el;
  });
  function setCol(k, open) {
    const el = cols[k], b = el.querySelector(".colh");
    el.classList.toggle("closed", !open);
    b.setAttribute("aria-expanded", String(open));
    el.querySelector(".colw").inert = !open;
  }
  const isOpen = (k) => !cols[k].classList.contains("closed");
  function syncAll() {
    const anyOpen = cols.some((_, k) => isOpen(k));
    const b = $("#allBtn");
    b.textContent = anyOpen ? "Fold all" : "Unfold all";
    b.setAttribute("aria-pressed", String(!anyOpen));
  }
  cols.forEach((el, k) => el.querySelector(".colh").addEventListener("click", () => {
    const open = !isOpen(k);
    if (open && narrow()) cols.forEach((_, j) => { if (j !== k) setCol(j, false); }); // phones: one open at a time
    setCol(k, open);
    syncAll();
    say(COLS[k].name + (open ? " opened" : " folded"));
  }));
  $("#allBtn").addEventListener("click", async () => {
    const fold = cols.some((_, k) => isOpen(k));
    for (let k = 0; k < cols.length; k++) {
      if (fold) setCol(k, false);
      else if (!narrow() || k === 0) setCol(k, true);
      if (!reduce) await sleep(90);
    }
    syncAll();
    say(fold ? "All columns folded" : "Columns unfolded");
  });

  // ---------- Toast for the demo links ----------
  const toast = $("#toast");
  let toastT = 0;
  function showToast(t) {
    toast.textContent = t;
    toast.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(() => toast.classList.remove("on"), 1900);
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href^='#']");
    if (!a) return;
    e.preventDefault();
    showToast("“" + a.textContent.replace("New", "").trim() + "” would open here");
  });

  // ---------- Newsletter: the email becomes a seed that sprouts in the bed ----------
  const bed = $("#bed"), field = $("#field"), msg = $("#msg"), email = $("#email"), plantBtn = $("#plantBtn");
  let planted = 0;
  const SLOTS = [.12, .3, .48, .66, .84];
  function sproutAt(px, grow) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 30 40");
    s.setAttribute("class", "sprout");
    s.style.left = (px - 15) + "px";
    s.innerHTML = '<path class="stem" d="M15 40 C 15 30 14 22 15 13"/><path class="lf l" d="M15 16 C 9 16 4 12 4 6 C 10 6 15 10 15 16 Z"/><path class="lf r" d="M15 13 C 20 13 25 9 25 3 C 19 3 15 7 15 13 Z"/>';
    bed.appendChild(s);
    if (!grow || reduce) { s.classList.add("idle"); return s; }
    const stem = s.querySelector(".stem"), len = stem.getTotalLength();
    stem.style.strokeDasharray = len; stem.style.strokeDashoffset = len;
    stem.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 620, easing: "cubic-bezier(.3,.7,.3,1)", fill: "forwards" });
    s.querySelectorAll(".lf").forEach((l, i) => l.animate([{ transform: "scale(0)" }, { transform: "scale(1.25)", offset: .7 }, { transform: "scale(1)" }], { duration: 560, delay: 420 + i * 140, easing: "cubic-bezier(.3,.8,.4,1)", fill: "backwards" }));
    setTimeout(() => s.classList.add("idle"), 1300);
    return s;
  }
  function burst(x, y, cls, n, up) {
    if (reduce) return;
    const fr = $("#foot").getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const d = document.createElement("i");
      d.className = cls;
      d.style.left = (x - fr.left) + "px"; d.style.top = (y - fr.top) + "px";
      $("#foot").appendChild(d);
      const a = up ? -Math.PI / 2 + (Math.random() - .5) * 1.8 : Math.PI + Math.random() * Math.PI, v = 20 + Math.random() * 30;
      d.animate([{ transform: "translate(-50%,-50%) rotate(0)", opacity: 1 }, { transform: "translate(" + (Math.cos(a) * v) + "px," + (Math.sin(a) * v + (up ? 0 : 6)) + "px) rotate(" + (Math.random() * 360) + "deg)", opacity: 0 }], { duration: 600 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => d.remove();
    }
  }
  async function plantEmail() {
    const v = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      field.classList.remove("bad"); void field.offsetWidth; field.classList.add("bad");
      msg.className = "msg"; msg.textContent = "Please enter a full email, like you@example.com.";
      return false;
    }
    if (plantBtn.disabled) return false;
    plantBtn.disabled = true; plantBtn.textContent = "Planting…";
    msg.className = "msg"; msg.textContent = "";
    const slot = SLOTS[planted % SLOTS.length], br = bed.getBoundingClientRect(), fr = $("#foot").getBoundingClientRect(), pb = plantBtn.getBoundingClientRect();
    const tx = br.left + br.width * slot, ty = br.top + 34;
    if (planted >= SLOTS.length) { const old = bed.querySelectorAll(".sprout")[0]; if (old) old.remove(); }
    if (!reduce) {
      // the seed arcs from the button down into the soil
      const seed = document.createElement("i");
      seed.className = "seedball";
      $("#foot").appendChild(seed);
      const x0 = pb.left + pb.width / 2 - fr.left, y0 = pb.top + pb.height / 2 - fr.top, x1 = tx - fr.left, y1 = ty - fr.top;
      const frames = [];
      for (let i = 0; i <= 10; i++) { const t = i / 10; frames.push({ transform: "translate(" + (x0 + (x1 - x0) * t - 5) + "px," + (y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * 60 - 3) + "px) rotate(" + t * 540 + "deg)" }); }
      await seed.animate(frames, { duration: 760, easing: "cubic-bezier(.4,0,.6,1)" }).finished.catch(() => {});
      seed.remove();
      burst(tx, ty, "dirt", 8, false);
    }
    sproutAt(br.width * slot, true);
    planted++;
    $("#count").textContent = planted + (planted === 1 ? " seed planted" : " seeds planted");
    if (!reduce) setTimeout(() => burst(tx, ty - 26, "leafbit", 7, true), 900);
    await sleep(reduce ? 0 : 700);
    plantBtn.textContent = "Planted ✓"; plantBtn.classList.add("done");
    msg.className = "msg good"; msg.textContent = "You are planted. The first letter arrives on Friday.";
    email.value = "";
    setTimeout(() => { plantBtn.disabled = false; plantBtn.textContent = "Plant it"; plantBtn.classList.remove("done"); }, 2600);
    return true;
  }
  $("#news").addEventListener("submit", (e) => { e.preventDefault(); plantEmail(); });
  email.addEventListener("input", () => field.classList.remove("bad"));

  // ---------- Small extras: the plan button, back to top ----------
  $("#planBtn").addEventListener("click", (e) => {
    const b = e.currentTarget;
    b.classList.toggle("ok");
    b.textContent = b.classList.contains("ok") ? "Plan started ✓" : "Start a plant plan";
    say(b.textContent);
  });
  function scrollSite(to, ms) {
    const from = site.scrollTop, t0 = performance.now();
    if (reduce || Math.abs(to - from) < 2) { site.scrollTop = to; return Promise.resolve(); }
    return new Promise((res) => {
      const step = (now) => {
        const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        site.scrollTop = from + (to - from) * e;
        if (t < 1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
  }
  $("#topBtn").addEventListener("click", async (e) => {
    const b = e.currentTarget, pod = b.querySelector(".pod svg"); // keep elements before any await
    if (!reduce) {
      const r = b.querySelector(".pod").getBoundingClientRect();
      pod.animate([{ transform: "none" }, { transform: "translateY(3px)", offset: .2 }, { transform: "translateY(-40px)", opacity: 0, offset: .6 }, { transform: "translateY(20px)", opacity: 0, offset: .61 }, { transform: "none", opacity: 1 }], { duration: 1100, easing: "cubic-bezier(.3,.7,.4,1)" });
      setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2, "leafbit", 9, true), 200);
    }
    say("Back to the top of the page");
    await scrollSite(0, 700);
    $("#planBtn").focus({ preventScroll: true });
  });

  // ---------- Start: hills rise, columns grow in, first sprouts ----------
  if (!reduce) {
    document.querySelectorAll(".hills path").forEach((p, i) => p.animate([{ transform: "translateY(" + (26 - i * 6) + "px)" }, { transform: "none" }], { duration: 900, delay: i * 90, easing: "cubic-bezier(.3,.9,.3,1.1)", fill: "backwards", composite: "add" }));
    [$(".lead"), ...cols].forEach((el, i) => el.animate([{ transform: "translateY(22px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 640, delay: 200 + i * 90, easing: "cubic-bezier(.34,1.4,.64,1)", fill: "backwards" }));
  }
  if (narrow()) cols.forEach((_, k) => setCol(k, k === 0));
  syncAll();
  setTimeout(() => { sproutAt(bed.clientWidth * SLOTS[0], true); planted = 1; $("#count").textContent = "1 seed planted"; }, reduce ? 0 : 900);
  // on short screens, glide down so the footer is in view
  setTimeout(() => { if (site.scrollHeight > site.clientHeight + 20) scrollSite(site.scrollHeight - site.clientHeight, 900); }, reduce ? 0 : 450);

  // ---------- Auto demo: fold and unfold the columns, plant an email, until you touch anything ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  async function typeIn(text) {
    email.value = "";
    for (const ch of text) { if (!demo) return false; email.value += ch; await sleep(55); }
    return true;
  }
  (async () => {
    await sleep(2200);
    const names = ["ayesha@example.com", "bilal.raza@example.com", "sana@example.com"];
    let k = 0;
    while (demo) {
      if (narrow()) {
        for (let j = 1; j <= cols.length && demo; j++) { const n = j % cols.length; cols.forEach((_, q) => setCol(q, q === n)); syncAll(); await sleep(1300); }
      } else {
        for (let j = 0; j < cols.length && demo; j++) { setCol(j, false); syncAll(); await sleep(110); }
        await sleep(900);
        for (let j = cols.length - 1; j >= 0 && demo; j--) { setCol(j, true); syncAll(); await sleep(150); }
      }
      if (!demo) break;
      await sleep(1400);
      if (await typeIn(names[k++ % names.length]) && demo) { await sleep(300); await plantEmail(); }
      await sleep(3000);
    }
  })();
})();
</script>
</body>
