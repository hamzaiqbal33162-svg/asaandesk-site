<head>

<title>Pile Up · bulk delete for list rows</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    color-scheme: light;
    --bg: #e4f1ee;
    --bg2: #d3e9e4;
    --stripe: rgba(15, 120, 105, .055);
    --panel: #ffffff;
    --line: #e2eeeb;
    --ink: #0f2f2a;
    --muted: #5b7872;
    --box: #b7cdc8;
    --accent: #0d9b8b;
    --accent-soft: #e0f5f1;
    --danger: #f0573c;
    --bar: #0f2b27;
    --bar-ink: #eafaf6;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #091513;
    --bg2: #0d1f1c;
    --stripe: rgba(80, 220, 200, .04);
    --panel: #10201e;
    --line: #1b3330;
    --ink: #e2f4f0;
    --muted: #8eb0a9;
    --box: #3a5a54;
    --accent: #2dd4bf;
    --accent-soft: #123430;
    --danger: #ff6b50;
    --bar: #1b3d38;
    --bar-ink: #eafaf6;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  /* ---------- Stage: soft mint with fine diagonal lines ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    background:
      repeating-linear-gradient(135deg, var(--stripe) 0 1px, transparent 1px 14px),
      radial-gradient(800px 520px at 50% 30%, var(--bg), var(--bg2));
    background-color: var(--bg2);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px; width: 100%; }

  /* ---------- Panel ---------- */
  .panel {
    position: relative;
    width: min(440px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 34px 60px -38px rgba(10, 70, 60, .55), 0 2px 6px -2px rgba(10, 70, 60, .08);
  }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 17px; font-weight: 760; }
  .store { margin-left: auto; display: grid; gap: 5px; justify-items: end; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter { width: 120px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 78%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), #f59e0b 80%, var(--danger)); background-size: 120px 100%; transition: width .9s var(--spring); }

  /* checkbox: a real input, drawn as a rounded box with a drawing tick */
  .cbw { position: relative; flex: none; width: 20px; height: 20px; }
  .cb { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--box); display: grid; place-items: center; pointer-events: none; transition: background-color .2s, border-color .2s, transform .35s var(--spring); }
  .box svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .box .tk { stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .26s .04s ease-out; }
  .box .ds { opacity: 0; }
  .cb:checked + .box, .cb:indeterminate + .box { background: var(--accent); border-color: var(--accent); }
  .cb:checked + .box .tk { stroke-dashoffset: 0; }
  .cb:indeterminate + .box .ds { opacity: 1; }
  .cb:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cb:active + .box { transform: scale(.85); }

  ul { list-style: none; margin: 0; padding: 4px 0; }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 0 16px;
    overflow: hidden;
    cursor: pointer;
    transition: background-color .2s;
  }
  .row:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
  .row::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); transform: scaleY(0); transition: transform .35s var(--spring); }
  .row.on { background: var(--accent-soft); }
  .row.on::before { transform: scaleY(1); }
  .row.on .box { animation: pop .38s var(--spring); }
  .row.hollow > * { visibility: hidden; }
  .row.hollow { background: transparent; }

  .ficon { position: relative; flex: none; width: 30px; height: 36px; border-radius: 6px; background: var(--c); clip-path: polygon(0 0, 68% 0, 100% 27%, 100% 100%, 0 100%); }
  .ficon::after { content: ""; position: absolute; right: 0; top: 0; width: 32%; height: 27%; background: rgba(255, 255, 255, .5); border-bottom-left-radius: 4px; }
  .ficon b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 8px; font-weight: 800; color: #fff; letter-spacing: .04em; }
  .fname { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .fname b { font-size: 14px; font-weight: 640; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fname span { font-size: 12px; color: var(--muted); }
  .fsize { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .empty { display: none; padding: 34px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty.show { display: block; }
  .empty button { margin-top: 10px; }

  /* ---------- Footer with the sliding action bar ---------- */
  .foot { position: relative; height: 66px; border-top: 1px solid var(--line); overflow: hidden; }
  .note { margin: 0; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
  kbd { font: inherit; font-size: 11.5px; padding: 1px 6px; margin: 0 3px; border-radius: 6px; border: 1px solid var(--line); }
  .bar {
    position: absolute;
    inset: 8px;
    border-radius: 15px;
    background: var(--bar);
    color: var(--bar-ink);
    transform: translateY(130%);
    transition: transform .55s var(--spring);
    box-shadow: 0 12px 24px -14px rgba(5, 40, 35, .8);
  }
  .bar:not([data-mode="hidden"]) { transform: none; }
  .mode { position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; transition: opacity .25s, transform .45s var(--spring); }
  .bar[data-mode="done"] .m-sel, .bar:not([data-mode="done"]) .m-done { opacity: 0; pointer-events: none; }
  .bar[data-mode="done"] .m-sel { transform: translateY(-14px); }
  .bar:not([data-mode="done"]) .m-done { transform: translateY(14px); }
  .cnt { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .cnt b { display: inline-block; min-width: .7em; font-variant-numeric: tabular-nums; }
  .size { font-size: 12.5px; opacity: .7; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sp { flex: 1; }
  .clear, .undo { height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .1); color: inherit; font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer; transition: background-color .2s, transform .3s var(--spring); }
  .clear:hover, .undo:hover { background: rgba(255, 255, 255, .18); transform: translateY(-1px); }
  .undo { background: var(--accent); color: #062521; font-weight: 750; }
  .undo:hover { background: var(--accent); filter: brightness(1.1); }
  .go {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 14px 0 11px;
    border: 0;
    border-radius: 11px;
    background: var(--danger);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 740;
    cursor: pointer;
    box-shadow: 0 10px 20px -10px var(--danger);
    transition: transform .3s var(--spring), filter .2s;
  }
  .go:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .go .lid { transform-box: fill-box; transform-origin: 0 100%; transition: transform .35s var(--spring); }
  .go:hover .lid { transform: translateY(-1px) rotate(-22deg); }
  .go.open .lid { transform: translateY(-2px) rotate(-75deg); }
  .clear:focus-visible, .undo:focus-visible, .go:focus-visible, .empty button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .doneic { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .doneic svg { width: 13px; height: 13px; fill: none; stroke: #062521; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .dtext { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .life { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; border-radius: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: .7; }

  /* ---------- Flying tiles ---------- */
  .tile { position: fixed; z-index: 30; overflow: hidden; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 26px -14px rgba(5, 50, 45, .55); }
  .tile .g-row { position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 47px; white-space: nowrap; font-size: 14px; font-weight: 640; color: var(--ink); }
  .tile .g-tile { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; }
  .tile .g-tile .ficon { transform: scale(.82); }
  .bit { position: fixed; z-index: 40; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; pointer-events: none; }

  .hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; max-width: 420px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="panel" aria-labelledby="title">
    <div class="head">
      <div class="cbw"><input class="cb" id="all" type="checkbox" aria-label="Select all files"><span class="box"><svg viewBox="0 0 14 14"><path class="tk" d="M2.5 7.4l3 3 6-6.5" /><path class="ds" d="M3 7h8" /></svg></span></div>
      <h1 id="title">Downloads</h1>
      <div class="store"><span id="used">7.8 GB of 10 GB used</span><span class="meter" aria-hidden="true"><i id="meter"></i></span></div>
    </div>
    <ul id="list" aria-label="Files"></ul>
    <div class="empty" id="empty">All clean. Nothing left in Downloads.<br><button class="undo" id="refill" type="button">Bring the files back</button></div>
    <div class="foot">
      <p class="note">Tick files to clean up · <kbd>Esc</kbd> clears · <kbd>Del</kbd> deletes</p>
      <div class="bar" id="bar" data-mode="hidden" inert>
        <div class="mode m-sel">
          <span class="cnt"><b id="nsel">0</b> selected</span>
          <span class="size" id="ssel">0 MB</span>
          <span class="sp"></span>
          <button class="clear" id="clear" type="button">Clear</button>
          <button class="go" id="go" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><g class="lid"><path d="M3.5 5.5h13" /><path d="M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5" /></g><path d="M5.2 5.5l.8 10.6a1.6 1.6 0 0 0 1.6 1.5h4.8a1.6 1.6 0 0 0 1.6-1.5l.8-10.6" /></svg>
            <span>Delete</span>
          </button>
        </div>
        <div class="mode m-done">
          <span class="doneic" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M2.8 7.3l2.8 2.8 5.6-6" /></svg></span>
          <span class="dtext" id="dtext">Deleted</span>
          <span class="sp"></span>
          <button class="undo" id="undo" type="button">Undo</button>
          <i class="life" id="life" aria-hidden="true"></i>
        </div>
      </div>
    </div>
  </section>
  <p class="hint">Pick a few files, then Delete: they stack into a pile and drop through the bin.</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Pile Up: bulk delete; picked rows fly into a pile, get squashed and drop into the bin ----------
  const $ = (id) => document.getElementById(id);
  const list = $("list"), allCb = $("all"), bar = $("bar"), nsel = $("nsel"), ssel = $("ssel");
  const goBtn = $("go"), clearBtn = $("clear"), undoBtn = $("undo"), dtext = $("dtext"), life = $("life");
  const meter = $("meter"), used = $("used"), emptyEl = $("empty"), status = $("status");

  const FILES = [
    { name: "Bank statement Oct.pdf", type: "PDF", c: "#e5484d", mb: 2.4, when: "Today" },
    { name: "Shaadi photos.zip", type: "ZIP", c: "#f59e0b", mb: 860, when: "Yesterday" },
    { name: "Product shoot 04.jpg", type: "JPG", c: "#12a594", mb: 6.8, when: "Monday" },
    { name: "Store promo.mp4", type: "MP4", c: "#8b5cf6", mb: 148, when: "12 Nov" },
    { name: "Stock count.xlsx", type: "XLS", c: "#22a06b", mb: .9, when: "9 Nov" },
    { name: "Supplier list.docx", type: "DOC", c: "#3b82f6", mb: .4, when: "2 Nov" }
  ];
  const OTHER_MB = 6820, DISK_MB = 10000, ROW = 56;

  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function play(el, frames, opts) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const fmt = (mb) => mb >= 1000 ? (mb / 1000).toFixed(1) + " GB" : (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + " MB";
  function say(msg) { if (!demo.on) status.textContent = msg; }

  // ---------- Build rows (label wraps the real checkbox, so the whole row toggles) ----------
  const iconHTML = (f) => '<span class="ficon" style="--c:' + f.c + '" aria-hidden="true"><b>' + f.type + "</b></span>";
  FILES.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML =
      '<label class="row"><span class="cbw"><input class="cb" type="checkbox" aria-label="' + f.name + ", " + fmt(f.mb) + '"><span class="box"><svg viewBox="0 0 14 14"><path class="tk" d="M2.5 7.4l3 3 6-6.5" /></svg></span></span>' +
      iconHTML(f) + '<span class="fname"><b>' + f.name + "</b><span>" + f.type + " · " + f.when + '</span></span><span class="fsize">' + fmt(f.mb) + "</span></label>";
    list.appendChild(li);
    f.li = li;
    f.row = li.querySelector(".row");
    f.cb = li.querySelector(".cb");
    f.state = "shown";
    f.cb.addEventListener("change", () => { f.row.classList.toggle("on", f.cb.checked); sync(); });
  });

  // ---------- Selection, bar and storage ----------
  let mode = "hidden", busy = false, lastBatch = null, lifeAnim = null, doneTimer = 0;
  const shown = () => FILES.filter((f) => f.state === "shown");
  const picked = () => shown().filter((f) => f.cb.checked);

  function setMode(m) {
    mode = m;
    bar.dataset.mode = m;
    bar.inert = m === "hidden";
    bar.querySelector(".m-sel").inert = m !== "select";
    bar.querySelector(".m-done").inert = m !== "done";
  }
  function bump(el) { play(el, [{ transform: "translateY(8px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 320, easing: "cubic-bezier(.3,1.5,.5,1)" }); }

  function sync() {
    const s = shown(), p = picked();
    allCb.checked = s.length > 0 && p.length === s.length;
    allCb.indeterminate = p.length > 0 && p.length < s.length;
    allCb.disabled = s.length === 0;
    if (busy) return; // the bar keeps its numbers while the pile is on its way
    if (String(p.length) !== nsel.textContent) { nsel.textContent = p.length; bump(nsel); }
    ssel.textContent = fmt(p.reduce((a, f) => a + f.mb, 0));
    if (p.length) setMode("select");
    else if (mode === "select") setMode("hidden");
  }
  function storage() {
    const mb = OTHER_MB + shown().reduce((a, f) => a + f.mb, 0);
    meter.style.width = (mb / DISK_MB * 100).toFixed(1) + "%";
    used.textContent = fmt(mb) + " of 10 GB used";
    emptyEl.classList.toggle("show", shown().length === 0);
  }
  allCb.addEventListener("change", () => {
    const on = allCb.checked;
    shown().forEach((f, i) => setTimeout(() => { f.cb.checked = on; f.row.classList.toggle("on", on); sync(); }, calm() ? 0 : i * 45));
  });
  clearBtn.addEventListener("click", () => { clearAll(); allCb.focus(); });
  function clearAll() { FILES.forEach((f) => { f.cb.checked = false; f.row.classList.remove("on"); }); sync(); }

  // Dust and sparks
  function burst(x, y, n, spread, cols) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "bit";
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = cols[i % cols.length];
      document.body.appendChild(s);
      const a = -Math.PI / 2 + (Math.random() - .5) * spread, d = 24 + Math.random() * 34;
      s.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) scale(.2)", opacity: 0 }], { duration: 480 + Math.random() * 260, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => s.remove();
    }
  }

  // A flying copy of a row that can shrink into a small tile
  function makeTile(f, r) {
    const t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = '<div class="g-row">' + iconHTML(f) + f.name + '</div><div class="g-tile">' + iconHTML(f) + "</div>";
    Object.assign(t.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: "0px" });
    document.body.appendChild(t);
    return t;
  }
  // Animate a fixed box from rect a to rect b through a lifted middle; final styles are set first
  function fly(t, a, b, rotA, rotB, ms, toTile) {
    const mid = { left: (a.left + b.left) / 2 + "px", top: Math.min(a.top, b.top) - 46 + "px", width: (a.width + b.width) / 2 + "px", height: (a.height + b.height) / 2 + "px", borderRadius: "12px", transform: "rotate(" + (rotA + rotB) + "deg)", offset: .5 };
    const box = (r, rot, rad) => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: rad, transform: "rotate(" + rot + "deg)" });
    Object.assign(t.style, box(b, rotB, toTile ? "10px" : "0px"));
    play(t.querySelector(".g-row"), toTile ? [{ opacity: 1 }, { opacity: 0, offset: .28 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 0, offset: .7 }, { opacity: 1 }], { duration: ms, fill: "forwards" });
    play(t.querySelector(".g-tile"), toTile ? [{ opacity: 0 }, { opacity: 0, offset: .3 }, { opacity: 1, offset: .55 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 1, offset: .4 }, { opacity: 0, offset: .65 }, { opacity: 0 }], { duration: ms, fill: "forwards" });
    return play(t, [box(a, rotA, toTile ? "0px" : "10px"), mid, box(b, rotB, toTile ? "10px" : "0px")], { duration: ms, easing: "cubic-bezier(.5,0,.25,1)" });
  }

  // ---------- Bulk delete ----------
  async function bulkDelete() {
    const sel = picked();
    if (!sel.length || busy) return;
    busy = true;
    const keepFocus = bar.contains(document.activeElement);
    // hold the list height so the bar (and the pile above it) stays put while rows leave
    const h0 = list.offsetHeight;
    list.style.minHeight = h0 + "px";
    // 1. anticipation: picked rows lift, the button crouches
    sel.forEach((f, i) => play(f.row, [{ transform: "none" }, { transform: "translateY(-3px) scale(1.012)", offset: .45 }, { transform: "none" }], { duration: 320, delay: i * 40, easing: "ease-out" }));
    play(goBtn, [{ transform: "scale(1)" }, { transform: "scale(.9, 1.06)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-out" });
    await wait(340);

    // 2. each row flies up and lands on a pile above the button
    const gb = goBtn.getBoundingClientRect();
    const px = gb.left + gb.width / 2, baseY = gb.top - 40;
    const tiles = [];
    await Promise.all(sel.map((f, i) => (async () => {
      await wait(i * 120);
      const r = f.row.getBoundingClientRect();
      const t = makeTile(f, r);
      tiles[i] = t;
      f.state = "deleted";
      f.cb.checked = false;
      f.row.classList.remove("on");
      f.row.classList.add("hollow");
      f.li.style.height = "0px";
      f.li.style.overflow = "hidden";
      play(f.li, [{ height: ROW + "px" }, { height: "0px" }], { duration: 380, easing: "cubic-bezier(.6,0,.3,1)" }).then(() => { if (f.state === "deleted") f.li.hidden = true; });
      const rot = (i % 2 ? 1 : -1) * (3 + Math.random() * 6);
      t.dataset.rot = rot;
      await fly(t, r, { left: px - 32, top: baseY - i * 6, width: 64, height: 46 }, 0, rot, 620, true);
      play(t, [{ transform: "rotate(" + rot + "deg) scale(1.12, .84)" }, { transform: "rotate(" + rot + "deg)" }], { duration: 260, easing: "cubic-bezier(.3,1.6,.5,1)" });
    })()));
    sync();
    storage();
    await wait(220);

    // 3. the pile is squashed into one brick
    const n = tiles.length;
    await Promise.all(tiles.map((t, i) => {
      const end = "translateY(" + (i * 6) + "px) rotate(0deg) scale(1.08, .42)";
      const from = t.style.transform;
      t.style.transform = end;
      return play(t, [{ transform: from }, { transform: "translateY(" + (i * 6 - 6) + "px) rotate(0deg) scale(.96, 1.08)", offset: .35 }, { transform: end }], { duration: 380, easing: "cubic-bezier(.5,0,.3,1.2)" });
    }));
    await wait(120);

    // 4. the bin opens like a hatch and the brick drops in
    goBtn.classList.add("open");
    await wait(200);
    // the brick slides down onto the open lid and vanishes into the button
    const tileMid = baseY + 23, into = gb.top + gb.height * .3 - tileMid;
    await Promise.all(tiles.map((t, i) => play(t, [{ transform: t.style.transform, opacity: 1 }, { transform: "translateY(" + (into * .6 + i * 6) + "px) scale(.8, .36)", opacity: 1, offset: .55 }, { transform: "translateY(" + (into + i * 6) + "px) scale(.22, .1)", opacity: 0 }], { duration: 340, easing: "cubic-bezier(.6,0,.9,.6)", fill: "forwards" })));
    tiles.forEach((t) => t.remove());
    goBtn.classList.remove("open");
    play(goBtn, [{ transform: "scale(1)" }, { transform: "scale(1.14, .88)", offset: .3 }, { transform: "scale(.96, 1.04)", offset: .65 }, { transform: "scale(1)" }], { duration: 500, easing: "ease-out" });
    burst(px, gb.top + 4, 16, 2.2, ["#9fb7b1", cssVar("--accent"), "#f59e0b", cssVar("--danger")]);

    // 5. finish: totals update and the bar offers Undo for 5 seconds
    const freed = sel.reduce((a, f) => a + f.mb, 0);
    lastBatch = sel;
    dtext.textContent = sel.length + (sel.length === 1 ? " file" : " files") + " deleted · " + fmt(freed) + " freed";
    setMode("done");
    if (keepFocus) undoBtn.focus();
    say(dtext.textContent + ". Press Undo to bring them back.");
    lifeAnim && lifeAnim.cancel();
    lifeAnim = calm() ? null : life.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 5000 });
    // let the list close up smoothly now that the pile is gone
    list.style.minHeight = "";
    const h1 = list.offsetHeight;
    play(list, [{ minHeight: h0 + "px" }, { minHeight: h1 + "px" }], { duration: 480, easing: "cubic-bezier(.34,1.2,.64,1)" });
    busy = false;
    clearTimeout(doneTimer);
    doneTimer = setTimeout(() => { if (mode === "done") { lastBatch = null; setMode(picked().length ? "select" : "hidden"); } }, 5000);
  }

  // ---------- Undo: tiles pop out of the bin and grow back into their rows ----------
  async function undo() {
    if (!lastBatch || busy) return;
    busy = true;
    clearTimeout(doneTimer);
    lifeAnim && lifeAnim.cancel();
    const batch = lastBatch;
    lastBatch = null;
    const hadFocus = bar.contains(document.activeElement);
    setMode(picked().length ? "select" : "hidden");
    const gb = goBtn.getBoundingClientRect();
    const start = { left: gb.left + gb.width / 2 - 32, top: gb.top - 30, width: 64, height: 46 };
    burst(gb.left + gb.width / 2, gb.top, 10, 1.6, [cssVar("--accent"), "#ffd27a"]);
    batch.forEach((f) => { f.li.hidden = false; f.li.style.height = ""; f.state = "shown"; });
    storage();
    sync();
    const rects = batch.map((f) => f.row.getBoundingClientRect());
    batch.forEach((f) => play(f.li, [{ height: "0px" }, { height: ROW + "px" }], { duration: 420, easing: "cubic-bezier(.34,1.3,.64,1)" }));
    await Promise.all(batch.map((f, i) => (async () => {
      await wait(i * 110);
      const t = makeTile(f, start);
      await fly(t, start, { left: rects[i].left, top: rects[i].top, width: rects[i].width, height: ROW }, (i % 2 ? 6 : -6), 0, 560, false);
      t.remove();
      f.row.classList.remove("hollow");
      f.li.style.overflow = "";
      play(f.row, [{ backgroundColor: cssVar("--accent-soft") }, { backgroundColor: "rgba(0,0,0,0)" }], { duration: 1100, easing: "ease-out" });
    })()));
    busy = false;
    sync();
    if (hadFocus) allCb.focus();
    say(batch.length + (batch.length === 1 ? " file" : " files") + " restored.");
  }

  goBtn.addEventListener("click", bulkDelete);
  undoBtn.addEventListener("click", undo);
  $("refill").addEventListener("click", () => { restoreAll(); allCb.focus(); });
  function restoreAll() {
    let k = 0;
    FILES.forEach((f) => {
      if (f.state === "shown") return;
      f.state = "shown";
      f.li.hidden = false;
      f.li.style.height = "";
      f.li.style.overflow = "";
      f.row.classList.remove("hollow");
      play(f.li, [{ height: "0px", opacity: 0, transform: "translateY(18px)" }, { height: ROW + "px", opacity: 1, transform: "none" }], { duration: 520, delay: k++ * 80, easing: "cubic-bezier(.34,1.3,.64,1)", fill: "backwards" });
    });
    lastBatch = null;
    clearTimeout(doneTimer);
    if (mode === "done") setMode("hidden");
    storage();
    sync();
  }

  // Keyboard: Esc clears the picks, Delete removes them
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && picked().length) { clearAll(); }
    if ((e.key === "Delete" || (e.key === "Backspace" && (e.metaKey || e.ctrlKey))) && picked().length) { e.preventDefault(); bulkDelete(); }
  });

  // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
  const demo = { on: true, timer: 0 };
  function stopDemo() { if (!demo.on) return; demo.on = false; clearTimeout(demo.timer); }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
  function tap(el) { play(el, [{ transform: "scale(1)" }, { transform: "scale(.9)" }, { transform: "scale(1)" }], { duration: 200 }); }
  let round = 0;
  async function runDemo() {
    if (!demo.on) return;
    if (busy) { scheduleDemo(800); return; }
    if (shown().length < FILES.length) { restoreAll(); scheduleDemo(1600); return; }
    const sets = [[0, 2, 3], [1, 4], [2, 3, 5]];
    const pick = sets[round++ % sets.length];
    for (const i of pick) {
      FILES[i].cb.checked = true;
      FILES[i].row.classList.add("on");
      sync();
      await wait(240);
      if (!demo.on) return;
    }
    await wait(380); if (!demo.on) return;
    tap(goBtn);
    await bulkDelete();
    await wait(1500); if (!demo.on) return;
    tap(undoBtn);
    await wait(150);
    await undo();
    scheduleDemo(3200);
  }

  storage();
  scheduleDemo(380);
</script>
</body>
</html>
