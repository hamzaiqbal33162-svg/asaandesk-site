<!doctype html>
<!-- Chill & Craft · Shiplog · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shiplog · release notes timeline</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: graphite on bone with amber, cyan and pink tags (light), graphite night (dark) ---------- */
  :root {
    --bg: #f3f2ed; --grid: rgba(22, 22, 22, 0.05); --card: #fffffd; --edge: rgba(22, 22, 22, 0.1); --ink: #161616; --muted: #6b6a64; --soft: #efeee8; --soft-2: #e4e2da;
    --new: #e88a00; --imp: #0e9db3; --fix: #e0446f; --rail: rgba(22, 22, 22, 0.14); --lit: #e88a00; --good: #1a9b62;
    --shadow: rgba(20, 20, 20, 0.2); --focus: #0e9db3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0e; --grid: rgba(255, 255, 255, 0.04); --card: #16161a; --edge: rgba(255, 255, 255, 0.08); --ink: #f1f0ea; --muted: #a09f98; --soft: #1e1e23; --soft-2: #2a2a30;
    --new: #ffb03a; --imp: #3fd3e8; --fix: #ff6f96; --rail: rgba(255, 255, 255, 0.14); --lit: #ffb03a; --good: #48d494;
    --shadow: rgba(0, 0, 0, 0.6); --focus: #3fd3e8;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 26px 16px; overflow: hidden; overflow: clip;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
  .wrap { width: min(1000px, 100%); display: grid; grid-template-columns: 352px minmax(0, 1fr); gap: 34px; align-items: start; }

  /* ---------- Side: title, filters, subscribe ---------- */
  .side { position: sticky; top: 26px; animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .eyebrow i { width: 7px; height: 7px; border-radius: 2px; background: var(--lit); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  h1 { margin: 8px 0 0; font-size: 28px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 840; }
  .lede { margin: 8px 0 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
  .upd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 14px; font-size: 13px; }
  .upd .n { font-weight: 800; }
  .link { height: 30px; padding: 0 11px; border: 1px solid var(--edge); border-radius: 9px; cursor: pointer; background: var(--card); font-size: 12.5px; font-weight: 740; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1), opacity 0.3s; }
  .link:active { transform: scale(0.94); }
  .link:disabled { opacity: 0.45; cursor: default; }
  .link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .filters { position: relative; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 18px; }
  .chip { position: relative; height: 32px; padding: 0 8px; border: 1px solid var(--edge); border-radius: 10px; cursor: pointer; background: var(--card); font-size: 12px; font-weight: 740; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .chip:active { transform: scale(0.94); }
  .chip .sw { width: 7px; height: 7px; border-radius: 2px; background: var(--c, var(--ink)); }
  .chip small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .chip[aria-pressed="true"] small { color: inherit; opacity: 0.7; }

  .sub { margin-top: 20px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--edge); }
  .sub label { display: block; font-size: 13px; font-weight: 760; margin-bottom: 8px; }
  .sub-row { display: flex; gap: 6px; }
  .sub input { flex: 1; min-width: 0; height: 40px; padding: 0 11px; border-radius: 10px; border: 1.5px solid var(--soft-2); background: var(--bg); font-size: 13.5px; transition: border-color 0.2s, box-shadow 0.2s; }
  .sub input:focus { outline: none; border-color: var(--imp); box-shadow: 0 0 0 4px color-mix(in srgb, var(--imp) 16%, transparent); }
  .sub input.bad { border-color: var(--fix); animation: shake 0.45s; }
  .sub input:disabled { opacity: 0.7; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .launch { position: relative; height: 40px; padding: 0 14px; border: 0; border-radius: 10px; cursor: pointer; background: var(--ink); color: var(--card); font-size: 13.5px; font-weight: 780; display: inline-flex; align-items: center; gap: 7px; overflow: visible; transition: background 0.3s, transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); white-space: nowrap; }
  .launch:active { transform: scale(0.95); }
  .launch .rk { width: 16px; height: 16px; transition: transform 0.9s cubic-bezier(0.55, 0, 0.8, 0.4), opacity 0.4s 0.6s; }
  .launch .rk .flame { fill: var(--new); transform-box: fill-box; transform-origin: top; opacity: 0; }
  .launch.go .rk { transform: translate(40px, -90px) rotate(20deg); opacity: 0; }
  .launch.go .rk .flame { opacity: 1; animation: flame 0.12s linear infinite alternate; }
  @keyframes flame { to { transform: scaleY(1.5); } }
  .launch.prep .rk { animation: rumble 0.08s linear infinite; }
  @keyframes rumble { 50% { transform: translate(0.6px, -0.6px) rotate(-3deg); } }
  .launch.done { background: var(--good); }
  .launch.done .rk { display: none; }
  .hint { min-height: 17px; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .hint.err { color: var(--fix); font-weight: 650; }
  .hint button { border: 0; background: none; padding: 0; cursor: pointer; font-size: 12px; font-weight: 750; text-decoration: underline; color: var(--ink); }
  .puff { position: fixed; width: 10px; height: 10px; border-radius: 50%; background: var(--soft-2); pointer-events: none; z-index: 30; animation: puff 0.9s ease-out forwards; }
  @keyframes puff { from { opacity: 0.9; transform: translate(-50%, -50%) scale(0.4); } to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(2.4); } }

  /* ---------- Timeline ---------- */
  .log { list-style: none; margin: 0; padding: 0; }
  .rel { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.55s cubic-bezier(0.3, 1.1, 0.4, 1), opacity 0.35s; }
  .rel > .ri { min-height: 0; overflow: hidden; }
  .rel.none { grid-template-rows: 0fr; opacity: 0; }
  .row { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding-bottom: 12px; }
  /* the rail: each release draws its own piece down to the next one */
  .row::before { content: ""; position: absolute; left: 14px; top: 26px; bottom: -2px; width: 2px; border-radius: 2px; background: var(--rail); transform-origin: top; animation: rail 0.6s cubic-bezier(0.5, 0, 0.3, 1) backwards; animation-delay: calc(var(--k) * 0.14s + 0.35s); }
  .rel.last .row::before { display: none; }
  .row::after { content: ""; position: absolute; left: 14px; top: 0; height: 16px; width: 2px; background: var(--rail); }
  .rel.first .row::after { display: none; }
  @keyframes rail { from { transform: scaleY(0); } }
  .node { position: relative; z-index: 1; width: 16px; height: 16px; margin: 13px 0 0 7px; border-radius: 5px; background: var(--card); border: 2px solid var(--rail); transform: rotate(45deg); transition: border-color 0.3s, background 0.3s; animation: node 0.5s cubic-bezier(0.3, 2, 0.5, 1) backwards; animation-delay: calc(var(--k) * 0.14s + 0.25s); }
  @keyframes node { from { transform: rotate(45deg) scale(0); } }
  .open .node { border-color: var(--ink); }
  .unread .node { background: var(--lit); border-color: var(--lit); }
  .unread .node::after { content: ""; position: absolute; inset: -6px; border-radius: 7px; border: 2px solid var(--lit); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { from { opacity: 0.8; transform: scale(0.6); } to { opacity: 0; transform: scale(1.5); } }
  .node.popped { animation: popnode 0.5s cubic-bezier(0.3, 2, 0.5, 1); }
  @keyframes popnode { 40% { transform: rotate(45deg) scale(1.45); } }

  .card { border-radius: 14px; background: var(--card); border: 1px solid var(--edge); box-shadow: 0 18px 30px -28px var(--shadow); animation: rise 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.1) backwards; animation-delay: calc(var(--k) * 0.12s + 0.15s); transition: box-shadow 0.3s, border-color 0.3s; }
  .open .card { border-color: color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: 0 26px 40px -30px var(--shadow); }
  .head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 12px 12px 14px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 14px; }
  .ver { font-size: 13.5px; font-weight: 800; padding: 3px 8px; border-radius: 7px; background: var(--soft); white-space: nowrap; }
  .open .ver { background: var(--ink); color: var(--card); }
  .ht { flex: 1; min-width: 0; }
  .ht b { display: block; font-size: 14.5px; font-weight: 760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ht small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .latest { position: relative; overflow: hidden; font-size: 10.5px; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; color: var(--card); background: var(--lit); white-space: nowrap; }
  .latest::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%) -150% 0 / 250% 100% no-repeat; animation: sheen 3.6s ease-in-out infinite 1s; }
  @keyframes sheen { 0%, 60% { background-position: -150% 0; } 100% { background-position: 150% 0; } }
  .chev { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .open .chev { transform: rotate(180deg); }

  .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.55s cubic-bezier(0.3, 1.15, 0.4, 1); }
  .open .body { grid-template-rows: 1fr; }
  .bi { min-height: 0; overflow: hidden; }
  .entries { list-style: none; margin: 0; padding: 2px 14px 0; }
  .entry { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.45s cubic-bezier(0.3, 1.1, 0.4, 1), opacity 0.3s; }
  .entry > div { min-height: 0; overflow: hidden; }
  .entry.hide { grid-template-rows: 0fr; opacity: 0; }
  .entry p { display: flex; align-items: flex-start; gap: 9px; margin: 0; padding: 6px 0; font-size: 13.5px; line-height: 1.4; }
  .open .entry p { animation: line 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) backwards; animation-delay: calc(var(--e) * 60ms + 120ms); }
  @keyframes line { from { opacity: 0; transform: translateX(-10px); } }
  .tag { flex: none; width: 78px; text-align: center; font-size: 10px; font-weight: 850; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border-radius: 6px; margin-top: 1px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .foot { display: flex; align-items: center; gap: 6px; padding: 8px 12px 12px 14px; }
  .react { position: relative; height: 30px; padding: 0 9px; border: 1px solid var(--edge); border-radius: 9px; cursor: pointer; background: var(--card); font-size: 12px; font-weight: 750; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; transition: background 0.25s, border-color 0.25s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .react:active { transform: scale(0.92); }
  .react svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.5s cubic-bezier(0.3, 2, 0.5, 1); }
  .react[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .react[aria-pressed="true"] svg { stroke: var(--c); fill: color-mix(in srgb, var(--c) 30%, transparent); transform: scale(1.18) rotate(-8deg); }
  .react .p1 { position: absolute; left: 50%; top: -4px; font-size: 11px; font-weight: 850; color: var(--c); opacity: 0; pointer-events: none; }
  .react .p1.go { animation: p1 0.9s ease-out; }
  @keyframes p1 { 0% { opacity: 0; transform: translate(-50%, 6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -16px); } }
  .copy { margin-left: auto; }
  .copy.ok { color: var(--good); border-color: var(--good); }

  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--lit); opacity: 0; }
  .ghost.tap::after { animation: ring 0.5s ease-out; }
  @keyframes ring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  @media (max-width: 900px) {
    .stage { align-items: flex-start; }
    .wrap { grid-template-columns: minmax(0, 1fr); max-width: 520px; gap: 14px; }
    .side { position: static; }
    h1 { font-size: 22px; margin-top: 6px; }
    .lede { display: none; }
    .upd { margin-top: 8px; }
    .filters { margin-top: 10px; }
    .head { padding: 9px 10px 9px 12px; }
    .entry p { padding: 5px 0; font-size: 13px; }
    .entries { padding: 0 12px; }
    .foot { padding: 6px 10px 10px 12px; }
    .node { margin-top: 11px; }
    .row { padding-bottom: 10px; }
    .row::before { top: 24px; }
    .row::after { height: 14px; }
    .sub { display: none; }
    .sub.mobile { display: block; margin: 0 0 14px; padding: 10px 12px 8px; }
    .sub.mobile label { font-size: 12.5px; margin-bottom: 6px; }
    .sub.mobile .hint { min-height: 0; margin-top: 4px; }
    .sub.mobile .hint:empty { display: none; }
    .ht b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
    .latest { display: none; }
  }
  @media (min-width: 901px) { .sub.mobile { display: none; } }
  @media (max-width: 380px) { .chip { padding: 0 9px; } .tag { width: 72px; font-size: 9.5px; letter-spacing: 0.04em; } .row { grid-template-columns: 24px minmax(0, 1fr); gap: 8px; } .row::before { left: 11px; } .node { margin-left: 4px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <aside class="side" aria-labelledby="ttl">
      <p class="eyebrow"><i></i>Release notes</p>
      <h1 id="ttl">What's new in Daybook</h1>
      <p class="lede">Every change we ship to the shop app, newest first. Tap a release to see what changed.</p>
      <div class="upd"><span><span class="n" id="unreadN">2</span> new since your last visit</span><button class="link" id="markAll" type="button"><svg viewBox="0 0 24 24"><path d="M4 12.5l4 4L18 6.5"/><path d="M10 16.5l1.2 1.2L21 8"/></svg>Mark all read</button></div>
      <div class="filters" role="group" aria-label="Show changes of type" id="filters">
        <button class="chip" type="button" data-f="all" aria-pressed="true">All <small id="cAll"></small></button>
        <button class="chip" type="button" data-f="new" aria-pressed="false" style="--c:var(--new)"><span class="sw"></span>New <small id="cNew"></small></button>
        <button class="chip" type="button" data-f="imp" aria-pressed="false" style="--c:var(--imp)"><span class="sw"></span>Improved <small id="cImp"></small></button>
        <button class="chip" type="button" data-f="fix" aria-pressed="false" style="--c:var(--fix)"><span class="sw"></span>Fixed <small id="cFix"></small></button>
      </div>
      <form class="sub" id="subDesk" novalidate></form>
    </aside>
    <section aria-label="Releases">
      <form class="sub mobile" id="subMob" novalidate></form>
      <ol class="log" id="log"></ol>
    </section>
  </div>
  <p class="sr-only" aria-live="polite" id="status"></p>
</main>
<canvas class="fx" aria-hidden="true"></canvas>
<div class="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
  (function () {
    "use strict";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
    var statusEl = $("#status");
    function say(t) { statusEl.textContent = t; }
    function wait(fn, ms) { return setTimeout(fn, reduce.matches ? Math.min(ms, 40) : ms); }

    /* ---------- Releases (made up) ---------- */
    var TYPES = { new: "New", imp: "Improved", fix: "Fixed" };
    var RELS = [
      { v: "4.2.0", date: "18 Nov 2026", title: "Bulk invoices and faster search", unread: true, love: 48, ship: 21, e: [["new", "Send up to 50 invoices in one go, each with its own reminder."], ["new", "Customer notes now show on every invoice you print."], ["imp", "Search is three times faster on long stock lists."], ["fix", "PKR totals no longer round twice when a discount is applied."]] },
      { v: "4.1.2", date: "4 Nov 2026", title: "Small fixes for busy days", unread: true, love: 12, ship: 5, e: [["fix", "Dark mode tables are readable again on older phones."], ["fix", "The day-end report no longer counts returns twice."]] },
      { v: "4.1.0", date: "21 Oct 2026", title: "Stock alerts", unread: false, love: 64, ship: 30, e: [["new", "Get an alert when an item is about to run out."], ["imp", "Export any sales report to a spreadsheet."], ["fix", "The barcode scanner works better in low light."]] },
      { v: "4.0.0", date: "2 Oct 2026", title: "A fresh home screen", unread: false, love: 131, ship: 77, e: [["new", "A new home screen with today's sales at a glance."], ["new", "Share one account with your whole team."], ["imp", "Offline mode now syncs quietly in the background."]] }
    ];
    var filter = "all";
    var ICON = {
      chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
      heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>',
      ship: '<svg viewBox="0 0 24 24"><path d="M12 3c3 2 4.5 5 4.5 9l-2 4h-5l-2-4C7.5 8 9 5 12 3z"/><circle cx="12" cy="10" r="1.6"/><path d="M9.5 16l-2.5 3M14.5 16l2.5 3M12 17v4"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
    };

    /* ---------- Build the timeline ---------- */
    var log = $("#log");
    RELS.forEach(function (r, k) {
      var li = document.createElement("li");
      li.className = "rel" + (k === 0 ? " open first" : "") + (r.unread ? " unread" : "") + (k === RELS.length - 1 ? " last" : "");
      li.style.setProperty("--k", k);
      var id = "rel-" + r.v.replace(/\./g, "-");
      var entries = r.e.map(function (e, i) {
        return '<li class="entry" data-t="' + e[0] + '" style="--e:' + i + '"><div><p><span class="tag" style="--c:var(--' + e[0] + ')">' + TYPES[e[0]] + "</span><span>" + e[1] + "</span></p></div></li>";
      }).join("");
      li.innerHTML = '<div class="ri"><div class="row"><span class="node" aria-hidden="true"></span><article class="card" style="--k:' + k + '">' +
        '<button class="head" type="button" aria-expanded="' + (k === 0) + '" aria-controls="' + id + '"><span class="ver mono">v' + r.v + '</span><span class="ht"><b>' + r.title + "</b><small>" + r.date + " · <span class=\"cnt\">" + r.e.length + " changes</span></small></span>" + (k === 0 ? '<span class="latest">Latest</span>' : "") + ICON.chev + "</button>" +
        '<div class="body" id="' + id + '"><div class="bi"><ul class="entries">' + entries + "</ul>" +
        '<div class="foot"><button class="react" type="button" data-r="love" aria-pressed="false" style="--c:var(--fix)" aria-label="Love this release">' + ICON.heart + '<span class="rc">' + r.love + '</span><span class="p1" aria-hidden="true">+1</span></button>' +
        '<button class="react" type="button" data-r="ship" aria-pressed="false" style="--c:var(--new)" aria-label="Cheer this release">' + ICON.ship + '<span class="rc">' + r.ship + '</span><span class="p1" aria-hidden="true">+1</span></button>' +
        '<button class="react copy" type="button" aria-label="Copy a link to v' + r.v + '">' + ICON.link + '<span class="cl">Link</span></button></div></div></div>' +
        "</article></div></div>";
      li._r = r; r.li = li;
      log.appendChild(li);
    });

    /* ---------- Open / close a release ---------- */
    function toggle(li, open) {
      open = open === undefined ? !li.classList.contains("open") : open;
      li.classList.toggle("open", open);
      $(".head", li).setAttribute("aria-expanded", String(open));
      var n = $(".node", li); n.classList.remove("popped"); void n.offsetWidth; n.classList.add("popped");
      if (open && li._r.unread) wait(function () { markRead(li._r); }, 700);
      say("Version " + li._r.v + (open ? " opened." : " closed."));
    }
    log.addEventListener("click", function (e) {
      var h = e.target.closest(".head"); if (h) { toggle(h.closest(".rel")); return; }
      var b = e.target.closest(".react"); if (!b) return;
      var r = b.closest(".rel")._r;
      if (b.classList.contains("copy")) { copyLink(b, r); return; }
      react(b, r);
    });

    /* ---------- Filters: matching lines stay, the rest fold away; empty releases fold too ---------- */
    function counts() {
      var c = { all: 0, new: 0, imp: 0, fix: 0 };
      RELS.forEach(function (r) { r.e.forEach(function (e) { c.all++; c[e[0]]++; }); });
      $("#cAll").textContent = c.all; $("#cNew").textContent = c.new; $("#cImp").textContent = c.imp; $("#cFix").textContent = c.fix;
    }
    function setFilter(f) {
      filter = f;
      $$("#filters .chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c.dataset.f === f)); });
      var shown = 0, lastVisible = null, firstVisible = null;
      RELS.forEach(function (r) {
        var n = 0;
        $$(".entry", r.li).forEach(function (en) { var on = f === "all" || en.dataset.t === f; en.classList.toggle("hide", !on); if (on) n++; });
        r.li.classList.toggle("none", n === 0);
        $(".cnt", r.li).textContent = (f === "all" ? r.e.length + " changes" : n + " " + TYPES[f].toLowerCase());
        if (n) { shown++; lastVisible = r.li; firstVisible = firstVisible || r.li; }
        // a filtered release opens so you can see what matched
        if (f !== "all" && n && !r.li.classList.contains("open")) { r.li.classList.add("open"); $(".head", r.li).setAttribute("aria-expanded", "true"); }
      });
      RELS.forEach(function (r) { r.li.classList.toggle("last", r.li === lastVisible); r.li.classList.toggle("first", r.li === firstVisible); });
      say(f === "all" ? "Showing every change." : "Showing " + TYPES[f].toLowerCase() + " changes in " + shown + " releases.");
    }
    $$("#filters .chip").forEach(function (c) { c.addEventListener("click", function () { setFilter(c.dataset.f); }); });

    /* ---------- Unread ---------- */
    function unreadCount() { return RELS.filter(function (r) { return r.unread; }).length; }
    function showUnread() {
      var n = unreadCount();
      $("#unreadN").textContent = n || "No";
      $("#markAll").disabled = !n;
    }
    function markRead(r) {
      if (!r.unread) return;
      r.unread = false; r.li.classList.remove("unread");
      var nd = $(".node", r.li); nd.classList.remove("popped"); void nd.offsetWidth; nd.classList.add("popped");
      showUnread();
    }
    $("#markAll").addEventListener("click", function () {
      RELS.filter(function (r) { return r.unread; }).forEach(function (r, i) { wait(function () { markRead(r); var b = $(".node", r.li).getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2, 12); }, i * 160); });
      say("All releases marked as read.");
    });

    /* ---------- Reactions and links ---------- */
    function react(b, r) {
      var key = b.dataset.r, on = b.getAttribute("aria-pressed") !== "true";
      r[key] += on ? 1 : -1;
      b.setAttribute("aria-pressed", String(on));
      $(".rc", b).textContent = r[key];
      if (on) { var p = $(".p1", b); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go"); var bx = b.getBoundingClientRect(); burst(bx.left + bx.width / 2, bx.top + bx.height / 2, 14); }
      say((on ? "Reacted to " : "Reaction removed from ") + "version " + r.v + ".");
    }
    function copyLink(b, r) {
      var url = location.href.split("#")[0] + "#v" + r.v.replace(/\./g, "-");
      function done(ok) {
        b.classList.toggle("ok", ok); $(".cl", b).textContent = ok ? "Copied" : "Failed";
        say(ok ? "Link to version " + r.v + " copied." : "Could not copy the link.");
        wait(function () { b.classList.remove("ok"); $(".cl", b).textContent = "Link"; }, 1500);
      }
      function fallback() { try { var ta = document.createElement("textarea"); ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e) { return false; } }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(fallback()); });
      else done(fallback());
    }

    /* ---------- Subscribe: the rocket rumbles, launches and leaves a puff trail ---------- */
    var subscribed = "";
    function buildSub(form, sfx) {
      form.innerHTML = '<label for="em' + sfx + '">Get release notes by email</label><div class="sub-row"><input id="em' + sfx + '" type="email" autocomplete="email" placeholder="you@shop.pk" />' +
        '<button class="launch" type="submit"><svg class="rk" viewBox="0 0 24 24" aria-hidden="true"><path class="flame" d="M10 18h4l-2 5z"/><path d="M12 2c3.5 2.5 5 6 4.5 10.5L14.5 18h-5L7.5 12.5C7 8 8.5 4.5 12 2z" fill="currentColor"/><circle cx="12" cy="9.5" r="1.8" fill="var(--ink)"/><path d="M7.6 13L5 16l2.7.3M16.4 13L19 16l-2.7.3" fill="currentColor"/></svg><span class="ll">Notify me</span></button></div><p class="hint" aria-live="polite"></p>';
      form.addEventListener("submit", function (e) { e.preventDefault(); subscribe(form); });
    }
    var forms = [$("#subDesk"), $("#subMob")];
    buildSub(forms[0], "1"); buildSub(forms[1], "2");
    function visibleForm() { return forms.filter(function (f) { return f.offsetParent !== null; })[0] || forms[0]; }
    function subscribe(form) {
      var input = $("input", form), btn = $(".launch", form), hint = $(".hint", form), v = input.value.trim();
      if (subscribed || btn.classList.contains("prep")) return;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
        input.classList.remove("bad"); void input.offsetWidth; input.classList.add("bad");
        hint.className = "hint err"; hint.textContent = v ? "That email looks incomplete." : "Type your email first.";
        return;
      }
      input.classList.remove("bad"); hint.className = "hint"; hint.textContent = "";
      btn.classList.add("prep"); $(".ll", btn).textContent = "Launching…";
      wait(function () {
        btn.classList.remove("prep"); btn.classList.add("go");
        var r = $(".rk", btn).getBoundingClientRect();
        for (var i = 0; i < 7; i++) (function (i) { wait(function () { puff(r.left + r.width / 2 + i * 6, r.top + r.height - i * 13); }, i * 70); })(i);
      }, 650);
      wait(function () {
        subscribed = v;
        forms.forEach(function (f) {
          var b = $(".launch", f), inp = $("input", f), h = $(".hint", f);
          b.classList.remove("go", "prep"); b.classList.add("done"); $(".ll", b).textContent = "Subscribed";
          inp.value = v; inp.disabled = true;
          h.className = "hint"; h.innerHTML = "Updates go to " + v.replace(/^(.).*(@.*)$/, "$1•••$2") + ". <button type=\"button\" class=\"undo\">Undo</button>";
          $(".undo", h).addEventListener("click", unsubscribe);
        });
        var bx = btn.getBoundingClientRect(); burst(bx.left + bx.width / 2, bx.top, 30);
        say("Subscribed. Release notes will go to " + v + ".");
      }, 1500);
    }
    function unsubscribe() {
      subscribed = "";
      forms.forEach(function (f) {
        var b = $(".launch", f), inp = $("input", f), h = $(".hint", f);
        b.classList.remove("done"); $(".ll", b).textContent = "Notify me"; inp.disabled = false; inp.value = ""; h.textContent = "";
      });
      say("Unsubscribed.");
    }
    function puff(x, y) {
      if (reduce.matches) return;
      var p = document.createElement("span"); p.className = "puff";
      p.style.left = x + "px"; p.style.top = y + "px";
      p.style.setProperty("--dx", (Math.random() * 30 - 15).toFixed(0) + "px"); p.style.setProperty("--dy", (10 + Math.random() * 16).toFixed(0) + "px");
      document.body.appendChild(p);
      setTimeout(function () { p.remove(); }, 950);
    }

    /* ---------- Sparks ---------- */
    var fx = $(".fx"), ctx = fx.getContext("2d"), bits = [], raf = 0;
    function sizeFx() { var d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    var COLS = ["#e88a00", "#0e9db3", "#e0446f", "#ffb03a", "#3fd3e8"];
    function burst(x, y, n) {
      if (reduce.matches) return;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4.5;
        bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, s: 2 + Math.random() * 3, c: COLS[i % COLS.length], life: 0 });
      }
      if (!raf) raf = requestAnimationFrame(step);
    }
    function step() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      bits = bits.filter(function (b) { return b.life < 55; });
      bits.forEach(function (b) {
        b.life++; b.vy += 0.12; b.vx *= 0.96; b.x += b.vx; b.y += b.vy;
        ctx.globalAlpha = Math.min(1, (55 - b.life) / 18); ctx.fillStyle = b.c;
        ctx.fillRect(b.x - b.s / 2, b.y - b.s / 2, b.s, b.s);
      });
      ctx.globalAlpha = 1;
      raf = bits.length ? requestAnimationFrame(step) : 0;
    }

    /* ---------- Auto-demo: plays on load and every few seconds; any real input stops it ---------- */
    var ghost = $(".ghost"), demoOn = !reduce.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function ghostTo(el, then) {
      if (!el) return;
      var r = el.getBoundingClientRect();
      ghost.classList.add("show");
      ghost.style.setProperty("--gx", Math.min(innerWidth - 30, r.left + r.width * 0.55) + "px");
      ghost.style.setProperty("--gy", r.top + r.height * 0.6 + "px");
      later(function () { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (demoOn && then) then(); }, 170); }, 820);
    }
    function stopDemo() { if (!demoOn) return; demoOn = false; timers.forEach(clearTimeout); ghost.classList.remove("show", "tap"); }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }); });
    var DEMO_MAIL = "sana@shop.pk";
    function demo() {
      if (!demoOn) return;
      later(function () { ghostTo($('.chip[data-f="fix"]'), function () { setFilter("fix"); }); }, 200);
      later(function () { ghostTo($('.chip[data-f="all"]'), function () { setFilter("all"); RELS.forEach(function (r, k) { if (k) toggle(r.li, false); }); }); }, 2300);
      later(function () { ghostTo($(".head", RELS[2].li), function () { toggle(RELS[2].li, true); }); }, 4100);
      later(function () { ghostTo($(".react", RELS[0].li), function () { react($(".react", RELS[0].li), RELS[0]); }); }, 5900);
      later(function () { ghostTo($(".head", RELS[2].li), function () { toggle(RELS[2].li, false); }); }, 7400);
      later(function () { ghostTo($("#markAll"), function () { $("#markAll").click(); }); }, 8900);
      later(function () {
        var f = visibleForm(), inp = $("input", f);
        ghostTo(inp);
        for (var i = 0; i <= DEMO_MAIL.length; i++) (function (i) { later(function () { inp.value = DEMO_MAIL.slice(0, i); }, 900 + i * 55); })(i);
        later(function () { ghostTo($(".launch", f), function () { subscribe(f); }); }, 900 + DEMO_MAIL.length * 55 + 200);
      }, 10400);
      later(function () { ghost.classList.remove("show"); }, 14800);
      later(function () {
        unsubscribe();
        var b = $('.react[aria-pressed="true"]', RELS[0].li); if (b) react(b, RELS[0]);
        RELS[0].unread = RELS[1].unread = true; RELS[0].li.classList.add("unread"); RELS[1].li.classList.add("unread"); showUnread();
      }, 16400);
      later(demo, 17800);
    }

    /* ---------- Start ---------- */
    counts(); showUnread(); sizeFx();
    addEventListener("resize", sizeFx);
    if (demoOn) later(demo, 1600);
  })();
</script>
