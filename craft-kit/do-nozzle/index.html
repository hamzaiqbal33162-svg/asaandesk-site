<html lang="en">
<head>

<title>Nozzle · Petrol pump shifts · Chill & Craft</title>
<script>
  /* Theme first, so there is no flash: ?theme=light|dark wins, then the system setting */
  (function () { var q = new URLSearchParams(location.search).get("theme"); document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; })();
</script>
<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }
  .note[hidden] { display: none; }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Nozzle look: forecourt concrete, signal red canopy, LCD meters ======================= */
  :root {
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --bg: #e7e8eb; --surface: #ffffff; --surface2: #f0f1f3; --field: #fbfbfc; --ink: #15171b; --mut: #5f636c; --line: #d3d6dc;
    --acc: #d42a1e; --acc-ink: #fff; --canopy: #d42a1e; --dark: #1b1e24; --lcd: #0b120d; --lcd-ink: #74ff95;
    --pet: #e9a700; --hob: #d42a1e; --dsl: #2563b5;
    --ok: #1f8a46; --warn: #b26b00; --bad: #c81e1e;
    --c1: #e9a700; --c2: #d42a1e; --c3: #2563b5; --c4: #1f8a46; --c5: #6b6f78; --c6: #8b5cf6;
    --rb: 4px; --ri: 4px; --rm: 8px; --grid: #e3e5e9;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1013; --surface: #181a1f; --surface2: #20232a; --field: #14161a; --ink: #eceef2; --mut: #999eaa; --line: #2b2f37;
    --acc: #ff4a3d; --acc-ink: #1a0504; --canopy: #b8241a; --dark: #0a0b0d; --lcd: #050806; --lcd-ink: #5dff86;
    --pet: #ffc21a; --hob: #ff5a4d; --dsl: #5b9cff;
    --ok: #44d07a; --warn: #ffb547; --bad: #ff5f57;
    --c1: #ffc21a; --c2: #ff5a4d; --c3: #5b9cff; --c4: #44d07a; --c5: #8c919c; --c6: #a78bfa;
    --grid: #23262d; --toast: #20232a;
    color-scheme: dark;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; font-size: 13.5px; }
  h1, h2, h3 { font-weight: 800; letter-spacing: -.01em; }
  h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--mut); }

  /* Canopy header and the keypad nav with a lit key */
  .canopy { position: sticky; top: 0; z-index: 50; background: var(--canopy); color: #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
  .canopy-in { display: flex; align-items: center; gap: 12px; padding: 10px 22px; max-width: 1440px; margin: 0 auto; }
  .canopy::after { content: ""; display: block; height: 6px; background: repeating-linear-gradient(-45deg, #fff 0 10px, var(--canopy) 10px 20px); opacity: .9; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand b { font-size: 19px; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; display: block; line-height: 1; }
  .brand small { opacity: .8; font-size: 11px; }
  .clock { margin-left: auto; font: 700 13px/1 var(--mono); background: rgba(0, 0, 0, .25); padding: 7px 10px; border-radius: 4px; letter-spacing: .06em; }
  .canopy .ibtn { background: rgba(0, 0, 0, .22); border-color: transparent; color: #fff; }
  .srch { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 4px; border: 0; background: rgba(0, 0, 0, .22); color: #ffe9e6; min-width: 180px; }
  .srch kbd { margin-left: auto; font: 700 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 3px; background: rgba(255, 255, 255, .15); }
  .keys-wrap { background: var(--dark); }
  .keys { position: relative; display: flex; gap: 6px; padding: 10px 22px; max-width: 1440px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .keys::-webkit-scrollbar { display: none; }

"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);

const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */

const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */
const PK = {
  m: ["Ahmed", "Bilal", "Usman", "Hamza", "Ali", "Imran", "Faisal", "Zubair", "Saad", "Kamran", "Asif", "Tariq", "Shahid", "Naveed", "Waqas", "Adeel", "Fahad", "Junaid", "Rizwan", "Salman", "Danish", "Arslan", "Haris", "Owais", "Shoaib", "Yasir", "Moiz", "Talha"],

const pname = (g) => pick(g === "f" ? PK.f : g === "m" ? PK.m : rnd() < 0.5 ? PK.f : PK.m) + " " + pick(PK.last);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + ri(1000000, 9999999);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

/* ---------- Number formats: Rs 12,500 · 1.2M · $1,240 ---------- */
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = (n) => (n < 0 ? "-" : "") + "Rs " + num(Math.abs(n));
const short = (n) => { const a = Math.abs(+n || 0), s = n < 0 ? "-" : "", f = (v, u) => s + (v >= 100 ? Math.round(v) : +v.toFixed(1)) + u; return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + (a % 1 ? +a.toFixed(1) : a); };
const rss = (n) => (n < 0 ? "-" : "") + "Rs " + short(Math.abs(n));
const usd = (n, d = 0) => (n < 0 ? "-$" : "$") + num(Math.abs(n), d);
const pct = (n, d = 0) => num(n, d) + "%";
const FMT = { num: (v) => num(v), rs, rss, short, usd, usd2: (v) => usd(v, 2), pct: (v) => pct(v, 1), pct0: (v) => pct(v) };

/* ---------- Dates (local, no time zone surprises) ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = pd(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
/* Add months but keep the day (31 Jan + 1 month = 28 or 29 Feb) */
const addMK = (d, n) => { const x = addM(d, n), day = pd(d).getDate(), last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

const TODAY = iso(today());
const lastMonths = (n) => Array.from({ length: n }, (_, i) => iso(addM(today(), i - n + 1)).slice(0, 7));

const FK = Object.keys(FUELS);
const NOZZLES = [["N1", "Petrol", 1], ["N2", "Petrol", 1], ["N3", "Petrol", 2], ["N4", "Petrol", 2], ["N5", "Hi-Octane", 3], ["N6", "Hi-Octane", 3], ["N7", "Diesel", 4], ["N8", "Diesel", 4]];
const SHIFTS = [["Morning", 6], ["Evening", 14], ["Night", 22]];
const PARTIES = ["Green Valley School Vans", "Hamid Builders", "Kashif Goods Carriers", "Metro Cab Owners", "Sunrise Poultry Farm", "Taj Rice Mill"];

/* Horizontal cylinder tank: litres at a dip (cm), and the dip for a stock (the dip chart) */
const tankLen = (f) => (FUELS[f].cap * 1000) / (Math.PI * Math.pow(FUELS[f].d / 2, 2));
function litresAt(f, h) { const r = FUELS[f].d / 2, x = clamp(h, 0, 2 * r); return Math.round(((r * r * Math.acos((r - x) / r) - (r - x) * Math.sqrt(Math.max(0, 2 * r * x - x * x))) * tankLen(f)) / 1000); }
function dipFor(f, litres) { let lo = 0, hi = FUELS[f].d; for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (litresAt(f, mid) < litres) lo = mid; else hi = mid; } return Math.round(((lo + hi) / 2) * 10) / 10; }

/* ---------- Demo data: 30 days of shifts ---------- */
function makeData() {
  seed(4421);
  const set = { name: "Canal Road Fuel Station", city: "Faisalabad", price: { Petrol: 263.45, "Hi-Octane": 299.0, Diesel: 268.9 }, test: 5, cashFloat: 20000 };
  const staff = ["Asif Malik", "Naveed Butt", "Rizwan Ali", "Shoaib Khan", "Imran Javed", "Waqas Ahmed"].map((n, i) => ({ id: "S" + (i + 1), name: n, phone: phone(), role: i < 2 ? "Shift manager" : "Pump attendant" }));
  const meters = Object.fromEntries(NOZZLES.map(([n]) => [n, ri(800000, 2400000) + ri(0, 9) / 10]));
  const credit = PARTIES.map((p, i) => ({ id: "CP" + (i + 1), name: p, limit: ri(4, 12) * 50000, phone: phone() }));
  const shifts = [], cred = [], deliveries = [], stock = { Petrol: 14500, "Hi-Octane": 6200, Diesel: 17800 };
  const dayBase = { Petrol: 6200, "Hi-Octane": 950, Diesel: 7400 }, split = { Morning: 0.38, Evening: 0.42, Night: 0.2 };
  /* Walk forward through 30 days, three shifts a day, with tankers arriving when stock runs low */
  const start = addD(today(), -30);
  for (let d = 0; d < 30; d++) {
    const date = iso(addD(start, d)), wk = pd(date).getDay() === 0 ? 0.85 : 1;
    SHIFTS.forEach(([sh]) => {
      const rec = { id: "", date, shift: sh, staff: [staff[(d + SHIFTS.findIndex((x) => x[0] === sh)) % 2].id, staff[2 + ((d * 3 + sh.length) % 4)].id], open: {}, close: {}, tests: {}, price: { ...set.price } };
      let sales = 0;
      NOZZLES.forEach(([n, f]) => { const per = NOZZLES.filter((x) => x[1] === f).length, lit = Math.round((dayBase[f] * split[sh] * wk * rf(0.8, 1.2)) / per * 10) / 10; rec.open[n] = +meters[n].toFixed(1); meters[n] = +(meters[n] + lit).toFixed(1); rec.close[n] = meters[n]; sales += lit * set.price[f]; });
      FK.forEach((f) => { rec.tests[f] = sh === "Morning" ? set.test : 0; const sold = sum(NOZZLES.filter((x) => x[1] === f).map(([n]) => rec.close[n] - rec.open[n])) - rec.tests[f]; stock[f] = Math.max(0, stock[f] - sold); });
      const card = Math.round(sales * rf(0.18, 0.32)), cr = rnd() < 0.5 ? [{ party: pick(credit).id, amt: ri(8, 60) * 500 }] : [], exp = rnd() < 0.4 ? [{ note: pick(["Tea and meals", "Generator diesel", "Cleaning", "Water tanker"]), amt: ri(4, 30) * 100 }] : [];
      const expected = Math.round(sales - card - sum(cr.map((x) => x.amt)) - sum(exp.map((x) => x.amt)));
      const diff = rnd() < 0.6 ? 0 : rnd() < 0.7 ? -ri(1, 30) * 50 : ri(1, 10) * 50;
      Object.assign(rec, { card, credit: cr, exp, expected, counted: expected + diff, diff, closedBy: rec.staff[0] });
      cr.forEach((x) => cred.push({ id: uid("CR"), date, party: x.party, kind: "Fuel on credit", amt: x.amt, ref: sh + " shift" }));
      shifts.push(rec);
      FK.forEach((f) => { if (stock[f] < FUELS[f].cap * 0.3) { const inv = f === "Hi-Octane" ? 6000 : 12000, got = inv - ri(0, 40); deliveries.push({ id: uid("TK"), date, fuel: f, invoice: inv, received: got, tanker: pick(["TLR-482", "JTA-913", "TLK-257", "MNR-606"]), dipBefore: dipFor(f, stock[f]) }); stock[f] = Math.min(FUELS[f].cap, stock[f] + got); } });
    });
  }
  shifts.forEach((s, i) => (s.id = "SH-" + (4101 + i)));
  PARTIES.forEach((_, i) => { if (rnd() < 0.8) cred.push({ id: uid("CR"), date: iso(addD(today(), -ri(1, 20))), party: "CP" + (i + 1), kind: "Payment received", amt: ri(10, 40) * 1000, ref: "Cheque / transfer" }); });
  /* The shift that is running now, opening from the last closing meters */
  const cur = { date: TODAY, shift: shiftNow(), staff: [staff[0].id, staff[3].id], open: { ...meters }, close: {}, tests: { Petrol: set.test, "Hi-Octane": set.test, Diesel: set.test }, card: 0, credit: [], exp: [], counted: "" };
  /* Dips: book stock with a small daily gain or loss */
  const dips = FK.map((f) => ({ id: uid("DP"), date: TODAY, fuel: f, cm: dipFor(f, Math.max(0, stock[f] - ri(-20, 45))), book: Math.round(stock[f]) }));
  const hist = lastMonths(12).slice(0, 11).map((m) => { const f = rf(0.88, 1.08); return { m, Petrol: Math.round(6200 * 30 * f), "Hi-Octane": Math.round(950 * 30 * f), Diesel: Math.round(7400 * 30 * f * rf(0.9, 1.1)) }; });
  return { _v: 1, set, staff, credit, shifts, cred, deliveries, stock, dips, cur, hist };
}

  <div class="card"><h3>Cash count and handover</h3><div class="cashbox"><div class="line"><span>Fuel sales</span><b id="cSales">Rs 0</b></div><div class="line"><span>Less card</span><b id="cCard">Rs 0</b></div><div class="line"><span>Less credit</span><b id="cCred">Rs 0</b></div><div class="line"><span>Less expenses</span><b id="cExp">Rs 0</b></div><div class="line"><span><b>Cash expected in drawer</b></span><b id="cExpct">Rs 0</b></div><label class="line"><span>Cash counted (Rs)</span><input id="counted" type="number" min="0" value="${c.counted}" placeholder="Count the notes" style="width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--field);text-align:right;font-family:var(--mono)"></label><div class="verdict" aria-live="polite"><small id="vLab">Waiting for the count</small><span class="lcd" id="vAmt">--</span></div><button type="button" class="btn pri" id="closeShift">${ico("check")} Close shift and hand over</button></div></div></section>`;
  const read = () => {

  const exRow = (x, i) => `<div class="r"><input data-ex="${i}" value="${esc(x.note)}" placeholder="What for" aria-label="Expense note"><input data-exa="${i}" type="number" min="0" value="${x.amt || ""}" placeholder="Rs" aria-label="Expense amount"><button type="button" class="ibtn sm" data-exdel="${i}" aria-label="Remove expense">${ico("x")}</button></div>`;
  const lists = () => { $("#crList", v).innerHTML = c.credit.map(crRow).join("") || '<span class="mut sm">None this shift</span>'; $("#exList", v).innerHTML = c.exp.map(exRow).join("") || '<span class="mut sm">None this shift</span>'; };
  const paint = () => {

    NOZZLES.forEach(([n, f]) => { const l = c.close[n] !== undefined ? Math.max(0, c.close[n] - c.open[n]) : 0; $(`[data-lit="${n}"]`, v).textContent = num(l, 1); $(`[data-amt="${n}"]`, v).textContent = rs(Math.round(l * S.set.price[f])); });
    c.price = { ...S.set.price };
    const sales = salesOf(c), cr = sum(c.credit.map((x) => +x.amt || 0)), ex = sum(c.exp.map((x) => +x.amt || 0)), expected = Math.round(sales - c.card - cr - ex);

    else if (t.id === "staffBtn") staffForm();
    else if (t.id === "closeShift") closeShift(v, read);
  });
  lists(); paint();
});
function closeShift(v, read) {
  const c = S.cur, bad = read();
  const missing = NOZZLES.filter(([n]) => c.close[n] === undefined).map(([n]) => n);
  if (missing.length) { toast(`Enter closing meters for ${missing.join(", ")}`, { type: "bad" }); const i = $(`[data-nz="${missing[0]}"]`, v); i && i.focus(); return; }
  if (bad) { toast("A closing meter is lower than its opening. Check the red box.", { type: "bad" }); return; }
  if (c.counted === "" || !(+c.counted >= 0)) { toast("Count the cash in the drawer first", { type: "bad" }); $("#counted", v).focus(); return; }
  if (c.credit.some((x) => !(+x.amt > 0)) || c.exp.some((x) => !(+x.amt > 0) || !x.note.trim())) { toast("Fill or remove the empty credit or expense lines", { type: "bad" }); return; }
  const sales = salesOf(c), cr = sum(c.credit.map((x) => +x.amt)), ex = sum(c.exp.map((x) => +x.amt)), expected = Math.round(sales - c.card - cr - ex), diff = Math.round(+c.counted - expected);
  ask(`${c.shift} shift: ${L(litres(c), 1)} sold for ${rs(sales)}. Drawer ${diff === 0 ? "balanced" : diff < 0 ? "short by " + rs(-diff) : "excess by " + rs(diff)}. Close and hand over?`, { title: "Close the shift", ok: "Close shift", safe: true }).then((ok) => {
    if (!ok) return;
    const id = "SH-" + (Math.max(4100, ...S.shifts.map((s) => +s.id.slice(3))) + 1);
    const rec = { id, date: c.date, shift: c.shift, staff: c.staff.slice(), open: { ...c.open }, close: { ...c.close }, tests: { ...c.tests }, price: { ...S.set.price }, card: c.card, credit: c.credit.map((x) => ({ ...x })), exp: c.exp.map((x) => ({ ...x })), expected, counted: +c.counted, diff, closedBy: c.staff[0] };
    S.shifts.push(rec);
    rec.credit.forEach((x) => S.cred.push({ id: uid("CR"), date: c.date, party: x.party, kind: "Fuel on credit", amt: x.amt, ref: c.shift + " shift" }));
    FK.forEach((f) => (S.stock[f] = Math.max(0, S.stock[f] - netLitres(rec, f))));
    const order = SHIFTS.map((s) => s[0]), nx = order[(order.indexOf(c.shift) + 1) % 3];
    S.cur = { date: nx === "Morning" ? iso(addD(c.date, 1)) : c.date, shift: nx, staff: [S.staff[1].id, S.staff[4].id], open: { ...c.close }, close: {}, tests: { Petrol: S.set.test, "Hi-Octane": S.set.test, Diesel: S.set.test }, card: 0, credit: [], exp: [], counted: "" };
    afterChange(`${rec.shift} shift closed. ${nx} shift opened with the closing meters.`, { type: diff < 0 ? "warn" : "ok" });
    setTimeout(() => report(id), 300);
  });
}

});

/* Settings: station, prices, test litres */
Router.add("settings", "Settings", (v) => {
  const s = S.set;
  v.innerHTML = `<div class="ph"><div><h1>Settings</h1><p class="mut">Prices change every fortnight. New prices apply from the running shift.</p></div></div>
  <form class="card" id="setForm" novalidate><h3>Station and prices</h3><div class="fgrid c3">${fld("Station name", "name", { value: s.name })}${fld("City", "city", { value: s.city })}${fld("Test litres per fuel (morning)", "test", { type: "number", value: s.test, min: 0 })}${FK.map((f, i) => fld(f + " price (Rs per litre)", "p" + i, { type: "number", value: s.price[f], step: 0.01, min: 1 })).join("")}</div><div class="m-f"><button type="submit" class="btn pri">Save settings</button></div></form>
  <div class="card"><h3>Look and data</h3><div class="set-actions" style="margin-top:10px"><button type="button" class="btn ghost" data-do="theme">${ico("moon")} Switch light or dark</button><button type="button" class="btn ghost" data-do="csv">${ico("doc")} Download shifts (CSV)</button><button type="button" class="btn danger" data-do="reset">${ico("refresh")} Reset demo data</button></div><p class="hint">Changes stay in this browser when storage is allowed.</p></div>`;
  $("#setForm", v).addEventListener("submit", (e) => {
    e.preventDefault(); const f = e.target, d = Object.fromEntries(new FormData(f)); clearErrs(f);
    const pr = [[(x) => +x >= 50 && +x <= 1000, "Use a price between 50 and 1000"]], er = check(d, { name: [REQ("Enter the station name")], city: [REQ("Enter the city")], test: [[(x) => x !== "" && +x >= 0 && +x <= 50, "Use 0 to 50"]], p0: pr, p1: pr, p2: pr });
    if (Object.keys(er).length) return showErrs(f, er);
    Object.assign(S.set, { name: d.name.trim(), city: d.city.trim(), test: +d.test }); FK.forEach((fu, i) => (S.set.price[fu] = +(+d["p" + i]).toFixed(2)));
    afterChange("Settings saved");
  });
});

/* ======================= Forms, reports and drawers ======================= */
function report(id) {
  const s = S.shifts.find((x) => x.id === id); if (!s) return;
  const cr = sum(s.credit.map((x) => x.amt)), ex = sum(s.exp.map((x) => x.amt));
  const m = modal({ title: `Handover · ${s.id}`, cls: "wide", body: `<div class="report"><div class="row sp wrap"><div><b>${esc(S.set.name)}</b><div class="mut sm">${fdy(s.date)} · ${s.shift} shift · ${s.staff.map((x) => esc(staffOf(x).name)).join(", ")}</div></div><span class="stamp2 ${s.diff < 0 ? "bad" : s.diff > 0 ? "warn" : "ok"}">${s.diff === 0 ? "Balanced" : (s.diff < 0 ? "Short " : "Excess ") + num(Math.abs(s.diff))}</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Nozzle</th><th>Fuel</th><th class="num">Opening</th><th class="num">Closing</th><th class="num">Litres</th></tr></thead><tbody>${NOZZLES.map(([n, f]) => `<tr><td>${n}</td><td>${fuelTag(f)}</td><td class="num">${num(s.open[n], 1)}</td><td class="num">${num(s.close[n], 1)}</td><td class="num">${num(s.close[n] - s.open[n], 1)}</td></tr>`).join("")}</tbody></table></div>
    <table><tbody>${FK.map((f) => `<tr><td>${f}: ${L(netLitres(s, f), 1)} after ${s.tests[f] || 0} L test × ${num(s.price[f], 2)}</td><td class="num">${rs(Math.round(netLitres(s, f) * s.price[f]))}</td></tr>`).join("")}<tr><td><b>Fuel sales</b></td><td class="num"><b>${rs(salesOf(s))}</b></td></tr><tr><td>Card</td><td class="num">− ${rs(s.card)}</td></tr><tr><td>Credit (${s.credit.map((x) => esc(partyOf(x.party).name)).join(", ") || "none"})</td><td class="num">− ${rs(cr)}</td></tr><tr><td>Expenses (${s.exp.map((x) => esc(x.note)).join(", ") || "none"})</td><td class="num">− ${rs(ex)}</td></tr><tr><td><b>Cash expected</b></td><td class="num"><b>${rs(s.expected)}</b></td></tr><tr><td>Cash counted</td><td class="num">${rs(s.counted)}</td></tr></tbody></table></div>`, foot: `<button type="button" class="btn ghost" data-close>Close</button><button type="button" class="btn pri" data-print>${ico("print")} Print</button>` });
  $("[data-print]", m.el).onclick = () => { try { window.print(); } catch (e) { toast("Printing is not available here", { type: "warn" }); } };
}
function dipForm() {
  modal({
    title: "Record a dip", submit: "Save dip",
    body: `<div class="fgrid">${fld("Fuel", "fuel", { opts: FK })}${fld("Dip reading (cm)", "cm", { type: "number", step: 0.1, min: 0 })}</div><p class="note ok" data-dp style="margin-top:12px">Enter the dip to see the litres.</p>`,
    onOpen: (box) => { const E = $("form", box).elements, n = $("[data-dp]", box); const u = () => { const f = E.fuel.value, cm = +E.cm.value; if (!(cm > 0)) { n.textContent = `Book stock is ${L(Math.round(S.stock[f]))} (about ${dipFor(f, S.stock[f])} cm).`; return; } const l = litresAt(f, cm), g = l - Math.round(S.stock[f]); n.textContent = `${cm} cm = ${L(l)}. Book stock ${L(Math.round(S.stock[f]))}, so a ${g >= 0 ? "gain" : "loss"} of ${L(Math.abs(g))}.`; n.className = "note " + (Math.abs(g) > 150 ? "bad" : "ok"); }; E.fuel.addEventListener("change", u); E.cm.addEventListener("input", u); u(); },
    onSubmit: (d) => { const er = check(d, { cm: [POS("Enter the dip in cm"), [(x) => +x <= FUELS[d.fuel].d, `The tank is only ${FUELS[d.fuel].d} cm deep`]] }); if (Object.keys(er).length) return er; S.dips.push({ id: uid("DP"), date: TODAY, fuel: d.fuel, cm: +(+d.cm).toFixed(1), book: Math.round(S.stock[d.fuel]) }); const l = litresAt(d.fuel, +d.cm); S.stock[d.fuel] = l; afterChange(`${d.fuel} dip saved: ${L(l)}. Book stock now matches the tank.`); },
  });
}
function tankerForm() {
  modal({
    title: "Tanker received", submit: "Save delivery",
    body: `<div class="fgrid">${fld("Fuel", "fuel", { opts: FK })}${fld("Tanker number", "tanker", { ph: "TLR-482" })}${fld("Invoice litres", "invoice", { type: "number", min: 1, value: 12000 })}${fld("Dip after unloading (cm)", "after", { type: "number", step: 0.1, min: 0 })}</div><p class="note" data-tk style="margin-top:12px"></p>`,
    onOpen: (box) => { const E = $("form", box).elements, n = $("[data-tk]", box); const u = () => { const f = E.fuel.value, room = FUELS[f].cap - Math.round(S.stock[f]); if (!E.after.value) { n.textContent = `Room in the tank: ${L(room)}. Dip after unloading to check the tanker.`; n.className = "note"; return; } const rec = litresAt(f, +E.after.value) - Math.round(S.stock[f]), short = (+E.invoice.value || 0) - rec; n.textContent = `Received by dip: ${L(rec)}. ${short > 0 ? "Short by " + L(short) + "." : "Full delivery."}`; n.className = "note " + (short > 60 ? "bad" : "ok"); }; $("form", box).addEventListener("input", u); $("form", box).addEventListener("change", u); u(); },
    onSubmit: (d) => {
      const er = check(d, { tanker: [REQ("Enter the tanker number")], invoice: [POS("Enter the invoice litres")], after: [POS("Dip the tank after unloading"), [(x) => +x <= FUELS[d.fuel].d, `The tank is only ${FUELS[d.fuel].d} cm deep`]] });
      if (!er.after) { const rec = litresAt(d.fuel, +d.after) - Math.round(S.stock[d.fuel]); if (rec <= 0) er.after = "The dip is lower than the stock before the delivery"; }
      if (Object.keys(er).length) return er;
      const rec = litresAt(d.fuel, +d.after) - Math.round(S.stock[d.fuel]);
      S.deliveries.push({ id: uid("TK"), date: TODAY, fuel: d.fuel, invoice: Math.round(+d.invoice), received: rec, tanker: d.tanker.trim().toUpperCase(), dipBefore: dipFor(d.fuel, S.stock[d.fuel]) });
      S.stock[d.fuel] = litresAt(d.fuel, +d.after);
      afterChange(`${d.fuel} tanker saved: ${L(rec)} received${+d.invoice - rec > 0 ? ", short " + L(+d.invoice - rec) : ""}`, { type: +d.invoice - rec > 60 ? "warn" : "ok" });
    },
  });
}
function staffForm() {
  modal({
    title: "Who is on this shift?", submit: "Save",
    body: `<div class="fgrid">${fld("Shift manager", "a", { opts: S.staff.map((s) => [s.id, s.name]), value: S.cur.staff[0] })}${fld("Pump attendant", "b", { opts: S.staff.map((s) => [s.id, s.name]), value: S.cur.staff[1] })}</div>`,
    onSubmit: (d) => { if (d.a === d.b) return { b: "Pick two different people" }; S.cur.staff = [d.a, d.b]; afterChange("Shift staff updated"); },
  });
}
function partyForm() {
  modal({ title: "New credit account", submit: "Open account", body: `<div class="fgrid">${fld("Name", "name", { ph: "Business or person" })}${fld("Mobile", "phone", { type: "tel", ph: "0300-1234567" })}${fld("Credit limit (Rs)", "limit", { type: "number", min: 1000, value: 100000 })}</div>`, onSubmit: (d) => { const er = check(d, { name: [REQ("Enter the name")], phone: [PHONE], limit: [[(x) => +x >= 1000, "At least Rs 1,000"]] }); if (Object.keys(er).length) return er; S.credit.push({ id: "CP" + (Math.max(0, ...S.credit.map((x) => +x.id.slice(2))) + 1), name: d.name.trim(), phone: d.phone.trim(), limit: Math.round(+d.limit) }); afterChange(`${d.name.trim()} can now buy on credit`); } });
}
function receiveForm(pid) {
  modal({
    title: "Receive a payment", submit: "Save payment",
    body: `<div class="fgrid">${fld("Account", "party", { opts: S.credit.map((p) => [p.id, `${p.name} · owes ${rs(Math.max(0, partyBal(p.id)))}`]), value: pid || S.credit[0].id })}${fld("Amount (Rs)", "amt", { type: "number", min: 1 })}${fld("Reference", "ref", { value: "Cash at office" })}</div>`,
    onOpen: (box) => { const E = $("form", box).elements; const u = () => (E.amt.value = Math.max(0, partyBal(E.party.value))); E.party.addEventListener("change", u); u(); },
    onSubmit: (d) => { const owe = Math.max(0, partyBal(d.party)), er = check(d, { amt: [POS("Enter the amount"), [(x) => +x <= owe, `This account owes ${rs(owe)}`]] }); if (Object.keys(er).length) return er; S.cred.push({ id: uid("CR"), date: TODAY, party: d.party, kind: "Payment received", amt: Math.round(+d.amt), ref: d.ref.trim() }); afterChange(`${rs(+d.amt)} received from ${partyOf(d.party).name}`); },
  });
}
function openParty(id) {
  const p = partyOf(id), L3 = S.cred.filter((c) => c.party === id).sort((a, b) => (a.date < b.date ? 1 : -1));
  const m = modal({ drawer: true, title: p.name, body: `<dl class="facts"><dt>Mobile</dt><dd>${esc(p.phone || "")}</dd><dt>Limit</dt><dd>${rs(p.limit)}</dd><dt>Owes now</dt><dd><b>${rs(Math.max(0, partyBal(id)))}</b></dd></dl><div class="cashbox">${L3.map((c) => `<div class="line"><span>${fd(c.date)} · ${esc(c.kind)} <small class="mut">${esc(c.ref)}</small></span><b>${c.kind === "Fuel on credit" ? "+" : "−"} ${rs(c.amt)}</b></div>`).join("") || '<div class="empty-st">No entries.</div>'}</div>`, foot: `<button type="button" class="btn ghost" data-close>Close</button><button type="button" class="btn pri" data-pay>${ico("wallet")} Receive payment</button>` });
  $("[data-pay]", m.el).onclick = () => { m.close(); receiveForm(id); };
}
function openTank(f) {
  const d = lastDip(f), del = S.deliveries.filter((x) => x.fuel === f).slice(-4).reverse();
  modal({ drawer: true, title: f + " tank", body: `<div class="tank" style="pointer-events:none">${tankSvg(f, S.stock[f], !RM)}</div><dl class="facts"><dt>Capacity</dt><dd>${L(FUELS[f].cap)} · ${FUELS[f].d} cm deep</dd><dt>Book stock</dt><dd>${L(Math.round(S.stock[f]))}</dd><dt>Last dip</dt><dd>${d ? `${d.cm} cm on ${fd(d.date)}` : "none"}</dd><dt>Selling</dt><dd>about ${L(Math.round(avgDaily(f)))} a day</dd><dt>Order by</dt><dd>${fdy(addD(today(), Math.max(0, Math.floor((S.stock[f] - FUELS[f].cap * 0.2) / avgDaily(f)))))}</dd></dl><h3>Recent tankers</h3><div class="cashbox">${del.map((x) => `<div class="line"><span>${fd(x.date)} · ${esc(x.tanker)}</span><b>${L(x.received)}</b></div>`).join("") || '<div class="empty-st">None yet.</div>'}</div>`, foot: `<button type="button" class="btn ghost" data-close>Close</button>` });
}

/* ======================= Global wiring ======================= */
const DO = {
  dip: () => dipForm(), tanker: () => tankerForm(), party: () => partyForm(), receive: () => receiveForm(), theme: () => Theme.toggle(),
  addStaff: () => modal({ title: "Add staff", submit: "Add", body: `<div class="fgrid">${fld("Name", "name")}${fld("Mobile", "phone", { type: "tel", ph: "0300-1234567" })}${fld("Role", "role", { opts: ["Pump attendant", "Shift manager", "Cashier"] })}</div>`, onSubmit: (d) => { const er = check(d, { name: [REQ("Enter the name")], phone: [PHONE] }); if (Object.keys(er).length) return er; S.staff.push({ id: "S" + (Math.max(0, ...S.staff.map((x) => +x.id.slice(1))) + 1), name: d.name.trim(), phone: d.phone.trim(), role: d.role }); afterChange(`${d.name.trim()} added`); } }),
  csv: () => {
    if (!window.Blob || !URL.createObjectURL) return toast("Downloads are not available here", { type: "warn" });
    const rows = [["Shift", "Date", "Time", "Manager", ...FK.map((f) => f + " litres"), "Sales", "Card", "Credit", "Expenses", "Expected cash", "Counted", "Short/excess"], ...S.shifts.map((s) => [s.id, s.date, s.shift, staffOf(s.staff[0]).name, ...FK.map((f) => netLitres(s, f).toFixed(1)), salesOf(s), s.card, sum(s.credit.map((x) => x.amt)), sum(s.exp.map((x) => x.amt)), s.expected, s.counted, s.diff])];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" })); a.download = "nozzle-shifts.csv"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); toast("Shifts CSV downloaded");
  },
  reset: async () => { if (!(await ask("Reset shifts, tanks and accounts to the sample station?", { title: "Reset demo data", ok: "Reset" }))) return; S = Store.reset(); Bell.read.clear(); afterChange("Demo data reset"); },
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (d && DO[d.dataset.do]) return DO[d.dataset.do](d);
  const r = e.target.closest("[data-report]"); if (r) return report(r.dataset.report);
  const p = e.target.closest("[data-party]"); if (p) return openParty(p.dataset.party);
  const t = e.target.closest("button[data-tank]"); if (t) openTank(t.dataset.tank);
});
APP.notes = () => {
  const out = [];
  FK.forEach((f) => { const days = S.stock[f] / avgDaily(f); if (days < 3) out.push({ id: "low" + f + Math.round(S.stock[f]), t: `${f} stock low`, d: `${L(Math.round(S.stock[f]))} left, about ${days.toFixed(1)} days`, go: "#/tanks" }); });
  S.shifts.slice(-6).filter((s) => s.diff < -500).forEach((s) => out.push({ id: "short" + s.id, t: `${s.id} short by ${rs(-s.diff)}`, d: `${s.shift} shift, ${fd(s.date)}`, go: "#/handover" }));
  S.credit.forEach((p) => { const b = partyBal(p.id); if (b > p.limit * 0.85) out.push({ id: "lim" + p.id + b, t: `${p.name} near the credit limit`, d: `${rs(b)} of ${rs(p.limit)}`, go: "#/cash" }); });
  return out.slice(0, 9);
};
APP.cmds = () => [{ label: "Open shift entry", run: () => Router.go("shift") }, { label: "Record a dip", run: DO.dip }, { label: "Tanker received", run: DO.tanker }, { label: "Receive a credit payment", run: DO.receive }, { label: "Switch light or dark theme", run: DO.theme }, ...S.shifts.slice(-15).reverse().map((s) => ({ label: `${s.id} · ${fd(s.date)} ${s.shift}`, hint: "Shift report", run: () => report(s.id) })), ...S.credit.map((p) => ({ label: p.name, hint: "Credit account", run: () => openParty(p.id) }))];
paintHead();
Live.every(1000, tick, true); tick();
boot();
</script>
</body>
