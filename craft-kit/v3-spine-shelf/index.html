<!doctype html>
<!-- Chill & Craft · Spine Shelf · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spine Shelf · bookshelf site menu</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: a walnut shelf, jewel-coloured cloth spines, cream pages ---------- */
  :root {
    color-scheme: light;
    --bg: #efe3d3;
    --bg2: #e2cdb2;
    --wall: #f3e9dc;
    --wall2: #e9dac6;
    --card: #fbf5ec;
    --rule: #e4d3bd;
    --ink: #2b1c12;
    --ink2: #6e5847;
    --soft: #a88f79;
    --wood1: #9a6639;
    --wood2: #6f4324;
    --wood3: #b67e4b;
    --paper: #fffaf1;
    --paper2: #f3e8d4;
    --gutter: #e2d2b6;
    --desk: #dcc6a7;
    --gold: #e7c878;
    --lamp: rgba(255, 210, 130, .55);
    --shadow: rgba(70, 40, 15, .28);
    --focus: #b6452a;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #120c08;
    --bg2: #24170e;
    --wall: #1d140d;
    --wall2: #261a11;
    --card: #1a120c;
    --rule: #3a2a1c;
    --ink: #f6e9d8;
    --ink2: #c9b097;
    --soft: #8b735e;
    --wood1: #6b4325;
    --wood2: #45291a;
    --wood3: #82552f;
    --paper: #30261c;
    --paper2: #2a2018;
    --gutter: #1f1811;
    --desk: #2a1d13;
    --gold: #e9cb7e;
    --lamp: rgba(255, 190, 100, .34);
    --shadow: rgba(0, 0, 0, .6);
    --focus: #ffab7a;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: radial-gradient(70% 60% at 50% 0%, var(--bg2), transparent 70%), var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px 14px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .app {
    --k: .92;
    position: relative;
    width: min(860px, 100%);
    padding: 14px 16px 16px;
    border-radius: 28px;
    background: linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 85%, var(--bg2)));
    box-shadow: 0 44px 90px -50px var(--shadow), 0 0 0 1px var(--rule);
  }
  .fly { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

  /* ---------- Header ---------- */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .mono { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #8e2b2f; color: var(--gold); font: italic 700 18px var(--serif); box-shadow: inset 0 0 0 2px rgba(231, 200, 120, .55), 0 10px 18px -12px var(--shadow); }
  .brand b { display: block; font: 700 18px var(--serif); letter-spacing: -.01em; }
  .brand small { display: block; color: var(--ink2); font-size: 12.5px; }
  .lampbtn {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 13px 8px 10px; border: 0; border-radius: 999px;
    background: var(--wall); box-shadow: inset 0 0 0 1px var(--rule);
    font-size: 13px; font-weight: 700; color: var(--ink2);
    transition: transform .3s var(--spring), background .3s;
  }
  .lampbtn:active { transform: scale(.94); }
  .lampbtn svg { width: 20px; height: 20px; }
  .lampbtn .bulb { fill: var(--soft); transition: fill .3s; }
  .lampbtn[aria-pressed="true"] .bulb { fill: #ffc94d; filter: drop-shadow(0 0 5px #ffc94d); }

  /* ---------- The shelf: spines on a walnut plank ---------- */
  .shelf {
    position: relative; overflow: hidden;
    padding: 16px 14px 0; border-radius: 20px;
    background: radial-gradient(60% 90% at 30% 0%, var(--lamp), transparent 70%), linear-gradient(180deg, var(--wall), var(--wall2));
    box-shadow: inset 0 0 0 1px var(--rule), inset 0 18px 30px -24px var(--shadow);
    transition: background .5s;
  }
  .app.dark-room .shelf { background: linear-gradient(180deg, var(--wall2), color-mix(in srgb, var(--wall2) 70%, #000)); }
  .motes i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: 0; animation: mote 7s ease-in-out infinite; pointer-events: none; }
  @keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .7; } 100% { opacity: 0; transform: translate(26px, -46px); } }
  .app.dark-room .motes { display: none; }
  .row { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3px; min-height: calc(190px * var(--k)); }
  .spine {
    --w: 44; --h: 168; --c: #8e2b2f; --tx: #f2dca0;
    position: relative; flex: none;
    width: calc(var(--w) * var(--k) * 1px); height: calc(var(--h) * var(--k) * 1px);
    padding: 0; border: 0; border-radius: 5px 5px 2px 2px;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, .36), rgba(0, 0, 0, 0) 16%, rgba(255, 255, 255, .18) 40%, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, .32)),
      var(--c);
    color: var(--tx);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18), 0 2px 0 rgba(0, 0, 0, .1);
    transform-origin: 50% 100%;
    transition: transform .55s var(--spring), box-shadow .3s;
  }
  .spine::before, .spine::after { content: ""; position: absolute; left: 3px; right: 3px; height: 7px; border-top: 1.5px solid var(--tx); border-bottom: 1.5px solid var(--tx); opacity: .75; }
  .spine::before { top: 9%; }
  .spine::after { bottom: 8%; }
  .spine .t {
    position: absolute; left: 0; right: 0; top: 19%; bottom: 17%;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; white-space: nowrap; overflow: hidden;
    font: 700 calc(13.5px * var(--k)) var(--serif); letter-spacing: .04em;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .35);
  }
  .spine .gem { position: absolute; left: 50%; bottom: 13%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--tx); opacity: .8; }
  .spine:hover { transform: translateY(-9px) rotate(-1.5deg); }
  .spine.lean-r { transform-origin: 100% 100%; transform: rotate(7deg); }
  .spine.lean-l { transform-origin: 0 100%; transform: rotate(-7deg); }
  .spine.lean-r:hover { transform: rotate(4deg) translateY(-4px); }
  .spine.lean-l:hover { transform: rotate(-4deg) translateY(-4px); }
  .spine:focus-visible { outline-offset: 4px; }
  /* the book on the stand leaves an empty, dusty slot */
  .spine.out { background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--soft) 70%, transparent); transform: none; }
  .spine.out::before, .spine.out::after, .spine.out .t, .spine.out .gem { opacity: 0; }
  .spine.out .mark { opacity: 1; transform: translate(-50%, 0); }
  .mark { position: absolute; left: 50%; bottom: 10px; width: 12px; height: 34px; transform: translate(-50%, 10px); opacity: 0; transition: opacity .3s, transform .5s var(--spring); background: var(--focus); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
  .deco { flex: none; align-self: flex-end; }
  .plant { width: calc(54px * var(--k)); height: calc(96px * var(--k)); }
  .plant .lf { transform-box: fill-box; transform-origin: 50% 100%; animation: leaf 5s ease-in-out infinite; }
  .plant .lf:nth-of-type(2) { animation-delay: -1.6s; }
  .plant .lf:nth-of-type(3) { animation-delay: -3.1s; }
  @keyframes leaf { 50% { transform: rotate(5deg); } }
  .bookend { width: calc(20px * var(--k)); height: calc(120px * var(--k)); }
  .plank {
    position: relative; z-index: 2; height: 20px; margin: 0 -14px; border-radius: 3px;
    background:
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0) 0 37px, rgba(0, 0, 0, .06) 37px 39px, rgba(255, 255, 255, .05) 39px 52px),
      linear-gradient(180deg, var(--wood3), var(--wood1) 35%, var(--wood2));
    box-shadow: 0 12px 18px -10px var(--shadow);
  }
  .plank::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255, 255, 255, .25); }

  /* ---------- The open book on its stand ---------- */
  .stand { position: relative; margin-top: 12px; padding: 10px 0 16px; overflow: hidden; border-radius: 20px; }
  .stand::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58%; border-radius: 20px; background: linear-gradient(180deg, transparent, var(--desk)); }
  .stand::after { content: ""; position: absolute; left: 50%; top: -30%; width: 80%; height: 120%; transform: translateX(-50%); background: radial-gradient(closest-side, var(--lamp), transparent); opacity: .7; pointer-events: none; transition: opacity .5s; }
  .app.dark-room .stand::after { opacity: 0; }
  .book { --bc: #8e2b2f; position: relative; z-index: 1; width: min(650px, calc(100% - 20px)); height: 316px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; perspective: 1900px; }
  .bl, .br { position: absolute; top: -7px; bottom: -7px; background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(0, 0, 0, .18)), var(--bc); box-shadow: 0 26px 30px -22px var(--shadow); }
  .bl { left: -7px; width: calc(50% + 7px); border-radius: 9px 0 0 9px; }
  .br { right: -7px; width: calc(50% + 7px); border-radius: 0 9px 9px 0; }
  .lpage, .rpage { position: relative; overflow: hidden; }
  .lpage { border-radius: 4px 0 0 4px; background: linear-gradient(90deg, var(--paper2), var(--paper) 10%, var(--paper) 84%, var(--gutter)); }
  .rpage { border-radius: 0 4px 4px 0; padding: 20px 24px 18px 26px; background: linear-gradient(90deg, var(--gutter), var(--paper) 12%, var(--paper) 94%, var(--paper2)); }
  .ribbon { position: absolute; right: 26px; top: -7px; width: 13px; height: 64px; background: linear-gradient(90deg, #a3262c, #d0423f); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); transform-origin: 50% 0; animation: rib 4.5s ease-in-out infinite; z-index: 2; }
  @keyframes rib { 50% { transform: rotate(4deg); } }
  .lid { position: absolute; z-index: 5; left: 50%; top: -7px; bottom: -7px; width: calc(50% + 7px); transform-origin: 0 50%; transform-style: preserve-3d; transform: rotateY(-178deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .front {
    border-radius: 0 9px 9px 0; padding: 26px 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px;
    background: linear-gradient(90deg, rgba(0, 0, 0, .3), rgba(0, 0, 0, 0) 9%, rgba(255, 255, 255, .1) 50%, rgba(0, 0, 0, .14)), var(--bc);
    color: var(--btx, #f2dca0);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2);
  }
  .front::before { content: ""; position: absolute; inset: 14px; border: 1.5px solid currentColor; border-radius: 4px; opacity: .55; }
  .front b { font: 700 26px var(--serif); letter-spacing: .01em; }
  .front small { font: italic 14px var(--serif); opacity: .85; }
  .front .orn { width: 46px; height: 14px; }
  .back {
    transform: rotateY(180deg); border-radius: 9px 0 0 9px; padding: 22px 22px 20px 26px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px;
    background:
      radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--bc) 22%, transparent) 0 18%, transparent 19%),
      radial-gradient(circle at 75% 70%, color-mix(in srgb, var(--bc) 18%, transparent) 0 22%, transparent 23%),
      radial-gradient(circle at 60% 15%, color-mix(in srgb, var(--bc) 14%, transparent) 0 12%, transparent 13%),
      linear-gradient(90deg, var(--paper2), var(--paper) 14%, var(--paper) 86%, var(--gutter));
    background-size: 46px 46px, 52px 52px, 38px 38px, 100% 100%;
    color: var(--ink);
  }
  .plate { padding: 16px 22px; border-radius: 10px; background: var(--paper); box-shadow: 0 0 0 1px var(--rule), 0 0 0 5px var(--paper), 0 0 0 6px color-mix(in srgb, var(--bc) 50%, transparent); }
  .plate small { display: block; font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); }
  .plate b { display: block; margin: 4px 0; font: 700 25px var(--serif); color: var(--bc); }
  :root[data-theme="dark"] .plate b { color: var(--gold); }
  .plate span { font: italic 13px var(--serif); color: var(--ink2); }

  /* page text */
  .kick { margin: 0 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
  .rpage h2 { margin: 0 0 8px; font: 700 22px/1.15 var(--serif); letter-spacing: -.01em; }
  .rpage p { margin: 0 0 10px; font: 14px/1.55 var(--serif); color: var(--ink2); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--rule); font: 14px/1.35 var(--serif); }
  .list li span { flex: none; color: var(--ink2); font: 12px var(--sans); }
  .facts { display: flex; gap: 8px; margin-top: 10px; }
  .facts div { flex: 1; padding: 8px 6px; border-radius: 10px; text-align: center; background: color-mix(in srgb, var(--bc) 10%, transparent); font-size: 12px; color: var(--ink2); }
  .facts b { display: block; font: 700 22px var(--serif); color: var(--ink); }
  .form { display: grid; gap: 7px; }
  .form label { font-size: 12px; font-weight: 700; color: var(--ink2); }
  .form input, .form textarea { width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 70%, #fff); font: 14px var(--serif); resize: none; }
  :root[data-theme="dark"] .form input, :root[data-theme="dark"] .form textarea { background: var(--paper2); }
  .form input:focus-visible, .form textarea:focus-visible { outline-offset: 1px; }
  .form .bad { animation: shake .42s; border-color: var(--focus); }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .send { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-radius: 999px; background: var(--bc); color: #fff; font-weight: 750; font-size: 13.5px; transition: transform .3s var(--spring); }
  .send:active { transform: scale(.95); }
  .send .seal { width: 14px; height: 14px; border-radius: 50%; background: #e0b84f; box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .15); }
  .send.work .seal { animation: spin .8s linear infinite; border-radius: 40% 60% 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { min-height: 1.3em; margin: 0; font-size: 12.5px; color: var(--ink2); }

  .flyer { position: absolute; border-radius: 5px; overflow: hidden; background: linear-gradient(90deg, rgba(0, 0, 0, .3), rgba(0, 0, 0, 0) 14%, rgba(255, 255, 255, .14) 45%, rgba(0, 0, 0, .2)), var(--c); color: var(--tx); box-shadow: 0 30px 40px -24px rgba(0, 0, 0, .55); will-change: left, top, width, height, transform; }
  .flyer > div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  .f-spine span { writing-mode: vertical-rl; font: 700 13.5px var(--serif); letter-spacing: .04em; white-space: nowrap; }
  .f-cover { flex-direction: column; gap: 6px; opacity: 0; }
  .f-cover b { font: 700 24px var(--serif); white-space: nowrap; }
  .f-cover small { font: italic 13px var(--serif); white-space: nowrap; opacity: .85; }
  .puff { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--soft) 60%, transparent); pointer-events: none; }

  @media (max-width: 620px) {
    .app { --k: .8; padding: 14px 12px 16px; border-radius: 22px; }
    .book { grid-template-columns: minmax(0, 1fr); width: calc(100% - 24px); height: 340px; }
    .lpage, .bl { display: none; }
    .br { left: -7px; width: auto; border-radius: 9px; }
    .rpage { border-radius: 4px; padding: 18px 20px; }
    .lid { left: 0; width: calc(100% + 7px); }
    .plant { display: none; }
    .lampbtn span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="app" id="app" aria-labelledby="who">
    <header class="bar">
      <div class="brand">
        <span class="mono" aria-hidden="true">H</span>
        <div><b id="who">Hina Qureshi</b><small>Writer · Lahore</small></div>
      </div>
      <button class="lampbtn" id="lampBtn" type="button" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path class="bulb" d="M10 2a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 10 2Z"/><rect x="7.4" y="17" width="5.2" height="1.8" rx=".9" fill="currentColor" opacity=".6"/></svg>
        <span>Reading lamp</span>
      </button>
    </header>

    <nav class="shelf" aria-label="Sections, one book each">
      <div class="motes" aria-hidden="true"><i style="left:14%;top:30%"></i><i style="left:28%;top:52%;animation-delay:-2s"></i><i style="left:46%;top:24%;animation-delay:-4s"></i><i style="left:62%;top:46%;animation-delay:-1s"></i><i style="left:78%;top:34%;animation-delay:-5s"></i><i style="left:36%;top:70%;animation-delay:-3s"></i></div>
      <div class="row" id="row">
        <svg class="deco plant" viewBox="0 0 54 96" aria-hidden="true">
          <path class="lf" d="M27 60 C 10 50 6 30 12 14 C 22 26 28 42 27 60 Z" fill="#4f8a55"/>
          <path class="lf" d="M27 60 C 40 46 50 30 46 10 C 34 22 26 40 27 60 Z" fill="#3e7547"/>
          <path class="lf" d="M27 62 C 22 46 26 28 30 20 C 36 34 34 50 27 62 Z" fill="#6aa864"/>
          <path d="M10 60 H44 L40 94 H14 Z" fill="#c4683f"/><rect x="8" y="58" width="38" height="7" rx="2" fill="#d77a4f"/>
        </svg>
        <svg class="deco bookend" viewBox="0 0 20 120" aria-hidden="true"><path d="M2 8 Q2 2 8 2 H12 V112 H20 V120 H2 Z" fill="#7d8790"/><path d="M4 8 Q4 4 8 4 H10 V114 H4 Z" fill="#9aa4ad"/></svg>
      </div>
      <div class="plank" aria-hidden="true"></div>
    </nav>

    <div class="stand">
      <div class="book" id="book">
        <div class="bl" aria-hidden="true"></div><div class="br" aria-hidden="true"></div>
        <div class="lpage" aria-hidden="true"></div>
        <article class="rpage" id="rpage" aria-live="off"></article>
        <span class="ribbon" aria-hidden="true"></span>
        <div class="lid" id="lid" aria-hidden="true">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
    </div>
    <div class="fly" id="fly" aria-hidden="true"></div>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </section>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 40); };

  // ---------- The books: one per section ----------
  const BOOKS = [
    { id: "about",   title: "About Me",      sub: "Who writes here",          c: "#8e2b2f", tx: "#f2dca0", w: 44, h: 166 },
    { id: "essays",  title: "Essays",        sub: "Long reads, small things", c: "#2f5d46", tx: "#f0dfae", w: 50, h: 184 },
    { id: "stories", title: "Short Stories", sub: "Fiction, mostly true",     c: "#25385f", tx: "#e9d49a", w: 46, h: 160 },
    { id: "travel",  title: "Travel Notes",  sub: "North and south",          c: "#c99632", tx: "#3a2410", w: 42, h: 176 },
    { id: "talks",   title: "Talks",         sub: "Where to hear me",         c: "#1e6b70", tx: "#f3e1b0", w: 40, h: 150 },
    { id: "contact", title: "Write to Me",   sub: "Letters welcome",          c: "#5d3466", tx: "#f0d7a8", w: 46, h: 172 }
  ];
  const PAGES = {
    about: '<p class="kick">Chapter 1 · About me</p><h2>Hello, I am Hina.</h2><p>I write about cities, kitchens and the people in between. Born in Multan, at home in Lahore, usually with a notebook and a cup of tea gone cold.</p><div class="facts"><div><b>2</b>books</div><div><b>48</b>essays</div><div><b>9</b>cities</div></div>',
    essays: '<p class="kick">Chapter 2 · Essays</p><h2>Long reads on small things</h2><ul class="list"><li>The last tram of old Karachi<span>12 min</span></li><li>A field guide to wedding tents<span>8 min</span></li><li>Every street has one tailor<span>10 min</span></li><li>Rain on a tin roof<span>6 min</span></li></ul>',
    stories: '<p class="kick">Chapter 3 · Short stories</p><h2>Fiction, mostly true</h2><ul class="list"><li>The kite that would not come down<span>2025</span></li><li>Two tickets to Quetta<span>2024</span></li><li>The night the bakery stayed open<span>2023</span></li></ul><p>New stories arrive about once a season.</p>',
    travel: '<p class="kick">Chapter 4 · Travel notes</p><h2>North and south</h2><ul class="list"><li>Hunza in apricot season<span>Jul</span></li><li>Gwadar at low tide<span>Mar</span></li><li>Skardu by the slow bus<span>Sep</span></li><li>Thar after the first rain<span>Aug</span></li></ul>',
    talks: '<p class="kick">Chapter 5 · Talks</p><h2>Where to hear me</h2><ul class="list"><li>An evening of essays, Lahore<span>12 Dec</span></li><li>Book fair reading, Karachi<span>20 Dec</span></li><li>Online writing workshop<span>8 Jan</span></li></ul><p>Bring questions. I bring the stories.</p>',
    contact: '<p class="kick">Chapter 6 · Write to me</p><h2>Letters welcome</h2><form class="form" id="form" novalidate><label for="nm">Your name</label><input id="nm" name="nm" autocomplete="name" placeholder="Ali Hassan"><label for="msg">Your letter</label><textarea id="msg" name="msg" rows="2" placeholder="Dear Hina,"></textarea><button class="send" type="submit"><span class="seal" aria-hidden="true"></span><span class="lbl">Seal and send</span></button><p class="hint" id="hint"></p></form>'
  };
  const ORN = '<svg class="orn" viewBox="0 0 46 14" aria-hidden="true"><path d="M2 7h14M30 7h14" stroke="currentColor" stroke-width="1.4"/><path d="M23 1l5 6-5 6-5-6z" fill="currentColor"/></svg>';

  const app = $("#app"), row = $("#row"), book = $("#book"), lid = $("#lid"), front = $("#front"), back = $("#back"), rpage = $("#rpage"), fly = $("#fly");
  const lefts = [$(".lpage"), $(".bl")];
  const narrow = () => matchMedia("(max-width: 620px)").matches;

  // ---------- Build the spines (real buttons, roving tab stop) ----------
  const bookend = row.querySelector(".bookend");
  const spines = BOOKS.map((b, k) => {
    const s = document.createElement("button");
    s.type = "button";
    s.className = "spine";
    s.style.cssText = "--w:" + b.w + ";--h:" + b.h + ";--c:" + b.c + ";--tx:" + b.tx;
    s.innerHTML = '<span class="t">' + b.title + '</span><span class="gem"></span><span class="mark"></span>';
    s.setAttribute("aria-label", b.title);
    s.tabIndex = -1;
    s.dataset.k = k;
    row.insertBefore(s, bookend);
    return s;
  });

  // ---------- Small animation helpers (instant when reduced motion is on) ----------
  function play(el, frames, opts) {
    if (reduce) { const last = Object.assign({}, frames[frames.length - 1]); delete last.offset; delete last.easing; Object.assign(el.style, last); return Promise.resolve(); }
    const a = el.animate(frames, Object.assign({ fill: "both" }, opts));
    return a.finished.then(() => { try { a.commitStyles(); } catch (e) { /* element hidden */ } a.cancel(); }).catch(() => {});
  }
  const rel = (r) => { const a = app.getBoundingClientRect(); return { left: r.left - a.left, top: r.top - a.top, width: r.width, height: r.height }; };
  const coverRect = () => { const r = rel(rpage.getBoundingClientRect()); return { left: r.left, top: r.top - 7, width: r.width + 7, height: r.height + 14 }; };

  function setLean(k) {
    spines.forEach((s) => s.classList.remove("lean-l", "lean-r"));
    if (k < 0) return;
    if (spines[k - 1]) spines[k - 1].classList.add("lean-r");
    if (spines[k + 1]) spines[k + 1].classList.add("lean-l");
  }
  function current(k) {
    spines.forEach((s, j) => { if (j === k) s.setAttribute("aria-current", "page"); else s.removeAttribute("aria-current"); });
  }

  // Fill the stand book with a section: cover, endpaper and page
  function dress(k) {
    const b = BOOKS[k];
    book.style.setProperty("--bc", b.c);
    book.style.setProperty("--btx", b.tx);
    front.innerHTML = ORN + "<b>" + b.title + "</b><small>" + b.sub + "</small>" + ORN;
    back.innerHTML = '<div class="plate"><small>Chapter ' + (k + 1) + "</small><b>" + b.title + "</b><span>from the shelf of Hina Qureshi</span></div>";
    rpage.innerHTML = PAGES[b.id];
  }
  function staggerPage(delay) {
    if (reduce) return;
    [...rpage.querySelectorAll(".kick, h2, p, li, .facts div, label, input, textarea, .send")].forEach((el, i) => el.animate(
      [{ transform: "translateY(10px)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 480, delay: delay + i * 55, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }
    ));
  }
  function puff(x, y, n) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const p = document.createElement("i");
      p.className = "puff";
      p.style.left = x + "px"; p.style.top = y + "px";
      fly.appendChild(p);
      const a = Math.PI + (i / (n - 1)) * Math.PI, v = 18 + Math.random() * 22;
      p.animate([{ transform: "translate(-50%,-50%) scale(.4)", opacity: .9 }, { transform: "translate(" + (Math.cos(a) * v - 4) + "px," + (Math.sin(a) * v * .5 - 4) + "px) scale(1.6)", opacity: 0 }], { duration: 640 + Math.random() * 200, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => p.remove();
    }
  }

  // A book that flies between the shelf and the stand, morphing spine <-> cover along a curve
  function flyBook(b, from, to, toCover, dur, arc) {
    const f = document.createElement("div");
    f.className = "flyer";
    f.style.setProperty("--c", b.c); f.style.setProperty("--tx", b.tx);
    f.innerHTML = '<div class="f-spine"><span>' + b.title + '</span></div><div class="f-cover"><b>' + b.title + "</b><small>" + b.sub + "</small></div>";
    fly.appendChild(f);
    const ctrl = { left: (from.left + to.left) / 2, top: Math.min(from.top, to.top) - arc };
    const frames = [];
    for (let i = 0; i <= 6; i++) {
      const t = i / 6, u = 1 - t, sz = toCover ? t * t : 1 - (1 - t) * (1 - t);
      frames.push({
        left: (u * u * from.left + 2 * u * t * ctrl.left + t * t * to.left) + "px",
        top: (u * u * from.top + 2 * u * t * ctrl.top + t * t * to.top) + "px",
        width: (from.width + (to.width - from.width) * sz) + "px",
        height: (from.height + (to.height - from.height) * sz) + "px",
        transform: "perspective(700px) rotateY(" + (Math.sin(t * Math.PI) * (toCover ? -28 : 28)).toFixed(1) + "deg) rotate(" + (Math.sin(t * Math.PI) * (toCover ? -5 : 5)).toFixed(1) + "deg)"
      });
    }
    const a = f.animate(frames, { duration: dur, easing: "cubic-bezier(.45,.05,.35,1)", fill: "both" });
    f.querySelector(".f-spine").animate([{ opacity: toCover ? 1 : 0 }, { opacity: toCover ? 0 : 1 }], { duration: dur * .35, delay: dur * .3, fill: "both" });
    f.querySelector(".f-cover").animate([{ opacity: toCover ? 0 : 1 }, { opacity: toCover ? 1 : 0 }], { duration: dur * .35, delay: dur * .3, fill: "both" });
    return a.finished.then(() => f);
  }

  async function openLid(delay) {
    lid.style.visibility = "visible";
    lefts.forEach((el) => play(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: delay + 340 }));
    await play(lid, [{ transform: "rotateY(0deg)" }, { transform: "rotateY(-186deg)", offset: .78 }, { transform: "rotateY(-178deg)" }], { duration: 980, delay, easing: "cubic-bezier(.35,.55,.35,1)" });
    if (narrow()) lid.style.visibility = "hidden";
  }
  async function closeLid() {
    lid.style.visibility = "visible";
    lefts.forEach((el) => play(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 200, delay: 260 }));
    await play(lid, [{ transform: "rotateY(-178deg)" }, { transform: "rotateY(0deg)" }], { duration: 500, easing: "cubic-bezier(.55,0,.35,1)" });
  }

  // ---------- Choosing a section ----------
  let cur = 0, busy = false, queued = -1;
  async function choose(n) {
    if (busy) { queued = n; return; }
    if (n === cur) { play(book, [{ transform: "none" }, { transform: "translateY(-6px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.34,1.56,.64,1)" }); return; }
    busy = true;
    const C = cur, N = n, bC = BOOKS[C], bN = BOOKS[N], sC = spines[C], sN = spines[N];
    cur = N;
    current(N);
    say("Opening " + bN.title);

    if (reduce) {
      sC.classList.remove("out"); sN.classList.add("out"); setLean(N); dress(N);
      busy = false; return;
    }

    // 1) anticipation: the new spine dips, then slides up out of the row; the open book closes
    const lift = play(sN, [{ transform: getComputedStyle(sN).transform === "none" ? "none" : getComputedStyle(sN).transform }, { transform: "translateY(4px)", offset: .22 }, { transform: "translateY(-22px) rotate(-2deg)" }], { duration: 420, easing: "cubic-bezier(.3,.7,.4,1)" });
    await closeLid();
    await lift;

    // 2) the closed book flies home to its slot; the new one flies down to the stand
    const fromCover = coverRect();
    book.style.opacity = "0";
    setLean(-1);
    const home = flyBook(bC, fromCover, rel(sC.getBoundingClientRect()), false, 760, 70).then((f) => {
      sC.classList.remove("out");
      f.remove();
      play(sC, [{ transform: "translateY(-12px)" }, { transform: "translateY(2px)", offset: .6 }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.3,.8,.4,1)" }).then(() => { sC.style.transform = ""; });
      const r = rel(sC.getBoundingClientRect());
      puff(r.left + r.width / 2, r.top + r.height, 6);
    });
    await sleep(160);
    const start = rel(sN.getBoundingClientRect());
    sN.style.transform = "";
    sN.classList.add("out");
    setLean(N);
    const f = await flyBook(bN, start, coverRect(), true, 820, 40);

    // 3) landing: the stand book takes over closed, with a small squash and a puff of dust
    dress(N);
    lid.style.visibility = "visible";
    lid.style.transform = "rotateY(0deg)";
    lefts.forEach((el) => { el.style.opacity = "0"; });
    book.style.opacity = "1";
    requestAnimationFrame(() => f.remove());
    const cr = coverRect();
    puff(cr.left + 8, cr.top + cr.height, 5);
    puff(cr.left + cr.width - 8, cr.top + cr.height, 5);
    play(book, [{ transform: "scaleY(.975) translateY(3px)" }, { transform: "none" }], { duration: 360, easing: "cubic-bezier(.34,1.56,.64,1)" });

    // 4) the cover swings open with a little overshoot and the page writes itself in
    staggerPage(560);
    await openLid(140);
    await home;
    say(bN.title + " is open");
    busy = false;
    if (queued >= 0) { const q = queued; queued = -1; choose(q); }
  }

  // ---------- Input: click, roving arrow keys ----------
  function rove(k) { spines.forEach((s, j) => { s.tabIndex = j === k ? 0 : -1; }); }
  spines.forEach((s, k) => {
    s.addEventListener("click", () => { rove(k); choose(k); });
    s.addEventListener("keydown", (e) => {
      let to = -1;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") to = (k + 1) % spines.length;
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") to = (k - 1 + spines.length) % spines.length;
      if (e.key === "Home") to = 0;
      if (e.key === "End") to = spines.length - 1;
      if (to < 0) return;
      e.preventDefault(); rove(to); spines[to].focus();
    });
  });

  // ---------- The letter form on the last page ----------
  rpage.addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target, btn = form.querySelector(".send"), lbl = btn.querySelector(".lbl"), hint = form.querySelector("#hint"), msg = form.querySelector("#msg");
    if (btn.disabled) return;
    if (msg.value.trim().length < 4) {
      msg.classList.remove("bad"); void msg.offsetWidth; msg.classList.add("bad");
      hint.textContent = "Write a few words first.";
      msg.focus();
      return;
    }
    btn.disabled = true; btn.classList.add("work"); lbl.textContent = "Sealing…"; hint.textContent = "";
    await sleep(1300);
    btn.classList.remove("work"); lbl.textContent = "Sent ✓";
    const who = form.querySelector("#nm").value.trim();
    hint.textContent = "Thank you" + (who ? ", " + who : "") + ". I read every letter.";
    say("Letter sent");
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 480, easing: "cubic-bezier(.34,1.56,.64,1)" });
    await sleep(2400);
    form.reset(); btn.disabled = false; lbl.textContent = "Seal and send"; hint.textContent = "";
  });
  rpage.addEventListener("input", (e) => { if (e.target.id === "msg") e.target.classList.remove("bad"); });

  // ---------- Reading lamp ----------
  $("#lampBtn").addEventListener("click", (e) => {
    const btn = e.currentTarget, on = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(on));
    app.classList.toggle("dark-room", !on);
    say(on ? "Reading lamp on" : "Reading lamp off");
  });

  // ---------- Start: spines slide onto the shelf, the first book opens ----------
  current(0); rove(0);
  spines[0].classList.add("out");
  setLean(0);
  dress(0);
  lid.style.transform = "rotateY(0deg)";
  lefts.forEach((el) => { el.style.opacity = "0"; });
  if (!reduce) {
    spines.forEach((s, k) => s.animate([{ transform: "translateY(40px)", opacity: 0 }, { opacity: 1, offset: .4 }, { transform: "none", opacity: 1 }], { duration: 620, delay: 60 + k * 70, easing: "cubic-bezier(.34,1.45,.64,1)", fill: "backwards" }));
    book.animate([{ transform: "translateY(24px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 600, easing: "cubic-bezier(.3,.8,.3,1)" });
  }
  staggerPage(700);
  openLid(reduce ? 0 : 380);

  // ---------- Auto demo: pull a few books until you touch anything ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  (async () => {
    await sleep(2300);
    const tour = [1, 3, 5, 2, 4, 0];
    let k = 0;
    while (demo) {
      const n = tour[k++ % tour.length];
      await choose(n);
      await sleep(2600);
    }
  })();
})();
</script>
</body>
</html>
