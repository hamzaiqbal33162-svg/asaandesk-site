<!doctype html>
<!-- Chill & Craft · Simmer · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simmer · recipe card that layers the pot as you cook</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: saffron, clay and mint on rice-paper cream (light), copper night (dark) ---------- */
  :root {
    --bg: #f8eedd; --bg-2: #fff8ec; --card: #fffbf3; --edge: rgba(70, 40, 10, 0.1); --ink: #2e1d0e; --muted: #7b6550; --soft: #f5ead7; --soft-2: #ead9bd;
    --saffron: #f0a41c; --saffron-2: #ffc95a; --clay: #c2552b; --mint: #3c8f5a; --glow: #ffe7b0;
    --pot: #b9c7cf; --pot-line: #5c6b73; --masala: #b4481e; --masala-2: #7c2c10; --rice: #fff7e6; --grain: #e9dcc0; --onion: #8b5427; --herb: #4f9a4d;
    --shadow: rgba(90, 50, 10, 0.28); --focus: #c2552b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #120c07; --bg-2: #1e140c; --card: #1d140d; --edge: rgba(255, 255, 255, 0.08); --ink: #f6ebdc; --muted: #c0a88e; --soft: #281c12; --soft-2: #36271a;
    --saffron: #ffb53a; --saffron-2: #ffd27a; --clay: #ff8152; --mint: #5fd08a; --glow: #5a3a12;
    --pot: #6c7b84; --pot-line: #b3c2ca; --masala: #c4572a; --masala-2: #8a3414; --rice: #f3e8d2; --grain: #d8c6a2; --onion: #9a6230; --herb: #5fae5a;
    --shadow: rgba(0, 0, 0, 0.65); --focus: #ffd27a;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(60% 50% at 25% 15%, var(--bg-2), transparent 70%), radial-gradient(50% 40% at 85% 90%, color-mix(in srgb, var(--saffron) 14%, transparent), transparent 70%), var(--bg); }
  .card { width: min(920px, 100%); display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); border-radius: 30px; background: var(--card); border: 1px solid var(--edge); overflow: hidden;
    box-shadow: 0 50px 80px -50px var(--shadow); animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.12) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(0.97); } }

  /* ---------- Left: the pot ---------- */
  .hero { position: relative; padding: 18px 20px 20px; background: linear-gradient(180deg, color-mix(in srgb, var(--saffron) 13%, var(--card)), var(--card) 75%); display: flex; flex-direction: column; }
  .pot-box { position: relative; height: 250px; margin: 0 -8px; }
  .pot-box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .halo { fill: var(--glow); opacity: 0.7; transform-box: fill-box; transform-origin: center; animation: halo 5s ease-in-out infinite; }
  @keyframes halo { 50% { opacity: 0.45; transform: scale(1.05); } }
  .ghost-l { fill: none; stroke: var(--pot-line); stroke-width: 1.4; stroke-dasharray: 4 4; opacity: 0.45; transition: opacity 0.4s; }
  .gnum circle { fill: var(--card); stroke: var(--pot-line); stroke-width: 1.2; opacity: 0.8; }
  .gnum text { fill: var(--muted); font-size: 8px; font-weight: 800; text-anchor: middle; }
  .gnum { transition: opacity 0.4s; }
  .guide.filled { opacity: 0; }
  .guide { transition: opacity 0.4s; }
  .flame path { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0.3); fill: #6aa8ff; animation: pilot 0.9s ease-in-out infinite alternate; transition: transform 0.6s cubic-bezier(0.3, 1.6, 0.5, 1), fill 0.5s; }
  @keyframes pilot { to { transform: scaleY(0.38) scaleX(0.9); } }
  .heat-on .flame path { transform: scaleY(1); fill: #ff8a1f; animation: flick 0.5s ease-in-out infinite alternate; }
  .heat-low .flame path { transform: scaleY(0.5); fill: #5aa9ff; animation: none; }
  .flame path:nth-child(2) { animation-delay: -0.2s; } .flame path:nth-child(3) { animation-delay: -0.35s; } .flame path:nth-child(4) { animation-delay: -0.1s; }
  @keyframes flick { to { transform: scaleY(1.18) scaleX(0.88); } }
  .layer { transition: transform 0.85s cubic-bezier(0.3, 1.45, 0.45, 1), opacity 0.4s; }
  .layer.off { opacity: 0; transition: transform 0.5s cubic-bezier(0.5, 0, 0.7, 0.4), opacity 0.4s 0.1s; }
  .bub { fill: rgba(255, 255, 255, 0.55); opacity: 0; }
  .heat-on .bub { animation: bub 1.6s ease-in infinite; }
  @keyframes bub { 0% { opacity: 0; transform: translateY(4px) scale(0.4); } 50% { opacity: 1; } 90% { opacity: 1; transform: translateY(-5px) scale(1); } 100% { opacity: 0; transform: translateY(-6px) scale(1.4); } }
  .steam path { fill: none; stroke: var(--soft-2); stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .heat-on .steam path { animation: steam 2.8s ease-out infinite; }
  .sealed .steam path { animation-duration: 1.6s; }
  .steam path:nth-child(2) { animation-delay: -0.9s; } .steam path:nth-child(3) { animation-delay: -1.8s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-26px) scaleX(1.3); } }
  .lid { transform: translateY(-150px); opacity: 0; transition: transform 0.9s cubic-bezier(0.3, 1.5, 0.45, 1), opacity 0.3s; }
  .sealed .lid { transform: none; opacity: 1; }
  .seal { stroke: #e8cf9c; stroke-width: 4; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.8s ease 0.6s; }
  .sealed .seal { stroke-dashoffset: 0; }
  .pot-g.rattle { animation: rattle 0.5s ease; }
  @keyframes rattle { 20% { transform: translateX(-3px) rotate(-1deg); } 40% { transform: translateX(3px) rotate(1deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
  .ready-tag { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -10px) scale(0.7); opacity: 0; padding: 7px 14px; border-radius: 999px; background: var(--mint); color: #fff; font-size: 13px; font-weight: 800; white-space: nowrap; transition: opacity 0.3s, transform 0.6s cubic-bezier(0.3, 1.8, 0.5, 1); pointer-events: none; }
  .done-all .ready-tag { opacity: 1; transform: translate(-50%, 0); }

  .save { position: absolute; right: 16px; top: 14px; z-index: 2; height: 38px; padding: 0 12px 0 10px; border: 0; border-radius: 12px; cursor: pointer; background: var(--card); box-shadow: 0 6px 16px -10px var(--shadow); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 760; font-variant-numeric: tabular-nums; overflow: hidden; }
  .save svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .save[aria-pressed="true"] svg { fill: var(--clay); stroke: var(--clay); animation: ribbon 0.6s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes ribbon { 0% { transform: translateY(-18px); } }

  .kicker { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); }
  h1 { margin: 4px 0 0; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 840; }
  .by { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .fact { padding: 9px 10px; border-radius: 14px; background: var(--soft); }
  .fact small { display: block; font-size: 11px; font-weight: 750; color: var(--muted); }
  .fact b { display: block; margin-top: 2px; font-size: 14px; font-weight: 800; white-space: nowrap; }

  /* ---------- Right: servings, tabs, lists ---------- */
  .side { padding: 20px 20px 18px; display: flex; flex-direction: column; min-width: 0; }
  .serve { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 16px; background: var(--soft); }
  .serve .lab { font-size: 13px; font-weight: 750; }
  .serve .lab small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .step { display: inline-flex; align-items: center; gap: 4px; }
  .step button { width: 36px; height: 36px; border: 0; border-radius: 11px; cursor: pointer; background: var(--card); display: grid; place-items: center; box-shadow: 0 2px 6px -3px var(--shadow); transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1), opacity 0.2s; }
  .step button:active { transform: scale(0.88); }
  .step button:disabled { opacity: 0.35; cursor: default; }
  .step svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
  .step output { min-width: 30px; text-align: center; font-size: 18px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .step output.bump { animation: bump 0.4s cubic-bezier(0.3, 1.9, 0.5, 1); }
  @keyframes bump { 40% { transform: scale(1.3); } }

  .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; padding: 4px; border-radius: 14px; background: var(--soft); }
  .tabs button { position: relative; z-index: 1; height: 36px; border: 0; background: none; cursor: pointer; border-radius: 10px; font-size: 13.5px; font-weight: 760; color: var(--muted); transition: color 0.3s; }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px; background: var(--card); box-shadow: 0 6px 14px -8px var(--shadow); transform: translateX(var(--t, 0%)); transition: transform 0.5s cubic-bezier(0.3, 1.45, 0.45, 1); }
  .panes { position: relative; margin-top: 10px; overflow-x: clip; flex: 1; display: grid; }
  .pane { grid-area: 1 / 1; min-width: 0; transition: transform 0.5s cubic-bezier(0.3, 1.2, 0.4, 1), opacity 0.3s, visibility 0s 0.5s; }
  .pane[hidden] { display: block; visibility: hidden; opacity: 0; transform: translateX(var(--from, 30px)); pointer-events: none; }
  .pane:not([hidden]) { transition-delay: 0s; }
  .prog { display: flex; align-items: center; gap: 10px; margin: 2px 2px 8px; font-size: 12px; color: var(--muted); }
  .prog .trk { flex: 1; height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; }
  .prog .trk i { display: block; height: 100%; width: var(--p, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--saffron)); transition: width 0.6s cubic-bezier(0.3, 1.3, 0.4, 1); }

  .ing { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .ing button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 6px 6px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; transition: background 0.2s; }
  .ing button:hover { background: var(--soft); }
  .box { position: relative; width: 20px; height: 20px; flex: none; border-radius: 7px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--muted) 45%, transparent); transition: background 0.25s, box-shadow 0.25s, transform 0.45s cubic-bezier(0.3, 1.9, 0.5, 1); }
  .box svg { position: absolute; inset: 3px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.35s ease 0.1s; }
  [aria-pressed="true"] .box { background: var(--mint); box-shadow: none; transform: scale(1.08); }
  [aria-pressed="true"] .box svg { stroke-dashoffset: 0; }
  .it { min-width: 0; flex: 1; }
  .it b { display: block; font-size: 13.5px; font-weight: 760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; width: fit-content; max-width: 100%; transition: color 0.3s; }
  .it b::after { content: ""; position: absolute; left: 0; right: 0; top: 55%; height: 1.5px; background: var(--muted); transform: scaleX(0); transform-origin: left; transition: transform 0.35s ease; }
  [aria-pressed="true"] .it b { color: var(--muted); }
  [aria-pressed="true"] .it b::after { transform: scaleX(1); }
  .qty { position: relative; display: block; height: 17px; overflow: hidden; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .qty span { position: absolute; left: 0; top: 0; white-space: nowrap; transition: transform 0.45s cubic-bezier(0.3, 1.5, 0.5, 1), opacity 0.3s; }
  .qty span.old { transform: translateY(-100%); opacity: 0; }
  .qty span.new { transform: translateY(100%); opacity: 0; }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: st; }
  .stp { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 6px; border-radius: 13px; transition: background 0.3s; }
  .stp.cur { background: var(--soft); }
  .tick { position: relative; width: 30px; height: 30px; flex: none; border: 0; border-radius: 50%; cursor: pointer; background: var(--soft); font-size: 13px; font-weight: 850; display: grid; place-items: center; transition: background 0.3s, color 0.3s, transform 0.45s cubic-bezier(0.3, 1.9, 0.5, 1); }
  .stp.cur .tick { background: var(--card); box-shadow: inset 0 0 0 2px var(--saffron); }
  .tick svg { position: absolute; inset: 7px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.35s ease 0.1s; }
  .tick[aria-pressed="true"] { background: var(--mint); color: transparent; transform: scale(1.06); }
  .tick[aria-pressed="true"] svg { stroke-dashoffset: 0; }
  .stx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; transition: color 0.3s; }
  .stp.done .stx { color: var(--muted); }
  .tmr { position: relative; height: 30px; padding: 0 9px 0 6px; border: 0; border-radius: 999px; cursor: pointer; flex: none; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--soft-2); font-size: 12px; font-weight: 780; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; transition: background 0.3s, color 0.3s; }
  .tmr svg { width: 18px; height: 18px; transform: rotate(-90deg); }
  .tmr .rt { fill: none; stroke: var(--soft-2); stroke-width: 3; }
  .tmr .rf { fill: none; stroke: var(--saffron); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 44; stroke-dashoffset: var(--o, 44); transition: stroke-dashoffset 1s linear; }
  .tmr.run { background: var(--ink); color: var(--card); box-shadow: none; }
  .tmr.end { background: var(--mint); color: #fff; animation: bump 0.4s cubic-bezier(0.3, 1.9, 0.5, 1) 3; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 24px); opacity: 0; padding: 10px 16px; border-radius: 14px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 720; white-space: nowrap; pointer-events: none; transition: opacity 0.3s, transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); z-index: 20; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--clay); opacity: 0; }
  .ghost.tap::after { animation: ring 0.5s ease-out; }
  @keyframes ring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  @media (max-width: 820px) {
    .stage { align-items: flex-start; padding-top: max(16px, calc(50svh - 370px)); }
    .card { grid-template-columns: minmax(0, 1fr); max-width: 460px; border-radius: 26px; }
    .hero { padding: 14px 16px 12px; display: grid; grid-template-columns: 132px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; align-items: center; }
    .pot-box { grid-row: 1 / 3; height: 150px; margin: 0 -10px 0 -14px; }
    .kicker { padding-right: 44px; font-size: 10.5px; letter-spacing: 0.1em; }
    .gnum { display: none; }
    h1 { font-size: 21px; }
    .by { font-size: 12px; }
    .facts { grid-column: 2; margin-top: 8px; gap: 5px; }
    .fact { padding: 6px 7px; border-radius: 11px; }
    .fact small { font-size: 10px; }
    .fact b { font-size: 12.5px; }
    .save { top: 12px; right: 12px; height: 34px; padding: 0 9px; }
    .save .sc { display: none; }
    .ready-tag { top: 2px; font-size: 11.5px; padding: 5px 10px; }
    .side { padding: 12px 16px 16px; }
    .serve { padding: 8px 8px 8px 12px; }
  }
  @media (max-width: 480px) { .by { display: none; } .stx { font-size: 12.5px; } .stp { padding: 5px 6px 5px 4px; gap: 8px; } .tmr { padding: 0 7px 0 5px; } }
  @media (max-width: 400px) { .ing { grid-template-columns: 1fr; gap: 0; } .ing button { padding: 4px 6px; } .facts .fact:nth-child(3) { display: none; } .facts { grid-template-columns: 1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <article class="card" id="card" aria-labelledby="ttl">
    <div class="hero">
      <button class="save" id="save" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span class="sc" id="saveN">2,418</span><span class="sr-only">Save recipe</span></button>
      <div class="pot-box" id="potBox">
        <svg viewBox="0 0 300 230" aria-hidden="true">
          <defs>
            <clipPath id="inside"><path d="M74 78h152l-8 104q-1 12-13 12H95q-12 0-13-12z"/></clipPath>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient>
          </defs>
          <ellipse class="halo" cx="150" cy="130" rx="130" ry="90"/>
          <!-- stove and flames -->
          <rect x="70" y="208" width="160" height="10" rx="5" fill="var(--pot-line)" opacity=".5"/>
          <g class="flame" fill="#ff8a1f"><path d="M104 206c-6-6-2-14 3-20 1 8 7 9 5 20z"/><path d="M136 206c-7-7-2-17 4-24 1 10 8 11 5 24z"/><path d="M168 206c-6-7-2-16 4-23 1 9 8 11 5 23z"/><path d="M196 206c-6-6-2-13 3-19 1 8 7 9 5 19z"/></g>
          <g class="pot-g" id="potG" style="transform-box: fill-box; transform-origin: 50% 100%">
            <!-- handles -->
            <path d="M66 96c-16 0-18 22 0 22" fill="none" stroke="var(--pot-line)" stroke-width="6" stroke-linecap="round"/>
            <path d="M234 96c16 0 18 22 0 22" fill="none" stroke="var(--pot-line)" stroke-width="6" stroke-linecap="round"/>
            <!-- see-through body so the layers show -->
            <path d="M68 74h164l-9 110q-1 16-17 16H94q-16 0-17-16z" fill="var(--pot)" opacity=".28"/>
            <g clip-path="url(#inside)" id="ghosts"></g>
            <g clip-path="url(#inside)" id="layers"></g>
            <g id="bubbles"></g>
            <path d="M68 74h164l-9 110q-1 16-17 16H94q-16 0-17-16z" fill="url(#glass)" stroke="var(--pot-line)" stroke-width="3"/>
            <ellipse cx="150" cy="74" rx="84" ry="7" fill="none" stroke="var(--pot-line)" stroke-width="4"/>
            <g class="steam" transform="translate(0 0)"><path d="M126 62c-6-8 6-12 0-20"/><path d="M150 58c-6-8 6-12 0-20"/><path d="M174 62c-6-8 6-12 0-20"/></g>
            <!-- the lid drops on for the last step, sealed with a ring of dough -->
            <g class="lid">
              <path class="seal" pathLength="1" d="M66 74a84 7 0 1 0 168 0a84 7 0 1 0-168 0"/>
              <path d="M70 72q80-34 160 0z" fill="var(--pot-line)"/>
              <rect x="140" y="44" width="20" height="9" rx="4" fill="var(--pot-line)"/>
            </g>
          </g>
        </svg>
        <span class="ready-tag">Ready to serve</span>
      </div>
