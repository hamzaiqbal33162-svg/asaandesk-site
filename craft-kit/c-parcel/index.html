<!doctype html>
<!-- Chill and Craft · Parcel · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel · file upload box</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #f1f0fb;
    --card: #ffffff;
    --ink: #1d1934;
    --muted: #6e6a85;
    --line: #e6e3f5;
    --zone: #f8f7ff;
    --dash: #b9aefc;
    --accent: #6d4aff;
    --accent-2: #b39dff;
    --good: #14945f;
    --bad: #e0414b;
    --track: #edeaf9;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #0c0b16;
    --card: #16142a;
    --ink: #efedff;
    --muted: #a6a1c4;
    --line: #2a2648;
    --zone: #1b1934;
    --dash: #4f4790;
    --accent: #9b85ff;
    --accent-2: #6d4aff;
    --good: #3ddc97;
    --bad: #ff6b74;
    --track: #252142;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    color: var(--ink);
    background: var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: min(100%, 460px);
    padding: 20px;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px rgba(60, 40, 160, .45);
  }
  h1 { margin: 0; font-size: clamp(19px, 5vw, 22px); }
  .sub { margin: 4px 0 14px; font-size: 13px; color: var(--muted); }

  /* ---------- Drop zone with marching-ant edges ---------- */
  .drop {
    position: relative;
    padding: 18px 16px 16px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
    background:
      linear-gradient(90deg, var(--dash) 50%, transparent 0) repeat-x 0 0 / 14px 2px,
      linear-gradient(90deg, var(--dash) 50%, transparent 0) repeat-x 0 100% / 14px 2px,
      linear-gradient(0deg, var(--dash) 50%, transparent 0) repeat-y 0 0 / 2px 14px,
      linear-gradient(0deg, var(--dash) 50%, transparent 0) repeat-y 100% 0 / 2px 14px,
      var(--zone);
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s;
  }
  .drop:hover, .drop.over { animation: ants .7s linear infinite; }
  @keyframes ants { to { background-position: 14px 0, -14px 100%, 0 -14px, 100% 14px, 0 0; } }
  .drop.over { --dash: var(--accent); transform: scale(1.02); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 16%, transparent); }
  .drop.over::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 65%);
    animation: breathe 1s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes breathe { from { opacity: .4; } to { opacity: 1; } }

  /* The parcel icon: flaps open when files hover, the box seals when sent */
  .parcel { display: block; width: 110px; height: 82px; margin: 0 auto 6px; overflow: visible; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-4px); } }
  .parcel .body { fill: color-mix(in srgb, var(--accent) 22%, var(--card)); stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
  .parcel .flap { fill: color-mix(in srgb, var(--accent) 35%, var(--card)); stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; transform-box: fill-box; transition: transform .5s cubic-bezier(.34, 1.56, .64, 1); }
  .parcel .flap.l { transform-origin: 100% 100%; }
  .parcel .flap.r { transform-origin: 0 100%; }
  .drop.over .flap.l { transform: rotate(-22deg); }
  .drop.over .flap.r { transform: rotate(22deg); }
  .parcel .arrow { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; animation: bobArrow 1.6s ease-in-out infinite; }
  @keyframes bobArrow { 50% { transform: translateY(-5px); } }
  .drop.over .parcel .arrow { animation: dive .7s ease-in infinite; }
  @keyframes dive { from { transform: translateY(-8px); opacity: 1; } to { transform: translateY(26px); opacity: 0; } }
  .parcel .lid, .parcel .tape, .parcel .stamp { opacity: 0; }
  .parcel .tape { stroke: #f2b84b; stroke-width: 5; stroke-dasharray: 80; stroke-dashoffset: 80; }
  .drop.sealed .flap { transform: scaleY(0); }
  .drop.sealed .arrow { opacity: 0; animation: none; }
  .drop.sealed .lid { opacity: 1; transition: opacity .2s .25s; }
  .drop.sealed .tape { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .5s ease .4s, opacity .1s .4s; }
  .drop.sealed .stamp { opacity: 1; transform: none; transition: transform .5s cubic-bezier(.34, 1.56, .64, 1) .8s, opacity .1s .8s; }
  .parcel .stamp { transform-box: fill-box; transform-origin: center; transform: scale(2.4) rotate(-30deg); }
  .drop.sealed .parcel { animation: hop .7s cubic-bezier(.34, 1.56, .64, 1) .3s; }
  @keyframes hop { 30% { transform: translateY(4px) scale(1.06, .92); } 60% { transform: translateY(-12px); } }

  .drop strong { font-size: 15px; }
  .drop p { margin: 4px 0; font-size: 14px; }
  .drop .small { font-size: 12px; color: var(--muted); }
  .link {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
    transition: text-underline-offset .2s;
  }
  .link:hover { text-underline-offset: 5px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- File rows ---------- */
  .files { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .file {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    overflow: hidden;
    animation: rowIn .5s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: var(--d, 0ms);
    transition: border-color .3s, background .3s;
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-12px) scale(.96); } }
  .file.done { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .file.done.flash { animation: flash .7s ease; }
  @keyframes flash { 30% { background: color-mix(in srgb, var(--good) 12%, var(--card)); } }
  .file.error { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); animation: shake .45s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .type {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    background: var(--c);
    overflow: hidden;
    animation: badgePop .55s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--d, 0ms) + 120ms);
  }
  @keyframes badgePop { from { transform: scale(.2) rotate(-25deg); } }
  .type img { width: 100%; height: 100%; object-fit: cover; }
  .meta { flex: 1; min-width: 0; }
  .row1, .row2 { display: flex; justify-content: space-between; gap: 8px; }
  .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .row2 { margin-top: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row2 span:last-child { white-space: nowrap; }
  .file.error .row2 { color: var(--bad); }
  .bar { height: 6px; margin-top: 6px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, var(--accent-2) 8px 16px);
    background-size: 22.6px 22.6px;
    animation: stripes .6s linear infinite;
    transition: width .35s cubic-bezier(.34, 1.3, .64, 1), background .3s;
  }
  @keyframes stripes { to { background-position: 22.6px 0; } }
  .file.done .bar span { background: var(--good); animation: none; }
  .file.error .bar span { background: var(--bad); animation: none; }
  .tick { width: 16px; height: 16px; vertical-align: -3px; }
  .tick path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .4s ease .1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .icon-btn {
    flex: none;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), background .2s, color .2s;
  }
  .icon-btn:hover { background: var(--track); color: var(--ink); transform: rotate(90deg); }
  .icon-btn.retry:hover { transform: rotate(-180deg); }
  .icon-btn:active { transform: scale(.85); }

  /* ---------- Footer ---------- */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .summary { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; margin-left: auto; }
  .btn {
    padding: 10px 16px;
    border-radius: 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, opacity .2s;
  }
  .btn.ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .btn.solid { border: 0; color: #fff; background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ff7ab8)); box-shadow: 0 10px 20px -12px var(--accent); }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: scale(.95); }
  .btn:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .link:focus-visible { border-radius: 4px; }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; width: 8px; height: 12px; border-radius: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1 id="title">Upload documents</h1>
    <p class="sub">Images, PDF, Word, Excel, text or ZIP · up to 10 MB each · 6 files at a time</p>

    <!-- Drop zone: drag files in, click to browse, or paste -->
    <div class="drop" id="drop">
      <svg class="parcel" viewBox="0 0 120 90" aria-hidden="true">
        <g class="arrow"><path d="M60 34V6M49 17l11-11 11 11"/></g>
        <path class="flap l" d="M24 46h36l-9-13H13z"/>
        <path class="flap r" d="M60 46h36l11-13H69z"/>
        <rect class="body" x="24" y="46" width="72" height="38" rx="4"/>
        <rect class="lid" x="22" y="42" width="76" height="8" rx="3" fill="var(--accent)"/>
        <path class="tape" d="M60 42v42"/>
        <g class="stamp">
          <circle cx="92" cy="74" r="12" fill="var(--good)"/>
          <path d="M86 74l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <p><strong>Drag files here</strong> or <button type="button" class="link" id="browse">browse</button></p>
      <p class="small">You can also paste a file or screenshot with Ctrl+V</p>
    </div>
    <input type="file" id="picker" class="sr" multiple tabindex="-1" aria-hidden="true"
      accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip">

    <ul class="files" id="files" aria-label="Files"></ul>

    <div class="foot">
      <span class="summary" id="summary">No files yet</span>
      <div class="btns">
        <button type="button" class="btn ghost" id="clearAll" disabled>Clear all</button>
        <button type="button" class="btn solid" id="submit" disabled>Send files</button>
      </div>
    </div>
    <p class="sr" id="announce" role="status" aria-live="polite"></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const drop = $("drop");
  const picker = $("picker");
  const list = $("files");
  const submitBtn = $("submit");
  const clearBtn = $("clearAll");

  const MAX_FILES = 6;
  const MAX_SIZE = 10 * 1024 * 1024;
  const OK_EXT = ["pdf", "doc", "docx", "xls", "xlsx", "csv", "txt", "zip", "png", "jpg", "jpeg", "gif", "webp", "svg", "heic"];
  const KIND = {
    pdf: ["PDF", "#e5484d"], doc: ["DOC", "#3e63dd"], docx: ["DOC", "#3e63dd"], xls: ["XLS", "#30a46c"], xlsx: ["XLS", "#30a46c"],
    csv: ["CSV", "#30a46c"], txt: ["TXT", "#8e8c99"], zip: ["ZIP", "#f76b15"]
  };
  let items = [];        // { id, file, li, state, loaded, timer, url }
  let nextId = 1;
  let sent = false;

  const say = (msg) => { $("announce").textContent = msg; };
  function size(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }
  const ext = (name) => (name.includes(".") ? name.split(".").pop().toLowerCase() : "");

  // ---- Add files from the picker, a drop or a paste ----
  function addFiles(fileList) {
    if (sent) resetAll();
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const room = MAX_FILES - items.length;
    if (room <= 0) { say("You can add up to " + MAX_FILES + " files at a time."); bounceZone(); return; }
    files.slice(0, room).forEach((file, k) => addRow(file, k));
    if (files.length > room) say("Only " + room + " more file" + (room === 1 ? "" : "s") + " fit. The rest were skipped.");
    else say("Added " + files.length + " file" + (files.length === 1 ? "" : "s") + ".");
    refresh();
  }
  function bounceZone() {
    drop.animate([{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }], { duration: reduce ? 1 : 350 });
  }

  function addRow(file, k) {
    const id = nextId++;
    const e = ext(file.name);
    const isImage = (file.type || "").startsWith("image/");
    const li = document.createElement("li");
    li.className = "file";
    li.style.setProperty("--d", k * 70 + "ms");
    li.innerHTML =
      '<span class="type"></span>' +
      '<div class="meta"><div class="row1"><span class="name"></span><span class="pct">0%</span></div>' +
      '<div class="bar"><span></span></div>' +
      '<div class="row2"><span class="info"></span><span class="eta"></span></div></div>' +
      '<button type="button" class="icon-btn retry" hidden>↻</button>' +
      '<button type="button" class="icon-btn x">×</button>';
    li.querySelector(".name").textContent = file.name;
    li.querySelector(".name").title = file.name;
    const badge = li.querySelector(".type");
    const item = { id, file, li, state: "uploading", loaded: 0, timer: 0, url: "" };

    // A real thumbnail for images, a coloured badge for everything else
    if (isImage) {
      item.url = URL.createObjectURL(file);
      const img = document.createElement("img");
      img.alt = "";
      img.src = item.url;
      img.onload = () => { item.dims = img.naturalWidth + "×" + img.naturalHeight; if (item.state === "done") paint(item); };
      badge.style.setProperty("--c", "#12a594");
      badge.append(img);
    } else {
      const kind = KIND[e] || [e.slice(0, 4).toUpperCase() || "FILE", "#8e8c99"];
      badge.textContent = kind[0];
      badge.style.setProperty("--c", kind[1]);
    }
    li.querySelector(".x").addEventListener("click", () => removeItem(item));
    li.querySelector(".retry").addEventListener("click", () => {
      say("Retrying " + file.name + ".");
      item.retried = true;
      upload(item);
      li.querySelector(".x").focus();
    });
    list.append(li);
    items.push(item);

    // Check type and size before "uploading"
    if (!isImage && !OK_EXT.includes(e)) fail(item, "This file type is not allowed");
    else if (file.size > MAX_SIZE) fail(item, "Too large: " + size(file.size) + " (max 10 MB)");
    else upload(item);
  }

  // ---- Simulated upload with real file sizes ----
  function upload(item) {
    clearInterval(item.timer);
    item.state = "uploading";
    item.loaded = 0;
    item.eta = undefined;
    item.li.classList.remove("error", "done", "flash");
    const total = Math.max(item.file.size, 1);
    const speed = (1.2 + Math.random() * 1.6) * 1024 * 1024;     // bytes per second
    const minTime = 1300 + Math.random() * 900;
    const perTick = Math.max(total / (minTime / 120), speed * 0.12);
    const failAt = /fail/i.test(item.file.name) && !item.retried ? 0.35 + Math.random() * 0.4 : 2;   // demo: a file named *fail* drops once, to show Retry
    paint(item);
    item.timer = setInterval(() => {
      item.loaded = Math.min(total, item.loaded + perTick * (0.6 + Math.random() * 0.8));
      if (item.loaded / total >= failAt) {
        clearInterval(item.timer);
        fail(item, "Upload failed. Check your connection.", true);
        return;
      }
      if (item.loaded >= total) {
        clearInterval(item.timer);
        item.state = "done";
        item.li.classList.add("done", "flash");
        say(item.file.name + " uploaded.");
      }
      item.eta = Math.max(0, (total - item.loaded) / speed);
      paint(item);
      refresh();
    }, 120);
  }

  function fail(item, msg, canRetry) {
    item.state = "error";
    item.msg = msg;
    item.canRetry = !!canRetry;
    item.li.classList.add("error");
    paint(item);
    say(item.file.name + ": " + msg);
    refresh();
  }

  function paint(item) {
    const li = item.li;
    const total = Math.max(item.file.size, 1);
    const pct = Math.round((item.loaded / total) * 100);
    const pctEl = li.querySelector(".pct");
    const bar = li.querySelector(".bar span");
    const info = li.querySelector(".info");
    const eta = li.querySelector(".eta");
    const btn = li.querySelector(".x");
    const retry = li.querySelector(".retry");
    retry.hidden = !(item.state === "error" && item.canRetry);
    retry.setAttribute("aria-label", "Retry " + item.file.name);
    if (item.state === "uploading") {
      pctEl.textContent = pct + "%";
      bar.style.width = pct + "%";
      info.textContent = size(item.loaded) + " of " + size(item.file.size);
      eta.textContent = item.eta === undefined ? "starting…" : Math.ceil(item.eta) + " s left";
      btn.textContent = "×";
      btn.setAttribute("aria-label", "Cancel upload of " + item.file.name);
    } else if (item.state === "done") {
      pctEl.innerHTML = '<svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="var(--good)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      bar.style.width = "100%";
      info.textContent = size(item.file.size) + (item.dims ? " · " + item.dims : "");
      eta.textContent = "Uploaded";
      btn.textContent = "×";
      btn.setAttribute("aria-label", "Remove " + item.file.name);
    } else {
      pctEl.textContent = "";
      bar.style.width = item.canRetry ? pct + "%" : "100%";
      info.textContent = item.msg;
      eta.textContent = "";
      btn.textContent = "×";
      btn.setAttribute("aria-label", "Remove " + item.file.name);
    }
  }

  function removeItem(item) {
    clearInterval(item.timer);
    items = items.filter((x) => x !== item);
    if (item.url) URL.revokeObjectURL(item.url);
    const li = item.li;
    const h = li.offsetHeight;
    say((item.state === "uploading" ? "Cancelled " : "Removed ") + item.file.name + ".");
    // Slide out and collapse
    li.animate([
      { opacity: 1, transform: "none", height: h + "px" },
      { opacity: 0, transform: "translateX(50px)", height: h + "px", offset: 0.6 },
      { opacity: 0, transform: "translateX(50px)", height: "0px", paddingTop: "0px", paddingBottom: "0px", marginTop: "-8px" }
    ], { duration: reduce ? 1 : 380, easing: "ease-in" }).onfinish = () => { li.remove(); refresh(); };
    refresh();
  }

  // ---- Footer: totals and buttons ----
  function refresh() {
    const done = items.filter((i) => i.state === "done");
    const busy = items.some((i) => i.state === "uploading");
    const bytes = items.reduce((s, i) => s + i.file.size, 0);
    $("summary").textContent = items.length
      ? items.length + (items.length === 1 ? " file" : " files") + " · " + size(bytes) + " · " + done.length + " ready"
      : "No files yet";
    submitBtn.disabled = sent || busy || !done.length;
    clearBtn.disabled = !items.length && !sent;
  }

  // ---- Send: seal the parcel and celebrate ----
  const fx = $("fx");
  function confetti() {
    if (reduce) return;
    const r = drop.querySelector(".parcel").getBoundingClientRect();
    const colors = ["#6d4aff", "#b39dff", "#ff7ab8", "#f2b84b", "#3ddc97"];
    for (let n = 0; n < 44; n++) {
      const p = document.createElement("i");
      p.style.background = colors[n % colors.length];
      fx.append(p);
      const x0 = r.left + r.width / 2;
      const y0 = r.top + r.height / 2;
      const dx = (Math.random() - 0.5) * 360;
      const up = 80 + Math.random() * 140;
      const spin = (Math.random() - 0.5) * 900;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) rotate(0) scale(.4)", opacity: 1 },
        { transform: "translate(" + (x0 + dx * 0.6) + "px," + (y0 - up) + "px) rotate(" + spin / 2 + "deg) rotateX(180deg) scale(1)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + 200) + "px) rotate(" + spin + "deg) rotateX(540deg)", opacity: 0 }
      ], { duration: 1600 + Math.random() * 700, easing: "cubic-bezier(.25, .6, .4, 1)" }).onfinish = () => p.remove();
    }
  }

  submitBtn.addEventListener("click", () => {
    const ready = items.filter((i) => i.state === "done");
    if (!ready.length) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    setTimeout(() => {
      sent = true;
      drop.classList.add("sealed");
      setTimeout(confetti, reduce ? 0 : 900);
      submitBtn.textContent = "Sent";
      clearBtn.textContent = "Start over";
      say("All " + ready.length + " file" + (ready.length === 1 ? "" : "s") + " sent. The parcel is sealed.");
      refresh();
    }, reduce ? 50 : 900);
  });

  function resetAll() {
    items.forEach((i) => { clearInterval(i.timer); if (i.url) URL.revokeObjectURL(i.url); i.li.remove(); });
    items = [];
    sent = false;
    drop.classList.remove("sealed");
    submitBtn.textContent = "Send files";
    clearBtn.textContent = "Clear all";
    refresh();
  }
  clearBtn.addEventListener("click", () => {
    resetAll();
    say("Cleared. Add new files.");
    $("browse").focus();
  });

  // ---- Picker, drag and drop, paste ----
  $("browse").addEventListener("click", (e) => { e.stopPropagation(); picker.click(); });
  drop.addEventListener("click", () => picker.click());
  picker.addEventListener("change", () => { addFiles(picker.files); picker.value = ""; });

  let depth = 0;            // dragenter/leave fire for children too, so count them
  drop.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; drop.classList.add("over"); });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  drop.addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove("over"); });
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    depth = 0;
    drop.classList.remove("over");
    addFiles(e.dataTransfer.files);
  });
  // Stop the browser from opening files dropped outside the box
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  document.addEventListener("paste", (e) => {
    const files = e.clipboardData ? e.clipboardData.files : null;
    if (files && files.length) {
      e.preventDefault();
      addFiles(files);
    }
  });

  refresh();
})();
</script>
</body>
</html>
