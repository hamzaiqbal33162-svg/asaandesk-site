<!doctype html>
<!-- Chill & Craft · Shredder · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shredder · delete button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --bg1: #efece5;
    --bg2: #dcd7cc;
    --btn: #23252b;
    --btn-hover: #2e3138;
    --btn-line: transparent;
    --label: #f8f5ee;
    --amber: #f5a524;
    --amber-dark: #b8740d;
    --paper: #fffdf7;
    --paper-line: #cdc6b7;
    --muted: #6f6a60;
    --focus: #f59e0b;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #1a1b1e;
      --bg2: #0c0d0e;
      --btn: #2a2d34;
      --btn-hover: #333740;
      --btn-line: #3d414b;
      --label: #f4f1ea;
      --amber: #f7b13e;
      --amber-dark: #c2800f;
      --paper: #f3efe4;
      --paper-line: #b9b2a2;
      --muted: #a29d93;
      --focus: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1a1b1e;
    --bg2: #0c0d0e;
    --btn: #2a2d34;
    --btn-hover: #333740;
    --btn-line: #3d414b;
    --label: #f4f1ea;
    --amber: #f7b13e;
    --amber-dark: #c2800f;
    --paper: #f3efe4;
    --paper-line: #b9b2a2;
    --muted: #a29d93;
    --focus: #fbbf24;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  /* Extra top padding leaves room for the page that drops in */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 110px 16px 28px; }

  /* ---------- Button ---------- */
  .btn {
    position: relative;
    width: 210px;
    height: 60px;
    padding: 0;
    border: 1px solid var(--btn-line);
    border-radius: 16px;
    background: var(--btn);
    color: var(--label);
    font: inherit;
    font-size: 16.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 14px 28px -16px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .07);
    transition: background-color .2s, transform .4s var(--spring), box-shadow .3s;
  }
  .btn:hover { background: var(--btn-hover); transform: translateY(-2px); }
  .btn:active { transform: translateY(1px) scale(.97); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .btn[aria-disabled="true"] { cursor: default; transform: none; }

  .label { position: absolute; top: 0; bottom: 0; left: 56px; right: 18px; display: grid; place-items: center; white-space: nowrap; transition: opacity .25s, transform .5s var(--spring), color .25s; }
  .btn:hover .label { transform: translateX(3px); }

  /* The bin: amber, solid, so paper hides behind it */
  .bin { position: absolute; z-index: 2; left: 20px; top: 16px; width: 24px; height: 28px; transition: transform .55s var(--spring); }
  .bin svg { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; }
  .bin .can, .bin .lid rect { fill: var(--amber); }
  .bin .handle { fill: none; stroke: var(--amber); stroke-width: 1.8; stroke-linecap: round; }
  .bin .ribs { fill: none; stroke: var(--amber-dark); stroke-width: 1.6; stroke-linecap: round; }
  .lid { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .35s var(--spring); }
  .btn:hover .lid { transform: rotate(-20deg); }

  /* The page lives in a clipped chute above the bin */
  .chute { position: absolute; z-index: 1; left: 0; right: 0; top: -86px; height: 136px; overflow: hidden; pointer-events: none; }
  .paper { position: absolute; left: 50%; top: 0; width: 30px; height: 38px; margin-left: -15px; display: flex; opacity: 0; transform-origin: 50% 100%; }
  .paper i {
    flex: 1;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 6px, var(--paper-line) 6px 7.4px);
    background-position: 0 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .15);
  }
  .paper i:first-child { border-radius: 2px 0 0 2px; }
  .paper i:last-child { border-radius: 0 2px 2px 0; }

  /* Paper bits tossed out while shredding */
  .bits { position: absolute; z-index: 3; left: 103px; top: 18px; width: 0; height: 0; pointer-events: none; }
  .bits i { position: absolute; width: 4px; height: 4px; border-radius: 1px; background: var(--paper); opacity: 0; }

  /* Confetti layer for the finish */
  .fx { position: absolute; left: 50%; top: 0; width: 0; height: 0; pointer-events: none; z-index: 4; }
  .particle { position: absolute; width: 5px; height: 9px; border-radius: 1px; pointer-events: none; }

  .caption { margin: 0; min-height: 1.3em; font-size: 13.5px; color: var(--muted); text-align: center; }
  .caption b { font-weight: 600; }

  /* ---------- States ---------- */
  /* grow: the bin moves to the middle, grows and opens */
  .btn:is([data-state="grow"], [data-state="drop"], [data-state="shred"], [data-state="close"]) .bin { transform: translateX(73px) scale(1.7); }
  .btn:is([data-state="grow"], [data-state="drop"], [data-state="shred"]) .lid { transform: rotate(-58deg); }
  .btn:not([data-state="idle"]):not([data-state="done"]) .label { opacity: 0; transform: translateX(16px); }

  /* drop: a page tumbles into the open bin */
  .btn:is([data-state="drop"], [data-state="shred"]) .paper { opacity: 1; transform: translateY(82px); }
  .btn[data-state="drop"] .paper { animation: tumble .55s cubic-bezier(.45, 0, .7, 1) both; }

  /* shred: the page splits into strips that sink into the bin */
  .btn[data-state="shred"] .paper i {
    transform: translate(var(--sx), 46px) rotate(var(--r));
    transition: transform .75s cubic-bezier(.5, 0, .9, .6);
    transition-delay: calc(var(--i) * 70ms);
  }
  .btn[data-state="shred"] .bin svg { animation: buzz .08s linear infinite; }
  .btn[data-state="shred"] .bits i { animation: toss .65s ease-out forwards; }
  .btn[data-state="shred"] .bits i:nth-child(1) { --tx: -26px; --ty: -22px; animation-delay: .1s; }
  .btn[data-state="shred"] .bits i:nth-child(2) { --tx: 22px; --ty: -28px; animation-delay: .25s; }
  .btn[data-state="shred"] .bits i:nth-child(3) { --tx: -14px; --ty: -34px; animation-delay: .4s; }
  .btn[data-state="shred"] .bits i:nth-child(4) { --tx: 30px; --ty: -16px; animation-delay: .5s; }

  /* close: lid snaps shut and the bin squashes */
  .btn[data-state="close"] .lid { animation: snap .4s ease-out; }
  .btn[data-state="close"] .bin svg { animation: squash .45s ease-out; }

  /* done: bin back home, label says Shredded */
  .btn[data-state="done"] .label { color: var(--amber); animation: rise .6s var(--spring); }

  @keyframes tumble {
    0% { transform: translateY(0) rotate(-14deg); opacity: 0; }
    15% { opacity: 1; }
    70% { transform: translateY(70px) rotate(6deg); }
    100% { transform: translateY(82px) rotate(0); opacity: 1; }
  }
  @keyframes buzz { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-.7px, .4px); } 75% { transform: translate(.7px, -.4px); } }
  @keyframes toss {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(140deg); }
  }
  @keyframes snap { 0% { transform: rotate(-58deg); } 60% { transform: rotate(10deg); } 80% { transform: rotate(-4deg); } 100% { transform: rotate(0); } }
  @keyframes squash { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.15, .85); } 70% { transform: scale(.95, 1.06); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.8); } to { opacity: 1; transform: none; } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .bits, .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <button class="btn" type="button" data-state="idle" aria-describedby="caption">
    <!-- Page that drops in: five strips side by side -->
    <span class="chute" aria-hidden="true">
      <span class="paper">
        <i style="--i:0; --sx:-3px; --r:-6deg"></i>
        <i style="--i:2; --sx:-1.5px; --r:3deg"></i>
        <i style="--i:1; --sx:0px; --r:-2deg"></i>
        <i style="--i:3; --sx:1.5px; --r:5deg"></i>
        <i style="--i:4; --sx:3px; --r:-4deg"></i>
      </span>
    </span>

    <span class="bin" aria-hidden="true">
      <svg viewBox="0 0 24 28">
        <g class="lid">
          <rect x="2" y="5" width="20" height="3.4" rx="1.5" />
          <path class="handle" d="M9 5V3.6c0-.8.6-1.4 1.4-1.4h3.2c.8 0 1.4.6 1.4 1.4V5" />
        </g>
        <path class="can" d="M4.2 10h15.6l-1.5 14.6A2.6 2.6 0 0 1 15.7 27H8.3a2.6 2.6 0 0 1-2.6-2.4z" />
        <path class="ribs" d="M9.6 13.5v9.5M14.4 13.5v9.5" />
      </svg>
    </span>

    <span class="bits" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="fx" aria-hidden="true"></span>
    <span class="label">Delete file</span>
  </button>
  <p class="caption" id="caption"><b>Old-Invoice-0420.pdf</b> · 640 KB</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Shredder delete button ----------
  const btn = document.querySelector(".btn");
  const binArt = btn.querySelector(".bin svg");
  const fx = btn.querySelector(".fx");
  const label = btn.querySelector(".label");
  const caption = document.getElementById("caption");
  const status = document.getElementById("status");

  const FILE = "Old-Invoice-0420.pdf";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  let busy = false;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Paper confetti: thrown up out of the bin, then falls with gravity
  function confetti(count) {
    if (calm()) return;
    const colors = ["var(--paper)", "var(--amber)", "#e8e2d4"];
    for (let i = 0; i < count; i++) {
      const p = document.createElement("i");
      p.className = "particle";
      p.style.background = colors[i % colors.length];
      p.style.top = "8px";
      fx.appendChild(p);
      const dx = (Math.random() - .5) * 170;
      const up = -40 - Math.random() * 50;
      const spin = Math.round(Math.random() * 720 - 360);
      p.animate([
        { transform: "translate(-50%, 0) rotate(0) scale(.6)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (dx * .6).toFixed(1) + "px), " + up.toFixed(1) + "px) rotate(" + spin / 2 + "deg) scale(1)", opacity: 1, offset: .35, easing: "cubic-bezier(.3, .6, .6, 1)" },
        { transform: "translate(calc(-50% + " + dx.toFixed(1) + "px), 70px) rotate(" + spin + "deg) scale(.9)", opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.5, 0, .8, .6)" }).onfinish = () => p.remove();
    }
  }

  // Each step is a state; CSS draws it, the timer moves to the next one
  const steps = [
    ["grow", 480],   // bin springs to the middle, grows and opens
    ["drop", 600],   // page tumbles in
    ["shred", 1000], // page is cut into strips, bin buzzes
    ["close", 420]   // lid snaps shut, bin squashes
  ];

  btn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    btn.setAttribute("aria-disabled", "true");
    status.textContent = "Shredding " + FILE + ".";

    // Anticipation: the button presses down and the bin crouches
    await Promise.all([
      play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.03, .9)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-out" }),
      play(binArt, [{ transform: "scale(1)" }, { transform: "scale(1.2, .75)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-in-out" })
    ]);

    for (const [state, ms] of steps) {
      btn.dataset.state = state;
      if (state === "close") confetti(22);
      await wait(ms);
    }

    // Finished
    btn.dataset.state = "done";
    label.textContent = "Shredded";
    caption.innerHTML = "<b>" + FILE + "</b> was shredded";
    status.textContent = FILE + " was deleted.";
    await wait(2600);

    // Reset for another go
    btn.dataset.state = "idle";
    label.textContent = "Delete file";
    play(label, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 450, easing: "cubic-bezier(.34, 1.56, .64, 1)" });
    caption.innerHTML = "<b>" + FILE + "</b> · 640 KB";
    btn.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
