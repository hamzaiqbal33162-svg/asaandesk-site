<!doctype html>
<!-- Chill & Craft · Paint Chips · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Chips · colour picker with harmony swatches</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* --c is the live colour; --glow is a typed copy that fades slowly behind the card */
  @property --glow { syntax: "<color>"; inherits: true; initial-value: #e0603e; }

  /* ---------- Colours: warm plaster gallery (light), charcoal studio (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --bg: #ece5db;
    --bg2: #f8f3ec;
    --card: #fffcf8;
    --ink: #2a221d;
    --muted: #7b6e64;
    --line: #e6dbcf;
    --soft: #f4ede4;
    --shadow: rgba(70, 45, 25, .24);
    --floor: #c99f78;
    --floor2: #b88d67;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #121014;
    --bg2: #1d1a20;
    --card: #1b181e;
    --ink: #f2ede7;
    --muted: #a69d95;
    --line: #302b34;
    --soft: #252128;
    --shadow: rgba(0, 0, 0, .65);
    --floor: #6b5140;
    --floor2: #5a4436;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 18px 14px;
    overflow: hidden;
    --c: #e0603e;
    transition: --glow .9s ease;
    background:
      radial-gradient(42% 36% at 50% 46%, color-mix(in srgb, var(--glow) 26%, transparent), transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 5px, color-mix(in srgb, var(--ink) 2%, transparent) 5px 6px),
      radial-gradient(90% 80% at 50% 30%, var(--bg2), var(--bg));
  }
  .card {
    position: relative;
    width: min(100%, 440px);
    padding: 18px 18px 20px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 40px 70px -44px var(--shadow), 0 8px 20px -14px var(--shadow);
    animation: cardIn .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }

  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .kicker { margin: 0 0 3px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: clamp(19px, 5vw, 22px); letter-spacing: -.015em; }
  .count {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    background: var(--soft); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .count i { display: flex; }
  .count i b { width: 9px; height: 9px; margin-left: -3px; border-radius: 50%; border: 1.5px solid var(--card); background: var(--dot); transition: background .5s; }

  /* ---------- Room preview: the palette painted into a little living room ---------- */
  .room {
    display: block; width: 100%; height: auto; margin: 14px 0 14px; border-radius: 18px;
    border: 1px solid var(--line); background: var(--soft);
  }
  .room .paint { transition: fill .35s ease; }
  .room .wall { fill: var(--w); }
  .room .sofa { fill: var(--s1); }
  .room .seat { fill: var(--s2); }
  .room .curtain { fill: var(--cu); transform-box: fill-box; transform-origin: 50% 0; animation: drape 5.5s ease-in-out infinite alternate; }
  .room .curtain.r { animation-delay: -2.7s; }
  @keyframes drape { from { transform: skewX(2.5deg); } to { transform: skewX(-2.5deg); } }
  .room .k1 { fill: var(--k1); }
  .room .k2 { fill: var(--k2); }
  .room .rug { fill: var(--rg); }
  .room .art { fill: var(--ar); }
  .room .floor { fill: var(--floor); }
  .room .plank { stroke: var(--floor2); stroke-width: 1; }
  .room .frame { fill: #fffaf2; }
  .room .leaf { fill: #4f8a55; transform-box: fill-box; transform-origin: 50% 100%; animation: leaf 4s ease-in-out infinite alternate; }
  .room .leaf:nth-of-type(2) { animation-delay: -1.3s; }
  .room .leaf:nth-of-type(3) { animation-delay: -2.4s; }
  @keyframes leaf { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .room .glow { animation: lamp 3.2s ease-in-out infinite alternate; }
  @keyframes lamp { from { opacity: .55; } to { opacity: 1; } }
  .room .cloud { animation: drift 14s linear infinite; }
  @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(60px); } }
  .room.splash .wall { animation: fresh .9s ease; }
  @keyframes fresh { 35% { filter: brightness(1.15) saturate(1.1); } }

  /* ---------- Wheel + controls row ---------- */
  .row { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 16px; align-items: center; }
  .wheel {
    position: relative; width: 176px; aspect-ratio: 1; border-radius: 50%; touch-action: none; cursor: crosshair;
    box-shadow: 0 0 0 5px var(--soft), 0 0 0 6px var(--line), 0 18px 30px -18px var(--shadow);
  }
  .wheel canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  .wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .spoke { stroke: rgba(255, 255, 255, .85); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .poly { fill: rgba(255, 255, 255, .16); stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
  .knob {
    position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
    border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); pointer-events: none;
    transition: opacity .35s, scale .45s cubic-bezier(.34, 1.56, .64, 1);
  }
  .knob.off { opacity: 0; scale: .2; }
  .knob.base { width: 32px; height: 32px; margin: -16px 0 0 -16px; border-width: 3.5px; pointer-events: auto; cursor: grab; outline: none; z-index: 2; }
  .knob.base::after {
    content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8);
    animation: halo 2.2s ease-out infinite;
  }
  @keyframes halo { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  .knob.base:focus-visible { box-shadow: 0 0 0 4px var(--ink), 0 2px 8px rgba(0, 0, 0, .4); }
  .wheel.grab .knob.base { cursor: grabbing; scale: 1.12; }

  .side { display: grid; gap: 10px; min-width: 0; }
  .lbl { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .hexfield {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border-radius: 14px;
    background: var(--soft); border: 1.5px solid var(--line); transition: border-color .2s, box-shadow .2s;
  }
  .hexfield:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); }
  .hexfield.bad { border-color: #d64545; animation: nope .4s ease; }
  @keyframes nope { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .hexfield .dot { flex: none; width: 22px; height: 22px; border-radius: 8px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  .hexfield input { flex: 1; width: 0; min-width: 0; border: 0; outline: none; background: none; color: var(--ink); font: 700 16px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .hint { min-height: 16px; margin: -4px 0 0; font-size: 11.5px; color: var(--muted); }
  .hint.err { color: #d64545; font-weight: 600; }
  .contrast { display: flex; align-items: center; gap: 9px; }
  .contrast .aa {
    flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
    background: var(--c); color: var(--on); font-weight: 800; font-size: 16px; transition: color .3s;
  }
  .contrast small { display: block; font-size: 11px; color: var(--muted); }
  .contrast b { font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .grade { margin-left: 4px; padding: 1px 6px; border-radius: 6px; font-size: 10.5px; font-weight: 800; background: var(--soft); border: 1px solid var(--line); }
  .light { display: block; }
  .light .lbl { display: flex; justify-content: space-between; }
  .light .lbl span { font-family: var(--mono); letter-spacing: 0; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; border-radius: 99px; background: var(--track);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
  input[type="range"]:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* ---------- Harmony modes: a segmented control with a sliding pill ---------- */
  .modes { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 16px; padding: 4px; border-radius: 15px; background: var(--soft); border: 1px solid var(--line); }
  .pill {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 5); border-radius: 11px;
    background: var(--card); box-shadow: 0 3px 10px -4px var(--shadow), inset 0 -3px 0 var(--c);
    transition: transform .55s cubic-bezier(.34, 1.56, .64, 1);
  }
  .modes button {
    position: relative; height: 34px; border: 0; border-radius: 11px; background: none; color: var(--muted);
    font: 700 12.5px/1 var(--ff); cursor: pointer; transition: color .25s;
  }
  .modes button[aria-checked="true"] { color: var(--ink); }
  .modes button:focus-visible { outline: 3px solid var(--ink); outline-offset: -2px; }

  /* ---------- Paint chips ---------- */
  .chips { display: flex; gap: 10px; margin: 14px 0 0; padding: 0 0 6px; list-style: none; min-height: 118px; }
  .chips li { flex: 1; min-width: 0; transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); animation: deal .7s cubic-bezier(.34, 1.5, .64, 1) backwards; animation-delay: calc(var(--i) * 75ms); }
  .chips li:hover { transform: translateY(-4px); }
  @keyframes deal { from { opacity: 0; transform: translateY(30px) rotate(calc(var(--r) * 1deg)) scale(.8); } }
  .chips.out li { animation: fold .18s ease-in forwards; animation-delay: calc(var(--i) * 30ms); }
  @keyframes fold { to { opacity: 0; transform: rotateY(80deg) scale(.9); } }
  .chip {
    position: relative; display: block; width: 100%; padding: 5px 5px 8px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink); text-align: left; font: inherit; cursor: pointer;
    box-shadow: 0 10px 18px -14px var(--shadow); transform-origin: 50% 0;
    animation: sway 6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -1.6s);
  }
  @keyframes sway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
  .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .sw { position: relative; display: grid; grid-template-rows: 14px 34px 14px; overflow: hidden; border-radius: 8px; }
  .sw i { display: block; transition: background .15s; }
  .sw i:nth-child(1) { background: var(--t1); }
  .sw i:nth-child(2) { background: var(--t2); }
  .sw i:nth-child(3) { background: var(--t3); }
  .sw svg { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; transform: scale(.3) rotate(-30deg); }
  .sw svg path { fill: none; stroke: var(--on); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
  .chip.copied .sw svg { animation: tick .5s cubic-bezier(.34, 1.56, .64, 1) forwards; }
  .chip.copied .sw svg path { animation: draw .35s .12s ease-out forwards; }
  @keyframes tick { to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .nm { display: block; margin-top: 7px; overflow: hidden; font-size: 12px; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; }
  .hx { display: block; margin-top: 2px; font: 600 10.5px var(--mono); color: var(--muted); }
  .chip.copied .hx { color: var(--ink); }
  /* the paint drop that falls when a chip is copied */
  .drop { position: absolute; left: 50%; top: 44px; width: 9px; height: 12px; margin-left: -4.5px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--t2); opacity: 0; pointer-events: none; }
  .chip.copied .drop { animation: fall .8s cubic-bezier(.55, 0, .9, .6) forwards; }
  @keyframes fall { 0% { opacity: 1; transform: translateY(0) scale(.4, .6); } 25% { transform: translateY(4px) scale(1, 1.4); } 80% { opacity: 1; transform: translateY(66px) scale(.9, 1.2); } 100% { opacity: 0; transform: translateY(70px) scale(2.4, .3); } }

  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 380px) {
    .row { grid-template-columns: 150px minmax(0, 1fr); gap: 12px; }
    .wheel { width: 150px; }
    .modes button { font-size: 11.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="card" aria-labelledby="title">
    <header class="head">
      <div>
        <p class="kicker">Room planner</p>
        <h1 id="title">Pick a wall colour</h1>
      </div>
      <span class="count" id="count"><i id="countDots"></i><span id="countText">3 colours</span></span>
    </header>

    <!-- The palette painted into a small room, so you see the colours working together -->
    <svg class="room" id="room" viewBox="0 0 400 132" aria-hidden="true">
      <defs>
        <linearGradient id="sun" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fcaf0"/><stop offset="1" stop-color="#e6f5ff"/></linearGradient>
        <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffe6a3" stop-opacity=".9"/><stop offset="1" stop-color="#ffe6a3" stop-opacity="0"/></radialGradient>
        <clipPath id="pane"><rect x="32" y="20" width="54" height="50"/></clipPath>
      </defs>
      <rect class="paint wall" width="400" height="104"/>
      <rect width="400" height="104" fill="url(#sun)"/>
      <rect y="98" width="400" height="6" fill="#fff" opacity=".55"/>
      <rect class="floor" y="104" width="400" height="28"/>
      <path class="plank" d="M0 113 H400 M0 122 H400 M60 104 V113 M170 113 V122 M290 104 V113 M120 122 V132 M350 122 V132"/>
      <!-- window with a drifting cloud -->
      <rect class="frame" x="28" y="16" width="62" height="58" rx="3"/>
      <g clip-path="url(#pane)">
        <rect x="32" y="20" width="54" height="50" fill="url(#sky)"/>
        <g class="cloud"><ellipse cx="44" cy="36" rx="10" ry="4.5" fill="#fff"/><ellipse cx="50" cy="33" rx="7" ry="5" fill="#fff"/></g>
      </g>
      <path d="M59 20 V70 M32 45 H86" stroke="#fffaf2" stroke-width="3"/>
      <path class="paint curtain" d="M20 12 H40 Q35 46 41 82 H18 Z"/>
      <path class="paint curtain r" d="M78 12 H98 V82 H75 Q82 46 78 12 Z"/>
      <rect x="15" y="9" width="88" height="3.5" rx="1.75" fill="#3b2f28"/>
      <!-- framed art -->
      <rect x="148" y="16" width="50" height="36" rx="2" fill="#3b2f28"/>
      <rect class="paint art" x="152" y="20" width="42" height="28"/>
      <circle cx="166" cy="30" r="6" fill="#fff" opacity=".7"/>
      <path d="M152 48 L168 36 L178 43 L186 38 L194 46 V48 Z" fill="#000" opacity=".22"/>
      <!-- sofa -->
      <ellipse cx="196" cy="117" rx="98" ry="9" class="paint rug"/>
      <rect class="paint sofa" x="126" y="58" width="140" height="32" rx="11"/>
      <rect class="paint k1" x="142" y="62" width="30" height="24" rx="7" transform="rotate(-9 157 74)"/>
      <rect class="paint k2" x="220" y="62" width="30" height="24" rx="7" transform="rotate(8 235 74)"/>
      <rect class="paint seat" x="132" y="80" width="128" height="18" rx="7"/>
      <rect class="paint sofa" x="116" y="72" width="22" height="28" rx="8"/>
      <rect class="paint sofa" x="254" y="72" width="22" height="28" rx="8"/>
      <path d="M132 100 v5 M260 100 v5" stroke="#3b2f28" stroke-width="3.5" stroke-linecap="round"/>
      <!-- lamp -->
      <circle class="glow" cx="334" cy="40" r="42" fill="url(#lampGlow)"/>
      <path d="M334 44 V101 M322 102 H346" stroke="#3b2f28" stroke-width="3" stroke-linecap="round"/>
      <path class="paint curtain" style="animation:none" d="M320 44 H348 L342 25 H326 Z"/>
      <!-- plant -->
      <path class="leaf" d="M372 86 C362 74 362 62 368 54 C374 64 376 76 372 86 Z"/>
      <path class="leaf" d="M374 86 C380 72 388 66 394 64 C392 74 384 84 374 86 Z"/>
      <path class="leaf" d="M371 86 C364 80 354 78 348 79 C352 86 362 90 371 86 Z"/>
      <path d="M362 86 H384 L380 102 H366 Z" fill="#b5654a"/>
    </svg>

    <div class="row">
      <div class="wheel" id="wheel">
        <canvas id="cv" aria-hidden="true"></canvas>
        <svg viewBox="-100 -100 200 200" aria-hidden="true"><g id="spokes"></g><polygon class="poly" id="poly" points=""/></svg>
        <div class="knob" aria-hidden="true"></div>
        <div class="knob" aria-hidden="true"></div>
        <div class="knob" aria-hidden="true"></div>
        <div class="knob base" id="knob" role="slider" tabindex="0" aria-label="Colour wheel: arrows left and right change the hue, up and down the strength" aria-valuemin="0" aria-valuemax="359" aria-valuenow="18"></div>
      </div>

      <div class="side">
        <div>
          <label class="lbl" for="hex">Wall colour</label>
          <div class="hexfield" id="hexfield">
            <span class="dot" aria-hidden="true"></span>
            <input id="hex" type="text" inputmode="text" maxlength="7" autocomplete="off" spellcheck="false" value="#E0603E" aria-describedby="hint">
          </div>
        </div>
        <p class="hint" id="hint" aria-live="polite">Drag on the wheel or type a hex code</p>
        <div class="contrast">
          <span class="aa" aria-hidden="true">Aa</span>
          <div><small>Text on this wall</small><b id="ratio">4.5:1</b><span class="grade" id="grade">AA</span></div>
        </div>
        <label class="light">
          <span class="lbl">Lightness <span id="litOut">56%</span></span>
          <input id="lit" type="range" min="16" max="86" value="56" step="1">
        </label>
      </div>
    </div>

    <div class="modes" id="modes" role="radiogroup" aria-label="Colour harmony">
      <span class="pill" id="pill" aria-hidden="true"></span>
      <button type="button" role="radio" data-mode="pair" aria-checked="false">Pair</button>
      <button type="button" role="radio" data-mode="triad" aria-checked="true">Triad</button>
      <button type="button" role="radio" data-mode="nearby" aria-checked="false">Nearby</button>
      <button type="button" role="radio" data-mode="split" aria-checked="false">Split</button>
      <button type="button" role="radio" data-mode="square" aria-checked="false">Square</button>
    </div>

    <ul class="chips" id="chips" aria-label="Palette: press a chip to copy its hex code"></ul>
    <p class="sr" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // ---------- Colour maths ----------
  function wrap(h) { return ((h % 360) + 360) % 360; }
  function hslToRgb(h, s, l) {
    h = wrap(h); s /= 100; l /= 100;
    var a = s * Math.min(l, 1 - l);
    function f(n) { var k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }
  function toHex(rgb) { return "#" + rgb.map(function (v) { return Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0"); }).join("").toUpperCase(); }
  function hex(h, s, l) { return toHex(hslToRgb(h, s, Math.max(4, Math.min(96, l)))); }
  function hexToHsl(str) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(str.trim());
    if (!m) return null;
    var x = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
