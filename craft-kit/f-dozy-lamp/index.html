<!doctype html>
<!-- Chill & Craft · Dozy Lamp · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dozy Lamp · pull the cord to wake it</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens: each has an "off" (dark room) and "on" (lit room) value ---------- */
  :root {
    --page-off: #c4c9d8;  --page-on: #fff3dc;
    --wall-off: #9ea6bc;  --wall-on: #fbe7c3;
    --desk-off: #6d6b7d;  --desk-on: #c98d55;
    --edge-off: #85849a;  --edge-on: #e0a874;
    --dim: 0.22;
    --ink-off: #1f2433;   --ink-on: #3d2a17;
    --muted-off: #3e4659; --muted-on: #7a5a3a;
    --shade: #7dd0b6;
    --shade-dk: #4b9f86;
    --lamp: #f4ecdb;
    --cord: #4b4f5e;
    --bead: #ff8f6b;
    --focus: #e8590c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-off: #080a14; --page-on: #261c13;
      --wall-off: #141829; --wall-on: #3d2f22;
      --desk-off: #1e1d2b; --desk-on: #6e4b2c;
      --edge-off: #2a2939; --edge-on: #8f6339;
      --dim: 0.45;
      --ink-off: #e2e5f2; --ink-on: #fff1dc;
      --muted-off: #9aa1b8; --muted-on: #e3c79f;
      --cord: #c9c3b6; --focus: #ffc078;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page-off: #080a14; --page-on: #261c13;
    --wall-off: #141829; --wall-on: #3d2f22;
    --desk-off: #1e1d2b; --desk-on: #6e4b2c;
    --edge-off: #2a2939; --edge-on: #8f6339;
    --dim: 0.45;
    --ink-off: #e2e5f2; --ink-on: #fff1dc;
    --muted-off: #9aa1b8; --muted-on: #e3c79f;
    --cord: #c9c3b6; --focus: #ffc078;
    color-scheme: dark;
  }

  /* ---------- Page ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--page-off);
    color: var(--ink-off);
    transition: background 0.6s ease, color 0.6s ease;
  }
  body.on { background: var(--page-on); color: var(--ink-on); }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .scene {
    position: relative;
    width: min(400px, 92vw, calc((100vh - 140px) * 0.909));
    min-width: 260px;
    aspect-ratio: 400 / 440;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    touch-action: none;
  }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Room ---------- */
  .wall { fill: var(--wall-off); transition: fill 0.6s ease; }
  .desk { fill: var(--desk-off); transition: fill 0.6s ease; }
  .edge { fill: var(--edge-off); transition: fill 0.6s ease; }
  .on .wall { fill: var(--wall-on); }
  .on .desk { fill: var(--desk-on); }
  .on .edge { fill: var(--edge-on); }
  .frame { fill: #5c4a3a; }
  .art-sky { fill: #263a6b; }
  .art-hill { fill: #3f6f5a; }
  .art-moon { fill: #ffe9a8; }
  .book1 { fill: #e05d5d; } .book2 { fill: #4f7cc9; } .book3 { fill: #f1b84b; }
  .mug { fill: #f6f1ea; } .mug-band { fill: #ff8f6b; }
  .steam { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; opacity: 0.35; animation: steam 3s ease-in-out infinite; }
  .steam.s2 { animation-delay: -1.5s; }
  @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: translateY(-10px); opacity: 0; } }
  .dim { fill: #070914; opacity: var(--dim); transition: opacity 0.6s ease; pointer-events: none; }
  .on .dim { opacity: 0; }

  /* ---------- Lamp ---------- */
  .lamp-body { fill: var(--lamp); }
  .neck { fill: none; stroke: var(--lamp); stroke-width: 12; stroke-linecap: round; }
  .neck-hi { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: 0.35; }
  .shade { fill: var(--shade); }
  .rim, .hinge { fill: var(--shade-dk); }
  .shine { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: 0.35; }
  .bulb { fill: #d6d1c3; transition: fill 0.3s ease; }
  .on .bulb { fill: #fff4b8; filter: drop-shadow(0 0 10px #ffe58a); }
  .shade-glow { transition: filter 0.6s ease; }
  .on .shade-glow { filter: drop-shadow(0 0 16px rgba(255, 214, 120, 0.55)); }
  .face-line { fill: none; stroke: #1f2a28; stroke-width: 3.2; stroke-linecap: round; }
  .face-ink { fill: #1f2a28; }
  .cheek { fill: #ff8f9a; opacity: 0.45; }
  .awake { opacity: 0; transition: opacity 0.25s ease; }
  .asleep { opacity: 1; transition: opacity 0.25s ease; }
  .on .awake { opacity: 1; }
  .on .asleep { opacity: 0; }
  .stretch { transform-box: fill-box; transform-origin: 50% 100%; }
  .waking .stretch { animation: stretch 0.7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes stretch { 30% { transform: scale(0.94, 1.14); } 60% { transform: scale(1.05, 0.95); } }
  .snore { fill: rgba(200, 235, 255, 0.55); stroke: rgba(255, 255, 255, 0.8); stroke-width: 1; transform-box: fill-box; transform-origin: 50% 0%; animation: snore 3s ease-in-out infinite; }
  @keyframes snore { 0%, 100% { transform: scale(0.25); } 55% { transform: scale(1.5); } 60% { transform: scale(1.55); } }

  /* light cone and pool; a short flicker when it switches on */
  .light { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
  .on .light { opacity: 1; }
  .flicker .light, .flicker .bulb { animation: flicker 0.55s steps(1, end); }
  @keyframes flicker { 0% { opacity: 0.2; } 15% { opacity: 1; } 30% { opacity: 0.1; } 45% { opacity: 0.9; } 60% { opacity: 0.35; } 75% { opacity: 1; } }
  .lc1 { stop-color: #ffe9a6; stop-opacity: 0.7; }
  .lc2 { stop-color: #ffe9a6; stop-opacity: 0; }
  .mote { fill: #fff6d8; }
  .moth-wing { fill: #efe6d2; opacity: 0.9; }
  .moth-body { fill: #8a7a62; }
  .ray { fill: #fff3b0; }

  /* sleepy z's */
  .zz text { fill: currentColor; font: 800 18px system-ui, sans-serif; opacity: 0; animation: zz 3s ease-in infinite; }
  .zz text:nth-child(2) { animation-delay: 1s; font-size: 22px; }
  .zz text:nth-child(3) { animation-delay: 2s; font-size: 26px; }
  .on .zz, .on .snore { display: none; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 8px); } 30% { opacity: 0.8; } 100% { opacity: 0; transform: translate(14px, -26px); } }

  /* cord */
  .cord { fill: none; stroke: var(--cord); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .bead { fill: var(--bead); }
  .tassel { stroke: var(--bead); stroke-width: 2; stroke-linecap: round; }

  /* the bead is a real button laid over the drawing */
  .pull {
    position: absolute;
    width: 16%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: grab;
    touch-action: none;
  }
  .pull:active { cursor: grabbing; }
  .pull:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .status { margin: 0; min-height: 1.5em; font-size: 15px; font-weight: 600; text-align: center; }
  .hint { margin: 0; font-size: 13px; text-align: center; color: var(--muted-off); transition: color 0.6s; }
  body.on .hint { color: var(--muted-on); }

  @media (prefers-reduced-motion: reduce) {
    .waking .stretch, .steam, .snore, .flicker .light, .flicker .bulb { animation: none; }
    .zz text { animation: none; opacity: 0.7; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Dozy Lamp: a sleepy desk lamp that wakes when you pull its cord</h1>
  <div class="scene" id="scene">
    <svg id="svg" viewBox="0 0 400 440" aria-hidden="true">
      <defs>
        <linearGradient id="coneGrad" gradientUnits="userSpaceOnUse" x1="233" y1="175" x2="250" y2="430">
          <stop offset="0" class="lc1"/><stop offset="1" class="lc2"/>
        </linearGradient>
        <radialGradient id="poolGrad"><stop offset="0" class="lc1"/><stop offset="1" class="lc2"/></radialGradient>
      </defs>

      <!-- Room -->
      <rect class="wall" width="400" height="440"/>
      <rect class="frame" x="36" y="54" width="96" height="76" rx="6"/>
      <rect class="art-sky" x="44" y="62" width="80" height="60" rx="2"/>
      <circle class="art-moon" cx="104" cy="80" r="9"/>
      <path class="art-hill" d="M44 122 L44 104 Q70 88 92 104 Q108 96 124 106 L124 122Z"/>
      <rect class="desk" x="0" y="400" width="400" height="40"/>
      <rect class="edge" x="0" y="398" width="400" height="6"/>

      <!-- Desk things -->
      <rect class="book1" x="292" y="388" width="88" height="12" rx="2"/>
      <rect class="book2" x="298" y="376" width="76" height="12" rx="2"/>
      <rect class="book3" x="288" y="364" width="80" height="12" rx="2"/>
      <path class="mug" d="M318 330 h36 v26 a8 8 0 0 1 -8 8 h-20 a8 8 0 0 1 -8 -8z"/>
      <path class="mug" d="M354 336 a9 9 0 0 1 0 18" fill="none" stroke="#f6f1ea" stroke-width="5"/>
      <rect class="mug-band" x="318" y="340" width="36" height="6"/>
      <path class="steam" d="M330 324 q-6 -8 0 -16 q6 -8 0 -16"/>
      <path class="steam s2" d="M342 324 q-6 -8 0 -16 q6 -8 0 -16"/>

      <!-- Lamp: base, neck, hinge -->
      <path class="lamp-body" d="M75 400 Q75 376 135 376 Q195 376 195 400Z"/>
      <ellipse class="rim" cx="135" cy="378" rx="14" ry="5"/>
      <path class="neck" d="M135 380 C120 300 112 200 193 122"/>
      <path class="neck-hi" d="M131 360 C120 300 116 220 176 140"/>
      <circle class="hinge" cx="193" cy="122" r="9"/>

      <!-- Shade with a face (tilted a little) -->
      <g transform="translate(240 140) rotate(12)">
        <circle class="bulb" cx="0" cy="40" r="16"/>
        <g class="shade-glow"><g class="stretch">
          <path class="shade" d="M-80 30 C-80 -40 80 -40 80 30Z"/>
          <rect class="rim" x="-86" y="26" width="172" height="10" rx="5"/>
          <path class="shine" d="M-60 2 C-58 -16 -34 -28 -10 -30"/>
          <g class="asleep">
            <path class="face-line" d="M-38 2 q9 7 18 0 M20 2 q9 7 18 0"/>
            <ellipse class="face-ink" cx="0" cy="15" rx="3.5" ry="4.5"/>
            <circle class="snore" cx="7" cy="17" r="7"/>
          </g>
          <g class="awake">
            <circle cx="-29" cy="1" r="9.5" fill="#fff"/>
            <circle cx="29" cy="1" r="9.5" fill="#fff"/>
            <g id="pupils">
              <circle class="face-ink" cx="-29" cy="1" r="5.8"/>
              <circle class="face-ink" cx="29" cy="1" r="5.8"/>
              <circle cx="-27" cy="-1" r="1.9" fill="#fff"/>
              <circle cx="31" cy="-1" r="1.9" fill="#fff"/>
            </g>
            <path class="face-line" d="M-10 12 q10 10 20 0"/>
          </g>
          <circle class="cheek" cx="-46" cy="13" r="6"/>
          <circle class="cheek" cx="46" cy="13" r="6"/>
        </g></g>
      </g>

      <!-- Night dims the room; light cone, pool, dust and a moth sit on top -->
      <rect class="dim" width="400" height="440"/>
      <g class="light">
        <polygon points="152,156 316,190 440,440 30,440" fill="url(#coneGrad)"/>
        <ellipse cx="236" cy="402" rx="150" ry="16" fill="url(#poolGrad)"/>
        <g id="motes"></g>
        <g id="moth" transform="translate(262 214)">
          <ellipse id="wingL" class="moth-wing" cx="-5" cy="0" rx="6" ry="4"/>
          <ellipse id="wingR" class="moth-wing" cx="5" cy="0" rx="6" ry="4"/>
          <ellipse class="moth-body" cx="0" cy="0" rx="1.6" ry="4"/>
        </g>
      </g>
      <g id="rays"></g>
      <g class="zz"><text x="296" y="100">z</text><text x="312" y="80">z</text><text x="330" y="58">Z</text></g>

      <!-- Pull cord: a little rope simulated point by point -->
      <path id="cord" class="cord" d="M292 186 L292 264"/>
      <g id="bead">
        <line class="tassel" x1="0" y1="8" x2="-4" y2="20"/>
        <line class="tassel" x1="0" y1="8" x2="0" y2="22"/>
        <line class="tassel" x1="0" y1="8" x2="4" y2="20"/>
        <circle class="bead" r="8.5"/>
        <circle r="2.6" cx="-2.6" cy="-2.6" fill="#fff" opacity="0.6"/>
      </g>
    </svg>
    <button id="pull" class="pull" type="button" aria-pressed="false" aria-label="Pull the lamp cord"></button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">Shh… the lamp is asleep.</p>
  <p class="hint">Drag the cord down and let go, or focus it and press Enter.</p>
</main>

<script>
  (function () {
    "use strict";
    var NS = "http://www.w3.org/2000/svg";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (id) { return document.getElementById(id); };
    var svg = $("svg"), scene = $("scene"), cord = $("cord"), bead = $("bead"), pullBtn = $("pull"), status = $("status");

    function el(tag, attrs, parent) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    }
    function f1(n) { return n.toFixed(1); }
    function toSvg(e) {
      var pt = svg.createSVGPoint(), m = svg.getScreenCTM();
      pt.x = e.clientX; pt.y = e.clientY;
      return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 };
    }

    /* ---------- 1. Rope: verlet points from the shade to the bead ---------- */
    var AX = 292, AY = 186, REST = 78, TRIGGER = 36, MAX = 72, N = 9;
    var rope = [];
    for (var i = 0; i <= N; i++) rope.push({ x: AX, y: AY + (REST / N) * i, px: AX, py: AY + (REST / N) * i });
    var ext = 0, extV = 0;               // how far the cord is pulled out of the lamp
    var dragging = false, grab = null, moved = 0, downX = 0, downY = 0, tween = null;
    var on = false;

    function stepRope(h) {
      var last = rope[N], segLen = (REST + ext) / N;
      for (var i = 1; i <= N; i++) {
        var p = rope[i], vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
        p.px = p.x; p.py = p.y;
        p.x += vx;
        p.y += vy + 900 * h * h; // gravity
      }
      if (grab) { last.x = grab.x; last.y = grab.y; }
      for (var it = 0; it < 14; it++) {
        rope[0].x = AX; rope[0].y = AY;
        for (var j = 0; j < N; j++) {
          var a = rope[j], b = rope[j + 1];
          var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.001;
          var diff = (d - segLen) / d;
          var wa = j === 0 ? 0 : 0.5, wb = (j + 1 === N && grab) ? 0 : 0.5;
          if (wa === 0 && wb !== 0) wb = 1;
          if (wb === 0 && wa !== 0) wa = 1;
          a.x += dx * diff * wa; a.y += dy * diff * wa;
          b.x -= dx * diff * wb; b.y -= dy * diff * wb;
        }
      }
    }
    function drawRope() {
      var d = "M" + f1(rope[0].x) + " " + f1(rope[0].y);
      for (var i = 1; i < N; i++) {
        var mx = (rope[i].x + rope[i + 1].x) / 2, my = (rope[i].y + rope[i + 1].y) / 2;
        d += " Q" + f1(rope[i].x) + " " + f1(rope[i].y) + " " + f1(mx) + " " + f1(my);
      }
      var last = rope[N], prev = rope[N - 1];
      d += " L" + f1(last.x) + " " + f1(last.y);
      cord.setAttribute("d", d);
      var ang = Math.atan2(last.x - prev.x, last.y - prev.y) * -180 / Math.PI;
      bead.setAttribute("transform", "translate(" + f1(last.x) + " " + f1(last.y) + ") rotate(" + ang.toFixed(1) + ")");
      pullBtn.style.left = (last.x / 400 * 100).toFixed(2) + "%";
      pullBtn.style.top = (last.y / 440 * 100).toFixed(2) + "%";
    }

    /* ---------- 2. Room life: dust in the beam, a moth, light rays ---------- */
    var motes = [];
    for (var m = 0; m < 26; m++) {
      var my = 200 + Math.random() * 190, spread = (my - 160) / 280, mx = 240 + (Math.random() - 0.3) * 260 * spread;
      motes.push({
        node: el("circle", { cx: f1(mx), cy: f1(my), r: (0.7 + Math.random() * 1.5).toFixed(2), "class": "mote", opacity: 0.5 }, $("motes")),
        x: mx, y: my, ph: Math.random() * 6.28, sp: 0.2 + Math.random() * 0.5
      });
    }
    var moth = $("moth"), wingL = $("wingL"), wingR = $("wingR");
    var rays = [];
    function burstRays() {
      if (reduce.matches) return;
      for (var i = 0; i < 16; i++) {
        var a = 0.35 + (i / 15) * 2.4 + (Math.random() - 0.5) * 0.15; // fan out below the bulb
        rays.push({ node: el("circle", { r: 2.2, "class": "ray" }, $("rays")), x: 232, y: 182, vx: Math.cos(a) * (120 + Math.random() * 120), vy: Math.sin(a) * (120 + Math.random() * 120), life: 0.7 + Math.random() * 0.4 });
      }
    }

    /* ---------- 3. Switching the lamp ---------- */
    var wakeTimer = 0, flickTimer = 0;
    function toggleLamp() {
      on = !on;
      document.body.classList.toggle("on", on);
      scene.classList.toggle("on", on);
      pullBtn.setAttribute("aria-pressed", String(on));
      status.textContent = on ? "Good morning! The lamp is awake and the light is on." : "Lights out. The lamp drifts back to sleep.";
      scene.classList.remove("waking", "flicker");
      void scene.offsetWidth;
      scene.classList.add("waking");
      if (on) { scene.classList.add("flicker"); burstRays(); }
      clearTimeout(wakeTimer); clearTimeout(flickTimer);
      wakeTimer = setTimeout(function () { scene.classList.remove("waking"); }, 750);
      flickTimer = setTimeout(function () { scene.classList.remove("flicker"); }, 600);
    }
    function release() {
      grab = null;
      dragging = false;
      if (ext > TRIGGER) toggleLamp();
    }

    /* ---------- 4. Dragging the bead ---------- */
    function grabAt(p) {
      // the bead follows the pointer, but the cord can only come out so far
      var dx = p.x - AX, dy = p.y - AY, d = Math.hypot(dx, dy), maxD = REST + MAX;
      if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
      grab = { x: AX + dx, y: AY + dy };
      ext = Math.max(0, d - REST);
      extV = 0;
    }
    pullBtn.addEventListener("pointerdown", function (e) {
      pullBtn.setPointerCapture(e.pointerId);
      dragging = true;
      tween = null;
      moved = 0;
      downX = e.clientX; downY = e.clientY;
    });
    pullBtn.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      moved = Math.max(moved, Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY));
      if (moved > 3) grabAt(toSvg(e));
    });
    function endDrag() {
      if (!dragging) return;
      if (moved < 6) { dragging = false; grab = null; autoPull(); return; } // a tap counts as a pull
      release();
    }
    pullBtn.addEventListener("pointerup", endDrag);
    pullBtn.addEventListener("pointercancel", function () { dragging = false; grab = null; });

    // Keyboard (and screen reader) clicks arrive with detail 0: play the pull for them
    pullBtn.addEventListener("click", function (e) { if (e.detail === 0) autoPull(); });
    function autoPull() { var b = rope[N]; tween = { t: 0, x0: b.x, y0: b.y }; }

    /* ---------- 5. Eyes follow the pointer when awake ---------- */
    var look = { x: 300, y: 420 }, pupils = $("pupils");
    window.addEventListener("pointermove", function (e) { var p = toSvg(e); look.x = p.x; look.y = p.y; });
    var COS = Math.cos(-12 * Math.PI / 180), SIN = Math.sin(-12 * Math.PI / 180);

    /* ---------- 6. Loop ---------- */
    var prevT = performance.now(), acc = 0, H = 1 / 120;
    function loop(now) {
      var dt = Math.min(0.05, (now - prevT) / 1000);
      prevT = now;
      var calm = reduce.matches, t = now / 1000;

      if (tween) {
        tween.t += dt;
        var q = Math.min(1, tween.t / 0.18), e2 = 1 - Math.pow(1 - q, 3);
        grabAt({ x: tween.x0 + (AX - tween.x0) * e2, y: tween.y0 + (AY + REST + 58 - tween.y0) * e2 });
        if (q >= 1) { tween = null; release(); }
      } else if (!grab) {
        // the cord is reeled back in by a spring (no bounce with reduced motion)
        var damp = calm ? 30 : 10;
        extV += (-ext * 160 - extV * damp) * dt;
        ext = Math.max(-4, ext + extV * dt);
      }
      acc += dt;
      while (acc > H) { stepRope(H); acc -= H; }
      if (calm && !grab) {
        // calm mode: the cord hangs straight instead of swinging
        for (var i = 0; i <= N; i++) { rope[i].x = rope[i].px = AX; rope[i].y = rope[i].py = AY + ((REST + ext) / N) * i; }
      }
      drawRope();

      // pupils look at the pointer (in the shade's tilted frame)
      var wx = look.x - 240, wy = look.y - 140;
      var lx = wx * COS - wy * SIN, ly = wx * SIN + wy * COS;
      var d = Math.hypot(lx, ly) || 1, k = Math.min(3.4, d / 30);
      pupils.setAttribute("transform", "translate(" + ((lx / d) * k).toFixed(2) + " " + ((ly / d) * k).toFixed(2) + ")");

      if (on && !calm) {
        motes.forEach(function (mo) {
          mo.node.setAttribute("cx", f1(mo.x + Math.sin(t * mo.sp + mo.ph) * 14));
          mo.node.setAttribute("cy", f1(mo.y + Math.cos(t * mo.sp * 0.7 + mo.ph) * 10));
          mo.node.style.opacity = (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.5 + mo.ph))).toFixed(2);
        });
        // the moth loops around the bulb with fluttering wings
        var mx = 236 + Math.sin(t * 1.7) * 34 + Math.sin(t * 5.3) * 6;
        var my2 = 206 + Math.sin(t * 2.3) * 16 + Math.cos(t * 6.1) * 5;
        moth.setAttribute("transform", "translate(" + f1(mx) + " " + f1(my2) + ") rotate(" + (Math.cos(t * 1.7) * 25).toFixed(0) + ")");
        var flap = (0.25 + 0.75 * Math.abs(Math.sin(t * 28))).toFixed(2);
        wingL.setAttribute("transform", "scale(" + flap + " 1)");
        wingR.setAttribute("transform", "scale(" + flap + " 1)");
      } else if (on) {
        moth.setAttribute("transform", "translate(262 214)");
      }

      for (var r = rays.length - 1; r >= 0; r--) {
        var R = rays[r];
        R.life -= dt;
        if (R.life <= 0) { R.node.remove(); rays.splice(r, 1); continue; }
        R.x += R.vx * dt; R.y += R.vy * dt;
        R.node.setAttribute("cx", f1(R.x)); R.node.setAttribute("cy", f1(R.y));
        R.node.style.opacity = Math.min(1, R.life * 2).toFixed(2);
      }
      requestAnimationFrame(loop);
    }
    drawRope();
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
