<!doctype html>
<!-- Chill and Craft · Crunch Time · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crunch Time · type to outrun the deadline</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens: a sunny office (light) or a late-night office (dark) ---------- */
  :root {
    --page: #eef1f6;
    --ink: #1d2433;
    --muted: #5b6578;
    --card: #ffffff;
    --chip: #e3e8f0;
    --line: rgba(29, 36, 51, 0.14);
    --wall: #dfe6f0;
    --wall2: #cbd5e3;
    --floor: #b9a58c;
    --floor2: #9e8a72;
    --sky: #9fd3ff;
    --city: #7b90b2;
    --win: #fff1b8;
    --sun: #fff7c2;
    --frame: #ffffff;
    --desk: #8a5a3c;
    --desk2: #6e452c;
    --chair: #2f3a4f;
    --chair2: #1f2738;
    --hoodie: #3b82f6;
    --hoodie2: #2563eb;
    --pants: #334155;
    --skin: #e7b58f;
    --hair: #2b1d14;
    --lap: #a3acbd;
    --lap2: #6b7486;
    --monster: #e5383b;
    --monster-dk: #b51f2a;
    --accent: #f26a12;
    --accent-ink: #ffffff;
    --good: #16a34a;
    --pop: #1d2433;
    --focus: #7c3aed;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0e1118; --ink: #e7ecf5; --muted: #9aa5b8; --card: #171b26; --chip: #232a3a; --line: rgba(231, 236, 245, 0.12);
      --wall: #1c2232; --wall2: #161b28; --floor: #3a3029; --floor2: #2b231d; --sky: #0b1430; --city: #24314f;
      --win: #ffd56b; --sun: #fff4d4; --frame: #2a3246; --desk: #5b3b28; --desk2: #452c1e;
      --chair: #3a465e; --chair2: #2a3347; --hoodie: #4f8cff; --hoodie2: #3a6fe0; --pants: #45536b;
      --lap: #7d879a; --lap2: #4f5869; --accent: #ff8a3d; --accent-ink: #1a0d05; --good: #4ade80; --pop: #ffffff; --focus: #ffd166;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0e1118; --ink: #e7ecf5; --muted: #9aa5b8; --card: #171b26; --chip: #232a3a; --line: rgba(231, 236, 245, 0.12);
    --wall: #1c2232; --wall2: #161b28; --floor: #3a3029; --floor2: #2b231d; --sky: #0b1430; --city: #24314f;
    --win: #ffd56b; --sun: #fff4d4; --frame: #2a3246; --desk: #5b3b28; --desk2: #452c1e;
    --chair: #3a465e; --chair2: #2a3347; --hoodie: #4f8cff; --hoodie2: #3a6fe0; --pants: #45536b;
    --lap: #7d879a; --lap2: #4f5869; --accent: #ff8a3d; --accent-ink: #1a0d05; --good: #4ade80; --pop: #ffffff; --focus: #ffd166;
    color-scheme: dark;
  }

  /* ---------- Page and layout ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .game { width: min(640px, 100%, calc((100vh - 325px) * 2.14)); min-width: 290px; display: grid; gap: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- HUD ---------- */
  .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .stat { display: flex; flex-direction: column; min-width: 64px; padding: 4px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .stat span { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .btn {
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: 700 14px system-ui, sans-serif;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn:focus-visible, .type-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Scene ---------- */
  .scene {
    position: relative;
    aspect-ratio: 600 / 280;
    border-radius: 18px;
    overflow: hidden;
    background: var(--wall);
    box-shadow: 0 16px 40px rgba(10, 14, 30, 0.22);
  }
  .shake, .shake svg, .shake canvas, .vignette { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shake svg { display: block; }
  .vignette { pointer-events: none; opacity: 0; box-shadow: inset 0 0 60px 22px rgba(255, 30, 50, 0.85); }
  .tag {
    position: absolute; left: 10px; top: 10px; padding: 3px 8px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.5); color: #fff; font: 800 11px system-ui, sans-serif; letter-spacing: 0.1em;
  }
  .panel {
    position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px;
    padding: 12px; text-align: center; color: #fff; background: rgba(10, 12, 22, 0.6);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .panel h2 { margin: 0; font-size: clamp(20px, 5vw, 30px); }
  .panel p { margin: 0; font-size: 15px; }
  .new-best { color: #ffd166; font-weight: 800; }

  /* SVG classes */
  .wall { fill: var(--wall); } .wall2 { fill: var(--wall2); }
  .floor { fill: var(--floor); } .floor2 { fill: var(--floor2); }
  .frame { fill: var(--frame); } .sky { fill: var(--sky); } .city { fill: var(--city); } .sun { fill: var(--sun); }
  .win { fill: var(--win); transition: opacity 0.3s; } .win.off { opacity: 0.15; }
  .cloud { fill: #fff; opacity: 0.75; animation: drift 18s linear infinite; }
  @keyframes drift { from { transform: translateX(-50px); } to { transform: translateX(140px); } }
  .clock-face { fill: #fff; } .clock-rim { fill: none; stroke: var(--chair); stroke-width: 3; }
  .hand { stroke: var(--chair2); stroke-width: 3; stroke-linecap: round; } .hand.thin { stroke-width: 2; stroke: var(--monster); }
  .note text { font: 800 9px system-ui, sans-serif; fill: #3a3a3a; text-anchor: middle; }
  .n1 { fill: #ffe066; } .n2 { fill: #ffa8c5; } .n3 { fill: #9be7c4; }
  .desk { fill: var(--desk); } .desk2 { fill: var(--desk2); }
  .mug { fill: #f6f1ea; } .mug-handle { fill: none; stroke: #f6f1ea; stroke-width: 4; } .mug-text { font: 800 7px system-ui, sans-serif; fill: var(--monster); text-anchor: middle; }
  .steam { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; opacity: 0; animation: steam 2.6s ease-in-out infinite; }
  .steam.s2 { animation-delay: -1.3s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: 0.55; } 100% { opacity: 0; transform: translateY(-12px); } }
  .lap-base { fill: var(--lap); } .lap-screen { fill: var(--lap2); }
  .chair { fill: var(--chair); } .chair-dk { fill: var(--chair2); } .wheel { fill: #111827; }
  .hoodie { fill: var(--hoodie); } .skin { fill: var(--skin); } .hair { fill: var(--hair); }
  .arm { stroke: var(--hoodie); stroke-width: 10; stroke-linecap: round; } .arm.far { stroke: var(--hoodie2); }
  .far-skin { filter: brightness(0.85); }
  .pants { fill: none; stroke: var(--pants); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; } .shoe { fill: #111827; }
  .glasses { fill: none; stroke: #111827; stroke-width: 1.8; } .mouth { fill: none; stroke: #5b2a1a; stroke-width: 1.8; stroke-linecap: round; }
  .m-skin { fill: var(--monster); } .m-dk { fill: var(--monster-dk); } .m-foot { fill: var(--monster-dk); }
  .m-arm { fill: none; stroke: var(--monster-dk); stroke-width: 10; stroke-linecap: round; }
  .m-hi { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0.25; }
  .m-ink { fill: #2a0a0e; } .brow { fill: none; stroke: #2a0a0e; stroke-width: 5; stroke-linecap: round; }
  .m-shadow { fill: rgba(0, 0, 0, 0.18); }
  .m-open { display: none; } #monster.roar .m-open { display: inline; } #monster.roar .m-closed { display: none; }
  .cal { fill: #ffffff; } .cal-top { fill: #d62839; } .cal-ring { fill: #3a3a3a; }
  .cal-due { font: 800 11px system-ui, sans-serif; fill: #fff; text-anchor: middle; }
  .cal-today { font: 900 13px system-ui, sans-serif; fill: #1d2433; text-anchor: middle; }
  .star { fill: #ffd166; }

  /* ---------- Feature progress ---------- */
  .feature { display: grid; gap: 4px; }
  .feature-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
  .feature-top span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
  .track { height: 12px; border-radius: 999px; background: var(--chip); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #22c55e, #84cc16, #facc15); transition: width 0.12s ease; }

  /* ---------- Code editor ---------- */
  .editor { border-radius: 14px; overflow: hidden; background: #1b1d29; color: #e6e8f0; border: 1px solid rgba(255, 255, 255, 0.06); }
  .ed-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #14161f; color: #9aa3b8; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ed-bar i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .code {
    height: calc(4 * 1.45em + 14px);
    padding: 7px 12px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .ln { min-height: 1.45em; white-space: pre-wrap; word-break: break-all; }
  .kw { color: #ff7ab6; } .str { color: #a5e075; } .com { color: #7c8299; font-style: italic; } .num { color: #ffb86c; }
  .caret { display: inline-block; width: 7px; height: 1.1em; vertical-align: text-bottom; background: #ffd166; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }

  .type-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 800 18px system-ui, sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
  }
  .type-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .steam, .caret { animation: none; }
    .steam { opacity: 0.3; }
    .track i { transition: none; }
    .type-btn:active { transform: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="game">
    <h1 class="sr">Crunch Time: type as fast as you can to keep the deadline monster away</h1>

    <div class="hud">
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Sprint</span><b id="sprint">1</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="start">Start</button>
      <button type="button" class="btn" id="pause" aria-pressed="false" hidden>Pause</button>
    </div>

    <div class="scene" id="scene">
      <div class="shake" id="shake">
        <svg viewBox="0 0 600 280" aria-hidden="true">
          <defs>
            <linearGradient id="glowGrad" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.55"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="winClip"><rect width="120" height="80"/></clipPath>
          </defs>

          <!-- Room -->
          <rect class="wall" width="600" height="240"/>
          <rect class="wall2" y="200" width="600" height="40"/>

          <!-- Window with a little city -->
          <g transform="translate(170 26)">
            <rect class="frame" x="-6" y="-6" width="132" height="92" rx="6"/>
            <g clip-path="url(#winClip)">
              <rect class="sky" width="120" height="80"/>
              <circle class="sun" cx="96" cy="18" r="9"/>
              <path class="cloud" d="M10 24 a8 8 0 0 1 14 -5 a10 10 0 0 1 18 4 a6 6 0 0 1 0 11 h-30 a5 5 0 0 1 -2 -10z"/>
              <path class="city" d="M0 80 V52 H14 V40 H28 V58 H40 V30 H56 V48 H66 V36 H82 V54 H94 V44 H108 V60 H120 V80Z"/>
              <g id="cityWins"></g>
            </g>
            <rect class="frame" x="58" y="0" width="4" height="80"/>
          </g>

          <!-- Wall clock (spins faster as the deadline closes in) -->
          <g transform="translate(80 62)">
            <circle class="clock-face" r="24"/>
            <circle class="clock-rim" r="24"/>
            <line id="hourHand" class="hand" x1="0" y1="0" x2="0" y2="-11"/>
            <line id="minHand" class="hand thin" x1="0" y1="0" x2="0" y2="-18"/>
            <circle r="2.5" fill="#1f2738"/>
          </g>

          <!-- Sticky notes -->
          <g class="note">
            <g transform="translate(470 40) rotate(-4)"><rect class="n1" width="44" height="38"/><text x="22" y="17">FIX</text><text x="22" y="30">BUGS</text></g>
            <g transform="translate(522 52) rotate(5)"><rect class="n2" width="44" height="38"/><text x="22" y="17">SHIP</text><text x="22" y="30">IT!!</text></g>
            <g transform="translate(494 96) rotate(-2)"><rect class="n3" width="44" height="34"/><text x="22" y="21">SLEEP?</text></g>
          </g>

          <!-- Floor and desk -->
          <rect class="floor" y="240" width="600" height="40"/>
          <rect class="floor2" y="240" width="600" height="4"/>
          <rect class="desk" x="380" y="158" width="210" height="9" rx="2"/>
          <rect class="desk2" x="392" y="167" width="8" height="73"/>
          <rect class="desk2" x="570" y="167" width="8" height="73"/>
          <rect class="desk2" x="400" y="167" width="170" height="6"/>

          <!-- Mug with steam -->
          <g transform="translate(540 136)">
            <path class="steam" d="M6 -4 q-5 -7 0 -14 q5 -7 0 -14"/>
            <path class="steam s2" d="M13 -4 q-5 -7 0 -14 q5 -7 0 -14"/>
            <rect class="mug" width="20" height="22" rx="3"/>
            <path class="mug-handle" d="M20 5 a6 6 0 0 1 0 12"/>
            <text class="mug-text" x="10" y="14">404</text>
          </g>

          <!-- Laptop (its screen faces the developer) -->
          <rect class="lap-base" x="402" y="152" width="74" height="6" rx="2"/>
          <rect class="lap-screen" x="-3" y="-52" width="6" height="54" rx="2" transform="translate(474 155) rotate(14)"/>

          <!-- Chair and developer: one group so they wobble together -->
          <g id="seat">
            <rect class="chair" x="286" y="118" width="13" height="80" rx="6" transform="rotate(-6 292 198)"/>
            <line id="farUpper" class="arm far" x1="352" y1="128" x2="380" y2="158"/>
            <line id="farFore" class="arm far" x1="380" y1="158" x2="426" y2="150"/>
            <circle id="farHand" class="skin far-skin" cx="426" cy="150" r="5.5"/>
            <rect class="chair" x="294" y="188" width="74" height="10" rx="4"/>
            <rect class="chair-dk" x="327" y="198" width="7" height="36"/>
            <path class="chair-dk" d="M296 239 L364 239 L360 233 L300 233Z"/>
            <circle class="wheel" cx="300" cy="243" r="4"/>
            <circle class="wheel" cx="330" cy="245" r="4"/>
            <circle class="wheel" cx="360" cy="243" r="4"/>
            <path class="pants" d="M330 190 L394 192 L398 232"/>
            <ellipse class="shoe" cx="406" cy="236" rx="12" ry="5"/>
            <path class="hoodie" d="M318 194 Q312 150 336 120 Q356 108 372 122 Q380 150 366 194Z"/>
            <circle class="skin" cx="362" cy="96" r="19"/>
            <path class="hair" d="M343 98 Q340 72 362 71 Q384 71 382 88 Q372 81 362 86 Q352 90 349 102Z"/>
            <circle class="skin" cx="355" cy="99" r="4"/>
            <circle class="glasses" cx="376" cy="95" r="5.5"/>
            <line class="glasses" x1="370.5" y1="95" x2="357" y2="96"/>
            <path id="mouth" class="mouth" d="M374 108 q4 2 7 0"/>
            <line id="nearUpper" class="arm" x1="356" y1="130" x2="376" y2="162"/>
            <line id="nearFore" class="arm" x1="376" y1="162" x2="414" y2="152"/>
            <circle id="nearHand" class="skin" cx="414" cy="152" r="6"/>
          </g>
          <polygon id="glow" points="466,106 470,150 384,116 380,84" fill="url(#glowGrad)"/>

          <!-- The deadline monster -->
          <g id="monster" transform="translate(-170 0)">
            <ellipse id="mShadow" class="m-shadow" cx="75" cy="242" rx="66" ry="7"/>
            <g id="mBody">
              <path class="m-arm" d="M30 170 Q4 150 14 124"/>
              <path class="m-skin" d="M10 240 C0 200 6 150 24 126 L30 104 L44 120 L56 96 L68 118 L82 94 L94 118 L108 100 L114 126 C140 150 150 200 142 240Z"/>
              <path class="m-dk" d="M10 240 C0 200 6 150 24 126 L30 112 C24 160 26 210 40 240Z"/>
              <path class="m-hi" d="M104 134 C120 148 128 168 130 190"/>
              <ellipse class="m-foot" cx="40" cy="240" rx="18" ry="7"/>
              <ellipse class="m-foot" cx="112" cy="240" rx="18" ry="7"/>
              <ellipse cx="80" cy="150" rx="12" ry="13" fill="#fff"/>
              <ellipse cx="110" cy="148" rx="11" ry="12" fill="#fff"/>
              <circle class="m-ink" cx="86" cy="152" r="5.5"/>
              <circle class="m-ink" cx="115" cy="150" r="5"/>
              <path class="brow" d="M64 132 L92 143 M98 141 L124 128"/>
              <g class="m-closed">
                <path class="m-ink" d="M72 182 Q100 198 128 178 Q100 188 72 182Z"/>
                <path fill="#fff" d="M80 185 l4 6 l4 -5 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -7z"/>
              </g>
              <g class="m-open">
                <path class="m-ink" d="M68 176 Q100 226 132 172 Q100 186 68 176Z"/>
                <path fill="#fff" d="M75 179 l5 9 l5 -8 l5 9 l5 -8 l5 9 l5 -8 l5 9 l5 -9 l5 8 l5 -9z"/>
                <ellipse cx="100" cy="202" rx="10" ry="5" fill="#ff8fa3"/>
              </g>
              <path class="m-arm" d="M126 186 Q146 186 156 172"/>
              <g transform="translate(150 126) rotate(-8)">
                <rect class="cal" width="58" height="52" rx="4"/>
                <rect class="cal-top" width="58" height="17" rx="4"/>
                <rect class="cal-top" y="10" width="58" height="7"/>
                <text class="cal-due" x="29" y="13">DUE</text>
                <text class="cal-today" x="29" y="40">TODAY</text>
                <circle class="cal-ring" cx="14" cy="2" r="2.5"/>
                <circle class="cal-ring" cx="44" cy="2" r="2.5"/>
              </g>
              <ellipse class="m-foot" cx="156" cy="172" rx="7" ry="6"/>
              <g id="dizzy">
                <path class="star" d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5Z"/>
                <path class="star" d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5Z"/>
                <path class="star" d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5Z"/>
              </g>
            </g>
          </g>
        </svg>
        <canvas id="fx" aria-hidden="true"></canvas>
        <div class="vignette" id="vignette"></div>
      </div>
      <span class="tag" id="demoTag">DEMO</span>

      <div class="panel" id="overPanel" hidden>
        <h2>Deadline missed!</h2>
        <p>Score <b id="finalScore">0</b> · Best <b id="finalBest">0</b></p>
        <p class="new-best" id="newBest" hidden>New best!</p>
        <button type="button" class="btn primary" id="restart">Restart</button>
      </div>
      <div class="panel" id="pausePanel" hidden>
        <h2>Paused</h2>
        <p>The deadline is waiting too.</p>
        <button type="button" class="btn primary" id="resume">Resume</button>
      </div>
    </div>

    <div class="feature">
      <div class="feature-top"><span id="featName">Demo · watch the crunch</span><span id="featPct">0%</span></div>
      <div class="track" id="featBar" role="progressbar" aria-label="Feature progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="featFill"></i></div>
    </div>

    <div class="editor" aria-hidden="true">
      <div class="ed-bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>&nbsp;ship-it.js</div>
      <div class="code" id="code"></div>
    </div>

    <button type="button" class="type-btn" id="type">Start typing</button>
    <p class="sr" id="live" aria-live="polite"></p>
  </div>
</main>

<script>
  (function () {
    "use strict";
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    const $ = (id) => document.getElementById(id);
    const scene = $("scene"), shakeEl = $("shake"), fxCanvas = $("fx"), fxCtx = fxCanvas.getContext("2d");
    const monster = $("monster"), mBody = $("mBody"), mShadow = $("mShadow"), dizzy = $("dizzy");
    const stars = Array.from(dizzy.children);
    const seat = $("seat"), mouth = $("mouth"), glow = $("glow"), vignette = $("vignette");
    const farFore = $("farFore"), farHand = $("farHand"), nearFore = $("nearFore"), nearHand = $("nearHand");
    const minHand = $("minHand"), hourHand = $("hourHand");
    const scoreEl = $("score"), sprintEl = $("sprint"), bestEl = $("best");
    const startBtn = $("start"), pauseBtn = $("pause"), typeBtn = $("type");
    const overPanel = $("overPanel"), pausePanel = $("pausePanel"), restartBtn = $("restart"), resumeBtn = $("resume");
    const finalScore = $("finalScore"), finalBest = $("finalBest"), newBest = $("newBest"), demoTag = $("demoTag");
    const featName = $("featName"), featPct = $("featPct"), featFill = $("featFill"), featBar = $("featBar");
    const codeEl = $("code"), live = $("live");

    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const say = (text) => { live.textContent = text; };

    /* Colours the canvas needs, read from the CSS tokens */
    const colours = {};
    function readColours() {
      const cs = getComputedStyle(document.documentElement);
      ["accent", "good", "pop", "monster"].forEach((k) => { colours[k] = cs.getPropertyValue("--" + k).trim(); });
    }

    /* ---------- 1. Little city windows that blink ---------- */
    const WINS = [[4, 58], [4, 66], [18, 46], [22, 56], [18, 66], [32, 64], [44, 36], [50, 44], [44, 54], [50, 64], [59, 56], [70, 42], [76, 52], [70, 62], [86, 60], [98, 50], [102, 60], [112, 66]];
    const winEls = WINS.map(([x, y]) => {
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 3); r.setAttribute("height", 4);
      r.setAttribute("class", Math.random() < 0.3 ? "win off" : "win");
      $("cityWins").appendChild(r);
      return r;
    });

    /* ---------- 2. The code that gets typed ---------- */
    const CODE = [
      "// sprint goal: ship before the monster",
      "const coffee = refill(mug, { size: \"XL\" });",
      "function shipIt(feature) {",
      "  if (bugs.length > 0) blame(\"the cache\");",
      "  while (deadline.isNear()) typeFaster();",
      "  tests.skip(\"we will fix it later\");",
      "  return deploy(feature, { pray: true });",
      "}",
      "const standup = meeting.cancel(\"too busy\");",
      "let sleep = null; // TODO: someday",
      "await merge(\"main\", { force: true });",
      "console.log(\"works on my machine\");",
      "if (!monster.asleep) panic(42);",
      ""
    ].join("\n");
    let codePos = 0, typed = "";
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    // tiny highlighter: comments, strings (even half-typed ones), keywords, numbers
    function highlight(line) {
      const ci = line.indexOf("//");
      const code = ci >= 0 ? line.slice(0, ci) : line, com = ci >= 0 ? line.slice(ci) : "";
      const html = code.split(/("[^"]*"?)/).map((seg, i) => i % 2
        ? `<span class="str">${esc(seg)}</span>`
        : esc(seg)
            .replace(/\b(const|let|function|return|if|while|await|null|true|false)\b/g, '<span class="kw">$1</span>')
            .replace(/\b(\d+)\b/g, '<span class="num">$1</span>')
      ).join("");
      return html + (com ? `<span class="com">${esc(com)}</span>` : "");
    }
    function renderCode() {
      const lines = typed.split("\n").slice(-4);
      codeEl.innerHTML = lines.map((l, i) => `<div class="ln">${highlight(l)}${i === lines.length - 1 ? '<span class="caret"></span>' : ""}</div>`).join("");
    }
    function typeChar() {
      if (codePos >= CODE.length) codePos = 0;
      const ch = CODE[codePos++];
      typed += ch;
      if (ch === "\n") while (CODE[codePos] === " ") typed += CODE[codePos++]; // indentation comes free
      if (typed.length > 900) typed = typed.slice(typed.length - 500);
      renderCode();
    }

    /* ---------- 3. Game state ---------- */
    const FEATURES = ["Login page", "Dark mode", "Payment flow", "Search bar", "Push alerts", "Invoice PDF", "Chat widget", "Admin panel", "Offline mode", "Everything else"];
    const KEY = "crunch-time-best";
    let best = 0;
    try { best = parseInt(localStorage.getItem(KEY) || "0", 10) || 0; } catch (e) { best = 0; }
    const S = { state: "demo", paused: false, score: 0, sprint: 1, d: 0.3, progress: 0, chars: 0, knock: 0, stunned: 0, combo: 0, lastKey: 0, rate: 0, warned: false, fall: 0, nextRoar: 2 };
    const need = () => 55 + S.sprint * 10;                      // characters per feature
    const speed = () => 0.042 + (S.sprint - 1) * 0.011;        // how fast the monster closes in
    const featureName = () => FEATURES[(S.sprint - 1) % FEATURES.length];

    function bump(node) {
      if (!reduce.matches && node.animate) node.animate([{ transform: "scale(1.3)" }, { transform: "scale(1)" }], { duration: 180, easing: "ease-out" });
    }
    function updateHud() {
      scoreEl.textContent = String(S.score);
      sprintEl.textContent = String(S.sprint);
      bestEl.textContent = String(best);
    }
    let shownLabel = "", shownPct = -1;
    function setFeature(p, label) {
      if (label !== shownLabel) { shownLabel = label; featName.textContent = label; }
      const pct = Math.min(100, Math.round(p * 100));
      if (pct !== shownPct) {
        shownPct = pct;
        featPct.textContent = pct + "%";
        featFill.style.width = pct + "%";
        featBar.setAttribute("aria-valuenow", String(pct));
      }
    }
    const updateFeature = () => setFeature(S.progress, `Sprint ${S.sprint} · ${featureName()}`);

    function start() {
      Object.assign(S, { state: "play", paused: false, score: 0, sprint: 1, d: 0.12, progress: 0, chars: 0, knock: 0, stunned: 0, combo: 0, lastKey: 0, rate: 0, warned: false, fall: 0, nextRoar: 2 });
      clearTimeout(overTimer);
      typed = ""; codePos = 0; renderCode();
      overPanel.hidden = true; pausePanel.hidden = true; demoTag.hidden = true;
      startBtn.hidden = true; pauseBtn.hidden = false;
      pauseBtn.setAttribute("aria-pressed", "false"); pauseBtn.textContent = "Pause";
      typeBtn.textContent = "Type!";
      updateHud(); updateFeature();
      typeBtn.focus();
      say(`Sprint 1: ${FEATURES[0]}. Press any key to type and push the deadline back.`);
    }

    function keystroke() {
      if (S.state !== "play" || S.paused) return;
      const now = performance.now();
      S.combo = now - S.lastKey < 350 ? S.combo + 1 : 1;
      S.lastKey = now;
      const mult = S.combo >= 40 ? 3 : S.combo >= 15 ? 2 : 1;
      S.score += mult;
      S.rate = Math.min(16, S.rate + 1);
      S.d = Math.max(0, S.d - 0.016); // every key shoves the deadline back a little
      S.chars++;
      S.progress = Math.min(1, S.chars / need());
      typeChar();
      keySparks(3);
      pop("+" + mult, 436 + (Math.random() - 0.5) * 24, 136, mult > 1 ? colours.accent : colours.pop, 12 + mult * 2, false);
      if (S.combo === 15 || S.combo === 40) {
        pop(`Combo x${mult}!`, 430, 108, colours.accent, 18, true);
        shakeAmp = Math.max(shakeAmp, 2.5);
      }
      updateHud(); bump(scoreEl); updateFeature();
      if (S.progress >= 1) ship();
    }

    function ship() {
      S.score += 250;
      S.sprint++;
      S.chars = 0; S.progress = 0;
      S.knock = 0.35;   // knocked back...
      S.stunned = 1.4;  // ...and seeing stars
      confetti(470, 108, 70);
      pop("+250", 452, 118, colours.accent, 22, true);
      pop("SHIPPED!", 300, 70, colours.good, 34, true);
      shakeAmp = 8;
      updateHud(); bump(sprintEl); updateFeature();
      say(`Shipped! Plus 250 points. Sprint ${S.sprint}: ${featureName()}.`);
    }

    let overTimer = 0;
    function gameOver() {
      S.state = "over"; S.fall = 0; S.d = 1;
      shakeAmp = 14; flash = 1;
      roar();
      let isBest = false;
      if (S.score > best) {
        best = S.score; isBest = true;
        try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage blocked: keep it for this visit */ }
      }
      finalScore.textContent = String(S.score);
      finalBest.textContent = String(best);
      newBest.hidden = !isBest;
      pauseBtn.hidden = true;
      typeBtn.textContent = "Play again";
      updateHud();
      say(`Deadline missed! Score ${S.score}. Best ${best}.`);
      clearTimeout(overTimer);
      overTimer = setTimeout(() => {
        if (S.state === "over") { overPanel.hidden = false; restartBtn.focus(); }
      }, reduce.matches ? 250 : 900);
    }

    function setPaused(on) {
      if (S.state !== "play" || S.paused === on) return;
      S.paused = on;
      pausePanel.hidden = !on;
      pauseBtn.setAttribute("aria-pressed", String(on));
      pauseBtn.textContent = on ? "Resume" : "Pause";
      if (on) { resumeBtn.focus(); say("Paused."); }
      else { typeBtn.focus(); say("Back to work!"); }
    }

    /* ---------- 4. Input ---------- */
    startBtn.addEventListener("click", start);
    restartBtn.addEventListener("click", start);
    resumeBtn.addEventListener("click", () => setPaused(false));
    pauseBtn.addEventListener("click", () => setPaused(!S.paused));
    // pointer taps type at once; keyboard presses are counted by the keydown handler,
    // so the click they cause (detail 0) is ignored during play
    typeBtn.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (S.state !== "play") start(); else keystroke();
    });
    typeBtn.addEventListener("click", (e) => { if (e.detail === 0 && S.state !== "play") start(); });
    document.addEventListener("keydown", (e) => {
      if (S.state !== "play") return;
      if (e.key === "Escape") { e.preventDefault(); setPaused(!S.paused); return; }
      if (S.paused || e.ctrlKey || e.metaKey || e.altKey) return;
      const otherButton = e.target instanceof HTMLButtonElement && e.target !== typeBtn;
      if ((e.key === " " || e.key === "Enter") && otherButton) return; // let Pause work normally
      if (e.key.length === 1 || e.key === "Enter" || e.key === "Backspace") {
        e.preventDefault();
        if (!e.repeat) keystroke();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && S.state === "play") setPaused(true);
    });

    /* ---------- 5. Effects canvas (drawn in scene units, 600 x 280) ---------- */
    const fx = [];
    function resizeFx() {
      const r = scene.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      fxCanvas.width = Math.max(1, Math.round(r.width * dpr));
      fxCanvas.height = Math.max(1, Math.round(r.height * dpr));
      const k = r.width / 600;
      fxCtx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    }
    new ResizeObserver(resizeFx).observe(scene);
    const SPARK = ["#ffd166", "#ff7ab6", "#7dd3fc", "#a3e635", "#fb923c"];
    const add = (p) => { if (fx.length < 400) fx.push(p); };
    function keySparks(n) {
      if (reduce.matches) return;
      for (let i = 0; i < n; i++) add({ t: "spark", x: 412 + Math.random() * 36, y: 151, vx: (Math.random() - 0.5) * 140, vy: -60 - Math.random() * 120, g: 430, c: pick(SPARK), age: 0, life: 0.4 + Math.random() * 0.3 });
    }
    function pop(text, x, y, color, size, big) {
      add({ t: "pop", text, x, y, vy: reduce.matches ? 0 : -42, c: color, size, big, age: 0, life: big ? 1.3 : 0.7 });
    }
    function confetti(x, y, n) {
      if (reduce.matches) return;
      for (let i = 0; i < n; i++) add({ t: "conf", x, y, vx: (Math.random() - 0.5) * 340, vy: -140 - Math.random() * 230, g: 420, rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 14, w: 4 + Math.random() * 3, h: 2 + Math.random() * 2, c: pick(SPARK), age: 0, life: 1.6 + Math.random() });
    }
    function sweat() {
      if (reduce.matches) return;
      add({ t: "drop", x: 350 + Math.random() * 6, y: 84, vx: -40 - Math.random() * 60, vy: -60 - Math.random() * 50, g: 420, age: 0, life: 0.9 });
    }
    function stepFx(dt) {
      fxCtx.clearRect(0, 0, 600, 280);
      for (let i = fx.length - 1; i >= 0; i--) {
        const p = fx[i];
        p.age += dt;
        if (p.age >= p.life) { fx.splice(i, 1); continue; }
        fxCtx.globalAlpha = 1 - p.age / p.life;
        if (p.t === "pop") {
          p.y += p.vy * dt;
          const s = p.big && !reduce.matches ? 1 + 0.6 * Math.max(0, 1 - p.age / 0.18) : 1; // punch in
          fxCtx.font = `800 ${(p.size * s).toFixed(1)}px system-ui, -apple-system, "Segoe UI", sans-serif`;
          fxCtx.textAlign = "center";
          fxCtx.textBaseline = "middle";
          fxCtx.lineWidth = 3;
          fxCtx.strokeStyle = "rgba(0,0,0,0.35)";
          fxCtx.strokeText(p.text, p.x, p.y);
          fxCtx.fillStyle = p.c;
          fxCtx.fillText(p.text, p.x, p.y);
          continue;
        }
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.t === "spark") {
          fxCtx.fillStyle = p.c;
          fxCtx.beginPath(); fxCtx.arc(p.x, p.y, 1.8, 0, Math.PI * 2); fxCtx.fill();
        } else if (p.t === "conf") {
          p.rot += p.spin * dt;
          fxCtx.save();
          fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
          fxCtx.fillStyle = p.c;
          fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          fxCtx.restore();
        } else if (p.t === "drop") {
          fxCtx.fillStyle = "#7cc8ff";
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, 2.6, 0, Math.PI);
          fxCtx.lineTo(p.x, p.y - 6);
          fxCtx.closePath();
          fxCtx.fill();
        }
      }
      fxCtx.globalAlpha = 1;
    }

    /* ---------- 6. Update and draw the scene ---------- */
    let T = 0, demoAcc = 0, demoProg = 0, roarT = 0, handPh = 0, clockMin = 0, flash = 0, shakeAmp = 0, winTimer = 0, mood = "";
    const MOUTHS = { calm: "M374 108 q4 2 7 0", worried: "M374 110 q3.5 -3 7 0", shock: "M377.5 106 a2.5 3 0 1 0 0.1 0" };

    function roar() {
      roarT = 0.6;
      pop(Math.random() < 0.5 ? "GRR!" : "RAWR!", -170 + S.d * 320 + 100, 150, colours.monster, 16, true);
      if (S.state === "play") shakeAmp = Math.max(shakeAmp, 3);
    }

    function update(dt) {
      roarT = Math.max(0, roarT - dt);
      if (S.state === "demo") {
        // attract mode: the scene plays by itself
        S.d = 0.36 + 0.3 * Math.sin(T * 0.5);
        S.rate = 6;
        demoAcc += dt;
        while (demoAcc > 0.085) { demoAcc -= 0.085; typeChar(); if (Math.random() < 0.35) keySparks(1); }
        demoProg = (demoProg + dt * 0.07) % 1;
        setFeature(demoProg, "Demo · watch the crunch");
        if (S.d > 0.62 && roarT <= 0 && Math.random() < dt * 0.4) roar();
      } else if (S.state === "play" && !S.paused) {
        if (S.knock > 0) { const step = Math.min(S.knock, dt * 1.4); S.d = Math.max(0, S.d - step); S.knock -= step; }
        if (S.stunned > 0) S.stunned -= dt;
        else S.d += speed() * dt;
        S.rate *= Math.pow(0.3, dt);
        S.nextRoar -= dt;
        if (S.d > 0.7 && S.nextRoar <= 0) { roar(); S.nextRoar = 2 + Math.random() * 2; }
        if (!S.warned && S.d > 0.8) { S.warned = true; say("Careful! The deadline is right behind you."); }
        if (S.d < 0.6) S.warned = false;
        if (S.d >= 1) gameOver();
      } else if (S.state === "over") {
        S.d += (1.08 - S.d) * Math.min(1, dt * 6); // the monster pounces
        S.fall = Math.min(1, S.fall + dt * 2.5);
      }
    }

    function setHand(line, hand, hx, hy) {
      line.setAttribute("x2", hx.toFixed(1)); line.setAttribute("y2", hy.toFixed(1));
      hand.setAttribute("cx", hx.toFixed(1)); hand.setAttribute("cy", hy.toFixed(1));
    }

    function render(dt) {
      const calm = reduce.matches, d = S.d;
      // monster: position, squash-and-stretch, little hops
      const mx = -170 + d * 320;
      monster.setAttribute("transform", `translate(${mx.toFixed(1)} 0)`);
      const moving = S.state === "demo" || (S.state === "play" && !S.paused && S.stunned <= 0);
      const w = calm ? 0 : 0.035 * Math.sin(T * 7);
      const hop = calm || !moving ? 0 : -Math.abs(Math.sin(T * 5)) * 4;
      mBody.setAttribute("transform", `translate(75 ${(240 + hop).toFixed(1)}) scale(${(1 + w).toFixed(3)} ${(1 - w).toFixed(3)}) translate(-75 -240)`);
      mShadow.setAttribute("rx", (66 + hop * 1.5).toFixed(1));
      monster.classList.toggle("roar", roarT > 0 || S.state === "over");
      dizzy.style.display = S.stunned > 0 && S.state === "play" ? "" : "none";
      if (S.stunned > 0) {
        stars.forEach((s, i) => {
          const a = T * (calm ? 0 : 5) + i * 2.09;
          s.setAttribute("transform", `translate(${(95 + Math.cos(a) * 26).toFixed(1)} ${(90 + Math.sin(a) * 7).toFixed(1)})`);
        });
      }

      // developer: chair wobble, typing hands, face
      let tilt = 0;
      if (S.state === "over") tilt = 10 * easeOut(S.fall);
      else if (!calm) tilt = Math.sin(T * (2 + S.rate * 0.4)) * (0.5 + S.rate * 0.07);
      seat.setAttribute("transform", `rotate(${tilt.toFixed(2)} 330 240)`);
      const typing = S.state === "demo" || (S.state === "play" && !S.paused && S.rate > 0.4);
      handPh += dt * (6 + S.rate * 2.2);
      const amp = calm || !typing ? 0 : 2.6;
      setHand(farFore, farHand, 426, 150 + Math.sin(handPh) * amp);
      setHand(nearFore, nearHand, 414, 152 + Math.sin(handPh + Math.PI) * amp);
      const m = S.state === "over" ? "shock" : d > 0.7 ? "worried" : "calm";
      if (m !== mood) { mood = m; mouth.setAttribute("d", MOUTHS[m]); }
      if (!calm && d > 0.6 && S.state !== "over" && Math.random() < dt * d * 4) sweat();

      // danger vignette pulses faster as the monster gets closer
      const danger = clamp((d - 0.5) / 0.5) * (calm ? 0.8 : 0.6 + 0.4 * Math.sin(T * (6 + d * 8)));
      flash = Math.max(0, flash - dt * 1.5);
      vignette.style.opacity = Math.max(danger, flash).toFixed(3);

      // wall clock: time flies when the deadline is near
      clockMin += dt * (calm ? 6 : 40 + d * 700);
      minHand.setAttribute("transform", `rotate(${(clockMin % 360).toFixed(1)})`);
      hourHand.setAttribute("transform", `rotate(${((clockMin / 12) % 360).toFixed(1)})`);
      glow.style.opacity = calm ? "0.8" : (0.75 + 0.25 * Math.sin(T * 9) * Math.sin(T * 3.1)).toFixed(2);
      winTimer -= dt;
      if (!calm && winTimer <= 0) { winTimer = 0.5; pick(winEls).classList.toggle("off"); }

      // screen shake
      if (shakeAmp > 0.2 && !calm) {
        shakeEl.style.transform = `translate(${((Math.random() - 0.5) * 2 * shakeAmp).toFixed(1)}px, ${((Math.random() - 0.5) * 2 * shakeAmp).toFixed(1)}px)`;
        shakeAmp *= Math.exp(-dt * 7);
      } else if (shakeAmp !== 0) {
        shakeAmp = 0;
        shakeEl.style.transform = "";
      }
    }

    let prev = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      T += dt;
      update(dt);
      render(dt);
      stepFx(dt);
      requestAnimationFrame(frame);
    }

    readColours();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColours);
    updateHud();
    renderCode();
    resizeFx();
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
