<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zor Fit · Gym members and fees · Chill & Craft</title>
<script>
  /* Theme first, so there is no flash: ?theme=light|dark wins, then the system setting */
  (function () { var q = new URLSearchParams(location.search).get("theme"); document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; })();
</script>
<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }
  .note[hidden] { display: none; }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Zor Fit look: black iron, neon lime, cut corners, condensed numbers ======================= */
  :root {
    --cond: Bahnschrift, "Avenir Next Condensed", "Roboto Condensed", "Ubuntu Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --bg: #eceee7; --surface: #ffffff; --surface2: #e4e7de; --field: #f6f7f2; --ink: #0d0f0b; --mut: #5b6256; --line: #d3d7cb;
    --acc: #111310; --acc-ink: #c6ff3d; --neon: #9ed600; --hot: #e5245f; --rail: #0b0c0a;
    --ok: #3d8b00; --warn: #b86e00; --bad: #d42450;
    --c1: #6fa300; --c2: #111310; --c3: #e5245f; --c4: #2c8fd6; --c5: #f0a000; --c6: #9aa293;
    --rb: 4px; --ri: 4px; --rm: 6px; --grid: #e2e5dc; --tip: #0b0c0a; --toast: #0b0c0a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #090a09; --surface: #131512; --surface2: #1c1f1b; --field: #0f110e; --ink: #f1f5e8; --mut: #8b9286; --line: #262a24;
    --acc: #c6ff3d; --acc-ink: #0a0b09; --neon: #c6ff3d; --hot: #ff3d7f; --rail: #000;
    --ok: #a6f03a; --warn: #ffb02e; --bad: #ff4f86;
    --c1: #c6ff3d; --c2: #f1f5e8; --c3: #ff3d7f; --c4: #4fb4ff; --c5: #ffb02e; --c6: #5b6257;
    --grid: #1f231d; --tip: #1c1f1b; --toast: #1c1f1b;
    color-scheme: dark;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  h1, h2, h3, .cond { font-family: var(--cond); font-stretch: 80%; text-transform: uppercase; letter-spacing: .01em; }
  h3 { margin: 0 0 12px; font-size: 17px; font-weight: 800; }
  .app { display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 100vh; }

  /* Icon rail with a neon marker */
  .rail { position: sticky; top: 0; height: 100vh; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 10px; z-index: 60; overflow-y: auto; }
  .logo { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 8px; }
  .nav { position: relative; display: grid; gap: 4px; width: 100%; }
  .nav a { position: relative; z-index: 1; display: grid; justify-items: center; gap: 4px; padding: 10px 4px; color: #868d80; text-decoration: none; font: 700 10px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .06em; transition: color .2s; text-align: center; }
  .nav a .ic { width: 22px; height: 22px; }
  .nav a:hover { color: #e9eedd; }
  .nav a[aria-current="page"] { color: #c6ff3d; }
  .nav .marker { position: absolute; left: 10px; right: 10px; top: 0; height: 56px; background: rgba(198, 255, 61, .1); border-radius: 4px; box-shadow: inset 3px 0 0 #c6ff3d; transition: transform .45s cubic-bezier(.3, 1.4, .4, 1), height .3s; opacity: 0; }
  .rail .ibtn { background: #1a1c18; border-color: #262a24; color: #e9eedd; }
  .rail-foot { margin-top: auto; display: grid; gap: 8px; }
  .scrim { display: none; }
  .main { min-width: 0; overflow-x: clip; }
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 26px 6px; }
  .top .title { flex: 1; min-width: 0; }
  .top h2 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top small { color: var(--mut); font-size: 12px; }
  .livepill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 4px; background: var(--acc); color: var(--acc-ink); font: 800 13px/1 var(--cond); text-transform: uppercase; letter-spacing: .05em; border: 0; }
  .livepill i { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 0 var(--hot); animation: ping 1.6s ease-out 6; }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .srch { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--mut); min-width: 200px; }
  .srch kbd { margin-left: auto; font: 700 10.5px/1 system-ui; padding: 3px 6px; border-radius: 3px; background: var(--surface2); }
  .menu-btn { display: none !important; }
  .view { padding: 14px 26px 44px; display: grid; gap: 14px; max-width: 1420px; }

  /* Cut-corner cards with a neon tab */
  .card { position: relative; background: var(--surface); padding: 18px; min-width: 0; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); transition: transform .25s cubic-bezier(.3, 1.3, .4, 1); }
  .card::before { content: ""; position: absolute; left: 0; top: 0; width: 34px; height: 3px; background: var(--neon); }
  .card::after { content: ""; position: absolute; right: 0; top: 0; width: 18px; height: 18px; background: linear-gradient(225deg, var(--line) 50%, transparent 50%); transition: background .25s; }
  .card:hover { transform: translateY(-3px); }
  .card:hover::after { background: linear-gradient(225deg, var(--neon) 50%, transparent 50%); }
  .in { animation: slam .55s cubic-bezier(.2, .9, .3, 1) backwards; animation-delay: calc(var(--i) * 55ms); }
  @keyframes slam { 0% { opacity: 0; transform: translateY(-16px) scale(1.04); } 65% { opacity: 1; transform: translateY(2px) scale(.995); } }
  .ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .ph h1 { margin: 0; font-size: 34px; font-weight: 900; line-height: 1; }
  .ph p { margin: 6px 0 0; }
  .g { display: grid; gap: 14px; }
  .k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .c21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .c12 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
  .c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ch-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ch-h h3 { margin: 0; }
  .ch-h p { margin: 3px 0 0; font-size: 12.5px; }
  .sm { font-size: 12.5px; }
  .btn { text-transform: uppercase; font: 800 13px/1.2 var(--cond); letter-spacing: .06em; padding: .7em 1.1em; }
  .btn.sm { font-size: 11.5px; }
  .chip, .segc button { text-transform: uppercase; font-family: var(--cond); letter-spacing: .05em; }
  .segc, .segc button, .chip, .pill { border-radius: 3px; }
  .av { border-radius: 4px; }
  .who { display: flex; align-items: center; gap: 9px; }
  .who > span:last-child { display: grid; line-height: 1.25; }
  .who small { color: var(--mut); font-size: 11.5px; }
  .ibtn.sm { width: 30px; height: 30px; } .ibtn.sm .ic { width: 15px; height: 15px; }
  .danger-t { color: var(--bad); }

  /* KPIs: huge condensed numbers */
  .kpi { display: grid; gap: 2px; }
  .kpi .lab { font: 800 12px/1 var(--cond); text-transform: uppercase; letter-spacing: .12em; color: var(--mut); display: flex; gap: 8px; align-items: center; }
  .kpi .lab .ic { color: var(--neon); }
  .kpi .val { font: 900 44px/1 var(--cond); font-stretch: 80%; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .kpi .sub { font-size: 12px; color: var(--mut); }
  .kpi.hot { background: var(--acc); color: var(--acc-ink); }
  .kpi.hot .lab, .kpi.hot .sub { color: inherit; opacity: .8; }
  .kpi.hot .lab .ic { color: inherit; }
  .kpi.hot::before { background: var(--hot); }
  .exp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .exp li { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--field); }
  .exp li > span:nth-child(2) { flex: 1; min-width: 0; display: grid; }
  .exp small { color: var(--mut); }

  /* Signature: the live floor with everyone inside */
  .arena-h { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .bignum { font: 900 64px/0.9 var(--cond); font-stretch: 80%; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bignum small { font-size: 18px; color: var(--mut); }
  .ecg { flex: 1; min-width: 140px; height: 54px; }
  .ecg path { fill: none; stroke: var(--neon); stroke-width: 2.5; stroke-linejoin: round; filter: drop-shadow(0 0 4px var(--neon)); stroke-dasharray: 260 600; animation: beat 2.2s linear infinite; }
  @keyframes beat { from { stroke-dashoffset: 860; } to { stroke-dashoffset: 0; } }
  .floor { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: repeating-linear-gradient(90deg, var(--surface2) 0 2px, transparent 2px 48px), repeating-linear-gradient(0deg, var(--surface2) 0 2px, transparent 2px 48px); padding: 8px; border: 2px solid var(--line); }
  .zone { min-height: 128px; padding: 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px dashed var(--line); display: grid; align-content: start; gap: 8px; transition: border-color .3s; }
  .zone.over { border-color: var(--neon); }
  .zone header { display: flex; justify-content: space-between; font: 800 12px/1 var(--cond); text-transform: uppercase; letter-spacing: .1em; color: var(--mut); }
  .zone header b { color: var(--ink); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .pdot { width: 36px; height: 36px; border: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--cond); color: #fff; background: hsl(var(--h) 45% 40%); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px color-mix(in srgb, var(--neon) 60%, transparent); transition: transform .2s; touch-action: none; }
  .pdot:hover { transform: scale(1.12); }
  .pdot.lady { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--hot); }
  .pdot.arrive { animation: arrive .7s cubic-bezier(.2, 1.4, .4, 1) backwards; }
  .pdot.leave { animation: leave .45s ease-in forwards; }
  @keyframes arrive { from { transform: scale(0) translateY(-30px); opacity: 0; } }
  @keyframes leave { to { transform: scale(0) translateY(20px); opacity: 0; } }
  .capbar { height: 10px; background: var(--surface2); margin-top: 10px; position: relative; overflow: hidden; }
  .capbar i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: repeating-linear-gradient(-45deg, var(--neon) 0 8px, color-mix(in srgb, var(--neon) 70%, #000) 8px 12px); transition: width .8s cubic-bezier(.3, 1.2, .4, 1); }
  .capbar.full i { background: var(--hot); }

  /* Check-in desk */
  .desk input.big { width: 100%; font: 800 26px/1.2 var(--cond); text-transform: uppercase; padding: 14px 16px; border: 2px solid var(--line); background: var(--field); border-radius: 0; letter-spacing: .04em; }

  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 260px; overflow: auto; font-size: 13px; }
  .log li { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .log li > span:nth-child(2) { flex: 1; }
  .log .t { font: 800 12px/1 var(--cond); color: var(--mut); width: 44px; }

  /* Trainers board */
  .tboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .tcol { background: var(--surface2); padding: 12px; display: grid; align-content: start; gap: 8px; min-height: 260px; transition: box-shadow .2s, background .2s; min-width: 0; }
  .tcol.over { box-shadow: inset 0 0 0 2px var(--neon); background: color-mix(in srgb, var(--neon) 10%, var(--surface2)); }
  .tcol header b { font: 800 16px/1 var(--cond); text-transform: uppercase; display: block; }
  .tcol header small { color: var(--mut); }
  .client { display: flex; align-items: center; gap: 8px; padding: 8px; background: var(--surface); cursor: grab; touch-action: none; user-select: none; transition: transform .2s; font-size: 13px; }
  .client:hover { transform: translateX(3px); }
  .client > span:nth-child(2) { flex: 1; min-width: 0; display: grid; }
  .client small { color: var(--mut); font-size: 11px; }
  .dragging { opacity: .3; }
  .ghost { box-shadow: 0 16px 30px rgba(0, 0, 0, .35); }
  .drop-hint { border: 2px dashed var(--line); padding: 14px; text-align: center; color: var(--mut); font-size: 12px; }

  /* Drawer bits */
  .cd-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .cd-top > div { flex: 1; min-width: 0; }
  .facts { display: grid; grid-template-columns: 110px 1fr; gap: 7px 12px; margin: 10px 0 14px; font-size: 13.5px; }
  .facts dt { color: var(--mut); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .att { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .att i { background: var(--surface2); }
  .att i.y { background: var(--neon); }
  .quote { display: grid; gap: 5px; padding: 12px; background: var(--surface2); font-size: 13px; }
  .quote div { display: flex; justify-content: space-between; gap: 10px; }
  .quote .tot { font-weight: 900; font-size: 16px; border-top: 2px solid var(--line); padding-top: 6px; }
  .set-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .chk { display: flex !important; align-items: center; gap: 8px; color: var(--ink) !important; font-size: 13px !important; padding-top: 22px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--neon); }

  @media (max-width: 1150px) { .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 96px; transform: translateX(-105%); transition: transform .35s cubic-bezier(.2, .9, .3, 1); }
    body.nav-open .rail { transform: none; box-shadow: 20px 0 50px rgba(0, 0, 0, .4); }
    .scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.nav-open .scrim { opacity: 1; pointer-events: auto; }
    .menu-btn { display: inline-grid !important; }
    .c21, .c12, .c3 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .top { padding: 12px 14px 4px; gap: 8px; } .view { padding: 12px 14px 34px; }
    .top h2 { font-size: 22px; } .top small { display: none; }
    .srch { min-width: 0; padding: 9px; } .srch span, .srch kbd { display: none; }
    .livepill span { display: none; }
    .kpi .val { font-size: 32px; }
    .bignum { font-size: 48px; }
    .floor { grid-template-columns: 1fr; }
    .facts { grid-template-columns: 96px 1fr; }
  }
</style>
</head>

<script>
/* ======================= Shared kit (same in every Chill & Craft dashboard) ======================= */
"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */
let _seed = 1;
const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */
const PK = {
  m: ["Ahmed", "Bilal", "Usman", "Hamza", "Ali", "Imran", "Faisal", "Zubair", "Saad", "Kamran", "Asif", "Tariq", "Shahid", "Naveed", "Waqas", "Adeel", "Fahad", "Junaid", "Rizwan", "Salman", "Danish", "Arslan", "Haris", "Owais", "Shoaib", "Yasir", "Moiz", "Talha"],
  f: ["Ayesha", "Fatima", "Sana", "Hira", "Maryam", "Zainab", "Amna", "Mahnoor", "Rabia", "Iqra", "Sadia", "Noor", "Kiran", "Saba", "Anum", "Mehwish", "Hina", "Uzma", "Bushra", "Nida", "Laiba", "Areeba"],
  last: ["Khan", "Malik", "Butt", "Qureshi", "Sheikh", "Chaudhry", "Abbasi", "Siddiqui", "Mirza", "Raza", "Awan", "Javed", "Rana", "Baig", "Hashmi", "Gondal", "Shah", "Memon", "Baloch", "Niazi", "Ansari", "Jutt", "Kazmi", "Bhatti"],
  cities: ["Karachi", "Lahore", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Gujranwala", "Hyderabad", "Sukkur", "Bahawalpur", "Abbottabad"],
};
const pname = (g) => pick(g === "f" ? PK.f : g === "m" ? PK.m : rnd() < 0.5 ? PK.f : PK.m) + " " + pick(PK.last);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + ri(1000000, 9999999);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

/* ---------- Number formats: Rs 12,500 · 1.2M · $1,240 ---------- */
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = (n) => (n < 0 ? "-" : "") + "Rs " + num(Math.abs(n));
const short = (n) => { const a = Math.abs(+n || 0), s = n < 0 ? "-" : "", f = (v, u) => s + (v >= 100 ? Math.round(v) : +v.toFixed(1)) + u; return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + (a % 1 ? +a.toFixed(1) : a); };
const rss = (n) => (n < 0 ? "-" : "") + "Rs " + short(Math.abs(n));
const usd = (n, d = 0) => (n < 0 ? "-$" : "$") + num(Math.abs(n), d);
const pct = (n, d = 0) => num(n, d) + "%";
const FMT = { num: (v) => num(v), rs, rss, short, usd, usd2: (v) => usd(v, 2), pct: (v) => pct(v, 1), pct0: (v) => pct(v) };

/* ---------- Dates (local, no time zone surprises) ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = pd(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
/* Add months but keep the day (31 Jan + 1 month = 28 or 29 Feb) */
const addMK = (d, n) => { const x = addM(d, n), day = pd(d).getDate(), last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

function checkIn(id) {
  const m = memOf(id); if (!m) return;

  if (s === "Expired" || s === "Frozen") return toast(`${m.name}: ${s === "Expired" ? "fee due, collect first" : "membership frozen"}`, { type: "bad" });
  if (isIn(id)) return toast(`${m.name} is already inside`, { type: "warn" });
  if (S.inside.length >= S.set.cap) return toast("The gym is at full capacity", { type: "bad" });
  S.inside.push({ mid: id, zone: m.zone }); S.log.unshift({ mid: id, in: nowHM(), out: "" });
  floorChange(`Welcome, ${m.name.split(" ")[0]}! ${S.inside.length} inside now${s === "Expiring" ? ". Plan ends in " + left(m) + " days" : ""}`, { type: s === "Expiring" ? "warn" : "ok" });
}
function checkOut(id) {
  const m = memOf(id); if (!m || !isIn(id)) return;
  S.inside = S.inside.filter((x) => x.mid !== id); const l = S.log.find((e) => e.mid === id && !e.out); if (l) l.out = nowHM();

}
function moveZone(id, z) { const x = S.inside.find((y) => y.mid === id); if (!x || x.zone === z) return; x.zone = z; floorChange(`${memOf(id).name.split(" ")[0]} moved to ${z}`); }
/* On the desk page, update the floor in place so people walk in and out instead of the page redrawing */
function floorChange(msg, o) {

}

  const isNew = !m;
  modal({
    title: isNew ? "New member" : "Edit " + m.name, submit: isNew ? "Add and collect fee" : "Save", cls: "wide",
    body: `<div class="fgrid">${fld("Full name", "name", { value: m ? m.name : "" })}${fld("Mobile", "phone", { type: "tel", value: m ? m.phone : "", ph: "0300-1234567" })}${fld("Timing", "gender", { opts: [["Gents", "Gents"], ["Ladies", "Ladies batch"]], value: m ? m.gender : "Gents" })}${fld("Goal", "goal", { opts: GOALS, value: m ? m.goal : GOALS[2] })}${isNew ? fld("Plan", "plan", { opts: Object.keys(S.set.plans).map((p) => [p, `${p} · ${rs(S.set.plans[p].p)}`]) }) + fld("Start date", "start", { type: "date", value: TODAY }) + fld("Payment method", "method", { opts: METHODS }) : ""}${fld("Trainer", "trainer", { opts: [["", "No trainer"], ...S.trainers.map((t) => [t.id, t.name + " · " + t.spec])], value: m ? m.trainer : "" })}${fld("Usual zone", "zone", { opts: ZONES, value: m ? m.zone : "Free weights" })}${isNew ? '<div class="quote span" aria-live="polite"></div>' : ""}</div>`,
    onOpen: (box) => { if (!isNew) return; const E = $("form", box).elements, q = $(".quote", box); const u = () => { const P = S.set.plans[E.plan.value], pt = E.trainer.value ? S.set.pt : 0, end = addMK(E.start.value || TODAY, P.m); q.innerHTML = `<div><span>${E.plan.value} plan</span><b>${rs(P.p)}</b></div><div><span>Admission (one time)</span><b>${rs(S.set.admission)}</b></div>${pt ? `<div><span>Personal training, first month</span><b>${rs(pt)}</b></div>` : ""}<div class="tot"><span>Collect now</span><b>${rs(P.p + S.set.admission + pt)}</b></div><small class="mut">Valid till ${fdy(end)}</small>`; }; $("form", box).addEventListener("change", u); $("form", box).addEventListener("input", u); u(); },
    onSubmit: (d) => {
      const er = check(d, { name: [REQ("Enter the name"), [(x) => x.length >= 3, "Use at least 3 letters"]], phone: [PHONE] });
      if (S.mem.some((x) => x !== m && x.phone.replace("-", "") === d.phone.replace("-", ""))) er.phone = "A member already uses this number";
      if (d.trainer === "T2" && d.gender !== "Ladies") er.trainer = "This coach trains the ladies batch only";
      if (isNew && !d.start) er.start = "Pick a start date";
      if (Object.keys(er).length) return er;
      const f = { name: d.name.trim(), phone: d.phone.trim(), gender: d.gender, goal: d.goal, trainer: d.trainer, zone: d.zone };
      if (!isNew) { Object.assign(m, f); afterChange("Member saved"); return; }
      const id = "ZF-" + (Math.max(1000, ...S.mem.map((x) => +x.id.slice(3))) + 1), P = S.set.plans[d.plan];
      S.mem.unshift({ id, ...f, plan: d.plan, joined: d.start, expiry: iso(addMK(d.start, P.m)), frozen: "", freq: 50 });
      const pay = (kind, amt, plan = "") => S.pays.push({ id: "PY-" + (Math.max(7000, ...S.pays.map((x) => +x.id.slice(3))) + 1), mid: id, date: TODAY, kind, plan, amt, method: d.method });
      pay("Membership", P.p, d.plan); pay("Admission", S.set.admission); if (d.trainer) pay("Personal training", S.set.pt);
      afterChange(`${f.name} joined as ${id}. Card ready at the desk.`);
    },
  });
}
function renewForm(id) {
  const m = memOf(id) || S.mem.find((x) => status(x) === "Expired") || S.mem[0];
  modal({
    title: "Collect a fee", submit: "Collect and renew",
    body: `<div class="fgrid">${fld("Member", "mid", { span: true, opts: S.mem.map((x) => [x.id, `${x.name} · ${x.id} · ${status(x)}`]), value: m.id })}${fld("Plan", "plan", { opts: Object.keys(S.set.plans).map((p) => [p, `${p} · ${rs(S.set.plans[p].p)}`]), value: m.plan })}${fld("Discount (Rs)", "disc", { type: "number", value: 0, min: 0 })}${fld("Method", "method", { opts: METHODS })}<div class="fld"><label class="chk"><input type="checkbox" name="pt"> Add personal training (${rs(S.set.pt)})</label></div><div class="quote span" aria-live="polite"></div></div>`,
    onOpen: (box) => { const E = $("form", box).elements, q = $(".quote", box); const u = () => { const x = memOf(E.mid.value), P = S.set.plans[E.plan.value], from = x.expiry >= TODAY ? x.expiry : TODAY, tot = P.p - (+E.disc.value || 0) + (E.pt.checked ? S.set.pt : 0); q.innerHTML = `<div><span>${E.plan.value}</span><b>${rs(P.p)}</b></div>${+E.disc.value ? `<div><span>Discount</span><b>− ${rs(+E.disc.value)}</b></div>` : ""}${E.pt.checked ? `<div><span>Personal training</span><b>${rs(S.set.pt)}</b></div>` : ""}<div class="tot"><span>Collect</span><b>${rs(tot)}</b></div><small class="mut">New expiry: ${fdy(addMK(from, P.m))}${x.expiry >= TODAY ? " (added after the current plan)" : " (starts today)"}</small>`; }; $("form", box).addEventListener("change", u); $("form", box).addEventListener("input", u); u(); },
    onSubmit: (d) => {
      const P = S.set.plans[d.plan], er = check(d, { disc: [[(x) => x === "" || (+x >= 0 && +x < P.p), "The discount must be less than the plan price"]] });
      if (Object.keys(er).length) return er;
      const x = memOf(d.mid), from = x.expiry >= TODAY ? x.expiry : TODAY, prev = { expiry: x.expiry, plan: x.plan, frozen: x.frozen };
      x.expiry = iso(addMK(from, P.m)); x.plan = d.plan; x.frozen = "";
      const nid = () => "PY-" + (Math.max(7000, ...S.pays.map((y) => +y.id.slice(3))) + 1), added = [];
      const p1 = { id: nid(), mid: x.id, date: TODAY, kind: "Membership", plan: d.plan, amt: P.p - (+d.disc || 0), method: d.method }; S.pays.push(p1); added.push(p1);
      if (d.pt) { const p2 = { id: nid(), mid: x.id, date: TODAY, kind: "Personal training", plan: "", amt: S.set.pt, method: d.method }; S.pays.push(p2); added.push(p2); }
      afterChange(`${x.name} renewed till ${fdy(x.expiry)}`, { undo: () => { Object.assign(x, prev); S.pays = S.pays.filter((p) => !added.includes(p)); afterChange("Renewal undone"); } });
    },
  });
}
function trForm(t) {
  const isNew = !t;
  modal({
    title: isNew ? "Add a trainer" : "Edit " + t.name, submit: isNew ? "Add trainer" : "Save",
    body: `<div class="fgrid">${fld("Name", "name", { value: t ? t.name : "", ph: "Coach …" })}${fld("Speciality", "spec", { value: t ? t.spec : "" })}${fld("Slot", "slot", { value: t ? t.slot : "", ph: "6 to 10 pm" })}${fld("Share of training fee (%)", "share", { type: "number", value: t ? t.share : 60, min: 0, max: 100 })}</div>`,
    left: isNew ? "" : `<button type="button" class="btn ghost danger-t grow" data-trdel>${ico("trash")} Remove</button>`,
    onOpen: (box, api) => { const b = $("[data-trdel]", box); if (b) b.onclick = async () => { if (!(await ask(`Remove ${t.name}? Their clients will have no trainer.`, { ok: "Remove" }))) return; S.mem.forEach((m) => { if (m.trainer === t.id) m.trainer = ""; }); S.trainers = S.trainers.filter((x) => x !== t); api.close(); afterChange(`${t.name} removed`); }; },
    onSubmit: (d) => {
      const er = check(d, { name: [REQ("Enter a name")], spec: [REQ("Enter a speciality")], slot: [REQ("Enter the slot")], share: [[(x) => x !== "" && +x >= 0 && +x <= 100, "Use 0 to 100"]] }); if (Object.keys(er).length) return er;
      const f = { name: d.name.trim(), spec: d.spec.trim(), slot: d.slot.trim(), share: +d.share };
      if (isNew) S.trainers.push({ id: "T" + (Math.max(0, ...S.trainers.map((x) => +x.id.slice(1))) + 1), ...f }); else Object.assign(t, f);
      afterChange(isNew ? `${f.name} added` : "Trainer saved");
    },
  });
}
function openMem(id) {
  if (!memOf(id)) return;
  const m0 = modal({ drawer: true, title: "Member " + id, body: "" }), body = $(".m-b", m0.el);
  const paint = () => {
    const m = memOf(id); if (!m) { body.innerHTML = '<div class="empty-st">This member was removed.</div>'; return; }
    const s = status(m), weeks = Array.from({ length: 56 }, (_, i) => iso(addD(today(), i - 55))), seen = weeks.filter((d) => visited(m, d)).length, P = S.pays.filter((p) => p.mid === m.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    body.innerHTML = `<div class="cd-top">${av(m.name, "")}<div><b class="cond" style="font-size:22px">${esc(m.name)}</b><div class="mut sm">${m.id} · ${esc(m.phone)}</div></div>${stPill(s)}</div>
    <dl class="facts"><dt>Plan</dt><dd>${m.plan} · ${rs(S.set.plans[m.plan].p)}</dd><dt>Valid till</dt><dd>${fdy(m.expiry)} (${left(m) >= 0 ? left(m) + " days left" : -left(m) + " days ago"})</dd><dt>Timing</dt><dd>${m.gender}</dd><dt>Goal</dt><dd>${esc(m.goal)}</dd><dt>Trainer</dt><dd>${m.trainer && trOf(m.trainer) ? esc(trOf(m.trainer).name) : "None"}</dd><dt>Joined</dt><dd>${fdy(m.joined)}</dd>${m.frozen ? `<dt>Frozen till</dt><dd>${fdy(m.frozen)}</dd>` : ""}</dl>
    <h3>Visits, last 8 weeks <span class="mut sm" style="text-transform:none;font-family:system-ui">${seen} days</span></h3><div class="att" aria-label="${seen} visits in 8 weeks">${Array.from({ length: 8 }, (_, w) => weeks.slice(w * 7, w * 7 + 7)).flat().map((d) => `<i class="${visited(m, d) ? "y" : ""}" title="${fd(d)}"></i>`).join("")}</div>
    <h3 style="margin-top:14px">Payments</h3><ul class="exp">${P.slice(0, 6).map((p) => `<li>${ico("wallet")}<span><b>${esc(p.kind)}</b><small>${fdy(p.date)} · ${esc(p.method)}</small></span><b>${rs(p.amt)}</b></li>`).join("") || '<li class="empty-st">No payments in the last year.</li>'}</ul>
    <div class="m-f"><button type="button" class="btn ghost danger-t" data-mm="del">${ico("trash")} Delete</button><button type="button" class="btn ghost" data-mm="freeze">${m.frozen ? "Unfreeze" : "Freeze 2 weeks"}</button><button type="button" class="btn ghost" data-mm="edit">${ico("edit")} Edit</button>${isIn(m.id) ? `<button type="button" class="btn ghost" data-mm="out">Check out</button>` : s === "Active" || s === "Expiring" ? `<button type="button" class="btn ghost" data-mm="in">Check in</button>` : ""}<button type="button" class="btn pri" data-mm="renew">${ico("wallet")} Renew</button></div>`;
  };
  m0.refresh = paint; paint();
  body.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-mm]"), m = memOf(id); if (!b || !m) return;
    const a = b.dataset.mm;
    if (a === "renew") renewForm(m.id);
    else if (a === "edit") memForm(m);
    else if (a === "in") checkIn(m.id);
    else if (a === "out") checkOut(m.id);
    else if (a === "freeze") { if (m.frozen) { m.frozen = ""; afterChange("Membership unfrozen"); } else { m.frozen = iso(addD(today(), 14)); m.expiry = iso(addD(m.expiry, 14)); if (isIn(m.id)) checkOut(m.id); afterChange(`Frozen for 2 weeks. Expiry moved to ${fd(m.expiry)}`); } }
    else if (a === "del") { if (!(await ask(`Delete ${m.name}? Their payments stay in the records.`))) return; const i = S.mem.indexOf(m); S.mem.splice(i, 1); S.inside = S.inside.filter((x) => x.mid !== m.id); m0.close(); afterChange(`${m.name} deleted`, { undo: () => { S.mem.splice(i, 0, m); afterChange("Member restored"); } }); }
  });
}

/* ======================= Global wiring ======================= */
const DO = {
  add: () => memForm(), collect: () => renewForm(), "add-tr": () => trForm(), theme: () => Theme.toggle(),
  csv: () => {
    if (!window.Blob || !URL.createObjectURL) return toast("Downloads are not available here", { type: "warn" });
    const rows = [["Receipt", "Date", "Member", "Kind", "Plan", "Method", "Amount"], ...S.pays.map((p) => [p.id, p.date, (memOf(p.mid) || {}).name || "", p.kind, p.plan, p.method, p.amt])];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" })); a.download = "zor-fit-payments.csv"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); toast("Payments CSV downloaded");
  },
  reset: async () => { if (!(await ask("Reset members, payments and the floor to the sample gym?", { title: "Reset demo data", ok: "Reset" }))) return; S = Store.reset(); Bell.read.clear(); Object.assign(CI, { q: "", sel: "", hi: 0 }); afterChange("Demo data reset"); },
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (d && DO[d.dataset.do]) return DO[d.dataset.do](d);
  const r = e.target.closest("[data-renew]"); if (r) return renewForm(r.dataset.renew);
  const m = e.target.closest("[data-mem]"); if (m) openMem(m.dataset.mem);
});
APP.notes = () => {
  const L = [];
  S.mem.filter((m) => status(m) === "Expired").slice(0, 5).forEach((m) => L.push({ id: "exp" + m.id + m.expiry, t: `${m.name}: fee overdue`, d: `Ended ${fd(m.expiry)} · ${m.plan}`, go: "#/fees" }));
  S.mem.filter((m) => status(m) === "Expiring").slice(0, 4).forEach((m) => L.push({ id: "soon" + m.id + m.expiry, t: `${m.name} renews soon`, d: `Ends ${fd(m.expiry)}`, go: "#/fees" }));
  if (S.inside.length > S.set.cap * 0.8) L.unshift({ id: "busy" + S.inside.length, t: "The floor is getting full", d: `${S.inside.length} of ${S.set.cap} inside`, go: "#/checkin" });
  return L;
};
APP.cmds = () => [{ label: "New member", run: DO.add }, { label: "Collect a fee", run: DO.collect }, { label: "Add a trainer", run: DO["add-tr"] }, { label: "Open the front desk", run: () => Router.go("checkin") }, { label: "Switch light or dark theme", run: DO.theme }, ...S.mem.map((m) => ({ label: `${m.name} · ${m.id} · ${m.phone}`, hint: status(m), run: () => openMem(m.id) }))];
APP.onRoute = () => { if (Router.cur !== "checkin" && Router.cur !== "overview") APP.onSim = null; };
paintTop();
boot();
</script>
</body>
