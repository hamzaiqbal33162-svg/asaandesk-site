<!doctype html>
<!-- Chill & Craft · Trace Map · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Map · folder upload</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours: a white solder-mask board by day, a green one by night ---------- */
  :root {
    color-scheme: light;
    --bg1: #edf2ea;
    --bg2: #c9d6c3;
    --board: #f7f9f2;
    --edge: #dbe4d3;
    --ink: #13261b;
    --soft: #5d7264;
    --silk: #9aac9f;
    --trace: #c9894a;
    --trace-dim: #e6c9a6;
    --lit: #0fb98a;
    --glow: rgba(15, 185, 138, .55);
    --chip: #253a2e;
    --btn: #13261b;
    --btn-ink: #f7f9f2;
    --focus: #2563eb;
    --shadow: 0 34px 70px -40px rgba(25, 60, 30, .6);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #0c2219; --bg2: #020805; --board: #0b2a1e; --edge: #164331; --ink: #e2f6ea; --soft: #8fb8a2; --silk: #4e7c66;
      --trace: #e0a35c; --trace-dim: #6b5333; --lit: #4ff0c8; --glow: rgba(79, 240, 200, .6); --chip: #071a12;
      --btn: #e2f6ea; --btn-ink: #0b2a1e; --focus: #93c5fd; --shadow: 0 34px 70px -40px rgba(0, 0, 0, .95);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #0c2219; --bg2: #020805; --board: #0b2a1e; --edge: #164331; --ink: #e2f6ea; --soft: #8fb8a2; --silk: #4e7c66;
    --trace: #e0a35c; --trace-dim: #6b5333; --lit: #4ff0c8; --glow: rgba(79, 240, 200, .6); --chip: #071a12;
    --btn: #e2f6ea; --btn-ink: #0b2a1e; --focus: #93c5fd; --shadow: 0 34px 70px -40px rgba(0, 0, 0, .95);
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr);
    color: var(--ink);
    background: radial-gradient(110% 85% at 50% 0%, var(--bg1), var(--bg2) 95%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { width: 100%; padding: 22px 16px; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
  .board {
    position: relative; width: 640px; max-width: 100%; padding: 18px 18px 16px; border-radius: 24px;
    background:
      radial-gradient(circle at 14px 14px, var(--trace-dim) 3px, transparent 3.5px) 0 0 / 100% 100% no-repeat,
      radial-gradient(circle at calc(100% - 14px) 14px, var(--trace-dim) 3px, transparent 3.5px) 0 0 / 100% 100% no-repeat,
      radial-gradient(circle at 14px calc(100% - 14px), var(--trace-dim) 3px, transparent 3.5px) 0 0 / 100% 100% no-repeat,
      radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), var(--trace-dim) 3px, transparent 3.5px) 0 0 / 100% 100% no-repeat,
      var(--board);
    border: 1px solid var(--edge);
    box-shadow: var(--shadow), inset 0 0 0 6px color-mix(in srgb, var(--edge) 40%, transparent);
  }
  .board.drop-on { box-shadow: var(--shadow), inset 0 0 0 3px var(--lit), 0 0 0 6px var(--glow); }
  .top { display: flex; align-items: center; gap: 12px; margin: 2px 4px 12px; }
  .ic { position: relative; flex: none; width: 46px; height: 38px; border-radius: 6px; background: var(--chip); box-shadow: 0 6px 12px -6px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .12); }
  .ic::before, .ic::after { content: ""; position: absolute; top: 5px; bottom: 5px; width: 4px; background: repeating-linear-gradient(var(--trace) 0 3px, transparent 3px 7px); }
  .ic::before { left: -4px; } .ic::after { right: -4px; }
  .ic i { position: absolute; left: 7px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--lit); box-shadow: 0 0 8px var(--lit); animation: blink 2.4s steps(2) infinite; }
  .top h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .top p { margin: 2px 0 0; font-size: 12.5px; color: var(--soft); }
  .stats { margin-left: auto; text-align: right; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stats b { display: block; font-size: 14px; color: var(--ink); }

  /* ---------- The tree ---------- */
  .tree { position: relative; height: 304px; overflow-x: hidden; overflow-y: auto; padding: 4px 6px 8px 4px; border-radius: 16px; background: color-mix(in srgb, var(--edge) 22%, transparent); border: 1px solid var(--edge); scrollbar-width: thin; }
  .tree ul { list-style: none; margin: 0; padding: 0 0 0 24px; }
  .tree > ul { padding-left: 0; }
  .tree li { position: relative; }
  .tree ul ul > li::before { content: ""; position: absolute; left: -13px; top: -4px; bottom: 0; border-left: 2px solid var(--trace); transition: border-color .3s; }
  .tree ul ul > li:last-child::before { bottom: auto; height: 21px; }
  .tree ul ul > li::after { content: ""; position: absolute; left: -13px; top: 16px; width: 12px; border-top: 2px solid var(--trace); transition: border-color .3s; }
  .tree li.done::before, .tree li.done::after { border-color: var(--lit); }
  .tree.lit li::before, .tree.lit li::after { border-color: var(--lit); filter: drop-shadow(0 0 3px var(--glow)); }
  .tree li.collapsed > ul { display: none; }
  .row { position: relative; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 2px; border-radius: 9px; font-size: 13px; transition: background .3s; }
  .row.active { background: color-mix(in srgb, var(--lit) 12%, transparent); }
  .nm { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .meta { flex: none; font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .tog { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--soft); cursor: pointer; }
  .tog:hover { background: color-mix(in srgb, var(--edge) 60%, transparent); }
  .tog:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tog svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--spring); }
  li.collapsed > .row .tog svg { transform: rotate(-90deg); }
  .chipic { position: relative; flex: none; width: 24px; height: 18px; border-radius: 4px; background: var(--chip); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
  .chipic::before, .chipic::after { content: ""; position: absolute; left: 4px; right: 4px; height: 3px; background: repeating-linear-gradient(90deg, var(--trace) 0 2px, transparent 2px 5px); }
  .chipic::before { top: -3px; } .chipic::after { bottom: -3px; }
  .chipic i { position: absolute; left: 4px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #3a4a40; transition: background .3s, box-shadow .3s; }
  li.done > .row .chipic i { background: var(--lit); box-shadow: 0 0 8px var(--lit); }
  .pad { flex: none; width: 14px; height: 14px; margin: 0 5px; border-radius: 50%; background: var(--trace); box-shadow: inset 0 0 0 3.5px var(--trace), inset 0 0 0 7px var(--board); transition: background .3s, box-shadow .3s; }
  li.done > .row .pad { background: var(--lit); box-shadow: inset 0 0 0 3.5px var(--lit), inset 0 0 0 7px var(--board), 0 0 10px var(--glow); }
  .mini { flex: none; width: 46px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--edge) 80%, transparent); overflow: hidden; }
  .mini i { display: block; height: 100%; width: 0; background: var(--lit); border-radius: 3px; }
  .ring { flex: none; width: 18px; height: 18px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .t { stroke: color-mix(in srgb, var(--edge) 90%, transparent); }
  .ring .a { stroke: var(--lit); stroke-dasharray: 44; stroke-dashoffset: 44; transition: stroke-dashoffset .2s linear; }
  /* the root is the board's connector */
  .root > .row { height: 42px; margin-bottom: 6px; padding: 0 10px; border-radius: 10px; background: var(--chip); color: #e2f6ea; }
  .root > .row .meta { color: #9fc9b2; }
  .root > .row .tog { color: #9fc9b2; }
  .root > .row::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -5px; height: 5px; background: repeating-linear-gradient(90deg, var(--trace) 0 4px, transparent 4px 9px); }
  .leds { display: flex; gap: 4px; flex: none; }
  .leds i { width: 6px; height: 6px; border-radius: 50%; background: #3a4a40; }
  .board.sending .leds i { animation: chase .9s linear infinite; }
  .board.sending .leds i:nth-child(2) { animation-delay: .15s; } .board.sending .leds i:nth-child(3) { animation-delay: .3s; } .board.sending .leds i:nth-child(4) { animation-delay: .45s; }
  .board.finished .leds i { background: var(--lit); box-shadow: 0 0 8px var(--lit); }
  .more { padding: 6px 10px 2px 30px; font-size: 12px; color: var(--soft); }
  .spark { position: absolute; z-index: 3; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--lit); box-shadow: 0 0 10px 2px var(--glow); pointer-events: none; }
  .empty { display: grid; place-items: center; align-content: center; gap: 8px; height: 100%; text-align: center; color: var(--soft); font-size: 13px; }
  .empty svg { width: 120px; height: 70px; }

  /* ---------- Footer ---------- */
  .bus { position: relative; height: 8px; margin: 14px 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--trace) 30%, transparent); overflow: hidden; }
  .bus i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--trace), var(--lit)); box-shadow: 0 0 10px var(--glow); }
  .bus i::after { content: ""; position: absolute; right: 0; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--lit) 45%, transparent 70%); }
  .busline { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .busline b { color: var(--ink); }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; margin-top: 12px; }
  .btn { height: 46px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 13px; border: 1px solid var(--edge); background: var(--board); color: var(--ink); font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; white-space: nowrap; overflow: hidden; transition: transform .35s var(--spring), filter .2s, background .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(.95); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.main { border: 0; background: var(--btn); color: var(--btn-ink); box-shadow: 0 12px 22px -14px rgba(0, 0, 0, .7); }
  .btn.main[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.main[data-state="working"], .btn.main[data-state="done"] { cursor: progress; filter: none; opacity: 1; }
  .btn.main[data-state="done"] { background: var(--lit); color: #04261a; }
  .btn .lbl { overflow: hidden; text-overflow: ellipsis; }
  .note { margin: 8px 2px 0; min-height: 18px; font-size: 12px; color: var(--soft); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes chase { 0%, 100% { background: #3a4a40; box-shadow: none; } 30% { background: var(--lit); box-shadow: 0 0 8px var(--lit); } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .shake { animation: shake .4s ease-in-out; }

  @media (max-width: 560px) {
    .board { padding: 14px 12px 14px; }
    .stats { display: none; }
    .tree { height: 300px; }
    .tree ul ul { padding-left: 20px; }
    .mini { width: 30px; }
    .actions { grid-template-columns: 1fr 1fr; }
    .actions .main { grid-column: 1 / -1; order: -1; }
  }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="board" id="board" aria-labelledby="ttl">
    <header class="top">
      <span class="ic" aria-hidden="true"><i></i></span>
      <div><h1 id="ttl">Upload a folder</h1><p>Every sub-folder keeps its place.</p></div>
      <div class="stats" id="stats"><b id="statFiles">0 files</b><span id="statMore">pick a folder</span></div>
    </header>

    <div class="tree" id="tree" aria-label="Folder contents"></div>

    <div class="bus" aria-hidden="true"><i id="busFill"></i></div>
    <div class="busline"><span id="busLeft">Ready</span><span id="busRight"></span></div>

    <div class="actions">
      <button class="btn" id="chooseBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
        <span class="lbl">Choose folder</span>
      </button>
      <button class="btn" id="sampleBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M9 4v3M15 4v3M9 17v3M15 17v3M4 9h3M4 15h3M17 9h3M17 15h3" /></svg>
        <span class="lbl">Sample</span>
      </button>
      <button class="btn main" id="upBtn" type="button" data-state="idle" aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 19h14" /></svg>
        <span class="lbl" id="upLbl">Upload</span>
      </button>
    </div>
    <p class="note" id="note">Choose or drop a folder; it is read on your device and the upload is simulated.</p>
    <input class="sr-only" type="file" id="file" webkitdirectory directory multiple tabindex="-1" aria-hidden="true">
    <p class="sr-only" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
  // ---------- Trace Map folder upload ----------
  const $ = (s) => document.querySelector(s);
  const board = $("#board"), tree = $("#tree"), busFill = $("#busFill"), busLeft = $("#busLeft"), busRight = $("#busRight");
  const statFiles = $("#statFiles"), statMore = $("#statMore"), upBtn = $("#upBtn"), upLbl = $("#upLbl"), note = $("#note"), fileEl = $("#file"), statusEl = $("#status");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const say = (t) => { statusEl.textContent = t; };
  const mb = (n) => (n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB");
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  const SYSTEM = /^(\.DS_Store|Thumbs\.db|desktop\.ini|\._.*)$/i;
  const MAX_ROWS = 400;                                  // rows drawn; every file still counts and uploads

  const STOP = new Error("stopped");
  let runId = 0, busy = false, root = null, files = [], skipped = 0;
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === runId ? res() : rej(STOP)), ms));

  // ---------- Build a tree from relative paths ----------
  function buildTree(list, fallback) {
    const parts0 = list.map((f) => f.path.split("/").filter(Boolean));
    const shared = parts0.length && parts0.every((p) => p.length > 1 && p[0] === parts0[0][0]) ? parts0[0][0] : null;
    const top = { name: shared || fallback, dir: true, kids: [], size: 0, count: 0, loaded: 0, parent: null };
    list.forEach((f, i) => {
      const parts = shared ? parts0[i].slice(1) : parts0[i];
      let node = top;
      parts.slice(0, -1).forEach((seg) => {
        let next = node.kids.find((k) => k.dir && k.name === seg);
        if (!next) { next = { name: seg, dir: true, kids: [], size: 0, count: 0, loaded: 0, parent: node }; node.kids.push(next); }
        node = next;
      });
      node.kids.push({ name: parts[parts.length - 1], dir: false, size: f.size, loaded: 0, parent: node });
    });
    const tidy = (n) => {
      n.kids.sort((a, b) => (a.dir !== b.dir ? (a.dir ? -1 : 1) : a.name.localeCompare(b.name, undefined, { numeric: true })));
      n.kids.forEach((k) => { if (k.dir) tidy(k); n.size += k.size; n.count += k.dir ? k.count : 1; });
    };
    tidy(top);
    return top;
  }
  const folderCount = (n) => n.kids.reduce((s, k) => s + (k.dir ? 1 + folderCount(k) : 0), 0);

  // ---------- Draw the tree ----------
  const chevron = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>';
  function render() {
    tree.textContent = "";
    files = [];
    let rows = 0;
    const ul = document.createElement("ul");
    const walk = (node, parentUl, depth) => {
      const li = document.createElement("li");
      node.li = li;
      if (node.dir) {
        li.className = "dir" + (depth === 0 ? " root" : "");
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<button class="tog" type="button" aria-expanded="true">' + chevron + '</button>' + (depth === 0 ? '<span class="leds"><i></i><i></i><i></i><i></i></span>' : '<span class="chipic"><i></i></span>') +
          '<span class="nm"></span><span class="meta"></span><svg class="ring" viewBox="0 0 18 18"><circle class="t" cx="9" cy="9" r="7" /><circle class="a" cx="9" cy="9" r="7" /></svg>';
        row.querySelector(".nm").textContent = depth === 0 ? node.name + "/" : node.name;
        row.querySelector(".meta").textContent = plural(node.count, "file") + " · " + mb(node.size);
        const tog = row.querySelector(".tog");
        tog.setAttribute("aria-label", "Collapse " + node.name);
        tog.addEventListener("click", () => {
          const shut = li.classList.toggle("collapsed");
          tog.setAttribute("aria-expanded", String(!shut));
          tog.setAttribute("aria-label", (shut ? "Expand " : "Collapse ") + node.name);
        });
        node.arc = row.querySelector(".a");
        li.appendChild(row);
        const kidsUl = document.createElement("ul");
        li.appendChild(kidsUl);
        rows++;
        node.kids.forEach((k) => walk(k, kidsUl, depth + 1));
        if (depth >= 3) { li.classList.add("collapsed"); tog.setAttribute("aria-expanded", "false"); tog.setAttribute("aria-label", "Expand " + node.name); }
      } else {
        files.push(node);
        if (rows >= MAX_ROWS) { node.li = null; return; }
        li.className = "file";
        li.innerHTML = '<div class="row"><span class="pad"></span><span class="nm"></span><span class="meta"></span><span class="mini"><i></i></span></div>';
        li.querySelector(".nm").textContent = node.name;
        li.querySelector(".meta").textContent = mb(node.size);
        node.bar = li.querySelector(".mini i");
        rows++;
      }
      parentUl.appendChild(li);
    };
    walk(root, ul, 0);
    tree.appendChild(ul);
    if (files.length > files.filter((f) => f.li).length) {
      const more = document.createElement("p");
      more.className = "more";
      more.textContent = "+ " + plural(files.length - files.filter((f) => f.li).length, "more file") + " (not drawn, still uploaded)";
      tree.appendChild(more);
    }
    const folders = folderCount(root);
    statFiles.textContent = plural(files.length, "file");
    statMore.textContent = plural(folders, "folder") + " · " + mb(root.size);
    upBtn.setAttribute("aria-disabled", files.length ? "false" : "true");
    upLbl.textContent = "Upload " + plural(files.length, "file");
    busLeft.textContent = plural(files.length, "file") + " in " + plural(folders + 1, "folder");
    busRight.textContent = mb(root.size);
    busFill.style.width = "0";
    // rows slide in one after another
    if (!calm()) [...tree.querySelectorAll(".row")].slice(0, 16).forEach((r, i) => play(r, [{ transform: "translateX(-18px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 380, delay: i * 35, easing: SPRING, fill: "backwards" }));
  }
  function emptyState() {
    root = null; files = [];
    tree.innerHTML = '<div class="empty"><svg viewBox="0 0 120 70" aria-hidden="true"><path d="M10 60h30v-26h26v-18h44" fill="none" stroke="var(--trace)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="10" cy="60" r="6" fill="var(--trace)" /><circle cx="66" cy="34" r="5" fill="var(--board)" stroke="var(--trace)" stroke-width="3" /><rect x="96" y="6" width="20" height="20" rx="4" fill="var(--chip)" /></svg><b>Drop a folder on the board</b><span>or press Choose folder</span></div>';
    statFiles.textContent = "0 files"; statMore.textContent = "pick a folder";
    upBtn.setAttribute("aria-disabled", "true"); upLbl.textContent = "Upload";
    busLeft.textContent = "Ready"; busRight.textContent = ""; busFill.style.width = "0";
  }
  function setTree(list, name, from) {
    stopAll();
    const keep = list.filter((f) => !SYSTEM.test(f.path.split("/").pop()));
    skipped = list.length - keep.length;
    if (!keep.length) { complain("That folder has no files to upload."); return; }
    root = buildTree(keep, name);
    render();
    note.textContent = from + " " + root.name + ": " + plural(files.length, "file") + ", " + mb(root.size) + (skipped ? " (" + plural(skipped, "system file") + " skipped)" : "") + ".";
    say(note.textContent + " Press Upload.");
  }
  function complain(msg) {
    note.textContent = msg; say(msg);
    board.classList.remove("shake"); void board.offsetWidth; board.classList.add("shake");
  }

  // ---------- Reading real folders: the picker and drag and drop ----------
  $("#chooseBtn").addEventListener("click", () => fileEl.click());
  fileEl.addEventListener("change", () => {
    const list = [...fileEl.files].map((f) => ({ path: f.webkitRelativePath || f.name, size: f.size }));
    fileEl.value = "";
    if (list.length) setTree(list, "Chosen files", "Read");
  });
  function readEntry(entry, path, out) {
    return new Promise((res) => {
      if (entry.isFile) entry.file((f) => { out.push({ path: path + f.name, size: f.size }); res(); }, () => res());
      else if (entry.isDirectory) {
        const reader = entry.createReader();
        const batch = () => reader.readEntries(async (ents) => {
          if (!ents.length) return res();
          for (const e of ents) await readEntry(e, path + entry.name + "/", out);
          batch();                                     // readEntries returns at most 100 at a time
        }, () => res());
        batch();
      } else res();
    });
  }
  board.addEventListener("dragover", (e) => { e.preventDefault(); board.classList.add("drop-on"); });
  board.addEventListener("dragleave", (e) => { if (!board.contains(e.relatedTarget)) board.classList.remove("drop-on"); });
  board.addEventListener("drop", async (e) => {
    e.preventDefault();
    board.classList.remove("drop-on");
    const items = [...(e.dataTransfer.items || [])].map((it) => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null)).filter(Boolean);
    const out = [];
    if (items.length) {
      note.textContent = "Reading the folder…";
      for (const en of items) await readEntry(en, "", out);
    } else [...e.dataTransfer.files].forEach((f) => out.push({ path: f.name, size: f.size }));
    if (out.length) setTree(out, "Dropped files", "Read"); else complain("Nothing to upload in that drop.");
  });
  ["dragover", "drop"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));

  // ---------- The sample: a wedding album ----------
  function sample() {
    const M = 1048576;
    return [
      ["mehndi/IMG_2041.jpg", 2.4 * M], ["mehndi/IMG_2042.jpg", 3.1 * M], ["mehndi/IMG_2055.jpg", 2.8 * M], ["mehndi/dance-clip.mp4", 18.6 * M],
      ["barat/arrival.jpg", 3.4 * M], ["barat/stage-wide.jpg", 4.2 * M], ["barat/family-group.jpg", 3.9 * M],
      ["barat/drone/aerial-01.jpg", 6.1 * M], ["barat/drone/aerial-02.jpg", 5.7 * M],
      ["walima/couple-portrait.jpg", 3.3 * M], ["walima/dessert-table.jpg", 2.2 * M],
      ["guest-list.csv", 48 * 1024], ["thank-you-cards.pdf", 1.6 * M]
    ].map(([p, s]) => ({ path: "shadi-album/" + p, size: Math.round(s) }));
  }
  $("#sampleBtn").addEventListener("click", () => setTree(sample(), "shadi-album", "Loaded the sample"));

  // ---------- Upload: three files at a time; each finished file sends a pulse up its trace ----------
  const rel = (el) => { const t = tree.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - t.left + tree.scrollLeft, y: r.top - t.top + tree.scrollTop, w: r.width, h: r.height }; };
  const visible = (node) => { for (let n = node.parent; n; n = n.parent) if (n.li && n.li.classList.contains("collapsed")) return false; return !!node.li; };
  function pulse(node) {
    if (calm() || !node.parent || !visible(node)) return;
    const a = rel(node.li.querySelector(".row")), b = rel(node.parent.li.querySelector(".row"));
    const s = document.createElement("i");
    s.className = "spark";
    const x = a.x - 13 + 1;
    s.style.left = x + "px"; s.style.top = a.y + 17 + "px";
    tree.appendChild(s);
    s.animate([
      { transform: "translate(14px, 0) scale(.6)", opacity: 0 },
      { transform: "translate(0, 0) scale(1)", opacity: 1, offset: .25 },
      { transform: `translate(0, ${b.y - a.y + 4}px) scale(.8)`, opacity: 1, offset: .9 },
      { transform: `translate(0, ${b.y - a.y}px) scale(1.6)`, opacity: 0 }
    ], { duration: 520, easing: "cubic-bezier(.5,0,.3,1)" }).onfinish = () => s.remove();
  }
  function rootBurst() {
    if (calm() || !root.li) return;
    const r = rel(root.li.querySelector(".leds"));
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.left = r.x + r.w / 2 + "px"; s.style.top = r.y + r.h / 2 + "px";
      tree.appendChild(s);
      const a = (i / 14) * Math.PI * 2, d = 26 + Math.random() * 30;
      s.animate([{ transform: "translate(0,0) scale(1.2)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d * .6}px) scale(.3)`, opacity: 0 }], { duration: 650 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }
  // keep the file being sent in view by scrolling only the tree (never the page)
  function follow(li) {
    const r = rel(li);
    if (r.y < tree.scrollTop + 10 || r.y + r.h > tree.scrollTop + tree.clientHeight - 10) tree.scrollTo({ top: Math.max(0, r.y - tree.clientHeight / 2), behavior: calm() ? "auto" : "smooth" });
  }
  const setArc = (dir) => { if (dir.arc) dir.arc.style.strokeDashoffset = 44 * (1 - (dir.size ? dir.loaded / dir.size : 1)); };

  async function upload(id) {
    busy = true;
    const btn = upBtn;                                         // keep the element before any await
    btn.dataset.state = "working";
    btn.setAttribute("aria-disabled", "true");
    board.classList.add("sending");
    tree.classList.remove("lit");
    say("Uploading " + plural(files.length, "file") + ".");
    // 1. Anticipation: the button sinks, the board's LEDs start to chase, the rows tighten
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.94, .9)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    upLbl.textContent = "Connecting…";
    await sleep(420, id);

    // 2. Simulated transfer: the whole folder takes 3 to 8 seconds, shared by three lanes
    const total = root.size || 1;
    const target = calm() ? 900 : Math.min(8000, 2600 + files.length * 120);
    const rate = total / target;                               // bytes per ms for all lanes together
    const queue = files.slice();
    let active = [], sent = 0, sentBytes = 0, last = performance.now();
    while (queue.length || active.length) {
      while (active.length < 3 && queue.length) {
        const f = queue.shift();
        active.push(f);
        if (f.li) { f.li.querySelector(".row").classList.add("active"); if (visible(f)) follow(f.li); }
      }
      await sleep(45, id);
      const now = performance.now(), dt = Math.min(120, now - last);
      last = now;
      for (const f of active) {
        const add = Math.min(f.size - f.loaded, (rate * dt) / active.length + (f.size ? 0 : 1));
        f.loaded += add; sentBytes += add;
        for (let p = f.parent; p; p = p.parent) { p.loaded += add; setArc(p); }
        if (f.bar) f.bar.style.width = (f.size ? (100 * f.loaded) / f.size : 100) + "%";
        if (f.loaded >= f.size) {
          f.done = true; sent++;
          if (f.li) { f.li.classList.add("done"); f.li.querySelector(".row").classList.remove("active"); play(f.li.querySelector(".pad"), [{ transform: "scale(1)" }, { transform: "scale(1.7)" }, { transform: "scale(1)" }], { duration: 420, easing: SPRING }); }
          pulse(f);
          // a folder lights up when its last file lands
          for (let p = f.parent; p; p = p.parent) {
            if (p.li && !p.li.classList.contains("done") && p.loaded >= p.size - .5) { p.li.classList.add("done"); if (p.parent) pulse(p); }
          }
        }
      }
      active = active.filter((f) => !f.done);
      busFill.style.width = (100 * sentBytes) / total + "%";
      busLeft.innerHTML = "<b></b> of " + plural(files.length, "file");
      busLeft.firstChild.textContent = sent;
      busRight.textContent = mb(sentBytes) + " of " + mb(total);
      upLbl.textContent = "Uploading " + Math.round((100 * sentBytes) / total) + "%";
    }

    // 3. Finish: every trace lights, the connector LEDs hold, sparks fly off the root
    board.classList.remove("sending");
    board.classList.add("finished");
    tree.classList.add("lit");
    tree.scrollTo({ top: 0, behavior: calm() ? "auto" : "smooth" });
    rootBurst();
    btn.dataset.state = "done";
    upLbl.textContent = "Uploaded";
    const folders = folderCount(root) + 1;
    note.textContent = "Uploaded " + plural(files.length, "file") + " in " + plural(folders, "folder") + ", " + mb(total) + ", with every path kept.";
    say(note.textContent);
    await sleep(2600, id);

    // 4. Reset: progress clears, the tree stays for another go
    resetProgress();
    busy = false;
  }
  function resetProgress() {
    board.classList.remove("sending", "finished");
    tree.classList.remove("lit");
    tree.querySelectorAll(".spark").forEach((s) => s.remove());
    tree.querySelectorAll("li.done").forEach((li) => li.classList.remove("done"));
    tree.querySelectorAll(".row.active").forEach((r) => r.classList.remove("active"));
    const zero = (n) => { n.loaded = 0; n.done = false; if (n.bar) n.bar.style.width = "0"; if (n.dir) { setArc(n); n.kids.forEach(zero); } };
    if (root) {
      zero(root);
      busLeft.textContent = plural(files.length, "file") + " in " + plural(folderCount(root) + 1, "folder");
      busRight.textContent = mb(root.size);
    }
    busFill.style.width = "0";
    upBtn.dataset.state = "idle";
    upBtn.setAttribute("aria-disabled", root ? "false" : "true");
    upLbl.textContent = root ? "Upload " + plural(files.length, "file") : "Upload";
  }
  function stopAll() { runId++; busy = false; resetProgress(); }
  upBtn.addEventListener("click", async () => {
    if (busy) return;
    if (!root) { complain("Choose a folder (or press Sample) first."); return; }
    const id = ++runId;
    try { await upload(id); } catch (e) { if (e !== STOP) throw e; }
  });

  // ---------- Auto demo: load the album, fold one folder, upload ----------
  let demoOn = true, demoTimer = 0;
  function scheduleDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(demo, ms); }
  async function demo() {
    if (!demoOn || busy) return scheduleDemo(1500);
    setTree(sample(), "shadi-album", "Loaded the sample");
    const id = ++runId;
    try {
      busy = true;
      await sleep(900, id);
      busy = false;
      await upload(id);
      scheduleDemo(1400);
    } catch (e) { if (e !== STOP) throw e; }
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    stopAll();
  }
  ["pointerdown", "keydown", "dragenter"].forEach((t) => addEventListener(t, takeOver, true));

  emptyState();
  scheduleDemo(200);
</script>
</body>
</html>
