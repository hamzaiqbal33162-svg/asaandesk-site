<style>
/* ---------- Theme:deep navy canvas,sand cards,one signal-yellow accent ---------- */
:root{

--navy:#1c2e4e;--navy-ink:#f2e9d7;--chip-bg:#1c2e4e;--chip-ink:#f6c12f;
--good:#2b8558;--bad:#cc4433;--warn:#b8700a;--blue:#3a6cb3;--teal:#24857f;--coral:#e0664c;--plum:#7d5ba6;
--good-soft:rgba(43,133,88,.14);--bad-soft:rgba(204,68,51,.13);--warn-soft:rgba(223,160,14,.2);--blue-soft:rgba(58,108,179,.13);
--surface:var(--card);--surface-2:var(--card-2);--panel:#f4ecde;
--map-land:#efe4cf;--map-land-2:#e7dac0;--map-water:#c3d3d4;--map-road:#24365a;--map-minor:rgba(36,54,90,.32);--map-text:#3a4157;
--depot:#1c2e4e;--depot-ink:#f6c12f;--truck-line:#1a2338;--parked:#fbf7ef;--focus:#3b74e0;
--radius:14px;--radius-sm:10px;--tip-bg:#0f1a2e;--tip-ink:#f2e9d7;--overlay:rgba(8,14,26,.55);
--shadow:0 1px 0 rgba(255,255,255,.55) inset,0 16px 30px -20px rgba(3,8,20,.75);
color-scheme:light;
}
[data-theme="dark"]{
--canvas:#090f1b;--canvas-2:#0e1729;--on:#efe5d0;--on-mute:#8d9bb3;--on-line:rgba(239,229,208,.1);--on-fill:rgba(239,229,208,.05);
--card:#131f35;--card-2:#1a2944;--card-3:#0e182b;--ink:#ede2cb;--muted:#93a0b7;--line:rgba(237,226,203,.1);--grid:rgba(237,226,203,.07);
--accent:#ffca3a;--accent-2:#f0b11c;--accent-soft:rgba(255,202,58,.16);--accent-ink:#141a26;
--navy:#0a1322;--navy-ink:#efe5d0;--chip-bg:#efe5d0;--chip-ink:#141a26;
--good:#4cc38a;--bad:#ff6e5c;--warn:#ffb547;--blue:#7aa7ef;--teal:#4fc7bf;--coral:#ff8a6b;--plum:#b593e6;
--good-soft:rgba(76,195,138,.14);--bad-soft:rgba(255,110,92,.14);--warn-soft:rgba(255,181,71,.15);--blue-soft:rgba(122,167,239,.14);
--panel:#14223b;
--map-land:#101c31;--map-land-2:#13213a;--map-water:#0a2138;--map-road:#c9bea6;--map-minor:rgba(201,190,166,.24);--map-text:#b4bed0;
--depot:#efe5d0;--depot-ink:#141a26;--truck-line:#0a0f1a;--parked:#aeb8c9;--focus:#ffca3a;
--tip-bg:#efe5d0;--tip-ink:#141a26;--overlay:rgba(0,0,0,.62);
--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 34px -20px rgba(0,0,0,.9);
color-scheme:dark;
}
/* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.cc-av{--h:200;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;font-size:.8em;font-weight:700;color:hsl(var(--h) 60% 22%);background:hsl(var(--h) 70% 84%);flex:none;letter-spacing:.02em}
[data-theme="dark"] .cc-av{color:hsl(var(--h) 80% 88%);background:hsl(var(--h) 35% 28%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:38px;padding:0 16px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink,#fff)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -8px var(--accent)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 11px;font-size:.86em}
.btn[disabled]{opacity:.5;pointer-events:none}
.cc-toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:grid;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.cc-toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm,10px);background:var(--tip-bg,#111);color:var(--tip-ink,#fff);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-size:.92rem;animation:ccToast .35s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto}
.cc-toast .ic{color:var(--good)}
.cc-toast.bad .ic{color:var(--bad)}
.cc-toast.warn .ic{color:var(--warn)}
.cc-toast.out{animation:ccToastOut .3s ease forwards}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes ccToastOut{to{opacity:0;transform:translateX(30px)}}
.cc-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.cc-back{position:absolute;inset:0;background:var(--overlay,rgba(10,12,20,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.cc-dialog{position:relative;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel,var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius,16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.1)}
.cc-dialog.wide{width:min(720px,100%)}
.cc-overlay.open .cc-back{opacity:1}
.cc-overlay.open .cc-dialog{opacity:1;transform:none}
.cc-overlay.is-drawer{place-items:stretch end;padding:0}
.cc-overlay.is-drawer .cc-dialog{width:min(440px,100%);height:100%;max-height:none;border-radius:var(--radius,16px) 0 0 var(--radius,16px);transform:translateX(40px)}
.cc-overlay.is-drawer.open .cc-dialog{transform:none}
.cc-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:1}
.cc-dh h2{margin:0;font-size:1.12rem}
.cc-x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent}
.cc-x:hover{background:var(--surface-2)}
.cc-db{padding:8px 20px 20px}
.cc-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap}
.cc-db .cc-df{padding:14px 0 0}
.cc-confirm{margin:6px 0 0;color:var(--muted);line-height:1.5}
.cc-picks{display:grid;gap:6px}
.cc-pick{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface-2)}
.cc-pick:hover,.cc-pick:focus-visible{border-color:var(--accent)}
.cc-pick small{margin-left:auto;color:var(--muted)}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.cc-field{display:grid;gap:5px;grid-column:span 2}
.cc-field.half{grid-column:span 1}
.cc-field label{font-size:.84rem;font-weight:600;color:var(--muted)}
.cc-field input,.cc-field select,.cc-field textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.cc-field input:focus,.cc-field select:focus,.cc-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.cc-field [aria-invalid="true"]{border-color:var(--bad)}
.cc-err{color:var(--bad);font-size:.8rem;min-height:0}
.cc-err:empty{display:none}
.cc-hint{color:var(--muted);font-size:.78rem}
.cc-intro{margin:0 0 12px;color:var(--muted)}
.cc-form.shake{animation:ccShake .35s}
@keyframes ccShake{25%{transform:translateX(-6px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)}}
@media (max-width:480px){.cc-field.half{grid-column:span 2}}
.cc-pop{position:fixed;z-index:85;max-height:70vh;overflow:auto;background:var(--panel,var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm,12px);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .25s}
.cc-pop.open{opacity:1;transform:none}
.cc-tip{position:fixed;z-index:95;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111);color:var(--tip-ink,#fff);font-size:.8rem;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .12s}
.cc-tip.on{opacity:1}
.cc-tip b{display:block;margin-bottom:3px}
.cc-tip div{display:flex;align-items:center;gap:6px}
.cc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.cc-tip em{margin-left:auto;padding-left:10px;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.cc-tip-tot{border-top:1px solid rgba(255,255,255,.18);margin-top:4px;padding-top:4px}
.cc-cmdk .cc-dialog{align-self:start;margin-top:10vh}
.cc-cmdk-q{width:100%;min-height:46px;padding:0 14px;border-radius:var(--radius-sm,10px);border:1px solid var(--accent);background:var(--surface-2);font-size:1rem}
.cc-cmdk-q:focus{outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.cc-cmdk-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer}
.cc-cmdk-list li[aria-selected="true"],.cc-cmdk-list li:hover{background:var(--surface-2);color:var(--accent)}
.cc-cmdk-list small{margin-left:auto;color:var(--muted)}
.cc-cmdk-foot{margin:10px 0 0;font-size:.76rem;color:var(--muted)}
.cc-cmdk-foot kbd{padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid var(--line);font-family:inherit}
.cc-empty-li{color:var(--muted);cursor:default !important}
.cc-tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.cc-search{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:320px;min-height:38px;padding:0 12px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.cc-search:focus-within{border-color:var(--accent)}
.cc-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink)}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap}
.cc-chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;transition:background .2s,color .2s}
.cc-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink,#fff);border-color:transparent}
.cc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cc-tbl table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.cc-tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-tbl th button{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.cc-tbl th svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5}
.cc-tbl th[aria-sort="ascending"] svg,.cc-tbl th[aria-sort="descending"] svg{opacity:1;color:var(--accent)}
.cc-tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.cc-tbl tbody tr{animation:ccRow .35s both;animation-delay:calc(var(--r,0) * 25ms);transition:background .15s}
.cc-tbl tbody tr[tabindex="0"]{cursor:pointer}
.cc-tbl tbody tr[tabindex="0"]:hover{background:var(--surface-2)}
.cc-tbl .r,.cc-tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.cc-tbl th.r button{flex-direction:row-reverse}
@keyframes ccRow{from{opacity:0;transform:translateY(6px)}}
.cc-pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.84rem;color:var(--muted)}
.cc-pages{display:flex;gap:4px;align-items:center}
.cc-pages button{min-width:32px;height:32px;padding:0 6px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.cc-pages button[aria-current="page"]{background:var(--accent);color:var(--accent-ink,#fff);border-color:transparent}
.cc-pages button:disabled{opacity:.4;cursor:default}
.cc-empty{display:grid;place-items:center;align-content:center;gap:6px;padding:28px 12px;text-align:center;color:var(--muted)}
.cc-empty .ic{width:30px;height:30px;opacity:.6}
.cc-empty b{color:var(--ink)}
.cc-chart{display:block;overflow:visible}
.cc-chart text,.cc-gauge text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.cc-grid line{stroke:var(--grid,var(--line));stroke-dasharray:3 4}
.cc-zero{stroke:var(--line)}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards}
.cc-fade{animation:ccFade .9s .3s both}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both;transition:opacity .2s}
.cc-bar.neg{transform-origin:50% 0}
.cc-static .cc-draw,.cc-static .cc-fade,.cc-static .cc-bar,.cc-static .cc-cell{animation:none;stroke-dashoffset:0}
.cc-guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0}
.cc-guide.on{opacity:.7}
.cc-dot{opacity:0;stroke:var(--surface);stroke-width:2}
.cc-dot.on{opacity:1}
.cc-hit.on{fill:var(--ink);fill-opacity:.05}
@keyframes ccDraw{to{stroke-dashoffset:0}}
@keyframes ccFade{from{opacity:0}}
@keyframes ccGrow{from{transform:scaleY(0)}}
@keyframes ccPop{from{opacity:0;transform:scale(.4)}}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.cc-legend span{display:inline-flex;align-items:center;gap:6px}
.cc-legend i,.cc-dlegend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.cc-donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.cc-donut{position:relative;flex:none}
.cc-donut svg{display:block}
.cc-track{fill:none;stroke:var(--track,var(--surface-2));stroke-linecap:round}
.cc-seg{fill:none;transition:opacity .2s,stroke-width .2s;cursor:pointer}
.cc-seg.dim{opacity:.3}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.cc-donut-c small{color:var(--muted);font-size:.76rem}
.cc-dlegend{list-style:none;margin:0;padding:0;flex:1 1 160px;display:grid;gap:4px;font-size:.86rem}
.cc-dlegend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;transition:background .2s}
.cc-dlegend li.on{background:var(--surface-2)}
.cc-dlegend em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.cc-dlegend small{color:var(--muted);min-width:2.6em;text-align:right}
.cc-spark{display:block;overflow:visible}
.cc-spark .cc-line{stroke-width:1.8}
.cc-in{animation:var(--enter,ccRise) .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
.cc-draw{stroke-dashoffset:0}
}
/* ================= Haulmark:shell ================= */
body{font-variant-numeric:tabular-nums;background:var(--canvas);color:var(--on);font:13px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.topo{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(120% 80% at 80% -10%,var(--canvas-2),transparent 60%),var(--canvas)}
.topo svg{position:absolute;width:1400px;height:1000px;right:-260px;top:-120px;color:var(--on);opacity:.07}
.topo svg.b{left:-420px;right:auto;top:520px;width:1100px;height:800px;opacity:.05}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;height:62px;padding:0 24px;background:color-mix(in srgb,var(--canvas) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--on-line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--on);text-decoration:none;flex:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--on-mute);line-height:1.2}
.nav{position:relative;display:flex;gap:1px;margin:0 auto;padding:0 2px 7px}
.nav::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:2px;border-radius:1px;background:repeating-linear-gradient(90deg,var(--on-line) 0 12px,transparent 12px 20px)}
.nav a{position:relative;display:flex;align-items:center;gap:7px;padding:8px 10px 7px;border-radius:9px;color:var(--on-mute);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap;transition:color .2s,background .2s}
.nav a:hover{color:var(--on);background:var(--on-fill)}
.nav a[aria-current="page"]{color:var(--on)}
.nav a[aria-current="page"] .ic{color:var(--accent)}
.nav .ic{width:16px;height:16px}
.nav .dot{position:absolute;top:5px;right:3px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.nav .dot:empty{display:none}
.nav .mark{position:absolute;left:0;bottom:-1px;height:4px;width:40px;border-radius:2px;background:var(--accent);z-index:1;box-shadow:0 0 14px var(--accent-soft);transition:transform .65s cubic-bezier(.55,0,.25,1),width .45s,opacity .2s}
.nav .mark svg{position:absolute;right:-9px;top:-12px;width:24px;height:14px;transition:transform .25s}
.nav .mark.rev svg{right:auto;left:-9px;transform:scaleX(-1)}
.nav .mark.go svg{animation:hmBump .32s ease-in-out 2}
@keyframes hmBump{50%{translate:0 -1.5px}}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.tbtn{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--on-line);background:var(--on-fill);color:var(--on);transition:background .2s,transform .15s}
.tbtn:hover{background:var(--on-line)}
.tbtn:active{transform:scale(.94)}
.tbtn .ic{width:17px;height:17px}

.docks{display:flex;gap:2px;margin-top:6px}

/* ---------- Trip page:timeline scrubber (signature) ---------- */

.tripmap > svg{width:100%;height:100%;display:block}

.scrub{user-select:none;-webkit-user-select:none}
.tl{position:relative;height:128px;margin:6px 6px 0;touch-action:none;cursor:pointer;outline:none}
.tl:focus-visible{outline:2px solid var(--accent-2);outline-offset:6px;border-radius:8px}
.tl svg.spd{position:absolute;left:0;right:0;top:0;width:100%;height:70px;display:block;overflow:visible}

.tl .track{position:absolute;left:0;right:0;top:76px;height:8px;border-radius:4px;background:var(--card-2)}
.tl .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy)}
[data-theme="dark"] .tl .fill{background:var(--accent)}
.tl .ev{position:absolute;top:70px;width:20px;height:20px;margin-left:-10px;border-radius:6px;border:2px solid var(--card);background:var(--card-3);color:var(--ink);display:grid;place-items:center;padding:0;z-index:1;box-shadow:0 2px 6px -2px rgba(0,0,0,.4)}
.tl .ev .ic{width:11px;height:11px}

[data-theme="dark"] .tl .ev.past{background:var(--accent);color:var(--accent-ink)}

.tl .ev-l{position:absolute;top:96px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;text-align:center;line-height:1.25;pointer-events:none}
.tl .ev-l b{display:block;color:var(--ink);font-weight:650;font-size:10.5px}
.tl .ev-l.l0{transform:none}
.tl .ev-l.l1{transform:translateX(-100%)}
.tl .handle{position:absolute;top:0;bottom:34px;width:2px;margin-left:-1px;background:var(--ink);z-index:2;pointer-events:none}
.tl .handle::after{content:"";position:absolute;left:50%;top:80px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);box-shadow:0 4px 10px -2px rgba(0,0,0,.5)}
.tl .handle span{position:absolute;top:-4px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--card);font-size:11px;font-weight:800;white-space:nowrap}
.tl .nowmark{position:absolute;top:66px;width:2px;height:28px;margin-left:-1px;background:var(--coral)}
.scrub-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.scrub-bar .now-ev{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;font-size:12px}
.stops{list-style:none;margin:0;padding:0;position:relative}

.stops .sd{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--card-3);border:1px solid var(--line);color:var(--muted);flex:none;transition:background .3s,color .3s}
.stops .sd .ic{width:12px;height:12px}

.stops li.cur .sd{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 4px var(--accent-soft)}
.stops li.fut{opacity:.62}
.stops b{display:block;font-size:12px}
.stops small{color:var(--muted);font-size:11px}
.stops .tm{margin-left:auto;font-size:11.5px;font-weight:700}
.ring{position:relative;width:80px;height:80px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--card-2);stroke-width:7}

.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:12px}

/* ---------- Drivers ---------- */
.hoursboard{display:grid;gap:7px}
.hb-row{display:grid;grid-template-columns:150px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:12px}
.hb-track{position:relative;height:14px;border-radius:4px;background:var(--card-2);display:flex;overflow:hidden}
.hb-track i{height:100%;width:0;transition:width .9s cubic-bezier(.3,1,.4,1)}
.hb-track i.d{background:var(--navy)}
[data-theme="dark"] .hb-track i.d{background:var(--blue)}
.hb-track i.o{background:var(--accent)}
.hb-track i.b{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px);opacity:.5}
.hb-limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--coral)}
.hb-row .left{white-space:nowrap;text-align:right;font-weight:700}

.hb-note{display:flex;gap:8px;align-items:center;margin:14px 0 0;padding:9px 12px;border-radius:10px;background:var(--card-2);color:var(--muted);font-size:11.5px}
.hb-note .ic{color:var(--accent-2);flex:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.dcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.dcard .pic{position:relative;height:150px;background:var(--navy);overflow:hidden}
.dcard .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.dcard:hover .pic img{transform:scale(1.05)}
.dcard .pic .mono{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:800;letter-spacing:-.03em;color:var(--accent);background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px),var(--navy)}
.dcard .pic .pill{position:absolute;left:10px;top:10px;box-shadow:0 4px 10px -4px rgba(0,0,0,.5);background:var(--card)}
.dcard .pic .plate{position:absolute;right:10px;top:10px}
.dcard .bd{padding:11px 13px 12px;display:grid;gap:8px;flex:1}
.dcard h3{margin:0;font-size:14px;font-weight:750}
.dcard .meta{color:var(--muted);font-size:11.5px}
.dcard .hrs{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.dcard .hrs div{display:flex;justify-content:space-between}
.dcard .hrs b{color:var(--ink)}
.dcard .ft{display:flex;gap:6px;align-items:center}
.stars{color:var(--accent-2);font-size:11.5px;font-weight:750;display:inline-flex;align-items:center;gap:3px}
.stars .ic{width:12px;height:12px;fill:currentColor}
.dhead{display:flex;gap:14px;align-items:center}
.dhead img,.dhead .cc-av{width:84px;height:84px;border-radius:16px;object-fit:cover;font-size:26px}
.dhead h3{margin:0;font-size:17px}
/* ---------- Vehicles ---------- */
.vhero{display:grid;grid-template-columns:1.05fr 1fr;padding:0;overflow:hidden;min-height:248px}
.vhero .pic{position:relative;background:var(--navy);min-height:220px}

.vhero .pic .tag{position:absolute;left:12px;bottom:12px;z-index:1;padding:8px 11px}
.vhero .bd{padding:14px 16px;display:grid;gap:10px;align-content:start}
.health{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.health b{display:block;font-size:15px}
.health small{color:var(--muted);font-size:10.5px}
.svc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.svc-day{min-height:92px;border-radius:10px;background:var(--card-2);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}

.job{display:block;width:100%;text-align:left;border:0;border-radius:7px;padding:4px 6px;font-size:10.5px;line-height:1.25;background:var(--card-3);color:var(--ink);border-left:3px solid var(--navy)}
.job b{display:block;font-size:10.5px}
.job.done{opacity:.5;text-decoration:line-through;border-left-color:var(--good)}
.job.brake{border-left-color:var(--coral)}
.job.tyre{border-left-color:var(--accent-2)}
.job.mot{border-left-color:var(--blue)}
.comp{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;font-size:12px;padding:4px 0}
/* ---------- Loads board + POD ---------- */
.loads{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:color-mix(in srgb,var(--card) 14%,transparent);border:1px dashed var(--on-line);border-radius:var(--radius);padding:10px;min-height:420px;transition:background .2s,border-color .2s}

.lcard{padding:10px 11px;cursor:grab;border:1px solid transparent}

.lcard .l4{display:flex;gap:6px;align-items:center;margin-top:8px}
.tmp{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700}

.tmp.chl{background:var(--blue-soft);color:var(--blue)}

.pod .shot{position:relative;height:190px;border-radius:11px;overflow:hidden;background:var(--navy)}

.sig{height:92px;border-radius:11px;background:var(--card-3);border:1px dashed var(--line);position:relative;overflow:hidden}
.sig svg{width:100%;height:100%;display:block}

.sigpad{width:100%;height:130px;border-radius:11px;background:var(--card-3);border:1px dashed var(--muted);touch-action:none;display:block;cursor:crosshair}

.stations .bar{height:8px}
.alert{display:grid;grid-template-columns:4px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;overflow:hidden}

.span2{grid-column:span 2}

function reportCard(r) {
const o = r.owner;
return `<article class="card lift rcard" data-r="${r.id}"><div class="top-r"><span class="cicon">${ic(RICON[r.kind] || "file")}</span><span class="pill nodot ${r.when.startsWith("Daily") ? "move" : ""}">${esc(r.when)}</span><span class="grow"></span><button class="ibtn" data-menu-r aria-label="More for ${esc(r.name)}">${ic("more")}</button></div>
<h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p>
<div class="prev" aria-hidden="true">${r.bars.map((b, i) => `<i class="${i === r.bars.length - 1 ? "y" : ""}" style="height:${b}%;animation-delay:${i * 30}ms"></i>`).join("")}</div>
<div class="run"><i></i></div>
<div class="ft">${avatar(o, "")}<span class="grow"><b style="color:var(--ink)">${esc(o)}</b><br><span class="last">ran ${ago(r.last)}</span> · ${r.pages} pages</span><button class="btn sm ink" data-run>${ic("play")}Run now</button></div></article>`;
}
function reportForm(r) {
formModal({
title: r ? "Edit report" : "New report", submit: r ? "Save" : "Create report", values: r || { when: "Weekly · Mon", owner: "Dana Whitlock", kind: "custom" },
fields: [
{ name: "name", label: "Name", required: true, check: (v) => (v.length < 4 ? "Give it a name of at least 4 letters" : "") },
{ name: "desc", label: "What it shows", type: "textarea", required: true },
{ name: "when", label: "Schedule", type: "select", options: ["Daily 18:00", "Weekly · Mon", "Weekly · Wed", "Weekly · Fri", "Monthly · 1st", "On demand"], half: true },
{ name: "owner", label: "Owner", type: "select", options: DISPATCH, half: true },
],
onSubmit: (v) => { if (r) Object.assign(r, v); else S.reports.unshift({ id: uid(), kind: "custom", last: Date.now(), pages: 4, bars: Array.from({ length: 14 }, (_, i) => 30 + ((i * 37) % 70)), ...v }); save(); toast(r ? "Report saved" : "Report created"); rerender(); },
});
}
/* ---------- Settings ---------- */
PH.settings = () => ({ eyebrow: `${ic("sliders")} Workspace`, title: "Settings", sub: `${esc(S.set.company)} · dispatch, depots, map and data` });
const sw = (k, on, label) => `<button class="switch" role="switch" aria-checked="${!!on}" data-set="${k}" aria-label="${label}"></button>`;
PAGE.settings = () => {
S.docks = S.docks || { ...DEPOT_DOCKS };
view.innerHTML = `<div class="set-grid">
<section class="card">${CH("briefcase", `Company`)}
<form class="set-form" id="coForm" novalidate><label>Company name<input name="company" value="${esc(S.set.company)}" required><span class="err" data-e="company"></span></label><label>Dispatch email<input name="email" type="email" value="${esc(S.set.email)}" required><span class="err" data-e="email"></span></label><label>Time zone<select name="tz">${["Local time", "UTC", "UTC+1", "UTC+5", "UTC−5"].map((z) => `<option ${z === S.set.tz ? "selected" : ""}>${z}</option>`).join("")}</select></label><div class="row"><span class="grow"></span><button class="btn primary sm" type="submit">${ic("check")}Save company</button></div></form></section>
<section class="card">${CH("map", `Units and map`)}
<div class="set-row"><div><b>Distance</b><small>Used on every page</small></div><div class="seg" id="uSeg"><button data-u="km" aria-pressed="${S.set.units === "km"}">Kilometres</button><button data-u="mi" aria-pressed="${S.set.units === "mi"}">Miles</button></div></div>
<div class="set-row"><div><b>ETA labels on trucks</b><small>Show the minutes left next to each truck</small></div>${sw("eta", S.set.eta, "ETA labels")}</div>
<div class="set-row"><div><b>Move trucks smoothly</b><small>Off: positions jump once a second</small></div>${sw("motion", S.set.motion, "Smooth truck motion")}</div>
<div class="set-row"><div><b>Traffic layer</b><small>Slow and stopped roads in amber and coral</small></div>${sw("traffic", S.set.traffic, "Traffic layer")}</div>
<div class="set-row"><div><b>Fuel stops</b><small>Stations on the drawn map</small></div>${sw("fuelLayer", S.set.fuelLayer, "Fuel stops layer")}</div></section>
<section class="card">${CH("bell", `Notifications`)}
<div class="set-row"><div><b>Late trucks</b><small>When an ETA slips past the window</small></div>${sw("notifyLate", S.set.notifyLate, "Late trucks")}</div>
<div class="set-row"><div><b>Signed deliveries</b><small>Every proof of delivery</small></div>${sw("notifyPod", S.set.notifyPod, "Signed deliveries")}</div>
<div class="set-row"><div><b>Driving hours</b><small>When a driver nears the limit</small></div>${sw("notifyHours", S.set.notifyHours, "Driving hours")}</div>
<div class="set-row"><div><b>Try it</b><small>Sends one note to the bell</small></div><button class="btn sm" id="tNote">${ic("bell")}Send a test</button></div></section>
<section class="card span2">${CH("dock", `Depots`, `<span class="sub">Loading docks per depot, shown on the live map</span>`)}
<div id="depList">${"ASMPC".split("").map((k) => `<div class="dep-row"><img src="${DEPOT_PHOTO[k]}" alt="" width="46" height="34" loading="lazy"><span class="grow"><b>${esc(NODES[k].depot)}</b><br><small class="muted">${((n) => n + (n === 1 ? " unit" : " units"))(S.vehicles.filter((v) => v.depot === k).length)} based here · ${S.drivers.filter((d) => d.depot === k).length} drivers</small></span><button class="ibtn" data-dk="${k}" data-d="-1" aria-label="Fewer docks at ${esc(NODES[k].depot)}">${ic("minus")}</button><b class="num" style="min-width:56px;text-align:center" id="dk-${k}">${S.docks[k]} docks</b><button class="ibtn" data-dk="${k}" data-d="1" aria-label="More docks at ${esc(NODES[k].depot)}">${ic("plus")}</button></div>`).join("")}</div></section>
<div class="stack"><section class="card">${CH("refresh", `Look and data`)}
<div class="set-row"><div><b>Export</b><small>Everything on this board as JSON</small></div><button class="btn sm" id="xJson">${ic("download")}Export</button></div>
<div class="set-row"><div><b>Reset demo data</b><small>Trips, drivers, loads, fuel and alerts</small></div><button class="btn sm danger" id="reset">${ic("refresh")}Reset demo data</button></div></section>
<section class="card">${CH("users", `Dispatch desk`, `<span class="grow"></span><span class="pill ok">3 on shift</span>`)}<ul class="list">${[["Dana Whitlock", "Dispatch lead", "06:00–14:00", "img/me-dana.webp"], ["Owen Pryce", "Planner", "08:00–16:00"], ["Mei Tanaka", "Night dispatch", "14:00–22:00"]].map(([n, r, h, p]) => `<li>${p ? `<img class="av" src="${p}" alt="" width="28" height="28">` : avatar(n)}<span class="t"><b>${n}</b><small>${r}</small></span><span class="r"><b>${h}</b><small>today</small></span></li>`).join("")}</ul></section></div>
</div>`;
$("#coForm").addEventListener("submit", (e) => {
e.preventDefault();
const f = e.target, c = f.company.value.trim(), m = f.email.value.trim();
const err = { company: c.length < 2 ? "Enter the company name" : "", email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m) ? "" : "Enter a valid email address" };
$$("[data-e]", f).forEach((s) => (s.textContent = err[s.dataset.e]));
if (err.company || err.email) { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
Object.assign(S.set, { company: c, email: m, tz: f.tz.value }); save();
$(".brand small").textContent = c; toast("Company details saved"); setPH(PH.settings(), false);
});
view.addEventListener("click", settingsClick);
$(".brand small").textContent = S.set.company;
};
function settingsClick(e) {
if (current !== "settings") return view.removeEventListener("click", settingsClick);
const s = e.target.closest("[data-set]");
if (s) { const k = s.dataset.set; S.set[k] = !S.set[k]; s.setAttribute("aria-checked", String(S.set[k])); save(); toast(`${s.getAttribute("aria-label")} ${S.set[k] ? "on" : "off"}`); }
const u = e.target.closest("[data-u]");
if (u) { S.set.units = u.dataset.u; $$("#uSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b === u))); save(); toast("Distances now in " + (u.dataset.u === "mi" ? "miles" : "kilometres")); }
const dk = e.target.closest("[data-dk]");
if (dk) { const k = dk.dataset.dk; S.docks[k] = clamp(S.docks[k] + +dk.dataset.d, 2, 30); DEPOT_DOCKS[k] = S.docks[k]; $("#dk-" + k).textContent = S.docks[k] + " docks"; save(); }
if (e.target.closest("#tNote")) { note("Test note from Settings: notifications are working"); toast("Test note sent to the bell"); }
if (e.target.closest("#xJson")) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })); a.download = "haulmark-data.json"; document.body.appendChild(a); a.click(); a.remove(); toast("Data exported"); }
if (e.target.closest("#reset")) confirmBox("Reset all demo data? Trips, drivers, loads, fuel and alerts go back to the start.", "Reset").then((ok) => { if (!ok) return; store.del(KEY); S = seed(); MAP.sel = null; MAP.filter = "All"; MAP.vb = { x: 0, y: 0, w: 1000, h: 540 }; podSel = null; save(); drawBadges(); $(".brand small").textContent = S.set.company; toast("Demo data reset"); rerender(); });
}
/* ---------- Boot ---------- */
(function boot() {
if (S.docks) Object.assign(DEPOT_DOCKS, S.docks);
$("#topoA").innerHTML = Array.from({ length: 11 }, (_, k) => `<path d="${ringPath(980, 360, 60 + k * 46, 40 + k * 34, k * 0.6)}" fill="none" stroke="currentColor" stroke-width="1.2"/>`).join("");
$("#topoB").innerHTML = Array.from({ length: 8 }, (_, k) => `<path d="${ringPath(420, 380, 50 + k * 44, 34 + k * 30, k * 0.9 + 1)}" fill="none" stroke="currentColor" stroke-width="1.2"/>`).join("");
$(".brand small").textContent = S.set.company;
document.addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) location.hash = g.dataset.go; });
initShell(() => pageCmds(PAGES, [
{ label: "Plan a trip", icon: "plus", hint: "action", run: () => tripForm() },
{ label: "Add a driver", icon: "user", hint: "action", run: () => driverForm() },
{ label: "Book a service", icon: "wrench", hint: "action", run: () => serviceForm(S.vehicles.slice().sort((a, b) => a.svcKm - b.svcKm)[0].id) },
{ label: "Switch theme", icon: "moon", hint: "action", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
].concat(onRoad().map((t) => ({ label: `Find ${t.vehicle} on the map`, hint: "to " + t.to, icon: "truck", run: () => { if (current !== "live") location.hash = "#/live"; setTimeout(() => focusTruck(t.id), current === "live" ? 0 : 500); } })), S.drivers.map((d) => ({ label: "Driver: " + d.name, hint: d.status, icon: "steer", run: () => { location.hash = "#/drivers"; setTimeout(() => driverDrawer(d.id), 500); } })))));
drawBadges();
startRouter(PAGES.map((p) => p[0]), "live", render);
})();
</script>
</body>
</html>
