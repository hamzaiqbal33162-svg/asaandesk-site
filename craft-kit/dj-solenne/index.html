<!doctype html>
<!-- Chill & Craft · Solenne · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solenne · a smart home by day and by night</title>
<style>
/* ===== Core: reset, charts, toasts, modals, tables (theme comes from variables) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:var(--bg);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:200;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 46%);flex:none}
/* entrance */
.cc-in{animation:var(--enter,ccRise) .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes ccFade{from{opacity:0}}
/* charts */
.cc-chart{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.cc-grid{stroke:var(--grid,var(--line));stroke-width:1}
.cc-ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,0,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.cc-area{animation:ccFade 1s .35s both}
.cc-guide{stroke:var(--mut);stroke-dasharray:3 3;pointer-events:none}
.cc-dots{pointer-events:none}.cc-dots circle{stroke:var(--card-solid,#fff);stroke-width:2}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.cc-col{fill:var(--fg);fill-opacity:0;transition:fill-opacity .15s}.cc-col:hover{fill-opacity:.06}
.cc-seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke-width .2s}
.cc-seg:hover{stroke-width:calc(var(--th) + 5px)!important}
.cc-cell{animation:ccFade .5s both;animation-delay:calc(var(--i,0) * 7ms)}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.cc-legend i,.cc-tip i,.cc-dleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none}
.cc-tip{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:240px}
.cc-tip b{font-weight:700}
.cc-empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:14px}
.cc-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cc-donut-w{position:relative;flex:none}
.cc-donut-w svg{display:block}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:20px;line-height:1.1}.cc-donut-c span{font-size:11px;color:var(--mut)}
.cc-dleg{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:13px}
.cc-dleg li{display:flex;align-items:center;gap:4px}.cc-dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc-dleg em{font-style:normal;color:var(--mut);width:38px;text-align:right}
.cc-gauge{position:relative;margin:auto}.cc-gauge svg{display:block}
.cc-gv{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.cc-gauge-c{position:absolute;inset:0 0 10% 0;display:grid;place-content:center;text-align:center}
.cc-gauge-c b{font-size:24px;line-height:1.1}.cc-gauge-c span{font-size:11px;color:var(--mut)}
.cc-hbars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cc-hbars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.cc-hbars i{grid-column:1/-1;height:7px;border-radius:9px;background:var(--track,var(--line));overflow:hidden}
.cc-hbars em{display:block;height:100%;width:var(--w);border-radius:inherit;animation:ccBarW .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes ccBarW{from{width:0}}
.cc-ringv{animation:ccRing 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ccRing{from{stroke-dasharray:0 var(--c)}}
/* toasts */
.cc-toasts{position:fixed;z-index:1001;bottom:16px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.cc-toast{pointer-events:auto;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;animation:ccToast .38s cubic-bezier(.2,.8,.2,1)}
.cc-toast .ic{width:18px;height:18px;color:var(--ok,#3c9)}.cc-toast.bad .ic{color:var(--bad,#e55)}
.cc-toast.out{opacity:0;transform:translateY(8px);transition:.25s}
.cc-toast button{background:none;border:0;color:var(--tipacc,var(--acc));font-weight:700;padding:0 0 0 6px}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* modal and drawer */
.cc-back{position:fixed;inset:0;z-index:900;background:var(--scrim,rgba(8,10,14,.5));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cc-back.cc-on{opacity:1}.cc-back.cc-out{opacity:0;pointer-events:none}
.cc-modal{background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:var(--rm,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:none}
.cc-on .cc-modal{transform:none}
.cc-small{width:min(420px,100%)}
.cc-drawer-back{place-items:stretch end;padding:0}
.cc-drawer{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rm,16px) 0 0 var(--rm,16px);transform:translateX(100%)}
.cc-mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:2}
.cc-mhead h2{margin:0;font-size:18px;line-height:1.25}
.cc-x{background:none;border:0;padding:6px;border-radius:10px;display:grid;color:var(--mut)}
.cc-x:hover{background:var(--hover)}
.cc-mbody{padding:8px 20px 20px}
.cc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cc-confirm{margin:4px 0 0;color:var(--mut)}
.cc-hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cc-field.full{grid-column:1/-1}
.cc-field label{font-size:12px;font-weight:600;color:var(--mut)}
.cc-field input,.cc-field select,.cc-field textarea{border:1px solid var(--line);background:var(--inp,transparent);border-radius:var(--ri,10px);padding:9px 11px;min-width:0;width:100%}
.cc-field select option{background:var(--card-solid,#fff);color:var(--fg)}
.cc-field [aria-invalid=true]{border-color:var(--bad,#e55)}
.cc-err{color:var(--bad,#e55);font-size:12px}
.cc-err:empty{display:none}
.cc-shake{animation:ccShake .38s}
@keyframes ccShake{25%{translate:-7px 0}75%{translate:7px 0}}
@media (max-width:520px){.cc-fields{grid-template-columns:1fr}.cc-drawer{border-radius:0}}
/* table */
.cc-ttools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cc-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:1 1 180px;max-width:320px;color:var(--mut);background:var(--inp,transparent)}
.cc-search .ic{width:16px;height:16px}
.cc-search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--fg)}
.cc-search:focus-within{outline:2px solid var(--focus,var(--acc));outline-offset:1px}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap}
.cc-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);transition:background .2s,color .2s,border-color .2s}
.cc-chip:hover{color:var(--fg)}
.cc-chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.cc-twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.cc-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cc-table th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.cc-table th button:focus-visible{outline:2px solid var(--focus,var(--acc))}
.cc-sort::after{content:"\2195";opacity:.35;font-style:normal}
[aria-sort=ascending] .cc-sort::after{content:"\2191";opacity:1}
[aria-sort=descending] .cc-sort::after{content:"\2193";opacity:1}
.cc-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table .num{text-align:right;font-variant-numeric:tabular-nums}
.cc-table th.num button{flex-direction:row-reverse}
.cc-click{cursor:pointer;transition:background .15s}.cc-click:hover{background:var(--hover)}
.cc-pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.cc-pager div{display:flex;gap:6px}
/* popovers, menus, bell */
.cc-pop{position:fixed;z-index:950;background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);min-width:220px;max-width:min(340px,calc(100vw - 16px));opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.cc-pop.cc-on{opacity:1;transform:none}
.cc-menu{display:flex;flex-direction:column;padding:6px;max-height:60vh;overflow:auto}
.cc-menu-t{font-size:12px;color:var(--mut);padding:6px 10px}
.cc-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}
.cc-menu button:hover,.cc-menu button:focus{background:var(--hover)}
.cc-bell{width:320px;max-width:100%}
.cc-bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cc-bell ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.cc-bell li button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px;border-radius:10px;font-size:13px;align-items:flex-start}
.cc-bell li button:hover{background:var(--hover)}
.cc-bell li.unread button{font-weight:600}
.cc-bell li.unread button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin:6px 0 0 auto;flex:none}
.cc-bell small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.cc-link{background:none;border:0;color:var(--acc);font-size:12px;font-weight:600;padding:2px}
.cc-clear{display:block;margin:0 auto 10px}
.cc-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad,#e5484d);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes ccPop{from{transform:scale(0)}}
/* range switch */
.cc-seg{position:relative;display:inline-flex;background:var(--seg,var(--hover));border-radius:999px;padding:3px;flex:none}
.cc-seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut);border-radius:999px;transition:color .2s}
.cc-seg button[aria-pressed=true]{color:var(--segfg,var(--fg))}
.cc-seg-ind{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:999px;background:var(--segind,var(--card-solid,#fff));box-shadow:0 1px 5px rgba(0,0,0,.16);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s}
/* drag and drop */
.cc-ghost{opacity:.94;box-shadow:0 22px 44px rgba(0,0,0,.32)!important;animation:none!important;transition:none!important}
.cc-dragging{opacity:.35}
.cc-over{outline:2px dashed var(--acc)!important;outline-offset:-3px}
.cc-dragmode,.cc-dragmode *{cursor:grabbing!important;user-select:none}
/* command search */
.cc-cmdk{width:min(560px,100%);align-self:start;margin-top:10vh}
.cc-cmdk-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--inp,transparent);outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0}
.cc-cmdk-list button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.cc-cmdk-list [aria-selected=true] button{background:var(--hover);color:var(--acc)}
.cc-hidden *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.cc-draw{stroke-dashoffset:0}}
/* ===== Smart-home kit: drawn rooms, cameras, thermostat dial (colours from variables) ===== */
.room-art{display:block;width:100%;height:100%}
.ra-wall{fill:var(--ra-wall,#e9e1d6)}.ra-floor{fill:var(--ra-floor,#c9a985)}.ra-board{stroke:var(--ra-board,rgba(0,0,0,.08));stroke-width:2;fill:none}.ra-skirt{fill:var(--ra-skirt,#fff)}
.ra-sky{fill:var(--ra-sky,#a9cbe6);transition:fill .8s}.ra-frame{stroke:var(--ra-frame,#fff);stroke-width:6;fill:none}
.ra-curtain{fill:var(--ra-curtain,#d9c7b0)}.ra-art{fill:var(--ra-art,#f4efe6)}.ra-acc{fill:var(--ra-acc,#d98a5b)}
.ra-tv{fill:#16181c;transition:fill .6s}.ra-tv.on{fill:var(--ra-screen,#5d86b5)}
.ra-wood{fill:var(--ra-wood,#9b6f4a);stroke:var(--ra-wood,#9b6f4a)}.ra-rug{fill:var(--ra-rug,#cdb89c)}.ra-fab{fill:var(--ra-fab,#7d8f9b)}.ra-fab2{fill:var(--ra-fab2,#93a5b0)}
.ra-metal{stroke:var(--ra-metal,#3c3c3c);stroke-width:5;fill:none;stroke-linecap:round}.ra-metal2{fill:var(--ra-metal,#3c3c3c)}.ra-dark{fill:#222}
.ra-shade{fill:var(--ra-shade,#f3e5c8)}.ra-tile{fill:var(--ra-tile,#dfe6e3)}
.ra-pot{fill:var(--ra-pot,#b8643f)}.ra-leaf{stroke:var(--ra-leaf,#4f7d45);stroke-width:10;fill:none;stroke-linecap:round}
.ra-glow{opacity:var(--glow,0);transition:opacity .7s}
.ra-dim{fill:#070a12;opacity:calc((1 - var(--glow,0)) * var(--dim,.42));transition:opacity .7s;pointer-events:none}
/* cameras */
.cam{position:relative;overflow:hidden;aspect-ratio:16/9;background:#1b1d22;isolation:isolate;border-radius:inherit}
.cam-art,.cam-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cam-art{transition:filter .5s;filter:var(--camf,none)}
.cam.night .cam-art{filter:grayscale(1) brightness(1.2) contrast(1.3) sepia(.6) hue-rotate(55deg)}
.cam.paused .cam-art{filter:grayscale(1) blur(2px) brightness(.55)}
.cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
.cam-ov{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff;z-index:2}
.cam-rec,.cam-t{background:rgba(0,0,0,.42);padding:2px 7px;border-radius:5px;display:flex;align-items:center;gap:5px}
.cam-rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff4d4d;animation:camBlink 1.4s steps(2) infinite}
.paused .cam-rec::before{background:#aaa;animation:none}
.cam-n{position:absolute;left:10px;bottom:8px;z-index:2;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.cam-flash.go{animation:camFlash .55s ease-out}
@keyframes camFlash{0%{opacity:.95}100%{opacity:0}}
@keyframes camBlink{50%{opacity:0}}
.ca-car{animation:caDrive 14s linear infinite}
@keyframes caDrive{0%{transform:translateX(-120px)}55%,100%{transform:translateX(420px)}}
.ca-cat{animation:caWalk 17s linear infinite}
@keyframes caWalk{0%{transform:translateX(-40px)}60%,100%{transform:translateX(370px)}}
.ca-sway{animation:caSway 5s ease-in-out infinite alternate}
@keyframes caSway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.ca-swing{animation:caSwing 3.2s ease-in-out infinite alternate}
@keyframes caSwing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ca-spin{animation:caMob 6s ease-in-out infinite alternate}
@keyframes caMob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.ca-blink{animation:caGlow 3s ease-in-out infinite alternate}
@keyframes caGlow{from{opacity:.35}to{opacity:1}}
.ca-flick{animation:caFlick 7s steps(1) infinite}
@keyframes caFlick{0%,92%,96%{opacity:1}94%,98%{opacity:.3}}
.cam-modal{width:min(780px,100%)}
.camv .cam{border-radius:12px}
.camv-ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.camv-ctl [aria-pressed=true]{background:var(--acc);color:var(--onacc,#fff);border-color:var(--acc)}
.camv-h{font-size:14px;margin:10px 0 8px}
.camv-ev{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.camv-ev li{display:flex;gap:12px}.camv-ev time{color:var(--mut);font-variant-numeric:tabular-nums}
/* thermostat dial */
.dial{position:relative;display:inline-block;touch-action:none;border-radius:50%;outline-offset:4px;max-width:100%}
.dial svg{display:block;max-width:100%;height:auto;cursor:grab;overflow:visible}
.dial.drag svg{cursor:grabbing}
.dl-tick{stroke:var(--mut);stroke-width:1.4;opacity:.45}.dl-tick.maj{stroke-width:2.4;opacity:.85}
.dl-track{fill:none;stroke:var(--track,var(--line));stroke-width:var(--dlw,14px);stroke-linecap:round}
.dl-val{fill:none;stroke-width:var(--dlw,14px);stroke-linecap:round}
.dl-knob{fill:var(--knob,#fff);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));transition:r .15s}
.dial.drag .dl-knob{r:15px}
.dl-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dl-v{font-size:46px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dl-l{display:block;font-size:12px;color:var(--mut);margin-top:6px}
/* ===== Solenne look: milky glass by day, smoked glass by night, under a living sky ===== */
:root{--fg:#1f2433;--mut:#5c6378;--line:rgba(255,255,255,.7);--grid:rgba(30,40,70,.08);--hover:rgba(255,255,255,.5);--track:rgba(30,40,70,.12);
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.55);--card-solid:#fff;--modal:rgba(255,255,255,.92);--inp:rgba(255,255,255,.75);--bg:#cfe6f7;
--acc:#e8823a;--onacc:#fff;--sky:#2f7ec9;--c1:#e8823a;--c2:#2f7ec9;--c3:#f2c14e;--c4:#4fa77a;--c5:#8a8fb0;--ok:#3f9a6b;--bad:#e0483e;--dial1:#9fd0ff;--dial2:#e8823a;
--tipbg:#1f2433;--tipfg:#fff;--tipacc:#f2b48a;--rm:26px;--ri:14px;--enter:snIn;--knob:#fff}
[data-theme=dark]{--fg:#eef0fa;--mut:#a3a8c4;--line:rgba(255,255,255,.12);--grid:rgba(255,255,255,.07);--hover:rgba(255,255,255,.08);--track:rgba(255,255,255,.14);

body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* the sky behind everything */
.skybg{position:fixed;inset:0;z-index:0}
.skybg svg{width:100%;height:100%;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--line);box-shadow:0 18px 50px -26px rgba(20,30,60,.5),inset 0 1px 0 rgba(255,255,255,.5)}

.cap{position:sticky;top:18px;height:calc(100vh - 36px);border-radius:40px;display:flex;flex-direction:column;align-items:stretch;padding:18px 12px;gap:16px}

.nav-marker{position:absolute;left:0;top:0;border-radius:999px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#ff5e8a));box-shadow:0 10px 24px -10px var(--acc);transition:transform .5s cubic-bezier(.3,1.3,.4,1),height .3s}
.cap-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.dn{position:relative;width:74px;height:38px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg,#8ec5f2,#fbd3b0);overflow:hidden;transition:background .6s}

.dn i{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#ffd36a;box-shadow:0 0 14px #ffd36a;transition:transform .6s cubic-bezier(.3,1.3,.4,1),background .6s,box-shadow .6s}
[data-theme=dark] .dn i{transform:translateX(36px);background:#eef0fa;box-shadow:inset -8px -3px 0 #c9cde6,0 0 12px rgba(255,255,255,.5)}
.main{min-width:0;overflow-x:clip}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top .greet b{display:block;font-size:24px;letter-spacing:-.03em}.top .greet small{color:var(--mut)}
.top .sp{flex:1}
.ib{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--fg);transition:transform .15s}
.ib:active{transform:scale(.9)}
.menu{display:none}
.g{display:grid;gap:16px}
.card{border-radius:26px;padding:20px;min-width:0;position:relative;transition:translate .3s}
.card:hover{translate:0 -3px}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;font-size:14px;font-weight:800}
.h small{color:var(--mut);font-weight:600}
.h a{color:var(--acc);text-decoration:none;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;color:var(--fg);transition:transform .12s,background .2s}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.95)}
.btn.primary{background:var(--acc);border-color:transparent;color:var(--onacc)}
.btn.ghost{background:transparent}.btn.sm{padding:6px 12px;font-size:12px}.btn .ic{width:17px;height:17px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:34px;letter-spacing:-.04em}.ph p{margin:4px 0 0;color:var(--mut)}
/* today: the day scrubber over the house */
.hero{padding:0;overflow:hidden;border-radius:30px}
.hero .scene{position:relative;height:330px}
.hero .scene svg{position:absolute;inset:0;width:100%;height:100%}
.hero .over{position:absolute;left:22px;top:18px;right:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35);pointer-events:none}
.hero .over b{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.hero .over small{display:block;font-weight:700;opacity:.9}
.hero .ctl{display:flex;align-items:center;gap:12px;padding:14px 18px}
.scrub{-webkit-appearance:none;appearance:none;flex:1;height:14px;border-radius:9px;background:linear-gradient(90deg,#1b2447,#4a3d6b 20%,#f2a7a0 27%,#8ec5f2 38%,#5fb0f0 54%,#f08a5d 71%,#3b3a7a 78%,#121a3d);outline-offset:4px}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scrub::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
.fires{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px;min-height:34px}
.fire{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;background:var(--acc);color:var(--onacc);font-size:12px;font-weight:800;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.house .win{transition:fill .5s,filter .5s}
.house .win.lit{fill:#ffd27a;filter:drop-shadow(0 0 6px #ffb84a)}
.todayg{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stat{display:flex;align-items:center;gap:12px}
.stat .si{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--onacc);flex:none}
.stat b{display:block;font-size:24px;letter-spacing:-.03em}.stat small{color:var(--mut)}
.mini{display:grid;gap:12px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.list li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;transition:background .2s}
.list li:hover{background:var(--hover)}
.list .grow{flex:1;min-width:0}.list small{display:block;color:var(--mut);font-size:12px}
.list .di{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--hover);flex:none;transition:.3s}
.list li.on .di{background:var(--acc);color:var(--onacc)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--track);border:0;position:relative;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{transform:translateX(20px)}
input[type=range].r{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--acc) calc(var(--lv,.5) * 100%),var(--track) 0)}
input[type=range].r::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
input[type=range].r::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.rooms{grid-template-columns:repeat(3,minmax(0,1fr))}
/* routine timeline */
.tl{position:relative;overflow-x:auto;padding-bottom:6px}
.tl-in{position:relative;min-width:760px}
.tl-hours{display:flex;margin-left:150px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.tl-hours span{flex:1}
.lane{display:flex;align-items:center;height:56px;border-top:1px solid var(--line)}
.lane-n{width:150px;flex:none;padding-right:10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.lane-t{position:relative;flex:1;height:100%;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 24 - 1px),var(--grid) calc(100% / 24 - 1px) calc(100% / 24))}
.blkr{position:absolute;top:10px;height:36px;border-radius:12px;border:0;color:#fff;font-size:12px;font-weight:800;padding:0 10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 8px 18px -10px var(--b2);transition:box-shadow .2s,opacity .3s}
.blkr.off{opacity:.4;filter:grayscale(.6)}
.blkr.drag{cursor:grabbing;box-shadow:0 16px 28px -10px rgba(0,0,0,.5);z-index:3;transition:none}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);pointer-events:none;z-index:2}
.nowline::before{content:"now";position:absolute;top:-16px;left:-12px;font-size:10px;font-weight:800;color:var(--acc)}
/* forecast */
.fc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center}
.fc div{padding:10px 4px;border-radius:18px;background:var(--glass2)}
.fc svg{width:36px;height:36px;display:block;margin:6px auto}
.fc b{display:block}.fc small{color:var(--mut)}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--hover)}
.badge.on{background:var(--acc);color:var(--onacc)}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:1/-1}
.ra{display:flex;gap:2px}.ra button{border:0;background:none;padding:6px;border-radius:50%;color:var(--mut);display:grid}.ra button:hover{background:var(--hover);color:var(--fg)}.ra .ic{width:16px;height:16px}
.cams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.camb{border:0;padding:0;background:none;border-radius:18px;overflow:hidden;display:block;width:100%}
.scrim{display:none}
@media (max-width:1150px){.app{grid-template-columns:84px minmax(0,1fr)}.nav a span,.logo span{display:none}.nav a{justify-content:center;padding:12px}.todayg{grid-template-columns:1fr}.rooms,.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:1fr;padding:12px}
 .cap{position:fixed;left:12px;top:12px;bottom:12px;height:auto;width:220px;z-index:40;transform:translateX(-120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
 .nav-open .cap{transform:none}.nav-open .cap .nav a span,.nav-open .cap .logo span{display:inline}.nav-open .cap .nav a{justify-content:flex-start}
 .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}.nav-open .scrim{opacity:1;pointer-events:auto}
 .menu{display:grid}.rooms,.c2,.c3{grid-template-columns:1fr}.hero .scene{height:250px}.hero .over b{font-size:40px}.fc{grid-template-columns:repeat(4,minmax(0,1fr))}.top .greet b{font-size:19px}.cams{grid-template-columns:1fr}}

/* ===== Page: Climate ===== */
let ZONE = 'living';
const wxIcon = (k) => ({ sun: '<circle cx="18" cy="18" r="8" fill="#ffc94a"/><path d="M18 3v5M18 28v5M3 18h5M28 18h5M7 7l3 3M26 26l3 3M7 29l3-3M26 10l3-3" stroke="#ffc94a" stroke-width="2.5" stroke-linecap="round"/>', cloud: '<circle cx="14" cy="16" r="7" fill="#ffc94a"/><path d="M10 28h16a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0-1 10z" fill="#dfe6f0" stroke="#9aa7bb"/>', rain: '<path d="M8 22h18a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0-3 10z" fill="#cfd8e6" stroke="#8a97ab"/><path d="M12 26l-2 5M18 26l-2 5M24 26l-2 5" stroke="#5fb0f0" stroke-width="2.5" stroke-linecap="round"/>', dust: '<circle cx="18" cy="16" r="8" fill="#f0c27a" opacity=".8"/><path d="M5 26h26M9 31h20" stroke="#c9a56c" stroke-width="2.5" stroke-linecap="round"/>' })[k];
page('climate', 'Climate', (v) => {
  const acs = H.devs.filter((d) => d.type === 'ac'), ac = acs.find((d) => d.room === ZONE) || acs[0], r = roomOf(ac);
  seed(77);
  const fc = [...Array(7)].map((_, i) => { const k = pick(['sun', 'sun', 'sun', 'cloud', 'dust', 'rain']); return { d: addDays(TODAY, i), k, hi: ri(27, 33) - (k === 'rain' ? 4 : 0), lo: ri(15, 19) }; });
  v.innerHTML = ph('Climate', 'Cooling by room, and the week outside.') + `<div class="g c3">
    <section class="card glass"><h2 class="h">${esc(r.name)}<span class="badge ${ac.on ? 'on' : ''}" data-dev="${ac.id}" data-show="state">${devState(ac)}</span></h2><div id="dial" style="display:grid;place-items:center"></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px"><button class="btn sm" type="button" data-dev="${ac.id}" data-act="toggle" aria-pressed="${ac.on}">${I('power')}Power</button><button class="btn sm" type="button" data-dev="${ac.id}" data-act="mode">${I('snow')}Mode</button></div></section>
    <section class="card glass"><h2 class="h">Rooms</h2><ul class="list">${acs.map((d) => `<li class="${d.room === ZONE ? 'on' : ''}"><span class="di">${I(roomOf(d).icon)}</span><span class="grow"><b>${esc(roomOf(d).name)}</b><small data-dev="${d.id}" data-show="state">${devState(d)}</small></span><b>${fmt(roomOf(d).temp, 1)}°</b><button class="btn sm" type="button" data-z="${d.room}" aria-pressed="${d.room === ZONE}">Set</button></li>`).join('')}</ul></section>
    <section class="card glass"><h2 class="h">Today outside</h2><div id="ot"></div></section>
    <section class="card glass full"><h2 class="h">Next seven days<small>Peshawar</small></h2><div class="fc">${fc.map((x) => `<div><b>${DAY[x.d.getDay()]}</b><svg viewBox="0 0 36 36" aria-hidden="true">${wxIcon(x.k)}</svg><b>${x.hi}°</b><small>${x.lo}°</small></div>`).join('')}</div></section></div>`;
  dial($('#dial'), { value: ac.set, min: 16, max: 30, size: 220, label: `${r.name} temperature`, sub: 'Target', onInput: (x) => setDev(ac, { set: x, on: true }, { quiet: true }), onChange: (x) => toast(`${r.name}: ${x}°`, { icon: 'snow' }) });
  const hrs = [...Array(24)].map((_, h) => hhmm(h));
  lineChart($('#ot'), { labels: hrs, series: [{ name: 'Outside', data: hrs.map((_, h) => +outTemp(h).toFixed(1)), color: 'var(--c1)' }, { name: 'Inside', data: hrs.map((_, h) => +(r.temp - 0.6 + Math.sin(((h - 15) / 24) * Math.PI * 2) * 0.8).toFixed(1)), color: 'var(--c2)' }], h: 200, fmt: (x) => fmt(x) + '°', tfmt: (x) => fmt(x, 1) + '°C', title: 'Temperature today' });
  onDev(v, (d) => { if (d === ac && $('#dial')._set) $('#dial')._set(d.set); });
  v.addEventListener('click', (e) => { const z = e.target.closest('[data-z]'); if (z) { ZONE = z.dataset.z; rerender(); } });
}, 'thermo');

/* ===== Page: Energy (solar and battery) ===== */
page('energy', 'Energy', (v) => {
  const use = EN.hours.map((x) => +(x * 1.3).toFixed(2)), made = sum(SOLAR), used = sum(use), self = sum(use.map((u, i) => Math.min(u, SOLAR[i]))), saved = self * H.tariff;
  let rg = 'Today';
  v.innerHTML = ph('Energy', 'Sun on the roof, power in the house, charge in the battery.') + `<div class="g c3">
    <section class="card glass"><div class="stat"><span class="si">${I('sun')}</span><div><b data-count="${made}" data-f="k">0</b><small>made by the panels today</small></div></div></section>
    <section class="card glass"><div class="stat"><span class="si">${I('home')}</span><div><b data-count="${used}" data-f="k">0</b><small>used by the house today</small></div></div></section>
    <section class="card glass"><div class="stat"><span class="si">${I('wallet')}</span><div><b data-count="${saved}" data-f="rs">0</b><small>saved by using your own sun</small></div></div></section>
    <section class="card glass" style="grid-column:span 2"><h2 class="h">Sun and use<span id="rg"></span></h2><div id="su"></div></section>
    <section class="card glass"><h2 class="h">Battery</h2><div id="bat"></div><div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="bk">${I('battery')}Keep for night</button><button class="btn sm" type="button" id="bs">${I('bolt')}Use now</button></div><p style="text-align:center;color:var(--mut);font-size:13px;margin:10px 0 0" id="bmode">Mode: balanced</p></section>
    <section class="card glass full"><h2 class="h">Twelve months<small>units from the grid</small></h2><div id="ym"></div></section></div>`;
  const draw = (morph) => { const d = rg === 'Today' ? { l: [...Array(24)].map((_, h) => hhmm(h)), s: SOLAR, u: use } : { l: daysBack(7), s: [...Array(7)].map((_, i) => +(made * (0.8 + ((i * 37) % 10) / 25)).toFixed(1)), u: [...Array(7)].map((_, i) => +(used * (0.85 + ((i * 53) % 10) / 30)).toFixed(1)) }; lineChart($('#su'), { labels: d.l, series: [{ name: 'Solar made', data: d.s, color: 'var(--c3)' }, { name: 'House used', data: d.u, color: 'var(--c2)' }], areaAll: true, h: 230, morph, fmt: (x) => fmt(x, x < 10 && x % 1 ? 1 : 0), tfmt: (x) => fmt(x, 2) + ' kWh', title: 'Solar and house use' }); };
  seg($('#rg'), ['Today', 'Week'], rg, (x) => { rg = x; draw(true); });
  draw(false);
  gauge($('#bat'), { value: BATT, max: 100, label: 'charged', fmt: (x) => Math.round(x) + '%', size: 170, color: 'var(--c4)' });
  $('#bk').addEventListener('click', () => { $('#bmode').textContent = 'Mode: keep for night (load-shedding ready)'; toast('Battery will hold its charge for the evening', { icon: 'battery' }); });
  $('#bs').addEventListener('click', () => { $('#bmode').textContent = 'Mode: use now'; BATT = Math.max(10, BATT - 8); gauge($('#bat'), { value: BATT, max: 100, label: 'charged', fmt: (x) => Math.round(x) + '%', size: 170, color: 'var(--c4)' }); toast('Running the house from the battery', { icon: 'bolt' }); });
  barChart($('#ym'), { labels: monthsBack(12), series: [{ name: 'From the grid', data: EN.months.map((x) => Math.round(x * 0.55)), color: 'var(--c2)' }, { name: 'From the sun', data: EN.months.map((x, i) => Math.round(x * 0.45 * (0.7 + ((i * 7) % 5) / 10))), color: 'var(--c3)' }], stacked: true, h: 220, tfmt: (x) => fmt(x) + ' kWh', title: 'Monthly energy by source' });
}, 'bolt');

/* ===== Page: Security ===== */
page('security', 'Security', (v) => {
  const locks = H.devs.filter((d) => d.type === 'lock'), cams = H.devs.filter((d) => d.type === 'cam');
  v.innerHTML = ph('Security', 'Locks and cameras, with night lock at 23:00.', `<button class="btn primary" type="button" id="la">${I('lock')}Lock all</button>`) + `<div class="g c2"><section class="card glass"><h2 class="h">Locks</h2><ul class="list">${locks.map((d) => `<li class="${d.locked ? 'on' : ''}" data-dev="${d.id}"><span class="di" data-dev="${d.id}" data-show="icon">${devIcon(d)}</span><span class="grow"><b>${esc(d.name)}</b><small><span data-dev="${d.id}" data-show="state">${devState(d)}</span> · battery ${d.battery}%</small></span><button class="sw" type="button" role="switch" aria-checked="${d.locked}" data-dev="${d.id}" data-act="toggle" aria-label="${esc(d.name)} locked"></button></li>`).join('')}</ul></section>
  <section class="card glass"><h2 class="h">Night watch</h2><ul class="list">${[['Lock up at 23:00', true], ['Courtyard lights on motion', true], ['Alert if the gate opens at night', true], ['Pause cameras when we are home', false]].map(([n, on], i) => `<li><span class="grow"><b>${n}</b></span><button class="sw" type="button" role="switch" aria-checked="${on}" data-nw="${i}" aria-label="${n}"></button></li>`).join('')}</ul></section>
  <section class="card glass full"><h2 class="h">Cameras</h2><div class="cams">${cams.map((d) => `<button class="camb" type="button" data-dev="${d.id}" data-act="view" aria-label="Open ${esc(d.name)}">${camBox(d)}</button>`).join('')}</div></section></div>`;
  every(1000, camTick);
  $('#la').addEventListener('click', () => { locks.forEach((d) => setDev(d, { locked: true }, { quiet: true })); toast('Gate and door locked', { icon: 'lock' }); });
  v.addEventListener('click', (e) => { const s = e.target.closest('[data-nw]'); if (s) { const on = s.getAttribute('aria-checked') !== 'true'; s.setAttribute('aria-checked', String(on)); toast(`${s.getAttribute('aria-label')}: ${on ? 'on' : 'off'}`, { icon: 'shield' }); } });
}, 'shield');

/* ===== Page: Settings ===== */
page('settings', 'Settings', (v) => {
  v.innerHTML = ph('Settings', 'Day, night and the house.') + `<div class="g c2"><section class="card glass"><h2 class="h">Day and night</h2><ul class="list"><li><span class="grow"><b>Theme</b><small>Milky day glass or smoked night glass</small></span><span id="th"></span></li><li><span class="grow"><b>Follow the sun</b><small>Switch to night after sunset (${hhmm(SET)})</small></span><button class="sw" type="button" role="switch" aria-checked="${!!store.get(App.key + ':sun')}" id="fs" aria-label="Follow the sun"></button></li></ul></section>
  <section class="card glass"><h2 class="h">House</h2><form id="hf" novalidate>${fields([{ name: 'n', label: 'Family name', value: 'Durranis', full: true }, { name: 'tariff', label: 'Tariff (Rs a unit)', type: 'number', value: H.tariff }, { name: 'batt', label: 'Battery size (kWh)', type: 'number', value: 10 }])}<div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn danger" type="button" id="reset">${I('refresh')}Reset demo data</button><button class="btn primary" type="submit">Save</button></div></form></section></div>`;
  seg($('#th'), [['light', 'Day'], ['dark', 'Night']], document.documentElement.dataset.theme, (t) => setTheme(t));
  $('#fs').addEventListener('click', (e) => { const on = e.currentTarget.getAttribute('aria-checked') !== 'true'; e.currentTarget.setAttribute('aria-checked', String(on)); store.set(App.key + ':sun', on); if (on) followSun(); toast(on ? 'Solenne will follow the sun' : 'Theme stays as you set it'); });
  $('#hf').addEventListener('submit', (e) => { e.preventDefault(); const d = check(e.target, { n: need('Family name'), tariff: numIn('Tariff', 1, 500), batt: numIn('Battery size', 1, 100) }); if (!d) return; H.tariff = +d.tariff; $('#greet').textContent = `${greetW()}, ${d.n.trim()}`; toast('Saved'); });
  $('#reset').addEventListener('click', async () => { if (await confirmBox('Reset demo data?', 'Devices and routines go back to the sample home.', 'Reset')) { store.del(App.key + ':sun'); location.hash = '#/today'; location.reload(); } });
}, 'sliders');

/* ===== Start ===== */
const greetW = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 21 ? 'Good evening' : 'Good night'; };
function followSun() { const h = new Date().getHours() + new Date().getMinutes() / 60, want = isNight(h) ? 'dark' : 'light'; if (document.documentElement.dataset.theme !== want) setTheme(want); }
/* switching theme sweeps the sky to noon or to night */
App.onTheme = (t) => { $('#dnT').textContent = t === 'dark' ? 'Night' : 'Day'; const from = T, to = t === 'dark' ? 21.5 : 12.5; if (App.cur === 'today' && $('#scrub')) { cancelAnimationFrame(playRaf); let last = -1; tween(1200, (p) => { const q = Math.round((from + (to - from) * p) * 4) / 4; if (q !== last) { last = q; setT(q, false); } }); } else skyBg(to); if (App.cur === 'settings') rerender(); };
App.onRoute.push((id) => { cancelAnimationFrame(playRaf); if (id !== 'today') skyBg(document.documentElement.dataset.theme === 'dark' ? 21.5 : 12.5); $$('[data-count]').forEach((el) => countUp(el, +el.dataset.count, el.dataset.f === 'k' ? (x) => fmt(x, 1) + ' kWh' : el.dataset.f === 'rs' ? rs : fmt)); });
$('[data-nav]').insertAdjacentHTML('beforeend', App.order.map((id) => `<a href="#/${id}" aria-label="${App.pages[id].label}">${I(App.pages[id].icon)}<span>${App.pages[id].label}</span></a>`).join(''));
$$('[data-i]').forEach((e) => e.insertAdjacentHTML('afterbegin', I(e.dataset.i)));
const sub = () => { const d = new Date(); $('#sub').textContent = `${DAY[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} · ${d.toTimeString().slice(0, 5)} · Peshawar`; };
sub(); every(30000, sub, false);
$('#greet').textContent = greetW() + ', Durranis';
if (store.get('cc-solenne:sun')) { App.key = 'cc-solenne'; followSun(); }
notify('Solar made 21 kWh yesterday, a new best', 'sun', 600);
notify('Night lock ran at 23:00', 'lock', 720);
boot({ name: 'Solenne', key: 'solenne', cmds: [{ label: 'Play the day', run: () => { go('today'); setTimeout(() => $('#playD') && $('#playD').click(), 80); } }, { label: 'New routine', run: () => routineForm() }, ...ROUT.map((r) => ({ label: 'Run routine: ' + r.name, run: () => runScene({ name: r.name, icon: r.icon, steps: r.steps }) }))] });
$('#dnT').textContent = document.documentElement.dataset.theme === 'dark' ? 'Night' : 'Day';
</script>
</body>
</html>
