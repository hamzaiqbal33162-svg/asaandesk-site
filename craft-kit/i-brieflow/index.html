<html lang="en">
<head>

<title>Brieflow · Meeting notes that turn into work</title>
<meta name="description" content="A product site for a meeting-notes tool: a live transcript demo that lifts tasks, features, integrations, security, pricing, stories and sign-up.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : (mq && mq.matches) ? "dark" : "light"; }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Theme: mist paper with violet + mint (light) / deep ink with violet + mint light (dark) ---------- */
  :root {
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #f4f3fa; --bg-2: #ecebf6; --card: #ffffff; --card-2: #f8f7fd; --glass: rgba(255,255,255,.74);
    --line: rgba(24,18,60,.09); --line-2: rgba(24,18,60,.17);
    --ink: #15122b; --muted: #5d5976; --dim: #8b87a3;
    --violet: #6a52f2; --violet-2: #8f7bff; --violet-soft: #ece8ff;
    --mint: #0a9a70; --mint-2: #22c995; --mint-soft: #d9f6eb;
    --rose: #d93c70; --rose-soft: #fde4ec; --amber: #c27a10; --amber-soft: #fbefd9;
    --grid: rgba(24,18,60,.05);
    --shadow: 0 1px 2px rgba(20,16,50,.05), 0 14px 34px -16px rgba(30,20,80,.22);
    --shadow-lg: 0 40px 90px -40px rgba(50,30,140,.42);
    --r: 14px; --r-sm: 10px; --r-lg: 20px;
    --wrap: 1240px;
    color-scheme: light;
  }
  [data-theme="dark"], .ink {
    --bg: #08070f; --bg-2: #0e0d19; --card: #12111d; --card-2: #181727; --glass: rgba(18,17,32,.7);
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);
    --ink: #efedf8; --muted: #a29fb9; --dim: #6e6b88;
    --violet: #9d8cff; --violet-2: #bdb2ff; --violet-soft: rgba(157,140,255,.15);
    --mint: #5ef0c3; --mint-2: #a3f8dc; --mint-soft: rgba(94,240,195,.13);
    --rose: #ff7ea6; --rose-soft: rgba(255,126,166,.14); --amber: #ffc066; --amber-soft: rgba(255,192,102,.14);
    --grid: rgba(255,255,255,.04);
    --shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 44px -20px rgba(0,0,0,.75);
    --shadow-lg: 0 50px 110px -40px rgba(0,0,0,.85);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  html.snap { scroll-snap-type: y proximity; }
  body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); font: 400 13.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: var(--violet); color: #fff; }
  .wrap { width: min(var(--wrap), calc(100% - 80px)); margin: 0 auto; position: relative; }
  .stage { background: var(--bg); color: var(--ink); }
  .ink { color: var(--ink); }
  .muted { color: var(--muted); }
  .grad { background: linear-gradient(100deg, var(--violet-2) 0%, var(--violet) 38%, var(--mint) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ink .grad, [data-theme="dark"] .grad { background-image: linear-gradient(100deg, #c9bfff 0%, #9d8cff 40%, #5ef0c3 100%); }

  /* ---------- Type ---------- */
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--violet); }
  .eyebrow.m { color: var(--mint); }
  .display { font-size: clamp(42px, 5.1vw, 74px); line-height: .98; letter-spacing: -.045em; font-weight: 760; }
  .h2 { font-size: clamp(30px, 3.1vw, 44px); line-height: 1.04; letter-spacing: -.035em; font-weight: 740; }
  .h3 { font-size: 19px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }
  .ptitle { font-size: clamp(30px, 2.6vw, 38px); line-height: 1.05; letter-spacing: -.035em; font-weight: 750; }
  .lead { font-size: 15.5px; line-height: 1.6; color: var(--muted); }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Buttons, chips, fields ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 650; font-size: 13.5px; white-space: nowrap; transition: transform .15s, box-shadow .25s, background .2s, border-color .2s, filter .2s; }
  .btn:hover { border-color: var(--violet); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.pri { border: 0; color: #fff; background: linear-gradient(135deg, #8d76ff 0%, #6a50f5 55%, #5a3fe6 100%); box-shadow: 0 10px 28px -10px rgba(106,80,245,.75), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.pri:hover { filter: brightness(1.08); box-shadow: 0 14px 34px -10px rgba(106,80,245,.9), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn.mint { border: 0; color: #04261b; background: linear-gradient(135deg, #8ff7d4, #3fe0ad); box-shadow: 0 10px 26px -12px rgba(63,224,173,.8); }
  .btn.ghost { background: transparent; }
  .btn.lg { height: 48px; padding: 0 24px; border-radius: 14px; font-size: 14.5px; }
  .btn.sm { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--muted); transition: background .2s, color .2s; }
  .iconbtn:hover { background: var(--violet-soft); color: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--card); transition: all .2s; white-space: nowrap; }
  .chip:hover { color: var(--ink); border-color: var(--violet); }
  .chip[aria-pressed="true"], .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip .n { font-size: 11px; opacity: .65; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--violet-soft); color: var(--violet); white-space: nowrap; }
  .pill.m { background: var(--mint-soft); color: var(--mint); }
  .pill.r { background: var(--rose-soft); color: var(--rose); }
  .pill.a { background: var(--amber-soft); color: var(--amber); }
  .pill.g { background: var(--bg-2); color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .dot.live { background: var(--mint); box-shadow: 0 0 0 0 var(--mint); animation: ping 1.8s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(94,240,195,.6); } 80%, 100% { box-shadow: 0 0 0 8px rgba(94,240,195,0); } }
  .kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; border: 1px solid var(--line-2); font-size: 10.5px; font-weight: 700; color: var(--dim); font-family: var(--font); }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); position: relative; }
  .seg button { position: relative; z-index: 1; height: 30px; padding: 0 14px; border-radius: 9px; font-size: 12.5px; font-weight: 650; color: var(--muted); transition: color .2s; white-space: nowrap; }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .seg .mk { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: 9px; background: var(--card); box-shadow: var(--shadow); transition: left .3s cubic-bezier(.5,0,.2,1), width .3s cubic-bezier(.5,0,.2,1); }
  .switch { position: relative; width: 40px; height: 23px; border-radius: 99px; background: var(--line-2); transition: background .25s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.5,0,.2,1.4); }
  .switch[aria-checked="true"] { background: var(--mint-2); }
  .switch[aria-checked="true"]::after { transform: translateX(17px); }
  .field { display: grid; gap: 6px; }
  .field label, .lbl { font-size: 12px; font-weight: 650; color: var(--muted); }
  .input { width: 100%; height: 42px; padding: 0 13px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; font-size: 13.5px; }
  textarea.input { height: auto; padding: 11px 13px; resize: vertical; min-height: 96px; line-height: 1.5; }
  .input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
  .input[aria-invalid="true"] { border-color: var(--rose); box-shadow: 0 0 0 4px var(--rose-soft); }
  .err { font-size: 11.5px; color: var(--rose); min-height: 0; font-weight: 600; }
  .err:empty { display: none; }
  .av { --h: 250; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 10.5px; font-weight: 750; color: hsl(var(--h) 55% 24%); background: hsl(var(--h) 80% 86%); flex: none; letter-spacing: .02em; }
  .ink .av, [data-theme="dark"] .av { color: hsl(var(--h) 90% 88%); background: hsl(var(--h) 40% 26%); }
  .avs { display: flex; }
  .avs .av { border: 2px solid var(--card); margin-left: -8px; }
  .avs .av:first-child { margin-left: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
  .lift { transition: transform .3s cubic-bezier(.3,.7,.3,1), box-shadow .3s, border-color .3s; }
  .lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--line-2); }
  .link { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; color: var(--violet); }
  .link:hover .ic { transform: translateX(3px); }
  .link .ic { transition: transform .2s; }

  /* ---------- Header ---------- */
  .hdr { position: fixed; top: 14px; left: 0; right: 0; z-index: 60; pointer-events: none; transition: top .3s; }
  .hdr-in { pointer-events: auto; width: min(var(--wrap), calc(100% - 48px)); margin: 0 auto; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: 0 10px 30px -18px rgba(20,10,60,.35); color: var(--ink); transition: background .35s, border-color .35s; }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 780; font-size: 17px; letter-spacing: -.03em; margin-right: 14px; }
  .brand svg { width: 28px; height: 28px; }
  .nav { display: flex; gap: 2px; position: relative; }
  .nav a { position: relative; z-index: 1; height: 36px; display: inline-flex; align-items: center; padding: 0 13px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); transition: color .2s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--ink); }
  .nav .mk { position: absolute; top: 0; height: 36px; border-radius: 10px; background: var(--violet-soft); transition: left .35s cubic-bezier(.5,0,.2,1), width .35s cubic-bezier(.5,0,.2,1), opacity .2s; }
  .hdr-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .cmdk-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 11px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); font-size: 12.5px; }
  .cmdk-btn:hover { color: var(--ink); border-color: var(--line-2); }
  .signin { font-weight: 650; font-size: 13px; padding: 0 10px; color: var(--muted); }
  .signin:hover { color: var(--ink); }
  .menu-btn { display: none; }
  .drawer { position: fixed; inset: 0; z-index: 90; display: none; }
  .drawer.open { display: block; }
  .drawer .scrim { position: absolute; inset: 0; background: rgba(6,4,18,.5); backdrop-filter: blur(4px); animation: fade .25s both; }
  .drawer .sheet { position: absolute; top: 10px; left: 10px; right: 10px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 14px; box-shadow: var(--shadow-lg); animation: drop .3s cubic-bezier(.3,.8,.3,1) both; }
  .drawer .sheet a.d { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; border-radius: 12px; font-weight: 650; font-size: 16px; }
  .drawer .sheet a.d[aria-current="page"] { background: var(--violet-soft); color: var(--violet); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.98); } }

  /* ---------- Page transition + reveal ---------- */
  #view { min-height: 100vh; transition: opacity .11s ease, transform .11s ease; }
  #view.out { opacity: 0; transform: translateY(6px); }
  .rv { opacity: 0; transform: translateY(16px); transition: opacity .4s cubic-bezier(.2,.7,.2,1), transform .4s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0ms); }
  .rv.in { opacity: 1; transform: none; }
  .page { padding: 104px 0 72px; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  .ph .lead { max-width: 560px; margin-top: 10px; font-size: 14.5px; }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin-bottom: 10px; font-weight: 600; }
  .sk { position: relative; overflow: hidden; background: var(--bg-2); border-radius: var(--r-lg); }
  .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(157,140,255,.18), transparent); animation: shim .9s infinite; }
  @keyframes shim { to { transform: translateX(100%); } }

  /* ---------- Chapter rail (home) ---------- */
  .rail { position: fixed; left: 22px; top: 50%; transform: translateY(-50%); z-index: 40; display: none; flex-direction: column; align-items: center; gap: 10px; }
  body.r-home .rail { display: flex; }
  .rail .tc { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--dim); white-space: nowrap; transition: color .3s; }
  .rail .tc b { color: var(--mint); font-weight: 800; }
  .rail ol { display: flex; flex-direction: column; gap: 7px; position: relative; padding: 4px 0; }
  .rail ol::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
  .rail li button { position: relative; display: block; width: 14px; height: 14px; }
  .rail li button::before { content: ""; position: absolute; left: 4px; top: 6px; width: 6px; height: 2px; border-radius: 2px; background: var(--dim); transition: all .3s; }
  .rail li button:hover::before { background: var(--ink); width: 10px; left: 2px; }
  .rail li button[aria-current="true"]::before { left: 3px; top: 0; width: 8px; height: 14px; border-radius: 4px; background: var(--mint); box-shadow: 0 0 12px var(--mint); }
  .rail li button .tip { position: absolute; left: 22px; top: -3px; font-size: 11px; font-weight: 650; white-space: nowrap; padding: 2px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); opacity: 0; pointer-events: none; transform: translateX(-4px); transition: all .2s; color: var(--ink); }
  .rail li button:hover .tip, .rail li button:focus-visible .tip { opacity: 1; transform: none; }
  .rail.on-ink { --dim: #6e6b88; --line-2: rgba(255,255,255,.16); --ink: #efedf8; --card: #12111d; --line: rgba(255,255,255,.08); }

  /* ---------- Home: snap sections ---------- */
  .snap-s { min-height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; padding: 98px 0 54px; overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .gridbg { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%); }

  /* Hero */
  .hero { padding-top: 100px; }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7.2fr); gap: 46px; align-items: center; }
  .hero-l { position: relative; z-index: 2; }
  .hero .badge { display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 14px 0 6px; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(255,255,255,.04); font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 22px; }
  .hero .badge .pill { height: 22px; }
  .hero h1 { margin-bottom: 20px; }
  .hero h1 .ln { display: block; overflow: hidden; padding-bottom: .06em; }
  .hero h1 .ln:last-child { padding-bottom: .24em; margin-bottom: -.18em; }
  .hero h1 .ln > span { display: inline-block; transform: translateY(105%); animation: lineup .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 110ms + 60ms); }
  @keyframes lineup { to { transform: none; } }
  .hero h1 .under { position: relative; display: inline-block; }
  .hero h1 .under svg { position: absolute; left: -2%; bottom: -.12em; width: 104%; height: .32em; overflow: visible; }
  .hero h1 .under path { stroke: url(#bfLine); stroke-width: 5; fill: none; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.1s .75s cubic-bezier(.6,0,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hero .lead { max-width: 450px; margin-bottom: 26px; }
  .hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
  .playc { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--violet-soft); color: var(--violet-2); }
  .proof { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .proof .stars { color: #ffc95e; letter-spacing: 1px; font-size: 12px; }
  .proof b { color: var(--ink); }
  .proof .sep { width: 1px; height: 26px; background: var(--line-2); }
  .hero-meta { display: flex; gap: 18px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .hero-meta span { display: inline-flex; align-items: center; gap: 7px; }
  .hero-meta .ic { color: var(--mint); }
  .ribbon { position: absolute; inset: auto -10% -6% -10%; height: 70%; pointer-events: none; opacity: .9; }
  .ribbon path { fill: none; stroke-width: 1.1; stroke-dasharray: 3 9; animation: flow 6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -240; } }

  /* Demo window (signature) */
  .demo-wrap { position: relative; z-index: 2; }
  .demo-tabs { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .demo-tabs .tiny { color: var(--dim); font-weight: 600; letter-spacing: .02em; }
  .demo { position: relative; border-radius: 20px; background: linear-gradient(180deg, rgba(26,24,44,.92), rgba(14,13,26,.94)); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 50px 120px -40px rgba(80,50,220,.55), 0 0 0 1px rgba(157,140,255,.08), inset 0 1px 0 rgba(255,255,255,.07); overflow: hidden; animation: rise .9s .25s cubic-bezier(.2,.8,.2,1) both; }
  .demo::before { content: ""; position: absolute; inset: -1px; border-radius: 20px; padding: 1px; background: linear-gradient(140deg, rgba(157,140,255,.7), transparent 35%, transparent 65%, rgba(94,240,195,.6)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.97); } }
  .dm-top { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .rec { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--mint-soft); color: var(--mint); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
  .dm-title { min-width: 0; }

  .tcode { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

  /* Results */

  .ticker .cnt { height: 28px; padding: 0 12px; border-radius: 99px; background: var(--violet-soft); color: var(--violet-2); font-weight: 700; display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .marq { margin-top: 40px; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }

  .wm { display: inline-flex; align-items: center; gap: 8px; font-size: 19px; color: var(--dim); white-space: nowrap; transition: color .2s; }

  /* Steps */

  .kan .kc .av { width: 22px; height: 22px; font-size: 9px; margin-left: auto; }

  /* Bento */

  /* Photo section */

  .photo-s .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: 110px 0 60px; }

  /* Orbit */
  .orbit-s .wrap { display: grid; grid-template-columns: 1fr 1.05fr; gap: 40px; align-items: center; }
  .orbit { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; justify-self: center; container-type: inline-size; }
  .orbit .ring { position: absolute; border-radius: 50%; border: 1px dashed var(--line-2); inset: var(--in); animation: spin var(--t) linear infinite; }
  .orbit .ring .ap { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; transform: rotate(var(--a)) translate(var(--rad)) rotate(calc(-1 * var(--a))); }
  .orbit .ring .ap > span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 15px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); animation: spin var(--t) linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stories */
  .stories { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 16px; }

  .su-steps .dn i { background: var(--mint-2); border-color: var(--mint-2); color: #062a1e; }
  .su-steps em { width: 28px; height: 1px; background: var(--line-2); }
  .fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 2px; }
  .meter i { height: 4px; border-radius: 4px; background: var(--bg-2); transition: background .3s; }
  .uses { display: flex; flex-wrap: wrap; gap: 6px; }
  .ckrow { display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .ckrow input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--violet); }
  .su-r { position: relative; overflow: hidden; min-height: 520px; }
  .su-r img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .su-r .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,7,15,.2), rgba(8,7,15,.15) 30%, rgba(8,7,15,.88)); }
  .su-r .over { position: absolute; left: 26px; right: 26px; bottom: 26px; display: grid; gap: 12px; }
  .su-r .over blockquote { margin: 0; font-size: 21px; line-height: 1.3; font-weight: 650; letter-spacing: -.02em; color: #fff; }
  .su-r .mini { padding: 14px; border-radius: 16px; }
  .cal-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line-2); text-align: left; font-size: 12.5px; font-weight: 650; transition: all .2s; }
  .opt[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-soft); }

  /* ---------- Overlays ---------- */
  .ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: start center; padding-top: 12vh; background: rgba(6,4,18,.52); backdrop-filter: blur(6px); animation: fade .2s both; }
  .pal { width: min(600px, calc(100% - 24px)); border-radius: 18px; background: var(--card); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); overflow: hidden; animation: drop .25s cubic-bezier(.3,.8,.3,1) both; }
  .pal .srch { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; height: 54px; background: none; box-shadow: none; }
  .pal ul { max-height: 360px; overflow-y: auto; padding: 6px; }
  .pal li button { width: 100%; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 550; }
  .pal li button small { margin-left: auto; color: var(--dim); font-size: 11px; }
  .pal li button[aria-selected="true"] { background: var(--violet-soft); color: var(--ink); }
  .pal .ph2 { padding: 8px 12px 4px; font-size: 10.5px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .dlg { width: min(860px, calc(100% - 24px)); max-height: 82vh; overflow-y: auto; border-radius: 22px; background: var(--card); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: drop .3s cubic-bezier(.3,.8,.3,1) both; margin-top: -4vh; }
  .dlg .dh { position: relative; height: 230px; overflow: hidden; }
  .dlg .dh img { width: 100%; height: 100%; object-fit: cover; }
  .dlg .dh .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(8,7,15,.85)); }
  .dlg .dh .tt { position: absolute; left: 24px; bottom: 18px; right: 24px; color: #fff; }
  .dlg .x { position: absolute; top: 12px; right: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,8,22,.6); color: #fff; backdrop-filter: blur(6px); }
  .dlg .db { padding: 22px 24px 24px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; }
  .dlg .db h4 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); margin: 0 0 6px; }
  .dlg .db p { color: var(--muted); margin-bottom: 14px; font-size: 13px; }
  .toasts { position: fixed; z-index: 120; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 14px; background: #15122b; color: #fff; font-size: 13px; font-weight: 600; box-shadow: 0 20px 40px -14px rgba(0,0,0,.5); animation: tin .35s cubic-bezier(.3,1.3,.4,1) both; pointer-events: auto; }
  .toast .ic { color: #5ef0c3; }
  [data-theme="dark"] .toast { background: #efedf8; color: #15122b; }
  [data-theme="dark"] .toast .ic { color: #0a9a70; }
  .toast.out { animation: tout .25s both; }
  @keyframes tin { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @keyframes tout { to { opacity: 0; transform: translateY(8px); } }

  /* ---------- Responsive ---------- */
  @media (max-width: 1200px) {
    .nav a { padding: 0 10px; }
    .cmdk-btn .lbl-t { display: none; }
    .hero .wrap { gap: 32px; }
    .apps { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 1080px) {
    .nav, .signin, .cmdk-btn { display: none; }
    .menu-btn { display: inline-grid; }
    .hero .wrap, .photo-s .wrap, .orbit-s .wrap, .sec-hero .wrap, .ptop, .int-top, .ctrl, .faq-g, .feat, .fgrid, .fgrid.rev, .su { grid-template-columns: minmax(0, 1fr); }
    .snap-s { min-height: 0; }
    html.snap { scroll-snap-type: none; }
    .rail { display: none !important; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .steps, .stories, .sgrid { grid-template-columns: 1fr 1fr; }
    .bento { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
    .bt { min-height: 230px; }
    .plans { grid-template-columns: 1fr 1fr; }
    .sec-h { grid-template-columns: 1fr; }
    .sec-h .lead { justify-self: start; }
    .fcard { justify-self: start; }
    .fcard2 { display: none; }
    .foot-g { grid-template-columns: 1fr 1fr 1fr; }
    .side { position: static; }
    .su-r { min-height: 360px; }
    .wall { columns: 2; }
  }
  @media (max-width: 720px) {
    body { font-size: 13.5px; }
    .wrap { width: calc(100% - 32px); }
    .hdr { top: 8px; }
    .hdr-in { width: calc(100% - 16px); height: 54px; }
    .hdr-r .btn.pri { height: 34px; padding: 0 12px; font-size: 12.5px; }
    .theme-btn { display: none; }
    .snap-s { padding: 86px 0 44px; }
    .hero { padding-top: 88px; }
    .display { font-size: 44px; }
    .proof .sep, .hero-meta span:nth-child(3) { display: none; }
    .proof { flex-wrap: wrap; gap: 10px; }
    .hero-meta { flex-wrap: wrap; gap: 10px 16px; }
    .demo-tabs { flex-direction: column; align-items: flex-start; }
    .demo-tabs .seg { max-width: 100%; overflow-x: auto; }
    .dm-body { grid-template-columns: 1fr; height: auto; }
    .tr { border-right: 0; border-bottom: 1px solid var(--line); height: 300px; }
    .lifted { height: 300px; }
    .dm-top .avs, .spd, .dm-title span, .scrub .chap { display: none; }
    .seals { grid-template-columns: 1fr; }
    .stats, .steps, .stories, .sgrid, .bento, .plans, .apps, .pillars, .apps-mini, .spk, .feat .mets, .int-intro .kpis, .fg2, .cal-opts { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat .big { font-size: 34px; }
    .stat { padding: 14px; }
    .bt.big, .bt.wide { grid-column: auto; grid-row: auto; }
    .mail { grid-template-columns: 1fr; }
    .ticker { width: 100%; justify-content: flex-start; }
    .ticker .cnt { display: none; }
    .photo-s .shade { background: linear-gradient(180deg, rgba(8,7,15,.6), rgba(8,7,15,.92) 55%); }
    .fcard { width: 100%; }
    .orbit { max-width: 340px; }
    .orbit .ring .ap { width: 40px; height: 40px; margin: -20px; }
    .orbit .core { width: 84px; height: 84px; margin: -42px; border-radius: 24px; }
    .recipe { font-size: 11.5px; }
    .foot-g { grid-template-columns: 1fr 1fr; }
    .foot-g > div:first-child { grid-column: 1 / -1; }
    .cta-form { flex-direction: column; }
    .ph { flex-direction: column; align-items: flex-start; }
    .pr-top { grid-template-columns: 1fr; }
    .pr-ctrl { flex-wrap: wrap; }
    .seats { grid-template-columns: 1fr; }
    .seats .sv { text-align: left; }
    .tools .srch { width: 100%; }
    .tools .r { margin-left: 0; }
    .subnav { max-width: 100%; overflow-x: auto; }
    .flow { transform: scale(.62); transform-origin: top left; width: 161%; height: 200px; }
    .canvas { min-height: 260px; }
    .su-l { padding: 22px 18px; }
    .dlg .db { grid-template-columns: 1fr; }
    .wall { columns: 1; }
    .cmp { font-size: 12px; }
    .cmp th, .cmp td { padding: 9px 8px; }
    .page { padding-top: 84px; }
    .sec-hero { padding-top: 88px; }
    .tbl { font-size: 12px; }
    .tbl th, .tbl td { padding: 9px 8px; }
    .tbl .hide-s { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .rv { opacity: 1; transform: none; }
  }
</style>

/* ---------- overlays (palette, dialogs) close with Esc or a click outside ---------- */
const stack = [];
function overlay(html, onOpen) {
  const ov = document.createElement("div");
  ov.className = "ov"; ov.innerHTML = html;
  const prev = document.activeElement;
  const o = { ov, close() { ov.remove(); const i = stack.indexOf(o); if (i > -1) stack.splice(i, 1); if (prev && prev.focus) prev.focus(); } };
  stack.push(o); document.body.append(ov);
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) o.close(); });
  ov.addEventListener("click", (e) => { if (e.target.closest("[data-x]")) o.close(); });
  ov.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = $$("button, a[href], input, select, textarea", ov).filter((x) => !x.disabled && x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }

}

function countUp(el, to, opt = {}) {
  const dec = opt.dec ?? +(el.dataset.dec || 0), pre = opt.pre ?? (el.dataset.pre || ""), dur = opt.dur || +(el.dataset.dur || 1500);

  const t0 = performance.now();

}

function sparkPath(vals, w, h, pad = 3) {
  const max = Math.max(...vals), min = Math.min(...vals), sx = w / (vals.length - 1);
  const pts = vals.map((v, i) => [i * sx, h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2)]);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`; }
  return { line: d, area: d + ` L${w} ${h} L0 ${h} Z` };
}

/* ---------- reveal on scroll + count-up when seen ---------- */
let io = null;
function reveal() {
  if (io) io.disconnect();
  const els = $$(".rv, [data-count], [data-seen]", view);
  if (RM || !("IntersectionObserver" in window)) { els.forEach(seen); return; }
  let batch = 0, lastT = 0;
  io = new IntersectionObserver((ents) => {
    const now = performance.now(); if (now - lastT > 120) batch = 0; lastT = now;
    ents.forEach((en) => {
      if (!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      if (el.classList.contains("rv")) el.style.setProperty("--d", Math.min(batch++ * 55, 360) + "ms");
      seen(el);
    });
  }, { rootMargin: "0px 0px -4% 0px", threshold: 0.01 });
  els.forEach((e) => io.observe(e));
}
function seen(el) {

/* ---------- hero ribbon: flowing sound lines ---------- */
function ribbon() {
  const svg = $("#ribbon"); if (!svg) return;
  let s = "";
  for (let i = 0; i < 16; i++) {
    const amp = 40 + i * 7, y0 = 380 + i * 9, ph = i * 0.35;
    let d = "";
    for (let x = 0; x <= 1440; x += 40) { const y = y0 + Math.sin(x / 210 + ph) * amp * Math.sin(x / 900 + 0.6); d += (x ? " L" : "M") + x + " " + y.toFixed(1); }
    const c = i < 8 ? `rgba(157,140,255,${0.08 + i * 0.03})` : `rgba(94,240,195,${0.36 - (i - 8) * 0.035})`;
    s += `<path d="${d}" stroke="${c}" style="animation-duration:${5 + (i % 5)}s"/>`;
  }
  svg.innerHTML = s;
}

  const rail = $("#rail"), secs = $$("[data-ch]", view);
  rail.innerHTML = `<span class="tc" id="railTc">CH <b>01</b> · ${secs[0].dataset.ch}</span><ol>${secs.map((s, i) => `<li><button type="button" data-i="${i}" aria-label="Go to ${s.dataset.ch}" aria-current="${i === 0}"><span class="tip">${String(i + 1).padStart(2, "0")} ${s.dataset.ch}</span></button></li>`).join("")}</ol><span class="tc" style="color:var(--dim)">${String(secs.length).padStart(2, "0")}</span>`;
  rail.onclick = (e) => { const b = e.target.closest("button[data-i]"); if (b) secs[+b.dataset.i].scrollIntoView({ behavior: RM ? "auto" : "smooth" }); };
  const set = (i) => {
    $$("button[data-i]", rail).forEach((b) => b.setAttribute("aria-current", String(+b.dataset.i === i)));
    $("#railTc").innerHTML = `CH <b>${String(i + 1).padStart(2, "0")}</b> · ${secs[i].dataset.ch}`;
  };
  const sio = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) set(secs.indexOf(en.target)); }), { rootMargin: "-45% 0px -45% 0px" });
  secs.forEach((s) => sio.observe(s));
  onLeave(() => { sio.disconnect(); rail.innerHTML = ""; });
}

/* ---------- the live transcript demo (signature) ---------- */
function heroDemo() {
  const demo = $("#demo"), tl = $("#trList"), lf = $("#lfList"), seg = $("#meetSeg");
  let m = 0, li = 0, segs = [], si = 0, ci = 0, pEl = null, node = null, playing = true, speed = 1, timer = 0, items = [], filter = "all", uid = 0, finished = false, onScreen = true, synced = false;
  const M = () => MEET[m];
  const secs = (t) => { const [a, b] = t.split(":"); return +a * 60 + +b; };
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  function parse(line) {
    const out = [], re = /\{([tdq]):([^}]+)\}/g; let last = 0, mm, ti = 0;
    while ((mm = re.exec(line[2]))) {
      if (mm.index > last) out.push({ s: line[2].slice(last, mm.index) });
      out.push({ s: mm[2], k: mm[1], meta: mm[1] === "t" ? line[3][ti++] : null });
      last = re.lastIndex;
    }
    if (last < line[2].length) out.push({ s: line[2].slice(last) });
    return out;
  }
  function header() {
    $("#dmTitle").textContent = `${M().name} · ${M().org}`;
    $("#dmSub").textContent = `${M().when} · ${M().who.length} people · recorded with consent`;
    $("#dmWho").innerHTML = M().who.map((k) => av(k)).join("");
    $("#scMarks").innerHTML = M().chapters.map((c) => `<span class="chap" style="left:${(c[0] / M().lines.length) * 100}%">${c[1]}</span>`).join("");
  }
  function slots() { lf.innerHTML = Array.from({ length: 6 }, (_, i) => `<div class="slot"><i></i>${i === 0 ? "Listening for the first commitment…" : "Waiting for a task, decision or question"}</div>`).join(""); }
  function counts() {
    const c = { all: items.length, t: 0, d: 0, q: 0 }; items.forEach((it) => c[it.k]++);
    $$("[data-c]", demo).forEach((b) => { b.textContent = c[b.dataset.c]; });
    const nt = c.t; const sb = $("#sendBtn"); sb.disabled = !nt || synced;
    sb.innerHTML = synced ? `${ic("check")}Sent` : `${ic("send")}Send ${nt || ""} task${nt === 1 ? "" : "s"}`;
  }
  function progress() {
    const L = M().lines, n = L.length;
    const frac = pEl && segs.length ? Math.min(1, segs.slice(0, si).reduce((a, s) => a + s.s.length, 0) / Math.max(1, segs.reduce((a, s) => a + s.s.length, 0))) : 0;
    const p = Math.min(1, (li + frac) / n);
    const cur = li >= n ? secs(M().end) : secs(L[li][1]) + frac * ((li + 1 < n ? secs(L[li + 1][1]) : secs(M().end)) - secs(L[li][1]));
    $("#scFill").style.width = p * 100 + "%"; $("#scHead").style.left = p * 100 + "%";
    $("#scrub").setAttribute("aria-valuenow", Math.round(p * 100));
    $("#tcode").textContent = `${mmss(cur)} / ${M().end}`;
  }
  function itemEl(it) {
    const el = document.createElement("div");
    el.className = "item" + (it.done ? " done" : ""); el.dataset.id = it.id; el.dataset.k = it.k;
    const box = it.k === "t" ? `<button type="button" class="ck" aria-label="Mark “${esc(it.text)}” done" aria-pressed="${it.done}">${ic("check")}</button>` : it.k === "d" ? `<span class="ck d">${ic("flag")}</span>` : `<span class="ck q">?</span>`;
    const meta = it.k === "t" ? `${av(it.owner)}<span>${first(it.owner)}</span><span class="pill g">${ic("cal")}${it.due}</span>${it.synced ? `<span class="pill m">In Tracklane</span>` : ""}`
      : it.k === "d" ? `<span class="pill">Decision</span><span>agreed by ${M().who.length}</span>` : `<span class="pill a">Open question</span><span>no owner yet</span>`;
    el.innerHTML = `${box}<div><button type="button" class="tt" title="Show where this was said">${esc(it.text)}</button><div class="meta">${meta}</div></div>`;
    if (filter !== "all" && filter !== it.k) el.hidden = true;
    return el;
  }
  function addItem(seg, animate) {
    const t = seg.s.replace(/^(I'll|we|then)\s+/i, "");
    const it = { id: ++uid, k: seg.k, text: seg.k === "t" ? seg.meta[0] : t.charAt(0).toUpperCase() + t.slice(1).replace(/[?.]$/, "") + (seg.k === "q" ? "?" : ""), owner: seg.meta && seg.meta[1], due: seg.meta && seg.meta[2], done: false, mark: seg.el, line: li };
    items.unshift(it);
    const sl = lf.querySelector(".slot:last-child"); if (sl) sl.remove();
    const firstEl = lf.querySelector(".item, .slot, .summary");
    const el = itemEl(it);
    const sum = lf.querySelector(".summary");
    if (sum) sum.after(el); else lf.insertBefore(el, firstEl);
    counts();
    // a dot on the timeline at the moment it was said
    $("#scMarks").insertAdjacentHTML("beforeend", `<span class="lm" style="left:${((li + 0.5) / M().lines.length) * 100}%;background:${seg.k === "t" ? "var(--mint)" : seg.k === "d" ? "var(--violet)" : "var(--amber)"}"></span>`);
    if (!animate || el.hidden || RM || !onScreen) { seg.el.classList.add("on"); return; }
    el.classList.add("ghost");
    requestAnimationFrame(() => seg.el.classList.add("on"));
    later(() => fly(seg.el, el, seg.k), 300);
  }
  function fly(from, to, k) {
    if (!from.isConnected || !to.isConnected) { to.classList.remove("ghost"); return; }
    lf.scrollTop = 0;
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const f = document.createElement("div"); f.className = "fly " + k; f.textContent = from.textContent;
    document.body.append(f);
    const tx = b.left + 30, ty = b.top + 6;
    const anim = f.animate([
      { transform: `translate(${a.left}px,${a.top - 3}px) scale(1)`, opacity: 0 },
      { transform: `translate(${a.left}px,${a.top - 12}px) scale(1.05)`, opacity: 1, offset: 0.16 },
      { transform: `translate(${(a.left + tx) / 2}px,${Math.min(a.top, ty) - 46}px) scale(.94)`, opacity: 1, offset: 0.58 },
      { transform: `translate(${tx}px,${ty}px) scale(.82)`, opacity: 0.15 }
    ], { duration: 860, easing: "cubic-bezier(.5,0,.25,1)" });
    const done = () => { f.remove(); to.classList.remove("ghost"); to.classList.add("pop"); };
    anim.onfinish = done; onLeave(() => f.remove());
  }
  function startLine() {
    const L = M().lines[li];
    segs = parse(L); si = 0; ci = 0; node = null;
    const prev = tl.querySelector(".cur"); if (prev) prev.classList.remove("cur");
    const row = document.createElement("div"); row.className = "tline cur";
    row.innerHTML = `${av(L[0])}<div><div class="who">${P[L[0]][0]} <time>${L[1]}</time></div><p></p></div>`;
    tl.append(row); pEl = row.querySelector("p");
    tl.scrollTo({ top: tl.scrollHeight, behavior: RM ? "auto" : "smooth" });
  }
  function tick() {
    if (!playing || !onScreen) return;
    if (li >= M().lines.length) return finish();
    if (!pEl) startLine();
    let n = 3;
    while (n-- > 0) {
      const sg = segs[si];
      if (!sg) { pEl = null; li++; progress(); return sched(300); }
      if (ci === 0) { node = sg.k ? Object.assign(document.createElement("mark"), { className: sg.k }) : document.createTextNode(""); pEl.append(node); if (sg.k) sg.el = node; }
      if (sg.k) node.textContent += sg.s[ci]; else node.data += sg.s[ci];
      ci++;
      if (ci >= sg.s.length) { if (sg.k) addItem(sg, true); si++; ci = 0; }
    }
    progress(); sched(28);
  }
  function sched(ms) { clearTimeout(timer); timer = setTimeout(tick, ms / speed); }
  function finish() {
    if (finished) return; finished = true;
    const cur = tl.querySelector(".cur"); if (cur) cur.classList.remove("cur");
    $("#dmLive").textContent = "Brief ready"; progress();
    const c = { t: 0, d: 0, q: 0 }; items.forEach((it) => c[it.k]++);
    lf.querySelectorAll(".slot").forEach((s) => s.remove());
    lf.insertAdjacentHTML("afterbegin", `<div class="summary"><b>${ic("spark")}Brief ready, 38 s after hang-up</b>${c.t} tasks with owners · ${c.d} decisions · ${c.q} open question${c.q === 1 ? "" : "s"}. Recap drafted for ${M().who.length} people.</div>`);
    lf.scrollTop = 0;
    timer = setTimeout(() => { if (playing && onScreen) load((m + 1) % MEET.length); }, 9000 / speed);
  }
  function reset() {
    clearTimeout(timer); li = 0; si = 0; ci = 0; pEl = null; items = []; finished = false; synced = false;
    tl.innerHTML = ""; slots(); header(); counts(); progress(); $("#dmLive").textContent = "Listening";
  }
  function load(i) { m = i; press(seg, seg.querySelector(`[data-m="${i}"]`)); reset(); sched(RM ? 0 : 350); }
  // jump to a line: everything before it appears at once (no flying), then playback continues
  function seek(line) {
    reset(); li = 0;
    while (li < line && li < M().lines.length) {
      startLine(); segs.forEach((sg) => { if (sg.k) { const mk = document.createElement("mark"); mk.className = sg.k; mk.textContent = sg.s; pEl.append(mk); sg.el = mk; addItem(sg, false); } else pEl.append(sg.s); });
      pEl = null; li++;
    }
    const cur = tl.querySelector(".cur"); if (cur) cur.classList.remove("cur");
    tl.scrollTop = tl.scrollHeight; progress();
    if (li >= M().lines.length) finish(); else sched(200);
  }
  function setPlay(p) {
    playing = p; demo.classList.toggle("paused", !p);
    $("#playBtn").innerHTML = ic(p ? "pause" : "play"); $("#playBtn").setAttribute("aria-label", p ? "Pause the demo" : "Play the demo");
    if (p) { if (finished) load((m + 1) % MEET.length); else sched(60); } else clearTimeout(timer);
  }
  // controls
  seg.addEventListener("click", (e) => { const b = e.target.closest("[data-m]"); if (b) { load(+b.dataset.m); setPlay(true); } });
  $("#playBtn").onclick = () => setPlay(!playing);
  $("#restartBtn").onclick = () => { load(m); setPlay(true); };
  $("#spdBtn").onclick = (e) => { speed = speed === 1 ? 2 : 1; e.currentTarget.textContent = speed + "×"; };
  $("#watch").onclick = () => { window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" }); load(m); setPlay(true); };
  const scrub = $("#scrub");
  const seekAt = (x) => { const r = scrub.getBoundingClientRect(); seek(Math.round(Math.max(0, Math.min(1, (x - r.left) / r.width)) * M().lines.length)); };
  scrub.addEventListener("click", (e) => seekAt(e.clientX));
  scrub.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); seek(Math.min(M().lines.length, li + 1)); }
    if (e.key === "ArrowLeft") { e.preventDefault(); seek(Math.max(0, li - 1)); }
  });
  $("#lfTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; press($("#lfTabs"), b);
    $$(".item", lf).forEach((el) => { el.hidden = filter !== "all" && el.dataset.k !== filter; el.classList.remove("ghost"); });
  });
  lf.addEventListener("click", (e) => {
    const ck = e.target.closest("button.ck"), tt = e.target.closest(".tt");
    const el = e.target.closest(".item"); if (!el) return; const it = items.find((x) => x.id === +el.dataset.id); if (!it) return;
    if (ck) { it.done = !it.done; el.classList.toggle("done", it.done); ck.setAttribute("aria-pressed", String(it.done)); if (it.done) toast("Done: " + it.text); }
    else if (tt && it.mark && it.mark.isConnected) {
      tl.scrollTo({ top: it.mark.closest(".tline").offsetTop - 60, behavior: RM ? "auto" : "smooth" });
      it.mark.classList.remove("flash"); void it.mark.offsetWidth; it.mark.classList.add("flash");
    }
  });
  $("#sendBtn").onclick = () => {
    const n = items.filter((i) => i.k === "t").length; synced = true;
    items.forEach((i) => { if (i.k === "t") i.synced = true; });
    $$(".item", lf).forEach((el) => { const it = items.find((x) => x.id === +el.dataset.id); if (it) el.replaceWith(itemEl(it)); });
    counts(); $("#lfNote").textContent = "Synced just now";
    toast(`${n} task${n === 1 ? "" : "s"} sent to Tracklane with owners and dates`, "send");
  };
  // pause typing while the hero is off screen (saves work; flying needs it visible)
  const hio = new IntersectionObserver((ents) => { onScreen = ents[0].isIntersecting; if (onScreen && playing) sched(120); }, { threshold: 0.15 });
  hio.observe(demo);
  const vis = () => { if (document.hidden) clearTimeout(timer); else if (playing) sched(100); };
  document.addEventListener("visibilitychange", vis);
  onLeave(() => { clearTimeout(timer); hio.disconnect(); document.removeEventListener("visibilitychange", vis); });
  later(() => segMark(seg), 30);
  reset();
  if (RM) seek(MEET[0].lines.length); else sched(380);
  DEMO_API.replay = () => { load(m); setPlay(true); };
}
const DEMO_API = { replay: null };

    $("#forgot").onclick = () => { if (!vf("#siE", (v) => !EMAIL.test(v) && "Enter your email first")) return; toast("Reset link sent to " + $("#siE").value.trim(), "mail"); };
    $("#sso").onclick = () => toast("Redirecting to Keyring SSO… (demo)", "key");
    F.onsubmit = (e) => { e.preventDefault(); const ok = [vf("#siE", (v) => !EMAIL.test(v) && "Enter an email like name@company.com"), vf("#siP", (v) => v.length < 8 && "Passwords are at least 8 characters")].every(Boolean); if (!ok) return; toast("Signed in. Welcome back", "check"); later(() => { location.hash = "#/home"; }, 700); };
  } else if (SU.step === 1) {
    const pw = $("#suP");
    pw.addEventListener("input", () => {
      const v = pw.value, sc = (v.length >= 8) + /\d/.test(v) + (/[A-Z]/.test(v) && /[a-z]/.test(v)) + /[^A-Za-z0-9]/.test(v);
      const col = ["var(--rose)", "var(--amber)", "var(--violet)", "var(--mint-2)"][Math.max(0, sc - 1)];
      $$(".meter i", L).forEach((i, k) => { i.style.background = k < sc ? col : ""; });
      $("#pwHint").textContent = !v ? "Use 8+ characters with a number and a capital letter." : ["Too short", "Weak", "Okay", "Good", "Strong"][sc] + (sc < 3 ? ". Add a number or a capital letter." : ".");
    });
    $$("[data-alt]", L).forEach((b) => { b.onclick = () => toast(b.dataset.alt === "sso" ? "Redirecting to Keyring SSO… (demo)" : "Sign-in link sent. Check your inbox", b.dataset.alt === "sso" ? "key" : "mail"); });
    $("#uses").onclick = (e) => { const b = e.target.closest("[data-u]"); if (!b) return; const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); d.uses = on ? [...d.uses, b.dataset.u] : d.uses.filter((x) => x !== b.dataset.u); };
    F.onsubmit = (e) => {
      e.preventDefault();
      const ok = [vf("#suFn", (v) => v.length < 2 && "Enter your first name"), vf("#suLn", (v) => v.length < 2 && "Enter your last name"), vf("#suE", (v) => !EMAIL.test(v) ? "Enter an email like name@company.com" : /@(gmail|yahoo|hotmail|outlook)\./i.test(v) && "Please use your work email"), vf("#suP", (v) => (v.length < 8 || !/\d/.test(v)) && "8+ characters, including a number"), vf("#suT", (v) => !v && "Pick your team size")];
      const tos = $("#suTos"), te = tos.closest(".field").querySelector(".err"); te.textContent = tos.checked ? "" : "Please accept the terms to continue"; ok.push(tos.checked);
      if (!ok.every(Boolean)) { const bad = $("[aria-invalid='true']", L) || tos; bad.focus(); return; }
      Object.assign(d, { first: $("#suFn").value.trim(), last: $("#suLn").value.trim(), email: $("#suE").value.trim(), team: $("#suT").value });
      if (!d.ws) d.ws = d.email.split("@")[1].split(".")[0].replace(/^./, (c) => c.toUpperCase()) + " team";
      SU.step = 2; suDraw(); $("#suW").focus();
    };
  } else if (SU.step === 2) {
    $("#suW").addEventListener("input", (e) => { $("#wsUrl").textContent = "brieflow.app/" + (slug(e.target.value) || "your-team"); });
    $("#calO").onclick = (e) => { const b = e.target.closest("[data-c]"); if (b) { d.cal = b.dataset.c; $$("[data-c]", L).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); } };
    $("#suBack").onclick = () => { d.ws = $("#suW").value.trim(); SU.step = 1; suDraw(); };
    F.onsubmit = (e) => {
      e.preventDefault();
      const ok = [vf("#suW", (v) => v.length < 3 && "Use 3 or more characters"), vf("#suI", (v) => { const bad = v.split(/[,\s]+/).filter(Boolean).find((x) => !EMAIL.test(x)); return bad && `“${bad}” doesn't look like an email`; })].every(Boolean);
      if (!ok) return;
      d.ws = $("#suW").value.trim(); d.invites = $("#suI").value.trim(); SU.step = 3; suDraw(); toast("Workspace created", "spark");
    };
  } else { $("#suRestart").onclick = () => { SU.step = 1; SU.d = { first: "", last: "", email: "", team: "", uses: ["Client calls"], ws: "", cal: "Datewise", invites: "" }; suDraw(); }; }
}
const slug = (s) => String(s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);

/* =====================================================================
   Router, header, drawer, palette, theme, reset, boot
   ===================================================================== */
const ROUTES = { home, product, integrations, security, pricing, customers, faq, signup };
const NAV = [["home", "Home", "spark"], ["product", "Product", "layers"], ["integrations", "Integrations", "link"], ["security", "Security", "shield"], ["pricing", "Pricing", "chart"], ["customers", "Customers", "users"], ["faq", "Questions", "help"], ["signup", "Start free", "arrow"]];
const current = () => { const m = location.hash.match(/^#\/([\w-]+)/); return m && ROUTES[m[1]] ? m[1] : "home"; };
let curR = null;
function render(r) {
  cleanup(); stack.slice().forEach((o) => o.close()); drawer(false);
  Object.keys(SEEN).forEach((k) => delete SEEN[k]);
  const pg = ROUTES[r];
  view.innerHTML = pg.html();
  document.body.className = "r-" + r;
  document.documentElement.classList.toggle("snap", r === "home");
  window.scrollTo(0, 0);
  view.classList.remove("out");
  document.title = `${pg.title} · Brieflow`;
  curR = r; navState();
  pg.mount && pg.mount();
  reveal(); tone();
}
function go() {
  const r = current();
  if (RM) return render(r);
  view.classList.add("out");
  setTimeout(() => render(r), 110);
}
function navState() {
  let act = null;
  $$("#nav a").forEach((a) => { if (a.getAttribute("href") === "#/" + curR) { a.setAttribute("aria-current", "page"); act = a; } else a.removeAttribute("aria-current"); });
  const mk = $("#navmk");
  if (act) { mk.style.opacity = "1"; mk.style.left = act.offsetLeft + "px"; mk.style.width = act.offsetWidth + "px"; } else mk.style.opacity = "0";
}
function drawer(open) {
  const d = $("#drawer"); if (d.classList.contains("open") === open) return;
  d.classList.toggle("open", open); $("#menuBtn").setAttribute("aria-expanded", String(open));
  if (open) { $("#drawerLinks").innerHTML = NAV.map(([id, label, icn]) => `<a class="d" href="#/${id}"${id === curR ? ' aria-current="page"' : ""}><span style="display:flex;align-items:center;gap:12px">${ic(icn)}${label}</span>${ic("chev")}</a>`).join(""); $("#drawerLinks a").focus(); }
  else { $("#drawerLinks").innerHTML = ""; }
}
let tq = 0;
function tone() {
  const hdr = $("#hdr"), inn = $("#hdrIn");
  const el = document.elementsFromPoint(innerWidth / 2, 46).find((e) => !hdr.contains(e));
  inn.classList.toggle("ink", !!(el && el.closest(".ink")));
  const rail = $("#rail");
  if (curR === "home" && innerWidth > 1080) { const e2 = document.elementsFromPoint(26, innerHeight / 2).find((e) => !rail.contains(e)); rail.classList.toggle("on-ink", !!(e2 && e2.closest(".ink"))); }
}
addEventListener("scroll", () => { if (!tq) tq = requestAnimationFrame(() => { tq = 0; tone(); }); }, { passive: true });
function themeIcon() { $("#themeBtn").innerHTML = ic(document.documentElement.dataset.theme === "dark" ? "sun" : "moon"); }
function toggleTheme() { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; themeIcon(); tone(); toast(r.dataset.theme === "dark" ? "Dark theme" : "Light theme", r.dataset.theme === "dark" ? "moon" : "sun"); }
function resetData() { S = DEF(); try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } SU.step = 1; render(curR || "home"); toast("Demo data reset", "history"); }
function palette() {
  if (stack.some((o) => o.pal)) return;
  const items = [...NAV.map(([id, label, icn]) => ({ g: "Pages", label, icn, run: () => { location.hash = "#/" + id; } })),
    { g: "Actions", label: "Replay the live demo", icn: "replay", run: () => { if (curR !== "home") location.hash = "#/home"; else { window.scrollTo(0, 0); DEMO_API.replay && DEMO_API.replay(); } } },
    { g: "Actions", label: "Switch light or dark theme", icn: "moon", run: toggleTheme },
    { g: "Actions", label: "Reset demo data", icn: "history", run: resetData },
    { g: "Actions", label: "Compare plans and prices", icn: "chart", run: () => { location.hash = "#/pricing"; } }];
  let sel = 0, list = items;
  const o = overlay(`<div class="pal" role="dialog" aria-modal="true" aria-label="Search the site"><div class="srch">${ic("search")}<input id="palQ" placeholder="Jump to a page or run an action" autocomplete="off" aria-label="Search pages and actions" role="combobox" aria-expanded="true" aria-controls="palL"><span class="kbd">Esc</span></div><ul id="palL" role="listbox"></ul></div>`, (ov) => {
    const q = $("#palQ", ov), ul = $("#palL", ov);
    const draw = () => {
      const t = q.value.trim().toLowerCase(); list = items.filter((i) => i.label.toLowerCase().includes(t)); sel = Math.min(sel, Math.max(0, list.length - 1));
      let g = ""; ul.innerHTML = list.length ? list.map((it, i) => (it.g !== g ? `<li class="ph2">${(g = it.g)}</li>` : "") + `<li><button type="button" role="option" aria-selected="${i === sel}" data-i="${i}">${ic(it.icn)}${it.label}<small>${it.g === "Pages" ? "Go" : "Run"}</small></button></li>`).join("") : `<li class="empty" style="margin:8px">Nothing found</li>`;
    };
    const run = (i) => { const it = list[i]; if (!it) return; o.close(); it.run(); };
    q.addEventListener("input", () => { sel = 0; draw(); });
    q.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(1, list.length); draw(); }
      if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + list.length) % Math.max(1, list.length); draw(); }
      if (e.key === "Enter") { e.preventDefault(); run(sel); }
    });
    ul.addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) run(+b.dataset.i); });
    draw(); q.focus();
  });
  o.pal = true;
}
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette(); } });
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-cmd]");
  if (c) { const k = c.dataset.cmd; if (k === "palette") palette(); if (k === "theme") toggleTheme(); if (k === "reset") resetData(); if (k === "demo") { if (curR !== "home") location.hash = "#/home"; else { window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" }); DEMO_API.replay && DEMO_API.replay(); } } return; }
  const a = e.target.closest("a[href^='#/']");
  if (a) {
    if (a.dataset.mode) { SU.mode = a.dataset.mode; if (SU.mode === "up" && SU.step === 3) SU.step = 1; }
    if (a.getAttribute("href") === "#/" + curR) { e.preventDefault(); drawer(false); if (curR === "signup") suDraw(); window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" }); }
    else drawer(false);
  }
});
$("#cmdkBtn").onclick = palette;
$("#themeBtn").onclick = toggleTheme;
$("#drawerTheme").onclick = toggleTheme;
$("#menuBtn").onclick = () => drawer(!$("#drawer").classList.contains("open"));
$("#drawer").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) drawer(false); });
addEventListener("hashchange", go);
addEventListener("resize", () => { navState(); $$(".seg", view).forEach(segMark); });
addEventListener("load", () => { navState(); $$(".seg", view).forEach(segMark); });

/* boot */
if (!/^#\/[\w-]+/.test(location.hash) || !ROUTES[location.hash.slice(2).split(/[/?]/)[0]]) history.replaceState(null, "", "#/home");
themeIcon();
render(current());
</script>
</body>
</html>
