<!doctype html>
<!-- Chill & Craft · Spare Key · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spare Key · Cut an invite link with an expiry</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #ece2d0;
    --hole: rgba(90, 64, 30, 0.2);
    --card: #fffaf1;
    --well: #f4ecdd;
    --ink: #2b2318;
    --muted: #7b6e5a;
    --line: rgba(43, 35, 24, 0.13);
    --steel1: #a3adba;
    --steel2: #6b7685;
    --steel3: #414a56;
    --accent: #e0702a;
    --accent2: #c85a17;
    --ok: #1d9b62;
    --bad: #d63f2f;
    --shadow: rgba(70, 50, 20, 0.4);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #141920;
    --hole: rgba(0, 0, 0, 0.5);
    --card: #1b2129;
    --well: #151a21;
    --ink: #eef0f3;
    --muted: #9aa3ae;
    --line: rgba(238, 240, 243, 0.1);
    --steel1: #8892a0;
    --steel2: #535d6b;
    --steel3: #2f3640;
    --accent: #ff8a3d;
    --accent2: #f0752a;
    --ok: #3fd193;
    --bad: #ff6a58;
    --shadow: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Stage: a workshop pegboard ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; background: radial-gradient(var(--hole) 3px, transparent 3.6px) 0 0 / 30px 30px, var(--bg); }
  .stage::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(60% 50% at 50% 35%, color-mix(in srgb, var(--bg) 20%, transparent), var(--bg) 92%); }
  .stage::after { content: ""; position: absolute; z-index: -1; left: 50%; top: 30%; width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 170, 80, 0.2), transparent); animation: glow 6s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: 0.55; transform: scale(1.1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }

  .card { width: min(470px, 100%); padding: 18px; border-radius: 28px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 50px 80px -50px var(--shadow); animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .head { display: flex; align-items: center; gap: 12px; }
  .logo { display: grid; place-items: center; width: 42px; height: 42px; flex: none; border-radius: 13px; background: linear-gradient(140deg, #ffb46b, #e0702a); color: #fff; font-weight: 900; font-size: 0.84rem; }
  .head h1 { margin: 0; font-size: 1.02rem; letter-spacing: -0.01em; }
  .head p { margin: 1px 0 0; font-size: 0.76rem; color: var(--muted); }
  .faces { display: flex; margin-left: auto; }
  .faces i { display: grid; place-items: center; width: 30px; height: 30px; margin-left: -5px; border-radius: 50%; color: #fff; font-style: normal; font-size: 0.6rem; font-weight: 900; box-shadow: 0 0 0 2.5px var(--card); }
  .faces i.new { animation: pop 0.6s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes pop { from { transform: scale(0); } }

  /* ---------- Key cutting machine ---------- */
  .scene { position: relative; margin: 14px 0 12px; border-radius: 20px; background: linear-gradient(180deg, var(--well), color-mix(in srgb, var(--well) 70%, var(--steel3))); box-shadow: inset 0 0 0 1px var(--line), inset 0 -20px 40px -30px rgba(0, 0, 0, 0.35); overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }
  .scene svg * { transform-box: view-box; }
  .m-dark { fill: var(--steel3); } .m-mid { fill: var(--steel2); } .m-light { fill: var(--steel1); }
  .wheel { transform-origin: 0 52px; }
  .spin { transform-origin: 0 0; }
  .tag { transform-origin: 84px 86px; animation: sway 3.6s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .keygrp { transform-origin: 200px 90px; }
  .stale .keygrp { opacity: 0.45; }
  .halfL, .halfR { transform-origin: 212px 88px; }

  /* ---------- Link row ---------- */
  .link { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 6px 0 14px; border-radius: 15px; background: var(--well); box-shadow: inset 0 0 0 1.5px var(--line); }
  .url { position: relative; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 0.84rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
  .url b { color: var(--ink); font-weight: 800; }
  .url .tok i { display: inline-block; font-style: normal; }
  .url.gone { text-decoration: line-through; color: var(--bad); }
  .url.gone b { color: var(--bad); }
  .url::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--accent) 35%, transparent) 50%, transparent 70%); transform: translateX(-110%); }
  .url.hit::after { animation: sweep 0.9s ease-out; }
  @keyframes sweep { to { transform: translateX(110%); } }
  .copy { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 13px; border: 0; border-radius: 11px; background: var(--ink); color: var(--card); font-size: 0.82rem; font-weight: 800; cursor: pointer; flex: none; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.25s; }
  .copy:hover { transform: translateY(-1px); }
  .copy:active { transform: scale(0.94); }
  .copy svg { width: 16px; height: 16px; }
  .copy.done { background: var(--ok); color: #fff; }
  .info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 22px; margin: 8px 2px 12px; font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .info b { color: var(--ink); }
  .info .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
  .info .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .info .dots i.on { background: var(--ok); }
  .info.bad b, .info.bad { color: var(--bad); }

  /* ---------- Settings ---------- */
  .set { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px 10px; }
  .set > span { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 11px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; font-size: 0.78rem; font-weight: 750; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.2s, border-color 0.2s, color 0.2s; }
  .chip:hover { transform: translateY(-1px); border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 15px; background: transparent; font-weight: 850; font-size: 0.9rem; cursor: pointer; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.95); }
  .btn svg { width: 19px; height: 19px; }
  .btn.cut { border: 0; background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 14px 22px -14px rgba(200, 90, 20, 0.95), inset 0 -3px 0 rgba(0, 0, 0, 0.16); }
  .btn.revoke { color: var(--bad); }
  .btn[disabled] { opacity: 0.45; cursor: default; transform: none; }
  /* while cutting, the main button stays bright and shows a moving sheen instead of fading */
  .btn.cut.working[disabled] { opacity: 1; position: relative; overflow: hidden; }
  .btn.cut.working::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%); transform: translateX(-120%); animation: run 1s linear infinite; }
  @keyframes run { to { transform: translateX(120%); } }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .spark { position: absolute; left: 0; top: 0; width: 3px; height: 9px; border-radius: 2px; background: linear-gradient(#fff6c2, #ffb33a 50%, #ff6a1a); }
  .toast { position: fixed; left: 50%; bottom: 18px; z-index: 40; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 0.84rem; font-weight: 700; transform: translate(-50%, 200%); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1); }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 420px) {
    .card { padding: 15px; }
    .set { grid-template-columns: 1fr; gap: 5px; }
    .set > span:not(:first-child) { margin-top: 5px; }
    .chip { padding: 0 9px; }
    .faces i:nth-child(n+3) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::after, .card, .faces i.new, .url.hit::after, .tag, .btn.cut.working::after { animation: none !important; }
    .chip, .btn, .copy, .toast { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <header class="head">
        <span class="logo" aria-hidden="true">KS</span>
        <div><h1 id="title">Invite to Karachi Studio</h1><p>Anyone with the link can join</p></div>
        <span class="faces" id="faces" aria-label="3 members"><i style="background:#5b8def">AM</i><i style="background:#e0533a">SR</i><i style="background:#1d9b62">HN</i></span>
      </header>

      <div class="scene" id="scene">
        <svg viewBox="0 0 400 176" aria-hidden="true">
          <defs>
            <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="0" y1="56" x2="0" y2="118"><stop offset="0" stop-color="#ffe9a8" /><stop offset=".35" stop-color="#e2b04a" /><stop offset="1" stop-color="#a5771c" /></linearGradient>
            <radialGradient id="disc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e8edf2" /><stop offset="1" stop-color="#7c8794" /></radialGradient>
            <clipPath id="clipL"><rect x="0" y="0" width="212" height="176" /></clipPath>
            <clipPath id="clipR"><rect x="212" y="0" width="188" height="176" /></clipPath>
          </defs>
          <!-- rail and motor -->
          <rect class="m-mid" x="18" y="10" width="364" height="8" rx="4" />
          <rect class="m-dark" x="18" y="18" width="364" height="3" opacity=".5" />
          <g id="carriage">
            <rect class="m-dark" x="-16" y="6" width="32" height="18" rx="5" />
            <rect class="m-mid" x="-4" y="22" width="8" height="12" />
            <g class="wheel" id="wheel">
              <circle r="21" cy="52" fill="url(#disc)" />
              <g class="spin" id="spin" transform="translate(0 52)"><circle r="19.5" fill="none" stroke="#5c6672" stroke-width="3" stroke-dasharray="2.2 2.2" /><path d="M-12 0h24M0-12v24" stroke="#5c6672" stroke-width="2" /></g>
              <circle r="5" cy="52" fill="#414a56" />
            </g>
          </g>
          <!-- base and jaw -->
          <rect class="m-dark" x="14" y="140" width="372" height="26" rx="9" />
          <rect class="m-mid" x="14" y="140" width="372" height="5" rx="2.5" opacity=".7" />
          <rect class="m-mid" id="jaw" x="134" y="100" width="210" height="16" rx="4" />
          <rect class="m-dark" x="150" y="116" width="16" height="24" /><rect class="m-dark" x="312" y="116" width="16" height="24" />
          <circle cx="358" cy="108" r="9" class="m-light" /><rect x="354" y="104" width="8" height="8" rx="1.5" class="m-dark" />
          <!-- the key (built by the script) -->
          <g class="keygrp" id="keygrp">
            <g id="keyWhole"></g>
            <g class="halfL" id="halfL" clip-path="url(#clipL)" style="display:none"></g>
            <g class="halfR" id="halfR" clip-path="url(#clipR)" style="display:none"></g>
            <rect id="blank" x="124" y="73" width="196" height="15" fill="url(#brass)" />
            <g class="tag" id="tag" opacity="0">
              <path d="M84 86 C78 100 70 104 62 114" fill="none" stroke="#c9a25a" stroke-width="1.6" />
              <g transform="translate(36 112) rotate(-8)">
                <path d="M6 0h40a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H6L0 20Z" fill="#fff4df" stroke="#d9b77a" />
                <circle cx="9" cy="20" r="2.6" fill="#d9b77a" />
                <text id="tagBig" x="29" y="19" text-anchor="middle" font-size="12" font-weight="900" fill="#2b2318" font-family="system-ui, sans-serif">1 day</text>
                <text id="tagSmall" x="29" y="31" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7b6e5a" font-family="system-ui, sans-serif">5 uses</text>
              </g>
            </g>
          </g>
        </svg>
      </div>

      <div class="link">
        <span class="url" id="url"></span>
        <button class="copy" id="copy" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2.5" /><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v9A2.5 2.5 0 0 0 6.5 17H8" /></svg><span>Copy</span></button>
      </div>
      <p class="info" id="info"></p>

      <div class="set">
        <span id="lblExp">Expires</span>
        <div class="chips" role="group" aria-labelledby="lblExp" data-k="exp"><button class="chip" type="button" data-v="3600">1 hour</button><button class="chip" type="button" data-v="86400">1 day</button><button class="chip" type="button" data-v="604800">7 days</button><button class="chip" type="button" data-v="0">Never</button></div>
        <span id="lblUses">Uses</span>
        <div class="chips" role="group" aria-labelledby="lblUses" data-k="uses"><button class="chip" type="button" data-v="1">1</button><button class="chip" type="button" data-v="5">5</button><button class="chip" type="button" data-v="25">25</button><button class="chip" type="button" data-v="0">No limit</button></div>
        <span id="lblRole">Role</span>
        <div class="chips" role="group" aria-labelledby="lblRole" data-k="role"><button class="chip" type="button" data-v="Viewer">Viewer</button><button class="chip" type="button" data-v="Editor">Editor</button></div>
      </div>

      <div class="actions">
        <button class="btn cut" id="cut" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="12" r="4.5" /><path d="M12 12h9M17 12v3M20 12v2" /></svg><span id="cutText">Cut invite key</span></button>
        <button class="btn revoke" id="revoke" type="button" disabled>Revoke</button>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Spare Key: an invite link cut like a key, with expiry, use limit, copy and revoke ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { $("#status").textContent = t; };
  let toastT = 0;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }

  const HOST = "studio.example/join/";
  const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O or 1/I/L, easy to read aloud
  const opts = { exp: 86400, uses: 5, role: "Viewer" };
  let key = null; // { token, made, exp, uses, role, used, revoked }
  const scene = $("#scene"), urlEl = $("#url"), info = $("#info"), fx = $("#fx");
  const svg = scene.querySelector("svg");

  // ---------- Settings chips ----------
  document.querySelectorAll(".chips").forEach((g) => {
    const k = g.dataset.k;
    g.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => setOpt(k, c.dataset.v, true)));
  });
  function setOpt(k, v, byUser) {
    opts[k] = k === "role" ? v : +v;
    document.querySelectorAll('.chips[data-k="' + k + '"] .chip').forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.v === String(v))));
    // a changed setting needs a new key: the old one dims and the button asks for a recut
    const stale = key && !key.revoked && (key.exp !== opts.exp || key.uses !== opts.uses || key.role !== opts.role);
    scene.classList.toggle("stale", !!stale);
    $("#cutText").textContent = !key || key.revoked ? "Cut invite key" : stale ? "Cut new key" : "Cut a fresh key";
    if (byUser) say(k === "exp" ? "Expiry " + expLabel(opts.exp) : k === "uses" ? (opts.uses ? opts.uses + " uses" : "No use limit") : "Role " + opts.role);
  }
  const expLabel = (s) => (s === 3600 ? "1 hour" : s === 86400 ? "1 day" : s === 604800 ? "7 days" : "never");

  // ---------- Key shape: each token letter sets the depth of one cut ----------
  const CUT_X = [142, 164, 186, 208, 230, 252, 274, 296];
  function depths(token) { return token.replace("-", "").split("").map((ch) => 3 + (ALPHA.indexOf(ch) % 5) * 2.6); }
  function keyPath(token) {
    let d = "M124 74";
    (token ? depths(token) : []).forEach((dep, i) => { const x = CUT_X[i]; d += " L" + (x - 9) + " 74 L" + (x - 3) + " " + (74 + dep) + " L" + (x + 3) + " " + (74 + dep) + " L" + (x + 9) + " 74"; });
    return d + " L318 74 L334 87 L318 100 L124 100 Z";
  }
  function keyMarkup(token) {
    return '<path d="' + keyPath(token) + '" fill="url(#brass)" stroke="#94681a" stroke-width="1" stroke-linejoin="round" />' +
      '<path d="M132 91H314" stroke="#a5771c" stroke-width="2.2" stroke-linecap="round" opacity=".7" />' +
      '<rect x="112" y="68" width="16" height="38" rx="4" fill="url(#brass)" stroke="#94681a" />' +
      '<circle cx="80" cy="87" r="31" fill="url(#brass)" stroke="#94681a" />' +
      '<circle cx="80" cy="87" r="22" fill="none" stroke="#fff3c4" stroke-width="1.5" opacity=".6" />' +
      '<circle cx="84" cy="86" r="8" fill="var(--well)" stroke="#94681a" />';
  }
  function drawKey(token) { $("#keyWhole").innerHTML = keyMarkup(token); }

  // ---------- Link and info line ----------
  function showUrl(tokenShown, gone) {
    urlEl.classList.toggle("gone", !!gone);
    if (!tokenShown && !key) { urlEl.innerHTML = "Cut a key to get your link"; return; }
    urlEl.innerHTML = HOST + '<b class="tok">' + (tokenShown || "") + "</b>";
  }
  function left(ms) {
    if (ms <= 0) return "expired";
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    if (d) return d + " d " + h + " h";
    if (h) return h + " h " + String(m).padStart(2, "0") + " min";
    return m + ":" + String(s % 60).padStart(2, "0");
  }
  function refreshInfo() {
    info.classList.remove("bad");
    if (!key) { info.innerHTML = "Pick an expiry, a use limit and a role, then cut a key."; return; }
    if (key.revoked) { info.classList.add("bad"); info.innerHTML = "<b>Revoked.</b> This link no longer works."; return; }
    const ms = key.exp ? key.made + key.exp * 1000 - Date.now() : Infinity;
    if (ms <= 0) { info.classList.add("bad"); info.innerHTML = "<b>Expired.</b> Cut a fresh key to invite more people."; scene.classList.add("stale"); return; }
    let uses = key.uses ? '<span class="dots">' + Array.from({ length: Math.min(key.uses, 5) }, (_, i) => '<i class="' + (i < Math.round((key.used / key.uses) * Math.min(key.uses, 5)) ? "on" : "") + '"></i>').join("") + "</span> <b>" + key.used + " of " + key.uses + "</b> used" : "<b>" + key.used + "</b> joined · no limit";
    info.innerHTML = (key.exp ? "Expires in <b>" + left(ms) + "</b>" : "<b>Never expires</b>") + " · " + uses + " · " + key.role;
  }
  setInterval(refreshInfo, 1000);

  function newToken() {
    let t = "";
    const r = new Uint32Array(8);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(r) : r.forEach((_, i) => { r[i] = Math.random() * 1e9; });
    r.forEach((v, i) => { t += ALPHA[v % ALPHA.length]; if (i === 3) t += "-"; });
    return t;
  }

  // ---------- Cut: blank in, wheel spins up, travels along the blade cutting each tooth, key pops ----------
  let busy = false;
  const carriage = $("#carriage"), spin = $("#spin"), blank = $("#blank"), tag = $("#tag"), keygrp = $("#keygrp");
  let parkX = 372, spinA = 0, spinSpeed = 0, spinRaf = 0;
  function setCarriage(x, y) { carriage.setAttribute("transform", "translate(" + x + " " + (y || 0) + ")"); }
  function spinLoop() {
    spinA = (spinA + spinSpeed) % 360;
    spin.setAttribute("transform", "translate(0 52) rotate(" + spinA + ")");
    if (spinSpeed > 0.05) spinRaf = requestAnimationFrame(spinLoop); else spinRaf = 0;
  }
  function setSpin(v) { spinSpeed = v; if (!spinRaf && v > 0.05) spinRaf = requestAnimationFrame(spinLoop); }
  function tween(dur, cb) {
    if (calm()) { cb(1); return Promise.resolve(); }
    return new Promise((res) => { const t0 = performance.now(); const f = (now) => { const p = Math.min(1, (now - t0) / dur); cb(p); if (p < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
  }
  const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  function toScreen(x, y) { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; const p = pt.matrixTransform(svg.getScreenCTM()); return [p.x, p.y]; }

  async function cutKey() {
    if (busy) return;
    busy = true;
    const btnCut = $("#cut");
    btnCut.disabled = true; $("#revoke").disabled = true;
    btnCut.classList.add("working"); $("#cutText").textContent = "Cutting…";
    const token = newToken();
    const old = key;
    key = null;
    scene.classList.remove("stale");
    // 0. Out with the old key: it slides off to the left
    if (old && !old.revoked) await play(keygrp, [{ transform: "none", opacity: 1 }, { transform: "translateX(-120px) rotate(-6deg)", opacity: 0 }], { duration: 420, easing: "cubic-bezier(.5,0,.7,.4)", fill: "forwards" });
    keygrp.getAnimations().forEach((a) => a.cancel()); // the slide-in below starts in the same frame
    $("#halfL").style.display = "none"; $("#halfR").style.display = "none"; $("#keyWhole").style.display = "";
    $("#halfL").getAnimations().forEach((a) => a.cancel()); $("#halfR").getAnimations().forEach((a) => a.cancel());
    tag.setAttribute("opacity", "0");
    drawKey(token);
    blank.setAttribute("x", "124"); blank.setAttribute("width", "196"); blank.style.display = "";
    showUrl("", false);
    // 1. Anticipation: a fresh blank slides into the jaw, the jaw clamps, the wheel spins up and comes down
    await play(keygrp, [{ transform: "translateX(-160px)", opacity: 0 }, { transform: "translateX(6px)", opacity: 1, offset: 0.75 }, { transform: "none", opacity: 1 }], { duration: 620, easing: "cubic-bezier(.2,.8,.3,1)" });
    play($("#jaw"), [{ transform: "translateY(0)" }, { transform: "translateY(-3px)" }, { transform: "translateY(0)" }], { duration: 240 });
    say("Cutting a new invite key");
    setSpin(4);
    await tween(420, (p) => { setSpin(4 + p * 26); setCarriage(parkX + (CUT_X[0] - 16 - parkX) * ease(p), 0); });
    // 2. Main: the wheel travels along the blade; each tooth it passes cuts one letter of the token
    let shown = 0;
    const plain = token.replace("-", "");
    const startX = CUT_X[0] - 16, endX = 318;
    let lastSpark = 0;
    await tween(1900, (p) => {
      const x = startX + (endX - startX) * p;
      setCarriage(x, 0);
      blank.setAttribute("x", String(Math.max(124, x)));
      blank.setAttribute("width", String(Math.max(0, 320 - Math.max(124, x))));
      const done = CUT_X.filter((cx) => cx + 9 <= x).length;
      if (done > shown) {
        shown = done;
        const part = plain.slice(0, shown);
        showUrl(part.length > 4 ? part.slice(0, 4) + "-" + part.slice(4) : part);
        const toks = urlEl.querySelector(".tok");
        if (toks) play(toks, [{ color: "var(--accent)" }, { color: "var(--ink)" }], { duration: 500 });
      }
      const now = performance.now();
      if (now - lastSpark > 28 && x < 306) { lastSpark = now; const [sx, sy] = toScreen(x, 74); sparks(sx, sy, 2); }
    });
    blank.style.display = "none";
    showUrl(token);
    // 3. Progress: the wheel lifts and winds down, back to its parking spot
    const wind = tween(700, (p) => { setSpin(30 * (1 - p)); setCarriage(endX + (parkX - endX) * ease(p), -6 * Math.sin(Math.PI * p)); });
    // 4. Finish: the key pops out of the jaw, the tag swings on, a sparkle
    key = { token, made: Date.now(), exp: opts.exp, uses: opts.uses, role: opts.role, used: 0, revoked: false };
    $("#tagBig").textContent = opts.exp ? expLabel(opts.exp) : "Forever";
    $("#tagSmall").textContent = (opts.uses ? opts.uses + (opts.uses === 1 ? " use" : " uses") : "no limit") + " · " + opts.role.toLowerCase();
    await play(keygrp, [{ transform: "none" }, { transform: "translateY(-22px) rotate(-4deg)", offset: 0.45 }, { transform: "translateY(2px) rotate(1deg)", offset: 0.8 }, { transform: "none" }], { duration: 720, easing: "ease-out" });
    tag.setAttribute("opacity", "1");
    play(tag, [{ transform: "rotate(-40deg)", opacity: 0 }, { transform: "rotate(22deg)", opacity: 1, offset: 0.35 }, { transform: "rotate(-12deg)", offset: 0.6 }, { transform: "rotate(6deg)", offset: 0.8 }, { transform: "rotate(0)" }], { duration: 1300, easing: "ease-out" });
    const [kx, ky] = toScreen(260, 80); shine(kx, ky);
    await wind;
    setSpin(0);
    refreshInfo();
    setOpt("exp", opts.exp, false);
    toast("Invite link ready · " + (opts.exp ? "expires in " + expLabel(opts.exp) : "never expires"));
    say("Invite link ready: " + HOST + token + ". " + (opts.exp ? "Expires in " + expLabel(opts.exp) : "Never expires") + ".");
    btnCut.disabled = false; $("#revoke").disabled = false;
    btnCut.classList.remove("working");
    busy = false;
  }
  $("#cut").addEventListener("click", cutKey);

  function sparks(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      fx.appendChild(s);
      const a = -Math.PI * (0.15 + Math.random() * 0.55), v = 50 + Math.random() * 70;
      const dx = Math.cos(a) * v + 10, dy = Math.sin(a) * v;
      const rot = (Math.atan2(dy, dx) * 180) / Math.PI + 90;
      s.animate([
        { transform: "translate(" + x + "px," + y + "px) rotate(" + rot + "deg) scale(1)", opacity: 1 },
        { transform: "translate(" + (x + dx) + "px," + (y + dy) + "px) rotate(" + rot + "deg) scale(.8)", opacity: 1, offset: 0.55 },
        { transform: "translate(" + (x + dx * 1.3) + "px," + (y + dy + 46) + "px) rotate(" + (rot + 40) + "deg) scale(.3)", opacity: 0 }
      ], { duration: 520 + Math.random() * 260, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => s.remove();
    }
  }
  function shine(x, y) {
    if (calm()) return;
    for (let i = 0; i < 12; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.background = i % 2 ? "#fff3c4" : "#ffd36b";
      fx.appendChild(s);
      const a = (i / 12) * Math.PI * 2, d = 40 + Math.random() * 30;
      s.animate([{ transform: "translate(" + x + "px," + y + "px) rotate(" + (a * 57.3 + 90) + "deg) scale(.5)", opacity: 1 }, { transform: "translate(" + (x + Math.cos(a) * d) + "px," + (y + Math.sin(a) * d) + "px) rotate(" + (a * 57.3 + 90) + "deg) scale(1)", opacity: 0 }], { duration: 700, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Copy: the link lights up, the key jingles ----------
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  $("#copy").addEventListener("click", (e) => copyLink(e.currentTarget, true));
  async function copyLink(btn, real) {
    if (!key || key.revoked) { say("Cut a key first"); toast("Cut a key first"); play($("#cut"), [{ transform: "scale(1)" }, { transform: "scale(1.05)" }, { transform: "scale(1)" }], { duration: 400 }); return; }
    // the auto-demo only shows the motion; a real press puts the link on your clipboard
    const ok = real ? await writeClipboard("https://" + HOST + key.token) : true;
    urlEl.classList.remove("hit"); void urlEl.offsetWidth; urlEl.classList.add("hit");
    play(tag, [{ transform: "rotate(0)" }, { transform: "rotate(16deg)" }, { transform: "rotate(-10deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(0)" }], { duration: 900, easing: "ease-out" });
    play(keygrp, [{ transform: "none" }, { transform: "rotate(-1.5deg)" }, { transform: "rotate(1deg)" }, { transform: "none" }], { duration: 420 });
    const span = btn.querySelector("span");
    span.textContent = ok ? "Copied" : "Select it";
    btn.classList.toggle("done", ok);
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { span.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
    say(ok ? "Invite link copied" : "Copy was blocked, select the link instead");
  }

  // ---------- Revoke: the key snaps in two and the halves fall ----------
  $("#revoke").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    if (!key || key.revoked || busy) return;
    busy = true; btn.disabled = true;
    key.revoked = true;
    const m = keyMarkup(key.token);
    $("#halfL").innerHTML = m; $("#halfR").innerHTML = m;
    $("#keyWhole").style.display = "none";
    $("#halfL").style.display = ""; $("#halfR").style.display = "";
    // a crack flash, then each half falls its own way
    await play(keygrp, [{ transform: "none" }, { transform: "translateY(3px) scale(1.02)" }, { transform: "none" }], { duration: 200 });
    const [cx, cy] = toScreen(212, 86); sparks(cx, cy, 10);
    play(tag, [{ transform: "rotate(0)", opacity: 1 }, { transform: "rotate(-50deg) translateY(30px)", opacity: 0 }], { duration: 700, easing: "cubic-bezier(.5,0,.7,.4)", fill: "forwards" }).then(() => { tag.getAnimations().forEach((a) => a.cancel()); tag.setAttribute("opacity", "0"); });
    play($("#halfL"), [{ transform: "none" }, { transform: "translate(-14px,-8px) rotate(-14deg)", offset: 0.25 }, { transform: "translate(-40px,120px) rotate(-60deg)", opacity: 0 }], { duration: 950, easing: "cubic-bezier(.4,0,.8,.6)", fill: "forwards" });
    await play($("#halfR"), [{ transform: "none" }, { transform: "translate(14px,-10px) rotate(16deg)", offset: 0.25 }, { transform: "translate(50px,120px) rotate(70deg)", opacity: 0 }], { duration: 1000, easing: "cubic-bezier(.4,0,.8,.6)", fill: "forwards" });
    if (calm()) { $("#halfL").style.display = "none"; $("#halfR").style.display = "none"; }
    showUrl(key.token, true);
    refreshInfo();
    setOpt("exp", opts.exp, false);
    toast("Link revoked · nobody new can join with it");
    say("Invite link revoked. Nobody new can join with it.");
    busy = false;
    if (demoOn) queueDemo(1800);
  });

  // ---------- Someone joins (shown in the auto-demo) ----------
  const PEOPLE = [["Bilal", "#7a5af0", "BL"], ["Mahnoor", "#e0702a", "MN"], ["Faraz", "#1e88b8", "FZ"]];
  let joinIx = 0;
  function someoneJoins() {
    if (!key || key.revoked || (key.uses && key.used >= key.uses)) return;
    const [n, c, ini] = PEOPLE[joinIx++ % PEOPLE.length];
    key.used++;
    const faces = $("#faces");
    const f = document.createElement("i");
    f.className = "new"; f.style.background = c; f.textContent = ini;
    faces.appendChild(f);
    if (faces.children.length > 5) faces.firstElementChild.remove();
    faces.setAttribute("aria-label", faces.children.length + " members shown");
    refreshInfo();
    toast(n + " joined with your link");
    say(n + " joined with your link");
  }

  // ---------- Auto-demo: cut a key, someone joins, copy; then change the expiry and recut or revoke ----------
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  const PLAN = [{ exp: 86400, uses: 5 }, { exp: 3600, uses: 1 }, { exp: 604800, uses: 25 }];
  async function runDemo() {
    if (!demoOn || busy) return;
    const p = PLAN[round % PLAN.length];
    setOpt("exp", p.exp, false); setOpt("uses", p.uses, false);
    await wait(600);
    if (!demoOn) return;
    await cutKey();
    await wait(1100);
    if (!demoOn) return;
    someoneJoins();
    await wait(1300);
    if (!demoOn) return;
    copyLink($("#copy"), false);
    round++;
    if (round % 3 === 2) { await wait(1600); if (demoOn) $("#revoke").click(); return; }
    queueDemo(3000);
  }

  // ---------- Start ----------
  setOpt("exp", opts.exp, false); setOpt("uses", opts.uses, false); setOpt("role", opts.role, false);
  drawKey("");
  setCarriage(parkX, 0);
  spin.setAttribute("transform", "translate(0 52)");
  showUrl("", false);
  refreshInfo();
  queueDemo(500);
</script>
</body>
</html>
