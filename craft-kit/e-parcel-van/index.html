<!doctype html>
<!-- Chill and Craft · Parcel Van · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel Van · Chill and Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #e6f1fa;
    --card: #ffffff;
    --ink: #0b2545;
    --muted: #5d7590;
    --line: #dbe7f2;
    --navy: #0b2545;
    --navy-2: #13406f;
    --ok: #0f9d74;
    --sky-1: #bfe4f8;
    --sky-2: #eef8fe;
    --sun: #ffd166;
    --town: #a7cfe6;
    --cloud: #ffffff;
    --walk: #d5dee8;
    --road: #3b4a5c;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #07121e;
    --card: #0f1e30;
    --ink: #e5f0fb;
    --muted: #8ea8c3;
    --line: #1f3550;
    --navy: #2563eb;
    --navy-2: #1d4ed8;
    --ok: #10b981;
    --sky-1: #1b2f4d;
    --sky-2: #2c4466;
    --sun: #fdf2c4;
    --town: #2a4263;
    --cloud: #4a6286;
    --walk: #4b5d73;
    --road: #1c2735;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--stage);
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Order summary card ---------- */
  .card {
    width: 100%; max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 22px 46px -28px rgba(11, 37, 69, .55);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  h1 { margin: 0 0 12px; font-size: 18px; }
  .rows { margin: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; border-bottom: 1px dashed var(--line); animation: rowIn .5s var(--spring) backwards; }
  .rows div:nth-child(2) { animation-delay: .08s; }
  .rows div:nth-child(3) { animation-delay: .16s; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-12px); } }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; font-weight: 650; text-align: right; }
  .rows .grand { border-bottom: 0; padding-top: 10px; }
  .rows .grand dt, .rows .grand dd { color: var(--ink); font-weight: 800; font-size: 16px; }
  .addr { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 16px; padding: 10px 12px; border-radius: 14px; background: var(--stage); font-size: 13px; line-height: 1.4; transition: transform .4s var(--spring); }
  .addr:hover { transform: translateY(-2px); }
  .addr svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .addr:hover svg { animation: hop .5s var(--spring); }
  @keyframes hop { 40% { transform: translateY(-5px); } }

  /* ---------- Place order button with a scene inside ---------- */
  .pv {
    position: relative;
    display: block;
    width: 100%; height: 58px;
    border: 0; border-radius: 16px;
    padding: 0;
    overflow: hidden;
    background: linear-gradient(180deg, var(--navy-2), var(--navy));
    color: #fff;
    font: 750 16px system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 12px 24px -14px var(--navy);
    transition: height .45s cubic-bezier(.5, 0, .2, 1), background .3s, transform .4s var(--spring), box-shadow .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .pv:not([aria-disabled]):hover { transform: translateY(-2px); box-shadow: 0 18px 30px -14px var(--navy); }
  .pv:not([aria-disabled]):active { transform: scale(.97); transition-duration: .08s; }
  .pv:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .pv[aria-disabled="true"] { cursor: default; }
  .pv.press { animation: squash .35s var(--spring); }
  @keyframes squash { 35% { transform: scale(1.03, .86); } 70% { transform: scale(.99, 1.04); } }
  .pv.open { height: 156px; background: linear-gradient(180deg, var(--sky-1), var(--sky-2)); }
  .pv.done { background: linear-gradient(180deg, #13b384, var(--ok)); box-shadow: 0 14px 28px -14px var(--ok); }
  .pv::after { /* success ripple */
    content: ""; position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: rgba(255, 255, 255, .35); transform: scale(0); opacity: 0;
  }
  .pv.done::after { animation: ripple .7s ease-out; }
  @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(8); opacity: 0; } }

  .label {
    position: absolute; left: 0; right: 0; top: 0; height: 58px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: opacity .25s, transform .45s var(--spring);
  }
  .label svg { width: 20px; height: 20px; flex: none; }
  .mini-van { width: 28px !important; transition: transform .4s var(--spring); }
  .pv:not([aria-disabled]):hover .mini-van { animation: idle .25s linear 3; }
  .pv:not([aria-disabled]):hover .arrow { transform: translateX(4px); }
  .arrow { transition: transform .35s var(--spring); }
  @keyframes idle { 50% { transform: translateY(-1.5px); } }
  .label-done { opacity: 0; transform: translateY(18px) scale(.7); }
  .label-done path { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .pv.open .label-idle { opacity: 0; transform: translateY(-18px); }
  .pv.done .label-idle { opacity: 0; }
  .pv.done .label-done { opacity: 1; transform: none; }
  .pv.done .label-done path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s ease-out .2s; }

  .scene { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .25s; overflow: visible; }
  .pv.open .scene { opacity: 1; transition-delay: .15s; }
  .sun { fill: var(--sun); transform-box: fill-box; transform-origin: center; }
  .pv.open .sun { animation: glow 2s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.12); } }
  .cloud { fill: var(--cloud); opacity: .9; }
  .pv.open .cloud { animation: drift 6s linear infinite; }
  .pv.open .cloud.c2 { animation-duration: 9s; }
  @keyframes drift { from { transform: translateX(40px); } to { transform: translateX(-60px); } }
  .town { fill: var(--town); transition: transform 1.4s ease-in-out; }
  .pv.leave .town { transform: translateX(-14px); }
  .walk { fill: var(--walk); }
  .road { fill: var(--road); }
  .dash { stroke: #f8fafc; stroke-width: 3; stroke-dasharray: 14 12; opacity: .7; }
  .pv.leave .dash { animation: lines .3s linear infinite; }
  @keyframes lines { to { stroke-dashoffset: 26; } }

  /* Van, door, parcel and the loading pill (CSS px = SVG units here) */
  .van { transform: translateX(-280px); }
  .tyre { transform-box: fill-box; transform-origin: center; }
  .door { transform-box: fill-box; transform-origin: 0% 50%; }
  .pill { opacity: 0; transition: opacity .2s; }
  .pill-fill { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); }
  .speed { opacity: 0; }
  .pv.arrive .van { animation: arrive 1s cubic-bezier(.2, .8, .3, 1) forwards; }
  .pv.arrive .tyre { animation: roll .3s linear 3; }
  .pv.load .van { animation: brake .45s ease-out forwards; }
  .pv.load .door { animation: door 1s ease-in-out forwards; }
  .pv.load .pill { opacity: 1; }
  .pv.load .pill-fill { transform: scaleX(1); transition: transform .9s ease-in-out .15s; }
  .pv.leave .pill { opacity: 0; }
  .pv.leave .van { animation: leave .85s cubic-bezier(.6, 0, .9, .5) forwards; }
  .pv.leave .tyre { animation: roll .2s linear infinite; }
  .pv.leave .speed { opacity: .8; transition: opacity .2s .25s; }
  .parcel { transform-box: fill-box; transform-origin: center; }
  .pv.load .parcel, .pv.leave .parcel { animation: hopIn .6s cubic-bezier(.3, 0, .6, 1) .15s forwards; }
  .puff { fill: #cbd5e1; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .pv.leave .puff { animation: puff .5s ease-out infinite; }
  .pv.leave .puff + .puff { animation-delay: .25s; }

  @keyframes arrive {
    from { transform: translateX(-280px); }
    78% { transform: translateX(8px) rotate(1.4deg); }
    90% { transform: translateX(-2px) rotate(-.4deg); }
    to { transform: translateX(0); }
  }
  @keyframes roll { to { transform: rotate(360deg); } }
  @keyframes brake {
    0% { transform: translateY(0); }
    40% { transform: translateY(2px) scaleY(.97); }
    100% { transform: translateY(0); }
  }
  @keyframes door { 0%, 100% { transform: scaleX(1); } 25%, 70% { transform: scaleX(-.6); } }
  @keyframes hopIn {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    15% { transform: translate(0, 3px) scale(1.1, .85); opacity: 1; }
    50% { transform: translate(-4px, -38px) rotate(-16deg); opacity: 1; }
    90% { transform: translate(-6px, 20px) rotate(6deg) scale(.85); opacity: 1; }
    100% { transform: translate(-6px, 24px) rotate(6deg) scale(.85); opacity: 0; }
  }
  @keyframes leave {
    0% { transform: translateX(0); }
    15% { transform: translateX(-7px) rotate(-1.2deg); }
    100% { transform: translateX(330px); }
  }
  @keyframes puff {
    from { opacity: .8; transform: translate(0, 0) scale(.5); }
    to { opacity: 0; transform: translate(-22px, -6px) scale(1.5); }
  }

  .bit { position: fixed; z-index: 30; width: 7px; height: 11px; margin: -5px 0 0 -3px; border-radius: 2px; pointer-events: none; }
  .bit.round { width: 8px; height: 8px; border-radius: 50%; }

  @media (max-width: 380px) { .pv { font-size: 14.5px; } .label { gap: 7px; } .mini-van { display: none; } }

  .track { margin: 12px 0 0; font-size: 13px; color: var(--muted); text-align: center; min-height: 1.4em; }
  .track.tick { animation: rowIn .45s var(--spring); }
  .track b { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="sumTitle">
    <h1 id="sumTitle">Order summary</h1>
    <dl class="rows">
      <div><dt>Lawn suit, 3 piece</dt><dd>Rs 2,950</dd></div>
      <div><dt>Delivery</dt><dd>Rs 300</dd></div>
      <div class="grand"><dt>Total</dt><dd>Rs 3,250</dd></div>
    </dl>
    <div class="addr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></svg>
      <span><b>Ayesha Siddiqui</b><br>House 14, Block 7, Gulshan-e-Iqbal, Karachi · Cash on delivery</span>
    </div>

    <button class="pv" id="pv" type="button">
      <span class="label label-idle">
        <svg class="mini-van" viewBox="0 0 28 20" aria-hidden="true"><path d="M2 5q0-3 3-3h13q2 0 3.5 2l4 4q2.5.5 2.5 3v3q0 1-1 1H2Z" fill="#ffd166"/><path d="M19 4l4 4h-4Z" fill="#0b2545"/><circle cx="7" cy="16" r="2.6" fill="#0b2545" stroke="#fff"/><circle cx="21" cy="16" r="2.6" fill="#0b2545" stroke="#fff"/></svg>
        Place order · Rs 3,250
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="label label-done" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Order placed, van on the way
      </span>

      <!-- Street scene: the van drives in, picks up the parcel and leaves -->
      <svg class="scene" viewBox="0 0 320 156" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <circle class="sun" cx="276" cy="30" r="14"/>
        <path class="cloud" d="M60 34a10 10 0 0 1 18-6 12 12 0 0 1 22 4 8 8 0 0 1 0 16H62a7 7 0 0 1-2-14Z"/>
        <path class="cloud c2" d="M190 22a8 8 0 0 1 14-5 10 10 0 0 1 18 3 6 6 0 0 1 0 12h-30a6 6 0 0 1-2-10Z"/>
        <path class="town" d="M-300 104V76h40V58h30v46h20V68h36v36h24V64h34v40h18V50h28v54h22V72h30v32h26V60h36v44h24V76h28v28h30V66h34v38h24V54h32v50h40v-36h44v36H620v8H-300Z"/>
        <rect class="walk" x="-300" y="102" width="920" height="10"/>
        <rect class="road" x="-300" y="112" width="920" height="44"/>
        <path class="dash" d="M-300 136H620"/>

        <!-- Loading pill above the van -->
        <g class="pill">
          <rect x="112" y="40" width="96" height="16" rx="8" fill="#0b2545" opacity=".85"/>
          <rect class="pill-fill" x="115" y="43" width="90" height="10" rx="5" fill="#ffd166"/>
          <text x="160" y="51.5" text-anchor="middle" font-size="8" font-weight="700" fill="#0b2545" font-family="system-ui, sans-serif">LOADING</text>
        </g>

        <!-- Parcel waiting on the pavement -->
        <g class="parcel">
          <rect x="140" y="84" width="24" height="19" rx="2" fill="#c68b59"/>
          <path d="M152 84v19M140 90h24" stroke="#8a5a32" stroke-width="2"/>
          <rect x="143" y="94" width="7" height="5" fill="#fff"/>
        </g>

        <!-- Van -->
        <g transform="translate(104 96)">
          <g class="van">
            <g class="speed"><path d="M-30 14h22M-40 24h30M-26 34h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
            <circle class="puff" cx="-4" cy="40" r="5"/>
            <circle class="puff" cx="-4" cy="40" r="5"/>
            <path d="M4 14q0-8 8-8h54q6 0 10 6l14 14q8 2 8 10v8q0 2-2 2H4q-2 0-2-2Z" fill="#ffd166"/>
            <path d="M68 12l14 14H68Z" fill="#0b2545"/>
            <rect x="8" y="12" width="22" height="12" rx="2" fill="#0b2545" opacity=".85"/>
            <rect x="2" y="30" width="96" height="4" fill="#0b2545"/>
            <rect class="door" x="36" y="9" width="22" height="35" rx="1.5" fill="#f2bf4f" stroke="#d9a93f" stroke-width="1.5"/>
            <rect x="44" y="16" width="10" height="9" rx="1.5" fill="#c68b59"/>
            <rect x="93" y="35" width="5" height="4" rx="1" fill="#fff7d6"/>
            <g class="tyre"><circle cx="22" cy="46" r="8" fill="#111827"/><circle cx="22" cy="46" r="3" fill="#cbd5e1"/><path d="M22 39v14" stroke="#4b5563" stroke-width="1.5"/></g>
            <g class="tyre"><circle cx="78" cy="46" r="8" fill="#111827"/><circle cx="78" cy="46" r="3" fill="#cbd5e1"/><path d="M78 39v14" stroke="#4b5563" stroke-width="1.5"/></g>
          </g>
        </g>
      </svg>
    </button>

    <p class="track" id="track">Pay cash when the parcel reaches you.</p>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pv = document.getElementById("pv");
    const track = document.getElementById("track");
    const live = document.getElementById("live");
    let busy = false;

    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 80) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps the done state readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const say = (text) => { track.textContent = text; replay(track, "tick"); };

    // Confetti from the middle of an element
    function confetti(el, n) {
      if (RM || !el.animate) return;
      const r = el.getBoundingClientRect();
      const colors = ["#ffd166", "#0f9d74", "#38bdf8", "#c68b59", "#ffffff"];
      for (let i = 0; i < n; i++) {
        const b = document.createElement("i");
        b.className = "bit" + (i % 3 ? "" : " round");
        b.style.left = r.left + r.width / 2 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = colors[i % colors.length];
        document.body.appendChild(b);
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.8;
        const d = 70 + Math.random() * 80;
        const x = Math.cos(a) * d, y = Math.sin(a) * d, spin = (Math.random() - 0.5) * 900;
        b.animate([
          { transform: "translate(0,0) scale(.3)", opacity: 1 },
          { transform: `translate(${x}px,${y}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(${x * 1.2}px,${y + 110}px) rotate(${spin}deg) scale(.7)`, opacity: 0 }
        ], { duration: 1200 + Math.random() * 400, easing: "cubic-bezier(.15,.7,.35,1)" }).onfinish = () => b.remove();
      }
    }

    pv.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      pv.setAttribute("aria-disabled", "true");
      live.textContent = "Placing your order. A van is coming for the parcel.";

      // 1. Anticipation, then the button grows into a street
      replay(pv, "press");
      await wait(180);
      pv.classList.add("open");
      say("Booking a rider…");
      await wait(380);
      // 2. The van drives in and brakes
      pv.classList.add("arrive");
      await wait(1000);
      // 3. Door opens, the parcel hops in, the loading pill fills
      pv.classList.add("load");
      say("Loading your parcel…");
      await wait(1100);
      // 4. The van drives off, the town slides, dust puffs
      pv.classList.add("leave");
      say("On the road");
      await wait(850);

      // 5. Done: shrink to a green confirmation with confetti
      pv.classList.remove("open");
      pv.classList.add("done");
      const id = "AD-" + Math.floor(1000 + Math.random() * 9000);
      track.textContent = "";
      const b = document.createElement("b");
      b.textContent = id;
      track.append("Tracking ", b, " · Rider Imran · arrives tomorrow");
      replay(track, "tick");
      await wait(300);
      confetti(pv, 24);
      live.textContent = "Order placed. Tracking number " + id + ". The van has picked up your parcel.";
      await hold(3400);

      // 6. Reset (the scene is hidden, so the van can jump back quietly)
      pv.classList.remove("done", "arrive", "load", "leave", "press");
      pv.removeAttribute("aria-disabled");
      busy = false;
      live.textContent = "Ready. You can place the order again.";
    });
  })();
</script>
</body>
</html>
