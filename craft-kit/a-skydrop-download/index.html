<!doctype html>
<!-- Chill & Craft · Skydrop · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skydrop · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --sky1: #a9d8ff;
    --sky2: #eef8ff;
    --stars: transparent;
    --cloud: rgba(255, 255, 255, .9);
    --btn: #ffffff;
    --btn-line: rgba(30, 58, 138, .08);
    --text: #1e3a8a;
    --caption: #2f557f;
    --navy: #1e3a8a;
    --coral: #ff6b5b;
    --sun: #ffc93c;
    --cord: #4b6a92;
    --ok: #16a34a;
    --focus: #f97316;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --sky1: #070f24;
      --sky2: #1c2b55;
      --stars: rgba(255, 255, 255, .55);
      --cloud: rgba(160, 180, 230, .16);
      --btn: #13213f;
      --btn-line: #2b3d66;
      --text: #e6eeff;
      --caption: #a9bddb;
      --navy: #3b5bdb;
      --coral: #ff7a6b;
      --sun: #ffd166;
      --cord: #9fb3d6;
      --ok: #22c55e;
      --focus: #fdba74;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --sky1: #070f24;
    --sky2: #1c2b55;
    --stars: rgba(255, 255, 255, .55);
    --cloud: rgba(160, 180, 230, .16);
    --btn: #13213f;
    --btn-line: #2b3d66;
    --text: #e6eeff;
    --caption: #a9bddb;
    --navy: #3b5bdb;
    --coral: #ff7a6b;
    --sun: #ffd166;
    --cord: #9fb3d6;
    --ok: #22c55e;
    --focus: #fdba74;
  }

  /* ---------- Sky ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(1.4px 1.4px at 12% 18%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 78% 12%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 64% 34%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 30% 42%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 90% 56%, var(--stars) 50%, transparent 51%),
      linear-gradient(180deg, var(--sky1), var(--sky2));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  .scene { --rise: 0; position: relative; width: 300px; max-width: calc(100vw - 32px); height: 350px; }

  /* Soft clouds; they drift, and rise a little as the chute falls (parallax) */
  .cloud { position: absolute; height: 22px; border-radius: 22px; background: var(--cloud); animation: drift 9s ease-in-out infinite alternate; translate: 0 calc(var(--rise) * var(--depth) * -1px); transition: translate .4s ease-out; }
  .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .cloud::before { width: 30px; height: 30px; left: 12px; top: -15px; }
  .cloud::after { width: 22px; height: 22px; left: 34px; top: -9px; }
  .c1 { --depth: .5; width: 78px; left: -6px; top: 70px; }
  .c2 { --depth: .3; width: 64px; right: -4px; top: 150px; animation-duration: 11s; animation-direction: alternate-reverse; }
  .c3 { --depth: .8; width: 54px; left: 40px; top: 215px; opacity: .7; animation-duration: 13s; }

  /* ---------- Parachute ---------- */
  .chute { position: absolute; left: 50%; top: 0; width: 76px; height: 100px; margin-left: -38px; opacity: 0; transform: translateY(0); pointer-events: none; }
  .swing { width: 100%; height: 100%; transform-origin: 50% 0; }
  .chute svg { width: 100%; height: 100%; overflow: visible; }
  .canopy { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.18, .35); transition: transform .7s var(--spring), opacity .3s; }
  .gore-a { fill: var(--coral); }
  .gore-b { fill: var(--sun); }
  .crate .box { fill: var(--navy); }
  .cords { fill: none; stroke: var(--cord); stroke-width: 1; opacity: 0; transition: opacity .3s; }
  .crate { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .35s ease-in, opacity .3s .1s; }

  /* ---------- Button (centred by its dock, so it can squash freely) ---------- */
  .dock { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; }
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 250px;
    max-width: 100%;
    height: 62px;
    padding: 0 20px;
    border: 1px solid var(--btn-line);
    border-radius: 31px;
    background: var(--btn);
    color: var(--text);
    font: inherit;
    font-size: 16.5px;
    font-weight: 650;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 16px 30px -18px rgba(20, 50, 110, .7);
    transition: transform .4s var(--spring), box-shadow .25s;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 22px 34px -16px rgba(20, 50, 110, .8); }
  .btn:active { transform: scale(.96); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .btn[aria-disabled="true"] { cursor: progress; transform: none; }
  .btn .dot { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); transition: background-color .3s, transform .5s var(--spring); }
  .btn:hover .dot { transform: rotate(-10deg) scale(1.08); }
  .btn .dot svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .btn .tick { stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .35s .15s ease-out; }
  .btn .arrow { transition: opacity .2s; }
  .btn .label { display: inline-block; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .btn .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: linear-gradient(90deg, var(--coral), var(--sun)); transition: width .3s linear; }
  .btn:hover .arrow { animation: nod .8s ease-in-out infinite; }

  /* Effects (dust and stars) just above the button */
  .fx { position: absolute; left: 50%; bottom: 100px; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; }
  .particle.star { width: 10px; height: 10px; border-radius: 0; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }

  .caption { position: absolute; left: 0; right: 0; bottom: 6px; margin: 0; text-align: center; font-size: 13px; color: var(--caption); }

  /* ---------- States ---------- */
  .scene:not([data-state="idle"]) .chute { opacity: 1; }
  /* deploy/falling: canopy springs open, cords appear */
  .scene:is([data-state="deploy"], [data-state="falling"]) .canopy { transform: none; }
  .scene:is([data-state="deploy"], [data-state="falling"]) .cords { opacity: 1; transition-delay: .2s; }
  .scene[data-state="falling"] .chute { transition: transform .35s linear; }
  .scene[data-state="falling"] .swing { animation: sway 2.6s ease-in-out infinite; }
  .scene:is([data-state="launch"], [data-state="deploy"], [data-state="falling"]) .btn .dot { background: var(--coral); }

  /* landed: canopy folds and drifts off, crate sinks into the button */
  .scene:is([data-state="landed"], [data-state="done"]) .canopy { transform: translate(18px, 30px) rotate(34deg) scale(.45); opacity: 0; transition: transform .7s ease-in, opacity .5s .2s; }
  .scene:is([data-state="landed"], [data-state="done"]) .crate { transform: translateY(12px) scale(.3); opacity: 0; }
  .scene[data-state="done"] .btn .dot { background: var(--ok); }
  .scene[data-state="done"] .btn .arrow { opacity: 0; animation: none; }
  .scene[data-state="done"] .btn .tick { stroke-dashoffset: 0; }

  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(18px); } }
  @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .fx { display: none; }
  }
</style>
</head>
<body>
<main class="scene" data-state="idle">
  <span class="cloud c1" aria-hidden="true"></span>
  <span class="cloud c2" aria-hidden="true"></span>
  <span class="cloud c3" aria-hidden="true"></span>

  <!-- The parachute: a striped canopy carrying a download crate -->
  <div class="chute" aria-hidden="true">
    <div class="swing">
      <svg viewBox="0 0 76 100">
        <defs>
          <clipPath id="canopyShape">
            <path d="M6 32C6 14 21 4 38 4s32 10 32 28q-8.5-6-17 0q-7.5-6-15 0q-7.5-6-15 0q-8.5-6-17 0z" />
          </clipPath>
        </defs>
        <path class="cords" d="M8 31L34 71M23 31l12.5 40M53 31L40.5 71M68 31L42 71" />
        <g class="canopy">
          <g clip-path="url(#canopyShape)">
            <rect class="gore-a" x="0" y="0" width="23" height="40" />
            <rect class="gore-b" x="23" y="0" width="15" height="40" />
            <rect class="gore-a" x="38" y="0" width="15" height="40" />
            <rect class="gore-b" x="53" y="0" width="23" height="40" />
            <path d="M12 12q26-14 52 0" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" />
          </g>
        </g>
        <g class="crate">
          <rect class="box" x="26" y="70" width="24" height="24" rx="7" />
          <path d="M38 75v12M33 82.5l5 5 5-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </svg>
    </div>
  </div>

  <span class="fx" aria-hidden="true"></span>

  <div class="dock">
    <button class="btn" type="button" aria-describedby="caption">
      <span class="dot" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path class="arrow" d="M8 3v8M4.5 7.8L8 11.3l3.5-3.5" /><path class="tick" d="M3.5 8.5l3 3 6-6.5" /></svg>
      </span>
      <span class="label">Download app</span>
      <span class="bar" aria-hidden="true"></span>
    </button>
  </div>
  <p class="caption" id="caption">Version 4.2 · 18 MB · for Android and iPhone</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Skydrop download button ----------
  const scene = document.querySelector(".scene");
  const chute = scene.querySelector(".chute");
  const dock = scene.querySelector(".dock");
  const btn = scene.querySelector(".btn");
  const label = btn.querySelector(".label");
  const bar = btn.querySelector(".bar");
  const fx = scene.querySelector(".fx");
  const status = document.getElementById("status");

  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  let busy = false;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Dust puffs sideways, little stars pop upward
  function landingFx() {
    if (calm()) return;
    const make = (cls, color, frames, ms) => {
      const p = document.createElement("i");
      p.className = "particle" + cls;
      p.style.background = color;
      fx.appendChild(p);
      p.animate(frames, { duration: ms, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => p.remove();
    };
    for (let i = 0; i < 6; i++) {
      const side = i % 2 ? 1 : -1;
      const dx = side * (24 + Math.random() * 30);
      make("", "rgba(255, 255, 255, .85)", [
        { transform: "translate(-50%, -50%) scale(.4)", opacity: .9 },
        { transform: "translate(calc(-50% + " + dx.toFixed(1) + "px), calc(-50% - " + (6 + Math.random() * 8).toFixed(1) + "px)) scale(1.6)", opacity: 0 }
      ], 700);
    }
    const colors = ["#ff6b5b", "#ffc93c", "#60a5fa", "#34d399"];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i / 9 - .5) * 2.2;
      const d = 50 + Math.random() * 30;
      make(" star", colors[i % colors.length], [
        { transform: "translate(-50%, -50%) scale(.2) rotate(0)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d).toFixed(1) + "px)) scale(1) rotate(180deg)", opacity: 1, offset: .6 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d * 1.1).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d + 20).toFixed(1) + "px)) scale(.4) rotate(260deg)", opacity: 0 }
      ], 1000 + Math.random() * 300);
    }
  }

  // How far the chute falls: from the top of the scene to the button's top edge
  function fallDistance() {
    return dock.offsetTop - 96 + 4; // 96 = bottom of the crate inside the chute
  }

  function setProgress(p) {
    chute.style.transform = "translateY(" + (fallDistance() * p / 100).toFixed(1) + "px)";
    scene.style.setProperty("--rise", (p * .3).toFixed(1));
    bar.style.width = p + "%";
    label.textContent = "Downloading " + Math.round(p) + "%";
  }

  // Fake download with uneven chunks
  function simulateDownload(onTick) {
    return new Promise((resolve) => {
      let p = 0;
      (function step() {
        p = Math.min(100, p + 1.5 + Math.random() * 5);
        onTick(p);
        if (p >= 100) resolve();
        else setTimeout(step, 140 + Math.random() * 100);
      })();
    });
  }

  btn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    btn.setAttribute("aria-disabled", "true");

    // 1. Anticipation: the button squashes down like a launch pad
    await play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.06, .82)" }, { transform: "scale(.97, 1.06)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });

    // 2. Launch: the folded chute shoots up out of the button
    chute.style.transition = "none";
    chute.style.transform = "translateY(" + fallDistance() + "px)";
    scene.dataset.state = "launch";
    label.textContent = "Downloading 0%";
    status.textContent = "Download started.";
    void chute.offsetWidth; // apply the start position before animating
    chute.style.transition = calm() ? "none" : "transform .6s cubic-bezier(.15, .85, .3, 1)";
    chute.style.transform = "translateY(0)";
    await wait(600);
    chute.style.transition = "";

    // 3. The canopy springs open at the top of the sky
    scene.dataset.state = "deploy";
    await wait(650);

    // 4. It sways down as the file downloads; clouds drift up past it
    scene.dataset.state = "falling";
    let spoken = 0;
    await simulateDownload((p) => {
      setProgress(p);
      if (p - spoken >= 25 && p < 100) {
        spoken = Math.floor(p / 25) * 25;
        status.textContent = "Downloading, " + spoken + " percent.";
      }
    });
    await wait(350);

    // 5. Touchdown: thud, dust, stars; canopy folds away
    scene.dataset.state = "landed";
    landingFx();
    await play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.04, .86) translateY(3px)" }, { transform: "scale(.98, 1.04)" }, { transform: "scale(1)" }], { duration: 450, easing: "ease-out" });
    scene.dataset.state = "done";
    label.textContent = "Downloaded";
    play(label, [{ transform: "translateY(10px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 450, easing: SPRING });
    status.textContent = "Download complete. The app is saved.";
    await wait(2400);

    // 6. Reset: the chute hides, clouds settle, the bar empties
    scene.dataset.state = "idle";
    scene.style.setProperty("--rise", 0);
    label.textContent = "Download app";
    play(label, [{ transform: "translateY(10px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 450, easing: SPRING });
    bar.style.width = "0";
    await wait(350);
    chute.style.transform = "translateY(0)";
    btn.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
