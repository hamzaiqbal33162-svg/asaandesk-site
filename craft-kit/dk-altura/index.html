<!doctype html>
<!-- Chill & Craft · Altura · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altura · Investment dashboard</title>
<script>
  /* Theme: dark by default (it is a dark dashboard); ?theme=light|dark in the URL wins */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : "dark";
  })();
</script>
<style>
  /* ---------- Theme: graphite + champagne gold (dark), ivory + bronze (light) ---------- */
  :root {
    --bg: #f6f2ea; --surface: #fffdf8; --surface-2: #f0ebe1; --panel: #fffdf8;
    --ink: #1c1a17; --muted: #7b7468; --line: #e6dfd2; --grid: #ece6da;
    --accent: #a8792c; --accent-ink: #fff; --teal: #2b8a83; --rose: #b4534a;
    --good: #2b8a83; --bad: #b4534a; --warn: #a8792c;
    --radius: 20px; --radius-sm: 12px; --tip-bg: #1c1a17; --tip-ink: #f6f2ea;
    --glow: rgba(168,121,44,.18);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0d0e10; --surface: #15171a; --surface-2: #1d2024; --panel: #17191d;
    --ink: #f1ece2; --muted: #8e8a82; --line: #26292e; --grid: #1f2226;
    --accent: #d8b46a; --accent-ink: #15130e; --teal: #5fc9b8; --rose: #e58a7e;
    --good: #5fc9b8; --bad: #e58a7e; --warn: #d8b46a;
    --tip-bg: #f1ece2; --tip-ink: #15171a;
    --glow: rgba(216,180,106,.16);
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- Shell: quiet text sidebar with a gold dot ---------- */
  body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif; letter-spacing: .005em; }
  [data-theme="dark"] body { background: radial-gradient(900px 600px at 85% -20%, rgba(216,180,106,.08), transparent 60%), radial-gradient(700px 500px at -10% 110%, rgba(95,201,184,.06), transparent 60%), var(--bg); }
  .num { font-variant-numeric: tabular-nums; }
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; padding: 28px 22px; display: flex; flex-direction: column; gap: 34px; border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-weight: 300; font-size: 1.35rem; letter-spacing: .32em; text-transform: uppercase; }
  .brand svg { width: 30px; height: 30px; }
  .nav { position: relative; display: grid; gap: 2px; }
  .nav a { position: relative; z-index: 1; padding: 10px 0 10px 22px; color: var(--muted); text-decoration: none; font-size: .92rem; letter-spacing: .04em; transition: color .3s, padding .3s; }
  .nav a:hover { color: var(--ink); padding-left: 26px; }
  .nav a[aria-current="page"] { color: var(--ink); }
  .nav .mark { position: absolute; left: 0; top: 0; width: 8px; transition: transform .6s cubic-bezier(.2,.9,.2,1), height .3s; }
  .nav .mark::before { content: ""; position: absolute; left: 0; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--glow), 0 0 14px var(--accent); }
  .side-foot { margin-top: auto; display: grid; gap: 14px; font-size: .8rem; color: var(--muted); }
  .mkt { display: flex; align-items: center; gap: 8px; }
  .mkt i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
  main { min-width: 0; padding: 26px 34px 50px; overflow-x: clip; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .top .grow { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-weight: 300; font-size: 1.7rem; letter-spacing: .02em; }
  .top p { margin: 2px 0 0; color: var(--muted); font-size: .86rem; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); transition: border-color .3s, transform .15s; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn .ic { width: 18px; height: 18px; stroke-width: 1.5; }
  .badge { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); font-size: 0; }
  .badge:empty { display: none; }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .menu-btn, .scrim { display: none; }
  .btn { border-radius: 999px; font-weight: 500; letter-spacing: .03em; background: transparent; }
  .btn.primary { color: var(--accent-ink); }

  /* ---------- Panels ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
  .card { position: relative; background: linear-gradient(160deg, color-mix(in srgb, var(--surface) 92%, var(--accent)), var(--surface) 40%); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; min-width: 0; transition: transform .5s cubic-bezier(.2,.9,.2,1), border-color .4s, box-shadow .4s; }

/* Pointer drag helper (mouse, touch and pen) */

  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    const s = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, e };
    if (start && start(s, e) === false) return;
    if (el.setPointerCapture && e.pointerId != null) try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const mv = (ev) => { s.dx = ev.clientX - s.x; s.dy = ev.clientY - s.y; if (Math.abs(s.dx) + Math.abs(s.dy) > 4) s.moved = true; if (move) move(s, ev); };
    const up = (ev) => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); if (end) end(s, ev); };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up);

/* ---------- Portfolio maths ---------- */
const valOf = (h) => h.q * asset(h.t).price;
const invested = () => sum(S.hold.map(valOf));
const total = () => invested() + S.cash;
const dayChg = () => sum(S.hold.map((h) => h.q * (asset(h.t).price - asset(h.t).open)));
const costBasis = () => sum(S.hold.map((h) => h.q * h.cost));
const byClass = () => Object.keys(CLASSES).map((c) => ({ c, v: c === "Cash" ? S.cash : sum(S.hold.filter((h) => asset(h.t).cls === c).map(valOf)) }));
const achg = (a) => ((a.price - a.open) / a.open) * 100;
const tkr = (a) => `<span class="tkr"><i>${esc(a.t.slice(0, 4))}</i><span><b>${esc(a.name)}</b><small>${esc(a.t)} · ${a.cls}</small></span></span>`;

/* History of the portfolio and the benchmark, ending at today's value */
reseed(99);
const HIST = (() => { const n = 1826, port = [], bench = []; let p = 1, b = 1; for (let i = 0; i < n; i++) { p *= 1 + (R() - 0.47) * 0.016; b *= 1 + (R() - 0.475) * 0.013; port.push(p); bench.push(b); } return { port, bench }; })();
function series(range) {
  let days = RANGES[range];
  if (range === "YTD") days = Math.max(2, Math.round((TODAY - new Date(TODAY.getFullYear(), 0, 1)) / 864e5));
  const n = HIST.port.length, k = total() / HIST.port[n - 1], step = Math.max(1, Math.round(days / 90));
  const idx = []; for (let i = n - days; i < n; i += step) idx.push(i); if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
  const p = idx.map((i) => HIST.port[i] * k), b0 = HIST.bench[idx[0]], bp = idx.map((i) => (HIST.bench[i] / b0) * p[0]);
  return { p, b: bp, dates: idx.map((i) => addDays(TODAY, i - n + 1)), days };
}

/* ---------- Hero chart (custom): gradient line, benchmark, morph, scrub ---------- */
let range = "1Y", heroPrev = null;
function hero(el, morph) {
  const draw = (again) => {
    const s = series(range), W = Math.max(300, el.clientWidth || 800), H = W < 600 ? 220 : 290, P = { l: 4, r: 54, t: 14, b: 24 };
    const all = S.bench ? s.p.concat(s.b) : s.p, lo0 = Math.min(...all), hi0 = Math.max(...all), pad = (hi0 - lo0) * 0.12 || 1, lo = lo0 - pad, hi = hi0 + pad;
    const n = s.p.length, X = (i) => P.l + (i / (n - 1)) * (W - P.l - P.r), Y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
    const pts = (d) => d.map((v, i) => [X(i), Y(v)]);
    const ticks = ticksFor(lo, hi, 4).ticks.filter((t) => t >= lo && t <= hi);
    const xl = [0, Math.round(n / 3), Math.round((2 * n) / 3), n - 1].map((i) => `<text class="ax" x="${X(i)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${s.days > 400 ? MON[s.dates[i].getMonth()] + " " + String(s.dates[i].getFullYear()).slice(2) : fdate(s.dates[i])}</text>`).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Portfolio value over ${range}"><defs><linearGradient id="heroStroke" x1="0" x2="1"><stop offset="0" style="stop-color:var(--teal)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient><linearGradient id="heroFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
      ${ticks.map((t) => `<g class="cc-grid"><line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${W - P.r + 8}" y="${Y(t) + 4}">${"$" + short(t)}</text></g>`).join("")}${xl}
      <path class="ha${again || morph ? "" : " cc-fade"}"/>${S.bench ? `<path class="bl${again || morph ? "" : " cc-fade"}"/>` : ""}<path class="hl${again || morph ? "" : " cc-draw"}" pathLength="1"/>
      <circle class="pulse" r="5"/><circle class="now" r="4.5"/>
      <g class="scrub"><line y1="${P.t}" y2="${H - P.b}"/><circle r="5.5"/></g><rect class="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg>`;
    const hl = $(".hl", el), ha = $(".ha", el), bl = $(".bl", el), now = $(".now", el), pu = $(".pulse", el);
    const set = (pp, bb) => { const pt = pts(pp), d = pathD(pt); hl.setAttribute("d", d); ha.setAttribute("d", `${d}L${pt[n - 1][0]},${H - P.b}L${pt[0][0]},${H - P.b}Z`); if (bl) bl.setAttribute("d", pathD(pts(bb))); now.setAttribute("cx", pt[n - 1][0]); now.setAttribute("cy", pt[n - 1][1]); pu.setAttribute("cx", pt[n - 1][0]); pu.setAttribute("cy", pt[n - 1][1]); };
    if (morph && heroPrev && !again && !RM) { const fp_ = resample(heroPrev.p, n), fb = resample(heroPrev.b, n); const fr = (t) => set(s.p.map((v, i) => lerp(fp_[i], v, t)), s.b.map((v, i) => lerp(fb[i], v, t))); fr(0); tween(750, fr); }
    else set(s.p, s.b);
    heroPrev = { p: s.p.slice(), b: s.b.slice() };
    /* scrub: drag or hover to read any day; the big number follows */
    const scrub = $(".scrub", el), hit = $(".hit", el), svg = $("svg", el);
    const at = (e) => { const r = svg.getBoundingClientRect(), x = ((e.clientX - r.left) * W) / (r.width || W); const i = clamp(Math.round(((x - P.l) / (W - P.l - P.r)) * (n - 1)), 0, n - 1); scrub.classList.add("on"); $("line", scrub).setAttribute("x1", X(i)); $("line", scrub).setAttribute("x2", X(i)); $("circle", scrub).setAttribute("cx", X(i)); $("circle", scrub).setAttribute("cy", Y(s.p[i])); heroText(s, i); };
    hit.onpointermove = at; hit.onpointerdown = at;
    hit.onpointerleave = () => { scrub.classList.remove("on"); heroText(s, n - 1, true); };
    heroText(s, n - 1, !again);
  };
  chart(el, draw);
}
function heroText(s, i, animate) {
  const v = s.p[i], base = s.p[0], d = v - base, pc = (d / base) * 100, bpc = ((s.b[i] - s.b[0]) / s.b[0]) * 100;

  $("#heroWhen").textContent = i === s.p.length - 1 ? "Today · " + range : fdateY(s.dates[i]);
}

    <section class="card s4"><div class="card-h"><h2>Risk level</h2><small>yearly swing</small></div><div id="risk"></div><p class="muted" style="text-align:center;margin:6px 0 0">Moderate. Similar to a balanced fund.</p></section>
    <section class="card s12"><div class="card-h"><h2>Monthly returns</h2><small>% per month</small></div><div id="heat"></div></section>
    <section class="card s12"><div class="card-h"><h2>Drawdown</h2><small>how far below the last high, past year</small></div><div id="dd"></div></section>
  </div>`;
  barChart($("#yBars"), { labels: years.map(String), height: 240, series: [{ name: "You", data: yr, color: "var(--accent)" }, { name: "World Index", data: ix, color: "var(--teal)" }], fmt: (v) => v + "%", tipFmt: (v) => pct(v, 1), radius: 6 });
  gauge($("#risk"), { value: vol, max: 30, color: "var(--accent)", label: "volatility", fmt: () => vol + "%", tip: "Typical yearly swing of your portfolio" });
  heatmap($("#heat"), { rows: years.map(String), cols: MON, data: grid.map((r) => r.map((v) => Math.max(0, v + 5))), color: "var(--accent)", fmt: (v) => (v === 0 ? "No data yet" : pct(v - 5, 1)), padL: 44, cell: 30 });
  lineChart($("#dd"), { labels: s.dates.map((d) => fdate(d)), series: [{ name: "Drawdown", data: dd, color: "var(--rose)" }], area: true, height: 180, fmt: (v) => v + "%", tipFmt: (v) => v.toFixed(2) + "%" });
};

/* ---------- Allocation + rebalance ---------- */
PAGE.allocation = () => {
  const cls = byClass(), tot = total();
  const legs = cls.map((x) => ({ c: x.c, now: (x.v / tot) * 100, tgt: S.targets[x.c] || 0, diff: ((S.targets[x.c] || 0) / 100) * tot - x.v }));
  view.innerHTML = `<div class="grid">
    <section class="card s7"><div class="card-h"><h2>Now vs target</h2><small>bar = now, line = target</small><span class="grow"></span><button class="btn" id="editT">${ic("edit")}Edit targets</button></div>
      <div class="alloc-bars">${legs.map((l) => `<div class="ab"><div class="ab-h"><span>${l.c}</span><span class="num">${l.now.toFixed(1)}% <span class="muted">→ ${l.tgt}%</span></span></div><div class="ab-t"><i data-w="${l.now}" style="background:${CLASSES[l.c]}"></i><b style="left:${l.tgt}%"></b></div></div>`).join("")}</div></section>
    <section class="card s5"><div class="card-h"><h2>Rebalance plan</h2></div><div class="trade-legs">${legs.filter((l) => Math.abs(l.diff) > 50).map((l) => `<div><span>${l.diff > 0 ? "Add to" : "Trim"} ${l.c}</span><b class="num ${l.diff > 0 ? "up" : "down"}">${money(l.diff, { plus: true })}</b></div>`).join("") || '<p class="muted">You are on target. Nothing to do.</p>'}</div><div class="cc-df" style="padding:16px 0 0"><button class="btn primary" id="reb">${ic("refresh")}Rebalance now</button></div></section>
    <section class="card s12"><div class="card-h"><h2>Value by class</h2></div><div id="clsBars"></div></section>
  </div>`;
  requestAnimationFrame(() => $$("[data-w]", view).forEach((i) => (i.style.width = i.dataset.w + "%")));
  barChart($("#clsBars"), { labels: cls.map((x) => x.c), height: 220, series: [{ name: "Now", data: cls.map((x) => Math.round(x.v)), color: "var(--accent)" }, { name: "Target", data: cls.map((x) => Math.round(((S.targets[x.c] || 0) / 100) * tot)), color: "var(--teal)" }], fmt: (v) => "$" + short(v), tipFmt: usd, radius: 6 });
  $("#editT").addEventListener("click", () => formModal({ title: "Target mix", intro: "Targets must add up to 100%.", values: S.targets, fields: Object.keys(CLASSES).map((c) => ({ name: c, label: c + " %", type: "number", required: true, min: 0, max: 100, half: true })), submit: "Save targets", onSubmit: (v) => { const t = sum(Object.values(v)); if (Math.abs(t - 100) > 0.01) return `They add up to ${t}%. Make it 100%.`; S.targets = v; save(); toast("Targets saved"); rerender(); } }));
  $("#reb").addEventListener("click", () => confirmBox("Buy and sell across your holdings so each class matches its target?", "Rebalance", "primary").then((ok) => {
    if (!ok) return;
    legs.forEach((l) => {
      if (l.c === "Cash") return;
      const hs = S.hold.filter((h) => asset(h.t).cls === l.c), cur = sum(hs.map(valOf));
      if (!hs.length) return;
      const k = cur ? (cur + l.diff) / cur : 1;
      hs.forEach((h) => (h.q = Math.max(0, h.q * k)));
    });
    S.cash = (S.targets.Cash / 100) * tot;
    save(); toast("Rebalanced to your targets"); note("Portfolio rebalanced");
    const bars = $$(".ab-t i", view); render("allocation", true); $$(".ab-t i", view).forEach((i, k) => { if (bars[k]) i.style.width = bars[k].style.width; requestAnimationFrame(() => requestAnimationFrame(() => (i.style.width = i.dataset.w + "%"))); });
  }));
};

/* ---------- Watchlist ---------- */
PAGE.watchlist = () => {
  view.innerHTML = `<div class="wl">${S.watch.map((t) => asset(t)).filter(Boolean).map((a) => { reseed(hue(a.t)); const d = Array.from({ length: 30 }, (_, i) => a.price * (1 + Math.sin(i / 4 + hue(a.t)) * 0.04 + rand(-0.01, 0.01))); d[29] = a.price; return `<section class="card"><div class="card-h">${tkr(a)}<span class="grow"></span><button class="icon-btn" style="width:32px;height:32px" data-unw="${a.t}" aria-label="Remove ${a.t}">${ic("x")}</button></div><div class="price num" data-live="price" data-t="${a.t}">${usd(a.price)}</div><span class="chg num ${achg(a) >= 0 ? "up" : "down"}" data-live="chg" data-t="${a.t}">${pct(achg(a), 2)}</span>${spark(d, "var(--accent)", 220, 46)}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" data-buy="${a.t}">Buy</button><button class="btn sm" data-al="${a.t}">${ic("bell")}Alert</button></div></section>`; }).join("")}<section class="card" style="display:grid;place-items:center;min-height:200px"><button class="btn primary" id="addW">${ic("plus")}Add to watchlist</button></section></div>
    <section class="card" style="margin-top:18px"><div class="card-h"><h2>Price alerts</h2></div><div id="alTbl"></div></section>`;
  view.querySelector(".wl").addEventListener("click", (e) => {
    const u = e.target.closest("[data-unw]"), b = e.target.closest("[data-buy]"), al = e.target.closest("[data-al]");
    if (u) { S.watch = S.watch.filter((x) => x !== u.dataset.unw); save(); toast(u.dataset.unw + " removed"); rerender(); }
    if (b) tradeDrawer(b.dataset.buy);
    if (al) { const a = asset(al.dataset.al); formModal({ title: "Alert for " + a.name, values: { op: "above", p: +(a.price * 1.03).toFixed(2) }, fields: [{ name: "op", label: "When the price goes", type: "select", options: ["above", "below"], half: true }, { name: "p", label: "Price ($)", type: "number", required: true, min: 0.01, half: true, check: (v, x) => (x.op === "above" && v <= a.price ? "Pick a price above " + usd(a.price) : x.op === "below" && v >= a.price ? "Pick a price below " + usd(a.price) : "") }], submit: "Create alert", onSubmit: (v) => { S.alerts.push({ id: uid(), t: a.t, ...v, done: false }); save(); toast("Alert created"); rerender(); } }); }
  });
  $("#addW").addEventListener("click", () => pickBox("Add to watchlist", ASSETS.filter((a) => !S.watch.includes(a.t)).map((a) => ({ value: a.t, label: a.name, hint: usd(a.price) }))).then((t) => { if (t) { S.watch.push(t); save(); toast(t + " added"); rerender(); } }));
  dataTable($("#alTbl"), { rows: () => S.alerts, search: false, size: 5, cols: [{ k: "t", label: "Holding", f: (v) => tkr(asset(v)) }, { k: "op", label: "When" }, { k: "p", label: "Price", cls: "r", f: (v) => usd(v) }, { k: "done", label: "Status", f: (v) => (v ? '<span class="up">Triggered</span>' : '<span class="muted">Watching</span>') }, { k: "x", label: "", sort: false, f: () => `<div class="rowbtns"><button data-act="del" aria-label="Delete alert">${ic("trash")}</button></div>` }], onAct: (a, r) => confirmBox("Delete this alert?").then((ok) => { if (ok) { S.alerts = S.alerts.filter((x) => x !== r); save(); rerender(); } }), empty: "No alerts yet", emptyIcon: "bell" });
};

/* ---------- Settings ---------- */
PAGE.settings = () => {
  view.innerHTML = `<div class="grid"><section class="card s12">
    <div class="set-row"><div><b>Profile</b><small>${esc(S.profile.name)} · ${esc(S.profile.plan)}</small></div><button class="btn" id="prof">${ic("user")}Edit</button></div>
    <div class="set-row"><div><b>Compare with index</b><small>Show the World Index on the main chart</small></div><button class="bench" id="benchS" aria-pressed="${S.bench}"><span class="sw"></span>${S.bench ? "On" : "Off"}</button></div>
    <div class="set-row"><div><b>Add cash</b><small>Cash now ${usd(S.cash)}</small></div><button class="btn" id="dep">${ic("plus")}Deposit</button></div>
    <div class="set-row"><div><b>Theme</b><small>Graphite night or ivory day</small></div><button class="btn" data-theme-toggle>${ic("moon")}Toggle theme</button></div>
    <div class="set-row"><div><b>Reset demo data</b><small>Holdings, cash, targets and watchlist</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div></section></div>`;
  $("#prof").addEventListener("click", () => formModal({ title: "Profile", values: S.profile, fields: [{ name: "name", label: "Name", required: true }, { name: "plan", label: "Goal", type: "select", options: ["Long-term growth", "Steady income", "Keep it safe"] }], onSubmit: (v) => { S.profile = v; save(); drawMe(); toast("Profile saved"); rerender(); } }));
  $("#benchS").addEventListener("click", () => { S.bench = !S.bench; save(); heroPrev = null; toast(S.bench ? "Index comparison on" : "Index comparison off"); rerender(); });
  $("#dep").addEventListener("click", () => formModal({ title: "Deposit cash", fields: [{ name: "amt", label: "Amount ($)", type: "number", required: true, min: 1, max: 1000000 }], submit: "Deposit", onSubmit: (v) => { S.cash += v.amt; save(); toast(usd(v.amt) + " added"); rerender(); } }));
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data?", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); save(); drawMe(); drawBell(); heroPrev = null; toast("Demo data reset"); rerender(); } }));
};

/* ---------- Gentle live prices: every 2 seconds, paused while hidden ---------- */
every(2000, () => {
  ASSETS.forEach((a) => (a.price = Math.max(0.5, a.price * (1 + (Math.random() - 0.5) * a.vol * 2))));
  S.alerts.forEach((al) => { if (al.done) return; const p = asset(al.t).price; if ((al.op === "above" && p >= al.p) || (al.op === "below" && p <= al.p)) { al.done = true; note(`${al.t} is ${al.op} ${usd(al.p)}`); toast(`Alert: ${al.t} moved ${al.op} ${usd(al.p)}`, "warn"); save(); } });
  $$("[data-live]").forEach((el) => {
    const k = el.dataset.live, a = el.dataset.t && asset(el.dataset.t);
    if (k === "price" && a) el.textContent = usd(a.price);
    if (k === "chg" && a) { el.textContent = pct(achg(a), 2); el.classList.toggle("up", achg(a) >= 0); el.classList.toggle("down", achg(a) < 0); }
    if (k === "day") el.textContent = money(dayChg(), { plus: true });
    if (k === "dayp") { const v = (dayChg() / total()) * 100; el.textContent = pct(v, 2); el.className = "chg " + (v >= 0 ? "up" : "down"); }
  });
});

/* ---------- Start ---------- */
drawMe();
drawBell();
initShell(() => pageCmds(PAGES, ASSETS.map((a) => ({ label: "Trade " + a.name, icon: "line", run: () => tradeDrawer(a.t) })).concat(Object.keys(RANGES).map((r) => ({ label: "Show " + r + " on the main chart", icon: "clock", run: () => { range = r; if (current === "overview") render("overview", true); else location.hash = "#/overview"; } })))));
startRouter(PAGES.map((p) => p[0]), "overview", render);
</script>
</body>
</html>
