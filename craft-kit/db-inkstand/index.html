<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkstand · black and white sales desk</title>
<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-inkstand:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Inkstand look: black ink on paper, editorial ---------- */
:root {
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .9, .2, 1); --spring: cubic-bezier(.3, 1.4, .6, 1);
  --bg: #f7f6f1; --surface: #fffefa; --surface2: #ecebe4; --ink: #0d0d0d; --muted: #5d5d58; --line: #0d0d0d; --soft: #cfcdc4; --line-strong: #0d0d0d;
  --accent: #0d0d0d; --accent-ink: #fffefa; --ok: #0d0d0d; --warn: #5d5d58; --err: #c3221b; --focus: #0d0d0d;
  --c1: #0d0d0d; --c2: #6a6a64; --c3: #a6a59d; --c4: #3a3a36; --c5: #8a8982; --c6: #c9c8bf;
  --r: 0; --r-sm: 0; --r-btn: 0; --r-seg: 0; --overlay: rgba(13, 13, 13, .5); --tip-bg: #0d0d0d; --tip-ink: #fffefa; --grid: #dedcd3;
  --chip-on: #0d0d0d; --chip-on-ink: #fffefa;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0b0b0a; --surface: #111110; --surface2: #1d1d1b; --ink: #f4f2ea; --muted: #a3a29a; --line: #f4f2ea; --soft: #33332f; --line-strong: #f4f2ea;
  --accent: #f4f2ea; --accent-ink: #0b0b0a; --ok: #f4f2ea; --warn: #a3a29a; --err: #ff5a4f; --focus: #f4f2ea;
  --c1: #f4f2ea; --c2: #a3a29a; --c3: #6b6a64; --c4: #d2d0c6; --c5: #85847d; --c6: #4a4a45;
  --tip-bg: #f4f2ea; --tip-ink: #0b0b0a; --grid: #2a2a27; --chip-on: #f4f2ea; --chip-on-ink: #0b0b0a; --overlay: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
body { background: var(--bg); }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--ink); color: var(--bg); padding: 8px 12px; }
.skip:focus { left: 8px; }
.grow { flex: 1; }
.mut { color: var(--muted); font-size: 13px; }
/* sharp ink controls */
.btn { border: 1.5px solid var(--ink); background: transparent; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 700; min-height: 38px; box-shadow: 3px 3px 0 var(--ink); }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.danger { background: var(--err); border-color: var(--err); box-shadow: 3px 3px 0 var(--ink); }
.btn.ghost { box-shadow: none; }
.ibtn { border: 1.5px solid var(--ink); background: transparent; border-radius: 0; }
.k-modal, .k-pop { border: 1.5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
.k-mh { border-bottom: 1.5px solid var(--ink); }
.k-mh h2 { font-family: var(--serif); font-size: 21px; }
.k-mf { border-top: 1px solid var(--soft); }
.k-table th { border-bottom: 1.5px solid var(--ink); color: var(--ink); letter-spacing: .1em; font-size: 11px; }
.k-table td { border-bottom: 1px solid var(--soft); }
.k-chip { border-color: var(--ink); border-radius: 0; color: var(--ink); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; font-weight: 700; }
.k-search { border: 1.5px solid var(--ink); }
.k-field input, .k-field select, .k-field textarea, .k-input { border: 1.5px solid var(--ink); }
.k-badge { border-radius: 0; border: 1px solid currentColor; background: transparent !important; text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.k-badge::before { border-radius: 0; }
.k-badge.err { color: var(--err); }
.k-seg { background: transparent; border: 1.5px solid var(--ink); padding: 0; gap: 0; }
.k-seg button { color: var(--ink); text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; }
.k-seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.k-toast { border-radius: 0; box-shadow: 4px 4px 0 rgba(0, 0, 0, .25); }
.k-av { border-radius: 0; background: var(--surface2) !important; color: var(--ink) !important; }
.k-delta.up { color: var(--ink); } .k-delta.down { color: var(--err); }
.k-line { stroke-width: 2; }
.k-hbr { border-radius: 0; }

/* ---------- Masthead navigation ---------- */
.app { min-height: 100vh; overflow-x: clip; }
.mast { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 3px double var(--ink); }
.mast-row { display: flex; align-items: center; gap: 10px; padding: 10px 28px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.logo { width: 34px; height: 34px; }
.brand b { display: block; font-family: var(--serif); font-size: 22px; letter-spacing: -.01em; line-height: 1; }
.brand small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin-top: 3px; }
.menu-btn { display: none; }
.nav { position: relative; display: flex; gap: 0; padding: 0 28px; max-width: 1400px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.nav a { position: relative; z-index: 1; padding: 11px 14px 12px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; white-space: nowrap; transition: color .2s; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }
.nav .k-marker { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ink); transition: transform .45s var(--ease), width .35s var(--ease); }
#view { max-width: 1400px; margin: 0 auto; padding: 22px 28px 50px; min-width: 0; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 1.5px solid var(--ink); padding-bottom: 14px; margin-bottom: 18px; }
.ph h1 { margin: 0; font-family: var(--serif); font-size: 38px; font-weight: 700; letter-spacing: -.02em; }
.ph p { margin: 4px 0 0; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 16px; }
.ph-act { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.k-in { animation-name: inkIn; animation-duration: .7s; }
@keyframes inkIn { from { opacity: 0; clip-path: inset(0 0 100% 0); } }

/* ---------- Cards: ruled boxes ---------- */
.card { background: var(--surface); border: 1.5px solid var(--ink); padding: 16px; min-width: 0; transition: transform .25s var(--ease), box-shadow .25s; }
.card:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--soft); padding-bottom: 8px; margin-bottom: 12px; }
.card-h h2 { margin: 0; font-family: var(--serif); font-size: 19px; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-bottom: 18px; border: 1.5px solid var(--ink); }
.figs .card { border: 0; border-right: 1px solid var(--soft); }
.figs .card:last-child { border-right: 0; }
.figs .card:hover { transform: none; box-shadow: none; background: var(--surface2); }
.fig span { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: var(--muted); }
.fig b { display: block; font-family: var(--serif); font-size: 32px; letter-spacing: -.02em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fx { font-size: 12px; color: var(--muted); min-height: 16px; }
.cols { display: grid; grid-template-columns: 1.5fr repeat(4, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; margin-bottom: 18px; }

/* ---------- The live report (signature) ---------- */
.paper { border-bottom: 1.5px solid var(--ink); padding-bottom: 14px; }
.masthead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.masthead span { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.masthead span:last-child { text-align: right; }
.masthead h1 { margin: 0; font-family: var(--serif); font-size: clamp(34px, 6vw, 64px); font-weight: 800; letter-spacing: -.035em; line-height: .95; text-align: center; }
.ticker { display: flex; align-items: stretch; border-bottom: 3px double var(--ink); overflow: hidden; }
.tk-l { flex: none; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; padding: 8px 12px; display: flex; align-items: center; gap: 7px; }
.tk-l::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--err); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.tk-w { flex: 1; overflow: hidden; position: relative; }
.tk-r { display: flex; white-space: nowrap; }
.tk-i { padding: 8px 18px; border-right: 1px solid var(--soft); font-size: 13px; }
.tk-i b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; margin-right: 6px; }
.tk-i em { font-style: normal; font-family: var(--mono); font-weight: 700; margin-left: 6px; }
.tk-i.new { animation: tkIn .8s var(--ease); background: var(--surface2); }
@keyframes tkIn { from { margin-left: -260px; opacity: 0; } }
.hl { font-family: var(--serif); font-size: clamp(26px, 3.4vw, 44px); line-height: 1.08; letter-spacing: -.02em; margin: 16px 0 8px; min-height: 2.2em; max-width: 28ch; }
.hl.typing::after { content: ""; display: inline-block; width: .5em; height: .9em; margin-left: 3px; background: var(--ink); vertical-align: -.08em; animation: blink .6s infinite; }
.dek { margin: 0; font-family: var(--serif); font-style: italic; color: var(--muted); max-width: 70ch; }
.kick { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .16em; font-weight: 800; border-bottom: 1px solid var(--ink); padding-bottom: 5px; margin-bottom: 8px; }
.lead .huge { display: block; font-family: var(--serif); font-size: 46px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.lead p { font-family: var(--serif); font-size: 15px; margin: 8px 0; }
.chcol b { display: block; font-family: var(--serif); font-size: 25px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chcol small { display: block; font-size: 12px; color: var(--muted); }
.chbar { height: 10px; border: 1px solid var(--ink); margin: 10px 0 6px; }
.chbar i { display: block; height: 100%; background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 5px); animation: kW 1.1s var(--ease) backwards .3s; }
.brief ul { list-style: none; margin: 0; padding: 0; }
.brief li { font-family: var(--serif); font-size: 15px; padding: 9px 0; border-bottom: 1px solid var(--soft); }
.brief li::first-letter { font-size: 1.15em; }
.lnk { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font: 600 12px var(--font); text-transform: uppercase; letter-spacing: .08em; margin-left: 6px; }

/* ---------- Market till ---------- */
.till { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0; border-top: 1.5px solid var(--ink); border-left: 1.5px solid var(--ink); }
.titem { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px; border: 0; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); background: var(--surface); text-align: left; transition: background-color .15s, color .15s; animation: inkIn .5s var(--ease) backwards; animation-delay: calc(var(--i) * 30ms); }
.titem:hover { background: var(--ink); color: var(--bg); }
.titem:hover small { color: inherit; }
.titem[disabled] { opacity: .35; pointer-events: none; }
.titem.hit { animation: hit .35s var(--ease); }
@keyframes hit { 40% { background: var(--ink); color: var(--bg); transform: scale(.96); } }
.titem .art { width: 46px; height: 46px; margin-bottom: 6px; }
.titem span { font-size: 13px; font-weight: 600; line-height: 1.25; min-height: 2.5em; }
.titem b { font-family: var(--mono); font-size: 14px; }
.titem small { font-size: 11px; color: var(--muted); }
.art { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.mini-art { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--ink); flex: none; }
.mini-art .art { width: 26px; height: 26px; }
.bill { position: sticky; top: 120px; padding: 0; }
.bill:hover { transform: none; box-shadow: none; }
.bill-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-bottom: 1.5px solid var(--ink); }
.bill-h b { font-family: var(--serif); font-size: 22px; }
.bill-h small { font-family: var(--mono); color: var(--muted); }
.bill-l { list-style: none; margin: 0; padding: 4px 16px; max-height: 300px; overflow: auto; }
.bill-l li { display: grid; grid-template-columns: 1fr auto 76px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--soft); font-size: 13.5px; animation: inkIn .35s var(--ease); }
.bill-l li.k-emptyp { display: block; }
.bill-l small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.bill-l > li > b { text-align: right; font-family: var(--mono); }
.q { display: inline-flex; align-items: center; border: 1px solid var(--ink); }
.q button { width: 26px; height: 26px; border: 0; background: transparent; font-weight: 700; }
.q button:hover { background: var(--ink); color: var(--bg); }
.q b { min-width: 22px; text-align: center; font-family: var(--mono); }
.bill-t { padding: 10px 16px; border-top: 1.5px solid var(--ink); display: grid; gap: 4px; font-family: var(--mono); font-size: 13px; }
.bill-t div { display: flex; justify-content: space-between; }
.bill-t .tot { font-size: 20px; font-weight: 800; padding-top: 4px; }
.bill-a { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 12px; }
.bill .big { width: calc(100% - 32px); margin: 0 16px 16px; }

/* ---------- Wholesale invoice paper ---------- */
.invoice { position: relative; background: #fffefa; color: #0d0d0d; border: 1.5px solid #0d0d0d; padding: 26px; font-size: 13.5px; overflow: hidden; animation: kPrint .8s var(--ease) backwards; }
.iv-h { display: flex; justify-content: space-between; border-bottom: 3px double #0d0d0d; padding-bottom: 12px; }
.iv-h b { font-family: var(--serif); font-size: 22px; display: block; }
.iv-h small { color: #5d5d58; }
.iv-n { text-align: right; }
.iv-n b { letter-spacing: .3em; font-size: 16px; font-family: var(--font); }
.iv-to { display: flex; justify-content: space-between; gap: 20px; margin: 14px 0; }
.iv-to small { display: block; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: #5d5d58; }
.iv-to b { display: block; margin-bottom: 4px; }
.invoice table { width: 100%; border-collapse: collapse; }
.invoice th { text-align: left; border-bottom: 1.5px solid #0d0d0d; padding: 6px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.invoice td { padding: 7px 0; border-bottom: 1px solid #ddd; }
.invoice .num { text-align: right; font-family: var(--mono); }
.iv-t { display: flex; justify-content: flex-end; gap: 20px; align-items: baseline; margin-top: 12px; }
.iv-t b { font-family: var(--serif); font-size: 26px; }
.iv-f { font-family: var(--serif); font-style: italic; color: #5d5d58; margin: 14px 0 0; }
.stamp { position: absolute; right: 26px; top: 90px; border: 4px solid #0d0d0d; padding: 4px 14px; font: 900 26px var(--font); letter-spacing: .18em; transform: rotate(-12deg); opacity: .85; animation: stamp .5s .4s var(--spring) backwards; }
.stamp.red { color: #c3221b; border-color: #c3221b; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } }
.stk { list-style: none; margin: 0; padding: 0; }
.stk li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--soft); }
.stk b { display: block; font-family: var(--serif); font-size: 15px; }
.stk small { color: var(--muted); font-size: 12px; }
.stk span { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 0 0 14px; }

/* ---------- Marketplaces ---------- */
.mp-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.mp-row small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.mp-row b { font-family: var(--serif); font-size: 24px; }
.sync { height: 6px; border: 1px solid var(--ink); margin-bottom: 12px; overflow: hidden; }
.sync i { display: block; height: 100%; width: 0; background: var(--ink); }
.sync.go i { animation: syncBar 1.5s var(--ease) forwards; }
@keyframes syncBar { to { width: 100%; } }
.mpc .mut { display: block; margin-top: 8px; }
.tog { position: relative; width: 44px; height: 24px; border: 1.5px solid var(--ink); background: transparent; padding: 0; border-radius: 0; }
.tog i { position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; background: var(--ink); opacity: .35; transition: transform .3s var(--spring), opacity .2s; }
.tog[aria-checked="true"] { background: var(--ink); }
.tog[aria-checked="true"] i { transform: translateX(20px); background: var(--bg); opacity: 1; }

  const L = openModal({ title: "Search", cls: "k-cmdk", body: `<label class="k-search k-cmdin">${ic("search")}<span class="sr">Search pages and actions</span><input type="search" placeholder="Jump to a page or action…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="cmdl"></label><ul id="cmdl" class="k-cmdl" role="listbox"></ul>` });

/* a QR-like pattern drawn from a seed (decoration only) */
function qrish(sd) {

    const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const on = f ? (x % 6 === 0 || y % 6 === 0 || (x > 13 ? x - 14 : x) % 6 === 0 || (y > 13 ? y - 14 : y) % 6 === 0 || ((x % 7 > 1 && x % 7 < 5) && (y % 7 > 1 && y % 7 < 5))) : r() > 0.5;

}

}

function productForm(p) {
  formModal({ title: p ? "Edit product" : "New product", drawer: true, fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "price", label: "Retail price (Rs)", type: "number", min: 1, req: true }, { k: "whole", label: "Wholesale price (Rs)", type: "number", min: 0, req: true }, { k: "cost", label: "Cost to make (Rs)", type: "number", min: 0, req: true }, { k: "stock", label: "In stock", type: "number", min: 0, step: 1, req: true }, { k: "art", label: "Picture", type: "select", options: Object.keys(ART) }], values: p || { art: "book", stock: 20 },
    save: (x) => { if (x.whole > x.price) return "Wholesale should be below retail"; const d = { name: x.name, price: Math.round(x.price), whole: Math.round(x.whole), cost: Math.round(x.cost), stock: Math.round(x.stock), art: x.art }; if (p) Object.assign(p, d); else S.products.unshift(Object.assign({ id: "I" + Date.now().toString(36), mp: [false, false] }, d)); save(); toast(p ? "Saved" : "Product added"); Router.refresh(); return true; },
    del: p ? () => { S.products = S.products.filter((x) => x !== p); save(); toast("Deleted", "info"); Router.refresh(); } : null });
}
Router.add("products", "Products", (v) => {
  v.innerHTML = head("Products", "Retail and wholesale prices, cost and stock for everything you make.", `<button type="button" class="btn primary" data-act="addProd">${ic("plus")} New product</button>`) + `<div class="card"><div id="pT"></div></div>`;
  table($("#pT", v), { rows: () => S.products, keys: ["name"], chips: { values: ["All", "Low stock", "Sold out"], test: (p, c) => (c === "Sold out" ? p.stock <= 0 : p.stock > 0 && p.stock <= 5) }, size: 10, onRow: (id) => productForm(prod(id)), caption: "Products",
    cols: [{ label: "Product", k: "name", f: (p) => `<div class="k-cellp"><span class="mini-art">${art(p.art)}</span><b>${esc(p.name)}</b></div>` }, { label: "Retail", k: "price", f: (p) => money(p.price), cls: "num" }, { label: "Wholesale", k: "whole", f: (p) => money(p.whole), cls: "num" }, { label: "Cost", k: "cost", f: (p) => money(p.cost), cls: "num" }, { label: "Margin", v: (p) => 1 - p.cost / p.price, f: (p) => pct(1 - p.cost / p.price, 0), cls: "num" }, { label: "Stock", k: "stock", f: (p) => (p.stock <= 0 ? badge("Sold out", "err") : p.stock <= 5 ? badge(p.stock + " left", "warn") : String(p.stock)), cls: "num" }] });
});
ACT.addProd = () => productForm(null);

/* ---------- Report ---------- */
let rRange = "30D";
Router.add("report", "Report", (v) => {
  v.innerHTML = head("Report", "What each channel really earns once fees and wholesale prices are taken off.", `${seg("rr", ["7D", "30D", "12M"], rRange, "Range")}<button type="button" class="btn" data-act="printRep">${ic("print")} Print</button><button type="button" class="btn" data-act="csvRep">${ic("download")} CSV</button>`)
    + `<div class="figs" id="rF"></div><div class="cols2"><div class="card"><div class="card-h"><h2>Sales by channel</h2></div><div id="rLine"></div></div><div class="card"><div class="card-h"><h2>Share</h2></div><div id="rDon"></div></div></div><div class="card"><div class="card-h"><h2>Channel earnings</h2></div><div id="rT"></div></div>`;
  segWire($(".ph-act", v), "rr", (x) => { rRange = x; drawRep(); });
  drawRep();
});
const repRows = () => CH.map((c, i) => { const g = rangeSum(S.d.rev[i], rRange), fee = Math.round(g * chFee(i)); return { id: c, ch: c, g, fee, net: g - fee, d: rangeDelta(S.d.rev[i], rRange) }; });
function drawRep() {
  const rows = repRows(), g = sum(rows, (r) => r.g), f = $("#rF"); if (!f) return;
  f.innerHTML = fig("Gross sales", g, "money", delta(rangeDelta(S.d.rev.reduce((a, r) => a.map((x, k) => x + r[k]), zeros()), rRange))) + fig("Fees", sum(rows, (r) => r.fee), "money") + fig("Net", sum(rows, (r) => r.net), "money") + fig("Best channel", Math.max(...rows.map((r) => r.net)), "money", `<small>${esc(rows.slice().sort((a, b) => b.net - a.net)[0].ch)}</small>`);
  counts(f);
  const a = byRange(S.d.rev[0], rRange);
  lineChart($("#rLine"), { labels: a.labels, series: CH.map((c, i) => ({ name: c, data: byRange(S.d.rev[i], rRange).data, color: CHC[i], dash: i === 3 })), fmt: short, tip: money, h: 240, area: false, label: "Sales by channel" });
  donut($("#rDon"), { items: rows.map((r, i) => ({ name: r.ch, value: r.g, color: CHC[i] })), fmt: moneyS, sub: rRange, size: 170 });
  table($("#rT"), { rows: () => rows, search: false, size: 6, caption: "Channel earnings", cols: [{ label: "Channel", k: "ch", f: (r) => `<b>${esc(r.ch)}</b>` }, { label: "Gross", k: "g", f: (r) => money(r.g), cls: "num" }, { label: "Fees", k: "fee", f: (r) => "-" + money(r.fee), cls: "num" }, { label: "Net", k: "net", f: (r) => `<b>${money(r.net)}</b>`, cls: "num" }, { label: "Change", v: (r) => r.d || 0, f: (r) => delta(r.d) || "–" }] });
}
Object.assign(ACT, { printRep: () => { document.body.classList.add("print-page"); try { window.print(); } catch (e) { /* ignore */ } setTimeout(() => document.body.classList.remove("print-page"), 600); }, csvRep: () => csv("inkstand-report-" + rRange + ".csv", repRows(), [["Channel", (r) => r.ch], ["Gross", (r) => r.g], ["Fees", (r) => r.fee], ["Net", (r) => r.net]]) });

/* ---------- Settings ---------- */
Router.add("settings", "Settings", (v) => {
  v.innerHTML = head("Settings", "Your shop, fees and the look of the desk.", "") + `<div class="cols2"><form class="card" id="sF" novalidate><div class="card-h"><h2>Shop</h2></div>${fieldsHTML([{ k: "shop", label: "Shop name", req: true, full: true }, { k: "city", label: "City", type: "select", options: CITIES }, { k: "mpFee", label: "Marketplace fee %", type: "number", min: 0, max: 40, req: true }, { k: "market", label: "Usual market", full: true, req: true }], S.cfg)}<div class="set-f"><button class="btn primary" type="submit">Save</button></div></form><div class="card"><div class="card-h"><h2>Desk</h2></div><div class="set-row"><div><b>Ink or paper</b><small>Black on white, or white on black</small></div><button type="button" class="btn" data-act="theme">${ic("moon")} Switch</button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample shop</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const f = $("#sF", v);
  f.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(f, [{ k: "shop", label: "Shop name", req: true }, { k: "city", label: "City" }, { k: "mpFee", label: "Fee", type: "number", min: 0, max: 40, req: true }, { k: "market", label: "Market", req: true }]); if (!x) return; Object.assign(S.cfg, x); save(); paint(); toast("Saved"); });
});
ACT.reset = () => confirmBox("Reset all demo data on this device?", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); Cart.clear(); save(); paint(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset" });

/* ---------- Boot ---------- */
function paint() { $("#shopName").textContent = S.cfg.shop; }
S = loadState(seedData, VER);
paintIcons(); Theme.label(); paint();
CMDS = [{ label: "New wholesale invoice", run: newInvoice }, { label: "Open the market till", run: () => (location.hash = "#/market") }, { label: "New product", run: () => productForm(null) }, { label: "Switch theme", run: () => Theme.toggle() }];
Notes.add(`${S.invoices.filter((iv) => invState(iv) === "Overdue").length} wholesale invoices are overdue`, "err");
Notes.add(`${S.orders.filter((o) => o.status === "To pack").length} orders to pack today`, "warn");
Router.start();

</script>
</body>
</html>
