<!doctype html>
<!-- Chill & Craft · Shortwave · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shortwave · Radio station dial picker</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --wall: #f0e1dc;
    --pat: rgba(150, 70, 70, 0.1);
    --ink: #2e1613;
    --muted: #7c5650;
    --shelf: #8a5a36;
    --wood-a: #8a5230;
    --wood-b: #4b2914;
    --brass: #d9ac52;
    --glass: #f8e9c8;
    --amber: #ffb347;
    --amber-rgb: 255, 179, 71;
    --vfd: #1b1310;
    --eye: #4dff7c;
    --focus: #c2302f;
    --shadow: rgba(80, 25, 20, 0.5);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --wall: #24100f;
    --pat: rgba(255, 170, 140, 0.05);
    --ink: #f7e6df;
    --muted: #c19d93;
    --shelf: #4a2d1c;
    --focus: #ffb347;
    --shadow: rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--wall); }
  /* wallpaper: a small diamond damask of dots */
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden;
    background: radial-gradient(70% 55% at 50% 40%, rgba(255, 200, 140, 0.18), transparent 70%), radial-gradient(circle, var(--pat) 22%, transparent 24%) 0 0 / 34px 34px, radial-gradient(circle, var(--pat) 12%, transparent 14%) 17px 17px / 34px 34px, var(--wall); }
  .wrap { width: min(420px, 100%); }
  .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 0 6px 12px; }
  .eyebrow { margin: 0 0 2px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 850; }

  /* ---------- Cabinet ---------- */
  .radio { position: relative; padding: 16px 16px 14px; border-radius: 34px 34px 18px 18px;
    background: repeating-linear-gradient(92deg, rgba(0, 0, 0, 0) 0 9px, rgba(0, 0, 0, 0.07) 9px 11px, rgba(255, 255, 255, 0.03) 11px 15px), linear-gradient(180deg, var(--wood-a), var(--wood-b));
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), inset 0 0 0 2px rgba(0, 0, 0, 0.25), 0 34px 40px -30px var(--shadow); }
  .shelf { height: 14px; margin: 0 -12px; border-radius: 4px; background: linear-gradient(180deg, var(--shelf), #3a2213); box-shadow: 0 18px 26px -14px var(--shadow); }

  /* dial window: the radio group of stations sits on the scale */
  .dial { position: relative; height: 104px; border-radius: 18px 18px 10px 10px; overflow: hidden; background: var(--glass); box-shadow: inset 0 0 0 3px var(--brass), inset 0 6px 14px rgba(0, 0, 0, 0.25); }
  .dial .back { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 60%, rgba(var(--amber-rgb), 0.55), rgba(var(--amber-rgb), 0) 75%); opacity: var(--warm, 1); }
  .dial .off { position: absolute; inset: 0; background: rgba(40, 20, 10, 0.45); opacity: calc(1 - var(--warm, 1)); pointer-events: none; }
  .dial svg { position: absolute; left: 14px; right: 14px; top: 0; width: calc(100% - 28px); height: 100%; overflow: visible; }
  .dial::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: linear-gradient(170deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 38%); }
  .nums { position: absolute; left: 14px; right: 14px; top: 64px; height: 12px; }
  .nums span { position: absolute; translate: -50% 0; font-size: 0.56rem; font-weight: 800; color: #6b4a2c; font-variant-numeric: tabular-nums; }
  fieldset.stations { position: absolute; left: 14px; right: 14px; top: 0; bottom: 0; margin: 0; padding: 0; border: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .st { position: absolute; top: 8px; translate: -50% 0; cursor: pointer; }
  .st.lo { top: auto; bottom: 8px; }
  .st.edge-l { translate: -12px 0; }
  .st.edge-r { translate: calc(-100% + 12px) 0; }
  .st input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .st span { display: block; padding: 3px 7px; border-radius: 6px; font-size: 0.62rem; font-weight: 850; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; color: #6b4a2c; transition: color 0.25s, background 0.25s, box-shadow 0.25s; }
  .st input:checked + span { color: #fff; background: #b8332b; box-shadow: 0 0 12px rgba(184, 51, 43, 0.55); }
  .st input:focus-visible + span { outline: 2px solid #2e1613; outline-offset: 2px; }
  .st:hover span { color: #2e1613; }

  /* speaker grille: woven cloth with a canvas for static and the music glow */
  .grille { position: relative; height: 118px; margin-top: 12px; border-radius: 14px; overflow: hidden;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 3px), linear-gradient(180deg, #c9a774, #a07f4e);
    box-shadow: inset 0 0 0 3px #3a2010, inset 0 0 18px rgba(0, 0, 0, 0.45); }
  :root[data-theme="dark"] .grille { background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.2) 0 1px, transparent 1px 3px), linear-gradient(180deg, #8f7450, #64492b); }
  .grille canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge { position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 4px 12px; border-radius: 999px; background: linear-gradient(180deg, #f4d58c, #b9873a); color: #3a2010; font-size: 0.7rem; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase; box-shadow: 0 2px 0 #6e4a1a, 0 6px 10px rgba(0, 0, 0, 0.3); }

  /* bottom row: magic eye, display, tuning knob */
  .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 12px; }
  .eye { width: 42px; height: 42px; border-radius: 50%; background: #10140f; box-shadow: 0 0 0 3px var(--brass), inset 0 2px 6px rgba(0, 0, 0, 0.8); }
  .eye svg { display: block; width: 100%; height: 100%; }
  .vfd { min-width: 0; padding: 7px 10px; border-radius: 10px; background: var(--vfd); color: var(--amber); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.6), inset 0 0 14px rgba(var(--amber-rgb), 0.12); text-shadow: 0 0 8px rgba(var(--amber-rgb), 0.7); opacity: calc(0.25 + var(--warm, 1) * 0.75); }
  .vfd .f { display: flex; justify-content: space-between; gap: 6px; font-size: 1rem; font-weight: 800; line-height: 1.1; }
  .vfd .f small { font-size: 0.62rem; opacity: 0.75; align-self: flex-end; }
  .vfd .n { margin-top: 2px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vfd .p { font-size: 0.62rem; opacity: 0.72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .knob { position: relative; width: 56px; height: 56px; border-radius: 50%; cursor: grab; touch-action: none; background: repeating-conic-gradient(from 0deg, #2a1810 0 6deg, #4a2c1a 6deg 12deg); box-shadow: 0 0 0 3px var(--brass), 0 8px 12px -4px rgba(0, 0, 0, 0.6); }
  .knob::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7a4c2c, #2d1a0e 70%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); }
  .knob i { position: absolute; left: 50%; top: 11px; width: 5px; height: 12px; margin-left: -2.5px; border-radius: 3px; background: var(--brass); }

  /* controls under the radio */
  .ctl { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 14px; margin: 16px 6px 0; }
  .ctl label { display: flex; justify-content: space-between; font-size: 0.74rem; font-weight: 750; color: var(--muted); }
  .ctl output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; }
  input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 10%), rgba(124, 86, 80, 0.25); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 24px; margin-top: -9px; border: 0; border-radius: 4px; background: #c2302f; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
  input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(124, 86, 80, 0.25); }
  input[type="range"]::-moz-range-thumb { width: 12px; height: 24px; border: 0; border-radius: 4px; background: #c2302f; }
  .power { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--ink); color: var(--wall); font: inherit; font-size: 0.82rem; font-weight: 800; cursor: pointer; transition: transform 0.3s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .power:active { transform: scale(0.94); }
  .power:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .power i { width: 8px; height: 8px; border-radius: 50%; background: #5a4a40; }
  .power[aria-pressed="true"] i { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .fx svg { position: absolute; width: 18px; height: 18px; color: var(--amber); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 370px) { .radio { padding: 14px 12px 12px; } .grille { height: 100px; } .st span { font-size: 0.56rem; padding: 3px 5px; } }
  @media (min-width: 1100px) and (min-height: 820px) { .wrap { scale: 1.12; } }
  @media (prefers-reduced-motion: reduce) { .st span, .power { transition: none; } }
</style>
</head>
<body>
  <main class="stage">
    <section class="wrap" aria-labelledby="ttl">
      <div class="intro"><div><p class="eyebrow">Living room radio</p><h1 id="ttl">Shortwave</h1></div></div>
      <div class="radio" id="radio">
        <div class="dial" id="dial">
          <i class="back" aria-hidden="true"></i>
          <svg id="scale" viewBox="0 0 300 104" preserveAspectRatio="none" aria-hidden="true">
            <g id="ticks" stroke="#6b4a2c" stroke-linecap="round"></g>
            <g id="needle"><path d="M0 18 V 88" stroke="#c2302f" stroke-width="2.6" /><circle cx="0" cy="88" r="3" fill="#c2302f" /></g>
          </svg>
          <div class="nums" id="nums" aria-hidden="true"></div>
          <fieldset class="stations" id="stations"><legend>Station</legend></fieldset>
          <i class="off" aria-hidden="true"></i>
        </div>
        <div class="grille" id="grille" aria-hidden="true">
          <canvas id="noise"></canvas>
          <span class="badge">Shortwave</span>
        </div>
        <div class="row">
          <div class="eye" aria-hidden="true">
            <svg viewBox="0 0 42 42"><defs><radialGradient id="eg" cx="0.5" cy="0.5" r="0.5"><stop offset="0.25" stop-color="#b6ffcb" /><stop offset="0.6" stop-color="#3fe06e" /><stop offset="1" stop-color="#0d5a26" /></radialGradient></defs>
              <circle id="eye-glow" cx="21" cy="21" r="17" fill="url(#eg)" />
              <path id="eye-shade" fill="#0b120c" />
              <circle cx="21" cy="21" r="6" fill="#141a14" stroke="#2c3a2c" />
            </svg>
          </div>
          <div class="vfd" id="vfd" aria-hidden="true">
            <div class="f"><span id="v-f">88.8</span><small>MHz</small></div>
            <div class="n" id="v-n">Rain Jazz</div>
            <div class="p" id="v-p">Saxophone in the monsoon rain</div>
          </div>
          <div class="knob" id="knob" aria-hidden="true"><i></i></div>
        </div>
        <div class="fx" id="fx" aria-hidden="true"></div>
      </div>
      <div class="shelf" aria-hidden="true"></div>
      <div class="ctl">
        <div>
          <label for="tune">Fine tune <output id="tune-out" for="tune">88.8 MHz</output></label>
          <input type="range" id="tune" min="880" max="1080" value="888" step="1" />
        </div>
        <button class="power" id="power" type="button" aria-pressed="true"><i aria-hidden="true"></i>Power</button>
      </div>
      <p class="sr" id="live" role="status" aria-live="polite"></p>
    </section>
  </main>

<script>
  // Shortwave: a group of radio buttons drawn as the stations on an old tuning dial.
  // Pick a station = the knob turns, the red needle glides along the scale and wobbles to a stop → static crackles in
  // the speaker cloth and the magic eye opens wide while it is between stations → it locks on: the eye closes to a
  // bright fan, the display names the station and the cloth glows to the beat with notes floating out.
  // Fine tune (or drag the knob) to find a station by hand; Power warms the valves up or lets them fade.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var NS = "http://www.w3.org/2000/svg";
    var radio = $("radio"), needle = $("needle"), knob = $("knob"), tune = $("tune"), tuneOut = $("tune-out"), power = $("power"), live = $("live");
    var vF = $("v-f"), vN = $("v-n"), vP = $("v-p"), eyeShade = $("eye-shade"), eyeGlow = $("eye-glow"), grille = $("grille"), canvas = $("noise"), ctx = canvas.getContext("2d"), fx = $("fx");

    var STATIONS = [
      { f: 88.8, name: "Rain Jazz", show: "Saxophone in the monsoon rain", bpm: 92 },
      { f: 92.6, name: "Cricket Live", show: "Pakistan need 42 off 30 balls", bpm: 0 },
      { f: 97.6, name: "Old Lahore", show: "Golden oldies till midnight", bpm: 104 },
      { f: 102.4, name: "Night Talk", show: "Callers on city life after dark", bpm: 0 },
      { f: 106.8, name: "Sea Breeze", show: "Slow beats from the Karachi coast", bpm: 80 }
    ];
    var LO = 88, HI = 108;
    function xOf(f) { return ((f - LO) / (HI - LO)) * 300; }

    // ---------- Scale: ticks, numbers and the station radio buttons ----------
    (function () {
      var ticks = $("ticks"), nums = $("nums"), set = $("stations");
      for (var f = LO; f <= HI + 0.001; f += 0.5) {
        var major = Math.abs(f % 2) < 0.01, l = document.createElementNS(NS, "path"), x = xOf(f).toFixed(1);
        l.setAttribute("d", "M" + x + " " + (major ? 40 : 46) + " V 60");
        l.setAttribute("stroke-width", major ? 1.6 : 0.9);
        ticks.appendChild(l);
        if (Math.abs(f % 4) < 0.01) {
          var t = document.createElement("span");
          t.style.left = ((f - LO) / (HI - LO)) * 100 + "%"; t.textContent = f;
          nums.appendChild(t);
        }
      }
      STATIONS.forEach(function (s, i) {
        var lab = document.createElement("label");
        lab.className = "st" + (i % 2 ? " lo" : "") + (i === 0 ? " edge-l" : "") + (i === STATIONS.length - 1 ? " edge-r" : "");
        lab.style.left = ((s.f - LO) / (HI - LO)) * 100 + "%";
        lab.innerHTML = '<input type="radio" name="station" /><span></span>';
        lab.querySelector("input").value = s.f;
        lab.querySelector("span").textContent = s.name;
        lab.querySelector("input").setAttribute("aria-label", s.name + ", " + s.f.toFixed(1) + " megahertz");
        set.appendChild(lab);
        s.input = lab.querySelector("input");
        s.input.addEventListener("change", function () { if (s.input.checked) tuneTo(s.f, true); });
      });
    })();

    var S = { power: true, warm: 1, f: 88.8, v: 0, target: 88.8, locked: null, signal: 1, lastBeat: -1 };
    STATIONS[0].input.checked = true;

    function nearest(f) {
      var best = STATIONS[0];
      STATIONS.forEach(function (s) { if (Math.abs(s.f - f) < Math.abs(best.f - f)) best = s; });
      return best;
    }
    function syncRadios(f) { STATIONS.forEach(function (s) { s.input.checked = Math.abs(s.f - f) < 0.05; }); }
    function tuneTo(f, fromStation) {
      S.target = Math.max(LO, Math.min(HI, Math.round(f * 10) / 10));
      tune.value = Math.round(S.target * 10);
      tuneOut.textContent = S.target.toFixed(1) + " MHz";
      if (!fromStation) syncRadios(S.target);
      if (calm.matches) { S.f = S.target; S.v = 0; }
      // the knob gets a quick twist in the direction of travel
      if (!calm.matches && fromStation) knob.animate([{ scale: "1" }, { scale: "0.95" }, { scale: "1" }], { duration: 300, easing: "ease-out" });
    }
    tune.addEventListener("input", function () { tuneTo(+tune.value / 10, false); });

    // drag the knob round (left and right) to tune by hand
    var kd = null;
    knob.addEventListener("pointerdown", function (e) { kd = { id: e.pointerId, x: e.clientX, y: e.clientY, f: S.target }; try { knob.setPointerCapture(e.pointerId); } catch (err) { /* optional */ } });
    knob.addEventListener("pointermove", function (e) { if (kd && e.pointerId === kd.id) tuneTo(kd.f + ((e.clientX - kd.x) - (e.clientY - kd.y)) * 0.04, false); });
    ["pointerup", "pointercancel"].forEach(function (ev) { knob.addEventListener(ev, function () { kd = null; }); });

    power.addEventListener("click", function () {
      S.power = !S.power;
      power.setAttribute("aria-pressed", String(S.power));
      live.textContent = S.power ? "Radio on. Warming up…" : "Radio off.";
    });

    // ---------- Canvas size ----------
    var W = 0, H = 0, dpr = 1;
    function size() { W = grille.clientWidth; H = grille.clientHeight; dpr = Math.min(2, window.devicePixelRatio || 1); canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
    size();
    addEventListener("resize", size);
    if (window.ResizeObserver) new ResizeObserver(size).observe(grille);

    function note() {
      if (calm.matches) return;
      var s = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
      s.setAttribute("viewBox", "0 0 24 24");
      p.setAttribute("d", "M10 3.5h2.2v12.6a3.7 3.7 0 1 1-2.2-3.4zM12.2 3.5c2.6 1 5.6 2.4 6 6.4-1.4-1.6-3.6-2.4-6-2.6z");
      p.setAttribute("fill", "currentColor");
      s.appendChild(p);
      var gx = grille.offsetLeft + 20 + Math.random() * (grille.clientWidth - 40), gy = grille.offsetTop + 10;
      s.style.left = gx + "px"; s.style.top = gy + "px";
      fx.appendChild(s);
      var dx = (Math.random() - 0.5) * 60;
      s.animate([{ transform: "translate(0,0) scale(0.4)", opacity: 0 }, { transform: "translate(" + dx * 0.3 + "px,-24px) scale(1.1)", opacity: 1, offset: 0.3 }, { transform: "translate(" + dx + "px,-90px) scale(0.8) rotate(" + dx * 0.4 + "deg)", opacity: 0 }], { duration: 1600, easing: "ease-out" }).onfinish = function () { s.remove(); };
    }

    // ---------- Main loop ----------
    var last = performance.now(), lastText = "";
    function frame(now) {
      var dt = Math.min(0.033, Math.max(0, (now - last) / 1000)), t = now / 1000;
      last = now;
      // valves warm up slowly and fade a bit faster
      S.warm += ((S.power ? 1 : 0) - S.warm) * Math.min(1, dt * (S.power ? 1.6 : 3));
      radio.style.setProperty("--warm", S.warm.toFixed(3));
      // needle: a spring that overshoots a touch and wobbles to rest
      if (!calm.matches) { S.v += ((S.target - S.f) * 55 - S.v * 9.5) * dt; S.f += S.v * dt; }
      else S.f = S.target;
      var x = xOf(S.f);
      needle.setAttribute("transform", "translate(" + x.toFixed(2) + " 0)");
      knob.style.rotate = (((S.f - LO) / (HI - LO)) * 300 - 150).toFixed(1) + "deg";
      // signal strength from the nearest station
      var st = nearest(S.f), d = Math.abs(st.f - S.f);
      S.signal = Math.pow(Math.max(0, 1 - d / 0.4), 1.6) * S.warm;
      // magic eye: the dark wedge narrows as the signal gets stronger
      var half = (8 + (1 - S.signal) * 64) * (Math.PI / 180), r = 18;
      eyeShade.setAttribute("d", "M21 21 L" + (21 + Math.sin(-half) * r).toFixed(2) + " " + (21 - Math.cos(half) * r).toFixed(2) + " A" + r + " " + r + " 0 0 1 " + (21 + Math.sin(half) * r).toFixed(2) + " " + (21 - Math.cos(half) * r).toFixed(2) + " Z");
      eyeGlow.setAttribute("opacity", (0.15 + S.warm * (0.4 + 0.6 * S.signal)).toFixed(3));
      // display
      var locked = S.signal > 0.55 ? st : null;
      vF.textContent = S.power || S.warm > 0.05 ? S.f.toFixed(1) : "--.-";
      var name = !S.power ? "Off" : S.warm < 0.5 ? "Warming up…" : locked ? locked.name : "· · static · ·", show = locked && S.power ? locked.show : S.power ? "Turn the dial to find a station" : "Press Power to listen";
      if (name + show !== lastText) { lastText = name + show; vN.textContent = name; vP.textContent = show; }
      if (locked !== S.locked) {
        S.locked = locked;
        if (S.power && S.warm > 0.4) live.textContent = locked ? "Tuned to " + locked.name + " on " + locked.f.toFixed(1) + " MHz: " + locked.show + "." : "Between stations.";
      }
      // music: a beat for music stations, a talking wobble for talk and sport
      var beatLen = locked && locked.bpm ? 60 / locked.bpm : 0.5, bi = Math.floor(t / beatLen), ph = t - bi * beatLen;
      var pulse = locked ? (locked.bpm ? Math.exp(-ph / 0.12) : 0.35 + 0.35 * Math.abs(Math.sin(t * 9) * Math.sin(t * 3.3))) * S.signal : 0;
      if (bi !== S.lastBeat) { S.lastBeat = bi; if (locked && locked.bpm && S.signal > 0.7 && bi % 2 === 0) note(); }
      if (!calm.matches) radio.style.translate = "0 " + (-pulse * 0.7).toFixed(2) + "px";
      drawNoise(t, pulse);
      requestAnimationFrame(frame);
    }
    function drawNoise(t, pulse) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      // warm glow from the speaker cone behind the cloth
      if (pulse > 0.01) {
        var g = ctx.createRadialGradient(W / 2, H / 2, 4, W / 2, H / 2, Math.max(W, H) * 0.6);
        g.addColorStop(0, "rgba(255,190,100," + (0.5 * pulse).toFixed(3) + ")"); g.addColorStop(1, "rgba(255,190,100,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      // static: flickering specks while you are between stations
      var noise = S.warm * (1 - S.signal);
      if (noise > 0.02 && !calm.matches) {
        var n = Math.round(noise * 260);
        for (var i = 0; i < n; i++) {
          var v = Math.random();
          ctx.fillStyle = v < 0.5 ? "rgba(255,248,230," + (0.25 + 0.5 * Math.random()) * noise + ")" : "rgba(30,15,5," + (0.25 + 0.4 * Math.random()) * noise + ")";
          ctx.fillRect(Math.random() * W, Math.random() * H, 1.5 + Math.random() * 2, 1 + Math.random());
        }
        // a few rolling interference lines
        ctx.fillStyle = "rgba(255,240,210," + (0.12 * noise).toFixed(3) + ")";
        var y = ((t * 90) % (H + 20)) - 10;
        ctx.fillRect(0, y, W, 3);
      }
    }
    requestAnimationFrame(frame);

    // ---------- Auto demo: hop stations, sweep by hand through the static, power off and on ----------
    var demoOn = !calm.matches, timer = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, stopDemo, { capture: true, passive: true }); });
    function later(ms) { return new Promise(function (r) { timer = setTimeout(r, ms); }); }
    function pickStation(i) { STATIONS[i].input.checked = true; tuneTo(STATIONS[i].f, true); }
    function sweep(to, ms) {
      return new Promise(function (res) {
        var from = S.target, s = performance.now();
        (function step(n) {
          if (!demoOn) { res(); return; }
          var p = Math.min(1, (n - s) / ms), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          tuneTo(from + (to - from) * e, false);
          if (p < 1) requestAnimationFrame(step); else res();
        })(s);
      });
    }
    async function demo() {
      await later(600); if (!demoOn) return;
      while (demoOn) {
        pickStation(1); await later(3000); if (!demoOn) return;
        await sweep(97.6, 2200); if (!demoOn) return;
        await later(2600); if (!demoOn) return;
        pickStation(4); await later(3000); if (!demoOn) return;
        power.click(); await later(1600); if (!demoOn) return;
        power.click(); await later(2600); if (!demoOn) return;
        pickStation(3); await later(2800); if (!demoOn) return;
        pickStation(0); await later(3000); if (!demoOn) return;
      }
    }
    if (demoOn) demo();
  })();
</script>
