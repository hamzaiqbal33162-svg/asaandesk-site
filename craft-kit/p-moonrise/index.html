<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonrise · a city that follows the clock</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens (the page; the scene itself follows the time of day) ---------- */
  :root {
    --page: #eef0f8; --page2: #f8e3d8; --ink: #1c2040; --muted: #5d6385;
    --chip: rgba(255, 255, 255, 0.76); --chip-line: rgba(28, 32, 64, 0.12);
    --track: #d9dcef; --on: #1c2040; --on-ink: #fff4e2; --focus: #d9480f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #070915; --page2: #1b1534; --ink: #eceefa; --muted: #9da2c4;
      --chip: rgba(22, 24, 48, 0.76); --chip-line: rgba(255, 255, 255, 0.1);
      --track: #2b2f55; --on: #ffd98a; --on-ink: #1c1606; --focus: #ffc078;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #070915; --page2: #1b1534; --ink: #eceefa; --muted: #9da2c4;
    --chip: rgba(22, 24, 48, 0.76); --chip-line: rgba(255, 255, 255, 0.1);
    --track: #2b2f55; --on: #ffd98a; --on-ink: #1c1606; --focus: #ffc078;
    color-scheme: dark;
  }

  /* ---------- Page and stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: radial-gradient(100% 60% at 50% 0%, var(--page2), transparent 70%), var(--page);
  }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap, .scene, .timebar { width: min(500px, 100%, calc((100vh - 230px) * 0.8)); min-width: 280px; }
  .cap { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); padding: 0 4px; }
  .cap b { font-size: 15px; color: var(--ink); }
  .scene {
    position: relative; aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; isolation: isolate;
    touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
    box-shadow: 0 30px 60px -22px rgba(10, 10, 40, 0.55), 0 12px 24px -12px rgba(10, 10, 40, 0.4);
    --bFar: #1b2348; --bMid: #121a38; --bNear: #0a1028; --winOff: #1a2244; --deck: #10162e;
  }
  .scene.drag { cursor: grabbing; }
  .scene > svg, .scene > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .clock {
    position: absolute; left: 50%; top: 4.5%; transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; font: 750 15px/1 system-ui, sans-serif; letter-spacing: 0.02em;
    color: #fff; background: rgba(10, 14, 40, 0.38); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .clock small { font-weight: 600; opacity: 0.8; margin-left: 6px; font-size: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- City ---------- */
  .far { fill: var(--bFar); } .mid { fill: var(--bMid); } .near { fill: var(--bNear); } .deck { fill: var(--deck); }
  .w { fill: var(--winOff); transition: fill 0.5s ease; }
  .w.on { fill: #ffc979; } .w.on.c1 { fill: #fff0c6; } .w.on.c2 { fill: #9fd2ff; animation: tv 1.3s steps(3) infinite; }
  .w.on.c3 { fill: #ffb0a0; }
  @keyframes tv { 33% { fill: #c7e4ff; } 66% { fill: #7ab8f0; } }
  .who { fill: #241a2a; opacity: 0; transition: opacity 0.5s; }
  .who.on { opacity: 0.9; }
  .beacon { fill: #ff4d4d; animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.1; } }
  .lampHead { fill: #3a3f5e; transition: fill 0.3s; }
  .lampHead.on { fill: #ffe2a0; }
  .lampGlow { opacity: 0; transition: opacity 0.6s; }
  .lampGlow.on { opacity: 1; }
  .star { fill: #fff; animation: tw 3.4s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: 0.3; } }
  .cloud { fill: var(--cloud, #fff); }

  /* ---------- Controls ---------- */
  .timebar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .timebar svg { width: 20px; height: 20px; color: var(--muted); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 6px; background: linear-gradient(90deg, #101a40, #3a3f86 22%, #f0a070 27%, #8cc8f5 40%, #8cc8f5 66%, #ff9f6a 76%, #34306c 83%, #101a40); }
  input[type="range"]::-moz-range-track { height: 8px; border-radius: 6px; background: linear-gradient(90deg, #101a40, #3a3f86 22%, #f0a070 27%, #8cc8f5 40%, #8cc8f5 66%, #ff9f6a 76%, #34306c 83%, #101a40); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%; background: #fff; border: 3px solid var(--on); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--on); }
  input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .btn {
    appearance: none; border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink);
    font: 650 14px/1 system-ui, sans-serif; padding: 11px 16px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.25s cubic-bezier(.34, 1.56, .64, 1), box-shadow 0.25s ease, background 0.2s, color 0.2s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn[aria-pressed="true"] { background: var(--on); color: var(--on-ink); border-color: transparent; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(0, 0, 0, 0.5); }
  .btn:active { transform: scale(0.95); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; text-align: center; }
  .hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .star, .beacon, .w.on.c2 { animation: none; }
    .w, .who, .lampGlow { transition: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Moonrise: a city skyline that follows the time of day</h1>
  <div class="cap"><b>Moonrise</b><span id="lit">0 windows lit</span></div>
  <div class="scene" id="scene" aria-describedby="hint">
    <svg viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="400">
          <stop id="s0" offset="0" stop-color="#060c26"/><stop id="s1" offset="0.55" stop-color="#101a40"/><stop id="s2" offset="1" stop-color="#26285a"/>
        </linearGradient>
        <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
          <stop id="r0" offset="0" stop-color="#26285a"/><stop id="r1" offset="1" stop-color="#05081a"/>
        </linearGradient>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff3c0" stop-opacity="0.9"/><stop offset="0.35" stop-color="#ffcf70" stop-opacity="0.35"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
        <radialGradient id="moonGlow"><stop offset="0" stop-color="#e8f0ff" stop-opacity="0.5"/><stop offset="1" stop-color="#e8f0ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="lampG"><stop offset="0" stop-color="#ffe2a0" stop-opacity="0.8"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
        <clipPath id="skyClip"><rect width="400" height="392"/></clipPath>
      </defs>
      <rect width="400" height="400" fill="url(#sky)"/>
      <g id="stars"></g>
      <g clip-path="url(#skyClip)">
        <g id="sun"><circle r="60" fill="url(#sunGlow)"/><circle id="sunDisc" r="17" fill="#fff1c2"/></g>
        <g id="moon">
          <circle r="46" fill="url(#moonGlow)"/>
          <circle r="15" fill="#f4f1e6"/>
          <circle cx="-4" cy="-3" r="3" fill="#d9d4c4"/><circle cx="5" cy="5" r="2.2" fill="#d9d4c4"/><circle cx="3" cy="-7" r="1.4" fill="#d9d4c4"/>
        </g>
      </g>
      <g id="clouds"></g>
      <!-- city layers, generated -->
      <g id="farL"></g>
      <g id="tower">
        <path class="far" d="M288 392 L292 196 L296 196 L300 392Z"/>
        <ellipse class="far" cx="294" cy="214" rx="9" ry="6"/>
        <rect class="far" x="293" y="168" width="2" height="30"/>
        <circle class="beacon" cx="294" cy="167" r="2.2"/>
      </g>
      <g id="midL"></g>
      <g id="nearL"></g>
      <!-- bridge with lamps and a passing train -->
      <g id="lamps"></g>
      <g id="train"></g>
      <rect class="deck" x="0" y="391" width="400" height="8"/>
      <path class="deck" id="arches"/>
      <rect x="0" y="399" width="400" height="101" fill="url(#river)"/>
    </svg>
    <!-- reflections, fireworks, birds, a boat and shooting stars -->
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="clock" id="clock" aria-hidden="true">6:00 pm</div>
  </div>

  <div class="timebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="currentColor"/></svg>
    <input id="time" type="range" min="0" max="1439" step="1" value="960" aria-label="Time of day">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="currentColor"/></svg>
  </div>
  <div class="controls">
    <button class="btn" id="play" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <span id="playLabel">Play the night</span>
    </button>
    <button class="btn" id="now" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Right now
    </button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">Evening in the city.</p>
  <p id="hint" class="hint">Drag the sky sideways or use the slider to roll the sun and moon. Tap a window to switch its light.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg", TAU = Math.PI * 2, W = 400, H = 500;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)");
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(a, b, k) { return [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * k); }); }
  function css(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  var scene = $("scene"), cv = $("cv"), ctx = cv.getContext("2d"), statusEl = $("status"), slider = $("time");
  function say(m) { statusEl.textContent = m; }
  function fmt(min) {
    var h = Math.floor(min / 60) % 24, m = Math.floor(min % 60);
    return ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " am" : " pm");
  }

  /* ---------- 1. Sky colours through the day (minutes after midnight) ---------- */
  var SKY = [
    [0, "#050a1f", "#0d1838", "#1a2550"], [300, "#081028", "#142048", "#2a3060"], [360, "#2b3a78", "#c06e8a", "#ffb37a"],
    [420, "#5aa0e0", "#a9d4f0", "#ffe2b8"], [720, "#3f8fe0", "#8cc8f5", "#d8eefc"], [1020, "#4a86d0", "#9bc2e8", "#ffd9a0"],
    [1110, "#2d3f86", "#d4688a", "#ffa45c"], [1170, "#141f4f", "#45306a", "#b8577a"], [1260, "#060c26", "#101a40", "#26285a"], [1440, "#050a1f", "#0d1838", "#1a2550"]
  ].map(function (k) { return [k[0], hex(k[1]), hex(k[2]), hex(k[3])]; });
  function skyAt(min) {
    for (var i = 1; i < SKY.length; i++) if (min <= SKY[i][0]) {
      var a = SKY[i - 1], b = SKY[i], k = (min - a[0]) / (b[0] - a[0]);
      k = k * k * (3 - 2 * k);
      return [mix(a[1], b[1], k), mix(a[2], b[2], k), mix(a[3], b[3], k)];
    }
    return [SKY[0][1], SKY[0][2], SKY[0][3]];
  }

  /* ---------- 2. Build the city ---------- */
  var windows = [], lamps = [], trainWins = [], nearRects = [];
  (function build() {
    for (var i = 0; i < 80; i++) {
      var s = el("circle", { "class": "star", cx: rnd(0, 400).toFixed(1), cy: rnd(0, 300).toFixed(1), r: (0.4 + Math.pow(Math.random(), 3) * 1.3).toFixed(2) }, $("stars"));
      s.style.animationDelay = (-Math.random() * 3.4).toFixed(2) + "s";
    }
    [[40, 70, 1], [230, 50, 0.8], [330, 110, 1.2]].forEach(function (c, k) {
      var g = el("g", { "class": "cloud", "data-x": c[0], "data-y": c[1], "data-s": c[2] }, $("clouds"));
      el("ellipse", { cx: 0, cy: 0, rx: 30, ry: 10 }, g); el("ellipse", { cx: -12, cy: -6, rx: 14, ry: 10 }, g); el("ellipse", { cx: 8, cy: -9, rx: 16, ry: 13 }, g);
      g.style.opacity = "0.9";
    });
    // far skyline: plain silhouettes
    var x = -4, d = "";
    while (x < 404) { var w = rnd(14, 30), h = rnd(50, 140) * (x > 290 ? 0.6 : 1); d += "M" + x.toFixed(1) + " 392V" + (392 - h).toFixed(1) + "h" + w.toFixed(1) + "V392Z"; x += w + rnd(-2, 2); }
    el("path", { "class": "far", d: d }, $("farL"));
    // a window's evening and morning times, in minutes
    function timing() {
      var on = 1050 + Math.pow(Math.random(), 0.8) * 220;
      var off = Math.random() < 0.12 ? 1440 + 390 : 1290 + Math.random() * 330;
      var morn = Math.random() < 0.3 ? 330 + Math.random() * 90 : -1;
      return { on: on, off: off, mOn: morn, mOff: morn + 50 + Math.random() * 60 };
    }
    function block(layer, cls, bx, bw, bh, ww, wh, gx, gy, fill) {
      var g = $(layer);
      el("rect", { "class": cls, x: bx.toFixed(1), y: (392 - bh).toFixed(1), width: bw.toFixed(1), height: bh.toFixed(1) }, g);
      for (var yy = 392 - bh + 8; yy < 384 - wh; yy += gy) {
        for (var xx = bx + 5; xx + ww < bx + bw - 3; xx += gx) {
          if (Math.random() > fill) continue;
          var r = el("rect", { "class": "w", x: xx.toFixed(1), y: yy.toFixed(1), width: ww, height: wh }, g);
          var c = Math.random(), wn = timing();
          wn.node = r; wn.x = xx + ww / 2; wn.y = yy + wh / 2; wn.lit = false; wn.manual = null; wn.auto = false;
          r.classList.add(c < 0.55 ? "c0" : c < 0.82 ? "c1" : c < 0.92 ? "c2" : "c3");
          r.style.transitionDelay = (Math.random() * 0.4).toFixed(2) + "s";
          // now and then someone (or a cat) stands at the window
          if (Math.random() < 0.06 && wh > 6) {
            wn.who = el("path", { "class": "who", d: Math.random() < 0.5
              ? "M" + (xx + ww / 2) + " " + (yy + wh) + "v-" + (wh * 0.45) + "a" + (ww * 0.22) + " " + (ww * 0.22) + " 0 1 1 0.01 0z"
              : "M" + (xx + 1) + " " + (yy + wh) + "l1 -3 l1 1 l1 -1 l1 3z" }, g);
          }
          windows.push(wn);
        }
      }
    }
    x = -6;
    while (x < 404) { var mw = rnd(26, 42); block("midL", "mid", x, mw, rnd(80, 160) * (x > 290 ? 0.62 : 1), 4, 5, 8, 10, 0.8); x += mw + rnd(4, 18); }
    [[8, 52, 236], [72, 44, 196], [128, 58, 250], [206, 48, 172], [262, 40, 150], [318, 56, 140], [376, 40, 108]].forEach(function (b) {
      var before = windows.length;
      block("nearL", "near", b[0], b[1], b[2], 5, 7, 11, 13, 0.75);
      for (var q = before; q < windows.length; q++) windows[q].near = true;
      nearRects.push([b[0], b[0] + b[1], 392 - b[2]]);
      // rooftop water tank or antenna
      var g = $("nearL"), top = 392 - b[2];
      if (b[2] > 200) { el("rect", { "class": "near", x: b[0] + b[1] / 2 - 1, y: top - 22, width: 2, height: 22 }, g); el("circle", { "class": "beacon", cx: b[0] + b[1] / 2, cy: top - 23, r: 1.8 }, g); }
      else { el("rect", { "class": "near", x: b[0] + 8, y: top - 10, width: 14, height: 9, rx: 2 }, g); el("rect", { "class": "near", x: b[0] + 10, y: top - 2, width: 2, height: 3 }, g); el("rect", { "class": "near", x: b[0] + 18, y: top - 2, width: 2, height: 3 }, g); }
    });
    // mid-layer windows hidden behind a near building cannot be tapped or reflected
    windows.forEach(function (wn) {
      if (wn.near) return;
      nearRects.forEach(function (r) { if (wn.x > r[0] - 3 && wn.x < r[1] + 3 && wn.y > r[2] - 3) wn.hidden = true; });
    });
    // bridge arches and lamps
    var ad = "";
    for (var p = 0; p <= 400; p += 100) ad += "M" + (p - 3) + " 398h6v14h-6Z";
    for (p = 0; p < 400; p += 100) ad += "M" + (p + 3) + " 398 Q" + (p + 50) + " 420 " + (p + 97) + " 398 Z";
    $("arches").setAttribute("d", ad);
    for (var li = 0; li < 9; li++) {
      var lx = 22 + li * 45, g = el("g", {}, $("lamps"));
      el("circle", { "class": "lampGlow", cx: lx, cy: 378, r: 16, fill: "url(#lampG)" }, g);
      el("rect", { "class": "deck", x: lx - 0.8, y: 378, width: 1.6, height: 14 }, g);
      el("circle", { "class": "lampHead", cx: lx, cy: 378, r: 2.4 }, g);
      lamps.push({ g: g, x: lx, on: 1100 + li * 4, off: 370 + li * 3, lit: null });
    }
    // train: four carriages with windows
    var tg = $("train");
    for (var c = 0; c < 4; c++) {
      var cx = c * 46;
      el("rect", { x: cx, y: 378, width: 43, height: 13, rx: c === 3 ? 6 : 2, fill: "#d9dde8" }, tg);
      el("rect", { x: cx, y: 387, width: 43, height: 2, fill: "#e35d4f" }, tg);
      for (var k = 0; k < 5; k++) trainWins.push(el("rect", { x: cx + 4 + k * 8, y: 381, width: 5, height: 4, fill: "#5d6b88" }, tg));
    }
  })();

  /* ---------- 3. Time and everything that depends on it ---------- */
  var minutes = 960, lastMin = -1, period = "", litCount = 0;
  function sunAlt(min) { return -Math.cos(TAU * min / 1440); }
  function arcPos(f) { // f: 0 = rising on the left, 1 = setting on the right
    var a = Math.PI * f;
    return { x: 200 - 178 * Math.cos(a), y: 386 - 300 * Math.sin(a) };
  }
  function periodOf(min) {
    if (min < 300) return "Deep night. Most of the city is asleep.";
    if (min < 390) return "Dawn. The first lights come on for breakfast.";
    if (min < 690) return "Morning in the city.";
    if (min < 1000) return "Afternoon. The windows reflect the sky.";
    if (min < 1110) return "Golden hour.";
    if (min < 1190) return "Sunset. The windows light up one by one.";
    if (min < 1320) return "Evening. The city is glowing.";
    return "Late night. The lights go out one by one.";
  }
  function windowLit(wn, m) {
    if (m >= wn.on && m < wn.off) return true;
    if (m + 1440 < wn.off) return true;
    if (wn.mOn > 0 && m >= wn.mOn && m < wn.mOff) return true;
    return false;
  }
  function applyTime(m) {
    var sky = skyAt(m);
    $("s0").setAttribute("stop-color", css(sky[0])); $("s1").setAttribute("stop-color", css(sky[1])); $("s2").setAttribute("stop-color", css(sky[2]));
    $("r0").setAttribute("stop-color", css(mix(sky[2], sky[1], 0.4))); $("r1").setAttribute("stop-color", css(mix(sky[0], [3, 5, 16], 0.5)));
    var alt = sunAlt(m), dayK = clamp((alt + 0.12) / 0.42, 0, 1), nightK = 1 - clamp((alt + 0.28) / 0.3, 0, 1);
    var warm = Math.max(0, 1 - Math.abs(alt) / 0.25) * 0.5;
    var tint = hex("#c97a86");
    scene.style.setProperty("--bFar", css(mix(mix(hex("#1b2348"), hex("#a8b8d2"), dayK), tint, warm * 0.6)));
    scene.style.setProperty("--bMid", css(mix(mix(hex("#121a38"), hex("#8496b6"), dayK), tint, warm * 0.4)));
    scene.style.setProperty("--bNear", css(mix(mix(hex("#0a1028"), hex("#617394"), dayK), tint, warm * 0.3)));
    scene.style.setProperty("--winOff", css(mix(hex("#1a2244"), hex("#c9def2"), dayK)));
    scene.style.setProperty("--deck", css(mix(hex("#0c1128"), hex("#4b5a78"), dayK)));
    scene.style.setProperty("--cloud", css(mix(mix(hex("#2a3158"), hex("#ffffff"), dayK), hex("#ffb7a0"), warm)));
    $("stars").style.opacity = nightK.toFixed(2);
    // the sun is up from 6 am to 6 pm; the moon the other way round
    var sunF = (m - 360) / 720, moonF = (((m + 720) % 1440) - 360) / 720;
    var sp = arcPos(clamp(sunF, -0.1, 1.1)), mp = arcPos(clamp(moonF, -0.1, 1.1));
    $("sun").setAttribute("transform", "translate(" + sp.x.toFixed(1) + " " + (sunF < 0 || sunF > 1 ? 470 : sp.y).toFixed(1) + ")");
    $("sunDisc").setAttribute("fill", css(mix(hex("#ff8a4a"), hex("#fff4d0"), clamp(alt * 2.2, 0, 1))));
    $("moon").setAttribute("transform", "translate(" + mp.x.toFixed(1) + " " + (moonF < 0 || moonF > 1 ? 470 : mp.y).toFixed(1) + ")");
    // windows: only touch the ones that change
    litCount = 0;
    windows.forEach(function (wn) {
      var auto = windowLit(wn, m);
      if (auto !== wn.auto) { wn.auto = auto; wn.manual = null; }
      var lit = wn.manual === null ? auto : wn.manual;
      if (lit !== wn.lit) { wn.lit = lit; wn.node.classList.toggle("on", lit); if (wn.who) wn.who.classList.toggle("on", lit); }
      if (lit) litCount++;
    });
    lamps.forEach(function (l) {
      var on = m >= l.on || m < l.off;
      if (on !== l.lit) { l.lit = on; l.g.querySelector(".lampHead").classList.toggle("on", on); l.g.querySelector(".lampGlow").classList.toggle("on", on); }
    });
    var tw = nightK > 0.3 ? "#ffe0a0" : "#5d6b88";
    trainWins.forEach(function (r) { r.setAttribute("fill", tw); });
    $("lit").textContent = litCount + " window" + (litCount === 1 ? "" : "s") + " lit";
    $("clock").innerHTML = fmt(m) + "<small>" + (dayK > 0.5 ? "day" : nightK > 0.6 ? "night" : alt > 0 ? "golden hour" : "twilight") + "</small>";
    slider.value = String(Math.floor(m));
    slider.setAttribute("aria-valuetext", fmt(m));
    var p = periodOf(m);
    if (p !== period) { period = p; say(p); }
    return { dayK: dayK, nightK: nightK, sunX: sp.x, moonX: mp.x, sunUp: sunF > 0 && sunF < 1, moonUp: moonF > 0 && moonF < 1 };
  }
  var look = applyTime(minutes);

  // move the clock, firing fireworks if midnight is crossed
  function setTime(m, quiet) {
    var prev = minutes;
    minutes = ((m % 1440) + 1440) % 1440;
    if ((prev > 1300 && minutes < 140) || (prev < 140 && minutes > 1300)) midnight(quiet);
  }

  /* ---------- 4. Fireworks, birds, a boat and shooting stars (canvas) ---------- */
  var rockets = [], parts = [], birds = [], meteor = null, boatX = 120;
  function midnight(quiet) {
    if (!quiet) say("Midnight! Fireworks over the river.");
    var n = reduce.matches ? 2 : 6;
    for (var i = 0; i < n; i++) (function (k) {
      setTimeout(function () { rockets.push({ x: rnd(70, 330), y: 400, vy: -rnd(230, 290), vx: rnd(-20, 20), c: ["#ff6b9a", "#ffd166", "#7ee8fa", "#b8f27c", "#c49bff"][k % 5] }); }, k * 260);
    })(i);
  }
  function explode(r) {
    var n = reduce.matches ? 18 : 54;
    for (var i = 0; i < n; i++) {
      var a = i / n * TAU + rnd(-0.05, 0.05), v = rnd(60, 110);
      parts.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(1.1, 1.6), c: r.c });
    }
  }
  function stepCanvas(dt, t) {
    rockets.forEach(function (r) { r.vy += 160 * dt; r.x += r.vx * dt; r.y += r.vy * dt; if (r.vy > -40) { r.done = true; explode(r); } });
    rockets = rockets.filter(function (r) { return !r.done; });
    parts.forEach(function (p) { p.life -= dt; p.vy += 50 * dt; p.vx *= 1 - dt * 1.2; p.vy *= 1 - dt * 1.2; p.x += p.vx * dt; p.y += p.vy * dt; });
    parts = parts.filter(function (p) { return p.life > 0; });
    // morning birds
    if (minutes > 360 && minutes < 520 && birds.length < 5 && Math.random() < dt * 0.8) {
      var by = rnd(120, 230);
      for (var b = 0; b < 3; b++) birds.push({ x: -20 - b * 14, y: by + b * 7, v: rnd(34, 44), ph: rnd(0, 6) });
    }
    birds.forEach(function (b) { b.x += b.v * dt; b.ph += dt * 9; });
    birds = birds.filter(function (b) { return b.x < 420; });
    if (!meteor && look.nightK > 0.8 && !reduce.matches && Math.random() < dt * 0.12) meteor = { x: rnd(60, 300), y: rnd(30, 120), life: 0.9 };
    if (meteor) { meteor.x += 260 * dt; meteor.y += 110 * dt; meteor.life -= dt; if (meteor.life <= 0) meteor = null; }
    boatX += dt * 7; if (boatX > 440) boatX = -40;
  }
  function drawCanvas(t) {
    ctx.clearRect(0, 0, W, H);
    // river reflections: lit windows and lamps, broken into ripples
    ctx.save(); ctx.beginPath(); ctx.rect(0, 399, W, 101); ctx.clip();
    var bins = new Array(50).fill(0);
    windows.forEach(function (wn) { if (wn.lit && !wn.hidden && wn.y > 230) bins[Math.floor(clamp(wn.x, 0, 399) / 8)] += 1; });
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 50; i++) {
      if (!bins[i]) continue;
      var a = Math.min(0.42, bins[i] * 0.045);
      // ripples get sparser and fainter further from the bank
      for (var k = 0; k < 6; k++) {
        if ((i + k) % 2 && k > 1) continue;
        ctx.fillStyle = "rgba(255,200,120," + (a * (1 - k / 7)).toFixed(3) + ")";
        var y = 404 + k * 9 + ((t * 6 + i) % 9), w = 4 + 3 * Math.sin(t * 2 + i + k);
        ctx.fillRect(i * 8 + 4 - w / 2 + Math.sin(t * 1.7 + k + i) * 1.5, y, w, 1.6);
      }
    }
    lamps.forEach(function (l) {
      if (!l.lit) return;
      ctx.fillStyle = "rgba(255,226,160,0.35)";
      for (var k = 0; k < 6; k++) ctx.fillRect(l.x - 3 + Math.sin(t * 2 + k + l.x) * 1.5, 402 + k * 7 + ((t * 5) % 7), 6, 1.4);
    });
    // a glitter path under the sun or moon
    var bx = look.sunUp ? look.sunX : look.moonUp ? look.moonX : -100;
    if (bx > -50) {
      ctx.fillStyle = look.sunUp ? "rgba(255,240,200,0.45)" : "rgba(220,230,255,0.4)";
      for (var g = 0; g < 14; g++) {
        var gy = 404 + g * 7, gw = 6 + g * 1.6 + Math.sin(t * 3 + g) * 3;
        ctx.fillRect(bx - gw / 2 + Math.sin(t * 2.2 + g * 1.3) * 3, gy, gw, 1.5);
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
    // a little boat with a lantern
    ctx.fillStyle = "#1a1d2e"; ctx.beginPath(); ctx.moveTo(boatX - 18, 452); ctx.lineTo(boatX + 18, 452); ctx.lineTo(boatX + 12, 460); ctx.lineTo(boatX - 12, 460); ctx.fill();
    ctx.fillRect(boatX - 6, 444, 10, 8);
    if (look.nightK > 0.3) {
      var lg = ctx.createRadialGradient(boatX + 9, 442, 0, boatX + 9, 442, 16);
      lg.addColorStop(0, "rgba(255,210,120,0.9)"); lg.addColorStop(1, "rgba(255,210,120,0)");
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(boatX + 9, 442, 16, 0, TAU); ctx.fill();
    }
    // birds
    ctx.strokeStyle = "rgba(30,30,50,0.8)"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
    birds.forEach(function (b) {
      var f = Math.sin(b.ph) * 3;
      ctx.beginPath(); ctx.moveTo(b.x - 5, b.y - f); ctx.quadraticCurveTo(b.x - 2, b.y - 2, b.x, b.y); ctx.quadraticCurveTo(b.x + 2, b.y - 2, b.x + 5, b.y - f); ctx.stroke();
    });
    // shooting star
    if (meteor) {
      var mg = ctx.createLinearGradient(meteor.x, meteor.y, meteor.x - 40, meteor.y - 17);
      mg.addColorStop(0, "rgba(255,255,255," + Math.min(1, meteor.life * 2).toFixed(2) + ")"); mg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = mg; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(meteor.x, meteor.y); ctx.lineTo(meteor.x - 40, meteor.y - 17); ctx.stroke();
    }
    // fireworks
    ctx.globalCompositeOperation = "lighter";
    rockets.forEach(function (r) { ctx.fillStyle = "#fff2c0"; ctx.beginPath(); ctx.arc(r.x, r.y, 1.8, 0, TAU); ctx.fill(); ctx.fillStyle = "rgba(255,200,120,0.4)"; ctx.fillRect(r.x - 0.7, r.y, 1.4, 14); });
    parts.forEach(function (p) {
      var a = Math.min(1, p.life) * (0.7 + 0.3 * Math.sin(t * 40 + p.x));
      ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, TAU); ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  /* ---------- 5. Input: drag the sky, the slider, tap a window ---------- */
  var playing = false, live = false, drag = null;
  function toScene(e) { var r = scene.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  function stopPlay() { if (!playing) return; playing = false; $("play").setAttribute("aria-pressed", "false"); $("playLabel").textContent = "Play the night"; $("playIcon").setAttribute("d", "M8 5v14l11-7z"); }
  scene.addEventListener("pointerdown", function (e) {
    scene.setPointerCapture(e.pointerId);
    drag = { start: toScene(e), last: toScene(e), moved: 0 };
    scene.classList.add("drag");
    live = false; stopPlay();
  });
  scene.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var p = toScene(e), dx = p.x - drag.last.x;
    drag.moved += Math.abs(dx) + Math.abs(p.y - drag.last.y);
    drag.last = p;
    if (drag.moved > 4) setTime(minutes + dx * 3.2);
  });
  function endDrag(e) {
    if (!drag) return;
    scene.classList.remove("drag");
    if (drag.moved <= 4) tapWindow(drag.start);
    drag = null;
  }
  scene.addEventListener("pointerup", endDrag);
  scene.addEventListener("pointercancel", function () { drag = null; scene.classList.remove("drag"); });
  function tapWindow(p) {
    var best = null, bd = 14;
    windows.forEach(function (wn) {
      if (wn.hidden) return;
      var d = Math.hypot(wn.x - p.x, wn.y - p.y) - (wn.near ? 4 : 0);
      if (d < bd) { bd = d; best = wn; }
    });
    if (!best) { say("Drag sideways to move the sun and moon."); return; }
    best.manual = !best.lit;
    burstAt(best.x, best.y, best.manual);
    applyTime(minutes);
    say(best.manual ? "Click. Someone switched a light on." : "Click. That one is off to bed.");
  }
  function burstAt(x, y, on) {
    if (reduce.matches) return;
    for (var i = 0; i < 10; i++) { var a = i / 10 * TAU; parts.push({ x: x, y: y, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, life: 0.45, c: on ? "#ffd27a" : "#8fa2d8" }); }
  }
  slider.addEventListener("input", function () { live = false; stopPlay(); setTime(+slider.value); });
  $("play").addEventListener("click", function () {
    if (playing) { stopPlay(); say("Paused at " + fmt(minutes) + "."); return; }
    playing = true; live = false;
    $("play").setAttribute("aria-pressed", "true"); $("playLabel").textContent = "Pause"; $("playIcon").setAttribute("d", "M7 5h4v14H7zM13 5h4v14h-4z");
    say("Playing the night: watch the lights come and go.");
  });
  $("now").addEventListener("click", function () {
    stopPlay(); live = true;
    var d = new Date(); glideTo(d.getHours() * 60 + d.getMinutes());
    say("Back to right now: " + fmt(d.getHours() * 60 + d.getMinutes()) + ".");
  });
  // glide the clock to a time the short way round
  var glide = null;
  function glideTo(target) {
    var diff = ((target - minutes) % 1440 + 2160) % 1440 - 720;
    glide = { from: minutes, diff: diff, t: 0, dur: reduce.matches ? 0.01 : Math.min(2.2, 0.6 + Math.abs(diff) / 500) };
  }

  /* ---------- 6. Auto demo until the visitor takes over ---------- */
  var demoOn = true, demoT = 0, demoStep = 0, DEMO = [[960, 0], [1325, 4400], [1450, 2400], [1860, 2600], [1440 + 960, 3400]];
  // stops: sunset → evening (lights on in waves) → midnight (fireworks) → morning → sunset again
  function demo() {
    if (!demoOn) return;
    var k = demoStep++ % DEMO.length;
    if (k === 0) { setTime(960, true); demoT = setTimeout(demo, 250); return; }
    var target = DEMO[k][0] % 1440, start = minutes;
    var diff = ((target - start) % 1440 + 1440) % 1440;
    glide = { from: start, diff: diff, t: 0, dur: DEMO[k][1] / 1000 * 0.75 };
    demoT = setTimeout(demo, DEMO[k][1] + 1100);
  }
  function stopDemo(e) { if (!e.isTrusted || !demoOn) return; demoOn = false; clearTimeout(demoT); glide = null; }
  ["pointerdown", "keydown", "wheel"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });

  /* ---------- 7. Main loop ---------- */
  var S = 1;
  function resize() {
    var r = scene.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    S = Math.max(0.5, r.width / W * dpr);
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  }
  window.addEventListener("resize", resize);
  var clouds = Array.prototype.slice.call(document.querySelectorAll(".cloud"));
  var last = performance.now(), liveTick = 0;
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
    last = now;
    if (glide) {
      glide.t += dt;
      var k = Math.min(1, glide.t / glide.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      setTime(glide.from + glide.diff * e);
      if (k >= 1) glide = null;
    } else if (playing) setTime(minutes + dt * 40);
    else if (live) { liveTick -= dt; if (liveTick <= 0) { liveTick = 1; var d = new Date(); setTime(d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60); } }
    if (Math.abs(minutes - lastMin) > 0.01) { look = applyTime(minutes); lastMin = minutes; }
    // clouds drift, the train comes by every so often
    clouds.forEach(function (c, i) {
      var x = (+c.getAttribute("data-x") + t * (4 + i * 2)) % 480 - 40;
      c.setAttribute("transform", "translate(" + x.toFixed(1) + " " + c.getAttribute("data-y") + ") scale(" + c.getAttribute("data-s") + ")");
    });
    var cyc = (t % 16) / 16, tx = -190 + cyc * 3 * 600;
    $("train").setAttribute("transform", "translate(" + (cyc < 1 / 3 ? tx : 600).toFixed(1) + " 0)");
    stepCanvas(dt, t);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    drawCanvas(t);
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
  demoT = setTimeout(demo, 200);
})();
</script>
