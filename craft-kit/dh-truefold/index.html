<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truefold · Identity verification</title>
<meta name="description" content="An identity-verification console for trust and safety teams: a live verification conveyor, case review with document and face checks, a reorderable check pipeline, reviewers, data sources, rules and an audit log.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "truefold:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: indigo band, mint for verified
   ========================================================= */
:root {
  color-scheme: light;
  --font: "SF Pro Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px; --r-sm: 10px;
  --bg: #f3f5fb; --surface: #ffffff; --surface2: #f5f7fc; --ink: #141936; --muted: #5f6787; --line: #e2e6f2;
  --accent: #4338ca; --accent-ink: #fff; --focus: #4338ca; --mint: #0ea472; --ok: #0ea472; --warn: #c97a07; --bad: #dc3a4a; --info: #2f6fdb;
  --c1: #4338ca; --c2: #0ea472; --c3: #dc3a4a; --c4: #c97a07; --c5: #98a0bd;
  --band1: #19226b; --band2: #3a2bb5; --band-ink: #e6e8ff; --doc: #f3efe2; --doc-ink: #2a2f45; --tip-bg: #141936;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d1b; --surface: #11152b; --surface2: #0d1124; --ink: #e5e8fb; --muted: #8e95b8; --line: #20264a;
  --accent: #8b83ff; --accent-ink: #0b0c24; --focus: #8b83ff; --mint: #2fd9a0; --ok: #2fd9a0; --warn: #f5b142; --bad: #ff6b7a; --info: #6aa2ff;
  --c1: #8b83ff; --c2: #2fd9a0; --c3: #ff6b7a; --c4: #f5b142; --c5: #4f5680;
  --band1: #0e1236; --band2: #1f1866; --doc: #e9e4d4; --doc-ink: #2a2f45;
}
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbars { display: grid; gap: 11px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
.hb-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.hb-fill { height: 100%; width: var(--w); border-radius: inherit; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hbIn { from { width: 0; } }
.heat { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }

/* drag board */

.band-h { margin-top: 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* =========================================================
   3. Cards
   ========================================================= */
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }

.card, .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(20, 25, 54, .04), 0 10px 30px -18px rgba(20, 25, 54, .25); transition: transform .25s, box-shadow .25s; }

.kpi i.bar::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--kc); border-radius: inherit; animation: hbIn 1.2s both; }
.k5 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } }
.pill.ok { background: color-mix(in srgb, var(--mint) 15%, transparent); color: var(--mint); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.code { font: 12.5px var(--mono); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.facts div { padding: 9px 11px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); }
.facts span { display: block; font-size: 11.5px; color: var(--muted); } .facts b { font-size: 13.5px; }
.score { display: inline-flex; align-items: center; gap: 6px; font: 700 12.5px var(--mono); }
.score i { width: 34px; height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; position: relative; }
.score i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--sc); border-radius: inherit; }

/* conveyor: sessions travel through the checks */
.conveyor { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; padding: 10px 0 4px; }
.cv-st { position: relative; display: grid; justify-items: center; gap: 6px; padding: 6px 4px 12px; text-align: center; }

.cv-st:last-child::after { display: none; }
.cv-ic { position: relative; z-index: 1; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); transition: transform .2s, box-shadow .3s; }

.cv-st b { font-size: 13px; } .cv-st small { font: 11.5px var(--mono); color: var(--muted); }
.lane { position: relative; height: 64px; margin-top: 4px; border-radius: 12px; background: var(--surface2); overflow: hidden; }
.tokn { position: absolute; top: 14px; left: 0; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 10px -6px rgba(0, 0, 0, .3); font-size: 11.5px; font-weight: 700; white-space: nowrap; transition: left .9s cubic-bezier(.4, 0, .2, 1), opacity .4s, border-color .3s; }
.tokn .av { width: 24px; height: 24px; font-size: 9.5px; }
.tokn.ok { border-color: var(--mint); color: var(--mint); } .tokn.bad { border-color: var(--bad); color: var(--bad); } .tokn.rev { border-color: var(--warn); color: var(--warn); }

/* case page: pipeline, document, selfie */
.case { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.pipe { display: flex; gap: 6px; flex-wrap: wrap; }
.pipe li { list-style: none; flex: 1 1 110px; display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-size: 12.5px; font-weight: 650; opacity: .45; transition: opacity .3s, border-color .3s, background .3s; }
.pipe li .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: #fff; flex: none; }
.pipe li .dot .ic { width: 12px; height: 12px; stroke-width: 3; }
.pipe { padding: 0; margin: 0; }
.pipe li.on { opacity: 1; }
.pipe li.on.pass { border-color: color-mix(in srgb, var(--mint) 50%, var(--line)); } .pipe li.on.pass .dot { background: var(--mint); }
.pipe li.on.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); } .pipe li.on.warn .dot { background: var(--warn); }
.pipe li.on.fail { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); } .pipe li.on.fail .dot { background: var(--bad); }
.pipe li.cur { opacity: 1; border-color: var(--accent); animation: pulseB 1s infinite; }
@keyframes pulseB { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); } }
.media { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.docv { position: relative; border-radius: 12px; overflow: hidden; background: var(--surface2); border: 1px solid var(--line); padding: 10px; }
.docv svg.doc { display: block; width: 100%; height: auto; border-radius: 8px; }
.mrzbox { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; opacity: 0; animation: boxIn .5s 1s forwards; }
@keyframes boxIn { to { opacity: 1; } }
.facev { position: relative; border-radius: 12px; overflow: hidden; background: #0f1430; display: grid; place-items: center; padding: 10px; }
.facev svg { width: 100%; max-width: 220px; height: auto; display: block; }
.mesh line { stroke: #2fd9a0; stroke-width: .8; opacity: 0; animation: meshIn .5s forwards; animation-delay: calc(.6s + var(--d) * 45ms); }
.mesh circle { fill: #2fd9a0; opacity: 0; animation: meshIn .3s forwards; animation-delay: calc(.4s + var(--d) * 45ms); }
@keyframes meshIn { to { opacity: .9; } }
.scanbar { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(transparent, rgba(47, 217, 160, .35), transparent); animation: scanD 1.8s ease-in-out 2; opacity: 0; }
@keyframes scanD { 0% { transform: translateY(-40px); opacity: 1; } 100% { transform: translateY(300px); opacity: 0; } }
.chk { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.chk li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; }
.chk li .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--mint); }
.chk li.warn .dot { background: var(--warn); } .chk li.fail .dot { background: var(--bad); }
.chk li .dot .ic { width: 12px; height: 12px; stroke-width: 3; }
.chk em { font: 12px var(--mono); font-style: normal; color: var(--muted); }
.decide { display: grid; gap: 8px; }
.decide .btn { justify-content: flex-start; }
.notes-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.notes-l li { padding: 8px 10px; border-radius: 10px; background: var(--surface2); }
.notes-l time { display: block; font-size: 11.5px; color: var(--muted); }

/* checks pipeline editor */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 30px 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 18px -14px rgba(20, 25, 54, .4); transition: transform .2s, box-shadow .2s, opacity .2s; }
.step.off { opacity: .55; }

.step b { display: block; } .step small { color: var(--muted); font-size: 12.5px; }

.rule { display: grid; gap: 10px; }

.cond span { padding: 4px 9px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }

.cond .then { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.crow { display: grid; grid-template-columns: 1.2fr .8fr 1fr auto; gap: 6px; margin-bottom: 6px; }
.crow .inp { min-height: 34px; padding: 4px 8px; width: 100%; }
.rev { display: grid; gap: 12px; }
.rev-top { display: flex; align-items: center; gap: 12px; }
.rev-top b { display: block; font-size: 15px; } .rev-top small { color: var(--muted); }
.cap { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.cap i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--accent), var(--mint)); border-radius: inherit; transition: width .6s; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row small { display: block; color: var(--muted); font-size: 12.5px; }

/* =========================================================
   4. Responsive
   ========================================================= */
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: 1 / -1; } .k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .case { grid-template-columns: 1fr; } }

  if (action) { const b = node(`<button type="button" class="toast-act">${esc(action.label)}</button>`); b.onclick = () => { action.run(); t.remove(); }; t.append(b); }

/* ---------- Rules with a simulator ---------- */
const FIELDS = ["Risk score", "Face match", "Liveness", "Watchlist", "Age 18+", "Phone age (months)", "Email age (months)", "Country"];
function ruleMatch(r, s) { return r.conds.every(([f, op, val]) => { const x = { "Risk score": s.score, "Face match": s.face, Liveness: s.live, Watchlist: s.watch ? "hit" : "clear", "Age 18+": s.age ? "yes" : "no", "Phone age (months)": s.phoneAge, "Email age (months)": s.emailAge, Country: s.country }[f]; const y = isNaN(+val) ? String(val).toLowerCase() : +val, xx = typeof x === "string" ? x.toLowerCase() : x; return op === "<" ? xx < y : op === "<=" ? xx <= y : op === ">" ? xx > y : op === ">=" ? xx >= y : xx === y; }); }
function editRule(r) {

  let conds = r ? r.conds.map((c) => [...c]) : [["Risk score", "<", "20"]];
  const drawC = () => { $("#re-c", body).innerHTML = conds.map((c, i) => `<div class="crow"><label class="sr-only" for="cf-${i}">Field</label><select class="inp" id="cf-${i}" data-i="${i}" data-p="0">${FIELDS.map((f) => `<option ${f === c[0] ? "selected" : ""}>${f}</option>`).join("")}</select><label class="sr-only" for="co-${i}">Operator</label><select class="inp" id="co-${i}" data-i="${i}" data-p="1">${["<", "<=", ">", ">=", "="].map((o) => `<option ${o === c[1] ? "selected" : ""}>${o}</option>`).join("")}</select><label class="sr-only" for="cv-${i}">Value</label><input class="inp" id="cv-${i}" data-i="${i}" data-p="2" value="${esc(c[2])}"><button type="button" class="icon-btn" data-rm="${i}" aria-label="Remove condition" ${conds.length < 2 ? "disabled" : ""}>${ic("x")}</button></div>`).join(""); sim(); };
  const sim = () => { const fake = { conds, act: $("#re-a", body).value }, n = DB.sessions.filter((s) => ruleMatch(fake, s)).length; $("#re-sim", body).textContent = `On the last ${DB.sessions.length} people this rule would match ${n} (${Math.round((n / Math.max(1, DB.sessions.length)) * 100)}%).`; };
  body.addEventListener("input", (e) => { const t = e.target; if (t.dataset.i != null) { conds[+t.dataset.i][+t.dataset.p] = t.value; sim(); } });
  body.addEventListener("change", (e) => { const t = e.target; if (t.dataset.i != null) { conds[+t.dataset.i][+t.dataset.p] = t.value; sim(); } if (t.id === "re-a") sim(); });
  body.addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { conds.splice(+b.dataset.rm, 1); drawC(); } });
  $("#re-add", body).onclick = () => { conds.push(["Face match", ">=", "80"]); drawC(); };
  drawC();
  const acts = [{ label: "Cancel", kind: "ghost" }, { label: r ? "Save rule" : "Create rule", kind: "primary", run: () => { const n = $("#re-n", body).value.trim(), bad = conds.some((c) => !String(c[2]).trim()); $("#re-n-e", body).textContent = n.length < 3 ? "Name the rule" : bad ? "Every condition needs a value" : ""; if ($("#re-n-e", body).textContent) return false; const d = { name: n, conds, act: $("#re-a", body).value }; if (r) Object.assign(r, d); else DB.rules.push({ id: uid("ru"), on: true, hits: 0, ...d }); log(`${r ? "Edited" : "Created"} rule “${n}”`, "Config"); save(); rerender(); toast("Rule saved"); } }];
  if (r) acts.unshift({ label: "Delete", kind: "danger ghost push", run: async () => { if (await confirmBox(`Delete “${r.name}”?`, "People it used to catch go through the other rules.")) { DB.rules.splice(DB.rules.indexOf(r), 1); log(`Deleted rule “${r.name}”`, "Config"); save(); rerender(); toast("Rule deleted", "warn"); } } });
  modal({ title: r ? "Edit rule" : "New rule", body, wide: true, actions: acts });
}

  on(v, "click", "[data-ed]", (e, b) => editRule(DB.rules.find((r) => r.id === b.dataset.ed)));
  $("#ru-new").onclick = () => editRule(null);
  $("#ru-sim").onclick = () => { const out = { Approve: 0, Review: 0, Reject: 0, None: 0 }; DB.sessions.forEach((s) => { const r = DB.rules.find((x) => x.on && ruleMatch(x, s)); out[r ? r.act : "None"]++; }); const box = $("#ru-out"); box.hidden = false; box.innerHTML = `<div class="card-h"><h2>Simulation on ${DB.sessions.length} recent people</h2></div><div id="ru-d"></div>`; donut($("#ru-d"), { data: [{ label: "Approve", value: out.Approve, color: "var(--c2)" }, { label: "Review", value: out.Review, color: "var(--c4)" }, { label: "Reject", value: out.Reject, color: "var(--c3)" }, { label: "No rule (default: review)", value: out.None, color: "var(--c5)" }], size: 150, thick: 20, sub: "people", cfmt: "n" }); box.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "nearest" }); };
} };

/* ---------- Audit log ---------- */
App.pages.audit = { title: "Audit log", render(v) {
  bandHead("Audit log", "Every decision and setting change, kept for regulators", `<button type="button" class="btn" id="au-csv">${ic("download")}Export</button>`);
  v.innerHTML = `<section class="card" data-rise><div id="au-t"></div></section>`;
  table($("#au-t"), { rows: () => DB.audit.map((a, i) => ({ id: "a" + i, ...a })), search: ["who", "what"], ph: "Search people or actions…", chips: { k: "kind", opts: ["Decision", "Config"] }, size: 14, sort: "t", dir: -1, cols: [{ k: "t", label: "When", render: (r) => `<span class="code">${fdt(r.t)}</span>` }, { k: "who", label: "Who", render: (r) => `<span class="row" style="gap:6px">${r.who === "Rules engine" ? `<span class="av" style="--h:250">RE</span>` : av(r.who)}${esc(r.who)}</span>` }, { k: "what", label: "What" }, { k: "kind", label: "Type", render: (r) => pill(r.kind, r.kind === "Config" ? "acc" : "info") }], onRow: (r) => { const m = r.what.match(/VS-\d+/); m && S(m[0]) ? go("#/case/" + m[0]) : toast(r.what, "info"); } });
  $("#au-csv").onclick = () => download("truefold-audit.csv", toCSV(DB.audit, [{ k: "t", label: "When", csv: (r) => new Date(r.t).toISOString() }, { k: "who", label: "Who" }, { k: "what", label: "What" }, { k: "kind", label: "Type" }]));
} };

/* ---------- Settings ---------- */
App.pages.settings = { title: "Settings", render(v) {
  bandHead("Settings", "Privacy, alerts and demo data");
  v.innerHTML = `<div class="grid"><section class="card s6" data-rise><div class="card-h"><h2>Privacy</h2></div><div class="set-row"><div><b>Keep documents for</b><small>Then photos are deleted and only results stay</small></div><div class="range-row" style="width:220px"><label class="sr-only" for="keep">Days to keep</label><input type="range" id="keep" min="7" max="365" value="${DB.prefs.keep}"><output for="keep" id="keep-v">${DB.prefs.keep} days</output></div></div><div class="set-row"><div><b>Blur document numbers</b><small>For reviewers without full access</small></div>${sw("pf-blur", DB.prefs.blur, "Blur document numbers")}</div></section>
  <section class="card s6" data-rise><div class="card-h"><h2>Alerts</h2></div><div class="set-row"><div><b>Email me every rejection</b><small>Daily summary at 18:00</small></div>${sw("pf-mail", DB.prefs.mailDecisions, "Email rejections")}</div><form id="org" class="form-grid" novalidate style="margin-top:10px"><div class="field full"><label for="org-n">Company shown to people</label><input id="org-n" value="${esc(DB.org)}" aria-describedby="org-n-e"><p class="err" id="org-n-e"></p></div><div class="full"><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card s6" data-rise><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Dark theme</b><small>Night indigo</small></div>${sw("st-dark", Theme.get() === "dark", "Dark theme")}</div><div class="set-row"><div><b>Reset demo data</b><small>Sessions, rules and reviewers return to the sample</small></div><button type="button" class="btn sm danger ghost" id="st-reset">${ic("refresh")}Reset</button></div></section></div>`;
  $("#keep").addEventListener("input", (e) => { DB.prefs.keep = +e.target.value; $("#keep-v").textContent = e.target.value + " days"; save(); });
  $("#pf-blur").onchange = (e) => { DB.prefs.blur = e.target.checked; save(); toast("Saved"); };
  $("#pf-mail").onchange = (e) => { DB.prefs.mailDecisions = e.target.checked; save(); toast("Saved"); };
  $("#org").onsubmit = (e) => { e.preventDefault(); const n = $("#org-n").value.trim(); $("#org-n-e").textContent = n.length < 2 ? "Enter a company name" : ""; if (n.length < 2) return; DB.org = n; $(".logo small").textContent = "Onboarding checks · " + n; log("Changed company name to " + n, "Config"); save(); toast("Saved"); };
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-reset").onclick = async () => { if (await confirmBox("Reset demo data?", "Everything returns to the sample.", "Reset")) { store.del(KEY); DB = seed(); navQ(); rerender(); toast("Demo data reset"); } };
} };

/* ---------- Live: people move along the conveyor, sources report latency ---------- */
every(1000, () => {
  conveyorTick();
  if (Date.now() % 4 === 0 || chance(0.25)) { DB.sources.forEach((s) => { s.lat.push(Math.max(10, s.lat[s.lat.length - 1] * rf(0.85, 1.15))); s.lat.shift(); }); if (App.cur === "sources" && App.dsT && !layers.length) App.dsT.render(true); }
});
every(15000, () => { const s = mkSession(DB.seq++, DB.team, Date.now()); s.id = "VS-" + DB.seq; DB.sessions.unshift(s); if (DB.sessions.length > 120) DB.sessions.pop(); DB.daily[0][29]++; if (s.status === "In review") Notes.add(`${s.name} needs a manual look (risk ${s.score})`, "warn"); save(); navQ(); const k = $("#k-today"); k && countUp(k, DB.daily[0][29] + DB.daily[1][29] + DB.daily[2][29], fmt, 500); });
// The page title lives in the band, so focus it after each route change
let firstRoute = true;
App.onRoute = () => { if (!firstRoute) { const h = $("#pg-h1"); h && h.focus({ preventScroll: true }); } firstRoute = false; laneTokens = []; };
App.commands = () => [{ label: "Review next person", hint: "Queue", run: () => { const s = DB.sessions.find((x) => x.status === "In review"); s && go("#/case/" + s.id); } }, { label: "New rule", hint: "Rules", run: () => editRule(null) }, ...DB.sessions.slice(0, 14).map((s) => ({ label: `${s.name} · ${s.id}`, hint: s.status, run: () => go("#/case/" + s.id) }))];
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; };
[["Sanctions list feed refreshed (2,184 new names)", "info", 30], ["Address register is slow (610 ms)", "warn", 75], ["3 people waiting more than 10 minutes", "bad", 6]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
navQ();
boot({ title: "Truefold", key: "truefold", def: "overview" });
</script>
</body>
</html>
