<!doctype html>
<!-- Chill & Craft · Dakiya · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dakiya · COD orders and courier cash</title>
<style>
/* ===== Shared base: reset, overlays, forms, tables, charts (themed by the variables below) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* page entrance: each app picks --enter-anim */
.enter{animation:var(--enter-anim,rise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px)}}
@keyframes blurin{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.row-in{animation:fadein .4s ease both;animation-delay:calc(var(--i,0) * 28ms)}

/* buttons press in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm,10px);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;background:var(--surface2);color:var(--text);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .35s}

/* chips and segmented control */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent,#fff)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .4s cubic-bezier(.3,1.3,.5,1),width .4s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:800;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 50% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 82%)}

/* tooltip, toasts, popovers */
#tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tip-bg,#111827);color:var(--tip-ink,#f9fafb);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:240px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#toasts{position:fixed;z-index:130;right:16px;bottom:16px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#111827);color:var(--tip-ink,#fff);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastin .45s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{color:var(--good)}
.toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--warn)}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.pop{position:fixed;z-index:110;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm,12px);box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;animation:pop .2s ease-out}
.pop [role="menuitem"]{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pop [role="menuitem"]:hover,.pop [role="menuitem"]:focus{background:var(--surface2);outline:none}
.pop-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{display:grid;gap:2px;padding:9px 10px 9px 22px;border-radius:8px;text-decoration:none;position:relative}
.note:hover{background:var(--surface2)}
.note.unread::before{content:"";position:absolute;left:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* modal and drawer */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.backdrop.side{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r,16px);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:modalin .38s cubic-bezier(.2,1.1,.3,1)}
.modal.wide{max-width:760px}
.modal.drawer{max-width:min(500px,100vw);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);animation:drawerin .4s cubic-bezier(.2,.9,.2,1)}
.backdrop.out{animation:fadein .22s reverse forwards}
.backdrop.out .modal{animation:modalin .22s reverse forwards}
.backdrop.out .drawer{animation:drawerin .25s reverse forwards}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes drawerin{from{transform:translateX(100%)}}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px}
.m-x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.m-body{padding:18px}
.m-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--surface);border-top:1px solid var(--line)}

/* forms with inline errors */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:10px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);animation:shake .35s}
.field .hint{color:var(--muted);font-size:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* data tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-search input{width:min(260px,100%);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tbl-search{flex:1 1 180px;max-width:280px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover,.tbl tr.click:focus{background:var(--surface2);outline:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sort-ic{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.3;transition:transform .2s}
th[aria-sort] .sort-ic{opacity:1}
th[aria-sort="ascending"] .sort-ic{transform:rotate(180deg) translateY(4px)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.pager button[disabled]{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.6,.1,.2,1) forwards}
.chart .fade{animation:fadein 1s .35s both}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hover{transition:opacity .15s;pointer-events:none}
.chart .hover circle{stroke:var(--surface);stroke-width:2.5}
.chart .grow{animation:grow .75s cubic-bezier(.2,.9,.3,1.15) both}
.chart .bcol{transition:opacity .2s}
.chart.hovering .bcol{opacity:.45}
.chart.hovering .bcol.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut{position:relative;flex:none}
.donut svg{overflow:visible}
.donut .seg-c{fill:none;transition:stroke-width .2s}
.donut .seg-c:hover{stroke-width:calc(var(--sw) * 1.25)}
.donut .sweep{animation:sweep .9s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 var(--C)}}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1 1 140px;min-width:0}
.lg li{display:flex;align-items:center;gap:4px}
.lg b{margin-left:auto;padding-left:10px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-f{display:block;height:100%;border-radius:999px;transform-origin:left}
.hb-f.growx{animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.ring-v{animation:ringin 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringin{from{stroke-dasharray:0 1}}
.gauge .g-v{animation:ringin 1.3s cubic-bezier(.3,.9,.3,1) both}
.hm{display:grid;gap:3px}
.hm-c{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0;animation:pop .4s both}
.spark{height:38px}

/* drag and drop */
.dragging{opacity:.35}
.ghost{position:fixed;z-index:140;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.3);opacity:.95;transition:none!important;animation:none!important}
.drop-hot{outline:2px dashed var(--accent);outline-offset:3px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* command search */
.cmdk .m-body{padding:12px}
.cmdk-in{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto}
.cmdk-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk-list li[aria-selected="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.cmdk-list li small{opacity:.7}
.cmdk-k{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* mobile nav drawer (sidebar apps) */
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.menu-btn{display:none!important}
@media (max-width:860px){
  .menu-btn{display:inline-grid!important}
  .side{position:fixed!important;z-index:60;top:0;bottom:0;left:0;width:min(280px,84vw)!important;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* theme switch reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,0))}}

/* print only the chosen area */
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}body.printing #print-root{display:block}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Dakiya look: airy white, coral and teal, a floating navy sidebar, soft rounded cards ===== */
:root{--font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;--bg:#f5f6fa;--surface:#ffffff;--surface2:#f1f3f8;--text:#16203a;--muted:#67708a;--line:#e4e7ef;--accent:#ff5a4e;--on-accent:#fff;--teal:#0d9488;--navy:#14213d;--good:#0d9488;--warn:#f59e0b;--bad:#e11d48;--c1:#ff5a4e;--c2:#0d9488;--c3:#6366f1;--c4:#f59e0b;--c5:#94a3b8;--r:18px;--r-sm:11px;--tip-bg:#14213d;--enter-anim:rise}
[data-theme="dark"]{--bg:#0d1220;--surface:#151c2e;--surface2:#1c2540;--text:#e8ecf7;--muted:#97a0bb;--line:#26304a;--accent:#ff6f61;--on-accent:#1a0705;--teal:#2dd4bf;--navy:#0a0f1c;--good:#2dd4bf;--warn:#fbbf24;--bad:#fb7185;--c1:#ff6f61;--c2:#2dd4bf;--c3:#818cf8;--c4:#fbbf24;--c5:#64748b;--tip-bg:#000}
body{background:var(--bg)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* floating navy sidebar (bottom bar on phones) */
.rail{position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:24px;background:var(--navy);color:#dfe5f5;display:flex;flex-direction:column;gap:18px;padding:18px 12px;box-shadow:0 20px 50px -20px rgba(20,33,61,.6)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;padding:0 6px}
.brand b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11.5px;opacity:.6}
.nav{position:relative;display:grid;gap:4px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;text-decoration:none;color:rgba(223,229,245,.7);font-weight:600;font-size:14.5px;transition:color .25s}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff}
.nav-marker{position:absolute;left:0;right:0;top:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),#ff8a5b);box-shadow:0 10px 24px -10px var(--accent);transition:transform .5s cubic-bezier(.3,1.35,.45,1),width .4s,height .3s;z-index:0}
.rail-card{margin-top:auto;border-radius:16px;background:rgba(255,255,255,.07);padding:12px;font-size:12.5px}
.rail-card b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:#fff}
@media (max-width:860px){.shell{grid-template-columns:1fr}.rail{position:fixed;z-index:60;left:8px;right:8px;bottom:8px;top:auto;margin:0;height:auto;padding:6px;border-radius:20px;flex-direction:row}.rail .brand,.rail-card{display:none}.nav{display:flex;width:100%;justify-content:space-between}.nav a{flex:1;flex-direction:column;gap:2px;padding:8px 2px;font-size:10px;justify-content:center;text-align:center}.nav a .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-marker{height:auto!important;top:0;bottom:0;left:0;right:auto}#view{padding-bottom:100px!important}#toasts{bottom:90px}}
@media (max-width:420px){.nav a .lbl{display:none}.nav a{padding:12px 2px}}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:18px 26px 4px}
.top-t{flex:1;min-width:0}
.top-t h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickup{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pickup b{font-variant-numeric:tabular-nums;color:var(--text);font-size:14px}
.icon-btn{border-radius:12px}
#view{padding:16px 26px 32px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(22,32,58,.04),0 12px 30px -22px rgba(22,32,58,.25);transition:transform .3s cubic-bezier(.3,1.3,.5,1),box-shadow .3s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(22,32,58,.04),0 22px 40px -24px rgba(22,32,58,.35)}
.btn{border-radius:12px}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff8a5b);box-shadow:0 10px 22px -12px var(--accent)}
.btn.teal{background:var(--teal);color:#fff}
.btn.wa{background:#1f9d55;color:#fff}
.h2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.h2 h2{margin:0;font-size:16px;font-weight:750}
.grid{display:grid;gap:18px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.55fr 1fr}
.g12{grid-template-columns:1fr 1.55fr}
.g2{grid-template-columns:1fr 1fr}
.mt{margin-top:18px}
.kpi .k-l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.kpi .dot{width:10px;height:10px;border-radius:4px;background:var(--kc)}
.kpi .k-v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.trend{font-weight:700;font-size:12px;padding:1px 7px;border-radius:999px}
.trend.up{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.trend.dn{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
/* live parcel map (signature) */
.map svg{display:block;width:100%;height:auto;max-height:420px}
.map .grid-dot{fill:color-mix(in srgb,var(--muted) 30%,transparent)}
.map .route{fill:none;stroke:color-mix(in srgb,var(--accent) 35%,transparent);stroke-width:1.4;stroke-dasharray:3 4}
.map .city{stroke:var(--surface);stroke-width:2;cursor:pointer;transition:r .3s}
.map .city:hover{stroke:var(--text)}
.map .lbl{font-size:10.5px;fill:var(--muted);font-weight:600;pointer-events:none}
.map .hub{fill:var(--navy);stroke:var(--accent);stroke-width:3}
[data-theme="dark"] .map .hub{fill:#fff}
.map .ring{fill:none;stroke:var(--accent);stroke-width:2;animation:hubring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hubring{from{transform:scale(.6);opacity:1}to{transform:scale(3.2);opacity:0}}
.map .parcel{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.legend-r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend-r i{display:block;width:120px;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--warn),var(--bad))}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
.cr{display:grid;gap:12px}
.cr-top{display:flex;align-items:center;gap:12px}
.cr-logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.cr .owed{font-size:26px;font-weight:800;letter-spacing:-.02em}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.mini div{background:var(--surface2);border-radius:12px;padding:8px 4px}
.mini b{display:block;font-size:16px}
.mini small{font-size:11px;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.stack span{transform-origin:left;animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
/* reconcile */
.stmts{display:grid;gap:8px}
.stmt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,background .2s,transform .15s}
.stmt:hover{transform:translateX(3px)}
.stmt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.stmt small{display:block;color:var(--muted);font-size:12px}
.rec-l{display:grid;gap:6px}
.rl{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--surface2);font-size:13.5px;border:1px solid transparent;transition:background .35s,border-color .35s}
.rl .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.rl.ok{background:color-mix(in srgb,var(--good) 10%,var(--surface2))}
.rl.ok .mk{background:var(--good);color:#fff;animation:pop .35s both}
.rl.diff{background:color-mix(in srgb,var(--warn) 13%,var(--surface2));border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.rl.diff .mk{background:var(--warn);color:#fff}
.rl.miss{background:color-mix(in srgb,var(--bad) 10%,var(--surface2));border-color:color-mix(in srgb,var(--bad) 45%,transparent);cursor:grab}
.rl.miss .mk{background:var(--bad);color:#fff}
.rl.scan{background:color-mix(in srgb,var(--c3) 16%,var(--surface2))}
.rl .no{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.owe{display:grid;gap:6px}
.owe .o{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px dashed var(--line);font-size:13.5px;transition:background .2s}
.owe .o.drop-hot{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.rec-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.track{list-style:none;margin:0;padding:0;display:grid;gap:0}
.track li{position:relative;padding:0 0 16px 28px;font-size:13.5px}
.track li::before{content:"";position:absolute;left:7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.track li::after{content:"";position:absolute;left:13px;top:18px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::after{display:none}
.track li.done::before{background:var(--good);border-color:var(--good)}
.track li.done.bad::before{background:var(--bad);border-color:var(--bad)}
.track li small{display:block;color:var(--muted)}
.label{border:2px dashed #333;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fff;color:#111}
.label .bar{height:44px;margin:10px 0;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 7px,#fff 7px 8px,#111 8px 9px,#fff 9px 12px)}
@media (max-width:1250px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){.top{padding:14px 14px 2px}#view{padding:12px 14px 30px}.pickup{display:none}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g5,.g4{grid-template-columns:1fr 1fr;gap:12px}.kpi .k-v{font-size:21px}.top-t h1{font-size:21px}.top-t p{display:none}.card{padding:16px}.mini{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Main menu">

    <nav class="nav" aria-label="Pages">

<script>
'use strict';
/* ===== Mini core: helpers, data seeding, router, theme, overlays, tables, charts, drag and drop ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10;
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
let RM=!!RMQ.matches;try{RMQ.addEventListener('change',e=>{RM=e.matches})}catch(e){}

/* --- seeded random so the demo data is the same on every load --- */
let R=Math.random;
function seedRng(s){let a=s>>>0;R=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],chance=p=>R()<p;
let _n=0;const uid=p=>(p||'')+(Date.now()%1e8).toString(36)+(++_n).toString(36);

/* --- Pakistani names, cities and phone numbers for demo data --- */
const PK={m:['Ahmed','Bilal','Usman','Hamza','Ali','Hassan','Imran','Faisal','Kashif','Zubair','Saad','Waqas','Adnan','Junaid','Rizwan','Tariq','Asad','Fahad','Shahid','Naveed','Arslan','Danish','Haris','Owais','Salman','Yasir','Nadeem','Sohail'],
f:['Ayesha','Fatima','Sana','Hira','Maryam','Zainab','Amna','Rabia','Nida','Iqra','Saima','Mehwish','Komal','Sadia','Bushra','Farah','Anum','Kiran','Laiba','Areeba','Samina','Noreen'],
l:['Khan','Malik','Butt','Sheikh','Qureshi','Chaudhry','Siddiqui','Raza','Iqbal','Abbasi','Mirza','Hashmi','Javed','Aslam','Rana','Awan','Baig','Ansari','Gill','Bhatti','Mughal','Niazi'],
cities:['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta','Sialkot','Gujranwala','Hyderabad','Bahawalpur','Sargodha','Abbottabad','Sukkur']};
const pname=g=>pick(g==='f'?PK.f:g==='m'?PK.m:(chance(.5)?PK.m:PK.f))+' '+pick(PK.l);
const phone=()=>'03'+rnd(0,4)+rnd(0,9)+'-'+String(rnd(1000000,9999999));

/* --- number and money formats (PKR) --- */
const NF=new Intl.NumberFormat('en-US');
const num=n=>NF.format(Math.round(+n||0));
const rs=n=>((+n||0)<0?'-':'')+'Rs '+NF.format(Math.abs(Math.round(+n||0)));
function short(n){n=+n||0;const a=Math.abs(n),s=n<0?'-':'',f=(v,u)=>s+(v>=100?Math.round(v):+v.toFixed(1))+u;return a>=1e9?f(a/1e9,'B'):a>=1e6?f(a/1e6,'M'):a>=1e3?f(a/1e3,'K'):s+Math.round(a)}
const rsk=n=>'Rs '+short(n);
const pct=(n,d=0)=>(+n||0).toFixed(d)+'%';
const FMT={num,rs,short,rsk,pct:v=>pct(v),pct1:v=>pct(v,1)};

/* --- dates (local, day precision) --- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};
const today=iso(TODAY);
const dd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
const ddy=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const daysAgo=s=>Math.round((TODAY-pd(s))/864e5);
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mlabel=k=>{const p=k.split('-');return MON[+p[1]-1]+' '+p[0].slice(2)};

/* --- storage that never throws (works when storage is blocked) --- */
const store={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* --- icons (our own simple strokes) --- */
const ICO={home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',cart:'<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',chart:'M4 20V11M10 20V5M16 20v-6M2 20h20',gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a5.5 5.5 0 0 1 3.5 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'M12 5v14M5 12h14',minus:'M5 12h14',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',menu:'M4 7h16M4 12h16M4 17h16',x:'M6 6l12 12M18 6L6 18',check:'M5 12.5l4.5 4.5L19 7',phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',truck:'<path d="M2 6h11v10H2zM13 9h4.5l3 3.5V16H13"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',file:'M6 2.5h8l4.5 4.5v14.5H6zM14 2.5V7h4.5M9 12h6M9 16h6',receipt:'M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21zM9 8h6M9 12h6M9 16h3',wrench:'M15 4a5 5 0 0 0-4.6 6.9L4 17.3V20h2.7l6.4-6.4A5 5 0 0 0 20 9l-3 3-3-1-1-3 3-3z',trophy:'M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.6 4M16 6h3.5a3.5 3.5 0 0 1-3.6 4M12 13v4M8.5 21h7M9.5 17h5v4h-5z',edit:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',print:'M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z',chat:'M4 20l1.3-3.9A8 8 0 1 1 8 19zM9 10h.01M12 10h.01M15 10h.01',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',arrow:'M5 12h14M13 6l6 6-6 6',filter:'M4 5h16l-6 7v6l-4 2v-8z',refresh:'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',alert:'M12 3l10 18H2zM12 10v5M12 18h.01',shop:'M3 9l2-5h14l2 5M4 9v11h16V9M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M10 20v-5h4v5',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>',food:'M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1-3 4-3 7h3v11',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',map:'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',down:'M12 4v12M6 11l6 6 6-6M5 20h14',hash:'M5 9h14M5 15h14M10 4L8 20M16 4l-2 16',coin:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',school:'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6',spark:'M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6'};
const ic=(n,s=20)=>{const d=ICO[n]||'';return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d[0]==='<'?d:`<path d="${d}"/>`}</svg>`};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=s=>String(s).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(n,cls='')=>`<span class="av ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;

/* --- WhatsApp reminder: only builds a wa.me link, the user opens it --- */
const WA_BASE='https://wa'+'.me/';
const waLink=(ph,text)=>WA_BASE+String(ph).replace(/\D/g,'').replace(/^0/,'92')+'?text='+encodeURIComponent(text);

/* --- tooltip and toasts --- */

    $('.od',m.el).innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${stS(o.st)}${kTag(o.cour)}${o.rem?'<span class="tag good">Cash received</span>':o.st==='delivered'?'<span class="tag warn">Courier owes cash</span>':''}${o.confirmed?'<span class="tag info">Confirmed by customer</span>':''}</div>
    <div class="grid g2" style="gap:10px;margin-bottom:14px"><div class="card" style="padding:12px"><small class="muted">COD amount</small><div style="font-size:22px;font-weight:800">${rs(o.cod)}</div></div><div class="card" style="padding:12px"><small class="muted">Tracking</small><div style="font-size:16px;font-weight:800;font-family:ui-monospace,Menlo,monospace">${o.trk}</div></div></div>
    <p style="margin:0 0 12px;font-size:14px"><b>${esc(o.items)}</b><br><span class="muted">${esc(o.cust)} · ${esc(o.phone)} · ${esc(o.city)}</span></p>
    <ul class="track">${steps.map((s,i)=>`<li class="${i<=cur?'done':''} ${s==='returned'?'bad':''}"><b>${STN[s]}</b><small>${i===0?ddy(o.date):i===cur&&o.done?ddy(o.done):i<=cur?'Scanned by '+esc(k.name):'Waiting'}${s==='returned'&&o.reason?' · '+esc(o.reason):''}</small></li>`).join('')}</ul>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${['delivered','returned'].includes(o.st)?'':`<button class="btn primary" data-a="next">${ic('arrow',15)}${o.st==='out'?'Mark delivered':'Next scan'}</button><button class="btn ghost" data-a="ret">Mark returned</button>`}${o.st==='booked'||o.st==='transit'?waA(o,confirmTxt(o),' Ask to confirm'):''}<button class="btn ghost" data-a="label">${ic('print',15)}Label</button></div>`};
  m.el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const o=OD(id);
    if(a.dataset.a==='next'){const n=FLOW[FLOW.indexOf(o.st)+1];o.st=n;if(n==='delivered')o.done=today;save();paint();refresh();toast('#'+o.no+' '+STN[n].toLowerCase())}
    if(a.dataset.a==='ret'){const F=[{k:'reason',label:'Reason',type:'select',opts:REASONS},{k:'restock',label:'Parcel back in stock?',type:'select',opts:[['yes','Yes'],['no','Not yet']]}];modal({title:'Mark #'+o.no+' returned',body:formHTML(F)+`<p class="muted" style="font-size:13px;margin:12px 0 0">${esc(KR(o.cour).name)} charges ${rs(KR(o.cour).rfee)} for a return.</p>`,actions:[{label:'Cancel',cls:'ghost'},{label:'Mark returned',cls:'danger',fn:mm=>{const v=readForm(mm,F);if(!v)return false;o.st='returned';o.done=today;o.reason=v.reason;o.restock=v.restock==='yes';save();paint();refresh();toast('#'+o.no+' marked returned','info')}}]})}
    if(a.dataset.a==='label')printHTML(`<div class="label" style="max-width:380px"><b>${esc(S.cfg.store)}</b> · ${esc(S.cfg.city)}<br>${esc(KR(o.cour).name)} · ${o.trk}<div class="bar"></div>TO: ${esc(o.cust)}<br>${esc(o.phone)}<br>${esc(o.city)}<br><br>ORDER #${o.no} · ${esc(o.items)}<br><b>COLLECT CASH: ${rs(o.cod)}</b></div>`)});
  paint()}

/* ---------- live map: parcels fly from the warehouse ---------- */
function mapSVG(L,hub){const by={};CITIES.forEach(c=>by[c[0]]=L.filter(o=>o.city===c[0]));const H=CITIES.find(c=>c[0]===hub)||CITIES[0],hx=mx(H[1]),hy=my(H[2]),mxO=Math.max(1,...CITIES.map(c=>by[c[0]].length));let dots='';
  for(let y=10;y<MAPH;y+=18)for(let x=10;x<MAPW;x+=18)dots+=`<circle class="grid-dot" cx="${x}" cy="${y}" r="1.1"/>`;
  const routes=CITIES.filter(c=>c[0]!==H[0]).map(c=>{const x=mx(c[1]),y=my(c[2]),cx=(hx+x)/2+(y-hy)*.25,cy=(hy+y)/2-(x-hx)*.25-20;return{c,d:`M${r1(hx)},${r1(hy)} Q${r1(cx)},${r1(cy)} ${r1(x)},${r1(y)}`,n:by[c[0]].filter(o=>o.st==='transit'||o.st==='out').length}});
  return `<svg viewBox="0 0 ${MAPW} ${MAPH}" role="img" aria-label="Map of order cities with parcels in transit from ${esc(H[0])}">${dots}${routes.map(r=>`<path class="route" d="${r.d}"/>`).join('')}
  ${RM?'':routes.filter(r=>r.n).map((r,i)=>Array.from({length:Math.min(3,Math.ceil(r.n/4))},(_,j)=>`<circle class="parcel" r="3.6"><animateMotion dur="${(4+i%4).toFixed(1)}s" begin="${(-j*1.6-i*.4).toFixed(1)}s" repeatCount="indefinite" path="${r.d}"/></circle>`).join('')).join('')}
  <circle class="ring" cx="${r1(hx)}" cy="${r1(hy)}" r="8"/>${CITIES.map(c=>{const L2=by[c[0]],rr=retRate(L2),x=mx(c[1]),y=my(c[2]);return `<circle class="city" data-city="${c[0]}" tabindex="0" role="img" aria-label="${c[0]}: ${L2.length} orders, ${Math.round(rr)}% returned" cx="${r1(x)}" cy="${r1(y)}" r="${r1(4+Math.sqrt(L2.length/mxO)*14)}" style="fill:${rateCol(rr)};fill-opacity:.85"/><text class="lbl" x="${r1(x+(LEFT.has(c[0])?-8:8))}" y="${r1(y+3)}" text-anchor="${LEFT.has(c[0])?'end':'start'}">${c[0]}</text>`}).join('')}<circle class="hub" cx="${r1(hx)}" cy="${r1(hy)}" r="7"/></svg>`}
function bindMap(box,L){$$('.city',box).forEach(c=>{const n=c.dataset.city,L2=L.filter(o=>o.city===n),h=()=>`<b>${n}</b><div>${L2.length} orders · ${L2.filter(o=>o.st==='transit'||o.st==='out').length} on the way</div><div>Returned: ${Math.round(retRate(L2))}%</div>`;c.addEventListener('pointermove',e=>tip(h(),e.clientX,e.clientY));c.addEventListener('pointerleave',hideTip);c.addEventListener('focus',()=>{const r=c.getBoundingClientRect();tip(h(),r.right,r.top)});c.addEventListener('blur',hideTip)})}

/* reconcile courier statements against our delivered orders */
let RK='k1',RS='';
function matchLines(st){return st.lines.map(l=>{const o=ON(l.no);if(!o||o.cour!==st.cour)return{l,state:'miss'};if(o.st!=='delivered')return{l,o,state:'diff',why:'Our status: '+STN[o.st]};if(o.cod!==l.cod)return{l,o,state:'diff',why:'We expected '+rs(o.cod)};return{l,o,state:'ok'}})}
function pgReconcile(el){const SS=S.stmts.filter(s=>s.cour===RK).sort((a,b)=>b.date.localeCompare(a.date));if(!SS.some(s=>s.id===RS))RS=(SS.find(s=>!s.done)||SS[0]||{}).id;const st=S.stmts.find(s=>s.id===RS),k=KR(RK);
  head('Reconcile','Match courier payment statements to your delivered orders');
  const M=st?matchLines(st):[],okN=M.filter(x=>x.state==='ok').length,inSt=new Set(M.filter(x=>x.o).map(x=>x.o.no)),owe=S.orders.filter(o=>o.cour===RK&&o.st==='delivered'&&!o.rem&&!inSt.has(o.no)&&(!st||o.done<=st.date)).sort((a,b)=>a.done.localeCompare(b.done));
  const tot=st?sum(st.lines,l=>l.cod-l.fee)-st.rfees:0;
  el.innerHTML=`<div class="h2"><div class="chips" role="group" aria-label="Courier">${COURIERS.map(c=>`<button class="chip" data-k="${c.id}" aria-pressed="${RK===c.id}">${esc(c.name)}</button>`).join('')}</div><span class="muted" style="font-size:13px">Still owed by ${esc(k.name)}: <b style="color:var(--text)">${rs(owedBy(RK))}</b></span></div>
  <div class="grid" style="grid-template-columns:minmax(0,280px) minmax(0,1fr)" id="recG"><section class="card"><div class="h2"><h2>Statements</h2></div><div class="stmts">${SS.map(s=>`<button class="stmt" data-s="${s.id}" aria-pressed="${s.id===RS}"><span class="cr-logo" style="background:${k.color};width:36px;height:36px;font-size:12px;border-radius:10px">${k.short}</span><span><b>${esc(s.ref)}</b><small>${dd(s.date)} · ${s.lines.length} parcels</small></span>${s.done?'<span class="tag good">Done</span>':'<span class="tag warn">Check</span>'}</button>`).join('')||'<p class="empty">No statements</p>'}</div></section>
  ${st?`<section class="card"><div class="h2"><h2>${esc(st.ref)} · paid ${rs(tot)}</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${st.done?'':`<button class="btn teal" id="auto">${ic('refresh',15)}Auto-match</button><button class="btn primary" id="accept">${ic('check',15)}Accept statement</button>`}</div></div>
  <div class="rec-sum" aria-live="polite"><span class="tag good" id="rsOk">${st.done?st.lines.length:0} matched</span><span class="tag warn">${M.filter(x=>x.state==='diff').length} differ</span><span class="tag bad">${M.filter(x=>x.state==='miss').length} unknown order no.</span><span class="tag">Fees ${rs(sum(st.lines,l=>l.fee))} · returns ${rs(st.rfees)}</span></div>
  <div class="grid g2"><div><div class="muted" style="font-size:12.5px;font-weight:700;margin-bottom:6px">STATEMENT LINES</div><div class="rec-l" id="recL">${M.map((x,i)=>`<div class="rl ${st.done?x.state:x.state==='ok'?'':x.state}" data-i="${i}" ${x.state==='miss'&&!st.done?`data-id="${x.l.no}"`:''}><span class="mk">${x.state==='ok'&&st.done?ic('check',14):x.state==='diff'?'!':x.state==='miss'?'?':i+1}</span><span><span class="no">#${x.l.no}</span>${x.why?`<br><small class="muted">${esc(x.why)}</small>`:x.state==='miss'?'<br><small class="muted">Not in your orders. Drag onto the right order.</small>':''}</span><b>${rs(x.l.cod)}</b>${x.state==='miss'&&!st.done?`<button class="btn sm ghost" data-fix="${x.l.no}" aria-label="Match line ${x.l.no} to an order">Match</button>`:'<span></span>'}</div>`).join('')}</div></div>
  <div><div class="muted" style="font-size:12.5px;font-weight:700;margin-bottom:6px">DELIVERED BUT NOT IN THIS STATEMENT (${owe.length})</div><div class="owe" id="owe">${owe.slice(0,14).map(o=>`<div class="o" data-zone="${o.no}"><span><b>#${o.no}</b> <small class="muted">${esc(o.city)} · delivered ${dd(o.done)}</small></span><b>${rs(o.cod)}</b><button class="btn sm ghost" data-oo="${o.id}">Open</button></div>`).join('')||'<p class="empty">Nothing outstanding.</p>'}</div></div></div></section>`:''}</div>`;
  if(innerWidth<900)$('#recG',el).style.gridTemplateColumns='1fr';
  if(st&&!st.done)dnd($('#recG',el),{item:'.rl.miss',zone:'.o',onDrop:(lno,ono)=>fixLine(st,+lno,+ono)});
  el.addEventListener('click',e=>{const kk=e.target.closest('[data-k]'),s=e.target.closest('[data-s]'),oo=e.target.closest('[data-oo]'),fx=e.target.closest('[data-fix]');
    if(kk){RK=kk.dataset.k;RS='';refresh();return}if(s){RS=s.dataset.s;refresh();return}if(oo){openOrder(oo.dataset.oo);return}
    if(fx){const cands=owe.slice(0,14);if(!cands.length){toast('No unmatched orders to link','info');return}menu(fx,cands.map(o=>({label:'#'+o.no+' · '+rs(o.cod),fn:()=>fixLine(st,+fx.dataset.fix,o.no)})),'Match line #'+fx.dataset.fix+' to')}
    if(e.target.closest('#auto'))autoMatch(el,M);
    if(e.target.closest('#accept')){const ok=M.filter(x=>x.state==='ok'),bad=M.length-ok.length;confirmBox(`Accept ${esc(st.ref)}? ${ok.length} orders are marked as paid (${rs(sum(ok,x=>x.l.cod))}).${bad?` ${bad} lines that do not match stay open for a claim.`:''}`,()=>{ok.forEach(x=>x.o.rem=st.id);st.done=true;save();refresh();paintRail();toast(st.ref+' reconciled');confetti()},'Accept',false)}})}
function fixLine(st,lno,ono){const l=st.lines.find(x=>x.no===lno),o=ON(ono);if(!l||!o)return;l.no=ono;if(Math.abs(l.cod-o.cod)>0)toast('Linked. Amount differs by '+rs(Math.abs(l.cod-o.cod)),'info');else toast('Line linked to #'+ono);save();refresh()}
function autoMatch(el,M){const rows=$$('.rl',el);let i=0,ok=0;const step=()=>{if(i>=rows.length){toast(ok+' of '+rows.length+' lines match your orders');return}const r=rows[i],x=M[+r.dataset.i];r.classList.add('scan');setTimeout(()=>{r.classList.remove('scan');if(x.state==='ok'){ok++;r.classList.add('ok');$('.mk',r).innerHTML=ic('check',14);$('#rsOk',el).textContent=ok+' matched'}i++;step()},RM?0:45)};step()}

/* returns */
function pgReturns(el){head('Returns','Parcels that came back: reasons, courier charges and restock');const R2=S.orders.filter(o=>o.st==='returned'),L=last(30);
  el.innerHTML=`<div class="grid g4">${[['Returned (45 days)',R2.length,'num'],['Return charges',sum(R2,o=>KR(o.cour).rfee),'rs'],['Not back in stock',R2.filter(o=>!o.restock).length,'num'],['Return rate (30 days)',retRate(L),'pct1']].map((k,i)=>`<article class="card kpi" style="--kc:var(--bad)"><div class="k-l"><span class="dot"></span>${k[0]}</div><div class="k-v">${cnt(k[1],k[2],'rt'+i)}</div></article>`).join('')}</div>
  <div class="grid g12 mt"><section class="card"><div class="h2"><h2>Why parcels come back</h2></div><div id="rD"></div></section><section class="card"><div id="rT"></div></section></div>`;
  donut($('#rD',el),{items:REASONS.map((r,i)=>({label:r,value:R2.filter(o=>o.reason===r).length,color:['var(--c1)','var(--c3)','var(--c4)','var(--c2)','var(--c5)','var(--bad)'][i]})),sub:'returns',size:160});
  table($('#rT',el),{id:'ret',search:'Search order or customer',chips:['All','Waiting to restock','Back in stock'],chipFn:(o,c)=>c==='Back in stock'?o.restock:!o.restock,rows:()=>R2,sortCol:1,sortDir:-1,pageSize:8,text:o=>o.no+' '+o.cust+' '+o.city,cols:[{label:'Order',k:'no',f:o=>'#'+o.no},{label:'Returned',k:'done',f:o=>dd(o.done)},{label:'City',k:'city'},{label:'Reason',k:'reason'},{label:'Courier',k:'cour',f:o=>kTag(o.cour)},{label:'Stock',v:o=>o.restock?1:0,f:o=>`<button class="chip" data-rs="${o.id}" aria-pressed="${o.restock}">${o.restock?'Back in stock':'Mark restocked'}</button>`}],onRow:id=>openOrder(id)});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-rs]');if(b){const o=OD(b.dataset.rs);o.restock=!o.restock;save();refresh();toast('#'+o.no+(o.restock?' is back in stock':' marked as not restocked'))}})}

/* settings */
function pgSettings(el){head('Settings','Store, pickup time and confirmation message');const F=[{k:'store',label:'Store name',req:true},{k:'city',label:'Warehouse city',type:'select',opts:CITIES.map(c=>c[0])},{k:'pickup',label:'Daily courier pickup (24h)',req:true,check:v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v)?'':'Use HH:MM, for example 17:00'},{k:'tpl',label:'Order confirmation (WhatsApp text)',type:'textarea',full:true,req:true,hint:'Use {name}, {store}, {no}, {items}, {amount} and {city}. It only opens WhatsApp with this text.'}];
  el.innerHTML=`<div class="grid g21"><section class="card"><div id="sf">${formHTML(F,S.cfg)}</div><button class="btn primary" id="sv" style="margin-top:14px">${ic('check',15)}Save</button></section><section class="card"><div class="h2"><h2>Demo data</h2></div><p class="muted" style="margin:0 0 12px">Restore 45 days of orders across ${CITIES.length} cities, 3 couriers and their payment statements.</p><button class="btn danger" id="rs">${ic('refresh',15)}Reset demo data</button></section></div>`;
  $('#sv',el).addEventListener('click',()=>{const v=readForm($('#sf',el),F);if(!v)return;Object.assign(S.cfg,v);save();refresh();toast('Settings saved')});
  $('#rs',el).addEventListener('click',()=>confirmBox('Reset all demo data?',()=>{S=seed();save();Object.keys(TS).forEach(k=>delete TS[k]);RS='';FK='';FC='';refresh();paintRail();toast('Demo data reset')},'Reset'))}

/* ---------- boot ---------- */
$('[data-cmdk]').innerHTML=ic('search',17);
const NAVI={overview:'home',orders:'box',couriers:'truck',cities:'pin',reconcile:'check',returns:'refresh',settings:'gear'};$$('.nav a').forEach(a=>{a.innerHTML=ic(NAVI[a.dataset.route],20)+'<span class="lbl">'+a.textContent+'</span>'});
const tickPickup=()=>{const[h,mi]=(S.cfg.pickup||'17:00').split(':').map(Number),n=new Date(),t=new Date(n);t.setHours(h,mi,0,0);if(t<=n)t.setDate(t.getDate()+1);const s=Math.floor((t-n)/1000);$('#pickup').textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};tickPickup();loop(1000,tickPickup,false);
const setAxis=()=>{const m=$('.nav-marker');m.dataset.axis=innerWidth>860?'y':'x';m.style.width='';m.style.height='';moveMarker()};
boot({name:'Dakiya',key:KEY,routes:[{path:'overview',label:'Overview',render:pgOverview},{path:'orders',label:'Orders',render:pgOrders},{path:'couriers',label:'Couriers',render:pgCouriers},{path:'cities',label:'Cities',render:pgCities},{path:'reconcile',label:'Reconcile',render:pgReconcile},{path:'returns',label:'Returns',render:pgReturns},{path:'settings',label:'Settings',render:pgSettings}],
  commands:[{label:'Book a COD order',run:()=>{go('orders');setTimeout(()=>{const b=$('#addO');b&&b.click()},80)}},{label:'Reconcile Hudhud Express',run:()=>{RK='k1';RS='';go('reconcile')}},{label:'Cash not received yet',run:()=>{TS.ord={q:'',chip:'Cash not received',sort:0,dir:-1,page:0};go('orders')}},{label:'Cities by return rate',run:()=>go('cities')}],
  notes:()=>{const n=[];S.stmts.filter(s=>!s.done).forEach(s=>n.push({id:'st-'+s.id,text:KR(s.cour).name+' sent statement '+s.ref,sub:s.lines.length+' parcels to check',href:'#/reconcile'}));const old=S.orders.filter(o=>o.st==='delivered'&&!o.rem&&daysAgo(o.done)>10);if(old.length)n.push({id:'old-'+old.length,text:old.length+' delivered parcels unpaid for 10+ days',sub:rs(sum(old,o=>o.cod))+' with couriers',href:'#/orders'});const unc=S.orders.filter(o=>!o.confirmed&&o.st==='booked').length;if(unc)n.push({id:'unc-'+unc+today,text:unc+' new orders not confirmed',sub:'Confirm on WhatsApp before dispatch',href:'#/overview'});return n},
  onRender:paintRail,onResize:setAxis});
setAxis();
</script>
</body>
</html>
