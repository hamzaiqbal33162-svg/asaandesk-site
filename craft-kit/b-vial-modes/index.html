<!doctype html>
<!-- Chill and Craft · Vial Modes · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vial Modes · Glass toggle buttons</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #eeeaf8;
    --blob-a: #ffcfe0;
    --blob-b: #c9dcff;
    --blob-c: #d6f7ee;
    --ink: #262142;
    --muted: #6c668a;
    --glass: rgba(255, 255, 255, 0.42);
    --glass-edge: rgba(255, 255, 255, 0.9);
    --glass-shadow: rgba(60, 50, 120, 0.22);
    --focus: #262142;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1024;
    --blob-a: #4a1f5e;
    --blob-b: #153a6b;
    --blob-c: #0f4a45;
    --ink: #eef0ff;
    --muted: #a3a8cc;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --glass-shadow: rgba(0, 0, 0, 0.5);
    --focus: #ffffff;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* Stage with soft colour blobs that drift slowly behind the glass */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; background: var(--bg); }
  .blobs {
    position: absolute;
    inset: -10%;
    background:
      radial-gradient(34% 38% at 18% 22%, var(--blob-a), transparent 70%),
      radial-gradient(36% 42% at 84% 30%, var(--blob-b), transparent 70%),
      radial-gradient(40% 36% at 50% 92%, var(--blob-c), transparent 70%);
    animation: drift-bg 16s ease-in-out infinite alternate;
  }
  @keyframes drift-bg { to { transform: translate(3%, -2%) rotate(4deg) scale(1.05); } }
  .panel { position: relative; text-align: center; width: min(420px, 100%); }
  .panel h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.01em; }
  .panel .sub { margin: 4px 0 20px; color: var(--muted); font-size: 0.9rem; }
  .vials { display: flex; justify-content: center; gap: clamp(10px, 3vw, 18px); }

  /* ---------- One glass toggle ---------- */
  .vial {
    --level: 0%;
    position: relative;
    width: clamp(88px, 27vw, 112px);
    height: 180px;
    padding: 0;
    border: 1.5px solid var(--glass-edge);
    border-radius: 30px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 18px 34px -18px var(--glass-shadow), inset 0 -10px 22px -16px rgba(255, 255, 255, 0.6);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    transform-origin: 50% 100%;
    transition: transform 0.6s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .vial:hover { transform: translateY(-4px) rotate(-2deg); }
  .vial:active { transform: scale(0.95, 0.92); transition-duration: 0.12s; }
  .vial:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .vial[aria-pressed="true"] { --level: 74%; box-shadow: 0 20px 40px -16px var(--c1), inset 0 -10px 22px -16px rgba(255, 255, 255, 0.6); }

  /* The liquid rises to --level with a springy overshoot; two waves ride on top */
  .liquid {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--level);
    background: linear-gradient(180deg, var(--c1), var(--c2));
    z-index: 1;
    transition: height 1.3s cubic-bezier(0.3, 1.4, 0.4, 1) 0.25s;
    transition-timing-function: linear(0, 0.165, 0.495, 0.916, 1.173, 1.302, 1.31, 1.234, 1.122, 0.995, 0.926, 0.899, 0.907, 0.937, 0.981, 1.01, 1.028, 1.032, 1.027, 1.016, 1.003, 0.994, 0.99, 0.992, 0.997, 1.002, 1.003, 1.001, 1);
  }
  .vial[aria-pressed="false"] .liquid { transition: height 0.8s cubic-bezier(0.6, 0, 0.7, 0.3); }
  .wave { position: absolute; left: 0; top: -11px; width: 200%; height: 12px; fill: var(--c1); transform-origin: 50% 100%; animation: drift 2.6s linear infinite; transition: opacity 0.3s; }
  .wave.back { opacity: 0.45; top: -14px; animation-duration: 3.8s; animation-direction: reverse; }
  .vial:hover .wave { animation-duration: 1.4s; }
  .vial:hover .wave.back { animation-duration: 2s; }
  .vial[aria-pressed="false"] .wave { opacity: 0; transition-delay: 0.7s; }
  @keyframes drift { to { transform: translateX(-50%); } }
  .liquid.slosh .wave { animation: drift 1.1s linear infinite, slosh 1.2s ease-out; }
  .liquid.swirl .wave { animation: drift 0.5s linear infinite, slosh 0.8s ease-in-out infinite; }
  @keyframes slosh { 0% { scale: 1 2.6; } 40% { scale: 1 0.6; } 100% { scale: 1 1; } }

  /* Pour: a thin stream falls from the top while filling */
  .stream { position: absolute; top: 0; bottom: 0; left: calc(50% - 3px); width: 6px; border-radius: 3px; background: linear-gradient(var(--c1), var(--c2)); transform: scaleY(0); transform-origin: top; z-index: 0; }
  .vial.pouring .stream { animation: pour 1.3s ease forwards; }
  @keyframes pour {
    0% { transform: scaleY(0); transform-origin: top; }
    22% { transform: scaleY(1); transform-origin: top; }
    70% { transform: scaleY(1) scaleX(0.6); transform-origin: bottom; }
    100% { transform: scaleY(0) scaleX(0.3); transform-origin: bottom; }
  }

  /* Rising bubbles while a mode is on, each at its own speed */
  .bub { position: absolute; bottom: 8px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.75); opacity: 0; }
  .bub:nth-of-type(1) { left: 24%; }
  .bub:nth-of-type(2) { left: 58%; width: 4px; height: 4px; }
  .bub:nth-of-type(3) { left: 76%; }
  .vial[aria-pressed="true"] .bub { animation: rise 2.4s ease-in infinite 1.4s; }
  .vial[aria-pressed="true"] .bub:nth-of-type(2) { animation-duration: 1.7s; animation-delay: 1.9s; }
  .vial[aria-pressed="true"] .bub:nth-of-type(3) { animation-duration: 3.1s; animation-delay: 2.4s; }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(4px, -48px); } 100% { transform: translate(-2px, -100px); opacity: 0; } }

  /* Droplets that splash when the stream lands, and a surface ripple */
  .drop { position: absolute; left: 0; top: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--c1); z-index: 2; pointer-events: none; }
  .ripple { position: absolute; left: 50%; width: 60%; height: 10px; margin-left: -30%; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); z-index: 2; pointer-events: none; opacity: 0; }

  /* Glass glare slides when hovered */
  .glare { position: absolute; top: 14px; left: 10px; width: 10px; height: 58%; border-radius: 10px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0)); z-index: 3; pointer-events: none; transition: transform 0.6s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .vial:hover .glare { transform: translateX(6px) skewX(-6deg); }

  /* Icon, name and badge sit above the liquid */
  .face { position: relative; z-index: 2; height: 100%; display: grid; grid-template-rows: 1fr auto auto; justify-items: center; padding: 0 6px 18px; }
  .ico-wrap { position: relative; align-self: center; margin-top: 12px; width: 30px; height: 30px; }
  .ico { width: 30px; height: 30px; transition: color 0.4s ease 0.6s, transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .vial:hover .ico { transform: rotate(-10deg) scale(1.08); }
  .vial:active .ico { transform: translateY(3px) scale(0.9); }
  .name { font-weight: 650; font-size: 0.86rem; line-height: 1.15; transition: color 0.4s ease 0.45s; }
  .state { margin-top: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); transition: color 0.3s ease 0.4s, background 0.3s ease 0.4s; }
  .vial[aria-pressed="true"] .name, .vial[aria-pressed="true"] .ico { color: #fff; }
  .vial[aria-pressed="true"] .state { color: #fff; background: rgba(255, 255, 255, 0.24); }
  .vial[aria-pressed="false"] .name, .vial[aria-pressed="false"] .ico, .vial[aria-pressed="false"] .state { transition-delay: 0s; }

  /* Small celebration bits per mode */
  .zz { position: absolute; left: 70%; top: -6px; font-size: 0.7rem; font-weight: 800; color: #fff; opacity: 0; pointer-events: none; }
  .pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #fff; opacity: 0; pointer-events: none; }

  .summary { margin: 18px 0 0; min-height: 1.4em; font-size: 0.9rem; color: var(--muted); }
  .summary b { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .liquid, .vial[aria-pressed="false"] .liquid { transition: height 0.2s linear; }
    .blobs, .wave, .liquid.slosh .wave, .liquid.swirl .wave, .vial[aria-pressed="true"] .bub, .vial.pouring .stream { animation: none; }
    .vial, .ico, .name, .state, .glare { transition: none; }
    .drop, .ripple, .zz, .pulse { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="blobs" aria-hidden="true"></div>
    <section class="panel" aria-labelledby="title">
      <h1 id="title">Focus modes</h1>
      <p class="sub">Tap a glass to fill it and turn the mode on.</p>

      <div class="vials" id="vials">
        <button class="vial" type="button" aria-pressed="false" data-mode="sleep" style="--c1:#8b7bff;--c2:#5a46e0" data-on="Sleep is on until 7:00 AM.">
          <span class="stream" aria-hidden="true"></span>
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 V12 H0 Z" /></svg>
            <svg class="wave" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 V12 H0 Z" /></svg>
            <i class="bub"></i><i class="bub"></i><i class="bub"></i>
          </span>
          <span class="glare" aria-hidden="true"></span>
          <span class="face">
            <span class="ico-wrap" aria-hidden="true">
              <svg class="ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
            </span>
            <span class="name">Sleep</span>
            <span class="state" aria-hidden="true">Off</span>
          </span>
        </button>

        <button class="vial" type="button" aria-pressed="false" data-mode="dnd" style="--c1:#ff6f9c;--c2:#e0346b" data-on="Do Not Disturb is on. Calls from favourites still ring.">
          <span class="stream" aria-hidden="true"></span>
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 V12 H0 Z" /></svg>
            <svg class="wave" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 V12 H0 Z" /></svg>
            <i class="bub"></i><i class="bub"></i><i class="bub"></i>
          </span>
          <span class="glare" aria-hidden="true"></span>
          <span class="face">
            <span class="ico-wrap" aria-hidden="true">
              <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" /><path class="bar" d="M8 12h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
            </span>
            <span class="name">Do Not Disturb</span>
            <span class="state" aria-hidden="true">Off</span>
          </span>
        </button>

        <button class="vial" type="button" aria-pressed="false" data-mode="focus" style="--c1:#3fe0c5;--c2:#0ea38a" data-on="Focus is on. Four noisy apps are muted.">
          <span class="stream" aria-hidden="true"></span>
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 V12 H0 Z" /></svg>
            <svg class="wave" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6 V12 H0 Z" /></svg>
            <i class="bub"></i><i class="bub"></i><i class="bub"></i>
          </span>
          <span class="glare" aria-hidden="true"></span>
          <span class="face">
            <span class="ico-wrap" aria-hidden="true">
              <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="1.2" fill="currentColor" /></svg>
            </span>
            <span class="name">Focus</span>
            <span class="state" aria-hidden="true">Off</span>
          </span>
        </button>
      </div>

      <p class="summary" id="summary" role="status" aria-live="polite">All modes are off.</p>
    </section>
  </main>

<script>
  // Vial Modes: each glass is an independent toggle (aria-pressed).
  // On: squash, pour, splash, springy fill, badge flip, a small celebration. Off: swirl and drain.
  (function () {
    var vials = Array.prototype.slice.call(document.querySelectorAll(".vial"));
    var summary = document.getElementById("summary");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }

    // Droplets jump out of the landing point and fall back
    function splash(v, x, y) {
      for (var i = 0; i < 7; i++) {
        var d = document.createElement("i");
        d.className = "drop";
        v.appendChild(d);
        var vx = (Math.random() - 0.5) * 50, vy = -20 - Math.random() * 30, frames = [];
        for (var k = 0; k <= 8; k++) {
          var t = k / 8;
          frames.push({ transform: "translate(" + (x + vx * t).toFixed(1) + "px," + (y + vy * t + 55 * t * t).toFixed(1) + "px) scale(" + (1 - t * 0.6).toFixed(2) + ")", opacity: t > 0.75 ? (1 - t) * 4 : 1 });
        }
        d.animate(frames, { duration: 520 + Math.random() * 200, delay: i * 40, easing: "linear", fill: "both" }).onfinish = (function (el) { return function () { el.remove(); }; })(d);
      }
    }

    // Badge flips over like a card while its word changes
    function flipBadge(badge, word) {
      if (calm.matches) { badge.textContent = word; return; }
      badge.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(90deg)" }], { duration: 160, easing: "ease-in" }).onfinish = function () {
        badge.textContent = word;
        springTo(badge, function (p) { return { transform: "rotateX(" + ((1 - p) * -90).toFixed(1) + "deg) scale(" + (1 + Math.sin(p * Math.PI) * 0.15).toFixed(3) + ")" }; }, 300, 14);
      };
    }

    // A small celebration that fits each mode
    function celebrate(v) {
      var wrap = v.querySelector(".ico-wrap");
      var mode = v.dataset.mode;
      if (mode === "sleep") {
        for (var i = 0; i < 3; i++) {
          var z = document.createElement("span");
          z.className = "zz";
          z.textContent = "z";
          z.style.fontSize = 0.6 + i * 0.18 + "rem";
          wrap.appendChild(z);
          z.animate([{ transform: "translate(0,0) rotate(-10deg)", opacity: 0 }, { opacity: 1, offset: 0.25 }, { transform: "translate(" + (10 + i * 6) + "px," + (-22 - i * 8) + "px) rotate(12deg)", opacity: 0 }], { duration: 1200, delay: i * 220, easing: "ease-out", fill: "both" }).onfinish = (function (el) { return function () { el.remove(); }; })(z);
        }
      } else if (mode === "dnd") {
        springTo(v.querySelector(".bar"), function (p) { return { transform: "scaleX(" + p.toFixed(3) + ")", transformOrigin: "12px 12px" }; }, 260, 10);
        v.querySelector(".ico").animate([{ transform: "rotate(0)" }, { transform: "rotate(-14deg)" }, { transform: "rotate(12deg)" }, { transform: "rotate(-8deg)" }, { transform: "rotate(0)" }], { duration: 600, easing: "ease-in-out" });
      } else {
        for (var j = 0; j < 2; j++) {
          var ring = document.createElement("span");
          ring.className = "pulse";
          wrap.appendChild(ring);
          ring.animate([{ transform: "scale(0.6)", opacity: 0.9 }, { transform: "scale(2.2)", opacity: 0 }], { duration: 800, delay: j * 220, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)", fill: "both" }).onfinish = (function (el) { return function () { el.remove(); }; })(ring);
        }
      }
    }

    function nameOf(v) { return v.querySelector(".name").textContent; }
    function update(changed) {
      var on = vials.filter(function (v) { return v.getAttribute("aria-pressed") === "true"; });
      var lead = changed.getAttribute("aria-pressed") === "true" ? changed.dataset.on : nameOf(changed) + " is off.";
      var tally = on.length === 0 ? "" : on.length === 1 ? "1 mode on." : on.length + " modes on.";
      summary.innerHTML = "<b>" + lead + "</b> " + tally;
    }

    vials.forEach(function (v) {
      var liquid = v.querySelector(".liquid");
      var badge = v.querySelector(".state");
      var timers = [];
      function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

      v.addEventListener("click", function () {
        var turnOn = v.getAttribute("aria-pressed") !== "true";
        timers.forEach(clearTimeout);
        timers = [];
        v.classList.remove("pouring");
        liquid.classList.remove("slosh", "swirl");
        v.setAttribute("aria-pressed", String(turnOn));
        flipBadge(badge, turnOn ? "On" : "Off");
        update(v);
        if (calm.matches) return;

        var h = v.clientHeight, w = v.clientWidth;
        var glow = getComputedStyle(v).getPropertyValue("--c1").trim() || "#fff";
        if (turnOn) {
          // 1. squash and spring up
          springTo(v, function (p) { return { transform: "scale(" + (1.05 - 0.05 * p).toFixed(3) + "," + (0.9 + 0.1 * p).toFixed(3) + ")" }; }, 320, 10);
          // 2. pour, then splash where the stream lands
          void v.offsetWidth;
          v.classList.add("pouring");
          later(function () { splash(v, w / 2, h - 10); }, 300);
          // 3. springy fill: waves slosh hard, then calm down
          later(function () { liquid.classList.add("slosh"); }, 700);
          // 4. finish: ripple on the surface, glow pulse, mode celebration
          later(function () {
            var rp = document.createElement("span");
            rp.className = "ripple";
            rp.style.bottom = "74%";
            v.appendChild(rp);
            rp.animate([{ transform: "scale(0.3)", opacity: 1 }, { transform: "scale(1.4)", opacity: 0 }], { duration: 700, easing: "ease-out" }).onfinish = function () { rp.remove(); };
            v.animate([{ boxShadow: "0 0 0 0 " + glow }, { boxShadow: "0 0 0 22px transparent" }], { duration: 700, easing: "ease-out" });
            celebrate(v);
          }, 1250);
          later(function () { v.classList.remove("pouring"); liquid.classList.remove("slosh"); }, 2200);
        } else {
          // drain: the liquid swirls, then sinks
          springTo(v, function (p) { return { transform: "rotate(" + (Math.sin(p * Math.PI * 2) * 3 * (1 - p)).toFixed(2) + "deg)" }; }, 180, 8);
          liquid.classList.add("swirl");
          later(function () { liquid.classList.remove("swirl"); }, 900);
        }
      });
    });
  })();
</script>
</body>
</html>
