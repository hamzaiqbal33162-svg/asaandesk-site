<!doctype html>
<!-- Chill & Craft · Moon Bloom · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Bloom · three night flowers</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens: light is a pastel dusk, dark is deep night ---------- */
  :root {
    --page: #f6edf4;
    --ink: #3a2847;
    --muted: #7a6688;
    --sky1: #8a7bcb;
    --sky2: #e6a5c6;
    --sky3: #ffd8bd;
    --star: #ffffff;
    --moon: #fff8ea;
    --glow: #fff3d8;
    --cloud: #fbe9f3;
    --hill1: #7a649f;
    --hill2: #4c3d73;
    --grass: #3a3060;
    --stem: #3e8f5c;
    --leaf: #4aa86b;
    --rib: rgba(255, 255, 255, 0.35);
    --core: #ffc94a;
    --fly: #fff1a8;
    --field: #ffffff;
    --line: rgba(58, 40, 71, 0.2);
    --btn: #c2306e;
    --btn-ink: #ffffff;
    --focus: #7b2bd1;
    --note: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #090a1a; --ink: #f6eaff; --muted: #b3a5c9;
      --sky1: #060a22; --sky2: #191744; --sky3: #3d2453;
      --star: #ffffff; --moon: #fff4d4; --glow: #ffe9b0; --cloud: #3a3466;
      --hill1: #1c1a3c; --hill2: #111027; --grass: #0b1620;
      --stem: #3f9a63; --leaf: #3e9a5f; --rib: rgba(255, 255, 255, 0.22);
      --core: #ffd25a; --fly: #ffe98a;
      --field: #17162f; --line: rgba(246, 234, 255, 0.18);
      --btn: #ff6fa6; --btn-ink: #1a0b1c; --focus: #ffd25a; --note: #fff0f8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #090a1a; --ink: #f6eaff; --muted: #b3a5c9;
    --sky1: #060a22; --sky2: #191744; --sky3: #3d2453;
    --star: #ffffff; --moon: #fff4d4; --glow: #ffe9b0; --cloud: #3a3466;
    --hill1: #1c1a3c; --hill2: #111027; --grass: #0b1620;
    --stem: #3f9a63; --leaf: #3e9a5f; --rib: rgba(255, 255, 255, 0.22);
    --core: #ffd25a; --fly: #ffe98a;
    --field: #17162f; --line: rgba(246, 234, 255, 0.18);
    --btn: #ff6fa6; --btn-ink: #1a0b1c; --focus: #ffd25a; --note: #fff0f8;
    color-scheme: dark;
  }

  /* ---------- Layout ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* the scene keeps its shape and also fits the height of short frames */
  .wrap {
    width: 100%;
    max-width: max(320px, min(780px, calc((100vh - 170px) * 1.25 + 32px)));
    padding: 16px;
    display: grid;
    gap: 14px;
  }
  .scene {
    position: relative;
    width: 100%;
    aspect-ratio: 700 / 560;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(20, 10, 40, 0.28);
    cursor: pointer;
  }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Scene pieces ---------- */
  .s1 { stop-color: var(--sky1); }
  .s2 { stop-color: var(--sky2); }
  .s3 { stop-color: var(--sky3); }
  .g1 { stop-color: var(--glow); stop-opacity: 0.55; }
  .g2 { stop-color: var(--glow); stop-opacity: 0; }
  .star { fill: var(--star); animation: twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 0.95; } }
  .moon { fill: var(--moon); }
  .moon-halo { animation: halo 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes halo { 50% { transform: scale(1.08); opacity: 0.8; } }
  .crater { fill: #000; opacity: 0.05; }
  .cloud { fill: var(--cloud); opacity: 0.55; }
  .hill1 { fill: var(--hill1); }
  .hill2 { fill: var(--hill2); }
  .blade { fill: none; stroke: var(--grass); stroke-width: 3; stroke-linecap: round; }
  .stem { fill: none; stroke: var(--stem); stroke-width: 6; stroke-linecap: round; }
  .leaf { fill: var(--leaf); }
  .rib { fill: none; stroke: var(--rib); stroke-width: 1.4; stroke-linecap: round; }
  .head { filter: drop-shadow(0 0 10px rgba(255, 110, 170, 0.55)); }
  .head.glowing { filter: drop-shadow(0 0 22px rgba(255, 150, 200, 0.95)); }
  .core { fill: var(--core); }
  .stamen { fill: #fff6c9; }
  .fly { fill: var(--fly); }
  .fly-halo { fill: var(--fly); opacity: 0.18; }
  .spark { fill: #fff6c2; }
  .shoot { stroke: #fff; stroke-width: 2; stroke-linecap: round; }

  /* Message on the sky */
  .note {
    position: absolute;
    left: 6%;
    top: 7%;
    right: 34%;
    margin: 0;
    color: var(--note);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(18px, 4.4vw, 34px);
    line-height: 1.2;
    text-shadow: 0 2px 14px rgba(40, 10, 60, 0.45);
    pointer-events: none;
  }
  .note span.w { display: inline-block; opacity: 0; transform: translateY(14px) rotate(4deg); filter: blur(4px); transition: opacity 0.7s ease, transform 0.9s cubic-bezier(.2,.8,.2,1), filter 0.7s ease; }
  .note.show span.w { opacity: 1; transform: none; filter: none; }

  /* Invisible buttons over each flower head (keyboard + tap) */
  .bloom-btn {
    position: absolute;
    width: 15%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  .bloom-btn:focus-visible { outline: 3px dashed var(--focus); outline-offset: 2px; }

  /* ---------- Controls ---------- */
  .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; justify-content: space-between; }
  .field { display: grid; gap: 4px; flex: 1 1 180px; }
  .field label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .field input {
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--ink);
    min-width: 0;
  }
  .field input:focus-visible, .grow:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .grow {
    font: 700 15px system-ui, sans-serif;
    padding: 11px 20px;
    border-radius: 999px;
    border: 0;
    background: var(--btn);
    color: var(--btn-ink);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .grow:active { transform: scale(0.96); }
  .status { margin: 0; font-size: 14px; color: var(--muted); min-height: 1.4em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .star, .moon-halo { animation: none; }
    .star { opacity: 0.7; }
    .note span.w { transform: none; filter: none; transition: opacity 0.4s ease; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="sr">Moon Bloom: three flowers that grow and open under the moon</h1>
  <div class="scene" id="scene">
    <svg id="svg" viewBox="0 0 700 560" role="img" aria-labelledby="sceneTitle">
      <title id="sceneTitle">A night meadow under a full moon where three pink flowers grow and bloom</title>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="s1"/><stop offset="0.6" class="s2"/><stop offset="1" class="s3"/>
        </linearGradient>
        <radialGradient id="moonGlow"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></radialGradient>
        <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="-80" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <!-- One petal gradient per flower: deep at the base, soft at the tip -->
        <linearGradient id="pg0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2337a"/><stop offset="1" stop-color="#ffd0e2"/></linearGradient>
        <linearGradient id="pg1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f0446f"/><stop offset="1" stop-color="#ffc9d6"/></linearGradient>
        <linearGradient id="pg2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#cc49c4"/><stop offset="1" stop-color="#ffd6f5"/></linearGradient>
        <linearGradient id="pin" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b0124f"/><stop offset="1" stop-color="#ff8fbd"/></linearGradient>
      </defs>

      <rect x="-40" y="-20" width="780" height="600" fill="url(#sky)"/>

      <!-- Depth layers: each one shifts a different amount with the pointer -->
      <g id="layerSky">
        <g id="stars"></g>
        <g id="shooting"></g>
        <circle class="moon-halo" cx="565" cy="112" r="110" fill="url(#moonGlow)"/>
        <circle class="moon" cx="565" cy="112" r="46"/>
        <circle class="crater" cx="552" cy="100" r="9"/>
        <circle class="crater" cx="580" cy="126" r="6"/>
        <circle class="crater" cx="574" cy="95" r="4"/>
        <g id="clouds"></g>
      </g>
      <g id="layerFar">
        <path class="hill1" d="M-40 430 C90 380 180 400 260 410 C360 422 420 372 520 390 C600 404 650 380 740 395 L740 580 L-40 580Z"/>
      </g>
      <g id="layerNear">
        <path class="hill2" d="M-40 500 C120 470 250 492 350 488 C470 484 580 470 740 492 L740 580 L-40 580Z"/>
        <g id="stems"></g>
        <g id="leaves"></g>
        <g id="heads"></g>
        <g id="petals"></g>
        <g id="grass"></g>
      </g>
      <g id="flies"></g>
      <g id="sparks"></g>
    </svg>
    <p class="note" id="note" aria-live="off"></p>
  </div>

  <div class="controls">
    <div class="field">
      <label for="name">Who are they for?</label>
      <input id="name" type="text" value="Hira" maxlength="24" autocomplete="off">
    </div>
    <button class="grow" id="grow" type="button">Grow again</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    "use strict";
    var NS = "http://www.w3.org/2000/svg";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (id) { return document.getElementById(id); };
    var svg = $("svg"), scene = $("scene");

    function el(tag, attrs, parent) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    }
    function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function easeBack(t) { var c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
    function f1(n) { return n.toFixed(1); }

    // Small seeded random so the stars and grass look the same on every load
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

    /* ---------- 1. Sky: stars and clouds ---------- */
    for (var i = 0; i < 80; i++) {
      var s = el("circle", { cx: f1(-30 + rnd() * 760), cy: f1(rnd() * 360), r: (0.6 + rnd() * 1.3).toFixed(2), "class": "star" }, $("stars"));
      s.style.animationDelay = (-rnd() * 3).toFixed(2) + "s";
      s.style.animationDuration = (2 + rnd() * 3).toFixed(2) + "s";
    }
    var clouds = [];
    [[420, 150, 1], [120, 90, 0.8], [660, 230, 0.6]].forEach(function (c) {
      var g = el("g", { "class": "cloud" }, $("clouds"));
      [[0, 0, 46, 16], [-34, 6, 30, 12], [36, 5, 34, 12], [8, -10, 28, 14]].forEach(function (b) {
        el("ellipse", { cx: b[0], cy: b[1], rx: b[2], ry: b[3] }, g);
      });
      clouds.push({ g: g, x: c[0], y: c[1], k: c[2] });
    });

    /* Grass blades: rebuilt every frame so a wind wave can run through them */
    var blades = [];
    for (var b = 0; b < 78; b++) {
      var x = -30 + b * 10 + rnd() * 8;
      blades.push({ node: el("path", { "class": "blade" }, $("grass")), x: x, top: 516 + rnd() * 28, lean: (rnd() - 0.5) * 18 });
    }
    function drawGrass(t, gust) {
      blades.forEach(function (bl) {
        var sway = reduce.matches ? 0 : Math.sin(t * 1.8 - bl.x * 0.018) * (4 + gust * 6);
        var tipX = bl.x + bl.lean + sway;
        bl.node.setAttribute("d", "M" + f1(bl.x) + " 566 Q" + f1(bl.x + (bl.lean + sway) * 0.35) + " " + f1(bl.top + 22) + " " + f1(tipX) + " " + f1(bl.top));
      });
    }

    /* ---------- 2. The three flowers ---------- */
    var PETAL = {
      round: "M0 0 C-14 -8 -17 -30 0 -40 C17 -30 14 -8 0 0Z",
      heart: "M0 0 C-16 -10 -20 -32 -9 -40 C-4 -43 0 -40 0 -35 C0 -40 4 -43 9 -40 C20 -32 16 -10 0 0Z",
      slim: "M0 0 C-8 -10 -9 -32 0 -44 C9 -32 8 -10 0 0Z"
    };
    var LEAF = "M0 0 C12 -10 30 -10 42 0 C30 10 12 10 0 0Z";
    var FLOWERS = [
      { stem: "M230 520 C214 440 254 330 226 228", hx: 226, hy: 228, n: 6, shape: "round", size: 1, leaves: [[0.32, 1], [0.58, -1]], label: "left" },
      { stem: "M350 522 C368 420 326 290 352 168", hx: 352, hy: 168, n: 5, shape: "heart", size: 1.15, leaves: [[0.28, -1], [0.54, 1]], label: "middle" },
      { stem: "M470 520 C488 430 452 330 476 244", hx: 476, hy: 244, n: 8, shape: "slim", size: 0.95, leaves: [[0.38, 1], [0.62, -1]], label: "right" }
    ];

    FLOWERS.forEach(function (F, i) {
      F.idx = i;
      F.stemEl = el("path", { d: F.stem, "class": "stem" }, $("stems"));
      F.len = F.stemEl.getTotalLength();
      F.stemEl.style.strokeDasharray = F.len.toFixed(1);
      F.leafEls = F.leaves.map(function (pair) {
        var pt = F.stemEl.getPointAtLength(F.len * pair[0]);
        var lg = el("g", {}, $("leaves"));
        el("path", { d: LEAF, "class": "leaf" }, lg);
        el("path", { d: "M3 0 L36 0", "class": "rib" }, lg);
        return { g: lg, f: pair[0], side: pair[1], x: pt.x, y: pt.y, ph: rnd() * 6 };
      });

      F.head = el("g", { "class": "head" }, $("heads"));
      el("path", { d: PETAL.slim, "class": "leaf", transform: "rotate(150) scale(0.55)" }, F.head);
      el("path", { d: PETAL.slim, "class": "leaf", transform: "rotate(-150) scale(0.55)" }, F.head);
      F.outer = []; F.inner = [];
      for (var k = 0; k < F.n; k++) F.outer.push(el("path", { d: PETAL[F.shape], fill: "url(#pg" + i + ")" }, F.head));
      for (var m = 0; m < F.n; m++) F.inner.push(el("path", { d: PETAL[F.shape], fill: "url(#pin)" }, F.head));
      F.core = el("g", {}, F.head);
      el("circle", { r: 9, "class": "core" }, F.core);
      for (var d = 0; d < 8; d++) {
        var a = (d / 8) * Math.PI * 2;
        el("circle", { cx: f1(Math.cos(a) * 12), cy: f1(Math.sin(a) * 12), r: 1.8, "class": "stamen" }, F.core);
      }
      F.kick = 0; F.kickV = 0; F.lean = 0; F.burst = false; F.openP = 0;

      // Button over the head so the flower can be touched or reached by keyboard
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "bloom-btn";
      btn.style.left = (F.hx / 700 * 100).toFixed(2) + "%";
      btn.style.top = (F.hy / 560 * 100).toFixed(2) + "%";
      btn.setAttribute("aria-label", "Touch the " + F.label + " flower");
      btn.addEventListener("click", function (e) { e.stopPropagation(); touch(F); });
      scene.appendChild(btn);
    });

    // Draw one flower at a given growth stage
    function drawFlower(F, stemP, budP, openP, sway, t) {
      F.stemEl.style.strokeDashoffset = (F.len * (1 - stemP)).toFixed(1);
      F.leafEls.forEach(function (L) {
        var s = clamp((stemP - L.f) / 0.22) * F.size;
        var flutter = reduce.matches ? 0 : Math.sin(t * 2.2 + L.ph) * 5;
        var a = (L.side > 0 ? -32 : -148) + flutter;
        L.g.setAttribute("transform", "translate(" + f1(L.x) + " " + f1(L.y) + ") rotate(" + a.toFixed(1) + ") scale(" + s.toFixed(3) + ")");
      });
      // the head rides a tiny bit with its sway so the stem tip stays hidden
      var hx = F.hx + Math.sin(sway * Math.PI / 180) * 6;
      F.head.setAttribute("transform", "translate(" + f1(hx) + " " + F.hy + ") rotate(" + sway.toFixed(2) + ") scale(" + (budP * F.size).toFixed(3) + ")");
      F.head.style.opacity = budP > 0.01 ? 1 : 0;
      var n = F.n, mid = (n - 1) / 2, breathe = reduce.matches ? 0 : Math.sin(t * 1.6 + F.idx) * 0.03 * openP;
      for (var k = 0; k < n; k++) {
        // closed: a narrow fan pointing up; open: a full ring that breathes
        var closed = (k - mid) * 9, open = (k - mid) * (360 / n);
        F.outer[k].setAttribute("transform", "rotate(" + (closed + (open - closed) * openP).toFixed(2) + ") scale(" + (0.55 + 0.45 * openP + breathe).toFixed(3) + ")");
        var io = open + 180 / n, ic = closed * 0.6;
        F.inner[k].setAttribute("transform", "rotate(" + (ic + (io - ic) * openP).toFixed(2) + ") scale(" + (0.38 + 0.24 * openP - breathe).toFixed(3) + ")");
        F.inner[k].style.opacity = clamp((openP - 0.3) / 0.4).toFixed(2);
      }
      F.core.setAttribute("transform", "scale(" + openP.toFixed(3) + ") rotate(" + (t * 20 % 360).toFixed(1) + ")");
    }

    /* ---------- 3. Particles: sparks, falling petals, shooting stars ---------- */
    var sparks = [], petals = [], STAR = "M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2Z";
    function burst(x, y, count, power) {
      if (reduce.matches) return;
      for (var i = 0; i < count; i++) {
        var a = Math.random() * Math.PI * 2, v = power * (0.4 + Math.random() * 0.8);
        sparks.push({
          node: el("path", { d: STAR, "class": "spark" }, $("sparks")),
          x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, rot: Math.random() * 90, life: 0.9 + Math.random() * 0.9, max: 1.8, s: 0.5 + Math.random() * 0.8
        });
      }
    }
    function dropPetal(F) {
      if (reduce.matches || petals.length > 14) return;
      petals.push({
        node: el("path", { d: PETAL[F.shape], fill: "url(#pg" + F.idx + ")" }, $("petals")),
        x: F.hx + (Math.random() - 0.5) * 30, y: F.hy, vy: 18 + Math.random() * 16, ph: Math.random() * 6.28, rot: Math.random() * 360, vr: (Math.random() - 0.5) * 120
      });
    }
    var shoot = null, nextShoot = performance.now() + 2500;
    function launchShootingStar(now) {
      var x0 = 260 + Math.random() * 420, y0 = 20 + Math.random() * 120;
      var g = el("g", {}, $("shooting"));
      el("line", { x1: -80, y1: 0, x2: 0, y2: 0, stroke: "url(#tail)", "stroke-width": 2, "stroke-linecap": "round" }, g);
      el("circle", { r: 1.8, fill: "#fff" }, g);
      shoot = { g: g, x: x0, y: y0, t0: now };
      nextShoot = now + 6000 + Math.random() * 6000;
    }

    /* ---------- 4. Fireflies (they gather where you tap the sky) ---------- */
    var flies = [];
    for (var f = 0; f < 14; f++) {
      var fg = el("g", {}, $("flies"));
      el("circle", { r: 7, "class": "fly-halo" }, fg);
      el("circle", { r: (1.6 + rnd() * 1.4).toFixed(1), "class": "fly" }, fg);
      flies.push({ g: fg, bx: 40 + rnd() * 620, by: 250 + rnd() * 250, x: 0, y: 0, ph: rnd() * 6.28, sp: 0.3 + rnd() * 0.5 });
    }
    flies.forEach(function (fl) { fl.x = fl.bx; fl.y = fl.by; });
    var gather = null;

    /* ---------- 5. Input ---------- */
    var pointer = { nx: 0, ny: 0, x: 350, on: false }, par = { x: 0, y: 0 }, gust = 0;
    function toSvg(e) {
      var pt = svg.createSVGPoint(), m = svg.getScreenCTM();
      pt.x = e.clientX; pt.y = e.clientY;
      return m ? pt.matrixTransform(m.inverse()) : { x: 350, y: 280 };
    }
    scene.addEventListener("pointermove", function (e) {
      var r = scene.getBoundingClientRect();
      pointer.nx = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.ny = ((e.clientY - r.top) / r.height) * 2 - 1;
      pointer.x = toSvg(e).x;
      pointer.on = true;
    });
    scene.addEventListener("pointerleave", function () { pointer.on = false; pointer.nx = 0; pointer.ny = 0; });
    scene.addEventListener("click", function (e) {
      if (e.target.closest(".bloom-btn")) return;
      var p = toSvg(e);
      burst(p.x, p.y, 16, 110);
      gust = 1;
      if (!reduce.matches) gather = { x: p.x, y: p.y, until: performance.now() + 2600 };
    });

    function touch(F) {
      F.head.classList.add("glowing");
      setTimeout(function () { F.head.classList.remove("glowing"); }, 900);
      if (reduce.matches) return;
      F.kickV += 120; // the head swings, a spring settles it
      burst(F.hx, F.hy, 22, 140);
      for (var p = 0; p < 3; p++) dropPetal(F);
    }

    /* ---------- 6. Timeline: stems rise, leaves unfold, buds open ---------- */
    var note = $("note"), status = $("status"), nameInput = $("name");
    var start = 0, bloomed = false, prev = performance.now();
    var BLOOM_END = 5.6;

    // the note is split into words so they can float in one after another
    function writeNote() {
      var who = nameInput.value.trim() || "you";
      var words = ("Three blooms, all for " + who + ".").split(" ");
      note.innerHTML = "";
      words.forEach(function (w, i) {
        var s = document.createElement("span");
        s.className = "w";
        s.textContent = w;
        s.style.transitionDelay = (i * 0.12).toFixed(2) + "s";
        note.appendChild(s);
        note.appendChild(document.createTextNode(" "));
      });
    }
    function grow() {
      bloomed = false;
      note.classList.remove("show");
      FLOWERS.forEach(function (F) { F.burst = false; });
      start = performance.now() - (reduce.matches ? BLOOM_END * 1000 : 0);
      status.textContent = reduce.matches ? "" : "The flowers are growing…";
    }
    $("grow").addEventListener("click", grow);
    nameInput.addEventListener("input", function () {
      writeNote();
      if (bloomed) { void note.offsetWidth; note.classList.add("show"); }
    });

    function frame(now) {
      var dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      var t = (now - start) / 1000, tt = now / 1000;
      var calm = reduce.matches;

      // parallax: far layers move less than near ones
      var tx = calm ? 0 : -pointer.nx, ty = calm ? 0 : -pointer.ny;
      par.x += (tx - par.x) * Math.min(1, dt * 4);
      par.y += (ty - par.y) * Math.min(1, dt * 4);
      $("layerSky").setAttribute("transform", "translate(" + f1(par.x * 5) + " " + f1(par.y * 3) + ")");
      $("layerFar").setAttribute("transform", "translate(" + f1(par.x * 11) + " " + f1(par.y * 5) + ")");
      $("layerNear").setAttribute("transform", "translate(" + f1(par.x * 18) + " " + f1(par.y * 6) + ")");

      gust = Math.max(0, gust - dt * 0.7);
      clouds.forEach(function (c) {
        if (!calm) { c.x += c.k * 7 * dt; if (c.x > 800) c.x = -110; }
        c.g.setAttribute("transform", "translate(" + f1(c.x) + " " + c.y + ") scale(" + c.k + ")");
      });
      drawGrass(tt, gust);

      FLOWERS.forEach(function (F, i) {
        var s0 = 0.3 + i * 0.7;
        var stemP = easeOut(clamp((t - s0) / 2));
        var budP = easeBack(clamp((t - s0 - 1.7) / 0.6));
        var openP = easeOut(clamp((t - s0 - 2.2) / 1.5));
        if (openP > 0.55 && !F.burst) { F.burst = true; burst(F.hx, F.hy, 26, 150); }
        // touch spring + lean toward the pointer + wind
        F.kickV += (-F.kick * 30 - F.kickV * 4) * dt;
        F.kick += F.kickV * dt;
        var leanTo = pointer.on ? Math.max(-1, Math.min(1, (pointer.x - F.hx) / 260)) * 7 : 0;
        F.lean += (leanTo - F.lean) * Math.min(1, dt * 3);
        if (calm) { F.kick = 0; F.kickV = 0; F.lean = 0; }
        var sway = calm ? 0 : (Math.sin(tt * 0.9 + i * 2) * 3 + gust * Math.sin(tt * 6 + i) * 6) * openP + F.kick * 0.6 + F.lean * openP;
        drawFlower(F, stemP, budP, openP, sway, tt);
        if (openP >= 1 && !calm && Math.random() < dt * 0.25) dropPetal(F);
      });

      if (!bloomed && t >= BLOOM_END) {
        bloomed = true;
        note.classList.add("show");
        status.textContent = "All three flowers are in bloom. Touch one, or tap the sky.";
      }

      // shooting stars now and then
      if (!calm && !shoot && now > nextShoot) launchShootingStar(now);
      if (shoot) {
        var age = (now - shoot.t0) / 900;
        if (age >= 1 || calm) { shoot.g.remove(); shoot = null; }
        else {
          shoot.g.setAttribute("transform", "translate(" + f1(shoot.x - age * 220) + " " + f1(shoot.y + age * 110) + ") rotate(153.4)");
          shoot.g.style.opacity = Math.sin(age * Math.PI).toFixed(2);
        }
      }

      // fireflies wander, or gather and circle where the sky was tapped
      if (gather && now > gather.until) gather = null;
      flies.forEach(function (fl, k) {
        var gx, gy;
        if (gather) { gx = gather.x + Math.cos(tt * 2 + k) * (24 + k * 2); gy = gather.y + Math.sin(tt * 2 + k) * (16 + k); }
        else { gx = fl.bx + Math.sin(tt * fl.sp + fl.ph) * 34; gy = fl.by + Math.cos(tt * fl.sp * 0.8 + fl.ph) * 22; }
        if (calm) { fl.x = fl.bx; fl.y = fl.by; }
        else { var q = Math.min(1, dt * (gather ? 2.4 : 1.2)); fl.x += (gx - fl.x) * q; fl.y += (gy - fl.y) * q; }
        fl.g.setAttribute("transform", "translate(" + f1(fl.x) + " " + f1(fl.y) + ")");
        fl.g.style.opacity = calm ? 0.8 : (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(tt * 2.4 + fl.ph))).toFixed(2);
      });

      for (var p = sparks.length - 1; p >= 0; p--) {
        var S = sparks[p];
        S.life -= dt;
        if (S.life <= 0) { S.node.remove(); sparks.splice(p, 1); continue; }
        S.vx *= 1 - dt * 2.2; S.vy = S.vy * (1 - dt * 2.2) + 30 * dt;
        S.x += S.vx * dt; S.y += S.vy * dt; S.rot += 200 * dt;
        S.node.setAttribute("transform", "translate(" + f1(S.x) + " " + f1(S.y) + ") rotate(" + S.rot.toFixed(0) + ") scale(" + (S.s * (S.life / S.max + 0.2)).toFixed(2) + ")");
        S.node.style.opacity = Math.min(1, S.life * 1.5).toFixed(2);
      }
      for (var q2 = petals.length - 1; q2 >= 0; q2--) {
        var P = petals[q2];
        P.y += P.vy * dt; P.rot += P.vr * dt;
        var px = P.x + Math.sin(tt * 1.4 + P.ph) * 22 + gust * 40;
        if (P.y > 560) { P.node.remove(); petals.splice(q2, 1); continue; }
        // scaleX with a cosine makes the petal look like it tumbles in 3D
        P.node.setAttribute("transform", "translate(" + f1(px) + " " + f1(P.y) + ") rotate(" + P.rot.toFixed(0) + ") scale(" + (0.32 * Math.cos(tt * 3 + P.ph)).toFixed(3) + " 0.32)");
        P.node.style.opacity = Math.min(1, (560 - P.y) / 80).toFixed(2);
      }
      requestAnimationFrame(frame);
    }

    writeNote();
    grow();
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
