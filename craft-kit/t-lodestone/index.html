<!doctype html>
<!-- Chill & Craft · Lodestone · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lodestone · Magnetic call-to-action button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f2eee6;
    --ink: #161a2c;
    --muted: #5d6275;
    --filing: 40, 44, 60;
    --copper: 196, 106, 52;
    --chip: rgba(22, 26, 44, 0.06);
    --north: #e5484d;
    --north-deep: #b8262c;
    --south: #3f6fd9;
    --south-deep: #24479e;
    --core: #161a2c;
    --core-ink: #ffffff;
    --mint: #1fb985;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a0e1c;
    --ink: #eef1ff;
    --muted: #9aa2c4;
    --filing: 170, 180, 215;
    --copper: 236, 150, 86;
    --chip: rgba(238, 241, 255, 0.07);
    --north: #ff5a5f;
    --north-deep: #c9333a;
    --south: #5b8cff;
    --south-deep: #3157c4;
    --core: #eef1ff;
    --core-ink: #0d1124;
    --mint: #2fd39b;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---------- Stage: iron filings on paper (canvas) behind a small pitch ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; overflow: hidden; }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pitch { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; gap: 0; max-width: 520px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 0.76rem; font-weight: 650; letter-spacing: 0.02em; color: var(--muted); backdrop-filter: blur(6px); }
  .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--north); box-shadow: 9px 0 0 var(--south); margin-right: 9px; }
  h1 { margin: 16px 0 8px; font-size: clamp(1.6rem, 4.2vw, 2.4rem); line-height: 1.08; letter-spacing: -0.03em; }
  .sub { margin: 0 0 34px; color: var(--muted); font-size: 0.98rem; line-height: 1.45; max-width: 380px; }
  .meta { margin: 30px 0 0; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { display: inline-block; color: var(--ink); }

  /* ---------- The magnet button ---------- */
  .magnet {
    position: relative;
    display: grid;
    grid-template-columns: 54px auto 54px;
    align-items: stretch;
    height: 66px;
    padding: 0;
    border: 0;
    border-radius: 18px;
    background: none;
    color: var(--core-ink);
    font: inherit;
    cursor: pointer;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 16px 20px rgba(10, 14, 40, 0.25));
  }
  .magnet:focus-visible { outline: 3px solid var(--south); outline-offset: 6px; }
  .pole { display: grid; place-items: center; font-weight: 850; font-size: 1.05rem; color: #fff; will-change: transform; }
  .pole.n { border-radius: 18px 4px 4px 18px; background: linear-gradient(160deg, var(--north), var(--north-deep)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.15); }
  .pole.s { border-radius: 4px 18px 18px 4px; background: linear-gradient(160deg, var(--south), var(--south-deep)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.15); }
  .core { position: relative; display: grid; place-items: center; min-width: 196px; margin: 0 -2px; padding: 0 22px; background: var(--core); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), inset 0 -3px 0 rgba(0, 0, 0, 0.18); overflow: hidden; z-index: 1; border-radius: 3px; transition: background 0.4s; }
  .core::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.28) 48%, transparent 60%); transform: translateX(-120%); }
  .magnet:hover .core::after { animation: sheen 1.1s ease-out; }
  @keyframes sheen { to { transform: translateX(120%); } }
  .magnet.done .core { background: var(--mint); }
  .say { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 9px; font-weight: 750; font-size: 1.02rem; white-space: nowrap; will-change: transform; }
  .say svg { width: 18px; height: 18px; flex: none; }
  .say[hidden] { display: inline-flex; visibility: hidden; } /* all labels share one cell, so the width never jumps */
  .dots i { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: currentColor; animation: hop 0.7s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.12s; }
  .dots i:nth-child(3) { animation-delay: 0.24s; }
  @keyframes hop { 40% { transform: translateY(-5px); } }
  .tick path { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .magnet.done .tick path { animation: draw 0.45s 0.1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ghost pointer used by the auto demo */
  .ghost { position: absolute; left: 0; top: 0; z-index: 3; width: 26px; height: 26px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .ghost.on { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3)); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 420px) {
    .magnet { grid-template-columns: 46px auto 46px; height: 60px; }
    .core { min-width: 172px; padding: 0 16px; }
    .say { font-size: 0.95rem; }
  }
  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .pitch { scale: 1.25; } }
  @media (prefers-reduced-motion: reduce) {
    .dots i, .magnet:hover .core::after { animation: none; }
    .magnet.done .tick path { animation: none; stroke-dashoffset: 0; }
    .ghost { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <section class="pitch">
      <span class="eyebrow" id="eyebrow"><i></i>Invite-only beta</span>
      <h1 id="title">A calmer inbox<br />for your small shop</h1>
      <p class="sub" id="sub">Orders, questions and reviews in one quiet place. Early access opens in small waves.</p>
      <button class="magnet" id="cta" type="button" aria-describedby="meta">
        <span class="pole n" id="pn" aria-hidden="true">N</span>
        <span class="core">
          <span class="say" id="say-idle">Join the waitlist <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
          <span class="say" id="say-busy" hidden>Joining <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
          <span class="say" id="say-done" hidden><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></svg>You're on the list</span>
        </span>
        <span class="pole s" id="ps" aria-hidden="true">S</span>
      </button>
      <p class="meta" id="meta"><b id="count">1,204</b> makers waiting · no spam, ever</p>
    </section>
    <span class="ghost" id="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2l15 10.5-6.6 1.3 3.9 7.2-2.9 1.5-3.8-7.3L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round" /></svg></span>
    <p class="sr" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // Lodestone: a call-to-action button that is a bar magnet over iron filings.
  // Near the pointer it is pulled toward you (body, label and poles at different speeds) and the filings turn.
  // Press = it pulls the filings in (anticipation) → snaps out with a field pulse (main) → the filings circle it like
  // a spinner while it "joins" (progress) → filings burst out, copper sparks fly, the count rolls (finish) → reset.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), cv = $("field"), ctx = cv.getContext("2d");
    var cta = $("cta"), pn = $("pn"), ps = $("ps"), ghost = $("ghost"), status = $("status"), count = $("count");
    var says = { idle: $("say-idle"), busy: $("say-busy"), done: $("say-done") };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var waiting = 1204, state = "idle", run = 0;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // ---------- Layout: a jittered grid of filings that keeps clear of the text ----------
    var Wd = 0, Ht = 0, dpr = 1, filings = [], base = { cx: 0, cy: 0, w: 300 }, clear = [];
    function rel(el, pad) {
      var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
      return { l: r.left - s.left - pad, t: r.top - s.top - pad, r: r.right - s.left + pad, b: r.bottom - s.top + pad };
    }
    function layout() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      Wd = stage.clientWidth; Ht = stage.clientHeight;
      cv.width = Math.round(Wd * dpr); cv.height = Math.round(Ht * dpr);
      var r = cta.getBoundingClientRect(), s = stage.getBoundingClientRect();
      base = { cx: r.left - s.left + r.width / 2 - B.x, cy: r.top - s.top + r.height / 2 - B.y, w: r.width, h: r.height };
      clear = [rel($("title"), 6), rel($("sub"), 4), rel($("eyebrow"), 6), rel($("meta"), 4)];
      var gap = Wd < 520 ? 15 : 17;
      filings = [];
      for (var y = gap / 2, row = 0; y < Ht; y += gap, row++) {
        for (var x = (row % 2 ? gap / 2 : 0) + gap / 4; x < Wd; x += gap) {
          var jx = x + (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1) * 4;
          var jy = y + (Math.sin(x * 39.346 + y * 11.135) * 24634.6345 % 1) * 4;
          var inside = clear.some(function (c) { return jx > c.l && jx < c.r && jy > c.t && jy < c.b; });
          if (Math.abs(jx - base.cx) < base.w / 2 + 6 && Math.abs(jy - base.cy) < base.h / 2 + 6) inside = true;
          if (!inside) filings.push({ x: jx, y: jy, a: 0, dx: 0, dy: 0, vx: 0, vy: 0, n: (jx * 7 + jy * 3) % 6.28 });
        }
      }
    }

    // ---------- Pointer (real or the demo ghost) and button springs ----------
    var P = { x: -999, y: -999, on: false };
    var B = { x: 0, y: 0, vx: 0, vy: 0, lx: 0, ly: 0, lvx: 0, lvy: 0, s: 1, vs: 0, ts: 1 };
    var fx = { charge: 0, pulseAt: -1e9, spin: 0, spinAt: 0, burst: false };
    var sparks = [];

    function frame(now) {
      var dt = 1 / 60, t = now / 1000;
      // magnetic pull toward the pointer: body follows, label and poles lag behind at their own speeds
      var tx = 0, ty = 0;
      if (P.on && !calm.matches) {
        var dx = P.x - base.cx, dy = P.y - base.cy, d = Math.hypot(dx, dy);
        var reach = 230;
        if (d < reach) { var pull = Math.pow(1 - d / reach, 1.4); tx = dx * 0.22 * pull; ty = dy * 0.3 * pull; }
      }
      B.vx += (-150 * (B.x - tx) - 13 * B.vx) * dt; B.x += B.vx * dt;
      B.vy += (-150 * (B.y - ty) - 13 * B.vy) * dt; B.y += B.vy * dt;
      B.lvx += (-90 * (B.lx - tx * 0.45) - 9 * B.lvx) * dt; B.lx += B.lvx * dt;
      B.lvy += (-90 * (B.ly - ty * 0.45) - 9 * B.lvy) * dt; B.ly += B.lvy * dt;
      B.vs += (-260 * (B.s - B.ts) - 14 * B.vs) * dt; B.s += B.vs * dt;
      if (calm.matches) { B.x = B.y = B.lx = B.ly = 0; B.s = 1; }
      cta.style.transform = "translate(" + B.x.toFixed(2) + "px," + B.y.toFixed(2) + "px) scale(" + B.s.toFixed(3) + ")";
      var say = says[state];
      say.style.transform = "translate(" + B.lx.toFixed(2) + "px," + B.ly.toFixed(2) + "px)";
      pn.style.transform = "translate(" + (-B.lx * 0.3).toFixed(2) + "px," + (-B.ly * 0.3).toFixed(2) + "px) rotate(" + (-B.vy * 0.05).toFixed(2) + "deg)";
      ps.style.transform = "translate(" + (-B.lx * 0.3).toFixed(2) + "px," + (-B.ly * 0.3).toFixed(2) + "px) rotate(" + (B.vy * 0.05).toFixed(2) + "deg)";
      drawField(now, t);
      requestAnimationFrame(frame);
    }

    // ---------- The field ----------
    var FIL = getComputedStyle(document.documentElement);
    function drawField(now, t) {
      var cx = base.cx + B.x, cy = base.cy + B.y, half = base.w / 2 - 24;
      var Nx = cx - half, Sx = cx + half;
      var filing = FIL.getPropertyValue("--filing").trim(), copper = FIL.getPropertyValue("--copper").trim();
      var paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
      var pulseR = (now - fx.pulseAt) * 0.95, pulseK = Math.max(0, 1 - (now - fx.pulseAt) / 800);
      var burstK = fx.burst ? 1 : 0;
      fx.burst = false;
      var head = (now - fx.spinAt) / 1000 * 6.2;
      var calmNow = calm.matches;
      for (var i = 0; i < filings.length; i++) {
        var f = filings[i];
        var px = f.x + f.dx, py = f.y + f.dy;
        // field of a bar magnet: out of N, into S (2D, falls off as 1/r)
        var ax = px - Nx, ay = py - cy, a2 = ax * ax + ay * ay + 50;
        var bx = px - Sx, by = py - cy, b2 = bx * bx + by * by + 50;
        var Fx = ax / a2 - bx / b2, Fy = ay / a2 - by / b2;
        if (P.on) { var qx = px - P.x, qy = py - P.y, q2 = qx * qx + qy * qy + 80; Fx += (0.55 * qx) / q2; Fy += (0.55 * qy) / q2; }
        var mag = Math.sqrt(Fx * Fx + Fy * Fy);
        var s = Math.min(1, Math.sqrt(mag * 36)); // square root: the field shows further out
        var ang = Math.atan2(Fy, Fx) + (calmNow ? 0 : Math.sin(t * 1.4 + f.n) * 0.06);
        // distance to the magnet's centre line, for the pulse, spin and burst
        var nx = Math.max(Nx, Math.min(Sx, px)), ddx = px - nx, ddy = py - cy, dc = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        var extra = 0, lift = 0;
        if (pulseK > 0) { var g = Math.exp(-Math.pow((dc - pulseR) / 26, 2)) * pulseK; extra += g * 9; ang += g * 1.1; lift += g * 2.5; }
        if (fx.spin > 0 && dc > 30 && dc < 190) {
          var w = fx.spin * Math.min(1, (190 - dc) / 60);
          var tan = Math.atan2(ddx, -ddy), dd = tan - ang;
          dd -= Math.PI * Math.round(dd / Math.PI);
          ang += dd * w;
          var th = Math.atan2(ddy, ddx * 0.6), gap2 = ((head - th) % 6.283 + 6.283) % 6.283;
          if (gap2 < 1.6) { lift += (1 - gap2 / 1.6) * 3 * fx.spin; extra += (1 - gap2 / 1.6) * 5 * fx.spin; }
        }
        // a little physics for each filing: pulled in while charging, kicked out on the burst
        if (fx.charge > 0 && dc < 260) { var k = fx.charge * (1 - dc / 260); f.vx -= (ddx / dc) * k * 9; f.vy -= (ddy / dc) * k * 9; }
        if (burstK && dc < 300) { var kb = (1 - dc / 300) * 230; f.vx += (ddx / dc) * kb; f.vy += (ddy / dc) * kb; }
        if (f.dx || f.dy || f.vx || f.vy) {
          f.vx += (-120 * f.dx - 9 * f.vx) / 60; f.vy += (-120 * f.dy - 9 * f.vy) / 60;
          f.dx += f.vx / 60; f.dy += f.vy / 60;
          if (Math.abs(f.dx) + Math.abs(f.dy) + Math.abs(f.vx) + Math.abs(f.vy) < 0.02) f.dx = f.dy = f.vx = f.vy = 0;
        }
        // filings turn with a little lag (they have weight)
        var da = ang - f.a;
        da -= Math.PI * Math.round(da / Math.PI);
        f.a += calmNow ? da : da * 0.18;
        var len = 3 + s * 9 + extra;
        var c = Math.cos(f.a) * len * 0.5, sn = Math.sin(f.a) * len * 0.5;
        var b = Math.min(5, Math.floor(s * 4.2 + lift));
        paths[b].moveTo(px - c, py - sn);
        paths[b].lineTo(px + c, py + sn);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, Wd, Ht);
      ctx.lineCap = "round";
      var alpha = [0.16, 0.28, 0.42, 0.58, 0.78, 0.95];
      for (var k2 = 0; k2 < 6; k2++) {
        ctx.strokeStyle = "rgba(" + (k2 >= 4 ? copper : filing) + "," + alpha[k2] + ")";
        ctx.lineWidth = k2 >= 4 ? 1.9 : 1.5;
        ctx.stroke(paths[k2]);
      }
      // copper sparks after a successful join
      for (var j = sparks.length - 1; j >= 0; j--) {
        var p = sparks[j];
        p.vy += 0.18; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.life -= 1 / 55;
        if (p.life <= 0) { sparks.splice(j, 1); continue; }
        ctx.strokeStyle = "rgba(" + copper + "," + p.life.toFixed(2) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke();
      }
    }

    // ---------- Label swaps ----------
    function show(next) {
      var prev = says[state];
      if (prev === says[next]) return;
      state = next;
      var el = says[next];
      prev.hidden = true;
      el.hidden = false;
      if (calm.matches) return;
      el.animate([{ opacity: 0, transform: "translateY(14px) scale(0.9)", filter: "blur(3px)" }, { opacity: 1, transform: "translateY(-2px)", filter: "blur(0)", offset: 0.7 }, { opacity: 1, transform: "none" }], { duration: 380, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" });
    }
    function rollCount() {
      var text = waiting.toLocaleString("en-US");
      if (calm.matches) { count.textContent = text; return; }
      count.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-8px)", opacity: 0 }], { duration: 160, easing: "ease-in" }).finished.then(function () {
        count.textContent = text;
        count.animate([{ transform: "translateY(8px)", opacity: 0 }, { transform: "translateY(-2px)", opacity: 1, offset: 0.7 }, { transform: "none", opacity: 1 }], { duration: 320, easing: "ease-out" });
      }).catch(function () { count.textContent = text; });
    }

    // ---------- Press sequence ----------
    async function join() {
      if (state !== "idle") return;
      var id = ++run;
      cta.setAttribute("aria-busy", "true");
      status.textContent = "Joining the waitlist.";
      if (calm.matches) {
        show("busy"); await wait(700);
        waiting++; rollCount(); show("done"); cta.classList.add("done");
        status.textContent = "You're on the list. " + waiting.toLocaleString("en-US") + " makers waiting.";
        await wait(2600); finish(); return;
      }
      // 1. Anticipation: the magnet shrinks and pulls the filings in
      B.ts = 0.94; fx.charge = 1;
      await wait(190);
      // 2. Snap: it springs out and a pulse runs through the field
      fx.charge = 0; B.ts = 1; B.vs = 2.6; fx.pulseAt = performance.now();
      show("busy");
      await wait(420);
      // 3. Progress: the filings circle the magnet like a spinner
      fx.spinAt = performance.now();
      var t0 = performance.now();
      await new Promise(function (res) {
        (function ramp(now) {
          var k = Math.max(0, now - t0) / 1200;
          fx.spin = k < 0.2 ? k / 0.2 : k > 0.85 ? Math.max(0, (1 - k) / 0.15) : 1;
          if (k < 1) requestAnimationFrame(ramp); else { fx.spin = 0; res(); }
        })(t0);
      });
      // 4. Done: burst, sparks, the count rolls and the core turns mint
      fx.burst = true; B.vs = 3.2;
      cta.classList.add("done");
      show("done");
      waiting++; rollCount();
      status.textContent = "You're on the list. " + waiting.toLocaleString("en-US") + " makers waiting.";
      var cx = base.cx + B.x, cy = base.cy + B.y;
      for (var i = 0; i < 26; i++) {
        var a = (i / 26) * Math.PI * 2, sp = 3 + Math.random() * 4;
        sparks.push({ x: cx + Math.cos(a) * base.w * 0.48, y: cy + Math.sin(a) * base.h * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, life: 1 });
      }
      await wait(2600);
      if (id === run) finish();
    }
    function finish() {
      cta.classList.remove("done");
      cta.removeAttribute("aria-busy");
      show("idle");
    }
    cta.addEventListener("click", join);

    // ---------- Pointer tracking ----------
    function toStage(e) { var s = stage.getBoundingClientRect(); return { x: e.clientX - s.left, y: e.clientY - s.top }; }
    stage.addEventListener("pointermove", function (e) { if (!e.isTrusted) return; var p = toStage(e); P.x = p.x; P.y = p.y; P.on = true; });
    stage.addEventListener("pointerleave", function (e) { if (e.isTrusted) P.on = false; });
    stage.addEventListener("pointerdown", function (e) { if (e.isTrusted && e.pointerType !== "mouse") { var p = toStage(e); P.x = p.x; P.y = p.y; P.on = true; } });
    stage.addEventListener("pointerup", function (e) { if (e.isTrusted && e.pointerType !== "mouse") setTimeout(function () { P.on = false; }, 500); });
    cta.addEventListener("focus", function () { if (cta.matches(":focus-visible")) { P.x = base.cx + 40; P.y = base.cy - 50; P.on = true; } });
    cta.addEventListener("blur", function () { if (!demoOn) P.on = false; });

    var resizeT = 0;
    addEventListener("resize", function () { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); });
    layout();
    requestAnimationFrame(frame);

    // ---------- Auto demo: a ghost pointer drifts in, the magnet follows it, then it presses ----------
    var demoOn = !calm.matches, gx = 0, gy = 0, gRun = 0;
    function stopDemo(e) {
      if (!e.isTrusted || !demoOn) return;
      demoOn = false; gRun++;
      ghost.classList.remove("on");
      if (e.type !== "pointermove") P.on = false;
    }
    ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function glide(x, y, ms, id) {
      return new Promise(function (res) {
        var x0 = gx, y0 = gy, t0 = performance.now();
        (function f(now) {
          if (id !== gRun) { res(false); return; }
          var t = Math.min(1, Math.max(0, now - t0) / ms), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          gx = x0 + (x - x0) * e; gy = y0 + (y - y0) * e;
          ghost.style.transform = "translate(" + gx.toFixed(1) + "px," + gy.toFixed(1) + "px)";
          P.x = gx; P.y = gy; P.on = true;
          if (t < 1) requestAnimationFrame(f); else res(true);
        })(t0);
      });
    }
    async function demo() {
      var id = ++gRun;
      gx = base.cx + Math.min(260, Wd * 0.4); gy = base.cy + 150;
      ghost.style.transform = "translate(" + gx + "px," + gy + "px)";
      ghost.classList.add("on");
      if (!(await glide(base.cx + 70, base.cy + 46, 700, id))) return;
      if (!(await glide(base.cx - 60, base.cy + 30, 600, id))) return;
      if (!(await glide(base.cx + 10, base.cy + 6, 380, id))) return;
      ghost.animate([{ transform: ghost.style.transform + " scale(1)" }, { transform: ghost.style.transform + " scale(0.8)" }, { transform: ghost.style.transform + " scale(1)" }], { duration: 220 });
      join();
      await wait(2600);
      if (id !== gRun) return;
      if (!(await glide(base.cx - Math.min(240, Wd * 0.38), base.cy + 170, 900, id))) return;
      ghost.classList.remove("on"); P.on = false;
      await wait(1900);
      if (id === gRun && demoOn) demo();
    }
    if (demoOn) setTimeout(function () { if (demoOn) demo(); }, 300);
  })();
</script>
