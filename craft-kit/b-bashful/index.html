<!doctype html>
<!-- Chill and Craft · Bashful · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bashful · Shy contact button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #efe8ff;
    --spot: #fff6d6;
    --ink: #1c1530;
    --muted: #6c6385;
    --btn: #ffcc33;
    --edge: #1c1530;
    --blush: #ff7aa8;
    --panel: #ffffff;
    --field: #f5f1ff;
    --accent: #6b4dff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #18111f;
    --spot: #2e2140;
    --ink: #f6f0ff;
    --muted: #b1a6c8;
    --btn: #ffcc33;
    --edge: #0b0710;
    --blush: #ff6f9f;
    --panel: #241a31;
    --field: #30243f;
    --accent: #b6a3ff;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(50% 50% at 50% 45%, var(--spot), transparent 75%), var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; }
  .column { position: relative; display: grid; justify-items: center; gap: 16px; width: min(380px, 100%); }
  .hint { margin: 0; font-size: 0.88rem; color: var(--muted); text-align: center; min-height: 1.3em; }

  /* ---------- The shy button ---------- */
  .scene { perspective: 600px; padding: 10px; }
  .shy {
    --rx: 0deg; --ry: 0deg; --tx: 0px; --ty: 0px; --sx: 1; --sy: 1; --rz: 0deg; --hop: 0px;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px 14px 14px;
    border: 3px solid var(--edge);
    border-radius: 20px;
    background: var(--btn);
    color: #1c1530;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: calc(6px - var(--tx) * 0.4) calc(7px - var(--ty) * 0.4 - var(--hop) * 0.6) 0 var(--edge);
    transform: translate(var(--tx), calc(var(--ty) + var(--hop))) rotateX(var(--rx)) rotateY(var(--ry)) rotate(var(--rz)) scale(var(--sx), var(--sy));
    transform-style: preserve-3d;
    transform-origin: 50% 100%;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
  }
  .shy:focus-visible { outline: 3px dashed var(--accent); outline-offset: 7px; }

  /* Cartoon face: eyes follow the cursor, cheeks blush, a mouth smiles when open */
  .face { position: relative; width: 46px; height: 32px; flex: none; }
  .eye { position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2.5px solid var(--edge); overflow: hidden; transition: transform 0.1s ease; }
  .eye.l { left: 2px; }
  .eye.r { right: 2px; }
  .pupil { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--edge); transform: translate(var(--px, 0px), var(--py, 0px)); }
  .blush { position: absolute; bottom: 1px; width: 12px; height: 6px; border-radius: 50%; background: var(--blush); opacity: var(--shy, 0); }
  .blush.l { left: -1px; }
  .blush.r { right: -1px; }
  .mouth { position: absolute; left: 50%; bottom: -2px; width: 14px; height: 8px; margin-left: -7px; overflow: visible; }
  .mouth path { fill: none; stroke: var(--edge); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset 0.35s ease 0.1s; }
  .shy.happy .mouth path { stroke-dashoffset: 0; }
  .shy.blink .eye, .shy.squeeze .eye { transform: scaleY(0.12); }
  .sweat { position: absolute; right: -8px; top: -6px; width: 7px; height: 10px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7cc8ff; border: 1.5px solid var(--edge); opacity: 0; transform: translateY(-4px) scale(0.4); transition: opacity 0.2s, transform 0.35s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .shy.nervous .sweat { opacity: 1; transform: none; animation: drip 1.2s ease-in 0.4s infinite; }
  @keyframes drip { 0% { transform: none; } 70% { transform: translateY(6px); opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }

  /* ---------- Contact panel ---------- */
  .panel { width: 100%; background: var(--panel); border: 3px solid var(--edge); border-radius: 22px; padding: 16px 16px 14px; box-shadow: 6px 7px 0 var(--edge); transform-origin: 50% 0; }
  .panel header { display: flex; align-items: center; justify-content: space-between; }
  .panel h2 { margin: 0; font-size: 1.05rem; }
  .panel p { margin: 6px 0 12px; font-size: 0.88rem; color: var(--muted); }
  .x { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--field); color: var(--ink); font-size: 1.2rem; line-height: 1; cursor: pointer; transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .x:hover { transform: rotate(90deg); }
  .mailrow { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--field); }
  .mailrow code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.86rem; }
  .pill { position: relative; border: 0; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .pill:hover { transform: translateY(-2px); }
  .pill:active { transform: scale(0.94); transition-duration: 0.08s; }
  :root[data-theme="dark"] .pill { color: #1c1530; }
  .pill.ghost { width: 100%; margin-top: 10px; padding: 12px; background: transparent; color: var(--ink); border: 2px solid var(--edge); }
  :root[data-theme="dark"] .pill.ghost { border-color: var(--accent); }
  .pill.ghost.ok { background: color-mix(in srgb, #2fbf71 20%, transparent); border-color: #2fbf71; }
  .x:focus-visible, .pill:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pstatus { margin: 10px 0 0 !important; min-height: 1.2em; font-weight: 600; color: var(--ink) !important; }
  .dots i { display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 50%; background: currentColor; animation: hopdot 0.8s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.12s; }
  .dots i:nth-child(3) { animation-delay: 0.24s; }
  @keyframes hopdot { 50% { transform: translateY(-4px); } }

  .bit { position: absolute; left: 0; top: 0; width: 10px; height: 9px; pointer-events: none; z-index: 9; }
  .bit.heart { clip-path: polygon(50% 100%, 6% 52%, 0 26%, 12% 6%, 32% 2%, 50% 18%, 68% 2%, 88% 6%, 100% 26%, 94% 52%); }
  .bit.square { width: 7px; height: 7px; border-radius: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .eye, .mouth path, .sweat, .x, .pill { transition: none; }
    .shy.nervous .sweat, .dots i { animation: none; }
    .bit { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="column">
      <div class="scene">
        <button class="shy" id="shy" type="button" aria-expanded="false" aria-controls="panel">
          <span class="face" aria-hidden="true">
            <span class="eye l"><span class="pupil"></span></span>
            <span class="eye r"><span class="pupil"></span></span>
            <span class="blush l"></span><span class="blush r"></span>
            <svg class="mouth" viewBox="0 0 14 8"><path d="M2 2 Q7 8 12 2" /></svg>
            <span class="sweat"></span>
          </span>
          Get in touch
        </button>
      </div>
      <p class="hint" id="hint">Move closer… it is a little shy.</p>

      <section class="panel" id="panel" hidden aria-labelledby="panel-title">
        <header>
          <h2 id="panel-title">Say hello to Noor Studio</h2>
          <button class="x" id="close" type="button" aria-label="Close">&times;</button>
        </header>
        <p>We reply within a day. Pick whatever suits you.</p>
        <div class="mailrow">
          <code id="email">hello@noorstudio.example</code>
          <button class="pill" id="copy" type="button">Copy</button>
        </div>
        <button class="pill ghost" id="call" type="button">Book a 15-minute call</button>
        <p class="pstatus" id="pstatus" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>

<script>
  // Bashful: a spring-driven button that leans away from the cursor, blinks, sweats when crowded,
  // squeezes and hops when poked, then unfolds a contact card.
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), btn = $("shy"), hint = $("hint"), panel = $("panel"), closeBtn = $("close");
    var copyBtn = $("copy"), callBtn = $("call"), email = $("email"), pstatus = $("pstatus");
    var pupils = btn.querySelectorAll(".pupil");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var IDLE_HINT = "Move closer… it is a little shy.";

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Spring helper for one-off animations
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping, delay) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear", delay: delay || 0, fill: "backwards" });
    }

    // Particles (hearts or squares) from (x, y) on the stage
    function burst(x, y, kind, colors, n, power) {
      for (var i = 0; i < n; i++) {
        var p = document.createElement("i");
        p.className = "bit " + kind;
        p.style.background = colors[i % colors.length];
        stage.appendChild(p);
        var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
        var s = power * (0.5 + Math.random() * 0.7), vx = Math.cos(a) * s, vy = Math.sin(a) * s, spin = (Math.random() - 0.5) * 400, frames = [];
        for (var k = 0; k <= 10; k++) {
          var t = k / 10, e = 1 - Math.pow(1 - t, 2);
          frames.push({ transform: "translate(" + (x + vx * e).toFixed(1) + "px," + (y + vy * e + 80 * t * t).toFixed(1) + "px) rotate(" + (spin * t).toFixed(0) + "deg) scale(" + (kind === "heart" ? 0.6 + Math.sin(t * Math.PI) * 0.8 : 1 - t * 0.5).toFixed(2) + ")", opacity: t > 0.7 ? (1 - t) / 0.3 : 1 });
        }
        p.animate(frames, { duration: 750 + Math.random() * 400, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
    }
    function centreOf(el) {
      var s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
      return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
    }

    /* ---------- Live springs for the lean ---------- */
    var spring = {};
    ["tx", "ty", "rx", "ry", "rz", "s", "hop"].forEach(function (k) { spring[k] = { x: k === "s" ? 1 : 0, v: 0, t: k === "s" ? 1 : 0 }; });
    var running = false;
    function step() {
      var moving = false;
      Object.keys(spring).forEach(function (k) {
        var p = spring[k];
        var bouncy = k === "s" || k === "rz" || k === "hop";
        p.v = (p.v + (p.t - p.x) * (bouncy ? 0.2 : 0.12)) * (bouncy ? 0.76 : 0.8);
        p.x += p.v;
        if (Math.abs(p.v) > 0.0005 || Math.abs(p.t - p.x) > 0.0005) moving = true;
      });
      var st = btn.style;
      st.setProperty("--tx", spring.tx.x.toFixed(2) + "px");
      st.setProperty("--ty", spring.ty.x.toFixed(2) + "px");
      st.setProperty("--rx", spring.rx.x.toFixed(2) + "deg");
      st.setProperty("--ry", spring.ry.x.toFixed(2) + "deg");
      st.setProperty("--rz", spring.rz.x.toFixed(2) + "deg");
      st.setProperty("--hop", spring.hop.x.toFixed(2) + "px");
      st.setProperty("--sy", spring.s.x.toFixed(3));
      st.setProperty("--sx", (2 - spring.s.x).toFixed(3)); // squash and stretch keep the volume
      if (moving) requestAnimationFrame(step);
      else running = false;
    }
    function kick() { if (!running) { running = true; requestAnimationFrame(step); } }

    // Lean away from the pointer; closer means more lean, more blush, and a sweat drop
    function onMove(e) {
      var r = btn.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height / 2);
      var dist = Math.max(1, Math.hypot(dx, dy));
      var near = Math.max(0, Math.min(1, 1 - (dist - 40) / 240));
      var lean = calm.matches || !panel.hidden ? near * 0.3 : near;
      spring.tx.t = (-dx / dist) * 16 * lean;
      spring.ty.t = (-dy / dist) * 10 * lean;
      spring.ry.t = (dx / dist) * 26 * lean;
      spring.rx.t = (-dy / dist) * 22 * lean;
      btn.style.setProperty("--shy", Math.max(near, panel.hidden ? 0 : 0.6).toFixed(2));
      var px = ((dx / dist) * 3).toFixed(1) + "px", py = ((dy / dist) * 3).toFixed(1) + "px";
      pupils.forEach(function (p) { p.style.setProperty("--px", px); p.style.setProperty("--py", py); });
      btn.classList.toggle("nervous", panel.hidden && near > 0.75 && !calm.matches);
      if (panel.hidden) hint.textContent = near > 0.75 ? "Eek, too close!" : near > 0.3 ? "Oh… hello there." : IDLE_HINT;
      kick();
    }
    function relax() {
      spring.tx.t = spring.ty.t = spring.rx.t = spring.ry.t = 0;
      btn.style.setProperty("--shy", panel.hidden ? "0" : "0.6");
      btn.classList.remove("nervous");
      kick();
    }
    document.addEventListener("pointermove", onMove);
    document.documentElement.addEventListener("mouseleave", relax);
    window.addEventListener("blur", relax);

    // Idle blinking at random moments
    (function blinkLater() {
      setTimeout(function () {
        btn.classList.add("blink");
        setTimeout(function () { btn.classList.remove("blink"); blinkLater(); }, 130);
      }, 2200 + Math.random() * 2600);
    })();

    /* ---------- Poke: anticipation squeeze, then a hop ---------- */
    function squeeze() {
      btn.classList.add("squeeze");
      if (calm.matches) return;
      spring.s.t = 0.82; // hold the squash while pressed
      kick();
    }
    function release(hop) {
      btn.classList.remove("squeeze");
      spring.s.t = 1;
      if (!calm.matches) {
        spring.s.v += 0.12;
        if (hop) { spring.hop.v -= 9; spring.rz.v += (Math.random() < 0.5 ? -1 : 1) * 3; }
      }
      kick();
    }
    btn.addEventListener("pointerdown", squeeze);
    btn.addEventListener("pointerup", function () { release(true); });
    btn.addEventListener("pointercancel", function () { release(false); });
    btn.addEventListener("pointerleave", function () { if (btn.classList.contains("squeeze")) release(false); });
    btn.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !e.repeat) squeeze(); });
    btn.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") release(true); });

    /* ---------- Panel open / close ---------- */
    async function openPanel() {
      panel.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.classList.add("happy");
      btn.classList.remove("nervous");
      btn.style.setProperty("--shy", "0.6");
      hint.textContent = "Okay, okay. Here is how to reach us.";
      pstatus.textContent = "";
      if (!calm.matches) {
        springTo(panel, function (p) { return { transform: "translateY(" + ((1 - p) * -20).toFixed(1) + "px) scaleY(" + Math.max(0.05, p).toFixed(3) + ") scaleX(" + (0.85 + 0.15 * p).toFixed(3) + ")", opacity: Math.min(1, p * 2) }; }, 240, 15);
        Array.prototype.forEach.call(panel.children, function (el, i) {
          springTo(el, function (p) { return { transform: "translateY(" + ((1 - p) * 12).toFixed(1) + "px)", opacity: Math.min(1, p * 1.5) }; }, 260, 16, 120 + i * 60);
        });
      }
      copyBtn.focus();
    }
    async function closePanel() {
      btn.setAttribute("aria-expanded", "false");
      btn.classList.remove("happy");
      hint.textContent = IDLE_HINT;
      if (!calm.matches) {
        await panel.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-14px) scaleY(0.2) scaleX(0.9)", opacity: 0 }], { duration: 240, easing: "cubic-bezier(0.5, 0, 0.8, 0.4)" }).finished;
      }
      panel.hidden = true;
      btn.style.setProperty("--shy", "0");
      btn.focus();
    }

    btn.addEventListener("click", function () {
      if (panel.hidden) setTimeout(openPanel, calm.matches ? 0 : 200);
      else closePanel();
    });
    closeBtn.addEventListener("click", closePanel);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !panel.hidden) closePanel(); });

    /* ---------- Copy email: progress pulse, then hearts ---------- */
    function selectEmail() {
      var range = document.createRange();
      range.selectNodeContents(email);
      var sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    copyBtn.addEventListener("click", function () {
      var text = email.textContent;
      function done() {
        copyBtn.textContent = "Copied";
        pstatus.textContent = "Email address copied.";
        if (!calm.matches) {
          springTo(copyBtn, function (p) { return { transform: "scale(" + (1 + Math.sin(p * Math.PI) * 0.18).toFixed(3) + ")" }; }, 240, 10);
          var c = centreOf(copyBtn);
          burst(c.x, c.y, "heart", ["#ff7aa8", "#ffcc33", "#6b4dff"], 12, 70);
          spring.hop.v -= 6;
          kick();
        }
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1600);
      }
      function fallback() {
        selectEmail();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch { ok = false; }
        if (ok) done();
        else pstatus.textContent = "Selected. Press Ctrl + C to copy.";
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });

    /* ---------- Book a call: hopping dots, then a tick and confetti ---------- */
    callBtn.addEventListener("click", async function () {
      if (callBtn.hasAttribute("aria-disabled")) return;
      callBtn.setAttribute("aria-disabled", "true");
      callBtn.innerHTML = 'Sending request<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
      pstatus.textContent = "Sending your request…";
      await wait(1100);
      callBtn.textContent = "Request sent ✓";
      callBtn.classList.add("ok");
      pstatus.textContent = "Request sent. We will email you a time slot.";
      if (!calm.matches) {
        springTo(callBtn, function (p) { return { transform: "scale(" + (1 + Math.sin(p * Math.PI) * 0.06).toFixed(3) + ")" }; }, 220, 10);
        var c = centreOf(callBtn);
        burst(c.x, c.y, "square", ["#ffcc33", "#6b4dff", "#ff7aa8", "#2fbf71"], 20, 90);
      }
      await wait(3000);
      callBtn.textContent = "Book a 15-minute call";
      callBtn.classList.remove("ok");
      callBtn.removeAttribute("aria-disabled");
    });
  })();
</script>
</body>
</html>
