<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honey Pour · quantity stepper with a filling jar</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: warm cream and honey (light), espresso and amber glow (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #fbefd6;
    --bg2: #fff8ea;
    --card: #fffdf8;
    --ink: #3a2410;
    --muted: #8a6a4a;
    --line: #f0e1c4;
    --soft: #fbf1de;
    --honey: #f2a516;
    --honey2: #ffcf4a;
    --deep: #b45f00;
    --wood: #c98a4e;
    --ok: #3f9a3a;
    --bad: #d9482f;
    --glass: rgba(255, 255, 255, .45);
    --shadow: rgba(120, 70, 10, .3);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #150d06;
    --bg2: #22160b;
    --card: #1d140b;
    --ink: #fbead2;
    --muted: #c0a07e;
    --line: #3a2a19;
    --soft: #281b0f;
    --honey: #ffb52e;
    --honey2: #ffd968;
    --deep: #d27300;
    --wood: #8a5a2c;
    --ok: #7fd46a;
    --bad: #ff7a5c;
    --glass: rgba(255, 240, 210, .1);
    --shadow: rgba(0, 0, 0, .7);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); padding: 18px 14px;
    overflow: hidden; overflow-x: clip;
    background:
      radial-gradient(50% 40% at 50% 30%, color-mix(in srgb, var(--honey2) 30%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg2), var(--bg));
  }
  .card {
    position: relative; width: min(100%, 410px); border-radius: 30px; overflow: hidden; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 40px 80px -46px var(--shadow), 0 12px 26px -18px var(--shadow);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.97); } }
  @media (min-width: 800px) { .card { width: 760px; display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } }

  /* ---------- The jar scene ---------- */
  .scene {
    position: relative; height: 272px;
    background:
      radial-gradient(60% 60% at 50% 45%, color-mix(in srgb, var(--honey2) 28%, transparent), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--honey2) 12%, var(--card)), var(--soft));
  }
  @media (min-width: 800px) { .scene { height: auto; min-height: 380px; } }
  .scene::after { /* the wooden shelf */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--wood) 85%, #fff), var(--wood)); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .25);
  }
  .scene > svg { position: absolute; left: 50%; bottom: 14px; width: min(100%, 262px); height: auto; transform: translateX(-50%); overflow: visible; z-index: 1; }
  @media (min-width: 800px) { .scene > svg { width: 340px; bottom: 16px; } .body { justify-content: center; } }
  .jar { transform-box: view-box; transform-origin: 130px 232px; transition: transform .6s cubic-bezier(.34, 1.56, .64, 1); }
  .jar.tilt { animation: tilt .7s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes tilt { 30% { transform: rotate(-4deg); } 60% { transform: rotate(2deg); } }
  .jar.nope { animation: nope .45s ease; }
  @keyframes nope { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .jar.pack { animation: pack 1.1s cubic-bezier(.5, -0.3, .4, 1.2) forwards; }
  @keyframes pack { 0% { transform: none; } 25% { transform: scale(1.06, .92); } 55% { transform: translate(60px, -150px) scale(.25) rotate(18deg); opacity: 1; } 70% { opacity: 0; transform: translate(70px, -170px) scale(.12); } 71% { transform: translate(0, 40px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .lidTwist { transform-box: fill-box; transform-origin: center; }
  .lidTwist.twist { animation: twist .6s ease; }
  @keyframes twist { 25% { transform: scaleX(.94); } 50% { transform: scaleX(1.03); } 75% { transform: scaleX(.97); } }
  .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .09s linear infinite alternate; }
  @keyframes flap { to { transform: scaleY(.35); } }
  .grad text { font: 700 9px var(--ff); fill: var(--muted); }
  .grad line { stroke: color-mix(in srgb, var(--deep) 50%, transparent); stroke-width: 1.4; }
  [data-theme="dark"] .grad line { stroke: rgba(255, 255, 255, .7); }
  .weightTag { font: 800 15px var(--ff); fill: #5a3300; text-anchor: middle; }
  .labelName { font: 700 6.6px var(--ff); letter-spacing: .12em; fill: #9c5a00; text-anchor: middle; }
  .fullBadge {
    position: absolute; z-index: 2; left: 14px; top: 14px; padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; color: #4a2900;
    background: linear-gradient(180deg, var(--honey2), var(--honey)); transform: scale(0) rotate(-12deg); transition: transform .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  .fullBadge.on { transform: scale(1) rotate(-6deg); }
  .cart {
    position: absolute; z-index: 2; right: 14px; top: 14px; display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--card) 85%, transparent); border: 1px solid var(--line); font-size: 11.5px; font-weight: 700; backdrop-filter: blur(6px);
  }
  .cart svg { width: 18px; height: 18px; }
  .cart b { display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--deep); color: #fff; font-size: 11px; }
  .cart.bump { animation: bump .6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes bump { 35% { transform: scale(1.22) rotate(-6deg); } }
  .hex { position: absolute; z-index: 3; width: 10px; height: 11px; background: var(--c); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); pointer-events: none; animation: hex 1.2s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes hex { from { transform: translate(0, 0) rotate(0) scale(.5); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(260deg) scale(1.1); opacity: 0; } }

  /* ---------- Details ---------- */
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; }
  .kicker { margin: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--deep); }
  h1 { margin: 3px 0 2px; font-size: clamp(19px, 5.2vw, 22px); letter-spacing: -.02em; }
  .sub { margin: 0; font-size: 12.5px; color: var(--muted); }
  .sub b { color: var(--ink); }
  .qtyrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; margin: 14px 0 8px; }
  .step {
    width: 50px; height: 50px; border-radius: 16px; border: 0; cursor: pointer; display: grid; place-items: center;
    background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s;
  }
  .step.plus { background: linear-gradient(180deg, var(--honey2), var(--honey)); color: #4a2900; box-shadow: 0 10px 18px -10px var(--deep); }
  .step:hover { transform: translateY(-2px); }
  .step:active { transform: scale(.9); }
  .step svg { width: 20px; height: 20px; }
  .qty { position: relative; height: 50px; border-radius: 16px; background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; transition: box-shadow .2s; }
  .qty:focus-within { box-shadow: inset 0 0 0 2px var(--honey), 0 0 0 4px color-mix(in srgb, var(--honey) 22%, transparent); }
  .qty input { width: 4.2ch; border: 0; background: transparent; color: var(--ink); font: 800 22px/1 var(--ff); text-align: right; outline: none; font-variant-numeric: tabular-nums; padding: 0; }
  .qty span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button {
    padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 12px/1 var(--ff); cursor: pointer;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), border-color .2s, background .2s;
  }
  .chips button:hover { transform: translateY(-2px); border-color: var(--honey); }
  .chips button[aria-pressed="true"] { background: color-mix(in srgb, var(--honey) 18%, var(--card)); border-color: var(--honey); }
  .free { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .free .bar { position: relative; height: 10px; margin-top: 6px; border-radius: 5px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .free .fill {
    position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); transition: transform .7s cubic-bezier(.34, 1.3, .64, 1);
    background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .25) 0 6px, transparent 6px 12px), linear-gradient(90deg, var(--honey2), var(--honey));
    background-size: 17px 17px, 100% 100%; animation: drift 1.2s linear infinite;
  }
  @keyframes drift { to { background-position: 17px 0, 0 0; } }
  .free.got { color: var(--ok); font-weight: 700; }
  .sum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 14px; }
  .sum small { display: block; font-size: 11px; color: var(--muted); }
  .sum strong { display: block; font-size: 21px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .add {
    position: relative; height: 50px; padding: 0 18px; border: 0; border-radius: 16px; cursor: pointer; color: #fff6e6; font: 800 14px/1 var(--ff);
    background: linear-gradient(180deg, #5a3514, #3a2410); box-shadow: 0 14px 22px -14px rgba(60, 30, 0, .9);
    display: inline-flex; align-items: center; gap: 8px; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .3s;
  }
  [data-theme="dark"] .add { background: linear-gradient(180deg, var(--honey2), var(--honey)); color: #3a2000; }
  .add:hover { transform: translateY(-2px); }
  .add:active { transform: scale(.96); }
  .add svg { width: 18px; height: 18px; }
  .add.busy { pointer-events: none; }
  .add.busy .lbl::after { content: ""; display: inline-block; width: 1.1em; text-align: left; animation: dots 1s steps(4) infinite; content: "..."; clip-path: inset(0 100% 0 0); }
  @keyframes dots { to { clip-path: inset(0 0 0 0); } }
  .add.done { background: linear-gradient(180deg, #4cb045, #2f8a2b); color: #fff; }
  .msg { margin: 10px 0 0; min-height: 17px; font-size: 12px; color: var(--muted); }
  .msg.bad { color: var(--bad); font-weight: 700; }

  button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 370px) { .body { padding: 14px; } .step { width: 44px; height: 46px; } .add { padding: 0 12px; } .sum strong { font-size: 18px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <div class="scene" aria-hidden="true">
      <span class="fullBadge" id="fullBadge">Family jar · lid on</span>
      <span class="cart" id="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg><b id="cartN">0</b></span>
      <svg viewBox="0 0 260 250" id="svg">
        <defs>
          <linearGradient id="honeyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd34f"/><stop offset=".35" stop-color="#f5a41a"/><stop offset="1" stop-color="#b85a00"/></linearGradient>
          <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".18" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
          <linearGradient id="lidG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e0a22c"/><stop offset="1" stop-color="#a86a12"/></linearGradient>
          <linearGradient id="woodG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9753a"/><stop offset=".5" stop-color="#e6a868"/><stop offset="1" stop-color="#9c5d28"/></linearGradient>
          <clipPath id="inside"><path d="M96 70 H164 V84 Q164 93 177 98 Q207 108 207 138 V205 Q207 227 185 227 H75 Q53 227 53 205 V138 Q53 108 83 98 Q96 93 96 84 Z"/></clipPath>
        </defs>
        <ellipse cx="130" cy="236" rx="92" ry="8" fill="var(--shadow)" opacity=".5"/>
        <g class="jar" id="jar">
          <!-- glass back -->
          <path d="M92 66 H168 V82 Q168 90 180 94 Q212 104 212 136 V206 Q212 232 186 232 H74 Q48 232 48 206 V136 Q48 104 80 94 Q92 90 92 82 Z" fill="var(--glass)"/>
          <!-- honey with a living surface -->
          <g clip-path="url(#inside)">
            <path id="honey" fill="url(#honeyG)"/>
            <path id="sheen" fill="none" stroke="#fff3b0" stroke-width="2" opacity=".6"/>
            <g id="bubbles" fill="none" stroke="rgba(255,240,190,.75)" stroke-width="1.2"></g>
          </g>
          <!-- the pour -->
          <path id="stream" fill="none" stroke="url(#honeyG)" stroke-linecap="round" stroke-width="0"/>
          <!-- glass front -->
          <path d="M92 66 H168 V82 Q168 90 180 94 Q212 104 212 136 V206 Q212 232 186 232 H74 Q48 232 48 206 V136 Q48 104 80 94 Q92 90 92 82 Z" fill="url(#glassG)" stroke="rgba(255,255,255,.9)" stroke-width="2.5"/>
          <path d="M64 130 Q62 112 80 104" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
          <path d="M60 150 V196" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
          <rect x="88" y="62" width="84" height="8" rx="3" fill="rgba(255,255,255,.55)"/>
          <g class="grad" id="grad"></g>
          <!-- paper label -->
          <rect x="90" y="172" width="80" height="40" rx="7" fill="#fff6e0" stroke="#e8c68a"/><path d="M98 190 H162" stroke="#e8c68a" stroke-width=".8"/>
          <text class="labelName" x="130" y="186">SIDR · KARAK</text>
          <text class="weightTag" id="labelW" x="130" y="205">500 g</text>
        </g>
        <!-- lid: floats beside the jar while you pour, seats itself when the jar is full -->
        <g id="lid"><g class="lidTwist" id="lidTwist">
          <!-- a ribbed screw cap: a domed top and grip ridges -->
          <path d="M86 52 Q86 44 96 43 H164 Q174 44 174 52 Z" fill="#f6c95a"/>
          <rect x="84" y="50" width="92" height="16" rx="4" fill="url(#lidG)"/>
          <path id="ribs" stroke="rgba(110,60,0,.35)" stroke-width="1.4"/>
          <rect x="84" y="50" width="92" height="3" rx="1.5" fill="#fff2c2" opacity=".7"/>
          <ellipse cx="112" cy="46" rx="12" ry="1.6" fill="#fff" opacity=".55"/>
        </g></g>
        <!-- honey dipper -->
        <g id="dipper">
          <line x1="250" y1="-26" x2="196" y2="22" stroke="url(#woodG)" stroke-width="6" stroke-linecap="round"/>
          <g fill="#d08a40" stroke="#9c5d28" stroke-width="1">
            <ellipse cx="192" cy="26" rx="9" ry="5" transform="rotate(-42 192 26)"/>
            <ellipse cx="186" cy="31" rx="11" ry="6" transform="rotate(-42 186 31)"/>
            <ellipse cx="180" cy="37" rx="9" ry="5" transform="rotate(-42 180 37)"/>
          </g>
          <ellipse cx="184" cy="34" rx="11" ry="7" fill="#f5a41a" opacity=".85" transform="rotate(-42 184 34)"/>
          <path id="drip" fill="#f5a41a"/>
        </g>
        <!-- a bee doing laps -->
        <g id="bee">
          <ellipse class="wing" cx="-2" cy="-6" rx="5" ry="6" fill="rgba(255,255,255,.85)" stroke="rgba(120,90,40,.4)" stroke-width=".6"/>
          <ellipse class="wing" cx="4" cy="-6" rx="4" ry="5" fill="rgba(255,255,255,.7)" stroke="rgba(120,90,40,.4)" stroke-width=".6"/>
          <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#ffc53a"/>
          <path d="M-3 -5 V5 M2 -5.3 V5.3" stroke="#2a1a05" stroke-width="2.2"/>
          <circle cx="7.5" cy="-.5" r="3" fill="#2a1a05"/>
          <path d="M-8 0 l-3 1" stroke="#2a1a05" stroke-width="1.4"/>
        </g>
      </svg>
    </div>

    <div class="body">
      <p class="kicker">Raw · single flower · harvest 2026</p>
      <h1 id="title">Sidr honey from Karak</h1>
      <p class="sub"><b>PKR 6,400</b> a kg · jars from 250 g to 3 kg</p>

      <div class="qtyrow" role="group" aria-label="Jar size">
        <button class="step" id="minus" type="button" aria-label="250 grams less"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <label class="qty"><span class="sr">Jar size in kilograms</span><input id="qty" inputmode="decimal" autocomplete="off" value="0.5" aria-describedby="msg"><span aria-hidden="true">kg</span></label>
        <button class="step plus" id="plus" type="button" aria-label="250 grams more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="chips" id="chips" aria-label="Quick sizes">
        <button type="button" data-q="2" aria-pressed="true">500 g</button>
        <button type="button" data-q="4" aria-pressed="false">1 kg</button>
        <button type="button" data-q="8" aria-pressed="false">2 kg</button>
        <button type="button" data-q="12" aria-pressed="false">3 kg family</button>
      </div>

      <div class="free" id="free"><span id="freeText">Free delivery from PKR 10,000</span><div class="bar" aria-hidden="true"><div class="fill" id="freeFill"></div></div></div>

      <div class="sum">
        <div><small id="calc">500 g × 6,400 + 250 delivery</small><strong id="total">PKR 3,450</strong></div>
        <button class="add" id="add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg><span class="lbl" id="addText">Add to cart</span></button>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite">500 g jar ready to pour</p>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var NS = "http://www.w3.org/2000/svg";
  var PER_KG = 6400, DELIVERY = 250, FREE_FROM = 10000, MAXQ = 12; // q counts quarter kilos: 1 = 250 g, 12 = 3 kg

  // ---------- Formatting ----------
  function kg(q) { return q * .25; }
  function weightText(q) { return q < 4 ? q * 250 + " g" : String(kg(q)).replace(/\.?0+$/, "") + " kg"; }
  function pkr(v) { return "PKR " + Math.round(v).toLocaleString("en-US"); }

  // ---------- Jar geometry: bottom of the honey at y 227, a full 3 kg jar reaches y 96 ----------
  var BOTTOM = 227, TOP = 96, X0 = 50, X1 = 210;
  function levelFor(q) { return BOTTOM - (q / MAXQ) * (BOTTOM - TOP); }
  // graduation marks every half kilo
  (function () {
    var g = "";
    for (var q = 2; q <= MAXQ; q += 2) {
      var y = +levelFor(q).toFixed(1), x = y < 136 ? 180 + (y - 96) / 40 * 27 : 207; // the right edge of the glass at that height
      g += '<line x1="' + (x - 7) + '" y1="' + y + '" x2="' + x + '" y2="' + y + '"/>' + (q % 4 === 0 ? '<text x="' + (x + 12) + '" y="' + (+y + 3) + '">' + kg(q) + " kg</text>" : "");
    }
    $("#grad").innerHTML = g;
    var rib = ""; for (var rx = 89; rx < 174; rx += 4.5) rib += "M" + rx + " 54 V64 ";
    $("#ribs").setAttribute("d", rib);
  })();

  // ---------- Simulation: level spring, viscous surface springs, bubbles, stream, lid, bee ----------
  var N = 18, hs = new Float32Array(N), vs = new Float32Array(N);
  var q = 2, level = { y: levelFor(2), v: 0, t: levelFor(2) };
  var pourUntil = 0, streamW = 0, lidOpen = { p: 1, v: 0, t: 1 }, packing = false;
  var honey = $("#honey"), sheen = $("#sheen"), stream = $("#stream"), lid = $("#lid"), dipper = $("#dipper"), bee = $("#bee"), drip = $("#drip");
  var bubbles = [];
  for (var b = 0; b < 7; b++) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("r", 1.2 + (b % 3));
    $("#bubbles").appendChild(c);
    bubbles.push({ el: c, x: 70 + b * 19, y: 220 - b * 15, sp: .12 + (b % 3) * .05 });
  }
  function surfacePath(y) {
    var d = "M" + (X0 - 10) + " " + (y + hs[0]).toFixed(2);
    for (var i = 0; i < N; i++) { var x = X0 + (X1 - X0) * i / (N - 1); d += " L" + x.toFixed(1) + " " + (y + hs[i]).toFixed(2); }
    return d + " L" + (X1 + 10) + " " + (y + hs[N - 1]).toFixed(2);
  }
  var last = performance.now(), t0 = last, tiltS = 0;
  function frame(now) {
    var dt = Math.min(3, (now - last) / 16.7), t = (now - t0) / 1000;
    last = now;
    var pouring = now < pourUntil;
    for (var s = 0; s < dt; s++) {
      // level: slow and syrupy with a soft overshoot
      level.v = level.v * .88 + (level.t - level.y) * .018; level.y += level.v;
      lidOpen.v = lidOpen.v * .74 + (lidOpen.t - lidOpen.p) * .1; lidOpen.p += lidOpen.v;
      // the surface: each point is a damped spring, neighbours pull on each other
      if (pouring) { vs[8] += .5; vs[9] += .35; }
      for (var i = 0; i < N; i++) vs[i] += -.03 * hs[i] - .07 * vs[i];
      for (var j = 0; j < N; j++) {
        var l = j ? hs[j - 1] : hs[j], r = j < N - 1 ? hs[j + 1] : hs[j];
        vs[j] += (l + r - 2 * hs[j]) * .05;
      }
      for (var k = 0; k < N; k++) { hs[k] += vs[k]; hs[k] = Math.max(-7, Math.min(7, hs[k])); }
    }
    if (reduce.matches) { level.y = level.t; lidOpen.p = lidOpen.t; hs.fill(0); }
    // a gentle idle sway so the honey never looks frozen
    var sway = reduce.matches ? 0 : Math.sin(t * 1.3) * .8;
    var y = level.y;
    var top = surfacePath(y + sway);
    honey.setAttribute("d", top + " V240 H" + (X0 - 10) + " Z");
    sheen.setAttribute("d", top);
    // bubbles drift up and restart below once they reach the surface
    bubbles.forEach(function (bb) {
      if (!reduce.matches) bb.y -= bb.sp * dt;
      if (bb.y < y + 6) bb.y = 224;
      bb.el.setAttribute("cx", (bb.x + Math.sin(t * 2 + bb.x) * 2).toFixed(1));
      bb.el.setAttribute("cy", bb.y.toFixed(1));
      bb.el.style.opacity = y > 218 ? 0 : 1;
    });
    // the stream: thick while pouring, thins to a thread and lets go
    var wantW = pouring ? 7 : 0;
    streamW += (wantW - streamW) * (pouring ? .25 : .12);
    tiltS += ((pouring ? 1 : 0) - tiltS) * Math.min(1, .16 * dt); // the dipper eases over the jar and back
    var tilt = reduce.matches ? (pouring ? 1 : 0) : tiltS;
    dipper.setAttribute("transform", "translate(" + (tilt * -18 + Math.sin(t * 1.1) * 2).toFixed(2) + " " + (tilt * 8 + Math.sin(t * 1.7) * 3).toFixed(2) + ")");
    if (streamW > .3) {
      var sx = 176 + tilt * -18 + Math.sin(t * 1.1) * 2, sy = 43 + tilt * 8 + Math.sin(t * 1.7) * 3, wob = Math.sin(t * 9) * 1.5;
      stream.setAttribute("d", "M" + sx.toFixed(1) + " " + sy.toFixed(1) + " C" + (sx - 4).toFixed(1) + " " + (sy + 18) + " " + (132 + wob).toFixed(1) + " 52 " + (132 + wob).toFixed(1) + " 74 L" + (132 + wob * .4).toFixed(1) + " " + (y + 2).toFixed(1));
      stream.setAttribute("stroke-width", streamW.toFixed(2));
    } else stream.setAttribute("stroke-width", 0);
    // the drip hanging from the dipper stretches and falls every few seconds
    var dp = (t % 3.2) / 3.2, len = dp < .8 ? dp / .8 * 10 : 0;
    drip.setAttribute("d", pouring || reduce.matches ? "" : "M176 41 q2 " + (len * .6).toFixed(1) + " 0 " + (4 + len).toFixed(1) + " q-2 " + (-len * .4).toFixed(1) + " 0 " + (-(4 + len)).toFixed(1) + "z");
    // lid: p = 1 floats up and to the left, p = 0 seated on the jar
    var p = lidOpen.p;
    lid.setAttribute("transform", "translate(" + (-62 * p).toFixed(2) + " " + (-26 * p + (p > .5 ? Math.sin(t * 1.4) * 2 : 0)).toFixed(2) + ") rotate(" + (-18 * p).toFixed(2) + " 130 57)");
    // bee: a lazy figure of eight above the jar, facing the way it flies
    var bx = 130 + Math.sin(t * .8) * 100, by = 22 + Math.sin(t * 1.6) * 14 + Math.sin(t * 7) * 1.5, face = Math.cos(t * .8) >= 0 ? 1 : -1;
    bee.setAttribute("transform", "translate(" + bx.toFixed(1) + " " + by.toFixed(1) + ") scale(" + face + " 1)");
    requestAnimationFrame(frame);
  }

  // ---------- Quantity changes ----------
  var qtyIn = $("#qty"), msg = $("#msg"), jar = $("#jar"), lidTwist = $("#lidTwist");
  var chips = [].slice.call(document.querySelectorAll("#chips button"));
  function say(t, bad) { msg.textContent = t; msg.classList.toggle("bad", !!bad); }
  function replay(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
  function setQ(nq, quiet) {
    nq = Math.max(1, Math.min(MAXQ, Math.round(nq)));
    var diff = nq - q;
    q = nq;
    level.t = levelFor(q);
    if (diff > 0) { pourUntil = Math.max(pourUntil, performance.now()) + 260 + diff * 140; }
    else if (diff < 0) {
      replay(jar, "tilt");
      for (var i = 0; i < N; i++) vs[i] -= .9 * Math.sin(i / (N - 1) * Math.PI); // the surface slops as honey leaves
    }
    lidOpen.t = q === MAXQ ? 0 : 1;
    if (q === MAXQ && diff > 0) setTimeout(function () { if (q === MAXQ) replay(lidTwist, "twist"); }, 650);
    $("#fullBadge").classList.toggle("on", q === MAXQ);
    if (document.activeElement !== qtyIn || quiet) qtyIn.value = String(kg(q));
    chips.forEach(function (c) { c.setAttribute("aria-pressed", String(+c.dataset.q === q)); });
    $("#labelW").textContent = weightText(q);
    var sub = kg(q) * PER_KG, del = sub >= FREE_FROM ? 0 : DELIVERY;
    $("#calc").textContent = weightText(q) + " × 6,400" + (del ? " + 250 delivery" : " · free delivery");
    countTo(sub + del);
    var fill = Math.min(1, sub / FREE_FROM), free = $("#free");
    $("#freeFill").style.transform = "scaleX(" + fill.toFixed(3) + ")";
    free.classList.toggle("got", !del);
    $("#freeText").textContent = del ? pkr(FREE_FROM - sub) + " more for free delivery" : "Free delivery unlocked";
    $("#minus").setAttribute("aria-label", q > 1 ? "250 grams less, now " + weightText(q) : "Smallest jar reached");
    $("#plus").setAttribute("aria-label", q < MAXQ ? "250 grams more, now " + weightText(q) : "Biggest jar reached");
    if (!quiet) say(diff > 0 ? "Pouring to " + weightText(q) + (q === MAXQ ? ". Family jar, lid on." : "") : diff < 0 ? "Down to " + weightText(q) : weightText(q) + " jar");
  }
  var shownTotal = 0, raf = 0;
  function countTo(v) {
    cancelAnimationFrame(raf);
    var from = shownTotal, s = performance.now(), el = $("#total");
    if (reduce.matches) { shownTotal = v; el.textContent = pkr(v); return; }
    (function step(n) { var k = Math.min(1, (n - s) / 600), e = 1 - Math.pow(1 - k, 3); shownTotal = from + (v - from) * e; el.textContent = pkr(shownTotal); if (k < 1) raf = requestAnimationFrame(step); })(s);
  }
  function bumpUp() { if (packing) return; if (q >= MAXQ) { replay(jar, "nope"); say("3 kg is our biggest jar", true); return; } setQ(q + 1); }
  function bumpDown() { if (packing) return; if (q <= 1) { replay(jar, "nope"); say("250 g is the smallest jar", true); return; } setQ(q - 1); }
  $("#plus").addEventListener("click", bumpUp);
  $("#minus").addEventListener("click", bumpDown);
  chips.forEach(function (c) { c.addEventListener("click", function () { if (!packing) setQ(+c.dataset.q); }); });
  // typing: accept 1.5, 1,5 or 750 (grams); snap to the nearest 250 g when you leave or press Enter
  function readTyped() {
    var v = parseFloat(qtyIn.value.replace(",", "."));
    if (isNaN(v)) return null;
    if (v > 20) v = v / 1000; // typed in grams
    return v / .25;
  }
  qtyIn.addEventListener("input", function () {
    var v = readTyped();
    if (v === null) { say("Type a weight such as 1.5", true); return; }
    if (v < 1 || v > MAXQ) { say("Pick between 0.25 and 3 kg", true); return; }
    if (Math.abs(v - Math.round(v)) < 1e-6) setQ(v); else say("Jars come in 250 g steps. Press Enter to round it.");
  });
  function commit() { var v = readTyped(); setQ(v === null ? q : v, true); say(weightText(q) + " jar"); }
  qtyIn.addEventListener("change", commit);
  qtyIn.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); bumpUp(); qtyIn.value = String(kg(q)); }
    else if (e.key === "ArrowDown") { e.preventDefault(); bumpDown(); qtyIn.value = String(kg(q)); }
  });

  // ---------- Add to cart: lid on, jar hops into the cart, the badge counts it ----------
  var cartJars = 0, cartSum = 0, busy = false;
  function hexes() {
    if (reduce.matches) return;
    var cart = $("#cart"), scene = cart.parentNode, cols = ["#ffd34f", "#f5a41a", "#ffe9a8", "#d27300"];
    for (var i = 0; i < 16; i++) {
      var h = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
      h.className = "hex";
      h.style.cssText = "right:" + (cart.offsetWidth / 2 + 10) + "px;top:24px;--c:" + cols[i % 4] + ";--x:" + (Math.cos(a) * d).toFixed(0) + "px;--y:" + (Math.sin(a) * d).toFixed(0) + "px";
      scene.appendChild(h); setTimeout(h.remove.bind(h), 1300);
    }
  }
  async function addToCart(btn, fromDemo) {
    if (busy) return;
    busy = true; packing = true;
    btn.classList.add("busy"); $("#addText").textContent = "Packing";
    lidOpen.t = 0;
    await wait(reduce.matches ? 60 : 520);
    replay(lidTwist, "twist");
    jar.classList.remove("tilt", "nope"); replay(jar, "pack");
    lid.style.opacity = "0";
    await wait(reduce.matches ? 60 : 620);
    var sub = kg(q) * PER_KG;
    if (!fromDemo || demoOn) { cartJars++; cartSum += sub; } // a demo jar packed after a real touch is not counted
    $("#cartN").textContent = cartJars;
    replay($("#cart"), "bump"); hexes();
    btn.classList.remove("busy"); btn.classList.add("done"); $("#addText").textContent = "Added";
    say("Added a " + weightText(q) + " jar. Cart: " + cartJars + (cartJars > 1 ? " jars, " : " jar, ") + pkr(cartSum) + (cartSum >= FREE_FROM ? " with free delivery" : ""));
    await wait(reduce.matches ? 60 : 480);
    lid.style.opacity = ""; lidOpen.p = 0; lidOpen.t = q === MAXQ ? 0 : 1;
    packing = false; busy = false;
    await wait(1200);
    btn.classList.remove("done"); $("#addText").textContent = "Add to cart";
  }
  $("#add").addEventListener("click", function (e) { var btn = e.currentTarget; addToCart(btn); });

  // ---------- Start ----------
  setQ(2, true);
  level.y = level.t;
  requestAnimationFrame(frame);

  // ---------- Auto demo: pours up, picks 2 kg, takes some out, adds to cart, resets ----------
  var demoOn = true;
  function stopDemo(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    cartJars = 0; cartSum = 0; $("#cartN").textContent = "0"; // the demo's jars were only pretend
  }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function demo() {
    try {
      await pause(700);
      while (demoOn) {
        bumpUp(); await pause(650); bumpUp(); await pause(650); bumpUp(); await pause(900);
        setQ(8); await pause(1500);
        bumpDown(); await pause(900);
        setQ(12); await pause(1800);
        await addToCart($("#add"), true); await pause(1700);
        setQ(2); await pause(1600);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
</body>
</html>
