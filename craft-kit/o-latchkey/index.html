<!doctype html>
<!-- Chill & Craft · Latchkey · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latchkey · smart door lock PIN pad</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --wall: #e9e1d4;
    --wall-hi: #f8f3ea;
    --siding: rgba(110, 86, 52, .12);
    --trim: #fbf8f2;
    --trim-edge: #d9cfbf;
    --door: #2f6a68;
    --door-dk: #24524f;
    --inside-a: #ffd998;
    --inside-b: #e59b4e;
    --lock: #171b1f;
    --lock-2: #2b3137;
    --glow: #63e6f2;
    --ok: #46e39c;
    --bad: #ff5f6d;
    --warm: #ffcf7a;
    --ink: #2a2520;
    --muted: #776a5b;
    --shadow: rgba(66, 48, 24, .35);
    --sill: #cbc2b4;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --wall: #131a21;
    --wall-hi: #233040;
    --siding: rgba(255, 255, 255, .04);
    --trim: #2a323b;
    --trim-edge: #1a2027;
    --door: #1d4746;
    --door-dk: #153634;
    --ink: #ece6dc;
    --muted: #9aa5b1;
    --shadow: rgba(0, 0, 0, .7);
    --sill: #2f3740;
  }

  /* ---------- Page: a wall with wooden siding ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 18px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(ellipse 70% 55% at 50% 8%, var(--wall-hi), transparent 70%),
      repeating-linear-gradient(180deg, transparent 0 30px, var(--siding) 30px 31px, rgba(255, 255, 255, .05) 31px 32px),
      var(--wall);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .scene { position: relative; width: min(100%, 360px); display: flex; flex-direction: column; align-items: center; }

  /* ---------- Porch lamp above the door ---------- */
  .lamp { position: relative; width: 46px; height: 34px; margin-bottom: 6px; z-index: 2; }
  .lamp .cap { position: absolute; left: 7px; right: 7px; top: 0; height: 9px; border-radius: 6px 6px 2px 2px; background: #2a2c2f; }
  .lamp .bulb {
    position: absolute; left: 12px; right: 12px; top: 8px; height: 22px; border-radius: 4px 4px 10px 10px;
    background: linear-gradient(180deg, #fff3d1, var(--warm));
    box-shadow: inset 0 0 0 2px #2a2c2f, 0 0 18px rgba(255, 207, 122, .55);
    animation: flicker 5s infinite;
  }
  .lamp::after {
    content: ""; position: absolute; left: 50%; top: 18px; width: min(420px, 100vw); height: 300px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 207, 122, .32), transparent 62%);
    pointer-events: none; opacity: .45; transition: opacity .8s;
  }
  [data-theme="dark"] .lamp::after { opacity: 1; }
  .scene.open .lamp::after { opacity: 1; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 46% { opacity: 1; } 47% { opacity: .82; } 48% { opacity: 1; } 71% { opacity: .92; } 72% { opacity: 1; } }
  .plate {
    position: absolute; left: calc(100% + 18px); top: 6px; padding: 3px 7px; border-radius: 4px;
    font: 700 11px/1 ui-serif, Georgia, serif; letter-spacing: .08em; color: #5a4210;
    background: linear-gradient(160deg, #f6dc94, #c99d3c); box-shadow: 0 2px 4px rgba(0, 0, 0, .25); white-space: nowrap;
  }

  /* ---------- Door frame, room behind it and the door itself ---------- */
  .frame {
    position: relative;
    width: 100%;
    height: 392px;
    padding: 12px 12px 0;
    border-radius: 8px 8px 0 0;
    background: linear-gradient(90deg, var(--trim-edge), var(--trim) 6%, var(--trim) 94%, var(--trim-edge));
    box-shadow: 0 34px 50px -34px var(--shadow), 0 0 0 1px rgba(0, 0, 0, .05);
    z-index: 1;
  }
  .opening { position: relative; height: 100%; perspective: 1300px; background: #2a1a0c; overflow: visible; }
  /* The warm room you see when the door swings open */
  .inside {
    position: absolute; inset: 0; overflow: hidden; z-index: 0;
    background: radial-gradient(ellipse at 78% 18%, #fff4d6, var(--inside-a) 30%, var(--inside-b) 85%);
  }
  .inside::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(180deg, #b8743a, #8e5626); }
  .inside svg { position: absolute; right: 8px; bottom: 18%; width: 90px; height: 170px; z-index: 1; }
  .door {
    position: absolute; inset: 0; z-index: 1;
    transform-origin: 0 50%;
    transition: transform 1.05s cubic-bezier(.25, .85, .3, 1.12);
    background:
      linear-gradient(100deg, rgba(255, 255, 255, .08), transparent 40%),
      repeating-linear-gradient(90deg, var(--door) 0 44px, var(--door-dk) 44px 46px, rgba(255, 255, 255, .07) 46px 47px, var(--door) 47px 48px);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25), inset -10px 0 18px -10px rgba(0, 0, 0, .35);
  }
  .door::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 30%, rgba(0, 0, 0, .45)); opacity: 0; transition: opacity 1s; pointer-events: none; }
  .scene.open .door { transform: rotateY(40deg); }
  .scene.open .door::after { opacity: 1; }
  .scene.shut .door { animation: thud .35s ease-out; }
  @keyframes thud { 30% { transform: translateX(1.5px); } 60% { transform: translateX(-1px); } }

  /* Dead bolt that slides from the door edge into the frame */
  .bolt {
    position: absolute; right: -11px; top: 56%; width: 20px; height: 12px; border-radius: 3px;
    background: linear-gradient(180deg, #f1f3f5, #9aa3ab 55%, #6b737a);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .4);
    transition: transform .34s cubic-bezier(.55, -0.5, .3, 1.6);
  }
  .scene.unbolted .bolt { transform: translateX(-14px); }

  /* ---------- The smart lock ---------- */
  .lock {
    position: absolute; top: 50%; left: clamp(12px, 7%, 26px);
    width: 206px; padding: 14px 13px 15px;
    transform: translateY(-50%);
    border-radius: 26px;
    background: linear-gradient(160deg, var(--lock-2), var(--lock) 55%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 0 0 1px rgba(255, 255, 255, .04), 0 16px 28px -10px rgba(0, 0, 0, .55), 0 3px 0 rgba(0, 0, 0, .35);
    color: #d8f7ff;
    text-align: center;
  }
  .lock.bad { animation: shake .45s ease; }
  @keyframes shake { 20%, 60% { transform: translateY(-50%) translateX(-6px); } 40%, 80% { transform: translateY(-50%) translateX(6px); } }

  /* Status ring with a lock icon */
  .ring { position: relative; width: 58px; height: 58px; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; overflow: visible; }
  .ring .track { stroke: rgba(255, 255, 255, .08); }
  .ring .arc { stroke: var(--glow); stroke-dasharray: 170; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 32px 32px; opacity: .55; transition: stroke .3s, opacity .3s; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .2; } }
  .ring .icon { color: var(--glow); transition: color .3s; }
  .ring .shackle { transform-box: fill-box; transform-origin: 100% 100%; transition: transform .45s cubic-bezier(.34, 1.7, .5, 1); }
  .ring .count { font: 700 15px/1 system-ui, sans-serif; fill: #ffd2d6; opacity: 0; }
  .lock.checking .arc { animation: sweep .82s cubic-bezier(.6, 0, .3, 1) forwards; opacity: 1; }
  @keyframes sweep { from { stroke-dashoffset: 170; } to { stroke-dashoffset: 0; } }
  .lock.ok .arc { stroke: var(--ok); opacity: 1; animation: none; filter: drop-shadow(0 0 5px var(--ok)); }
  .lock.ok .icon { color: var(--ok); }
  .lock.ok .shackle { transform: translateY(-3px) rotate(-32deg); }
  .lock.bad .arc, .lock.jam .arc { stroke: var(--bad); opacity: 1; animation: none; }
  .lock.bad .icon { color: var(--bad); }
  .lock.jam .icon { opacity: 0; }
  .lock.jam .count { opacity: 1; }
  .lock.jam .arc { transition: stroke-dashoffset 1s linear; }

  /* Six PIN dots: each one is a real input */
  .pins { display: flex; justify-content: center; gap: 7px; margin: 9px 0 12px; }
  .pin { position: relative; width: 24px; height: 28px; }
  .pin input {
    position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; margin: 0; border: 0; border-radius: 8px;
    background: transparent; color: transparent; caret-color: transparent; text-align: center; font-size: 16px; outline: none; cursor: pointer;
  }
  .pin::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    border: 2px solid rgba(99, 230, 242, .45); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), border-color .2s, box-shadow .2s; pointer-events: none;
  }
  .pin::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 10px var(--glow); transform: scale(0); transition: transform .35s cubic-bezier(.34, 1.7, .5, 1) .28s, background .3s; pointer-events: none;
  }
  .pin.filled::after { transform: scale(1); }
  .pin.cur::before, .pin:focus-within::before { transform: scale(1.3); border-color: #c9fbff; box-shadow: 0 0 0 3px rgba(99, 230, 242, .22), 0 0 12px rgba(99, 230, 242, .6); }
  .pin b { position: absolute; inset: 0; display: grid; place-items: center; font: 650 19px/1 system-ui, sans-serif; color: #f0fdff; opacity: 0; pointer-events: none; }
  .pin.peek b { animation: peek .62s ease forwards; }
  @keyframes peek { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 25% { opacity: 1; transform: none; } 60% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(.3); } }
  .lock.ok .pin::after { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .lock.bad .pin::after { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .lock.ok .pin { animation: hop .5s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * 55ms); }
  @keyframes hop { 40% { transform: translateY(-7px); } }

  /* Backlit keypad */
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    position: relative; overflow: hidden; height: 44px; padding: 0; border: 0; border-radius: 13px; cursor: pointer;
    background: linear-gradient(180deg, #2c3339, #1e2328);
    color: #d4f7ff; font: 600 19px/1 system-ui, sans-serif;
    text-shadow: 0 0 8px rgba(99, 230, 242, .55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 2px 0 #0b0e10, 0 5px 9px rgba(0, 0, 0, .35);
    transition: transform .12s, box-shadow .25s, background .25s, opacity .3s;
  }
  .key small { display: block; margin-top: 2px; font-size: 7.5px; font-weight: 700; letter-spacing: .18em; color: #7e9aa5; text-shadow: none; }
  .key.fn { font-size: 13px; letter-spacing: .06em; color: #9fb8c1; }
  .key::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: rgba(99, 230, 242, .5); transform: scale(0); opacity: 0; pointer-events: none; }
  .key.hit { transform: translateY(2px); background: radial-gradient(circle at 50% 45%, rgba(99, 230, 242, .42), #1e2328 72%); box-shadow: inset 0 0 14px rgba(99, 230, 242, .45), 0 0 0 #0b0e10, 0 0 18px rgba(99, 230, 242, .4); }
  .key.hit::after { animation: ripple .5s ease-out; }
  @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(9); opacity: 0; } }
  .key:hover:not(:disabled) { background: linear-gradient(180deg, #343c43, #23292e); }
  .key:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .key:disabled { cursor: default; }
  .lock.jam .key { opacity: .35; }
  .lock.wave .key { animation: wave .6s ease both; animation-delay: calc(var(--k) * 40ms); }
  @keyframes wave { 35% { box-shadow: inset 0 0 14px rgba(70, 227, 156, .55), 0 0 16px rgba(70, 227, 156, .45); color: #d9ffe9; } }

  /* Lever handle beside the lock */
  .handle { position: absolute; left: calc(100% + 10px); top: 57%; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6f7f8, #9aa3ab 60%, #5f666c); box-shadow: 0 3px 6px rgba(0, 0, 0, .45); }
  .handle i { position: absolute; left: 10px; top: 6px; width: 50px; height: 12px; border-radius: 3px 8px 8px 3px; background: linear-gradient(180deg, #f1f3f5, #a2abb2 55%, #6e767c); box-shadow: 0 4px 6px rgba(0, 0, 0, .4); transform-origin: 2px 6px; transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
  .scene.lever .handle i { transform: rotate(28deg); }

  /* ---------- Sill and the text below ---------- */
  .sill { position: relative; width: calc(100% + 30px); height: 14px; border-radius: 3px; background: linear-gradient(180deg, var(--sill), rgba(0, 0, 0, .12)); box-shadow: 0 10px 18px -10px var(--shadow); }
  .sill::after { content: ""; position: absolute; left: 10%; right: 6%; top: 100%; height: 46px; background: radial-gradient(ellipse at 40% 0%, rgba(255, 196, 110, .55), transparent 70%); opacity: 0; transition: opacity .9s .25s; pointer-events: none; }
  .scene.open .sill::after { opacity: 1; }
  .below { position: relative; z-index: 2; margin-top: 14px; text-align: center; width: 100%; }
  .status { min-height: 22px; margin: 0; font-size: 15px; font-weight: 650; }
  .status[data-tone="good"] { color: #1f8f5c; }
  .status[data-tone="bad"] { color: #c8323f; }
  [data-theme="dark"] .status[data-tone="good"] { color: var(--ok); }
  [data-theme="dark"] .status[data-tone="bad"] { color: #ff8b95; }
  .status.pop { animation: statusIn .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(6px) scale(.96); } }
  .hint { margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
  .hint b { display: inline-block; margin-left: 6px; padding: 3px 9px; border-radius: 8px; font: 700 14px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .22em; color: var(--ink); background: rgba(255, 255, 255, .55); box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); }
  [data-theme="dark"] .hint b { background: rgba(255, 255, 255, .07); box-shadow: 0 0 0 1px rgba(255, 255, 255, .1); }
  .hint b.fresh { animation: fresh .6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes fresh { from { transform: scale(.7); opacity: 0; } }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 17px; border-radius: 999px; font: 650 13px/1 system-ui, sans-serif; cursor: pointer;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s, background .2s, opacity .2s;
  }
  .btn.ghost { border: 1px solid rgba(0, 0, 0, .18); background: rgba(255, 255, 255, .4); color: var(--ink); }
  [data-theme="dark"] .btn.ghost { border-color: rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .05); }
  .btn.solid { border: 0; color: #08221f; background: linear-gradient(135deg, #8ff5c6, var(--ok)); box-shadow: 0 6px 16px -6px rgba(31, 143, 92, .6); }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: scale(.95); transition-duration: .08s; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* Warm motes that float out of the open door */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .fx i { position: absolute; left: 0; top: 0; display: block; border-radius: 50%; }

  @media (max-width: 380px) {
    .plate { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="scene" id="scene">
    <h1 class="sr-only">Front door smart lock</h1>
    <div class="lamp" aria-hidden="true"><div class="cap"></div><div class="bulb"></div><span class="plate">No. 14</span></div>

    <div class="frame">
      <div class="opening">
        <!-- The room behind the door: a hanging lamp and a potted plant -->
        <div class="inside" aria-hidden="true">
          <svg viewBox="0 0 90 170" fill="none">
            <path d="M60 0v34" stroke="#6b3d16" stroke-width="2"/>
            <path d="M44 52a16 16 0 0 1 32 0z" fill="#7a4a1f"/>
            <ellipse cx="60" cy="54" rx="9" ry="3" fill="#fff6d8"/>
            <path d="M22 128c-14-18-12-40 4-52M24 128c6-24 22-34 36-34M26 128c-2-30 6-50 16-62" stroke="#3f6b3a" stroke-width="5" stroke-linecap="round"/>
            <path d="M8 128h40l-6 34H14z" fill="#9c5a2c"/>
          </svg>
        </div>

        <div class="door" id="door">
          <div class="bolt" aria-hidden="true"></div>
          <section class="lock" id="lock" aria-label="Keypad lock">
            <div class="ring" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none">
                <circle class="track" cx="32" cy="32" r="27" stroke-width="3"/>
                <circle class="arc" id="arc" cx="32" cy="32" r="27" stroke-width="3" stroke-linecap="round"/>
                <g class="icon" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                  <path class="shackle" d="M27 31v-4.5a5 5 0 0 1 10 0V31"/>
                  <rect x="23.5" y="30.5" width="17" height="13" rx="3.5" fill="currentColor" fill-opacity=".16"/>
                  <path d="M32 35.5v3"/>
                </g>
                <text class="count" id="count" x="32" y="37.5" text-anchor="middle"></text>
              </svg>
            </div>
            <div class="pins" id="pins" role="group" aria-label="6-digit door PIN" aria-describedby="hint">
              <span class="pin" style="--i:0"><input inputmode="numeric" autocomplete="one-time-code" aria-label="PIN digit 1 of 6"><b aria-hidden="true"></b></span>
              <span class="pin" style="--i:1"><input inputmode="numeric" autocomplete="off" aria-label="PIN digit 2 of 6"><b aria-hidden="true"></b></span>
              <span class="pin" style="--i:2"><input inputmode="numeric" autocomplete="off" aria-label="PIN digit 3 of 6"><b aria-hidden="true"></b></span>
              <span class="pin" style="--i:3"><input inputmode="numeric" autocomplete="off" aria-label="PIN digit 4 of 6"><b aria-hidden="true"></b></span>
              <span class="pin" style="--i:4"><input inputmode="numeric" autocomplete="off" aria-label="PIN digit 5 of 6"><b aria-hidden="true"></b></span>
              <span class="pin" style="--i:5"><input inputmode="numeric" autocomplete="off" aria-label="PIN digit 6 of 6"><b aria-hidden="true"></b></span>
            </div>
            <div class="keys" id="keys">
              <button type="button" class="key" data-d="1" style="--k:0">1<small>&nbsp;</small></button>
              <button type="button" class="key" data-d="2" style="--k:1">2<small>ABC</small></button>
              <button type="button" class="key" data-d="3" style="--k:2">3<small>DEF</small></button>
              <button type="button" class="key" data-d="4" style="--k:3">4<small>GHI</small></button>
              <button type="button" class="key" data-d="5" style="--k:4">5<small>JKL</small></button>
              <button type="button" class="key" data-d="6" style="--k:5">6<small>MNO</small></button>
              <button type="button" class="key" data-d="7" style="--k:6">7<small>PQRS</small></button>
              <button type="button" class="key" data-d="8" style="--k:7">8<small>TUV</small></button>
              <button type="button" class="key" data-d="9" style="--k:8">9<small>WXYZ</small></button>
              <button type="button" class="key fn" data-fn="clear" style="--k:9" aria-label="Clear PIN">CLR</button>
              <button type="button" class="key" data-d="0" style="--k:10">0<small>+</small></button>
              <button type="button" class="key fn" data-fn="back" style="--k:11" aria-label="Delete last digit">
                <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 1h13v14H7L1 8z"/><path d="M11 5l6 6M17 5l-6 6" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="handle" aria-hidden="true"><i></i></div>
          </section>
        </div>
      </div>
    </div>
    <div class="sill" aria-hidden="true"></div>

    <div class="below">
      <p class="status" id="status" role="status" aria-live="polite">Enter the 6-digit PIN to unlock.</p>
      <p class="hint" id="hint">Guest PIN<b id="demo"></b></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="newPin">New guest PIN</button>
        <button type="button" class="btn solid" id="again" hidden>Lock the door</button>
      </div>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const scene = $("scene"), lock = $("lock"), statusEl = $("status"), demoEl = $("demo");
  const againBtn = $("again"), newBtn = $("newPin"), arc = $("arc"), countEl = $("count");
  const pins = Array.from(document.querySelectorAll(".pin"));
  const boxes = pins.map((p) => p.querySelector("input"));
  const peeks = pins.map((p) => p.querySelector("b"));
  const keys = Array.from(document.querySelectorAll(".key"));
  const LEN = 6;
  const vals = Array(LEN).fill("");
  let pin = "";
  let state = "idle";            // idle | checking | open | jammed
  let tries = 3;
  let jamTimer = 0;

  // ---- Cancellable waits: a reset bumps `gen`, which stops any running sequence ----
  const CANCEL = { cancelled: true };
  let gen = 0;
  function pause(ms, g, isAnim) {
    const t = isAnim && reduce ? Math.min(ms, 140) : ms;
    return new Promise((ok, no) => setTimeout(() => (g === gen ? ok() : no(CANCEL)), t));
  }
  const quiet = (p) => p.catch((e) => { if (e !== CANCEL) throw e; });

  // ---- Small helpers ----
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function say(msg, tone) { statusEl.textContent = msg; statusEl.dataset.tone = tone || ""; restart(statusEl, "pop"); }
  function newPin() {
    do { pin = ""; for (let i = 0; i < LEN; i++) pin += Math.floor(Math.random() * 10); } while (/^(\d)\1+$/.test(pin));
    demoEl.textContent = pin;
    restart(demoEl, "fresh");
  }
  function lightKey(d) {
    const k = keys.find((b) => b.dataset.d === d);
    if (!k) return;
    restart(k, "hit");
    clearTimeout(k._t);
    k._t = setTimeout(() => k.classList.remove("hit"), 180);
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    pins[i].classList.toggle("filled", d !== "");
    if (d) { peeks[i].textContent = d; restart(pins[i], "peek"); lightKey(d); }
  }
  function mark(i) {
    pins.forEach((p, n) => p.classList.toggle("cur", n === i && state === "idle"));
  }
  function go(i) {
    i = Math.max(0, Math.min(LEN - 1, i));
    mark(i);
    if (!demoOn) { boxes[i].focus(); boxes[i].select(); }
  }
  const firstEmpty = () => vals.indexOf("");
  function clearAll() { for (let i = 0; i < LEN; i++) setDigit(i, ""); mark(0); }
  function setLocked(on) {
    boxes.forEach((b) => (b.disabled = on));
    keys.forEach((k) => (k.disabled = on));
  }

  // ---- Entering digits: keypad, keyboard, paste ----
  function typeDigit(d) {
    if (state !== "idle") return null;
    const i = firstEmpty();
    if (i < 0) return null;
    setDigit(i, d);
    mark(Math.min(i + 1, LEN - 1));
    return maybeVerify();
  }
  function backspace() {
    if (state !== "idle") return;
    let i = LEN - 1;
    while (i >= 0 && !vals[i]) i--;
    if (i >= 0) { setDigit(i, ""); mark(i); }
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) { if (i >= LEN) break; setDigit(i, d); i++; }
    go(i);
    maybeVerify();
  }
  function maybeVerify() {
    if (state === "idle" && vals.every((v) => v !== "")) return quiet(verify());
    return null;
  }

  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => { mark(i); requestAnimationFrame(() => box.select()); });
    box.addEventListener("blur", () => pins[i].classList.remove("cur"));
    box.addEventListener("input", (e) => {
      if (state !== "idle") { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText" && e.data && e.data.length === 1) {
        const d = e.data.replace(/\D/g, "");
        if (!d) { box.value = vals[i]; return; }
        setDigit(i, d); go(i + 1); maybeVerify();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { go(i + 1); maybeVerify(); }
      }
    });
    box.addEventListener("keydown", (e) => {
      if (state !== "idle") return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); go(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); go(i - 1); break;
        case "ArrowRight": e.preventDefault(); go(i + 1); break;
        case "Home": e.preventDefault(); go(0); break;
        case "End": e.preventDefault(); go(LEN - 1); break;
      }
    });
    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (state !== "idle") return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // On-screen keypad
  keys.forEach((k) => k.addEventListener("click", () => {
    if (k.dataset.d) typeDigit(k.dataset.d);
    else if (k.dataset.fn === "back") { backspace(); restart(k, "hit"); setTimeout(() => k.classList.remove("hit"), 180); }
    else if (k.dataset.fn === "clear" && state === "idle") { clearAll(); restart(k, "hit"); setTimeout(() => k.classList.remove("hit"), 180); }
  }));
  // Typing while a keypad button (or nothing) has focus still works
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); typeDigit(e.key); }
    else if (e.key === "Backspace") { e.preventDefault(); backspace(); }
  });

  // ---- Check the PIN ----
  async function verify() {
    const g = gen;
    state = "checking";
    mark(-1);
    setLocked(true);
    say("Checking PIN…");
    restart(lock, "checking");
    await pause(840, g, true);
    lock.classList.remove("checking");
    if (vals.join("") === pin) {
      // 1. Ring turns green, the keys light up in a wave, the shackle pops open
      lock.classList.add("ok");
      restart(lock, "wave");
      say("PIN accepted. Unlocking…", "good");
      await pause(420, g, true);
      // 2. Dead bolt slides back with a clunk
      scene.classList.add("unbolted");
      await pause(360, g, true);
      // 3. Lever presses down
      scene.classList.add("lever");
      await pause(300, g, true);
      // 4. Door swings open, warm light and motes spill out
      scene.classList.add("open");
      state = "open";
      tries = 3;
      say("Welcome home, Ayesha.", "good");
      await pause(250, g, true);
      motes();
      scene.classList.remove("lever");
      againBtn.hidden = false;
      if (!demoOn) againBtn.focus();
    } else {
      tries--;
      lock.classList.add("bad");
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      if (tries > 0) say("Wrong PIN. " + tries + (tries === 1 ? " try" : " tries") + " left.", "bad");
      await pause(760, g, true);
      lock.classList.remove("bad");
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
      clearAll();
      if (tries <= 0) { jam(g); return; }
      state = "idle";
      setLocked(false);
      go(0);
    }
  }

  // Three wrong PINs lock the keypad for 15 seconds, shown as a countdown in the ring
  function jam(g) {
    state = "jammed";
    lock.classList.add("jam");
    let left = 15;
    say("Too many wrong PINs. Keypad locked for 15 seconds.", "bad");
    const tick = () => {
      if (g !== gen) return;
      countEl.textContent = left;
      arc.style.strokeDashoffset = String(170 - (170 * left) / 15);
      if (left-- <= 0) {
        lock.classList.remove("jam");
        arc.style.strokeDashoffset = "";
        tries = 3;
        state = "idle";
        setLocked(false);
        say("Keypad ready. Try again.");
        go(0);
        return;
      }
      jamTimer = setTimeout(tick, 1000);
    };
    tick();
  }

  // Close the door: it swings shut, thuds, then the bolt shoots back
  async function lockUp(g) {
    againBtn.hidden = true;
    scene.classList.remove("open");
    say("Locking…");
    await pause(820, g, true);
    restart(scene, "shut");
    scene.classList.remove("unbolted");
    lock.classList.remove("ok");
    await pause(320, g, true);
    clearAll();
    state = "idle";
    setLocked(false);
    say("Locked. Enter the PIN to open.");
  }
  againBtn.addEventListener("click", () => quiet(lockUp(gen)).then(() => { if (!demoOn) go(0); }));

  // New guest PIN, with a cool-down
  let cool = 0;
  newBtn.addEventListener("click", () => {
    if (cool || state !== "idle") return;
    newPin();
    clearAll();
    say("A new guest PIN is set.");
    go(0);
    cool = 10;
    newBtn.disabled = true;
    const t = setInterval(() => {
      cool--;
      newBtn.textContent = cool ? "New PIN in " + cool + "s" : "New guest PIN";
      if (!cool) { clearInterval(t); newBtn.disabled = false; }
    }, 1000);
    newBtn.textContent = "New PIN in 10s";
  });

  // ---- Warm motes drifting out of the doorway ----
  const fx = $("fx");
  function motes() {
    if (reduce) return;
    const r = document.querySelector(".opening").getBoundingClientRect();
    for (let n = 0; n < 26; n++) {
      const p = document.createElement("i");
      const s = 3 + Math.random() * 5;
      p.style.width = p.style.height = s + "px";
      p.style.background = n % 3 ? "#ffe3a3" : "#fff6dc";
      p.style.boxShadow = "0 0 8px rgba(255, 210, 130, .9)";
      fx.append(p);
      const x0 = r.left + r.width * (0.62 + Math.random() * 0.34);
      const y0 = r.top + r.height * (0.25 + Math.random() * 0.6);
      const dx = 30 + Math.random() * 120;
      const dy = -40 - Math.random() * 120;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.3)", opacity: 0 },
        { transform: "translate(" + (x0 + dx * 0.4) + "px," + (y0 + dy * 0.4) + "px) scale(1)", opacity: 1, offset: 0.3 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + dy) + "px) scale(.6)", opacity: 0 }
      ], { duration: 1800 + Math.random() * 1400, delay: Math.random() * 500, easing: "cubic-bezier(.2,.6,.3,1)", fill: "both" }).onfinish = () => p.remove();
    }
  }

  // ---- Instant reset (used when a real person takes over from the demo) ----
  function hardReset() {
    gen++;
    clearTimeout(jamTimer);
    scene.classList.remove("open", "unbolted", "lever", "shut");
    lock.classList.remove("ok", "bad", "jam", "checking", "wave");
    arc.style.strokeDashoffset = "";
    againBtn.hidden = true;
    tries = 3;
    state = "idle";
    setLocked(false);
    clearAll();
    say("Enter the 6-digit PIN to unlock.");
  }

  // ---- Auto-demo: a guest taps in the PIN, the door opens, then locks again ----
  let demoOn = true;
  let demoTimer = 0;
  let round = 0;
  function stopDemo() {
    if (!demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    hardReset();                      // stops the running demo sequence and clears its digits
    mark(-1);
  }
  ["pointerdown", "keydown", "touchstart"].forEach((t) =>
    window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));

  async function tap(code, g) {
    let done = null;
    for (const d of code) {
      await pause(250, g);
      done = typeDigit(d) || done;
    }
    if (done) await done;
  }
  async function runDemo() {
    const g = gen;
    round++;
    if (round % 3 === 2) {
      // Every few rounds show the wrong-PIN state first
      const wrong = pin.slice(0, 5) + ((+pin[5] + 4) % 10);
      await tap(wrong, g);
      await pause(900, g);
    }
    await tap(pin, g);
    await pause(2300, g);
    await lockUp(g);
    newPin();
    mark(-1);
    demoTimer = setTimeout(() => quiet(runDemo()), 2600);
  }

  newPin();
  demoTimer = setTimeout(() => quiet(runDemo()), 450);
})();
</script>
</body>
</html>
