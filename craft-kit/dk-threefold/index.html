<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threefold · Spend, tax and save pots</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: soft clay (neumorphic) in mist or slate ---------- */
  :root {
    --bg: #e8ecf2; --surface: #e8ecf2; --surface-2: #dfe4ec; --panel: #eef1f6;
    --ink: #2a3142; --muted: #7a8296; --line: #d3d9e3; --grid: #d9dee7;
    --hi: rgba(255,255,255,.9); --lo: rgba(163,177,198,.65);
    --spend: #7b6cf6; --tax: #f08a5d; --save: #2bb39a; --accent: #7b6cf6; --accent-ink: #fff;
    --good: #2bb39a; --bad: #e0566b; --warn: #f08a5d;
    --radius: 24px; --radius-sm: 14px; --tip-bg: #2a3142; --tip-ink: #fff;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #23272f; --surface: #23272f; --surface-2: #1d2128; --panel: #272c35;
    --ink: #e6e9f0; --muted: #8d95a7; --line: #333945; --grid: #2c313b;
    --hi: rgba(255,255,255,.05); --lo: rgba(0,0,0,.5);
    --spend: #9d91ff; --tax: #ff9f74; --save: #4fd6bc; --accent: #9d91ff; --accent-ink: #14121f;
    --good: #4fd6bc; --bad: #ff7a8c;
    --tip-bg: #e6e9f0; --tip-ink: #23272f;
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- Neumorphic helpers ---------- */
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 "SF Pro Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .raised { box-shadow: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi); }
  .inset { box-shadow: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi); }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 22px; min-height: 100vh; padding: 20px; }
  .side { position: sticky; top: 20px; height: calc(100vh - 40px); display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; border-radius: 30px; background: var(--surface); box-shadow: 10px 10px 24px var(--lo), -10px -10px 24px var(--hi); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 1.2rem; }
  .brand svg { width: 34px; height: 34px; }
  .nav { position: relative; display: grid; gap: 6px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; color: var(--muted); text-decoration: none; font-weight: 650; transition: color .25s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--accent); }
  .nav .ic { width: 19px; height: 19px; }
  .nav .mark { position: absolute; left: 0; right: 0; top: 0; border-radius: 16px; box-shadow: inset 4px 4px 9px var(--lo), inset -4px -4px 9px var(--hi); transition: transform .5s cubic-bezier(.3,1.25,.5,1), height .3s; }
  .side-foot { margin-top: auto; padding: 14px; border-radius: 20px; box-shadow: inset 4px 4px 9px var(--lo), inset -4px -4px 9px var(--hi); font-size: .82rem; color: var(--muted); }
  .split-mini { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .split-mini i { display: block; height: 100%; transition: width .6s; }
  main { min-width: 0; overflow-x: clip; padding-bottom: 30px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; padding: 4px 4px 0; }
  .top .grow { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 0; color: var(--muted); }
  .icon-btn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 15px; border: 0; background: var(--surface); color: var(--ink); box-shadow: 5px 5px 12px var(--lo), -5px -5px 12px var(--hi); transition: box-shadow .2s, color .2s; }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn:active { box-shadow: inset 4px 4px 9px var(--lo), inset -4px -4px 9px var(--hi); }
  .icon-btn .ic { width: 20px; height: 20px; }
  .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--tax); color: #fff; font-size: .66rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
  .badge:empty { display: none; }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .menu-btn, .scrim { display: none; }
  .btn { border: 0; border-radius: 14px; background: var(--surface); box-shadow: 4px 4px 10px var(--lo), -4px -4px 10px var(--hi); }
  .btn:hover { color: var(--accent); }
  .btn:active { box-shadow: inset 3px 3px 7px var(--lo), inset -3px -3px 7px var(--hi); transform: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { color: var(--accent-ink); filter: brightness(1.06); }
  .btn.danger { background: var(--bad); color: #fff; }

function seed() {
  reseed(1331);
  const pays = [], moves = [];
  for (let m = 0; m < 9; m++) for (let i = 0; i < randi(1, 2); i++) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 8 + m, randi(1, 27)); if (d > TODAY) continue;
    const p = { id: uid(), date: iso(d), client: pick(["Bloom Studio", "Tarang Apps", "Mehr Foods", "North Pixel", "Saya Labs"]), amt: Math.round(rand(55000, 160000) / 1000) * 1000, rule: [60, 25, 15] };
    pays.push(p);
  }
  pays.sort((a, b) => (a.date < b.date ? 1 : -1));
  const outs = [];
  for (let m = 0; m < 9; m++) { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 8 + m, 1); if (d <= TODAY) outs.push({ id: uid(), date: iso(d), what: "Studio rent", cat: "Rent", amt: 35000, pot: "spend" }); }
  for (let i = 0; i < 60; i++) { const c = pick(CATS.slice(1)); outs.push({ id: uid(), date: iso(addDays(TODAY, -randi(0, 120))), what: { Rent: "Studio rent", Food: pick(["Groceries", "Lunch with client", "Dinner"]), Transport: pick(["Fuel", "Ride share"]), Bills: pick(["Electricity", "Internet"]), Tools: pick(["Design app", "Stock photos", "Hosting"]), Fun: pick(["Cinema", "Weekend trip"]), Health: pick(["Pharmacy", "Gym"]) }[c], cat: c, amt: Math.round(rand(500, 12000) / 50) * 50, pot: "spend", date: iso(addDays(TODAY, -randi(0, 250))) }); }
  outs.sort((a, b) => (a.date < b.date ? 1 : -1));
  moves.push({ id: uid(), date: iso(addDays(TODAY, -45)), from: "tax", to: "out", amt: 85000, note: "Quarterly tax paid" });
  moves.push({ id: uid(), date: iso(addDays(TODAY, -12)), from: "spend", to: "save", amt: 20000, note: "Leftover moved to savings" });
  return { v: 1, rule: [60, 25, 15], pays, outs, moves, startBal: { spend: 40000, tax: 30000, save: 220000 }, notes: [{ id: uid(), text: "North Pixel paid Rs 120,000 and it was split 60 / 25 / 15", read: false }, { id: uid(), text: "Save pot passed Rs 400,000", read: false }], profile: { name: "Ayesha Noor", work: "Illustrator" } };
}
let S = store.get(KEY, null);
if (!S || S.v !== 1 || !S.rule) S = seed();
const save = () => store.set(KEY, S);

/* ---------- Pot maths: start + splits − spending ± moves ---------- */
const share = (p, k) => Math.round((p.amt * p.rule[["spend", "tax", "save"].indexOf(k)]) / 100);
function potBal(k, upto) {
  const ok = (d) => !upto || d <= upto;
  let v = S.startBal[k] + sum(S.pays.filter((p) => ok(p.date)).map((p) => share(p, k)));
  v -= sum(S.outs.filter((o) => o.pot === k && ok(o.date)).map((o) => o.amt));
  S.moves.forEach((m) => { if (!ok(m.date)) return; if (m.from === k) v -= m.amt; if (m.to === k) v += m.amt; });
  return v;
}
const mk = (d) => { d = new Date(d); return d.getFullYear() * 12 + d.getMonth(); };
const NOWM = mk(TODAY);

}

/* Bubble size follows the square root of the balance */
function bubblesHTML(small) {
  const bals = POTS.map(([k]) => Math.max(0, potBal(k))), max = Math.max(...bals, 1), D = small ? 150 : 200;
  return `<div class="bubbles">${POTS.map(([k, name, c, i], j) => `<a class="bub" href="#/pots" data-pot="${k}" style="--c:var(${c})"><div class="ball" style="--d:${Math.round(56 + (D - 56) * Math.sqrt(bals[j] / max))}px"><div><b data-to="${bals[j]}" data-f="short">${money(0)}</b><small>${S.rule[j]}%</small></div></div><h3>${ic(i)} ${name}</h3></a>`).join("")}</div>`;
}
function popBubbles() { const bals = POTS.map(([k]) => Math.max(0, potBal(k))), max = Math.max(...bals, 1); $$(".bub").forEach((b, j) => { const ball = $(".ball", b); ball.style.setProperty("--d", Math.round(56 + 144 * Math.sqrt(bals[j] / max)) + "px"); ball.classList.remove("pop"); void ball.offsetWidth; ball.classList.add("pop"); countUp($("b", ball), bals[j], (v) => moneyShort(v), 800); }); }

/* Fork: one payment stream splitting into three, widths by share */
function forkSVG(el, amt, rule, animate = true) {
  const W = Math.max(320, el.clientWidth || 640), H = 210, sx = 110, sy = H / 2, tx = W - 150, ys = [40, H / 2, H - 40];
  const total = 46, ws = rule.map((r) => Math.max(3, (total * r) / 100));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Payment of ${money(amt)} split ${rule.join(", ")} percent"><g>`;
  s += `<path class="stream" d="M10,${sy} L${sx},${sy}" style="stroke:var(--muted);stroke-width:${total}"/>`;
  let off = -total / 2;
  POTS.forEach(([k, name, c], i) => {
    const y0 = sy + off + ws[i] / 2; off += ws[i];
    const d = `M${sx},${y0} C${sx + (tx - sx) * 0.55},${y0} ${sx + (tx - sx) * 0.45},${ys[i]} ${tx},${ys[i]}`;
    s += `<path class="stream ${animate ? "cc-draw" : ""}" pathLength="1" d="${d}" style="stroke:var(${c});stroke-width:${ws[i]};animation-delay:${200 + i * 150}ms"/><path class="dash" d="${d}"/>`;
    s += `<text x="${tx + 14}" y="${ys[i] - 2}">${name} · ${rule[i]}%</text><text class="sub" x="${tx + 14}" y="${ys[i] + 14}">${money(Math.round((amt * rule[i]) / 100))}</text>`;
  });
  s += `<text x="10" y="${sy - total / 2 - 10}">Payment</text><text class="sub" x="10" y="${sy + total / 2 + 18}">${money(amt)}</text></g></svg>`;
  el.innerHTML = s;
  if (animate && !RM) { const ds = $$(".dash", el); tween(1800, (t) => ds.forEach((d) => d.setAttribute("stroke-dashoffset", String(-t * 120)))); }
}

/* ---------- Split rule page: two handles on one bar ---------- */
let draft = null;
PAGE.split = () => {
  draft = S.rule.slice();
  view.innerHTML = `<div class="grid">
    <section class="card s12"><div class="card-h"><h2>Split rule</h2><small>drag the two handles, or focus one and use the arrow keys</small><span class="grow"></span><button class="btn" id="revert">${ic("refresh")}Undo changes</button><button class="btn primary" id="saveRule">${ic("check")}Save rule</button></div>
      <div class="tri" id="tri"><div class="segm" style="background:var(--spend)"></div><div class="segm" style="background:var(--tax)"></div><div class="segm" style="background:var(--save)"></div><button type="button" class="handle" data-h="0" role="slider" aria-label="Spend and tax boundary" aria-valuemin="0" aria-valuemax="100"></button><button type="button" class="handle" data-h="1" role="slider" aria-label="Tax and save boundary" aria-valuemin="0" aria-valuemax="100"></button></div>
      <div class="presets" role="group" aria-label="Presets">${[["Steady", [60, 25, 15]], ["Tax heavy", [55, 30, 15]], ["Saver", [50, 20, 30]], ["Lean month", [70, 20, 10]]].map(([n, r]) => `<button class="btn sm" data-preset="${r.join(",")}">${n} · ${r.join("/")}</button>`).join("")}</div>
      <div class="cc-field" style="margin-top:18px;max-width:260px"><label for="pv">Preview with a payment of (Rs)</label><input id="pv" type="number" value="100000" min="0" step="1000"></div>
      <div class="preview" id="preview" aria-live="polite"></div></section>
    <section class="card s12"><div class="card-h"><h2>How it flows</h2></div><div class="fork" id="fork2"></div></section>
  </div>`;
  const tri = $("#tri"), hs = $$(".handle", tri);
  const draw = (anim) => {
    if (!tri.isConnected) return;
    $$(".segm", tri).forEach((s, i) => { s.style.width = draft[i] + "%"; s.textContent = draft[i] >= 8 ? `${potName(["spend", "tax", "save"][i])} ${draft[i]}%` : draft[i] + "%"; });
    const a = draft[0], b = draft[0] + draft[1];
    const pad = 6, w = tri.clientWidth - pad * 2;
    hs[0].style.left = pad + (w * a) / 100 + "px"; hs[1].style.left = pad + (w * b) / 100 + "px";
    if (!tri.clientWidth) { hs[0].style.left = a + "%"; hs[1].style.left = b + "%"; }
    hs[0].setAttribute("aria-valuenow", a); hs[0].setAttribute("aria-valuetext", `Spend ${draft[0]}%, tax ${draft[1]}%`);
    hs[1].setAttribute("aria-valuenow", b); hs[1].setAttribute("aria-valuetext", `Tax ${draft[1]}%, save ${draft[2]}%`);
    const amt = parseFloat($("#pv").value) || 0;
    $("#preview").innerHTML = POTS.map(([k, n, c], i) => `<div><span class="pill"><i style="background:var(${c})"></i>${n}</span><b>${money(Math.round((amt * draft[i]) / 100))}</b><small class="muted">${draft[i]}%</small></div>`).join("");
    if (anim !== false) { clearTimeout(draw.t); draw.t = setTimeout(() => forkSVG($("#fork2"), amt, draft, false), 60); }
  };
  const setFrom = (h, pctV) => {
    pctV = clamp(Math.round(pctV), 0, 100);
    if (h === 0) { const b = draft[0] + draft[1]; const a = clamp(pctV, 0, b); draft = [a, b - a, 100 - b]; }
    else { const a = draft[0]; const b = clamp(pctV, a, 100); draft = [a, b - a, 100 - b]; }
    draw();
  };
  hs.forEach((h) => {
    const i = +h.dataset.h;
    dragify(h, { start: () => h.classList.add("drag"), move: (s, e) => { const r = tri.getBoundingClientRect(); setFrom(i, ((e.clientX - r.left - 6) / (r.width - 12)) * 100); }, end: () => h.classList.remove("drag") });
    h.addEventListener("keydown", (e) => { const step = e.shiftKey || e.key.startsWith("Page") ? 5 : 1, cur = i === 0 ? draft[0] : draft[0] + draft[1]; if (e.key === "ArrowLeft" || e.key === "ArrowDown" || e.key === "PageDown") { setFrom(i, cur - step); e.preventDefault(); } if (e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "PageUp") { setFrom(i, cur + step); e.preventDefault(); } });
  });
  $("#pv").addEventListener("input", () => draw());
  $$("[data-preset]").forEach((b) => b.addEventListener("click", () => { const from = draft.slice(), to = b.dataset.preset.split(",").map(Number); tween(500, (t) => { const r = from.map((v, i) => Math.round(lerp(v, to[i], t))); r[2] = 100 - r[0] - r[1]; draft = r; draw(t === 1); }); }));
  $("#revert").addEventListener("click", () => { draft = S.rule.slice(); draw(); toast("Back to your saved rule"); });

  draw();
  forkSVG($("#fork2"), 100000, draft);
  splitDraw = draw;
};

function payForm(row) {
  formModal({
    title: row ? "Edit payment" : "New payment", values: row ? { ...row } : { date: iso(TODAY) },
    intro: row ? "" : `It splits <b>${S.rule.join(" / ")}</b> into Spend, Tax and Save.`,
    fields: [{ name: "client", label: "Client", required: true }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 100, half: true }, { name: "date", label: "Date", type: "date", required: true, half: true, check: (v) => (new Date(v) > TODAY ? "Cannot be in the future" : "") }],
    submit: row ? "Save" : "Add and split",

        rerender();
      }, 280);
    },
  });
}

    <div class="card kpi s4"><div class="lbl">${ic("in")}Came in (all time)</div><div class="val" data-to="${sum(S.pays.map((p) => share(p, potSel))) + sum(S.moves.filter((m) => m.to === potSel).map((m) => m.amt))}">${money(0)}</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("out")}Went out</div><div class="val" data-to="${sum(S.outs.filter((o) => o.pot === potSel).map((o) => o.amt)) + sum(S.moves.filter((m) => m.from === potSel).map((m) => m.amt))}">${money(0)}</div></div>
    <section class="card s8"><div class="card-h"><h2>${potName(potSel)} pot over time</h2></div><div id="potLine"></div></section>
    <section class="card s4"><div class="card-h"><h2>Actions</h2></div><div style="display:grid;gap:10px"><button class="btn primary" id="mv">${ic("swap")}Move between pots</button>${potSel === "tax" ? `<button class="btn" id="payTax">${ic("check")}Pay a tax bill</button>` : potSel === "spend" ? `<button class="btn" id="spendBtn">${ic("out")}Record spending</button>` : `<button class="btn" id="interest">${ic("leaf")}Add interest</button>`}</div></section>
    <section class="card s12"><div class="card-h"><h2>Moves</h2></div><div id="mvTbl"></div></section>
  </div>`;
  lineChart($("#potLine"), { labels: days.map(fdate), area: true, height: 220, series: [{ name: potName(potSel), data: days.map((d) => potBal(potSel, iso(d))), color: potCol(potSel) }], tipFmt: (v) => money(v) });
  $$("[data-p]").forEach((b) => b.addEventListener("click", () => { potSel = b.dataset.p; render("pots"); }));
  $("#mv").addEventListener("click", moveForm);
  const pt = $("#payTax"), sb = $("#spendBtn"), it = $("#interest");
  if (pt) pt.addEventListener("click", () => formModal({ title: "Pay tax from the Tax pot", values: { note: "Quarterly tax" }, fields: [{ name: "note", label: "What", required: true }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1, max: Math.max(1, potBal("tax")) }], submit: "Pay", onSubmit: (v) => { S.moves.push({ id: uid(), date: iso(TODAY), from: "tax", to: "out", amt: v.amt, note: v.note }); save(); toast("Tax paid from its pot. Stress-free."); rerender(); } }));
  if (sb) sb.addEventListener("click", () => spendForm());
  if (it) it.addEventListener("click", () => formModal({ title: "Add interest", fields: [{ name: "amt", label: "Interest earned (Rs)", type: "number", required: true, min: 1 }], onSubmit: (v) => { S.moves.push({ id: uid(), date: iso(TODAY), from: "in", to: "save", amt: v.amt, note: "Interest" }); save(); toast("Interest added"); rerender(); } }));
  dataTable($("#mvTbl"), { rows: () => S.moves.filter((m) => m.from === potSel || m.to === potSel).map((m) => ({ ...m, signed: m.to === potSel ? m.amt : -m.amt, _m: m })), sort: "date", search: false, size: 6, cols: [{ k: "date", label: "Date", f: (v) => fdateY(v) }, { k: "note", label: "Note" }, { k: "from", label: "From", f: (v) => (v === "in" ? "Outside" : potName(v)) }, { k: "to", label: "To", f: (v) => (v === "out" ? "Paid out" : potName(v)) }, { k: "signed", label: "Amount", cls: "r", f: (v) => `<b style="color:${v >= 0 ? "var(--good)" : "var(--bad)"}">${money(v, { plus: true })}</b>` }, { k: "x", label: "", sort: false, f: () => `<div class="rowbtns"><button data-act="del" aria-label="Undo move">${ic("trash")}</button></div>` }], onAct: (a, r) => confirmBox("Undo this move?", "Undo").then((ok) => { if (ok) { S.moves = S.moves.filter((m) => m !== r._m); save(); toast("Move undone"); rerender(); } }), empty: "No moves for this pot", emptyIcon: "swap" });
};
function moveForm() {
  const opts = POTS.map(([k, n]) => [k, `${n} · ${moneyShort(potBal(k))}`]);
  formModal({ title: "Move between pots", values: { from: "spend", to: "save", note: "" }, fields: [{ name: "from", label: "From", type: "select", options: opts, half: true }, { name: "to", label: "To", type: "select", options: opts, half: true, check: (v, a) => (v === a.from ? "Pick another pot" : "") }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1, check: (v, a) => (v > potBal(a.from) ? `${potName(a.from)} has ${money(potBal(a.from))}` : "") }, { name: "note", label: "Note" }], submit: "Move", onSubmit: (v) => { S.moves.push({ id: uid(), date: iso(TODAY), ...v, note: v.note || "Moved" }); save(); toast(`${money(v.amt)} moved to ${potName(v.to)}`); if (current === "home") { popBubbles(); } else rerender(); } });
}

/* ---------- Spending (from the Spend pot) ---------- */
function spendForm(row) {
  formModal({ title: row ? "Edit spending" : "Record spending", drawer: true, values: row || { date: iso(TODAY), cat: "Food" }, fields: [{ name: "what", label: "What", required: true }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1, half: true, check: (v) => (!row && v > potBal("spend") ? `The Spend pot has ${money(potBal("spend"))}` : "") }, { name: "date", label: "Date", type: "date", required: true, half: true }, { name: "cat", label: "Category", type: "select", options: CATS }], submit: row ? "Save" : "Add", onSubmit: (v) => { if (row) Object.assign(row, v); else S.outs.unshift({ id: uid(), pot: "spend", ...v }); S.outs.sort((a, b) => (a.date < b.date ? 1 : -1)); save(); toast(row ? "Updated" : `Paid from Spend. ${money(potBal("spend"))} left`); rerender(); } });
}
PAGE.spending = () => {
  const thisM = S.outs.filter((o) => mk(o.date) === NOWM), cats = CATS.map((c, i) => ({ label: c, value: sum(thisM.filter((o) => o.cat === c).map((o) => o.amt)), color: ["#7b6cf6", "#2bb39a", "#f08a5d", "#e0566b", "#5aa9e6", "#c58df0", "#8bc34a"][i] }));
  view.innerHTML = `<div class="grid">
    <div class="card kpi s4"><div class="lbl">${ic("wallet")}Left in Spend</div><div class="val" data-to="${potBal("spend")}">${money(0)}</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("out")}Spent this month</div><div class="val" data-to="${sum(thisM.map((o) => o.amt))}">${money(0)}</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("calendar")}Per day left</div><div class="val" data-to="${potBal("spend") / Math.max(1, new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate() - TODAY.getDate() + 1)}">${money(0)}</div></div>
    <section class="card s5"><div class="card-h"><h2>This month</h2></div><div id="spDonut"></div></section>
    <section class="card s7"><div class="card-h"><h2>Spending</h2><span class="grow"></span><button class="btn primary" id="addSp">${ic("plus")}Add</button></div><div id="spTbl"></div></section>
  </div>`;
  donut($("#spDonut"), { items: cats, size: 170, center: [moneyShort(sum(cats.map((c) => c.value))), "spent"], fmt: (v) => money(v) });
  $("#addSp").addEventListener("click", () => spendForm());
  dataTable($("#spTbl"), { rows: () => S.outs, sort: "date", size: 7, search: "Search…", keys: ["what", "cat"], chips: { k: "cat", values: ["All"].concat(CATS) }, cols: [{ k: "date", label: "Date", f: (v) => fdate(v) }, { k: "what", label: "What" }, { k: "cat", label: "Category" }, { k: "amt", label: "Amount", cls: "r", f: (v) => money(-v) }, { k: "x", label: "", sort: false, f: () => `<div class="rowbtns"><button data-act="edit" aria-label="Edit">${ic("edit")}</button><button data-act="del" aria-label="Delete">${ic("trash")}</button></div>` }], onAct: (a, r) => { if (a === "edit") spendForm(r); else confirmBox(`Delete "${r.what}"? ${money(r.amt)} goes back into Spend.`).then((ok) => { if (ok) { S.outs = S.outs.filter((o) => o !== r); save(); toast("Deleted"); rerender(); } }); }, onRow: (r) => spendForm(r) });
};

/* ---------- Reports ---------- */
let repR = "6M";
PAGE.reports = () => {
  view.innerHTML = `<div class="grid">
    <section class="card s12"><div class="card-h"><h2>Pot balances</h2><span class="grow"></span><div class="seg" role="group" aria-label="Range">${["3M", "6M", "9M"].map((r) => `<button type="button" data-r="${r}" aria-pressed="${r === repR}">${r}</button>`).join("")}</div></div><div id="repLine"></div></section>
    <section class="card s6"><div class="card-h"><h2>Savings rate</h2><small>share of income kept in Save</small></div><div id="rateG"></div></section>
    <section class="card s6"><div class="card-h"><h2>Tax readiness</h2><small>Tax pot vs a 20% estimate</small></div><div id="taxG"></div></section>
  </div>`;
  const draw = (m) => { const n = { "3M": 6, "6M": 12, "9M": 18 }[repR], pts = Array.from({ length: n }, (_, i) => addDays(TODAY, -(n - 1 - i) * 15)); lineChart($("#repLine"), { labels: pts.map(fdate), height: 250, series: POTS.map(([k, name, c]) => ({ name, data: pts.map((d) => potBal(k, iso(d))), color: `var(${c})` })), tipFmt: (v) => money(v) }, m); };
  draw(false);
  $$("[data-r]", view).forEach((b) => b.addEventListener("click", () => { repR = b.dataset.r; $$("[data-r]", view).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); draw(true); }));
  const earned = sum(S.pays.map((p) => p.amt)) || 1, saved = sum(S.pays.map((p) => share(p, "save"))), taxNeed = earned * 0.2, taxHave = potBal("tax") + sum(S.moves.filter((m) => m.from === "tax" && m.to === "out").map((m) => m.amt));
  gauge($("#rateG"), { value: (saved / earned) * 100, max: 50, color: "var(--save)", label: "saved", fmt: () => Math.round((saved / earned) * 100) + "%", tip: money(saved) + " of " + money(earned), size: 230 });
  gauge($("#taxG"), { value: Math.min(100, (taxHave / taxNeed) * 100), max: 100, color: "var(--tax)", label: "covered", fmt: () => Math.round((taxHave / taxNeed) * 100) + "%", tip: money(taxHave) + " set aside or paid", size: 230 });
};

/* ---------- Settings ---------- */
PAGE.settings = () => {
  view.innerHTML = `<div class="grid"><section class="card s12">
    <div class="set-row"><div><b>Profile</b><small>${esc(S.profile.name)} · ${esc(S.profile.work)}</small></div><button class="btn" id="prof">${ic("user")}Edit</button></div>
    <div class="set-row"><div><b>Split rule</b><small>${S.rule.join(" / ")} · spend / tax / save</small></div><a class="btn" href="#/split" style="text-decoration:none">${ic("sliders")}Change</a></div>
    <div class="set-row"><div><b>Starting balances</b><small>Spend ${money(S.startBal.spend)} · Tax ${money(S.startBal.tax)} · Save ${money(S.startBal.save)}</small></div><button class="btn" id="startB">${ic("edit")}Edit</button></div>
    <div class="set-row"><div><b>Theme</b><small>Soft mist or slate</small></div><button class="btn" data-theme-toggle>${ic("moon")}Toggle theme</button></div>
    <div class="set-row"><div><b>Reset demo data</b><small>Payments, pots, rule and spending</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div></section></div>`;
  $("#prof").addEventListener("click", () => formModal({ title: "Profile", values: S.profile, fields: [{ name: "name", label: "Name", required: true }, { name: "work", label: "What you do", required: true }], onSubmit: (v) => { S.profile = v; save(); toast("Saved"); rerender(); } }));
  $("#startB").addEventListener("click", () => formModal({ title: "Starting balances", values: S.startBal, fields: POTS.map(([k, n]) => ({ name: k, label: n + " (Rs)", type: "number", required: true, min: 0 })), onSubmit: (v) => { S.startBal = v; save(); toast("Saved"); rerender(); } }));
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data?", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); save(); drawBell(); toast("Demo data reset"); rerender(); } }));
};

/* ---------- Start ---------- */
drawBell();
initShell(() => pageCmds(PAGES, [{ label: "New payment", icon: "plus", run: () => payForm() }, { label: "Move between pots", icon: "swap", run: moveForm }, { label: "Record spending", icon: "out", run: () => spendForm() }]));
startRouter(PAGES.map((p) => p[0]), "home", render);
</script>
</body>
</html>
