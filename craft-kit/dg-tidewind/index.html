<head>

<title>Tidewind · Offshore wind operations</title>
<style>
/* ---------- Tidewind look: control room teal, cyan and lime, sharp and technical ---------- */
:root{--font:"Segoe UI",system-ui,-apple-system,Roboto,Ubuntu,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
--bg:#e9f0f3;--bg2:#dfe8ec;--panel:#ffffff;--panel-solid:#ffffff;--field:#f3f7f9;--text:#0a2430;--muted:#5a7480;--line:#d3e0e6;--grid:#e3ecf0;--accent:#0a8f87;--accent-ink:#ffffff;--focus:#0a8f87;
--good:#139e6a;--warn:#d98b00;--bad:#d93a52;--c1:#0a8f87;--c2:#6d9a00;--c3:#d98b00;--c4:#d93a52;--c5:#6b5bd6;--c6:#8aa0aa;
--r:4px;--rb:3px;--tip-bg:#0a2430;--hover:rgba(10,143,135,.08);--sea1:#cfe6ee;--sea2:#b9dbe7;--land:#e4dcc8;--land2:#d3c9b0;--wave:rgba(255,255,255,.55);--enter-anim:tw-wipe}
[data-theme=dark]{--bg:#03121a;--bg2:#061e29;--panel:rgba(7,30,41,.78);--panel-solid:#082230;--field:#05202b;--text:#d6f1f4;--muted:#7a9ea8;--line:rgba(46,230,214,.15);--grid:rgba(46,230,214,.06);--accent:#2ee6d6;--accent-ink:#02201f;--focus:#2ee6d6;
--good:#4be39a;--warn:#ffb547;--bad:#ff5d73;--c1:#2ee6d6;--c2:#c4f04d;--c3:#ffb547;--c4:#ff5d73;--c5:#9d8cff;--c6:#6f8f99;--tip-bg:#000;--hover:rgba(46,230,214,.08);--sea1:#05293a;--sea2:#031c28;--land:#18262a;--land2:#223338;--wave:rgba(46,230,214,.18)}
/* ---------- Core UI: shared structure. Each app sets its own look with the variables above. ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.55em .95em;border-radius:var(--rb,var(--r));font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .12s,background-color .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active,.ibtn:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.35em .7em;font-size:.78rem}
.btn .ic{width:16px;height:16px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,var(--r));border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s,border-color .2s,background-color .2s;position:relative;flex:none}
.ibtn:hover{border-color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:15px;height:15px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--panel)}
.badge[hidden]{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:.18em .62em;border-radius:99px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h,200) 55% 48%);color:#fff;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
/* staggered page entrance */
.enter{animation:var(--enter-anim,c-rise) .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes c-rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes c-fade{from{opacity:0}}
@keyframes c-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes c-land{0%{transform:scale(1.06)}100%{transform:none}}
.landed{animation:c-land .35s cubic-bezier(.2,.8,.2,1)}
/* tooltip */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;left:0;top:0}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{width:8px;height:8px;border-radius:2px;background:var(--sw)}
.tip .tr span{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
/* modal, drawer, command search */
.ovl{position:fixed;inset:0;z-index:60;background:var(--scrim,rgba(8,10,16,.52));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s}
.ovl.on{opacity:1}
.modal,.drawer,.cmdk{background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal{border-radius:calc(var(--r) + 4px);width:min(540px,100%);max-height:calc(100dvh - 32px);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(780px,100%)}
.modal.small{width:min(420px,100%)}
.ovl.on .modal,.ovl.on .cmdk{transform:none}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;border-width:0 0 0 1px;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ovl.on .drawer{transform:none}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:1.05rem}
.l-body{padding:18px;overflow:auto;flex:1;min-height:0}
.l-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf-msg{color:var(--muted)}
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);border-radius:calc(var(--r) + 4px);transform:translateY(-10px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.cmdk .l-head{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.cmdk .l-body{padding:0}
.ck-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:calc(var(--r) - 2px);text-align:left}
.cmdk li small{color:var(--muted)}
.cmdk li[aria-selected=true] button{background:var(--hover,color-mix(in srgb,var(--accent) 14%,transparent))}
.cmdk .empty{padding:20px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field,var(--bg));border-radius:var(--rb,var(--r));padding:.6em .7em;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.fld textarea{resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:c-shake .3s}
.fld .err{color:var(--bad);font-size:.74rem;font-weight:600}
.fld .err:empty{display:none}
@keyframes c-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent)}
/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar-x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar-x:empty{display:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:0 .65em;background:var(--field,var(--bg));flex:1 1 180px;max-width:300px;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:.55em 0;outline:none;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.32em .8em;font-size:.78rem;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip em{font-style:normal;opacity:.7;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th>button,.tbl th>.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%}
.tbl th>.th{cursor:default}
.tbl th>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th.n>button,.tbl th.n>.th{justify-content:flex-end}
.tbl .si{width:0;height:0;border:4px solid transparent;opacity:.25;border-top-color:currentColor;margin-top:4px}
.tbl th[aria-sort=ascending] .si{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px;opacity:1}
.tbl th[aria-sort=descending] .si{opacity:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl tbody tr[data-id]{cursor:pointer;transition:background-color .15s}
.tbl tbody tr[data-id]:hover{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-u{display:flex;align-items:center;gap:9px}
.cell-u small{display:block;color:var(--muted);font-size:.74rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pager .pg-btns{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:600}
/* popovers: bell and menus */
.pop{position:fixed;z-index:75;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);min-width:190px;max-width:min(350px,calc(100vw - 24px));padding:6px;animation:c-pop .18s ease both}
.pop .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r) - 2px);gap:8px;align-items:center;font-size:.86rem}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 12%,transparent));outline:none}
.bell-pop{width:340px;padding:0}
.bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-l{max-height:340px;overflow:auto;padding:6px}
.bell-i{display:flex;gap:10px;padding:9px 8px;border-radius:calc(var(--r) - 2px);font-size:.84rem}
.bell-i small{display:block;color:var(--muted);font-size:.74rem}
.bell-i.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-i .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.bell-i .dot.warn{background:var(--warn)}.bell-i .dot.bad{background:var(--bad)}.bell-i .dot.ok{background:var(--good)}
/* toasts */
.toasts{position:fixed;z-index:98;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--tip-bg,#16181d);color:var(--tip-ink,#fff);padding:11px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:c-toast .38s cubic-bezier(.2,.8,.2,1) both;font-size:.86rem;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(16px)}
.toast>i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.toast.warn>i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.toast.bad>i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.toast .btn{margin-left:auto;color:inherit;border-color:rgba(255,255,255,.3);background:transparent}
@keyframes c-toast{from{opacity:0;transform:translateY(14px) scale(.96)}}
/* segmented range switch */
.segc{display:inline-flex;position:relative;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:3px;background:var(--field,var(--bg));flex:none}
.segc button{position:relative;z-index:1;border:0;background:transparent;padding:.32em .75em;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:calc(var(--rb,var(--r)) - 2px);transition:color .25s}
.segc button[aria-pressed=true]{color:var(--accent-ink,#fff)}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--rb,var(--r)) - 2px);background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--muted);font-size:10.5px;font-family:var(--font-chart,inherit)}
.ax line{stroke:var(--grid,var(--line));stroke-dasharray:2 4}
.ax .base{stroke-dasharray:none}
.ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:c-draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.fadein{animation:c-fade .9s .3s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:c-grow .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes c-grow{from{transform:scaleY(0)}}
.dim .bar{opacity:.35}.dim .bar.hl{opacity:1}
.sweep{animation:c-sweep 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes c-sweep{from{stroke-dasharray:0 9999}}
.arc{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:auto;flex:none}
.d-c{font-weight:800;fill:var(--text)}.d-l{fill:var(--muted);font-size:11px}
.dleg{display:grid;gap:7px;flex:1;min-width:150px;font-size:.82rem}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;background:var(--sw);flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dleg small{color:var(--muted);width:3.2em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sw)}
.legend i.dash{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sw) 0 4px,transparent 4px 7px)}
.hl-g{opacity:0;transition:opacity .15s;pointer-events:none}
.hl-g line{stroke:var(--muted);stroke-dasharray:3 3}
.hl-g circle{stroke:var(--panel-solid,var(--panel));stroke-width:2}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.hb-t{height:9px;border-radius:9px;background:var(--track,color-mix(in srgb,var(--text) 8%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes c-w{from{width:0}}
.hb b{font-variant-numeric:tabular-nums}
.hm rect{transition:opacity .2s}
.hm .cell{animation:c-fade .5s both}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col-bg,color-mix(in srgb,var(--text) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background-color .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:10px;flex-wrap:wrap}
.kcol-h i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.kcol-h small{margin-left:auto;color:var(--muted);font-weight:600}
.kc-n{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none;position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.kc-f{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.kc-f .ibtn{width:26px;height:26px}
.grip{touch-action:none;cursor:grab}
.k-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:calc(var(--r) - 2px)}
.drop-on{outline-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:85;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.32);transition:none!important;opacity:.95}
body.is-dragging{cursor:grabbing;user-select:none}
/* month calendar */
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

.mc-d{background:var(--panel-solid,var(--panel));min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.mc-d.out{background:color-mix(in srgb,var(--panel-solid,var(--panel)) 80%,var(--bg))}
.mc-d.out .mc-n{opacity:.4}
.mc-n{border:0;background:transparent;font-size:.74rem;font-weight:700;width:24px;height:24px;border-radius:50%;padding:0}
.mc-d.today .mc-n{background:var(--accent);color:var(--accent-ink,#fff)}
.mc-e{font-size:.7rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--text);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none}
.mc-more{border:0;background:transparent;font-size:.68rem;color:var(--muted);text-align:left;padding:0 4px}
@media (max-width:640px){.mc-d{min-height:64px}.mc-e{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--ec)}}
@media (max-width:540px){.form{grid-template-columns:1fr}.l-body{padding:14px}.toasts{right:12px;left:12px;bottom:12px;max-width:none}}
/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

.nav{position:relative;display:flex;flex-direction:column;padding:8px 0;flex:1;overflow-y:auto}

.sea{fill:url(#seaG)}
.waves path{fill:none;stroke:var(--wave);stroke-width:1.2;stroke-linecap:round;animation:tw-wave 7s linear infinite}

.landp{fill:var(--land);stroke:var(--land2);stroke-width:2}
.port text,.oss text,.compass text{font:700 9px var(--mono);fill:var(--muted);letter-spacing:.08em}
.cable{fill:none;stroke:color-mix(in srgb,var(--accent) 45%,transparent);stroke-width:1.4}

.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.alist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:3px;font-size:.8rem;cursor:pointer;animation:tw-in .4s cubic-bezier(.2,.8,.2,1)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vc .vbar{height:5px;background:var(--grid);border-radius:2px;overflow:hidden;margin-top:4px}
.vc .vbar i{display:block;height:100%;width:var(--w);background:var(--bc,var(--accent));transition:width 1s}
.vc dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.78rem;margin:10px 0}
.vc dt{color:var(--muted);font-family:var(--mono);font-size:.68rem;text-transform:uppercase}

.big{font:700 2.2rem var(--mono);letter-spacing:-.03em}
.price{display:flex;align-items:baseline;gap:10px}
.price .delta{font:700 .8rem var(--mono)}
.flash-up{animation:tw-fu .6s}.flash-dn{animation:tw-fd .6s}
@keyframes tw-fu{0%{color:var(--good)}}
@keyframes tw-fd{0%{color:var(--bad)}}
.dsec{margin-top:16px}
.dsec h3{font:700 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.minilist{list-style:none;margin:0;padding:0;font-size:.82rem}
.minilist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ctl{display:grid;gap:10px}
.slider{display:grid;gap:4px}
.slider label{display:flex;justify-content:space-between;font:700 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* ---------- responsive ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-31,.g-21{grid-template-columns:minmax(0,1fr)}.ticker .t3{display:none}}
@media (max-width:860px){.rail{transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);width:92px}body.nav-open .rail{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.4)}body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}.main{margin-left:0}.menu-btn{display:grid}.ticker .t2{display:none}.g-2{grid-template-columns:minmax(0,1fr)}}

<script>
/* ================= Core helpers (shared by every page of this app) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
let RM = mqRM.matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
let NS = 'craft:';
let APPNAME = 'App';

/* --- seeded random, so the demo data is the same on every load --- */
let _s = 1;
const seed = n => { _s = (n >>> 0) || 1; };
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Number.isNaN(+v) ? a : Math.max(a, Math.min(b, v));
/* every number written into SVG goes through fin/fx, so NaN or Infinity can never reach an attribute */
const fin = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const fx = (v, p = 1) => fin(v).toFixed(p);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const lerp = (a, b, t) => a + (b - a) * t;
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 8);

/* --- number, money and date formatting --- */
const fmt = (n, d = 0) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const short = (n, d = 1) => { n = +n || 0; const a = Math.abs(n), s = n < 0 ? '-' : ''; const f = (v, u) => s + v.toFixed(d).replace(/\.0+$/, '') + u; return a >= 1e9 ? f(a / 1e9, 'B') : a >= 1e6 ? f(a / 1e6, 'M') : a >= 1e3 ? f(a / 1e3, 'K') : s + fmt(a, a < 10 && a % 1 ? 1 : 0); };
let CUR = 'Rs ';
const money = (n, d = 0) => (n < 0 ? '-' : '') + CUR + fmt(Math.abs(n), d);
const moneyS = n => (n < 0 ? '-' : '') + CUR + short(Math.abs(n));
const pct = (n, d = 0) => fmt(n, d) + '%';
const FMT = { fmt: v => fmt(v), money: v => money(v), moneyS: v => moneyS(v), short: v => short(v), pct: v => pct(v), pct1: v => pct(v, 1), dec1: v => fmt(v, 1), dec2: v => fmt(v, 2) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY = 864e5;
const NOW = new Date(); NOW.setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fd = d => MON[d.getMonth()] + ' ' + d.getDate();
const fdy = d => fd(d) + ', ' + d.getFullYear();
const fdl = d => DAYN[d.getDay()] + ', ' + fd(d);
const ftime = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const ago = d => { const s = Math.max(0, (Date.now() - d) / 1000); return s < 50 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const lastMonths = n => Array.from({ length: n }, (_, i) => { const d = new Date(NOW.getFullYear(), NOW.getMonth() - n + 1 + i, 1); return MON[d.getMonth()]; });
const lastDays = n => Array.from({ length: n }, (_, i) => fd(addDays(NOW, i - n + 1)));
/* smooth random walk for demo series */
const walk = (n, start, vol, drift = 0, min = 0) => { let v = start; return Array.from({ length: n }, () => { v = Math.max(min, v * (1 + drift) + (rnd() - .5) * vol); return Math.round(v * 100) / 100; }); };

/* --- invented people and places --- */
const FN = ['Ayesha', 'Bilal', 'Hamza', 'Sana', 'Usman', 'Fatima', 'Ali', 'Zainab', 'Omar', 'Hira', 'Danish', 'Mehwish', 'Kamran', 'Iqra', 'Faisal', 'Noor', 'Saad', 'Amna', 'Tariq', 'Rabia', 'Imran', 'Mahnoor', 'Junaid', 'Sadia', 'Asad', 'Maryam', 'Waqas', 'Hafsa', 'Yasir', 'Komal'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Butt', 'Sheikh', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Abbasi', 'Mirza', 'Javed', 'Akhtar', 'Baig', 'Farooq', 'Iqbal', 'Anwar', 'Shah', 'Riaz', 'Aslam'];

/* turbine drawer: live power, start or stop, curtail, reset a fault */
function openTurbine(t) {
  const L = drawer({ title: 'Turbine ' + t.id, body: `<div data-hd></div><div class="dsec"><h3>Power, last 60 seconds</h3><div class="chart" data-ch></div></div><div class="dsec ctl"><h3>Control</h3><div class="slider"><label for="cap">Power limit <output data-co>${t.cap}%</output></label><input type="range" id="cap" min="0" max="100" step="5" value="${t.cap}"></div><div style="display:flex;gap:8px;flex-wrap:wrap" data-btns></div></div><div class="dsec"><h3>Open work orders</h3><ul class="minilist">${DB.wo.filter(w => w.tur === t.id && w.stage !== 'Done').map(w => `<li><span class="mono">${w.id}</span><span>${esc(w.name)}</span>${tagS(w.stage)}</li>`).join('') || '<li>None</li>'}</ul></div>`, foot: `<button class="btn" type="button" data-wo>${ic('tool')}New work order</button>` });
  const hd = () => { $('[data-hd]', L.el).innerHTML = `${tagS(t.status)} ${t.fault ? `<span class="sev" style="--ac:var(--bad)">${t.fault}</span>` : ''}<dl class="dl" style="margin-top:12px"><dt>Power</dt><dd>${fmt(t.kw / 1000, 2)} MW</dd><dt>Wind at hub</dt><dd>${fmt(t.ws, 1)} m/s</dd><dt>Rotor</dt><dd>${fmt(t.rpm, 1)} rpm</dd><dt>Gearbox oil</dt><dd>${fmt(t.gbx, 1)} °C</dd><dt>Availability, 30 days</dt><dd>${t.avail}%</dd><dt>Run hours</dt><dd>${fmt(t.hours)}</dd></dl>`; $('[data-btns]', L.el).innerHTML = t.status === 'Fault' ? `<button class="btn pri" type="button" data-reset>${ic('refresh')}Reset fault</button>` : t.status === 'Maintenance' ? `<button class="btn pri" type="button" data-rel>${ic('check')}Release from maintenance</button>` : `<button class="btn${t.status === 'Stopped' ? ' pri' : ''}" type="button" data-ss>${t.status === 'Stopped' ? ic('play') + 'Start' : ic('pause') + 'Stop'}</button><button class="btn" type="button" data-mx>${ic('tool')}Lock for maintenance</button>`; };
  const ch = () => lineChart($('[data-ch]', L.el), { labels: t.hist.map((_, i) => (i - t.hist.length + 1) + 's'), series: [{ name: 'Power', data: t.hist.map(x => x / 1000), color: 'var(--c1)' }], h: 140, anim: false, yfmt: x => fmt(x, 1), tfmt: x => fmt(x, 2) + ' MW', xw: 70, max: 8 });
  hd(); ch();
  L.el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.matches('[data-ss]')) { t.status = t.status === 'Stopped' ? (t.cap < 100 ? 'Curtailed' : 'Running') : 'Stopped'; toast(`${t.id} ${t.status === 'Stopped' ? 'stopped' : 'started'}`); }
    else if (b.matches('[data-mx]')) { t.status = 'Maintenance'; toast(`${t.id} locked out for maintenance`, 'warn'); }
    else if (b.matches('[data-rel]')) { t.status = 'Running'; toast(`${t.id} released and running`); }
    else if (b.matches('[data-reset]')) { b.disabled = true; b.textContent = 'Resetting…'; setTimeout(() => { if (rnd() < .85) { t.status = t.cap < 100 ? 'Curtailed' : 'Running'; t.fault = null; DB.alarms.filter(a => a.tur === t.id && a.state !== 'Cleared').forEach(a => a.state = 'Cleared'); Bell.add(`${t.id} back online`, 'Fault reset from the control room', 'ok'); } else toast(`${t.id} did not come back. Send a crew.`, 'bad'); hd(); }, RM ? 300 : 2200); return; }
    else return; hd();
  });
  $('#cap', L.el).addEventListener('input', e => { t.cap = +e.target.value; $('[data-co]', L.el).textContent = t.cap + '%'; if (t.status === 'Running' && t.cap < 100) t.status = 'Curtailed'; else if (t.status === 'Curtailed' && t.cap === 100) t.status = 'Running'; });
  $('#cap', L.el).addEventListener('change', () => { toast(`${t.id} limited to ${t.cap}%`); hd(); });
  $('[data-wo]', L.el).onclick = () => { L.close(); woModal({ tur: t.id }); };
  const tm = every(1000, () => { hd(); ch(); }); const oc = L.close; L.close = x => { stopTimer(tm); oc(x); };
}
function woModal(w) {
  const F = [{ k: 'tur', label: 'Turbine', type: 'select', options: DB.t.map(t => t.id) }, { k: 'name', label: 'Job', req: true, full: true }, { k: 'type', label: 'Type', type: 'select', options: ['Corrective', 'Service', 'Inspection'] }, { k: 'stage', label: 'Stage', type: 'select', options: ['Planned', 'Weather wait', 'On site', 'Done'] }, { k: 'crew', label: 'Technicians', type: 'number', min: 1, max: 6, req: true, def: 2 }, { k: 'vessel', label: 'Vessel', type: 'select', options: VESSELS.map(v => v[0]) }, { k: 'due', label: 'Due', type: 'date', req: true, def: dkey(addDays(NOW, 2)) }, { k: 'hrs', label: 'Hours of work', type: 'number', min: 1, max: 200, req: true, def: 8 }];
  formModal({ title: w && w.id ? 'Edit ' + w.id : 'New work order', fields: F, values: w || {}, wide: true, submit: w && w.id ? 'Save' : 'Create', onSubmit: x => { if (w && w.id) { Object.assign(w, x); toast(w.id + ' updated'); } else { DB.wo.unshift({ id: 'WO-' + (DB.seq.wo++), ...x }); toast('Work order created'); } redo(); } });
}

page('ops', 'Operations', v => {

  v.innerHTML = pageHead('Operations', `${DB.set.name} · live at ${ftime(new Date())} · ${online()} of 48 turbines generating`, `<button class="btn" type="button" data-lbl aria-pressed="false">${ic('list')}Labels</button><button class="btn pri" type="button" data-newwo>${ic('plus')}Work order</button>`)
    + `<section class="kpis"><div class="kpi card"><span class="k-i">${ic('bolt')}</span><span class="k-l">Farm output</span><b class="k-v" id="k-mw">${fmt(mw, 1)}</b><span class="k-n">MW of 384 installed</span><div class="k-sp chart" id="sp-mw"></div></div><div class="kpi card"><span class="k-i">${ic('wind')}</span><span class="k-l">Hub wind</span><b class="k-v" id="k-ws">${fmt(DB.wind, 1)}</b><span class="k-n" id="k-dir">m/s from ${Math.round(DB.dir)}°</span></div><div class="kpi card"><span class="k-i">${ic('chart')}</span><span class="k-l">Capacity factor now</span><b class="k-v" id="k-cf">${pct(mw / 384 * 100, 1)}</b><span class="k-n">target 46% this month</span></div><div class="kpi card"><span class="k-i">${ic('check')}</span><span class="k-l">Turbines online</span><b class="k-v" id="k-on">${online()}/48</b><span class="k-n" id="k-off"></span></div></section>
    <div class="g g-31"><section class="card map-card"><div class="card-h" style="padding:4px 6px 0"><h2>Array map · live</h2><small id="map-n"></small></div><div id="map">${mapSVG()}</div><div class="map-leg">${Object.entries(STC).map(([k, c]) => `<span><i style="--sc:${c}"></i>${k}</span>`).join('')}<span class="sw">Click a turbine to control it</span></div></section>
    <section class="card"><div class="card-h"><h2>Live alarms</h2><a class="btn sm" href="#/alarms">Log</a></div><ul class="alist" id="al" aria-live="polite"></ul></section></div>
    <div class="g g-21"><section class="card"><div class="card-h"><h2>Output vs forecast</h2><div id="rg"></div></div><div class="chart" id="oc"></div></section><section class="card"><div class="card-h"><h2>Power by row</h2><small>MW now</small></div><div id="rows"></div></section></div>`;
  const mp = $('#map', v);
  paintMap(mp);
  const drawAl = () => { $('#al', v).innerHTML = DB.alarms.filter(a => a.state !== 'Cleared').slice(0, 8).map(a => `<li style="--ac:${sevC(a.sev)}" data-al="${a.id}" tabindex="0"><span class="sev">${a.sev.slice(0, 4).toUpperCase()}</span><span><b>${a.tur} · ${esc(a.msg)}</b><small>${a.code} · ${a.state}</small></span><time>${timeAgo(a.at)}</time></li>`).join('') || '<li class="empty" style="--ac:var(--good)">No open alarms.</li>'; };
  const drawRows = () => hbars($('#rows', v), ROWS.split('').map((r, i) => ({ label: 'Row ' + r, value: +(sum(DB.t.filter(t => t.row === r).map(t => t.kw)) / 1000).toFixed(1), color: `var(--c${[1, 2, 1, 2, 1, 2][i]})` })), { fmt: x => fmt(x, 1) + ' MW' });
  drawAl(); drawRows();
  let rg = '24H'; const drawOc = () => { const [l, a, f] = SER[rg](); lineChart($('#oc', v), { labels: l, series: [{ name: rg === '24H' ? 'Output MW' : 'Energy MWh', data: a, color: 'var(--c1)' }, { name: 'Forecast', data: f, color: 'var(--c2)', dash: true, noArea: true }], h: 220, morph: true, xw: 60 }); };
  segmented($('#rg', v), ['24H', '7D', '30D'], rg, r => { rg = r; drawOc(); }); drawOc();
  const mwHist = DB.h24.slice(-30); spark($('#sp-mw', v), mwHist, 'var(--c1)', { h: 30, fmt: x => fmt(x, 0) + ' MW' });
  mp.addEventListener('click', e => { const g = e.target.closest('.wt'); g && openTurbine(tur(g.dataset.t)); });
  mp.addEventListener('keydown', e => { const g = e.target.closest('.wt'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openTurbine(tur(g.dataset.t)); } });
  mp.addEventListener('pointermove', e => { const g = e.target.closest('.wt'); if (g) Tip.show(tipT(tur(g.dataset.t)), e.clientX, e.clientY); else Tip.hide(); });
  mp.addEventListener('pointerleave', () => Tip.hide());

  mp.addEventListener('focusout', () => Tip.hide());
  $('#al', v).addEventListener('click', e => { const li = e.target.closest('[data-al]'); if (li) openAlarm(DB.alarms.find(a => a.id === li.dataset.al), drawAl); });
  $('#al', v).addEventListener('keydown', e => { const li = e.target.closest('[data-al]'); if (li && e.key === 'Enter') openAlarm(DB.alarms.find(a => a.id === li.dataset.al), drawAl); });
  const lb = $('[data-lbl]', v); lb.onclick = () => { const on = $('.wmap', v).classList.toggle('labels'); lb.setAttribute('aria-pressed', on); };
  $('[data-newwo]', v).onclick = () => woModal();
  const upd = () => { const m = farmMW(); $('#k-mw', v).textContent = fmt(m, 1); $('#k-ws', v).textContent = fmt(DB.wind, 1); $('#k-dir', v).textContent = `m/s from ${Math.round(DB.dir)}°`; $('#k-cf', v).textContent = pct(m / 384 * 100, 1); $('#k-on', v).textContent = online() + '/48'; $('#k-off', v).textContent = DB.t.filter(t => t.status === 'Fault').length + ' fault · ' + DB.t.filter(t => t.status === 'Maintenance').length + ' maintenance'; $('#map-n', v).textContent = `wind ${Math.round(DB.dir)}° · wake loss ${fmt(4 + DB.wind * .2, 1)}%`; mwHist.push(+m.toFixed(1)); mwHist.shift(); spark($('#sp-mw', v), mwHist, 'var(--c1)', { h: 30, anim: false, fmt: x => fmt(x, 0) + ' MW' }); paintMap(mp); };
  upd();
  bus.h.tick = []; bus.on('tick', () => { if (!v.isConnected) return; upd(); drawRows(); if ($('#al', v).children.length !== Math.min(8, DB.alarms.filter(a => a.state !== 'Cleared').length)) drawAl(); });
});

  const kp = () => { $('#wk', v).innerHTML = WOC.map(c => kpiHTML({ label: c.label, value: DB.wo.filter(w => w.stage === c.k).length, icon: c.k === 'Done' ? 'check' : c.k === 'On site' ? 'tool' : c.k === 'Weather wait' ? 'cloud' : 'cal', note: fmt(sum(DB.wo.filter(w => w.stage === c.k).map(w => w.hrs))) + ' work hours' })).join(''); counts($('#wk', v)); };

  const drawV = () => { $('#vg', v).innerHTML = DB.ves.map(s => `<section class="card vc" data-v="${s.id}"><div class="card-h" style="margin:0"><h2>${esc(s.name)}</h2>${tagS(s.status)}</div><dl><dt>Type</dt><dd>${s.type}</dd><dt>On board</dt><dd>${s.crew}/${s.cap}</dd><dt>Target</dt><dd>${s.target || 'Port Haven'}</dd><dt>${s.status === 'Transit' || s.status === 'Returning' ? 'ETA' : 'Since'}</dt><dd>${s.eta} min</dd></dl><small class="muted mono" style="font-size:.66rem">FUEL ${s.fuel}%</small><div class="vbar"><i style="--w:${s.fuel}%;--bc:${s.fuel < 40 ? 'var(--warn)' : 'var(--accent)'}"></i></div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${s.status === 'In port' ? `<button class="btn sm pri" type="button" data-disp>${ic('send')}Dispatch</button>` : s.status === 'At turbine' ? `<button class="btn sm" type="button" data-ret>${ic('back')}Return to port</button>` : `<span class="muted mono" style="font-size:.7rem">Under way</span>`}</div></section>`).join(''); };
  drawV(); place(); pageRefresh = () => { drawV(); place(); };
  $('#vg', v).addEventListener('click', e => { const c = e.target.closest('[data-v]'); if (!c) return; const s = DB.ves.find(x => x.id === c.dataset.v);
    if (e.target.closest('[data-disp]')) { if (DB.waves[0] > DB.set.hs) { toast(`Waves at ${DB.waves[0]} m. Too rough to sail.`, 'bad'); return; } const open = DB.wo.filter(w => w.stage === 'Planned' || w.stage === 'Weather wait'); formModal({ title: 'Dispatch ' + s.name, fields: [{ k: 'wo', label: 'Work order', type: 'select', options: open.length ? open.map(w => ({ v: w.id, l: `${w.id} · ${w.tur} · ${w.name}` })) : [{ v: '', l: 'No open work orders' }], full: true, valid: x => x ? '' : 'Create a work order first' }, { k: 'crew', label: 'Technicians on board', type: 'number', min: 1, max: s.cap, req: true, def: 3 }], submit: 'Dispatch', onSubmit: x => { const w = DB.wo.find(z => z.id === x.wo); s.status = 'Transit'; s.target = w.tur; s.crew = x.crew; s.eta = ri(25, 45); w.stage = 'On site'; w.vessel = s.name; drawV(); Bell.add(`${s.name} sailing to ${w.tur}`, `${x.crew} technicians · ${w.name}`, 'ok'); } }); }
    if (e.target.closest('[data-ret]')) { s.status = 'Returning'; s.target = null; s.eta = ri(20, 35); drawV(); toast(s.name + ' heading back to port'); } });
  bus.h.tick = []; bus.on('tick', () => { if (!v.isConnected) return; place(); if (DB.vesChanged) { DB.vesChanged = false; drawV(); } else $$('.vc', v).forEach(c => { const s = DB.ves.find(x => x.id === c.dataset.v), dd = c.querySelectorAll('dd')[3]; if (dd) dd.textContent = s.eta + ' min'; }); });
});
/* vessels sail in the background: one minute of ETA per second, so the demo moves */
function vesselTick() { DB.ves.forEach(s => { if (s.status === 'Transit' || s.status === 'Returning') { s.eta = Math.max(0, s.eta - 1); if (s.eta === 0) { if (s.status === 'Transit') { s.status = 'At turbine'; s.eta = 0; Bell.add(`${s.name} arrived at ${s.target}`, 'Technicians transferring', 'ok', true); } else { s.status = 'In port'; s.crew = 0; s.fuel = Math.min(100, s.fuel + 30); } DB.vesChanged = true; } } }); vesselPos(); }
/* where each vessel is: at port, at a turbine, or part way between */
function vesselPos() { const port = [150, 300]; DB.ves.forEach((s, i) => { const t = s.target ? tur(s.target) : null, dest = t ? [t.x + 20, t.y + 12] : [port[0] + 30, port[1] + 20 + i * 18]; if (s.status === 'Transit' || s.status === 'Returning') { const k = clamp(1 - s.eta / 40, 0, 1), from = s.status === 'Transit' ? port : [s.x || dest[0], s.y || dest[1]]; const to = s.status === 'Transit' ? dest : [port[0] + 30, port[1] + 20 + i * 18]; s.x = lerp(from[0], to[0], s.status === 'Transit' ? k : .15); s.y = lerp(from[1], to[1], s.status === 'Transit' ? k : .15); } else { s.x = dest[0]; s.y = dest[1]; } }); }

/* --- Grid and market --- */
page('grid', 'Grid & market', v => {
  v.innerHTML = pageHead('Grid & market', 'Export to the onshore grid, the live power price and requests from the grid operator.') + `<div id="rq"></div><section class="kpis"><div class="kpi card"><span class="k-l">Export now</span><b class="k-v" id="g-mw">--</b><span class="k-n" id="g-lim"></span></div><div class="kpi card"><span class="k-l">Power price</span><div class="price"><b class="k-v" id="g-px">--</b><span class="delta" id="g-pd"></span></div><span class="k-n">$ per MWh, day-ahead</span></div><div class="kpi card"><span class="k-l">Revenue today</span><b class="k-v" id="g-rev">--</b><span class="k-n" id="g-mwh"></span></div><div class="kpi card"><span class="k-l">Curtailed now</span><b class="k-v" id="g-cu">--</b><span class="k-n">turbines with a power limit</span></div></section>
  <div class="g g-21"><section class="card"><div class="card-h"><h2>Export against the grid limit</h2><small>last 2 minutes</small></div><div class="chart" id="gx"></div></section><section class="card"><div class="card-h"><h2>Export headroom</h2></div><div class="chart" id="gg" style="display:grid;place-items:center"></div></section></div>
  <section class="card"><div class="card-h"><h2>Energy and price by month</h2><div id="grg"></div></div><div class="chart" id="gm"></div></section>`;
  const ex = Array.from({ length: 60 }, () => +farmMW().toFixed(1)), lim = () => DB.req && DB.req.on ? DB.req.mw : DB.set.limit; let lastPx = DB.price;
  const drawReq = () => { const r = DB.req; $('#rq', v).innerHTML = r && !r.on ? `<div class="req" style="margin-bottom:12px"><span>${ic('alert')}</span><div><b>Curtailment request from the grid operator</b><span class="muted">Hold export at ${r.mw} MW for ${r.hrs} h. Compensation $${r.comp}/MWh for energy not exported.</span></div><div class="acts"><button class="btn" type="button" data-dec>Decline</button><button class="btn pri" type="button" data-acc>Accept and apply</button></div></div>` : r && r.on ? `<div class="req" style="margin-bottom:12px;border-color:var(--c1)"><span>${ic('check')}</span><div><b>Holding export at ${r.mw} MW</b><span class="muted">Turbines share the limit evenly.</span></div><div class="acts"><button class="btn" type="button" data-end>End now</button></div></div>` : ''; };
  const applyCap = mw => { const on = DB.t.filter(t => t.status === 'Running' || t.status === 'Curtailed'), avail = sum(on.map(t => curve(t.ws))) / 1000, k = mw >= avail ? 100 : Math.max(10, Math.floor(mw / avail * 100)); on.forEach(t => { t.cap = k; t.status = k < 100 ? 'Curtailed' : 'Running'; }); return k; };
  $('#rq', v).addEventListener('click', e => { if (e.target.closest('[data-acc]')) { DB.req.on = true; const k = applyCap(DB.req.mw); drawReq(); Bell.add(`Curtailment accepted: ${DB.req.mw} MW`, `Turbines limited to ${k}%`, 'ok'); } else if (e.target.closest('[data-dec]')) { DB.req = null; DB.reqAt = Date.now() + 60000; drawReq(); toast('Request declined'); } else if (e.target.closest('[data-end]')) { DB.t.forEach(t => { if (t.status === 'Curtailed') { t.cap = 100; t.status = 'Running'; } }); DB.req = null; DB.reqAt = Date.now() + 90000; drawReq(); toast('Back to full output'); } });
  let rg = '12M'; const drawM = () => { const ms = rg === '6M' ? DB.months.slice(-6) : DB.months; barChart($('#gm', v), { labels: ms.map(m => m.m), series: [{ name: 'Energy GWh', data: ms.map(m => m.gwh), color: 'var(--c1)' }, { name: 'Budget GWh', data: ms.map(m => m.budget), color: 'var(--c6)' }], h: 220, yfmt: x => fmt(x), tfmt: x => fmt(x) + ' GWh' }); };
  segmented($('#grg', v), ['6M', '12M'], rg, r => { rg = r; drawM(); }); drawM();
  const upd = first => { const m = farmMW(); ex.push(+m.toFixed(1)); ex.shift(); $('#g-mw', v).textContent = fmt(m, 1) + ' MW'; $('#g-lim', v).textContent = 'limit ' + lim() + ' MW'; const px = $('#g-px', v); px.textContent = '$' + fmt(DB.price, 2); const d = DB.price - lastPx; $('#g-pd', v).textContent = (d >= 0 ? '▲ ' : '▼ ') + fmt(Math.abs(d), 2); $('#g-pd', v).className = 'delta ' + (d >= 0 ? 'up' : 'dn'); px.classList.remove('flash-up', 'flash-dn'); void px.offsetWidth; px.classList.add(d >= 0 ? 'flash-up' : 'flash-dn'); lastPx = DB.price; $('#g-rev', v).textContent = money(DB.revToday); $('#g-mwh', v).textContent = fmt(DB.mwh, 1) + ' MWh since you opened the desk'; $('#g-cu', v).textContent = DB.t.filter(t => t.status === 'Curtailed').length;
    lineChart($('#gx', v), { labels: ex.map((_, i) => (i - 59) + 's'), series: [{ name: 'Export', data: ex, color: 'var(--c1)' }, { name: 'Limit', data: ex.map(() => lim()), color: 'var(--c4)', dash: true, noArea: true }], h: 220, anim: !!first, yfmt: x => fmt(x), tfmt: x => fmt(x, 1) + ' MW', xw: 70, max: 400 });
    gauge($('#gg', v), { value: Math.max(0, lim() - m), max: lim(), size: 210, color: lim() - m < 20 ? 'var(--warn)' : 'var(--c2)', fmt: x => fmt(x) + ' MW', sub: 'room under the limit', label: 'Export headroom', anim: !!first }); };
  drawReq(); upd(true); pageRefresh = drawReq;
  bus.h.tick = []; bus.on('tick', () => { if (v.isConnected) { upd(); if (!$('#rq', v).innerHTML && DB.req) drawReq(); } });
});

/* --- Alarm log --- */
function openAlarm(a, after) { const L = drawer({ title: esc(a.code + ' · ' + a.tur), body: `${tagS(a.state)} <span class="sev" style="--ac:${sevC(a.sev)}">${a.sev}</span><dl class="dl" style="margin-top:12px"><dt>Message</dt><dd>${esc(a.msg)}</dd><dt>Turbine</dt><dd class="mono">${a.tur}</dd><dt>Raised</dt><dd>${fd(a.at)} · ${ftime(a.at)}</dd><dt>Alarm id</dt><dd class="mono">${a.id}</dd></dl>`, foot: `<button class="btn" type="button" data-tu>${ic('wind')}Open turbine</button>${a.state === 'Open' ? `<button class="btn pri" type="button" data-ack>${ic('check')}Acknowledge</button>` : ''}` }); $('[data-tu]', L.el).onclick = () => { L.close(); openTurbine(tur(a.tur)); }; const k = $('[data-ack]', L.el); k && (k.onclick = () => { a.state = 'Acknowledged'; L.close(); toast(a.id + ' acknowledged'); (after || redo)(); }); }
page('alarms', 'Alarms', v => {
  v.innerHTML = pageHead('Alarms', 'Everything the turbines have reported in the last three days. New alarms appear at the top.', `<button class="btn" type="button" data-ackall>${ic('check')}Acknowledge all open</button>`) + `<section class="kpis" id="ak"></section><section class="card"><div class="dt" id="at"></div></section>`;
  const kp = () => { $('#ak', v).innerHTML = [{ label: 'Open', value: DB.alarms.filter(a => a.state === 'Open').length, icon: 'alert' }, { label: 'Critical open', value: DB.alarms.filter(a => a.state === 'Open' && a.sev === 'Critical').length, icon: 'zap' }, { label: 'Last 24 hours', value: DB.alarms.filter(a => Date.now() - a.at < 864e5).length, icon: 'clock' }, { label: 'Most alarms', value: 0, icon: 'wind', note: '' }].map(kpiHTML).join(''); const cnt = {}; DB.alarms.forEach(a => cnt[a.tur] = (cnt[a.tur] || 0) + 1); const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; const kv = $$('.k-v', $('#ak', v))[3]; kv.dataset.count = top ? top[1] : 0; kv.closest('.kpi').querySelector('.k-l').textContent = 'Most alarms · ' + (top ? top[0] : '–'); counts($('#ak', v)); };
  const dt = DataTable($('#at', v), { rows: () => DB.alarms, sort: 'at', ph: 'Search alarms…', pageSize: 10, filters: [{ label: 'All' }, { label: 'Open', fn: a => a.state === 'Open' }, { label: 'Critical', fn: a => a.sev === 'Critical' }, { label: 'Acknowledged', fn: a => a.state === 'Acknowledged' }, { label: 'Cleared', fn: a => a.state === 'Cleared' }], cols: [{ k: 'sev', label: 'Severity', f: x => `<span class="sev" style="--ac:${sevC(x)}">${x}</span>` }, C.id('tur', 'Turbine'), C.id('code', 'Code'), C.txt('msg', 'Message'), { k: 'at', label: 'Raised', f: x => fd(x) + ' ' + ftime(x) }, C.tag('state', 'State'), { k: 'id', label: 'Action', sort: false, f: (x, a) => a.state === 'Open' ? `<button class="btn sm" type="button" data-act="ack">Ack</button>` : '' }], onAct: (act, a) => { a.state = 'Acknowledged'; dt.draw(); kp(); toast(a.id + ' acknowledged'); }, onRow: a => openAlarm(a, () => { dt.draw(); kp(); }) });
  kp(); pageRefresh = () => { dt.draw(); kp(); };
  $('[data-ackall]', v).onclick = async () => { const n = DB.alarms.filter(a => a.state === 'Open').length; if (!n) { toast('Nothing open'); return; } if (await confirmBox(`Acknowledge all ${n} open alarms?`, { ok: 'Acknowledge', danger: false })) { DB.alarms.forEach(a => { if (a.state === 'Open') a.state = 'Acknowledged'; }); dt.draw(); kp(); toast(n + ' alarms acknowledged'); } };
  let seen = DB.alarms.length; every(2000, () => { if (DB.alarms.length !== seen) { seen = DB.alarms.length; dt.draw(); kp(); } });
});

/* --- Reports --- */
page('reports', 'Reports', v => {
  const e12 = sum(DB.months.map(m => m.gwh)), b12 = sum(DB.months.map(m => m.budget));
  v.innerHTML = pageHead('Reports', 'Energy against budget, availability by row and money made.', `<button class="btn" type="button" data-csv>${ic('dl')}Download CSV</button>`) + `<section class="kpis">${[{ label: 'Energy, 12 months', value: e12, f: 'gwh', icon: 'bolt', delta: (e12 - b12) / b12 * 100, dl: 'vs budget' }, { label: 'Capacity factor', value: e12 * 1000 / (384 * 8760) * 100, f: 'pct1', icon: 'chart' }, { label: 'Availability', value: avg(DB.t.map(t => t.avail)), f: 'pct1', icon: 'check' }, { label: 'Revenue, 12 months', value: sum(DB.months.map(m => m.gwh * 1000 * m.price)), f: 'moneyS', icon: 'wallet' }].map(kpiHTML).join('')}</section>
  <div class="g g-2"><section class="card"><div class="card-h"><h2>Energy vs budget</h2></div><div class="chart" id="eb"></div></section><section class="card"><div class="card-h"><h2>Energy by row, 12 months</h2></div><div class="chart" id="er"></div></section></div><section class="card"><div class="card-h"><h2>Availability by row, last 30 days</h2><small>darker is better</small></div><div class="chart" id="ah"></div></section>`;
  barChart($('#eb', v), { labels: DB.months.map(m => m.m), series: [{ name: 'Energy', data: DB.months.map(m => m.gwh), color: 'var(--c1)' }, { name: 'Budget', data: DB.months.map(m => m.budget), color: 'var(--c6)' }], h: 220, tfmt: x => fmt(x) + ' GWh' });
  donut($('#er', v), { data: ROWS.split('').map((r, i) => ({ label: 'Row ' + r, value: Math.round(e12 / 6 * rf(.9, 1.08)), color: `var(--c${i % 5 + 1})` })), vfmt: x => fmt(x) + ' GWh', centerLabel: 'GWh', center: fmt(e12) });
  heatmap($('#ah', v), { rows: ROWS.split('').map(r => 'Row ' + r), cols: lastDays(30), data: DB.avail, color: 'var(--c1)', fmt: x => fmt(x, 1) + '% available', cell: 22 });
  $('[data-csv]', v).onclick = () => { const csv = [['Month', 'Energy GWh', 'Budget GWh', 'Price $/MWh'], ...DB.months.map(m => [m.m, m.gwh, m.budget, m.price])].map(r => r.join(',')).join('\n'); try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'tidewind-energy.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400); toast('Report downloaded'); } catch (e) { toast('Download is blocked here', 'warn'); } };
});
FMT.gwh = x => fmt(x) + ' GWh';

/* --- Settings --- */
page('settings', 'Settings', v => {
  v.innerHTML = pageHead('Setup', 'Site limits, display and alerts.') + `<div class="g g-2"><section class="card"><div class="card-h"><h2>Site</h2></div><form class="form" id="sf" novalidate>${formHTML([{ k: 'name', label: 'Wind farm name', req: true, full: true }, { k: 'limit', label: 'Grid export limit (MW)', type: 'number', min: 50, max: 384, req: true }, { k: 'hs', label: 'Vessel wave limit (m)', type: 'number', min: .5, max: 3, step: '.1', req: true }, { k: 'email', label: 'Control room email', type: 'email', req: true, full: true }], DB.set)}<div class="fld full"><button class="btn pri" type="submit">${ic('check')}Save</button></div></form></section>
  <section class="card set-sec"><div class="card-h" style="margin:0"><h2>Display and alerts</h2></div>${switchHTML('s-dark', 'Dark theme', Theme.get() === 'dark')}${switchHTML('s-rm', 'Reduce motion (rotors stop spinning)', document.documentElement.classList.contains('rm'))}${switchHTML('s-a1', 'Alert on critical alarms', true)}${switchHTML('s-a2', 'Alert on grid requests', true)}<div class="card-h" style="margin:8px 0 0"><h2>Demo data</h2></div><p class="muted">The wind farm, its turbines and every number are invented.</p><button class="btn danger" type="button" data-reset style="justify-self:start">${ic('refresh')}Reset demo data</button></section></div>`;
  $('#sf', v).addEventListener('submit', e => { e.preventDefault(); const x = readForm(e.target, [{ k: 'name', label: 'Name', req: true }, { k: 'limit', label: 'Export limit', type: 'number', min: 50, max: 384, req: true }, { k: 'hs', label: 'Wave limit', type: 'number', min: .5, max: 3, req: true }, { k: 'email', label: 'Email', type: 'email', req: true }]); if (x) { Object.assign(DB.set, x); toast('Site settings saved'); } });
  $('#s-dark', v).onchange = e => Theme.set(e.target.checked ? 'dark' : 'light');
  $('#s-rm', v).onchange = e => { RM = e.target.checked; document.documentElement.classList.toggle('rm', RM); toast(RM ? 'Motion reduced' : 'Motion back on'); };
  ['#s-a1', '#s-a2'].forEach(s => $(s, v).onchange = () => toast('Alert setting saved'));
  $('[data-reset]', v).onclick = async () => { if (await confirmBox('Reset all demo data? Your changes will be lost.', { ok: 'Reset data' })) { DB = makeData(); vesselPos(); Bell.list = []; Bell.badge(); toast('Demo data reset'); location.hash = '#/ops'; } };
});

/* ================= Start ================= */
DB = makeData(); vesselPos();
Theme.init();
Bell.init($('[data-bell]'));
Bell.add('T14 converter trip', 'Crew on site with Sea Kestrel', 'bad', true);
Bell.add('Weather window opens at 06:00', 'Waves dropping under 1.5 m', 'ok', true);
Cmdk.extra = [{ label: 'New work order', hint: 'Action', run: () => woModal() }, { label: 'Acknowledge all alarms', hint: 'Action', run: () => { location.hash = '#/alarms'; setTimeout(() => { const b = $('[data-ackall]'); b && b.click(); }, 300); } }, { label: 'Toggle dark theme', hint: 'Action', run: () => Theme.toggle() }, ...Array.from({ length: 48 }, (_, i) => ({ label: 'Turbine T' + pad(i + 1), hint: 'Turbine', run: () => { location.hash = '#/turbines/T' + pad(i + 1); } }))];
/* one simulation step per second; the top ticker always shows live numbers */
const ticker = () => { $('#tk-mw').textContent = fmt(farmMW(), 1); $('#tk-ws').textContent = fmt(DB.wind, 1); $('#tk-px').textContent = '$' + fmt(DB.price, 2); };
step(); ticker(); every(1000, () => { step(); ticker(); }, true);
Router.start();
</script>
