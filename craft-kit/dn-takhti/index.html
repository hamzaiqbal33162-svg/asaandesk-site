<!doctype html>
<!-- Chill & Craft · Takhti · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takhti · School fees and attendance</title>
<style>
/* ===== Shared base: reset, overlays, forms, tables, charts (themed by the variables below) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* page entrance: each app picks --enter-anim */
.enter{animation:var(--enter-anim,rise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px)}}
@keyframes blurin{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.row-in{animation:fadein .4s ease both;animation-delay:calc(var(--i,0) * 28ms)}

/* buttons press in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm,10px);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;background:var(--surface2);color:var(--text);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .35s}

/* chips and segmented control */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent,#fff)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .4s cubic-bezier(.3,1.3,.5,1),width .4s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:800;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 50% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 82%)}

/* tooltip, toasts, popovers */
#tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tip-bg,#111827);color:var(--tip-ink,#f9fafb);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:240px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#toasts{position:fixed;z-index:130;right:16px;bottom:16px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#111827);color:var(--tip-ink,#fff);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastin .45s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{color:var(--good)}
.toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--warn)}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.pop{position:fixed;z-index:110;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm,12px);box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;animation:pop .2s ease-out}
.pop [role="menuitem"]{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pop [role="menuitem"]:hover,.pop [role="menuitem"]:focus{background:var(--surface2);outline:none}
.pop-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{display:grid;gap:2px;padding:9px 10px 9px 22px;border-radius:8px;text-decoration:none;position:relative}
.note:hover{background:var(--surface2)}
.note.unread::before{content:"";position:absolute;left:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* modal and drawer */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.backdrop.side{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r,16px);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:modalin .38s cubic-bezier(.2,1.1,.3,1)}
.modal.wide{max-width:760px}
.modal.drawer{max-width:min(500px,100vw);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);animation:drawerin .4s cubic-bezier(.2,.9,.2,1)}
.backdrop.out{animation:fadein .22s reverse forwards}
.backdrop.out .modal{animation:modalin .22s reverse forwards}
.backdrop.out .drawer{animation:drawerin .25s reverse forwards}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes drawerin{from{transform:translateX(100%)}}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px}
.m-x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.m-body{padding:18px}
.m-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--surface);border-top:1px solid var(--line)}

/* forms with inline errors */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:10px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);animation:shake .35s}
.field .hint{color:var(--muted);font-size:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* data tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-search input{width:min(260px,100%);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tbl-search{flex:1 1 180px;max-width:280px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover,.tbl tr.click:focus{background:var(--surface2);outline:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sort-ic{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.3;transition:transform .2s}
th[aria-sort] .sort-ic{opacity:1}
th[aria-sort="ascending"] .sort-ic{transform:rotate(180deg) translateY(4px)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.pager button[disabled]{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.6,.1,.2,1) forwards}
.chart .fade{animation:fadein 1s .35s both}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hover{transition:opacity .15s;pointer-events:none}
.chart .hover circle{stroke:var(--surface);stroke-width:2.5}
.chart .grow{animation:grow .75s cubic-bezier(.2,.9,.3,1.15) both}
.chart .bcol{transition:opacity .2s}
.chart.hovering .bcol{opacity:.45}
.chart.hovering .bcol.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut{position:relative;flex:none}
.donut svg{overflow:visible}
.donut .seg-c{fill:none;transition:stroke-width .2s}
.donut .seg-c:hover{stroke-width:calc(var(--sw) * 1.25)}
.donut .sweep{animation:sweep .9s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 var(--C)}}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1 1 140px;min-width:0}
.lg li{display:flex;align-items:center;gap:4px}
.lg b{margin-left:auto;padding-left:10px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-f{display:block;height:100%;border-radius:999px;transform-origin:left}
.hb-f.growx{animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.ring-v{animation:ringin 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringin{from{stroke-dasharray:0 1}}
.gauge .g-v{animation:ringin 1.3s cubic-bezier(.3,.9,.3,1) both}
.hm{display:grid;gap:3px}
.hm-c{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0;animation:pop .4s both}
.spark{height:38px}

/* drag and drop */
.dragging{opacity:.35}
.ghost{position:fixed;z-index:140;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.3);opacity:.95;transition:none!important;animation:none!important}
.drop-hot{outline:2px dashed var(--accent);outline-offset:3px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* command search */
.cmdk .m-body{padding:12px}
.cmdk-in{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto}
.cmdk-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk-list li[aria-selected="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.cmdk-list li small{opacity:.7}
.cmdk-k{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* mobile nav drawer (sidebar apps) */
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.menu-btn{display:none!important}
@media (max-width:860px){
  .menu-btn{display:inline-grid!important}
  .side{position:fixed!important;z-index:60;top:0;bottom:0;left:0;width:min(280px,84vw)!important;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* theme switch reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,0))}}

/* print only the chosen area */
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}body.printing #print-root{display:block}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Takhti look: ruled exercise-book paper with a chalkboard sidebar ===== */
:root{--serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;--chalkfont:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;--bg:#f6f3ea;--surface:#fffefa;--surface2:#efebdf;--text:#1f2a2e;--muted:#6a6f69;--line:#e0dac8;--rule:#d9e3f0;--accent:#2b59c3;--on-accent:#fff;--chalk:#f4d35e;--board:#24362d;--wood:#8a5a33;--good:#2e8b57;--warn:#c4860f;--bad:#c8553d;--c1:#2b59c3;--c2:#2e8b57;--c3:#c8553d;--c4:#d9a21b;--c5:#7b5ea7;--r:8px;--r-sm:6px;--tip-bg:#24362d;--enter-anim:flipin}
[data-theme="dark"]{--bg:#18231e;--surface:#1f2d26;--surface2:#283a31;--text:#eef0e6;--muted:#a6b0a5;--line:#36493f;--rule:#22322a;--accent:#f4d35e;--on-accent:#1b2620;--board:#121b17;--good:#7fd1a0;--warn:#f2c14e;--bad:#ff8a72;--c1:#f4d35e;--c2:#7fd1a0;--c3:#ff8a72;--c4:#8fb8ff;--c5:#c9a8ff;--tip-bg:#0c120f}
body{background-color:var(--bg);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 30px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* chalkboard sidebar with a wooden frame */
.side{position:sticky;top:0;height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:22px;color:#eef3ea;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.05),transparent 45%),var(--board);border-right:8px solid var(--wood);box-shadow:inset -2px 0 0 rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand b{display:block;font-family:var(--chalkfont);font-size:26px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-size:12px;opacity:.7;margin-top:4px}
.nav{position:relative;display:grid;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 10px 14px;text-decoration:none;color:rgba(238,243,234,.72);font-size:15px;font-weight:600;transition:color .25s,transform .25s}
.nav a:hover{color:#fff;transform:translateX(3px)}
.nav a[aria-current="page"]{color:#fff}
.nav-marker{position:absolute;left:0;right:0;top:0;pointer-events:none;transition:transform .5s cubic-bezier(.4,1.3,.5,1),height .3s}
.nav-marker svg{position:absolute;left:36px;bottom:4px;width:calc(100% - 46px);height:10px;overflow:visible}
.nav-marker path{fill:none;stroke:var(--chalk);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.nav-marker.redraw path{animation:draw .7s ease-out both;stroke-dashoffset:1}
.side-tray{margin-top:auto;height:12px;border-radius:3px;background:var(--wood);position:relative}
.side-tray::before{content:"";position:absolute;left:18px;top:-6px;width:34px;height:7px;border-radius:3px;background:#fffdf4}
.side-tray::after{content:"";position:absolute;left:62px;top:-6px;width:22px;height:7px;border-radius:3px;background:var(--chalk)}
.side-note{font-size:12.5px;opacity:.75}
/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-t{flex:1;min-width:0}
.top-t h1{margin:0;font-family:var(--serif);font-size:25px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;color:var(--muted)}
.search-btn kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
#view{padding:24px 26px;flex:1}
/* flat paper cards with a red margin rule */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 18px 30px;box-shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(0,0,0,.25);transition:transform .25s,box-shadow .25s;min-width:0}
.card::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--bad) 45%,transparent)}
.card:hover{transform:translateY(-3px) rotate(-.15deg);box-shadow:0 1px 0 var(--line),0 18px 30px -16px rgba(0,0,0,.3)}
.h2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.h2 h2{margin:0;font-family:var(--serif);font-size:18px}
.btn{border-radius:6px}
.btn.primary{box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.wa{background:#1f9d55;color:#fff}
.chip,.seg,.seg button,.seg .thumb{border-radius:6px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.6fr}
.g2{grid-template-columns:1fr 1fr}
.mt{margin-top:18px}
/* hero chalkboard card */
.board{color:#eef3ea;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.07),transparent 40%),var(--board);border:8px solid var(--wood);border-radius:10px;padding:20px 22px}
.board::before{display:none}
.board h2{margin:0;font-family:var(--chalkfont);font-size:26px;font-weight:400}
.board p{margin:6px 0 0;opacity:.8}
.board .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.board .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.board .btn.primary{background:var(--chalk);color:#24362d;box-shadow:none}
.chalkline{display:block;margin-top:10px;height:8px;width:180px}
.chalkline path{fill:none;stroke:var(--chalk);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .35s ease-out forwards}
.kpi .k-l{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .k-v{font-family:var(--serif);font-size:30px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transform-origin:left;animation:growx 1s cubic-bezier(.2,.9,.3,1) both}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.list .who{flex:1;min-width:0}
.list .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .who small{color:var(--muted);font-size:12px}
.mini-wa{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;background:#1f9d55;color:#fff;flex:none;text-decoration:none}
/* classes */
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cls h3{margin:0;font-family:var(--serif);font-size:20px}
.secs{display:grid;gap:8px;margin-top:12px}
.sec{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.sec .ltr{font-family:var(--serif);font-weight:700;font-size:20px;width:30px;text-align:center}
.sec .who{flex:1;min-width:0;font-size:13px}
.sec .who small{display:block;color:var(--muted)}
/* attendance register */
.reg-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.reg-tools .inp{width:auto}
.reg-sum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;margin-bottom:12px}
.reg-sum b{font-family:var(--serif);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:62px;transition:transform .15s,background .25s,border-color .25s}
.tile:active{transform:scale(.97)}
.tile .roll{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface2)}
.tile b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;color:var(--muted)}
.tile .mk{position:absolute;right:8px;top:50%;width:30px;height:30px;margin-top:-15px}
.tile .mk path{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.tile.P{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.tile.P .mk path{stroke:var(--good)}
.tile.A{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.tile.A .mk path{stroke:var(--bad)}
.tile.L{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.tile.L .mk path{stroke:var(--warn)}
.tile.N .mk{display:none}
.tile .mk.anim path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
.tile .mk.anim path+path{animation-delay:.2s}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(14px,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.strip span{height:34px;border-radius:3px;animation:pop .4s both}
/* fee voucher */
.voucher{position:relative;border:1.5px dashed var(--muted);border-radius:8px;padding:16px;background:var(--surface);font-size:13.5px;overflow:hidden}
.voucher h3{margin:0;font-family:var(--serif);font-size:18px;text-align:center}
.voucher .c{text-align:center;color:var(--muted);font-size:12px}
.voucher table{width:100%;border-collapse:collapse;margin-top:10px}
.voucher td{padding:5px 0;border-bottom:1px dotted var(--line)}
.voucher td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.voucher .tot td{font-weight:800;font-size:15px;border-bottom:0}
.voucher .copy{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--surface2)}
.stamp{position:absolute;right:16px;top:44px;padding:6px 14px;border:3px solid var(--good);color:var(--good);border-radius:6px;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.1em;transform:rotate(-14deg);opacity:.85;text-align:center;line-height:1.1}
.stamp small{display:block;font-size:10px;letter-spacing:.04em}
.stamp.slam{animation:slam .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{from{transform:rotate(-30deg) scale(2.6);opacity:0}}
.vprint{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-family:Georgia,serif;color:#111}
.vprint .voucher{background:#fff;border-color:#555}
.months{display:inline-flex;gap:4px;flex-wrap:wrap}
.months span{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pname{display:flex;align-items:center;gap:10px}
.fee-tbl input{width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
@media print{.vprint{grid-template-columns:repeat(3,1fr)}.stamp{animation:none!important}}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.top{padding:10px 14px}#view{padding:16px}.search-btn span,.search-btn kbd{display:none}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:12px}.kpi .k-v{font-size:22px}.card{padding:14px 14px 14px 26px}.card::before{left:12px}.top-t p{display:none}.top-t h1{font-size:20px}.tiles{grid-template-columns:1fr 1fr}.board{border-width:6px}}
</style>
</head>

<script>
'use strict';
/* ===== Mini core: helpers, data seeding, router, theme, overlays, tables, charts, drag and drop ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

let R=Math.random;

const rnd=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],chance=p=>R()<p;

f:['Ayesha','Fatima','Sana','Hira','Maryam','Zainab','Amna','Rabia','Nida','Iqra','Saima','Mehwish','Komal','Sadia','Bushra','Farah','Anum','Kiran','Laiba','Areeba','Samina','Noreen'],

const phone=()=>'03'+rnd(0,4)+rnd(0,9)+'-'+String(rnd(1000000,9999999));

/* --- number and money formats (PKR) --- */
const NF=new Intl.NumberFormat('en-US');
const num=n=>NF.format(Math.round(+n||0));
const rs=n=>((+n||0)<0?'-':'')+'Rs '+NF.format(Math.abs(Math.round(+n||0)));
function short(n){n=+n||0;const a=Math.abs(n),s=n<0?'-':'',f=(v,u)=>s+(v>=100?Math.round(v):+v.toFixed(1))+u;return a>=1e9?f(a/1e9,'B'):a>=1e6?f(a/1e6,'M'):a>=1e3?f(a/1e3,'K'):s+Math.round(a)}

const FMT={num,rs,short,rsk,pct:v=>pct(v),pct1:v=>pct(v,1)};

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const addM=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};

const ic=(n,s=20)=>{const d=ICO[n]||'';return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d[0]==='<'?d:`<path d="${d}"/>`}</svg>`};

function genVouchers(S0,m,clsId){let n=0;S0.students.forEach(s=>{const c=clsOf(S0,s.sec);if(!c||(clsId&&c.id!==clsId))return;if(S0.vouchers.some(v=>v.sid===s.id&&v.month===m))return;const dp=discPct(S0,s);S0.vouchers.push({id:uid('v'),no:m.replace('-','').slice(2)+'-'+String(S0.vseq++).padStart(4,'0'),sid:s.id,month:m,fee:c.fee,disc:Math.round(c.fee*dp/100),dp,paid:null});n++});return n}
let S=store.get(KEY,null);if(!S||!S.students||!S.cfg)S=seed();
const save=()=>store.set(KEY,S);

/* ---------- lookups and money rules ---------- */
const ST=id=>S.students.find(s=>s.id===id),SEC=id=>{for(const c of S.classes)for(const s of c.secs)if(s.id===id)return{c,s};return null};
const secName=id=>{const x=SEC(id);return x?x.c.name+'-'+x.s.name:'?'};
const secKids=id=>S.students.filter(s=>s.sec===id).sort((a,b)=>a.roll-b.roll);
const dueOf=v=>pd(v.month+'-'+pad(S.cfg.dueDay));
const fineOf=v=>v.paid?v.paid.fine:Math.min(S.cfg.cap,Math.max(0,Math.round((TODAY-dueOf(v))/864e5))*S.cfg.fine);
const payable=v=>v.fee-v.disc+fineOf(v);
const vstat=v=>v.paid?'Paid':TODAY>dueOf(v)?'Overdue':'Unpaid';
const vtag=v=>{const s=vstat(v);return `<span class="tag ${s==='Paid'?'good':s==='Overdue'?'bad':'warn'}">${s}</span>`};
const allSecs=()=>S.classes.flatMap(c=>c.secs.map(s=>({...s,c})));
function attOn(d){const rec=S.att[d]||{};let p=0,t=0,a=0,l=0,taken=0;allSecs().forEach(s=>{const r=rec[s.id];if(!r)return;taken++;const n=secKids(s.id).length;t+=n;a+=r.a.length;l+=r.l.length});p=t-a-l;return{p,t,a,l,taken,pct:t?p/t*100:0}}
function stAtt(sid,month){let p=0,t=0;const s=ST(sid);Object.keys(S.att).forEach(d=>{if(month&&d.slice(0,7)!==month)return;const r=S.att[d][s.sec];if(!r)return;t++;if(!r.a.includes(sid)&&!r.l.includes(sid))p++});return{p,t,pct:t?p/t*100:100}}
function defaulters(){const m={};S.vouchers.forEach(v=>{if(v.paid||TODAY<=dueOf(v))return;(m[v.sid]||(m[v.sid]=[])).push(v)});return Object.entries(m).map(([sid,vs])=>{const s=ST(sid);return s?{id:sid,s,vs,tuition:sum(vs,v=>v.fee-v.disc),fine:sum(vs,fineOf),total:sum(vs,payable)}:null}).filter(Boolean)}
const remindText=(name,items,total)=>`Dear parent, this is ${S.cfg.school}. School fee for ${items} is pending: ${rs(total)} including late fine. Please pay at the office or bank by the end of this week. Thank you.`;
const waA=(ph,text,cls='mini-wa',label='')=>`<a class="${cls}" href="${esc(waLink(ph,text))}" target="_blank" rel="noopener" title="Opens WhatsApp with this text; you press send" aria-label="WhatsApp reminder${label?'':' to parent'}">${ic('chat',16)}${label}</a>`;
const head=(t,sub)=>{$('#pageTitle').textContent=t;$('#pageSub').textContent=sub};
const monthsOpt=()=>{const ks=[...new Set(S.vouchers.map(v=>v.month))].sort();return ks};

const printVoucher=vs=>printHTML(vs.map(v=>`<div class="vprint" style="margin-bottom:18px;page-break-inside:avoid">${['Bank copy','School copy','Parent copy'].map(c=>voucherHTML(v,c)).join('')}</div>`).join(''));
function openVoucher(id){const v=S.vouchers.find(x=>x.id===id);if(!v)return;const s=ST(v.sid);
  const m=modal({title:'Fee voucher '+v.no,body:`<div id="vbox">${voucherHTML(v,'Parent copy')}</div>${!v.paid&&s?`<p style="margin:12px 0 0">${waA(s.phone,remindText(s.name,s.name.split(' ')[0]+' ('+mlabel(v.month)+')',payable(v)),'btn wa',' Send reminder on WhatsApp')}</p>`:''}`,actions:[...(v.paid?[{label:'Undo payment',cls:'ghost',fn:()=>{confirmBox('Mark voucher '+v.no+' as unpaid again?',()=>{v.paid=null;save();refresh();toast('Payment removed')},'Mark unpaid')}}]:[{label:ic('check',16)+'Mark paid',cls:'primary',fn:()=>{markPaid([v]);return false}}]),{label:ic('print',16)+'Print 3 copies',cls:v.paid?'primary':'',fn:()=>{printVoucher([v]);return false}}]});

  modal({title:'Record fee payment',body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Save payment',cls:'primary',fn:m=>{const val=readForm(m,F);if(!val)return false;vs.forEach(v=>{v.paid={date:val.date,method:val.method,fine:fineOf(v)}});save();refresh();toast(rs(val.amt)+' received · '+vs.length+' voucher'+(vs.length>1?'s':'')+' paid');

function pgAttendance(el,arg){if(arg&&SEC(arg))ASEC=arg;if(!SEC(ASEC))ASEC=(allSecs()[0]||{}).id;head('Attendance','Tap a student to mark present, absent or leave');
  const kids=secKids(ASEC),x=SEC(ASEC);const rec=()=>(S.att[ADATE]||{})[ASEC];const stOf=id=>{const r=rec();return !r?'N':r.a.includes(id)?'A':r.l.includes(id)?'L':'P'};
  el.innerHTML=`<section class="card"><div class="reg-tools"><button class="icon-btn" id="dPrev" aria-label="Previous day">${ic('arrow',16).replace('<svg','<svg style="transform:scaleX(-1)"')}</button><label><span class="sr">Date</span><input class="inp" type="date" id="aDate" value="${ADATE}" max="${today}"></label><button class="icon-btn" id="dNext" aria-label="Next day">${ic('arrow',16)}</button>
  <label><span class="sr">Class and section</span><select class="inp" id="aSec">${allSecs().map(s=>`<option value="${s.id}" ${s.id===ASEC?'selected':''}>${esc(s.c.name)}-${esc(s.name)} · ${esc(s.teacher)}</option>`).join('')}</select></label><span style="flex:1"></span><button class="btn" id="allP">${ic('check',16)}Mark all present</button></div>
  <div class="reg-sum" id="rSum" aria-live="polite"></div><div class="tiles" id="tiles" role="group" aria-label="Register for ${esc(secName(ASEC))}"></div><p class="muted" style="font-size:12.5px;margin:12px 0 0">Tip: focus a name and press P, A or L. Changes save by themselves.</p></section>
  <div class="grid g2 mt"><section class="card"><div class="h2"><h2>${esc(secName(ASEC))} this month</h2><span class="muted" style="font-size:12.5px">% present per school day</span></div><div class="strip" id="aStrip"></div></section><section class="card"><div class="h2"><h2>Most absent this month</h2></div><ul class="list" id="aMost"></ul></section></div>`;
  const tiles=$('#tiles',el);
  const sumUp=()=>{const r=rec(),n=kids.length;$('#rSum',el).innerHTML=r?`<span><b>${n-r.a.length-r.l.length}</b> present</span><span><b style="color:var(--bad)">${r.a.length}</b> absent</span><span><b style="color:var(--warn)">${r.l.length}</b> leave</span><span class="tag good">Saved</span>`:`<span class="tag warn">Not marked yet for ${dd(ADATE)}</span><span class="muted">Tap any name to start; everyone else counts as present.</span>`};
  const tileHTML=(s,i,anim)=>{const st=stOf(s.id);return `<button class="tile ${st} row-in" style="--i:${Math.min(i,24)}" data-sid="${s.id}" aria-label="Roll ${s.roll}, ${esc(s.name)}: ${{P:'present',A:'absent',L:'on leave',N:'not marked'}[st]}"><span class="roll">${s.roll}</span><b>${esc(s.name)}</b><small>${{P:'Present',A:'Absent',L:'Leave',N:'Tap to mark'}[st]}</small><svg class="mk ${anim?'anim':''}" viewBox="0 0 30 30" aria-hidden="true">${MK[st]||''}</svg></button>`};
  const draw=()=>{tiles.innerHTML=kids.map((s,i)=>tileHTML(s,i,false)).join('')||'<p class="empty">No students in this section yet.</p>';sumUp()};
  const set=(sid,to)=>{if(!S.att[ADATE])S.att[ADATE]={};const r=S.att[ADATE][ASEC]||(S.att[ADATE][ASEC]={a:[],l:[]});r.a=r.a.filter(x=>x!==sid);r.l=r.l.filter(x=>x!==sid);if(to==='A')r.a.push(sid);if(to==='L')r.l.push(sid);save();const t=$(`[data-sid="${sid}"]`,tiles),i=kids.findIndex(k=>k.id===sid);if(t){const tmp=document.createElement('div');tmp.innerHTML=tileHTML(kids[i],0,!RM);const nt=tmp.firstElementChild;nt.classList.remove('row-in');t.replaceWith(nt);nt.focus()}sumUp();month()};
  const month=()=>{const days=Object.keys(S.att).filter(d=>d.slice(0,7)===ADATE.slice(0,7)&&S.att[d][ASEC]).sort();$('#aStrip',el).innerHTML=days.map((d,i)=>{const r=S.att[d][ASEC],p=kids.length?(kids.length-r.a.length-r.l.length)/kids.length:0;return `<span role="img" aria-label="${dd(d)}: ${Math.round(p*100)}% present" data-tip="${dd(d)} · ${Math.round(p*100)}% present" style="background:color-mix(in srgb,var(--good) ${Math.round(clamp((p-.6)/.4,0,1)*100)}%,var(--surface2));animation-delay:${i*25}ms"></span>`}).join('')||'<p class="empty">No registers this month yet.</p>';
    $$('[data-tip]',$('#aStrip',el)).forEach(c=>{c.addEventListener('pointermove',e=>tip(esc(c.dataset.tip),e.clientX,e.clientY));c.addEventListener('pointerleave',hideTip)});
    const cntA={};days.forEach(d=>S.att[d][ASEC].a.forEach(id=>cntA[id]=(cntA[id]||0)+1));const top=Object.entries(cntA).sort((a,b)=>b[1]-a[1]).slice(0,5);
    $('#aMost',el).innerHTML=top.map(([id,n])=>{const s=ST(id);return s?`<li>${av(s.name)}<span class="who"><b>${esc(s.name)}</b><small>Roll ${s.roll} · absent ${n} of ${days.length} days</small></span>${waA(s.phone,`Dear parent, ${s.name.split(' ')[0]} (${secName(s.sec)}) has been absent ${n} days this month at ${S.cfg.school}. Please meet the class teacher this week.`)}</li>`:''}).join('')||'<li class="empty">Nobody absent this month.</li>'};
  draw();month();
  tiles.addEventListener('click',e=>{const t=e.target.closest('[data-sid]');if(!t)return;const cur=stOf(t.dataset.sid);set(t.dataset.sid,{N:'A',P:'A',A:'L',L:'P'}[cur])});
  tiles.addEventListener('keydown',e=>{const t=e.target.closest('[data-sid]');const k=e.key.toUpperCase();if(t&&['P','A','L'].includes(k)){e.preventDefault();set(t.dataset.sid,k)}});
  $('#allP',el).addEventListener('click',()=>{if(!S.att[ADATE])S.att[ADATE]={};S.att[ADATE][ASEC]={a:[],l:[]};save();draw();month();toast('Everyone in '+secName(ASEC)+' marked present')});
  $('#aSec',el).addEventListener('change',e=>go('attendance/'+e.target.value));
  $('#aDate',el).addEventListener('change',e=>{if(!e.target.value||e.target.value>today){toast('Pick a date up to today','bad');e.target.value=ADATE;return}ADATE=e.target.value;refresh()});
  $('#dPrev',el).addEventListener('click',()=>{ADATE=iso(addD(pd(ADATE),-1));refresh()});$('#dNext',el).addEventListener('click',()=>{if(ADATE>=today){toast('That is in the future','info');return}ADATE=iso(addD(pd(ADATE),1));refresh()})}

/* vouchers */

function pgVouchers(el){const ms=monthsOpt();if(!ms.includes(VM))VM=ms[ms.length-1]||CUR;head('Fee vouchers','Generate, collect and print monthly vouchers');const vs=S.vouchers.filter(v=>v.month===VM),billed=sum(vs,v=>v.fee-v.disc),paid=vs.filter(v=>v.paid),coll=sum(paid,v=>v.fee-v.disc+v.paid.fine);

  <div class="grid g4"><article class="card kpi"><div class="k-l">Vouchers</div><div class="k-v">${cnt(vs.length,'num','v-n'+VM)}</div><div class="k-s">${mlabel(VM)} · due ${dd(VM+'-'+pad(S.cfg.dueDay))}</div></article><article class="card kpi"><div class="k-l">Billed</div><div class="k-v">${cnt(billed,'rsk','v-b'+VM)}</div><div class="k-s">after ${rsk(sum(vs,v=>v.disc))} sibling discounts</div></article><article class="card kpi"><div class="k-l">Collected</div><div class="k-v">${cnt(coll,'rsk','v-c'+VM)}</div><div class="k-s">${paid.length} paid · fines ${rsk(sum(paid,v=>v.paid.fine))}</div><div class="bar"><i style="width:${billed?clamp(coll/billed*100,0,100):0}%;background:var(--good)"></i></div></article><article class="card kpi"><div class="k-l">Still to collect</div><div class="k-v">${cnt(sum(vs.filter(v=>!v.paid),payable),'rsk','v-u'+VM)}</div><div class="k-s">${vs.length-paid.length} vouchers open</div></article></div>

  bindSeg(el,'vm',v=>{VM=v;refresh()});
  table($('#vT',el),{id:'vou'+VM,search:'Search voucher, student or class',chips:['All','Unpaid','Overdue','Paid'],chipFn:(v,c)=>c==='Unpaid'?!v.paid:vstat(v)===c,rows:()=>S.vouchers.filter(v=>v.month===VM),pageSize:10,text:v=>{const s=ST(v.sid);return v.no+' '+(s?s.name+' '+secName(s.sec):'')},
    cols:[{label:'Voucher',k:'no'},{label:'Student',v:v=>(ST(v.sid)||{}).name||'',f:v=>{const s=ST(v.sid);return s?`<b>${esc(s.name)}</b><br><small class="muted">${esc(secName(s.sec))}</small>`:'Removed'}},{label:'Fee',num:true,k:'fee',f:v=>rs(v.fee)},{label:'Discount',num:true,k:'disc',f:v=>v.disc?'-'+rs(v.disc):'-'},{label:'Fine',num:true,v:fineOf,f:v=>fineOf(v)?rs(fineOf(v)):'-'},{label:'Payable',num:true,v:payable,f:v=>'<b>'+rs(payable(v))+'</b>'},{label:'Status',v:vstat,f:v=>vtag(v)+(v.paid?` <small class="muted">${dd(v.paid.date)}</small>`:'')},{label:'',nosort:true,f:v=>v.paid?'':`<button class="btn sm" data-pay="${v.id}">Mark paid</button>`}],onRow:id=>openVoucher(id)});
  el.addEventListener('click',e=>{const p=e.target.closest('[data-pay]');if(p)markPaid([S.vouchers.find(v=>v.id===p.dataset.pay)]);
    if(e.target.closest('#prAll')){const u=S.vouchers.filter(v=>v.month===VM&&!v.paid);if(!u.length){toast('No unpaid vouchers this month','info');return}printVoucher(u.slice(0,60));toast('Sending '+Math.min(60,u.length)+' vouchers to print')}
    if(e.target.closest('#gen')){const nx=mkey(addM(TODAY,1)),F=[{k:'m',label:'Fee month',type:'select',opts:[[CUR,mlabel(CUR)+' (missing only)'],[nx,mlabel(nx)]],val:nx},{k:'c',label:'Class',type:'select',opts:[['','All classes'],...S.classes.map(c=>[c.id,c.name])]}];
      modal({title:'Generate fee vouchers',body:formHTML(F)+`<p class="muted" style="margin:12px 0 0;font-size:13px">Each active student gets one voucher. Sibling discounts (${S.cfg.d2}% second child, ${S.cfg.d3}% third and more) are applied by family code.</p>`,actions:[{label:'Cancel',cls:'ghost'},{label:'Generate',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;const n=genVouchers(S,v.m,v.c||null);save();VM=v.m;refresh();toast(n?n+' vouchers generated for '+mlabel(v.m):'Every student already has a voucher for '+mlabel(v.m),n?'ok':'info');if(n)confetti()}}]})}})}

/* defaulters with sibling families and late fines */
let DMODE='student';
function pgDefaulters(el){const df=defaulters();head('Defaulters','Overdue fees with late fines, by student or by family');
  const fams={};df.forEach(d=>{const k=d.s.fam||d.s.id;(fams[k]||(fams[k]={id:k,kids:[],total:0,fine:0,phone:d.s.phone,father:d.s.father,vs:[]}));const f=fams[k];f.kids.push(d.s);f.total+=d.total;f.fine+=d.fine;f.vs.push(...d.vs)});const famL=Object.values(fams);

    cols:[{label:'Student',v:d=>d.s.name,f:d=>`<b>${esc(d.s.name)}</b><br><small class="muted">${esc(secName(d.s.sec))} · ${esc(d.s.father)}</small>`},{label:'Months',v:d=>d.vs.length,f:d=>`<span class="months">${d.vs.map(v=>`<span>${mlabel(v.month)}</span>`).join('')}</span>`},{label:'Tuition',num:true,k:'tuition',f:d=>rs(d.tuition)+(discPct(S,d.s)?` <small class="muted">-${discPct(S,d.s)}%</small>`:'')},{label:'Fine',num:true,k:'fine',f:d=>rs(d.fine)},{label:'Total',num:true,k:'total',f:d=>'<b>'+rs(d.total)+'</b>'},{label:'',nosort:true,f:d=>`<span style="display:inline-flex;gap:6px">${waA(d.s.phone,remindText(d.s.name,d.vs.map(v=>mlabel(v.month)).join(', ')+' ('+d.s.name.split(' ')[0]+')',d.total))}<button class="btn sm" data-col="${d.id}">Collect</button></span>`}],onRow:id=>openStudent(id)});
  else table($('#dT',el),{id:'deff',search:'Search family or father',rows:()=>famL,sortCol:2,sortDir:-1,pageSize:8,text:f=>f.father+' '+f.kids.map(k=>k.name).join(' '),
    cols:[{label:'Family',v:f=>f.father,f:f=>`<b>${esc(f.father)}</b><br><small class="muted">${f.id.startsWith('F-')?esc(f.id):'single child'} · ${esc(f.phone)}</small>`},{label:'Children',v:f=>f.kids.length,f:f=>f.kids.map(k=>esc(k.name.split(' ')[0])+' <small class="muted">('+esc(secName(k.sec))+')</small>').join('<br>')},{label:'Total due',num:true,k:'total',f:f=>'<b>'+rs(f.total)+'</b><br><small class="muted">fine '+rs(f.fine)+'</small>'},{label:'',nosort:true,f:f=>`<span style="display:inline-flex;gap:6px">${waA(f.phone,remindText('',f.kids.map(k=>k.name.split(' ')[0]).join(' and ')+' ('+[...new Set(f.vs.map(v=>mlabel(v.month)))].join(', ')+')',f.total))}<button class="btn sm" data-colf="${f.id}">Collect all</button></span>`}]});
  hbars($('#dC',el),{items:byC.map((x,i)=>({...x,color:i<2?'var(--bad)':'var(--c4)'})),fmt:rsk});
