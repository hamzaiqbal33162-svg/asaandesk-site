<script>/* set the theme before first paint: ?theme= wins, then saved, then system */(function(){var d=document.documentElement,t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(d.dataset.key+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d.dataset.def||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t})();</script>
<style>
/* ---------- theme tokens: warm gig-poster paper by day, plum-black club by night ---------- */
:root{--font:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
--bg:#f5efe6;--surface:#fffaf3;--surface-2:#f0e6d8;--text:#1b1320;--muted:#6c5f70;--line:#e6d8c6;--hover:rgba(255,90,54,.08);--accent:#f2542d;--on-accent:#fff;--ring:rgba(255,90,54,.22);
--c1:#f2542d;--c2:#d63384;--c3:#6f42c1;--c4:#0ca678;--c5:#f59f00;--c6:#1c7ed6;
--ok:#0b8a5f;--ok-bg:rgba(12,166,120,.13);--bad:#d9302c;--bad-bg:rgba(224,49,49,.12);--warn:#b86e00;--warn-bg:rgba(245,159,0,.16);--info-bg:rgba(111,66,193,.12);
--side:#1a111e;--side-text:#f6ece1;--side-muted:#a99aa3;--grid:rgba(27,19,32,.09);--r:20px;--r-btn:12px}
[data-theme="dark"]{--bg:#100b14;--surface:#19121e;--surface-2:#241a2b;--text:#f7eee4;--muted:#a898ad;--line:#2f2438;--hover:rgba(255,122,77,.1);--accent:#ff7448;--ring:rgba(255,122,77,.25);
--c1:#ff7448;--c2:#f06595;--c3:#9775fa;--c4:#20c997;--c5:#fcc419;--c6:#4dabf7;--ok:#38d9a9;--ok-bg:rgba(56,217,169,.13);--bad:#ff6b6b;--bad-bg:rgba(255,107,107,.13);--warn:#fcc419;--warn-bg:rgba(252,196,25,.14);--info-bg:rgba(151,117,250,.16);--side:#09060b;--grid:rgba(255,255,255,.07)}
/* ---------- Core UI kit (shared parts, coloured by the theme tokens above) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--field,var(--surface-2));border:1px solid var(--line);border-radius:var(--r-in,10px);padding:.58em .75em;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio],input[type=range],input[type=color]{width:auto;padding:0;box-shadow:none}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:var(--iw,1.8);stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.num,.tnum{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--surface);padding:.55em .95em;border-radius:var(--r-btn,10px);font-weight:600;font-size:.88rem;line-height:1.2;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:.36em .65em;font-size:.78rem}
.btn:disabled{opacity:.5;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-btn,10px);position:relative;color:inherit;transition:background-color .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--hover)}
.ibtn:active{transform:scale(.9)}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);animation:dotPop .4s var(--ease)}
.ibtn .dot[hidden]{display:none}
@keyframes dotPop{from{transform:scale(0)}}
/* segmented control with a sliding pill */
.seg{position:relative;display:inline-flex;padding:3px;background:var(--surface-2);border-radius:var(--r-seg,10px);border:1px solid var(--line);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;padding:.36em .8em;font-size:.8rem;font-weight:600;color:var(--muted);border-radius:calc(var(--r-seg,10px) - 3px);transition:color .2s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--seg-on,var(--text))}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-seg,10px) - 3px);background:var(--seg-pill,var(--surface));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .38s var(--ease),width .38s var(--ease)}
/* badges, deltas, avatars */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg,var(--ring));color:var(--accent)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:.78rem;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.delta .i{width:.95em;height:.95em}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;font-weight:700;flex:none;background:hsl(var(--h) 62% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 75% 86%)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:.76rem}
/* switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background-color .25s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-weight:650;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2,var(--line));white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background-color .15s;cursor:pointer;animation:rowIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num .th-sort{flex-direction:row-reverse}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.th-sort{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.th-sort .i{opacity:.3;transition:transform .25s var(--ease),opacity .2s}
th[aria-sort] .th-sort .i{opacity:1}
th[aria-sort="ascending"] .th-sort .i{transform:rotate(180deg)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 180px;max-width:300px;display:block}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:.34em .8em;border-radius:99px;border:1px solid var(--line);font-size:.78rem;font-weight:650;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--chip-on,var(--accent));border-color:transparent;color:var(--on-accent,#fff)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);font-weight:650;color:var(--text);transition:background-color .2s,transform .15s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent}
.pager button:disabled{opacity:.35;cursor:default}
.empty{display:grid;place-items:center;gap:6px;padding:26px 12px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.55}
/* overlays: modal, drawer */
.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(8,10,20,.48));opacity:0;transition:opacity .24s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ovl.open{opacity:1}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--r-modal,16px);box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line);transform:translateY(18px) scale(.96);transition:transform .34s var(--ease)}
.modal.wide{width:min(780px,100%)}
.ovl.open .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
.m-head h2{font-size:1.06rem}
.m-body{padding:10px 18px 18px;display:grid;gap:12px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.m-text{color:var(--muted)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:650;color:var(--muted)}
.err{color:var(--bad);font-size:.75rem}
.err:empty{display:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100vw);height:100%;background:var(--surface-solid,var(--surface));border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.25);transform:translateX(104%);transition:transform .38s var(--ease);display:flex;flex-direction:column;color:var(--text)}
.ovl.open .drawer{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.06rem}
.d-body{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.d-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
/* popovers and menus */
.pop{position:fixed;z-index:90;min-width:200px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:6px;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:.86rem}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.on{font-weight:700;color:var(--accent)}
.mi.danger{color:var(--bad)}
.pop-t{padding:6px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.notes{max-height:330px;overflow:auto;display:grid;gap:2px}
.note{display:flex;gap:10px;padding:9px 8px;border-radius:8px;font-size:.84rem;align-items:flex-start}
.note .i{margin-top:2px;color:var(--accent)}
.note.new{background:var(--hover)}
.note small{color:var(--muted)}
/* command search */
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);background:var(--surface-solid,var(--surface));border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease);color:var(--text)}
.ovl.open .cmdk{transform:none}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:transparent;box-shadow:none;padding:6px 0;font-size:1rem}
kbd{font:600 .7rem/1 var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.cmdk-list{max-height:min(360px,55vh);overflow:auto;padding:6px}
.cmdk-it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.cmdk-it small{margin-left:auto;color:var(--muted)}
.cmdk-it[aria-selected="true"]{background:var(--hover);color:var(--accent)}
/* toasts */
.toasts{position:fixed;z-index:100;right:16px;bottom:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);box-shadow:0 12px 30px rgba(0,0,0,.28);font-size:.86rem;animation:toastIn .4s var(--ease);transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px) scale(.97)}
.toast.ok .i{color:#7be3a6}.toast.err .i{color:#ff8f8f}.toast.info .i{color:#9cc4ff}
.t-act{font-weight:700;color:#9cc4ff;margin-left:4px;padding:2px 4px;border-radius:6px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* chart tooltip */
.tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;background:var(--tip-bg,rgba(14,17,27,.95));color:var(--tip-fg,#fff);padding:8px 11px;border-radius:10px;font-size:.78rem;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:opacity .12s;min-width:120px;max-width:260px}
.tip.on{opacity:1}
.tip .tr{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;opacity:.82}
.tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.ch{display:block;overflow:visible;max-width:100%;outline:none}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ch text{font-size:11px;fill:var(--axis,var(--muted));font-family:var(--font)}
.ch .grid{stroke:var(--grid,var(--line));stroke-width:1;stroke-dasharray:var(--grid-dash,3 4)}
.ch .zero{stroke:var(--axis,var(--muted));stroke-width:1;opacity:.5}
.ch-line{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ch-line.dash{stroke-dasharray:5 5;stroke-width:1.8;opacity:.85}
.ch.enter .ch-line:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.3s var(--ease) .1s forwards}
.ch.enter .ch-area,.ch.enter .ch-line.dash,.ch.enter .tgt{animation:chFade 1s ease .3s both}
.tgt{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:6 4}
.guide{stroke:var(--axis,var(--muted));stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.hdot{fill:var(--surface-solid,var(--surface));stroke-width:2.5;opacity:0;transition:opacity .15s}
.ch.hover .guide,.ch.hover .hdot{opacity:1}
.ch-bar{transition:opacity .2s}
.ch.enter .ch-bar{transform-box:fill-box;transform-origin:50% 100%;animation:chGrow .8s var(--ease) both;animation-delay:calc(var(--i) * 26ms)}
.ch.enter .ch-bar.neg{transform-origin:50% 0}
.ch.colhover .col:not(.on) .ch-bar{opacity:.38}
.ch-seg{fill:none;transition:stroke-width .25s var(--ease),opacity .2s;cursor:pointer}
.ch-seg.dim{opacity:.35}
.ch.enter .ch-seg{animation:chSweep 1.1s var(--ease) both;animation-delay:calc(var(--i) * 110ms)}
.ch-cell{transform-box:fill-box;transform-origin:center;transition:opacity .15s}
.ch.enter .ch-cell,.ch.enter .ch-cellt{animation:chPop .55s var(--ease) both;animation-delay:calc(var(--i) * 12ms)}
.ch .ch-cellt{font-size:10px;font-weight:600;pointer-events:none}
.ch .ch-cellt.hi{fill:#fff}
.ch.enter .ch-fun{transform-box:fill-box;transform-origin:50% 50%;animation:chGrowX .8s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.ch.enter .ch-gauge{animation:chSweep 1.4s var(--ease) both}
.spark{display:block;overflow:visible}
.sp-l{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.2s var(--ease) .25s forwards}
@keyframes chDraw{to{stroke-dashoffset:0}}
@keyframes chFade{from{opacity:0}}
@keyframes chGrow{from{transform:scaleY(0)}}
@keyframes chGrowX{from{transform:scaleX(0)}}
@keyframes chSweep{from{stroke-dasharray:0 100}}
@keyframes chPop{from{opacity:0;transform:scale(.4)}}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;font-size:.76rem}
.lg button{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:650;padding:2px 0;transition:opacity .2s}
.lg button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn .ch{flex:none}
.dn-l{display:grid;gap:6px;flex:1;min-width:150px;font-size:.82rem}
.dn-l button{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;text-align:left;padding:3px 4px;border-radius:6px}
.dn-l button:hover,.dn-l button:focus-visible{background:var(--hover)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l small{color:var(--muted);min-width:38px;text-align:right}
.dn-v{font-size:20px!important;font-weight:750;fill:var(--text)!important}
.dn-s{font-size:10.5px!important}
.hbars{display:grid;gap:4px}
.hb{display:grid;grid-template-columns:minmax(64px,34%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;padding:4px 0}
.hb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-f{height:100%;width:var(--w);border-radius:inherit;background:var(--hb,var(--accent));transform-origin:left;transition:width .7s var(--ease)}
.hbars.enter .hb-f{animation:chGrowX .9s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.hb b{font-variant-numeric:tabular-nums;font-weight:650}
/* drag and drop */
.ghost{opacity:.92;box-shadow:0 18px 40px rgba(0,0,0,.28)!important;cursor:grabbing}
.dragging{opacity:.35}
.drop-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--hover)}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* page entrance (each item sets its own @keyframes rise) */
.view.enter .rise{animation:rise .62s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.theme-anim,.theme-anim *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;gap:20px;padding:20px 14px;overflow:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand b{font:800 1.45rem/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.logo{width:34px;height:34px}
.logo .lg-disc{transform-origin:17px 17px;animation:spin 2.4s var(--ease) 1}
.brand:hover .logo .lg-disc{animation:spin 2s linear infinite}
#nav{position:relative;display:grid;gap:2px}
.nl{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--side-muted);font-weight:600;transition:color .2s,transform .2s var(--ease)}
.nl:hover{color:var(--side-text);transform:translateX(3px)}
.nl[aria-current="page"]{color:#fff}
.nl .nc{margin-left:auto;font-style:normal;font-size:.7rem;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
.nav-marker{position:absolute;left:0;right:0;top:0;height:40px;border-radius:12px;background:linear-gradient(90deg,rgba(255,96,60,.32),rgba(255,96,60,.05));box-shadow:inset 3px 0 0 var(--accent);transition:transform .5s var(--ease),height .5s var(--ease),opacity .3s}
.side-card{margin-top:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;display:grid;gap:8px;font-size:.8rem;color:var(--side-muted)}
.side-card b{font:800 1.3rem/1 var(--display);color:var(--side-text)}
.meter{height:8px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c5),var(--accent));transition:width .9s var(--ease)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.menu-btn{display:none}
.search-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);min-width:240px;transition:border-color .2s}
.search-btn:hover{border-color:var(--accent)}
.search-btn kbd{margin-left:auto}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.84rem}
.view{padding:22px 26px 48px;display:grid;gap:18px;outline:none;align-content:start}
.scrim{display:none}
/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph h1{font:800 clamp(1.7rem,3.2vw,2.5rem)/.95 var(--display);text-transform:uppercase;letter-spacing:-.005em}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(40,10,30,.35)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font:800 1.05rem/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em}
.card-h p{font-size:.8rem;margin-top:2px}
.link{display:inline-flex;align-items:center;gap:2px;font-size:.8rem;font-weight:650;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden;transition:transform .35s var(--ease)}
.kpi:hover{transform:translateY(-3px) rotate(-.3deg)}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--kc,var(--accent))}
.kpi:first-child{background:var(--accent);border-color:transparent;color:#fff}
.kpi:first-child .kpi-top,.kpi:first-child .kpi-f,.kpi:first-child .delta{color:rgba(255,255,255,.9)}
.kpi:first-child::before{background:rgba(0,0,0,.18)}
.kpi-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.kpi-v{display:block;font:800 clamp(1.5rem,2.6vw,2.05rem)/1.1 var(--display);margin:10px 0 4px;font-variant-numeric:tabular-nums}
.kpi-f{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px}
/* signature: spin room with vinyl and waveform */
.spin{background:linear-gradient(160deg,var(--surface) 55%,color-mix(in srgb,var(--accent) 10%,var(--surface)))}
.spin-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.deck{width:150px;height:128px;flex:none}
.vinyl{width:150px;height:128px;display:block;overflow:visible}
.disc{transform-origin:62px 64px;transform-box:view-box;animation:spin 1.7s linear infinite;animation-play-state:paused}
.arm{transform-origin:134px 12px;transform-box:view-box;transform:rotate(-26deg);transition:transform .9s var(--ease)}
.playing .disc{animation-play-state:running}
.playing .arm{transform:rotate(0)}
@keyframes spin{to{transform:rotate(360deg)}}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.readout small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.readout b{font:800 1.3rem/1.15 var(--display);font-variant-numeric:tabular-nums}
.wavebox{margin-top:14px;touch-action:pan-y}
.wave{display:block;cursor:ew-resize;outline:none;overflow:visible}
.wave:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.wb{transition:opacity .25s}
.wb.t{fill:var(--c1)}.wb.b{fill:var(--c3)}
.wb:not(.on){opacity:.26}
.wave.enter .wb{transform-box:fill-box;transform-origin:50% 100%;animation:chGrow .7s var(--ease) both;animation-delay:calc(var(--i) * 9ms)}
.wave.enter .wb.b{transform-origin:50% 0}
.wmid{stroke:var(--text);stroke-width:1;opacity:.25}
.phl{stroke:var(--text);stroke-width:1.5}
.phk{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.wave text{font-size:11px;fill:var(--muted)}
.wlg{display:flex;gap:16px;font-size:.76rem;color:var(--muted);margin-top:6px}
.wlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.08em}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.6s ease-in-out 6}
@keyframes blink{50%{opacity:.25}}
.live-list{display:grid;gap:10px}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;text-align:left;width:100%;transition:background-color .2s}
.lv:hover{background:var(--hover)}
.lv .sw{width:10px;height:34px;border-radius:4px;background:var(--cc)}
.lv b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv small{color:var(--muted);font-size:.74rem}
.lv .imp{font-weight:700;font-variant-numeric:tabular-nums;font-size:.86rem;text-align:right}
.lv .meter{height:5px;margin-top:5px;background:var(--surface-2)}
/* campaigns */
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mini small{display:block;color:var(--muted);font-size:.74rem;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.mini b{font:800 1.35rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.chdot{display:inline-flex;align-items:center;gap:7px}
.chdot::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--cc)}
.pbar{display:inline-block;width:70px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;vertical-align:middle;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.ibtn.sm{width:30px;height:30px}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.d-stats div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.d-stats small{display:block;color:var(--muted);font-size:.72rem}
.d-stats b{font:800 1.15rem/1.2 var(--display)}
.pace .row{justify-content:space-between;font-size:.84rem;margin-bottom:6px}
/* budget mixer (mixing desk faders) */
.mix-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.desk{background:linear-gradient(180deg,#221827,#150e19);color:#f3e9df;border-color:#2c2133}
.desk:hover{transform:none}
.desk-strips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;overflow-x:auto}
.strip{display:grid;justify-items:center;gap:8px;padding:10px 4px 12px;border-radius:14px;background:rgba(255,255,255,.035);min-width:74px}
.strip.master{background:rgba(255,116,72,.1);box-shadow:inset 0 0 0 1px rgba(255,116,72,.3)}
.st-v{font:800 1.02rem/1 var(--display);font-variant-numeric:tabular-nums;color:#fff}
.st-n{font-size:.74rem;font-weight:700;text-align:center;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.strip small{font-size:.68rem;color:#b8a8b5;text-align:center}
.fader{display:flex;gap:9px;height:230px}
.track{position:relative;width:34px;height:100%;display:flex;justify-content:center}
.track::before{content:"";position:absolute;top:0;bottom:0;width:6px;border-radius:4px;background:#07040a;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.track .fill{position:absolute;bottom:0;width:6px;border-radius:4px;background:var(--cc);box-shadow:0 0 12px var(--cc);transition:height .12s}
.cap{position:absolute;left:50%;bottom:0;width:34px;height:22px;margin-left:-17px;transform:translateY(50%);border-radius:5px;cursor:grab;touch-action:none;background:linear-gradient(180deg,#f6efe8,#bfb2a9 48%,#8e8079 52%,#d9cec6);box-shadow:0 4px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.8);transition:bottom .12s,box-shadow .2s}
.cap::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;margin-top:-1px;background:var(--cc);border-radius:2px}
.cap:active{cursor:grabbing}
.cap:focus-visible{outline:2px solid #fff;outline-offset:3px}
.strip.drag .cap{box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 0 3px var(--cc)}
.vu{width:8px;height:100%;border-radius:3px;background:#07040a;display:flex;align-items:flex-end;overflow:hidden}
.vu i{display:block;width:100%;height:0;background:linear-gradient(0deg,#20c997 0 60%,#fcc419 60% 85%,#ff6b6b 85%);background-size:100% 230px;background-position:bottom;transition:height .9s var(--ease)}
.vu i.over{box-shadow:0 0 10px #ff6b6b}
.mix-tbl{margin-top:10px}
/* releases and artists */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rel-card,.art-card{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;transition:transform .35s var(--ease),box-shadow .35s var(--ease);animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.rel-card:hover,.art-card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 36px -20px rgba(40,10,30,.45)}
.cover{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:14px}
.rel-card .cover{transition:transform .5s var(--ease)}
.rel-card:hover .cover{transform:scale(1.03) rotate(1deg)}
.rc-t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rc-t b{display:block;font:800 1.05rem/1.15 var(--display);text-transform:uppercase}
.rc-t small,.rc-m{color:var(--muted);font-size:.78rem}
.rc-m{display:flex;justify-content:space-between;align-items:center;gap:8px}
.art-card .av{width:54px;height:54px;font-size:1rem;border-radius:16px}
.art-top{display:flex;gap:12px;align-items:center}
.art-top b{display:block;font:800 1.08rem/1.15 var(--display);text-transform:uppercase}
.art-top small{color:var(--muted);font-size:.78rem}
.art-n{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78rem;color:var(--muted)}
.art-n b{display:block;color:var(--text);font-size:1rem;font-variant-numeric:tabular-nums}
.d-cover{display:flex;gap:14px;align-items:center}
.d-cover .cover{width:96px;flex:none}
.d-list{display:grid;gap:6px}
.d-list button,.d-list div{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:.84rem;text-align:left;width:100%}
.d-list .cover{width:34px;border-radius:8px}
/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px}
.day{min-height:92px;border-radius:12px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .2s,outline-color .2s}
.day.out{opacity:.45}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{font-size:.74rem;font-weight:700;color:var(--muted)}
.day.today .dn{color:var(--accent)}
.ev{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:7px;font-size:.7rem;font-weight:650;background:color-mix(in srgb,var(--cc) 18%,var(--surface));color:var(--text);border-left:3px solid var(--cc);cursor:grab;touch-action:none;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .15s var(--ease)}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev .i{width:.9em;height:.9em;flex:none}
.ev:hover{transform:translateX(2px)}
.ev:focus-visible{outline:2px solid var(--accent)}
.more{font-size:.68rem;font-weight:700;color:var(--accent);text-align:left;padding:0 4px}
.hint{font-size:.78rem;margin-top:10px}
.agenda{display:grid;gap:8px}
.ag{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;font-size:.82rem}
.ag .dt{text-align:center;border-radius:12px;background:var(--surface-2);padding:5px 0;line-height:1.1}
.ag .dt b{display:block;font:800 1.15rem var(--display)}
.ag .dt small{font-size:.66rem;color:var(--muted);text-transform:uppercase}
.ag p{font-weight:650}
.ag small{color:var(--muted)}
/* reports and settings */
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rep-grid .wide{grid-column:1/-1}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted);font-size:.78rem}
.form-grid{display:grid;gap:12px}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.mini{grid-template-columns:repeat(3,minmax(0,1fr))}.ov-grid,.mix-wrap,.cal-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:960px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:262px;transform:translateX(-105%);transition:transform .38s var(--ease);box-shadow:20px 0 60px rgba(0,0,0,.35)}body.nav-open .side{transform:none}.scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(10,6,12,.5);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.search-btn{min-width:0}.search-btn span,.search-btn kbd{display:none}.top{padding:10px 14px}.view{padding:16px 14px 40px}}
@media (max-width:640px){.rep-grid,.set-grid{grid-template-columns:minmax(0,1fr)}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.spin-body{grid-template-columns:minmax(0,1fr)}.deck{margin:0 auto}.top .btn.primary span,.me span{display:none}.day{min-height:62px;padding:4px}.ev span{display:none}.ev{justify-content:center;padding:3px}.d-stats{grid-template-columns:1fr 1fr}.desk-strips{grid-template-columns:repeat(7,74px)}}
@media (max-width:400px){.kpis{grid-template-columns:minmax(0,1fr)}.readout{grid-template-columns:1fr 1fr}}
</style>
</head>

      <button type="button" class="search-btn" data-act="cmdk" aria-label="Search pages and actions"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>

function daysTo(iso) { const n = daysBetween(TODAY, iso); return n === 0 ? 'Today' : n > 0 ? `In ${n} day${n > 1 ? 's' : ''}` : `${-n} day${n < -1 ? 's' : ''} ago`; }

/* =====================================================================
   Signature moment: the Spin room. A vinyl spins while a needle plays
   through daily spend (above the line) and streams (below the line).
   ===================================================================== */
const VINYL = `<svg class="vinyl" viewBox="0 0 150 128" aria-hidden="true"><defs><radialGradient id="vsheen" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="rgba(255,255,255,.22)"/><stop offset=".5" stop-color="rgba(255,255,255,0)"/></radialGradient><linearGradient id="vlab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#d6336c"/></linearGradient></defs>
<g class="disc"><circle cx="62" cy="64" r="60" fill="#0d090f"/>${[54, 49, 44, 39, 34, 29].map(r => `<circle cx="62" cy="64" r="${r}" fill="none" stroke="rgba(255,255,255,${r % 2 ? 0.06 : 0.1})"/>`).join('')}<circle cx="62" cy="64" r="20" fill="url(#vlab)"/><path d="M62 49a15 15 0 0 1 13 7.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/><text x="62" y="76" text-anchor="middle" font-size="5.5" font-weight="700" fill="#fff" letter-spacing=".8">SIDE A</text><circle cx="62" cy="64" r="2.6" fill="#f5efe6"/></g>
<circle cx="62" cy="64" r="60" fill="url(#vsheen)" pointer-events="none"/>
<g class="arm"><circle cx="134" cy="12" r="7" fill="#c9bcb4" stroke="#7d6f69" stroke-width="2"/><path d="M134 12 L128 74 L108 96" stroke="#d9cec6" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="92" width="14" height="8" rx="2" fill="#f2542d" transform="rotate(38 107 96)"/></g></svg>`;
const WAVE = { cur: -1, n: 0, d: null, raf: 0, playing: false };
function drawWave(el, days, mode) {
  if (!el) return;
  const d = daily(days), W = Math.max(240, Math.round(el.clientWidth || 640)), H = 196, mid = 108, n = days, bw = W / n;
  const mS = Math.max(1, ...d.spend), mT = Math.max(1, ...d.streams);
  const tops = d.spend.map(v => (v / mS) * (mid - 14)), bots = d.streams.map(v => (v / mT) * (H - mid - 26));
  const prevCur = WAVE.cur, atEnd = WAVE.cur < 0 || WAVE.cur >= WAVE.n - 1;
  el._w = W; WAVE.d = d; WAVE.n = n; WAVE.bw = bw; WAVE.mid = mid; WAVE.el = el;
  let s = `<svg class="wave${mode === 'enter' ? ' enter' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="slider" aria-label="Playhead over daily spend and streams. Use the arrow keys." aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${n}">`;
  for (let i = 0; i < n; i++) {
    const x = f1(i * bw + bw * 0.16), w = f1(Math.max(1, bw * 0.68)), r = Math.min(2, bw * 0.3);
    s += `<rect class="wb t on" data-i="${i}" x="${x}" y="${f1(mid - 2 - tops[i])}" width="${w}" height="${f1(tops[i])}" rx="${r}" style="--i:${i}"/><rect class="wb b on" data-i="${i}" x="${x}" y="${mid + 2}" width="${w}" height="${f1(bots[i])}" rx="${r}" style="--i:${i}"/>`;
  }
  s += `<line class="wmid" x1="0" x2="${W}" y1="${mid}" y2="${mid}"/>`;
  [0, Math.floor(n / 2), n - 1].forEach((i, k) => { s += `<text x="${f1(k === 0 ? 0 : k === 2 ? W : i * bw + bw / 2)}" y="${H - 4}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${esc(d.labels[i])}</text>`; });
  s += `<g class="phg"><line class="phl" x1="0" x2="0" y1="4" y2="${H - 18}"/><circle class="phk" cx="0" cy="${mid}" r="7"/></g></svg>`;
  el.innerHTML = s;
  const svg = $('svg', el);
  if (mode === 'morph' && el._h) {
    const A = resample(el._h.tops.map((v, i) => [i, v]), n).map(p => p[1]), B = resample(el._h.bots.map((v, i) => [i, v]), n).map(p => p[1]);
    const ts = $$('.wb.t', svg), bs = $$('.wb.b', svg);
    const paint = e => { for (let i = 0; i < n; i++) { const t = lerp(A[i], tops[i], e), b = lerp(B[i], bots[i], e); ts[i].setAttribute('y', f1(mid - 2 - t)); ts[i].setAttribute('height', f1(t)); bs[i].setAttribute('height', f1(b)); } };
    paint(0); el._tw = tween(650, paint);
  }
  el._h = { tops, bots };
  const pos = e => { const r = svg.getBoundingClientRect(); return clamp(Math.floor(((e.clientX - r.left) * (W / (r.width || W))) / bw), 0, n - 1); };
  let down = false;
  svg.addEventListener('pointerdown', e => { down = true; stopPlay(); svg.setPointerCapture && svg.setPointerCapture(e.pointerId); setHead(pos(e)); });
  svg.addEventListener('pointermove', e => { if (down) setHead(pos(e)); });
  svg.addEventListener('pointerup', () => { down = false; });
  svg.addEventListener('keydown', e => {
    const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 7, PageDown: -7 }[e.key];
    if (k) { e.preventDefault(); stopPlay(); setHead(clamp(WAVE.cur + k, 0, n - 1)); }
    if (e.key === 'Home') { e.preventDefault(); setHead(0); } if (e.key === 'End') { e.preventDefault(); setHead(n - 1); }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePlay(); }
  });
  setHead(atEnd && !WAVE.playing ? n - 1 : clamp(prevCur, 0, n - 1));
}
function setHead(i) {
  const el = WAVE.el; if (!el || !el.isConnected || !WAVE.d) return;
  i = clamp(Math.round(i), 0, WAVE.n - 1); const svg = $('svg', el);
  if (i !== WAVE.cur || !svg._set) { $$('.wb', svg).forEach(b => b.classList.toggle('on', +b.dataset.i <= i)); svg._set = 1; }
  WAVE.cur = i;
  const x = f1(i * WAVE.bw + WAVE.bw / 2), g = $('.phg', svg);
  g.setAttribute('transform', `translate(${x},0)`); svg.setAttribute('aria-valuenow', i + 1); svg.setAttribute('aria-valuetext', WAVE.d.labels[i]);
  const d = WAVE.d, top = CHANNELS.map(c => [c, d.by[c.id][i]]).sort((a, b) => b[1] - a[1])[0];
  const ro = $('#readout');
  if (ro) ro.innerHTML = `<div><small>Day</small><b>${esc(d.labels[i])}</b></div><div><small>Spend</small><b>${money(d.spend[i])}</b></div><div><small>Streams</small><b>${short(d.streams[i])}</b></div><div><small>Loudest channel</small><b>${top && top[1] > 0 ? esc(top[0].name) : 'Quiet day'}</b></div>`;
}
function stopPlay() { WAVE.playing = false; cancelAnimationFrame(WAVE.raf); const c = $('.spin'); if (c) c.classList.remove('playing'); const b = $('#playBtn'); if (b) b.innerHTML = ic('play') + '<span>Play</span>'; }
function togglePlay() {
  if (WAVE.playing) { stopPlay(); return; }
  if (!WAVE.el || !WAVE.el.isConnected) return;
  WAVE.playing = true; $('.spin').classList.add('playing'); $('#playBtn').innerHTML = ic('pause') + '<span>Pause</span>';
  let from = WAVE.cur >= WAVE.n - 1 ? 0 : WAVE.cur, t0 = null; const dur = 3600 * ((WAVE.n - from) / WAVE.n);
  if (RM) { setHead(WAVE.n - 1); stopPlay(); return; }
  const step = now => { if (!WAVE.playing) return; if (t0 === null) t0 = now; const p = Math.min(1, (now - t0) / Math.max(400, dur)); setHead(from + (WAVE.n - 1 - from) * p); if (p < 1) WAVE.raf = requestAnimationFrame(step); else stopPlay(); };
  setHead(from); WAVE.raf = requestAnimationFrame(step);
}
ACT.play = () => togglePlay();
SEG.range = v => { UI.range = +v; stopPlay(); refresh(); };

  <section class="kpis">${kpiCard('k-spend', 'Ad spend', 'wallet')}${kpiCard('k-streams', 'Streams from ads', 'headphones', 'var(--c3)')}${kpiCard('k-cpk', 'Cost per 1K streams', 'target', 'var(--c4)')}${kpiCard('k-live', 'Live campaigns', 'zap', 'var(--c5)')}</section>
  <section class="ov-grid">

/* ---------- budget mixer ---------- */
function buildDesk() {
  const spent = quarterBy();
  $('#desk').innerHTML = CHANNELS.map(c => `<div class="strip" data-ch="${c.id}" style="--cc:${c.color}"><b class="st-v" id="fv-${c.id}"></b><div class="fader"><div class="vu" title="Spent this quarter"><i id="vu-${c.id}"></i></div><div class="track" data-track="${c.id}"><div class="fill" id="ff-${c.id}"></div><div class="cap" role="slider" tabindex="0" id="fc-${c.id}" data-ch="${c.id}" aria-label="${esc(c.name)} budget" aria-valuemin="0" aria-valuemax="${MAXF}"></div></div></div><span class="st-n">${esc(c.name)}</span><small id="fs-${c.id}">${moneyS(spent[c.id])} spent</small></div>`).join('') +
    `<div class="strip master" style="--cc:#ff7448"><b class="st-v" id="fv-free"></b><div class="fader"><div class="vu"><i id="vu-free"></i></div><div class="track"><div class="fill" id="ff-free"></div></div></div><span class="st-n">Not placed</span><small id="fs-free"></small></div>`;
  $$('.cap', $('#desk')).forEach(cap => {
    const id = cap.dataset.ch, strip = cap.closest('.strip'), track = cap.parentNode;
    const at = e => { const r = track.getBoundingClientRect(); return (1 - clamp((e.clientY - r.top) / (r.height || 1), 0, 1)) * MAXF; };
    cap.addEventListener('pointerdown', e => { e.preventDefault(); cap.setPointerCapture && cap.setPointerCapture(e.pointerId); strip.classList.add('drag'); cap.focus(); });
    cap.addEventListener('pointermove', e => { if (strip.classList.contains('drag')) setAlloc(id, at(e)); });
    const end = () => { if (strip.classList.contains('drag')) { strip.classList.remove('drag'); mixUpdate(true); } };
    cap.addEventListener('pointerup', end); cap.addEventListener('pointercancel', end);
    cap.addEventListener('keydown', e => {
      const step = { ArrowUp: 25000, ArrowRight: 25000, ArrowDown: -25000, ArrowLeft: -25000, PageUp: 100000, PageDown: -100000 }[e.key];
      if (step) { e.preventDefault(); setAlloc(id, UI.mix[id] + step); mixUpdate(true); }
      if (e.key === 'Home') { e.preventDefault(); setAlloc(id, 0); mixUpdate(true); }
      if (e.key === 'End') { e.preventDefault(); setAlloc(id, MAXF); mixUpdate(true); }
    });
    // clicking the track jumps the fader there
    track.addEventListener('pointerdown', e => { if (e.target === track || e.target.classList.contains('fill')) { setAlloc(id, at(e)); mixUpdate(true); } });
  });
}
function setAlloc(id, v) {
  const others = sum(Object.entries(UI.mix).filter(([k]) => k !== id).map(([, x]) => x));
  v = clamp(Math.round(v / 5000) * 5000, 0, Math.min(MAXF, DB.quarter - others));
  if (v === UI.mix[id]) return;
  UI.mix[id] = v; mixUpdate(false);
}
function mixUpdate(full) {
  if (!$('#desk')) return;
  const spent = quarterBy(), used = sum(Object.values(UI.mix)), free = Math.max(0, DB.quarter - used);
  CHANNELS.forEach(c => {
    const v = UI.mix[c.id] || 0, p = (v / MAXF) * 100, cap = $('#fc-' + c.id);
    cap.style.bottom = p + '%'; $('#ff-' + c.id).style.height = p + '%'; $('#fv-' + c.id).textContent = moneyS(v);
    cap.setAttribute('aria-valuenow', v); cap.setAttribute('aria-valuetext', money(v));
    const vu = $('#vu-' + c.id), r = v ? spent[c.id] / v : spent[c.id] ? 1.2 : 0;
    vu.style.height = clamp(r * 100, 0, 100) + '%'; vu.classList.toggle('over', r > 1);
  });
  const fp = (free / DB.quarter) * 100;
  $('#ff-free').style.height = clamp(fp, 0, 100) + '%'; $('#vu-free').style.height = clamp(fp, 0, 100) + '%'; $('#fv-free').textContent = moneyS(free); $('#fs-free').textContent = `of ${moneyS(DB.quarter)}`;
  const dirty = JSON.stringify(UI.mix) !== JSON.stringify(DB.alloc), st = $('#mix-state');
  st.textContent = dirty ? 'Unsaved changes' : 'Saved'; st.className = 'badge ' + (dirty ? 'warn' : 'ok');
  if (!full) return;
  plot('#mix-donut', 'donut', { items: CHANNELS.map(c => ({ label: c.name, value: UI.mix[c.id] || 0, color: c.color })).concat(free ? [{ label: 'Not placed', value: free, color: 'var(--line)' }] : []), fmt: 'moneyS', center: moneyS(used), sub: 'Placed', size: 150, thick: 18 });
  table('#mix-tbl', { search: false, size: 7, rows: () => CHANNELS.map(c => ({ id: c.id, name: c.name, color: c.color, alloc: UI.mix[c.id] || 0, spent: spent[c.id], left: (UI.mix[c.id] || 0) - spent[c.id] })), cols: [{ k: 'name', label: 'Channel', f: (v, r) => `<span class="chdot" style="--cc:${r.color}">${esc(v)}</span>` }, { k: 'alloc', label: 'Placed', num: true, f: v => moneyS(v) }, { k: 'spent', label: 'Spent', num: true, f: v => moneyS(v) }, { k: 'left', label: 'Left', num: true, f: v => `<span style="color:${v < 0 ? 'var(--bad)' : 'inherit'}">${moneyS(v)}</span>` }], onRow: r => { const c = $('#fc-' + r.id); if (c) c.focus(); } });
}
function glideTo(target, msg) {
  const from = clone(UI.mix);
  tween(700, e => { CHANNELS.forEach(c => { UI.mix[c.id] = Math.round(lerp(from[c.id] || 0, target[c.id], e) / 5000) * 5000; }); mixUpdate(false); }, () => { UI.mix = target; mixUpdate(true); toast(msg, 'info'); });
}
ACT.mixEven = () => { const each = Math.floor(DB.quarter / CHANNELS.length / 5000) * 5000, t = {}; CHANNELS.forEach(c => { t[c.id] = Math.min(MAXF, each); }); glideTo(t, 'Budget split evenly'); };
ACT.mixSmart = () => {
  const m = monthly(6), score = {}, t = {};
  CHANNELS.forEach(c => { const sp = sum(m.by[c.id]), st = sum(DB.camps.filter(x => x.channel === c.id).map(x => x.streams)); score[c.id] = sp ? Math.sqrt(st / sp) : 0.5; });
  const tot = sum(Object.values(score)) || 1;
  CHANNELS.forEach(c => { t[c.id] = Math.min(MAXF, Math.floor(((DB.quarter * 0.96 * score[c.id]) / tot) / 5000) * 5000); });
  glideTo(t, 'Weighted toward channels that bring the most streams per rupee');
};
ACT.mixUndo = () => { glideTo(clone(DB.alloc), 'Back to the saved mix'); };
ACT.mixSave = () => { DB.alloc = clone(UI.mix); save(); mixUpdate(true); toast('Budget mix saved'); note('Quarter budget mix updated', 'sliders'); };

function calEvents() {
  const ev = [];
  DB.releases.forEach(r => ev.push({ key: 'r:' + r.id, date: r.date, title: r.title, icon: 'disc', color: `hsl(${r.hue} 70% 52%)`, sub: `${r.type} release · ${art(r.artist).name}` }));
  DB.camps.forEach(c => { if (c.status !== 'Done') ev.push({ key: 'c:' + c.id, date: c.start, title: c.name, icon: 'mega', color: chById(c.channel).color, sub: `${chById(c.channel).name} starts · ${moneyS(c.budget)}` }); });
  return ev;
}
function drawCal() {
  const m = UI.cal, first = new Date(m.getFullYear(), m.getMonth(), 1), start = addDays(first, -((first.getDay() + 6) % 7)), ev = calEvents(), cal = $('#cal');
  if (!cal) return;
  $('#cal-title').textContent = `${MON[m.getMonth()]} ${m.getFullYear()}`;
  let s = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), iso = isoD(d), list = ev.filter(e => e.date === iso), out = d.getMonth() !== m.getMonth();
    s += `<div class="day${out ? ' out' : ''}${iso === isoD(TODAY) ? ' today' : ''}" data-date="${iso}" aria-label="${ddy(d)}"><span class="dn">${d.getDate()}</span>${list.slice(0, 3).map(e => `<div class="ev" role="button" tabindex="0" data-ev="${e.key}" style="--cc:${e.color}" title="${esc(e.title)}">${ic(e.icon)}<span>${esc(e.title)}</span></div>`).join('')}${list.length > 3 ? `<button type="button" class="more" data-act="calMore" data-date="${iso}">+${list.length - 3} more</button>` : ''}</div>`;
  }
  cal.innerHTML = s;
  const ag = ev.filter(e => { const n = daysBetween(TODAY, e.date); return n >= 0 && n < 14; }).sort((a, b) => a.date.localeCompare(b.date));
  $('#agenda').innerHTML = ag.length ? ag.slice(0, 9).map(e => { const d = parseD(e.date); return `<div class="ag"><div class="dt"><b>${d.getDate()}</b><small>${MON[d.getMonth()]}</small></div><div><p>${esc(e.title)}</p><small>${esc(e.sub)}</small></div></div>`; }).join('') : `<div class="empty">${ic('cal')}<p>Nothing planned in the next two weeks</p></div>`;
  if (!cal._dnd) {
    cal._dnd = 1;
    let dragged = 0;
    dnd(cal, '.ev', '.day', (item, day) => moveEv(item.dataset.ev, day.dataset.date), { onEnd: () => { dragged = Date.now(); } });
    const open = el => { const key = el.dataset.ev, e = calEvents().find(x => x.key === key); if (!e) return; popMenu(el, [{ label: 'Open details', icon: 'eye', fn: () => (key[0] === 'r' ? ACT.relOpen({ dataset: { id: key.slice(2) } }) : campDrawer(camp(key.slice(2)))) }, { label: 'Move 1 day later', icon: 'chev', fn: () => moveEv(key, isoD(addDays(parseD(e.date), 1))) }, { label: 'Move 1 day earlier', icon: 'chevl', fn: () => moveEv(key, isoD(addDays(parseD(e.date), -1))) }, { label: 'Move 1 week later', icon: 'repeat', fn: () => moveEv(key, isoD(addDays(parseD(e.date), 7))) }, { label: 'Move to a date…', icon: 'cal', fn: () => pickDate(key, e) }], { title: e.title }); };
    cal.addEventListener('click', e => { const el = e.target.closest('.ev'); if (el && Date.now() - dragged > 250) open(el); });
    cal.addEventListener('keydown', e => { const el = e.target.closest('.ev'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(el); } });
  }
}
function pickDate(key, e) {
  modal({ title: 'Move to…', ok: 'Move', body: `<p class="m-text">${esc(e.title)}</p>` + field('New date', 'date', { type: 'date', value: e.date }), onOk: f => { if (!validate(f, { date: V.date })) return false; moveEv(key, f.elements.date.value); } });
}
function moveEv(key, iso) {
  const [t, id] = key.split(':');
  if (t === 'r') { const r = rel(id); if (!r.id || r.date === iso) return; r.date = iso; toast(`“${r.title}” moved to ${dd(iso)}`); }
  else { const c = camp(id); if (!c || c.start === iso) return; const shift = daysBetween(c.start, iso); c.start = iso; c.end = isoD(addDays(parseD(c.end), shift)); if (c.status === 'Scheduled' && daysBetween(TODAY, iso) <= 0) c.status = 'Live'; toast(`“${c.name}” now starts ${dd(iso)}`); }
  save(); drawCal();
}
ACT.calMove = b => { const v = +b.dataset.v; UI.cal = v ? addMonths(UI.cal, v) : new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); drawCal(); };
ACT.calMore = b => { const list = calEvents().filter(e => e.date === b.dataset.date); popMenu(b, list.map(e => ({ label: e.title, icon: e.icon, fn: () => (e.key[0] === 'r' ? ACT.relOpen({ dataset: { id: e.key.slice(2) } }) : campDrawer(camp(e.key.slice(2)))) })), { title: ddy(b.dataset.date) }); };

/* ---------- reports ---------- */
function scorecard(m) {
  const tot = sum(m.spend) || 1;
  return CHANNELS.map(c => { const sp = sum(m.by[c.id]), st = Math.round(sum(DB.camps.filter(x => x.channel === c.id).map(x => x.streams)) * (sp / Math.max(1, sum(DB.camps.filter(x => x.channel === c.id).map(x => x.spent))))); return { id: c.id, name: c.name, color: c.color, spend: Math.round(sp), streams: st, cpk: st ? (sp / st) * 1000 : 0, share: (sp / tot) * 100 }; });
}
SEG.rep = v => { UI.rep = +v; refresh(); };
ACT.exportRep = () => { const m = monthly(UI.rep); download(`hookline-report-${UI.rep}m.csv`, csv([['Month', ...CHANNELS.map(c => c.name), 'Total spend', 'Streams'], ...m.labels.map((l, i) => [l, ...CHANNELS.map(c => Math.round(m.by[c.id][i])), Math.round(m.spend[i]), Math.round(m.streams[i])])])); };

/* ---------- start ---------- */
APP.cmds = [
  { label: 'New campaign', icon: 'plus', fn: () => campForm(null) },
  { label: 'Add release', icon: 'disc', fn: () => ACT.newRel() },
  { label: 'Add artist', icon: 'user', fn: () => ACT.newArt() },
  { label: 'Export campaigns CSV', icon: 'download', fn: () => ACT.exportCamps() },
  { label: 'Switch theme', icon: 'moon', fn: () => ACT.theme() }
];
APP.onRoute = () => { sideMeter(); if (APP.cur !== 'overview') stopPlay(); };
APP.onTheme = () => { if (APP.cur === 'overview') drawWave($('#wave'), UI.range, 'instant'); };
$('#nav').insertAdjacentHTML('beforeend', navLinks());
note('“Neon Chai · Launch push” is pacing 18% ahead of plan', 'alert', 42);
note('Mehr Lune passed 100K monthly listeners', 'star', 180);
note('Weekly digest is ready', 'mail', 60 * 26, true);
addEventListener('resize', () => { if (APP.cur === 'overview' && $('#wave') && Math.abs(($('#wave')._w || 0) - $('#wave').clientWidth) > 4) drawWave($('#wave'), UI.range, 'instant'); });
startApp();
</script>
