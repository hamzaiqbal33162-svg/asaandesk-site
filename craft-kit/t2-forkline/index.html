<!doctype html>
<!-- Chill & Craft · Forkline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forkline · Split button with menu</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg-a: #efe9ff;
    --bg-b: #dfeaff;
    --card: #ffffff;
    --ink: #1c1640;
    --muted: #6d6890;
    --line: rgba(28, 22, 64, 0.1);
    --soft: #f4f1ff;
    --accent: #6246ea;
    --accent-b: #4a2fd0;
    --accent-c: #8f7bff;
    --menu: #ffffff;
    --hl: #efeaff;
    --bar: #d9d2ff;
    --focus: #6246ea;
    --shadow: rgba(50, 30, 140, 0.4);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg-a: #15112f;
    --bg-b: #0d0b20;
    --card: #1d1838;
    --ink: #f0edff;
    --muted: #a7a1cc;
    --line: rgba(240, 237, 255, 0.1);
    --soft: #262046;
    --accent: #7c62ff;
    --accent-b: #5a3ff0;
    --accent-c: #a593ff;
    --menu: #262046;
    --hl: #342b62;
    --bar: #3d3470;
    --focus: #b9aaff;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg-b);
  }

  /* ---------- Stage: soft violet with slow floating rings ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 26px 16px; overflow: hidden; background: radial-gradient(90% 80% at 80% 10%, var(--bg-a), var(--bg-b)); }
  .orb { position: absolute; border-radius: 50%; border: 2px solid var(--accent-c); opacity: 0.18; pointer-events: none; animation: bob 12s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(18px, -22px) scale(1.05); } }

  /* ---------- Report card ---------- */
  .card { position: relative; width: min(460px, 100%); padding: clamp(16px, 4vw, 24px); border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 40px 80px -46px var(--shadow); }
  .hd { display: flex; align-items: center; gap: 12px; }
  .doc { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
  .doc svg { width: 22px; height: 22px; }
  h1 { margin: 0; font-size: 1.02rem; font-weight: 750; }
  .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
  .chart { margin: 16px 0 6px; height: 92px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .b { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
  @keyframes grow { from { transform: scaleY(0); } }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 18px; }
  .kpis div { padding: 9px clamp(7px, 2vw, 10px); border-radius: 12px; background: var(--soft); min-width: 0; }
  .kpis dt { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpis dd { margin: 2px 0 0; font-size: clamp(0.74rem, 3.1vw, 0.86rem); font-weight: 750; white-space: nowrap; }

  /* ---------- Actions row with the split button ---------- */
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hint { margin: 0; font-size: 0.78rem; color: var(--muted); min-width: 0; line-height: 1.3; }
  .split { position: relative; flex: none; display: inline-flex; align-items: stretch; gap: 2px; }
  .split button { font: inherit; border: 0; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .main, .caret { position: relative; background: linear-gradient(180deg, var(--accent), var(--accent-b)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 20px -12px var(--accent-b); }
  /* .split .main beats the `.split button { font: inherit }` reset above */
  .split .main { display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 16px 0 10px; border-radius: 15px 5px 5px 15px; font-weight: 750; font-size: 0.9rem; overflow: hidden; }
  .caret { width: 44px; height: 46px; border-radius: 5px 15px 15px 5px; display: grid; place-items: center; }
  .main:focus-visible, .caret:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; z-index: 2; }
  .main:hover, .caret:hover { filter: brightness(1.08); }
  .mico { position: relative; z-index: 1; width: 28px; height: 28px; flex: none; display: grid; place-items: center; }
  .mico svg, .fi svg, .chip svg { width: 100%; height: 100%; display: block; }
  .mlbl { position: relative; z-index: 1; display: inline-grid; overflow: hidden; height: 1.3em; line-height: 1.3em; white-space: nowrap; }
  .mlbl span { grid-area: 1 / 1; }
  .split.busy .mlbl { min-width: 2.8em; justify-items: center; font-variant-numeric: tabular-nums; }
  .bar { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.22) 0 10px, rgba(255, 255, 255, 0.1) 10px 20px); background-size: 40px 100%; animation: stripes 0.7s linear infinite; }
  @keyframes stripes { to { background-position: 40px 0; } }
  .chev { width: 16px; height: 16px; transition: opacity 0.2s; }
  .spin { position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; opacity: 0; animation: turn 0.7s linear infinite; transition: opacity 0.2s; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .split.busy .chev { opacity: 0; }
  .split.busy .spin { opacity: 1; }
  .split.busy .caret { cursor: progress; }
  .seam { position: absolute; z-index: 3; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: #fff; opacity: 0; pointer-events: none; }

  /* ---------- The menu: items fold down like paper ---------- */
  .menu { position: absolute; z-index: 10; right: 0; top: calc(100% + 10px); width: min(272px, calc(100vw - 48px)); padding: 6px; border-radius: 18px; background: var(--menu); box-shadow: 0 0 0 1px var(--line), 0 30px 60px -24px var(--shadow); perspective: 600px; transform-origin: 85% 0; }
  .menu.up { top: auto; bottom: calc(100% + 10px); transform-origin: 85% 100%; }
  .menu[hidden] { display: none; }
  .hl { position: absolute; left: 6px; right: 6px; top: 0; height: 52px; border-radius: 13px; background: var(--hl); pointer-events: none; }
  .item { position: relative; display: flex; width: 100%; align-items: center; gap: 11px; padding: 9px 10px; border: 0; border-radius: 13px; background: none; color: var(--ink) !important; text-align: left; transform-origin: 50% 0; }
  .item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .fi { width: 30px; height: 30px; flex: none; }
  .item b { display: block; font-size: 0.86rem; }
  .item small { display: block; font-size: 0.72rem; color: var(--muted); }
  .item .chk { margin-left: auto; width: 18px; height: 18px; color: var(--accent); opacity: 0; transform: scale(0.4); transition: opacity 0.2s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .item[aria-checked="true"] .chk { opacity: 1; transform: none; }

  /* ---------- Recent exports ---------- */
  .recent { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .recent p { margin: 0 0 8px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; gap: 8px; min-height: 34px; overflow-x: clip; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; max-width: 46%; height: 34px; padding: 0 11px 0 6px; border-radius: 11px; background: var(--soft); font-size: 0.76rem; font-weight: 650; }
  .chip svg { width: 22px; height: 22px; flex: none; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip em { font-style: normal; color: var(--muted); font-weight: 500; }
  .none { font-size: 0.78rem; color: var(--muted); align-self: center; }
  .ghost, .bit { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 20; }
  .ghost { width: 30px; height: 30px; }
  .bit { width: 7px; height: 5px; border-radius: 1px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.25; } }
  @media (prefers-reduced-motion: reduce) {
    .orb, .chart .b, .bar, .spin { animation: none; }
    .item .chk, .chev, .spin { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <i class="orb" style="width: 220px; height: 220px; left: -60px; top: 8%" aria-hidden="true"></i>
    <i class="orb" style="width: 140px; height: 140px; right: 6%; bottom: 6%; animation-delay: -5s" aria-hidden="true"></i>
    <section class="card" id="card" aria-labelledby="ttl">
      <header class="hd">
        <span class="doc" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M14 3v5h5M8.5 17v-3M12 17v-6M15.5 17v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg></span>
        <div>
          <h1 id="ttl">November sales report</h1>
          <p class="sub">Bano's Bakery, Lahore · 30 days · 2,418 orders</p>
        </div>
      </header>
      <div class="chart" aria-hidden="true"><svg id="chart" viewBox="0 0 300 92" preserveAspectRatio="none"></svg></div>
      <dl class="kpis">
        <div><dt>Revenue</dt><dd>PKR 1.84M</dd></div>
        <div><dt>Average order</dt><dd>PKR 762</dd></div>
        <div><dt>Best day</dt><dd>Sat 22 Nov</dd></div>
      </dl>
      <div class="actions">
        <p class="hint" id="hint" aria-live="polite">Pick a format with the arrow, then export.</p>
        <div class="split" id="split">
          <button class="main" id="main" type="button" aria-describedby="hint"><span class="bar" id="bar"></span><span class="mico" id="mico" aria-hidden="true"></span><span class="mlbl" id="mlbl"><span>Export PDF</span></span></button>
          <button class="caret" id="caret" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Choose export format"><svg class="chev" id="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg><i class="spin" aria-hidden="true"></i></button>
          <i class="seam" id="seam" aria-hidden="true"></i>
          <div class="menu" id="menu" role="menu" aria-label="Export format" hidden><span class="hl" id="hl" aria-hidden="true"></span></div>
        </div>
      </div>
      <div class="recent">
        <p>Recent exports</p>
        <div class="chips" id="chips"><span class="none" id="none">Nothing exported yet</span></div>
      </div>
    </section>
  </main>

<script>
  // Forkline: a split button. The main half runs the export, the arrow half opens a menu of formats.
  // Open = the halves pull apart along the seam, the arrow flips with overshoot and the items fold down one by one.
  // Pick = the menu folds away, the chosen file badge flies along an arc into the main half and the label rolls.
  // Export = the button dips, a striped bar fills it in stages, then a tick draws, paper bits pop and the file
  // lands in Recent exports before the button rolls back to its label.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var card = $("card"), split = $("split"), main = $("main"), caret = $("caret"), chev = $("chev"), seam = $("seam");
    var menu = $("menu"), hl = $("hl"), mico = $("mico"), mlbl = $("mlbl"), bar = $("bar"), hint = $("hint"), chips = $("chips"), none = $("none");
    var FORMATS = [
      { k: "pdf", ext: "PDF", name: "PDF document", note: "Print-ready, 3 pages", label: "Export PDF", file: "report-nov.pdf", size: "248 KB", color: "#f0545c", stages: ["Gathering 2,418 orders", "Drawing the charts", "Saving the PDF"] },
      { k: "xlsx", ext: "XLS", name: "Spreadsheet", note: "Every order, with totals", label: "Export sheet", file: "orders-nov.xlsx", size: "96 KB", color: "#1fae6e", stages: ["Gathering 2,418 orders", "Adding totals", "Saving the sheet"] },
      { k: "csv", ext: "CSV", name: "CSV data", note: "Plain rows for any tool", label: "Export CSV", file: "orders-nov.csv", size: "61 KB", color: "#f19a1f", stages: ["Gathering 2,418 orders", "Writing rows", "Saving the file"] },
      { k: "png", ext: "PNG", name: "PNG image", note: "The chart at double size", label: "Export image", file: "chart-nov.png", size: "184 KB", color: "#3f86ff", stages: ["Drawing the chart", "Sharpening", "Saving the image"] },
      { k: "link", ext: "", name: "Share link", note: "View only, ends in 7 days", label: "Share link", file: "View-only link", size: "7 days", color: "#9a5cff", stages: ["Making a copy", "Locking edits", "Creating the link"] }
    ];
    var cur = 0, open = false, busy = false, hot = 0, runId = 0;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function spring(stiff, damp) {
      var x = 0, v = 0, out = [0];
      for (var i = 0; i < 240; i++) { v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; out.push(x); if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break; }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiff, damp, delay) {
      var c = spring(stiff, damp);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear", delay: delay || 0, fill: "backwards" });
    }
    function done(a) { return a.finished.catch(function () {}); }
    function icon(f) {
      if (f.k === "link") return '<svg viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24" rx="8" fill="' + f.color + '"/><path d="M12 16l4-4M10.4 13.2l-1.5 1.5a2.9 2.9 0 0 0 4.1 4.1l1.5-1.5M17.6 14.8l1.5-1.5a2.9 2.9 0 0 0-4.1-4.1l-1.5 1.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
      return '<svg viewBox="0 0 28 28"><path d="M7 2h10.5L23 7.5V24a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="' + f.color + '"/><path d="M17.5 2v5.5H23" fill="rgba(255,255,255,0.45)"/><text x="14" y="20" text-anchor="middle" font-size="7.2" font-weight="800" fill="#fff" font-family="system-ui, sans-serif">' + f.ext + '</text></svg>';
    }
    var TICK = '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#22c58b"/><path class="tk" d="M8.5 14.5l3.6 3.6 7.4-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';

    // ---------- Chart: 30 days of orders, drawn once ----------
    (function chart() {
      var svg = $("chart"), out = "", pts = [];
      for (var d = 0; d < 30; d++) {
        var v = 34 + Math.sin(d * 0.55) * 14 + Math.sin(d * 1.7) * 7 + (d % 7 === 5 ? 22 : 0) + d * 0.5;
        var x = d * 10 + 1.5, h = Math.max(10, v);
        out += '<rect class="b" x="' + x + '" y="' + (92 - h) + '" width="7" height="' + h + '" rx="2" fill="url(#bars)" style="animation-delay:' + (d * 18) + 'ms"/>';
        pts.push((x + 3.5) + "," + (92 - h - 6));
      }
      svg.innerHTML = '<defs><linearGradient id="bars" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--accent-c)"/><stop offset="1" style="stop-color: var(--bar)"/></linearGradient></defs>' + out +
        '<polyline points="' + pts.join(" ") + '" fill="none" style="stroke: var(--accent)" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.7"/>';
    })();

    // ---------- Menu items ----------
    var items = FORMATS.map(function (f, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "item";
      b.setAttribute("role", "menuitemradio");
      b.setAttribute("aria-checked", String(i === cur));
      b.tabIndex = -1;
      b.innerHTML = '<span class="fi" aria-hidden="true">' + icon(f) + '</span><span><b>' + f.name + '</b><small>' + f.note + '</small></span>' +
        '<svg class="chk" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      b.addEventListener("click", function () { choose(i, true); });
      b.addEventListener("pointermove", function () { if (hot !== i) moveHl(i); });
      b.addEventListener("focus", function () { if (hot !== i) moveHl(i); });
      menu.appendChild(b);
      return b;
    });
    mico.innerHTML = icon(FORMATS[cur]);

    // the highlight pill glides to the hovered or focused item
    function moveHl(i, instant) {
      var from = hot, a = items[from], b = items[i];
      hot = i;
      hl.getAnimations().forEach(function (x) { x.cancel(); });
      hl.style.transform = "translateY(" + b.offsetTop + "px)";
      hl.style.height = b.offsetHeight + "px";
      if (instant || calm.matches || !a) return;
      var y0 = a.offsetTop, y1 = b.offsetTop;
      springTo(hl, function (p) { var s = Math.sin(p * Math.PI) * 0.06; return { transform: "translateY(" + (y0 + (y1 - y0) * p).toFixed(1) + "px) scale(" + (1 - s).toFixed(3) + "," + (1 + s).toFixed(3) + ")" }; }, 320, 22);
    }

    // ---------- Open and close ----------
    function pullHalves(apart) {
      if (calm.matches) return;
      var gap = apart ? 4 : 0, from = apart ? 0 : 4;
      main.getAnimations().forEach(function (a) { if (a.id === "half") a.cancel(); });
      caret.getAnimations().forEach(function (a) { if (a.id === "half") a.cancel(); });
      var am = springTo(main, function (p) { return { transform: "translateX(" + (-(from + (gap - from) * p)).toFixed(2) + "px)" }; }, 300, 14);
      var ac = springTo(caret, function (p) { return { transform: "translateX(" + (from + (gap - from) * p).toFixed(2) + "px)" }; }, 300, 14);
      am.id = ac.id = "half";
      // keep the parted position while open
      main.style.transform = apart ? "translateX(-4px)" : "";
      caret.style.transform = apart ? "translateX(4px)" : "";
      // a little flash runs along the seam as they part or click shut
      seam.style.left = main.offsetWidth + "px";
      seam.animate([{ opacity: 0, transform: "scaleY(0.2)" }, { opacity: 0.9, transform: "scaleY(1)", offset: 0.3 }, { opacity: 0, transform: "scaleY(1.1)" }], { duration: 380, easing: "ease-out" });
    }
    function placeMenu() {
      menu.classList.remove("up");
      var r = split.getBoundingClientRect(), need = menu.offsetHeight * (r.height / split.offsetHeight || 1) + 20;
      if (r.bottom + need > innerHeight && r.top - need > 0) menu.classList.add("up");
    }
    function openMenu(focusIdx, fromDemo) {
      if (open || busy) return;
      open = true;
      // drop any half-finished fold-away from a quick close
      menu.getAnimations().forEach(function (a) { a.cancel(); });
      items.forEach(function (b) { b.getAnimations().forEach(function (a) { a.cancel(); }); });
      caret.setAttribute("aria-expanded", "true");
      menu.hidden = false;
      placeMenu();
      moveHl(focusIdx == null ? cur : focusIdx, true);
      if (!fromDemo) items[hot].focus();
      pullHalves(true);
      if (calm.matches) { chev.style.transform = "rotate(180deg)"; return; }
      chev.getAnimations().forEach(function (a) { a.cancel(); });
      chev.style.transform = "rotate(180deg)";
      springTo(chev, function (p) { return { transform: "rotate(" + (180 * p).toFixed(1) + "deg)" }; }, 260, 12);
      var up = menu.classList.contains("up") ? -1 : 1;
      springTo(menu, function (p) { return { transform: "translateY(" + ((1 - p) * -10 * up).toFixed(1) + "px) scale(" + (0.92 + 0.08 * p).toFixed(3) + ")", opacity: Math.min(1, p * 2) }; }, 320, 20);
      items.forEach(function (b, i) {
        springTo(b, function (p) { return { transform: "rotateX(" + ((1 - p) * -82 * up).toFixed(1) + "deg) translateY(" + ((1 - p) * -6 * up).toFixed(1) + "px)", opacity: Math.min(1, p * 1.6) }; }, 240, 15, 40 + i * 42);
      });
      hl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 120, fill: "backwards" });
    }
    function closeMenu(returnFocus) {
      if (!open) return Promise.resolve();
      open = false;
      caret.setAttribute("aria-expanded", "false");
      pullHalves(false);
      chev.style.transform = "";
      if (returnFocus) caret.focus();
      if (calm.matches) { menu.hidden = true; return Promise.resolve(); }
      springTo(chev, function (p) { return { transform: "rotate(" + (180 - 180 * p).toFixed(1) + "deg)" }; }, 260, 12);
      var up = menu.classList.contains("up") ? -1 : 1;
      items.forEach(function (b, i) {
        b.animate([{ transform: "none", opacity: 1 }, { transform: "rotateX(" + 70 * up + "deg)", opacity: 0 }], { duration: 150, delay: (items.length - 1 - i) * 22, easing: "ease-in", fill: "forwards" });
      });
      var a = menu.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(" + -6 * up + "px) scale(0.96)" }], { duration: 200, delay: 110, easing: "ease-in", fill: "forwards" });
      return done(a).then(function () {
        if (open) return; // reopened meanwhile
        menu.hidden = true;
        menu.getAnimations().forEach(function (x) { x.cancel(); });
        items.forEach(function (b) { b.getAnimations().forEach(function (x) { x.cancel(); }); });
      });
    }

    // ---------- Label roll with a smooth width change ----------
    function setLabel(text, up) {
      var old = mlbl.lastElementChild, w0 = mlbl.offsetWidth;
      if (old && old.textContent === text) return;
      [].slice.call(mlbl.children, 0, -1).forEach(function (c) { c.remove(); });
      var next = document.createElement("span");
      next.textContent = text;
      mlbl.appendChild(next);
      if (calm.matches) { if (old) old.remove(); return; }
      var w1 = next.offsetWidth, d = up === false ? -1 : 1;
      if (old) done(old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(" + -110 * d + "%)", opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" })).then(function () { old.remove(); });
      springTo(next, function (p) { return { transform: "translateY(" + ((1 - p) * 110 * d).toFixed(1) + "%)", opacity: Math.min(1, p * 2) }; }, 280, 16);
      if (Math.abs(w1 - w0) > 1) springTo(mlbl, function (p) { return { width: (w0 + (w1 - w0) * p).toFixed(1) + "px" }; }, 260, 20);
    }
    function swapIcon(html) {
      mico.innerHTML = html;
      if (!calm.matches) springTo(mico, function (p) { return { transform: "scale(" + (0.3 + 0.7 * p).toFixed(3) + ") rotate(" + ((1 - p) * -40).toFixed(1) + "deg)" }; }, 300, 11);
    }

    // ---------- Pick a format: the badge flies into the main half ----------
    function local(r) { var c = card.getBoundingClientRect(), k = c.width / card.offsetWidth || 1; return { x: (r.left - c.left) / k, y: (r.top - c.top) / k, w: r.width / k }; }
    function choose(i, focusBack) {
      if (busy) return;
      if (i === cur) { closeMenu(focusBack); return; }
      var f = FORMATS[i], from = local(items[i].querySelector(".fi").getBoundingClientRect());
      cur = i;
      items.forEach(function (b, j) { b.setAttribute("aria-checked", String(j === i)); });
      hint.textContent = f.name + " chosen. Press " + f.label + " to start.";
      closeMenu(focusBack);
      if (calm.matches) { mico.innerHTML = icon(f); setLabel(f.label); return; }
      var to = local(mico.getBoundingClientRect());
      var g = document.createElement("span");
      g.className = "ghost";
      g.innerHTML = icon(f);
      card.appendChild(g);
      var dx = to.x - from.x, dy = to.y - from.y, frames = [];
      for (var s = 0; s <= 24; s++) {
        var t = s / 24, e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        var x = from.x + dx * e, y = from.y + dy * e - Math.sin(t * Math.PI) * 46;
        frames.push({ transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (t * -360).toFixed(0) + "deg) scale(" + (1 + Math.sin(t * Math.PI) * 0.35 - t * 0.07).toFixed(3) + ")" });
      }
      mico.style.opacity = "0.25";
      done(g.animate(frames, { duration: 560, easing: "linear", fill: "forwards" })).then(function () {
        g.remove();
        mico.style.opacity = "";
        swapIcon(icon(f));
        main.animate([{ transform: main.style.transform || "none" }, { transform: "translateX(0) scale(1.05)" }, { transform: "none" }], { duration: 300, easing: "ease-out" });
      });
      setTimeout(function () { setLabel(f.label); }, 180);
    }

    // ---------- Export run ----------
    function confetti() {
      var r = local(main.getBoundingClientRect()), cx = r.x + r.w / 2, cy = r.y + 10;
      var cols = ["#ffd166", "#06d6a0", "#ef476f", "#8f7bff", "#4cc9f0"];
      for (var i = 0; i < 16; i++) {
        var b = document.createElement("i");
        b.className = "bit";
        b.style.background = cols[i % cols.length];
        card.appendChild(b);
        var vx = (Math.random() - 0.5) * 220, vy = -140 - Math.random() * 120, x = cx, y = cy, rot = Math.random() * 180, fr = [];
        for (var k = 0; k <= 20; k++) { var t = k / 20 * 0.9; fr.push({ transform: "translate(" + (x + vx * t).toFixed(1) + "px," + (y + vy * t + 380 * t * t).toFixed(1) + "px) rotate(" + (rot + t * 720).toFixed(0) + "deg)", opacity: k > 14 ? (20 - k) / 6 : 1 }); }
        done(b.animate(fr, { duration: 900 + Math.random() * 300, easing: "linear", fill: "forwards" })).then((function (el) { return function () { el.remove(); }; })(b));
      }
    }
    function addChip(f) {
      none.hidden = true;
      var c = document.createElement("span");
      c.className = "chip";
      c.innerHTML = icon(f) + "<span>" + f.file + " <em>" + f.size + "</em></span>";
      var before = new Map();
      [].forEach.call(chips.querySelectorAll(".chip"), function (x) { before.set(x, x.offsetLeft); });
      chips.insertBefore(c, chips.firstChild);
      var all = chips.querySelectorAll(".chip");
      if (all.length > 3) all[all.length - 1].remove();
      if (calm.matches) return;
      before.forEach(function (l, x) { if (x.isConnected) x.animate([{ transform: "translateX(" + (l - x.offsetLeft) + "px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(0.3, 1.3, 0.5, 1)" }); });
      springTo(c, function (p) { return { transform: "translateY(" + ((1 - p) * -26).toFixed(1) + "px) scale(" + (0.6 + 0.4 * p).toFixed(3) + ")", opacity: Math.min(1, p * 2) }; }, 260, 13);
    }
    async function run() {
      if (busy) return;
      if (open) closeMenu(false);
      busy = true;
      var id = ++runId, f = FORMATS[cur];
      split.classList.add("busy");
      main.setAttribute("aria-busy", "true");
      caret.setAttribute("aria-disabled", "true");
      // anticipation: the button dips and the badge hops
      if (!calm.matches) {
        main.animate([{ transform: "scale(1)" }, { transform: "scale(0.94)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
        mico.animate([{ transform: "none" }, { transform: "translateY(-7px) rotate(-12deg)" }, { transform: "none" }], { duration: 360, easing: "cubic-bezier(0.3, 1.6, 0.5, 1)" });
      }
      var p = 0;
      setLabel("0%");
      for (var s = 0; s < 3; s++) {
        hint.textContent = f.stages[s] + "…";
        var end = (s + 1) / 3, t0 = performance.now(), dur = 520 + s * 140;
        while (p < end) {
          await wait(40);
          if (id !== runId) return;
          var k = Math.min(1, (performance.now() - t0) / dur);
          p = Math.min(end, s / 3 + (1 - Math.pow(1 - k, 2)) / 3);
          bar.style.transform = "scaleX(" + p.toFixed(3) + ")";
          setLabelQuiet(Math.round(p * 100) + "%");
        }
      }
      // finish: the bar flashes, a tick draws, paper bits pop and the file lands in Recent exports
      bar.animate([{ filter: "brightness(1)" }, { filter: "brightness(2.2)" }, { filter: "brightness(1)" }], { duration: 420 });
      swapIcon(TICK);
      var tk = mico.querySelector(".tk");
      if (calm.matches) tk.style.strokeDashoffset = "0";
      else tk.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 380, delay: 120, easing: "ease-out", fill: "forwards" });
      setLabel(f.k === "link" ? "Link ready" : "Saved");
      hint.textContent = f.k === "link" ? "View-only link ready. It ends in 7 days." : f.file + " is ready · " + f.size + ".";
      if (!calm.matches) confetti();
      addChip(f);
      await wait(1500);
      if (id !== runId) return;
      // reset: the bar drains and the button rolls back to its label
      done(bar.animate([{ transform: bar.style.transform, opacity: 1 }, { transform: "scaleX(1)", opacity: 0 }], { duration: 320, easing: "ease-in" })).then(function () { bar.style.transform = "scaleX(0)"; });
      swapIcon(icon(f));
      setLabel(f.label, false);
      split.classList.remove("busy");
      main.removeAttribute("aria-busy");
      caret.removeAttribute("aria-disabled");
      busy = false;
    }
    // percent ticks change the text in place (no roll for every number)
    function setLabelQuiet(text) { var s = mlbl.lastElementChild; if (s) s.textContent = text; }

    // ---------- Events ----------
    main.addEventListener("click", function () { run(); });
    caret.addEventListener("click", function () { if (busy) return; if (open) closeMenu(false); else openMenu(null, false); });
    caret.addEventListener("keydown", function (e) {
      if (busy) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!open) openMenu(e.key === "ArrowUp" ? items.length - 1 : cur, false); else items[hot].focus(); }
    });
    menu.addEventListener("keydown", function (e) {
      var n = items.length, i = hot;
      if (e.key === "ArrowDown") i = (hot + 1) % n;
      else if (e.key === "ArrowUp") i = (hot - 1 + n) % n;
      else if (e.key === "Home") i = 0;
      else if (e.key === "End") i = n - 1;
      else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); return; }
      else if (e.key === "Tab") { closeMenu(false); return; }
      else if (e.key.length === 1) { var ch = e.key.toLowerCase(), j = FORMATS.findIndex(function (f) { return f.name.toLowerCase()[0] === ch; }); if (j < 0) return; i = j; }
      else return;
      e.preventDefault();
      items[i].focus();
    });
    document.addEventListener("pointerdown", function (e) { if (open && !split.contains(e.target)) closeMenu(false); });

    // ---------- Auto demo: open, browse, pick, export, repeat with the next format ----------
    var demoOn = !calm.matches, timer = 0, pickNext = 2;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    async function demo() {
      if (!demoOn) return;
      var target = pickNext;
      pickNext = (pickNext + 2) % FORMATS.length;
      if (target === cur) target = (target + 1) % FORMATS.length;
      openMenu(cur, true);
      var i = cur;
      while (i !== target) {
        await wait(360);
        if (!demoOn) return;
        i = (i + (target > cur ? 1 : -1) + FORMATS.length) % FORMATS.length;
        moveHl(i);
      }
      await wait(420);
      if (!demoOn) return;
      choose(target, false);
      await wait(900);
      if (!demoOn) return;
      await run();
      if (demoOn) timer = setTimeout(demo, 1600);
    }
    if (demoOn) timer = setTimeout(demo, 450);
  })();
</script>
