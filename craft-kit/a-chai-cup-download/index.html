<!doctype html>
<!-- Chill and Craft · Chai Cup · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chai Cup · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --bg1: #fbf4ea;
    --bg2: #ead8bf;
    --btn: #4b2e1f;
    --btn-hover: #5a3826;
    --btn-line: transparent;
    --text: #fdf1df;
    --sub: #d8bd9c;
    --box: #f8e7cc;
    --ink: #4b2e1f;
    --tea: #b86f35;
    --tea-back: #dba46a;
    --caption: #7a5a43;
    --focus: #d9480f;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #21170f;
      --bg2: #0e0906;
      --btn: #2d1e15;
      --btn-hover: #382619;
      --btn-line: #5a3d2a;
      --text: #fbe9d1;
      --sub: #b99b7b;
      --box: #3e2a1c;
      --ink: #f3d7b2;
      --tea: #c98245;
      --tea-back: #e2ad74;
      --caption: #b99b7b;
      --focus: #fb923c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #21170f;
    --bg2: #0e0906;
    --btn: #2d1e15;
    --btn-hover: #382619;
    --btn-line: #5a3d2a;
    --text: #fbe9d1;
    --sub: #b99b7b;
    --box: #3e2a1c;
    --ink: #f3d7b2;
    --tea: #c98245;
    --tea-back: #e2ad74;
    --caption: #b99b7b;
    --focus: #fb923c;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body { overflow-x: hidden; } /* particles may fly past the edges */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 35%, var(--bg1), var(--bg2) 80%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px 16px 24px; width: 100%; }

  /* ---------- Button ---------- */
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 290px;
    max-width: 100%;
    padding: 10px 22px 10px 10px;
    border: 1px solid var(--btn-line);
    border-radius: 22px;
    background: var(--btn);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 16px 30px -18px rgba(60, 30, 10, .8), inset 0 1px 0 rgba(255, 255, 255, .08);
    transition: background-color .2s, transform .4s var(--spring), box-shadow .3s;
  }
  .btn:hover { background: var(--btn-hover); transform: translateY(-3px); box-shadow: 0 22px 34px -18px rgba(60, 30, 10, .9), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .btn:active { transform: translateY(0) scale(.97); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .btn[aria-disabled="true"] { cursor: progress; transform: none; }

  .cupbox {
    position: relative;
    flex: none;
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--box);
    transition: transform .5s var(--spring);
  }
  .btn:hover .cupbox { transform: rotate(-6deg) scale(1.04); }
  .cupbox svg { width: 48px; height: 48px; overflow: visible; }
  .line { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* Arrow: falls into the cup with gravity, springs back on reset */
  .arrow { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .6s var(--spring), opacity .3s; }
  .btn:hover .arrow { animation: bob .8s ease-in-out infinite; }

  /* Cup: springs up as its outline draws */
  .cup { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.55); opacity: 0; transition: transform .7s var(--spring), opacity .2s; }
  .cup .line { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .6s ease-out .1s; }
  .tea { transition: transform .4s ease-out; }
  .wave1 { fill: var(--tea); animation: slosh 1.6s linear infinite; }
  .wave2 { fill: var(--tea-back); animation: slosh 2.3s linear infinite reverse; }
  .bubble { fill: none; stroke: rgba(255, 240, 220, .8); stroke-width: .9; opacity: 0; }
  .pour { fill: none; stroke: var(--tea); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 3 3; opacity: 0; transition: opacity .25s; }

  /* Steam (when done) */
  .steam path { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; opacity: 0; }

  /* Text */
  .text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .label { display: inline-block; font-size: 17px; font-weight: 650; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .sub { display: inline-block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

  /* Effects layer for droplets and sparkles */
  .fx { position: absolute; left: 50%; top: 22%; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }
  .particle.star { width: 9px; height: 9px; border-radius: 0; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }

  /* ---------- States ---------- */
  .btn:is([data-state="working"], [data-state="done"]) .arrow { transform: translateY(16px) scale(.1); opacity: 0; animation: none; transition: transform .38s cubic-bezier(.55, 0, 1, .45), opacity .2s .2s; }
  .btn:is([data-state="working"], [data-state="done"]) .cup { transform: none; opacity: 1; transition-delay: .3s; }
  .btn:is([data-state="working"], [data-state="done"]) .cup .line { stroke-dashoffset: 0; transition-delay: .35s; }
  .btn[data-state="working"] .pour { opacity: 1; animation: flow .35s linear infinite; }
  .btn[data-state="working"] .bubble { animation: fizz 1.4s ease-in infinite; }
  .btn[data-state="working"] .bubble:nth-of-type(2) { animation-delay: .5s; }
  .btn[data-state="working"] .bubble:nth-of-type(3) { animation-delay: .9s; }
  .btn[data-state="working"] .cupbox { animation: rock 1.8s ease-in-out infinite; }
  .btn[data-state="done"] .steam path { animation: steam 1.8s ease-out infinite; }
  .btn[data-state="done"] .steam path:nth-child(2) { animation-delay: .45s; }
  .btn[data-state="done"] .steam path:nth-child(3) { animation-delay: .9s; }
  .btn[data-state="done"] .cupbox { animation: settle .8s var(--spring); }
  .btn[data-state="done"] { animation: glow 1.4s ease-out; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes slosh { from { transform: translateX(0); } to { transform: translateX(-24px); } }
  @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -6; } }
  @keyframes fizz { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-9px); } }
  @keyframes rock { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes steam {
    0% { opacity: 0; transform: translateY(3px); }
    40% { opacity: .9; }
    100% { opacity: 0; transform: translateY(-7px); }
  }
  @keyframes settle { 0% { transform: scale(1); } 30% { transform: scale(1.18, .86) rotate(-4deg); } 100% { transform: scale(1); } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(219, 164, 106, .7); } 100% { box-shadow: 0 0 0 18px rgba(219, 164, 106, 0); } }

  .caption { margin: 0; font-size: 13px; color: var(--caption); text-align: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .btn[data-state="done"] .steam path { opacity: .8; }
    .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <button class="btn" type="button" data-state="idle">
    <span class="cupbox" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <defs>
          <!-- Inside of the cup: the tea is clipped to this shape -->
          <clipPath id="cupInside">
            <path d="M13.4 18h20.2l-2.2 16.4a2.8 2.8 0 0 1-2.8 2.4h-10.2a2.8 2.8 0 0 1-2.8-2.4z" />
          </clipPath>
          <clipPath id="pourClip"><rect x="0" y="0" width="48" height="36" /></clipPath>
        </defs>

        <!-- Steam, shown when the file is ready -->
        <g class="steam">
          <path d="M19 14c-1.8-1.8 1.8-3.4 0-5.2" />
          <path d="M24 14c-1.8-1.8 1.8-3.4 0-5.2" />
          <path d="M29 14c-1.8-1.8 1.8-3.4 0-5.2" />
        </g>

        <!-- A thin stream pours while the file downloads -->
        <path class="pour" d="M23.5 3v33" clip-path="url(#pourClip)" />

        <!-- The cup -->
        <g class="cup">
          <g clip-path="url(#cupInside)">
            <g class="tea" style="transform: translateY(23px)">
              <path class="wave2" d="M0 19q6-2.4 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0V44H0z" />
              <path class="wave1" d="M0 20q6 2.4 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0V44H0z" />
              <circle class="bubble" cx="18" cy="33" r="1.2" />
              <circle class="bubble" cx="27" cy="35" r="1" />
              <circle class="bubble" cx="22" cy="31" r=".8" />
            </g>
          </g>
          <path class="line" pathLength="100" d="M12 17h23l-2.4 17.6a3.6 3.6 0 0 1-3.6 3.1h-11a3.6 3.6 0 0 1-3.6-3.1z" />
          <path class="line" pathLength="100" d="M34.6 21h2.6a4 4 0 0 1 0 8h-3.6" />
          <path class="line" pathLength="100" d="M9 42h30" />
        </g>

        <!-- The download arrow (drops into the cup) -->
        <path class="line arrow" d="M24 7v20M16.5 19.5l7.5 7.5 7.5-7.5" />
      </svg>
      <span class="fx"></span>
    </span>
    <span class="text">
      <span class="label">Download</span>
      <span class="sub">Tea-House-Menu.pdf · 1.8 MB</span>
    </span>
  </button>
  <p class="caption">The cup fills as the file comes in.</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Chai Cup download button ----------
  const btn = document.querySelector(".btn");
  const cupbox = btn.querySelector(".cupbox");
  const arrow = btn.querySelector(".arrow");
  const tea = btn.querySelector(".tea");
  const fx = btn.querySelector(".fx");
  const label = btn.querySelector(".label");
  const sub = btn.querySelector(".sub");
  const status = document.getElementById("status");

  const FILE = { name: "Tea-House-Menu.pdf", mb: 1.8 };
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 200) : ms));
  let busy = false;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Small droplets (on landing) or sparkles (when done)
  function burst(count, colors, spread, lift, star) {
    if (calm()) return;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("i");
      p.className = "particle" + (star ? " star" : "");
      p.style.background = colors[i % colors.length];
      fx.appendChild(p);
      const a = -Math.PI / 2 + (i / (count - 1) - .5) * Math.PI * 1.2;
      const d = spread * (.6 + Math.random() * .5);
      p.animate([
        { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d - lift).toFixed(1) + "px)) scale(.5) rotate(90deg)", opacity: 1, offset: .6 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d * 1.2).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d - lift + 18).toFixed(1) + "px)) scale(.2) rotate(180deg)", opacity: 0 }
      ], { duration: 750 + Math.random() * 300, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => p.remove();
    }
  }

  async function swap(el, text) {
    await play(el, [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-8px)", opacity: 0 }], { duration: 130, easing: "ease-in" });
    el.textContent = text;
    play(el, [{ transform: "translateY(8px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 420, easing: SPRING });
  }

  // 0% = tea hidden below the cup, 100% = tea near the rim
  function setLevel(p) {
    tea.style.transform = "translateY(" + (1.5 + (1 - p / 100) * 21.5).toFixed(2) + "px)";
    label.textContent = "Downloading " + Math.round(p) + "%";
    sub.textContent = (FILE.mb * p / 100).toFixed(1) + " of " + FILE.mb + " MB";
  }

  // Fake download with uneven chunks
  function simulateDownload(onTick) {
    return new Promise((resolve) => {
      let p = 0;
      (function step() {
        p = Math.min(100, p + 2 + Math.random() * 6);
        onTick(p);
        if (p >= 100) resolve();
        else setTimeout(step, 120 + Math.random() * 110);
      })();
    });
  }

  btn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    btn.setAttribute("aria-disabled", "true");

    // 1. Anticipation: the box squashes and the arrow pulls up
    await Promise.all([
      play(cupbox, [{ transform: "scale(1)" }, { transform: "scale(1.12, .84)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-out" }),
      play(arrow, [{ transform: "translateY(0)" }, { transform: "translateY(-6px) scaleY(1.1)" }], { duration: 260, easing: "ease-out" })
    ]);

    // 2. The arrow falls in and a cup springs up around it
    btn.dataset.state = "working";
    swap(label, "Downloading 0%");
    status.textContent = "Download started.";
    setLevel(0);
    await wait(380);
    burst(5, ["#dba46a", "#b86f35"], 18, 6, false); // splash
    await wait(420);

    // 3. Tea pours and rises with the progress
    await simulateDownload(setLevel);

    // 4. Full cup: steam, a bouncy settle, sparkles
    btn.dataset.state = "done";
    burst(7, ["#fbbf24", "#fde68a", "#f59e0b"], 30, 16, true);
    swap(label, "Downloaded");
    sub.textContent = "Saved · ready to read";
    status.textContent = "Download complete. " + FILE.name + " is saved.";
    await wait(2800);

    // 5. Reset: tea drains, the cup folds and the arrow springs back
    btn.dataset.state = "idle";
    tea.style.transform = "translateY(23px)";
    swap(label, "Download");
    sub.textContent = FILE.name + " · " + FILE.mb + " MB";
    await wait(500);
    btn.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
