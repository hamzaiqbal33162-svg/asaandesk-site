<!doctype html>
<!-- Chill & Craft · Fortune Cookie · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortune Cookie · coupon code field</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: apricot, lacquer red and toasted gold ---------- */
  :root {
    color-scheme: light;
    --bg1: #fff1e4;
    --bg2: #ffd0ad;
    --dots: rgba(200, 50, 43, .08);
    --ink: #3a1c13;
    --muted: #946c5c;
    --card: #fffaf4;
    --line: #f2dccb;
    --field: #fff;
    --red: #c8322b;
    --red-d: #92201b;
    --gold: #e9a83a;
    --ok: #237a4b;
    --okbg: #e3f5e9;
    --bad: #c8322b;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #33170f;
    --bg2: #110705;
    --dots: rgba(233, 168, 58, .06);
    --ink: #fbeee3;
    --muted: #c49f8e;
    --card: #21110d;
    --line: #3d241c;
    --field: #2b1712;
    --red: #e2554d;
    --red-d: #b8352e;
    --ok: #6fd69c;
    --okbg: #183424;
    --bad: #ff8a80;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(var(--dots) 2px, transparent 2.5px) 0 0 / 26px 26px,
      radial-gradient(var(--dots) 1.5px, transparent 2px) 13px 13px / 26px 26px,
      radial-gradient(700px 520px at 50% 25%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { width: 100%; display: grid; place-items: center; padding: 16px; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .card {
    width: min(390px, 100%);
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 34px 64px -38px rgba(140, 40, 20, .6), 0 1px 0 rgba(255, 255, 255, .6) inset;
    overflow: hidden;
  }
  :root[data-theme="dark"] .card { box-shadow: 0 34px 64px -30px rgba(0, 0, 0, .85); }

  /* ---------- The cookie on its lacquer plate ---------- */
  .plate { position: relative; height: 178px; display: grid; place-items: center; background: radial-gradient(260px 150px at 50% 100%, rgba(233, 168, 58, .22), transparent 70%); }
  .cookie { position: relative; width: 210px; height: 158px; margin-top: 10px; }
  .cookie svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bob { animation: bob 3s ease-in-out infinite; transform-box: view-box; transform-origin: 105px 120px; }
  .half { transform-box: view-box; transform-origin: 105px 116px; transition: transform .7s var(--spring); }
  .open .half.l { transform: translate(-24px, -6px) rotate(-14deg); }
  .open .half.r { transform: translate(24px, -6px) rotate(14deg); }
  .crack { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset .35s ease-out, opacity .3s; }
  .cracking .crack { stroke-dashoffset: 0; }
  .open .crack { opacity: 0; }
  .peek { transition: opacity .2s; }
  .open .peek { opacity: 0; }
  .flutter { transform-box: fill-box; transform-origin: 0 50%; animation: flutter 2.2s ease-in-out infinite; }

  /* the paper fortune that unrolls out of the cookie */
  .slip {
    position: absolute;
    left: 50%;
    top: 36px;
    width: 186px;
    margin-left: -93px;
    padding: 9px 14px 8px;
    border-radius: 3px;
    text-align: center;
    background: linear-gradient(90deg, #e9e2d6, #fffdf8 9%, #fffdf8 91%, #e9e2d6);
    color: #8f1d17;
    box-shadow: 0 10px 20px -10px rgba(80, 20, 0, .55);
    opacity: 0;
    transform: translateY(40px) scale(.1, .5);
    pointer-events: none;
    z-index: 3;
  }
  .slip b { display: block; font-size: 21px; font-weight: 900; letter-spacing: -.01em; line-height: 1.05; }
  .slip span { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 750; letter-spacing: .16em; color: #b05a35; }
  .slip i { position: absolute; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: #f1c3a8; }
  .slip i:first-of-type { left: 7px; } .slip i:last-of-type { right: 7px; }
  .open .slip { opacity: 1; transform: translateY(-6px) rotate(-3deg) scale(1); transition: transform .7s .12s var(--spring), opacity .15s .12s; }
  .open .slip.away { transform: translateY(150px) rotate(4deg) scale(.4); opacity: 0; transition: transform .6s cubic-bezier(.55, 0, .7, .4), opacity .25s .35s; }

  /* ---------- The order and the coupon ---------- */
  .body { padding: 4px 20px 20px; }
  .body h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .lines { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; font-size: 13.5px; }
  .lines li { display: flex; justify-content: space-between; gap: 10px; }
  .lines li span { color: var(--muted); }
  .lines li b { font-weight: 700; font-variant-numeric: tabular-nums; }

  .coupon { margin-top: 16px; }
  .coupon label { display: block; font-size: 12px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .field {
    position: relative;
    display: flex;
    align-items: center;
    height: 50px;
    padding: 4px 4px 4px 14px;
    border-radius: 16px;
    background: var(--field);
    border: 1.5px solid var(--line);
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(233, 168, 58, .25); }
  .field.bad { border-color: var(--bad); }
  .field.good { border-color: var(--ok); }
  .field svg { flex: none; width: 20px; height: 20px; margin-right: 8px; }
  .field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15.5px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .field input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
  .apply {
    flex: none;
    position: relative;
    height: 40px;
    padding: 0 16px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--red), var(--red-d));
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 18px -10px var(--red-d), inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: transform .3s var(--spring), filter .2s;
  }
  .apply:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .apply:focus-visible, .try button:focus-visible, .applied button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .apply .dots { display: none; }
  .apply.busy .word { visibility: hidden; }
  .apply.busy .dots { display: flex; position: absolute; inset: 0; align-items: center; justify-content: center; gap: 4px; }
  .apply .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: dot .7s ease-in-out infinite; }
  .apply .dots i:nth-child(2) { animation-delay: .12s; } .apply .dots i:nth-child(3) { animation-delay: .24s; }

  .msg { min-height: 20px; margin: 7px 2px 0; font-size: 12.5px; font-weight: 650; }
  .msg.bad { color: var(--bad); }
  .msg.good { color: var(--ok); }
  .try { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .try button { border: 1px dashed var(--gold); background: transparent; color: var(--ink); border-radius: 9px; padding: 4px 8px; font: inherit; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; cursor: pointer; transition: transform .25s var(--spring), background .2s; }
  .try button:hover { background: rgba(233, 168, 58, .16); transform: translateY(-1px); }
  .applied { display: none; align-items: center; gap: 8px; height: 50px; padding: 0 6px 0 12px; border-radius: 16px; background: var(--okbg); color: var(--ok); font-weight: 800; font-size: 14px; animation: pop .5s var(--spring); }
  .applied svg { width: 20px; height: 20px; flex: none; }
  .applied span { flex: 1; min-width: 0; letter-spacing: .06em; }
  .applied small { font-weight: 700; letter-spacing: 0; opacity: .85; }
  .applied button { width: 36px; height: 36px; border-radius: 11px; border: 0; background: rgba(35, 122, 75, .12); color: inherit; font: inherit; font-size: 18px; cursor: pointer; }
  .coupon.on .applied { display: flex; }
  .coupon.on .field, .coupon.on .try { display: none; }

  .sum { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 6px; font-size: 13.5px; }
  .sum div { display: flex; justify-content: space-between; }
  .sum span { color: var(--muted); }
  .sum b { font-variant-numeric: tabular-nums; }
  .sum .disc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.2, .8, .2, 1); }
  .sum .disc > div { display: block; overflow: hidden; min-height: 0; }
  .sum .disc.show { grid-template-rows: 1fr; }
  .disc b { color: var(--ok); }
  .tot { align-items: baseline; padding-top: 6px; }
  .tot span { color: var(--ink) !important; font-weight: 800; font-size: 15px; }
  .tot .nums { display: flex; align-items: baseline; gap: 8px; }
  .old { position: relative; font-size: 13px; color: var(--muted); opacity: 0; transition: opacity .3s; font-variant-numeric: tabular-nums; }
  .old::after { content: ""; position: absolute; left: -2px; right: -2px; top: 52%; height: 2px; background: var(--red); transform: scaleX(0); transform-origin: 0 50%; transition: transform .45s .15s ease-out; }
  .tot.cut .old { opacity: 1; }
  .tot.cut .old::after { transform: scaleX(1); }
  #total { font-size: 21px; font-weight: 900; letter-spacing: -.02em; }
  .save { display: inline-block; margin-left: auto; padding: 3px 9px; border-radius: 99px; background: var(--gold); color: #3a2000; font-size: 11.5px; font-weight: 850; transform: scale(0); transition: transform .5s var(--spring); }
  .save.show { transform: scale(1); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-5px) rotate(1.5deg); } }
  @keyframes flutter { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
  @keyframes dot { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <div class="plate" aria-hidden="true">
      <div class="cookie" id="cookie">
        <svg viewBox="0 0 210 158">
          <defs>
            <radialGradient id="dough" cx=".42" cy=".3" r=".8"><stop offset="0" stop-color="#ffd98a" /><stop offset=".55" stop-color="#eaa23f" /><stop offset="1" stop-color="#b96a1c" /></radialGradient>
            <radialGradient id="lacquer" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#e2463c" /><stop offset="1" stop-color="#8f1d17" /></radialGradient>
          </defs>
          <!-- lacquer plate -->
          <ellipse cx="105" cy="138" rx="96" ry="16" fill="url(#lacquer)" />
          <ellipse cx="105" cy="135" rx="78" ry="10" fill="#ad2a23" />
          <ellipse cx="105" cy="134" rx="62" ry="6" fill="rgba(255,255,255,.12)" />
          <g class="bob" id="bob">
            <ellipse cx="105" cy="128" rx="58" ry="5" fill="rgba(60,10,0,.35)" />
            <!-- paper end peeking out of the seam -->
            <g class="peek" transform="rotate(-16 105 40)"><rect class="flutter" x="98" y="27" width="36" height="11" rx="1" fill="#fffdf8" /><path d="M104 32.5h18" stroke="#c8322b" stroke-width="1.4" stroke-dasharray="3 2" opacity=".7" /></g>
            <!-- two folded wings with pointed, curled-down tips that meet in a pinched seam -->
            <g class="half l" id="hl">
              <path d="M105 40 C88 30 56 32 36 50 C24 62 16 80 14 98 C26 92 44 92 60 98 C76 104 94 112 105 116 Z" fill="url(#dough)" />
              <path d="M105 46 C95 62 93 92 105 116 Z" fill="#9c5714" opacity=".55" />
              <path d="M100 48 C80 54 56 68 24 94" fill="none" stroke="#b8731f" stroke-width="2.2" stroke-linecap="round" opacity=".8" />
              <path d="M98 44 C78 49 54 62 26 88" fill="none" stroke="#ffe7ad" stroke-width="2" stroke-linecap="round" opacity=".55" />
              <path d="M46 46 C60 37 78 34 94 37" fill="none" stroke="#fff3cf" stroke-width="4" stroke-linecap="round" opacity=".6" />
              <circle cx="56" cy="88" r="1.5" fill="#b4691c" /><circle cx="76" cy="98" r="1.3" fill="#b4691c" /><circle cx="40" cy="74" r="1.2" fill="#b4691c" />
            </g>
            <g class="half r" id="hr">
              <path d="M105 40 C122 30 154 32 174 50 C186 62 194 80 196 98 C184 92 166 92 150 98 C134 104 116 112 105 116 Z" fill="url(#dough)" />
              <path d="M105 46 C115 62 117 92 105 116 Z" fill="#8a4a10" opacity=".6" />
              <path d="M110 48 C130 54 154 68 186 94" fill="none" stroke="#a9671a" stroke-width="2.2" stroke-linecap="round" opacity=".8" />
              <circle cx="154" cy="88" r="1.5" fill="#b4691c" /><circle cx="134" cy="98" r="1.3" fill="#b4691c" /><circle cx="170" cy="74" r="1.2" fill="#b4691c" />
            </g>
            <path class="crack" d="M105 44 L101 58 L108 68 L102 82 L108 96 L104 112" fill="none" stroke="#6d3a0c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
        <div class="slip" id="slip"><i></i><i></i><b id="slipBig">10% off</b><span id="slipCode">CHAI10</span></div>
      </div>
    </div>

    <div class="body">
      <h1 id="title">Your order</h1>
      <ul class="lines">
        <li><span>Cardamom tea tin × 2</span><b>PKR 1,300</b></li>
        <li><span>Clay chai cups, set of 4</span><b>PKR 1,850</b></li>
      </ul>

      <div class="coupon" id="coupon">
        <label for="code">Coupon code</label>
        <form class="field" id="field" novalidate>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h11A1.5 1.5 0 0 1 17 6.5V8a2 2 0 0 0 0 4v1.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 13.5V12a2 2 0 0 0 0-4z" fill="none" stroke="var(--gold)" stroke-width="1.6" /><path d="M8 8l4 4M12 8l-4 4" stroke="var(--red)" stroke-width="1.4" stroke-linecap="round" opacity=".8" /></svg>
          <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" placeholder="Enter a code" aria-describedby="msg">
          <button class="apply" id="apply" type="submit"><span class="word">Apply</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
        </form>
        <div class="applied" id="applied">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="currentColor" opacity=".15" /><path d="M6 10.4l2.6 2.4L14 7.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span><span id="appliedCode">CHAI10</span> <small id="appliedNote">applied</small></span>
          <button type="button" id="remove" aria-label="Remove coupon">×</button>
        </div>
        <p class="msg" id="msg" aria-live="polite"></p>
        <div class="try">Try <button type="button" data-code="CHAI10">CHAI10</button><button type="button" data-code="FREESHIP">FREESHIP</button><button type="button" data-code="BIG500">BIG500</button></div>
      </div>

      <div class="sum">
        <div><span>Subtotal</span><b id="sub">PKR 3,150</b></div>
        <div><span>Delivery</span><b id="del">PKR 200</b></div>
        <div class="disc" id="disc"><div><div style="display:flex;justify-content:space-between"><span id="discLabel">Coupon</span><b id="discAmt">− PKR 0</b></div></div></div>
        <div class="tot" id="tot"><span>Total</span><span class="nums"><s class="old" id="old">PKR 3,350</s><b id="total">PKR 3,350</b></span></div>
        <div><span class="save" id="save">You save PKR 0</span></div>
      </div>
    </div>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Fortune Cookie: a coupon field where a valid code cracks a cookie open and its fortune is the discount ----------
  const $ = (id) => document.getElementById(id);
  const SUBTOTAL = 3150, DELIVERY = 200;
  // Codes: kind "pct" (percent of subtotal with a cap), "ship" (free delivery), "flat" (amount off with a minimum order)
  const CODES = {
    CHAI10: { kind: "pct", value: 10, cap: 500, big: "10% off", note: "10% off the tea" },
    FREESHIP: { kind: "ship", big: "Free delivery", note: "delivery is on us" },
    BIG500: { kind: "flat", value: 500, min: 4000, big: "PKR 500 off", note: "PKR 500 off" },
  };
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 120) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  function tween(ms, fn) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.min(1, (now - s) / ms); fn(1 - Math.pow(1 - t, 3)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }

  const cookie = $("cookie"), field = $("field"), input = $("code"), applyBtn = $("apply"), msg = $("msg"), coupon = $("coupon");
  let applied = null, busy = false, shownTotal = SUBTOTAL + DELIVERY;

  // What a code is worth right now (or why it cannot be used)
  function evaluate(code) {
    const c = CODES[code];
    if (!c) return { error: code ? `${code} is not a valid code. Try one of the codes below.` : "Type a coupon code first." };
    if (c.kind === "flat" && SUBTOTAL < c.min) return { error: `${code} needs an order of ${fmt(c.min)}. Add ${fmt(c.min - SUBTOTAL)} more to use it.`, near: true };
    if (c.kind === "pct") return { off: Math.min(c.cap, Math.round(SUBTOTAL * c.value / 100)), label: `Coupon ${code} (10%)` };
    if (c.kind === "ship") return { off: DELIVERY, label: `Coupon ${code}`, ship: true };
    return { off: c.value, label: `Coupon ${code}` };
  }

  function setTotal(to) {
    const from = shownTotal;
    shownTotal = to;
    return tween(700, (k) => { $("total").textContent = fmt(from + (to - from) * k); });
  }

  // ---------- Applying a code ----------
  async function apply(raw) {
    if (busy) return;
    const code = String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
    input.value = code;
    const res = evaluate(code);
    busy = true;
    applyBtn.classList.add("busy");
    applyBtn.setAttribute("aria-busy", "true");
    field.classList.remove("bad", "good");
    msg.className = "msg"; msg.textContent = "Checking the code…";
    // anticipation: the button squashes and the cookie starts to wobble harder and harder
    play(applyBtn, [{ transform: "scale(1)" }, { transform: "scale(.9, .84)", offset: .3 }, { transform: "scale(1.04)", offset: .7 }, { transform: "scale(1)" }], { duration: 380 });
    await play(cookie, [0, -6, 6, -9, 9, -12, 12, 0].map((r, i) => ({ transform: `rotate(${r}deg) translateY(${i % 2 ? -2 : 0}px)` })), { duration: 620, easing: "ease-in-out" });
    applyBtn.classList.remove("busy");
    applyBtn.removeAttribute("aria-busy");

    if (res.error) {
      // a bad code: the cookie shakes its head (or nearly cracks for a code that needs a bigger order)
      busy = false;
      field.classList.add("bad");
      msg.className = "msg bad"; msg.textContent = res.error;
      if (res.near) {
        cookie.classList.add("cracking");
        await wait(420);
        cookie.classList.remove("cracking");
      }
      play(cookie, [{ transform: "none" }, { transform: "translateX(-10px) rotate(-4deg)" }, { transform: "translateX(9px) rotate(4deg)" }, { transform: "translateX(-6px)" }, { transform: "translateX(4px)" }, { transform: "none" }], { duration: 520 });
      play(field, [{ transform: "none" }, { transform: "translateX(-8px)" }, { transform: "translateX(7px)" }, { transform: "translateX(-4px)" }, { transform: "none" }], { duration: 420 });
      crumbs(3);
      return;
    }

    const hadFocus = field.contains(document.activeElement);
    // main: crack lines draw, then the halves spring apart and crumbs fly
    cookie.classList.add("cracking");
    await wait(330);
    $("slipBig").textContent = CODES[code].big;
    $("slipCode").textContent = code;
    cookie.classList.add("open");
    crumbs(18);
    await wait(650);
    sparkle($("slip"), 10);

    // progress: the fortune flies down into the summary, a discount row opens and the total rolls down
    await wait(500);
    $("slip").classList.add("away");
    await wait(380);
    applied = code;
    const total = SUBTOTAL + DELIVERY - res.off;
    $("discLabel").textContent = res.label;
    $("discAmt").textContent = "− " + fmt(res.off);
    $("disc").classList.add("show");
    if (res.ship) { $("del").innerHTML = '<s style="opacity:.6">PKR 200</s> Free'; }
    $("old").textContent = fmt(SUBTOTAL + DELIVERY);
    $("tot").classList.add("cut");
    coupon.classList.add("on");
    $("appliedCode").textContent = code;
    $("appliedNote").textContent = "· " + CODES[code].note;
    if (hadFocus) $("remove").focus();
    field.classList.add("good");
    msg.className = "msg good"; msg.textContent = `${code} applied. You save ${fmt(res.off)}. New total ${fmt(total)}.`;
    await setTotal(total);

    // finish: a savings pill pops with gold sparkles
    $("save").textContent = "You save " + fmt(res.off);
    $("save").classList.add("show");
    sparkle($("save"), 14);
    busy = false;
  }

  // ---------- Removing the code: the halves rejoin with a snap ----------
  async function removeCode(focus) {
    if (!applied || busy) return;
    busy = true;
    applied = null;
    $("slip").classList.remove("away");
    cookie.classList.remove("open");
    await wait(420);
    cookie.classList.remove("cracking");
    play(cookie, [{ transform: "scale(1)" }, { transform: "scale(1.1, .9)", offset: .35 }, { transform: "scale(.96, 1.05)", offset: .7 }, { transform: "scale(1)" }], { duration: 480 });
    $("disc").classList.remove("show");
    $("del").textContent = fmt(DELIVERY);
    $("tot").classList.remove("cut");
    $("save").classList.remove("show");
    coupon.classList.remove("on");
    field.classList.remove("good", "bad");
    input.value = "";
    msg.className = "msg"; msg.textContent = "Coupon removed. Total back to " + fmt(SUBTOTAL + DELIVERY) + ".";
    if (focus) input.focus();
    await setTotal(SUBTOTAL + DELIVERY);
    busy = false;
  }

  field.addEventListener("submit", (e) => { e.preventDefault(); apply(input.value); });
  input.addEventListener("input", () => { field.classList.remove("bad"); if (msg.classList.contains("bad")) { msg.className = "msg"; msg.textContent = ""; } });
  $("remove").addEventListener("click", () => removeCode(true));
  document.querySelectorAll(".try button").forEach((b) => b.addEventListener("click", () => { input.value = b.dataset.code; apply(b.dataset.code); }));

  // ---------- Crumbs and sparkles on a canvas ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false, fxLast = 0;
  function sizeFx() { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  sizeFx(); addEventListener("resize", sizeFx);
  function start() { if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(drawFx); } }
  function crumbs(n) {
    if (calm()) return;
    const r = cookie.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height * .45;
    const floor = r.top + r.height * .86;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.6, v = 120 + Math.random() * 220;
      parts.push({ kind: "crumb", x: x + (Math.random() - .5) * 20, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, floor, life: 0, max: 1.4, s: 2 + Math.random() * 3.5, rot: Math.random() * 6, vr: (Math.random() - .5) * 12, c: ["#e9a83a", "#c27621", "#ffd98a"][i % 3] });
    }
    start();
  }
  function sparkle(el, n) {
    if (calm()) return;
    const r = el.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 150;
      parts.push({ kind: "star", x: r.left + r.width / 2 + (Math.random() - .5) * r.width * .6, y: r.top + r.height / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0, max: .6 + Math.random() * .4, s: 3 + Math.random() * 4, c: i % 2 ? "#e9a83a" : "#ffe7a3" });
    }
    start();
  }
  function drawFx(now) {
    const dt = Math.min(.04, (now - fxLast) / 1000); fxLast = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life > p.max) { parts.splice(i, 1); continue; }
      const a = Math.min(1, (p.max - p.life) * 3);
      ctx.globalAlpha = a;
      if (p.kind === "crumb") {
        p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.y > p.floor && p.vy > 0) { p.y = p.floor; p.vy *= -.35; p.vx *= .6; p.vr *= .5; } // bounce on the plate
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.moveTo(-p.s, -p.s * .4); ctx.lineTo(p.s * .6, -p.s); ctx.lineTo(p.s, p.s * .5); ctx.lineTo(-p.s * .3, p.s); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        p.vx *= .95; p.vy = p.vy * .95 + 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        const r = p.s * (.5 + a * .5);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - r); ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r); ctx.quadraticCurveTo(p.x, p.y, p.x - r, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Auto-demo: types a code, applies it, removes it, and loops ----------
  const demo = { on: true, timer: 0, n: 0 };
  const DEMO = ["CHAI10", "FREESHIP", "CHAI5"];
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.timer); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  async function typeCode(code) {
    input.value = "";
    for (const ch of code) { if (!demo.on) return false; input.value += ch; await wait(calm() ? 0 : 60); }
    return demo.on;
  }
  async function runDemo() {
    if (!demo.on) return;
    const code = DEMO[demo.n++ % DEMO.length];
    if (!(await typeCode(code))) return;
    await wait(200);
    if (!demo.on) return;
    await apply(code);
    if (!demo.on) return;
    await wait(applied ? 2600 : 1800);
    if (!demo.on) return;
    if (applied) await removeCode(false);
    else { input.value = ""; field.classList.remove("bad"); msg.className = "msg"; msg.textContent = ""; }
    if (demo.on) demo.timer = setTimeout(runDemo, 900);
  }
  demo.timer = setTimeout(runDemo, 200);
</script>
</body>
</html>
