          <form class="invite" id="invTeam" novalidate><label class="sr-only" for="tMail">Email to invite</label><input class="inp" id="tMail" placeholder="name@saltmarsh.coffee" autocomplete="off"><label class="sr-only" for="tRole">Role</label><select class="inp" id="tRole"><option>Editor</option><option>Viewer</option></select><button type="submit" class="btn primary">${ic("send")} Invite</button></form><p class="cc-err" id="tErr" role="alert"></p>
        </section>
        <section class="card danger" id="sec-reset"><div class="ch"><div><h3>Reset and delete</h3><p>Careful, these cannot be undone</p></div></div>
          <div class="srow"><div><b>Reset demo data</b><small>Brings back every form, response and setting from the start</small></div><div><button type="button" class="btn dgr" data-reset>${ic("refresh")} Reset demo data</button></div></div>
          <div class="srow"><div><b>Delete workspace</b><small>Turned off in this demo</small></div><div><button type="button" class="btn" disabled>${ic("trash")} Delete workspace</button></div></div>
        </section>
      </div></div>`;
  },
  init(v) {
    const s = S.set;
    v.addEventListener("click", (e) => {
      const sec = e.target.closest("[data-sec]");
      if (sec) { $$("[data-sec]", v).forEach((b) => (b === sec ? b.setAttribute("aria-current", "true") : b.removeAttribute("aria-current"))); const t = $("#sec-" + sec.dataset.sec, v); if (t) t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); return; }
      const acc = e.target.closest("[data-acc]");
      if (acc) { s.accent = acc.dataset.acc; save(); applyAccent(); $$("[data-acc]", v).forEach((b) => b.setAttribute("aria-pressed", String(b === acc))); redrawCharts(); return toast(`Accent set to ${acc.title}`); }
      const fo = e.target.closest("[data-font]");
      if (fo) { s.font = fo.dataset.font; save(); applyAccent(); $$("[data-font]", v).forEach((b) => b.setAttribute("aria-pressed", String(b === fo))); return toast(`Forms now use the ${fo.dataset.font.toLowerCase()} font`); }
      const sw = e.target.closest("[data-sw]");
      if (sw) {
        const k = sw.dataset.sw;
        if (k === "hideEmails") s.hideEmails = !s.hideEmails; else s.notify[k] = !s.notify[k];
        const on = k === "hideEmails" ? s.hideEmails : s.notify[k];
        sw.setAttribute("aria-checked", String(on));
        save();
        return toast(on ? "Turned on" : "Turned off");
      }
      if (e.target.closest("[data-exportall]")) return exportCSV(S.responses, "formcraft-all-responses");
      if (e.target.closest("[data-reset]")) return resetDemo();
      const kick = e.target.closest("[data-kick]");
      if (kick) {
        const p = S.team.find((x) => x.id === kick.dataset.kick);
        confirmBox(`Remove ${p.name} from the workspace? Their forms stay.`, "Remove").then((ok) => { if (!ok) return; S.team = S.team.filter((x) => x !== p); save(); $("#teamList", v).innerHTML = teamHTML(); toast(`${p.name} removed`); });
      }
    });
    v.addEventListener("change", (e) => {
      const t = e.target;
      if (t.dataset.role) { const p = S.team.find((x) => x.id === t.dataset.role); p.role = t.value; save(); return toast(`${p.name} is now ${t.value === "Editor" ? "an editor" : "a viewer"}`); }
      if (t.id === "sKeep") { s.keep = t.value; save(); return toast(t.value === "0" ? "Responses are kept forever" : `Responses older than ${t.selectedOptions[0].text} will be deleted`); }
      if (t.id === "sLimit") { const n = t.value.trim(); if (n && !(+n >= 1 && Number.isInteger(+n))) { $("#eLimit", v).textContent = "Use a whole number above 0, or leave it empty"; return; } $("#eLimit", v).textContent = ""; s.limit = n; save(); return toast(n ? `Forms stop after ${num(+n)} answers` : "No answer limit"); }
      if (t.id === "sClose") { if (t.value && new Date(t.value) < TODAY) { $("#eClose", v).textContent = "Pick a date from today on"; return; } $("#eClose", v).textContent = ""; s.close = t.value; save(); return toast(t.value ? `All forms close on ${fdateY(t.value)}` : "Close date removed"); }
    });
    $("#sSlug", v).addEventListener("input", (e) => { $("#slugHint", v).textContent = `formcraft.app/f/${e.target.value.trim() || "…"}/…`; });
    $("#wsForm", v).addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("#sName", v).value.trim(), slug = $("#sSlug", v).value.trim();
      const en = name.length < 2 ? "Use at least 2 characters" : "", es = /^[a-z0-9-]{3,30}$/.test(slug) ? "" : "Use 3 to 30 lowercase letters, numbers or dashes";
      $("#eName", v).textContent = en;
      $("#eSlug", v).textContent = es;
      $("#sName", v).setAttribute("aria-invalid", String(!!en));
      $("#sSlug", v).setAttribute("aria-invalid", String(!!es));
      if (en || es) return (en ? $("#sName", v) : $("#sSlug", v)).focus();
      Object.assign(s, { workspace: name, slug, tz: $("#sTz", v).value });
      save();
      $("#wsName").textContent = name;
      toast("Workspace saved");
    });
    $("#invTeam", v).addEventListener("submit", (e) => {
      e.preventDefault();
      const mail = $("#tMail", v).value.trim().toLowerCase(), err = $("#tErr", v);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) { err.textContent = "Type a full email address"; return $("#tMail", v).focus(); }
      if (S.team.some((p) => p.email === mail)) { err.textContent = "That person is already on the team"; return; }
      if (S.team.length >= 8) { err.textContent = "The Team plan has room for 8 people at most"; return; }
      err.textContent = "";
      const nm = mail.split("@")[0].split(/[._-]/).map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
      S.team.push({ id: "p" + uid(), name: nm, role: $("#tRole", v).value, title: "Invited today", img: "", email: mail, invited: true });
      save();
      $("#tMail", v).value = "";
      $("#teamList", v).innerHTML = teamHTML();
      toast(`Invite sent to ${mail}`);
    });
  },
};

/* =====================================================================
   Live: a new response arrives every few seconds; people "filling now"
   ===================================================================== */
function liveTick() {
  const live = S.forms.filter((f) => f.status === "live" && f.fields.length);
  if (!live.length) return;
  const cafe = live.find((f) => f.id === "cafe");
  const f = cafe && R() < 0.4 ? cafe : pick(live);
  const r = fakeResponse(f, Date.now());
  r.seen = route === "responses";
  S.responses.unshift(r);
  if (S.responses.length > 1400) S.responses.length = 1400;
  f.views += randi(1, 3);
  save();
  setBadge("responses", unseen(), true);
  renderQuota();
  if (route === "integrations" && $("#dlog")) $("#dlog").innerHTML = dlogRows();
  if (route === "overview") {
    const feed = $("#feed");
    if (feed) {
      feed.insertAdjacentHTML("afterbegin", feedItem(r, true));
      while (feed.children.length > 7) feed.lastElementChild.remove();
      $$("time[data-at]", feed).forEach((t) => (t.textContent = ago(+t.dataset.at)));
    }
    const k = $("#kResp");
    if (k) countUp(k, S.responses.filter((x) => within(x, 7)).length, FMT.int, 700);
  }
}

/* ---------- Start ---------- */
function applyFont() { const fo = S.set.font || "Sans"; if (fo === "Sans") delete document.documentElement.dataset.ffont; else document.documentElement.dataset.ffont = fo; }
const applyAccentCore = applyAccent;
applyAccent = () => { applyAccentCore(); applyFont(); };
applyAccent();
renderNav();
badges();
renderQuota();
$("#wsName").textContent = S.set.workspace;
if (S.readNotes) $("#bellDot").hidden = true;
initShell(cmds);
themeIcon();
$("#wsBtn").addEventListener("click", (e) => {
  menu(e.currentTarget, [{ k: "here", label: S.set.workspace + " (you are here)", icon: "check" }, { k: "roast", label: "Saltmarsh Roastery", icon: "home" }, "-", { k: "new", label: "Create a workspace", icon: "plus" }], (it) => {
    if (it.k === "here") return toast(`You are in ${S.set.workspace}`);
    if (it.k === "roast") return toast("The roastery workspace is view only in this demo", "warn");
    toast("New workspaces are added by the owner from billing. This demo keeps one", "warn");
  });
});
$("#meBtn").addEventListener("click", (e) => {
  menu(e.currentTarget, [{ k: "set", label: "Settings", icon: "sliders" }, { k: "keys", label: "Keyboard shortcuts", icon: "key" }, { k: "theme", label: "Switch theme", icon: "moon" }], (it) => {
    if (it.k === "set") return (location.hash = "#/settings");
    if (it.k === "theme") return setTheme(APP.theme() === "dark" ? "light" : "dark");
    openModal({ title: "Keyboard shortcuts", html: `<div class="qa">${[["Ctrl + K", "Search and jump anywhere"], ["Ctrl + Z", "Undo in the builder and logic map"], ["Alt + ↑ / ↓", "Move the focused question"], ["Enter", "Open the focused question, or answer in the preview"], ["Delete", "Delete the focused question"], ["Esc", "Close a dialog, drawer or menu"]].map(([k, d]) => `<div class="qa-i"><small>${k}</small><div>${d}</div></div>`).join("")}</div>` });
  });
});
$("#bellBtn").addEventListener("click", (e) => bellMenu(e.currentTarget));
$("#newTop").addEventListener("click", () => newForm());
addEventListener("scroll", () => document.documentElement.classList.toggle("scrolled", scrollY > 6), { passive: true });
startRouter(PAGES.map((p) => p[0]), "overview", show);
every(4800, liveTick);
every(3200, () => { const el = $("#fillN"); if (el) el.textContent = clamp((+el.textContent || 3) + randi(-1, 1), 1, 7); });
</script>
