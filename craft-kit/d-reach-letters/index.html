<!doctype html>
<!-- Chill and Craft · Reach Letters · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reach Letters · contact menu made of letters</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --paper: #f6efe3;
    --speck: rgba(120, 80, 40, 0.07);
    --ink: #2a1d16;
    --muted: #7a6656;
    --letter: #e2512f;
    --letter-hi: #b9361a;
    --card: #fffaf2;
    --card-edge: #e8d9c4;
    --btn: #2a1d16;
    --btn-ink: #fffaf2;
    --ok: #2f7d4f;
    --focus: #2a1d16;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #1b1411;
    --speck: rgba(255, 200, 150, 0.05);
    --ink: #f7e9da;
    --muted: #b49c88;
    --letter: #ff9a6b;
    --letter-hi: #ffc4a3;
    --card: #261c17;
    --card-edge: #3d2d24;
    --btn: #ffb48e;
    --btn-ink: #1b1411;
    --ok: #7fd6a0;
    --focus: #ffb48e;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--speck) 1px, transparent 1.2px);
    background-size: 9px 9px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }
  .who { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .hint { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

  /* ---------- The word ---------- */
  .word {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    margin: 18px 0 30px;
    padding-top: 40px; /* room for letters to grow upward */
  }
  .letter {
    position: relative;
    border: 0;
    background: none;
    padding: 0 0.04em;
    font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(58px, 17vw, 132px);
    line-height: 0.9;
    color: var(--letter);
    cursor: pointer;
    transform-origin: 50% 100%;
    transition: transform 0.14s ease-out, margin 0.14s ease-out, color 0.25s, scale 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
    /* letters drop in one by one when the page opens */
    animation: drop-in 0.85s cubic-bezier(0.3, 1.4, 0.5, 1) backwards;
    animation-delay: calc(var(--i, 0) * 90ms + 120ms);
  }
  .letter:active { scale: 1.12 0.84; transition-duration: 0.06s; }
  @keyframes drop-in {
    from { opacity: 0; translate: 0 -80px; rotate: -16deg; }
    60% { opacity: 1; translate: 0 6px; rotate: 3deg; }
  }
  .letter:focus-visible { outline-offset: 2px; border-radius: 8px; }
  .letter[aria-expanded="true"] { color: var(--letter-hi); }
  /* a little dot marks the open letter */
  .letter::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -14px;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: var(--letter);
    transform: scale(0);
    transition: transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .letter[aria-expanded="true"]::before { transform: scale(1); }
  /* caption under each letter, shown on hover and focus */
  .cap {
    position: absolute;
    left: 50%;
    top: 100%;
    margin-top: 2px;
    transform: translate(-50%, -4px);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .letter:hover .cap, .letter:focus-visible .cap { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- The card that opens under the word ---------- */
  .slot { width: min(440px, 100%); min-height: 170px; }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 20px;
    padding: 18px 18px 16px;
    text-align: left;
    box-shadow: 0 20px 40px -28px rgba(80, 40, 10, 0.5);
    transform-origin: var(--arrow-x, 50%) 0;
    animation: unfold 0.38s cubic-bezier(0.25, 1.3, 0.5, 1);
  }
  .card[hidden] { display: none; }
  .card::before { /* the little pointer toward the letter */
    content: "";
    position: absolute;
    top: -8px;
    left: var(--arrow-x, 50%);
    width: 14px;
    height: 14px;
    margin-left: -7px;
    background: var(--card);
    border-left: 1px solid var(--card-edge);
    border-top: 1px solid var(--card-edge);
    transform: rotate(45deg);
    transition: left 0.3s;
  }
  @keyframes unfold { from { opacity: 0; transform: perspective(700px) rotateX(-38deg) translateY(-10px) scale(0.94); } }
  /* the card's parts follow each other in */
  .card .bit { animation: bit-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
  @keyframes bit-in { from { opacity: 0; transform: translateY(10px); } }
  .btn { transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.2s, box-shadow 0.2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -10px rgba(60, 30, 10, 0.6); }
  .card h2 { margin: 0 34px 4px 0; font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif; font-size: 22px; }
  .card .detail { margin: 0 0 14px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .close {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1;
  }
  .close:hover { background: var(--card-edge); color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 999px; padding: 10px 16px;
    background: var(--btn); color: var(--btn-ink);
    font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; text-decoration: none;
  }
  .btn.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--card-edge); }
  .btn:active { transform: translateY(1px) scale(0.96); transition-duration: 0.06s; }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  .note { font-size: 13px; color: var(--ok); font-weight: 600; min-height: 18px; margin: 10px 0 0; }
  .field { flex: 1 1 180px; min-width: 0; border: 1.5px solid var(--card-edge); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 14px; }
  .field:focus-visible { outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <p class="who">Mariam Haider · illustrator, Lahore</p>
  <p class="hint">Pick a letter to reach me</p>

  <nav class="word" id="word" aria-label="Contact">
    <button class="letter" type="button" data-key="r" style="--i:0" aria-expanded="false" aria-controls="card" aria-label="R, resume">R<span class="cap" aria-hidden="true">Resume</span></button>
    <button class="letter" type="button" data-key="e" style="--i:1" aria-expanded="false" aria-controls="card" aria-label="E, email">E<span class="cap" aria-hidden="true">Email</span></button>
    <button class="letter" type="button" data-key="a" style="--i:2" aria-expanded="false" aria-controls="card" aria-label="A, address">A<span class="cap" aria-hidden="true">Address</span></button>
    <button class="letter" type="button" data-key="c" style="--i:3" aria-expanded="false" aria-controls="card" aria-label="C, call">C<span class="cap" aria-hidden="true">Call</span></button>
    <button class="letter" type="button" data-key="h" style="--i:4" aria-expanded="false" aria-controls="card" aria-label="H, say hello">H<span class="cap" aria-hidden="true">Hello</span></button>
  </nav>

  <div class="slot">
    <section class="card" id="card" hidden aria-labelledby="card-title">
      <button class="close" id="close" type="button" aria-label="Close">×</button>
      <h2 id="card-title"></h2>
      <p class="detail" id="card-detail"></p>
      <div class="actions" id="card-actions"></div>
      <p class="note" id="note" aria-live="polite"></p>
    </section>
  </div>
</main>

<script>
  (function () {
    var word = document.getElementById("word");
    var letters = Array.prototype.slice.call(word.querySelectorAll(".letter"));
    var card = document.getElementById("card");
    var titleEl = document.getElementById("card-title");
    var detailEl = document.getElementById("card-detail");
    var actionsEl = document.getElementById("card-actions");
    var note = document.getElementById("note");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var open = -1;
    var bases = []; // letter centres without magnification
    var sendTimer = 0;

    // ---------- What each letter opens ----------
    var EMAIL = "mariam@studio.example";
    var PHONE = "+92 300 555 0142";
    var ADDRESS = "Studio 7, Mall Road, Lahore";
    var items = {
      r: { title: "Resume", detail: "One page: ten years of book covers, posters and type.",
        actions: '<button class="btn" type="button" data-act="download">Download resume</button>' },
      e: { title: "Email", detail: EMAIL,
        actions: '<a class="btn" href="mailto:' + EMAIL + '">Write an email</a><button class="btn ghost" type="button" data-act="copy" data-text="' + EMAIL + '">Copy</button>' },
      a: { title: "Studio address", detail: ADDRESS + ". Visits by appointment, Monday to Friday.",
        actions: '<button class="btn" type="button" data-act="copy" data-text="' + ADDRESS + '">Copy address</button>' },
      c: { title: "Call", detail: PHONE + " · 10 am to 6 pm",
        actions: '<a class="btn" href="tel:' + PHONE.replace(/\s/g, "") + '">Call now</a><button class="btn ghost" type="button" data-act="copy" data-text="' + PHONE + '">Copy number</button>' },
      h: { title: "Say hello", detail: "Leave a short note and I will reply within a day.",
        actions: '<label class="sr-only" for="hello">Your message</label><input class="field" id="hello" type="text" maxlength="140" placeholder="Hi Mariam, I loved your…" />' +
          '<button class="btn" type="button" data-act="send">Send</button>' }
    };

    // ---------- Dock style magnification ----------
    function measure() {
      // measure the resting layout, so growing letters never feed back into the maths
      letters.forEach(function (l) { l.style.transition = "none"; l.style.transform = ""; l.style.margin = ""; });
      bases = letters.map(function (l) {
        var r = l.getBoundingClientRect();
        return { x: r.left + r.width / 2, w: r.width };
      });
      letters.forEach(function (l) { void l.offsetWidth; l.style.transition = ""; });
    }
    function magnify(px) {
      letters.forEach(function (l, i) {
        var b = bases[i];
        var d = (px - b.x) / (b.w * 1.1);
        var s = 1 + 0.5 * Math.exp(-d * d); // bell curve: biggest under the pointer
        var lean = Math.max(-8, Math.min(8, d * (s - 1) * 14)); // neighbours lean toward the pointer
        l.style.transform = "translateY(" + (-(s - 1) * 18) + "px) rotate(" + lean.toFixed(2) + "deg) scale(" + s.toFixed(3) + ")";
        l.style.margin = "0 " + ((s - 1) * b.w * 0.5).toFixed(1) + "px";
      });
    }
    function relax() {
      letters.forEach(function (l) { l.style.transform = ""; l.style.margin = ""; });
    }
    word.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse" || reduce.matches) return;
      if (!bases.length) measure();
      magnify(e.clientX);
    });
    word.addEventListener("pointerleave", relax);
    window.addEventListener("resize", function () { bases = []; relax(); placeArrow(); });

    // ---------- Opening and closing the card ----------
    function placeArrow() {
      if (open < 0) return;
      var slot = card.getBoundingClientRect();
      var r = letters[open].getBoundingClientRect();
      var x = Math.max(24, Math.min(slot.width - 24, r.left + r.width / 2 - slot.left));
      card.style.setProperty("--arrow-x", x + "px");
    }
    function show(i) {
      var it = items[letters[i].dataset.key];
      if (open >= 0) letters[open].setAttribute("aria-expanded", "false");
      open = i;
      letters[i].setAttribute("aria-expanded", "true");
      clearTimeout(sendTimer);
      titleEl.textContent = it.title;
      detailEl.textContent = it.detail;
      actionsEl.innerHTML = it.actions;
      note.textContent = "";
      card.hidden = false;
      // replay the unfold, then let the title, text and buttons follow each other
      titleEl.classList.remove("bit");
      detailEl.classList.remove("bit");
      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "";
      [titleEl, detailEl].concat(Array.prototype.slice.call(actionsEl.children)).forEach(function (el, k) {
        el.classList.add("bit");
        el.style.animationDelay = 90 + k * 70 + "ms";
      });
      // the chosen letter does a happy wobble
      if (!reduce.matches && letters[i].animate) {
        letters[i].animate([
          { rotate: "0deg", scale: "1 1" },
          { rotate: "-10deg", scale: "1.08 0.92", offset: 0.2 },
          { rotate: "7deg", scale: "0.95 1.06", offset: 0.45 },
          { rotate: "-3deg", scale: "1 1", offset: 0.7 },
          { rotate: "0deg", scale: "1 1" }
        ], { duration: 750, easing: "ease-out" });
      }
      placeArrow();
    }
    function hide(returnFocus) {
      if (open < 0) return;
      var was = open;
      letters[open].setAttribute("aria-expanded", "false");
      open = -1;
      clearTimeout(sendTimer);
      card.hidden = true;
      if (returnFocus) letters[was].focus();
    }
    letters.forEach(function (l, i) {
      l.addEventListener("click", function () {
        if (open === i) hide(false);
        else show(i);
      });
    });
    document.getElementById("close").addEventListener("click", function () { hide(true); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(true); });

    // ---------- Card actions ----------
    function copyText(text) {
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (err) { /* ignore */ }
        ta.remove();
        return Promise.resolve();
      }
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(fallback);
      return fallback();
    }
    function downloadResume() {
      var text = "Mariam Haider\nIllustrator and type designer, Lahore\n\n" +
        "2019 to now   Freelance: book covers, posters, shop signs\n" +
        "2015 to 2019  Designer at a Lahore publishing house\n\n" +
        "Email: " + EMAIL + "\nPhone: " + PHONE + "\n";
      var url = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = "mariam-haider-resume.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    actionsEl.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-act]");
      if (!btn) return;
      var act = btn.dataset.act;
      if (act === "copy") {
        copyText(btn.dataset.text).then(function () { note.textContent = "Copied: " + btn.dataset.text; });
      } else if (act === "download") {
        downloadResume();
        note.textContent = "Resume saved as a text file.";
      } else if (act === "send") {
        var field = document.getElementById("hello");
        var msg = field.value.trim();
        if (!msg) {
          note.textContent = "Write a few words first.";
          field.focus();
          return;
        }
        btn.disabled = true;
        field.disabled = true;
        btn.textContent = "Sending…";
        note.textContent = "";
        sendTimer = setTimeout(function () {
          btn.textContent = "Sent ✓";
          note.textContent = "Thanks! Your note is on its way.";
          sendTimer = setTimeout(function () {
            btn.disabled = false;
            field.disabled = false;
            field.value = "";
            btn.textContent = "Send";
          }, 2200);
        }, 1100);
      }
    });
    actionsEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.id === "hello") {
        e.preventDefault();
        var send = actionsEl.querySelector('[data-act="send"]');
        if (send && !send.disabled) send.click();
      }
    });
  })();
</script>
</body>
</html>
