<!doctype html>
<!-- Chill & Craft · Pechkas · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pechkas · Mobile repair shop</title>
<style>
/* ===== Shared base: reset, overlays, forms, tables, charts (themed by the variables below) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* page entrance: each app picks --enter-anim */
.enter{animation:var(--enter-anim,rise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px)}}
@keyframes blurin{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.row-in{animation:fadein .4s ease both;animation-delay:calc(var(--i,0) * 28ms)}

/* buttons press in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm,10px);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;background:var(--surface2);color:var(--text);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .35s}

/* chips and segmented control */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent,#fff)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .4s cubic-bezier(.3,1.3,.5,1),width .4s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:800;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 50% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 82%)}

/* tooltip, toasts, popovers */
#tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tip-bg,#111827);color:var(--tip-ink,#f9fafb);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:240px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#toasts{position:fixed;z-index:130;right:16px;bottom:16px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#111827);color:var(--tip-ink,#fff);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastin .45s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{color:var(--good)}
.toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--warn)}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.pop{position:fixed;z-index:110;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm,12px);box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;animation:pop .2s ease-out}
.pop [role="menuitem"]{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pop [role="menuitem"]:hover,.pop [role="menuitem"]:focus{background:var(--surface2);outline:none}
.pop-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{display:grid;gap:2px;padding:9px 10px 9px 22px;border-radius:8px;text-decoration:none;position:relative}
.note:hover{background:var(--surface2)}
.note.unread::before{content:"";position:absolute;left:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* modal and drawer */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.backdrop.side{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r,16px);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:modalin .38s cubic-bezier(.2,1.1,.3,1)}
.modal.wide{max-width:760px}
.modal.drawer{max-width:min(500px,100vw);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);animation:drawerin .4s cubic-bezier(.2,.9,.2,1)}
.backdrop.out{animation:fadein .22s reverse forwards}
.backdrop.out .modal{animation:modalin .22s reverse forwards}
.backdrop.out .drawer{animation:drawerin .25s reverse forwards}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes drawerin{from{transform:translateX(100%)}}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px}
.m-x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.m-body{padding:18px}
.m-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--surface);border-top:1px solid var(--line)}

/* forms with inline errors */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:10px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);animation:shake .35s}
.field .hint{color:var(--muted);font-size:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* data tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-search input{width:min(260px,100%);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tbl-search{flex:1 1 180px;max-width:280px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover,.tbl tr.click:focus{background:var(--surface2);outline:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sort-ic{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.3;transition:transform .2s}
th[aria-sort] .sort-ic{opacity:1}
th[aria-sort="ascending"] .sort-ic{transform:rotate(180deg) translateY(4px)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.pager button[disabled]{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.6,.1,.2,1) forwards}
.chart .fade{animation:fadein 1s .35s both}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hover{transition:opacity .15s;pointer-events:none}
.chart .hover circle{stroke:var(--surface);stroke-width:2.5}
.chart .grow{animation:grow .75s cubic-bezier(.2,.9,.3,1.15) both}
.chart .bcol{transition:opacity .2s}
.chart.hovering .bcol{opacity:.45}
.chart.hovering .bcol.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut{position:relative;flex:none}
.donut svg{overflow:visible}
.donut .seg-c{fill:none;transition:stroke-width .2s}
.donut .seg-c:hover{stroke-width:calc(var(--sw) * 1.25)}
.donut .sweep{animation:sweep .9s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 var(--C)}}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1 1 140px;min-width:0}
.lg li{display:flex;align-items:center;gap:4px}
.lg b{margin-left:auto;padding-left:10px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-f{display:block;height:100%;border-radius:999px;transform-origin:left}
.hb-f.growx{animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.ring-v{animation:ringin 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringin{from{stroke-dasharray:0 1}}
.gauge .g-v{animation:ringin 1.3s cubic-bezier(.3,.9,.3,1) both}
.hm{display:grid;gap:3px}
.hm-c{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0;animation:pop .4s both}
.spark{height:38px}

/* drag and drop */
.dragging{opacity:.35}
.ghost{position:fixed;z-index:140;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.3);opacity:.95;transition:none!important;animation:none!important}
.drop-hot{outline:2px dashed var(--accent);outline-offset:3px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* command search */
.cmdk .m-body{padding:12px}
.cmdk-in{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto}
.cmdk-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk-list li[aria-selected="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.cmdk-list li small{opacity:.7}
.cmdk-k{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* mobile nav drawer (sidebar apps) */
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.menu-btn{display:none!important}
@media (max-width:860px){
  .menu-btn{display:inline-grid!important}
  .side{position:fixed!important;z-index:60;top:0;bottom:0;left:0;width:min(280px,84vw)!important;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* theme switch reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,0))}}

/* print only the chosen area */
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}body.printing #print-root{display:block}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Pechkas look: workshop black, neon orange and cyan, circuit traces, sharp outlined panels ===== */
:root{--mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;--bg:#edf0f4;--surface:#ffffff;--surface2:#f2f4f7;--text:#0f1720;--muted:#5a6573;--line:#d9dfe7;--accent:#e85d04;--on-accent:#fff;--cyan:#0891b2;--good:#059669;--warn:#d97706;--bad:#dc2626;--c1:#e85d04;--c2:#0891b2;--c3:#7c3aed;--c4:#059669;--c5:#db2777;--r:6px;--r-sm:5px;--tip-bg:#0f1720;--trace:#9fb0c3;--enter-anim:slidein}
[data-theme="dark"]{--bg:#090b0e;--surface:#10141a;--surface2:#171d24;--text:#e6edf3;--muted:#8a97a6;--line:#232b36;--accent:#ff7a1a;--on-accent:#140800;--cyan:#22d3ee;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--c1:#ff7a1a;--c2:#22d3ee;--c3:#a78bfa;--c4:#34d399;--c5:#f472b6;--tip-bg:#000;--trace:#1f2a36}
body{background:var(--bg)}
.trace{position:fixed;inset:0;z-index:-1;pointer-events:none}
.trace path{fill:none;stroke:var(--trace);stroke-width:1.2}
.trace circle{fill:var(--bg);stroke:var(--trace);stroke-width:1.2}
.trace .pulse{stroke:var(--accent);stroke-width:2;stroke-dasharray:.04 .96;animation:runp 7s linear infinite}
.trace .pulse.b{stroke:var(--cyan);animation-duration:9s;animation-delay:-3s}
@keyframes runp{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mono{font-family:var(--mono)}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* sidebar with grouped links and a neon bar marker */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;text-decoration:none;color:inherit;border-bottom:1px dashed var(--line);margin-bottom:6px}
.brand b{display:block;font-size:19px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.nav{position:relative;display:grid;gap:2px}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);padding:12px 10px 4px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;text-decoration:none;color:var(--muted);font-weight:650;font-size:14px;transition:color .2s,background .2s}
.nav a:hover{color:var(--text);background:var(--surface2)}
.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"] .ic{color:var(--accent)}
.nav-marker{position:absolute;left:0;right:0;top:0;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent),transparent);transition:transform .4s cubic-bezier(.2,.9,.3,1.2),height .25s;z-index:0}
.nav-marker::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.side-foot{margin-top:auto;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding:10px 6px 0;display:grid;gap:4px}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);margin-right:6px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-t{flex:1;min-width:0}
.top-t h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--mono);font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--cyan)}
.icon-btn{border-radius:4px}
#view{padding:20px 22px 30px;flex:1}
/* outlined panels with corner brackets */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .2s,border-color .2s,box-shadow .2s;min-width:0}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--accent);pointer-events:none;opacity:.8;transition:all .25s}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 12px 28px -18px color-mix(in srgb,var(--accent) 70%,transparent)}
.card:hover::before,.card:hover::after{width:20px;height:20px}
.btn{border-radius:4px;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.btn.primary{box-shadow:0 0 0 1px var(--accent),0 6px 16px -8px var(--accent)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.cy{background:var(--cyan);color:#001318}
.chip,.seg,.seg button,.seg .thumb{border-radius:4px}
.h2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.h2 h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.6fr}
.g2{grid-template-columns:1fr 1fr}
.mt{margin-top:16px}
.kpi .k-l{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .k-v{font-family:var(--mono);font-size:28px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi .k-v.o{color:var(--accent)}.kpi .k-v.c{color:var(--cyan)}
/* phone x-ray (signature) */
.bench{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.xray{position:relative;width:130px;margin:auto}
.xray svg{display:block;width:100%;height:auto;overflow:visible}
.xray .body{fill:color-mix(in srgb,var(--cyan) 8%,var(--surface2));stroke:var(--cyan);stroke-width:2}
.xray .part{fill:none;stroke:color-mix(in srgb,var(--cyan) 55%,transparent);stroke-width:1.4}
.xray .part.bad{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 18%,transparent);animation:throb 1.2s ease-in-out infinite}
@keyframes throb{50%{fill:color-mix(in srgb,var(--bad) 40%,transparent)}}
.xray .beam{fill:url(#beamG);animation:scan 2.4s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(212px)}}
.xray .ok{opacity:0}
.xray.ready .ok{opacity:1;animation:pop .5s both}
.xray.ready .beam{display:none}
.timer{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums}
.pipe{display:grid;gap:8px}
.pipe .pr{display:grid;grid-template-columns:130px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.pipe .tr{height:18px;background:var(--surface2);border-radius:3px;overflow:hidden}
.pipe .tr i{display:block;height:100%;transform-origin:left;animation:growx .9s cubic-bezier(.2,.9,.3,1) both;background:repeating-linear-gradient(135deg,var(--c),var(--c) 6px,color-mix(in srgb,var(--c) 75%,#000) 6px 12px)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.feed li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 8px;border-left:2px solid var(--line);background:var(--surface2);border-radius:0 4px 4px 0;animation:slidein .4s both}
.feed li .mono{color:var(--muted);font-size:11.5px}
/* kanban board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:300px;display:grid;gap:8px;align-content:start;transition:background .2s}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px;border-bottom:2px solid var(--cc);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.col-h .n{font-family:var(--mono);background:var(--surface);border-radius:3px;padding:0 6px}
.jc{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cc);border-radius:5px;padding:9px 10px;display:grid;gap:4px;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .15s,box-shadow .15s;animation:pop .3s both}
.jc:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(0,0,0,.6)}
.jc .jt{all:unset;cursor:pointer;font-weight:800;font-size:13.5px;padding-right:28px}
.jc .jt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jc .meta{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);align-items:center}
.jc .no{font-family:var(--mono);font-size:11px;color:var(--accent)}
.jc .mv{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:4px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:0;touch-action:none}
.age{font-family:var(--mono);font-size:11px;padding:0 5px;border-radius:3px;background:var(--surface2)}
.age.late{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tav{width:22px;height:22px;font-size:10px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:600}
.accs{display:flex;flex-wrap:wrap;gap:6px}
.imei-ok{color:var(--good);font-family:var(--mono);font-size:12px}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{background:var(--surface)}.top{padding:10px 14px}#view{padding:14px}.clock{display:none}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:10px}.kpi .k-v{font-size:20px}.bench{grid-template-columns:1fr}.top-t h1{font-size:16px}.pipe .pr{grid-template-columns:96px 1fr 30px}.timer{font-size:24px}}
</style>

<script>
'use strict';
/* ===== Mini core: helpers, data seeding, router, theme, overlays, tables, charts, drag and drop ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10;
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
let RM=!!RMQ.matches;try{RMQ.addEventListener('change',e=>{RM=e.matches})}catch(e){}

/* --- seeded random so the demo data is the same on every load --- */
let R=Math.random;
function seedRng(s){let a=s>>>0;R=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],chance=p=>R()<p;
let _n=0;const uid=p=>(p||'')+(Date.now()%1e8).toString(36)+(++_n).toString(36);

/* --- Pakistani names, cities and phone numbers for demo data --- */
const PK={m:['Ahmed','Bilal','Usman','Hamza','Ali','Hassan','Imran','Faisal','Kashif','Zubair','Saad','Waqas','Adnan','Junaid','Rizwan','Tariq','Asad','Fahad','Shahid','Naveed','Arslan','Danish','Haris','Owais','Salman','Yasir','Nadeem','Sohail'],
f:['Ayesha','Fatima','Sana','Hira','Maryam','Zainab','Amna','Rabia','Nida','Iqra','Saima','Mehwish','Komal','Sadia','Bushra','Farah','Anum','Kiran','Laiba','Areeba','Samina','Noreen'],
l:['Khan','Malik','Butt','Sheikh','Qureshi','Chaudhry','Siddiqui','Raza','Iqbal','Abbasi','Mirza','Hashmi','Javed','Aslam','Rana','Awan','Baig','Ansari','Gill','Bhatti','Mughal','Niazi'],
cities:['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta','Sialkot','Gujranwala','Hyderabad','Bahawalpur','Sargodha','Abbottabad','Sukkur']};
const pname=g=>pick(g==='f'?PK.f:g==='m'?PK.m:(chance(.5)?PK.m:PK.f))+' '+pick(PK.l);
const phone=()=>'03'+rnd(0,4)+rnd(0,9)+'-'+String(rnd(1000000,9999999));

/* --- number and money formats (PKR) --- */
const NF=new Intl.NumberFormat('en-US');
const num=n=>NF.format(Math.round(+n||0));
const rs=n=>((+n||0)<0?'-':'')+'Rs '+NF.format(Math.abs(Math.round(+n||0)));
function short(n){n=+n||0;const a=Math.abs(n),s=n<0?'-':'',f=(v,u)=>s+(v>=100?Math.round(v):+v.toFixed(1))+u;return a>=1e9?f(a/1e9,'B'):a>=1e6?f(a/1e6,'M'):a>=1e3?f(a/1e3,'K'):s+Math.round(a)}
const rsk=n=>'Rs '+short(n);
const pct=(n,d=0)=>(+n||0).toFixed(d)+'%';
const FMT={num,rs,short,rsk,pct:v=>pct(v),pct1:v=>pct(v,1)};

/* --- dates (local, day precision) --- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};
const today=iso(TODAY);
const dd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
const ddy=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const daysAgo=s=>Math.round((TODAY-pd(s))/864e5);
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mlabel=k=>{const p=k.split('-');return MON[+p[1]-1]+' '+p[0].slice(2)};

/* --- storage that never throws (works when storage is blocked) --- */
const store={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* --- icons (our own simple strokes) --- */
const ICO={home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',cart:'<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',chart:'M4 20V11M10 20V5M16 20v-6M2 20h20',gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a5.5 5.5 0 0 1 3.5 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'M12 5v14M5 12h14',minus:'M5 12h14',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',menu:'M4 7h16M4 12h16M4 17h16',x:'M6 6l12 12M18 6L6 18',check:'M5 12.5l4.5 4.5L19 7',phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',truck:'<path d="M2 6h11v10H2zM13 9h4.5l3 3.5V16H13"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',file:'M6 2.5h8l4.5 4.5v14.5H6zM14 2.5V7h4.5M9 12h6M9 16h6',receipt:'M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21zM9 8h6M9 12h6M9 16h3',wrench:'M15 4a5 5 0 0 0-4.6 6.9L4 17.3V20h2.7l6.4-6.4A5 5 0 0 0 20 9l-3 3-3-1-1-3 3-3z',trophy:'M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.6 4M16 6h3.5a3.5 3.5 0 0 1-3.6 4M12 13v4M8.5 21h7M9.5 17h5v4h-5z',edit:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',print:'M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z',chat:'M4 20l1.3-3.9A8 8 0 1 1 8 19zM9 10h.01M12 10h.01M15 10h.01',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',arrow:'M5 12h14M13 6l6 6-6 6',filter:'M4 5h16l-6 7v6l-4 2v-8z',refresh:'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',alert:'M12 3l10 18H2zM12 10v5M12 18h.01',shop:'M3 9l2-5h14l2 5M4 9v11h16V9M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M10 20v-5h4v5',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>',food:'M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1-3 4-3 7h3v11',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',map:'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',down:'M12 4v12M6 11l6 6 6-6M5 20h14',hash:'M5 9h14M5 15h14M10 4L8 20M16 4l-2 16',coin:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',school:'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6',spark:'M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6'};
const ic=(n,s=20)=>{const d=ICO[n]||'';return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d[0]==='<'?d:`<path d="${d}"/>`}</svg>`};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=s=>String(s).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(n,cls='')=>`<span class="av ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;

/* --- WhatsApp reminder: only builds a wa.me link, the user opens it --- */
const WA_BASE='https://wa'+'.me/';

  <g clip-path="url(#${g})">${j.stage==='diag'&&!RM?'<rect class="beam" x="6" y="-6" width="108" height="24"/>':''}</g><g class="ok"><circle cx="60" cy="115" r="26" fill="var(--good)"/><path d="M48 115l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div>`}

function pgBoard(el){head('Job board','Drag a card to the next stage, or use its move button');const A=S.jobs.filter(j=>j.stage!=='done'||j.log[j.log.length-1].d===today);
  const vis=j=>(BT==='all'||j.tech===BT)&&(!BQ||(j.no+' '+j.model+' '+j.cust+' '+j.fault+' '+j.imei).toLowerCase().includes(BQ.toLowerCase()));
  el.innerHTML=`<div class="h2"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label><span class="sr">Search jobs</span><input class="inp" id="bq" type="search" placeholder="Search job, model, IMEI…" value="${esc(BQ)}" style="width:min(260px,100%)"></label><div class="chips" role="group" aria-label="Technician"><button class="chip" data-bt="all" aria-pressed="${BT==='all'}">All techs</button>${S.techs.map(t=>`<button class="chip" data-bt="${t.id}" aria-pressed="${BT===t.id}">${esc(t.name.split(' ')[0])}</button>`).join('')}</div></div><button class="btn primary" id="nj">${ic('plus',15)}New job card</button></div>
  <div class="board" id="board">${STAGES.map(([k,l,c])=>{const L=A.filter(j=>j.stage===k&&vis(j)).sort((a,b)=>a.created.localeCompare(b.created));return `<section class="col" data-zone="${k}" style="--cc:${c}" aria-label="${l}"><div class="col-h"><span>${l}</span><span class="n">${L.length}</span></div>${L.map((j,i)=>`<article class="jc" data-id="${j.id}" style="--cc:${c};animation-delay:${i*40}ms"><span class="no">#${j.no}</span><button class="jt" data-open="${j.id}">${esc(j.model)}</button><span class="muted" style="font-size:12.5px">${esc(j.fault)}</span><div class="meta"><span>${esc(j.cust)}</span><b class="mono" style="color:var(--text)">${rsk(billOf(j))}</b></div><div class="meta">${av(TK(j.tech).name,'tav')}${k==='wait'&&j.waitPart?`<span style="font-size:11px">${esc(j.waitPart.split(' · ')[0])}</span>`:''}<span class="age ${late(j)?'late':''}">${k==='done'?'today':dIn(j)+'d in'}</span></div><button class="mv" data-mvj="${j.id}" aria-label="Move job ${j.no}">${ic('arrow',14)}</button></article>`).join('')||'<p class="empty" style="padding:14px 4px;font-size:12.5px">Drop jobs here</p>'}</section>`}).join('')}</div>`;
  dnd($('#board',el),{item:'.jc',zone:'.col',handle:'.mv',onDrop:(id,z)=>moveJob(id,z)});
  $('#bq',el).addEventListener('input',e=>{BQ=e.target.value;clearTimeout(pgBoard.t);pgBoard.t=setTimeout(()=>{refresh();const q=$('#bq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250)});
  el.addEventListener('click',e=>{const t=e.target.closest('[data-bt]'),o=e.target.closest('[data-open]'),mv=e.target.closest('[data-mvj]'),card=e.target.closest('.jc');
    if(t){BT=t.dataset.bt;refresh();return}if(e.target.closest('#nj')){jobForm();return}
    if(mv){const j=JB(mv.dataset.mvj);menu(mv,STAGES.filter(s=>s[0]!==j.stage).map(s=>({label:'Move to '+s[1],fn:()=>moveJob(j.id,s[0])})),'Job #'+j.no);return}
    if(o)openJob(o.dataset.open);else if(card)openJob(card.dataset.id)})}

/* job cards table */
function pgJobs(el){head('Job cards','Every phone that came in, with IMEI and bill');
  el.innerHTML=`<section class="card"><div class="h2"><h2>${S.jobs.length} job cards</h2><button class="btn primary" id="nj">${ic('plus',15)}New job card</button></div><div id="jT"></div></section>`;
  table($('#jT',el),{id:'jobs',search:'Search job no., IMEI, customer, model',chips:['All','Open','Ready','Delivered','Late'],chipFn:(j,c)=>c==='Open'?j.stage!=='done':c==='Ready'?j.stage==='ready':c==='Delivered'?j.stage==='done':late(j),rows:()=>S.jobs,sortCol:0,sortDir:-1,pageSize:10,text:j=>j.no+' '+j.imei+' '+j.cust+' '+j.phone+' '+j.model+' '+j.fault,
    cols:[{label:'Job',k:'no',f:j=>`<b class="mono" style="color:var(--accent)">#${j.no}</b>`},{label:'Received',k:'created',f:j=>dd(j.created)},{label:'Phone',k:'model',f:j=>`<b>${esc(j.model)}</b><br><small class="mono muted">${j.imei}</small>`},{label:'Fault',k:'fault'},{label:'Customer',k:'cust',f:j=>`${esc(j.cust)}<br><small class="muted">${esc(j.phone)}</small>`},{label:'Tech',v:j=>TK(j.tech).name,f:j=>esc(TK(j.tech).name.split(' ')[0])},{label:'Bill',num:true,v:billOf,f:j=>rs(billOf(j))},{label:'Due',num:true,v:dueOf,f:j=>dueOf(j)?`<b style="color:var(--bad)">${rs(dueOf(j))}</b>`:'-'},{label:'Stage',k:'stage',f:j=>stTag(j.stage)}],onRow:id=>openJob(id)});
  $('#nj',el).addEventListener('click',()=>jobForm())}

/* parts */
const partF=[{k:'name',label:'Part',type:'select',opts:['Screen','Battery','Charging port','Back glass','Camera','Speaker']},{k:'model',label:'For model',type:'select',opts:MODELS.map(m=>m[0]+' '+m[1])},{k:'qty',label:'In stock',type:'number',req:true,min:0,max:999},{k:'min',label:'Alert when at or below',type:'number',req:true,min:0,max:99},{k:'cost',label:'Buy price (Rs)',type:'money',req:true,min:0,max:200000},{k:'price',label:'Sale price (Rs)',type:'money',req:true,min:0,max:300000,check:(v,o)=>v<o.cost?'Sale price is below the buy price':''}];
function pgParts(el){head('Parts stock','Screens, batteries and ports per model, with low-stock alerts');const low=S.parts.filter(p=>p.qty<=p.min),waiting=active().filter(j=>j.stage==='wait');
  el.innerHTML=`<div class="grid g4">${[['Part lines',S.parts.length,'num'],['Stock value',sum(S.parts,p=>p.qty*p.cost),'rsk'],['Low or out',low.length,'num'],['Jobs waiting for parts',waiting.length,'num']].map((k,i)=>`<article class="card kpi"><div class="k-l">${k[0]}</div><div class="k-v ${i===2&&k[1]?'o':''}">${cnt(k[1],k[2],'pp'+i)}</div></article>`).join('')}</div>
  <div class="grid g21 mt"><section class="card"><div class="h2"><h2>Stock list</h2><button class="btn primary sm" id="addP">${ic('plus',14)}Add part</button></div><div id="pT"></div></section><section class="card"><div class="h2"><h2>Jobs waiting for parts</h2></div><ul class="feed">${waiting.map(j=>`<li style="grid-template-columns:1fr auto"><span><b class="mono" style="color:var(--accent)">#${j.no}</b> ${esc(j.waitPart||j.model)}<br><small class="muted">${esc(j.cust)} · ${dIn(j)} days in</small></span><button class="btn sm" data-open="${j.id}">Open</button></li>`).join('')||'<li>No job is waiting.</li>'}</ul></section></div>`;
  table($('#pT',el),{id:'parts',search:'Search part or model',chips:['All','Low stock','Out of stock','Screen','Battery'],chipFn:(p,c)=>c==='Low stock'?p.qty<=p.min:c==='Out of stock'?p.qty===0:p.name===c,rows:()=>S.parts,pageSize:9,text:p=>p.name+' '+p.model,rowCls:p=>p.qty<=p.min?'lowrow':'',
    cols:[{label:'Part',k:'name',f:p=>`<b>${esc(p.name)}</b>`},{label:'Model',k:'model'},{label:'Qty',k:'qty',num:true,f:p=>`<b class="mono" style="color:${!p.qty?'var(--bad)':p.qty<=p.min?'var(--warn)':'inherit'}">${p.qty}</b>${p.qty<=p.min?' '+ic('alert',14):''}`},{label:'Buy',k:'cost',num:true,f:p=>rs(p.cost)},{label:'Sell',k:'price',num:true,f:p=>rs(p.price)},{label:'',nosort:true,f:p=>`<span style="display:inline-flex;gap:6px"><button class="btn sm" data-rs="${p.id}">+ Stock</button><button class="btn sm ghost" data-ep="${p.id}" aria-label="Edit ${esc(p.name)} ${esc(p.model)}">${ic('edit',14)}</button><button class="btn sm ghost" data-dp="${p.id}" aria-label="Delete ${esc(p.name)} ${esc(p.model)}">${ic('trash',14)}</button></span>`}]});
  el.addEventListener('click',e=>{const r=e.target.closest('[data-rs]'),ep=e.target.closest('[data-ep]'),dp=e.target.closest('[data-dp]'),o=e.target.closest('[data-open]');if(o)openJob(o.dataset.open);
    if(r){const p=PT(r.dataset.rs),F=[{k:'qty',label:'Quantity bought',type:'number',req:true,min:1,max:500,val:Math.max(1,p.min*2-p.qty)},{k:'cost',label:'Price each (Rs)',type:'money',req:true,min:0,max:200000,val:p.cost},{k:'cash',label:'Paid in cash from the drawer?',type:'select',opts:[['yes','Yes'],['no','No, on account']]}];modal({title:'Add stock · '+esc(p.name+' '+p.model),body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Add',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;p.qty+=v.qty;p.cost=v.cost;if(v.cash==='yes')S.cash.push({id:uid('c'),date:today,time:nowT(),kind:'out',cat:'Part purchase',amt:v.qty*v.cost,note:v.qty+' x '+p.name+' '+p.model});save();refresh();toast(v.qty+' added. Stock is now '+p.qty)}}]})}
    if(ep||e.target.closest('#addP')){const p=ep?PT(ep.dataset.ep):null;modal({title:p?'Edit part':'Add part',body:formHTML(partF,p||{qty:1,min:1}),actions:[{label:'Cancel',cls:'ghost'},{label:'Save',cls:'primary',fn:m=>{const v=readForm(m,partF);if(!v)return false;if(p)Object.assign(p,v);else S.parts.push({id:uid('p'),...v});save();refresh();toast('Part saved')}}]})}
    if(dp){const p=PT(dp.dataset.dp);confirmBox(`Delete ${esc(p.name)} for ${esc(p.model)} from stock?`,()=>{S.parts=S.parts.filter(x=>x!==p);save();refresh();toast('Part deleted')})}})}

/* customers */
function pgCustomers(el){head('Customers','Repeat customers and what they spent');const m={};S.jobs.forEach(j=>{const c=m[j.phone]||(m[j.phone]={id:j.phone,name:j.cust,phone:j.phone,jobs:[],spent:0,last:''});c.jobs.push(j);c.spent+=paidOf(j);if(j.created>c.last)c.last=j.created});const L=Object.values(m);
  el.innerHTML=`<section class="card"><div class="h2"><h2>${L.length} customers</h2><span class="muted" style="font-size:13px">${L.filter(c=>c.jobs.length>1).length} came back more than once</span></div><div id="cT"></div></section>`;
  table($('#cT',el),{id:'cust',search:'Search name or mobile',chips:['All','Repeat','Has a phone in shop'],chipFn:(c,ch)=>ch==='Repeat'?c.jobs.length>1:c.jobs.some(j=>j.stage!=='done'),rows:()=>L,sortCol:3,sortDir:-1,pageSize:10,
    cols:[{label:'Customer',k:'name',f:c=>`<span style="display:flex;gap:8px;align-items:center">${av(c.name)}<b>${esc(c.name)}</b></span>`},{label:'Mobile',k:'phone',f:c=>`<span class="mono">${esc(c.phone)}</span>`},{label:'Jobs',num:true,v:c=>c.jobs.length},{label:'Last visit',k:'last',f:c=>dd(c.last)},{label:'Spent',num:true,k:'spent',f:c=>rs(c.spent)},{label:'',nosort:true,f:c=>{const j=c.jobs[c.jobs.length-1];return waA(j,`Hello ${c.name.split(' ')[0]}, thank you for visiting ${S.cfg.name}. Your repair has ${S.cfg.warranty} days warranty on the replaced part.`,' Message')}}],onRow:id=>{const c=m[id];if(c)openJob(c.jobs[c.jobs.length-1].id)}})}

/* daily cash report */
let CD=today;
function pgCash(el){head('Daily cash','Job payments, accessory sales and expenses for the day');const E=S.cash.filter(c=>c.date===CD).sort((a,b)=>a.time.localeCompare(b.time)),inn=sum(E.filter(c=>c.kind==='in'),c=>c.amt),out=sum(E.filter(c=>c.kind==='out'),c=>c.amt),close=S.closes[CD],exp=S.cfg.open+inn-out;
  const days=Array.from({length:30},(_,k)=>iso(addD(TODAY,k-29)));
  el.innerHTML=`<div class="h2"><div style="display:flex;gap:8px;align-items:center"><button class="icon-btn" id="cP" aria-label="Previous day">${ic('arrow',15).replace('<svg','<svg style="transform:scaleX(-1)"')}</button><label><span class="sr">Day</span><input class="inp" type="date" id="cDate" value="${CD}" max="${today}"></label><button class="icon-btn" id="cN" aria-label="Next day">${ic('arrow',15)}</button></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn cy" id="sale">${ic('tag',15)}Accessory sale</button><button class="btn" id="exp">${ic('minus',15)}Expense</button><button class="btn primary" id="close">${ic('check',15)}Close day</button><button class="btn ghost" id="pr" aria-label="Print the day">${ic('print',15)}</button></div></div>
  <div class="grid g4">${[['Opening float',S.cfg.open],['Cash in',inn],['Cash out',out],['Expected in drawer',exp]].map((k,i)=>`<article class="card kpi"><div class="k-l">${k[0]}</div><div class="k-v ${i===1?'c':i===3?'o':''}">${cnt(k[1],'rs','cd'+i+CD)}</div>${i===3&&close?`<div class="k-s">Counted ${rs(close.counted)} · ${close.counted-close.expected===0?'matches':(close.counted<close.expected?'short ':'over ')+rs(Math.abs(close.counted-close.expected))}</div>`:''}</article>`).join('')}</div>
  <div class="grid g12 mt"><section class="card"><div class="h2"><h2>${ddy(CD)}</h2><span class="tag ${close?'good':'warn'}">${close?'Closed':'Open'}</span></div><div id="eT"></div></section><section class="card"><div class="h2"><h2>Last 30 days</h2></div><div class="chart" id="cC"></div></section></div>`;
  table($('#eT',el),{id:'cash'+CD,chips:['All','In','Out'],chipFn:(c,ch)=>c.kind===ch.toLowerCase(),rows:()=>E,pageSize:9,empty:'No entries for this day.',cols:[{label:'Time',k:'time',f:c=>`<span class="mono">${c.time}</span>`},{label:'Type',k:'cat'},{label:'Note',k:'note'},{label:'Amount',num:true,v:c=>c.kind==='in'?c.amt:-c.amt,f:c=>`<b class="mono" style="color:${c.kind==='in'?'var(--good)':'var(--bad)'}">${c.kind==='in'?'+':'-'}${num(c.amt)}</b>`},{label:'',nosort:true,f:c=>c.job?'':`<button class="btn sm ghost" data-dc="${c.id}" aria-label="Delete entry">${ic('trash',14)}</button>`}]});
  barChart($('#cC',el),{labels:days.map(dd),series:[{name:'In',color:'var(--c2)',data:days.map(d=>sum(S.cash.filter(c=>c.date===d&&c.kind==='in'),c=>c.amt))},{name:'Out',color:'var(--c1)',data:days.map(d=>sum(S.cash.filter(c=>c.date===d&&c.kind==='out'),c=>c.amt))}],fmt:rsk,tfmt:rs,h:250});
  const setDay=d=>{if(d>today){toast('That day has not come yet','info');return}CD=d;refresh()};
  $('#cDate',el).addEventListener('change',e=>e.target.value&&setDay(e.target.value));
  el.addEventListener('click',e=>{if(e.target.closest('#cP'))setDay(iso(addD(pd(CD),-1)));if(e.target.closest('#cN'))setDay(iso(addD(pd(CD),1)));
    const dc=e.target.closest('[data-dc]');if(dc)confirmBox('Delete this cash entry?',()=>{S.cash=S.cash.filter(c=>c.id!==dc.dataset.dc);save();refresh();toast('Entry deleted')});
    if(e.target.closest('#sale')){const F=[{k:'item',label:'Item',type:'select',opts:SALES.map(s=>[s[0],s[0]+' · '+rs(s[1])])},{k:'qty',label:'Quantity',type:'number',req:true,min:1,max:50,val:1}];modal({title:'Accessory sale',body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Add sale',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;const s=SALES.find(x=>x[0]===v.item);S.cash.push({id:uid('c'),date:CD,time:nowT(),kind:'in',cat:'Accessory sale',amt:s[1]*v.qty,note:v.qty+' x '+s[0]});save();refresh();toast(rs(s[1]*v.qty)+' sale added')}}]})}
    if(e.target.closest('#exp')){const F=[{k:'cat',label:'Expense',type:'select',opts:EXP},{k:'amt',label:'Amount (Rs)',type:'money',req:true,min:1,max:500000},{k:'note',label:'Note',req:true,ph:'What was it for?'}];modal({title:'Add expense',body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Add expense',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;S.cash.push({id:uid('c'),date:CD,time:nowT(),kind:'out',...v});save();refresh();toast(rs(v.amt)+' expense added')}}]})}
    if(e.target.closest('#close')){const F=[{k:'counted',label:'Cash counted in the drawer (Rs)',type:'money',req:true,min:0,max:10000000,val:exp}];modal({title:'Close '+ddy(CD),body:formHTML(F)+`<p class="muted" style="font-size:13px;margin:12px 0 0">Expected: ${rs(exp)}</p>`,actions:[{label:'Cancel',cls:'ghost'},{label:'Close day',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;S.closes[CD]={counted:v.counted,expected:exp};save();refresh();const d=v.counted-exp;toast(d===0?'Day closed. Drawer matches.':'Day closed. '+(d<0?'Short ':'Over ')+rs(Math.abs(d)),d===0?'ok':'info')}}]})}
    if(e.target.closest('#pr'))printHTML(`<div style="font-family:monospace"><h2>${esc(S.cfg.name)} · Cash ${ddy(CD)}</h2><p>Opening ${rs(S.cfg.open)} · In ${rs(inn)} · Out ${rs(out)} · Expected ${rs(exp)}</p><table style="width:100%">${E.map(c=>`<tr><td>${c.time}</td><td>${esc(c.cat)}</td><td>${esc(c.note)}</td><td style="text-align:right">${c.kind==='in'?'+':'-'}${num(c.amt)}</td></tr>`).join('')}</table></div>`)})}

/* settings */
function pgSettings(el){head('Settings','Shop, technicians, warranty and messages');const F=[{k:'name',label:'Shop name',req:true},{k:'area',label:'Market or area',req:true},{k:'city',label:'City',req:true},{k:'phone',label:'Shop mobile',type:'tel',req:true},{k:'open',label:'Opening cash float (Rs)',type:'money',min:0,max:1000000,req:true},{k:'warranty',label:'Warranty on parts (days)',type:'number',min:0,max:365,req:true},{k:'tpl',label:'"Phone ready" WhatsApp text',type:'textarea',full:true,req:true,hint:'Use {name}, {model}, {no}, {shop} and {amount}. It only opens WhatsApp with this text.'}];
  el.innerHTML=`<div class="grid g21"><section class="card"><div class="h2"><h2>Shop</h2></div><div id="sf">${formHTML(F,S.cfg)}</div><button class="btn primary" id="sv" style="margin-top:14px">${ic('check',15)}Save</button></section><div class="grid" style="align-content:start"><section class="card"><div class="h2"><h2>Technicians</h2><button class="btn sm" id="addT">${ic('plus',14)}Add</button></div><ul class="feed">${S.techs.map(t=>`<li style="grid-template-columns:auto 1fr auto">${av(t.name,'tav')}<span><b>${esc(t.name)}</b> <small class="muted">${esc(t.role)}</small></span><span class="mono muted">${active().filter(j=>j.tech===t.id).length} jobs</span></li>`).join('')}</ul></section><section class="card"><div class="h2"><h2>Demo data</h2></div><p class="muted" style="margin:0 0 12px">Restore 130 sample jobs, 40 part lines and 30 days of cash.</p><button class="btn danger" id="rs">${ic('refresh',15)}Reset demo data</button></section></div></div>`;
  $('#sv',el).addEventListener('click',()=>{const v=readForm($('#sf',el),F);if(!v)return;Object.assign(S.cfg,v);save();refresh();paintShop();toast('Settings saved')});
  $('#addT',el).addEventListener('click',()=>{const T=[{k:'name',label:'Name',req:true},{k:'role',label:'Role',type:'select',opts:['Technician','Junior technician','Senior technician']}];modal({title:'Add technician',body:formHTML(T),actions:[{label:'Cancel',cls:'ghost'},{label:'Add',cls:'primary',fn:m=>{const v=readForm(m,T);if(!v)return false;S.techs.push({id:uid('t'),...v});save();refresh();toast(v.name+' added')}}]})});
  $('#rs',el).addEventListener('click',()=>confirmBox('Reset all demo data?',()=>{S=seed();save();Object.keys(TS).forEach(k=>delete TS[k]);BQ='';BT='all';CD=today;refresh();paintShop();toast('Demo data reset')},'Reset'))}

function paintShop(){$('#sideShop').textContent=S.cfg.area+' · '+S.cfg.city}
/* ---------- boot ---------- */
$('[data-menu]').innerHTML=ic('menu');$('[data-cmdk]').innerHTML=ic('search',17);
const NAVI={overview:'wrench',board:'grid',jobs:'file',parts:'box',customers:'users',cash:'cash',settings:'gear'};$$('.nav a').forEach(a=>{a.innerHTML=ic(NAVI[a.dataset.route],18)+a.textContent});
$('#newJobTop').addEventListener('click',()=>jobForm());paintShop();
const clk=()=>{const n=new Date();$('#clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds())};clk();loop(1000,clk,false);
boot({name:'Pechkas',key:KEY,routes:[{path:'overview',label:'Bench',render:pgOverview},{path:'board',label:'Job board',render:pgBoard},{path:'jobs',label:'Job cards',render:pgJobs},{path:'parts',label:'Parts stock',render:pgParts},{path:'customers',label:'Customers',render:pgCustomers},{path:'cash',label:'Daily cash',render:pgCash},{path:'settings',label:'Settings',render:pgSettings}],
  commands:[{label:'New job card',run:()=>jobForm()},{label:'Accessory sale',run:()=>{go('cash');setTimeout(()=>{const b=$('#sale');b&&b.click()},80)}},{label:'Low stock parts',run:()=>{TS.parts={q:'',chip:'Low stock',sort:null,dir:1,page:0};go('parts')}},{label:'Phones ready for pickup',run:()=>{TS.jobs={q:'',chip:'Ready',sort:0,dir:-1,page:0};go('jobs')}}],
  notes:()=>{const n=[],A=active();A.filter(late).slice(0,4).forEach(j=>n.push({id:'late-'+j.id+j.promised,text:'#'+j.no+' '+j.model+' is past its promised date',sub:SN[j.stage]+' · promised '+dd(j.promised),href:'#/board'}));S.parts.filter(p=>p.qty===0).slice(0,3).forEach(p=>n.push({id:'out-'+p.id,text:p.name+' for '+p.model+' is out of stock',sub:'Order from the market',href:'#/parts'}));const r=A.filter(j=>j.stage==='ready');if(r.length)n.push({id:'ready-'+r.length+today,text:r.length+' phones are ready for pickup',sub:rs(sum(r,dueOf))+' to collect',href:'#/board'});return n}});
</script>
</body>
</html>
