<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-shelfwise:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Shelfwise look: mint and charcoal, compact, numbers in mono ---------- */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --bg: #eef4f1; --surface: #fff; --surface2: #e7efeb; --ink: #1c2421; --muted: #5d6b65; --line: #d8e3de; --line-strong: #bccbc4;
  --accent: #1f9d6f; --accent-ink: #fff; --ok: #1f9d6f; --warn: #c98b10; --err: #d64545; --focus: #1f9d6f;
  --c1: #1f9d6f; --c2: #2f7fd1; --c3: #f2a93b; --c4: #8a63d2; --c5: #e0617b; --c6: #8fa39b;
  --side: #1e2427; --side-ink: #e6efea; --side-mut: #93a39c; --mint: #3ecf9a;
  --r: 10px; --r-sm: 8px; --r-btn: 8px; --r-seg: 8px; --overlay: rgba(15, 22, 19, .45); --tip-bg: #1e2427; --chip-on: #1e2427; --chip-on-ink: #fff;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #111619; --surface: #182024; --surface2: #1f292e; --ink: #e5eee9; --muted: #96a6a0; --line: #26323a; --line-strong: #34424a;
  --accent: #3ecf9a; --accent-ink: #0c1a14; --ok: #3ecf9a; --warn: #f2b84a; --err: #ff7070; --focus: #3ecf9a;
  --c1: #3ecf9a; --c2: #5ea8f2; --c3: #f2b84a; --c4: #a988f0; --c5: #ff8aa1; --c6: #5d7068;
  --side: #0b0f11; --overlay: rgba(0, 0, 0, .6); --tip-bg: #2b363c; --chip-on: #3ecf9a; --chip-on-ink: #0c1a14;
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
body { font-size: 14px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; }
.skip:focus { left: 8px; }
.grow { flex: 1; } .mut { color: var(--muted); font-size: 12.5px; }
.btn, .ibtn { min-height: 36px; } .ibtn { width: 36px; height: 36px; }
.k-table td, .k-table .num { font-variant-numeric: tabular-nums; }
.k-table .num { font-family: var(--mono); font-size: 13px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); color: var(--side-ink); padding: 16px 10px; display: flex; flex-direction: column; gap: 18px; z-index: 50; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo { width: 38px; height: 38px; flex: none; }
.brand b { display: block; font-size: 17px; }
.brand small { display: block; color: var(--side-mut); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.nav { position: relative; display: flex; flex-direction: column; gap: 2px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 8px; color: var(--side-mut); text-decoration: none; font-weight: 500; transition: color .2s; }
.nav a:hover { color: var(--side-ink); }
.nav a[aria-current="page"] { color: #0c1a14; font-weight: 650; }
.nav a .k-ic { width: 18px; height: 18px; }
.nav .k-marker { position: absolute; left: 0; right: 0; top: 0; height: 38px; border-radius: 8px; background: var(--mint); transition: transform .45s var(--spring), height .3s; z-index: 0; }
.nav-n { margin-left: auto; font-style: normal; font-family: var(--mono); min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #1c1205; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.nav-n[hidden] { display: none; }
.side-k { margin-top: auto; padding: 12px; border-radius: 10px; background: rgba(62, 207, 154, .1); border: 1px solid rgba(62, 207, 154, .25); }
.side-k small { display: block; color: var(--side-mut); font-size: 11.5px; }
.side-k b { display: block; font-family: var(--mono); font-size: 18px; color: var(--mint); margin: 2px 0; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 10px 22px; background: var(--surface); border-bottom: 1px solid var(--line); }
.ttl { margin: 0; font-size: 15px; font-weight: 650; }
.menu-btn { display: none; }
#view { padding: 20px 22px 44px; min-width: 0; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.ph h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.ph p { margin: 4px 0 0; color: var(--muted); }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.k-in { animation-name: swIn; animation-duration: .5s; }
@keyframes swIn { from { opacity: 0; transform: scale(.97); } }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; transition: box-shadow .25s, transform .25s var(--ease); }
.card:hover { box-shadow: 0 10px 26px -18px rgba(10, 40, 30, .5); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 14.5px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { border-top: 3px solid var(--accent); }
.kpi:hover { transform: translateY(-2px); }
.kpi span { color: var(--muted); font-size: 12.5px; }
.kpi b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 700; margin: 5px 0 2px; white-space: nowrap; }
.kx { font-size: 12px; color: var(--muted); min-height: 16px; display: flex; gap: 6px; align-items: center; }
.g2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }

/* ---------- The shelf wall (signature) ---------- */
.wall-c { background: linear-gradient(180deg, var(--surface), var(--surface2)); }
.wall { display: grid; gap: 4px; }
.shelf { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; padding: 0 10px 14px; align-items: end; }
.plank { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; border-radius: 3px; background: linear-gradient(180deg, #c9a36b, #9c7845); box-shadow: 0 6px 10px -6px rgba(0, 0, 0, .4); }
[data-theme="dark"] .plank { background: linear-gradient(180deg, #6b5536, #4a3a24); }
.jar { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; animation: swIn .5s var(--spring) backwards; animation-delay: calc(var(--i) * 50ms); }
.lid { width: 58%; height: 8px; border-radius: 4px 4px 2px 2px; background: var(--c6); }
.glass { position: relative; width: 74%; aspect-ratio: .78; max-height: 92px; border-radius: 10px 10px 14px 14px; border: 2px solid color-mix(in srgb, var(--ink) 22%, transparent); background: color-mix(in srgb, var(--surface) 70%, transparent); overflow: hidden; box-shadow: inset 6px 0 0 rgba(255, 255, 255, .35); transition: transform .3s var(--spring); }
.jar:hover .glass { transform: translateY(-4px) rotate(-2deg); }
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--lv) * 100%); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 65%, #fff), var(--accent)); transition: height 1.2s var(--spring); animation: rise 1.4s var(--spring) backwards; animation-delay: calc(.2s + var(--i) * 60ms); }
@keyframes rise { from { height: 0; } }
.wave { position: absolute; left: -50%; top: -5px; width: 200%; height: 10px; background: radial-gradient(10px 6px at 10px 6px, color-mix(in srgb, var(--accent) 65%, #fff) 98%, transparent) 0 0 / 20px 10px repeat-x; animation: slosh 1.8s linear 3; }
@keyframes slosh { to { transform: translateX(20px); } }
.jar.lo .fill { background: linear-gradient(180deg, color-mix(in srgb, var(--warn) 60%, #fff), var(--warn)); }
.jar.lo .wave { background-image: radial-gradient(10px 6px at 10px 6px, color-mix(in srgb, var(--warn) 60%, #fff) 98%, transparent); }
.jar.lo .glass { animation: warnPulse 1.6s ease-in-out 3; }
@keyframes warnPulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 35%, transparent); } }
.jar small { font-size: 11px; line-height: 1.2; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jar b { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.dotl { width: 12px; height: 26px; border-radius: 4px; border: 1.5px solid var(--line-strong); background: linear-gradient(to top, var(--accent) calc(var(--lv) * 100%), transparent 0); flex: none; }
.lowl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lowl li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.lowl li > div { flex: 1; min-width: 0; }
.lowl b { display: block; font-size: 13.5px; }
.lowl small { color: var(--muted); font-size: 12px; }
.lo-t { color: var(--warn); font-weight: 700; }

/* ---------- Register ---------- */
.reg { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.cats { margin-bottom: 12px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.key { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 12px 16px; min-height: 104px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; overflow: hidden; transition: transform .2s var(--spring), box-shadow .2s, border-color .2s; animation: swIn .4s var(--ease) backwards; animation-delay: calc(var(--i) * 20ms); }
.key::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kc); }
.key.c0 { --kc: #8a5a3c; } .key.c1 { --kc: var(--c3); } .key.c2 { --kc: var(--c1); } .key.c3 { --kc: var(--c2); } .key.c4 { --kc: var(--c5); }
.key:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -14px rgba(0, 0, 0, .45); border-color: var(--kc); }
.key:active, .key.tap { transform: scale(.95); }
.key.tap { animation: tap .3s var(--spring); }
@keyframes tap { 40% { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); } }
.key[disabled] { opacity: .45; pointer-events: none; }
.key span { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.key b { font-family: var(--mono); font-size: 14px; }
.key small { font-size: 11px; color: var(--muted); }
.lvl { position: absolute; left: 4px; right: 0; bottom: 0; height: 4px; background: var(--surface2); }
.lvl::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--lv) * 100%); background: var(--accent); }
.ticket { position: sticky; top: 76px; padding: 0; overflow: hidden; }
.tk-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-bottom: 1px dashed var(--line-strong); }
.tk-h b { font-size: 16px; } .tk-h small { font-family: var(--mono); color: var(--muted); }
.tk-l { list-style: none; margin: 0; padding: 6px 14px; max-height: 330px; overflow: auto; }
.tk-l li { display: grid; grid-template-columns: 1fr auto 74px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; animation: swIn .3s var(--spring); }
.tk-l li.k-emptyp { display: block; }
.tk-l small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.tk-l li > b { text-align: right; font-family: var(--mono); font-size: 13px; }
.q { display: inline-flex; align-items: center; gap: 4px; }
.q button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; }
.q .k-ic { width: 13px; height: 13px; }
.q b { min-width: 18px; text-align: center; font-family: var(--mono); }
.tk-t { padding: 10px 16px; display: grid; gap: 4px; font-family: var(--mono); font-size: 13px; border-top: 1px dashed var(--line-strong); }
.tk-t div { display: flex; justify-content: space-between; }
.tk-t .tot { font-size: 19px; font-weight: 800; }
.tk-a { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 10px; }
.ticket .big { width: calc(100% - 32px); margin: 0 16px 16px; }

/* ---------- Restock and suppliers ---------- */
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
.po { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
.po th { text-align: left; font-size: 11.5px; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--line-strong); padding: 6px 0; }
.po td { padding: 7px 0; border-bottom: 1px solid var(--line); }
.po .num { text-align: right; font-family: var(--mono); }
.qin { width: 76px; min-height: 32px; padding: 4px 8px; text-align: right; }
.potot { display: flex; justify-content: space-between; font-size: 15px; margin: 12px 0 0; }
.potot b { font-family: var(--mono); font-size: 18px; }
.sups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.sup:hover { transform: translateY(-3px); }
.sup-h { display: flex; gap: 10px; align-items: center; }
.sup-h b { display: block; } .sup-h small { color: var(--muted); font-size: 12px; }
.sup dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 8px; }
.sup dl div { background: var(--surface2); border-radius: 8px; padding: 8px; }
.sup dt { font-size: 11px; color: var(--muted); }
.sup dd { margin: 0; font-family: var(--mono); font-weight: 700; }
.sup-a { display: flex; gap: 8px; margin-top: 10px; }
.set-f { display: flex; justify-content: flex-end; margin-top: 14px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.set-row b { display: block; } .set-row small { color: var(--muted); font-size: 12.5px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shelf { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px; }
  .shelf .plank { display: none; }
  .shelf .jar { border-bottom: 10px solid #b28c58; padding-bottom: 4px; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 230px; transform: translateX(-105%); transition: transform .35s var(--ease); }
  body.nav-open .side { transform: none; }
  .menu-btn { display: inline-grid; }
  .reg, .g2 { grid-template-columns: minmax(0, 1fr); }
  .ticket { position: static; }
}
@media (max-width: 520px) {
  .top { padding: 8px 12px; }
  #view { padding: 14px 12px 40px; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 2px 10px; gap: 6px; }
  .keys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ph h1 { font-size: 21px; }
}

  k.innerHTML = S.products.filter((p) => rCat === "All" || p.cat === rCat).map((p, i) => { const n = canMake(p); return `<button type="button" class="key c${CATS.indexOf(p.cat)}" data-add="${p.id}" style="--i:${i}"${n < 1 ? " disabled" : ""}><span>${esc(p.name)}</span><b>${money(p.price)}</b><small>${made(p) ? (n < 1 ? "out of beans or milk" : "made to order") : n < 1 ? "sold out" : qtyFmt(p, p.stock)}</small><i class="lvl" style="--lv:${level(p)}"></i></button>`; }).join("");
}
function drawTicket() {
  const L = $("#tkL"); if (!L) return; const t = Cart.totals(S.cfg.tax);
  L.innerHTML = Cart.lines.length ? Cart.lines.map((l) => `<li><span>${esc(l.name)}<small>${money(l.price)}</small></span><span class="q"><button type="button" data-dq="-1" data-id="${l.id}" aria-label="One less ${esc(l.name)}">${ic("minus")}</button><b>${l.qty}</b><button type="button" data-dq="1" data-id="${l.id}" aria-label="One more ${esc(l.name)}">${ic("plus")}</button></span><b>${money(l.qty * l.price)}</b></li>`).join("") : `<li class="k-emptyp">Ticket is empty</li>`;
  $("#tkT").innerHTML = `<div><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.disc ? `<div><span>${esc(Cart.disc.label)}</span><span>-${money(t.disc)}</span></div>` : ""}${t.tax ? `<div><span>Tax ${S.cfg.tax}%</span><span>${money(t.tax)}</span></div>` : ""}<div class="tot"><span>Total</span><span>${money(t.total)}</span></div>`;
  const cb = $("#chargeBtn"); cb.textContent = "Charge " + money(t.total); cb.disabled = !Cart.lines.length;
}
on("cart", drawTicket);
function regSale(pay) {
  const t = Cart.totals(S.cfg.tax), x = { id: "SW-" + ++S.seq, t: Date.now(), lines: Cart.lines.map((l) => Object.assign({}, l)), sub: t.sub, disc: t.disc, discLabel: Cart.disc ? Cart.disc.label : "", tax: t.tax, total: t.total, method: pay.method, tendered: pay.tendered, change: pay.change, ref: pay.ref, status: "Paid" };
  x.lines.forEach((l) => { const p = prod(l.id); if (p) { sellItem(p, l.qty); S.d.cogs[D - 1] += Math.round(cost(p) * l.qty); if (low(p)) Notes.add(`${p.name} is below its reorder point`, "warn"); } });
  S.sales.unshift(x); S.d.rev[D - 1] += x.total; S.d.cnt[D - 1]++;
  save(); Cart.clear(); drawKeys(); paintSide();
  const s = $(".tk-h small"); if (s) s.textContent = "SW-" + (S.seq + 1);
  showReceipt(x, { name: S.cfg.shop, addr: S.cfg.city, foot: "Thanks, see you tomorrow" }, `<button type="button" class="btn" data-close>Next customer</button>`);
  toast(`${x.id} paid · ${money(x.total)}${pay.change ? " · change " + money(pay.change) : ""}`);
}
Object.assign(ACT, {
  disc: () => (Cart.lines.length ? discountModal({ STAFF20: { type: "pct", v: 20 }, LOYAL100: { type: "amt", v: 100 } }) : toast("Add an item first", "info")),
  clearT: () => (Cart.lines.length ? confirmBox("Clear this ticket?", () => Cart.clear(), { yes: "Clear" }) : toast("Ticket is already empty", "info")),
  charge: () => (Cart.lines.length ? payModal(Cart.totals(S.cfg.tax).total, regSale, { wallet: true, walletSeed: S.seq }) : toast("Add an item first", "err"))
});

/* ---------- Stock ---------- */
function stockModal(p) {
  if (made(p)) return toast(`${p.name} is made to order from beans and milk`, "info");
  formModal({ title: "Count " + p.name, submit: "Save count", intro: `<p class="k-hint">On the shelf: ${qtyFmt(p, p.stock)}. Par level ${p.par}, reorder at ${p.reorder}.</p>`, fields: [{ k: "q", label: `Counted (${p.unit})`, type: "number", min: 0, step: "any", req: true }, { k: "why", label: "Reason", type: "select", options: ["Stock count", "Damaged or expired", "Delivery", "Correction"] }], values: { q: p.stock },
    save: (x) => { const d = x.q - p.stock; p.stock = Math.round(x.q * 1000) / 1000; save(); toast(`${p.name}: ${d >= 0 ? "+" : ""}${num(d, 1)} (${x.why.toLowerCase()})`); refreshJars(); paintSide(); if (Router.cur !== "overview") Router.refresh(); return true; } });
}
function productForm(p) {
  formModal({ title: p ? "Edit item" : "New item", drawer: true, fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "cat", label: "Category", type: "select", options: CATS }, { k: "unit", label: "Unit", req: true }, { k: "price", label: "Price (Rs)", type: "number", min: 1, req: true }, { k: "cost", label: "Cost (Rs)", type: "number", min: 0, req: true }, { k: "par", label: "Par level", type: "number", min: 0, req: true }, { k: "reorder", label: "Reorder at", type: "number", min: 0, req: true }, { k: "sup", label: "Supplier", type: "select", options: S.suppliers.map((s) => [s.id, s.name]) }], values: p || { cat: "Pantry", unit: "pack", par: 20, reorder: 6, sup: "SP4" },
    save: (x) => { const d = { name: x.name, cat: x.cat, unit: x.unit, price: Math.round(x.price), cost: Math.round(x.cost), par: x.par, reorder: x.reorder, sup: x.sup }; if (p) Object.assign(p, d); else S.products.push(Object.assign({ id: "S" + Date.now().toString(36), stock: 0, uses: null }, d)); save(); toast(p ? "Saved" : "Item added, count it in"); Router.refresh(); return true; },
    del: p ? () => { S.products = S.products.filter((y) => y !== p); save(); toast("Deleted", "info"); Router.refresh(); } : null });
}
Router.add("stock", "Stock", (v) => {
  const st = S.products.filter((p) => !made(p));
  v.innerHTML = head("Stock", "Everything on the shelves. Count an item to correct it, or edit its par level.", `<button type="button" class="btn" data-act="exportStock">${ic("download")} CSV</button><button type="button" class="btn primary" data-act="newItem">${ic("plus")} New item</button>`)
    + `<div class="kpis">${kpi("Items tracked", st.length, "int")}${kpi("Stock value at cost", sum(st, (p) => p.cost * p.stock), "money")}${kpi("Below reorder point", st.filter(low).length, "int")}${kpi("Made to order", S.products.filter(made).length, "int", "<small>use beans, milk or tea</small>")}</div><div class="card"><div id="sT"></div></div>`;
  table($("#sT", v), { rows: () => S.products, keys: ["name", "cat"], chips: { values: ["All", "Low"].concat(CATS), test: (p, c) => (c === "Low" ? low(p) : p.cat === c) }, size: 10, onRow: (id) => productForm(prod(id)), caption: "Stock",
    cols: [{ label: "Item", k: "name", f: (p) => `<div class="k-cellp"><span class="dotl" style="--lv:${level(p)}"></span><div><b>${esc(p.name)}</b><small>${esc((sup(p.sup) || { name: made(p) ? "made here" : "" }).name)}</small></div></div>` }, { label: "Category", k: "cat" }, { label: "On shelf", k: "stock", f: (p) => (made(p) ? `<span class="mut">${canMake(p)} can be made</span>` : `<span class="${low(p) ? "lo-t" : ""}">${qtyFmt(p, p.stock)}</span>`), cls: "num" }, { label: "Par", k: "par", cls: "num", f: (p) => (made(p) ? "–" : String(p.par)) }, { label: "Cost", v: cost, f: (p) => money(cost(p)), cls: "num" }, { label: "Price", k: "price", f: (p) => money(p.price), cls: "num" }, { label: "Margin", v: (p) => 1 - cost(p) / p.price, f: (p) => pct(1 - cost(p) / p.price, 0), cls: "num" }, { label: "", sort: false, f: (p) => (made(p) ? "" : `<button type="button" class="btn sm" data-act="count" data-id="${p.id}">Count</button>`) }] });
});
Object.assign(ACT, { count: (b) => stockModal(prod(b.dataset.id)), newItem: () => productForm(null), exportStock: () => csv("shelfwise-stock.csv", S.products, [["Item", (p) => p.name], ["Category", (p) => p.cat], ["Stock", (p) => p.stock], ["Unit", (p) => p.unit], ["Par", (p) => p.par], ["Cost", (p) => cost(p)], ["Price", (p) => p.price]]) });

/* ---------- Sales ---------- */
Router.add("sales", "Sales", (v) => {
  const t0 = today0(), today = S.sales.filter((x) => x.t >= t0 && x.status === "Paid");
  v.innerHTML = head("Sales", "Every ticket from the register. Open one to reprint or refund it.", `<button type="button" class="btn" data-act="exportSales">${ic("download")} CSV</button>`) + `<div class="kpis">${kpi("Today", sum(today, (x) => x.total), "money")}${kpi("Tickets today", today.length, "int")}${kpi("Average ticket", today.length ? sum(today, (x) => x.total) / today.length : 0, "money")}${kpi("Cash share today", today.length ? today.filter((x) => x.method === "Cash").length / today.length : 0, "pct")}</div><div class="g2"><div class="card"><div id="slT"></div></div><div class="card"><div class="card-h"><h2>Best sellers</h2><span class="mut">last 5 days</span></div><div id="slTop"></div></div></div>`;
  table($("#slT", v), { rows: () => S.sales, keys: ["id", "method", (x) => x.lines.map((l) => l.name).join(" ")], chips: { values: ["All", "Cash", "Card", "Wallet", "Refunded"], test: (x, c) => (c === "Refunded" ? x.status === "Refunded" : x.method === c) }, size: 9, sort: 1, caption: "Sales",
    onRow: (id) => { const x = S.sales.find((y) => y.id === id); const L = showReceipt(x, { name: S.cfg.shop, addr: S.cfg.city, foot: "Thanks, see you tomorrow" }, x.status === "Paid" ? `<button type="button" class="btn danger" data-ref>${ic("undo")} Refund</button>` : ""); const r = $("[data-ref]", L.box); if (r) r.addEventListener("click", () => confirmBox(`Refund ${money(x.total)} on ${x.id}? Packaged items go back on the shelf.`, () => { x.status = "Refunded"; x.lines.forEach((l) => { const p = prod(l.id); if (p && !made(p)) p.stock += l.qty; }); if (x.t >= today0()) { S.d.rev[D - 1] -= x.total; S.d.cnt[D - 1]--; } save(); L.close(); toast(x.id + " refunded"); Router.refresh(); }, { yes: "Refund" })); },
    cols: [{ label: "Ticket", k: "id", f: (x) => `<b>${x.id}</b>` }, { label: "Time", k: "t", f: (x) => fmtDT(x.t), cls: "nw" }, { label: "Items", v: (x) => x.lines.length, f: (x) => esc(x.lines.map((l) => (l.qty > 1 ? l.qty + "× " : "") + l.name).join(", ")) }, { label: "Paid", k: "method", f: (x) => (x.status === "Refunded" ? badge("Refunded", "err") : badge(x.method, x.method === "Cash" ? "ok" : "info")) }, { label: "Total", k: "total", f: (x) => money(x.total), cls: "num" }] });
  const agg = {}; S.sales.forEach((x) => x.status === "Paid" && x.lines.forEach((l) => (agg[l.name] = (agg[l.name] || 0) + l.qty)));
  hbars($("#slTop", v), Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 7).map(([k, n], i) => ({ name: k, value: n, color: `var(--c${(i % 3) + 1})` })), (n) => num(n) + " sold");
});
ACT.exportSales = () => csv("shelfwise-sales.csv", S.sales, [["Ticket", (x) => x.id], ["Time", (x) => isoDate(x.t) + " " + fmtTime(x.t)], ["Method", (x) => x.method], ["Status", (x) => x.status], ["Total", (x) => x.total]]);

/* ---------- Restock: purchase orders ---------- */
const poTotal = (po) => sum(po.lines, (l) => l.qty * l.cost);
function makePO(supId, lines) { const po = { id: "PO-" + ++S.pseq, sup: supId, status: "Draft", t: Date.now(), lines }; S.pos.unshift(po); save(); return po; }
function poDrawer(id) {
  const po = S.pos.find((x) => x.id === id); if (!po) return; const s = sup(po.sup) || { name: "" };
  const L = openModal({ title: po.id, drawer: true, body: `<p class="meta">${badge(po.status, po.status === "Received" ? "ok" : po.status === "Ordered" ? "info" : "")} ${esc(s.name)} · ${fmtDT(po.t)} · lead time ${s.lead} days</p><table class="po"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Cost</th></tr></thead><tbody>${po.lines.map((l, i) => { const p = prod(l.id); return `<tr><td>${esc(p ? p.name : l.id)}</td><td class="num">${po.status === "Draft" ? `<input class="k-input qin" type="number" min="1" step="1" value="${l.qty}" data-li="${i}" aria-label="Quantity of ${esc(p ? p.name : "")}">` : l.qty}</td><td class="num">${money(l.qty * l.cost)}</td></tr>`; }).join("")}</tbody></table><p class="potot"><span>Total</span><b>${money(poTotal(po))}</b></p>`, foot: `${po.status === "Draft" ? `<button type="button" class="btn danger" data-del>${ic("trash")} Delete</button>` : ""}<span class="sp"></span>${po.status === "Draft" ? `<button type="button" class="btn primary" data-send>${ic("send")} Send to supplier</button>` : po.status === "Ordered" ? `<button type="button" class="btn primary" data-rcv>${ic("check")} Receive delivery</button>` : ""}` });
  const b = L.box, fin = (m) => { save(); L.close(); toast(m); Router.refresh(); }, g = (sl, f) => { const x = $(sl, b); if (x) x.addEventListener("click", f); };
  $$(".qin", b).forEach((inp) => inp.addEventListener("change", () => { const q = Math.max(1, Math.round(+inp.value || 1)); inp.value = q; po.lines[+inp.dataset.li].qty = q; save(); $(".potot b", b).textContent = money(poTotal(po)); }));
  g("[data-send]", () => { po.status = "Ordered"; po.t = Date.now(); fin(`${po.id} sent to ${s.name}`); });
  g("[data-rcv]", () => { po.lines.forEach((l) => { const p = prod(l.id); if (p) p.stock = Math.round((p.stock + l.qty) * 1000) / 1000; }); po.status = "Received"; Notes.add(`${po.id} received from ${s.name}`, "ok"); paintSide(); fin(`${po.id} received, shelves topped up`); });
  g("[data-del]", () => confirmBox("Delete this draft order?", () => { S.pos = S.pos.filter((x) => x !== po); fin("Draft deleted"); }));
}
Router.add("restock", "Restock", (v) => {
  const lows = S.products.filter(low);
  v.innerHTML = head("Restock", "Purchase orders to your suppliers. Receiving a delivery puts the stock on the shelves.", `<button type="button" class="btn primary" data-act="autoPO">${ic("spark")} Draft orders for low items</button>`)
    + `<div class="kpis">${kpi("Drafts", S.pos.filter((p) => p.status === "Draft").length, "int")}${kpi("On order", sum(S.pos.filter((p) => p.status === "Ordered"), poTotal), "money")}${kpi("Received, this week", sum(S.pos.filter((p) => p.status === "Received" && p.t > Date.now() - 7 * DAY), poTotal), "money")}${kpi("Low items", lows.length, "int")}</div><div class="card"><div id="poT"></div></div>`;
  table($("#poT", v), { rows: () => S.pos.map((p) => Object.assign({ amt: poTotal(p), sname: (sup(p.sup) || {}).name }, p)), keys: ["id", "sname"], chips: { values: ["All", "Draft", "Ordered", "Received"], key: "status" }, size: 9, onRow: poDrawer, caption: "Purchase orders", cols: [{ label: "Order", k: "id", f: (p) => `<b>${p.id}</b>` }, { label: "Supplier", k: "sname" }, { label: "Date", k: "t", f: (p) => fmtDT(p.t), cls: "nw" }, { label: "Lines", v: (p) => p.lines.length, f: (p) => String(p.lines.length), cls: "num" }, { label: "Status", k: "status", f: (p) => badge(p.status, p.status === "Received" ? "ok" : p.status === "Ordered" ? "info" : "") }, { label: "Total", k: "amt", f: (p) => money(p.amt), cls: "num" }] });
});
Object.assign(ACT, {
  autoPO: () => { const lows = S.products.filter(low); if (!lows.length) return toast("Nothing is below its reorder point", "info"); const by = {}; lows.forEach((p) => (by[p.sup] = by[p.sup] || []).push({ id: p.id, qty: Math.max(1, Math.ceil(p.par - p.stock)), cost: p.cost })); Object.entries(by).forEach(([s, ls]) => makePO(s, ls)); toast(`${Object.keys(by).length} draft orders made for ${lows.length} items`); location.hash = "#/restock"; if (Router.cur === "restock") Router.refresh(); },
  quickPO: (b) => { const p = prod(b.dataset.id), po = makePO(p.sup, [{ id: p.id, qty: Math.max(1, Math.ceil(p.par - p.stock)), cost: p.cost }]); toast(`Draft ${po.id} for ${p.name}`); poDrawer(po.id); }
});

/* ---------- Suppliers ---------- */
Router.add("suppliers", "Suppliers", (v) => {
  v.innerHTML = head("Suppliers", "Who delivers what, and how quickly.", `<button type="button" class="btn primary" data-act="addSup">${ic("plus")} Add supplier</button>`)
    + `<div class="sups">${S.suppliers.map((s, i) => { const items = S.products.filter((p) => p.sup === s.id), spend = sum(S.pos.filter((p) => p.sup === s.id && p.status !== "Draft"), poTotal); return `<article class="card sup" style="--i:${i}"><div class="sup-h">${avatar(s.name)}<div><b>${esc(s.name)}</b><small>${esc(s.kind)} · ${esc(s.contact)}</small></div></div><dl><div><dt>Lead time</dt><dd>${s.lead} day${s.lead > 1 ? "s" : ""}</dd></div><div><dt>Items</dt><dd>${items.length}</dd></div><div><dt>Ordered</dt><dd>${moneyS(spend)}</dd></div></dl><p class="mut">${ic("chat")} ${esc(s.phone)}</p><div class="sup-a"><button type="button" class="btn sm" data-act="callSup" data-n="${esc(s.name)}">${ic("chat")} Message</button><button type="button" class="btn sm" data-act="editSup" data-id="${s.id}">${ic("edit")} Edit</button></div></article>`; }).join("")}</div>`;
});
function supForm(s) { formModal({ title: s ? "Edit supplier" : "Add supplier", fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "kind", label: "Supplies", req: true }, { k: "contact", label: "Contact", req: true }, { k: "phone", label: "Phone", req: true }, { k: "lead", label: "Lead time (days)", type: "number", min: 0, step: 1, req: true }], values: s || { lead: 2 }, save: (x) => { const d = { name: x.name, kind: x.kind, contact: x.contact, phone: x.phone, lead: Math.round(x.lead) }; if (s) Object.assign(s, d); else S.suppliers.push(Object.assign({ id: "SP" + Date.now().toString(36) }, d)); save(); toast("Saved"); Router.refresh(); return true; }, del: s ? () => { if (S.products.some((p) => p.sup === s.id)) { toast("Move this supplier's items first", "err"); return; } S.suppliers = S.suppliers.filter((y) => y !== s); save(); toast("Removed", "info"); Router.refresh(); } : null }); }
Object.assign(ACT, { addSup: () => supForm(null), editSup: (b) => supForm(sup(b.dataset.id)), callSup: (b) => toast("Message sent to " + b.dataset.n) });

/* ---------- Settings ---------- */
Router.add("settings", "Settings", (v) => {
  v.innerHTML = head("Settings", "Shop details, tax and data.", "") + `<div class="g2"><form class="card" id="sF" novalidate><div class="card-h"><h2>Shop</h2></div>${fieldsHTML([{ k: "shop", label: "Shop name", req: true, full: true }, { k: "city", label: "City", type: "select", options: CITIES }, { k: "tax", label: "Sales tax %", type: "number", min: 0, max: 30, req: true }], S.cfg)}<div class="set-f"><button class="btn primary" type="submit">Save</button></div></form><div class="card"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Light or dark</small></div><button type="button" class="btn" data-act="theme">${ic("moon")} Switch</button></div><div class="set-row"><div><b>Reset demo data</b><small>Restocks the sample shop</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const f = $("#sF", v);
  f.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(f, [{ k: "shop", label: "Shop", req: true }, { k: "city", label: "City" }, { k: "tax", label: "Tax", type: "number", min: 0, max: 30, req: true }]); if (!x) return; Object.assign(S.cfg, x); save(); paintSide(); toast("Saved"); });
});
ACT.reset = () => confirmBox("Reset all demo data on this device?", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); Cart.clear(); save(); paintSide(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset" });

/* ---------- Boot ---------- */
function paintSide() {
  $("#shopName").textContent = S.cfg.shop;
  const n = S.products.filter(low).length, e = $("#nLow"); e.textContent = n; e.hidden = !n;
  $("#sideK").innerHTML = `<small>Today</small><b>${money(S.d.rev[D - 1])}</b><small>${S.d.cnt[D - 1]} tickets</small>`;
}
on("route", (id) => { $("#ttl").textContent = Router.pages[id].title; });
S = loadState(seedData, VER);
paintIcons(); Theme.label(); paintSide();
CMDS = [{ label: "Open the register", run: () => (location.hash = "#/register") }, { label: "Draft orders for low items", run: ACT.autoPO }, { label: "New stock item", run: () => productForm(null) }, { label: "Switch theme", run: () => Theme.toggle() }];
S.products.filter(low).slice(0, 3).forEach((p) => Notes.add(`${p.name} is below its reorder point`, "warn"));
Notes.add("Milk delivery is due at 7 tomorrow morning", "info");
Router.start();

</script>
