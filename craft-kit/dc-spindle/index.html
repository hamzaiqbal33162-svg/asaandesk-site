<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
/* ===== Core UI parts: buttons, forms, tables, layers, toasts, charts (each app themes them with variables) ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 10px; --r-inp: 9px; --r-modal: 18px;
  --scrim: rgba(12, 14, 22, .45); --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .45);
  --toast-bg: #17191f; --toast-ink: #fff; --tip-bg: #121419; --tip-ink: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.i { width: 18px; height: 18px; flex: none; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1; text-decoration: none; white-space: nowrap; transition: transform .14s, background-color .2s, border-color .2s, box-shadow .2s, filter .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn .i { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.bell { position: relative; }
.bell .badge-n { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge-n[hidden] { display: none; }
.bell.ring .i { animation: ring .8s ease; transform-origin: 50% 10%; }
@keyframes ring { 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

/* Segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg-k { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--accent); transition: left .35s cubic-bezier(.3, 1.3, .5, 1), width .35s; }

/* Chips, badges, avatars, progress */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .cnt { opacity: .7; font-weight: 500; }
.badge { --b: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { --b: var(--ok); } .badge.warn { --b: var(--warn); } .badge.bad { --b: var(--bad); } .badge.info { --b: var(--info); } .badge.acc { --b: var(--accent); }
.ava { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; letter-spacing: .02em; }
.meter { height: 7px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--mc, var(--accent)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; }
.delta .i { width: 14px; height: 14px; }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full, .form .full { grid-column: 1 / -1; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-inp); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.err .inp { border-color: var(--bad); }
.ferr { font-size: 12px; color: var(--bad); }
.ferr:empty { display: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; appearance: none; -webkit-appearance: none; border-radius: 99px; background: var(--line-2); transition: background-color .25s; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* Data table */
.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 180px; max-width: 300px; display: block; }
.search .inp { padding-left: 34px; min-height: 36px; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th > button, .tbl th > .th { display: flex; align-items: center; gap: 4px; width: 100%; padding: 9px 12px; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
.tbl th.r > button, .tbl th.r > .th { justify-content: flex-end; }
.tbl th .ar { width: 0; height: 0; border: 4px solid transparent; opacity: 0; transition: opacity .2s; }
.tbl th[aria-sort="ascending"] .ar { border-bottom-color: currentColor; margin-top: -4px; opacity: 1; }
.tbl th[aria-sort="descending"] .ar { border-top-color: currentColor; margin-top: 4px; opacity: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tbody tr { transition: background-color .15s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tbody tr.rowin { animation: rowin .4s both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } }
.tbl .r { text-align: right; }
.tbl .acts { display: flex; gap: 4px; justify-content: flex-end; }
.cellname { display: flex; align-items: center; gap: 10px; }
.cellname small { display: block; color: var(--muted); font-size: 11.5px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pager .pbtns { display: flex; gap: 6px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty .i { width: 34px; height: 34px; opacity: .55; }
.empty b { color: var(--ink); }

/* Layers: modal, drawer, menu, command search */
.layer { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.layer .scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-modal); box-shadow: var(--shadow-lg); animation: pop .34s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 10px 20px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.layer.drawer-l { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { position: relative; height: 100%; width: min(460px, 100%); background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slidein .4s cubic-bezier(.2, .8, .2, 1) both; }
.drawer .modal-b { flex: 1; }
.drawer .modal-f { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.layer.closing .scrim { animation: fade .22s reverse both; }
.layer.closing .modal { animation: pop .22s reverse both; }
.layer.closing .drawer { animation: slidein .26s reverse both; }
.modal.shake { animation: shake .4s; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes slidein { from { transform: translateX(100%); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 6px 0 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 110; min-width: 190px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s both; }
.menu.wide { width: 330px; }
.menu > button, .menu .mi { display: flex; width: 100%; text-align: left; gap: 9px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; color: inherit; }
.menu > button:hover, .menu > button:focus-visible { background: var(--hover); outline: none; }
.menu > button.dz { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.menu .mh { padding: 6px 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.notes li { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
.notes li.unread { background: var(--hover); }
.notes li i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--info); }
.notes li.ok i { background: var(--ok); } .notes li.warn i { background: var(--warn); } .notes li.bad i { background: var(--bad); }
.notes small { display: block; color: var(--muted); font-size: 11px; }
.layer.cmdk-l { align-items: flex-start; padding-top: 12vh; }
.modal.cmdk .modal-b { padding: 0 12px 12px; }
.cmdk ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.cmdk li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; text-align: left; font-size: 13.5px; }
.cmdk li button small { margin-left: auto; color: var(--muted); }
.cmdk li[aria-selected="true"] button, .cmdk li button:hover { background: var(--hover); }

/* Toasts and tooltip */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 11px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; animation: toastin .4s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast > i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.toast.warn > i { background: var(--warn); } .toast.bad > i { background: var(--bad); } .toast.info > i { background: var(--info); }
.toast button { margin-left: 6px; border: 0; background: rgba(255, 255, 255, .16); color: inherit; border-radius: 7px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
.toast.out { animation: toastout .26s both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }
.tip { position: fixed; z-index: 160; left: 0; top: 0; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 250px; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .tr span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* Charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.6, .1, .2, 1) forwards; }
.chart .ar.in { animation: fade 1s .35s both; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.chart .dot { stroke: var(--surface); stroke-width: 2; opacity: 0; transition: opacity .15s; }
.chart.hov .guide, .chart.hov .dot { opacity: 1; }
.chart .bar { transition: opacity .2s; }
.chart.hov .bar:not(.hl) { opacity: .45; }
.chart .seg-arc { fill: none; transition: stroke-width .2s, opacity .2s; cursor: pointer; }
.chart .seg-arc.dim { opacity: .35; }
.chart .empty-c { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-box { position: relative; flex: none; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-size: 20px; line-height: 1.1; }
.donut-c span { font-size: 11px; color: var(--muted); }
.dleg { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: grid; gap: 6px; font-size: 12.5px; }
.dleg li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: default; transition: background-color .15s; }
.dleg li:hover { background: var(--hover); }
.dleg li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dleg li em { font-style: normal; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.blist { display: grid; gap: 10px; }
.blist .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; cursor: default; }
.blist .bl > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blist .bl b { font-variant-numeric: tabular-nums; }
.blist .bt { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.blist .bt i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--bc, var(--c1)); }
.funnel { display: grid; gap: 8px; }
.funnel .fs { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; align-items: center; gap: 10px; font-size: 12.5px; cursor: default; }
.funnel .fb { height: 30px; display: flex; justify-content: center; }
.funnel .fb i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--fc, var(--c1)); }
.funnel .fs em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Drag and drop */
.dragging { opacity: .35; }
.ghost { position: fixed !important; z-index: 140; margin: 0 !important; pointer-events: none; transform: rotate(2.5deg) scale(1.03); box-shadow: var(--shadow-lg); }
.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
[data-handle] { touch-action: none; cursor: grab; }

/* Page entrance */
.rise { animation: rise .62s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ===== Spindle look: cream paper, black ink, hard offset shadows, tomato + mustard + cobalt ===== */
:root {
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --display: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bg: #f3ead8; --surface: #fffaf0; --surface-2: #f1e5cd; --ink: #161412; --muted: #6a5f51; --line: rgba(22, 20, 18, .16); --line-2: rgba(22, 20, 18, .4); --edge: #161412; --hover: rgba(228, 71, 43, .08);
  --accent: #e4472b; --on-accent: #fff; --ok: #23845a; --warn: #a86b0c; --bad: #d63a1f; --info: #3557c5; --grid: rgba(22, 20, 18, .1);
  --c1: #e4472b; --c2: #3557c5; --c3: #f0b429; --c4: #2a9d8f; --c5: #7a5cfa; --c6: #f28fb0;
  --side: #f0b429; --side-ink: #161412;
  --sh: 4px 4px 0 var(--edge); --sh-lg: 7px 7px 0 var(--edge);
  --r: 16px; --r-btn: 12px; --r-inp: 10px; --r-modal: 18px;
  --toast-bg: #161412; --tip-bg: #161412; --scrim: rgba(22, 20, 18, .45); --shadow-lg: 8px 8px 0 var(--edge);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #121110; --surface: #1c1a17; --surface-2: #262220; --ink: #f3ead8; --muted: #b3a690; --line: rgba(243, 234, 216, .13); --line-2: rgba(243, 234, 216, .35); --edge: #e8dcc4; --hover: rgba(240, 180, 41, .1);
  --accent: #ff6a4a; --on-accent: #161412; --ok: #5fd39a; --warn: #f3c04f; --bad: #ff6a4a; --info: #8aa4ff; --grid: rgba(243, 234, 216, .09);
  --c1: #ff6a4a; --c2: #8aa4ff; --c3: #f3c04f; --c4: #4fd1bf; --c5: #a993ff; --c6: #ff9fc0;
  --side: #1c1a17; --side-ink: #f3ead8;
  --sh: 4px 4px 0 #000; --sh-lg: 7px 7px 0 #000; --shadow-lg: 8px 8px 0 #000;
  --toast-bg: #f3ead8; --toast-ink: #161412; --tip-bg: #f3ead8; --tip-ink: #161412; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
body { background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5; background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 18px 18px; z-index: -1; }
.btn { border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--edge); font-weight: 800; }
.btn:hover { border-color: var(--edge); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--edge); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.btn.ghost { box-shadow: none; border-color: transparent; }
.btn.ghost:hover { border-color: var(--edge); box-shadow: 2px 2px 0 var(--edge); }
.inp { border: 2px solid var(--edge); }
.chip { border: 2px solid var(--edge); color: var(--ink); }
.chip[aria-pressed="true"] { box-shadow: 2px 2px 0 var(--edge); }
.seg { border: 2px solid var(--edge); background: var(--surface); }
.modal, .drawer, .menu { border: 2px solid var(--edge); }
.badge { border: 1.5px solid currentColor; background: transparent; }
.app { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }

/* Mustard sidebar with a sliding sticker marker */
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); color: var(--side-ink); border-right: 2px solid var(--edge); display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; z-index: 60; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 4px; }
.brand svg { width: 42px; height: 42px; flex: none; transition: transform 1.2s cubic-bezier(.2, .8, .2, 1); }
.brand:hover svg { transform: rotate(360deg); }
.brand b { display: block; font: 900 22px/1 var(--display); letter-spacing: -.02em; text-transform: uppercase; }
.brand small { font-size: 11px; font-weight: 700; opacity: .75; }
.nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 14px; transition: color .25s, transform .2s; }
.nav a:hover { transform: translateX(3px); }
.nav a[aria-current="page"] { color: var(--bg); }
[data-theme="dark"] .nav a[aria-current="page"] { color: #161412; }
.nav .marker { position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 12px; background: var(--edge); box-shadow: 3px 3px 0 var(--accent); transform-origin: 50% 50%; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1), height .3s; }
[data-theme="dark"] .nav .marker { background: var(--c3); box-shadow: 3px 3px 0 var(--accent); }
.side-live { margin-top: auto; border: 2px solid var(--edge); border-radius: 14px; padding: 12px; background: var(--surface); color: var(--ink); box-shadow: var(--sh); font-size: 12px; }
.side-live b { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.dot-live { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: live 1.6s infinite; }
.dot-live.off { background: var(--muted); animation: none; }
@keyframes live { 70% { box-shadow: 0 0 0 7px transparent; } }
.scrim-nav { display: none; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--bg); border-bottom: 2px solid var(--edge); }
.top h1 { font: 900 26px/1 var(--display); text-transform: uppercase; letter-spacing: -.02em; position: relative; display: inline-block; }
.top h1::after { content: ""; position: absolute; left: -4px; right: -6px; bottom: -2px; height: 9px; background: var(--c3); z-index: -1; transform: rotate(-1deg); }
.top .sub { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.menu-btn { display: none; }
main { padding: 22px 28px 46px; overflow-x: clip; }

/* Cards */
.grid { display: grid; gap: 18px; margin-bottom: 18px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.g11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 2px solid var(--edge); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--sh); min-width: 0; transition: transform .2s, box-shadow .2s; }
.card.lift:hover { transform: translate(-2px, -2px); box-shadow: var(--sh-lg); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h3 { font: 900 16px var(--display); text-transform: uppercase; letter-spacing: -.01em; }
.card-h p { font-size: 12px; color: var(--muted); font-weight: 600; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.bar-row p { color: var(--muted); font-weight: 600; max-width: 62ch; }
.kpi { padding: 14px 16px; }
.kpi .lbl { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 6px; }
.kpi .val { font: 900 30px/1.05 var(--display); margin: 8px 0 4px; letter-spacing: -.02em; }
.kpi .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 700; }
.kpi .sp { width: 80px; }
.kpi.t1 { background: var(--c1); color: #fff; } .kpi.t2 { background: var(--c3); color: #161412; } .kpi.t3 { background: var(--c2); color: #fff; } .kpi.t4 { background: var(--c4); color: #161412; }
.kpi.t1 .foot, .kpi.t2 .foot, .kpi.t3 .foot, .kpi.t4 .foot { color: inherit; opacity: .85; }
.kpi .delta { color: inherit; }

/* Signature: the groove chart (today's sales by hour as grooves on a vinyl record) */
.deck { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 14px; align-items: center; }
.vinyl { position: relative; width: 100%; max-width: 330px; margin: auto; aspect-ratio: 1; }
.vinyl svg { width: 100%; height: 100%; display: block; overflow: visible; }
.vinyl .disc { transform-origin: 160px 160px; transform-box: view-box; }
.vinyl .disc.spin { animation: spinIn 2.6s cubic-bezier(.15, .7, .2, 1); }
.vinyl .disc.nudge { animation: nudge 1.2s cubic-bezier(.2, .8, .2, 1); }
@keyframes spinIn { from { transform: rotate(-540deg); } }
@keyframes nudge { from { transform: rotate(-120deg); } }
.vinyl .groove { fill: var(--c3); stroke: #161412; stroke-width: .6; cursor: pointer; transition: opacity .2s; }
.vinyl .groove.future { fill: none; stroke: rgba(255, 255, 255, .25); stroke-dasharray: 3 3; }
.vinyl .groove.now { fill: var(--c1); }
.vinyl .groove:hover, .vinyl .groove:focus-visible { fill: #fff; outline: none; }
.vinyl .arm { transform-origin: 292px 34px; transform-box: view-box; transition: transform 1.4s cubic-bezier(.3, 1.2, .4, 1); }
.vinyl .hl { font: 900 12px var(--display); fill: #161412; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 300px; overflow: hidden; }
.feed li { display: flex; align-items: center; gap: 10px; border: 2px solid var(--edge); border-radius: 12px; padding: 7px 9px; background: var(--surface-2); font-size: 12px; }
.feed li.in { animation: feedin .6s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes feedin { from { opacity: 0; transform: translateX(-24px) rotate(-3deg); } }
.feed li b { display: block; font-size: 12.5px; }
.feed li span { color: var(--muted); }
.feed .cov { flex: none; }
.cov { display: block; border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; }

/* Catalogue grid */
.crate { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.rec { display: flex; flex-direction: column; gap: 8px; padding: 10px; cursor: pointer; text-align: left; }
.rec .cov { width: 100%; height: auto; aspect-ratio: 1; }
.rec b { font-size: 13px; line-height: 1.25; }
.rec small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
.rec .row { justify-content: space-between; }
.rec:hover .cov svg { transform: rotate(-3deg) scale(1.03); }
.rec .cov svg { transition: transform .3s; display: block; width: 100%; height: 100%; }
.viewsw { display: inline-flex; gap: 6px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 2px dashed var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row p { font-size: 12px; color: var(--muted); }
.items { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.items li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--edge); border-radius: 12px; font-size: 13px; }
.items li .grow b { display: block; }
.items li small { color: var(--muted); }

@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12, .g3, .g11 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 256px; transform: translateX(-104%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  body.nav-open .side { transform: none; }
  .scrim-nav { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
  body.nav-open .scrim-nav { display: block; }
  .menu-btn { display: inline-flex; }
  .top { padding: 10px 14px; }
  .top h1 { font-size: 20px; }
  main { padding: 16px 14px 36px; }
  .deck { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) { .g4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; } .kpi .val { font-size: 22px; } .kpi .sp { display: none; } .top .sub { display: none; } .crate { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
</style>

<script>
/* ================= Core helpers (small, shared, no libraries) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fin = (v) => (Number.isFinite(+v) ? +v : 0); /* any non-finite number (NaN, Infinity) becomes 0 */
const sum = (a, f = (x) => x) => a.reduce((s, x, i) => s + fin(f(x, i)), 0);
const mq = (q) => (window.matchMedia ? window.matchMedia(q) : { matches: false });

const DAY = 864e5;

const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
const pad = (n) => String(n).padStart(2, "0");

const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/* Number, money and date formatting */
const fmt = {
  n: (v, d = 0) => (+v || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }),
  short(v) {

  pkrS: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.short(Math.abs(v)),

const parseISO = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : NaN; };
const badge = (t, k = "") => `<span class="badge ${k}">${esc(t)}</span>`;

/* Data series for a range switch: 7D and 30D are days, 12M sums whole months */
function rangeData(range, valAt) {
  const labels = [], data = [];
  if (range === "12M") {
    const d = new Date(TODAY);
    for (let m = 11; m >= 0; m--) {
      const s = new Date(d.getFullYear(), d.getMonth() - m, 1).getTime();
      const e = Math.min(new Date(d.getFullYear(), d.getMonth() - m + 1, 1).getTime(), TODAY + DAY);

      for (let t = s; t < e; t += DAY) v += valAt(Math.round((t - TODAY) / DAY));

    const n = range === "7D" ? 7 : range === "90D" ? 90 : 30;

}

    get d() { return data; },
    save() { try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), d: data })); } catch (e) { /* storage blocked: keep in memory */ } },

    const shop = f.elements.shop.value.trim(), low = parseFloat(f.elements.low.value);
    const errs = { shop: shop ? "" : "This field is required", low: !(low >= 0 && low <= 20) ? "Enter 0 to 20" : "", close: f.elements.close.value <= f.elements.open.value ? "Closing must be after opening" : "" };
    Object.entries(errs).forEach(([k, v]) => { const w = f.querySelector(`[data-fld="${k}"]`); w.classList.toggle("err", !!v); w.querySelector(".ferr").textContent = v; });
    if (Object.values(errs).some(Boolean)) return toast("Please fix the highlighted fields", "bad");
    Object.assign(s, { shop, city: f.elements.city.value, low, open: f.elements.open.value, close: f.elements.close.value }); save();
    $(".brand small").textContent = `${s.shop}, ${s.city}`; toast("Shop details saved");
  });
  $("#s-live").addEventListener("change", (e) => { s.live = e.target.checked; save(); setLive(s.live); toast(`Live feed ${s.live ? "on" : "off"}`, "info"); });
  $("#s-reset").addEventListener("click", async () => { if (await confirmDlg("Records, sales, members and history go back to the sample data.", { title: "Reset demo data?", ok: "Reset" })) { S.reset(); Bell.items = []; lowAlerts(); Bell.paint(); $(".brand small").textContent = `${D().settings.shop}, ${D().settings.city}`; setLive(true); R.refresh(); toast("Demo data reset"); } });
};

/* ================= Drawers and modals ================= */
function recDrawer(x) {
  if (!x || !D().recs.includes(x)) return;
  const sold = D().sales.filter((s) => s.status !== "Refunded" && s.lines.some((l) => l.rid === x.id));
  const dr = drawer({
    title: esc(x.title),
    body: `<div class="row" style="gap:16px;margin-bottom:14px">${cover(x, 120)}<div><b style="font-size:16px">${esc(x.artist)}</b><div class="muted">${esc(x.format)} · ${x.year} · ${esc(x.genre)}</div><div style="font:900 26px var(--display);margin-top:6px">${money(x.price)}</div>${x.stock <= D().settings.low ? badge(x.stock ? `Only ${x.stock} left` : "Sold out", "bad") : badge(`${x.stock} in stock`, "ok")}</div></div>
      <dl class="dl"><dt>Condition</dt><dd>${esc(x.cond)}</dd><dt>Shelf</dt><dd>${esc(x.shelf)}</dd><dt>Sold in the last 2 weeks</dt><dd>${sold.length}</dd></dl>
      <h3 style="font-size:13px;margin-bottom:8px">Stock</h3><div class="row" style="margin-bottom:12px"><button class="btn sm" data-st="-1" aria-label="One less">${ic("minus")}</button><b class="num" id="rd-st" style="min-width:30px;text-align:center">${x.stock}</b><button class="btn sm" data-st="1" aria-label="One more">${ic("plus")}</button><button class="btn sm" data-st="10">+10 delivery</button></div>`,
    foot: `<button class="btn danger" data-del>${ic("trash")}Delete</button><button class="btn" data-edit>${ic("edit")}Edit</button><button class="btn pri" data-sell ${x.stock ? "" : "disabled"}>${ic("cash")}Sell one</button>`,
  });
  dr.el.addEventListener("click", (e) => { const b = e.target.closest("[data-st]"); if (!b) return; x.stock = Math.max(0, x.stock + +b.dataset.st); save(); $("#rd-st", dr.el).textContent = x.stock; dr.el.querySelector("[data-sell]").disabled = !x.stock; toast(`${x.title}: ${x.stock} in stock`, "info"); R.refresh(); });
  dr.el.querySelector("[data-edit]").addEventListener("click", () => { dr.close(); recModal(x); });
  dr.el.querySelector("[data-sell]").addEventListener("click", () => { dr.close(); saleModal(x.id); });
  dr.el.querySelector("[data-del]").addEventListener("click", async () => { if (!(await confirmDlg(`Delete ${esc(x.title)} by ${esc(x.artist)} from the catalogue?`, { title: "Delete record?" }))) return; D().recs = D().recs.filter((y) => y !== x); save(); dr.close(); R.refresh(); toast(`${x.title} deleted`, "warn"); });
}
function recModal(x) {
  formModal({
    title: x ? "Edit record" : "Add record", submit: x ? "Save" : "Add to catalogue",
    values: x || { format: "Vinyl LP", genre: "Rock", cond: "New", price: 7500, stock: 3, year: 2024 },
    fields: [
      { name: "artist", label: "Artist", required: 1 }, { name: "title", label: "Title", required: 1 },
      { name: "format", label: "Format", type: "select", options: FORMATS.map((f) => f[0]) }, { name: "genre", label: "Genre", type: "select", options: GENRES },
      { name: "cond", label: "Condition", type: "select", options: ["New", "Used NM", "Used VG+"] }, { name: "year", label: "Year", type: "number", min: 1900, max: new Date().getFullYear() + 1, required: 1 },
      { name: "price", label: "Price (Rs)", type: "number", min: 100, required: 1 }, { name: "stock", label: "Copies", type: "number", min: 0, required: 1 },
    ],
    onSubmit: (v) => {
      if (x) Object.assign(x, v); else D().recs.unshift(Object.assign({ id: "r" + Date.now(), shelf: "N1", w: 1, seed: Math.floor(Math.random() * 9999) + 1 }, v));
      save(); R.refresh(); toast(x ? `${v.title} updated` : `${v.title} added to the crates`);
    },
  });
}
function saleModal(rid) {
  const stocked = D().recs.filter((x) => x.stock > 0);
  formModal({
    title: "Ring up a sale", submit: "Take payment",
    values: { rid: rid || (stocked[0] || {}).id, qty: 1, ch: "In store", pay: "Cash" },
    fields: [
      { name: "rid", label: "Record", type: "select", full: 1, options: stocked.map((x) => ({ value: x.id, label: `${x.artist} – ${x.title} (${x.format}, ${x.stock} left)` })), validate: (v) => (recBy(v) ? "" : "Nothing in stock to sell") },
      { name: "qty", label: "Copies", type: "number", min: 1, max: 10, required: 1, validate: (v, all) => { const x = recBy(all.rid); return x && v > x.stock ? `Only ${x.stock} on the shelf` : ""; } },
      { name: "ch", label: "Where", type: "select", options: ["In store", "Online"] },
      { name: "pay", label: "Payment", type: "select", options: ["Cash", "Card", "Bank transfer", "Cash on delivery"] },
      { name: "mid", label: "Crate Club member", type: "select", options: [{ value: "", label: "Not a member" }, ...D().members.map((x) => ({ value: x.id, label: x.name }))] },
    ],
    onSubmit: (v) => {
      const x = recBy(v.rid), mm = D().members.find((y) => y.id === v.mid);
      x.stock -= v.qty;
      const s = { id: ++D().seq.sale, ch: v.ch, mid: mm ? mm.id : null, who: mm ? mm.name : v.ch === "Online" ? "Web customer" : "Walk-in", lines: [{ rid: x.id, qty: v.qty, price: x.price }], total: x.price * v.qty, pay: v.pay, at: Date.now(), status: v.ch === "Online" ? "To ship" : "Paid" };
      D().sales.push(s); if (v.ch === "Online") D().online[364] += s.total; else D().store[364] += s.total;
      if (mm) { mm.visits += 1; mm.spent += s.total; }
      save(); toast(`Sale #${s.id}: ${money(s.total)} · ${v.pay}`);
      if (x.stock <= D().settings.low) Bell.add(`${x.title}: ${x.stock ? "only " + x.stock + " left" : "sold out"}`, x.stock ? "warn" : "bad");
      R.refresh();
    },
  });
}
function saleDrawer(s) {
  if (!s) return;
  const dr = drawer({
    title: `Sale #${s.id}`,
    body: `<div class="row" style="margin-bottom:12px">${badge(s.ch, s.ch === "Online" ? "info" : "acc")}${badge(s.status, { Paid: "ok", "To ship": "warn", Refunded: "bad" }[s.status])}<span class="muted" style="margin-left:auto">${fmt.dt(s.at)}</span></div>
      <ul class="items">${s.lines.map((l) => { const x = recBy(l.rid); return `<li>${cover(x, 40)}<span class="grow"><b>${esc(x ? x.title : "Removed record")}</b><small>${esc(x ? x.artist + " · " + x.format : "")}</small></span><b class="num">${l.qty} × ${moneyS(l.price)}</b></li>`; }).join("")}</ul>
      <dl class="dl"><dt>Customer</dt><dd>${esc(s.who)}</dd><dt>Payment</dt><dd>${esc(s.pay)}</dd><dt>Total</dt><dd>${money(s.total)}</dd></dl>`,
    foot: `${s.status === "To ship" ? `<button class="btn" data-ship>${ic("truck")}Mark shipped</button>` : ""}<button class="btn" data-rcpt>${ic("receipt")}Receipt</button><button class="btn danger" data-ref ${s.status === "Refunded" ? "disabled" : ""}>${ic("return")}Refund</button>`,
  });
  const sh = dr.el.querySelector("[data-ship]"); if (sh) sh.addEventListener("click", () => { s.status = "Paid"; save(); dr.close(); R.refresh(); toast(`Sale #${s.id} shipped`); });
  dr.el.querySelector("[data-rcpt]").addEventListener("click", () => toast(`Receipt for #${s.id} sent to the printer`, "info"));
  dr.el.querySelector("[data-ref]").addEventListener("click", async () => {
    if (!(await confirmDlg(`Refund ${money(s.total)} for sale #${s.id}? The records go back on the shelf.`, { title: "Refund sale?", ok: "Refund" }))) return;
    s.lines.forEach((l) => { const x = recBy(l.rid); if (x) x.stock += l.qty; });
    s.status = "Refunded"; save(); Layer.closeAll(); R.refresh(); toast(`Sale #${s.id} refunded and restocked`, "warn");
  });
}
function memDrawer(x) {
  if (!x) return;
  const ss = D().sales.filter((s) => s.mid === x.id).slice().reverse();
  const dr = drawer({
    title: esc(x.name),
    body: `<div class="row" style="margin-bottom:12px">${avatar(x.name)}<div><b>${esc(x.city)}</b><div class="muted" style="font-size:12px">Member since ${fmt.dateY(x.joined)}</div></div><span style="margin-left:auto">${badge(x.seg, "acc")}</span></div>
      <dl class="dl"><dt>Email</dt><dd>${esc(x.email)}</dd><dt>Visits</dt><dd>${x.visits}</dd><dt>Spent</dt><dd>${money(x.spent)}</dd><dt>Loves</dt><dd>${esc(x.fav)}</dd><dt>Shops</dt><dd>${esc(x.pref)}</dd></dl>
      <h3 style="font-size:13px;margin-bottom:8px">Recent buys</h3><ul class="items">${ss.length ? ss.slice(0, 6).map((s) => `<li>${cover(recBy(s.lines[0].rid), 32)}<span class="grow">${esc(recName(s.lines[0].rid))}<small>${fmt.date(s.at)} · ${esc(s.ch)}</small></span><b class="num">${moneyS(s.total)}</b></li>`).join("") : `<li class="muted">Nothing in the last two weeks</li>`}</ul>`,
    foot: `<button class="btn" data-note>${ic("mail")}New arrivals email</button><button class="btn pri" data-upg ${x.seg === "Collector" ? "disabled" : ""}>${ic("star")}Upgrade</button>`,
  });
  dr.el.querySelector("[data-note]").addEventListener("click", () => toast(`New ${x.fav} arrivals email queued for ${x.name}`, "info"));
  dr.el.querySelector("[data-upg]").addEventListener("click", () => { x.seg = x.seg === "Casual" ? "Regular" : "Collector"; save(); dr.close(); R.refresh(); toast(`${x.name} is now a ${x.seg}`); });
}
function memModal() {
  formModal({
    title: "Add Crate Club member", submit: "Add member",
    fields: [{ name: "name", label: "Full name", required: 1 }, { name: "email", label: "Email", type: "email", required: 1 }, { name: "city", label: "City", type: "select", options: PK.cities }, { name: "fav", label: "Favourite genre", type: "select", options: GENRES }],
    values: { city: "Karachi" },
    onSubmit: (v) => { D().members.unshift({ id: "m" + Date.now(), name: v.name, email: v.email, city: v.city, fav: v.fav, seg: "Casual", visits: 0, spent: 0, joined: Date.now(), pref: "Both" }); save(); R.refresh(); toast(`${v.name} joined the Crate Club`); },
  });
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-newsale],[data-addrec],[data-addmem],[data-exportsales]");
  if (!b) return;
  if (b.hasAttribute("data-newsale")) saleModal();
  else if (b.hasAttribute("data-addrec")) recModal();
  else if (b.hasAttribute("data-addmem")) memModal();
  else downloadCSV("spindle-sales.csv", [["Sale", "Time", "Where", "Customer", "Payment", "Total", "Status"], ...D().sales.map((s) => [s.id, fmt.dt(s.at), s.ch, s.who, s.pay, s.total, s.status])]);
});
$("#live-btn").addEventListener("click", () => setLive(!live));

/* ================= Start ================= */
const ROUTES = [
  { id: "overview", label: "Overview", icon: "disc", sub: "Online and in the shop", render: Pages.overview },
  { id: "web", label: "Web", icon: "globe", sub: "Online shop traffic", render: Pages.web },
  { id: "store", label: "Shop floor", icon: "store", sub: "Visitors and takings", render: Pages.store },
  { id: "catalogue", label: "Catalogue", icon: "music", sub: "Records, CDs and tapes", render: Pages.catalogue },
  { id: "customers", label: "Members", icon: "users", sub: "Crate Club", render: Pages.customers },
  { id: "sales", label: "Sales", icon: "receipt", sub: "Every sale and refund", render: Pages.sales },
  { id: "reports", label: "Reports", icon: "chart", sub: "Trends and best sellers", render: Pages.reports },
  { id: "settings", label: "Settings", icon: "settings", sub: "Shop, display and data", render: Pages.settings },
];
$("[data-nav]").insertAdjacentHTML("beforeend", ROUTES.map((r) => `<a href="#/${r.id}">${ic(r.icon)}<span>${r.label}</span></a>`).join(""));
$("[data-menu-btn]").innerHTML = ic("menu");
$("[data-cmdk]").innerHTML = ic("search");
$(".brand small").textContent = `${D().settings.shop}, ${D().settings.city}`;
const R = Router({
  routes: ROUTES, def: "overview", main: $("#main"), title: "Spindle",
  onRoute: (id) => {
    const r = ROUTES.find((x) => x.id === id); $("#pt").textContent = r.label; $("#psub").textContent = r.sub;
    const mk = $(".nav .marker"); if (mk && !RM) mk.style.rotate = (["-1.5deg", "1.2deg", "-0.8deg", "1.6deg"][ROUTES.indexOf(r) % 4]);
  },
});
lowAlerts();
setLive(D().settings.live);
R.start();
Cmdk.add([
  { label: "Ring up a sale", icon: "cash", hint: "Action", run: () => saleModal() },
  { label: "Add record", icon: "disc", hint: "Action", run: () => recModal() },
  { label: "Add member", icon: "user", hint: "Action", run: () => memModal() },
  { label: "Pause or resume the live feed", icon: "pause", hint: "Action", run: () => setLive(!live) },
  { label: "Switch theme", icon: "moon", hint: "Action", run: () => Theme.toggle() },
]);
</script>
</body>
</html>
