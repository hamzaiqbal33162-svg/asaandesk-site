<head>
<meta charset="utf-8">

<title>Medlane · Pharmacy point of sale · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
/* ===== Core UI parts: buttons, forms, tables, layers, toasts, charts (each app themes them with variables) ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 10px; --r-inp: 9px; --r-modal: 18px;
  --scrim: rgba(12, 14, 22, .45); --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .45);
  --toast-bg: #17191f; --toast-ink: #fff; --tip-bg: #121419; --tip-ink: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.i { width: 18px; height: 18px; flex: none; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1; text-decoration: none; white-space: nowrap; transition: transform .14s, background-color .2s, border-color .2s, box-shadow .2s, filter .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn .i { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.bell { position: relative; }
.bell .badge-n { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge-n[hidden] { display: none; }
.bell.ring .i { animation: ring .8s ease; transform-origin: 50% 10%; }
@keyframes ring { 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

/* Segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg-k { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--accent); transition: left .35s cubic-bezier(.3, 1.3, .5, 1), width .35s; }

/* Chips, badges, avatars, progress */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .cnt { opacity: .7; font-weight: 500; }
.badge { --b: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { --b: var(--ok); } .badge.warn { --b: var(--warn); } .badge.bad { --b: var(--bad); } .badge.info { --b: var(--info); } .badge.acc { --b: var(--accent); }
.ava { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; letter-spacing: .02em; }
.meter { height: 7px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--mc, var(--accent)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; }
.delta .i { width: 14px; height: 14px; }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full, .form .full { grid-column: 1 / -1; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-inp); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.err .inp { border-color: var(--bad); }
.ferr { font-size: 12px; color: var(--bad); }
.ferr:empty { display: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; appearance: none; -webkit-appearance: none; border-radius: 99px; background: var(--line-2); transition: background-color .25s; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* Data table */
.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 180px; max-width: 300px; display: block; }
.search .inp { padding-left: 34px; min-height: 36px; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th > button, .tbl th > .th { display: flex; align-items: center; gap: 4px; width: 100%; padding: 9px 12px; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
.tbl th.r > button, .tbl th.r > .th { justify-content: flex-end; }
.tbl th .ar { width: 0; height: 0; border: 4px solid transparent; opacity: 0; transition: opacity .2s; }
.tbl th[aria-sort="ascending"] .ar { border-bottom-color: currentColor; margin-top: -4px; opacity: 1; }
.tbl th[aria-sort="descending"] .ar { border-top-color: currentColor; margin-top: 4px; opacity: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tbody tr { transition: background-color .15s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tbody tr.rowin { animation: rowin .4s both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } }
.tbl .r { text-align: right; }
.tbl .acts { display: flex; gap: 4px; justify-content: flex-end; }
.cellname { display: flex; align-items: center; gap: 10px; }
.cellname small { display: block; color: var(--muted); font-size: 11.5px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pager .pbtns { display: flex; gap: 6px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty .i { width: 34px; height: 34px; opacity: .55; }
.empty b { color: var(--ink); }

/* Layers: modal, drawer, menu, command search */
.layer { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.layer .scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-modal); box-shadow: var(--shadow-lg); animation: pop .34s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 10px 20px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.layer.drawer-l { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { position: relative; height: 100%; width: min(460px, 100%); background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slidein .4s cubic-bezier(.2, .8, .2, 1) both; }
.drawer .modal-b { flex: 1; }
.drawer .modal-f { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.layer.closing .scrim { animation: fade .22s reverse both; }
.layer.closing .modal { animation: pop .22s reverse both; }
.layer.closing .drawer { animation: slidein .26s reverse both; }
.modal.shake { animation: shake .4s; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes slidein { from { transform: translateX(100%); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 6px 0 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 110; min-width: 190px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s both; }
.menu.wide { width: 330px; }
.menu > button, .menu .mi { display: flex; width: 100%; text-align: left; gap: 9px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; color: inherit; }
.menu > button:hover, .menu > button:focus-visible { background: var(--hover); outline: none; }
.menu > button.dz { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.menu .mh { padding: 6px 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.notes li { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
.notes li.unread { background: var(--hover); }
.notes li i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--info); }
.notes li.ok i { background: var(--ok); } .notes li.warn i { background: var(--warn); } .notes li.bad i { background: var(--bad); }
.notes small { display: block; color: var(--muted); font-size: 11px; }
.layer.cmdk-l { align-items: flex-start; padding-top: 12vh; }
.modal.cmdk .modal-b { padding: 0 12px 12px; }
.cmdk ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.cmdk li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; text-align: left; font-size: 13.5px; }
.cmdk li button small { margin-left: auto; color: var(--muted); }
.cmdk li[aria-selected="true"] button, .cmdk li button:hover { background: var(--hover); }

/* Toasts and tooltip */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 11px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; animation: toastin .4s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast > i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.toast.warn > i { background: var(--warn); } .toast.bad > i { background: var(--bad); } .toast.info > i { background: var(--info); }
.toast button { margin-left: 6px; border: 0; background: rgba(255, 255, 255, .16); color: inherit; border-radius: 7px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
.toast.out { animation: toastout .26s both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }
.tip { position: fixed; z-index: 160; left: 0; top: 0; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 250px; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .tr span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* Charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.6, .1, .2, 1) forwards; }
.chart .ar.in { animation: fade 1s .35s both; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.chart .dot { stroke: var(--surface); stroke-width: 2; opacity: 0; transition: opacity .15s; }
.chart.hov .guide, .chart.hov .dot { opacity: 1; }
.chart .bar { transition: opacity .2s; }
.chart.hov .bar:not(.hl) { opacity: .45; }
.chart .seg-arc { fill: none; transition: stroke-width .2s, opacity .2s; cursor: pointer; }
.chart .seg-arc.dim { opacity: .35; }
.chart .empty-c { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-box { position: relative; flex: none; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-size: 20px; line-height: 1.1; }
.donut-c span { font-size: 11px; color: var(--muted); }
.dleg { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: grid; gap: 6px; font-size: 12.5px; }
.dleg li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: default; transition: background-color .15s; }
.dleg li:hover { background: var(--hover); }
.dleg li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dleg li em { font-style: normal; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.blist { display: grid; gap: 10px; }
.blist .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; cursor: default; }
.blist .bl > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blist .bl b { font-variant-numeric: tabular-nums; }
.blist .bt { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.blist .bt i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--bc, var(--c1)); }
.funnel { display: grid; gap: 8px; }
.funnel .fs { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; align-items: center; gap: 10px; font-size: 12.5px; cursor: default; }
.funnel .fb { height: 30px; display: flex; justify-content: center; }
.funnel .fb i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--fc, var(--c1)); }
.funnel .fs em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Drag and drop */
.dragging { opacity: .35; }
.ghost { position: fixed !important; z-index: 140; margin: 0 !important; pointer-events: none; transform: rotate(2.5deg) scale(1.03); box-shadow: var(--shadow-lg); }
.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
[data-handle] { touch-action: none; cursor: grab; }

/* Page entrance */
.rise { animation: rise .62s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ===== Medlane look: crisp white, navy sidebar with a cut-out tab, clinical teal-green ===== */
:root {
  --bg: #f3f6fa; --surface: #ffffff; --surface-2: #edf2f8; --ink: #10213f; --muted: #5b6a82; --line: #dce4ee; --line-2: #b9c7d9; --hover: rgba(11, 158, 134, .07);
  --accent: #0b9e86; --on-accent: #fff; --ok: #12895d; --warn: #b36a00; --bad: #d23b3b; --info: #2b66d1; --grid: #e6ecf3;
  --c1: #0b9e86; --c2: #2b5fd1; --c3: #e2a12b; --c4: #d94f7a; --c5: #7b61d1; --c6: #3aa7d9;
  --side: #0f2343; --side-2: #18305a; --side-ink: #c4d2e8;
  --r: 12px; --r-btn: 9px; --r-inp: 9px; --r-modal: 16px;
  --shadow: 0 1px 2px rgba(16, 33, 63, .05), 0 8px 24px -20px rgba(16, 33, 63, .35);
  --toast-bg: #0f2343; --tip-bg: #0f2343; --scrim: rgba(10, 22, 44, .45);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #08101e; --surface: #0e1a2d; --surface-2: #142339; --ink: #e2eaf6; --muted: #8b9bb4; --line: #1e2e48; --line-2: #2f4467; --hover: rgba(34, 199, 168, .09);
  --accent: #22c7a8; --on-accent: #04211b; --ok: #34c98d; --warn: #f2b14a; --bad: #ff6e6e; --info: #6b9cf2; --grid: #182841;

.app { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }

/* Navy sidebar: the active page is a tab cut into the sidebar */

.sclock { position: relative; padding: 26px 0 30px; }

/* Responsive */

/* Drag and drop with pointer events (mouse drags the card, touch uses the [data-handle] grip) */
function dragBoard({ root, item, zone, onDrop }) {
  let justDragged = false;
  root.addEventListener("click", (e) => { if (justDragged) { e.stopPropagation(); e.preventDefault(); justDragged = false; } }, true);
  root.addEventListener("pointerdown", (e) => {
    const it = e.target.closest(item);
    if (!it || !root.contains(it) || e.button !== 0) return;
    const onHandle = !!e.target.closest("[data-handle]");
    if (!onHandle && (e.pointerType === "touch" || e.target.closest("button,a,input,select,textarea,label"))) return;
    const sx = e.clientX, sy = e.clientY;
    let ghost = null, over = null, ox = 0, oy = 0;
    const move = (ev) => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        const r = it.getBoundingClientRect(); ox = sx - r.left; oy = sy - r.top;
        ghost = it.cloneNode(true); ghost.classList.add("ghost"); ghost.removeAttribute("id"); ghost.style.width = r.width + "px";
        document.body.appendChild(ghost); it.classList.add("dragging"); document.body.classList.add("is-dragging");
      }
      ghost.style.left = ev.clientX - ox + "px"; ghost.style.top = ev.clientY - oy + "px";
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      const z = hit && hit.closest(zone);
      const nz = z && root.contains(z) ? z : null;
      if (nz !== over) { if (over) over.classList.remove("over"); over = nz; if (over) over.classList.add("over"); }
      ev.preventDefault();
    };
    const up = (ev) => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      if (!ghost) return;
      ghost.remove(); it.classList.remove("dragging"); document.body.classList.remove("is-dragging");
      if (over) over.classList.remove("over");
      justDragged = true; setTimeout(() => (justDragged = false), 50);
      if (over && ev.type === "pointerup") onDrop(it, over, ev);

}

const kpi = (id, icon, label, foot, color) => card("kpi lift", `<span class="kic" style="--k:${color}">${ic(icon)}</span><div class="grow"><div class="lbl">${label}</div><div class="val num" id="${id}">0</div><div class="ft" id="${id}-f">${foot}</div></div>`);
let range = "30D", cart = [], payBy = "Cash", cartPid = "", cartRx = null, posCat = "All", posQ = "";
const todaySales = (br) => D().sales.filter((s) => s.branch === br && s.t >= TODAY);

/* ================= Pages ================= */
const Pages = {};

Pages.counter = (m) => {
  const br = BRANCH(), ts = todaySales(br);
  m.innerHTML = `<div class="grid g4">${kpi("c-s", "cash", "Sales today", `${ts.length} receipts`, "var(--c1)")}${kpi("c-rx", "rx", "Prescriptions waiting", "Received or checking", "var(--c4)")}${kpi("c-low", "alert", "Low stock", "At this branch", "var(--c3)")}${kpi("c-exp", "hourglass", "Expired on shelf", "Quarantine them", "var(--bad)")}</div>
  <div class="pos">
    <section data-rise>
      <div class="pos-tools"><label class="search"><span class="sr">Search medicines</span>${ic("search")}<input class="inp" id="pq" type="search" placeholder="Search by name, form or category…" value="${esc(posQ)}"></label></div>
      <div class="chips" id="pcat" role="group" aria-label="Category" style="margin-bottom:12px">${["All", ...CATS].map((c) => `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === posCat}">${esc(c)}</button>`).join("")}</div>
      <div class="tiles" id="tiles"></div>
    </section>
    <aside class="card cart" aria-label="Current sale">
      <div class="cart-h"><div class="between"><h3 style="font-size:15px">Current sale</h3><button class="btn sm ghost" id="c-clear">${ic("trash")}Clear</button></div>
        <div class="row"><label class="sr" for="c-pat">Patient</label><select class="inp" id="c-pat"><option value="">Walk-in customer</option>${D().patients.map((p) => `<option value="${p.id}" ${p.id === cartPid ? "selected" : ""}>${esc(p.name)}${p.allergies.length ? " · allergy: " + esc(p.allergies.join(", ")) : ""}</option>`).join("")}</select></div></div>
      <ul class="lines" id="lines" aria-live="polite"></ul>
      <div class="cart-f" id="cartf"></div>
    </aside>
  </div>`;
  countUp($("#c-s"), sum(ts, (s) => s.total) + histAt(br, 0) * 0.2, moneyS);
  countUp($("#c-rx"), D().rxs.filter((x) => x.branch === br && (x.status === "Received" || x.status === "Checking")).length);
  countUp($("#c-low"), D().meds.filter((x) => isLow(x, br)).length);
  countUp($("#c-exp"), D().batches.filter((b) => b.branch === br && b.status === "OK" && b.qty > 0 && b.expiry < TODAY).length);
  paintTiles(); paintCart();
  $("#pq").addEventListener("input", (e) => { posQ = e.target.value; paintTiles(); });
  $("#pcat").addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (!b) return; posCat = b.dataset.c; $$("#pcat .chip").forEach((x) => x.setAttribute("aria-pressed", x === b)); paintTiles(); });
  $("#tiles").addEventListener("click", (e) => { const t = e.target.closest("[data-add]"); if (t) addToCart(t.dataset.add, t); });
  $("#c-pat").addEventListener("change", (e) => { cartPid = e.target.value; paintCart(); });
  $("#c-clear").addEventListener("click", () => { if (!cart.length) return toast("The cart is already empty", "info"); cart = []; cartRx = null; paintCart(); toast("Sale cleared", "info"); });
  $("#lines").addEventListener("click", (e) => { const b = e.target.closest("[data-q]"); if (!b) return; const l = cart[+b.dataset.i]; if (!l) return; const nq = l.qty + +b.dataset.q; if (nq <= 0) cart.splice(+b.dataset.i, 1); else if (nq > stockAt(l.mid, BRANCH())) return toast(`Only ${stockAt(l.mid, BRANCH())} packs of ${mName(l.mid)} here`, "warn"); else l.qty = nq; paintCart(); });
  $("#cartf").addEventListener("click", cartFootClick);
  $("#cartf").addEventListener("input", (e) => { if (e.target.id === "c-cash") paintChange(); });
};
function paintTiles() {
  const br = BRANCH(), q = posQ.trim().toLowerCase();
  const list = D().meds.filter((m) => (posCat === "All" || m.cat === posCat) && (!q || (m.name + " " + m.form + " " + m.cat).toLowerCase().includes(q)));
  $("#tiles").innerHTML = list.length ? list.map((m) => { const s = stockAt(m.id, br); return `<button type="button" class="tile" data-add="${m.id}" aria-disabled="${s === 0}" aria-label="Add ${esc(m.name)}, ${s} packs in stock">${rxBadge(m)}<b>${esc(m.name)}</b><span class="f">${esc(m.form)} · ${esc(m.cat)}</span><span class="bt"><b>${money(m.price)}</b><span class="st" style="color:${s === 0 ? "var(--bad)" : isLow(m, br) ? "var(--warn)" : "var(--ok)"}">${s} left</span></span></button>`; }).join("") : `<div class="card" style="grid-column:1/-1"><div class="empty">${ic("pill")}<b>No medicine matches</b><span>Try another name or category.</span></div></div>`;
}
function addToCart(mid, tile) {
  const m = med(mid), br = BRANCH(); if (!m) return;
  const have = stockAt(mid, br), l = cart.find((x) => x.mid === mid);
  if ((l ? l.qty : 0) + 1 > have) return toast(have ? `Only ${have} packs of ${m.name} here` : `${m.name} is out of stock at ${brName(br)}`, "warn");
  const p = pat(cartPid);
  if (allergyHit(p, m)) toast(`Careful: ${p.name} is allergic to ${m.allergen}`, "bad");
  if (l) l.qty++; else cart.push({ mid, qty: 1 });
  if (tile) anim(tile, [{ transform: "scale(.94)" }, { transform: "scale(1)" }], { duration: 260 });
  paintCart();
}
const rxNeeded = () => cart.filter((l) => { const m = med(l.mid); return m && m.rx; });
const cartTotal = () => sum(cart, (l) => l.qty * (med(l.mid) || { price: 0 }).price);
function paintCart() {
  const br = BRANCH(), p = pat(cartPid);
  cart = cart.filter((l) => med(l.mid));
  $("#lines").innerHTML = cart.length ? cart.map((l, i) => { const m = med(l.mid), f = pickFEFO(l.mid, br, l.qty, false); return `<li><span class="nm">${rxBadge(m)} ${esc(m.name)}${allergyHit(p, m) ? ` ${badge("Allergy", "bad")}` : ""}</span><span class="qty"><button type="button" data-q="-1" data-i="${i}" aria-label="One less ${esc(m.name)}">${ic("minus")}</button><span>${l.qty}</span><button type="button" data-q="1" data-i="${i}" aria-label="One more ${esc(m.name)}">${ic("plus")}</button></span><span class="lot">FEFO: ${f.picks.map((x) => `lot ${esc(x.lot)} · exp ${fmt.date(x.exp)}`).join(" + ") || "no stock"}</span><b class="num" style="font-size:13px">${money(l.qty * m.price)}</b></li>`; }).join("") : `<li style="border:0"><div class="empty" style="padding:18px 4px">${ic("cart")}<b>No items yet</b><span>Tap a medicine to add it.</span></div></li>`;
  const need = rxNeeded(), total = cartTotal();
  $("#cartf").innerHTML = `${need.length ? `<div class="rxlink ${cartRx ? "ok" : ""}">${ic("rx")}<span class="grow">${cartRx ? `Prescription ${esc(cartRx.no)} · ${esc(cartRx.doctor)}` : `Rx needed for ${need.length} item${need.length > 1 ? "s" : ""}`}</span><button type="button" class="btn sm" data-rxlink>${cartRx ? "Change" : "Link"}</button></div>` : ""}
    <div class="tot"><span>Items</span><b>${sum(cart, (l) => l.qty)}</b></div><div class="tot big"><span>Total</span><span class="num">${money(total)}</span></div>
    <div class="pay" role="group" aria-label="Payment">${[["Cash", "cash"], ["Card", "card"], ["Wallet", "phone"]].map(([k, i]) => `<button type="button" data-pay="${k}" aria-pressed="${payBy === k}">${ic(i)}${k}</button>`).join("")}</div>
    ${payBy === "Cash" ? `<div class="row"><label class="sr" for="c-cash">Cash received</label><input class="inp" id="c-cash" type="number" min="0" inputmode="numeric" placeholder="Cash received"><span class="muted" style="white-space:nowrap">Change <b id="c-chg" style="color:var(--ink)">—</b></span></div><div class="cash-q">${[["exact", "Exact"], ["500", "500"], ["1000", "1,000"], ["5000", "5,000"]].map(([v, l]) => `<button type="button" class="btn sm" data-cash="${v}">${l}</button>`).join("")}</div>` : ""}
    <span class="cart-err" id="c-err" role="alert"></span>
    <button type="button" class="btn pri" data-sell style="min-height:44px">${ic("check")}Complete sale</button>`;
  paintChange();
}
function paintChange() { const c = $("#c-cash"), o = $("#c-chg"); if (!c || !o) return; const v = parseFloat(c.value); o.textContent = Number.isNaN(v) ? "—" : v < cartTotal() ? "short " + money(cartTotal() - v) : money(v - cartTotal()); }
function cartFootClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pay) { payBy = b.dataset.pay; paintCart(); }
  else if (b.dataset.cash) { const c = $("#c-cash"); c.value = b.dataset.cash === "exact" ? cartTotal() : b.dataset.cash; paintChange(); }
  else if (b.hasAttribute("data-rxlink")) rxLinkModal();
  else if (b.hasAttribute("data-sell")) completeSale();
}
function rxLinkModal() {
  formModal({
    title: "Link a prescription", submit: "Link prescription",
    note: "Rx-only medicines need the doctor's slip. It is saved with the sale.",
    fields: [{ name: "no", label: "Slip or Rx number", required: 1, placeholder: "e.g. 44817" }, { name: "doctor", label: "Doctor", type: "select", options: DOCS.concat(["Other doctor"]) }, { name: "date", label: "Date on the slip", type: "date", required: 1, validate: (v) => { const t = parseISO(v); return t > TODAY ? "Cannot be in the future" : t < TODAY - 30 * DAY ? "Slips older than 30 days are not accepted" : ""; } }],
    values: { doctor: DOCS[0], date: fmt.iso(TODAY) },
    onSubmit: (v) => { cartRx = { no: v.no, doctor: v.doctor }; paintCart(); toast(`Prescription ${v.no} linked`); },
  });
}
function completeSale() {
  const br = BRANCH(), err = $("#c-err"), p = pat(cartPid);
  const fail = (msg) => { err.textContent = msg; anim($(".cart"), [{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 300 }); };
  if (!cart.length) return fail("Add at least one medicine.");
  if (D().settings.rxRule && rxNeeded().length && !cartRx) return fail("Link a prescription for: " + rxNeeded().map((l) => mName(l.mid)).join(", "));
  const alg = cart.find((l) => allergyHit(p, med(l.mid)));
  if (alg) return fail(`${p.name} is allergic to ${med(alg.mid).allergen}. Remove ${mName(alg.mid)}.`);
  const short = cart.find((l) => pickFEFO(l.mid, br, l.qty, false).short);
  if (short) return fail(`Not enough ${mName(short.mid)} at ${brName(br)}.`);
  const total = cartTotal(), cash = parseFloat(($("#c-cash") || {}).value);
  if (payBy === "Cash" && !Number.isNaN(cash) && cash < total) return fail("Cash received is less than the total.");
  const lines = cart.map((l) => { const m = med(l.mid); return { mid: l.mid, qty: l.qty, price: m.price, lots: pickFEFO(l.mid, br, l.qty, true).picks }; });
  const sale = { id: "S-" + D().seq.sale++, t: Date.now(), branch: br, lines, total, pay: payBy, rx: cartRx ? cartRx.no : "", pid: cartPid, cash: Number.isNaN(cash) ? total : cash };
  D().sales.push(sale); D().hist[br][364] += total;
  if (cartRx) D().rxs.push({ id: "RX-" + D().seq.rx++, pid: cartPid, doctor: cartRx.doctor, branch: br, items: rxNeeded().map((l) => ({ mid: l.mid, qty: l.qty, dose: "As written on slip " + cartRx.no })), status: "Collected", at: Date.now(), picks: [] });
  save();
  const mids = cart.map((l) => l.mid);
  cart = []; cartRx = null; cartPid = "";
  receipt(sale); R.refresh(); lowAlert(mids, br);
}
function receipt(s) {
  const n = Math.min(14, sum(s.lines, (l) => l.qty) * 2 + 2);
  const m = Layer.open({
    title: "Sale complete",
    body: `<div class="tray" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i style="--d:${i * 70}ms"></i>`).join("")}</div><div class="rcpt" aria-label="Receipt"><div style="text-align:center"><b>${esc(D().settings.pharmacy.toUpperCase())}</b><br>${esc(brName(s.branch))} branch · ${esc(D().settings.license)}<br>${fmt.dt(s.t)} · ${esc(s.id)}</div><hr>${s.lines.map((l) => `<div class="r"><span>${l.qty} × ${esc(mName(l.mid))}</span><span>${fmt.n(l.qty * l.price)}</span></div><div class="muted" style="font-size:10.5px">${l.lots.map((x) => `lot ${esc(x.lot)} exp ${fmt.iso(x.exp)}`).join(", ")}</div>`).join("")}<hr><div class="r"><b>TOTAL</b><b>${money(s.total)}</b></div><div class="r"><span>Paid by ${esc(s.pay)}</span><span>${money(s.cash || s.total)}</span></div>${s.pay === "Cash" && s.cash > s.total ? `<div class="r"><span>Change</span><span>${money(s.cash - s.total)}</span></div>` : ""}${s.rx ? `<div class="r"><span>Prescription</span><span>${esc(s.rx)}</span></div>` : ""}<hr><div style="text-align:center">Patient: ${esc(patName(s.pid))}<br>Keep medicines away from children.</div></div>`,
    foot: `<button type="button" class="btn" data-print>${ic("printer")}Print</button><button type="button" class="btn pri" data-close>New sale</button>`,
  });
  m.el.querySelector("[data-print]").addEventListener("click", () => toast(`Receipt ${s.id} sent to the counter printer`, "info"));
  toast(`${s.id} saved · ${money(s.total)}`);
}

Pages.prescriptions = (m) => {
  const br = BRANCH();
  m.innerHTML = toolbar(`The queue for ${esc(brName(br))}. Drag a card to the next column or use Move. Moving to Ready fills it from the earliest-expiring stock; Collected records the sale.`, `<button class="btn pri" data-newrx>${ic("plus")}New prescription</button>`) + `<div class="board" id="board" data-rise></div>`;
  const paint = (flash) => {
    $("#board").innerHTML = RX_ST.map((s) => {
      let list = D().rxs.filter((x) => x.branch === br && x.status === s).sort((a, b) => a.at - b.at);
      const total = list.length; if (s === "Collected") list = list.slice(-6).reverse();
      return `<section class="col" data-col="${s}" style="--cc:${RX_C[s]}" aria-label="${s}"><div class="col-h"><span>${s}</span><span class="n">${total}</span></div>${list.map((x) => { const p = pat(x.pid), alg = x.items.some((it) => allergyHit(p, med(it.mid))); return `<article class="rxc ${alg ? "alg" : ""}" data-rx="${x.id}" tabindex="0" aria-label="${esc(x.id)} for ${esc(patName(x.pid))}" style="${flash === x.id && !RM ? "animation:rowin .5s both" : ""}"><div class="t"><b style="color:var(--ink)">${esc(x.id)}</b><span class="grip" data-handle aria-hidden="true">${ic("grip")}</span></div><div style="font-weight:700;margin-top:3px">${esc(patName(x.pid))}</div><div class="muted" style="font-size:12px">${esc(x.doctor)} · ${x.items.length} item${x.items.length > 1 ? "s" : ""}${alg ? " · allergy!" : ""}</div><div class="ft"><span class="muted" style="font-size:11.5px">${ic("clock")} ${fmt.ago(x.at)}</span>${s !== "Collected" ? `<button type="button" class="btn sm" data-mv="${x.id}">Move ${ic("chevR")}</button>` : ""}</div></article>`; }).join("") || `<div class="empty" style="padding:14px 4px">${ic("inbox")}<span>Empty</span></div>`}</section>`;
    }).join("");
  };
  paint();
  const moveTo = (x, s) => { if (!x || x.status === s) return; if (rxMove(x, s)) paint(x.id); };
  dragBoard({ root: $("#board"), item: ".rxc", zone: ".col", onDrop: (it, col) => moveTo(D().rxs.find((x) => x.id === it.dataset.rx), col.dataset.col) });
  $("#board").addEventListener("click", (e) => {
    const mv = e.target.closest("[data-mv]");
    if (mv) { const x = D().rxs.find((r) => r.id === mv.dataset.mv); if (x) Menu.open(mv, RX_ST.filter((s) => s !== x.status).map((s) => ({ label: "Move to " + s, icon: "arrowR", run: () => moveTo(x, s) }))); return; }
    const c = e.target.closest("[data-rx]"); if (c) rxDrawer(D().rxs.find((x) => x.id === c.dataset.rx));
  });
  $("#board").addEventListener("keydown", (e) => { const c = e.target.closest("[data-rx]"); if (c && e.target === c && e.key === "Enter") rxDrawer(D().rxs.find((x) => x.id === c.dataset.rx)); });
};
/* Status rules: Ready fills from FEFO stock, earlier steps return it, Collected is final and books the sale */
function rxMove(x, s) {
  if (x.status === "Collected") { toast(`${x.id} was already collected`, "warn"); return false; }
  const br = x.branch, ready = RX_ST.indexOf(s) >= 2, wasFilled = x.picks && x.picks.length;
  if (ready && !wasFilled) {
    const short = x.items.find((it) => pickFEFO(it.mid, br, it.qty, false).short);
    if (short) { toast(`Not enough ${mName(short.mid)} at ${brName(br)} to fill ${x.id}`, "bad"); return false; }
    x.picks = x.items.map((it) => ({ mid: it.mid, lots: pickFEFO(it.mid, br, it.qty, true).picks }));
    lowAlert(x.items.map((it) => it.mid), br);
  }
  if (!ready && wasFilled) { x.picks.forEach((pk) => pk.lots.forEach((l) => { const b = D().batches.find((y) => y.id === l.bid); if (b) b.qty += l.qty; })); x.picks = []; }
  x.status = s; x.at = Date.now();
  if (s === "Collected") { const lines = x.items.filter((it) => med(it.mid)).map((it) => ({ mid: it.mid, qty: it.qty, price: med(it.mid).price, lots: ((x.picks.find((p) => p.mid === it.mid) || {}).lots) || [] })); const sale = { id: "S-" + D().seq.sale++, t: Date.now(), branch: br, lines, total: sum(lines, (l) => l.qty * l.price), pay: "Cash", rx: x.id, pid: x.pid }; D().sales.push(sale); D().hist[br][364] += sale.total; }
  save();
  toast(`${x.id} moved to ${s}${s === "Ready" ? ": filled from the earliest-expiring stock" : ""}`);
  if (s === "Ready") Bell.add(`${x.id} for ${patName(x.pid)} is ready to collect`, "ok", true);
  return true;
}
function rxDrawer(x) {

  const dr = drawer({
    title: esc(x.id),
    body: `<ul class="timeline">${RX_ST.map((s, j) => `<li class="${j < i ? "done" : j === i ? "now" : ""}">${s}</li>`).join("")}</ul>
      <dl class="dl"><dt>Patient</dt><dd>${esc(patName(x.pid))}${p ? ` · ${p.age} y` : ""}</dd><dt>Allergies</dt><dd>${p && p.allergies.length ? p.allergies.map((a) => badge(a, "bad")).join(" ") : "None recorded"}</dd><dt>Doctor</dt><dd>${esc(x.doctor)}</dd><dt>Branch</dt><dd>${esc(brName(x.branch))}</dd><dt>Updated</dt><dd>${fmt.ago(x.at)}</dd></dl>
      <h3 style="font-size:14px;margin-bottom:8px">Items and dosage</h3><ul class="dose">${x.items.map((it) => { const m = med(it.mid), pk = (x.picks || []).find((q) => q.mid === it.mid); return `<li><b>${it.qty} × ${esc(mName(it.mid))}</b> ${allergyHit(p, m) ? badge("Allergy: " + m.allergen, "bad") : ""}<small>${esc(it.dose)}</small>${pk ? `<small>Filled from ${pk.lots.map((l) => `lot ${esc(l.lot)} (exp ${fmt.date(l.exp)})`).join(", ")}</small>` : ""}</li>`; }).join("")}</ul>`,
    foot: `<button type="button" class="btn" data-label>${ic("printer")}Print labels</button>${nxt ? `<button type="button" class="btn pri" data-next>Move to ${nxt}</button>` : ""}`,
  });
  dr.el.querySelector("[data-label]").addEventListener("click", () => toast(`Dosage labels for ${x.id} sent to the label printer`, "info"));
  const n = dr.el.querySelector("[data-next]"); if (n) n.addEventListener("click", () => { if (rxMove(x, nxt)) { dr.close(); R.refresh(); } });
}
function rxModal(pid) {
  const meds = D().meds.slice().sort((a, b) => a.name.localeCompare(b.name)), opts = meds.map((m) => ({ value: m.id, label: m.name + (m.rx ? " (Rx)" : "") }));
  const none = [{ value: "", label: "None" }];
  const algCheck = (k) => (v, a) => { const p = pat(a.pid), m = med(a[k]); return allergyHit(p, m) ? `${p.name} is allergic to ${m.allergen}` : ""; };
  formModal({
    title: "New prescription", submit: "Add to queue", wide: 1,
    values: { pid: pid || D().patients[0].id, doctor: DOCS[0], q1: 1, q2: 1, q3: 1, d1: DOSES[0], m2: "", m3: "" },
    fields: [
      { name: "pid", label: "Patient", type: "select", options: D().patients.map((p) => ({ value: p.id, label: p.name + (p.allergies.length ? " (allergy: " + p.allergies.join(", ") + ")" : "") })) },
      { name: "doctor", label: "Doctor", type: "select", options: DOCS },
      { name: "m1", label: "Medicine", type: "select", options: opts, validate: algCheck("m1") }, { name: "q1", label: "Packs", type: "number", min: 1, max: 20, required: 1 },
      { name: "d1", label: "Dosage", full: 1, required: 1 },
      { name: "m2", label: "Second medicine", type: "select", options: none.concat(opts), validate: (v, a) => (v && v === a.m1 ? "Already on this prescription" : algCheck("m2")(v, a)) }, { name: "q2", label: "Packs", type: "number", min: 1, max: 20 },
      { name: "m3", label: "Third medicine", type: "select", options: none.concat(opts), validate: (v, a) => (v && (v === a.m1 || v === a.m2) ? "Already on this prescription" : algCheck("m3")(v, a)) }, { name: "q3", label: "Packs", type: "number", min: 1, max: 20 },
    ],
    onSubmit: (v) => {
      const items = [[v.m1, v.q1, v.d1], [v.m2, v.q2, "As directed"], [v.m3, v.q3, "As directed"]].filter(([id, q]) => id && q > 0).map(([mid, qty, dose]) => ({ mid, qty, dose }));
      const x = { id: "RX-" + D().seq.rx++, pid: v.pid, doctor: v.doctor, branch: BRANCH(), items, status: "Received", at: Date.now(), picks: [] };
      D().rxs.push(x); save(); R.refresh(); toast(`${x.id} added to the queue for ${patName(v.pid)}`);
    },
  });
}

Pages.stock = (m) => {

function shelfClock(host) {
  const SPAN = 120, PAST = 18;
  Chart.mount(host, draw);
  draw();
  function draw() {
    const br = BRANCH(), W = Math.max(300, host.clientWidth || 900);
    const list = D().batches.filter((b) => b.branch === br && b.status === "OK" && b.qty > 0 && days(b.expiry) <= SPAN).sort((a, b) => a.expiry - b.expiry);
    const pct = (d) => ((clamp(d, -PAST, SPAN) + PAST) / (SPAN + PAST)) * 100;
    const capW = 150, lanes = [];
    const caps = list.map((b, i) => {
      const d = days(b.expiry), x = (pct(d) / 100) * W;
      let lane = lanes.findIndex((end) => end < x);
      if (lane < 0) { if (lanes.length < 7) lane = lanes.length; else lane = lanes.indexOf(Math.min(...lanes)); }
      lanes[lane] = x + capW;
      const c = d < 0 ? "var(--bad)" : d <= 30 ? "var(--bad)" : d <= 60 ? "var(--warn)" : d <= 90 ? "var(--c3)" : "var(--ok)";
      const short = mName(b.mid).replace(/ \d.*$/, "");
      return `<button type="button" class="cap" data-bid="${b.id}" style="left:min(${pct(d).toFixed(2)}%, calc(100% - ${capW}px));top:${lane * 32}px;--cc:${c};--d:${Math.min(i * 45, 900)}ms" aria-label="${esc(mName(b.mid))}, lot ${esc(b.lot)}, ${d < 0 ? "expired " + -d + " days ago" : d + " days left"}"><i></i>${esc(short)} <em>${d < 0 ? "expired" : d + "d"}</em></button>`;
    });
    const zones = [["z-past", -PAST, 0, "Expired"], ["z30", 0, 30, "30 days"], ["z60", 30, 60, "60"], ["z90", 60, 90, "90"], ["z120", 90, SPAN, "120"]];
    const qn = D().batches.filter((b) => b.branch === br && b.status === "Quarantine" && b.qty > 0).length;
    const h = Math.max(1, lanes.length) * 32 + 46;
    host.innerHTML = `<div class="sclock" style="height:${h + 56}px"><div class="zones">${zones.map(([c, a, b, l]) => `<div class="${c}" style="width:${pct(b) - pct(a)}%"><span>${l}</span></div>`).join("")}</div><div class="eline" style="left:${pct(0)}%"></div><div class="lanes" style="height:${h}px;margin-top:18px">${caps.join("") || `<div class="empty" style="padding-top:20px">${ic("check")}<b>Nothing expires in the next 120 days</b></div>`}</div><div class="saxis">${[0, 30, 60, 90, 120].map((d) => `<span style="left:${pct(d)}%">${d ? "+" + d : "Today"}</span>`).join("")}</div><button type="button" class="bin" id="bin" aria-label="Quarantine bin, ${qn} batches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3"/><path d="M10 11v6M14 11v6"/></svg>Bin <span>${qn}</span></button></div>`;
    host.querySelector(".lanes").addEventListener("click", (e) => { const c = e.target.closest("[data-bid]"); if (!c) return; const b = D().batches.find((x) => x.id === c.dataset.bid); if (!b) return; Menu.open(c, [{ label: "Quarantine into the bin", icon: "archive", danger: 1, run: () => quarantine(b, c) }, { label: "Open medicine", icon: "eye", run: () => medDrawer(med(b.mid)) }, { label: "Move to clearance shelf", icon: "tag", run: () => toast(`Lot ${b.lot} marked for 25% clearance`, "info") }]); });
    host.querySelector("#bin").addEventListener("click", () => binDrawer());
    $$(".cap", host).forEach((c) => { const b = D().batches.find((x) => x.id === c.dataset.bid); if (b) hoverTip(c, () => `<b>${esc(mName(b.mid))}</b>${tipRow("var(--c2)", "Lot", b.lot)}${tipRow("var(--c1)", "Packs", b.qty)}${tipRow("var(--bad)", "Expiry", fmt.dateY(b.expiry))}`); });
  }
}
function quarantine(b, capEl) {
  const done = () => { b.status = "Quarantine"; save(); R.refresh(); const bin = $("#bin"); if (bin && !RM) { bin.classList.remove("gulp"); void bin.offsetWidth; bin.classList.add("gulp"); } toast(`Lot ${b.lot} of ${mName(b.mid)} quarantined`, "warn"); };
  const bin = $("#bin");
  if (capEl && bin && capEl.animate && !RM) {
    const a = capEl.getBoundingClientRect(), z = bin.getBoundingClientRect();
    const dx = z.left + z.width / 2 - (a.left + a.width / 2), dy = z.top + z.height / 2 - (a.top + a.height / 2);
    capEl.style.zIndex = 9;
    const p = capEl.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${dx * 0.6}px, ${dy * 0.3 - 40}px) rotate(-25deg)`, opacity: 1, offset: 0.45 }, { transform: `translate(${dx}px, ${dy}px) rotate(-80deg) scale(.3)`, opacity: 0.2 }], { duration: 700, easing: "cubic-bezier(.5,0,.7,.4)", fill: "forwards" });
    p.onfinish = done;
  } else done();
}

  barChart($("#b-ch"), { id: "b-ch", labels: wk.map((e) => fmt.date(TODAY + (e - 6) * DAY)), series: BR.map((b) => ({ name: b.name, data: wk.map((e) => sum(kpiSpark(7, (o) => histAt(b.id, o + e)))) })), fmt: money, yFmt: moneyS, height: 240 });
  const low = d.meds.filter((x) => BR.some((b) => isLow(x, b.id))).slice(0, 10);
  $("#cmp").innerHTML = low.map((x) => `<tr><td>${esc(x.name)}</td>${BR.map((b) => `<td class="r num ${isLow(x, b.id) ? "low" : ""}">${stockAt(x.id, b.id)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="4" class="muted">Every branch is above reorder.</td></tr>`;
  $$("[data-switch]", m).forEach((b) => b.addEventListener("click", () => setBranch(b.dataset.switch)));
};
function transferModal(mid) {
  const meds = D().meds.slice().sort((a, b) => a.name.localeCompare(b.name)), from0 = BRANCH(), to0 = BR.find((b) => b.id !== from0).id;
  formModal({
    title: "Transfer stock between branches", submit: "Transfer",
    note: "The earliest-expiring batches move first, keeping their lot numbers and expiry dates.",
    values: { mid: mid || meds[0].id, from: from0, to: to0, qty: 10 },
    fields: [
      { name: "mid", label: "Medicine", type: "select", full: 1, options: meds.map((m) => ({ value: m.id, label: `${m.name} (${BR.map((b) => b.name.split(" ")[0] + " " + stockAt(m.id, b.id)).join(", ")})` })) },
      { name: "from", label: "From", type: "select", options: BR.map((b) => ({ value: b.id, label: b.name })) },
      { name: "to", label: "To", type: "select", options: BR.map((b) => ({ value: b.id, label: b.name })), validate: (v, a) => (v === a.from ? "Pick a different branch" : "") },
      { name: "qty", label: "Packs", type: "number", min: 1, required: 1, full: 1, validate: (v, a) => (v > stockAt(a.mid, a.from) ? `Only ${stockAt(a.mid, a.from)} packs at ${brName(a.from)}` : "") },
    ],
    onSubmit: (v) => {
      const picks = pickFEFO(v.mid, v.from, v.qty, true).picks;
      picks.forEach((pk) => { const src = D().batches.find((b) => b.id === pk.bid); const dst = D().batches.find((b) => b.mid === v.mid && b.branch === v.to && b.lot === pk.lot && b.status === "OK"); if (dst) dst.qty += pk.qty; else D().batches.push({ id: "b" + D().seq.batch++, mid: v.mid, branch: v.to, lot: pk.lot, expiry: pk.exp, qty: pk.qty, cost: src ? src.cost : 0, status: "OK" }); });
      save(); R.refresh(); toast(`${v.qty} packs of ${mName(v.mid)} moved ${brName(v.from)} → ${brName(v.to)}`); lowAlert([v.mid], v.from);
    },
  });
}

Pages.purchasing = (m) => {
  const br = BRANCH(), d = D();
  const sugg = d.meds.filter((x) => isLow(x, br));
  m.innerHTML = toolbar("Orders to distributors and booking them in. Each received line becomes a batch with its lot and expiry.", `<button class="btn pri" data-neworder>${ic("plus")}New order</button>`) + `
  <div class="grid g21">${card("", `<div id="otbl"></div>`)}${card("", `<div class="ch"><div><h3>Suggested for ${esc(brName(br))}</h3><p>At or under reorder level</p></div>${sugg.length ? `<button class="btn sm pri" id="o-all">Order all</button>` : ""}</div><ul class="items" id="o-sug">${sugg.map((x) => `<li><span><b>${esc(x.name)}</b><br><small class="muted">${stockAt(x.id, br)} left · reorder ${x.reorder}</small></span><button class="btn sm" data-sug="${x.id}">Add</button></li>`).join("") || "<li class='muted'>Nothing is low here.</li>"}</ul>`)}</div>`;
  dataTable($("#otbl"), {
    key: "ord", caption: "Supplier orders", ph: "Search order or supplier…", sort: 0, dir: -1,
    rows: () => D().orders, text: (o) => o.id + " " + o.sup + " " + brName(o.branch) + " " + o.status,
    filters: [{ id: "all", label: "All" }, { id: "o", label: "Ordered", test: (o) => o.status === "Ordered" }, { id: "r", label: "Received", test: (o) => o.status === "Received" }],
    columns: [
      { k: "id", label: "Order", render: (o) => `<b>${esc(o.id)}</b>` },
      { k: "sup", label: "Supplier" },
      { k: "branch", label: "Branch", get: (o) => brName(o.branch), render: (o) => esc(brName(o.branch)) },
      { k: "val", label: "Value", num: 1, get: (o) => sum(o.lines, (l) => l.qty * l.cost), render: (o) => money(sum(o.lines, (l) => l.qty * l.cost)) },
      { k: "eta", label: "ETA", num: 1, render: (o) => fmt.date(o.eta) },
      { k: "status", label: "Status", render: (o) => badge(o.status, o.status === "Received" ? "ok" : "info") },
      { label: "", sort: false, render: (o) => (o.status === "Ordered" ? `<span class="acts"><button class="btn sm pri" data-act="rec">Receive</button></span>` : "") },
    ],
    actions: { rec: (o) => receiveOrder(o) }, onRow: orderDrawer,
  });
  const add = (ids) => { const lines = ids.map((id) => med(id)).filter(Boolean).map((x) => ({ mid: x.id, qty: Math.max(x.reorder * 2 - stockAt(x.id, br), x.reorder), cost: Math.round(x.price * 0.72) })); if (!lines.length) return; const o = { id: "SO-" + D().seq.so++, sup: SUPS[0], branch: br, lines, status: "Ordered", eta: TODAY + 2 * DAY, at: Date.now() }; D().orders.push(o); save(); R.refresh(); toast(`${o.id} placed with ${o.sup}: ${lines.length} line${lines.length > 1 ? "s" : ""}`); };
  $("#o-sug").addEventListener("click", (e) => { const b = e.target.closest("[data-sug]"); if (b) add([b.dataset.sug]); });
  const all = $("#o-all"); if (all) all.addEventListener("click", () => add(sugg.map((x) => x.id)));
};
function orderModal() {
  const meds = D().meds.slice().sort((a, b) => a.name.localeCompare(b.name)), opts = meds.map((x) => ({ value: x.id, label: x.name }));
  formModal({
    title: "New supplier order", submit: "Place order",
    values: { sup: SUPS[0], branch: BRANCH(), q1: 50, m2: "" },
    fields: [
      { name: "sup", label: "Supplier", type: "select", options: SUPS }, { name: "branch", label: "Deliver to", type: "select", options: BR.map((b) => ({ value: b.id, label: b.name })) },
      { name: "m1", label: "Medicine", type: "select", options: opts }, { name: "q1", label: "Packs", type: "number", min: 1, required: 1 },
      { name: "m2", label: "Second medicine", type: "select", options: [{ value: "", label: "None" }].concat(opts), validate: (v, a) => (v && v === a.m1 ? "Already on the order" : "") }, { name: "q2", label: "Packs", type: "number", min: 1, validate: (v, a) => (a.m2 && Number.isNaN(v) ? "Enter packs" : "") },
    ],
    onSubmit: (v) => {
      const lines = [[v.m1, v.q1], [v.m2, v.q2]].filter(([id, q]) => id && q > 0).map(([mid, qty]) => ({ mid, qty, cost: Math.round(med(mid).price * 0.72) }));
      const o = { id: "SO-" + D().seq.so++, sup: v.sup, branch: v.branch, lines, status: "Ordered", eta: TODAY + 2 * DAY, at: Date.now() };
      D().orders.push(o); save(); R.refresh(); toast(`${o.id} placed with ${v.sup}`);
    },
  });
}
function receiveOrder(o) {
  const lines = o.lines.filter((l) => med(l.mid));
  if (!lines.length) { o.status = "Received"; save(); R.refresh(); return; }
  const fields = [], values = {};
  lines.forEach((l, i) => { fields.push({ name: "q" + i, label: `${mName(l.mid)}: packs`, type: "number", min: 0, required: 1, hint: `Ordered ${l.qty}` }, { name: "l" + i, label: "Lot", required: 1 }, { name: "e" + i, label: "Expiry", type: "date", required: 1, full: 1, validate: (v) => (parseISO(v) <= TODAY + 90 * DAY ? "Needs at least 90 days of shelf life" : "") }); values["q" + i] = l.qty; values["l" + i] = "KX" + Math.floor(1000 + Math.random() * 8999); values["e" + i] = fmt.iso(TODAY + 600 * DAY); });
  formModal({
    title: `Receive ${esc(o.id)}`, submit: "Book in", wide: 1, fields, values, note: `${esc(o.sup)} → ${esc(brName(o.branch))}. Check each lot and expiry against the invoice.`,
    onSubmit: (v) => {
      let short = 0;
      lines.forEach((l, i) => { const q = v["q" + i]; if (q < l.qty) short++; if (q > 0) D().batches.push({ id: "b" + D().seq.batch++, mid: l.mid, branch: o.branch, lot: v["l" + i].toUpperCase(), expiry: parseISO(v["e" + i]), qty: q, cost: l.cost, status: "OK" }); l.rec = q; });
      o.status = "Received"; save(); R.refresh(); toast(`${o.id} booked in at ${brName(o.branch)}${short ? `, ${short} short` : ""}`, short ? "warn" : "ok");
    },
  });
}
function orderDrawer(o) {
  if (!o) return;
  const dr = drawer({ title: esc(o.id), body: `<dl class="dl"><dt>Supplier</dt><dd>${esc(o.sup)}</dd><dt>Branch</dt><dd>${esc(brName(o.branch))}</dd><dt>ETA</dt><dd>${fmt.dateY(o.eta)}</dd><dt>Status</dt><dd>${badge(o.status, o.status === "Received" ? "ok" : "info")}</dd></dl><ul class="items">${o.lines.map((l) => `<li><span>${esc(mName(l.mid))}</span><span>${l.qty} packs${l.rec != null ? ` · got ${l.rec}` : ""} · ${money(l.qty * l.cost)}</span></li>`).join("")}</ul>`, foot: o.status === "Ordered" ? `<button type="button" class="btn pri" data-rec>Receive</button>` : `<button type="button" class="btn" data-close>Close</button>` });
  const r = dr.el.querySelector("[data-rec]"); if (r) r.addEventListener("click", () => { dr.close(); receiveOrder(o); });
}

Pages.reports = (m) => {
  m.innerHTML = toolbar("Sales across branches. The range switch redraws every chart.", `<div id="rrng"></div><button class="btn" data-exportsales>${ic("download")}Export CSV</button>`) + `
  <div class="grid g21">${card("", `<div class="ch"><div><h3>Sales by branch</h3><p id="r-sum"></p></div></div><div id="r-line"></div>`)}${card("", `<div class="ch"><div><h3>Sales mix</h3><p>By category, all branches</p></div></div><div id="r-cat"></div>`)}</div>
  <div class="grid g21">${card("", `<div class="ch"><div><h3>Prescriptions filled</h3><p>Per period, all branches</p></div></div><div id="r-rx"></div>`)}${card("", `<div class="ch"><div><h3>Top medicines today</h3><p>From saved receipts</p></div></div><div id="r-top"></div>`)}</div>`;
  const W = [0.16, 0.08, 0.17, 0.12, 0.11, 0.07, 0.06, 0.12, 0.05, 0.06];
  const draw = () => {
    const ser = BR.map((b) => ({ name: b.name, data: rangeData(range, (o) => histAt(b.id, o)).data })), labels = rangeData(range, () => 0).labels;
    const tot = sum(ser, (s) => sum(s.data));
    $("#r-sum").textContent = `${moneyS(tot)} in this range`;
    lineChart($("#r-line"), { id: "r-line", labels, series: ser, area: true, fmt: money, yFmt: moneyS, height: 240 });
    donut($("#r-cat"), { id: "r-cat", fmt: moneyS, size: 150, thick: 20, items: CATS.map((c, i) => ({ label: c, value: tot * (W[i] || 0.05) })) });
    barChart($("#r-rx"), { id: "r-rx", labels, series: [{ name: "Prescriptions", data: rangeData(range, (o) => sum(BR, (b) => rxAt(b.id, o))).data, color: "var(--c4)" }], height: 220 });
  };
  seg($("#rrng"), ["7D", "30D", "12M"], range, (v) => { range = v; draw(); });
  draw();
  const top = {}; D().sales.filter((s) => s.t >= TODAY).forEach((s) => s.lines.forEach((l) => (top[l.mid] = (top[l.mid] || 0) + l.qty * l.price)));
  barList($("#r-top"), { fmt: money, items: Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 7).map(([mid, value]) => ({ label: mName(mid), value })) });
};

Pages.settings = (m) => {
  const s = D().settings;
  m.innerHTML = `<div class="grid g11">
    ${card("", `<div class="ch"><div><h3>Pharmacy</h3><p>Printed on every receipt</p></div></div><form class="form" id="prof" novalidate>${fieldHTML({ name: "pharmacy", label: "Pharmacy name", required: 1 }, s.pharmacy)}${fieldHTML({ name: "license", label: "Drug sale licence", required: 1 }, s.license)}${fieldHTML({ name: "duty", label: "Pharmacist on duty", type: "select", options: ["Saima Rauf", "Junaid Akhtar", "Hira Malik"] }, s.duty)}<div class="full row"><button class="btn pri" type="submit">${ic("check")}Save</button></div></form>`)}
    ${card("", `<div class="ch"><div><h3>Rules and alerts</h3><p>Saved as you change them</p></div></div>
      <div class="set-row"><div><b>Require prescriptions</b><p>Block Rx-only medicines at the counter without a linked slip</p></div><input type="checkbox" class="switch" id="s-rx" ${s.rxRule ? "checked" : ""} aria-label="Require prescriptions"></div>
      <div class="set-row"><div><b>Expiry warning</b><p>Flag batches this many days ahead</p></div><select class="inp" id="s-exp" style="width:110px" aria-label="Expiry warning days">${[30, 60, 90].map((n) => `<option value="${n}" ${n === s.expWarn ? "selected" : ""}>${n} days</option>`).join("")}</select></div>
      <div class="set-row"><div><b>Low-stock alerts</b><p>Ring the bell after a sale drops stock to reorder</p></div><input type="checkbox" class="switch" id="s-al" ${s.alerts ? "checked" : ""} aria-label="Low-stock alerts"></div>
      <div class="set-row"><div><b>Theme</b><p>Clinical white or night shift navy</p></div><button class="btn icon" data-theme-btn aria-label="Switch theme"></button></div>
      <div class="set-row"><div><b>Reset demo data</b><p>Restore sample stock, patients and the queue</p></div><button class="btn danger" id="s-reset">${ic("refresh")}Reset</button></div>`)}
  </div>`;
  Theme.paint();
  const f = $("#prof");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    let ok = true;
    ["pharmacy", "license"].forEach((n) => { const v = f.elements[n].value.trim(); const w = f.querySelector(`[data-fld="${n}"]`); w.classList.toggle("err", !v); w.querySelector(".ferr").textContent = v ? "" : "This field is required"; if (!v) ok = false; });
    if (!ok) return toast("Please fill in the highlighted fields", "bad");
    Object.assign(s, { pharmacy: f.elements.pharmacy.value.trim(), license: f.elements.license.value.trim(), duty: f.elements.duty.value }); save(); paintShell(); toast("Pharmacy details saved");
  });
  $("#s-rx").addEventListener("change", (e) => { s.rxRule = e.target.checked; save(); toast(s.rxRule ? "Prescriptions are required again" : "Prescription check turned off for this demo", s.rxRule ? "ok" : "warn"); });
  $("#s-exp").addEventListener("change", (e) => { s.expWarn = +e.target.value; save(); toast(`Expiry warning set to ${s.expWarn} days`, "info"); });
  $("#s-al").addEventListener("change", (e) => { s.alerts = e.target.checked; save(); toast(`Low-stock alerts ${s.alerts ? "on" : "off"}`, "info"); });
  $("#s-reset").addEventListener("click", async () => { if (await confirmDlg("Stock, sales, patients and prescriptions go back to the sample data.", { title: "Reset demo data?", ok: "Reset" })) { S.reset(); cart = []; cartRx = null; cartPid = ""; Bell.items = []; seedBell(); Bell.paint(); paintShell(); R.refresh(); toast("Demo data reset"); } });
};

/* ================= Shell ================= */
function setBranch(id) { D().settings.branch = id; save(); $("#branch").value = id; cart = []; cartRx = null; paintShell(); R.refresh(); toast(`Now working at ${brName(id)}`, "info"); }
function paintShell() {
  const s = D().settings;
  $("#branch").innerHTML = BR.map((b) => `<option value="${b.id}" ${b.id === s.branch ? "selected" : ""}>${esc(b.name)}</option>`).join("");
  $(".brand small").textContent = s.pharmacy;
  $("#duty-n").textContent = s.duty;
  $(".duty .ava").textContent = initials(s.duty);
  const q = D().rxs.filter((x) => x.branch === s.branch && (x.status === "Received" || x.status === "Checking")).length;
  const qb = $("#nav-q"); if (qb) { qb.textContent = q; qb.hidden = !q; }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-newrx],[data-receive],[data-addpat],[data-transfer],[data-neworder],[data-qall],[data-exportstock],[data-exportsales]");
  if (!b) return;
  if (b.hasAttribute("data-newrx")) rxModal();
  else if (b.hasAttribute("data-receive")) receiveModal();
  else if (b.hasAttribute("data-addpat")) patModal();
  else if (b.hasAttribute("data-transfer")) transferModal();
  else if (b.hasAttribute("data-neworder")) orderModal();
  else if (b.hasAttribute("data-qall")) {
    const list = D().batches.filter((x) => x.branch === BRANCH() && x.status === "OK" && x.qty > 0 && x.expiry < TODAY);
    if (!list.length) return toast("No expired batches on the shelf", "info");
    list.forEach((x) => (x.status = "Quarantine")); save(); R.refresh(); toast(`${list.length} expired batches moved to the quarantine bin`, "warn");
  } else if (b.hasAttribute("data-exportstock")) downloadCSV("stock.csv", [["Medicine", "Branch", "Lot", "Expiry", "Packs", "Status"], ...D().batches.filter((x) => x.branch === BRANCH() && x.qty > 0).map((x) => [mName(x.mid), brName(x.branch), x.lot, fmt.iso(x.expiry), x.qty, x.status])]);
  else if (b.hasAttribute("data-exportsales")) downloadCSV("sales.csv", [["Day", ...BR.map((x) => x.name)], ...kpiSpark(90, (o) => [fmt.iso(TODAY + o * DAY), ...BR.map((x) => Math.round(histAt(x.id, o)))])]);
});
const ROUTES = [
  { id: "counter", label: "Counter", icon: "cart", render: Pages.counter },
  { id: "prescriptions", label: "Prescriptions", icon: "rx", render: Pages.prescriptions },
  { id: "stock", label: "Stock", icon: "pill", render: Pages.stock },
  { id: "expiry", label: "Expiry", icon: "hourglass", render: Pages.expiry },
  { id: "patients", label: "Patients", icon: "users", render: Pages.patients },
  { id: "branches", label: "Branches", icon: "building", render: Pages.branches },
  { id: "purchasing", label: "Purchasing", icon: "truck", render: Pages.purchasing },
  { id: "reports", label: "Reports", icon: "chart", render: Pages.reports },
  { id: "settings", label: "Settings", icon: "settings", render: Pages.settings },
];
$("[data-nav]").insertAdjacentHTML("beforeend", ROUTES.map((r) => `<a href="#/${r.id}">${ic(r.icon)}<span>${r.label}</span>${r.id === "prescriptions" ? '<span class="q" id="nav-q"></span>' : ""}</a>`).join(""));
$("[data-menu-btn]").innerHTML = ic("menu");
$("[data-cmdk]").innerHTML = ic("search");
$("#branch").addEventListener("change", (e) => setBranch(e.target.value));
const tick = () => { const d = new Date(); $("#clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()); };
tick(); every(20000, tick);
paintShell();
const R = Router({
  routes: ROUTES, def: "counter", main: $("#main"), title: "Medlane",
  onRoute: (id) => { const r = ROUTES.find((x) => x.id === id); $("#pt").textContent = r.label; $("#crumb").textContent = D().settings.pharmacy + " · " + brName(BRANCH()); paintShell(); },
});
seedBell();
R.start();
Cmdk.add([
  { label: "New prescription", icon: "rx", hint: "Action", run: () => rxModal() },
  { label: "Receive a batch", icon: "truck", hint: "Action", run: () => receiveModal() },
  { label: "Transfer stock", icon: "swap", hint: "Action", run: () => transferModal() },
  { label: "Add patient", icon: "user", hint: "Action", run: () => patModal() },
  ...BR.map((b) => ({ label: "Switch to " + b.name, icon: "pin", hint: "Branch", run: () => setBranch(b.id) })),
  { label: "Switch theme", icon: "moon", hint: "Action", run: () => Theme.toggle() },
]);
</script>
