<!doctype html>
<!-- Chill & Craft · Starboard · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starboard · review summary with rating bars</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: cream paper, berry ink and gold (light), espresso and gold (dark) ---------- */
  :root {
    --bg: #f6efe4; --bg-2: #fffaf2; --dots: rgba(91, 26, 58, 0.07);
    --card: #fffdf8; --edge: rgba(91, 26, 58, 0.1); --ink: #3a1027; --muted: #85677a; --soft: #f5ebe2; --soft-2: #ecdccf;
    --berry: #8c1d4f; --berry-2: #b8336f; --gold: #f2a900; --gold-2: #ffd257; --track: rgba(91, 26, 58, 0.09); --good: #1c8f5e; --bad: #c43d4b;
    --shadow: rgba(80, 20, 40, 0.28); --focus: #8c1d4f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #120b0d; --bg-2: #1d1215; --dots: rgba(255, 210, 87, 0.05);
    --card: #21161a; --edge: rgba(255, 255, 255, 0.08); --ink: #f8ece8; --muted: #bfa3ad; --soft: #2c1e23; --soft-2: #3a2830;
    --berry: #ff7aa9; --berry-2: #ff9bbe; --gold: #ffc23a; --gold-2: #ffe08a; --track: rgba(255, 255, 255, 0.08); --good: #46d394; --bad: #ff7383;
    --shadow: rgba(0, 0, 0, 0.65); --focus: #ffd257;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button, input, textarea { font: inherit; color: inherit; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 26px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(70% 60% at 30% 10%, var(--bg-2), transparent 70%), radial-gradient(var(--dots) 1.2px, transparent 1.3px) 0 0 / 20px 20px, var(--bg); }
  .wrap { width: min(1000px, 100%); display: grid; grid-template-columns: 370px minmax(0, 1fr); gap: 22px; align-items: start; }

  .card { background: var(--card); border-radius: 26px; border: 1px solid var(--edge); box-shadow: 0 40px 70px -50px var(--shadow); animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.12) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(0.97); } }

  /* ---------- Summary ---------- */
  .sum { padding: 20px; }
  .sum h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 830; }
  .prod { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .prod svg { width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--soft); padding: 4px; }
  .score { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; margin-top: 16px; }
  .dial { position: relative; width: 112px; height: 112px; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial .trk { fill: none; stroke: var(--track); stroke-width: 9; }
  .dial .arc { fill: none; stroke: url(#gold); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; transition: stroke-dashoffset 1.2s cubic-bezier(0.3, 1.2, 0.4, 1); }
  .dial .glint { fill: none; stroke: rgba(255, 255, 255, 0.7); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 281; animation: glint 5s ease-in-out infinite 1.5s; opacity: 0; }
  @keyframes glint { 0% { stroke-dashoffset: 0; opacity: 0; } 10% { opacity: 1; } 40% { stroke-dashoffset: -260; opacity: 0; } 100% { stroke-dashoffset: -260; opacity: 0; } }
  .avg { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .avg b { font-size: 31px; font-weight: 860; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
  .avg span { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .dial.pop { animation: dpop 0.6s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes dpop { 30% { transform: scale(0.93); } }

  .bars { display: grid; gap: 3px; }
  .row { display: grid; grid-template-columns: 26px 1fr 38px; align-items: center; gap: 8px; height: 22px; padding: 0 6px; margin: 0 -6px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; transition: background 0.25s, opacity 0.3s; }
  .row:hover { background: var(--soft); }
  .row .n { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 760; }
  .row .n svg { width: 11px; height: 11px; fill: var(--gold); }
  .row .tr { position: relative; height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; }
  .row .tr i { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width 1s cubic-bezier(0.3, 1.25, 0.4, 1); transition-delay: var(--d, 0s); }
  .row .tr i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent) -100% 0 / 50% 100% no-repeat; animation: shine 4.5s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes shine { 0%, 70% { background-position: -100% 0; } 100% { background-position: 250% 0; } }
  .row .pc { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .row[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 18%, transparent); }
  .row[aria-pressed="true"] .pc { color: var(--ink); font-weight: 750; }
  .bars.filtering .row[aria-pressed="false"] { opacity: 0.45; }

  .total { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .stars { position: relative; display: inline-flex; flex: none; }
  .stars svg { width: 17px; height: 17px; fill: var(--track); }
  .stars .on { position: absolute; left: 0; top: 0; display: flex; overflow: hidden; width: var(--f, 0%); transition: width 1.2s cubic-bezier(0.3, 1.2, 0.4, 1); }
  .stars .on svg { flex: none; fill: var(--gold); }
  .total b { color: var(--ink); }

  .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--edge); }
  .topics .lab { width: 100%; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .topic { height: 30px; padding: 0 10px; white-space: nowrap; border: 0; border-radius: 999px; cursor: pointer; background: var(--soft); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: background 0.25s, color 0.25s, transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .topic small { font-size: 11px; color: var(--muted); font-weight: 700; }
  .topic:active { transform: scale(0.93); }
  .topic[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .topic[aria-pressed="true"] small { color: inherit; opacity: 0.7; }

  .write { width: 100%; height: 48px; margin-top: 16px; border: 0; border-radius: 15px; cursor: pointer; font-size: 15px; font-weight: 780; color: #fff; background: linear-gradient(135deg, var(--berry), var(--berry-2)); box-shadow: 0 16px 26px -16px var(--berry); display: inline-flex; align-items: center; justify-content: center; gap: 9px; transition: transform 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
  :root[data-theme="dark"] .write { color: #2a0716; }
  .write svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .write:hover { transform: translateY(-1px); }
  .write:active { transform: scale(0.96); }

  /* ---------- Reviews list and the form share one area and slide past each other ---------- */
  .area { min-width: 0; animation-delay: 0.12s; padding: 18px 18px 14px; }
  .la-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; margin-bottom: 12px; }
  .la-head h2 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
  .filt { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); opacity: 0; transform: translateX(12px); visibility: hidden; transition: opacity 0.3s, transform 0.4s cubic-bezier(0.3, 1.5, 0.5, 1), visibility 0s 0.4s; }
  .filt.on { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
  .filt button { height: 26px; padding: 0 10px; border: 0; border-radius: 8px; cursor: pointer; background: var(--soft); font-size: 12px; font-weight: 750; }
  /* both panes sit on top of each other; the box eases to the height of the one showing */
  .panes { position: relative; overflow-x: clip; transition: height 0.5s cubic-bezier(0.3, 1.2, 0.4, 1); }
  .pane { position: absolute; left: 0; right: 0; top: 0; min-width: 0; transition: transform 0.55s cubic-bezier(0.3, 1.2, 0.4, 1), opacity 0.35s, visibility 0s 0.55s; }
  .pane.form { transform: translateX(40px); opacity: 0; visibility: hidden; }
  .writing .pane.list { transform: translateX(-40px); opacity: 0; visibility: hidden; }
  .writing .pane.form { transform: none; opacity: 1; visibility: visible; transition-delay: 0s; }
  .pane.list { visibility: visible; transition-delay: 0s; }
  .writing .pane.list { transition-delay: 0s, 0s, 0.55s; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; align-content: start; }
  .rv { position: relative; padding: 13px 14px 11px; border-radius: 18px; background: var(--soft); transition: transform 0.5s cubic-bezier(0.3, 1.3, 0.4, 1), opacity 0.3s; }
  .rv.enter { animation: enter 0.55s cubic-bezier(0.25, 1.4, 0.4, 1) backwards; animation-delay: calc(var(--k, 0) * 70ms); }
  @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(0.95); } }
  .rv.leave { opacity: 0; transform: scale(0.94); transition-duration: 0.25s; }
  .rv.fresh { box-shadow: 0 0 0 2px var(--gold), 0 14px 30px -18px var(--gold); animation: drop 0.8s cubic-bezier(0.25, 1.5, 0.4, 1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px) scale(0.9) rotate(-2deg); } }
  .rv-top { display: flex; align-items: center; gap: 10px; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12.5px; font-weight: 820; color: #fff; background: hsl(var(--h) 55% 45%); }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs { display: inline-flex; flex: none; }
  .rs svg { width: 13px; height: 13px; fill: var(--track); }
  .rs svg.f { fill: var(--gold); }
  .rv p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rv-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .ver { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--good); }
  .ver svg, .new-tag svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .new-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; color: var(--berry); }
  .help { position: relative; height: 30px; padding: 0 10px; border: 0; border-radius: 10px; cursor: pointer; background: var(--card); font-size: 12px; font-weight: 720; display: inline-flex; align-items: center; gap: 6px; transition: background 0.25s, color 0.25s; }
  .help svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; transition: transform 0.5s cubic-bezier(0.3, 1.9, 0.5, 1); }
  .help[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .help[aria-pressed="true"] svg { transform: rotate(-14deg) scale(1.15); fill: currentColor; }
  .help .plus { position: absolute; right: 6px; top: -4px; font-size: 11px; font-weight: 850; color: var(--berry); opacity: 0; pointer-events: none; }
  .help .plus.go { animation: plus 0.9s ease-out; }
  @keyframes plus { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }
  .empty { padding: 26px 10px; text-align: center; font-size: 13px; color: var(--muted); border: 1.5px dashed var(--soft-2); border-radius: 18px; }

  /* ---------- Write a review ---------- */
  form { display: grid; gap: 12px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, .flab { padding: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
  .rate { display: flex; align-items: center; gap: 4px; }
  .rate.shake { animation: shake 0.45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .rate label { position: relative; cursor: pointer; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; }
  .rate input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rate svg { width: 32px; height: 32px; fill: var(--track); stroke: var(--soft-2); stroke-width: 0.6; transition: fill 0.2s, transform 0.45s cubic-bezier(0.3, 2, 0.5, 1); }
  .rate label.lit svg { fill: var(--gold); stroke: transparent; }
  .rate label.hov svg { fill: color-mix(in srgb, var(--gold) 55%, var(--track)); }
  .rate label.boom svg { animation: boom 0.5s cubic-bezier(0.3, 2, 0.5, 1); animation-delay: calc(var(--k) * 60ms); }
  @keyframes boom { 40% { transform: scale(1.35) rotate(12deg); } }
  .rate label:has(input:focus-visible) { outline: 2.5px solid var(--focus); outline-offset: 1px; }
  .word { margin-left: 8px; font-size: 13px; font-weight: 750; color: var(--berry); min-width: 60px; }
  .field { display: grid; gap: 0; }
  .field input, .field textarea { width: 100%; border-radius: 13px; border: 1.5px solid var(--soft-2); background: var(--card); padding: 10px 12px; font-size: 14px; color: var(--ink); transition: border-color 0.2s, box-shadow 0.2s; }
  .field textarea { height: 76px; resize: none; line-height: 1.4; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--berry); box-shadow: 0 0 0 4px color-mix(in srgb, var(--berry) 15%, transparent); }
  .field .bad { border-color: var(--bad); }
  .hint { display: flex; justify-content: space-between; gap: 10px; min-height: 16px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .err { color: var(--bad); font-weight: 650; }
  .f-act { display: flex; gap: 8px; }
  .f-act button { height: 46px; border: 0; border-radius: 14px; cursor: pointer; font-weight: 780; font-size: 14.5px; }
  .cancel { padding: 0 16px; background: var(--soft); }
  .post { position: relative; flex: 1; overflow: hidden; color: #fff; background: linear-gradient(135deg, var(--berry), var(--berry-2)); transition: transform 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
  :root[data-theme="dark"] .post { color: #2a0716; }
  .post:active { transform: scale(0.96); }
  .post .pl { position: relative; z-index: 1; }
  .post .bar { position: absolute; inset: 0; width: 0; background: rgba(255, 255, 255, 0.22); }
  .post[data-state="work"] .bar { width: 100%; transition: width 0.8s cubic-bezier(0.6, 0.1, 0.3, 1); }
  .post[data-state="done"] { background: var(--good); }

  /* stars confetti and the demo pointer */
  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; }
  .ghost.tap::after { animation: ring 0.5s ease-out; }
  @keyframes ring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  @media (max-width: 860px) {
    .stage { align-items: flex-start; padding-top: 14px; }
    .prod { margin-top: 4px; }
    .prod svg { width: 26px; height: 26px; padding: 3px; border-radius: 8px; }
    .bars { gap: 1px; }
    .row { height: 20px; }
    .sum h1 { font-size: 19px; }
    .wrap { grid-template-columns: minmax(0, 1fr); max-width: 440px; gap: 12px; }
    .sum { padding: 16px; }
    .score { grid-template-columns: 96px 1fr; gap: 14px; margin-top: 12px; }
    .dial { width: 96px; height: 96px; }
    .avg b { font-size: 27px; }
    .total { margin-top: 10px; }
    .topics { margin-top: 10px; padding-top: 10px; }
    .topics .lab { display: none; }
    .write { height: 44px; margin-top: 12px; }
    .area { padding: 14px 14px 12px; }
    .la-head { margin-bottom: 10px; }
    form { gap: 10px; }
    .field textarea { height: 62px; }
    .rate label { width: 36px; height: 36px; }
    .rate svg { width: 29px; height: 29px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.3 6 20.6l1.3-6.7-5-4.7 6.8-.8z"/></symbol>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd257"/><stop offset="1" stop-color="#f2a900"/></linearGradient>
</defs></svg>
<main class="stage">
  <div class="wrap">
    <section class="card sum" aria-labelledby="ttl">
      <h1 id="ttl">Customer reviews</h1>
      <p class="prod"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 30c0-9 3-20 11-20s11 11 11 20c0 3-5 4-11 4S9 33 9 30z" fill="#8a4b2a"/><path d="M12 22c4-3 12-3 16 0M13 26c4-2 10-2 14 0" stroke="#e8b27a" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M15 15l5 4 5-4" stroke="#f2d0a4" stroke-width="1.6" fill="none"/></svg><span>Peshawari leather sandals · PKR 4,800</span></p>
      <div class="score">
        <div class="dial" id="dial">
          <svg viewBox="0 0 112 112" aria-hidden="true"><circle class="trk" cx="56" cy="56" r="46"/><circle class="arc" id="arc" cx="56" cy="56" r="46"/><circle class="glint" cx="56" cy="56" r="46"/></svg>
          <div class="avg"><b id="avg">0.00</b><span>out of 5</span></div>
        </div>
        <div class="bars" id="bars" role="group" aria-label="Filter by star rating"></div>
      </div>
      <p class="total"><span class="stars" aria-hidden="true"><span class="off"></span><span class="on" id="starsOn"></span></span><span><b id="count">0</b> reviews</span></p>
      <div class="topics" role="group" aria-label="Filter by topic">
        <span class="lab">People mention</span>
        <button class="topic" type="button" data-t="comfort" aria-pressed="false">Comfort <small>86</small></button>
        <button class="topic" type="button" data-t="stitching" aria-pressed="false">Stitching <small>54</small></button>
        <button class="topic" type="button" data-t="delivery" aria-pressed="false">Delivery <small>31</small></button>
      </div>
      <button class="write" id="write" type="button"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>Write a review</button>
    </section>

    <section class="card area" id="area" aria-labelledby="lh">
      <div class="la-head">
        <h2 id="lh">Most helpful</h2>
        <span class="filt" id="filt"><span id="filtTxt">5 stars</span><button type="button" id="clear">Clear</button></span>
      </div>
      <div class="panes">
        <div class="pane list"><ul class="list" id="list" aria-live="polite"></ul></div>
        <div class="pane form">
          <form id="form" novalidate>
            <fieldset>
              <legend>Your rating</legend>
              <div class="rate" id="rate"></div>
            </fieldset>
            <div class="field">
              <label class="flab" for="txt">Your review</label>
              <textarea id="txt" maxlength="200" placeholder="How do they feel, fit and look?"></textarea>
              <div class="hint"><span id="txtErr" class="err"></span><span id="left">0 / 200</span></div>
            </div>
            <div class="field">
              <label class="sr-only" for="nm">Your name (optional)</label>
