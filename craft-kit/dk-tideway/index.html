<!doctype html>
<!-- Chill & Craft · Tideway · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideway · Personal and studio money</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: sand + deep teal + saffron (light), teal night (dark) ---------- */
  :root {
    --bg: #fbf6ec; --surface: #fffcf6; --surface-2: #f3ecdd; --panel: #fffcf6;
    --ink: #0f3537; --muted: #6c7f7c; --line: #e8dfcc; --grid: #eee6d6;
    --accent: #e8912a; --accent-ink: #fff; --teal: #127a77; --sea: #3fa7b5; --plum: #a0567f; --sage: #7e9f5a;
    --good: #2f8f6b; --bad: #c8553d; --warn: #e8912a;
    --radius: 18px; --radius-sm: 12px; --tip-bg: #0f3537; --tip-ink: #fbf6ec;
    --side: #0f3537; --side-ink: #e9f3f0; --side-muted: #8fb3ad;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0a1a1c; --surface: #0f2427; --surface-2: #153135; --panel: #11282b;
    --ink: #eaf4f1; --muted: #8aa9a4; --line: #1f3d41; --grid: #18363a;
    --accent: #f4a23c; --accent-ink: #1b1305; --teal: #3cc1b8; --sea: #6ccfe0; --plum: #d58ab3; --sage: #a9cf7e;
    --good: #5fd3a0; --bad: #f08a70;
    --tip-bg: #eaf4f1; --tip-ink: #0f2427;
    --side: #071315; --side-ink: #eaf4f1; --side-muted: #6f908b;
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- Shell ---------- */
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 24px; padding: 24px 0 20px; background: var(--side); color: var(--side-ink); overflow: hidden; }
  .side::after { content: ""; position: absolute; left: -40px; right: -40px; bottom: -30px; height: 140px; background: radial-gradient(60% 60% at 30% 100%, rgba(232,145,42,.35), transparent 70%), radial-gradient(50% 60% at 80% 100%, rgba(63,167,181,.35), transparent 70%); pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 22px; color: inherit; text-decoration: none; font-weight: 800; font-size: 1.25rem; letter-spacing: .01em; }
  .brand svg { width: 34px; height: 34px; }
  .nav { position: relative; display: grid; gap: 2px; padding-left: 14px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 11px 16px; color: var(--side-muted); text-decoration: none; font-weight: 600; transition: color .25s; }
  .nav a:hover { color: var(--side-ink); }
  .nav a[aria-current="page"] { color: var(--ink); }
  .nav .ic { width: 19px; height: 19px; }
  /* active marker: a tab of page colour that flows into the content, with curved corners */
  .nav .mark { position: absolute; left: 14px; right: 0; top: 0; background: var(--bg); border-radius: 22px 0 0 22px; transition: transform .5s cubic-bezier(.35,1.3,.5,1), height .3s; }
  .nav .mark::before, .nav .mark::after { content: ""; position: absolute; right: 0; width: 22px; height: 22px; background: transparent; }
  .nav .mark::before { top: -22px; border-bottom-right-radius: 22px; box-shadow: 8px 8px 0 8px var(--bg); }
  .nav .mark::after { bottom: -22px; border-top-right-radius: 22px; box-shadow: 8px -8px 0 8px var(--bg); }
  .side-foot { position: relative; z-index: 1; margin-top: auto; padding: 0 22px; display: grid; gap: 8px; font-size: .82rem; color: var(--side-muted); }
  .side-foot b { color: var(--side-ink); font-size: 1.2rem; }
  main { min-width: 0; padding: 22px 30px 50px; overflow-x: clip; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .top .grow { flex: 1; min-width: 140px; }
  .top h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 0; color: var(--muted); }
  .acc-sw { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
  .acc-sw button { border: 0; background: none; padding: 7px 12px; border-radius: 10px; font-weight: 700; font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .acc-sw button i { width: 8px; height: 8px; border-radius: 50%; }
  .acc-sw button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 10px -4px rgba(0,0,0,.25); }
  .icon-btn { position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .2s, transform .12s; }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn .ic { width: 19px; height: 19px; }

const FMT = { money: (v) => money(v), short: (v) => moneyShort(v), num: (v) => num(Math.round(v)), pct: (v) => v.toFixed(1) + "%", int: (v) => num(Math.round(v)), usd2: (v) => money(v, { sym: "$", dp: 2 }) };


/* =====================================================================
   Tideway app: one freelancer, three accounts (everyday, business,
   joint), and a river that shows where each month's money flowed.
   ===================================================================== */
CUR.sym = "Rs"; CUR.dp = 0;
const KEY = "dk-tideway:v1";
const PAGES = [["river", "River", "wave"], ["accounts", "Accounts", "bank"], ["transactions", "Transactions", "list"], ["studio", "Studio", "briefcase"], ["joint", "Joint", "users"], ["plan", "Plan", "target"], ["settings", "Settings", "sliders"]];
const SUBS = { river: "Where this month's money came from and went", accounts: "Everyday, Business and Joint", transactions: "Every payment across all three", studio: "The business side: invoices and costs", joint: "Shared with Bilal, kept fair", plan: "Monthly limits and goals", settings: "Profile and data" };
const ACCTS = { every: ["Everyday", "var(--sea)"], biz: ["Business", "var(--accent)"], joint: ["Joint", "var(--plum)"] };
const OUTC = { biz: ["Studio costs", "Tax set-aside", "Software"], every: ["Food", "Transport", "Fun", "Health"], joint: ["Rent", "Groceries", "Bills"] };
const CCOL = { "Studio costs": "#c9711a", "Tax set-aside": "#b55a2a", Software: "#d99a4a", Food: "#3fa7b5", Transport: "#5fb9a8", Fun: "#7e9f5a", Health: "#4f8f9c", Rent: "#a0567f", Groceries: "#b8739a", Bills: "#865172", Kept: "#2f8f6b" };
const CLIENTS = ["Lumen Agency", "Kara Foods", "Northfield Co", "Rang Studio", "Pine Labs"];

function seed() {
  reseed(5150);
  const tx = [];
  const add = (d, acct, cat, amt, who, to) => tx.push({ id: uid(), date: iso(d), acct, cat, amt, who, to });
  for (let m = 0; m < 7; m++) {
    const y = TODAY.getFullYear(), mo = TODAY.getMonth() - 6 + m, day = (n) => { const d = new Date(y, mo, n); return d > TODAY ? null : d; };
    const D = (n) => day(Math.min(n, 28));
    for (let i = 0; i < randi(2, 3); i++) { const d = D(randi(1, 26)); if (d) add(d, "biz", "Client payment", Math.round(rand(70000, 190000) / 1000) * 1000, pick(CLIENTS)); }
    if (D(2)) add(D(2), "joint", "Partner share", 95000, "Bilal");
    if (D(14)) add(D(14), "every", "Other income", Math.round(rand(2000, 9000) / 100) * 100, pick(["Bank profit", "Refund", "Sold old camera"]));
    if (D(3)) add(D(3), "biz", "Owner pay", 160000, "Pay to me", "every");
    if (D(4)) add(D(4), "every", "Joint share", 95000, "To joint", "joint");
    if (D(5)) add(D(5), "joint", "Rent", 120000, "Landlord");
    [["biz", "Studio costs", 15000, 32000, "Co-working desk"], ["biz", "Tax set-aside", 22000, 34000, "Tax pot"], ["biz", "Software", 4000, 9000, "Design apps"], ["every", "Food", 14000, 26000, "Eating out and lunch"], ["every", "Transport", 6000, 12000, "Fuel and rides"], ["every", "Fun", 6000, 20000, "Weekends"], ["every", "Health", 2000, 8000, "Pharmacy and gym"], ["joint", "Groceries", 30000, 44000, "Weekly groceries"], ["joint", "Bills", 16000, 26000, "Power, gas, internet"]].forEach(([a, c, lo, hi, who]) => { const parts = randi(1, 3); for (let i = 0; i < parts; i++) { const d = D(randi(6, 27)); if (d) add(d, a, c, Math.round(rand(lo, hi) / parts / 50) * 50, who); } });
  }
  tx.sort((a, b) => (a.date < b.date ? 1 : -1));
  const inv = Array.from({ length: 10 }, (_, i) => { const issued = addDays(TODAY, -randi(1, 70)); const due = addDays(issued, 21); return { id: uid(), no: "TW-" + (210 + i), client: pick(CLIENTS), amt: Math.round(rand(40000, 180000) / 1000) * 1000, issued: iso(issued), due: iso(due), status: due < TODAY ? (R() < 0.6 ? "Paid" : "Overdue") : R() < 0.3 ? "Paid" : "Sent" }; });
  const limits = { Food: 24000, Transport: 10000, Fun: 14000, Health: 6000, Groceries: 40000, Bills: 24000, "Studio costs": 30000, Software: 8000 };
  const goals = [{ id: uid(), name: "Studio laptop", target: 420000, saved: 260000, acct: "biz" }, { id: uid(), name: "Hunza trip together", target: 300000, saved: 118000, acct: "joint" }, { id: uid(), name: "Emergency fund", target: 900000, saved: 610000, acct: "every" }];
  return { v: 1, start: { every: 85000, biz: 240000, joint: 60000 }, tx, inv, limits, goals, myShare: 50, notes: [{ id: uid(), text: "Rang Studio paid Rs 140,000 into Business", read: false }, { id: uid(), text: "Joint rent paid for this month", read: true }], profile: { name: "Sara Javed", partner: "Bilal" } };
}
let S = store.get(KEY, null);
if (!S || S.v !== 1 || !S.tx) S = seed();
const save = () => store.set(KEY, S);
let accF = "all";

/* ---------- Balances: start + money in − money out, with moves ---------- */
const isIn = (t) => ["Client payment", "Partner share", "Other income"].includes(t.cat);
const isMove = (t) => !!t.to;
function bal(a) { let v = S.start[a]; S.tx.forEach((t) => { if (t.acct === a) v += isIn(t) ? t.amt : -t.amt; if (t.to === a) v += t.amt; }); return v; }
const total = () => sum(Object.keys(ACCTS).map(bal));
const mk = (d) => { d = new Date(d); return d.getFullYear() * 12 + d.getMonth(); };
const NOWM = mk(TODAY);
const signed = (t, a) => (t.to === a ? t.amt : t.acct === a ? (isIn(t) ? t.amt : -t.amt) : 0);
const accDot = (a) => `<span class="acc"><i style="background:${ACCTS[a] ? ACCTS[a][1] : "var(--muted)"}"></i>${ACCTS[a] ? ACCTS[a][0] : esc(a)}</span>`;

/* ---------- Shell ---------- */
$("#nav").insertAdjacentHTML("beforeend", PAGES.map(([id, l, i]) => `<a href="#/${id}">${ic(i)}<span>${l}</span></a>`).join(""));
$("[data-menu]").innerHTML = ic("menu");
$("[data-cmdk]").innerHTML = ic("search");
$("#bell").innerHTML = ic("bell") + '<span class="badge" id="bellN"></span>';
$("[data-theme-toggle]").innerHTML = `<span class="t-sun">${ic("sun")}</span><span class="t-moon">${ic("moon")}</span>`;
function drawSw() { $("#accSw").innerHTML = [["all", "All", "var(--ink)"]].concat(Object.entries(ACCTS).map(([k, [n, c]]) => [k, n, c])).map(([k, n, c]) => `<button type="button" data-acc="${k}" aria-pressed="${k === accF}"><i style="background:${c}"></i>${n}</button>`).join(""); }
$("#accSw").addEventListener("click", (e) => { const b = e.target.closest("[data-acc]"); if (!b) return; accF = b.dataset.acc; drawSw(); render(current, true); toast(accF === "all" ? "Showing all accounts" : "Showing " + ACCTS[accF][0]); });
const drawSide = () => { $("#sideTot").textContent = money(total()); $("#sideMe").textContent = S.profile.name + " & " + S.profile.partner; };
const drawBell = () => ($("#bellN").textContent = S.notes.filter((n) => !n.read).length || "");
function note(text) { S.notes.unshift({ id: uid(), text, read: false }); S.notes = S.notes.slice(0, 12); drawBell(); }
$("#bell").addEventListener("click", (e) => {
  const draw = (p) => (p.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)"><b>Updates</b><button class="btn sm" data-all>Mark read</button></div><ul class="feed" style="padding:0 14px">${S.notes.map((n) => `<li style="opacity:${n.read ? 0.55 : 1}">${ic(n.read ? "check" : "wave")}<span class="grow">${esc(n.text)}</span></li>`).join("") || "<li>Calm waters.</li>"}</ul>`);
  popover(e.currentTarget, "", (p) => { draw(p); p.addEventListener("click", (ev) => { if (ev.target.closest("[data-all]")) { S.notes.forEach((n) => (n.read = true)); save(); drawBell(); draw(p); } }); });
});

/* ---------- Router ---------- */
const view = $("#view");
let current = "river";
const PAGE = {};
function render(name, keep) {
  current = name;
  const p = PAGES.find((x) => x[0] === name);

}

/* =====================================================================
   The river: a five-column flow (sources, business, everyday, joint,
   spending). Ribbon width = money. Built from the month's transactions.
   ===================================================================== */
function riverData(m) {
  const tx = S.tx.filter((t) => mk(t.date) === m), L = [], add = (s, t, v) => { if (v > 0) L.push({ s, t, v }); };
  const s = (f) => sum(tx.filter(f).map((t) => t.amt));
  add("Clients", "biz", s((t) => t.cat === "Client payment"));
  add(S.profile.partner, "joint", s((t) => t.cat === "Partner share"));
  add("Other", "every", s((t) => t.cat === "Other income"));
  add("biz", "every", s((t) => t.acct === "biz" && t.to === "every"));
  add("every", "joint", s((t) => t.acct === "every" && t.to === "joint"));
  Object.entries(OUTC).forEach(([a, cats]) => cats.forEach((c) => add(a, c, s((t) => t.acct === a && t.cat === c))));
  ["biz", "every", "joint"].forEach((a) => { const inn = sum(L.filter((l) => l.t === a).map((l) => l.v)), out = sum(L.filter((l) => l.s === a).map((l) => l.v)); if (inn > out) add(a, "Kept", inn - out); else if (out > inn) add("Savings", a, out - inn); });
  return L;
}
const COLS = { Clients: 0, Other: 0, Savings: 0, biz: 1, every: 2, joint: 3 };
const colOf = (n) => (n in COLS ? COLS[n] : n === S.profile.partner ? 0 : 4);
const nodeName = (n) => (ACCTS[n] ? ACCTS[n][0] : n);
const nodeCol = (n) => (ACCTS[n] ? ACCTS[n][1] : CCOL[n] || (n === S.profile.partner ? "var(--plum)" : n === "Clients" ? "var(--accent)" : "var(--teal)"));
function drawRiver(el, m, animate) {
  const links = riverData(m);
  if (!links.length) { el.innerHTML = '<div class="cc-empty">' + ic("wave") + "<b>No money moved this month yet</b></div>"; return; }
  const names = [...new Set(links.flatMap((l) => [l.s, l.t]))];
  const nodes = names.map((n) => ({ n, col: colOf(n), vin: sum(links.filter((l) => l.t === n).map((l) => l.v)), vout: sum(links.filter((l) => l.s === n).map((l) => l.v)) }));
  nodes.forEach((d) => (d.v = Math.max(d.vin, d.vout)));
  const W = 980, H = 430, top = 30, gap = 14, nw = 14, padR = 150, padL = 100;
  const cols = [0, 1, 2, 3, 4].map((c) => nodes.filter((d) => d.col === c));
  const k = Math.min(...cols.filter((c) => c.length).map((c) => (H - top - 10 - gap * (c.length - 1)) / Math.max(1, sum(c.map((d) => d.v)))));
  const cx = (c) => padL + (c * (W - padL - padR - nw)) / 4;
  cols.forEach((c) => { const h = sum(c.map((d) => d.v * k)) + gap * (c.length - 1); let y = top + (H - top - h) / 2; c.forEach((d) => { d.x = cx(d.col); d.y = y; d.h = Math.max(2, d.v * k); d.oy = 0; d.iy = 0; y += d.h + gap; }); });
  const N = (n) => nodes.find((d) => d.n === n);
  links.sort((a, b) => N(a.s).y - N(b.s).y || N(a.t).y - N(b.t).y);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money river for ${MON[m % 12]}">`;
  s += ["In", "Business", "Everyday", "Joint", "Out"].map((h, i) => `<text class="col-h" x="${cx(i) + nw / 2}" y="14" text-anchor="middle">${h}</text>`).join("");
  links.forEach((l, i) => {
    const a = N(l.s), b = N(l.t), w = Math.max(1.5, l.v * k);
    const y0 = a.y + a.oy + w / 2, y1 = b.y + b.iy + w / 2; a.oy += w; b.iy += w;
    const x0 = a.x + nw, x1 = b.x, mx = (x0 + x1) / 2;
    const d = `M${x0.toFixed(1)},${y0.toFixed(1)} C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
    l.d = d;
    s += `<path class="rib${animate ? " cc-draw" : ""}" data-l="${i}" pathLength="1" d="${d}" style="stroke:${nodeCol(l.s)};stroke-width:${w.toFixed(1)};animation-delay:${a.col * 180}ms"/>`;
  });
  if (!RM) s += links.map((l) => `<path class="flow" d="${l.d}" style="stroke-width:${Math.max(1.5, Math.min(4, l.v * k * 0.25)).toFixed(1)}"/>`).join("");
  nodes.forEach((d) => {
    const right = d.col === 4, left = d.col === 0;
    s += `<g class="node" data-n="${esc(d.n)}"><rect x="${d.x}" y="${d.y.toFixed(1)}" width="${nw}" height="${d.h.toFixed(1)}" style="fill:${nodeCol(d.n)}"/><text x="${right ? d.x + nw + 8 : left ? d.x - 8 : d.x + nw / 2}" y="${(right || left ? d.y + d.h / 2 - 2 : d.y - 18).toFixed(1)}" text-anchor="${right ? "start" : left ? "end" : "middle"}">${esc(nodeName(d.n))}</text><text class="v" x="${right ? d.x + nw + 8 : left ? d.x - 8 : d.x + nw / 2}" y="${(right || left ? d.y + d.h / 2 + 12 : d.y - 5).toFixed(1)}" text-anchor="${right ? "start" : left ? "end" : "middle"}">${moneyShort(d.v)}</text></g>`;
  });
  el.innerHTML = s + "</svg>";
  const svg = $("svg", el), ribs = $$(".rib", svg);
  svg.onpointermove = (e) => { const r = e.target.closest(".rib"); ribs.forEach((x) => x.classList.toggle("on", x === r)); if (r) { const l = links[+r.dataset.l]; tip.show(e, `<b>${esc(nodeName(l.s))} → ${esc(nodeName(l.t))}</b><div>${money(l.v)}</div>`); } else tip.hide(); };
  svg.onpointerleave = () => { ribs.forEach((x) => x.classList.remove("on")); tip.hide(); };
  /* click a node to light up only its flows; click again to clear */
  svg.onclick = (e) => { const g = e.target.closest(".node"); if (!g) return; const n = g.dataset.n, on = el.dataset.focus !== n; el.dataset.focus = on ? n : ""; el.classList.toggle("focus", on); ribs.forEach((x, i) => x.classList.toggle("on", on && (links[i].s === n || links[i].t === n))); if (on) toast(`${nodeName(n)}: ${money(nodes.find((d) => d.n === n).v)} this month`); };
}

/* ---------- River page ---------- */
let rM = NOWM - 1;
PAGE.river = () => {
  const L = riverData(rM), inn = sum(L.filter((l) => colOf(l.s) === 0 && l.s !== "Savings").map((l) => l.v)), out = sum(L.filter((l) => colOf(l.t) === 4 && l.t !== "Kept").map((l) => l.v)), kept = sum(L.filter((l) => l.t === "Kept").map((l) => l.v)) - sum(L.filter((l) => l.s === "Savings").map((l) => l.v));
  const months = Array.from({ length: 7 }, (_, i) => NOWM - 6 + i);
  view.innerHTML = `<div class="grid">
    <div class="card kpi band s4"><div class="lbl">${ic("in")}Came in · ${MON[rM % 12]}</div><div class="val" data-to="${inn}">${money(0)}</div><small>clients, ${esc(S.profile.partner)} and other</small></div>
    <div class="card kpi s4"><div class="lbl">${ic("out")}Spent</div><div class="val" data-to="${out}">${money(0)}</div><small class="muted">across all three accounts</small></div>
    <div class="card kpi saff s4"><div class="lbl">${ic("leaf")}Kept</div><div class="val" data-to="${kept}">${money(0)}</div><small>${inn ? Math.round((kept / inn) * 100) : 0}% of what came in</small></div>
    <section class="card s12"><div class="card-h"><h2>Money river</h2><small>hover a stream, click a block to follow it</small><span class="grow"></span><div class="mon-sw"><button class="icon-btn" id="mPrev" aria-label="Previous month" ${rM <= months[0] ? "disabled" : ""}>${ic("chevL")}</button><b>${MON[rM % 12]} ${Math.floor(rM / 12)}</b><button class="icon-btn" id="mNext" aria-label="Next month" ${rM >= NOWM ? "disabled" : ""}>${ic("chevR")}</button></div></div><div class="river-wrap"><div class="river" id="river"></div></div></section>
    <section class="card s8"><div class="card-h"><h2>Seven months of flow</h2></div><div id="flowBars"></div></section>
    <section class="card s4"><div class="card-h"><h2>Biggest streams</h2></div><ul class="feed">${L.filter((l) => colOf(l.t) === 4 && l.t !== "Kept").sort((a, b) => b.v - a.v).slice(0, 5).map((l) => `<li><span class="pill" style="background:${CCOL[l.t]};color:#fff">${esc(l.t)}</span><span class="grow muted">from ${nodeName(l.s)}</span><b class="amt">${money(l.v)}</b></li>`).join("")}</ul></section>
  </div>`;
  drawRiver($("#river"), rM, true);
  chart($("#river"), (again) => { if (again) drawRiver($("#river"), rM, false); });
  barChart($("#flowBars"), { labels: months.map((m) => MON[m % 12]), height: 230, series: [{ name: "Came in", data: months.map((m) => sum(riverData(m).filter((l) => colOf(l.s) === 0 && l.s !== "Savings").map((l) => l.v))), color: "var(--teal)" }, { name: "Spent", data: months.map((m) => sum(riverData(m).filter((l) => colOf(l.t) === 4 && l.t !== "Kept").map((l) => l.v))), color: "var(--accent)" }], tipFmt: (v) => money(v), radius: 6 });
  $("#mPrev").addEventListener("click", () => { rM = Math.max(months[0], rM - 1); render("river", true); });
  $("#mNext").addEventListener("click", () => { rM = Math.min(NOWM, rM + 1); render("river", true); });
};

/* ---------- Accounts ---------- */

    <div class="grid" style="margin-top:18px">

      <section class="card s4"><div class="card-h"><h2>${ACCTS[sel][0]}: recent</h2></div><ul class="feed">${S.tx.filter((t) => t.acct === sel || t.to === sel).slice(0, 6).map((t) => `<li><span class="grow"><b>${esc(t.who)}</b><br><small>${fdate(t.date)} · ${esc(t.cat)}</small></span><span class="amt ${signed(t, sel) > 0 ? "in" : ""}">${money(signed(t, sel), { plus: true })}</span></li>`).join("")}</ul></section>

}

/* ---------- Transactions ---------- */
function txForm(row) {
  const cats = ["Client payment", "Partner share", "Other income"].concat(...Object.values(OUTC));
  formModal({ title: row ? "Edit" : "Add transaction", drawer: true, values: row || { date: iso(TODAY), acct: accF === "all" ? "every" : accF, cat: "Food" }, fields: [{ name: "who", label: "Who or what", required: true }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1, half: true }, { name: "date", label: "Date", type: "date", required: true, half: true }, { name: "acct", label: "Account", type: "select", options: Object.entries(ACCTS).map(([k, [n]]) => [k, n]), half: true }, { name: "cat", label: "Category", type: "select", options: cats, half: true }], submit: row ? "Save" : "Add", onSubmit: (v) => { if (row) Object.assign(row, v); else S.tx.unshift({ id: uid(), ...v }); S.tx.sort((a, b) => (a.date < b.date ? 1 : -1)); save(); toast(row ? "Saved" : "Added"); rerender(); } });
}
PAGE.transactions = () => {
  view.innerHTML = `<div class="grid"><section class="card s12"><div class="card-h"><h2>Transactions</h2><small>${accF === "all" ? "all accounts" : ACCTS[accF][0]}</small><span class="grow"></span><button class="btn primary" id="addT">${ic("plus")}Add</button></div><div id="tTbl"></div></section></div>`;
  dataTable($("#tTbl"), {
    rows: () => S.tx.filter((t) => accF === "all" || t.acct === accF || t.to === accF).map((t) => ({ ...t, an: ACCTS[t.acct][0], kind: isMove(t) ? "Move" : isIn(t) ? "In" : "Out", val: accF === "all" ? (isMove(t) ? t.amt : isIn(t) ? t.amt : -t.amt) : signed(t, accF), _t: t })), sort: "date", size: 10, search: "Search…", keys: ["who", "cat", "an"],
    chips: { k: "kind", values: ["All", "In", "Out", "Move"] },
    cols: [{ k: "date", label: "Date", f: (v) => fdate(v) }, { k: "who", label: "Who / what", f: (v) => `<b>${esc(v)}</b>` }, { k: "cat", label: "Category", f: (v) => `<span class="pill">${esc(v)}</span>` }, { k: "an", label: "Account", f: (v, r) => accDot(r.acct) + (r.to ? " → " + accDot(r.to) : "") }, { k: "val", label: "Amount", cls: "r", f: (v, r) => `<span class="amt ${r.kind === "In" ? "in" : ""}">${r.kind === "Move" && accF === "all" ? money(v) : money(v, { plus: true })}</span>` }, { k: "x", label: "", sort: false, f: () => `<div class="rowbtns"><button data-act="edit" aria-label="Edit">${ic("edit")}</button><button data-act="del" aria-label="Delete">${ic("trash")}</button></div>` }],
    onAct: (a, r) => { if (a === "edit") { if (r._t.to) return toast("Moves can only be deleted, not edited", "warn"); txForm(r._t); } else confirmBox(`Delete "${r.who}" (${money(r.amt)})?`).then((ok) => { if (ok) { S.tx = S.tx.filter((t) => t !== r._t); save(); toast("Deleted"); rerender(); } }); },
    onRow: (r) => { if (!r._t.to) txForm(r._t); else toast("This is a move between your accounts"); },
  });
  $("#addT").addEventListener("click", () => txForm());
};

/* ---------- Studio ---------- */
PAGE.studio = () => {
  const months = Array.from({ length: 7 }, (_, i) => NOWM - 6 + i);
  const inc = months.map((m) => sum(S.tx.filter((t) => mk(t.date) === m && t.acct === "biz" && t.cat === "Client payment").map((t) => t.amt))), cost = months.map((m) => sum(S.tx.filter((t) => mk(t.date) === m && t.acct === "biz" && (t.cat === "Studio costs" || t.cat === "Software")).map((t) => t.amt)));
  view.innerHTML = `<div class="grid">
    <div class="card kpi saff s4"><div class="lbl">${ic("briefcase")}Business balance</div><div class="val" data-to="${bal("biz")}">${money(0)}</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("file")}Unpaid invoices</div><div class="val" data-to="${sum(S.inv.filter((i) => i.status !== "Paid").map((i) => i.amt))}">${money(0)}</div><small class="muted">${S.inv.filter((i) => i.status === "Overdue").length} overdue</small></div>
    <div class="card kpi s4"><div class="lbl">${ic("percent")}Tax set aside</div><div class="val" data-to="${sum(S.tx.filter((t) => t.cat === "Tax set-aside").map((t) => t.amt))}">${money(0)}</div><small class="muted">7 months</small></div>
    <section class="card s7"><div class="card-h"><h2>Profit</h2><small>client income minus studio costs</small></div><div id="profit"></div></section>
    <section class="card s5"><div class="card-h"><h2>Invoices</h2><span class="grow"></span><button class="btn primary" id="newInv">${ic("plus")}New</button></div><div id="invTbl"></div></section>
  </div>`;
  barChart($("#profit"), { labels: months.map((m) => MON[m % 12]), height: 240, series: [{ name: "Income", data: inc, color: "var(--accent)" }, { name: "Costs", data: cost, color: "var(--teal)" }, { name: "Profit", data: inc.map((v, i) => v - cost[i]), color: "var(--good)" }], tipFmt: (v) => money(v), radius: 5 });
  dataTable($("#invTbl"), { rows: () => S.inv, sort: "issued", size: 6, search: false, chips: { k: "status", values: ["All", "Sent", "Overdue", "Paid"] }, cols: [{ k: "no", label: "No." }, { k: "client", label: "Client" }, { k: "amt", label: "Amount", cls: "r", f: (v) => money(v) }, { k: "status", label: "Status", f: (v) => `<span class="pill" style="color:${v === "Paid" ? "var(--good)" : v === "Overdue" ? "var(--bad)" : "var(--teal)"}">${v}</span>` }], onRow: (i) => openModal({ title: i.no + " · " + i.client, drawer: true, html: `<div class="set-row"><span class="muted">Amount</span><b>${money(i.amt)}</b></div><div class="set-row"><span class="muted">Issued</span><b>${fdateY(i.issued)}</b></div><div class="set-row"><span class="muted">Due</span><b>${fdateY(i.due)}</b></div><div class="set-row"><span class="muted">Status</span><b>${i.status}</b></div>`, actions: i.status === "Paid" ? [{ label: "Close", kind: "primary" }] : [{ label: "Delete", fn: () => { setTimeout(() => confirmBox(`Delete ${i.no}?`).then((ok) => { if (ok) { S.inv = S.inv.filter((x) => x !== i); save(); toast("Invoice deleted"); rerender(); } }), 300); } }, { label: "Send reminder", fn: () => toast("Reminder sent to " + i.client) }, { label: "Mark paid", kind: "primary", fn: () => { i.status = "Paid"; S.tx.unshift({ id: uid(), date: iso(TODAY), acct: "biz", cat: "Client payment", amt: i.amt, who: i.client }); save(); note(`${i.client} paid ${i.no}: ${money(i.amt)}`); toast(money(i.amt) + " flowed into Business"); rerender(); } }] }), empty: "No invoices" });
  $("#newInv").addEventListener("click", () => formModal({ title: "New invoice", values: { client: CLIENTS[0], days: "21" }, fields: [{ name: "client", label: "Client", type: "select", options: CLIENTS }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1000, half: true }, { name: "days", label: "Due in", type: "select", options: [["14", "14 days"], ["21", "21 days"], ["30", "30 days"]], half: true }], submit: "Send invoice", onSubmit: (v) => { S.inv.unshift({ id: uid(), no: "TW-" + (210 + S.inv.length), client: v.client, amt: v.amt, issued: iso(TODAY), due: iso(addDays(TODAY, +v.days)), status: "Sent" }); save(); toast("Invoice sent to " + v.client); rerender(); } }));
};

/* ---------- Joint: fair shares and settle up ---------- */
PAGE.joint = () => {
  const m = NOWM - 1, jt = S.tx.filter((t) => mk(t.date) === m);
  const mine = sum(jt.filter((t) => t.to === "joint").map((t) => t.amt)), his = sum(jt.filter((t) => t.cat === "Partner share").map((t) => t.amt)), costs = sum(jt.filter((t) => t.acct === "joint" && !isIn(t) && !t.to).map((t) => t.amt));
  const fairMine = (costs * S.myShare) / 100, diff = Math.round(mine - fairMine);
  view.innerHTML = `<div class="grid">
    <div class="card kpi s4" style="border-color:var(--plum)"><div class="lbl">${ic("users")}Joint balance</div><div class="val" data-to="${bal("joint")}">${money(0)}</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("home")}Shared costs · ${MON[m % 12]}</div><div class="val" data-to="${costs}">${money(0)}</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("heart")}Put in together</div><div class="val" data-to="${mine + his}">${money(0)}</div></div>
    <section class="card s7"><div class="card-h"><h2>Who put in what</h2><small>${MON[m % 12]}</small></div>
      <div class="share"><div class="bar" aria-hidden="true"><i id="shMe" style="background:var(--sea)">You</i><i id="shHim" style="background:var(--plum)">${esc(S.profile.partner)}</i></div><div style="display:flex;justify-content:space-between"><span>You: <b>${money(mine)}</b></span><span>${esc(S.profile.partner)}: <b>${money(his)}</b></span></div>
      <div class="cc-field" style="margin-top:8px"><label for="fair">Your fair share of shared costs: <b id="fairO">${S.myShare}%</b></label><input id="fair" type="range" min="20" max="80" value="${S.myShare}" style="accent-color:var(--plum)"></div>
      <div class="settle" id="settle" aria-live="polite"></div></div></section>
    <section class="card s5"><div class="card-h"><h2>Shared bills</h2><span class="grow"></span><button class="btn" id="addJ">${ic("plus")}Add</button></div><div id="jDonut"></div></section>
  </div>`;
  const tot = mine + his || 1;
  requestAnimationFrame(() => { $("#shMe").style.flexBasis = (mine / tot) * 100 + "%"; $("#shHim").style.flexBasis = (his / tot) * 100 + "%"; });
  const drawSettle = () => { const fm = (costs * S.myShare) / 100, d = Math.round(mine - fm); $("#fairO").textContent = S.myShare + "%"; $("#settle").innerHTML = Math.abs(d) < 500 ? `${ic("check")}<span>All square for ${MON[m % 12]}. Nicely done.</span>` : `<span>${d > 0 ? esc(S.profile.partner) + " owes you" : "You owe " + esc(S.profile.partner)}</span><b>${money(Math.abs(d))}</b><span class="grow" style="flex:1"></span><button class="btn primary" id="settleBtn">Settle up</button>`; const sb = $("#settleBtn"); if (sb) sb.addEventListener("click", () => confirmBox(`Record a ${money(Math.abs(d))} payment ${d > 0 ? "from " + S.profile.partner + " to you" : "from you to " + S.profile.partner}?`, "Settle", "primary").then((ok) => { if (ok) { S.tx.unshift({ id: uid(), date: iso(TODAY), acct: "every", cat: d > 0 ? "Other income" : "Fun", amt: Math.abs(d), who: d > 0 ? S.profile.partner + " settled up" : "Settled with " + S.profile.partner }); save(); note("Settled up with " + S.profile.partner); toast("Settled. Fair and square."); } })); };
  drawSettle();
  $("#fair").addEventListener("input", (e) => { S.myShare = +e.target.value; save(); drawSettle(); });
  donut($("#jDonut"), { items: OUTC.joint.map((c) => ({ label: c, value: sum(jt.filter((t) => t.acct === "joint" && t.cat === c).map((t) => t.amt)), color: CCOL[c] })), size: 160, center: [moneyShort(costs), MON[m % 12]], fmt: (v) => money(v) });
  $("#addJ").addEventListener("click", () => { accF = "joint"; drawSw(); txForm(); });
  void diff;
};

/* ---------- Plan: limits + goals ---------- */
PAGE.plan = () => {
  const m = NOWM, sp = (c) => sum(S.tx.filter((t) => mk(t.date) === m && t.cat === c && !t.to).map((t) => t.amt));
  view.innerHTML = `<div class="grid">
    <section class="card s7"><div class="card-h"><h2>This month's limits</h2><span class="grow"></span><button class="btn" id="editL">${ic("edit")}Edit</button></div><div style="display:grid;gap:14px">${Object.entries(S.limits).map(([c, l]) => { const v = sp(c), p = (v / l) * 100; return `<div><div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${CCOL[c]};margin-right:6px"></i>${c}</span><span class="${p > 100 ? "" : "muted"}" style="${p > 100 ? "color:var(--bad);font-weight:700" : ""}">${money(v)} / ${money(l)}</span></div><div class="pbar"><i data-w="${clamp(p, 0, 100)}" style="background:${p > 100 ? "var(--bad)" : CCOL[c]}"></i></div></div>`; }).join("")}</div></section>
    <section class="card s5"><div class="card-h"><h2>Goals</h2><span class="grow"></span><button class="btn primary" id="newG">${ic("plus")}New</button></div><ul class="feed">${S.goals.map((g) => `<li data-goal="${g.id}"><span class="grow"><b>${esc(g.name)}</b><br><small>${accDot(g.acct)} · ${money(g.saved)} of ${money(g.target)}</small><div class="pbar" style="margin-top:6px"><i data-w="${clamp((g.saved / g.target) * 100, 0, 100)}" style="background:${ACCTS[g.acct][1]}"></i></div></span><div class="rowbtns"><button data-g="add" aria-label="Add to ${esc(g.name)}">${ic("plus")}</button><button data-g="del" aria-label="Delete ${esc(g.name)}">${ic("trash")}</button></div></li>`).join("")}</ul></section>
  </div>`;
  requestAnimationFrame(() => $$("[data-w]", view).forEach((i) => (i.style.width = i.dataset.w + "%")));
  $("#editL").addEventListener("click", () => formModal({ title: "Monthly limits", values: S.limits, fields: Object.keys(S.limits).map((c) => ({ name: c, label: c + " (Rs)", type: "number", required: true, min: 0, half: true })), onSubmit: (v) => { S.limits = v; save(); toast("Limits saved"); rerender(); } }));
  $("#newG").addEventListener("click", () => formModal({ title: "New goal", values: { acct: "every" }, fields: [{ name: "name", label: "Goal", required: true }, { name: "target", label: "Target (Rs)", type: "number", required: true, min: 1000, half: true }, { name: "acct", label: "Saved in", type: "select", options: Object.entries(ACCTS).map(([k, [n]]) => [k, n]), half: true }], onSubmit: (v) => { S.goals.push({ id: uid(), saved: 0, ...v }); save(); toast("Goal added"); rerender(); } }));
  view.querySelector(".feed").addEventListener("click", (e) => { const b = e.target.closest("[data-g]"); if (!b) return; const g = S.goals.find((x) => x.id === b.closest("[data-goal]").dataset.goal); if (b.dataset.g === "add") formModal({ title: "Add to " + g.name, fields: [{ name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1 }], onSubmit: (v) => { g.saved += v.amt; save(); toast(g.saved >= g.target ? "Goal reached!" : Math.round((g.saved / g.target) * 100) + "% there"); rerender(); } }); else confirmBox(`Delete the goal "${g.name}"?`).then((ok) => { if (ok) { S.goals = S.goals.filter((x) => x !== g); save(); toast("Goal deleted"); rerender(); } }); });
};

/* ---------- Settings ---------- */
PAGE.settings = () => {
  view.innerHTML = `<div class="grid"><section class="card s12">
    <div class="set-row"><div><b>Profile</b><small>${esc(S.profile.name)}, sharing the joint account with ${esc(S.profile.partner)}</small></div><button class="btn" id="prof">${ic("user")}Edit</button></div>
    <div class="set-row"><div><b>Starting balances</b><small>${Object.entries(ACCTS).map(([k, [n]]) => n + " " + money(S.start[k])).join(" · ")}</small></div><button class="btn" id="startB">${ic("edit")}Edit</button></div>
    <div class="set-row"><div><b>Theme</b><small>Sand and saffron, or teal night</small></div><button class="btn" data-theme-toggle>${ic("moon")}Toggle theme</button></div>
    <div class="set-row"><div><b>Reset demo data</b><small>Seven months of transactions, invoices and goals</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div></section></div>`;
  $("#prof").addEventListener("click", () => formModal({ title: "Profile", values: S.profile, fields: [{ name: "name", label: "Your name", required: true }, { name: "partner", label: "Partner on the joint account", required: true }], onSubmit: (v) => { S.profile = v; save(); toast("Saved"); rerender(); } }));
  $("#startB").addEventListener("click", () => formModal({ title: "Starting balances", values: S.start, fields: Object.entries(ACCTS).map(([k, [n]]) => ({ name: k, label: n + " (Rs)", type: "number", required: true, min: 0 })), onSubmit: (v) => { S.start = v; save(); toast("Saved"); rerender(); } }));
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data?", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); accF = "all"; drawSw(); save(); drawBell(); toast("Demo data reset"); rerender(); } }));
};

/* ---------- Start ---------- */
drawSw();
drawBell();
initShell(() => pageCmds(PAGES, [{ label: "Move money", icon: "swap", run: moveForm }, { label: "Add transaction", icon: "plus", run: () => txForm() }].concat(Object.entries(ACCTS).map(([k, [n]]) => ({ label: "Show only " + n, icon: "filter", run: () => { accF = k; drawSw(); render(current, true); } })))));
startRouter(PAGES.map((p) => p[0]), "river", render);
</script>
</body>
</html>
