<!doctype html>
<!-- Chill & Craft · Seedling · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seedling · upload button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --bg1: #f4f8ec;
    --bg2: #d9e8c8;
    --sky1: #cdeeff;
    --sky2: #fff5df;
    --sun: #ffc93c;
    --hill: #b9dc9c;
    --hill2: #9ccc7e;
    --cloud: #ffffff;
    --pot1: #d9774a;
    --pot2: #a9502a;
    --soil: #5a3824;
    --stem: #3d8c3f;
    --leaf1: #6cc04a;
    --leaf2: #3e9440;
    --wood: #e8c48d;
    --ink: #243b22;
    --soft: #56704f;
    --btn1: #3f9a4a;
    --btn2: #2c7a37;
    --track: #cfe3c0;
    --focus: #e0592a;
    --star: 0;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #13241b;
      --bg2: #060d09;
      --sky1: #0c1830;
      --sky2: #1f3440;
      --sun: #f3ecd0;
      --hill: #1d3a29;
      --hill2: #17301f;
      --cloud: #3b4d63;
      --pot1: #c0673d;
      --pot2: #8a4022;
      --soil: #3a2416;
      --stem: #58b85e;
      --leaf1: #6fd25a;
      --leaf2: #3f9e48;
      --wood: #c9a46c;
      --ink: #e3f2da;
      --soft: #a1bd98;
      --btn1: #48ad55;
      --btn2: #2e823a;
      --track: #22402c;
      --focus: #ffb27a;
      --star: 1;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #13241b;
    --bg2: #060d09;
    --sky1: #0c1830;
    --sky2: #1f3440;
    --sun: #f3ecd0;
    --hill: #1d3a29;
    --hill2: #17301f;
    --cloud: #3b4d63;
    --pot1: #c0673d;
    --pot2: #8a4022;
    --soil: #3a2416;
    --stem: #58b85e;
    --leaf1: #6fd25a;
    --leaf2: #3f9e48;
    --wood: #c9a46c;
    --ink: #e3f2da;
    --soft: #a1bd98;
    --btn1: #48ad55;
    --btn2: #2e823a;
    --track: #22402c;
    --focus: #ffb27a;
    --star: 1;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body, .stage { grid-template-columns: minmax(0, 1fr); } /* fixed-width cards never widen the page */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 10%, var(--bg1), var(--bg2) 90%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; padding: 24px 16px; }

  /* ---------- The garden card (also the drop target) ---------- */
  .garden {
    position: relative;
    width: 360px;
    max-width: 100%;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 28px 50px -30px rgba(20, 50, 20, .8), inset 0 0 0 1px rgba(255, 255, 255, .25);
    transition: transform .5s var(--spring), box-shadow .3s;
  }
  .garden[data-drag="on"] { transform: scale(1.02); box-shadow: 0 0 0 3px var(--btn1), 0 28px 50px -30px rgba(20, 50, 20, .8); }
  .garden svg.scene { display: block; width: 100%; height: auto; }
  .s1 { stop-color: var(--sky1); }
  .s2 { stop-color: var(--sky2); }
  .sun { fill: var(--sun); }
  .rays { stroke: var(--sun); stroke-width: 3; stroke-linecap: round; opacity: calc(1 - var(--star)); transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
  .stars circle { fill: #fff; opacity: calc(var(--star) * .8); animation: twinkle 2.6s ease-in-out infinite; }
  .stars circle:nth-child(2n) { animation-delay: -1.3s; }
  .stars circle:nth-child(3n) { animation-delay: -.6s; }
  .cloud { fill: var(--cloud); }
  .drift { animation: drift 16s ease-in-out infinite alternate; }
  .drift.b { animation-duration: 21s; animation-direction: alternate-reverse; }
  .hill { fill: var(--hill); }
  .hill2 { fill: var(--hill2); }
  .pot { fill: var(--pot1); }
  .rim { fill: var(--pot2); }
  .soil { fill: var(--soil); }
  .stem { fill: none; stroke: var(--stem); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .35s linear; }
  .stem.back { transition: stroke-dashoffset .8s cubic-bezier(.6, 0, .4, 1); }
  .leaf .sway { animation: sway 3.4s ease-in-out infinite; transform-origin: 0 0; }
  .leaf path { fill: var(--leaf1); stroke: var(--leaf2); stroke-width: 1.5; transform: scale(0); transform-origin: 0 0; transition: transform .8s var(--spring); }
  .leaf.on path { transform: scale(1); }
  .leaf .vein { fill: none; stroke: var(--leaf2); stroke-width: 1.2; transform: none; opacity: 0; transition: opacity .4s .3s; }
  .leaf.on .vein { opacity: 1; }
  .sprout path { fill: var(--leaf1); stroke: var(--leaf2); stroke-width: 1.2; }
  .sprout .sway { animation: sway 2.6s ease-in-out infinite; transform-origin: 0 0; }
  .sprout .sway.b { animation-delay: -1.3s; }
  .petal { fill: var(--petal, #f472b6); stroke: rgba(0, 0, 0, .12); stroke-width: 1; transform: scale(0) rotate(-30deg); transform-origin: 0 0; transition: transform .7s var(--spring); transition-delay: calc(var(--i) * 70ms); }
  .flower.bloom .petal { transform: scale(1) rotate(0); }
  .heart { fill: #ffd23f; stroke: #e0a100; stroke-width: 1.5; transform: scale(0); transform-origin: 0 0; transition: transform .6s var(--spring) .35s; }
  .flower.bloom .heart { transform: scale(1); }
  .bud { fill: var(--leaf2); transform: scale(0); transform-origin: 0 6px; transition: transform .6s var(--spring); }
  .flower.budding .bud { transform: scale(1); }
  .rain line { stroke: #5fb0f2; stroke-width: 2.6; stroke-linecap: round; opacity: 0; }
  .raincloud { opacity: 0; transform: translateX(-120px); transition: transform .9s var(--spring), opacity .5s; }
  .raining .raincloud { opacity: 1; transform: translateX(0); }
  .raining .rain line { animation: rain 1s linear infinite; animation-delay: var(--d); }
  .stake { opacity: 0; transform: translateY(18px); transition: transform .6s var(--spring), opacity .3s; }
  .stake.on { opacity: 1; transform: none; }
  .stake rect { fill: var(--wood); stroke: rgba(80, 50, 10, .45); stroke-width: 1; }
  .stake text { fill: #4b3212; font-size: 9.5px; font-weight: 700; font-family: inherit; }
  .seed { opacity: 0; }
  .seed ellipse { fill: #8a5a2b; stroke: #5d3a17; stroke-width: 1.2; }
  .seed text { fill: #fff3dd; font-size: 7.5px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; font-family: inherit; letter-spacing: .04em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes twinkle { 50% { opacity: calc(var(--star) * .2); } }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(18px); } }
  @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  @keyframes rain { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(120px); } }

  .fx { position: absolute; inset: 0; pointer-events: none; }
  .bit { position: absolute; width: 6px; height: 6px; border-radius: 50%; }
  .drop-tip { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 20px; background: var(--btn1); color: #fff; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .garden[data-drag="on"] .drop-tip { opacity: 1; }

  /* ---------- Upload button with a growing fill ---------- */
  .plant {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 360px;
    max-width: 100%;
    height: 58px;
    border: 0;
    border-radius: 30px;
    overflow: hidden;
    isolation: isolate;
    background: linear-gradient(180deg, var(--btn1), var(--btn2));
    color: #fff;
    font: inherit;
    font-size: 16.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 14px 26px -16px rgba(30, 90, 40, .9), inset 0 1px 0 rgba(255, 255, 255, .3);
    transition: transform .45s var(--spring);
  }
  .plant:hover { transform: translateY(-2px); }
  .plant:active { transform: scale(.97); transition-duration: .1s; }
  .plant:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .plant[aria-disabled="true"] { cursor: progress; }
  .plant .fill { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #2f7d36, #42a04b); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .3s linear; }
  .plant[data-state="working"] { background: linear-gradient(180deg, #1d4d25, #153a1c); }
  .plant svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .plant .tick { display: none; }
  .plant[data-state="done"] .seedico { display: none; }
  .plant[data-state="done"] .tick { display: inline; }
  .plant .label { font-variant-numeric: tabular-nums; }

  .note { margin: 0; max-width: 360px; font-size: 13.5px; line-height: 1.5; text-align: center; color: var(--soft); min-height: 41px; }
  .note b { color: var(--ink); font-weight: 650; }
  .link { padding: 0; border: 0; background: none; color: var(--btn2); font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  :root[data-theme="dark"] .link { color: var(--leaf1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color: var(--leaf1); } }
  .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="garden" id="garden">
    <svg class="scene" id="scene" viewBox="0 0 340 290" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="s1" offset="0" /><stop class="s2" offset="1" /></linearGradient>
      </defs>
      <rect width="340" height="290" fill="url(#sky)" />
      <g class="stars"><circle cx="40" cy="38" r="1.6" /><circle cx="96" cy="22" r="1.2" /><circle cx="214" cy="30" r="1.4" /><circle cx="150" cy="56" r="1" /><circle cx="252" cy="96" r="1.2" /><circle cx="30" cy="110" r="1.1" /></g>
      <g transform="translate(284 54)">
        <g class="rays"><path d="M0 -36V-29M0 29V36M-36 0H-29M29 0H36M-25 -25L-20 -20M20 20L25 25M25 -25L20 -20M-20 20L-25 25" /></g>
        <circle class="sun" r="21" />
      </g>
      <g class="drift"><path class="cloud" d="M40 86h56a14 14 0 0 0-6-27 18 18 0 0 0-33-6 13 13 0 0 0-17 33z" opacity=".9" /></g>
      <g class="drift b"><path class="cloud" d="M230 140h44a11 11 0 0 0-5-21 14 14 0 0 0-26-5 10 10 0 0 0-13 26z" opacity=".75" /></g>
      <path class="hill2" d="M0 236 Q90 206 180 232 T340 222 V290 H0Z" />
      <path class="hill" d="M0 256 Q110 232 210 252 T340 246 V290 H0Z" />

      <!-- rain cloud that waters the plant while the file uploads -->
      <g id="weather" transform="translate(0 18)">
        <g class="raincloud">
          <path class="cloud" d="M128 52h86a20 20 0 0 0-8-38 25 25 0 0 0-46-7 18 18 0 0 0-32 45z" />
          <g class="rain">
            <line x1="146" y1="58" x2="143" y2="68" style="--d:0s" />
            <line x1="164" y1="58" x2="161" y2="68" style="--d:.35s" />
            <line x1="182" y1="58" x2="179" y2="68" style="--d:.7s" />
            <line x1="200" y1="58" x2="197" y2="68" style="--d:.2s" />
            <line x1="155" y1="58" x2="152" y2="68" style="--d:.55s" />
            <line x1="191" y1="58" x2="188" y2="68" style="--d:.85s" />
            <line x1="137" y1="58" x2="134" y2="68" style="--d:.45s" />
            <line x1="173" y1="58" x2="170" y2="68" style="--d:.1s" />
            <line x1="208" y1="58" x2="205" y2="68" style="--d:.6s" />
          </g>
        </g>
      </g>

      <!-- plant: stem, leaves, bud and flower -->
      <path class="stem" id="stem" pathLength="1" d="M170 206 C158 178, 184 158, 170 132 S162 100, 170 84" />
      <g id="leaves"></g>
      <g class="sprout" transform="translate(170 205)">
        <g transform="rotate(-150)"><g class="sway"><path d="M0 0C5-7 15-7 19 0C15 5 5 5 0 0Z" /></g></g>
        <g transform="rotate(-30)"><g class="sway b"><path d="M0 0C5-7 15-7 19 0C15 5 5 5 0 0Z" /></g></g>
      </g>
      <g class="flower" id="flower" transform="translate(170 80)">
        <ellipse class="bud" cx="0" cy="0" rx="7" ry="10" />
        <g id="petals"></g>
        <circle class="heart" r="9" />
      </g>

      <!-- the seed that drops in -->
      <g class="seed" id="seed"><ellipse rx="15" ry="10" /><text id="seedTxt" y="0.5">FILE</text></g>

      <!-- pot -->
      <path class="pot" d="M134 216 H206 L196 274 Q195 280 189 280 H151 Q145 280 144 274Z" />
      <path d="M140 230 H200" stroke="rgba(255,255,255,.18)" stroke-width="3" />
      <rect class="rim" x="126" y="203" width="88" height="16" rx="5" />
      <ellipse class="soil" cx="170" cy="206" rx="37" ry="5" />

      <!-- wooden plant marker with the file name -->
      <g class="stake" id="stake">
        <rect x="206" y="176" width="4" height="34" rx="1" />
        <g transform="rotate(-5 236 168)"><rect x="200" y="157" width="78" height="22" rx="4" /><text id="stakeTxt" x="239" y="171.5" text-anchor="middle">file</text></g>
      </g>
    </svg>
    <div class="fx" id="fx"></div>
    <span class="drop-tip">Drop to plant it</span>
  </div>

  <button class="plant" id="plant" type="button" data-state="idle" aria-describedby="note">
    <span class="fill"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><g class="seedico"><path d="M12 20v-7" /><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z" /><path d="M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5z" /></g><path class="tick" d="M5 12.5l4.5 4.5L19 7.5" /></svg>
    <span class="label" id="label">Plant a file</span>
  </button>
  <p class="note" id="note">Any file up to 50 MB. Drop it on the pot or <button class="link" type="button" id="sample">plant a sample</button>.</p>
  <input type="file" id="picker" hidden>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Seedling upload button ----------
  const $ = (s) => document.querySelector(s);
  const garden = $("#garden"), scene = $("#scene"), plantBtn = $("#plant"), label = $("#label"), note = $("#note");
  const picker = $("#picker"), statusEl = $("#status"), fx = $("#fx");
  const stem = $("#stem"), flower = $("#flower"), seed = $("#seed"), seedTxt = $("#seedTxt"), stake = $("#stake"), stakeTxt = $("#stakeTxt");
  const NS = "http://www.w3.org/2000/svg";
  const MB = 1024 * 1024, MAX = 50 * MB;
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const NOTE = note.innerHTML;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;

  // ---------- Run control ----------
  const STOP = new Error("stopped");
  let runId = 0, state = "idle";
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === runId ? res() : rej(STOP)), ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const setState = (s) => { state = s; plantBtn.dataset.state = s; plantBtn.setAttribute("aria-disabled", s === "idle" ? "false" : "true"); };
  const size = (b) => (b >= MB ? (b / MB).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB");

  // ---------- Leaves along the stem, petals round the flower ----------
  const LEAF = "M0 0C9-12 30-13 42 0C30 10 9 10 0 0Z";
  const leaves = [.22, .4, .58, .74].map((at, i) => {
    const pt = stem.getPointAtLength(stem.getTotalLength() * at);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "leaf");
    const right = i % 2 === 0;
    g.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${right ? -28 + i * 4 : 208 - i * 4})`);
    g.innerHTML = `<g class="sway" style="animation-delay:${-i * .7}s"><path d="${LEAF}" /><path class="vein" d="M4 0 Q20 -2 34 0" /></g>`;
    $("#leaves").appendChild(g);
    return { at, g };
  });
  for (let i = 0; i < 6; i++) {
    const p = document.createElementNS(NS, "g");
    p.setAttribute("transform", `rotate(${i * 60})`);
    p.innerHTML = `<ellipse class="petal" style="--i:${i}" cx="0" cy="-15" rx="9" ry="15" />`;
    $("#petals").appendChild(p);
  }

  // ---------- Read the real file: size, name and the true type from its first bytes ----------
  async function sniff(file) {
    let kind = (file.name.split(".").pop() || "file").slice(0, 4).toUpperCase();
    if (file.slice && file.size) {
      try {
        const b = new Uint8Array(await file.slice(0, 12).arrayBuffer());
        const hex = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
        const txt = String.fromCharCode(...b);
        if (txt.startsWith("%PDF")) kind = "PDF";
        else if (hex.startsWith("89504e47")) kind = "PNG";
        else if (hex.startsWith("ffd8ff")) kind = "JPG";
        else if (txt.startsWith("GIF8")) kind = "GIF";
        else if (txt.startsWith("RIFF") && txt.slice(8, 12) === "WEBP") kind = "WEBP";
        else if (hex.startsWith("504b0304")) kind = /docx|xlsx|pptx/i.test(file.name) ? kind : "ZIP";
        else if (txt.startsWith("ID3") || hex.startsWith("fffb")) kind = "MP3";
      } catch (e) { /* keep the extension */ }
    }
    const colors = { PDF: "#fb7185", PNG: "#f472b6", JPG: "#f472b6", JPEG: "#f472b6", GIF: "#f472b6", WEBP: "#f472b6", ZIP: "#fbbf24", MP3: "#a78bfa", MP4: "#a78bfa", DOCX: "#60a5fa", TXT: "#60a5fa", CSV: "#60a5fa", XLSX: "#34d399" };
    return { kind, color: colors[kind] || "#f59e0b" };
  }

  // Soil or pollen bits thrown from a point in the scene (scene units 340 x 290)
  function burst(x, y, n, colors, up) {
    if (calm()) return;
    const k = garden.clientWidth / 340;
    for (let i = 0; i < n; i++) {
      const b = document.createElement("i");
      b.className = "bit";
      b.style.left = x * k + "px";
      b.style.top = y * k + "px";
      b.style.background = colors[i % colors.length];
      fx.appendChild(b);
      const a = up ? -Math.PI / 2 + (Math.random() - .5) * 2.2 : -Math.PI * (.1 + .8 * Math.random());
      const d = (up ? 40 : 26) + Math.random() * 40;
      b.animate([
        { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + (up ? -20 : 0)}px) scale(${up ? .9 : .7})`, opacity: up ? .9 : 1, offset: .6 },
        { transform: `translate(${Math.cos(a) * d * 1.2}px, ${Math.sin(a) * d * (up ? 1.4 : .2) + (up ? -10 : 24)}px) scale(.3)`, opacity: 0 }
      ], { duration: up ? 1500 + Math.random() * 600 : 700, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => b.remove();
    }
  }

  async function swap(text) {
    if (label.textContent === text) return;
    await play(label, [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-8px)", opacity: 0 }], { duration: 120, easing: "ease-in" });
    label.textContent = text;
    play(label, [{ transform: "translateY(8px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 380, easing: SPRING });
  }
  const setGrowth = (p) => { stem.style.strokeDashoffset = (1 - p).toFixed(3); plantBtn.style.setProperty("--p", p.toFixed(3)); };

  // ---------- The planting sequence ----------
  async function grow(file, id) {
    setState("working");
    const info = await sniff(file);
    if (id !== runId) throw STOP;
    seedTxt.textContent = info.kind;
    scene.style.setProperty("--petal", info.color);

    // Too big or empty: the seed bounces off the rim and rolls away
    if (!file.size || file.size > MAX) {
      const why = !file.size ? "That file is empty." : "That file is " + size(file.size) + "; this pot takes up to 50 MB.";
      seed.style.opacity = 1;
      await play(seed, [
        { transform: "translate(170px,-20px)" },
        { transform: "translate(170px,196px) scale(1.1,.85)", offset: .45, easing: "ease-out" },
        { transform: "translate(230px,140px) rotate(120deg)", offset: .7 },
        { transform: "translate(380px,240px) rotate(260deg)" }
      ], { duration: 1300, easing: "ease-in" });
      seed.style.opacity = 0;
      note.textContent = why;
      statusEl.textContent = why;
      await sleep(2600, id);
      note.innerHTML = NOTE; wireSample();
      setState("idle");
      return;
    }

    // 1. Anticipation: the pot braces, the seed drops in and the soil puffs
    stakeTxt.textContent = file.name.length > 14 ? file.name.slice(0, 12) + "…" : file.name;
    swap("Planting…");
    note.innerHTML = "<b></b>";
    note.firstChild.textContent = file.name;
    note.append(" · " + size(file.size));
    statusEl.textContent = "Uploading " + file.name + ".";
    seed.style.opacity = 1;
    if (calm()) seed.setAttribute("transform", "translate(170 200)");
    await play(seed, [
      { transform: "translate(170px,-24px) rotate(-30deg)" },
      { transform: "translate(170px,196px) rotate(8deg)", offset: .7, easing: "cubic-bezier(.5,0,.9,.5)" },
      { transform: "translate(170px,199px) scale(1.25,.7)", offset: .82 },
      { transform: "translate(170px,206px) scale(.5)", opacity: 0 }
    ], { duration: 900, easing: "linear", fill: "forwards" });
    seed.style.opacity = 0;
    burst(170, 204, 10, ["#6b4428", "#8a5a33", "#4a2e1b"], false);
    play(garden.querySelector(".pot"), [{ transform: "none" }, { transform: "translateY(2px)" }, { transform: "none" }], { duration: 300 });
    stake.classList.add("on");

    // 2. Rain while the bytes go up; the stem and leaves grow with the progress
    $("#weather").classList.add("raining");
    const ms = Math.max(2600, Math.min(7000, file.size / (1.4 * MB) * 1000));
    const t0 = performance.now();
    let p = 0;
    while (p < 1) {
      p = Math.min(1, (performance.now() - t0) / ms * (.85 + Math.random() * .3));
      setGrowth(p);
      leaves.forEach((l) => l.g.classList.toggle("on", p >= l.at));
      if (p > .86) flower.classList.add("budding");
      label.textContent = "Growing… " + Math.round(p * 100) + "%";
      await sleep(110, id);
    }
    setGrowth(1);
    $("#weather").classList.remove("raining");
    await sleep(350, id);

    // 3. Finish: the flower blooms, pollen drifts up, the pot hops
    setState("done");
    flower.classList.add("bloom");
    burst(170, 80, 14, ["#ffe066", "#fff3b0", info.color, "#ffffff"], true);
    play(garden.querySelector(".pot"), [{ transform: "none" }, { transform: "translateY(-5px)" }, { transform: "none" }], { duration: 500, easing: SPRING });
    swap("Uploaded · in bloom");
    statusEl.textContent = "Upload complete. " + file.name + ", " + size(file.size) + ".";
    await sleep(2600, id);

    // 4. Reset: petals close, leaves fold and the stem sinks back into the soil
    await wither(id);
  }

  async function wither(id) {
    setState("resetting");
    flower.classList.remove("bloom");
    await sleep(calm() ? 50 : 450, id);
    flower.classList.remove("budding");
    leaves.slice().reverse().forEach((l, i) => setTimeout(() => l.g.classList.remove("on"), calm() ? 0 : i * 90));
    stake.classList.remove("on");
    stem.classList.add("back");
    setGrowth(0);
    swap("Plant a file");
    await sleep(calm() ? 50 : 900, id);
    stem.classList.remove("back");
    note.innerHTML = NOTE; wireSample();
    picker.value = "";
    setState("idle");
  }

  function hardReset() {
    seed.getAnimations().forEach((a) => a.cancel());
    seed.style.opacity = 0;
    flower.classList.remove("bloom", "budding");
    leaves.forEach((l) => l.g.classList.remove("on"));
    stake.classList.remove("on");
    $("#weather").classList.remove("raining");
    setGrowth(0);
    label.textContent = "Plant a file";
    note.innerHTML = NOTE; wireSample();
    setState("idle");
  }

  async function start(file, fromUser) {
    if (state !== "idle") return;
    const id = ++runId;
    try {
      await grow(file, id);
      if (!fromUser) scheduleDemo(2400);
    } catch (e) { if (e !== STOP) throw e; }
  }

  // ---------- Inputs: button, picker, sample and drag and drop ----------
  const SAMPLES = [
    { name: "Mehndi-invite.png", size: 2.4 * MB, type: "image/png" },
    { name: "Karachi-menu.pdf", size: 3.6 * MB, type: "application/pdf" }
  ];
  let sampleIx = 0;
  const nextSample = () => SAMPLES[sampleIx++ % SAMPLES.length];
  function wireSample() { const b = $("#sample"); if (b) b.addEventListener("click", () => start(nextSample(), true)); }
  wireSample();
  plantBtn.addEventListener("click", () => { if (state === "idle") picker.click(); });
  picker.addEventListener("change", () => { if (picker.files[0]) start(picker.files[0], true); });
  garden.addEventListener("dragover", (e) => { e.preventDefault(); if (state === "idle") garden.dataset.drag = "on"; });
  garden.addEventListener("dragleave", () => garden.removeAttribute("data-drag"));
  garden.addEventListener("drop", (e) => {
    e.preventDefault();
    garden.removeAttribute("data-drag");
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) start(f, true);
  });
  ["dragover", "drop"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));

  // ---------- Auto demo until the visitor takes over ----------
  let demoOn = true, demoTimer = 0;
  function scheduleDemo(ms) {
    clearTimeout(demoTimer);
    if (demoOn) demoTimer = setTimeout(() => { if (demoOn && state === "idle") start(nextSample(), false); else scheduleDemo(1500); }, ms);
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    if (state !== "idle") { runId++; hardReset(); }
  }
  ["pointerdown", "keydown", "dragenter"].forEach((t) => addEventListener(t, takeOver, true));
  scheduleDemo(350);
</script>
</body>
</html>
