<!doctype html>
<!-- Chill & Craft · Letterbox · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Letterbox · Newsletter signup</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f6eedf;
    --card: #fffaf1;
    --line: #eadcc4;
    --ink: #1f2a24;
    --muted: #6f6a5c;
    --green: #1f5d45;
    --green-lt: #3c8a68;
    --terra: #d9653b;
    --error: #c23a2b;
    --box: #2f6f55;
    --post: #8a6a4a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #111b17;
    --card: #182621;
    --line: #2b3d35;
    --ink: #f3ecdf;
    --muted: #a8b2a8;
    --green: #4fb08a;
    --green-lt: #86d6b2;
    --terra: #f08a5d;
    --error: #ff8f80;
    --box: #3f8f6f;
    --post: #b08a62;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; background: radial-gradient(60% 50% at 20% 10%, color-mix(in srgb, var(--terra) 14%, transparent), transparent 70%), var(--bg); }

  /* ---------- Card ---------- */
  .card { position: relative; width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px 22px 18px; box-shadow: 0 30px 60px -36px rgba(60, 40, 10, 0.5); }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .kicker { margin: 0 0 6px; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--terra); }
  h1 { margin: 0; font-size: clamp(1.25rem, 5vw, 1.55rem); line-height: 1.15; }
  .lede { margin: 10px 0 18px; color: var(--muted); font-size: 0.93rem; line-height: 1.5; }

  /* Mailbox drawing: the door swings, the flag springs up when a letter arrives */
  .mailbox { flex: none; width: 64px; height: 64px; overflow: visible; }
  .mailbox .flag { transform-box: fill-box; transform-origin: 0% 100%; transform: rotate(80deg); transition: transform 0.7s cubic-bezier(0.3, 1.5, 0.4, 1); transition-timing-function: linear(0, 0.165, 0.495, 0.916, 1.173, 1.302, 1.31, 1.234, 1.122, 0.995, 0.926, 0.899, 0.907, 0.937, 0.981, 1.01, 1.028, 1.032, 1.027, 1.016, 1.003, 0.994, 0.99, 0.992, 0.997, 1.002, 1); }
  .mailbox.got-mail .flag { transform: none; }
  .card:has(.sub:hover) .mailbox:not(.got-mail) .flag { transform: rotate(70deg); }
  .mailbox .door { transform-box: fill-box; transform-origin: 0% 100%; transition: transform 0.45s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .mailbox.open .door { transform: rotate(-58deg); }
  .mailbox .body { transform-box: fill-box; transform-origin: 50% 100%; }

  /* ---------- Form ---------- */
  .field { display: flex; align-items: center; gap: 8px; padding: 6px; border: 2px solid var(--line); border-radius: 16px; background: var(--bg); transition: border-color 0.2s; }
  .field:focus-within { border-color: var(--green); }
  .field.bad { border-color: var(--error); animation: shake 0.45s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .field input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 0.95rem; color: var(--ink); padding: 10px 8px; }
  .field input:focus { outline: none; }
  .slot { flex: none; width: 132px; height: 46px; display: flex; justify-content: flex-end; }

  /* The Subscribe button; it folds into a paper plane with clip-path */
  .sub {
    position: relative;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 132px;
    height: 46px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--green-lt) 0 50%, var(--green) 50% 100%);
    background-size: 100% 300%;
    background-position: 0 100%;
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    clip-path: polygon(0% 0%, 50% 0%, 100% 0%, 100% 50%, 100% 100%, 50% 100%, 0% 100%, 0% 50%);
    transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1), background-position 0.4s ease;
  }
  :root[data-theme="dark"] .sub { color: #0f1e18; }
  .sub:hover { transform: translateY(-2px); }
  .sub:active { transform: scale(0.94); transition-duration: 0.1s; }
  .sub:focus-visible { outline: 3px solid var(--terra); outline-offset: 3px; }
  .sub .txt, .sub .env { transition: opacity 0.15s; }
  .env { width: 18px; height: 18px; overflow: visible; }
  .env .flap { transform-box: fill-box; transform-origin: 50% 0%; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .sub:hover .env .flap, .sub:focus-visible .env .flap { transform: scaleY(-1); }
  .sub.folding { cursor: progress; background-position: 0 50%; border-radius: 0; }
  .sub.folding .txt, .sub.folding .env { opacity: 0; }

  .msg { margin: 8px 2px 0; min-height: 1.3em; font-size: 0.84rem; color: var(--muted); }
  .msg.err { color: var(--error); font-weight: 600; }
  .readers { margin: 10px 2px 0; font-size: 0.8rem; color: var(--muted); }

  .ghost { position: absolute; left: 0; top: 0; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--green) 18%, var(--card)); color: var(--ink); font-size: 0.9rem; white-space: nowrap; pointer-events: none; z-index: 6; }
  .bit { position: absolute; left: 0; top: 0; width: 7px; height: 9px; border-radius: 1px; pointer-events: none; z-index: 8; }
  .puff { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--green) 30%, transparent); pointer-events: none; z-index: 4; }

  /* ---------- Success ---------- */
  .done { text-align: left; padding: 6px 2px 2px; }
  .done:focus { outline: none; }
  .done h2 { margin: 0 0 4px; font-size: 1.1rem; color: var(--green); }
  .done p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
  .link { border: 0; background: none; padding: 4px 0; font: inherit; font-size: 0.88rem; font-weight: 700; color: var(--terra); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; transition: text-underline-offset 0.2s; }
  .link:hover { text-underline-offset: 6px; }
  .link:focus-visible { outline: 2px solid var(--terra); outline-offset: 3px; border-radius: 4px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .sub, .mailbox .flag, .mailbox .door, .env .flap { transition: none; }
    .field.bad { animation: none; }
    .ghost, .bit, .puff { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" id="card" aria-labelledby="title">
      <div class="head">
        <div>
          <p class="kicker">Weekly newsletter</p>
          <h1 id="title">The Sunday Chai Letter</h1>
        </div>
        <svg class="mailbox" id="mailbox" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="29" y="34" width="6" height="28" rx="2" style="fill: var(--post)" />
          <g class="body" id="mb-body">
            <path d="M10 18 a12 12 0 0 1 12 -12 h22 a12 12 0 0 1 12 12 v18 h-46 z" style="fill: var(--box)" />
            <path d="M12 20 a10 10 0 0 1 20 0 v14 h-20 z" fill="#000" opacity="0.35" />
            <path class="door" d="M10 18 a12 12 0 0 1 24 0 v18 h-24 z" style="fill: var(--box)" stroke="#000" stroke-opacity="0.2" />
            <rect id="mail-slot" x="38" y="15" width="14" height="3" rx="1.5" fill="#000" opacity="0.45" />
          </g>
          <g class="flag">
            <rect x="56" y="8" width="2.5" height="20" rx="1" style="fill: var(--post)" />
            <rect x="58" y="8" width="9" height="7" rx="1" style="fill: var(--terra)" />
          </g>
        </svg>
      </div>
      <p class="lede">One calm email every Sunday: three good reads, one recipe and a small idea to try. No spam, leave any time.</p>

      <form id="form" novalidate>
        <label class="sr" for="email">Email address</label>
        <div class="field" id="field">
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="msg" />
          <span class="slot">
            <button class="sub" id="sub" type="submit">
              <svg class="env" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="4" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" /><path class="flap" d="M2.5 5 L9 10 L15.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
              <span class="txt">Subscribe</span>
            </button>
          </span>
        </div>
        <p class="msg" id="msg" role="status" aria-live="polite">Free. One email a week.</p>
      </form>

      <div class="done" id="done" hidden tabindex="-1">
        <h2>You are on the list!</h2>
        <p id="done-text">Check your inbox for a welcome note.</p>
        <button class="link" id="again" type="button">Use another email</button>
      </div>
      <p class="readers" id="readers">Join 3,412 readers.</p>
    </section>
  </main>

<script>
  // Letterbox: validate → the address flies into the button → the button folds into a paper plane
  // → it glides into the mailbox → thump, flag up, confetti → a thank-you note.
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var card = $("card"), form = $("form"), field = $("field"), email = $("email"), btn = $("sub"), msg = $("msg");
    var mailbox = $("mailbox"), mbBody = $("mb-body"), slotMark = $("mail-slot"), done = $("done"), doneText = $("done-text"), again = $("again"), readers = $("readers");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var count = 3412;
    var busy = false;

    var RECT = "polygon(0% 0%, 50% 0%, 100% 0%, 100% 50%, 100% 100%, 50% 100%, 0% 100%, 0% 50%)";
    var KITE = "polygon(12% 12%, 50% 24%, 92% 50%, 92% 50%, 50% 76%, 34% 66%, 12% 88%, 30% 50%)";
    var PLANE = "polygon(4% 14%, 52% 34%, 96% 50%, 96% 50%, 42% 76%, 32% 57%, 8% 64%, 26% 50%)";

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function valid(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping, delay) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear", delay: delay || 0, fill: "backwards" });
    }
    function local(el) {
      var c = card.getBoundingClientRect(), r = el.getBoundingClientRect();
      return { x: r.left - c.left + r.width / 2, y: r.top - c.top + r.height / 2, w: r.width, h: r.height };
    }

    // Confetti flung up from the mailbox
    function confetti(x, y, n) {
      var colors = ["#1f5d45", "#d9653b", "#f2c14e", "#86d6b2", "#f6eedf"];
      for (var i = 0; i < n; i++) {
        var p = document.createElement("i");
        p.className = "bit";
        p.style.background = colors[i % colors.length];
        card.appendChild(p);
        var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
        var s = 70 + Math.random() * 70, vx = Math.cos(a) * s, vy = Math.sin(a) * s, spin = (Math.random() - 0.5) * 800, frames = [];
        for (var k = 0; k <= 12; k++) {
          var t = k / 12, e = 1 - Math.pow(1 - t, 2.2);
          frames.push({ transform: "translate(" + (x + vx * e + Math.sin(t * 9 + i) * 6).toFixed(1) + "px," + (y + vy * e + 120 * t * t).toFixed(1) + "px) rotate(" + (spin * t).toFixed(0) + "deg) rotateX(" + (t * 720).toFixed(0) + "deg)", opacity: t > 0.75 ? (1 - t) * 4 : 1 });
        }
        p.animate(frames, { duration: 1000 + Math.random() * 500, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
    }

    function showError(text) {
      msg.textContent = text;
      msg.classList.add("err");
      email.setAttribute("aria-invalid", "true");
      field.classList.remove("bad");
      void field.offsetWidth;
      field.classList.add("bad");
      email.focus();
    }

    // 1. The typed address lifts out of the field and shrinks into the button
    function flyAddress(text) {
      var a = local(email), b = local(btn);
      var g = document.createElement("span");
      g.className = "ghost";
      g.textContent = text;
      card.appendChild(g);
      var x0 = a.x - a.w / 2 + 6, y0 = a.y - 12;
      return g.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(1)", opacity: 1 },
        { transform: "translate(" + x0 + "px," + (y0 - 16) + "px) scale(1.04)", opacity: 1, offset: 0.3 },
        { transform: "translate(" + (b.x - 20) + "px," + (b.y - 10) + "px) scale(0.15)", opacity: 0 }
      ], { duration: 560, easing: "cubic-bezier(0.5, 0, 0.3, 1)" }).finished.then(function () { g.remove(); });
    }

    // 3. The plane wobbles along an arc into the mailbox slot
    function fly() {
      var a = btn.getBoundingClientRect(), b = slotMark.getBoundingClientRect();
      var dx = b.left + b.width / 2 - (a.left + a.width / 2);
      var dy = b.top + b.height / 2 - (a.top + a.height / 2);
      var start = local(btn);
      for (var i = 0; i < 3; i++) {
        var p = document.createElement("i");
        p.className = "puff";
        card.appendChild(p);
        p.animate([{ transform: "translate(" + (start.x - 5) + "px," + (start.y - 5) + "px) scale(0.5)", opacity: 0.9 }, { transform: "translate(" + (start.x - 30 - i * 12) + "px," + (start.y + 6 - i * 8) + "px) scale(" + (2.4 - i * 0.4) + ")", opacity: 0 }], { duration: 600, delay: i * 70, easing: "ease-out", fill: "both" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
      return btn.animate([
        { transform: "translate(0, 0) rotate(0deg) scale(1)", opacity: 1 },
        { transform: "translate(-14px, 8px) rotate(12deg) scale(1.05)", offset: 0.14 },
        { transform: "translate(" + dx * 0.3 + "px, " + (dy * 0.4 - 56) + "px) rotate(-34deg) scale(0.92)", offset: 0.42 },
        { transform: "translate(" + dx * 0.62 + "px, " + (dy * 0.7 - 66) + "px) rotate(-6deg) scale(0.75)", offset: 0.66 },
        { transform: "translate(" + dx * 0.9 + "px, " + (dy - 14) + "px) rotate(18deg) scale(0.45)", offset: 0.88, opacity: 1 },
        { transform: "translate(" + dx + "px, " + dy + "px) rotate(24deg) scale(0.15)", opacity: 0 }
      ], { duration: 1150, easing: "cubic-bezier(0.4, 0, 0.3, 1)", fill: "forwards" });
    }

    function showSuccess(address) {
      count++;
      form.hidden = true;
      done.hidden = false;
      doneText.textContent = "A welcome note is on its way to " + address + ".";
      readers.textContent = "You are reader number " + count.toLocaleString("en-US") + ".";
      if (!calm.matches) {
        Array.prototype.forEach.call(done.children, function (el, i) {
          springTo(el, function (p) { return { transform: "translateY(" + ((1 - p) * 14).toFixed(1) + "px)", opacity: Math.min(1, p * 1.5) }; }, 240, 15, i * 90);
        });
        springTo(readers, function (p) { return { transform: "scale(" + (1 + Math.sin(p * Math.PI) * 0.12).toFixed(3) + ")", transformOrigin: "0 50%" }; }, 220, 11, 300);
      }
      done.focus();
    }

    async function subscribe(address) {
      busy = true;
      email.removeAttribute("aria-invalid");
      msg.classList.remove("err");
      msg.textContent = "Folding your signup into a paper plane…";
      btn.setAttribute("aria-disabled", "true");

      if (calm.matches) {
        mailbox.classList.add("got-mail");
        await wait(300);
        showSuccess(address);
        busy = false;
        return;
      }

      // 1. Anticipation: the address flies in, the button squashes, the mailbox door opens
      btn.animate([{ transform: "scale(1)" }, { transform: "scale(1.05, 0.86)" }, { transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(0.3, 0, 0.3, 1)" });
      mailbox.classList.add("open");
      await flyAddress(address);

      // 2. Main: shrink to a square, crease into a kite, then a paper plane
      btn.classList.add("folding");
      btn.style.width = "52px"; // final size; the spring below plays on top of it
      await springTo(btn, function (p) { return { width: (132 - 80 * p).toFixed(1) + "px" }; }, 260, 18).finished;
      await btn.animate([{ clipPath: RECT }, { clipPath: KITE, offset: 0.55 }, { clipPath: PLANE }], { duration: 520, easing: "cubic-bezier(0.5, 0, 0.3, 1.2)", fill: "forwards" }).finished;
      springTo(btn, function (p) { return { transform: "scale(" + (1 + Math.sin(p * Math.PI) * 0.15).toFixed(3) + ")" }; }, 300, 12);
      msg.textContent = "Posting it…";
      await wait(220);

      // 3. Action: glide into the mailbox
      var flight = fly();
      await flight.finished;

      // 4. Finish: the box thumps, the door shuts, the flag springs up, confetti flies
      mailbox.classList.remove("open");
      mailbox.classList.add("got-mail");
      springTo(mbBody, function (p) { return { transform: "scale(" + (1.12 - 0.12 * p).toFixed(3) + "," + (0.88 + 0.12 * p).toFixed(3) + ")" }; }, 300, 9);
      var m = local(mailbox);
      confetti(m.x, m.y - 10, 26);
      await wait(250);
      showSuccess(address);
      flight.cancel();
      busy = false;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var v = email.value.trim();
      if (!v) return showError("Please type your email address.");
      if (!valid(v)) return showError("That email looks incomplete. Try name@example.com.");
      subscribe(v);
    });

    email.addEventListener("input", function () {
      if (email.getAttribute("aria-invalid") && valid(email.value.trim())) {
        email.removeAttribute("aria-invalid");
        msg.classList.remove("err");
        msg.textContent = "Looks good.";
      }
    });

    // 5. Reset: the form springs back and the plane unfolds into a button again
    again.addEventListener("click", function () {
      btn.getAnimations().forEach(function (a) { a.cancel(); });
      btn.classList.remove("folding");
      btn.style.width = "";
      btn.removeAttribute("aria-disabled");
      mailbox.classList.remove("got-mail", "open");
      done.hidden = true;
      form.hidden = false;
      email.value = "";
      msg.textContent = "Free. One email a week.";
      readers.textContent = "Join " + count.toLocaleString("en-US") + " readers.";
      if (!calm.matches) {
        btn.animate([{ clipPath: PLANE }, { clipPath: KITE, offset: 0.4 }, { clipPath: RECT }], { duration: 420, easing: "cubic-bezier(0.3, 0, 0.3, 1)" });
        springTo(btn, function (p) { return { transform: "scale(" + (0.5 + 0.5 * p).toFixed(3) + ") rotate(" + ((1 - p) * -20).toFixed(1) + "deg)" }; }, 240, 12);
        springTo(field, function (p) { return { transform: "translateY(" + ((1 - p) * 12).toFixed(1) + "px)", opacity: Math.min(1, p * 1.5) }; }, 240, 15);
      }
      email.focus();
    });
  })();
</script>
</body>
</html>
