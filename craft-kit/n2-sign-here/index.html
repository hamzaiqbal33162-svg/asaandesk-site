<title>Sign Here · signature pad on a delivery receipt</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: slate clipboard, cream paper, navy ink (light); midnight desk (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --hand: "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery", "URW Chancery L", "Z003", cursive;
    --bg: #dde3ec;
    --bg2: #eef2f7;
    --card: #f9fbfd;
    --ink: #172033;
    --muted: #64708a;
    --line: #d8dfea;
    --board: #34425f;
    --board2: #24304a;
    --paper: #fffdf7;
    --pink: #ffe9a8;
    --steel: #c7ced8;
    --indigo: #3b4fd8;
    --teal: #0e9a85;
    --red: #d2403a;
    --shadow: rgba(20, 30, 60, .3);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #080b14;
    --bg2: #111827;
    --card: #101624;
    --ink: #e7ecf7;
    --muted: #8f9bb6;
    --line: #232c42;
    --board: #1a2338;
    --board2: #121a2b;
    --paper: #f4f1e8;
    --steel: #8a929e;
    --indigo: #8f9cff;
    --teal: #2fd2b4;
    --red: #ff6b62;
    --shadow: rgba(0, 0, 0, .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 18px 14px;
    overflow: hidden;
    background:
      radial-gradient(50% 40% at 50% 45%, color-mix(in srgb, var(--indigo) 14%, transparent), transparent 70%),
      radial-gradient(90% 80% at 50% 30%, var(--bg2), var(--bg));
  }
  .card {
    position: relative;
    width: min(100%, 420px);
    padding: 16px 16px 18px;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -48px var(--shadow), 0 10px 24px -16px var(--shadow);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.97); } }
  .kicker { margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--indigo); }
  h1 { margin: 0; font-size: clamp(17.5px, 4.8vw, 19.5px); letter-spacing: -.015em; }

  /* ---------- Clipboard and receipt ---------- */
  .board { position: relative; margin-top: 14px; padding: 26px 12px 12px; border-radius: 18px; background: linear-gradient(160deg, var(--board), var(--board2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 16px 26px -16px var(--shadow); }
  .clip { position: absolute; left: 50%; top: -8px; width: 120px; height: 30px; margin-left: -60px; border-radius: 10px 10px 14px 14px; background: linear-gradient(180deg, #eef1f5, var(--steel) 55%, #7c8591); box-shadow: 0 4px 8px rgba(0, 0, 0, .35); z-index: 2; }
  .clip::before { content: ""; position: absolute; left: 50%; top: 6px; width: 34px; height: 10px; margin-left: -17px; border-radius: 6px; background: var(--board2); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .5); }
  .clip.snap { animation: snap .5s cubic-bezier(.34, 1.8, .64, 1); }
  @keyframes snap { 30% { transform: translateY(-5px) rotateX(30deg); } }
  .paper { position: relative; border-radius: 6px; background: var(--paper); color: #1d2333; box-shadow: 0 2px 0 rgba(0, 0, 0, .06), 0 10px 18px -12px rgba(0, 0, 0, .5); overflow: hidden; }
  .paper.shake { animation: shake .42s ease; }
  @keyframes shake { 20% { transform: translateX(-6px) rotate(-.5deg); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } }
  .rec { padding: 12px 14px 4px; font-size: 12px; }
  .rec .top { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 1.5px dashed #d9d4c6; }
  .rec .top b { font-size: 13px; letter-spacing: .02em; }
  .rec .top span { font-size: 11px; color: #7a7466; }
  .rec dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 7px 0 0; }
  .rec dt { color: #7a7466; }
  .rec dd { margin: 0; font-weight: 600; text-align: right; }

  .pad { position: relative; height: 150px; margin: 4px 0 0; touch-action: none; cursor: none; }
  .pad.locked { cursor: default; }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .base { position: absolute; left: 14px; right: 14px; bottom: 34px; height: 1.5px; background: #b8b2a2; pointer-events: none; }
  .xmark { position: absolute; left: 16px; bottom: 40px; font: 700 18px var(--ff); color: #b8b2a2; pointer-events: none; }
  .under { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; justify-content: space-between; font-size: 10.5px; color: #8a8474; pointer-events: none; }
  .ghost { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font: 400 30px var(--hand); color: #cfc9b8; pointer-events: none; transition: opacity .35s, transform .35s; }
  .pad.inked .ghost { opacity: 0; transform: translateY(-8px); }
  .nib { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -31px 0 0 -3px; pointer-events: none; opacity: 0; transition: opacity .2s; transform-origin: 3px 31px; z-index: 3; }
  .nib.on { opacity: 1; }
  .nib.down { transform: rotate(-8deg) scale(.95); }
  .wipe { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent, var(--paper) 30%, var(--paper) 70%, transparent); transform: translateX(-110%); z-index: 2; }
  .wipe.go { animation: wipe .55s ease-in-out; }
  @keyframes wipe { to { transform: translateX(110%); } }
  .typed { position: absolute; left: 14px; right: 14px; top: 10px; display: none; }
  .pad.typing .typed { display: block; }
  .typed input { width: 100%; height: 36px; padding: 0 10px; border-radius: 10px; border: 1.5px solid #d9d4c6; background: rgba(255, 255, 255, .85); color: #1d2333; font: 600 14px var(--ff); outline: none; }
  .typed input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px color-mix(in srgb, var(--indigo) 25%, transparent); }

  /* stamp */
  .stamp {
    position: absolute; right: 18px; bottom: 26px; z-index: 4; padding: 6px 12px 7px; border: 3px solid var(--teal); border-radius: 10px; color: var(--teal);
    text-align: center; font: 900 15px/1.1 var(--ff); letter-spacing: .14em; pointer-events: none; opacity: 0; transform: scale(2.4) rotate(-24deg);
    mix-blend-mode: multiply;
  }
  .stamp small { display: block; margin-top: 3px; font-size: 9.5px; letter-spacing: .06em; font-weight: 800; }
  .stamp.on { animation: stamp .5s cubic-bezier(.5, 0, .7, 1.3) forwards; }
  @keyframes stamp { 70% { opacity: 1; transform: scale(.94) rotate(-11deg); } 100% { opacity: .9; transform: scale(1) rotate(-11deg); } }
  .dust { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--teal); pointer-events: none; z-index: 4; animation: dust .6s ease-out forwards; }
  @keyframes dust { from { transform: translate(0, 0); opacity: .8; } to { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }

  /* ---------- Tools ---------- */
  .tools { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  .inks { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
  .inks button { width: 26px; height: 26px; padding: 0; border: 2px solid transparent; border-radius: 50%; background: var(--c); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28); transition: transform .25s cubic-bezier(.34, 1.8, .64, 1); }
  .inks button[aria-checked="true"] { border-color: var(--card); box-shadow: 0 0 0 2px var(--c); transform: scale(1.1); }
  .tool {
    display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg2);
    color: var(--ink); font: 600 12.5px/1 var(--ff); cursor: pointer; white-space: nowrap; transition: transform .2s cubic-bezier(.34, 1.8, .64, 1), opacity .2s;
  }
  .tool:active { transform: scale(.94); }
  .tool svg { width: 15px; height: 15px; }
  .tool[aria-pressed="true"] { border-color: var(--indigo); color: var(--indigo); }
  .tool:disabled { opacity: .4; cursor: default; }
  .grow { flex: 1; }

  .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 12px; }
  .msg { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
  .msg.err { color: var(--red); font-weight: 600; }
  .msg.ok { color: var(--teal); font-weight: 600; }
  .msg a { color: var(--indigo); font-weight: 700; }
  .go {
    height: 46px; padding: 0 18px; border: 0; border-radius: 15px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(180deg, color-mix(in srgb, var(--indigo) 80%, #fff), var(--indigo)); color: #fff; font: 800 14px/1 var(--ff);
    box-shadow: 0 12px 20px -12px var(--indigo); transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
  }
  [data-theme="dark"] .go { color: #0a0f24; }
  .go:hover { transform: translateY(-2px); }
  .go:active { transform: scale(.96); }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }
  .pad:focus-visible { outline: 3px solid var(--indigo); outline-offset: -3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #undo, #clear { width: 36px; padding: 0; justify-content: center; }
  @media (max-width: 340px) { .tool span { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <p class="kicker">Delivery receipt</p>
    <h1 id="title">Sign to confirm you got it</h1>

    <div class="board">
      <span class="clip" id="clip" aria-hidden="true"></span>
      <div class="paper" id="paper">
        <div class="rec">
          <div class="top"><b>ORDER 4471</b><span id="when">Today</span></div>
          <dl>
            <dt>Parcels</dt><dd>2 boxes, 3.4 kg</dd>
            <dt>Rider</dt><dd>Bilal Ahmed</dd>
            <dt>To</dt><dd>Street 4, Model Town, Lahore</dd>
          </dl>
        </div>
        <div class="pad" id="pad" tabindex="0" role="img" aria-label="Signature pad: draw your signature with a mouse, finger or pen, or press Type instead">
          <canvas id="cv"></canvas>
          <span class="ghost" aria-hidden="true">Sign here</span>
          <span class="xmark" aria-hidden="true">✕</span>
          <span class="base" aria-hidden="true"></span>
          <span class="under" aria-hidden="true"><span>Received by</span><span id="stampDate"></span></span>
          <div class="typed"><label class="sr" for="name">Type your full name</label><input id="name" type="text" autocomplete="name" placeholder="Type your full name" maxlength="32"></div>
          <svg class="nib" id="nib" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 31l4-12L26 0l8 8-19 19z" fill="#2b3550"/><path d="M3 31l4-12 8 8z" fill="#d9b25a"/><path d="M3 31l5-5" stroke="#1d2333" stroke-width="1.4"/></svg>
          <div class="wipe" id="wipe" aria-hidden="true"></div>
          <div class="stamp" id="stamp" aria-hidden="true">RECEIVED<small id="stampTime">20 NOV · 4:12 PM</small></div>
        </div>
      </div>
    </div>

    <div class="tools">
      <div class="inks" role="radiogroup" aria-label="Ink colour">
        <button type="button" role="radio" aria-checked="true" aria-label="Navy ink" data-c="#1f3a93" style="--c:#1f3a93"></button>
        <button type="button" role="radio" aria-checked="false" aria-label="Black ink" data-c="#15171c" style="--c:#15171c"></button>
        <button type="button" role="radio" aria-checked="false" aria-label="Maroon ink" data-c="#8c1d3c" style="--c:#8c1d3c"></button>
      </div>
      <span class="grow"></span>
      <button class="tool" id="undo" type="button" aria-label="Undo last stroke" title="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tool" id="clear" type="button" aria-label="Clear the signature" title="Clear" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="tool" id="typeBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg><span>Type instead</span></button>
    </div>

    <div class="foot">
      <p class="msg" id="msg" aria-live="polite">Draw your signature on the line.</p>
      <button class="go" id="go" type="button">Confirm</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  var pad = $("#pad"), cv = $("#cv"), ctx = cv.getContext("2d"), nib = $("#nib"), msg = $("#msg"), go = $("#go");
  var undoBtn = $("#undo"), clearBtn = $("#clear"), typeBtn = $("#typeBtn"), nameIn = $("#name"), stamp = $("#stamp"), paper = $("#paper");
  var ink = "#1f3a93", strokes = [], cur = null, locked = false, typing = false, W = 0, H = 0, dpr = 1;
  var now = new Date();
  $("#when").textContent = now.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

  // ---------- Canvas size (strokes are stored 0..1 so they survive a resize) ----------
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = pad.clientWidth; H = pad.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    redraw();
  }

  // ---------- Ink: smooth curves through midpoints, thinner when you move fast ----------
  function drawStroke(c, s, sx, sy) {
    var pts = s.pts;
    if (!pts.length) return;
    c.strokeStyle = c.fillStyle = s.ink;
    c.lineCap = "round"; c.lineJoin = "round";
    var w = s.w0 || 2.6, x0 = pts[0].x * sx, y0 = pts[0].y * sy;
    c.beginPath(); c.arc(x0, y0, w * .75, 0, Math.PI * 2); c.fill(); // a little blot where the pen lands
    var px = x0, py = y0, mx = x0, my = y0;
    for (var i = 1; i < pts.length; i++) {
      var x = pts[i].x * sx, y = pts[i].y * sy, dt = Math.max(1, pts[i].t - pts[i - 1].t);
      var v = Math.hypot(x - px, y - py) / dt; // px per ms
      var target = Math.max(1.1, Math.min(4.2, 4.4 - v * 5)) * (pts[i].p ? .6 + pts[i].p * .8 : 1);
      w = w * .7 + target * .3;
      var nx = (px + x) / 2, ny = (py + y) / 2;
      c.lineWidth = w;
      c.beginPath(); c.moveTo(mx, my); c.quadraticCurveTo(px, py, nx, ny); c.stroke();
      mx = nx; my = ny; px = x; py = y;
    }
    c.lineWidth = w * .8; c.beginPath(); c.moveTo(mx, my); c.lineTo(px, py); c.stroke();
  }
  var typedName = "", typedReveal = 1;
  function handFont(px) { return "400 " + px + "px " + getComputedStyle(document.documentElement).getPropertyValue("--hand"); }
  function drawTyped(c, w, h, reveal) {
    if (!typedName) return;
    var px = 46;
    c.font = handFont(px);
    while (c.measureText(typedName).width > w - 60 && px > 18) { px -= 2; c.font = handFont(px); }
    var tw = c.measureText(typedName).width, x = Math.max(30, (w - tw) / 2), y = h - 44;
    c.save();
    c.beginPath(); c.rect(0, 0, x + (tw + 10) * reveal, h); c.clip();
    c.fillStyle = ink; c.fillText(typedName, x, y);
    c.restore();
  }
  function redraw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    strokes.forEach(function (s) { drawStroke(ctx, s, W, H); });
    if (cur) drawStroke(ctx, cur, W, H);
    if (typing) drawTyped(ctx, W, H, typedReveal);
    var has = strokes.length || cur || (typing && typedName);
    pad.classList.toggle("inked", !!has);
    undoBtn.disabled = locked || !strokes.length || typing;
    clearBtn.disabled = locked || !has;
  }

  // ---------- Pointer drawing with the nib cursor ----------
  function local(e) { var b = pad.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  function moveNib(x, y, show) {
    nib.style.left = x + "px"; nib.style.top = y + "px";
    nib.classList.toggle("on", !!show);
  }
  pad.addEventListener("pointerdown", function (e) {
    if (locked || typing || e.button > 0) return;
    e.preventDefault();
    try { pad.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
    var p = local(e);
    cur = { ink: ink, pts: [{ x: p.x / W, y: p.y / H, t: e.timeStamp, p: e.pointerType === "pen" ? e.pressure : 0 }] };
    nib.classList.add("down");
    moveNib(p.x, p.y, e.pointerType !== "touch");
    setMsg("");
    redraw();
  });
  pad.addEventListener("pointermove", function (e) {
    var p = local(e);
    if (!locked && !typing) moveNib(p.x, p.y, e.pointerType !== "touch");
    if (!cur) return;
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!list.length) list = [e];
    list.forEach(function (ev) { var q = local(ev); cur.pts.push({ x: q.x / W, y: q.y / H, t: ev.timeStamp, p: ev.pointerType === "pen" ? ev.pressure : 0 }); });
    redraw();
  });
  function endStroke() {
    nib.classList.remove("down");
    if (!cur) return;
    strokes.push(cur); cur = null;
    redraw();
  }
  pad.addEventListener("pointerup", endStroke);
  pad.addEventListener("pointercancel", endStroke);
  pad.addEventListener("pointerleave", function () { if (!cur) nib.classList.remove("on"); });

  // ---------- Tools ----------
  function setMsg(t, cls) { msg.innerHTML = ""; msg.textContent = t || (typing ? "Type your name and it is written in ink." : "Draw your signature on the line."); msg.className = "msg" + (cls ? " " + cls : ""); }
  [].forEach.call(document.querySelectorAll(".inks button"), function (b, i, all) {
    b.addEventListener("click", function () {
      ink = b.dataset.c;
      [].forEach.call(all, function (o) { o.setAttribute("aria-checked", String(o === b)); });
      if (!locked) { strokes.forEach(function (s) { s.ink = ink; }); redraw(); } // recolour what is already signed
    });
  });
  undoBtn.addEventListener("click", function () { if (locked) return; strokes.pop(); redraw(); setMsg(strokes.length ? "Removed the last stroke." : ""); });
  async function wipe() {
    var w = $("#wipe");
    w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
    await wait(reduce.matches ? 0 : 260);
    strokes = []; cur = null; typedName = ""; nameIn.value = "";
    redraw();
  }
  clearBtn.addEventListener("click", function () { if (!locked) { wipe(); setMsg("Cleared. Sign again on the line."); } });
  function setTyping(on, quiet) {
    if (locked) return;
    typing = on;
    typeBtn.setAttribute("aria-pressed", String(on));
    typeBtn.querySelector("span").textContent = on ? "Draw instead" : "Type instead";
    pad.classList.toggle("typing", on);
    pad.style.cursor = on ? "default" : "";
    nib.classList.remove("on");
    strokes = []; typedName = ""; nameIn.value = "";
    redraw(); setMsg("");
    if (on && !quiet) nameIn.focus({ preventScroll: true });
  }
  typeBtn.addEventListener("click", function () { setTyping(!typing); });
  var revealId = 0;
  function reveal() { // write the typed name on from left to right
    var id = ++revealId, t0 = performance.now();
    (function step(t) {
      if (id !== revealId) return;
      typedReveal = reduce.matches ? 1 : Math.min(1, (t - t0) / 380);
      redraw();
      if (typedReveal < 1) requestAnimationFrame(step);
    })(t0);
  }
  nameIn.addEventListener("input", function () { typedName = nameIn.value.trim(); typedReveal = .6; reveal(); setMsg(""); });
  nameIn.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); confirm(go); } });

  // ---------- Confirm: checks, then the stamp ----------
  function inkLength() {
    var L = 0, minX = 1, maxX = 0;
    strokes.forEach(function (s) { s.pts.forEach(function (p, i) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); if (i) L += Math.hypot((p.x - s.pts[i - 1].x) * W, (p.y - s.pts[i - 1].y) * H); }); });
    return { len: L, wide: (maxX - minX) * W };
  }
  function exportPNG() {
    // the signature alone on a transparent background, trimmed to the ink
    var c = document.createElement("canvas"), k = 2;
    c.width = W * k; c.height = H * k;
    var x = c.getContext("2d");
    x.setTransform(k, 0, 0, k, 0, 0);
    strokes.forEach(function (s) { drawStroke(x, s, W, H); });
    if (typing) drawTyped(x, W, H, 1);
    return c.toDataURL("image/png");
  }
  function dust() {
    if (reduce.matches) return;
    var r = stamp.getBoundingClientRect(), b = pad.getBoundingClientRect();
    for (var i = 0; i < 10; i++) {
      var d = document.createElement("i"), a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 30;
      d.className = "dust";
      d.style.cssText = "left:" + (r.left - b.left + r.width / 2) + "px;top:" + (r.top - b.top + r.height / 2) + "px;--x:" + (Math.cos(a) * s).toFixed(0) + "px;--y:" + (Math.sin(a) * s * .6).toFixed(0) + "px";
      pad.appendChild(d);
      setTimeout(d.remove.bind(d), 650);
    }
  }
  function reject(text) {
    paper.classList.remove("shake"); void paper.offsetWidth; paper.classList.add("shake");
    setMsg(text, "err");
  }
  function confirm(btn) {
    if (locked) { // sign again
      locked = false;
      stamp.classList.remove("on");
      btn.textContent = "Confirm";
      pad.classList.remove("locked");
      wipe(); setMsg("");
      return;
    }
    if (typing) {
      if (typedName.replace(/[^A-Za-z]/g, "").length < 3) return reject(typedName ? "Type your full name, please." : "Type your name first.");
    } else {
      if (!strokes.length) return reject("Please sign on the line first.");
      var m = inkLength();
      if (m.len < 160 || m.wide < 70) return reject("That looks too short. Sign your full signature.");
    }
    locked = true;
    pad.classList.add("locked");
    nib.classList.remove("on");
    btn.textContent = "Sign again";
    var t = new Date();
    $("#stampTime").textContent = t.toLocaleDateString("en-GB", { day: "numeric", month: "short" }).toUpperCase() + " · " + t.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    stamp.classList.remove("on"); void stamp.offsetWidth; stamp.classList.add("on");
    var clip = $("#clip");
    setTimeout(function () { clip.classList.remove("snap"); void clip.offsetWidth; clip.classList.add("snap"); dust(); }, reduce.matches ? 0 : 330);
    redraw();
    msg.className = "msg ok";
    msg.innerHTML = 'Signed and received. <a id="dl" download="signature.png" href="' + exportPNG() + '">Download PNG</a>';
  }
  go.addEventListener("click", function (e) { var btn = e.currentTarget; confirm(btn); });
  pad.addEventListener("keydown", function (e) { if (e.key === "Enter" && !typing) { e.preventDefault(); setTyping(true); } });

  // ---------- Start ----------
  size();
  var rz;
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(size, 100); });

  // ---------- Auto demo: a pen signs, gets stamped, a too-short scribble is refused, then a typed name ----------
  var demoOn = true;
  function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; nib.classList.remove("on"); } }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  // a made-up flowing signature: a big opening loop, a looping cursive body, an underline flourish and a dot
  function signature() {
    var S = [], i, t, a;
    var loop = [];
    for (i = 0; i <= 46; i++) { a = Math.PI * .9 + i / 46 * Math.PI * 2.15; loop.push([.17 + Math.cos(a) * .065 + i * .0009, .5 + Math.sin(a) * .26]); }
    S.push(loop);
    var body = [];
    for (i = 0; i <= 170; i++) {
      t = i / 170; a = t * Math.PI * 2 * 5.5;
      var amp = .13 + .08 * Math.sin(t * 9 + 1) + (Math.sin(t * 6.3) > .55 ? .1 : 0);
      body.push([.21 + t * .55 - Math.sin(a) * .018, .62 - amp * (1 - Math.cos(a)) / 2 - t * .04]);
    }
    S.push(body);
    var flo = [];
    for (i = 0; i <= 50; i++) { t = i / 50; flo.push([.8 - t * .62, .74 + Math.sin(t * Math.PI) * .07 - t * .02]); }
    S.push(flo);
    S.push([[.63, .3], [.635, .305]]);
    return S;
  }
  async function penDraw(list, gap) {
    for (var s = 0; s < list.length; s++) {
      var pts = list[s], t = performance.now();
      cur = { ink: ink, pts: [] };
      nib.classList.add("down");
      for (var i = 0; i < pts.length; i++) {
        if (!demoOn) { cur = null; nib.classList.remove("down", "on"); redraw(); throw 0; }
        t += 9 + (i % 7) * 1.5;
        cur.pts.push({ x: pts[i][0], y: pts[i][1], t: t, p: 0 });
        moveNib(pts[i][0] * W, pts[i][1] * H, true);
        if (i % 2 === 0) { redraw(); await wait(gap); }
      }
      strokes.push(cur); cur = null; redraw();
      nib.classList.remove("down");
      await pause(140);
    }
    nib.classList.remove("on");
  }
  async function demo() {
    try {
      await pause(600);
      while (demoOn) {
        await penDraw(signature(), 9); await pause(600);
        confirm(go); await pause(2600);
        confirm(go); await pause(700);
        await penDraw([[[.3, .55], [.33, .5], [.36, .56]]], 30); await pause(300);
        confirm(go); await pause(1600);
        await wipe(); setMsg(""); await pause(500);
        setTyping(true, true);
        for (var s = "Sana Malik", k = 0; k < s.length; k++) { await pause(110); nameIn.value += s[k]; typedName = nameIn.value.trim(); typedReveal = .6; reveal(); }
        await pause(700);
        confirm(go); await pause(2400);
        confirm(go); setTyping(false, true); await pause(900);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
