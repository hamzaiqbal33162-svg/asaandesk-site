<!doctype html>
<!-- Chill & Craft · Flag Dial · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Dial · phone number input with country flags</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: clear sky blue and mint (light), deep harbour night (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #e4eefc;
    --bg2: #f5f9ff;
    --card: #ffffff;
    --ink: #0f1d33;
    --muted: #5b6b85;
    --line: #dde6f3;
    --soft: #f1f5fc;
    --blue: #2563eb;
    --blue2: #4f8bff;
    --ok: #0fa678;
    --bad: #e0414f;
    --sky1: #bfe0ff;
    --sky2: #eaf5ff;
    --shadow: rgba(20, 50, 110, .26);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #070c18;
    --bg2: #0d1528;
    --card: #111a2e;
    --ink: #e8efff;
    --muted: #8e9cbb;
    --line: #23304b;
    --soft: #0c1426;
    --blue: #5b8cff;
    --blue2: #86a9ff;
    --ok: #35d6a0;
    --bad: #ff6b78;
    --sky1: #13254a;
    --sky2: #1d3360;
    --shadow: rgba(0, 0, 0, .7);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); padding: 18px 14px; overflow: hidden; overflow-x: clip;
    background: radial-gradient(60% 45% at 50% 0%, color-mix(in srgb, var(--blue) 16%, transparent), transparent 70%), linear-gradient(180deg, var(--bg2), var(--bg));
  }
  .card {
    position: relative; width: min(100%, 410px); border-radius: 28px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 40px 80px -46px var(--shadow), 0 12px 26px -18px var(--shadow);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.97); } }

  /* ---------- Waving flag on a pole ---------- */
  .sky { position: relative; height: 124px; border-radius: 28px 28px 0 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1), var(--sky2)); }
  /* soft puffy clouds: a pill with two round bumps on top */
  .sky .cloud { position: absolute; height: 12px; border-radius: 12px; background: #fff; opacity: .75; animation: drift 26s linear infinite; }
  .sky .cloud::before, .sky .cloud::after { content: ""; position: absolute; bottom: 4px; border-radius: 50%; background: inherit; }
  .sky .cloud::before { left: 18%; width: 22px; height: 18px; }
  .sky .cloud::after { left: 46%; width: 30px; height: 24px; }
  [data-theme="dark"] .sky .cloud { opacity: .08; }
  .sky .cloud.c2 { top: 60px; width: 70px; animation-duration: 34s; animation-delay: -14s; }
  .sky .cloud.c1 { top: 24px; width: 90px; }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(460px); } }
  .pole { position: absolute; left: 30px; top: 12px; bottom: -4px; width: 5px; border-radius: 3px; background: linear-gradient(90deg, #8a96a8, #e9eef5, #8a96a8); }
  .pole::before { content: ""; position: absolute; left: 50%; top: -6px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4c2, #d4a72c); }
  .flagRig { position: absolute; left: 35px; top: 18px; width: 126px; height: 84px; transition: transform .45s cubic-bezier(.5, 0, .75, 0); }
  .flagRig.down { transform: translateY(70px) scaleY(.9); }
  .flagRig.up { transition: transform .7s cubic-bezier(.34, 1.4, .64, 1); }
  .flag { position: absolute; inset: 0; display: flex; filter: drop-shadow(0 6px 8px rgba(20, 40, 80, .25)); }
  .strip { position: relative; flex: 1; height: 100%; margin-right: -.6px; animation: wave 1.7s ease-in-out infinite; animation-delay: calc(var(--i) * -70ms); }
  .strip svg { display: block; width: 100%; height: 100%; }
  .strip::after { content: ""; position: absolute; inset: 0; background: #000; opacity: 0; animation: shade 1.7s ease-in-out infinite; animation-delay: inherit; }
  @keyframes wave { 0%, 100% { transform: translateY(calc(var(--k) * -4px)); } 50% { transform: translateY(calc(var(--k) * 4px)); } }
  @keyframes shade { 0%, 100% { opacity: 0; } 25% { opacity: .14; } 75% { opacity: -.1; } }
  .flagName { position: absolute; right: 16px; bottom: 14px; text-align: right; }
  .flagName b { display: block; font-size: 15px; letter-spacing: -.01em; }
  .flagName span { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .flagName.swap { animation: swap .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes swap { from { transform: translateY(8px); opacity: 0; } }

  .body { padding: 16px 18px 18px; }
  h1 { margin: 0; font-size: clamp(18px, 5vw, 21px); letter-spacing: -.02em; }
  .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

  /* ---------- Number field with the country button ---------- */
  .lab { display: block; margin: 14px 0 6px; font-size: 12.5px; font-weight: 700; }
  .field { position: relative; display: flex; align-items: stretch; height: 54px; border-radius: 17px; background: var(--soft); border: 1.5px solid var(--line); transition: border-color .25s, box-shadow .25s; }
  .field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 16%, transparent); }
  .field.ok { border-color: var(--ok); }
  .field.bad { border-color: var(--bad); }
  .field.shake { animation: shake .45s ease; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .cc {
    flex: none; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 12px; border: 0; border-right: 1.5px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 16px 0 0 16px; cursor: pointer; font: 700 14.5px/1 var(--ff); font-variant-numeric: tabular-nums;
  }
  .cc:hover { background: color-mix(in srgb, var(--blue) 7%, transparent); }
  .cc svg.mini { width: 27px; height: 18px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); }
  .cc .chev { width: 14px; height: 14px; color: var(--muted); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
  .cc[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .numWrap { position: relative; flex: 1; min-width: 0; }
  .numWrap input, .ghost { position: absolute; inset: 0; width: 100%; padding: 0 44px 0 12px; border: 0; background: transparent; font: 700 17px/54px var(--ff); letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: pre; }
  .numWrap input { color: var(--ink); outline: none; z-index: 1; }
  .ghost { color: var(--muted); opacity: .45; pointer-events: none; overflow: hidden; }
  .ghost .typed { color: transparent; }
  .mark { position: absolute; right: 12px; top: 50%; width: 24px; height: 24px; margin-top: -12px; z-index: 2; pointer-events: none; }
  .mark circle { fill: var(--ok); transform: scale(0); transform-origin: center; transform-box: fill-box; transition: transform .4s cubic-bezier(.34, 1.56, .64, 1); }
  .mark path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .35s .15s; }
  .field.ok .mark circle { transform: scale(1); }
  .field.ok .mark path { stroke-dashoffset: 0; }
  .help { display: flex; justify-content: space-between; gap: 10px; margin: 7px 2px 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  .help.ok { color: var(--ok); font-weight: 700; }
  .help.bad { color: var(--bad); font-weight: 700; }
  .help .digits { flex: none; font-variant-numeric: tabular-nums; }

  /* ---------- Country list ---------- */
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 10; padding: 8px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 30px 50px -20px var(--shadow); transform-origin: 20% 0; transform: scale(.92) translateY(-6px); opacity: 0; pointer-events: none;
    transition: transform .3s cubic-bezier(.34, 1.4, .64, 1), opacity .2s;
  }
  .pop.on { transform: none; opacity: 1; pointer-events: auto; }
  .pop input { width: 100%; height: 38px; padding: 0 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--soft); color: var(--ink); font: 600 13.5px/1 var(--ff); outline: none; }
  .pop input:focus { border-color: var(--blue); }
  .opts { list-style: none; margin: 6px 0 0; padding: 0; max-height: 208px; overflow-y: auto; scrollbar-width: thin; }
  .opt { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 11px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .pop.on .opt { animation: optIn .35s cubic-bezier(.22, 1.2, .36, 1) both; animation-delay: calc(var(--i) * 22ms); }
  @keyframes optIn { from { opacity: 0; transform: translateX(-8px); } }
  .opt svg { width: 27px; height: 18px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); }
  .opt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt small { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .opt.act { background: color-mix(in srgb, var(--blue) 12%, transparent); }
  .opt[aria-selected="true"] small { color: var(--blue); }
  .none { padding: 12px; text-align: center; font-size: 12.5px; color: var(--muted); }

  /* ---------- Save and the saved list ---------- */
  .save {
    position: relative; width: 100%; height: 48px; margin-top: 14px; border: 0; border-radius: 16px; cursor: pointer; color: #fff; font: 800 14px/1 var(--ff);
    background: linear-gradient(180deg, var(--blue2), var(--blue)); box-shadow: 0 12px 22px -12px var(--blue); display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), filter .25s, opacity .25s, background .3s;
  }
  .save:hover { transform: translateY(-2px); }
  .save:active { transform: scale(.97); }
  .save[aria-disabled="true"] { filter: grayscale(.6); opacity: .55; }
  .save .bars { display: none; align-items: flex-end; gap: 2px; height: 16px; }
  .save .bars i { width: 3px; border-radius: 1px; background: #fff; animation: sig .9s ease-in-out infinite; }
  .save .bars i:nth-child(1) { height: 5px; } .save .bars i:nth-child(2) { height: 9px; animation-delay: .15s; } .save .bars i:nth-child(3) { height: 13px; animation-delay: .3s; } .save .bars i:nth-child(4) { height: 16px; animation-delay: .45s; }
  @keyframes sig { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  .save.busy .bars { display: flex; }
  .save.done { background: linear-gradient(180deg, #2fd09b, var(--ok)); box-shadow: 0 12px 22px -12px var(--ok); }
  .saved { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .saved li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 14px; background: var(--soft); animation: savedIn .55s cubic-bezier(.34, 1.4, .64, 1) both; }
  @keyframes savedIn { from { opacity: 0; transform: translateY(-12px) scale(.96); } }
  .saved li.out { animation: savedOut .3s ease forwards; }
  @keyframes savedOut { to { opacity: 0; transform: translateX(30px); } }
  .saved svg.f { width: 27px; height: 18px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); }
  .saved b { display: block; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved small { display: block; font-size: 11px; color: var(--muted); }
  .ring { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .ring svg { width: 15px; height: 15px; }
  .saved li.fresh .ring svg { animation: ringing .14s ease-in-out 8 alternate; }
  @keyframes ringing { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .del { width: 30px; height: 30px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .del:hover { background: var(--line); color: var(--ink); }
  .del svg { width: 14px; height: 14px; }
  .empty { margin: 12px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  @media (max-width: 370px) { .body { padding: 14px; } .numWrap input, .ghost { font-size: 15.5px; padding-left: 9px; } .cc { padding: 0 7px 0 9px; gap: 5px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
    .strip { animation: none; }
  }
</style>
</head>
<body>
<svg class="defs" id="defs" aria-hidden="true"></svg>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <div class="sky" aria-hidden="true">
      <span class="cloud c1"></span><span class="cloud c2"></span>
      <span class="pole"></span>
      <div class="flagRig" id="rig"><div class="flag" id="flag"></div></div>
      <div class="flagName" id="flagName"><b id="fnName">Pakistan</b><span id="fnCode">+92 · mobile</span></div>
    </div>
    <div class="body">
      <h1 id="title">Add a phone number</h1>
      <p class="sub">For delivery updates from Lahore Bakehouse</p>

      <label class="lab" for="num">Mobile number</label>
      <div class="field" id="field">
        <button class="cc" id="cc" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="pop" aria-label="Country: Pakistan, +92">
          <svg class="mini" viewBox="0 0 30 20" aria-hidden="true"><use id="ccFlag" href="#f-PK"/></svg>
          <span id="ccCode">+92</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="numWrap">
          <span class="ghost" id="ghost" aria-hidden="true"><span class="typed" id="gTyped"></span><span id="gRest">300 1234567</span></span>
          <input id="num" type="tel" inputmode="tel" autocomplete="tel-national" aria-describedby="help">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
        </div>
        <div class="pop" id="pop">
          <input id="find" type="text" placeholder="Search country or code" aria-label="Search countries" aria-controls="opts" autocomplete="off">
          <ul class="opts" id="opts" role="listbox" aria-label="Countries"></ul>
        </div>
      </div>
      <p class="help" id="help" aria-live="polite"><span id="helpText">Pakistan mobiles start with 3</span><span class="digits" id="digits">0/10</span></p>

      <button class="save" id="save" type="button" aria-disabled="true"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="saveText">Save number</span></button>
      <ul class="saved" id="saved" aria-label="Saved numbers"></ul>
      <p class="empty" id="empty">Saved numbers show up here. Paste one with +code to switch country.</p>
      <p class="sr" id="live" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // ---------- Flags, drawn on a 30 x 20 grid ----------
  function star(cx, cy, r, n, rot, inner) {
    var p = [];
    for (var i = 0; i < n * 2; i++) { var a = rot + i * Math.PI / n, rr = i % 2 ? r * (inner || .4) : r; p.push((cx + Math.cos(a) * rr).toFixed(2) + "," + (cy + Math.sin(a) * rr).toFixed(2)); }
    return '<polygon points="' + p.join(" ") + '"/>';
  }
  var FLAGS = {
    PK: '<rect width="30" height="20" fill="#01411C"/><rect width="7.5" height="20" fill="#fff"/><circle cx="19" cy="10" r="5.6" fill="#fff"/><circle cx="20.6" cy="8.7" r="4.8" fill="#01411C"/><g fill="#fff">' + star(21.9, 7.4, 1.7, 5, -.35) + "</g>",
    AE: '<rect width="30" height="20" fill="#fff"/><rect width="30" height="6.67" fill="#00843D"/><rect y="13.33" width="30" height="6.67" fill="#000"/><rect width="8" height="20" fill="#EF3340"/>',
    GB: '<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#C8102E" stroke-width="1.4"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#C8102E" stroke-width="3.4"/>',
    US: (function () {
      var s = '<rect width="30" height="20" fill="#fff"/>';
      for (var i = 0; i < 13; i += 2) s += '<rect y="' + (i * 20 / 13).toFixed(3) + '" width="30" height="' + (20 / 13).toFixed(3) + '" fill="#B22234"/>';
      s += '<rect width="12.4" height="10.77" fill="#3C3B6E"/><g fill="#fff">';
      for (var r = 0; r < 5; r++) for (var c = 0; c < 6; c++) s += '<circle cx="' + (1.1 + c * 2.04).toFixed(2) + '" cy="' + (1.1 + r * 2.15).toFixed(2) + '" r=".45"/>';
      return s + "</g>";
    })(),
    CA: '<rect width="30" height="20" fill="#fff"/><rect width="7.5" height="20" fill="#D80621"/><rect x="22.5" width="7.5" height="20" fill="#D80621"/><path fill="#D80621" d="M15 4.2l1 2 1.2-.6-.4 3 1.6-1.6.4 1 1.8-.4-.6 1.8.8.4-3 2.4.3 1-3-.4V15.6h-.4v-2.8l-3 .4.3-1-3-2.4.8-.4-.6-1.8 1.8.4.4-1 1.6 1.6-.4-3 1.2.6z"/>',
    TR: '<rect width="30" height="20" fill="#E30A17"/><circle cx="11" cy="10" r="5" fill="#fff"/><circle cx="12.25" cy="10" r="4" fill="#E30A17"/><g fill="#fff">' + star(17.1, 10, 2, 5, Math.PI) + "</g>",
    MY: (function () {
      var s = '<rect width="30" height="20" fill="#fff"/>';
      for (var i = 0; i < 14; i += 2) s += '<rect y="' + (i * 20 / 14).toFixed(3) + '" width="30" height="' + (20 / 14).toFixed(3) + '" fill="#CC0001"/>';
      return s + '<rect width="15" height="11.43" fill="#010066"/><circle cx="5.6" cy="5.7" r="3.8" fill="#FFCC00"/><circle cx="6.6" cy="5.7" r="3.2" fill="#010066"/><g fill="#FFCC00">' + star(11.2, 5.7, 2.6, 14, -Math.PI / 2, .45) + "</g>";
    })(),
    QA: (function () {
      var s = '<rect width="30" height="20" fill="#8A1538"/><path fill="#fff" d="M0 0H9';
      for (var i = 0; i < 9; i++) s += "L11.4 " + (i * 20 / 9 + 10 / 9).toFixed(2) + "L9 " + ((i + 1) * 20 / 9).toFixed(2);
      return s + 'H0Z"/>';
    })(),
    DE: '<rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/>',
    BD: '<rect width="30" height="20" fill="#006A4E"/><circle cx="13.5" cy="10" r="6" fill="#F42A41"/>',
    JP: '<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#BC002D"/>',
    IT: '<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#CE2B37"/>'
  };
  $("#defs").innerHTML = Object.keys(FLAGS).map(function (k) { return '<symbol id="f-' + k + '" viewBox="0 0 30 20">' + FLAGS[k] + "</symbol>"; }).join("");

  // ---------- Countries: dial code, national format and what a mobile number looks like ----------
  var C = [
    { id: "PK", name: "Pakistan", code: "92", mask: "### #######", min: 10, max: 10, re: /^3/, rule: "start with 3" },
    { id: "AE", name: "United Arab Emirates", code: "971", mask: "## ### ####", min: 9, max: 9, re: /^5/, rule: "start with 5" },
    { id: "GB", name: "United Kingdom", code: "44", mask: "#### ######", min: 10, max: 10, re: /^7/, rule: "start with 7" },
    { id: "US", name: "United States", code: "1", mask: "(###) ###-####", min: 10, max: 10, re: /^[2-9]\d{2}[2-9]|^[2-9]\d{0,2}$/, rule: "have a 3-digit area code" },
    { id: "CA", name: "Canada", code: "1", mask: "(###) ###-####", min: 10, max: 10, re: /^[2-9]\d{2}[2-9]|^[2-9]\d{0,2}$/, rule: "have a 3-digit area code" },
    { id: "TR", name: "Turkey", code: "90", mask: "### ### ## ##", min: 10, max: 10, re: /^5/, rule: "start with 5" },
    { id: "MY", name: "Malaysia", code: "60", mask: "##-#### ####", min: 9, max: 10, re: /^1/, rule: "start with 1" },
    { id: "QA", name: "Qatar", code: "974", mask: "#### ####", min: 8, max: 8, re: /^[3567]/, rule: "start with 3, 5, 6 or 7" },
    { id: "DE", name: "Germany", code: "49", mask: "### ########", min: 10, max: 11, re: /^1[5-7]|^1$/, rule: "start with 15, 16 or 17" },
    { id: "BD", name: "Bangladesh", code: "880", mask: "####-######", min: 10, max: 10, re: /^1[3-9]|^1$/, rule: "start with 13 to 19" },
    { id: "JP", name: "Japan", code: "81", mask: "##-####-####", min: 10, max: 10, re: /^[789]0|^[789]$/, rule: "start with 70, 80 or 90" },
    { id: "IT", name: "Italy", code: "39", mask: "### ### ####", min: 9, max: 10, re: /^3/, rule: "start with 3" }
  ];
  var byId = {}; C.forEach(function (c) { byId[c.id] = c; });
  var EXAMPLE = { PK: "3001234567", AE: "501234567", GB: "7400123456", US: "4155550132", CA: "6045550198", TR: "5321234567", MY: "123456789", QA: "33123456", DE: "15123456789", BD: "1712345678", JP: "9012345678", IT: "3123456789" };

  // ---------- Formatting ----------
  function maskFor(c, n) { return c.id === "MY" && n <= 9 ? "##-### ####" : c.mask; }
  function format(d, c) { var m = maskFor(c, d.length), out = "", j = 0; for (var i = 0; i < m.length && j < d.length; i++) out += m[i] === "#" ? d[j++] : m[i]; return out; }
  function restOf(d, c) { var m = maskFor(c, Math.max(d.length, c.min)), j = 0, i = 0; for (; i < m.length && j < d.length; i++) if (m[i] === "#") j++; return m.slice(i).replace(/#/g, "0"); }

  // ---------- The waving flag: 22 strips of the same flag, each riding the wave a moment later ----------
  var flagEl = $("#flag"), STRIPS = 22, strips = [];
  for (var i = 0; i < STRIPS; i++) {
    var s = document.createElement("div"), w = 30 / STRIPS;
    s.className = "strip";
    s.style.setProperty("--i", i);
    s.style.setProperty("--k", (i / (STRIPS - 1)).toFixed(3)); // the edge by the pole hardly moves, the far edge swings most
    s.innerHTML = '<svg viewBox="' + (i * w).toFixed(3) + ' 0 ' + w.toFixed(3) + ' 20" preserveAspectRatio="none"><use href="#f-PK" width="30" height="20"/></svg>';
    flagEl.appendChild(s); strips.push(s.querySelector("use"));
  }

  // ---------- State ----------
  var country = byId.PK, digits = "", ccBtn = $("#cc"), num = $("#num"), field = $("#field"), help = $("#help"), helpText = $("#helpText"), save = $("#save"), live = $("#live");
  var rig = $("#rig"), raiseId = 0;
  async function raiseFlag(c) {
    var id = ++raiseId;
    if (reduce.matches) { setFlag(c); return; }
    rig.classList.remove("up"); rig.classList.add("down");
    await wait(450);
    if (id !== raiseId) return;
    setFlag(c);
    rig.classList.add("up"); rig.classList.remove("down");
  }
  function setFlag(c) {
    strips.forEach(function (u) { u.setAttribute("href", "#f-" + c.id); });
    $("#fnName").textContent = c.name; $("#fnCode").textContent = "+" + c.code + " · mobile";
    var fn = $("#flagName"); fn.classList.remove("swap"); void fn.offsetWidth; fn.classList.add("swap");
  }
  function setCountry(c, quiet) {
    if (c === country && !quiet) return;
    country = c;
    $("#ccFlag").setAttribute("href", "#f-" + c.id);
    $("#ccCode").textContent = "+" + c.code;
    ccBtn.setAttribute("aria-label", "Country: " + c.name + ", +" + c.code);
    digits = digits.slice(0, c.max);
    raiseFlag(c);
    render(true);
    live.textContent = c.name + " selected, +" + c.code;
  }
  function validity() {
    var d = digits, c = country;
    if (!d) return { s: "", t: c.name + " mobiles " + c.rule + ", like " + format(EXAMPLE[c.id], c) };
    if (!c.re.test(d)) return { s: "bad", t: c.name + " mobiles " + c.rule };
    if (d.length < c.min) { var left = c.min - d.length; return { s: "", t: left + " more digit" + (left > 1 ? "s" : "") }; }
    return { s: "ok", t: "Looks right · +" + c.code + " " + format(d, c) };
  }
  var dropNote = "";
  function render(keepCaret) {
    var f = format(digits, country);
    if (num.value !== f) num.value = f;
    $("#gTyped").textContent = f;
    $("#gRest").textContent = restOf(digits, country);
    var v = validity();
    field.classList.toggle("ok", v.s === "ok");
    field.classList.toggle("bad", v.s === "bad");
    help.className = "help" + (v.s ? " " + v.s : "");
    helpText.textContent = dropNote && !v.s ? dropNote : v.t; // the leading-0 note stays until the number is complete
    $("#digits").textContent = digits.length + "/" + country.max;
    save.setAttribute("aria-disabled", String(v.s !== "ok"));
    if (save.classList.contains("done")) { save.classList.remove("done"); $("#saveText").textContent = "Save number"; }
  }

  // ---------- Typing, pasting and +codes ----------
  function detect(all) {
    // longest dial code that the digits start with; +1 goes to the United States
    var best = null;
    C.forEach(function (c) { if (all.indexOf(c.code) === 0 && (!best || c.code.length > best.code.length)) best = c; });
    return best;
  }
  function takeRaw(raw) {
    var t = raw.trim(), intl = /^(\+|00)/.test(t), all = t.replace(/\D/g, "");
    if (intl) {
      if (t.indexOf("00") === 0) all = all.slice(2);
      var c = detect(all);
      if (c && all.length > c.code.length) {
        digits = all.slice(c.code.length).replace(/^0/, "").slice(0, c.max);
        if (c !== country) { country = c; setCountry(c, true); }
        dropNote = "";
        return true;
      }
      return false; // still typing the code: leave it as it is
    }
    if (all[0] === "0") { all = all.replace(/^0+/, ""); dropNote = "Leading 0 dropped: it is not needed after +" + country.code; }
    else if (!all) dropNote = "";
    digits = all.slice(0, country.max);
    return true;
  }
  num.addEventListener("input", function () {
    var raw = num.value, caret = num.selectionStart || raw.length, before = raw.slice(0, caret).replace(/\D/g, "").length;
    if (!takeRaw(raw)) { $("#gTyped").textContent = raw; $("#gRest").textContent = ""; return; }
    render();
    // put the caret back after the same number of digits
    var f = num.value, pos = 0, seen = 0;
    while (pos < f.length && seen < Math.min(before, digits.length)) { if (/\d/.test(f[pos])) seen++; pos++; }
    if (caret >= raw.length) pos = f.length;
    try { num.setSelectionRange(pos, pos); } catch (e) { /* type=tel always allows it */ }
  });
  num.addEventListener("keydown", function (e) {
    // Backspace right after a space or dash removes the digit before it, not just the gap
    if (e.key === "Backspace" && num.selectionStart === num.selectionEnd && num.selectionStart > 0) {
      var p = num.selectionStart, v = num.value;
      if (!/\d/.test(v[p - 1])) {
        e.preventDefault();
        var k = p - 1; while (k > 0 && !/\d/.test(v[k - 1])) k--;
        var idx = v.slice(0, k).replace(/\D/g, "").length;
        if (idx > 0) { digits = digits.slice(0, idx - 1) + digits.slice(idx); dropNote = ""; render(); var f = num.value, pos = 0, seen = 0; while (pos < f.length && seen < idx - 1) { if (/\d/.test(f[pos])) seen++; pos++; } num.setSelectionRange(pos, pos); }
      }
    }
    if (e.key === "Enter") { e.preventDefault(); doSave(save); }
  });

  // ---------- Country list ----------
  var pop = $("#pop"), find = $("#find"), opts = $("#opts"), shown = [], act = 0, popOpen = false;
  function fillList(q) {
    q = (q || "").trim().toLowerCase().replace(/^\+/, "");
    shown = C.filter(function (c) { return !q || c.name.toLowerCase().indexOf(q) > -1 || c.code.indexOf(q) === 0 || c.id.toLowerCase() === q; });
    opts.innerHTML = shown.length ? shown.map(function (c, i) {
      return '<li class="opt" role="option" id="o-' + c.id + '" data-id="' + c.id + '" aria-selected="' + (c === country) + '" style="--i:' + i + '"><svg viewBox="0 0 30 20" aria-hidden="true"><use href="#f-' + c.id + '"/></svg><span>' + c.name + "</span><small>+" + c.code + "</small></li>";
    }).join("") : '<li class="none">No country matches</li>';
    act = Math.max(0, shown.indexOf(country));
    paintAct();
  }
  function paintAct() {
    [].forEach.call(opts.querySelectorAll(".opt"), function (li, i) { li.classList.toggle("act", i === act); });
    var li = opts.querySelectorAll(".opt")[act];
    if (li) { find.setAttribute("aria-activedescendant", li.id); var t = li.offsetTop - opts.offsetTop; if (t < opts.scrollTop) opts.scrollTop = t; else if (t + li.offsetHeight > opts.scrollTop + opts.clientHeight) opts.scrollTop = t + li.offsetHeight - opts.clientHeight; }
  }
  // focus only moves when a person opened the list: the auto-demo must never pull focus out of the page around it
  function openPop(byUser) { if (popOpen) return; popOpen = true; find.value = ""; fillList(""); pop.classList.add("on"); ccBtn.setAttribute("aria-expanded", "true"); if (byUser) setTimeout(function () { if (popOpen) find.focus({ preventScroll: true }); }, 30); }
  function closePop(focusNum) { if (!popOpen) return; popOpen = false; pop.classList.remove("on"); ccBtn.setAttribute("aria-expanded", "false"); if (focusNum) num.focus({ preventScroll: true }); }
  function pick(c, byDemo) { closePop(!byDemo); setCountry(c); }
  ccBtn.addEventListener("click", function () { if (popOpen) closePop(false); else openPop(true); });
  find.addEventListener("input", function () { fillList(find.value); });
  find.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); act = Math.min(shown.length - 1, act + 1); paintAct(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(0, act - 1); paintAct(); }
    else if (e.key === "Enter") { e.preventDefault(); if (shown[act]) pick(shown[act]); }
    else if (e.key === "Escape") { e.preventDefault(); closePop(false); ccBtn.focus(); }
  });
  opts.addEventListener("click", function (e) { var li = e.target.closest(".opt"); if (li) pick(byId[li.dataset.id]); });
  document.addEventListener("pointerdown", function (e) { if (popOpen && !pop.contains(e.target) && !ccBtn.contains(e.target)) closePop(false); });

  // ---------- Save, with a saved list you can trim ----------
  var savedEl = $("#saved"), list = [], busy = false;
  function paintSaved(freshKey) {
    savedEl.innerHTML = list.map(function (s) {
      return '<li class="' + (s.key === freshKey ? "fresh" : "") + '" data-key="' + s.key + '"><svg class="f" viewBox="0 0 30 20" aria-hidden="true"><use href="#f-' + s.id + '"/></svg><div><b>+' + s.code + " " + s.pretty + "</b><small>" + s.name + '</small></div>' +
        '<span class="ring" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>' +
        '<button class="del" type="button" aria-label="Remove +' + s.code + " " + s.pretty + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>';
    }).join("");
    $("#empty").hidden = list.length > 0;
  }
  savedEl.addEventListener("click", function (e) {
    var b = e.target.closest(".del"); if (!b) return;
    var li = b.closest("li"), key = li.dataset.key;
    li.classList.add("out");
    setTimeout(function () { list = list.filter(function (s) { return s.key !== key; }); paintSaved(); live.textContent = "Number removed"; }, reduce.matches ? 0 : 280);
  });
  async function doSave(btn, fromDemo) {
    if (busy) return;
    var v = validity();
    if (v.s !== "ok") {
      field.classList.remove("shake"); void field.offsetWidth; field.classList.add("shake");
      help.className = "help bad"; helpText.textContent = digits ? v.t : "Type a mobile number first";
      return;
    }
    busy = true; btn.classList.add("busy"); $("#saveText").textContent = "Checking the number";
    await wait(reduce.matches ? 100 : 850);
    btn.classList.remove("busy"); busy = false;
    if (fromDemo && !demoOn) return;
    var key = country.code + digits;
    list = list.filter(function (s) { return s.key !== key; });
    list.unshift({ key: key, id: country.id, code: country.code, name: country.name, pretty: format(digits, country) });
    list = list.slice(0, 3);
    paintSaved(key);
    btn.classList.add("done"); $("#saveText").textContent = "Saved";
    live.textContent = "Saved +" + country.code + " " + format(digits, country);
  }
  save.addEventListener("click", function (e) { var btn = e.currentTarget; doSave(btn); });

  // ---------- Start ----------
  setFlag(country);
  render();

  // ---------- Auto demo: types a Pakistani number, switches to the UAE from the list, pastes a UK number ----------
  var demoOn = true;
  function stopDemo(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    list = []; paintSaved(); closePop(false); digits = ""; dropNote = "";
    if (country !== byId.PK) setCountry(byId.PK); else render();
  }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function typeDigits(s) { for (var i = 0; i < s.length; i++) { takeRaw(num.value + s[i]); render(); await pause(120 + Math.random() * 60); } }
  async function demo() {
    try {
      await pause(900);
      while (demoOn) {
        await typeDigits("03001234567"); await pause(900);
        dropNote = ""; render(); await pause(500);
        await doSave(save, true); await pause(1400);
        openPop(); await pause(700);
        act = 1; paintAct(); await pause(600);
        pick(byId.AE, true); digits = ""; render(); await pause(900);
        await typeDigits("501234567"); await pause(700);
        await doSave(save, true); await pause(1400);
        digits = ""; render(); await pause(400);
        takeRaw("+44 7400 123456"); render(); await pause(1700);
        await doSave(save, true); await pause(2200);
        list = []; paintSaved(); digits = ""; dropNote = ""; setCountry(byId.PK); await pause(1400);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
