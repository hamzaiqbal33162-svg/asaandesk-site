<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotline · Stock and supply · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
/* ===== Core UI parts: buttons, forms, tables, layers, toasts, charts (each app themes them with variables) ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 10px; --r-inp: 9px; --r-modal: 18px;
  --scrim: rgba(12, 14, 22, .45); --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .45);
  --toast-bg: #17191f; --toast-ink: #fff; --tip-bg: #121419; --tip-ink: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.i { width: 18px; height: 18px; flex: none; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1; text-decoration: none; white-space: nowrap; transition: transform .14s, background-color .2s, border-color .2s, box-shadow .2s, filter .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn .i { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.bell { position: relative; }
.bell .badge-n { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge-n[hidden] { display: none; }
.bell.ring .i { animation: ring .8s ease; transform-origin: 50% 10%; }
@keyframes ring { 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

/* Segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg-k { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--accent); transition: left .35s cubic-bezier(.3, 1.3, .5, 1), width .35s; }

/* Chips, badges, avatars, progress */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .cnt { opacity: .7; font-weight: 500; }
.badge { --b: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { --b: var(--ok); } .badge.warn { --b: var(--warn); } .badge.bad { --b: var(--bad); } .badge.info { --b: var(--info); } .badge.acc { --b: var(--accent); }
.ava { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; letter-spacing: .02em; }
.meter { height: 7px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--mc, var(--accent)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; }
.delta .i { width: 14px; height: 14px; }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full, .form .full { grid-column: 1 / -1; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-inp); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.err .inp { border-color: var(--bad); }
.ferr { font-size: 12px; color: var(--bad); }
.ferr:empty { display: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; appearance: none; -webkit-appearance: none; border-radius: 99px; background: var(--line-2); transition: background-color .25s; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* Data table */
.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 180px; max-width: 300px; display: block; }
.search .inp { padding-left: 34px; min-height: 36px; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th > button, .tbl th > .th { display: flex; align-items: center; gap: 4px; width: 100%; padding: 9px 12px; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
.tbl th.r > button, .tbl th.r > .th { justify-content: flex-end; }
.tbl th .ar { width: 0; height: 0; border: 4px solid transparent; opacity: 0; transition: opacity .2s; }
.tbl th[aria-sort="ascending"] .ar { border-bottom-color: currentColor; margin-top: -4px; opacity: 1; }
.tbl th[aria-sort="descending"] .ar { border-top-color: currentColor; margin-top: 4px; opacity: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tbody tr { transition: background-color .15s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tbody tr.rowin { animation: rowin .4s both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } }
.tbl .r { text-align: right; }
.tbl .acts { display: flex; gap: 4px; justify-content: flex-end; }
.cellname { display: flex; align-items: center; gap: 10px; }
.cellname small { display: block; color: var(--muted); font-size: 11.5px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pager .pbtns { display: flex; gap: 6px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty .i { width: 34px; height: 34px; opacity: .55; }
.empty b { color: var(--ink); }

/* Layers: modal, drawer, menu, command search */
.layer { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.layer .scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-modal); box-shadow: var(--shadow-lg); animation: pop .34s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 10px 20px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.layer.drawer-l { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { position: relative; height: 100%; width: min(460px, 100%); background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slidein .4s cubic-bezier(.2, .8, .2, 1) both; }
.drawer .modal-b { flex: 1; }
.drawer .modal-f { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.layer.closing .scrim { animation: fade .22s reverse both; }
.layer.closing .modal { animation: pop .22s reverse both; }
.layer.closing .drawer { animation: slidein .26s reverse both; }
.modal.shake { animation: shake .4s; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes slidein { from { transform: translateX(100%); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 6px 0 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 110; min-width: 190px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s both; }
.menu.wide { width: 330px; }
.menu > button, .menu .mi { display: flex; width: 100%; text-align: left; gap: 9px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; color: inherit; }
.menu > button:hover, .menu > button:focus-visible { background: var(--hover); outline: none; }
.menu > button.dz { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.menu .mh { padding: 6px 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.notes li { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
.notes li.unread { background: var(--hover); }
.notes li i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--info); }
.notes li.ok i { background: var(--ok); } .notes li.warn i { background: var(--warn); } .notes li.bad i { background: var(--bad); }
.notes small { display: block; color: var(--muted); font-size: 11px; }
.layer.cmdk-l { align-items: flex-start; padding-top: 12vh; }
.modal.cmdk .modal-b { padding: 0 12px 12px; }
.cmdk ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.cmdk li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; text-align: left; font-size: 13.5px; }
.cmdk li button small { margin-left: auto; color: var(--muted); }
.cmdk li[aria-selected="true"] button, .cmdk li button:hover { background: var(--hover); }

/* Toasts and tooltip */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 11px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; animation: toastin .4s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast > i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.toast.warn > i { background: var(--warn); } .toast.bad > i { background: var(--bad); } .toast.info > i { background: var(--info); }
.toast button { margin-left: 6px; border: 0; background: rgba(255, 255, 255, .16); color: inherit; border-radius: 7px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
.toast.out { animation: toastout .26s both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }
.tip { position: fixed; z-index: 160; left: 0; top: 0; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 250px; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .tr span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* Charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.6, .1, .2, 1) forwards; }
.chart .ar.in { animation: fade 1s .35s both; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.chart .dot { stroke: var(--surface); stroke-width: 2; opacity: 0; transition: opacity .15s; }
.chart.hov .guide, .chart.hov .dot { opacity: 1; }
.chart .bar { transition: opacity .2s; }
.chart.hov .bar:not(.hl) { opacity: .45; }
.chart .seg-arc { fill: none; transition: stroke-width .2s, opacity .2s; cursor: pointer; }
.chart .seg-arc.dim { opacity: .35; }
.chart .empty-c { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-box { position: relative; flex: none; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-size: 20px; line-height: 1.1; }
.donut-c span { font-size: 11px; color: var(--muted); }
.dleg { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: grid; gap: 6px; font-size: 12.5px; }
.dleg li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: default; transition: background-color .15s; }
.dleg li:hover { background: var(--hover); }
.dleg li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dleg li em { font-style: normal; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.blist { display: grid; gap: 10px; }
.blist .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; cursor: default; }
.blist .bl > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blist .bl b { font-variant-numeric: tabular-nums; }
.blist .bt { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.blist .bt i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--bc, var(--c1)); }
.funnel { display: grid; gap: 8px; }
.funnel .fs { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; align-items: center; gap: 10px; font-size: 12.5px; cursor: default; }
.funnel .fb { height: 30px; display: flex; justify-content: center; }
.funnel .fb i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--fc, var(--c1)); }
.funnel .fs em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Drag and drop */
.dragging { opacity: .35; }
.ghost { position: fixed !important; z-index: 140; margin: 0 !important; pointer-events: none; transform: rotate(2.5deg) scale(1.03); box-shadow: var(--shadow-lg); }
.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
[data-handle] { touch-action: none; cursor: grab; }

/* Page entrance */
.rise { animation: rise .62s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ===== Lotline look: mint white, deep teal ink, thin clinical lines, dense tables, icon rail ===== */
:root {
  --bg: #f1f8f5; --surface: #ffffff; --surface-2: #e8f3ee; --ink: #0b3b35; --muted: #56756d; --line: #d2e4dc; --line-2: #a7c8bb; --hover: rgba(14, 155, 118, .07);
  --accent: #0e9b76; --on-accent: #fff; --ok: #12845d; --warn: #a96500; --bad: #cc3636; --info: #2c6cae; --grid: #e2eee9;
  --c1: #0e9b76; --c2: #2c6cae; --c3: #d99a1c; --c4: #7a5cc7; --c5: #d4566a; --c6: #3aa9bb;
  --r: 6px; --r-btn: 6px; --r-inp: 6px; --r-modal: 10px;
  --toast-bg: #0b3b35; --tip-bg: #0b3b35; --scrim: rgba(6, 32, 27, .38); --shadow-lg: 0 24px 60px -24px rgba(6, 40, 34, .45);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #06130f; --surface: #0a1c18; --surface-2: #0f2722; --ink: #d4f1e7; --muted: #7fa397; --line: #17342e; --line-2: #285248; --hover: rgba(47, 211, 160, .08);
  --accent: #2fd3a0; --on-accent: #03201a; --ok: #3fd49b; --warn: #f0b64a; --bad: #ff6b6b; --info: #6fa8e8; --grid: #12302a;
  --c1: #2fd3a0; --c2: #6fa8e8; --c3: #f0c14a; --c4: #a68cf0; --c5: #f07b8e; --c6: #5fd0de;
  --toast-bg: #d4f1e7; --toast-ink: #06130f; --tip-bg: #d4f1e7; --tip-ink: #06130f; --scrim: rgba(0, 0, 0, .55); --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
body { font-size: 13px; background: var(--bg); }
.app { display: grid; grid-template-columns: 84px minmax(0, 1fr); min-height: 100vh; }

/* Icon rail with a sliding tinted marker and an edge bar */
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0; background: var(--surface); border-right: 1px solid var(--line); z-index: 60; overflow-y: auto; }
.logo { display: grid; place-items: center; width: 44px; height: 44px; }
.logo svg { width: 38px; height: 38px; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.logo:hover svg { transform: rotate(60deg); }
.nav { position: relative; display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 0 8px; }
.nav a { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px 8px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 650; letter-spacing: .01em; transition: color .2s; }
.nav a .i { width: 20px; height: 20px; transition: transform .25s; }
.nav a:hover { color: var(--ink); }
.nav a:hover .i { transform: translateY(-1px); }
.nav a[aria-current="page"] { color: var(--accent); }
.nav .marker { position: absolute; left: 8px; right: 8px; top: 0; height: 52px; border-radius: 8px; background: var(--hover); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); transition: transform .45s cubic-bezier(.25, 1.2, .35, 1), height .3s, opacity .3s; }
.nav .marker::before { content: ""; position: absolute; left: -9px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rail-foot { margin-top: auto; }
.scrim-nav { display: none; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 20px; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.crumb { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.menu-btn { display: none; }
.search-btn { min-width: 190px; justify-content: flex-start; color: var(--muted); font-weight: 500; }
.search-btn kbd { margin-left: auto; font: 600 10.5px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
main { padding: 16px 20px 36px; overflow-x: clip; }

/* Cards: thin outline, small radius, uppercase micro headings */
.grid { display: grid; gap: 12px; margin-bottom: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g75 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, border-color .25s; }
.card.lift:hover { transform: translateY(-2px); border-color: var(--line-2); box-shadow: 0 12px 26px -20px rgba(11, 59, 53, .55); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

.ch p { font-size: 12px; color: var(--muted); }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.bar-row p { color: var(--muted); max-width: 70ch; }
.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.kpi .lbl .i { width: 15px; height: 15px; color: var(--accent); }
.kpi .val { font-family: var(--mono); font-size: 23px; font-weight: 700; letter-spacing: -.03em; margin: 6px 0 4px; }
.kpi .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
.kpi .sp { width: 80px; }
.mono { font-family: var(--mono); }
.tbl { font-size: 12.5px; }
.tbl td { padding: 7px 10px; }
.tbl th > button, .tbl th > .th { padding: 8px 10px; }
.badge { border-radius: 4px; }
.chip { border-radius: 5px; }
.seg, .seg button, .seg-k { border-radius: 6px; }

/* Page entrance: a short scan from the top */
@keyframes rise { from { opacity: 0; transform: translateY(6px); clip-path: inset(0 0 40% 0); } }

/* Signature 1: stock runway with a what-if demand slider */
.whatif { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 6px; margin-bottom: 14px; flex-wrap: wrap; background: var(--surface-2); }
.whatif label { font-weight: 700; font-size: 12px; }
.whatif output { font-family: var(--mono); font-weight: 800; font-size: 15px; color: var(--accent); min-width: 54px; }
.rng { -webkit-appearance: none; appearance: none; flex: 1; min-width: 150px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--p, 33%), var(--line-2) var(--p, 33%)); cursor: pointer; }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); cursor: grab; transition: transform .15s; }
.rng:active::-webkit-slider-thumb { transform: scale(1.2); cursor: grabbing; }
.rng::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); cursor: grab; }
.runway { display: grid; gap: 8px; }
.rw { display: grid; grid-template-columns: 158px minmax(0, 1fr) 96px; align-items: center; gap: 10px; font-size: 12px; }
.rw .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
.rw .tr { position: relative; height: 15px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--surface-2) 0 calc(11.111% - 1px), var(--line) calc(11.111% - 1px) 11.111%); }
.rw .fill { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 3px; width: 0; background: var(--rc, var(--ok)); transition: width .35s cubic-bezier(.2, .8, .2, 1), background-color .3s; }
.rw .lead { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--ink); opacity: .55; }
.rw .d { font-family: var(--mono); text-align: right; font-size: 11.5px; }
.rw .d small { display: block; color: var(--muted); font-family: var(--font); font-size: 10.5px; }
.rw-scale { display: grid; grid-template-columns: 158px minmax(0, 1fr) 96px; gap: 10px; font-size: 10px; color: var(--muted); margin-top: 4px; }
.rw-scale div { display: flex; justify-content: space-between; font-family: var(--mono); }
.rw-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; }
.rw-key span { display: inline-flex; align-items: center; gap: 6px; }

/* Signature 2: supply flow with particles */
.flowbox { overflow-x: auto; }
.flow { display: block; width: 100%; min-width: 470px; height: auto; }
.flow .lk { fill: none; stroke-opacity: .2; transition: stroke-opacity .25s; }
.flow .lk:hover { stroke-opacity: .45; }
.flow .pt { fill: none; stroke-linecap: round; stroke-dasharray: 1.5 15; opacity: .95; pointer-events: none; animation: flow 1.7s linear 8; }
.flowbox:hover .pt { animation-iteration-count: infinite; }
@keyframes flow { to { stroke-dashoffset: -33; } }
.flow .nd { cursor: pointer; transition: opacity .25s; }
.flow text { font-size: 9.5px; fill: var(--ink); font-family: var(--font); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.flow text.h { font-size: 9px; fill: var(--muted); text-transform: uppercase; letter-spacing: .1em; stroke: none; font-weight: 700; }
.flow.focus .lk:not(.on), .flow.focus .pt:not(.on) { stroke-opacity: .04; opacity: .08; }
.flow.focus .nd:not(.on) { opacity: .25; }

/* Lists and misc */
.mlist { list-style: none; margin: 0; padding: 0; }
.mlist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.mlist li:last-child { border-bottom: 0; }
.mlist li > div { flex: 1; min-width: 0; }
.mlist small { display: block; color: var(--muted); font-size: 11px; }
.mlist .tag { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; }
.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.pipe button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; position: relative; overflow: hidden; transition: border-color .2s, transform .2s; }
.pipe button:hover { transform: translateY(-2px); border-color: var(--line-2); }
.pipe button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pipe button::after { content: ""; position: absolute; right: -14px; top: 50%; width: 28px; height: 28px; transform: translateY(-50%) rotate(45deg); border-top: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--surface); }
.pipe button:last-child::after { display: none; }
.pipe b { display: block; font-family: var(--mono); font-size: 20px; margin: 4px 0 2px; }
.pipe span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.pipe small { color: var(--muted); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.scard h4 { font-size: 14px; }
.scard .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.scard dl { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 0 0 10px; }
.scard dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.scard dd { margin: 0; font-family: var(--mono); font-weight: 700; font-size: 14px; }
.stars { color: var(--c3); letter-spacing: 1px; font-size: 13px; }
.stars em { color: var(--line-2); font-style: normal; }
.mchips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.mchips span { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--muted); }
.scard .row .btn { flex: 1; }
.meter { border-radius: 3px; height: 6px; }
.stockcell { min-width: 140px; }
.stockcell .meter { margin-top: 4px; }
.req { grid-column: 1 / -1; display: grid; gap: 6px; }
.req .rq { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: 12px; }
.req .rq .meter { grid-column: 1 / -1; }
.req .rq.short b { color: var(--bad); }
.items { list-style: none; margin: 0 0 14px; padding: 0; border: 1px solid var(--line); border-radius: 6px; }
.items li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.items li:last-child { border-bottom: 0; }
.timeline { list-style: none; margin: 4px 0 14px; padding: 0; }
.timeline li { position: relative; padding: 0 0 12px 22px; font-size: 12.5px; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 4px; width: 9px; height: 9px; border-radius: 2px; background: var(--line-2); }
.timeline li::after { content: ""; position: absolute; left: 8px; top: 15px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.done::before { background: var(--ok); }
.timeline li.now::before { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.fcside dl { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; margin: 0; font-size: 12.5px; }
.fcside dt { color: var(--muted); }
.fcside dd { margin: 0; font-family: var(--mono); font-weight: 700; text-align: right; }
.chart .band { opacity: .16; }
.chart .today { stroke: var(--ink); stroke-dasharray: 2 3; opacity: .5; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row p { font-size: 12px; color: var(--muted); }

/* Responsive */
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g75, .g21, .g3 { grid-template-columns: minmax(0, 1fr); } .search-btn { min-width: 0; } .search-btn span, .search-btn kbd { display: none; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 96px; transform: translateX(-110%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow-lg); }
  body.nav-open .rail { transform: none; }
  .scrim-nav { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
  body.nav-open .scrim-nav { display: block; }
  .menu-btn { display: inline-flex; }
  .sync { display: none; }
  .top { padding: 0 12px; }
  main { padding: 12px 12px 30px; }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pipe button::after { display: none; }
}
@media (max-width: 560px) { .rw, .rw-scale { grid-template-columns: 96px minmax(0, 1fr) 70px; } .rw .d small { display: none; } .g4 { gap: 8px; } .kpi .val { font-size: 19px; } .kpi .sp { display: none; } .crumb { display: none; } }
</style>

</div>
<script>
/* ================= Core helpers (small, shared, no libraries) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fin = (v) => (Number.isFinite(+v) ? +v : 0); /* any non-finite number (NaN, Infinity) becomes 0 */
const sum = (a, f = (x) => x) => a.reduce((s, x, i) => s + fin(f(x, i)), 0);
const mq = (q) => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const RM = mq("(prefers-reduced-motion: reduce)").matches;
const DAY = 864e5;
const MON = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
const WD = "Sun Mon Tue Wed Thu Fri Sat".split(" ");
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
const pad = (n) => String(n).padStart(2, "0");
let _uid = 0;
const uid = (p = "u") => p + (++_uid).toString(36);
const ease = (t) => 1 - Math.pow(1 - t, 3);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/* Seeded random numbers, so the demo data is the same on every load */
function rng(seed) {
  let a = seed >>> 0 || 1;
  const r = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.shuffle = (arr) => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  return r;
}
const PK = {
  first: "Ayesha Bilal Hamza Fatima Usman Zainab Ali Hira Saad Maryam Omar Sana Faisal Iqra Danish Mahnoor Kamran Rabia Imran Nida Tariq Amna Hassan Sadia Junaid Areeba Waqas Mehwish Fahad Kiran Shahzad Laiba Asad Rimsha Noman Anum Zeeshan Hafsa Adeel Saba".split(" "),
  last: "Khan Ahmed Malik Qureshi Siddiqui Butt Chaudhry Sheikh Raza Hussain Mirza Javed Iqbal Akhtar Abbasi Farooq Baig Rana Shah Aslam Nawaz Haider Anwar Zafar".split(" "),
  cities: "Lahore Karachi Islamabad Rawalpindi Faisalabad Multan Peshawar Quetta Sialkot Hyderabad Gujranwala Abbottabad Bahawalpur Sukkur".split(" "),
};
const person = (r) => r.pick(PK.first) + " " + r.pick(PK.last);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (n, cls = "") => `<span class="ava ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;
const phone = (r) => "03" + r.int(0, 4) + r.int(0, 9) + "-" + r.int(1000000, 9999999);

/* Number, money and date formatting */
const fmt = {
  n: (v, d = 0) => (+v || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }),
  short(v) {
    v = +v || 0; const a = Math.abs(v);
    const [div, suf] = a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e3 ? [1e3, "K"] : [1, ""];
    if (!suf) return String(Math.round(v));
    const x = v / div; return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1).replace(/\.0$/, "")) + suf;
  },
  pkr: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.n(Math.abs(v)),
  pkrS: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.short(Math.abs(v)),
  usd: (v) => (v < 0 ? "-$" : "$") + fmt.n(Math.abs(v)),
  usd2: (v) => (v < 0 ? "-$" : "$") + fmt.n(Math.abs(v), 2),
  usdS: (v) => (v < 0 ? "-$" : "$") + fmt.short(Math.abs(v)),
  pct: (v, d = 1) => ((+v || 0) * 100).toFixed(d) + "%",
  date: (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()]; },
  dateY: (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); },
  time: (t) => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); },
  dt: (t) => fmt.date(t) + ", " + fmt.time(t),
  iso: (t) => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); },
  ago(t) { const s = (Date.now() - t) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago"; return Math.floor(s / 86400) + " d ago"; },
  dur(ms) { const m = Math.max(0, Math.floor(ms / 60000)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; },
};

}

/* Supply flow: suppliers -> materials -> products, link width = monthly spend */
function flowSVG(host) {
  const d = D(), W = 520, H = 300, nw = 10, gap = 5, pm = {}, mv = {}, pv = {}, sv = {};
  d.products.forEach((p) => { const u = avgDem(p) * 30; Object.entries(p.bom).forEach(([mid, q]) => { const m = mat(mid); if (m) pm[p.id + "|" + mid] = u * q * m.cost; }); });
  Object.entries(pm).forEach(([k, v]) => { const [pid, mid] = k.split("|"); mv[mid] = (mv[mid] || 0) + v; pv[pid] = (pv[pid] || 0) + v; });
  d.materials.forEach((m) => { if (mv[m.id]) sv[m.sid] = (sv[m.sid] || 0) + mv[m.id]; });
  const cols = [
    d.suppliers.filter((s) => sv[s.id]).map((s) => ({ key: "s" + s.id, id: s.id, label: s.name, v: sv[s.id], c: supColor(s.id) })),
    d.materials.filter((m) => mv[m.id] && sup(m.sid)).sort((a, b) => supIdx(a.sid) - supIdx(b.sid)).map((m) => ({ key: "m" + m.id, id: m.id, label: m.name, v: mv[m.id], c: supColor(m.sid), sid: m.sid })),
    d.products.filter((p) => pv[p.id]).map((p) => ({ key: "p" + p.id, id: p.id, label: p.name.split(" ").slice(0, 2).join(" "), full: p.name, v: pv[p.id], c: "var(--ink)" })),
  ];
  const total = sum(cols[1], (n) => n.v) || 1;
  const sc = Math.min(...cols.map((c) => (H - 30 - Math.max(0, c.length - 1) * gap) / total));
  const xs = [126, 255, 384], node = {};
  cols.forEach((c, ci) => { let y = 22 + (H - 26 - (sum(c, (n) => n.v) * sc + Math.max(0, c.length - 1) * gap)) / 2; c.forEach((n) => { n.x = xs[ci]; n.y = y; n.h = Math.max(1.5, n.v * sc); n.o = y; n.i = y; y += n.h + gap; node[n.key] = n; }); });
  const links = [];
  cols[1].forEach((m) => { const s = node["s" + m.sid]; if (s) links.push({ a: s, b: m, v: m.v, c: m.c }); });
  cols[1].forEach((m) => d.products.forEach((p) => { const v = pm[p.id + "|" + m.id]; if (v && node["p" + p.id]) links.push({ a: m, b: node["p" + p.id], v, c: m.c }); }));
  links.forEach((l) => { const w = Math.max(1, l.v * sc), y1 = l.a.o + w / 2, y2 = l.b.i + w / 2; l.a.o += w; l.b.i += w; const x1 = l.a.x + nw, x2 = l.b.x, xm = (x1 + x2) / 2; l.d = `M${x1},${y1.toFixed(1)} C${xm},${y1.toFixed(1)} ${xm},${y2.toFixed(1)} ${x2},${y2.toFixed(1)}`; l.w = w; });
  host.innerHTML = `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="Supply flow from suppliers through materials to products"><text class="h" x="${xs[0] + nw}" y="11" text-anchor="end">Suppliers</text><text class="h" x="${xs[1] + 5}" y="11" text-anchor="middle">Materials</text><text class="h" x="${xs[2]}" y="11">Products</text>${links.map((l, i) => `<path class="lk" data-l="${i}" d="${l.d}" stroke-width="${l.w.toFixed(1)}" style="stroke:${l.c}"/>`).join("")}${links.map((l, i) => (l.w >= 1.5 ? `<path class="pt" data-l="${i}" d="${l.d}" stroke-width="${Math.min(3, l.w).toFixed(1)}" style="stroke:${l.c};animation-delay:${-(i % 7) * 0.23}s"/>` : "")).join("")}${cols.flat().map((n) => `<rect class="nd" data-n="${n.key}" x="${n.x}" y="${n.y.toFixed(1)}" width="${nw}" height="${n.h.toFixed(1)}" rx="2" style="fill:${n.c}" tabindex="0" aria-label="${esc(n.full || n.label)}"/>`).join("")}${cols[0].map((n) => `<text x="${n.x - 5}" y="${(n.y + n.h / 2 + 3).toFixed(1)}" text-anchor="end">${esc(n.label)}</text>`).join("")}${cols[1].filter((n) => n.h >= 8).map((n) => `<text x="${n.x + nw + 3}" y="${(n.y + n.h / 2 + 3).toFixed(1)}">${esc(n.label)}</text>`).join("")}${cols[2].map((n) => `<text x="${n.x + nw + 5}" y="${(n.y + n.h / 2 + 3).toFixed(1)}">${esc(n.label)}</text>`).join("")}</svg>`;
  const svg = host.firstChild;
  let focus = null;
  const setFocus = (key) => {
    focus = focus === key ? null : key;
    svg.classList.toggle("focus", !!focus);
    $$(".on", svg).forEach((x) => x.classList.remove("on"));
    if (!focus) return;
    const on = new Set([focus]);
    links.forEach((l, i) => { if (l.a.key === focus || l.b.key === focus) { $$(`[data-l="${i}"]`, svg).forEach((x) => x.classList.add("on")); on.add(l.a.key); on.add(l.b.key); } });
    on.forEach((k) => { const r = svg.querySelector(`[data-n="${k}"]`); if (r) r.classList.add("on"); });
  };
  svg.addEventListener("pointermove", (e) => {
    const lk = e.target.closest(".lk"), nd = e.target.closest(".nd");
    if (lk) { const l = links[+lk.dataset.l]; Tip.show(`<b>${esc(l.a.full || l.a.label)} → ${esc(l.b.full || l.b.label)}</b>${tipRow(l.c, "Per month", money(l.v))}`, e.clientX, e.clientY); }
    else if (nd) { const n = node[nd.dataset.n]; Tip.show(`<b>${esc(n.full || n.label)}</b>${tipRow(n.c, "Flow per month", money(n.v))}<div class="muted" style="margin-top:4px;font-size:11px">Click to trace it</div>`, e.clientX, e.clientY); }
    else Tip.hide();
  });
  svg.addEventListener("pointerleave", Tip.hide);
  svg.addEventListener("click", (e) => { const nd = e.target.closest(".nd"); setFocus(nd ? nd.dataset.n : focus); });
  svg.addEventListener("keydown", (e) => { const nd = e.target.closest(".nd"); if (nd && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setFocus(nd.dataset.n); } });
}

/* Forecast chart: actual line, dashed forecast and a confidence band */
function forecastChart(el, o) {
  Chart.mount(el, draw);
  draw("enter");
  function draw(mode) {
    const W = Math.max(260, el.clientWidth || 640), H = 250; el._w = W;
    const nH = o.hist.length, nF = o.fc.length, n = nH + nF;
    const sc = nice(0, Math.max(...o.hist, ...o.hi, 1) * 1.05, 4);
    const padL = Math.max(...sc.ticks.map((t) => fmt.short(t).length)) * 6.4 + 14, padR = 12, padT = 12, padB = 26, pw = W - padL - padR, ph = H - padT - padB;
    const X = (i) => padL + (i * pw) / Math.max(1, n - 1), Y = (v) => padT + ph - ((v - sc.min) / (sc.max - sc.min)) * ph;
    const every = Math.max(1, Math.ceil(n / Math.floor(pw / 60)));
    const hp = o.hist.map((v, i) => [X(i), Y(v)]);
    const fp = [[X(nH - 1), Y(o.hist[nH - 1])], ...o.fc.map((v, j) => [X(nH + j), Y(v)])];
    const up = [[X(nH - 1), Y(o.hist[nH - 1])], ...o.hi.map((v, j) => [X(nH + j), Y(v)])];
    const lo = [[X(nH - 1), Y(o.hist[nH - 1])], ...o.lo.map((v, j) => [X(nH + j), Y(v)])].reverse();
    let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" tabindex="0" aria-label="Demand history and forecast">`;
    sc.ticks.forEach((t) => { svg += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="axis" x="${padL - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmt.short(t)}</text>`; });
    o.labels.forEach((l, i) => { if (i % every === 0) svg += `<text class="axis" x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
    svg += `<path class="band ${mode === "enter" ? "ar in" : ""}" d="${monoPath(up)} L${monoPath(lo).slice(1)}Z" style="fill:var(--c1)"/>`;
    svg += `<line class="today" x1="${X(nH - 1)}" x2="${X(nH - 1)}" y1="${padT}" y2="${padT + ph}"/><text class="axis" x="${X(nH - 1) + 4}" y="${padT + 10}">Today</text>`;
    svg += `<path class="ln ${mode === "enter" ? "draw" : ""}" pathLength="1" d="${monoPath(hp)}" style="stroke:var(--c2)"/><path class="ln ${mode === "enter" ? "ar in" : ""}" d="${monoPath(fp)}" style="stroke:var(--c1);stroke-dasharray:6 5"/>`;
    svg += `<line class="guide" y1="${padT}" y2="${padT + ph}"/><circle class="dot" r="4.5" style="fill:var(--c1)"/><rect class="hit" x="${padL}" y="0" width="${pw}" height="${H}"/></svg>`;
    el.innerHTML = svg + `<div class="legend"><span><i class="sw" style="background:var(--c2)"></i>Actual units</span><span><i class="sw" style="background:var(--c1)"></i>Forecast</span><span><i class="sw" style="background:var(--c1);opacity:.3"></i>80% range</span></div>`;
    const s = el.firstChild;
    let idx = -1;
    const show = (i, cx, cy) => {
      idx = clamp(i, 0, n - 1); el.classList.add("hov");
      const isF = idx >= nH, v = isF ? o.fc[idx - nH] : o.hist[idx];
      s.querySelector(".guide").setAttribute("x1", X(idx)); s.querySelector(".guide").setAttribute("x2", X(idx));
      const dt = s.querySelector(".dot"); dt.setAttribute("cx", X(idx)); dt.setAttribute("cy", Y(v)); dt.style.fill = isF ? "var(--c1)" : "var(--c2)";
      Tip.show(`<b>${esc(o.labels[idx])}</b>${isF ? tipRow("var(--c1)", "Forecast", fmt.n(v) + " units") + tipRow("transparent", "Range", fmt.n(o.lo[idx - nH]) + " – " + fmt.n(o.hi[idx - nH])) : tipRow("var(--c2)", "Actual", fmt.n(v) + " units")}`, cx, cy);
    };
    s.addEventListener("pointermove", (e) => { const r = s.getBoundingClientRect(); const x = ((e.clientX - r.left) * W) / (r.width || W); show(Math.round(((x - padL) / pw) * (n - 1)), e.clientX, e.clientY); });
    s.addEventListener("pointerleave", () => { el.classList.remove("hov"); Tip.hide(); });
    s.addEventListener("keydown", (e) => { if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return; e.preventDefault(); const r = s.getBoundingClientRect(); const i = idx < 0 ? nH - 1 : idx + (e.key === "ArrowRight" ? 1 : -1); show(i, r.left + (X(clamp(i, 0, n - 1)) / W) * r.width, r.top + 20); });
    s.addEventListener("blur", () => { el.classList.remove("hov"); Tip.hide(); });
  }
}
function forecastData(p, h) {
  const H = 56, hist = kpiSpark(H, (o) => dem(p, o)), base = avgDem(p), wm = sum(WK) / 7;
  const labels = kpiSpark(H, (o) => fmt.date(TODAY + o * DAY));
  const fc = [], lo = [], hi = [];
  for (let j = 1; j <= h; j++) { const t = TODAY + j * DAY; const v = base * (WK[new Date(t).getDay()] / wm) * (1 + 0.004 * j); const b = Math.min(0.5, 0.12 + 0.009 * j); fc.push(Math.round(v)); lo.push(Math.round(v * (1 - b))); hi.push(Math.round(v * (1 + b))); labels.push(fmt.date(t)); }
  return { hist, fc, lo, hi, labels };
}

function lotDrawer(l) {
  if (!l) return;
  const p = prod(l.pid);
  const dr = drawer({
    title: `Lot ${esc(l.code)}`,
    body: `<dl class="dl"><dt>Product</dt><dd>${esc(pName(l.pid))}</dd><dt>Units left</dt><dd>${fmt.n(l.qty)}</dd><dt>Made</dt><dd>${fmt.dateY(l.made)}</dd><dt>Expiry</dt><dd>${fmt.dateY(l.expiry)} (${days(l.expiry)} days)</dd><dt>Status</dt><dd>${badge(l.status, l.status === "Released" ? "ok" : "bad")}</dd>${l.reason ? `<dt>Reason</dt><dd>${esc(l.reason)}</dd>` : ""}<dt>Value at cost</dt><dd>${p ? money(l.qty * unitCost(p)) : "—"}</dd></dl>
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px">Traceability: material lots used</h3>
      <ul class="items">${(l.trace || []).map((t) => `<li><span>${esc(matName(t.mid))}</span><b class="mono">${esc(t.lot)}${t.qty ? " · " + fmt.n(t.qty) : ""}</b></li>`).join("") || "<li class='muted'>No trace recorded</li>"}</ul>`,
    foot: `${days(l.expiry) < 0 ? `<button class="btn danger" data-wo>${ic("trash")}Write off</button>` : ""}<button class="btn" data-adj>${ic("edit")}Adjust</button><button class="btn pri" data-q>${l.status === "Quarantine" ? "Release lot" : "Quarantine"}</button>`,
  });
  dr.el.querySelector("[data-adj]").addEventListener("click", () => { dr.close(); adjustLot(l); });
  dr.el.querySelector("[data-q]").addEventListener("click", () => { dr.close(); toggleQuarantine(l); });
  const w = dr.el.querySelector("[data-wo]"); if (w) w.addEventListener("click", async () => { if (await confirmDlg(`Write off ${fmt.n(l.qty)} expired units of lot ${esc(l.code)}?`, { title: "Write off lot?", ok: "Write off" })) { l.qty = 0; save(); dr.close(); R.refresh(); toast(`Lot ${l.code} written off`, "warn"); } });
}
function toggleQuarantine(l) {
  if (l.status === "Quarantine") {
    confirmDlg(`Release lot ${esc(l.code)} back into sellable stock?`, { title: "Release lot?", ok: "Release", danger: false }).then((ok) => { if (!ok) return; l.status = "Released"; l.reason = ""; save(); R.refresh(); toast(`Lot ${l.code} released`); });
    return;
  }
  formModal({
    title: `Quarantine lot ${esc(l.code)}`, submit: "Quarantine",
    fields: [{ name: "reason", label: "Reason", type: "select", full: 1, options: ["Failed QC: fill weight", "Failed QC: microbial test", "Customer complaint", "Packaging defect", "Supplier recall"] }, { name: "note", label: "Note", full: 1, placeholder: "What did you see?" }],
    onSubmit: (v) => { l.status = "Quarantine"; l.reason = v.reason + (v.note ? ` (${v.note})` : ""); save(); R.refresh(); toast(`Lot ${l.code} moved to quarantine`, "warn"); Bell.add(`Lot ${l.code} quarantined: ${v.reason}`, "warn", true); },
  });
}
function adjustLot(l) {
  formModal({

function poNext(po) {
  if (po.status === "Draft") { po.status = "Sent"; po.eta = TODAY + ((sup(po.sid) || { lead: 7 }).lead) * DAY; save(); R.refresh(); toast(`${po.id} sent to ${supName(po.sid)}`); }
  else if (po.status === "Sent") { po.status = "In transit"; save(); R.refresh(); toast(`${po.id} is on its way`, "info"); }
  else if (po.status === "In transit") receivePO(po);
}
function receivePO(po) {
  const lines = po.lines.filter((l) => mat(l.mid));
  if (!lines.length) { po.status = "Received"; po.recAt = Date.now(); save(); R.refresh(); return toast(`${po.id} closed (materials were removed)`, "info"); }
  const fields = [], values = {};
  lines.forEach((l, i) => {
    const x = mat(l.mid);
    fields.push({ name: "q" + i, label: `${x.name}: received (${x.unit})`, type: "number", min: 0, required: 1, hint: `Ordered ${fmt.n(l.qty)}` });
    fields.push({ name: "lot" + i, label: "Supplier lot", required: 1 });
    if (x.shelf) fields.push({ name: "e" + i, label: "Expiry date", type: "date", required: 1, validate: (v) => (parseISO(v) <= TODAY ? "Must be a future date" : "") });
    values["q" + i] = l.qty; values["lot" + i] = "R-" + Math.floor(10000 + Math.random() * 89999); values["e" + i] = fmt.iso(TODAY + (x.shelf || 365) * DAY);
  });
  formModal({
    title: `Receive ${esc(po.id)}`, submit: "Book in", wide: 1, values, fields,
    note: `From ${esc(supName(po.sid))}. Count each line; any short line is flagged.`,
    onSubmit: (v) => {
      let short = 0;
      lines.forEach((l, i) => { const x = mat(l.mid); const q = v["q" + i]; l.rec = q; if (q < l.qty) short++; if (q > 0) x.lots.push({ lot: v["lot" + i], qty: q, expiry: x.shelf ? parseISO(v["e" + i]) : null, rec: Date.now() }); });
      po.status = "Received"; po.recAt = Date.now(); save(); R.refresh();
      toast(`${po.id} booked in: ${lines.length} lot${lines.length > 1 ? "s" : ""} added`, short ? "warn" : "ok");
      Bell.add(short ? `${po.id} arrived with ${short} short line${short > 1 ? "s" : ""}` : `${po.id} received in full`, short ? "warn" : "ok");
    },
  });
}

const woNeeds = (w) => { const p = prod(w.pid); return p ? Object.entries(p.bom).map(([mid, q]) => ({ x: mat(mid), mid, need: q * w.qty })) : []; };
const canRun = (w) => woNeeds(w).every((n) => n.x && mUsable(n.x) >= n.need);
function startWO(w) {
  if (!prod(w.pid)) return toast("That product no longer exists", "warn");
  const short = woNeeds(w).filter((n) => !n.x || mUsable(n.x) < n.need);
  if (short.length) return toast(`Short of ${short.map((n) => matName(n.mid)).join(", ")}; reorder first`, "bad");
  w.issued = woNeeds(w).map((n) => ({ mid: n.mid, picks: takeFEFO(n.x.lots, n.need) }));
  D().materials.forEach((x) => (x.lots = x.lots.filter((l) => l.qty > 0)));
  w.status = "In progress"; save(); R.refresh();
  toast(`${w.id} started: materials issued first-expiry-first-out`);
  if (D().settings.alerts) lowMats().forEach((x) => { if (woNeeds(w).some((n) => n.mid === x.id)) Bell.add(`${x.name} is below its reorder point after ${w.id}`, "bad"); });
}
function completeWO(w) {
  const p = prod(w.pid); if (!p) return toast("That product no longer exists", "warn");

  w.status = "Done"; w.lot = code; save(); R.refresh();
  toast(`${w.id} complete: lot ${code} with ${fmt.n(w.qty)} units released`); Bell.add(`New lot ${code} of ${p.name} is ready`, "ok", true);
}

every(30000, () => { $("#sync").textContent = fmt.ago(synced); });
