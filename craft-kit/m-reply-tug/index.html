<!doctype html>
<!-- Chill & Craft · Reply Tug · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reply Tug · swipe a chat bubble to reply</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: sea glass and sand (light), deep navy (dark) ---------- */
  :root {
    --bg: #d6ece8;
    --bg2: #b9e0da;
    --glass1: #9fd6cf;
    --glass2: #b9d7f2;
    --device: #f1f7f6;
    --frame: #17252d;
    --wall-ink: rgba(29, 111, 216, 0.07);
    --head: rgba(250, 253, 252, 0.86);
    --ink: #10222b;
    --muted: #5b717d;
    --line: rgba(16, 34, 43, 0.09);
    --mine-a: #1b67d0;
    --mine-b: #2f8cf0;
    --them: #f5e8d0;
    --them-ink: #2c2416;
    --accent: #1b67d0;
    --read: #b8f3ff;
    --card: #ffffff;
    --composer: #ffffff;
    --send-off: #c7d3d8;
    --stamp: #6f8692;
    --c-a: #d4603d;
    --c-b: #0d8578;
    --c-z: #7656cc;
    --ghost-b: rgba(16, 34, 43, 0.55);
    --ghost-f: rgba(27, 103, 208, 0.16);
    --shadow: rgba(16, 60, 70, 0.3);
    --focus: #1b67d0;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #050f1c;
    --bg2: #0a2036;
    --glass1: #0f4a52;
    --glass2: #173a6b;
    --device: #0a1525;
    --frame: #02060b;
    --wall-ink: rgba(120, 180, 255, 0.06);
    --head: rgba(10, 21, 37, 0.88);
    --ink: #e6f0f6;
    --muted: #8ba2b4;
    --line: rgba(255, 255, 255, 0.08);
    --mine-a: #2468d6;
    --mine-b: #3b8ef5;
    --them: #362e22;
    --them-ink: #f3e8d4;
    --accent: #5ea6ff;
    --read: #9eeaff;
    --card: #12223a;
    --composer: #102037;
    --send-off: #2a3b52;
    --stamp: #8197aa;
    --c-a: #ff9573;
    --c-b: #52d2c1;
    --c-z: #b59cff;
    --ghost-b: rgba(255, 255, 255, 0.8);
    --ghost-f: rgba(94, 166, 255, 0.2);
    --shadow: rgba(0, 0, 0, 0.65);
    --focus: #8ec2ff;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 640px at 85% 10%, var(--bg2), transparent 60%),
      radial-gradient(800px 600px at 0% 100%, color-mix(in srgb, var(--glass2) 55%, transparent), transparent 60%),
      var(--bg);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }

  /* ---------- Stage ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 64px; padding: 16px; overflow: hidden; }
  .pebble { position: absolute; pointer-events: none; border-radius: 42% 58% 61% 39% / 47% 41% 59% 53%; filter: blur(0.5px); animation: drift 16s ease-in-out infinite alternate; }
  .pebble.p1 { width: 300px; height: 230px; left: -90px; top: 8%; background: var(--glass1); opacity: 0.55; }
  .pebble.p2 { width: 220px; height: 260px; right: -70px; bottom: -40px; background: var(--glass2); opacity: 0.6; animation-duration: 20s; }
  .pebble.p3 { width: 70px; height: 56px; right: 18%; top: 14%; background: var(--glass1); opacity: 0.7; animation-duration: 12s; }
  @keyframes drift { to { transform: translate(20px, -18px) rotate(14deg); border-radius: 55% 45% 40% 60% / 52% 60% 40% 48%; } }

  .caption { display: none; width: 270px; position: relative; }
  .caption .eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .caption h1 { margin: 0 0 10px; font-size: 44px; line-height: 1; letter-spacing: -0.04em; }
  .caption p { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .caption ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .caption li { display: inline-flex; align-items: center; gap: 8px; width: fit-content; padding: 7px 12px 7px 9px; border-radius: 999px; font-size: 13px; font-weight: 650; background: var(--card); box-shadow: 0 6px 16px -10px var(--shadow); }
  .caption li i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .caption li:nth-child(2) i { background: var(--c-b); }
  .caption li:nth-child(3) i { background: var(--c-a); }
  @media (min-width: 900px) { .caption { display: block; } }

  /* ---------- Phone ---------- */
  .device {
    position: relative;
    width: min(390px, 100%);
    height: clamp(540px, calc(100vh - 32px), 760px);
    height: clamp(540px, calc(100dvh - 32px), 760px);
    display: flex;
    flex-direction: column;
    border-radius: 46px;
    overflow: hidden;
    isolation: isolate;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='90'><g fill='none' stroke='%231b67d0' stroke-opacity='.07' stroke-width='2' stroke-linecap='round'><path d='M8 20q8-8 16 0t16 0'/><path d='M70 64q8-8 16 0t16 0'/><circle cx='92' cy='18' r='4'/><circle cx='28' cy='70' r='3'/></g></svg>"),
      linear-gradient(to bottom, color-mix(in srgb, var(--glass1) 18%, var(--device)), var(--device) 40%);
    box-shadow: 0 0 0 9px var(--frame), 0 0 0 10px color-mix(in srgb, var(--frame) 60%, #888), 0 50px 90px -30px var(--shadow);
  }
  .island { position: absolute; top: 10px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 20px; background: #0b0b0d; z-index: 5; }
  .status { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-size: 14px; font-weight: 700; background: var(--head); }
  .status svg { display: block; }

  .chat-head {
    position: relative; z-index: 2; flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 4px 12px 10px 16px;
    background: var(--head);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .avs { display: flex; flex: none; position: relative; }
  .avs .av { width: 30px; height: 30px; font-size: 12.5px; box-shadow: 0 0 0 2px var(--device); }
  .avs .av + .av { margin-left: -6px; }
  .avs::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: #2fbf71; box-shadow: 0 0 0 2px var(--device); animation: online 2.4s ease-in-out infinite; }
  @keyframes online { 50% { transform: scale(0.75); } }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
  .who span.typing { color: var(--c-b); font-weight: 650; }
  .icon-btn {
    flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: var(--muted); background: transparent;
    transition: background 0.2s, color 0.2s, transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .icon-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:hover { background: var(--line); color: var(--ink); }
  .icon-btn:active { transform: scale(0.88); }
  .icon-btn.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }

  /* ---------- Thread ---------- */
  .thread {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 12px 12px;
    touch-action: pan-y;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 16px);
    mask-image: linear-gradient(to bottom, transparent, #000 16px);
  }
  .thread::-webkit-scrollbar { display: none; }
  .day { display: block; width: fit-content; margin: 6px auto 10px; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--card) 70%, transparent); box-shadow: 0 1px 2px var(--line); }

  .p-a { --pc: var(--c-a); } .p-b { --pc: var(--c-b); } .p-z { --pc: var(--c-z); } .p-me { --pc: var(--accent); }
  .av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--pc); color: #fff; font-weight: 800; font-size: 12px; }
  :root[data-theme="dark"] .av { color: #0a1525; }

  .msg { position: relative; display: flex; margin-top: 4px; }
  .msg.gap { margin-top: 12px; }
  .msg.me { justify-content: flex-end; }
  .msg .inner {
    display: flex; align-items: flex-end; gap: 7px; max-width: 82%;
    transform: translateX(calc(var(--tx, 0px) + var(--dx, 0px)));
  }
  .msg.cont .av { visibility: hidden; }
  .bubble {
    position: relative;
    min-width: 0;
    padding: 7px 12px 8px;
    font-size: 14.5px;
    line-height: 1.38;
    border-radius: 18px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05), 0 8px 16px -12px rgba(0, 0, 0, 0.35);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .msg.dragging .bubble { cursor: grabbing; box-shadow: 0 14px 26px -14px rgba(0, 0, 0, 0.45); }
  .them .bubble { background: var(--them); color: var(--them-ink); border-bottom-left-radius: 6px; }
  .me .bubble { background: linear-gradient(160deg, var(--mine-b), var(--mine-a)); color: #fff; border-bottom-right-radius: 6px; padding-right: 36px; }
  .from { display: block; font-size: 12px; font-weight: 750; color: var(--pc); margin-bottom: 1px; }
  .msg.cont .from { display: none; }
  .text { margin: 0; overflow-wrap: anywhere; }
  .meta { position: absolute; right: 10px; bottom: 7px; width: 18px; height: 12px; color: rgba(255, 255, 255, 0.72); }
  .meta.read { color: var(--read); }
  .meta svg { display: block; width: 18px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* quote inside a bubble: a real button that jumps to the original */
  .quote {
    position: relative; display: block; width: 100%; text-align: left;
    margin: 3px 0 5px; padding: 5px 9px 6px 12px; border: 0; border-radius: 10px;
    background: rgba(0, 0, 0, 0.06); color: inherit; font: inherit; font-size: 12.5px; line-height: 1.3;
    cursor: pointer; overflow: hidden;
  }
  .quote::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3.5px; background: var(--pc); }
  .quote b { display: block; font-size: 12px; color: var(--pc); }
  .quote span { display: block; opacity: 0.82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  .quote:hover { background: rgba(0, 0, 0, 0.1); }
  .me .bubble .quote { --pc: #e3f1ff; background: rgba(255, 255, 255, 0.17); }
  :root[data-theme="dark"] .them .quote { background: rgba(255, 255, 255, 0.07); }

  /* reply hint behind a bubble: arrow + filling ring */
  .hint {
    position: absolute; left: 4px; top: 50%; width: 32px; height: 32px;
    transform: translateY(-50%) scale(calc(0.45 + var(--hp, 0) * 0.55)) rotate(calc((1 - var(--hp, 0)) * -80deg));
    opacity: calc(var(--hp, 0) * 1.6);
    pointer-events: none;
  }
  .hint svg { width: 32px; height: 32px; display: block; overflow: visible; }
  .hbg { fill: color-mix(in srgb, var(--accent) 12%, var(--device)); transition: fill 0.2s; }
  .hring { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 81.7; stroke-dashoffset: 81.7; transform: rotate(-90deg); transform-origin: 16px 16px; stroke-linecap: round; }
  .harr { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
  .msg.armed .hbg { fill: var(--accent); }
  .msg.armed .harr { stroke: #fff; }

  /* timestamps revealed by pulling the whole thread left */
  .stamp {
    position: absolute; right: 4px; top: 50%;
    font-size: 11px; font-weight: 650; color: var(--stamp); white-space: nowrap;
    transform: translate(calc(100% + 10px + var(--tx, 0px)), -50%);
    opacity: var(--tp, 0);
    pointer-events: none;
  }

  .bubble.picked { animation: picked 0.6s ease-out; }
  @keyframes picked { 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }
  .bubble.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 35% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 45%, transparent); transform: scale(1.04); } 100% { box-shadow: 0 0 0 0 transparent; transform: none; } }

  .typing .bubble { padding: 12px 14px; }
  .tdots { display: flex; gap: 4px; }
  .tdots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.45; animation: hop 1s ease-in-out infinite; }
  .tdots i:nth-child(2) { animation-delay: 0.15s; } .tdots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hop { 30% { transform: translateY(-5px); opacity: 1; } 60% { transform: none; opacity: 0.45; } }

  /* ---------- Composer ---------- */
  .composer { position: relative; z-index: 2; flex: none; padding: 8px 10px 14px; background: var(--head); border-top: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .quote-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
  .quote-wrap.open { grid-template-rows: 1fr; }
  .qclip { overflow: hidden; min-height: 0; }
  .quote-card {
    position: relative; display: flex; align-items: center; gap: 10px;
    margin: 2px 2px 8px; padding: 8px 6px 8px 14px; border-radius: 14px;
    background: var(--card); box-shadow: 0 6px 16px -12px var(--shadow);
    transform: translateY(18px) scale(0.96); opacity: 0;
    transition: transform 0.5s cubic-bezier(0.3, 1.55, 0.5, 1), opacity 0.25s;
    overflow: hidden;
  }
  .quote-wrap.open .quote-card { transform: none; opacity: 1; }
  .quote-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc); }
  .qtext { flex: 1; min-width: 0; }
  .qtext b { display: block; font-size: 12.5px; color: var(--pc); }
  .qtext span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qarrow { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--pc); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar input {
    flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 22px;
    border: 1px solid var(--line); background: var(--composer); color: var(--ink);
    font: inherit; font-size: 15px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .bar input::placeholder { color: var(--muted); }
  .bar input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .send {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: #fff; background: var(--send-off); overflow: hidden;
    transition: background 0.25s, transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.25s;
  }
  .send.ready { background: linear-gradient(160deg, var(--mine-b), var(--mine-a)); box-shadow: 0 8px 18px -8px var(--mine-a); transform: scale(1.06); }
  .send:active { transform: scale(0.88); }
  .send svg { width: 20px; height: 20px; fill: currentColor; }

  .ghost {
    position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; z-index: 9; pointer-events: none;
    background: var(--ghost-f); border: 2px solid var(--ghost-b);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    opacity: 0; transition: opacity 0.3s;
  }
  .ghost::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--ghost-b); opacity: 0.35; transform: scale(0.5); transition: transform 0.2s; }
  .ghost.on { opacity: 1; }
  .ghost.press::after { transform: scale(1); }

  @media (max-width: 480px) {
    .stage { padding: 0; }
    .device { width: 100%; height: 100vh; height: 100dvh; min-height: 540px; border-radius: 0; box-shadow: none; }
    .island, .pebble { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <i class="pebble p1" aria-hidden="true"></i><i class="pebble p2" aria-hidden="true"></i><i class="pebble p3" aria-hidden="true"></i>
  <aside class="caption">
    <p class="eyebrow">Chat · swipe to reply</p>
    <h1>Reply Tug</h1>
    <p>Tug a message to the right to quote it in your reply. Pull the whole chat left to peek at the times.</p>
    <ul><li><i></i>Swipe a bubble right to reply</li><li><i></i>Pull the chat left for times</li><li><i></i>R replies, T shows times</li></ul>
  </aside>

  <section class="device" id="device" aria-label="Group chat: Cousins, Eid plans">
    <div class="island" aria-hidden="true"></div>
    <div class="status" aria-hidden="true">
      <span>9:41</span>
      <svg viewBox="0 0 56 12" width="56" height="12"><g fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M24.5 4.6a8 8 0 0 1 11 0l-1.5 1.6a5.8 5.8 0 0 0-8 0zM27.4 7.6a4 4 0 0 1 5.2 0L30 10.6z"/><rect x="40.5" y="1" width="13" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="42.5" y="3" width="8" height="6" rx="1.5"/><rect x="54.2" y="4" width="1.6" height="4" rx=".8"/></g></svg>
    </div>
    <header class="chat-head">
      <div class="avs" aria-hidden="true"><span class="av p-a">A</span><span class="av p-b">B</span><span class="av p-z">Z</span></div>
      <div class="who"><b>Cousins · Eid plans</b><span id="sub">Ayesha, Bilal, Zara and you</span></div>
      <button class="icon-btn" type="button" id="timesBtn" aria-pressed="false" aria-label="Show message times (T)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
    </header>

    <div class="thread" id="thread" role="log" aria-label="Messages. Swipe a message right to reply, or focus it and press R.">
      <span class="day">Today</span>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="quote-wrap" id="quoteWrap">
        <div class="qclip">
          <div class="quote-card" id="quoteCard">
            <svg class="qarrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l-6 6 6 6M4 12h10a6 6 0 0 1 6 6v1"/></svg>
            <div class="qtext"><b id="qName"></b><span id="qSnip"></span></div>
            <button class="icon-btn" type="button" id="qClose" aria-label="Cancel reply (Escape)"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
          </div>
        </div>
      </div>
      <div class="bar">
        <label class="sr-only" for="msg">Message</label>
        <input id="msg" type="text" placeholder="Message" enterkeyhint="send" maxlength="240" />
        <button class="send" type="submit" id="send" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.6l17.8-8.1a.6.6 0 0 0 0-1L3.4 3.4a.6.6 0 0 0-.8.7L4.8 11l8.2 1-8.2 1-2.2 6.9a.6.6 0 0 0 .8.7z"/></svg>
        </button>
      </div>
    </form>

    <div class="ghost" id="ghost" aria-hidden="true"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
  (function () {
    "use strict";
    function $(id) { return document.getElementById(id); }

        ghost.classList.add("press");
        if (!gDown(x0, y, b)) { ghostHide(); dLater(demoLoop, 1500); return; }
        g.synthetic = true;
        var t0 = performance.now(), dur = 1000;
        (function f(now) {
          if (!demo.on) return;
          var t = clamp01((now - t0) / dur), x = x0 + 112 * easeInOutSine(t);
          ghostAt(x, y);
          gMove(x, y);
          if (t < 1) { demo.raf = requestAnimationFrame(f); return; }
          dLater(function () {
            ghost.classList.remove("press");
            demo.dirty = true;
            gUp();
            dLater(ghostHide, 200);
            dLater(function () {
              demoType(DEMO_TEXTS[demo.n % DEMO_TEXTS.length], function () {
                var r = sendBtn.getBoundingClientRect();
                ghostShow(r.left + r.width / 2, r.top + r.height / 2);
                dLater(function () { ghost.classList.add("press"); }, 300);
                dLater(function () { ghostHide(); demo.dirty = false; send(); demo.n++; dLater(demoLoop, 6400); }, 480);
              });
            }, 380);
          }, 150);
        })(t0);
      }, 80);
    }
    function demoType(text, done) {
      var n = 0;
      (function step() {
        n++;
        input.value = text.slice(0, n);
        updateSend();
        if (n < text.length) dLater(step, 42 + Math.random() * 38); else if (done) done();
      })();
    }
    // pull the whole thread left to peek at the times
    function demoTimes() {
      var tr = thread.getBoundingClientRect(), x0 = tr.right - 70, y = tr.top + tr.height * 0.55;
      ghostShow(x0, y);
      dLater(function () {
        ghost.classList.add("press");
        if (!gDown(x0, y, thread)) { ghostHide(); dLater(demoLoop, 1500); return; }
        g.synthetic = true;
        var t0 = performance.now(), dur = 650;
        (function f(now) {
          if (!demo.on) return;
          var t = clamp01((now - t0) / dur), x = x0 - 96 * easeInOutSine(t);
          ghostAt(x, y);
          gMove(x, y);
          if (t < 1) { demo.raf = requestAnimationFrame(f); return; }
          dLater(function () { ghost.classList.remove("press"); gUp(); dLater(ghostHide, 200); dLater(demoLoop, 2600); }, 1100);
        })(t0);
      }, 80);
    }

    // ---------- Start ----------
    fillThread(!reduce.matches);
    updateSend();
    dLater(demoLoop, 600);
  })();
</script>
