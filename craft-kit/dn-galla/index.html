<!doctype html>
<!-- Chill & Craft · Galla · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galla · Kiryana till and khata</title>
<style>
/* ===== Shared base: reset, overlays, forms, tables, charts (themed by the variables below) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* page entrance: each app picks --enter-anim */
.enter{animation:var(--enter-anim,rise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px)}}
@keyframes blurin{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.row-in{animation:fadein .4s ease both;animation-delay:calc(var(--i,0) * 28ms)}

/* buttons press in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm,10px);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;background:var(--surface2);color:var(--text);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .35s}

/* chips and segmented control */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent,#fff)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .4s cubic-bezier(.3,1.3,.5,1),width .4s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:800;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 50% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 82%)}

/* tooltip, toasts, popovers */
#tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tip-bg,#111827);color:var(--tip-ink,#f9fafb);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:240px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#toasts{position:fixed;z-index:130;right:16px;bottom:16px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#111827);color:var(--tip-ink,#fff);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastin .45s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{color:var(--good)}
.toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--warn)}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.pop{position:fixed;z-index:110;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm,12px);box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;animation:pop .2s ease-out}
.pop [role="menuitem"]{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pop [role="menuitem"]:hover,.pop [role="menuitem"]:focus{background:var(--surface2);outline:none}
.pop-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{display:grid;gap:2px;padding:9px 10px 9px 22px;border-radius:8px;text-decoration:none;position:relative}
.note:hover{background:var(--surface2)}
.note.unread::before{content:"";position:absolute;left:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* modal and drawer */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.backdrop.side{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r,16px);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:modalin .38s cubic-bezier(.2,1.1,.3,1)}
.modal.wide{max-width:760px}
.modal.drawer{max-width:min(500px,100vw);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);animation:drawerin .4s cubic-bezier(.2,.9,.2,1)}
.backdrop.out{animation:fadein .22s reverse forwards}
.backdrop.out .modal{animation:modalin .22s reverse forwards}
.backdrop.out .drawer{animation:drawerin .25s reverse forwards}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes drawerin{from{transform:translateX(100%)}}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px}
.m-x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.m-body{padding:18px}
.m-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--surface);border-top:1px solid var(--line)}

/* forms with inline errors */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:10px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);animation:shake .35s}
.field .hint{color:var(--muted);font-size:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* data tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-search input{width:min(260px,100%);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tbl-search{flex:1 1 180px;max-width:280px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover,.tbl tr.click:focus{background:var(--surface2);outline:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sort-ic{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.3;transition:transform .2s}
th[aria-sort] .sort-ic{opacity:1}
th[aria-sort="ascending"] .sort-ic{transform:rotate(180deg) translateY(4px)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.pager button[disabled]{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.6,.1,.2,1) forwards}
.chart .fade{animation:fadein 1s .35s both}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hover{transition:opacity .15s;pointer-events:none}
.chart .hover circle{stroke:var(--surface);stroke-width:2.5}
.chart .grow{animation:grow .75s cubic-bezier(.2,.9,.3,1.15) both}
.chart .bcol{transition:opacity .2s}
.chart.hovering .bcol{opacity:.45}
.chart.hovering .bcol.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut{position:relative;flex:none}
.donut svg{overflow:visible}
.donut .seg-c{fill:none;transition:stroke-width .2s}
.donut .seg-c:hover{stroke-width:calc(var(--sw) * 1.25)}
.donut .sweep{animation:sweep .9s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 var(--C)}}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1 1 140px;min-width:0}
.lg li{display:flex;align-items:center;gap:4px}
.lg b{margin-left:auto;padding-left:10px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-f{display:block;height:100%;border-radius:999px;transform-origin:left}
.hb-f.growx{animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.ring-v{animation:ringin 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringin{from{stroke-dasharray:0 1}}
.gauge .g-v{animation:ringin 1.3s cubic-bezier(.3,.9,.3,1) both}
.hm{display:grid;gap:3px}
.hm-c{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0;animation:pop .4s both}
.spark{height:38px}

/* drag and drop */
.dragging{opacity:.35}
.ghost{position:fixed;z-index:140;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.3);opacity:.95;transition:none!important;animation:none!important}
.drop-hot{outline:2px dashed var(--accent);outline-offset:3px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* command search */
.cmdk .m-body{padding:12px}
.cmdk-in{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto}
.cmdk-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk-list li[aria-selected="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.cmdk-list li small{opacity:.7}
.cmdk-k{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* mobile nav drawer (sidebar apps) */
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.menu-btn{display:none!important}
@media (max-width:860px){
  .menu-btn{display:inline-grid!important}
  .side{position:fixed!important;z-index:60;top:0;bottom:0;left:0;width:min(280px,84vw)!important;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* theme switch reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,0))}}

/* print only the chosen area */
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}body.printing #print-root{display:block}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Galla look: shop-sign green and turmeric, bold outlined blocks ===== */
:root{--font:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;--bg:#f6efdc;--surface:#fffcf3;--surface2:#f2e8cd;--text:#1c2a21;--muted:#6b6955;--line:#e0d3b0;--edge:#1c2a21;--shade:#1c2a21;--accent:#0f6b45;--on-accent:#fff;--sun:#f2b705;--good:#15804d;--warn:#b26b06;--bad:#c8372d;--c1:#0f6b45;--c2:#f2b705;--c3:#e06a2c;--c4:#3a7fc2;--c5:#9b5cc4;--r:16px;--r-sm:11px;--side:#0c3d2a;--side-ink:#e9f2ea;--tip-bg:#1c2a21;--enter-anim:pop}
[data-theme="dark"]{--bg:#0d1611;--surface:#14201a;--surface2:#1b2b22;--text:#f2ecd9;--muted:#a1a58f;--line:#29392f;--edge:#38533f;--shade:#040806;--accent:#33c27d;--on-accent:#04150c;--good:#3fd189;--warn:#f2b640;--bad:#ff6d60;--c1:#33c27d;--c2:#f2c230;--c3:#ff8a4c;--c4:#6ea9ff;--c5:#c08cff;--side:#09170f;--tip-bg:#000}
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--text) 8%,transparent) 1px,transparent 0);background-size:22px 22px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:2px 6px}
.brand b{display:block;font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1}
.brand small{display:block;font-size:12px;opacity:.7;margin-top:3px}
.nav{position:relative;display:grid;gap:3px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;color:color-mix(in srgb,var(--side-ink) 76%,transparent);transition:color .25s}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#1c2a21}
.nav-marker{position:absolute;left:0;right:0;top:0;border-radius:12px;background:var(--sun);border:2px solid #000;box-shadow:3px 3px 0 #000;transition:transform .5s cubic-bezier(.3,1.35,.5,1),height .3s;z-index:0}
.side-foot{margin-top:auto;border:1px dashed color-mix(in srgb,var(--side-ink) 30%,transparent);border-radius:14px;padding:12px;font-size:13px}
.side-foot b{display:block;font-size:14px}
.open-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fd189;margin-right:6px;box-shadow:0 0 0 0 #3fd189;animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}}
/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top-t{flex:1;min-width:0}
.top-t h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;color:var(--muted)}
.search-btn kbd{font:inherit;font-size:11px;background:var(--surface2);border-radius:6px;padding:1px 6px}
.icon-btn{border:2px solid var(--edge);box-shadow:2px 2px 0 var(--shade)}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none}
.galla{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);background:var(--sun);color:#1c2a21;border-radius:12px;padding:4px 12px 4px 6px;box-shadow:2px 2px 0 var(--shade);font-weight:800;position:relative}
.galla small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;line-height:1}
.galla b{display:block;font-size:15px;line-height:1.2;font-variant-numeric:tabular-nums}
.galla.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.12) rotate(-3deg)}}
.coin{position:fixed;z-index:140;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e0a400 60%,#a87400);border:2px solid #7a5500;pointer-events:none}
#view{padding:22px;flex:1}
/* bold block cards and buttons */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);box-shadow:4px 4px 0 var(--shade);padding:18px;transition:transform .2s,box-shadow .2s;min-width:0}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shade)}
.btn{border:2px solid var(--edge);box-shadow:2px 2px 0 var(--shade)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shade)}
.btn.sun{background:var(--sun);color:#1c2a21}
.btn.wa{background:#1f9d55;color:#fff}
.modal{border:2px solid var(--edge)}
.chip{border:2px solid var(--edge);color:var(--text)}
.h2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.h2 h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.g2{grid-template-columns:1fr 1fr}
.stack{display:grid;gap:18px;align-content:start}
/* hero shop front */
.front{padding:0;overflow:hidden}
.awning{height:40px;background:repeating-linear-gradient(90deg,var(--accent) 0 44px,var(--sun) 44px 88px);border-bottom:2px solid var(--edge);position:relative;transform-origin:top;animation:sway 7s ease-in-out infinite}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:13px;background:radial-gradient(circle at 22px 0,var(--accent) 12px,transparent 13px) 0 0/88px 13px repeat-x,radial-gradient(circle at 22px 0,var(--sun) 12px,transparent 13px) 44px 0/88px 13px repeat-x}
@keyframes sway{50%{transform:skewX(-1.2deg) scaleY(1.04)}}
.front-in{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:26px 20px 18px}
.sign{flex:1 1 260px}
.sign h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.03em}
.sign p{margin:4px 0 0;color:var(--muted)}
.front-act{display:flex;gap:10px;flex-wrap:wrap}
/* KPI */
.kpi{display:grid;gap:4px;padding:16px}
.kpi-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}
.kpi-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;border:2px solid var(--edge);background:var(--surface2);color:var(--text)}
.kpi:nth-child(2) .kpi-ic{background:var(--sun);color:#1c2a21}
.kpi-v{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12.5px;color:var(--muted)}
/* debtor list */
.dl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dl li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;transition:background .2s}
.dl li:hover{background:var(--surface2)}
.dl .who{flex:1;min-width:0}
.dl .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.dl .who small{color:var(--muted);font-size:12px}
.dl .amt{font-weight:900;font-variant-numeric:tabular-nums}
.mini-wa{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#1f9d55;color:#fff;border:2px solid var(--edge);flex:none}
.rowbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
/* till */
.till{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.till-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.till-tools .inp{max-width:260px;border:2px solid var(--edge);border-radius:999px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.ptile{position:relative;display:grid;gap:4px;justify-items:start;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);box-shadow:3px 3px 0 var(--shade);transition:transform .15s,box-shadow .15s}
.ptile:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shade)}
.ptile:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shade)}
.ptile b{font-size:14px;line-height:1.2}
.ptile small{color:var(--muted);font-size:12px}
.ptile .pr{font-weight:900;font-size:15px}
.ptile .st{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--surface2)}
.ptile .st.low{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.ptile[disabled]{opacity:.45}
.cart{position:sticky;top:84px;display:grid;gap:12px}
.cart-l{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:300px;overflow:auto}
.cart-l li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px;border-radius:10px;background:var(--surface2);animation:pop .3s}
.cart-l li b{font-size:13.5px;display:block}
.cart-l li small{color:var(--muted);font-size:12px}
.qty{display:inline-flex;align-items:center;border:2px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--surface)}
.qty button{border:0;background:none;width:26px;height:26px;display:grid;place-items:center}
.qty span{min-width:22px;text-align:center;font-weight:800;font-size:13px}
.tot{display:grid;gap:4px;font-size:14px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:22px;font-weight:900;border-top:2px dashed var(--line);padding-top:8px}
.pay3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pay3 .btn{padding:11px 6px}
.cart-empty{text-align:center;color:var(--muted);padding:26px 8px;border:2px dashed var(--line);border-radius:12px}
.glyph{display:block;flex:none}
/* receipt that prints out */
.printer{position:relative;margin:0 auto;width:min(300px,100%)}
.slot{height:16px;border-radius:10px;background:var(--text);margin:0 -10px;position:relative;z-index:2}
.paper{position:relative;z-index:1;margin:-8px 8px 0;padding:20px 16px 18px;background:#fffef8;color:#222;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.18);animation:printout 1.6s steps(14) both;-webkit-mask:radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 0/12px 100% repeat-x;mask:radial-gradient(circle at 6px 100%,transparent 5px,#000 5.5px) 0 0/12px 100% repeat-x;padding-bottom:24px}
@keyframes printout{from{clip-path:inset(0 0 100% 0);transform:translateY(-30px)}}
.paper h3{margin:0;text-align:center;font-size:14px}
.paper .c{text-align:center;color:#666;font-size:11.5px}
.paper hr{border:0;border-top:1px dashed #999;margin:8px 0}
.paper .r{display:flex;justify-content:space-between;gap:8px}
.paper .r.b{font-weight:800;font-size:14px}
/* khata */
.agebar{display:flex;height:18px;border-radius:999px;overflow:hidden;border:2px solid var(--edge)}
.agebar span{height:100%;transform-origin:left;animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.age-lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.age-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lim{display:inline-block;width:70px;height:7px;border-radius:9px;background:var(--surface2);overflow:hidden;vertical-align:middle}
.lim i{display:block;height:100%;border-radius:9px}
.cd-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cd-top .av{width:52px;height:52px;font-size:18px;border:2px solid var(--edge)}
.cd-bal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:14px;border-radius:14px;border:2px solid var(--edge);background:var(--surface2);margin-bottom:12px}
.cd-bal b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.cd-act{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.led{font-size:13px}
.led td,.led th{padding:7px 6px}
.plus{color:var(--bad);font-weight:700}
.minus{color:var(--good);font-weight:700}
/* galla count */
.denoms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.denom{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--surface2);font-size:13px}
.denom input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.note-chip{font-weight:900;border:2px solid var(--edge);border-radius:7px;padding:2px 6px;text-align:center;background:var(--surface)}
.diff{margin-top:12px;padding:12px;border-radius:12px;font-weight:800;text-align:center;border:2px solid var(--edge)}
.diff.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.diff.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.kv{display:grid;gap:6px;font-size:14px;margin-bottom:12px}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv .t{font-weight:900;border-top:2px dashed var(--line);padding-top:6px}
.stockbar{display:inline-block;width:64px;height:7px;border-radius:9px;background:var(--surface2);overflow:hidden;vertical-align:middle;margin-left:6px}
.stockbar i{display:block;height:100%}
.pname{display:flex;align-items:center;gap:10px}
.tpl-prev{white-space:pre-wrap;padding:12px;border-radius:12px;background:var(--surface2);font-size:13.5px;border:2px dashed var(--line)}
@media print{.paper{animation:none!important;box-shadow:none;-webkit-mask:none;mask:none;margin:0}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.till{grid-template-columns:1fr}.cart{position:static}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{height:100vh}.top{padding:10px 14px}#view{padding:16px}.search-btn span,.search-btn kbd{display:none}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:12px}.kpi-v{font-size:20px}.galla small{display:none}.galla{padding:4px 8px 4px 4px}.top-t p{display:none}.top-t h1{font-size:18px}.denoms{grid-template-columns:1fr}.pay3{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.galla svg{display:none}.top{gap:6px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Main menu">
    <a class="brand" href="#/overview">
      <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><rect x="3" y="12" width="36" height="25" rx="5" fill="#f2b705" stroke="#000" stroke-width="2"/><path d="M3 21h36" stroke="#000" stroke-width="2"/><rect x="15" y="16" width="12" height="3" rx="1.5" fill="#000"/><circle cx="21" cy="29" r="3" fill="#0c3d2a"/><circle cx="21" cy="8" r="6" fill="#ffe08a" stroke="#000" stroke-width="2"/><path d="M19 6h4M19 8h4M20 6c3 0 3 4 0 4l3 3" stroke="#000" stroke-width="1.4" fill="none"/></svg>
      <span><b>Galla</b><small>Kiryana till &amp; khata</small></span>
    </a>

      <a href="#/till" data-route="till">Till</a>

      <button class="icon-btn" data-bell aria-label="Notifications"></button>

    </header>

  </div>

<script>
'use strict';
/* ===== Mini core: helpers, data seeding, router, theme, overlays, tables, charts, drag and drop ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10;
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
let RM=!!RMQ.matches;try{RMQ.addEventListener('change',e=>{RM=e.matches})}catch(e){}

/* --- seeded random so the demo data is the same on every load --- */
let R=Math.random;
function seedRng(s){let a=s>>>0;R=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],chance=p=>R()<p;
let _n=0;const uid=p=>(p||'')+(Date.now()%1e8).toString(36)+(++_n).toString(36);

/* --- Pakistani names, cities and phone numbers for demo data --- */
const PK={m:['Ahmed','Bilal','Usman','Hamza','Ali','Hassan','Imran','Faisal','Kashif','Zubair','Saad','Waqas','Adnan','Junaid','Rizwan','Tariq','Asad','Fahad','Shahid','Naveed','Arslan','Danish','Haris','Owais','Salman','Yasir','Nadeem','Sohail'],
f:['Ayesha','Fatima','Sana','Hira','Maryam','Zainab','Amna','Rabia','Nida','Iqra','Saima','Mehwish','Komal','Sadia','Bushra','Farah','Anum','Kiran','Laiba','Areeba','Samina','Noreen'],
l:['Khan','Malik','Butt','Sheikh','Qureshi','Chaudhry','Siddiqui','Raza','Iqbal','Abbasi','Mirza','Hashmi','Javed','Aslam','Rana','Awan','Baig','Ansari','Gill','Bhatti','Mughal','Niazi'],
cities:['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta','Sialkot','Gujranwala','Hyderabad','Bahawalpur','Sargodha','Abbottabad','Sukkur']};
const pname=g=>pick(g==='f'?PK.f:g==='m'?PK.m:(chance(.5)?PK.m:PK.f))+' '+pick(PK.l);
const phone=()=>'03'+rnd(0,4)+rnd(0,9)+'-'+String(rnd(1000000,9999999));

/* --- number and money formats (PKR) --- */
const NF=new Intl.NumberFormat('en-US');
const num=n=>NF.format(Math.round(+n||0));
const rs=n=>((+n||0)<0?'-':'')+'Rs '+NF.format(Math.abs(Math.round(+n||0)));
function short(n){n=+n||0;const a=Math.abs(n),s=n<0?'-':'',f=(v,u)=>s+(v>=100?Math.round(v):+v.toFixed(1))+u;return a>=1e9?f(a/1e9,'B'):a>=1e6?f(a/1e6,'M'):a>=1e3?f(a/1e3,'K'):s+Math.round(a)}
const rsk=n=>'Rs '+short(n);
const pct=(n,d=0)=>(+n||0).toFixed(d)+'%';
const FMT={num,rs,short,rsk,pct:v=>pct(v),pct1:v=>pct(v,1)};

/* --- dates (local, day precision) --- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};
const today=iso(TODAY);
const dd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
const ddy=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const daysAgo=s=>Math.round((TODAY-pd(s))/864e5);
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mlabel=k=>{const p=k.split('-');return MON[+p[1]-1]+' '+p[0].slice(2)};

/* --- storage that never throws (works when storage is blocked) --- */

  const lp=L.filter(l=>l.type==='pay').pop(),bal=sales-paid;return{bal,since:bal>0?since:null,days:bal>0&&since?daysAgo(since):0,lastPay:lp?lp.date:null,sales,paid,L}}

function dayTot(d,bd){const i=Math.round((pd(d)-pd(S.hist.start))/864e5),b=bd[d]||{cash:0,khata:0,n:0};return{cash:b.cash+(S.hist.cash[i]||0),khata:b.khata+(S.hist.khata[i]||0),n:b.n}}
function lastDays(n){const bd=byDate();return Array.from({length:n},(_,k)=>{const d=iso(addD(TODAY,k-n+1));return{d,...dayTot(d,bd)}})}
function months(n){const bd=byDate(),out=[];for(let k=n-1;k>=0;k--){const m=addM(TODAY,-k),key=mkey(m);let cash=0,khata=0;for(let d=new Date(m);d.getMonth()===m.getMonth()&&d<=TODAY;d=addD(d,1)){const t=dayTot(iso(d),bd);cash+=t.cash;khata+=t.khata}out.push({key,cash,khata})}return out}

  <div class="grid g3" style="margin-top:18px"><section class="card"><div class="h2"><h2>Sales: cash and khata</h2>${segHTML('rng',['7D','30D','12M'],RANGE,'Range')}</div><div class="chart" id="ovChart"></div></section>

  <div class="grid g3" style="margin-top:18px"><section class="card"><div class="h2"><h2>Latest bills</h2><a class="link" href="#/bills">All bills</a></div><div id="ovBills"></div></section>
  <section class="card"><div class="h2"><h2>Running low</h2><a class="link" href="#/stock">Stock</a></div><ul class="dl">${low.slice(0,5).map(p=>`<li>${glyph(p.cat,30)}<span class="who"><b>${esc(p.name)}</b><small>${esc(p.unit)} · reorder at ${p.re}</small></span><span class="tag ${p.stock?'warn':'bad'}">${p.stock?p.stock+' left':'Out'}</span><button class="btn sm" data-restock="${p.id}" aria-label="Restock ${esc(p.name)}">${ic('plus',14)}</button></li>`).join('')||'<li class="empty">Stock looks healthy.</li>'}</ul></section></div>`;
  const draw=()=>{const ch=$('#ovChart',el);if(RANGE==='12M'){const m=months(12);barChart(ch,{labels:m.map(x=>mlabel(x.key)),series:[{name:'Cash',data:m.map(x=>x.cash),color:'var(--c1)'},{name:'Khata',data:m.map(x=>x.khata),color:'var(--c2)'}],stacked:true,fmt:rsk,tfmt:rs,h:240})}

  draw();bindSeg(el,'rng',v=>{RANGE=v;draw()});sparks(el);
  table($('#ovBills',el),{id:'ovb',pageSize:5,rows:()=>[...S.bills].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),cols:[{label:'Bill',k:'no',f:b=>'#'+b.no},{label:'Time',v:b=>b.date+b.time,f:b=>(b.date===today?'Today':dd(b.date))+' '+b.time},{label:'Customer',v:b=>b.cid?(C(b.cid)||{}).name||'Removed':'Walk-in'},{label:'Paid by',k:'method',f:b=>`<span class="tag ${b.method==='Cash'?'good':b.method==='Khata'?'warn':'info'}">${b.method}</span>`},{label:'Total',k:'total',num:true,f:b=>rs(b.total)}],onRow:id=>showReceipt(S.bills.find(b=>b.id===id))});

/* till: product grid + cart */
let TQ='',TCAT='all';
function pgTill(el){head('Till','Tap items to add them to the bill');
  el.innerHTML=`<div class="till"><section><div class="till-tools"><label style="flex:1 1 200px"><span class="sr">Search products</span><input class="inp" id="tq" type="search" placeholder="Search atta, daal, oil…" value="${esc(TQ)}"></label><div class="chips" role="group" aria-label="Category">${[['all','All'],...CATS].map(([k,l])=>`<button class="chip" data-cat="${k}" aria-pressed="${TCAT===k}">${l}</button>`).join('')}</div></div><div class="pgrid" id="pgrid"></div></section>
  <aside class="card cart" aria-label="Current bill"><div class="h2" style="margin:0"><h2>${ic('cart',18)} Current bill</h2><button class="link" id="clr">Clear</button></div>
  <div class="field"><label for="ccust">Customer</label><select id="ccust"><option value="">Walk-in customer</option>${S.customers.map(c=>`<option value="${c.id}" ${S.cartCid===c.id?'selected':''}>${esc(c.name)} · ${esc(c.area||'')}</option>`).join('')}</select><span class="err" id="ccust_e"></span></div>
  <ul class="cart-l" id="cartL"></ul><div class="field"><label for="cdisc">Discount (Rs)</label><input id="cdisc" type="number" min="0" inputmode="decimal" value="${S.disc||''}" placeholder="0"><span class="err" id="cdisc_e"></span></div><div class="tot" id="ctot"></div>
  <div class="pay3"><button class="btn primary" id="payCash">${ic('cash',16)}Cash</button><button class="btn sun" id="payKhata">${ic('book',16)}Khata</button><button class="btn" id="payPart">Part pay</button></div></aside></div>`;
  const grid=$('#pgrid',el);
  const drawGrid=()=>{const q=TQ.toLowerCase(),list=S.products.filter(p=>(TCAT==='all'||p.cat===TCAT)&&(!q||(p.name+' '+CATN[p.cat]).toLowerCase().includes(q)));
    grid.innerHTML=list.map((p,i)=>`<button class="ptile row-in" style="--i:${Math.min(i,20)}" data-add="${p.id}" ${p.stock<=0?'disabled':''} aria-label="Add ${esc(p.name)} ${esc(p.unit)}, ${rs(p.price)}">${glyph(p.cat,40)}<b>${esc(p.name)}</b><small>${esc(p.unit)}</small><span class="pr">${rs(p.price)}</span><span class="st ${p.stock<=p.re?'low':''}">${p.stock<=0?'Out':p.stock+' left'}</span></button>`).join('')||'<p class="empty">No product matches. Try another word.</p>'};
  const lines=()=>S.cart.map(l=>({...l,p:P(l.pid)})).filter(l=>l.p);
  const totals=()=>{const L=lines(),sub=sum(L,l=>l.p.price*l.qty),disc=clamp(+S.disc||0,0,sub);return{L,sub,disc,total:sub-disc}};
  const drawCart=()=>{const{L,sub,disc,total}=totals();
    $('#cartL',el).innerHTML=L.length?L.map(l=>`<li><span><b>${esc(l.p.name)}</b><small>${esc(l.p.unit)} · ${rs(l.p.price)}</small></span><span class="qty"><button data-q="-1" data-pid="${l.pid}" aria-label="One less ${esc(l.p.name)}">${ic('minus',14)}</button><span aria-live="polite">${l.qty}</span><button data-q="1" data-pid="${l.pid}" aria-label="One more ${esc(l.p.name)}">${ic('plus',14)}</button></span><b class="num">${num(l.p.price*l.qty)}</b></li>`).join(''):'<li class="cart-empty">Bill is empty. Tap a product to add it.</li>';
    $('#ctot',el).innerHTML=`<div><span>Items</span><span>${sum(L,l=>l.qty)}</span></div><div><span>Subtotal</span><span>${rs(sub)}</span></div>${disc?`<div><span>Discount</span><span>-${rs(disc)}</span></div>`:''}<div class="big"><span>Total</span><span>${rs(total)}</span></div>`;
    ['payCash','payKhata','payPart'].forEach(i=>$('#'+i,el).disabled=!L.length)};
  drawGrid();drawCart();
  $('#tq',el).addEventListener('input',e=>{TQ=e.target.value;drawGrid()});
  $('#ccust',el).addEventListener('change',e=>{S.cartCid=e.target.value;$('#ccust_e',el).textContent='';e.target.closest('.field').classList.remove('invalid');save()});
  $('#cdisc',el).addEventListener('input',e=>{const sub=totals().sub,v=+e.target.value||0,bad=v<0||v>sub;$('#cdisc_e',el).textContent=bad?'Discount must be between 0 and the subtotal':'';e.target.closest('.field').classList.toggle('invalid',bad);if(!bad){S.disc=v;save();drawCart()}});
  el.addEventListener('click',e=>{const ch=e.target.closest('[data-cat]');if(ch){TCAT=ch.dataset.cat;$$('[data-cat]',el).forEach(b=>b.setAttribute('aria-pressed',b===ch));drawGrid();return}
    const a=e.target.closest('[data-add]');if(a){const p=P(a.dataset.add),l=S.cart.find(x=>x.pid===p.id);if((l?l.qty:0)>=p.stock){toast('Only '+p.stock+' '+p.name+' in stock','bad');return}l?l.qty++:S.cart.push({pid:p.id,qty:1});save();drawCart();fly(a);return}
    const q=e.target.closest('[data-q]');if(q){const l=S.cart.find(x=>x.pid===q.dataset.pid),p=P(q.dataset.pid);if(!l)return;const n=l.qty+ +q.dataset.q;if(n>p.stock){toast('Only '+p.stock+' in stock','bad');return}if(n<=0)S.cart=S.cart.filter(x=>x!==l);else l.qty=n;save();drawCart();return}
    if(e.target.closest('#clr')){if(!S.cart.length){toast('The bill is already empty','info');return}confirmBox('Clear all items from this bill?',()=>{S.cart=[];S.disc=0;save();refresh();toast('Bill cleared')},'Clear bill');return}
    const pay=e.target.closest('#payCash,#payKhata,#payPart');if(!pay)return;const T=totals();if(!T.L.length)return;
    const needCust=()=>{if(S.cartCid)return true;const f=$('#ccust',el);f.closest('.field').classList.add('invalid');$('#ccust_e',el).textContent='Pick the khata customer first';f.focus();return false};
    if(pay.id==='payCash')cashModal(T,pay);
    else if(pay.id==='payKhata'){if(!needCust())return;const c=C(S.cartCid),s=cstat(c.id);if(s.bal+T.total>c.limit)confirmBox(`This takes <b>${esc(c.name)}</b> to ${rs(s.bal+T.total)}, over the ${rs(c.limit)} limit. Put it on khata anyway?`,()=>finish(T,0,T.total,pay),'Put on khata',false);else finish(T,0,T.total,pay)}
    else{if(!needCust())return;const F=[{k:'now',label:'Paid now in cash (Rs)',type:'money',req:true,min:1,max:T.total-1,hint:'The rest goes on '+C(S.cartCid).name+"'s khata"}];modal({title:'Part payment · '+rs(T.total),body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Save bill',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;finish(T,v.now,T.total-v.now,pay)}}]})}})}
function fly(tile){if(RM||!document.body.animate)return;const g=tile.querySelector('svg'),cart=$('.cart h2');if(!g||!cart)return;const a=g.getBoundingClientRect(),b=cart.getBoundingClientRect(),c=g.cloneNode(true);c.style.cssText=`position:fixed;left:${a.left}px;top:${a.top}px;z-index:140;pointer-events:none`;document.body.append(c);c.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.35)`,opacity:.3}],{duration:550,easing:'cubic-bezier(.5,0,.7,1)'}).onfinish=()=>c.remove()}
function cashModal(T,btn){const F=[{k:'got',label:'Cash received (Rs)',type:'money',req:true,min:T.total,max:T.total+100000,val:T.total}];
  modal({title:'Cash payment · '+rs(T.total),body:formHTML(F)+`<div class="chips" style="margin-top:10px">${[T.total,Math.ceil(T.total/500)*500,Math.ceil(T.total/1000)*1000,5000].filter((v,i,a)=>v>=T.total&&a.indexOf(v)===i).map(v=>`<button class="chip" data-got="${v}">${rs(v)}</button>`).join('')}</div><div class="diff ok" id="chg" aria-live="polite">Change: Rs 0</div>`,
    onOpen(m){const inp=$('#f_got',m),up=()=>{const v=+inp.value||0;$('#chg',m).textContent=v>=T.total?'Change to give: '+rs(v-T.total):'Short by '+rs(T.total-v);$('#chg',m).className='diff '+(v>=T.total?'ok':'bad')};inp.addEventListener('input',up);m.addEventListener('click',e=>{const b=e.target.closest('[data-got]');if(b){inp.value=b.dataset.got;up()}});up()},
    actions:[{label:'Cancel',cls:'ghost'},{label:'Complete sale',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;finish(T,T.total,0,btn,v.got)}}]})}
function finish(T,cash,khata,btn,tendered){const now=new Date(),b={id:'b'+S.seq,no:S.seq++,date:today,time:pad(now.getHours())+':'+pad(now.getMinutes()),cid:khata>0||S.cartCid?S.cartCid||null:null,lines:T.L.map(l=>({pid:l.pid,name:l.p.name,unit:l.p.unit,price:l.p.price,qty:l.qty})),disc:T.disc,total:T.total,cash,khata,method:khata===0?'Cash':cash===0?'Khata':'Part',tendered:tendered||0};
  b.lines.forEach(l=>{const p=P(l.pid);if(p)p.stock=Math.max(0,p.stock-l.qty)});S.bills.push(b);if(khata>0)S.ledger.push({id:uid('l'),cid:b.cid,date:today,type:'sale',amt:khata,note:'Bill #'+b.no,bill:b.id});
  S.cart=[];S.disc=0;S.cartCid='';save();if(cash>0)coinsTo(btn);refresh();paintGalla();showReceipt(b,true);if(khata>0)toast(rs(khata)+' added to '+C(b.cid).name+"'s khata");}

/* khata book */
const use=r=>r.limit?r.s.bal/r.limit:(r.s.bal>0?2:0);
function pgKhata(el){const st=stats(),rows=S.customers.map(c=>({...c,s:st.get(c.id)})),owe=rows.filter(r=>r.s.bal>0),out=sum(owe,r=>r.s.bal),bk=[0,0,0,0];owe.forEach(r=>bk[bucket(r.s.days)]+=r.s.bal);

  el.innerHTML=`<div class="grid g4"><article class="card kpi"><div class="kpi-h">Total udhaar out</div><div class="kpi-v">${cnt(out,'rs','kh-out')}</div><div class="kpi-s">${owe.length} of ${rows.length} customers</div></article><article class="card kpi"><div class="kpi-h">Over 30 days</div><div class="kpi-v">${cnt(bk[2]+bk[3],'rs','kh-30')}</div><div class="kpi-s">${owe.filter(r=>r.s.days>30).length} customers to chase</div></article><article class="card kpi"><div class="kpi-h">Over credit limit</div><div class="kpi-v">${cnt(rows.filter(r=>r.s.bal>r.limit).length,'num','kh-ol')}</div><div class="kpi-s">customers above their limit</div></article><article class="card kpi"><div class="kpi-h">Recovered this month</div><div class="kpi-v">${cnt(sum(S.ledger.filter(l=>l.type==='pay'&&l.date.slice(0,7)===today.slice(0,7)),l=>l.amt),'rs','kh-rec')}</div><div class="kpi-s">part and full payments</div></article></div>
  <section class="card" style="margin-top:18px"><div class="h2"><h2>How old is the udhaar?</h2><span class="muted" style="font-size:13px">${rs(out)} in total</span></div><div class="agebar">${bk.map((v,i)=>v?`<span style="width:${v/out*100}%;background:${BUCKETS[i][1]};animation-delay:${i*120}ms" title="${BUCKETS[i][0]}: ${rs(v)}"></span>`:'').join('')}</div><div class="age-lg">${BUCKETS.map((b,i)=>`<span><i style="background:${b[1]}"></i>${b[0]}: <b>${rs(bk[i])}</b></span>`).join('')}</div></section>
  <section class="card" style="margin-top:18px"><div class="h2"><h2>Customers</h2><button class="btn primary sm" id="addC">${ic('plus',15)}Add customer</button></div><div id="khT"></div></section>`;
  table($('#khT',el),{id:'kh',search:'Search name, phone or street',chips:['All','Owes','30+ days','Over limit','Settled'],chipFn:(r,c)=>c==='Owes'?r.s.bal>0:c==='30+ days'?r.s.days>30:c==='Over limit'?r.s.bal>r.limit:r.s.bal<=0,rows:()=>rows,sortCol:2,sortDir:-1,pageSize:9,
    cols:[{label:'Customer',v:r=>r.name,f:r=>`<span class="pname">${av(r.name)}<span><b>${esc(r.name)}</b><br><small class="muted">${esc(r.area||'')}</small></span></span>`},{label:'Phone',k:'phone'},{label:'Balance',num:true,v:r=>r.s.bal,f:r=>`<b>${rs(r.s.bal)}</b>`},{label:'Since',v:r=>r.s.since||'9999',f:r=>r.s.since?dd(r.s.since):'-'},{label:'Age',v:r=>r.s.days,f:r=>ageTag(r.s)},{label:'Limit used',v:r=>use(r),f:r=>{const u=use(r);return `<span class="lim"><i style="width:${clamp(u*100,0,100)}%;background:${u>1?'var(--bad)':u>.75?'var(--warn)':'var(--good)'}"></i></span> <small>${Math.round(u*100)}%</small>`}},{label:'Last paid',v:r=>r.s.lastPay||'',f:r=>r.s.lastPay?dd(r.s.lastPay):'-'},{label:'',nosort:true,f:r=>`<span style="display:inline-flex;gap:6px">${r.s.bal>0?waA(r,r.s):''}<button class="btn sm" data-pay="${r.id}">Pay</button></span>`}],onRow:id=>openCust(id)});
  el.addEventListener('click',e=>{if(e.target.closest('#addC'))custForm();const p=e.target.closest('[data-pay]');if(p)payForm(p.dataset.pay,null,p)})}

/* bills */
function pgBills(el){head('Bills','Every sale from the till, with reprint and void');const bt=S.bills.filter(b=>b.date===today);
  el.innerHTML=`<div class="grid g4">${[['Bills today',cnt(bt.length,'num','b1')],['Average bill',cnt(bt.length?sum(bt,b=>b.total)/bt.length:0,'rs','b2')],['Biggest bill today',cnt(Math.max(0,...bt.map(b=>b.total)),'rs','b3')],['Bills in 14 days',cnt(S.bills.length,'num','b4')]].map(x=>`<article class="card kpi"><div class="kpi-h">${x[0]}</div><div class="kpi-v">${x[1]}</div></article>`).join('')}</div><section class="card" style="margin-top:18px"><div id="bT"></div></section>`;
  table($('#bT',el),{id:'bills',search:'Search bill no., customer or item',chips:['All','Today','Cash','Khata','Part'],chipFn:(b,c)=>c==='Today'?b.date===today:b.method===c,rows:()=>S.bills,sortCol:1,sortDir:-1,pageSize:10,text:b=>'#'+b.no+' '+(b.cid?(C(b.cid)||{}).name:'walk-in')+' '+b.lines.map(l=>l.name).join(' '),
    cols:[{label:'Bill',k:'no',f:b=>'<b>#'+b.no+'</b>'},{label:'Date',v:b=>b.date+' '+b.time,f:b=>(b.date===today?'Today':dd(b.date))+' · '+b.time},{label:'Customer',v:b=>b.cid?(C(b.cid)||{}).name||'Removed':'Walk-in'},{label:'Items',v:b=>sum(b.lines,l=>l.qty),num:true},{label:'Paid by',k:'method',f:b=>`<span class="tag ${b.method==='Cash'?'good':b.method==='Khata'?'warn':'info'}">${b.method}</span>`},{label:'Cash',k:'cash',num:true,f:b=>rs(b.cash)},{label:'Khata',k:'khata',num:true,f:b=>b.khata?rs(b.khata):'-'},{label:'Total',k:'total',num:true,f:b=>'<b>'+rs(b.total)+'</b>'}],onRow:id=>billDrawer(id)})}
function billDrawer(id){const b=S.bills.find(x=>x.id===id);if(!b)return;modal({title:'Bill #'+b.no,side:true,body:`<div class="printer">${receiptHTML(b)}</div>`,actions:[{label:ic('trash',16)+'Void bill',cls:'danger',fn:()=>{confirmBox(`Void bill #${b.no}? Stock comes back${b.khata?' and '+rs(b.khata)+' is removed from the khata':''}.`,()=>{b.lines.forEach(l=>{const p=P(l.pid);if(p)p.stock+=l.qty});S.ledger=S.ledger.filter(l=>l.bill!==b.id);S.bills=S.bills.filter(x=>x!==b);save();refresh();paintGalla();toast('Bill #'+b.no+' voided')},'Void bill')}},{label:ic('print',16)+'Reprint',cls:'primary',fn:()=>{printHTML(receiptHTML(b));return false}}]})}

/* stock */
const prodF=[{k:'name',label:'Product name',req:true},{k:'cat',label:'Category',type:'select',opts:CATS},{k:'unit',label:'Pack size',req:true,ph:'1 kg'},{k:'price',label:'Sale price (Rs)',type:'money',req:true,min:1,max:100000},{k:'cost',label:'Buy price (Rs)',type:'money',req:true,min:0,max:100000,check:(v,o)=>v>o.price?'Buy price is above the sale price':''},{k:'stock',label:'In stock',type:'number',req:true,min:0,max:100000},{k:'re',label:'Reorder when at',type:'number',req:true,min:0,max:1000}];
function prodForm(p){modal({title:p?'Edit product':'Add product',body:formHTML(prodF,p||{re:5,stock:0}),actions:[{label:'Cancel',cls:'ghost'},{label:p?'Save':'Add product',cls:'primary',fn:m=>{const v=readForm(m,prodF);if(!v)return false;if(p)Object.assign(p,v);else S.products.push({id:uid('p'),...v});save();refresh();toast(p?'Product saved':v.name+' added')}}]})}
function restock(p){if(!p)return;const F=[{k:'qty',label:'Quantity received',type:'number',req:true,min:1,max:10000,val:Math.max(p.re*2,6)},{k:'cost',label:'Buy price each (Rs)',type:'money',req:true,min:0,max:100000,val:p.cost},{k:'paid',label:'Paid from galla?',type:'select',opts:[['yes','Yes, take cash from the galla'],['no','No, supplier on credit']]}];
  modal({title:'Restock '+esc(p.name),body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Add stock',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;p.stock+=v.qty;p.cost=v.cost;if(v.paid==='yes')S.payouts.push({id:uid('o'),date:today,amt:v.qty*v.cost,note:'Stock: '+p.name});save();refresh();paintGalla();toast(v.qty+' x '+p.name+' added to stock')}}]})}
function pgStock(el){const val=sum(S.products,p=>p.stock*p.cost),low=S.products.filter(p=>p.stock>0&&p.stock<=p.re).length,out=S.products.filter(p=>p.stock<=0).length;head('Stock','Shelf count, margins and reorder alerts');
  el.innerHTML=`<div class="grid g4">${[['Products',cnt(S.products.length,'num','s1'),'in '+CATS.length+' categories'],['Stock value (buy)',cnt(val,'rs','s2'),'at buy price'],['Running low',cnt(low,'num','s3'),'at or below reorder level'],['Out of stock',cnt(out,'num','s4'),'cannot be sold now']].map(x=>`<article class="card kpi"><div class="kpi-h">${x[0]}</div><div class="kpi-v">${x[1]}</div><div class="kpi-s">${x[2]}</div></article>`).join('')}</div><section class="card" style="margin-top:18px"><div class="h2"><h2>Products</h2><button class="btn primary sm" id="addP">${ic('plus',15)}Add product</button></div><div id="sT"></div></section>`;
  table($('#sT',el),{id:'stock',search:'Search products',chips:['All','Low stock','Out of stock',...CATS.map(c=>c[1])],chipFn:(p,c)=>c==='Low stock'?p.stock>0&&p.stock<=p.re:c==='Out of stock'?p.stock<=0:CATN[p.cat]===c,rows:()=>S.products,pageSize:10,
    cols:[{label:'Product',k:'name',f:p=>`<span class="pname">${glyph(p.cat,30)}<span><b>${esc(p.name)}</b><br><small class="muted">${esc(p.unit)}</small></span></span>`},{label:'Category',v:p=>CATN[p.cat]},{label:'In stock',k:'stock',num:true,f:p=>`<b style="color:${p.stock<=0?'var(--bad)':p.stock<=p.re?'var(--warn)':'inherit'}">${p.stock}</b><span class="stockbar"><i style="width:${clamp(p.stock/(p.re*4)*100,0,100)}%;background:${p.stock<=p.re?'var(--bad)':'var(--good)'}"></i></span>`},{label:'Buy',k:'cost',num:true,f:p=>rs(p.cost)},{label:'Sell',k:'price',num:true,f:p=>rs(p.price)},{label:'Margin',num:true,v:p=>(p.price-p.cost)/p.price,f:p=>pct((p.price-p.cost)/p.price*100,1)},{label:'',nosort:true,f:p=>`<span style="display:inline-flex;gap:6px"><button class="btn sm" data-rs="${p.id}">${ic('plus',14)}Restock</button><button class="btn sm ghost" data-ed="${p.id}" aria-label="Edit ${esc(p.name)}">${ic('edit',14)}</button><button class="btn sm ghost" data-del="${p.id}" aria-label="Delete ${esc(p.name)}">${ic('trash',14)}</button></span>`}]});
  el.addEventListener('click',e=>{if(e.target.closest('#addP'))prodForm();const r=e.target.closest('[data-rs]'),ed=e.target.closest('[data-ed]'),d=e.target.closest('[data-del]');if(r)restock(P(r.dataset.rs));if(ed)prodForm(P(ed.dataset.ed));if(d){const p=P(d.dataset.del);confirmBox(`Delete <b>${esc(p.name)}</b> from the product list?`,()=>{S.products=S.products.filter(x=>x!==p);S.cart=S.cart.filter(l=>l.pid!==p.id);save();refresh();toast('Product deleted')})}})}

/* reports */
let RR='12M';
function pgReports(el){head('Reports','Months, khata flow, best sellers and busy hours');const st=stats(),bk=[0,0,0,0];S.customers.forEach(c=>{const s=st.get(c.id);if(s.bal>0)bk[bucket(s.days)]+=s.bal});
  const top={};S.bills.forEach(b=>b.lines.forEach(l=>{top[l.name]=(top[l.name]||0)+l.qty*l.price}));const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8);
  el.innerHTML=`<section class="card"><div class="h2"><h2>Monthly sales</h2>${segHTML('rr',['6M','12M'],RR,'Range')}</div><div class="chart" id="rM"></div></section>
  <div class="grid g2" style="margin-top:18px"><section class="card"><div class="h2"><h2>Udhaar given vs recovered</h2></div><div class="chart" id="rK"></div></section><section class="card"><div class="h2"><h2>Outstanding by age</h2></div><div id="rA"></div></section></div>
  <div class="grid g2" style="margin-top:18px"><section class="card"><div class="h2"><h2>Best sellers (14 days)</h2></div><div id="rT"></div></section><section class="card"><div class="h2"><h2>Busy hours</h2><span class="muted" style="font-size:12.5px">bills per hour, last 14 days</span></div><div id="rH"></div></section></div>`;
  const dm=()=>{const m=months(RR==='6M'?6:12);barChart($('#rM',el),{labels:m.map(x=>mlabel(x.key)),series:[{name:'Cash',data:m.map(x=>x.cash),color:'var(--c1)'},{name:'Khata',data:m.map(x=>x.khata),color:'var(--c2)'}],stacked:true,fmt:rsk,tfmt:rs,h:250})};dm();bindSeg(el,'rr',v=>{RR=v;dm()});
  const ms=Array.from({length:6},(_,k)=>mkey(addM(TODAY,k-5)));lineChart($('#rK',el),{labels:ms.map(mlabel),series:[{name:'Udhaar given',data:ms.map(m=>sum(S.ledger.filter(l=>l.type==='sale'&&l.date.slice(0,7)===m),l=>l.amt)),color:'var(--c3)'},{name:'Recovered',data:ms.map(m=>sum(S.ledger.filter(l=>l.type==='pay'&&l.date.slice(0,7)===m),l=>l.amt)),color:'var(--c1)'}],fmt:rsk,tfmt:rs,h:230});
  donut($('#rA',el),{items:BUCKETS.map((b,i)=>({label:b[0],value:bk[i],color:b[1]})),tfmt:rs,center:rsk(sum(bk)),sub:'outstanding'});
  hbars($('#rT',el),{items:topL.map(([n,v],i)=>({label:n,value:v,color:i<3?'var(--c1)':'var(--c4)'})),fmt:rsk});
  const H=Array.from({length:7},()=>Array(15).fill(0));S.bills.forEach(b=>{const h=+b.time.slice(0,2)-8;if(h>=0&&h<15)H[pd(b.date).getDay()][h]++});const mx=Math.max(1,...H.flat());
  $('#rH',el).innerHTML=`<div style="overflow-x:auto"><div class="hm" style="grid-template-columns:34px repeat(15,minmax(16px,1fr));min-width:320px">${H.map((row,d)=>`<span class="muted" style="font-size:11px;align-self:center">${WD[d]}</span>`+row.map((v,h)=>`<span class="hm-c" role="img" aria-label="${WD[d]} ${h+8}:00, ${v} bills" data-tip="${WD[d]} ${h+8}:00 · ${v} bills" style="background:color-mix(in srgb,var(--c1) ${Math.round(v/mx*100)}%,var(--surface2));animation-delay:${(d*15+h)*6}ms"></span>`).join('')).join('')}<span></span>${Array.from({length:15},(_,h)=>`<span class="muted" style="font-size:10px;text-align:center">${h%2?'':h+8}</span>`).join('')}</div></div>`;
  $$('[data-tip]',el).forEach(c=>{c.addEventListener('pointermove',e=>tip(esc(c.dataset.tip),e.clientX,e.clientY));c.addEventListener('pointerleave',hideTip)})}

/* settings */
function pgSettings(el){head('Settings','Shop details, reminder text and demo data');const F=[{k:'name',label:'Shop name',req:true},{k:'area',label:'Area and city',req:true},{k:'phone',label:'Shop mobile',type:'tel',req:true},{k:'opening',label:'Opening cash in galla (Rs)',type:'money',min:0,max:1000000,req:true},{k:'limit',label:'Default credit limit (Rs)',type:'money',min:0,max:500000,req:true},{k:'footer',label:'Receipt footer',full:true},{k:'tpl',label:'WhatsApp reminder text',type:'textarea',full:true,rows:3,req:true,hint:'Use {name}, {shop}, {amount} and {since}. The link only opens WhatsApp with this text; nothing is sent by itself.'}];
  const sample=S.customers.map(c=>[c,cstat(c.id)]).find(x=>x[1].bal>0);
  el.innerHTML=`<div class="grid g2"><section class="card"><div class="h2"><h2>Shop and khata</h2></div><div id="setF">${formHTML(F,S.shop)}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="saveS">${ic('check',16)}Save settings</button></div></section>
  <div class="stack"><section class="card"><div class="h2"><h2>Reminder preview</h2></div><div class="tpl-prev" id="tplPrev"></div><p style="margin:12px 0 0">${sample?waA(sample[0],sample[1],'btn wa',' Try with '+esc(sample[0].name)):''}</p></section>
  <section class="card"><div class="h2"><h2>Demo data</h2></div><p class="muted" style="margin:0 0 12px">Bring back the sample shop with its year of sales, 24 khata customers and 40 products.</p><button class="btn danger" id="resetD">${ic('refresh',16)}Reset demo data</button></section></div></div>`;
  const prev=()=>{const t=$('#f_tpl',el).value;$('#tplPrev',el).textContent=sample?t.replace(/\{name\}/g,sample[0].name).replace(/\{shop\}/g,$('#f_name',el).value).replace(/\{amount\}/g,rs(sample[1].bal)).replace(/\{since\}/g,ddy(sample[1].since)):t};prev();
  $('#f_tpl',el).addEventListener('input',prev);$('#f_name',el).addEventListener('input',prev);
  $('#saveS',el).addEventListener('click',()=>{const v=readForm(el,F);if(!v)return;Object.assign(S.shop,v);save();refresh();paintShop();paintGalla();toast('Settings saved')});
  $('#resetD',el).addEventListener('click',()=>confirmBox('Reset all demo data? Your changes in this browser will be lost.',()=>{S=seed();save();Object.keys(TS).forEach(k=>delete TS[k]);refresh();paintShop();paintGalla();toast('Demo data reset')},'Reset'))}

/* ---------- day close: count the galla ---------- */
const DEN=[5000,1000,500,100,50,20,10];
function dayClose(){const t=todayNums();modal({title:'Galla · day close',side:true,body:`<div class="kv"><div><span>Opening cash</span><b>${rs(S.shop.opening)}</b></div><div><span>Cash sales (${t.n} bills)</span><b>${rs(t.cashSales)}</b></div><div><span>Khata recovered in cash</span><b>${rs(t.rec)}</b></div><div><span>Pay-outs</span><b>-${rs(t.po)}</b></div><div class="t"><span>Should be in galla</span><b>${rs(t.galla)}</b></div></div>
  ${t.outs.length?`<div class="muted" style="font-size:12.5px;margin-bottom:6px">PAY-OUTS TODAY</div><ul class="dl" style="margin-bottom:12px">${t.outs.map(o=>`<li><span class="who"><b>${esc(o.note)}</b></span><span class="amt">${rs(o.amt)}</span><button class="btn sm ghost" data-delo="${o.id}" aria-label="Remove pay-out ${esc(o.note)}">${ic('trash',14)}</button></li>`).join('')}</ul>`:''}
  <button class="btn sm" id="addOut" style="margin-bottom:16px">${ic('minus',14)}Add pay-out</button>
  <div class="muted" style="font-size:12.5px;margin-bottom:6px">COUNT THE NOTES</div><div class="denoms">${DEN.map(d=>`<label class="denom"><span class="note-chip">${num(d)}</span><input type="number" min="0" inputmode="numeric" data-den="${d}" aria-label="Number of ${d} rupee notes" placeholder="0"><span class="num" data-dv="${d}">0</span></label>`).join('')}<label class="denom"><span class="note-chip">Coins</span><input type="number" min="0" inputmode="numeric" data-den="1" aria-label="Coins in rupees" placeholder="0"><span class="num" data-dv="1">0</span></label></div>
  <div class="diff" id="cdiff" aria-live="polite">Start counting to see if the galla matches</div>`,
  onOpen(m){const up=()=>{let c=0;$$('[data-den]',m).forEach(i=>{const v=Math.max(0,+i.value||0)*+i.dataset.den;c+=v;$(`[data-dv="${i.dataset.den}"]`,m).textContent=num(v)});const d=c-todayNums().galla,box=$('#cdiff',m);box.dataset.counted=c;box.className='diff '+(Math.abs(d)<1?'ok':'bad');box.textContent=c===0?'Start counting to see if the galla matches':Math.abs(d)<1?'Counted '+rs(c)+'. The galla matches.':'Counted '+rs(c)+'. '+(d<0?'Short by ':'Over by ')+rs(Math.abs(d))};m.addEventListener('input',up);
    m.addEventListener('click',e=>{if(e.target.closest('#addOut')){const F=[{k:'amt',label:'Amount (Rs)',type:'money',req:true,min:1,max:Math.max(1,todayNums().galla)},{k:'note',label:'Paid to / for',req:true,ph:'e.g. Bread supplier'}];modal({title:'Cash pay-out',body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Take from galla',cls:'primary',fn:mm=>{const v=readForm(mm,F);if(!v)return false;S.payouts.push({id:uid('o'),date:today,...v});save();paintGalla();refresh();toast(rs(v.amt)+' paid out');setTimeout(()=>{closeTop();dayClose()},250)}}]})}
      const d=e.target.closest('[data-delo]');if(d){S.payouts=S.payouts.filter(o=>o.id!==d.dataset.delo);save();paintGalla();refresh();closeTop();setTimeout(dayClose,250)}})},
  actions:[{label:'Close',cls:'ghost'},{label:'Close the day',cls:'primary',fn:m=>{const c=+$('#cdiff',m).dataset.counted||0;if(!c){toast('Count the cash first','bad');return false}S.closes.push({date:today,counted:c,expected:todayNums().galla});save();toast('Day closed with '+rs(c)+' counted');confetti()}}]})}
const closeTop=()=>{const t=MODALS[MODALS.length-1];t&&t.close()};
function paintShop(){$('#sideShop').textContent=S.shop.name;$('#sideArea').textContent=' · '+S.shop.area}

/* ---------- boot ---------- */
$('[data-menu]').innerHTML=ic('menu');$('[data-cmdk]').innerHTML=ic('search',17)+'<span>Search</span><kbd>Ctrl K</kbd>';
const NAVI={overview:'home',till:'cart',khata:'book',bills:'receipt',stock:'box',reports:'chart',settings:'gear'};$$('.nav a').forEach(a=>{a.innerHTML=ic(NAVI[a.dataset.route])+a.textContent});
$('#galla').addEventListener('click',dayClose);paintShop();
boot({name:'Galla',key:KEY,routes:[{path:'overview',label:'Today',render:pgOverview},{path:'till',label:'Till',render:pgTill},{path:'khata',label:'Khata book',render:pgKhata},{path:'bills',label:'Bills',render:pgBills},{path:'stock',label:'Stock',render:pgStock},{path:'reports',label:'Reports',render:pgReports},{path:'settings',label:'Settings',render:pgSettings}],
  commands:[{label:'New sale',run:()=>go('till')},{label:'Add khata customer',run:()=>custForm()},{label:'Add product',run:()=>prodForm()},{label:'Count galla (day close)',run:dayClose},{label:'Customers over 30 days',run:()=>{TS.kh={q:'',chip:'30+ days',sort:2,dir:-1,page:0};go('khata')}}],
  notes:()=>{const st=stats(),n=[];S.products.filter(p=>p.stock<=p.re).slice(0,4).forEach(p=>n.push({id:'low-'+p.id+'-'+p.stock,text:p.stock?p.name+': only '+p.stock+' left':p.name+' is out of stock',sub:'Restock soon',href:'#/stock'}));S.customers.filter(c=>{const s=st.get(c.id);return s.bal>c.limit}).slice(0,3).forEach(c=>n.push({id:'lim-'+c.id,text:c.name+' is over the credit limit',sub:rs(st.get(c.id).bal)+' due',href:'#/khata'}));S.customers.filter(c=>st.get(c.id).days>60).slice(0,3).forEach(c=>n.push({id:'old-'+c.id,text:c.name+' has owed for '+st.get(c.id).days+' days',sub:'Send a reminder',href:'#/khata'}));return n},
  onRender:()=>paintGalla()});
</script>
</body>
