<!doctype html>
<!-- Chill & Craft · Graystar · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graystar · Review desk</title>
<meta name="description" content="A review management dashboard in black, white and grey: an ink-filled rating star, a review inbox with replies, locations, review requests, topics, an embeddable widget, competitors and reports.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "graystar:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: only black, white and greys
   ========================================================= */
:root {
  color-scheme: light;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --r: 0px; --r-sm: 0px;
  --bg: #f6f6f4; --surface: #ffffff; --surface2: #efefec; --ink: #0d0d0d; --muted: #6b6b6b; --line: #d9d9d6;
  --accent: #0d0d0d; --accent-ink: #ffffff; --focus: #0d0d0d; --ok: #0d0d0d; --warn: #6b6b6b; --bad: #0d0d0d; --info: #444;
  --c1: #0d0d0d; --c2: #5a5a5a; --c3: #8e8e8e; --c4: #bdbdbd; --c5: #d9d9d6;
  --hatch: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 6px); --tip-bg: #0d0d0d;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0b0b; --surface: #121212; --surface2: #1a1a1a; --ink: #f1f1ef; --muted: #9a9a98; --line: #2b2b2b;
  --accent: #f1f1ef; --accent-ink: #0b0b0b; --focus: #f1f1ef; --ok: #f1f1ef; --warn: #9a9a98; --bad: #f1f1ef; --info: #c4c4c4;
  --c1: #f1f1ef; --c2: #b5b5b3; --c3: #848482; --c4: #555553; --c5: #333;
  --tip-bg: #f1f1ef;
}
[data-theme="dark"] #tip { color: #0b0b0b; }
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbars { display: grid; gap: 11px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
.hb-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.hb-fill { height: 100%; width: var(--w); border-radius: inherit; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hbIn { from { width: 0; } }
.heat { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }

.hc { aspect-ratio: 1.5; min-height: 10px; border-radius: 3px; opacity: var(--a); animation: cellIn .45s var(--d) both; }

@keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
.gauge { position: relative; margin: 0 auto; width: 100%; }

/* drag board */
.kboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.kcol { display: flex; flex-direction: column; min-height: 220px; border-radius: var(--r, 12px); }

.kcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }

.kdragging { opacity: .25; }
.kghost { position: fixed; left: 0; top: 0; z-index: 110; pointer-events: none; box-shadow: 0 22px 48px rgba(0,0,0,.3); cursor: grabbing; }

.kempty { padding: 18px 8px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-sm, 10px); }

@keyframes kdrop { 0% { transform: scale(.92); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 60% { box-shadow: 0 0 0 10px transparent; } 100% { transform: none; } }

/* page entrance (each app restyles @keyframes rise) */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .drawer { border-radius: 0; } }

/* =========================================================
   2. Shell: a newspaper masthead with a text nav
   ========================================================= */
.skip { position: absolute; left: -999px; top: 8px; z-index: 200; background: var(--ink); color: var(--bg); padding: 8px 12px; }
.skip:focus { left: 8px; }

.mast .r { justify-content: flex-end; }
.word { text-align: center; text-decoration: none; display: grid; justify-items: center; }
.word b { font: 700 40px/1 var(--serif); letter-spacing: -.02em; }
.word b span { display: inline-block; width: .7em; }
.word small { font: 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.find { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--ink); background: transparent; font: 11.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
kbd { font: 10.5px var(--mono); border: 1px solid var(--line); padding: 0 4px; }
.icon-btn { border-radius: 0; }
.t-ic .i-sun { display: none; } [data-theme="dark"] .t-ic .i-sun { display: block; } [data-theme="dark"] .t-ic .i-moon { display: none; }
.nav { position: relative; display: flex; justify-content: center; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--ink); overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { position: relative; z-index: 1; padding: 6px 12px; text-decoration: none; font: 600 12px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; transition: color .2s; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }
.nav-n { font: 700 10px var(--mono); margin-left: 4px; padding: 0 4px; background: var(--ink); color: var(--bg); letter-spacing: 0; }
.nav-n:empty { display: none; }
.nav-marker { position: absolute; bottom: 4px; left: 0; height: 2px; background: var(--ink); transition: transform .45s cubic-bezier(.3, 1.2, .4, 1), width .3s; pointer-events: none; }
.menu-btn { display: none; }
.nav-scrim { display: none; }
.view { outline: none; padding: 22px 0 60px; }

/* =========================================================
   3. Editorial blocks
   ========================================================= */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }

.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 0; border: 1px solid var(--ink); background: transparent; font: 600 11.5px var(--font); letter-spacing: .1em; text-transform: uppercase; min-height: 36px; }
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.btn.danger { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--ink); padding: 16px 18px; min-width: 0; transition: transform .25s, box-shadow .25s; }
.card:hover { transform: translateY(-3px); box-shadow: 6px 6px 0 var(--ink); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font: 700 19px var(--serif); }
.kpi { background: var(--ink); color: var(--bg); padding: 16px 18px; display: grid; gap: 2px; transition: transform .25s; }

.kpi span { font: 600 10.5px var(--font); letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
.kpi b { font: 700 34px/1.1 var(--serif); }
.kpi small { font: italic 13px var(--serif); opacity: .75; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
.pill { border-radius: 0; background: transparent; border: 1px solid var(--muted); color: var(--muted); font: 600 10.5px var(--font); letter-spacing: .1em; text-transform: uppercase; }

.pill.ok { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.pill.warn, .pill.info, .pill.acc { color: var(--ink); border-color: var(--ink); }
.chip { border-radius: 0; border-color: var(--ink); color: var(--ink); font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg, .seg button, .seg-thumb { border-radius: 0; }
.seg { border: 1px solid var(--ink); background: transparent; }
.seg-thumb { background: var(--ink); box-shadow: none; }
.seg button[aria-pressed="true"] { color: var(--bg); }
.av { border-radius: 50%; background: var(--surface2) !important; color: var(--ink) !important; border: 1px solid var(--ink); font-family: var(--serif); }
.tbl th { font: 600 10.5px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); border-bottom: 2px solid var(--ink); }
.layer, .pop { border-radius: 0; border: 1px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
.toast { border-radius: 0; }
.toast-dot { background: var(--bg) !important; }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp, .tbl-search { border-radius: 0; border-color: var(--ink); background: var(--surface); }
.sw-t { border-radius: 0; } .sw-t::after { border-radius: 0; }
.dseg:hover { opacity: .7; }

/* stars and the ink star */
.stars { display: inline-flex; gap: 1px; color: var(--ink); }
.stars .ic { width: 15px; height: 15px; fill: currentColor; stroke-width: 1.2; }
.stars .o { fill: none; color: var(--muted); }
.ink-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: center; }
.ink { width: 200px; height: 200px; display: block; }
.ink .lvl { transform-box: view-box; transform-origin: 0 100%; animation: inkUp 1.8s cubic-bezier(.3, .9, .3, 1) both; }
.ink .wave { animation: waveX 2.2s linear 3, fadeIn .6s 1.3s both; }
@keyframes inkUp { from { transform: scaleY(0); } }
@keyframes waveX { to { transform: translateX(-60px); } }
.big-r { font: 700 64px/1 var(--serif); letter-spacing: -.03em; }
.big-r small { font: italic 18px var(--serif); color: var(--muted); letter-spacing: 0; }
.dist { display: grid; gap: 6px; margin-top: 12px; }
.dist-r { display: grid; grid-template-columns: 40px 1fr 48px; gap: 10px; align-items: center; font: 12px var(--mono); }
.dist-t { height: 12px; border: 1px solid var(--ink); }
.dist-t i { display: block; height: 100%; width: var(--w); background: var(--ink); animation: hbIn 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d); }
.dist-r.low .dist-t i { background: var(--hatch); }

/* review cards */
.rv-list { display: grid; gap: 14px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ink); padding: 14px 16px; display: grid; gap: 8px; transition: transform .2s; }
.rv.neg { border-left-style: double; border-left-width: 6px; }
.rv:hover { transform: translateX(3px); }
.rv.new { animation: inkIn .9s both; }
@keyframes inkIn { from { opacity: 0; filter: blur(6px); transform: translateY(-8px); } }
.rv-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rv-h b { font: 700 15px var(--serif); }
.rv-h .meta { font: 11.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.rv-h .grow1 { flex: 1; }
.rv p.txt { font: 16px/1.55 var(--serif); }
.rv .reply { margin-left: 18px; padding: 10px 12px; border-left: 2px solid var(--muted); background: var(--surface2); font-size: 13.5px; }
.rv .reply b { display: block; font: 600 10.5px var(--font); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 3px; }
.rv-act { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rv-act .btn { min-height: 30px; padding: 0 10px; font-size: 10.5px; }
.rv-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.rv-tags span { font: 11px var(--mono); padding: 1px 6px; border: 1px dashed var(--muted); }
.composer { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--ink); }
.composer textarea { min-height: 80px; }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; }
.sugs button { border: 1px solid var(--line); background: var(--surface2); padding: 4px 8px; font: 12px var(--serif); font-style: italic; text-align: left; }
.sugs button:hover { border-color: var(--ink); }
.flt { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
.flt aside { position: sticky; top: 14px; display: grid; gap: 16px; }
.flt aside h3 { font: 600 10.5px var(--font); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.flt aside .chips { gap: 4px; }
.more { display: block; margin: 16px auto 0; }

/* topics, widget, QR */
.cloud { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: center; padding: 10px 0; }
.cloud button { border: 0; background: none; padding: 2px 4px; font-family: var(--serif); font-weight: 700; line-height: 1.1; color: var(--ink); transition: transform .2s; animation: rise .6s both; animation-delay: calc(var(--i) * 40ms); }
.cloud button:hover { transform: scale(1.08); }
.cloud button.neg { color: transparent; -webkit-text-stroke: 1px var(--ink); }
.cloud button.mix { color: var(--muted); }
.cloud button[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 3px; }
.wdg { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.preview { padding: 24px; border: 1px dashed var(--ink); background: repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in srgb, var(--ink) 3%, transparent) 10px 20px); min-height: 280px; display: grid; place-items: center; }
.w-box { width: 100%; max-width: 640px; padding: 16px; border: 1px solid #0d0d0d; background: #fff; color: #0d0d0d; font-family: var(--font); }

.w-box .stars { color: inherit; }
.w-items { display: grid; gap: 10px; }
.w-items.grid2 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.w-items.row1 { grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; }
.w-item { border: 1px solid currentColor; padding: 10px; font: 13.5px/1.45 var(--serif); }
.w-item b { display: block; font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
.w-badge { display: inline-flex; align-items: center; gap: 12px; padding: 10px 14px; border: 2px solid currentColor; }
.w-badge b { font: 700 30px var(--serif); }
pre.snip { margin: 0; padding: 12px; background: var(--surface2); border: 1px solid var(--line); font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
.qr { width: 150px; height: 150px; display: block; background: #fff; padding: 8px; border: 1px solid #000; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row small { display: block; color: var(--muted); font: italic 13px var(--serif); }
.chart-svg .line { stroke-width: 2.2; }
.fn-bar { color: var(--bg); }

/* =========================================================
   4. Responsive
   ========================================================= */
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: 1 / -1; } .flt, .wdg { grid-template-columns: 1fr; } .flt aside { position: static; } }
@media (max-width: 860px) {
  .paper { padding: 0 14px; }
  .mast { grid-template-columns: auto 1fr auto; }
  .mast .l .dateline, .find span, .find kbd { display: none; }
  .word b { font-size: 30px; }
  .menu-btn { display: inline-grid; }
  .nav { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: 240px; flex-direction: column; justify-content: flex-start; padding: 20px 0; background: var(--surface); border: 0; border-right: 2px solid var(--ink); transform: translateX(-104%); transition: transform .3s; overflow-y: auto; }
  .nav a { padding: 12px 20px; }
  .nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .nav-open .nav { transform: none; }

  .nav-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .3s; }

  .ink-wrap { grid-template-columns: 1fr; justify-items: center; }
}
@media (max-width: 560px) { .s3, .s6 { grid-column: 1 / -1; } .ph h1 { font-size: 26px; } .word small { display: none; } .find { width: 32px; padding: 0; justify-content: center; } .big-r { font-size: 48px; } }
</style>

/* ==========================================================
   CORE · small helpers used by this dashboard
   DOM, demo data, formatting, toasts, dialogs, router, charts,
   tables and a drag board. No libraries, no network.
   ========================================================== */
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches; // reduced motion
const $ = (s, r = document) => r.querySelector(s);

  funnel($("#rq-f"), [{ label: "Asked", value: tot.sent, color: "var(--c3)" }, { label: "Opened", value: tot.opened, color: "var(--c2)" }, { label: "Reviewed", value: tot.reviews, color: "var(--c1)" }]);
  $("#rq-print").onclick = () => { try { window.print(); } catch (e) { toast("Printing is blocked here", "warn"); } };
  $("#rq-new").onclick = () => formLayer({ title: "Send review requests", submit: "Send", fields: [{ k: "loc", label: "Branch", type: "select", options: DB.locs.map((l) => [l.id, l.name]), full: true }, { k: "ch", label: "Send by", type: "select", options: ["SMS", "Email"] }, { k: "n", label: "Guests from the last 7 days", type: "number", min: 1, max: 2000, req: true, value: 120 }, { k: "msg", label: "Message", type: "textarea", req: true, full: true, value: "Hi {name}, thanks for visiting Saffron Table. Would you share how it went? saffrontable.pk/r", check: (x) => (x.includes("{name}") ? "" : "Include {name} so it feels personal") }], onSubmit: (x) => { const a = { id: uid("a"), name: `${L(x.loc).name.split(",")[0]} · ${fdate(Date.now())}`, ch: x.ch, sent: x.n, opened: Math.round(x.n * (x.ch === "SMS" ? 0.9 : 0.55)), reviews: 0, on: true }; DB.asks.unshift(a); save(); rerender(); toast(`${fmt(x.n)} requests sent by ${x.ch}`); setTimeout(() => { a.reviews = Math.round(a.opened * 0.18); save(); if (App.cur === "requests") T.render(); }, RM ? 500 : 4000); } });
} };

/* ---------- Topics ---------- */
let topicSel = null;
App.pages.topics = { title: "Topics", render(v) {
  const stats = Object.keys(TOPICS).map((t) => { const rs2 = DB.reviews.filter((r) => r.topics.includes(t)); return { t, n: rs2.length, avg: avgR(rs2) }; }).sort((a, b) => b.n - a.n), mx = Math.max(1, ...stats.map((s) => s.n));
  v.innerHTML = head("What guests talk about", "Bigger words come up more. Solid words are praised, grey are mixed, outlined are complaints.") + `
  <div class="grid"><section class="card s7"><div class="card-h"><h2>Topic cloud</h2></div><div class="cloud" id="cloud">${stats.map((s, i) => `<button type="button" data-t="${s.t}" class="${s.avg >= 4 ? "" : s.avg >= 3 ? "mix" : "neg"}" aria-pressed="${s.t === topicSel}" style="font-size:${(16 + (s.n / mx) * 34).toFixed(0)}px;--i:${i}"${tipAttr(`<b>${esc(s.t)}</b> ${s.n} mentions · ${s.avg.toFixed(1)} ★`)}>${esc(s.t)}</button>`).join("")}</div></section>
  <section class="card s5"><div class="card-h"><h2>Rating when mentioned</h2></div><div id="tp-b"></div></section>
  <section class="card s12"><div class="card-h"><h2 id="tp-h">Pick a topic to read the reviews</h2></div><div class="rv-list" id="tp-l"></div></section></div>`;
  hbars($("#tp-b"), stats.map((s) => ({ label: s.t, value: +s.avg.toFixed(2), color: s.avg >= 4 ? "var(--ink)" : s.avg >= 3 ? "var(--c3)" : "var(--c4)" })), { fmt: (x) => x.toFixed(1) + " ★" });
  const show = () => { if (!topicSel) { $("#tp-l").innerHTML = ""; return; } const rs2 = DB.reviews.filter((r) => r.topics.includes(topicSel)); $("#tp-h").textContent = `“${topicSel}” in ${rs2.length} reviews`; $("#tp-l").innerHTML = rs2.slice(0, 6).map((r) => rvHTML(r)).join(""); };
  show();
  on($("#cloud"), "click", "[data-t]", (e, b) => { topicSel = topicSel === b.dataset.t ? null : b.dataset.t; $$("[data-t]", v).forEach((x) => x.setAttribute("aria-pressed", x.dataset.t === topicSel)); $("#tp-h").textContent = topicSel ? "" : "Pick a topic to read the reviews"; show(); });
} };

/* ---------- Widget builder ---------- */
App.pages.widgets = { title: "Widget", render(v) {
  const w = DB.widget;
  v.innerHTML = head("Website widget", "Show your best reviews on your own site. Change the settings and the preview updates.") + `
  <div class="wdg"><section class="card"><form id="wf" class="form-grid" style="grid-template-columns:1fr" novalidate>
    <div class="field"><label for="wf-s">Layout</label><select id="wf-s">${[["grid", "Grid of cards"], ["row", "Sliding row"], ["badge", "Small rating badge"]].map(([a, b]) => `<option value="${a}" ${a === w.style ? "selected" : ""}>${b}</option>`).join("")}</select></div>
    <div class="field"><label for="wf-t">Colours</label><select id="wf-t"><option value="light" ${w.theme === "light" ? "selected" : ""}>White paper</option><option value="dark" ${w.theme === "dark" ? "selected" : ""}>Black paper</option></select></div>
    <div class="field"><label for="wf-m">Only show reviews with at least</label><div class="range-row"><input type="range" id="wf-m" min="1" max="5" value="${w.min}"><output for="wf-m" id="wf-mv">${w.min} ★</output></div></div>
    <div class="field"><label for="wf-c">How many reviews</label><input id="wf-c" type="number" min="1" max="8" value="${w.count}" aria-describedby="wf-c-e"><p class="err" id="wf-c-e"></p></div>
    <div class="row"><button type="button" class="btn primary" id="wf-copy">Copy embed code</button><button type="button" class="btn" id="wf-save">Save</button></div></form></section>
  <section class="card"><div class="card-h"><h2>Preview</h2></div><div class="preview" id="wp"></div><p class="muted" style="font:italic 13px var(--serif);margin:12px 0 6px">Embed code</p><pre class="snip" id="wcode"></pre></section></div>`;
  const draw = () => {
    const list = DB.reviews.filter((r) => r.r >= w.min).slice(0, w.count), a = avgR(DB.reviews);
    $("#wp").innerHTML = `<div class="w-box${w.theme === "dark" ? " dk" : ""}">${w.style === "badge" ? `<div class="w-badge"><b>${a.toFixed(1)}</b><div>${stars(a, 18)}<div style="font:600 11px var(--font);letter-spacing:.1em;text-transform:uppercase;margin-top:4px">${fmt(DB.reviews.length)} reviews · Graystar</div></div></div>` : `<div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font:700 18px var(--serif)">What guests say</b><span class="row" style="gap:6px">${stars(a)}<b>${a.toFixed(1)}</b></span></div><div class="w-items ${w.style === "grid" ? "grid2" : "row1"}">${list.map((r) => `<div class="w-item">${stars(r.r, 12)}<p>“${esc(r.text.slice(0, 110))}${r.text.length > 110 ? "…" : ""}”</p><b>${esc(r.name)} · ${esc(L(r.loc).name.split(",")[0])}</b></div>`).join("") || `<p>No reviews match these settings yet.</p>`}</div>`}</div>`;
    $("#wcode").textContent = `<div id="graystar-widget" data-layout="${w.style}" data-theme="${w.theme}" data-min="${w.min}" data-count="${w.count}"></div>\n<script defer src="(your site)/graystar-widget.js"><\/script>`;
  };
  draw();
  $("#wf-s").onchange = (e) => { w.style = e.target.value; draw(); };
  $("#wf-t").onchange = (e) => { w.theme = e.target.value; draw(); };
  $("#wf-m").addEventListener("input", (e) => { w.min = +e.target.value; $("#wf-mv").textContent = w.min + " ★"; draw(); });
  $("#wf-c").addEventListener("input", (e) => { const n = +e.target.value; $("#wf-c-e").textContent = n >= 1 && n <= 8 ? "" : "Pick 1 to 8"; if (!$("#wf-c-e").textContent) { w.count = n; draw(); } });
  $("#wf-copy").onclick = () => copyText($("#wcode").textContent, "Embed code copied");
  $("#wf-save").onclick = () => { save(); toast("Widget settings saved"); };
} };

/* ---------- Competitors ---------- */
App.pages.competitors = { title: "Competitors", render(v) {
  v.innerHTML = head("Against the neighbours", "Public ratings of places guests also visit", `<button type="button" class="btn primary" id="cp-add">Track a competitor</button>`) + `
  <div class="grid"><section class="card s7"><div class="card-h"><h2>Rating over 12 months</h2></div><div class="chart" id="cp-l"></div></section>
  <section class="card s5"><div class="card-h"><h2>Today</h2></div><div id="cp-b"></div></section>
  <section class="card s12"><div class="card-h"><h2>Table</h2></div><div id="cp-t"></div></section></div>`;
  const greys = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c2)", "var(--c3)"];
  lineChart($("#cp-l"), { labels: rangeLabels("12M"), series: DB.comps.slice(0, 5).map((c, i) => ({ name: c.name, data: c.trend, color: greys[i], dash: !c.you && i > 2 })), h: 240, area: false, fmt: (x) => x.toFixed(1), tipFmt: (x) => x.toFixed(2), label: "Ratings of competitors" });
  hbars($("#cp-b"), [...DB.comps].sort((a, b) => b.r - a.r).map((c) => ({ label: c.name, value: c.r, color: c.you ? "var(--ink)" : "var(--c4)" })), { fmt: (x) => x.toFixed(1) + " ★" });
  table($("#cp-t"), { rows: () => DB.comps, size: 8, sort: "r", dir: -1, cols: [{ k: "name", label: "Place", render: (r) => `<b style="font-family:var(--serif)">${esc(r.name)}</b>` }, { k: "r", label: "Rating", render: (r) => `<span class="row" style="gap:8px">${stars(r.r)}${r.r.toFixed(1)}</span>` }, { k: "n", label: "Reviews", cls: "r", render: (r) => fmt(r.n) }, { k: "gap", label: "vs you", cls: "r", val: (r) => r.r - DB.comps[0].r, render: (r) => (r.you ? "—" : ((r.r - DB.comps[0].r) >= 0 ? "+" : "") + (r.r - DB.comps[0].r).toFixed(1)) }, { k: "x", label: "", sort: false, cls: "r", render: (r) => (r.you ? "" : `<button type="button" class="btn" data-act="rm" style="min-height:28px">Stop tracking</button>`) }],
    onRow: (r) => toast(`${r.name}: ${r.r.toFixed(1)} from ${fmt(r.n)} reviews`, "info"), onAct: async (a, r) => { if (await confirmBox(`Stop tracking ${r.name}?`, "Its history is removed from these charts.", "Stop tracking")) { DB.comps.splice(DB.comps.indexOf(r), 1); save(); rerender(); toast("No longer tracked", "warn"); } } });
  $("#cp-add").onclick = () => formLayer({ title: "Track a competitor", fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "r", label: "Current rating", type: "number", step: 0.1, min: 1, max: 5, req: true }, { k: "n", label: "Number of reviews", type: "number", min: 0, req: true }], onSubmit: (x) => { DB.comps.push({ id: uid("c"), ...x, trend: Array.from({ length: 12 }, () => +(x.r + rf(-0.15, 0.15)).toFixed(2)), you: false }); save(); rerender(); toast(x.name + " is now tracked"); } });
} };

/* ---------- Reports ---------- */
App.pages.reports = { title: "Reports", render(v) {
  v.innerHTML = head("Monthly report", `${MON[new Date(NOW).getMonth()]} ${new Date(NOW).getFullYear()} edition`, `<button type="button" class="btn" id="rp-csv">Download CSV</button><button type="button" class="btn primary" id="rp-mail">Email report</button>`) + `
  <div class="grid"><section class="card s8"><div class="card-h"><h2>Rating by branch</h2></div><div class="chart" id="rp-l"></div></section>
  <section class="card s4"><div class="card-h"><h2>Where reviews come from</h2></div><div id="rp-d"></div></section>
  <section class="card s6"><div class="card-h"><h2>Reviews per month</h2></div><div class="chart" id="rp-b"></div></section>
  <section class="card s6"><div class="card-h"><h2>Hours to reply</h2></div><div class="chart" id="rp-r"></div></section></div>`;
  lineChart($("#rp-l"), { labels: rangeLabels("12M"), series: DB.locs.map((l, i) => ({ name: l.name.split(",")[0], data: DB.monthly[i] || [], color: ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c2)"][i % 5], dash: i > 2 })), h: 240, area: false, fmt: (x) => x.toFixed(1), tipFmt: (x) => x.toFixed(2), label: "Rating by branch" });
  donut($("#rp-d"), { data: SOURCES.map((s, i) => ({ label: s, value: DB.reviews.filter((r) => r.src === s).length, color: ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"][i] })), size: 140, thick: 22, sub: "reviews", cfmt: "n" });
  barChart($("#rp-b"), { labels: rangeLabels("12M"), series: [{ name: "Reviews", data: DB.volume, color: "var(--ink)" }], h: 200, label: "Reviews per month" });
  lineChart($("#rp-r"), { labels: rangeLabels("12M"), series: [{ name: "Median hours", data: DB.rtime, color: "var(--ink)" }], h: 200, label: "Reply time" });
  $("#rp-csv").onclick = () => download("graystar-report.csv", ["Branch," + rangeLabels("12M").join(","), ...DB.locs.map((l, i) => `"${l.name}",` + (DB.monthly[i] || []).join(","))].join("\n"));
  $("#rp-mail").onclick = () => formLayer({ title: "Email this report", submit: "Send", fields: [{ k: "to", label: "To", type: "email", req: true, full: true, value: DB.alert.mail }, { k: "note", label: "Note", type: "textarea", full: true, value: "Here is this month's review report." }], onSubmit: (x) => toast("Report sent to " + x.to) });
} };

/* ---------- Settings ---------- */
App.pages.settings = { title: "Settings", render(v) {
  v.innerHTML = head("Settings", "Alerts, team and demo data") + `
  <div class="grid"><section class="card s6"><div class="card-h"><h2>Unhappy-guest alert</h2></div><form id="al" class="form-grid" novalidate><div class="full set-row" style="padding:0 0 8px"><div><b>Alert me</b><small>when a low review arrives</small></div>${sw("al-on", DB.alert.on, "Alert on")}</div><div class="field"><label for="al-m">At or below</label><select id="al-m">${[1, 2, 3].map((n) => `<option ${n === DB.alert.max ? "selected" : ""}>${n}</option>`).join("")}</select></div><div class="field"><label for="al-e">Send to</label><input id="al-e" type="email" value="${esc(DB.alert.mail)}" aria-describedby="al-e-e"><p class="err" id="al-e-e"></p></div><div class="full"><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card s6"><div class="card-h"><h2>Team</h2><button type="button" class="btn" id="tm-add">Invite</button></div><div id="tm"></div></section>
  <section class="card s6"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Black paper</b><small>The dark edition</small></div>${sw("st-dark", Theme.get() === "dark", "Dark theme")}</div><div class="set-row"><div><b>Reset demo data</b><small>Every review returns to the sample</small></div><button type="button" class="btn danger ghost" id="st-reset">Reset</button></div></section></div>`;
  const team = () => { $("#tm").innerHTML = DB.team.map((t, i) => `<div class="set-row"><div class="row">${av(t.name)}<div><b>${esc(t.name)}</b><small>${t.role}</small></div></div>${i ? `<button type="button" class="icon-btn" data-rm="${i}" aria-label="Remove ${esc(t.name)}">${ic("trash")}</button>` : pill("Owner", "ok")}</div>`).join(""); };
  team();
  $("#al").onsubmit = (e) => { e.preventDefault(); const m = $("#al-e").value.trim(); $("#al-e-e").textContent = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m) ? "" : "Enter a valid email address"; if ($("#al-e-e").textContent) return $("#al-e").focus(); Object.assign(DB.alert, { on: $("#al-on").checked, max: +$("#al-m").value, mail: m }); save(); toast("Alert saved"); };
  on($("#tm"), "click", "[data-rm]", async (e, b) => { const t = DB.team[+b.dataset.rm]; if (await confirmBox("Remove " + t.name + "?", "They can no longer reply to reviews.", "Remove")) { DB.team.splice(+b.dataset.rm, 1); save(); team(); toast("Removed", "warn"); } });
  $("#tm-add").onclick = () => formLayer({ title: "Invite a teammate", fields: [{ k: "name", label: "Name", req: true }, { k: "role", label: "Role", type: "select", options: ["Marketing", "Branch manager", "Owner"] }, { k: "email", label: "Email", type: "email", req: true, full: true }], onSubmit: (x) => { DB.team.push(x); save(); team(); toast("Invite sent to " + x.email); } });
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-reset").onclick = async () => { if (await confirmBox("Reset demo data?", "Every review, reply and branch returns to the sample.", "Reset")) { store.del(KEY); DB = seed(); chrome(); rerender(); toast("Demo data reset"); } };
} };

/* ---------- Live: a new review now and then ---------- */
every(12000, () => {
  if (chance(0.3)) return;
  const r = mkReview(DB.seq++, Date.now(), DB.locs); r.reply = null; DB.reviews.unshift(r); if (DB.reviews.length > 140) DB.reviews.pop(); save(); chrome();
  if (DB.alert.on && r.r <= DB.alert.max) Notes.add(`${r.r}★ from ${r.name} at ${L(r.loc).name.split(",")[0]}`, "bad"); else Notes.add(`New ${r.r}★ review on ${r.src}`, "info");
  const f = $("#ov-feed"); if (f) { f.insertAdjacentHTML("afterbegin", rvHTML(r, true)); while (f.children.length > 3) f.lastElementChild.remove(); }
  const k = $("#k-new"); k && countUp(k, DB.reviews.filter((x) => Date.now() - x.t < 30 * DAY).length, fmt, 500);
});
App.commands = () => [{ label: "Reply to waiting reviews", hint: "Reviews", run: () => { rf2.open = true; go("#/reviews"); } }, { label: "Send review requests", hint: "Requests", run: () => { go("#/requests"); setTimeout(() => $("#rq-new") && $("#rq-new").click(), 60); } }, ...DB.locs.map((l) => ({ label: l.name, hint: "Branch", run: () => { rf2.loc = l.id; go("#/reviews"); } })), ...Object.keys(TOPICS).map((t) => ({ label: "Topic: " + t, hint: "Topics", run: () => { topicSel = t; go("#/topics"); } }))];
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; };
[["1★ from a guest at Clifton: “we waited 50 minutes”", "bad", 25], ["Gulberg passed 300 reviews", "info", 200], ["Reply rate this week: 81%", "info", 600]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
chrome();
boot({ title: "Graystar", key: "graystar", def: "overview" });
</script>
</body>
