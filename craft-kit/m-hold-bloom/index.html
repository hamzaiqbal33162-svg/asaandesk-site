<!doctype html>
<!-- Chill & Craft · Hold Bloom · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hold Bloom · long-press quick actions on a home screen</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --page: #f6edf3;
    --p1: #f9d9e8;
    --p2: #ffe2cc;
    --p3: #c9a6ff;
    --p4: #ffb38a;
    --ink: #24132e;
    --muted: #76627f;
    --accent: #c43f86;
    --chip: rgba(255, 255, 255, 0.7);
    --chip-line: rgba(80, 30, 90, 0.12);
    --shadow: rgba(60, 10, 70, 0.45);
    /* wallpaper */
    --w1: #5a3db6;
    --w2: #c94a8b;
    --w3: #ff9c5f;
    --wb1: #8f6bff;
    --wb2: #ff7aa8;
    --sun: #ffe3b3;
    --h1: #a3447f;
    --h2: #7a2f77;
    --h3: #4d2163;
    --stars: 0;
    /* frosted glass */
    --glass: rgba(255, 248, 252, 0.74);
    --glass-ink: #26132f;
    --glass-muted: #7b6684;
    --glass-line: rgba(60, 20, 70, 0.14);
    --hl: rgba(120, 50, 140, 0.11);
    --sep: rgba(60, 20, 70, 0.08);
    --danger: #e0294f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --page: #0c0911;
    --p1: #2a1238;
    --p2: #3a1626;
    --p3: #4b2a9a;
    --p4: #8a2f5a;
    --ink: #f6eefb;
    --muted: #b3a2bf;
    --accent: #ff7ab8;
    --chip: rgba(255, 255, 255, 0.06);
    --chip-line: rgba(255, 255, 255, 0.12);
    --shadow: rgba(0, 0, 0, 0.75);
    --w1: #090a22;
    --w2: #341348;
    --w3: #923661;
    --wb1: #3b2a8f;
    --wb2: #8a2a62;
    --sun: #f3e6d0;
    --h1: #3b1849;
    --h2: #270f37;
    --h3: #160823;
    --stars: 1;
    --glass: rgba(38, 26, 48, 0.76);
    --glass-ink: #f7eefb;
    --glass-muted: #baa7c6;
    --glass-line: rgba(255, 255, 255, 0.1);
    --hl: rgba(255, 255, 255, 0.1);
    --sep: rgba(0, 0, 0, 0.28);
    --danger: #ff8aa0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 700px at 12% 8%, var(--p1), transparent 62%),
      radial-gradient(900px 640px at 92% 95%, var(--p2), transparent 60%),
      var(--page);
    overflow: hidden;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  button { font: inherit; }

  /* ---------- Stage, caption and phone frame ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 64px;
    padding: 16px;
    overflow: hidden;
  }
  .blob { position: absolute; width: 440px; height: 440px; border-radius: 50%; filter: blur(80px); opacity: 0.5; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
  .b1 { background: var(--p3); top: -140px; left: -90px; }
  .b2 { background: var(--p4); bottom: -160px; right: -110px; animation-duration: 23s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.12); } }

  .caption { display: none; position: relative; max-width: 300px; }
  .caption .kick { font-size: 12px; font-weight: 750; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  .caption h1 { font-size: 46px; line-height: 1; letter-spacing: -0.04em; margin: 10px 0 12px; }
  .caption p { margin: 0 0 18px; color: var(--muted); font-size: 15.5px; line-height: 1.55; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { padding: 7px 12px; border-radius: 999px; background: var(--chip); border: 1px solid var(--chip-line); font-size: 13px; font-weight: 650; }
  @media (min-width: 900px) { .caption { display: block; } }

  .device {
    position: relative;
    flex: none;
    width: min(390px, 100%);
    height: clamp(540px, calc(100vh - 32px), 760px);
    height: clamp(540px, calc(100dvh - 32px), 760px);
    padding: 10px;
    border-radius: 54px;
    background: linear-gradient(150deg, #2c2335, #0e0a13);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -40px var(--shadow), 0 20px 40px -24px var(--shadow);
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    isolation: isolate;
    background: #120a1a;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  @media (max-width: 480px) {
    .stage { padding: 0; }
    .device { width: 100%; height: 100vh; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; }
    .screen { border-radius: 0; }
  }

  /* ---------- Wallpaper ---------- */
  .wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .wall .stars circle { opacity: var(--stars); animation: twinkle 3s ease-in-out infinite alternate; }
  .wall .stars circle:nth-child(3n) { animation-delay: -1.2s; }
  .wall .stars circle:nth-child(3n + 1) { animation-delay: -2.1s; }
  @keyframes twinkle { to { opacity: calc(var(--stars) * 0.25); } }
  .wall .hill { animation: sway 14s ease-in-out infinite alternate; }
  .wall .hb { animation-duration: 19s; animation-direction: alternate-reverse; }
  .wall .hc { animation-duration: 24s; }
  @keyframes sway { to { transform: translateX(-16px); } }
  .wall .sunny { animation: bob 9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-10px); } }
  .wall .wblob { animation: drift 16s ease-in-out infinite alternate; }

  /* ---------- Home screen ---------- */
  .shell {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: 12px;
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.4s, filter 0.4s;
  }
  .shell.away { transform: scale(0.9); opacity: 0.4; filter: blur(2px); }
  .status { flex: none; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 8px 28px 0 34px; color: #fff; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .sicons { display: flex; gap: 6px; align-items: center; }
  .sicons svg { height: 12px; width: auto; fill: #fff; }

  .widget {
    flex: none;
    margin: 6px 18px 18px;
    padding: 14px 16px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.24);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: 0 14px 30px -18px rgba(20, 0, 30, 0.6);
  }
  .w-sun { width: 48px; height: 48px; flex: none; }
  .w-sun .rays { transform-origin: 24px 24px; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .w-main b { display: block; font-size: 34px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
  .w-main span { font-size: 12.5px; font-weight: 650; opacity: 0.9; }
  .w-side { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.5; opacity: 0.92; }
  .w-side b { display: block; font-size: 12.5px; }

  .grid { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 16px; margin: 0 10px; flex: none; }

  /* "Now playing" widget: only on tall screens, where the home screen has room for it */
  .np {
    display: none; flex: none; position: relative; overflow: hidden;
    margin: 20px 18px 0; padding: 12px 14px 16px; border-radius: 24px;
    align-items: center; gap: 12px; text-align: left; cursor: pointer;
    color: #fff; font: inherit;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.24);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: 0 14px 30px -18px rgba(20, 0, 30, 0.6);
    transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .np:active { transform: scale(0.97); }
  .np:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (min-height: 740px) { .np { display: flex; } }
  .np-art { width: 52px; height: 52px; flex: none; border-radius: 14px; background: linear-gradient(150deg, #ff7d96, #8b3fd1); display: grid; place-items: center; box-shadow: 0 8px 16px -8px rgba(20, 0, 30, 0.6); }
  .np-art svg { width: 30px; height: 30px; }
  .np-txt { flex: 1; min-width: 0; }
  .np-txt small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  .np-txt b { display: block; font-size: 15px; margin: 1px 0; }
  .np-txt span { font-size: 12px; opacity: 0.85; }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 22px; flex: none; }
  .eq i { width: 4px; height: 100%; border-radius: 2px; background: #fff; transform-origin: 50% 100%; animation: eq 0.9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-duration: 0.7s; animation-delay: -0.3s; }
  .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.6s; }
  .eq i:nth-child(4) { animation-duration: 0.8s; animation-delay: -0.2s; }
  @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
  .np-bar { position: absolute; left: 14px; right: 14px; bottom: 8px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
  .np-bar i { position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; animation: np-progress 48s linear infinite; }
  @keyframes np-progress { from { transform: scaleX(0.12); } to { transform: scaleX(1); } }
  .booting .np { animation: drop-in 0.7s cubic-bezier(0.25, 1.3, 0.5, 1) 0.3s backwards; }
  .spacer { flex: 1; min-height: 8px; }
  .dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 12px; flex: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); }
  .dots i:first-child { background: #fff; }
  .dockwrap {
    flex: none;
    margin: 0 12px;
    padding: 12px 6px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.22);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    backdrop-filter: blur(18px) saturate(1.5);
  }
  .dock { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .dock .lbl { display: none; }

  /* one app: tile (moves when dragged) > wob (wiggles) > app button + minus badge */
  .tile { position: relative; display: flex; justify-content: center; touch-action: none; }
  .tile.dragging, .tile.landing { z-index: 6; }
  .wob { position: relative; display: flex; flex-direction: column; align-items: center; }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 0; border: 0; background: none; color: #fff; cursor: pointer;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; outline: none;
  }
  .ic { position: relative; width: 58px; height: 58px; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), filter 0.3s; }
  .pressing .ic { transform: scale(0.9); filter: brightness(0.86); transition: transform 0.45s cubic-bezier(0.3, 0, 0.25, 1), filter 0.45s; }
  .held .ic { opacity: 0; }
  .icon {
    position: relative; display: grid; place-items: center; width: 100%; height: 100%;
    border-radius: 27%; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 5px rgba(0, 0, 0, 0.14), 0 7px 14px -7px rgba(25, 0, 35, 0.55);
  }
  .icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 50%); pointer-events: none; }
  .icon svg { width: 76%; height: 76%; display: block; font-family: inherit; }
  .icon .sec { transform-origin: 24px 24px; animation: spin 60s steps(60) infinite; }
  .icon .gear { transform-origin: 24px 24px; animation: spin 14s linear infinite; }
  .icon .needle { transform-origin: 24px 24px; animation: needle 4s ease-in-out infinite alternate; }
  @keyframes needle { to { transform: rotate(28deg); } }
  .ring { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; transition: stroke-dashoffset 0.2s, opacity 0.2s; pointer-events: none; }
  .pressing .ring { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 0.45s linear, opacity 0.1s; }
  .lbl { font-size: 11.5px; font-weight: 560; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.38); max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.2s; }
  .app:focus-visible .icon { outline: 3px solid #fff; outline-offset: 3px; }
  .tile.dragging .lbl, .tile.gone .lbl { opacity: 0; }
  .tile.dragging .icon { box-shadow: 0 22px 34px -12px rgba(20, 0, 30, 0.6); }
  .tile.gone { pointer-events: none; }

  /* edit mode: wiggle + minus badges */
  .minus {
    position: absolute; top: -7px; left: calc(50% - 36px); z-index: 2;
    width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: rgba(56, 42, 66, 0.82); color: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    visibility: hidden; transform: scale(0);
    transition: transform 0.25s ease-in, visibility 0s 0.25s;
  }
  .minus svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .jiggle .minus { visibility: visible; transform: scale(1); transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1) var(--md, 0ms), visibility 0s; }
  .jiggle .wob { animation: wob 0.27s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  .jiggle .tile.dragging .wob { animation: none; }
  @keyframes wob { from { transform: rotate(calc(var(--a, 2deg) * -1)); } to { transform: rotate(var(--a, 2deg)) translateY(-0.6px); } }
  .done {
    position: absolute; z-index: 25; top: 50px; right: 16px;
    padding: 7px 18px; border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, 0.9); color: #2a1638; font-size: 14px; font-weight: 750;
    box-shadow: 0 8px 18px -8px rgba(20, 0, 30, 0.6);
    visibility: hidden; opacity: 0; transform: translateY(-14px) scale(0.6);
    transition: transform 0.25s, opacity 0.2s, visibility 0s 0.25s;
  }
  .jiggle .done { visibility: visible; opacity: 1; transform: none; transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s, visibility 0s; }
  .done:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* boot-up entrance */
  .booting .wob { animation: pop-in 0.6s cubic-bezier(0.3, 1.45, 0.5, 1) backwards; animation-delay: var(--i, 0ms); }
  .booting .widget { animation: drop-in 0.7s cubic-bezier(0.25, 1.3, 0.5, 1) backwards; }
  .booting .dockwrap { animation: rise 0.7s cubic-bezier(0.25, 1.3, 0.5, 1) 0.2s backwards; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(16px) scale(0.5); } }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-24px) scale(0.94); } }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } }

  /* ---------- Long-press layer: dim, lifted icon, menu ---------- */
  .dim {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(28, 8, 38, 0.24);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    backdrop-filter: blur(12px) saturate(1.2);
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s, visibility 0s 0.3s;
  }
  .dim.on { opacity: 1; visibility: visible; transition: opacity 0.3s; }
  .lift { position: absolute; z-index: 31; pointer-events: none; }
  .lift .icon { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 20px 34px -10px rgba(20, 0, 30, 0.65); }
  .rip { position: absolute; z-index: 31; border: 2px solid rgba(255, 255, 255, 0.85); border-radius: 30%; pointer-events: none; }
  .menu {
    position: absolute; z-index: 32; left: 0; top: 0;
    width: min(238px, calc(100% - 24px));
    padding: 6px;
    border-radius: 20px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.7);
    backdrop-filter: blur(24px) saturate(1.7);
    color: var(--glass-ink);
    box-shadow: 0 26px 50px -18px rgba(20, 0, 30, 0.6), 0 0 0 0.5px var(--glass-line);
    opacity: 0; visibility: hidden; transform: scale(0.25);
    transition: transform 0.22s cubic-bezier(0.4, 0, 1, 1), opacity 0.2s, visibility 0s 0.22s;
    outline: none;
  }
  .menu.open { opacity: 1; visibility: visible; transform: none; transition: transform 0.5s cubic-bezier(0.2, 1.35, 0.4, 1), opacity 0.16s, visibility 0s; }
  .mitem {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 12px; border: 0; border-radius: 13px; background: none; color: inherit;
    font-size: 14.5px; font-weight: 560; text-align: left; cursor: pointer; outline: none;
    opacity: 0; transform: translateY(var(--from, -8px));
    transition: opacity 0.12s;
  }
  .menu[data-side="above"] .mitem { --from: 8px; }
  .menu.open .mitem { opacity: 1; transform: none; transition: opacity 0.16s var(--dl, 0ms), transform 0.45s cubic-bezier(0.2, 1.5, 0.4, 1) var(--dl, 0ms), background 0.15s; }
  .mitem:hover, .mitem.hot, .mitem:focus-visible { background: var(--hl); }
  .mitem:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .mitem.picked { animation: picked 0.3s ease-out; }
  @keyframes picked { 40% { background: var(--hl); transform: scale(0.96); } }
  .mitem svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mitem.danger { color: var(--danger); }
  .msep { height: 6px; margin: 4px -6px; background: var(--sep); }

  /* ---------- Banner ---------- */
  .banner {
    position: absolute; z-index: 40; top: 8px; left: 8px; right: 8px;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 22px;
    background: var(--glass); color: var(--glass-ink);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 18px 36px -16px rgba(20, 0, 30, 0.55), 0 0 0 0.5px var(--glass-line);
    transform: translateY(-140%) scale(0.95); opacity: 0;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    cursor: pointer;
  }
  .banner.show { transform: none; opacity: 1; transition: transform 0.65s cubic-bezier(0.2, 1.45, 0.35, 1), opacity 0.2s; }
  .b-icon { width: 36px; height: 36px; flex: none; }
  .b-icon .icon { border-radius: 10px; }
  .b-text { flex: 1; min-width: 0; }
  .b-text b { display: block; font-size: 13.5px; }
  .b-text span { display: block; font-size: 13px; color: var(--glass-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner small { align-self: flex-start; font-size: 11.5px; color: var(--glass-muted); margin-top: 2px; }
  .b-undo { flex: none; border: 0; border-radius: 999px; padding: 7px 13px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 750; cursor: pointer; }
  .b-undo[hidden] { display: none; }
  .b-undo:focus-visible { outline: 3px solid var(--glass-ink); outline-offset: 2px; }

  /* ---------- App splash (short tap) ---------- */
  .splash { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; visibility: hidden; clip-path: inset(50% round 40px); color: #fff; }
  .splash.on { visibility: visible; }
  .sp-in { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 0 24px; }
  .sp-glyph { width: 112px; height: 112px; filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.18)); }
  .sp-glyph svg { width: 100%; height: 100%; }
  .sp-name { font-size: 28px; font-weight: 760; letter-spacing: -0.03em; }
  .sp-tag { font-size: 14px; opacity: 0.82; }
  .sp-bar { width: 120px; height: 4px; border-radius: 4px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; position: relative; margin-top: 6px; }

    }
    function pressEnd(x, y, cancel) {
      var p = press;
      if (!p) return;
      press = null;
      clearTimeout(p.timer);
      p.tile.classList.remove("pressing");
      if (p.mode === "hold") { if (!cancel && p.id === "demo") openApp(p.tile); } // real taps open through "click"
      else suppressUntil = performance.now() + 450;
      if (p.mode === "menu" && p.hot) { p.hot.classList.remove("hot"); if (!cancel) pick(p.hot); }
      if (p.mode === "jig" && p.dragging) drop(p);
    }

    shell.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target.closest(".minus")) return;
      var btn = e.target.closest(".app");
      if (!btn) return;
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      pressStart(btn.closest(".tile"), e.clientX, e.clientY, e.pointerId);
    });
    shell.addEventListener("pointermove", function (e) { if (press && press.id === e.pointerId) pressMove(e.clientX, e.clientY); });
    shell.addEventListener("pointerup", function (e) { if (press && press.id === e.pointerId) pressEnd(e.clientX, e.clientY, false); });
    shell.addEventListener("pointercancel", function (e) { if (press && press.id === e.pointerId) pressEnd(e.clientX, e.clientY, true); });
    shell.addEventListener("click", function (e) {
      var mi = e.target.closest(".minus");
      if (mi) { if (jiggle) removeTile(mi.closest(".tile")); return; }
      var btn = e.target.closest(".app");
      if (!btn || jiggle || performance.now() < suppressUntil) return;
      openApp(btn.closest(".tile"));
    });
    // right-click (and the long-press menu some phones fire) opens the quick actions
    screen.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      var btn = e.target.closest && e.target.closest(".app");
      if (!btn || jiggle) return;
      var tile = btn.closest(".tile");
      if (press && press.tile === tile && press.mode === "hold") { clearTimeout(press.timer); press.mode = "menu"; }
      openMenu(tile, false);
    });

    // ---------- Keyboard ----------
    shell.addEventListener("keydown", function (e) {
      var btn = e.target.closest && e.target.closest(".app");
      if (!btn) return;
      var tile = btn.closest(".tile"), c = tile.parentNode, kids = Array.prototype.slice.call(c.children), i = kids.indexOf(tile);
      var cols = c === dock ? kids.length : 4, k = e.key;
      if (!jiggle && (k === "ContextMenu" || (k === "F10" && e.shiftKey) || k === "m" || k === "M")) { e.preventDefault(); openMenu(tile, true); return; }
      if (jiggle && (k === "Delete" || k === "Backspace")) { e.preventDefault(); removeTile(tile); return; }
      var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[k];
      if (step === undefined) return;
      e.preventDefault();
      if (jiggle && e.shiftKey) {
        var to = Math.max(0, Math.min(kids.length - 1, i + step));
        if (to !== i) { moveTile(tile, to); btn.focus({ preventScroll: true }); }
        return;
      }
      var j = i + step;
      if (c === grid && k === "ArrowDown" && j >= kids.length) { var d = dock.children; if (d.length) d[Math.min(i % 4, d.length - 1)].querySelector(".app").focus(); return; }
      if (c === dock && k === "ArrowUp") { var g = grid.children, lastRow = Math.floor((g.length - 1) / 4) * 4; if (g.length) g[Math.min(lastRow + Math.min(i, 3), g.length - 1)].querySelector(".app").focus(); return; }
      if (j >= 0 && j < kids.length) kids[j].querySelector(".app").focus();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      if (splashOn) closeApp();
      else if (menuTile) closeMenu();
      else if (jiggle) exitJiggle();
      else return;
      e.preventDefault();
    });
    window.addEventListener("resize", function () { if (menuTile) closeMenu(); });

    // ---------- Auto-demo: a ghost finger plays the gestures until you touch anything ----------
    var demo = { on: !reduce.matches, timers: [], n: 0 };
    function wait(ms) { return new Promise(function (res) { demo.timers.push(setTimeout(res, ms)); }); }
    function ghostAt(x, y, ms) {
      var sr = screen.getBoundingClientRect();
      ghost.style.setProperty("--gd", (ms || 0) + "ms");
      ghost.style.setProperty("--x", x - sr.left + "px");
      ghost.style.setProperty("--y", y - sr.top + "px");
    }
    function glide(a, b, ms, fn) {
      return new Promise(function (res) {
        var t0 = performance.now();
        (function step() {
          if (!demo.on) return;
          var k = Math.min(1, (performance.now() - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          var x = a[0] + (b[0] - a[0]) * e, y = a[1] + (b[1] - a[1]) * e;
          ghostAt(x, y, 0);
          if (fn) fn(x, y);
          if (k < 1) requestAnimationFrame(step); else res();
        })();
      });
    }
    function tileOf(key) { return screen.querySelector('.tile[data-app="' + key + '"]:not(.gone)'); }
    function itemNamed(text) {
      return Array.prototype.filter.call(menu.querySelectorAll(".mitem"), function (it) { return it.textContent === text; })[0] || null;
    }
    async function holdOpen(key) {
      var t = tileOf(key);
      if (!t) return null;
      var c = centerOf(t.querySelector(".icon"));
      ghostAt(c[0] + 30, c[1] + 70, 0);
      ghost.classList.add("show");
      await wait(40);
      ghostAt(c[0], c[1], 260);
      await wait(280);
      if (!demo.on) return null;
      ghost.classList.add("down");
      pressStart(t, c[0], c[1], "demo");
      await wait(HOLD + 420);
      return demo.on && menuTile === t ? { t: t, c: c } : null;
    }
    async function tapItem(it) {
      if (!it || !demo.on) return false;
      var c = centerOf(it);
      ghostAt(c[0], c[1], 420);
      await wait(460);
      if (!demo.on) return false;
      ghost.classList.add("down");
      await wait(130);
      ghost.classList.remove("down");
      if (!demo.on) return false;
      pick(it);
      return true;
    }
    function ghostOff() { ghost.classList.remove("show", "down"); }
    var scenes = [
      async function () { // hold Notes, slide onto "New checklist" and let go
        var h = await holdOpen("notes");
        if (!h) return;
        var it = itemNamed("New checklist");
        if (!it) return;
        await glide(h.c, centerOf(it), 560, pressMove);
        await wait(280);
        if (!demo.on) return;
        pressEnd(press ? press.x : 0, press ? press.y : 0, false);
        ghost.classList.remove("down");
        await wait(600);
        ghostOff();
      },
      async function () { // hold Wallet, let go, tap "Send money"
        var h = await holdOpen("wallet");
        if (!h) return;
        pressEnd(h.c[0], h.c[1], false);
        ghost.classList.remove("down");
        await wait(240);
        if (await tapItem(itemNamed("Send money"))) { await wait(500); ghostOff(); }
      },
      async function () { // hold Camera, Edit home screen, drag the first app two places, Done
        var h = await holdOpen("camera");
        if (!h) return;
        pressEnd(h.c[0], h.c[1], false);
        ghost.classList.remove("down");
        await wait(240);
        if (!(await tapItem(itemNamed("Edit home screen")))) return;
        await wait(900);
        if (!demo.on || !jiggle || grid.children.length < 3) return;
        var t = grid.children[0], a = centerOf(t.querySelector(".icon")), b = centerOf(grid.children[2].querySelector(".icon"));
        ghostAt(a[0], a[1], 450);
        await wait(480);
        if (!demo.on) return;
        ghost.classList.add("down");
        pressStart(t, a[0], a[1], "demo");
        await glide(a, b, 950, pressMove);
        await wait(220);
        if (!demo.on) return;
        pressEnd(b[0], b[1], false);
        ghost.classList.remove("down");
        await wait(800);
        var dn = centerOf(doneBtn);
        ghostAt(dn[0], dn[1], 450);
        await wait(480);
        if (!demo.on) return;
        ghost.classList.add("down");
        await wait(130);
        ghost.classList.remove("down");
        exitJiggle();
        await wait(400);
        ghostOff();
      },
      async function () { // short tap Weather: the app zooms open, then back home
        var t = tileOf("weather");
        if (!t) return;
        var c = centerOf(t.querySelector(".icon"));
        ghostAt(c[0] - 40, c[1] + 60, 0);
        ghost.classList.add("show");
        await wait(40);
        ghostAt(c[0], c[1], 320);
        await wait(340);
        if (!demo.on) return;
        ghost.classList.add("down");
        pressStart(t, c[0], c[1], "demo");
        await wait(110);
        if (!demo.on) return;
        pressEnd(c[0], c[1], false);
        ghost.classList.remove("down");
        await wait(350);
        ghostOff();
        await wait(2500);
      }
    ];
    async function runDemo() {
      await wait(300);
      while (demo.on) {
        await scenes[demo.n++ % scenes.length]();
        if (!demo.on) return;
        await wait(2100);
      }
    }
    function stopDemo() {
      if (!demo.on) return;
      demo.on = false;
      demo.timers.forEach(clearTimeout);
      demo.timers = [];
      if (press && press.id === "demo") pressEnd(press.x, press.y, true);
      ghostOff();
    }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) {
      window.addEventListener(ev, function (e) { if (e.isTrusted) { userActed = true; stopDemo(); } }, { capture: true, passive: true });
    });
    if (demo.on) runDemo();
  })();
</script>
</body>
</html>
