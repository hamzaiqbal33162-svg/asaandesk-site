<script>/* set the theme before first paint: ?theme= wins, then saved, then system */(function(){var d=document.documentElement,t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(d.dataset.key+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d.dataset.def||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t})();</script>
<style>
/* ---------- theme tokens: black and neon at night, a clean light version by day ---------- */
:root{--font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.9,.2,1);
--bg:#f5f5fb;--surface:#ffffff;--surface-2:#efeff7;--text:#15151f;--muted:#62627a;--line:#e2e2ee;--hover:rgba(109,60,245,.07);--accent:#6d3cf5;--on-accent:#fff;--ring:rgba(109,60,245,.22);--neon:#0891b2;
--c1:#6d3cf5;--c2:#0891b2;--c3:#db2777;--c4:#65a30d;--c5:#d97706;--c6:#2563eb;--ok:#15803d;--ok-bg:rgba(101,163,13,.14);--bad:#dc2626;--bad-bg:rgba(220,38,38,.1);--warn:#b45309;--warn-bg:rgba(217,119,6,.14);--info-bg:rgba(109,60,245,.1);
--glow:0 0 0 1px rgba(109,60,245,.25),0 10px 30px -14px rgba(109,60,245,.45);--grid:rgba(21,21,31,.07);--rail:#ffffff;--r:16px;--r-btn:10px;--r-in:10px;--r-seg:10px}
[data-theme="dark"]{--bg:#09090f;--surface:#11111a;--surface-2:#191925;--text:#ececf5;--muted:#8d8da6;--line:#252535;--hover:rgba(138,92,255,.1);--accent:#8a5cff;--on-accent:#fff;--ring:rgba(138,92,255,.3);--neon:#22d3ee;
--c1:#8a5cff;--c2:#22d3ee;--c3:#ff4fa3;--c4:#a3e635;--c5:#fbbf24;--c6:#60a5fa;--ok:#a3e635;--ok-bg:rgba(163,230,53,.12);--bad:#ff5c7a;--bad-bg:rgba(255,92,122,.12);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.12);--info-bg:rgba(138,92,255,.16);
--glow:0 0 0 1px rgba(138,92,255,.45),0 0 28px -6px rgba(138,92,255,.55);--grid:rgba(236,236,245,.06);--rail:#0d0d15;--toast-bg:#1c1c2a}
/* ---------- Core UI kit (shared parts, coloured by the theme tokens above) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--field,var(--surface-2));border:1px solid var(--line);border-radius:var(--r-in,10px);padding:.58em .75em;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio],input[type=range],input[type=color]{width:auto;padding:0;box-shadow:none}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:var(--iw,1.8);stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.num,.tnum{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--surface);padding:.55em .95em;border-radius:var(--r-btn,10px);font-weight:600;font-size:.88rem;line-height:1.2;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:.36em .65em;font-size:.78rem}
.btn:disabled{opacity:.5;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-btn,10px);position:relative;color:inherit;transition:background-color .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--hover)}
.ibtn:active{transform:scale(.9)}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);animation:dotPop .4s var(--ease)}
.ibtn .dot[hidden]{display:none}
@keyframes dotPop{from{transform:scale(0)}}
/* segmented control with a sliding pill */
.seg{position:relative;display:inline-flex;padding:3px;background:var(--surface-2);border-radius:var(--r-seg,10px);border:1px solid var(--line);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;padding:.36em .8em;font-size:.8rem;font-weight:600;color:var(--muted);border-radius:calc(var(--r-seg,10px) - 3px);transition:color .2s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--seg-on,var(--text))}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-seg,10px) - 3px);background:var(--seg-pill,var(--surface));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .38s var(--ease),width .38s var(--ease)}
/* badges, deltas, avatars */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg,var(--ring));color:var(--accent)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:.78rem;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.delta .i{width:.95em;height:.95em}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;font-weight:700;flex:none;background:hsl(var(--h) 62% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 75% 86%)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:.76rem}
/* switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background-color .25s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-weight:650;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2,var(--line));white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background-color .15s;cursor:pointer;animation:rowIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num .th-sort{flex-direction:row-reverse}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.th-sort{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.th-sort .i{opacity:.3;transition:transform .25s var(--ease),opacity .2s}
th[aria-sort] .th-sort .i{opacity:1}
th[aria-sort="ascending"] .th-sort .i{transform:rotate(180deg)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 180px;max-width:300px;display:block}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:.34em .8em;border-radius:99px;border:1px solid var(--line);font-size:.78rem;font-weight:650;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--chip-on,var(--accent));border-color:transparent;color:var(--on-accent,#fff)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);font-weight:650;color:var(--text);transition:background-color .2s,transform .15s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent}
.pager button:disabled{opacity:.35;cursor:default}
.empty{display:grid;place-items:center;gap:6px;padding:26px 12px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.55}
/* overlays: modal, drawer */
.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(8,10,20,.48));opacity:0;transition:opacity .24s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ovl.open{opacity:1}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--r-modal,16px);box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line);transform:translateY(18px) scale(.96);transition:transform .34s var(--ease)}
.modal.wide{width:min(780px,100%)}
.ovl.open .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
.m-head h2{font-size:1.06rem}
.m-body{padding:10px 18px 18px;display:grid;gap:12px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.m-text{color:var(--muted)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:650;color:var(--muted)}
.err{color:var(--bad);font-size:.75rem}
.err:empty{display:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100vw);height:100%;background:var(--surface-solid,var(--surface));border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.25);transform:translateX(104%);transition:transform .38s var(--ease);display:flex;flex-direction:column;color:var(--text)}
.ovl.open .drawer{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.06rem}
.d-body{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.d-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
/* popovers and menus */
.pop{position:fixed;z-index:90;min-width:200px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:6px;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:.86rem}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.on{font-weight:700;color:var(--accent)}
.mi.danger{color:var(--bad)}
.pop-t{padding:6px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.notes{max-height:330px;overflow:auto;display:grid;gap:2px}
.note{display:flex;gap:10px;padding:9px 8px;border-radius:8px;font-size:.84rem;align-items:flex-start}
.note .i{margin-top:2px;color:var(--accent)}
.note.new{background:var(--hover)}
.note small{color:var(--muted)}
/* command search */
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);background:var(--surface-solid,var(--surface));border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease);color:var(--text)}
.ovl.open .cmdk{transform:none}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:transparent;box-shadow:none;padding:6px 0;font-size:1rem}
kbd{font:600 .7rem/1 var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.cmdk-list{max-height:min(360px,55vh);overflow:auto;padding:6px}
.cmdk-it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.cmdk-it small{margin-left:auto;color:var(--muted)}
.cmdk-it[aria-selected="true"]{background:var(--hover);color:var(--accent)}
/* toasts */
.toasts{position:fixed;z-index:100;right:16px;bottom:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);box-shadow:0 12px 30px rgba(0,0,0,.28);font-size:.86rem;animation:toastIn .4s var(--ease);transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px) scale(.97)}
.toast.ok .i{color:#7be3a6}.toast.err .i{color:#ff8f8f}.toast.info .i{color:#9cc4ff}
.t-act{font-weight:700;color:#9cc4ff;margin-left:4px;padding:2px 4px;border-radius:6px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* chart tooltip */
.tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;background:var(--tip-bg,rgba(14,17,27,.95));color:var(--tip-fg,#fff);padding:8px 11px;border-radius:10px;font-size:.78rem;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:opacity .12s;min-width:120px;max-width:260px}
.tip.on{opacity:1}
.tip .tr{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;opacity:.82}
.tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.ch{display:block;overflow:visible;max-width:100%;outline:none}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ch text{font-size:11px;fill:var(--axis,var(--muted));font-family:var(--font)}
.ch .grid{stroke:var(--grid,var(--line));stroke-width:1;stroke-dasharray:var(--grid-dash,3 4)}
.ch .zero{stroke:var(--axis,var(--muted));stroke-width:1;opacity:.5}
.ch-line{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ch-line.dash{stroke-dasharray:5 5;stroke-width:1.8;opacity:.85}
.ch.enter .ch-line:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.3s var(--ease) .1s forwards}
.ch.enter .ch-area,.ch.enter .ch-line.dash,.ch.enter .tgt{animation:chFade 1s ease .3s both}
.tgt{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:6 4}
.guide{stroke:var(--axis,var(--muted));stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.hdot{fill:var(--surface-solid,var(--surface));stroke-width:2.5;opacity:0;transition:opacity .15s}
.ch.hover .guide,.ch.hover .hdot{opacity:1}
.ch-bar{transition:opacity .2s}
.ch.enter .ch-bar{transform-box:fill-box;transform-origin:50% 100%;animation:chGrow .8s var(--ease) both;animation-delay:calc(var(--i) * 26ms)}
.ch.enter .ch-bar.neg{transform-origin:50% 0}
.ch.colhover .col:not(.on) .ch-bar{opacity:.38}
.ch-seg{fill:none;transition:stroke-width .25s var(--ease),opacity .2s;cursor:pointer}
.ch-seg.dim{opacity:.35}
.ch.enter .ch-seg{animation:chSweep 1.1s var(--ease) both;animation-delay:calc(var(--i) * 110ms)}
.ch-cell{transform-box:fill-box;transform-origin:center;transition:opacity .15s}
.ch.enter .ch-cell,.ch.enter .ch-cellt{animation:chPop .55s var(--ease) both;animation-delay:calc(var(--i) * 12ms)}
.ch .ch-cellt{font-size:10px;font-weight:600;pointer-events:none}
.ch .ch-cellt.hi{fill:#fff}
.ch.enter .ch-fun{transform-box:fill-box;transform-origin:50% 50%;animation:chGrowX .8s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.ch.enter .ch-gauge{animation:chSweep 1.4s var(--ease) both}
.spark{display:block;overflow:visible}
.sp-l{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.2s var(--ease) .25s forwards}
@keyframes chDraw{to{stroke-dashoffset:0}}
@keyframes chFade{from{opacity:0}}
@keyframes chGrow{from{transform:scaleY(0)}}
@keyframes chGrowX{from{transform:scaleX(0)}}
@keyframes chSweep{from{stroke-dasharray:0 100}}
@keyframes chPop{from{opacity:0;transform:scale(.4)}}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;font-size:.76rem}
.lg button{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:650;padding:2px 0;transition:opacity .2s}
.lg button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn .ch{flex:none}
.dn-l{display:grid;gap:6px;flex:1;min-width:150px;font-size:.82rem}
.dn-l button{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;text-align:left;padding:3px 4px;border-radius:6px}
.dn-l button:hover,.dn-l button:focus-visible{background:var(--hover)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l small{color:var(--muted);min-width:38px;text-align:right}
.dn-v{font-size:20px!important;font-weight:750;fill:var(--text)!important}
.dn-s{font-size:10.5px!important}
.hbars{display:grid;gap:4px}
.hb{display:grid;grid-template-columns:minmax(64px,34%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;padding:4px 0}
.hb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-f{height:100%;width:var(--w);border-radius:inherit;background:var(--hb,var(--accent));transform-origin:left;transition:width .7s var(--ease)}
.hbars.enter .hb-f{animation:chGrowX .9s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.hb b{font-variant-numeric:tabular-nums;font-weight:650}
/* drag and drop */
.ghost{opacity:.92;box-shadow:0 18px 40px rgba(0,0,0,.28)!important;cursor:grabbing}
.dragging{opacity:.35}
.drop-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--hover)}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* page entrance (each item sets its own @keyframes rise) */
.view.enter .rise{animation:rise .62s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.theme-anim,.theme-anim *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- shell: a narrow icon rail ---------- */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.side{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 8px;z-index:60;overflow-y:auto}
.logo{width:44px;height:44px;display:block}
.logo .arm{transform-origin:22px 22px;transition:transform .8s var(--ease)}
.side:hover .logo .arm{transform:rotate(45deg)}
#nav{position:relative;display:grid;gap:4px;width:100%}
.nl{position:relative;z-index:1;display:grid;justify-items:center;gap:3px;padding:9px 2px;border-radius:12px;color:var(--muted);font-size:.62rem;font-weight:700;letter-spacing:.02em;text-align:center;transition:color .2s}
.nl .i{width:21px;height:21px}
.nl:hover{color:var(--text)}
.nl[aria-current="page"]{color:var(--text)}
.nl[aria-current="page"] .i{color:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
.nl .nc{position:absolute;top:4px;right:12px;font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--c3);color:#fff;font-size:.6rem;display:grid;place-items:center;padding:0 3px}
.nav-marker{position:absolute;left:6px;right:6px;top:0;height:56px;border-radius:12px;background:var(--hover);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .5s var(--ease),height .5s var(--ease),opacity .3s}
.nav-marker::before{content:"";position:absolute;left:-14px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.side .ibtn{margin-top:auto}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wsbtn{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700}
.wsbtn .bl{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.72rem;font-weight:900;color:#0b0b10;background:var(--bc)}
.wsbtn small{display:block;font-size:.68rem;color:var(--muted);font-weight:600}
.menu-btn{display:none}
.view{padding:20px 24px 50px;display:grid;gap:16px;outline:none;align-content:start}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:clamp(1.45rem,2.6vw,1.95rem);font-weight:800;letter-spacing:-.035em}
.ph p{color:var(--muted);font-size:.86rem;margin-top:3px}
.ph-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--neon)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;transition:box-shadow .35s var(--ease),border-color .35s,transform .35s var(--ease)}
.card:hover{box-shadow:var(--glow);border-color:transparent}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:.95rem;font-weight:750;letter-spacing:-.01em}
.card-h small{color:var(--muted);font-size:.76rem}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--neon)));box-shadow:0 6px 20px -8px var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi small{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:1.75rem;font-weight:800;letter-spacing:-.04em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .kf{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi::after{content:"";display:block;height:2px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,var(--kc),transparent)}
.g-o{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* network tags: our letters and colours, no logos */
.nt{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 4px;border-radius:6px;font-size:.62rem;font-weight:900;color:#0b0b10;background:var(--nc)}
.nts{display:inline-flex;gap:3px;flex-wrap:wrap}
/* signature: the eight-network orbit with a broadcast burst */
.orbit{width:100%;max-width:420px;margin:0 auto;display:block;overflow:visible}
.orbit .spoke{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 5;transition:stroke .3s}
.orbit .spoke.on{stroke:var(--nc);stroke-dasharray:none;opacity:.7}
.orbit .ring{fill:none;stroke:var(--line);stroke-dasharray:2 6}
.orbit .node circle.bg{fill:var(--surface);stroke:var(--nc);stroke-width:2;transition:transform .4s var(--ease)}
.orbit .node.off circle.bg{stroke:var(--line)}
.orbit .node.off text{opacity:.4}
.orbit .node text{font-size:11px;font-weight:900;fill:var(--text);pointer-events:none}
.orbit .node small{font-size:9px}
.orbit .node{cursor:pointer;transform-box:fill-box;transform-origin:center}
.orbit .node:hover circle.bg,.orbit .node.hit circle.bg{transform:scale(1.15);transform-box:fill-box;transform-origin:center}
.orbit .node.hit circle.bg{fill:var(--nc)}
.orbit .hub{fill:url(#hubg)}
.orbit .hubt{font-size:15px;font-weight:900;fill:#fff}
.orbit .spark-p{fill:var(--nc);filter:drop-shadow(0 0 4px var(--nc))}
.orbit.enter .node{animation:pop .6s var(--ease) both;animation-delay:calc(var(--i) * 70ms + .2s)}
.orbit.enter .spoke{animation:chFade .8s ease both;animation-delay:calc(var(--i) * 70ms)}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
.plus{font-size:12px;font-weight:900;fill:var(--nc);animation:plus 1.1s var(--ease) forwards}
@keyframes plus{to{transform:translateY(-22px);opacity:0}}
.queue{display:grid;gap:8px}
.qi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:12px;text-align:left;width:100%;transition:background-color .2s}
.qi:hover{background:var(--hover)}
.qi .tm{text-align:center;font-weight:800;line-height:1.1;font-size:.95rem}
.qi .tm small{display:block;font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qi p{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.poster{display:block;width:100%;height:100%}
.thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none;position:relative}
.feed{display:grid;gap:10px;font-size:.84rem}
.feed div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.feed small{color:var(--muted);display:block;font-size:.72rem}
/* composer */
.comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.netpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.netpick label{position:relative;display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;transition:border-color .2s,box-shadow .2s,background-color .2s}
.netpick label:has(input:checked){border-color:var(--nc);box-shadow:0 0 0 1px var(--nc),0 0 16px -6px var(--nc);background:color-mix(in srgb,var(--nc) 8%,var(--surface))}
.netpick input{position:absolute;opacity:0;width:1px;height:1px}
.netpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.ctabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ctabs button{padding:7px 10px;font-size:.78rem;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ctabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.ctabs button .dotc{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon);margin-left:4px;vertical-align:middle}
.lims{display:flex;gap:6px;flex-wrap:wrap}
.lims span{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.lims span.over{background:var(--bad-bg);color:var(--bad)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.lib button{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid transparent;transition:transform .2s var(--ease),border-color .2s}
.lib button[aria-pressed="true"]{border-color:var(--neon);transform:scale(.94)}
.vb{position:absolute;left:4px;bottom:4px;font-size:.55rem;font-weight:900;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:4px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.pv{scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:.78rem;display:flex;flex-direction:column;transition:opacity .3s,transform .4s var(--ease)}
.pv.off{opacity:.3;transform:scale(.96)}
.pv-top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:800}
.pv-top em{font-style:normal;font-size:.68rem;color:var(--muted)}
.pv-h{display:flex;gap:8px;align-items:center;padding:8px 10px}
.pv-h .av{width:26px;height:26px;font-size:.6rem}
.pv-h small{display:block;color:var(--muted);font-size:.66rem}
.pv-m{position:relative;overflow:hidden;background:#000}
.pv-t{padding:8px 10px;line-height:1.4;overflow-wrap:anywhere}
.pv-t span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pv .bad-m{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;background:rgba(9,9,15,.78);color:#fff;font-weight:800;font-size:.76rem}
.pv .bubble{margin:10px;padding:10px;border-radius:12px 12px 12px 3px;background:var(--surface);line-height:1.4}
.pv .ovt{position:absolute;left:8px;right:8px;bottom:8px;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;line-height:1.3}
.pv .ovt span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* week calendar */
.wk{overflow-x:auto}
.wkg{display:grid;grid-template-columns:58px repeat(7,minmax(92px,1fr));min-width:760px}
.wkh{position:sticky;top:0;padding:8px 6px;font-size:.74rem;font-weight:800;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.wkh.today{color:var(--neon)}
.wkh small{display:block;font-size:1.05rem;color:var(--text)}
.wkh.today small{color:var(--neon)}
.hr{font-size:.68rem;color:var(--muted);font-weight:700;padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)}
.slot{min-height:46px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:grid;gap:3px;align-content:start;transition:background-color .2s}
.slot.past{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--grid) 7px 8px)}
.slot.now{box-shadow:inset 0 2px 0 var(--neon)}
.slot.drop-over{background:var(--hover);outline:1px dashed var(--accent);outline-offset:-2px}
.blk{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:7px;font-size:.68rem;font-weight:700;background:color-mix(in srgb,var(--nc) 22%,var(--surface));border-left:3px solid var(--nc);cursor:grab;touch-action:none;user-select:none;min-width:0;transition:transform .2s var(--ease),box-shadow .2s}
.blk:hover{transform:translateY(-1px);box-shadow:0 0 14px -4px var(--nc)}
.blk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.pub{cursor:default;opacity:.6}
.blk:focus-visible{outline:2px solid var(--accent)}
.unsched{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.unsched.drop-over{background:var(--hover)}
/* approvals board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.colm{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:340px}
.colm-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.84rem;padding:2px 4px}
.colm-h span{display:flex;align-items:center;gap:8px}
.colm-h span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}
.colm.drop-over{outline:1px dashed var(--accent);background:var(--hover)}
.ap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .25s,transform .25s var(--ease);animation:chFade .4s ease both}
.ap:hover{box-shadow:var(--glow);transform:translateY(-2px)}
.ap:focus-visible{outline:2px solid var(--accent)}
.ap p{font-size:.82rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ap .row{justify-content:space-between;font-size:.72rem;color:var(--muted)}
.ap .ibtn{width:26px;height:26px}
.cmts{display:grid;gap:8px}
.cmt{padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:.84rem}
.cmt small{display:block;color:var(--muted);font-size:.7rem}
/* library, team, settings */
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mcard{display:grid;gap:6px;text-align:left}
.mcard .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:14px;transition:transform .35s var(--ease),box-shadow .35s}
.mcard:hover .thumb{transform:scale(1.03);box-shadow:var(--glow)}
.mcard small{color:var(--muted);font-size:.72rem}
.hsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hset p{font-size:.84rem;color:var(--neon);line-height:1.6;margin:6px 0 10px;overflow-wrap:anywhere}
.perm{width:100%;border-collapse:collapse;font-size:.84rem}
.perm th,.perm td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.perm th:first-child,.perm td:first-child{text-align:left}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted);font-size:.78rem}
.form-grid{display:grid;gap:12px}
.hours{display:flex;gap:6px;flex-wrap:wrap}
.hours label{font-size:.76rem;font-weight:700;padding:4px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hours label:has(input:checked){border-color:var(--accent);background:var(--hover);color:var(--accent)}
.hours input{position:absolute;opacity:0;width:1px;height:1px}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(5px) brightness(1.8)}}
/* ---------- responsive ---------- */
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-o,.comp{grid-template-columns:minmax(0,1fr)}.netpick{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:96px;transform:translateX(-110%);transition:transform .35s var(--ease)}body.nav-open .side{transform:none}.scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top{padding:10px 12px}.view{padding:14px 12px 40px}.g-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.netpick{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:1.4rem}.wsbtn small{display:none}.top .btn span{display:none}}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <svg class="logo" viewBox="0 0 44 44" role="img" aria-label="Octopost"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><g class="arm"><g stroke="url(#lg1)" stroke-width="3" stroke-linecap="round"><path d="M22 4v8M22 32v8M4 22h8M32 22h8M9.3 9.3l5.7 5.7M29 29l5.7 5.7M9.3 34.7L15 29M29 15l5.7-5.7"/></g></g><circle cx="22" cy="22" r="7" fill="url(#lg1)"/></svg>
    <nav id="nav" data-marker="y"><span class="nav-marker" aria-hidden="true"></span></nav>
    <button type="button" class="ibtn" data-act="theme" aria-label="Toggle theme"></button>
  </aside>
  <div class="scrim" data-act="menu" aria-hidden="true"></div>
  <div class="main">
    <header class="top">
      <button type="button" class="ibtn menu-btn" data-act="menu" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <button type="button" class="wsbtn" data-act="pickWs" id="wsbtn" aria-haspopup="menu"></button>

      <button type="button" class="btn primary" data-act="compose"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New post</span></button>

    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
/* =====================================================================
   Core kit: helpers, router, charts and UI pieces used by this app.
   Plain JS, no libraries. The app code further down builds on it.
   ===================================================================== */
'use strict';

/* ---------- small DOM and math helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const avg = a => (a.length ? sum(a) / a.length : 0);
const lerp = (a, b, t) => a + (b - a) * t;
const f1 = v => Math.round(v * 10) / 10;
let _uid = 0;
const uid = (p = 'u') => p + (++_uid).toString(36) + Math.random().toString(36).slice(2, 5);
const clone = o => JSON.parse(JSON.stringify(o));
const motionQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
let RM = !!motionQ.matches; // reduced motion: skip big movement
if (motionQ.addEventListener) motionQ.addEventListener('change', e => { RM = e.matches; });

/* ---------- seeded random numbers, so demo data is the same every visit ---------- */
let _seed = 1;

function drawBoard() {
  const b = $('#board'); if (!b) return;
  b.innerHTML = COLS.map(c => { const list = posts().filter(p => p.status === c.id); return `<div class="colm" data-col="${c.id}" style="--sc:${c.c}"><div class="colm-h"><span>${c.id}</span><small class="muted">${list.length}</small></div>${list.length ? list.map(p => `<div class="ap" role="button" tabindex="0" data-id="${p.id}"><div class="row" style="gap:8px;justify-content:flex-start">${thumb(p.media, brand().hue)}<p>${esc(p.text)}</p></div><div class="row">${nts(p.nets.slice(0, 5))}${p.nets.length > 5 ? `<small>+${p.nets.length - 5}</small>` : ''}</div><div class="row"><span>${esc(p.author)} · ${p.date ? whenP(p) : 'no date'}</span><span class="row" style="gap:4px">${p.comments.length ? `${ic('msg')}${p.comments.length}` : ''}<button type="button" class="ibtn" data-act="apMove" data-id="${p.id}" aria-label="Move post">${ic('more')}</button></span></div></div>`).join('') : `<div class="empty">${ic('inbox')}<p>Nothing here</p></div>`}</div>`; }).join('');
  if (!b._dnd) { b._dnd = 1; let dragged = 0; dnd(b, '.ap', '.colm', (item, col) => setStatus(postBy(item.dataset.id), col.dataset.col), { onEnd: () => { dragged = Date.now(); } }); b.addEventListener('click', e => { const c = e.target.closest('.ap'); if (c && !e.target.closest('button') && Date.now() - dragged > 250) postDrawer(postBy(c.dataset.id)); }); b.addEventListener('keydown', e => { const c = e.target.closest('.ap'); if (c && e.target === c && e.key === 'Enter') postDrawer(postBy(c.dataset.id)); }); }
}
function setStatus(p, st) {
  if (!p || p.status === st) return;
  if (st === 'Scheduled' && (!p.date || p.date < isoD(TODAY))) { modal({ title: 'Pick a time', ok: 'Schedule', body: `<div class="grid2">${field('Date', 'date', { type: 'date', value: isoD(addDays(TODAY, 1)) })}${field('Slot', 'hour', { type: 'select', value: p.hour, opts: HOURS.map(h => [h, hh(h)]) })}</div>`, onOk: f => { if (!validate(f, { date: v => V.date(v) || (v < isoD(TODAY) ? 'Pick today or later' : '') })) return false; p.date = f.elements.date.value; p.hour = +f.elements.hour.value; p.status = 'Scheduled'; save(); drawBoard(); navCounts(); toast(`Scheduled for ${whenP(p)}`); } }); return; }
  p.status = st; if (st === 'Approved') p.comments.push({ who: 'Hira K.', text: 'Approved', mins: 0 });
  save(); drawBoard(); navCounts(); toast(`Moved to ${st}`);
}
ACT.apMove = b => { const p = postBy(b.dataset.id); if (p) popMenu(b, COLS.filter(c => c.id !== p.status).map(c => ({ label: 'Move to ' + c.id, icon: 'chev', fn: () => setStatus(p, c.id) })).concat([{ label: 'Delete', icon: 'trash', danger: true, fn: () => delP(p) }]), { title: 'Move post' }); };
function postDrawer(p) {
  if (!p) return;
  const has = Object.keys(p.stats).length;
  drawer({ title: p.status === 'Published' ? 'Published post' : 'Post', kicker: `${p.status} · ${whenP(p)} · by ${p.author}`,
    body: `<div class="row" style="align-items:flex-start;gap:12px">${thumb(p.media, brand().hue)}<p>${esc(p.text)}</p></div><div>${nts(p.nets)}</div>${Object.keys(p.custom || {}).length ? `<p class="muted" style="font-size:.8rem">Custom text for ${Object.keys(p.custom).map(k => netBy(k).name).join(', ')}</p>` : ''}${has ? '<div><b>Reach by network</b><div id="pd"></div></div>' : ''}<div><b>Comments</b><div class="cmts" style="margin-top:8px">${p.comments.length ? p.comments.map(c => `<div class="cmt">${esc(c.text)}<small>${esc(c.who)} · ${ago(c.mins)}</small></div>`).join('') : '<p class="muted" style="font-size:.84rem">No comments yet</p>'}</div></div><form id="cmt" class="form-grid" novalidate>${field('Add a comment', 'c', { type: 'textarea', rows: 2, ph: 'Feedback for the team…' })}<button type="submit" class="btn sm">${ic('msg')}Comment</button></form>`,
    foot: `<button type="button" class="btn danger" data-act="pDel" data-id="${p.id}">${ic('trash')}Delete</button><div class="grow"></div>${p.status === 'In review' ? `<button type="button" class="btn" data-act="pChanges" data-id="${p.id}">Request changes</button><button type="button" class="btn primary" data-act="pApprove" data-id="${p.id}">${ic('check')}Approve</button>` : p.status !== 'Published' ? `<a class="btn primary" href="#/compose/${p.id}">${ic('edit')}Edit</a>` : ''}`,
    mount: w => { const el = $('#pd', w); if (el) plot(el, 'bar', { labels: Object.keys(p.stats).map(k => netBy(k).s), series: [{ name: 'Reach', data: Object.values(p.stats).map(s => s.reach) }], colorAt: i => netBy(Object.keys(p.stats)[i]).c, fmt: 'short', h: 150 }); $('#cmt', w).addEventListener('submit', e => { e.preventDefault(); if (!validate(e.target, { c: V.min(2) })) return; p.comments.push({ who: 'Hira K.', text: e.target.elements.c.value.trim(), mins: 0 }); save(); closeLayers(); postDrawer(p); if (APP.cur === 'approvals') drawBoard(); toast('Comment added'); }); } });
}
async function delP(p) { if (!(await confirmBox('Delete this post?', 'It will be removed from the plan.'))) return; const i = DB.posts.indexOf(p); DB.posts.splice(i, 1); save(); closeLayers(); refresh(); navCounts(); toast('Post deleted', 'ok', { label: 'Undo', fn: () => { DB.posts.splice(i, 0, p); save(); refresh(); navCounts(); } }); }
ACT.postOpen = b => postDrawer(postBy(b.dataset.id));
ACT.pDel = b => { const p = postBy(b.dataset.id); if (p) delP(p); };
ACT.pApprove = b => { const p = postBy(b.dataset.id); closeLayers(); setStatus(p, 'Approved'); note('A post was approved', 'check'); };
ACT.pChanges = b => { const p = postBy(b.dataset.id); if (!p) return; p.status = 'Draft'; p.comments.push({ who: 'Hira K.', text: 'Changes requested', mins: 0 }); save(); closeLayers(); refresh(); navCounts(); toast('Sent back to draft with a note'); };

/* ---------- analytics per network ---------- */
SEG.net = v => { UI.net = v; refresh(); };
page('analytics', {
  title: 'Analytics', icon: 'bars', nav: 'Stats',
  html: () => `<div class="ph rise"><div><p class="eyebrow">${esc(brand().name)}</p><h1>Network stats</h1></div><div class="ph-act">${seg('range', [['7', '7D'], ['30', '30D'], ['90', '90D']], UI.range, 'Range')}</div></div>
  <div class="rise">${seg('net', [['all', 'All'], ...NETS.map(n => [n.id, n.s])], UI.net, 'Network')}</div>
  <section class="kpis">${[['a-f', 'Followers'], ['a-g', 'New followers'], ['a-r', 'Reach'], ['a-e', 'Engagement rate']].map(([id, l], i) => `<article class="card kpi rise" style="--kc:var(--c${i + 1})"><small>${l}</small><b id="${id}">0</b><div class="kf" id="${id}-f"></div></article>`).join('')}</section>
  <section class="g-2"><article class="card rise"><div class="card-h"><h2 id="a-ft">Followers</h2></div><div id="a-fol"></div></article><article class="card rise"><div class="card-h"><h2>Engagement rate by network</h2></div><div id="a-er"></div></article></section>
  <article class="card rise"><div class="card-h"><h2>Top posts</h2></div><div id="a-top"></div></article>`,
  fill: () => {
    const n = UI.range, ids = UI.net === 'all' ? NETS.map(x => x.id) : [UI.net], F = DB.fol[DB.ws], from = isoD(addDays(TODAY, -n + 1));
    const series = Array.from({ length: n }, (_, i) => sum(ids.map(id => F[id][90 - n + i])));
    const pub = posts().filter(p => p.status === 'Published' && p.date >= from && ids.some(id => p.stats[id]));
    const R = sum(pub.flatMap(p => ids.map(id => (p.stats[id] ? p.stats[id].reach : 0)))), E = sum(pub.flatMap(p => ids.map(id => (p.stats[id] ? p.stats[id].eng : 0))));
    setNum('#a-f', series[n - 1], 'short'); $('#a-f-f').innerHTML = `<span>${UI.net === 'all' ? 'all eight networks' : netBy(UI.net).name}</span>`;
    setNum('#a-g', series[n - 1] - series[0]); $('#a-g-f').innerHTML = `<span>in ${n} days</span>`;
    setNum('#a-r', R, 'short'); $('#a-r-f').innerHTML = `<span>${pub.length} posts</span>`;
    setNum('#a-e', R ? (E / R) * 100 : 0, 'pct');
    $('#a-ft').textContent = UI.net === 'all' ? 'Followers, all networks' : `Followers on ${netBy(UI.net).name}`;
    plot('#a-fol', 'line', { labels: Array.from({ length: n }, (_, i) => dd(addDays(TODAY, i - n + 1))), series: [{ name: 'Followers', data: series, color: UI.net === 'all' ? 'var(--accent)' : netBy(UI.net).c }], area: true, min0: false, fmt: 'num', h: 230 });
    const all = posts().filter(p => p.status === 'Published' && p.date >= from);
    plot('#a-er', 'bar', { labels: NETS.map(x => x.s), series: [{ name: 'Engagement rate', data: NETS.map(x => { const r = sum(all.map(p => (p.stats[x.id] ? p.stats[x.id].reach : 0))), e = sum(all.map(p => (p.stats[x.id] ? p.stats[x.id].eng : 0))); return r ? (e / r) * 100 : 0; }) }], colorAt: i => (UI.net === 'all' || NETS[i].id === UI.net ? NETS[i].c : 'var(--line)'), fmt: v => pct(v, 1), yfmt: v => pct(v, 0), h: 230, onPick: i => { UI.net = NETS[i].id; route(); } });
    table('#a-top', { search: false, size: 6, sort: 'reach', dir: -1, rows: () => pub.map(p => ({ id: p.id, text: p.text, media: p.media, nets: p.nets, date: p.date, reach: sum(ids.map(id => (p.stats[id] ? p.stats[id].reach : 0))), eng: sum(ids.map(id => (p.stats[id] ? p.stats[id].eng : 0))) })), cols: [{ k: 'text', label: 'Post', f: (v, r) => `<div class="who">${thumb(r.media, brand().hue)}<span style="white-space:normal;max-width:280px"><b>${esc(v)}</b></span></div>` }, { k: 'nets', label: 'Networks', sort: false, f: v => nts(v) }, { k: 'date', label: 'Date', f: v => dd(v) }, { k: 'reach', label: 'Reach', num: true, f: v => short(v) }, { k: 'eng', label: 'Engaged', num: true, f: v => num(v) }], onRow: r => postDrawer(postBy(r.id)), empty: 'No published posts in this range', emptyIcon: 'bars' });
  }
});

/* ---------- media library and hashtag sets ---------- */
page('library', {
  title: 'Library', icon: 'image',
  html: () => `<div class="ph rise"><div><p class="eyebrow">${esc(brand().name)}</p><h1>Library</h1><p>Media and saved hashtag sets for this brand.</p></div><div class="ph-act"><button type="button" class="btn" data-act="newSet">${ic('hash')}New hashtag set</button><button type="button" class="btn primary" data-act="newAsset">${ic('upload')}Add media</button></div></div>
  <div class="chips rise" role="group" aria-label="Filter media">${['All', 'Images', 'Videos'].map(v => `<button type="button" class="chip" data-act="lf" data-v="${v}" aria-pressed="${UI.lf === v}">${v}</button>`).join('')}</div>
  <section class="media" id="media"></section>
  <h2 class="rise" style="font-size:1rem">Hashtag sets</h2><section class="hsets" id="hsets"></section>`,
  fill: () => {
    $('#media').innerHTML = DB.media.map((m, i) => ({ m, i })).filter(({ i }) => UI.lf === 'All' || (UI.lf === 'Videos') === isVid(i)).map(({ m, i }) => `<button type="button" class="mcard" data-act="useMedia" data-v="${i}">${thumb(i, brand().hue)}<b>${esc(m.name)}</b><small>${isVid(i) ? 'Video · 0:' + (20 + i) : 'Image · 1080 × 1080'} · used ${posts().filter(p => p.media === i).length}×</small></button>`).join('');
    const hs = DB.hsets.filter(h => h.ws === DB.ws);
    $('#hsets').innerHTML = hs.length ? hs.map(h => `<article class="card hset"><div class="row" style="justify-content:space-between"><b>${esc(h.name)}</b><button type="button" class="ibtn" data-act="delSet" data-id="${h.id}" aria-label="Delete ${esc(h.name)}">${ic('trash')}</button></div><p>${esc(h.tags)}</p><button type="button" class="btn sm" data-act="copySet" data-id="${h.id}">${ic('copy')}Copy</button></article>`).join('') : `<div class="empty">${ic('hash')}<p>No hashtag sets for this brand yet</p></div>`;
  }
});
ACT.lf = b => { UI.lf = b.dataset.v; $$('[data-act="lf"]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); refresh(); };
ACT.useMedia = b => { UI.d = { text: '', custom: {}, media: +b.dataset.v, nets: isVid(+b.dataset.v) ? ['tt', 'yt', 'ig'] : ['ig', 'fb', 'pi'], date: isoD(addDays(TODAY, 1)), hour: DB.slots[0] || 9 }; location.hash = '#/compose'; toast('Media added to a new post', 'info'); };
ACT.newAsset = () => modal({ title: 'Add media', ok: 'Add', body: field('Name', 'name', { ph: 'e.g. Winter promo' }) + '<p class="m-text">In this demo a new poster is drawn in the brand colour. Every fourth item is a video clip.</p>', onOk: f => { if (!validate(f, { name: V.min(2) })) return false; const d = formData(f), i = DB.media.length; DB.media.push({ id: uid('m'), name: d.name }); save(); refresh(); toast(`${d.name} added as ${isVid(i) ? 'a video' : 'an image'}`); } });
ACT.newSet = () => modal({ title: 'New hashtag set', ok: 'Save set', body: field('Set name', 'name') + field('Hashtags', 'tags', { type: 'textarea', ph: '#one #two #three' }), onOk: f => { if (!validate(f, { name: V.min(2), tags: v => (/#\w/.test(v) ? '' : 'Add at least one #hashtag') })) return false; const d = formData(f); DB.hsets.push({ id: uid('h'), ws: DB.ws, name: d.name, tags: d.tags }); save(); refresh(); toast('Hashtag set saved'); } });
ACT.copySet = b => { const h = DB.hsets.find(x => x.id === b.dataset.id); if (!h) return; try { navigator.clipboard.writeText(h.tags).then(() => toast('Hashtags copied'), () => toast('Copy is blocked here', 'err')); } catch (e) { toast('Copy is blocked here', 'err'); } };
ACT.delSet = async b => { const h = DB.hsets.find(x => x.id === b.dataset.id); if (!h || !(await confirmBox('Delete hashtag set?', `“${h.name}” will be removed.`))) return; DB.hsets = DB.hsets.filter(x => x !== h); save(); refresh(); toast('Set deleted'); };

/* ---------- team and permissions ---------- */
const ACTIONS = ['Write posts', 'Publish', 'Approve', 'See stats', 'Manage team'];
page('team', {
  title: 'Team', icon: 'users',
  html: () => `<div class="ph rise"><div><p class="eyebrow">Agency</p><h1>Team</h1><p>Who can write, approve and publish.</p></div><div class="ph-act"><button type="button" class="btn primary" data-act="invite">${ic('plus')}Invite</button></div></div>
  <section class="g-2"><article class="card rise"><div id="team"></div></article><article class="card rise"><div class="card-h"><h2>Permissions</h2></div><div style="overflow-x:auto"><table class="perm"><thead><tr><th>Role</th>${ACTIONS.map(a => `<th>${a}</th>`).join('')}</tr></thead><tbody>${Object.entries(DB.perms).map(([r, v]) => `<tr><td><b>${r}</b></td>${v.map((x, i) => `<td><input type="checkbox" data-perm="${r}|${i}"${x ? ' checked' : ''}${r === 'Admin' ? ' disabled' : ''} aria-label="${r} can ${ACTIONS[i]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></article></section>`,
  fill: () => {
    table('#team', { search: false, size: 8, rows: () => DB.team.map(t => ({ ...t, posts: DB.posts.filter(p => p.author === t.name).length })), cols: [{ k: 'name', label: 'Name', f: (v, r) => `<div class="who">${avatar(v)}<span><b>${esc(v)}</b><small>${esc(r.email)}</small></span></div>` }, { k: 'role', label: 'Role', f: (v, r) => (v === 'Admin' ? '<span class="badge info">Admin</span>' : `<select data-role="${r.id}" aria-label="Role for ${esc(r.name)}" style="width:auto;padding:.3em .5em">${['Editor', 'Approver', 'Client'].map(x => `<option${x === v ? ' selected' : ''}>${x}</option>`).join('')}</select>`) }, { k: 'posts', label: 'Posts', num: true }], acts: r => (r.role === 'Admin' ? '' : `<button type="button" class="ibtn" data-ra="del" aria-label="Remove ${esc(r.name)}">${ic('trash')}</button>`), onAct: async (a, r) => { if (!(await confirmBox('Remove teammate?', `${r.name} loses access to every brand.`, 'Remove'))) return; DB.team = DB.team.filter(t => t.id !== r.id); save(); refresh(); toast(`${r.name} removed`); } });
    const tm = $('#team'); if (!tm._sel) { tm._sel = 1; tm.addEventListener('change', e => { const s = e.target.closest('[data-role]'); if (!s) return; const t = DB.team.find(x => x.id === s.dataset.role); t.role = s.value; save(); toast(`${t.name} is now ${t.role}`); }); }
    $$('[data-perm]').forEach(c => { if (c._on) return; c._on = 1; c.addEventListener('change', () => { const [r, i] = c.dataset.perm.split('|'); DB.perms[r][+i] = c.checked ? 1 : 0; save(); toast(`${r}: ${ACTIONS[+i]} ${c.checked ? 'allowed' : 'blocked'}`); }); });
  }
});
ACT.invite = () => modal({ title: 'Invite a teammate', ok: 'Send invite', body: field('Name', 'name') + `<div class="grid2">${field('Email', 'email', { type: 'email' })}${field('Role', 'role', { type: 'select', opts: ['Editor', 'Approver', 'Client'] })}</div>`, onOk: f => { if (!validate(f, { name: V.min(2), email: v => V.email(v) || (DB.team.some(t => t.email === v) ? 'Already invited' : '') })) return false; DB.team.push({ id: uid('u'), ...formData(f) }); save(); refresh(); toast('Invite sent'); } });

/* ---------- settings ---------- */
page('settings', {
  title: 'Settings', icon: 'cog', nav: 'Settings',
  html: () => `<div class="ph rise"><div><p class="eyebrow">${esc(brand().name)}</p><h1>Settings</h1></div></div>
  <section class="g-2"><article class="card rise"><div class="card-h"><h2>Brand</h2></div><form id="bf" class="form-grid" novalidate>${field('Brand name', 'name', { value: brand().name })}${field('Handle', 'handle', { value: brand().handle })}${field('Time zone', 'tz', { type: 'select', value: DB.tz, opts: ['Asia/Karachi', 'Asia/Dubai', 'Europe/London'] })}<div class="field"><label>Best posting slots</label><div class="hours">${HOURS.map(h => `<label><input type="checkbox" name="slot" value="${h}"${DB.slots.includes(h) ? ' checked' : ''}>${hh(h)}</label>`).join('')}</div></div><div><button type="submit" class="btn primary">${ic('check')}Save</button></div></form></article>
  <article class="card rise"><div class="card-h"><h2>Connected networks</h2></div>${NETS.map(n => `<div class="set-row"><span class="row">${nt(n.id)}<span><b>${n.name}</b><small>${DB.conn[n.id] ? 'Connected' : 'Off'}</small></span></span><label class="switch"><input type="checkbox" data-conn="${n.id}"${DB.conn[n.id] ? ' checked' : ''} aria-label="Connect ${n.name}"><span></span></label></div>`).join('')}
  <div class="set-row"><span><b>Theme</b><small>Neon night or clean day</small></span><button type="button" class="btn" data-act="theme" data-label="1">Theme</button></div>
  <div class="set-row"><span><b>Demo data</b><small>Restore the sample brands</small></span><button type="button" class="btn danger" data-act="reset">${ic('refresh')}Reset demo data</button></div></article></section>`,
  fill: () => {
    const f = $('#bf'); if (f._on) return; f._on = 1;
    f.addEventListener('submit', e => { e.preventDefault(); if (!validate(f, { name: V.min(2), handle: v => (/^[a-z0-9_.]{2,30}$/i.test(v) ? '' : 'Letters, numbers, dots and _ only') })) return; const d = formData(f); Object.assign(brand(), { name: d.name, handle: d.handle }); DB.tz = d.tz; DB.slots = $$('input[name=slot]:checked', f).map(i => +i.value); save(); wsBtn(); toast('Settings saved'); });
    $$('[data-conn]').forEach(c => c.addEventListener('change', () => { DB.conn[c.dataset.conn] = c.checked; save(); refresh(); toast(`${netBy(c.dataset.conn).name} ${c.checked ? 'connected' : 'disconnected'}`); }));
  }
});

/* ---------- start ---------- */
APP.cmds = [{ label: 'New post', icon: 'plus', fn: () => ACT.compose() }, ...DB.brands.map(b => ({ label: 'Switch to ' + b.name, icon: 'brief', fn: () => setWs(b.id) })), { label: 'Invite a teammate', icon: 'user', fn: () => ACT.invite() }, { label: 'Switch theme', icon: 'moon', fn: () => ACT.theme() }];
$('#nav').insertAdjacentHTML('beforeend', navLinks());
note('Zara approved 3 posts for Pulse Gym', 'check', 25);
note('A post failed on Pinterest: image too small', 'alert', 140);
note('Weekly stats are ready', 'bars', 60 * 20, true);
wsBtn();
startApp();
</script>
</body>
</html>
