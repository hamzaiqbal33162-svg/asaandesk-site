<!doctype html>
<!-- Chill & Craft · Paper Pop · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paper Pop · a pop-up book onboarding carousel</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: craft paper (light) and navy paper by lamp light (dark) ---------- */
  :root {
    --bg: #efe5d2;
    --bg2: #e5d3b3;
    --lamp: rgba(255, 255, 255, 0);
    --device: #fbf5e9;
    --frame: #2d2721;
    --paper: #fbf4e6;
    --paper2: #efe2c9;
    --rim: #fffaf0;
    --ink: #2b2620;
    --ink-soft: #3a332b;
    --muted: #776a5a;
    --teal: #2e8c84;
    --teal-d: #1f625d;
    --mustard: #e2a62e;
    --coral: #e5664e;
    --sage: #a4ba8f;
    --sage-d: #7e9a72;
    --snow: #fffaf0;
    --wood: #c98f55;
    --wood-d: #8d5d33;
    --water: #82c6bf;
    --rock: #d38c6c;
    --rock-d: #a8654a;
    --glow: #ffd46f;
    --cloud: #fffaf2;
    --night-m: #34507a;
    --sky0a: #cbe8e1; --sky0b: #f7f0dc;
    --sky1a: #fbd49d; --sky1b: #fcefdc;
    --sky2a: #d5c3e6; --sky2b: #f8d7bd;
    --sky3a: #1f2f52; --sky3b: #35577a;
    --lshadow: rgba(92, 60, 25, 0.24);
    --shadow: rgba(84, 58, 26, 0.32);
    --focus: #1f625d;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1628;
    --bg2: #17223c;
    --lamp: rgba(255, 186, 92, 0.2);
    --device: #18223a;
    --frame: #05080f;
    --paper: #24304d;
    --paper2: #1c2640;
    --rim: #d9cbb0;
    --ink: #f4ead8;
    --ink-soft: #121827;
    --muted: #a9b1c3;
    --teal: #43a69c;
    --teal-d: #2b6f69;
    --mustard: #e8b24b;
    --coral: #e7765e;
    --sage: #7f9b77;
    --sage-d: #5d7a5a;
    --snow: #ebe5d6;
    --wood: #a87549;
    --wood-d: #6c482a;
    --water: #4f949c;
    --rock: #b06f58;
    --rock-d: #7f4f3d;
    --glow: #ffc95c;
    --cloud: #c9c3d6;
    --night-m: #1d2c4a;
    --sky0a: #2b4660; --sky0b: #4a5466;
    --sky1a: #66434a; --sky1b: #3f3a4c;
    --sky2a: #3a2f58; --sky2b: #5f4356;
    --sky3a: #0a1122; --sky3b: #1b2d4a;
    --lshadow: rgba(0, 0, 0, 0.45);
    --shadow: rgba(0, 0, 0, 0.65);
    --focus: #ffc95c;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(700px 520px at 50% 45%, var(--lamp), transparent 70%),
      radial-gradient(1100px 700px at 12% 0%, var(--bg2), transparent 62%),
      radial-gradient(900px 600px at 100% 100%, color-mix(in srgb, var(--teal) 16%, transparent), transparent 60%),
      var(--bg);
  }
  /* paper grain over the whole stage */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.32;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .33 0 0 0 0 .2 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  :root[data-theme="dark"] body::before { mix-blend-mode: soft-light; opacity: 0.5; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 64px;
    padding: 16px;
    overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; filter: drop-shadow(0 10px 14px var(--lshadow)); animation: float 14s ease-in-out infinite alternate; }
  .blob.b1 { width: 260px; height: 260px; left: -70px; top: -60px; background: var(--mustard); opacity: 0.55; }
  .blob.b2 { width: 380px; height: 380px; right: -140px; bottom: -150px; background: var(--teal); opacity: 0.4; animation-duration: 18s; }
  .blob.b3 { width: 90px; height: 90px; right: 14%; top: 12%; background: var(--coral); opacity: 0.5; animation-duration: 11s; }
  @keyframes float { to { transform: translate(18px, 22px) rotate(8deg); } }

  .caption { display: none; width: 270px; position: relative; }
  .caption .eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal-d); }
  :root[data-theme="dark"] .caption .eyebrow { color: var(--mustard); }
  .caption h1 { margin: 0 0 10px; font-size: 44px; line-height: 1; letter-spacing: -0.04em; }
  .caption p { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .caption ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .caption li {
    display: inline-flex; align-items: center; gap: 8px; width: fit-content;
    padding: 7px 12px 7px 9px; border-radius: 999px; font-size: 13px; font-weight: 650;
    background: var(--paper); box-shadow: 0 1px 0 var(--rim) inset, 0 6px 14px -8px var(--shadow);
  }
  .caption li i { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
  .caption li:nth-child(2) i { background: var(--teal); }
  .caption li:nth-child(3) i { background: var(--mustard); }
  @media (min-width: 900px) { .caption { display: block; } }

  /* ---------- Phone ---------- */
  .device {
    position: relative;
    width: min(390px, 100%);
    height: clamp(540px, calc(100vh - 32px), 760px);
    height: clamp(540px, calc(100dvh - 32px), 760px);
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(420px 300px at 50% 30%, color-mix(in srgb, var(--glow) 14%, transparent), transparent 70%),
      var(--device);
    border-radius: 46px;
    box-shadow: 0 0 0 9px var(--frame), 0 0 0 10px color-mix(in srgb, var(--frame) 60%, #888), 0 50px 90px -30px var(--shadow);
    overflow: hidden;
    isolation: isolate;
  }
  .island { position: absolute; top: 10px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 20px; background: #0b0b0d; z-index: 3; }
  .status { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-size: 14px; font-weight: 700; }
  .status svg { display: block; }
  .top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 2px 18px 0 20px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; font-size: 14px; letter-spacing: -0.01em; }
  .brand svg { width: 26px; height: 26px; }
  .skip {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700;
    padding: 9px 12px; border-radius: 12px; cursor: pointer; transition: opacity 0.3s, transform 0.3s, color 0.2s;
  }
  .skip:hover { color: var(--ink); }
  .skip:disabled { opacity: 0; transform: translateX(10px); pointer-events: none; }

  /* ---------- Pager: scene + copy, all draggable ---------- */
  .pager {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    border-radius: 24px;
    margin: 0 8px;
  }
  .pager.dragging { cursor: grabbing; }
  .scene { position: relative; flex: 1; min-height: 190px; }
  .fit { position: absolute; left: 50%; top: 50%; width: 320px; height: 280px; transform: translate(-50%, calc(-50% + var(--y, 0px))) scale(var(--s, 1)); }

  /* the pop-up book, a 320 x 280 design box seen from slightly above */
  .book { position: absolute; inset: 0; perspective: 760px; perspective-origin: 50% 0; }
  .book .shadow { position: absolute; left: -6px; top: 252px; width: 332px; height: 36px; background: radial-gradient(closest-side, var(--lshadow), transparent); }
  .floor {
    position: absolute; left: 10px; top: 12px; width: 300px; height: 250px;
    transform-origin: 50% 100%; transform: rotateX(70deg);
    border-radius: 6px 6px 10px 10px;
    background: linear-gradient(to bottom, rgba(40, 25, 10, 0.22), transparent 26%), var(--paper);
    overflow: hidden;
  }
  .floor svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .back {
    position: absolute; left: 10px; top: 0; width: 300px; height: 168px; padding: 7px;
    transform-origin: 50% 100%;
    border-radius: 8px 8px 3px 3px;
    background: var(--paper);
    box-shadow: inset 0 -18px 18px -14px rgba(40, 25, 10, 0.35);
  }
  .skies { position: absolute; inset: 7px; border-radius: 5px; overflow: hidden; }
  .sky { position: absolute; inset: 0; opacity: 0; }
  .sky svg { width: 100%; height: 100%; display: block; }
  .cover { display: none; position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
  .cover svg { width: 100%; height: 100%; display: block; }
  .back.flipped .skies { display: none; }
  .back.flipped .cover { display: block; transform: scaleY(-1); }
  .edges {
    position: absolute; left: 10px; top: 262px; width: 300px; height: 9px; border-radius: 0 0 8px 8px;
    background: repeating-linear-gradient(to bottom, var(--paper2) 0 2px, var(--rim) 2px 3px);
    box-shadow: 0 3px 6px -2px var(--lshadow);
  }
  .layer {
    position: absolute; top: 0;
    transform-origin: 50% 100%;
    visibility: hidden;
    filter: drop-shadow(0 5px 3px var(--lshadow));
    will-change: transform, opacity;
  }
  .layer svg { display: block; overflow: visible; }

  /* paper fills */
  .c-teal { fill: var(--teal); } .c-tealD { fill: var(--teal-d); } .c-mus { fill: var(--mustard); } .c-cor { fill: var(--coral); }
  .c-sage { fill: var(--sage); } .c-sageD { fill: var(--sage-d); } .c-snow { fill: var(--snow); } .c-wood { fill: var(--wood); }
  .c-woodD { fill: var(--wood-d); } .c-water { fill: var(--water); } .c-rock { fill: var(--rock); } .c-rockD { fill: var(--rock-d); }
  .c-glow { fill: var(--glow); } .c-nightM { fill: var(--night-m); } .c-ink { fill: var(--ink-soft); } .c-cloud { fill: var(--cloud); } .c-rim { fill: var(--rim); }
  .cut { stroke: var(--rim); stroke-width: 2.2; stroke-linejoin: round; paint-order: stroke; }
  .ln { fill: none; stroke: var(--rim); stroke-width: 2; stroke-linecap: round; }
  .ln-wood { fill: none; stroke: var(--wood-d); stroke-width: 1.4; opacity: 0.55; }
  .road { fill: none; stroke: var(--rim); stroke-width: 11; stroke-linecap: round; }
  .road-dash { fill: none; stroke: var(--mustard); stroke-width: 1.6; stroke-dasharray: 5 6; animation: roll 1.1s linear infinite; }
  .route { fill: none; stroke: var(--mustard); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; animation: roll 1.6s linear infinite; }
  .spoke { stroke: var(--rim); stroke-width: 1.6; }
  .sign { font: 800 7.4px system-ui, sans-serif; fill: var(--ink-soft); text-anchor: middle; letter-spacing: 0.06em; }
  .cover-t { font: 800 13px system-ui, sans-serif; fill: var(--mustard); text-anchor: middle; letter-spacing: 0.32em; }

  /* idle micro-motion inside the scenes */
  .cloud { animation: drift 9s ease-in-out infinite alternate; }
  .cloud.k2 { animation-duration: 12s; animation-delay: -4s; }
  @keyframes drift { to { transform: translateX(16px); } }
  .halo { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.12); opacity: 0.18; } }
  .shim { animation: shim 2.6s ease-in-out infinite alternate; }
  @keyframes shim { to { transform: translateX(8px); opacity: 0.5; } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2.5px); } }
  .bump { animation: bump 0.42s ease-in-out infinite alternate; }
  @keyframes bump { to { transform: translateY(-1.2px); } }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .puff { transform-box: fill-box; transform-origin: center; animation: puff 1.4s ease-out infinite; }
  .puff.p2 { animation-delay: -0.7s; }
  @keyframes puff { 0% { transform: translateX(0) scale(0.5); opacity: 0.9; } 100% { transform: translateX(-16px) scale(1.5); opacity: 0; } }
  .smoke circle { transform-box: fill-box; transform-origin: center; animation: smoke 3s ease-out infinite; opacity: 0; }
  .smoke .s2 { animation-delay: -1s; } .smoke .s3 { animation-delay: -2s; }
  @keyframes smoke { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 20% { opacity: 0.9; } 100% { transform: translate(12px, -36px) scale(1.7); opacity: 0; } }
  .win { animation: flicker 3.2s ease-in-out infinite; }
  @keyframes flicker { 40% { opacity: 0.8; } 45% { opacity: 1; } 70% { opacity: 0.88; } }
  .bird { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; stroke-linecap: round; animation: fly 7s ease-in-out infinite alternate; }
  @keyframes fly { to { transform: translate(26px, -6px); } }
  .star { animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: 0.25; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 0.5s ease-in-out infinite alternate; }
  .flame.f2 { animation-duration: 0.37s; }
  @keyframes flame { to { transform: scale(0.88, 1.1) skewX(3deg); } }
  .fireglow { fill: var(--glow); opacity: 0.35; animation: flicker 1.6s ease-in-out infinite; }

  /* ---------- Copy ---------- */
  .copy { flex: none; padding: 2px 24px 4px 26px; min-height: 124px; }
  .kicker { margin: 0 0 6px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: var(--teal-d); }
  :root[data-theme="dark"] .kicker { color: var(--mustard); }
  .copy h2 { margin: 0 0 8px; font-size: 27px; line-height: 1.08; letter-spacing: -0.035em; font-weight: 800; }
  .copy p.body { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); max-width: 32ch; }

  /* ---------- Footer: inchworm dots + Next ---------- */
  .foot { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 24px 18px; }
  .dots { position: relative; display: flex; }
  .dot { width: 22px; height: 34px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; border-radius: 10px; }
  .dot i { width: 7px; height: 7px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 22%, transparent); transition: transform 0.25s; }
  .dot:hover i { transform: scale(1.35); }
  .worm { position: absolute; left: 0; top: 13.5px; height: 7px; width: 22px; border-radius: 4px; background: var(--coral); pointer-events: none; box-shadow: 0 2px 6px -1px color-mix(in srgb, var(--coral) 60%, transparent); }
  .next {
    position: relative;
    height: 58px; width: 58px;
    border: 0; border-radius: 29px; padding: 0;
    background: var(--coral); color: #fff;
    font: inherit; font-weight: 750; font-size: 15px;
    cursor: pointer; overflow: hidden;
    box-shadow: 0 12px 22px -10px color-mix(in srgb, var(--coral) 80%, transparent), inset 0 -3px 0 rgba(0, 0, 0, 0.12);
    transition: width 0.6s cubic-bezier(0.3, 1.45, 0.5, 1), transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.3s;
  }
  .next:active { transform: scale(0.92); }
  .next .lbl { position: absolute; left: 22px; top: 50%; transform: translate(-8px, -50%); opacity: 0; white-space: nowrap; transition: opacity 0.25s, transform 0.4s; }
  .next .arrow { position: absolute; right: 17px; top: 50%; width: 24px; height: 24px; margin-top: -12px; transition: transform 0.4s cubic-bezier(0.3, 1.5, 0.5, 1), opacity 0.2s; }
  .next .arrow path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .next:hover .arrow { transform: translateX(3px); }
  .next.wide { width: 184px; background: var(--teal-d); box-shadow: 0 12px 22px -10px color-mix(in srgb, var(--teal) 80%, transparent), inset 0 -3px 0 rgba(0, 0, 0, 0.14); }
  :root[data-theme="dark"] .next.wide { background: var(--teal); }
  .next.wide .lbl { opacity: 1; transform: translate(0, -50%); transition-delay: 0.12s; }
  .next .spin { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px; border-radius: 50%; border: 2.6px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; opacity: 0; }
  .next.working .lbl, .next.working .arrow { opacity: 0; }
  .next.working .spin { opacity: 1; animation: spin 0.7s linear infinite; }
  .next.working { width: 58px; }

  /* ---------- Finish badge ---------- */
  .done {
    position: absolute; left: 50%; top: 46%; z-index: 6;
    display: grid; justify-items: center; gap: 4px; text-align: center;
    padding: 18px 22px 16px; border-radius: 22px; min-width: 210px;
    background: var(--paper); box-shadow: 0 1px 0 var(--rim) inset, 0 24px 40px -18px var(--shadow);
    transform: translate(-50%, -50%) scale(0.6) rotate(-4deg); opacity: 0; pointer-events: none;
    transition: transform 0.55s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.25s;
  }
  .done.show { transform: translate(-50%, -50%) scale(1) rotate(-2deg); opacity: 1; }
  .done svg { width: 54px; height: 54px; margin-bottom: 4px; }
  .done circle { fill: none; stroke: var(--teal); stroke-width: 3.5; stroke-dasharray: 146; stroke-dashoffset: 146; transform: rotate(-90deg); transform-origin: center; }
  .done path { fill: none; stroke: var(--teal); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 36; stroke-dashoffset: 36; }
  .done.show circle { stroke-dashoffset: 0; transition: stroke-dashoffset 0.6s 0.1s ease-out; }
  .done.show path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.35s 0.55s ease-out; }
  .done b { font-size: 18px; letter-spacing: -0.02em; }
  .done span { font-size: 12.5px; color: var(--muted); }

  .confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
  .ghost {
    position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; z-index: 9; pointer-events: none;
    background: rgba(255, 255, 255, 0.34); border: 2px solid rgba(43, 38, 32, 0.6);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22), 0 0 0 6px rgba(255, 255, 255, 0.2);
    opacity: 0; transition: opacity 0.3s;
  }
  :root[data-theme="dark"] .ghost { border-color: rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.22); }
  .ghost::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: rgba(43, 38, 32, 0.35); transition: transform 0.2s; transform: scale(0.6); }
  :root[data-theme="dark"] .ghost::after { background: rgba(255, 255, 255, 0.7); }
  .worm.glide { transition: transform 0.75s cubic-bezier(0.3, 1.3, 0.5, 1), width 0.75s; }
  .ghost.on { opacity: 1; }
  .ghost.press::after { transform: scale(1); }

  /* full-bleed on phones */
  @media (max-width: 480px) {
    .stage { padding: 0; }
    .device { width: 100%; height: 100vh; height: 100dvh; min-height: 540px; border-radius: 0; box-shadow: none; }
    .island, .blob { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <i class="blob b1" aria-hidden="true"></i><i class="blob b2" aria-hidden="true"></i><i class="blob b3" aria-hidden="true"></i>
  <aside class="caption">
    <p class="eyebrow">Onboarding · pop-up book</p>
    <h1>Paper Pop</h1>
    <p>Turn a page and the paper scenery folds flat while the next scene springs up, layer by layer.</p>
    <ul><li><i></i>Drag or swipe sideways</li><li><i></i>Arrow keys turn pages</li><li><i></i>Start planning closes the book</li></ul>
  </aside>

  <section class="device" id="device" aria-label="Trip planner welcome">
    <div class="island" aria-hidden="true"></div>

            var l = clamp01((a - POP_START[i]) / (1 - POP_START[i]));
            setLayer(L, PHI * (1 - easeOutBack(l)), dir * (1 - l) * PARALLAX[i] * 1.6, clamp01(l * 8));
          } else if (L.el.style.visibility !== "hidden") setLayer(L, PHI, 0, 0);
        });
        var sk = S.skyEl;
        if (s === cur) { sk.style.opacity = "1"; sk.style.zIndex = "1"; }
        else if (s === tgt) { sk.style.opacity = clamp01((a - 0.2) / 0.6).toFixed(3); sk.style.zIndex = "2"; }
        else sk.style.opacity = "0";
      });
      copy.style.transform = "translateX(" + (pv * 44).toFixed(1) + "px)";
      copy.style.opacity = (1 - clamp01(a * 1.15)).toFixed(3);
      placeWorm(cur, tgt, a);
    }

    // inchworm: the front end runs ahead, the back end catches up
    function placeWorm(from, to, a) {
      var x0 = from * DOT_GAP, lead = x0, trail = x0;
      if (to >= 0) {
        var x1 = to * DOT_GAP;
        lead = x0 + (x1 - x0) * clamp01(a / 0.55);
        trail = x0 + (x1 - x0) * clamp01((a - 0.45) / 0.55);
      }
      var lo = Math.min(lead, trail), hi = Math.max(lead, trail);
      worm.style.transform = "translateX(" + lo.toFixed(1) + "px)";
      worm.style.width = (hi - lo + WORM_W).toFixed(1) + "px";
    }

    // closing / opening the whole book (finish sequence and the intro)
    function renderBook(c, s, mode) {
      var S = SCENES[s], tb = 0;
      S.layers.forEach(function (L, i) {
        if (mode === "close") {
          var f = easeInOut(clamp01(c / (FOLD_END[i] * 0.62)));
          setLayer(L, PHI * f, 0, 1 - clamp01((f - 0.8) / 0.2) * 0.55);
        } else {
          var st = mode === "open" ? 0.32 + i * 0.1 : i * 0.13;
          var l = clamp01((c - st) / (mode === "open" ? 0.4 : 0.5));
          setLayer(L, PHI * (1 - easeOutBack(l)), 0, clamp01(l * 3));
        }
      });
      if (mode === "close") tb = -110 * easeInOut(clamp01((c - 0.42) / 0.58));
      else if (mode === "open") tb = -110 * (1 - easeOutSoft(clamp01(c / 0.5)));
      setBack(tb);
      SCENES.forEach(function (S2, k) { S2.skyEl.style.opacity = k === s ? "1" : "0"; });
      copy.style.opacity = mode === "close" ? (1 - clamp01(c * 2.5)).toFixed(3) : mode === "open" ? "0" : "1";
      copy.style.transform = mode === "close" ? "translateY(" + (c * 12).toFixed(1) + "px)" : "none";
    }
    function hideScene(s) { SCENES[s].layers.forEach(function (L) { setLayer(L, PHI, 0, 0); }); }

    // ---------- Tween (one at a time) ----------
    function stopAnim() { if (anim) { cancelAnimationFrame(anim.id); anim = null; } }
    function tween(from, to, ms, ease, step, done, kind) {
      stopAnim();
      if (reduce.matches || ms <= 0) { step(to); if (done) done(); return; }
      var t0 = performance.now(), h = { kind: kind || "", id: 0 };
      function f(now) {
        var t = clamp01((now - t0) / ms);
        step(from + (to - from) * ease(t));
        if (t < 1) h.id = requestAnimationFrame(f);
        else { if (anim === h) anim = null; if (done) done(); }
      }
      anim = h;
      h.id = requestAnimationFrame(f);
    }

    // ---------- Page turns ----------
    function finishTo(t) {
      override = t;
      var sign = t > cur ? -1 : 1, from = p * sign < 0 ? 0 : p;
      tween(from, sign, 240 + 440 * Math.abs(sign - from), easeOutCubic, render, function () { override = -1; commit(t); }, "commit");
    }
    function springBack() {
      tween(p, 0, 560, easeOutSoft, render, function () { override = -1; render(0); }, "back");
    }
    function commit(t) {
      cur = t;
      render(0);
      updateUI(true);
      thunk();
      buzz(8);
    }
    function goTo(t) {
      if (busy || drag || (anim && anim.kind !== "back")) return;
      if (t === cur) return;
      if (t < 0 || t >= N) { // edge: a small "nothing more this way" wobble
        override = -1;
        tween(0, t < 0 ? 0.2 : -0.2, 170, easeOutCubic, render, springBack, "back");
        return;
      }
      finishTo(t);
    }
    function thunk() {
      if (reduce.matches || !book.animate) return;
      book.animate([{ transform: "none" }, { transform: "translateY(3px) scaleY(0.985)" }, { transform: "translateY(-1px)" }, { transform: "none" }], { duration: 380, easing: "ease-out" });
    }
    function animateCopy() {
      if (reduce.matches || !kicker.animate) return;
      [kicker, titleEl, bodyEl].forEach(function (el, k) {
        el.animate([{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], { duration: 560, delay: 40 + k * 80, easing: "cubic-bezier(.2,1.25,.4,1)", fill: "backwards" });
      });
    }
    function updateUI(animateText) {
      var S = SCENES[cur], last = cur === N - 1;
      kicker.textContent = "Plan your trip north · " + (cur + 1) + "/" + N;
      titleEl.textContent = S.title;
      bodyEl.textContent = S.body;
      if (animateText) animateCopy();
      dots.forEach(function (b, k) { if (k === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
      nextBtn.classList.toggle("wide", last);
      nextBtn.setAttribute("aria-label", last ? "Start planning" : "Next page");
      skipBtn.disabled = last;
      say("Page " + (cur + 1) + " of " + N + ": " + S.title);
    }

    // ---------- Finish: the book closes, a check draws itself, paper confetti, then it reopens ----------
    function startPlanning() {
      if (busy) return;
      busy = true;
      stopAnim();
      override = -1;
      nextBtn.classList.add("working");
      say("Setting up your trip board");
      setTimeout(function () {
        tween(0, 1, 1100, linear, function (c) { renderBook(c, cur, "close"); }, function () {
          thunk();
          buzz([12, 40, 18]);
          doneEl.classList.add("show");
          say("Trip board ready: 4 stops, 3 nights, 5 friends");
          confetti();
          setTimeout(function () {
            doneEl.classList.remove("show");
            nextBtn.classList.remove("working");
            var old = cur;
            cur = 0;
            hideScene(old);
            updateUI(false);
            // the inchworm glides home while the book opens
            worm.classList.add("glide");
            placeWorm(0, -1, 0);
            setTimeout(function () { worm.classList.remove("glide"); }, 800);
            tween(0, 1, 1250, linear, function (c) { renderBook(c, 0, "open"); }, function () {
              setBack(0);
              render(0);
              animateCopy();
              busy = false;
            }, "finish");
          }, reduce.matches ? 1200 : 2300);
        }, "finish");
      }, reduce.matches ? 0 : 600);
    }

    function confetti() {
      if (reduce.matches || !canvas.getContext) return;
      var ctx = canvas.getContext("2d"), r = device.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      if (!ctx) return; // no 2D canvas: skip the confetti, the rest still works
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var cs = getComputedStyle(document.documentElement);
      var cols = ["--coral", "--mustard", "--teal", "--sage", "--rim"].map(function (v) { return cs.getPropertyValue(v).trim() || "#e5664e"; });
      var sr = sceneBox.getBoundingClientRect(), cx = sr.left - r.left + sr.width / 2, cy = sr.top - r.top + sr.height * 0.42;
      var bits = [];
      for (var k = 0; k < 90; k++) {
        var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp = 4 + Math.random() * 6.5;
        bits.push({ x: cx + (Math.random() - 0.5) * 60, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, w: 5 + Math.random() * 5, h: 8 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, ph: Math.random() * 6, c: cols[k % cols.length] });
      }
      var t0 = performance.now();
      (function f(now) {
        var t = now - t0, alive = 0;
        ctx.clearRect(0, 0, r.width, r.height);
        bits.forEach(function (b) {
          b.vy += 0.16; b.vx *= 0.97; b.vy *= 0.97;
          b.x += b.vx + Math.sin(t / 170 + b.ph) * 0.7; b.y += b.vy; b.rot += b.vr;
          if (b.y < r.height + 20) alive++;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.rot);
          ctx.scale(1, Math.cos(t / 110 + b.ph));
          ctx.globalAlpha = Math.max(0, 1 - t / 2800);
          ctx.fillStyle = b.c;
          ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          ctx.restore();
        });
        if (alive && t < 2800) requestAnimationFrame(f); else ctx.clearRect(0, 0, r.width, r.height);
      })(t0);
    }

    // ---------- Dragging (real pointers and the auto-demo use the same three functions) ----------
    function down(x, y) {
      if (busy || drag || (anim && anim.kind !== "back")) return false;
      var p0 = p;
      stopAnim();
      override = -1;
      drag = { x0: x, lx: x, lt: performance.now(), v: 0, moved: Math.abs(p0) > 0.01, p0: p0, armed: false, synthetic: false, pid: null };
      return true;
    }
    function move(x) {
      if (!drag) return;
      var dx = x - drag.x0;
      if (!drag.moved) { if (Math.abs(dx) < 6) return; drag.moved = true; }
      pager.classList.add("dragging");
      var now = performance.now(), dt = Math.max(8, now - drag.lt);
      drag.v = drag.v * 0.3 + ((x - drag.lx) / dt) * 0.7;
      drag.lx = x;
      drag.lt = now;
      var raw = drag.p0 + dx / (pager.clientWidth * 0.8), t = cur + (raw < 0 ? 1 : -1), pv;
      if (raw === 0) pv = 0;
      else if (t < 0 || t >= N) pv = (raw < 0 ? -1 : 1) * Math.min(0.24, Math.abs(raw) * 0.35); // rubber band at the ends
      else pv = Math.max(-1.05, Math.min(1.05, raw));
      render(pv);
      var armed = Math.abs(pv) > 0.35 && t >= 0 && t < N;
      if (armed && !drag.armed) buzz(6);
      drag.armed = armed;
    }
    function up() {
      if (!drag) return;
      var d = drag;
      drag = null;
      pager.classList.remove("dragging");
      if (!d.moved) { if (Math.abs(p) > 0.001) springBack(); return; }
      var v = performance.now() - d.lt > 120 ? 0 : d.v;
      var t = cur + (p < 0 ? 1 : -1), ok = p !== 0 && t >= 0 && t < N;
      var flick = Math.abs(v) > 0.5 && v * p > 0 && Math.abs(p) > 0.06;
      if (ok && (Math.abs(p) > 0.35 || flick)) finishTo(t); else springBack();
    }

    pager.addEventListener("pointerdown", function (e) {
      if (e.button > 0 || e.target.closest("button")) return;
      if (down(e.clientX, e.clientY)) {
        drag.pid = e.pointerId;
        try { pager.setPointerCapture(e.pointerId); } catch (err) {}
      }
    });
    pager.addEventListener("pointermove", function (e) { if (drag && !drag.synthetic && e.pointerId === drag.pid) move(e.clientX); });
    function endPointer(e) { if (drag && !drag.synthetic && e.pointerId === drag.pid) up(); }
    pager.addEventListener("pointerup", endPointer);
    pager.addEventListener("pointercancel", endPointer);
    pager.addEventListener("lostpointercapture", endPointer);

    // ---------- Buttons and keys ----------
    nextBtn.addEventListener("click", function () {
      if (busy) return;
      if (cur === N - 1) startPlanning(); else goTo(cur + 1);
    });
    skipBtn.addEventListener("click", function () { goTo(N - 1); });
    device.addEventListener("keydown", function (e) {
      if (busy) return;
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(cur + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(cur - 1); }
    });

    // ---------- Fit the 320 x 280 book into whatever room the phone has ----------
    function fit() {
      var w = sceneBox.clientWidth, h = sceneBox.clientHeight;
      if (!w || !h) return;
      var s = Math.max(0.5, Math.min((w + 6) / 300, h / 280, 1.4)); // the 300 px wide page may use the side margins
      fitEl.style.setProperty("--s", s.toFixed(3));
      fitEl.style.setProperty("--y", (Math.max(0, h - 280 * s) * 0.15).toFixed(1) + "px"); // sit a little nearer the text
    }
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(sceneBox);
    fit();

    // ---------- Auto-demo with a ghost finger ----------
    var demo = { on: !reduce.matches, timers: [], raf: 0 };
    function dLater(fn, ms) { demo.timers.push(setTimeout(function () { if (demo.on) fn(); }, ms)); }
    function ghostAt(x, y) {
      var r = device.getBoundingClientRect();
      ghost.style.transform = "translate3d(" + (x - r.left - 22).toFixed(1) + "px," + (y - r.top - 22).toFixed(1) + "px,0)";
    }
    function ghostShow(x, y) { ghostAt(x, y); ghost.classList.add("on"); }
    function ghostHide() { ghost.classList.remove("on", "press"); }
    function stopDemo() {
      if (!demo.on) return;
      demo.on = false;
      demo.timers.forEach(clearTimeout);
      cancelAnimationFrame(demo.raf);
      ghostHide();
      if (drag && drag.synthetic) { drag = null; pager.classList.remove("dragging"); springBack(); }
    }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (type) {
      window.addEventListener(type, function (e) { if (e.isTrusted) { userActive = true; stopDemo(); } }, { capture: true, passive: true });
    });

    function demoLoop() {
      if (!demo.on) return;
      if (busy || anim || drag) { dLater(demoLoop, 700); return; }
      if (cur === N - 1) {
        var r = nextBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
        ghostShow(x, y);
        dLater(function () { ghost.classList.add("press"); }, 420);
        dLater(function () { ghostHide(); nextBtn.click(); }, 620);
        dLater(demoLoop, 620 + 600 + 1100 + 2300 + 1250 + 2400);
      } else demoDrag();
    }
    function demoDrag() {
      var r = pager.getBoundingClientRect(), y = r.top + r.height * 0.34, x0 = r.left + r.width * 0.76, dist = r.width * 0.42;
      ghostShow(x0, y);
      dLater(function () {
        ghost.classList.add("press");
        if (!down(x0, y)) { ghostHide(); dLater(demoLoop, 1500); return; }
        drag.synthetic = true;
        var t0 = performance.now(), dur = 1500;
        (function f(now) {
          if (!demo.on) return;
          var t = clamp01((now - t0) / dur), x = x0 - dist * easeOutCubic(t);
          ghostAt(x, y);
          move(x);
          if (t < 1) demo.raf = requestAnimationFrame(f);
          else dLater(function () { ghost.classList.remove("press"); up(); dLater(ghostHide, 180); dLater(demoLoop, 2700); }, 380);
        })(t0);
      }, 90);
    }

    // ---------- Start: page 1 pops up out of the open book ----------
    setBack(0);
    updateUI(false);
    render(0);
    if (reduce.matches) {
      animateCopy();
    } else {
      hideScene(0);
      animateCopy();
      // the demo starts as soon as the intro has settled
      tween(0, 1, 560, linear, function (c) { renderBook(c, 0, "pop"); }, function () { render(0); dLater(demoLoop, 30); }, "finish");
    }
  })();
</script>
</body>
</html>
