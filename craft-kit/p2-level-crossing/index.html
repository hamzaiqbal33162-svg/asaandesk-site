<!doctype html>
<!-- Chill & Craft · Level Crossing · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Crossing · a country railway crossing you can run</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL wins over the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens (day = light, night = dark) ---------- */
  :root {
    --page: #eef2e6; --page2: #dce9f2; --ink: #1f2a22; --muted: #5d6a5f; --line: rgba(31, 42, 34, 0.12);
    --sky1: #6fb6ea; --sky2: #dff0f8; --sun: #ffd65a; --sunGlow: rgba(255, 214, 90, 0.55); --stars: 0;
    --hill1: #a9cfa0; --hill2: #86ba82; --tree: #4f8f4f; --tree2: #3c7a42; --house: #e9d9bd; --houseWin: #7e8b8f;
    --mustard: #f1c84a; --mustard2: #dcae2f; --crop: #8cc06f; --crop2: #74ab5a; --grass: #94c377; --grass2: #7fb265;
    --road: #6d717b; --road2: #8b8f98; --ballast: #9a8f84; --sleeper: #6b5440; --rail: #c9ced6;
    --cloud: #ffffff; --glass: #a7cfe6; --night: 0; --chip: rgba(255, 255, 255, 0.78);
    --btn: #1f5f3f; --btnInk: #fff8e6; --focus: #d9480f; --ok: #2f7d4f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0b0f17; --page2: #131c2d; --ink: #eef1f4; --muted: #a3adb8; --line: rgba(255, 255, 255, 0.1);
      --sky1: #070d1f; --sky2: #24385f; --sun: #f4f1df; --sunGlow: rgba(220, 230, 255, 0.25); --stars: 1;
      --hill1: #1f3446; --hill2: #182a39; --tree: #12241f; --tree2: #0e1c18; --house: #2b3340; --houseWin: #ffcf6e;
      --mustard: #6d6328; --mustard2: #5a5121; --crop: #26412e; --crop2: #1f3626; --grass: #1f3527; --grass2: #1a2d21;
      --road: #2c2f37; --road2: #3a3e47; --ballast: #3c3833; --sleeper: #2c241c; --rail: #8a919c;
      --cloud: #3a4a68; --glass: #ffd27a; --night: 1; --chip: rgba(20, 26, 38, 0.82);
      --btn: #f2c94c; --btnInk: #1b1a10; --focus: #ffb35c; --ok: #7ad39b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0b0f17; --page2: #131c2d; --ink: #eef1f4; --muted: #a3adb8; --line: rgba(255, 255, 255, 0.1);
    --sky1: #070d1f; --sky2: #24385f; --sun: #f4f1df; --sunGlow: rgba(220, 230, 255, 0.25); --stars: 1;
    --hill1: #1f3446; --hill2: #182a39; --tree: #12241f; --tree2: #0e1c18; --house: #2b3340; --houseWin: #ffcf6e;
    --mustard: #6d6328; --mustard2: #5a5121; --crop: #26412e; --crop2: #1f3626; --grass: #1f3527; --grass2: #1a2d21;
    --road: #2c2f37; --road2: #3a3e47; --ballast: #3c3833; --sleeper: #2c241c; --rail: #8a919c;
    --cloud: #3a4a68; --glass: #ffd27a; --night: 1; --chip: rgba(20, 26, 38, 0.82);
    --btn: #f2c94c; --btnInk: #1b1a10; --focus: #ffb35c; --ok: #7ad39b;
    color-scheme: dark;
  }

  /* ---------- Page and stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; overflow-x: clip;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: radial-gradient(110% 70% at 50% 0%, var(--page2), transparent 70%), var(--page);
  }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-x: clip; }
  .cap, .scene { width: min(520px, 100%, calc((100vh - 236px) * 0.8)); min-width: 260px; }
  .controls { width: min(520px, 100%); }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .cap b { font-size: 15px; color: var(--ink); letter-spacing: 0.01em; }
  .cap span { font-variant-numeric: tabular-nums; text-align: right; }
  .scene {
    position: relative; aspect-ratio: 4 / 5; border-radius: 26px; overflow: hidden; isolation: isolate; touch-action: manipulation;
    background: var(--sky2); cursor: pointer;
    box-shadow: 0 30px 60px -24px rgba(20, 40, 30, 0.55), 0 10px 22px -12px rgba(20, 40, 30, 0.35), inset 0 0 0 1px var(--line);
  }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene.rumble svg { animation: rumble 0.09s steps(2) infinite; }
  @keyframes rumble { 50% { transform: translate(0.6px, -0.5px); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Drawn parts that move by CSS ---------- */
  .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(560px); } }
  .star { fill: #fff; opacity: calc(var(--stars) * 0.85); animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: calc(var(--stars) * 0.25); } }
  .night { opacity: var(--night); transition: opacity 0.6s; }
  .day { opacity: calc(1 - var(--night)); }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.4s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(3deg); } }
  .puff { fill: #c9ccd2; animation: puff 1.8s ease-out forwards; }
  @keyframes puff { from { opacity: 0.6; transform: translate(0, 0) scale(0.4); } to { opacity: 0; transform: translate(var(--px, -10px), -18px) scale(1.6); } }
  .ring { fill: none; stroke: #fff; stroke-width: 2; animation: ring 0.9s ease-out forwards; }
  @keyframes ring { from { opacity: 0.9; r: 4; } to { opacity: 0; r: 34; } }
  .bubble { animation: bubble 1.2s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  @keyframes bubble { 0% { opacity: 0; transform: translateY(6px) scale(0.5); } 15% { opacity: 1; transform: translateY(0) scale(1.08); } 75% { opacity: 1; transform: translateY(-6px) scale(1); } 100% { opacity: 0; transform: translateY(-12px) scale(0.95); } }
  .wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 0.5s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: rotate(-40deg); } }
  .veh { cursor: pointer; }

  /* ---------- Controls ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: 600 14px/1 system-ui, sans-serif;
    box-shadow: 0 6px 16px -10px rgba(0, 0, 0, 0.4); transition: transform 0.18s cubic-bezier(.3, 1.6, .5, 1), background 0.2s;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px) scale(0.97); }
  .btn.main { background: var(--btn); color: var(--btnInk); border-color: transparent; }
  .btn[aria-disabled="true"] { opacity: 0.6; }
  .btn:focus-visible, .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); }
  .seg label { position: relative; }
  .seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .seg span { display: block; padding: 9px 12px; border-radius: 999px; font: 600 13px/1 system-ui, sans-serif; color: var(--muted); transition: background 0.25s, color 0.25s; }
  .seg input:checked + span { background: var(--btn); color: var(--btnInk); }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; text-align: center; max-width: 520px; }
  .hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; max-width: 520px; }
  @media (max-height: 720px) { .hint { display: none; } }
  @media (max-width: 420px) { .btn { padding: 10px 13px; font-size: 13px; } .seg span { padding: 9px 9px; } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .star, .sway, .wave { animation: none; }
    .scene.rumble svg { animation: none; }
    .bubble { animation-duration: 1.6s; animation-timing-function: linear; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Level Crossing: call a train and watch the gates close, the train pass and the traffic move on</h1>
  <div class="cap"><b>Level Crossing</b><span id="tally">Trains 0 · Cars waited 0</span></div>

  <div class="scene" id="scene">
    <svg viewBox="0 0 400 500" aria-hidden="true" id="art">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--sky1)"/><stop offset="1" style="stop-color: var(--sky2)"/>
        </linearGradient>
        <radialGradient id="sunG"><stop offset="0" style="stop-color: var(--sunGlow)"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="redGlow"><stop offset="0" stop-color="#ff6b5a" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ff3b2e" stop-opacity="0.45"/><stop offset="1" stop-color="#ff3b2e" stop-opacity="0"/></radialGradient>
        <radialGradient id="warmGlow"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff4cf" stop-opacity="0.7"/><stop offset="1" stop-color="#fff4cf" stop-opacity="0"/></linearGradient>
        <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--road2)"/><stop offset="1" style="stop-color: var(--road)"/></linearGradient>
        <mask id="moonM"><circle r="19" fill="#fff"/><circle cx="-8" cy="-6" r="17" fill="#000"/></mask>
        <clipPath id="fieldL"><path d="M0 172 L198 170 L146 292 L0 292Z"/></clipPath>
        <clipPath id="fieldR"><path d="M202 170 L400 174 L400 292 L254 292Z"/></clipPath>
      </defs>

      <!-- sky, sun or moon, stars and clouds -->
      <rect width="400" height="500" fill="url(#skyG)"/>
      <g id="stars"></g>
      <g transform="translate(316 74)">
        <circle r="64" fill="url(#sunG)"/>
        <circle class="day" r="20" style="fill: var(--sun)"/>
        <circle class="night" r="19" style="fill: var(--sun)" mask="url(#moonM)"/>
      </g>
      <g style="fill: var(--cloud)" opacity="0.92">
        <path class="cloud" style="animation-duration: 70s; animation-delay: -20s" d="M0 70 q6 -16 22 -10 q8 -14 24 -4 q14 -2 14 14 z"/>
        <path class="cloud" style="animation-duration: 95s; animation-delay: -70s" d="M0 108 q5 -12 18 -8 q7 -12 20 -3 q12 -1 11 11 z" opacity="0.7"/>
        <path class="cloud" style="animation-duration: 120s; animation-delay: -10s" d="M0 40 q4 -10 14 -6 q6 -9 15 -2 q9 0 8 8 z" opacity="0.55"/>
      </g>

      <!-- far hills, village and trees on the horizon -->
      <path d="M0 150 Q50 128 100 142 T210 136 T320 130 T400 140 V176 H0Z" style="fill: var(--hill1)"/>
      <path d="M0 166 Q70 150 140 162 T280 156 T400 160 V178 H0Z" style="fill: var(--hill2)"/>
      <g id="village"></g>
      <g id="trees"></g>

      <!-- fields with rows that run to the horizon -->
      <g clip-path="url(#fieldL)"><rect x="0" y="168" width="210" height="130" style="fill: var(--mustard)"/><g id="rowsL"></g></g>
      <g clip-path="url(#fieldR)"><rect x="190" y="168" width="210" height="130" style="fill: var(--crop)"/><g id="rowsR"></g></g>
      <!-- near verges -->
      <rect x="0" y="292" width="400" height="208" style="fill: var(--grass)"/>
      <path d="M0 330 Q90 320 150 338 L0 380Z M400 350 Q330 330 262 346 L400 420Z" style="fill: var(--grass2)"/>
      <!-- the road, its centre dashes and stop lines -->
      <path d="M199 170 H201 L350 500 H50Z" fill="url(#roadG)"/>
      <g id="dashes" fill="#f4f1e6" opacity="0.85"></g>
      <path d="M124 335 H200 V338 H124Z M200 279 H250 V281 H200Z" fill="#f4f1e6" opacity="0.9"/>
      <!-- flowers on the verge -->
      <g id="flowers"></g>
      <!-- roadside: a railway warning sign, a milestone and grass tufts -->
      <g transform="translate(352 476)">
        <ellipse cx="0" cy="1" rx="9" ry="2.4" fill="#000" opacity="0.18"/>
        <rect x="-2" y="-64" width="4" height="64" fill="#8a919e"/>
        <rect x="-15" y="-82" width="30" height="30" rx="4" transform="rotate(45 0 -67)" fill="#f2c230" stroke="#2a2a2a" stroke-width="2"/>
        <rect x="-8" y="-73" width="16" height="9" rx="2" fill="#2a2a2a"/><rect x="2" y="-77" width="4" height="5" fill="#2a2a2a"/>
        <circle cx="-4" cy="-62" r="2" fill="#2a2a2a"/><circle cx="4" cy="-62" r="2" fill="#2a2a2a"/>
      </g>
      <g transform="translate(44 452)">
        <path d="M-12 0 V-22 Q-12 -32 0 -32 Q12 -32 12 -22 V0Z" fill="#f4f1ea" stroke="#c9c2b4"/>
        <path d="M-12 -22 Q-12 -32 0 -32 Q12 -32 12 -22Z" fill="#d23a36"/>
        <text y="-8" text-anchor="middle" font-size="8" font-weight="800" fill="#2a2a2a">12</text>
      </g>
      <g style="fill: var(--grass2)">
        <path d="M14 500 q2 -12 4 0 q2 -15 4 0 q2 -10 4 0Z M84 494 q2 -10 4 0 q2 -13 4 0 q2 -9 4 0Z M300 500 q2 -11 4 0 q2 -14 4 0 q2 -9 4 0Z M378 492 q2 -12 4 0 q2 -15 4 0 q2 -10 4 0Z"/>
      </g>

      <!-- power poles, the wire and the birds on it -->
      <g stroke="#5a4636" stroke-width="2.4" stroke-linecap="round">
        <path d="M40 292 V196 M34 202 H46 M360 292 V190 M354 196 H366"/>
      </g>
      <path id="wire" d="M40 200 Q200 226 360 194" fill="none" stroke="#3b3631" stroke-width="1" opacity="0.8"/>
      <g id="birds" fill="#2d2a33"></g>

      <!-- far gate, far traffic -->
      <g id="farCars"></g>
      <g id="farBoom"></g>

      <!-- track: ballast, sleepers, rails and the crossing panel -->
      <path d="M0 292 H400 V312 H0Z" style="fill: var(--ballast)"/>
      <path d="M0 292 H400 V295 H0Z" fill="#000" opacity="0.12"/>
      <g id="sleepers" style="fill: var(--sleeper)"></g>
      <path d="M138 293 H262 L266 311 H134Z" fill="url(#roadG)"/>
      <path d="M0 297 H400 M0 304 H400" style="stroke: var(--rail)" stroke-width="2"/>
      <path d="M0 298.4 H400 M0 305.4 H400" stroke="#000" stroke-width="0.8" opacity="0.25"/>

      <!-- the train is built here -->
      <g id="train"></g>

      <!-- signal cabin with its keeper and a live clock -->
      <g id="cabin" transform="translate(318 330)">
        <ellipse cx="0" cy="2" rx="54" ry="6" fill="#000" opacity="0.18"/>
        <rect x="-44" y="-70" width="88" height="70" fill="#c46d4b"/>
        <path d="M-44 -70 H44 V-62 H-44Z M-44 -40 H44 V-38 H-44Z M-44 -20 H44 V-18 H-44Z" fill="#000" opacity="0.1"/>
        <path d="M-54 -68 L0 -98 L54 -68Z" fill="#7a3b2b"/>
        <path d="M-54 -68 L0 -98 L4 -96 L-48 -68Z" fill="#fff" opacity="0.12"/>
        <rect x="-36" y="-58" width="34" height="26" rx="3" style="fill: var(--glass)" stroke="#4a2a1d" stroke-width="3"/>
        <rect class="night" x="-36" y="-58" width="34" height="26" rx="3" fill="url(#warmGlow)"/>
        <!-- keeper in the window: head, cap and a flag -->
        <g id="keeper" transform="translate(-19 -34)">
          <rect x="-8" y="-6" width="16" height="10" rx="4" fill="#3e6b8f"/>
          <circle cy="-12" r="6" fill="#c98b62"/>
          <path d="M-7 -15 Q0 -23 7 -15Z" fill="#20384d"/>
          <g id="flag" transform="translate(6 -2) rotate(30)">
            <path d="M0 0 V-22" stroke="#5a4636" stroke-width="1.6"/>
            <path id="flagCloth" d="M0 -22 L13 -18 L0 -13Z" fill="#e5383b"/>
          </g>
        </g>
        <rect x="8" y="-46" width="24" height="46" rx="2" fill="#5b3122"/>
        <circle cx="27" cy="-22" r="1.6" fill="#f2c94c"/>
        <g transform="translate(20 -58)">
          <circle r="8" fill="#fbf6ea" stroke="#4a2a1d" stroke-width="2"/>
          <path id="hHand" d="M0 0 V-4.5" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
          <path id="mHand" d="M0 0 V-6.5" stroke="#222" stroke-width="1.1" stroke-linecap="round"/>
        </g>
        <text x="-19" y="-74" text-anchor="middle" font-size="6.5" font-weight="800" fill="#fbe9c6" letter-spacing="0.6">CABIN</text>
      </g>

      <!-- crossing signal: crossbuck, bell and two red lamps -->
      <g id="signal" transform="translate(76 352)">
        <ellipse cx="0" cy="2" rx="16" ry="3" fill="#000" opacity="0.2"/>
        <rect x="-2.5" y="-128" width="5" height="130" fill="#e9ecef"/>
        <path d="M-2.5 -108 h5 v8 h-5z M-2.5 -88 h5 v8 h-5z M-2.5 -48 h5 v8 h-5z M-2.5 -28 h5 v8 h-5z" fill="#d23a36"/>
        <g transform="translate(0 -126)">
          <rect x="-30" y="-5" width="60" height="10" rx="2" fill="#fff" stroke="#d23a36" stroke-width="2" transform="rotate(32)"/>
          <rect x="-30" y="-5" width="60" height="10" rx="2" fill="#fff" stroke="#d23a36" stroke-width="2" transform="rotate(-32)"/>
        </g>
        <g id="bell" transform="translate(0 -102)">
          <path d="M-6 6 Q-6 -6 0 -6 Q6 -6 6 6Z" fill="#c9a13b"/>
          <circle cy="7" r="1.6" fill="#7a5a14"/>
        </g>
        <rect x="-26" y="-74" width="52" height="16" rx="8" fill="#22252b"/>
        <circle cx="-15" cy="-66" r="6" fill="#4a1d1a"/><circle cx="15" cy="-66" r="6" fill="#4a1d1a"/>
        <circle id="lampA" cx="-15" cy="-66" r="6" fill="#ff4a3a" opacity="0"/>
        <circle id="lampB" cx="15" cy="-66" r="6" fill="#ff4a3a" opacity="0"/>
        <circle id="glowA" cx="-15" cy="-66" r="26" fill="url(#redGlow)" opacity="0"/>
        <circle id="glowB" cx="15" cy="-66" r="26" fill="url(#redGlow)" opacity="0"/>
        <path d="M-23 -73 q8 -6 16 0 M7 -73 q8 -6 16 0" stroke="#22252b" stroke-width="3" fill="none"/>
      </g>

      <!-- near gate and near traffic -->
      <g id="nearBoom"></g>
      <g id="nearCars"></g>
      <g id="fx"></g>
    </svg>
  </div>

  <div class="controls">
    <button class="btn main" id="call" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2 -3M15 21l2 -3"/><circle cx="9" cy="14" r="0.6"/><circle cx="15" cy="14" r="0.6"/></svg>
      <span id="callLabel">Call the train</span>
    </button>
    <div class="seg" role="radiogroup" aria-label="Train type">
      <label><input type="radio" name="kind" value="express" checked><span>Express</span></label>
      <label><input type="radio" name="kind" value="goods"><span>Goods</span></label>
      <label><input type="radio" name="kind" value="local"><span>Local</span></label>
    </div>
    <button class="btn" id="addCar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2 -5h10l2 5v5M3 16h18M7 19v-3M17 19v-3M12 2v3M10.5 3.5h3"/></svg>
      Add a car
    </button>
  </div>
  <p class="status" id="status" aria-live="polite">Gates open. Traffic is moving.</p>
  <p class="hint">Tap a car to honk. The cabin clock shows the real time.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)");
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function f1(v) { return v.toFixed(1); }
  var scene = $("scene"), statusEl = $("status");
  function say(m) { statusEl.textContent = m; }

  /* ---------- Perspective: the road runs from the viewer (k = 1) to the horizon (k = 0) ---------- */
  var HZ = 170, VX = 200, SPAN = 330, KT = 0.39; // horizon y, vanishing x, ground height, depth of the track
  function yAt(k) { return HZ + SPAN * k; }

  /* ---------- 1. Static scenery built once ---------- */
  (function build() {
    var i;
    for (i = 0; i < 46; i++) {
      var s = el("circle", { "class": "star", cx: f1(rnd(0, 400)), cy: f1(rnd(0, 140)), r: (0.4 + Math.pow(Math.random(), 3) * 1.3).toFixed(2) }, $("stars"));

        el("rect", { x: 10, y: 216, width: CL - 20, height: 3, rx: 1.5, fill: "#fff", opacity: 0.18 }, c);
        el("rect", { x: 0, y: 288, width: CL, height: 4, fill: "#2a2d33" }, c);
      }
      if (last) { // red tail lamp on the last vehicle
        el("circle", { "class": "tailLamp", cx: 4, cy: 272, r: 3, fill: "#ff3b30" }, c);
      }
      [14, 30, CL - 30, CL - 14].forEach(function (wx) { wheel(c, wx, wheels); });
      wheels[wheels.length - 1].base = x; wheels[wheels.length - 2].base = x; wheels[wheels.length - 3].base = x; wheels[wheels.length - 4].base = x;
      parts.push({ el: c, x: x, ph: rnd(0, 6) });
      x += CL + GAP;
    }
    // the locomotive at the front (right side): sloped nose, cab window, headlight and stripe
    var L = el("g", {}, g);
    el("path", { d: "M0 218 Q0 212 8 212 H92 Q116 212 124 238 V288 H0Z", fill: K.body }, L);
    el("path", { d: "M0 256 H124 V266 H0Z", fill: K.stripe }, L);
    el("path", { d: "M98 220 H108 Q116 222 120 238 H98Z", style: "fill: var(--glass)" }, L);
    el("rect", { x: 14, y: 224, width: 16, height: 14, rx: 3, style: "fill: var(--glass)" }, L);
    el("rect", { x: 36, y: 224, width: 16, height: 14, rx: 3, style: "fill: var(--glass)" }, L);
    el("path", { d: "M12 212 V206 H70 V212", fill: "#3a3f47" }, L);
    el("rect", { x: 60, y: 244, width: 28, height: 8, rx: 2, fill: "#000", opacity: 0.2 }, L);
    var num = el("text", { x: 70, y: 279, "font-size": 8, "font-weight": 800, fill: "#fff", opacity: 0.85, "letter-spacing": 1 }, L);
    num.textContent = kindKey === "goods" ? "6207" : kindKey === "local" ? "2311" : "4021";
    el("circle", { cx: 121, cy: 272, r: 3.4, fill: "#fff7d6" }, L);
    el("path", { "class": "night", d: "M124 270 L240 250 V300Z", fill: "url(#beamG)" }, L);
    el("rect", { x: 0, y: 288, width: 124, height: 4, fill: "#2a2d33" }, L);
    [16, 34, 90, 108].forEach(function (wx) { wheel(L, wx, wheels); wheels[wheels.length - 1].base = x; });
    parts.push({ el: L, x: x, ph: 0, loco: true });
    var len = x + LL;
    train = { kind: K, key: kindKey, g: g, len: len, x: -30, wheels: wheels, parts: parts, horned: false };
    placeTrain(0);
  }
  function placeTrain(t) {
    var tx = train.x - train.len;
    train.parts.forEach(function (p) { p.el.setAttribute("transform", "translate(" + f1(tx + p.x) + " " + f1(reduce.matches ? 0 : Math.sin(t * 9 + p.ph) * 0.5) + ")"); });
    var ang = (train.x / 6.2) * 57.3 % 360;
    train.wheels.forEach(function (w) { w.el.setAttribute("transform", "translate(" + w.cx + " 296) rotate(" + f1(ang) + ")"); });
  }

  /* ---------- 7. The crossing sequence ---------- */
  // idle → warn (bell, lamps, gates down) → pass (train) → clear (gates up) → idle
  var phase = "idle", phaseT = 0, lampT = 0, pending = null;
  function kindChosen() { var r = document.querySelector('input[name="kind"]:checked'); return r ? r.value : "express"; }
  function callTrain(kindKey) {
    if (phase !== "idle") { say("A train is already on its way. Wait for the gates to lift."); bubble(VX - 120, 250, "Wait!", "#ffe08a"); return false; }
    kindKey = kindKey || kindChosen();
    phase = "warn"; phaseT = 0; lampT = 0; pending = kindKey;
    setGates(true); scareBirds();
    $("call").setAttribute("aria-disabled", "true"); $("callLabel").textContent = "Train coming…";
    flag("#e5383b", 0);
    rings(76, 250, 3);
    say("Bell ringing. Gates closing for the " + KINDS[kindKey].name.toLowerCase() + ".");
    return true;
  }
  var flagA = 30, flagV = 0, flagTarget = 30;
  function flag(color, up) { $("flagCloth").setAttribute("fill", color); flagTarget = up ? -20 : 30; }
  function stepCrossing(dt, t) {
    phaseT += dt;
    var lit = phase === "warn" || phase === "pass" || (phase === "clear" && phaseT < 0.8);
    if (lit) {
      lampT += dt;
      var on = Math.floor(lampT / 0.45) % 2;
      $("lampA").setAttribute("opacity", on ? 1 : 0.08); $("glowA").setAttribute("opacity", on ? 1 : 0);
      $("lampB").setAttribute("opacity", on ? 0.08 : 1); $("glowB").setAttribute("opacity", on ? 0 : 1);
      $("bell").setAttribute("transform", "translate(0 -102) rotate(" + f1(reduce.matches ? 0 : Math.sin(lampT * 18) * 18) + ")");
      if (Math.random() < dt * 1.6) rings(76, 250, 1);
    } else {
      ["lampA", "lampB", "glowA", "glowB"].forEach(function (id) { $(id).setAttribute("opacity", 0); });
      $("bell").setAttribute("transform", "translate(0 -102)");
    }
    if (phase === "warn" && phaseT > 2.2) {
      phase = "pass"; phaseT = 0; buildTrain(pending);
      if (!reduce.matches) scene.classList.add("rumble");
      flag("#e5383b", 1);
      say(KINDS[pending].name + " passing with " + KINDS[pending].n + (KINDS[pending].wagon ? " wagons." : " coaches."));
    }
    if (phase === "pass" && train) {
      train.x += train.kind.speed * dt;
      if (!train.horned && train.x > 40) { train.horned = true; bubble(Math.min(train.x, 150), 202, train.key === "goods" ? "HOOONK" : "TOOT TOOT", "#fff"); rings(Math.min(train.x, 150), 238, 3); }
      placeTrain(t);
      if (Math.random() < dt * 8 && !reduce.matches) puff(train.x - 60 - rnd(0, 20), 210, 0.8);
      if (train.x - train.len > 420) {
        phase = "clear"; phaseT = 0; train.g.textContent = ""; train = null; trains++; tally();
        scene.classList.remove("rumble");
        flag("#2f9e44", 1);
        say("All clear. Gates lifting.");
      }
    }
    if (phase === "clear") {
      if (phaseT > 0.6 && booms[1].target === 0) { setGates(false); callBirds(); }
      if (phaseT > 1.8) { flag("#e5383b", 0); }
      if (phaseT > 2.6) {
        phase = "idle"; $("call").removeAttribute("aria-disabled"); $("callLabel").textContent = "Call the train";
        var moved = cars.filter(function (c) { return c.waited; }).length;
        say("Gates open. " + (moved ? moved + (moved === 1 ? " vehicle" : " vehicles") + " moving on." : "Traffic is moving."));
        cars.forEach(function (c) { c.waited = false; });
      }
    }
    // gate springs: overshoot a little and settle
    booms.forEach(function (b) {
      if (reduce.matches) { b.a += (b.target - b.a) * Math.min(1, dt * 5); }
      else { b.v += ((b.target - b.a) * 34 - b.v * 6.5) * dt; b.a += b.v * dt; }
      b.arm.setAttribute("transform", "rotate(" + f1(b.a) + ")");
      b.tip.setAttribute("fill", lit && Math.floor(lampT / 0.45) % 2 ? "#ff4a3a" : "#5a1d1a");
    });
    // the keeper's flag swings up and down
    flagV += ((flagTarget - flagA) * 40 - flagV * 7) * dt; flagA += flagV * dt;
    var waveA = flagTarget < 0 && $("flagCloth").getAttribute("fill") === "#2f9e44" && !reduce.matches ? Math.sin(t * 10) * 14 : 0;
    $("flag").setAttribute("transform", "translate(6 -2) rotate(" + f1(flagA + waveA) + ")");
  }
  function tally() { $("tally").textContent = "Trains " + trains + " · Cars waited " + waited; }

  /* ---------- 8. Live clock in the cabin ---------- */
  function clock() {
    var d = new Date(), m = d.getMinutes() + d.getSeconds() / 60, h = (d.getHours() % 12) + m / 60;
    $("hHand").setAttribute("transform", "rotate(" + f1(h * 30) + ")");
    $("mHand").setAttribute("transform", "rotate(" + f1(m * 6) + ")");
  }
  clock(); setInterval(clock, 1000);

  /* ---------- 9. Input: buttons, radios, tapping cars ---------- */
  $("call").addEventListener("click", function () { callTrain(); });
  $("addCar").addEventListener("click", function () {
    var c = addCar();
    if (c) say("A " + (c.type === "bus" ? "minibus" : c.type === "bike" ? "motorbike" : c.type) + " joins the " + (c.side === "near" ? "near" : "far") + " lane.");
    else say("The road is full for now.");
  });
  document.querySelectorAll('input[name="kind"]').forEach(function (r) {
    r.addEventListener("change", function () { say(KINDS[r.value].name + " selected. Press Call the train."); });
  });
  var HONK = { car: "Beep!", rickshaw: "Peep peep!", bike: "Meep!", bus: "Honk!" };
  scene.addEventListener("pointerdown", function (e) {
    var v = e.target.closest && e.target.closest(".veh");
    if (v) {
      var id = +v.getAttribute("data-id");
      for (var i = 0; i < cars.length; i++) if (cars[i].id === id) {
        var c = cars[i], k = c.k || 0.5;
        c.hopV = 90; bubble(VX + (c.side === "near" ? -74 : 74) * k, yAt(k) - (c.type === "bus" ? 70 : 52) * k, HONK[c.type], "#fff");
        say("Honk! The " + (c.type === "bus" ? "minibus" : c.type === "bike" ? "motorbike" : c.type) + " is " + (phase === "idle" ? "on its way." : "waiting for the train."));
        return;
      }
    }
    // tap the cabin or the signal to call a train
    var r = scene.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 400, y = (e.clientY - r.top) / r.height * 500;
    if ((x > 262 && y > 230 && y < 336) || (x < 110 && y > 210 && y < 356)) callTrain();
  });

  /* ---------- 10. Auto demo until the visitor takes over ---------- */
  var demoOn = true, demoTimers = [], demoIdx = 0, DEMO = ["express", "goods", "local"];
  function later(ms, fn) { demoTimers.push(setTimeout(fn, ms)); }
  function demo() {
    if (!demoOn) return;
    if (phase === "idle") {
      var k = DEMO[demoIdx++ % 3];
      var radio = document.querySelector('input[name="kind"][value="' + k + '"]');
      if (radio) radio.checked = true;
      callTrain(k);
    }
    later(phase === "idle" ? 4000 : 1500, function wait() { if (!demoOn) return; if (phase === "idle") later(2600, demo); else later(500, wait); });
  }
  function stopDemo(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false; demoTimers.forEach(clearTimeout);
  }
  ["pointerdown", "keydown", "wheel"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });

  /* ---------- 11. Main loop ---------- */
  var last = performance.now(), carT = 0;
  // a small queue to start with: a rickshaw and a car on the near lane, a minibus coming the other way
  [["near", "car", 1.15], ["far", "bus", 6], ["near", "rickshaw", 1.6]].forEach(function (q) { var pre = addCar(q[0], q[1]); if (pre) pre.d = q[2]; });
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
    stepCrossing(dt, t);
    var shut = phase !== "idle" && !(phase === "clear" && phaseT > 0.9);
    carT -= dt;
    if (carT <= 0) { carT = rnd(2.2, 4.2); if (cars.length < 7) addCar(); }
    stepCars(dt, t, shut);
    stepBirds(dt, t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  later(700, demo);
})();
</script>
</body>
</html>
