<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pack Light · Checkbox group</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --sky-a: #d9f0ec;
    --sky-b: #fdf1d8;
    --route: rgba(15, 118, 110, 0.35);
    --card: #fffaf0;
    --ink: #13302d;
    --muted: #64786f;
    --line: rgba(20, 60, 50, 0.1);
    --teal: #0f8a7e;
    --teal-deep: #0b6159;
    --mustard: #f2b134;
    --leather: #c98b52;
    --leather-dark: #a26a38;
    --leather-light: #dba26c;
    --lining: #f3e2c4;
    --lining-dark: #e2c79c;
    --row: #ffffff;
    --stamp: #d6452f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --sky-a: #0a1c1e;
    --sky-b: #1a1a14;
    --route: rgba(90, 220, 200, 0.3);
    --card: #12272a;
    --ink: #e6f4ef;
    --muted: #8ea9a2;
    --line: rgba(160, 230, 210, 0.12);
    --teal: #2cc6b3;
    --teal-deep: #1b9c8c;
    --mustard: #f5be4c;
    --leather: #b67a45;
    --leather-dark: #8d5a2c;
    --leather-light: #c99260;
    --lining: #3b2f22;
    --lining-dark: #2e241a;
    --row: #183235;
    --stamp: #ff6b55;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--sky-a);
  }

  /* ---------- Stage: a travel map with a little plane on a dotted route ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 26px 16px; overflow: hidden; background: linear-gradient(170deg, var(--sky-a), var(--sky-b)); }
  .map { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .map path { fill: none; stroke: var(--route); stroke-width: 2; stroke-dasharray: 2 9; stroke-linecap: round; }
  .plane { offset-path: path("M -40 220 C 260 40, 620 60, 900 160 S 1400 260, 1700 80"); animation: fly 22s linear infinite; color: var(--teal); }
  @keyframes fly { from { offset-distance: 0%; } to { offset-distance: 100%; } }

  /* ---------- Card ---------- */
  .card { position: relative; width: min(440px, 100%); padding: 16px 18px 18px; border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 34px 70px -40px rgba(10, 60, 50, 0.55); }
  .hero { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6px; }
  .case { display: block; width: 100%; max-width: 270px; height: auto; overflow: visible; }
  .case .lid, .case .cover { transform-box: fill-box; }
  .case .lid { transform-origin: 50% 100%; }
  .case .cover { transform-origin: 50% 0%; transform: scaleY(0); }
  .case .slot { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
  .case .whole { transform-box: fill-box; transform-origin: 50% 100%; }
  .zip { fill: none; stroke: var(--mustard); stroke-width: 2.2; stroke-dasharray: 0 100; }

  .tag { position: relative; width: 116px; margin-bottom: 18px; padding: 12px 12px 10px 18px; border-radius: 6px 14px 14px 6px; background: var(--mustard); color: #3a2a06; transform-origin: 0 50%; transform: rotate(-6deg); animation: swing 4s ease-in-out infinite; }
  @keyframes swing { 50% { transform: rotate(-2deg); } }
  .tag::before { content: ""; position: absolute; left: 6px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--card); }
  .tag small { display: block; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.12em; opacity: 0.7; }
  .tag b { display: block; font-size: 1.02rem; letter-spacing: 0.02em; }
  .tag span { display: block; margin-top: 2px; font-size: 0.72rem; font-weight: 650; }
  .stampmark { position: absolute; right: -10px; top: -14px; padding: 3px 8px; border: 2.5px solid var(--stamp); border-radius: 6px; color: var(--stamp); font-weight: 900; font-size: 0.72rem; letter-spacing: 0.14em; transform: rotate(14deg); opacity: 0; background: color-mix(in srgb, var(--card) 60%, transparent); }

  .bar { position: relative; height: 8px; margin: 12px 0 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--mustard)); transform-origin: left; transform: scaleX(0); }
  .count { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--muted); font-weight: 600; }

  /* ---------- Checkboxes ---------- */
  fieldset { margin: 10px 0 0; padding: 0; border: 0; }
  legend { padding: 0; }
  .list { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 6px; margin-top: 6px; }
  .item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 10px; border-radius: 14px; background: var(--row); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.25s; }
  .item:hover { background: color-mix(in srgb, var(--teal) 7%, var(--row)); }
  .item.master { background: transparent; box-shadow: none; padding-left: 4px; min-height: 36px; }
  .item input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .box { position: relative; width: 22px; height: 22px; flex: none; border-radius: 7px; border: 2px solid color-mix(in srgb, var(--ink) 30%, transparent); background: var(--card); transition: background 0.2s, border-color 0.2s; }
  .box svg { position: absolute; inset: -2px; width: 22px; height: 22px; overflow: visible; }
  .box .tick { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset 0.32s 0.08s cubic-bezier(0.4, 0, 0.2, 1); }
  .box .dash { stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .item input:checked + .box { background: var(--teal); border-color: var(--teal); }
  .item input:checked + .box .tick { stroke-dashoffset: 0; }
  .item.mixed .box { background: var(--teal); border-color: var(--teal); }
  .item.mixed .box .dash { opacity: 1; }
  .item input:focus-visible + .box { outline: 3px solid var(--mustard); outline-offset: 3px; }
  .icon { width: 26px; height: 26px; flex: none; transition: opacity 0.3s, filter 0.3s; }
  .item.packed .icon { opacity: 0.32; filter: grayscale(1); }
  .name { position: relative; font-size: 0.88rem; font-weight: 650; white-space: nowrap; transition: color 0.3s; }
  .name::after { content: ""; position: absolute; left: -2px; right: -2px; top: 54%; height: 2px; border-radius: 2px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform 0.35s 0.15s cubic-bezier(0.5, 0, 0.2, 1); }
  .item input:checked ~ .name { color: var(--muted); }
  .item input:checked ~ .name::after { transform: scaleX(1); }
  .item.master .name { font-weight: 750; }
  .item.master .name::after { display: none; }
  .fly { position: absolute; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; z-index: 5; }
  .puff { position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--leather-light) 70%, transparent); pointer-events: none; z-index: 5; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 400px) {
    .tag { width: 100px; padding: 10px 10px 8px 16px; }
    .tag b { font-size: 0.92rem; }
  }
  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.3; } }
  @media (prefers-reduced-motion: reduce) {
    .plane, .tag { animation: none; }
    .box, .box .tick, .name::after, .item, .icon { transition: none; }
  }
</style>

<script>
  // Pack Light: a checkbox group that packs a suitcase.
  // Tick = the box squashes (anticipation) → the tick draws and the item's icon jumps along an arc into the
  // suitcase (main) → it lands with a bounce, the case wobbles, the bar and tag count up (progress) → when all six
  // are in, the lid shuts, the zip runs round and a READY stamp thumps onto the tag (finish). Untick flies it back.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var card = $("card"), master = $("master"), masterRow = $("master-row"), status = $("status");
    var boxes = [].slice.call(document.querySelectorAll("#list input"));
    var slots = [].slice.call(document.querySelectorAll("#slots .slot"));
    var lid = $("lid"), cover = $("cover"), whole = $("whole"), zip = $("zip"), pull = $("pull"), stamp = $("stamp"), fill = $("fill");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var NAMES = ["Passport", "Charger", "Warm jacket", "Sunglasses", "Water bottle", "Road snacks"];
    var closed = false, lidRun = 0;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function rel(el) { var a = el.getBoundingClientRect(), c = card.getBoundingClientRect(), k = c.width / card.offsetWidth || 1; return { x: (a.left - c.left) / k, y: (a.top - c.top) / k, w: a.width / k, h: a.height / k }; }
    function springFrames(frame, stiff, damp) {
      var x = 0, v = 0, out = [];
      for (var n = 0; n < 50; n++) { out.push(frame(x)); v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; }
      out.push(frame(1));
      return out;
    }
    function packed() { return boxes.filter(function (b) { return b.checked; }).length; }

    // ---------- Progress: bar, counter, tag and the tri-state "Pack everything" box ----------
    var shown = 0;
    function progress() {
      var n = packed();
      master.checked = n === boxes.length;
      master.indeterminate = n > 0 && n < boxes.length;
      masterRow.classList.toggle("mixed", master.indeterminate);
      $("count").textContent = n + " / " + boxes.length;
      $("tagline").textContent = n === boxes.length ? "All packed" : n + " of " + boxes.length + " packed";
      var from = shown / boxes.length, to = n / boxes.length;
      shown = n;
      fill.style.transform = "scaleX(" + to + ")";
      if (!calm.matches) fill.animate(springFrames(function (p) { return { transform: "scaleX(" + (from + (to - from) * p).toFixed(4) + ")" }; }, 170, 12), { duration: 850, easing: "linear" });
    }

    // ---------- Flights between the list and the suitcase ----------
    function arc(a, b, lift) {
      var c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift };
      return function (t) { var u = 1 - t; return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }; };
    }
    function flight(i, into) {
      var row = boxes[i].closest(".item"), icon = row.querySelector(".icon"), slot = slots[[0, 3, 1, 2, 4, 5][i]];
      var A = rel(icon), B = rel(slot);
      var from = into ? A : B, to = into ? B : A;
      var ghost = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      ghost.setAttribute("class", "fly");
      ghost.innerHTML = '<use href="#i' + i + '" />';
      card.appendChild(ghost);
      var path = arc({ x: from.x + from.w / 2, y: from.y + from.h / 2 }, { x: to.x + to.w / 2, y: to.y + to.h / 2 }, 70);
      var frames = [];
      for (var k = 0; k <= 18; k++) {
        var t = k / 18, p = path(t), size = from.w + (to.w - from.w) * t;
        var sc = (size / 26) * (1 + Math.sin(t * Math.PI) * 0.25);
        frames.push({ transform: "translate(" + (p.x - 13).toFixed(1) + "px," + (p.y - 13).toFixed(1) + "px) rotate(" + ((into ? 1 : -1) * 360 * t).toFixed(0) + "deg) scale(" + sc.toFixed(3) + ")" });
      }
      if (into) icon.style.opacity = ""; else { slot.style.opacity = "0"; icon.style.visibility = "hidden"; }
      var anim = ghost.animate(frames, { duration: 560, easing: "cubic-bezier(0.4, 0, 0.3, 1)", fill: "forwards" });
      return anim.finished.then(function () {
        ghost.remove();
        if (into) {
          if (!boxes[i].checked) return;
          slot.style.opacity = "1";
          slot.animate([{ transform: "scale(1.35, 0.6)" }, { transform: "scale(0.9, 1.15)", offset: 0.4 }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
          whole.animate([{ transform: "rotate(0)" }, { transform: "rotate(-1.6deg)" }, { transform: "rotate(1deg)" }, { transform: "rotate(0)" }], { duration: 380, easing: "ease-out" });
        } else {
          icon.style.visibility = "";
          icon.animate([{ transform: "scale(0.5)" }, { transform: "scale(1.25)", offset: 0.5 }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
        }
      }).catch(function () { ghost.remove(); icon.style.visibility = ""; });
    }

    // ---------- Lid ----------
    async function closeLid() {
      var id = ++lidRun;
      closed = true;
      status.textContent = "All packed. Ready for Skardu.";
      if (calm.matches) { lid.style.opacity = "0"; cover.style.transform = "scaleY(1)"; zip.style.strokeDasharray = "100 0"; stamp.style.opacity = "1"; return; }
      await lid.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(0)" }], { duration: 200, easing: "ease-in", fill: "forwards" }).finished.catch(function () {});
      if (id !== lidRun) return;
      cover.style.transform = "scaleY(1)";
      cover.animate(springFrames(function (p) { return { transform: "scaleY(" + p.toFixed(3) + ")" }; }, 300, 13), { duration: 840, easing: "linear" });
      whole.animate([{ transform: "translateY(0) scale(1)" }, { transform: "translateY(3px) scale(1.03, 0.96)", offset: 0.3 }, { transform: "translateY(-6px) scale(0.98, 1.03)", offset: 0.6 }, { transform: "none" }], { duration: 520, delay: 120, easing: "ease-out" });
      puffs();
      await wait(260);
      if (id !== lidRun) return;
      // the zip runs round the case
      zip.animate([{ strokeDasharray: "0 100" }, { strokeDasharray: "100 0" }], { duration: 700, easing: "ease-in-out", fill: "forwards" });
      var len = 182 * 2 + 66 * 2, pts = [[44, 86], [226, 86], [226, 152], [44, 152], [44, 86]];
      pull.animate(pts.map(function (q) { return { transform: "translate(" + (q[0] - 44) + "px," + (q[1] - 86) + "px)" }; }), { duration: 700, easing: "ease-in-out", fill: "forwards" });
      await wait(720);
      if (id !== lidRun) return;
      stamp.style.opacity = "1";
      stamp.animate([{ transform: "rotate(30deg) scale(2.4)", opacity: 0 }, { transform: "rotate(10deg) scale(0.9)", opacity: 1, offset: 0.6 }, { transform: "rotate(14deg) scale(1)", opacity: 1 }], { duration: 380, easing: "cubic-bezier(0.5, 0, 0.6, 1.4)" });
      $("tag").animate([{ transform: "rotate(-6deg)" }, { transform: "rotate(-11deg) translateY(2px)" }, { transform: "rotate(-6deg)" }], { duration: 360, delay: 200, easing: "ease-out" });
      return len;
    }
    function openLid() {
      lidRun++;
      closed = false;
      [lid, cover, zip, pull, stamp].forEach(function (el) { el.getAnimations().forEach(function (a) { a.cancel(); }); });
      stamp.style.opacity = "0";
      zip.style.strokeDasharray = "";
      lid.style.opacity = "";
      if (calm.matches) { cover.style.transform = "scaleY(0)"; return; }
      cover.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(0)" }], { duration: 180, easing: "ease-in" });
      cover.style.transform = "scaleY(0)";
      lid.animate(springFrames(function (p) { return { transform: "scaleY(" + p.toFixed(3) + ")" }; }, 260, 12), { duration: 840, delay: 140, easing: "linear", fill: "backwards" });
    }
    function puffs() {
      var c = rel($("case"));
      [0.18, 0.82].forEach(function (fx, k) {
        for (var n = 0; n < 4; n++) {
          var p = document.createElement("i");
          p.className = "puff";
          card.appendChild(p);
          var x = c.x + c.w * fx, y = c.y + c.h * 0.93, dir = k ? 1 : -1;
          p.animate([{ transform: "translate(" + x + "px," + y + "px) scale(0.3)", opacity: 0.9 }, { transform: "translate(" + (x + dir * (16 + n * 9)) + "px," + (y - 8 - n * 3) + "px) scale(" + (1.3 - n * 0.15) + ")", opacity: 0 }], { duration: 520 + n * 60, delay: 100, easing: "ease-out", fill: "backwards" })
            .finished.then((function (e) { return function () { e.remove(); }; })(p)).catch(function () {});
        }
      });
    }

    // ---------- Changes ----------
    function changed(i, quiet) {
      var b = boxes[i], row = b.closest(".item");
      row.classList.toggle("packed", b.checked);
      if (!quiet) status.textContent = NAMES[i] + (b.checked ? " packed. " : " taken out. ") + packed() + " of " + boxes.length + " packed.";
      progress();
      if (calm.matches) {
        slots[[0, 3, 1, 2, 4, 5][i]].style.opacity = b.checked ? "1" : "0";
        if (packed() === boxes.length) closeLid(); else if (closed) openLid();
        return Promise.resolve();
      }
      row.querySelector(".box").animate([{ transform: "scale(1)" }, { transform: "scale(0.8)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 340, easing: "ease-out" });
      if (!b.checked && closed) openLid();
      var f = flight(i, b.checked);
      if (b.checked) f.then(function () { if (packed() === boxes.length && !closed) closeLid(); });
      return f;
    }
    boxes.forEach(function (b, i) { b.addEventListener("change", function () { changed(i); }); });
    master.addEventListener("change", function () { setAll(master.checked); });
    async function setAll(on) {
      var list = boxes.map(function (b, i) { return i; }).filter(function (i) { return boxes[i].checked !== on; });
      if (!on) list.reverse();
      status.textContent = on ? "Packing everything." : "Unpacking everything.";
      for (var k = 0; k < list.length; k++) {
        boxes[list[k]].checked = on;
        changed(list[k], true);
        if (!calm.matches) await wait(130);
      }
      status.textContent = on ? "All packed. Ready for Skardu." : "Everything unpacked. 0 of 6 packed.";
    }

    // ---------- Auto demo: tick items one by one, close the case, unpack, repeat ----------
    var demoOn = !calm.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(function () { if (demoOn) fn(); }, ms)); }
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; timers.forEach(clearTimeout); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function demo() {
      [0, 2, 1, 4, 3, 5].forEach(function (i, k) {
        later(function () { if (!boxes[i].checked) { boxes[i].checked = true; changed(i); } }, k * 480);
      });
      later(function () { master.checked = false; setAll(false); }, 6000);
      later(demo, 8000);
    }
    progress();
    if (demoOn) later(demo, 360);
  })();
