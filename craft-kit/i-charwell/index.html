<!doctype html>
<!-- Chill & Craft · Charwell · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charwell · Oak and charcoal grill on Harbour Row</title>
<meta name="description" content="Charwell is a demo website for a modern grill restaurant: menu, table booking with a live seat map, online order, private events, reviews and opening hours.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: charcoal and ember on cream (light) / ember on charcoal (dark) ---------- */
  :root {
    --bg: #f3ebdd; --bg-2: #ebdfcb; --paper: #fbf7f0; --paper-2: #f4ece0; --ink: #1d1915; --ink-2: #3b332b; --muted: #76695c;
    --line: rgba(45,30,15,.13); --line-2: rgba(45,30,15,.24);
    --ember: #d6531a; --ember-2: #f0913f; --ember-ink: #fff; --ember-soft: #f6dcc6; --ember-text: #b5430f;
    --char: #1c1815; --char-2: #29231e; --char-ink: #f6ecdd; --char-muted: #b9a995; --char-line: rgba(255,236,210,.12);
    --veg: #45763a; --hot: #c4381f; --good: #3b7a45; --bad: #c0392b; --warn: #b8730f;
    --shadow: 0 22px 44px -26px rgba(50,28,8,.5); --shadow-sm: 0 8px 18px -12px rgba(50,28,8,.45);
    --radius: 16px; --radius-sm: 10px;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --cond: "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif-condensed, "Inter", ui-sans-serif, system-ui, sans-serif;
    --tip-bg: #1d1915; --tip-ink: #f6ecdd; --overlay: rgba(28,18,10,.48);
    --map-water: #cfd9d6; --map-road: #fffaf2; --map-block: #e6dac6; --map-park: #d4dcbf;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #12100e; --bg-2: #1a1613; --paper: #1d1916; --paper-2: #25201b; --ink: #f3e9db; --ink-2: #dacdbc; --muted: #a5978a;
    --line: rgba(255,236,210,.1); --line-2: rgba(255,236,210,.2);
    --ember: #ff7433; --ember-2: #ffa45c; --ember-ink: #1a0c04; --ember-soft: rgba(255,116,51,.17); --ember-text: #ff9a5e;
    --char: #0b0908; --char-2: #1b1613; --char-ink: #f6ecdd; --char-muted: #ad9d8a; --char-line: rgba(255,236,210,.09);
    --veg: #93c477; --hot: #ff6d4f; --good: #7cc48a; --bad: #ff7d6e; --warn: #f1b04d;
    --shadow: 0 24px 48px -26px rgba(0,0,0,.8); --shadow-sm: 0 8px 18px -12px rgba(0,0,0,.7);
    --tip-bg: #f6ecdd; --tip-ink: #1d1915; --overlay: rgba(0,0,0,.6);
    --map-water: #1c2a2c; --map-road: #2c2620; --map-block: #1f1a16; --map-park: #1e2519;
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
  body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sans); min-height: 100vh; transition: background .3s, color .3s; }
  html.lock body { overflow: hidden; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, h4 { margin: 0; }
  p { margin: 0; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .disp { font-family: var(--cond); font-stretch: condensed; font-weight: 800; text-transform: uppercase; letter-spacing: -.005em; line-height: .9; }
  .kick { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ember-text); font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
  .kick::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 25%, transparent); }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1408px; margin: 0 auto; padding: 0 16px; }
  .cc-av { --h: 20; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: 12px; font-weight: 700; color: hsl(var(--h) 45% 24%); background: hsl(var(--h) 55% 84%); flex: none; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 70% 88%); background: hsl(var(--h) 30% 26%); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink); font-weight: 650; font-size: 12.5px; letter-spacing: .02em; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s, color .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--ember); border-color: transparent; color: var(--ember-ink); }
  .btn.primary:hover { box-shadow: 0 10px 24px -10px var(--ember); filter: brightness(1.05); }
  .btn.dark { background: var(--ink); color: var(--bg); border-color: transparent; }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { border-color: transparent; }
  .btn.ghost:hover { background: var(--paper-2); }
  .btn.sm { min-height: 30px; padding: 0 12px; font-size: 12px; }
  .btn.lg { min-height: 46px; padding: 0 22px; font-size: 13.5px; }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); position: relative; transition: border-color .2s, transform .12s; }
  .icon-btn:hover { border-color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn .ic { width: 17px; height: 17px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ember); color: var(--ember-ink); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; }
  .badge:empty, .badge[data-n="0"] { display: none; }
  .badge.bump { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 40% { transform: scale(1.5); } }

  /* ---------- Chips, tags, segmented ---------- */
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 600; transition: background .2s, color .2s, border-color .2s; white-space: nowrap; }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip .ic { width: 14px; height: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; background: var(--paper-2); color: var(--ink-2); white-space: nowrap; }
  .tag .ic { width: 12px; height: 12px; }
  .tag.veg { color: var(--veg); background: color-mix(in srgb, var(--veg) 13%, transparent); }
  .tag.hot { color: var(--hot); background: color-mix(in srgb, var(--hot) 12%, transparent); }
  .tag.share { color: var(--ember-text); background: var(--ember-soft); }
  .tag.gf { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); }
  .seg button { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font-weight: 650; font-size: 12.5px; color: var(--muted); transition: color .25s; }
  .seg button[aria-pressed="true"] { color: var(--ember-ink); }
  .seg .mk { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--ember); transition: transform .35s cubic-bezier(.3,1.2,.4,1), width .35s cubic-bezier(.3,1.2,.4,1); }
  .stars { display: inline-flex; gap: 1px; color: var(--ember); }
  .stars .ic { width: 13px; height: 13px; fill: currentColor; stroke-width: 1; }
  .stars .ic.off { fill: none; opacity: .45; }

  /* ---------- Toasts ---------- */
  .cc-toasts { position: fixed; z-index: 95; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--tip-bg); color: var(--tip-ink); box-shadow: 0 14px 34px -12px rgba(0,0,0,.5); font-size: 12.5px; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--ember-2); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* ---------- Dialogs and drawers ---------- */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.55); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(780px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-dh { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
  .cc-dh h2 { flex: 1; font-size: 16px; }
  .cc-x { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); }
  .cc-x:hover { border-color: var(--ink); }
  .cc-db { padding: 14px 18px 18px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; flex-wrap: wrap; }
  .is-drawer { place-items: stretch end; padding: 0; }
  .is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: 22px 0 0 22px; transform: translateX(60px); display: flex; flex-direction: column; border-right: 0; }
  .is-drawer .cc-db { flex: 1; overflow: auto; }
  .is-drawer .cc-df { border-top: 1px solid var(--line); padding-top: 14px; }
  .nodh .cc-dh { position: absolute; right: 12px; top: 12px; z-index: 3; padding: 0; }
  .nodh .cc-dh h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .nodh .cc-db { padding: 0; }

  /* ---------- Forms ---------- */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field { display: grid; gap: 5px; grid-column: span 2; align-content: start; }
  .field.half { grid-column: span 1; }
  .field label, .lbl { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .field input, .field select, .field textarea, .inp { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); }
  .field textarea { min-height: 76px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 22%, transparent); }
  .field [aria-invalid="true"] { border-color: var(--bad); }
  .err { color: var(--bad); font-size: 11.5px; }
  .err:empty { display: none; }
  .hint { color: var(--muted); font-size: 11.5px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .check input { width: 16px; height: 16px; accent-color: var(--ember); }
  form.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: var(--paper); }
  .stepper button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; }
  .stepper button:hover { background: var(--paper-2); }
  .stepper output { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stepper .ic { width: 14px; height: 14px; }

  /* ---------- Command search ---------- */
  .cmdk .cc-dialog { align-self: start; margin-top: 10vh; width: min(560px, 100%); }
  .cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ember); background: var(--paper-2); font-size: 14px; }
  .cmdk-q:focus { outline: none; }
  .cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
  .cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; cursor: pointer; }
  .cmdk-list li[aria-selected="true"], .cmdk-list li:hover { background: var(--paper-2); color: var(--ember-text); }
  .cmdk-list small { margin-left: auto; color: var(--muted); }
  .cmdk-foot { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  kbd { padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); font: inherit; font-size: 11px; }

  /* ---------- Skeleton shimmer ---------- */
  .sk { border-radius: 12px; background: linear-gradient(100deg, var(--paper-2) 30%, var(--paper) 50%, var(--paper-2) 70%) 0 0 / 300% 100%; animation: shimmer 1s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  .sk-page { max-width: 1408px; margin: 0 auto; padding: 22px 16px; display: grid; gap: 16px; }
  .sk-row { display: grid; gap: 16px; }

  /* ---------- Header ---------- */
  .top { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .25s, background .3s; animation: dropIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .top.scrolled { border-bottom-color: var(--line); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-14px); } }
  .top-in { max-width: 1440px; margin: 0 auto; height: 64px; padding: 0 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .logo { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
  .logo svg { width: 26px; height: 26px; }
  .logo b { font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: 25px; letter-spacing: .2em; margin-right: -.2em; }
  .nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .nav-l { grid-column: 1; grid-row: 1; }
  .nav-r { grid-column: 3; grid-row: 1; justify-content: flex-end; gap: 6px; }
  .nav a.nl { position: relative; padding: 8px 11px; border-radius: 999px; font-weight: 650; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: color .2s, background .2s; }
  .nav a.nl:hover { background: var(--paper-2); color: var(--ink); }
  .nav a.nl[aria-current="page"] { color: var(--ember-text); }
  .nav a.nl[aria-current="page"]::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ember); animation: ccPop .35s both; }
  .open-pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 11.5px; font-weight: 650; white-space: nowrap; color: var(--ink-2); }
  .open-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: live 2s infinite; }
  .open-pill.shut i { background: var(--muted); animation: none; }
  @keyframes live { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .t-sun, .t-moon { display: contents; }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .menu-btn, .tabbar { display: none; }

  /* Mobile nav drawer */
  .mnav { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
  .mnav .scrim { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .25s; }
  .mnav .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 86vw); background: var(--paper); padding: 18px; transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .mnav .sheet a.nl { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; text-decoration: none; font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: 26px; text-transform: uppercase; }
  .mnav .sheet a.nl[aria-current="page"] { color: var(--ember-text); background: var(--paper-2); }
  html.nav-open .mnav { pointer-events: auto; }
  html.nav-open .mnav .scrim { opacity: 1; }
  html.nav-open .mnav .sheet { transform: none; }

  /* ---------- Page transition ---------- */
  #view { min-height: 70vh; }
  #view.leave { opacity: 0; transform: translateY(8px); transition: opacity .14s, transform .14s; }
  .cc-in { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---------- Home: hero with the dish reel and drifting embers ---------- */
  .hero { position: relative; margin: 4px 16px 0; border-radius: 26px; background: var(--char); color: var(--char-ink); overflow: hidden; height: calc(100svh - 72px); min-height: 640px; max-height: 880px; display: grid; grid-template-rows: auto auto 1fr auto; isolation: isolate; }
  [data-theme="dark"] .hero { box-shadow: inset 0 0 0 1px var(--char-line); }
  .hero::before { content: ""; position: absolute; left: -15%; right: -15%; bottom: -55%; height: 95%; background: radial-gradient(closest-side, rgba(240,112,40,.5), rgba(196,70,22,.2) 55%, transparent); z-index: -2; animation: coal 4.5s ease-in-out infinite alternate; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--char-line) 1px, transparent 1px) 0 0 / calc(100% / 6) 100%; z-index: -2; mask-image: linear-gradient(180deg, #000 0%, transparent 85%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 85%); }
  @keyframes coal { from { opacity: .75; transform: scale(1); } to { opacity: 1; transform: scale(1.06); } }
  .embers { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 30px 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--char-muted); font-weight: 650; }
  .hero-top span { display: inline-flex; align-items: center; gap: 8px; }
  .hero-top .live-seats b { color: var(--char-ink); font-variant-numeric: tabular-nums; }
  .hero-top .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ember-2); box-shadow: 0 0 12px var(--ember-2); animation: flick 1.6s infinite alternate; }
  @keyframes flick { 30% { opacity: .55; } 60% { opacity: 1; } 80% { opacity: .75; } }
  .hero-head { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; align-items: end; padding: 14px 30px 0; }
  .hero h1 { font-size: clamp(50px, 8.3vw, 128px); color: var(--char-ink); white-space: nowrap; }
  .hero h1 .ln { display: block; overflow: hidden; padding-bottom: .04em; }
  .hero h1 .ln > span { display: inline-block; animation: lineUp .9s cubic-bezier(.2,.8,.2,1) both; }
  .hero h1 .ln:nth-child(2) > span { animation-delay: .12s; }
  .hero h1 em { font-style: normal; color: var(--ember-2); }
  .hero h1 sup { font-family: var(--sans); font-size: 12px; letter-spacing: .14em; font-weight: 650; vertical-align: top; position: relative; top: 1.1em; margin-left: 14px; color: var(--char-muted); }
  @keyframes lineUp { from { transform: translateY(105%); } }
  .hero-side { display: grid; gap: 14px; padding-bottom: 10px; animation: rise .8s .3s cubic-bezier(.2,.8,.2,1) both; }

  .slot small { font-size: 9.5px; font-weight: 650; color: var(--ember-text); }

  .zones { display: flex; gap: 6px; flex-wrap: wrap; }
  .bk-r { position: sticky; top: 76px; display: grid; gap: 14px; }

  .legend i.h { border-color: var(--ember); border-style: dashed; }
  .legend i.m { background: var(--ember); border-color: var(--ember); }

  .fl-wall { fill: var(--paper-2); stroke: var(--line-2); stroke-width: 1.5; }

  .tb { cursor: pointer; outline: none; }

  .tb:hover .top-s, .tb:focus-visible .top-s { stroke: var(--ember); stroke-width: 2.2; }
  .tb.taken .top-s { fill: color-mix(in srgb, var(--ink) 34%, var(--paper-2)); stroke: color-mix(in srgb, var(--ink) 45%, var(--paper-2)); }
  .tb.taken .seat { fill: color-mix(in srgb, var(--ink) 34%, var(--paper-2)); stroke: transparent; }

  .map-f { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }

  .ticket .tk .code { font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: 40px; letter-spacing: .04em; color: var(--ember-2); line-height: 1; }
  .ticket .tk dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; margin: 0; }
  .ticket .tk dt { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--char-muted); }
  .ticket .tk dd { margin: 0; font-weight: 700; font-size: 14px; }
  /* ---------- Order online ---------- */

/* ---------- Toasts ---------- */
function toast(msg, icon = "check") {
  let box = $("#cc-toasts");
  if (!box) { box = document.createElement("div"); box.id = "cc-toasts"; box.className = "cc-toasts"; box.setAttribute("role", "status"); box.setAttribute("aria-live", "polite"); document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "cc-toast";
  t.innerHTML = ic(icon) + "<span>" + esc(msg) + "</span>";
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 2600);
}

/* ---------- Dialogs and drawers: focus trap, Esc and backdrop close ---------- */
const modals = [];
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function openModal({ title, html = "", drawer = false, wide = false, actions = null, onOpen = null, onClose = null, cls = "" }) {
  const prev = document.activeElement;
  const id = "dlg-" + uid();
  const wrap = document.createElement("div");
  wrap.className = "cc-overlay" + (drawer ? " is-drawer" : "") + (cls ? " " + cls : "");
  wrap.innerHTML = `<div class="cc-back" data-close></div>
    <div class="cc-dialog${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1">
      <header class="cc-dh"><h2 id="${id}">${esc(title)}</h2><button type="button" class="cc-x" data-close aria-label="Close">${ic("x")}</button></header>
      <div class="cc-db">${html}</div>${actions ? '<footer class="cc-df"></footer>' : ""}
    </div>`;
  const dlg = $(".cc-dialog", wrap);
  let closed = false;
  const api = { el: dlg, body: $(".cc-db", wrap), foot: $(".cc-df", wrap), wrap, close, setTitle: (t) => ($("#" + id, wrap).textContent = t) };
  function close(v) {
    if (closed) return;
    closed = true;
    wrap.classList.remove("open");
    const i = modals.indexOf(api);
    if (i > -1) modals.splice(i, 1);
    if (!modals.length) document.documentElement.classList.remove("lock");
    setTimeout(() => wrap.remove(), 320);
    if (prev && prev.focus) prev.focus({ preventScroll: true });
    if (onClose) onClose(v);
  }
  if (actions) actions.forEach((a) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn " + (a.kind || "ghost"); b.textContent = a.label;
    b.addEventListener("click", () => (a.run ? a.run(api) : close()));
    api.foot.appendChild(b);
  });
  wrap.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
  wrap.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = $$(FOCUSABLE, dlg).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  document.body.appendChild(wrap);
  modals.push(api);
  document.documentElement.classList.add("lock");
  if (onOpen) onOpen(api);
  requestAnimationFrame(() => {
    wrap.classList.add("open");
    const f = $("[autofocus]", dlg) || $$(FOCUSABLE, dlg).find((x) => !x.classList.contains("cc-x")) || dlg;
    f.focus({ preventScroll: true });
  });
  return api;
}
function confirmBox(msg, ok = "Confirm", danger = true) {
  return new Promise((res) => {
    let val = false;
    openModal({ title: "Please confirm", html: `<p class="muted" style="font-size:13.5px">${esc(msg)}</p>`, onClose: () => res(val),
      actions: [{ label: "Cancel" }, { label: ok, kind: danger ? "danger" : "primary", run: (m) => { val = true; m.close(); } }] });
  });
}

/* ---------- Form validation: rules return an error string or "" ---------- */
function validate(form, rules) {
  let ok = true, first = null;
  Object.entries(rules).forEach(([name, rule]) => {
    const el = form.elements[name];
    if (!el) return;
    const msg = rule(String(el.value || "").trim(), el);
    const err = $(`[data-err="${name}"]`, form);
    el.setAttribute("aria-invalid", msg ? "true" : "false");
    if (err) err.textContent = msg;
    if (msg && !first) first = el;
    if (msg) ok = false;
  });
  if (!ok) { form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake"); if (first) first.focus(); }
  return ok;
}

/* =====================================================================

   ===================================================================== */
const EMB = { raf: 0, ps: [], cv: null, ctx: null, w: 0, h: 0 };
function sizeEmbers() {
  if (!EMB.cv) return;
  const r = EMB.cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  EMB.w = r.width; EMB.h = r.height;
  EMB.cv.width = Math.round(r.width * dpr); EMB.cv.height = Math.round(r.height * dpr);
  EMB.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function spark(any) {
  return { x: Math.random() * EMB.w, y: any ? EMB.h * (0.25 + Math.random() * 0.75) : EMB.h + 8, r: 0.7 + Math.random() * 2.2, vy: 0.3 + Math.random() * 1.05, vx: (Math.random() - 0.5) * 0.5, ph: Math.random() * 6.28, life: any ? Math.random() * 200 : 0, max: 260 + Math.random() * 320, hue: 16 + Math.random() * 24 };

function drawEmbers(dt) {

  c.globalCompositeOperation = "lighter";
  for (const p of EMB.ps) {
    p.life += dt; p.y -= p.vy * dt; p.x += (p.vx + Math.sin(t * 1.2 + p.ph) * 0.35) * dt;
    const k = p.life / p.max;
    if (p.y < -12 || k >= 1) { Object.assign(p, spark(false)); continue; }
    const a = Math.min(1, p.life / 25) * (1 - k) * (0.55 + 0.45 * Math.sin(t * 8 + p.ph * 3));
    c.fillStyle = `hsla(${p.hue},100%,55%,${(a * 0.16).toFixed(3)})`;
    c.beginPath(); c.arc(p.x, p.y, p.r * 4.2, 0, 6.283); c.fill();
    c.fillStyle = `hsla(${p.hue + 12},100%,${(64 + k * 14).toFixed(0)}%,${a.toFixed(3)})`;
    c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
  }
}

    const dt = Math.min(50, now - last) / 16.7; last = now;

  <div class="wordmark" aria-hidden="true"><span>CHARWELL</span><i></i></div>
  <div class="foot-b"><span>© 2026 Charwell. A demo website: the dishes, people and prices are made up. Photos: CC0, Wikimedia Commons.</span><div class="row"><button class="btn sm line" type="button" data-theme-toggle>${ic("moon")}Theme</button><button class="btn sm line" type="button" data-cmdk>${ic("search")}Search · Ctrl K</button><button class="btn sm line" type="button" id="resetDemo">${ic("refresh")}Reset demo data</button></div></div>`;
  const nf = $("#news");
  nf.addEventListener("submit", (e) => { e.preventDefault(); if (!validate(nf, { email: isEmail })) return; S.news = nf.elements.email.value.trim(); save(); toast("You are on the list for Fire notes", "mail"); });
}
function cmdk() {
  if (modals.length) return;
  const items = [
    ...PAGES.map((p) => ({ l: p === "home" ? "Home" : TITLES[p], h: "Page", i: "arrowR", run: () => (location.hash = "#/" + p) })),
    { l: "Open your order", h: cartCount() + " in your bag", i: "bag", run: openCart },
    { l: "Switch light or dark theme", h: "Action", i: "moon", run: () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark") },
    { l: "Reset demo data", h: "Action", i: "refresh", run: resetDemo },
    ...DISHES.map((d) => ({ l: d.name, h: money(d.price) + " · " + catName(d.cat), i: CAT_IC[d.cat], run: () => openDish(d.id) })),
  ];
  let sel = 0, shown = items;
  const m = openModal({ title: "Search Charwell", cls: "cmdk", html: `<input class="cmdk-q" type="search" placeholder="Search dishes, pages and actions" aria-label="Search dishes, pages and actions" autofocus><ul class="cmdk-list" role="listbox" aria-label="Results"></ul><p class="cmdk-foot"><kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close</p>` });
  const q = $(".cmdk-q", m.el), ul = $(".cmdk-list", m.el);
  const draw = () => {
    ul.innerHTML = shown.length ? shown.slice(0, 40).map((it, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel}">${ic(it.i)}<span>${esc(it.l)}</span><small>${esc(it.h)}</small></li>`).join("") : `<li class="muted" aria-disabled="true">Nothing found. Try “burger” or “events”.</li>`;
    const a = $('[aria-selected="true"]', ul); if (a && a.scrollIntoView) a.scrollIntoView({ block: "nearest" });
  };
  const run = (it) => { m.close(); setTimeout(() => it.run(), 60); };
  q.addEventListener("input", () => { const s = q.value.trim().toLowerCase(); shown = items.filter((it) => (it.l + " " + it.h).toLowerCase().includes(s)); sel = 0; draw(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && shown[sel]) { e.preventDefault(); run(shown[sel]); }
  });
  ul.addEventListener("click", (e) => { const li = e.target.closest("[data-i]"); if (li) run(shown[+li.dataset.i]); });
  draw();
}
function resetDemo() {
  confirmBox("Reset all demo data? Your bag, bookings, orders, enquiries, reviews and favourites go back to the starting example.", "Reset demo data").then((ok) => {
    if (!ok) return;
    store.del(KEY); S = seed(); save(); LIVE_RV.length = 0;
    updateBadge(); toast("Demo data reset", "refresh");
    $("#news").elements.email.value = "";
    renderPage(true);
  });
}

/* ---------- Global events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-theme-toggle]"))) { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); return; }
  if ((el = t.closest("[data-cmdk]"))) { closeNav(); cmdk(); return; }
  if ((el = t.closest("[data-cart], [data-checkout]"))) { openCart(); return; }
  if ((el = t.closest("[data-menu]"))) { toggleNav(); return; }
  if ((el = t.closest("[data-scrim]"))) { closeNav(); return; }
  if ((el = t.closest(".mnav a"))) { closeNav(); return; }
  if ((el = t.closest("[data-add]"))) { addToCart(el.dataset.add, 1, el); return; }
  if ((el = t.closest("[data-set]"))) { setQty(el.dataset.set, inCart(el.dataset.set) + +el.dataset.d); return; }
  if ((el = t.closest("[data-rm]"))) { setQty(el.dataset.rm, 0); toast("Removed from your order", "trash"); return; }
  if ((el = t.closest("[data-fav]"))) { toggleFav(el.dataset.fav); return; }
  if ((el = t.closest("[data-dish]"))) { openDish(el.dataset.dish); return; }
  if ((el = t.closest("#resetDemo"))) { resetDemo(); return; }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-promo]");
  if (!f) return;
  e.preventDefault();
  const code = f.elements.code.value.trim().toUpperCase();
  if (!code) { S.promo = ""; cartChanged(false); return; }
  if (code !== "EMBER10") { toast("That code is not valid. Try EMBER10", "info"); return; }
  if (totals().sub < 20) { toast("EMBER10 needs an order over £20", "info"); return; }
  S.promo = code; cartChanged(false); toast("EMBER10 applied: 10% off", "tag");
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); cmdk(); return; }
  if (e.key === "Escape") {
    if (modals.length) { e.preventDefault(); modals[modals.length - 1].close(); }
    else if (document.documentElement.classList.contains("nav-open")) closeNav();
  }
});
addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 8), { passive: true });
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { fitAll(); sizeEmbers(); $$(".seg, .tabs").forEach(moveMk); }, 150); });
addEventListener("hashchange", () => renderPage(false));

/* ---------- Start ---------- */
drawShell();
setTheme(document.documentElement.dataset.theme);
updateBadge(false);
drawOpenPill();
every(30000, drawOpenPill, false);
if (!PAGES.includes(location.hash.replace(/^#\/?/, "").split("/")[0])) history.replaceState(null, "", "#/home");
renderPage(true);
</script>
</body>
</html>
