<!doctype html>
<!-- Chill & Craft · Earful · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earful · podcast episode card with a scrubbable waveform</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: violet and magenta on lilac paper (light), acid lime on aubergine (dark) ---------- */
  :root {
    --bg: #ece6fb; --bg-2: #fbf9ff; --card: #ffffff; --edge: rgba(48, 22, 110, 0.09); --ink: #1c1433; --muted: #6d6589; --soft: #f3effc; --soft-2: #e5ddf9;
    --accent: #6a3cf0; --accent-2: #cf3cc6; --on-accent: #ffffff; --bar: #dcd4f3; --glow: rgba(106, 60, 240, 0.22);
    --shadow: rgba(50, 20, 120, 0.3); --focus: #6a3cf0; --good: #23a26b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0915; --bg-2: #1b1432; --card: #161126; --edge: rgba(255, 255, 255, 0.08); --ink: #f2eeff; --muted: #a59dc6; --soft: #201936; --soft-2: #2c2348;
    --accent: #b6f03f; --accent-2: #5fe3c2; --on-accent: #16210a; --bar: #372d55; --glow: rgba(182, 240, 63, 0.2);
    --shadow: rgba(0, 0, 0, 0.65); --focus: #b6f03f; --good: #5fe3a2;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Stage: soft spotlight and slowly turning sound rings ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(60% 55% at 25% 15%, var(--bg-2), transparent 70%), radial-gradient(50% 50% at 90% 90%, var(--soft-2), transparent 70%), var(--bg); }
  .rings { position: absolute; width: 1100px; height: 1100px; left: 50%; top: 50%; margin: -550px 0 0 -550px; pointer-events: none; opacity: 0.55; animation: turn 90s linear infinite; }
  .rings circle { fill: none; stroke: var(--soft-2); stroke-width: 1.2; }
  @keyframes turn { to { transform: rotate(360deg); } }

  .card { position: relative; width: min(820px, 100%); display: grid; grid-template-columns: 284px minmax(0, 1fr); gap: 26px; padding: 24px; border-radius: 30px; background: var(--card); border: 1px solid var(--edge); overflow: hidden;
    box-shadow: 0 50px 90px -50px var(--shadow), 0 12px 28px -20px var(--shadow); animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(0.96); } }

  /* ---------- Cover art (drawn in SVG): rings pulse while the episode plays ---------- */
  .cover { position: relative; width: 100%; aspect-ratio: 1; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 40px -24px rgba(40, 10, 110, 0.7); transform-origin: 50% 60%; animation: pop 0.9s cubic-bezier(0.3, 1.5, 0.5, 1) 0.15s backwards; }
  @keyframes pop { from { transform: scale(0.7) rotate(-6deg); opacity: 0; } }
  .cover svg { display: block; width: 100%; height: 100%; }
  .cover .ring { fill: none; stroke: #c8ff5a; stroke-width: 1.6; transform-box: fill-box; transform-origin: center; opacity: 0.35; }
  .playing .cover .ring { animation: ripple 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; animation-delay: var(--d); }
  @keyframes ripple { 0% { transform: scale(0.85); opacity: 0.7; } 100% { transform: scale(1.25); opacity: 0; } }
  .cover .moon { transform-box: fill-box; transform-origin: center; animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }
  .cover .mic { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 0.5s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .playing .cover .mic { transform: scale(1.06); }
  .cover .live { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 99px; background: rgba(10, 4, 30, 0.55); color: #fff; font-size: 11px; font-weight: 760; letter-spacing: 0.04em; backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(-6px); transition: opacity 0.3s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .playing .cover .live { opacity: 1; transform: none; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .eq i { width: 2px; height: 100%; border-radius: 2px; background: #c8ff5a; transform-origin: bottom; animation: eq 0.8s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -0.3s; } .eq i:nth-child(3) { animation-delay: -0.55s; }
  @keyframes eq { from { transform: scaleY(0.25); } }

  /* ---------- Episode text ---------- */
  .left { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .host { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--soft); animation: chipin 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) 0.5s backwards; }
  .host .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 850; color: #fff; background: linear-gradient(135deg, #ff5fcf, #6b35f2); }
  .host div { flex: 1; min-width: 0; }
  .host strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 650; }
  .host .rate { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; }
  .host .rate svg { width: 14px; height: 14px; fill: #f5b82e; }
  .info { min-width: 0; display: flex; flex-direction: column; }
  .show { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 760; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  :root[data-theme="light"] .show { color: #5b2fe0; }
  .show .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
  .show span:last-child { color: var(--muted); letter-spacing: 0.02em; text-transform: none; font-weight: 650; }
  .title { margin: 8px 0 6px; font-size: clamp(21px, 3vw, 27px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 800; }
  .swap { animation: swap 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) backwards; }
  @keyframes swap { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
  .blurb { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .chapter { margin: 16px 0 8px; height: 20px; overflow: hidden; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .chapter b { color: var(--muted); font-weight: 650; }
  .chapter .ch { display: inline-block; }
  .chapter .ch.in { animation: chin 0.5s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes chin { from { transform: translateY(100%); opacity: 0; } }

  /* ---------- Waveform scrubber: a muted copy and a coloured copy clipped at the playhead ---------- */
  .wave { position: relative; height: 76px; border-radius: 14px; touch-action: none; cursor: pointer; outline-offset: 4px; user-select: none; -webkit-user-select: none; }
  .wave::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--p, 0) * 100%); width: 140px; margin-left: -70px; background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; transition: opacity 0.3s; opacity: 0; }
  .playing .wave::before, .wave.grab::before { opacity: 1; }
  .bars { position: absolute; inset: 8px 0; display: flex; align-items: center; gap: 2px; pointer-events: none; }
  .bars i { flex: 1 1 0; min-width: 1.5px; height: calc(var(--h) * 100%); border-radius: 3px; background: var(--bar); transform-origin: center; }
  .card .bars.intro i { animation: grow 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) backwards; animation-delay: calc(var(--k) * 9ms + 0.3s); }
  @keyframes grow { from { transform: scaleY(0.05); } }
  .bars.fill { clip-path: inset(0 calc(100% - var(--p, 0) * 100%) 0 0); }
  .bars.fill i { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
  .playing .bars i { animation: dance 0.95s ease-in-out infinite alternate; animation-delay: calc(var(--k) * -41ms); }
  @keyframes dance { from { transform: scaleY(1); } to { transform: scaleY(0.74); } }
  .bars.sink i { animation: sink 0.35s cubic-bezier(0.6, 0, 0.8, 0.4) forwards; animation-delay: calc(var(--k) * 6ms); }
  @keyframes sink { to { transform: scaleY(0.04); opacity: 0.3; } }
  .bars.cheer i { animation: cheer 0.7s cubic-bezier(0.3, 1.6, 0.5, 1); animation-delay: calc(var(--k) * 12ms); }
  @keyframes cheer { 40% { transform: scaleY(1.35); } }
  .marks { position: absolute; inset: 0; pointer-events: none; }
  .marks span { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--ink); opacity: 0.16; }
  .marks span::after { content: ""; position: absolute; left: -2px; top: -4px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: 0.7; }
  .head { position: absolute; top: -4px; bottom: -4px; left: calc(var(--p, 0) * 100%); width: 0; pointer-events: none; }
  .head::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1.5px; width: 3px; border-radius: 3px; background: var(--ink); }
  .head::after { content: ""; position: absolute; left: -7px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); transition: transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .wave.grab .head::after { transform: scale(1.45); }
  .tip { position: absolute; bottom: calc(100% + 10px); left: 0; transform: translateX(-50%) scale(0.7); padding: 5px 9px; border-radius: 9px; background: var(--ink); color: var(--card); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .tip.on { opacity: 1; transform: translateX(-50%); }
  .times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- Controls ---------- */
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .ctl { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--edge); background: var(--soft); display: grid; place-items: center; transition: transform 0.3s cubic-bezier(0.3, 1.8, 0.5, 1), background 0.2s; }
  .ctl:hover { background: var(--soft-2); }
  .ctl:active { transform: scale(0.88); }
  .ctl svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctl small { position: absolute; font-size: 8.5px; font-weight: 850; top: 50%; left: 50%; transform: translate(-50%, -38%); }
  .ctl.spin svg { animation: spinL 0.55s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .ctl.fwd.spin svg { animation-name: spinR; }
  @keyframes spinL { from { transform: rotate(0); } to { transform: rotate(-360deg); } }
  @keyframes spinR { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .float { position: absolute; left: 50%; top: -4px; font-size: 12px; font-weight: 850; color: var(--accent); pointer-events: none; animation: floaty 0.8s ease-out forwards; }
  :root[data-theme="light"] .float { color: #5b2fe0; }
  @keyframes floaty { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -26px); opacity: 0; } }
  .play { position: relative; flex: none; width: 64px; height: 64px; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 14px 26px -12px var(--accent); transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .play:active { transform: scale(0.9); }
  .play.boing { animation: boing 0.55s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes boing { 30% { transform: scale(0.86); } 65% { transform: scale(1.08); } }
  .play svg.icon { width: 28px; height: 28px; fill: currentColor; }
  .play svg.prog { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events: none; }
  .prog circle { fill: none; stroke-width: 3; }
  .prog .trk { stroke: var(--soft-2); }
  .prog .val { stroke: var(--accent-2); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--p, 0)); }
  .speed { width: auto; min-width: 56px; padding: 0 12px; border-radius: 99px; overflow: hidden; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .speed span { display: block; }
  .speed span.in { animation: rollin 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes rollin { from { transform: translateY(110%); } }
  .grow { flex: 1; }
  .copy { width: auto; padding: 0 14px; border-radius: 99px; gap: 6px; display: flex; font-size: 13px; font-weight: 750; white-space: nowrap; }
  .copy svg { width: 18px; height: 18px; }
  .copy.ok { color: var(--good); }

  /* ---------- Chapter chips ---------- */
  .chips { display: flex; gap: 8px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 7px; padding: 7px 12px 7px 8px; border-radius: 99px; border: 1px solid var(--edge); background: var(--card); font-size: 12.5px; font-weight: 700; color: var(--muted); transition: background 0.25s, color 0.25s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); animation: chipin 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) backwards; animation-delay: calc(var(--k) * 70ms + 0.6s); }
  @keyframes chipin { from { opacity: 0; transform: translateX(18px); } }
  .chip time { padding: 2px 6px; border-radius: 99px; background: var(--soft); font-variant-numeric: tabular-nums; font-size: 11px; }
  .chip.on { background: var(--ink); color: var(--card); }
  .chip.on time { background: rgba(255, 255, 255, 0.16); }
  .chip:active { transform: scale(0.94); }

  /* ---------- Up next panel: slides up when an episode ends ---------- */
  .next { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 20px; background: var(--ink); color: var(--card);
    transform: translateY(calc(100% + 20px)); transition: transform 0.6s cubic-bezier(0.3, 1.35, 0.5, 1); z-index: 3; box-shadow: 0 20px 40px -20px var(--shadow); }
  .next.on { transform: none; }
  .next .count { position: relative; flex: none; width: 46px; height: 46px; display: grid; place-items: center; font-weight: 850; font-size: 15px; }
  .next .count svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .next .count circle { fill: none; stroke-width: 3.5; }
  .next .count .val { stroke: var(--accent-2); stroke-linecap: round; stroke-dasharray: 1; }
  .next .txt { flex: 1; min-width: 0; }
  .next small { display: block; font-size: 11px; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  .next strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next button { flex: none; border: 0; border-radius: 99px; padding: 9px 14px; font-size: 13px; font-weight: 800; background: var(--accent); color: var(--on-accent); }
  .next button.ghostbtn { background: transparent; color: inherit; border: 1px solid rgba(255, 255, 255, 0.25); }
  :root[data-theme="dark"] .next button.ghostbtn { border-color: rgba(0, 0, 0, 0.2); }

  .toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -60px); padding: 9px 14px; border-radius: 14px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 750; white-space: nowrap; z-index: 4; transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
  .toast.on { transform: translate(-50%, 0); }

  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  /* demo cursor */
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost.drag { transition: opacity 0.35s; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg, .ghost.drag svg { transform: scale(0.82); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  /* ---------- Phone: small cover beside the title ---------- */
  @media (max-width: 720px) {
    .card { grid-template-columns: 112px minmax(0, 1fr); gap: 14px 16px; padding: 18px; border-radius: 26px; max-width: 460px; }
    .info, .left { display: contents; }
    .host { display: none; }
    .cover { grid-row: 1; border-radius: 18px; align-self: start; }
    .head-txt { grid-column: 2; grid-row: 1; align-self: center; }
    .blurb, .chapter, .wave, .times, .controls, .chips { grid-column: 1 / -1; }
    .blurb { margin-top: -2px; font-size: 13.5px; }
    .chapter { margin: 2px 0 -6px; }
    .times { margin-top: -8px; }
    .controls { margin-top: -2px; gap: 8px; }
    .chips { margin-top: -2px; }
    .cover .live { left: 7px; top: 7px; padding: 4px 7px; font-size: 0; gap: 0; }
    .title { font-size: 19px; margin: 6px 0 0; }
    .show { font-size: 10.5px; flex-wrap: wrap; row-gap: 2px; }
    .copy .lbl { display: none; }
    .copy { width: 44px; padding: 0; justify-content: center; }
  }
  @media (max-width: 360px) { .ctl { width: 40px; height: 40px; } .play { width: 58px; height: 58px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <svg class="rings" viewBox="0 0 1100 1100" aria-hidden="true"><g id="bgRings"></g></svg>

  <article class="card" id="card" aria-labelledby="epTitle">
    <div class="left">
    <!-- Cover art: our own drawing, a moon over river rings and a studio mic -->
    <div class="cover" aria-hidden="true">
      <svg viewBox="0 0 300 300">
        <defs>
          <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b35f2"/><stop offset="0.55" stop-color="#3a1597"/><stop offset="1" stop-color="#14093f"/></linearGradient>
          <radialGradient id="mg" cx="0.35" cy="0.35" r="0.8"><stop offset="0" stop-color="#e9ff9c"/><stop offset="1" stop-color="#a5e635"/></radialGradient>
          <linearGradient id="riv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5fcf" stop-opacity="0"/><stop offset="0.5" stop-color="#ff5fcf"/><stop offset="1" stop-color="#ff5fcf" stop-opacity="0"/></linearGradient>
        </defs>
        <rect width="300" height="300" fill="url(#cg)"/>
        <g fill="#fff" opacity="0.7"><circle cx="40" cy="44" r="1.4"/><circle cx="250" cy="30" r="1.1"/><circle cx="214" cy="80" r="1.6"/><circle cx="64" cy="120" r="1"/><circle cx="270" cy="140" r="1.2"/><circle cx="120" cy="28" r="1"/></g>
        <g class="moon"><circle cx="208" cy="96" r="40" fill="url(#mg)"/><circle cx="226" cy="84" r="36" fill="#4a1fb8" opacity="0.95"/></g>
        <g transform="translate(150 196)">
          <circle class="ring" r="44" style="--d:0s"/><circle class="ring" r="66" style="--d:0.6s"/><circle class="ring" r="88" style="--d:1.2s"/><circle class="ring" r="110" style="--d:1.8s"/>
        </g>
        <path d="M-10 236 C 60 220, 110 252, 160 238 S 260 222, 310 240" fill="none" stroke="url(#riv)" stroke-width="3" opacity="0.8"/>
        <path d="M-10 252 C 70 240, 120 266, 170 254 S 250 240, 310 256" fill="none" stroke="url(#riv)" stroke-width="2" opacity="0.5"/>
        <g transform="translate(150 196)"><g class="mic">
          <rect x="-17" y="-58" width="34" height="58" rx="17" fill="#f6f2ff"/>
          <g stroke="#4a1fb8" stroke-width="2.4" stroke-linecap="round" opacity="0.55"><path d="M-9 -42h18M-9 -32h18M-9 -22h18"/></g>
          <path d="M-27 -20 a27 27 0 0 0 54 0" fill="none" stroke="#f6f2ff" stroke-width="5" stroke-linecap="round"/>

      later(function () { ghost.classList.remove("show"); }, 24600);
      later(demo, 27000);
    }

    /* ---------- Start ---------- */
    buildBars(true); buildChips(); seek(372); setSpeed(1); $("#speed").firstChild.className = "";
    sizeFx();
    var rt = 0; addEventListener("resize", function () { sizeFx(); clearTimeout(rt); rt = setTimeout(function () { buildBars(false); }, 150); });
    if (demoOn) later(demo, 1800);
  })();
</script>
