<!doctype html>
<!-- Chill and Craft · Roll Cart · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Cart · Chill and Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #efeafe;
    --card: #ffffff;
    --ink: #1e1b4b;
    --muted: #6b6894;
    --line: #e2dcfb;
    --btn: #4f3fe0;
    --btn-2: #3b2fc4;
    --done: #0e9f6e;
    --cart: #facc15;
    --box: #fb7185;
    --shadow: 0 18px 40px -18px rgba(49, 36, 160, .45);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #100e1c;
    --card: #1b1830;
    --ink: #ece9ff;
    --muted: #a39fd0;
    --line: #2c2850;
    --btn: #6d5ef5;
    --btn-2: #5446e0;
    --done: #12b981;
    --shadow: 0 18px 44px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(600px 300px at 50% 0%, rgba(109, 94, 245, .18), transparent 70%),
      var(--stage);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Product card ---------- */
  .card {
    width: 100%; max-width: 340px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 20px;
    box-shadow: var(--shadow);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .shop { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px 6px 8px;
    border-radius: 999px;
    background: var(--stage);
    font-size: 13px; font-weight: 650;
  }
  .chip svg { width: 18px; height: 18px; }
  .chip b {
    min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: var(--btn); color: #fff; font-size: 11px; line-height: 20px; text-align: center;
  }
  .chip.pop { animation: chipPop .55s var(--spring); }
  .chip.pop b { animation: badge .55s var(--spring); }
  @keyframes chipPop { 30% { transform: scale(.9) rotate(-4deg); } 60% { transform: scale(1.08) rotate(2deg); } }
  @keyframes badge { 40% { transform: scale(1.6); } }

  .product { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .thumb {
    flex: none; width: 84px; height: 84px; border-radius: 20px;
    background: linear-gradient(160deg, #fde68a, #fbcfe8);
    display: grid; place-items: center;
    transition: transform .5s var(--spring);
  }
  .thumb:hover { transform: rotate(-6deg) scale(1.06); }
  .thumb svg { width: 62px; height: 62px; overflow: visible; }
  .lamp-head { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .6s var(--spring); }
  .thumb:hover .lamp-head { transform: rotate(-12deg); }
  .glow { opacity: .35; transition: opacity .3s; }
  .thumb:hover .glow { opacity: .9; }
  .product h1 { margin: 0 0 3px; font-size: 18px; line-height: 1.2; }
  .product p { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .price { font-weight: 750; font-size: 17px; }
  .price s { font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px; }

  /* ---------- The Add to cart button ---------- */
  .add {
    position: relative;
    display: block;
    width: 100%; height: 62px;
    border: 0; border-radius: 999px;
    background: linear-gradient(180deg, var(--btn), var(--btn-2));
    color: #fff;
    font: 700 16px system-ui, sans-serif;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px var(--btn), inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: background .3s, transform .45s var(--spring), box-shadow .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .add:hover { transform: translateY(-2px); box-shadow: 0 16px 26px -12px var(--btn), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .add:active { transform: scale(.96); transition-duration: .08s; }
  .add:focus-visible { outline: 3px solid var(--btn); outline-offset: 4px; }
  .add[aria-disabled="true"] { cursor: default; }
  .add::after { /* shine that sweeps across on hover */
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .28), transparent);
    transform: skewX(-18deg);
  }
  .add:hover::after { animation: shine .9s ease; }
  @keyframes shine { to { left: 130%; } }
  .add::before { /* success ripple */
    content: ""; position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border-radius: 50%; background: rgba(255, 255, 255, .35); transform: scale(0); opacity: 0;
  }
  .add.is-done::before { animation: ripple .7s ease-out; }
  @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(6); opacity: 0; } }
  .add.is-press { animation: squash .4s var(--spring); }
  @keyframes squash { 0% { transform: scale(1); } 35% { transform: scale(1.04, .86); } 70% { transform: scale(.98, 1.04); } 100% { transform: scale(1); } }
  .add.is-done { background: var(--done); box-shadow: 0 12px 24px -10px var(--done); }

  .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .5s var(--spring), opacity .25s;
  }
  .label svg { width: 20px; height: 20px; }
  .add:hover .label-idle svg { animation: wiggle .5s ease; }
  @keyframes wiggle { 30% { transform: rotate(-14deg); } 60% { transform: rotate(10deg); } }
  .label-done { transform: translateY(120%) scale(.6); opacity: 0; }
  .label-done path { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .is-press .label-idle { transform: translateY(-130%); opacity: 0; transition: transform .3s ease-in, opacity .2s; }
  .is-done .label-done { transform: none; opacity: 1; }
  .is-done .label-done path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s ease-out .2s; }

  /* Cart: parked off to the left until the button is pressed */
  .cart {
    position: absolute; left: 50%; top: 11px;
    width: 46px; height: 38px; margin-left: -23px;
    transform: translateX(-200px);
    overflow: visible;
  }
  .cart .basket { fill: var(--cart); stroke: #1e1b4b; stroke-width: 1.6; stroke-linejoin: round; }
  .cart .rail { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cart .wheel { fill: #1e1b4b; stroke: #fff; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
  .cart .body { transform-box: fill-box; transform-origin: 50% 100%; }
  .cart .box { opacity: 0; transform: translateY(-36px) rotate(-25deg); transform-box: fill-box; transform-origin: center; }
  .cart .puff { fill: #fff; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .trail { position: absolute; top: 20px; left: 50%; width: 34px; margin-left: -70px; opacity: 0; }
  .trail i { display: block; height: 3px; margin: 4px 0; border-radius: 3px; background: rgba(255, 255, 255, .75); }
  .trail i:nth-child(2) { width: 70%; margin-left: 30%; }
  .bar { position: absolute; left: 22%; right: 22%; bottom: 7px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); overflow: hidden; opacity: 0; transition: opacity .2s; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--cart); }

  /* Stage 2: roll in with a springy stop */
  .is-in .cart { animation: cartIn .65s cubic-bezier(.2, .9, .3, 1.25) forwards; }
  .is-in:not(.is-drop) .wheel, .is-out .wheel { animation: spin .28s linear infinite; }
  /* Stage 3: box falls in and the cart squashes */
  .is-drop .box { animation: boxDrop .36s cubic-bezier(.55, 0, .8, .45) forwards; }
  .is-thud .body { animation: thud .4s var(--spring); }
  /* Stage 4: progress bar fills while the engine shakes */
  .is-load .bar { opacity: 1; }
  .is-load .bar i { width: 100%; transition: width .75s cubic-bezier(.6, 0, .3, 1); }
  .is-load .rig { animation: shake .1s linear infinite; }
  .is-load .puff { animation: puff .45s ease-out infinite; }
  .is-load .puff + .puff { animation-delay: .22s; }
  /* Stage 5: wind back, then zoom off */
  .is-out .cart { animation: cartOut .6s cubic-bezier(.6, 0, .9, .45) forwards; }
  .is-out .trail { animation: trail .6s ease-in forwards; }

  @keyframes cartIn {
    from { transform: translateX(-200px) rotate(0); }
    70% { transform: translateX(10px) rotate(-6deg); }
    85% { transform: translateX(-3px) rotate(2deg); }
    to { transform: translateX(0); }
  }
  @keyframes boxDrop { to { opacity: 1; transform: none; } }
  @keyframes thud { 0% { transform: scale(1); } 30% { transform: scale(1.12, .8); } 65% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
  @keyframes shake { 50% { transform: translate(.6px, -.8px); } }
  @keyframes puff { from { opacity: .9; transform: translate(0, 0) scale(.4); } to { opacity: 0; transform: translate(-14px, -6px) scale(1.4); } }
  @keyframes cartOut {
    0% { transform: translateX(0); }
    22% { transform: translateX(-10px) rotate(6deg); }
    100% { transform: translateX(240px) rotate(-5deg); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes trail {
    0% { opacity: 0; transform: translateX(30px); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateX(190px); }
  }

  /* Flying "+1" and confetti (made by script) */
  .token {
    position: fixed; z-index: 30; width: 28px; height: 28px; margin: -14px 0 0 -14px;
    border-radius: 50%; background: var(--cart); color: #1e1b4b;
    display: grid; place-items: center; font: 800 12px system-ui, sans-serif; pointer-events: none;
  }
  .bit { position: fixed; z-index: 30; width: 7px; height: 11px; margin: -5px 0 0 -3px; border-radius: 2px; pointer-events: none; }
  .bit.round { width: 8px; height: 8px; border-radius: 50%; }

  .note { margin: 12px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
  .link {
    border: 0; background: none; padding: 0;
    color: var(--btn); font: 650 12.5px system-ui, sans-serif;
    text-decoration: underline; cursor: pointer;
  }
  .link:hover { text-decoration-thickness: 2px; }
  .link:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .cart, .trail, .bar { visibility: hidden; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="pName">
    <div class="top">
      <span class="shop">Roshni Home</span>
      <span class="chip" id="chip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></svg>
        Cart <b id="count">0</b>
      </span>
    </div>

    <div class="product">
      <div class="thumb" aria-hidden="true">
        <!-- Desk lamp picture -->
        <svg viewBox="0 0 64 64">
          <ellipse cx="32" cy="57" rx="16" ry="3.5" fill="#1e1b4b" opacity=".25"/>
          <rect x="18" y="52" width="28" height="5" rx="2.5" fill="#1e1b4b"/>
          <path d="M31 52 25 33l14-11" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="25" cy="33" r="3" fill="#4f3fe0"/>
          <g class="lamp-head">
            <path class="glow" d="M42 31 30 62h30Z" fill="#fde047"/>
            <path d="M33 13l17 9-8 9-14-8Z" fill="#4f3fe0"/>
            <path d="M42 31c3 3 7 4 10 2" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div>
        <h1 id="pName">Noor Desk Lamp</h1>
        <p>Warm LED, bendy arm, USB-C</p>
        <div class="price">Rs 6,900 <s>Rs 8,200</s></div>
      </div>
    </div>

    <button class="add" id="addBtn" type="button">
      <span class="label label-idle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 9v4M11 11h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add to cart
      </span>
      <span class="label label-done" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Added to cart
      </span>

      <!-- Speed lines and the progress bar -->
      <span class="trail" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="bar" aria-hidden="true"><i></i></span>

      <!-- The little cart: outer svg moves, .rig shakes, .body squashes -->
      <svg class="cart" viewBox="0 0 46 38" aria-hidden="true">
        <g class="rig">
          <circle class="puff" cx="2" cy="28" r="3"/>
          <circle class="puff" cx="2" cy="28" r="3"/>
          <g class="body">
            <g class="box">
              <rect x="17" y="1" width="15" height="13" rx="2" fill="#fb7185" stroke="#1e1b4b" stroke-width="1.4"/>
              <path d="M24.5 1v13" stroke="#fff" stroke-width="2"/>
            </g>
            <path class="rail" d="M2 5h5l4 19h26"/>
            <path class="basket" d="M8.5 9H43l-4 13H11.6Z"/>
            <path d="M17 12v7M24 12v7M31 12v7" stroke="#1e1b4b" stroke-width="1.2" opacity=".5"/>
          </g>
          <g class="wheel"><circle cx="15" cy="31" r="4"/><path d="M15 27.6v6.8"/></g>
          <g class="wheel"><circle cx="34" cy="31" r="4"/><path d="M34 27.6v6.8"/></g>
        </g>
      </svg>
    </button>

    <p class="note" id="note">Free delivery in Karachi, Lahore and Islamabad.</p>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const PRICE = 6900;
    const btn = document.getElementById("addBtn");
    const chip = document.getElementById("chip");
    const countEl = document.getElementById("count");
    const note = document.getElementById("note");
    const live = document.getElementById("live");
    let count = 0;
    let busy = false;

    const money = (n) => "Rs " + n.toLocaleString("en-US");
    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 80) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps the done state readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

    // Confetti from the middle of an element
    function confetti(el, n) {
      if (RM || !el.animate) return;
      const r = el.getBoundingClientRect();
      const colors = ["#facc15", "#fb7185", "#4f3fe0", "#34d399", "#ffffff"];
      for (let i = 0; i < n; i++) {
        const b = document.createElement("i");
        b.className = "bit" + (i % 3 ? "" : " round");
        b.style.left = r.left + r.width / 2 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = colors[i % colors.length];
        document.body.appendChild(b);
        const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
        const d = 60 + Math.random() * 80;
        const x = Math.cos(a) * d, y = Math.sin(a) * d * 0.6 - 40, spin = (Math.random() - 0.5) * 900;
        b.animate([
          { transform: "translate(0,0) scale(.3)", opacity: 1 },
          { transform: `translate(${x}px,${y}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(${x * 1.2}px,${y + 80}px) rotate(${spin}deg) scale(.7)`, opacity: 0 }
        ], { duration: 1100 + Math.random() * 400, easing: "cubic-bezier(.15,.7,.35,1)" }).onfinish = () => b.remove();
      }
    }

    // A "+1" coin that hops from the button to the cart chip
    function token() {
      return new Promise((resolve) => {
        if (RM || !btn.animate) { resolve(); return; }
        const a = btn.getBoundingClientRect(), b = chip.getBoundingClientRect();
        const t = document.createElement("span");
        t.className = "token";
        t.textContent = "+1";
        t.style.left = a.left + a.width / 2 + "px";
        t.style.top = a.top + a.height / 2 + "px";
        document.body.appendChild(t);
        const dx = b.right - 14 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
        t.animate([
          { transform: "translate(0,0) scale(.4)" },
          { transform: `translate(${dx * 0.4}px,${dy - 60}px) scale(1.15)`, offset: 0.45 },
          { transform: `translate(${dx}px,${dy}px) scale(.5)` }
        ], { duration: 700, easing: "cubic-bezier(.45,0,.35,1)" }).onfinish = () => { t.remove(); resolve(); };
      });
    }

    // Note under the button: count, total and an "Empty cart" link
    function paintNote() {
      note.textContent = "";
      if (!count) { note.textContent = "Free delivery in Karachi, Lahore and Islamabad."; return; }
      note.append(count + (count === 1 ? " lamp" : " lamps") + " in cart · " + money(count * PRICE) + " · ");
      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "link";
      clear.textContent = "Empty cart";
      clear.addEventListener("click", () => {
        count = 0;
        countEl.textContent = "0";
        replay(chip, "pop");
        paintNote();
        btn.focus();
        live.textContent = "Cart emptied.";
      });
      note.append(clear);
    }

    btn.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      btn.setAttribute("aria-disabled", "true");
      live.textContent = "Adding Noor Desk Lamp to your cart…";

      // 1. Anticipation: the button squashes and the label lifts away
      btn.classList.add("is-press");
      await wait(160);
      // 2. The cart rolls in and brakes
      btn.classList.add("is-in");
      await wait(560);
      // 3. A box drops in and the cart squashes
      btn.classList.add("is-drop");
      await wait(340);
      replay(btn, "is-thud");
      await wait(220);
      // 4. Progress: bar fills while the engine shakes
      btn.classList.add("is-load");
      await wait(800);
      // 5. Wind back, then zoom off with speed lines
      btn.classList.remove("is-load");
      btn.classList.add("is-out");
      await wait(520);
      // 6. Done: green ripple, check, confetti and a +1 to the chip
      btn.classList.add("is-done");
      confetti(btn, 22);
      await token();
      count++;
      countEl.textContent = count;
      replay(chip, "pop");
      paintNote();
      live.textContent = "Added. Your cart has " + count + (count === 1 ? " item" : " items") + ", " + money(count * PRICE) + ".";
      await hold(1500);
      // 7. Reset to the idle button
      btn.classList.remove("is-press", "is-in", "is-drop", "is-thud", "is-out", "is-done");
      btn.removeAttribute("aria-disabled");
      busy = false;
    });
  })();
</script>
</body>
</html>
