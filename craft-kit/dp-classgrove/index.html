<style>
:root{--bg:#f6f4ee;--side:#fbfaf6;--card:#ffffff;--well:#f5f2ea;--well-2:#efebe1;--band-a:#fcefbf;--band-b:#fbf6e6;--ink:#1d2532;--ink-2:#3a4556;--muted:#6a7384;--faint:#9aa2af;--line:#e7e2d5;--line-2:#f0ece3;--sun:#f4c235;--sun-hi:#ffd34f;--sun-soft:#fdf0c4;--sun-deep:#b98a06;--sun-ink:#1d2532;--slate:#243041;--slate-2:#2f3c50;--slate-3:#3b4a61;--slate-ink:#eef2f7;--slate-mute:#9eabbf;--c-bio:#eeb422;--c-chem:#4f86e8;--c-earth:#2ea37e;--c-club:#8a74e0;--c-office:#e8734f;--c-meet:#7b8798;--good:#22926a;--bad:#d14d31;--warn:#c48606;--info:#4f86e8;--h0:#ef8b6e;--h1:#f6d063;--h2:#b2c3da;--h3:#32435b;--shadow:0 1px 2px rgba(29,37,50,.05),0 10px 26px -18px rgba(29,37,50,.22);--shadow-up:0 2px 6px rgba(29,37,50,.06),0 22px 40px -22px rgba(29,37,50,.34);--surface:#ffffff;--surface-2:#f5f2ea;--panel:#ffffff;--accent:#f4c235;--accent-ink:#1d2532;--focus:#1d2532;--overlay:rgba(24,30,40,.38);--tip-bg:#1d2532;--tip-ink:#fff;--radius:16px;--radius-sm:10px;color-scheme:light}
[data-theme="dark"]{--bg:#10141a;--side:#141920;--card:#19202a;--well:#202835;--well-2:#283141;--band-a:#2a2615;--band-b:#161b22;--ink:#e9edf3;--ink-2:#c3ccd8;--muted:#8e99ab;--faint:#6c7789;--line:#283140;--line-2:#212935;--sun:#f6cb4f;--sun-hi:#ffd968;--sun-soft:#3a331b;--sun-deep:#f6cb4f;--sun-ink:#18202b;--slate:#0c1117;--slate-2:#1b2330;--slate-3:#263142;--slate-ink:#e9edf3;--slate-mute:#8e99ab;--c-bio:#f2c43c;--c-chem:#6f9cf0;--c-earth:#45bf96;--c-club:#a28ff0;--c-office:#f08a66;--c-meet:#95a1b3;--good:#4fc79a;--bad:#f07a5f;--warn:#f0b83c;--info:#6f9cf0;--h0:#d9785c;--h1:#dcb443;--h2:#5e7697;--h3:#c7d6ec;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.6);--shadow-up:0 2px 6px rgba(0,0,0,.3),0 24px 44px -20px rgba(0,0,0,.75);--surface:#19202a;--surface-2:#202835;--panel:#19202a;--accent:#f6cb4f;--accent-ink:#18202b;--focus:#f6cb4f;--overlay:rgba(0,0,0,.55);--tip-bg:#eef2f7;--tip-ink:#18202b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:650;font-size:13px;text-decoration:none;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.primary,.btn.sun{background:var(--sun);border-color:transparent;color:var(--sun-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.btn.primary:hover,.btn.sun:hover{background:var(--sun-hi);box-shadow:0 8px 18px -10px var(--sun-deep),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn.dark{background:var(--slate);border-color:transparent;color:var(--slate-ink)}
[data-theme="dark"] .btn.dark{background:var(--well-2)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn .ic{width:16px;height:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.cc-toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:grid;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.cc-toast{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--tip-bg);color:var(--tip-ink);box-shadow:0 14px 30px -12px rgba(0,0,0,.45);font-size:13px;animation:ccToast .35s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto}
.cc-toast .ic{color:var(--sun)}
[data-theme="dark"] .cc-toast .ic{color:var(--sun-deep)}
.cc-toast.bad .ic{color:var(--bad)}
.cc-toast.out{animation:ccToastOut .3s ease forwards}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.96)}
}
@keyframes ccToastOut{to{opacity:0;transform:translateX(30px)}
}
.cc-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.cc-back{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
.cc-dialog{position:relative;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.1)}
.cc-dialog.wide{width:min(760px,100%)}
.cc-overlay.open .cc-back{opacity:1}
.cc-overlay.open .cc-dialog{opacity:1;transform:none}
.cc-overlay.is-drawer{place-items:stretch end;padding:0}
.cc-overlay.is-drawer .cc-dialog{width:min(420px,100%);height:100%;max-height:none;border-radius:18px 0 0 18px;transform:translateX(40px)}
.cc-overlay.is-drawer.open .cc-dialog{transform:none}
.cc-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px;position:sticky;top:0;background:inherit;z-index:1}
.cc-dh h2{margin:0;font-size:16px;letter-spacing:-.01em}
.cc-x{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted)}
.cc-x:hover{background:var(--well);color:var(--ink)}
.cc-db{padding:6px 18px 18px}
.cc-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.cc-db .cc-df{padding:14px 0 0}
.cc-confirm{margin:6px 0 0;color:var(--muted);line-height:1.5}
.cc-pick{display:flex;align-items:center;gap:10px;padding:11px 12px;text-align:left;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--well)}
.cc-pick:hover,.cc-pick:focus-visible{border-color:var(--sun-deep)}
.cc-pick small{margin-left:auto;color:var(--muted)}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.cc-field{display:grid;gap:5px;grid-column:span 2}
.cc-field.half{grid-column:span 1}
.cc-field label{font-size:12px;font-weight:650;color:var(--muted)}
.cc-field input,.cc-field select,.cc-field textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--well);color:var(--ink);font-size:13px}
.cc-field textarea,textarea.inp{resize:vertical;line-height:1.5}
.cc-field input:focus,.cc-field select:focus,.cc-field textarea:focus,.inp:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 35%,transparent)}
.cc-field [aria-invalid="true"],.inp[aria-invalid="true"]{border-color:var(--bad)}
.cc-err{color:var(--bad);font-size:12px}
.cc-err:empty{display:none}
.cc-hint{color:var(--muted);font-size:11.5px}
.cc-intro{margin:0 0 12px;color:var(--muted)}
.cc-form.shake{animation:ccShake .35s}
@keyframes ccShake{25%{transform:translateX(-6px)}
50%{transform:translateX(5px)}
75%{transform:translateX(-3px)}
}
@media (max-width:480px){.cc-field.half{grid-column:span 2}
}
.cc-pop{position:fixed;z-index:85;max-height:70vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .25s}
.cc-pop.open{opacity:1;transform:none}
.cc-tip{position:fixed;z-index:95;pointer-events:none;min-width:120px;max-width:260px;padding:8px 10px;border-radius:10px;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .12s}
.cc-tip.on{opacity:1}
.cc-tip b{display:block;margin-bottom:2px}
.cc-tip div{display:flex;align-items:center;gap:6px}
.cc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.cc-tip em{margin-left:auto;padding-left:10px;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.cc-cmdk .cc-dialog{align-self:start;margin-top:10vh;width:min(560px,100%)}
.cc-cmdk-q{width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--sun-deep);background:var(--well);font-size:14px}
.cc-cmdk-q:focus{outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.cc-cmdk-list li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.cc-cmdk-list li[aria-selected="true"],.cc-cmdk-list li:hover{background:var(--sun-soft)}
.cc-cmdk-list small{margin-left:auto;color:var(--muted)}
.cc-cmdk-foot{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
.cc-cmdk-foot kbd{padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid var(--line);font-family:inherit}
.cc-empty-li{color:var(--muted);cursor:default !important}
.cc-empty{display:grid;place-items:center;align-content:center;gap:6px;padding:26px 12px;text-align:center;color:var(--muted)}
.cc-empty .ic{width:28px;height:28px;opacity:.6}
.cc-empty b{color:var(--ink)}
.cc-chart{display:block;overflow:visible}
.cc-chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.cc-grid line{stroke:var(--line);stroke-dasharray:3 4}
.cc-zero{stroke:var(--line)}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1s cubic-bezier(.4,.1,.2,1) forwards}
.cc-fade{animation:ccFade .8s .25s both}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .7s cubic-bezier(.2,.9,.25,1.05) both;transition:opacity .2s}
.cc-static .cc-draw,.cc-static .cc-fade,.cc-static .cc-bar{animation:none;stroke-dashoffset:0}
.cc-guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0}
.cc-guide.on{opacity:.7}
.cc-dot{opacity:0;stroke:var(--card);stroke-width:2}
.cc-dot.on{opacity:1}
.cc-hit.on{fill:var(--ink);fill-opacity:.05}
@keyframes ccDraw{to{stroke-dashoffset:0}
}
@keyframes ccFade{from{opacity:0}
}
@keyframes ccGrow{from{transform:scaleY(0)}
}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.cc-legend span{display:inline-flex;align-items:center;gap:6px}
.cc-legend i,.cc-dlegend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.cc-donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.cc-donut{position:relative;flex:none}
.cc-donut svg{display:block}
.cc-track{fill:none;stroke:var(--well-2);stroke-linecap:round}
.cc-seg{fill:none;transition:opacity .2s;cursor:pointer}
.cc-seg.dim{opacity:.3}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cc-donut-c small{color:var(--muted);font-size:11.5px}
.cc-dlegend{list-style:none;margin:0;padding:0;flex:1 1 150px;display:grid;gap:2px;font-size:12.5px}
.cc-dlegend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;transition:background .2s}
.cc-dlegend li.on{background:var(--well)}
.cc-dlegend em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.cc-dlegend small{color:var(--muted);min-width:2.6em;text-align:right}
.cc-spark{display:block;overflow:visible}
.cc-spark .cc-line{stroke-width:1.8}
.cc-in{animation:ccRise .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(12px)}
}
.sk{border-radius:var(--radius);background:linear-gradient(100deg,var(--well) 30%,var(--line-2) 50%,var(--well) 70%) 0 0 / 300% 100%;animation:skShine 1s linear infinite;border:1px solid var(--line-2)}
[data-theme="dark"] .sk{background-image:linear-gradient(100deg,var(--card) 30%,var(--well) 50%,var(--card) 70%)}
@keyframes skShine{from{background-position:100% 0}
to{background-position:-50% 0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
.cc-draw{stroke-dashoffset:0}
}
body{background:var(--bg);color:var(--ink);font:13px/1.45 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
a{color:inherit}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;background:var(--side);border-right:1px solid var(--line);padding:16px 14px 14px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;z-index:40}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:2px 6px}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:-1px}
.nav{position:relative;display:grid;gap:1px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px;transition:color .2s,background .2s}
.nav a .ic{width:18px;height:18px;color:var(--muted);transition:color .2s}
.nav a:hover{background:var(--well);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--sun-ink);font-weight:700;background:transparent}
.nav a[aria-current="page"] .ic{color:var(--sun-ink)}
.nav .mark{position:absolute;left:0;right:0;top:0;border-radius:10px;background:var(--sun);box-shadow:inset 0 -2px 0 rgba(0,0,0,.07),0 6px 14px -8px var(--sun-deep);transition:transform .45s cubic-bezier(.3,1.35,.5,1),height .3s,opacity .2s}
.nav .n{margin-left:auto;min-width:20px;height:19px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:750;display:grid;place-items:center;background:var(--well-2);color:var(--ink-2)}
.nav a[aria-current="page"] .n{background:rgba(29,37,50,.12);color:var(--sun-ink)}
.nav .n:empty{display:none}
.nav .live-dot{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--bad)}
.nav .live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}
70%{box-shadow:0 0 0 7px transparent}
100%{box-shadow:0 0 0 0 transparent}
}
.side-sec h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;padding:0 8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.side-sec ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.side-sec li>a,.side-sec li>button{width:100%;display:flex;align-items:center;gap:10px;padding:6px 8px;border:0;border-radius:9px;background:none;text-align:left;text-decoration:none;color:var(--ink-2);font-size:12.5px;font-weight:600}
.side-sec li>a:hover,.side-sec li>button:hover{background:var(--well)}
.side-sec .sq{width:10px;height:10px;border-radius:3px;flex:none}
.side-sec .cnt{margin-left:auto;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.side-sec .who-l{min-width:0;line-height:1.25}
.side-sec .who-l b{display:block;font-weight:650;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-sec .who-l small{display:block;color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--line)}
.me .who-l{flex:1;min-width:0;line-height:1.25}
.me b{display:block;font-size:13px}
.me small{color:var(--muted);font-size:11.5px}
.av{--s:30px;position:relative;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;background:hsl(var(--h,40) 72% 86%);color:hsl(var(--h,40) 45% 26%);font-weight:750;font-size:calc(var(--s) * .37);letter-spacing:.01em;isolation:isolate}
[data-theme="dark"] .av{background:hsl(var(--h,40) 30% 30%);color:hsl(var(--h,40) 80% 88%)}
.av img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;display:inline-block;flex:none;line-height:0}
.av-wrap .on-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--side)}
.stack{display:flex}
.stack .av{border:2px solid var(--card);margin-left:-8px}
.stack .av:first-child{margin-left:0}
.main-col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;transition:background .25s,box-shadow .25s}
.top.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.search{display:flex;align-items:center;gap:9px;min-width:0;width:min(380px,40vw);height:38px;padding:0 8px 0 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;text-align:left;box-shadow:var(--shadow)}
.search span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd,.kbd{font:600 11px/1 inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--well);color:var(--muted)}
.top .grow{flex:1}
.icon-btn{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);transition:transform .15s,background .2s;flex:none}
.icon-btn:hover{background:var(--well)}
.icon-btn:active{transform:scale(.92)}
.icon-btn .ic{width:18px;height:18px}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.badge:empty{display:none}

.blk{display:grid;grid-template-columns:16px 34px 1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .25s cubic-bezier(.3,1.3,.5,1),box-shadow .2s,opacity .2s;touch-action:none}
.blk.drag{box-shadow:var(--shadow-up);z-index:5;position:relative;transition:none;cursor:grabbing}
.blk.ghost{opacity:.35}
.blk .grip{cursor:grab;color:var(--faint);display:grid;place-items:center;border:0;background:none;padding:0;height:28px}
.blk .tico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.blk .tico .ic{width:17px;height:17px}
.blk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:650;line-height:1.3}
.bname{min-width:0;border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:7px;text-align:left;cursor:text}
.bname:hover{background:var(--well)}
.blk small{color:var(--muted);font-size:11.5px}
.mins{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;padding:2px}
.mins button{width:22px;height:22px;border:0;border-radius:6px;background:var(--well);display:grid;place-items:center}
.mins button .ic{width:12px;height:12px;stroke-width:2.4}
.mins span{min-width:42px;text-align:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.blk-acts{display:flex;gap:3px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px dashed color-mix(in srgb,var(--c) 60%,var(--line));background:color-mix(in srgb,var(--c) 8%,transparent);font-size:12px;font-weight:650;color:var(--ink-2)}
.palette button:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.palette .ic{width:14px;height:14px;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.preview-steps{display:grid;gap:8px;counter-reset:st}
.preview-steps div{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--well)}
.preview-steps div::before{counter-increment:st;content:counter(st);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);font-weight:800}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tsearch{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:280px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--well);color:var(--muted)}
.tsearch:focus-within{border-color:var(--sun-deep)}
.tsearch input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:12.5px}
.fchips{display:flex;gap:5px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12px;font-weight:650}
.fchip em{font-style:normal;color:var(--muted);font-weight:600}
.fchip[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:transparent}
.fchip[aria-pressed="true"] em{color:var(--slate-mute)}
[data-theme="dark"] .fchip[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
[data-theme="dark"] .fchip[aria-pressed="true"] em{color:rgba(0,0,0,.55)}
.sel{height:34px;padding:0 30px 0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tscroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.t{width:100%;border-collapse:collapse;min-width:820px;font-size:12.5px}
.t th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th button{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px}
.t th button .ic{width:12px;height:12px;opacity:.5}
.t th[aria-sort="ascending"] .ic,.t th[aria-sort="descending"] .ic{opacity:1;color:var(--ink)}
.t td{padding:8px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tbody tr{transition:background .15s;animation:rowIn .35s both;animation-delay:calc(var(--r,0) * 22ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}
}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--well)}
.t tbody tr.picked{background:var(--sun-soft)}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t .person{display:flex;align-items:center;gap:10px;min-width:0}
.t .person .av{--s:32px}
.t .person b{display:block;font-weight:650}
.t .person small{color:var(--muted);font-size:11.5px}
.ck{width:17px;height:17px;accent-color:var(--slate);cursor:pointer}
[data-theme="dark"] .ck{accent-color:var(--sun)}
.strip{display:inline-grid;grid-auto-flow:column;grid-auto-columns:9px;gap:2px}
.strip i{height:14px;border-radius:3px;background:var(--c)}
.strip i.l0{--c:var(--h0)}
.strip i.l1{--c:var(--h1)}
.strip i.l2{--c:var(--h2)}
.strip i.l3{--c:var(--h3)}
.strip i.na{--c:var(--line)}
.pbar{display:flex;align-items:center;gap:8px;min-width:120px}
.pbar .bar{flex:1;height:6px}
.pbar span{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.pages{display:flex;gap:4px}
.pages button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:650;display:grid;place-items:center}
.pages button[aria-current="page"]{background:var(--slate);color:var(--slate-ink);border-color:transparent}
[data-theme="dark"] .pages button[aria-current="page"]{background:var(--sun);color:var(--sun-ink)}
.pages button:disabled{opacity:.4}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:10px;border-radius:12px;background:var(--slate);color:var(--slate-ink);font-size:12.5px;animation:rowIn .3s both}
.bulk .grow{flex:1}
.bulk .btn{min-height:30px}
.ci{display:grid;gap:10px}
.ci-top{display:flex;align-items:center;gap:10px}
.ci-top .av{--s:42px}
.ci-top b{display:block;font-size:13.5px}
.ci p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.45;min-height:34px}
.ci .acts{display:flex;gap:6px}
.ci .acts .btn{flex:1}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof .av{--s:104px;box-shadow:0 0 0 4px var(--card),0 14px 30px -14px rgba(0,0,0,.4)}
.prof .grow{flex:1;min-width:220px}
.prof h1{font-size:30px}
.prof .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prof .chips .chip{background:var(--card);height:26px;border:1px solid var(--line)}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:color-mix(in srgb,var(--ink) 10%,transparent)}
.ring .fl{stroke:var(--sun-deep);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.4,1)}
[data-theme="dark"] .ring .fl{stroke:var(--sun)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:750}
.ladder{display:grid;gap:6px}
.ladder div{display:grid;grid-template-columns:22px 1fr 120px 82px;gap:10px;align-items:center;font-size:12.5px}
.ladder .no{font-weight:800;color:var(--muted);font-size:11px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.steps4 i{height:10px;border-radius:3px;background:var(--well-2)}
.steps4 i.on{background:var(--c)}
.note{padding:10px 12px;border-radius:12px;background:var(--well);margin-bottom:8px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.note .grow{flex:1}
.note small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.mk{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:16px;align-items:stretch}
.mq{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:610px;overflow-y:auto;scrollbar-width:thin}
.mq button{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:center;width:100%;text-align:left;padding:8px 9px;border-radius:11px;border:1px solid transparent;background:none;transition:background .2s,transform .35s,opacity .35s,max-height .35s}
.mq button:hover{background:var(--well)}
.mq button[aria-pressed="true"]{background:var(--sun-soft);border-color:color-mix(in srgb,var(--sun) 60%,transparent)}
.mq .av{--s:32px}
.mq b{display:block;font-size:12.5px;font-weight:650}
.mq small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq li.gone{animation:qOut .45s forwards}
@keyframes qOut{to{opacity:0;transform:translateX(-30px);max-height:0;margin:0}
}
.paper{perspective:1600px;min-width:0}
.paper .flip{position:relative;height:100%;min-height:520px;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.35,1.25,.45,1)}
.paper.flipped .flip{transform:rotateY(180deg)}
.pface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-up);overflow:hidden;display:flex;flex-direction:column}
.pface.back{transform:rotateY(180deg);display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--sun) 45%,var(--card)),var(--card) 62%)}
.p-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line-2)}
.p-head .av{--s:38px}
.p-head .grow{flex:1;min-width:0}
.p-head b{display:block;font-size:14px}
.p-head small{color:var(--muted);font-size:11.5px}
.p-body{flex:1;overflow-y:auto;padding:4px 18px 14px 44px;position:relative;background-image:repeating-linear-gradient(180deg,transparent 0 25px,var(--line-2) 25px 26px);background-position:0 6px;scrollbar-width:thin}
.p-body::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--bad) 45%,transparent)}
.p-body h4{margin:0;font-size:12px;line-height:26px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.p-body p{margin:0;font-size:13.5px;line-height:26px;color:var(--ink)}
.p-body mark{background:color-mix(in srgb,var(--sun) 45%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.p-fig{margin:4px 0 6px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.p-fig svg{display:block;width:100%;height:130px}
.p-fig path.data{fill:none;stroke:var(--c-chem);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:ccDraw 1.4s .2s forwards}
.p-fig circle{fill:var(--card);stroke:var(--c-chem);stroke-width:2}
.p-fig text{font-size:10px;fill:var(--muted)}
.p-fig line{stroke:var(--line)}
.p-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.p-foot .chip{background:var(--well)}
.grade-big{font-size:112px;line-height:.9;font-weight:800;letter-spacing:-.05em;color:var(--ink);text-shadow:0 6px 0 color-mix(in srgb,var(--sun) 70%,transparent)}
.back .score{font-size:15px;font-weight:700;margin-top:10px}
.back p{margin:6px auto 0;max-width:340px;color:var(--muted);font-size:12.5px}
.back .stamp{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 12px;border-radius:999px;background:var(--slate);color:var(--slate-ink);font-size:12px;font-weight:700}
.slide-in{animation:slideIn .45s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(40px) rotate(1.5deg)}
}
.rub{display:grid;gap:10px}
.crit b{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:0 8px;font-size:12.5px;font-weight:650}
.crit b small{color:var(--muted);font-weight:600;font-size:11px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}
.lv button{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:700;color:var(--ink-2);transition:background .2s,transform .15s,color .2s}
.lv button:hover{border-color:var(--faint)}
.lv button[aria-checked="true"]{background:var(--slate);color:var(--slate-ink);border-color:transparent;transform:translateY(-1px)}
[data-theme="dark"] .lv button[aria-checked="true"]{background:var(--sun);color:var(--sun-ink)}
.total{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--well)}
.total .gl{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--sun);color:var(--sun-ink)}
.total b{font-size:16px;font-variant-numeric:tabular-nums}
.total small{display:block;color:var(--muted);font-size:11.5px}
.qc{display:flex;flex-wrap:wrap;gap:5px}
.qc button{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.qc button:hover{background:var(--sun-soft)}
.gb th,.gb td{text-align:center}
.gb th:first-child,.gb td:first-child{text-align:left}
.gcell{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:64px;height:26px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;border:0;background:var(--well);color:var(--ink-2)}
.gcell.gA{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.gcell.gB{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.gcell.gC{background:var(--sun-soft);color:var(--sun-deep)}
[data-theme="dark"] .gcell.gC{color:var(--sun)}
.gcell.gD,.gcell.gE{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.gcell.wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font-weight:650}
.gcell.miss{background:transparent;color:var(--faint)}
.gcell small{font-weight:600;opacity:.75;font-size:10.5px}
.gcell.land{animation:land .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(.4);box-shadow:0 0 0 0 var(--sun)}
40%{transform:scale(1.25);box-shadow:0 0 0 8px color-mix(in srgb,var(--sun) 40%,transparent)}
100%{transform:none;box-shadow:0 0 0 0 transparent}
}
.fly{position:fixed;z-index:70;pointer-events:none;display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--sun);color:var(--sun-ink);font-size:30px;font-weight:800;box-shadow:0 20px 40px -12px rgba(0,0,0,.45)}
.cal-wrap{overflow-x:auto;scrollbar-width:thin}
.cal{--hh:50px;display:grid;grid-template-columns:52px repeat(var(--days,5),minmax(110px,1fr));min-width:640px}
.cal .dh{position:sticky;top:0;padding:6px 8px 8px;text-align:center;border-bottom:1px solid var(--line);background:var(--card);z-index:2}
.cal .dh small{display:block;color:var(--muted);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.cal .dh b{display:inline-grid;place-items:center;width:30px;height:30px;margin-top:2px;border-radius:50%;font-size:14px}
.cal .dh.today b{background:var(--slate);color:var(--slate-ink)}
[data-theme="dark"] .cal .dh.today b{background:var(--sun);color:var(--sun-ink)}
.cal .allday{grid-column:1 / -1;display:grid;grid-template-columns:52px repeat(var(--days,5),minmax(110px,1fr));border-bottom:1px solid var(--line);min-height:34px}
.cal .allday>div{padding:4px;display:grid;gap:3px;align-content:start;border-left:1px solid var(--line-2)}
.cal .allday>div:first-child{border-left:0;font-size:10.5px;color:var(--muted);font-weight:700;padding-top:9px;text-align:right;padding-right:8px}
.due{display:flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:650;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 55%,var(--ink));border:0;text-align:left;white-space:nowrap;overflow:hidden}
.due .ic{width:12px;height:12px;flex:none}
.cal .times{position:relative}
.cal .times span{display:block;height:var(--hh);font-size:10.5px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.cal .day{position:relative;border-left:1px solid var(--line-2);background-image:repeating-linear-gradient(180deg,var(--line-2) 0 1px,transparent 1px var(--hh))}
.cal .day.today{background-color:color-mix(in srgb,var(--sun) 7%,transparent)}
.ev{position:absolute;left:4px;right:4px;padding:5px 7px;border-radius:9px;border:0;text-align:left;background:color-mix(in srgb,var(--c) 20%,var(--card));border-left:3px solid var(--c);color:var(--ink);overflow:hidden;font-size:11.5px;line-height:1.3;transition:transform .2s,box-shadow .2s;animation:evIn .4s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--d,0) * 25ms)}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow-up);z-index:3}
.ev.live b{padding-right:26px}
.ev b{display:block;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--ink-2);font-size:10.5px;white-space:nowrap}
.ev.live::after{content:"LIVE";position:absolute;top:5px;right:6px;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--bad)}
.ev.cancel{opacity:.5;text-decoration:line-through}
@keyframes evIn{from{opacity:0;transform:scale(.94) translateY(6px)}
}
.now-line{position:absolute;left:-1px;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.mini span{color:var(--faint);font-weight:700;font-size:10.5px;padding:4px 0}
.mini button{height:28px;border:0;border-radius:8px;background:none;font-weight:600;color:var(--ink-2);position:relative;font-size:11.5px}
.mini button:hover{background:var(--well)}
.mini button.out{color:var(--faint)}
.mini button.wk{background:var(--sun-soft)}
.mini button.today{background:var(--slate);color:var(--slate-ink)}
[data-theme="dark"] .mini button.today{background:var(--sun);color:var(--sun-ink)}
.mini button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c-office)}
.ag-day{margin-bottom:12px}
.ag-day h3{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.ag-item{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 12px;margin-bottom:5px;border-radius:11px;border:0;border-left:3px solid var(--c);background:var(--well);text-align:left;font-size:12.5px}
.stage{background:var(--slate);color:var(--slate-ink);border-color:transparent;padding:14px}
[data-theme="dark"] .stage{background:#0b0f15;border-color:var(--line)}
.stage-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stage-top h2{margin:0;font-size:15px}
.stage-top small{color:var(--slate-mute)}
.stage-top .grow{flex:1}
.rec{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rec.on{background:color-mix(in srgb,var(--bad) 30%,transparent)}
.rec.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff6b55;animation:pulse 1.4s infinite}

.tile .eq{position:absolute;top:8px;left:8px;display:flex;gap:2px;align-items:flex-end;height:14px}

.side-panel{display:flex;flex-direction:column;padding:0;overflow:hidden}
.side-panel .tabs{display:flex;gap:4px;padding:12px 12px 0;border-bottom:1px solid var(--line)}
.side-panel .tabs button{position:relative;border:0;background:none;padding:8px 10px 10px;font-weight:700;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

.side-panel .tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px;background:var(--sun)}
.side-panel .tabs em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--well-2);font-size:10.5px;display:grid;place-items:center;padding:0 5px}

.msg .av{--s:26px}

.msg.q .txt{padding:6px 9px;border-radius:10px;background:var(--sun-soft);margin-top:3px;display:inline-block}
.composer{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--well);font-size:12.5px}
.composer input:focus{outline:none;border-color:var(--sun-deep)}
.poll-o{margin-bottom:10px}

.th-list{border-right:1px solid var(--line)}

.conv-h small{color:var(--muted);font-size:11.5px}
.conv{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--well);scrollbar-width:thin}
.day-sep{align-self:center;font-size:11px;color:var(--muted);font-weight:650;padding:2px 10px;border-radius:999px;background:var(--card)}
