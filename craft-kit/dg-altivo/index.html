<!doctype html>
<!-- Chill & Craft · Altivo · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altivo · Private jet flight desk</title>
<style>
/* ---------- Altivo look: midnight navy, ivory and champagne gold ---------- */
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--bg:#f4f0e6;--bg2:#ece6d8;--panel:#fffdf7;--panel-solid:#fffdf7;--field:#f8f5ee;--text:#121a2c;--muted:#6c6f7b;--line:#e2d9c6;--grid:#ebe4d4;--accent:#9c7a3f;--accent-ink:#fffdf7;--focus:#2f5bd3;
--good:#1f8a64;--warn:#c27a12;--bad:#c2414e;--c1:#a8823f;--c2:#2f5bd3;--c3:#1f8a64;--c4:#c2414e;--c5:#7f58c9;--c6:#8c8a84;
--r:14px;--rb:10px;--tip-bg:#121a2c;--hover:rgba(156,122,63,.1);--land:#c9bda3;--landfill:rgba(156,122,63,.08);--mapbg:#fffdf7;--route:#9c7a3f;--enter-anim:al-in}
[data-theme=dark]{--bg:#070b14;--bg2:#0d1322;--panel:rgba(255,255,255,.035);--panel-solid:#0f1626;--field:#0b111e;--text:#ece6d6;--muted:#8d90a0;--line:rgba(212,180,131,.16);--grid:rgba(255,255,255,.05);--accent:#d4b483;--accent-ink:#1a1206;--focus:#8fb0ff;
--good:#5fd3a8;--warn:#f0b35b;--bad:#ff7a85;--c1:#d4b483;--c2:#7aa2ff;--c3:#5fd3a8;--c4:#ff7a85;--c5:#b694ff;--c6:#8d8f9a;--tip-bg:#000;--hover:rgba(212,180,131,.09);--land:#4a4434;--landfill:rgba(212,180,131,.05);--mapbg:#0a101c;--route:#d4b483}
/* ---------- Core UI: shared structure. Each app sets its own look with the variables above. ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.55em .95em;border-radius:var(--rb,var(--r));font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .12s,background-color .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active,.ibtn:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.35em .7em;font-size:.78rem}
.btn .ic{width:16px;height:16px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,var(--r));border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s,border-color .2s,background-color .2s;position:relative;flex:none}
.ibtn:hover{border-color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:15px;height:15px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--panel)}
.badge[hidden]{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:.18em .62em;border-radius:99px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h,200) 55% 48%);color:#fff;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
/* staggered page entrance */
.enter{animation:var(--enter-anim,c-rise) .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes c-rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes c-fade{from{opacity:0}}
@keyframes c-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes c-land{0%{transform:scale(1.06)}100%{transform:none}}
.landed{animation:c-land .35s cubic-bezier(.2,.8,.2,1)}
/* tooltip */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;left:0;top:0}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{width:8px;height:8px;border-radius:2px;background:var(--sw)}
.tip .tr span{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
/* modal, drawer, command search */
.ovl{position:fixed;inset:0;z-index:60;background:var(--scrim,rgba(8,10,16,.52));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s}
.ovl.on{opacity:1}
.modal,.drawer,.cmdk{background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal{border-radius:calc(var(--r) + 4px);width:min(540px,100%);max-height:calc(100dvh - 32px);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(780px,100%)}
.modal.small{width:min(420px,100%)}
.ovl.on .modal,.ovl.on .cmdk{transform:none}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;border-width:0 0 0 1px;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ovl.on .drawer{transform:none}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:1.05rem}
.l-body{padding:18px;overflow:auto;flex:1;min-height:0}
.l-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf-msg{color:var(--muted)}
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);border-radius:calc(var(--r) + 4px);transform:translateY(-10px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.cmdk .l-head{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.cmdk .l-body{padding:0}
.ck-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:calc(var(--r) - 2px);text-align:left}
.cmdk li small{color:var(--muted)}
.cmdk li[aria-selected=true] button{background:var(--hover,color-mix(in srgb,var(--accent) 14%,transparent))}
.cmdk .empty{padding:20px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field,var(--bg));border-radius:var(--rb,var(--r));padding:.6em .7em;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.fld textarea{resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:c-shake .3s}
.fld .err{color:var(--bad);font-size:.74rem;font-weight:600}
.fld .err:empty{display:none}
@keyframes c-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent)}
/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar-x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar-x:empty{display:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:0 .65em;background:var(--field,var(--bg));flex:1 1 180px;max-width:300px;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:.55em 0;outline:none;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.32em .8em;font-size:.78rem;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip em{font-style:normal;opacity:.7;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th>button,.tbl th>.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%}
.tbl th>.th{cursor:default}
.tbl th>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th.n>button,.tbl th.n>.th{justify-content:flex-end}
.tbl .si{width:0;height:0;border:4px solid transparent;opacity:.25;border-top-color:currentColor;margin-top:4px}
.tbl th[aria-sort=ascending] .si{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px;opacity:1}
.tbl th[aria-sort=descending] .si{opacity:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl tbody tr[data-id]{cursor:pointer;transition:background-color .15s}
.tbl tbody tr[data-id]:hover{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-u{display:flex;align-items:center;gap:9px}
.cell-u small{display:block;color:var(--muted);font-size:.74rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pager .pg-btns{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:600}
/* popovers: bell and menus */
.pop{position:fixed;z-index:75;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);min-width:190px;max-width:min(350px,calc(100vw - 24px));padding:6px;animation:c-pop .18s ease both}
.pop .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r) - 2px);gap:8px;align-items:center;font-size:.86rem}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 12%,transparent));outline:none}
.bell-pop{width:340px;padding:0}
.bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-l{max-height:340px;overflow:auto;padding:6px}
.bell-i{display:flex;gap:10px;padding:9px 8px;border-radius:calc(var(--r) - 2px);font-size:.84rem}
.bell-i small{display:block;color:var(--muted);font-size:.74rem}
.bell-i.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-i .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.bell-i .dot.warn{background:var(--warn)}.bell-i .dot.bad{background:var(--bad)}.bell-i .dot.ok{background:var(--good)}
/* toasts */
.toasts{position:fixed;z-index:98;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--tip-bg,#16181d);color:var(--tip-ink,#fff);padding:11px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:c-toast .38s cubic-bezier(.2,.8,.2,1) both;font-size:.86rem;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(16px)}
.toast>i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.toast.warn>i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.toast.bad>i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.toast .btn{margin-left:auto;color:inherit;border-color:rgba(255,255,255,.3);background:transparent}
@keyframes c-toast{from{opacity:0;transform:translateY(14px) scale(.96)}}
/* segmented range switch */
.segc{display:inline-flex;position:relative;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:3px;background:var(--field,var(--bg));flex:none}
.segc button{position:relative;z-index:1;border:0;background:transparent;padding:.32em .75em;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:calc(var(--rb,var(--r)) - 2px);transition:color .25s}
.segc button[aria-pressed=true]{color:var(--accent-ink,#fff)}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--rb,var(--r)) - 2px);background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--muted);font-size:10.5px;font-family:var(--font-chart,inherit)}
.ax line{stroke:var(--grid,var(--line));stroke-dasharray:2 4}
.ax .base{stroke-dasharray:none}
.ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:c-draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.fadein{animation:c-fade .9s .3s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:c-grow .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes c-grow{from{transform:scaleY(0)}}
.dim .bar{opacity:.35}.dim .bar.hl{opacity:1}
.sweep{animation:c-sweep 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes c-sweep{from{stroke-dasharray:0 9999}}
.arc{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:auto;flex:none}
.d-c{font-weight:800;fill:var(--text)}.d-l{fill:var(--muted);font-size:11px}
.dleg{display:grid;gap:7px;flex:1;min-width:150px;font-size:.82rem}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;background:var(--sw);flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dleg small{color:var(--muted);width:3.2em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sw)}
.legend i.dash{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sw) 0 4px,transparent 4px 7px)}
.hl-g{opacity:0;transition:opacity .15s;pointer-events:none}
.hl-g line{stroke:var(--muted);stroke-dasharray:3 3}
.hl-g circle{stroke:var(--panel-solid,var(--panel));stroke-width:2}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.hb-t{height:9px;border-radius:9px;background:var(--track,color-mix(in srgb,var(--text) 8%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes c-w{from{width:0}}
.hb b{font-variant-numeric:tabular-nums}
.hm rect{transition:opacity .2s}
.hm .cell{animation:c-fade .5s both}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col-bg,color-mix(in srgb,var(--text) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background-color .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:10px;flex-wrap:wrap}
.kcol-h i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.kcol-h small{margin-left:auto;color:var(--muted);font-weight:600}
.kc-n{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none;position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.kc-f{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.kc-f .ibtn{width:26px;height:26px}
.grip{touch-action:none;cursor:grab}
.k-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:calc(var(--r) - 2px)}
.drop-on{outline-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:85;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.32);transition:none!important;opacity:.95}
body.is-dragging{cursor:grabbing;user-select:none}
/* month calendar */
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mc-h b{min-width:9em;text-align:center}
.mc-h .mc-x{margin-left:auto;display:flex;gap:8px}
.mc-wd,.mc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc-wd span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.mc-days{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mc-d{background:var(--panel-solid,var(--panel));min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.mc-d.out{background:color-mix(in srgb,var(--panel-solid,var(--panel)) 80%,var(--bg))}
.mc-d.out .mc-n{opacity:.4}
.mc-n{border:0;background:transparent;font-size:.74rem;font-weight:700;width:24px;height:24px;border-radius:50%;padding:0}
.mc-d.today .mc-n{background:var(--accent);color:var(--accent-ink,#fff)}
.mc-e{font-size:.7rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--text);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none}
.mc-more{border:0;background:transparent;font-size:.68rem;color:var(--muted);text-align:left;padding:0 4px}
@media (max-width:640px){.mc-d{min-height:64px}.mc-e{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--ec)}}
@media (max-width:540px){.form{grid-template-columns:1fr}.l-body{padding:14px}.toasts{right:12px;left:12px;bottom:12px;max-width:none}}
/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ---------- shell: top navigation ---------- */
body{background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed;font-size:14px}
h1,h2,.serif{font-family:var(--serif);font-weight:500;letter-spacing:.005em}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:0 28px;height:66px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex:none}
.logo b{font-family:var(--serif);font-size:1.32rem;font-weight:500;letter-spacing:.14em}
.logo small{display:block;font-size:.58rem;letter-spacing:.32em;color:var(--accent);text-transform:uppercase;margin-top:-2px}
.tnav{position:relative;display:flex;gap:2px;height:100%;align-items:stretch;margin-left:10px}
.tnav a{display:flex;align-items:center;gap:7px;padding:0 13px;color:var(--muted);text-decoration:none;font-size:.86rem;letter-spacing:.02em;transition:color .25s;position:relative}
.tnav a .ic{width:16px;height:16px}
.tnav a:hover{color:var(--text)}
.tnav a[aria-current=page]{color:var(--text)}
.tnav .nav-marker{position:absolute;bottom:-1px;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 20%,var(--accent) 80%,transparent);transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s,opacity .2s;pointer-events:none}
.tnav .nav-marker::after{content:"";position:absolute;left:50%;top:-4px;width:6px;height:6px;margin-left:-3px;transform:rotate(45deg);background:var(--accent)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.utc{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.utc b{color:var(--text);font-weight:600}
.ibtn{border-radius:50%;background:transparent}
.me{width:36px;height:36px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font-family:var(--serif);font-size:.9rem}
.menu-btn{display:none}
.nav-scrim{display:none}
#view{padding:28px 28px 48px;max-width:1440px;margin:0 auto;overflow-x:clip}
@keyframes al-in{from{opacity:0;filter:blur(6px);transform:translateY(10px)}}
/* ---------- cards ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:2rem;line-height:1.1}
.ph p{color:var(--muted);margin-top:6px;font-size:.88rem}
.ph-x{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;letter-spacing:.2em;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);border-radius:99px;padding:2px 8px}
.live-pill i{width:6px;height:6px;border-radius:50%;background:var(--good);animation:al-pulse 1.8s infinite}
@keyframes al-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;min-width:0;transition:border-color .3s,transform .3s,box-shadow .3s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.kpi:hover,.ac:hover,.crewc:hover{transform:translateY(-3px);box-shadow:0 20px 40px -24px rgba(0,0,0,.5)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:1.12rem}
.card-h small{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{display:flex;flex-direction:column;gap:4px}
.k-i{position:absolute;right:16px;top:16px;color:var(--accent);opacity:.8}
.k-l{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.k-v{font-family:var(--serif);font-size:2rem;font-weight:500;line-height:1.1;margin-top:4px}
.k-d{font-size:.76rem}
.k-d small{color:var(--muted)}
.g{display:grid;gap:14px;margin-bottom:14px}
.g-31{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.btn{border-radius:99px;letter-spacing:.02em}
.btn.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));border:0;box-shadow:0 6px 18px -8px var(--accent)}
.chip{border-radius:99px}
.tag{letter-spacing:.02em}
.tbl th{letter-spacing:.14em;font-size:.64rem}
.dl dd{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
/* ---------- live map ---------- */
.map-card{padding:14px 14px 10px}
.map-wrap{position:relative;border-radius:10px;overflow:hidden;background:var(--mapbg);border:1px solid var(--line)}
.map{display:block;width:100%;height:auto}
.map .sea{fill:var(--mapbg)}
.map .land{fill:url(#dots)}
.map .land2{fill:var(--landfill)}
.map .grat{stroke:var(--grid);stroke-width:.4;fill:none}
.map .rt{fill:none;stroke:var(--route);stroke-width:1;stroke-dasharray:3 3;opacity:.45}
.map .rt-done{fill:none;stroke:var(--route);stroke-width:1.6;stroke-linecap:round;transition:stroke-dasharray 1s linear}
.map .ap circle{fill:var(--panel-solid);stroke:var(--accent);stroke-width:1.2}
.map .ap text{fill:var(--muted);font:600 7.5px var(--mono);letter-spacing:.06em}
.map .base circle.ring{fill:none;stroke:var(--accent);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:al-ring 2.4s ease-out infinite}
@keyframes al-ring{from{transform:scale(.6);opacity:.9}to{transform:scale(3);opacity:0}}
.map .pl{cursor:pointer}
.map .pl.ready{transition:transform 1s linear,opacity .5s}
.map .pl path{fill:var(--accent);stroke:var(--mapbg);stroke-width:1.5}
.map .pl:hover path,.map .pl:focus path{fill:var(--text)}
.map .pl:focus{outline:none}
.map .pl .halo{fill:var(--accent);opacity:.18}
.map-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);padding:10px 4px 2px}
.map-leg span{display:flex;align-items:center;gap:6px}
.air-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.air-list li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background-color .2s}
.air-list li:hover,.air-list li:focus-visible{border-color:var(--accent);background:var(--hover)}
.al-top{display:flex;align-items:center;gap:8px;font-size:.82rem}
.al-top b{font-family:var(--mono);font-size:.78rem}
.al-top span{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.al-route{display:flex;align-items:center;gap:8px;margin:6px 0 6px;font-family:var(--serif);font-size:1.05rem}
.al-route i{flex:1;height:1px;background:var(--line);position:relative}
.al-bar{height:3px;border-radius:2px;background:var(--grid);overflow:hidden}
.al-bar i{display:block;height:100%;width:var(--p);background:var(--accent);transition:width 1s linear}
/* ---------- split-flap flight board ---------- */
.board-card{background:linear-gradient(180deg,#0c111d,#070a12);border-color:#1d2433;color:#f3e7c9}
.board-card .card-h h2{color:#f3e7c9}
.board-card .card-h small{color:#8c8f9c}
.board-card .segc{background:#0b0f19;border-color:#252c3c}
.board-card .segc button{color:#8c8f9c}
.board-card .segc button[aria-pressed=true]{color:#1a1206}
.board-card .segc .thumb{background:#d4b483}
.bwrap{overflow-x:auto}
.board{display:grid;gap:5px;min-width:860px;font-family:var(--mono)}
.brow{display:flex;gap:14px;align-items:center;padding:3px 4px;cursor:pointer;border-radius:4px}
.brow.hd span{flex:none;width:calc(var(--n) * 1.1rem + (var(--n) - 1) * 2px)}
.brow:hover{background:rgba(212,180,131,.06)}
.brow.hd{font-size:.6rem;letter-spacing:.2em;color:#8c8f9c;cursor:default}
.brow.hd:hover{background:none}
.cells{display:flex;gap:2px}
.fc{display:inline-grid;place-items:center;width:1.1rem;height:1.5rem;flex:none;background:linear-gradient(180deg,#1a2030 0 49%,#0b0f18 49% 51%,#151a27 51%);border-radius:3px;font-size:.92rem;font-weight:700;color:#f3e7c9;perspective:120px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.04)}
.fc b{display:block;font-weight:700}
.fc.flip b{animation:al-flip .42s cubic-bezier(.3,.7,.4,1) both;animation-delay:var(--fd,0s)}
@keyframes al-flip{0%{transform:rotateX(90deg);opacity:.2}60%{transform:rotateX(-12deg)}100%{transform:rotateX(0);opacity:1}}
.st-BOARDING .fc{color:#ffd27a}.st-AIRBORNE .fc{color:#7fe3bd}.st-DELAYED .fc{color:#ff8f99}.st-LANDED .fc{color:#9aa3b8}
/* ---------- quote builder ---------- */
.qb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.qprev{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--panel-solid)),var(--panel-solid))}
.qroute{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px}
.qroute b{font-family:var(--serif);font-size:2.2rem;font-weight:500;line-height:1}
.qroute small{display:block;color:var(--muted);font-size:.74rem}
.qarc{width:100%;height:90px;display:block}
.qarc path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.qarc .qp{fill:var(--accent);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.qline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.qline span:last-child{font-variant-numeric:tabular-nums}
.qtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.qtotal b{font-family:var(--serif);font-size:2rem;font-weight:500}
.addons{display:flex;gap:14px;flex-wrap:wrap;grid-column:1/-1}
.addons label{display:flex;gap:6px;align-items:center;font-size:.84rem;cursor:pointer}
.addons input{accent-color:var(--accent);width:16px;height:16px}
/* ---------- fleet and crew ---------- */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ac{cursor:pointer;overflow:hidden}
.ac:focus-visible{outline:2px solid var(--accent)}
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ac-top b{font-family:var(--serif);font-size:1.5rem;font-weight:500;letter-spacing:.04em}
.ac-top small{display:block;color:var(--muted);font-size:.78rem}
.ac svg.jet{display:block;width:100%;height:100px;margin:6px 0}
.jet path{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:.6}
.ac:hover .jet g{transform:translateY(-4px)}
.jet g{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ac-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.74rem;color:var(--muted)}
.ac-meta b{display:block;color:var(--text);font-size:.92rem;font-variant-numeric:tabular-nums}
.chk{height:4px;border-radius:2px;background:var(--grid);margin-top:12px;overflow:hidden}
.chk i{display:block;height:100%;width:var(--w);background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both}
.tl{position:relative;overflow-x:auto}
.tl-in{min-width:760px}
.tl-hd,.tl-row{display:grid;grid-template-columns:150px 1fr;align-items:center}
.tl-days{display:grid;grid-template-columns:repeat(7,1fr);font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tl-days span{padding:6px 4px;border-left:1px solid var(--line)}
.tl-row{border-top:1px solid var(--line);min-height:40px}
.tl-name{font-size:.8rem;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 0;min-width:0}
.tl-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lane{position:relative;height:40px;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100% / 7))}
.duty{position:absolute;top:8px;height:24px;border-radius:6px;background:color-mix(in srgb,var(--dc) 28%,transparent);border:1px solid var(--dc);font:600 .64rem var(--mono);color:var(--text);padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;animation:al-grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;animation-delay:var(--d)}
@keyframes al-grow{from{transform:scaleX(0);opacity:0}}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.crewc{display:flex;gap:12px;align-items:center;cursor:pointer}
.crewc .ring{flex:none;width:58px}
.crewc b{display:block;font-size:.9rem}
.crewc small{display:block;color:var(--muted);font-size:.74rem}
.legs{list-style:none;margin:12px 0;padding:0;border-left:1px dashed var(--accent);margin-left:6px}
.legs li{position:relative;padding:0 0 14px 16px;font-size:.86rem}
.legs li::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel-solid);border:2px solid var(--accent)}
.legs b{font-family:var(--serif);font-size:1.05rem;font-weight:500}
.dsec{margin-top:16px}
.dsec h3{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.minilist{list-style:none;margin:0;padding:0;font-size:.84rem}
.minilist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.steps{list-style:none;margin:14px 0;padding:0;display:flex;gap:4px}
.steps li{flex:1;text-align:center;font-size:.62rem;letter-spacing:.06em;color:var(--muted);padding-top:9px;border-top:2px solid var(--line)}
.steps li.on{border-color:var(--accent);color:var(--text)}
.rates{display:grid;gap:10px}
.rates .rrow{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;font-size:.86rem}
.set-sec{display:grid;gap:12px}
.jetcard{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-right:6px}
.jetcard i{display:block;height:100%;width:var(--w);background:var(--accent)}
/* ---------- responsive ---------- */
@media (max-width:1180px){.tnav a span{display:none}.tnav a{padding:0 11px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-31,.g-21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.top{padding:0 14px;gap:10px}.menu-btn{display:grid}.tnav{position:fixed;top:66px;left:0;bottom:0;width:260px;flex-direction:column;height:auto;margin:0;padding:14px;gap:4px;background:var(--panel-solid);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:40}body.nav-open .tnav{transform:none}.tnav a{padding:12px 14px;border-radius:10px}.tnav a span{display:inline}.tnav a[aria-current=page]{background:var(--hover);color:var(--accent)}.tnav .nav-marker{display:none}body.nav-open .nav-scrim{display:block;position:fixed;inset:66px 0 0;background:rgba(0,0,0,.4);z-index:35}.utc{display:none}.g-2,.qb{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.top{gap:6px;padding:0 10px}.me{display:none}.tright{gap:4px}#view{padding:18px 12px 36px}.ph h1{font-size:1.5rem}.k-v{font-size:1.45rem}.kpis{gap:10px}.card{padding:14px}.logo small{display:none}.logo b{font-size:1.1rem}.qroute b{font-size:1.6rem}}
</style>

<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <button class="ibtn menu-btn" type="button" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="tnav"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <a class="logo" href="#/desk" aria-label="Altivo flight desk home">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="none" stroke="#c9a86b"/><path d="M9 24L17 8l8 16M12.5 18h9" fill="none" stroke="#c9a86b" stroke-width="1.6"/><path d="M4 20c8-3 18-3 26 0" fill="none" stroke="#c9a86b" stroke-width=".8"/></svg>
    <span><b>ALTIVO</b><small>Private aviation</small></span>

</header>
<div class="nav-scrim"></div>
<main id="view" tabindex="-1"></main>
<script>
/* ================= Core helpers (shared by every page of this app) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
let RM = mqRM.matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
let NS = 'craft:';
let APPNAME = 'App';

/* --- seeded random, so the demo data is the same on every load --- */
let _s = 1;
const seed = n => { _s = (n >>> 0) || 1; };

const rf = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Number.isNaN(+v) ? a : Math.max(a, Math.min(b, v));
/* every number written into SVG goes through fin/fx, so NaN or Infinity can never reach an attribute */

const fx = (v, p = 1) => fin(v).toFixed(p);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const lerp = (a, b, t) => a + (b - a) * t;

let CUR = 'Rs ';
const money = (n, d = 0) => (n < 0 ? '-' : '') + CUR + fmt(Math.abs(n), d);
const moneyS = n => (n < 0 ? '-' : '') + CUR + short(Math.abs(n));
const pct = (n, d = 0) => fmt(n, d) + '%';

const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const pad = n => String(n).padStart(2, '0');
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

const fdl = d => DAYN[d.getDay()] + ', ' + fd(d);

/* Data table: search, filter chips, column sort, pagination, row click */

  const tb = el.querySelector('tbody'), info = el.querySelector('.pg-info');
  const rows = () => {

    if (c.filters) { const f = c.filters.find(f => f.label === st.f); if (f && f.fn) r = r.filter(f.fn); }
    if (st.k) r = [...r].sort((a, b) => { const A = a[st.k], B = b[st.k]; return (typeof A === 'number' && typeof B === 'number' ? A - B : A instanceof Date ? A - B : String(A).localeCompare(String(B), undefined, { numeric: true })) * st.d; });

    el.querySelectorAll('th[aria-sort]').forEach(th => { const k = th.querySelector('button').dataset.k; th.setAttribute('aria-sort', k === st.k ? (st.d > 0 ? 'ascending' : 'descending') : 'none'); });

  };
  const s = el.querySelector('.search input'); s && s.addEventListener('input', () => { st.q = s.value.trim(); st.p = 0; draw(); });
  el.addEventListener('click', e => {
    const ch = e.target.closest('.chip'); if (ch && el.contains(ch) && ch.closest('.tbar')) { st.f = ch.dataset.f; st.p = 0; el.querySelectorAll('.tbar .chip').forEach(b => b.setAttribute('aria-pressed', b === ch)); draw(); return; }

  draw();
  return { draw, st };
}

function live(t) {
  if (!t.today) return { s: t.status === 'Completed' ? 'LANDED' : t.status === 'Cancelled' ? 'CANCELLED' : 'SCHEDULED', p: t.status === 'Completed' ? 1 : 0 };
  const dep = t.date.getTime() + (t.delay || 0) * 60000, arr = dep + t.dur * 3600000, n = Date.now();
  if (n >= arr) return { s: 'LANDED', p: 1, dep, arr };
  if (n >= dep) return { s: 'AIRBORNE', p: (n - dep) / (arr - dep), dep, arr };
  if (t.delay && n < dep) return { s: 'DELAYED', p: 0, dep, arr };
  if (dep - n < 40 * 60000) return { s: 'BOARDING', p: 0, dep, arr };
  return { s: 'SCHEDULED', p: 0, dep, arr };
}

page('crew', 'Crew', v => {
  let role = 'All';
  v.innerHTML = pageHead('Crew', 'Duty for the next seven days and flight hours against the 100-hour, 28-day limit.', `<div class="chips" id="cc" role="group" aria-label="Filter crew"></div>`) + `<section class="kpis" id="ck"></section><section class="card"><div class="card-h"><h2>Duty timeline</h2><div class="legend" style="margin:0"><span><i style="--sw:var(--c1)"></i>Flight duty</span><span><i style="--sw:var(--c2)"></i>Standby</span><span><i style="--sw:var(--warn)"></i>Leave</span></div></div><div class="tl"><div class="tl-in" id="tl"></div></div></section><section class="card" style="margin-top:14px"><div class="card-h"><h2>Hours in the last 28 days</h2></div><div class="crew" id="cg"></div></section>`;
  const days = Array.from({ length: 7 }, (_, i) => addDays(NOW, i)), t0 = NOW.getTime(), span = 7 * DAY;
  const draw = () => {
    $('#cc', v).innerHTML = ['All', 'Captain', 'First officer', 'Cabin crew'].map(s => `<button class="chip" type="button" aria-pressed="${s === role}" data-f="${s}">${s === 'All' ? 'All crew' : s + 's'}</button>`).join('');
    const list = DB.crew.filter(c => role === 'All' || c.role === role);
    $('#tl', v).innerHTML = `<div class="tl-hd"><span></span><div class="tl-days">${days.map(d => `<span>${DAYN[d.getDay()]} ${d.getDate()}</span>`).join('')}</div></div>` + list.map((c, ci) => {
      const duty = DB.trips.filter(t => t.crew.includes(c.name) && t.status !== 'Cancelled' && t.date.getTime() + t.dur * 36e5 > t0 && t.date.getTime() < t0 + span);
      const blocks = c.status === 'Leave' ? `<div class="duty" style="left:0;width:100%;--dc:var(--warn);--d:${ci * 40}ms" data-cr="${c.id}">On leave</div>` : duty.map(t => { const s = Math.max(0, (t.date.getTime() - 36e5 - t0) / span), e = Math.min(1, (t.date.getTime() + (t.dur + .5) * 36e5 - t0) / span); return `<div class="duty" style="left:${(s * 100).toFixed(2)}%;width:${Math.max(1.5, (e - s) * 100).toFixed(2)}%;--dc:var(--c1);--d:${ci * 40}ms" data-trip="${t.id}" title="${t.flt} ${t.from} to ${t.to}">${t.from}–${t.to}</div>`; }).join('') + (ci % 3 === 1 ? `<div class="duty" style="left:${(5 / 7 * 100).toFixed(2)}%;width:${(1 / 7 * 100 * .5).toFixed(2)}%;--dc:var(--c2);--d:${ci * 40}ms" data-cr="${c.id}">Standby</div>` : '');
      return `<div class="tl-row"><div class="tl-name">${avatar(c.name)}<span>${esc(c.name)}</span></div><div class="tl-lane">${blocks}</div></div>`;
    }).join('');
    $('#cg', v).innerHTML = list.map(c => `<div class="card crewc" data-cr="${c.id}" tabindex="0" role="button" aria-label="${esc(c.name)}, ${c.h28} hours of 100"><div class="ring chart" data-ring="${c.id}"></div><div><b>${esc(c.name)}</b><small>${c.role} · ${esc(c.lang)}</small>${tagS(c.status)}</div></div>`).join('');
    list.forEach(c => gauge($(`[data-ring="${c.id}"]`, v), { value: c.h28, max: 100, size: 64, thick: 6, color: c.h28 > 85 ? 'var(--bad)' : c.h28 > 70 ? 'var(--warn)' : 'var(--accent)', fmt: x => Math.round(x) + 'h', label: c.name }));
    $('#ck', v).innerHTML = [{ label: 'Crew', value: DB.crew.length, icon: 'users' }, { label: 'On leave', value: DB.crew.filter(c => c.status === 'Leave').length, icon: 'cal' }, { label: 'Near the hour limit', value: DB.crew.filter(c => c.h28 > 85).length, icon: 'alert' }, { label: 'Licences expiring in 60 days', value: DB.crew.filter(c => (c.license - NOW) / DAY < 60).length, icon: 'shield' }].map(kpiHTML).join(''); counts($('#ck', v));
  };
  draw(); pageRefresh = draw;
  $('#cc', v).onclick = e => { const b = e.target.closest('[data-f]'); if (b) { role = b.dataset.f; draw(); } };
  const openC = c => { const L = drawer({ title: esc(c.name), body: `${tagS(c.status)}<dl class="dl" style="margin-top:14px"><dt>Role</dt><dd>${c.role}</dd><dt>Base</dt><dd>${c.base}</dd><dt>Languages</dt><dd>${esc(c.lang)}</dd><dt>Hours, 28 days</dt><dd>${c.h28} of 100</dd><dt>Licence valid until</dt><dd>${fdy(c.license)}</dd></dl><div class="dsec"><h3>Assigned flights</h3><ul class="minilist">${DB.trips.filter(t => t.crew.includes(c.name) && t.date >= addDays(NOW, -1) && t.status !== 'Cancelled').sort((a, b) => a.date - b.date).slice(0, 6).map(t => `<li><span class="mono">${t.flt}</span><span>${t.from} → ${t.to}</span><span>${fd(t.date)}</span></li>`).join('') || '<li>None</li>'}</ul></div>`, foot: `<button class="btn pri" type="button" data-lv>${c.status === 'Leave' ? 'Back from leave' : 'Mark on leave'}</button>` }); L.el.querySelector('[data-lv]').onclick = () => { if (c.status !== 'Leave' && DB.trips.some(t => t.crew.includes(c.name) && t.date >= NOW && t.status === 'Confirmed')) { toast(`${c.name} is on booked flights. Reassign them first.`, 'bad'); return; } c.status = c.status === 'Leave' ? 'Available' : 'Leave'; L.close(); draw(); toast(`${c.name} is now ${c.status === 'Leave' ? 'on leave' : 'available'}`); }; };
  v.addEventListener('click', e => { const t = e.target.closest('[data-trip]'); if (t) { openTrip(DB.trips.find(x => x.id === t.dataset.trip), draw); return; } const c = e.target.closest('[data-cr]'); if (c) openC(DB.crew.find(x => x.id === c.dataset.cr)); });
  v.addEventListener('keydown', e => { const c = e.target.closest('.crewc'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openC(DB.crew.find(x => x.id === c.dataset.cr)); } });
});

/* --- Clients --- */
page('clients', 'Clients', (v, p) => {
  const r = resourcePage(v, {
    title: 'Clients', sub: 'People and companies who fly with us, with their tiers and preferences.', noun: 'client', data: () => DB.clients, sort: 'spend', param: p,
    cols: [C.who('name', 'Client', 'co'), C.tag('tier', 'Tier'), { k: 'cardH', label: 'Jet card', f: (x, c) => c.tier === 'Jet card' ? `<span class="jetcard"><i style="--w:${Math.min(100, x / 50 * 100)}%"></i></span>${x} h` : '<span class="muted">–</span>' }, { k: 'trips', label: 'Trips', num: true }, C.money('spend', 'Lifetime spend'), C.txt('pref', 'Preference')],
    filters: sF('tier', ['Platinum', 'Gold', 'Jet card', 'Standard']),
    kpis: d => [{ label: 'Clients', value: d.length, icon: 'users' }, { label: 'Lifetime revenue', value: sum(d.map(c => c.spend)), f: 'moneyS', icon: 'money' }, { label: 'Jet card hours left', value: sum(d.map(c => c.cardH)), icon: 'clock' }, { label: 'Platinum', value: d.filter(c => c.tier === 'Platinum').length, icon: 'star' }],
    fields: [{ k: 'name', label: 'Full name', req: true }, { k: 'co', label: 'Company', req: true }, { k: 'email', label: 'Email', type: 'email', req: true }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'tier', label: 'Tier', type: 'select', options: ['Standard', 'Gold', 'Platinum', 'Jet card'] }, { k: 'pref', label: 'On-board preferences', type: 'textarea' }],
    make: x => ({ id: 'CL' + ri(200, 999), ...x, cardH: x.tier === 'Jet card' ? 25 : 0, spend: 0, trips: 0, since: NOW.getFullYear() }),
    detail: c => `${tagS(c.tier)}<dl class="dl" style="margin-top:14px"><dt>Company</dt><dd>${esc(c.co)}</dd><dt>Email</dt><dd>${esc(c.email)}</dd><dt>Phone</dt><dd>${esc(c.phone)}</dd><dt>Client since</dt><dd>${c.since}</dd><dt>Lifetime spend</dt><dd>${money(c.spend)}</dd>${c.tier === 'Jet card' ? `<dt>Jet card balance</dt><dd>${c.cardH} hours</dd>` : ''}</dl><div class="dsec"><h3>Preferences</h3><p>${esc(c.pref)}</p></div><div class="dsec"><h3>Recent trips</h3><ul class="minilist">${DB.trips.filter(t => t.client === c.name).slice(0, 5).map(t => `<li><span>${route(t.from, t.to)}</span><span>${fd(t.date)}</span>${tagS(t.status)}</li>`).join('') || '<li>No trips yet</li>'}</ul></div>`,
    dActions: c => c.tier === 'Jet card' ? `<button class="btn" type="button" data-top>${ic('plus')}Top up hours</button>` : '',
    onDetail: (el, c, L, refresh) => { const b = el.querySelector('[data-top]'); b && (b.onclick = () => { L.close(); formModal({ title: 'Top up jet card · ' + c.name, fields: [{ k: 'h', label: 'Hours to add', type: 'select', options: [10, 25, 50, 100] }], intro: `<p class="muted" style="margin-bottom:12px">Current balance: ${c.cardH} hours</p>`, submit: 'Add hours', onSubmit: x => { c.cardH += +x.h; c.spend += +x.h * 6800; refresh(); Bell.add(`${c.name} topped up ${x.h} hours`, 'Invoice sent', 'ok'); } }); }); }
  });
  pageRefresh = r.refresh;
});

/* --- Finance --- */
page('finance', 'Finance', v => {
  let rg = '12M';
  v.innerHTML = pageHead('Finance', 'Charter revenue, operating cost and what clients still owe.', '<div id="frg"></div>') + `<section class="kpis" id="fk"></section><div class="g g-21"><section class="card"><div class="card-h"><h2>Revenue and cost</h2></div><div class="chart" id="frc"></div></section><section class="card"><div class="card-h"><h2>Revenue by aircraft size</h2></div><div class="chart" id="fd"></div></section></div><section class="card"><div class="card-h"><h2>Invoices</h2></div><div class="dt" id="fi"></div></section>`;
  const draw = () => {
    const ms = rg === '6M' ? DB.months.slice(-6) : rg === '3M' ? DB.months.slice(-3) : DB.months, rev = sum(ms.map(m => m.rev)), cost = sum(ms.map(m => m.cost));
    barChart($('#frc', v), { labels: ms.map(m => m.m), series: [{ name: 'Revenue', data: ms.map(m => m.rev), color: 'var(--c1)' }, { name: 'Cost', data: ms.map(m => m.cost), color: 'var(--c2)' }], h: 240, tfmt: money, yfmt: x => '$' + short(x) });
    $('#fk', v).innerHTML = [{ label: 'Revenue', value: rev, f: 'moneyS', icon: 'chart', note: rg === '12M' ? 'last 12 months' : 'last ' + rg.replace('M', ' months') }, { label: 'Margin', value: (rev - cost) / rev * 100, f: 'pct1', icon: 'up' }, { label: 'Revenue per flight hour', value: rev / sum(ms.map(m => m.hours)), f: 'money', icon: 'clock' }, { label: 'Owed by clients', value: sum(DB.inv.filter(i => i.status !== 'Paid').map(i => i.amount)), f: 'moneyS', icon: 'wallet' }].map(kpiHTML).join(''); counts($('#fk', v));
    donut($('#fd', v), { data: Object.keys(CAT).map((c, i) => ({ label: c, value: sum(DB.trips.filter(t => t.cat === c && t.status === 'Completed').map(t => t.price)), color: `var(--c${i + 1})` })), vfmt: moneyS, centerLabel: 'completed trips' });
    it.draw();
  };
  const it = DataTable($('#fi', v), { rows: () => DB.inv, sort: 'issued', ph: 'Search invoices…', filters: sF('status', ['Pending', 'Overdue', 'Paid']), cols: [C.id(), C.who('client', 'Client'), C.txt('trip', 'Trip'), C.date('issued', 'Issued'), C.money('amount', 'Amount'), C.tag('status', 'Status')], onRow: x => { const L = drawer({ title: 'Invoice ' + x.id, body: `${tagS(x.status)}<dl class="dl" style="margin-top:14px"><dt>Client</dt><dd>${esc(x.client)}</dd><dt>Trip</dt><dd class="mono">${x.trip}</dd><dt>Issued</dt><dd>${fdy(x.issued)}</dd><dt>Due</dt><dd>${fdy(addDays(x.issued, 14))}</dd><dt>Amount</dt><dd>${money(x.amount)}</dd></dl>`, foot: x.status !== 'Paid' ? `<button class="btn" type="button" data-rem>${ic('send')}Send reminder</button><button class="btn pri" type="button" data-paid>${ic('check')}Mark paid</button>` : `<button class="btn" type="button" data-rem>${ic('send')}Email receipt</button>` }); L.el.querySelector('[data-rem]').onclick = () => toast('Email sent to ' + x.client); const pd = L.el.querySelector('[data-paid]'); pd && (pd.onclick = () => { x.status = 'Paid'; L.close(); draw(); Bell.add(`${x.id} paid`, money(x.amount) + ' from ' + x.client, 'ok'); }); } });
  segmented($('#frg', v), ['3M', '6M', '12M'], rg, r => { rg = r; draw(); }); draw(); pageRefresh = draw;
});

/* --- Settings --- */
page('settings', 'Settings', v => {
  v.innerHTML = pageHead('Settings', 'Company details, charter rates and how the desk looks.') + `<div class="g g-2"><section class="card"><div class="card-h"><h2>Company</h2></div><form class="form" id="sf" novalidate>${formHTML([{ k: 'name', label: 'Company name', req: true, full: true }, { k: 'base', label: 'Home base', type: 'select', options: apOpts() }, { k: 'phone', label: 'Desk phone', type: 'tel', req: true }, { k: 'email', label: 'Desk email', type: 'email', req: true, full: true }], DB.set)}<div class="fld full"><button class="btn pri" type="submit">${ic('check')}Save</button></div></form></section>
  <section class="card"><div class="card-h"><h2>Hourly rates, USD</h2></div><form class="rates" id="rf" novalidate>${Object.keys(CAT).map(c => `<div class="rrow"><label for="r-${c}">${c} <small class="muted">· ${MODELS[c]}</small></label><input class="inp" id="r-${c}" type="number" min="500" step="100" value="${DB.set.rates[c]}"></div>`).join('')}<span class="err" id="rerr" style="color:var(--bad);font-size:.78rem"></span><button class="btn pri" type="submit" style="justify-self:start">${ic('check')}Save rates</button></form></section></div>
  <div class="g g-2"><section class="card set-sec"><div class="card-h" style="margin:0"><h2>Display and alerts</h2></div>${switchHTML('s-dark', 'Dark theme', Theme.get() === 'dark')}${switchHTML('s-rm', 'Reduce motion', document.documentElement.classList.contains('rm'))}${switchHTML('s-n1', 'Alert me when a flight departs or lands', true)}${switchHTML('s-n2', 'Alert me about delays', true)}</section><section class="card"><div class="card-h"><h2>Demo data</h2></div><p class="muted" style="margin-bottom:14px">All flights, clients and money here are invented. Reset to start again.</p><button class="btn danger" type="button" data-reset>${ic('refresh')}Reset demo data</button></section></div>`;
  $('#sf', v).addEventListener('submit', e => { e.preventDefault(); const x = readForm(e.target, [{ k: 'name', label: 'Company name', req: true }, { k: 'base', label: 'Base' }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'email', label: 'Email', type: 'email', req: true }]); if (x) { Object.assign(DB.set, x); toast('Company details saved'); } });
  $('#rf', v).addEventListener('submit', e => { e.preventDefault(); let ok = true; Object.keys(CAT).forEach(c => { const i = $('#r-' + c, v), n = +i.value; i.setAttribute('aria-invalid', !(n >= 500)); if (!(n >= 500)) ok = false; }); $('#rerr', v).textContent = ok ? '' : 'Every rate must be at least $500 an hour.'; if (!ok) return; Object.keys(CAT).forEach(c => DB.set.rates[c] = +$('#r-' + c, v).value); toast('Rates saved. New quotes use them.'); });
  $('#s-dark', v).onchange = e => Theme.set(e.target.checked ? 'dark' : 'light');
  $('#s-rm', v).onchange = e => { RM = e.target.checked; document.documentElement.classList.toggle('rm', RM); toast(RM ? 'Motion reduced' : 'Motion back on'); };
  ['#s-n1', '#s-n2'].forEach(s => $(s, v).onchange = () => toast('Alert setting saved'));
  $('[data-reset]', v).onclick = async () => { if (await confirmBox('Reset all demo data? Your changes will be lost.', { ok: 'Reset data' })) { DB = makeData(); Bell.list = []; Bell.badge(); toast('Demo data reset'); location.hash = '#/desk'; } };
});

/* ================= Start ================= */
DB = makeData();
Theme.init();
Bell.init($('[data-bell]'));
Bell.add('A6-ALR is in maintenance', 'Scheduled 600-hour check', 'warn', true);
Bell.add('Quote Q-612 accepted', 'Sofia Marchetti · NCE to DXB', 'ok', true);
Cmdk.extra = [{ label: 'New quote', hint: 'Action', run: () => { location.hash = '#/quotes'; } }, { label: 'Add aircraft', hint: 'Action', run: () => { location.hash = '#/fleet'; setTimeout(() => { const b = $('[data-add]'); b && b.click(); }, 300); } }, { label: 'Toggle dark theme', hint: 'Action', run: () => Theme.toggle() }];
const tick = () => { const d = new Date(); $('#utc').textContent = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); const dx = new Date(d.getTime() + 4 * 36e5); $('#lt').textContent = 'Dubai ' + pad(dx.getUTCHours()) + ':' + pad(dx.getUTCMinutes()); };
tick(); every(10000, tick, true);
Router.start();
</script>
</body>
</html>
