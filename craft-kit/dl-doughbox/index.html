<!doctype html>
<!-- Chill & Craft · Doughbox · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doughbox · Business banking for bakeries</title>
<meta name="description" content="A business banking and spending app for a bakery with three shops: account jars you pour between, staff cards, payments, transactions, shops and team.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem("cc-doughbox-1:theme")); } catch (e) { s = null; }
    var t = q === "light" || q === "dark" ? q : s || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* =========================================================
   Base: shared structure. The skin below sets the colours,
   shapes and layout that make this dashboard its own.
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-h,inherit);margin:0;line-height:1.2}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted,.mut{color:var(--muted)}
.sm{font-size:.86em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w,240px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--side,var(--panel));color:var(--side-ink,var(--ink));overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.15em;padding:4px 8px 14px}
.brand svg{width:30px;height:30px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm,8px);text-decoration:none;color:var(--side-mut,var(--muted));font-weight:600;transition:color .2s}
.nav a:hover{color:var(--side-ink,var(--ink))}
.nav a[aria-current="page"]{color:var(--nav-on,var(--acc-ink))}
.nav-marker{position:absolute;left:0;top:0;width:100%;height:40px;border-radius:var(--r-sm,8px);background:var(--acc);opacity:0;transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s,width .3s,opacity .2s;pointer-events:none;z-index:0}
.nav-sec{font-size:.7em;text-transform:uppercase;letter-spacing:.14em;color:var(--side-mut,var(--muted));padding:14px 12px 4px;opacity:.8}
.nav-n{margin-left:auto;font-style:normal;font-size:.72em;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.main{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 26px;background:var(--top-bg,transparent)}
.top h1{font-size:1.35em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:6px 26px 40px;outline:none}
.menu-btn{display:none!important}
.nav-scrim{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.ph h2{font-size:1.45em;margin-right:auto}
.ph p{width:100%;margin:0;color:var(--muted)}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}
 body.nav-open .side{transform:none}
 body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;animation:fadeIn .25s}
 .menu-btn{display:inline-grid!important}
 .top{padding:12px 16px}
 .view{padding:4px 16px 32px}
}

/* ---------- Grid and cards ---------- */
.grid{display:grid;gap:var(--gap,16px);margin-bottom:var(--gap,16px)}
.g-k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.span2{grid-column:span 2}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--panel);border:var(--card-bd,1px solid var(--line));border-radius:var(--r,14px);padding:var(--pad,18px);box-shadow:var(--shadow,none);transition:transform .3s cubic-bezier(.3,.8,.3,1),box-shadow .3s,border-color .3s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h,var(--shadow,none))}
.card.flat:hover{transform:none}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{font-size:1.02em;margin-right:auto}
.ch .sub{color:var(--muted);font-size:.84em;font-weight:500}
.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:650}
.li small{color:var(--muted)}

/* ---------- KPI cards ---------- */
.kpi{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.kpi-i{position:absolute;right:14px;top:14px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--acc)}
.kpi-l{color:var(--muted);font-size:.84em;font-weight:650}
.kpi-v{font-size:1.65em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--font-n,inherit);white-space:nowrap}
.kpi-d{display:inline-flex;align-items:center;gap:2px;font-size:.8em;font-weight:700}
.kpi-d small{font-weight:500;color:var(--muted)}
.kpi-d .i{width:15px;height:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi-s{font-size:.82em;color:var(--muted)}
.kpi-sp{margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-btn,var(--r-sm,9px));cursor:pointer;font-weight:650;font-size:.93em;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s,color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn:active,.icon-btn:active,.chip:active,.seg button:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:var(--btn-sh,none)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.84em}
.btn .i{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm,9px);cursor:pointer;transition:transform .12s,background .2s,border-color .2s;flex:none;padding:0}
.icon-btn:hover{border-color:var(--acc)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm .i{width:15px;height:15px}
.icon-btn[disabled]{opacity:.4;cursor:default}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ring{animation:ring .7s}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
[data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
.kbd{font-size:.75em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- Inputs and forms ---------- */
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-in,var(--r-sm,9px));background:var(--in-bg,var(--panel));color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=range]{padding:0;min-height:24px;accent-color:var(--acc);border:0;background:none;box-shadow:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:.84em;font-weight:650;color:var(--muted)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:.8em}
.err:empty{display:none}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog span{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);transition:background .25s;flex:none}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span::after{transform:translateX(17px)}
.tog input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.srch input{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.84em;font-weight:650;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--r-sm,9px);background:var(--panel2);border:1px solid var(--line);flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-weight:650;font-size:.84em;color:var(--muted);cursor:pointer;border-radius:calc(var(--r-sm,9px) - 2px);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--seg-on,var(--ink))}
.seg-th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-sm,9px) - 2px);background:var(--seg-th,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .3s}

/* ---------- Tables ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar .srch{flex:1 1 200px;max-width:320px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92em}
.tbl th{text-align:left;font-size:.76em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num,.tbl td.num{text-align:right}
.th-s{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.th-s:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th-s .ar{opacity:.45;font-size:.85em}
[aria-sort] .th-s{color:var(--ink)}
[aria-sort] .ar{opacity:1;color:var(--acc)}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover,tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--acc) 8%,transparent))}
tr.click:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.rows-in tr{animation:rowIn .4s both;animation-delay:calc(var(--ri,0) * 30ms)}
@keyframes rowIn{from{opacity:0;translate:0 6px}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85em;color:var(--muted)}
.pg-b{display:flex;gap:4px;align-items:center}
.pgn{min-width:30px;height:30px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;font-weight:650;color:var(--muted)}
.pgn[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.cell2{display:flex;align-items:center;gap:10px;min-width:0}
.cell2 b{display:block;font-weight:650}
.cell2 small{display:block;color:var(--muted);font-size:.85em}

/* ---------- Status pills, avatars, meters ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.77em;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--pc,var(--muted)) 15%,transparent);color:var(--pc,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-paid,.s-approved,.s-active,.s-valid,.s-signed,.s-done,.s-accepted,.s-booked{--pc:var(--ok)}
.s-sent,.s-review,.s-open,.s-scheduled,.s-partial{--pc:var(--info)}
.s-pending,.s-expiring,.s-unsigned,.s-leave{--pc:var(--warn)}
.s-overdue,.s-rejected,.s-expired,.s-frozen,.s-cancelled,.s-declined{--pc:var(--bad)}
.s-draft{--pc:var(--muted)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-av,50%);background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 26%);font-weight:800;font-size:.76em;flex:none;letter-spacing:.02em}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:54px;height:54px;font-size:1em}
.av.sm{width:26px;height:26px;font-size:.66em}
.meter{display:block;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--acc);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.6}
.empty b{color:var(--ink)}
.empty.sm{padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.88em}
.kv dd{margin:0;font-weight:600;text-align:right}

/* ---------- Modals, drawers, menus, command search ---------- */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.ov-bg{position:absolute;inset:0;background:var(--ov,rgba(10,12,20,.5));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.dlg{position:relative;width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;background:var(--dlg-bg,var(--panel));color:var(--ink);border:1px solid var(--line);border-radius:var(--r-dlg,var(--r,16px));box-shadow:0 30px 80px rgba(0,0,0,.35);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1.1)}
.ov.open .ov-bg{opacity:1}
.ov.open .dlg{opacity:1;transform:none}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dlg-h h2{font-size:1.12em;margin-right:auto}
.dlg-b{padding:6px 18px 16px;overflow:auto}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.ov.sm .dlg{width:min(400px,100%)}
.ov.wide .dlg{width:min(760px,100%)}
.ov.xl .dlg{width:min(1120px,100%);max-height:94vh}
.ov.drawer{place-items:stretch end;padding:0}
.ov.drawer .dlg{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(100%)}
.ov.drawer.wide .dlg{width:min(640px,100%)}
.ov.drawer.open .dlg{transform:none}
.ov.pop{place-items:start end;padding:64px 16px 16px}
.ov.pop .ov-bg,.ov.menu .ov-bg{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.ov.pop .dlg{width:min(370px,100%);transform:translateY(-8px) scale(.98);transform-origin:top right}
.ov.menu{display:block;padding:0}
.ov.menu .dlg{position:fixed;width:220px;transform:translateY(-6px);border-radius:12px}
.ov.menu .dlg-h{padding:10px 12px 4px}
.ov.menu .dlg-h h2{font-size:.76em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ov.menu .dlg-h .icon-btn{display:none}
.ov.menu .dlg-b{padding:2px 6px 6px}
.mnu{display:flex;flex-direction:column}
.mi{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--panel2)}
.mi[disabled]{opacity:.55;cursor:default}
.ov.cmdk{place-items:start center;padding-top:12vh}
.cmd-l{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cmd-l button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.cmd-l [aria-selected="true"] button,.cmd-l button:hover{background:var(--panel2)}
.cmd-l small{color:var(--muted)}
.srch.big input{min-height:46px;font-size:1.05em}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.notes li{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.notes li.new{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.notes li small{display:block;color:var(--muted);font-size:.8em}
.notes .i{color:var(--acc);margin-top:2px}
@media (max-width:560px){.ov{padding:0;place-items:end stretch}.ov .dlg{width:100%;border-radius:var(--r-dlg,16px) var(--r-dlg,16px) 0 0;max-height:92vh}.ov.drawer .dlg{border-radius:0}.ov.pop{padding:56px 8px 8px}.ov.menu .dlg{width:220px;border-radius:12px}.ov.cmdk{padding-top:0}}

/* ---------- Toasts and tooltip ---------- */
.toasts{position:fixed;right:18px;bottom:var(--toast-b,18px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm,10px);background:var(--toast-bg,#16181d);color:var(--toast-ink,#fff);box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;font-size:.92em;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:min(380px,calc(100vw - 36px))}
.toast.show{opacity:1;transform:none}
.toast .i{color:var(--ok)}.toast.bad .i{color:var(--bad)}.toast.warn .i{color:var(--warn)}
.t-undo{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
@media (max-width:560px){.toasts{left:12px;right:12px;align-items:stretch}}
.tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip div i{width:8px;height:8px;border-radius:3px;flex:none}
.tip div span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tip .mut{opacity:.75;display:block}

/* ---------- Charts ---------- */
.chart{position:relative;min-width:0;outline:none}
.chart svg{display:block;overflow:visible}
.chart:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.gl{stroke:var(--grid,var(--line));stroke-dasharray:3 4}
.zl{stroke:var(--muted);stroke-width:1;opacity:.6}
.ax{fill:var(--muted);font-size:11px;font-family:var(--font-n,inherit)}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 6;opacity:.9}
.ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawOn 1.3s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes drawOn{to{stroke-dashoffset:0}}
.ar.fade,.band.fade{animation:fadeIn 1.2s .35s both}
.band{opacity:.2}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--panel);stroke-width:2.5}
.bar{transition:opacity .2s}
.bar.dim{opacity:.35}
.bar.grow{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .75s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d,0ms)}
.bar.grow.neg{transform-origin:50% 0}
@keyframes barUp{from{transform:scaleY(0)}}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82em;color:var(--muted);margin-bottom:8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.spk{display:block;overflow:visible}
.spk .ln{stroke-width:2}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dn-w{position:relative;flex:none}
.seg-bg{fill:none;stroke:var(--panel2)}
.dseg{fill:none;transition:opacity .2s;cursor:pointer}
.dseg.dim{opacity:.28}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.25em;font-weight:800}
.dn-c small{color:var(--muted);font-size:.76em}
.dn-l{list-style:none;margin:0;padding:0;flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dn-l li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.88em;transition:background .2s;outline-offset:-2px}
.dn-l li.on{background:var(--panel2)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);font-size:.9em;min-width:34px;text-align:right}
.hb{margin-bottom:11px}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:.88em;margin-bottom:5px}
.hb-l small{display:block;color:var(--muted);font-size:.85em}
.hb-t{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.gg{position:relative;max-width:240px;margin:0 auto}
.gg svg{display:block}
.gg-bg,.gg-v{fill:none;stroke-linecap:round}
.gg-bg{stroke:var(--panel2)}
.gg-t{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-t b{display:block;font-size:1.55em;font-weight:800;line-height:1.1}
.gg-t small{color:var(--muted);font-size:.8em}
.hm{display:grid;gap:3px;font-size:.72em}
.hm-x,.hm-y{color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.hm-y{text-align:right;padding-right:6px;align-self:center}
.hm-c{aspect-ratio:1.4;border-radius:4px;background:color-mix(in srgb,var(--hm,var(--acc)) var(--a),var(--panel2));animation:fadeIn .5s both;animation-delay:var(--d)}
.hm-c:hover{outline:2px solid var(--ink);outline-offset:-1px}

/* ---------- Drag and drop ---------- */
.drag-ghost{box-shadow:0 24px 50px rgba(0,0,0,.3);opacity:.96;transition:none!important;animation:none!important}
.drop-ph{border:2px dashed var(--acc);border-radius:var(--r-sm,10px);background:color-mix(in srgb,var(--acc) 8%,transparent);margin-bottom:8px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.over{outline:2px dashed var(--acc);outline-offset:-3px}
.dropped{animation:drop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:scale(1.06)}}
.grip{cursor:grab;touch-action:none;border:0;background:none;color:var(--muted);padding:2px;display:inline-grid;place-items:center}

/* ---------- Reduced motion: keep it calm ---------- */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* =========================================================
   Skin: Doughbox (soft neumorphic cream, chocolate and strawberry; icon rail and bottom tab bar)
   ========================================================= */
/* Tokens: soft dough cream with chocolate ink and strawberry; dark is espresso */
:root{
  --font:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs:14.5px;--r:24px;--r-sm:14px;--r-btn:16px;--side-w:92px;--gap:20px;--pad:22px;
  --bg:#f3e9dc;--panel:#f3e9dc;--panel2:#eadcca;--ink:#4a2c20;--muted:#8a6f60;--line:rgba(74,44,32,.1);
  --acc:#e85d75;--acc-ink:#fff;--ok:#3f9d6b;--warn:#c4840e;--bad:#d9443c;--info:#4f7fc6;
  --c1:#e85d75;--c2:#4a2c20;--c3:#8fbf6a;--c4:#f2b84b;--c5:#7d9be0;--c6:#c98a5a;
  --hi:rgba(255,255,255,.85);--lo:rgba(166,124,92,.32);
  --shadow:7px 7px 16px var(--lo),-7px -7px 16px var(--hi);--shadow-h:10px 10px 22px var(--lo),-8px -8px 18px var(--hi);
  --inset:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);
  --side:#f3e9dc;--side-ink:#4a2c20;--side-mut:#8a6f60;--nav-on:#fff;--toast-bg:#4a2c20;--grid:rgba(74,44,32,.1);--in-bg:#efe3d3;
}
[data-theme="dark"]{
  --bg:#211714;--panel:#211714;--panel2:#2c201b;--ink:#f6e7d6;--muted:#b49a88;--line:rgba(246,231,214,.08);
  --acc:#ff7a90;--acc-ink:#2a0f15;--ok:#7bd19d;--warn:#f2c160;--bad:#ff7a6e;--info:#9bb8ff;
  --c1:#ff7a90;--c2:#f6e7d6;--c3:#a6d982;--c4:#f2c160;--c5:#9bb8ff;--c6:#e0a578;
  --hi:rgba(255,235,215,.045);--lo:rgba(0,0,0,.55);--side:#211714;--side-ink:#f6e7d6;--side-mut:#b49a88;--toast-bg:#f6e7d6;--toast-ink:#211714;--tip-bg:#f6e7d6;--tip-ink:#211714;--in-bg:#2a1e19;
}
h1,h2,h3{font-weight:850;letter-spacing:-.01em}
.card{border:0;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-2px)}
.kpi-v{font-weight:900}
.btn{border:0;background:var(--panel);box-shadow:5px 5px 11px var(--lo),-5px -5px 11px var(--hi);font-weight:800}
.btn:hover{border:0;color:var(--acc)}
.btn:active{box-shadow:var(--inset);transform:none}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:5px 5px 12px color-mix(in srgb,var(--acc) 45%,transparent),-4px -4px 10px var(--hi)}
.btn.pri:hover{color:var(--acc-ink)}
.btn.ghost{box-shadow:none}
.btn.danger{background:var(--bad);color:#fff}
.icon-btn{border:0;background:var(--panel);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);border-radius:14px}
.icon-btn:active{box-shadow:var(--inset)}
input,select,textarea{border:0;box-shadow:var(--inset);border-radius:14px}
.chip{border:0;background:var(--panel);box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}
.chip[aria-pressed="true"]{box-shadow:var(--inset);background:var(--panel);color:var(--acc)}
.seg{border:0;box-shadow:var(--inset);background:var(--panel);border-radius:14px}
.seg-th{background:var(--acc);border-radius:11px;box-shadow:none}
.seg button[aria-pressed="true"]{color:#fff}
.dlg{border:0}
.tbl td,.tbl th{border-color:var(--line)}

/* Icon rail on wide screens */
.side{align-items:center;padding:18px 10px;gap:14px}
.brand{padding:0 0 6px}.brand svg{width:44px;height:44px}
.nav{gap:6px;width:100%}
.nav a{flex-direction:column;gap:4px;padding:10px 4px;font-size:.7em;font-weight:800;text-align:center;border-radius:18px}
.nav a svg{width:22px;height:22px}
.nav-marker{border-radius:18px;background:var(--acc);box-shadow:4px 4px 12px color-mix(in srgb,var(--acc) 45%,transparent)}
/* Bottom tab bar on phones (instead of a drawer) */
@media (max-width:900px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;transform:none;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);box-shadow:0 -6px 20px var(--lo);border-radius:22px 22px 0 0;z-index:40;overflow-x:auto}
  .brand{display:none}
  .nav{flex-direction:row;gap:2px;min-width:max-content}
  .nav a{min-width:56px;padding:7px 4px;font-size:.62em}
  .nav-marker{--axis:x}
  .view{padding-bottom:110px}
  :root{--toast-b:96px}
}
@media (min-width:901px){.nav-marker{--axis:y}}

/* Top bar */
.top{padding:22px 30px 6px}
.who{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.who .av{width:46px;height:46px;border-radius:16px;box-shadow:var(--shadow)}
.who small{display:block;color:var(--muted);font-weight:800;font-size:.8em}
.who h1{font-size:1.6em}
.view{padding:12px 30px 44px}
@media (max-width:900px){.top{padding:14px 16px 4px}.view{padding:10px 16px 110px}}

/* Home: the balance hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.hero .big{font-size:2.6em;font-weight:900;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero small{color:var(--muted);font-weight:800}
.quick{display:grid;grid-template-columns:repeat(4,72px);gap:12px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;font-weight:800;font-size:.76em;color:var(--ink);transition:transform .12s}
.quick button .i{width:22px;height:22px;color:var(--acc)}
.quick button:active{box-shadow:var(--inset);transform:scale(.96)}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}.quick{grid-template-columns:repeat(4,minmax(0,1fr))}.hero .big{font-size:2em}}
.inout{display:flex;gap:22px;margin:6px 0 10px;font-weight:800}
.inout span{display:inline-flex;align-items:center;gap:6px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;box-shadow:var(--inset);color:var(--acc);flex:none}
.tx .ic.in{color:var(--ok)}
.tx b{display:block}.tx small{color:var(--muted)}
.tx .num{margin-left:auto;font-weight:900;white-space:nowrap}
.amt-in{color:var(--ok)}

/* Account jars you pour between */
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
.jar{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px 14px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.jar svg{width:110px;height:130px;overflow:visible}
.jar b{font-size:1.15em;font-variant-numeric:tabular-nums}
.jar small{color:var(--muted);font-weight:700}
.jar .row{justify-content:center}
.jar.target{box-shadow:var(--inset);transform:scale(1.04)}
.jar.dragging{opacity:.4}
.jar-ghost{position:fixed;z-index:90;pointer-events:none;width:90px;height:110px;transform:translate(-50%,-60%) rotate(-14deg);filter:drop-shadow(0 14px 18px rgba(0,0,0,.25))}
.jar-glass{fill:color-mix(in srgb,var(--panel2) 70%,transparent);stroke:var(--muted);stroke-width:2.5}
.jar-lid{fill:var(--c6)}
.liq{transition:none}
.slosh .wave{animation:wave 1.2s ease-in-out 3}
@keyframes wave{50%{transform:translateX(-14px)}}
.coin{position:fixed;z-index:95;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#e0a826);box-shadow:0 2px 4px rgba(0,0,0,.25);pointer-events:none;transition:transform .7s cubic-bezier(.3,-.3,.5,1),opacity .2s .6s}
.amt-slider{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.amt-slider output{font-size:2em;font-weight:900;text-align:center}

/* Cards that flip */
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.flip{perspective:1000px}
.flip-in{position:relative;aspect-ratio:1.586;transition:transform .8s cubic-bezier(.3,.9,.3,1.1);transform-style:preserve-3d}
.flip.back .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;padding:16px 18px;color:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:8px 10px 22px var(--lo)}
.face::before{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.face::after{content:"";position:absolute;left:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.face>*{position:relative;z-index:1}
.face.b{transform:rotateY(180deg)}
.face .strip{height:34px;margin:6px -18px 0;background:rgba(0,0,0,.55)}
.face .n{font:700 16px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
.face .r{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.85em}
.face .chipc{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#ffe2a1,#c99a3f)}
.lockd{position:absolute;inset:0;border-radius:18px;background:rgba(40,25,20,.55);display:grid;place-items:center;color:#fff;z-index:3;opacity:0;pointer-events:none;transition:opacity .35s}
.lockd .i{width:46px;height:46px;transform:translateY(-30px);transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
.flip.frozen .lockd{opacity:1}
.flip.frozen .lockd .i{transform:none}
.card-ctl{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.lim{display:flex;justify-content:space-between;font-weight:800;font-size:.9em}

/* Payments: send form with a live preview */
.send{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--gap)}
@media (max-width:900px){.send{grid-template-columns:minmax(0,1fr)}}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 18px}
.preview .big{font-size:2.2em;font-weight:900}
.flow{display:flex;align-items:center;gap:10px;font-weight:800}
.flow .dot{width:12px;height:12px;border-radius:50%;background:var(--acc);animation:hop 1.4s ease-in-out infinite}
.flow .dot:nth-child(3){animation-delay:.2s}.flow .dot:nth-child(4){animation-delay:.4s}
@keyframes hop{50%{transform:translateY(-6px);opacity:.5}}
.done-ring{width:84px;height:84px}
.done-ring circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:240;stroke-dashoffset:240;animation:ringIn .7s forwards}
.done-ring path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:ringIn .45s .55s forwards}
@keyframes ringIn{to{stroke-dashoffset:0}}
.pin-in{display:flex;gap:10px;justify-content:center;margin:8px 0}
.pin-in input{width:48px;height:54px;text-align:center;font-size:1.4em;font-weight:900}
.shop-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.shop-c .big{font-size:1.5em;font-weight:900;margin:8px 0 2px}
.perm{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.req{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;box-shadow:var(--inset);margin-bottom:10px}
.req .grow{flex:1;min-width:0}.req b{display:block}.req small{color:var(--muted)}

</style>
</head>
<body>
<!-- App shell: an icon rail on the left (a bottom tab bar on phones), a top bar and the page -->
<div class="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <a class="brand" href="#/home" aria-label="Doughbox home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 17c0-6 5-10 11-10s11 4 11 10v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="#f2c27b"/><path d="M5 17c0-6 5-10 11-10s11 4 11 10" fill="none" stroke="#4a2c20" stroke-width="2"/><path d="M11 12l2 4M16 10.5v4.5M21 12l-2 4" stroke="#4a2c20" stroke-width="2" stroke-linecap="round"/><rect x="5" y="19" width="22" height="7" rx="3" fill="#e85d75"/></svg>
    </a>
    <nav class="nav" data-navlist aria-label="Main"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <div class="who"><span class="av" style="--h:20" aria-hidden="true">CC</span><span><small>Crumb &amp; Co. Bakers</small><h1 data-page-title>Home</h1></span></div>
      <button type="button" class="icon-btn" data-act="cmdk" aria-label="Search and commands (Ctrl K)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <button type="button" class="icon-btn" data-act="theme" aria-label="Switch theme"><svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button type="button" class="icon-btn" data-act="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="bell-n" hidden>0</span></button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<script>
/* =========================================================
   Core helpers: DOM, numbers, dates, storage, router, UI
   pieces (toast, modal, drawer, form, table) and charts.
   Everything is plain JS with no libraries.
   ========================================================= */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches: false });

function jarDrag(root) {
  root.addEventListener('pointerdown', e => {
    const j = e.target.closest('.jar'); if (!j || e.button > 0 || e.target.closest('button')) return;
    if (e.pointerType === 'touch' && !e.target.closest('svg')) return;
    const sx = e.clientX, sy = e.clientY; let on = false, ghost = null, over = null;
    const move = ev => {
      if (!on) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return; on = true; ghost = document.createElement('div'); ghost.className = 'jar-ghost'; ghost.innerHTML = $('svg', j).outerHTML; document.body.append(ghost); j.classList.add('dragging'); }

      const u = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null, t = u && u.closest('.jar');
      over = t && t !== j ? t : null; $$('.jar', root).forEach(x => x.classList.toggle('target', x === over));

}

function pour(fromId, toId, amt) {

  setTimeout(finish, 1300);
}

  const pv = $('#pv'); if (!pv) return; const f = $('#sendF'), val = k => ($('#f_' + k, f) || {}).value || '';
  const p = byId(D.payees, val('payee')), amt = +val('amt') || 0;
  if (SEND.step === 'confirm') { pv.innerHTML = `<small class="muted">Enter any 4-digit code to approve</small><div class="big">${money(SEND.v.amt)}</div><div class="flow"><span>${esc(accName(SEND.v.from))}</span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>${esc(byId(D.payees, SEND.v.payee).name)}</span></div><div class="pin-in">${[0, 1, 2, 3].map(i => `<input inputmode="numeric" maxlength="1" aria-label="Code digit ${i + 1}" data-pin="${i}">`).join('')}</div><small class="err" id="pinErr"></small><div class="row"><button type="button" class="btn ghost" data-act="sendBack">Back</button><button type="button" class="btn pri" data-act="sendGo">${ico('send')}${SEND.v.when > TODAY_S ? 'Schedule' : 'Send now'}</button></div>`; const ins = $$('[data-pin]', pv); ins[0].focus(); ins.forEach((inp, i) => inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); })); return; }
  if (SEND.step === 'done') { pv.innerHTML = `<svg class="done-ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38"/><path d="M26 43l11 11 21-23"/></svg><div class="big">${money(SEND.last.amt)}</div><p><b>${SEND.last.when > TODAY_S ? 'Scheduled for ' + fDate(SEND.last.when) : 'Sent'}</b> to ${esc(SEND.last.name)}</p><button type="button" class="btn" data-act="sendNew">Send another</button>`; return; }
  pv.innerHTML = `<small class="muted">Preview</small><div class="big">${money(amt)}</div><div class="flow"><span>${esc(accName(val('from')))}</span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>${p ? esc(p.name) : 'someone'}</span></div><small class="muted">${p ? esc(p.bank) + ' · ' + esc(p.acct) : 'Pick a payee to see their bank'}</small><small class="muted">${val('when') > TODAY_S ? 'Goes out on ' + fDate(val('when')) : 'Arrives in a few seconds'}</small>`;
}
ACT.sendBack = () => { SEND.step = 'form'; preview(); };
ACT.sendGo = () => {
  const code = $$('[data-pin]').map(i => i.value).join('');
  if (!/^\d{4}$/.test(code)) { $('#pinErr').textContent = 'Enter all 4 digits'; return; }
  const x = SEND.v, p = byId(D.payees, x.payee);
  if (x.when > TODAY_S) D.so.push({ id: uid('s'), payee: x.payee, amt: x.amt, every: 'Once', next: x.when, acc: x.from, paused: false });
  else pay(x.from, x.amt, p.name, p.cat, 'Bank transfer', { note: x.ref });
  save(); SEND.last = { amt: x.amt, name: p.name, when: x.when }; SEND.v = null; SEND.step = 'done';
  refresh(); notify(money(x.amt) + (x.when > TODAY_S ? ' scheduled to ' : ' sent to ') + p.name, 'ok');
};
ACT.sendNew = () => { SEND.step = 'form'; refresh(); };
ACT.payTo = b => { SEND.v = { payee: b.dataset.id, from: 'main', when: TODAY_S }; SEND.step = 'form'; refresh(); const a = $('#f_amt'); if (a) a.focus(); };
ACT.addPayee = () => formModal({ title: 'New payee', save: 'Add payee', fields: [{ k: 'name', label: 'Name', req: true, full: true }, { k: 'bank', label: 'Bank', type: 'select', opts: ['Indus Valley Bank', 'Ravi Commercial Bank', 'Tulip Bank', 'Lotus Savings Bank'] }, { k: 'iban', label: 'Account (IBAN)', req: true, check: x => /^PK\d{2}[A-Z0-9 ]{10,30}$/i.test(x.replace(/\s/g, ' ')) ? '' : 'Starts with PK and two digits' }, { k: 'cat', label: 'Usually for', type: 'select', opts: CATS.filter(c => c !== 'Sales' && c !== 'Transfer') }], values: { iban: 'PK' }, onSave: x => { D.payees.push({ id: uid('p'), name: x.name, bank: x.bank, cat: x.cat, acct: x.iban.slice(0, 4).toUpperCase() + ' •••• ' + x.iban.replace(/\s/g, '').slice(-4) }); commit(x.name + ' added as a payee'); } });
ACT.soTog = b => { const s = byId(D.so, b.dataset.id); s.paused = !b.checked; save(); toast(s.paused ? 'Payment paused' : 'Payment resumed'); };
ACT.soDel = b => { const s = byId(D.so, b.dataset.id); confirmBox('Delete this scheduled payment?', () => { D.so = D.so.filter(x => x !== s); commit('Scheduled payment deleted'); }); };

/* ---------- Page: Transactions ---------- */
PAGES.transactions = {
  title: 'Transactions', render(v) {
    v.innerHTML = `<section class="card flat"><div id="txT"></div></section>`;
    table($('#txT'), { rows: D.tx, per: 10, ph: 'Search who, category or account…', keys: ['who', 'cat', t => accName(t.acc), 'method'], sort: 'date', dir: -1, empty: 'No transactions', chips: { opts: ['All', 'Money in', 'Money out', 'Card', 'Transfers', 'No receipt'], fn: (t, c) => c === 'Money in' ? t.amt > 0 && t.cat !== 'Transfer' : c === 'Money out' ? t.amt < 0 && t.cat !== 'Transfer' : c === 'Card' ? !!t.card : c === 'Transfers' ? t.cat === 'Transfer' : !t.receipt }, tools: `<span class="sp"></span><button type="button" class="btn" data-act="exportTx">${ico('download')}CSV</button>`, onRow: txDrawer,
      cols: [{ k: 'date', label: 'Date', f: t => fDay(t.date) }, { k: 'who', label: 'Who', f: t => `<div class="cell2"><span class="tx" style="border:0;padding:0"><span class="ic${t.amt > 0 ? ' in' : ''}" style="width:32px;height:32px">${ico(CAT_IC[t.cat] || 'receipt')}</span></span><span><b>${esc(t.who)}</b><small>${esc(t.method)}${t.card ? ' · •••• ' + esc((byId(D.cards, t.card) || {}).last4 || '') : ''}</small></span></div>` }, { k: 'cat', label: 'Category' }, { k: 'acc', label: 'Account', sv: t => accName(t.acc), f: t => esc(accName(t.acc)) }, { k: 'receipt', label: 'Receipt', sv: t => +t.receipt, f: t => t.amt > 0 ? '' : t.receipt ? `<span class="up">${ico('check')}</span>` : '<span class="pill s-pending">Add</span>' }, { k: 'amt', label: 'Amount', num: true, f: t => `<b class="${t.amt > 0 ? 'amt-in' : ''}">${t.amt > 0 ? '+' : ''}${money(t.amt)}</b>` }] });
  }
};
function txDrawer(t) {
  const m = drawer(esc(t.who), `<div style="text-align:center;margin:8px 0 18px"><div style="font-size:2em;font-weight:900" class="${t.amt > 0 ? 'amt-in' : ''}">${t.amt > 0 ? '+' : ''}${money(t.amt)}</div><small class="muted">${fDate(t.date)} · ${esc(t.method)}</small></div><form novalidate>${fieldsHTML([{ k: 'cat', label: 'Category', type: 'select', opts: CATS, full: true }, { k: 'note', label: 'Note', type: 'textarea', full: true }, { k: 'receipt', label: 'Receipt', type: 'check', hint: 'Receipt saved' }], t)}</form><dl class="kv" style="margin-top:14px"><dt>Account</dt><dd>${esc(accName(t.acc))}</dd>${t.card ? `<dt>Card</dt><dd>•••• ${esc((byId(D.cards, t.card) || {}).last4 || '')}</dd>` : ''}<dt>Reference</dt><dd>${esc(t.id.toUpperCase())}</dd></dl>`, `<span class="sp"></span><button type="button" class="btn pri" data-x="save">Save</button>`);
  $('[data-x="save"]', m.el).onclick = () => { const x = readFields($('form', m.el), [{ k: 'cat' }, { k: 'note' }, { k: 'receipt', type: 'check' }]); Object.assign(t, x); m.close(); commit('Transaction updated'); };
}
ACT.exportTx = () => download('doughbox-transactions.csv', toCSV(D.tx, [['date', 'Date'], ['who', 'Who'], ['cat', 'Category'], [t => accName(t.acc), 'Account'], ['method', 'Method'], ['amt', 'Amount']]));

/* ---------- Page: Shops ---------- */
PAGES.shops = {
  title: 'Shops', render(v) {
    const sales = s => D.tx.filter(t => t.acc === s.id && t.cat === 'Sales'), mk = TODAY_S.slice(0, 7), pm = addMonths(TODAY_S, -1).slice(0, 7);
    v.innerHTML = `<div class="shop-cards">${SHOPS.map(s => { const r = sales(s), today = sum(r.filter(t => t.date === TODAY_S).map(t => t.amt)), mo = sum(r.filter(t => t.date.startsWith(mk)).map(t => t.amt)), card = sum(r.filter(t => t.method === 'Card machine' && t.date.startsWith(mk)).map(t => t.amt)); return `<section class="card shop-c"><div class="row"><span style="width:14px;height:14px;border-radius:5px;background:${s.color}"></span><h3>${esc(s.name)}</h3><span class="sp"></span><small class="muted">${esc(s.mgr)}</small></div><div class="big">${money(today)}</div><small class="muted">taken today</small><dl class="kv" style="margin-top:12px"><dt>This month</dt><dd>${smoney(mo)}</dd><dt>By card</dt><dd>${mo ? nf(card / mo * 100) : 0}%</dd><dt>Account balance</dt><dd>${smoney((byId(D.acc, s.id) || { bal: 0 }).bal)}</dd></dl>${spark(Array.from({ length: 14 }, (_, i) => sum(r.filter(t => t.date === daysAgo(13 - i)).map(t => t.amt))), s.color, 220, 34)}</section>`; }).join('')}</div>
    <div class="grid g21"><section class="card"><div class="ch"><h3>Weekly takings</h3><span class="sub">12 weeks</span></div><div class="chart" id="wkB"></div></section><section class="card"><div class="ch"><h3>Busiest days</h3><span class="sub">average takings</span></div><div class="chart" id="dayH"></div></section></div>`;
    const wks = Array.from({ length: 12 }, (_, i) => 11 - i);
    barChart($('#wkB'), { labels: wks.map(k => fDay(addDays(TODAY_S, -k * 7 - 6))), series: SHOPS.map(s => ({ name: s.name, color: s.color, data: wks.map(k => sum(sales(s).filter(t => Math.floor(dayDiff(TODAY_S, t.date) / 7) === k).map(t => t.amt))) })), stacked: true, fmt: x => money(x), h: 230 });
    const days = [1, 2, 3, 4, 5, 6, 0];
    heat($('#dayH'), { rows: SHOPS.map(s => s.name), cols: days.map(d => WD[d]), data: SHOPS.map(s => days.map(dw => { const r = sales(s).filter(t => pd(t.date).getDay() === dw); const n = new Set(r.map(t => t.date)).size || 1; return Math.round(sum(r.map(t => t.amt)) / n); })), fmt: x => money(x), name: 'Average takings', color: 'var(--c1)', label: 'Average takings by weekday' });
  }
};

/* ---------- Page: Team ---------- */
PAGES.team = {
  title: 'Team', render(v) {
    const reqs = D.reqs.filter(r => r.status === 'pending');
    v.innerHTML = `<div class="grid g21"><section class="card flat"><div id="tmT"></div></section><aside class="card"><div class="ch"><h3>Waiting for your OK</h3></div>${reqs.map(r => `<div class="req">${av(mName(r.who), 'sm')}<span class="grow"><b>${esc(mName(r.who).split(' ')[0])} wants to pay ${money(r.amt)}</b><small>to ${esc((byId(D.payees, r.payee) || {}).name || '')} · ${esc(r.note)}</small></span><button type="button" class="icon-btn sm" data-act="reqNo" data-id="${r.id}" aria-label="Decline">${ico('x')}</button><button type="button" class="icon-btn sm" data-act="reqOk" data-id="${r.id}" aria-label="Approve">${ico('check')}</button></div>`).join('') || `<div class="empty sm">${ico('check')}<b>Nothing waiting</b></div>`}</aside></div>`;
    table($('#tmT'), { rows: D.team, ph: 'Search team…', keys: ['name', 'role'], sort: 'name', empty: 'No team yet', tools: `<span class="sp"></span><button type="button" class="btn pri" data-act="addMate">${ico('plus')}Invite</button>`, onRow: mateForm,
      cols: [{ k: 'name', label: 'Name', f: m => `<div class="cell2">${av(m.name)}<span><b>${esc(m.name)}</b><small>${esc(m.role)}${m.shop ? ' · ' + esc((SHOPS.find(s => s.id === m.shop) || {}).name || '') : ''}</small></span></div>` }, { k: 'canPay', label: 'Can pay bills', sv: m => +m.canPay, f: m => m.canPay ? `<span class="up">${ico('check')}</span>` : '<span class="muted">—</span>' }, { k: 'canSend', label: 'Can send money', sv: m => +m.canSend, f: m => m.canSend ? `<span class="up">${ico('check')}</span>` : '<span class="muted">—</span>' }, { k: 'limit', label: 'Needs OK above', num: true, f: m => m.limit ? money(m.limit) : 'Never' }, { k: 'card', label: 'Card', sort: false, f: m => { const k = D.cards.find(c => c.holder === m.id); return k ? '•••• ' + esc(k.last4) + (k.frozen ? ' (frozen)' : '') : '<span class="muted">—</span>'; } }] });
  }
};
const mateF = [{ k: 'name', label: 'Name', req: true }, { k: 'role', label: 'Role', type: 'select', opts: ['Owner', 'Shop manager', 'Head baker', 'Baker', 'Cashier', 'Driver'] }, { k: 'shop', label: 'Shop', type: 'select', opts: [['', 'All shops']].concat(SHOPS.map(s => [s.id, s.name])) }, { k: 'limit', label: 'Needs your OK above (Rs, 0 = never)', type: 'number', min: 0, step: 1000, req: true }, { k: 'canPay', label: 'Bills', type: 'check', hint: 'Can pay bills' }, { k: 'canSend', label: 'Transfers', type: 'check', hint: 'Can send money' }];
function mateForm(m) { formModal({ title: m ? esc(m.name) : 'Invite someone', fields: mateF, values: m || { role: 'Baker', shop: 'gul', limit: 15000 }, save: m ? 'Save' : 'Send invite', onDelete: m && m.role !== 'Owner' ? () => { D.team = D.team.filter(x => x !== m); commit(m.name + ' removed'); } : null, onSave: x => { if (m) { Object.assign(m, x); commit('Permissions saved'); } else { D.team.push({ id: uid('m'), ...x }); commit('Invite sent to ' + x.name + ' by SMS'); } } }); }
ACT.addMate = () => mateForm();
ACT.reqOk = b => { const r = byId(D.reqs, b.dataset.id), p = byId(D.payees, r.payee), m = byId(D.team, r.who); pay(m.shop || 'main', r.amt, p.name, p.cat, 'Approved payment', { note: r.note }); r.status = 'approved'; commit('Paid ' + money(r.amt) + ' to ' + p.name); notify(mName(r.who) + "'s payment was approved", 'ok'); };
ACT.reqNo = b => { const r = byId(D.reqs, b.dataset.id); r.status = 'declined'; commit('Declined. ' + mName(r.who) + ' has been told.', 'warn', () => { r.status = 'pending'; commit('Undone'); }); };

/* ---------- Page: Settings ---------- */
const setF = [{ k: 'biz', label: 'Business name', req: true, full: true }, { k: 'owner', label: 'Owner', req: true }, { k: 'taxPct', label: 'Tax pot % of sales', type: 'number', min: 0, max: 30, req: true }, { k: 'sweep', label: 'Weekly sweep', type: 'check', hint: 'Move shop takings to Main every Monday' }, { k: 'alerts', label: 'Alerts', type: 'check', hint: 'SMS me for payments over Rs 50,000' }];
PAGES.settings = {
  title: 'Settings', render(v) {
    v.innerHTML = `<div class="grid g2"><section class="card"><div class="ch"><h3>Business</h3></div><form id="setF" novalidate>${fieldsHTML(setF, D.set)}<div class="row" style="margin-top:14px"><button type="submit" class="btn pri">Save</button></div></form></section><section class="card"><div class="ch"><h3>Look</h3></div><div class="row"><button type="button" class="btn" data-act="setTheme" data-v="light">${ico('sun')}Dough</button><button type="button" class="btn" data-act="setTheme" data-v="dark">${ico('moon')}Espresso</button></div><div class="ch" style="margin-top:22px"><h3>Data</h3></div><p class="muted">Demo data is kept in this browser.</p><div class="row"><button type="button" class="btn" data-act="exportTx">${ico('download')}Export</button><button type="button" class="btn danger" data-act="reset">${ico('refresh')}Reset demo data</button></div></section></div>`;
    $('#setF').addEventListener('submit', e => { e.preventDefault(); const x = readFields($('#setF'), setF); if (x) { Object.assign(D.set, x); $('.who small').textContent = x.biz; commit('Saved'); } });
  }
};
ACT.setTheme = b => { setTheme(b.dataset.v); toast('Theme changed'); };
ACT.reset = () => confirmBox('Reset all accounts, cards and payments to the demo?', () => { D = seed(); SEND.step = 'form'; SEND.v = null; save(); refresh(); toast('Demo data reset'); }, { ok: 'Reset' });

/* ---------- Boot ---------- */
$('.who small').textContent = D.set.biz;
boot({
  name: 'Doughbox', key: KEY, home: 'home',
  nav: [['home', 'Home', 'home'], ['accounts', 'Jars', 'wallet'], ['cards', 'Cards', 'card'], ['payments', 'Pay', 'send'], ['transactions', 'Activity', 'receipt'], ['shops', 'Shops', 'building'], ['team', 'Team', 'users'], ['settings', 'Settings', 'cog']],
  notes: [['Hina wants to pay Sugarcane Traders Rs 36,500', 'info', '10:12'], ['Card •••• ' + (D.cards[3] ? D.cards[3].last4 : '0000') + ' is frozen', 'bad', 'yesterday'], ['Gulberg had its best Saturday this month', 'ok', '2 days ago']],
  commands: [{ label: 'Send money', hint: 'Action', run: () => go('payments') }, { label: 'Move money between jars', hint: 'Action', run: () => pourModal('main', 'tax') }, { label: 'Order a card', hint: 'Action', run: ACT.newCard }, { label: 'Request money', hint: 'Action', run: ACT.request }],
  search: q => D.payees.filter(p => p.name.toLowerCase().includes(q)).map(p => ({ label: 'Pay ' + p.name, hint: 'Payee', run: () => { go('payments'); setTimeout(() => ACT.payTo({ dataset: { id: p.id } }), 60); } }))
});

</script>
</body>
</html>
