<!doctype html>
<!-- Chill & Craft · Northlight · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northlight · Architecture and interiors studio</title>
<meta name="description" content="Northlight is a small architecture and interiors studio in Leith, Edinburgh: homes, workplaces and public rooms drawn around northern light.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: bone white, graphite and one terracotta accent (light) / graphite night (dark) ---------- */
  :root {
    --bg: #eeeae3; --bg-2: #e4dfd6; --paper: #f6f3ee; --card: #fbfaf7;
    --ink: #1e1f21; --ink-2: #3a3b3e; --muted: #6f6a63; --faint: #a19b92;
    --line: rgba(30,31,33,.13); --line-2: rgba(30,31,33,.26);
    --accent: #b0512a; --accent-ink: #fff8f2; --accent-soft: #efd9cc; --accent-2: #d7835d;
    --band: #222326; --band-ink: #eee9e1; --band-muted: #a9a39a; --band-line: rgba(238,233,225,.14);
    --good: #3e7b58; --bad: #b23a2e;
    --surface: #fbfaf7; --surface-2: #f1ede6; --panel: #fbfaf7;
    --tip-bg: #1e1f21; --tip-ink: #f3eee6; --overlay: rgba(24,24,26,.45);
    --shadow: 0 1px 0 rgba(30,31,33,.04), 0 18px 40px -24px rgba(30,31,33,.38);
    --r: 14px; --r-sm: 10px; --r-lg: 22px; --pad: 32px; --max: 1440px; --hd: 64px;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #151516; --bg-2: #1d1e20; --paper: #1b1c1e; --card: #202124;
    --ink: #ece6dd; --ink-2: #cfc8bd; --muted: #a29b91; --faint: #6f6a62;
    --line: rgba(236,230,221,.11); --line-2: rgba(236,230,221,.24);
    --accent: #d9774d; --accent-ink: #1a0e08; --accent-soft: rgba(217,119,77,.2); --accent-2: #eb9c77;
    --band: #0d0d0e; --band-ink: #ece6dd; --band-muted: #958f86; --band-line: rgba(236,230,221,.1);
    --good: #7cc39a; --bad: #f08577;
    --surface: #202124; --surface-2: #26272a; --panel: #1f2023;
    --tip-bg: #ece6dd; --tip-ink: #151516; --overlay: rgba(0,0,0,.6);
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 22px 44px -24px rgba(0,0,0,.8);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); font: 13px/1.55 var(--sans); -webkit-font-smoothing: antialiased; transition: background .35s, color .35s; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  h1, h2, h3, h4, p { margin: 0; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: fixed; left: 12px; top: -60px; z-index: 99; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; transition: top .2s; }
  .skip:focus { top: 12px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }
  .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--muted); }
  .acc { color: var(--accent); }

  /* ---------- Header ---------- */
  .hd { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); border-bottom: 1px solid transparent; transition: border-color .3s, background .35s; }
  .hd.sc { border-bottom-color: var(--line); }
  .hd-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: var(--hd); gap: 20px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; justify-self: start; }
  .logo svg { width: 32px; height: 24px; flex: none; }
  .logo b { display: block; font-size: 16.5px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .logo small { display: block; margin-top: 3px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .lm-body { fill: var(--ink); }
  .lm-glass { stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; }
  .nav { display: flex; gap: 2px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--card) 55%, transparent); }
  .nav a { padding: 7px 15px; border-radius: 999px; font-weight: 550; font-size: 13px; color: var(--ink-2); transition: background .2s, color .2s; }
  .nav a sup { margin-left: 2px; font-size: 9px; font-weight: 600; color: var(--muted); }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .nav a[aria-current="page"] sup { color: inherit; opacity: .6; }
  .hd-act { display: flex; gap: 8px; align-items: center; justify-self: end; }
  .ib { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink); transition: border-color .2s, background .2s, transform .15s; }
  .ib:hover { border-color: var(--ink); }
  .ib:active { transform: scale(.94); }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; transform: scale(1); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
  .badge:empty { transform: scale(0); }
  .badge.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 40% { transform: scale(1.45); } }
  .kb { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px 0 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; transition: border-color .2s; }
  .kb:hover { border-color: var(--ink); color: var(--ink); }
  kbd { font: 600 10.5px var(--sans); padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .menu-b { display: none; }

  /* ---------- Buttons, chips, fields ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 17px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink); font-weight: 600; font-size: 13px; white-space: nowrap; transition: transform .15s, background .2s, border-color .2s, color .2s, box-shadow .25s; }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: scale(.97); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.pri:hover { box-shadow: 0 12px 26px -12px var(--accent); }
  .btn.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.sm { height: 30px; padding: 0 12px; font-size: 12px; }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn .ic { width: 15px; height: 15px; transition: transform .25s; }
  .btn:hover .ic.mv { transform: translateX(3px); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .lnk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; border-bottom: 1px solid var(--line-2); padding-bottom: 2px; transition: border-color .2s, color .2s, gap .2s; }
  .lnk:hover { color: var(--accent); border-color: var(--accent); gap: 9px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 550; color: var(--ink-2); transition: background .2s, color .2s, border-color .2s; }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip small { font-size: 10.5px; color: var(--muted); font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip[aria-pressed="true"] small { color: inherit; opacity: .6; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; gap: 2px; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .selw { position: relative; display: inline-flex; align-items: center; }
  .selw select { appearance: none; -webkit-appearance: none; height: 32px; padding: 0 30px 0 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; font-weight: 550; cursor: pointer; }
  .selw select:hover { border-color: var(--ink); }
  .selw .ic { position: absolute; right: 10px; width: 13px; height: 13px; pointer-events: none; color: var(--muted); }
  .selw select option { background: var(--card); color: var(--ink); }
  .srch { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; min-width: 200px; color: var(--muted); transition: border-color .2s; }
  .srch:focus-within { border-color: var(--ink); }
  .srch input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 12.5px; color: var(--ink); }
  .fld { display: grid; gap: 6px; }
  .fld > label, .fld > .flab { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .fld > label i, .fld > .flab i { font-style: normal; color: var(--accent); }
  .inp { width: 100%; min-height: 42px; padding: 9px 13px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); font-size: 13px; transition: border-color .2s, box-shadow .2s; }
  textarea.inp { min-height: 104px; resize: vertical; line-height: 1.5; }
  .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .inp[aria-invalid="true"], .fld.bad .chips { border-color: var(--bad); }
  .err { color: var(--bad); font-size: 11.5px; font-weight: 600; }
  .err:empty { display: none; }
  .hint { color: var(--muted); font-size: 11.5px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

  /* ---------- Views + motion ---------- */
  main { display: block; min-height: 70vh; transition: opacity .14s ease; }
  main.out { opacity: 0; }
  [data-r] { opacity: 0; transform: translateY(18px); }
  .in [data-r] { opacity: 1; transform: none; transition: opacity .5s ease var(--d, 0ms), transform .65s cubic-bezier(.2,.8,.2,1) var(--d, 0ms); }
  [data-io] { opacity: 0; transform: translateY(26px); transition: opacity .6s ease, transform .75s cubic-bezier(.2,.8,.2,1); }
  [data-io].seen { opacity: 1; transform: none; }
  [data-split] .w { display: inline-block; white-space: nowrap; }
  [data-split] .ch { display: inline-block; opacity: .16; transform: translateY(.16em); transition: opacity .38s ease, transform .5s cubic-bezier(.2,.8,.2,1), color .4s; transition-delay: calc(var(--i, 0) * 14ms); }
  [data-split] .ch.on { opacity: 1; transform: none; }
  .sk { border-radius: var(--r); background: linear-gradient(100deg, var(--bg-2) 30%, color-mix(in srgb, var(--bg-2) 40%, var(--card)) 50%, var(--bg-2) 70%); background-size: 300% 100%; animation: shim 1.1s linear infinite; }
  .sk.t { height: 14px; border-radius: 6px; margin-top: 12px; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* ---------- Shared page head ---------- */
  .ph { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; align-items: end; padding: 22px 0 22px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .crumbs a:hover { color: var(--accent); }
  .crumbs span { opacity: .5; }
  .h1 { font-size: clamp(54px, 9.2vw, 138px); font-weight: 600; letter-spacing: -.062em; line-height: .86; margin-left: -.04em; }
  .h1 sup { font-size: .17em; letter-spacing: 0; vertical-align: 3.6em; margin-left: .2em; color: var(--accent); font-weight: 600; }
  .ph-side p { font-size: 14px; line-height: 1.6; color: var(--ink-2); }
  .ph-side .row { display: flex; gap: 22px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .ph-side .row b { display: block; font-size: 22px; letter-spacing: -.03em; font-weight: 600; }
  .ph-side .row span { font-size: 11.5px; color: var(--muted); }
  .h2 { font-size: clamp(30px, 3.7vw, 54px); font-weight: 600; letter-spacing: -.048em; line-height: .95; }
  .h3 { font-size: 22px; font-weight: 600; letter-spacing: -.035em; line-height: 1.1; }
  .sec { padding-top: 88px; }
  .sh { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 24px; align-items: end; padding-bottom: 18px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .sh .lbl { align-self: start; padding-top: 8px; }
  .sh p { max-width: 520px; margin-top: 10px; color: var(--muted); font-size: 13.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .tag.ac { background: var(--accent-soft); color: var(--accent); }
  .tag.ok { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 2px; animation: pulse 2s infinite; flex: none; }
  .dot.ac { background: var(--accent); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent); } 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  /* ---------- Home: hero ---------- */
  .hero { display: grid; grid-template-rows: auto auto minmax(300px, 1fr); gap: 22px; min-height: calc(100vh - var(--hd)); padding-top: 14px; padding-bottom: 26px; }
  .hmeta { display: grid; grid-template-columns: 1.05fr 1fr 1.5fr 1.05fr; gap: 24px; padding-bottom: 11px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); align-items: center; }
  .hmeta b { color: var(--ink); font-weight: 600; }
  .hmeta > div { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hmeta > div:last-child { justify-content: flex-end; }
  .sunbar { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-2); position: relative; min-width: 50px; max-width: 120px; }
  .sunbar i { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-left: -5px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .sunbar u { position: absolute; inset: 0; border-radius: 2px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 45%, transparent), transparent); text-decoration: none; }
  .htop { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 44px; align-items: end; }
  .hx { font-size: clamp(44px, 7.4vw, 114px); font-weight: 600; letter-spacing: -.062em; line-height: .87; margin-left: -.045em; }
  .hx em { font-style: normal; color: var(--accent); }
  .hpill { display: inline-block; position: relative; width: 1.72em; height: .72em; border-radius: 999px; overflow: hidden; vertical-align: .02em; margin: 0 .06em; background: var(--bg-2); }
  .hpill img { width: 100%; height: 100%; object-fit: cover; animation: pillpan 10s ease-in-out infinite alternate; }
  @keyframes pillpan { from { transform: scale(1.35) translateX(-6%); } to { transform: scale(1.35) translateX(6%); } }
  .hside p { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin-bottom: 18px; }
  .hside .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hside .note { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .hside .note a { color: var(--ink); font-weight: 600; }
  .hside .note a:hover { color: var(--accent); }
  .hbot { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 16px; min-height: 0; }
  .slides { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--bg-2); min-height: 300px; isolation: isolate; }
  .slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.1); transition: opacity 1.3s ease, transform 8s linear; }
  .slides img.on { opacity: 1; transform: scale(1.01); }
  .slides::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, transparent 28%, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; z-index: 1; }
  .s-top, .s-bot { position: absolute; left: 18px; right: 18px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff; }
  .s-top { top: 16px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; }
  .s-bot { bottom: 18px; align-items: flex-end; }
  .s-cap b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.04em; line-height: 1; margin-bottom: 6px; }
  .s-cap span { font-size: 12px; opacity: .85; }
  .s-prog { display: flex; gap: 6px; margin-top: 12px; }
  .s-prog button { width: 46px; height: 14px; display: grid; align-items: center; }
  .s-prog button::before { content: ""; height: 2px; border-radius: 2px; background: rgba(255,255,255,.35); grid-area: 1 / 1; }
  .s-prog button i { grid-area: 1 / 1; height: 2px; width: 0; border-radius: 2px; background: #fff; }
  .s-prog button.on i { animation: fillbar 6s linear forwards; }
  .s-prog button.done i { width: 100%; }
  @keyframes fillbar { to { width: 100%; } }
  .glass-b { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); color: #fff; font-weight: 600; font-size: 12.5px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .2s; white-space: nowrap; }
  .glass-b:hover { background: rgba(255,255,255,.28); }
  .hcol { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; min-height: 0; }
  .feed { display: flex; flex-direction: column; overflow: hidden; padding: 14px 16px 6px; }
  .feed-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .feed ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; overflow: hidden; }
  .feed li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.45; }
  .feed li time { color: var(--muted); font-size: 11px; font-weight: 600; padding-top: 1px; }
  .feed li b { font-weight: 600; }
  .feed li span { color: var(--muted); }
  .feed li.new { animation: feedIn .7s cubic-bezier(.2,.8,.2,1); }
  .feed li.new b { color: var(--accent); transition: color 2s; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-14px); background: var(--accent-soft); } }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0; }
  .stats3 div { padding: 14px 16px; }
  .stats3 div + div { border-left: 1px solid var(--line); }
  .stats3 b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.05em; line-height: 1; }
  .stats3 b small { font-size: .5em; color: var(--accent); margin-left: 1px; letter-spacing: 0; }
  .stats3 span { display: block; margin-top: 5px; font-size: 11.5px; color: var(--muted); line-height: 1.3; }

  /* ---------- Project cards ---------- */
  .pg { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 34px 20px; }
  .pc { grid-column: span 4; position: relative; min-width: 0; }

  .rooms { display: flex; flex-direction: column; }

  .next { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 30px; align-items: center; margin-top: 70px; padding: 26px; border-radius: var(--r-lg); background: var(--card); border: 1px solid var(--line); overflow: hidden; }

  /* ---------- Studio page ---------- */

  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .role-c { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px; }
  .role-c h3 { font-size: 19px; font-weight: 600; letter-spacing: -.03em; }
  .role-c p { margin-top: 4px; font-size: 12px; color: var(--muted); }

  /* ---------- Process page ---------- */
  .pr { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 40px; }
  .rail { position: sticky; top: calc(var(--hd) + 24px); align-self: start; }
  .rail ol { list-style: none; margin: 14px 0 0; padding: 0 0 0 18px; position: relative; }
  .rail ol::before { content: ""; position: absolute; left: 3px; top: 8px; bottom: 8px; width: 2px; background: var(--line); border-radius: 2px; }
  .rail ol i { position: absolute; left: 3px; top: 8px; width: 2px; height: 0; background: var(--accent); border-radius: 2px; transition: height .4s cubic-bezier(.2,.8,.2,1); }
  .rail li button { position: relative; display: flex; justify-content: space-between; width: 100%; gap: 10px; padding: 9px 0; font-size: 13.5px; font-weight: 550; color: var(--muted); text-align: left; transition: color .25s; }
  .rail li button::before { content: ""; position: absolute; left: -19px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line-2); transition: border-color .25s, background .25s; }
  .rail li.on button, .rail li.done button { color: var(--ink); }

  .rail li.done button::before { border-color: var(--accent); }

  /* ---------- Journal + article ---------- */
  .feat { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px; align-items: stretch; margin-bottom: 40px; }

  /* ---------- Contact page ---------- */
  .ct { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  .radios input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .ct-side { display: grid; gap: 16px; }
  .map { position: relative; height: 250px; border-radius: 12px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); margin-top: 12px; }
  .map svg { width: 100%; height: 100%; display: block; }
  .map .blk { fill: var(--bg-2); }
  .map .st { fill: none; stroke: var(--card); stroke-width: 7; stroke-linecap: round; }
  .map .st2 { fill: none; stroke: var(--card); stroke-width: 4; stroke-linecap: round; }
  .map .wt { fill: color-mix(in srgb, #6d8fa8 26%, var(--paper)); }
  .map .pk { fill: color-mix(in srgb, var(--good) 18%, var(--paper)); }

  .map .pin { fill: var(--accent); }

  @keyframes mpulse { from { transform: scale(.4); opacity: .5; } to { transform: scale(2.6); opacity: 0; } }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: s; }

  .steps li::before { content: counter(s, decimal-leading-zero); position: absolute; left: 0; top: 10px; font-size: 11px; font-weight: 700; color: var(--accent); }

  @keyframes tick { to { stroke-dashoffset: 0; } }
  .enq { margin-top: 16px; }
  .enq-r { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; }

/* ---------- Edinburgh daylight: sunrise, sunset and noon sun height for today ---------- */
function sun(d = new Date()) {
  const rad = Math.PI / 180, lat = 55.976, lon = -3.172;
  const n = Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
  const decl = 23.44 * Math.sin(rad * (360 / 365) * (n - 81)), B = rad * (360 / 364) * (n - 81);
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl * rad)) / (Math.cos(lat * rad) * Math.cos(decl * rad));
  const H = Math.acos(clamp(cosH, -1, 1)) / rad, noon = 12 - lon / 15 - eot / 60, base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  return { rise: new Date(base + (noon - H / 15) * 36e5), set: new Date(base + (noon + H / 15) * 36e5), alt: 90 - lat + decl };
}

function drawTab(p, kind, now) {
  const c = $("#dwC"), side = $("#dwSide"); if (!c) return;
  const stamp = `<div class="stamp"><b>Northlight · ${esc(p.name)}</b>${kind === "plan" ? (p.pa ? "Typical flat plan" : "Ground floor plan") : kind === "section" ? "Long section, looking east" : "Site plan"} · Rev C · ${p.team.map(initials).join("/")}</div>`;
  const label = `${p.name}: ${kind} drawing`;
  c.classList.remove("drawn");
  c.innerHTML = svgWrap(kind === "plan" ? planSVG(p) : kind === "section" ? sectionInner(p, true) : siteSVG(p), label) + stamp;
  if (kind === "plan") {
    const R = PLANS[p.plan] || PLANS.house, u = planUnit(p); let tot = 0;
    side.innerHTML = `<div class="lbl">Rooms</div><ul>${R.map((r, i) => { const a = r[3] * r[4] * u * u; tot += a; return `<li data-rm="${i}"><span class="num">${pad(i + 1)}</span><b>${esc(r[0])}</b><span class="num">${num(a, 1)} m²</span></li>`; }).join("")}</ul><div class="tot"><span class="mut">${p.pa ? "One flat" : "This floor"}</span><b class="num">${num(tot, 0)} m²</b></div>`;
  } else if (kind === "section") {
    const s = sun();
    side.innerHTML = `<div class="lbl">Reading the section</div><ul class="kv" style="margin-top:6px"><li><span>Roof</span><b>Sawtooth, 3 bays</b></li><li><span>Glazing faces</span><b>North</b></li><li><span>Storeys</span><b>${p.storeys}</b></li><li><span>Noon sun today</span><b class="acc">${Math.round(s.alt)}°</b></li><li><span>Sunrise / sunset</span><b>${lt(s.rise)} / ${lt(s.set)}</b></li><li><span>Midsummer noon</span><b>57°</b></li></ul><p class="mut" style="margin-top:auto;padding-top:12px;font-size:12px">The orange lines are today's real noon sun over Leith. The solid roof slopes face south and keep it out; the glass faces the even northern sky.</p>`;
  } else {
    side.innerHTML = `<div class="lbl">Site</div><ul class="kv" style="margin-top:6px"><li><span>Place</span><b>${esc(p.place)}</b></li><li><span>Site area</span><b>${num(Math.round(p.area * 2.6))} m²</b></li><li><span>Footprint</span><b>${num(Math.round(p.area / p.storeys))} m²</b></li><li><span>Trees kept</span><b>All</b></li><li><span>Setting</span><b>${p.coast ? "Coastal" : "Inland"}</b></li></ul><p class="mut" style="margin-top:auto;padding-top:12px;font-size:12px">Contours at 1 m. Every tree on the survey was kept; new ones are shown in green.</p>`;
  }
  const go = () => c.classList.add("drawn");
  if (now) requestAnimationFrame(() => requestAnimationFrame(go)); else if (c.dataset.seen) go();
  $$(".rm", c).concat($$("li[data-rm]", side)).forEach((el) => {
    const k = el.dataset.rm, all = () => $$(`[data-rm="${k}"]`);
    el.addEventListener("pointerenter", (e) => { all().forEach((x) => x.classList.add("hl")); const li = $(`li[data-rm="${k}"]`, side); if (el.tagName === "rect" && li) showTip(li.children[1].textContent + " · " + li.children[2].textContent, e.clientX, e.clientY); });
    el.addEventListener("pointermove", (e) => { if (el.tagName === "rect") moveTip(e.clientX, e.clientY); });
    el.addEventListener("pointerleave", () => { all().forEach((x) => x.classList.remove("hl")); hideTip(); });
  });
}
