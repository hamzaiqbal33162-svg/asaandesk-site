<!doctype html>
<!-- Chill & Craft · Flockfly · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flockfly · Group travel desk</title>
<style>
/* ---------- Flockfly look: black and white, thin rules, one orange highlight ---------- */
:root{--font:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--bg:#ffffff;--bg2:#f4f4f4;--panel:#ffffff;--panel-solid:#ffffff;--field:#ffffff;--text:#0a0a0a;--muted:#6e6e6e;--line:#0a0a0a;--grid:#e6e6e6;--accent:#ff6a00;--accent-ink:#ffffff;--focus:#ff6a00;
--good:#0a0a0a;--warn:#ff6a00;--bad:#ff6a00;--c1:#ff6a00;--c2:#0a0a0a;--c3:#8c8c8c;--c4:#c8c8c8;--c5:#4a4a4a;--c6:#b0b0b0;
--r:0px;--rb:0px;--tip-bg:#0a0a0a;--hover:#f4f4f4;--scrim:rgba(255,255,255,.75);--enter-anim:ff-in}
[data-theme=dark]{--bg:#0a0a0a;--bg2:#151515;--panel:#0a0a0a;--panel-solid:#0f0f0f;--field:#0a0a0a;--text:#f5f5f5;--muted:#9a9a9a;--line:#f5f5f5;--grid:#262626;--accent:#ff7a1a;--accent-ink:#0a0a0a;--focus:#ff7a1a;
--good:#f5f5f5;--warn:#ff7a1a;--bad:#ff7a1a;--c1:#ff7a1a;--c2:#f5f5f5;--c3:#8c8c8c;--c4:#4a4a4a;--c5:#bdbdbd;--c6:#666;--tip-bg:#f5f5f5;--tip-ink:#0a0a0a;--hover:#151515;--scrim:rgba(0,0,0,.75)}
/* ---------- Core UI: shared structure. Each app sets its own look with the variables above. ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.55em .95em;border-radius:var(--rb,var(--r));font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .12s,background-color .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active,.ibtn:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.35em .7em;font-size:.78rem}
.btn .ic{width:16px;height:16px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,var(--r));border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s,border-color .2s,background-color .2s;position:relative;flex:none}
.ibtn:hover{border-color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:15px;height:15px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--panel)}
.badge[hidden]{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:.18em .62em;border-radius:99px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h,200) 55% 48%);color:#fff;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
/* staggered page entrance */
.enter{animation:var(--enter-anim,c-rise) .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes c-rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes c-fade{from{opacity:0}}
@keyframes c-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes c-land{0%{transform:scale(1.06)}100%{transform:none}}
.landed{animation:c-land .35s cubic-bezier(.2,.8,.2,1)}
/* tooltip */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;left:0;top:0}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{width:8px;height:8px;border-radius:2px;background:var(--sw)}
.tip .tr span{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
/* modal, drawer, command search */
.ovl{position:fixed;inset:0;z-index:60;background:var(--scrim,rgba(8,10,16,.52));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s}
.ovl.on{opacity:1}
.modal,.drawer,.cmdk{background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal{border-radius:calc(var(--r) + 4px);width:min(540px,100%);max-height:calc(100dvh - 32px);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(780px,100%)}
.modal.small{width:min(420px,100%)}
.ovl.on .modal,.ovl.on .cmdk{transform:none}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;border-width:0 0 0 1px;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ovl.on .drawer{transform:none}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:1.05rem}
.l-body{padding:18px;overflow:auto;flex:1;min-height:0}
.l-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf-msg{color:var(--muted)}
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);border-radius:calc(var(--r) + 4px);transform:translateY(-10px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.cmdk .l-head{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.cmdk .l-body{padding:0}
.ck-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:calc(var(--r) - 2px);text-align:left}
.cmdk li small{color:var(--muted)}
.cmdk li[aria-selected=true] button{background:var(--hover,color-mix(in srgb,var(--accent) 14%,transparent))}
.cmdk .empty{padding:20px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field,var(--bg));border-radius:var(--rb,var(--r));padding:.6em .7em;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.fld textarea{resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:c-shake .3s}
.fld .err{color:var(--bad);font-size:.74rem;font-weight:600}
.fld .err:empty{display:none}
@keyframes c-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent)}
/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar-x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar-x:empty{display:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:0 .65em;background:var(--field,var(--bg));flex:1 1 180px;max-width:300px;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:.55em 0;outline:none;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.32em .8em;font-size:.78rem;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip em{font-style:normal;opacity:.7;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th>button,.tbl th>.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%}
.tbl th>.th{cursor:default}
.tbl th>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th.n>button,.tbl th.n>.th{justify-content:flex-end}
.tbl .si{width:0;height:0;border:4px solid transparent;opacity:.25;border-top-color:currentColor;margin-top:4px}
.tbl th[aria-sort=ascending] .si{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px;opacity:1}
.tbl th[aria-sort=descending] .si{opacity:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl tbody tr[data-id]{cursor:pointer;transition:background-color .15s}
.tbl tbody tr[data-id]:hover{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-u{display:flex;align-items:center;gap:9px}
.cell-u small{display:block;color:var(--muted);font-size:.74rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pager .pg-btns{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:600}
/* popovers: bell and menus */
.pop{position:fixed;z-index:75;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);min-width:190px;max-width:min(350px,calc(100vw - 24px));padding:6px;animation:c-pop .18s ease both}
.pop .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r) - 2px);gap:8px;align-items:center;font-size:.86rem}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 12%,transparent));outline:none}
.bell-pop{width:340px;padding:0}
.bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-l{max-height:340px;overflow:auto;padding:6px}
.bell-i{display:flex;gap:10px;padding:9px 8px;border-radius:calc(var(--r) - 2px);font-size:.84rem}
.bell-i small{display:block;color:var(--muted);font-size:.74rem}
.bell-i.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-i .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.bell-i .dot.warn{background:var(--warn)}.bell-i .dot.bad{background:var(--bad)}.bell-i .dot.ok{background:var(--good)}
/* toasts */
.toasts{position:fixed;z-index:98;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--tip-bg,#16181d);color:var(--tip-ink,#fff);padding:11px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:c-toast .38s cubic-bezier(.2,.8,.2,1) both;font-size:.86rem;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(16px)}
.toast>i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.toast.warn>i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.toast.bad>i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.toast .btn{margin-left:auto;color:inherit;border-color:rgba(255,255,255,.3);background:transparent}
@keyframes c-toast{from{opacity:0;transform:translateY(14px) scale(.96)}}
/* segmented range switch */
.segc{display:inline-flex;position:relative;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:3px;background:var(--field,var(--bg));flex:none}
.segc button{position:relative;z-index:1;border:0;background:transparent;padding:.32em .75em;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:calc(var(--rb,var(--r)) - 2px);transition:color .25s}
.segc button[aria-pressed=true]{color:var(--accent-ink,#fff)}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--rb,var(--r)) - 2px);background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--muted);font-size:10.5px;font-family:var(--font-chart,inherit)}
.ax line{stroke:var(--grid,var(--line));stroke-dasharray:2 4}
.ax .base{stroke-dasharray:none}
.ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:c-draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.fadein{animation:c-fade .9s .3s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:c-grow .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes c-grow{from{transform:scaleY(0)}}
.dim .bar{opacity:.35}.dim .bar.hl{opacity:1}
.sweep{animation:c-sweep 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes c-sweep{from{stroke-dasharray:0 9999}}
.arc{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:auto;flex:none}
.d-c{font-weight:800;fill:var(--text)}.d-l{fill:var(--muted);font-size:11px}
.dleg{display:grid;gap:7px;flex:1;min-width:150px;font-size:.82rem}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;background:var(--sw);flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dleg small{color:var(--muted);width:3.2em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sw)}
.legend i.dash{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sw) 0 4px,transparent 4px 7px)}
.hl-g{opacity:0;transition:opacity .15s;pointer-events:none}
.hl-g line{stroke:var(--muted);stroke-dasharray:3 3}
.hl-g circle{stroke:var(--panel-solid,var(--panel));stroke-width:2}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.hb-t{height:9px;border-radius:9px;background:var(--track,color-mix(in srgb,var(--text) 8%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes c-w{from{width:0}}
.hb b{font-variant-numeric:tabular-nums}
.hm rect{transition:opacity .2s}
.hm .cell{animation:c-fade .5s both}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col-bg,color-mix(in srgb,var(--text) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background-color .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:10px;flex-wrap:wrap}
.kcol-h i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.kcol-h small{margin-left:auto;color:var(--muted);font-weight:600}
.kc-n{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none;position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.kc-f{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.kc-f .ibtn{width:26px;height:26px}
.grip{touch-action:none;cursor:grab}
.k-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:calc(var(--r) - 2px)}
.drop-on{outline-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:85;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.32);transition:none!important;opacity:.95}
body.is-dragging{cursor:grabbing;user-select:none}
/* month calendar */
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mc-h b{min-width:9em;text-align:center}
.mc-h .mc-x{margin-left:auto;display:flex;gap:8px}

body{font-size:14px;letter-spacing:-.005em}

.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:#fff;padding:8px 12px}

/* ---------- index sidebar ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}

.nav a small{font:600 .7rem var(--mono);width:1.6em}

.main{min-width:0;display:flex;flex-direction:column}

.menu-btn{display:none}
.nav-scrim{display:none}
.crumb{font-size:.82rem;color:var(--muted)}
.crumb b{color:var(--text)}
.tright{margin-left:auto;display:flex;align-items:center;gap:0;height:100%}
.tright button{height:100%;border:0;border-left:1px solid var(--line);background:transparent;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);position:relative}
.tright button:hover{background:var(--hover)}
.tright .badge{top:12px;right:6px;background:var(--accent);box-shadow:none}
#view{padding:30px 28px 50px;max-width:1440px;overflow-x:clip}
@keyframes ff-in{from{opacity:0;transform:translateX(-14px)}}
.enter{animation-duration:.4s;animation-delay:calc(var(--i,0) * 40ms)}
/* ---------- rules, not boxes ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line)}

.ph p{color:var(--muted);margin-top:8px}
.ph-x{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);padding:18px;position:relative;min-width:0;transition:box-shadow .2s}
.card:hover{box-shadow:inset 4px 0 0 var(--accent)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:1.05rem;font-weight:700;letter-spacing:-.02em}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px;border:1px solid var(--line)}
.kpis .kpi{border:0;border-right:1px solid var(--line)}
.kpis .kpi:last-child{border-right:0}
.kpi{display:flex;flex-direction:column}
.k-i{display:none}

.k-d{font-weight:700;font-size:.78rem}

.fl .pr small{font:600 .7rem var(--mono);color:var(--muted)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar label{font:600 .72rem var(--mono);display:flex;align-items:center;gap:8px}

.seatwrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}

.who button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.who small{margin-left:auto;font:700 .7rem var(--mono)}
.cabin{border:1px solid var(--line);padding:14px;max-height:420px;overflow:auto;position:relative}
.cabin .nose{text-align:center;font:600 .68rem var(--mono);color:var(--muted);margin-bottom:8px}
.srow{display:grid;grid-template-columns:24px repeat(3,30px) 22px repeat(3,30px);gap:5px;justify-content:center;margin-bottom:5px;align-items:center}
.srow>span{font:600 .66rem var(--mono);color:var(--muted);text-align:center}
.seat{width:30px;height:30px;border:1px solid var(--line);background:transparent;font:800 .62rem var(--mono);padding:0;color:var(--text);transition:background-color .15s,transform .15s}
.seat:hover:not(:disabled){background:var(--hover);transform:translateY(-2px)}
.seat:disabled{background:var(--grid);border-color:var(--grid);color:var(--muted);cursor:not-allowed;opacity:1}
.seat.mine{background:var(--accent);border-color:var(--accent);color:#fff;animation:ff-seat .35s cubic-bezier(.3,1.5,.5,1)}

.seat.drop-on{outline:2px solid var(--accent)}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0;border:1px solid var(--line)}
.day{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:14px;min-height:170px;transition:background-color .2s;outline:2px dashed transparent;outline-offset:-4px}

.docm th{font:600 .68rem var(--mono);text-transform:uppercase;border-bottom:1px solid var(--line)}
.dk{width:28px;height:28px;border:1px solid var(--line);background:transparent;font-weight:800;padding:0;color:var(--text)}
.dk[aria-pressed=true]{background:var(--text);color:var(--bg)}
.mbar{display:inline-block;width:70px;height:4px;background:var(--grid);vertical-align:middle;margin-right:6px}
.mbar i{display:block;height:100%;width:var(--w);background:var(--accent)}
.dsec{margin-top:18px}

.minilist li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid)}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:nth-child(2){border-right:0}.kpis .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.g-21,.g-12,.hero{grid-template-columns:minmax(0,1fr)}.hero>div+div{border-left:0;border-top:1px solid var(--line)}.sform{grid-template-columns:repeat(3,minmax(0,1fr))}.sform .fld:nth-child(3){border-right:0}.sform .fld:nth-child(-n+3){border-bottom:1px solid var(--line)}.fl{grid-template-columns:120px minmax(0,1fr) 130px}.fl .pick{grid-column:1/-1}.radar{grid-template-columns:minmax(0,1fr)}}

<script>
/* ================= Core helpers (shared by every page of this app) ================= */
const $ = (s, r = document) => r.querySelector(s);

const mqRM = matchMedia('(prefers-reduced-motion: reduce)');

function settleUp() {

/* seat map: pick a traveller, then a seat; or drag a traveller onto a seat */
function seatMap(r, q, reseat) {
  const seats = Object.fromEntries(DB.members.filter(m => m.seat).map(m => [m.seat, m.id]));
  let sel = DB.members.find(m => !m.seat) || DB.members[0];
  const L = modal({ title: `${esc(r.carrier)} ${esc(r.code)} · seat the group`, wide: true, body: `<p class="muted" style="margin-bottom:12px">Choose a traveller on the left, then a free seat. You can also drag a name onto a seat. Grey seats are taken.</p><div class="seatwrap"><ul class="who" id="who" aria-label="Travellers"></ul><div class="cabin" id="cabin"></div></div>`, foot: `<button class="btn" type="button" data-auto>${ic('users')}Seat everyone together</button><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn pri" type="button" data-book>${reseat ? 'Save seats' : 'Book ' + DB.members.length + ' seats · ' + moneyS(r.price * DB.members.length)}</button>` });
  const who = $('#who', L.el), cab = $('#cabin', L.el);
  const draw = () => {
    who.innerHTML = DB.members.map(m => { const s = Object.keys(seats).find(k => seats[k] === m.id); return `<li><button type="button" class="wb grip" data-m="${m.id}" aria-pressed="${m === sel}">${avatar(m.name, m.role === 'Organiser' ? 'me' : '')}${esc(m.name.split(' ')[0])}<small>${s || '–'}</small></button></li>`; }).join('');
    cab.innerHTML = `<div class="nose">FRONT OF THE PLANE</div>` + Array.from({ length: 30 }, (_, i) => { const row = i + 1; return `<div class="srow"><span>${row}</span>${'ABC'.split('').map(l => sb(row + l)).join('')}<span></span>${'DEF'.split('').map(l => sb(row + l)).join('')}</div>`; }).join('');
  };
  const sb = s => { const m = seats[s] && DB.members.find(x => x.id === seats[s]); return `<button class="seat${m ? ' mine' : ''}" type="button" data-seat="${s}" ${DB.taken.has(s) && !m ? 'disabled' : ''} aria-label="Seat ${s}${m ? ', ' + m.name : DB.taken.has(s) ? ', taken' : ', free'}">${m ? esc(initials(m.name)) : ''}</button>`; };
  const place = (m, s) => { Object.keys(seats).forEach(k => { if (seats[k] === m.id) delete seats[k]; }); if (seats[s]) { const other = seats[s]; delete seats[s]; toast('Swapped with ' + DB.members.find(x => x.id === other).name.split(' ')[0]); } seats[s] = m.id; const next = DB.members.find(x => !Object.values(seats).includes(x.id)); if (next) sel = next; draw(); const b = $(`[data-seat="${s}"]`, cab); b && b.focus(); };
  draw();
  L.el.addEventListener('click', e => {
    const w = e.target.closest('[data-m]'); if (w) { sel = DB.members.find(x => x.id === w.dataset.m); draw(); $(`[data-m="${sel.id}"]`, who).focus(); return; }
    const s = e.target.closest('[data-seat]'); if (s && !s.disabled) { place(sel, s.dataset.seat); return; }
    if (e.target.closest('[data-auto]')) { Object.keys(seats).forEach(k => delete seats[k]); let n = 0; for (let row = 8; row <= 30 && n < DB.members.length; row++) for (const l of 'ABCDEF') { const k = row + l; if (!DB.taken.has(k) && n < DB.members.length) seats[k] = DB.members[n++].id; } draw(); toast(n === DB.members.length ? 'Everyone sits together' : 'Seated as close as possible'); return; }
    if (e.target.closest('[data-book]')) { const n = Object.keys(seats).length; if (n < DB.members.length) { toast(`${DB.members.length - n} travellers still need a seat`, 'warn'); return; } DB.members.forEach(m => m.seat = Object.keys(seats).find(k => seats[k] === m.id) || ''); DB.flight = { ...r };
      /* keep one flight booking for the group in the bookings list */
      const fb = DB.bookings.find(b => b.main), data = { type: 'Flight', title: `${r.carrier} ${r.code}, ${n} seats`, where: PORTS[q.from] || PORTS[DB.trip.from], date: DB.trip.dep, cost: r.price * n, status: 'Confirmed', ref: r.code };
      if (fb) Object.assign(fb, data); else DB.bookings.unshift({ id: 'B' + (DB.seq.b++), main: true, ...data });
      L.close(true); Bell.add(reseat ? 'Seats saved' : `Booked ${r.carrier} ${r.code}`, `${n} seats · ${moneyS(r.price * n)}`, 'ok'); redo(); }
  });
  ddrop(L.el, { item: '.wb', zone: '.seat', drop: (it, zone) => { if (zone.disabled) return; place(DB.members.find(x => x.id === it.dataset.m), zone.dataset.seat); } });

  v.addEventListener('click', e => { const mv = e.target.closest('[data-mv]'); if (mv) { const a = DB.itin.find(x => x.id === mv.dataset.mv); menu(mv, Array.from({ length: DB.trip.days }, (_, d) => ({ label: 'Day ' + (d + 1) + ' · ' + fd(addDays(DB.trip.dep, d)), disabled: d === a.day, run: () => moveTo(a, d) }))); return; } const act = e.target.closest('.act'); if (act && !e.target.closest('button') && Date.now() - (act._dragged || 0) > 400) editAct(DB.itin.find(x => x.id === act.dataset.a)); });
  v.addEventListener('keydown', e => { const act = e.target.closest('.act'); if (act && e.key === 'Enter') editAct(DB.itin.find(x => x.id === act.dataset.a)); });
  const F = () => [{ k: 'title', label: 'Activity', req: true, full: true }, { k: 'day', label: 'Day', type: 'select', options: Array.from({ length: DB.trip.days }, (_, d) => ({ v: d, l: 'Day ' + (d + 1) })) }, { k: 'time', label: 'Time', type: 'time', req: true, def: '10:00' }];
  const editAct = a => { if (a.fly) { toast('Flights are fixed. Change them on the Flights page.', 'warn'); return; } const L = formModal({ title: 'Edit activity', fields: F(), values: a, submit: 'Save', onSubmit: x => { Object.assign(a, { title: x.title, day: +x.day, time: x.time }); draw(); toast('Activity updated'); } }); L.el.querySelector('.l-foot').insertAdjacentHTML('afterbegin', `<button class="btn ghost" type="button" data-delact style="margin-right:auto">${ic('trash')}Delete</button>`); L.el.querySelector('[data-delact]').onclick = async () => { if (await confirmBox(`Delete “${esc(a.title)}”?`)) { DB.itin.splice(DB.itin.indexOf(a), 1); L.close(); draw(); toast('Activity deleted', 'warn'); } }; };
  $('[data-add]', v).onclick = () => formModal({ title: 'Add activity', fields: F(), submit: 'Add', onSubmit: x => { DB.itin.push({ id: 'A' + (DB.seq.a++), title: x.title, day: +x.day, time: x.time, fly: false }); draw(); toast('Added to day ' + (+x.day + 1)); } });
});

/* --- Bookings --- */
page('bookings', 'Bookings', (v, p) => {
  const r = resourcePage(v, {
    title: 'Bookings', sub: 'Hotels, tours, transfers and flights booked for the group.', noun: 'booking', data: () => DB.bookings, sort: 'date', dir: 1, param: p,
    cols: [C.id('ref', 'Ref'), C.txt('type', 'Type'), C.txt('title', 'What'), C.txt('where', 'Where'), C.date('date', 'Date'), C.money('cost', 'Cost'), C.tag('status', 'Status')],
    filters: [{ label: 'All' }, ...['Flight', 'Hotel', 'Tour', 'Transfer'].map(t => ({ label: t, fn: b => b.type === t })), { label: 'Pending', fn: b => b.status === 'Pending' }],
    kpis: d => [{ label: 'Bookings', value: d.filter(b => b.status !== 'Cancelled').length }, { label: 'Confirmed', value: sum(d.filter(b => b.status === 'Confirmed').map(b => b.cost)), f: 'moneyS' }, { label: 'Pending', value: d.filter(b => b.status === 'Pending').length, note: 'waiting for the supplier' }, { label: 'Per traveller', value: sum(d.filter(b => b.status !== 'Cancelled').map(b => b.cost)) / DB.members.length, f: 'money' }],
    fields: [{ k: 'type', label: 'Type', type: 'select', options: ['Hotel', 'Tour', 'Transfer', 'Flight'] }, { k: 'title', label: 'What', req: true, full: true }, { k: 'where', label: 'Where', type: 'select', options: ['Istanbul', 'Cappadocia', 'Lahore'] }, { k: 'date', label: 'Date', type: 'date', req: true, def: dkey(DB.trip.dep) }, { k: 'cost', label: 'Cost (Rs)', type: 'number', min: 0, req: true }, { k: 'status', label: 'Status', type: 'select', options: ['Pending', 'Confirmed', 'Cancelled'] }, { k: 'ref', label: 'Confirmation code', req: true }],
    make: x => ({ id: 'B' + (DB.seq.b++), ...x }),
    dActions: b => b.status === 'Pending' ? `<button class="btn" type="button" data-conf>${ic('check')}Mark confirmed</button>` : '',
    onDetail: (el, b, L, refresh) => { const c = el.querySelector('[data-conf]'); c && (c.onclick = () => { b.status = 'Confirmed'; L.close(); refresh(); Bell.add(b.title + ' confirmed', b.ref, 'ok'); }); }
  });
  pageRefresh = r.refresh;
});

/* --- Money: budget and settle-up --- */
page('money', 'Money', v => {
  v.innerHTML = pageHead('Money', 'Shared costs, who paid what, and the fewest payments to square everyone up.', `<button class="btn pri" type="button" data-add>${ic('plus')}Add expense</button>`) + `<section class="kpis" id="mk"></section><div class="g g-12"><section class="card"><div class="card-h"><h2>Settle up</h2><small id="sn"></small></div><ul class="owe" id="owe"></ul></section><section class="card"><div class="card-h"><h2>Balances</h2><small>+ is owed money</small></div><div class="chart" id="bal"></div></section></div><section class="card"><div class="dt" id="ex"></div></section>`;
  const draw = () => {
    const { bal, out } = settleUp(), tot = sum(DB.expenses.map(x => x.amount));
    $('#mk', v).innerHTML = [{ label: 'Shared spend', value: tot, f: 'money' }, { label: 'Per person', value: tot / DB.members.length, f: 'money' }, { label: 'Payments to settle', value: out.length, note: 'fewest possible' }, { label: 'Budget left', value: DB.trip.budget - sum(DB.bookings.filter(b => b.status !== 'Cancelled').map(b => b.cost)), f: 'moneyS' }].map(kpiHTML).join(''); counts($('#mk', v));
    $('#sn', v).textContent = out.length + ' PAYMENTS';
    $('#owe', v).innerHTML = out.map((o, i) => `<li>${avatar(o.from)}<span>${esc(o.from.split(' ')[0])}</span><span class="arrow" aria-hidden="true"></span><span class="sr">pays</span>${avatar(o.to, mem(o.to) && mem(o.to).role === 'Organiser' ? 'me' : '')}<span>${esc(o.to.split(' ')[0])}</span><b class="amt" style="margin-left:auto">${money(o.amt)}</b><button class="btn sm" type="button" data-pay="${i}">Paid</button></li>`).join('') || '<li class="empty">Everyone is square.</li>';
    $('#owe', v)._out = out;
    const ents = Object.entries(bal).sort((a, b) => b[1] - a[1]);
    barChart($('#bal', v), { labels: ents.map(([n]) => n.split(' ')[0]), series: [{ name: 'Balance', data: ents.map(([, x]) => Math.round(x)), color: 'var(--c1)' }], h: 230, tfmt: money, yfmt: x => short(x), xw: 50 });
    ex.draw();
  };
  const ex = DataTable($('#ex', v), { rows: () => DB.expenses, sort: 'date', ph: 'Search expenses…', cols: [C.txt('title', 'Expense'), C.who('payer', 'Paid by'), C.money('amount', 'Amount'), { k: 'split', label: 'Split between', sort: false, f: s => s.length === DB.members.length ? 'Everyone' : s.length + ' people' }, C.date('date', 'Date'), { k: 'settled', label: 'Status', f: s => tagS(s ? 'Paid' : 'Unpaid').replace('>Paid<', '>Settled<').replace('>Unpaid<', '>Open<') }], onRow: x => expModal(x) });
  const expModal = x => { const L = formModal({ title: x ? 'Edit expense' : 'Add expense', fields: [{ k: 'title', label: 'What for', req: true, full: true }, { k: 'amount', label: 'Amount (Rs)', type: 'number', min: 1, req: true }, { k: 'payer', label: 'Paid by', type: 'select', options: DB.members.map(m => m.name) }, { k: 'date', label: 'Date', type: 'date', req: true, def: dkey(NOW) }, { k: 'who', label: 'Split between', type: 'select', options: ['Everyone', 'Just the payer and organiser'] }], values: x ? { ...x, who: x.split.length === DB.members.length ? 'Everyone' : 'Just the payer and organiser' } : {}, submit: x ? 'Save' : 'Add', onSubmit: y => { const split = y.who === 'Everyone' ? DB.members.map(m => m.name) : [...new Set([y.payer, DB.trip.organiser])]; if (x) Object.assign(x, { title: y.title, amount: y.amount, payer: y.payer, date: y.date, split }); else DB.expenses.unshift({ id: 'X' + (DB.seq.x++), title: y.title, amount: y.amount, payer: y.payer, date: y.date, split, settled: false }); draw(); toast(x ? 'Expense updated' : 'Expense added. Balances updated.'); } }); if (x) { L.el.querySelector('.l-foot').insertAdjacentHTML('afterbegin', `<button class="btn ghost" type="button" data-delx style="margin-right:auto">${ic('trash')}Delete</button>`); L.el.querySelector('[data-delx]').onclick = async () => { if (await confirmBox(`Delete “${esc(x.title)}”?`)) { const i = DB.expenses.indexOf(x); DB.expenses.splice(i, 1); L.close(); draw(); toast('Expense deleted', 'warn', { undo: () => { DB.expenses.splice(i, 0, x); draw(); } }); } }; } };
  $('#owe', v).addEventListener('click', e => { const b = e.target.closest('[data-pay]'); if (!b) return; const o = $('#owe', v)._out[+b.dataset.pay]; DB.expenses.unshift({ id: 'X' + (DB.seq.x++), title: `Settle up: ${o.from.split(' ')[0]} to ${o.to.split(' ')[0]}`, amount: o.amt, payer: o.from, date: new Date(), split: [o.to], settled: false }); draw(); toast(`${o.from.split(' ')[0]} paid ${o.to.split(' ')[0]} ${money(o.amt)}`); });
  $('[data-add]', v).onclick = () => expModal(); draw(); pageRefresh = draw;
});

/* --- Documents matrix --- */
page('docs', 'Documents', v => {
  v.innerHTML = pageHead('Documents', 'Tick off each document as it comes in. Send a reminder to anyone still missing something.', `<button class="btn" type="button" data-remind>${ic('send')}Remind everyone missing a document</button>`) + `<section class="kpis" id="dk"></section><section class="card"><div class="docm"><table><thead><tr><th scope="col">Traveller</th>${DOCS.map(d => `<th scope="col">${d}</th>`).join('')}<th scope="col">Done</th></tr></thead><tbody id="db"></tbody></table></div></section>`;
  const draw = () => {
    $('#db', v).innerHTML = DB.members.map(m => { const n = DOCS.filter(d => m.docs[d]).length; return `<tr><td><div class="cell-u">${avatar(m.name, m.role === 'Organiser' ? 'me' : '')}${esc(m.name)}</div></td>${DOCS.map(d => `<td><button class="dk" type="button" data-m="${m.id}" data-d="${d}" aria-pressed="${!!m.docs[d]}" aria-label="${esc(m.name)}: ${d} ${m.docs[d] ? 'received' : 'missing'}">${m.docs[d] ? '✓' : ''}</button></td>`).join('')}<td><span class="mbar"><i style="--w:${n / DOCS.length * 100}%"></i></span><span class="mono">${n}/${DOCS.length}</span></td></tr>`; }).join('');
    const all = DB.members.length * DOCS.length, have = sum(DB.members.map(m => DOCS.filter(d => m.docs[d]).length));
    $('#dk', v).innerHTML = [{ label: 'Documents in', value: have / all * 100, f: 'pct', note: `${have} of ${all}` }, { label: 'Fully ready', value: DB.members.filter(m => DOCS.every(d => m.docs[d])).length, note: 'travellers' }, { label: 'Missing visas', value: DB.members.filter(m => !m.docs.Visa).length }, { label: 'Missing insurance', value: DB.members.filter(m => !m.docs.Insurance).length }].map(kpiHTML).join(''); counts($('#dk', v));
  };
  draw(); pageRefresh = draw;
  $('#db', v).addEventListener('click', e => { const b = e.target.closest('.dk'); if (!b) return; const m = DB.members.find(x => x.id === b.dataset.m); m.docs[b.dataset.d] = !m.docs[b.dataset.d]; if (b.dataset.d === 'Visa') m.visa = m.docs.Visa ? 'Approved' : 'In process'; draw(); $(`.dk[data-m="${m.id}"][data-d="${b.dataset.d}"]`, v).focus(); if (DOCS.every(d => m.docs[d])) Bell.add(m.name.split(' ')[0] + ' is fully ready', 'All documents in', 'ok', true); });
  $('[data-remind]', v).onclick = () => { const n = DB.members.filter(m => DOCS.some(d => !m.docs[d])).length; toast(n ? `Reminders sent to ${n} travellers` : 'Nobody is missing anything'); };
});

/* --- Settings --- */
page('settings', 'Settings', v => {
  v.innerHTML = pageHead('Settings', 'Trip details and display.') + `<div class="g g-2"><section class="card"><div class="card-h"><h2>Trip</h2></div><form class="form" id="tf" novalidate>${formHTML([{ k: 'name', label: 'Trip name', req: true, full: true }, { k: 'from', label: 'Home airport', type: 'select', options: Object.entries(PORTS).map(([c, n]) => ({ v: c, l: c + ' ' + n })) }, { k: 'days', label: 'Days', type: 'number', min: 1, max: 30, req: true }, { k: 'budget', label: 'Total budget (Rs)', type: 'number', min: 1, req: true }, { k: 'dep', label: 'Departure date', type: 'date', req: true }], DB.trip)}<div class="fld full"><button class="btn pri" type="submit">${ic('check')}Save</button></div></form></section><section class="card set-sec"><div class="card-h" style="margin:0"><h2>Display and alerts</h2></div>${switchHTML('s-dark', 'Dark theme', Theme.get() === 'dark')}${switchHTML('s-rm', 'Reduce motion', document.documentElement.classList.contains('rm'))}${switchHTML('s-1', 'WhatsApp the group when bookings change', true)}<div class="card-h" style="margin:8px 0 0"><h2>Demo data</h2></div><p class="muted">Travellers, carriers and prices are invented.</p><button class="btn danger" type="button" data-reset style="justify-self:start">${ic('refresh')}Reset demo data</button></section></div>`;
  $('#tf', v).addEventListener('submit', e => { e.preventDefault(); const x = readForm(e.target, [{ k: 'name', label: 'Name', req: true }, { k: 'from', label: 'From' }, { k: 'days', label: 'Days', type: 'number', min: 1, max: 30, req: true }, { k: 'budget', label: 'Budget', type: 'number', min: 1, req: true }, { k: 'dep', label: 'Departure', type: 'date', req: true, valid: d => fromKey(d) < NOW ? 'Pick a future date' : '' }]); if (x) { x.dep.setHours(3, 40); Object.assign(DB.trip, x); DB.itin.forEach(a => { if (a.day >= x.days) a.day = x.days - 1; }); toast('Trip saved'); } });
  $('#s-dark', v).onchange = e => Theme.set(e.target.checked ? 'dark' : 'light');
  $('#s-rm', v).onchange = e => { RM = e.target.checked; document.documentElement.classList.toggle('rm', RM); toast(RM ? 'Motion reduced' : 'Motion back on'); };
  $('#s-1', v).onchange = () => toast('Setting saved');
  $('[data-reset]', v).onclick = async () => { if (await confirmBox('Reset all demo data? Your changes will be lost.', { ok: 'Reset data' })) { DB = makeData(); LS.del('q'); Bell.list = []; Bell.badge(); toast('Demo data reset'); location.hash = '#/trip'; } };
});

/* ================= Start ================= */
DB = makeData();
Theme.init();
Bell.init($('[data-bell]'));
Bell.add('Balloon slot on hold', 'Confirm by Friday to keep 14 seats', 'warn', true);
Bell.add('Visas approved for 9 travellers', '3 still in process', 'ok', true);
Cmdk.extra = [{ label: 'Search flights', hint: 'Action', run: () => { location.hash = '#/flights'; } }, { label: 'Add expense', hint: 'Action', run: () => { location.hash = '#/money'; setTimeout(() => { const b = $('[data-add]'); b && b.click(); }, 300); } }, { label: 'Toggle dark theme', hint: 'Action', run: () => Theme.toggle() }, ...DB.members.map(m => ({ label: m.name, hint: 'Traveller', run: () => { location.hash = '#/group/' + m.id; } }))];
const sfd = () => { $('#sf-days').textContent = Math.max(0, Math.ceil((DB.trip.dep - Date.now()) / DAY)); };
sfd(); every(60000, sfd, true);
Router.start();
</script>
</body>
</html>
