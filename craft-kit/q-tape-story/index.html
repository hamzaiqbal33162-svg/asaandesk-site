<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tape Story · a timeline on a tape measure</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: safety yellow on concrete (light) and on a charcoal workbench (dark) ---------- */
  :root {
    --bg: #e4e2dc; --bg-2: #f4f3ef; --speck: rgba(40, 38, 32, 0.07); --ink: #1d1f22; --muted: #686a6e;
    --card: #ffffff; --line: rgba(29, 31, 34, 0.12); --yellow: #ffcb1f; --yellow-2: #ffdd5c; --yellow-3: #d9a400;
    --tick: #1d1f22; --red: #e8452c; --steel-1: #f4f5f7; --steel-2: #9ca2ad; --shadow: rgba(30, 28, 20, 0.3); --focus: #e8452c;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #101113; --bg-2: #1d1f23; --speck: rgba(255, 255, 255, 0.035); --ink: #f2f2ee; --muted: #a3a5aa;
    --card: #1f2125; --line: rgba(255, 255, 255, 0.1); --yellow: #ffc81a; --yellow-2: #ffdb55; --yellow-3: #c99700;
    --tick: #1b1c1e; --red: #ff6b4d; --steel-1: #e3e6ea; --steel-2: #7d838e; --shadow: rgba(0, 0, 0, 0.6); --focus: #ffc81a;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background:
      radial-gradient(circle at 20% 30%, var(--speck) 0 1px, transparent 1.5px) 0 0 / 23px 23px,
      radial-gradient(circle at 70% 60%, var(--speck) 0 1px, transparent 1.5px) 0 0 / 31px 31px,
      radial-gradient(80% 60% at 50% 25%, var(--bg-2), var(--bg));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }

  .stage { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 22px 16px; }
  .wrap { width: min(920px, 100%); }
  .head { text-align: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .eyebrow i { width: 18px; height: 6px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--ink) 0 1.5px, var(--yellow) 1.5px 4px); }
  h1 { margin: 0; font-size: clamp(25px, 4.4vw, 40px); line-height: 1.07; letter-spacing: -0.03em; font-weight: 820; }
  .lede { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; }

  /* ---------- Bench: flag card, tape, case ---------- */
  .bench { position: relative; height: 318px; margin-top: 14px; }
  .flag { position: absolute; left: 0; top: 18px; width: 300px; perspective: 700px; z-index: 3; will-change: transform; }
  .flag-card {
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 16px 18px 16px 16px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 22px 34px -24px var(--shadow); border-top: 5px solid var(--yellow);
    transform-origin: 50% 100%;
  }
  .flag-card.hide { transform: scaleY(0) translateY(40px); opacity: 0; transition: transform 0.4s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.3s 0.1s; }
  .flag-card.rise { animation: rise 0.7s cubic-bezier(0.3, 1.5, 0.45, 1); }
  @keyframes rise { from { transform: scaleY(0.2) translateY(40px); opacity: 0; } 50% { opacity: 1; } }
  .flag-card.swap { animation: swap 0.5s cubic-bezier(0.4, 0, 0.3, 1); }
  @keyframes swap { 45% { transform: rotateX(88deg); } 100% { transform: rotateX(0); } }
  .badge { grid-row: span 2; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--yellow); color: #1d1f22; box-shadow: inset 0 -3px 0 var(--yellow-3); }
  .badge svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .yr { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; color: var(--red); font-variant-numeric: tabular-nums; }
  .ttl { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: -0.015em; }
  .txt { grid-column: 1 / -1; margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
  .stem { position: absolute; top: 0; left: 0; width: 2px; margin-left: -1px; background: repeating-linear-gradient(180deg, var(--ink) 0 4px, transparent 4px 7px); opacity: 0.45; z-index: 2; transform-origin: 50% 100%; transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .stem.hide { transform: scaleY(0); }

  .hint { position: absolute; left: 110px; top: 170px; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .hint.on { opacity: 1; }
  .hint svg { width: 22px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(6px); } }

  .tape { position: absolute; left: 0; top: 252px; height: 28px; width: 0; overflow: hidden; border-radius: 0 3px 3px 0; z-index: 1; box-shadow: 0 6px 8px -6px var(--shadow); }
  .tape svg { position: absolute; left: 0; top: 0; height: 28px; display: block; }
  .tape .lit { animation: rivet 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes rivet { 40% { r: 4.4; } }
  .hook { position: absolute; left: 0; top: 244px; width: 9px; height: 44px; margin-left: -2px; border-radius: 2px 4px 4px 2px; z-index: 4; background: linear-gradient(90deg, var(--steel-1), var(--steel-2)); box-shadow: 2px 3px 6px -2px rgba(0, 0, 0, 0.45); transform-origin: 0 50%; pointer-events: none; }
  .hook::before { content: ""; position: absolute; left: 2px; top: 6px; width: 3px; height: 3px; border-radius: 50%; background: rgba(0, 0, 0, 0.35); box-shadow: 0 26px 0 rgba(0, 0, 0, 0.35); }
  .rail { position: absolute; left: 0; right: 0; top: 286px; height: 2px; background: var(--line); }
  /* the whole scale printed faintly on the bench, so the years ahead are visible before the tape gets there */
  .print { position: absolute; left: 0; top: 252px; height: 28px; z-index: 0; opacity: 0.5; pointer-events: none; }
  .print text, .print rect { fill: var(--muted); }
  input[type="range"].pull {
    position: absolute; top: 218px; height: 96px; margin: 0; padding: 0; z-index: 5; opacity: 0; cursor: grab; -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type="range"].pull:active { cursor: grabbing; }
  input[type="range"].pull::-webkit-slider-thumb { -webkit-appearance: none; width: 2px; height: 96px; }
  input[type="range"].pull::-moz-range-thumb { width: 2px; height: 96px; border: 0; }
  .pull:focus-visible ~ .hook { outline: 2.5px solid var(--focus); outline-offset: 4px; }

  /* the case */
  .case { position: absolute; left: 0; top: 180px; width: 104px; height: 104px; z-index: 4; transform-origin: 30% 90%; }
  .case.bump { animation: bump 0.22s ease-out; }
  @keyframes bump { 40% { transform: translateX(2px) rotate(1deg); } }
  .case.thunk { animation: thunk 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes thunk { 20% { transform: translateX(5px) rotate(3deg) scale(1.03); } 50% { transform: translateX(-2px) rotate(-1.5deg); } }
  .case svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 12px 10px var(--shadow)); }
  .spool { transform-box: fill-box; transform-origin: center; }

  .ctrls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .years { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .years .s { display: none; }
  .years button { min-width: 44px; height: 34px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 750; cursor: pointer; font-variant-numeric: tabular-nums; transition: background 0.25s, color 0.25s, transform 0.4s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .years button[aria-current="true"] { background: var(--yellow); color: #1d1f22; border-color: var(--yellow-3); transform: translateY(-2px); }
  .rewind { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 9px; border: 0; background: var(--ink); color: var(--bg-2); font: inherit; font-size: 13px; font-weight: 750; cursor: pointer; transition: transform 0.4s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .rewind:active { transform: scale(0.94); }
  .rewind svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .rewind.spin svg { animation: spin 0.7s cubic-bezier(0.3, 1.3, 0.5, 1); }
  @keyframes spin { to { transform: rotate(-360deg); } }

  .spark { position: absolute; width: 6px; height: 6px; border-radius: 1px; z-index: 6; pointer-events: none; background: var(--c); animation: spark 0.9s ease-out forwards; }
  @keyframes spark { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }

  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; margin: -3px 0 0 -4px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 80vw), var(--gy, 110vh)); transition: transform 0.7s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost.follow { transition: opacity 0.35s; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--red); opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  @media (max-width: 600px) {
    .bench { height: 308px; }
    .years .f { display: none; }
    .years .s { display: inline; }
    .years button { min-width: 34px; padding: 0 4px; }
    .years { gap: 3px; }
    .rewind { padding: 0 10px; }
    .rewind .rw { display: none; }
    .flag { width: min(300px, 100%); top: 12px; }
    .flag-card { padding: 14px 14px 14px 13px; gap: 3px 12px; }
    .badge { width: 46px; height: 46px; }
    .ttl { font-size: 16.5px; }
    .txt { font-size: 13px; }
    .case { width: 80px; height: 80px; top: 218px; }
    .hint { left: 86px; }
    .years button { min-width: 40px; height: 32px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
    .spark { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="wrap" aria-labelledby="ttl">
    <header class="head">
      <p class="eyebrow"><i></i>Our story</p>
      <h1 id="ttl">Eight years, measured out</h1>
      <p class="lede">Pull the tape along the bench to travel through the years.</p>
    </header>
    <div class="bench" id="bench">
      <span class="stem hide" id="stem" aria-hidden="true"></span>
      <div class="flag" id="flag" aria-hidden="true">
        <div class="flag-card hide" id="card">
          <span class="badge" id="badge"></span>
          <span class="yr" id="yr">2019</span>
          <h2 class="ttl" id="cttl">Two laptops in a Lahore garage</h2>
          <p class="txt" id="ctxt"></p>
        </div>
      </div>
      <span class="hint on" id="hint" aria-hidden="true">Pull the tape <svg viewBox="0 0 22 14"><path d="M1 7h19M14 1l6 6-6 6"/></svg></span>
      <svg class="print" id="print" aria-hidden="true"></svg>
      <div class="tape" id="tape" aria-hidden="true"><svg id="scale"></svg></div>
      <span class="rail" aria-hidden="true"></span>
      <label class="sr-only" for="pull">Year on the timeline</label>
      <input class="pull" id="pull" type="range" min="0" max="7" step="0.01" value="0" />
      <span class="hook" id="hook" aria-hidden="true"></span>
      <div class="case" id="case" aria-hidden="true">
        <svg viewBox="0 0 104 104">
          <rect x="2" y="2" width="100" height="100" rx="24" style="fill:var(--yellow-3)"/>
          <rect x="2" y="0" width="100" height="98" rx="24" style="fill:var(--yellow)"/>
          <path d="M2 26a24 24 0 0 1 24-24h6v96h-6A24 24 0 0 1 2 74z" fill="#25272b"/>
          <path d="M8 30h18M8 40h18M8 50h18M8 60h18M8 70h18" stroke="#3b3e44" stroke-width="3" stroke-linecap="round"/>
          <circle cx="64" cy="48" r="27" fill="#25272b"/>
          <g class="spool" id="spool"><circle cx="64" cy="48" r="21" style="fill:var(--yellow-2)"/><circle cx="64" cy="48" r="15" fill="none" stroke="#25272b" stroke-width="1.2" opacity=".4"/><path d="M64 31v34M47 48h34M52 36l24 24M76 36L52 60" stroke="#25272b" stroke-width="2.2" stroke-linecap="round"/><circle cx="64" cy="48" r="5" fill="#25272b"/></g>
          <rect x="54" y="-6" width="22" height="9" rx="3" style="fill:var(--red)"/>
          <rect x="96" y="76" width="8" height="18" rx="2" fill="#25272b"/>
        </svg>
      </div>
    </div>
    <div class="ctrls">
      <div class="years" id="years" aria-label="Jump to a year"></div>
      <button class="rewind" type="button" id="rewind" aria-label="Rewind the tape"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg><span class="rw">Rewind</span></button>
    </div>
    <p class="sr-only" aria-live="polite" id="status"></p>
  </section>
</main>
<div class="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
  (function () {
    "use strict";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (s) { return document.querySelector(s); };

    /* ---------- Milestones (a made-up company) ---------- */
    var ICON = {
      laptop: '<rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M3 19h18l-2-4H5z"/>',
      store: '<path d="M4 10l1.5-5h13L20 10M4 10a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12v8h13v-8M10 20v-4h4v4"/>',
      tower: '<path d="M4 21h16M6 21V7l6-4 6 4v14M10 21v-4h4v4M9 9h1M14 9h1M9 13h1M14 13h1"/>',
      phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2M10 8l2 2 3-4"/>',
      crowd: '<circle cx="12" cy="8" r="3"/><path d="M6.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="5" cy="10" r="2"/><circle cx="19" cy="10" r="2"/><path d="M2 18a3.5 3.5 0 0 1 4-3.4M22 18a3.5 3.5 0 0 0-4-3.4"/>',
      bolt: '<path d="M13 2L5 13h6l-1 9 8-11h-6z"/>',
      plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4M3 3l18 18"/>',
      star: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>'
    };
    var M = [
      { y: 2019, i: "laptop", t: "Two laptops in a Lahore garage", d: "Fahad and Sana build a till app for her father's corner shop." },
      { y: 2020, i: "store", t: "100 shops in the lockdown", d: "Corner stores move their ledgers online almost overnight." },
      { y: 2021, i: "tower", t: "A second desk in Karachi", d: "Our first office by the sea opens above a printing press." },
      { y: 2022, i: "phone", t: "The app goes mobile", d: "Sell, scan and print receipts straight from a phone." },
      { y: 2023, i: "crowd", t: "10,000 sellers", d: "From tyre shops in Peshawar to bakeries in Quetta." },
      { y: 2024, i: "bolt", t: "Same-day payouts", d: "Card and wallet sales reach the bank before closing time." },
      { y: 2025, i: "plug", t: "Offline mode", d: "A power cut stops being a reason to stop selling." },
      { y: 2026, i: "star", t: "1 million orders a month", d: "And we still answer the support line ourselves." }
    ];
    var N = M.length;
    var bench = $("#bench"), tape = $("#tape"), scale = $("#scale"), hook = $("#hook"), input = $("#pull"), caseEl = $("#case"), spool = $("#spool"), print = $("#print");
    var flag = $("#flag"), card = $("#card"), stem = $("#stem"), hint = $("#hint"), status = $("#status"), yearsEl = $("#years");
    var G = {}, L = 6, Lv = 0, T = 6, spin = 0, shown = -1, retracted = true, rivets = [];

    /* ---------- Year buttons ---------- */
    var chips = M.map(function (m, i) {
      var b = document.createElement("button");
      b.type = "button"; b.innerHTML = '<span class="f">' + m.y + '</span><span class="s">’' + String(m.y).slice(2) + "</span>"; b.setAttribute("aria-label", m.y + ": " + m.t);
      b.addEventListener("click", function () { goTo(i); });
      yearsEl.appendChild(b);
      return b;
    });

    /* ---------- Geometry and the printed scale ---------- */
    function measure() {
      var w = bench.clientWidth || 360, cw = caseEl.offsetWidth || 104;
      G.x0 = cw - 6;                 // where the tape leaves the case
      G.x1 = w - 12;                 // the far end of the bench
      G.pad = w < 520 ? 30 : 36;     // tape before the first year (room for its label)
      G.step = (G.x1 - G.x0 - G.pad * 2) / (N - 1);
      G.small = w < 520;
      tape.style.left = G.x0 + "px";
      input.style.left = (G.x0 + G.pad - 1) + "px";
      input.style.width = (G.step * (N - 1) + 2) + "px";
      caseEl.style.top = (252 + 14 - caseEl.offsetHeight * 0.86) + "px";
      print.style.left = G.x0 + "px";
      // ticks every quarter year, a long tick and the year at each milestone, a rivet that lights when passed
      var W = G.x1 - G.x0 + 4, ticks = "";
      for (var q = 0; q <= (N - 1) * 4; q++) {
        var x = G.pad + q * G.step / 4, major = q % 4 === 0;
        if (G.small && q % 2) continue; // fewer ticks on narrow screens
        ticks += '<rect x="' + (x - 0.75).toFixed(1) + '" y="0" width="1.5" height="' + (major ? 11 : q % 2 ? 5 : 7) + '" fill="#1b1c1e"/>';
        if (major) {
          var yr = G.small ? "’" + String(M[q / 4].y).slice(2) : M[q / 4].y;
          ticks += '<text x="' + (x - 3.5).toFixed(1) + '" y="21" text-anchor="end" font-size="' + (G.small ? 8.5 : 10) + '" font-weight="800" fill="#1b1c1e" font-family="system-ui,sans-serif">' + yr + "</text>";
        }
      }
      var s = '<rect width="' + W + '" height="28" style="fill:var(--yellow)"/><rect width="' + W + '" height="3" y="25" style="fill:var(--yellow-3)"/>' + ticks;
      for (var k = 0; k < N; k++) s += '<circle data-r="' + k + '" cx="' + (G.pad + k * G.step).toFixed(1) + '" cy="24" r="0" style="fill:var(--red)"/>';
      scale.setAttribute("width", W); scale.setAttribute("viewBox", "0 0 " + W + " 28");
      scale.innerHTML = s;
      print.setAttribute("width", W); print.setAttribute("viewBox", "0 0 " + W + " 28");
      print.innerHTML = '<rect y="27" width="' + W + '" height="1"/>' + ticks;
      rivets = Array.prototype.slice.call(scale.querySelectorAll("circle"));
      rivets.forEach(function (c) { c._lit = false; });
    }
    function Lfor(v) { return G.pad + v * G.step; }

    /* ---------- Moving the tape ---------- */
    function goTo(i, quiet) {
      i = Math.max(0, Math.min(N - 1, i));
      retracted = false;
      input.value = i;
      T = Lfor(i);
      chips.forEach(function (c, k) { c.setAttribute("aria-current", String(k === i)); });
      input.setAttribute("aria-valuetext", M[i].y + ": " + M[i].t);
      if (!quiet) status.textContent = M[i].y + ". " + M[i].t + ". " + M[i].d;
    }
    function rewind() {
      retracted = true;
      T = 4;
      chips.forEach(function (c) { c.setAttribute("aria-current", "false"); });
      var b = $("#rewind"); b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
      status.textContent = "Tape rewound into the case.";
    }
    input.addEventListener("input", function () { retracted = false; T = Lfor(+input.value); });
    input.addEventListener("change", function () { goTo(Math.round(+input.value)); });
    input.addEventListener("keydown", function (e) {
      var cur = retracted ? -1 : Math.round(+input.value), to = null;
      if (e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "PageUp") to = cur + 1;

    /* ---------- Flag card ---------- */

    /* ---------- Spring loop: the tape chases its target, the spool spins, the hook leans ---------- */

      var fx = Math.max(0, Math.min(bw - fw, hx - fw / 2));

      var ch = card.offsetHeight, top = flag.offsetTop + ch;

    /* ---------- Auto-demo: pulls the tape year by year, then rewinds ---------- */

    function ghostAt(x, y) { ghost.style.setProperty("--gx", x + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function tap(then) { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (then) then(); }, 170); }
    function stopDemo() { if (!demoOn) return; demoOn = false; timers.forEach(clearTimeout); ghost.classList.remove("show", "tap", "follow"); }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) {

    });

    function demo() {

      later(function () { var p = hookXY(); ghost.classList.add("show"); ghostAt(p.x, p.y); }, 700);

        t += i === N - 1 ? 700 : 1250;

      later(function () { tap(rewind); }, t + 1700);
