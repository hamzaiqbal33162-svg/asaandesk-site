<script>/* Pick the theme before first paint: ?theme= wins, then the saved choice, then the default */(function(k,d){var t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(k+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})('proscenia','');</script>
<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Proscenia look: velvet crimson and gold, programme-paper light mode, engraved capitals ================= */
:root{--font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;--cap:"Copperplate","Copperplate Gothic Light","Trajan Pro",Georgia,serif;--rb:6px;--ri:6px;--rm:12px;--rp:8px;
--bg:#f6efe2;--surface:#fffaf1;--surface2:#f3e8d6;--line:#e3d4bb;--text:#2a1414;--muted:#7a6258;--hover:rgba(120,20,30,.06);--accent:#a3152b;--on-accent:#fff6e6;--gold:#b0822a;--ok:#3f7d4a;--warn:#c27a10;--danger:#c0262f;--info:#6b4c9a;--field:#fffdf8;
--c1:#a3152b;--c2:#b0822a;--c3:#3f6e7d;--c4:#6b4c9a;--c5:#d06a3a;--c6:#5c7a3f;--velvet:#5e0d18;--velvet2:#8d1626;--shadow:0 20px 40px -26px rgba(60,10,15,.5)}
[data-theme="dark"]{--bg:#0d0708;--surface:#170c0e;--surface2:#211214;--line:#3a2226;--text:#f6e9da;--muted:#b19b8c;--hover:rgba(255,200,150,.06);--accent:#e3354f;--on-accent:#1a0508;--gold:#e2b54f;--ok:#7cc58a;--warn:#f0b04a;--danger:#ff5d66;--info:#b49bf0;--field:#120a0b;
--c1:#e3354f;--c2:#e2b54f;--c3:#6fb4c6;--c4:#b49bf0;--c5:#f08a5a;--c6:#9cc46f;--velvet:#3b060d;--velvet2:#6d0f1c;--toast-bg:#3a2226;--shadow:0 20px 40px -22px rgba(0,0,0,.8)}
.cap,h1,.ch h2{font-family:var(--cap);text-transform:uppercase;letter-spacing:.08em;font-weight:400}
.btn{letter-spacing:.04em}
.btn.primary{background:linear-gradient(180deg,var(--velvet2),var(--velvet));border-color:var(--velvet);color:#fbe7c4}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* Sidebar with a scalloped valance and a sliding spotlight */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto;background:linear-gradient(180deg,var(--velvet2),var(--velvet));color:#f3dfc0;z-index:40}
.valance{height:22px;background:radial-gradient(circle at 12px 0,#c79a3c 11px,transparent 12px) 0 0/24px 22px repeat-x;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:12px 18px 18px}
.brand b{font-family:var(--cap);font-size:19px;letter-spacing:.12em;font-weight:400;color:#ffe9bf}
.brand small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#d9b77c}
.nav{position:relative;display:grid;gap:2px;padding:0 10px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#e9cfa8;text-decoration:none;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;transition:color .3s,text-shadow .3s}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff6dc;text-shadow:0 0 12px rgba(255,220,150,.7)}
.nav-marker{position:absolute;left:10px;right:10px;top:0;border-radius:8px;background:radial-gradient(ellipse 70% 120% at 30% 50%,rgba(255,222,150,.32),rgba(255,222,150,.06) 60%,transparent 80%);box-shadow:inset 3px 0 0 #e2b54f;transition:transform .6s cubic-bezier(.5,0,.2,1),height .3s;pointer-events:none}
.side-show{margin:auto 14px 16px;padding:14px;border:1px solid rgba(226,181,79,.4);border-radius:10px;background:rgba(0,0,0,.18);font-size:12px}

.main-wrap{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.top .show{font-family:var(--cap);letter-spacing:.1em;font-size:13px;color:var(--muted)}
.menu-btn{display:none}
main{padding:20px 26px 46px;outline:none}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}

.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.srow{display:flex;gap:4px;align-items:center}

.seat.h{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);border-color:var(--warn)}
.seat.p1{border-color:color-mix(in srgb,var(--gold) 70%,var(--line))}
.seat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);transform:translateY(-2px) scale(1.08);box-shadow:0 6px 12px -6px var(--accent)}
.seat-leg{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px}
.seat-leg i{display:inline-block;width:14px;height:12px;border-radius:4px 4px 2px 2px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
.sel-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border-radius:10px;background:var(--surface2);margin-top:12px}
.sel-bar b{font-size:18px}
/* Props board */
.pk{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;overflow-x:auto}
.pcol{border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:260px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--pc) 7%,transparent)}
.pcol h3{font-family:var(--cap);letter-spacing:.1em;font-size:12px;display:flex;justify-content:space-between;font-weight:400}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;padding:9px 10px;font-size:12.5px;display:grid;gap:4px;transition:transform .2s,box-shadow .2s;animation:rise .4s both}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
.pcard .mv{border:0;background:var(--surface2);border-radius:6px;width:26px;height:24px;display:grid;place-items:center;padding:0;color:var(--text)}
.pf{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf b{display:block;font-size:16px}.pf small{color:var(--muted)}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.dlist dt{color:var(--muted)}.dlist dd{margin:0;font-weight:600}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}.set-row b{display:block}.set-row small{color:var(--muted)}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-102%);transition:transform .45s cubic-bezier(.6,0,.2,1)}body.nav-open .side{transform:none;box-shadow:var(--shadow)}.scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(20,0,5,.5);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top,main{padding-left:14px;padding-right:14px}.depts{grid-template-columns:repeat(3,1fr)}.top .show{display:none}}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:22px}.hero h2{font-size:22px}.count div{min-width:58px}.seat{width:17px;height:17px}.srow{gap:2px}.srow .gap{width:6px}.gobtn{width:70px;height:70px;font-size:20px}}
</style>

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="valance" aria-hidden="true"></div>
    <div class="brand"><svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="M3 33V12C3 6 9 3 18 3s15 3 15 9v21" fill="none" stroke="#e2b54f" stroke-width="2.4"/><path d="M6 33V13c3 0 5 4 6 10M30 33V13c-3 0-5 4-6 10" fill="#b51d33" stroke="#e2b54f" stroke-width="1.2"/><circle cx="18" cy="24" r="3.2" fill="#ffe9a8"/><path d="M18 3v5" stroke="#e2b54f" stroke-width="2"/></svg><div><b>Proscenia</b><small>Production desk</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker"></span></nav>
    <div class="side-show" aria-live="off"><small>Opening night</small><b id="sideShow">—</b><div class="cd" id="sideCd">—</div></div>
  </aside>
  <div class="scrim" data-scrim></div>

      <span class="show" id="topShow"></span>
      <span class="sp"></span>
      <button type="button" class="icon-btn" data-cmdk aria-label="Search (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg></button>
      <button type="button" class="icon-btn" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = n => (n < 0 ? '-$' : '$') + num(Math.abs(n));
const short = n => { const a = Math.abs(n), s = (v, u) => (Math.round(v * 10) / 10).toString() + u; return a >= 1e9 ? s(n / 1e9, 'B') : a >= 1e6 ? s(n / 1e6, 'M') : a >= 1e3 ? s(n / 1e3, 'K') : String(Math.round(n * 10) / 10); };
const pct = n => (n > 0 ? '+' : '') + dec(n, 1) + '%';
const FMT = { num, rs, usd, usd0, short, pct, dec1: n => dec(n, 1), raw: n => String(Math.round(n)), rsShort: n => 'Rs ' + short(n), pctPlain: n => Math.round(n) + '%', usdShort: n => '$' + short(n) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* Donut with sweep-in segments, centre count and legend. a = {data:[{label,value,color}], size, thick, fmt, center:{value,label,fmt}} */
function donut(el, a, quiet) {
  regChart(el, donut, a);
  const D = a.size || 168, T = a.thick || 20, R = (D - T) / 2, C = 2 * Math.PI * R, data = a.data, tot = sum(data.map(d => d.value)), f = a.fmt || num;
  let acc = 0, segs = '';
  if (tot > 0) data.forEach((d, i) => { const len = d.value / tot * C; if (len <= 0) return; const gap = data.filter(x => x.value > 0).length > 1 ? Math.min(3, len * .3) : 0, sl = Math.max(.01, len - gap);
    segs += `<circle class="seg" data-i="${i}" r="${R}" cx="${D / 2}" cy="${D / 2}" style="stroke:${d.color};stroke-width:${T}" stroke-dasharray="${sl.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" data-len="${sl.toFixed(2)}"/>`; acc += len; });
  const cv = a.center ? a.center.value : tot;
  el.innerHTML = `<div class="donut-wrap"><div class="donut" style="width:${D}px;height:${D}px"><svg viewBox="0 0 ${D} ${D}" width="${D}" height="${D}" role="img" aria-label="${esc(a.label || 'Donut chart')}"><circle r="${R}" cx="${D / 2}" cy="${D / 2}" class="donut-bg" style="stroke-width:${T}"/><g transform="rotate(-90 ${D / 2} ${D / 2})">${segs}</g></svg><div class="donut-c"><b data-count="${cv}" data-fmt="${(a.center && a.center.fmt) || 'num'}">${(FMT[(a.center && a.center.fmt) || 'num'])(cv)}</b><span>${esc(a.center ? a.center.label : 'Total')}</span></div></div>${a.legend === false ? '' : `<ul class="dl">${data.map((d, i) => `<li data-i="${i}" data-tip="${esc(d.label)}: ${esc(f(d.value))}"><i style="background:${d.color}"></i><span>${esc(d.label)}</span><b>${esc(f(d.value))}</b><em>${tot ? Math.round(d.value / tot * 100) : 0}%</em></li>`).join('')}</ul>`}</div>`;
  if (!quiet) { countAll(el); if (!RM) $$('.seg', el).forEach((s, i) => { if (s.animate) s.animate([{ strokeDasharray: `0 ${C}` }, { strokeDasharray: `${s.dataset.len} ${C}` }], { duration: 650, delay: 120 + i * 110, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'backwards' }); }); }
  const segsEl = $$('.seg', el);
  const hl = i => segsEl.forEach(s => s.classList.toggle('dim', i != null && +s.dataset.i !== i));
  segsEl.forEach(s => { const d = data[+s.dataset.i]; const mv = e => { hl(+s.dataset.i); tip.show(`<b>${esc(d.label)}</b><div>${esc(f(d.value))} · ${tot ? Math.round(d.value / tot * 100) : 0}%</div>`, e.clientX, e.clientY); }; s.addEventListener('pointermove', mv); s.addEventListener('pointerdown', mv); s.addEventListener('pointerleave', () => { hl(null); tip.hide(); }); });
  $$('.dl li', el).forEach(li => { li.addEventListener('pointerenter', () => hl(+li.dataset.i)); li.addEventListener('pointerleave', () => hl(null)); });
}

/* Little inline charts that return HTML strings */
function sparkSVG(d, { w = 110, h = 34, color = 'var(--accent)', tipText } = {}) {
  if (!d || !d.length) return '';
  const lo = Math.min(...d), hi = Math.max(...d), r = hi - lo || 1, id = 'sp' + (++GID);
  const p = d.map((v, i) => [d.length === 1 ? w / 2 : 2 + i * (w - 4) / (d.length - 1), h - 3 - (v - lo) / r * (h - 6)]), path = smoothPath(p);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" data-tip="${esc(tipText || `Low ${short(lo)} · High ${short(hi)}`)}" role="img" aria-label="Trend"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path d="${path}L${w - 2},${h}L2,${h}Z" fill="url(#${id})" class="area"/><path d="${path}" class="line draw" pathLength="1" style="stroke:${color}"/></svg>`;
}
function ringSVG(p, { size = 56, thick = 6, color = 'var(--accent)', tipText } = {}) {
  const r = (size - thick) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" ${tipText ? `data-tip="${esc(tipText)}" role="img" aria-label="${esc(tipText)}"` : 'aria-hidden="true"'}><circle r="${r}" cx="${size / 2}" cy="${size / 2}" class="ring-bg" style="stroke-width:${thick}"/><circle r="${r}" cx="${size / 2}" cy="${size / 2}" class="ring-fg" transform="rotate(-90 ${size / 2} ${size / 2})" style="stroke:${color};stroke-width:${thick};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${(c * (1 - clamp(p, 0, 1))).toFixed(2)};--c:${c.toFixed(2)}"/></svg>`;
}
function gaugeSVG(p, { w = 180, thick = 14, color = 'var(--accent)', tipText } = {}) {
  const r = (w - thick) / 2, h = r + thick, c = Math.PI * r, d = `M${thick / 2},${r + thick / 2} A${r},${r} 0 0 1 ${w - thick / 2},${r + thick / 2}`;
  return `<svg class="gauge" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" ${tipText ? `data-tip="${esc(tipText)}" role="img" aria-label="${esc(tipText)}"` : 'aria-hidden="true"'}><path d="${d}" class="ring-bg" style="stroke-width:${thick}"/><path d="${d}" class="ring-fg" style="stroke:${color};stroke-width:${thick};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${(c * (1 - clamp(p, 0, 1))).toFixed(2)};--c:${c.toFixed(2)}"/></svg>`;
}
/* Horizontal bars as HTML */
const hbars = (list, f = num, color = 'var(--accent)') => { const mx = Math.max(1, ...list.map(x => x.value)); return `<div class="hbars">${list.map((x, i) => `<div class="hb" data-tip="${esc(x.label)}: ${esc(f(x.value))}"><span class="hb-l">${esc(x.label)}</span><span class="hb-t"><i style="--w:${(x.value / mx * 100).toFixed(1)}%;--i:${i};background:${x.color || color}"></i></span><b>${esc(f(x.value))}</b></div>`).join('')}</div>`; };
/* Heatmap grid as HTML: rows x cols, values 0..max */
function heatHTML(rows, cols, val, { f = num, color = 'var(--accent)', label = '' } = {}) {
  let mx = 1; rows.forEach((_, r) => cols.forEach((_, c) => { mx = Math.max(mx, val(r, c)); }));

}

  el.innerHTML = `<div class="ph" data-rise><div><h1>Box office</h1><p>Click seats to pick them, then sell, hold or release</p></div><div class="ph-a"><label class="sr-only" for="pf">Performance</label><select class="inp" id="pf" style="width:auto">${D.perfs.map((x, i) => `<option value="${i}"${i === perfI ? ' selected' : ''}>${fday(x.date)} ${x.time} · ${esc(x.label)}</option>`).join('')}</select></div></div>
  <div class="g g21"><section class="card"><div class="stage-edge">STAGE</div><div class="house" id="house">${ROWS.map((r, ri2) => `<div class="srow"><span class="rl">${r}</span>${Array.from({ length: SEATS }, (_, s) => { const k = ri2 * SEATS + s, c = st(k), z = zone(ri2); return `${s === 7 ? '<span class="gap"></span>' : ''}<button type="button" class="seat ${c === 's' ? 's' : c === 'h' ? 'h' : ''} ${z[2]}" data-seat="${k}" aria-pressed="${picked.has(k)}" ${c === 's' ? 'aria-disabled="true"' : ''} aria-label="Row ${r} seat ${s + 1}, ${c === 's' ? 'sold' : c === 'h' ? 'held' : 'free'}, ${rs(z[1])}" data-tip="${r}${s + 1} · ${z[0]} · ${rs(z[1])}${c === 's' ? ' · sold' : c === 'h' ? ' · held' : ''}"></button>`; }).join('')}<span class="rl">${r}</span></div>`).join('')}</div>
  <div class="seat-leg"><span><i></i>Free</span><span><i style="border-color:var(--gold)"></i>Front stalls</span><span><i style="background:var(--accent);border-color:var(--accent)"></i>Picked</span><span><i style="background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);border-color:var(--warn)"></i>Held</span><span><i style="background:var(--muted);opacity:.55"></i>Sold</span></div>
  <div class="sel-bar" id="selBar" aria-live="polite">${selBar()}</div></section>
  <section class="card"><div class="ch"><h2>${esc(p.label)}</h2><p>${fday(p.date)} · ${p.time}</p></div><div id="pd"></div><div class="ch" style="margin-top:14px"><h2>Whole run</h2></div><div id="run"></div></section></div>`;
  const cnt = ch => [...p.seats].filter(c => c === ch).length;
  donut($('#pd', el), { data: [{ label: 'Sold', value: cnt('s'), color: 'var(--c1)' }, { label: 'Held', value: cnt('h'), color: 'var(--c2)' }, { label: 'Free', value: cnt('.'), color: 'var(--c3)' }], size: 140, thick: 18, center: { value: Math.round(cnt('s') / p.seats.length * 100), label: 'sold', fmt: 'pctPlain' } });
  barChart($('#run', el), { labels: D.perfs.map((x, i) => i === 0 ? 'Open' : 'P' + (i + 1)), series: [{ name: 'Sold', data: D.perfs.map(sold), color: 'var(--c1)' }], h: 170, fmt: v => String(Math.round(v)) });
  $('#pf', el).onchange = e => { perfI = +e.target.value; picked = new Set(); ROUTER.render(true); };
  el.addEventListener('click', e => { const s = e.target.closest('[data-seat]'); if (s) { const k = +s.dataset.seat; if (p.seats[k] === 's') { toast('That seat is already sold', 'warn'); return; } picked.has(k) ? picked.delete(k) : picked.add(k); s.setAttribute('aria-pressed', String(picked.has(k))); $('#selBar', el).innerHTML = selBar(); return; }
    const b = e.target.closest('[data-bx]'); if (!b) return; const a = b.dataset.bx, arr = [...p.seats], amt = sum([...picked].map(k => zone(Math.floor(k / SEATS))[1])), n = picked.size;
    if (a === 'clear') { picked.forEach(k => { const x = $(`[data-seat="${k}"]`, el); x && x.setAttribute('aria-pressed', 'false'); }); picked = new Set(); $('#selBar', el).innerHTML = selBar(); return; }
    picked.forEach(k => { arr[k] = a === 'sell' ? 's' : a === 'hold' ? 'h' : '.'; }); p.seats = arr.join(''); picked = new Set(); save();
    toast(a === 'sell' ? `${n} seats sold · ${rs(amt)}` : a === 'hold' ? `${n} seats held for the company` : `${n} seats released`); if (a === 'sell' && sold(p) / p.seats.length > .9) addNote(`${p.label} is almost sold out`, 'warn'); refresh(); });
}

/* ---------- Page: Props and costumes (board) ---------- */
function pProps(el) {
  const cols = [['Needed', 'var(--c5)'], ['Sourcing', 'var(--c3)'], ['Ready', 'var(--c6)']];
  el.innerHTML = `<div class="ph" data-rise><div><h1>Props and costumes</h1><p>Drag a card when it moves on, or use its arrow</p></div><div class="ph-a"><button type="button" class="btn primary" data-a="task">${ic('plus')}Add item</button></div></div>
  <div class="pk" id="pk">${cols.map(([s, c]) => { const L = D.props.filter(p => p.stage === s); return `<div class="pcol" data-pst="${s}" style="--pc:${c}"><h3><span>${s}</span><span>${L.length}</span></h3>${L.map((p, i) => { const late = p.stage !== 'Ready' && p.due < iso(TODAY); return `<div class="pcard" data-drag data-pid="${p.id}" style="animation-delay:${i * 40}ms"><div class="pr"><span>${esc(p.dept)}</span><button type="button" class="mv" data-pmv="${p.id}" aria-label="Move ${esc(p.name)}" aria-haspopup="menu">${ic('arrowR')}</button></div><b>${esc(p.name)}</b><div class="pr"><span style="color:${late ? 'var(--danger)' : 'inherit'}">${late ? 'Late · ' : 'Due '}${fshort(p.due)}</span><span>${esc(person(p.owner).name.split(' ')[0])} · ${rs(p.cost)}</span></div></div>`; }).join('')}</div>`; }).join('')}</div>`;
  dragify($('#pk', el), { item: '.pcard', zone: '.pcol', onDrop(it, z) { const p = D.props.find(x => x.id === it.dataset.pid); if (p.stage === z.dataset.pst) return; p.stage = z.dataset.pst; save(); toast(`${p.name}: ${p.stage}`); if (p.stage === 'Ready') { const d = p.dept in D.ready ? p.dept : null; if (d) D.ready[d] = Math.min(100, D.ready[d] + 3); save(); } refresh(); } });
}

/* ---------- Page: Budget ---------- */
function pBudget(el) {
  const spentBy = d => sum(D.expenses.filter(x => x.dept === d).map(x => x.amount)), tot = sum(D.budget.map(b => b.total)), sp = sum(D.expenses.map(x => x.amount));
  el.innerHTML = `<div class="ph" data-rise><div><h1>Budget</h1><p>${rs(sp)} spent of ${rs(tot)} · ${rs(tot - sp)} left</p></div><div class="ph-a"><button type="button" class="btn primary" data-a="expense">${ic('plus')}Add expense</button></div></div>
  <div class="g g21"><section class="card"><div class="ch"><h2>Budget against spend</h2><p>By department</p></div><div id="bb"></div></section><section class="card"><div class="ch"><h2>Where it went</h2></div><div id="bd"></div></section></div><section class="card" id="xt"></section>`;
  barChart($('#bb', el), { labels: D.budget.map(b => b.dept.replace('Rights and fees', 'Rights')), series: [{ name: 'Budget', data: D.budget.map(b => b.total), color: 'var(--c2)' }, { name: 'Spent', data: D.budget.map(b => spentBy(b.dept)), color: 'var(--c1)' }], h: 240, fmt: short, tfmt: rs });
  donut($('#bd', el), { data: D.budget.map((b, i) => ({ label: b.dept, value: spentBy(b.dept), color: `var(--c${(i % 6) + 1})` })), size: 150, thick: 18, fmt: v => 'Rs ' + short(v), center: { value: Math.round(sp / tot * 100), label: 'of budget', fmt: 'pctPlain' } });
  makeTable($('#xt', el), { rows: () => D.expenses.slice().sort((a, b) => b.date.localeCompare(a.date)), unit: 'expense', units: 'expenses', ph: 'Search expenses…', keys: ['what', 'dept'], pageSize: 8, chips: { k: 'dept', opts: ['All', ...D.budget.map(b => b.dept)] },
    cols: [{ k: 'date', label: 'Date', f: v => fshort(v) }, { k: 'what', label: 'Item', f: v => `<b>${esc(v)}</b>` }, { k: 'dept', label: 'Department' }, { k: 'amount', label: 'Amount', num: true, f: v => rs(v) }, { k: 'x', label: '', sort: false, f: () => `<button type="button" class="btn sm ghost" data-act="del" aria-label="Delete expense">${ic('trash')}</button>` }],
    onAct: (a, r) => confirmBox(`Delete "${r.what}" (${rs(r.amount)})?`, () => { D.expenses = D.expenses.filter(x => x !== r); save(); toast('Expense deleted', 'warn'); refresh(); }) });
}

/* ---------- Page: Settings ---------- */
function pSettings(el) {
  el.innerHTML = `<div class="ph" data-rise><div><h1>Settings</h1><p>The production and demo data</p></div></div><div class="g g2"><section class="card"><div class="ch"><h2>Production</h2></div><form class="frm" id="sf" novalidate>${fieldHTML({ k: 'title', label: 'Title', req: true }, D.show.title)}${fieldHTML({ k: 'by', label: 'Credit line' }, D.show.by)}${fieldHTML({ k: 'venue', label: 'Venue', half: true }, D.show.venue)}${fieldHTML({ k: 'opening', label: 'Opening night', type: 'date', half: true }, D.show.opening)}<div><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card"><div class="set-row"><div><b>Theme</b><small>Programme paper or velvet night. ?theme=dark works too.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div><div class="set-row"><div><b>Cue runner</b><small>Space bar runs the next cue on the Cue sheet page</small></div><span class="badge">Keyboard</span></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample production</small></div><button type="button" class="btn danger" data-a="reset">Reset</button></div></section></div>`;
  syncThemeBtns();
  $('#sf', el).onsubmit = e => { e.preventDefault(); const f = e.target, t = f.elements.title, o = f.elements.opening; [t, o].forEach(x => { x.removeAttribute('aria-invalid'); $('#' + x.id + '-e').textContent = ''; }); if (!t.value.trim()) { t.setAttribute('aria-invalid', 'true'); $('#' + t.id + '-e').textContent = 'Title is required'; return; } if (!o.value) { o.setAttribute('aria-invalid', 'true'); $('#' + o.id + '-e').textContent = 'Pick a date'; return; } ['title', 'by', 'venue', 'opening'].forEach(k => D.show[k] = f.elements[k].value.trim()); save(); shell(); toast('Production saved'); };
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'production', label: 'Production', icon: 'star', render: pProduction }, { id: 'rehearsals', label: 'Rehearsals', icon: 'cal', render: pRehearsals }, { id: 'company', label: 'Company', icon: 'users', render: pCompany },
  { id: 'scenes', label: 'Scenes', icon: 'grid', render: pScenes }, { id: 'cues', label: 'Cue sheet', icon: 'bolt', render: pCues }, { id: 'boxoffice', label: 'Box office', icon: 'ticket', render: pBox },
  { id: 'props', label: 'Props', icon: 'box', render: pProps }, { id: 'budget', label: 'Budget', icon: 'wallet', render: pBudget }, { id: 'settings', label: 'Settings', icon: 'gear', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}">${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
function shell() { $('#sideShow').textContent = D.show.title; $('#topShow').textContent = `${D.show.title} · ${D.show.venue}`; tickCd(); }
document.addEventListener('click', e => {
  const t = e.target;
  const rh = t.closest('[data-rh]'); if (rh) { rehDrawer(D.reh.find(r => r.id === rh.dataset.rh)); return; }
  const cu = t.closest('[data-cue]'); if (cu) { const a = cu.dataset.cue; goCue(a === 'go' ? D.cueAt + 1 : a === 'back' ? D.cueAt - 1 : -1); if (a === 'top') toast('Back to the top. House open.'); return; }
  const j = t.closest('[data-jump]'); if (j) { goCue(+j.dataset.jump); return; }
  const cd = t.closest('[data-cdel]'); if (cd) { const i = +cd.dataset.cdel, c = D.cues[i]; confirmBox(`Delete cue ${c.n}?`, () => { D.cues.splice(i, 1); if (D.cueAt >= D.cues.length) D.cueAt = D.cues.length - 1; save(); toast(`${c.n} deleted`, 'warn'); refresh(); }); return; }
  const pm = t.closest('[data-pmv]'); if (pm) { const p = D.props.find(x => x.id === pm.dataset.pmv); menu(pm, ['Needed', 'Sourcing', 'Ready'].map(s => ({ label: s, disabled: s === p.stage })).concat([{ label: 'Edit…', act: 'edit', icon: 'edit' }]), o => { if (o.act === 'edit') return propForm(p); p.stage = o.label; save(); toast(`${p.name}: ${o.label}`); refresh(); }, 'Move to'); return; }
  const pc = t.closest('.pcard'); if (pc && !t.closest('button')) { propForm(D.props.find(x => x.id === pc.dataset.pid)); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'reh') rehForm(null); else if (a === 'task') propForm(null);
  else if (a === 'ready') formModal({ title: 'Department readiness', submit: 'Save', values: D.ready, fields: DEPTS.map(([d]) => ({ k: d, label: d + ' (%)', type: 'number', min: 0, max: 100, req: true, half: true })), onSubmit(v) { DEPTS.forEach(([d]) => D.ready[d] = v[d]); save(); toast('Readiness updated'); refresh(); } });
  else if (a === 'cue') formModal({ title: 'Add a cue', submit: 'Add cue', values: { type: 'LX', page: 30, wash: '#c9713a', curtain: true, s: 'Centre' }, fields: [{ k: 'type', label: 'Type', type: 'select', half: true, opts: [{ v: 'LX', l: 'Lighting' }, { v: 'SQ', l: 'Sound' }, { v: 'FLY', l: 'Fly' }, { v: 'CUR', l: 'Curtain' }] }, { k: 'page', label: 'Script page', type: 'number', min: 1, max: 200, req: true, half: true }, { k: 'desc', label: 'What happens', req: true }, { k: 'wash', label: 'Backdrop colour', type: 'color', half: true }, { k: 's', label: 'Spotlight', type: 'select', half: true, opts: ['None', 'Left', 'Centre', 'Right', 'All three'] }, { k: 'curtain', label: 'Curtain open', type: 'checkbox', half: true }],
    onSubmit(v) { const sp = { None: [null, null, null], Left: [10, null, null], Centre: [null, 0, null], Right: [null, null, -10], 'All three': [12, 0, -12] }[v.s]; const n = D.cues.filter(c => c.type === v.type).length + 1; D.cues.splice(D.cueAt + 1, 0, { id: uid(), type: v.type, n: v.type + ' ' + n + '.5', desc: v.desc, page: v.page, look: { curtain: v.curtain ? 1 : 0, wash: v.wash || '#333', spots: sp, actors: sp.map(x => x == null ? 0 : 1), sound: v.type === 'SQ' ? 1 : 0, fly: v.type === 'FLY' ? 1 : 0 } }); save(); toast('Cue added after the current one'); refresh(); } });
  else if (a === 'person') formModal({ title: 'Add to the company', submit: 'Add', values: { dept: 'Cast' }, fields: [{ k: 'name', label: 'Full name', req: true }, { k: 'role', label: 'Role or character', req: true, half: true }, { k: 'dept', label: 'Department', type: 'select', half: true, opts: ['Cast', 'Stage management', 'Set', 'Costumes', 'Lighting', 'Sound', 'Props'] }, { k: 'phone', label: 'Phone', type: 'tel', req: true }], onSubmit(v) { const p = { id: (v.dept === 'Cast' ? 'k' : 'w') + uid(), ...v, busy: [], fitting: v.dept !== 'Cast' }; (v.dept === 'Cast' ? D.cast : D.crew).push(p); save(); toast(`${v.name} joined as ${v.role}`); refresh(); } });
  else if (a === 'scene') formModal({ title: 'Add a scene', submit: 'Add scene', values: { act: 'II', mins: 6 }, fields: [{ k: 'title', label: 'Scene title', req: true }, { k: 'act', label: 'Act', type: 'select', half: true, opts: ['I', 'II'] }, { k: 'mins', label: 'Minutes', type: 'number', min: 1, max: 40, req: true, half: true }], onSubmit(v) { D.scenes.push({ id: 's' + uid(), act: v.act, n: D.scenes.filter(s => s.act === v.act).length + 1, title: v.title, mins: v.mins, status: 'Blocked', cast: [] }); save(); toast(`${v.title} added`); refresh(); } });
  else if (a === 'expense') formModal({ title: 'Add an expense', submit: 'Add', values: { dept: 'Set', date: iso(TODAY) }, fields: [{ k: 'what', label: 'Item', req: true }, { k: 'dept', label: 'Department', type: 'select', half: true, opts: D.budget.map(b => b.dept) }, { k: 'amount', label: 'Amount (Rs)', type: 'number', min: 1, max: 5000000, req: true, half: true }, { k: 'date', label: 'Date', type: 'date', req: true }], onSubmit(v) { D.expenses.push({ id: 'x' + uid(), ...v }); const b = D.budget.find(x => x.dept === v.dept), s = sum(D.expenses.filter(x => x.dept === v.dept).map(x => x.amount)); save(); toast(`${rs(v.amount)} added to ${v.dept}`); if (s > b.total) addNote(`${v.dept} is over budget by ${rs(s - b.total)}`, 'danger'); refresh(); } });
  else if (a === 'reset') confirmBox('Put back the sample production? Your changes will be lost.', () => { store.del(KEY); D = makeData(); save(); shell(); toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
function propForm(p) { const editing = !!p; formModal({ title: editing ? 'Edit item' : 'Add a prop or costume', submit: 'Save', values: p || { dept: 'Props', stage: 'Needed', due: iso(addDays(TODAY, 7)), cost: 2000, owner: D.crew[0].id }, fields: [{ k: 'name', label: 'Item', req: true }, { k: 'dept', label: 'Department', type: 'select', half: true, opts: ['Props', 'Costumes', 'Set', 'Lighting', 'Sound'] }, { k: 'stage', label: 'Stage', type: 'select', half: true, opts: ['Needed', 'Sourcing', 'Ready'] }, { k: 'owner', label: 'Owner', type: 'select', half: true, opts: D.crew.map(c => ({ v: c.id, l: c.name })) }, { k: 'due', label: 'Needed by', type: 'date', half: true, req: true }, { k: 'cost', label: 'Cost (Rs)', type: 'number', min: 0, max: 1000000, req: true }], onDelete: editing ? () => { D.props = D.props.filter(x => x !== p); save(); toast('Item removed', 'warn'); refresh(); } : null, onSubmit(v) { if (editing) Object.assign(p, v); else D.props.push({ id: 'pp' + uid(), ...v }); save(); toast(editing ? 'Item saved' : `${v.name} added`); refresh(); } }); }
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), { label: 'Run next cue', hint: 'Action', icon: 'play', run: () => { ROUTER.go('cues'); setTimeout(() => goCue(D.cueAt + 1), 100); } }, { label: 'Call a rehearsal', hint: 'Action', icon: 'plus', run: () => rehForm(null) }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }, ...D.cast.map(p => ({ label: p.name, hint: p.role, icon: 'user', run: () => personDrawer(p) }))];

/* Start */
initTheme('proscenia', '');
shell(); every(1000, tickCd, false);
const clashN = D.reh.filter(r => r.date >= iso(TODAY) && conflicts(r).length).length; if (clashN) addNote(`${clashN} upcoming calls have someone who is not free`, 'warn', new Date(Date.now() - 4e6));
const lateP = D.props.filter(p => p.stage !== 'Ready' && p.due < iso(TODAY)).length; if (lateP) addNote(`${lateP} props or costumes are late`, 'danger', new Date(Date.now() - 2e6));
addNote(`Opening night is ${sold(D.perfs[0])} of ${ROWS.length * SEATS} sold`, 'info', new Date(Date.now() - 3e7));
save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'production', title: 'Proscenia' });
</script>
</body>
</html>
