<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    color-scheme: light;
    --desk: #e5ebe2;
    --desk2: #d4ddd0;
    --grain: rgba(60, 80, 50, .05);
    --paper: #fffaf0;
    --paper2: #f6eedb;
    --rule: #b9d1ec;
    --margin: #f0a3a3;
    --graphite: #3a3b43;
    --soft-ink: #6f6c66;
    --pink: #ff8fab;
    --pink2: #f06d92;
    --sleeve: #35577d;
    --btn: #2f3138;
    --btn-ink: #f6f3ec;
    --muted: #66705f;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --desk: #17191c;
    --desk2: #0f1012;
    --grain: rgba(255, 255, 255, .025);
    --paper: #2a2823;
    --paper2: #23211d;
    --rule: #3c4c5f;
    --margin: #6f4242;
    --graphite: #ebe5d6;
    --soft-ink: #b5ae9f;
    --btn: #f1ece2;
    --btn-ink: #23242a;
    --muted: #9aa294;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  /* ---------- Stage: a desk with fine grain ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--graphite);
    background:
      repeating-linear-gradient(0deg, var(--grain) 0 1px, transparent 1px 5px),
      radial-gradient(700px 480px at 50% 40%, var(--desk), var(--desk2));
    background-color: var(--desk2);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 30px 16px; width: 100%; }

  /* ---------- Index card ---------- */
  .note {
    position: relative;
    width: min(340px, 100%);
    animation: float 7s ease-in-out infinite;
  }
  .note svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 22px 22px rgba(40, 50, 30, .22)) drop-shadow(0 2px 2px rgba(40, 50, 30, .12)); }
  .tape { position: absolute; left: 50%; top: -12px; width: 92px; height: 26px; margin-left: -46px; z-index: 2; background: repeating-linear-gradient(90deg, rgba(255, 210, 120, .55) 0 6px, rgba(255, 225, 160, .55) 6px 12px); transform: rotate(-3deg); box-shadow: 0 2px 4px rgba(0, 0, 0, .08); clip-path: polygon(3% 0, 97% 4%, 100% 50%, 97% 96%, 2% 100%, 0 50%); }
  .sheet { fill: url(#paperg); }
  .rules path { stroke: var(--rule); stroke-width: 1.2; }
  .rules .mgn { stroke: var(--margin); stroke-width: 1.5; }
  .ink text { fill: var(--graphite); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ink .t { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .ink .s { font-size: 11px; font-weight: 700; letter-spacing: .18em; fill: var(--soft-ink); }
  .ink .i { font-size: 15px; font-weight: 520; }
  .ink .side { font-size: 11.5px; fill: var(--soft-ink); font-style: italic; }
  .ink .pen { fill: none; stroke: var(--graphite); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ink .hl { fill: none; stroke: #ffd166; stroke-width: 9; stroke-linecap: round; opacity: .55; }
  .ink .done { opacity: .5; }
  .ink .star { stroke-dasharray: 130; animation: draw 5s ease-in-out infinite; }
  #smudge { fill: none; stroke: var(--graphite); stroke-width: 40; stroke-linecap: round; stroke-linejoin: round; opacity: .045; filter: blur(5px); }
  .erased { position: absolute; left: 0; right: 0; top: 46%; margin: 0; text-align: center; font-size: 13px; font-weight: 650; letter-spacing: .06em; color: var(--soft-ink); opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .5s var(--spring); pointer-events: none; }
  .note.wiped .erased { opacity: .8; transform: none; }
  .crumbs { position: absolute; inset: 0; pointer-events: none; }
  .crumb { position: absolute; width: 5px; height: 3px; border-radius: 2px; background: var(--pink2); opacity: .85; }
  .crumb.g { background: #8a8790; }
  .wind { position: absolute; left: 0; height: 2px; width: 70px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--soft-ink)); opacity: 0; }

  /* ---------- The eraser that does the work ---------- */
  .eraser {
    position: fixed;
    left: 0;
    top: 0;
    width: 78px;
    height: 36px;
    z-index: 20;
    border-radius: 8px 10px 10px 8px;
    background: linear-gradient(180deg, #ffb3c6, var(--pink) 45%, var(--pink2));
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), inset 0 -4px 0 rgba(0, 0, 0, .1), 0 12px 16px -6px rgba(60, 20, 30, .45);
    pointer-events: none;
    visibility: hidden;
    will-change: transform;
  }
  .eraser .sleeve { position: absolute; right: 0; top: 0; bottom: 0; width: 34px; border-radius: 0 10px 10px 0; background: linear-gradient(180deg, #4d74a0, var(--sleeve) 55%, #26405e); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25); }
  .eraser .sleeve::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; margin-top: -1px; background: rgba(255, 255, 255, .55); border-radius: 2px; }
  .eraser .worn { position: absolute; left: 0; bottom: 0; width: 22px; height: 9px; border-radius: 0 0 0 8px; background: rgba(0, 0, 0, .1); }

  /* ---------- Button ---------- */
  .erase {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 54px;
    padding: 0 22px 0 16px;
    border: 0;
    border-radius: 27px;
    background: var(--btn);
    color: var(--btn-ink);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 18px 28px -18px rgba(20, 20, 20, .8), inset 0 -3px 0 rgba(0, 0, 0, .2);
    transition: transform .4s var(--spring), width .4s var(--spring);
  }
  .erase:hover { transform: translateY(-2px); }
  .erase:hover .mini { animation: rub .5s ease-in-out infinite alternate; }
  .erase:active { transform: scale(.96); }
  .erase:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .erase[aria-busy="true"] { cursor: default; }
  .mini { position: relative; width: 30px; height: 15px; border-radius: 4px; background: linear-gradient(180deg, #ffb3c6, var(--pink)); transform: rotate(-12deg); transition: opacity .2s, transform .3s var(--spring); }
  .mini::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 13px; border-radius: 0 4px 4px 0; background: var(--sleeve); }
  .mini.away { opacity: 0; transform: rotate(-12deg) scale(.4); }
  .undoic { display: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .erase.undo .mini { display: none; }
  .erase.undo .undoic { display: block; }
  .life { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--pink); transform-origin: left; transform: scaleX(0); }
  .hint { margin: -8px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  kbd { font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid rgba(0, 0, 0, .15); }
  :root[data-theme="dark"] kbd { border-color: rgba(255, 255, 255, .2); }
  .spark { position: fixed; z-index: 21; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #9fd3ff; box-shadow: 0 0 8px #9fd3ff; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes float { 0%, 100% { transform: rotate(-1.4deg) translateY(0); } 50% { transform: rotate(-.6deg) translateY(-4px); } }
  @keyframes draw { 0%, 15% { stroke-dashoffset: 130; } 45%, 100% { stroke-dashoffset: 0; } }
  @keyframes rub { from { transform: rotate(-12deg) translateX(-2px); } to { transform: rotate(-6deg) translateX(2px); } }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .ink .star { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="note" id="note">
    <span class="tape" aria-hidden="true"></span>
    <svg id="paper" viewBox="0 0 340 230" role="img" aria-label="Note for Saturday: call Imran about the stall rent (done), buy flour, eggs and green tea, pick up Sana's parcel before 6. Side note: rent PKR 25,000.">
      <defs>
        <linearGradient id="paperg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--paper)" /><stop offset="1" style="stop-color: var(--paper2)" /></linearGradient>
        <clipPath id="pclip"><rect width="340" height="230" rx="12" /></clipPath>
        <mask id="rub" maskUnits="userSpaceOnUse" x="-20" y="-20" width="380" height="270">

          <path id="scrub" d="M26 30L314 44L26 70L314 92L26 116L314 138L26 160L314 180L26 202L314 214" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
        </mask>
      </defs>
      <rect class="sheet" width="340" height="230" rx="12" />
      <g class="rules">
        <path d="M14 64H326M14 98H326M14 132H326M14 166H326M14 200H326" />

      <g class="ink" id="ink" mask="url(#rub)">
        <text class="s" x="54" y="26">TO DO</text>

        <path class="pen star" d="M282 26l5.6 11.4 12.6 1.8-9.1 8.9 2.1 12.5L282 54.7l-11.2 5.9 2.1-12.5-9.1-8.9 12.6-1.8z" />
        <g class="done">
          <path class="pen" d="M54 82h12v12H54z" /><path class="pen" d="M56 88l4 4 8-11" />
          <text class="i" x="76" y="93">Call Imran about stall rent</text>
          <path class="pen" d="M74 88h196" />
        </g>
        <path class="pen" d="M54 116h12v12H54z" />
        <text class="i" x="76" y="127">Buy flour, eggs, green tea</text>
        <path class="pen" d="M54 150h12v12H54z" />
        <text class="i" x="76" y="161">Pick up Sana's parcel by 6</text>
        <text class="side" x="236" y="192">rent PKR 25,000</text>
        <path class="pen" d="M232 196c20 4 52 2 74-2" />
        <path class="pen" d="M60 190c4-8 14-8 14 0 0-8 10-8 14 0 0 8-14 14-14 14s-14-6-14-14z" />
      </g>
    </svg>
    <div class="crumbs" id="crumbs" aria-hidden="true"></div>
    <p class="erased" aria-hidden="true">Wiped clean · press Undo</p>
  </div>

  <button class="erase" id="erase" type="button" aria-describedby="hint">
    <span class="mini" id="mini" aria-hidden="true"></span>
    <svg class="undoic" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8h8.5a4.5 4.5 0 0 1 0 9H8" /><path d="M7.5 4.5L4 8l3.5 3.5" /></svg>
    <span id="elabel">Erase note</span>
    <i class="life" id="life" aria-hidden="true"></i>
  </button>
  <p class="hint" id="hint">An eraser scrubs the note away · <kbd>Ctrl</kbd>+<kbd>Z</kbd> brings it back</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>
<div class="eraser" id="eraser" aria-hidden="true"><i class="worn"></i><i class="sleeve"></i></div>

<script>
  // ---------- Scrub Out: an eraser jumps out of the button and rubs the note away; Undo rewinds it ----------
  const $ = (id) => document.getElementById(id);
  const note = $("note"), paper = $("paper"), scrub = $("scrub"), smudge = $("smudge"), crumbs = $("crumbs");
  const btn = $("erase"), mini = $("mini"), elabel = $("elabel"), life = $("life"), eraser = $("eraser"), status = $("status");
  const L = scrub.getTotalLength();
  const VB_W = 340;

  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 300) : ms));
  const easeInOut = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
  function play(el, frames, opts) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  function tween(ms, fn, ease) {
    ease = ease || ((t) => t);
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) {
        const t = Math.max(0, Math.min(1, (now - s) / ms));
        fn(ease(t));
        if (t < 1) requestAnimationFrame(f); else res();
      });
    });
  }
  function say(msg) { if (!demo.on) status.textContent = msg; }

  // how much of the scrub path is rubbed out (0..1); drives the mask and the smudge
  function setRub(f) {
    const off = (L * (1 - f)).toFixed(1);
    scrub.style.strokeDasharray = smudge.style.strokeDasharray = L + " " + L;
    scrub.style.strokeDashoffset = smudge.style.strokeDashoffset = off;
  }
  setRub(0);

  // SVG point -> page pixels (and note-local pixels)
  function toPage(pt) {
    const r = paper.getBoundingClientRect(), k = r.width / VB_W;
    const m = paper.getScreenCTM ? paper.getScreenCTM() : null;
    if (m && window.DOMPoint) { const q = new DOMPoint(pt.x, pt.y).matrixTransform(m); return { x: q.x, y: q.y, k }; }
    return { x: r.left + pt.x * k, y: r.top + pt.y * k, k };
  }
  function placeEraser(x, y, rot, sx, sy) {
    eraser.style.transform = "translate(" + (x - 39).toFixed(1) + "px," + (y - 18).toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg) scale(" + (sx || 1) + "," + (sy || sx || 1) + ")";
  }

  let state = "idle"; // idle | erasing | wiped | rewinding
  let crumbList = [], lifeAnim = null, undoNow = null;

  function crumb(px, py) {
    if (calm() || crumbList.length > 140) return;
    const nr = note.getBoundingClientRect();
    const c = document.createElement("i");
    c.className = "crumb" + (Math.random() < .3 ? " g" : "");
    c.style.left = px - nr.left + "px";
    c.style.top = py - nr.top + "px";
    crumbs.appendChild(c);
    const dx = (Math.random() - .5) * 26, dy = 8 + Math.random() * 14, rot = Math.random() * 360;
    c.animate([{ transform: "translate(0,0) rotate(0)", opacity: 0 }, { transform: "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)", opacity: .85 }], { duration: 380, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" });
    crumbList.push({ c, dx, dy, rot });
  }

  // ---------- Erase ----------
  async function erase() {
    if (state !== "idle") return;
    state = "erasing";
    btn.setAttribute("aria-busy", "true");
    elabel.textContent = "Erasing…";
    // anticipation: the mini eraser wiggles, then jumps out of the button and grows
    await play(mini, [{ transform: "rotate(-12deg)" }, { transform: "rotate(-24deg) translateY(-2px)" }, { transform: "rotate(4deg)" }, { transform: "rotate(-12deg)" }], { duration: 260, easing: "ease-in-out" });
    const mr = mini.getBoundingClientRect();
    mini.classList.add("away");
    const start = toPage(scrub.getPointAtLength(0));
    eraser.style.visibility = "visible";
    const from = { x: mr.left + mr.width / 2, y: mr.top + mr.height / 2 };
    if (!calm()) {
      await tween(520, (t) => {
        const x = from.x + (start.x - from.x) * t;
        const y = from.y + (start.y - from.y) * t - Math.sin(t * Math.PI) * 70;
        const s = .38 + .62 * t;
        placeEraser(x, y, -16 - 360 * (1 - t), s);
      }, easeInOut);
      // land with a squash
      await tween(160, (t) => placeEraser(start.x, start.y, -16, 1 + .12 * Math.sin(t * Math.PI), 1 - .14 * Math.sin(t * Math.PI)));
    }
    // main: zig-zag scrubbing down the card; the mask follows the eraser
    let tilt = -16, lastCrumb = 0;
    await tween(2200, (t) => {
      const at = L * t;
      const p = scrub.getPointAtLength(at), q = scrub.getPointAtLength(Math.min(L, at + 4));
      const dir = q.x >= p.x ? 1 : -1;
      tilt += ((dir > 0 ? -18 : 14) - tilt) * .18;
      const pg = toPage(p);
      const jig = Math.sin(t * 160) * 2.5;
      placeEraser(pg.x, pg.y + jig * .4, tilt + jig, 1, 1);
      setRub(t);
      const now = performance.now();
      if (now - lastCrumb > 34) { lastCrumb = now; crumb(pg.x - dir * 30 * pg.k, pg.y + 10 * pg.k); }
    }, (t) => t);
    setRub(1);
    note.classList.add("wiped");
    paper.setAttribute("aria-label", "Erased note");
    // finish: the eraser hops back home, a gust blows the crumbs away
    const home = mini.getBoundingClientRect();
    const end = toPage(scrub.getPointAtLength(L));
    const back = tween(480, (t) => {
      const x = end.x + (home.left + home.width / 2 - end.x) * t;
      const y = end.y + (home.top + home.height / 2 - end.y) * t - Math.sin(t * Math.PI) * 60;
      placeEraser(x, y, -16 + 364 * t, 1 - .62 * t);
    }, easeInOut).then(() => { eraser.style.visibility = "hidden"; mini.classList.remove("away"); play(mini, [{ transform: "rotate(-12deg) scale(1.4)" }, { transform: "rotate(-12deg) scale(1)" }], { duration: 300, easing: "cubic-bezier(.3,1.6,.5,1)" }); });
    await wait(150);
    gust();
    await back;
    smudge.animate && !calm() && smudge.animate([{ opacity: .045 }, { opacity: .025 }], { duration: 600, fill: "forwards" });
    state = "wiped";
    btn.removeAttribute("aria-busy");
    btn.classList.add("undo");
    elabel.textContent = "Undo";
    say("Note erased. Press Undo or Control Z to bring it back.");
    lifeAnim = calm() ? null : life.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 4200 });
    await Promise.race([wait(4200), new Promise((r) => (undoNow = r))]);
    undoNow = null;
    await rewind();
  }

  // A gust of wind sweeps the crumbs off the card
  function gust() {
    if (calm()) { crumbList.forEach((o) => o.c.remove()); crumbList = []; return; }
    for (let i = 0; i < 4; i++) {
      const w = document.createElement("i");
      w.className = "wind";
      w.style.top = 30 + i * 22 + Math.random() * 10 + "%";
      crumbs.appendChild(w);
      w.animate([{ transform: "translateX(-40px)", opacity: 0 }, { opacity: .7, offset: .3 }, { transform: "translateX(" + (note.clientWidth + 40) + "px)", opacity: 0 }], { duration: 520, delay: i * 70, easing: "ease-in" }).onfinish = () => w.remove();
    }
    const list = crumbList;
    crumbList = [];
    list.forEach((o, i) => {
      const fly = 180 + Math.random() * 180, lift = (Math.random() - .6) * 50;
      o.c.animate([
        { transform: "translate(" + o.dx + "px," + o.dy + "px) rotate(" + o.rot + "deg)", opacity: .85 },
        { transform: "translate(" + (o.dx + fly) + "px," + (o.dy + lift) + "px) rotate(" + (o.rot + 400) + "deg)", opacity: 0 }
      ], { duration: 520 + Math.random() * 260, delay: 80 + (i % 30) * 8, easing: "cubic-bezier(.5,0,.7,1)", fill: "forwards" }).onfinish = () => o.c.remove();
    });
  }

  // ---------- Undo: the writing rewinds back onto the card with a little spark ----------
  async function rewind() {
    if (state !== "wiped") return;
    state = "rewinding";
    lifeAnim && lifeAnim.cancel();
    btn.classList.remove("undo");
    btn.setAttribute("aria-busy", "true");
    elabel.textContent = "Bringing it back…";
    note.classList.remove("wiped");
    smudge.getAnimations && smudge.getAnimations().forEach((a) => a.cancel());
    const spark = document.createElement("i");
    spark.className = "spark";
    if (!calm()) document.body.appendChild(spark);
    await tween(1000, (t) => {
      const f = 1 - t;
      setRub(f);
      const pg = toPage(scrub.getPointAtLength(L * f));
      spark.style.left = pg.x + "px";
      spark.style.top = pg.y + "px";
    }, easeInOut);
    spark.remove();
    setRub(0);
    play(note, [{ filter: "brightness(1.08)" }, { filter: "brightness(1)" }], { duration: 500 });
    paper.setAttribute("aria-label", "Note for Saturday: call Imran about the stall rent (done), buy flour, eggs and green tea, pick up Sana's parcel before 6. Side note: rent PKR 25,000.");
    btn.removeAttribute("aria-busy");
    elabel.textContent = "Erase note";
    state = "idle";
    say("Note restored.");
    if (demo.on) scheduleDemo(2600);
  }

  btn.addEventListener("click", () => {
    if (state === "idle") erase();
    else if (state === "wiped" && undoNow) undoNow();
  });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && state === "wiped" && undoNow) { e.preventDefault(); undoNow(); }
  });
  addEventListener("resize", () => { if (state === "idle") eraser.style.visibility = "hidden"; });

  // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
  const demo = { on: true, timer: 0 };
  function stopDemo() { if (!demo.on) return; demo.on = false; clearTimeout(demo.timer); }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demo.on) return;
    if (state !== "idle") { scheduleDemo(1200); return; }
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.95)" }, { transform: "scale(1)" }], { duration: 220 });
    erase();
    // press Undo a little early so the rewind shows
    const check = setInterval(() => {
      if (!demo.on) { clearInterval(check); return; }
      if (state === "wiped" && undoNow) {
        clearInterval(check);
        setTimeout(() => { if (demo.on && undoNow) { play(btn, [{ transform: "scale(1)" }, { transform: "scale(.95)" }, { transform: "scale(1)" }], { duration: 220 }); undoNow(); } }, 1700);
      }
    }, 200);
  }
  scheduleDemo(420);
</script>
</body>
</html>
