<!doctype html>
<!-- Chill & Craft · Spannerbay · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spannerbay · Car workshop admin</title>
<style>
/* ---------- Spannerbay look: bold blocks, thick outlines and hard shadows ---------- */
:root{--font:"Arial Black","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--bg:#f3efe6;--bg2:#e9e3d6;--panel:#ffffff;--panel-solid:#ffffff;--field:#fbf9f4;--text:#141414;--muted:#5e5a52;--line:#141414;--grid:#e6e0d3;--accent:#ff4d2e;--accent2:#ffd23f;--accent-ink:#141414;--edge:#141414;--shc:#141414;--focus:#3a86ff;
--good:#13a36b;--warn:#f08c00;--bad:#e5332a;--c1:#ff4d2e;--c2:#3a86ff;--c3:#2ec4b6;--c4:#ffd23f;--c5:#8338ec;--c6:#8a857b;
--r:10px;--rb:8px;--tip-bg:#141414;--hover:rgba(255,77,46,.1);--floor:#d9d5cc;--floor2:#cfcac0;--enter-anim:sb-drop}
[data-theme=dark]{--bg:#121316;--bg2:#1a1c20;--panel:#1d1f24;--panel-solid:#1d1f24;--field:#17191d;--text:#f2efe8;--muted:#a7a299;--line:#f2efe8;--grid:#2a2d33;--accent:#ff5a3d;--accent2:#ffd23f;--accent-ink:#141414;--edge:#f2efe8;--shc:#ff5a3d;--focus:#7fb0ff;
--good:#3ed598;--warn:#ffb547;--bad:#ff5d57;--c1:#ff5a3d;--c2:#7fb0ff;--c3:#4fe0d2;--c4:#ffd23f;--c5:#b58bff;--c6:#8f8b84;--tip-bg:#000;--hover:rgba(255,90,61,.12);--floor:#25282e;--floor2:#2c3037}
/* ---------- Core UI: shared structure. Each app sets its own look with the variables above. ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.55em .95em;border-radius:var(--rb,var(--r));font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .12s,background-color .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active,.ibtn:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.35em .7em;font-size:.78rem}
.btn .ic{width:16px;height:16px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,var(--r));border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s,border-color .2s,background-color .2s;position:relative;flex:none}
.ibtn:hover{border-color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:15px;height:15px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--panel)}
.badge[hidden]{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:.18em .62em;border-radius:99px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h,200) 55% 48%);color:#fff;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
/* staggered page entrance */
.enter{animation:var(--enter-anim,c-rise) .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes c-rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes c-fade{from{opacity:0}}
@keyframes c-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes c-land{0%{transform:scale(1.06)}100%{transform:none}}
.landed{animation:c-land .35s cubic-bezier(.2,.8,.2,1)}
/* tooltip */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;left:0;top:0}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{width:8px;height:8px;border-radius:2px;background:var(--sw)}
.tip .tr span{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
/* modal, drawer, command search */
.ovl{position:fixed;inset:0;z-index:60;background:var(--scrim,rgba(8,10,16,.52));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s}
.ovl.on{opacity:1}
.modal,.drawer,.cmdk{background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal{border-radius:calc(var(--r) + 4px);width:min(540px,100%);max-height:calc(100dvh - 32px);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(780px,100%)}
.modal.small{width:min(420px,100%)}
.ovl.on .modal,.ovl.on .cmdk{transform:none}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;border-width:0 0 0 1px;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ovl.on .drawer{transform:none}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:1.05rem}
.l-body{padding:18px;overflow:auto;flex:1;min-height:0}
.l-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf-msg{color:var(--muted)}
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);border-radius:calc(var(--r) + 4px);transform:translateY(-10px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.cmdk .l-head{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.cmdk .l-body{padding:0}
.ck-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:calc(var(--r) - 2px);text-align:left}
.cmdk li small{color:var(--muted)}
.cmdk li[aria-selected=true] button{background:var(--hover,color-mix(in srgb,var(--accent) 14%,transparent))}
.cmdk .empty{padding:20px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field,var(--bg));border-radius:var(--rb,var(--r));padding:.6em .7em;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.fld textarea{resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:c-shake .3s}
.fld .err{color:var(--bad);font-size:.74rem;font-weight:600}
.fld .err:empty{display:none}
@keyframes c-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent)}
/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar-x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar-x:empty{display:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:0 .65em;background:var(--field,var(--bg));flex:1 1 180px;max-width:300px;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:.55em 0;outline:none;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.32em .8em;font-size:.78rem;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip em{font-style:normal;opacity:.7;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th>button,.tbl th>.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%}
.tbl th>.th{cursor:default}
.tbl th>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th.n>button,.tbl th.n>.th{justify-content:flex-end}
.tbl .si{width:0;height:0;border:4px solid transparent;opacity:.25;border-top-color:currentColor;margin-top:4px}
.tbl th[aria-sort=ascending] .si{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px;opacity:1}
.tbl th[aria-sort=descending] .si{opacity:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl tbody tr[data-id]{cursor:pointer;transition:background-color .15s}
.tbl tbody tr[data-id]:hover{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-u{display:flex;align-items:center;gap:9px}
.cell-u small{display:block;color:var(--muted);font-size:.74rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pager .pg-btns{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:600}
/* popovers: bell and menus */
.pop{position:fixed;z-index:75;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);min-width:190px;max-width:min(350px,calc(100vw - 24px));padding:6px;animation:c-pop .18s ease both}
.pop .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r) - 2px);gap:8px;align-items:center;font-size:.86rem}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 12%,transparent));outline:none}
.bell-pop{width:340px;padding:0}
.bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-l{max-height:340px;overflow:auto;padding:6px}
.bell-i{display:flex;gap:10px;padding:9px 8px;border-radius:calc(var(--r) - 2px);font-size:.84rem}
.bell-i small{display:block;color:var(--muted);font-size:.74rem}
.bell-i.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-i .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.bell-i .dot.warn{background:var(--warn)}.bell-i .dot.bad{background:var(--bad)}.bell-i .dot.ok{background:var(--good)}
/* toasts */
.toasts{position:fixed;z-index:98;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--tip-bg,#16181d);color:var(--tip-ink,#fff);padding:11px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:c-toast .38s cubic-bezier(.2,.8,.2,1) both;font-size:.86rem;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(16px)}
.toast>i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.toast.warn>i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.toast.bad>i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.toast .btn{margin-left:auto;color:inherit;border-color:rgba(255,255,255,.3);background:transparent}
@keyframes c-toast{from{opacity:0;transform:translateY(14px) scale(.96)}}
/* segmented range switch */
.segc{display:inline-flex;position:relative;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:3px;background:var(--field,var(--bg));flex:none}
.segc button{position:relative;z-index:1;border:0;background:transparent;padding:.32em .75em;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:calc(var(--rb,var(--r)) - 2px);transition:color .25s}
.segc button[aria-pressed=true]{color:var(--accent-ink,#fff)}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--rb,var(--r)) - 2px);background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--muted);font-size:10.5px;font-family:var(--font-chart,inherit)}
.ax line{stroke:var(--grid,var(--line));stroke-dasharray:2 4}
.ax .base{stroke-dasharray:none}
.ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:c-draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.fadein{animation:c-fade .9s .3s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:c-grow .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes c-grow{from{transform:scaleY(0)}}
.dim .bar{opacity:.35}.dim .bar.hl{opacity:1}
.sweep{animation:c-sweep 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes c-sweep{from{stroke-dasharray:0 9999}}
.arc{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:auto;flex:none}
.d-c{font-weight:800;fill:var(--text)}.d-l{fill:var(--muted);font-size:11px}
.dleg{display:grid;gap:7px;flex:1;min-width:150px;font-size:.82rem}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;background:var(--sw);flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dleg small{color:var(--muted);width:3.2em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sw)}
.legend i.dash{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sw) 0 4px,transparent 4px 7px)}
.hl-g{opacity:0;transition:opacity .15s;pointer-events:none}
.hl-g line{stroke:var(--muted);stroke-dasharray:3 3}
.hl-g circle{stroke:var(--panel-solid,var(--panel));stroke-width:2}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.hb-t{height:9px;border-radius:9px;background:var(--track,color-mix(in srgb,var(--text) 8%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes c-w{from{width:0}}
.hb b{font-variant-numeric:tabular-nums}
.hm rect{transition:opacity .2s}
.hm .cell{animation:c-fade .5s both}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col-bg,color-mix(in srgb,var(--text) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background-color .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:10px;flex-wrap:wrap}
.kcol-h i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.kcol-h small{margin-left:auto;color:var(--muted);font-weight:600}
.kc-n{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none;position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.kc-f{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.kc-f .ibtn{width:26px;height:26px}
.grip{touch-action:none;cursor:grab}
.k-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:calc(var(--r) - 2px)}
.drop-on{outline-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:85;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.32);transition:none!important;opacity:.95}
body.is-dragging{cursor:grabbing;user-select:none}
/* month calendar */
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mc-h b{min-width:9em;text-align:center}
.mc-h .mc-x{margin-left:auto;display:flex;gap:8px}
.mc-wd,.mc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc-wd span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.mc-days{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mc-d{background:var(--panel-solid,var(--panel));min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.mc-d.out{background:color-mix(in srgb,var(--panel-solid,var(--panel)) 80%,var(--bg))}
.mc-d.out .mc-n{opacity:.4}
.mc-n{border:0;background:transparent;font-size:.74rem;font-weight:700;width:24px;height:24px;border-radius:50%;padding:0}
.mc-d.today .mc-n{background:var(--accent);color:var(--accent-ink,#fff)}
.mc-e{font-size:.7rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--text);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none}
.mc-more{border:0;background:transparent;font-size:.68rem;color:var(--muted);text-align:left;padding:0 4px}
@media (max-width:640px){.mc-d{min-height:64px}.mc-e{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--ec)}}
@media (max-width:540px){.form{grid-template-columns:1fr}.l-body{padding:14px}.toasts{right:12px;left:12px;bottom:12px;max-width:none}}
/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

body{font-family:var(--body);font-size:14px}
h1,h2,.k-v,.brand b,.big{font-family:var(--font);font-weight:900;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:#141414;padding:8px 12px;border:2px solid #141414}
.skip:focus{left:8px}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:16px 14px;display:flex;flex-direction:column;gap:14px;border-right:2px solid var(--edge);background:var(--accent2);color:#141414;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 8px}
.brand b{font-size:1.25rem;text-transform:uppercase;line-height:1}
.brand small{display:block;font-weight:800;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
.nav{position:relative;display:flex;flex-direction:column;gap:6px;flex:1}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid transparent;border-radius:8px;color:#141414;text-decoration:none;font-weight:800;text-transform:uppercase;font-size:.8rem;letter-spacing:.04em;transition:color .2s}
.nav a:hover{border-color:#141414}
.nav a[aria-current=page]{color:#fff}
.nav-marker{position:absolute;left:0;right:0;top:0;background:#141414;border-radius:8px;box-shadow:4px 4px 0 var(--accent);transition:transform .35s cubic-bezier(.3,1.5,.5,1),height .3s,opacity .2s;pointer-events:none}
.shiftc{border:2px solid #141414;border-radius:8px;background:#fff;padding:10px;font-size:.78rem;box-shadow:4px 4px 0 #141414;color:#141414}
.shiftc b{font-family:var(--font);font-size:1.3rem;display:block}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--bg);border-bottom:2px solid var(--edge)}
.menu-btn{display:none}
.nav-scrim{display:none}
.top .title{font-family:var(--font);font-size:1rem;text-transform:uppercase}
.tright{margin-left:auto;display:flex;gap:10px;align-items:center}
.ibtn{border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shc);border-radius:8px;background:var(--panel)}
.ibtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shc)}
.qsearch{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:8px;background:var(--panel);padding:8px 12px;box-shadow:3px 3px 0 var(--shc);font-weight:700;color:var(--muted)}
#view{padding:22px 24px 46px;max-width:1460px;overflow-x:clip}
@keyframes sb-drop{from{opacity:0;transform:translate(10px,10px);box-shadow:0 0 0 var(--shc)}}
/* ---------- bold blocks ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:2rem;text-transform:uppercase;line-height:1}
.ph p{color:var(--muted);margin-top:6px;font-weight:600}
.ph-x{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:var(--r);box-shadow:5px 5px 0 var(--shc);padding:16px;position:relative;min-width:0;transition:transform .15s,box-shadow .15s}
.kpi:hover,.mech:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shc)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:1rem;text-transform:uppercase}
.card-h small{color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{display:flex;flex-direction:column}
.kpi:nth-child(1){background:var(--accent);color:#141414}.kpi:nth-child(1) .k-l,.kpi:nth-child(1) .k-n,.kpi:nth-child(1) .k-d small{color:#141414}
.kpi:nth-child(2){background:var(--accent2);color:#141414}.kpi:nth-child(2) .k-l,.kpi:nth-child(2) .k-n,.kpi:nth-child(2) .k-d small{color:#141414}
.k-i{position:absolute;right:12px;top:12px;width:34px;height:34px;border:2px solid currentColor;border-radius:8px;display:grid;place-items:center}
.k-l{font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.k-v{font-size:2rem;margin-top:8px}
.k-d{font-weight:800;font-size:.76rem}
.k-d small,.k-n{color:var(--muted);font-weight:700;font-size:.74rem}
.kpi:nth-child(-n+2) .k-d.up,.kpi:nth-child(-n+2) .k-d.dn{color:#141414}
.g{display:grid;gap:16px;margin-bottom:18px}
.g-21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shc);border-radius:8px;font-weight:900;text-transform:uppercase;font-size:.74rem;letter-spacing:.04em;background:var(--panel)}
.btn:hover{border-color:var(--edge);background:var(--accent2);color:#141414}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shc)}
.btn.pri{background:var(--accent);color:#141414;border-color:var(--edge)}
.btn.ghost{background:var(--panel)}
.btn.danger{background:var(--bad);color:#fff}
.chip{border:2px solid var(--edge);border-radius:8px;font-weight:900;color:var(--text);text-transform:uppercase;font-size:.7rem}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--edge)}
.tag{border:1.5px solid currentColor;border-radius:6px;font-weight:900;text-transform:uppercase;font-size:.62rem;background:transparent}
.tag::before{display:none}
.tbl th{font-weight:900;color:var(--text);border-bottom:2px solid var(--edge)}
.tbl td{border-bottom:1px solid var(--grid)}
.search,.inp,.fld input,.fld select,.fld textarea{border:2px solid var(--edge);border-radius:8px}
.modal,.drawer,.cmdk,.pop{border:2px solid var(--edge);box-shadow:8px 8px 0 var(--shc)}
.drawer{border-width:0 0 0 2px}
.plate{display:inline-block;font:900 .72rem var(--mono);letter-spacing:.06em;background:#fff;color:#141414;border:2px solid #141414;border-radius:4px;padding:1px 6px;white-space:nowrap}
/* ---------- live bay board (signature) ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bay{position:relative;border:2px solid var(--edge);border-radius:10px;min-height:212px;padding:10px;background:repeating-linear-gradient(90deg,var(--floor) 0 38px,var(--floor2) 38px 40px);box-shadow:5px 5px 0 var(--shc);display:flex;flex-direction:column;transition:transform .15s,outline-color .2s;outline:3px dashed transparent;outline-offset:-8px}
.bay::before,.bay::after{content:"";position:absolute;top:44px;bottom:44px;width:6px;background:repeating-linear-gradient(0deg,var(--accent2) 0 14px,#141414 14px 28px)}
.bay::before{left:18%}.bay::after{right:18%}
.bay-h{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.bay-h b{font-family:var(--font);font-size:.9rem;background:#141414;color:#fff;padding:2px 8px;border-radius:5px}
.bay-h span{font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.bay-h .ibtn{margin-left:auto;width:28px;height:28px;box-shadow:2px 2px 0 var(--shc)}
.bay .car{position:relative;z-index:1;align-self:center;margin:8px 0 4px;width:76%;max-width:190px;filter:drop-shadow(0 calc(var(--lift,0) * 14px + 4px) calc(var(--lift,0) * 10px + 4px) rgba(0,0,0,.35));transform:scale(calc(1 + var(--lift,0) * .06));transition:transform 1.2s cubic-bezier(.3,1.4,.5,1),filter 1.2s}
.bay .car.in{animation:sb-in .9s cubic-bezier(.3,1.3,.5,1)}
@keyframes sb-in{from{transform:translateY(120px) rotate(4deg);opacity:0}}
.bay .free{position:relative;z-index:1;margin:auto;text-align:center;font-weight:900;text-transform:uppercase;font-size:.78rem;color:var(--muted);border:2px dashed var(--muted);border-radius:8px;padding:16px 10px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
.bay.out .free{border-color:var(--bad);color:var(--bad)}
.bay-f{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:6px 8px;margin-top:auto}
.bay-f .ring{width:40px;height:40px;flex:none}
.bay-f .ring circle{fill:none;stroke-width:5}
.bay-f .ring .tr{stroke:var(--grid)}
.bay-f .ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.bay-f b{display:block;font-size:.8rem;line-height:1.2}
.bay-f small{font-size:.7rem;color:var(--muted);font-weight:700}
.bay-f .pc{margin-left:auto;font:900 .9rem var(--mono)}
.bay.drop-on{outline-color:var(--accent);transform:translate(-2px,-2px)}
.bay.done .bay-f{background:var(--accent2);color:#141414}
.bay.done .bay-f small{color:#141414}
.queue{display:flex;flex-direction:column;gap:10px}
.qcar{display:flex;align-items:center;gap:10px;border:2px solid var(--edge);border-radius:8px;padding:8px;background:var(--panel);box-shadow:3px 3px 0 var(--shc);cursor:grab;user-select:none;transition:transform .15s}
.qcar:hover{transform:translate(-1px,-1px)}
.qcar svg{width:62px;flex:none;transform:rotate(-90deg)}
.qcar div{flex:1;min-width:0}
.qcar b{display:block;font-size:.84rem}
.qcar small{font-size:.72rem;color:var(--muted);font-weight:700}
.ready{display:flex;gap:10px;flex-wrap:wrap}
.ready .qcar{cursor:default;background:var(--accent2);color:#141414}
.ready .qcar small{color:#141414}
.wipe{animation:sb-out .8s cubic-bezier(.6,0,.4,1) forwards}
@keyframes sb-out{to{transform:translateX(140%) rotate(6deg);opacity:0}}
/* ---------- other pages ---------- */
.mechs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.mech .av{width:46px;height:46px;border:2px solid var(--edge);font-size:.9rem}
.mech header{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mech header b{display:block}
.mech header small{color:var(--muted);font-weight:700;font-size:.74rem}
.skills{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.skills span{font-size:.66rem;font-weight:900;text-transform:uppercase;border:1.5px solid var(--edge);border-radius:5px;padding:1px 6px}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--edge);border-radius:8px;font-weight:700;font-size:.84rem}
.chk li.done span{text-decoration:line-through;opacity:.6}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.lines{width:100%;border-collapse:collapse;font-size:.84rem}
.lines th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--edge);padding:6px 4px}
.lines td{padding:7px 4px;border-bottom:1px solid var(--grid)}
.lines td.n,.lines th.n{text-align:right}
.tot{display:flex;justify-content:space-between;font-family:var(--font);font-size:1.15rem;margin-top:10px;padding-top:8px;border-top:2px solid var(--edge)}
.steps{list-style:none;margin:14px 0;padding:0;display:flex;gap:3px}
.steps li{flex:1;text-align:center;font-size:.56rem;font-weight:900;text-transform:uppercase;color:var(--muted);padding-top:8px;border-top:5px solid var(--grid)}
.steps li.on{border-color:var(--accent);color:var(--text)}
.dsec{margin-top:16px}
.dsec h3{font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.minilist{list-style:none;margin:0;padding:0;font-size:.84rem}
.minilist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid)}
.set-sec{display:grid;gap:12px}
.mc-d{background:var(--panel)}
.mc-days{border:2px solid var(--edge);background:var(--edge)}
/* ---------- responsive ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:256px;transform:translateX(-104%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}body.nav-open .side{transform:none}body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}.menu-btn{display:grid}.qsearch span{display:none}.g-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){#view{padding:16px 12px 34px}.top{padding:10px 12px}.k-v{font-size:1.4rem}.kpis{gap:12px}.card{padding:12px;box-shadow:4px 4px 0 var(--shc)}.ph h1{font-size:1.5rem}.board{grid-template-columns:minmax(0,1fr)}.top .title{display:none}}
</style>
</head>

<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Sidebar">

<script>
/* ================= Core helpers (shared by every page of this app) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
let RM = mqRM.matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
let NS = 'craft:';
let APPNAME = 'App';

/* --- seeded random, so the demo data is the same on every load --- */
let _s = 1;
const seed = n => { _s = (n >>> 0) || 1; };
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Number.isNaN(+v) ? a : Math.max(a, Math.min(b, v));
/* every number written into SVG goes through fin/fx, so NaN or Infinity can never reach an attribute */
const fin = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const fx = (v, p = 1) => fin(v).toFixed(p);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const lerp = (a, b, t) => a + (b - a) * t;
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 8);

/* --- number, money and date formatting --- */
const fmt = (n, d = 0) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const short = (n, d = 1) => { n = +n || 0; const a = Math.abs(n), s = n < 0 ? '-' : ''; const f = (v, u) => s + v.toFixed(d).replace(/\.0+$/, '') + u; return a >= 1e9 ? f(a / 1e9, 'B') : a >= 1e6 ? f(a / 1e6, 'M') : a >= 1e3 ? f(a / 1e3, 'K') : s + fmt(a, a < 10 && a % 1 ? 1 : 0); };
let CUR = 'Rs ';
const money = (n, d = 0) => (n < 0 ? '-' : '') + CUR + fmt(Math.abs(n), d);
const moneyS = n => (n < 0 ? '-' : '') + CUR + short(Math.abs(n));
const pct = (n, d = 0) => fmt(n, d) + '%';
const FMT = { fmt: v => fmt(v), money: v => money(v), moneyS: v => moneyS(v), short: v => short(v), pct: v => pct(v), pct1: v => pct(v, 1), dec1: v => fmt(v, 1), dec2: v => fmt(v, 2) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY = 864e5;
const NOW = new Date(); NOW.setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fd = d => MON[d.getMonth()] + ' ' + d.getDate();
const fdy = d => fd(d) + ', ' + d.getFullYear();
const fdl = d => DAYN[d.getDay()] + ', ' + fd(d);

  const tb = el.querySelector('tbody'), info = el.querySelector('.pg-info');
  const rows = () => {
    let r = c.rows();
    if (st.q) { const q = st.q.toLowerCase(), keys = c.keys || c.cols.map(k => k.k).filter(Boolean); r = r.filter(x => keys.some(k => String(x[k] ?? '').toLowerCase().includes(q))); }
    if (c.filters) { const f = c.filters.find(f => f.label === st.f); if (f && f.fn) r = r.filter(f.fn); }
    if (st.k) r = [...r].sort((a, b) => { const A = a[st.k], B = b[st.k]; return (typeof A === 'number' && typeof B === 'number' ? A - B : A instanceof Date ? A - B : String(A).localeCompare(String(B), undefined, { numeric: true })) * st.d; });
    return r;
  };
  const draw = () => {

    if (c.filters) { const all = c.rows(); el.querySelectorAll('.chip').forEach(b => { const f = c.filters.find(f => f.label === b.dataset.f); b.querySelector('em').textContent = ' ' + (f && f.fn ? all.filter(f.fn).length : all.length); }); }
    el.querySelectorAll('th[aria-sort]').forEach(th => { const k = th.querySelector('button').dataset.k; th.setAttribute('aria-sort', k === st.k ? (st.d > 0 ? 'ascending' : 'descending') : 'none'); });
    c.after && c.after(r);
  };
  const s = el.querySelector('.search input'); s && s.addEventListener('input', () => { st.q = s.value.trim(); st.p = 0; draw(); });

  return { draw, st };
}

page('bookings', 'Bookings', v => {
  v.innerHTML = pageHead('Bookings', 'Drag a booking to another day. Click a day to book a car in.', `<button class="btn pri" type="button" data-add>${ic('plus')}New booking</button>`) + `<section class="kpis">${[{ label: 'Booked this week', value: DB.bookings.filter(b => b.date >= NOW && (b.date - NOW) / DAY < 7).length, icon: 'cal' }, { label: 'Today', value: DB.bookings.filter(b => dkey(b.date) === dkey(NOW)).length, icon: 'clock' }, { label: 'Next 30 days', value: DB.bookings.filter(b => b.date >= NOW).length, icon: 'list' }, { label: 'Bays free now', value: DB.bays.filter(b => !b.job && !b.out).length, icon: 'grid' }].map(kpiHTML).join('')}</section><section class="card"><div id="cal"></div></section>`;
  const book = d => formModal({ title: 'New booking', fields: [{ k: 'plate', label: 'Car', type: 'select', options: DB.customers.flatMap(c => c.cars.map(car => ({ v: car.plate, l: `${car.plate} · ${c.name}` }))), full: true }, { k: 'service', label: 'Service', type: 'select', options: SERV.map(s => s[0]) }, { k: 'date', label: 'Date', type: 'date', req: true, def: dkey(d || addDays(NOW, 1)), valid: x => fromKey(x) < NOW ? 'Pick today or a later date' : '' }, { k: 'time', label: 'Time', type: 'select', options: ['09:00', '10:30', '12:00', '14:00', '15:30', '17:00'] }], submit: 'Book', onSubmit: x => { const c = DB.customers.find(z => z.cars.some(car => car.plate === x.plate)); DB.bookings.push({ id: 'BK' + (DB.seq.bk++), title: x.plate + ' · ' + x.service, cust: c.name, plate: x.plate, date: x.date, time: x.time, color: 'var(--c2)' }); cal.draw(); Bell.add('Booking confirmed', `${x.plate} on ${fd(x.date)} at ${x.time}, SMS sent`, 'ok'); } });
  const cal = monthCal($('#cal', v), { events: () => DB.bookings, render: e => `${e.time} ${esc(e.plate)}`, onDay: book, onMove: (e, d) => { if (d < NOW) { toast('Bookings cannot move into the past', 'warn'); return; } e.date = d; toast(`${e.plate} moved to ${fd(d)}. Customer notified by SMS.`); }, onEvent: e => { const L = drawer({ title: esc(e.title), body: `<dl class="dl"><dt>Customer</dt><dd>${esc(e.cust)}</dd><dt>Car</dt><dd><span class="plate">${esc(e.plate)}</span></dd><dt>Date</dt><dd>${fdl(e.date)}</dd><dt>Time</dt><dd>${e.time}</dd></dl>`, foot: `<button class="btn ghost" type="button" data-del>${ic('trash')}Cancel booking</button><button class="btn pri" type="button" data-in>${ic('check')}Car has arrived</button>` }); $('[data-del]', L.el).onclick = async () => { if (await confirmBox(`Cancel the booking for ${esc(e.plate)}?`, { ok: 'Cancel booking' })) { DB.bookings.splice(DB.bookings.indexOf(e), 1); L.close(); cal.draw(); toast('Booking cancelled', 'warn'); } }; $('[data-in]', L.el).onclick = () => { const c = DB.customers.find(z => z.name === e.cust), car = c.cars.find(z => z.plate === e.plate) || c.cars[0], s = SERV.find(z => e.title.includes(z[0])) || SERV[0]; DB.jobs.push({ id: 'J' + (DB.seq.job++), cust: c.name, cid: c.id, plate: car.plate, model: car.model, color: car.color, service: s[0], hrs: s[1], labour: s[1] * DB.set.rate, parts: [], status: 'Booked', mech: DB.mech[0].name, bay: null, mins: Math.round(s[1] * 60), done: 0, date: new Date(), tasks: ['Inspect', 'Do the work', 'Road test', 'Wash and handover'].map(t => ({ t, ok: false })), notes: '' }); DB.bookings.splice(DB.bookings.indexOf(e), 1); L.close(); cal.draw(); toast(`${car.plate} checked in. It is waiting on the workshop floor.`); }; } });
  $('[data-add]', v).onclick = () => book(); pageRefresh = () => cal.draw();
});

/* --- Customers and vehicles --- */
page('customers', 'Customers', (v, p) => {
  const r = resourcePage(v, {
    title: 'Customers', sub: 'People and the cars they bring in.', noun: 'customer', data: () => DB.customers, sort: 'spend', param: p,
    cols: [C.who('name', 'Customer', 'phone'), C.txt('area', 'Area'), { k: 'cars', label: 'Cars', sort: false, f: x => x.map(c => `<span class="plate">${esc(c.plate)}</span>`).join(' ') }, { k: 'visits', label: 'Visits', num: true }, C.money('spend', 'Spend, 60 days'), { k: 'since', label: 'Since', num: true }],
    filters: [{ label: 'All' }, { label: 'Two cars', fn: c => c.cars.length > 1 }, { label: 'Regulars', fn: c => c.visits >= 6 }, { label: 'DHA', fn: c => c.area === 'DHA' }],
    kpis: d => [{ label: 'Customers', value: d.length, icon: 'users' }, { label: 'Cars on file', value: sum(d.map(c => c.cars.length)), icon: 'car' }, { label: 'Regulars', value: d.filter(c => c.visits >= 6).length, icon: 'star' }, { label: 'Spend, 60 days', value: sum(d.map(c => c.spend)), f: 'moneyS', icon: 'wallet' }],
    fields: [{ k: 'name', label: 'Name', req: true }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'area', label: 'Area', type: 'select', options: ['Gulberg', 'DHA', 'Model Town', 'Johar Town', 'Cantt', 'Garden Town', 'Bahria Town'] }, { k: 'plate', label: 'Car plate', req: true, ph: 'LEA-1234', valid: x => /^[A-Z]{2,4}-\d{2,5}$/i.test(x) ? '' : 'Use a plate like LEA-1234' }, { k: 'model', label: 'Car', type: 'select', options: MODELS }, { k: 'year', label: 'Year', type: 'number', min: 1990, max: NOW.getFullYear() + 1, req: true, def: 2018 }],
    toForm: c => ({ ...c, plate: c.cars[0] ? c.cars[0].plate : '', model: c.cars[0] ? c.cars[0].model : MODELS[0], year: c.cars[0] ? c.cars[0].year : 2018 }),
    fromForm: (x, c) => { const car = c.cars[0] || {}; Object.assign(car, { plate: x.plate.toUpperCase(), model: x.model, year: x.year }); if (!c.cars.length) c.cars.push({ ...car, color: pick(COLORS), km: 0 }); return { name: x.name, phone: x.phone, area: x.area }; },
    make: x => ({ id: 'C' + (DB.seq.cus++), name: x.name, phone: x.phone, area: x.area, cars: [{ plate: x.plate.toUpperCase(), model: x.model, year: x.year, color: pick(COLORS), km: 0 }], visits: 0, spend: 0, since: NOW.getFullYear() }),
    detail: c => `<dl class="dl"><dt>Phone</dt><dd>${esc(c.phone)}</dd><dt>Area</dt><dd>${esc(c.area)}</dd><dt>Visits</dt><dd>${c.visits}</dd><dt>Spend</dt><dd>${money(c.spend)}</dd></dl><div class="dsec"><h3>Cars</h3><ul class="minilist">${c.cars.map(car => `<li><span class="plate">${esc(car.plate)}</span><span>${esc(car.model)}, ${car.year}</span><span class="muted">${fmt(car.km)} km</span></li>`).join('')}</ul></div><div class="dsec"><h3>Service history</h3><ul class="minilist">${DB.jobs.filter(j => j.cid === c.id).slice(0, 6).map(j => `<li><span>${fd(j.date)}</span><span>${esc(j.service)}</span>${tagS(j.status)}</li>`).join('') || '<li>No visits yet</li>'}</ul></div>`,
    dActions: c => `<button class="btn" type="button" data-job>${ic('tool')}New job</button>`, onDetail: (el, c, L, refresh) => { el.querySelector('[data-job]').onclick = () => { L.close(); jobModal(null, refresh); setTimeout(() => { const s = $('.modal select'); if (s) s.value = c.cars[0].plate; }, 30); }; }
  });
  pageRefresh = r.refresh;
});

/* --- Parts --- */
page('parts', 'Parts', (v, p) => {
  const r = resourcePage(v, {
    title: 'Parts', sub: 'Spares on the shelf. Red stock is below the reorder point.', noun: 'part', data: () => DB.parts, sort: 'name', dir: 1, param: p,
    cols: [C.id(), C.txt('name', 'Part'), C.txt('cat', 'Category'), { k: 'stock', label: 'In stock', num: true, f: (x, q) => `<b style="color:${x < q.reorder ? 'var(--bad)' : 'inherit'}">${x}</b>` }, { k: 'reorder', label: 'Reorder at', num: true }, C.money('price', 'Price'), C.txt('sup', 'Supplier')],
    filters: [{ label: 'All' }, { label: 'Low', fn: q => q.stock < q.reorder }, { label: 'Out', fn: q => q.stock === 0 }, { label: 'Filters', fn: q => q.cat === 'Filters' }, { label: 'Brakes', fn: q => q.cat === 'Brakes' }],
    kpis: d => [{ label: 'Stock value', value: sum(d.map(q => q.stock * q.price)), f: 'moneyS', icon: 'wallet' }, { label: 'Below reorder', value: d.filter(q => q.stock < q.reorder).length, icon: 'alert' }, { label: 'Out of stock', value: d.filter(q => q.stock === 0).length, icon: 'x' }, { label: 'Part lines', value: d.length, icon: 'box' }],
    chart: (el, d) => hbars(el, d.slice().sort((a, b) => a.stock / a.reorder - b.stock / b.reorder).slice(0, 6).map(q => ({ label: q.name, value: q.stock, color: q.stock < q.reorder ? 'var(--bad)' : 'var(--good)' })), { fmt: x => x + ' left' }), chartTitle: 'Closest to running out',
    fields: [{ k: 'name', label: 'Part name', req: true, full: true }, { k: 'cat', label: 'Category', type: 'select', options: ['Filters', 'Oils', 'Brakes', 'Ignition', 'Electrical', 'AC', 'Transmission', 'Suspension', 'Body', 'Engine'] }, { k: 'price', label: 'Price (Rs)', type: 'number', min: 1, req: true }, { k: 'stock', label: 'In stock', type: 'number', min: 0, req: true, def: 10 }, { k: 'reorder', label: 'Reorder at', type: 'number', min: 0, req: true, def: 5 }, { k: 'sup', label: 'Supplier', type: 'select', options: ['Mcleod Road Spares', 'Badami Bagh Auto Parts', 'City Lube Traders', 'Frontline Batteries'] }],
    make: x => ({ id: 'P' + (DB.seq.part++), ...x }),
    dActions: q => `<button class="btn" type="button" data-ro>${ic('cart')}Restock</button>`,
    onDetail: (el, q, L, refresh) => { el.querySelector('[data-ro]').onclick = () => { L.close(); formModal({ title: 'Restock ' + q.name, fields: [{ k: 'n', label: 'Units received', type: 'number', min: 1, req: true, def: Math.max(q.reorder * 2 - q.stock, 5) }], submit: 'Add to stock', onSubmit: x => { q.stock += x.n; refresh(); toast(`${x.n} × ${q.name} added`); } }); }; }
  });
  pageRefresh = r.refresh;
});

/* --- Invoices --- */
function invoiceView(x) { const j = DB.jobs.find(z => z.id === x.job); const sub = j ? j.labour + sum(j.parts.map(p => p.qty * p.price)) : Math.round(x.amount / (1 + DB.set.tax / 100)); return `${tagS(x.status)}<div style="margin:12px 0"><b style="font-family:var(--font);font-size:1.1rem">${esc(DB.set.name)}</b><br><small class="muted">${esc(DB.set.city)} · ${esc(DB.set.phone)}</small></div><dl class="dl"><dt>Invoice</dt><dd class="mono">${x.id}</dd><dt>Customer</dt><dd>${esc(x.cust)}</dd><dt>Car</dt><dd><span class="plate">${esc(x.plate)}</span></dd><dt>Date</dt><dd>${fdy(x.date)}</dd></dl><table class="lines" style="margin-top:12px"><thead><tr><th>Item</th><th class="n">Amount</th></tr></thead><tbody>${j ? `<tr><td>${esc(j.service)}, labour ${j.hrs} h</td><td class="n">${money(j.labour)}</td></tr>${j.parts.map(p => `<tr><td>${esc(p.name)} × ${p.qty}</td><td class="n">${money(p.qty * p.price)}</td></tr>`).join('')}` : `<tr><td>Workshop services</td><td class="n">${money(sub)}</td></tr>`}<tr><td>Sales tax ${DB.set.tax}%</td><td class="n">${money(x.amount - sub)}</td></tr></tbody></table><div class="tot"><span>Total</span><span>${money(x.amount)}</span></div>`; }
page('invoices', 'Invoices', (v, p) => {
  const r = resourcePage(v, {
    title: 'Invoices', sub: 'Bills for finished jobs. Take payment at handover.', noun: 'invoice', data: () => DB.inv, sort: 'date', param: p,
    cols: [C.id(), C.who('cust', 'Customer'), C.plate(), C.money('amount', 'Amount'), C.date('date', 'Date'), C.txt('method', 'Method'), C.tag('status', 'Status')],
    filters: sF('status', ['Unpaid', 'Overdue', 'Paid']),
    kpis: d => [{ label: 'Unpaid', value: sum(d.filter(x => x.status !== 'Paid').map(x => x.amount)), f: 'money', icon: 'alert' }, { label: 'Paid, 60 days', value: sum(d.filter(x => x.status === 'Paid').map(x => x.amount)), f: 'moneyS', icon: 'check' }, { label: 'Invoices', value: d.length, icon: 'doc' }, { label: 'Paid by card', value: d.filter(x => x.status === 'Paid' && x.method === 'Card').length / Math.max(1, d.filter(x => x.status === 'Paid').length) * 100, f: 'pct', icon: 'wallet' }],
    chart: (el, d) => donut(el, { data: ['Cash', 'Card', 'Bank transfer'].map((m, i) => ({ label: m, value: sum(d.filter(x => x.status === 'Paid' && x.method === m).map(x => x.amount)), color: ['var(--c4)', 'var(--c2)', 'var(--c3)'][i] })), vfmt: moneyS, centerLabel: 'collected', size: 150, thick: 22 }), chartTitle: 'How customers pay',
    detail: invoiceView,
    dActions: x => `<button class="btn" type="button" data-sms>${ic('msg')}Send by SMS</button><button class="btn" type="button" data-print>${ic('dl')}Print</button>${x.status !== 'Paid' ? `<button class="btn pri" type="button" data-pay>${ic('check')}Take payment</button>` : ''}`,
    onDetail: (el, x, L, refresh) => { el.querySelector('[data-sms]').onclick = () => toast('Invoice link sent to ' + x.cust + ' by SMS'); el.querySelector('[data-print]').onclick = () => { try { window.print(); } catch (e) { toast('Printing is not available here', 'warn'); } }; const pb = el.querySelector('[data-pay]'); pb && (pb.onclick = () => { L.close(); formModal({ title: 'Take payment · ' + money(x.amount), fields: [{ k: 'method', label: 'Paid by', type: 'select', options: ['Cash', 'Card', 'Bank transfer'] }, { k: 'got', label: 'Amount received (Rs)', type: 'number', min: 1, req: true, def: x.amount, valid: n => n < x.amount ? 'Less than the bill. Take the full amount.' : '' }], submit: 'Mark paid', onSubmit: y => { x.status = 'Paid'; x.method = y.method; const ch = y.got - x.amount; refresh(); Bell.add(`${x.id} paid by ${y.method.toLowerCase()}`, money(x.amount) + (ch > 0 ? ` · change ${money(ch)}` : ''), 'ok'); } }); }); }
  });
  pageRefresh = r.refresh;
});

/* --- Settings --- */
page('settings', 'Settings', v => {
  v.innerHTML = pageHead('Settings', 'Workshop details, rates and display.') + `<div class="g g-2"><section class="card"><div class="card-h"><h2>Workshop</h2></div><form class="form" id="sf" novalidate>${formHTML([{ k: 'name', label: 'Workshop name', req: true, full: true }, { k: 'city', label: 'City', req: true }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'rate', label: 'Labour rate per hour (Rs)', type: 'number', min: 100, req: true }, { k: 'tax', label: 'Sales tax (%)', type: 'number', min: 0, max: 30, req: true }, { k: 'open', label: 'Opens', type: 'time', req: true }, { k: 'close', label: 'Closes', type: 'time', req: true }], DB.set)}<div class="fld full"><button class="btn pri" type="submit">${ic('check')}Save</button></div></form></section>
  <section class="card set-sec"><div class="card-h" style="margin:0"><h2>Display and alerts</h2></div>${switchHTML('s-dark', 'Dark theme', Theme.get() === 'dark')}${switchHTML('s-rm', 'Reduce motion', document.documentElement.classList.contains('rm'))}${switchHTML('s-1', 'SMS customers when their car is ready', true)}${switchHTML('s-2', 'Alert on low stock', true)}<div class="card-h" style="margin:8px 0 0"><h2>Demo data</h2></div><p class="muted">Customers, cars and numbers are invented. Car models are made up too.</p><button class="btn danger" type="button" data-reset style="justify-self:start">${ic('refresh')}Reset demo data</button></section></div>`;
  $('#sf', v).addEventListener('submit', e => { e.preventDefault(); const x = readForm(e.target, [{ k: 'name', label: 'Name', req: true }, { k: 'city', label: 'City', req: true }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'rate', label: 'Rate', type: 'number', min: 100, req: true }, { k: 'tax', label: 'Tax', type: 'number', min: 0, max: 30, req: true }, { k: 'open', label: 'Opens', req: true }, { k: 'close', label: 'Closes', req: true, valid: (c, o) => c <= o.open ? 'Closing time must be after opening' : '' }]); if (x) { Object.assign(DB.set, x); $('.top .title').textContent = x.name; toast('Workshop settings saved'); } });
  $('#s-dark', v).onchange = e => Theme.set(e.target.checked ? 'dark' : 'light');
  $('#s-rm', v).onchange = e => { RM = e.target.checked; document.documentElement.classList.toggle('rm', RM); toast(RM ? 'Motion reduced' : 'Motion back on'); };
  ['#s-1', '#s-2'].forEach(s => $(s, v).onchange = () => toast('Setting saved'));
  $('[data-reset]', v).onclick = async () => { if (await confirmBox('Reset all demo data? Your changes will be lost.', { ok: 'Reset data' })) { DB = makeData(); Bell.list = []; Bell.badge(); toast('Demo data reset'); location.hash = '#/floor'; } };
});

/* ================= Start ================= */
DB = makeData();
Theme.init();
Bell.init($('[data-bell]'));
Bell.add('Cabin filter is low', '4 left, reorder at 8', 'warn', true);
Bell.add('3 bookings tomorrow morning', 'First at 09:00', 'ok', true);
Cmdk.extra = [{ label: 'New job card', hint: 'Action', run: () => jobModal() }, { label: 'New booking', hint: 'Action', run: () => { location.hash = '#/bookings'; setTimeout(() => { const b = $('[data-add]'); b && b.click(); }, 300); } }, { label: 'Toggle dark theme', hint: 'Action', run: () => Theme.toggle() }, ...DB.customers.flatMap(c => c.cars.map(car => ({ label: car.plate + ' · ' + c.name, hint: 'Car', run: () => { location.hash = '#/customers/' + c.id; } })))];
const tick = () => { $('#clk').textContent = ftime(new Date()); $('#cars-in').textContent = DB.jobs.filter(j => ['Booked', 'In bay', 'Waiting parts', 'Quality check', 'Ready'].includes(j.status)).length + ' cars in the workshop'; };
tick(); every(1000, () => { work(); tick(); }, true);
Router.start();
</script>
</body>
