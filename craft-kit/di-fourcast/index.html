<script>/* set the theme before first paint: ?theme= wins, then saved, then system */(function(){var d=document.documentElement,t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(d.dataset.key+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d.dataset.def||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t})();</script>
<style>
/* ---------- theme tokens: pastel blocks, ink outlines, hard shadows ---------- */
:root{--font:"Avenir Next","Trebuchet MS",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.3,1.4,.5,1);--ease2:cubic-bezier(.22,1,.36,1);
--bg:#fff7e8;--surface:#ffffff;--surface-2:#fff0d4;--text:#161414;--muted:#5d5752;--line:rgba(22,20,20,.14);--ink:#161414;--hover:rgba(255,216,77,.28);--accent:#8f6bff;--on-accent:#fff;--ring:rgba(143,107,255,.25);
--c1:#8f6bff;--c2:#16b882;--c3:#ff6a4d;--c4:#2f95f0;--c5:#f5b800;--c6:#ff5ca8;--lemon:#ffd84d;--ok:#11875f;--ok-bg:#d4f7e7;--bad:#d93a1e;--bad-bg:#ffe0d8;--warn:#9a6a00;--warn-bg:#fff0bf;--info-bg:#ebe3ff;
--sh:4px 4px 0 var(--ink);--sh2:7px 7px 0 var(--ink);--bw:2px;--grid:rgba(22,20,20,.1);--r:18px;--r-btn:12px;--r-in:12px;--r-seg:12px;--r-modal:20px;--toast-bg:#161414;--tip-bg:#161414}
[data-theme="dark"]{--bg:#16151b;--surface:#211f29;--surface-2:#2b2834;--text:#f6f1e7;--muted:#b3acbd;--line:rgba(246,241,231,.12);--ink:#efe8db;--hover:rgba(255,216,77,.12);--accent:#a98bff;--on-accent:#16151b;--ring:rgba(169,139,255,.3);
--c1:#a98bff;--c2:#3fdca6;--c3:#ff8a70;--c4:#5cb2ff;--c5:#ffd84d;--c6:#ff7dbb;--ok:#3fdca6;--ok-bg:rgba(63,220,166,.15);--bad:#ff8a70;--bad-bg:rgba(255,138,112,.15);--warn:#ffd84d;--warn-bg:rgba(255,216,77,.15);--info-bg:rgba(169,139,255,.18);
--sh:4px 4px 0 #000;--sh2:7px 7px 0 #000;--grid:rgba(246,241,231,.09);--toast-bg:#efe8db;--toast-fg:#16151b;--tip-bg:#efe8db;--tip-fg:#16151b}
/* ---------- Core UI kit (shared parts, coloured by the theme tokens above) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--field,var(--surface-2));border:1px solid var(--line);border-radius:var(--r-in,10px);padding:.58em .75em;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio],input[type=range],input[type=color]{width:auto;padding:0;box-shadow:none}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:var(--iw,1.8);stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.num,.tnum{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--surface);padding:.55em .95em;border-radius:var(--r-btn,10px);font-weight:600;font-size:.88rem;line-height:1.2;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:.36em .65em;font-size:.78rem}
.btn:disabled{opacity:.5;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-btn,10px);position:relative;color:inherit;transition:background-color .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--hover)}
.ibtn:active{transform:scale(.9)}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);animation:dotPop .4s var(--ease)}
.ibtn .dot[hidden]{display:none}
@keyframes dotPop{from{transform:scale(0)}}
/* segmented control with a sliding pill */
.seg{position:relative;display:inline-flex;padding:3px;background:var(--surface-2);border-radius:var(--r-seg,10px);border:1px solid var(--line);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;padding:.36em .8em;font-size:.8rem;font-weight:600;color:var(--muted);border-radius:calc(var(--r-seg,10px) - 3px);transition:color .2s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--seg-on,var(--text))}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-seg,10px) - 3px);background:var(--seg-pill,var(--surface));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .38s var(--ease),width .38s var(--ease)}
/* badges, deltas, avatars */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg,var(--ring));color:var(--accent)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:.78rem;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.delta .i{width:.95em;height:.95em}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;font-weight:700;flex:none;background:hsl(var(--h) 62% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 75% 86%)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:.76rem}
/* switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background-color .25s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-weight:650;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2,var(--line));white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background-color .15s;cursor:pointer;animation:rowIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num .th-sort{flex-direction:row-reverse}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.th-sort{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.th-sort .i{opacity:.3;transition:transform .25s var(--ease),opacity .2s}
th[aria-sort] .th-sort .i{opacity:1}
th[aria-sort="ascending"] .th-sort .i{transform:rotate(180deg)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 180px;max-width:300px;display:block}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:.34em .8em;border-radius:99px;border:1px solid var(--line);font-size:.78rem;font-weight:650;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--chip-on,var(--accent));border-color:transparent;color:var(--on-accent,#fff)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);font-weight:650;color:var(--text);transition:background-color .2s,transform .15s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent}
.pager button:disabled{opacity:.35;cursor:default}
.empty{display:grid;place-items:center;gap:6px;padding:26px 12px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.55}
/* overlays: modal, drawer */
.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(8,10,20,.48));opacity:0;transition:opacity .24s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ovl.open{opacity:1}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--r-modal,16px);box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line);transform:translateY(18px) scale(.96);transition:transform .34s var(--ease)}
.modal.wide{width:min(780px,100%)}
.ovl.open .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
.m-head h2{font-size:1.06rem}
.m-body{padding:10px 18px 18px;display:grid;gap:12px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.m-text{color:var(--muted)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:650;color:var(--muted)}
.err{color:var(--bad);font-size:.75rem}
.err:empty{display:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100vw);height:100%;background:var(--surface-solid,var(--surface));border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.25);transform:translateX(104%);transition:transform .38s var(--ease);display:flex;flex-direction:column;color:var(--text)}
.ovl.open .drawer{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.06rem}
.d-body{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.d-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
/* popovers and menus */
.pop{position:fixed;z-index:90;min-width:200px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:6px;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:.86rem}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.on{font-weight:700;color:var(--accent)}
.mi.danger{color:var(--bad)}
.pop-t{padding:6px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.notes{max-height:330px;overflow:auto;display:grid;gap:2px}
.note{display:flex;gap:10px;padding:9px 8px;border-radius:8px;font-size:.84rem;align-items:flex-start}
.note .i{margin-top:2px;color:var(--accent)}
.note.new{background:var(--hover)}
.note small{color:var(--muted)}
/* command search */
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);background:var(--surface-solid,var(--surface));border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease);color:var(--text)}
.ovl.open .cmdk{transform:none}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:transparent;box-shadow:none;padding:6px 0;font-size:1rem}
kbd{font:600 .7rem/1 var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.cmdk-list{max-height:min(360px,55vh);overflow:auto;padding:6px}
.cmdk-it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.cmdk-it small{margin-left:auto;color:var(--muted)}
.cmdk-it[aria-selected="true"]{background:var(--hover);color:var(--accent)}
/* toasts */
.toasts{position:fixed;z-index:100;right:16px;bottom:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);box-shadow:0 12px 30px rgba(0,0,0,.28);font-size:.86rem;animation:toastIn .4s var(--ease);transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px) scale(.97)}
.toast.ok .i{color:#7be3a6}.toast.err .i{color:#ff8f8f}.toast.info .i{color:#9cc4ff}
.t-act{font-weight:700;color:#9cc4ff;margin-left:4px;padding:2px 4px;border-radius:6px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* chart tooltip */
.tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;background:var(--tip-bg,rgba(14,17,27,.95));color:var(--tip-fg,#fff);padding:8px 11px;border-radius:10px;font-size:.78rem;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:opacity .12s;min-width:120px;max-width:260px}
.tip.on{opacity:1}
.tip .tr{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;opacity:.82}
.tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.ch{display:block;overflow:visible;max-width:100%;outline:none}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ch text{font-size:11px;fill:var(--axis,var(--muted));font-family:var(--font)}
.ch .grid{stroke:var(--grid,var(--line));stroke-width:1;stroke-dasharray:var(--grid-dash,3 4)}
.ch .zero{stroke:var(--axis,var(--muted));stroke-width:1;opacity:.5}
.ch-line{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ch-line.dash{stroke-dasharray:5 5;stroke-width:1.8;opacity:.85}
.ch.enter .ch-line:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.3s var(--ease) .1s forwards}
.ch.enter .ch-area,.ch.enter .ch-line.dash,.ch.enter .tgt{animation:chFade 1s ease .3s both}
.tgt{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:6 4}
.guide{stroke:var(--axis,var(--muted));stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.hdot{fill:var(--surface-solid,var(--surface));stroke-width:2.5;opacity:0;transition:opacity .15s}
.ch.hover .guide,.ch.hover .hdot{opacity:1}
.ch-bar{transition:opacity .2s}
.ch.enter .ch-bar{transform-box:fill-box;transform-origin:50% 100%;animation:chGrow .8s var(--ease) both;animation-delay:calc(var(--i) * 26ms)}
.ch.enter .ch-bar.neg{transform-origin:50% 0}
.ch.colhover .col:not(.on) .ch-bar{opacity:.38}
.ch-seg{fill:none;transition:stroke-width .25s var(--ease),opacity .2s;cursor:pointer}
.ch-seg.dim{opacity:.35}
.ch.enter .ch-seg{animation:chSweep 1.1s var(--ease) both;animation-delay:calc(var(--i) * 110ms)}
.ch-cell{transform-box:fill-box;transform-origin:center;transition:opacity .15s}
.ch.enter .ch-cell,.ch.enter .ch-cellt{animation:chPop .55s var(--ease) both;animation-delay:calc(var(--i) * 12ms)}
.ch .ch-cellt{font-size:10px;font-weight:600;pointer-events:none}
.ch .ch-cellt.hi{fill:#fff}
.ch.enter .ch-fun{transform-box:fill-box;transform-origin:50% 50%;animation:chGrowX .8s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.ch.enter .ch-gauge{animation:chSweep 1.4s var(--ease) both}
.spark{display:block;overflow:visible}
.sp-l{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.2s var(--ease) .25s forwards}
@keyframes chDraw{to{stroke-dashoffset:0}}
@keyframes chFade{from{opacity:0}}
@keyframes chGrow{from{transform:scaleY(0)}}
@keyframes chGrowX{from{transform:scaleX(0)}}
@keyframes chSweep{from{stroke-dasharray:0 100}}
@keyframes chPop{from{opacity:0;transform:scale(.4)}}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;font-size:.76rem}
.lg button{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:650;padding:2px 0;transition:opacity .2s}
.lg button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn .ch{flex:none}
.dn-l{display:grid;gap:6px;flex:1;min-width:150px;font-size:.82rem}
.dn-l button{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;text-align:left;padding:3px 4px;border-radius:6px}
.dn-l button:hover,.dn-l button:focus-visible{background:var(--hover)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l small{color:var(--muted);min-width:38px;text-align:right}
.dn-v{font-size:20px!important;font-weight:750;fill:var(--text)!important}
.dn-s{font-size:10.5px!important}
.hbars{display:grid;gap:4px}
.hb{display:grid;grid-template-columns:minmax(64px,34%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;padding:4px 0}
.hb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-f{height:100%;width:var(--w);border-radius:inherit;background:var(--hb,var(--accent));transform-origin:left;transition:width .7s var(--ease)}
.hbars.enter .hb-f{animation:chGrowX .9s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.hb b{font-variant-numeric:tabular-nums;font-weight:650}
/* drag and drop */
.ghost{opacity:.92;box-shadow:0 18px 40px rgba(0,0,0,.28)!important;cursor:grabbing}
.dragging{opacity:.35}
.drop-over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--hover)}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* page entrance (each item sets its own @keyframes rise) */
.view.enter .rise{animation:rise .62s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.theme-anim,.theme-anim *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;overflow-x:clip}
.side{position:sticky;top:0;height:100vh;padding:18px 16px;display:flex;flex-direction:column;gap:18px;border-right:var(--bw) solid var(--ink);background:var(--surface-2);z-index:60;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.35rem;letter-spacing:-.03em}
.logo{width:40px;height:40px;flex:none}
.logo .q{transform-origin:20px 20px;transition:transform .6s var(--ease)}
.brand:hover .q1{transform:translate(-2px,-2px)}.brand:hover .q2{transform:translate(2px,-2px)}.brand:hover .q3{transform:translate(-2px,2px)}.brand:hover .q4{transform:translate(2px,2px)}
#nav{position:relative;display:grid;gap:6px}
.nl{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:750;border:var(--bw) solid transparent;transition:transform .3s var(--ease)}
.nl:hover{transform:translateX(4px)}
.nl[aria-current="page"]{color:#161414}
.nl .nc{margin-left:auto;font-style:normal;font-size:.72rem;font-weight:900;background:var(--c6);color:#fff;border:var(--bw) solid var(--ink);border-radius:99px;padding:0 7px}
.nav-marker{position:absolute;left:0;right:0;top:0;height:44px;border-radius:12px;background:var(--lemon);border:var(--bw) solid var(--ink);box-shadow:var(--sh);transition:transform .55s var(--ease),height .45s var(--ease),opacity .3s}
.side-cta{margin-top:auto}
.side-cta .btn{width:100%}
.ch-on{display:grid;gap:6px;font-size:.8rem;font-weight:700}
.ch-on span{display:flex;align-items:center;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 26px;background:var(--bg);border-bottom:var(--bw) solid var(--ink)}
.top h2{font-size:1rem;font-weight:900}
.menu-btn{display:none}
.view{padding:22px 26px 50px;display:grid;gap:20px;outline:none;align-content:start}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:clamp(1.7rem,3vw,2.4rem);font-weight:900;letter-spacing:-.04em;line-height:1}
.ph p{color:var(--muted);margin-top:6px;font-weight:600}
.ph-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* bold blocks */
.card,.btn,.seg,.chip,input,select,textarea,.pager button{border:var(--bw) solid var(--ink)!important}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{transform:translate(-2px,-2px);box-shadow:var(--sh2)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:1.08rem;font-weight:900;letter-spacing:-.02em}
.btn{box-shadow:3px 3px 0 var(--ink);font-weight:800}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--lemon);color:#161414}
.btn.ghost{box-shadow:none;border-color:transparent!important}
.btn.danger{background:var(--c3);color:#161414}
.seg{background:var(--surface);box-shadow:3px 3px 0 var(--ink)}
.seg .pill{background:var(--lemon);box-shadow:none;border:var(--bw) solid var(--ink);top:2px;bottom:2px}
.seg button[aria-selected="true"]{color:#161414}
.chip[aria-pressed="true"]{background:var(--lemon);color:#161414}
.pager button[aria-current="page"]{background:var(--lemon);color:#161414}
.tbl th{border-bottom:var(--bw) solid var(--ink)}
.tbl tbody tr:hover{background:var(--hover)}
.ibtn:hover{background:var(--hover)}
input:focus,select:focus,textarea:focus{box-shadow:3px 3px 0 var(--accent)}
.badge{border:1.5px solid currentColor}
/* channel tags (plain letters, no logos) */
.tg{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:7px;font-size:.66rem;font-weight:900;color:#161414;background:var(--cc);border:var(--bw) solid var(--ink)}
.tgs{display:inline-flex;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.cmdk-in input{border:0!important;box-shadow:none!important}
.chcard{display:block;position:relative;overflow:hidden;background:color-mix(in srgb,var(--cc) 22%,var(--surface))}
.chcard .row{justify-content:space-between}
.chcard b.big{display:block;font-size:1.75rem;font-weight:900;letter-spacing:-.04em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.chcard small{color:var(--muted);font-weight:700;font-size:.78rem}
.chcard .spark{margin-top:8px;width:100%}
.g-ov{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.art{display:block;width:100%;height:100%;border-radius:10px}
.thumb{position:relative;width:44px;height:44px;flex:none;border:var(--bw) solid var(--ink);border-radius:10px;overflow:hidden}
.thumb .art{border-radius:0}
.vidb{position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:#161414;color:#fff;display:grid;place-items:center}
.vidb .i{width:8px;height:8px;fill:#fff;stroke:none}
.uplist{display:grid;gap:8px}
.up{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:12px;text-align:left;width:100%;transition:background-color .2s}
.up:hover{background:var(--hover)}
.up b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up small{color:var(--muted);font-weight:650;font-size:.76rem}
.toppost{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.toppost .thumb{width:120px;height:120px}
.statrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.82rem;font-weight:700}
.statrow span{display:flex;align-items:center;gap:5px}
/* composer */
.comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:22px;align-items:start}
.chpick{display:flex;gap:8px;flex-wrap:wrap}
.chpick label{display:flex;align-items:center;gap:8px;padding:8px 12px;border:var(--bw) solid var(--ink);border-radius:12px;font-weight:800;cursor:pointer;background:var(--surface);transition:background-color .2s,transform .2s var(--ease);box-shadow:3px 3px 0 var(--ink)}
.chpick label:has(input:checked){background:color-mix(in srgb,var(--cc) 45%,var(--surface))}
.chpick input{accent-color:var(--ink)}
.counters{display:flex;gap:10px;flex-wrap:wrap;font-size:.74rem;font-weight:800;color:var(--muted)}
.counters span.over{color:var(--bad)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.media button{position:relative;aspect-ratio:1;border:var(--bw) solid var(--ink);border-radius:12px;overflow:hidden;transition:transform .25s var(--ease)}
.media button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px;transform:rotate(-3deg)}
.media button .art{border-radius:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{font-size:.76rem;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1.5px dashed var(--ink)}
.comp-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.comp-foot .field{flex:1 1 140px}
/* signature: fanned stack of channel previews */
.stage{position:sticky;top:90px}
.ptabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ptabs button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-weight:800;font-size:.8rem;border:var(--bw) solid transparent}
.ptabs button[aria-selected="true"]{border-color:var(--ink);background:var(--surface);box-shadow:3px 3px 0 var(--ink)}
.ptabs button:disabled{opacity:.4}
.stack{position:relative;height:520px;perspective:1200px}
.pv{position:absolute;left:50%;top:0;width:300px;margin-left:-150px;background:var(--surface);border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:var(--sh);overflow:hidden;transition:transform .7s var(--ease),opacity .4s,filter .4s;transform-origin:50% 100%;cursor:pointer;font-size:.8rem}
.pv[data-pos="0"]{z-index:4;transform:none;cursor:default}
.pv[data-pos="1"]{z-index:3;transform:translate(70px,18px) rotate(7deg) scale(.94)}
.pv[data-pos="2"]{z-index:2;transform:translate(-70px,22px) rotate(-7deg) scale(.9)}
.pv[data-pos="3"]{z-index:1;transform:translate(0,40px) rotate(2deg) scale(.86)}
.pv.off{filter:grayscale(1);opacity:.45}
.pv-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:800}
.pv-h .av{width:28px;height:28px;font-size:.62rem}
.pv-h small{display:block;font-weight:600;color:var(--muted);font-size:.7rem}
.pv-m{position:relative;aspect-ratio:1;border-top:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);overflow:hidden}
.pv-m .art{border-radius:0}
.pv-a{display:flex;gap:12px;padding:8px 12px}
.pv-t{padding:0 12px 12px;line-height:1.4;overflow-wrap:anywhere}
.pv-t .clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pv.tt .pv-m{aspect-ratio:9/14;border:0}
.pv.tt .ovl-t{position:absolute;left:10px;right:52px;bottom:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:700;line-height:1.35}
.pv.tt .ovl-t .clip{-webkit-line-clamp:4}
.pv.tt .side-i{position:absolute;right:10px;bottom:16px;display:grid;gap:12px;color:#fff;justify-items:center;font-size:.66rem;font-weight:800}
.pv.tt .side-i .i{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pv.yt .pv-m{aspect-ratio:16/9;border-top:0}
.pv.yt .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.68rem;font-weight:800;padding:1px 5px;border-radius:4px}
.pv.yt .yt-b{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px 14px}
.pv.yt .yt-b b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.pv.fb .pv-m{aspect-ratio:1.91/1}
.pv.fb .fb-r{display:flex;justify-content:space-between;padding:8px 12px;color:var(--muted);font-weight:700;font-size:.72rem}
.pv .warn-m{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(22,20,20,.72);color:#fff;font-weight:800}
/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head span{font-size:.72rem;font-weight:900;text-transform:uppercase;padding:2px 6px}
.day{min-height:104px;border:var(--bw) solid var(--ink);border-radius:12px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:background-color .2s,transform .2s var(--ease)}
.day.out{background:var(--surface-2);opacity:.6}
.day.today{background:color-mix(in srgb,var(--lemon) 35%,var(--surface))}
.day.past{background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.day .dn{font-size:.76rem;font-weight:900}
.day.drop-over{transform:scale(1.03);outline:none;background:color-mix(in srgb,var(--c2) 30%,var(--surface))}
.pc{display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:8px;font-size:.7rem;font-weight:800;background:color-mix(in srgb,var(--cc) 30%,var(--surface));border:1.5px solid var(--ink);cursor:grab;touch-action:none;user-select:none;min-width:0;transition:transform .2s var(--ease)}
.pc:hover{transform:rotate(-2deg) scale(1.03)}
.pc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc em{font-style:normal;opacity:.75;flex:none}
.pc.pub{cursor:default;opacity:.75}
.pc.fail{background:var(--bad-bg)}
.tray{display:grid;gap:8px;min-height:160px;padding:10px;border:var(--bw) dashed var(--ink);border-radius:14px;background:var(--surface-2)}
.tray .pc{padding:8px;font-size:.78rem}
.tray.drop-over{background:color-mix(in srgb,var(--c2) 30%,var(--surface))}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;font-weight:800;margin-top:12px}
/* channels page */
.heatw{overflow-x:auto}
.audience{display:grid;gap:10px}
/* inbox */
.inbox{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
.msgs{display:grid;gap:8px;max-height:620px;overflow:auto;padding:4px 8px 8px 2px}
.msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;text-align:left;padding:10px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--surface);transition:transform .25s var(--ease),box-shadow .25s;width:100%;animation:msgIn .5s var(--ease)}
.msg:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.msg[aria-current="true"]{background:color-mix(in srgb,var(--lemon) 40%,var(--surface));box-shadow:3px 3px 0 var(--ink)}
.msg.done{opacity:.6}
.msg b{font-size:.86rem}
.msg p{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .row{justify-content:space-between;gap:6px}
.msg .new{width:9px;height:9px;border-radius:50%;background:var(--c6);border:1.5px solid var(--ink);flex:none}
@keyframes msgIn{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.thread{display:grid;gap:12px}
.bub{max-width:85%;padding:10px 12px;border:var(--bw) solid var(--ink);border-radius:14px 14px 14px 4px;background:var(--surface-2);font-size:.88rem}
.bub.me{justify-self:end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--c1) 30%,var(--surface))}
.bub small{display:block;color:var(--muted);font-size:.7rem;margin-top:4px;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:.76rem;font-weight:800;padding:4px 9px;border-radius:99px;border:1.5px solid var(--ink);background:var(--surface)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.form-grid{display:grid;gap:12px}
@keyframes rise{0%{opacity:0;transform:translateY(24px) rotate(-1.5deg) scale(.96)}70%{transform:translateY(-3px) rotate(.4deg)}}
/* ---------- responsive ---------- */
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-ov,.comp,.cal-wrap,.inbox{grid-template-columns:minmax(0,1fr)}.stage{position:static}}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:262px;transform:translateX(-110%);transition:transform .4s var(--ease2)}body.nav-open .side{transform:none}.scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(22,20,20,.45);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top{padding:10px 14px}.view{padding:16px 14px 40px}}
@media (max-width:640px){.g-2{grid-template-columns:minmax(0,1fr)}.day{min-height:64px;padding:3px}.pc span,.pc em{display:none}.pc{justify-content:center;padding:4px 2px}.cal-head span{font-size:.6rem;padding:2px}.toppost{grid-template-columns:80px minmax(0,1fr)}.toppost .thumb{width:80px;height:80px}.pv{width:260px;margin-left:-130px}.pv[data-pos="1"]{transform:translate(30px,18px) rotate(6deg) scale(.94)}.pv[data-pos="2"]{transform:translate(-30px,22px) rotate(-6deg) scale(.9)}.stack{height:480px}.top .btn span{display:none}}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><g stroke="var(--ink)" stroke-width="2"><rect class="q q1" x="3" y="3" width="16" height="16" rx="5" fill="var(--c1)"/><rect class="q q2" x="21" y="3" width="16" height="16" rx="8" fill="var(--c2)"/><rect class="q q3" x="3" y="21" width="16" height="16" rx="8" fill="var(--c3)"/><rect class="q q4" x="21" y="21" width="16" height="16" rx="5" fill="var(--c4)"/></g></svg><span>Fourcast</span></div>
    <nav id="nav" data-marker="y"><span class="nav-marker" aria-hidden="true"></span></nav>
    <div class="side-cta"><div class="ch-on" id="ch-on"></div></div>
  </aside>
  <div class="scrim" data-act="menu" aria-hidden="true"></div>
  <div class="main">
    <header class="top">
      <button type="button" class="ibtn menu-btn" data-act="menu" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h2 id="biz-name">Gulab Bakes</h2>
      <div class="grow"></div>
      <button type="button" class="btn primary" data-act="compose"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Create post</span></button>
      <button type="button" class="ibtn" data-act="cmdk" aria-label="Search (Ctrl K)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg></button>
      <button type="button" class="ibtn" data-act="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      <button type="button" class="ibtn" data-act="theme" aria-label="Toggle theme"></button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
/* =====================================================================
   Core kit: helpers, router, charts and UI pieces used by this app.
   Plain JS, no libraries. The app code further down builds on it.
   ===================================================================== */
'use strict';

/* ---------- small DOM and math helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const avg = a => (a.length ? sum(a) / a.length : 0);
const lerp = (a, b, t) => a + (b - a) * t;
const f1 = v => Math.round(v * 10) / 10;
let _uid = 0;
const uid = (p = 'u') => p + (++_uid).toString(36) + Math.random().toString(36).slice(2, 5);
const clone = o => JSON.parse(JSON.stringify(o));
const motionQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
let RM = !!motionQ.matches; // reduced motion: skip big movement
if (motionQ.addEventListener) motionQ.addEventListener('change', e => { RM = e.matches; });

/* ---------- seeded random numbers, so demo data is the same every visit ---------- */

  drawer({
    title: p.status === 'Published' ? 'Post stats' : 'Post', kicker: `${p.status} · ${when(p)}`,
    body: `<div class="toppost">${thumb(p.media)}<div><p style="font-weight:700">${esc(p.text)}</p><div style="margin-top:8px">${tags(p.chans)}</div></div></div>${has ? `<div><b>Views by channel</b><div id="pd-chart"></div></div><table class="tbl"><thead><tr><th>Channel</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Comments</th><th class="num">Shares</th></tr></thead><tbody>${Object.entries(p.stats).map(([c, s]) => `<tr><td>${tag(c)} ${chBy(c).name}</td><td class="num">${num(s.views)}</td><td class="num">${num(s.likes)}</td><td class="num">${num(s.comments)}</td><td class="num">${num(s.shares)}</td></tr>`).join('')}</tbody></table>${p.boost ? `<p class="muted">Boosted with ${money(p.boost)}</p>` : ''}` : `<div class="empty">${ic('clock')}<p>${p.status === 'Failed' ? 'This post failed to send. Retry it below.' : 'Stats appear after the post goes live.'}</p></div>`}`,
    foot: `<button type="button" class="btn danger" data-act="postDel" data-id="${p.id}">${ic('trash')}Delete</button><div class="grow"></div>${p.status === 'Failed' ? `<button type="button" class="btn primary" data-act="postRetry" data-id="${p.id}">${ic('refresh')}Retry</button>` : p.status !== 'Published' ? `<a class="btn primary" href="#/compose/${p.id}">${ic('edit')}Edit</a>` : `<button type="button" class="btn primary" data-act="boost" data-id="${p.id}">${ic('zap')}Boost</button>`}`,
    mount: w => { const el = $('#pd-chart', w); if (el) plot(el, 'bar', { labels: Object.keys(p.stats).map(c => chBy(c).name), series: [{ name: 'Views', data: Object.values(p.stats).map(s => s.views) }], colorAt: i => chBy(Object.keys(p.stats)[i]).color, h: 170, fmt: 'num' }); }
  });
}
ACT.postOpen = b => postDrawer(postBy(b.dataset.id));
ACT.postDel = b => { const p = postBy(b.dataset.id); if (p) delPost(p); };
ACT.postRetry = b => { const p = postBy(b.dataset.id); if (p) retry(p); };
ACT.boost = b => { const p = postBy(b.dataset.id); if (!p) return; closeLayers(); modal({ title: 'Boost this post', ok: 'Start boost', body: `<p class="m-text">Show it to more people near ${esc(DB.profile.city)} for a few days.</p><div class="grid2">${field('Budget (Rs)', 'amt', { type: 'number', value: 5000, min: 500, step: 500 })}${field('Days', 'days', { type: 'number', value: 3, min: 1, max: 30 })}</div>`, onOk: f => { if (!validate(f, { amt: V.num(500, 500000), days: V.num(1, 30) })) return false; const d = formData(f); p.boost = (p.boost || 0) + +d.amt; save(); toast(`Boost of ${money(+d.amt)} started for ${d.days} days`); note('A boost started', 'zap'); } }); };
ACT.exportPosts = () => download('fourcast-posts.csv', csv([['Caption', 'Channels', 'Status', 'Date', 'Time', 'Views', 'Engagement %'], ...DB.posts.map(p => [p.text, p.chans.map(c => chBy(c).name).join(' '), p.status, p.date || '', p.time, views(p), er(p).toFixed(2)])]));

/* ---------- per-channel stats ---------- */
SEG.ch = v => { location.hash = '#/channels/' + v; };
SEG.chRange = v => { UI.chRange = +v; refresh(); };
page('channels', {
  title: 'Channels', icon: 'bars',
  html: params => { if (params[0] && CH.some(c => c.id === params[0])) UI.ch = params[0]; const c = chBy(UI.ch); return `
  <div class="ph rise"><div><h1>${c.name}</h1><p>${DB.conn[c.id] ? 'Connected as ' + esc(DB.profile.handle) : 'Not connected. Turn it on in Settings.'}</p></div><div class="ph-act">${seg('ch', CH.map(x => [x.id, x.short]), UI.ch, 'Channel')}${seg('chRange', [['7', '7D'], ['30', '30D'], ['90', '90D']], UI.chRange, 'Range')}</div></div>
  <section class="kpis">${[['k-fol', 'Followers', 'users'], ['k-gain', 'New followers', 'up'], ['k-views', 'Views', 'eye'], ['k-er', 'Engagement rate', 'heart']].map(([id, l, i]) => `<article class="card chcard rise" style="--cc:${c.color}"><div class="row"><small>${l}</small>${ic(i)}</div><b class="big" id="${id}">0</b><small id="${id}-f"></small></article>`).join('')}</section>
  <section class="g-2">
    <article class="card rise"><div class="card-h"><h2>Followers</h2></div><div id="c-fol"></div></article>
    <article class="card rise"><div class="card-h"><h2>Daily views</h2></div><div id="c-views"></div></article>
  </section>
  <section class="g-2">
    <article class="card rise"><div class="card-h"><h2>Best time to post</h2><small class="muted">darker = more engagement</small></div><div class="heatw" id="c-heat"></div></article>
    <article class="card rise"><div class="card-h"><h2>Top posts here</h2></div><div class="uplist" id="c-top"></div></article>
  </section>`; },
  fill: () => {
    const c = chBy(UI.ch), n = UI.chRange, s = chStats(c.id, n), prev = chStats(c.id, Math.min(90, n * 2));
    setNum('#k-fol', s.followers); $('#k-fol-f').textContent = `${DB.conn[c.id] ? 'live count' : 'last synced'}`;
    setNum('#k-gain', s.gained); $('#k-gain-f').textContent = `in ${n} days`;
    setNum('#k-views', s.views, 'short'); $('#k-views-f').textContent = `${s.posts} posts`;
    setNum('#k-er', s.er, 'pct'); $('#k-er-f').innerHTML = prev.er ? delta(((s.er - prev.er) / prev.er) * 100) : '';
    plot('#c-fol', 'line', { labels: dayLabels(n), series: [{ name: 'Followers', data: s.series, color: c.color }], area: true, min0: false, fmt: 'num', h: 220 });
    plot('#c-views', 'bar', { labels: dayLabels(n), series: [{ name: 'Views', data: dailyViews(c.id, n), color: c.color }], fmt: 'num', h: 220 });
    const hours = [8, 10, 12, 14, 16, 18, 20, 22], ci = CH.indexOf(c), peak = [13, 20, 18, 12][ci];
    plot('#c-heat', 'heat', { rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], cols: hours.map(h => (h > 12 ? h - 12 + 'pm' : h + (h === 12 ? 'pm' : 'am'))), data: Array.from({ length: 7 }, (_, d) => hours.map(h => Math.round(30 + 60 * Math.exp(-Math.pow((h - peak) / 3.2, 2)) + (d >= 4 ? 14 : 0) + 10 * Math.abs(Math.sin(d * 3.1 + h + ci))))), fmt: v => num(v), max: 110, color: c.color, lw: 44, ch: 30, rx: 8, valueLabel: 'Engagement score' });
    const top = s.list.sort((a, b) => b.stats[c.id].views - a.stats[c.id].views).slice(0, 4);
    $('#c-top').innerHTML = top.length ? top.map(p => `<button type="button" class="up" data-act="postOpen" data-id="${p.id}">${thumb(p.media)}<span><b>${esc(p.text)}</b><small>${dd(p.date)} · ${pct(((p.stats[c.id].likes + p.stats[c.id].comments + p.stats[c.id].shares) / (p.stats[c.id].views || 1)) * 100)} engagement</small></span><b>${short(p.stats[c.id].views)}</b></button>`).join('') : `<div class="empty">${ic('image')}<p>No posts on ${c.name} in this range</p></div>`;
  }
});

/* ---------- inbox: comments and messages, with live arrivals ---------- */
page('inbox', {
  title: 'Inbox', icon: 'inbox', count: () => DB.inbox.filter(m => !m.done).length,
  html: () => `
  <div class="ph rise"><div><h1>Inbox</h1><p>Comments and messages from all four channels.</p></div><div class="ph-act"><button type="button" class="btn" data-act="allDone">${ic('check')}Mark all done</button></div></div>
  <div class="chips rise" role="group" aria-label="Filter inbox">${['All', 'Open', ...CH.map(c => c.name)].map(v => `<button type="button" class="chip" data-act="mf" data-v="${v}" aria-pressed="${UI.mf === v}">${v}</button>`).join('')}</div>
  <section class="inbox"><div class="msgs" id="msgs" aria-live="polite"></div><article class="card rise" id="thread"></article></section>`,
  fill: () => { drawMsgs(); drawThread(); }
});
function drawMsgs() {
  const el = $('#msgs'); if (!el) return;
  const list = DB.inbox.filter(m => UI.mf === 'All' || (UI.mf === 'Open' ? !m.done : chBy(m.ch).name === UI.mf));
  el.innerHTML = list.length ? list.map(m => `<button type="button" class="msg${m.done ? ' done' : ''}" data-act="msgOpen" data-id="${m.id}" aria-current="${UI.msg === m.id}">${avatar(m.from)}<span><span class="row"><b>${esc(m.from)}</b><span class="row" style="gap:6px">${m.done ? '' : '<i class="new" aria-label="Open"></i>'}${tag(m.ch)}</span></span><p>${esc(m.text)}</p><small class="muted">${m.type} · ${ago(m.mins)}</small></span></button>`).join('') : `<div class="empty">${ic('inbox')}<p>Inbox zero. Nice.</p></div>`;
}
function drawThread() {
  const el = $('#thread'); if (!el) return;
  const m = DB.inbox.find(x => x.id === UI.msg) || DB.inbox.find(x => !x.done) || DB.inbox[0];
  if (!m) { el.innerHTML = `<div class="empty">${ic('msg')}<p>No conversations yet</p></div>`; return; }
  UI.msg = m.id;
  el.innerHTML = `<div class="card-h"><div class="who">${avatar(m.from)}<span><b>${esc(m.from)}</b><small>${m.type} on ${chBy(m.ch).name} · ${ago(m.mins)}</small></span></div><div class="row">${m.done ? '<span class="badge ok">Done</span>' : `<button type="button" class="btn sm" data-act="msgDone" data-id="${m.id}">${ic('check')}Done</button>`}</div></div>
  <div class="thread"><div class="bub">${esc(m.text)}<small>${ago(m.mins)}</small></div>${m.replies.map(r => `<div class="bub me">${esc(r)}<small>You · just now</small></div>`).join('')}</div>
  <form id="reply" class="form-grid" novalidate style="margin-top:14px"><div class="quick">${['Thank you so much!', 'We deliver across Lahore, order on our page.', 'Sent you a message with details.', 'Sorry about that, we are on it.'].map(q => `<button type="button" data-act="quick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>${field('Your reply', 'reply', { type: 'textarea', rows: 2, ph: `Reply on ${chBy(m.ch).name}…` })}<div class="row"><div class="grow"></div><button type="submit" class="btn primary">${ic('send')}Send reply</button></div></form>`;
  $('#reply').addEventListener('submit', e => { e.preventDefault(); const f = e.target; if (!validate(f, { reply: V.min(2) })) return; m.replies.push(f.elements.reply.value.trim()); m.done = true; save(); drawMsgs(); drawThread(); navCounts(); toast(`Reply sent on ${chBy(m.ch).name}`); });
}
ACT.msgOpen = b => { UI.msg = b.dataset.id; $$('.msg').forEach(x => x.setAttribute('aria-current', String(x === b))); drawThread(); if (innerWidth < 1150) $('#thread').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); };
ACT.msgDone = b => { const m = DB.inbox.find(x => x.id === b.dataset.id); if (!m) return; m.done = true; save(); drawMsgs(); drawThread(); navCounts(); toast('Marked as done'); };
ACT.quick = b => { const t = $('#reply').elements.reply; t.value = b.dataset.v; t.focus(); };
ACT.mf = b => { UI.mf = b.dataset.v; $$('[data-act="mf"]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawMsgs(); };
ACT.allDone = () => { DB.inbox.forEach(m => { m.done = true; }); save(); drawMsgs(); drawThread(); navCounts(); toast('Everything marked as done'); };
function liveMessage() {
  const who = ['zara.bakes', 'fatima_f', 'kamran.k', 'rabia.r', 'tariq_eats'], texts = ['Are you open on Sunday?', 'Just tried the rose donut, wow.', 'Can I get this delivered to Johar Town?', 'Do you take bulk orders for an office party?'];
  const live = CH.filter(c => DB.conn[c.id]); if (!live.length) return;
  const m = { id: uid('m'), ch: live[Math.floor(Math.random() * live.length)].id, from: who[Math.floor(Math.random() * who.length)], text: texts[Math.floor(Math.random() * texts.length)], type: Math.random() < 0.5 ? 'Comment' : 'Message', mins: 0, done: false, replies: [] };
  DB.inbox.unshift(m); if (DB.inbox.length > 60) DB.inbox.pop();
  DB.inbox.forEach(x => { if (x !== m) x.mins += 0.25; });
  navCounts(); note(`New ${m.type.toLowerCase()} from ${m.from} on ${chBy(m.ch).name}`, 'msg');
  if (APP.cur === 'inbox') drawMsgs();
}

/* ---------- settings ---------- */
page('settings', {
  title: 'Settings', icon: 'cog',
  html: () => `
  <div class="ph rise"><div><h1>Settings</h1><p>Your brand, your channels, your defaults.</p></div></div>
  <section class="g-2">
    <article class="card rise"><div class="card-h"><h2>Brand</h2></div><form id="brand" class="form-grid" novalidate>${field('Business name', 'name', { value: DB.profile.name })}<div class="grid2">${field('Handle', 'handle', { value: DB.profile.handle })}${field('City', 'city', { type: 'select', value: DB.profile.city, opts: CITIES })}</div>${field('Default posting time', 'time', { type: 'time', value: DB.profile.time })}<div><button type="submit" class="btn primary">${ic('check')}Save</button></div></form></article>
    <article class="card rise"><div class="card-h"><h2>Connected channels</h2></div>${CH.map(c => `<div class="set-row"><span class="row">${tag(c.id)}<span><b>${c.name}</b><small>${DB.conn[c.id] ? 'Posting and stats are on' : 'Disconnected'}</small></span></span><label class="switch"><input type="checkbox" data-conn="${c.id}"${DB.conn[c.id] ? ' checked' : ''} aria-label="Connect ${c.name}"><span></span></label></div>`).join('')}
      <div class="set-row"><span><b>Theme</b><small>Daylight or midnight blocks</small></span><button type="button" class="btn" data-act="theme" data-label="1">Theme</button></div>
      <div class="set-row"><span><b>Demo data</b><small>Bring back the sample bakery</small></span><button type="button" class="btn danger" data-act="reset">${ic('refresh')}Reset demo data</button></div></article>
  </section>`,
  fill: () => {
    const f = $('#brand'); if (f._on) return; f._on = 1;
    f.addEventListener('submit', e => { e.preventDefault(); if (!validate(f, { name: V.min(2), handle: v => (/^@[a-z0-9_.]{2,30}$/i.test(v) ? '' : 'Start with @ and use letters, numbers, dots or _') })) return; Object.assign(DB.profile, formData(f)); save(); sideConn(); toast('Brand saved'); });
    $$('[data-conn]').forEach(c => c.addEventListener('change', async () => {
      const id = c.dataset.conn;
      if (!c.checked && !(await confirmBox(`Disconnect ${chBy(id).name}?`, 'Scheduled posts for this channel will wait until you reconnect.', 'Disconnect'))) { c.checked = true; return; }
      DB.conn[id] = c.checked; save(); sideConn(); refresh(); toast(`${chBy(id).name} ${c.checked ? 'connected' : 'disconnected'}`);
    }));
  }
});

/* ---------- start ---------- */
APP.cmds = [{ label: 'Create post', icon: 'edit', fn: () => ACT.compose() }, { label: 'Export posts CSV', icon: 'download', fn: () => ACT.exportPosts() }, ...CH.map(c => ({ label: `${c.name} stats`, icon: 'bars', fn: () => { location.hash = '#/channels/' + c.id; } })), { label: 'Switch theme', icon: 'moon', fn: () => ACT.theme() }];
APP.onRoute = () => sideConn();
$('#nav').insertAdjacentHTML('beforeend', navLinks());
note('Your rose donut reel passed 20K views on TikTok', 'star', 50);
note('A scheduled post failed on Facebook', 'alert', 300);
note('Weekly report is ready', 'file', 60 * 30, true);
every(11000, liveMessage);
startApp();
</script>
</body>
</html>
