<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ping Scope · city search with a radar</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: phosphor green on a dark scope (dark), deep teal on mint glass (light) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #e3f1ea;
    --bg2: #f4fbf7;
    --card: #fbfffd;
    --ink: #0f2a22;
    --muted: #5a7a6e;
    --line: #d6e8df;
    --scope: #eaf7f0;
    --scope2: #d4efe2;
    --grid: rgba(10, 120, 85, .2);
    --ph: #0a8f63;
    --ph2: #13c08a;
    --hub: #e26a2c;
    --mark: rgba(19, 192, 138, .22);
    --shadow: rgba(10, 70, 50, .2);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #040b10;
    --bg2: #0a1820;
    --card: #0b161d;
    --ink: #dff9ec;
    --muted: #7fa79a;
    --line: #17303a;
    --scope: #06201a;
    --scope2: #03110e;
    --grid: rgba(93, 255, 156, .16);
    --ph: #5dff9c;
    --ph2: #b7ffd3;
    --hub: #ffab5c;
    --mark: rgba(93, 255, 156, .2);
    --shadow: rgba(0, 0, 0, .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    overflow-x: hidden;
  }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 16px 14px;
    background:
      repeating-radial-gradient(circle at 50% 40%, transparent 0 46px, color-mix(in srgb, var(--ph) 7%, transparent) 46px 47px),
      radial-gradient(80% 70% at 50% 40%, var(--bg2), var(--bg));
  }
  .card {
    width: min(100%, 420px);
    padding: 16px 16px 14px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px var(--shadow), 0 6px 14px -10px var(--shadow);
  }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: clamp(18px, 5vw, 21px); letter-spacing: -.01em; }
  .live { display: inline-flex; align-items: center; gap: 6px; font: 700 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ph); letter-spacing: .1em; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ph); box-shadow: 0 0 8px var(--ph); animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- The scope ---------- */
  .scope {
    position: relative;
    width: min(100%, 258px);
    aspect-ratio: 1;
    margin: 8px auto 10px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--scope), var(--scope2));
    box-shadow: inset 0 0 0 2px var(--line), inset 0 0 30px -6px color-mix(in srgb, var(--ph) 35%, transparent), 0 14px 30px -18px var(--shadow);
    overflow: hidden;
  }
  .scope.lockon { animation: zoom .6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes zoom { 30% { transform: scale(1.04); } }
  .scope.static { animation: fuzz .5s steps(4) 2; }
  @keyframes fuzz { 25% { filter: contrast(1.5) brightness(1.2); transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 280deg, color-mix(in srgb, var(--ph) 10%, transparent) 300deg, color-mix(in srgb, var(--ph) 45%, transparent) 359deg, transparent 360deg);
  }
  .scope svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .rings circle { fill: none; stroke: var(--grid); stroke-width: .6; }
  .rings line { stroke: var(--grid); stroke-width: .5; }
  .blip circle.dot { fill: var(--ph); transition: opacity .35s; }
  .blip.dim circle.dot { opacity: .22; }
  .blip circle.ping { fill: none; stroke: var(--ph); stroke-width: .8; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
  .blip.match circle.ping { animation: ping 1.6s ease-out infinite; animation-delay: var(--dl, 0s); }
  @keyframes ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(4); } }
  .blip text { font: 600 7.4px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); opacity: 0; transition: opacity .3s; paint-order: stroke; stroke: var(--scope); stroke-width: 2px; }
  .blip.named text { opacity: .55; }
  .blip.match text { opacity: .95; }
  .blip.hub circle.dot { fill: var(--hub); }
  .lock { opacity: 0; transition: opacity .2s; }
  .lock.on { opacity: 1; }
  .lock g { transform-box: fill-box; transform-origin: 50% 50%; }
  .lock.on g { animation: lockin .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes lockin { from { transform: scale(2.6) rotate(90deg); opacity: 0; } }
  .lock path { fill: none; stroke: var(--hub); stroke-width: 1.4; stroke-linecap: round; }
  .route { fill: none; stroke: var(--hub); stroke-width: 1.1; stroke-dasharray: 3 2.5; opacity: .9; }
  .parcel { fill: var(--hub); }
  .readout {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    font: 700 9.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .12em;
    color: var(--ph);
    white-space: nowrap;
    text-shadow: 0 0 6px color-mix(in srgb, var(--ph) 60%, transparent);
  }

  /* ---------- Search ---------- */
  .search { position: relative; }
  .field {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 48px;
    padding: 0 8px 0 14px;
    border-radius: 16px;
    border: 1.5px solid var(--line);
    background: var(--scope);
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within { border-color: var(--ph); box-shadow: 0 0 0 4px var(--mark); }
  .field svg { flex: none; width: 19px; height: 19px; color: var(--ph); }
  .field.typing svg { animation: wob .35s ease; }
  @keyframes wob { 50% { transform: rotate(-14deg) scale(1.1); } }
  .field input { flex: 1; width: 0; min-width: 0; height: 100%; border: 0; outline: none; background: none; color: var(--ink); font: 600 16px/1 var(--ff); }
  .field input::placeholder { color: var(--muted); font-weight: 500; }
  .clear {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 10px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    opacity: 0;
    transform: scale(.5);
    transition: opacity .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .clear.on { opacity: 1; transform: none; }
  .clear svg { width: 14px; height: 14px; color: currentColor; }
  .below { position: relative; height: 188px; margin-top: 8px; }
  .list { margin: 0; padding: 0; list-style: none; }
  .opt {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 10px;
    border-radius: 13px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    animation: optIn .38s cubic-bezier(.34, 1.4, .64, 1) forwards;
    animation-delay: calc(var(--i) * 45ms);
    transition: background .2s;
  }
  @keyframes optIn { to { opacity: 1; transform: none; } }
  .opt[aria-selected="true"] { background: var(--mark); }
  .opt .pip { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--grid); }
  .opt .pip::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ph); }
  .opt[aria-selected="true"] .pip { border-color: var(--ph); }
  .opt b { font-size: 14.5px; font-weight: 600; }
  .opt mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 1px; font-weight: 800; }
  .opt small { display: block; font-size: 11.5px; color: var(--muted); }
  .opt .eta { font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ph); white-space: nowrap; }
  .empty { margin: 0; padding: 14px 12px; font-size: 13.5px; line-height: 1.5; color: var(--muted); text-align: center; }
  .empty button { padding: 2px 6px; border: 0; border-radius: 6px; background: var(--mark); color: var(--ink); font: 600 13px/1.4 var(--ff); cursor: pointer; }
  .result {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: start;
    gap: 10px;
    padding: 14px;
    border-radius: 18px;
    background: linear-gradient(150deg, color-mix(in srgb, var(--ph) 14%, var(--card)), var(--card) 70%);
    border: 1.5px solid color-mix(in srgb, var(--ph) 40%, var(--line));
    opacity: 0;
    transform: translateY(16px) scale(.97);
    pointer-events: none;
    transition: opacity .3s, transform .5s cubic-bezier(.34, 1.4, .64, 1);
  }
  .result.on { opacity: 1; transform: none; pointer-events: auto; }
  .result .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .result h2 { margin: 0; font-size: 20px; }
  .result .prov { font-size: 12.5px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .facts div { padding: 9px 10px; border-radius: 12px; background: var(--scope); border: 1px solid var(--line); }
  .facts small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .facts b { display: block; margin-top: 3px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .result p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .again { justify-self: start; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--scope); color: var(--ink); font: 600 13px/1 var(--ff); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ph); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <header class="head">
      <h1 id="title">Do we deliver to you?</h1>
      <span class="live" aria-hidden="true"><i></i>SCANNING</span>
    </header>

    <div class="scope" id="scope" aria-hidden="true">
      <div class="sweep" id="sweep"></div>
      <svg viewBox="-100 -100 200 200">
        <g class="rings">
          <circle r="24"/><circle r="48"/><circle r="72"/><circle r="96"/>
          <line x1="-100" y1="0" x2="100" y2="0"/><line x1="0" y1="-100" x2="0" y2="100"/>
        </g>
        <path class="route" id="route" d=""/>
        <circle class="parcel" id="parcel" r="2.4" cx="-999" cy="-999"/>
        <g id="blips"></g>
        <g class="lock" id="lock" transform="translate(0 0)"><g>
          <path d="M-10 -5 V-10 H-5"/><path d="M5 -10 H10 V-5"/><path d="M10 5 V10 H5"/><path d="M-5 10 H-10 V5"/>
        </g></g>
      </svg>
      <span class="readout" id="readout">26 CITIES IN RANGE</span>
    </div>

    <div class="search">
      <label class="sr" for="q">Search your city</label>
      <div class="field" id="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="list" autocomplete="off" spellcheck="false" placeholder="Type your city, e.g. Multan">
        <button class="clear" id="clear" type="button" aria-label="Clear search" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="below">
        <ul class="list" id="list" role="listbox" aria-label="Matching cities"></ul>
        <p class="empty" id="empty"></p>
        <div class="result" id="result" aria-hidden="true">
          <div class="top"><h2 id="rCity">City</h2><span class="prov" id="rProv"></span></div>
          <div class="facts">
            <div><small>Arrives in</small><b id="rDays">1 day</b></div>
            <div><small>Per parcel</small><b id="rFee">PKR 0</b></div>
            <div><small>From hub</small><b id="rKm">0 km</b></div>
          </div>
          <p id="rNote">Cash on delivery available.</p>
          <button class="again" id="again" type="button">Check another city</button>
        </div>
      </div>
    </div>
    <p class="sr" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var NS = "http://www.w3.org/2000/svg";

  // ---------- Cities we deliver to: [name, province, latitude, longitude, days, fee in PKR] ----------
  var CITIES = [
    ["Lahore", "Punjab", 31.52, 74.36, 0, 150], ["Karachi", "Sindh", 24.86, 67.01, 1, 180], ["Islamabad", "Capital", 33.68, 73.05, 1, 180],
    ["Faisalabad", "Punjab", 31.42, 73.08, 1, 160], ["Multan", "Punjab", 30.16, 71.52, 1, 170], ["Peshawar", "Khyber Pakhtunkhwa", 34.01, 71.58, 2, 220],
    ["Quetta", "Balochistan", 30.18, 66.98, 3, 260], ["Hyderabad", "Sindh", 25.4, 68.37, 2, 200], ["Sukkur", "Sindh", 27.7, 68.86, 2, 210],
    ["Larkana", "Sindh", 27.56, 68.21, 3, 230], ["Bahawalpur", "Punjab", 29.4, 71.68, 2, 190], ["Sialkot", "Punjab", 32.49, 74.53, 1, 160],
    ["Gujranwala", "Punjab", 32.16, 74.19, 1, 160], ["Gilgit", "Gilgit-Baltistan", 35.92, 74.31, 4, 320], ["Skardu", "Gilgit-Baltistan", 35.3, 75.63, 5, 350],
    ["Muzaffarabad", "Azad Kashmir", 34.37, 73.47, 3, 260], ["Gwadar", "Balochistan", 25.12, 62.32, 4, 300], ["Turbat", "Balochistan", 26.0, 63.05, 5, 320],
    ["Dera Ismail Khan", "Khyber Pakhtunkhwa", 31.83, 70.9, 3, 240], ["Mingora", "Khyber Pakhtunkhwa", 34.77, 72.36, 3, 250], ["Chitral", "Khyber Pakhtunkhwa", 35.85, 71.79, 5, 340],
    ["Zhob", "Balochistan", 31.34, 69.45, 4, 290], ["Mardan", "Khyber Pakhtunkhwa", 34.2, 72.05, 2, 230], ["Sargodha", "Punjab", 32.08, 72.67, 2, 180],
    ["Rahim Yar Khan", "Punjab", 28.42, 70.3, 2, 200], ["Nawabshah", "Sindh", 26.24, 68.41, 2, 210]
  ];
  var LON0 = 69.2, LAT0 = 30.4, K = 10.3; // map centre and degrees-to-scope scale
  var cities = CITIES.map(function (c, i) {
    var x = (c[3] - LON0) * K, y = -(c[2] - LAT0) * K;
    return { i: i, name: c[0], prov: c[1], lat: c[2], lon: c[3], days: c[4], fee: c[5], x: x, y: y, ang: (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360, glow: 0 };
  });
  var hub = cities[0];
  function km(c) { // straight-line distance from the Lahore hub
    var r = Math.PI / 180, a = Math.sin((c.lat - hub.lat) * r / 2) ** 2 + Math.cos(hub.lat * r) * Math.cos(c.lat * r) * Math.sin((c.lon - hub.lon) * r / 2) ** 2;
    return Math.round(6371 * 2 * Math.asin(Math.sqrt(a)));
  }

  // ---------- Draw the blips ----------
  var blipsG = $("#blips");
  cities.forEach(function (c, i) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("class", "blip" + (i === 0 ? " hub" : "") + (i < 3 ? " named" : ""));
    var left = c.x > 40;
    g.innerHTML = '<circle class="ping" cx="' + c.x + '" cy="' + c.y + '" r="2.6"/><circle class="dot" cx="' + c.x + '" cy="' + c.y + '" r="2.6"/>' +
      '<text x="' + (c.x + (left ? -5 : 5)) + '" y="' + (c.y + 2.2) + '" text-anchor="' + (left ? "end" : "start") + '">' + c.name + "</text>";
    g.style.setProperty("--dl", (i % 5) * 0.2 + "s");
    blipsG.appendChild(g);
    c.g = g;
    c.dot = g.querySelector(".dot");
  });

  // ---------- Sweep: one clock turns the beam and lights the blips it passes ----------
  var sweep = $("#sweep"), scope = $("#scope"), sweepAng = 0, spinning = true, last = performance.now(), target = null;
  function frame(now) {
    var dt = Math.min(64, now - last);
    last = now;
    if (!reduceMq.matches) {
      if (spinning) sweepAng = (sweepAng + dt * 0.1) % 360;
      else if (target != null) { // swing the beam onto the locked city and hold it there
        var d = ((target - sweepAng + 540) % 360) - 180;
        sweepAng = (sweepAng + d * 0.12 + 360) % 360;
      }
      sweep.style.transform = "rotate(" + sweepAng.toFixed(1) + "deg)";
      cities.forEach(function (c) {
        var behind = (sweepAng - c.ang + 360) % 360;
        if (behind < 6) c.glow = 1;
        c.glow *= 0.965;
        c.dot.setAttribute("r", (2.6 + c.glow * 1.8).toFixed(2));
        c.dot.style.filter = c.glow > .05 ? "drop-shadow(0 0 " + (c.glow * 3).toFixed(1) + "px var(--ph))" : "";
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Search ----------
  var q = $("#q"), list = $("#list"), empty = $("#empty"), field = $("#field"), clearBtn = $("#clear"), result = $("#result"), status = $("#status"), readout = $("#readout");
  var matches = [], active = -1, locked = null;
  function esc(s) { return s.replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }
  function eta(c) { return c.days ? c.days + (c.days > 1 ? " days" : " day") : "Same day"; }
  function find(text) {
    var t = text.trim().toLowerCase();
    if (!t) return [];
    return cities.map(function (c) {
      var n = c.name.toLowerCase(), at = n.indexOf(t);
      if (at < 0) return null;
      var score = at === 0 ? 0 : n.charAt(at - 1) === " " ? 1 : 2;
      return { c: c, at: at, score: score };
    }).filter(Boolean).sort(function (a, b) { return a.score - b.score || a.c.name.localeCompare(b.c.name); }).slice(0, 4);
  }
  function update() {
    var text = q.value;
    clearBtn.classList.toggle("on", !!text);
    unlock();
    matches = find(text);
    active = matches.length ? 0 : -1;
    var set = new Set(matches.map(function (m) { return m.c; }));
    cities.forEach(function (c) {
      c.g.classList.toggle("match", set.has(c));
      c.g.classList.toggle("dim", !!text.trim() && !set.has(c));
    });
    list.innerHTML = matches.map(function (m, i) {
      var n = m.c.name, len = text.trim().length;
      var name = esc(n.slice(0, m.at)) + "<mark>" + esc(n.slice(m.at, m.at + len)) + "</mark>" + esc(n.slice(m.at + len));
      return '<li class="opt" role="option" id="o' + i + '" style="--i:' + i + '" aria-selected="' + (i === active) + '"><span class="pip" aria-hidden="true"></span><span><b>' + name + "</b><small>" + m.c.prov + '</small></span><span class="eta">' + eta(m.c) + "</span></li>";
    }).join("");
    q.setAttribute("aria-expanded", String(matches.length > 0));
    setActive(active);
    if (!text.trim()) {
      empty.innerHTML = 'Try <button type="button" data-try="Quetta">Quetta</button>, <button type="button" data-try="Gilgit">Gilgit</button> or <button type="button" data-try="Hyderabad">Hyderabad</button>';
      readout.textContent = cities.length + " CITIES IN RANGE";
      status.textContent = "";
    } else if (!matches.length) {
      empty.textContent = "No signal for “" + text.trim() + "” yet. We deliver to " + cities.length + " cities across Pakistan.";
      readout.textContent = "NO SIGNAL";
      scope.classList.remove("static"); void scope.offsetWidth; scope.classList.add("static");
      status.textContent = "No matching city.";
    } else {
      empty.textContent = "";
      readout.textContent = matches.length + (matches.length > 1 ? " CONTACTS" : " CONTACT");
      status.textContent = matches.length + (matches.length > 1 ? " cities match." : " city matches.");
    }
  }
  function setActive(i) {
    active = i;
    [].forEach.call(list.children, function (li, j) { li.setAttribute("aria-selected", String(j === i)); });
    if (i >= 0) q.setAttribute("aria-activedescendant", "o" + i); else q.removeAttribute("aria-activedescendant");
    cities.forEach(function (c) { c.g.style.opacity = ""; });
    if (i >= 0 && matches[i]) aim(matches[i].c, false);
  }

  // Aim the crosshair at a city (and on Enter: lock on, draw the route and show the result)
  var lock = $("#lock"), route = $("#route"), parcel = $("#parcel");
  function aim(c, hard) {
    lock.setAttribute("transform", "translate(" + c.x.toFixed(1) + " " + c.y.toFixed(1) + ")");
    lock.classList.remove("on"); void lock.getBoundingClientRect(); lock.classList.add("on");
    if (hard) { spinning = false; target = c.ang; }
  }
  var routeId = 0;
  function choose(c) {
    locked = c;
    q.value = c.name;
    clearBtn.classList.add("on");
    list.innerHTML = ""; empty.textContent = "";
    q.setAttribute("aria-expanded", "false");
    q.removeAttribute("aria-activedescendant");
    cities.forEach(function (o) { o.g.classList.toggle("match", o === c); o.g.classList.toggle("dim", o !== c && o !== hub); });
    aim(c, true);
    scope.classList.remove("lockon"); void scope.offsetWidth; scope.classList.add("lockon");
    readout.textContent = "LOCKED · " + c.name.toUpperCase();
    // route from the hub, drawn as a curve with a parcel riding it
    var mx = (hub.x + c.x) / 2 + (c.y - hub.y) * .25, my = (hub.y + c.y) / 2 - (c.x - hub.x) * .25;
    route.setAttribute("d", c === hub ? "" : "M" + hub.x + " " + hub.y + " Q" + mx.toFixed(1) + " " + my.toFixed(1) + " " + c.x + " " + c.y);
    var id = ++routeId, len = c === hub ? 0 : route.getTotalLength(), t0 = performance.now();
    (function ride(t) {
      if (id !== routeId || !len) { parcel.setAttribute("cx", -999); return; }
      var k = reduceMq.matches ? 1 : Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
      route.style.strokeDasharray = (len * e).toFixed(1) + " " + len;
      var p = route.getPointAtLength(len * e);
      parcel.setAttribute("cx", p.x); parcel.setAttribute("cy", p.y);
      if (k < 1) requestAnimationFrame(ride);
      else { route.style.strokeDasharray = ""; parcel.setAttribute("cx", -999); }
    })(t0);
    $("#rCity").textContent = c.name;
    $("#rProv").textContent = c.prov;
    $("#rDays").textContent = eta(c);
    $("#rFee").textContent = "PKR " + c.fee;
    $("#rKm").textContent = (c === hub ? 0 : km(c)) + " km";
    $("#rNote").textContent = c.days >= 4 ? "Mountain and long routes: cash on delivery up to PKR 10,000." : "Cash on delivery and same-week returns available.";
    result.classList.add("on");
    result.removeAttribute("aria-hidden");
    status.textContent = "Delivery to " + c.name + ": " + eta(c) + ", PKR " + c.fee + " per parcel.";
  }
  function unlock() {
    locked = null;
    spinning = true; target = null;
    routeId++;
    route.setAttribute("d", "");
    lock.classList.remove("on");
    result.classList.remove("on");
    result.setAttribute("aria-hidden", "true");
  }

  q.addEventListener("input", function () {
    field.classList.remove("typing"); void field.offsetWidth; field.classList.add("typing");
    update();
  });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!matches.length) return;
      e.preventDefault();
      setActive((active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (active >= 0 && matches[active]) choose(matches[active].c);
    } else if (e.key === "Escape") {
      q.value = ""; update();
    }
  });
  list.addEventListener("pointermove", function (e) { var li = e.target.closest(".opt"); if (li) { var i = +li.id.slice(1); if (i !== active) setActive(i); } });
  list.addEventListener("click", function (e) { var li = e.target.closest(".opt"); if (li) { choose(matches[+li.id.slice(1)].c); q.focus(); } });
  empty.addEventListener("click", function (e) { var b = e.target.closest("[data-try]"); if (b) { q.value = b.dataset.try; update(); q.focus(); } });
  clearBtn.addEventListener("click", function () { q.value = ""; update(); q.focus(); });
  $("#again").addEventListener("click", function () { q.value = ""; update(); q.focus(); });

  update();

  // ---------- Auto demo: plays on load and every few seconds until someone touches it ----------
  var demoOn = true;
  function stopDemo(e) { if (e.isTrusted) demoOn = false; }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function type(s) {
    q.value = ""; update();
    for (var i = 0; i < s.length; i++) { await pause(170); q.value += s[i]; q.dispatchEvent(new Event("input")); }
  }
  async function demo() {
    try {
      await pause(300);
      while (demoOn) {
        await type("mu"); await pause(700);
        setActive(1); await pause(600);
        setActive(0); await pause(500);
        choose(matches[0].c); await pause(2900);
        await type("gil"); await pause(700);
        choose(matches[0].c); await pause(2900);
        await type("xy"); await pause(1300);
        q.value = ""; update(); await pause(1500);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
