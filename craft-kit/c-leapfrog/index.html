<!doctype html>
<!-- Chill & Craft · Leapfrog · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leapfrog · hopping dot spinner</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #fff3ea;
    --card: #ffffff;
    --ink: #3b2420;
    --muted: #8a6a62;
    --line: #f3e1d6;
    --plate: #fff7f1;
    --coral: #ff5f4a;
    --peach: #ffc29a;
    --good: #12a36b;
    --shadow: rgba(160, 70, 40, .22);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #170e12;
    --card: #22151b;
    --ink: #fbe8e2;
    --muted: #c19c93;
    --line: #3a2630;
    --plate: #2b1b22;
    --coral: #ff7a66;
    --peach: #ffc7a3;
    --good: #3fe0a0;
    --shadow: rgba(0, 0, 0, .55);
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px 16px;
    color: var(--ink);
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--peach) 22%, var(--stage)), var(--stage) 65%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: min(100%, 380px);
    padding: 24px 20px 20px;
    border-radius: 30px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -34px var(--shadow);
    text-align: center;
  }

  /* ---------- The spinner ---------- */
  .stage {
    position: relative;
    width: clamp(156px, 48vw, 196px);
    aspect-ratio: 1;
    margin: 4px auto 14px;
    border-radius: 50%;
    background: var(--plate);
    box-shadow: inset 0 0 0 1px var(--line), inset 0 10px 24px -14px var(--shadow);
  }
  /* A soft glow that sweeps slowly round behind the dots (second layer of motion) */
  .halo {
    position: absolute;
    inset: 9%;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, color-mix(in srgb, var(--coral) 55%, transparent) 22%, transparent 48%);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%, #000 72%, transparent 73%);
    mask: radial-gradient(circle, transparent 60%, #000 61%, #000 72%, transparent 73%);
    opacity: .5;
    animation: sweep 2.4s linear infinite;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .stage.paused .halo { animation-play-state: paused; }
  .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--peach), var(--coral));
    transform: translate(-50%, -50%);
    opacity: .9;
  }
  .dot {
    --size: 18px;
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--size);
    height: var(--size);
    margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
    border-radius: 50%;
    background: color-mix(in srgb, var(--peach) calc(var(--mix) * 100%), var(--coral));
    box-shadow: 0 3px 6px -2px var(--shadow);
    transition: scale .45s cubic-bezier(.34, 1.56, .64, 1), opacity .3s, background .3s;
  }
  .puff {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    border: 2px solid var(--coral);
    pointer-events: none;
  }
  /* Done: a check mark springs out of the middle */
  .tick {
    position: absolute;
    inset: 26%;
    opacity: 0;
    transform: scale(.3) rotate(-30deg);
    transition: transform .55s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
  }
  .tick circle { fill: var(--good); }
  .tick path { stroke-dasharray: 40; stroke-dashoffset: 40; transition: stroke-dashoffset .35s ease .25s; }
  .stage.done .tick { opacity: 1; transform: none; }
  .stage.done .tick path { stroke-dashoffset: 0; }
  .stage.done .core { opacity: 0; transition: opacity .2s; }

  h1 { margin: 0 0 4px; font-size: clamp(19px, 5.2vw, 22px); }
  .status { min-height: 22px; margin: 0 0 4px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status.pop { animation: statusIn .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(6px); } }
  .bar { height: 6px; margin: 10px auto 16px; max-width: 240px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--coral), var(--peach)); transition: width .3s cubic-bezier(.34, 1.3, .64, 1); }

  /* ---------- Controls ---------- */
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .speed { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--plate); border: 1px solid var(--line); }
  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s, color .2s, box-shadow .2s;
  }
  .speed button { padding: 7px 12px; border: 0; background: transparent; }
  .speed button[aria-pressed="true"] { background: var(--card); color: var(--coral); box-shadow: 0 2px 8px -3px var(--shadow); }
  .chip { padding: 8px 14px; border: 1px solid var(--line); background: transparent; }
  .main {
    width: 100%;
    padding: 13px 18px;
    border: 0;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(120deg, var(--coral), color-mix(in srgb, var(--coral) 60%, var(--peach)));
    box-shadow: 0 12px 22px -14px var(--coral);
  }
  .main:disabled { opacity: .75; cursor: progress; }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  .chip:hover:not(:disabled) { border-color: var(--coral); }
  button:active:not(:disabled) { transform: scale(.94); transition-duration: .08s; }
  button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
  button:disabled { cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
    .halo { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <!-- The spinner: 12 places in a ring, 9 dots, a gap of 3 -->
    <div class="stage" id="stage" role="img" aria-label="Loading spinner: dots hopping round a ring">
      <div class="halo"></div>
      <div class="core"></div>
      <svg class="tick" viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="30" cy="30" r="30"/>
        <path d="M18 31l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Leapfrog loader</h1>
    <p class="status" id="status" role="status" aria-live="polite">The last dot leaps over the gap to the front.</p>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>

    <div class="controls">
      <div class="speed" role="group" aria-label="Speed">
        <button type="button" data-ms="520" aria-pressed="false">Calm</button>
        <button type="button" data-ms="333" aria-pressed="true">Normal</button>
        <button type="button" data-ms="210" aria-pressed="false">Quick</button>
      </div>
      <button type="button" class="chip" id="pause" aria-pressed="false">Pause</button>
    </div>
    <button type="button" class="main" id="run">Simulate a load</button>
  </main>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const statusEl = $("status");
  const bar = $("bar");
  const runBtn = $("run");
  const pauseBtn = $("pause");
  const speedBtns = Array.from(document.querySelectorAll(".speed button"));

  const SLOTS = 12;            // places round the ring
  const DOTS = 9;              // dots on the ring
  const GAP = SLOTS - DOTS;    // empty places the tail jumps over
  let tickMs = 333;            // one hop every third of a second
  let radius = 0;
  let timer = 0;
  let paused = false;
  let state = "idle";          // idle | loading | done

  // ---- Geometry ----
  function slotXY(slot, r) {
    const a = (slot / SLOTS) * Math.PI * 2;
    return [Math.sin(a) * r, -Math.cos(a) * r];
  }
  function measure() {
    radius = stage.clientWidth * 0.36;
  }
  function moveTo(dot, slot) {
    const [x, y] = slotXY(slot, radius);
    dot.slot = slot;
    dot.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
  }

  // ---- Build the dots: order[0] is the tail, order[DOTS-1] the head ----
  measure();
  const order = [];
  for (let i = 0; i < DOTS; i++) {
    const el = document.createElement("span");
    el.className = "dot";
    stage.append(el);
    const dot = { el, slot: i };
    moveTo(dot, i);
    order.push(dot);
  }
  function paintRanks() {
    // Head is biggest and brightest, the tail is small and soft
    order.forEach((dot, idx) => {
      const rank = DOTS - 1 - idx;
      dot.el.style.scale = (1 - rank * 0.07).toFixed(3);
      dot.el.style.opacity = (1 - rank * 0.075).toFixed(2);
      dot.el.style.setProperty("--mix", (rank / (DOTS - 1)).toFixed(2));
    });
  }
  paintRanks();

  // ---- One hop: the tail leaps backwards over the gap and lands in front of the head ----
  function hop() {
    const tail = order[0];
    const head = order[DOTS - 1];
    const from = tail.slot;
    const to = (head.slot + 1) % SLOTS;
    const dur = tickMs * 0.82;
    moveTo(tail, to);                         // final place (the animation runs on top)
    const [lx, ly] = slotXY(to, radius);

    if (reduce) {
      // Gentle version: fade out, fade in at the new place
      tail.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: Math.min(dur, 200) });
    } else {
      const frames = [];
      const N = 10;
      for (let f = 0; f <= N; f++) {
        const t = f / N;
        const r = radius * (1 + 0.45 * Math.sin(Math.PI * t));   // arc outwards
        const [x, y] = slotXY(from - GAP * t, r);
        let s = "scale(1, 1)";
        if (f === 0) s = "scale(1.3, .72)";          // crouch
        else if (f === 1) s = "scale(.78, 1.3)";     // stretch on take-off
        else if (f === N - 1) s = "scale(.86, 1.18)";
        else if (f > 1 && f < N - 1) s = "scale(1.12)";
        frames.push({ transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) " + s, offset: t });
      }
      tail.el.animate(frames, { duration: dur, easing: "cubic-bezier(.45, 0, .35, 1)" }).onfinish = () => {
        // Landing squash, then a springy settle
        const at = "translate(" + lx.toFixed(1) + "px," + ly.toFixed(1) + "px) ";
        tail.el.animate([
          { transform: at + "scale(1.38, .66)" },
          { transform: at + "scale(.9, 1.12)", offset: 0.5 },
          { transform: at + "scale(1)" }
        ], { duration: 240, easing: "ease-out" });
        puff(lx, ly);
      };
    }
    order.push(order.shift());
    paintRanks();
  }

  // Dust ring where the dot lands
  function puff(x, y) {
    if (reduce) return;
    const p = document.createElement("span");
    p.className = "puff";
    stage.append(p);
    p.animate([
      { transform: "translate(" + x + "px," + y + "px) scale(.4)", opacity: 0.7 },
      { transform: "translate(" + x + "px," + y + "px) scale(1.8)", opacity: 0 }
    ], { duration: 420, easing: "ease-out" }).onfinish = () => p.remove();
    stage.querySelector(".core").animate(
      [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-50%) scale(1.22)" }, { transform: "translate(-50%,-50%) scale(1)" }],
      { duration: 260, easing: "ease-out" }
    );
  }

  // ---- Timer ----
  function start() {
    clearInterval(timer);
    timer = setInterval(hop, reduce ? Math.max(tickMs, 600) : tickMs);
    stage.classList.remove("paused");
  }
  function stop() {
    clearInterval(timer);
    timer = 0;
    stage.classList.add("paused");
  }
  function say(msg) {
    statusEl.textContent = msg;
    statusEl.classList.remove("pop");
    void statusEl.offsetWidth;
    statusEl.classList.add("pop");
  }

  speedBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      speedBtns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      tickMs = Number(btn.dataset.ms);
      if (!paused && state !== "done") start();
      say(btn.textContent + " speed: one hop every " + tickMs + " ms.");
    });
  });

  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.setAttribute("aria-pressed", String(paused));
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    if (paused) stop(); else start();
    say(paused ? "Paused." : "Hopping again.");
  });

  // ---- Simulated load: idle, loading, done, reset ----
  const gathers = [];
  const STEPS = [[0, "Connecting…"], [25, "Fetching your orders…"], [70, "Almost there…"]];
  runBtn.addEventListener("click", () => {
    if (state === "loading") return;
    if (state === "done") { reset(); return; }
    state = "loading";
    runBtn.disabled = true;
    pauseBtn.disabled = true;
    if (paused) { paused = false; pauseBtn.setAttribute("aria-pressed", "false"); pauseBtn.textContent = "Pause"; }
    start();
    let pct = 0;
    const loader = setInterval(() => {
      pct = Math.min(100, pct + 4 + Math.random() * 9);
      bar.style.width = pct + "%";
      const step = STEPS.filter((s) => pct >= s[0]).pop()[1];
      runBtn.textContent = "Loading… " + Math.round(pct) + "%";
      if (statusEl.textContent !== step) say(step);
      if (pct >= 100) { clearInterval(loader); finish(); }
    }, 220);
  });

  function finish() {
    state = "done";
    stop();
    // The dots gather into the middle with a little wind-up, then the check springs out
    order.forEach((dot, i) => {
      const [x, y] = slotXY(dot.slot, radius);
      const a = dot.el.animate([
        { transform: "translate(" + x + "px," + y + "px)" },
        { transform: "translate(" + x * 1.15 + "px," + y * 1.15 + "px)", offset: 0.35 },
        { transform: "translate(0px,0px) scale(.2)", opacity: 0 }
      ], { duration: reduce ? 1 : 520, delay: reduce ? 0 : i * 35, easing: "cubic-bezier(.5, 0, .75, 0)", fill: "forwards" });
      gathers.push(a);
    });
    setTimeout(() => {
      stage.classList.add("done");
      say("Done! Everything loaded.");
      runBtn.disabled = false;
      runBtn.textContent = "Run it again";
    }, reduce ? 50 : 520 + DOTS * 35);
  }

  function reset() {
    stage.classList.remove("done");
    gathers.splice(0).forEach((a) => a.cancel());
    bar.style.width = "0";
    // Dots spring back out of the middle to their places
    order.forEach((dot, i) => {
      const [x, y] = slotXY(dot.slot, radius);
      dot.el.animate([
        { transform: "translate(0px,0px) scale(.2)", opacity: 0 },
        { transform: "translate(" + x + "px," + y + "px)", opacity: 1 }
      ], { duration: reduce ? 1 : 600, delay: reduce ? 0 : i * 40, easing: "cubic-bezier(.34, 1.56, .64, 1)", fill: "backwards" });
    });
    state = "idle";
    pauseBtn.disabled = false;
    runBtn.textContent = "Simulate a load";
    say("Ready. The last dot leaps over the gap to the front.");
    start();
  }

  window.addEventListener("resize", () => {
    measure();
    order.forEach((dot) => moveTo(dot, dot.slot));
  });

  start();
})();
</script>
</body>
</html>
