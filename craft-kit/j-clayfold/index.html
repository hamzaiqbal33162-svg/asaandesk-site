<!doctype html>
<!-- Chill & Craft · Clayfold · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clayfold · Home goods shop and admin · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq && mq.matches ? "dark" : "light"; }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --bg: #f5f1e8; --panel: #fffdf8; --panel2: #ece6d8; --ink: #2f2f2b; --muted: #6d6a60; --line: #e0d9c8;
    --sage: #8fa58a; --sage-d: #56704f; --clay: #c9785b; --clay-d: #a85a3f; --ok: #4f8a4a; --bad: #c0442f; --warn: #c98a1b;
    --shadow: 0 18px 40px -18px rgba(60, 55, 40, .35); --r: 24px;
    --soft: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.5, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1b211c; --panel: #232a24; --panel2: #2c352d; --ink: #eef0e8; --muted: #a6ad9f; --line: #364037;
    --sage: #9db897; --sage-d: #b9d1b2; --clay: #d98c6f; --clay-d: #e8a387; --shadow: 0 18px 40px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; overflow-x: clip; }
  a { color: inherit; }
  svg { display: block; max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--clay); outline-offset: 3px; border-radius: 10px; }
  h1, h2, h3 { line-height: 1.12; margin: 0 0 .45em; font-weight: 600; letter-spacing: -.015em; }
  p { margin: 0 0 1em; }
  mark { background: color-mix(in srgb, var(--clay) 30%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }
  .wrap { width: min(1160px, 100% - 32px); margin-inline: auto; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 99; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; }
  .skip:focus { left: 8px; }
  .eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--sage-d); font-weight: 700; }
  .lbl { display: block; font-size: .8rem; font-weight: 700; margin-bottom: 6px; color: var(--muted); }

  /* ---------- Header ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .top-in { display: flex; align-items: center; gap: 14px; min-height: 68px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 1.2rem; letter-spacing: -.02em; }
  .logo svg { width: 34px; height: 34px; transition: transform .8s var(--spring); }
  .logo:hover svg { transform: rotate(-12deg) scale(1.1); }
  .nav { position: relative; display: flex; gap: 2px; padding: 4px; background: var(--panel2); border-radius: 999px; }
  .nav a { position: relative; z-index: 1; padding: 7px 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: .92rem; transition: color .3s; }
  .nav a[aria-current="page"] { color: #fff; }
  .nav-mark { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--sage-d); transition: left .6s var(--spring), width .6s var(--spring); }
  :root[data-theme="dark"] .nav a[aria-current="page"] { color: #1b211c; }
  .hsearch { position: relative; flex: 1 1 220px; max-width: 360px; margin-left: auto; }
  .hsearch input { padding-left: 40px; }
  .hsearch > svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; translate: 0 -50%; color: var(--muted); pointer-events: none; }
  .sugg { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 50; margin: 0; padding: 6px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); transform-origin: top; animation: drop .35s var(--spring); }
  .sugg[hidden] { display: none; }
  .sugg li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; cursor: pointer; }
  .sugg li[aria-selected="true"], .sugg li:hover { background: var(--panel2); }
  .sugg li .th { width: 38px; height: 38px; border-radius: 10px; background: var(--panel2); padding: 3px; flex: none; }
  .sugg li small { margin-left: auto; color: var(--muted); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px) scaleY(.9); } }
  .bag-btn { position: relative; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--clay); color: #fff; text-decoration: none; transition: transform .4s var(--spring); }
  .bag-btn:hover { transform: scale(1.08) rotate(-6deg); }
  .bag-btn svg { width: 22px; height: 22px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 11px; background: var(--ink); color: var(--bg); font-size: .72rem; font-weight: 700; display: grid; place-items: center; }
  .bag-btn.bump { animation: jelly .7s var(--spring); }
  @keyframes jelly { 25% { transform: scale(1.25, .8); } 50% { transform: scale(.88, 1.15); } 75% { transform: scale(1.06, .96); } }
  @media (max-width: 760px) {
    .top-in { gap: 10px; padding: 10px 0; }
    .nav { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .nav a { flex: 1 0 auto; text-align: center; }
    .hsearch { order: 4; max-width: none; flex-basis: 100%; }
    .bag-btn { margin-left: auto; }
  }

  /* ---------- Form controls and buttons ---------- */
  input[type="text"], input[type="search"], input[type="email"], input[type="tel"], input[type="number"], select, textarea { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); transition: border-color .2s, box-shadow .25s; }
  textarea { padding: 10px 14px; min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sage-d); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sage) 30%, transparent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--panel2); font-weight: 650; text-decoration: none; transition: transform .45s var(--spring), background .25s, box-shadow .3s; }
  .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .btn:active { transform: scale(.95); }
  .btn svg { width: 18px; height: 18px; transition: transform .45s var(--spring); }
  .btn:hover svg { transform: translateX(4px); }
  .btn-sage { background: var(--sage-d); color: #fff; }
  :root[data-theme="dark"] .btn-sage { color: #1b211c; }
  .btn-clay { background: var(--clay); color: #fff; }
  .btn-line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }

  /* ---------- Route transition: blur dissolve + a clay blob blooming from the click ---------- */
  main { min-height: 70vh; outline: none; }
  .view > * { animation: soften .8s var(--soft) both; }
  .view > *:nth-child(2) { animation-delay: .07s; }
  .view > *:nth-child(n+3) { animation-delay: .14s; }
  @keyframes soften { from { opacity: 0; filter: blur(10px); transform: translateY(18px); } }
  .bloom { position: fixed; z-index: 70; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 46% 54% 42% 58%; background: var(--clay); pointer-events: none; opacity: .5; }
  .rv { opacity: 0; transform: translateY(26px); filter: blur(6px); transition: opacity .9s var(--soft), transform .9s var(--soft), filter .9s var(--soft); transition-delay: calc(var(--d, 0) * 90ms); }
  .rv.in { opacity: 1; transform: none; filter: none; }

  /* ---------- Hero ---------- */
  .hero { padding: 34px 0 30px; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1.05fr; gap: 34px; align-items: center; }
  .hero h1 { font-size: clamp(2.2rem, 5.6vw, 4.2rem); font-weight: 500; }
  .hero h1 .w { display: inline-block; animation: soften 1s var(--soft) both; animation-delay: calc(var(--i) * 90ms + .15s); }
  .hero h1 em { font-style: normal; color: var(--clay); }
  .hero .lead { font-size: 1.12rem; color: var(--muted); max-width: 32em; }
  .hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  .hero-art { position: relative; border-radius: 42% 58% 46% 54% / 50% 44% 56% 50%; overflow: hidden; background: var(--panel2); box-shadow: var(--shadow); animation: blobby 14s ease-in-out infinite alternate, soften 1.2s var(--soft) both; }
  @keyframes blobby { 50% { border-radius: 56% 44% 58% 42% / 44% 58% 42% 56%; } 100% { border-radius: 48% 52% 40% 60% / 58% 46% 54% 42%; } }
  .hero-art svg { width: 100%; height: auto; }
  .sunbeam { animation: sweep 9s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform: translateX(-60px); opacity: .35; } to { transform: translateX(70px); opacity: .7; } }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 4; stroke-linecap: round; opacity: 0; animation: steam 3.2s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 35% { opacity: .55; } 100% { opacity: 0; transform: translateY(-30px); } }
  .leaf { transform-box: fill-box; transform-origin: bottom center; animation: sway 4s ease-in-out infinite alternate; animation-delay: var(--d); }
  @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .mote { animation: mote 7s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes mote { 50% { transform: translate(14px, -22px); opacity: .9; } }
  .flame { transform-box: fill-box; transform-origin: bottom center; animation: flick 1.2s ease-in-out infinite alternate; }
  @keyframes flick { 0% { transform: scale(1, 1) rotate(-3deg); } 100% { transform: scale(.88, 1.12) rotate(3deg); } }
  @media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; } }

  /* ---------- Sections ---------- */
  .sec { padding: 56px 0; }
  .sec-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .sec-h h2 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); margin: 0; font-weight: 500; }
  .link { font-weight: 650; text-decoration: none; background: linear-gradient(var(--clay), var(--clay)) 0 100% / 100% 2px no-repeat; transition: background-size .4s var(--soft); }
  .link:hover { background-size: 0 2px; background-position: 100% 100%; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
  .cat { display: grid; justify-items: center; gap: 10px; padding: 16px 10px; text-align: center; text-decoration: none; font-weight: 600; }
  .cat .blob { width: 120px; aspect-ratio: 1; padding: 16px; background: var(--panel2); border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%; transition: border-radius .8s var(--soft), transform .6s var(--spring), background .3s; }
  .cat:hover .blob { border-radius: 58% 42% 40% 60% / 42% 58% 42% 58%; transform: translateY(-6px) rotate(-6deg); background: color-mix(in srgb, var(--sage) 35%, var(--panel2)); }
  .process { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
  .process li { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
  .process svg { width: 54px; height: 54px; margin-bottom: 10px; }
  .process .spin { transform-box: fill-box; transform-origin: center; animation: wheel 3s linear infinite; }
  @keyframes wheel { to { transform: rotate(360deg); } }
  @media (max-width: 860px) { .process { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .process { grid-template-columns: 1fr; } }
  .band { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; padding: 34px; border-radius: 36px; background: var(--sage-d); color: #fff; }
  :root[data-theme="dark"] .band { color: #1b211c; }
  .band form { display: flex; flex-wrap: wrap; gap: 10px; }
  .band input { flex: 1 1 200px; background: #fffdf8; color: #2f2f2b; border-color: transparent; }
  .band .msg { flex-basis: 100%; min-height: 1.4em; margin: 0; font-weight: 650; }
  @media (max-width: 760px) { .band { grid-template-columns: 1fr; padding: 24px; } }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 22vw, 240px), 1fr)); gap: 18px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: transform .6s var(--spring), box-shadow .4s; animation: soften .7s var(--soft) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
  .card .art { position: relative; aspect-ratio: 1; padding: 18px; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--sage) 22%, var(--panel2)), var(--panel2) 70%); }
  .card .art svg { transition: transform .8s var(--spring); }
  .card:hover .art svg { transform: scale(1.07) translateY(-4px); }
  .card-b { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px 16px; flex: 1; }
  .card h3 { font-size: 1rem; margin: 0; font-weight: 600; }
  .card h3 a { text-decoration: none; }
  .card h3 a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card .dots { display: flex; gap: 5px; margin: 4px 0; }
  .card .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--line); }
  .price { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-weight: 700; }
  .price s { font-weight: 400; color: var(--muted); font-size: .85em; }
  .tag { position: absolute; top: 12px; left: 12px; z-index: 2; padding: 4px 10px; border-radius: 999px; background: var(--clay); color: #fff; font-size: .74rem; font-weight: 700; }
  .tag.low { background: var(--warn); }
  .qa { position: absolute; z-index: 2; right: 12px; top: 12px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .5s var(--spring), background .25s, color .25s; }
  .qa svg { width: 18px; height: 18px; transition: transform .5s var(--spring); }
  .qa:hover { background: var(--sage-d); color: #fff; transform: scale(1.1); }
  .qa:hover svg { transform: rotate(90deg); }
  .qa.pop { animation: jelly .7s var(--spring); background: var(--ok); color: #fff; }
  .stars { font-size: .8rem; color: var(--muted); }

  /* ---------- Listing ---------- */
  .page-h { padding: 28px 0 6px; }
  .page-h h1 { font-size: clamp(2rem, 4.6vw, 3.2rem); font-weight: 500; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: .86rem; color: var(--muted); margin-bottom: 6px; }
  .crumbs a { text-decoration: none; }
  .shop { display: grid; grid-template-columns: 240px 1fr; gap: 28px; padding: 14px 0 60px; align-items: start; }
  .filters { position: sticky; top: 90px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 18px 18px; }
  .fgroup { padding: 14px 0; border-bottom: 1px dashed var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); font-size: .84rem; font-weight: 600; transition: transform .4s var(--spring), background .25s, color .25s, border-color .25s; }
  .chip:hover { border-color: var(--sage-d); }
  .chip[aria-pressed="true"] { background: var(--sage-d); border-color: var(--sage-d); color: #fff; transform: scale(1.05); }
  :root[data-theme="dark"] .chip[aria-pressed="true"] { color: #1b211c; }
  .sws { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 34px; height: 34px; border-radius: 46% 54% 50% 50%; border: 3px solid var(--panel); background: var(--c); box-shadow: 0 0 0 1.5px var(--line); transition: transform .45s var(--spring), box-shadow .25s, border-radius .5s; }
  .sw:hover { transform: scale(1.12) rotate(-8deg); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--ink); transform: scale(1.14); border-radius: 50%; }
  input[type="range"] { width: 100%; accent-color: var(--sage-d); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; }
  .check input { width: 18px; height: 18px; accent-color: var(--sage-d); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar .search { flex: 1 1 200px; }
  .toolbar .count { margin: 0 auto 0 0; color: var(--muted); font-weight: 600; }
  .sort { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; }
  .sort select { width: auto; min-height: 42px; }
  .f-toggle { display: none; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 40px 16px; border: 2px dashed var(--line); border-radius: var(--r); }
  .empty svg { width: 120px; margin: 0 auto 10px; }
  @media (max-width: 860px) { .shop { grid-template-columns: 1fr; } .filters { display: none; position: static; } .filters.open { display: block; animation: drop .45s var(--spring); } .f-toggle { display: inline-flex; } }

  /* ---------- Product ---------- */
  .pd { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; padding: 10px 0 40px; }
  .stage { position: relative; aspect-ratio: 1; display: grid; place-items: center; border-radius: 40px; background: radial-gradient(circle at 50% 75%, color-mix(in srgb, var(--sage) 28%, var(--panel2)), var(--panel2) 70%); overflow: hidden; }
  .stage .big { width: 74%; transition: transform .9s var(--spring); }
  .stage .big.swap { animation: glaze .7s var(--soft); }
  @keyframes glaze { 0% { filter: blur(8px) saturate(0); transform: scale(.92); } }
  .stage[data-v="1"] .big { transform: scale(1.18) rotate(-6deg); }
  .stage[data-v="2"] .big { transform: scale(1.8) translate(-10%, 8%); }
  .stage .shine { position: absolute; inset: 0; background: linear-gradient(110deg, transparent 40%, rgba(255, 255, 255, .25) 50%, transparent 60%); background-size: 250% 100%; animation: shine 6s ease-in-out infinite; pointer-events: none; }
  @keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }
  .thumbs { display: flex; gap: 10px; margin-top: 12px; }
  .thumb { width: 78px; aspect-ratio: 1; padding: 8px; border-radius: 20px; border: 2px solid var(--line); background: var(--panel2); overflow: hidden; transition: transform .45s var(--spring), border-color .25s; }
  .thumb:hover { transform: translateY(-3px); }
  .thumb[aria-pressed="true"] { border-color: var(--clay); }
  .thumb:nth-child(2) svg { transform: scale(1.18) rotate(-6deg); }
  .thumb:nth-child(3) svg { transform: scale(1.8) translate(-10%, 8%); }
  .pd h1 { font-size: clamp(1.8rem, 4vw, 2.7rem); font-weight: 500; }
  .pd .price { font-size: 1.5rem; margin: 6px 0 12px; }
  .opt-h { display: flex; justify-content: space-between; gap: 10px; font-weight: 650; margin: 18px 0 8px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .size { min-width: 60px; min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); font-weight: 650; transition: transform .45s var(--spring), background .25s, color .25s, border-color .25s; }
  .size:hover:not(:disabled) { border-color: var(--sage-d); }
  .size[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); transform: translateY(-3px); }
  .size:disabled { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
  .buy { display: flex; flex-wrap: wrap; gap: 12px; margin: 22px 0 12px; }
  .stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--panel); overflow: hidden; }
  .stepper button { width: 44px; height: 50px; border: 0; background: none; font-size: 1.2rem; font-weight: 700; transition: background .2s; }
  .stepper button:hover { background: var(--panel2); }
  .stepper output { min-width: 28px; text-align: center; font-weight: 700; }
  .stepper output.tick { animation: jelly .5s var(--spring); }
  .stock { font-size: .9rem; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .stock i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
  .stock.low i { background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  .details { margin: 18px 0 0; padding: 0; list-style: none; }
  .details li { padding: 10px 0; border-top: 1px dashed var(--line); font-size: .95rem; }
  @media (max-width: 860px) { .pd { grid-template-columns: 1fr; gap: 22px; } }

  /* Add to bag: squash, a pottery wheel spins, then done */
  .add { position: relative; flex: 1 1 210px; display: grid; min-height: 52px; border: 0; border-radius: 999px; background: var(--sage-d); color: #fff; font-weight: 700; overflow: hidden; transition: transform .45s var(--spring), background .35s; }

  /* ---------- Bag + checkout ---------- */

  .row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; }

  .co { display: grid; grid-template-columns: 1fr 360px; gap: 28px; padding: 14px 0 60px; align-items: start; }

  /* Listing with filters, sort and live search */
  const F = { cat: "", colors: new Set(), sizes: new Set(), max: 10000, sale: false, stock: false, q: "", sort: "featured" };
  const sizeChips = () => [...new Set(live().filter((p) => !F.cat || p.cat === F.cat).flatMap((p) => p.sizes))].map((s) => `<button type="button" class="chip" data-act="fsize" data-v="${esc(s)}" aria-pressed="${F.sizes.has(s)}">${esc(s)}</button>`).join("");
  function filtersHTML() {
    return `
      <div class="fgroup"><span class="lbl">Category</span><div class="chips"><button type="button" class="chip" data-act="fcat" data-v="" aria-pressed="${!F.cat}">All</button>${CATS.map((c) => `<button type="button" class="chip" data-act="fcat" data-v="${c.id}" aria-pressed="${F.cat === c.id}">${c.name}</button>`).join("")}</div></div>
      <div class="fgroup"><span class="lbl">Colour</span><div class="sws">${Object.entries(COL).map(([k, [n, h]]) => `<button type="button" class="sw" style="--c:${h}" data-act="fcol" data-v="${k}" aria-pressed="${F.colors.has(k)}" aria-label="${n}" title="${n}"></button>`).join("")}</div></div>
      <div class="fgroup"><span class="lbl">Size</span><div class="chips" id="fsizes">${sizeChips()}</div></div>

  function shop(r) {

    F.q = r.q.get("q") || ""; F.colors.clear(); F.sizes.clear(); F.max = 10000; F.sale = false; F.stock = false;
    F.sort = ["low", "high", "rating", "new", "name"].includes(r.q.get("sort")) ? r.q.get("sort") : "featured";
    const title = catName(F.cat) || "All home goods";
    return `
    <section class="wrap page-h"><nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a><span aria-hidden="true">/</span><span id="crumb">${title}</span></nav><h1 id="shopTitle">${title}</h1></section>
    <div class="wrap shop">

          <label class="sort"><span>Sort</span><select data-f="sort">${[["featured", "Featured"], ["new", "Newest"], ["low", "Price: low to high"], ["high", "Price: high to low"], ["rating", "Best rated"], ["name", "Name A to Z"]].map(([v, t]) => `<option value="${v}" ${F.sort === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </div>`;
  }
  function results() {
    const q = F.q.trim().toLowerCase();
    const L = live().filter((p) => (!F.cat || p.cat === F.cat) && p.price <= F.max && (!F.sale || p.was) && (!F.stock || p.stock > 0) &&
      (!F.colors.size || p.colors.some((c) => F.colors.has(c))) && (!F.sizes.size || p.sizes.some((s) => F.sizes.has(s))) &&
      (!q || (p.name + " " + catName(p.cat) + " " + p.blurb).toLowerCase().includes(q)));
    const idx = (p) => S.prods.indexOf(p);
    const sorts = { low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price, rating: (a, b) => (b.rating || 0) - (a.rating || 0), name: (a, b) => a.name.localeCompare(b.name), new: (a, b) => idx(b) - idx(a) };
    return sorts[F.sort] ? L.sort(sorts[F.sort]) : L;
  }
  function drawGrid() {
    const g = $("#grid"); if (!g) return;
    const L = results();
    g.innerHTML = L.length ? L.map((p, i) => card(p, i, F.q.trim())).join("") : `<div class="empty"><svg viewBox="0 0 120 100" aria-hidden="true"><path d="M30 40h60l-8 50H38z" fill="#c9785b"/><path d="M60 40c-4-16-14-24-24-24 6 12 14 20 24 24zM60 40c4-18 14-28 26-28-4 14-14 24-26 28z" fill="#8fa58a"/></svg><h2>Nothing on this shelf</h2><p class="muted">Try a softer filter or another word.</p><button class="btn btn-sage" type="button" data-act="freset">Clear filters</button></div>`;

    const low = p.stock > 0 && p.stock <= 5;
    return `

    <div class="wrap pd">
      <div>
        <div class="stage" id="stage" data-v="0"><div class="big" id="big">${art(p, sel.c)}</div><i class="shine" aria-hidden="true"></i></div>

  async function addFlow(btn) {
    if (btn.dataset.busy) return;
    const p = byId(sel.id);
    if (!sel.s) return say("Pick a size first");
    btn.dataset.busy = "1";
    btn.classList.add("press"); await wait(160); btn.classList.remove("press");
    btn.classList.add("work"); await wait(820);
    addLine(p.id, sel.c, sel.s, sel.q);
    fly($("#big"), art(p, sel.c));
    btn.classList.remove("work"); btn.classList.add("done"); leaves(btn);
    say(`${sel.q} x ${p.name} (${COL[sel.c][0]}, ${sel.s}) is in your bag`);
    await wait(1500); btn.classList.remove("done"); delete btn.dataset.busy;
  }

    else if (e.key === "Escape") closeSugg();
  });
  sugg.addEventListener("mousedown", (e) => { const li = e.target.closest("li"); if (li) { e.preventDefault(); pickSugg(li); } });
  hq.addEventListener("blur", () => setTimeout(closeSugg, 120));

  /* ---------- Click actions ---------- */
  const setPressed = (sel2, b) => $$(sel2).forEach((t) => t.setAttribute("aria-pressed", t === b ? "true" : "false"));
  const ACT = {
    qa(b) {
      const p = byId(b.dataset.id); if (!p) return;
      addLine(p.id, p.colors[0], firstSize(p), 1);
      fly(b.closest(".card").querySelector(".art"), art(p));
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 700);
      say(`${p.name} is in your bag`);
    },
    ftoggle(b) { const o = $("#filters").classList.toggle("open"); b.setAttribute("aria-expanded", o ? "true" : "false"); },
    fcat(b) { F.cat = b.dataset.v; F.sizes.clear(); setPressed("[data-act=fcat]", b); $("#fsizes").innerHTML = sizeChips(); const t = catName(F.cat) || "All home goods"; $("#shopTitle").textContent = t; $("#crumb").textContent = t; drawGrid(); },
    fcol(b) { const v = b.dataset.v; F.colors.has(v) ? F.colors.delete(v) : F.colors.add(v); b.setAttribute("aria-pressed", F.colors.has(v) ? "true" : "false"); drawGrid(); },
    fsize(b) { const v = b.dataset.v; F.sizes.has(v) ? F.sizes.delete(v) : F.sizes.add(v); b.setAttribute("aria-pressed", F.sizes.has(v) ? "true" : "false"); drawGrid(); },
    freset() { Object.assign(F, { cat: "", max: 10000, sale: false, stock: false, q: "" }); F.colors.clear(); F.sizes.clear(); $("#filters").innerHTML = filtersHTML(); $("[data-f=q]").value = ""; $("#shopTitle").textContent = "All home goods"; $("#crumb").textContent = "All home goods"; drawGrid(); say("Filters cleared"); },
    view(b) { $("#stage").dataset.v = b.dataset.v; setPressed("[data-act=view]", b); },
    pc(b) { const p = byId(sel.id); sel.c = b.dataset.v; setPressed("[data-act=pc]", b); $("#cName").textContent = COL[sel.c][0]; const big = $("#big"); big.innerHTML = art(p, sel.c); big.classList.remove("swap"); void big.offsetWidth; big.classList.add("swap"); $$("[data-act=view]").forEach((t) => (t.innerHTML = art(p, sel.c))); },
    ps(b) { sel.s = b.dataset.v; setPressed("[data-act=ps]", b); $("#sName").textContent = sel.s; },
    pq(b) { const p = byId(sel.id); sel.q = Math.max(1, Math.min(Math.max(1, Math.min(9, p.stock)), sel.q + +b.dataset.d)); const o = $("#pq"); o.textContent = sel.q; o.classList.remove("tick"); void o.offsetWidth; o.classList.add("tick"); },
    add(b) { addFlow(b); },
    lq(b) {
      const row = b.closest(".line"), l = S.bag.find((x) => x.k === row.dataset.k); if (!l) return;
      const nq = l.q + +b.dataset.d, p = byId(l.id);
      if (nq < 1) return ACT.rm(row.querySelector(".rm"));
      if (nq > Math.min(9, p.stock)) return say(`Only ${p.stock} in stock`);
      l.q = nq; save(); syncBadge(true);
      const o = row.querySelector("output"); o.textContent = l.q; o.classList.remove("tick"); void o.offsetWidth; o.classList.add("tick");
      row.querySelector(".l-total").textContent = pkr(p.price * l.q); refreshSum();
    },
    async rm(b) {
      const row = b.closest(".line"); if (row.dataset.gone) return; row.dataset.gone = "1";
      const l = S.bag.find((x) => x.k === row.dataset.k), p = byId(l.id);
      S.bag = S.bag.filter((x) => x !== l); save(); syncBadge(true);
      await anim(row, [{ transform: "none", opacity: 1, filter: "blur(0)" }, { transform: "translateY(-10px) scale(.96)", opacity: 0, filter: "blur(6px)" }], { duration: 380, easing: "ease-in" });
      await anim(row, [{ height: row.offsetHeight + "px", marginBottom: "12px", paddingTop: "14px", paddingBottom: "14px" }, { height: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }], { duration: 260 });
      row.remove(); say(`${p.name} removed`);
      if (!S.bag.length) render(); else refreshSum();
    },
    unpromo() { S.promo = ""; save(); refreshSum(); say("Promo removed"); },
    atab(b) { atab = b.dataset.v; history.replaceState(null, "", "#/admin/" + atab); drawAdmin(); },
    ofilt(b) { oFilter = b.dataset.v; drawAdmin(); },
    del(b) { const cell = b.parentElement, p = byId(b.dataset.id); cell.innerHTML = `<span class="muted" style="font-size:.84rem">Delete ${esc(p.name)}?</span> <button class="mini-btn solid" type="button" data-act="delok" data-id="${p.id}">Delete</button> <button class="mini-btn" type="button" data-act="delno" data-id="${p.id}">Keep</button>`; cell.querySelector("[data-act=delno]").focus(); },
    delno(b) { const cell = b.parentElement; cell.innerHTML = `<button class="mini-btn danger" type="button" data-act="del" data-id="${b.dataset.id}">Delete</button>`; cell.firstChild.focus(); },
    async delok(b) {
      const row = b.closest("tr"), p = byId(b.dataset.id);
      await anim(row, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(40px)" }], { duration: 320, easing: "ease-in" });
      S.prods = S.prods.filter((x) => x !== p); cleanBag(); save(); syncBadge(false); drawAdmin(); say(`${p.name} deleted from the shop`);
    },
  };
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });

  /* ---------- Inputs: filters, admin edits, checkout helpers ---------- */
  document.addEventListener("input", (e) => {
    const t = e.target, f = t.dataset.f;
    if (f === "q") { F.q = t.value; drawGrid(); }
    if (f === "max") { F.max = +t.value; $("#fmaxo").textContent = pkr(F.max); drawGrid(); }
    const form = t.form;
    if (form && form.dataset.form === "order") {
      if (t.name === "card") t.value = t.value.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
      if (t.name === "exp") t.value = t.value.replace(/\D/g, "").slice(0, 4).replace(/^(\d{2})(\d)/, "$1/$2");
      if (t.name === "cvc") t.value = t.value.replace(/\D/g, "").slice(0, 4);
      if (t.getAttribute("aria-invalid") === "true" && RULES[t.name]) check(form, t.name, true);
      coProgress(form);
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target, f = t.dataset.f;
    if (f === "sort") { F.sort = t.value; drawGrid(); }
    if (f === "sale") { F.sale = t.checked; drawGrid(); }
    if (f === "stock") { F.stock = t.checked; drawGrid(); }
    if (t.dataset.ost) {
      const o = S.orders.find((x) => x.no === t.dataset.ost); if (!o) return;
      o.st = t.value; o.fresh = false; save();
      const badge = $("#st-" + o.no); badge.className = "st " + o.st + " pop"; badge.textContent = o.st;
      say(`${o.no} marked ${o.st}`);
    }
    if (t.dataset.ed) {
      const p = byId(t.dataset.id); if (!p) return;
      if (t.dataset.ed === "vis") { p.hidden = !t.checked; cleanBag(); syncBadge(false); say(`${p.name} is now ${p.hidden ? "hidden from" : "visible in"} the shop`); }
      else { const v = Math.max(t.dataset.ed === "price" ? 100 : 0, Math.round(+t.value || 0)); p[t.dataset.ed] = v; t.value = v; if (t.dataset.ed === "price") delete p.was; say(`${p.name}: ${t.dataset.ed} saved`); }
      save();
      const row = $("#pr-" + p.id); if (row) { row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
    }
    const form = t.form;
    if (form && form.dataset.form === "order") {
      if (t.name === "pay") $("#cardf").classList.toggle("on", t.value === "card");
      if (t.name === "ship") $("#coRows").innerHTML = sumRows(totals(t.value));
      if (RULES[t.name] && t.value) check(form, t.name, true);
    }
  });
  document.addEventListener("focusout", (e) => { const t = e.target, form = t.form; if (form && form.dataset.form === "order" && RULES[t.name] && t.value) check(form, t.name, true); });

  /* ---------- Form submits ---------- */
  const FORMS = {
    async news(f) {
      const inp = f.elements.email, msg = f.querySelector(".msg"), btn = f.querySelector("button");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim())) { inp.setAttribute("aria-invalid", "true"); msg.textContent = "That email does not look right yet."; inp.focus(); return; }
      inp.setAttribute("aria-invalid", "false"); btn.disabled = true; btn.textContent = "Sending...";
      await wait(900); btn.textContent = "Subscribed"; msg.textContent = "Lovely. The first letter arrives next month."; leaves(btn);
      await wait(2600); btn.disabled = false; btn.textContent = "Subscribe"; inp.value = "";
    },
    promo(f) {
      const code = f.elements.code.value.trim().toUpperCase(), msg = $("#pmsg");
      if (!code) { msg.className = "p-msg bad"; msg.textContent = "Type a code first."; return; }
      if (!PROMOS[code]) { msg.className = "p-msg bad"; msg.textContent = `"${code}" is not a code we know. Try SOFTHOME10.`; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
      const before = totals().total;
      leaves(f); S.promo = code; save(); refreshSum(); say(`${code} applied: ${PROMOS[code].label}`);
      const tot = $("#sumRows .tot"); if (tot) countUp(tot, totals().total, { from: before, pre: "PKR ", ms: 800 });
    },
    order(f) { placeOrder(f); },
    addp(f) {
      const el = f.elements, name = el.pname.value.trim(), pr = Math.round(+el.pprice.value), st = Math.round(+el.pstock.value), msg = $("#apMsg");
      if (name.length < 3 || !(pr >= 100) || !(st >= 0) || el.pstock.value === "") { msg.className = "p-msg bad"; msg.textContent = "Add a name (3+ letters), a price from PKR 100 and a stock number."; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
      const cat = CATS.find((c) => c.id === el.pcat.value) || CATS[0];
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36).slice(-4);
      S.prods.forEach((p) => delete p.fresh);
      S.prods.unshift({ id, name, cat: cat.id, art: cat.art, price: pr, stock: st, sizes: ["One size"], colors: [el.pcol.value, "cream"].filter((v, i, a) => a.indexOf(v) === i), rating: 0, rev: 0, blurb: "A new piece fresh from the studio.", fresh: true });
      save(); drawAdmin(); say(`${name} is live in the shop`);
    },
  };
  document.addEventListener("submit", (e) => { const f = e.target; if (f.dataset.form && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f); } });

  addEventListener("hashchange", render);
  addEventListener("resize", () => { markNav(parse()); placeSide(); });
  syncBadge(false);
  render();
})();
</script>
</body>
</html>
