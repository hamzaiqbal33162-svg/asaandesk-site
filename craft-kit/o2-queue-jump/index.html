<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue Jump · invite code that hops you to the front of the waitlist</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: sunflower, ink and hot pink ---------- */
  :root {
    color-scheme: light;
    --bg: #ffd84d;
    --bg-2: #ffb938;
    --card: #fffaf0;
    --ink: #1f1b2e;
    --muted: #6c6578;
    --line: rgba(31, 27, 46, .13);
    --pink: #ff4f8b;
    --pink-2: #ff86b0;
    --mint: #2fc993;
    --sun: #ffc93c;
    --bad: #e8384f;
    --field: #fff3d9;
    --floor: #f1e3c4;
    --door: #3b3456;
    --shadow: rgba(120, 70, 0, .3);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #16131f;
    --bg-2: #2a1d2c;
    --card: #211c2e;
    --ink: #fbf6ea;
    --muted: #b2a9bf;
    --line: rgba(251, 246, 234, .13);
    --pink: #ff6b9e;
    --pink-2: #ff9cc0;
    --mint: #45dba6;
    --sun: #ffd35a;
    --bad: #ff6b7d;
    --field: #2c2540;
    --floor: #2e2741;
    --door: #4b4370;
    --shadow: rgba(0, 0, 0, .6);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .35), transparent 55%),
      repeating-conic-gradient(from 0deg at 50% 110%, var(--bg) 0 8deg, var(--bg-2) 8deg 16deg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"] body { background: radial-gradient(circle at 50% 0%, rgba(255, 211, 90, .12), transparent 55%), repeating-conic-gradient(from 0deg at 50% 110%, var(--bg) 0 8deg, var(--bg-2) 8deg 16deg); }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .card {
    position: relative; width: min(100%, 470px); padding: 22px 22px 20px; border-radius: 28px; text-align: center; overflow-x: clip;
    background: var(--card); box-shadow: 0 0 0 3px var(--ink), 8px 10px 0 0 var(--ink), 0 40px 60px -30px var(--shadow);
    animation: rise .8s cubic-bezier(.3, 1.5, .5, 1) both;
  }
  [data-theme="dark"] .card { box-shadow: 0 0 0 2px rgba(255, 211, 90, .5), 8px 10px 0 0 rgba(255, 211, 90, .35), 0 40px 60px -30px var(--shadow); }
  @keyframes rise { from { opacity: 0; transform: translateY(20px) rotate(-1deg); } }
  .kicker { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #1f1b2e; background: var(--sun); }
  h1 { margin: 10px 0 0; font-size: clamp(22px, 5vw, 28px); letter-spacing: -.02em; line-height: 1.15; }
  h1 .pos { display: inline-block; color: var(--pink); font-variant-numeric: tabular-nums; }
  h1 .pos.bump { animation: bump .28s cubic-bezier(.34, 1.8, .5, 1); }
  @keyframes bump { 50% { transform: scale(1.08) translateY(-2px); } }
  .sub { margin: 6px auto 0; max-width: 340px; font-size: 14px; line-height: 1.5; color: var(--muted); }

  /* ---------- The queue ---------- */
  .scene { display: block; width: 100%; height: auto; margin: 14px 0 4px; overflow: visible; }
  .scene .floor { fill: var(--floor); }
  .scene .floorline { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; opacity: .8; }
  .scene .frame { fill: var(--ink); }
  .scene .light { fill: var(--sun); }
  .scene .doorp { fill: var(--door); transform-box: fill-box; transform-origin: 0 50%; transition: transform .7s cubic-bezier(.3, 1.4, .5, 1); }
  .scene.open .doorp { transform: scaleX(.18); }
  .scene .knob { fill: var(--sun); transition: opacity .2s; }
  .scene.open .knob { opacity: 0; }
  .scene .rays { fill: var(--sun); opacity: 0; transition: opacity .5s; }
  .scene.open .rays { opacity: .45; animation: rays 1.6s ease-in-out infinite; }
  @keyframes rays { 50% { opacity: .25; } }
  .scene .sign rect { fill: var(--pink); }
  .scene .sign text { fill: #fff; font: 800 6.4px system-ui, sans-serif; letter-spacing: .06em; }
  .scene .string { fill: none; stroke: var(--ink); stroke-width: 1.2; opacity: .5; }
  .scene .flag { transform-box: fill-box; transform-origin: 50% 0; animation: flutter 2.2s ease-in-out infinite; animation-delay: var(--d); }
  .scene.open .flag { animation-duration: .5s; }
  @keyframes flutter { 50% { transform: rotate(7deg); } }
  .scene .bob { animation: bob 2.4s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes bob { 50% { transform: translateY(-1.6px); } }
  .scene .squash { transform-box: fill-box; transform-origin: 50% 100%; }
  .scene .squash.hit { animation: squash .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes squash { 30% { transform: scale(1.12, .8); } 65% { transform: scale(.95, 1.06); } }
  .scene .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; animation-delay: var(--d); }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .scene .crouch { animation: crouch .5s ease both; }
  @keyframes crouch { 50%, 100% { transform: scale(1.1, .82); } }
  .scene .tag rect { fill: var(--ink); }
  .scene .tag text { fill: var(--card); font: 800 8px system-ui, sans-serif; }
  .scene .tag { animation: tagbob 1.8s ease-in-out infinite; transition: opacity .25s; }
  .scene.jumping .tag { opacity: 0; }
  @keyframes tagbob { 50% { transform: translateY(-2.5px); } }
  .scene .no { animation: no .5s ease 2; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes no { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  /* ---------- Invite code field ---------- */
  .label { display: block; margin: 8px 0 10px; font-size: 13px; font-weight: 750; }
  .fieldwrap { position: relative; }
  .boxes { display: flex; justify-content: center; align-items: center; gap: clamp(3px, 1.2vw, 7px); }
  .boxes .dash { flex: none; width: 10px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .35; }
  .cell { flex: 0 1 auto; width: clamp(28px, 8.4vw, 42px); height: 50px; }
  .cell input {
    width: 100%; height: 100%; padding: 0; border: 0; border-radius: 12px; outline: none; text-align: center; text-transform: uppercase;
    background: var(--field); color: var(--ink); caret-color: var(--pink);
    font: 800 20px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 0 var(--line);
    transition: box-shadow .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1), background .3s;
  }
  .cell input:focus, .cell.cur input { box-shadow: inset 0 0 0 2.5px var(--pink), 0 3px 0 0 var(--pink); transform: translateY(-3px); }
  .cell.filled input { box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 0 var(--ink); }
  [data-theme="dark"] .cell.filled input { box-shadow: inset 0 0 0 2px var(--sun), 0 3px 0 0 var(--sun); }
  .cell.land input { animation: land .4s cubic-bezier(.34, 1.8, .5, 1); }
  @keyframes land { 0% { transform: translateY(-8px) scale(.8); } 60% { transform: translateY(1px) scale(1.1); } }
  .boxes.check .cell input { animation: wave .6s ease-in-out infinite; animation-delay: calc(var(--i) * 60ms); }
  @keyframes wave { 50% { transform: translateY(-6px); } }
  .boxes.good .cell input { background: var(--mint); color: #fff; box-shadow: 0 3px 0 0 rgba(0, 0, 0, .2); }
  .boxes.bad { animation: shake .45s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .cell input:disabled { opacity: .55; }
  .stamp {
    position: absolute; left: 50%; top: 50%; z-index: 2; padding: 5px 14px; border-radius: 8px; pointer-events: none;
    font: 900 20px/1 system-ui, sans-serif; letter-spacing: .12em; color: var(--bad); white-space: nowrap;
    border: 3px double var(--bad); background: color-mix(in srgb, var(--card) 85%, transparent);
    transform: translate(-50%, -50%) rotate(-10deg); opacity: 0; visibility: hidden;
  }
  .stamp.on { visibility: visible; animation: slam .9s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes slam { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-18deg) scale(1.7); } 35% { opacity: 1; transform: translate(-50%, -50%) rotate(-10deg) scale(.94); } 55%, 80% { opacity: 1; transform: translate(-50%, -50%) rotate(-10deg) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(1); } }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .chip { padding: 5px 10px; border: 0; border-radius: 999px; cursor: pointer; font-weight: 750; font-size: 12.5px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); transition: transform .25s cubic-bezier(.34, 1.56, .64, 1); }
  .chip code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; }
  .chip:hover { transform: translateY(-2px); }
  .status { min-height: 20px; margin: 12px 0 0; font-size: 13.5px; font-weight: 700; }
  .status[data-tone="good"] { color: var(--mint); }
  .status[data-tone="bad"] { color: var(--bad); }
  .btn {
    margin-top: 12px; padding: 12px 22px; border: 0; border-radius: 999px; cursor: pointer; font-weight: 850; font-size: 15px;
    color: #fff; background: var(--pink); box-shadow: 0 0 0 2.5px var(--ink), 4px 5px 0 0 var(--ink);
    transition: transform .2s, box-shadow .2s;
  }
  [data-theme="dark"] .btn { box-shadow: 0 0 0 2px rgba(255, 211, 90, .6), 4px 5px 0 0 rgba(255, 211, 90, .4); }
  .btn:hover:not(:disabled) { transform: translate(-1px, -1px); }
  .btn:active:not(:disabled), .btn.press { transform: translate(3px, 4px); box-shadow: 0 0 0 2.5px var(--ink), 0 0 0 0 var(--ink); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
  .ticket { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 16px 8px 8px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 2px var(--line); animation: pop .6s cubic-bezier(.34, 1.7, .5, 1) both; text-align: left; }
  .ticket i { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--mint); }
  .ticket b { display: block; font-size: 14px; }
  .ticket span { font-size: 12.5px; color: var(--muted); }
  @keyframes pop { from { opacity: 0; transform: scale(.7) translateY(10px); } }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; }

  @media (max-width: 380px) { .card { padding: 18px 16px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <span class="kicker">Early access waitlist</span>
    <h1 id="title">You are <span class="pos" id="pos">#4,812</span> in line</h1>
    <p class="sub" id="sub">About nine weeks to go. An invite code from a friend lets you in today.</p>

    <svg class="scene" id="scene" viewBox="0 4 400 146" aria-hidden="true">
      <rect class="floor" x="0" y="124" width="400" height="26" rx="6"/>
      <path class="floorline" d="M6 124H394"/>
      <!-- door with light behind it -->
      <polygon class="rays" points="348,124 388,124 396,150 326,150"/>
      <rect class="frame" x="344" y="58" width="48" height="68" rx="5"/>
      <rect class="light" x="349" y="63" width="38" height="61" rx="2"/>
      <rect class="doorp" x="349" y="63" width="38" height="61" rx="2"/>
      <circle class="knob" cx="380" cy="96" r="2.6"/>
      <g class="sign"><rect x="337" y="40" width="62" height="14" rx="7"/><text x="368" y="49.6" text-anchor="middle">EARLY ACCESS</text></g>
      <g id="bunting"><path class="string" d="M6 10 Q200 34 394 10"/></g>
      <g id="people"></g>
      <!-- you -->
      <g id="you">
        <g class="tag"><rect x="-14" y="44" width="28" height="13" rx="6.5"/><text x="0" y="53.5" text-anchor="middle">YOU</text><path d="M-3 57h6l-3 4z" class="tagtip" fill="currentColor"/></g>
        <g class="squash" id="youBody">
          <rect x="-11" y="88" width="22" height="36" rx="10" fill="#ff4f8b"/>
          <circle cx="0" cy="77" r="10" fill="#ff86b0"/>
          <g class="eyes"><circle cx="-3.5" cy="76" r="1.7" fill="#1f1b2e"/><circle cx="3.5" cy="76" r="1.7" fill="#1f1b2e"/></g>
          <path d="M-3 81q3 2.4 6 0" fill="none" stroke="#1f1b2e" stroke-width="1.4" stroke-linecap="round"/>
        </g>
      </g>
    </svg>

    <div id="codeArea">
      <label class="label" id="codeLabel" for="c0">Got an invite code?</label>
      <div class="fieldwrap">
        <div class="boxes" id="boxes" role="group" aria-labelledby="codeLabel"></div>
        <div class="stamp" id="stamp" aria-hidden="true">NOT VALID</div>
      </div>
      <div class="chips">Try one:
        <button type="button" class="chip" data-code="NOOR2611">valid <code>NOOR-2611</code></button>
        <button type="button" class="chip" data-code="ZAIN1020">used <code>ZAIN-1020</code></button>
      </div>
      <button type="button" class="btn" id="go" disabled>Skip the line</button>
    </div>
    <div id="doneArea" hidden>
      <div class="ticket"><i aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3.5 9.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span><b>Early access unlocked</b>Invited by Noor Fatima</span></div>
      <div><button type="button" class="btn" id="back">Back to the waitlist</button></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const LEN = 8, START = 4812;
  // Demo invite codes: one that works and one a friend already used
  const CODES = { NOOR2611: "ok", ZAIN1020: "used" };
  const NS = "http://www.w3.org/2000/svg";

  const scene = $("scene"), you = $("you"), youBody = $("youBody"), boxesEl = $("boxes");
  const statusEl = $("status"), stamp = $("stamp"), goBtn = $("go");

  // ---- Cancellable waits ----
  const CANCEL = { cancelled: true };
  let gen = 0;
  const pause = (ms, g) => new Promise((ok, no) => setTimeout(() => (g === gen ? ok() : no(CANCEL)), ms));
  const anim = (ms, g) => pause(reduce ? Math.min(ms, 120) : ms, g);
  const quiet = (p) => p.catch((e) => { if (e !== CANCEL) throw e; });
  const restart = (el, cls) => { el.classList.remove(cls); void (el.offsetWidth || el.getBoundingClientRect()); el.classList.add(cls); };
  function tween(ms, g, fn) {
    if (reduce) { fn(1); return Promise.resolve(); }
    return new Promise((ok, no) => {
      const t0 = performance.now();
      const step = (now) => {
        if (g !== gen) return no(CANCEL);
        const t = Math.min(1, (now - t0) / ms);
        fn(t);
        if (t < 1) requestAnimationFrame(step); else ok();
      };
      requestAnimationFrame(step);
    });
  }
  function say(msg, tone) { statusEl.textContent = msg; statusEl.dataset.tone = tone || ""; }

  // ---- Draw the people in line (front of the line is nearest the door) ----
  const COLORS = [["#5aa9ff", "#9ccaff"], ["#2fc993", "#86e5c1"], ["#ffb020", "#ffd27a"], ["#9b7bff", "#c7b6ff"], ["#ff8a5c", "#ffbb9c"], ["#2ec4d6", "#8ce4ee"], ["#7bd65a", "#b6eba0"], ["#c58cff", "#e0c4ff"]];
  const SPOTS = [322, 288, 254, 220, 186, 152, 118, 84];
  const HOME = 40, FRONT = 340;
  const people = SPOTS.map((x, i) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + x + " 0)");
    const [body, head] = COLORS[i];
    const tall = i % 3 === 1 ? -4 : i % 3 === 2 ? 2 : 0;
    g.innerHTML =
      '<g class="bob" style="--d:-' + (i * 0.37).toFixed(2) + 's"><g class="squash">' +
      '<rect x="-11" y="' + (88 + tall) + '" width="22" height="' + (36 - tall) + '" rx="10" fill="' + body + '"/>' +
      '<circle cx="0" cy="' + (77 + tall) + '" r="10" fill="' + head + '"/>' +
      '<g class="eyes" style="--d:-' + (i * 0.9).toFixed(1) + 's"><circle cx="-5" cy="' + (76 + tall) + '" r="1.6" fill="#1f1b2e"/><circle cx="2" cy="' + (76 + tall) + '" r="1.6" fill="#1f1b2e"/></g>' +
      "</g></g>";
    $("people").append(g);
    return { el: g, sq: g.querySelector(".squash"), top: 67 + tall };
  });

  // ---- Party bunting along the same curve as its string ----
  const FLAGS = ["#ff4f8b", "#ffc93c", "#2fc993", "#5aa9ff", "#9b7bff", "#ff8a5c"];
  for (let k = 1; k < 18; k++) {
    const t = k / 18;
    const bx = (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * 200 + t * t * 394;
    const by = (1 - t) * (1 - t) * 10 + 2 * (1 - t) * t * 34 + t * t * 10;
    const f = document.createElementNS(NS, "path");
    f.setAttribute("class", "flag");
    f.setAttribute("d", "M" + (bx - 6).toFixed(1) + " " + by.toFixed(1) + "h12l-6 11z");
    f.setAttribute("fill", FLAGS[k % FLAGS.length]);
    f.style.setProperty("--d", "-" + (k * 0.23).toFixed(2) + "s");
    $("bunting").append(f);
  }

  // ---- Your position: x along the floor, y lift above it ----
  function placeYou(x, lift) { you.setAttribute("transform", "translate(" + x.toFixed(1) + " " + (-lift).toFixed(1) + ")"); }
  // the title is rewritten on success, so look the number up each time
  function setPos(n) {
    const el = $("pos");
    el.textContent = "#" + n.toLocaleString("en-US");
    restart(el, "bump");
  }

  // ---- Invite code boxes ----
  const cells = [], inputs = [];
  for (let i = 0; i < LEN; i++) {
    if (i === 4) { const d = document.createElement("span"); d.className = "dash"; d.setAttribute("aria-hidden", "true"); boxesEl.append(d); }
    const c = document.createElement("span");
    c.className = "cell";
    c.style.setProperty("--i", i);
    const inp = document.createElement("input");
    inp.id = "c" + i;
    inp.setAttribute("aria-label", "Invite code character " + (i + 1) + " of " + LEN);
    inp.autocomplete = i ? "off" : "one-time-code";
    inp.setAttribute("autocapitalize", "characters");
    inp.spellcheck = false;
    c.append(inp);
    boxesEl.append(c);
    cells.push(c); inputs.push(inp);
  }
  const vals = Array(LEN).fill("");
  const keep = (s) => String(s).toUpperCase().replace(/[^A-Z0-9]/g, "");
  let busy = false, done = false, tries = 4;
  function setCh(i, ch) {
    vals[i] = ch;
    inputs[i].value = ch;
    cells[i].classList.toggle("filled", !!ch);
    if (ch) restart(cells[i], "land");
    goBtn.disabled = !vals.every(Boolean) || busy;
  }
  function clearBoxes() { for (let i = 0; i < LEN; i++) setCh(i, ""); boxesEl.classList.remove("good", "check", "bad"); }
  function mark(i) { cells.forEach((c, n) => c.classList.toggle("cur", n === i && demoOn)); }
  function focusBox(i) { i = Math.max(0, Math.min(LEN - 1, i)); if (!demoOn) { inputs[i].focus(); inputs[i].select(); } }
  function fillFrom(start, text, auto) {
    let i = start;
    for (const ch of text) { if (i >= LEN) break; setCh(i++, ch); }
    focusBox(i);
    if (auto !== false) whenFull();
  }
  function whenFull() { if (!busy && !done && vals.every(Boolean)) quiet(redeem(gen)); }
  inputs.forEach((inp, i) => {
    inp.addEventListener("focus", () => requestAnimationFrame(() => inp.select()));
    inp.addEventListener("input", (e) => {
      if (busy || done) { inp.value = vals[i]; return; }
      const got = keep(inp.value);
      if (e.inputType === "insertText" && e.data && e.data.length === 1) {
        const ch = keep(e.data);
        if (!ch) { inp.value = vals[i]; return; }
        setCh(i, ch); focusBox(i + 1); whenFull();
      } else if (got.length > 1) {
        fillFrom(got.length >= LEN ? 0 : i, got);
      } else {
        setCh(i, got);
        if (got) { focusBox(i + 1); whenFull(); }
      }
    });
    inp.addEventListener("keydown", (e) => {
      if (busy || done) return;
      if (e.key === "Backspace") { e.preventDefault(); if (vals[i]) setCh(i, ""); else if (i > 0) { setCh(i - 1, ""); focusBox(i - 1); } }
      else if (e.key === "Delete") { e.preventDefault(); setCh(i, ""); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); focusBox(i - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); focusBox(i + 1); }
      else if (e.key === "Home") { e.preventDefault(); focusBox(0); }
      else if (e.key === "End") { e.preventDefault(); focusBox(LEN - 1); }
      else if (e.key === "Enter") { e.preventDefault(); whenFull(); }
    });
    inp.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy || done) return;
      const text = keep(e.clipboardData ? e.clipboardData.getData("text") : "");
      if (text) fillFrom(text.length >= LEN ? 0 : i, text);
      else say("That paste has no letters or numbers in it.", "bad");
    });
  });
  function lockBoxes(on) { inputs.forEach((b) => (b.disabled = on)); }

  // ---- Redeem ----
  async function redeem(g) {
    if (busy || done || !vals.every(Boolean)) return;
    busy = true;
    goBtn.disabled = true;
    mark(-1);
    lockBoxes(true);
    boxesEl.classList.add("check");
    youBody.classList.add("crouch");
    say("Checking the invite…");
    await anim(900, g);
    boxesEl.classList.remove("check");
    const kind = CODES[vals.join("")];
    if (kind === "ok") { boxesEl.classList.add("good"); await jump(g); return; }
    youBody.classList.remove("crouch");
    tries--;
    stamp.textContent = kind === "used" ? "ALREADY USED" : "NOT VALID";
    restart(stamp, "on");
    restart(boxesEl, "bad");
    restart(youBody, "no");
    say(kind === "used"
      ? "A friend's invite works once, and this one has been used. Ask for a new one."
      : tries > 0 ? "That invite code does not exist. Check the letters (" + tries + " tries left)." : "Too many tries. Wait a minute, then try again.", "bad");
    await anim(900, g);
    youBody.classList.remove("no");
    clearBoxes();
    if (tries <= 0) { await pause(demoOn ? 600 : 60000, g); tries = 4; say("You can try again now."); }
    lockBoxes(false);
    busy = false;
    focusBox(0);
  }

  // ---- The jump: bounce on every head to the front, the door opens, confetti ----
  async function jump(g) {
    youBody.classList.remove("crouch");
    say("Invite accepted. Hold on…", "good");
    scene.classList.add("jumping");
    const stops = SPOTS.slice().reverse();          // back of the line first
    let x = HOME, lift = 0;
    for (let k = 0; k < stops.length; k++) {
      const p = people[SPOTS.length - 1 - k];
      const tx = stops[k], tl = 124 - p.top;      // land on the head
      const x0 = x, l0 = lift, peak = Math.max(l0, tl) + 10;
      await tween(k === 0 ? 380 : 230, g, (t) => {
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const h = (1 - t) * (1 - t) * l0 + 2 * (1 - t) * t * peak + t * t * tl;
        placeYou(x0 + (tx - x0) * e, h);
      });
      x = tx; lift = tl;
      restart(p.sq, "hit");
      restart(youBody, "hit");
      setPos(Math.max(1, Math.round(START * Math.pow(1 - (k + 1) / stops.length, 1.6))));
    }
    // hop down in front of the door, which swings open
    scene.classList.add("open");
    const x0 = x, l0 = lift;
    await tween(420, g, (t) => {
      const h = (1 - t) * (1 - t) * l0 + 2 * (1 - t) * t * (l0 + 20) + 0;
      placeYou(x0 + (FRONT - x0) * t, Math.max(0, h));
    });
    placeYou(FRONT, 0);
    restart(youBody, "hit");
    setPos(1);
    await anim(250, g);
    confetti();
    // walk in through the door
    await tween(520, g, (t) => {
      placeYou(FRONT + 28 * t, 0);
      you.style.opacity = String(1 - t * 0.85);
    });
    done = true;
    busy = false;
    $("title").innerHTML = 'You are <span class="pos" id="pos">in!</span>';
    $("sub").textContent = "Noor Fatima's invite worked. Your early access starts right now.";
    $("codeArea").hidden = true;
    $("doneArea").hidden = false;
    say("Welcome in. We sent the details to your email.", "good");
    if (!demoOn) $("back").focus();
  }

  // ---- Confetti from the door ----
  function confetti() {
    if (reduce) return;
    const r = scene.querySelector(".frame").getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height * 0.3;
    const C = ["#ff4f8b", "#ffc93c", "#2fc993", "#5aa9ff", "#9b7bff", "#ff8a5c"];
    for (let n = 0; n < 60; n++) {
      const p = document.createElement("i");
      const w = 5 + Math.random() * 6, h = n % 2 ? w : w * 2.2;
      p.style.width = w + "px"; p.style.height = h + "px";
      p.style.background = C[n % C.length];
      p.style.borderRadius = n % 4 === 0 ? "50%" : "1.5px";
      $("fx").append(p);
      const a = -Math.PI / 2 + (Math.random() - 0.62) * 2.4, v = 120 + Math.random() * 170;
      const x1 = x0 + Math.cos(a) * v, y1 = y0 + Math.sin(a) * v;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) rotate(0) scale(.4)", opacity: 1 },
        { transform: "translate(" + x1 + "px," + y1 + "px) rotate(" + (180 + Math.random() * 360) + "deg) scale(1)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (x1 + (Math.random() - 0.5) * 80) + "px," + (y1 + 260) + "px) rotate(720deg) scale(.9)", opacity: 0 }
      ], { duration: 1700 + Math.random() * 900, easing: "cubic-bezier(.15,.7,.3,1)" }).onfinish = () => p.remove();
    }
  }

  // ---- Reset ----
  function reset() {
    busy = false; done = false; tries = 4;
    scene.classList.remove("open", "jumping");
    you.style.opacity = "1";
    youBody.classList.remove("crouch", "no", "hit");
    placeYou(HOME, 0);
    $("title").innerHTML = 'You are <span class="pos" id="pos">#4,812</span> in line';
    $("sub").textContent = "About nine weeks to go. An invite code from a friend lets you in today.";
    $("codeArea").hidden = false;
    $("doneArea").hidden = true;
    stamp.classList.remove("on");
    clearBoxes();
    lockBoxes(false);
    say("");
  }
  goBtn.addEventListener("click", () => quiet(redeem(gen)));
  $("back").addEventListener("click", () => { reset(); focusBox(0); });
  document.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
    if (busy || done) return;
    clearBoxes();
    fillFrom(0, chip.dataset.code);
  }));

  // ---- Auto-demo: type the code, bounce over the line, then try the used code next round ----
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); gen++; mark(-1); reset(); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) =>
    window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  async function runDemo() {
    const g = gen;
    round++;
    await pause(700, g);
    const text = round % 3 === 2 ? "ZAIN1020" : "NOOR2611";
    for (let i = 0; i < LEN; i++) { mark(i); await pause(110, g); setCh(i, text[i]); await pause(60, g); }
    mark(-1);
    goBtn.classList.add("press");
    await pause(160, g);
    goBtn.classList.remove("press");
    await redeem(g);
    await pause(done ? 2600 : 700, g);
    reset();
    demoTimer = setTimeout(() => quiet(runDemo()), 400);
  }

  reset();
  demoTimer = setTimeout(() => quiet(runDemo()), 250);
})();
</script>
</body>
</html>
