<!doctype html>
<!-- Chill & Craft · Lens · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · expanding search</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #eef2ea;
    --site: #ffffff;
    --bar: #ffffff;
    --ink: #17201a;
    --muted: #66705f;
    --line: #e2e8dc;
    --field: #f3f6ef;
    --accent: #3f6212;
    --lime: #d9f99d;
    --hl: #ecfccb;
    --skeleton: #edf1e8;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #070a10;
    --site: #0f1520;
    --bar: #121a27;
    --ink: #eef3e8;
    --muted: #94a3b8;
    --line: #243042;
    --field: #0b111b;
    --accent: #a3e635;
    --lime: #a3e635;
    --hl: rgba(163, 230, 53, .14);
    --skeleton: #182233;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    color: var(--ink);
    background: var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .site {
    width: min(100%, 720px);
    border-radius: 22px;
    background: var(--site);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px rgba(20, 40, 10, .45);
  }

  /* ---------- Header ---------- */
  .bar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 22px;
    height: 68px;
    padding: 0 16px 0 20px;
    border-bottom: 1px solid var(--line);
    border-radius: 22px 22px 0 0;
    background: var(--bar);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; transition: opacity .25s, transform .35s; }
  .logo i { width: 26px; height: 26px; border-radius: 8px 8px 8px 2px; background: var(--accent); display: block; }
  .links { display: flex; gap: 18px; font-size: 14px; transition: opacity .25s, transform .35s; }
  .links a { color: var(--muted); text-decoration: none; padding: 4px 0; background: linear-gradient(var(--accent), var(--accent)) 0 100% / 0 2px no-repeat; transition: color .2s, background-size .3s; }
  .links a:hover { color: var(--ink); background-size: 100% 2px; }
  .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .bar.searching .links, .bar.searching .logo { opacity: 0; transform: translateX(-16px); pointer-events: none; }
  @media (min-width: 640px) { .bar.searching .logo { opacity: 1; transform: none; } }
  @media (max-width: 559px) { .links { display: none; } }

  /* ---------- The search: a circle that opens into a pill ---------- */
  .search {
    position: absolute;
    right: 14px;
    top: 12px;
    width: 44px;
    height: 44px;
    z-index: 5;
    transition: width .6s cubic-bezier(.34, 1.36, .64, 1);
  }
  .search.open { width: min(360px, calc(100% - 28px)); }
  .pill {
    position: relative;
    display: flex;
    align-items: center;
    height: 44px;
    border-radius: 22px;
    background: var(--field);
    border: 1.5px solid var(--line);
    overflow: hidden;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .search:not(.open) .pill:hover { border-color: var(--accent); }
  .search.open .pill { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .toggle {
    position: relative;
    flex: none;
    width: 41px;
    height: 41px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    overflow: hidden;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .toggle svg { width: 20px; height: 20px; overflow: visible; transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
  .toggle .handle { transform-origin: 13px 13px; transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
  /* Glint across the lens on hover */
  .toggle::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 35%, rgba(255, 255, 255, .7) 50%, transparent 65%);
    transform: translateX(-120%);
  }
  .search:not(.open) .toggle:hover::after { transform: translateX(120%); transition: transform .6s ease; }
  .search:not(.open) .toggle:hover svg { transform: rotate(-14deg) scale(1.08); }
  .toggle:active { transform: scale(.88); }
  .search.open .toggle svg { transform: scale(.9); }
  .search.open .toggle .handle { transform: rotate(-20deg); }
  .search.busy .toggle svg { animation: scan .6s ease-in-out infinite alternate; }
  @keyframes scan { from { transform: rotate(-18deg) translateX(-2px); } to { transform: rotate(18deg) translateX(2px); } }
  .toggle:focus-visible, .clear:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  input[type="search"] {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 4px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    outline: none;
    opacity: 0;
    transform: translateX(10px);
    transition: opacity .25s, transform .4s cubic-bezier(.34, 1.56, .64, 1);
  }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  input[type="search"]::placeholder { color: var(--muted); }
  .search.open input[type="search"] { opacity: 1; transform: none; transition-delay: .12s; }
  .clear {
    flex: none;
    width: 34px;
    height: 34px;
    margin-right: 4px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transform: scale(.3) rotate(-180deg);
    transition: opacity .2s, transform .45s cubic-bezier(.34, 1.56, .64, 1), background .2s, color .2s;
    pointer-events: none;
  }
  .search.open .clear { opacity: 1; transform: none; pointer-events: auto; transition-delay: .18s; }
  .clear:hover { background: var(--hl); color: var(--ink); transform: rotate(90deg); }
  .clear:active { transform: rotate(90deg) scale(.85); }

  /* ---------- Suggestions ---------- */
  .list {
    position: absolute;
    left: 0;
    right: 0;
    top: 52px;
    margin: 0;
    padding: 6px;
    list-style: none;
    border-radius: 18px;
    background: var(--bar);
    border: 1px solid var(--line);
    box-shadow: 0 24px 40px -20px rgba(0, 0, 0, .35);
    transform-origin: top center;
    animation: listIn .35s cubic-bezier(.34, 1.4, .64, 1);
  }
  @keyframes listIn { from { opacity: 0; transform: translateY(-8px) scale(.97); } }
  .list[hidden] { display: none; }
  .list .head { padding: 6px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .list li[role="option"] {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    animation: itemIn .45s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: var(--d);
  }
  @keyframes itemIn { from { opacity: 0; transform: translateY(8px); } }
  .list li .cat { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .list li[aria-disabled="true"] { cursor: default; color: var(--muted); }
  .list mark { background: var(--lime); color: #1a2e05; border-radius: 3px; padding: 0 1px; }
  /* Sliding highlight behind the active suggestion */
  .hl {
    position: absolute;
    left: 6px;
    right: 6px;
    top: 0;
    height: 38px;
    border-radius: 12px;
    background: var(--hl);
    opacity: 0;
    transition: transform .35s cubic-bezier(.34, 1.4, .64, 1), height .25s, opacity .2s;
    pointer-events: none;
  }

  /* ---------- Page content and results ---------- */
  .page { padding: 20px; min-height: 260px; }
  .page h2 { margin: 0 0 4px; font-size: clamp(18px, 4.8vw, 22px); }
  .page .lead { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .tile { border-radius: 16px; border: 1px solid var(--line); padding: 10px; animation: itemIn .5s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: var(--d); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s; }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -14px rgba(0, 0, 0, .4); }
  .tile .pic { height: 74px; border-radius: 10px; margin-bottom: 8px; background: linear-gradient(110deg, var(--skeleton) 30%, var(--field) 50%, var(--skeleton) 70%) 0 0 / 300% 100%; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { to { background-position: -150% 0; } }
  .tile.real .pic { animation: none; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--field)), var(--field)); display: grid; place-items: center; font-size: 22px; font-weight: 800; color: var(--accent); }
  .tile .t { font-size: 13px; font-weight: 700; }
  .tile .p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .line { height: 9px; border-radius: 5px; background: var(--skeleton); margin-top: 6px; }
  .line.short { width: 55%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="site">
    <header class="bar" id="bar">
      <span class="logo"><i aria-hidden="true"></i>Bazaar Lane</span>
      <nav class="links" aria-label="Main">
        <a href="#new">New in</a>
        <a href="#women">Women</a>
        <a href="#men">Men</a>
        <a href="#home">Home</a>
      </nav>

      <div class="search" id="search">
        <form class="pill" id="form" role="search">
          <button type="button" class="toggle" id="toggle" aria-label="Open search" aria-expanded="false" aria-controls="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"/>
              <path class="handle" d="M15.5 15.5L21 21"/>
            </svg>
          </button>
          <input type="search" id="field" role="combobox" aria-label="Search the shop" aria-expanded="false" aria-controls="list" aria-autocomplete="list" autocomplete="off" tabindex="-1" placeholder="Search the shop">
          <button type="button" class="clear" id="clear" aria-label="Close search" tabindex="-1">×</button>
        </form>
        <ul class="list" id="list" role="listbox" aria-label="Suggestions" hidden></ul>
      </div>
    </header>

    <section class="page" id="page">
      <h2 id="resultsTitle">New this week</h2>
      <p class="lead" id="resultsLead">Tap the round search button in the corner to find something.</p>
      <div class="grid" id="grid">
        <div class="tile" style="--d:0ms"><div class="pic"></div><div class="line"></div><div class="line short"></div></div>
        <div class="tile" style="--d:60ms"><div class="pic"></div><div class="line"></div><div class="line short"></div></div>
        <div class="tile" style="--d:120ms"><div class="pic"></div><div class="line"></div><div class="line short"></div></div>
        <div class="tile" style="--d:180ms"><div class="pic"></div><div class="line"></div><div class="line short"></div></div>
      </div>
      <p class="sr" id="announce" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>
    </section>
  </div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const bar = $("bar");
  const search = $("search");
  const form = $("form");
  const toggle = $("toggle");
  const field = $("field");
  const clear = $("clear");
  const list = $("list");

  // ---- Demo catalogue (made-up shop) ----
  const ITEMS = [
    ["Ceiling fan, 56 inch", "Home", 12499], ["Pedestal fan", "Home", 8999], ["Exhaust fan", "Home", 3499],
    ["Lawn suit, 3 piece", "Women", 5490], ["Embroidered lawn shirt", "Women", 3290], ["Woollen shawl", "Women", 4590],
    ["Knit sweater", "Women", 4290], ["Cotton kurta", "Men", 2790], ["Leather sandals", "Men", 3999],
    ["Winter jacket", "Men", 7990], ["School bag", "Kids", 2199], ["Steel water bottle", "Kids", 1299],
    ["Desk lamp", "Home", 2899], ["Cushion covers, set of 4", "Home", 1890], ["Basmati rice, 5 kg", "Grocery", 2350],
    ["Green tea, 100 bags", "Grocery", 990], ["Phone cover", "Tech", 799], ["Power bank, 10000 mAh", "Tech", 4299],
    ["Wireless earbuds", "Tech", 5999]
  ];
  const POPULAR = ["fan", "lawn", "jacket", "earbuds"];
  const PHRASES = ["lawn suits", "ceiling fans", "school bags", "winter jackets"];
  const pkr = (n) => "PKR " + n.toLocaleString("en-US");
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 100) : ms));

  let isOpen = false;
  let options = [];      // current suggestion elements
  let active = -1;       // highlighted suggestion
  const hl = document.createElement("li");
  hl.className = "hl";
  hl.setAttribute("aria-hidden", "true");

  // ---- Open and close ----
  function open() {
    if (isOpen) return;
    isOpen = true;
    search.classList.add("open");
    bar.classList.add("searching");
    toggle.setAttribute("aria-expanded", "true");
    toggle.setAttribute("aria-label", "Search");
    field.tabIndex = 0;
    clear.tabIndex = 0;
    field.focus();
    typewriter();
    render();
  }
  function close(returnFocus) {
    if (!isOpen) return;
    isOpen = false;
    hideList();
    search.classList.remove("open");
    bar.classList.remove("searching");
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-label", "Open search");
    field.tabIndex = -1;
    clear.tabIndex = -1;
    if (returnFocus) toggle.focus();
  }
  function updateClear() {
    clear.setAttribute("aria-label", field.value ? "Clear search" : "Close search");
  }

  // ---- Animated placeholder that types product ideas ----
  let twTimer = 0;
  function typewriter() {
    clearTimeout(twTimer);
    if (reduce) return;
    let p = 0, i = 0, deleting = false;
    const tick = () => {
      if (!isOpen || field.value) { field.placeholder = "Search the shop"; return; }
      const word = PHRASES[p];
      i += deleting ? -1 : 1;
      field.placeholder = "Search " + word.slice(0, i);
      let delay = deleting ? 35 : 80;
      if (!deleting && i === word.length) { deleting = true; delay = 1300; }
      else if (deleting && i === 0) { deleting = false; p = (p + 1) % PHRASES.length; delay = 300; }
      twTimer = setTimeout(tick, delay);
    };
    twTimer = setTimeout(tick, 500);
  }

  // ---- Suggestions ----
  function matches(q) {
    return ITEMS.filter((it) => it[0].toLowerCase().includes(q) || it[1].toLowerCase().includes(q));
  }
  function highlight(text, q) {
    // Build "before <mark>match</mark> after" safely with text nodes
    const frag = document.createDocumentFragment();
    const at = q ? text.toLowerCase().indexOf(q) : -1;
    if (at < 0) { frag.append(text); return frag; }
    const mark = document.createElement("mark");
    mark.textContent = text.slice(at, at + q.length);
    frag.append(text.slice(0, at), mark, text.slice(at + q.length));
    return frag;
  }
  function addOption(content, cat, value, k) {
    const li = document.createElement("li");
    li.id = "opt-" + k;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", "false");
    li.style.setProperty("--d", k * 40 + "ms");
    const name = document.createElement("span");
    name.append(content);
    li.append(name);
    if (cat) {
      const c = document.createElement("span");
      c.className = "cat";
      c.textContent = cat;
      li.append(c);
    }
    li.dataset.value = value;
    li.addEventListener("pointerenter", () => setActive(k));
    li.addEventListener("pointerdown", (e) => e.preventDefault());   // keep focus in the field
    li.addEventListener("click", () => choose(k));
    list.append(li);
    options.push(li);
  }
  function render() {
    const q = field.value.trim().toLowerCase();
    list.textContent = "";
    list.append(hl);
    options = [];
    const head = document.createElement("li");
    head.className = "head";
    head.setAttribute("role", "presentation");
    if (!q) {
      head.textContent = "Popular searches";
      list.append(head);
      POPULAR.forEach((p, k) => addOption(p, "", p, k));
    } else {
      const hits = matches(q).slice(0, 6);
      head.textContent = hits.length ? "Products" : "No matches";
      list.append(head);
      hits.forEach((it, k) => addOption(highlight(it[0], q), pkr(it[2]), it[0], k));
      if (!hits.length) {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        li.setAttribute("aria-disabled", "true");
        li.style.setProperty("--d", "0ms");
        li.textContent = "Press Enter to search for “" + field.value.trim() + "” anyway";
        list.append(li);
      }
    }
    list.hidden = false;
    field.setAttribute("aria-expanded", "true");
    setActive(-1);
  }
  function hideList() {
    list.hidden = true;
    field.setAttribute("aria-expanded", "false");
    field.removeAttribute("aria-activedescendant");
    active = -1;
  }
  function setActive(k) {
    active = k;
    options.forEach((o, i) => o.setAttribute("aria-selected", String(i === k)));
    if (k < 0 || !options[k]) {
      hl.style.opacity = "0";
      field.removeAttribute("aria-activedescendant");
      return;
    }
    const o = options[k];
    hl.style.opacity = "1";
    hl.style.height = o.offsetHeight + "px";
    hl.style.transform = "translateY(" + o.offsetTop + "px)";   // the pill slides on a spring
    field.setAttribute("aria-activedescendant", o.id);
  }
  function choose(k) {
    const o = options[k];
    if (!o) return;
    field.value = o.dataset.value;
    updateClear();
    run(field.value);
  }

  // ---- Run a search (simulated) ----
  async function run(text) {
    const q = text.trim();
    hideList();
    if (!q) return;
    search.classList.add("busy");
    $("announce").textContent = "Searching for " + q + "…";
    await wait(700);
    search.classList.remove("busy");
    const hits = matches(q.toLowerCase());
    $("resultsTitle").textContent = hits.length ? hits.length + (hits.length === 1 ? " result" : " results") + " for “" + q + "”" : "Nothing found for “" + q + "”";
    $("resultsLead").textContent = hits.length ? "Fresh from the Bazaar Lane shelves." : "Try fan, lawn, jacket or earbuds.";
    const grid = $("grid");
    grid.textContent = "";
    hits.slice(0, 8).forEach((it, k) => {
      const tile = document.createElement("div");
      tile.className = "tile real";
      tile.style.setProperty("--d", k * 60 + "ms");
      const pic = document.createElement("div");
      pic.className = "pic";
      pic.textContent = it[0].charAt(0);
      const t = document.createElement("div");
      t.className = "t";
      t.textContent = it[0];
      const p = document.createElement("div");
      p.className = "p";
      p.textContent = it[1] + " · " + pkr(it[2]);
      tile.append(pic, t, p);
      grid.append(tile);
    });
    $("announce").textContent = $("resultsTitle").textContent;
  }

  // ---- Events ----
  toggle.addEventListener("click", () => {
    if (!isOpen) open();
    else run(field.value);
  });
  clear.addEventListener("click", () => {
    if (field.value) {
      field.value = "";
      updateClear();
      field.focus();
      render();
      typewriter();
    } else {
      close(true);
    }
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    run(field.value);
  });
  field.addEventListener("input", () => {
    updateClear();
    render();
    if (!field.value) typewriter();
  });
  field.addEventListener("focus", () => { if (isOpen && list.hidden) render(); });
  field.addEventListener("keydown", (e) => {
    const n = options.length;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (list.hidden) render();
      if (n) setActive((active + 1) % n);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (n) setActive(active <= 0 ? n - 1 : active - 1);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (active >= 0) choose(active);
      else run(field.value);
    } else if (e.key === "Escape") {
      e.preventDefault();
      if (!list.hidden) hideList();
      else close(true);
    } else if (e.key === "Tab") {
      hideList();
    }
  });
  // Click anywhere else to close
  document.addEventListener("pointerdown", (e) => {
    if (isOpen && !search.contains(e.target)) close(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isOpen && document.activeElement !== field) close(true);
  });
})();
</script>
</body>
</html>
