<!doctype html>
<!-- Chill & Craft · Orbitdesk · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbitdesk · Customer support help desk</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: cool lavender canvas, white cards, teal accent ---------- */
  :root {
    --bg: #ecebf7; --bg-a: rgba(171, 158, 246, .42); --bg-b: rgba(110, 214, 202, .26);
    --card: #ffffff; --card-2: #f7f6fd; --well: #efedf9; --edge: rgba(70, 60, 150, .08); --nav-bg: rgba(255, 255, 255, .72);
    --ink: #1d1a3a; --ink-2: #39355f; --muted: #6b678f; --faint: #a3a0c2;
    --line: rgba(52, 44, 120, .09); --line-2: rgba(52, 44, 120, .16); --grid: rgba(52, 44, 120, .07);
    --accent: #0c9a8f; --accent-2: #17b5a8; --accent-soft: #d8f3ef; --accent-deep: #0a7169; --accent-ink: #ffffff;
    --lav: #7563ec; --lav-2: #9a8cf5; --lav-soft: #e8e4fd; --lav-ink: #4a3bb5;
    --warn: #dc8f1f; --warn-soft: #fcefd8; --warn-ink: #93580a;
    --bad: #dd4b5a; --bad-soft: #fde3e5; --bad-ink: #a52433;
    --good: #0c9a8f; --good-soft: #d8f3ef;
    --ring: rgba(117, 99, 236, .32); --ring-glow: rgba(117, 99, 236, .14); --stage: radial-gradient(ellipse at 50% 52%, #f3f1ff 0%, #faf9ff 48%, rgba(255,255,255,0) 72%);
    --shadow: 0 1px 2px rgba(40, 32, 100, .05), 0 10px 28px -18px rgba(40, 32, 100, .32);
    --shadow-lift: 0 2px 6px rgba(40, 32, 100, .07), 0 22px 40px -22px rgba(40, 32, 100, .45);
    --radius: 16px; --radius-sm: 11px;
    --surface: #ffffff; --surface-2: #f4f2fc; --panel: #ffffff;
    --tip-bg: #1d1a3a; --tip-ink: #fff; --overlay: rgba(28, 22, 72, .3); --focus: #0c9a8f;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #12111f; --bg-a: rgba(117, 99, 236, .2); --bg-b: rgba(42, 196, 180, .1);
    --card: #1b1a2e; --card-2: #212036; --well: #26243d; --edge: rgba(200, 192, 255, .07); --nav-bg: rgba(30, 28, 50, .78);
    --ink: #eceaff; --ink-2: #c9c5ec; --muted: #9a96c2; --faint: #67638f;
    --line: rgba(210, 204, 255, .08); --line-2: rgba(210, 204, 255, .15); --grid: rgba(210, 204, 255, .07);
    --accent: #3cd3c3; --accent-2: #6ae2d5; --accent-soft: rgba(60, 211, 195, .14); --accent-deep: #6ae2d5; --accent-ink: #062a26;
    --lav: #a495ff; --lav-2: #c0b5ff; --lav-soft: rgba(164, 149, 255, .15); --lav-ink: #cdc4ff;
    --warn: #f2b25a; --warn-soft: rgba(242, 178, 90, .15); --warn-ink: #f7cd8f;
    --bad: #ff7683; --bad-soft: rgba(255, 118, 131, .15); --bad-ink: #ffa9b1;
    --good: #3cd3c3; --good-soft: rgba(60, 211, 195, .14);
    --ring: rgba(164, 149, 255, .3); --ring-glow: rgba(164, 149, 255, .1); --stage: radial-gradient(ellipse at 50% 52%, #262441 0%, #1e1d34 48%, rgba(27,26,46,0) 72%);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 24px 44px -20px rgba(0, 0, 0, .85);
    --surface: #1b1a2e; --surface-2: #24223a; --panel: #1d1c31;
    --tip-bg: #eceaff; --tip-ink: #17152b; --overlay: rgba(4, 3, 14, .6); --focus: #6ae2d5;
    color-scheme: dark;
  }
/* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
*, *::before, *::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
/* no sideways page scroll, whatever a wide header or an entrance animation does */
body{margin:0;overflow-x:clip;}
button, input, select, textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em;}
:focus-visible{outline:2px solid var(--focus, var(--accent));outline-offset:2px;}
.cc-av{--h:200;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;font-size:.8em;font-weight:700;color:hsl(var(--h) 60% 22%);background:hsl(var(--h) 70% 84%);flex:none;letter-spacing:.02em;}
[data-theme="dark"] .cc-av{color:hsl(var(--h) 80% 88%);background:hsl(var(--h) 35% 28%);}

/* Buttons used by dialogs (apps restyle .btn to fit their look) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:38px;padding:0 16px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;transition:transform .12s, background .2s, box-shadow .2s, border-color .2s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:translateY(1px) scale(.97);}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink, #fff);}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -8px var(--accent);}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:30px;padding:0 11px;font-size:.86em;}
.btn[disabled]{opacity:.5;pointer-events:none;}

/* Toasts */
.cc-toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:grid;gap:8px;width:min(340px, calc(100vw - 32px));pointer-events:none;}
.cc-toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm, 10px);background:var(--tip-bg, #111);color:var(--tip-ink, #fff);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-size:.92rem;animation:ccToast .35s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto;}
.cc-toast .ic{color:var(--good);}
.cc-toast.bad .ic{color:var(--bad);}
.cc-toast.warn .ic{color:var(--warn);}
.cc-toast.out{animation:ccToastOut .3s ease forwards;}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.96);}}
@keyframes ccToastOut{to{opacity:0;transform:translateX(30px);}}

/* Modal + drawer */
.cc-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;}
.cc-back{position:absolute;inset:0;background:var(--overlay, rgba(10,12,20,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;}
.cc-dialog{position:relative;width:min(480px, 100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel, var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius, 16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1);}
.cc-dialog.wide{width:min(720px, 100%);}
.cc-overlay.open .cc-back{opacity:1;}
.cc-overlay.open .cc-dialog{opacity:1;transform:none;}
.cc-overlay.is-drawer{place-items:stretch end;padding:0;}
.cc-overlay.is-drawer .cc-dialog{width:min(440px, 100%);height:100%;max-height:none;border-radius:var(--radius, 16px) 0 0 var(--radius, 16px);transform:translateX(40px);}
.cc-overlay.is-drawer.open .cc-dialog{transform:none;}
.cc-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:1;}
.cc-dh h2{margin:0;font-size:1.12rem;}
.cc-x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;}
.cc-x:hover{background:var(--surface-2);}
.cc-db{padding:8px 20px 20px;}
.cc-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap;}
.cc-db .cc-df{padding:14px 0 0;}
.cc-confirm{margin:6px 0 0;color:var(--muted);line-height:1.5;}
.cc-picks{display:grid;gap:6px;}
.cc-pick{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);}
.cc-pick:hover, .cc-pick:focus-visible{border-color:var(--accent);}
.cc-pick small{margin-left:auto;color:var(--muted);}

/* Forms */
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.cc-field{display:grid;gap:5px;grid-column:span 2;}
.cc-field.half{grid-column:span 1;}
.cc-field label{font-size:.84rem;font-weight:600;color:var(--muted);}
.cc-field input, .cc-field select, .cc-field textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
.cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
.cc-field [aria-invalid="true"]{border-color:var(--bad);}
.cc-err{color:var(--bad);font-size:.8rem;min-height:0;}
.cc-err:empty{display:none;}
.cc-hint{color:var(--muted);font-size:.78rem;}
.cc-intro{margin:0 0 12px;color:var(--muted);}
.cc-form.shake{animation:ccShake .35s;}
@keyframes ccShake{25%{transform:translateX(-6px);} 50%{transform:translateX(5px);} 75%{transform:translateX(-3px);}}
@media (max-width:480px){.cc-field.half{grid-column:span 2;}}

/* Popover + tooltip */
.cc-pop{position:fixed;z-index:85;max-height:70vh;overflow:auto;background:var(--panel, var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm, 12px);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px);transition:opacity .2s, transform .25s;}
.cc-pop.open{opacity:1;transform:none;}
.cc-tip{position:fixed;z-index:95;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg, #111);color:var(--tip-ink, #fff);font-size:.8rem;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;}
.cc-tip.on{opacity:1;}
.cc-tip b{display:block;margin-bottom:3px;}
.cc-tip div{display:flex;align-items:center;gap:6px;}
.cc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.cc-tip em{margin-left:auto;padding-left:10px;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;}

/* Command search */
.cc-cmdk .cc-dialog{align-self:start;margin-top:10vh;}
.cc-cmdk-q{width:100%;min-height:46px;padding:0 14px;border-radius:var(--radius-sm, 10px);border:1px solid var(--accent);background:var(--surface-2);font-size:1rem;}
.cc-cmdk-q:focus{outline:none;}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto;}
.cc-cmdk-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;}
.cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover{background:var(--surface-2);color:var(--accent);}
.cc-cmdk-list small{margin-left:auto;color:var(--muted);}
.cc-cmdk-foot{margin:10px 0 0;font-size:.76rem;color:var(--muted);}
.cc-cmdk-foot kbd{padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid var(--line);font-family:inherit;}
.cc-empty-li{color:var(--muted);cursor:default !important;}

/* Data table */
.cc-tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
.cc-search{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:320px;min-height:38px;padding:0 12px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);}
.cc-search:focus-within{border-color:var(--accent);}
.cc-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap;}
.cc-chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;transition:background .2s, color .2s;}
.cc-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink, #fff);border-color:transparent;}
.cc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cc-tbl table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px;}
.cc-tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.cc-tbl th button{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;}
.cc-tbl th svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5;}
.cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg{opacity:1;color:var(--accent);}
.cc-tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.cc-tbl tbody tr{animation:ccRow .35s both;animation-delay:calc(var(--r, 0) * 25ms);transition:background .15s;}
.cc-tbl tbody tr[tabindex="0"]{cursor:pointer;}
.cc-tbl tbody tr[tabindex="0"]:hover{background:var(--surface-2);}
.cc-tbl .r, .cc-tbl th.r{text-align:right;font-variant-numeric:tabular-nums;}
.cc-tbl th.r button{flex-direction:row-reverse;}
@keyframes ccRow{from{opacity:0;transform:translateY(6px);}}
.cc-pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.84rem;color:var(--muted);}
.cc-pages{display:flex;gap:4px;align-items:center;}
.cc-pages button{min-width:32px;height:32px;padding:0 6px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);}
.cc-pages button[aria-current="page"]{background:var(--accent);color:var(--accent-ink, #fff);border-color:transparent;}
.cc-pages button:disabled{opacity:.4;cursor:default;}
.cc-empty{display:grid;place-items:center;align-content:center;gap:6px;padding:28px 12px;text-align:center;color:var(--muted);}
.cc-empty .ic{width:30px;height:30px;opacity:.6;}
.cc-empty b{color:var(--ink);}

/* Charts */
.cc-chart{display:block;overflow:visible;}
.cc-chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums;}
.cc-grid line{stroke:var(--grid, var(--line));stroke-dasharray:3 4;}
.cc-zero{stroke:var(--line);}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards;}
.cc-fade{animation:ccFade .9s .3s both;}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both;transition:opacity .2s;}
.cc-bar.neg{transform-origin:50% 0;}
.cc-cell{animation:ccPop .5s both;transform-box:fill-box;transform-origin:center;}
.cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell{animation:none;stroke-dashoffset:0;}
.cc-guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;}
.cc-guide.on{opacity:.7;}
.cc-dot{opacity:0;stroke:var(--surface);stroke-width:2;}
.cc-dot.on{opacity:1;}
.cc-hit.on{fill:var(--ink);fill-opacity:.05;}
@keyframes ccDraw{to{stroke-dashoffset:0;}}
@keyframes ccFade{from{opacity:0;}}
@keyframes ccGrow{from{transform:scaleY(0);}}
@keyframes ccPop{from{opacity:0;transform:scale(.4);}}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted);}
.cc-legend span{display:inline-flex;align-items:center;gap:6px;}
.cc-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
.cc-spark{display:block;overflow:visible;}
.cc-spark .cc-line{stroke-width:1.8;}

/* Page entrance (apps can swap the keyframes via --enter) */
.cc-in{animation:var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 55ms);}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985);}}

/* Reduced motion:everything still works, without big movement */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
  .cc-draw{stroke-dashoffset:0;}
}

/* ===================== Orbitdesk: app styles ===================== */
html{background:var(--bg);}
body{font:13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 640px at 6% -8%, var(--bg-a), transparent 62%), radial-gradient(900px 620px at 104% 104%, var(--bg-b), transparent 60%), var(--bg);background-attachment:fixed;}
a{color:inherit;}
h1, h2, h3{letter-spacing:-.015em;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}

/* ---------- Buttons and small controls ---------- */
.btn{min-height:36px;padding:0 14px;border-radius:11px;font-size:13px;border-color:var(--line-2);background:var(--card);box-shadow:0 1px 2px rgba(30,20,80,.05);}
.btn.primary{background:var(--accent);box-shadow:0 8px 18px -10px var(--accent);}
.btn.lav{background:var(--lav);color:#fff;border-color:transparent;}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:9px;}
.btn .ic{width:15px;height:15px;}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);transition:color .2s, border-color .2s, background .2s;}
.ibtn:hover{color:var(--ink);border-color:var(--line-2);}
.ibtn .ic{width:16px;height:16px;}
.inp, .sel{height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font-size:12.5px;min-width:0;}
.inp:focus, .sel:focus, .area:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);}
.area{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);resize:vertical;font-size:13px;line-height:1.5;}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--well);border:1px solid var(--line);}
.seg button{height:26px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(30,20,80,.12);}
[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--card-2);}
.sw{position:relative;width:36px;height:21px;flex:none;border-radius:999px;border:0;background:var(--line-2);transition:background .25s;padding:0;}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.9,.3,1.2);}
.sw[aria-checked="true"]{background:var(--accent);}
.sw[aria-checked="true"]::after{transform:translateX(15px);}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:var(--well);color:var(--ink-2);font-size:11.5px;font-weight:600;white-space:nowrap;}
.tag .ic{width:12px;height:12px;}
.tag.q{--h:262;background:hsl(var(--h) 80% 95%);color:hsl(var(--h) 45% 34%);}
[data-theme="dark"] .tag.q{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 70% 82%);}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;}
.pri::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c, var(--faint));}
.pri.urgent{--c:var(--bad);} .pri.high{--c:var(--warn);} .pri.normal{--c:var(--lav);} .pri.low{--c:var(--faint);}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c, var(--accent));flex:none;}
.st-online{--c:#1fbf7a;} .st-away{--c:var(--warn);} .st-offline{--c:var(--faint);}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;border:1px solid var(--line-2);background:var(--card-2);font:600 10.5px/1 inherit;color:var(--muted);}

/* ---------- Avatars: photos are zoomed and centred on the face ---------- */
.av{position:relative;display:inline-block;width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;background:var(--well);vertical-align:middle;}
.av img{display:block;width:100%;height:100%;object-fit:cover;transform:translate(var(--tx, 0), var(--ty, 0)) scale(var(--z, 1));}
.av.ini{display:inline-grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:hsl(var(--h) 55% 26%);background:hsl(var(--h) 70% 87%);}
[data-theme="dark"] .av.ini{color:hsl(var(--h) 80% 86%);background:hsl(var(--h) 32% 28%);}
.av.xs{width:22px;height:22px;font-size:9px;} .av.s{width:26px;height:26px;font-size:10px;} .av.m{width:36px;height:36px;font-size:12px;} .av.l{width:46px;height:46px;font-size:15px;} .av.xl{width:64px;height:64px;font-size:20px;}
.avs{position:relative;display:inline-flex;flex:none;}
.avs .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border:2px solid var(--card);}

/* ---------- Top bar with a pill nav ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:68px;padding:0 24px;}
.top::before{content:"";position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 80%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);opacity:0;transition:opacity .25s;}
.scrolled .top::before{opacity:1;}
.brand{position:relative;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none;}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#1d1a3a;box-shadow:0 8px 18px -10px rgba(29,26,58,.8);}
[data-theme="dark"] .logo{background:#2c2950;}
.logo svg{width:24px;height:24px;overflow:visible;}
.logo .sat{animation:satSpin 9s linear infinite;transform-origin:12px 12px;}
@keyframes satSpin{to{transform:rotate(360deg);}}
.brand b{display:block;font-size:17px;font-weight:750;letter-spacing:-.025em;line-height:1.1;}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;}
.pill{position:relative;display:flex;gap:2px;padding:4px;margin:0 auto;border-radius:15px;background:var(--nav-bg);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.pill a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:560;font-size:13px;white-space:nowrap;transition:color .25s;}
.pill a:hover{color:var(--ink);}
.pill a .ic{width:16px;height:16px;opacity:.8;}
.pill a[aria-current="page"]{color:var(--accent-ink);}
.pill a[aria-current="page"] .ic{opacity:1;}
.pill .marker{position:absolute;z-index:0;top:4px;left:0;height:36px;border-radius:11px;background:var(--accent);box-shadow:0 8px 18px -8px var(--accent);transition:transform .38s cubic-bezier(.3,.9,.25,1), width .38s cubic-bezier(.3,.9,.25,1), opacity .2s;}
.nbadge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--bad);color:#fff;}
.nbadge.calm{background:var(--lav-soft);color:var(--lav-ink);}
.pill a[aria-current="page"] .nbadge{background:rgba(255,255,255,.25);color:inherit;}
.tools{position:relative;display:flex;align-items:center;gap:8px;flex:none;}
.tbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);box-shadow:var(--shadow);transition:transform .15s, color .2s;}
.tbtn:hover{color:var(--accent);transform:translateY(-1px);}
.tbtn .ic{width:18px;height:18px;}
.tbtn .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);}
.tbtn .cnt:empty{display:none;}
.search-btn{width:auto;padding:0 10px 0 12px;gap:8px;display:flex;align-items:center;color:var(--muted);font-size:12.5px;}
.me{padding:2px;border-radius:13px;}
.me .av{width:34px;height:34px;border-radius:10px;}
[data-theme="dark"] .t-sun, [data-theme="light"] .t-moon{display:none;}
.menu-btn{display:none;}

/* ---------- Mobile drawer + bottom bar ---------- */
.scrim{position:fixed;inset:0;z-index:58;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s;}
.nav-open .scrim{opacity:1;pointer-events:auto;}
.drawer-nav{position:fixed;z-index:59;top:0;bottom:0;left:0;width:min(280px, 84vw);padding:18px 14px;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .3s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;gap:4px;overflow:auto;}
.nav-open .drawer-nav{transform:none;}
.drawer-nav a{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:11px;text-decoration:none;color:var(--ink-2);font-weight:600;}
.drawer-nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep);}
.drawer-nav .brand{margin:0 6px 14px;}
.bbar{display:none;}

/* ---------- Page frame ---------- */
.view{max-width:1680px;margin:0 auto;padding:6px 24px 36px;outline:none;transition:opacity .16s, transform .16s;}
.view.leave{opacity:0;transform:translateY(6px);}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 16px;}
.phead h1{margin:0;font-size:30px;line-height:1.15;font-weight:760;letter-spacing:-.028em;}
.phead .sub{margin:5px 0 0;color:var(--muted);font-size:13px;}
.phead .sub b{color:var(--ink);font-weight:650;}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin:2px 0 6px;}
.crumbs a{text-decoration:none;}
.crumbs a:hover{color:var(--accent);}
.crumbs .ic{width:12px;height:12px;}

/* ---------- Cards ---------- */
.card{position:relative;min-width:0;background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;}
.card.lift, .lift{transition:transform .22s cubic-bezier(.3,.9,.3,1), box-shadow .22s;}
.card.lift:hover, .lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:28px;}
.ch h2, .ch h3{margin:0;font-size:14px;font-weight:660;display:flex;align-items:center;gap:8px;min-width:0;}
.ch h2 small, .ch h3 small{font-size:12px;font-weight:500;color:var(--muted);}
.ch .go{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;color:var(--muted);text-decoration:none;border:1px solid transparent;transition:background .2s, color .2s, border-color .2s;}
.ch .go:hover{color:var(--accent);border-color:var(--line);background:var(--card-2);}
.ch .go .ic{width:15px;height:15px;}
.sep{height:1px;background:var(--line);margin:10px 0;}
.empty-note{padding:18px 8px;text-align:center;color:var(--muted);}
.link{display:inline-flex;align-items:center;gap:5px;color:var(--accent-deep);font-weight:650;text-decoration:none;font-size:12.5px;background:none;border:0;padding:0;}
.link:hover{text-decoration:underline;}
.link .ic{width:14px;height:14px;}

/* ---------- Signature 1: SLA timers that tick and change colour ---------- */
.sla{--c:var(--accent);--cs:var(--accent-soft);--ci:var(--accent-deep);display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 5px;border-radius:999px;background:var(--cs);color:var(--ci);font-size:12px;font-weight:680;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .6s, color .6s;}
.sla i{width:14px;height:14px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p, 1) * 360deg), color-mix(in srgb, var(--c) 20%, transparent) 0);-webkit-mask:radial-gradient(circle, transparent 3.6px, #000 4.1px);mask:radial-gradient(circle, transparent 3.6px, #000 4.1px);transition:background .6s;}
.sla.soon{--c:var(--warn);--cs:var(--warn-soft);--ci:var(--warn-ink);}
.sla.breach{--c:var(--bad);--cs:var(--bad-soft);--ci:var(--bad-ink);animation:slaPulse 1.8s ease-in-out infinite;}
.sla.paused{--c:var(--faint);--cs:var(--well);--ci:var(--muted);}
.sla.done{--c:var(--lav);--cs:var(--lav-soft);--ci:var(--lav-ink);}
.sla.flash{animation:slaFlash .8s ease;}
@keyframes slaPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb, var(--bad) 18%, transparent);}}
@keyframes slaFlash{30%{transform:scale(1.14);box-shadow:0 0 0 6px color-mix(in srgb, var(--c) 25%, transparent);}}

/* ---------- Overview: hero with the orbit ---------- */
.hero{display:grid;grid-template-columns:236px minmax(0, 1fr) 296px;grid-template-rows:minmax(0, 1fr);gap:18px;padding:16px;height:474px;}
.h-left{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;}
.hello .lbl{display:block;}
.hello h1{margin:3px 0 0;font-size:17px;line-height:1.2;font-weight:740;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hello p{margin:3px 0 0;color:var(--muted);font-size:12px;}
.kpi{position:relative;border-radius:13px;padding:11px 12px;background:var(--card-2);border:1px solid var(--line);overflow:hidden;}
.kpi > span{display:block;font-size:12px;color:var(--muted);font-weight:560;}
.kpi b.big{display:block;font-size:28px;line-height:1.15;font-weight:760;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px;}
.kpi b.big small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px;}
.kpi small.k{color:var(--muted);font-size:11.5px;}
.kpi em{font-style:normal;font-weight:700;}
.kpi .up{color:var(--bad-ink);} .kpi .dn{color:var(--accent-deep);}
.kpi.k1{background:linear-gradient(150deg, var(--lav-soft), var(--card-2) 70%);}
.kpi.k1 .cc-spark{position:absolute;right:10px;top:16px;}
.minis{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:11.5px;color:var(--muted);}
.minis span{display:inline-flex;align-items:center;gap:5px;}
.minis i{width:8px;height:8px;border-radius:50%;background:var(--c);}
.tbar{height:6px;border-radius:4px;background:var(--well);overflow:hidden;margin:7px 0 4px;}
.tbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg, var(--accent), var(--accent-2));transform-origin:left;animation:barIn 1s .3s cubic-bezier(.2,.8,.2,1) both;}
@keyframes barIn{from{transform:scaleX(0);}}
.h-mid{display:flex;flex-direction:column;min-width:0;min-height:0;}
.o-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.o-head h2{margin:0;font-size:15px;font-weight:700;}
.o-head h2 span{color:var(--accent-deep);}
.o-head p{margin:2px 0 0;color:var(--muted);font-size:12px;}
.o-tools{display:flex;gap:6px;align-items:center;flex:none;}
.o-pick{display:flex;gap:6px;margin:10px 0 0;overflow-x:auto;scrollbar-width:none;padding:2px;}
.o-pick::-webkit-scrollbar{display:none;}
.o-pick button{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none;transition:border-color .2s, background .2s, box-shadow .2s;}
.o-pick button:hover{border-color:var(--line-2);}
.o-pick button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);}
.o-pick .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--well);color:var(--ink-2);}
.o-pick .n.hot{background:var(--bad);color:#fff;}
.orbit{position:relative;isolation:isolate;flex:1;min-height:250px;margin-top:6px;border-radius:14px;overflow:hidden;background:var(--stage);}
.orbit svg.rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.orbit .rg{fill:none;stroke:var(--ring);stroke-width:1.2;stroke-dasharray:2 7;stroke-linecap:round;}
.orbit .rg.g{stroke:var(--ring-glow);stroke-width:14;stroke-dasharray:none;}
.orbit .rl{font-size:10.5px;fill:var(--muted);font-weight:600;letter-spacing:.04em;}
.orbit .star{fill:var(--lav-2);opacity:.45;}
.core{position:absolute;left:50%;top:50%;z-index:400;display:grid;justify-items:center;gap:2px;transform:translate(-50%, -50%);text-align:center;pointer-events:none;}
.core .ph{position:relative;width:78px;height:78px;}
.core .ph .av{position:absolute;inset:7px;width:auto;height:auto;box-shadow:0 10px 24px -10px rgba(30,20,90,.6);}
.core .ph svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.core .ph circle{fill:none;stroke-width:4;stroke-linecap:round;}
.core .ph .trk{stroke:var(--well);}
.core .ph .val{stroke:var(--accent);transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.2,1);}
.core b{font-size:13px;font-weight:700;margin-top:4px;text-shadow:0 1px 0 var(--card);}
.core small{font-size:11px;color:var(--muted);}
.oc{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 5px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);box-shadow:0 8px 16px -10px rgba(30,20,90,.45);font-size:11.5px;font-weight:650;white-space:nowrap;will-change:transform;transition:border-color .5s, box-shadow .2s;--c:var(--accent);}
.oc i{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p, 1) * 360deg), color-mix(in srgb, var(--c) 20%, transparent) 0);-webkit-mask:radial-gradient(circle, transparent 3.6px, #000 4.1px);mask:radial-gradient(circle, transparent 3.6px, #000 4.1px);}
.oc em{font-style:normal;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
.oc.soon{--c:var(--warn);border-color:color-mix(in srgb, var(--warn) 55%, transparent);}
.oc.soon em{color:var(--warn-ink);}
.oc.breach{--c:var(--bad);border-color:var(--bad);background:color-mix(in srgb, var(--bad-soft) 70%, var(--card));}
.oc.breach em{color:var(--bad-ink);}
.oc.breach::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--bad);opacity:0;animation:ocPing 1.8s ease-out infinite;}
.oc.paused{--c:var(--faint);opacity:.86;}
.oc:hover, .oc:focus-visible{box-shadow:0 10px 22px -8px rgba(30,20,90,.55);border-color:var(--accent);}
.oc.more{background:var(--well);color:var(--muted);}
@keyframes ocPing{0%{opacity:.7;transform:scale(.92);}100%{opacity:0;transform:scale(1.25);}}
.o-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11.5px;color:var(--muted);}
.o-legend span{display:inline-flex;align-items:center;gap:6px;}
.o-legend i{width:9px;height:9px;border-radius:50%;background:var(--c);}

/* Live feed */
.feed{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);padding-left:16px;}
.feed .ch{margin-bottom:6px;}
.live{display:inline-flex;align-items:center;gap:7px;}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#1fbf7a;box-shadow:0 0 0 0 rgba(31,191,122,.5);animation:livePulse 1.8s infinite;}
.live.off::before{background:var(--faint);animation:none;}
@keyframes livePulse{70%{box-shadow:0 0 0 7px rgba(31,191,122,0);}100%{box-shadow:0 0 0 0 rgba(31,191,122,0);}}
.fl{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;-webkit-mask-image:linear-gradient(#000 78%, transparent);mask-image:linear-gradient(#000 78%, transparent);}
.fi{flex:none;}
.fi{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:10px;transition:background .2s;}
.fi:hover{background:var(--card-2);}
.fi .fic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--well);color:var(--ink-2);}
.fi .fic .ic{width:14px;height:14px;}
.fi .fic.new{background:var(--lav-soft);color:var(--lav-ink);}
.fi .fic.breach{background:var(--bad-soft);color:var(--bad-ink);}
.fi .fic.csat, .fi .fic.solved{background:var(--accent-soft);color:var(--accent-deep);}
.fi .fic.rule{background:var(--warn-soft);color:var(--warn-ink);}
.fi p{margin:0;font-size:12.5px;line-height:1.38;min-width:0;}
.fi p a{font-weight:650;text-decoration:none;color:var(--accent-deep);}
.fi small{display:block;color:var(--faint);font-size:11px;margin-top:1px;}
.fi.hl{background:var(--bad-soft);}
.fi.enter{animation:feedIn .55s cubic-bezier(.2,.9,.3,1.1) both;}
@keyframes feedIn{from{opacity:0;transform:translateY(-12px) scale(.98);max-height:0;padding-top:0;padding-bottom:0;}to{max-height:80px;}}
.feed .foot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line);margin-top:6px;}

/* Overview rows */
.row4{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px;margin-top:16px;}
.row4 > .card{min-height:236px;}
.row2{display:grid;grid-template-columns:minmax(0, 1.7fr) minmax(0, 1fr);gap:16px;margin-top:16px;}
.dn-list{list-style:none;margin:0;padding:0;display:grid;gap:2px;}
.dn-list a{display:grid;grid-template-columns:auto minmax(0, 1fr) auto;gap:9px;align-items:center;padding:7px 6px;border-radius:10px;text-decoration:none;transition:background .2s;}
.dn-list a:hover{background:var(--card-2);}
.dn-list .t{min-width:0;}
.dn-list .t b{display:block;font-weight:620;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dn-list .t small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.qrow{display:grid;grid-template-columns:28px minmax(0, 1fr) auto;gap:10px;align-items:center;padding:6px 0;}
.qrow .qi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:hsl(var(--h) 80% 95%);color:hsl(var(--h) 50% 38%);}
[data-theme="dark"] .qrow .qi{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 70% 78%);}
.qrow .qi .ic{width:15px;height:15px;}
.qrow b{font-weight:620;font-size:12.5px;}
.qrow .qb{height:5px;border-radius:3px;background:var(--well);margin-top:4px;overflow:hidden;}
.qrow .qb i{display:block;height:100%;border-radius:3px;background:hsl(var(--h) 60% 60%);transform-origin:left;animation:barIn .9s cubic-bezier(.2,.8,.2,1) both;}
.qrow .qn{text-align:right;font-variant-numeric:tabular-nums;}
.qrow .qn b{display:block;font-size:14px;}
.qrow .qn small{color:var(--muted);font-size:11px;}
.csat-big{display:flex;align-items:baseline;gap:8px;}
.csat-big b{font-size:34px;font-weight:780;letter-spacing:-.035em;line-height:1;}
.csat-big small{color:var(--muted);}
.dist{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0 6px;}
.dist i{display:block;height:100%;transform-origin:left;animation:barIn .9s cubic-bezier(.2,.8,.2,1) both;}
.dist-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.quote{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:12.5px;line-height:1.45;}
.quote footer{display:flex;align-items:center;gap:7px;margin-top:7px;color:var(--muted);font-size:11.5px;}
.stars{color:#f0b03a;letter-spacing:1px;font-size:12px;}
.big-n{display:flex;gap:18px;margin-bottom:10px;}
.big-n div b{display:block;font-size:24px;font-weight:760;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;}
.big-n div small{color:var(--muted);font-size:11.5px;}
.runs{list-style:none;margin:0;padding:0;display:grid;gap:4px;}
.runs li{display:grid;grid-template-columns:24px minmax(0, 1fr) auto;gap:9px;align-items:center;padding:5px 0;}
.runs .ok{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);}
.runs .ok.skip{background:var(--well);color:var(--muted);}
.runs .ok .ic{width:13px;height:13px;}
.runs b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.runs small{color:var(--muted);font-size:11.5px;}
.mini-stats{display:flex;gap:18px;font-size:12px;color:var(--muted);}
.mini-stats b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;}
.gantt{display:grid;gap:7px;}
.gantt .gr{display:grid;grid-template-columns:118px minmax(0, 1fr);gap:10px;align-items:center;font-size:12px;}
.gantt .gn{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.gantt .gt{position:relative;height:22px;border-radius:7px;background:var(--card-2);border:1px solid var(--line);overflow:hidden;}
.gantt .gb{position:absolute;top:3px;bottom:3px;border-radius:5px;background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 75%, transparent), var(--accent-2));transform-origin:left;animation:barIn .9s cubic-bezier(.2,.8,.2,1) both;display:flex;align-items:center;padding:0 7px;color:#fff;font-size:10.5px;font-weight:650;white-space:nowrap;overflow:hidden;}
.gantt .gb.away{background:linear-gradient(90deg, color-mix(in srgb, var(--warn) 70%, transparent), var(--warn));}
.gantt .gb.off{background:var(--line-2);color:var(--muted);}
.gantt .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad);border-radius:2px;}
.gantt .ax{display:flex;justify-content:space-between;color:var(--faint);font-size:10.5px;margin-left:128px;}

/* ---------- Inbox ---------- */
.inbox{display:grid;grid-template-columns:218px minmax(0, 1fr);gap:16px;align-items:start;}
.views{padding:10px;position:sticky;top:80px;}
.views h3{margin:6px 8px 6px;}
.vlist{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:1px;min-width:0;}
.vlist li{min-width:0;}
.vlist button{width:100%;min-width:0;overflow:hidden;display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border-radius:9px;border:0;background:transparent;color:var(--ink-2);font-weight:560;font-size:12.5px;text-align:left;transition:background .15s;}
.vlist button:hover{background:var(--card-2);}
.vlist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:650;}
.vlist button .ic{width:15px;height:15px;opacity:.8;}
.vlist button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vlist button em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}
.vlist button em.hot{color:#fff;background:var(--bad);padding:1px 6px;border-radius:8px;}
.vlist .qd{width:9px;height:9px;border-radius:3px;background:hsl(var(--h) 60% 60%);}
.tl-card{padding:0;overflow:hidden;}
.tl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);}
.tl-bar .cc-search{max-width:260px;min-height:34px;background:var(--card-2);border-color:var(--line-2);}
.tl-bar .grow{flex:1;}
.bulk{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--lav-soft);}
.bulk.on{display:flex;animation:ccRow .25s both;}
.bulk b{color:var(--lav-ink);margin-right:6px;}
.newbar{display:none;justify-content:center;padding:8px;border-bottom:1px solid var(--line);background:var(--accent-soft);}
.newbar.on{display:flex;}
.tl-head, .tr{display:grid;grid-template-columns:34px minmax(0, 1fr) 176px 116px 30px 34px 98px 62px;gap:10px;align-items:center;padding:0 14px;}
.tl-head{height:34px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);}
.tl-head button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:4px;}
.tl-head button[aria-pressed="true"]{color:var(--accent-deep);}
.tr{position:relative;min-height:58px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;animation:ccRow .35s both;animation-delay:calc(var(--r, 0) * 22ms);}
.tr:hover{background:var(--card-2);}
.tr.sel{background:var(--lav-soft);}
.tr::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c, transparent);}
.tr.urgent{--c:var(--bad);} .tr.high{--c:var(--warn);}
.tr .ck{display:grid;place-items:center;}
.tr input[type="checkbox"], .tl-head input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);margin:0;}
.tr .sub{min-width:0;}
.tr .sub b{display:flex;align-items:center;gap:7px;font-weight:560;font-size:13px;white-space:nowrap;overflow:hidden;}
.tr .sub b span{overflow:hidden;text-overflow:ellipsis;}
.tr .sub b i{font-style:normal;color:var(--faint);font-weight:600;font-size:12px;flex:none;}
.tr.unread .sub b{font-weight:720;}
.tr.unread .sub b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
.tr .sub small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.tr .who{display:flex;align-items:center;gap:8px;min-width:0;}
.tr .who div{min-width:0;}
.tr .who b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tr .who small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tr .chn{color:var(--muted);display:grid;place-items:center;}
.tr .chn .ic{width:16px;height:16px;}
.tr .upd{color:var(--muted);font-size:11.5px;text-align:right;white-space:nowrap;}
.unas{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line-2);display:inline-grid;place-items:center;color:var(--faint);}
.unas .ic{width:13px;height:13px;}
.tl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;color:var(--muted);font-size:12px;}

/* ---------- Ticket view ---------- */
.tk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.tk-head h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.025em;line-height:1.2;}
.tk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
.tk-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.slabig{--c:var(--accent);--ci:var(--accent-deep);display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .6s;}
.slabig svg{width:42px;height:42px;transform:rotate(-90deg);flex:none;}
.slabig circle{fill:none;stroke-width:4.5;stroke-linecap:round;}
.slabig .trk{stroke:var(--well);}
.slabig .val{stroke:var(--c);transition:stroke .6s, stroke-dashoffset .9s linear;}
.slabig small{display:block;font-size:11.5px;color:var(--muted);}
.slabig b{display:block;font-size:18px;font-weight:760;font-variant-numeric:tabular-nums;color:var(--ci);letter-spacing:-.02em;transition:color .6s;}
.slabig.soon{--c:var(--warn);--ci:var(--warn-ink);border-color:color-mix(in srgb, var(--warn) 45%, transparent);}
.slabig.breach{--c:var(--bad);--ci:var(--bad-ink);border-color:var(--bad);animation:slaPulse 1.8s infinite;}
.slabig.paused{--c:var(--faint);--ci:var(--muted);}
.slabig.done{--c:var(--lav);--ci:var(--lav-ink);}
.tk{display:grid;grid-template-columns:minmax(0, 1fr) 330px;gap:16px;align-items:start;}
.thread{padding:0;overflow:hidden;}
.msgs{padding:18px 18px 8px;display:grid;gap:14px;}
.msg{display:grid;grid-template-columns:36px minmax(0, 1fr);gap:10px;max-width:86%;animation:ccRow .4s both;}
.msg.me{margin-left:auto;grid-template-columns:minmax(0, 1fr) 36px;}
.msg.me .av{order:2;}
.msg .bub{padding:10px 13px;border-radius:4px 14px 14px 14px;background:var(--card-2);border:1px solid var(--line);font-size:13px;line-height:1.55;}
.msg.me .bub{border-radius:14px 4px 14px 14px;background:var(--accent-soft);border-color:color-mix(in srgb, var(--accent) 22%, transparent);}
.msg.note .bub{background:var(--warn-soft);border:1px dashed color-mix(in srgb, var(--warn) 55%, transparent);}
.msg .mh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:3px;}
.msg .mh b{color:var(--ink);font-size:12.5px;}
.msg .mh .tag{height:18px;font-size:10.5px;}
.msg .bub p{margin:0;white-space:pre-wrap;}
.msg .bub .mention{color:var(--lav-ink);font-weight:650;}
.sysl{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:11.5px;text-align:center;animation:ccRow .4s both;}
.sysl .ic{width:13px;height:13px;color:var(--warn);}
.sysl::before, .sysl::after{content:"";flex:1;max-width:90px;height:1px;background:var(--line);}
.typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:0 18px 10px;}
.typing[hidden]{display:none;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:typ 1s infinite;}
.typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
@keyframes typ{50%{transform:translateY(-3px);opacity:.5;}}
.composer{border-top:1px solid var(--line);padding:12px 16px 14px;background:var(--card);}
.composer.note .area{background:var(--warn-soft);border-style:dashed;}
.comp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.comp-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap;}
.comp-bot .acts{gap:6px;}
.side{display:grid;gap:14px;}
.props{display:grid;grid-template-columns:96px minmax(0, 1fr);gap:8px 10px;align-items:center;font-size:12.5px;}
.props label{color:var(--muted);font-weight:560;}
.props .sel{width:100%;}
.cust-h{display:flex;gap:12px;align-items:center;}
.cust-h b{display:block;font-size:14px;}
.cust-h small{display:block;color:var(--muted);font-size:12px;}
.facts{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:6px;margin-top:12px;}
.facts div{padding:8px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);}
.facts b{display:block;font-size:14px;font-variant-numeric:tabular-nums;}
.facts small{color:var(--muted);font-size:11px;}
.mini-list{list-style:none;margin:0;padding:0;display:grid;gap:2px;}
.mini-list a, .mini-list button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px;border-radius:8px;border:0;background:none;text-align:left;text-decoration:none;font-size:12.5px;color:var(--ink);}
.mini-list a:hover, .mini-list button:hover{background:var(--card-2);}
.mini-list span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-list .ic{width:14px;height:14px;color:var(--muted);flex:none;}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.tags .tag button{border:0;background:none;padding:0;color:var(--muted);display:grid;place-items:center;}
.tags input{height:24px;width:120px;border-radius:7px;border:1px dashed var(--line-2);background:transparent;padding:0 8px;font-size:12px;color:var(--ink);}
.mac-list{display:grid;gap:4px;padding:8px;}
.mac-list input{margin-bottom:4px;}
.mac-list button{display:grid;gap:2px;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid transparent;background:none;color:var(--ink);}
.mac-list button:hover, .mac-list button:focus-visible{background:var(--card-2);border-color:var(--line);}
.mac-list b{font-size:12.5px;}
.mac-list small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- Customers ---------- */
.kstrip{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px;margin-bottom:16px;}
.ks{display:flex;align-items:center;gap:12px;padding:13px 15px;}
.ks .ki{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none;}
.ks .ki.l{background:var(--lav-soft);color:var(--lav-ink);} .ks .ki.w{background:var(--warn-soft);color:var(--warn-ink);} .ks .ki.b{background:var(--bad-soft);color:var(--bad-ink);}
.ks .ki .ic{width:19px;height:19px;}
.ks b{display:block;font-size:22px;font-weight:760;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;}
.ks small{color:var(--muted);font-size:12px;}
.cc-tbl td{padding:9px 10px;}
.cc-tbl table{font-size:12.5px;}
.cc-tbl th{font-size:11px;}
.pc{display:flex;align-items:center;gap:9px;min-width:0;}
.pc b{display:block;font-weight:620;white-space:nowrap;}
.pc small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;}
.plan{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:650;background:var(--well);color:var(--ink-2);}
.plan.Fleet{background:var(--lav-soft);color:var(--lav-ink);} .plan.Cargo{background:var(--accent-soft);color:var(--accent-deep);} .plan.Student{background:var(--warn-soft);color:var(--warn-ink);}
.drawer-h{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.drawer-h b{display:block;font-size:17px;}
.drawer-h small{color:var(--muted);}
.dsec{margin-top:16px;}
.dsec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}

/* ---------- Knowledge base ---------- */
.kb{display:grid;grid-template-columns:206px 330px minmax(0, 1fr);gap:16px;align-items:start;}
.kb-arts{padding:10px;}
.kb-arts .cc-search{max-width:none;margin:2px 2px 8px;min-height:34px;}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:640px;overflow:auto;}
.alist button{width:100%;display:grid;gap:3px;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);transition:background .15s;}
.alist button:hover{background:var(--card-2);}
.alist button[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb, var(--accent) 25%, transparent);}
.alist b{font-size:12.5px;font-weight:620;line-height:1.35;}
.alist small{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11.5px;}
.pill-s{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
.pill-s.pub{background:var(--accent-soft);color:var(--accent-deep);}
.pill-s.draft{background:var(--warn-soft);color:var(--warn-ink);}
.ed{padding:0;overflow:hidden;}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);}
.ed-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.ed-tools .ibtn{width:30px;height:30px;}
.ed-tools .vs{width:1px;height:20px;background:var(--line-2);margin:0 4px;}
.ed-body{padding:16px 22px 20px;}
.ed-title{width:100%;border:0;background:transparent;font-size:24px;font-weight:750;letter-spacing:-.025em;color:var(--ink);padding:4px 0;outline:none;}
.ed-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px;color:var(--muted);font-size:12px;}
.ed-meta .sel{height:30px;}
.rich{min-height:360px;outline:none;font-size:14px;line-height:1.65;color:var(--ink-2);}
.rich:focus-visible{outline:none;}
.rich h2{font-size:17px;color:var(--ink);margin:18px 0 6px;}
.rich p{margin:0 0 10px;}
.rich ul, .rich ol{margin:0 0 10px;padding-left:22px;}
.rich blockquote{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--card-2);border-radius:0 8px 8px 0;}
.rich a{color:var(--accent-deep);}
.ed-stats{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card-2);}
.ed-stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums;}
.ed-stats small{color:var(--muted);font-size:11.5px;}
.dirty{display:none;align-items:center;gap:6px;color:var(--warn-ink);font-size:12px;font-weight:600;}
.dirty.on{display:inline-flex;}
.dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);}
.preview .rich{pointer-events:none;}

/* ---------- Automations ---------- */
.auto{display:grid;grid-template-columns:380px minmax(0, 1fr);gap:16px;align-items:start;}
.rlist{display:grid;gap:10px;}
.rc{display:grid;gap:8px;padding:12px 14px;cursor:pointer;border:1px solid var(--edge);}
.rc[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow);}
.rc.off{opacity:.62;}
.rc-h{display:flex;align-items:center;gap:10px;}
.rc-h .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#1d1a3a;color:#fff;flex:none;}
[data-theme="dark"] .rc-h .ri{background:#2c2950;}
.rc-h .ri .ic{width:16px;height:16px;}
.rc-h b{display:block;font-size:13px;font-weight:650;}
.rc-h small{display:block;color:var(--muted);font-size:11.5px;}
.rc-h > div{flex:1;min-width:0;}
.rc-s{display:flex;gap:16px;color:var(--muted);font-size:11.5px;align-items:center;}
.rc-s b{color:var(--ink);font-variant-numeric:tabular-nums;}
.rc-s .cc-spark{margin-left:auto;}
.canvas{position:relative;padding:0;overflow:hidden;}
.cv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);}
.cv-top h2{margin:0;font-size:16px;}
.cv-top p{margin:2px 0 0;color:var(--muted);font-size:12px;}
.cv{position:relative;min-height:540px;padding:26px 20px 30px;background-image:radial-gradient(var(--line-2) 1px, transparent 1.2px);background-size:18px 18px;display:grid;grid-template-columns:minmax(0, 1fr) 230px;gap:16px;}
.flow{position:relative;display:flex;flex-direction:column;align-items:center;}
.node{position:relative;width:min(300px, 100%);border-radius:13px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .3s, border-color .3s, transform .3s;}
.node .nh{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--card-2);border-bottom:1px solid var(--line);}
.node .nh .ic{width:13px;height:13px;}
.node.when .nh{background:var(--lav-soft);color:var(--lav-ink);}
.node.if .nh{background:var(--warn-soft);color:var(--warn-ink);}
.node.then .nh{background:var(--accent-soft);color:var(--accent-deep);}
.node .nb{display:flex;align-items:center;gap:10px;padding:9px 11px;}
.node .nb .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--well);color:var(--ink-2);flex:none;}
.node .nb .ni .ic{width:15px;height:15px;}
.node .nb b{display:block;font-size:12.5px;}
.node .nb small{display:block;color:var(--muted);font-size:11.5px;}
.node .rm{position:absolute;top:4px;right:5px;width:22px;height:22px;border-radius:7px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .2s;}
.node:hover .rm, .node .rm:focus-visible{opacity:1;}
.node .rm .ic{width:13px;height:13px;}
.node.lit{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), var(--shadow-lift);transform:scale(1.02);}
.wire{position:relative;width:2px;height:34px;background:var(--line-2);}
.wire::after{content:"";position:absolute;left:-3px;bottom:-1px;border:4px solid transparent;border-top:6px solid var(--line-2);border-bottom:0;}
.wire .add{position:absolute;left:50%;top:50%;transform:translate(-50%, -50%);width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);color:var(--muted);display:grid;place-items:center;padding:0;z-index:1;transition:color .2s, border-color .2s;}

.wire .pulse{position:absolute;left:-4px;top:0;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);opacity:0;}
.wire.flowing .pulse{animation:pulseDown .45s linear;}
@keyframes pulseDown{0%{opacity:1;top:-4px;}100%{opacity:1;top:30px;}}
.branch{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:520px;}
.branch::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--line-2);}
.branch > .flow{padding-top:14px;}
.branch > .flow::before{content:"";position:absolute;top:0;left:50%;width:2px;height:14px;margin-left:-1px;background:var(--line-2);}

.blbl{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:700;margin-bottom:6px;}

.cv-side{display:grid;gap:12px;align-content:start;}
.cv-side .card{padding:12px 14px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;}
.kv span{color:var(--muted);}
.kv b{font-weight:600;text-align:right;}
.lastruns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.lastruns i{width:14px;height:14px;border-radius:4px;background:var(--accent);opacity:.8;}
.lastruns i.skip{background:var(--line-2);}

.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.tabs button{position:relative;height:36px;border:0;background:none;padding:0 2px;color:var(--muted);font-weight:620;font-size:13px;display:inline-flex;align-items:center;gap:7px;}
.tabs button[aria-selected="true"]{color:var(--ink);}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);}
.tabs em{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:var(--well);color:var(--muted);}

/* ---------- Reports ---------- */
.rk{display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:14px;margin-bottom:16px;}

.rk b{display:block;font-size:24px;font-weight:770;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums;}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;}

.agbar em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}

.heat i{display:block;aspect-ratio:1.6;border-radius:4px;background:color-mix(in srgb, var(--lav) calc(var(--v) * 100%), var(--well));animation:ccPop .5s both;animation-delay:calc(var(--d) * 8ms);}
.heat span{display:flex;align-items:center;}
.heat .hx{text-align:center;justify-content:center;}
.donut{display:flex;align-items:center;gap:18px;}
.donut svg{width:150px;height:150px;flex:none;transform:rotate(-90deg);}
.donut circle{fill:none;stroke-width:16;transition:stroke-dasharray .6s;}
.donut circle.seg{animation:donutIn 1s cubic-bezier(.3,.8,.2,1) both;}
@keyframes donutIn{from{stroke-dasharray:0 999;}}
.donut ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;}
.donut li{display:flex;align-items:center;gap:8px;font-size:12.5px;}

/* ---------- Team ---------- */

.hours{display:grid;gap:6px;}

.hours .inp{height:30px;width:100%;}
.danger-card{border-color:color-mix(in srgb, var(--bad) 30%, transparent);}

/* ---------- Skeleton shimmer (about 400 ms while a page "loads") ---------- */
.sk{display:grid;gap:16px;}
.sk .bx{border-radius:var(--radius);background:linear-gradient(100deg, var(--card) 30%, var(--card-2) 50%, var(--card) 70%);background-size:300% 100%;border:1px solid var(--edge);animation:shimmer 1.1s linear infinite;}
.sk .row{display:grid;gap:16px;}
@keyframes shimmer{from{background-position:100% 0;}to{background-position:0 0;}}
.cc-in{--enter:rise;}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);}}

/* ---------- Palette and popover extras ---------- */
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;}

.nlist .fic .ic{width:14px;height:14px;}
.me-pop{padding:12px;display:grid;gap:10px;}
.me-pop .cust-h b{font-size:13.5px;}

<script>
/* =====================================================================
 Core helpers (shared by every Chill & Craft dashboard, inlined here)
 DOM, formatting, seeded data, router, toasts, modals, forms, tables,
 command search, timers and small SVG charts. No libraries.
 ===================================================================== */
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 9);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

/* ---------- Seeded random: the demo data is the same on every load ---------- */
function seeded(seed) {
 let s = seed >>> 0;
 return () => {
  s += 0x6d2b79f5;
  let t = s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
 };
}
let R = seeded(11);
const reseed = (n) => (R = seeded(n));
const rand = (a, b) => a + R() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (a) => a[Math.floor(R() * a.length)];

/* ---------- Number, money and date formats ---------- */
const num = (v, dp = 0) => (+v || 0).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
function short(v, dp = 1) {
 const a = Math.abs(v), g = v < 0 ? "−" : "";
 const f = (x) => x.toFixed(dp).replace(/\.0+$/, "");
 if (a >= 1e9) return g + f(a / 1e9) + "B";
 if (a >= 1e6) return g + f(a / 1e6) + "M";
 if (a >= 1e3) return g + f(a / 1e3) + "K";
 return g + num(a, a < 10 && a % 1 ? 2 : 0);
}
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const TODAY = new Date(new Date().toDateString());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fdate = (d) => { d = new Date(d); return d.getDate() + " " + MON[d.getMonth()]; };
const fdateY = (d) => { d = new Date(d); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ---------- Safe storage: works even when the browser blocks it ---------- */
const store = {
 get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
 set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },

};

/* ---------- Timers that pause while the tab is hidden ---------- */
const timers = [];
function every(ms, fn) {
 const t = { ms, fn, id: 0 };
 timers.push(t);
 if (!document.hidden) t.id = setInterval(fn, ms);
 return t;
}
document.addEventListener("visibilitychange", () => timers.forEach((t) => { clearInterval(t.id); t.id = document.hidden ? 0 : setInterval(t.fn, t.ms); }));

/* ---------- Tween + count-up numbers ---------- */
function tween(dur, fn, done) {

/* ---------- Signature 1: SLA clocks ----------

const polMin = (t) => { const p = S.policies[t.pri] || S.policies.normal; return t.kind === "next" ? p.next : p.first; };

function sla(t, now = Date.now()) {

  e.preventDefault();
  let bad = "";
  const hours = st.hours.map((h, i) => { const a = $(`#ha-${i}`).value, b = $(`#hb-${i}`).value, on = $(`[data-sw="h${i}"]`).getAttribute("aria-checked") === "true"; if (on && (!a || !b || a >= b)) bad = bad || `${["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"][i]}: closing time must be after opening time`; return [on ? 1 : 0, a, b]; });
  $("#hrErr").textContent = bad;
  if (bad) return;
  st.hours = hours; save(); toast("Business hours saved");
 });
 sets.addEventListener("click", async (e) => {
  const s = e.target.closest("[data-sw]");
  if (s) {
   const on = s.getAttribute("aria-checked") !== "true", k = s.dataset.sw;
   s.setAttribute("aria-checked", String(on));
   if (k.startsWith("h")) { const i = +k.slice(1); $(`#ha-${i}`).disabled = !on; $(`#hb-${i}`).disabled = !on; return; }
   if (k.startsWith("ch-")) { st.channels[k.slice(3)] = on; toast(`${s.getAttribute("aria-label")} ${on ? "switched on" : "switched off"}`); }
   else if (k.startsWith("n-")) { st.notify[k.slice(2)] = on; toast(`${s.getAttribute("aria-label")} notifications ${on ? "on" : "off"}`); }
   else if (k === "live") { S.live = on; toast(on ? "Live feed resumed" : "Live feed paused"); }
   save();
   return;
  }
  const sp = e.target.closest("[data-speed]");
  if (sp) { st.orbitSpeed = +sp.dataset.speed; save(); $$("[data-speed]", sets).forEach((b) => b.setAttribute("aria-pressed", String(b === sp))); toast(`Orbit speed: ${sp.textContent}`); return; }
  if (e.target.closest("#resetDemo")) {
   if (!(await confirmBox("Reset all demo data? Your changes to tickets, customers, articles, rules and settings will be lost.", "Reset demo data"))) return;
   store.del(KEY);
   S = seed(); Object.assign(IB, { view: "all", q: "", s: "", pri: "any", ch: "any", who: "any", sort: "due", page: 0 }); IB.sel.clear();
   save(); updateBadges();
   $("#wsName").textContent = S.settings.name + " support";
   toast("Demo data reset");
   go("overview");
  }
 });
}

/* ---------- New ticket ---------- */
function newTicketModal(custIdSel) {
 formModal({
  title: "New ticket", submit: "Create ticket", values: { cust: custIdSel || S.customers[0].id, pri: "normal", ch: "email", who: "" },
  fields: [
   { name: "cust", label: "Customer", type: "select", options: S.customers.map((c) => [c.id, c.name + (c.company ? " · " + c.company : "")]) },
   { name: "subj", label: "Subject", required: true, placeholder: "What is it about?", check: (x) => (x.length < 4 ? "Use at least 4 characters" : "") },
   { name: "text", label: "Message from the customer", type: "textarea", required: true, check: (x) => (x.length < 10 ? "Add a little more detail (10+ characters)" : "") },
   { name: "pri", label: "Priority", type: "select", options: Object.entries(PRI).map(([k, p]) => [k, p.label]), half: true },
   { name: "ch", label: "Channel", type: "select", options: Object.entries(CH).map(([k, c]) => [k, c.label]), half: true },
   { name: "q", label: "Queue", type: "select", options: QUEUES.map((q) => q.id), half: true },
   { name: "who", label: "Assignee", type: "select", options: [["", "Unassigned"]].concat(AGENTS.map((a) => [a.id, a.name])), half: true },
  ],
  onSubmit: (vals) => {
   const t = addTicket({ subj: vals.subj, q: vals.q, ch: vals.ch, pri: vals.pri, text: vals.text, cust: vals.cust, who: vals.who || null });
   t.unread = false; S.cur = t.id; save();
   pushFeed({ type: "new", text: `New ${CH[t.ch].label.toLowerCase()} ticket from ${cust(t.cust).name}`, tid: t.id });
   toast(`Ticket #${t.id} created`);
   openTicket(t.id);
  },
 });
}

/* ---------- Command palette (Ctrl+K), bell and profile ---------- */
function commands() {
 const pages = NAV.map(([k, l, i]) => ({ label: l, hint: "Page", icon: i, run: () => go(k) }));
 const acts = [
  { label: "New ticket", hint: "Action", icon: "plus", run: () => newTicketModal() },
  { label: "New article", hint: "Action", icon: "book", run: () => newArticle() },
  { label: "Switch light or dark theme", hint: "Action", icon: "moon", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
  { label: S.live ? "Pause the live feed" : "Resume the live feed", hint: "Action", icon: "pause", run: () => { S.live = !S.live; save(); toast(S.live ? "Live feed resumed" : "Live feed paused"); if (page === "overview") route(); } },
  { label: "Tickets due within the hour", hint: "Inbox view", icon: "timer", run: () => { Object.assign(IB, { view: "breaching", q: "", page: 0 }); go("inbox"); } },
  { label: "Reset demo data", hint: "Settings", icon: "refresh", run: () => go("settings") },
 ];
 const tix = openT().sort((a, b) => dueOf(a) - dueOf(b)).map((t) => ({ label: `#${t.id} ${t.subj}`, hint: cust(t.cust).name, icon: "inbox", run: () => openTicket(t.id) }));
 const cs = S.customers.map((c) => ({ label: c.name, hint: "Customer", icon: "user", run: () => { S.custOpen = c.id; if (page === "customers") route(); else go("customers"); } }));
 const arts = S.articles.map((a) => ({ label: a.title, hint: "Article", icon: "book", run: () => { S.kbSel = a.id; if (page === "knowledge") route(); else go("knowledge"); } }));
 return pages.concat(acts, tix, cs, arts);
}
function bellPop(anchor) {
 popover(anchor, `<div class="pop-h"><b>Notifications</b><button type="button" class="link" id="nAll">Mark all read</button></div><ul class="nlist">${S.notifs.slice(0, 8).map((n, i) => `<li class="${n.read ? "" : "unread"}"><span class="fic">${ic(FEED_IC[n.type] || "bell")}</span><div style="min-width:0">${n.tid ? `<a class="link" href="#/ticket" data-tid="${n.tid}" style="font-weight:600;color:var(--ink)">${esc(n.text)}</a>` : esc(n.text)}<small>${ago(n.at)}</small></div></li>`).join("") || '<li class="muted">No notifications</li>'}</ul>`, (p) => {
  $("#nAll", p).addEventListener("click", () => { S.notifs.forEach((n) => (n.read = true)); save(); updateBadges(); $$(".nlist li", p).forEach((li) => li.classList.remove("unread")); toast("All notifications read"); });
 });
}
function mePop(anchor) {
 const a = agent("graham");
 popover(anchor, `<div class="me-pop"><div class="cust-h">${av(a, "l", true)}<div><b>${esc(a.name)}</b><small>${esc(a.role)} · ${esc(S.settings.name)}</small></div></div>
  <div class="seg" role="group" aria-label="Your status">${["online", "away", "offline"].map((s) => `<button type="button" data-me="${s}" aria-pressed="${statusOf("graham") === s}">${cap1(s)}</button>`).join("")}</div>
  <small class="muted">Press <kbd>Ctrl</kbd> <kbd>K</kbd> anywhere to search tickets, customers and articles.</small></div>`, (p) => {
  p.addEventListener("click", (e) => {
   const b = e.target.closest("[data-me]");
   if (!b) return;
   S.status.graham = b.dataset.me; save();
   $$("[data-me]", p).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
   $("#meDot").className = "dot st-" + b.dataset.me;
   toast(`You are now ${b.dataset.me}`);
  });
 });
}

/* ---------- Delegated clicks ---------- */
document.addEventListener("click", (e) => {
 const t = e.target.closest("[data-tid]");
 if (t && !e.target.closest("input,select,textarea")) { e.preventDefault(); openTicket(+t.dataset.tid); return; }
 const a = e.target.closest("[data-act]");
 if (a && a.dataset.act === "new-ticket") { newTicketModal(); return; }
 if (e.target.closest("#bell")) { bellPop($("#bell")); return; }
 if (e.target.closest("#meBtn")) { mePop($("#meBtn")); }
});

/* ---------- Boot ---------- */
buildShell();
initShell(commands);
updateBadges();
route();
addEventListener("hashchange", route);
every(1000, tick);
every(4500, liveTick);
</script>
</body>
</html>
