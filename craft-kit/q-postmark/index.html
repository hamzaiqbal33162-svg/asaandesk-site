<!doctype html>
<!-- Chill & Craft · Postmark · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Postmark · testimonial postcards you can swipe</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: kraft desk + cream cards (light), walnut desk + cocoa cards (dark) ---------- */
  :root {
    --desk: #e8dcc6; --desk-2: #f3ead9; --fibre: rgba(120, 84, 40, 0.07);
    --paper: #fffaf0; --paper-2: #f7eedc; --edge: rgba(80, 52, 24, 0.14);
    --ink: #2b2118; --muted: #786a58; --rule: rgba(80, 52, 24, 0.22);
    --red: #c8553d; --mark: #3c4f7a; --star: #e9a321; --star-off: rgba(80, 52, 24, 0.16);
    --shadow: rgba(70, 44, 16, 0.32); --focus: #2b2118;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --desk: #17110d; --desk-2: #251b14; --fibre: rgba(255, 210, 160, 0.035);
    --paper: #2c241d; --paper-2: #342a22; --edge: rgba(255, 230, 200, 0.09);
    --ink: #f3e8d6; --muted: #b6a48c; --rule: rgba(255, 230, 200, 0.16);
    --red: #ec7a5e; --mark: #9db4ec; --star: #f5b941; --star-off: rgba(255, 230, 200, 0.14);
    --shadow: rgba(0, 0, 0, 0.7); --focus: #f5b941;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background:
      repeating-linear-gradient(97deg, transparent 0 7px, var(--fibre) 7px 8px, transparent 8px 19px),
      radial-gradient(90% 70% at 50% 30%, var(--desk-2), var(--desk));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px 22px; overflow: hidden; }
  /* window light drifting slowly across the desk */
  .stage::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(40% 35% at 30% 30%, rgba(255, 240, 200, 0.35), transparent 70%); animation: drift 16s ease-in-out infinite alternate; pointer-events: none; }
  :root[data-theme="dark"] .stage::before { background: radial-gradient(40% 35% at 30% 30%, rgba(255, 190, 120, 0.07), transparent 70%); }
  @keyframes drift { to { transform: translate(18%, 12%); } }

  .head { position: relative; text-align: center; max-width: 660px; }
  .eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: 0.16em; text-transform: uppercase; color: var(--red); }
  h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(25px, 4.2vw, 38px); line-height: 1.1; letter-spacing: -0.015em; }
  .lede { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }

  /* ---------- The deck ---------- */
  .deck { position: relative; width: min(590px, 100%); height: 330px; margin: 30px auto 0; touch-action: pan-y; outline: none; }
  .deck:focus-visible { outline: none; }
  .deck:focus-visible .pc.top { box-shadow: 0 0 0 3px var(--focus), 0 26px 40px -24px var(--shadow); }
  .pc {
    position: absolute; inset: 0; border-radius: 10px; background: var(--paper);
    background-image: linear-gradient(160deg, transparent 55%, var(--paper-2));
    border: 1px solid var(--edge); box-shadow: 0 2px 0 var(--edge), 0 22px 34px -26px var(--shadow);
    display: grid; grid-template-columns: 1.4fr 1px 1fr; grid-template-areas: "msg div side"; gap: 0 22px; padding: 24px 24px 20px;
    transform-origin: 50% 60%; will-change: transform; user-select: none; -webkit-user-select: none;
    transition: transform 0.75s cubic-bezier(0.25, 1.3, 0.4, 1), opacity 0.45s, box-shadow 0.4s;
  }
  .pc.top { cursor: grab; box-shadow: 0 2px 0 var(--edge), 0 30px 44px -26px var(--shadow); }
  .pc.drag { transition: none; cursor: grabbing; }
  .pc.fly { transition: transform 0.46s cubic-bezier(0.5, 0, 0.75, 0.45), opacity 0.4s; }
  .pc.lift { transition: transform 0.14s ease-out; }
  .msg { grid-area: msg; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .quote { margin: 0; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; line-height: 1.5; }
  .quote::before { content: "\201C"; display: block; height: 30px; margin-bottom: 2px; font-size: 54px; line-height: 1; color: var(--red); font-style: normal; }
  .stars { display: flex; gap: 3px; margin-top: 10px; }
  .stars svg { width: 18px; height: 18px; fill: var(--star-off); }
  .lit .stars svg.on { animation: star-pop 0.5s cubic-bezier(0.3, 1.8, 0.5, 1) both; animation-delay: calc(var(--k) * 90ms + 0.55s); }
  @keyframes star-pop { 0% { fill: var(--star-off); transform: scale(1); } 45% { fill: var(--star); transform: scale(1.45) rotate(14deg); } 100% { fill: var(--star); transform: none; } }
  .stars svg.on { fill: var(--star); }
  .lit .stars svg.on { fill: var(--star-off); }
  .div { grid-area: div; background: repeating-linear-gradient(180deg, var(--rule) 0 6px, transparent 6px 11px); }
  .side { grid-area: side; position: relative; display: flex; flex-direction: column; min-width: 0; }
  .side .label { font-size: 10px; font-weight: 800; letter-spacing: 0.24em; color: var(--muted); }

  /* the stamp: a paper frame with perforated edges around a little illustration */
  .stamp {
    position: absolute; right: 0; top: 0; width: 80px; height: 96px; padding: 6px;
    background: radial-gradient(circle, transparent 2.6px, #fdf6e7 3.1px) -4px -4px / 8px 8px;
    filter: drop-shadow(0 2px 2px rgba(60, 30, 0, 0.18)); transform: rotate(3deg);
  }
  .stamp svg { display: block; width: 100%; height: 100%; }
  /* the postmark: invisible until the rubber stamp comes down */
  .pm { position: absolute; right: 34px; top: 46px; width: 120px; height: 70px; color: var(--mark); opacity: 0; transform: scale(1.3) rotate(-14deg); transform-origin: 71.7% 50%; filter: blur(2px); pointer-events: none; }
  .pm svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .marked .pm { opacity: 0.86; transform: rotate(-9deg); filter: none; transition: transform 0.28s cubic-bezier(0.3, 1.7, 0.5, 1), opacity 0.08s, filter 0.3s; }
  :root:not([data-theme="dark"]) .pm { mix-blend-mode: multiply; }
  .pm text { fill: currentColor; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-weight: 700; }
  .pm .ring, .pm .wave { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .addr { margin-top: auto; display: grid; gap: 4px; }
  .addr span { display: block; padding: 2px 0 3px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr b { display: block; padding-bottom: 3px; border-bottom: 1px solid var(--rule); font-size: 15px; }

  /* the rubber stamp that thumps the postmark onto the top card */
  .rubber { position: absolute; left: var(--rx, 50%); top: var(--ry, 50%); width: 62px; height: 85px; margin: -85px 0 0 -31px; z-index: 60; pointer-events: none; opacity: 0; transform-origin: 50% 100%; filter: drop-shadow(0 10px 8px rgba(40, 20, 0, 0.3)); }
  .rubber.go { animation: press 1s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes press {
    0% { opacity: 0; transform: translate(50px, -90px) rotate(20deg); }
    24% { opacity: 1; transform: translate(0, -30px) rotate(-3deg); }
    34% { transform: translate(0, 2px) scale(1.06, 0.9); }
    50% { transform: translate(0, 0) scale(1); }
    74% { opacity: 1; transform: translate(-12px, -70px) rotate(-12deg); }
    100% { opacity: 0; transform: translate(-24px, -120px) rotate(-16deg); }
  }
  .deck.thud .pc:not(.top) { animation: thud 0.3s ease-out; }
  @keyframes thud { 40% { translate: 0 2px; } }

  /* ---------- Controls ---------- */
  .ctrl { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 26px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--edge); background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 16px -12px var(--shadow); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .arrow:hover { transform: translateY(-2px); }
  .arrow:active { transform: scale(0.92); }
  .arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .faces { display: flex; gap: 6px; }
  .face { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--paper); background: var(--c); color: #fff; font: 800 11.5px/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 0 0 0 var(--c); transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1), box-shadow 0.3s; }
  .face[aria-current="true"] { transform: translateY(-4px) scale(1.12); box-shadow: 0 0 0 2px var(--c); }
  .count { margin-top: 12px; font: 700 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.12em; color: var(--muted); text-align: center; }
  .count b { color: var(--ink); }

  /* demo pointer */
  .ghost { position: fixed; left: 0; top: 0; z-index: 80; width: 26px; height: 26px; margin: -3px 0 0 -4px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 80vw), var(--gy, 110vh)); transition: transform 0.75s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost.follow { transition: opacity 0.35s; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--red); opacity: 0; }
  .ghost.tap::after { animation: ring 0.5s ease-out; }
  @keyframes ring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  /* ---------- Phones: the card turns portrait with the stamp row on top ---------- */
  @media (max-width: 560px) {
    .deck { height: 318px; margin-top: 22px; width: min(360px, 100%); }
    .msg { justify-content: flex-start; }
    .stars { margin-top: 14px; }
    .pc { grid-template-columns: 1fr; grid-template-rows: auto 1px 1fr; grid-template-areas: "side" "div" "msg"; gap: 14px 0; padding: 18px 18px 16px; }
    .div { background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 11px); }
    .side { min-height: 96px; padding-right: 92px; }
    .side .label { display: none; }
    .stamp { width: 72px; height: 88px; }
    .pm { right: 40px; top: 34px; width: 108px; height: 63px; }
    .quote { font-size: 15.5px; line-height: 1.45; }
    .quote::before { height: 22px; font-size: 44px; }
    .addr { margin-top: 0; }
    .face { width: 30px; height: 30px; }
    .ctrl { gap: 10px; margin-top: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
    .rubber { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="head">
    <p class="eyebrow">Kind words</p>
    <h1>Letters from 1,200 shop owners</h1>
    <p class="lede">Real notes from the people who run their day on our app.</p>
  </header>
  <section class="deck" id="deck" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Customer letters. Swipe the top card or use the arrow keys."></section>
  <div class="ctrl">
    <button class="arrow" type="button" id="prev" aria-label="Previous letter"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="faces" id="faces"></div>
    <button class="arrow" type="button" id="next" aria-label="Next letter"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <p class="count" aria-hidden="true"><b id="num">01</b> / 05</p>
  <p class="sr-only" aria-live="polite" id="status"></p>
</main>
<div class="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
  (function () {
    "use strict";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (s, r) { return (r || document).querySelector(s); };

    /* ---------- Letters (all made up) ---------- */
    var DATA = [
      { who: "Ayesha Siddiqui", biz: "Threadline Boutique", city: "Lahore", date: "12 OCT", stars: 5, c: "#c8553d", art: "arch",
        q: "We used to close the month with a calculator and a headache. Now the sales report is waiting for me before my morning chai." },
      { who: "Bilal Rana", biz: "Rana Auto Parts", city: "Karachi", date: "03 SEP", stars: 5, c: "#2a7f7a", art: "boat",
        q: "Three shops, one screen. My cousins stopped calling every evening to ask about stock, and honestly that alone was worth it." },
      { who: "Mahnoor Ali", biz: "Pine & Pages Books", city: "Islamabad", date: "21 AUG", stars: 4, c: "#5d7a3a", art: "hills",
        q: "Setting up took one afternoon. Receipts look neat, customers pay on time, and the reminders are polite enough that nobody minds." },
      { who: "Usman Tariq", biz: "Qehwa Corner", city: "Peshawar", date: "09 AUG", stars: 5, c: "#7a3e65", art: "pot",
        q: "I am not a computer person. My nephew showed me twice and now I run the whole cafe's orders from my phone." },
      { who: "Zara Hussain", biz: "Sunfruit Exports", city: "Multan", date: "19 JUL", stars: 5, c: "#d98a12", art: "mango",
        q: "Mango season used to mean lost slips and angry calls. This year every crate was tracked and every buyer paid in full." }
    ];
    // little stamp drawings, 68 x 84, cream ink on the card's colour
    var ART = {
      arch: '<circle cx="50" cy="22" r="8" fill="#ffd27a"/><path d="M12 76V44a22 22 0 0 1 44 0v32h-8V45a14 14 0 0 0-28 0v31z" fill="#fdf6e7"/><path d="M34 14l3 8h-6z M8 76h52v4H8z" fill="#fdf6e7"/>',
      boat: '<circle cx="48" cy="22" r="9" fill="#ffd27a"/><path d="M33 16v36H16z" fill="#fdf6e7"/><path d="M36 22v30h16z" fill="#fdf6e7" opacity=".8"/><path d="M12 55h46l-7 9H19z" fill="#fdf6e7"/><path d="M4 70q8-5 15 0t15 0 15 0 15 0M4 78q8-5 15 0t15 0 15 0 15 0" stroke="#fdf6e7" stroke-width="2.4" fill="none"/>',
      hills: '<circle cx="18" cy="20" r="7" fill="#ffd27a"/><path d="M0 66l20-26 14 16 12-14 22 24v18H0z" fill="#fdf6e7" opacity=".55"/><path d="M0 72l16-14 18 10 16-12 18 14v14H0z" fill="#fdf6e7"/><path d="M52 30l9 16h-5l7 12H41l7-12h-5z" fill="#fdf6e7"/>',
      pot: '<path d="M22 34h24l4 6H18z" fill="#fdf6e7"/><path d="M16 42h36c0 18-6 28-18 28S16 60 16 42z" fill="#fdf6e7"/><path d="M52 46c6-2 10-8 10-14l-4 1c0 5-3 8-6 9z" fill="#fdf6e7"/><circle cx="34" cy="30" r="3" fill="#fdf6e7"/><path d="M30 22c-4-4 4-6 0-11M38 22c-4-4 4-6 0-11" stroke="#ffd27a" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M10 74h48" stroke="#fdf6e7" stroke-width="3" stroke-linecap="round"/>',
      mango: '<path d="M30 24c14-4 28 8 26 26S38 78 26 74 8 54 12 40s6-14 18-16z" fill="#ffd27a"/><path d="M30 24c-2-6 0-10 4-12" stroke="#fdf6e7" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 14c8-6 18-4 22 2-8 4-16 4-22-2z" fill="#fdf6e7"/><path d="M22 40c-2 8 0 16 6 22" stroke="#fff" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round"/>'
    };
    var ROT = [-1.2, 2.6, -3.4, 3.1, -2.2]; // each card's own resting angle in the pile
    var STAR = '<path d="M12 2.5l2.8 6.3 6.8.6-5.2 4.5 1.6 6.7L12 17l-5.9 3.6 1.6-6.7-5.2-4.5 6.8-.6z"/>';

    var deck = $("#deck"), faces = $("#faces"), status = $("#status"), num = $("#num");
    var cards = [], order = [0, 1, 2, 3, 4], busy = false;

    /* ---------- Build the cards and the face buttons ---------- */
    DATA.forEach(function (d, i) {
      var stars = "";
      for (var k = 0; k < 5; k++) stars += '<svg viewBox="0 0 24 24" class="' + (k < d.stars ? "on" : "") + '" style="--k:' + k + '" aria-hidden="true">' + STAR + "</svg>";
      var city = d.city.toUpperCase(), ring = "";
      var el = document.createElement("article");
      el.className = "pc";
      el.setAttribute("aria-roledescription", "slide");
      el.setAttribute("aria-label", (i + 1) + " of " + DATA.length + ": " + d.who);
      el.innerHTML =
        '<div class="msg"><p class="quote">' + d.q + '</p><div class="stars" role="img" aria-label="' + d.stars + ' out of 5 stars">' + stars + "</div></div>" +
        '<div class="div" aria-hidden="true"></div>' +
        '<div class="side"><span class="label" aria-hidden="true">POST CARD</span>' +
        '<div class="stamp" aria-hidden="true"><svg viewBox="0 0 68 84"><rect width="68" height="84" fill="' + d.c + '"/>' + ART[d.art] +
        '<text x="5" y="11" font-size="7" font-weight="800" fill="#fdf6e7" font-family="system-ui,sans-serif">Rs 25</text></svg></div>' +
        '<span class="pm" aria-hidden="true"><svg viewBox="0 0 120 70">' +
        '<path class="wave" d="M0 21q6-5 12 0t12 0 12 0 12 0M0 31q6-5 12 0t12 0 12 0 12 0M0 41q6-5 12 0t12 0 12 0 12 0M0 51q6-5 12 0t12 0 12 0 12 0"/>' +
        '<circle class="ring" cx="86" cy="35" r="31"/><circle class="ring" cx="86" cy="35" r="20"/>' +
        '<path id="pmA' + i + '" d="M60 35a26 26 0 1 1 52 0a26 26 0 1 1-52 0" fill="none"/>' +
        '<text font-size="7.2" letter-spacing="1.1"><textPath href="#pmA' + i + '">' + city + " · GPO · " + city + " ·</textPath></text>" +
        '<text x="86" y="34" font-size="8.5" text-anchor="middle">' + d.date + '</text><text x="86" y="44" font-size="8" text-anchor="middle">2026</text></svg></span>' +
        '<div class="addr"><b>' + d.who + "</b><span>" + d.biz + "</span><span>" + d.city + ", Pakistan</span></div></div>";
      deck.appendChild(el);
      cards.push(el);

      var f = document.createElement("button");
      f.type = "button"; f.className = "face"; f.style.setProperty("--c", d.c);
      f.textContent = d.who.split(" ").map(function (w) { return w[0]; }).join("");
      f.setAttribute("aria-label", "Show the letter from " + d.who);
      f.addEventListener("click", function () { var k = order.indexOf(i); if (k > 0) go(i, k > order.length / 2 ? "prev" : "next", 1); });
      faces.appendChild(f);
    });
    var rubber = document.createElement("div");
    rubber.className = "rubber"; rubber.setAttribute("aria-hidden", "true");
    rubber.innerHTML = '<svg viewBox="0 0 62 85"><ellipse cx="31" cy="13" rx="13" ry="11" fill="#9a6440"/><ellipse cx="27" cy="9" rx="5" ry="3" fill="#c48a5f"/><rect x="25" y="20" width="12" height="26" rx="4" fill="#7d4f31"/><rect x="6" y="44" width="50" height="26" rx="5" fill="#a86f48"/><rect x="6" y="44" width="50" height="7" rx="3" fill="#c48a5f"/><rect x="3" y="70" width="56" height="13" rx="3" fill="#3c4f7a"/></svg>';
    deck.appendChild(rubber);

    /* ---------- Pile layout ---------- */
    function pose(i, depth) {
      var rot = depth === 0 ? -0.6 : ROT[i];
      return "translate3d(" + depth * 7 + "px," + depth * 9 + "px,0) rotate(" + rot + "deg) scale(" + (1 - depth * 0.035) + ")";
    }
    function place(i, depth) {
      var c = cards[i];
      c.style.zIndex = String(20 - depth);
      c.style.transform = pose(i, depth);
      c.style.opacity = depth > 2 ? "0" : "1";
      c.classList.toggle("top", depth === 0);
      c.setAttribute("aria-hidden", String(depth !== 0));
      c.inert = depth !== 0;
    }
    function layout(skip) { order.forEach(function (ci, d) { if (ci !== skip) place(ci, d); }); }
    // the pile is as tall as the longest letter (never shorter than a landscape postcard on wide screens)
    var narrow = matchMedia("(max-width: 560px)");
    function fitDeck() {
      cards.forEach(function (c) { c.style.bottom = "auto"; });
      var h = 0;
      cards.forEach(function (c) { h = Math.max(h, c.offsetHeight); });
      cards.forEach(function (c) { c.style.bottom = ""; });
      if (h) deck.style.height = Math.max(h + 6, narrow.matches ? 0 : 330) + "px";
    }
    var ft = 0;
    addEventListener("resize", function () { clearTimeout(ft); ft = setTimeout(fitDeck, 120); });
    function sync() {
      var top = order[0], d = DATA[top];
      num.textContent = "0" + (top + 1);
      Array.prototype.forEach.call(faces.children, function (f, i) { f.setAttribute("aria-current", String(i === top)); });
      status.textContent = "Letter " + (top + 1) + " of 5, from " + d.who + ", " + d.biz + ", " + d.city + ". " + d.stars + " stars.";
    }

    /* ---------- Rubber stamp + stars when a card lands on top ---------- */
    function arrive(i) {
      var c = cards[i];
      c.classList.remove("lit"); void c.offsetWidth; c.classList.add("lit");
      // aim at the postmark circle using layout offsets (they ignore the card's in-flight transform)
      var pm = $(".pm", c), side = pm.parentNode;
      rubber.style.setProperty("--rx", (c.offsetLeft + side.offsetLeft + pm.offsetLeft + pm.offsetWidth * 0.717) + "px");
      rubber.style.setProperty("--ry", (c.offsetTop + side.offsetTop + pm.offsetTop + pm.offsetHeight * 0.5) + "px");
      rubber.classList.remove("go"); void rubber.offsetWidth; rubber.classList.add("go");
      setTimeout(function () {
        c.classList.add("marked");
        deck.classList.add("thud");
        setTimeout(function () { deck.classList.remove("thud"); }, 320);
      }, reduce.matches ? 0 : 330);
    }

    /* ---------- Move a card to the top ----------
       mode "next": the top card flies off to `side` and slides back under the pile, the target rises.
       mode "prev": the target slides out from under the pile and lands on top. */
    function go(target, mode, side) {
      var top = order[0];
      if (busy || target === top) return;
      busy = true;
      var oc = cards[top], tc = cards[target], w = deck.clientWidth;
      var fromDrag = oc.classList.contains("drag");
      oc.classList.remove("drag", "marked");
      if (mode === "next") {
        // anticipation: lift and lean away (skipped when the card is already in the hand)
        var lead = fromDrag || reduce.matches ? 0 : 140;
        if (lead) { oc.classList.add("lift"); oc.style.transform = "translate3d(" + (-side * 10) + "px,-8px,0) rotate(" + (-side * 3) + "deg) scale(1.03)"; }
        setTimeout(function () {
          oc.classList.remove("lift"); oc.classList.add("fly");
          oc.style.transform = "translate3d(" + side * (w * 1.05 + 60) + "px,-30px,0) rotate(" + side * 18 + "deg)";
          order = [target].concat(order.filter(function (x) { return x !== target && x !== top; }), [top]);
          layout(top);
          setTimeout(function () { // slide back in under the pile
            oc.classList.remove("fly");
            place(top, order.length - 1);
          }, reduce.matches ? 0 : 460);
          setTimeout(done, reduce.matches ? 0 : 480);
        }, lead);
      } else {
        tc.classList.add("fly");
        tc.style.zIndex = "1"; tc.style.opacity = "1";
        tc.style.transform = "translate3d(" + (-(w * 0.9 + 40)) + "px,-20px,0) rotate(-14deg)";
        setTimeout(function () {
          tc.classList.remove("fly");
          order = [target].concat(order.filter(function (x) { return x !== target; }));
          layout();
          setTimeout(done, reduce.matches ? 0 : 420);
        }, reduce.matches ? 0 : 430);
      }
      function done() { busy = false; sync(); arrive(target); }
    }
    function next(side) { go(order[1], "next", side || 1); }
    function prev() { go(order[order.length - 1], "prev", -1); }
    $("#next").addEventListener("click", function () { next(1); });
    $("#prev").addEventListener("click", prev);
    deck.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); next(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    });

    /* ---------- Drag / swipe the top card ---------- */
    var drag = null;
    function dragTo(dx, dy) {
      var c = cards[order[0]];
      c.style.transform = "translate3d(" + dx + "px," + dy * 0.25 + "px,0) rotate(" + dx * 0.06 + "deg)";
    }
    function release(dx, v) {
      var c = cards[order[0]];
      if (Math.abs(dx) > 80 || Math.abs(v) > 0.6) next(dx > 0 ? 1 : -1);
      else { c.classList.remove("drag"); place(order[0], 0); }
    }
    deck.addEventListener("pointerdown", function (e) {
      var c = cards[order[0]];
      if (busy || !c.contains(e.target) || e.button > 0) return;
      drag = { x: e.clientX, y: e.clientY, dx: 0, t: performance.now(), v: 0, lx: e.clientX };
      c.classList.add("drag");
      try { deck.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    deck.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var now = performance.now();
      drag.v = (e.clientX - drag.lx) / Math.max(16, now - drag.t);
      drag.lx = e.clientX; drag.t = now;
      drag.dx = e.clientX - drag.x;
      dragTo(drag.dx, e.clientY - drag.y);
    });
    function endDrag() { if (!drag) return; var d = drag; drag = null; release(d.dx, d.v); }
    deck.addEventListener("pointerup", endDrag);
    deck.addEventListener("pointercancel", endDrag);

    /* ---------- Auto-demo: swipes and clicks on its own until someone touches it ---------- */
    var ghost = $(".ghost"), demoOn = !reduce.matches, timers = [], step = 0;
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function ghostAt(x, y) { ghost.style.setProperty("--gx", x + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function tap(then) { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (then) then(); }, 170); }
    function stopDemo() {
      if (!demoOn) return;
      demoOn = false;
      timers.forEach(clearTimeout);
      ghost.classList.remove("show", "tap", "follow");
      if (!drag && cards[order[0]].classList.contains("drag")) release(0, 0);
    }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) {
      addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true });
    });
    function demoSwipe() {
      var c = cards[order[0]], r = c.getBoundingClientRect();
      var x0 = r.left + r.width * 0.42, y0 = r.top + r.height * 0.62;
      ghost.classList.add("show"); ghostAt(x0, y0);
      later(function () {
        tap();
        c.classList.add("drag");
        ghost.classList.add("follow");
        var t0 = performance.now(), dist = Math.min(170, r.width * 0.5);
        (function frame(now) {
          if (!demoOn) return;
          var k = Math.min(1, (now - t0) / 560), e = k * k * (3 - 2 * k), dx = dist * e;
          dragTo(dx, -14 * e);
          ghostAt(x0 + dx, y0 - 4 * e);
          if (k < 1) requestAnimationFrame(frame);
          else { ghost.classList.remove("follow"); release(dx, 1); }
        })(t0);
      }, 850);
    }
    function demo() {
      if (!demoOn) return;
      step++;
      if (step % 3 === 0) { ghost.classList.add("show"); var b = $("#next").getBoundingClientRect(); ghostAt(b.left + b.width * 0.6, b.top + b.height * 0.6); later(function () { tap(function () { next(1); }); }, 800); }
      else demoSwipe();
      later(function () { ghost.classList.remove("show"); }, 2300);
      later(demo, 3900);
    }

    /* ---------- Start: the cards drop onto the desk one by one, then the top one is stamped ---------- */
    cards.forEach(function (c, i) {
      c.style.transition = "none";
      c.style.transform = "translate3d(" + (i % 2 ? 60 : -60) + "px,-115vh,0) rotate(" + (i % 2 ? 24 : -20) + "deg)";
    });
    ghostAt(innerWidth * 0.8, innerHeight + 40);
    void deck.offsetWidth;
    order.slice().reverse().forEach(function (ci, k) {
      setTimeout(function () { cards[ci].style.transition = ""; place(ci, order.indexOf(ci)); }, reduce.matches ? 0 : 60 + k * 90);
    });
    fitDeck();
    sync();
    setTimeout(function () { arrive(order[0]); }, reduce.matches ? 0 : 900);
    if (demoOn) later(demo, 1900);
  })();
</script>
</body>
</html>
