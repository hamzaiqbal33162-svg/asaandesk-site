<title>Peg Line · wishlist to basket</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: blush morning, mint, wicker ---------- */
  :root {
    color-scheme: light;
    --sky1: #fff3f1;
    --sky2: #ffd9df;
    --sun: rgba(255, 214, 160, .55);
    --ink: #3a2430;
    --muted: #8f6f7c;
    --card: rgba(255, 255, 255, .72);
    --line: #f1d7dd;
    --rope: #c7a585;
    --pole: #b5835a;
    --wicker: #d9a066;
    --wicker-d: #a86f3a;
    --rose: #e5537d;
    --mint: #43b28f;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --sky1: #2b2142;
    --sky2: #120d1f;
    --sun: rgba(255, 200, 230, .12);
    --ink: #f8eaf0;
    --muted: #bfa3b3;
    --card: rgba(36, 26, 52, .78);
    --line: #3d2f52;
    --rope: #a88a70;
    --pole: #8a6242;
    --wicker: #c08a52;
    --wicker-d: #8a5a2c;
    --rose: #ff7aa2;
    --mint: #5fd3ad;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(420px 300px at 82% 8%, var(--sun), transparent 70%),
      linear-gradient(180deg, var(--sky1), var(--sky2));
    background-color: var(--sky2);
  }
  .stage { width: 100%; display: grid; place-items: center; padding: 16px; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .box { width: min(400px, 100%); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 0 4px; }
  .head h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; }
  .head h1 svg { width: 18px; height: 18px; }
  .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .saved { flex: none; padding: 5px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 12px; font-weight: 750; }

  /* ---------- The washing line ---------- */
  .yard { position: relative; height: 350px; margin-top: 8px; }
  .yard > svg.rope { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .pole { position: absolute; top: 26px; bottom: 40px; width: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--pole), #8b5e3c); }
  .pole::before { content: ""; position: absolute; top: -4px; left: -4px; width: 16px; height: 8px; border-radius: 4px; background: #8b5e3c; }
  .pole.l { left: 6px; } .pole.r { right: 6px; }

  .item { position: absolute; left: 0; top: 0; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 4px; -webkit-tap-highlight-color: transparent; }
  .item svg { display: block; filter: drop-shadow(0 8px 6px rgba(80, 30, 50, .18)); }
  .item .tag { position: absolute; left: 50%; bottom: -8px; transform: translate(-50%, 100%) rotate(var(--tilt, -3deg)); display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 7px; background: #fffdfa; color: #3a2430; font-size: 10.5px; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 8px -4px rgba(80, 30, 50, .4); }
  .item .tag::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 9px; background: #b99; }
  .item .tag svg { width: 10px; height: 10px; filter: none; }
  .item:hover svg { filter: drop-shadow(0 10px 8px rgba(80, 30, 50, .28)) brightness(1.04); }
  .item.gone { visibility: hidden; }

  .peg { position: absolute; left: 0; top: 0; width: 12px; height: 24px; pointer-events: none; z-index: 5; }
  .jaw { position: absolute; top: 0; width: 6px; height: 24px; background: linear-gradient(90deg, #e9c08f, #c99560); transform-origin: 50% 40%; transition: transform .25s var(--spring); }
  .jaw.l { left: 0; border-radius: 3px 1px 1px 5px; } .jaw.r { right: 0; border-radius: 1px 3px 5px 1px; background: linear-gradient(90deg, #d8ab78, #b8834f); }
  .peg::after { content: ""; position: absolute; left: 1px; right: 1px; top: 8px; height: 3px; border-radius: 2px; background: #9aa3a9; }
  .peg.open .jaw.l { transform: rotate(-16deg); } .peg.open .jaw.r { transform: rotate(16deg); }

  /* ---------- The basket ---------- */
  .basket { position: absolute; left: 50%; bottom: 0; width: 164px; height: 96px; margin-left: -82px; transform-origin: 50% 100%; }
  .basket svg { position: absolute; left: 0; bottom: 0; width: 164px; height: 110px; overflow: visible; }
  .heap { position: absolute; left: 20px; right: 20px; bottom: 30px; height: 70px; }
  .heap span { position: absolute; bottom: 0; width: 46px; transform-origin: 50% 100%; transition: transform .45s var(--spring), opacity .2s; opacity: 0; transform: translateY(30px) scale(.6); }
  .heap span.in { opacity: 1; transform: translateY(0) rotate(var(--r)) scale(1); }
  .heap svg { position: static; width: 100%; height: auto; }
  .count { position: absolute; right: -6px; top: 6px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--rose); color: #fff; font-size: 13px; font-weight: 850; line-height: 26px; text-align: center; box-shadow: 0 6px 12px -6px var(--rose); z-index: 3; }

  /* ---------- Basket summary ---------- */
  .sum { margin-top: 12px; padding: 12px 12px 12px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(6px); }
  .sumTop { display: flex; align-items: center; gap: 10px; }
  .sumTop div { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); font-weight: 650; }
  .sumTop b { display: block; font-size: 19px; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 28px; }
  .chips:empty::before { content: "Nothing in the basket yet. Tap a piece on the line."; font-size: 12px; color: var(--muted); align-self: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 9px; border-radius: 99px; background: rgba(229, 83, 125, .1); border: 1px solid rgba(229, 83, 125, .25); font-size: 12px; font-weight: 700; animation: pop .45s var(--spring); }
  .chip button { width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(229, 83, 125, .16); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; display: grid; place-items: center; }
  .chip button svg { width: 12px; height: 12px; }
  .checkout {
    --p: 0;
    position: relative;
    overflow: hidden;
    flex: none;
    height: 46px;
    padding: 0 16px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(180deg, #ef6d92, var(--rose));
    color: #fff;
    font: inherit;
    font-size: 14.5px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 22px -12px var(--rose), inset 0 1px 0 rgba(255, 255, 255, .3);
    transition: transform .35s var(--spring), filter .2s, opacity .2s;
  }
  .checkout::before { content: ""; position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--p)); background: rgba(255, 255, 255, .25); }
  .checkout span { position: relative; }
  .checkout:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.05); }
  .checkout:disabled { opacity: .45; cursor: not-allowed; }
  .checkout.ok { background: linear-gradient(180deg, #4cc39c, #2b9473); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="box">
    <div class="head">
      <div>
        <h1><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17s-6.5-4-6.5-8.6A3.6 3.6 0 0 1 10 6a3.6 3.6 0 0 1 6.5 2.4C16.5 13 10 17 10 17z" fill="var(--rose)" /></svg>Wishlist line</h1>
        <p>Tap a piece to drop it in your basket</p>
      </div>
      <span class="saved" id="saved">4 on the line</span>
    </div>

    <div class="yard" id="yard">
      <div class="pole l" aria-hidden="true"></div><div class="pole r" aria-hidden="true"></div>
      <svg class="rope" aria-hidden="true"><path id="rope" fill="none" stroke="var(--rope)" stroke-width="2.4" stroke-linecap="round" /><path id="rope2" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="3 4" /></svg>
      <div id="items"></div>
      <div class="basket" id="basket" aria-hidden="true">
        <svg viewBox="0 0 164 110">
          <path d="M28 52C28 10 136 10 136 52" fill="none" stroke="var(--wicker-d)" stroke-width="7" stroke-linecap="round" />
          <path d="M28 52C28 14 136 14 136 52" fill="none" stroke="var(--wicker)" stroke-width="3" stroke-linecap="round" />
        </svg>
        <div class="heap" id="heap"></div>
        <svg viewBox="0 0 164 110">
          <defs>
            <pattern id="weave" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="var(--wicker)" /><path d="M0 3h7M7 9h7" stroke="var(--wicker-d)" stroke-width="2.4" /><path d="M7 0v6M0 6v6M14 6v6" stroke="rgba(255,255,255,.25)" stroke-width="1" /></pattern>
          </defs>
          <path d="M10 52H154L140 106H24Z" fill="url(#weave)" />
          <path d="M10 52H154L140 106H24Z" fill="none" stroke="var(--wicker-d)" stroke-width="2" />
          <rect x="4" y="44" width="156" height="14" rx="7" fill="var(--wicker-d)" />
          <rect x="8" y="46" width="148" height="4" rx="2" fill="rgba(255,255,255,.25)" />
        </svg>
        <span class="count" id="count">0</span>
      </div>
    </div>

    <div class="sum">
      <div class="sumTop">
        <div>Basket total<b id="total">PKR 0</b></div>
        <button class="checkout" id="checkout" type="button" disabled><span id="coTxt">Checkout</span></button>
      </div>
      <div class="chips" id="chips" aria-label="In your basket"></div>
    </div>
    <p class="vh" id="status" aria-live="polite"></p>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Peg Line: wishlist pieces hang on a washing line; tap one and it drops into the basket (your cart) ----------
  const $ = (id) => document.getElementById(id);
  const PIECES = [
    { id: "kurta", name: "Lawn kurta", price: 3490, fx: .17, w: 64, h: 116, weight: 1.2, tilt: -4,
      svg: '<svg viewBox="0 0 64 116" width="64" height="116"><path d="M22 4h20l14 10 6 22-9 3-5-14v84l-6 3H22l-6-3V25l-5 14-9-3 6-22z" fill="#8fd6be"/><path d="M26 4q6 10 12 0" fill="none" stroke="#e7b84d" stroke-width="2.4"/><g fill="#e7b84d"><circle cx="32" cy="18" r="1.6"/><circle cx="32" cy="26" r="1.6"/><circle cx="32" cy="34" r="1.6"/></g><path d="M16 96h32" stroke="#5fb79b" stroke-width="3" stroke-dasharray="4 3"/><path d="M18 80v29M46 80v29" stroke="#6cc4a6" stroke-width="1.4"/></svg>' },
    { id: "dupatta", name: "Chiffon dupatta", price: 1850, fx: .39, w: 58, h: 128, weight: .7, tilt: 3,
      svg: '<svg viewBox="0 0 58 128" width="58" height="128"><path d="M4 4h50l-6 104H10z" fill="#f49ac1"/><path d="M6 4l8 104M52 4l-8 104" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/><path d="M10 96h38" stroke="#e7b84d" stroke-width="5"/><path d="M10 102h38" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 3"/><g stroke="#e46a9e" stroke-width="2" stroke-linecap="round"><path d="M13 108v12M20 108v14M27 108v12M34 108v14M41 108v12M47 108v13"/></g><path d="M4 4h50" stroke="#e46a9e" stroke-width="3"/></svg>' },
    { id: "socks", name: "Wool socks", price: 650, fx: .61, w: 66, h: 84, weight: .45, tilt: -2,
      svg: '<svg viewBox="0 0 66 84" width="66" height="84"><path d="M6 4h20v48l12 12a9 9 0 0 1-13 12L10 62Q6 58 6 52z" fill="#f2c14e"/><path d="M6 14h20M6 22h20" stroke="#e0703b" stroke-width="3.4"/><path d="M36 4h20v52l10 12a9 9 0 0 1-13 11L40 66q-4-4-4-10z" fill="#f2c14e" opacity=".92"/><path d="M36 14h20M36 22h20" stroke="#e0703b" stroke-width="3.4"/></svg>' },
    { id: "cap", name: "Cotton cap", price: 990, fx: .83, w: 70, h: 62, weight: .5, tilt: 4,
      svg: '<svg viewBox="0 0 70 62" width="70" height="62"><path d="M35 4v6" stroke="#2b3a67" stroke-width="2"/><path d="M8 40a27 27 0 0 1 54 0z" fill="#2b3a67"/><path d="M35 13v27M19 18q8 10 6 22M51 18q-8 10-6 22" stroke="#43548a" stroke-width="1.6" fill="none"/><path d="M4 40h50q14 0 14 6-6 6-26 4H4z" fill="#1e2a4f"/><circle cx="35" cy="13" r="3" fill="#e5537d"/></svg>' },
  ];
  const fmt = (n) => "PKR " + n.toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 120) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const HEART = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17s-6.5-4-6.5-8.6A3.6 3.6 0 0 1 10 6a3.6 3.6 0 0 1 6.5 2.4C16.5 13 10 17 10 17z" fill="#e5537d"/></svg>';

  const yard = $("yard"), itemsEl = $("items"), heap = $("heap"), basket = $("basket");
  // Build the hanging pieces, their pegs and their small copies in the basket
  PIECES.forEach((p, i) => {
    p.state = "hang"; p.a = 0; p.v = 0; p.phase = i * 1.7;
    p.el = document.createElement("button");
    p.el.type = "button"; p.el.className = "item";
    p.el.style.width = p.w + "px"; p.el.style.height = p.h + "px";
    p.el.setAttribute("aria-label", `${p.name}, ${fmt(p.price)}. Move to basket`);
    p.el.innerHTML = p.svg + `<span class="tag" style="--tilt:${p.tilt}deg">${HEART}${fmt(p.price)}</span>`;
    p.el.addEventListener("click", () => drop(p));
    itemsEl.appendChild(p.el);
    p.peg = document.createElement("span");
    p.peg.className = "peg"; p.peg.innerHTML = '<span class="jaw l"></span><span class="jaw r"></span>';
    yard.appendChild(p.peg);
    p.mini = document.createElement("span");
    p.mini.style.left = 4 + i * 26 + "px";
    p.mini.style.setProperty("--r", (i % 2 ? 9 : -8) + "deg");
    p.mini.innerHTML = p.svg;
    heap.appendChild(p.mini);
  });

  // ---------- Rope: a quadratic curve whose sag springs with the weight on it ----------
  const rope = { s: 30, v: 0 };
  const Y0 = 30;
  const W = () => yard.clientWidth;
  const ropeY = (x) => { const w = W(), t = Math.min(1, Math.max(0, (x - 10) / (w - 20))); return Y0 + 4 * rope.s * t * (1 - t); };
  const sagTarget = () => 12 + PIECES.reduce((a, p) => a + (p.state === "hang" || p.state === "rise" ? p.weight * 11 : 0), 0);
  // falling or rising pieces travel on their own path (scene px)
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    const t = now / 1000, w = W();
    if (calm()) { rope.s = sagTarget(); rope.v = 0; }
    else { rope.v += ((sagTarget() - rope.s) * 90 - rope.v * 5) * dt; rope.s += rope.v * dt; }
    const d = `M10 ${Y0} Q${w / 2} ${Y0 + 2 * rope.s} ${w - 10} ${Y0}`;
    $("rope").setAttribute("d", d); $("rope2").setAttribute("d", d);
    for (const p of PIECES) {
      const x = w * p.fx, y = ropeY(x);
      // the peg always sits on the rope
      p.peg.style.transform = `translate(${x - 6}px, ${y - 9}px) rotate(${(p.state === "hang" ? p.a * .4 : Math.sin(t * 3 + p.phase) * 4).toFixed(2)}deg)`;
      if (p.state === "hang") {
        // swing: a spring back to straight, a light breeze, and the rope's bounce passed on
        const wind = calm() ? 0 : Math.sin(t * 1.4 + p.phase) * 9 + Math.sin(t * 3.1 + p.phase * 2) * 3;
        p.v += (-p.a * 26 - p.v * 2.4 + wind - rope.v * .6) * dt; p.a += p.v * dt;
        if (calm()) p.a = 0;
        p.el.style.transform = `translate(${(x - p.w / 2).toFixed(1)}px, ${(y - 4).toFixed(1)}px) rotate(${p.a.toFixed(2)}deg)`;
      } else if (p.state === "fall") {
        p.t += dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1500 * dt; p.rot += p.vr * dt;
        const k = Math.min(1, p.t / p.T);
        p.el.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg) scale(${(1 - k * .45).toFixed(3)})`;
        if (p.t >= p.T) land(p);
      } else if (p.state === "rise") {
        p.t = Math.min(1, p.t + dt / .75);
        const e = 1 + 2.2 * Math.pow(p.t - 1, 3) + 1.2 * Math.pow(p.t - 1, 2); // ease out with a little overshoot
        const tx = x - p.w / 2, ty = y - 4, hop = Math.sin(p.t * Math.PI) * -60;
        p.el.style.transform = `translate(${(p.sx + (tx - p.sx) * e).toFixed(1)}px, ${(p.sy + (ty - p.sy) * e + hop).toFixed(1)}px) rotate(${((1 - p.t) * 30).toFixed(1)}deg) scale(${(.55 + .45 * Math.min(1, e)).toFixed(3)})`;
        if (p.t >= 1) { p.state = "hang"; p.a = 0; p.v = -60; p.peg.classList.remove("open"); }
      }
    }
    requestAnimationFrame(loop);
  }

  // ---------- Moving a piece into the basket ----------
  async function drop(p) {
    if (p.state !== "hang" || busyCheckout) return;
    p.state = "tug";
    say(`Dropping into your basket: ${p.name}.`);
    // anticipation: the piece gets a tug downward and the peg opens
    const cur = p.el.style.transform;
    p.peg.classList.add("open");
    await play(p.el, [{ transform: cur }, { transform: cur + " translateY(10px) scaleY(1.06)", offset: .55 }, { transform: cur + " translateY(-3px)" }], { duration: 260, easing: "ease-in-out" });
    // main: it falls on a curve to the basket's mouth; the rope springs up and the others bounce
    const yr = yard.getBoundingClientRect(), br = basket.getBoundingClientRect();
    const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(p.el.style.transform) || [0, 0, 0];
    p.x = +m[1]; p.y = +m[2];
    const tx = br.left - yr.left + br.width / 2 - p.w / 2, ty = br.top - yr.top - p.h * .25;
    p.T = calm() ? .01 : .55; p.t = 0;
    p.vx = (tx - p.x) / p.T; p.vy = (ty - p.y - .5 * 1500 * p.T * p.T) / p.T;
    p.rot = p.a; p.vr = (tx > p.x ? 1 : -1) * (120 + Math.random() * 120);
    p.state = "fall";
    setTimeout(() => p.peg.classList.remove("open"), 300);
    PIECES.forEach((o) => { if (o !== p && o.state === "hang") o.v += (Math.random() - .5) * 90; });
    updateSaved();
  }
  function land(p) {
    p.state = "basket";
    p.el.classList.add("gone");
    p.el.style.transform = "";
    p.mini.classList.add("in");
    play(basket, [{ transform: "none" }, { transform: "scale(1.1, .82)", offset: .25 }, { transform: "scale(.95, 1.07)", offset: .55 }, { transform: "scale(1.02, .98)", offset: .78 }, { transform: "none" }], { duration: 560 });
    play($("count"), [{ transform: "scale(1)" }, { transform: "scale(1.5)", offset: .4 }, { transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(.3,1.6,.5,1)" });
    const br = basket.getBoundingClientRect();
    hearts(br.left + br.width / 2, br.top + 30, 9);
    renderBasket();
    say(`In your basket: ${p.name}. Basket total ${fmt(total())}.`);
  }

  // ---------- Hanging a piece back on the line ----------
  function hangBack(p, focusAfter) {
    if (p.state !== "basket") return;
    const yr = yard.getBoundingClientRect(), br = basket.getBoundingClientRect();
    p.sx = br.left - yr.left + br.width / 2 - p.w / 2; p.sy = br.top - yr.top - p.h * .3;
    p.mini.classList.remove("in");
    p.el.classList.remove("gone");
    p.peg.classList.add("open");
    p.t = calm() ? 1 : 0;
    p.state = "rise";
    renderBasket();
    updateSaved();
    say(`Back on the line: ${p.name}.`);
    if (focusAfter) setTimeout(() => p.el.focus(), 50);
  }

  // ---------- Basket list and totals ----------
  const inBasket = () => PIECES.filter((p) => p.state === "basket");
  const total = () => inBasket().reduce((a, p) => a + p.price, 0);
  let shown = 0;
  function renderBasket() {
    const list = inBasket(), t = total(), chips = $("chips");
    $("count").textContent = list.length;
    chips.innerHTML = "";
    list.forEach((p) => {
      const c = document.createElement("span");
      c.className = "chip";
      c.innerHTML = `${p.name}<button type="button" aria-label="Hang ${p.name} back on the line"><svg viewBox="0 0 12 12"><path d="M6 10V3M3 5.5L6 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
      c.querySelector("button").addEventListener("click", () => hangBack(p, true));
      chips.appendChild(c);
    });
    const from = shown; shown = t;
    const s = performance.now();
    (function f(now) { const k = calm() ? 1 : Math.min(1, (now - s) / 500); $("total").textContent = fmt(Math.round(from + (t - from) * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(f); })(s);
    const co = $("checkout");
    co.disabled = !list.length || busyCheckout;
    if (!busyCheckout) $("coTxt").textContent = list.length ? `Checkout · ${list.length}` : "Checkout";
  }
  function updateSaved() {
    const n = PIECES.filter((p) => p.state === "hang" || p.state === "rise" || p.state === "tug").length;
    $("saved").textContent = `${n} on the line`;
  }

  // ---------- Checkout: the basket hops, hearts and confetti fly, then the line is restocked ----------
  let busyCheckout = false;
  async function checkout() {
    const list = inBasket();
    if (!list.length || busyCheckout) return;
    busyCheckout = true;
    const co = $("checkout"), t = total();
    co.disabled = true;
    play(co, [{ transform: "scale(1)" }, { transform: "scale(.93, .88)", offset: .3 }, { transform: "scale(1.03)", offset: .7 }, { transform: "scale(1)" }], { duration: 400 });
    $("coTxt").textContent = "Paying…";
    say(`Paying ${fmt(t)}…`);
    const s = performance.now();
    await new Promise((res) => (function f(now) { const k = calm() ? 1 : Math.min(1, (now - s) / 1100); co.style.setProperty("--p", k.toFixed(3)); k < 1 ? requestAnimationFrame(f) : res(); })(s));
    await play(basket, [{ transform: "none" }, { transform: "scale(1.08, .86)", offset: .2 }, { transform: "translateY(-26px) scale(.96, 1.06)", offset: .55 }, { transform: "translateY(0) scale(1.06, .92)", offset: .8 }, { transform: "none" }], { duration: 700 });
    co.classList.add("ok");
    co.style.setProperty("--p", 0);
    $("coTxt").textContent = "Ordered ✓";
    const br = basket.getBoundingClientRect();
    hearts(br.left + br.width / 2, br.top + 20, 14);
    confetti(br.left + br.width / 2, br.top + 20, 36);
    say(`Order placed for ${list.length} ${list.length === 1 ? "piece" : "pieces"}, ${fmt(t)}.`);
    await wait(1500);
    // the shop restocks the line: every piece flies back to its peg, one by one
    for (const p of list) { hangBack(p, false); await wait(180); }
    co.classList.remove("ok");
    busyCheckout = false;
    renderBasket();
  }
  $("checkout").addEventListener("click", checkout);

  // ---------- Hearts and confetti ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false, fxLast = 0;
  function sizeFx() { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  sizeFx(); addEventListener("resize", sizeFx);
  function go() { if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(drawFx); } }
  function hearts(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) parts.push({ k: "h", x: x + (Math.random() - .5) * 90, y, vx: (Math.random() - .5) * 60, vy: -90 - Math.random() * 120, life: 0, max: 1 + Math.random() * .6, s: 5 + Math.random() * 5, ph: Math.random() * 6, c: i % 3 ? "#e5537d" : "#ff9cb9" });
    go();
  }
  function confetti(x, y, n) {
    if (calm()) return;
    const C = ["#e5537d", "#43b28f", "#f2c14e", "#8fd6be", "#ffffff"];
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 160 + Math.random() * 240; parts.push({ k: "c", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 1.1 + Math.random() * .5, w: 4 + Math.random() * 4, h: 6 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * 14, c: C[i % C.length] }); }
    go();
  }
  function drawFx(now) {
    const dt = Math.min(.04, (now - fxLast) / 1000); fxLast = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life > p.max) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, (p.max - p.life) * 2.5);
      if (p.k === "h") {
        p.vy *= .985; p.x += (p.vx + Math.sin(p.life * 6 + p.ph) * 30) * dt; p.y += p.vy * dt;
        const s = p.s;
        ctx.fillStyle = p.c; ctx.beginPath();
        ctx.moveTo(p.x, p.y + s * .9);
        ctx.bezierCurveTo(p.x - s * 1.4, p.y, p.x - s * .8, p.y - s * 1.1, p.x, p.y - s * .35);
        ctx.bezierCurveTo(p.x + s * .8, p.y - s * 1.1, p.x + s * 1.4, p.y, p.x, p.y + s * .9);
        ctx.fill();
      } else {
        p.vx *= .985; p.vy = p.vy * .985 + 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.life * 8)); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function say(m) { $("status").textContent = m; }

  // ---------- Auto-demo: drops pieces, hangs one back, checks out, loops ----------
  const demo = { on: true, timer: 0 };
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.timer); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  const P = (id) => PIECES.find((p) => p.id === id);
  const SCRIPT = [[350, () => drop(P("dupatta"))], [1300, () => drop(P("socks"))], [1500, () => hangBack(P("socks"))], [1300, () => drop(P("kurta"))], [1500, () => checkout()], [4600, () => {}]];
  let step = 0;
  function runDemo() {
    if (!demo.on) return;
    SCRIPT[step][1]();
    step = (step + 1) % SCRIPT.length;
    demo.timer = setTimeout(runDemo, SCRIPT[step][0]);
  }

  renderBasket();
  requestAnimationFrame(loop);
  demo.timer = setTimeout(runDemo, SCRIPT[0][0]);
</script>
</body>
</html>
