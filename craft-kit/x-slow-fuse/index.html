<!doctype html>
<!-- Chill & Craft · Slow Fuse · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Fuse · hold-to-delete button</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    color-scheme: light;
    --bg1: #fbf4ea;
    --bg2: #efe0cc;
    --dot: rgba(120, 80, 40, .09);
    --ink: #2a211b;
    --muted: #8a7867;
    --card: #fffaf3;
    --card-line: #ecdcc8;
    --slot: #d9c4aa;
    --btn: #201914;
    --btn-top: #3a2c22;
    --btn-ink: #f6ede2;
    --rope: #d9b37a;
    --ash: #5f554d;
    --ember: #ff6a1a;
    --ember-hi: #ffc35a;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1d1713;
    --bg2: #0d0a08;
    --dot: rgba(255, 200, 150, .05);
    --ink: #f4ebe1;
    --muted: #a8968a;
    --card: #231c17;
    --card-line: #3a2f27;
    --slot: #4a3d33;
    --btn: #2a211b;
    --btn-top: #3d3027;
    --btn-ink: #f6ede2;
    --rope: #c99d5e;
    --ash: #6f655d;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  /* ---------- Stage: warm paper with a soft glow ---------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(var(--dot) 1.1px, transparent 1.4px) 0 0 / 20px 20px,
      radial-gradient(900px 520px at 50% 38%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 36px 16px; width: 100%; }

  /* ---------- The file card that burns away ---------- */
  .slot {
    position: relative;
    width: min(340px, 100%);
    height: 112px;
    border-radius: 20px;
    border: 2px dashed transparent;
    transition: border-color .4s;
  }
  .slot.empty { border-color: var(--slot); }
  /* The mask box reaches 24px past the card so the shadow survives; --b is the burn line from its bottom */
  .burn {
    --b: -30px;
    position: absolute;
    inset: -24px;
    padding: 24px;
    -webkit-mask-image: linear-gradient(to top, transparent var(--b), #000 calc(var(--b) + 14px));
    mask-image: linear-gradient(to top, transparent var(--b), #000 calc(var(--b) + 14px));
  }
  .card {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px 12px 12px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--card-line);
    box-shadow: 0 20px 40px -26px rgba(70, 35, 10, .55), 0 2px 0 rgba(255, 255, 255, .5) inset;
  }
  .thumb { flex: none; width: 84px; height: 84px; border-radius: 13px; overflow: hidden; box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .5); }
  .thumb svg { display: block; width: 100%; height: 100%; }
  .lantern { transform-box: fill-box; transform-origin: 50% 0; animation: swing 3.2s ease-in-out infinite; }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
  .twinkle:nth-of-type(2n) { animation-delay: -1.1s; }
  .info { min-width: 0; display: grid; gap: 5px; }
  .info b { font-size: 16px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info span { font-size: 13px; color: var(--muted); }
  .chip { justify-self: start; font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: rgba(255, 106, 26, .12); color: #c2511a; }
  :root[data-theme="dark"] .chip { color: #ffab73; }

  /* The glowing burn line that climbs the card */
  .edge {
    position: absolute;
    left: -2px;
    right: -2px;
    bottom: 0;
    height: 26px;
    opacity: 0;
    pointer-events: none;
    background: linear-gradient(to top, rgba(255, 90, 20, 0), rgba(255, 106, 26, .95) 38%, rgba(255, 214, 140, 1) 50%, rgba(70, 30, 8, .85) 64%, rgba(40, 20, 5, 0));
    filter: blur(1.4px) drop-shadow(0 0 8px rgba(255, 110, 30, .9));
    border-radius: 6px;
  }
  /* little flame tongues that flicker along the burn line */
  .edge::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 40%;
    height: 22px;
    background: radial-gradient(ellipse 9px 11px at 50% 100%, rgba(255, 232, 160, .95), rgba(255, 120, 30, .75) 45%, rgba(255, 90, 20, 0) 72%) 0 100% / 19px 100% repeat-x;
    animation: tongues .32s steps(2) infinite;
  }
  .edge.cool::before { display: none; }
  .edge.on { opacity: 1; }
  .edge.cool { background: linear-gradient(to top, rgba(160, 230, 255, 0), rgba(190, 240, 255, .9) 45%, #fff 52%, rgba(160, 230, 255, 0)); filter: blur(1.2px) drop-shadow(0 0 8px rgba(150, 220, 255, .9)); }

  /* Empty slot shown after the card is gone */
  .gone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 16px 0 20px;
    opacity: 0;
    visibility: hidden;
    transform: scale(.94);
    transition: opacity .35s, transform .6s var(--spring), visibility 0s .35s;
  }
  .slot.empty .gone { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .gone p { margin: 0; display: grid; gap: 3px; font-size: 14.5px; font-weight: 650; }
  .gone p span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .ghost {
    flex: none;
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    padding: 9px 14px;
    border-radius: 12px;
    border: 1px solid var(--card-line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: transform .3s var(--spring), border-color .2s;
  }
  .ghost:hover { transform: translateY(-1px); border-color: var(--rope); }
  .ghost:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* ---------- Hold button with a fuse around its edge ---------- */
  .hold {
    --p: 0;
    position: relative;
    width: 260px;
    height: 60px;
    padding: 0;
    border: 0;
    border-radius: 30px;
    background: linear-gradient(180deg, var(--btn-top), var(--btn));
    color: var(--btn-ink);
    font: inherit;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 22px 34px -20px rgba(50, 20, 0, .85), inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 -3px 0 rgba(0, 0, 0, .25);
    transition: transform .4s var(--spring), box-shadow .3s;
  }
  .hold:hover { transform: translateY(-2px); }
  .hold:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
  .hold[data-state="holding"] { transform: scale(.965); box-shadow: 0 12px 24px -14px rgba(255, 90, 20, calc(var(--p) * .9)), 0 0 calc(var(--p) * 26px) rgba(255, 106, 26, calc(var(--p) * .35)), inset 0 1px 0 rgba(255, 255, 255, .09); }
  .hold[data-state="burning"], .hold[data-state="gone"] { cursor: default; }

  .fuse { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .fuse path { fill: none; stroke-width: 3.2; stroke-linecap: round; }
  .fuse .rope { stroke: var(--rope); stroke-dasharray: 6 2.4; stroke-width: 3; }
  .fuse .ash { stroke: var(--ash); stroke-dasharray: 0 999; }
  .fuse .hot { stroke: var(--ember); stroke-dasharray: 0 999; filter: drop-shadow(0 0 3px var(--ember)); }

  .spark {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .spark::before {
    content: "";
    position: absolute;
    left: -8px;
    top: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0 22%, var(--ember-hi) 38%, rgba(255, 106, 26, .9) 56%, rgba(255, 106, 26, 0) 72%);
    filter: drop-shadow(0 0 6px #ff8a2a);
    transform: scale(.55);
    animation: smoulder 1.8s ease-in-out infinite;
  }
  .hold[data-state="holding"] .spark::before { transform: scale(1.25); animation: flicker .09s linear infinite alternate; }
  .hold[data-state="burning"] .spark, .hold[data-state="gone"] .spark { opacity: 0; }

  .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .flame { width: 20px; height: 22px; flex: none; transform-origin: 50% 90%; transform: scale(calc(1 + var(--p) * .35)); }
  .flame path { fill: var(--ember); }
  .flame .core { fill: var(--ember-hi); }
  .hold[data-state="holding"] .flame { animation: dance .16s ease-in-out infinite alternate; }
  .txt {
    font-size: 16.5px;
    font-weight: 680;
    letter-spacing: .01em;
    white-space: nowrap;
    background: linear-gradient(90deg, var(--ember-hi) calc(var(--p) * 100%), var(--btn-ink) calc(var(--p) * 100%));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tick { display: none; width: 18px; height: 18px; fill: none; stroke: #7ee2a8; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .tick path { stroke-dasharray: 18; stroke-dashoffset: 18; transition: stroke-dashoffset .45s .1s ease-out; }
  .hold[data-state="gone"] .tick { display: block; }
  .hold[data-state="gone"] .tick path { stroke-dashoffset: 0; }
  .hold[data-state="gone"] .flame { display: none; }

  .hint { margin: -8px 0 0; min-height: 1.4em; font-size: 13.5px; color: var(--muted); text-align: center; transition: color .3s; }
  .hint.warn { color: #c2511a; }
  :root[data-theme="dark"] .hint.warn { color: #ffab73; }

  /* Sparks, embers, ash and smoke are drawn here */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes smoulder { 0%, 100% { transform: scale(.5); opacity: .75; } 50% { transform: scale(.75); opacity: 1; } }
  @keyframes flicker { from { transform: scale(1.1); } to { transform: scale(1.4); } }
  @keyframes dance { from { transform: scale(calc(1 + var(--p) * .35)) rotate(-5deg); } to { transform: scale(calc(1.05 + var(--p) * .35), calc(.95 + var(--p) * .35)) rotate(5deg); } }
  @keyframes swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes tongues { 0% { background-position: 0 100%; transform: scaleY(1); } 50% { background-position: 9px 100%; transform: scaleY(1.25); } 100% { background-position: 4px 100%; transform: scaleY(.9); } }
  @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* Calm mode: every step still works, without big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="slot" id="slot">
    <div class="burn" id="burn">
      <article class="card" aria-label="Eid sale poster.psd, 48.2 megabytes">
        <div class="thumb" aria-hidden="true">
          <svg viewBox="0 0 88 88">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f6152" /><stop offset="1" stop-color="#0a3734" /></linearGradient>
            </defs>
            <rect width="88" height="88" fill="url(#sky)" />
            <circle class="twinkle" cx="16" cy="14" r="1.3" fill="#fff4d0" />
            <circle class="twinkle" cx="34" cy="9" r="1" fill="#fff4d0" />
            <circle class="twinkle" cx="76" cy="40" r="1.2" fill="#fff4d0" />
            <circle class="twinkle" cx="24" cy="32" r=".9" fill="#fff4d0" />
            <circle cx="60" cy="24" r="12" fill="#f6d27a" />
            <circle cx="66" cy="20" r="10.5" fill="#0f5d50" />
            <g class="lantern">
              <path d="M30 0v13" stroke="#e8c271" stroke-width="1" />
              <path d="M26 13h8l2 4v10l-2 4h-8l-2-4V17z" fill="#f2a93b" />
              <path d="M27.5 17h5v10h-5z" fill="#ffe7a8" />
              <path d="M28 31h4v2h-4z" fill="#c9852a" />
            </g>
            <text x="44" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" letter-spacing="1" fill="#f6d27a">EID SALE</text>
            <text x="44" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#cfe9df">up to 40% off</text>
          </svg>
        </div>
        <div class="info">
          <b>Eid sale poster.psd</b>
          <span>48.2 MB · edited 3 days ago</span>
          <em class="chip">Draft</em>
        </div>
      </article>
    </div>
    <div class="edge" id="edge" aria-hidden="true"></div>
    <div class="gone" id="gone">
      <p>Poster deleted<span>48.2 MB freed</span></p>
      <button class="ghost" id="restore" type="button" tabindex="-1">Bring it back</button>
    </div>
  </div>

  <button class="hold" id="hold" type="button" data-state="idle" aria-describedby="hint">
    <svg class="fuse" viewBox="0 0 260 60" aria-hidden="true">
      <!-- the fuse starts at the top centre and runs clockwise around the pill -->
      <path id="rope" class="rope" d="M130 2H230A28 28 0 0 1 258 30A28 28 0 0 1 230 58H30A28 28 0 0 1 2 30A28 28 0 0 1 30 2Z" />
      <path id="ash" class="ash" d="M130 2H230A28 28 0 0 1 258 30A28 28 0 0 1 230 58H30A28 28 0 0 1 2 30A28 28 0 0 1 30 2Z" />
      <path id="hot" class="hot" d="M130 2H230A28 28 0 0 1 258 30A28 28 0 0 1 230 58H30A28 28 0 0 1 2 30A28 28 0 0 1 30 2Z" />
    </svg>
    <span class="spark" id="spark" aria-hidden="true"></span>
    <span class="face" id="face">
      <svg class="flame" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1c1 4 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.6 3-6 0 2 .8 3.4 2 4 0-4 .2-7 1-10z" /><path class="core" d="M10 11c.6 2 3 3 3 5.4a3 3 0 0 1-6 0c0-1.6 1-2.4 1.8-3 .1 1 .5 1.6 1 1.8 0-1.7 0-3 .2-4.2z" /></svg>
      <svg class="tick" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.5l3.5 3.5 7.5-8" /></svg>
      <span class="txt" id="txt">Hold to delete</span>
    </span>
  </button>
  <p class="hint" id="hint">Press and hold 1.5 s · let go to stop</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Slow Fuse: hold to light a fuse; when it burns all the way round, the card burns away ----------
  const $ = (id) => document.getElementById(id);
  const hold = $("hold"), rope = $("rope"), ash = $("ash"), hot = $("hot"), spark = $("spark"), face = $("face");
  const txt = $("txt"), hint = $("hint"), status = $("status");
  const slot = $("slot"), burnBox = $("burn"), edge = $("edge"), restoreBtn = $("restore");

  const HOLD_MS = 1500;          // how long a full hold takes
  const L = rope.getTotalLength(); // fuse length in SVG units (1 unit = 1 px here)
  const IDLE_HINT = "Press and hold 1.5 s · let go to stop";

  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 300) : ms));
  const easeInOut = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  function play(el, frames, opts) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  // Run fn(t) for t = 0..1 over ms
  function tween(ms, fn, ease) {
    ease = ease || ((t) => t);
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) {
        const t = Math.max(0, Math.min(1, (now - s) / ms));
        fn(ease(t));
        if (t < 1) requestAnimationFrame(f); else res();
      });
    });
  }

  // ---------- Particles on a full-screen canvas ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false, fxLast = 0;
  function sizeFx() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeFx();
  addEventListener("resize", sizeFx);
  // kind: spark (fast, falls), ember (rises, glows), ash (grey flake, drifts up), smoke (soft puff)
  function emit(kind, x, y, vx, vy) {
    if (calm() || parts.length > 420) return;
    const P = { kind, x, y, vx, vy, life: 0, rot: Math.random() * 6, vr: (Math.random() - .5) * 8 };
    if (kind === "spark") Object.assign(P, { max: .35 + Math.random() * .35, g: 520, drag: .985, size: 1.4 + Math.random() * 1.4 });
    if (kind === "ember") Object.assign(P, { max: .7 + Math.random() * .7, g: -60, drag: .975, size: 1.5 + Math.random() * 2 });
    if (kind === "ash") Object.assign(P, { max: 1.1 + Math.random() * .9, g: -40, drag: .97, size: 2.5 + Math.random() * 3.5 });
    if (kind === "smoke") Object.assign(P, { max: 1 + Math.random() * .8, g: -30, drag: .96, size: 9 + Math.random() * 8 });
    parts.push(P);
    if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(drawFx); }
  }
  function drawFx(now) {
    const dt = Math.max(0, Math.min(.05, (now - fxLast) / 1000)); fxLast = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const dark = document.documentElement.dataset.theme === "dark";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g * dt;
      if (p.kind === "ash" || p.kind === "smoke") p.vx += Math.sin(p.life * 5 + p.rot) * 14 * dt; // lazy drift
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const k = p.life / p.max, a = 1 - k;
      if (p.kind === "spark" || p.kind === "ember") {
        ctx.globalCompositeOperation = dark ? "lighter" : "source-over";
        ctx.fillStyle = p.kind === "spark" ? `rgba(255, ${200 - k * 80 | 0}, 90, ${a})` : `rgba(255, ${120 + (1 - k) * 60 | 0}, 30, ${a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k * .5), 0, 7); ctx.fill();
      } else if (p.kind === "ash") {
        ctx.globalCompositeOperation = "source-over";
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = dark ? `rgba(150, 140, 130, ${a * .9})` : `rgba(70, 62, 56, ${a * .85})`;
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66);
        ctx.restore();
      } else {
        // soft smoke: a radial fade, never a hard disc
        ctx.globalCompositeOperation = "source-over";
        const rad = p.size * (1 + k * 1.8), rgb = dark ? "205, 195, 185" : "125, 108, 96";
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
        g.addColorStop(0, `rgba(${rgb}, ${(a * .2).toFixed(3)})`);
        g.addColorStop(1, `rgba(${rgb}, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Fuse drawing ----------
  let p = 0;            // hold progress 0..1
  let state = "idle";   // idle | holding | fizzle | burning | gone
  let loopOn = false, last = 0, heldByDemo = false, demoReleaseAt = null, restoreNow = null;

  function setState(s) { state = s; hold.dataset.state = s; }
  function say(msg) { if (!demo.on) status.textContent = msg; }

  // Draw the burnt part of the fuse and move the spark; returns the spark point in page pixels
  function drawFuse(burned) {
    burned = Math.max(0, Math.min(L, burned));
    ash.style.strokeDasharray = burned + " " + (L + 2);
    const hotLen = Math.min(18, burned);
    hot.style.strokeDasharray = "0 " + (burned - hotLen) + " " + hotLen + " " + (L + 2);
    const pt = rope.getPointAtLength(Math.min(burned, L - .01));
    spark.style.transform = "translate(" + pt.x + "px, " + pt.y + "px)";
    const r = hold.getBoundingClientRect();
    return { x: r.left + pt.x * (r.width / 260), y: r.top + pt.y * (r.height / 60) };
  }

  function loop(now) {
    const dt = Math.max(0, Math.min(50, now - last)); last = now;
    if (state === "holding") {
      p = Math.min(1, p + dt / HOLD_MS);
      if (demoReleaseAt !== null && p >= demoReleaseAt) { demoReleaseAt = null; release(); }
    } else if (state === "fizzle") {
      p = Math.max(0, p - dt / 420);       // the fuse grows back
      if (p === 0) setState("idle");
    }
    const at = drawFuse(L * p);
    hold.style.setProperty("--p", p.toFixed(3));
    if (state === "holding") {
      // sparks spit off the burning tip, the label shivers more as it nears the end
      for (let i = 0; i < 2; i++) emit("spark", at.x, at.y, (Math.random() - .5) * 160, -60 - Math.random() * 120);
      if (Math.random() < .3) emit("smoke", at.x, at.y - 4, (Math.random() - .5) * 20, -30);
      const j = p * 1.3;
      face.style.transform = "translate(" + ((Math.random() - .5) * j).toFixed(2) + "px, " + ((Math.random() - .5) * j).toFixed(2) + "px)";
      if (p >= 1) { complete(at); }
    }
    if (state === "holding" || state === "fizzle") requestAnimationFrame(loop);
    else { loopOn = false; face.style.transform = ""; }
  }
  function kick() { if (!loopOn) { loopOn = true; last = performance.now(); requestAnimationFrame(loop); } }

  // ---------- Hold, let go ----------
  function startHold(byDemo) {
    if (state !== "idle" && state !== "fizzle") return;
    heldByDemo = !!byDemo;
    setState("holding");
    txt.textContent = "Keep holding…";
    hint.textContent = "Burning the fuse… let go to stop";
    hint.classList.remove("warn");
    if (calm()) { p = Math.max(p, .02); }
    kick();
  }
  function release() {
    if (state !== "holding") return;
    heldByDemo = false;
    if (p >= 1) return;
    setState("fizzle");
    const at = drawFuse(L * p);
    for (let i = 0; i < 7; i++) emit("smoke", at.x, at.y, (Math.random() - .5) * 50, -20 - Math.random() * 40);
    txt.textContent = "Hold to delete";
    hint.textContent = "Let go too soon · the fuse went out";
    hint.classList.add("warn");
    say("Delete stopped. Hold the button longer to delete.");
    kick();
  }

  // ---------- The fuse reached the end: burn the card ----------
  function setBurn(b) {
    burnBox.style.setProperty("--b", b + "px");
    edge.style.bottom = (b - 30) + "px";
  }
  async function complete(at) {
    setState("burning");
    hold.style.setProperty("--p", 1);
    for (let i = 0; i < 30; i++) { const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260; emit("spark", at.x, at.y, Math.cos(a) * v, Math.sin(a) * v - 60); }
    play(hold, [{ transform: "scale(.965)" }, { transform: "scale(1.06)", offset: .35 }, { transform: "scale(1)" }], { duration: 560, easing: "cubic-bezier(.3,1.6,.5,1)" });
    txt.textContent = "Deleting…";
    hint.classList.remove("warn");
    hint.textContent = "Deleting Eid sale poster.psd…";
    // anticipation: the card heats up and shivers
    await play(burnBox, [{ transform: "none", filter: "none" }, { transform: "translateX(-2px) rotate(-.4deg)", filter: "sepia(.4) saturate(1.4)", offset: .3 }, { transform: "translateX(2px) rotate(.4deg)", filter: "sepia(.6) saturate(1.6)", offset: .65 }, { transform: "none", filter: "sepia(.5) saturate(1.5)" }], { duration: 300 });
    slot.classList.add("empty");
    // main transformation: a burn line climbs from the bottom, leaving embers and ash
    const H = slot.offsetHeight, from = 4, to = H + 24 + 20;
    edge.classList.remove("cool");
    edge.classList.add("on");
    await tween(1250, (t) => {
      const b = from + (to - from) * t;
      setBurn(b);
      const r = slot.getBoundingClientRect(), y = r.bottom + 17 - b;
      if (y > r.top - 4 && y < r.bottom + 4) {
        for (let i = 0; i < 3; i++) {
          const x = r.left + 8 + Math.random() * (r.width - 16);
          emit(i ? "ember" : "ash", x, y, (Math.random() - .5) * 40, -40 - Math.random() * 70);
        }
        if (Math.random() < .25) emit("smoke", r.left + Math.random() * r.width, y - 6, 0, -30);
      }
    }, easeInOut);
    edge.classList.remove("on");
    // finish: the empty slot springs in, the button says Deleted, the fuse re-braids itself
    setState("gone");
    restoreBtn.tabIndex = 0;
    txt.textContent = "Deleted";
    hint.textContent = "Gone for good · it comes back in a moment";
    say("Eid sale poster.psd deleted. 48.2 MB freed.");
    tween(800, (t) => { drawFuse(L * (1 - t)); hold.style.setProperty("--p", (1 - t).toFixed(3)); }, easeOut);
    await Promise.race([wait(3400), new Promise((r) => (restoreNow = r))]);
    restoreNow = null;
    await restore();
  }

  // Smooth reset: the card re-forms top to bottom with a cool shimmer
  async function restore() {
    restoreBtn.tabIndex = -1;
    if (document.activeElement === restoreBtn) hold.focus();
    slot.classList.remove("empty");
    edge.classList.add("on", "cool");
    const H = slot.offsetHeight, from = H + 24 + 20, to = -30;
    await tween(700, (t) => {
      const b = from + (to - from) * t;
      setBurn(b);
      const r = slot.getBoundingClientRect(), y = r.bottom + 17 - b;
      if (Math.random() < .5 && y > r.top && y < r.bottom) emit("spark", r.left + Math.random() * r.width, y, 0, -20);
    }, easeOut);
    edge.classList.remove("on", "cool");
    setBurn(-30);
    burnBox.getAnimations().forEach((a) => a.cancel());
    p = 0; drawFuse(0); hold.style.setProperty("--p", 0);
    setState("idle");
    txt.textContent = "Hold to delete";
    hint.textContent = IDLE_HINT;
    say("Eid sale poster.psd is back.");
    if (demo.on) scheduleDemo(2400);
  }

  // Pointer: hold anywhere on the button; keyboard: hold Space or Enter
  hold.addEventListener("pointerdown", (e) => {
    if (e.button > 0) return;
    hold.setPointerCapture(e.pointerId);
    startHold(false);
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => hold.addEventListener(t, () => { if (!heldByDemo) release(); }));
  hold.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startHold(false); }
    else if (e.key === " " || e.key === "Enter") e.preventDefault();
  });
  hold.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); });
  hold.addEventListener("blur", () => { if (!heldByDemo) release(); });
  hold.addEventListener("contextmenu", (e) => e.preventDefault());
  restoreBtn.addEventListener("click", () => { if (restoreNow) restoreNow(); });

  // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
  const demo = { on: true, timer: 0, n: 0 };
  function stopDemo() {
    if (!demo.on) return;
    demo.on = false;
    clearTimeout(demo.timer);
    demoReleaseAt = null;
    if (heldByDemo) release();
  }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
  function runDemo() {
    if (!demo.on) return;
    if (state !== "idle") { scheduleDemo(1000); return; }
    demo.n++;
    if (demo.n % 3 === 2) {
      // every third run shows what letting go too early looks like
      demoReleaseAt = .55;
      startHold(true);
      scheduleDemo(3200);
    } else startHold(true); // full hold: restore() schedules the next run
  }

  // Idle life: the fuse tip smoulders and lets off a wisp now and then
  setInterval(() => {
    if (state !== "idle" || document.hidden) return;
    const at = drawFuse(0);
    emit("smoke", at.x, at.y - 3, (Math.random() - .5) * 10, -18);
  }, 1300);

  drawFuse(0);
  scheduleDemo(420);
</script>
</body>
</html>
