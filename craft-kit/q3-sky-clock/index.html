<!doctype html>
<!-- Chill & Craft · Sky Clock · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sky Clock · weather card whose sky follows the time of day</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: the card chrome is calm blue-grey; the sky itself is painted by the clock ---------- */
  :root {
    --bg: #dfe8f3; --bg-2: #f6f9fd; --card: #ffffff; --edge: rgba(18, 34, 58, 0.09); --ink: #12223a; --muted: #5e6d84; --soft: #eef3f9; --soft-2: #dde6f1;
    --accent: #2f6fe4; --on-accent: #fff; --shadow: rgba(20, 40, 80, 0.3); --focus: #2f6fe4;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #060a14; --bg-2: #111a2c; --card: #0e1524; --edge: rgba(255, 255, 255, 0.08); --ink: #e8f0ff; --muted: #93a3bf; --soft: #172135; --soft-2: #222e46;
    --accent: #80b4ff; --on-accent: #08142c; --shadow: rgba(0, 0, 0, 0.7); --focus: #80b4ff;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(70% 60% at 50% 0%, var(--bg-2), transparent 70%), var(--bg); }
  /* the page behind the card picks up a whisper of the current sky colour */
  .stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(55% 45% at 50% 40%, var(--tint, transparent), transparent 75%); opacity: 0.35; transition: background 0.6s; pointer-events: none; }

  .card { position: relative; width: min(860px, 100%); border-radius: 30px; background: var(--card); border: 1px solid var(--edge); padding: 12px; overflow: hidden;
    box-shadow: 0 50px 90px -50px var(--shadow), 0 12px 26px -20px var(--shadow); animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(0.96); } }

  /* ---------- City tabs with a sliding pill ---------- */
  .top { display: flex; align-items: center; gap: 10px; padding: 2px 2px 12px; }
  .tabs { position: relative; display: flex; flex: 1; min-width: 0; padding: 4px; border-radius: 16px; background: var(--soft); }
  .tabs .pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 12px; background: var(--card); box-shadow: 0 6px 14px -8px var(--shadow), 0 0 0 1px var(--edge); transition: transform 0.55s cubic-bezier(0.3, 1.45, 0.5, 1), width 0.55s cubic-bezier(0.3, 1.45, 0.5, 1); }
  .tab { position: relative; flex: 1; min-width: 0; border: 0; background: none; padding: 9px 6px; border-radius: 12px; font-size: 13.5px; font-weight: 750; color: var(--muted); transition: color 0.25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab[aria-pressed="true"] { color: var(--ink); }
  .now { flex: none; display: flex; align-items: center; gap: 7px; border: 1px solid var(--edge); background: var(--card); border-radius: 14px; padding: 9px 12px; font-size: 13px; font-weight: 750; transition: transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .now:active { transform: scale(0.93); }
  .now i { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; box-shadow: 0 0 0 0 rgba(229, 72, 77, 0.5); animation: live 1.8s ease-out infinite; }
  .now.off i { background: var(--muted); animation: none; }
  @keyframes live { 70% { box-shadow: 0 0 0 7px rgba(229, 72, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0); } }

  /* ---------- The scene ---------- */
  .scene { position: relative; height: 330px; border-radius: 22px; overflow: hidden; isolation: isolate; }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #eef3ff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  .flash.on { animation: flash 0.9s ease-out; }
  @keyframes flash { 0%, 20% { opacity: 0.7; } 10% { opacity: 0.15; } 100% { opacity: 0; } }
  .bolt { fill: none; stroke: #fff; stroke-width: 3; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0 0 6px #cfe0ff); }
  .bolt.on { animation: bolt 0.5s ease-out; }
  @keyframes bolt { 0%, 30% { opacity: 1; } 15% { opacity: 0.3; } 100% { opacity: 0; } }
  .stars circle { fill: #fff; animation: twinkle 3s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes twinkle { 50% { opacity: 0.25; } }
  .clouds { animation: drift linear infinite; }
  .clouds.c1 { animation-duration: 140s; } .clouds.c2 { animation-duration: 90s; } .clouds.c3 { animation-duration: 58s; }
  .fast .clouds { animation-duration: 30s !important; }
  @keyframes drift { to { transform: translateX(-800px); } }
  .city { transition: opacity 0.6s, transform 0.8s cubic-bezier(0.3, 1.35, 0.5, 1); }
  .city.off { opacity: 0; transform: translateY(40px); }
  .city .far { fill: var(--sil2); }
  .city .near { fill: var(--sil); }
  .city .hill { fill: var(--hill); }
  .win { fill: #ffd27a; opacity: clamp(0, calc((var(--night) - var(--th)) * 14), 1); transition: opacity 0.4s; }
  .sea-line { stroke: rgba(255, 255, 255, 0.55); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 10 24; animation: sea 4s linear infinite; }
  @keyframes sea { to { stroke-dashoffset: -68; } }
  .birds path { fill: none; stroke: var(--sil); stroke-width: 1.6; stroke-linecap: round; }
  .birds { animation: birds 26s linear infinite; }
  @keyframes birds { from { transform: translateX(-120px); } to { transform: translateX(920px); } }
  .birds path { animation: flap 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  #birds { transition: opacity 0.6s; }
  @keyframes flap { to { transform: scaleY(0.5); } }
  .sunwrap { transition: none; }
  .glide .sunwrap, .glide .moonwrap { transition: transform 0.06s linear; }

  /* text on the sky: a soft shade keeps it readable at every hour */
  .shade { position: absolute; inset: 0; background: radial-gradient(80% 90% at 0% 0%, rgba(4, 10, 30, 0.38), transparent 60%); pointer-events: none; }
  .readout { position: absolute; left: 22px; top: 18px; color: #fff; text-shadow: 0 2px 14px rgba(0, 10, 40, 0.35); }
  .place { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 760; }
  .place svg { width: 15px; height: 15px; fill: #fff; }
  .temp { display: flex; align-items: flex-start; font-size: 84px; line-height: 1; font-weight: 300; letter-spacing: -0.04em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .temp sup { font-size: 26px; font-weight: 500; margin: 8px 0 0 4px; letter-spacing: 0; }
  .odo { display: inline-flex; height: 1.1em; overflow: hidden; }
  .odo .sign { display: inline-block; width: 0; overflow: hidden; transition: width 0.4s; }
  .odo .sign.on { width: 0.45em; }
  .odo .col { display: inline-flex; flex-direction: column; transition: transform 0.9s cubic-bezier(0.3, 1.32, 0.5, 1); transition-delay: var(--dl, 0s); }
  .odo .col span { height: 1.1em; line-height: 1.1em; display: block; text-align: center; width: 0.6em; }
  .cond { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .cond.in { animation: condin 0.6s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes condin { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } }
  .hl { font-size: 13px; font-weight: 650; opacity: 0.85; margin-top: 3px; }
  .swapping .readout { animation: rout 0.75s cubic-bezier(0.4, 0, 0.3, 1); }
  @keyframes rout { 35% { opacity: 0; transform: translateY(-10px); filter: blur(5px); } 36% { transform: translateY(12px); } }
  .clock { position: absolute; right: 20px; top: 18px; text-align: right; color: #fff; text-shadow: 0 2px 12px rgba(0, 10, 40, 0.35); font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .clock small { display: block; font-size: 12px; font-weight: 650; opacity: 0.85; }

  /* ---------- Stats under the sky ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
  .stat { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 14px; background: var(--soft); min-width: 0; animation: statin 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) backwards; animation-delay: calc(var(--k) * 70ms + 0.5s); }
  @keyframes statin { from { opacity: 0; transform: translateY(12px); } }
  .stat svg { flex: none; width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stat small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .stat b { display: block; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Time scrubber: the track is painted with the day's sky ---------- */
  .scrub { position: relative; padding: 22px 10px 20px; }
  .scrub label { position: absolute; left: 10px; top: 2px; font-size: 12px; font-weight: 750; color: var(--muted); }
  .marks { position: absolute; left: 25px; right: 25px; top: 58px; height: 16px; pointer-events: none; }
  .marks span { position: absolute; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 750; color: var(--muted); white-space: nowrap; }
  .marks svg { width: 13px; height: 13px; fill: none; stroke: #f0a020; stroke-width: 2; stroke-linecap: round; }
  .range { position: relative; height: 34px; }
  .range input { position: absolute; inset: 0; width: 100%; height: 34px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .range input::-webkit-slider-runnable-track { height: 12px; border-radius: 99px; background: var(--track); }
  .range input::-moz-range-track { height: 12px; border-radius: 99px; background: var(--track); }
  .range input::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -9px; border-radius: 50%; background: transparent; border: 0; }
  .range input::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 0; }
  .range input:focus-visible { outline: none; }
  .knob { position: absolute; top: 2px; left: calc(15px + var(--f, 0.5) * (100% - 30px)); width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: var(--card); box-shadow: 0 6px 14px -6px var(--shadow), 0 0 0 1px var(--edge); display: grid; place-items: center; pointer-events: none; transition: transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .range input:active + .knob, .range.hold .knob { transform: scale(1.18); }
  .range input:focus-visible + .knob { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  .knob svg { width: 20px; height: 20px; }

  /* ---------- Hourly chips ---------- */
  .hours { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; padding: 8px 2px 2px; }
  .hr { display: grid; justify-items: center; gap: 3px; padding: 9px 2px 8px; border-radius: 14px; border: 1px solid transparent; background: none; transition: background 0.25s, border-color 0.25s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); animation: statin 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) backwards; animation-delay: calc(var(--k) * 35ms); }
  .hours.first .hr { animation-delay: calc(var(--k) * 45ms + 0.7s); }
  .hr:hover { background: var(--soft); }
  .hr:active { transform: scale(0.92); }
  .hr.on { background: var(--soft); border-color: var(--edge); }
  .hr small { font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .hr b { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hr svg { width: 26px; height: 26px; }
  .hr.on svg { animation: hop 0.6s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes hop { 40% { transform: translateY(-5px) scale(1.12); } }

  /* demo cursor */
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost.drag { transition: opacity 0.35s; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg, .ghost.drag svg { transform: scale(0.82); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  @media (max-width: 720px) {
    .card { max-width: 460px; padding: 10px; border-radius: 26px; }
    .scene { height: 250px; border-radius: 18px; }
    .temp { font-size: 64px; }
    .temp sup { font-size: 20px; margin-top: 6px; }
    .readout { left: 16px; top: 14px; }
    .clock { right: 14px; top: 14px; font-size: 17px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
    .stat { padding: 7px 9px; }
    .hours { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; }
    .hr { padding: 7px 0; }
    .hr small { font-size: 10px; }
    .hr b { font-size: 12.5px; }
    .hr svg { width: 22px; height: 22px; }
    .top { gap: 6px; }
    .tab { flex: 1 1 auto; font-size: 11.5px; padding: 8px 5px; letter-spacing: -0.01em; }
    .now { padding: 8px 9px; gap: 5px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <article class="card" id="card" aria-labelledby="cityName">
    <div class="top">
      <div class="tabs" id="tabs" role="group" aria-label="City">
        <span class="pill" id="pill"></span>
        <button class="tab" type="button" data-c="0" aria-pressed="true">Lahore</button>
        <button class="tab" type="button" data-c="1" aria-pressed="false">Karachi</button>
        <button class="tab" type="button" data-c="2" aria-pressed="false">Islamabad</button>
        <button class="tab" type="button" data-c="3" aria-pressed="false">Skardu</button>
      </div>
      <button class="now" id="nowBtn" type="button" aria-label="Back to the current time"><i></i><span id="nowLbl">Now</span></button>
    </div>

    <div class="scene" id="scene">
      <svg viewBox="0 0 800 340" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="skyTop" offset="0"/><stop id="skyHor" offset="0.86"/></linearGradient>
          <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/><stop offset="0.25" stop-color="#ffd27a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
          <radialGradient id="moonGlow"><stop offset="0" stop-color="#e8eeff" stop-opacity="0.5"/><stop offset="1" stop-color="#e8eeff" stop-opacity="0"/></radialGradient>
          <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--seaTop, #4a7fb8)"/><stop offset="1" style="stop-color: var(--sil, #22324d)"/></linearGradient>
          <g id="cloud"><ellipse cx="0" cy="0" rx="46" ry="16"/><ellipse cx="-22" cy="-8" rx="22" ry="16"/><ellipse cx="12" cy="-14" rx="26" ry="20"/><ellipse cx="34" cy="-4" rx="18" ry="12"/></g>
        </defs>
        <rect width="800" height="340" fill="url(#sky)"/>
        <g class="stars" id="stars"></g>
        <g class="moonwrap" id="moon"><circle r="44" fill="url(#moonGlow)"/><circle r="14" fill="#eef2ff"/><circle cx="6" cy="-4" r="12" style="fill: var(--skyTopC, #0b1230)" opacity="0.9"/></g>
        <g class="sunwrap" id="sun"><circle r="80" fill="url(#sunGlow)"/><circle id="sunDisc" r="17" fill="#fff1b8"/></g>
        <g id="cloudLayers" style="fill: var(--cloud, #fff)"></g>
        <g class="birds" id="birds"><g transform="translate(0 120)"><path d="M0 0 q6 -6 12 0 q6 -6 12 0"/></g><g transform="translate(34 104) scale(0.8)"><path style="animation-delay:-0.2s" d="M0 0 q6 -6 12 0 q6 -6 12 0"/></g><g transform="translate(60 128) scale(0.65)"><path style="animation-delay:-0.4s" d="M0 0 q6 -6 12 0 q6 -6 12 0"/></g></g>
        <path class="bolt" id="bolt" d="M520 40 L500 110 L522 108 L496 190 L540 98 L516 100 L536 40"/>
        <g id="cities"></g>
        <rect id="haze" width="800" height="340" fill="#e4cfa2" opacity="0"/>
      </svg>
      <canvas id="fx"></canvas>
      <div class="flash" id="flash"></div>
      <div class="shade"></div>
      <div class="readout">
        <div class="place"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg><span id="cityName">Lahore</span></div>
        <div class="temp" aria-hidden="true"><span class="odo" id="odo"></span><sup>°C</sup></div>
        <div class="sr-only" id="tempSr" aria-live="polite"></div>
        <div class="cond" id="cond">Hazy sunshine</div>
        <div class="hl" id="hl">H 27° · L 14°</div>
      </div>
      <div class="clock" aria-hidden="true"><span id="clock">4:30 pm</span><small id="date">Friday</small></div>
    </div>

    <div class="stats">
      <div class="stat" style="--k:0"><svg viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg><div><small>Feels like</small><b id="feels">29°</b></div></div>
      <div class="stat" style="--k:1"><svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg><div><small>Humidity</small><b id="hum">48%</b></div></div>
      <div class="stat" style="--k:2"><svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8"/></svg><div><small>Wind</small><b id="wind">9 km/h</b></div></div>
      <div class="stat" style="--k:3"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg><div><small>UV index</small><b id="uv">3 Moderate</b></div></div>
    </div>

    <div class="scrub">
      <label for="time">Drag through the day</label>
      <div class="marks" id="marks"></div>
      <div class="range" id="rangeBox">
        <input id="time" type="range" min="0" max="1439" step="5" value="990" aria-valuetext="4:30 pm" />
        <span class="knob" id="knob"></span>
      </div>
    </div>

    <div class="hours first" id="hours" role="group" aria-label="Hourly forecast, tap to jump"></div>
  </article>
</main>
<div class="ghost" id="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
  (function () {
    "use strict";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
    var scene = $("#scene"), range = $("#time"), GROUND = 300;

    /* ---------- Cities: sunrise and sunset in minutes, the day's low and high, and the weather by hour ---------- */
    var CITIES = [
      { name: "Lahore", sr: 400, ss: 1025, lo: 14, hi: 27, hum: 55, wind: 7,
        cond: function (m) { return m < 400 || m > 1080 ? ["Clear, smoky night", "clear"] : m < 690 ? ["Smoggy morning", "haze"] : ["Hazy sunshine", "haze"]; } },
      { name: "Karachi", sr: 415, ss: 1070, lo: 21, hi: 31, hum: 68, wind: 19,
        cond: function (m) { return m < 415 || m > 1110 ? ["Humid night", "clear"] : m < 720 ? ["Sunny and warm", "clear"] : ["Sea breeze", "cloud"]; } },
      { name: "Islamabad", sr: 405, ss: 1020, lo: 10, hi: 22, hum: 74, wind: 12,

        setM(from + (m - from) * e);
        if (k < 1) glideRaf = requestAnimationFrame(step);
      })(t0);
    }
    range.addEventListener("input", function () { cancelAnimationFrame(glideRaf); setM(+range.value); });
    range.addEventListener("pointerdown", function () { $("#rangeBox").classList.add("hold"); });
    addEventListener("pointerup", function () { $("#rangeBox").classList.remove("hold"); });
    $("#nowBtn").addEventListener("click", function () { glideTo(pkNow()); });

    /* ---------- Switching city: text blurs out, the old skyline sinks, the new one springs up ---------- */
    var swapT = 0;
    function setCity(i, first) {
      if (i === S.c && !first) return;
      S.c = i; S.shown = null;
      $$(".tab").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.c === i)); });
      movePill();
      $$(".city").forEach(function (g) { g.classList.toggle("off", +g.dataset.c !== i); });
      if (!first) { scene.classList.remove("swapping"); void scene.offsetWidth; scene.classList.add("swapping"); clearTimeout(swapT); swapT = setTimeout(function () { scene.classList.remove("swapping"); }, 800); }
      setTimeout(function () { $("#cityName").textContent = C().name; }, first || reduce.matches ? 0 : 260);
      buildHours(); paint();
    }
    function movePill() {
      var b = $('.tab[aria-pressed="true"]'), pill = $("#pill");
      pill.style.width = b.offsetWidth + "px"; pill.style.transform = "translateX(" + b.offsetLeft + "px)";
    }
    $$(".tab").forEach(function (b) { b.addEventListener("click", function () { setCity(+b.dataset.c); }); });

    $("#date").textContent = new Date(Date.now() + 5 * 3600000).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short", timeZone: "UTC" });

    /* ---------- Auto-demo: plays on load and every few seconds; any real input stops it ---------- */
    var ghost = $("#ghost"), demoOn = !reduce.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function aim(x, y) { ghost.style.setProperty("--gx", Math.min(innerWidth - 30, x) + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function ghostTo(el, then) {
      var r = el.getBoundingClientRect(); ghost.classList.add("show"); aim(r.left + r.width * 0.55, r.top + r.height * 0.6);
      later(function () { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (demoOn && then) then(); }, 170); }, 820);
    }
    function ghostSlide(toM, ms) {
      var r = range.getBoundingClientRect(), y = r.top + r.height / 2, x = function (m) { return r.left + 15 + (m / 1439) * (r.width - 30); };
      ghost.classList.add("show"); aim(x(S.m), y);
      later(function () {
        ghost.classList.add("drag"); $("#rangeBox").classList.add("hold");
        var from = S.m, t0 = performance.now();
        (function step(now) {
          if (!demoOn) return;
          var k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, m = from + (toM - from) * e;
          aim(x(m), y); setM(m);
          if (k < 1) requestAnimationFrame(step); else later(function () { ghost.classList.remove("drag"); $("#rangeBox").classList.remove("hold"); }, 200);
        })(t0);
      }, 850);
    }
    function stopDemo() { if (!demoOn) return; demoOn = false; timers.forEach(clearTimeout); ghost.classList.remove("show", "tap", "drag"); $("#rangeBox").classList.remove("hold"); }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }); });
    function demo() {
      if (!demoOn) return;
      later(function () { ghostSlide(1170, 2600); }, 100);                       // dusk falls, windows light up
      later(function () { ghostTo($('.tab[data-c="2"]'), function () { setCity(2); }); }, 4000); // rain and thunder
      later(function () { ghostTo($('.hr[data-h="9"]'), function () { glideTo(540); }); }, 6300);
      later(function () { ghostTo($('.tab[data-c="3"]'), function () { setCity(3); }); }, 8600);  // snow on the peaks
      later(function () { ghostTo($('.tab[data-c="1"]'), function () { setCity(1); }); }, 11000); // sea breeze
      later(function () { ghostTo($('.hr[data-h="18"]'), function () { glideTo(1080); }); }, 13200);
      later(function () { ghostTo($('.tab[data-c="0"]'), function () { setCity(0); }); }, 15600);
      later(function () { ghostTo($("#nowBtn"), function () { glideTo(pkNow()); }); }, 17600);
      later(function () { ghost.classList.remove("show"); }, 19000);
      later(demo, 21500);
    }

    /* ---------- Start: the sky opens at the real Pakistan time ---------- */
    sizeFx();
    S.m = pkNow();
    setCity(0, true);
    // intro: sweep in from the small hours to now so the first second shows the sky moving
    if (!reduce.matches) { var target = S.m; S.m = (target + 1440 - 150) % 1440; if (S.m > target) S.m = 0; paint(); setTimeout(function () { glideTo(target, 1500); }, 250); }
    addEventListener("resize", function () { sizeFx(); movePill(); });
    if (demoOn) later(demo, 2600);
    setTimeout(function () { $("#hours").classList.remove("first"); }, 2600); // later rebuilds of the hourly chips come in quickly
  })();
</script>
</body>
</html>
