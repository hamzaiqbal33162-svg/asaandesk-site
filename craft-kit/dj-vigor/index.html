<!doctype html>
<!-- Chill & Craft · Vigor · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigor · personal fitness tracker</title>
<style>
/* ===== Core: reset, charts, toasts, modals, tables (theme comes from variables) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:var(--bg);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:200;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 46%);flex:none}
/* entrance */
.cc-in{animation:var(--enter,ccRise) .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes ccFade{from{opacity:0}}
/* charts */
.cc-chart{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.cc-grid{stroke:var(--grid,var(--line));stroke-width:1}
.cc-ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,0,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.cc-area{animation:ccFade 1s .35s both}
.cc-guide{stroke:var(--mut);stroke-dasharray:3 3;pointer-events:none}
.cc-dots{pointer-events:none}.cc-dots circle{stroke:var(--card-solid,#fff);stroke-width:2}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.cc-col{fill:var(--fg);fill-opacity:0;transition:fill-opacity .15s}.cc-col:hover{fill-opacity:.06}
.cc-seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke-width .2s}
.cc-seg:hover{stroke-width:calc(var(--th) + 5px)!important}
.cc-cell{animation:ccFade .5s both;animation-delay:calc(var(--i,0) * 7ms)}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.cc-legend i,.cc-tip i,.cc-dleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none}
.cc-tip{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:240px}
.cc-tip b{font-weight:700}
.cc-empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:14px}
.cc-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cc-donut-w{position:relative;flex:none}
.cc-donut-w svg{display:block}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:20px;line-height:1.1}.cc-donut-c span{font-size:11px;color:var(--mut)}
.cc-dleg{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:13px}
.cc-dleg li{display:flex;align-items:center;gap:4px}.cc-dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc-dleg em{font-style:normal;color:var(--mut);width:38px;text-align:right}
.cc-gauge{position:relative;margin:auto}.cc-gauge svg{display:block}
.cc-gv{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.cc-gauge-c{position:absolute;inset:0 0 10% 0;display:grid;place-content:center;text-align:center}
.cc-gauge-c b{font-size:24px;line-height:1.1}.cc-gauge-c span{font-size:11px;color:var(--mut)}
.cc-hbars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cc-hbars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.cc-hbars i{grid-column:1/-1;height:7px;border-radius:9px;background:var(--track,var(--line));overflow:hidden}
.cc-hbars em{display:block;height:100%;width:var(--w);border-radius:inherit;animation:ccBarW .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes ccBarW{from{width:0}}
.cc-ringv{animation:ccRing 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ccRing{from{stroke-dasharray:0 var(--c)}}
/* toasts */
.cc-toasts{position:fixed;z-index:1001;bottom:16px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.cc-toast{pointer-events:auto;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;animation:ccToast .38s cubic-bezier(.2,.8,.2,1)}
.cc-toast .ic{width:18px;height:18px;color:var(--ok,#3c9)}.cc-toast.bad .ic{color:var(--bad,#e55)}
.cc-toast.out{opacity:0;transform:translateY(8px);transition:.25s}
.cc-toast button{background:none;border:0;color:var(--tipacc,var(--acc));font-weight:700;padding:0 0 0 6px}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* modal and drawer */
.cc-back{position:fixed;inset:0;z-index:900;background:var(--scrim,rgba(8,10,14,.5));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cc-back.cc-on{opacity:1}.cc-back.cc-out{opacity:0;pointer-events:none}
.cc-modal{background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:var(--rm,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:none}
.cc-on .cc-modal{transform:none}
.cc-small{width:min(420px,100%)}
.cc-drawer-back{place-items:stretch end;padding:0}
.cc-drawer{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rm,16px) 0 0 var(--rm,16px);transform:translateX(100%)}
.cc-mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:2}
.cc-mhead h2{margin:0;font-size:18px;line-height:1.25}
.cc-x{background:none;border:0;padding:6px;border-radius:10px;display:grid;color:var(--mut)}
.cc-x:hover{background:var(--hover)}
.cc-mbody{padding:8px 20px 20px}
.cc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cc-confirm{margin:4px 0 0;color:var(--mut)}
.cc-hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cc-field.full{grid-column:1/-1}
.cc-field label{font-size:12px;font-weight:600;color:var(--mut)}
.cc-field input,.cc-field select,.cc-field textarea{border:1px solid var(--line);background:var(--inp,transparent);border-radius:var(--ri,10px);padding:9px 11px;min-width:0;width:100%}
.cc-field select option{background:var(--card-solid,#fff);color:var(--fg)}
.cc-field [aria-invalid=true]{border-color:var(--bad,#e55)}
.cc-err{color:var(--bad,#e55);font-size:12px}
.cc-err:empty{display:none}
.cc-shake{animation:ccShake .38s}
@keyframes ccShake{25%{translate:-7px 0}75%{translate:7px 0}}
@media (max-width:520px){.cc-fields{grid-template-columns:1fr}.cc-drawer{border-radius:0}}
/* table */
.cc-ttools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cc-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:1 1 180px;max-width:320px;color:var(--mut);background:var(--inp,transparent)}
.cc-search .ic{width:16px;height:16px}
.cc-search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--fg)}
.cc-search:focus-within{outline:2px solid var(--focus,var(--acc));outline-offset:1px}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap}
.cc-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);transition:background .2s,color .2s,border-color .2s}
.cc-chip:hover{color:var(--fg)}
.cc-chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.cc-twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.cc-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cc-table th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.cc-table th button:focus-visible{outline:2px solid var(--focus,var(--acc))}
.cc-sort::after{content:"\2195";opacity:.35;font-style:normal}
[aria-sort=ascending] .cc-sort::after{content:"\2191";opacity:1}
[aria-sort=descending] .cc-sort::after{content:"\2193";opacity:1}
.cc-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table .num{text-align:right;font-variant-numeric:tabular-nums}
.cc-table th.num button{flex-direction:row-reverse}
.cc-click{cursor:pointer;transition:background .15s}.cc-click:hover{background:var(--hover)}
.cc-pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.cc-pager div{display:flex;gap:6px}
/* popovers, menus, bell */
.cc-pop{position:fixed;z-index:950;background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);min-width:220px;max-width:min(340px,calc(100vw - 16px));opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.cc-pop.cc-on{opacity:1;transform:none}
.cc-menu{display:flex;flex-direction:column;padding:6px;max-height:60vh;overflow:auto}
.cc-menu-t{font-size:12px;color:var(--mut);padding:6px 10px}
.cc-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}
.cc-menu button:hover,.cc-menu button:focus{background:var(--hover)}
.cc-bell{width:320px;max-width:100%}
.cc-bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cc-bell ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.cc-bell li button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px;border-radius:10px;font-size:13px;align-items:flex-start}
.cc-bell li button:hover{background:var(--hover)}
.cc-bell li.unread button{font-weight:600}
.cc-bell li.unread button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin:6px 0 0 auto;flex:none}
.cc-bell small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.cc-link{background:none;border:0;color:var(--acc);font-size:12px;font-weight:600;padding:2px}
.cc-clear{display:block;margin:0 auto 10px}
.cc-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad,#e5484d);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes ccPop{from{transform:scale(0)}}
/* range switch */
.cc-seg{position:relative;display:inline-flex;background:var(--seg,var(--hover));border-radius:999px;padding:3px;flex:none}
.cc-seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut);border-radius:999px;transition:color .2s}
.cc-seg button[aria-pressed=true]{color:var(--segfg,var(--fg))}
.cc-seg-ind{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:999px;background:var(--segind,var(--card-solid,#fff));box-shadow:0 1px 5px rgba(0,0,0,.16);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s}
/* drag and drop */
.cc-ghost{opacity:.94;box-shadow:0 22px 44px rgba(0,0,0,.32)!important;animation:none!important;transition:none!important}
.cc-dragging{opacity:.35}
.cc-over{outline:2px dashed var(--acc)!important;outline-offset:-3px}
.cc-dragmode,.cc-dragmode *{cursor:grabbing!important;user-select:none}
/* command search */
.cc-cmdk{width:min(560px,100%);align-self:start;margin-top:10vh}
.cc-cmdk-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--inp,transparent);outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0}
.cc-cmdk-list button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.cc-cmdk-list [aria-selected=true] button{background:var(--hover);color:var(--acc)}
.cc-hidden *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.cc-draw{stroke-dashoffset:0}}
/* ===== Vigor look: soft neumorphic surfaces, three bright ring colours ===== */
:root{--bg:#e9ecf3;--card:#e9ecf3;--card-solid:#f3f5f9;--modal:#eef1f6;--fg:#232634;--mut:#6e7385;--line:#d5d9e3;--grid:#dde1ea;--hover:rgba(35,38,52,.05);--track:#d8dce6;--inp:#f3f5f9;
--move:#ff4d6d;--ex:#3ddc84;--stand:#33b8f0;--acc:#5b5bf0;--onacc:#fff;--c1:#5b5bf0;--c2:#ff4d6d;--c3:#3ddc84;--c4:#33b8f0;--c5:#ffb020;--ok:#22a861;--bad:#e5484d;--warn:#e89a00;
--hi:#ffffff;--lo:#c9ced9;--tipbg:#232634;--tipfg:#fff;--tipacc:#a5a5ff;--rm:24px;--ri:14px;--enter:vgIn}
[data-theme=dark]{--bg:#161821;--card:#161821;--card-solid:#1d202b;--modal:#1d202b;--fg:#eceef6;--mut:#9095a8;--line:#2a2e3c;--grid:#232634;--hover:rgba(255,255,255,.05);--track:#262a37;--inp:#1a1d27;
--acc:#8a8aff;--onacc:#12131a;--c1:#8a8aff;--hi:#20232f;--lo:#0d0e13;--tipbg:#eceef6;--tipfg:#161821;--tipacc:#5b5bf0}
@keyframes vgIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
body{background:var(--bg)}
.neu{background:var(--card);border-radius:24px;box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi)}
.ins{box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:16px;overflow:auto;z-index:30;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:800;font-size:20px;padding:4px 8px}
.logo svg{width:38px;height:38px}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;color:var(--mut);text-decoration:none;font-weight:650;font-size:14px;transition:color .2s}
.nav a:hover{color:var(--fg)}.nav a[aria-current=page]{color:var(--acc)}
.nav-marker{position:absolute;left:0;top:0;border-radius:16px;box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);transition:transform .45s cubic-bezier(.3,1.25,.4,1),height .3s}
.band{margin-top:auto;padding:14px;display:flex;align-items:center;gap:12px;font-size:13px}
.band b{display:block}.band small{color:var(--mut)}
.main{min-width:0;overflow-x:clip}
.top{display:flex;align-items:center;gap:12px;padding:20px 28px 8px}
.top .sp{flex:1}
.ib{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--fg);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);transition:box-shadow .15s}
.ib:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
[data-theme=dark] .ib .sun,[data-theme=light] .ib .moon{display:none}
.menu{display:none}
.view{padding:10px 28px 50px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-size:30px;letter-spacing:-.03em}.ph p{margin:4px 0 0;color:var(--mut)}
.g{display:grid;gap:22px}
.card{background:var(--card);border-radius:24px;padding:20px;min-width:0;position:relative;box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);transition:translate .25s}
.card:hover{translate:0 -3px}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;font-size:14px;font-weight:750;flex-wrap:wrap}
.h small{color:var(--mut);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;color:var(--fg);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);transition:box-shadow .15s,transform .1s}
.btn:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.btn.primary{background:var(--acc);color:#fff}
[data-theme=dark] .btn.primary{color:#12131a}
.btn.ghost{box-shadow:none;background:transparent}.btn.sm{padding:6px 11px;font-size:12px;border-radius:11px}.btn .ic{width:17px;height:17px}
.btn.danger{background:var(--bad);color:#fff}
.btn[aria-pressed=true]{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);color:var(--acc)}
.cc-seg{background:var(--card);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}.cc-seg-ind{background:var(--card);box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}.cc-seg button[aria-pressed=true]{color:var(--acc)}
.cc-modal,.cc-pop{border:0}
.cc-field input,.cc-field select,.cc-field textarea{border:0;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);background:var(--card)}
.cc-chip{border:0;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}.cc-chip[aria-pressed=true]{background:var(--acc);color:#fff}
.cc-search{border:0;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);background:var(--card)}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut)}
.kpi .ki{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--kc,var(--acc));box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);float:right}
.bar{height:12px;border-radius:9px;box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:var(--w);border-radius:9px;background:var(--bc,var(--acc));animation:ccBarW 1.1s cubic-bezier(.2,.8,.2,1) both}
/* activity rings (signature) */
.rings{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.rings svg{flex:none}
.rg{fill:none;stroke-linecap:round;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.rg-t{fill:none;opacity:.16}
.rleg{display:grid;gap:12px}
.rleg div{display:flex;flex-direction:column}.rleg small{color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rleg b{font-size:22px;font-variant-numeric:tabular-nums}.rleg b span{font-size:14px;color:var(--mut);font-weight:600}
.closed{animation:closed 1s ease-out}
@keyframes closed{0%{filter:drop-shadow(0 0 0 transparent)}40%{filter:drop-shadow(0 0 14px var(--move))}100%{filter:none}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:sp 0.9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* heart */
.ecg{width:100%;height:auto;display:block}
.ecg path{fill:none;stroke:var(--move);stroke-width:2.4;stroke-linejoin:round}
.ecg .gridl{stroke:var(--grid);stroke-width:1}
.bpm{display:flex;align-items:baseline;gap:8px}.bpm b{font-size:42px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.beat{color:var(--move);animation:beat var(--bt,1s) ease-in-out infinite;display:inline-grid}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(.95)}}
/* sleep */
.hyp{width:100%;height:auto;display:block}
.hyp text{fill:var(--mut);font-size:11px}
/* water */
.glass-w{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.glass-w svg{width:150px;height:200px;flex:none}
.wv{animation:wave 3s linear infinite}@keyframes wave{to{transform:translateX(-60px)}}
.wfill{transition:transform 1s cubic-bezier(.3,1.2,.4,1)}
/* lists */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.list .grow{flex:1;min-width:0}.list small{display:block;color:var(--mut);font-size:12px}
.meal h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.ra{display:flex;gap:2px}.ra button{border:0;background:none;padding:5px;border-radius:8px;color:var(--mut);display:grid}.ra button:hover{color:var(--fg)}.ra .ic{width:16px;height:16px}
.sw{width:48px;height:28px;border-radius:99px;border:0;background:var(--card);position:relative;flex:none;box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .3s}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--acc)}
.stop{font-size:56px;font-weight:300;letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums}
.livegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:10px 0}
.livegrid b{display:block;font-size:22px}.livegrid small{color:var(--mut)}
.goal{display:flex;align-items:center;gap:16px}
.goal .grow{flex:1}.goal b{display:block}.goal small{color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}
.cal span.l0{color:var(--mut)}.cal span.l1{background:color-mix(in srgb,var(--ex) 30%,transparent)}.cal span.l2{background:color-mix(in srgb,var(--ex) 60%,transparent)}.cal span.l3{background:var(--ex);color:#0b2a17}
.cal .hd{box-shadow:none;aspect-ratio:auto;color:var(--mut);font-size:11px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.full{grid-column:1/-1}.span2{grid-column:span 2}
.av{background:hsl(var(--h) 45% 55%)}
.scrim{display:none}
@media (max-width:1180px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){.shell{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:240px;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 40px var(--lo)}
 .nav-open .side{transform:none}.scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}.nav-open .scrim{opacity:1;pointer-events:auto}
 .menu{display:grid}.view{padding:8px 16px 40px}.top{padding:14px 16px 6px}.c2,.c3{grid-template-columns:1fr}.span2{grid-column:auto}}

  <div class="rleg">${R.map(([v, g, col, l, u]) => `<div><small style="color:${col}">${l}</small><b><span style="color:var(--fg);font-size:22px" class="rv">${fmt(v)}</span><span> / ${fmt(g)} ${u}</span></b></div>`).join('')}</div></div>`;
  if (!RM) { void el.offsetWidth; requestAnimationFrame(() => $$('.rg', el).forEach((r) => (r.style.strokeDasharray = `${r.dataset.len} ${r.dataset.c}`))); }
}
function sparkle(el, col) { if (RM) return; const r = el.getBoundingClientRect(); for (let i = 0; i < 14; i++) { const s = document.createElement('i'); s.className = 'spark'; const a = (i / 14) * Math.PI * 2; Object.assign(s.style, { left: r.left + r.width / 2 + 'px', top: r.top + r.height / 2 + 'px', position: 'fixed', background: col, zIndex: 999 }); s.style.setProperty('--dx', Math.cos(a) * 110 + 'px'); s.style.setProperty('--dy', Math.sin(a) * 110 + 'px'); document.body.append(s); setTimeout(() => s.remove(), 950); } }
/* ===== Live heartbeat line ===== */
const ECG = []; let BPM = 72;
const beatShape = [0, 0, 1, 2, 1, 0, 0, -3, 22, -12, 0, 0, 2, 4, 5, 4, 2, 0];
function ecgFill() { while (ECG.length < 300) { const gap = Math.round(3600 / BPM / 6); for (let i = 0; i < gap; i++) ECG.push(rf(-0.6, 0.6)); beatShape.forEach((y) => ECG.push(y + rf(-0.4, 0.4))); } while (ECG.length > 300) ECG.shift(); }
function ecg(el, h = 110) { ecgFill(); const W = 600, mid = h * 0.6, k = h / 40, d = ECG.map((y, i) => (i ? 'L' : 'M') + (i * 2).toFixed(0) + ',' + (mid - y * k).toFixed(1)).join(''); el.innerHTML = `<svg class="ecg" viewBox="0 0 ${W} ${h}" role="img" aria-label="Heartbeat line, ${BPM} beats per minute">${[...Array(12)].map((_, i) => `<line class="gridl" x1="${i * 50}" x2="${i * 50}" y1="0" y2="${h}"/>`).join('')}<path d="${d}"/></svg>`; }
function heartTick() { BPM = clamp(Math.round(BPM + rf(-2.5, 2.5)), 64, 86); for (let i = 0; i < 40; i++) ECG.shift(); ecgFill(); $$('[data-ecg]').forEach((e) => ecg(e, +e.dataset.ecg)); $$('.bpmv').forEach((b) => (b.textContent = BPM)); $$('.beat').forEach((b) => b.style.setProperty('--bt', (60 / BPM).toFixed(2) + 's')); }
function waterSvg(p) { const y = 190 - 170 * clamp(p, 0, 1); return `<svg viewBox="0 0 150 200" role="img" aria-label="Water glass ${Math.round(p * 100)} percent full"><defs><clipPath id="gl"><path d="M20 10h110l-12 182H32z"/></clipPath></defs><path d="M20 10h110l-12 182H32z" fill="none" stroke="var(--line)" stroke-width="6"/><g clip-path="url(#gl)"><g class="wfill" style="transform:translateY(${y}px)"><path class="wv" d="M0 8q15-8 30 0t30 0 30 0 30 0 30 0 30 0 30 0v200H0z" fill="var(--stand)" opacity=".85"/></g></g><path d="M20 10h110l-12 182H32z" fill="none" stroke="var(--mut)" stroke-opacity=".35" stroke-width="3"/></svg>`; }
function addWater(ml) { S.waterLog.push({ id: uid(), t: new Date().toTimeString().slice(0, 5), ml }); T().water = waterNow(); save(); toast(`+${ml} ml water · ${fmt(waterNow())} of ${fmt(S.goals.water)} ml`, { icon: 'drop', action: 'Undo', run: () => { S.waterLog.pop(); T().water = waterNow(); save(); if (['water', 'overview'].includes(App.cur)) rerender(); } }); if (waterNow() >= S.goals.water && waterNow() - ml < S.goals.water) { notify('Water goal reached for today', 'drop'); sparkle($('#qWater'), 'var(--stand)'); } if (['water', 'overview'].includes(App.cur)) rerender(); }

    onOk: (f) => { const d = check(f, { q: numIn('Servings', 0.5, 10) }); if (!d) return false; S.food.push({ id: uid(), meal: d.meal, name: d.name, q: +d.q }); T().eaten = eatenNow(); save(); rerender(); toast(`${d.name} added to ${d.meal.toLowerCase()}`, { icon: 'food' }); } });

  gauge($('#bud'), { value: eat, max: S.goals.kcal, label: 'kcal eaten', size: 170, color: left >= 0 ? 'var(--c5)' : 'var(--bad)' });
  donut($('#mac'), { items: [['Protein', mac[0], 'var(--move)'], ['Carbs', mac[1], 'var(--c5)'], ['Fat', mac[2], 'var(--stand)']].map(([label, value, color]) => ({ label, value: Math.round(value), color })), fmt: (x) => fmt(x) + ' g', sub: 'grams', size: 130, title: 'Macros today' });

/* ===== 6. Water ===== */

/* ===== 7. Workouts (with a live session timer) ===== */
const WT = ['Run', 'Cycling', 'Strength', 'Yoga', 'Walk', 'HIIT'];
function workoutForm(w) {
  const isNew = !w;
  modal({ title: isNew ? 'Log a workout' : 'Edit workout', drawer: true, ok: 'Save', body: fields([{ name: 'type', label: 'Type', type: 'select', options: WT, value: w ? w.type : 'Run' }, { name: 'date', label: 'Date', type: 'date', value: w ? w.date : iso(TODAY) }, { name: 'mins', label: 'Minutes', type: 'number', value: w ? w.mins : 30 }, { name: 'kcal', label: 'Calories', type: 'number', value: w ? w.kcal : 280 }, { name: 'hr', label: 'Average heart rate', type: 'number', value: w ? w.hr : 135 }, { name: 'km', label: 'Distance (km, 0 if none)', type: 'number', step: 0.1, value: w ? w.km : 0 }]),
    onOk: (f) => { const d = check(f, { mins: numIn('Minutes', 1, 600), kcal: numIn('Calories', 1, 5000), hr: numIn('Heart rate', 50, 220), km: numIn('Distance', 0, 300), date: (x) => (!x ? 'Pick a date' : x > iso(TODAY) ? 'Cannot be in the future' : '') }); if (!d) return false; const row = { type: d.type, date: d.date, mins: +d.mins, kcal: +d.kcal, hr: +d.hr, km: +d.km }; if (isNew) S.workouts.unshift({ id: uid(), ...row }); else Object.assign(w, row); S.workouts.sort((a, b) => b.date.localeCompare(a.date)); save(); rerender(); toast(isNew ? `${d.type} logged` : 'Workout saved', { icon: 'dumbbell' }); } });
}
function liveWorkout() {
  let t = 0, kcal = 0, hr = 96, type = 'Run', run = true;
  const m = modal({ title: 'Workout in progress', ok: false, cancel: 'Discard', body: `<div id="lwt" style="margin-bottom:10px"></div><div class="stop" id="sw" aria-live="off">00:00</div><div class="livegrid"><div><b id="lhr">${hr}</b><small>bpm</small></div><div><b id="lkc">0</b><small>kcal</small></div><div><b id="lz">Warm-up</b><small>zone</small></div></div><div style="display:flex;gap:10px;justify-content:center"><button class="btn" type="button" id="lp">${I('pause')}Pause</button><button class="btn primary" type="button" id="lf">${I('check')}Finish and save</button></div>`, onClose: () => clearInterval(iv) });
  seg($('#lwt', m.el), WT.slice(0, 4), type, (x) => (type = x));
  const iv = setInterval(() => { if (!run || document.hidden) return; t++; hr = clamp(Math.round(hr + rf(-2, 4) - (hr > 150 ? 3 : 0)), 90, 172); kcal += hr / 14 / 6; $('#sw', m.el).textContent = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); $('#lhr', m.el).textContent = hr; $('#lkc', m.el).textContent = Math.round(kcal); $('#lz', m.el).textContent = hr < 110 ? 'Warm-up' : hr < 135 ? 'Fat burn' : hr < 155 ? 'Cardio' : 'Peak'; }, 1000);
  $('#lp', m.el).addEventListener('click', (e) => { run = !run; e.currentTarget.innerHTML = run ? I('pause') + 'Pause' : I('play') + 'Resume'; });
  $('#lf', m.el).addEventListener('click', () => { const mins = Math.max(1, Math.round(t / 60)); S.workouts.unshift({ id: uid(), date: iso(TODAY), type, mins, kcal: Math.max(1, Math.round(kcal)), hr, km: type === 'Run' ? +(t / 360).toFixed(1) : 0 }); T().ex += mins; T().move += Math.round(kcal); save(); m.close(); toast(`${type} saved: ${mins} min, ${Math.max(1, Math.round(kcal))} kcal`, { icon: 'trophy' }); if (App.cur === 'workouts' || App.cur === 'overview') rerender(); });
}
page('workouts', 'Workouts', (v) => {
  const m30 = S.workouts.filter((w) => w.date >= iso(addDays(TODAY, -29)));
  v.innerHTML = ph('Workouts', `${m30.length} in the last 30 days`, `<button class="btn" type="button" id="lw">${I('plus')}Log</button><button class="btn primary" type="button" id="sw2">${I('play')}Start</button>`) + `<div class="g c3"><section class="card"><p class="h">By type</p><div id="bt"></div></section><section class="card span2"><p class="h">Minutes per week</p><div id="mw"></div></section><section class="card full"><div id="wt"></div></section></div>`;
  donut($('#bt'), { items: WT.map((t, k) => ({ label: t, value: m30.filter((w) => w.type === t).length, color: `var(--c${(k % 5) + 1})` })), fmt: fmt, sub: 'workouts', size: 140, title: 'Workouts by type' });
  const wk = [...Array(8)].map((_, i) => addDays(TODAY, (i - 7) * 7));
  barChart($('#mw'), { labels: wk.map(dfmt), series: [{ name: 'Minutes', data: wk.map((a) => sum(S.workouts.filter((w) => fromIso(w.date) > a && fromIso(w.date) <= addDays(a, 7)).map((w) => w.mins))), color: 'var(--ex)' }], h: 200, tfmt: (x) => fmt(x) + ' min', title: 'Workout minutes per week' });
  table($('#wt'), { rows: () => S.workouts, sort: 'date', dir: -1, size: 8, chips: { k: 'type', values: WT }, search: ['type', 'date'], cols: [{ k: 'date', label: 'Date', f: (w) => dfmt(fromIso(w.date)) }, { k: 'type', label: 'Workout' }, { k: 'mins', label: 'Minutes', num: true }, { k: 'kcal', label: 'kcal', num: true }, { k: 'hr', label: 'Avg HR', num: true }, { k: 'km', label: 'Km', num: true, f: (w) => (w.km ? fmt(w.km, 1) : '–') }, { k: 'x', label: '', sort: false, f: () => `<span class="ra"><button type="button" data-act="ed" aria-label="Edit">${I('edit')}</button><button type="button" data-act="del" aria-label="Delete">${I('trash')}</button></span>` }],
    onRow: (w) => { const m = modal({ title: `${w.type} · ${dfmt(fromIso(w.date))}`, drawer: true, ok: false, cancel: 'Close', body: `<div class="livegrid"><div><b>${w.mins}</b><small>minutes</small></div><div><b>${w.kcal}</b><small>kcal</small></div><div><b>${w.hr}</b><small>avg bpm</small></div></div><p class="h">Heart rate</p><div id="whr"></div>` }); seed(w.kcal); lineChart($('#whr', m.el), { labels: [...Array(w.mins)].map((_, i) => i + ' min'), series: [{ name: 'Heart rate', data: [...Array(w.mins)].map((_, i) => Math.round(w.hr - 25 + Math.min(i, 8) * 4 + rf(-6, 6))), color: 'var(--move)' }], h: 190, min: 60, fmt: (x) => fmt(x), tfmt: (x) => x + ' bpm', title: 'Heart rate during the workout' }); },
    act: async (a, w) => { if (a === 'ed') return workoutForm(w); if (await confirmBox('Delete workout?', `${w.type} on ${dfmt(fromIso(w.date))}.`)) { S.workouts = S.workouts.filter((x) => x !== w); save(); rerender(); toast('Workout deleted'); } } });
  $('#lw').addEventListener('click', () => workoutForm());
  $('#sw2').addEventListener('click', liveWorkout);

  table($('#ms'), { rows: () => S.meas, size: 8, cols: [{ k: 'k', label: 'Measure' }, { k: 'v', label: 'Now', num: true, f: (m) => fmt(m.v, 1) }, { k: 'prev', label: 'A month ago', num: true, f: (m) => fmt(m.prev, 1) }, { k: 'x', label: 'Change', num: true, sort: false, f: (m) => `<b style="color:${m.v <= m.prev ? 'var(--ok)' : 'var(--bad)'}">${m.v <= m.prev ? '−' : '+'}${fmt(Math.abs(m.v - m.prev), 1)}</b>` }, { k: 'y', label: '', sort: false, f: () => `<span class="ra"><button type="button" data-act="ed" aria-label="Update">${I('edit')}</button></span>` }], act: (a, m) => modal({ title: `Update ${m.k.toLowerCase()}`, ok: 'Save', body: fields([{ name: 'v', label: `${m.k} (cm)`, type: 'number', step: 0.1, value: m.v, full: true }]), onOk: (f) => { const d = check(f, { v: numIn(m.k, 10, 250) }); if (!d) return false; m.prev = m.v; m.v = +d.v; save(); rerender(); toast(`${m.k} saved`); } }) });

/* ===== 9. Goals ===== */
page('goals', 'Goals', (v) => {
  const d = T(), wk = S.workouts.filter((w) => w.date >= iso(addDays(TODAY, -6))).length, sl = slp(S.days[N - 2]);
  const G = [['steps', 'Steps a day', d.steps, S.goals.steps, 'var(--move)', fmt, 'shoe'], ['sleep', 'Hours of sleep', sl, S.goals.sleep, 'var(--acc)', (x) => fmt(x, 1), 'moonzz'], ['water', 'Water (ml)', waterNow(), S.goals.water, 'var(--stand)', fmt, 'drop'], ['workouts', 'Workouts a week', wk, S.goals.workouts, 'var(--ex)', fmt, 'dumbbell'], ['kcal', 'Calorie budget', eatenNow(), S.goals.kcal, 'var(--c5)', fmt, 'food'], ['weight', 'Goal weight (kg)', S.weight[N - 1], S.goals.weight, 'var(--c1)', (x) => fmt(x, 1), 'scale']];
  const streak = (k) => { let n = 0; for (let i = N - 2; i >= 0 && n < 60; i--) { const x = S.days[i]; if ((k === 'steps' && x.steps >= S.goals.steps) || (k === 'water' && x.water >= S.goals.water) || (k === 'sleep' && slp(x) >= S.goals.sleep)) n++; else break; } return n; };

  $('#eg').addEventListener('click', () => modal({ title: 'Edit goals', ok: 'Save goals', body: fields([{ name: 'steps', label: 'Steps a day', type: 'number', value: S.goals.steps }, { name: 'sleep', label: 'Sleep (hours)', type: 'number', step: 0.5, value: S.goals.sleep }, { name: 'water', label: 'Water (ml)', type: 'number', step: 50, value: S.goals.water }, { name: 'workouts', label: 'Workouts a week', type: 'number', value: S.goals.workouts }, { name: 'kcal', label: 'Calorie budget', type: 'number', value: S.goals.kcal }, { name: 'weight', label: 'Goal weight (kg)', type: 'number', step: 0.5, value: S.goals.weight }, { name: 'move', label: 'Move ring (kcal)', type: 'number', value: S.goals.move }, { name: 'ex', label: 'Exercise ring (min)', type: 'number', value: S.goals.ex }]),
    onOk: (f) => { const d = check(f, { steps: numIn('Steps', 1000, 50000), sleep: numIn('Sleep', 4, 12), water: numIn('Water', 500, 6000), workouts: numIn('Workouts', 1, 14), kcal: numIn('Calorie budget', 1000, 5000), weight: numIn('Goal weight', 30, 200), move: numIn('Move ring', 100, 2000), ex: numIn('Exercise ring', 5, 300) }); if (!d) return false; Object.keys(d).forEach((k) => (S.goals[k] = +d[k])); save(); rerender(); toast('Goals saved', { icon: 'target' }); } }));

  v.innerHTML = ph('Settings', 'You, your band and the app.') + `<div class="g c2"><section class="card"><p class="h">Profile</p><form id="pf" novalidate>${fields([{ name: 'name', label: 'Name', value: S.profile.name, full: true }, { name: 'age', label: 'Age', type: 'number', value: S.profile.age }, { name: 'height', label: 'Height (cm)', type: 'number', value: S.profile.height }, { name: 'city', label: 'City', value: S.profile.city, full: true }])}<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" type="submit">Save profile</button></div></form></section>
  <section class="card"><p class="h">App</p><ul class="list"><li><span class="grow"><b>Theme</b><small>Soft light or soft dark</small></span><span id="th"></span></li><li><span class="grow"><b>Stand reminders</b><small>a nudge at ten to every hour</small></span><button class="sw" type="button" role="switch" aria-checked="${!!S.prefs.stand}" data-p="stand" aria-label="Stand reminders"></button></li><li><span class="grow"><b>Wind-down reminder</b><small>22:45 every night</small></span><button class="sw" type="button" role="switch" aria-checked="${!!S.prefs.wind}" data-p="wind" aria-label="Wind-down reminder"></button></li><li><span class="grow"><b>Vigor Band</b><small id="bs">Battery 64% · synced just now</small></span><button class="btn sm" type="button" id="sync">${I('refresh')}Sync</button></li><li><span class="grow"><b>Reset demo data</b><small>ninety days of sample data</small></span><button class="btn sm danger" type="button" id="reset">Reset</button></li></ul></section></div>`;
  seg($('#th'), [['light', 'Light'], ['dark', 'Dark']], document.documentElement.dataset.theme, (t) => setTheme(t));
  $('#pf').addEventListener('submit', (e) => { e.preventDefault(); const d = check(e.target, { name: need('Name'), age: numIn('Age', 10, 110), height: numIn('Height', 100, 230), city: need('City') }); if (!d) return; Object.assign(S.profile, { name: d.name.trim(), age: +d.age, height: +d.height, city: d.city.trim() }); save(); $('#hi').textContent = 'Hi ' + S.profile.name.split(' ')[0]; toast('Profile saved'); });
  v.addEventListener('click', (e) => { const s = e.target.closest('[data-p]'); if (!s) return; S.prefs[s.dataset.p] = !S.prefs[s.dataset.p]; s.setAttribute('aria-checked', String(S.prefs[s.dataset.p])); save(); toast(`${s.getAttribute('aria-label')} ${S.prefs[s.dataset.p] ? 'on' : 'off'}`); });
  $('#sync').addEventListener('click', (e) => { const b = e.currentTarget; b.disabled = true; b.innerHTML = I('refresh') + 'Syncing…'; setTimeout(() => { if (!b.isConnected) return; b.disabled = false; b.innerHTML = I('refresh') + 'Sync'; $('#bs').textContent = 'Battery 63% · synced just now'; toast('Band synced: 214 new readings', { icon: 'refresh' }); }, RM ? 100 : 1400); });
  $('#reset').addEventListener('click', async () => { if (await confirmBox('Reset demo data?', 'Your logs go back to the ninety days of sample data.', 'Reset')) { S = demo(); save(); $('#hi').textContent = 'Hi ' + S.profile.name.split(' ')[0]; rerender(); toast('Demo data restored', { icon: 'refresh' }); } });
}, 'sliders');

/* ===== Start ===== */
$('[data-nav]').insertAdjacentHTML('beforeend', App.order.map((id) => `<a href="#/${id}">${I(App.pages[id].icon)}<span>${App.pages[id].label}</span></a>`).join(''));
$$('[data-i]').forEach((e) => e.insertAdjacentHTML('afterbegin', I(e.dataset.i)));
$('#qWater').innerHTML = I('drop') + '+250 ml';
$('#qWater').addEventListener('click', () => addWater(250));
$('#hi').textContent = 'Hi ' + S.profile.name.split(' ')[0];
$('#dt').textContent = `${DAY[TODAY.getDay()]} ${TODAY.getDate()} ${MON[TODAY.getMonth()]} · ${S.profile.city}`;
App.onTheme = () => { if (App.cur === 'settings') rerender(); };
notify('You slept 7h 42m: your best this week', 'moonzz', 420);
notify('Time to stand: you have been still for 50 minutes', 'user', 12);
notify('Weekly report is ready', 'chart', 1440);
boot({ name: 'Vigor', key: 'vigor', cmds: [{ label: 'Start a workout', run: liveWorkout }, { label: 'Log a workout', run: () => workoutForm() }, { label: 'Add food', run: () => foodForm() }, { label: 'Drink 250 ml water', run: () => addWater(250) }, { label: 'Edit goals', run: () => { go('goals'); setTimeout(() => $('#eg') && $('#eg').click(), 80); } }] });
</script>
</body>
</html>
