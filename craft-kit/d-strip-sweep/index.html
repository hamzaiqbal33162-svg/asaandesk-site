<!doctype html>
<!-- Chill & Craft · Strip Sweep · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strip Sweep · swipe a row left to shred it</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #e8ebf0;
    --board: #f7f8fa;
    --edge: #e1e5ec;
    --row: #ffffff;
    --ink: #161a22;
    --muted: #697184;
    --red: #e5484d;
    --red-deep: #c4282e;
    --green: #2f9e66;
    --shadow: rgba(20, 30, 60, 0.18);
    --focus: #3b5bdb;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b0d11;
    --board: #13161c;
    --edge: #232832;
    --row: #1a1e26;
    --ink: #eef1f7;
    --muted: #8f97aa;
    --red: #ff5a5f;
    --red-deep: #d93a40;
    --green: #3ccf86;
    --shadow: rgba(0, 0, 0, 0.6);
    --focus: #8ea2ff;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .board {
    position: relative;
    width: min(420px, 100%);
    background: var(--board);
    border: 1px solid var(--edge);
    border-radius: 26px;
    padding: 18px 14px 14px;
    box-shadow: 0 30px 60px -40px var(--shadow);
    overflow: hidden;
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px; }
  .head h2 { margin: 0; font-size: 24px; letter-spacing: -0.03em; }
  .count { font-size: 13px; color: var(--muted); font-weight: 650; display: inline-block; }
  .count.tick { animation: tick 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes tick { 40% { transform: translateY(-4px) scale(1.15); color: var(--red); } }
  .tip { margin: 4px 6px 14px; font-size: 12.5px; color: var(--muted); }
  .tip b { color: var(--red); } .tip i { color: var(--green); font-style: normal; font-weight: 700; }

  /* ---------- Rows ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .slot { position: relative; margin-bottom: 8px; border-radius: 18px; }
  .slot.in { animation: row-in 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
  @keyframes row-in { from { opacity: 0; transform: translateY(16px) scale(0.96); } }
  /* what you see behind the row while dragging */
  .under {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: var(--edge);
    transition: background 0.25s;
  }
  .slot.go-left .under { background: color-mix(in srgb, var(--red) 70%, var(--board)); }
  .slot.go-right .under { background: color-mix(in srgb, var(--green) 70%, var(--board)); }
  .slot.go-left.armed .under { background: var(--red-deep); }
  .slot.go-right.armed .under { background: var(--green); }
  .act { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; font-weight: 750; opacity: 0; transition: opacity 0.2s; }
  .slot.go-right .act.finish, .slot.go-left .act.shred { opacity: 1; }
  .act.shred { margin-left: auto; flex-direction: row-reverse; }
  .act svg { width: 28px; height: 28px; overflow: visible; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .act .lid { transform-box: fill-box; transform-origin: 0% 100%; transform: rotate(var(--lid, 0deg)); }
  .act .bin { transform-origin: 50% 100%; transform-box: fill-box; transform: scale(var(--bin, 0.85)); }
  .slot.armed .act.shred svg { animation: rattle 0.32s ease-in-out infinite; }
  @keyframes rattle { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  .act.shred.chew .lid { animation: chew 0.45s ease-in-out 2; }
  @keyframes chew { 50% { transform: rotate(-30deg); } }
  .act.finish svg { transform: scale(var(--tick, 0.6)); transition: transform 0.2s; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 10px 12px 12px;
    background: var(--row);
    border: 1px solid var(--edge);
    border-radius: inherit;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    box-shadow: 0 1px 0 var(--edge);
    transition: box-shadow 0.2s;
  }
  .row:active { cursor: grabbing; }
  .slot.dragging .row { box-shadow: 0 16px 28px -16px var(--shadow); }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--edge); background: none;
    display: grid; place-items: center; cursor: pointer; color: #fff; padding: 0;
    transition: background 0.25s, border-color 0.25s, transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .check:active { transform: scale(0.8); }
  .check svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 0.35s 0.05s ease-out; }
  .slot.done .check { background: var(--green); border-color: var(--green); }
  .slot.done .check svg { stroke-dashoffset: 0; }
  .text { flex: 1; min-width: 0; }
  .text b { display: inline; font-size: 14.5px; font-weight: 650; background: linear-gradient(currentColor, currentColor) 0 55% / 0 1.5px no-repeat; transition: background-size 0.4s ease-out, color 0.3s; }
  .text small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .slot.done .text b { background-size: 100% 1.5px; color: var(--muted); }
  .del {
    flex: none; width: 34px; height: 34px; border-radius: 10px; border: 0; background: none; color: var(--muted);
    display: grid; place-items: center; cursor: pointer; opacity: 0.35;
    transition: opacity 0.2s, color 0.2s, background 0.2s, transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .del svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .row:hover .del, .row:focus-within .del { opacity: 1; }
  .del:hover { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); transform: rotate(-8deg); }
  .del:active { transform: scale(0.85); }

  /* strips of a shredded row */
  .shreds { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .shreds .row { position: absolute; inset: 0; margin: 0; }

  /* ---------- Toast with undo ---------- */
  .toast {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px 10px 14px;
    border-radius: 16px;
    background: var(--ink);
    color: var(--board);
    font-size: 13px;
    transform: translateY(140%);
    transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1);
    overflow: hidden;
    z-index: 6;
  }
  .toast.show { transform: none; }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { border: 0; border-radius: 10px; padding: 7px 12px; background: var(--board); color: var(--ink); font: inherit; font-weight: 750; cursor: pointer; transition: transform 0.2s; }
  .toast button:active { transform: scale(0.92); }
  .toast .timer { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--red); transform-origin: 0 50%; }
  .toast.show .timer { animation: drain 5s linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }

  .empty { text-align: center; padding: 26px 10px 64px; display: none; }
  .empty.show { display: block; animation: row-in 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  .empty b { display: block; font-size: 18px; margin-bottom: 4px; }
  .empty p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .empty button { border: 0; border-radius: 999px; padding: 10px 16px; background: var(--ink); color: var(--board); font: inherit; font-weight: 700; cursor: pointer; }
  .list-pad { padding-bottom: 58px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="board" aria-labelledby="title">
    <div class="head"><h2 id="title">Today</h2><span class="count" id="count"></span></div>
    <p class="tip">Swipe left to <b>shred</b>, right to <i>finish</i>. Keyboard: Delete shreds, Space finishes.</p>
    <div class="list-pad">
      <ul class="list" id="list" aria-label="Tasks"></ul>
      <div class="empty" id="empty"><b>All clear</b><p>Nothing left for today. Enjoy your tea.</p><button type="button" id="refill">Bring the list back</button></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="undo">Undo</button><i class="timer" aria-hidden="true"></i></div>
  </section>
</main>

<script>
  (function () {
    var list = document.getElementById("list");
    var countEl = document.getElementById("count");
    var empty = document.getElementById("empty");
    var toast = document.getElementById("toast");
    var toastText = document.getElementById("toast-text");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");

    var DEMO = [
      { t: "Pay the electricity bill", s: "Due today · PKR 6,120" },
      { t: "Book a car service", s: "Saturday, 10 am" },
      { t: "Reply to Faraz about the venue", s: "He needs an answer by 6 pm" },
      { t: "Pick up shirts from the tailor", s: "Liberty Market, after 5" },
      { t: "Send invoice #1042 to Rahim Traders", s: "PKR 48,000" }
    ];
    var lastDeleted = null, toastTimer = 0, uid = 0;

    var BIN = '<svg viewBox="0 0 28 28" aria-hidden="true"><path class="lid" d="M5 8h18M11 8V5.5h6V8"/><path class="bin" d="M7 9.5l1.4 14h11.2L21 9.5M11.5 13v7M16.5 13v7"/></svg>';
    var TICK = '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11"/><path d="M9 14.5l3.5 3.5L19 11"/></svg>';

    // ---------- Build a row ----------
    function makeSlot(item) {
      var li = document.createElement("li");
      li.className = "slot" + (item.done ? " done" : "");
      li._item = item;
      li.innerHTML =
        '<div class="under" aria-hidden="true"><span class="act finish">' + TICK + '<span>Finish</span></span><span class="act shred">' + BIN + "<span>Shred</span></span></div>" +
        '<div class="row" tabindex="0">' +
          '<button class="check" type="button" aria-pressed="' + !!item.done + '"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg></button>' +
          '<div class="text"><b></b><small></small></div>' +
          '<button class="del" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 7V4.5h4V7M6 8.5l1 11.5h10l1-11.5"/></svg></button>' +
        "</div>";
      li.querySelector(".text b").textContent = item.t;
      li.querySelector(".text small").textContent = item.s;
      var row = li.querySelector(".row");
      row.setAttribute("aria-label", item.t + (item.done ? ", finished" : ""));
      li.querySelector(".check").setAttribute("aria-label", "Finish: " + item.t);
      li.querySelector(".del").setAttribute("aria-label", "Shred: " + item.t);
      wire(li);
      return li;
    }

    function updateCount() {
      var left = list.querySelectorAll(".slot:not(.done):not(.leaving)").length;
      var all = list.querySelectorAll(".slot:not(.leaving)").length;
      countEl.textContent = left + " to do";
      countEl.classList.remove("tick");
      void countEl.offsetWidth;
      countEl.classList.add("tick");
      empty.classList.toggle("show", all === 0);
    }

    function toggleDone(li) {
      var item = li._item;
      item.done = !item.done;
      li.classList.toggle("done", item.done);
      li.querySelector(".check").setAttribute("aria-pressed", String(item.done));
      li.querySelector(".row").setAttribute("aria-label", item.t + (item.done ? ", finished" : ""));
      updateCount();
      say(item.done ? "Finished: " + item.t : "Back on the list: " + item.t);
    }
    function say(text) { toastText.textContent = text; }

    // ---------- Drag with rubber band, armed state and spring back ----------
    function wire(li) {
      var row = li.querySelector(".row");
      var under = li.querySelector(".under");
      var shredAct = li.querySelector(".act.shred");
      var finishAct = li.querySelector(".act.finish");
      var startX = 0, startY = 0, dx = 0, lastX = 0, lastT = 0, vel = 0, down = false, dragging = false;

      li.querySelector(".check").addEventListener("click", function (e) { e.stopPropagation(); toggleDone(li); });
      li.querySelector(".del").addEventListener("click", function (e) { e.stopPropagation(); shred(li, 0); });
      row.addEventListener("keydown", function (e) {
        if (e.target !== row) return;
        if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); shred(li, 0); }
        else if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleDone(li); }
        else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          var sib = e.key === "ArrowDown" ? li.nextElementSibling : li.previousElementSibling;
          if (sib) sib.querySelector(".row").focus();
        }
      });

      function width() { return row.offsetWidth || 320; }
      function threshold() { return Math.max(100, width() * 0.38); }
      function paint(x) {
        var max = width() * 0.62;
        var ax = Math.abs(x);
        if (ax > max) ax = max + (ax - max) * 0.25; // rubber band past the end
        var shown = x < 0 ? -ax : ax;
        var p = Math.min(1, ax / threshold());
        row.style.transform = "translateX(" + shown + "px) rotate(" + (shown / width()) * 2.2 + "deg)";
        li.classList.toggle("go-left", x < -2);
        li.classList.toggle("go-right", x > 2);
        li.classList.toggle("armed", ax >= threshold());
        shredAct.style.setProperty("--lid", -p * 42 + "deg");
        shredAct.style.setProperty("--bin", 0.8 + p * 0.25);
        finishAct.style.setProperty("--tick", 0.6 + p * 0.5);
        return shown;
      }
      function springBack() {
        row.style.transition = "transform 0.55s cubic-bezier(0.3, 1.5, 0.5, 1)";
        row.style.transform = "";
        li.classList.remove("armed", "dragging");
        setTimeout(function () {
          if (!down) { row.style.transition = ""; li.classList.remove("go-left", "go-right"); }
        }, 450);
      }

      row.addEventListener("pointerdown", function (e) {
        if (e.target.closest("button") || li.classList.contains("leaving")) return;
        down = true;
        dragging = false;
        startX = lastX = e.clientX;
        startY = e.clientY;
        lastT = performance.now();
        dx = vel = 0;
        row.style.transition = "none";
      });
      row.addEventListener("pointermove", function (e) {
        if (!down) return;
        dx = e.clientX - startX;
        if (!dragging) {
          if (Math.abs(e.clientY - startY) > 10 && Math.abs(dx) < 10) { down = false; return; } // a scroll, not a swipe
          if (Math.abs(dx) < 8) return;
          dragging = true;
          li.classList.add("dragging");
          if (row.setPointerCapture) row.setPointerCapture(e.pointerId);
        }
        var now = performance.now();
        vel = (e.clientX - lastX) / Math.max(1, now - lastT);
        lastX = e.clientX;
        lastT = now;
        paint(dx);
      });
      function release() {
        if (!down) return;
        down = false;
        if (!dragging) { row.style.transition = ""; return; }
        dragging = false;
        var flick = Math.abs(vel) > 0.9 && Math.abs(dx) > 50;
        if (dx < 0 && (Math.abs(dx) >= threshold() || (flick && vel < 0))) {
          shred(li, paint(dx));
        } else if (dx > 0 && (dx >= threshold() || (flick && vel > 0))) {
          toggleDone(li);
          springBack();
        } else springBack();
      }
      row.addEventListener("pointerup", release);
      row.addEventListener("pointercancel", function () { down = true; dragging = true; dx = 0; release(); });
    }

    // ---------- Shredding: cut the row into strips that fall into the bin ----------
    function shred(li, fromX) {
      if (li.classList.contains("leaving")) return;
      var row = li.querySelector(".row");
      var index = Array.prototype.indexOf.call(list.children, li);
      lastDeleted = { item: li._item, index: index };
      li.classList.add("leaving", "go-left", "armed");
      var shredAct = li.querySelector(".act.shred");
      shredAct.classList.add("chew");
      updateCount();
      showToast('Shredded "' + li._item.t + '"');

      if (reduce.matches || !row.animate) {
        li.remove();
        updateCount();
        return;
      }
      var N = 12;
      var box = document.createElement("div");
      box.className = "shreds";
      box.setAttribute("aria-hidden", "true");
      for (var i = 0; i < N; i++) {
        var strip = row.cloneNode(true);
        strip.removeAttribute("tabindex");
        strip.style.transition = "none";
        strip.style.clipPath = "inset(0 " + (100 - ((i + 1) * 100) / N) + "% 0 " + (i * 100) / N + "%)";
        strip.style.transform = "translateX(" + fromX + "px)";
        box.appendChild(strip);
        var spin = (Math.random() - 0.5) * 50;
        var drift = 20 + Math.random() * 50;
        strip.animate([
          { transform: "translateX(" + fromX + "px)", opacity: 1 },
          { transform: "translate(" + (fromX + drift * 0.4) + "px, 8px) rotate(" + spin * 0.2 + "deg)", opacity: 1, offset: 0.25 },
          { transform: "translate(" + (fromX + drift) + "px, " + (110 + Math.random() * 60) + "px) rotate(" + spin + "deg)", opacity: 0 }
        ], { duration: 720, delay: (N - 1 - i) * 28, easing: "cubic-bezier(.45,0,.8,.45)", fill: "both" });
      }
      row.style.visibility = "hidden";
      li.appendChild(box);
      // then close the gap with a soft spring
      setTimeout(function () {
        var h = li.offsetHeight;
        li.animate([{ height: h + "px", marginBottom: "8px" }, { height: "0px", marginBottom: "0px" }], { duration: 320, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" })
          .onfinish = function () { li.remove(); updateCount(); };
      }, N * 28 + 280);
    }

    function showToast(text) {
      say(text);
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 5000);
    }

    // ---------- Undo brings the row back where it was ----------
    document.getElementById("undo").addEventListener("click", function () {
      if (!lastDeleted) return;
      var li = makeSlot(lastDeleted.item);
      var ref = list.children[lastDeleted.index] || null;
      // a row that is still mid-shred is not a real neighbour
      while (ref && ref.classList.contains("leaving")) ref = ref.nextElementSibling;
      list.insertBefore(li, ref);
      if (!reduce.matches && li.animate) {
        var h = li.offsetHeight;
        li.animate([{ height: "0px", opacity: 0, transform: "scale(0.9)" }, { height: h + "px", opacity: 1, transform: "none" }], { duration: 480, easing: "cubic-bezier(.3,1.3,.5,1)" });
      }
      say('Restored "' + lastDeleted.item.t + '"');
      lastDeleted = null;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
      li.querySelector(".row").focus();
      updateCount();
    });

    // ---------- Fill (and refill) the list ----------
    function fill() {
      list.textContent = "";
      DEMO.forEach(function (d, i) {
        var li = makeSlot({ t: d.t, s: d.s, done: false, id: ++uid });
        li.classList.add("in");
        li.style.animationDelay = 80 + i * 70 + "ms";
        list.appendChild(li);
      });
      updateCount();
    }
    document.getElementById("refill").addEventListener("click", function () { fill(); toast.classList.remove("show"); });
    fill();
  })();
</script>
</body>
</html>
