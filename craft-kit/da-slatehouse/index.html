<!doctype html>
<!-- Chill & Craft · Slatehouse · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slatehouse · sales CRM with client files and a forecast</title>
<script>
  // Early theme pick: ?theme= wins, then the saved choice, then the system setting
  (function () { try { var q = new URLSearchParams(location.search).get('theme'), s = JSON.parse(localStorage.getItem('da-slatehouse:theme') || 'null'); document.documentElement.dataset.theme = q === 'light' || q === 'dark' ? q : s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { } })();
</script>
<style>
/* ---------- Core kit styles: base, controls, layers, table, charts, board (themed by variables) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:14px/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-h,inherit);line-height:1.2}
p{margin:0}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
h1:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--panel-solid,var(--panel));color:var(--text);font-weight:600;font-size:13px;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-2,var(--muted));box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:var(--muted);transition:background .2s,color .2s,transform .12s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:30px;height:30px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.chip{min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;flex:none;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme=dark] .av{background:hsl(var(--h) 32% 27%);color:hsl(var(--h) 70% 84%)}
.av.lg{width:52px;height:52px;font-size:17px}
.row-acts{display:inline-flex;gap:2px}
kbd{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--hover)}
/* page entrance (dashboards may set --enter to their own keyframes) */
.in{animation:var(--enter,ccRise) .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px)}}
/* layers: modal, drawer, confirm, command search */
.layer{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim,rgba(10,12,20,.48));opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(540px,100%);max-height:min(90vh,780px);display:flex;flex-direction:column;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--rl,16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(14px) scale(.97);transition:opacity .25s,transform .32s cubic-bezier(.2,.8,.2,1)}
.layer.wide .sheet{width:min(860px,100%)}
.layer.open .scrim{opacity:1}
.layer.open .sheet{opacity:1;transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sheet-h h2{font-size:17px;overflow-wrap:anywhere}
.sheet-b{padding:4px 18px 18px;overflow:auto;overscroll-behavior:contain}
.sheet-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.layer.drawer{place-items:stretch end;padding:0}
.layer.drawer .sheet{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rl,16px) 0 0 var(--rl,16px);border-right:0;transform:translateX(60px)}
.layer.drawer.wide .sheet{width:min(640px,100%)}
.layer.drawer.open .sheet{transform:none}
.confirm-m{color:var(--muted)}
.layer.cmdk{place-items:start center;padding-top:12vh}
.layer.cmdk .sheet-h{padding-bottom:4px}
.cmd-in{width:100%;height:44px;padding:0 14px;border-radius:var(--ri,10px);border:1px solid var(--line);background:var(--field,transparent);outline:none;font-size:15px}
.cmd-in:focus{border-color:var(--accent)}
.cmd-l{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.cmd-l li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.cmd-l li small{margin-left:auto;color:var(--muted);font-size:11px}
.cmd-l li[aria-selected=true]{background:var(--hover);color:var(--accent)}
.cmd-empty{color:var(--muted)}
.cmd-k{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.layer.modal{place-items:end center;padding:0}.layer.modal .sheet{border-radius:var(--rl,16px) var(--rl,16px) 0 0;width:100%;transform:translateY(40px)}.layer.modal.open .sheet{transform:none}.layer.cmdk{place-items:start center;padding:10px}}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form.shake{animation:ccShake .35s}
@keyframes ccShake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.f{display:grid;gap:5px;grid-column:1/-1;min-width:0}
.f.half{grid-column:auto}
@media (max-width:520px){.f.half{grid-column:1/-1}}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,transparent);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.f [aria-invalid=true]{border-color:var(--bad)}
.f-err{color:var(--bad);font-size:11.5px}
.f-err:empty{display:none}
.f-chk label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}
.f-chk input{width:16px;height:16px;min-height:0;accent-color:var(--accent)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:150;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(12px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:none}
.t-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;flex:none}
.toast.bad .t-ic{background:var(--bad)}
.toast.warn .t-ic{background:var(--warn)}
.t-ic .ic{width:13px;height:13px}
.t-a{margin-left:auto;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0 0 0 8px}
/* tooltip */
#tip{position:fixed;left:0;top:0;z-index:160;pointer-events:none;padding:8px 10px;border-radius:9px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:12px;line-height:1.5;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:240px}
#tip.on{opacity:1;transform:none}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* popovers, menus, notifications */
.pop{position:fixed;z-index:120;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.4);padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.pop.on{opacity:1;transform:none}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:disabled{opacity:.45;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .sw{width:9px;height:9px;border-radius:3px;flex:none}
.menu-t{font-size:11px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.notes{width:min(320px,calc(100vw - 30px))}
.notes-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px}
.notes ul{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:9px;font-size:13px;color:var(--muted)}
.notes li .ic{margin-top:2px}
.notes li span{display:grid}
.notes li small{font-size:11px;opacity:.8}
.notes li.unread{color:var(--text);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.n-empty{justify-content:center}
[data-bell]{position:relative}
[data-bell][data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPing .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ccPing{from{transform:scale(0)}}
/* segmented control */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--rs,10px);background:var(--hover);gap:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);border-radius:calc(var(--rs,10px) - 2px);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--text)}
.seg-i{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:calc(var(--rs,10px) - 2px);background:var(--panel-solid,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s}
/* table */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.srch{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:var(--ri,9px);background:var(--field,transparent);color:var(--muted);flex:1 1 200px;max-width:340px;transition:border-color .2s,box-shadow .2s}
.srch input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--text);padding:6px 0}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:var(--tbl-min,640px)}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.th-b{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.si::after{content:"\2195";opacity:.35;font-size:11px}
th[aria-sort=ascending] .si::after{content:"\2191";opacity:1;color:var(--accent)}
th[aria-sort=descending] .si::after{content:"\2193";opacity:1;color:var(--accent)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{animation:ccRow .35s backwards;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes ccRow{from{opacity:0;transform:translateY(6px)}}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover{background:var(--hover)}
.tbl tr.click:focus-visible{outline-offset:-2px}
.cell-u{display:flex;align-items:center;gap:10px;min-width:0}
.cell-u b{display:block;font-weight:600}
.cell-u small{display:block;color:var(--muted);font-size:11.5px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pg-b{display:flex;gap:4px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);display:inline-grid;place-items:center;font-size:12px;transition:background .2s,transform .12s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current=page]{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{display:grid;justify-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty b{color:var(--text)}
/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid,var(--line));stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font,system-ui,sans-serif)}
.chart .xh{stroke:var(--muted);stroke-dasharray:3 3;opacity:.7}
.chart .dot{stroke:var(--panel-solid,var(--panel));stroke-width:2.5}
.chart .bcol{transition:opacity .2s}
.chart .bcol.dim{opacity:.4}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,.05,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.fade{animation:ccFade 1s .35s backwards}
@keyframes ccFade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.growx{transform-origin:0 50%;animation:ccGrowX .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrowX{from{transform:scaleX(0)}}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px}
.nodata{display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:13px;text-align:center}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-v{position:relative;width:var(--ds,160px);max-width:100%;flex:none}
.donut-t{stroke:var(--hover)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;display:block;line-height:1.1}
.donut-c span{font-size:11px;color:var(--muted)}
.donut .seg{transition:stroke-dasharray 1.1s cubic-bezier(.3,.7,.2,1),stroke-width .2s;cursor:pointer}
.donut .seg.on{stroke-width:15}
.dl{display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl-r{display:grid;grid-template-columns:10px 1fr auto 38px;gap:8px;align-items:center;cursor:default}
.dl-r i{width:10px;height:10px;border-radius:3px}
.dl-r small{color:var(--muted);text-align:right}
.gauge{position:relative;max-width:260px;margin:0 auto}
.g-track{stroke:var(--hover)}
.g-val{transition:stroke-dasharray 1.3s cubic-bezier(.3,.7,.2,1)}
.g-c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.g-c b{display:block;font-size:22px;line-height:1.1}
.g-c span{font-size:11px;color:var(--muted)}
.hb{display:grid;gap:11px}
.hb-t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.hb-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:inherit}
.hm{display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.hm-x{text-align:center}
.hm-y{padding-right:6px;white-space:nowrap}
.hm-c{height:20px;border-radius:4px;background:var(--hm,var(--accent));opacity:calc(.08 + var(--a) * .92);transition:transform .15s}
.hm-c:hover{transform:scale(1.15)}
.pop-in{animation:ccPop .5s backwards;animation-delay:calc(var(--j) * 22ms)}
@keyframes ccPop{from{opacity:0;transform:scale(.4)}}
.fn{display:grid;gap:9px}
.fn-r{display:grid;gap:3px}
.fn-r small{font-size:11px;color:var(--muted)}
.fn-bar{width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs,9px);color:#fff;font-size:12.5px;min-width:0;overflow:hidden;white-space:nowrap}
.fn-bar span{overflow:hidden;text-overflow:ellipsis}
.wipe{animation:ccWipe 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes ccWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.spark{min-width:60px}
/* board */
.board{display:grid;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start;scrollbar-width:thin}
.board-y{grid-auto-flow:column;grid-auto-columns:minmax(min(262px,82vw),1fr)}
.board-x{grid-auto-flow:row}
.lane{min-width:0;display:flex;flex-direction:column;transition:background .2s,box-shadow .2s}
.lane-l{display:grid;gap:10px;min-height:84px;align-content:start;padding:2px}
.board-x .lane-l{grid-auto-flow:column;grid-auto-columns:minmax(220px,240px);overflow-x:auto;align-content:stretch;padding-bottom:6px}
.dcard{position:relative;user-select:none;-webkit-user-select:none;cursor:grab;transition:box-shadow .2s,transform .2s,opacity .2s}
.dcard:active{cursor:grabbing}
.dmove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:0;background:var(--hover);color:var(--muted);opacity:0;touch-action:none;cursor:grab;transition:opacity .2s,background .2s}
.dcard:hover .dmove,.dcard:focus-within .dmove,.dmove[aria-expanded=true]{opacity:1}
@media (hover:none){.dmove{opacity:1}}
.dsrc{opacity:.3;outline:2px dashed var(--lc,var(--accent));outline-offset:-2px}
.dghost{position:fixed!important;z-index:140;pointer-events:none;margin:0;box-shadow:0 26px 50px -14px rgba(0,0,0,.45);transform:rotate(var(--tilt,2.5deg)) scale(1.04);transition:transform .2s}
.dghost.drop{transform:none;transition:translate .18s ease-out,transform .18s}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.lane.over{background:color-mix(in srgb,var(--lc,var(--accent)) 10%,transparent)}
.lane-empty{display:grid;place-items:center;min-height:72px;border:1.5px dashed var(--line);border-radius:var(--rm,12px);color:var(--muted);font-size:12px;padding:8px;text-align:center}
.burst{position:fixed;inset:0;width:100vw;height:100vh;z-index:170;pointer-events:none}
/* reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
/* ================= Slatehouse look: editorial stone, square edges, serif display, terracotta ink ================= */
:root{--font:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;--font-h:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif;--bg:#ecebe6;--panel:#f7f6f2;--panel-solid:#f9f8f5;--panel-2:#e4e2db;--text:#1f1d1a;--muted:#6f6a61;--line:#d4d0c6;--line-2:#a9a398;--hover:#e7e4dc;--field:#fbfaf7;--accent:#b4532a;--on-accent:#fff;--green:#2f5d50;--ok:#2f7d4f;--warn:#b7791f;--bad:#b3261e;--c1:#b4532a;--c2:#2f5d50;--c3:#8a8173;--c4:#c9a227;--c5:#5a6f8c;--c6:#c7bfb0;--tip-bg:#1f1d1a;--tip-text:#f7f6f2;--rl:2px;--rb:2px;--ri:2px;--rs:2px;--rm:2px;--enter:shIn;--speck:radial-gradient(circle at 20% 30%,rgba(0,0,0,.06) 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.05) 1px,transparent 1.5px),radial-gradient(circle at 40% 80%,rgba(255,255,255,.4) 1px,transparent 1.5px)}
[data-theme=dark]{--bg:#161614;--panel:#1e1d1a;--panel-solid:#201f1c;--panel-2:#2a2824;--text:#ece8df;--muted:#a39d91;--line:#34322d;--line-2:#56524a;--hover:#272522;--field:#1a1917;--accent:#e07a4a;--on-accent:#161614;--green:#6fb39d;--ok:#6fbf8a;--warn:#e0b04a;--bad:#ef6b5f;--c1:#e07a4a;--c2:#6fb39d;--c3:#a39d91;--c4:#e0c04a;--c5:#8fa6c9;--c6:#56524a;--tip-bg:#ece8df;--tip-text:#161614;--speck:radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.04) 1px,transparent 1.5px),radial-gradient(circle at 40% 80%,rgba(0,0,0,.4) 1px,transparent 1.5px)}
@keyframes shIn{from{opacity:0;transform:translateY(10px)}}
body{background:var(--bg) var(--speck);background-size:7px 7px,11px 11px,13px 13px}
/* masthead + underlined sub navigation */
.mast{border-bottom:1px solid var(--text);background:var(--panel)}
.mast-in{max-width:1440px;margin:0 auto;padding:16px 32px 0;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.word{display:flex;align-items:baseline;gap:12px;text-decoration:none;margin-right:auto}
.word b{font-family:var(--font-h);font-size:34px;font-weight:400;letter-spacing:.02em;line-height:1}
.word small{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.mast-r{display:flex;gap:6px;align-items:center;padding-bottom:8px}
nav.sub{position:relative;flex-basis:100%;display:flex;gap:26px;margin-top:10px}
nav.sub a{position:relative;z-index:1;padding:10px 0 12px;text-decoration:none;color:var(--muted);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transition:color .2s}
nav.sub a:hover,nav.sub a[aria-current=page]{color:var(--text)}
.ul{position:absolute;bottom:-1px;left:0;height:3px;width:0;background:var(--accent);opacity:0;transition:transform .5s cubic-bezier(.7,0,.2,1),width .5s cubic-bezier(.7,0,.2,1)}
.menu-btn{display:none!important}
main{max-width:1440px;margin:0 auto;padding:26px 32px 56px;overflow-x:clip}
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.page-h h1{font-family:var(--font-h);font-size:44px;font-weight:400;letter-spacing:-.01em;line-height:1}
.page-h p{color:var(--muted);margin-top:8px;max-width:620px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px;min-width:0;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--line-2);box-shadow:0 1px 0 var(--line-2)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card-h h2{font-family:var(--font-h);font-size:22px;font-weight:400}
.btn{border-color:var(--text);background:transparent;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.ghost{border-color:transparent}
.chip{border-radius:2px;letter-spacing:.06em}
.seg{border:1px solid var(--line-2);background:transparent;padding:2px}
.seg-i{background:var(--text);box-shadow:none;top:2px;bottom:2px}
.seg button{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed=true]{color:var(--bg)}
.grid{display:grid;gap:20px;margin-bottom:20px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:var(--panel)}
.g-kpi .kpi{border:0;border-right:1px solid var(--line);border-radius:0}
.g-kpi .kpi:last-child{border-right:0}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.kpi span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--font-h);font-size:38px;font-weight:400;margin:8px 0 4px;font-variant-numeric:lining-nums}
.kpi small{color:var(--muted)}
.kpi small em{font-style:normal;color:var(--ok);font-weight:700}
/* stone swatches (drawn with gradients) */
.sw{--s1:#ddd;background:var(--s1)}
.sw.marble{background:linear-gradient(115deg,transparent 40%,rgba(120,120,120,.35) 41%,transparent 43%),linear-gradient(35deg,transparent 60%,rgba(140,140,140,.3) 61%,transparent 62.5%),linear-gradient(160deg,#f4f2ee,#e4e0d8)}
.sw.onyx{background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 32%,transparent 36%),linear-gradient(60deg,transparent 55%,rgba(30,80,40,.4) 57%,transparent 60%),linear-gradient(150deg,#9fc39a,#5f8f63)}
.sw.granite{background:radial-gradient(circle at 30% 40%,#eee 1px,transparent 1.6px),radial-gradient(circle at 70% 20%,#999 1.2px,transparent 1.8px),radial-gradient(circle at 50% 70%,#ccc 1px,transparent 1.6px),#2b2b2b;background-size:6px 6px,9px 9px,7px 7px}
.sw.terracotta{background:linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(140deg,#c96b43,#a9532f);background-size:18px 18px,18px 18px,auto}
.sw.slate{background:repeating-linear-gradient(170deg,rgba(255,255,255,.05) 0 3px,transparent 3px 9px),linear-gradient(160deg,#4a5059,#2f343b)}
.sw.porcelain{background:linear-gradient(135deg,rgba(255,255,255,.5),transparent 60%),linear-gradient(160deg,#d8d4cc,#bdb7ad)}
.sw.limestone{background:radial-gradient(circle at 20% 30%,rgba(120,100,70,.18) 2px,transparent 3px),radial-gradient(circle at 60% 70%,rgba(120,100,70,.12) 3px,transparent 4px),linear-gradient(160deg,#e6dcc6,#d2c4a5);background-size:14px 14px,22px 22px,auto}
/* deal board: tile swatch cards */
.lane{border-top:2px solid var(--text);padding-top:10px}
.lane-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 12px}
.lane-h b{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.lane-h .cnt{font-family:var(--font-h);font-size:22px}
.lane-h small{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lane-l{gap:12px}
.dcard{border:1px solid var(--line);background:var(--panel-solid);border-radius:2px;display:grid;overflow:hidden}
.dcard:hover{border-color:var(--text);transform:translateY(-2px);box-shadow:0 10px 18px -14px rgba(0,0,0,.5)}
.dcard .sw{height:44px;border-bottom:1px solid var(--line)}
.dcard .bd{padding:10px 12px 12px;display:grid;gap:4px}
.dcard b{font-family:var(--font-h);font-size:17px;font-weight:400;line-height:1.2;padding-right:28px}
.dcard .meta{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.dcard .row{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.dcard .row .v{font-weight:700}
.dmove{top:52px;border-radius:2px;background:var(--panel)}
.dghost{--tilt:0deg;outline:1px solid var(--text)}
.lane.over{background:color-mix(in srgb,var(--accent) 8%,transparent)}
/* client files: filing cabinet */
.cab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.drawer-l{background:var(--panel);border:1px solid var(--line)}
.drawer-l .tools{padding:12px;border-bottom:1px solid var(--line)}
.folders{list-style:none;margin:0;padding:0;max-height:620px;overflow:auto}
.fold{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;position:relative;transition:background .2s,padding .2s}
.fold:hover{background:var(--hover);padding-left:18px}
.fold[aria-current=true]{background:var(--panel-solid);box-shadow:inset 4px 0 0 var(--accent)}
.fold .tab{grid-row:span 2;width:30px;height:24px;background:var(--fc);clip-path:polygon(0 18%,40% 18%,50% 0,100% 0,100% 100%,0 100%)}
.fold b{font-weight:600}
.fold small{color:var(--muted);font-size:11.5px}
.fold .n{grid-row:span 2;font-size:11px;color:var(--muted)}
.file-open{background:var(--panel);border:1px solid var(--line);padding:22px;animation:shOpen .45s cubic-bezier(.3,.8,.3,1)}
@keyframes shOpen{from{opacity:0;transform:translateX(12px)}}
.file-open h2{font-family:var(--font-h);font-size:34px;font-weight:400}
.ftabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0}
.ftabs button{border:0;background:none;padding:10px 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ftabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.docs{list-style:none;margin:0;padding:0}
.docs li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.docs .dk{width:34px;height:40px;border:1px solid var(--line-2);display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.08em;background:var(--panel-solid)}
.docs b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs small{color:var(--muted);font-size:11.5px}
.smp li{grid-template-columns:44px minmax(0,1fr) auto auto}
.smp .sw{width:44px;height:30px;border:1px solid var(--line)}
.tick{width:22px;height:22px;border:1px solid var(--text);border-radius:2px;background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.tick[aria-checked=true]{background:var(--text);color:var(--bg)}
.tick .ic{width:13px;height:13px}
.kvx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);margin-top:14px}
.kvx div{padding:12px;border-right:1px solid var(--line)}
.kvx div:last-child{border-right:0}
.kvx dt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kvx dd{margin:4px 0 0;font-family:var(--font-h);font-size:20px}
.notes-f{display:flex;gap:8px;margin-bottom:12px}
.notes-f input{flex:1;min-width:0;height:38px;border:1px solid var(--line-2);border-radius:2px;padding:0 10px;background:var(--field)}
/* forecast fan chart (signature) */
.fan svg{display:block;overflow:visible}
.fan .hist{fill:none;stroke:var(--text);stroke-width:2}
.fan .exp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5}
.fan .band{fill:url(#fanG)}
.fan .band2{fill:var(--accent);opacity:.12}
.fan .now{stroke:var(--line-2);stroke-dasharray:2 4}
.fan .tgt{stroke:var(--green);stroke-width:1.6;stroke-dasharray:3 3}
.fan .hdl{fill:var(--green);stroke:var(--panel);stroke-width:3;cursor:ns-resize}
.fan .hdl:focus{outline:none;stroke:var(--accent)}
.fan .tlab{fill:var(--green);font-size:11px;font-weight:700}
.fan text.lbl{fill:var(--muted);font-size:10.5px;letter-spacing:.12em}
.fan .wipe-g{animation:ccFade .9s .4s backwards}
.scen{display:grid;gap:14px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:4px 10px}
.sl label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.sl output{text-align:right;font-family:var(--font-h);font-size:18px}
.sl input{grid-column:1/-1;accent-color:var(--accent);width:100%}
.sl small{grid-column:1/-1;color:var(--muted);font-size:12px}
.qt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);margin-bottom:16px}
.qt div{padding:14px;border-right:1px solid var(--line)}
.qt div:last-child{border-right:0}
.qt span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.qt b{display:block;font-family:var(--font-h);font-size:26px;font-weight:400;margin-top:4px}
.gap{padding:12px 14px;border-left:3px solid var(--green);background:color-mix(in srgb,var(--green) 8%,transparent);font-size:13px}
.gap.short{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
/* quote builder floor */
.qb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
.floor{position:relative;width:480px;height:320px;max-width:100%;margin:0 auto;border:2px solid var(--text);overflow:hidden;transition:width .5s cubic-bezier(.3,.8,.3,1),height .5s cubic-bezier(.3,.8,.3,1)}
.floor .tiles{position:absolute;inset:0;background-size:var(--tx) var(--ty)!important;transition:background-size .5s}
.floor .grout{position:absolute;inset:0;background:linear-gradient(90deg,var(--gr) 1px,transparent 1px),linear-gradient(var(--gr) 1px,transparent 1px);background-size:var(--tx) var(--ty);transition:background-size .5s;--gr:rgba(255,255,255,.55)}
.floor .cut{position:absolute;right:0;bottom:0;width:var(--cw);height:100%;background:repeating-linear-gradient(45deg,rgba(180,83,42,.35) 0 4px,transparent 4px 9px);transition:width .5s;border-left:1px dashed var(--accent)}
.floor .dim{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:700;padding:2px 6px;background:var(--panel);letter-spacing:.06em}
.qrow{display:grid;gap:6px}
.qrow label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between}
.qrow label output{font-family:var(--font-h);font-size:16px;letter-spacing:0;text-transform:none}
.qrow input[type=range]{accent-color:var(--accent)}
.qrow select{height:40px;border:1px solid var(--line-2);border-radius:2px;background:var(--field);padding:0 10px}
.lines{list-style:none;margin:10px 0 0;padding:0}
.lines li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lines li.t{font-family:var(--font-h);font-size:24px;border-bottom:0;padding-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
/* catalog */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:20px}
.stone{display:grid;gap:8px;padding:0;overflow:hidden}
.stone .sw{height:140px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.stone:hover .sw{transform:scale(1.06)}
.stone .bd{padding:0 16px 16px;display:grid;gap:6px}
.stone h3{font-family:var(--font-h);font-size:21px;font-weight:400}
.stone .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.stone .row b{color:var(--text);font-variant-numeric:tabular-nums}
.big{display:block;font-family:var(--font-h);font-size:36px;font-weight:400;margin:4px 0 12px}
.stg{display:flex;gap:0;border:1px solid var(--text);margin-bottom:16px;flex-wrap:wrap}
.stg button{flex:1 1 70px;padding:9px 4px;border:0;border-right:1px solid var(--text);background:transparent;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.stg button:last-child{border-right:0}
.stg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.kv dt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:3px 0 0;font-weight:600}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block}.set-row small{color:var(--muted);font-size:12.5px}
.tg{position:relative;width:46px;height:24px;border:1px solid var(--text);border-radius:2px;background:transparent;padding:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--muted);transition:transform .3s cubic-bezier(.7,0,.2,1),background .3s}
.tg[aria-checked=true]::after{transform:translateX(22px);background:var(--accent)}
/* responsive */
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-kpi .kpi:nth-child(2){border-right:0}.g-kpi .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.g-2,.qb{grid-template-columns:minmax(0,1fr)}}
@media (max-width:880px){
  .menu-btn{display:inline-grid!important}
  .mast-in{padding:12px 16px 12px;align-items:center}
  .mast-r{padding-bottom:0}
  nav.sub{position:fixed;left:0;right:0;top:0;z-index:70;margin:0;flex-direction:column;gap:0;padding:70px 20px 20px;background:var(--panel);border-bottom:1px solid var(--text);transform:translateY(-105%);transition:transform .45s cubic-bezier(.7,0,.2,1)}
  nav.sub a{padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}
  .nav-open nav.sub{transform:none}
  .ul{display:none}
  .navx{position:fixed;inset:0;z-index:65;background:rgba(20,18,15,.4);opacity:0;pointer-events:none;transition:opacity .3s}
  .nav-open .navx{opacity:1;pointer-events:auto}
  .mast-r .menu-btn{position:relative;z-index:75}
  main{padding:18px 16px 40px}
  .page-h h1{font-size:34px}
  .cab{grid-template-columns:minmax(0,1fr)}
  .folders{max-height:300px}
}
@media (max-width:600px){.word b{font-size:26px}.word small{display:none}.mast-r .btn .lbl{display:none}.kpi b{font-size:28px}.kvx,.qt{grid-template-columns:1fr 1fr}.kvx div:nth-child(2),.qt div:nth-child(2){border-right:0}.kv{grid-template-columns:1fr}.docs li{grid-template-columns:34px minmax(0,1fr) auto}.docs li .sz{display:none}}
@media (max-width:400px){.g-kpi{grid-template-columns:minmax(0,1fr)}.g-kpi .kpi{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>

  const S = DB.scen;
  out.innerHTML = `<div class="page-h"><div><p class="kicker">Next six months</p><h1>Forecast</h1><p>Actual orders, then an expected line with a best and worst range. Drag the green handle to set the target.</p></div><div class="ph-a"><button type="button" class="btn ghost" data-rs>Reset scenario</button></div></div>
  <section class="grid g-2"><article class="card"><div class="qt"><div><span>Worst quarter</span><b id="fLo">0</b></div><div><span>Expected quarter</span><b id="fEx">0</b></div><div><span>Best quarter</span><b id="fHi">0</b></div></div><div id="fan"></div><div class="gap" id="gap" aria-live="polite" style="margin-top:12px"></div></article>
  <article class="card"><div class="card-h"><h2>Scenario</h2></div><div class="scen">
    <div class="sl"><label for="s_win">Win rate</label><output id="o_win"></output><input type="range" id="s_win" min="-30" max="30" step="5" value="${S.win}" data-s="win"><small>How many more or fewer quoted projects turn into orders</small></div>
    <div class="sl"><label for="s_size">Deal size</label><output id="o_size"></output><input type="range" id="s_size" min="-20" max="20" step="5" value="${S.size}" data-s="size"><small>Bigger floors or cheaper stone</small></div>
    <div class="sl"><label for="s_delay">Slower orders</label><output id="o_delay"></output><input type="range" id="s_delay" min="0" max="2" step="1" value="${S.delay}" data-s="delay"><small>Months that projects slip</small></div>
    <div class="sl"><label for="s_conf">Uncertainty</label><output id="o_conf"></output><input type="range" id="s_conf" min="0.5" max="2" step="0.25" value="${S.conf}" data-s="conf"><small>How wide the best and worst range is</small></div>
    <div class="sl"><label for="s_tgt">Quarter target</label><output id="o_tgt"></output><input type="number" id="s_tgt" min="1000000" step="500000" value="${DB.target}" style="grid-column:1/-1;height:38px;border:1px solid var(--line-2);border-radius:2px;padding:0 10px;background:var(--field)"></div>
  </div></article></section>`;
  const outs = () => { $('#o_win', out).textContent = (S.win > 0 ? '+' : '') + S.win + '%'; $('#o_size', out).textContent = (S.size > 0 ? '+' : '') + S.size + '%'; $('#o_delay', out).textContent = S.delay + ' mo'; $('#o_conf', out).textContent = '×' + S.conf; $('#o_tgt', out).textContent = fmt.mshort(DB.target); };
  const nums = () => { const F = forecast(), lo = sum(F.slice(0, 3).map(f => f.lo)), ex = sum(F.slice(0, 3).map(f => f.exp)), hi = sum(F.slice(0, 3).map(f => f.hi)); countUp($('#fLo', out), lo, fmt.mshort, 500); countUp($('#fEx', out), ex, fmt.mshort, 500); countUp($('#fHi', out), hi, fmt.mshort, 500); const g = $('#gap', out), d = ex - DB.target; g.className = 'gap' + (d < 0 ? ' short' : ''); g.innerHTML = d >= 0 ? `<b>On track.</b> Expected beats the ${fmt.mshort(DB.target)} target by ${fmt.mshort(d)}.` : `<b>Short by ${fmt.mshort(-d)}.</b> Close about ${Math.ceil(-d / Math.max(1, sum(DB.deals.filter(x => x.stage === 'quoted').map(x => x.value)) / Math.max(1, DB.deals.filter(x => x.stage === 'quoted').length)))} more quoted projects, or raise the win rate.`; };
  const onTarget = (v, done) => { DB.target = Math.round(v / 100000) * 100000; $('#s_tgt', out).value = DB.target; outs(); nums(); if (done) { save(); toast('Target set to ' + fmt.mshort(DB.target)); } };
  outs(); nums(); fanChart($('#fan', out), onTarget);
  out.addEventListener('input', e => { const k = e.target.dataset.s; if (k) { S[k] = +e.target.value; outs(); nums(); clearTimeout(pForecast.t); pForecast.t = setTimeout(() => { fanChart($('#fan', out), onTarget); save(); }, 120); } });
  $('#s_tgt', out).addEventListener('change', e => { const v = +e.target.value; if (!(v >= 1000000)) { toast('Target must be at least Rs 1M', 'bad'); e.target.value = DB.target; return; } DB.target = v; save(); outs(); nums(); fanChart($('#fan', out), onTarget); toast('Target saved'); });
  $('[data-rs]', out).onclick = () => { Object.assign(S, { win: 0, size: 0, delay: 0, conf: 1 }); save(); APP.refresh(); toast('Scenario reset'); };

// ---------- Page: Quote builder (draws the floor) ----------
function pQuotes(out) {
  const q = ST.q; if (!q.item) q.item = DB.cat[0].id; if (!q.client) q.client = DB.clients[0] ? DB.clients[0].name : '';

    <div class="qrow"><label for="qi">Stone</label><select id="qi">${DB.cat.map(k => `<option value="${k.id}"${k.id === q.item ? ' selected' : ''}>${esc(k.name)} · ${k.size} · ${fmt.money(k.price)}/m²</option>`).join('')}</select></div>
    <div class="qrow"><label for="qw">Width <output id="ow"></output></label><input type="range" id="qw" min="2" max="40" step="0.5" value="${q.w}"></div>
    <div class="qrow"><label for="ql">Length <output id="ol"></output></label><input type="range" id="ql" min="2" max="60" step="0.5" value="${q.l}"></div>
    <div class="qrow"><label for="qx">Wastage <output id="ox"></output></label><input type="range" id="qx" min="0" max="25" step="1" value="${q.waste}"></div>
    <label class="chk"><input type="checkbox" id="qa"${q.adh ? ' checked' : ''}> Adhesive and grout (Rs 450/m²)</label><label class="chk"><input type="checkbox" id="qf"${q.fit ? ' checked' : ''}> Fitting by our team (Rs 900/m²)</label>
    <div class="qrow"><label for="qc">Client</label><select id="qc">${DB.clients.map(c => `<option${c.name === q.client ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
  </div></article>
  <article class="card"><div class="floor" id="fl"><div class="tiles sw" id="ft"></div><div class="grout"></div><div class="cut" id="fc"></div><span class="dim" id="fd"></span></div><ul class="lines" id="ln"></ul><div class="ph-a" style="margin-top:12px"><button type="button" class="btn primary" data-sq>${ic('check', 15)} Save quote to pipeline</button><button type="button" class="btn" data-pr>${ic('print', 15)} Print</button></div></article></section>`;
  const draw = () => {
    const k = item(q.item), area = q.w * q.l, need = area * (1 + q.waste / 100), tile = k.size.split('×').map(Number), tArea = tile[0] * tile[1] / 10000, perBox = Math.max(1, Math.round(1.44 / tArea)), boxes = Math.ceil(need / (tArea * perBox));
    const stone = boxes * perBox * tArea * k.price, adh = q.adh ? area * 450 : 0, fit = q.fit ? area * 900 : 0, tot = stone + adh + fit;
    $('#ow', out).textContent = q.w + ' m'; $('#ol', out).textContent = q.l + ' m'; $('#ox', out).textContent = q.waste + '%';
    const fl = $('#fl', out), cw = fl.parentNode.clientWidth || 520, ar = clamp(q.l / q.w, .4, 3), fh = Math.min(330, cw / ar); fl.style.width = Math.round(fh * ar) + 'px'; fl.style.height = Math.round(fh) + 'px'; fl.style.setProperty('--tx', clamp(tile[0] / 100 / q.l * 100, 1.2, 40) + '%'); fl.style.setProperty('--ty', clamp(tile[1] / 100 / q.w * 100, 1.2, 40) + '%'); fl.style.setProperty('--cw', Math.min(40, q.waste * 1.4) + '%');
    $('#ft', out).className = 'tiles sw ' + k.mat; $('#fd', out).textContent = `${q.w} × ${q.l} m = ${fmt.n(area)} m²`;
    $('#ln', out).innerHTML = `<li><span>${esc(k.name)} · ${boxes} boxes (${fmt.n(boxes * perBox * tArea)} m²)</span><b>${fmt.money(stone)}</b></li>${q.adh ? `<li><span>Adhesive and grout</span><b>${fmt.money(adh)}</b></li>` : ''}${q.fit ? `<li><span>Fitting</span><b>${fmt.money(fit)}</b></li>` : ''}<li class="t"><span>Total</span><span>${fmt.money(tot)}</span></li>`;
    return { area, tot };
  };
  chartMount($('#fl', out), () => draw()); // re-measured on resize
  const bind = (id, key, num = true) => $(id, out).addEventListener('input', e => { q[key] = num ? +e.target.value : e.target.value; draw(); });
  bind('#qw', 'w'); bind('#ql', 'l'); bind('#qx', 'waste'); bind('#qi', 'item', false); bind('#qc', 'client', false);
  $('#qa', out).addEventListener('change', e => { q.adh = e.target.checked; draw(); }); $('#qf', out).addEventListener('change', e => { q.fit = e.target.checked; draw(); });
  $('[data-sq]', out).onclick = () => { const r = draw(), k = item(q.item); if (!q.client) { toast('Add a client file first', 'bad'); return; } DB.deals.push({ id: uid('d'), title: 'Quote · ' + k.name.split(' ')[0] + ' ' + Math.round(r.area) + ' m²', client: q.client, item: q.item, area: Math.round(r.area), value: Math.round(r.tot / 1000) * 1000, stage: 'quoted', owner: DB.team[0], close: TODAY + 30 * DAY, order: -1 }); save(); toast(`Quote saved for ${q.client}`, 'ok', { label: 'View', run: () => { location.hash = '#/deals'; } }); };
  $('[data-pr]', out).onclick = () => { toast('Opening the print dialog'); setTimeout(() => { try { print(); } catch (er) { } }, 250); };
}

// ---------- Page: Catalogue ----------
function pCatalog(out) {
  out.innerHTML = `<div class="page-h"><div><p class="kicker">Yard stock</p><h1>Catalogue</h1><p>Stones and tiles with price per square metre and what is in the yard.</p></div><div class="ph-a"><div class="chips" role="group" aria-label="Material">${['all', ...MATS].map(m => `<button type="button" class="chip" data-mf="${m}" aria-pressed="${ST.mf === m}">${m === 'all' ? 'All' : MATN[m]}</button>`).join('')}</div><button type="button" class="btn primary" data-add>${ic('plus', 15)} Add stone</button></div></div><div class="cat" id="cat"></div>`;
  const kf = [{ name: 'name', label: 'Name', required: true }, { name: 'mat', label: 'Material', type: 'select', options: MATS.map(m => ({ v: m, l: MATN[m] })), half: true }, { name: 'size', label: 'Tile size (cm)', type: 'select', options: ['30×60', '60×60', '60×120', '80×80'], half: true }, { name: 'price', label: 'Price per m² (Rs)', type: 'number', min: 100, required: true, half: true }, { name: 'stock', label: 'In yard (m²)', type: 'number', min: 0, required: true, half: true }];
  const draw = () => { const L = DB.cat.filter(k => ST.mf === 'all' || k.mat === ST.mf); $('#cat', out).innerHTML = L.length ? L.map((k, i) => `<article class="card stone in" style="--i:${Math.min(i, 10)}">${sw(k.mat)}<div class="bd"><h3>${esc(k.name)}</h3><div class="row"><span>${k.size} cm</span><b>${fmt.money(k.price)}/m²</b></div><div class="row"><span>In yard</span><b style="${k.stock < 60 ? 'color:var(--bad)' : ''}">${fmt.n(k.stock)} m²</b></div><div class="row"><button type="button" class="btn sm" data-qk="${k.id}">Quote it</button><span><button type="button" class="icon-btn sm" data-ek="${k.id}" aria-label="Edit ${esc(k.name)}">${ic('edit', 14)}</button><button type="button" class="icon-btn sm" data-dk="${k.id}" aria-label="Delete ${esc(k.name)}">${ic('trash', 14)}</button></span></div></div></article>`).join('') : `<div class="card empty" style="grid-column:1/-1">${ic('box', 24)}<b>No stone of that kind yet</b></div>`; };
  draw();
  out.addEventListener('click', e => {
    const m = e.target.closest('[data-mf]'), qk = e.target.closest('[data-qk]'), ek = e.target.closest('[data-ek]'), dk = e.target.closest('[data-dk]');
    if (m) { ST.mf = m.dataset.mf; $$('[data-mf]', out).forEach(c => c.setAttribute('aria-pressed', String(c === m))); draw(); }
    else if (qk) { ST.q.item = qk.dataset.qk; location.hash = '#/quotes'; }
    else if (ek) { const k = DB.cat.find(x => x.id === ek.dataset.ek); form({ title: 'Edit ' + k.name, fields: kf, values: k, onSubmit: v => { Object.assign(k, v); save(); toast('Saved'); draw(); } }); }
    else if (dk) { const k = DB.cat.find(x => x.id === dk.dataset.dk); if (DB.deals.some(d => d.item === k.id)) { toast('This stone is on a live project, so it stays', 'bad'); return; } ask(`Delete ${k.name}?`).then(ok => { if (!ok) return; const i = DB.cat.indexOf(k); DB.cat.splice(i, 1); save(); draw(); toast('Deleted', 'ok', { label: 'Undo', run: () => { DB.cat.splice(i, 0, k); save(); draw(); } }); }); }
    else if (e.target.closest('[data-add]')) form({ title: 'Add stone', submit: 'Add', fields: kf, values: { mat: 'marble', size: '60×60', stock: 100 }, onSubmit: v => { DB.cat.push(Object.assign({ id: uid('k') }, v)); save(); toast(`${v.name} added`); draw(); } });
  });
}

// ---------- Page: Reports ----------
function pReports(out) {
  out.innerHTML = `<div class="page-h"><div><p class="kicker">Six months</p><h1>Reports</h1></div><div class="ph-a"><button type="button" class="btn" data-csv>${ic('download', 15)} Export projects</button></div></div>
  <section class="grid g-2"><article class="card"><div class="card-h"><h2>Orders by stone</h2></div><div id="r1"></div></article><article class="card"><div class="card-h"><h2>Stage conversion</h2></div><div id="r2"></div></article></section>
  <section class="grid g-3"><article class="card"><div class="card-h"><h2>Average project by client type</h2></div><div id="r3"></div></article><article class="card"><div class="card-h"><h2>Area in play</h2></div><div id="r4"></div></article><article class="card"><div class="card-h"><h2>Samples sent</h2></div><div id="r5"></div></article></section>`;
  const cols = ['#cfc8bb', '#6f9b6f', '#2b2b2b', '#b4532a', '#4a5059', '#a9a39a', '#cbb995'];
  barChart($('#r1', out), { labels: monthsBack(6), stacked: true, height: 250, fmt: fmt.money, yfmt: fmt.mshort, yw: 58, series: MATS.map((m, i) => ({ name: MATN[m], data: DB.byMat[i], color: cols[i] })), label: 'Orders by stone' });
  funnel($('#r2', out), { steps: STAGES.map((s, i) => ({ label: s.name, value: DB.deals.filter(d => STAGES.findIndex(x => x.id === d.stage) >= i).length, color: ['#8a8173', '#5a6f8c', '#c9a227', '#2f5d50', '#b4532a'][i] })) });
  hbars($('#r3', out), CTYPES.map((t, i) => { const L = DB.deals.filter(d => (DB.clients.find(c => c.name === d.client) || {}).type === t); return { label: t, value: L.length ? sum(L.map(d => d.value)) / L.length : 0, color: FCOL[i] }; }), { fmt: fmt.mshort });
  barChart($('#r4', out), { labels: STAGES.slice(0, 4).map(s => s.name), height: 190, fmt: v => fmt.n(v) + ' m²', series: [{ name: 'Area', data: STAGES.slice(0, 4).map(s => sum(DB.deals.filter(d => d.stage === s.id).map(d => d.area))), color: '--c2' }], label: 'Area in play' });
  const all = DB.clients.flatMap(c => c.samples); gauge($('#r5', out), { value: all.filter(s => s.sent).length, max: Math.max(1, all.length), text: all.filter(s => s.sent).length + ' / ' + all.length, sub: 'samples posted', label: 'Samples sent', color: '--c1' });
  $('[data-csv]', out).onclick = () => { try { const rows = [['Project', 'Client', 'Stone', 'Area m2', 'Value', 'Stage'], ...DB.deals.map(d => [d.title, d.client, item(d.item).name, d.area, d.value, stage(d.stage).name])], b = new Blob([rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'slatehouse-projects.csv'; document.body.append(a); a.click(); a.remove(); toast('slatehouse-projects.csv downloaded'); } catch (er) { toast('Download is blocked here', 'bad'); } };
}

// ---------- Page: Settings ----------
function pSettings(out) {
  const cf = [{ name: 'name', label: 'Company', required: true }, { name: 'yard', label: 'Yard address', required: true }, { name: 'wastage', label: 'Default wastage (%)', type: 'number', min: 0, max: 30, required: true }];
  out.innerHTML = `<div class="page-h"><div><p class="kicker">House rules</p><h1>Settings</h1></div></div><section class="grid g-2"><article class="card"><div class="card-h"><h2>Company</h2></div><form class="form" id="cf" novalidate>${cf.map(f => fieldHtml(f, DB.co[f.name], 'cf')).join('')}<div class="f"><button type="submit" class="btn primary" style="justify-self:start">Save</button></div></form></article>
  <article class="card"><div class="card-h"><h2>Notices and look</h2></div>${[['samples', 'Sample reminders', 'Remind the owner when a sample waits more than 3 days'], ['weekly', 'Monday forecast', 'The forecast in your inbox each Monday'], ['sms', 'Delivery SMS', 'Text the site manager on delivery day']].map(([k, t, s]) => `<div class="set-row"><div><b id="sh_${k}">${t}</b><small>${s}</small></div><button type="button" class="tg" role="switch" aria-checked="${!!DB.prefs[k]}" aria-labelledby="sh_${k}" data-pf="${k}"></button></div>`).join('')}<div class="set-row"><div><b>Theme</b><small>Limestone by day, basalt by night</small></div>${seg('Theme', [{ v: 'light', l: 'Limestone' }, { v: 'dark', l: 'Basalt' }], document.documentElement.dataset.theme)}</div><div class="set-row"><div><b>Reset demo data</b><small>Restore the sample stone yard</small></div><button type="button" class="btn danger sm" data-reset>Reset</button></div></article></section>`;
  const fm = $('#cf', out);
  fm.addEventListener('submit', e => { e.preventDefault(); const v = readForm(fm, cf), er = checkForm(cf, v); cf.forEach(f => { const el = fm.elements.namedItem(f.name); if (er[f.name]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); $('#cf_' + f.name + '_e', out).textContent = er[f.name] || ''; }); if (Object.keys(er).length) return; Object.assign(DB.co, v); ST.q.waste = v.wastage; save(); toast('Company saved'); });
  segBind(out, v => { store.set(KEY + ':theme', v); applyTheme(v); });
  out.addEventListener('click', e => { const t = e.target.closest('[data-pf]'); if (t) { const k = t.dataset.pf; DB.prefs[k] = !DB.prefs[k]; t.setAttribute('aria-checked', String(DB.prefs[k])); save(); toast('Saved'); } if (e.target.closest('[data-reset]')) ask('Reset all demo data?', { ok: 'Reset' }).then(ok => { if (!ok) return; DB = seed(); ST.sel = null; ST.q = { item: null, w: 6, l: 9, waste: 10, adh: true, fit: true, client: null }; save(); APP.refresh(); toast('Demo data restored'); }); });
}

// ---------- Start ----------
$('#qQuote').onclick = () => { location.hash = '#/quotes'; };
const APP = startApp({
  key: KEY, name: 'Slatehouse', def: 'overview', outlet: $('#main'), nav: $('[data-nav]'), marker: $('.ul'), axis: 'x',
  pages: { overview: { title: 'Overview', icon: 'grid', render: pOverview }, deals: { title: 'Deals', icon: 'board', render: pDeals }, clients: { title: 'Client files', icon: 'folder', render: pClients }, forecast: { title: 'Forecast', icon: 'trend', render: pForecast }, quotes: { title: 'Quote builder', icon: 'receipt', render: pQuotes }, catalog: { title: 'Catalogue', icon: 'box', render: pCatalog }, reports: { title: 'Reports', icon: 'chart', render: pReports }, settings: { title: 'Settings', icon: 'sliders', render: pSettings } },
  notes: [['Margalla Architects ordered 640 m² of white marble', 'win', 35], ['Samples for Riverbend Builders are waiting', 'bad', 120], ['Forecast refreshed for next quarter', 'info', 500, true]],
  cmd: () => [{ label: 'New project', hint: 'Action', icon: 'plus', run: () => newDeal() }, { label: 'Quote builder', hint: 'Action', icon: 'receipt', run: () => { location.hash = '#/quotes'; } }, ...DB.clients.map(c => ({ label: c.name, hint: 'Client file · ' + c.type, icon: 'folder', run: () => { ST.sel = c.id; location.hash = '#/clients'; APP.refresh(); } })), ...DB.deals.map(d => ({ label: d.title + ' · ' + d.client, hint: stage(d.stage).name, icon: 'board', run: () => openDeal(d) }))]
});
</script>
</body>
</html>
