<title>Shackle · combination padlock with a dial you can turn</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: steel lockers, safety orange and chrome ---------- */
  :root {
    color-scheme: light;
    --bg: #e6eaef;
    --bg-2: #d3dae3;
    --steel: #4a5f77;
    --steel-2: #3b4d62;
    --steel-3: #5a7290;
    --inside: #1b222b;
    --orange: #ff7a1a;
    --orange-2: #e05a00;
    --card: #ffffff;
    --ink: #17202b;
    --muted: #61707f;
    --line: rgba(23, 32, 43, .13);
    --ok: #17a36d;
    --bad: #e2453c;
    --field: #f0f3f7;
    --tape: #f3e6b5;
    --shadow: rgba(20, 35, 55, .35);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #10141a;
    --bg-2: #171d26;
    --steel: #2b3848;
    --steel-2: #222c39;
    --steel-3: #34445a;
    --inside: #080b0f;
    --orange: #ff8a33;
    --orange-2: #e8680f;
    --card: #19202a;
    --ink: #edf1f6;
    --muted: #a2afbd;
    --line: rgba(237, 241, 246, .13);
    --ok: #3fd69a;
    --bad: #ff6f63;
    --field: #222b37;
    --tape: #d9cb94;
    --shadow: rgba(0, 0, 0, .65);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 18px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background: radial-gradient(circle at 50% 20%, var(--bg), var(--bg-2));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .stage { width: min(100%, 440px); }

  /* ---------- Locker close-up: the inside, the door and the lock ---------- */
  .locker { position: relative; height: 330px; border-radius: 18px; overflow: hidden; background: var(--inside); box-shadow: 0 30px 50px -30px var(--shadow), 0 0 0 6px var(--steel-2); animation: rise .7s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .inside { position: absolute; inset: 0; display: grid; place-items: end center; padding-bottom: 18px; background: radial-gradient(ellipse at 50% 20%, rgba(255, 200, 120, .25), transparent 60%), var(--inside); }
  .inside svg { width: 72%; height: auto; transform: translateY(14px) scale(.96); opacity: .4; transition: transform .8s cubic-bezier(.3, 1.4, .5, 1) .25s, opacity .5s .2s; }
  .locker.open .inside svg { transform: none; opacity: 1; }
  .door {
    position: absolute; inset: 0; transform-origin: 0 50%; transition: transform .95s cubic-bezier(.35, 1.25, .5, 1);
    background:
      repeating-linear-gradient(180deg, rgba(0, 0, 0, .3) 0 4px, transparent 4px 12px) 22px 92px / 50px 108px no-repeat,
      repeating-linear-gradient(180deg, rgba(0, 0, 0, .3) 0 4px, transparent 4px 12px) calc(100% - 22px) 92px / 50px 108px no-repeat,
      linear-gradient(90deg, rgba(255, 255, 255, .06), transparent 30%, rgba(0, 0, 0, .12)),
      linear-gradient(180deg, var(--steel-3), var(--steel));
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .06);
  }
  .locker.open .door { transform: perspective(900px) rotateY(-78deg); }
  .plate { position: absolute; left: 18px; top: 18px; padding: 5px 9px; border-radius: 6px; font: 800 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #e8eef5; background: rgba(0, 0, 0, .28); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
  .tape { position: absolute; right: 14px; top: 16px; padding: 7px 12px; transform: rotate(3deg); background: var(--tape); color: #2b2a20; font: 700 13px/1.2 "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; box-shadow: 0 4px 8px -4px rgba(0, 0, 0, .4); clip-path: polygon(2% 0, 98% 4%, 100% 96%, 0 100%); }
  .hasp { position: absolute; left: 50%; top: 114px; width: 128px; height: 22px; margin-left: -64px; border-radius: 6px; background: linear-gradient(180deg, #d3dae2, #8f9aa7); box-shadow: 0 3px 6px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .hasp::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, #5d6876 0 2.6px, transparent 3.2px) 2px 50% / 8px 8px no-repeat, radial-gradient(circle, #5d6876 0 2.6px, transparent 3.2px) calc(100% - 2px) 50% / 8px 8px no-repeat; }

  .lock { position: absolute; left: 50%; top: 44px; width: 210px; margin-left: -105px; z-index: 2; touch-action: none; transform-origin: 50% 10%; animation: hang 5s ease-in-out infinite; }
  @keyframes hang { 50% { transform: rotate(1.4deg); } }
  .lock svg { display: block; width: 100%; height: auto; overflow: visible; }
  .lock.tug { animation: tug .3s ease; }
  @keyframes tug { 50% { transform: translateY(7px); } }
  .lock.rattle { animation: rattle .5s ease; }
  @keyframes rattle { 15%, 55% { transform: translateY(4px) rotate(-3deg); } 35%, 75% { transform: translateY(1px) rotate(3deg); } }
  .lock.away { animation: none; }
  .lock.back { animation: dropIn .8s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes dropIn { from { transform: translateY(-260px); } }
  .lock .body { fill: url(#shBody); }
  .lock .bezel { fill: none; stroke: #cfd6de; stroke-width: 7; stroke-dasharray: 2 2.2; }
  .lock .face { fill: #1a2028; }
  .lock .tick { stroke: #dfe5ec; stroke-width: 1.2; }
  .lock .tick.big { stroke-width: 2.2; }
  .lock .n { fill: #f2f5f8; font: 700 9.5px system-ui, sans-serif; text-anchor: middle; }
  .lock .hub { fill: url(#shHub); }
  .lock .pointer { fill: #fff; }
  .lock .pointer.flash { animation: pflash .5s ease; }
  @keyframes pflash { 50% { fill: #ffd76a; transform: translateY(-2px); } }
  .lock .pointer.bad { fill: var(--bad); }
  .lock .shackle path { fill: none; stroke: url(#shChrome); stroke-width: 15; }
  .dial { cursor: grab; outline: none; }
  .dial:active { cursor: grabbing; }
  .dial:focus-visible .face { stroke: #ffd76a; stroke-width: 3; }

  /* ---------- Controls ---------- */
  .panel { position: relative; margin-top: 16px; padding: 16px 18px 14px; border-radius: 22px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 26px 40px -30px var(--shadow); text-align: center; }
  h1 { margin: 0; font-size: 18px; }
  .reading { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .reading b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .groups { display: flex; justify-content: center; align-items: flex-start; gap: 10px; margin-top: 12px; }
  .grp { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .pair { display: flex; gap: 4px; padding: 4px; border-radius: 14px; transition: background .3s, box-shadow .3s; }
  .grp.set .pair { background: rgba(255, 122, 26, .12); box-shadow: inset 0 0 0 1.5px var(--orange); }
  .grp.set .pair { animation: setPop .45s cubic-bezier(.34, 1.8, .5, 1); }
  @keyframes setPop { 50% { transform: scale(1.08); } }
  .grp .dir { font-size: 11.5px; font-weight: 750; color: var(--muted); letter-spacing: .04em; }
  .grp.next .dir { color: var(--orange-2); }
  .dot { align-self: center; margin-top: -18px; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .cell { width: clamp(30px, 9vw, 40px); height: 48px; }
  .cell input {
    width: 100%; height: 100%; padding: 0; border: 0; border-radius: 10px; outline: none; text-align: center;
    background: var(--field); color: var(--ink); caret-color: var(--orange);
    font: 800 21px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; box-shadow: inset 0 0 0 1.5px var(--line);
    transition: box-shadow .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .cell input:focus, .cell.cur input { box-shadow: inset 0 0 0 2px var(--orange), 0 0 0 4px rgba(255, 122, 26, .16); transform: translateY(-2px); }
  .cell.land input { animation: land .35s cubic-bezier(.34, 1.8, .5, 1); }
  @keyframes land { 0% { transform: scale(.85); } 55% { transform: scale(1.1); } }
  .groups.bad { animation: shake .45s ease; }
  .groups.bad .cell input { box-shadow: inset 0 0 0 2px var(--bad); }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .groups.good .cell input { background: var(--ok); color: #fff; box-shadow: none; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: 0; border-radius: 12px; cursor: pointer;
    font-size: 14px; font-weight: 750; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled), .btn.press { transform: scale(.95); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.solid { color: #fff; background: linear-gradient(135deg, var(--orange), var(--orange-2)); box-shadow: 0 10px 18px -10px rgba(224, 90, 0, .9); }
  .btn:focus-visible { outline: 2.5px solid var(--orange); outline-offset: 3px; }
  .status { min-height: 20px; margin: 10px 0 0; font-size: 13.5px; font-weight: 650; }
  .status[data-tone="good"] { color: var(--ok); }
  .status[data-tone="bad"] { color: var(--bad); }
  kbd { padding: 1px 5px; border-radius: 5px; background: var(--field); box-shadow: inset 0 -1px 0 var(--line); font: 600 11px ui-monospace, monospace; }
  .help { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; }

  @media (max-width: 380px) { .locker { height: 300px; } .lock { width: 190px; margin-left: -95px; } .groups { gap: 6px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="locker" id="locker">
      <div class="inside" aria-hidden="true">
        <svg viewBox="0 0 240 150">
          <ellipse cx="120" cy="140" rx="110" ry="9" fill="#000" opacity=".35"/>
          <path d="M30 70h150a20 20 0 0 1 20 20v44H10V90a20 20 0 0 1 20-20z" fill="#ff7a1a"/>
          <path d="M70 70c0-22 14-34 35-34s35 12 35 34" fill="none" stroke="#2b3644" stroke-width="8" stroke-linecap="round"/>
          <path d="M10 100h190" stroke="#e05a00" stroke-width="4"/>
          <rect x="88" y="94" width="34" height="12" rx="4" fill="#ffd76a"/>
          <rect x="196" y="40" width="24" height="94" rx="9" fill="#5fd0ff" opacity=".85"/>
          <rect x="200" y="30" width="16" height="14" rx="4" fill="#e8eef5"/>
          <path d="M150 64c14-12 34-10 44 2v22c-12-8-30-8-44 2z" fill="#f3f6fa"/>
        </svg>
      </div>
      <div class="door" id="door">
        <span class="plate" aria-hidden="true">LOCKER 18</span>
        <span class="hasp" aria-hidden="true"></span>
        <span class="tape" id="tape">combo 18 · 04 · 27</span>
      </div>
      <div class="lock" id="lock">
        <svg viewBox="0 0 200 260">
          <defs>
            <linearGradient id="shChrome" x1="0" x2="1"><stop offset="0" stop-color="#8f9aa7"/><stop offset=".35" stop-color="#f4f7fa"/><stop offset=".65" stop-color="#b8c1cc"/><stop offset="1" stop-color="#7f8a97"/></linearGradient>
            <linearGradient id="shBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4d"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d95400"/></linearGradient>
            <radialGradient id="shHub" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f4f7fa"/><stop offset="1" stop-color="#8f9aa7"/></radialGradient>
          </defs>
          <g class="shackle" id="shackle"><path d="M58 128V62a42 42 0 0 1 84 0v66"/></g>
          <rect class="body" x="16" y="106" width="168" height="150" rx="34"/>
          <path d="M34 120h132" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/>
          <path class="pointer" id="pointer" d="M93 116h14l-7 10z"/>
          <circle class="bezel" cx="100" cy="182" r="62"/>
          <g class="dial" id="dial" role="slider" tabindex="0" aria-label="Combination dial" aria-valuemin="0" aria-valuemax="39" aria-valuenow="0" aria-valuetext="0">
            <circle class="face" cx="100" cy="182" r="57"/>
            <g id="rotor"><g id="marks"></g><circle class="hub" cx="100" cy="182" r="18"/><path d="M100 168v28M86 182h28" stroke="#6d7886" stroke-width="2" stroke-linecap="round"/></g>
          </g>
        </svg>
      </div>
    </div>

    <section class="panel" aria-labelledby="title">
      <h1 id="title">Open locker 18</h1>
      <p class="reading">Dial at <b id="reading">00</b> · turn it, or type the three numbers</p>
      <div class="groups" id="groups" role="group" aria-labelledby="title">
        <div class="grp" data-g="0"><div class="pair"><span class="cell"><input inputmode="numeric" autocomplete="off" aria-label="First number, digit 1"></span><span class="cell"><input inputmode="numeric" autocomplete="off" aria-label="First number, digit 2"></span></div><span class="dir">Right ↻</span></div>
        <span class="dot" aria-hidden="true"></span>
        <div class="grp" data-g="1"><div class="pair"><span class="cell"><input inputmode="numeric" autocomplete="off" aria-label="Second number, digit 1"></span><span class="cell"><input inputmode="numeric" autocomplete="off" aria-label="Second number, digit 2"></span></div><span class="dir">Left ↺</span></div>
        <span class="dot" aria-hidden="true"></span>
        <div class="grp" data-g="2"><div class="pair"><span class="cell"><input inputmode="numeric" autocomplete="off" aria-label="Third number, digit 1"></span><span class="cell"><input inputmode="numeric" autocomplete="off" aria-label="Third number, digit 2"></span></div><span class="dir">Right ↻</span></div>
      </div>
      <div class="row" id="ctrlRow">
        <button type="button" class="btn solid" id="setBtn">Set this number</button>
        <button type="button" class="btn" id="clearBtn">Clear</button>
      </div>
      <div class="row" id="doneRow" hidden><button type="button" class="btn solid" id="relock">Lock it again</button></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="help">Drag the dial, or focus it and use <kbd>←</kbd> <kbd>→</kbd> and <kbd>Enter</kbd></p>
    </section>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const COMBO = [18, 4, 27];            // the demo combination, also written on the tape
  const CX = 100, CY = 182, STEP = 9;   // dial centre and degrees per number (40 numbers)

  const lock = $("lock"), locker = $("locker"), dial = $("dial"), rotor = $("rotor"), shackle = $("shackle"), pointer = $("pointer");
  const groupsEl = $("groups"), statusEl = $("status");
  const grps = Array.from(groupsEl.querySelectorAll(".grp"));
  const inputs = Array.from(groupsEl.querySelectorAll("input"));
  const cells = inputs.map((i) => i.parentElement);

  // ---- Cancellable waits ----
  const CANCEL = { cancelled: true };
  let gen = 0;
  const pause = (ms, g) => new Promise((ok, no) => setTimeout(() => (g === gen ? ok() : no(CANCEL)), ms));
  const anim = (ms, g) => pause(reduce ? Math.min(ms, 120) : ms, g);
  const quiet = (p) => p.catch((e) => { if (e !== CANCEL) throw e; });
  const restart = (el, cls) => { el.classList.remove(cls); void (el.offsetWidth || el.getBoundingClientRect()); el.classList.add(cls); };
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const spring = (t) => 1 - Math.cos(t * 3.4 * Math.PI) * Math.exp(-t * 5.5);
  function tween(ms, g, fn, ease) {
    if (reduce) { fn(1); return Promise.resolve(); }
    return new Promise((ok, no) => {
      const t0 = performance.now();
      const step = (now) => {
        if (g !== gen) return no(CANCEL);
        const t = Math.min(1, (now - t0) / ms);
        fn((ease || easeInOut)(t));
        if (t < 1) requestAnimationFrame(step); else ok();
      };
      requestAnimationFrame(step);
    });
  }
  function say(msg, tone) { statusEl.innerHTML = msg; statusEl.dataset.tone = tone || ""; }
  const two = (n) => String(n).padStart(2, "0");

  // ---- Draw the dial face: 40 ticks and a number every 5 ----
  const marks = $("marks");
  for (let n = 0; n < 40; n++) {
    const a = (n * STEP - 90) * Math.PI / 180, big = n % 5 === 0;
    const r1 = 55, r2 = big ? 47 : 51;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("class", "tick" + (big ? " big" : ""));
    l.setAttribute("x1", CX + Math.cos(a) * r1); l.setAttribute("y1", CY + Math.sin(a) * r1);
    l.setAttribute("x2", CX + Math.cos(a) * r2); l.setAttribute("y2", CY + Math.sin(a) * r2);
    marks.append(l);
    if (n % 5 === 0) {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("class", "n");
      t.setAttribute("x", CX + Math.cos(a) * 37);
      t.setAttribute("y", CY + Math.sin(a) * 37 + 3.4);
      t.setAttribute("transform", "rotate(" + n * STEP + " " + (CX + Math.cos(a) * 37) + " " + (CY + Math.sin(a) * 37) + ")");
      t.textContent = n;
      marks.append(t);
    }
  }

  // ---- Dial angle and the number under the pointer ----
  // Numbers run clockwise on the face, so turning left (counter-clockwise) brings higher numbers to the top.
  let angle = 0, lastNum = 0;
  const numAt = (deg) => ((Math.round(-deg / STEP) % 40) + 40) % 40;
  function setAngle(deg) {
    angle = deg;
    rotor.setAttribute("transform", "rotate(" + deg.toFixed(2) + " " + CX + " " + CY + ")");
    const n = numAt(deg);
    if (n !== lastNum) { lastNum = n; $("reading").textContent = two(n); dial.setAttribute("aria-valuenow", n); dial.setAttribute("aria-valuetext", String(n)); }
  }
  // Spin to a number in a direction (right = clockwise). The first number gets an extra full turn, like a real lock.
  function spinTo(n, dir, g, extra) {
    const target = -n * STEP;
    let delta = target - angle;
    if (dir > 0) { delta = ((delta % 360) + 360) % 360; if (extra) delta += 360; }
    else { delta = -((((-delta) % 360) + 360) % 360); if (extra) delta -= 360; }
    const from = angle, ms = 500 + Math.abs(delta) * 1.6;
    return tween(ms, g, (t) => setAngle(from + delta * t)).then(() => setAngle(Math.round((from + delta) / STEP) * STEP));
  }

  // Drag to turn: follow the pointer around the centre
  let dragging = false, dragA = 0;
  function pAngle(e) {
    const r = dial.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  }
  dial.addEventListener("pointerdown", (e) => {
    if (busy || opened) return;
    dragging = true;
    dragA = pAngle(e);
    try { dial.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
    e.preventDefault();
  });
  dial.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const a = pAngle(e);
    let d = a - dragA;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    dragA = a;
    setAngle(angle + d);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    const from = angle, to = Math.round(angle / STEP) * STEP, g = gen;
    quiet(tween(180, g, (t) => setAngle(from + (to - from) * t)));
  }
  dial.addEventListener("pointerup", endDrag);
  dial.addEventListener("pointercancel", endDrag);
  dial.addEventListener("wheel", (e) => {
    if (busy || opened) return;
    e.preventDefault();
    setAngle(Math.round(angle / STEP) * STEP + (e.deltaY > 0 ? STEP : -STEP));
  }, { passive: false });
  dial.addEventListener("keydown", (e) => {
    if (busy || opened) return;
    const snap = Math.round(angle / STEP) * STEP;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); setAngle(snap + STEP); }          // clockwise: number goes down
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); setAngle(snap - STEP); }       // counter-clockwise: number goes up
    else if (e.key === "PageDown") { e.preventDefault(); setAngle(snap + STEP * 5); }
    else if (e.key === "PageUp") { e.preventDefault(); setAngle(snap - STEP * 5); }
    else if (e.key === "Home") { e.preventDefault(); setAngle(0); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setFromDial(); }
  });

  // ---- The six boxes (three 2-digit numbers) work as one field ----
  const vals = Array(6).fill("");
  let busy = false, opened = false, spinning = Promise.resolve();
  function setCh(i, d) { vals[i] = d; inputs[i].value = d; if (d) restart(cells[i], "land"); }
  function groupValue(k) { return vals[k * 2] && vals[k * 2 + 1] ? Number(vals[k * 2] + vals[k * 2 + 1]) : null; }
  function paintGroups() {
    let next = -1;
    grps.forEach((gEl, k) => {
      const v = groupValue(k);
      gEl.classList.toggle("set", v !== null && v <= 39);
      if (next < 0 && v === null) next = k;
    });
    grps.forEach((gEl, k) => gEl.classList.toggle("next", k === next));
  }
  function clearAll() { for (let i = 0; i < 6; i++) setCh(i, ""); groupsEl.classList.remove("bad", "good"); paintGroups(); }
  function mark(i) { cells.forEach((c, n) => c.classList.toggle("cur", n === i && demoOn)); }
  function focusBox(i) { i = Math.max(0, Math.min(5, i)); if (!demoOn) { inputs[i].focus(); inputs[i].select(); } }
  // When a pair is complete, check it and turn the dial to it
  function groupDone(k) {
    const v = groupValue(k);
    if (v === null) return;
    if (v > 39) {
      say("The dial only goes from 00 to 39. Try that number again.", "bad");
      setCh(k * 2, ""); setCh(k * 2 + 1, "");
      restart(groupsEl, "bad");
      paintGroups();
      focusBox(k * 2);
      return;
    }
    paintGroups();
    const g = gen;
    pending++;
    // spins run one after another; the lock is only tried once the last one has landed
    spinning = spinning.then(() => spinTo(v, k === 1 ? -1 : 1, g, k === 0)).then(() => restart(pointer, "flash"));
    quiet(spinning.then(() => { pending--; if (!pending && vals.every(Boolean)) return tryOpen(g); }));
    spinning = spinning.catch(() => { pending = 0; });
  }
  let pending = 0;
  function type(i, d) { setCh(i, d); paintGroups(); if (i % 2 === 1 || vals[i ^ 1]) groupDone(i >> 1); }
  inputs.forEach((inp, i) => {
    inp.addEventListener("focus", () => requestAnimationFrame(() => inp.select()));
    inp.addEventListener("input", (e) => {
      if (busy || opened) { inp.value = vals[i]; return; }
      const got = inp.value.replace(/\D/g, "");
      if (e.inputType === "insertText" && e.data && e.data.length === 1) {
        const d = e.data.replace(/\D/g, "");
        if (!d) { inp.value = vals[i]; return; }
        type(i, d); focusBox(i + 1);
      } else if (got.length > 1) fill(got.length >= 6 ? 0 : i, got);
      else { setCh(i, got); paintGroups(); if (got) { focusBox(i + 1); if (i % 2 === 1) groupDone(i >> 1); } }
    });
    inp.addEventListener("keydown", (e) => {
      if (busy || opened) return;
      if (e.key === "Backspace") { e.preventDefault(); if (vals[i]) setCh(i, ""); else if (i > 0) { setCh(i - 1, ""); focusBox(i - 1); } paintGroups(); }
      else if (e.key === "Delete") { e.preventDefault(); setCh(i, ""); paintGroups(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); focusBox(i - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); focusBox(i + 1); }
      else if (e.key === "Home") { e.preventDefault(); focusBox(0); }
      else if (e.key === "End") { e.preventDefault(); focusBox(5); }
    });
    inp.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy || opened) return;
      const d = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (d) fill(d.length >= 6 ? 0 : i, d); else say("Only numbers can be pasted here.", "bad");
    });
  });
  function fill(start, text) {
    let i = start;
    for (const d of text) { if (i >= 6) break; setCh(i, d); if (i % 2 === 1) groupDone(i >> 1); i++; }
    paintGroups();
    focusBox(i);
  }

  // ---- Set the number under the pointer into the next empty pair ----
  function setFromDial() {
    if (busy || opened) return;
    const k = [0, 1, 2].find((n) => groupValue(n) === null);
    if (k === undefined) return;
    const n = numAt(angle);
    setCh(k * 2, two(n)[0]); setCh(k * 2 + 1, two(n)[1]);
    paintGroups();
    restart(pointer, "flash");
    say("Number " + (k + 1) + " set to " + two(n) + (k < 2 ? ". Now turn " + (k === 0 ? "left" : "right") + " to the next one." : "."));
    if (vals.every(Boolean)) quiet(tryOpen(gen));
  }
  $("setBtn").addEventListener("click", setFromDial);
  $("clearBtn").addEventListener("click", () => { if (busy || opened) return; clearAll(); say(""); focusBox(0); });

  // ---- Pull the shackle ----
  let tries = 0;
  async function tryOpen(g) {
    if (busy || opened || !vals.every(Boolean)) return;
    busy = true;
    mark(-1);
    say("Pulling the shackle…");
    restart(lock, "tug");
    await anim(320, g);
    const combo = [0, 1, 2].map(groupValue);
    if (combo.every((v, k) => v === COMBO[k])) {
      groupsEl.classList.add("good");
      await openUp(g);
      return;
    }
    tries++;
    restart(lock, "rattle");
    pointer.classList.add("bad");
    restart(groupsEl, "bad");
    say(tries < 3 ? "It will not budge. Check the numbers and try again." : "Still locked. The tape on the door says <b>18 · 04 · 27</b>.", "bad");
    await anim(700, g);
    pointer.classList.remove("bad");
    clearAll();
    busy = false;
    focusBox(0);
  }
  async function openUp(g) {
    // the shackle springs up, swings round, then the lock drops off and the door swings open
    await tween(420, g, (t) => shackle.setAttribute("transform", "translate(0 " + (-30 * spring(t)).toFixed(2) + ")"), (t) => t);
    // swing round the long leg (a flip on x looks like a turn in 3D)
    await tween(420, g, (t) => shackle.setAttribute("transform", "translate(0 -30) translate(58 0) scale(" + (1 - 2 * t).toFixed(3) + " 1) translate(-58 0)"));
    await anim(250, g);
    lock.classList.add("away");
    if (!reduce) {
      lockFall = lock.animate([
        { transform: "translateY(0) rotate(0)", opacity: 1 },
        { transform: "translateY(-14px) rotate(-6deg)", opacity: 1, offset: 0.2 },
        { transform: "translateY(320px) rotate(24deg)", opacity: 0 }
      ], { duration: 700, easing: "cubic-bezier(.5,0,.8,.6)", fill: "forwards" });
    } else lock.style.opacity = "0";
    await anim(420, g);
    locker.classList.add("open");
    sparkle();
    opened = true;
    busy = false;
    $("ctrlRow").hidden = true;
    $("doneRow").hidden = false;
    $("title").textContent = "Locker 18 is open";
    say("Your gym bag is right where you left it.", "good");
    if (!demoOn) $("relock").focus();
  }
  let lockFall = null;

  // ---- Lock it again: door shuts, the lock drops back onto the hasp ----
  function relock(animate) {
    opened = false; busy = false; tries = 0;
    locker.classList.remove("open");
    if (lockFall) { lockFall.cancel(); lockFall = null; }
    lock.style.opacity = "";
    lock.classList.remove("away", "tug", "rattle");
    shackle.removeAttribute("transform");
    pointer.classList.remove("bad");
    if (animate) restart(lock, "back");
    $("ctrlRow").hidden = false;
    $("doneRow").hidden = true;
    $("title").textContent = "Open locker 18";
    clearAll();
    setAngle(0);
    say("");
  }
  $("relock").addEventListener("click", () => { relock(true); setTimeout(() => focusBox(0), 400); });
  // one-off motions hand back to the idle sway when they end
  lock.addEventListener("animationend", (e) => {
    if (e.target !== lock) return;
    if (e.animationName === "dropIn") lock.classList.remove("back");
    if (e.animationName === "tug" || e.animationName === "rattle") lock.classList.remove("tug", "rattle");
  });

  // ---- Sparkles from the open locker ----
  function sparkle() {
    if (reduce) return;
    const r = locker.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height * 0.55;
    const C = ["#ff7a1a", "#ffd76a", "#5fd0ff", "#3fd69a"];
    for (let n = 0; n < 34; n++) {
      const p = document.createElement("i");
      const s = 5 + Math.random() * 6;
      p.style.width = p.style.height = s + "px";
      p.style.background = C[n % 4];
      p.style.borderRadius = n % 2 ? "50%" : "2px";
      $("fx").append(p);
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.8, d = 90 + Math.random() * 110;
      const x1 = x0 + Math.cos(a) * d, y1 = y0 + Math.sin(a) * d;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.3)", opacity: 1 },
        { transform: "translate(" + x1 + "px," + y1 + "px) rotate(220deg) scale(1)", opacity: 1, offset: 0.45 },
        { transform: "translate(" + (x1 + (Math.random() - 0.5) * 50) + "px," + (y1 + 180) + "px) rotate(500deg)", opacity: 0 }
      ], { duration: 1500 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => p.remove();
    }
  }

  // ---- Auto-demo: turn right to 18 (with a full turn), left to 04, right to 27, and open ----
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); gen++; mark(-1); spinning = Promise.resolve(); pending = 0; relock(false); }
  ["pointerdown", "keydown", "touchstart", "wheel"].forEach((t) =>
    window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  async function runDemo() {
    const g = gen;
    round++;
    await pause(500, g);
    const combo = round % 3 === 2 ? [18, 4, 26] : COMBO;
    for (let k = 0; k < 3; k++) {
      grps.forEach((gEl, n) => gEl.classList.toggle("next", n === k));
      await spinTo(combo[k], k === 1 ? -1 : 1, g, k === 0);
      await pause(220, g);
      $("setBtn").classList.add("press");
      setCh(k * 2, two(combo[k])[0]); setCh(k * 2 + 1, two(combo[k])[1]);
      paintGroups();
      restart(pointer, "flash");
      await pause(160, g);
      $("setBtn").classList.remove("press");
      await pause(200, g);
    }
    await tryOpen(g);
    await pause(opened ? 2600 : 900, g);
    if (opened) { relock(true); await pause(900, g); }
    demoTimer = setTimeout(() => quiet(runDemo()), 300);
  }

  setAngle(0);
  paintGroups();
  demoTimer = setTimeout(() => quiet(runDemo()), 250);
})();
</script>
</body>
</html>
