<!doctype html>
<!-- Chill & Craft · Foldfly · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foldfly · Folding send button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --mat: #f4ece1;
    --grid: rgba(120, 84, 50, 0.1);
    --card: #fffdf9;
    --line: #eadfce;
    --ink: #2b211b;
    --muted: #8a7766;
    --them: #f1e7da;
    --me: #ff6b4a;
    --coral: #ff6b4a;
    --focus: #2b211b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --mat: #1b1a20;
    --grid: rgba(255, 255, 255, 0.05);
    --card: #26242c;
    --line: #36333d;
    --ink: #f3ece6;
    --muted: #a59a92;
    --them: #34313b;
    --me: #ff6b4a;
    --coral: #ff7a5c;
    --focus: #ffd2c4;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--mat);
  }

  /* Cutting-mat stage: a soft grid drawn with two gradients */
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow: hidden;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center;
  }

  /* ---------- Composer card ---------- */
  .card {
    position: relative;
    width: min(400px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px 18px 16px;
    box-shadow: 0 24px 50px -28px rgba(70, 40, 20, 0.45);
  }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #ffd166; color: #5a3c00; font-weight: 700; font-size: 0.85rem; }
  .who strong { display: block; font-size: 0.98rem; }
  .who span { color: var(--muted); font-size: 0.8rem; }

  .thread { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; min-height: 118px; align-content: end; }
  .bubble { max-width: 80%; padding: 9px 13px; border-radius: 16px; font-size: 0.92rem; line-height: 1.35; overflow-wrap: anywhere; }
  .bubble.them { background: var(--them); border-bottom-left-radius: 5px; justify-self: start; }
  .bubble.me { background: var(--me); color: #fff; border-bottom-right-radius: 5px; justify-self: end; transform-origin: 100% 100%; }
  .receipt { justify-self: end; margin-top: -2px; font-size: 0.72rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .receipt svg { width: 14px; height: 14px; }
  .receipt path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw 0.4s ease 0.35s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .typing { justify-self: start; display: inline-flex; gap: 4px; padding: 11px 14px; border-radius: 16px; border-bottom-left-radius: 5px; background: var(--them); }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dot 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 0%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }

  label.field { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 74px;
    resize: none;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: transparent;
  }
  textarea:focus-visible { outline: none; border-color: var(--coral); box-shadow: 0 0 0 4px color-mix(in srgb, var(--coral) 22%, transparent); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .count { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { margin: 10px 0 0; min-height: 1.3em; font-size: 0.85rem; color: var(--muted); }

  /* Ghost of the note that lifts into the button */
  .ghost { position: absolute; left: 0; top: 0; max-width: 260px; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--coral) 16%, var(--card)); color: var(--ink); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 6; }
  .bit { position: absolute; left: 0; top: 0; width: 8px; height: 5px; border-radius: 1px; pointer-events: none; z-index: 7; }

  /* ---------- Foldfly button: an SVG sheet that folds into a dart ---------- */
  .fold {
    position: relative;
    flex: none;
    width: 168px;
    height: 52px;
    padding: 0;
    border: 0;
    background: none;
    border-radius: 14px;
    cursor: pointer;
    overflow: visible;
    perspective: 420px;
    transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .fold:hover { transform: translateY(-3px) rotate(-1deg); }
  .fold:active { transform: scale(0.95); transition-duration: 0.1s; }
  .fold svg { display: block; width: 168px; height: 52px; overflow: visible; transform-origin: 50% 50%; }
  .fold:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .fold .base { fill: var(--coral); filter: drop-shadow(0 8px 10px rgba(255, 107, 74, 0.35)); transition: opacity 0.12s; }
  .fold .text { fill: #fff; font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.02em; transition: opacity 0.15s; }
  .fold .preview { fill: none; stroke: #fff; stroke-width: 1.2; stroke-dasharray: 3 4; opacity: 0; transition: opacity 0.3s; }
  .fold:hover .preview, .fold:focus-visible .preview { opacity: 0.45; }
  .fold .ear { fill: #ffb29e; opacity: 0; transform-box: fill-box; transform-origin: 100% 0%; transform: scale(0.4); transition: opacity 0.2s, transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .fold:hover .ear, .fold:focus-visible .ear { opacity: 1; transform: none; }
  .fold .crease { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; opacity: 0; }
  .fold[data-state="folding"] .base,
  .fold[data-state="folding"] .text,
  .fold[data-state="folding"] .preview,
  .fold[data-state="folding"] .ear { opacity: 0; }
  .fold[data-state="folding"] { cursor: progress; transform: none; }
  .fold.nudge { animation: nudge 0.42s ease; }
  @keyframes nudge { 20%, 60% { transform: translateX(-6px) rotate(-2deg); } 40%, 80% { transform: translateX(6px) rotate(2deg); } }

  @media (prefers-reduced-motion: reduce) {
    .fold, .fold .ear { transition: none; }
    .fold.nudge, .typing i, .receipt path { animation: none; }
    .receipt path { stroke-dashoffset: 0; }
    .bit, .ghost { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <form class="card" id="card" novalidate>
      <div class="who">
        <span class="avatar" aria-hidden="true">BA</span>
        <div><strong>Bilal Ahmed</strong><span id="presence">Usually replies in a few minutes</span></div>
      </div>

      <ol class="thread" id="thread" aria-label="Messages">
        <li class="bubble them">Free this evening? Let's catch up.</li>
      </ol>

      <label class="field" for="note">Your note</label>
      <textarea id="note" maxlength="120">Chai at 5 near the old campus gate?</textarea>

      <div class="row">
        <span class="count" id="count">35/120</span>
        <button class="fold" id="fold" type="submit" data-state="idle" aria-label="Send note">
          <svg id="sheet" viewBox="-84 -26 168 52" aria-hidden="true">
            <rect class="base" x="-84" y="-26" width="168" height="52" rx="14" />
            <g id="faces"></g>
            <path class="preview" d="M0 -22 V22 M-80 0 H80" />
            <path class="crease" id="crease" d="" />
            <polygon class="ear" points="84,-26 84,-10 68,-26" />
            <text class="text" x="0" y="6" text-anchor="middle">Send note</text>
          </svg>
        </button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Tip: Ctrl + Enter sends too.</p>
    </form>
  </main>

<script>
  // Foldfly: the note lifts into the button, the sheet folds into a dart (rect → square → triangle → dart),
  // gets thrown, lands as a chat bubble with paper confetti, then the button unfolds again.
  (function () {
    var NS = "http://www.w3.org/2000/svg";
    var $ = function (id) { return document.getElementById(id); };
    var form = $("card"), note = $("note"), count = $("count"), btn = $("fold"), sheet = $("sheet");
    var facesLayer = $("faces"), crease = $("crease"), thread = $("thread"), status = $("status"), presence = $("presence");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var busy = false;
    var REPLIES = ["See you there!", "Perfect, I'll bring the samosas.", "Done. Save me a seat.", "Ha, you read my mind."];
    var replyIndex = 0;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }

    // Paper confetti flung from (x, y) inside the card
    function burst(x, y, colors, n, power) {
      for (var i = 0; i < n; i++) {
        var p = document.createElement("i");
        p.className = "bit";
        p.style.background = colors[i % colors.length];
        form.appendChild(p);
        var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
        var s = power * (0.5 + Math.random() * 0.7);
        var vx = Math.cos(a) * s, vy = Math.sin(a) * s;
        var spin = (Math.random() - 0.5) * 900, frames = [];
        for (var k = 0; k <= 12; k++) {
          var t = k / 12, e = 1 - Math.pow(1 - t, 2.2);
          frames.push({
            transform: "translate(" + (x + vx * e + Math.sin(t * 9 + i) * 6).toFixed(1) + "px," + (y + vy * e + 90 * t * t).toFixed(1) + "px) rotate(" + (spin * t).toFixed(0) + "deg) rotateX(" + (t * 720).toFixed(0) + "deg)",
            opacity: t > 0.75 ? (1 - t) / 0.25 : 1
          });
        }
        p.animate(frames, { duration: 900 + Math.random() * 500, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
    }

    // Coral shades for the paper faces
    var C = { base: "#ff6b4a", light: "#ff8c70", dark: "#dc4a2c", deep: "#b5341b", crease: "#ffb6a3" };

    // Key shapes: four faces (f1..f4) with four points each
    var SHAPES = [
      { f1: [[-81, -23], [0, -23], [0, 0], [-81, 0]], f2: [[-81, 0], [0, 0], [0, 23], [-81, 23]],
        f3: [[0, -23], [81, -23], [81, 0], [0, 0]], f4: [[0, 0], [81, 0], [81, 23], [0, 23]],
        fill: { f1: C.base, f2: C.base, f3: C.base, f4: C.base }, edge: 6 },
      { f1: [[-30, -30], [0, -30], [0, 0], [-30, 0]], f2: [[-30, 0], [0, 0], [0, 30], [-30, 30]],
        f3: [[0, -30], [30, -30], [30, 0], [0, 0]], f4: [[0, 0], [30, 0], [30, 30], [0, 30]],
        fill: { f1: C.light, f2: C.base, f3: C.light, f4: C.base }, edge: 4 },
      { f1: [[-34, -30], [40, 0], [40, 0], [-34, 0]], f2: [[-34, 0], [40, 0], [40, 0], [-34, 30]],
        f3: [[-20, -18], [40, 0], [40, 0], [-20, -5]], f4: [[-20, 5], [40, 0], [40, 0], [-20, 18]],
        fill: { f1: C.light, f2: C.dark, f3: C.crease, f4: C.base }, edge: 2.5 },
      { f1: [[-42, -24], [48, 0], [48, 0], [-30, -2]], f2: [[-30, -1], [48, 0], [-20, 15], [-32, 11]],
        f3: [[-36, -14], [48, 0], [48, 0], [-30, -5]], f4: [[-38, 3], [48, 0], [48, 0], [-42, 11]],
        fill: { f1: C.light, f2: C.deep, f3: C.crease, f4: C.dark }, edge: 1.2 }
    ];
    // Fold lines that flash before each fold
    var CREASES = ["M0 -24 V24 M-80 0 H80", "M-30 -30 L30 30 M-30 30 L30 -30", "M-34 0 H40"];
    var ORDER = ["f4", "f2", "f1", "f3"]; // far wing, keel, top wing, highlight
    var faces = {};
    ORDER.forEach(function (id) {
      var p = document.createElementNS(NS, "polygon");
      p.setAttribute("stroke-linejoin", "round");
      facesLayer.appendChild(p);
      faces[id] = p;
    });

    function lerp(a, b, t) { return a + (b - a) * t; }
    function rgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }
    function mix(a, b, t) {
      var x = rgb(a), y = rgb(b);
      return "rgb(" + x.map(function (v, i) { return Math.round(lerp(v, y[i], Math.max(0, Math.min(1, t)))); }).join(",") + ")";
    }
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    // Draw the in-between of shape a and shape b at progress t
    function paint(a, b, t) {
      var A = SHAPES[a], B = SHAPES[b];
      ORDER.forEach(function (id) {
        var pts = A[id].map(function (p, j) { return lerp(p[0], B[id][j][0], t).toFixed(2) + "," + lerp(p[1], B[id][j][1], t).toFixed(2); });
        var col = mix(A.fill[id], B.fill[id], t);
        faces[id].setAttribute("points", pts.join(" "));
        faces[id].setAttribute("fill", col);
        faces[id].setAttribute("stroke", col);
        faces[id].setAttribute("stroke-width", Math.max(0.5, lerp(A.edge, B.edge, t)).toFixed(2));
      });
    }
    paint(0, 0, 0);

    function tween(from, to, ms) {
      return new Promise(function (resolve) {
        var start = performance.now();
        (function frame(now) {
          var t = Math.min(1, (now - start) / ms);
          paint(from, to, ease(t));
          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        })(start);
      });
    }

    // One fold: crease line draws, the sheet tilts in 3D, faces move, then a springy snap
    async function foldStep(i) {
      crease.setAttribute("d", CREASES[i]);
      var len = 200;
      crease.animate([{ strokeDasharray: len, strokeDashoffset: len, opacity: 0.9 }, { strokeDasharray: len, strokeDashoffset: 0, opacity: 0.9, offset: 0.6 }, { strokeDasharray: len, strokeDashoffset: 0, opacity: 0 }], { duration: 260, easing: "ease-out" });
      await wait(140);
      sheet.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(" + (i % 2 ? -32 : 32) + "deg) scale(0.95)", offset: 0.5 }, { transform: "rotateX(0deg)" }], { duration: 300, easing: "ease-in-out" });
      await tween(i, i + 1, 280);
      springTo(sheet, function (p) { return { transform: "scale(" + (1 + Math.sin(p * Math.PI) * 0.08).toFixed(3) + ")" }; }, 300, 14);
      await wait(60);
    }

    // Wind up and throw the dart off the screen
    function throwDart() {
      var r = btn.getBoundingClientRect();
      var dx = window.innerWidth - r.left + 60;
      var dy = -(r.top + 140);
      return sheet.animate([
        { transform: "translate(0, 0) rotate(0deg) scale(1)" },
        { transform: "translate(-22px, 10px) rotate(14deg) scale(1.06)", offset: 0.24 },
        { transform: "translate(" + dx * 0.5 + "px, " + dy * 0.45 + "px) rotate(-16deg) scale(0.85)", offset: 0.62 },
        { transform: "translate(" + dx + "px, " + dy + "px) rotate(-24deg) scale(0.5)", opacity: 0 }
      ], { duration: 860, easing: "cubic-bezier(0.45, 0, 0.3, 1)", fill: "forwards" });
    }

    // The note text lifts off the textarea and shrinks into the button
    function liftGhost(text) {
      var c = form.getBoundingClientRect(), n = note.getBoundingClientRect(), b = btn.getBoundingClientRect();
      var g = document.createElement("span");
      g.className = "ghost";
      g.textContent = text;
      form.appendChild(g);
      var x0 = n.left - c.left + 6, y0 = n.top - c.top + 6;
      var x1 = b.left - c.left + b.width / 2 - 30, y1 = b.top - c.top + b.height / 2 - 12;
      return g.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(1)", opacity: 1 },
        { transform: "translate(" + x0 + "px," + (y0 - 14) + "px) scale(1.05)", opacity: 1, offset: 0.3 },
        { transform: "translate(" + x1 + "px," + y1 + "px) scale(0.2)", opacity: 0 }
      ], { duration: 520, easing: "cubic-bezier(0.5, 0, 0.3, 1)" }).finished.then(function () { g.remove(); });
    }

    function addBubble(text, who) {
      var li = document.createElement("li");
      li.className = "bubble " + who;
      li.textContent = text;
      thread.appendChild(li);
      if (!calm.matches) springTo(li, function (p) { return { transform: "translateY(" + ((1 - p) * 16).toFixed(1) + "px) scale(" + (0.6 + 0.4 * p).toFixed(3) + ")", opacity: Math.min(1, p * 1.6) }; }, 280, 15);
      trim();
      return li;
    }
    function addReceipt() {
      var li = document.createElement("li");
      li.className = "receipt";
      li.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5l4 4L15 8.5M10 16.5l1 0.8L21 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>Delivered';
      thread.appendChild(li);
      trim();
      return li;
    }
    function trim() { while (thread.children.length > 4) thread.removeChild(thread.firstElementChild); }

    // Fake reply: typing dots, then a bubble from Bilal
    async function reply() {
      await wait(calm.matches ? 300 : 700);
      presence.textContent = "typing…";
      var t = document.createElement("li");
      t.className = "typing";
      t.setAttribute("aria-label", "Bilal is typing");
      t.innerHTML = "<i></i><i></i><i></i>";
      thread.appendChild(t);
      trim();
      await wait(1300);
      t.remove();
      presence.textContent = "Online";
      addBubble(REPLIES[replyIndex++ % REPLIES.length], "them");
      status.textContent = "Bilal replied. Write another one?";
    }

    async function send(text) {
      busy = true;
      btn.setAttribute("aria-disabled", "true");
      status.textContent = "Folding your note…";

      if (calm.matches) {
        btn.dataset.state = "folding";
        paint(0, 0, 0);
        await wait(400);
        addBubble(text, "me");
        addReceipt();
        finishInput();
        btn.dataset.state = "idle";
        status.textContent = "Sent to Bilal.";
        btn.removeAttribute("aria-disabled");
        busy = false;
        return reply();
      }

      // 1. Anticipation: the note lifts out of the box while the button squashes
      btn.dataset.state = "folding";
      sheet.animate([{ transform: "scale(1)" }, { transform: "scale(1.06, 0.88)" }, { transform: "scale(1)" }], { duration: 380, easing: "cubic-bezier(0.3, 0, 0.3, 1)" });
      await liftGhost(text);
      note.value = "";
      updateCount();

      // 2. Three folds with creases and springy snaps
      for (var i = 0; i < 3; i++) await foldStep(i);

      // 3. Throw
      status.textContent = "Off it goes…";
      await wait(90);
      var flight = throwDart();
      await flight.finished;

      // 4. Landing: bubble, receipt and paper confetti
      var li = addBubble(text, "me");
      addReceipt();
      status.textContent = "Sent to Bilal.";
      var c = form.getBoundingClientRect(), b = li.getBoundingClientRect();
      burst(b.left - c.left + b.width * 0.7, b.top - c.top + 4, ["#ff6b4a", "#ffd166", "#ffb6a3", "#7bd3c4"], 20, 80);

      // 5. Reset: the dart springs back to the button spot and unfolds
      flight.cancel();
      paint(3, 3, 1);
      springTo(sheet, function (p) { return { transform: "scale(" + (0.2 + 0.8 * p).toFixed(3) + ") rotate(" + ((1 - p) * -90).toFixed(1) + "deg)", opacity: Math.min(1, p * 2) }; }, 220, 14);
      await wait(260);
      await tween(3, 2, 130);
      await tween(2, 1, 130);
      await tween(1, 0, 160);
      btn.dataset.state = "idle";
      springTo(sheet, function (p) { return { transform: "scale(" + (1.1 - 0.1 * p).toFixed(3) + ", " + (0.9 + 0.1 * p).toFixed(3) + ")" }; }, 300, 10);
      btn.removeAttribute("aria-disabled");
      busy = false;
      reply();
    }

    function finishInput() { note.value = ""; updateCount(); }
    function updateCount() { count.textContent = note.value.length + "/120"; }
    note.addEventListener("input", updateCount);
    note.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (form.requestSubmit) form.requestSubmit(btn); else btn.click(); }
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var text = note.value.trim();
      if (!text) {
        status.textContent = "Write a short note first.";
        btn.classList.remove("nudge");
        void btn.offsetWidth;
        btn.classList.add("nudge");
        note.focus();
        return;
      }
      send(text);
    });
  })();
</script>
</body>
</html>
