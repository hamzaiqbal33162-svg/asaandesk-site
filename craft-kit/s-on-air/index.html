<!doctype html>
<!-- Chill & Craft · On Air · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>On Air · Go live button with a neon sign</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #fbedf0;
    --card: #ffffff;
    --ink: #2b0f22;
    --muted: #8b6577;
    --line: rgba(43, 15, 34, 0.1);
    --tile: #fbf3f5;
    --neon: #ff2e63;
    --neon-soft: #ff7a9a;
    --plate: #1b0a16;
    --tube: #4a2033;
    --ok: #18a576;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #120810;
    --card: #1d0f1a;
    --ink: #fbe8ef;
    --muted: #b48ea0;
    --line: rgba(251, 232, 239, 0.1);
    --tile: #281523;
    --neon: #ff2e63;
    --neon-soft: #ff7a9a;
    --plate: #0d040b;
    --tube: #4a2033;
    --ok: #2bd09a;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Stage: studio wall, a red wash rolls in while live ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; }
  .stage::before { content: ""; position: absolute; inset: 0; z-index: -2; background: repeating-linear-gradient(90deg, transparent 0 46px, var(--line) 46px 47px), repeating-linear-gradient(0deg, transparent 0 23px, var(--line) 23px 24px); -webkit-mask: radial-gradient(70% 70% at 50% 40%, rgba(0, 0, 0, 0.55), transparent); mask: radial-gradient(70% 70% at 50% 40%, rgba(0, 0, 0, 0.55), transparent); }
  .stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(55% 45% at 50% 30%, rgba(255, 46, 99, 0.28), transparent 70%); opacity: 0; transition: opacity 1.2s ease; }
  .stage.live::after { opacity: 1; }

  /* ---------- Console card ---------- */
  .console { position: relative; width: min(420px, 100%); padding: 18px 18px 20px; border-radius: 26px; background: var(--card); box-shadow: 0 40px 70px -40px rgba(80, 10, 50, 0.55), 0 0 0 1px var(--line); animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }

  /* Neon sign on a dark plate */
  .sign { position: relative; height: 132px; border-radius: 18px; background: radial-gradient(120% 90% at 50% 0%, #2a1022, var(--plate)); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 18px 30px -22px #000; transition: box-shadow 0.8s ease; }
  .sign::before, .sign::after { content: ""; position: absolute; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8d7783, #3a2531); }
  .sign::before { left: 10px; }
  .sign::after { right: 10px; }
  .sign.on { box-shadow: inset 0 0 0 1px rgba(255, 120, 150, 0.25), inset 0 0 50px rgba(255, 46, 99, 0.22), 0 0 70px -14px var(--neon); }
  .word { position: relative; display: flex; gap: 0.08em; font-weight: 900; font-size: clamp(2.6rem, 12vw, 3.6rem); letter-spacing: 0.04em; line-height: 1; transition: opacity 0.3s; }
  .ch { position: relative; display: inline-block; color: rgba(255, 255, 255, 0.04); -webkit-text-stroke: 2px var(--tube); }
  .ch.sp { width: 0.32em; }
  .ch::after { content: attr(data-c); position: absolute; left: 0; top: 0; color: #fff3f6; -webkit-text-stroke: 2px var(--neon-soft); text-shadow: 0 0 4px #fff, 0 0 10px var(--neon), 0 0 24px var(--neon), 0 0 48px var(--neon), 0 0 90px rgba(255, 46, 99, 0.7); opacity: 0; }
  .sign.on .ch::after { opacity: 1; animation: flickOn 1s linear both; animation-delay: calc(var(--i) * 120ms); }
  .sign.on .ch:nth-child(5)::after { animation: flickOn 1s linear both 0.48s, hum 6s linear 2s infinite; }
  .sign.dying .ch::after { opacity: 0; animation: flickOff 0.7s linear both; animation-delay: calc(var(--i) * 60ms); }
  .sign:not(.on):not(.dying) .ch:nth-child(2)::after { animation: standby 7s linear infinite; }
  @keyframes flickOn { 0% { opacity: 0; } 8% { opacity: 0.9; } 12% { opacity: 0.1; } 26% { opacity: 1; } 30% { opacity: 0.2; } 44% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes flickOff { 0% { opacity: 1; } 20% { opacity: 0.2; } 30% { opacity: 0.8; } 45% { opacity: 0; } 55% { opacity: 0.35; } 100% { opacity: 0; } }
  @keyframes hum { 0%, 91%, 100% { opacity: 1; } 92% { opacity: 0.25; } 94% { opacity: 1; } 95% { opacity: 0.4; } }
  @keyframes standby { 0%, 88%, 100% { opacity: 0; } 90% { opacity: 0.18; } 92% { opacity: 0; } 94% { opacity: 0.12; } }
  .sign.counting .word { opacity: 0.25; }
  .wave { position: absolute; inset: 0; border-radius: 18px; border: 2px solid var(--neon); opacity: 0; pointer-events: none; }
  .sign.on .wave { animation: wave 2.6s ease-out infinite; }
  .sign.on .wave:nth-of-type(2) { animation-delay: 0.85s; }
  .sign.on .wave:nth-of-type(3) { animation-delay: 1.7s; }
  @keyframes wave { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.1, 1.28); opacity: 0; } }
  .num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 4.2rem; color: #fff; text-shadow: 0 0 22px rgba(255, 46, 99, 0.9); pointer-events: none; }
  .rec { position: absolute; left: 14px; bottom: 11px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; color: #8f6f80; }
  .rec i { width: 8px; height: 8px; border-radius: 50%; background: #5a3446; transition: background 0.3s, box-shadow 0.3s; }
  .sign.on .rec { color: #ffd1dc; }
  .sign.on .rec i { background: var(--neon); box-shadow: 0 0 10px var(--neon); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .clock { position: absolute; right: 14px; bottom: 10px; font: 700 0.78rem ui-monospace, Menlo, Consolas, monospace; color: #8f6f80; font-variant-numeric: tabular-nums; }
  .sign.on .clock { color: #ffd1dc; }

  /* Episode */
  .info { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin: 16px 2px 14px; }
  .info .txt { flex: 1; min-width: 0; }
  .kicker { margin: 0; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--neon); }
  .info h1 { margin: 2px 0 0; font-size: 1.15rem; line-height: 1.25; }
  .hosts { display: flex; }
  .hosts span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; font-weight: 800; color: #fff; border: 2.5px solid var(--card); }
  .hosts span + span { margin-left: -10px; }
  .h1c { background: linear-gradient(135deg, #2dd4bf, #0f766e); }
  .h2c { background: linear-gradient(135deg, #fbbf24, #ea580c); }

  /* Stats */
  .stats { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
  .tile { padding: 10px 12px; border-radius: 14px; background: var(--tile); min-width: 0; }
  .tile small { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
  .tile b { display: block; margin-top: 2px; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .meter { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin-top: 4px; }
  .meter i { flex: 1; height: 12%; border-radius: 2px; background: linear-gradient(to top, #18a576, #f6c445 70%, var(--neon)); transition: height 0.12s ease-out; }

  /* Go live button with a countdown ring */
  .actions { position: relative; z-index: 1; margin-top: 16px; }
  .go {
    position: relative;
    width: 100%;
    height: 58px;
    border: 0;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--ink);
    color: var(--card);
    font: inherit;
    font-weight: 800;
    font-size: 1.02rem;
    cursor: pointer;
    transition: background 0.4s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.4s;
    -webkit-tap-highlight-color: transparent;
  }
  .go:hover { transform: translateY(-2px); }
  .go:active { transform: scale(0.97); }
  .go:focus-visible { outline: 3px solid var(--neon); outline-offset: 4px; }
  .go .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.6); animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 7px rgba(255, 46, 99, 0); transform: scale(0.85); } }
  .go.live { background: var(--neon); color: #fff; box-shadow: 0 16px 30px -14px var(--neon); }
  .go.live .dot { background: #fff; }
  .go .lab { display: block; height: 1.3em; line-height: 1.3; overflow: hidden; }
  .go .lab span { display: block; }
  .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); pointer-events: none; overflow: visible; }
  .ring rect { x: 2px; y: 2px; width: calc(100% - 4px); height: calc(100% - 4px); rx: 33px; fill: none; stroke: var(--neon); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 0; opacity: 0; transition: opacity 0.3s; }
  .ring.show rect { opacity: 1; }

  /* Floating reactions + summary */
  .floats { position: absolute; z-index: 2; right: -30px; bottom: 110px; width: 60px; height: 260px; pointer-events: none; overflow: visible; }
  .fl { position: absolute; left: 20px; bottom: 0; width: 26px; height: 26px; }
  .summary { position: absolute; left: 50%; top: 50%; z-index: 4; display: grid; justify-items: center; gap: 4px; width: min(270px, calc(100% - 40px)); padding: 16px 18px; border-radius: 20px; background: var(--card); box-shadow: 0 26px 50px -20px rgba(40, 0, 25, 0.6), 0 0 0 1px var(--line); text-align: center; transform: translate(-50%, -40%) scale(0.85); opacity: 0; pointer-events: none; transition: transform 0.55s cubic-bezier(0.3, 1.5, 0.4, 1), opacity 0.25s; }
  .summary.show { transform: translate(-50%, -50%); opacity: 1; }
  .summary .ok { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; }
  .summary .ok svg { width: 22px; height: 22px; }
  .summary strong { font-size: 1rem; }
  .summary span { font-size: 0.82rem; color: var(--muted); }
  .spark { position: fixed; z-index: 40; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; }

  @media (max-width: 400px) {
    .console { padding: 14px 14px 16px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .tile.lvl { grid-column: span 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    .console, .go .dot, .sign.on .ch::after, .sign.dying .ch::after, .sign:not(.on):not(.dying) .ch:nth-child(2)::after, .sign.on .wave, .sign.on .rec i, .sign.on .ch:nth-child(5)::after { animation: none; }
    .summary, .go, .meter i, .stage::after { transition-duration: 0.01s; }
    .floats, .spark { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <section class="console" aria-labelledby="ep">
      <div class="sign" id="sign" aria-hidden="true">
        <span class="wave"></span><span class="wave"></span><span class="wave"></span>
        <div class="word" id="word"></div>
        <span class="num" id="num"></span>
        <span class="rec"><i></i>REC</span>
        <span class="clock" id="clock">00:00</span>
      </div>

      <div class="info">
        <div class="txt">
          <p class="kicker">Episode 42 · Podcast</p>
          <h1 id="ep">Small shops, big dreams</h1>
        </div>
        <div class="hosts" aria-label="Hosted by Saad and Mahnoor"><span class="h1c">SA</span><span class="h2c">MN</span></div>
      </div>

      <div class="stats">
        <div class="tile"><small>Listening</small><b id="listeners">0</b></div>
        <div class="tile"><small>Live time</small><b id="time">00:00</b></div>
        <div class="tile lvl"><small>Mic level</small><div class="meter" id="meter" aria-hidden="true"></div></div>
      </div>

      <div class="actions">
        <button class="go" id="go" type="button">
          <span class="dot" aria-hidden="true"></span>
          <span class="lab" id="lab"><span>Go live</span></span>
        </button>
        <svg class="ring" id="ring" aria-hidden="true"><rect pathLength="1" /></svg>
      </div>

      <div class="floats" id="floats" aria-hidden="true"></div>
      <div class="summary" id="summary" role="status">
        <span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span>
        <strong>Stream saved</strong>
        <span id="sumText">00:00 live · peak 0 listening</span>
      </div>
    </section>
    <p class="sr-only" id="status" aria-live="assertive"></p>
  </main>

<script>
  // ---------- On Air: go-live button with countdown, neon sign, live stats and a saved summary ----------
  const $ = (s) => document.querySelector(s);
  const stage = $("#stage");
  const sign = $("#sign");
  const word = $("#word");
  const num = $("#num");
  const clock = $("#clock");
  const go = $("#go");
  const lab = $("#lab");
  const ring = $("#ring");
  const ringRect = ring.querySelector("rect");
  const meter = $("#meter");
  const listenersEl = $("#listeners");
  const timeEl = $("#time");
  const floats = $("#floats");
  const summary = $("#summary");
  const sumText = $("#sumText");
  const status = $("#status");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { status.textContent = t; };
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

  // Build the neon letters and the meter bars
  "ON AIR".split("").forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch" + (c === " " ? " sp" : "");
    s.textContent = c === " " ? "" : c;
    s.dataset.c = c === " " ? "" : c;
    s.style.setProperty("--i", i);
    word.appendChild(s);
  });
  const bars = [];
  for (let i = 0; i < 12; i++) { const b = document.createElement("i"); meter.appendChild(b); bars.push(b); }

  // Rolling button label
  function roll(text) {
    while (lab.children.length > 1) lab.firstElementChild.remove();
    const old = lab.firstElementChild;
    const n = document.createElement("span");
    n.textContent = text;
    lab.appendChild(n);
    if (calm() || !old || !old.animate) { if (old) old.remove(); return; }
    n.style.transform = old.style.transform = "translateY(-100%)";
    Promise.all([
      play(old, [{ transform: "none", opacity: 1 }, { transform: "translateY(-100%)", opacity: 0 }], { duration: 200, easing: "ease-in", fill: "forwards" }),
      play(n, [{ transform: "translateY(0)", opacity: 0 }, { transform: "translateY(-100%)", opacity: 1 }], { duration: 440, easing: "cubic-bezier(.3,1.6,.5,1)" })
    ]).then(() => { old.remove(); n.style.transform = ""; });
  }

  // ---------- State machine: idle → count → live → ending → idle ----------
  let state = "idle";
  let token = 0;
  let loops = [];
  let started = 0;
  let listeners = 0;
  let peak = 0;
  // One countdown step: a real second for people, a quicker beat for the auto-demo
  let TICK = 1000;

  go.addEventListener("click", () => {
    if (state === "idle") start();
    else if (state === "count") cancel();
    else if (state === "live") end();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state === "count") cancel(); });

  async function start() {
    const my = ++token;
    state = "count";
    TICK = demoOn ? 650 : 1000;
    // 1. Anticipation: the button squashes and the dot shrinks before the count begins
    await play(go, [{ transform: "scale(1)" }, { transform: "scale(.94, .88)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
    if (my !== token) return;
    roll("Cancel");
    sign.classList.add("counting");
    ring.classList.add("show");
    ringRect.style.transition = "none";
    ringRect.style.strokeDashoffset = "0";
    ringRect.getBoundingClientRect();
    ringRect.style.transition = "stroke-dashoffset " + TICK * 3 + "ms linear, opacity .3s";
    ringRect.style.strokeDashoffset = "1";
    // 2. Countdown: big numbers punch in on the plate
    for (let n = 3; n >= 1; n--) {
      if (my !== token) return;
      num.textContent = n;
      say("Going live in " + n);
      play(num, [{ transform: "scale(1.9)", opacity: 0, filter: "blur(6px)" }, { transform: "scale(.92)", opacity: 1, filter: "blur(0)", offset: 0.35 }, { transform: "scale(1)", opacity: 1, offset: 0.75 }, { transform: "scale(.7)", opacity: 0 }], { duration: TICK, easing: "ease-out" });
      await wait(TICK);
    }
    if (my !== token) return;
    goLive();
  }

  function cancel() {
    token++;
    state = "idle";
    num.textContent = "";
    sign.classList.remove("counting");
    ring.classList.remove("show");
    roll("Go live");
    say("Countdown cancelled");
  }

  // 3. Live: the sign flickers on, waves roll out, stats come alive
  function goLive() {
    state = "live";
    num.textContent = "";
    sign.classList.remove("counting");
    sign.classList.add("on");
    stage.classList.add("live");
    ring.classList.remove("show");
    go.classList.add("live");
    roll("End stream");
    say("You are live");
    play(sign, [{ transform: "scale(1)" }, { transform: "scale(1.03)" }, { transform: "scale(.99)" }, { transform: "scale(1)" }], { duration: 600, delay: 150, easing: "ease-out" });
    started = Date.now();
    listeners = 0;
    peak = 0;
    loops.push(setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000);
      timeEl.textContent = clock.textContent = mmss(s);
    }, 250));
    loops.push(setInterval(() => {
      bars.forEach((b, i) => {
        const v = 0.18 + Math.random() * 0.55 + Math.sin(Date.now() / 260 + i) * 0.2;
        b.style.height = Math.max(8, Math.min(100, v * 100)) + "%";
      });
    }, calm() ? 400 : 110));
    (function grow() {
      const t = setTimeout(() => {
        if (state !== "live") return;
        const add = listeners < 40 ? 3 + Math.floor(Math.random() * 7) : Math.floor(Math.random() * 6) - 1;
        listeners = Math.max(0, listeners + add);
        peak = Math.max(peak, listeners);
        listenersEl.textContent = listeners;
        play(listenersEl, [{ transform: "translateY(-3px) scale(1.15)", color: "#ff2e63" }, { transform: "none" }], { duration: 380, easing: "ease-out" });
        grow();
      }, 260 + Math.random() * 380);
      loops.push(t);
    })();
    (function react() {
      const t = setTimeout(() => {
        if (state !== "live") return;
        floatUp();
        react();
      }, 260 + Math.random() * 520);
      loops.push(t);
    })();
  }

  // A heart, star or clap floats up from the side and sways
  const REACTS = [
    '<svg viewBox="0 0 24 24"><path fill="#ff2e63" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21Z"/></svg>',
    '<svg viewBox="0 0 24 24"><path fill="#f6c445" d="m12 2 2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7Z"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#18a576"/><path d="M8 12.5h8M12 8.5v8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>',
    '<svg viewBox="0 0 24 24"><path fill="#ff7a9a" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21Z"/></svg>'
  ];
  function floatUp() {
    if (calm()) return;
    const f = document.createElement("span");
    f.className = "fl";
    f.innerHTML = REACTS[Math.floor(Math.random() * REACTS.length)];
    floats.appendChild(f);
    const sway = 14 + Math.random() * 16;
    const dir = Math.random() < 0.5 ? -1 : 1;
    f.animate([
      { transform: "translate(0,0) scale(.3)", opacity: 0 },
      { transform: "translate(" + dir * sway + "px,-50px) scale(1.1)", opacity: 1, offset: 0.2 },
      { transform: "translate(" + -dir * sway + "px,-130px) scale(1) rotate(" + dir * 12 + "deg)", opacity: 1, offset: 0.55 },
      { transform: "translate(" + dir * sway * 0.6 + "px,-240px) scale(.8) rotate(" + -dir * 8 + "deg)", opacity: 0 }
    ], { duration: 2200 + Math.random() * 900, easing: "cubic-bezier(.3,.6,.4,1)" }).onfinish = () => f.remove();
  }

  // 4. End: the sign flickers off, a saved summary pops with sparks, then everything resets
  async function end() {
    const my = ++token;
    state = "ending";
    loops.forEach((t) => { clearInterval(t); clearTimeout(t); });
    loops = [];
    const secs = Math.max(1, Math.floor((Date.now() - started) / 1000));
    play(go, [{ transform: "scale(1)" }, { transform: "scale(.95)" }, { transform: "scale(1)" }], { duration: 260 });
    sign.classList.remove("on");
    sign.classList.add("dying");
    stage.classList.remove("live");
    go.classList.remove("live");
    roll("Saving…");
    say("Stream ended. Saving.");
    bars.forEach((b) => { b.style.height = "12%"; });
    await wait(800);
    if (my !== token) return;
    sign.classList.remove("dying");
    sumText.textContent = mmss(secs) + " live · peak " + peak + " listening";
    summary.classList.add("show");
    say("Stream saved. " + mmss(secs) + " live, peak " + peak + " listening.");
    const r = summary.getBoundingClientRect();
    sparks(r.left + r.width / 2, r.top + 30);
    roll("Saved");
    await wait(2600);
    if (my !== token) return;
    summary.classList.remove("show");
    listenersEl.textContent = "0";
    timeEl.textContent = clock.textContent = "00:00";
    roll("Go live");
    state = "idle";
    if (demoOn) queueDemo(2200);
  }

  function sparks(x, y) {
    if (calm()) return;
    const cols = ["#ff2e63", "#f6c445", "#18a576", "#ff7a9a", "#ffffff"];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.left = x - 3.5 + "px";
      s.style.top = y - 3.5 + "px";
      s.style.background = cols[i % cols.length];
      if (i % 2) s.style.borderRadius = "1px";
      document.body.appendChild(s);
      const a = (i / 22) * Math.PI * 2;
      const d = 50 + Math.random() * 60;
      s.animate([
        { transform: "translate(0,0) scale(1.2)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) scale(1) rotate(180deg)", opacity: 1, offset: 0.6 },
        { transform: "translate(" + Math.cos(a) * d * 1.15 + "px," + (Math.sin(a) * d + 30) + "px) scale(.3)", opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // Idle: the meter breathes softly so the card never looks frozen
  setInterval(() => {
    if (state === "live") return;
    bars.forEach((b, i) => { b.style.height = 10 + Math.max(0, Math.sin(Date.now() / 600 + i * 0.7)) * 14 + "%"; });
  }, 300);

  // ---------- Auto-demo: count down, go live for a few seconds, end; repeats while idle ----------
  let demoOn = true;
  let demoTimer = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demoOn || state !== "idle") return;
    start();
    await wait(TICK * 3 + 340 + 5200);
    if (demoOn && state === "live") end();
  }
  queueDemo(260);
</script>
</body>
</html>
