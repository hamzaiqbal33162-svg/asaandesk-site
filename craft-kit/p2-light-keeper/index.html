<title>Light Keeper · guide the boats home with a lighthouse beam</title>
<script>

<style>

</main>

  }
  function drawBoat(b, t) {
    var c = boatScreen(b), s = c.s, bob = reduce.matches ? 0 : Math.sin(t * 2 + b.ph) * s * 0.06, tilt = reduce.matches ? 0 : Math.sin(t * 1.6 + b.ph) * 0.06;

    ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fillRect(-s * 0.5, -s * 0.19, s * 1.04, s * 0.03);
    ctx.fillStyle = "#e9e4d8"; ctx.fillRect(-s * 0.32, -s * 0.36, s * 0.3, s * 0.18);
    ctx.fillStyle = "#ffcf73"; ctx.fillRect(-s * 0.27, -s * 0.32, s * 0.08, s * 0.07);
    ctx.strokeStyle = "#2a2a30"; ctx.lineWidth = Math.max(0.6, s * 0.025); ctx.beginPath(); ctx.moveTo(s * 0.12, -s * 0.19); ctx.lineTo(s * 0.12, -s * 0.62); ctx.stroke();

    ctx.fillStyle = "#fff0c0"; ctx.beginPath(); ctx.arc(lx, ly, Math.max(0.8, s * 0.035), 0, TAU); ctx.fill();
    if (!lost) { ctx.globalAlpha = b.fade * 0.9; var gg = Math.max(6, s * 0.4); ctx.drawImage(greenS, c.x - dir * s * 0.45 - gg / 2, c.y + bob - s * 0.2 - gg / 2, gg, gg); }
    if (b.ping > 0) { ctx.globalAlpha = b.ping; ctx.strokeStyle = "#fff3c4"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(c.x, c.y - s * 0.3, s * 0.4 + (1 - b.ping) * 30, 0, TAU); ctx.stroke(); }

      ctx.fillStyle = "#142036"; ctx.font = "800 9px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText("TOOT!", c.x, yy + 0.5); ctx.globalAlpha = 1;

  /* ---------- 6. Particles, foghorn rings and fog ---------- */
  var parts = [], rings = [], fog = 0, fogOn = false;
  function burst(x, y, n, col) {
    if (reduce.matches) n = Math.ceil(n / 3);
    for (var j = 0; j < n; j++) { var a = rnd(0, TAU), v = rnd(30, 110); parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: rnd(0.6, 1.2), c: col || ["#ffe08a", "#ffffff", "#9ff0c8", "#ffb3c1"][j % 4], g: 90 }); }
  }
  function splash(x, y, n) { if (reduce.matches) n = Math.ceil(n / 3); for (var j = 0; j < n; j++) parts.push({ x: x + rnd(-6, 6), y: y, vx: rnd(-50, 50), vy: -rnd(40, 120), life: rnd(0.5, 1), c: "rgba(235,245,255,0.9)", g: 260 }); }
  var audio = null;
  function hornSound() {

      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;

  }
  function foghorn(withSound) {
    if (withSound) hornSound();
    rings.push({ r: 4, life: 1 }); setTimeout(function () { rings.push({ r: 4, life: 1 }); }, 420);
    var lost = boats.filter(function (b) { return b.mode === "lost"; }).length;
    say(lost ? "Foghorn! Lost boats steer away from the rocks." : "Foghorn sounds across the bay.");
  }

  /* ---------- 7. Drawing the night ---------- */
  function draw(t, I) {
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    var sg = ctx.createLinearGradient(0, 0, 0, HZ); sg.addColorStop(0, P.sky[0]); sg.addColorStop(0.6, P.sky[1]); sg.addColorStop(1, P.sky[2]);
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, HZ + 1);
    var j;
    for (j = 0; j < stars.length; j++) { var st = stars[j]; ctx.globalAlpha = P.stars * (0.45 + 0.45 * Math.sin(t * 1.4 + st.ph)) * (1 - fog * 0.7); ctx.fillStyle = "#fff"; ctx.fillRect(st.x, st.y, st.r, st.r); }

    // the moon in tonight's phase
    var mx = 306, my = 88, mr = 17;
    ctx.globalAlpha = 0.5; ctx.drawImage(white, mx - 60, my - 60, 120, 120); ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();

  /* ---------- 8. Main loop ---------- */
  var last = performance.now(), spawnT = 0.6, foamT = 0;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;

  /* ---------- 9. Input: drag to aim, keys, buttons and the speed slider ---------- */
  var dragging = false;
  function aimAt(e) {
    var rc = scene.getBoundingClientRect(), x = (e.clientX - rc.left) / rc.width * W, y = (e.clientY - rc.top) / rc.height * H;

  $("speed").addEventListener("input", function (e) {
    period = 15 - e.target.value * 1.2;

  /* ---------- 10. Auto demo until the visitor takes over ---------- */

  function demoAim(x, y) { var q = seaPoint(x, y), hx = q.X - LX, hz = q.Z - LZ; lamp.aimPhi = Math.atan2(hz, hx); lamp.aimTau = Math.atan2(LY, Math.hypot(hx, hz)); if (!lamp.manual) { lamp.manual = true; } lamp.manualUntil = performance.now() / 1000 + 1.2; }
  function demo() {
    if (!demoOn) return;
    at(400, function () { spawnBoat(300); spawnBoat(220); });
    at(3800, function () {
      // sweep the beam by hand towards the nearest lost boat
      var lost = boats.filter(function (b) { return b.mode === "lost"; })[0];
      if (!lost) return;
      var n = 0, iv = setInterval(function () {
        if (!demoOn || n++ > 22 || lost.mode !== "lost") { clearInterval(iv); return; }
        var c = boatScreen(lost); demoAim(c.x, c.y);

    at(8000, function () { fogOn = true; $("fog").setAttribute("aria-pressed", "true"); say("Fog rolls in. The beam glows through it."); });

    at(18000, demo);
  }
  function stopDemo(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false; timers.forEach(function (x) { clearTimeout(x); clearInterval(x); });
  }
  ["pointerdown", "keydown", "wheel"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });

  $("tally").textContent = "Saved 0 · " + phaseName;
  lamp.level = 0; ignite(true);
  requestAnimationFrame(frame);
  demo();
})();
