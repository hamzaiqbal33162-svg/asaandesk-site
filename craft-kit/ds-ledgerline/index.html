<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossfoot · Books for a small workshop</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* =====================================================================
     Crossfoot: small-business accounting on ruled paper.
     Paper white, ink navy and one signal orange. Light theme = a clean
     ledger page; dark theme = the same page in deep ink.
     ===================================================================== */
  :root {
    --paper: #f8f7f3; --sheet: #ffffff; --band: #edf0f5; --rule: rgba(29,45,80,.065); --margin: rgba(238,90,36,.32);
    --ink: #15213a; --ink-2: #2b3a5c; --muted: #5f697e; --faint: #8b94a7;
    --line: #e1e4ea; --line-2: #eceef2; --chip: #f1f2f5; --hover: #f4f5f8;
    --navy: #1b2c55; --navy-2: #4a63a3; --navy-3: #dfe5f3;
    --accent: #ec5a24; --accent-soft: #fde7dd; --accent-ink: #fff;
    --good: #2c8a5f; --good-soft: #dff1e7; --bad: #d2412c; --warn: #ec5a24;
    --btn: #15213a; --btn-ink: #ffffff;
    --river-a: #1b2c55; --river-b: #35508f; --ripple: rgba(255,255,255,.42);
    --shadow: 0 1px 2px rgba(21,33,58,.05), 0 10px 26px -18px rgba(21,33,58,.22);
    --shadow-lift: 0 2px 4px rgba(21,33,58,.06), 0 18px 34px -18px rgba(21,33,58,.32);
    --tip-bg: #15213a; --tip-ink: #fff; --overlay: rgba(15,22,40,.36);
    --radius: 12px; --radius-sm: 9px;
    --side-w: clamp(216px, 16.6vw, 244px);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #0b1120; --sheet: #111a2d; --band: #0f182d; --rule: rgba(255,255,255,.032); --margin: rgba(255,107,53,.3);
    --ink: #e8ecf4; --ink-2: #c6cee0; --muted: #98a3bb; --faint: #8592ad;
    --line: #222d45; --line-2: #1a243a; --chip: #18223a; --hover: #16203a;
    --navy: #93abeb; --navy-2: #6582cc; --navy-3: #1d2a4b;
    --accent: #ff6b35; --accent-soft: rgba(255,107,53,.15); --accent-ink: #1b0b03;
    --good: #4cc08a; --good-soft: rgba(76,192,138,.14); --bad: #ff6b5a; --warn: #ff6b35;
    --btn: #e8ecf4; --btn-ink: #0b1120;
    --river-a: #2f4c95; --river-b: #5677cc; --ripple: rgba(255,255,255,.38);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 20px 36px -18px rgba(0,0,0,.75);
    --tip-bg: #e8ecf4; --tip-ink: #0b1120; --overlay: rgba(0,0,0,.55);
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; overflow-x: clip; min-height: 100vh; background: var(--paper); color: var(--ink);
    font: 13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p { margin: 0; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: .94em; letter-spacing: -.01em; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .grow { flex: 1; }
  .row { display: flex; align-items: center; gap: 8px; }
  .wrap { flex-wrap: wrap; }
  .cents { font-size: .62em; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .in-c { color: var(--good); }
  .out-c { color: var(--ink); }
  .neg { color: var(--accent); }

  /* ---------- Buttons, chips, switches, segmented controls ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-weight: 600; font-size: 12.5px; text-decoration: none; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  .btn.primary:hover { box-shadow: 0 8px 20px -10px var(--btn); }
  .btn.signal { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.signal:hover { box-shadow: 0 8px 20px -10px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .btn.xs { min-height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 7px; gap: 5px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .ibtn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--sheet); color: var(--ink-2); position: relative; transition: border-color .2s, transform .12s; }
  .ibtn:hover { border-color: var(--faint); }
  .ibtn.bare { border-color: transparent; background: transparent; }
  .ibtn .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--sheet); }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--chip); border-radius: 10px; position: relative; }
  .seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 600; font-size: 12px; transition: color .2s; }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .seg .seg-m { position: absolute; z-index: 0; top: 3px; left: 0; height: 28px; border-radius: 7px; background: var(--sheet); box-shadow: 0 1px 3px rgba(21,33,58,.14); transition: transform .3s cubic-bezier(.3,.9,.3,1), width .3s; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--muted); font-size: 12px; font-weight: 600; transition: background .2s, color .2s, border-color .2s; }
  .chip b { font-weight: 700; color: var(--faint); font-size: 11px; }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  .chip[aria-pressed="true"] b { color: inherit; opacity: .7; }
  .sw { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); }
  .sw .tr { width: 32px; height: 19px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
  .sw .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,.9,.3,1.2); }
  .sw[aria-checked="true"] .tr { background: var(--accent); }
  .sw[aria-checked="true"] .tr::after { transform: translateX(13px); }
  kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--sheet); font: 600 10.5px/1 inherit; color: var(--muted); }

  /* ---------- Status pills ---------- */
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: var(--chip); color: var(--muted); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.sent, .pill.scheduled { background: var(--navy-3); color: var(--navy); }
  .pill.overdue { background: var(--accent-soft); color: var(--accent); }
  .pill.paid, .pill.matched, .pill.filed { background: var(--good-soft); color: var(--good); }
  .pill.due { background: var(--chip); color: var(--ink-2); }
  .tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--chip); color: var(--muted); font-size: 11px; font-weight: 600; white-space: nowrap; }
  .tag.warn { background: var(--accent-soft); color: var(--accent); }
  .mono-av { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; flex: none; font-size: 10.5px; font-weight: 750; letter-spacing: .02em; color: hsl(var(--h) 45% 26%); background: hsl(var(--h) 55% 90%); }
  [data-theme="dark"] .mono-av { color: hsl(var(--h) 70% 86%); background: hsl(var(--h) 30% 24%); }
  .mono-av.lg { width: 40px; height: 40px; border-radius: 11px; font-size: 13px; }

  /* ---------- App shell: sidebar + main ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 12px; padding: 16px 12px 12px; border-right: 1px solid var(--line); background: var(--paper); scrollbar-width: thin; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 0; font-size: 17px; font-weight: 760; letter-spacing: -.025em; text-decoration: none; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .brand small { margin-left: auto; font-size: 10.5px; font-weight: 650; color: var(--faint); letter-spacing: .02em; }
  .biz { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); text-align: left; box-shadow: var(--shadow); }
  .biz span:nth-child(2) { display: grid; line-height: 1.25; min-width: 0; }
  .biz b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .biz small { font-size: 11px; color: var(--muted); }
  .biz .ic { margin-left: auto; color: var(--faint); }
  .nav { display: grid; gap: 2px; position: relative; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 35px; padding: 0 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 560; font-size: 13px; transition: color .2s, background .2s; }
  .nav a:hover { color: var(--ink); background: var(--hover); }
  .nav a[aria-current="page"] { color: var(--ink); font-weight: 650; background: transparent; }
  .nav a[aria-current="page"] .ic { color: var(--accent); }
  .nav .mk { position: absolute; z-index: 0; left: 0; right: 0; top: 0; border-radius: 8px; background: var(--sheet); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.3,.9,.3,1), height .35s; }
  .nb { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; background: var(--chip); color: var(--muted); }
  .nb.hot { background: var(--accent); color: var(--accent-ink); }
  .nb.bump { animation: bump .5s cubic-bezier(.3,1.6,.4,1); }
  @keyframes bump { 40% { transform: scale(1.35); } }
  .side h4 { display: flex; align-items: center; justify-content: space-between; margin: 4px 10px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .accts { display: grid; gap: 1px; }
  .acct { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; text-align: left; color: var(--ink-2); font-size: 12.5px; }
  .acct:hover { background: var(--hover); }
  .acct i { width: 8px; height: 8px; border-radius: 2px; background: var(--navy); }
  .acct em { font-style: normal; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 12px; }
  .closecard { display: grid; gap: 7px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; text-align: left; color: var(--ink); }
  .closecard:hover { border-color: var(--faint); }
  .closecard .row b { font-size: 12px; }
  .closecard small { color: var(--muted); font-size: 11px; }
  .bar { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .8s cubic-bezier(.3,.9,.3,1); }
  .bar.navy i { background: var(--navy); }
  .bar.good i { background: var(--good); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; border-top: 1px solid var(--line); }
  .me img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .me span { display: grid; line-height: 1.25; min-width: 0; }
  .me b { font-size: 12.5px; }
  .me small { font-size: 11px; color: var(--muted); }
  .me .ibtn { margin-left: auto; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  /* The ruled header band: faint ledger lines and a double margin rule */
  .band { position: relative; padding: 0 28px; background-color: var(--band); background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px); border-bottom: 1px solid var(--line); }
  .band::before { content: ""; position: absolute; top: 0; bottom: 0; left: 12px; width: 5px; border-left: 1px solid var(--margin); border-right: 1px solid var(--margin); pointer-events: none; }
  .top { display: flex; align-items: center; gap: 10px; height: 60px; }
  .menu-btn { display: none; }
  .qsearch { display: flex; align-items: center; gap: 9px; flex: 0 1 380px; height: 36px; padding: 0 8px 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--sheet); color: var(--faint); text-align: left; font-size: 12.5px; }
  .qsearch:hover { border-color: var(--faint); }
  .qsearch span { flex: 1; }
  .sync { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: ping 2.4s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
  .ph { display: flex; align-items: flex-end; gap: 16px; padding: 10px 0 16px; }
  .ph .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); font-weight: 560; margin-bottom: 6px; }
  .ph .eyebrow a, .ph .eyebrow button { color: var(--muted); text-decoration: none; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
  .ph .eyebrow a:hover { color: var(--ink); }
  .ph h1 { font-size: 30px; line-height: 1.12; font-weight: 740; letter-spacing: -.028em; }
  .ph .sub { margin-top: 6px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .ph .sub b { color: var(--ink); font-weight: 650; }
  .ph .sub .hot { color: var(--accent); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .kpi { padding: 14px 18px 16px; border-left: 1px solid var(--line); min-width: 0; }
  .kpi:first-child { border-left: 0; padding-left: 0; }
  .kpi .lb { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 560; }
  .kpi .lb .ic { color: var(--faint); }
  .kpi .v { margin-top: 6px; font-size: 25px; font-weight: 720; letter-spacing: -.025em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .nt { margin-top: 7px; display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .bar { margin-top: 9px; }
  .dl { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--good-soft); color: var(--good); }
  .dl.dn { background: var(--accent-soft); color: var(--accent); }

  .content { padding: 20px 28px 48px; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
  .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
  .grid.eq { align-items: stretch; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { display: grid; gap: 2px; min-width: 0; padding: 9px 12px; border-radius: 10px; background: var(--chip); }
  .tile small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile b { font-size: 15px; font-weight: 720; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; position: relative; }
  .card.lift { transition: transform .22s cubic-bezier(.3,.9,.3,1), box-shadow .22s, border-color .2s; }
  .card.lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
  .card.flush { padding: 0; overflow: hidden; }
  .ch { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px; min-height: 28px; }
  .ch h3 { font-size: 13.5px; font-weight: 680; letter-spacing: -.01em; }
  .ch .meta { color: var(--muted); font-size: 12px; }
  .ch .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .link { color: var(--accent); font-weight: 650; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; padding: 0; }
  .link:hover { text-decoration: underline; }
  .hr { height: 1px; background: var(--line-2); margin: 12px 0; }
  .empty { display: grid; place-items: center; gap: 6px; padding: 26px 12px; text-align: center; color: var(--muted); }
  .empty .ic { width: 28px; height: 28px; opacity: .55; }
  .empty b { color: var(--ink); }

  /* ---------- Tables ---------- */
  .tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.t th { text-align: left; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; align-items: center; gap: 4px; }
  table.t th[aria-sort] button { color: var(--ink); }
  table.t th .ar { font-size: 9px; opacity: .8; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; }
  table.t td:first-child, table.t th:first-child { padding-left: 0; }
  table.t td:last-child, table.t th:last-child { padding-right: 0; }
  table.t .r { text-align: right; font-variant-numeric: tabular-nums; }
  table.t tbody tr { transition: background .15s; animation: rowIn .35s both; animation-delay: calc(var(--r, 0) * 22ms); }
  table.t tbody tr.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
  table.t tbody tr[tabindex] { cursor: pointer; }
  table.t tbody tr[tabindex]:hover { background: var(--hover); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
  .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .who span { display: grid; line-height: 1.25; min-width: 0; }
  .who b { font-weight: 620; overflow: hidden; text-overflow: ellipsis; }
  .who small { color: var(--muted); font-size: 11.5px; }
  .tbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .search { display: flex; align-items: center; gap: 8px; flex: 0 1 240px; height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet); color: var(--faint); }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-size: 12.5px; }
  .sel-in { height: 32px; padding: 0 28px 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet); font-size: 12.5px; }

  /* ---------- Skeleton shimmer (data-heavy pages, ~400 ms) ---------- */
  .sk { border-radius: 6px; height: 12px; background: linear-gradient(90deg, var(--chip) 0%, var(--line-2) 35%, var(--chip) 70%); background-size: 300% 100%; animation: shimmer 1s linear infinite; }
  .sk.h { height: 30px; }
  .sk.big { height: 150px; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  .skrow { display: grid; grid-template-columns: 1.2fr 2fr 1fr .8fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line-2); }

  /* ---------- Page entrance ---------- */
  .enter { animation: rise .34s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .ph-in { animation: phIn .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes phIn { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- Charts ---------- */
  .chart { display: block; width: 100%; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--faint); font-variant-numeric: tabular-nums; }
  .gridl line { stroke: var(--line-2); }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,.1,.2,1) forwards; }
  .grow-y { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .7s cubic-bezier(.2,.9,.25,1.05) both; }
  .grow-x { transform-box: fill-box; transform-origin: 0 50%; animation: growX .7s cubic-bezier(.2,.9,.25,1) both; }
  .fade { animation: fadeIn .8s .2s both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes growY { from { transform: scaleY(0); } }
  @keyframes growX { from { transform: scaleX(0); } }
  @keyframes fadeIn { from { opacity: 0; } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .tip { position: fixed; z-index: 95; pointer-events: none; min-width: 140px; max-width: 260px; padding: 9px 11px; border-radius: 9px; background: var(--tip-bg); color: var(--tip-ink); font-size: 11.5px; line-height: 1.45; box-shadow: 0 14px 30px -10px rgba(0,0,0,.45); opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 1; }
  .tip b { display: block; margin-bottom: 3px; font-size: 12px; }
  .tip div { display: flex; justify-content: space-between; gap: 12px; }
  .tip em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- The cash-flow river (signature) ---------- */
  .river { position: relative; }
  .river svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
  .rv-shoal { fill: var(--accent); opacity: .88; }
  .rv-plain { fill: var(--navy-3); opacity: .55; }
  .river .gridl text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .rv-alt { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 1.5 4; stroke-linecap: round; opacity: .45; }
  .rv-chan { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 4 5; opacity: .75; }
  .rv-rip { fill: none; stroke: var(--ripple); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 3 16; animation: current 2.2s linear infinite; }
  .rv-rip.r2 { stroke-dasharray: 2 22; animation-duration: 3.1s; opacity: .7; }
  @keyframes current { to { stroke-dashoffset: -38; } }
  .rv-in { fill: none; stroke: var(--navy-2); stroke-opacity: .5; stroke-linecap: butt; }
  .rv-out { fill: none; stroke: var(--accent); stroke-opacity: .55; stroke-linecap: butt; }
  .rv-flow { animation: fadeIn .5s both; }
  .rv-lab { font-size: 10.5px !important; fill: var(--muted) !important; font-weight: 600; }
  .rv-lab.o { fill: var(--accent) !important; }
  .rv-big { font-size: 12px !important; font-weight: 750; fill: var(--ink) !important; }
  .rv-pin { fill: var(--accent); }
  .rv-guide { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0; }
  .rv-guide.on { opacity: .45; }
  .rv-dot { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; opacity: 0; }
  .rv-dot.on { opacity: 1; }
  .rv-today { stroke: var(--ink); stroke-width: 1.2; opacity: .35; }
  .rv-key { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }
  .rv-key span { display: inline-flex; align-items: center; gap: 6px; }
  .rv-key i { display: inline-block; width: 18px; height: 8px; border-radius: 4px; }

  /* ---------- Modal, drawer, popover, toasts ---------- */
  .ov { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .ov-back { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity .25s; }
  .dlg { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px -24px rgba(0,0,0,.5); opacity: 0; transform: translateY(16px) scale(.98); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.05); }
  .dlg.wide { width: min(720px, 100%); }
  .ov.open .ov-back { opacity: 1; }
  .ov.open .dlg { opacity: 1; transform: none; }
  .ov.drawer { place-items: stretch end; padding: 0; }
  .ov.drawer .dlg { width: min(460px, 100%); height: 100%; max-height: none; border-radius: 14px 0 0 14px; transform: translateX(48px); }
  .ov.drawer.open .dlg { transform: none; }
  .dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 6px; position: sticky; top: 0; background: inherit; z-index: 2; }
  .dh h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .db { padding: 6px 18px 18px; }
  .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
  .db .df { padding: 14px 0 0; }
  .confirm-t { color: var(--muted); line-height: 1.55; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: grid; gap: 5px; grid-column: span 2; min-width: 0; }
  .field.half { grid-column: span 1; }
  .field label, .lbl { font-size: 12px; font-weight: 620; color: var(--ink-2); }
  .field input, .field select, .field textarea, .inp { width: 100%; min-height: 36px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 13px; }
  .field textarea { resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  [aria-invalid="true"] { border-color: var(--bad) !important; }
  .err { color: var(--bad); font-size: 11.5px; }
  .err:empty { display: none; }
  .hint { color: var(--muted); font-size: 11.5px; }
  form.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.4); opacity: 0; transform: translateY(-6px); transition: opacity .18s, transform .22s; }
  .pop.open { opacity: 1; transform: none; }
  .pop-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; font-weight: 700; }
  .pop-i { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line-2); font-size: 12.5px; }
  .pop-i .ic { color: var(--accent); margin-top: 2px; }
  .pop-i small { display: block; color: var(--muted); font-size: 11.5px; }
  .pop-i.read .ic { color: var(--faint); }
  .toasts { position: fixed; z-index: 90; right: 18px; bottom: 18px; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
  .toast { display: flex; gap: 10px; align-items: center; padding: 11px 12px 11px 14px; border-radius: 11px; background: var(--tip-bg); color: var(--tip-ink); box-shadow: 0 14px 30px -10px rgba(0,0,0,.45); font-size: 12.5px; animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .toast .ic { color: var(--good); }
  .toast.warn .ic { color: var(--accent); }
  .toast span { flex: 1; }
  .toast button { border: 0; background: rgba(255,255,255,.14); color: inherit; font-weight: 700; padding: 4px 9px; border-radius: 6px; font-size: 12px; }
  [data-theme="dark"] .toast button { background: rgba(0,0,0,.1); }
  .toast.out { animation: toastOut .3s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }
  .cmdk .dlg { align-self: start; margin-top: 10vh; width: min(560px, 100%); }
  .cmdk-q { width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--sheet); font-size: 14px; outline: none; }
  .cmdk-l { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
  .cmdk-l li { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .cmdk-l li small { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .cmdk-l li[aria-selected="true"], .cmdk-l li:hover { background: var(--hover); }
  .cmdk-l li[aria-selected="true"] .ic { color: var(--accent); }
  .cmdk-l .grp { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 11px 4px; cursor: default; }
  .cmdk-f { margin-top: 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Overview ---------- */
  .feed { list-style: none; margin: 0; padding: 0; display: grid; }
  .feed li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
  .feed li:last-child { border-bottom: 0; }
  .feed li.new { animation: feedIn .6s cubic-bezier(.2,.9,.3,1.1) both; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-10px); background: var(--accent-soft); } }
  .feed .fi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--chip); color: var(--ink-2); }
  .feed .fi.in { background: var(--good-soft); color: var(--good); }
  .feed .fi.out { background: var(--accent-soft); color: var(--accent); }
  .feed small { display: block; color: var(--muted); font-size: 11.5px; }
  .feed time { color: var(--faint); font-size: 11px; }
  .age { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 4px 0 12px; }
  .age i { display: block; height: 100%; transform-origin: 0 50%; animation: growX .8s cubic-bezier(.2,.9,.25,1) both; }
  .agel { display: grid; gap: 7px; }
  .agel div { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; font-size: 12.5px; }
  .agel i { width: 9px; height: 9px; border-radius: 3px; }
  .agel em { font-style: normal; font-weight: 650; font-variant-numeric: tabular-nums; }
  .mini-list { display: grid; }
  .mini-list > * { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .mini-list > *:last-child { border-bottom: 0; }
  .biz-card { display: grid; grid-template-columns: 1fr; padding: 0; overflow: hidden; }
  .biz-card .bc-b { padding: 12px 16px 14px; display: grid; gap: 8px; }
  .countdown { display: flex; align-items: baseline; gap: 6px; }
  .countdown b { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }

  /* ---------- Invoices + the paper preview ---------- */
  .inv-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 420px); gap: 16px; align-items: start; }
  .paper-wrap { position: sticky; top: 16px; display: grid; gap: 10px; }
  .paper { position: relative; background: #fffefb; color: #17223b; border-radius: 6px; padding: 26px 26px 22px; font-size: 11px; line-height: 1.5; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 20px 44px -22px rgba(21,33,58,.45), 0 0 0 1px rgba(21,33,58,.06); overflow: hidden; }
  [data-theme="dark"] .paper { background: #f6f3ec; box-shadow: 0 24px 50px -20px rgba(0,0,0,.8); }
  .paper.swap { animation: paperIn .45s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes paperIn { from { opacity: 0; transform: translateY(12px) rotate(-.6deg); } }
  .paper .pp-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; padding-bottom: 14px; border-bottom: 2px solid var(--pa, #1b2c55); }
  .paper .pp-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; letter-spacing: -.01em; }
  .paper .pp-logo svg { width: 24px; height: 24px; }
  .paper .pp-title { text-align: right; }
  .paper .pp-title b { display: block; font-size: 20px; letter-spacing: .14em; color: var(--pa, #1b2c55); font-weight: 800; }
  .paper .pp-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 0; }
  .paper .pp-meta small, .paper .pp-k { display: block; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #7a8296; font-weight: 700; }
  .paper table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .paper th { text-align: left; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #7a8296; padding: 6px 0; border-bottom: 1px solid #dfe2e8; }
  .paper td { padding: 6px 0; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  .paper .r { text-align: right; font-variant-numeric: tabular-nums; }
  .paper .pp-tot { margin-left: auto; width: 62%; display: grid; gap: 3px; padding-top: 10px; }
  .paper .pp-tot div { display: flex; justify-content: space-between; }
  .paper .pp-tot .gt { margin-top: 4px; padding-top: 7px; border-top: 2px solid var(--pa, #1b2c55); font-size: 14px; font-weight: 800; }
  .paper .pp-foot { margin-top: 16px; padding-top: 10px; border-top: 1px dashed #d6d9e0; display: grid; grid-template-columns: 1fr auto; gap: 12px; color: #586178; font-size: 10px; }
  .paper .pp-pay { display: inline-block; padding: 6px 10px; border-radius: 6px; background: var(--pa, #1b2c55); color: #fff; font-weight: 700; font-size: 10px; }
  .stamp { position: absolute; right: 22px; top: 96px; padding: 3px 12px; border: 2.5px solid currentColor; border-radius: 7px; font-weight: 850; font-size: 17px; letter-spacing: .16em; transform: rotate(-11deg); opacity: .82; mix-blend-mode: multiply; pointer-events: none; }
  .stamp.paid { color: #2c8a5f; }
  .stamp.overdue { color: #ec5a24; }
  .stamp.draft { color: #8b94a7; }
  .stamp.hit { animation: stampIn .5s cubic-bezier(.3,1.5,.4,1) both; }
  @keyframes stampIn { from { opacity: 0; transform: rotate(-11deg) scale(2.2); } }
  .paper .flash { animation: flashTot .6s; }
  @keyframes flashTot { 30% { color: var(--accent); } }
  .pv-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .due-l { font-size: 11.5px; }
  .due-l.late { color: var(--accent); font-weight: 650; }

  /* Builder */
  .bld { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); gap: 18px; align-items: start; }
  .lines { display: grid; gap: 6px; }
  .ln { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px 92px 30px; gap: 6px; align-items: center; animation: rowIn .3s both; }
  .ln.hd { font-size: 11px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; animation: none; }
  .ln input { min-height: 34px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); font-size: 12.5px; width: 100%; min-width: 0; }
  .ln input:focus { outline: none; border-color: var(--accent); }
  .ln .amt { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ln.out { animation: lnOut .25s forwards; }
  @keyframes lnOut { to { opacity: 0; transform: translateX(20px); } }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .send-fly { animation: sendFly .7s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes sendFly { 40% { transform: translateY(10px) scale(.96); } to { transform: translate(140px, -420px) rotate(14deg) scale(.4); opacity: 0; } }

  /* ---------- Bills ---------- */
  .tl { display: grid; grid-template-columns: 112px repeat(14, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .tl-c { min-height: 132px; border-left: 1px solid var(--line-2); padding: 6px 5px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
  .tl-c:first-child { border-left: 0; background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
  .tl-c.today { background: color-mix(in srgb, var(--navy-3) 55%, transparent); }
  .tl-c.wkend { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line-2) 6px 7px); }
  .tl-d { font-size: 10.5px; color: var(--faint); font-weight: 650; display: flex; justify-content: space-between; }
  .tl-d b { color: var(--ink-2); font-size: 12px; }
  .tl-b { display: block; width: 100%; border: 0; text-align: left; padding: 4px 6px; border-radius: 6px; font-size: 10.5px; line-height: 1.25; background: var(--chip); color: var(--ink); border-left: 3px solid var(--navy); animation: rise .45s both; animation-delay: calc(var(--i, 0) * 40ms); overflow: hidden; }
  .tl-b b { display: block; font-variant-numeric: tabular-nums; font-size: 11px; }
  .tl-b span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .tl-b.overdue { border-left-color: var(--accent); background: var(--accent-soft); }
  .tl-b.scheduled { border-left-color: var(--good); }
  .tl-b:hover { filter: brightness(.97); }
  .catbars { display: grid; gap: 9px; }
  .catbars div { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
  .catbars .bar { height: 8px; }

  /* ---------- Bank feed (signature: rows slide into their match) ---------- */
  .bank { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .fr { position: relative; display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 6px 10px 2px; border-bottom: 1px solid var(--line-2); background: var(--sheet); transition: background .2s; }
  .fr:hover { background: var(--hover); }
  .fr[draggable="true"] { cursor: grab; }
  .fr.new { animation: frNew 1.2s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes frNew { 0% { opacity: 0; transform: translateY(-14px); background: var(--accent-soft); } 40% { opacity: 1; transform: none; background: var(--accent-soft); } }
  .fr .fd { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .fr .fd b { display: block; font-size: 15px; color: var(--ink); font-weight: 700; }
  .fr .fdesc { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .fr .famt { font-weight: 720; font-size: 13.5px; font-variant-numeric: tabular-nums; text-align: right; }
  .fr .famt.in { color: var(--good); }
  .fr .fsug { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .fr .fsug b { color: var(--ink); font-weight: 650; }
  .conf { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; color: var(--good); }
  .conf i { width: 34px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; display: inline-block; position: relative; }
  .conf i::after { content: ""; position: absolute; inset: 0; width: var(--c, 50%); background: currentColor; border-radius: inherit; }
  .conf.lo { color: var(--accent); }
  .fsug .btns { margin-left: auto; display: flex; gap: 6px; }
  .fr.gone { overflow: hidden; }
  .flyer { position: fixed; z-index: 70; pointer-events: none; margin: 0; border-radius: 10px; box-shadow: 0 18px 40px -12px rgba(21,33,58,.45); border: 1px solid var(--accent); transform-origin: 50% 50%; }
  .tc { position: relative; display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px 10px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); overflow: hidden; transition: border-color .2s, box-shadow .2s, transform .2s; }

/* ---------- Popover (bell, business switcher): closes on outside click or Esc ---------- */
let openPop = null;
function popover(anchor, html, onOpen, width = 330) {
  if (openPop) { const same = openPop.anchor === anchor; openPop.close(); if (same) return; }
  const p = document.createElement("div");
  p.className = "pop";
  p.innerHTML = html;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  const w = Math.min(width, innerWidth - 16);
  p.style.width = w + "px";
  p.style.left = clamp(r.left + r.width / 2 > innerWidth / 2 ? r.right - w : r.left, 8, innerWidth - w - 8) + "px";
  p.style.top = Math.min(r.bottom + 8, innerHeight - 120) + "px";
  anchor.setAttribute("aria-expanded", "true");
  const close = () => { p.remove(); anchor.setAttribute("aria-expanded", "false"); document.removeEventListener("pointerdown", out, true); document.removeEventListener("keydown", key); openPop = null; };
  const out = (e) => { if (!p.contains(e.target) && !anchor.contains(e.target)) close(); };
  const key = (e) => { if (e.key === "Escape") { close(); anchor.focus(); } };
  setTimeout(() => { document.addEventListener("pointerdown", out, true); document.addEventListener("keydown", key); });
  openPop = { anchor, close, el: p };
  if (onOpen) onOpen(p, close);
  requestAnimationFrame(() => p.classList.add("open"));
  return openPop;
}

/* ---------- Tooltip that follows the pointer ---------- */
const tip = {
  el: null,
  show(e, html) {
    if (!this.el) { this.el = document.createElement("div"); this.el.className = "tip"; this.el.setAttribute("role", "tooltip"); document.body.appendChild(this.el); }
    this.el.innerHTML = html;
    this.el.classList.add("on");
    const w = this.el.offsetWidth, h = this.el.offsetHeight;
    this.el.style.left = clamp(e.clientX + 14, 6, innerWidth - w - 6) + "px";
    this.el.style.top = (e.clientY - h - 12 < 6 ? e.clientY + 16 : e.clientY - h - 12) + "px";
  },
  hide() { if (this.el) this.el.classList.remove("on"); },
};

/* ---------- Segmented control with a sliding marker ---------- */
function seg(name, opts, cur, label) {
  return `<div class="seg" role="group" aria-label="${esc(label)}" data-seg="${name}"><span class="seg-m" aria-hidden="true"></span>${opts.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`).join("")}</div>`;
}
function placeSegs(root = document) {
  $$(".seg", root).forEach((s) => {
    const b = $('button[aria-pressed="true"]', s), m = $(".seg-m", s);
    if (!b || !m) return;
    m.style.width = b.offsetWidth + "px";
    m.style.transform = `translateX(${b.offsetLeft}px)`;
  });
}
function onSeg(root, name, fn) {
  const s = $(`[data-seg="${name}"]`, root);
  if (!s) return;
  s.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    $$("button", s).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    placeSegs(s.parentElement);
    fn(b.dataset.v);
  });
}

/* ---------- Download a text file (CSV export) ---------- */
function download(name, text, type = "text/csv") {
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("Downloaded " + name);
  } catch (e) { toast("This browser blocked the download", "warn"); }
}

/* Staggered entrance for the cards of a freshly rendered page */
function enter(root) {
  if (calm()) return;
  $$(".card, [data-enter]", root).forEach((c, i) => {
    c.style.setProperty("--i", Math.min(i, 12));
    c.classList.add("enter");
    c.addEventListener("animationend", function done(e) { if (e.target === c) { c.classList.remove("enter"); c.removeEventListener("animationend", done); } });
  });
}

function quarters() {

    const key = yy + "-Q" + (q + 1);
    const rnd = seeded(yy * 10 + q)();
    const isCur = k === 0;
    const coll = isCur ? taxCollected(start, end) : r2(5200 + rnd * 1700);
    const paid = isCur ? taxPaid(start, end) : r2(980 + rnd * 520);
    const filed = S.filed[key] || (!isCur && iso(due) < iso(TODAY));
    out.push({ key, q: "Q" + (q + 1), months: MON[q * 3] + " – " + MON[q * 3 + 2], year: yy, start: iso(start), end: iso(end), due: iso(due), coll, paid, net: r2(coll - paid), filed: !!filed, cur: isCur });
  }
  return out;
}

function taxCollected(start, end) {
  const a = iso(start), b = iso(end);

  if (cf.win) { add(12 + late, "Mosswood fit-out deposit", 7000, "new"); add(60 + late, "Mosswood fit-out balance", 7000, "new"); }

  let low = days[0];
  days.forEach((x) => { if (x.bal < low.bal) low = x; });

}

const HIST_OUT = [17.9, 18.4, 19.1, 20.2, 19.7, 21.3, 20.8, 19.9, 22.4, 23.1, 21.8, 23.4].map((v) => v * 1000);
const PL = [

function autoMatch(lines, rowFor, after) {
  const sure = lines.map((l) => [l, suggest(l)]).filter(([, g]) => g && g.conf >= 0.9);
  if (!sure.length) { toast("Nothing sure to match: the rest need a look", "warn"); return; }
  sure.forEach(([l, g], k) => setTimeout(() => matchLine(l, g, rowFor(l.id), after), k * (calm() ? 0 : 620)));
}
function bankRow(l, compact = false) {
  const g = suggest(l), d = parse(l.date);
  let sug = `<span>No match yet</span><span class="btns"><button type="button" class="btn xs" data-pick>Find a match…</button></span>`;
  if (g) {
    const sure = g.conf >= 0.85;
    const what = g.type === "inv" ? "Matches" : g.type === "bill" ? "Pays bill" : g.type === "transfer" ? "" : g.type === "income" ? "" : "Looks like";
    const btn = g.type === "inv" || g.type === "bill" ? "Match" : g.type === "transfer" ? "Mark transfer" : g.type === "income" ? "Record income" : "Add expense";
    sug = `<span>${what} <b>${esc(g.label)}</b></span><span class="conf${sure ? "" : " lo"}" style="--c:${Math.round(g.conf * 100)}%"><i></i>${Math.round(g.conf * 100)}%</span><span class="btns"><button type="button" class="btn xs ${sure ? "signal" : ""}" data-match>${btn}</button>${compact ? "" : '<button type="button" class="btn xs" data-pick>Other…</button>'}</span>`;
  }
  return `<div class="fr" data-id="${l.id}"${compact ? "" : ' draggable="true"'}><div class="fd"><b>${d.getDate()}</b>${MON[d.getMonth()]}</div><div class="fdesc" title="${esc(l.desc)}">${esc(l.desc)}</div><div class="famt${l.amt > 0 ? " in" : ""}">${money(l.amt, 2, true)}</div><div class="fsug">${sug}</div></div>`;
}

/* =====================================================================
   Small charts (SVG, drawn in, with tooltips)
   ===================================================================== */
function inOutChart(n = 6) {
  const W = 380, H = 206, L = 34, B = 22, T = 10;
  const ins = HIST_IN.slice(-n), outs = HIST_OUT.slice(-n);
  const max = Math.ceil(Math.max(...ins, ...outs) / 10000) * 10000;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const gw = (W - L) / n, bw = Math.min(18, gw * 0.28);
  const lab = (i) => MON[(TODAY.getMonth() - n + 1 + i + 12) % 12];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and money out for the last ${n} months"><g class="gridl">`;
  for (let k = 0; k <= 3; k++) { const v = (max / 3) * k; s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${kfmt(v)}</text>`; }
  s += "</g>";
  ins.forEach((v, i) => {
    const cx = L + gw * i + gw / 2;
    s += `<g data-i="${i}" class="hov"><rect x="${cx - gw / 2}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent"/><rect class="grow-y" style="fill:var(--navy);animation-delay:${i * 60}ms" x="${cx - bw - 1.5}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="3"/><rect class="grow-y" style="fill:var(--accent);opacity:.85;animation-delay:${i * 60 + 40}ms" x="${cx + 1.5}" y="${y(outs[i])}" width="${bw}" height="${y(0) - y(outs[i])}" rx="3"/><text x="${cx}" y="${H - 6}" text-anchor="middle">${lab(i)}</text></g>`;
  });
  return s + "</svg>";
}
function bindInOut(root) {
  const n = 6, ins = HIST_IN.slice(-n), outs = HIST_OUT.slice(-n);
  $$(".hov", root).forEach((g) => {
    const i = +g.dataset.i, m = MONTHS[(TODAY.getMonth() - n + 1 + i + 12) % 12];
    g.addEventListener("pointermove", (e) => tip.show(e, `<b>${m}</b><div><span>Money in</span><em>${money(ins[i], 0)}</em></div><div><span>Money out</span><em>${money(outs[i], 0)}</em></div><div><span>Left over</span><em>${money(ins[i] - outs[i], 0)}</em></div>`));
    g.addEventListener("pointerleave", () => tip.hide());
  });
}

function invRows() {

  else if (st.f !== "all") rows = rows.filter((i) => invStatus(i) === st.f);
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter((i) => { const c = client(i.client) || {}; return (i.id + " " + c.name + " " + c.contact + " " + i.lines.map((l) => l.d).join(" ")).toLowerCase().includes(q); }); }
  const [k, dir] = st.sort;
  const val = { n: (i) => i.n, client: (i) => (client(i.client) || {}).name || "", due: (i) => i.due, amt: invTotal, status: (i) => ["overdue", "sent", "draft", "paid"].indexOf(invStatus(i)) };
  rows.sort((a, b) => { const x = val[k](a), y = val[k](b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  return rows;
}

function validateDraft() {

  ok = set("b-disc", +d.disc > 50 ? "Discounts above 50% need a credit note instead" : "") && ok;
  const good = d.lines.filter((l) => l.d.trim() && +l.q > 0 && +l.r > 0);

function payBills(ids) {

        b.setAttribute("aria-checked", String(S.cf[b.dataset.k]));

      });

      const fl = $("#cfFloor", root);
      fl.addEventListener("input", () => { S.cf.floor = +fl.value; $("#cfFloorV", root).textContent = money(S.cf.floor, 0); drawRiver(host, project(), { alt: alt(), still: true }); $("#cfAdv", root).innerHTML = cfAdvice(project()); });
      fl.addEventListener("change", () => { save(); refreshBand(); });
      const bindWeeks = () => {

};

const chg = (v, p, good = 1) => { if (!p) return "<td>–</td>"; const c = ((v - p) / Math.abs(p)) * 100; return `<td class="${c * good >= 0 ? "ch-up" : "ch-dn"}">${c >= 0 ? "+" : "−"}${Math.abs(c).toFixed(1)}%</td>`; };
function plTable(pl) {

  return `<div class="tscroll"><table class="pl" style="min-width:500px"><thead><tr><th>Account</th><th>${PERIODS[UI.rep.period]}</th><th>Before</th><th>Change</th></tr></thead><tbody>${grp(0, 1)}${grp(1, -1)}<tr class="tot"><td>Gross profit <small class="muted">${((t.v.gross / t.v.inc) * 100).toFixed(1)}% margin</small></td><td>${money(t.v.gross)}</td><td class="muted">${money(t.p.gross)}</td>${chg(t.v.gross, t.p.gross)}</tr>${grp(2, -1)}<tr class="tot net"><td>Net profit</td><td>${money(t.v.net)}</td><td>${money(t.p.net)}</td>${chg(t.v.net, t.p.net)}</tr></tbody></table></div>`;
}
function waterfall(t) {
  const W = 400, H = 210, T = 22, B = 34;
  const bars = [["Income", 0, t.inc, "var(--navy)"], ["Cost of sales", t.inc - t.cos, t.inc, "var(--accent)"], ["Gross", 0, t.gross, "var(--navy-2)"], ["Running costs", t.net, t.gross, "var(--accent)"], ["Net profit", 0, t.net, "var(--good)"]];
  const max = t.inc * 1.05, y = (v) => T + (H - T - B) * (1 - v / max), gw = W / bars.length, bw = gw * 0.56;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="From income to net profit">${bars.map(([l, a, b, c], k) => { const cx = gw * k + gw / 2; return `${k ? `<line x1="${cx - gw + bw / 2}" x2="${cx - bw / 2}" y1="${y(k === 2 || k === 4 ? b : a)}" y2="${y(k === 2 || k === 4 ? b : a)}" style="stroke:var(--faint);stroke-dasharray:2 3"/>` : ""}<rect class="grow-y" style="fill:${c};animation-delay:${k * 110}ms" x="${cx - bw / 2}" y="${y(b)}" width="${bw}" height="${Math.max(2, y(a) - y(b))}" rx="3"/><text x="${cx}" y="${y(b) - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${kfmt(k === 1 || k === 3 ? -(b - a) : b)}</text><text x="${cx}" y="${H - 16}" text-anchor="middle">${l.split(" ")[0]}</text><text x="${cx}" y="${H - 4}" text-anchor="middle">${l.split(" ").slice(1).join(" ")}</text>`; }).join("")}</svg>`;
}
function netLine() {
  const v = HIST_IN.map((x, i) => x - HIST_OUT[i]), W = 400, H = 150, T = 12, B = 20, L = 4;
  const max = Math.max(...v) * 1.15, min = 0, x = (i) => L + (i / 11) * (W - L * 2), y = (n) => T + (H - T - B) * (1 - (n - min) / (max - min));
  const pts = v.map((n, i) => [x(i), y(n)]), line = crPath(pts);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net profit for the last 12 months"><path d="${line}L${x(11)} ${H - B}L${x(0)} ${H - B}Z" class="fade" style="fill:var(--navy-3);opacity:.6"/><path d="${line}" pathLength="1" class="draw" style="fill:none;stroke:var(--navy);stroke-width:2.2"/>${v.map((n, i) => `<circle cx="${x(i)}" cy="${y(n)}" r="${i === 11 ? 4.5 : 2.6}" class="fade" style="fill:${i === 11 ? "var(--accent)" : "var(--navy)"}"/>${i % 2 === 1 ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${MON[(TODAY.getMonth() - 11 + i + 12) % 12]}</text>` : ""}`).join("")}<text x="${x(11) - 6}" y="${y(v[11]) - 9}" text-anchor="end" style="fill:var(--ink);font-weight:700">${kfmt(v[11])}</text></svg>`;
}

      <div class="qtrs">${qs.map((q) => `<div class="qt${q.cur ? " now" : ""}"><div class="row"><b>${q.q} ${q.year}</b><span class="pill ${q.filed ? "filed" : q.cur ? "sent" : "overdue"}" style="margin-left:auto">${q.filed ? "Filed" : q.cur ? "Open" : "Due"}</span></div><small class="muted">${q.months} · due ${fdate(q.due)}</small><div class="row" style="font-size:12px"><span class="muted">Collected</span><span class="num" style="margin-left:auto">${money(q.coll)}</span></div><div class="row" style="font-size:12px"><span class="muted">Paid on purchases</span><span class="num" style="margin-left:auto">−${money(q.paid)}</span></div><div class="v">${money(q.net)}</div>${q.filed ? `<small class="muted">${ic("check")} Return filed</small>` : `<button type="button" class="btn sm ${q.cur ? "" : "signal"}" data-file="${q.key}">${ic("check")}Mark as filed</button>`}</div>`).join("")}</div>

      ${have < need ? `<button type="button" class="btn sm primary" id="txMove" style="margin-top:10px">${ic("swap")}Move ${money(Math.min(need - have, Math.max(0, S.accts.chk - 5000)), 0)} to tax savings</button>` : `<p class="hint" style="margin-top:10px">${ic("check")} You have enough put away.</p>`}

      <p class="hint" style="margin:10px 0">Send her the ${cur.q} pack: profit and loss, sales tax summary and the receipt list.</p>

PAGES.reports = () => {

  ] : [

<script>

function clientStats(c) {
  const inv = S.invoices.filter((i) => i.client === c.id);
  const open = inv.filter((i) => ["sent", "overdue"].includes(invStatus(i)));
  return { inv, open, owed: sum(open, invTotal), late: sum(open.filter((i) => invStatus(i) === "overdue"), invTotal), ytd: c.ytd0 + sum(inv.filter((i) => i.status === "paid"), invTotal) };
}
/* the last eight invoices as dots: on time, late or still open */
function habit(c) {
  const R = seeded(hue(c.id + c.name));
  const real = S.invoices.filter((i) => i.client === c.id && i.status !== "draft").slice(-4).map((i) => { const st = invStatus(i); return st === "paid" ? (i.paidOn > i.due ? "late" : "") : st === "overdue" ? "late" : "open"; });
  const past = Array.from({ length: 8 - real.length }, () => (R() * 20 < c.delay ? "late" : ""));
  return [...past, ...real].map((k, n) => `<i class="${k}" style="--i:${n}" title="${k === "late" ? "Paid late" : k === "open" ? "Still open" : "Paid on time"}"></i>`).join("");
}
function addClient(cb, c) {

    title: c ? "Edit client" : "Add a client", submit: c ? "Save client" : "Add client", drawer: true,

      { name: "phone", label: "Phone", type: "tel", half: true },
      { name: "city", label: "Town or city", half: true },
      { name: "terms", label: "Payment terms", type: "select", options: [[7, "Net 7"], [14, "Net 14"], [30, "Net 30"], [45, "Net 45"]], half: true },
      { name: "note", label: "Note", type: "textarea", placeholder: "How they like to be invoiced, who approves…" },

      const rm = e.target.closest("[data-urm]");
      if (rm) { const u = team().find((x) => x.id === rm.dataset.urm); confirmBox(`Remove ${u.name}? They lose access straight away.`, "Remove", () => { S.team = team().filter((x) => x !== u); save(); toast(`${u.name} removed`); draw(); }); }
      if (e.target.closest("#sInvite")) formModal({
        title: "Invite someone", submit: "Send invite",
        fields: [
          { name: "name", label: "Name", required: true, auto: true },
          { name: "email", label: "Email", type: "email", required: true, check: (v) => (team().some((x) => x.email.toLowerCase() === v.toLowerCase()) ? "This person already has access" : "") },
          { name: "role", label: "Role", type: "select", options: Object.keys(ROLES).filter((r) => r !== "Owner").map((r) => [r, r + " · " + ROLES[r].toLowerCase()]) },
        ],
        onSubmit: (v) => { team().push({ id: "u" + S.kn++, name: v.name, email: v.email, role: v.role }); save(); feedPush("users", "", `Invite sent to ${v.name}`, v.role); toast(`Invite sent to ${v.email}`); draw(); },
      });
    });
    panel.addEventListener("change", (e) => { const s = e.target.closest("[data-urole]"); if (s) { const u = team().find((x) => x.id === s.dataset.urole); u.role = s.value; save(); toast(`${u.name} is now ${s.value.toLowerCase()}`); draw(); } });
    bind();
  },
});

/* =====================================================================
   Command search (Ctrl+K), notifications, month-end close, theme
   ===================================================================== */
function cmdItems() {
  return [
    ...NAV.map(([k, l, i]) => ({ g: "Pages", label: l, icon: i, run: () => { location.hash = "#/" + k; } })),
    { g: "Actions", label: "New invoice", icon: "plus", hint: "opens the builder", run: () => { UI.draft = null; location.hash = "#/invoices/new"; } },
    { g: "Actions", label: "Add a bill", icon: "receipt", run: () => billForm(null) },
    { g: "Actions", label: "Add an expense", icon: "tag", run: () => expForm(null) },
    { g: "Actions", label: "Add a client", icon: "users", run: () => addClient(() => refresh()) },
    { g: "Actions", label: "Sync the bank now", icon: "refresh", run: () => syncNow(true) },
    { g: "Actions", label: "Match bank lines", icon: "wand", hint: unmatched().length + " waiting", run: () => { location.hash = "#/bank"; } },
    { g: "Actions", label: "Switch light or dark", icon: "moon", run: () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark") },
    { g: "Actions", label: "Reset demo data", icon: "database", run: () => { UI.set.tab = "data"; location.hash = "#/settings"; if (CUR.name === "settings") refresh(); } },
    ...S.invoices.map((i) => ({ g: "Invoices", label: i.id + " · " + ((client(i.client) || {}).name || ""), icon: "file", hint: money(invTotal(i)) + " · " + ST_LABEL[invStatus(i)], run: () => { UI.inv.sel = i.id; UI.inv.f = "all"; if (CUR.name === "invoices" && !CUR.sub) refresh(); else location.hash = "#/invoices"; } })),
    ...S.clients.map((c) => ({ g: "Clients", label: c.name, icon: "user", hint: c.contact, run: () => clientDrawer(c) })),
  ];
}
function cmdk() {
  const all = cmdItems();
  let sel = 0, shown = [];
  const m = openModal({
    title: "Search and jump", cls: "cmdk",
    html: `<label class="sr-only" for="cmdq">Search pages, actions, invoices and clients</label><input id="cmdq" class="cmdk-q" placeholder="Type a page, an action, an invoice number or a client…" autocomplete="off" autofocus><ul class="cmdk-l" role="listbox" aria-label="Results"></ul><p class="cmdk-f"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></p>`,
  });
  const q = $("#cmdq", m.el), ul = $(".cmdk-l", m.el);
  const draw = () => {
    const t = q.value.toLowerCase().trim();
    shown = t ? all.filter((x) => (x.label + " " + (x.hint || "")).toLowerCase().includes(t)).slice(0, 14) : all.filter((x) => x.g === "Pages" || x.g === "Actions");
    sel = clamp(sel, 0, Math.max(0, shown.length - 1));
    let g = "";
    ul.innerHTML = shown.length ? shown.map((x, i) => { const head = x.g !== g ? `<li class="grp" role="presentation">${x.g}</li>` : ""; g = x.g; return head + `<li role="option" id="cmd-${i}" aria-selected="${i === sel}" data-i="${i}">${ic(x.icon)}<span>${esc(x.label)}</span><small>${esc(x.hint || "")}</small></li>`; }).join("") : '<li class="grp" role="presentation">No matches</li>';
    q.setAttribute("aria-activedescendant", shown.length ? "cmd-" + sel : "");
    const cur = $(`[data-i="${sel}"]`, ul);
    if (cur) cur.scrollIntoView({ block: "nearest" });
  };
  const run = (i) => { const x = shown[i]; if (!x) return; m.close(); setTimeout(() => x.run(), 20); };
  q.addEventListener("input", () => { sel = 0; draw(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { sel++; draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { sel--; draw(); e.preventDefault(); }
    if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  ul.addEventListener("click", (e) => { const li = e.target.closest("[data-i]"); if (li) run(+li.dataset.i); });
  draw();
}
function notices() {
  const out = [];
  S.invoices.filter((i) => invStatus(i) === "overdue").slice(0, 3).forEach((i) => out.push(["alert", `${i.id} is ${-daysFrom(i.due)} days late`, `${client(i.client).name} · ${money(invTotal(i))}`, "#/invoices", i.id]));
  const un = unmatched().length;
  if (un) out.push(["bank", `${un} bank lines are waiting`, "Most of them have a sure match", "#/bank"]);
  const tx = nextTax();
  if (tx) out.push(["percent", `${tx.q} sales tax due in ${daysFrom(tx.due)} days`, `Estimate ${money(tx.net)} · due ${fdateY(tx.due)}`, "#/reports"]);
  const ob = S.bills.filter((b) => billStatus(b) === "overdue");
  if (ob.length) out.push(["receipt", `${ob.length} bills are overdue`, ob.map((b) => b.vendor).slice(0, 2).join(", "), "#/bills"]);
  return out;
}
function setTheme(t) { document.documentElement.dataset.theme = t; updateSide(); }

$("#closeBtn").addEventListener("click", () => {
  const draw = () => { const cl = closeItems(); return `<p class="confirm-t">Tick off the month before you lock it. Two items tick themselves as you match bank lines and add receipts.</p><div class="checks" style="margin-top:10px">${cl.map((c, k) => `<label class="${c.done ? "done" : ""}"><input type="checkbox" data-k="${k}" ${c.done ? "checked" : ""} ${c.auto ? "disabled" : ""}><span>${esc(c.t)}</span>${c.auto && !c.done ? `<a class="link" href="${c.auto === "bank" ? "#/bank" : "#/expenses"}" style="margin-left:auto">Go ${ic("arrowR")}</a>` : ""}</label>`).join("")}</div><div class="df" style="padding:14px 0 0"><button type="button" class="btn primary" id="lockM" ${cl.every((c) => c.done) ? "" : "disabled"}>${ic("lock")}Lock ${MONTHS[TODAY.getMonth()]}</button></div>`; };
  const m = openModal({ title: `${MONTHS[TODAY.getMonth()]} close`, html: draw() });

});
document.addEventListener("keydown", (e) => {
