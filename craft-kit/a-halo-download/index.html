<!doctype html>
<!-- Chill & Craft · Halo · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --bg1: #f5f2ff;
    --bg2: #e3dcff;
    --text: #2a2350;
    --muted: #6b6496;
    --surface: #ffffff;
    --track: #e6e0fd;
    --accent: #5b3df5;
    --focus: #0ea5e9;
    --shadow: 0 14px 32px -12px rgba(91, 61, 245, .6);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  /* A real spring curve where the browser supports linear() */
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #1b1733;
      --bg2: #0c0a18;
      --text: #ece9ff;
      --muted: #a39cd0;
      --surface: #1f1b38;
      --track: #302a57;
      --accent: #b5a2ff;
      --focus: #67e8f9;
      --shadow: 0 14px 36px -12px rgba(124, 92, 255, .75);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1b1733;
    --bg2: #0c0a18;
    --text: #ece9ff;
    --muted: #a39cd0;
    --surface: #1f1b38;
    --track: #302a57;
    --accent: #b5a2ff;
    --focus: #67e8f9;
    --shadow: 0 14px 36px -12px rgba(124, 92, 255, .75);
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body { overflow-x: hidden; } /* particles may fly past the edges */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 38%, var(--bg1), var(--bg2) 75%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px; }

  /* ---------- Button, ring and effects share one grid cell ---------- */
  .halo { position: relative; display: grid; place-items: center; width: 250px; height: 90px; }
  .halo > * { grid-area: 1 / 1; }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 220px;
    height: 62px;
    padding: 0;
    border: 0;
    border-radius: 31px;
    background: var(--surface);
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .01em;
    cursor: pointer;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: width .55s cubic-bezier(.7, 0, .3, 1), gap .4s, box-shadow .3s, transform .35s var(--spring);
  }
  /* Violet fill on its own layer so it can fade */
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #8b6bff 0%, #5b3df5 55%, #3f2bd1 100%);
    transition: opacity .35s;
  }
  /* Shine that sweeps across on hover */
  .btn::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent);
    transform: skewX(-20deg);
    pointer-events: none;
  }
  .btn:hover::after { animation: shine .9s ease-out; }
  .btn > * { position: relative; }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 20px 36px -14px rgba(91, 61, 245, .7); }
  .btn:active { transform: translateY(0) scale(.95); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 5px; }

  .ico { display: grid; place-items: center; width: 24px; height: 24px; flex: none; transition: opacity .25s, transform .35s var(--spring); }
  .ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .ico .tick { stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .4s .15s ease-out; }
  .ico .arrow { transition: opacity .2s; }
  .ico .shaft { transform-box: fill-box; transform-origin: 50% 0; }
  .btn:hover .arrow { animation: bob .8s ease-in-out infinite; }

  .label { display: inline-block; max-width: 160px; white-space: nowrap; overflow: hidden; transition: max-width .5s cubic-bezier(.7, 0, .3, 1), opacity .25s, transform .4s; }

  .pct {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 750;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transform: scale(.6);
    transition: opacity .25s, transform .5s var(--spring);
  }

  /* Progress ring: exactly on the edge of the round button */
  .ring { width: 62px; height: 62px; opacity: 0; pointer-events: none; overflow: visible; transform: rotate(-270deg) scale(.7); transition: opacity .3s, transform .8s var(--spring); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--track); }
  .ring .bar { stroke: url(#haloGradient); stroke-linecap: round; transition: stroke-dashoffset .3s ease-out; }
  .ring .head { transform-origin: 31px 31px; transition: transform .3s ease-out; }
  .ring .head circle { fill: #fff; stroke: #22d3ee; stroke-width: 2.5; filter: drop-shadow(0 0 4px #22d3ee); }

  /* Ripple ring that rushes outward at the finish */
  .ripple { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; pointer-events: none; }
  /* Soft glow that breathes while working */
  .glow { width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle, rgba(139, 107, 255, .45), transparent 70%); opacity: 0; transform: scale(1); pointer-events: none; }

  .fx { position: relative; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; width: 7px; height: 7px; border-radius: 2px; pointer-events: none; }

  /* ---------- States ---------- */
  /* working: shrink to a circle; the outline becomes the progress ring */
  .halo[data-state="working"] .btn { width: 62px; gap: 0; cursor: progress; box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .45); transform: none; }
  .halo[data-state="working"] .btn::before { opacity: 0; }
  .halo:is([data-state="working"], [data-state="done"]) .btn::after { display: none; }
  .halo:is([data-state="working"], [data-state="done"]) .label { max-width: 0; opacity: 0; transform: translateX(-14px); }
  .halo[data-state="working"] .ico { opacity: 0; transform: translateY(10px) scale(.4); }
  .halo[data-state="working"] .pct { opacity: 1; transform: none; transition-delay: .4s; }
  .halo[data-state="working"] .ring { opacity: 1; transform: rotate(-90deg); transition-delay: .3s; }
  .halo[data-state="working"] .glow { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }

  /* done: the circle fills, pops and shows a tick */
  .halo[data-state="done"] .btn { width: 62px; gap: 0; transform: none; animation: pop .6s var(--spring); }
  .halo[data-state="done"] .ripple { animation: ripple .7s ease-out; }
  .halo:is([data-state="done"], [data-state="saved"]) .arrow { opacity: 0; animation: none; }
  .halo:is([data-state="done"], [data-state="saved"]) .tick { stroke-dashoffset: 0; }
  .halo[data-state="done"] .ico { transform: scale(1.15); }

  /* saved: springs back open into a pill */
  .halo[data-state="saved"] .btn { transition: width .8s var(--spring), gap .4s, box-shadow .3s, transform .35s var(--spring); }
  .btn[aria-disabled="true"] { cursor: progress; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes shine { from { left: -60%; } to { left: 130%; } }
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(.86); } 100% { transform: scale(1); } }
  @keyframes ripple { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }
  @keyframes breathe { 0%, 100% { transform: scale(1.05); } 50% { transform: scale(1.45); } }

  /* ---------- File caption ---------- */
  .file { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
  .file svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .file b { color: var(--text); font-weight: 600; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .glow, .ripple, .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="halo" data-state="idle">
    <span class="glow" aria-hidden="true"></span>
    <span class="ripple" aria-hidden="true"></span>

    <svg class="ring" viewBox="0 0 62 62" aria-hidden="true">
      <defs>
        <linearGradient id="haloGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b6bff" />
          <stop offset="1" stop-color="#22d3ee" />
        </linearGradient>
      </defs>
      <circle class="track" cx="31" cy="31" r="29" />
      <circle class="bar" cx="31" cy="31" r="29" />
      <!-- Glowing head that rides the front of the progress -->
      <g class="head"><circle cx="60" cy="31" r="3.4" /></g>
    </svg>

    <button class="btn" type="button" aria-describedby="fileInfo">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <g class="arrow"><path class="shaft" d="M12 4v11" /><path d="M7 10.5l5 5 5-5M6 19.5h12" /></g>
          <path class="tick" d="M6 12.5l4 4 8-8.5" />
        </svg>
      </span>
      <span class="label">Download</span>
      <span class="pct" aria-hidden="true">0%</span>
    </button>

    <span class="fx" aria-hidden="true"></span>
  </div>

  <p class="file" id="fileInfo">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3" /></svg>
    <span><b>Annual-Report-2026.pdf</b> · 2.4 MB</span>
  </p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Halo download button ----------
  const halo = document.querySelector(".halo");
  const btn = halo.querySelector(".btn");
  const ico = halo.querySelector(".ico");
  const label = halo.querySelector(".label");
  const pct = halo.querySelector(".pct");
  const bar = halo.querySelector(".bar");
  const head = halo.querySelector(".head");
  const fx = halo.querySelector(".fx");
  const status = document.getElementById("status");

  const CIRCUMFERENCE = 2 * Math.PI * 29; // ring radius is 29
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 200) : ms));
  let busy = false;

  // Play a Web Animation and wait for it (skipped in calm mode)
  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Confetti-like sparks flying out from the centre
  function burst(count, spread) {
    if (calm()) return;
    const colors = ["#8b6bff", "#22d3ee", "#f472b6", "#facc15"];
    for (let i = 0; i < count; i++) {
      const p = document.createElement("i");
      p.className = "particle";
      p.style.background = colors[i % colors.length];
      if (i % 3 === 0) p.style.borderRadius = "50%";
      fx.appendChild(p);
      const a = (Math.PI * 2 * i) / count + Math.random() * .5;
      const d = spread * (.6 + Math.random() * .6);
      p.animate([
        { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d + 16).toFixed(1) + "px)) rotate(" + Math.round(Math.random() * 540 - 270) + "deg) scale(.2)", opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.15, .7, .35, 1)" }).onfinish = () => p.remove();
    }
  }

  // Slide the old words up and the new ones in from below
  async function swapLabel(text) {
    await play(label, [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-10px)", opacity: 0 }], { duration: 140, easing: "ease-in" });
    label.textContent = text;
    play(label, [{ transform: "translateY(10px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 420, easing: SPRING });
  }

  bar.style.strokeDasharray = CIRCUMFERENCE;
  setProgress(0);

  // Move the ring, its glowing head and the number together
  function setProgress(p) {
    bar.style.strokeDashoffset = CIRCUMFERENCE * (1 - p / 100);
    head.style.transform = "rotate(" + (p * 3.6).toFixed(1) + "deg)";
    head.style.opacity = p > 0 && p < 100 ? 1 : 0;
    pct.textContent = Math.round(p) + "%";
  }

  // Fake download: uneven chunks feel like a real network
  function simulateDownload(onTick) {
    return new Promise((resolve) => {
      let p = 0;
      (function step() {
        p = Math.min(100, p + 2 + Math.random() * 7);
        onTick(p);
        if (p >= 100) resolve();
        else setTimeout(step, 110 + Math.random() * 120);
      })();
    });
  }

  btn.addEventListener("click", async () => {
    if (busy) return; // ignore clicks while working
    busy = true;
    btn.setAttribute("aria-disabled", "true");
    setProgress(0);

    // 1. Anticipation: the pill squashes and the arrow dips
    await Promise.all([
      play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.05, .86)" }, { transform: "scale(.98, 1.04)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" }),
      play(ico, [{ transform: "translateY(0)" }, { transform: "translateY(5px)" }, { transform: "translateY(-2px)" }], { duration: 300, easing: "ease-in-out" })
    ]);

    // 2. Shrink into a circle; the ring spins into place
    halo.dataset.state = "working";
    status.textContent = "Download started.";
    await wait(520);

    // 3. Progress: ring, head and number move together
    let spoken = 0;
    await simulateDownload((p) => {
      setProgress(p);
      if (p - spoken >= 25 && p < 100) {
        spoken = Math.floor(p / 25) * 25;
        status.textContent = "Downloading, " + spoken + " percent.";
      }
    });
    await wait(250);

    // 4. Finish: the circle fills, pops, ripples, sparks fly, a tick draws
    halo.dataset.state = "done";
    burst(18, 70);
    status.textContent = "Download complete. Annual-Report-2026.pdf is saved.";
    await wait(1000);

    // 5. Spring back open into a pill that says Saved
    halo.dataset.state = "saved";
    label.textContent = "Saved";
    play(label, [{ transform: "translateX(-10px)", opacity: 0 }, { transform: "translateX(0)", opacity: 1 }], { duration: 500, delay: 200, easing: SPRING, fill: "backwards" });
    await wait(2300);

    // 6. Reset for the next file
    await swapLabel("Download");
    halo.dataset.state = "idle";
    setProgress(0);
    btn.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
