<!doctype html>
<!-- Chill & Craft · Foldaway · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foldaway · paper fold code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #efe7d8;
    --sheet: #fffdf7;
    --rule: rgba(15, 118, 110, .09);
    --margin: rgba(242, 107, 79, .35);
    --ink: #2b2620;
    --muted: #7a7064;
    --tile: #ffffff;
    --tile-edge: #e2d8c6;
    --fold: #e9dfcc;
    --back: #f5d9a8;
    --teal: #0f766e;
    --coral: #e8573a;
    --shadow: rgba(80, 60, 30, .18);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #17140f;
    --sheet: #24201a;
    --rule: rgba(79, 209, 197, .07);
    --margin: rgba(255, 140, 110, .3);
    --ink: #f3ece0;
    --muted: #b3a894;
    --tile: #302a22;
    --tile-edge: #463d31;
    --fold: #4a4134;
    --back: #8a6a3c;
    --teal: #4fd1c5;
    --coral: #ff8a6b;
    --shadow: rgba(0, 0, 0, .45);
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--stage);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* A sheet of lined note paper */
  .sheet {
    position: relative;
    width: min(100%, 410px);
    padding: 26px 22px 22px 34px;
    border-radius: 6px 6px 6px 26px;
    background:
      linear-gradient(90deg, transparent 22px, var(--margin) 22px 23.5px, transparent 23.5px),
      repeating-linear-gradient(180deg, transparent 0 27px, var(--rule) 27px 28px),
      var(--sheet);
    box-shadow: 0 1px 0 var(--tile-edge), 0 18px 40px -18px var(--shadow), 6px 6px 0 -2px var(--fold);
  }
  .crane { display: block; width: 74px; height: 50px; margin-bottom: 6px; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-3deg); } }
  /* On success the crane takes a little flight */
  .sheet.win .crane { animation: fly 1.8s cubic-bezier(.45, 0, .3, 1); }
  @keyframes fly {
    25% { transform: translate(40px, -22px) rotate(-10deg) scale(1.1); }
    55% { transform: translate(110px, -8px) rotate(6deg) scale(.95); }
    80% { transform: translate(30px, -12px) rotate(-4deg); }
  }
  h1 { margin: 0 0 4px; font-family: ui-serif, Georgia, "Times New Roman", serif; font-size: clamp(21px, 5.6vw, 26px); }
  .sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

  /* ---------- Paper tiles ---------- */
  .row {
    position: relative;
    display: flex;
    gap: clamp(8px, 2.8vw, 12px);
    margin: 24px 0 10px;
    perspective: 800px;
  }
  .tile {
    position: relative;
    width: clamp(52px, 15vw, 62px);
    height: 68px;
    flex: none;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform .5s cubic-bezier(.55, 0, .25, 1), opacity .25s;
    transition-delay: calc((3 - var(--i)) * .22s);
  }
  .tile input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 1.5px solid var(--tile-edge);
    border-radius: 10px 2px 10px 10px;
    background: var(--tile);
    color: var(--ink);
    caret-color: var(--coral);
    text-align: center;
    font: 700 28px/1 ui-serif, Georgia, "Times New Roman", serif;
    box-shadow: 0 3px 0 var(--tile-edge), 0 8px 14px -8px var(--shadow);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .tile input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 30%, transparent), 0 3px 0 var(--tile-edge); }
  .tile input:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); }
  .tile.filled input { border-color: var(--teal); color: var(--teal); -webkit-text-fill-color: var(--teal); }
  .tile input:hover:not(:focus):not(:disabled) { border-color: color-mix(in srgb, var(--teal) 50%, var(--tile-edge)); transform: translateY(-2px); }
  .tile input { transition: border-color .2s, box-shadow .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1); }

  /* Each digit turns in like a page, with a springy settle */
  .tile.pop { animation: pageIn .6s cubic-bezier(.34, 1.4, .64, 1); }
  @keyframes pageIn {
    0% { transform: rotateY(-180deg); }
    100% { transform: none; }
  }
  /* Folded corner on the front */
  .tile::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 15px;
    height: 15px;
    background: linear-gradient(225deg, var(--sheet) 50%, var(--fold) 50%);
    border-bottom-left-radius: 4px;
    transform: translateZ(1px);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
  }
  /* The back of the paper, seen while it folds */
  .tile::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 2px 10px 10px 10px;
    background: repeating-linear-gradient(135deg, var(--back) 0 6px, color-mix(in srgb, var(--back) 80%, #fff) 6px 12px);
    transform: rotateY(180deg);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
  }

  /* Step 1: tiles fold one by one onto the first tile */
  .row.fold .tile:not(:first-child) { transform: translateX(var(--fx)) rotateY(-180deg); }
  /* Step 2: the folded stack slides to the middle */
  .row.center .tile { transition-delay: 0s; }
  .row.center .tile:first-child { transform: translateX(var(--cx)); }
  .row.center .tile:not(:first-child) { transform: translateX(calc(var(--fx) + var(--cx))) rotateY(-180deg); }
  /* Step 3: the stack turns over and shows the check */
  .row.solved .tile { opacity: 0; transform: translateX(var(--cx)) rotateY(90deg); transition-delay: 0s; }
  .check {
    position: absolute;
    left: 50%;
    top: 0;
    width: clamp(52px, 15vw, 62px);
    height: 68px;
    margin-left: calc(clamp(52px, 15vw, 62px) / -2);
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--teal);
    box-shadow: 0 10px 20px -8px var(--shadow);
    transform: rotateY(-90deg);
    opacity: 0;
    transition: transform .4s ease .2s, opacity .1s .2s;
    pointer-events: none;
  }
  .row.solved .check { transform: none; opacity: 1; animation: checkBounce .7s cubic-bezier(.34, 1.56, .64, 1) .6s; }
  @keyframes checkBounce { 35% { transform: scale(1.22) rotate(-6deg); } 65% { transform: scale(.94) rotate(2deg); } }
  .check svg { width: 34px; height: 34px; }

  /* Wrong code: the paper rustles in coral */
  .row.miss { animation: rustle .5s ease; }
  .row.miss input { border-color: var(--coral); }
  @keyframes rustle {
    20% { transform: skewX(-6deg) translateX(-6px); }
    45% { transform: skewX(5deg) translateX(6px); }
    70% { transform: skewX(-2deg) translateX(-3px); }
  }

  /* ---------- Status, hint and buttons ---------- */
  .status { min-height: 22px; margin: 14px 0 2px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--teal); }
  .status[data-tone="bad"] { color: var(--coral); }
  .hint { margin: 6px 0 16px; font-size: 14px; color: var(--muted); }
  .hint b {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 16px;
    letter-spacing: .25em;
    color: var(--ink);
    background: linear-gradient(transparent 55%, color-mix(in srgb, var(--coral) 35%, transparent) 55%);
    padding: 0 2px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  .ghost { background: transparent; border: 1.5px dashed var(--tile-edge); color: var(--ink); }
  .ghost:disabled { opacity: .55; cursor: default; }
  .solid { border: 0; background: var(--teal); color: var(--sheet); box-shadow: 0 3px 0 color-mix(in srgb, var(--teal) 60%, #000); }
  button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, border-color .2s; }
  button:hover:not(:disabled) { transform: translateY(-2px) rotate(-1deg); }
  .ghost:hover:not(:disabled) { border-color: var(--teal); }
  button:active:not(:disabled) { transform: translateY(2px) scale(.96); box-shadow: none; transition-duration: .08s; }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Celebration particles: paper confetti ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; width: 9px; height: 14px; border-radius: 1px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="sheet" id="sheet">
    <!-- A small paper crane, drawn with flat shapes -->
    <svg class="crane" viewBox="0 0 74 50" aria-hidden="true">
      <polygon points="4,34 30,30 22,44" fill="var(--coral)" opacity=".75"/>
      <polygon points="22,44 30,30 52,36" fill="var(--coral)"/>
      <polygon points="30,30 40,4 52,36" fill="var(--teal)"/>
      <polygon points="40,4 56,22 52,36" fill="var(--teal)" opacity=".7"/>
      <polygon points="52,36 62,14 70,16 58,38" fill="var(--coral)" opacity=".85"/>
    </svg>
    <h1 id="title">Enter the 4-digit code</h1>
    <p class="sub">We sent it by text to 0333 ••• 1290.</p>

    <!-- Four paper tiles. Each tile wraps one real input. -->
    <div class="row" id="row" role="group" aria-labelledby="title" aria-describedby="hint">
      <span class="tile" style="--i:0"><input inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 4"></span>
      <span class="tile" style="--i:1"><input inputmode="numeric" autocomplete="off" aria-label="Digit 2 of 4"></span>
      <span class="tile" style="--i:2"><input inputmode="numeric" autocomplete="off" aria-label="Digit 3 of 4"></span>
      <span class="tile" style="--i:3"><input inputmode="numeric" autocomplete="off" aria-label="Digit 4 of 4"></span>
      <span class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--sheet)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Demo code: <b id="demo"></b></p>
    <div class="actions">
      <button type="button" class="ghost" id="resend">Text me a new code</button>
      <button type="button" class="solid" id="again" hidden>Unfold and try again</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const row = document.getElementById("row");
  const tiles = Array.from(row.querySelectorAll(".tile"));
  const boxes = tiles.map((t) => t.querySelector("input"));
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");
  let demo = "";
  let busy = false;

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo;
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    restart(statusEl, "pop");
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;              // reflow so the animation plays again
    el.classList.add(cls);
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    tiles[i].classList.toggle("filled", d !== "");
    if (d) {
      restart(tiles[i], "pop");       // the tile turns in like a page
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
    }
  }

  // ---- Celebration: paper confetti that flutters down ----
  const fx = document.getElementById("fx");
  const sheet = document.getElementById("sheet");
  const PAPER = ["#0f766e", "#e8573a", "#f5d9a8", "#4fd1c5", "#ff8a6b", "#fffdf7"];
  function confetti(from) {
    if (reduce) return;
    const r = from.getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    for (let n = 0; n < 46; n++) {
      const p = document.createElement("i");
      p.style.background = PAPER[n % PAPER.length];
      fx.append(p);
      const dx = (Math.random() - 0.5) * 340;
      const up = 90 + Math.random() * 140;
      const flip = 360 + Math.random() * 720;
      const at = "translate(" + (x0 - 4) + "px," + (y0 - 7) + "px)";
      p.animate([
        { transform: at + " rotateX(0) rotate(0deg) scale(.4)", opacity: 1 },
        { transform: "translate(" + (x0 + dx * 0.6) + "px," + (y0 - up) + "px) rotateX(" + flip / 2 + "deg) rotate(90deg) scale(1)", opacity: 1, offset: 0.35 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + 180) + "px) rotateX(" + flip + "deg) rotate(260deg) scale(.9)", opacity: 0 }
      ], { duration: 1700 + Math.random() * 800, easing: "cubic-bezier(.25, .6, .4, 1)" }).onfinish = () => p.remove();
    }
  }
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // ---- Fold the tiles into one check mark ----
  function measure() {
    // --fx: how far a tile moves so that, folded over its left edge, it lands on tile 1
    // --cx: how far the folded stack moves to reach the middle of the row
    // (layout positions, so running animations do not disturb the numbers)
    const first = tiles[0];
    tiles.forEach((tile) => {
      tile.style.setProperty("--fx", first.offsetLeft + first.offsetWidth - tile.offsetLeft + "px");
      tile.style.setProperty("--cx", row.clientWidth / 2 - (first.offsetLeft + first.offsetWidth / 2) + "px");
    });
  }

  async function verify(code) {
    busy = true;
    setLocked(true);
    say("Checking your code…");
    await wait(650);

    if (code === demo) {
      // Stage 1: tiles fold one by one. Stage 2: the stack slides to the middle.
      // Stage 3: it turns over into a check. Stage 4: confetti and a crane flight.
      measure();
      say("Folding it up…");
      row.classList.add("fold");
      await wait(1050);
      row.classList.add("center");
      await wait(450);
      row.classList.add("solved");
      say("All folded up: you're verified!", "good");
      await wait(550);
      confetti(row.querySelector(".check"));
      sheet.classList.add("win");
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      say("Those numbers don't match. Have another go.", "bad");
      row.classList.add("miss");
      await wait(550);
      row.classList.remove("miss");
      clearAll();
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", async () => {
    againBtn.hidden = true;
    sheet.classList.remove("win");
    row.classList.remove("solved", "center", "fold");   // tiles unfold back into place
    clearAll();
    newCode();
    say("Unfolded. A new demo code is ready.");
    await wait(900);
    busy = false;
    setLocked(false);
    focusBox(0);
  });

  let cooldown = 0;
  resendBtn.addEventListener("click", () => {
    if (busy || cooldown) return;
    newCode();
    clearAll();
    say("A new code is on its way.");
    focusBox(0);
    cooldown = 15;
    resendBtn.disabled = true;
    resendBtn.textContent = "New code in 15s";
    const tick = setInterval(() => {
      cooldown--;
      resendBtn.textContent = cooldown ? "New code in " + cooldown + "s" : "Text me a new code";
      if (!cooldown) { clearInterval(tick); resendBtn.disabled = false; }
    }, 1000);
  });

  newCode();
})();
</script>
</body>
</html>
