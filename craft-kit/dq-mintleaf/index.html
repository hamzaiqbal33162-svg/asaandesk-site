<html lang="en">
<head>
<meta charset="utf-8">

<title>Mintleaf · Family budget</title>
<meta name="description" content="Mintleaf: a calm budgeting app for a young family, with cash envelopes, a bills calendar, goals and net worth.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: fresh mint on a soft charcoal ink ---------- */
  :root {
    --bg: #e9f4ee; --bg-a: rgba(140, 222, 190, .55); --bg-b: rgba(255, 238, 205, .7); --bg-c: #f1f5ec;
    --card: rgba(255, 255, 255, .72); --card-solid: #fbfdfc; --card-2: #f2f8f5; --well: #e4eee9; --edge: rgba(255, 255, 255, .85);
    --ink: #222829; --ink-2: #3c4547; --muted: #66736f; --faint: #9ba8a3;
    --line: rgba(34, 40, 41, .08); --line-2: rgba(34, 40, 41, .15); --grid: rgba(34, 40, 41, .07);
    --mint: #7bd9b6; --mint-2: #a8ead0; --mint-soft: #d6f3e7; --mint-ink: #0e6a4e; --mint-deep: #1a9470;
    --char: #262c2d; --char-2: #343b3c; --char-3: #485052; --char-ink: #f1f7f4; --char-mute: #a5b2ae;
    --accent: #1a9470; --accent-2: #2fb38a; --accent-soft: #d6f3e7; --accent-ink: #fff;
    --coral: #e46f57; --coral-soft: #fbe2da; --coral-ink: #a63a25; --amber: #d8962a; --amber-soft: #f8ebcf; --amber-ink: #8a5a0c;
    --good: #1a9470; --good-soft: #d6f3e7; --bad: #d65740; --bad-soft: #fbe2da; --warn: #c9861d;
    --note-a: #eef3dc; --note-b: #cfe4bf; --note-ink: rgba(36, 84, 52, .45);
    --shadow: 0 1px 2px rgba(22, 44, 36, .04), 0 10px 26px -16px rgba(22, 44, 36, .2);
    --shadow-lift: 0 2px 6px rgba(22, 44, 36, .06), 0 22px 40px -20px rgba(22, 44, 36, .34);
    --radius: 16px; --radius-sm: 11px;
    --surface: #ffffff; --surface-2: #f1f6f3; --panel: #fbfdfc;
    --tip-bg: #222829; --tip-ink: #fff; --overlay: rgba(20, 32, 28, .32); --focus: #1a9470;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #141918; --bg-a: rgba(64, 190, 145, .16); --bg-b: rgba(120, 160, 150, .1); --bg-c: #171c1b;
    --card: rgba(34, 41, 40, .78); --card-solid: #222928; --card-2: #273030; --well: #2c3534; --edge: rgba(255, 255, 255, .06);
    --ink: #e8f0ec; --ink-2: #c9d4cf; --muted: #95a39e; --faint: #6b7975;
    --line: rgba(220, 240, 232, .08); --line-2: rgba(220, 240, 232, .15); --grid: rgba(220, 240, 232, .07);
    --mint: #6fdcb3; --mint-2: #8fe6c4; --mint-soft: rgba(111, 220, 179, .14); --mint-ink: #8ff0cb; --mint-deep: #5fd3a8;
    --char: #e9f2ee; --char-2: #d5e0db; --char-3: #b8c6c0; --char-ink: #162020; --char-mute: #52605c;
    --accent: #6fdcb3; --accent-2: #8fe6c4; --accent-soft: rgba(111, 220, 179, .14); --accent-ink: #0f1d18;
    --coral: #f08a73; --coral-soft: rgba(240, 138, 115, .15); --coral-ink: #ffb3a1; --amber: #eab45a; --amber-soft: rgba(234, 180, 90, .14); --amber-ink: #f6cf8c;
    --good: #6fdcb3; --good-soft: rgba(111, 220, 179, .14); --bad: #f08a73; --bad-soft: rgba(240, 138, 115, .15); --warn: #eab45a;
    --note-a: #c9d9b6; --note-b: #9fbf93; --note-ink: rgba(20, 50, 30, .5);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 24px 44px -20px rgba(0, 0, 0, .85);
    --surface: #222928; --surface-2: #2a3231; --panel: #1e2524;
    --tip-bg: #eaf3ef; --tip-ink: #18201e; --overlay: rgba(3, 8, 6, .6); --focus: #8fe6c4;
    color-scheme: dark;
  }
/* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
*, *::before, *::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
/* no sideways page scroll, whatever a wide header or an entrance animation does */
body{margin:0;overflow-x:clip;}
button, input, select, textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em;}
:focus-visible{outline:2px solid var(--focus, var(--accent));outline-offset:2px;}
.cc-av{--h:200;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;font-size:.8em;font-weight:700;color:hsl(var(--h) 60% 22%);background:hsl(var(--h) 70% 84%);flex:none;letter-spacing:.02em;}
[data-theme="dark"] .cc-av{color:hsl(var(--h) 80% 88%);background:hsl(var(--h) 35% 28%);}

/* Buttons used by dialogs (apps restyle .btn to fit their look) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:38px;padding:0 16px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;transition:transform .12s, background .2s, box-shadow .2s, border-color .2s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:translateY(1px) scale(.97);}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink, #fff);}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -8px var(--accent);}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:30px;padding:0 11px;font-size:.86em;}
.btn[disabled]{opacity:.5;pointer-events:none;}

/* Toasts */
.cc-toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:grid;gap:8px;width:min(340px, calc(100vw - 32px));pointer-events:none;}
.cc-toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm, 10px);background:var(--tip-bg, #111);color:var(--tip-ink, #fff);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-size:.92rem;animation:ccToast .35s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto;}
.cc-toast .ic{color:var(--good);}
.cc-toast.bad .ic{color:var(--bad);}
.cc-toast.warn .ic{color:var(--warn);}
.cc-toast.out{animation:ccToastOut .3s ease forwards;}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.96);}}
@keyframes ccToastOut{to{opacity:0;transform:translateX(30px);}}

/* Modal + drawer */
.cc-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;}
.cc-back{position:absolute;inset:0;background:var(--overlay, rgba(10,12,20,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;}
.cc-dialog{position:relative;width:min(480px, 100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel, var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius, 16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1);}
.cc-dialog.wide{width:min(720px, 100%);}
.cc-overlay.open .cc-back{opacity:1;}
.cc-overlay.open .cc-dialog{opacity:1;transform:none;}
.cc-overlay.is-drawer{place-items:stretch end;padding:0;}
.cc-overlay.is-drawer .cc-dialog{width:min(440px, 100%);height:100%;max-height:none;border-radius:var(--radius, 16px) 0 0 var(--radius, 16px);transform:translateX(40px);}
.cc-overlay.is-drawer.open .cc-dialog{transform:none;}
.cc-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:1;}
.cc-dh h2{margin:0;font-size:1.12rem;}
.cc-x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;}
.cc-x:hover{background:var(--surface-2);}
.cc-db{padding:8px 20px 20px;}
.cc-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap;}
.cc-db .cc-df{padding:14px 0 0;}
.cc-confirm{margin:6px 0 0;color:var(--muted);line-height:1.5;}
.cc-picks{display:grid;gap:6px;}
.cc-pick{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);}
.cc-pick:hover, .cc-pick:focus-visible{border-color:var(--accent);}
.cc-pick small{margin-left:auto;color:var(--muted);}

/* Forms */
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.cc-field{display:grid;gap:5px;grid-column:span 2;}
.cc-field.half{grid-column:span 1;}
.cc-field label{font-size:.84rem;font-weight:600;color:var(--muted);}
.cc-field input, .cc-field select, .cc-field textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
.cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
.cc-field [aria-invalid="true"]{border-color:var(--bad);}
.cc-err{color:var(--bad);font-size:.8rem;min-height:0;}
.cc-err:empty{display:none;}
.cc-hint{color:var(--muted);font-size:.78rem;}
.cc-intro{margin:0 0 12px;color:var(--muted);}
.cc-form.shake{animation:ccShake .35s;}
@keyframes ccShake{25%{transform:translateX(-6px);} 50%{transform:translateX(5px);} 75%{transform:translateX(-3px);}}
@media (max-width:480px){.cc-field.half{grid-column:span 2;}}

/* Popover + tooltip */
.cc-pop{position:fixed;z-index:85;max-height:70vh;overflow:auto;background:var(--panel, var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm, 12px);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px);transition:opacity .2s, transform .25s;}
.cc-pop.open{opacity:1;transform:none;}
.cc-tip{position:fixed;z-index:95;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg, #111);color:var(--tip-ink, #fff);font-size:.8rem;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;}
.cc-tip.on{opacity:1;}
.cc-tip b{display:block;margin-bottom:3px;}
.cc-tip div{display:flex;align-items:center;gap:6px;}
.cc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.cc-tip em{margin-left:auto;padding-left:10px;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;}

/* Command search */
.cc-cmdk .cc-dialog{align-self:start;margin-top:10vh;}
.cc-cmdk-q{width:100%;min-height:46px;padding:0 14px;border-radius:var(--radius-sm, 10px);border:1px solid var(--accent);background:var(--surface-2);font-size:1rem;}
.cc-cmdk-q:focus{outline:none;}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto;}
.cc-cmdk-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;}
.cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover{background:var(--surface-2);color:var(--accent);}
.cc-cmdk-list small{margin-left:auto;color:var(--muted);}
.cc-cmdk-foot{margin:10px 0 0;font-size:.76rem;color:var(--muted);}
.cc-cmdk-foot kbd{padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid var(--line);font-family:inherit;}
.cc-empty-li{color:var(--muted);cursor:default !important;}

/* Data table */
.cc-tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
.cc-search{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:320px;min-height:38px;padding:0 12px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);}
.cc-search:focus-within{border-color:var(--accent);}
.cc-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap;}
.cc-chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;transition:background .2s, color .2s;}
.cc-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink, #fff);border-color:transparent;}
.cc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cc-tbl table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px;}
.cc-tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.cc-tbl th button{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;}
.cc-tbl th svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5;}
.cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg{opacity:1;color:var(--accent);}
.cc-tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.cc-tbl tbody tr{animation:ccRow .35s both;animation-delay:calc(var(--r, 0) * 25ms);transition:background .15s;}
.cc-tbl tbody tr[tabindex="0"]{cursor:pointer;}
.cc-tbl tbody tr[tabindex="0"]:hover{background:var(--surface-2);}
.cc-tbl .r, .cc-tbl th.r{text-align:right;font-variant-numeric:tabular-nums;}
.cc-tbl th.r button{flex-direction:row-reverse;}
@keyframes ccRow{from{opacity:0;transform:translateY(6px);}}
.cc-pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.84rem;color:var(--muted);}
.cc-pages{display:flex;gap:4px;align-items:center;}
.cc-pages button{min-width:32px;height:32px;padding:0 6px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);}
.cc-pages button[aria-current="page"]{background:var(--accent);color:var(--accent-ink, #fff);border-color:transparent;}
.cc-pages button:disabled{opacity:.4;cursor:default;}
.cc-empty{display:grid;place-items:center;align-content:center;gap:6px;padding:28px 12px;text-align:center;color:var(--muted);}
.cc-empty .ic{width:30px;height:30px;opacity:.6;}
.cc-empty b{color:var(--ink);}

/* Charts */
.cc-chart{display:block;overflow:visible;}
.cc-chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums;}
.cc-grid line{stroke:var(--grid, var(--line));stroke-dasharray:3 4;}
.cc-zero{stroke:var(--line);}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards;}
.cc-fade{animation:ccFade .9s .3s both;}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both;transition:opacity .2s;}
.cc-bar.neg{transform-origin:50% 0;}
.cc-cell{animation:ccPop .5s both;transform-box:fill-box;transform-origin:center;}
.cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell{animation:none;stroke-dashoffset:0;}
.cc-guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;}
.cc-guide.on{opacity:.7;}
.cc-dot{opacity:0;stroke:var(--surface);stroke-width:2;}
.cc-dot.on{opacity:1;}
.cc-hit.on{fill:var(--ink);fill-opacity:.05;}
@keyframes ccDraw{to{stroke-dashoffset:0;}}
@keyframes ccFade{from{opacity:0;}}
@keyframes ccGrow{from{transform:scaleY(0);}}
@keyframes ccPop{from{opacity:0;transform:scale(.4);}}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted);}
.cc-legend span{display:inline-flex;align-items:center;gap:6px;}
.cc-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
.cc-spark{display:block;overflow:visible;}
.cc-spark .cc-line{stroke-width:1.8;}

/* Page entrance (apps can swap the keyframes via --enter) */
.cc-in{animation:var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 55ms);}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985);}}

/* Reduced motion:everything still works, without big movement */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
  .cc-draw{stroke-dashoffset:0;}
}


/* ===================== Mintleaf: app styles ===================== */
:root{--dial-bg:#262c2d;--dial-2:#323a3b;--dial-ink:#f1f7f4;--dial-mute:#9fb0aa;--dial-track:rgba(255,255,255,.09);}
[data-theme="dark"]{--dial-bg:#0e1312;--dial-2:#18201e;--dial-ink:#eaf3ef;--dial-mute:#8a9a94;--dial-track:rgba(255,255,255,.07);}
html{background:var(--bg);}
body{font:13px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(1100px 620px at 88% -8%, var(--bg-a), transparent 62%), radial-gradient(900px 640px at -12% 104%, var(--bg-b), transparent 60%), linear-gradient(165deg, var(--bg) 10%, var(--bg-c) 90%);
  background-attachment:fixed;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
h1, h2, h3, p{margin:0;}
.muted{color:var(--muted);}
.num, .tab{font-variant-numeric:tabular-nums;}
.pos{color:var(--mint-deep);}
.neg{color:var(--coral-ink);}
[data-theme="dark"] .neg{color:var(--coral);}

/* ---------- Buttons ---------- */
.btn{min-height:36px;padding:0 15px;border-radius:999px;background:var(--card);border-color:var(--line-2);font-size:13px;}
.btn .ic{width:15px;height:15px;}
.btn.primary{background:var(--char);color:var(--char-ink);}
.btn.primary:hover{box-shadow:0 8px 20px -10px rgba(20,30,28,.6);filter:none;background:var(--char-2);}
.btn.mint{background:var(--mint);border-color:transparent;color:#0f2c22;}
.btn.mint:hover{background:var(--mint-2);}
.btn.sm{min-height:30px;padding:0 12px;font-size:12px;}
.btn.ghost{background:transparent;}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--card);color:var(--ink);position:relative;transition:transform .15s, background .2s;box-shadow:var(--shadow);}
.icon-btn:hover{transform:translateY(-1px);}
.icon-btn .ic{width:17px;height:17px;}
.mini-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:background .2s, transform .15s, color .2s;}
.mini-btn:hover{background:var(--char);color:var(--char-ink);transform:rotate(-8deg);}
.mini-btn .ic{width:14px;height:14px;}
.cc-chip{min-height:30px;background:var(--card);border-color:var(--line);color:var(--ink-2);font-size:12px;}
.cc-chip[aria-pressed="true"]{background:var(--char);color:var(--char-ink);}
.cc-chip em{font-style:normal;margin-left:5px;opacity:.6;font-weight:600;}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 28px;transition:background .3s, box-shadow .3s, padding .3s;}
.top.scrolled{background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 1px 0 var(--line);padding-top:10px;padding-bottom:10px;}
.brand{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 8px;border-radius:999px;background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow);font-size:16px;letter-spacing:-.02em;flex:none;}
.brand svg{width:28px;height:28px;}
.brand b{font-weight:650;}
.nav{position:relative;display:flex;align-items:center;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow);margin:0 auto;}
.navl{display:flex;gap:2px;}
.navl a{position:relative;z-index:1;display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;color:var(--ink-2);font-weight:560;white-space:nowrap;transition:color .25s;}
.navl a:hover{color:var(--ink);}
.navl a[aria-current="page"]{color:var(--char-ink);}
.nav .mark{position:absolute;left:0;top:4px;height:34px;border-radius:999px;background:var(--char);transition:transform .45s cubic-bezier(.3,1.25,.45,1), width .45s cubic-bezier(.3,1.25,.45,1), opacity .2s;}
.nav .mark::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--mint);}
.navl a[aria-current="page"]{padding-right:22px;}
.tr{display:flex;align-items:center;gap:8px;flex:none;}
.qs{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 13px;border-radius:999px;border:1px solid var(--edge);background:var(--card);box-shadow:var(--shadow);color:var(--muted);font-size:12.5px;}
.qs .ic{width:15px;height:15px;}
.qs kbd{font-family:inherit;font-weight:600;font-size:10.5px;line-height:1;padding:5px 7px;border-radius:999px;background:var(--well);color:var(--muted);}
.pill-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:12.5px;transition:background .2s, color .2s;}
.pill-btn .ic{width:16px;height:16px;}
.pill-btn[aria-current="page"]{background:var(--char);color:var(--char-ink);}
.dotn{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--mint);color:#0f2c22;font-size:10px;font-weight:750;display:grid;place-items:center;border:2px solid var(--bg);}
.dotn:empty{display:none;}
.me-btn{padding:0;border:2px solid var(--edge);border-radius:50%;background:none;box-shadow:var(--shadow);}
.t-sun, .t-moon{display:grid;}
[data-theme="dark"] .t-sun, [data-theme="light"] .t-moon{display:none;}
.menu-btn{display:none;}

/* People: photo faces cropped from the family photo with object-position + zoom */
.face{--s:32px;position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;background:var(--well);vertical-align:middle;}
.face img{width:100%;height:100%;object-fit:cover;display:block;}
.face.ring{box-shadow:0 0 0 2px var(--card-solid);}
.stack{display:inline-flex;}
.stack .face{margin-left:-8px;box-shadow:0 0 0 2px var(--card-solid);}
.stack .face:first-child{margin-left:0;}

/* ---------- Mobile drawer + bottom bar ---------- */
.scrim{position:fixed;inset:0;z-index:55;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-nav{position:fixed;z-index:60;top:0;left:0;bottom:0;width:min(300px, 86vw);padding:18px 14px;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:4px;overflow:auto;}
.drawer-nav .brand{box-shadow:none;margin-bottom:12px;align-self:flex-start;}
.drawer-nav a.dl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--ink-2);}
.drawer-nav a.dl[aria-current="page"]{background:var(--char);color:var(--char-ink);}
.nav-open .scrim{opacity:1;pointer-events:auto;}
.nav-open .drawer-nav{transform:none;}
.bbar{display:none;}

/* ---------- Page frame ---------- */
.view{padding:6px 28px 40px;outline:none;max-width:1680px;margin:0 auto;}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:6px 0 16px;flex-wrap:wrap;}
.ph h1{font-size:32px;line-height:1.1;font-weight:520;letter-spacing:-.035em;}
.ph h1 em{font-style:normal;color:var(--mint-deep);}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:550;flex-wrap:wrap;}
.eyebrow .dotsep{width:3px;height:3px;border-radius:50%;background:var(--faint);}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sub{color:var(--muted);margin-top:6px;max-width:640px;}

/* ---------- Cards ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);min-width:0;transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:30px;}
.card-h h2{font-size:15px;font-weight:620;letter-spacing:-.015em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.card-h h2 small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;}
.card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.link{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12.5px;color:var(--mint-ink);white-space:nowrap;}
.link .ic{width:13px;height:13px;transition:transform .2s;}
.link:hover .ic{transform:translateX(3px);}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:var(--well);}
.seg button{white-space:nowrap;height:26px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:650;transition:background .2s, color .2s;}
.seg button[aria-pressed="true"]{background:var(--card-solid);color:var(--ink);box-shadow:0 1px 3px rgba(20,40,32,.14);}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--well);color:var(--ink-2);font-size:11px;font-weight:650;white-space:nowrap;}
.tag .ic{width:12px;height:12px;}
.tag.mint{background:var(--mint-soft);color:var(--mint-ink);}
.tag.coral{background:var(--coral-soft);color:var(--coral-ink);}
.tag.amber{background:var(--amber-soft);color:var(--amber-ink);}
.tag.dark{background:var(--char);color:var(--char-ink);}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;}
.bar{height:6px;border-radius:999px;background:var(--well);overflow:hidden;}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--mint-deep);transition:width 1s cubic-bezier(.2,.8,.2,1);}
.bar.thin{height:4px;}
.bar i.coral{background:var(--coral);}
.bar i.amber{background:var(--amber);}
.tile{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--well);color:var(--ink-2);flex:none;}
.tile .ic{width:16px;height:16px;}
.rows{display:grid;}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0;}
.row:first-child{border-top:0;}
.row .tx{flex:1;min-width:0;display:grid;}
.row .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .tx small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;}
.kpi{display:grid;gap:2px;}
.kpi small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi small .ic{width:13px;height:13px;}
.kpi b{font-size:22px;font-weight:560;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.delta{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 7px;border-radius:999px;background:var(--mint-soft);color:var(--mint-ink);font-size:11px;font-weight:700;}
.delta.down{background:var(--coral-soft);color:var(--coral-ink);}
.delta .ic{width:11px;height:11px;}
.empty-s{padding:18px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--line-2);border-radius:12px;}

/* ---------- Money flow strip (income split into bills, envelopes, goals, to assign) ---------- */
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;margin-bottom:16px;}
.flow-bar{display:flex;gap:6px;min-width:0;}
.fseg{flex:var(--g) 1 0;min-width:72px;display:grid;gap:6px;transition:flex-grow 1.1s cubic-bezier(.2,.8,.2,1);}
.fseg > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fseg .pp{height:34px;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:650;font-size:12.5px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;}
.fseg .pp small{font-weight:550;opacity:.7;}
.fseg.bills .pp{background:var(--char);color:var(--char-ink);}
.fseg.envs .pp{background:var(--mint);color:#0f2c22;}
.fseg.goals .pp{background:repeating-linear-gradient(-45deg, var(--mint-soft) 0 6px, color-mix(in srgb, var(--mint-soft) 40%, transparent) 6px 12px);color:var(--mint-ink);border:1px solid color-mix(in srgb, var(--mint) 50%, transparent);}
.fseg.left .pp{border:1.5px dashed color-mix(in srgb, var(--ink) 30%, transparent);color:var(--ink);background:var(--card);}
.fseg.left.zero .pp{border-color:var(--mint-deep);color:var(--mint-ink);}
.fseg.left.over .pp{border-color:var(--coral);color:var(--coral-ink);}
.flow-stats{display:flex;gap:26px;}
.flow-stats .kpi{text-align:right;justify-items:end;}
.flow-stats .kpi b{font-size:24px;line-height:1.05;}

/* ---------- Overview grid ---------- */
.ov{display:grid;grid-template-columns:270px 300px minmax(0,1fr) 330px;grid-template-areas:"photo dial env bills" "goals goals pace feed";gap:14px;}
.ov > .a-photo{grid-area:photo;} .ov > .a-dial{grid-area:dial;} .ov > .a-env{grid-area:env;} .ov > .a-bills{grid-area:bills;}
.ov > .a-goals{grid-area:goals;} .ov > .a-pace{grid-area:pace;} .ov > .a-feed{grid-area:feed;}
.photo-card{padding:0;overflow:hidden;min-height:300px;color:#fff;border:0;}
.photo-card > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1);}
.photo-card:hover > img{transform:scale(1.04);}
.photo-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,20,16,.18) 0%, transparent 30%, transparent 48%, rgba(10,22,18,.78) 100%);}
.photo-card .pc-top{position:absolute;z-index:1;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;}
.glass{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(16,28,24,.38);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11.5px;font-weight:600;color:#fff;}
.glass .stack .face{box-shadow:0 0 0 2px rgba(255,255,255,.55);}
.photo-card .pc-bot{position:absolute;z-index:1;left:16px;right:16px;bottom:14px;display:flex;align-items:flex-end;gap:10px;}
.photo-card .pc-bot div{flex:1;min-width:0;}
.photo-card h2{font-size:19px;font-weight:600;letter-spacing:-.02em;}
.photo-card p{font-size:12px;opacity:.86;margin-top:2px;}
.round-glass{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s, transform .2s;flex:none;}
.round-glass:hover{background:rgba(255,255,255,.32);transform:rotate(-12deg);}
.pc-month{display:grid;gap:5px;margin-top:10px;}
.pc-month .bar{background:rgba(255,255,255,.22);height:5px;}
.pc-month .bar i{background:var(--mint);}
.pc-month small{font-size:11px;opacity:.85;display:flex;justify-content:space-between;}

/* ---------- Signature 1: "safe to spend today" dial ---------- */
.dial-card{background:var(--dial-bg);color:var(--dial-ink);border-color:transparent;overflow:hidden;}
.dial-card::before{content:"";position:absolute;inset:auto -30% -60% -30%;height:80%;background:radial-gradient(closest-side, rgba(123,217,182,.22), transparent);pointer-events:none;}
.dial-card .card-h h2{color:var(--dial-ink);}
.dial-card .mini-btn{background:var(--dial-2);border-color:transparent;color:var(--dial-ink);}
.dial-card .mini-btn:hover{background:var(--mint);color:#0f2c22;}
.dial{position:relative;width:100%;max-width:252px;margin:-4px auto 0;}
.dial > svg{display:block;width:100%;height:auto;overflow:visible;}
.dial .d-track{fill:none;stroke:var(--dial-track);stroke-linecap:round;}
.dial .d-fill{fill:none;stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.25,.9,.3,1), stroke .4s;}
.dial .d-tick{stroke:rgba(255,255,255,.18);stroke-width:1.4;stroke-linecap:round;}
.dial .d-tick.big{stroke:rgba(255,255,255,.4);stroke-width:2;}
.dial .d-knob{transition:transform 1.2s cubic-bezier(.25,.9,.3,1);}
.dial .d-ghost{transition:transform .35s cubic-bezier(.25,.9,.3,1), opacity .25s;opacity:0;}
.dial.what .d-ghost{opacity:1;}
.dial .d-end{fill:var(--dial-mute);font-size:10px;font-variant-numeric:tabular-nums;}
.dial .d-mid{position:absolute;left:0;right:0;top:40%;text-align:center;display:grid;justify-items:center;gap:1px;}
.dial .d-mid b{font-size:36px;line-height:1;font-weight:560;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.dial .d-mid small{font-size:11.5px;color:var(--dial-mute);}
.dial .d-state{display:inline-flex;align-items:center;gap:5px;margin-top:4px;height:20px;padding:0 8px;border-radius:999px;background:rgba(123,217,182,.16);color:var(--mint);font-size:10.5px;font-weight:700;}
.dial .d-state.tight{background:rgba(234,180,90,.16);color:#f2c46f;}
.dial .d-state.low{background:rgba(240,138,115,.17);color:#ff9f8a;}
.dial-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.dial-facts div{padding:8px 10px;border-radius:11px;background:var(--dial-2);display:grid;gap:1px;}
.dial-facts small{font-size:10.5px;color:var(--dial-mute);}
.dial-facts b{font-size:14px;font-weight:620;font-variant-numeric:tabular-nums;}
.whatif{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;color:var(--dial-mute);}
.whatif input{flex:1;min-width:0;accent-color:var(--mint);}
.whatif output{min-width:40px;text-align:right;color:var(--dial-ink);font-weight:650;font-variant-numeric:tabular-nums;}
.whatif-msg{margin-top:4px;font-size:11.5px;color:var(--dial-mute);min-height:16px;}
.whatif-msg b{color:var(--dial-ink);}

/* ---------- Signature 2: envelopes that fill and drain ---------- */
.env{--tint:#bfe9d5;--f:.5;--w:110px;position:relative;width:var(--w);aspect-ratio:1.3;flex:none;isolation:isolate;overflow:hidden;border-radius:0 0 8px 8px;}
.env .e-flap{position:absolute;left:1%;right:1%;top:4%;height:30%;clip-path:polygon(0 100%, 50% 0, 100% 100%);background:color-mix(in srgb, var(--tint) 74%, #20403a 26%);}
.env .e-back{position:absolute;left:0;right:0;top:33%;bottom:0;border-radius:6px 6px 8px 8px;background:color-mix(in srgb, var(--tint) 80%, #20403a 20%);}
.env .e-cash{position:absolute;left:10%;right:10%;top:8%;height:52%;transform:translateY(calc((1 - var(--f)) * 112%));transition:transform 1.1s cubic-bezier(.3,1.2,.45,1);}
.env .note{position:absolute;inset:0;border-radius:3px;background:linear-gradient(140deg, var(--note-a), var(--note-b));border:1px solid rgba(40,80,50,.22);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.env .note::before{content:"";position:absolute;inset:12% 7%;border:1px dashed var(--note-ink);border-radius:2px;}
.env .note::after{content:"";position:absolute;right:13%;top:50%;width:22%;aspect-ratio:1;transform:translateY(-50%);border-radius:50%;border:1.5px solid var(--note-ink);}
.env .note.n1{transform:rotate(-6deg) translate(-5%, 9%);filter:brightness(.94);}
.env .note.n2{transform:rotate(4deg) translate(4%, 4%);filter:brightness(.97);}
.env .e-front{position:absolute;left:0;right:0;top:0;bottom:0;clip-path:polygon(0 36%, 50% 66%, 100% 36%, 100% 100%, 0 100%);background:linear-gradient(180deg, color-mix(in srgb, var(--tint) 92%, #fff 8%), var(--tint));border-radius:0 0 8px 8px;transition:background .4s;}
.env .e-front::after{content:"";position:absolute;inset:0;clip-path:polygon(0 100%, 50% 68%, 100% 100%);background:color-mix(in srgb, var(--tint) 88%, #20403a 12%);}
.env .e-stamp{position:absolute;z-index:2;left:8%;bottom:9%;display:grid;place-items:center;width:24%;aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.55);color:#22403a;}
.env .e-stamp .ic{width:62%;height:62%;}
.env .e-amt{position:absolute;z-index:2;right:8%;bottom:9%;font-weight:700;font-size:calc(var(--w) * .12);color:#1f3a33;font-variant-numeric:tabular-nums;}
.env.over{--tint:#f6c1b2;}
.env.over .e-front{animation:envOver 1.6s ease-in-out infinite;}
.env.empty .e-cash{opacity:.0;}
.env .e-fly{position:absolute;z-index:3;left:24%;width:52%;height:32%;top:22%;border-radius:3px;background:linear-gradient(140deg, var(--note-a), var(--note-b));border:1px solid rgba(40,80,50,.3);pointer-events:none;}
.env .e-fly.out{animation:flyOut .9s cubic-bezier(.3,.6,.4,1) forwards;}
.env .e-fly.in{animation:flyIn .8s cubic-bezier(.3,.8,.4,1) forwards;}
.env.wob{animation:envWob .6s cubic-bezier(.3,1.5,.5,1);}
@keyframes flyOut{0%{transform:translateY(40%) rotate(0);opacity:1;}100%{transform:translate(50%, -120%) rotate(24deg) scale(.8);opacity:0;}}
@keyframes flyIn{0%{transform:translateY(-140%) rotate(-12deg);opacity:0;}40%{opacity:1;}100%{transform:translateY(60%) rotate(0);opacity:0;}}
@keyframes envWob{30%{transform:rotate(-3deg) translateY(1px);}60%{transform:rotate(2deg);}}
@keyframes envOver{50%{filter:saturate(1.35) brightness(.97);}}
[data-theme="dark"] .env .e-front{background:linear-gradient(180deg, color-mix(in srgb, var(--tint) 70%, #1b2423 30%), color-mix(in srgb, var(--tint) 62%, #1b2423 38%));}
[data-theme="dark"] .env .e-front::after{background:color-mix(in srgb, var(--tint) 52%, #101716 48%);}
[data-theme="dark"] .env .e-back{background:color-mix(in srgb, var(--tint) 40%, #0e1514 60%);}
[data-theme="dark"] .env .e-flap{background:color-mix(in srgb, var(--tint) 34%, #0e1514 66%);}
[data-theme="dark"] .env .e-stamp{background:rgba(255,255,255,.3);}

/* overview envelope card */
.env-row{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:12px;}
.env-mini{display:grid;justify-items:start;gap:6px;padding:0;border:0;background:none;text-align:left;min-width:0;border-radius:12px;}
.env-mini .env{--w:100%;}
.env-mini b{font-size:12.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.env-mini small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.env-mini small em{font-style:normal;color:var(--ink);font-weight:650;}
.env-mini:hover .env{transform:translateY(-3px) rotate(-1deg);}
.env-mini .env{transition:transform .3s cubic-bezier(.3,1.4,.5,1);}
.env-sum{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px;}
.env-sum p{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;}
.env-sum p b{color:var(--ink);font-weight:650;}
.stackbar{display:flex;gap:2px;height:9px;border-radius:999px;overflow:hidden;background:var(--well);}
.fseg.left{min-width:104px;}
.watch{margin-top:12px;display:grid;gap:6px;}
.watch > small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.watch .wrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);}
.watch .wrow .tx{flex:1;min-width:0;display:grid;}
.watch .wrow .tx b{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.watch .wrow .tx small{font-size:11.5px;color:var(--muted);}
.a-env, .a-goals{display:flex;flex-direction:column;}
.a-goals .goal-row{flex:1;}
.a-goals .goal-mini{grid-template-rows:minmax(96px, 1fr) auto auto auto;}
.a-goals .goal-mini .gimg{height:auto;min-height:96px;}
.a-goals .goal-mini .gimg img{position:absolute;inset:0;}
.a-goals .foot-note{margin-top:12px;}
.stackbar i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}

/* bills before payday */
.bill-li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);}
.bill-li:first-child{border-top:0;}
.bill-li .tile{width:32px;height:32px;border-radius:10px;}
.bill-li .tx{flex:1;min-width:0;display:grid;}
.bill-li .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bill-li .tx small{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;}
.bill-li .amt{font-weight:650;font-variant-numeric:tabular-nums;}
.chk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;color:transparent;flex:none;transition:background .2s, border-color .2s, transform .2s;}
.chk .ic{width:13px;height:13px;}
.chk:hover{border-color:var(--mint-deep);transform:scale(1.08);}
.chk[aria-pressed="true"]{background:var(--mint-deep);border-color:transparent;color:#fff;}
.bill-li.paid .tx b{text-decoration:line-through;color:var(--muted);}
.bill-li.paid .amt{color:var(--muted);}
.daychip{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--well);line-height:1;flex:none;}
.daychip b{font-size:13px;font-weight:700;}
.daychip small{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.daychip.soon{background:var(--amber-soft);}
.daychip.today{background:var(--char);color:var(--char-ink);}
.daychip.today small{color:var(--char-mute);}
.foot-note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--mint-soft);color:var(--mint-ink);font-size:12px;display:flex;gap:8px;align-items:center;}
.foot-note.warn{background:var(--amber-soft);color:var(--amber-ink);}
.foot-note .ic{width:15px;height:15px;flex:none;}

/* goals strip */
.goal-row{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px;}
.goal-mini{display:grid;gap:7px;padding:8px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);transition:transform .25s, box-shadow .25s;}
.goal-mini:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.goal-mini .gimg{position:relative;height:84px;border-radius:10px;overflow:hidden;background:var(--well);}
.goal-mini .gimg img{width:100%;height:100%;object-fit:cover;display:block;}
.goal-mini .gimg .tag{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.88);color:#203a32;}
.goal-mini b{font-size:12.5px;font-weight:620;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.goal-mini .gm{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:0 2px;font-variant-numeric:tabular-nums;}
.goal-mini .gm em{font-style:normal;color:var(--ink);font-weight:650;}
.goal-mini .bar{margin:0 2px 2px;}
.rainy{background:repeating-linear-gradient(135deg, var(--mint-soft) 0 10px, color-mix(in srgb, var(--mint-soft) 50%, transparent) 10px 20px);display:grid;place-items:center;color:var(--mint-ink);}
.rainy .ic{width:34px;height:34px;}

/* live activity feed */
.feed{list-style:none;margin:0;padding:0;display:grid;}
.feed li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0;}
.feed li:first-child{border-top:0;}
.feed li.new{animation:feedIn .7s cubic-bezier(.2,.8,.2,1);}
.feed li.new .tx b::after{content:"new";margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--mint);color:#0f2c22;font-size:9.5px;font-weight:750;vertical-align:1px;}
.feed .tx{flex:1;min-width:0;display:grid;}
.feed .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.feed .tx small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.feed .amt{font-weight:650;font-variant-numeric:tabular-nums;}
@keyframes feedIn{from{opacity:0;transform:translateY(-10px);background:var(--mint-soft);}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mint-ink);}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mint-deep);box-shadow:0 0 0 0 var(--mint);animation:livePulse 1.8s infinite;}
@keyframes livePulse{70%{box-shadow:0 0 0 7px transparent;}}

/* ---------- Envelopes page ---------- */
.assign{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;margin-bottom:14px;background:linear-gradient(110deg, var(--mint-soft), var(--card) 60%);}
.assign .big{display:grid;gap:2px;}
.assign .big small{font-size:12px;color:var(--muted);}
.assign .big b{font-size:30px;font-weight:560;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05;}
.assign .big b.over{color:var(--coral-ink);}
.assign .mid{display:grid;gap:8px;min-width:0;}
.assign .mid p{font-size:12.5px;color:var(--ink-2);}
.assign .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.legend-s{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);}
.legend-s span{display:inline-flex;align-items:center;gap:6px;}
.legend-s i{width:9px;height:9px;border-radius:3px;display:inline-block;}
.env-page{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start;}
.env-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.env-tools .sel{margin-left:auto;}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.sel select{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:12px;font-weight:600;}
.env-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:14px;}
.env-tile{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;padding:14px;cursor:pointer;}
.env-tile.picked{box-shadow:0 0 0 2px var(--char), var(--shadow-lift);}
.env-tile .env{--w:132px;transition:transform .3s cubic-bezier(.3,1.4,.5,1);}
.env-tile:hover .env{transform:translateY(-3px) rotate(-1.2deg);}
.env-tile .et{display:grid;align-content:start;gap:3px;min-width:0;}
.env-tile .et-h{display:flex;align-items:center;gap:6px;min-width:0;}
.env-tile .et-h b{font-size:13.5px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.env-tile .left{font-size:22px;font-weight:560;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;}
.env-tile .left.over{color:var(--coral-ink);}
.env-tile .of{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.env-tile .pace{position:relative;margin-top:7px;}
.env-tile .pace .bar{height:7px;}
.env-tile .pace .mk{position:absolute;top:-3px;width:2px;height:13px;border-radius:2px;background:var(--ink);opacity:.55;}
.env-tile .pace-t{font-size:11px;color:var(--muted);margin-top:4px;}
.env-tile .et-b{grid-column:1 / -1;display:flex;gap:6px;align-items:center;padding-top:10px;border-top:1px solid var(--line);}
.env-tile .et-b .btn{min-height:30px;padding:0 12px;font-size:12px;}
.env-tile .et-b .mini-btn{margin-left:auto;}
.env-side{position:sticky;top:76px;display:grid;gap:14px;}
.env-hero{display:grid;justify-items:center;gap:6px;padding:8px 0 4px;}
.env-hero .env{--w:200px;}
.env-hero h3{font-size:17px;font-weight:620;letter-spacing:-.02em;margin-top:6px;}
.env-hero p{font-size:12px;color:var(--muted);}
.facts{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:12px 0;}
.facts div{padding:9px 10px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);display:grid;gap:1px;min-width:0;}
.facts small{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.facts b{font-size:14px;font-weight:640;font-variant-numeric:tabular-nums;white-space:nowrap;}
.wk-bars{display:flex;align-items:flex-end;gap:8px;height:74px;padding-top:6px;}
.wk-bars div{flex:1;display:grid;justify-items:center;gap:4px;height:100%;align-content:end;}
.wk-bars i{display:block;width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:var(--mint);transform-origin:bottom;animation:ccGrow .7s cubic-bezier(.2,.9,.25,1.05) both;}
.wk-bars i.now{background:var(--char);}
.wk-bars small{font-size:10.5px;color:var(--muted);}

/* toggles */
.tgl{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--line-2);flex:none;transition:background .25s;padding:0;}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1);}
.tgl[aria-checked="true"]{background:var(--mint-deep);}
.tgl[aria-checked="true"]::after{transform:translateX(16px);}
.tgl-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);}
.tgl-row:first-of-type{border-top:0;}
.tgl-row > span{flex:1;display:grid;min-width:0;}
.tgl-row b{font-weight:600;}
.tgl-row small{color:var(--muted);font-size:11.5px;}

/* ---------- Bills ---------- */
.kpis{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:14px;margin-bottom:14px;}
.kpis .card{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.kpis .card .tile{width:40px;height:40px;border-radius:13px;background:var(--mint-soft);color:var(--mint-ink);}
.kpis .card .tile.dark{background:var(--char);color:var(--char-ink);}
.kpis .card .tile.amber{background:var(--amber-soft);color:var(--amber-ink);}
.kpis .card .tile.coral{background:var(--coral-soft);color:var(--coral-ink);}
.kpis .kpi b{font-size:20px;}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start;}
.col{display:grid;gap:14px;min-width:0;}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.cal-h h2{font-size:17px;font-weight:620;letter-spacing:-.02em;min-width:150px;text-align:center;}
.cal{display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:6px;}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:650;padding-bottom:2px;}
.cal-cell{position:relative;min-height:88px;padding:6px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);display:grid;align-content:start;gap:4px;text-align:left;color:inherit;min-width:0;transition:border-color .2s, transform .2s;}
button.cal-cell:hover{border-color:var(--line-2);transform:translateY(-1px);}
.cal-cell.out{opacity:.38;}
.cal-cell .dn{font-size:12px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:4px;}
.cal-cell .dnb{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border:0;border-radius:999px;background:transparent;font-weight:650;font-size:12px;color:inherit;}
button.dnb:hover{background:var(--well);}
.cal-cell.today{border-color:var(--char);box-shadow:inset 0 0 0 1px var(--char);}
.cal-cell.today .dnb{background:var(--char);color:var(--char-ink);}
.dnb[aria-pressed="true"]{background:var(--mint);color:#0f2c22;}
.cal-cell.payday{background:linear-gradient(160deg, var(--mint-soft), var(--card-2));border-color:color-mix(in srgb, var(--mint) 60%, transparent);}
.cal-cell .pd{font-size:10px;font-weight:750;color:var(--mint-ink);text-transform:uppercase;letter-spacing:.05em;}
.cal-cell[aria-pressed="true"]{border-color:var(--mint-deep);box-shadow:0 0 0 2px color-mix(in srgb, var(--mint-deep) 35%, transparent);}
.bchip{display:flex;align-items:center;gap:4px;min-width:0;height:22px;padding:0 6px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:600;cursor:pointer;}
.bchip span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bchip em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;}
.bchip i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none;}
.bchip.auto i{background:var(--mint-deep);}
.bchip.manual i{background:var(--amber);}
.bchip.paid{opacity:.55;}
.bchip.paid span{text-decoration:line-through;}
.bchip.more{background:transparent;border-style:dashed;color:var(--muted);justify-content:center;}
.typebars{display:grid;gap:10px;}
.typebars .tb{display:grid;gap:4px;}
.typebars .tb p{display:flex;justify-content:space-between;font-size:12px;}
.typebars .tb p b{font-weight:650;font-variant-numeric:tabular-nums;}
.typebars .tb p span{color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;}
.day-detail{margin-top:12px;padding:12px;border-radius:12px;background:var(--card-2);border:1px dashed var(--line-2);}

/* ---------- Goals ---------- */
.goal-sum{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;margin-bottom:14px;}
.ring{position:relative;width:var(--rs);height:var(--rs);flex:none;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .rt{fill:none;stroke:var(--well);}
.ring .rf{fill:none;stroke:var(--mint-deep);stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1);}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:650;font-size:13px;font-variant-numeric:tabular-nums;}
.goal-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px;}
.goal-card{display:grid;grid-template-columns:42% minmax(0,1fr);padding:0;overflow:hidden;min-height:236px;}
.goal-card .gp{position:relative;min-height:100%;background:var(--well);}
.goal-card .gp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.8,.2,1);}
.goal-card:hover .gp img{transform:scale(1.05);}
.goal-card .gp .tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);color:#203a32;}
.goal-card .gp.rainy .tag{background:var(--card-solid);color:var(--mint-ink);}
.goal-card .gb{padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0;}
.goal-card .gt{display:flex;align-items:flex-start;gap:8px;}
.goal-card .gt div{flex:1;min-width:0;}
.goal-card .gt h3{font-size:15px;font-weight:640;letter-spacing:-.015em;}
.goal-card .gt p{font-size:11.5px;color:var(--muted);}
.goal-card .saved{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;}
.goal-card .saved b{font-size:22px;font-weight:560;letter-spacing:-.035em;}
.goal-card .saved small{color:var(--muted);font-size:12px;}
.goal-card .ms{position:relative;}
.goal-card .ms .bar{height:8px;}
.goal-card .ms .tick{position:absolute;top:0;width:2px;height:8px;background:var(--card-solid);opacity:.9;}
.goal-card .gl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.goal-card .slide{display:grid;gap:4px;padding:8px 10px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);}
.goal-card .slide label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);}
.goal-card .slide label b{color:var(--ink);font-variant-numeric:tabular-nums;}
.goal-card .slide input{width:100%;accent-color:var(--mint-deep);}
.goal-card .eta{font-size:11.5px;color:var(--ink-2);}
.goal-card .eta b{color:var(--mint-ink);}
.goal-card .ga{display:flex;gap:6px;align-items:center;}
.goal-card .ga .mini-btn:last-child{margin-left:auto;}
.goal-card.done .saved b{color:var(--mint-ink);}
.add-card{display:grid;place-items:center;align-content:center;gap:8px;min-height:236px;border:1.5px dashed var(--line-2);background:transparent;box-shadow:none;color:var(--muted);text-align:center;cursor:pointer;backdrop-filter:none;}
.add-card:hover{border-color:var(--mint-deep);color:var(--mint-ink);}
.add-card .tile{width:46px;height:46px;border-radius:50%;background:var(--mint-soft);color:var(--mint-ink);}
.add-card b{color:var(--ink);font-size:14px;}
.timeline{list-style:none;margin:0;padding:0 0 0 4px;display:grid;}
.timeline li{position:relative;display:grid;gap:1px;padding:0 0 14px 22px;}
.timeline li::before{content:"";position:absolute;left:4px;top:6px;bottom:-6px;width:2px;background:var(--line-2);}
.timeline li:last-child::before{display:none;}
.timeline li::after{content:"";position:absolute;left:0;top:3px;width:10px;height:10px;border-radius:50%;background:var(--card-solid);border:2px solid var(--mint-deep);}
.timeline li.done::after{background:var(--mint-deep);}
.timeline b{font-weight:620;}
.timeline small{font-size:11.5px;color:var(--muted);}

/* ---------- Transactions ---------- */
.cc-tbl table{font-size:12.5px;}
.cc-tbl th{font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:650;}
.cc-tbl td{padding:9px 10px;}
.cc-search{border-radius:999px;background:var(--card);min-height:34px;}
.cc-pages button{border-radius:999px;}
.cc-pages button[aria-current="page"]{background:var(--char);color:var(--char-ink);}
.payee{display:flex;align-items:center;gap:10px;min-width:0;}
.payee .tile{width:30px;height:30px;border-radius:10px;}
.payee span{display:grid;min-width:0;}
.payee b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.payee small{font-size:11px;color:var(--muted);}
.envchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--ink-2);}
.envchip i{width:8px;height:8px;border-radius:3px;background:var(--c, var(--faint));}
.envchip.none{border-style:dashed;color:var(--coral-ink);background:var(--coral-soft);border-color:transparent;}
.envchip:hover{border-color:var(--ink);}
tr.flash td{animation:rowFlash 1.4s ease;}
@keyframes rowFlash{0%,40%{background:var(--mint-soft);}}
.rule{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.rule:first-child{border-top:0;}
.rule .tx{flex:1;min-width:0;display:grid;gap:2px;font-size:12px;}
.rule .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rule code{font-family:inherit;font-weight:600;font-size:11.5px;line-height:1.2;padding:3px 6px;border-radius:6px;background:var(--well);}

/* ---------- Accounts ---------- */
.acct-sum{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:14px;margin-bottom:14px;}
.acct-sum .card{padding:14px 16px;display:grid;gap:8px;}
.acct-sum .card .kpi b{font-size:22px;}
.acct-wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;align-items:start;}
.acct-list{display:grid;gap:8px;}
.acct{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .2s, box-shadow .2s, background .2s;}
.acct:hover{transform:translateX(3px);}
.acct[aria-pressed="true"]{background:var(--char);color:var(--char-ink);}
.acct[aria-pressed="true"] small{color:var(--char-mute);}
.acct .bank{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-weight:750;font-size:12px;color:#173a30;}
.acct .tx{display:grid;min-width:0;}
.acct .tx b{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acct .tx small{font-size:11.5px;color:var(--muted);}
.acct .bal{text-align:right;display:grid;justify-items:end;gap:2px;font-variant-numeric:tabular-nums;}
.acct .bal b{font-weight:650;}
.acct-grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:8px 4px 0;}
.acct-hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
.acct-hero .bank{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:750;color:#173a30;}
.acct-hero h2{font-size:18px;font-weight:620;letter-spacing:-.02em;}
.acct-hero .big{margin-left:auto;text-align:right;}
.acct-hero .big b{display:block;font-size:30px;font-weight:560;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;}

/* ---------- Net worth ---------- */
.nw-hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-bottom:14px;}
.nw-big{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.nw-big b{font-size:40px;font-weight:540;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;}
.split{display:grid;gap:12px;}
.split .sp{display:grid;gap:6px;}
.split .sp p{display:flex;justify-content:space-between;font-size:12px;}
.split .sp p b{font-variant-numeric:tabular-nums;font-weight:650;}
.ad-list .row{cursor:pointer;border-radius:10px;padding-left:4px;padding-right:4px;transition:background .15s;}

.ad-list .share{width:120px;}

/* ---------- Reports ---------- */
.rep-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px;}
.rep-grid-3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:14px;}
.donut-wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:center;}
.donut{position:relative;width:190px;height:190px;}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible;}
.donut circle{fill:none;transition:stroke-width .2s, opacity .2s;}
.donut circle.dim{opacity:.3;}
.donut .dc{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;pointer-events:none;}
.donut .dc b{font-size:22px;font-weight:560;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.donut .dc small{font-size:11.5px;color:var(--muted);}
.dleg{display:grid;gap:4px;}
.dleg button{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 8px;border-radius:9px;border:0;background:transparent;text-align:left;font-size:12px;}
.dleg button:hover, .dleg button[aria-pressed="true"]{background:var(--card-2);}
.dleg i{width:10px;height:10px;border-radius:3px;}
.dleg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dleg em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;}
.dleg b{font-weight:650;font-variant-numeric:tabular-nums;}
.chg{display:grid;gap:2px;}
.chg .row .amt.up{color:var(--coral-ink);}
.chg .row .amt.dn{color:var(--mint-ink);}

/* ---------- Settings ---------- */
.set-wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start;}
.stabs{display:grid;gap:2px;padding:8px;}
.stabs button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px;border:0;border-radius:12px;background:transparent;text-align:left;}
.stabs button .ic{grid-row:span 2;width:17px;height:17px;color:var(--muted);}
.stabs button b{font-weight:620;}
.stabs button small{font-size:11.5px;color:var(--muted);}
.stabs button:hover{background:var(--card-2);}
.stabs button[aria-selected="true"]{background:var(--char);color:var(--char-ink);}
.stabs button[aria-selected="true"] small, .stabs button[aria-selected="true"] .ic{color:var(--char-mute);}
.sform{padding:20px 22px;}
.sform h2{font-size:18px;font-weight:620;letter-spacing:-.02em;}
.sform > p{color:var(--muted);margin:4px 0 16px;}
.sform .cc-df{justify-content:flex-start;padding:16px 0 0;}
.photo-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:12px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);}
.photo-row div{display:grid;gap:3px;justify-items:start;}
.photo-row small{color:var(--muted);font-size:11.5px;}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
.member:first-of-type{border-top:0;}
.member .tx{flex:1;display:grid;min-width:0;}
.member .tx small{color:var(--muted);font-size:11.5px;}
.opt3{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;}
.opt3 button{display:grid;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);font-weight:600;text-align:left;}
.opt3 button[aria-pressed="true"]{border-color:var(--char);box-shadow:0 0 0 1px var(--char);}
.opt3 .sw{height:56px;border-radius:10px;border:1px solid var(--line);}
.danger-z{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border-radius:14px;border:1px solid color-mix(in srgb, var(--bad) 40%, transparent);background:var(--bad-soft);}
.danger-z span{flex:1;display:grid;}
.danger-z small{color:var(--muted);}
.cat-row{display:grid;grid-template-columns:auto minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);}
.cat-row:first-of-type{border-top:0;}
.cat-row input[type="text"], .cat-row input[type="number"]{width:100%;min-height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);}
.swatch{width:26px;height:26px;border-radius:8px;border:1px solid var(--line-2);}
.cc-range{display:flex;align-items:center;gap:10px;}
.cc-range input{flex:1;accent-color:var(--mint-deep);}

/* ---------- Page change, skeleton shimmer ---------- */
.view.view-in .ph > *{animation:phIn .45s cubic-bezier(.2,.8,.2,1) both;}
.view.view-in .ph > *:nth-child(2){animation-delay:60ms;}
@keyframes phIn{from{opacity:0;transform:translateY(10px);}}
.view.view-in{animation:viewIn .3s ease both;}
@keyframes viewIn{from{opacity:.4;}}
.view.loading .card::after{content:"";position:absolute;inset:0;z-index:6;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--card-solid) 60%, #fff 40%) 50%, transparent 80%) -150% 0 / 60% 100% no-repeat,
    linear-gradient(var(--well), var(--well)) 16px 18px / 36% 13px no-repeat,
    repeating-linear-gradient(180deg, var(--well) 0 10px, transparent 10px 24px) 16px 52px / calc(100% - 32px) calc(100% - 72px) no-repeat, var(--card-solid);
  animation:shim .8s linear infinite, skOut .2s .4s ease forwards;}
[data-theme="dark"] .view.loading .card::after{background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.06) 50%, transparent 80%) -150% 0 / 60% 100% no-repeat, linear-gradient(var(--well), var(--well)) 16px 18px / 36% 13px no-repeat, repeating-linear-gradient(180deg, var(--well) 0 10px, transparent 10px 24px) 16px 52px / calc(100% - 32px) calc(100% - 72px) no-repeat, var(--card-solid);}
@keyframes shim{to{background-position:250% 0, 16px 18px, 16px 52px, 0 0;}}
@keyframes skOut{to{opacity:0;}}
.view.quiet .fseg, .view.quiet .bar i, .view.quiet .stackbar i, .view.quiet .ring .rf{transition:none;}
.view.quiet .wk-bars i{animation:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.compact .card{padding:12px;}
.compact .ov, .compact .env-grid, .compact .goal-grid{gap:10px;}

/* ---------- Responsive ---------- */
@media (max-width:1380px){
  .navl a{padding:0 11px;}

  .ov{grid-template-columns:250px 290px minmax(0,1fr);grid-template-areas:"photo dial env" "goals goals bills" "pace pace feed";}
  .env-grid{grid-template-columns:repeat(2, minmax(0,1fr));}
}
@media (max-width:1240px){
  .pill-btn span{display:none;}

  .navl a[aria-current="page"]{padding-right:17px;}
  .nav .mark::after{right:6px;}
  .flow-stats{gap:16px;}
  .acct-wrap{grid-template-columns:330px minmax(0,1fr);}

  .rep-grid-3 > :first-child{grid-column:1 / -1;}
}
@media (max-width:1100px){
  .nav{display:none;}
  .menu-btn{display:inline-grid;}
  .tr{margin-left:auto;}
  .pill-btn span{display:inline;}
  .pill-btn{width:auto;padding:0 15px 0 12px;}
  .ov{grid-template-columns:1fr 1fr;grid-template-areas:"photo dial" "env env" "bills goals" "pace feed";}

  .flow{grid-template-columns:1fr;}

  .env-side{position:static;}
  .kpis, .acct-sum{grid-template-columns:repeat(2, minmax(0,1fr));}
  .goal-sum{grid-template-columns:auto 1fr;}
  .goal-sum > :last-child{grid-column:1 / -1;}
  .assign{grid-template-columns:1fr;}
  .assign .acts{justify-content:flex-start;}
}
@media (max-width:760px){
  .top{padding:10px 16px;gap:8px;}
  .tr .pill-btn, .tr [data-theme-toggle]{display:none;}
  .view{padding:4px 16px 96px;}
  .ph h1{font-size:26px;}
  .bbar{position:fixed;z-index:45;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-around;padding:6px;border-radius:22px;background:color-mix(in srgb, var(--card-solid) 92%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 14px 34px -14px rgba(0,0,0,.4);}
  .bbar a, .bbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 2px;border:0;border-radius:16px;background:none;color:var(--muted);font-size:10.5px;font-weight:650;}
  .bbar .ic{width:19px;height:19px;}
  .bbar a[aria-current="page"]{background:var(--char);color:var(--char-ink);}
  .ov{grid-template-columns:1fr;grid-template-areas:"photo" "dial" "env" "bills" "goals" "pace" "feed";}
  .photo-card{min-height:250px;}
  .env-row{grid-template-columns:repeat(2, minmax(0,1fr));}
  .flow-bar{flex-wrap:wrap;}
  .fseg{flex-basis:40%;}
  .flow-stats{gap:10px;}
  .flow-stats .kpi b{font-size:19px;}
  .env-grid, .goal-grid{grid-template-columns:1fr;}
  .env-tile{grid-template-columns:110px minmax(0,1fr);}
  .env-tile .env{--w:110px;}
  .goal-card{grid-template-columns:1fr;}
  .goal-card .gp{min-height:150px;}
  .kpis, .acct-sum{grid-template-columns:1fr 1fr;gap:10px;}
  .kpis .card{padding:12px;}
  .kpis .card .tile{display:none;}
  .cal{gap:3px;}
  .cal-cell{min-height:58px;padding:4px;border-radius:9px;}
  .cal-cell .bchip span, .cal-cell .bchip em{display:none;}
  .cal-cell .bchip{height:8px;padding:0;border:0;background:none;}
  .cal-cell .bchip i{width:8px;height:8px;}
  .cal-cell .pd{font-size:8px;}
  .donut-wrap{grid-template-columns:1fr;justify-items:center;}
  .dleg{width:100%;}
  .rep-grid-3{grid-template-columns:1fr;}
  .nw-big b{font-size:32px;}
  .acct-hero .big{margin-left:0;text-align:left;width:100%;}
  .goal-sum{grid-template-columns:1fr;}
  .cc-toasts{bottom:86px;}
}
@media (max-width:420px){
  .brand b{display:none;}
  .brand{padding:0 8px;}
  .env-row{gap:10px;}
  .facts{grid-template-columns:1fr 1fr;}
  .opt3{grid-template-columns:1fr;}
  .cat-row{grid-template-columns:auto minmax(0,1fr) 84px;}
  .cat-row > :last-child{grid-column:1 / -1;justify-self:end;}
}

 let s = seed >>> 0;

function acctHist(a, n = 90) {

  out[i] = Math.round(v * 100) / 100;

  let ch = 0;
  if (a.id === "joint") ch = (day === 1 ? 3560 - 2900 : 0) + (day === 15 ? 2860 : 0) - (day === 2 ? 700 : 0) - (60 + r() * 90);
  else if (a.id === "billsacct") ch = (day === 1 ? 2900 : 0) - sum(S.bills.filter((b) => b.day === day && b.ac === "billsacct").map((b) => b.amt));

  else if (a.id === "card") ch = day === 20 ? 700 : -(10 + r() * 35);
  else ch = day === 26 || day === 3 ? Math.abs(a.bal) * 0.004 : 0;
  v -= ch;

}

/* Cover the gaps: use money that is ready to assign on envelopes that are over or heading over */
function coverGaps() {
 let ta = toAssign();
 if (ta < 1) return toast("Nothing left to assign. Move money between envelopes instead.", "warn");
 const sp = spentMap(), frac = Math.max(0.05, (DOM - 0.5) / DIM), done = [];
 const needs = S.envs.map((e) => { const proj = sp[e.id] / frac, a = avail(e); return { e, need: Math.ceil(Math.max(0, -leftOf(e, sp)) + Math.max(0, proj - a) * 0.5) }; }).filter((x) => x.need > 0).sort((a, b) => b.need - a.need);
 if (!needs.length) return toast("Every envelope is on track. Nice.");
 needs.forEach((x) => { const g = Math.min(x.need, Math.floor(ta)); if (g > 0) { x.e.plan += g; ta -= g; done.push(x.e.name + " +" + M(g)); } });
 save();
 toast(done.length ? "Covered " + done.join(", ") : "Not enough left to cover the gaps", done.length ? "" : "warn");
 rerender();
}

 countUp($(".saved b span", c), g.saved, M, 900);

/* ---------- Live card feed: a new card payment every few seconds on Overview ---------- */
const FEEDPOOL = [["Corner Bakery", "eat", 4.2, 8.9, "tom"], ["FreshCo Market", "groc", 9, 38, "ellie"], ["City bus pass", "fuel", 2.8, 2.8, "ellie"], ["Parkside Café", "eat", 5.5, 12.5, "ellie"], ["Bookshop on Main", "fun", 7, 16, "tom"], ["Greenleaf Grocer", "groc", 6, 18, "tom"], ["Fuel Stop", "fuel", 24, 41, "tom"]];
let feedN = 0;
function tickFeed() {
 const page = location.hash.replace(/^#\/?/, "").split("/")[0] || "overview";
 if (page !== "overview" || !S.alerts.feed || !S.ui.motion || RM || feedN >= 6 || modals.length || document.hidden) return;
 const [p, eid, lo, hi, w] = FEEDPOOL[feedN % FEEDPOOL.length], e = env(eid);
 feedN++;
 if (!e) return;
 const x = addTx({ p, a: -Math.round((lo + Math.random() * (hi - lo)) * 100) / 100, e: eid, ac: Math.random() < 0.5 ? "card" : "joint", w });
 FRESH.add(x.id);
 save();
 const ul = $("#feedList");
 if (ul) { ul.innerHTML = feedHTML(); setTimeout(() => FRESH.delete(x.id), 4000); }
 /* the envelope on Overview drains a little and a note flies out */
 const sp = spentMap();
 $$(".env-mini").forEach((b) => {
  const en = env(b.dataset.openEnv), el = $(".env", b);
  if (!en || !el) return;
  const st = fillOf(en, sp), prev = +el.dataset.f;
  el.dataset.f = st.f.toFixed(3);
  el.style.setProperty("--f", st.f);
  el.classList.toggle("over", st.over);
  PREVF[en.id] = st.f;
  $("small", b).innerHTML = st.over ? `<em class="neg">${M(-st.left)}</em> over` : `<em>${M(st.left)}</em> left of ${M(avail(en))}`;
  if (st.f < prev - 0.0005) flyNote(el, "out");
 });
 const wi = $("#wi");
 setDial(wi ? +wi.value : 0);
}
