<!doctype html>
<!-- Chill & Craft · Exact Change · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exact Change · cash on delivery checkout</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: mint paper, forest felt ---------- */
  :root {
    color-scheme: light;
    --bg1: #effaf2;
    --bg2: #cfeedb;
    --ink: #13281d;
    --muted: #5c7a69;
    --card: #fbfffc;
    --line: #d7eadf;
    --soft: #eef7f1;
    --felt: #1f5a3d;
    --felt-d: #133d29;
    --green: #1f8a55;
    --green-d: #136a3f;
    --gold: #e7b84d;
    --bad: #c2453b;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #11261b;
    --bg2: #040b07;
    --ink: #e9f7ee;
    --muted: #93b5a2;
    --card: #0e1c15;
    --line: #20382b;
    --soft: #15281e;
    --felt: #1a4d34;
    --felt-d: #0d2d1d;
    --green: #2fae6d;
    --green-d: #1f8a55;
    --bad: #ff8a80;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      repeating-linear-gradient(135deg, rgba(31, 138, 85, .05) 0 1px, transparent 1px 14px),
      radial-gradient(800px 600px at 50% 10%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { width: 100%; display: grid; place-items: center; padding: 16px; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .card { width: min(390px, 100%); padding: 16px 16px 18px; border-radius: 28px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 34px 64px -38px rgba(10, 60, 30, .6); }
  :root[data-theme="dark"] .card { box-shadow: 0 34px 64px -30px rgba(0, 0, 0, .85); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .head h1 { margin: 0; font-size: 17.5px; letter-spacing: -.01em; }
  .pill { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; font-weight: 750; color: var(--green); }
  :root[data-theme="dark"] .pill { color: #7be0a8; }
  .due { margin-top: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .due span { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .due b { flex: none; font-size: 22px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  /* ---------- The felt tray where your notes stack ---------- */
  .tray {
    position: relative;
    height: 146px;
    margin-top: 12px;
    border-radius: 20px;
    background:
      radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.4px) 0 0 / 4px 4px,
      radial-gradient(120% 90% at 50% 30%, var(--felt), var(--felt-d));
    box-shadow: inset 0 3px 10px rgba(0, 0, 0, .45), inset 0 0 0 5px rgba(0, 0, 0, .12), 0 1px 0 rgba(255, 255, 255, .5);
    /* no overflow clip: notes fly in from the buttons below */
  }
  /* idle life: a soft light sweeps across the felt now and then */
  .tray::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .07) 48%, transparent 60%) no-repeat; background-size: 220% 100%; animation: sheen 5.5s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
  .hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: rgba(255, 255, 255, .55); font-size: 12.5px; font-weight: 650; transition: opacity .3s; padding: 0 30px; }
  .stack { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .note {
    position: absolute;
    left: -62px;
    top: -30px;
    width: 124px;
    height: 60px;
    border-radius: 6px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 0 10px 0 12px;
    color: #fff;
    background: var(--c);
    box-shadow: 0 6px 10px -4px rgba(0, 0, 0, .45), inset 0 0 0 3px rgba(255, 255, 255, .22), inset 0 0 0 5px var(--c), inset 0 0 0 6px rgba(255, 255, 255, .3);
    transition: transform .5s var(--spring);
    overflow: hidden;
  }
  .note::before { content: ""; position: absolute; right: -16px; top: -16px; width: 64px; height: 64px; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(255, 255, 255, .22) 0 2px, transparent 2px 6px); }
  .note::after { content: ""; position: absolute; left: 44px; top: 10px; width: 26px; height: 40px; border-radius: 13px; background: rgba(255, 255, 255, .14); }
  .note small { position: relative; font-size: 9px; font-weight: 800; letter-spacing: .14em; opacity: .85; align-self: start; padding-top: 9px; }
  .note b { position: relative; font-size: 22px; font-weight: 900; letter-spacing: -.02em; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
  .band { position: absolute; left: -20px; top: -40px; width: 40px; height: 80px; border-radius: 6px; background: linear-gradient(90deg, #f08a2a, #f6b04f 50%, #f08a2a); box-shadow: 0 2px 6px rgba(0, 0, 0, .4); transform: scaleY(0); opacity: 0; z-index: 50; }
  .band.on { opacity: 1; transform: scaleY(1); transition: transform .35s cubic-bezier(.3, 1.9, .5, 1), opacity .05s; }

  /* the envelope the bundle goes into */
  .env { position: absolute; left: 50%; bottom: -40px; width: 176px; height: 108px; margin-left: -88px; z-index: 60; opacity: 0; visibility: hidden; transition: bottom .55s var(--spring), opacity .25s, visibility 0s .55s; }
  .env.up { bottom: 18px; opacity: 1; visibility: visible; transition: bottom .55s var(--spring), opacity .2s; }
  .env svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .flap { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(-1); transition: transform .4s ease-in; }
  .env.shut .flap { transform: scaleY(1); }
  .envLabel { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 10.5px; font-weight: 800; color: #5a3d15; line-height: 1.3; opacity: 0; transition: opacity .3s .2s; }
  .env.shut .envLabel { opacity: 1; }
  .stamp { position: absolute; right: 8px; top: 30px; padding: 3px 7px; border: 2.5px solid var(--green); border-radius: 6px; color: var(--green); background: rgba(255, 250, 235, .6); font-size: 11px; font-weight: 900; letter-spacing: .1em; transform: rotate(-12deg) scale(2); opacity: 0; }
  .stamp.on { opacity: 1; transform: rotate(-12deg) scale(1); transition: transform .35s cubic-bezier(.4, 1.8, .5, 1), opacity .1s; }

  /* ---------- Note picker and change readout ---------- */
  .picker { margin-top: 10px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .pick { position: relative; height: 34px; padding: 0; border: 0; border-radius: 7px; background: var(--c); color: #fff; font: inherit; font-size: 12px; font-weight: 850; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25), 0 4px 8px -5px rgba(0, 0, 0, .5); transition: transform .3s var(--spring), filter .2s; }
  .pick:hover { transform: translateY(-3px); filter: brightness(1.08); }
  .pick:active { transform: scale(.9); }
  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .tool { flex: 1 1 auto; height: 36px; padding: 0 10px; white-space: nowrap; border-radius: 11px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 750; cursor: pointer; transition: transform .3s var(--spring); }
  .tool:hover { transform: translateY(-2px); }
  .tool:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .give { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .give > div { padding: 9px 11px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); min-width: 0; }
  .give span { display: block; font-size: 11px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .give b { display: block; margin-top: 2px; font-size: 17px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; transition: color .3s; }
  .give b.short { color: var(--bad); }
  .give b.even { color: var(--green); }
  .coins { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; min-height: 18px; }
  .coins i { font-style: normal; padding: 1px 5px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); font-size: 10.5px; font-weight: 800; animation: pop .35s var(--spring) backwards; }

  .phone { margin-top: 12px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); transition: border-color .2s, box-shadow .2s; }
  .phone:focus-within { border-color: var(--green); box-shadow: 0 0 0 4px rgba(31, 138, 85, .18); }
  .phone.bad { border-color: var(--bad); }
  .phone label { flex: none; font-size: 12px; font-weight: 750; color: var(--muted); }
  .phone input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .phone svg { width: 18px; height: 18px; flex: none; opacity: 0; transition: opacity .2s; }
  .phone.ok svg { opacity: 1; }
  .msg { min-height: 18px; margin: 5px 2px 0; font-size: 12px; font-weight: 650; color: var(--muted); }
  .msg.bad { color: var(--bad); }

  .confirm {
    --p: 0;
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 52px;
    margin-top: 6px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--green), var(--green-d));
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 16px 26px -14px var(--green-d), inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: transform .35s var(--spring), filter .2s, opacity .2s;
  }
  .confirm::before { content: ""; position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--p)); background: rgba(255, 255, 255, .22); }
  .confirm span { position: relative; }
  .confirm:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); }
  .confirm:disabled { opacity: .5; cursor: not-allowed; }
  .confirm.again { background: linear-gradient(180deg, #34463c, #1c2a22); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

  @keyframes pop { from { transform: scale(.5); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <div class="head">
      <h1 id="title">Pay when it arrives</h1>
      <span class="pill"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="4" width="14" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /><circle cx="8" cy="8" r="1.8" fill="currentColor" /></svg>Cash on delivery</span>
    </div>
    <div class="due">
      <span>Lawn 3-piece suit 3,450<br>+ delivery 200 + cash fee 120</span>
      <b id="due">PKR 3,770</b>
    </div>

    <div class="tray" id="tray" aria-hidden="true">
      <p class="hint" id="hint">Tap the notes you will hand the rider.<br>We work out your change.</p>
      <div class="stack" id="stack"><span class="band" id="band"></span></div>
      <div class="env" id="env">
        <svg viewBox="0 0 176 108">
          <rect x="2" y="6" width="172" height="100" rx="8" fill="#e7c98f" />
          <path d="M2 14L88 66L174 14V100a6 6 0 0 1-6 6H8a6 6 0 0 1-6-6z" fill="#f1d9a6" />
          <path d="M2 106L76 58M174 106L100 58" stroke="#d6b06a" stroke-width="1.5" />
          <path class="flap" d="M4 6H172L88 60Z" fill="#dcb874" stroke="#c99f55" stroke-width="1" />
        </svg>
        <div class="envLabel" id="envLabel">Keep ready · PKR 4,000</div>
        <div class="stamp" id="stamp">COD OK</div>
      </div>
    </div>

    <div class="picker" id="picker" role="group" aria-label="Add a note"></div>
    <div class="tools">
      <button class="tool" id="exact" type="button">Exact amount</button>
      <button class="tool" id="undo" type="button">Take back</button>
      <button class="tool" id="clear" type="button">Clear</button>
    </div>

    <div class="give">
      <div><span>You hand over</span><b id="given">PKR 0</b></div>
      <div><span id="changeL">Still to add</span><b id="change" class="short">PKR 3,770</b><div class="coins" id="coins"></div></div>
    </div>

    <div class="phone" id="phoneBox">
      <label for="phone">Rider calls</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" value="0301 2345678" aria-describedby="msg">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="var(--green)" /><path d="M5 9.4l2.6 2.4L13 6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </div>
    <p class="msg" id="msg" aria-live="polite">Add notes until you cover PKR 3,770.</p>
    <button class="confirm" id="confirm" type="button" disabled><span id="cTxt">Confirm cash order</span></button>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Exact Change: a cash on delivery checkout where you stack the notes you will hand over ----------
  const $ = (id) => document.getElementById(id);
  const DUE = 3450 + 200 + 120;
  const NOTES = [
    { v: 5000, c: "#b98a23" }, { v: 1000, c: "#3d6fb6" }, { v: 500, c: "#2f8f5b" }, { v: 100, c: "#c2453b" },
    { v: 50, c: "#7a5bb5" }, { v: 20, c: "#e07b2a" }, { v: 10, c: "#2f978b" },
  ];
  const CHANGE = [1000, 500, 100, 50, 20, 10, 5, 2, 1]; // what the rider can give back (notes and coins)
  const colorOf = (v) => NOTES.find((n) => n.v === v).c;
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 80) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  function tween(ms, fn) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.min(1, (now - s) / ms); fn(1 - Math.pow(1 - t, 3)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }

  const stack = $("stack"), tray = $("tray"), env = $("env");
  let hand = [];        // values of the notes in the tray, in order
  let busy = false, done = false;

  // ---------- Note buttons ----------
  const picker = $("picker");
  NOTES.forEach((n) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pick"; b.style.setProperty("--c", n.c);
    b.textContent = n.v >= 1000 ? n.v / 1000 + "k" : n.v;
    b.setAttribute("aria-label", "Add a " + n.v + " rupee note");
    b.addEventListener("click", () => addNote(n.v, b));
    picker.appendChild(b);
  });

  // ---------- Stack ----------
  function noteEl(v) {
    const el = document.createElement("div");
    el.className = "note";
    el.style.setProperty("--c", colorOf(v));
    el.innerHTML = `<small>PKR</small><b>${v.toLocaleString("en-US")}</b>`;
    return el;
  }
  // where note i rests: a loose pile with a little random turn
  function rest(i) {
    const r = Math.sin(i * 12.9898) * 43758.5453, f = r - Math.floor(r);
    const r2 = Math.sin(i * 78.233 + 1.7) * 24634.6345, g = r2 - Math.floor(r2);
    return { x: (f - .5) * 64, y: (g - .5) * 22 - Math.min(i, 10) * 1.6 + 6, rot: (f - .5) * 32 + (g - .5) * 10 };
  }
  function placeAll(neat) {
    [...stack.querySelectorAll(".note")].forEach((el, i) => {
      const p = rest(i);
      el.style.transform = neat ? `translate(0, ${-Math.min(i, 10) * 1.4}px)` : `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg)`;
      el.style.zIndex = i + 1;
    });
  }
  async function addNote(v, fromBtn) {
    if (busy || done) return;
    hand.push(v);
    const el = noteEl(v), i = hand.length - 1, p = rest(i);
    el.style.zIndex = i + 1;
    el.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg)`;
    stack.appendChild(el);
    $("hint").style.opacity = 0;
    update();
    if (fromBtn && !calm()) {
      // the note flies from its button to the tray along an arc, spinning a little, then lands with a squash
      const a = fromBtn.getBoundingClientRect(), b = stack.getBoundingClientRect();
      const dx = a.left + a.width / 2 - b.left, dy = a.top + a.height / 2 - b.top;
      play(fromBtn, [{ transform: "scale(1)" }, { transform: "scale(.85)", offset: .3 }, { transform: "scale(1.1)", offset: .7 }, { transform: "scale(1)" }], { duration: 360 });
      await play(el, [
        { transform: `translate(${dx}px, ${dy}px) rotate(-30deg) scale(.35)`, offset: 0 },
        { transform: `translate(${(dx + p.x) / 2}px, ${Math.min(dy, p.y) - 60}px) rotate(${p.rot + 160}deg) scale(1.05)`, offset: .55 },
        { transform: `translate(${p.x}px, ${p.y - 6}px) rotate(${p.rot}deg) scale(1.04, .94)`, offset: .85 },
        { transform: `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg)` },
      ], { duration: 520, easing: "cubic-bezier(.3,.6,.4,1)" });
      play(tray, [{ transform: "none" }, { transform: "translateY(2px) scaleY(.985)", offset: .4 }, { transform: "none" }], { duration: 240 });
    }
  }
  function takeBack() {
    if (busy || done || !hand.length) return;
    hand.pop();
    const el = stack.querySelector(".note:last-of-type");
    if (el) {
      play(el, [{ transform: el.style.transform, opacity: 1 }, { transform: el.style.transform + " translateY(-70px) rotate(20deg) scale(.6)", opacity: 0 }], { duration: 320, easing: "ease-in" }).then(() => el.remove());
      if (calm()) el.remove();
    }
    update();
  }
  async function clearAll(silent) {
    if (busy) return;
    const els = [...stack.querySelectorAll(".note")];
    hand = [];
    els.reverse().forEach((el, i) => setTimeout(() => {
      play(el, [{ transform: el.style.transform, opacity: 1 }, { transform: el.style.transform + ` translate(${i % 2 ? 160 : -160}px, -20px) rotate(${i % 2 ? 40 : -40}deg)`, opacity: 0 }], { duration: 380, easing: "ease-in" }).then(() => el.remove());
      if (calm()) el.remove();
    }, i * 40));
    $("hint").style.opacity = 1;
    update(silent);
  }

  // ---------- Exact amount: the fewest notes that make the total, counted in one by one ----------
  async function exact() {
    if (busy || done) return;
    await clearAll(true);
    await wait(300);
    busy = true;
    let left = DUE;
    const plan = [];
    for (const n of NOTES) while (left >= n.v) { plan.push(n.v); left -= n.v; }
    const btns = [...picker.children];
    busy = false;
    for (const v of plan) {
      if (done) return;
      addNote(v, btns[NOTES.findIndex((n) => n.v === v)]);
      await wait(150);
    }
  }

  // ---------- Totals, change and the change breakdown ----------
  let shownGiven = 0;
  function breakdown(amount) {
    const out = [];
    for (const c of CHANGE) { const k = Math.floor(amount / c); if (k) { out.push([c, k]); amount -= c * k; } }
    return out;
  }
  function update(silent) {
    const given = hand.reduce((a, b) => a + b, 0), diff = given - DUE;
    const from = shownGiven; shownGiven = given;
    tween(380, (t) => { $("given").textContent = fmt(from + (given - from) * t); });
    const ch = $("change"), coins = $("coins");
    ch.classList.toggle("short", diff < 0);
    ch.classList.toggle("even", diff >= 0);
    coins.innerHTML = "";
    if (diff < 0) { $("changeL").textContent = "Still to add"; ch.textContent = fmt(-diff); }
    else if (diff === 0) { $("changeL").textContent = "Change"; ch.textContent = "Exact, none"; }
    else {
      $("changeL").textContent = "Rider brings back";
      ch.textContent = fmt(diff);
      breakdown(diff).forEach(([c, k], i) => { const e = document.createElement("i"); e.textContent = `${c} × ${k}`; e.style.animationDelay = i * 50 + "ms"; coins.appendChild(e); });
    }
    const okPhone = phoneOK();
    $("confirm").disabled = diff < 0 || !okPhone || busy;
    if (!silent) {
      const msg = $("msg");
      msg.classList.remove("bad");
      if (!okPhone) { msg.classList.add("bad"); msg.textContent = "Enter a mobile number like 0301 2345678."; }
      else if (diff < 0) msg.textContent = `Add ${fmt(-diff)} more, or tap Exact amount.`;
      else if (diff === 0) msg.textContent = "Exact amount. The rider needs no change.";
      else msg.textContent = `The rider brings ${fmt(diff)} in change.`;
    }
  }

  // ---------- Phone number: Pakistani mobile, 03XX XXXXXXX ----------
  const phone = $("phone");
  const digits = () => phone.value.replace(/\D/g, "");
  const phoneOK = () => /^03\d{9}$/.test(digits());
  phone.addEventListener("input", () => {
    const d = digits().slice(0, 11);
    phone.value = d.length > 4 ? d.slice(0, 4) + " " + d.slice(4) : d;
    $("phoneBox").classList.toggle("ok", phoneOK());
    $("phoneBox").classList.toggle("bad", d.length === 11 && !phoneOK());
    update();
  });
  $("phoneBox").classList.add("ok");

  // ---------- Confirm: square the pile, snap a band round it, seal it in an envelope ----------
  async function confirm() {
    if (done) { reset(); return; }
    const given = hand.reduce((a, b) => a + b, 0);
    if (busy || given < DUE || !phoneOK()) return;
    busy = true;
    const btn = $("confirm"), txt = $("cTxt"), band = $("band");
    btn.disabled = true;
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.95, .88)", offset: .3 }, { transform: "scale(1.02)", offset: .7 }, { transform: "scale(1)" }], { duration: 420 });
    txt.textContent = "Bundling your cash…";
    // 1. anticipation: the pile squares up, note by note
    placeAll(true);
    await wait(520);
    // 2. main: a rubber band snaps round the middle and the bundle jolts
    band.style.zIndex = hand.length + 5;
    band.classList.add("on");
    await wait(140);
    play(stack, [{ transform: "none" }, { transform: "scale(1.08, .9)", offset: .3 }, { transform: "scale(.97, 1.04)", offset: .65 }, { transform: "none" }], { duration: 420 });
    await wait(450);
    // 3. progress: the envelope rises, the bundle drops in and the flap closes
    $("envLabel").textContent = `Keep ready · ${fmt(given)}` + (given > DUE ? ` · change ${fmt(given - DUE)}` : "");
    env.classList.add("up");
    await tween(500, (t) => btn.style.setProperty("--p", (t * .5).toFixed(3)));
    await play(stack, [{ transform: "none", opacity: 1 }, { transform: "translateY(-14px) scale(.9)", offset: .35, opacity: 1 }, { transform: "translateY(36px) scale(.55)", opacity: 0 }], { duration: 520, easing: "cubic-bezier(.5,0,.6,1)", fill: "forwards" });
    env.classList.add("shut");
    await tween(500, (t) => btn.style.setProperty("--p", (.5 + t * .5).toFixed(3)));
    // 4. finish: stamp, confetti and a clear message
    $("stamp").classList.add("on");
    const r = tray.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height * .45, 44);
    btn.style.setProperty("--p", 0);
    btn.classList.add("again");
    txt.textContent = "Confirmed ✓ · Start again";
    btn.disabled = false;
    const no = 7000 + Math.floor(Math.random() * 2999);
    $("msg").classList.remove("bad");
    $("msg").textContent = `Order COD-${no} confirmed. Pay ${fmt(DUE)} in cash` + (given > DUE ? `; the rider brings ${fmt(given - DUE)} change.` : ", exact amount.");
    busy = false;
    done = true;
  }
  // 5. reset: the envelope drops away and the tray is ready again
  function reset() {
    done = false;
    env.classList.remove("shut", "up");
    $("stamp").classList.remove("on");
    $("band").classList.remove("on");
    stack.getAnimations().forEach((a) => a.cancel());
    stack.querySelectorAll(".note").forEach((n) => n.remove());
    hand = [];
    $("hint").style.opacity = 1;
    $("confirm").classList.remove("again");
    $("cTxt").textContent = "Confirm cash order";
    update();
  }
  $("confirm").addEventListener("click", confirm);
  $("exact").addEventListener("click", exact);
  $("undo").addEventListener("click", takeBack);
  $("clear").addEventListener("click", () => { if (!done) clearAll(false); });

  // ---------- Confetti ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false, fxLast = 0;
  function sizeFx() { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  sizeFx(); addEventListener("resize", sizeFx);
  function confetti(x, y, n) {
    if (calm()) return;
    const C = ["#1f8a55", "#e7b84d", "#3d6fb6", "#c2453b", "#ffffff"];
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 170 + Math.random() * 260; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 1.1 + Math.random() * .5, w: 5 + Math.random() * 5, h: 3 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - .5) * 14, c: C[i % C.length] }); }
    if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(drawFx); }
  }
  function drawFx(now) {
    const dt = Math.min(.04, (now - fxLast) / 1000); fxLast = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life > p.max) { parts.splice(i, 1); continue; }
      p.vx *= .985; p.vy = p.vy * .985 + 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      ctx.globalAlpha = Math.min(1, (p.max - p.life) * 3);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.life * 8)); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Auto-demo: hand over notes one by one (or tap Exact amount), confirm, start again ----------
  const demo = { on: true, timer: 0, n: 0 };
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.timer); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  const btnFor = (v) => picker.children[NOTES.findIndex((n) => n.v === v)];
  async function runDemo() {
    if (!demo.on) return;
    if (demo.n++ % 2 === 0) {
      for (const v of [1000, 1000, 1000, 500, 500]) { if (!demo.on) return; addNote(v, btnFor(v)); await wait(v === 500 ? 520 : 380); }
    } else {
      play($("exact"), [{ transform: "scale(1)" }, { transform: "scale(.92)", offset: .4 }, { transform: "scale(1)" }], { duration: 300 });
      await exact();
    }
    await wait(1300); if (!demo.on) return;
    await confirm();
    await wait(2600); if (!demo.on) return;
    reset();
    demo.timer = setTimeout(runDemo, 700);
  }

  update();
  demo.timer = setTimeout(runDemo, 250);
</script>
</body>
</html>
