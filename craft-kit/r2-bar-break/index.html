<!doctype html>
<!-- Chill & Craft · Bar Break · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Break · split a payment between two methods</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: dark and milk chocolate on a rose wrapper ---------- */
  :root {
    color-scheme: light;
    --bg1: #fff1f3;
    --bg2: #f3c9d2;
    --ink: #2e1a1d;
    --muted: #8a6870;
    --panel: #fffbfb;
    --well: #fbf0f2;
    --line: #f0dde1;
    --dark: #4a2617;
    --dark-hi: #6b3a24;
    --milk: #a8653a;
    --milk-hi: #c98551;
    --rose: #e0567a;
    --rose-d: #b8355a;
    --gold: #e8bf5a;
    --ok: #16a34a;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #3a1c25;
    --bg2: #12080b;
    --ink: #fbecef;
    --muted: #c49aa4;
    --panel: #1f1215;
    --well: #2a181d;
    --line: #3a242a;
    --rose: #f0779a;
    --rose-d: #c84a6e;
    --ok: #4ade80;
    --focus: #93c5fd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(520px 360px at 50% 34%, rgba(232, 191, 90, .2), transparent 70%), radial-gradient(900px 640px at 50% 0%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; overflow: clip; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .card {
    width: min(396px, 100%);
    padding: 16px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(90, 20, 40, .45), 0 8px 20px -12px rgba(90, 20, 40, .25);
    animation: rise .7s var(--spring) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .head h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .head .tot { text-align: right; font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .head .tot b { display: block; font-size: 19px; letter-spacing: -.02em; text-transform: none; color: var(--ink); white-space: nowrap; }

  /* ---------- The bar ---------- */
  .wrap { position: relative; margin-top: 14px; padding: 12px 0 8px; }
  .paper { position: absolute; left: -8px; right: -8px; top: 0; bottom: 0; border-radius: 12px; background: repeating-linear-gradient(135deg, var(--rose) 0 10px, var(--rose-d) 10px 20px); opacity: .18; }
  .bar { position: relative; height: 112px; touch-action: none; cursor: ew-resize; border-radius: 10px; }
  .bar:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
  .piece { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 10px; will-change: clip-path, transform; filter: drop-shadow(0 8px 8px rgba(60, 20, 10, .3)); }
  .piece i { border-radius: 6px; }
  .pa { background: var(--dark); }
  .pa i { background: linear-gradient(145deg, var(--dark-hi), var(--dark) 60%); box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .12), inset -3px -3px 0 rgba(0, 0, 0, .3); }
  .pb { background: var(--milk); }
  .pb i { background: linear-gradient(145deg, var(--milk-hi), var(--milk) 60%); box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .18), inset -3px -3px 0 rgba(0, 0, 0, .22); }
  .crack { position: absolute; top: -10px; bottom: -10px; width: 30px; margin-left: -15px; pointer-events: none; }
  .crack svg { position: absolute; inset: 10px 0; width: 100%; height: calc(100% - 20px); overflow: visible; }
  .knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6dc, var(--gold) 60%, #b98a2a);
    box-shadow: 0 6px 12px rgba(60, 20, 10, .45), 0 0 0 3px rgba(255, 255, 255, .6);
    display: grid;
    place-items: center;
    transition: transform .3s var(--spring);
  }
  .knob svg { width: 18px; height: 18px; fill: none; stroke: #5b3a0c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .bar.drag .knob { transform: scale(1.15); }
  .foil { position: absolute; inset: -4px; z-index: 3; border-radius: 12px; background: linear-gradient(100deg, #f6dd90, #e8bf5a 30%, #fff1c2 45%, #d9a83a 60%, #f6dd90); transform-origin: 0 50%; transform: scaleX(0); display: grid; place-items: center; box-shadow: 0 10px 18px -8px rgba(120, 80, 0, .6); pointer-events: none; }
  .foil b { padding: 6px 16px; border: 2.5px solid #7a5410; border-radius: 10px; color: #7a5410; font-size: 22px; letter-spacing: .2em; transform: rotate(-6deg); }
  .scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- The two parts ---------- */
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .side { position: relative; display: grid; gap: 6px; padding: 10px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--well); transition: border-color .3s, background .3s; }
  .side .lg { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .side .lg i { width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .35); }
  .side:nth-child(1) .lg i { background: var(--dark); } .side:nth-child(2) .lg i { background: var(--milk); }
  .side select, .side input { width: 100%; height: 34px; padding: 0 6px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; }
  .side input { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .side .amt { position: relative; }
  .side .amt span { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 750; color: var(--muted); pointer-events: none; }
  .side .amt input { padding-left: 36px; }
  .side small { min-height: 14px; font-size: 10.5px; color: var(--muted); }
  .side.capped small { color: var(--rose-d); font-weight: 700; }
  :root[data-theme="dark"] .side.capped small { color: var(--rose); }
  .side.paid { border-color: var(--ok); }
  .ring { position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; opacity: 0; transition: opacity .2s; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .tk { fill: none; stroke: var(--ok); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .3s; }
  .side.busy .ring, .side.paid .ring { opacity: 1; }
  .side.paid .ring .tk { stroke-dashoffset: 0; }
  .side select:focus-visible, .side input:focus-visible, .chip:focus-visible, .go:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .chip { height: 32px; padding: 0 4px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform .3s var(--spring), border-color .2s; white-space: nowrap; }
  .chip:hover { transform: translateY(-2px); border-color: var(--rose); }
  .go {
    width: 100%;
    height: 50px;
    margin-top: 10px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--rose), var(--rose-d));
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 12px 22px -12px var(--rose-d);
    transition: transform .3s var(--spring), background .3s;
  }
  .go:hover { transform: translateY(-2px); }
  .go.ok { background: linear-gradient(180deg, #22c55e, #15803d); }
  .note { margin: 6px 0 0; min-height: 1.3em; text-align: center; font-size: 12px; color: var(--muted); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="ttl">
    <header class="head">
      <div><h1 id="ttl">Split your payment</h1><p>Drag the snap line to share the bill.</p></div>
      <div class="tot">Order total<b>PKR 8,400</b></div>
    </header>

    <div class="wrap">
      <div class="paper" aria-hidden="true"></div>
      <!-- the bar is the slider: drag it, or focus it and use the arrow keys -->
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Amount for the dark part" aria-valuemin="0" aria-valuemax="8400" aria-valuenow="2000" aria-valuetext="PKR 2,000 dark, PKR 6,400 milk">
        <div class="piece pb" id="pb" aria-hidden="true"></div>
        <div class="piece pa" id="pa" aria-hidden="true"></div>
        <div class="crack" id="crack" aria-hidden="true">
          <svg viewBox="0 0 30 100" preserveAspectRatio="none"><path id="crackP" d="M15 0L18 12L12 25L18 37L12 50L18 62L12 75L18 87L15 100" fill="none" stroke="#fff3d0" stroke-width="1.6" stroke-opacity=".9" vector-effect="non-scaling-stroke" /></svg>
          <span class="knob"><svg viewBox="0 0 20 20"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4" /></svg></span>
        </div>
        <div class="foil" id="foil" aria-hidden="true"><b>PAID</b></div>
      </div>
      <div class="scale" aria-hidden="true"><span>PKR 0</span><span>4,200</span><span>8,400</span></div>
    </div>

    <div class="sides">
      <div class="side" id="sideA">
        <div class="lg"><i></i>Dark part</div>
        <label class="vh" for="mA">Method for the dark part</label>
        <select id="mA"></select>
        <div class="amt"><span>PKR</span><input id="vA" inputmode="numeric" aria-label="Amount for the dark part in PKR" value="2,000"></div>
        <small id="hA"></small>
        <svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" stroke="var(--line)" /><circle class="pr" cx="11" cy="11" r="9" stroke="var(--ok)" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 11 11)" /><path class="tk" d="M7 11.3l2.6 2.6L15 8.4" /></svg>
      </div>
      <div class="side" id="sideB">
        <div class="lg"><i></i>Milk part</div>
        <label class="vh" for="mB">Method for the milk part</label>
        <select id="mB"></select>
        <div class="amt"><span>PKR</span><input id="vB" inputmode="numeric" aria-label="Amount for the milk part in PKR" value="6,400"></div>
        <small id="hB"></small>
        <svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" stroke="var(--line)" /><circle class="pr" cx="11" cy="11" r="9" stroke="var(--ok)" stroke-dasharray="56.5" stroke-dashoffset="56.5" transform="rotate(-90 11 11)" /><path class="tk" d="M7 11.3l2.6 2.6L15 8.4" /></svg>
      </div>
    </div>

    <div class="chips" role="group" aria-label="Quick splits">
      <button class="chip" type="button" data-q="half">Half and half</button>
      <button class="chip" type="button" data-q="max">Most on dark</button>
      <button class="chip" type="button" data-q="none">All on milk</button>
    </div>
    <button class="go" id="go" type="button"><span id="goTxt">Pay PKR 8,400 in two parts</span></button>
    <p class="note" id="note" aria-live="polite">Each square of the bar is PKR 700.</p>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Bar Break: the bill is a chocolate bar; the snap line splits it between two payment methods ----------
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const num = (n) => Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 60) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const E = { out: (t) => 1 - Math.pow(1 - t, 3), in: (t) => t * t * t, inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), back: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) };
  function tween(ms, fn, ease) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.max(0, Math.min(1, (now - s) / ms)); fn((ease || E.out)(t)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }
  const note = (t) => { $("note").textContent = t; };

  // ---------- Money and methods (PKR) ----------
  const TOTAL = 8400, SQ = 700, STEP = 100;
  const METHODS = [
    { k: "gift", name: "Gift card", sub: "PKR 2,000 left", cap: 2000 },
    { k: "card", name: "Debit card", sub: "•• 4821 · no fee", cap: Infinity },
    { k: "wallet", name: "Mobile wallet", sub: "•• 4567 · approve in app", cap: Infinity },
    { k: "bank", name: "Bank transfer", sub: "•• 0912 · clears instantly", cap: Infinity },
  ];
  const M = (k) => METHODS.find((m) => m.k === k);
  ["mA", "mB"].forEach((id) => METHODS.forEach((m) => $(id).insertAdjacentHTML("beforeend", `<option value="${m.k}">${m.name}</option>`)));
  $("mA").value = "gift";
  $("mB").value = "card";
  let a = 2000, paying = false;

  // the dark part may not go over the dark method's limit, and the milk part not over the milk method's limit
  const lo = () => Math.max(0, TOTAL - M($("mB").value).cap);
  const hi = () => Math.min(TOTAL, M($("mA").value).cap);
  const clampA = (v) => Math.max(lo(), Math.min(hi(), v));

  // ---------- Build the squares ----------
  ["pa", "pb"].forEach((id) => { for (let i = 0; i < 12; i++) $(id).appendChild(document.createElement("i")); });

  // ---------- Draw the split: jagged clip paths on both pieces, the crack and the knob ----------
  const JAG = [0, 12, 25, 37, 50, 62, 75, 87, 100];
  function draw(v) {
    const W = $("bar").clientWidth, x = W * v / TOTAL;
    const zig = JAG.map((y, i) => `${(x + (i % 2 ? 3 : i === 0 || i === 8 ? 0 : -3)).toFixed(1)}px ${y}%`);
    $("pa").style.clipPath = `polygon(0 0, ${zig.join(", ")}, 0 100%)`;
    $("pb").style.clipPath = `polygon(${zig.join(", ")}, 100% 100%, 100% 0)`;
    $("crack").style.left = x + "px";
    $("crack").style.opacity = v <= 0 || v >= TOTAL ? .55 : 1;
  }
  // Labels, inputs, limits and the button follow the split
  let lastSq = -1;
  function setA(v, opts = {}) {
    a = Math.round(v);
    draw(a);
    const b = TOTAL - a;
    const bar = $("bar");
    bar.setAttribute("aria-valuenow", a);
    bar.setAttribute("aria-valuetext", `${fmt(a)} dark, ${fmt(b)} milk`);
    if (document.activeElement !== $("vA")) $("vA").value = num(a);
    if (document.activeElement !== $("vB")) $("vB").value = num(b);
    const mA = M($("mA").value), mB = M($("mB").value);
    $("hA").textContent = a >= mA.cap ? `${mA.name} limit reached` : a === 0 ? "Not used" : mA.sub;
    $("hB").textContent = b >= mB.cap ? `${mB.name} limit reached` : b === 0 ? "Not used" : mB.sub;
    $("sideA").classList.toggle("capped", a >= mA.cap);
    $("sideB").classList.toggle("capped", b >= mB.cap);
    if (!paying) $("goTxt").textContent = a && b ? `Pay ${fmt(TOTAL)} in two parts` : `Pay ${fmt(TOTAL)} by ${(a ? mA : mB).name.split(" •")[0].toLowerCase()}`;
    // crossing a square edge: a tiny snap of crumbs at the line
    const sq = Math.floor(a / SQ);
    if (opts.crumbs !== false && lastSq >= 0 && sq !== lastSq) crumbs(4);
    lastSq = sq;
  }
  function crumbs(n) {
    const r = $("crack").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, n, .8);
  }
  // Pushing past a limit: the line resists, then springs back to the limit
  let bumpT = 0;
  function bump(side) {
    const now = performance.now();
    if (now - bumpT < 700) return;
    bumpT = now;
    const m = M($(side === "A" ? "mA" : "mB").value);
    play($("crack"), [{ transform: "translateX(0)" }, { transform: `translateX(${side === "A" ? 10 : -10}px)` }, { transform: `translateX(${side === "A" ? -4 : 4}px)` }, { transform: "translateX(0)" }], { duration: 420, easing: "ease-out" });
    play($(side === "A" ? "sideA" : "sideB"), [{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(4px)" }, { transform: "translateX(0)" }], { duration: 360 });
    note(`${m.name} has only ${fmt(m.cap)} on it. The other part pays the rest.`);
  }
  let glideId = 0;
  async function glide(to) {
    const id = ++glideId, from = a, want = to, t2 = clampA(to);
    await tween(Math.min(1100, 300 + Math.abs(t2 - from) / 6), (t) => { if (id === glideId) setA(Math.round((from + (t2 - from) * t) / STEP) * STEP); }, E.inOut);
    if (id !== glideId) return;
    setA(t2);
    if (want > t2) bump("A"); else if (want < t2) bump("B");
    else note(`${fmt(a)} on ${M($("mA").value).name}, ${fmt(TOTAL - a)} on ${M($("mB").value).name}.`);
  }

  // ---------- Drag and keys on the bar ----------
  const bar = $("bar");
  function fromPointer(e) {
    const r = bar.getBoundingClientRect();
    const v = Math.round(((e.clientX - r.left) / r.width) * TOTAL / STEP) * STEP;
    const c = clampA(Math.max(0, Math.min(TOTAL, v)));
    if (v > c && v > a) bump("A"); else if (v < c && v < a) bump("B");
    glideId++;
    setA(c);
  }
  bar.addEventListener("pointerdown", (e) => { if (paying) return; bar.setPointerCapture(e.pointerId); bar.classList.add("drag"); fromPointer(e); });
  bar.addEventListener("pointermove", (e) => { if (bar.classList.contains("drag")) fromPointer(e); });
  const endDrag = () => { if (!bar.classList.contains("drag")) return; bar.classList.remove("drag"); note(`${fmt(a)} on ${M($("mA").value).name}, ${fmt(TOTAL - a)} on ${M($("mB").value).name}.`); };
  bar.addEventListener("pointerup", endDrag);
  bar.addEventListener("pointercancel", endDrag);
  bar.addEventListener("keydown", (e) => {
    if (paying) return;
    const step = { ArrowRight: STEP, ArrowUp: STEP, ArrowLeft: -STEP, ArrowDown: -STEP, PageUp: SQ, PageDown: -SQ }[e.key];
    let v = step ? a + step : e.key === "Home" ? 0 : e.key === "End" ? TOTAL : null;
    if (v === null) return;
    e.preventDefault();
    v = Math.max(0, Math.min(TOTAL, v));
    const c = clampA(v);
    if (v > c) bump("A"); else if (v < c) bump("B");
    glideId++;
    setA(c);
  });

  // ---------- Typed amounts and methods ----------
  function typed(side) {
    const el = $(side === "A" ? "vA" : "vB"), raw = +el.value.replace(/[^\d]/g, "");
    const want = side === "A" ? Math.min(TOTAL, raw) : TOTAL - Math.min(TOTAL, raw);
    glideId++;
    const c = clampA(want);
    setA(c);
    el.value = num(side === "A" ? c : TOTAL - c);
    if (want > c) bump("A"); else if (want < c) bump("B");
  }
  ["A", "B"].forEach((s) => {
    const el = $("v" + s);
    el.addEventListener("input", () => { const d = el.value.replace(/[^\d]/g, "").slice(0, 5); el.value = d ? num(+d) : ""; });
    el.addEventListener("change", () => { if (!paying) typed(s); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (!paying) typed(s); } });
  });
  // the two parts never use the same method: picking the other side's method swaps them
  let prevA = "gift", prevB = "card";
  function methodChanged(side) {
    const me = $("m" + side), other = $(side === "A" ? "mB" : "mA");
    if (me.value === other.value) other.value = side === "A" ? prevA : prevB;
    prevA = $("mA").value;
    prevB = $("mB").value;
    play(me.closest(".side"), [{ transform: "scale(1)" }, { transform: "scale(1.03)" }, { transform: "scale(1)" }], { duration: 320, easing: "ease-out" });
    glide(clampA(a));
  }
  $("mA").addEventListener("change", () => methodChanged("A"));
  $("mB").addEventListener("change", () => methodChanged("B"));

  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    if (paying) return;
    const q = c.dataset.q;
    glide(q === "half" ? TOTAL / 2 : q === "max" ? TOTAL : 0);
  }));

  // ---------- Pay: the bar snaps in two, each part pays in turn, then it is wrapped in foil ----------
  async function pay() {
    const btn = $("go");
    if (paying) return;
    paying = true;
    glideId++;
    const parts = [["A", a], ["B", TOTAL - a]].filter(([, v]) => v > 0);
    $("goTxt").textContent = "Breaking the bar…";
    // anticipation: the bar bends a little under the thumbs
    await play(bar, [{ transform: "none" }, { transform: "scale(.97, .94)" }], { duration: 220, easing: "ease-in", fill: "forwards" });
    crumbs(26);
    bar.getAnimations().forEach((x) => x.cancel());
    const split = parts.length === 2;
    if (split) {
      play($("pa"), [{ transform: "none" }, { transform: "translateX(-12px) rotate(-3deg)" }], { duration: 420, easing: "cubic-bezier(.2,.9,.3,1.3)", fill: "forwards" });
      play($("pb"), [{ transform: "none" }, { transform: "translateX(12px) rotate(2.5deg)" }], { duration: 420, easing: "cubic-bezier(.2,.9,.3,1.3)", fill: "forwards" });
      play($("crack"), [{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
    }
    await wait(450);
    // each part charges with a filling ring, then ticks
    for (const [s, v] of parts) {
      const side = $("side" + s), m = M($("m" + s).value);
      side.classList.add("busy");
      $("goTxt").textContent = `Charging ${fmt(v)} to ${m.name.split(" •")[0].toLowerCase()}…`;
      const pr = side.querySelector(".pr");
      await tween(850, (t) => pr.setAttribute("stroke-dashoffset", (56.5 * (1 - t)).toFixed(1)), E.inOut);
      side.classList.remove("busy");
      side.classList.add("paid");
      play(side, [{ transform: "scale(1)" }, { transform: "scale(1.05)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
      play($(s === "A" ? "pa" : "pb"), [{ filter: "brightness(1)" }, { filter: "brightness(1.4)" }, { filter: "brightness(1)" }], { duration: 400 });
    }
    // rejoin and wrap in gold foil
    $("goTxt").textContent = "Wrapping it up…";
    if (split) {
      $("pa").getAnimations().forEach((x) => x.cancel());
      $("pb").getAnimations().forEach((x) => x.cancel());
      $("crack").getAnimations().forEach((x) => x.cancel());
      await Promise.all([play($("pa"), [{ transform: "translateX(-12px) rotate(-3deg)" }, { transform: "none" }], { duration: 300, easing: "ease-in" }), play($("pb"), [{ transform: "translateX(12px) rotate(2.5deg)" }, { transform: "none" }], { duration: 300, easing: "ease-in" })]);
    }
    await tween(520, (t) => { $("foil").style.transform = `scaleX(${t})`; }, E.out);
    play($("foil").firstChild, [{ transform: "rotate(-6deg) scale(2)", opacity: 0 }, { transform: "rotate(-6deg) scale(.9)", opacity: 1 }, { transform: "rotate(-6deg) scale(1)" }], { duration: 420, easing: "ease-out" });
    const r = bar.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2);
    btn.classList.add("ok");
    $("goTxt").textContent = split ? `Paid ${fmt(TOTAL)} in two parts` : `Paid ${fmt(TOTAL)}`;
    note(split ? `Done: ${fmt(a)} on ${M($("mA").value).name} and ${fmt(TOTAL - a)} on ${M($("mB").value).name}.` : `Done: ${fmt(TOTAL)} paid in one go.`);
    await wait(2000);
    // reset
    await tween(380, (t) => { $("foil").style.transform = `scaleX(${1 - t})`; $("foil").style.transformOrigin = "100% 50%"; }, E.in);
    $("foil").style.transformOrigin = "0 50%";
    ["sideA", "sideB"].forEach((id) => { $(id).classList.remove("paid", "busy"); $(id).querySelector(".pr").setAttribute("stroke-dashoffset", "56.5"); });
    btn.classList.remove("ok");
    paying = false;
    setA(a, { crumbs: false });
  }
  $("go").addEventListener("click", pay);

  // ---------- Crumbs and confetti ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  function sizeFx() { const r = devicePixelRatio || 1; fx.width = innerWidth * r; fx.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  sizeFx();
  addEventListener("resize", () => { sizeFx(); draw(a); });
  function burst(x, y, n, power, colors) {
    if (calm()) return;
    const cols = colors || ["#4a2617", "#6b3a24", "#a8653a", "#c98551"];
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, s = (1 + Math.random() * 3) * (power || 1);
      parts.push({ x: x + (Math.random() - .5) * 6, y: y + (Math.random() - .5) * 60, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s - 1.5, r: 1.2 + Math.random() * 2.2, c: cols[i % cols.length], life: 1, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, sq: !colors || i % 2 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
  }
  const confetti = (x, y) => burst(x, y, 70, 2.4, ["#e0567a", "#e8bf5a", "#fff1c2", "#a8653a", "#16a34a"]);
  function drawFx() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .17; p.vx *= .98; p.life -= .02; p.rot += p.vr;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.sq) ctx.fillRect(-p.r, -p.r * .8, p.r * 2, p.r * 1.6); else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Idle life: the knob breathes ----------
  setInterval(() => {
    if (paying || calm() || document.hidden || bar.classList.contains("drag")) return;
    play(document.querySelector(".knob"), [{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 700, easing: "ease-in-out" });
  }, 1800);

  // ---------- Auto-demo: hits the gift card limit, switches method, splits in half and pays ----------
  const demo = { on: true, t: 0 };
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.t); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  function demoMethod(side, k) { $("m" + side).value = k; methodChanged(side); }
  async function demoLoop() {
    const steps = [
      [() => glide(5600), 1300],
      [() => demoMethod("A", "wallet"), 900],
      [() => glide(4200), 1100],
      [() => pay(), 900],
      [() => demoMethod("A", "gift"), 1200],
    ];
    for (const [fn, pause] of steps) {
      if (!demo.on) return;
      await fn();
      if (!demo.on) return;
      await wait(pause);
    }
    if (demo.on) demo.t = setTimeout(demoLoop, 300);
  }

  // ---------- Start: the line slides in from the left ----------
  setA(0, { crumbs: false });
  requestAnimationFrame(() => { glide(2000); });
  demo.t = setTimeout(demoLoop, 1500);
</script>
</body>
</html>
