<!doctype html>
<!-- Chill & Craft · Vettora · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vettora · Fraud and identity desk</title>
<meta name="description" content="A back-office desk for a marketplace trust team: live order screening, a review queue, ID checks, a fraud-ring graph, rules and reports.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "vettora:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: warm paper by day, night desk by dark
   ========================================================= */
:root {
  color-scheme: light;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 12px; --r-sm: 8px;
  --bg: #f2f1ec; --surface: #ffffff; --surface2: #f8f7f3; --ink: #161821; --muted: #666976; --line: #e2e0d8;
  --accent: #c76a06; --accent-ink: #fff; --focus: #c76a06; --ok: #16803c; --warn: #b45309; --bad: #d42a2a; --info: #2459d6;
  --c1: #e08a12; --c2: #d42a2a; --c3: #0f8a7e; --c4: #5b5bd6; --c5: #8b8f9c;
  --side: #0d1019; --side-ink: #c9cdd9; --side-mut: #6c7387; --side-line: #1c2131; --tip-bg: #0d1019; --face-bg: #dfe7ea;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090c14; --surface: #10141f; --surface2: #0c1019; --ink: #e7e9f1; --muted: #8a90a4; --line: #1f2536;
  --accent: #f5a524; --accent-ink: #1a1204; --focus: #f5a524; --ok: #3ccf8e; --warn: #f7b638; --bad: #ff6b6b; --info: #6aa1ff;
  --c1: #f5a524; --c2: #ff6b6b; --c3: #2dd4bf; --c4: #8b8cf8; --c5: #7d849a;
  --side: #070910; --side-line: #161b29; --face-bg: #23303a;
}
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbars { display: grid; gap: 11px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
.hb-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.hb-fill { height: 100%; width: var(--w); border-radius: inherit; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hbIn { from { width: 0; } }
.heat { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }
.heat .hx { text-align: center; } .heat .hy { padding-right: 6px; align-self: center; white-space: nowrap; }
.hc { aspect-ratio: 1.5; min-height: 10px; border-radius: 3px; opacity: var(--a); animation: cellIn .45s var(--d) both; }
.hc:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
@keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
.gauge { position: relative; margin: 0 auto; width: 100%; }
.gauge svg { display: block; overflow: visible; }
.g-bg, .g-val { fill: none; stroke-width: 14; stroke-linecap: round; }
.g-bg { stroke: color-mix(in srgb, var(--ink) 9%, transparent); }
.gsweep { animation: gsweep 1.3s cubic-bezier(.3,0,.2,1) both; }
@keyframes gsweep { from { stroke-dasharray: 0 1; } }
.g-num { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; display: grid; }
.g-num b { font-size: 28px; line-height: 1; } .g-num span { font-size: 12px; color: var(--muted); }
.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 8px; }
.fn-bar { width: var(--w); min-width: fit-content; display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm, 8px); color: #fff; font-size: 12.5px; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; overflow: hidden; white-space: nowrap; }
.fn-row em { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; }

/* drag board */
.kboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.kcol { display: flex; flex-direction: column; min-height: 220px; border-radius: var(--r, 12px); }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.kcol-h h3 { font-size: 13.5px; flex: 1; }
.kdot { width: 9px; height: 9px; border-radius: 50%; }
.kcount { font-size: 12px; color: var(--muted); }
.klist { display: grid; gap: 9px; padding: 6px 8px 12px; min-height: 80px; flex: 1; align-content: start; border-radius: var(--r, 12px); transition: background .2s; }
.klist.kover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.kcard { position: relative; padding: 11px 12px; padding-right: 36px; border-radius: var(--r-sm, 10px); background: var(--surface); border: 1px solid var(--line); cursor: grab; user-select: none; transition: transform .15s, box-shadow .2s; }
@media (pointer: fine) { .kcard { touch-action: none; } }
.kcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
.kmove { position: absolute; top: 5px; right: 4px; width: 28px; height: 28px; }
.kdragging { opacity: .25; }
.kghost { position: fixed; left: 0; top: 0; z-index: 110; pointer-events: none; box-shadow: 0 22px 48px rgba(0,0,0,.3); cursor: grabbing; }
.kph { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: var(--r-sm, 10px); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.kempty { padding: 18px 8px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-sm, 10px); }
.kdrop { animation: kdrop .6s cubic-bezier(.2,.9,.3,1.4); }
@keyframes kdrop { 0% { transform: scale(.92); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 60% { box-shadow: 0 0 0 10px transparent; } 100% { transform: none; } }

/* page entrance (each app restyles @keyframes rise) */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .drawer { border-radius: 0; } }

/* =========================================================
   2. App shell: dark rail sidebar, sticky top bar
   ========================================================= */
.skip { position: absolute; left: -999px; top: 8px; z-index: 200; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; }
.skip:focus { left: 8px; }
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding: 18px 12px; border-right: 1px solid var(--side-line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; color: #fff; text-decoration: none; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-size: 17px; letter-spacing: .02em; display: block; line-height: 1.1; }
.brand small { display: block; font-size: 10px; color: var(--side-mut); letter-spacing: .16em; text-transform: uppercase; }
.nav { position: relative; display: grid; gap: 1px; }
.nav-sec { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--side-mut); padding: 14px 10px 6px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--side-ink); font-weight: 500; transition: color .2s, background .2s; }
.nav a:hover { background: rgba(255, 255, 255, .045); color: #fff; }
.nav a[aria-current="page"] { color: #fff; }
.nav a[aria-current="page"] .ic { color: #f5a524; }
.nav-marker { position: absolute; left: 0; right: 0; top: 0; border-radius: 8px; background: linear-gradient(90deg, rgba(245, 165, 36, .2), rgba(245, 165, 36, .02)); box-shadow: inset 3px 0 0 #f5a524; transition: transform .42s cubic-bezier(.3, 1.3, .4, 1), height .3s; pointer-events: none; }
.nav-n { margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 99px; background: rgba(255, 107, 107, .18); color: #ff9a9a; }
.nav-n:empty { display: none; }
.side-foot { margin-top: auto; padding: 12px; border: 1px solid var(--side-line); border-radius: 10px; font-size: 12px; color: var(--side-mut); display: grid; gap: 8px; }
.side-foot .row b { color: #fff; font-size: 13px; display: block; }
.duty { display: flex; gap: 4px; }
.duty i { flex: 1; height: 4px; border-radius: 2px; background: #2a3146; }
.duty i.on { background: #3ccf8e; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 11px 24px; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; }
.search-btn { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 420px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted); text-align: left; }
.search-btn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 11px var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.live-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); white-space: nowrap; }
.live-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: ping 1.6s infinite; }
.live-chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.t-ic .i-sun { display: none; } [data-theme="dark"] .t-ic .i-sun { display: block; } [data-theme="dark"] .t-ic .i-moon { display: none; }
.me { margin-left: 4px; }
.nav-scrim { display: none; }
.view { padding: 22px 24px 48px; outline: none; width: 100%; max-width: 1480px; }

/* =========================================================
   3. Page parts: header, grid, cards, KPIs
   ========================================================= */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ph h1 { font-size: 26px; letter-spacing: -.015em; line-height: 1.2; margin-top: 3px; }
.ph h1:focus { outline: none; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; transition: transform .22s, border-color .22s, box-shadow .22s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 38%, var(--line)); box-shadow: 0 10px 28px -16px rgba(0, 0, 0, .35); }
.card::after { content: ""; position: absolute; left: 16px; right: 16px; top: -1px; height: 2px; border-radius: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .4s; }
.card:hover::after { transform: scaleX(1); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px 13px; transition: transform .22s, box-shadow .22s; overflow: hidden; }
.kpi:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .45); }
.kpi-h { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi-h .ic { color: var(--accent); }
.kpi-v { display: block; font-size: 27px; font-weight: 750; letter-spacing: -.02em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.kpi-f { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.delta { font-size: 12px; font-weight: 700; }
.delta.good { color: var(--ok); } .delta.badd { color: var(--bad); }
.kpi::before { content: ""; position: absolute; inset: auto -30% -60% auto; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); pointer-events: none; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } }

/* risk meter used in tables and the feed */
.risk { display: inline-flex; align-items: center; gap: 8px; min-width: 92px; }
.risk i { position: relative; flex: 1; height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 9%, transparent); overflow: hidden; }
.risk i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: inherit; background: currentColor; animation: hbIn .9s both; }
.risk b { font: 700 12px var(--mono); min-width: 20px; text-align: right; color: var(--ink); }
.risk.ok { color: var(--ok); } .risk.warn { color: var(--warn); } .risk.bad { color: var(--bad); }
.idc { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 7px; }
.who .av { width: 24px; height: 24px; font-size: 10px; }
.una { color: var(--muted); font-style: italic; }

/* live screening feed */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fi { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); }
.fi-r { display: grid; place-items: center; height: 32px; border-radius: 7px; font: 700 13px var(--mono); color: #fff; background: var(--ok); }
.fi.warn .fi-r { background: var(--warn); } .fi.bad .fi-r { background: var(--bad); }
.fi b { display: block; font-size: 13px; } .fi small { color: var(--muted); font-size: 11.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi > div { min-width: 0; }
.fi.new { animation: feedIn .6s cubic-bezier(.2, .9, .3, 1.2); }
.fi.new.bad { animation: feedIn .6s cubic-bezier(.2, .9, .3, 1.2), flash 1.2s .2s 2; }
@keyframes feedIn { from { opacity: 0; transform: translateY(-14px) scale(.97); } }
@keyframes flash { 50% { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); } }
.sevs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sev { padding: 10px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--line); text-align: left; }
.sev b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.sev span { font-size: 12px; color: var(--muted); }
.sev i { display: block; height: 3px; margin-top: 8px; border-radius: 2px; background: var(--k); animation: hbIn 1s both; width: var(--w); }
button.sev { cursor: pointer; font: inherit; color: inherit; transition: transform .15s, border-color .2s; }
button.sev:hover { transform: translateY(-2px); border-color: var(--k); }
button.sev[aria-pressed="true"] { border-color: var(--k); box-shadow: inset 0 0 0 1px var(--k); }

/* case drawer */
.case-top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); }
.case-top .scan { width: 170px; flex: none; position: relative; }
.scan::after { content: ""; position: absolute; left: 6%; right: 6%; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scanY 1.6s ease-in-out 2; opacity: 0; }
@keyframes scanY { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 0; } }
.case-meta { display: grid; gap: 4px; min-width: 0; }
.case-meta h3 { font-size: 19px; }
.sec-t { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
.sigs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sigs li { position: relative; display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); font-size: 13px; }
.sigs li i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: color-mix(in srgb, var(--bad) 10%, transparent); animation: hbIn 1s both; }
.sigs li > * { position: relative; }
.sigs b { font-family: var(--mono); color: var(--bad); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.facts div { padding: 9px 10px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); }
.facts span { display: block; font-size: 11.5px; color: var(--muted); } .facts b { font-size: 13.5px; }
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 10px; }
.tl li { position: relative; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl time { display: block; font-size: 11.5px; color: var(--muted); }
.note-add { display: flex; gap: 8px; margin-top: 10px; align-items: flex-start; }
.note-add textarea { flex: 1; min-height: 40px; }
.inp { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface2); color: var(--ink); }
select.inp { width: auto; }

/* ID checks page */
.split { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; align-items: start; }
.ck-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 620px; overflow: auto; }
.ck-item { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); text-align: left; transition: border-color .2s, transform .15s; }
.ck-item:hover { transform: translateX(3px); }
.ck-item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.ck-item b { display: block; font-size: 13px; } .ck-item small { color: var(--muted); font-size: 11.5px; }
.ck-view { display: grid; gap: 16px; }
.ck-docs { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; }
.docbox { position: relative; border-radius: 12px; overflow: hidden; background: var(--surface2); border: 1px solid var(--line); padding: 12px; }
.docbox p { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.idcard { display: block; width: 100%; height: auto; border-radius: 10px; }
.scanline { animation: scanCard 2.4s ease-in-out 2; }
@keyframes scanCard { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(200px); opacity: 0; } }
.selfie { position: relative; display: grid; place-items: center; }
.selfie .face { width: 100%; max-width: 170px; height: auto; border-radius: 10px; }
.lm { fill: none; stroke: #2dd4bf; stroke-width: 1.4; opacity: 0; animation: lmIn .4s both; animation-delay: calc(var(--d) * 70ms + .5s); }
@keyframes lmIn { from { opacity: 0; transform: scale(.2); } to { opacity: .95; } }
.lm { transform-box: fill-box; transform-origin: center; }
.match { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.checks li { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); font-size: 13px; animation: rise .5s both; animation-delay: calc(var(--i) * 60ms + .2s); }
.checks li .ck { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; background: var(--ok); flex: none; }
.checks li.no .ck { background: var(--bad); } .checks li.meh .ck { background: var(--warn); }
.checks li .ck .ic { width: 13px; height: 13px; stroke-width: 3; }
.checks li em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.decide { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--line); }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.mini { padding: 13px 14px; }
.mini span { font-size: 12px; color: var(--muted); display: block; } .mini b { font-size: 22px; font-variant-numeric: tabular-nums; }

/* link graph */
.graph-wrap { position: relative; border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%), repeating-linear-gradient(0deg, transparent 0 39px, color-mix(in srgb, var(--line) 70%, transparent) 39px 40px), repeating-linear-gradient(90deg, transparent 0 39px, color-mix(in srgb, var(--line) 70%, transparent) 39px 40px); }
.graph { display: block; width: 100%; height: auto; touch-action: none; }
.edge { stroke: color-mix(in srgb, var(--muted) 55%, transparent); stroke-width: 1.4; }
.edge.hot { stroke: var(--bad); stroke-width: 2; }
.edge.lit { stroke: var(--accent); stroke-width: 2.4; }
.gn { cursor: grab; outline: none; }
.gn .shape { stroke: var(--surface); stroke-width: 2.5; transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.gn:hover .shape, .gn:focus-visible .shape, .gn.sel .shape { transform: scale(1.25); }
.gn:focus-visible .shape, .gn.sel .shape { stroke: var(--accent); }
.gn text { font-size: 10.5px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; pointer-events: none; }
.gn.dim { opacity: .25; }
.gn.blocked .shape { fill: var(--c5) !important; }
.gn.blocked text { text-decoration: line-through; }
.halo { fill: var(--bad); opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out infinite; pointer-events: none; }
@keyframes halo { 0% { transform: scale(.6); opacity: .5; } 100% { transform: scale(2.4); opacity: 0; } }
.gside { display: grid; gap: 12px; align-content: start; }
.kind-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.kind-key span { display: inline-flex; align-items: center; gap: 6px; }
.kind-key svg { width: 14px; height: 14px; }
.ring-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ring-list li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface2); }

/* rules */
.rule { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.rule + .rule { margin-top: 0; }
.rule code { font: 12.5px var(--mono); color: var(--muted); display: block; margin-top: 3px; white-space: normal; }
.rule h3 { font-size: 14.5px; }
.rule .r-side { display: flex; align-items: center; gap: 10px; }
.rule.off { opacity: .6; }
.bands { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 12px 0 6px; }
.bands span { display: grid; place-items: center; color: #fff; font-size: 11.5px; font-weight: 700; transition: flex-grow .4s cubic-bezier(.3, 1.2, .4, 1); min-width: 0; overflow: hidden; white-space: nowrap; }
.band-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

    modal({ title: "Backtest results", body, wide: true, actions: [{ label: "Close", kind: "primary" }] });
    let k = 0; const bar = $(".bt-bar i", body), on2 = DB.rules.filter((r) => r.on);
    const fin = () => { $("p", body).textContent = `Done. ${on2.length} rules would have stopped ${sum(on2, (r) => sum(r.hits))} orders, with about ${Math.round(sum(on2, (r) => sum(r.hits)) * 0.07)} good customers caught by mistake.`; barChart($("#bt-ch", body), { labels: on2.map((r) => r.name.split(" ").slice(0, 2).join(" ")), series: [{ name: "Fraud caught", data: on2.map((r) => Math.round(sum(r.hits) * 0.93)), color: "var(--c1)" }, { name: "Good orders caught", data: on2.map((r) => Math.round(sum(r.hits) * 0.07) + 1), color: "var(--c5)" }], stacked: true, h: 220, fmt: fmt }); };
    if (RM) { bar.style.width = "100%"; fin(); return; }
    const t = setInterval(() => { k += 4; bar.style.width = k + "%"; if (k >= 100 || !body.isConnected) { clearInterval(t); body.isConnected && fin(); } }, 40);
  };
} };
function editRule(r) {
  const isNew = !r;
  formLayer({ title: isNew ? "New rule" : "Edit rule", submit: isNew ? "Create rule" : "Save rule", values: r || { op: ">", action: "Review", value: "" },
    fields: [{ k: "name", label: "Rule name", req: true, full: true }, { k: "field", label: "Check this", req: true, full: true, ph: "e.g. orders per card in 10 min" }, { k: "op", label: "Compare", type: "select", options: [">", ">=", "=", "<", "<="] }, { k: "value", label: "Value", req: true }, { k: "action", label: "Then", type: "select", options: ["Review", "Hold", "Step-up check", "Decline"], full: true }],
    onDelete: isNew ? null : async () => { if (await confirmBox("Delete “" + r.name + "”?", "Orders will no longer be checked by this rule.")) { const i = DB.rules.indexOf(r); DB.rules.splice(i, 1); save(); rerender(); toast("Rule deleted", "warn", { label: "Undo", run: () => { DB.rules.splice(i, 0, r); save(); rerender(); } }); } },
    onSubmit: (x) => { if (isNew) DB.rules.unshift({ id: uid("R"), on: true, hits: wave(14, 6), ...x }); else Object.assign(r, x); save(); rerender(); toast(isNew ? "Rule created and switched on" : "Rule saved"); } });
}

/* ---------- Reports ---------- */
let rpRange = "12M";
App.pages.reports = { title: "Reports", render(v) {
  const res = DB.cases.filter((c) => c.status === "Resolved"), fr = res.filter((c) => c.outcome === "Confirmed fraud").length;
  v.innerHTML = head("Reports", "How much fraud we stop, and how fast", `<button type="button" class="btn" id="rp-csv">${ic("download")}Cases CSV</button>`) + `
  <div class="grid"><section class="card s8"><div class="card-h"><h2>Loss prevented</h2><span id="rp-rg"></span></div><div class="chart" id="rp-bar"></div></section>
  <section class="card s4"><div class="card-h"><h2>Chargeback rate</h2></div><div id="rp-g"></div><p class="muted" style="text-align:center;font-size:12.5px;margin-top:6px">Card network limit is 1.0%</p></section>
  <section class="card s4"><div class="card-h"><h2>Case outcomes</h2></div><div id="rp-d"></div></section>
  <section class="card s8"><div class="card-h"><h2>Analysts this month</h2></div><div id="rp-t"></div></section></div>`;
  const data = (r) => { const n = r === "12M" ? 12 : RANGE_N[r]; return { labels: rangeLabels(r), series: [{ name: "Blocked at checkout", data: series(r).blk.map((x) => x * (r === "12M" ? 1100 : 38)), color: "var(--c1)" }, { name: "Won disputes", data: wave(n, r === "12M" ? 900000 : 30000), color: "var(--c3)" }] }; };
  const b = barChart($("#rp-bar"), { ...data(rpRange), stacked: true, h: 250, fmt: rsk, label: "Loss prevented" });
  $("#rp-rg").append(seg(["30D", "12M"], rpRange, (r) => { rpRange = r; b.set(data(r)); }));
  gauge($("#rp-g"), { value: 0.42, max: 1, label: "of card payments", color: "var(--ok)", cfmt: "pct2", size: 210 });
  donut($("#rp-d"), { data: [{ label: "Confirmed fraud", value: fr, color: "var(--c2)" }, { label: "False alarm", value: res.length - fr, color: "var(--c3)" }, { label: "Still open", value: openCases().length, color: "var(--c5)" }], size: 140, thick: 18, sub: "cases", cfmt: "n" });
  const rows = DB.team.map((u, i) => ({ id: u.id, name: u.name, role: u.role, closed: DB.cases.filter((c) => c.assignee === u.id && c.status === "Resolved").length + [31, 24, 9, 27, 7, 12][i], aht: [6.2, 8.1, 4.4, 7.3, 4.9, 11.6][i], acc: [97, 94, 98, 92, 96, 95][i] }));
  table($("#rp-t"), { rows: () => rows, size: 6, sort: "closed", dir: -1, cols: [{ k: "name", label: "Analyst", render: (r) => `<div class="cell-main">${av(r.name)}<div><b>${esc(r.name)}</b><small>${esc(r.role)}</small></div></div>` }, { k: "closed", label: "Cases closed", cls: "r" }, { k: "aht", label: "Avg handle time", cls: "r", render: (r) => r.aht + " min" }, { k: "acc", label: "Accuracy", cls: "r", render: (r) => r.acc + "%" }], onRow: (r) => toast(`${r.name}: ${r.closed} cases closed this month`, "info") });
  $("#rp-csv").onclick = () => download("vettora-cases.csv", toCSV(DB.cases, [{ k: "id", label: "Case" }, { k: "type", label: "Type" }, { k: "sev", label: "Severity" }, { k: "status", label: "Status" }, { k: "outcome", label: "Outcome" }, { k: "amount", label: "Amount (Rs)" }, { k: "risk", label: "Risk" }]));
} };

/* ---------- Settings ---------- */
App.pages.settings = { title: "Settings", render(v) {
  const p = DB.profile;
  v.innerHTML = head("Settings", "Your profile, team, alerts and demo data") + `
  <div class="set-grid"><section class="card"><div class="card-h"><h2>Profile</h2></div><form id="pf" class="form-grid" novalidate>
    <div class="field"><label for="pf-n">Name</label><input id="pf-n" value="${esc(p.name)}" aria-describedby="pf-n-e"><p class="err" id="pf-n-e"></p></div>
    <div class="field"><label for="pf-t">Title</label><input id="pf-t" value="${esc(p.title)}"></div>
    <div class="field full"><label for="pf-e">Email</label><input id="pf-e" type="email" value="${esc(p.email)}" aria-describedby="pf-e-e"><p class="err" id="pf-e-e"></p></div>
    <div class="full"><button type="submit" class="btn primary">Save profile</button></div></form></section>
  <section class="card"><div class="card-h"><h2>Team</h2><button type="button" class="btn sm" id="tm-add">${ic("plus")}Add analyst</button></div><div id="tm"></div></section>
  <section class="card"><div class="card-h"><h2>Alerts</h2></div>${[["mail", "Email me critical cases", "Within a minute of a score over 85"], ["sms", "Text message for rings", "When the graph finds a new ring"], ["digest", "Morning digest", "A summary of the night at 08:00"], ["sound", "Sound in the browser", "A soft chime on new cases"]].map(([k, l, s]) => `<div class="set-row"><div><b>${l}</b><small>${s}</small></div>${sw("pr-" + k, DB.prefs[k], l, `data-pref="${k}"`)}</div>`).join("")}</section>
  <section class="card"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Dark theme</b><small>Easier on the eyes on a night shift</small></div>${sw("st-dark", Theme.get() === "dark", "Dark theme")}</div><div class="set-row"><div><b>Export everything</b><small>All demo records as one JSON file</small></div><button type="button" class="btn sm" id="st-json">${ic("download")}Export</button></div><div class="set-row"><div><b>Reset demo data</b><small>Puts every case, order and rule back</small></div><button type="button" class="btn sm danger ghost" id="st-reset">${ic("refresh")}Reset</button></div></section></div>`;
  const team = () => { $("#tm").innerHTML = DB.team.map((u) => `<div class="team-li">${av(u.name)}<div><b>${esc(u.name)}</b><small>${esc(u.role)} · ${esc(u.email)}</small></div><span class="dot-on${u.online ? "" : " off"}"${tipAttr(u.online ? "On duty" : "Off duty")}></span>${u.id === ME ? "" : `<button type="button" class="icon-btn" data-rm="${u.id}" aria-label="Remove ${esc(u.name)}">${ic("trash")}</button>`}</div>`).join(""); };
  team();
  $("#pf").onsubmit = (e) => { e.preventDefault(); const n = $("#pf-n").value.trim(), em = $("#pf-e").value.trim(); $("#pf-n-e").textContent = n.length < 3 ? "Name needs at least 3 letters" : ""; $("#pf-e-e").textContent = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em) ? "" : "Enter a valid email address"; if (n.length < 3 || $("#pf-e-e").textContent) return; Object.assign(p, { name: n, email: em, title: $("#pf-t").value.trim() }); DB.team[0].name = n; save(); toast("Profile saved"); };
  on($("#tm"), "click", "[data-rm]", async (e, b) => { const u = userOf(b.dataset.rm); if (await confirmBox("Remove " + u.name + "?", "Their open cases go back to the queue as unassigned.", "Remove")) { DB.cases.forEach((c) => { if (c.assignee === u.id && c.status !== "Resolved") c.assignee = null; }); DB.team.splice(DB.team.indexOf(u), 1); save(); team(); toast(u.name + " removed from the team", "warn"); } });
  $("#tm-add").onclick = () => formLayer({ title: "Add an analyst", submit: "Add", fields: [{ k: "name", label: "Full name", req: true }, { k: "role", label: "Role", type: "select", options: ["Fraud analyst", "ID reviewer", "Chargebacks", "Lead analyst"] }, { k: "email", label: "Work email", type: "email", req: true, full: true }], onSubmit: (x) => { DB.team.push({ id: uid("u"), online: true, ...x }); save(); team(); toast(x.name + " joined the team"); } });
  on(v, "change", "[data-pref]", (e, i) => { DB.prefs[i.dataset.pref] = i.checked; save(); toast("Alert setting saved"); });
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-json").onclick = () => download("vettora-data.json", JSON.stringify(DB, null, 2), "application/json");
  $("#st-reset").onclick = async () => { if (await confirmBox("Reset demo data?", "Every change you made here is replaced with the original sample data.", "Reset")) { store.del(KEY); DB = seed(); gPos = null; gSel = null; ckSel = null; navCounts(); rerender(); toast("Demo data reset"); } };
} };

/* ---------- Live screening: a new order every few seconds ---------- */
every(2600, () => {
  const o = mkOrder(DB.accounts, Date.now(), "OR-" + ++DB.seq);
  DB.orders.unshift(o); if (DB.orders.length > 90) DB.orders.length = 90;
  DB.stats.screened += ri(18, 44); if (o.status === "Declined") DB.stats.blocked += o.amount;
  if (o.risk >= 82 && chance(0.55)) { const c = mkCase(o, "CS-" + ++DB.cseq, DB.team, "New"); DB.cases.unshift(c); if (DB.cases.length > 70) DB.cases.pop(); Notes.add(`${c.id}: ${c.type.toLowerCase()} on ${o.id} (${rs(o.amount)}), score ${o.risk}`, c.sev === "Critical" ? "bad" : "warn"); navCounts(); }
  save();
  const f = $("#feed"); if (f) { f.prepend(feedItem(o, true)); while (f.children.length > 6) f.lastElementChild.remove(); }
  const k1 = $("#k-screened"), k2 = $("#k-blocked"); k1 && countUp(k1, DB.stats.screened, fmt, 600); k2 && countUp(k2, DB.stats.blocked, rsk, 600);
  $("#live-rate").textContent = ri(31, 47);
});

/* ---------- Commands for Ctrl+K and start ---------- */
App.commands = () => [
  { label: "Take the next case", hint: "Queue", run: () => { go("#/queue"); setTimeout(() => $("#q-next") && $("#q-next").click(), 50); } },
  { label: "Add an account", hint: "Accounts", run: () => editAccount(null) },
  { label: "New rule", hint: "Rules", run: () => editRule(null) },
  { label: "Request an ID check", hint: "ID checks", run: () => requestCheck() },
  ...DB.cases.slice(0, 12).map((c) => ({ label: `${c.id} · ${c.type} · ${acct(c.account).name}`, hint: "Case", run: () => openCase(c) })),
  ...DB.accounts.slice(0, 12).map((a) => ({ label: a.name, hint: "Account " + a.id, run: () => openAccount(a) })),
];
[["Ring of 5 sellers found on one phone", "bad", 40], ["ID check backlog under 15 minutes", "info", 95], ["Rule “Card velocity” stopped 12 orders", "warn", 160]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
navCounts();
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; };
boot({ title: "Vettora", key: "vettora", def: "overview" });
</script>
