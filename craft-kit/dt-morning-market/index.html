<!doctype html>
<!-- Chill & Craft · Morning Market · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Market · Wholesale fruit and vegetable desk</title>
<meta name="description" content="A wholesale fruit and vegetable trader's dashboard: live auction board, growers, shops on credit, trucks, stock and wastage.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: leafy green canvas, cream cards, tomato red (light) / night market (dark) ---------- */
  :root {
    --canvas: #2b5839; --canvas-2: #23492f; --glow-1: #3f7d50; --glow-2: #336b45; --vein: .05;
    --canvas-ink: #f6f1e1; --canvas-muted: rgba(246,241,225,.7); --canvas-line: rgba(246,241,225,.16); --nav-bg: rgba(10,30,16,.22);
    --surface: #fbf7ec; --surface-2: #f1ebda; --panel: #fffaf0; --card-edge: rgba(255,255,255,.7);
    --ink: #1d291e; --muted: #687061; --line: rgba(44,58,36,.13); --grid: rgba(44,58,36,.1);
    --accent: #e0442c; --accent-ink: #fff; --accent-soft: #fde3d6; --accent-deep: #b8321e;
    --leaf: #2f8447; --leaf-soft: #e0eed5; --sun: #f0b52d; --sun-soft: #fbefcb;
    --good: #2f8447; --bad: #d33a26; --warn: #c77f0c;
    --board: #121a14; --board-cell: #1e2a21; --board-cell-2: #18221b; --board-ink: #f7ebc9; --board-dim: #9aa58f;
    --radius: 16px; --radius-sm: 10px; --tip-bg: #18231a; --tip-ink: #fff; --overlay: rgba(12,26,16,.5);
    --shadow: 0 1px 0 rgba(255,255,255,.65) inset, 0 16px 34px -24px rgba(6,26,12,.7);
    --shadow-hi: 0 1px 0 rgba(255,255,255,.65) inset, 0 24px 44px -24px rgba(6,26,12,.8);
    --focus: #f0b52d;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --canvas: #0d1610; --canvas-2: #142019; --glow-1: #1b3324; --glow-2: #162a1d; --vein: .035;
    --canvas-ink: #eef0e2; --canvas-muted: rgba(238,240,226,.62); --canvas-line: rgba(238,240,226,.11); --nav-bg: rgba(0,0,0,.28);
    --surface: #17231a; --surface-2: #1f2e23; --panel: #1a271d; --card-edge: rgba(255,255,255,.05);
    --ink: #eef0e2; --muted: #9da795; --line: rgba(238,240,226,.1); --grid: rgba(238,240,226,.07);
    --accent: #ff6346; --accent-ink: #1d0904; --accent-soft: rgba(255,99,70,.15); --accent-deep: #ff8a70;
    --leaf: #6cc07e; --leaf-soft: rgba(108,192,126,.14); --sun: #f5c552; --sun-soft: rgba(245,197,82,.14);
    --good: #6cc07e; --bad: #ff7a62; --warn: #f5c552;
    --board: #070c08; --board-cell: #152018; --board-cell-2: #101a13; --board-ink: #f7ebc9; --board-dim: #85907d;
    --tip-bg: #f2efe2; --tip-ink: #18231a; --overlay: rgba(0,0,0,.6);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 36px -22px rgba(0,0,0,.8);
    --shadow-hi: 0 1px 0 rgba(255,255,255,.05) inset, 0 26px 46px -22px rgba(0,0,0,.9);
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }
  /* =====================================================================
     Morning Market: page styles. Sizes are tuned for 1440x900 first,
     then 1280, tablets and a 390 px phone (nav becomes a bottom bar).
     ===================================================================== */
  body { background: var(--canvas); color: var(--ink); font: 13px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .canvas { position: fixed; inset: 0; z-index: -1; background: radial-gradient(900px 520px at 6% -10%, var(--glow-1), transparent 62%), radial-gradient(760px 620px at 106% 14%, var(--glow-2), transparent 60%), var(--canvas); }
  /* faint leaf veins across the canvas */
  .canvas::after { content: ""; position: absolute; inset: 0; opacity: var(--vein); background-image: repeating-linear-gradient(128deg, var(--canvas-ink) 0 1px, transparent 1px 36px), repeating-linear-gradient(38deg, var(--canvas-ink) 0 1px, transparent 1px 92px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 75%); mask-image: linear-gradient(180deg, #000, transparent 75%); }
  a { color: inherit; }
  h1, h2, h3 { letter-spacing: -.012em; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .grow { flex: 1; min-width: 0; }

  /* ---------- Top bar: brand, pill nav, tools ---------- */
  .top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px; max-width: 1440px; margin: 0 auto; padding: 12px 24px; }
  .top::before { content: ""; position: absolute; inset: 0; z-index: -1; background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; transition: opacity .25s; }
  .scrolled .top::before { opacity: 1; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--canvas-ink); text-decoration: none; white-space: nowrap; }
  .brand .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--canvas-2); border: 1px solid var(--canvas-line); box-shadow: 0 8px 18px -10px rgba(0,0,0,.6); }
  .brand .logo svg { width: 26px; height: 26px; }
  .brand b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .brand small { display: block; font-size: 10.5px; color: var(--canvas-muted); font-weight: 600; letter-spacing: .02em; }
  .nav { position: relative; display: flex; gap: 2px; margin: 0 auto; padding: 4px; border-radius: 14px; background: var(--nav-bg); border: 1px solid var(--canvas-line); }
  .nav a, .nav .more-btn { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 10px; color: var(--canvas-muted); text-decoration: none; font-weight: 600; font-size: 12.5px; white-space: nowrap; transition: color .2s; border: 0; background: none; }
  .nav a:hover { color: var(--canvas-ink); }
  .nav a[aria-current="page"] { color: #fff; }
  .nav .ic { width: 15px; height: 15px; }
  .nav .mark { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 10px; background: var(--accent); box-shadow: 0 8px 18px -8px var(--accent); transition: transform .45s cubic-bezier(.3,1.25,.5,1), width .3s; }
  .nav .pip { position: absolute; top: 5px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 2px var(--canvas-2); }
  .nav .pip[hidden] { display: none; }
  .nav .more-btn { display: none; }
  .tools { display: flex; align-items: center; gap: 8px; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--canvas-line); background: var(--canvas-2); color: var(--canvas-ink); transition: transform .15s, background .2s; }
  .icon-btn:hover { background: color-mix(in srgb, var(--canvas-2) 70%, #fff 8%); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn .ic { width: 17px; height: 17px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; box-shadow: 0 0 0 2px var(--canvas); }
  .badge:empty { display: none; }
  .me { width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--canvas-line); background: var(--sun-soft); color: var(--ink); font-weight: 800; font-size: 12px; position: relative; }
  [data-theme="dark"] .me { color: var(--sun); }
  .me::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: #48c26a; box-shadow: 0 0 0 2px var(--canvas); }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .kbd { font: 600 10.5px/1 inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--canvas-line); color: var(--canvas-muted); }

  /* ---------- Page frame ---------- */
  main { max-width: 1440px; margin: 0 auto; padding: 2px 24px 44px; overflow-x: clip; }
  #view.swap { animation: viewIn .3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
  .ph { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin: 8px 0 16px; color: var(--canvas-ink); }
  .ph h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 780; letter-spacing: -.03em; }
  .ph h1::after { content: ""; display: block; width: 52px; height: 5px; margin-top: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 0 66%, transparent 66% 74%, var(--sun) 74%); transform-origin: left; animation: ulGrow .6s .12s cubic-bezier(.3,1.2,.4,1) both; }
  @keyframes ulGrow { from { transform: scaleX(0); } }
  .ph p { margin: 6px 0 0; color: var(--canvas-muted); font-size: 13px; }
  .ph p b { color: var(--canvas-ink); font-weight: 650; }
  .ph .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border-radius: 11px; min-height: 36px; padding: 0 14px; font-size: 12.5px; background: var(--surface); border-color: var(--line); }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 10px 22px -12px var(--accent); }
  [data-theme="dark"] .btn.primary { color: #1d0904; }
  .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-deep); }
  .btn.oncanvas { background: var(--nav-bg); color: var(--canvas-ink); border-color: var(--canvas-line); }
  .btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; border-radius: 9px; }
  .btn .ic { width: 15px; height: 15px; }
  .linkish { border: 0; background: none; padding: 0; color: var(--accent-deep); font-weight: 650; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-size: 12.5px; }
  [data-theme="dark"] .linkish { color: var(--accent); }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
  .card { position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--card-edge); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); transition: transform .3s cubic-bezier(.3,1.3,.5,1), box-shadow .3s; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hi); }
  .card.flat:hover { transform: none; }
  .card.tint { background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface)); }
  .ch { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 28px; flex-wrap: wrap; }
  .ch h2 { margin: 0; font-size: 13.5px; font-weight: 720; }
  .ch small { color: var(--muted); font-size: 11.5px; }
  .ch .go { margin-left: auto; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); text-decoration: none; transition: color .2s, border-color .2s, transform .2s; }
  .ch .go:hover { color: var(--accent); border-color: var(--accent); transform: translate(1px, -1px); }
  .ch .go .ic { width: 14px; height: 14px; }
  .ch .right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; font-weight: 650; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px -3px rgba(0,0,0,.25); }
  [data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--accent); color: #1d0904; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
  .pill.good { background: var(--leaf-soft); color: var(--good); }
  .pill.bad { background: var(--accent-soft); color: var(--bad); }
  .pill.warn { background: var(--sun-soft); color: var(--warn); }
  .pill .ic { width: 12px; height: 12px; }
  .up { color: var(--good); } .dn { color: var(--bad); }
  .kpi { display: grid; gap: 2px; }
  .kpi .lbl { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11.5px; font-weight: 650; }
  .kpi .lbl .ic { width: 15px; height: 15px; padding: 5px; box-sizing: content-box; border-radius: 8px; background: var(--surface-2); color: var(--ink); }
  .kpi .val { font-size: 22px; font-weight: 780; letter-spacing: -.025em; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .kpi .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .thumb { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); display: block; }
  .itm { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; white-space: nowrap; }
  .itm .thumb { width: 26px; height: 26px; border-radius: 7px; }
  .who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .who .cc-av { width: 28px; height: 28px; font-size: 10.5px; }
  .who b { font-weight: 650; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .rowbtns { display: flex; gap: 4px; justify-content: flex-end; }
  .rowbtns button { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .rowbtns button:hover { color: var(--accent); border-color: var(--accent); }
  .rowbtns .ic { width: 14px; height: 14px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--c, var(--accent)); transition: width 1s cubic-bezier(.3,1.1,.4,1); }
  .amt { font-weight: 720; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }

  /* tables inside cards: compact like the rest of the page */
  .cc-tbl table { font-size: 12.5px; min-width: 640px; }
  .cc-tbl th { font-size: 10.5px; padding: 7px 10px; }
  .cc-tbl td { padding: 8px 10px; }
  .cc-search { min-height: 34px; max-width: 260px; }
  .cc-chip { min-height: 30px; font-size: 12px; }
  .cc-tbar { margin-bottom: 8px; }
  .cc-field label { font-size: 12px; }
  .cc-dh h2 { font-size: 16px; }

  /* ---------- Skeleton shimmer (data-heavy pages, about 400 ms) ---------- */
  .sk { min-height: 96px; display: grid; gap: 10px; align-content: start; }
  .sk.tall { min-height: 340px; }
  .sk i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 0%, color-mix(in srgb, var(--surface-2) 40%, var(--surface)) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1s linear infinite; }
  .sk i:nth-child(1) { width: 40%; } .sk i:nth-child(2) { width: 70%; height: 22px; } .sk i:nth-child(3) { width: 90%; } .sk i:nth-child(4) { width: 60%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* =====================================================================
     Today: hero (greeting, tiles, flip board, auction floor feed)
     ===================================================================== */
  .hero { display: grid; grid-template-columns: 236px minmax(0, 1fr) 292px; grid-template-rows: auto 1fr; grid-template-areas: "hello mid right" "left mid right"; gap: 14px 18px; padding: 16px 18px; }
  .hero:hover { transform: none; }
  .h-hello { grid-area: hello; }
  .h-hello h1 { margin: 0; font-size: 18px; font-weight: 780; letter-spacing: -.02em; }
  .h-hello h1 span { color: var(--accent); }
  .h-hello p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  .h-left { grid-area: left; display: grid; gap: 10px; align-content: start; }
  .h-mid { grid-area: mid; min-width: 0; }
  .h-right { grid-area: right; display: flex; flex-direction: column; min-width: 0; }
  .tile { position: relative; overflow: hidden; border-radius: 13px; padding: 11px 13px; background: var(--surface-2); border: 1px solid var(--line); }
  .tile.t { background: var(--accent-soft); border-color: transparent; }
  .tile.g { background: var(--leaf-soft); border-color: transparent; }
  .tile .lbl { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--muted); }
  .tile .lbl .ic { width: 14px; height: 14px; color: var(--ink); }
  .tile .big { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 11.5px; color: var(--muted); }
  .tile .cc-spark { position: absolute; right: 10px; top: 12px; opacity: .9; }
  .avs { display: flex; margin-top: 6px; }
  .avs .cc-av { width: 24px; height: 24px; font-size: 9px; margin-right: -6px; box-shadow: 0 0 0 2px var(--leaf-soft); }
  .avs small { margin-left: 12px; align-self: center; color: var(--muted); font-size: 11.5px; }

  /* ---------- Signature 1: the split-flap price board ---------- */
  .board { --fw: 17px; --fh: 26px; --ff: 15px; position: relative; height: 100%; display: flex; flex-direction: column; background: var(--board); color: var(--board-ink); border-radius: 14px; padding: 12px 14px 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 40px -22px rgba(0,0,0,.7); overflow: hidden; }
  .board::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(600px 160px at 50% -40px, rgba(247,235,201,.07), transparent 70%); }
  .bh { position: relative; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font: 700 11px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--board-dim); }
  .bh b { color: var(--board-ink); font-weight: 800; }
  .bh .clock { margin-left: auto; color: var(--sun); font-size: 13px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #4fd277; box-shadow: 0 0 0 0 rgba(79,210,119,.6); animation: livePulse 1.8s infinite; flex: none; }
  .live.off { background: var(--board-dim); animation: none; }
  @keyframes livePulse { 70% { box-shadow: 0 0 0 7px rgba(79,210,119,0); } 100% { box-shadow: 0 0 0 0 rgba(79,210,119,0); } }
  .bseg { display: flex; gap: 3px; }
  .bseg button { min-width: 38px; height: 24px; padding: 0 6px; border-radius: 6px; border: 1px solid rgba(247,235,201,.14); background: var(--board-cell-2); color: var(--board-dim); font: 700 10.5px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; }
  .bseg button[aria-pressed="true"] { background: var(--sun); color: #1b1404; border-color: transparent; }
  .brow { position: relative; display: flex; align-items: center; gap: 12px; padding: 3px 6px; margin: 0 -6px; border-radius: 7px; text-decoration: none; color: inherit; }
  a.brow:hover { background: rgba(247,235,201,.05); }
  .brow.hit::after { content: ""; position: absolute; inset: 0; border-radius: 7px; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(240,181,45,.22), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: sweep 1.1s ease-out; }
  @keyframes sweep { from { background-position: -60% 0; } to { background-position: 170% 0; } }
  .bhead { font: 700 9.5px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--board-dim); padding-bottom: 6px; }
  .bcol { flex: none; width: calc(var(--n) * (var(--fw) + 2px)); }
  .bhead .r { text-align: right; }
  .flg { display: inline-flex; gap: 2px; }
  .fl { position: relative; width: var(--fw); height: var(--fh); perspective: 140px; font: 700 var(--ff)/var(--fh) ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--board-ink); }
  .fl > i { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; display: block; font-style: normal; text-align: center; background: var(--board-cell); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .fl > i > b { display: block; height: var(--fh); font-weight: 700; }
  .fl > .t, .fl > .ft { top: 0; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--board-cell) 80%, #fff 6%), var(--board-cell)); }
  .fl > .b, .fl > .fb { bottom: 0; border-radius: 0 0 3px 3px; }
  .fl > .b > b, .fl > .fb > b { margin-top: calc(var(--fh) / -2); }
  .fl::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - .5px); height: 1px; background: rgba(0,0,0,.65); z-index: 3; }
  .fl > .ft { z-index: 2; transform-origin: 50% 100%; animation: flTop var(--fd, 150ms) ease-in forwards; }
  .fl > .fb { z-index: 2; transform-origin: 50% 0; transform: rotateX(90deg); animation: flBot var(--fd, 150ms) var(--fd, 150ms) ease-out forwards; }
  @keyframes flTop { to { transform: rotateX(-90deg); } }
  @keyframes flBot { to { transform: rotateX(0deg); } }
  .flg.g .fl { color: #7fe39a; } .flg.r .fl { color: #ff8a72; } .flg.y .fl { color: var(--sun); } .flg.d .fl { color: var(--board-dim); }
  .arr { width: 12px; flex: none; text-align: center; font-size: 11px; }
  .arr.g { color: #7fe39a; } .arr.r { color: #ff8a72; }
  .bfoot { position: relative; display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; font: 600 10.5px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; color: var(--board-dim); }
  .bfoot .grow { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* ---------- Auction floor feed ---------- */
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; overflow: hidden; }
  .feed li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 10px; transition: background .4s; }
  .feed li.mine { background: var(--accent-soft); }
  .feed li.new { animation: feedIn .55s cubic-bezier(.2,.9,.3,1.1) both; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-14px) scale(.98); } }
  .feed b { display: block; font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed em { font-style: normal; font-weight: 750; font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
  .feed em small { font-weight: 600; }
  .sq { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--sun-soft); color: var(--ink); }
  .sq .ic { width: 13px; height: 13px; }
  .h-right .more { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }

  /* ---------- Signature 2: crate-stack chart of the stock ---------- */
  .stacks { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; align-items: end; min-height: var(--h, 200px); overflow-x: clip; }
  .stack { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;  min-width: 0; padding: 4px 2px 2px; border: 0; background: none; border-radius: 10px; cursor: pointer; transition: background .2s; }
  .stack:hover, .stack:focus-visible { background: var(--surface-2); }
  .pile { display: flex; flex-direction: column-reverse; gap: 2px; width: min(44px, 100%); padding-top: 6px; }
  .crate { position: relative; height: 11px; border-radius: 3px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 0 rgba(0,0,0,.08); animation: crateDrop .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0ms); }
  .crate::before { content: ""; position: absolute; inset: 3px 5px 4px; border-radius: 1px; background: repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 2px, transparent 2px 7px); }
  .crate:nth-child(4n+2) { margin: 0 -2px 0 2px; } .crate:nth-child(4n) { margin: 0 1px 0 -1px; }
  .crate.top::after { content: ""; position: absolute; left: 3px; right: 3px; top: -6px; height: 7px; background: radial-gradient(circle at 15% 100%, var(--p) 3.4px, transparent 3.9px), radial-gradient(circle at 39% 100%, var(--p) 4px, transparent 4.5px), radial-gradient(circle at 63% 100%, var(--p) 3.6px, transparent 4.1px), radial-gradient(circle at 86% 100%, var(--p) 3.3px, transparent 3.8px); }
  .crate.part { height: 7px; }
  .crate.part::before { inset: 2px 5px 3px; }
  @keyframes crateDrop { 0% { opacity: 0; transform: translateY(-80px); } 55% { opacity: 1; } 78% { transform: translateY(2px); } 100% { transform: none; } }
  .stack .ct { font-size: 12.5px; font-weight: 780; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stack .nm { font-size: 11px; color: var(--muted); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .age { font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 99px; background: var(--leaf-soft); color: var(--good); white-space: nowrap; }
  .age.mid { background: var(--sun-soft); color: var(--warn); }
  .age.old { background: var(--accent-soft); color: var(--bad); }
  .stack-legend { padding-top: 8px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .stack-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Toasts (announced politely to screen readers) ---------- */
function toast(msg, kind = "") {
  let box = $("#cc-toasts");
  if (!box) {
    box = document.createElement("div");
    box.id = "cc-toasts";
    box.className = "cc-toasts";
    box.setAttribute("role", "status");
    box.setAttribute("aria-live", "polite");
    document.body.appendChild(box);
  }
  const t = document.createElement("div");
  t.className = "cc-toast " + kind;
  t.innerHTML = ic(kind === "bad" ? "x" : kind === "warn" ? "bell" : "check") + "<span>" + esc(msg) + "</span>";
  box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 2800);
}

/* ---------- Modal + drawer with focus trap, Esc and backdrop close ---------- */
const modals = [];
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function openModal({ title, html = "", drawer = false, wide = false, actions = null, onOpen = null, onClose = null, cls = "" }) {
  const prev = document.activeElement;
  const id = "dlg-" + uid();
  const wrap = document.createElement("div");
  wrap.className = "cc-overlay" + (drawer ? " is-drawer" : "") + (cls ? " " + cls : "");
  wrap.innerHTML = `<div class="cc-back" data-close></div>
    <div class="cc-dialog${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="${id}">
      <header class="cc-dh"><h2 id="${id}">${esc(title)}</h2><button type="button" class="cc-x" data-close aria-label="Close">${ic("x")}</button></header>
      <div class="cc-db">${html}</div>
      ${actions ? '<footer class="cc-df"></footer>' : ""}
    </div>`;
  const dlg = $(".cc-dialog", wrap);
  const api = { el: dlg, body: $(".cc-db", wrap), wrap, close };
  if (actions) {
    const f = $(".cc-df", wrap);
    actions.forEach((a) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.kind || "ghost");
      b.textContent = a.label;
      b.addEventListener("click", () => { const keep = a.fn ? a.fn(api) === false : false; if (!keep && a.close !== false) close(); });
      f.appendChild(b);
    });
  }
  let closed = false;
  function close() {
    if (closed) return;
    closed = true;
    wrap.classList.remove("open");
    setTimeout(() => wrap.remove(), RM ? 0 : 280);
    const at = modals.indexOf(api);
    if (at >= 0) modals.splice(at, 1);
    if (onClose) onClose();
    if (prev && prev.focus && document.contains(prev)) prev.focus();
  }
  wrap.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
  wrap.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = $$(FOCUSABLE, dlg).filter((x) => x.offsetParent !== null || x === document.activeElement);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  document.body.appendChild(wrap);
  modals.push(api);
  requestAnimationFrame(() => wrap.classList.add("open"));
  if (onOpen) onOpen(api);
  const first = $("[autofocus]", dlg) || $$(FOCUSABLE, $(".cc-db", wrap))[0] || $(".cc-x", wrap);
  if (first) setTimeout(() => first.focus(), 30);
  return api;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modals.length) { e.preventDefault(); modals[modals.length - 1].close(); } });

  hit.addEventListener("pointerleave", () => { tip.hide(); guide.classList.remove("on"); dots.forEach((d) => d.classList.remove("on")); });
}

/* Bar chart (grouped or stacked). o = {labels, series:[{name,data,color}], stacked, height, fmt} */
function barChart(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, H = o.height || 220, W = Math.max(260, el.clientWidth || 640);
    const S = o.series, n = (o.labels || []).length;
    if (!n || !S.length) return emptyChart(el, H);
    const tot = (i) => sum(S.map((s) => Math.max(0, s.data[i] || 0)));
    const neg = (i) => sum(S.map((s) => Math.min(0, s.data[i] || 0)));
    const all = o.stacked ? o.labels.flatMap((_, i) => [tot(i), neg(i)]) : S.flatMap((s) => s.data);
    const sc = ticksFor(Math.min(0, ...all), Math.max(0, ...all), 4), f = o.fmt || short;
    const P = { l: o.padL || 46, r: 10, t: 12, b: 26 }, iw = W - P.l - P.r, ih = H - P.t - P.b;
    const Y = (v) => P.t + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih;
    const band = iw / n, gw = band * (o.gap || 0.62), bw = o.stacked ? gw : gw / S.length;
    const every_ = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 46))));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Bar chart")}" class="cc-chart${again ? " cc-static" : ""}">`;
    s += sc.ticks.map((t) => `<g class="cc-grid"><line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${P.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(f(t))}</text></g>`).join("");
    for (let i = 0; i < n; i++) {
      const x0 = P.l + band * i + (band - gw) / 2;
      let up = 0, dn = 0;
      S.forEach((x, k) => {
        const v = x.data[i] || 0;
        let y, h;
        if (o.stacked) { const base = v >= 0 ? up : dn; y = v >= 0 ? Y(base + v) : Y(base); h = Math.abs(Y(base + v) - Y(base)); if (v >= 0) up += v; else dn += v; }
        else { y = v >= 0 ? Y(v) : Y(0); h = Math.abs(Y(v) - Y(0)); }
        const bx = o.stacked ? x0 : x0 + bw * k;
        const rr = Math.min(o.radius != null ? o.radius : 4, bw / 2, h / 2);
        s += `<rect class="cc-bar${v < 0 ? " neg" : ""}" x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw - (o.stacked ? 0 : 2)).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="${rr}" style="fill:${x.color};animation-delay:${i * 35 + k * 60}ms"/>`;
      });
      if (i % every_ === 0) s += `<text class="cc-xl" x="${(x0 + gw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
      s += `<rect class="cc-hit" data-i="${i}" x="${P.l + band * i}" y="${P.t}" width="${band}" height="${ih}" fill="transparent"/>`;
    }
    s += `<line class="cc-zero" x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}"/></svg>`;
    el.innerHTML = s + legendHTML(S);
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => {
      const h = e.target.closest(".cc-hit"); if (!h) return tip.hide();
      const i = +h.dataset.i;
      $$(".cc-hit", svg).forEach((x) => x.classList.toggle("on", x === h));
      tip.show(e, `<b>${esc(o.labels[i])}</b>` + S.map((x) => `<div><i style="background:${x.color}"></i>${esc(x.name)}<em>${esc((o.tipFmt || f)(x.data[i] || 0))}</em></div>`).join("") + (o.stacked && S.length > 1 ? `<div class="cc-tip-tot">Total<em>${esc((o.tipFmt || f)(tot(i) + neg(i)))}</em></div>` : ""));
    });
    svg.addEventListener("pointerleave", () => { tip.hide(); $$(".cc-hit", svg).forEach((x) => x.classList.remove("on")); });
  });
}

/* Donut that sweeps in. o = {items:[{label,value,color}], size, thick, fmt, center:[big, small], legend} */
function donut(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, D = o.size || 180, T = o.thick || 22, r = (D - T) / 2 - 4, C = 2 * Math.PI * r;
    const items = o.items.filter((x) => x.value > 0), tot = sum(items.map((x) => x.value)), f = o.fmt || ((v) => short(v));
    let acc = 0;
    const segs = items.map((x) => { const len = tot ? (x.value / tot) * C : 0, s0 = acc; acc += len; return { ...x, len, s0 }; });
    const gap = items.length > 1 ? Math.min(3, C * 0.006) : 0;
    let s = `<div class="cc-donut-wrap"><div class="cc-donut" style="width:${D}px;height:${D}px"><svg viewBox="0 0 ${D} ${D}" width="${D}" height="${D}" role="img" aria-label="${esc(o.aria || "Donut chart")}"><circle class="cc-track" cx="${D / 2}" cy="${D / 2}" r="${r}" style="stroke-width:${T}"/>`;
    s += segs.map((x, i) => `<circle class="cc-seg" data-i="${i}" cx="${D / 2}" cy="${D / 2}" r="${r}" transform="rotate(-90 ${D / 2} ${D / 2})" style="stroke:${x.color};stroke-width:${T}" stroke-dasharray="0 ${C}" stroke-dashoffset="${-x.s0}"/>`).join("");
    s += `</svg><div class="cc-donut-c">${o.center ? `<b data-count>${esc(o.center[0])}</b><small>${esc(o.center[1] || "")}</small>` : ""}</div></div>`;
    if (o.legend !== false) s += `<ul class="cc-dlegend">${segs.map((x, i) => `<li data-i="${i}"><i style="background:${x.color}"></i><span>${esc(x.label)}</span><em>${esc(f(x.value))}</em><small>${tot ? Math.round((x.value / tot) * 100) : 0}%</small></li>`).join("")}</ul>`;
    el.innerHTML = s + "</div>";
    if (!tot) $(".cc-donut-c", el).innerHTML = "<b>—</b><small>No data</small>";
    const cs = $$(".cc-seg", el);
    const setT = (t) => cs.forEach((c, i) => c.setAttribute("stroke-dasharray", `${Math.max(0, segs[i].len * t - gap)} ${C}`));
    if (again) setT(1); else tween(1000, setT);
    const hl = (i, e) => {
      cs.forEach((c, k) => c.classList.toggle("dim", i != null && k !== i));
      $$(".cc-dlegend li", el).forEach((li, k) => li.classList.toggle("on", k === i));
      if (i != null && e) tip.show(e, `<b>${esc(segs[i].label)}</b><div><i style="background:${segs[i].color}"></i>${esc(f(segs[i].value))}<em>${Math.round((segs[i].value / tot) * 100)}%</em></div>`);
    };
    el.onpointermove = (e) => { const t = e.target.closest("[data-i]"); if (t) hl(+t.dataset.i, e); else { hl(null); tip.hide(); } };
    el.onpointerleave = () => { hl(null); tip.hide(); };
  });
}

/* Half-circle gauge. o = {value, max, color, label, fmt, size} */
function gauge(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, W = o.size || 200, H = W * 0.62, r = W / 2 - 14, cx = W / 2, cy = W / 2;
    const p = clamp((o.value || 0) / (o.max || 1), 0, 1);
    const arc = `M${cx - r},${cy} A${r},${r} 0 0 1 ${cx + r},${cy}`;
    el.innerHTML = `<div class="cc-gauge"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${esc((o.label || "Gauge") + ": " + Math.round(p * 100) + "%")}"><path class="cc-track" d="${arc}" style="stroke-width:${o.thick || 14}"/><path class="cc-gfill" d="${arc}" pathLength="100" style="stroke:${o.color};stroke-width:${o.thick || 14}" stroke-dasharray="0 100"/><circle class="cc-gknob" r="5" cx="${cx - r}" cy="${cy}" style="fill:${o.color}"/></svg><div class="cc-gauge-c"><b>${esc((o.fmt || ((v) => Math.round(v * 100) + "%"))(p))}</b><small>${esc(o.label || "")}</small></div></div>`;
    const fill = $(".cc-gfill", el), knob = $(".cc-gknob", el);
    const set = (t) => { const q = p * t; fill.setAttribute("stroke-dasharray", `${q * 100} 100`); const a = Math.PI * (1 - q); knob.setAttribute("cx", cx + r * Math.cos(a)); knob.setAttribute("cy", cy - r * Math.sin(a)); };
    if (again) set(1); else tween(1100, set);
    el.onpointermove = (e) => tip.show(e, `<b>${esc(o.label || "")}</b><div>${esc(o.tip || Math.round(p * 100) + "% of target")}</div>`);
    el.onpointerleave = () => tip.hide();
  });
}

/* Sparkline as an SVG string (for KPI cards and table rows) */
function spark(data, color = "currentColor", w = 96, h = 30, area = true) {
  if (!data || data.length < 2) return "";
  const lo = Math.min(...data), hi = Math.max(...data), rg = hi - lo || 1;
  const pts = data.map((v, i) => [(i * (w - 2)) / (data.length - 1) + 1, h - 3 - ((v - lo) / rg) * (h - 6)]);
  const d = pathD(pts, true), id = "sp" + uid();
  return `<svg class="cc-spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${area ? `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path class="cc-fade" d="${d}L${w - 1},${h}L1,${h}Z" fill="url(#${id})"/>` : ""}<path class="cc-line cc-draw" pathLength="1" d="${d}" style="stroke:${color}"/></svg>`;
}

/* Heatmap grid. o = {rows, cols, data:[[v]], color, fmt, cell} */
function heatmap(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, W = Math.max(260, el.clientWidth || 640), L = o.padL || 40, T = 18;
    const cw = (W - L) / o.cols.length, ch = o.cell || Math.min(26, cw);
    const H = T + ch * o.rows.length + 4, all = o.data.flat(), hi = Math.max(...all, 1), f = o.fmt || short;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Heatmap")}" class="cc-chart${again ? " cc-static" : ""}">`;
    const every_ = Math.max(1, Math.ceil(o.cols.length / Math.floor((W - L) / 34)));
    s += o.cols.map((c, j) => (j % every_ === 0 ? `<text class="cc-xl" x="${L + cw * j + cw / 2}" y="12" text-anchor="middle">${esc(c)}</text>` : "")).join("");
    o.rows.forEach((rw, i) => {
      s += `<text class="cc-xl" x="${L - 6}" y="${T + ch * i + ch / 2 + 4}" text-anchor="end">${esc(rw)}</text>`;
      o.cols.forEach((c, j) => { const v = o.data[i][j] || 0; s += `<rect class="cc-cell" data-r="${i}" data-c="${j}" x="${(L + cw * j + 1.5).toFixed(1)}" y="${T + ch * i + 1.5}" width="${Math.max(1, cw - 3).toFixed(1)}" height="${Math.max(1, ch - 3)}" rx="${Math.max(0, Math.min(5, ch / 4))}" style="fill:${o.color};fill-opacity:${(0.08 + (v / hi) * 0.92).toFixed(2)};animation-delay:${(i + j) * 18}ms"/>`; });
    });
    el.innerHTML = s + "</svg>";
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => { const c = e.target.closest(".cc-cell"); if (!c) return tip.hide(); tip.show(e, `<b>${esc(o.rows[+c.dataset.r])} · ${esc(o.cols[+c.dataset.c])}</b><div>${esc(f(o.data[+c.dataset.r][+c.dataset.c]))}</div>`); });
    svg.addEventListener("pointerleave", () => tip.hide());
  });
}

/* Pointer drag helper (mouse, touch and pen) */
function dragify(el, { start, move, end }) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    const s = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, e };
    if (start && start(s, e) === false) return;
    if (el.setPointerCapture && e.pointerId != null) try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const mv = (ev) => { s.dx = ev.clientX - s.x; s.dy = ev.clientY - s.y; if (Math.abs(s.dx) + Math.abs(s.dy) > 4) s.moved = true; if (move) move(s, ev); };
    const up = (ev) => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); if (end) end(s, ev); };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  });
}

/* ---------- Demo data (same on every reset) ---------- */
function seed() {

  // auction rates in every city
  const rates = {};

    rates[c] = {};

      const r = round10(cityBase(it, ci) * rand(0.97, 1.03));
      const lots = randi(6, 24);
      rates[c][it.id] = { rate: r, prev: round10(r / (1 + rand(-0.05, 0.07))), lots, low: round10(r * rand(0.92, 0.97)), high: round10(r * rand(1.02, 1.06)), crates: lots * randi(18, 46) };
    });

  // 90 days of Lahore auction rates, walked back from today, and our selling rates
  const hist = {}, sell = {};
  ITEMS.forEach((it, k) => {
    const a = [rates.Lahore[it.id].rate];
    for (let i = 1; i < 90; i++) {
      const last = a[0], target = it.rate * (1 + 0.14 * Math.sin(i / 13 + k));
      a.unshift(Math.max(round10(it.rate * 0.5), round10(last + (target - last) * 0.07 + last * rand(-0.032, 0.032))));
    }
    hist[it.id] = a;
    sell[it.id] = a.map((v) => round10(v * rand(1.065, 1.105)));

  // growers and shops

  let lot = 180, inv = 1040;

      const crates = randi(4, 18) * 5, rate = round10(hist[it.id][89 - d] * rand(0.97, 1.02)), amt = amtOf(crates, it.kg, rate);
      const r = R();
      day.push({ id: uid(), lot: 0, date, time: randTime(335, 560), party: g.id, item: it.id, crates, rate, amt, cash: r < 0.25 ? amt : r < 0.5 ? Math.round((amt * 0.3) / 1000) * 1000 : 0 });
    }

    if (d > 0 && d % 2 === 0) G.forEach((g) => { const o = owe(g.id, buys, "amt"); if (o > 20000 && R() < 0.6) pays.push({ id: uid(), party: g.id, date, time: randTime(600, 1020), amt: Math.round((o * rand(0.5, 1)) / 1000) * 1000, how: pick(["Cash", "Bank transfer", "Bank transfer", "Cheque"]) }); });

  const exp = [{ id: uid(), label: "Loaders, 6 men", amt: 9000 }, { id: uid(), label: "Market fee and stall rent", amt: 2400 }, { id: uid(), label: "Unloading truck TLF-664", amt: 3500 }, { id: uid(), label: "Tea and breakfast for the team", amt: 1150 }];
  // trucks booked for today

  // wastage, last 7 days
  const waste = [];
  for (let k = 0; k < 11; k++) {
    const it = pick(ITEMS.slice(0, 9)), rs = pick(REASONS)[0];
    waste.push({ id: uid(), date: iso(addDays(TODAY, -randi(0, 6))), item: it.id, crates: randi(1, 9), reason: rs, note: rs === "Rejected by shop" ? "Returned by " + pick(SH).name : rs === "Rain damage" ? "Shed roof leak near row C" : "" });
  }

  const S0 = {
    v: 1,
    firm: { name: "Haider & Sons Produce", owner: "Haider Ali", market: "Lahore wholesale market", stall: "Shed 4, Stall 42", city: "Lahore", phone: "0300-4417820" },
    prefs: { commission: 6, creditDays: 7, limit: 100000, live: true, boardCity: "Lahore", template: DEFAULT_TEMPLATE },

  S0.opening = Math.max(250000, Math.round((outflow + 160000) / 10000) * 10000);

/* ---------- People, balances and invoice state ---------- */
const party = (id) => S.parties.find((p) => p.id === id) || { id, name: "Removed contact", kind: "shop", area: "", phone: "", limit: 0 };
const shops = () => S.parties.filter((p) => p.kind === "shop");
const growers = () => S.parties.filter((p) => p.kind === "grower");
function balance(pid) {
  const p = party(pid);
  let b = 0;
  if (p.kind === "shop") S.sales.forEach((s) => { if (s.party === pid) b += s.total - s.cash; });
  else S.buys.forEach((x) => { if (x.party === pid) b += x.amt - x.cash; });
  S.pays.forEach((x) => { if (x.party === pid) b -= x.amt; });
  return b;
}
/* What is still open on each invoice / lot: later payments clear the oldest first */
let LEFT = new Map();
function settleAll() {
  LEFT = new Map();
  const pool = new Map();
  S.pays.forEach((p) => pool.set(p.party, (pool.get(p.party) || 0) + p.amt));
  const docs = S.sales.map((s) => [s, s.total]).concat(S.buys.map((b) => [b, b.amt]));
  docs.sort((a, b) => (a[0].date + a[0].time).localeCompare(b[0].date + b[0].time));
  docs.forEach(([d, tot]) => { const due = tot - d.cash, have = pool.get(d.party) || 0, used = Math.min(have, Math.max(0, due)); pool.set(d.party, have - used); LEFT.set(d.id, due - used); });
}
const leftOf = (d) => (LEFT.has(d.id) ? LEFT.get(d.id) : (d.total != null ? d.total : d.amt) - d.cash);
function saleState(s) { const l = leftOf(s); if (l <= 0) return ["Paid", "good"]; if (daysOld(s.date) > S.prefs.creditDays) return ["Overdue", "bad"]; return ["On credit", "warn"]; }
const buyState = (b) => (leftOf(b) <= 0 ? ["Paid", "good"] : ["Owed", "warn"]);
const overdueOf = (pid) => sum(S.sales.filter((s) => s.party === pid && saleState(s)[0] === "Overdue").map(leftOf));
const linesText = (lines) => lines.map((l) => l.crates + " " + itemById(l.item).name.toLowerCase()).join(", ");
const firstName = (n) => String(n).split(" ")[0];
function cashToday() {
  const t = iso(TODAY), isShop = (x) => party(x.party).kind === "shop";
  const salesCash = sum(S.sales.filter((s) => s.date === t).map((s) => s.cash));
  const collected = sum(S.pays.filter((x) => x.date === t && isShop(x) && x.how === "Cash").map((x) => x.amt));
  const buysCash = sum(S.buys.filter((b) => b.date === t).map((b) => b.cash));
  const paidOut = sum(S.pays.filter((x) => x.date === t && !isShop(x) && x.how === "Cash").map((x) => x.amt));
  const exp = sum(S.exp.map((e) => e.amt));
  return { open: S.opening, salesCash, collected, buysCash, paidOut, exp, hand: S.opening + salesCash + collected - buysCash - paidOut - exp };
}
const rateOf = (id, city = S.firm.city) => (S.rates[city] || S.rates.Lahore)[id];
const sellRate = (id) => round10(rateOf(id, "Lahore").rate * (1 + Math.max(4, S.prefs.commission + 2) / 100));
const arrivedToday = (id) => sum(S.buys.filter((b) => b.date === iso(TODAY) && b.item === id).map((b) => b.crates)) + sum(S.trucks.filter((t) => t.stage === "done" && t.item === id).map((t) => t.crates));
const soldToday = (id) => sum(S.sales.filter((s) => s.date === iso(TODAY)).flatMap((s) => s.lines).filter((l) => l.item === id).map((l) => l.crates));
const wasted7 = (id) => sum(S.waste.filter((w) => w.item === id && daysOld(w.date) < 7).map((w) => w.crates));

/* =====================================================================
   Signature 1: the split-flap price board. Every character is a flap
   cell; a new rate folds the old top half down and drops the new
   bottom half into place, with a few quick spins on the way.
   ===================================================================== */
const FLAP = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789,+-";
// key, cells, header, class, right aligned
const BCOLS = [["item", 7, "Item", "", false], ["from", 9, "From", "c-from", false], ["rate", 6, "Rs / 40 kg", "", true], ["chg", 5, "Change", "", true], ["lots", 3, "Lots", "c-lots", true], ["stat", 5, "Floor", "c-stat", false]];
const fitFlap = (t, n, right) => { t = String(t).toUpperCase().slice(0, n); return right ? t.padStart(n) : t.padEnd(n); };
function floorState(r) { const c = (r.rate - r.prev) / (r.prev || 1); return c > 0.04 ? "SHORT" : c > 0.004 ? "BRISK" : c < -0.02 ? "SLOW" : "FIRM"; }
function boardVals(id) {
  const it = itemById(id), r = rateOf(id, S.prefs.boardCity), d = r.rate - r.prev;
  const chg = Math.abs(d) >= 1000 ? (d > 0 ? "+" : "-") + (Math.abs(d) / 1000).toFixed(1) + "K" : (d > 0 ? "+" : d < 0 ? "-" : "") + Math.abs(d);
  return { item: it.short.toUpperCase(), from: it.from.toUpperCase(), rate: num(r.rate), chg, lots: String(r.lots), stat: floorState(r), dir: d > 0 ? "g" : d < 0 ? "r" : "d" };
}
const flapCells = (s) => [...s].map((ch) => `<span class="fl" data-c="${esc(ch)}"><i class="t"><b>${esc(ch)}</b></i><i class="b"><b>${esc(ch)}</b></i></span>`).join("");
function boardHTML(blank) {
  const city = S.prefs.boardCity;
  const colCls = { chg: "", rate: "y", stat: "d", lots: "d" };
  const rows = BOARD_ITEMS.map((id) => {
    const v = boardVals(id), it = itemById(id);
    return `<a class="brow" href="#/prices" data-item="${id}" aria-label="${esc(it.name)} from ${esc(it.from)}: ${money(rateOf(id, city).rate)} per 40 kg">${BCOLS.map(([k, n, , cls, right]) => `<span class="bcol ${cls}" style="--n:${n}"><span class="flg ${k === "chg" ? v.dir : colCls[k] || ""}" data-k="${k}" data-n="${n}"${right ? ' data-r="1"' : ""}>${flapCells(fitFlap(blank ? "" : v[k], n, right))}</span></span>`).join("")}</a>`;
  }).join("");
  return `<div class="board" id="board">
    <div class="bh"><span class="live${S.prefs.live ? "" : " off"}" id="bLive"></span><b>Auction board</b><span id="bCity">${esc(city)}</span><span class="clock num" id="clock">${hm()}</span>
      <div class="bseg" role="group" aria-label="Board city">${BOARD_CITIES.map(([c, code]) => `<button type="button" data-bcity="${c}" aria-pressed="${c === city}" aria-label="Show ${c}">${code}</button>`).join("")}</div></div>
    <div class="brow bhead" aria-hidden="true">${BCOLS.map(([, n, label, cls, right]) => `<span class="bcol ${cls}${right ? " r" : ""}" style="--n:${n}">${label}</span>`).join("")}</div>
    ${rows}
    <div class="bfoot"><span class="live${S.prefs.live ? "" : " off"}"></span><span class="grow" id="bTicker">Bids land every few seconds · tap a row for its chart</span><span>Per 40 kg</span></div>
  </div>`;
}
/* one cell: the old top half folds down, the new bottom half lands */
function flipCell(cell, to, dur) {
  const from = cell.dataset.c;
  if (from === to) return;
  cell.dataset.c = to;
  const tok = (cell._tok = (cell._tok || 0) + 1);
  const tb = cell.children[0].firstChild, bb = cell.children[1].firstChild;
  cell.querySelectorAll(".ft, .fb").forEach((x) => x.remove());
  tb.textContent = to;
  if (!dur || RM) { bb.textContent = to; return; }
  bb.textContent = from;
  cell.style.setProperty("--fd", dur + "ms");
  cell.insertAdjacentHTML("beforeend", `<i class="ft"><b>${esc(from)}</b></i><i class="fb"><b>${esc(to)}</b></i>`);
  setTimeout(() => { if (cell._tok !== tok) return; bb.textContent = to; cell.querySelectorAll(".ft, .fb").forEach((x) => x.remove()); }, dur * 2 + 30);
}
/* a group of cells shows a new text; each cell spins once or twice first */
function setGroup(g, text, delay = 0, spins = 2, stagger = 30) {
  const s = fitFlap(text, +g.dataset.n, g.dataset.r === "1");
  [...g.children].forEach((cell, i) => {
    const to = s[i];
    if ((cell._to != null ? cell._to : cell.dataset.c) === to) return;
    cell._to = to;
    if (RM) { flipCell(cell, to, 0); return; }
    const n = to === " " ? 1 : spins;
    let k = 0;
    const step = () => {
      if (cell._to !== to) return;
      k++;
      const last = k >= n;
      flipCell(cell, last ? to : FLAP[1 + randi(0, FLAP.length - 2)], last ? 130 : 55);
      if (!last) setTimeout(step, 115);
    };
    setTimeout(step, delay + i * stagger);
  });
}
function setBoardRow(id, delay = 0, spins = 2, stagger = 30) {
  const row = $(`#board .brow[data-item="${id}"]`);
  if (!row) return;
  const v = boardVals(id);
  $$(".flg", row).forEach((g) => {
    if (g.dataset.k === "chg") g.className = "flg " + v.dir;
    setGroup(g, v[g.dataset.k], delay, spins, stagger);
  });
  row.setAttribute("aria-label", `${itemById(id).name} from ${itemById(id).from}: ${money(rateOf(id, S.prefs.boardCity).rate)} per 40 kg`);
}
/* the board boots: every row flips in from blank, left to right */
function bootBoard() { BOARD_ITEMS.forEach((id, i) => setBoardRow(id, 60 + i * 24, 1, 16)); }
function setBoardCity(c) {
  S.prefs.boardCity = c;
  save();
  $$("[data-bcity]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.bcity === c)));
  const lbl = $("#bCity");
  if (lbl) lbl.textContent = c;
  BOARD_ITEMS.forEach((id, i) => setBoardRow(id, i * 45));
}

/* =====================================================================
   Signature 2: crate-stack chart. Each item is a stack of little crates
   (one crate = N real crates), produce peeking over the top one. The
   crates drop in from above, bottom first, when the chart is drawn.
   ===================================================================== */
function stackVal(id, mode) { return mode === "in" ? arrivedToday(id) : mode === "out" ? soldToday(id) : S.stock[id] || 0; }
function crateUnit(max, cap = 13) { for (const u of [1, 2, 5, 10, 15, 20, 25, 30, 35, 40, 50, 75, 100]) if (max / u <= cap) return u; return 200; }
function stacksHTML(ids, mode, cap) {
  const vals = ids.map((id) => stackVal(id, mode)), unit = crateUnit(Math.max(...vals, 1), cap);
  const html = ids.map((id, col) => {
    const it = itemById(id), v = vals[col], full = Math.floor(v / unit), part = v % unit ? 1 : 0, n = full + part, a = S.age[id] || 0;
    let cr = "";
    for (let k = 0; k < n; k++) cr += `<i class="crate${k === n - 1 ? " top" : ""}${part && k === n - 1 ? " part" : ""}" style="--d:${col * 45 + k * 36}ms"></i>`;
    return `<button type="button" class="stack" data-stack="${id}" style="--c:${it.c};--p:${it.p}" aria-label="${esc(it.name)}: ${num(v)} crates${mode === "yard" ? ", " + a + " days in the yard" : ""}">${mode === "yard" ? `<span class="age ${a >= 4 ? "old" : a >= 2 ? "mid" : ""}">${a}d</span>` : ""}<span class="pile">${cr}</span><span class="ct">${num(v)}</span><span class="nm">${esc(it.short)}</span></button>`;
  }).join("");
  return { unit, html: `<div class="stacks" style="--n:${ids.length}">${html}</div>` };
}
function stackTip(e, id, mode) {
  const it = itemById(id), r = rateOf(id, "Lahore");
  tip.show(e, `<b>${esc(it.name)}</b><div>In the yard<em>${num(S.stock[id] || 0)} crates</em></div><div>Weight<em>${num((S.stock[id] || 0) * it.kg)} kg</em></div><div>Days in yard<em>${S.age[id] || 0}</em></div><div>Arrived today<em>${num(arrivedToday(id))}</em></div><div>Sold today<em>${num(soldToday(id))}</em></div><div>Rate<em>${money(r.rate)}</em></div>`);
}
/* draw a crate-stack card body into el; the mode buttons live in the card header */
function drawStacks(el, ids, mode) {
  if (!el) return;
  const { unit, html } = stacksHTML(ids, mode, ids.length > 9 ? 13 : 10);
  el.innerHTML = html + `<div class="stack-legend"><span><i></i>One crate = ${unit} crate${unit > 1 ? "s" : ""}</span><span><b class="age">1d</b> days in the yard</span><span>${mode === "yard" ? "Tap a stack for details" : mode === "in" ? "Bought at auction and unloaded today" : "Sold to shops today"}</span></div>`;
  el.onpointermove = (e) => { const s = e.target.closest("[data-stack]"); if (s) stackTip(e, s.dataset.stack, mode); else tip.hide(); };
  el.onpointerleave = () => tip.hide();
}

const toMin = (t) => { const [h, m] = String(t).split(":"); return +h * 60 + +m; };
const head = (title, sub, acts = "") => `<div class="ph"><div><h1>${esc(title)}</h1><p>${sub}</p></div>${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;

const rankRow = (name, sub, value, w, color) => `<div class="party" style="cursor:default">${avatar(name)}<span style="min-width:0"><b>${esc(name)}</b><small>${esc(sub)}</small></span><span class="amt">${value}</span><span class="bar"><i style="--c:${color}" data-w="${w}"></i></span></div>`;
/* adds a live "total" line to a form dialog */
function liveTotal(m, fn) {
  const f = $("form", m.el), p = document.createElement("p");
  p.className = "cc-intro";
  p.style.margin = "12px 0 0";
  $(".cc-fields", f).after(p);

  f.addEventListener("input", up);
  f.addEventListener("change", up);

}

/* ---------- Auction floor feed ---------- */
let FEED = [];
let LOT = Math.max(0, ...S.buys.map((b) => b.lot));
function growerFor(id) { return growers().find((p) => p.item === id) || { name: "a grower", area: itemById(id).from }; }
function newLot(id, rate, crates) {
  const r = rateOf(id, S.prefs.boardCity), g = growerFor(id);
  return { id: uid(), no: ++LOT, item: id, crates: crates || randi(2, 16) * 5, rate: rate || round10(r.rate * rand(0.99, 1.01)), buyer: pick(TRADERS), mine: false, grower: g.name, area: g.area, ts: Date.now() };
}
function initFeed() {
  reseed((Date.now() % 1e6) + 17);
  const mine = S.buys.filter((b) => b.date === iso(TODAY)).slice(-2).map((b) => ({ id: b.id, no: b.lot, item: b.item, crates: b.crates, rate: b.rate, buyer: S.firm.name, mine: true, grower: party(b.party).name, area: party(b.party).area }));
  const list = [];
  for (let i = 0; i < 5; i++) list.push(newLot(pick(BOARD_ITEMS)));
  list.reverse();
  if (mine[1]) list.splice(2, 0, mine[1]);
  if (mine[0]) list.splice(5, 0, mine[0]);
  list.forEach((l, i) => (l.ts = Date.now() - i * 52000 - randi(0, 20000)));
  FEED = list;
}
const feedLi = (l, isNew) => { const it = itemById(l.item); return `<li class="${l.mine ? "mine" : ""}${isNew ? " new" : ""}">${thumb(l.item)}<div style="min-width:0"><b>${esc(it.name)} · ${l.crates} crates</b><small>Lot ${l.no} · ${l.mine ? "you won it" : esc(l.buyer)}</small></div><em>${money(l.rate)}<small data-ago="${l.ts}">${ago(l.ts)}</small></em></li>`; };

/* ---------- Trucks ---------- */
const truckLeft = (t) => Math.round((ROAD_KM[t.from] || 300) * (1 - t.prog));
function truckWhen(t, brief) {
  if (t.stage === "road") { const km = truckLeft(t), eta = new Date(Date.now() + (km / 52) * 3600000); return "ETA " + hm(eta) + (brief ? "" : " · " + num(km) + " km"); }
  if (t.stage === "gate") { const m = Math.max(1, Math.round((Date.now() - t.at) / 60000)); return m > 90 ? "At the gate" : (brief ? "Gate · " : "At the gate ") + m + " min"; }
  if (t.stage === "unloading") return Math.round(t.prog * t.crates) + " of " + t.crates + " off";
  return "Unloaded " + (typeof t.at === "string" ? t.at : hm(new Date(t.at)));
}
function nextTruckText() { const t = S.trucks.filter((x) => x.stage === "road").sort((a, b) => truckLeft(a) - truckLeft(b))[0]; return t ? t.plate + " · " + truckWhen(t, true) : "All trucks are in"; }
const stageRank = { gate: 3, unloading: 2, road: 1, done: 0 };
function drawTruckMini() {
  const el = $("#trkMini");
  if (!el) return;
  const list = S.trucks.filter((t) => t.stage !== "done").sort((a, b) => stageRank[b.stage] - stageRank[a.stage] || b.prog - a.prog).slice(0, 4);
  el.innerHTML = list.map((t) => `<div class="trk"><span class="plate">${esc(t.plate)}</span><span class="meta">${esc(t.from)} · ${num(t.crates)} ${esc(itemById(t.item).name.toLowerCase())}</span><span class="when" data-eta="${t.id}" data-brief="1">${truckWhen(t, true)}</span><div class="trip" data-trip="${t.id}" style="--w:${t.stage === "gate" ? 100 : Math.round(t.prog * 100)}%"><i></i>${t.stage === "road" ? `<b>${ic("truck")}</b>` : ""}</div></div>`).join("") || `<div class="cc-empty">${ic("truck")}<b>All trucks are in</b><span>Add the next one on the Trucks page.</span></div>`;
}
function finishUnload(t) {
  t.stage = "done";
  t.prog = 1;
  t.at = hm();
  S.stock[t.item] = (S.stock[t.item] || 0) + t.crates;
  S.age[t.item] = 0;
  note(`${t.plate} unloaded: ${num(t.crates)} crates of ${itemById(t.item).name.toLowerCase()} are in the yard`);
  toast(`${t.plate} unloaded · ${num(t.crates)} crates in the yard`);
}
