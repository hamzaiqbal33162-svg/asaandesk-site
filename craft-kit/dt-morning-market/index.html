function drawItems(first) {
  const el = $("#items");
  if (!el) return;
  const q = UI.q.toLowerCase().trim();
  const r = (it) => rateOf(it.id, UI.city), ch = (it) => (r(it).rate - r(it).prev) / r(it).prev;
  const sorts = { name: (a, b) => a.name.localeCompare(b.name), rate: (a, b) => r(b).rate - r(a).rate, chg: (a, b) => ch(b) - ch(a), fall: (a, b) => ch(a) - ch(b), lots: (a, b) => r(b).lots - r(a).lots };
  const list = ITEMS.filter((it) => (UI.kind === "All" || it.kind === UI.kind) && (!q || (it.name + " " + it.from + " " + it.kind).toLowerCase().includes(q))).sort(sorts[UI.sort] || sorts.name);
  el.innerHTML = list.length ? list.map(itemCard).join("") : `<div class="card flat" style="grid-column:1/-1"><div class="cc-empty">${ic("search")}<b>No items match “${esc(UI.q)}”</b><span>Try another word or set the filter back to All.</span></div></div>`;
  if (!first) { enter(el); countAll(el); }
}
function itemCard(it, i) {
  const r = rateOf(it.id, UI.city), d = r.rate - r.prev, c = (d / r.prev) * 100;
  const p = clamp(((r.rate - r.low) / (r.high - r.low || 1)) * 100, 0, 100);
  const ratio = r.rate / rateOf(it.id, "Lahore").rate;
  return `<article class="card icard" data-item="${it.id}">
    <div class="pic"><img src="${imgOf(it.id)}" width="640" height="480" alt="${esc(it.alt)}"${i > 3 ? ' loading="lazy"' : ""}><span class="pill ${d > 0 ? "good" : d < 0 ? "bad" : ""}" data-chg="${it.id}">${d > 0 ? "▲" : d < 0 ? "▼" : "•"} ${Math.abs(c).toFixed(1)}%</span><span class="from">${ic("pin")}${esc(it.from)}</span></div>
    <div class="body">
      <div class="hd"><div><h3>${esc(it.name)}</h3><small>${esc(it.kind)} · ${it.kg} kg crate</small></div><div class="rate"><span data-rate="${it.id}" data-to="${r.rate}" data-f="money">${money(r.rate)}</span><small>per 40 kg</small></div></div>
      <div class="range"><span>${num(r.low)}</span><span class="rl"><i style="--p:${p}%" data-mark="${it.id}"></i></span><span>${num(r.high)}</span></div>
      <div class="meta"><span>${r.lots} lots · ${num(r.crates)} crates</span>${spark(S.hist[it.id].slice(-14).map((v) => v * ratio), it.c, 84, 24)}</div>
      <div class="acts"><button type="button" class="btn sm primary" data-lot="${it.id}">${ic("gavel")}Record a lot</button><button type="button" class="btn sm" data-chart="${it.id}">${ic("line")}Chart</button></div>
    </div></article>`;
}
function drawHeat() {
  const el = $("#heat");
  if (!el) return;
  el.innerHTML = `<table class="heat"><thead><tr><th scope="col">Item</th>${CITIES.map(([c]) => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${ITEMS.map((it) => {
    const vals = CITIES.map(([c]) => S.rates[c][it.id].rate), lo = Math.min(...vals), hi = Math.max(...vals), mid = (lo + hi) / 2;
    return `<tr><td>${thumb(it.id, 22)}${esc(it.short)}</td>${vals.map((v, j) => { const n = hi === lo ? 0 : (v - mid) / ((hi - lo) / 2); return `<td class="${CITIES[j][0] === UI.city ? "home" : ""}" style="background:color-mix(in srgb, ${n > 0 ? "var(--accent)" : "var(--leaf)"} ${Math.round(Math.abs(n) * 44 + 4)}%, var(--surface-2))" data-h="${it.id}|${j}">${short(v, 1)}</td>`; }).join("")}</tr>`;
  }).join("")}</tbody></table>`;
  el.onpointermove = (e) => {
    const td = e.target.closest("[data-h]");
    if (!td) return tip.hide();
    const [id, j] = td.dataset.h.split("|"), c = CITIES[+j][0], v = S.rates[c][id].rate, home = S.rates.Lahore[id].rate;
    tip.show(e, `<b>${esc(itemById(id).name)} · ${esc(c)}</b><div>Rate<em>${money(v)}</em></div><div>Against Lahore<em>${v === home ? "same" : pct(((v - home) / home) * 100)}</em></div><div>Lots today<em>${S.rates[c][id].lots}</em></div>`);
  };
  el.onpointerleave = () => tip.hide();
}
function drawLotBars() {
  const el = $("#lotBars");
  if (!el) return;
  const rows = ITEMS.map((it) => ({ it, r: rateOf(it.id, UI.city) })).sort((a, b) => b.r.lots - a.r.lots);
  const max = Math.max(...rows.map((x) => x.r.lots), 1);
  el.innerHTML = rows.map(({ it, r }) => `<div class="hbar" style="--c:${it.c}"><span>${esc(it.short)}</span><span class="track"><i data-w="${(r.lots / max) * 100}"></i></span><em>${r.lots} lots</em></div>`).join("");
  const lc = $("#lotsCity");
  if (lc) lc.textContent = UI.city;
  growBars(el);
  const total = sum(rows.map((x) => x.r.lots)), bl = $("#buyers");
  if (bl) {
    // a fixed share per buyer and city, so the list is steady between visits
    const names = [S.firm.name].concat(TRADERS.slice(0, 4)), w = names.map((n, i) => 1 + ((hue(n + UI.city) % 7) + (i === 0 ? 4 : 0)) / 3), tw = sum(w);
    bl.innerHTML = names.map((n, i) => ({ n, lots: Math.max(1, Math.round((total * w[i]) / tw * 0.8)), me: i === 0 })).sort((a, b) => b.lots - a.lots).map((x) => `<li><span class="who grow">${avatar(x.n.replace(/\s*&\s*/g, " "))}<span><b>${esc(x.n)}</b><small>${x.me ? "That is you" : "Trader"}</small></span></span><b class="amt">${x.lots} lots</b></li>`).join("");
  }
}

function ledgerOf(pid) {
  const p = party(pid), rows = [];
  if (p.kind === "shop") S.sales.filter((s) => s.party === pid).forEach((s) => { rows.push({ date: s.date, time: s.time, text: `Invoice #${s.no} · ${linesText(s.lines)}`, dr: s.total, cr: 0 }); if (s.cash) rows.push({ date: s.date, time: s.time, text: `Paid at the sale (#${s.no})`, dr: 0, cr: s.cash }); });
  else S.buys.filter((b) => b.party === pid).forEach((b) => { rows.push({ date: b.date, time: b.time, text: `Lot ${b.lot} · ${b.crates} crates ${itemById(b.item).name.toLowerCase()}`, dr: b.amt, cr: 0 }); if (b.cash) rows.push({ date: b.date, time: b.time, text: `Paid at the auction (lot ${b.lot})`, dr: 0, cr: b.cash }); });
  S.pays.filter((x) => x.party === pid).forEach((x) => rows.push({ date: x.date, time: x.time, text: (p.kind === "shop" ? "Payment received · " : "Paid · ") + x.how + (x.note ? " · " + x.note : ""), dr: 0, cr: x.amt }));
  rows.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let run = 0;
  rows.forEach((r) => { run += r.dr - r.cr; r.bal = run; });
  return rows;
}

function saveSettings(f) {
  const k = f.dataset.form, val = (n) => (f.elements[n] ? f.elements[n].value.trim() : "");
  const errs = {};
  const numIn = (n, lo, hi, label) => { const v = parseFloat(val(n)); if (val(n) === "" || isNaN(v)) errs[n] = "Enter a number"; else if (v < lo || v > hi) errs[n] = `${label} must be ${num(lo)} to ${num(hi)}`; return v; };
  let out = {};
  if (k === "firm") {
    ["name", "owner", "market", "stall"].forEach((n) => { if (val(n).length < 2) errs[n] = "This field is required"; });
    if (!/^0\d{3}-?\d{7}$/.test(val("phone"))) errs.phone = "A number like 0300-1234567";
    out = { name: val("name"), owner: val("owner"), market: val("market"), stall: val("stall"), phone: val("phone") };
  } else if (k === "rules") {
    out = { commission: numIn("commission", 0, 30, "Mark-up"), creditDays: Math.round(numIn("creditDays", 1, 60, "Days")), limit: numIn("limit", 5000, 10000000, "Limit"), boardCity: val("boardCity") };
  } else if (k === "tpl") {
    const t = val("template");
    if (t.length < 20) errs.template = "Write at least a short sentence";
    else if (!t.includes("{amount}")) errs.template = "Keep {amount} so the shop sees the balance";
    out = { template: t };
  }
  $$(".cc-err[id]", f).forEach((e) => { const n = e.id.replace(/^s-|-e$/g, ""); e.textContent = errs[n] || ""; const inp = f.elements[n]; if (inp) errs[n] ? inp.setAttribute("aria-invalid", "true") : inp.removeAttribute("aria-invalid"); });
  const bad = Object.keys(errs)[0];
  if (bad) { if (f.elements[bad]) f.elements[bad].focus(); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
  if (k === "firm") Object.assign(S.firm, out);
  else Object.assign(S.prefs, out);
  save();
  $("#me").textContent = initials(S.firm.owner);
  toast(k === "firm" ? "Firm details saved" : k === "rules" ? "Trading rules saved" : "Reminder message saved");

    const url = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "morning-market-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Backup downloaded");
  } catch (e) { toast("Downloads are blocked here", "warn"); }
};
function resetDemo() {
  confirmBox("Reset all demo data? Your lots, sales, payments, trucks and settings go back to the sample.", "Reset").then((ok) => {
    if (!ok) return;
    S = seed();
    save();
    Object.assign(UI, { city: S.prefs.boardCity, kind: "All", q: "", sort: "name", party: null, paused: false });
    LOT = Math.max(0, ...S.buys.map((b) => b.lot));
    initFeed();
    $("#me").textContent = initials(S.firm.owner);
    toast("Demo data reset");
    render(current, true);
  });
}
ACT.reset = resetDemo;

/* ---------- Close the day (Today) ---------- */
ACT.close = () => {
  const c = cashToday();
  formModal({
    title: "Close the day",
    intro: `Count the cash in the drawer. Expected: <b>${money(c.hand)}</b> (opened with ${money(c.open)}, took in ${money(c.salesCash + c.collected)}, paid out ${money(c.buysCash + c.paidOut + c.exp)}).`,
    fields: [{ name: "counted", label: "Cash counted (Rs)", type: "number", min: 0, max: 100000000, required: true, value: c.hand }, { name: "note", label: "Note for tomorrow", type: "textarea", placeholder: "For example: collect from Township Fresh first" }],
    submit: "Close the day",
    onSubmit: (v) => {
      const diff = v.counted - c.hand;
      S.closed = { date: iso(TODAY), counted: v.counted, diff, note: v.note };
      save();
      note(diff === 0 ? "Day closed: the cash matched to the rupee" : `Day closed: cash ${diff > 0 ? "over" : "short"} by ${money(Math.abs(diff))}`);
      toast(diff === 0 ? "Day closed · the cash matches" : `Day closed · ${diff > 0 ? "over" : "short"} by ${money(Math.abs(diff))}`, diff === 0 ? "" : "warn");
    },
  });
};
ACT.cities = () => { const c = $("#cityCard"); if (c) c.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); };

/* =====================================================================
   Router, bell, account menu, live ticks and start-up
   ===================================================================== */
const SKEL = new Set(["buying", "selling", "stock", "credit", "prices"]);
let rTok = 0;
function render(name, keep) {
  current = name;
  const p = PAGES.find((x) => x[0] === name) || PAGES[0];
  document.title = p[1] + " · Morning Market";
  tip.hide();
  const tok = ++rTok;
  const swap = () => { view.classList.remove("swap"); void view.offsetWidth; view.classList.add("swap"); };
  const draw = () => {
    if (tok !== rTok) return;
    PAGE[name]();
    if (!keep) { swap(); enter(view); }
    countAll(view);
    growBars(view);
    refreshChrome();
  };
  if (!keep && SKEL.has(name) && !RM) { view.innerHTML = skeleton(TITLES[name] || p[1]); swap(); setTimeout(draw, 380); }
  else draw();
  if (!keep) window.scrollTo(0, 0);
}
function drawBell() { const n = $("#bellN"); if (n) n.textContent = S.notes.filter((x) => !x.read).length || ""; }
function refreshChrome() {
  const gate = S.trucks.filter((t) => t.stage === "gate").length;
  const pg = $("#pip-trucks"), pc = $("#pip-credit");
  if (pg) pg.hidden = !gate;
  if (pc) { settleAll(); pc.hidden = !shops().some((p) => overdueOf(p.id) > 0); }
  drawBell();
}

/* every few seconds a new bid lands: the board row flips, the feed ticks */
function liveTick() {
  if (!S.prefs.live || UI.paused) return;
  const id = pick(BOARD_ITEMS.concat(["tomato", "onion", "potato"]));
  const it = itemById(id);
  CITIES.forEach(([c], ci) => {
    const strong = c === S.prefs.boardCity;
    if (!strong && R() < 0.6) return;
    const r = S.rates[c][id];
    let d = round10((cityBase(it, ci) - r.rate) * 0.05 + r.rate * rand(-0.012, 0.012));
    if (!d) d = R() < 0.5 ? -10 : 10;
    r.rate = Math.max(10, r.rate + d);
    r.high = Math.max(r.high, r.rate);
    r.low = Math.min(r.low, r.rate);
    if (strong) { r.lots++; r.crates += randi(2, 16) * 5; }
  });
  S.hist[id][S.hist[id].length - 1] = rateOf(id, "Lahore").rate;
  const lot = newLot(id);
  FEED.unshift(lot);
  FEED = FEED.slice(0, 14);
  if ($("#board")) {
    setBoardRow(id);
    const row = $(`#board .brow[data-item="${id}"]`);
    if (row) { row.classList.remove("hit"); void row.offsetWidth; row.classList.add("hit"); }
    const tk = $("#bTicker");
    if (tk) tk.textContent = `Lot ${lot.no} · ${it.name} · ${lot.crates} crates · ${money(lot.rate)} · ${lot.buyer}`;
  }
  const ul = $("#feed");
  if (ul) {
    ul.insertAdjacentHTML("afterbegin", feedLi(lot, true));
    while (ul.children.length > 7) ul.lastElementChild.remove();
    const fc = $("#feedCount");
    if (fc) fc.textContent = sum(BOARD_ITEMS.map((x) => rateOf(x, S.prefs.boardCity).lots)) + " lots so far";
  }
  const ll = $("#lastLot");
  if (ll) ll.textContent = "Lot " + lot.no + " · " + it.name;
  $$("[data-ago]").forEach((el) => (el.textContent = ago(+el.dataset.ago)));
  if (current === "auction") {
    const r = rateOf(id, UI.city), el = $(`[data-rate="${id}"]`);
    if (el) countUp(el, r.rate, FMT.money, 700);
    const mk = $(`[data-mark="${id}"]`);
    if (mk) mk.style.setProperty("--p", clamp(((r.rate - r.low) / (r.high - r.low || 1)) * 100, 0, 100) + "%");
    const pc = $(`[data-chg="${id}"]`);
    if (pc) { const d = r.rate - r.prev; pc.className = "pill " + (d > 0 ? "good" : d < 0 ? "bad" : ""); pc.textContent = (d > 0 ? "▲ " : d < 0 ? "▼ " : "• ") + Math.abs((d / r.prev) * 100).toFixed(1) + "%"; }
  }
  checkAlerts(id);
}
/* trucks creep along the road; arrivals and finished unloading update the pages */
function truckTick() {
  if (!S.prefs.live) return;
  let changed = false;
  S.trucks.forEach((t) => {
    if (t.stage === "road") {
      t.prog = Math.min(1, t.prog + ((ROAD_KM[t.from] || 300) < 300 ? 0.011 : 0.004) * rand(0.6, 1.4));
      if (t.prog >= 1) { t.stage = "gate"; t.at = Date.now(); changed = true; note(`${t.plate} from ${t.from} reached the gate with ${num(t.crates)} crates of ${itemById(t.item).name.toLowerCase()}`); toast(`${t.plate} from ${t.from} is at the gate`, "warn"); }
    } else if (t.stage === "unloading") {
      t.prog = Math.min(1, t.prog + 0.018);
      if (t.prog >= 1) { finishUnload(t); changed = true; }
    }
  });
  S.trucks.forEach((t) => $$(`[data-trip="${t.id}"]`).forEach((el) => el.style.setProperty("--w", (t.stage === "gate" ? 100 : Math.round(t.prog * 1000) / 10) + "%")));
  $$("[data-eta]").forEach((el) => { const t = S.trucks.find((x) => x.id === el.dataset.eta); if (t) el.textContent = truckWhen(t, el.dataset.brief === "1"); });
  if (!changed) return;
  save();
  refreshChrome();
  if (current === "trucks" || current === "stock") rerender();
  if (current === "today") { drawTruckMini(); const nt = $("#nextTruck"); if (nt) nt.textContent = nextTruckText(); }
}

/* ---------- Shell ---------- */
$("#nav").insertAdjacentHTML("beforeend", PAGES.map(([id, l, icon, pri]) => `<a href="#/${id}"${pri ? ' class="pri"' : ""}>${ic(icon)}<span>${l}</span><span class="pip" id="pip-${id}" hidden></span></a>`).join("") + `<button type="button" class="more-btn" id="moreBtn" aria-label="All pages">${ic("menu")}<span>More</span></button>`);
$("[data-cmdk]").innerHTML = ic("search");
$(".tools [data-theme-toggle]").innerHTML = `<span class="t-sun">${ic("sun")}</span><span class="t-moon">${ic("moon")}</span>`;
$("#bell").innerHTML = ic("bell") + '<span class="badge" id="bellN"></span>';
$("#me").textContent = initials(S.firm.owner);
$("#bell").addEventListener("click", (e) => {
  popover(e.currentTarget, "", (p) => {
    const draw = () => (p.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)"><b>Notifications</b><button type="button" class="btn sm" data-allread>Mark all read</button></div><ul class="list note-list" style="padding:2px 14px 8px">${S.notes.map((n) => `<li style="opacity:${n.read ? 0.6 : 1}">${ic(n.read ? "check" : "bell")}<span class="grow">${esc(n.text)}</span></li>`).join("") || "<li>Nothing new.</li>"}</ul>`);
    draw();
    p.addEventListener("click", (ev) => { if (ev.target.closest("[data-allread]")) { S.notes.forEach((n) => (n.read = true)); save(); drawBell(); draw(); } });
  });
});
$("#me").addEventListener("click", (e) => {
  popover(e.currentTarget, `<div style="padding:14px"><div class="who">${avatar(S.firm.owner)}<span><b>${esc(S.firm.owner)}</b><small>${esc(S.firm.name)}</small></span></div><p class="muted" style="margin:10px 0 0;font-size:12px">${esc(S.firm.stall)} · ${esc(S.firm.market)}</p></div><div style="border-top:1px solid var(--line);padding:6px;display:grid;gap:4px"><a class="cc-pick" href="#/settings" style="text-decoration:none;border:0">${ic("sliders")}<span>Settings</span></a><button type="button" class="cc-pick" data-theme-toggle style="border:0">${ic("moon")}<span>Switch theme</span></button></div>`);
});
$("#moreBtn").addEventListener("click", () => {
  const m = openModal({ title: "All pages", html: `<div class="cc-picks">${PAGES.map(([id, l, icon]) => `<a class="cc-pick" href="#/${id}" style="text-decoration:none">${ic(icon)}<span>${l}</span>${id === current ? "<small>You are here</small>" : ""}</a>`).join("")}</div>` });
  m.body.addEventListener("click", (e) => { if (e.target.closest("a")) m.close(); });
});

/* one click handler for the page widgets (they come and go with the pages) */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t.closest) return;
  const act = t.closest("[data-act]");
  if (act && ACT[act.dataset.act]) { ACT[act.dataset.act](act); return; }
  const bc = t.closest("[data-bcity]");
  if (bc) { setBoardCity(bc.dataset.bcity); return; }
  const br = t.closest("a.brow[data-item]");
  if (br) { UI.priceItem = br.dataset.item; return; }
  const sm = t.closest("[data-smode]");
  if (sm) { UI.stackMode = sm.dataset.smode; $$("[data-smode]").forEach((b) => b.setAttribute("aria-pressed", String(b === sm))); drawStacks($("#stk"), current === "today" ? BOARD_ITEMS : ITEMS.map((x) => x.id), UI.stackMode); return; }
  const st = t.closest("[data-stack]");
  if (st) { itemDrawer(st.dataset.stack); return; }
  if (t.closest("#feedPause")) {
    const fp = $("#feedPause");
    UI.paused = !UI.paused;
    fp.setAttribute("aria-pressed", String(UI.paused));
    fp.setAttribute("aria-label", (UI.paused ? "Resume" : "Pause") + " the live feed");
    fp.innerHTML = ic(UI.paused ? "play" : "pause");
    const fl = $("#feedLive");
    if (fl) fl.classList.toggle("off", UI.paused || !S.prefs.live);
    toast(UI.paused ? "Live feed paused" : "Live feed is back on");
    return;
  }
  const cy = t.closest("[data-city]");
  if (cy) { UI.city = cy.dataset.city; $$("[data-city]").forEach((b) => b.setAttribute("aria-pressed", String(b === cy))); const ac = $("#aCity"); if (ac) ac.textContent = UI.city; drawItems(); drawHeat(); drawLotBars(); return; }
  const kd = t.closest("[data-kind]");
  if (kd) { UI.kind = kd.dataset.kind; $$("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", String(b === kd))); drawItems(); return; }
  const lt = t.closest("[data-lot]");
  if (lt) { lotForm(lt.dataset.lot); return; }
  const chb = t.closest("[data-chart]");
  if (chb) { openChart(chb.dataset.chart); return; }
  const pic = t.closest(".icard .pic");
  if (pic) { itemDrawer(pic.closest("[data-item]").dataset.item); return; }
  const pi = t.closest("[data-pitem]");
  if (pi) { UI.priceItem = pi.dataset.pitem; drawPrice(true); return; }
  const rg = t.closest("[data-range]");
  if (rg) { UI.range = +rg.dataset.range; $$("[data-range]").forEach((b) => b.setAttribute("aria-pressed", String(b === rg))); drawPrice(true); return; }
  const pt = t.closest("[data-ptab]");
  if (pt) { UI.partyTab = pt.dataset.ptab; UI.party = null; rerender(); return; }
  const pa = t.closest("[data-party]");
  if (pa) { UI.party = pa.dataset.party; $$("[data-party]").forEach((b) => b.setAttribute("aria-pressed", String(b === pa))); drawLedger(); return; }
  const la = t.closest("[data-lact]");
  if (la) { ledgerAct(la.dataset.lact); return; }
  const vs = t.closest("[data-visit]");
  if (vs) { if (vs.dataset.visit === "remind") remindBox(vs.dataset.pid); else payForm("shop", vs.dataset.pid); return; }
  const ta = t.closest("[data-tact]");
  if (ta) { truckAct(ta.dataset.tact, ta.closest("[data-truck]").dataset.truck); return; }
  const ao = t.closest("[data-aon]");
  if (ao) { const a = S.alerts.find((x) => x.id === ao.dataset.aon); if (a) { a.on = !a.on; a.hit = false; save(); drawAlerts(); toast(`${itemById(a.item).name} alert ${a.on ? "on" : "paused"}`); } return; }
  const ad = t.closest("[data-adel]");
  if (ad) { S.alerts = S.alerts.filter((x) => x.id !== ad.dataset.adel); save(); drawAlerts(); toast("Alert removed"); return; }
  const pf = t.closest("[data-pref]");
  if (pf) { const k = pf.dataset.pref; S.prefs[k] = !S.prefs[k]; save(); pf.setAttribute("aria-checked", String(S.prefs[k])); toast(k === "live" ? (S.prefs.live ? "Live auction on" : "Live auction paused") : "Saved"); return; }
});
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "aq") { UI.q = e.target.value; drawItems(); }
  else if (id === "pq") drawParties(e.target.value);
  else if (id === "s-template") $("#tplPrev").textContent = remindText(previewShop(), e.target.value);
});
document.addEventListener("change", (e) => { if (e.target.id === "asort") { UI.sort = e.target.value; drawItems(); } });
document.addEventListener("submit", (e) => { const f = e.target.closest && e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); saveSettings(f); });
addEventListener("scroll", () => document.documentElement.classList.toggle("scrolled", scrollY > 6), { passive: true });

/* ---------- Start ---------- */
initFeed();
initShell(() => pageCmds(PAGES, [
  { label: "Record a lot you won", icon: "gavel", run: () => lotForm() },
  { label: "New sale to a shop", icon: "receipt", run: () => saleForm() },
  { label: "Record a payment from a shop", icon: "cash", run: () => payForm("shop") },
  { label: "Pay a grower", icon: "cash", run: () => payForm("grower") },
  { label: "Add a truck", icon: "truck", run: () => ACT.truck() },
  { label: "Log wastage", icon: "trash", run: () => wasteForm() },
  { label: "Add a price alert", icon: "bell", run: () => ACT.priceAlert() },
  { label: "Close the day", icon: "check", run: () => ACT.close() },
  { label: "Switch theme", icon: "moon", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
  { label: "Reset demo data", icon: "refresh", run: resetDemo },
].concat(ITEMS.map((it) => ({ label: it.name + " price chart", icon: "line", hint: money(rateOf(it.id, "Lahore").rate), run: () => openChart(it.id) })))));
startRouter(PAGES.map((p) => p[0]), "today", render);
every(1000, () => { const c = $("#clock"); if (c) c.textContent = hm(); });
every(3600, liveTick);
every(3000, truckTick);
</script>
