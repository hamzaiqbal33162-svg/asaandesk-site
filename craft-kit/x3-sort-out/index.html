<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Out · empty the recycle bin into sorted bins</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: fresh greens with three bin colours ---------- */
  :root {
    color-scheme: light;
    --bg: #edf3ee;
    --bg-2: #f6f8f1;
    --card: #ffffff;
    --tray: #f3f6f2;
    --line: #e1e9e2;
    --ink: #16251c;
    --muted: #5e6f65;
    --paper: #3b82f6;
    --media: #f97316;
    --arch: #16a34a;
    --danger: #e11d48;
    --tile: #ffffff;
    --sh: 30, 60, 40;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09110c;
    --bg-2: #0f1a13;
    --card: #121c16;
    --tray: #0d1611;
    --line: #223229;
    --ink: #e8f4ec;
    --muted: #93a99b;
    --paper: #60a5fa;
    --media: #fb923c;
    --arch: #4ade80;
    --danger: #fb5779;
    --tile: #18251d;
    --sh: 0, 0, 0;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .frame {
    position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 20px 16px;
    overflow: hidden; overflow: clip;
    background: radial-gradient(55% 45% at 15% 15%, color-mix(in srgb, var(--arch) 16%, transparent), transparent 70%), radial-gradient(50% 45% at 90% 85%, color-mix(in srgb, var(--paper) 14%, transparent), transparent 70%), var(--bg-2);
  }
  .card {
    position: relative; width: min(580px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 18px;
    box-shadow: 0 50px 90px -60px rgba(var(--sh), .75), 0 2px 8px -4px rgba(var(--sh), .15);
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--arch) 16%, transparent); color: var(--arch); flex: none; }
  .logo svg { width: 24px; height: 24px; animation: turn 9s linear infinite; }
  @keyframes turn { to { rotate: 360deg; } }
  .top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .top p { margin: 1px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .top p b { color: var(--ink); }
  .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; background: color-mix(in srgb, var(--paper) 10%, transparent); color: var(--paper); font-size: 12.5px; font-weight: 750; transition: scale .35s var(--spring); white-space: nowrap; }
  .chip svg { width: 15px; height: 15px; }
  .chip.bump { scale: 1.18; }

  /* ---------- The pile of deleted files ---------- */
  .tray { position: relative; margin-top: 14px; padding: 12px; border-radius: 18px; background: var(--tray); box-shadow: inset 0 0 0 1px var(--line); min-height: 196px; }
  .pile { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tile {
    position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px; border: 0; border-radius: 12px; background: var(--tile); color: var(--ink);
    font: inherit; text-align: left; cursor: pointer; rotate: var(--tilt, 0deg);
    box-shadow: 0 6px 12px -8px rgba(var(--sh), .45), 0 0 0 1px var(--line); transition: box-shadow .2s, scale .25s var(--spring);
    animation: float 4.6s ease-in-out infinite; animation-delay: var(--fd, 0s);
  }
  @keyframes float { 50% { translate: 0 -3px; } }
  .tile:hover { scale: 1.04; box-shadow: 0 12px 18px -10px rgba(var(--sh), .5), 0 0 0 1.5px var(--k); }
  .tile:hover::after { content: "Restore"; position: absolute; right: 6px; top: -9px; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--paper); color: #fff; }
  .tile.drop { animation: drop .6s var(--spring) both, float 4.6s ease-in-out .6s infinite; animation-delay: var(--dd, 0s), calc(var(--dd, 0s) + .6s); }
  @keyframes drop { from { translate: 0 -40px; opacity: 0; scale: .7; } }
  .tile.shake { animation: shake .35s ease-in-out 2; }
  @keyframes shake { 25% { translate: -2px 0; } 75% { translate: 2px 0; } }
  /* these two come last so they win over drop / shake */
  .tile.fly { z-index: 30; animation: none; pointer-events: none; transition: none; }
  .tile.away { visibility: hidden; animation: none; }
  .ico { width: 30px; height: 34px; border-radius: 6px 10px 6px 6px; flex: none; display: grid; place-items: end center; padding-bottom: 4px; background: var(--k); color: #fff; font-size: 8.5px; font-weight: 900; letter-spacing: .02em; position: relative; }
  .ico::before { content: ""; position: absolute; right: 0; top: 0; width: 9px; height: 9px; background: linear-gradient(225deg, var(--tray) 50%, rgba(255, 255, 255, .45) 50%); border-radius: 0 10px 0 3px; }
  .meta { min-width: 0; }
  .meta b { display: block; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .done { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .done.on { opacity: 1; pointer-events: auto; }
  .done svg { width: 54px; height: 54px; color: var(--arch); }
  .done.on svg { animation: popin .7s var(--spring) both; }
  @keyframes popin { from { scale: .3; rotate: -90deg; opacity: 0; } }
  .done b { font-size: 16px; }
  .done span { font-size: 13px; color: var(--muted); }

  /* ---------- Three bins ---------- */
  .bins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 26px 6px 0; }
  .bin { position: relative; height: 128px; display: grid; justify-items: center; transform-origin: 50% 100%; }
  .bin.catch { animation: catch .4s var(--spring); }
  @keyframes catch { 0% { scale: 1 1; } 35% { scale: 1.06 .9; } 100% { scale: 1 1; } }
  .bin.crush { animation: crush .7s var(--spring); }
  @keyframes crush { 0% { scale: 1 1; } 30% { scale: 1.1 .78; } 100% { scale: 1 1; } }
  .can {
    position: absolute; bottom: 0; left: 8%; right: 8%; height: 104px; border-radius: 8px 8px 16px 16px; overflow: hidden;
    background: linear-gradient(90deg, rgba(0, 0, 0, .12), transparent 30% 70%, rgba(0, 0, 0, .16)), var(--k);
    clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
  }
  .can::before { content: ""; position: absolute; inset: 10px 18% 26px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .16) 0 4px, transparent 4px 13px); border-radius: 4px; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255, 255, 255, .28); transition: height .45s var(--spring); }
  .fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255, 255, 255, .6); }
  .tag { position: absolute; bottom: 12px; left: 50%; translate: -50% 0; padding: 2px 8px; border-radius: 6px; background: rgba(255, 255, 255, .92); color: #14231a; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .lid { position: absolute; top: 12px; left: 2%; right: 2%; height: 14px; border-radius: 7px 7px 3px 3px; background: linear-gradient(color-mix(in srgb, var(--k) 70%, #fff), var(--k)); transform-origin: 6% 100%; transition: rotate .5s var(--spring), translate .5s var(--spring); z-index: 2; box-shadow: 0 3px 0 rgba(0, 0, 0, .14); }
  .lid::before { content: ""; position: absolute; left: 50%; top: -6px; width: 26px; height: 8px; margin-left: -13px; border-radius: 5px 5px 0 0; border: 3px solid color-mix(in srgb, var(--k) 70%, #000); border-bottom: 0; }
  .bin.open .lid { rotate: -32deg; translate: -4px -6px; }
  .bin .count { position: absolute; top: -12px; right: 4%; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; background: var(--ink); color: var(--card); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; z-index: 3; transition: scale .3s var(--spring); }
  .bin .count.bump { scale: 1.3; }
  .bin .name { position: absolute; bottom: -22px; font-size: 12px; color: var(--muted); font-weight: 650; white-space: nowrap; }
  .crumb { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 2px; background: var(--k); pointer-events: none; z-index: 31; animation: crumb .7s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes crumb { to { translate: var(--dx) var(--dy); rotate: 200deg; opacity: 0; } }

  /* ---------- Actions and the confirm step ---------- */
  .actions { position: relative; margin-top: 36px; min-height: 52px; }
  .row { display: flex; gap: 10px; justify-content: flex-end; align-items: center; transition: opacity .25s, translate .35s var(--spring); }
  .row.hide { opacity: 0; translate: 0 8px; pointer-events: none; }
  .confirm { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 16px; background: color-mix(in srgb, var(--danger) 9%, var(--card)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--danger) 35%, transparent); transition: opacity .25s, scale .4s var(--spring); }
  .confirm.hide { opacity: 0; scale: .94; pointer-events: none; }
  .confirm p { flex: 1; margin: 0; font-size: 13px; color: var(--muted); min-width: 0; }
  .confirm p b { color: var(--ink); display: block; font-size: 14px; }
  .hint { margin-right: auto; font-size: 12.5px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 13px; padding: 11px 16px; font: inherit; font-size: 14px; font-weight: 740; cursor: pointer; transition: scale .25s var(--spring), opacity .2s, filter .2s; white-space: nowrap; }
  .btn svg { width: 18px; height: 18px; }
  .btn:active, .btn.pressed { scale: .93; }
  .btn:disabled { opacity: .45; cursor: default; scale: 1; }
  .soft { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
  .danger { background: var(--danger); color: #fff; box-shadow: 0 12px 20px -14px var(--danger); }
  .danger:hover:not(:disabled) { filter: brightness(1.07); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (max-width: 520px) {
    .card { padding: 14px; }
    .pile { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .tile { padding: 6px; gap: 6px; }
    .ico { width: 24px; height: 30px; font-size: 7.5px; }
    .bins { gap: 10px; margin-inline: 0; }
    .hint { display: none; }
    .bin .name { font-size: 11px; }
    .confirm { flex-wrap: wrap; position: relative; padding: 10px; }
    .confirm p { flex-basis: 100%; }
    .confirm .btn { flex: 1; }
    .actions { display: grid; }
    .actions > * { grid-area: 1 / 1; }
  }
  /* Calm mode: every step still happens, without the big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <main class="card" id="card" aria-labelledby="title">
    <header class="top">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 9.5L5 14a2 2 0 0 0 1.8 3H11" /><path d="M9 6.5l1.3-2.2a2 2 0 0 1 3.4 0L16 8" /><path d="M17.8 11.5L19 14a2 2 0 0 1-1.8 3H14" /><path d="M13 15l-2 2 2 2M14.5 6.4L16 8l-2.2.6M5.2 9.2l2.3.3.5-2.2" /></svg></span>
      <div>
        <h1 id="title">Recycle bin</h1>
        <p id="sumLine"><b id="nItems">12</b> items · <b id="nSize">86.4 MB</b></p>
      </div>
      <span class="chip" id="restored" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5" /><path d="M4 4v4.5h4.5" /></svg><span id="restoredText">0 restored</span></span>
    </header>

    <div class="tray">
      <div class="pile" id="pile" role="group" aria-label="Deleted files, press one to restore it"></div>
      <div class="done" id="done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 9.5L5 14a2 2 0 0 0 1.8 3H11" /><path d="M9 6.5l1.3-2.2a2 2 0 0 1 3.4 0L16 8" /><path d="M17.8 11.5L19 14a2 2 0 0 1-1.8 3H14" /><path d="M13 15l-2 2 2 2M14.5 6.4L16 8l-2.2.6M5.2 9.2l2.3.3.5-2.2" /></svg>
        <b>All sorted and gone</b>
        <span id="freed">86.4 MB freed</span>
        <button class="btn soft" id="refill" type="button">Refill with samples</button>
      </div>
    </div>

    <div class="bins" id="bins">
      <div class="bin" data-k="paper" style="--k: var(--paper)"><span class="count">0</span><div class="lid"></div><div class="can"><div class="fill"></div><span class="tag">Paper</span></div><span class="name">Documents</span></div>
      <div class="bin" data-k="media" style="--k: var(--media)"><span class="count">0</span><div class="lid"></div><div class="can"><div class="fill"></div><span class="tag">Media</span></div><span class="name">Photos and video</span></div>
      <div class="bin" data-k="arch" style="--k: var(--arch)"><span class="count">0</span><div class="lid"></div><div class="can"><div class="fill"></div><span class="tag">Archives</span></div><span class="name">Zips and apps</span></div>
    </div>

    <div class="actions">
      <div class="row" id="row">
        <span class="hint">Tap a file to restore it</span>
        <button class="btn soft" id="restoreAll" type="button">Restore all</button>
        <button class="btn danger" id="emptyBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5" /></svg>
          Empty bin
        </button>
      </div>
      <div class="confirm hide" id="confirm" role="alertdialog" aria-labelledby="cTitle" aria-describedby="cText">
        <p><b id="cTitle">Delete 12 items forever?</b><span id="cText">This frees 86.4 MB and cannot be undone.</span></p>
        <button class="btn soft" id="cancelBtn" type="button" tabindex="-1">Cancel</button>
        <button class="btn danger" id="yesBtn" type="button" tabindex="-1">Empty now</button>
      </div>
    </div>
    <p class="sr" id="status" role="status" aria-live="polite"></p>
  </main>
</div>

<script>
  (() => {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const pile = $("pile"), done = $("done"), freedEl = $("freed"), refill = $("refill");
    const nItems = $("nItems"), nSize = $("nSize"), restoredChip = $("restored"), restoredText = $("restoredText");
    const row = $("row"), confirmBox = $("confirm"), cTitle = $("cTitle"), cText = $("cText");
    const emptyBtn = $("emptyBtn"), restoreAll = $("restoreAll"), cancelBtn = $("cancelBtn"), yesBtn = $("yesBtn"), status = $("status");
    const bins = {}; document.querySelectorAll(".bin").forEach((b) => (bins[b.dataset.k] = { el: b, count: b.querySelector(".count"), fill: b.querySelector(".fill"), n: 0 }));
    const calm = matchMedia("(prefers-reduced-motion: reduce)");

    // ---------- Helpers ----------
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const pause = (ms) => wait(calm.matches ? Math.min(ms, 40) : ms);
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = { out: (t) => 1 - Math.pow(1 - t, 3), inOut: (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2) };
    function tween(ms, fn) {
      return new Promise((ok) => {
        const d = calm.matches ? 1 : ms, t0 = performance.now();
        const step = (now) => { const t = clamp((now - t0) / d); fn(t); if (t < 1) requestAnimationFrame(step); else ok(); };
        step(t0);
      });
    }
    const say = (m) => { status.textContent = m; };
    const press = (b) => { b.classList.add("pressed"); setTimeout(() => b.classList.remove("pressed"), 170); };
    const bump = (el) => { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 320); };
    const mb = (v) => (Math.round(v * 10) / 10).toFixed(1) + " MB";
    const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

    // ---------- The deleted files ----------
    const SAMPLE = [
      { name: "Invoice-Oct.pdf", ext: "PDF", size: 1.2, k: "paper" },
      { name: "Hunza-sunset.jpg", ext: "JPG", size: 4.8, k: "media" },
      { name: "Old site backup.zip", ext: "ZIP", size: 24.5, k: "arch" },
      { name: "Walima clip.mp4", ext: "MP4", size: 38.6, k: "media" },
      { name: "Rent agreement.docx", ext: "DOC", size: .4, k: "paper" },
      { name: "Photos-2023.rar", ext: "RAR", size: 9.6, k: "arch" },
      { name: "Voice note.m4a", ext: "M4A", size: 1.9, k: "media" },
      { name: "Sales Q3.xlsx", ext: "XLS", size: 2.1, k: "paper" },
      { name: "Installer.apk", ext: "APK", size: 1.8, k: "arch" },
      { name: "Screenshot 14.png", ext: "PNG", size: .9, k: "media" },
      { name: "Notes.txt", ext: "TXT", size: .1, k: "paper" },
      { name: "Fonts.7z", ext: "7Z", size: .5, k: "arch" },
    ];
    let items = [];
    const S = { busy: false, confirming: false, restored: 0, empty: false };
    const live = () => items.filter((i) => i.state === "bin");

    function build(animate) {
      pile.textContent = "";
      items = SAMPLE.map((x, i) => ({ ...x, id: i, state: "bin" }));
      items.forEach((it, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tile" + (animate ? " drop" : "");
        b.style.setProperty("--k", `var(--${it.k})`);
        b.style.setProperty("--tilt", ((i * 37) % 9) - 4 + "deg");
        b.style.setProperty("--fd", -((i * .73) % 4.6) + "s");
        b.style.setProperty("--dd", i * 45 + "ms");
        b.innerHTML = `<span class="ico" aria-hidden="true"></span><span class="meta"><b></b><span></span></span>`;
        b.querySelector(".ico").textContent = it.ext;
        b.querySelector(".meta b").textContent = it.name;
        b.querySelector(".meta span").textContent = mb(it.size);
        b.setAttribute("aria-label", `Restore ${it.name}, ${mb(it.size)}`);
        b.addEventListener("click", () => restoreOne(it));
        // drop the intro class once it has played, so later class changes (shake) never restart it
        // (also when the shake cuts it short: a cancelled drop would otherwise replay once the shake class goes)
        ["animationend", "animationcancel"].forEach((ev) => b.addEventListener(ev, (e) => { if (e.animationName === "drop") b.classList.remove("drop"); }));
        pile.appendChild(b);
        it.el = b;
      });
      S.empty = false; done.classList.remove("on");
      sync();
    }
    function sync() {
      const l = live(), size = l.reduce((s, i) => s + i.size, 0);
      if (nItems.textContent !== String(l.length)) { nItems.textContent = l.length; }
      nSize.textContent = mb(size);
      restoredText.textContent = `${S.restored} restored`;
      emptyBtn.disabled = S.busy || !l.length;
      restoreAll.disabled = S.busy || !l.length;
      items.forEach((i) => { if (i.el) i.el.disabled = S.busy || i.state !== "bin"; });
      cTitle.textContent = `Delete ${l.length} item${l.length === 1 ? "" : "s"} forever?`;
      cText.textContent = `This frees ${mb(size)} and cannot be undone.`;
    }

    // a file flies on an arc to a point on screen (x, y), spinning and shrinking
    function arc(el, x, y, ms, lift, spin, endScale) {
      const r = el.getBoundingClientRect();
      const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
      el.classList.add("fly");
      return tween(ms, (t) => {
        const k = ease.inOut(t);
        const yy = dy * k - lift * 4 * t * (1 - t);
        el.style.transform = `translate(${dx * k}px, ${yy}px) rotate(${spin * t}deg) scale(${1 - (1 - endScale) * t * t})`;
      });
    }
    function crumbs(x, y, k, n = 7) {
      const card = $("card").getBoundingClientRect();
      for (let i = 0; i < n; i++) {
        const c = document.createElement("i");
        c.className = "crumb";
        c.style.left = x - card.left + "px"; c.style.top = y - card.top + "px";
        c.style.setProperty("--k", `var(--${k})`);
        const a = Math.PI * (1.1 + .8 * (i / (n - 1))), d = 22 + Math.random() * 26;
        c.style.setProperty("--dx", Math.cos(a) * d + "px"); c.style.setProperty("--dy", Math.sin(a) * d + "px");
        $("card").appendChild(c);
        c.addEventListener("animationend", () => c.remove());
        setTimeout(() => c.remove(), 1000);
      }
    }
    const mouth = (k) => { const r = bins[k].el.querySelector(".can").getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + 8 }; };

    // ---------- Restore one file: it hops up to the restored chip ----------
    async function restoreOne(it) {
      if (S.busy || S.confirming || it.state !== "bin") return;
      it.state = "restored";
      it.el.disabled = true;
      const c = restoredChip.getBoundingClientRect();
      say(`${it.name} restored to Files.`);
      sync();
      await arc(it.el, c.left + c.width / 2, c.top + c.height / 2, 620, 60, -20, .2);
      it.el.classList.add("away");
      S.restored++; sync(); bump(restoredChip);
      if (!live().length) finishEmpty(false);
    }
    async function restoreEverything() {
      if (S.busy || S.confirming) return;
      const l = live();
      if (!l.length) return;
      S.busy = true; sync();
      const c = restoredChip.getBoundingClientRect();
      await Promise.all(l.map(async (it, i) => {
        await pause(i * 70);
        it.state = "restored";
        await arc(it.el, c.left + c.width / 2, c.top + c.height / 2, 600, 50, -20, .2);
        it.el.classList.add("away"); S.restored++; sync(); bump(restoredChip);
      }));
      say(`${l.length} files restored.`);
      S.busy = false; finishEmpty(false);
    }

    // ---------- Confirm step ----------
    function askConfirm() {
      if (S.busy || !live().length) return;
      S.confirming = true; sync();
      row.classList.add("hide"); confirmBox.classList.remove("hide");
      cancelBtn.tabIndex = 0; yesBtn.tabIndex = 0; emptyBtn.tabIndex = -1; restoreAll.tabIndex = -1;
      live().forEach((i) => { i.el.classList.remove("drop"); restart(i.el, "shake"); });
      if (!demo.on) yesBtn.focus({ preventScroll: true });
      say(cTitle.textContent + " " + cText.textContent);
    }
    function closeConfirm(focusBack) {
      S.confirming = false;
      row.classList.remove("hide"); confirmBox.classList.add("hide");
      cancelBtn.tabIndex = -1; yesBtn.tabIndex = -1; emptyBtn.tabIndex = 0; restoreAll.tabIndex = 0;
      items.forEach((i) => i.el && i.el.classList.remove("shake"));
      sync();
      if (focusBack) emptyBtn.focus({ preventScroll: true });
    }

    // ---------- Empty: lids open, every file is sorted into its bin, bins crush ----------
    async function emptyNow() {
      if (S.busy) return;
      const l = live();
      closeConfirm(false);
      if (!l.length) return;
      S.busy = true; sync();
      const total = l.reduce((s, i) => s + i.size, 0);
      say(`Sorting ${l.length} files into the bins.`);
      Object.values(bins).forEach((b, i) => setTimeout(() => b.el.classList.add("open"), calm.matches ? 0 : i * 90));
      await pause(380);
      await Promise.all(l.map(async (it, i) => {
        await pause(i * 120);
        const m = mouth(it.k);
        await arc(it.el, m.x, m.y + 12, 640, 70 + (i % 3) * 14, (i % 2 ? 1 : -1) * 220, .28);
        it.el.classList.add("away");
        it.state = "gone";
        const b = bins[it.k];
        b.n++; b.count.textContent = b.n; bump(b.count);
        b.fill.style.height = Math.min(92, b.n * 21) + "%";
        restart(b.el, "catch");
        crumbs(m.x, m.y, it.k, 5);
        sync();
      }));
      await pause(240);
      // lids slam shut, then each bin crunches its load down
      Object.values(bins).forEach((b) => b.el.classList.remove("open"));
      await pause(380);
      Object.values(bins).forEach((b, i) => setTimeout(() => {
        restart(b.el, "crush");
        const m = mouth(b.el.dataset.k);
        crumbs(m.x, m.y - 6, b.el.dataset.k, 9);
        b.fill.style.height = b.n ? "16%" : "0%";
      }, calm.matches ? 0 : i * 110));
      await pause(700);
      await tween(700, (t) => { freedEl.textContent = mb(total * ease.out(t)) + " freed"; });
      Object.values(bins).forEach((b) => { b.n = 0; b.count.textContent = "0"; });
      S.busy = false;
      finishEmpty(true, total);
      say(`Recycle bin emptied. ${mb(total)} freed.`);
    }
    function finishEmpty(deleted, total) {
      S.empty = true;
      if (!deleted) freedEl.textContent = "Every file went back to Files";
      else freedEl.textContent = mb(total) + " freed";
      done.querySelector("b").textContent = deleted ? "All sorted and gone" : "Nothing left in the bin";
      done.classList.add("on");
      sync();
    }

    emptyBtn.addEventListener("click", () => { press(emptyBtn); askConfirm(); });
    cancelBtn.addEventListener("click", () => { press(cancelBtn); closeConfirm(true); say("Kept everything in the bin."); });
    yesBtn.addEventListener("click", () => { press(yesBtn); emptyNow(); });
    restoreAll.addEventListener("click", () => { press(restoreAll); restoreEverything(); });
    refill.addEventListener("click", () => {
      if (S.busy) return;
      Object.values(bins).forEach((b) => { b.fill.style.height = "0%"; b.n = 0; b.count.textContent = "0"; });
      S.restored = 0;
      build(true); if (!demo.on) emptyBtn.focus({ preventScroll: true });
      say("Twelve sample files are back in the bin.");
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.confirming) closeConfirm(true); });

    // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
    const demo = { on: true, timer: 0, k: 0 };
    function stopDemo() { if (!demo.on) return; demo.on = false; clearTimeout(demo.timer); }
    addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
    addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
    function schedule(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
    async function runDemo() {
      if (!demo.on) return;
      if (S.busy) return schedule(500);
      if (S.empty) { press(refill); refill.click(); return schedule(2600); }
      if (demo.k++ % 2 === 1) { // every other round: rescue one file first
        const it = live()[3];
        if (it) { restoreOne(it); await wait(1100); if (!demo.on) return; }
      }
      press(emptyBtn); askConfirm();
      await wait(1100); if (!demo.on) return;
      press(yesBtn); await wait(150); if (!demo.on) { closeConfirm(false); return; }
      await emptyNow();
      schedule(2200);
    }

    build(true);
    schedule(900);
  })();
</script>
</body>
