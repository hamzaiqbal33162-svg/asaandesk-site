<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Reboundly look: sporty slate and lime, condensed numbers, floating pill navigation ================= */
:root{--font:"Bahnschrift","DIN Alternate","Barlow","Roboto Condensed","Segoe UI",system-ui,sans-serif;--rb:999px;--ri:12px;--rm:22px;--rp:16px;
--bg:#eef1ec;--surface:#ffffff;--surface2:#f4f6f2;--line:#dfe5dc;--text:#162026;--muted:#5d6b70;--hover:rgba(22,32,38,.06);--accent:#1d2a31;--on-accent:#d9ff5c;--lime:#b9ef3f;--ok:#2f9e58;--warn:#d58a0b;--danger:#e2483d;--info:#3a74ff;--field:#fff;
--c1:#8fcf1f;--c2:#3a74ff;--c3:#ff6a52;--c4:#14b8a6;--c5:#a26bff;--c6:#f2b81f;--shadow:0 18px 40px -26px rgba(20,30,35,.45)}
[data-theme="dark"]{--bg:#0d1215;--surface:#151c20;--surface2:#1b2428;--line:#26323a;--text:#e9f0ec;--muted:#93a2a6;--hover:rgba(220,255,140,.06);--accent:#c6ff3d;--on-accent:#11180a;--lime:#c6ff3d;--ok:#5fdc8c;--warn:#ffbe3d;--danger:#ff6b5e;--info:#7aa2ff;--field:#0f1518;
--c1:#c6ff3d;--c2:#7aa2ff;--c3:#ff8a74;--c4:#3ee0c8;--c5:#c09bff;--c6:#ffd25a;--toast-bg:#26323a;--shadow:0 18px 40px -22px rgba(0,0,0,.75)}
.num,.big{font-variant-numeric:tabular-nums}
.btn{font-weight:700;letter-spacing:.02em}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* Header with a floating pill navigation */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand i{font-style:normal;color:var(--c1)}
.pillnav{position:relative;display:flex;gap:2px;padding:5px;margin:0 auto;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:100%}
.pillnav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap;transition:color .25s}
.pillnav a .ic{width:16px;height:16px}
.pillnav a:hover{color:var(--text)}
.pillnav a[aria-current="page"]{color:var(--on-accent)}
.pillnav .nav-marker{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.3,1.25,.5,1),width .35s;pointer-events:none}
.top-r{display:flex;gap:4px;align-items:center}
.wrap{padding:8px 22px 46px;max-width:1520px;margin:0 auto;overflow-x:clip}
main{outline:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ph p{color:var(--muted);margin-top:6px;font-size:13px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.02);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ch h2{font-size:15px;font-weight:800;letter-spacing:.01em}
.ch p{font-size:12px;color:var(--muted)}
.kpi{position:relative;overflow:hidden}
.kpi small{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.kpi .kf{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.kpi.hero small,.kpi.hero .kf{color:color-mix(in srgb,var(--on-accent) 70%,transparent)}
.delta{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-weight:800;font-size:11.5px;background:color-mix(in srgb,var(--c1) 22%,transparent);color:var(--text)}
.kpi.hero .delta{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}
/* Flow board */
.flow{display:grid;grid-template-columns:repeat(5,minmax(165px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.fcol{border-radius:16px;background:var(--surface2);padding:8px;min-height:200px;display:flex;flex-direction:column;gap:7px;transition:background .2s}
.fcol h3{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:4px 6px}
.fcol h3 span:last-child{min-width:24px;height:22px;display:grid;place-items:center;border-radius:99px;background:var(--fc);color:#10170a;font-size:11.5px}
.fcard{background:var(--surface);border-radius:14px;padding:9px 10px;font-size:12px;display:grid;gap:4px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;animation:rise .45s both}
.fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fcard b{font-size:13px}
.fcard .fr{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted)}
.fcard .mv{border:0;background:var(--surface2);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;padding:0;color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:5px}
/* Schedule */
.sch-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sch-tools .dt{font-weight:800;min-width:150px;text-align:center}
.sch-wrap{overflow-x:auto}
.sch{display:grid;min-width:760px}
.sch-h{padding:8px 4px;text-align:center;font-weight:800;font-size:12.5px;border-bottom:1px solid var(--line)}
.sch-h small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.sch-h .dot{width:10px;height:10px}
.sch-h.today{color:var(--c2)}
.gut{position:relative}.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted)}
.scol{position:relative;border-left:1px dashed var(--line);background:repeating-linear-gradient(180deg,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.ap{position:absolute;left:3px;right:3px;border-radius:12px;padding:4px 8px;border:0;background:color-mix(in srgb,var(--cc) 22%,var(--surface));color:var(--text);font-size:11px;text-align:left;overflow:hidden;line-height:1.3;box-shadow:inset 3px 0 0 var(--cc);transition:transform .2s,box-shadow .2s}
.ap:hover{transform:scale(1.03);box-shadow:inset 3px 0 0 var(--cc),0 10px 22px -12px rgba(0,0,0,.5);z-index:3}
.ap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.done{opacity:.5}
.now{position:absolute;left:0;right:0;height:2px;background:var(--c3);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--c3)}
/* Recovery (signature) */
.rec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}
.joint{position:relative;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c1) 18%,transparent),transparent 65%),var(--surface2);border-radius:18px;padding:10px;display:grid;place-items:center}
.joint svg{width:100%;max-width:360px;height:auto;display:block;overflow:visible}
.joint .bone{stroke:var(--text);stroke-width:16;stroke-linecap:round;fill:none}
.joint .flesh{stroke:color-mix(in srgb,var(--text) 14%,transparent);stroke-width:34;stroke-linecap:round;fill:none}
.joint .pivot{fill:var(--c1);stroke:var(--text);stroke-width:3}
.joint .seg{transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-box:view-box}
.joint .arc{fill:color-mix(in srgb,var(--c1) 28%,transparent);stroke:var(--c1);stroke-width:2}
.joint .goal{fill:none;stroke:var(--c2);stroke-width:2;stroke-dasharray:5 5}
.joint .deg{font-size:30px;font-weight:800;fill:var(--text);font-family:var(--font)}
.joint .lbl{font-size:12px;fill:var(--muted);font-family:var(--font)}
.scrub{display:grid;gap:6px;margin-top:12px}
.scrub input[type=range]{width:100%;accent-color:var(--c1);height:28px}
.scrub .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini3 div{background:var(--surface2);border-radius:14px;padding:10px;text-align:center}
.mini3 small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mini3 b{font-size:24px;font-weight:800}
.chartbox{position:relative}
.marker{position:absolute;top:30px;bottom:26px;width:2px;background:var(--c3);pointer-events:none;transition:left .5s cubic-bezier(.3,1.2,.5,1);border-radius:2px}
.marker::after{content:attr(data-l);position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--c3);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.miles{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.miles li{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 10px;border-radius:12px;background:var(--surface2)}
.miles li.hit{background:color-mix(in srgb,var(--c1) 20%,var(--surface2))}
.miles li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.miles li.hit i{background:var(--c1);border-color:var(--c1)}
/* Programs */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ex{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;font-weight:700;text-align:left;color:var(--text);width:100%}
.ex svg{width:30px;height:30px;flex:none;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.ex:hover{border-color:var(--c1)}
.prog{list-style:none;margin:0;padding:8px;display:grid;gap:8px;min-height:220px;border-radius:18px;border:2px dashed var(--line);transition:background .2s}
.pi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03);animation:rise .4s both}
.pi .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12px;flex:none}
.pi .grow{flex:1;min-width:0}.pi b{display:block;font-size:13px}.pi small{color:var(--muted);font-size:11.5px}
.pi svg{width:28px;height:28px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.pi .acts{display:flex;gap:2px}
/* Team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tm-top{display:flex;align-items:center;gap:12px}
.tm-top b{display:block;font-size:15px}.tm-top small{color:var(--muted)}
.tm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;text-align:center}
.tm-stats b{display:block;font-size:22px;font-weight:800}.tm-stats small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.week5{display:flex;gap:4px}
.week5 span{flex:1;height:30px;border-radius:8px;background:color-mix(in srgb,var(--cc) var(--p),var(--surface2));font-size:10px;display:grid;place-items:center;color:var(--muted)}
/* Lists, drawers */
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.li:hover{background:var(--hover)}
.li .grow{flex:1;min-width:0}.li b{display:block;font-size:13px}.li small{display:block;color:var(--muted);font-size:11.5px}
.tm2{font-weight:800;min-width:62px;font-size:13px}
.pf{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf b{font-size:16px;display:block}.pf small{color:var(--muted)}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.dlist dt{color:var(--muted)}.dlist dd{margin:0;font-weight:700}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}.set-row b{display:block}.set-row small{color:var(--muted)}
@media (max-width:1180px){.pillnav a span{display:none}.pillnav a{padding:9px 12px}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3,.rec{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.pillnav{position:fixed;left:10px;right:10px;bottom:10px;margin:0;z-index:45;justify-content:space-between}.pillnav a{padding:9px 10px;flex:1;justify-content:center}.wrap{padding:6px 14px 90px}.top{padding:10px 14px}.brand span{display:none}}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:26px}.kpi b{font-size:32px}.mini3 b{font-size:20px}}

<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = n => (n < 0 ? '-$' : '$') + num(Math.abs(n));
const short = n => { const a = Math.abs(n), s = (v, u) => (Math.round(v * 10) / 10).toString() + u; return a >= 1e9 ? s(n / 1e9, 'B') : a >= 1e6 ? s(n / 1e6, 'M') : a >= 1e3 ? s(n / 1e3, 'K') : String(Math.round(n * 10) / 10); };
const pct = n => (n > 0 ? '+' : '') + dec(n, 1) + '%';
const FMT = { num, rs, usd, usd0, short, pct, dec1: n => dec(n, 1), raw: n => String(Math.round(n)), rsShort: n => 'Rs ' + short(n), pctPlain: n => Math.round(n) + '%', usdShort: n => '$' + short(n) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pdate = s => { if (s instanceof Date) return s; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fdate = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fday = s => { const d = pdate(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fshort = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dayDiff = (a, b) => Math.round((pdate(a) - pdate(b)) / 864e5);
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60) % 24, m = min % 60; return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : Math.floor(s / 86400) + ' d ago'; };

/* Storage that never breaks when the browser blocks it */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* Icons: simple stroke drawings, 24x24 */
const ICONS = {
  home: 'M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10', cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', users: 'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3-6 7-6s7 2 7 6M16 3.5a4 4 0 010 7.5M18 15c2.5.7 4 2.6 4 6',
  user: 'M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7', file: 'M6 2h8l5 5v15H6zM14 2v5h5M9 13h7M9 17h7', pill: 'M10.5 3.5a5 5 0 017 7l-7 7a5 5 0 01-7-7zM7 7l7 7',
  heart: 'M12 20s-8-4.6-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 2.5C20 15.4 12 20 12 20z', chart: 'M3 21h18M6 18v-7M11 18V6M16 18v-4M21 18V9', gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  bell: 'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4', search: 'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5', plus: 'M12 5v14M5 12h14', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',

  if (!d || !d.length) return '';
  const lo = Math.min(...d), hi = Math.max(...d), r = hi - lo || 1, id = 'sp' + (++GID);
  const p = d.map((v, i) => [d.length === 1 ? w / 2 : 2 + i * (w - 4) / (d.length - 1), h - 3 - (v - lo) / r * (h - 6)]), path = smoothPath(p);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" data-tip="${esc(tipText || `Low ${short(lo)} · High ${short(hi)}`)}" role="img" aria-label="Trend"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.35"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path d="${path}L${w - 2},${h}L2,${h}Z" fill="url(#${id})" class="area"/><path d="${path}" class="line draw" pathLength="1" style="stroke:${color}"/></svg>`;
}
function ringSVG(p, { size = 56, thick = 6, color = 'var(--accent)', tipText } = {}) {
  const r = (size - thick) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" ${tipText ? `data-tip="${esc(tipText)}" role="img" aria-label="${esc(tipText)}"` : 'aria-hidden="true"'}><circle r="${r}" cx="${size / 2}" cy="${size / 2}" class="ring-bg" style="stroke-width:${thick}"/><circle r="${r}" cx="${size / 2}" cy="${size / 2}" class="ring-fg" transform="rotate(-90 ${size / 2} ${size / 2})" style="stroke:${color};stroke-width:${thick};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${(c * (1 - clamp(p, 0, 1))).toFixed(2)};--c:${c.toFixed(2)}"/></svg>`;
}
function gaugeSVG(p, { w = 180, thick = 14, color = 'var(--accent)', tipText } = {}) {
  const r = (w - thick) / 2, h = r + thick, c = Math.PI * r, d = `M${thick / 2},${r + thick / 2} A${r},${r} 0 0 1 ${w - thick / 2},${r + thick / 2}`;
  return `<svg class="gauge" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" ${tipText ? `data-tip="${esc(tipText)}" role="img" aria-label="${esc(tipText)}"` : 'aria-hidden="true"'}><path d="${d}" class="ring-bg" style="stroke-width:${thick}"/><path d="${d}" class="ring-fg" style="stroke:${color};stroke-width:${thick};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${(c * (1 - clamp(p, 0, 1))).toFixed(2)};--c:${c.toFixed(2)}"/></svg>`;
}
/* Horizontal bars as HTML */
const hbars = (list, f = num, color = 'var(--accent)') => { const mx = Math.max(1, ...list.map(x => x.value)); return `<div class="hbars">${list.map((x, i) => `<div class="hb" data-tip="${esc(x.label)}: ${esc(f(x.value))}"><span class="hb-l">${esc(x.label)}</span><span class="hb-t"><i style="--w:${(x.value / mx * 100).toFixed(1)}%;--i:${i};background:${x.color || color}"></i></span><b>${esc(f(x.value))}</b></div>`).join('')}</div>`; };
/* Heatmap grid as HTML: rows x cols, values 0..max */
function heatHTML(rows, cols, val, { f = num, color = 'var(--accent)', label = '' } = {}) {
  let mx = 1; rows.forEach((_, r) => cols.forEach((_, c) => { mx = Math.max(mx, val(r, c)); }));
  return `<div class="heat" style="--cols:${cols.length}" role="img" aria-label="${esc(label || 'Heatmap')}"><span></span>${cols.map(c => `<span class="hx">${esc(c)}</span>`).join('')}${rows.map((rw, r) => `<span class="hy">${esc(rw)}</span>${cols.map((c, ci) => { const v = val(r, ci); return `<i style="--a:${(0.08 + 0.92 * v / mx).toFixed(2)};--i:${r + ci};background:${color}" data-tip="${esc(rw)} · ${esc(c)}: ${esc(f(v))}"></i>`; }).join('')}`).join('')}</div>`;
}

  });

    team.forEach(c => { let t = OPEN + ri(0, 3) * 15; while (t < CLOSE - 30) { if (chance(off > 3 ? .45 : .7)) { const ty = chance(.15) ? TYPES[0] : pick(TYPES.slice(1)), p = pick(patients.filter(x => x.status === 'Active' && (x.clin === c.id || chance(.1))).concat(patients[0])); if (t + ty[1] > CLOSE) break; appts.push({ id: 'a' + (++aid), date: iso(day), start: t, dur: ty[1], clin: c.id, pat: p.id, type: ty[0], status: off < 0 ? (chance(.93) ? 'Done' : 'No-show') : 'Booked' }); t += ty[1] + pick([0, 0, 15]); } else t += 30; } }); }
  const invoices = []; let inv = 300;

  const hist = Array.from({ length: 11 }, (_, i) => Math.round(rand(820, 1100) * 1000 * (1 + i * .025)));
  return { v: 1, team, patients, appts, invoices, hist, flow: { date: '', st: {} }, clinic: { name: 'Reboundly Physio Studio', city: 'Islamabad', phone: '051-2280-4410' } };
}

  el.innerHTML = `<div class="ph" data-rise><div><h1>Clinicians</h1><p>Five clinicians · week of ${fshort(iso(addDays(TODAY, -((TODAY.getDay() + 6) % 7))))}</p></div></div>
  <div class="team">${D.team.map(c => { const mon = addDays(TODAY, -((TODAY.getDay() + 6) % 7)), wk = Array.from({ length: 6 }, (_, i) => sum(D.appts.filter(a => a.clin === c.id && a.date === iso(addDays(mon, i)) && a.status !== 'No-show').map(a => a.dur)) / (CLOSE - OPEN)), pts = D.patients.filter(p => p.clin === c.id && p.status === 'Active'), gain = pts.length ? Math.round(sum(pts.map(p => (lastS(p).rom - firstS(p).rom)))) / pts.length : 0;
    return `<article class="card"><div class="tm-top">${av(c.name, 'lg')}<div><b>${esc(c.name)}</b><small><span class="dot" style="--cc:${c.color}"></span>${esc(c.focus)}</small></div></div><div class="tm-stats"><div><b>${pts.length}</b><small>patients</small></div><div><b>${Math.round(sum(wk) / 6 * 100)}%</b><small>booked</small></div><div><b>+${Math.round(gain)}°</b><small>avg gain</small></div></div><div class="week5">${wk.map((v, i) => `<span style="--cc:${c.color};--p:${Math.round(v * 100)}%" data-tip="${DOW[addDays(mon, i).getDay()]}: ${Math.round(v * 100)}% booked">${DOW[addDays(mon, i).getDay()][0]}</span>`).join('')}</div><div class="ph-a" style="margin-top:12px"><button type="button" class="btn sm" data-cw="${c.id}">Week view</button><button type="button" class="btn sm ghost" data-cb="${c.id}">${ic('plus')}Book</button></div></article>`; }).join('')}</div>
  <section class="card" style="margin-top:14px"><div class="ch"><div><h2>Caseload by condition</h2><p>Active patients</p></div></div><div id="cl"></div></section>`;
  barChart($('#cl', el), { labels: D.team.map(c => c.name.split(' ')[0]), stacked: true, h: 220, fmt: v => String(Math.round(v)), series: [...new Set(CONDS.map(c => c[1]))].map((j, i) => ({ name: j, color: `var(--c${i + 1})`, data: D.team.map(c => D.patients.filter(p => p.clin === c.id && p.status === 'Active' && p.joint === j).length) })) });
  el.addEventListener('click', e => { const w = e.target.closest('[data-cw]'), b = e.target.closest('[data-cb]'); if (w) { schView = 'Week'; schClin = w.dataset.cw; ROUTER.go('schedule'); } else if (b) apptForm(null, { clin: b.dataset.cb }); });
}

/* ---------- Page: Billing ---------- */
let billR = '30D';
function pBilling(el) {
  const open = D.invoices.filter(i => i.paid < i.total), mk = iso(TODAY).slice(0, 7);
  const ser = () => { if (billR === '12M') { const L = [], v = []; for (let i = 11; i >= 0; i--) { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1); L.push(MON[d.getMonth()]); v.push(i ? D.hist[11 - i] : sum(D.invoices.filter(x => x.date.slice(0, 7) === mk).map(x => x.paid))); } return { L, v }; } const n = billR === '7D' ? 7 : 30, L = [], v = []; for (let i = n - 1; i >= 0; i--) { const d = iso(addDays(TODAY, -i)); L.push(n === 7 ? DOW[pdate(d).getDay()] : fshort(d)); v.push(sum(D.invoices.filter(x => x.date === d).map(x => x.paid))); } return { L, v }; };
  el.innerHTML = `<div class="ph" data-rise><div><h1>Billing</h1><p>${open.length} unpaid · ${rs(sum(open.map(i => i.total - i.paid)))} to collect · ${D.patients.filter(p => p.pack).length} patients on session packs</p></div><div class="ph-a">${segc('Range', ['7D', '30D', '12M'], billR)}<button type="button" class="btn primary" data-a="pack">${ic('tag')}Sell a 10-pack</button></div></div>
  <div class="g g21"><section class="card"><div class="ch"><h2>Collected</h2></div><div id="bc"></div></section><section class="card"><div class="ch"><h2>By session type</h2></div><div id="bd"></div></section></div><section class="card" id="it"></section>`;
  const args = () => { const s = ser(); return { labels: s.L, series: [{ name: 'Collected', data: s.v, color: 'var(--c1)' }], h: 220, fmt: short, tfmt: rs }; };
  barChart($('#bc', el), args());
  donut($('#bd', el), { data: TYPES.map((t, i) => ({ label: t[0], value: sum(D.invoices.filter(x => x.item === t[0]).map(x => x.total)), color: `var(--c${i + 1})` })), size: 140, thick: 18, fmt: v => 'Rs ' + short(v), center: { value: sum(D.invoices.map(x => x.total)), label: 'billed', fmt: 'rsShort' } });
  segBind(el, 'seg', v => { billR = v; barChart($('#bc', el), args()); });
  makeTable($('#it', el), { rows: () => D.invoices.slice().reverse().map(i => ({ ...i, ref: i, pn: pat(i.pat).name, st: i.paid >= i.total ? 'Paid' : 'Unpaid' })), unit: 'bill', units: 'bills', ph: 'Search bill or patient…', keys: ['id', 'pn', 'item'], pageSize: 8, chips: { k: 'st', opts: ['All', 'Unpaid', 'Paid'] },
    cols: [{ k: 'id', label: 'Bill' }, { k: 'pn', label: 'Patient', f: v => `<div class="cellp">${av(v, 'sm')}<b>${esc(v)}</b></div>` }, { k: 'item', label: 'Session' }, { k: 'date', label: 'Date', f: v => fshort(v) }, { k: 'total', label: 'Amount', num: true, f: v => rs(v) }, { k: 'st', label: 'Status', f: v => sBadge(v) }, { k: 'x', label: '', sort: false, f: (v, r) => r.st === 'Unpaid' ? `<button type="button" class="btn sm primary" data-act="pay">Mark paid</button>` : '' }],
    onAct: (a, r) => { r.ref.paid = r.ref.total; save(); toast(`${r.id} paid · ${rs(r.total)}`); refresh(); }, onRow: r => patientDrawer(pat(r.pat)) });
}

/* ---------- Page: Settings ---------- */
function pSettings(el) {
  el.innerHTML = `<div class="ph" data-rise><div><h1>Settings</h1><p>Clinic details, session prices and demo data</p></div></div><div class="g g2"><section class="card"><div class="ch"><h2>Clinic</h2></div><form class="frm" id="cf" novalidate>${fieldHTML({ k: 'name', label: 'Clinic name', req: true }, D.clinic.name)}${fieldHTML({ k: 'city', label: 'City', half: true }, D.clinic.city)}${fieldHTML({ k: 'phone', label: 'Phone', type: 'tel', half: true }, D.clinic.phone)}<div><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card"><div class="ch"><h2>Session prices</h2></div><ul class="list">${TYPES.map(t => `<li class="li"><div class="grow"><b>${t[0]}</b><small>${t[1]} minutes</small></div><b>${rs(t[2])}</b></li>`).join('')}</ul></section></div>
  <section class="card"><div class="set-row"><div><b>Theme</b><small>Daylight or night shift. ?theme=dark works too.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the five-clinician sample clinic</small></div><button type="button" class="btn danger" data-a="reset">${ic('refresh')}Reset</button></div></section>`;
  syncThemeBtns();
  $('#cf', el).onsubmit = e => { e.preventDefault(); const f = e.target, n = f.elements.name; if (!n.value.trim()) { n.setAttribute('aria-invalid', 'true'); $('#' + n.id + '-e').textContent = 'Clinic name is required'; return; } n.removeAttribute('aria-invalid'); $('#' + n.id + '-e').textContent = ''; ['name', 'city', 'phone'].forEach(k => D.clinic[k] = f.elements[k].value.trim()); save(); toast('Clinic details saved'); };
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'overview', label: 'Overview', icon: 'home', render: pOverview }, { id: 'schedule', label: 'Schedule', icon: 'cal', render: pSchedule }, { id: 'patients', label: 'Patients', icon: 'users', render: pPatients },
  { id: 'recovery', label: 'Recovery', icon: 'activity', render: pRecovery }, { id: 'programs', label: 'Programs', icon: 'list', render: pPrograms }, { id: 'team', label: 'Team', icon: 'user', render: pTeam },
  { id: 'billing', label: 'Billing', icon: 'wallet', render: pBilling }, { id: 'settings', label: 'Settings', icon: 'gear', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}" aria-label="${r.label}">${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
document.addEventListener('click', e => {
  const t = e.target;
  const mv = t.closest('[data-mvst]'); if (mv) { const a = D.appts.find(x => x.id === mv.dataset.mvst); menu(mv, STAGES.map(([s]) => ({ label: s, disabled: s === stage(a) })), o => moveStage(a, o.label), 'Move to'); return; }
  const fc = t.closest('.fcard'); if (fc && !t.closest('button')) { patientDrawer(pat(D.appts.find(x => x.id === fc.dataset.ap).pat)); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'appt') apptForm(null); else if (a === 'patient') patientForm(null);
  else if (a === 'pack') formModal({ title: 'Sell a 10-session pack', submit: 'Sell pack', values: { price: 40000 }, fields: [{ k: 'pat', label: 'Patient', type: 'select', req: true, opts: [{ v: '', l: 'Choose a patient' }, ...D.patients.filter(p => p.status === 'Active' && !p.pack).map(p => ({ v: p.id, l: p.name }))] }, { k: 'price', label: 'Pack price (Rs)', type: 'number', min: 1000, max: 200000, req: true }], onSubmit(v) { const p = pat(v.pat); p.pack = { size: 10, used: 0 }; D.invoices.push({ id: 'RB-' + (900 + D.invoices.length), pat: p.id, date: iso(TODAY), item: '10-session pack', total: v.price, paid: v.price }); save(); toast(`${p.name} bought a 10-pack · ${rs(v.price)}`); refresh(); } });
  else if (a === 'reset') confirmBox('Put back the sample clinic? Your changes will be lost.', () => { store.del(KEY); D = makeData(); seedFlow(); save(); toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), { label: 'Book a session', hint: 'Action', icon: 'plus', run: () => apptForm(null) }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }, ...D.patients.map(p => ({ label: p.name, hint: p.cond, icon: 'user', run: () => patientDrawer(p) }))];

/* Start */
initTheme('reboundly', '');
const near = D.patients.filter(p => p.status === 'Active' && lastS(p).rom >= p.goal * .9); if (near.length) addNote(`${near.length} patients are within 10% of their range goal`, 'ok', new Date(Date.now() - 5e6));
const packLow = D.patients.find(p => p.pack && p.pack.size - p.pack.used <= 2); if (packLow) addNote(`${packLow.name} has ${packLow.pack.size - packLow.pack.used} pack sessions left`, 'warn', new Date(Date.now() - 2e6));
addNote(`${todayA().length} sessions booked today`, 'info', new Date(Date.now() - 3e7));
save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'overview', title: 'Reboundly' });
</script>
</body>
</html>
