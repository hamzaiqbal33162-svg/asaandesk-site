<html lang="en">

<title>Scratch Gift · scratch-off gift card redeem</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: plum, coral and mint ribbon ---------- */
  :root {
    color-scheme: light;
    --stage: #f7eef6;
    --stage-2: #fde3e0;
    --panel: rgba(255, 255, 255, .72);
    --ink: #2d1838;
    --muted: #8a6f93;
    --line: rgba(45, 24, 56, .14);
    --plum: #5b2a86;
    --berry: #a23b8f;
    --coral: #ff6f61;
    --mint: #57d2b0;
    --mint-dk: #1f9c7c;
    --bad: #e23d5a;
    --shadow: rgba(91, 42, 134, .35);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #150b1b;
    --stage-2: #2a0f26;
    --panel: rgba(255, 255, 255, .06);
    --ink: #f6e9fb;
    --muted: #b79cc2;
    --line: rgba(246, 233, 251, .14);
    --mint-dk: #57d2b0;
    --bad: #ff7189;
    --shadow: rgba(0, 0, 0, .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, var(--stage-2), transparent 55%), radial-gradient(circle at 85% 90%, rgba(87, 210, 176, .18), transparent 50%), var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button { font: inherit; }
  [hidden] { display: none !important; }
  .wrap { width: min(100%, 380px); display: flex; flex-direction: column; align-items: center; }

  /* ---------- Wallet balance pill ---------- */
  .wallet {
    display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; margin-bottom: 16px; border-radius: 999px;
    background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 8px 18px -10px var(--shadow); backdrop-filter: blur(6px);
  }
  .wallet .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--plum), var(--berry)); }
  .wallet small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .wallet strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .wallet.bump { animation: bump .6s cubic-bezier(.34, 1.7, .5, 1); }
  @keyframes bump { 30% { transform: scale(1.12); box-shadow: 0 0 0 2px var(--mint), 0 0 26px rgba(87, 210, 176, .6); } }

  /* ---------- The gift card (3D: tilt wrapper, flip inner) ---------- */
  .card-stage { width: min(100%, 340px); aspect-ratio: 1.586; perspective: 1100px; animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .card-stage.out { animation: out .45s cubic-bezier(.5, 0, .75, 0) forwards; }
  .card-stage.in { animation: in .7s cubic-bezier(.25, 1.4, .5, 1); }
  @keyframes out { to { transform: translateX(-130%) rotate(-10deg); opacity: 0; } }
  @keyframes in { from { transform: translateX(130%) rotate(10deg); opacity: 0; } }
  .tilt { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .25s ease-out; }
  .tilt.lean { transform: rotateX(14deg) translateY(-6px) !important; transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
  .card3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.3, 1.25, .5, 1); }
  .card3d.flipped { transform: rotateY(180deg); }
  .card3d.snap { transition: none; }
  .face {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 24px 40px -18px var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, .18);
  }
  .front {
    color: #fff;
    background:
      radial-gradient(rgba(255, 255, 255, .12) 1px, transparent 1.5px) 0 0 / 14px 14px,
      linear-gradient(135deg, var(--plum) 0%, var(--berry) 48%, var(--coral) 100%);
  }
  /* Ribbon bands and a shine that sweeps now and then */
  .front .rib-v { position: absolute; top: 0; bottom: 0; left: 22%; width: 20px; background: linear-gradient(90deg, #3fb894, var(--mint) 40%, #8ff0d4 55%, var(--mint) 70%, #3fb894); box-shadow: 0 0 10px rgba(0, 0, 0, .18); }
  .front .rib-h { position: absolute; left: 0; right: 0; top: 47%; height: 20px; background: linear-gradient(180deg, #3fb894, var(--mint) 40%, #8ff0d4 55%, var(--mint) 70%, #3fb894); box-shadow: 0 0 10px rgba(0, 0, 0, .18); }
  .front .bow { position: absolute; left: calc(22% - 30px); top: calc(47% - 24px); width: 80px; height: 66px; animation: wiggle 4s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-6deg) scale(1.04); } 86% { transform: rotate(4deg); } }
  .front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .35) 50%, transparent 65%); transform: translateX(-120%); animation: shine 5s ease-in-out infinite 1.2s; pointer-events: none; }
  @keyframes shine { 0%, 70% { transform: translateX(-120%); } 90%, 100% { transform: translateX(120%); } }
  .front .label { position: absolute; right: 18px; top: 16px; text-align: right; }
  .front .label small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .22em; opacity: .85; }
  .front .label strong { display: block; margin-top: 3px; font-size: clamp(22px, 7vw, 28px); font-weight: 850; letter-spacing: -.01em; text-shadow: 0 2px 10px rgba(60, 10, 60, .35); }
  .front .valid { position: absolute; right: 18px; top: 76px; font-size: 10.5px; opacity: .75; }

  /* Scratch strip: the code sits under a canvas of silver foil */
  .strip { position: absolute; left: 16px; right: 16px; bottom: 15px; height: 44px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, #fff7e6, #ffe9c2); box-shadow: inset 0 0 0 1px rgba(91, 42, 134, .2); }
  .strip .code { position: absolute; inset: 0; display: grid; place-items: center; font: 800 clamp(15px, 4.8vw, 19px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; color: var(--plum); }
  .strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; transition: opacity .6s, transform .6s; }
  .strip canvas:active { cursor: grabbing; }
  .strip canvas.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .coin { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 35% 30%, #fff3c4, #e8b94a 55%, #a87b1f); box-shadow: 0 3px 6px rgba(0, 0, 0, .35), inset 0 0 0 2px rgba(255, 255, 255, .3); transition: opacity .25s; }
  .coin.on { opacity: 1; }

  .back {
    transform: rotateY(180deg);
    color: var(--ink);
    background: radial-gradient(circle at 80% 0%, rgba(87, 210, 176, .35), transparent 55%), linear-gradient(160deg, #fffaf4, #fbe9f3);
    display: grid; place-items: center; text-align: center; align-content: center; gap: 4px;
  }
  [data-theme="dark"] .back { color: #2d1838; }
  .back .badge { width: 48px; height: 48px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); box-shadow: 0 0 0 6px rgba(87, 210, 176, .25); }
  .back .badge path { stroke-dasharray: 30; stroke-dashoffset: 30; }
  .card3d.flipped .badge path { animation: draw .5s ease .55s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .back small { font-size: 10.5px; font-weight: 800; letter-spacing: .2em; color: #8a6f93; }
  .back strong { font-size: 30px; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: #5b2a86; }
  .back span { font-size: 12.5px; color: #6f5a78; }

  /* ---------- Code field: three groups of four that act as one ---------- */
  form { width: 100%; margin-top: 20px; }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .lbl span { letter-spacing: 0; text-transform: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .groups { display: flex; align-items: center; gap: 6px; }
  .groups .dash { flex: none; width: 8px; height: 3px; border-radius: 2px; background: var(--line); }
  .grp { position: relative; flex: 1; min-width: 0; border-radius: 13px; background: var(--panel); box-shadow: 0 0 0 1.5px var(--line); transition: box-shadow .25s, transform .3s cubic-bezier(.34, 1.56, .64, 1), background .3s; }
  .grp input {
    width: 100%; height: 50px; padding: 0 4px; border: 0; background: transparent; outline: none; text-align: center; color: var(--ink);
    font: 800 clamp(16px, 5vw, 20px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; caret-color: var(--coral);
  }
  .grp input::placeholder { color: var(--line); letter-spacing: .16em; }
  .grp:focus-within, .grp.cur { box-shadow: 0 0 0 2px var(--coral), 0 6px 16px -6px rgba(255, 111, 97, .55); transform: translateY(-2px); }
  .grp.full { background: rgba(255, 111, 97, .08); }
  .grp.full::after { content: ""; position: absolute; right: 7px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); animation: popIn .35s cubic-bezier(.34, 1.8, .5, 1); }
  @keyframes popIn { from { transform: scale(0); } }
  .groups.scan .grp { animation: scan .8s ease-in-out infinite; animation-delay: calc(var(--i) * .12s); }
  @keyframes scan { 50% { box-shadow: 0 0 0 2px var(--berry), 0 0 18px rgba(162, 59, 143, .45); } }
  .groups.ok .grp { background: rgba(87, 210, 176, .16); box-shadow: 0 0 0 2px var(--mint); animation: hop .55s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * .08s); }
  @keyframes hop { 40% { transform: translateY(-8px); } }
  .groups.ok .grp::after { background: var(--mint); }
  .groups.bad .grp { box-shadow: 0 0 0 2px var(--bad); background: rgba(226, 61, 90, .08); }
  .groups.bad { animation: shake .45s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  .go {
    position: relative; width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 14px; cursor: pointer; overflow: hidden;
    color: #fff; font-size: 15px; font-weight: 750; letter-spacing: .02em;
    background: linear-gradient(135deg, var(--plum), var(--berry) 55%, var(--coral));
    box-shadow: 0 10px 22px -10px var(--shadow);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .25s, filter .25s;
  }
  .go:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); }
  .go:active:not(:disabled), .go.press { transform: scale(.97); }
  .go:disabled { opacity: .45; cursor: default; }
  .go:focus-visible, .reveal:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
  .go.loading .txt { opacity: 0; }
  .go .spin { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: #fff; opacity: 0; }
  .go.loading .spin { opacity: 1; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { min-height: 20px; margin: 12px 0 2px; font-size: 14px; font-weight: 650; text-align: center; }
  .status[data-tone="good"] { color: var(--mint-dk); }
  .status[data-tone="bad"] { color: var(--bad); }
  .status.pop { animation: statusIn .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(6px); } }
  .hint { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }
  .reveal { padding: 0; border: 0; background: none; color: var(--berry); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  [data-theme="dark"] .reveal { color: #ff9a8f; }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; }
  .fx .flycoin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 900 10px/1 system-ui, sans-serif; color: #6b4a09;
    background: radial-gradient(circle at 35% 30%, #fff3c4, #e8b94a 55%, #a87b1f); box-shadow: 0 4px 10px rgba(0, 0, 0, .3); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="wallet" id="wallet">
      <span class="ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="3.5" width="13" height="10" rx="2.5" stroke="#fff" stroke-width="1.6"/><path d="M10 8.5h4.5" stroke="#fff" stroke-width="1.6"/><circle cx="11" cy="8.5" r=".9" fill="#fff"/></svg></span>
      <span><small>Wallet</small><strong id="bal">PKR 1,250</strong></span>
    </div>

    <div class="card-stage" id="stage">
      <div class="tilt" id="tilt">
        <div class="card3d" id="card">
          <div class="face front">
            <span class="rib-v" aria-hidden="true"></span>
            <span class="rib-h" aria-hidden="true"></span>
            <svg class="bow" viewBox="0 0 80 66" aria-hidden="true">
              <path d="M40 33C30 14 8 8 6 20s18 16 34 13z" fill="#7ee6c8" stroke="#2f9c7c" stroke-width="2"/>
              <path d="M40 33c10-19 32-25 34-13S56 36 40 33z" fill="#7ee6c8" stroke="#2f9c7c" stroke-width="2"/>
              <path d="M38 35L26 60l8-3 4 7 4-27zM42 35l12 25-8-3-4 7-4-27z" fill="#57d2b0" stroke="#2f9c7c" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="40" cy="33" r="7" fill="#8ff0d4" stroke="#2f9c7c" stroke-width="2"/>
            </svg>
            <div class="label"><small>GIFT CARD</small><strong id="amt">PKR 5,000</strong></div>
            <span class="valid">Valid till Dec 2027</span>
            <div class="strip" role="img" aria-label="Scratch-off strip that hides the gift code">
              <span class="code" id="codeText" aria-hidden="true"></span>
              <canvas id="foil"></canvas>
              <span class="coin" id="coin" aria-hidden="true"></span>
            </div>
          </div>
          <div class="face back" aria-hidden="true">
            <span class="badge"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M6 13.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <small>REDEEMED</small>
            <strong id="backAmt">PKR 0</strong>
            <span>Added to your wallet</span>
          </div>
        </div>
      </div>
    </div>

    <form id="form" novalidate>
      <div class="lbl"><label id="lbl" for="g0">Gift card code</label><span id="left">12 to go</span></div>
      <div class="groups" id="groups" role="group" aria-labelledby="lbl" aria-describedby="hint">
        <span class="grp" style="--i:0"><input id="g0" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="····" aria-label="Code, characters 1 to 4"></span>
        <span class="dash" aria-hidden="true"></span>
        <span class="grp" style="--i:1"><input id="g1" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="····" aria-label="Code, characters 5 to 8"></span>
        <span class="dash" aria-hidden="true"></span>
        <span class="grp" style="--i:2"><input id="g2" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="····" aria-label="Code, characters 9 to 12"></span>
      </div>
      <button type="submit" class="go" id="go"><span class="txt" id="goText">Redeem</span><span class="spin" aria-hidden="true"></span></button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint"><span id="hintText">Scratch the silver strip to see the code ·</span> <button type="button" class="reveal" id="reveal">Reveal it for me</button></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), tilt = $("tilt"), card = $("card"), foil = $("foil"), coin = $("coin");
  const groupsEl = $("groups"), go = $("go"), goText = $("goText"), statusEl = $("status"), revealBtn = $("reveal");
  const inputs = [$("g0"), $("g1"), $("g2")];
  const grps = inputs.map((i) => i.parentElement);
  const G = 4, N = 12;
  const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // no 0/O, 1/I/L mix-ups
  const VALUES = [5000, 2500, 10000];

  let code = "", amount = 5000, cardNo = 0, balance = 1250;
  let state = "idle";   // idle | checking | done
  let revealed = false;
  const used = new Set();

  // ---- Cancellable waits ----
  const CANCEL = { cancelled: true };
  let gen = 0;
  function pause(ms, g, isAnim) {
    const t = isAnim && reduce ? Math.min(ms, 140) : ms;
    return new Promise((ok, no) => setTimeout(() => (g === gen ? ok() : no(CANCEL)), t));
  }
  const quiet = (p) => p.catch((e) => { if (e !== CANCEL) throw e; });
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function say(msg, tone) { statusEl.textContent = msg; statusEl.dataset.tone = tone || ""; restart(statusEl, "pop"); }
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const pretty = (c) => c.slice(0, 4) + "-" + c.slice(4, 8) + "-" + c.slice(8);

  // Rolling numbers
  function roll(el, from, to, dur, g) {
    if (reduce) { el.textContent = fmt(to); return Promise.resolve(); }
    return new Promise((done) => {
      const t0 = performance.now();
      const step = (now) => {
        if (g !== gen) return done();   // a reset happened: stop rolling
        const k = Math.min(1, (now - t0) / dur);
        el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step); else done();
      };
      requestAnimationFrame(step);
    });
  }

  // ---- A fresh card ----
  function newCard() {
    code = "";
    for (let i = 0; i < N; i++) code += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
    amount = VALUES[cardNo++ % VALUES.length];
    $("amt").textContent = fmt(amount);
    $("codeText").textContent = pretty(code);
    revealed = false;
    foil.classList.remove("gone");
    revealBtn.hidden = false;
    $("hintText").textContent = "Scratch the silver strip to see the code ·";
    paintFoil();
  }

  // ---- Scratch-off foil drawn on a canvas ----
  const ctx = foil.getContext("2d");
  let scratched = 0;
  function paintFoil() {
    const r = foil.getBoundingClientRect();
    const w = foil.offsetWidth || r.width, h = foil.offsetHeight || r.height;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    foil.width = Math.max(1, Math.round(w * dpr));
    foil.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    const gr = ctx.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, "#c9ced6"); gr.addColorStop(.42, "#f3f5f8"); gr.addColorStop(.52, "#b4bac3"); gr.addColorStop(1, "#dfe3e8");
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < (w * h) / 14; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,.55)" : "rgba(80,88,100,.16)";
      ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
    }
    ctx.fillStyle = "rgba(70,78,92,.6)";
    ctx.font = "800 11px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("S C R A T C H   H E R E", w / 2, h / 2 + 1);
    for (const x of [16, w - 16]) {   // little stars at both ends
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const a = (k * Math.PI) / 5 - Math.PI / 2, rr = k % 2 ? 2.6 : 6;
        ctx.lineTo(x + Math.cos(a) * rr, h / 2 + Math.sin(a) * rr);
      }
      ctx.fill();
    }
    scratched = 0;
  }
  function scratch(x0, y0, x1, y1) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineCap = "round";
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    if (++scratched % 5 === 0) checkCleared();
  }
  function checkCleared() {
    if (revealed || !foil.width) return;
    const d = ctx.getImageData(0, 0, foil.width, foil.height).data;
    let clear = 0, total = 0;
    for (let i = 3; i < d.length; i += 4 * 9) { total++; if (d[i] < 50) clear++; }
    if (clear / total > 0.5) revealAll();
  }
  function revealAll() {
    if (revealed) return;
    revealed = true;
    foil.classList.add("gone");
    revealBtn.hidden = true;
    $("hintText").textContent = "Code uncovered. Type or paste it into the boxes.";
    coin.classList.remove("on");
    sparkle(foil);
    say("Code revealed: " + pretty(code));
  }

  // Scratching with mouse, pen or finger
  let last = null;
  foil.addEventListener("pointerdown", (e) => {
    if (revealed) return;
    foil.setPointerCapture(e.pointerId);
    last = [e.offsetX, e.offsetY];
    scratch(last[0], last[1], last[0] + 0.1, last[1]);
    tilt.style.transform = "";
  });
  foil.addEventListener("pointermove", (e) => {
    if (!last || revealed) return;
    scratch(last[0], last[1], e.offsetX, e.offsetY);
    last = [e.offsetX, e.offsetY];
  });
  ["pointerup", "pointercancel"].forEach((t) => foil.addEventListener(t, () => { last = null; checkCleared(); }));

  // Gentle tilt toward the pointer
  stage.addEventListener("pointermove", (e) => {
    if (last || state !== "idle") return;
    const r = stage.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
    tilt.style.transform = "rotateY(" + px * 12 + "deg) rotateX(" + -py * 10 + "deg)";
  });
  stage.addEventListener("pointerleave", () => { tilt.style.transform = ""; });

  // Auto-scratch with a coin (demo, and the Reveal button)
  async function coinScratch(g) {
    if (revealed) return;
    const w = foil.offsetWidth, h = foil.offsetHeight;
    coin.classList.add("on");
    let prev = null;
    const steps = reduce ? 6 : 34;
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const x = 10 + (w - 20) * t;
      const y = h / 2 + Math.sin(t * Math.PI * 9) * (h / 2 - 7);
      coin.style.transform = "translate(" + x + "px," + y + "px) rotate(" + t * 540 + "deg)";
      if (prev) scratch(prev[0], prev[1], x, y);
      prev = [x, y];
      await pause(32, g);
    }
    revealAll();
  }
  revealBtn.addEventListener("click", () => quiet(coinScratch(gen)));

  // ---- Three inputs that behave like one 12-character field ----
  const clean = (s) => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const getAll = () => inputs.map((i) => i.value).join("");
  function mark(k) { grps.forEach((gEl, n) => gEl.classList.toggle("cur", n === k && demoOn)); }
  function setAll(str, caret) {
    str = clean(str).slice(0, N);
    inputs.forEach((inp, k) => {
      inp.value = str.slice(k * G, k * G + G);
      grps[k].classList.toggle("full", inp.value.length === G);
    });
    const left = N - str.length;
    $("left").textContent = left ? left + " to go" : "Ready";
    if (caret != null) placeCaret(caret);
  }
  function placeCaret(abs) {
    abs = Math.max(0, Math.min(N, abs));
    const k = Math.min(Math.floor(abs / G), inputs.length - 1);
    const off = Math.min(abs - k * G, inputs[k].value.length);
    mark(k);
    if (!demoOn) { inputs[k].focus(); inputs[k].setSelectionRange(off, off); }
  }
  inputs.forEach((inp, k) => {
    inp.addEventListener("input", () => {
      if (state !== "idle") { setAll(getAll()); return; }
      const pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
      const before = inputs.slice(0, k).map((i) => i.value).join("");
      const after = inputs.slice(k + 1).map((i) => i.value).join("");
      const l = clean(inp.value.slice(0, pos)), r = clean(inp.value.slice(pos));
      setAll(before + l + r + after, before.length + l.length);
      inputs.forEach((i) => i.removeAttribute("aria-invalid"));
    });
    inp.addEventListener("paste", (e) => {
      const text = clean(e.clipboardData ? e.clipboardData.getData("text") : "");
      if (text.length >= N) { e.preventDefault(); if (state === "idle") setAll(text, N); }
      else if (!text) { e.preventDefault(); say("Only letters and numbers can be pasted here.", "bad"); }
    });
    inp.addEventListener("keydown", (e) => {
      if (state !== "idle") return;
      const s = inp.selectionStart, en = inp.selectionEnd, len = inp.value.length;
      const before = inputs.slice(0, k).map((i) => i.value).join("").length;
      if (e.key === "Backspace" && s === 0 && en === 0 && k > 0) {
        e.preventDefault();
        const all = getAll();
        if (before) setAll(all.slice(0, before - 1) + all.slice(before), before - 1);
      } else if (e.key === "Delete" && s === len && en === len && k < inputs.length - 1) {
        e.preventDefault();
        const all = getAll();
        setAll(all.slice(0, before + len) + all.slice(before + len + 1), before + len);
      } else if (e.key === "ArrowLeft" && s === 0 && en === 0 && k > 0) {
        e.preventDefault();
        const p = inputs[k - 1];
        p.focus(); p.setSelectionRange(p.value.length, p.value.length);
      } else if (e.key === "ArrowRight" && s === len && en === len && k < inputs.length - 1) {
        e.preventDefault();
        const nx = inputs[k + 1];
        nx.focus(); nx.setSelectionRange(0, 0);
      }
    });
  });

  // ---- Redeem ----
  async function redeem(g) {
    if (state !== "idle") return;
    const entry = getAll();
    if (entry.length < N) {
      say("The code has 12 letters and numbers. " + (N - entry.length) + " still to go.", "bad");
      restart(groupsEl, "bad");
      await pause(700, g, true);
      groupsEl.classList.remove("bad");
      return;
    }
    state = "checking";
    inputs.forEach((i) => (i.readOnly = true));
    go.classList.add("loading");
    tilt.style.transform = "";
    tilt.classList.add("lean");
    groupsEl.classList.add("scan");
    mark(-1);
    say("Checking the card…");
    await pause(850, g, true);
    go.classList.remove("loading");
    groupsEl.classList.remove("scan");
    tilt.classList.remove("lean");

    if (entry !== code) {
      const again = used.has(entry);
      inputs.forEach((i) => i.setAttribute("aria-invalid", "true"));
      restart(groupsEl, "bad");
      say(again ? "That card was already redeemed. Each card works once." : "We could not find that card. Check the code on the strip.", "bad");
      await pause(900, g, true);
      groupsEl.classList.remove("bad");
      inputs.forEach((i) => (i.readOnly = false));
      state = "idle";
      placeCaret(N);
      return;
    }

    // 1. Groups light up mint one after another
    used.add(entry);
    groupsEl.classList.add("ok");
    revealAll();
    say("Card found. Adding " + fmt(amount) + "…", "good");
    await pause(380, g, true);
    // 2. The card flips over and the amount counts up
    card.classList.add("flipped");
    await pause(420, g, true);
    await roll($("backAmt"), 0, amount, 800, g);
    // 3. A coin flies to the wallet, which rolls up; ribbons burst from the card
    ribbons();
    await flyCoin();
    if (g !== gen) return;
    restart($("wallet"), "bump");
    await roll($("bal"), balance, balance + amount, 900, g);
    if (g !== gen) return;
    balance += amount;
    say(fmt(amount) + " added. Your wallet now has " + fmt(balance) + ".", "good");
    state = "done";
    goText.textContent = "Redeem another card";
    if (!demoOn) go.focus();
  }

  // ---- Next card slides in ----
  async function nextCard(g) {
    state = "checking";
    stage.classList.add("out");
    await pause(450, g, true);
    card.classList.add("snap");
    card.classList.remove("flipped");
    $("backAmt").textContent = "PKR 0";
    groupsEl.classList.remove("ok");
    inputs.forEach((i) => { i.readOnly = false; i.removeAttribute("aria-invalid"); });
    setAll("");
    stage.classList.remove("out");
    void card.offsetWidth;
    card.classList.remove("snap");
    newCard();
    restart(stage, "in");
    goText.textContent = "Redeem";
    state = "idle";
    say("A new gift card is ready. Scratch to see its code.");
    await pause(700, g, true);
    stage.classList.remove("in");
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (state === "done") quiet(nextCard(gen)).then(() => { if (!demoOn) placeCaret(0); });
    else quiet(redeem(gen));
  });

  // ---- Particles ----
  const fx = $("fx");
  function sparkle(el) {
    if (reduce) return;
    const r = el.getBoundingClientRect();
    for (let n = 0; n < 16; n++) {
      const p = document.createElement("i");
      p.style.width = p.style.height = "6px";
      p.style.background = "#fff";
      p.style.borderRadius = "50%";
      p.style.boxShadow = "0 0 8px #fff, 0 0 14px #ffd36b";
      fx.append(p);
      const x = r.left + Math.random() * r.width, y = r.top + Math.random() * r.height;
      p.animate([{ transform: "translate(" + x + "px," + y + "px) scale(0)", opacity: 1 }, { transform: "translate(" + x + "px," + (y - 20 - Math.random() * 20) + "px) scale(1)", opacity: 1, offset: 0.4 }, { transform: "translate(" + x + "px," + (y - 40) + "px) scale(0)", opacity: 0 }],
        { duration: 800 + Math.random() * 500, delay: Math.random() * 300, fill: "both" }).onfinish = () => p.remove();
    }
  }
  function ribbons() {
    if (reduce) return;
    const r = stage.getBoundingClientRect();
    const COLORS = ["#ff6f61", "#57d2b0", "#ffd36b", "#a23b8f", "#ffffff", "#8ff0d4"];
    for (let n = 0; n < 46; n++) {
      const p = document.createElement("i");
      p.style.width = 4 + Math.random() * 3 + "px";
      p.style.height = 12 + Math.random() * 14 + "px";
      p.style.borderRadius = "3px";
      p.style.background = COLORS[n % COLORS.length];
      fx.append(p);
      const x0 = r.left + r.width / 2 + (Math.random() - 0.5) * r.width * 0.6, y0 = r.top + r.height / 2;
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, d = 90 + Math.random() * 170;
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d, spin = (Math.random() - 0.5) * 1000;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) rotate(0) scale(.4)", opacity: 1 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + dy) + "px) rotate(" + spin / 2 + "deg) rotateX(180deg)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (x0 + dx * 1.2) + "px," + (y0 + dy + 200) + "px) rotate(" + spin + "deg) rotateX(540deg)", opacity: 0 }
      ], { duration: 1700 + Math.random() * 900, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => p.remove();
    }
  }
  function flyCoin() {
    const a = $("backAmt").getBoundingClientRect(), b = $("wallet").querySelector(".ic").getBoundingClientRect();
    if (reduce) return Promise.resolve();
    const c = document.createElement("span");
    c.className = "flycoin";
    c.textContent = "PKR";
    fx.append(c);
    const x0 = a.left + a.width / 2 - 15, y0 = a.top + a.height / 2 - 15, x1 = b.left + b.width / 2 - 15, y1 = b.top + b.height / 2 - 15;
    const mx = (x0 + x1) / 2 + 60, my = Math.min(y0, y1) - 70;
    const anim = c.animate([
      { transform: "translate(" + x0 + "px," + y0 + "px) scale(.4)" },
      { transform: "translate(" + x0 + "px," + (y0 - 14) + "px) scale(1.2)", offset: 0.18 },
      { transform: "translate(" + mx + "px," + my + "px) scale(1) rotateY(360deg)", offset: 0.6 },
      { transform: "translate(" + x1 + "px," + y1 + "px) scale(.5) rotateY(720deg)" }
    ], { duration: 900, easing: "cubic-bezier(.45,0,.3,1)", fill: "forwards" });
    return anim.finished.then(() => c.remove());
  }

  // ---- Instant reset when a real person takes over ----
  function hardReset() {
    gen++;
    state = "idle";
    stage.classList.remove("out", "in");
    tilt.classList.remove("lean");
    go.classList.remove("loading", "press");
    groupsEl.classList.remove("scan", "ok", "bad");
    card.classList.add("snap");
    card.classList.remove("flipped");
    void card.offsetWidth;
    card.classList.remove("snap");
    $("backAmt").textContent = "PKR 0";
    inputs.forEach((i) => { i.readOnly = false; i.removeAttribute("aria-invalid"); });
    goText.textContent = "Redeem";
    coin.classList.remove("on");
    $("bal").textContent = fmt(balance);
    setAll("");
    mark(-1);
    newCard();
    say("");
  }

  // ---- Auto-demo: a coin scratches the strip, the code is typed and redeemed ----
  let demoOn = true, demoTimer = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); hardReset(); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) =>
    window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));

  async function runDemo() {
    const g = gen;
    if (balance > 40000) { balance = 1250; $("bal").textContent = fmt(balance); }   // keep the demo wallet tidy
    await coinScratch(g);
    await pause(500, g);
    for (let i = 1; i <= N; i++) { setAll(code.slice(0, i), i); await pause(70, g); }
    await pause(300, g);
    go.classList.add("press");
    await pause(150, g);
    go.classList.remove("press");
    await redeem(g);
    await pause(2300, g);
    await nextCard(g);
    demoTimer = setTimeout(() => quiet(runDemo()), 1600);
  }

  newCard();
  window.addEventListener("resize", () => { if (!revealed) paintFoil(); });
  demoTimer = setTimeout(() => quiet(runDemo()), 350);
})();
</script>
</body>
</html>
