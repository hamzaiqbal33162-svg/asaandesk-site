<script>
  /* Theme first, so there is no flash: ?theme=light|dark wins, then the system setting */
  (function () { var q = new URLSearchParams(location.search).get("theme"); document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; })();

<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }
  .note[hidden] { display: none; }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Darzi Desk look: ivory cloth, indigo sidebar, maroon and gold thread ======================= */
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --bg: #f5efe3; --surface: #fffcf6; --surface2: #f1e7d6; --field: #fffaf1; --ink: #2a2236; --mut: #776c7c; --line: #e4d7c1;
    --acc: #8e1c3e; --acc-ink: #fff; --gold: #a8761f; --indigo: #222852; --side-ink: #e9e3f5;
    --ok: #2d7a4c; --warn: #b0650a; --bad: #c0392b; --tape: #f0cd62; --tape-ink: #5b4210;
    --c1: #8e1c3e; --c2: #3b4796; --c3: #c99633; --c4: #2d7a4c; --c5: #7a5aa6;
    --weave: rgba(120, 88, 40, .05); --rb: 10px; --rm: 18px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #16131b; --surface: #211d28; --surface2: #2c2735; --field: #1b1822; --ink: #f2eadf; --mut: #a99fb0; --line: #3a3345;
    --acc: #e8678a; --acc-ink: #22101a; --gold: #e3b45e; --indigo: #0d0f26; --side-ink: #ddd6ee;
    --ok: #5cc28a; --warn: #f0a63a; --bad: #ff6b5e; --tape: #d9b44d; --tape-ink: #3d2c07;
    --c1: #e8678a; --c2: #8e9cff; --c3: #e3b45e; --c4: #5cc28a; --c5: #b796ec;
    --weave: rgba(255, 240, 220, .022); --toast: #2c2735;
    color-scheme: dark;
  }
  body { background-color: var(--bg); background-image: repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, var(--weave) 0 2px, transparent 2px 7px); }
  h1, h2, h3 { font-family: var(--serif); font-weight: 700; letter-spacing: -.01em; }
  h3 { margin: 0 0 10px; font-size: 17px; }
  .app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar with a stitched edge and a sliding gold marker */
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--indigo); color: var(--side-ink); display: flex; flex-direction: column; padding: 18px 16px 16px 14px; z-index: 60; }
  .side::after { content: ""; position: absolute; top: 12px; bottom: 12px; right: 6px; border-right: 2px dashed color-mix(in srgb, var(--gold) 55%, transparent); pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; padding: 4px 6px 20px; }
  .brand svg { flex: none; }
  .brand b { font-family: var(--serif); font-size: 20px; display: block; line-height: 1.1; }
  .brand small { opacity: .62; font-size: 11.5px; }
  .nav { position: relative; display: flex; flex-direction: column; gap: 3px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: color-mix(in srgb, var(--side-ink) 72%, transparent); text-decoration: none; font-weight: 600; transition: color .2s, transform .2s; }
  .nav a:hover { color: #fff; transform: translateX(2px); }
  .nav a[aria-current="page"] { color: #fff; }
  .nav .marker { position: absolute; left: 0; right: 0; top: 0; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, .09); transition: transform .5s cubic-bezier(.3, 1.35, .4, 1), height .3s, opacity .3s; opacity: 0; }
  .nav .marker::before { content: ""; position: absolute; left: -3px; top: 9px; bottom: 9px; width: 4px; border-radius: 4px; background: var(--gold); box-shadow: 0 0 12px var(--gold); }
  .side-card { margin-top: auto; padding: 14px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px dashed rgba(255, 255, 255, .18); display: grid; gap: 4px; }
  .side-card small { opacity: .7; font-size: 11.5px; }
  .side-card b { font-family: var(--serif); font-size: 22px; }
  .thread { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 4px; }
  .thread i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--gold), var(--acc)); animation: ccW 1.6s .3s cubic-bezier(.2, .9, .25, 1) backwards; }
  .scrim { display: none; }

  /* Top bar */
  .main { min-width: 0; overflow-x: clip; }
  .top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top h2 { margin: 0; font-size: 21px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srch { display: inline-flex; align-items: center; gap: 8px; min-width: 220px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--mut); transition: border-color .2s; }
  .srch:hover { border-color: var(--gold); }
  .srch kbd { margin-left: auto; font: 600 11px/1 var(--font, system-ui); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface2); }
  .menu-btn { display: none !important; }
  .view { padding: 22px 24px 44px; display: grid; gap: 16px; max-width: 1380px; }

  /* Cards: cloth panels with an inner running stitch */
  .card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 12px 26px -20px rgba(70, 35, 10, .45); transition: transform .28s cubic-bezier(.2, .8, .2, 1), box-shadow .28s; min-width: 0; }
  .card::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed color-mix(in srgb, var(--gold) 34%, transparent); border-radius: 12px; pointer-events: none; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 20px 36px -22px rgba(70, 35, 10, .55); }
  .in { animation: unfold .62s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i) * 65ms); transform-origin: 50% 0; }
  @keyframes unfold { from { opacity: 0; transform: perspective(900px) rotateX(-14deg) translateY(18px); } }
  .ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .ph h1 { margin: 0; font-size: 27px; }
  .ph p { margin: 4px 0 0; }
  .g { display: grid; gap: 16px; }
  .k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .c21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ch-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ch-h h3 { margin: 0; }
  .ch-h p { margin: 2px 0 0; font-size: 12.5px; }
  .btn.wide { width: 100%; margin: 6px 0 12px; }
  .ibtn.sm { width: 30px; height: 30px; }
  .ibtn.sm .ic { width: 15px; height: 15px; }
  .av.lg { width: 46px; height: 46px; font-size: 15px; }
  .danger-t { color: var(--bad); }
  .due-amt { color: var(--acc); }
  .who { display: flex; align-items: center; gap: 9px; }
  .who > span:last-child { display: grid; line-height: 1.25; }
  .who small { color: var(--mut); font-size: 11.5px; }

  /* KPI cards */
  .kpi { display: grid; gap: 3px; padding: 16px 16px 12px; }
  .kpi .lab { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .kpi .lab .ic { width: 28px; height: 28px; padding: 6px; border-radius: 50%; background: color-mix(in srgb, var(--acc) 12%, transparent); color: var(--acc); }
  .kpi .val { font-family: var(--serif); font-size: 29px; line-height: 1.15; }
  .kpi .sub { font-size: 12px; color: var(--mut); }
  .spk { height: 34px; margin-top: 2px; }

  /* Signature: the tape measure that unrolls across the hero */
  .hero { padding: 0; overflow: hidden; }
  .hero::after { inset: 36px 5px 5px; }
  .tape { position: relative; height: 31px; overflow: hidden; border-bottom: 1px solid color-mix(in srgb, var(--tape-ink) 25%, transparent); }
  .tape-strip { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--tape-ink) 0 1.5px, transparent 1.5px 40px) 0 0 / 100% 13px no-repeat, repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 20px) 0 0 / 100% 9px no-repeat, repeating-linear-gradient(90deg, color-mix(in srgb, var(--tape-ink) 65%, transparent) 0 1px, transparent 1px 5px) 0 0 / 100% 5px no-repeat, var(--tape); animation: unroll 1.8s cubic-bezier(.55, .1, .25, 1) backwards; }
  .tape-strip span { position: absolute; top: 15px; font: 700 10px/1 system-ui, sans-serif; color: var(--tape-ink); }
  .spool { position: absolute; top: -3px; left: calc(100% - 44px); width: 37px; height: 37px; border-radius: 50%; background: radial-gradient(circle, var(--surface) 0 5px, var(--acc) 5px 9px, var(--gold) 9px 100%); box-shadow: 0 3px 8px rgba(0, 0, 0, .28); animation: spool 1.8s cubic-bezier(.55, .1, .25, 1) backwards; }
  .spool::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, .7); }
  @keyframes unroll { from { clip-path: inset(0 100% 0 0); } }
  @keyframes spool { from { left: 4px; transform: rotate(-1080deg); } }
  .hero-in { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 18px 22px 20px; flex-wrap: wrap; }
  .hero h1 { margin: 2px 0 4px; font-size: 31px; }
  .hero p { margin: 0; }
  .eyebrow { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .13em; color: var(--gold); font-weight: 750; }
  .eid { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--indigo); color: #f4ecff; text-align: left; border: 0; transition: transform .2s; }
  .eid:hover { transform: translateY(-2px); }
  .eid b { display: block; font-family: var(--serif); font-size: 17px; }
  .eid small { opacity: .75; font-size: 12px; }
  .moon .star { transform-origin: 30px 15px; animation: twinkle 2.4s ease-in-out 3; }
  @keyframes twinkle { 50% { transform: scale(.55) rotate(30deg); opacity: .5; } }

  /* Lists */
  .due-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .due-i { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid transparent; background: none; padding: 7px 8px; border-radius: 12px; transition: background .2s, border-color .2s, transform .18s; }
  .due-i:hover { background: var(--surface2); border-color: var(--line); transform: translateX(3px); }
  .dd { display: grid; place-items: center; align-content: center; width: 44px; height: 44px; border-radius: 12px; background: var(--surface2); line-height: 1.05; flex: none; }
  .dd b { font-family: var(--serif); font-size: 18px; }
  .dd small { font-size: 10px; text-transform: uppercase; color: var(--mut); }
  .due-i > span:nth-child(2) { flex: 1; min-width: 0; display: grid; }
  .due-i small { color: var(--mut); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eidc { display: grid; gap: 10px; align-content: start; }
  .eid-ring { display: flex; align-items: center; gap: 14px; }
  .eid-ring .big { font-family: var(--serif); font-size: 26px; display: block; }

  /* Stage colours */
  .st-received { background: color-mix(in srgb, var(--mut) 18%, transparent); color: var(--mut); }
  .st-cutting { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }
  .st-stitching { background: color-mix(in srgb, var(--c2) 17%, transparent); color: var(--c2); }
  .st-finishing { background: color-mix(in srgb, var(--c5) 18%, transparent); color: var(--c5); }
  .st-ready { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .st-delivered { background: var(--surface2); color: var(--mut); }

  /* Drawers: order and customer */
  .cd-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cd-top > div { flex: 1; min-width: 0; }
  .cd-top b { font-size: 16px; }
  .stepper { list-style: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 0 0 8px; padding: 0; counter-reset: s; }
  .stepper li { position: relative; }
  .stepper button { width: 100%; border: 0; background: none; padding: 26px 0 0; font-size: 10.5px; font-weight: 650; color: var(--mut); position: relative; }
  .stepper button::before { counter-increment: s; content: counter(s); position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); border: 2px solid var(--line); font-size: 11px; transition: background .3s, border-color .3s, transform .3s; }
  .stepper li:not(:last-child)::after { content: ""; position: absolute; top: 11px; left: calc(50% + 13px); right: calc(-50% + 11px); border-top: 2px dashed var(--line); }
  .stepper li.done button::before { content: "\2713"; background: var(--ok); border-color: var(--ok); color: #fff; }
  .stepper li.done::after { border-top-style: solid; border-color: var(--ok); }
  .stepper li.now button { color: var(--ink); }
  .stepper li.now button::before { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); transform: translateX(-50%) scale(1.15); }
  .facts { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 10px 0 14px; font-size: 13.5px; }
  .facts dt { color: var(--mut); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .money div { padding: 10px; border-radius: 12px; background: var(--surface2); display: grid; }
  .money small { color: var(--mut); font-size: 11.5px; }
  .money b { font-family: var(--serif); font-size: 17px; }
  .mwrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; margin: 10px 0 18px; align-items: start; }
  .figbox { background: var(--surface2); border-radius: 14px; padding: 8px; display: grid; place-items: center; }
  .fig { width: 100%; max-width: 200px; height: auto; }
  .fig .fd { fill: color-mix(in srgb, var(--acc) 8%, transparent); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; opacity: .2; transition: opacity .35s; }
  .fig.mode-Kameez .k, .fig.mode-Shalwar .s, .fig.mode-Waistcoat .w { opacity: 1; }
  .fig .fd.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.6s ease forwards; }
  .fig .ml path { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-dasharray: 4 3; opacity: .45; transition: opacity .2s, stroke-width .2s; }
  .fig .ml path.on { opacity: 1; stroke: var(--acc); stroke-width: 3; stroke-dasharray: none; animation: mpulse .8s ease-in-out 4 alternate; }
  .fig .mlab { fill: var(--acc); font-weight: 700; font-size: 14px; }
  @keyframes mpulse { to { stroke-width: 5; } }
  .chk { display: flex !important; align-items: center; gap: 8px; color: var(--ink) !important; font-size: 13px !important; padding-top: 24px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--acc); }
  .qchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .qchips button { border: 1px dashed var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; transition: background .2s, transform .12s; }
  .qchips button:hover { background: var(--surface2); }
  .qchips button:active { transform: scale(.94); }
  .newc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface2); }
  .newc[hidden] { display: none; }

  /* Order slip */
  .slip { background: #fffdf5; color: #2a2236; border-radius: 12px; padding: 16px; border: 1px solid #e7dcc6; font-size: 13px; position: relative; }
  .slip-h { text-align: center; border-bottom: 2px dashed #c9b893; padding-bottom: 10px; margin-bottom: 10px; }
  .slip-h b { font-family: var(--serif); font-size: 20px; display: block; }
  .slip-r { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .slip-cut { margin-top: 12px; text-align: center; font-size: 11px; color: #8a7d64; border-top: 2px dashed #c9b893; padding-top: 6px; letter-spacing: .1em; text-transform: uppercase; }
  .slip .mm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .slip .mm span { background: #f3ead8; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; }

  /* Customers */
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .ccard { text-align: left; display: grid; gap: 8px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); transition: transform .22s, box-shadow .22s, border-color .22s; min-width: 0; }
  .ccard:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 14px 24px -18px rgba(0, 0, 0, .5); }
  .ccard .mm { display: flex; gap: 5px; flex-wrap: wrap; }
  .ccard .mm span { font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: var(--surface2); }
  .olist { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 4px; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cal-m { font-family: var(--serif); font-size: 18px; min-width: 150px; text-align: center; }
  .cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--mut); margin-bottom: 10px; }
  .cal-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -3px; margin-right: 5px; border: 1px solid var(--line); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .wd { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); text-align: center; }
  .day { position: relative; min-height: 96px; border-radius: 12px; border: 1px solid var(--line); padding: 4px 5px 10px; display: flex; flex-direction: column; gap: 3px; background-color: color-mix(in srgb, var(--acc) var(--heat, 0%), var(--field)); transition: border-color .2s, box-shadow .2s, transform .2s; overflow: hidden; min-width: 0; }
  .day.pad { background: transparent; border-style: dashed; opacity: .35; }
  .day.today { box-shadow: inset 0 0 0 2px var(--gold); }
  .day.sel { border-color: var(--acc); }
  .day.rush { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--gold) 24%, transparent) 0 6px, transparent 6px 12px); }
  .day.busy { border-color: var(--bad); }
  .day.eidday { background: var(--indigo); color: #fff; border-color: var(--gold); }
  .day.over { transform: scale(1.04); box-shadow: 0 0 0 2px var(--acc), 0 10px 22px -10px rgba(0, 0, 0, .4); z-index: 2; }
  .dtop { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
  .dnum { border: 0; background: none; font-weight: 700; padding: 2px 6px; border-radius: 7px; font-size: 13px; color: inherit; }
  .dnum[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }
  .och { display: block; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; touch-action: none; user-select: none; }
  .och:focus-visible { outline-offset: 0; }
  .more, .cnt { font-size: 10.5px; color: inherit; opacity: .7; padding-left: 4px; }
  .cnt { display: none; }
  .lbar { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
  .lbar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--gold); border-radius: inherit; }
  .day.busy .lbar::after { background: var(--bad); }
  .day-panel h3 { margin-bottom: 2px; }
  .drow { display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); cursor: grab; touch-action: none; user-select: none; margin-top: 8px; transition: transform .2s, box-shadow .2s; }
  .drow:hover { transform: translateY(-2px); box-shadow: 0 10px 18px -14px rgba(0, 0, 0, .5); }
  .drow > span { flex: 1; min-width: 0; display: grid; }
  .drow small { color: var(--mut); font-size: 11.5px; }
  .dragging { opacity: .3; }
  .ghost { box-shadow: 0 18px 34px rgba(0, 0, 0, .32) !important; opacity: .96; }

  /* Karigars */
  .kgrid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .kar { display: grid; gap: 12px; }
  .kar .who b { font-size: 15px; }
  .kar-ring { display: flex; align-items: center; gap: 12px; }
  .kar-ring b { font-family: var(--serif); font-size: 20px; display: block; }
  .kar dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 0; font-size: 12.5px; }
  .kar dt { color: var(--mut); }
  .kar dd { margin: 0; font-weight: 650; text-align: right; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 12px; overflow-x: auto; padding: 4px 2px 8px; }
  .col { background: var(--surface2); border-radius: 14px; padding: 10px; min-height: 220px; display: flex; flex-direction: column; gap: 8px; transition: background .2s, box-shadow .2s; min-width: 0; }
  .col.over { background: color-mix(in srgb, var(--acc) 12%, var(--surface2)); box-shadow: inset 0 0 0 2px var(--acc); }
  .col header { display: grid; gap: 4px; padding: 2px 2px 4px; }
  .col header small { color: var(--mut); font-size: 11.5px; }
  .cap { height: 5px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
  .cap i { display: block; height: 100%; width: var(--w); background: var(--gold); border-radius: inherit; transition: width .5s; }
  .cap.full i { background: var(--bad); }
  .kc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 3px; cursor: grab; touch-action: none; user-select: none; transition: transform .2s, box-shadow .2s; font-size: 13px; }
  .kc:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -14px rgba(0, 0, 0, .5); }
  .kc .mut { font-size: 12px; }
  .col-empty { border: 2px dashed var(--line); border-radius: 12px; padding: 18px 8px; text-align: center; color: var(--mut); font-size: 12px; }

  /* Settings */
  .set-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .pricegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

  /* Responsive: drawer sidebar under 900px, single columns on phones */
  @media (max-width: 1100px) { .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cal-wrap { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; left: 0; top: 0; bottom: 0; width: 266px; transform: translateX(-105%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); }
    body.nav-open .side { transform: none; box-shadow: 24px 0 60px rgba(0, 0, 0, .35); }
    .scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(10, 8, 20, .45); opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.nav-open .scrim { opacity: 1; pointer-events: auto; }
    .menu-btn { display: inline-grid !important; }
    .c21, .c3, .c2 { grid-template-columns: minmax(0, 1fr); }
    .mwrap { grid-template-columns: 1fr; }
    .figbox { max-width: 220px; margin: 0 auto; width: 100%; }
  }
  @media (max-width: 640px) {
    .top { padding: 10px 14px; gap: 8px; }
    .view { padding: 16px 14px 34px; }
    .srch { min-width: 0; padding: 9px; }
    .srch span, .srch kbd, .top .btn.pri span { display: none; }
    .top .btn.pri { padding: .55em .7em; }
    .hero h1 { font-size: 24px; }
    .kpi .val { font-size: 22px; }
    .kpi { padding: 14px 12px 10px; }
    .day { min-height: 52px; padding: 3px 3px 8px; }
    .och, .more { display: none; }
    .cnt { display: block; }
    .dnum { padding: 2px 3px; font-size: 12px; }
    .cal { gap: 3px; }
    .money b { font-size: 14px; }
    .facts { grid-template-columns: 92px 1fr; }
    .newc { grid-template-columns: 1fr; }
  }
  @media print {
    body > *:not(.ov) { display: none !important; }
    .ov { position: static; background: none; backdrop-filter: none; padding: 0; }
    .modal { box-shadow: none; transform: none; max-height: none; }
    .m-h button, .m-f { display: none !important; }
  }
</style>

<body>

<script>
/* ======================= Shared kit (same in every Chill & Craft dashboard) ======================= */
"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */
let _seed = 1;
const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */

  f: ["Ayesha", "Fatima", "Sana", "Hira", "Maryam", "Zainab", "Amna", "Mahnoor", "Rabia", "Iqra", "Sadia", "Noor", "Kiran", "Saba", "Anum", "Mehwish", "Hina", "Uzma", "Bushra", "Nida", "Laiba", "Areeba"],
  last: ["Khan", "Malik", "Butt", "Qureshi", "Sheikh", "Chaudhry", "Abbasi", "Siddiqui", "Mirza", "Raza", "Awan", "Javed", "Rana", "Baig", "Hashmi", "Gondal", "Shah", "Memon", "Baloch", "Niazi", "Ansari", "Jutt", "Kazmi", "Bhatti"],

};
const pname = (g) => pick(g === "f" ? PK.f : g === "m" ? PK.m : rnd() < 0.5 ? PK.f : PK.m) + " " + pick(PK.last);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + ri(1000000, 9999999);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

/* ---------- Number formats: Rs 12,500 · 1.2M · $1,240 ---------- */
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = (n) => (n < 0 ? "-" : "") + "Rs " + num(Math.abs(n));
const short = (n) => { const a = Math.abs(+n || 0), s = n < 0 ? "-" : "", f = (v, u) => s + (v >= 100 ? Math.round(v) : +v.toFixed(1)) + u; return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + (a % 1 ? +a.toFixed(1) : a); };
const rss = (n) => (n < 0 ? "-" : "") + "Rs " + short(Math.abs(n));
const usd = (n, d = 0) => (n < 0 ? "-$" : "$") + num(Math.abs(n), d);
const pct = (n, d = 0) => num(n, d) + "%";
const FMT = { num: (v) => num(v), rs, rss, short, usd, usd2: (v) => usd(v, 2), pct: (v) => pct(v, 1), pct0: (v) => pct(v) };

/* ---------- Dates (local, no time zone surprises) ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = pd(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
/* Add months but keep the day (31 Jan + 1 month = 28 or 29 Feb) */
const addMK = (d, n) => { const x = addM(d, n), day = pd(d).getDate(), last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const pd = (s) => { if (s instanceof Date) return new Date(s); const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fd = (s) => { const d = pd(s); return d.getDate() + " " + MON[d.getMonth()]; };
const fdy = (s) => { const d = pd(s); return fd(d) + " " + d.getFullYear(); };
const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const TODAY = iso(today());
const lastMonths = (n) => Array.from({ length: n }, (_, i) => iso(addM(today(), i - n + 1)).slice(0, 7));
const mName = (k) => MON[+String(k).slice(5, 7) - 1];

/* ---------- Icons (simple stroked shapes on a 24 grid) ---------- */
const IC = {

  user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",
  cal: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",
  chart: "M4 20V10M10 20V4M16 20v-7M22 20H2",
  cog: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1",
  plus: "M12 5v14M5 12h14",
  search: "M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5",

  moon: "M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z",
  menu: "M3 6h18M3 12h18M3 18h18",

  edit: "M4 20h4L19 9l-4-4L4 16zM14 6l4 4",
  check: "M5 12l5 5 9-10",

  truck: "M2 6h11v10H2zM13 9h4l4 4v3h-8M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",

  right: "M9 6l6 6-6 6",
  drop: "M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z",
  dots: "M5 12h.01M12 12h.01M19 12h.01",
  coins: "M12 8c4.4 0 8-1.3 8-3s-3.6-3-8-3-8 1.3-8 3 3.6 3 8 3zM4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6",
  box: "M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10",
  heart: "M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z",
  move: "M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4",
  refresh: "M20 11a8 8 0 0 0-14-5L4 8M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2M20 20v-4h-4",
  pulse: "M3 12h4l2-6 4 12 2-6h6",
  shield: "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",
  gauge: "M4 18a8 8 0 1 1 16 0M12 18l4-6",

};
const ico = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n] || IC.dots}"/></svg>`;

/* ---------- Saved state: localStorage when allowed, memory otherwise ---------- */
const Store = {
  key: "", make: null, ver: 1,
  load(key, make, ver = 1) { this.key = key; this.make = make; this.ver = ver; let d = null; try { d = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { d = null; } return d && d._v === ver ? d : make(); },
  save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) { /* storage blocked: keep going in memory */ } },
  reset() { try { localStorage.removeItem(this.key); } catch (e) {} return this.make(); },
};

/* ---------- Theme: ?theme=light|dark wins, then the system setting ---------- */
const Theme = {
  fixed: false, user: false,
  init() {
    const q = new URLSearchParams(location.search).get("theme");
    this.fixed = q === "light" || q === "dark";
    const mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)");
    this.set(this.fixed ? q : mq && mq.matches ? "dark" : "light", true);
    if (mq && mq.addEventListener) mq.addEventListener("change", (e) => { if (!this.fixed && !this.user) this.set(e.matches ? "dark" : "light"); });
  },
  cur: () => document.documentElement.dataset.theme,
  set(t, quiet) {
    document.documentElement.dataset.theme = t;
    $$("[data-theme-toggle]").forEach((b) => { b.setAttribute("aria-pressed", String(t === "dark")); b.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme"); b.innerHTML = ico(t === "dark" ? "sun" : "moon"); });
    if (!quiet) { redrawCharts(); APP.onTheme && APP.onTheme(t); }
  },
  toggle() { this.user = true; this.set(this.cur() === "dark" ? "light" : "dark"); },
};

/* ---------- Timers that pause while the tab is hidden ---------- */
const Live = {
  list: [],
  every(ms, fn, keep) { const t = { ms, fn, keep, id: 0 }; this.list.push(t); if (!document.hidden) t.id = setInterval(fn, ms); return t; },
  clear() { this.list = this.list.filter((t) => { if (t.keep) return true; clearInterval(t.id); return false; }); },
  pause() { this.list.forEach((t) => { clearInterval(t.id); t.id = 0; }); },
  resume() { this.list.forEach((t) => { if (!t.id) t.id = setInterval(t.fn, t.ms); }); },
};
document.addEventListener("visibilitychange", () => (document.hidden ? Live.pause() : Live.resume()));

/* ---------- Hash router: #/page or #/page/arg, back button works ---------- */
const Router = {
  pages: {}, order: [], def: "", cur: "", arg: null,
  add(id, title, render) { this.pages[id] = { id, title, render }; this.order.push(id); this.def = this.def || id; },
  go(id) { location.hash = "#/" + id; },
  run(first) {
    const m = location.hash.match(/^#\/([\w-]+)(?:\/(.*))?$/);
    const id = m && this.pages[m[1]] ? m[1] : this.def, p = this.pages[id], old = $("#view"), view = old.cloneNode(false);
    old.replaceWith(view); /* a fresh node drops every listener the last page added */
    this.cur = id; this.arg = m && m[2] ? decodeURIComponent(m[2]) : null;
    CHARTS.length = 0; Live.clear(); closePop(); untip();
    view.className = "view pg-" + id;
    p.render(view, this.arg);
    $$("[data-nav] a").forEach((a) => (a.getAttribute("href") === "#/" + id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    moveMarker();
    document.title = p.title + " · " + APP.name;
    $$("[data-page-title]").forEach((x) => (x.textContent = p.title));
    enter(view); countAll(view);
    document.body.classList.remove("nav-open");
    $$("[data-menu]").forEach((b) => b.setAttribute("aria-expanded", "false"));
    if (!first) { const sc = $("#main"); if (sc) sc.scrollTop = 0; if (document.scrollingElement) document.scrollingElement.scrollTop = 0; view.focus({ preventScroll: true }); }
    Bell.badge();
    APP.onRoute && APP.onRoute(id);
  },
  /* Re-draw the current page after data changes, keeping the scroll spot */
  soft() {
    const sc = document.scrollingElement, y = sc ? sc.scrollTop : 0, old = $("#view"), view = old.cloneNode(false);
    old.replaceWith(view);
    CHARTS.length = 0; Live.clear(); closePop(); untip();
    this.pages[this.cur].render(view, this.arg);
    $$("[data-count]", view).forEach((e) => (e.dataset.done = 1));
    if (sc) sc.scrollTop = y;
    Bell.badge();
  },
};

/* Sliding marker under the active nav link (vertical or horizontal nav) */
function moveMarker() {
  $$("[data-nav]").forEach((nav) => {
    const mk = $(".marker", nav), a = $('a[aria-current="page"]', nav);
    if (!mk) return;
    if (!a) { mk.style.opacity = 0; return; }
    const nr = nav.getBoundingClientRect(), ar = a.getBoundingClientRect();
    mk.style.opacity = 1;
    if (nav.dataset.nav === "x") { mk.style.transform = `translateX(${ar.left - nr.left + nav.scrollLeft}px)`; mk.style.width = ar.width + "px"; }
    else { mk.style.transform = `translateY(${ar.top - nr.top + nav.scrollTop}px)`; mk.style.height = ar.height + "px"; }
  });
}

/* Staggered entrance for cards on each page change */
function enter(root) { if (RM) return; $$(".card,[data-in]", root).forEach((el, i) => { el.style.setProperty("--i", Math.min(i, 14)); el.classList.add("in"); }); }

/* Numbers that count up: <b data-count="1250" data-fmt="rs"> */
function countUp(el, to, f) {
  f = f || FMT[el.dataset.fmt] || ((v) => num(v)); to = to ?? +el.dataset.count; el.dataset.done = 1;
  if (RM || !isFinite(to)) { el.textContent = f(to); return; }
  const from = +(el.dataset.from || 0), t0 = performance.now(), dur = +(el.dataset.dur || 950);
  el.textContent = f(from);
  const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = f(p < 1 ? from + (to - from) * e : to); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function countAll(root) { $$("[data-count]", root).forEach((el) => { if (!el.dataset.done) countUp(el); }); }
const cnt = (v, f = "num") => `<span data-count="${v}" data-fmt="${f}">${esc((FMT[f] || FMT.num)(v))}</span>`;

/* ---------- Toasts (aria-live) ---------- */
function toast(msg, o = {}) {
  let box = $("#toasts"); const t = document.createElement("div");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; box.setAttribute("aria-live", "polite"); document.body.append(box); }
  t.className = "toast " + (o.type || "ok");
  t.innerHTML = `<span class="ti"></span><span>${esc(msg)}</span>${o.undo ? '<button type="button" class="tbtn">Undo</button>' : ""}`;
  const kill = () => { t.classList.add("out"); setTimeout(() => t.remove(), RM ? 0 : 300); };
  if (o.undo) $(".tbtn", t).onclick = () => { o.undo(); kill(); };
  box.append(t);
  setTimeout(kill, o.ms || (o.undo ? 5000 : 3200));
}

/* ---------- Modal and drawer: focus trap, Esc, backdrop click ---------- */
const Modals = [];
function modal(o) {
  const back = document.activeElement, ov = document.createElement("div"), hid = uid("m");
  ov.className = "ov" + (o.drawer ? " as-drawer" : "");
  const inner = o.onSubmit
    ? `<form class="m-b" novalidate>${o.body}<div class="m-f">${o.left || ""}<button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn pri">${esc(o.submit || "Save")}</button></div></form>`
    : `<div class="m-b">${o.body}${o.foot ? `<div class="m-f">${o.foot}</div>` : ""}</div>`;
  ov.innerHTML = `<div class="${o.drawer ? "drawer" : "modal"} ${o.cls || ""}" role="dialog" aria-modal="true" aria-labelledby="${hid}"><div class="m-h"><h2 id="${hid}">${esc(o.title)}</h2><button type="button" class="m-x" aria-label="Close">${ico("x")}</button></div>${inner}</div>`;
  document.body.append(ov);
  const box = ov.firstElementChild;
  let closed = false;
  const api = { el: box, ov, close };
  Modals.push(api);
  function close(ok) {
    if (closed) return; closed = true;
    Modals.splice(Modals.indexOf(api), 1);
    document.removeEventListener("keydown", key, true);
    closePop(); untip();

/* Warnings for a delivery date: Eid rush, busy day, short time */

/* New or edit order, with live Eid rush and busy-day warnings */
function orderForm(o, preCust) {
  const isNew = !o;
  const base = o || { cust: preCust || "", garment: "Shalwar Kameez", qty: 2, fabric: "Wash & Wear", own: true, notes: "", due: iso(addD(today(), 8)), kar: "", urgent: false, price: 0 };
  const priceFor = (g, q, own, urg) => (S.set.prices[g] + (own ? 0 : S.set.fabric)) * q + (urg ? S.set.urgent : 0);
  let manual = !isNew;
  const nid = uid("notes");
  modal({
    title: isNew ? "New order" : "Edit " + o.id, cls: "wide", submit: isNew ? "Book order" : "Save changes",
    body: `<div class="fgrid">
      ${fld("Customer", "cust", { opts: [["", "Choose a customer…"], ["__new", "+ New customer"], ...S.cust.map((c) => [c.id, c.name + " · " + c.phone])], value: base.cust })}
      ${fld("Garment", "garment", { opts: Object.keys(GAR), value: base.garment })}
      <div class="span newc" hidden>${fld("New customer name", "nname", { ph: "e.g. Bilal Qureshi" })}${fld("Mobile", "nphone", { ph: "0300-1234567", type: "tel" })}</div>
      ${fld("Quantity (suits)", "qty", { type: "number", value: base.qty, min: 1, max: 20 })}
      ${fld("Fabric", "fabric", { opts: FABRICS, value: base.fabric })}
      ${fld("Fabric from", "own", { opts: [["1", "Customer brings fabric"], ["0", `Shop fabric (+${rs(S.set.fabric)} a suit)`]], value: base.own ? "1" : "0" })}
      ${fld("Karigar", "kar", { opts: [["", "Assign later"], ...S.kar.map((k) => [k.id, k.name + " · " + k.skill])], value: base.kar })}
      <div class="fld span"><label for="${nid}">Design notes</label><textarea id="${nid}" name="notes" rows="2" placeholder="Collar, pockets, buttons, fit…">${esc(base.notes)}</textarea><div class="qchips" aria-label="Quick notes">${NOTE_BITS.map((b) => `<button type="button" data-q="${esc(b)}">+ ${esc(b)}</button>`).join("")}</div></div>
      ${fld("Delivery date", "due", { type: "date", value: base.due, min: isNew ? TODAY : undefined })}
      <div class="fld"><label class="chk"><input type="checkbox" name="urgent"${base.urgent ? " checked" : ""}> Urgent (+${rs(S.set.urgent)})</label></div>
      <p class="note span" data-warn hidden></p>
      ${fld("Price (Rs)", "price", { type: "number", value: base.price || "", min: 0, hint: "Filled from the price list; you can change it" })}
      ${isNew ? fld("Advance received now (Rs)", "adv", { type: "number", value: "", min: 0, ph: "0", hint: "Most customers pay 30 to 50 percent" }) : `<div class="fld"><label>Paid so far</label><b style="padding:.55em 0">${rs(paidOf(o))}</b><small class="hint">Take more payments from the order drawer</small></div>`}
    </div>`,
    onOpen: (box) => {
      const f = $("form", box), E = f.elements;
      const upd = () => {
        $(".newc", box).hidden = E.cust.value !== "__new";
        if (!manual) E.price.value = priceFor(E.garment.value, Math.max(1, +E.qty.value || 1), E.own.value === "1", E.urgent.checked);
        const w = dateWarn(E.due.value, E.qty.value, E.garment.value, o && o.id), n = $("[data-warn]", box);
        n.hidden = !w; n.textContent = w;
      };
      f.addEventListener("input", (e) => { if (e.target.name === "price") manual = true; upd(); });
      f.addEventListener("change", upd);
      box.addEventListener("click", (e) => { const q = e.target.closest("[data-q]"); if (!q) return; const t = E.notes; t.value = t.value.trim() ? t.value.replace(/[,\s]+$/, "") + ", " + q.dataset.q : q.dataset.q; t.focus(); });
      upd();
    },
    onSubmit: (d) => {
      const rules = { cust: [REQ("Choose a customer")], qty: [[(x) => Number.isInteger(+x) && +x >= 1 && +x <= 20, "Enter 1 to 20 suits"]], due: [REQ("Pick a delivery date"), [(x) => !isNew || x >= TODAY, "This date has passed"]], price: [POS("Enter the price")] };
      if (d.cust === "__new") Object.assign(rules, { nname: [REQ("Enter the customer's name"), [(x) => x.length >= 3, "Use at least 3 letters"]], nphone: [PHONE] });
      if (isNew) rules.adv = [[(x) => x === "" || (+x >= 0 && +x <= +d.price), "The advance cannot be more than the price"]];
      const er = check(d, rules); if (Object.keys(er).length) return er;
      let cid = d.cust;
      if (cid === "__new") cid = newCust(d.nname, d.nphone, AREAS[0]).id;
      const fields = { cust: cid, garment: d.garment, qty: +d.qty, fabric: d.fabric, own: d.own === "1", kar: d.kar, notes: d.notes.trim(), due: d.due, urgent: !!d.urgent, price: Math.round(+d.price) };
      if (isNew) {
        const id = "ORD-" + (Math.max(2400, ...S.orders.map((x) => +x.id.slice(4))) + 1);
        S.orders.push({ id, ...fields, booked: TODAY, stage: "Received" });
        if (+d.adv > 0) S.pays.push({ id: uid("P"), date: TODAY, order: id, kind: "Advance", method: "Cash", amt: Math.round(+d.adv) });
        afterChange(`${id} booked for ${custOf(cid).name}, delivery ${fd(d.due)}`);
      } else { Object.assign(o, fields); afterChange(`${o.id} updated`); }
    },
  });
}

  const paint = () => {

    body.innerHTML = `<div class="cd-top">${av(c.name, "lg")}<div><b>${esc(c.name)}</b><div class="mut">${esc(c.phone)}${c.area ? " · " + esc(c.area) : ""}</div></div>${stagePill(o.stage)}</div>

    ${o.stage !== "Delivered" ? `<button type="button" class="btn pri wide" data-o="next">${ico("arrow")} Move to ${STAGES[si + 1]}</button>` : `<p class="note ok">Delivered on ${fdy(o.doneOn || o.due)}</p>`}

async function setStage(o, st) {

    if (bal > 0) { if (!(await ask(`${custOf(o.cust).name} still owes ${rs(bal)}. Collect it now and hand over the order?`, { title: "Collect the balance", ok: "Collect and deliver", safe: true }))) return; S.pays.push({ id: uid("P"), date: TODAY, order: o.id, kind: "Balance", method: "Cash", amt: bal }); }
    o.doneOn = TODAY; o.stage = st; afterChange(`${o.id} delivered. Balance cleared.`); return;
  }

  S.orders.filter((o) => o.stage === "Ready" && dayDiff(o.doneOn || o.due, TODAY) >= 3).forEach((o) => L.push({ id: "pick" + o.id, t: `${o.id} waiting for pickup`, d: `${custOf(o.cust).name} · ${rs(balOf(o))} to collect`, go: "#/orders/" + o.id }));
  for (let i = 0; i < 14; i++) { const d = iso(addD(today(), i)), s = suitsDue(d); if (s > S.set.cap) L.push({ id: "busy" + d + s, t: `Busy day: ${fd(d)}`, d: `${s} suits due, capacity ${S.set.cap}`, go: "#/calendar" }); }
  if (E.days >= 0 && E.days < 150) L.push({ id: "eid" + S.set.eid, t: `Eid rush starts ${fd(E.start)}`, d: `${E.days} days to Eid. Plan karigar capacity now.`, go: "#/calendar" });
  return L.slice(0, 9);
};
APP.cmds = () => [
  { label: "New order", hint: "Action", run: DO["new-order"] }, { label: "Add customer", hint: "Action", run: DO["add-cust"] }, { label: "Record payment", hint: "Action", run: DO.pay }, { label: "Pay a karigar", hint: "Action", run: DO.payout }, { label: "Jump to Eid on the calendar", hint: "Action", run: DO.eid }, { label: "Switch light or dark theme", hint: "Action", run: DO.theme },
  ...S.orders.map((o) => ({ label: `${o.id} · ${custOf(o.cust).name} · ${o.garment}`, hint: "Order", run: () => openOrder(o.id) })),
  ...S.cust.map((c) => ({ label: `${c.name} · ${c.phone}`, hint: "Customer", run: () => openCust(c.id) })),
];
paintSide();
boot();
</script>
