<!doctype html>
<!-- Chill & Craft · Promo Snip · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Snip · coupon code field with a live basket</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: grocery paper, tomato and mustard ---------- */
  :root {
    color-scheme: light;
    --stage: #f6ecd9;
    --stage-dot: rgba(196, 120, 40, .12);
    --card: #fffaf1;
    --ink: #2b2118;
    --muted: #8a7764;
    --line: rgba(43, 33, 24, .12);
    --tomato: #e0473b;
    --tomato-dk: #b8322a;
    --mustard: #f4b63f;
    --mustard-dk: #d6952a;
    --mint: #23966a;
    --field: #ffffff;
    --shadow: rgba(110, 70, 20, .28);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #17120e;
    --stage-dot: rgba(244, 182, 63, .07);
    --card: #241c16;
    --ink: #f6ebdc;
    --muted: #b09c86;
    --line: rgba(246, 235, 220, .12);
    --tomato: #f0604e;
    --tomato-dk: #c94436;
    --mustard: #e6aa3a;
    --mustard-dk: #c48a22;
    --mint: #4cc98f;
    --field: #fff8ec;
    --shadow: rgba(0, 0, 0, .65);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background: radial-gradient(circle at 50% 30%, transparent, rgba(0, 0, 0, .05) 80%), radial-gradient(var(--stage-dot) 1.2px, transparent 1.6px) 0 0 / 18px 18px, var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Basket card ---------- */
  .basket {
    position: relative;
    width: min(100%, 420px);
    padding: 20px 20px 18px;
    border-radius: 24px;
    background: var(--card);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 0 0 1px var(--line), 0 30px 60px -30px var(--shadow);
  }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .head svg { flex: none; animation: sway 4s ease-in-out infinite; transform-origin: 50% 0; }
  @keyframes sway { 50% { transform: rotate(-5deg); } }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  .count { margin-left: auto; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--tomato-dk); background: rgba(224, 71, 59, .1); }
  [data-theme="dark"] .count { color: var(--tomato); }

  /* Items with real quantity steppers */
  .items { list-style: none; margin: 0 0 14px; padding: 0; }
  .item { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .thumb { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(160deg, #fde7c2, #f7cf8a); }
  .thumb.b { background: linear-gradient(160deg, #fbd6cf, #f2a594); }
  .name { margin: 0; font-size: 14.5px; font-weight: 650; }
  .meta { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .right { display: grid; justify-items: end; gap: 5px; }
  .line { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stepper { display: inline-flex; align-items: center; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); }
  .stepper button { width: 28px; height: 26px; padding: 0; border: 0; background: none; border-radius: 999px; cursor: pointer; font-size: 16px; line-height: 1; transition: background .2s, transform .2s cubic-bezier(.34, 1.56, .64, 1); }
  .stepper button:hover:not(:disabled) { background: rgba(224, 71, 59, .12); }
  .stepper button:active:not(:disabled) { transform: scale(.85); }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper output { min-width: 18px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stepper output.bump { animation: bump .35s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes bump { 40% { transform: scale(1.45); color: var(--tomato); } }

  /* ---------- The coupon ticket ---------- */
  .coupon-wrap { position: relative; filter: drop-shadow(0 8px 10px var(--shadow)); transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), filter .35s; }
  .coupon-wrap.lift { transform: translateY(-4px) rotate(-.6deg); filter: drop-shadow(0 14px 14px var(--shadow)); }
  .coupon { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 86px; min-height: 78px; }
  /* Masked paper shapes: notches top and bottom of the perforation */
  .part { position: relative; }
  .part::before { content: ""; position: absolute; inset: 0; z-index: -1; }
  .main::before {
    border-radius: 14px 0 0 14px;
    background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .12) 0 2px, transparent 2px 9px), linear-gradient(135deg, #ffd06a, var(--mustard));
    -webkit-mask: radial-gradient(circle 9px at 100% 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 9px at 100% 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
    mask: radial-gradient(circle 9px at 100% 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 9px at 100% 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
  }
  .stub::before {
    border-radius: 0 14px 14px 0;
    background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .1) 0 2px, transparent 2px 9px), linear-gradient(135deg, #f26b55, var(--tomato));
    -webkit-mask: radial-gradient(circle 9px at 0 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 9px at 0 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
    mask: radial-gradient(circle 9px at 0 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 9px at 0 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
  }
  .main { padding: 11px 14px 12px; color: #3b2709; }
  .main label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  .field { display: flex; gap: 6px; }
  .field input {
    flex: 1; width: 0; min-width: 0; height: 38px; padding: 0 11px; border: 0; border-radius: 10px;
    background: var(--field); color: #2b2118; caret-color: var(--tomato);
    font: 700 15px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase;
    box-shadow: inset 0 2px 4px rgba(90, 50, 0, .18); outline: none; transition: box-shadow .2s;
  }
  .field input::placeholder { color: #b49e7f; letter-spacing: .04em; font-weight: 600; text-transform: none; font-family: system-ui, sans-serif; }
  .field input:focus, .field.demo-focus input { box-shadow: inset 0 2px 4px rgba(90, 50, 0, .18), 0 0 0 3px rgba(224, 71, 59, .55); }
  .apply {
    position: relative; height: 38px; padding: 0 14px; border: 0; border-radius: 10px; cursor: pointer;
    color: #fff; font-size: 13px; font-weight: 750; letter-spacing: .04em;
    background: linear-gradient(180deg, #eb5a4b, var(--tomato-dk)); box-shadow: 0 3px 0 #8f241d, 0 6px 10px -4px rgba(143, 36, 29, .6);
    transition: transform .12s, box-shadow .12s;
  }
  .apply:hover { filter: brightness(1.06); }
  .apply:active, .apply.press { transform: translateY(3px); box-shadow: 0 0 0 #8f241d, 0 2px 4px -2px rgba(143, 36, 29, .6); }
  .apply:focus-visible, .chip:focus-visible, .stepper button:focus-visible, .remove:focus-visible { outline: 2px solid var(--tomato); outline-offset: 2px; }
  .apply .dots { display: none; }
  .apply.loading .label { visibility: hidden; }
  .apply.loading .dots { display: flex; position: absolute; inset: 0; align-items: center; justify-content: center; gap: 4px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: dot .6s ease-in-out infinite alternate; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { to { transform: translateY(-5px); opacity: .5; } }

  /* Applied state replaces the field */
  .applied-row { display: none; align-items: center; gap: 8px; height: 38px; }
  .coupon.applied .field { display: none; }
  .coupon.applied .applied-row { display: flex; animation: rowIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-12px); } }
  .tick { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); color: #fff; }
  .tick path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .45s ease .2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .applied-row strong { font: 800 15px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; }
  .applied-row span { min-width: 0; font-size: 12.5px; font-weight: 600; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .remove { margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 50%; cursor: pointer; background: rgba(59, 39, 9, .12); color: #3b2709; font-size: 18px; line-height: 1; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s; }
  .remove:hover { background: rgba(59, 39, 9, .2); transform: rotate(90deg); }

  /* Perforation line */
  .perf { position: absolute; top: 10px; bottom: 10px; right: 86px; width: 0; border-left: 2px dashed rgba(59, 39, 9, .35); }
  .coupon.cut .perf { opacity: 0; transition: opacity .2s; }

  /* The stub: flips over to show what the code is worth, then gets snipped off */
  .stub { display: grid; place-items: center; perspective: 300px; color: #fff; }
  .stub.gone { visibility: hidden; }
  .stub.back { animation: reattach .6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes reattach { from { transform: translateY(-46px) rotate(10deg); opacity: 0; } }
  .faces { position: relative; width: 70px; height: 54px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
  .coupon.flip .faces { transform: rotateX(180deg); }
  .face { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 3px; backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; }
  .face.b { transform: rotateX(180deg); }
  .face big { display: block; font: 900 21px/1 system-ui, sans-serif; letter-spacing: -.02em; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
  .face small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .2em; opacity: .9; }
  .face.a big { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12) rotate(-6deg); } }

  /* Scissors that travel down the perforation */
  .scissors { position: absolute; top: 0; right: 69px; width: 34px; height: 34px; opacity: 0; pointer-events: none; z-index: 3; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .35)); }
  .coupon.cutting .scissors { animation: travel .82s cubic-bezier(.45, 0, .35, 1) forwards; }
  @keyframes travel { 0% { opacity: 0; transform: translateY(-38px) rotate(90deg); } 15% { opacity: 1; transform: translateY(-20px) rotate(90deg); } 92% { opacity: 1; } 100% { opacity: 0; transform: translateY(70px) rotate(90deg); } }
  .blade { transform-origin: 15px 17px; }
  .coupon.cutting .blade.u { animation: snipU .14s ease-in-out 6 alternate; }
  .coupon.cutting .blade.l { animation: snipL .14s ease-in-out 6 alternate; }
  @keyframes snipU { from { transform: rotate(-16deg); } to { transform: rotate(0); } }
  @keyframes snipL { from { transform: rotate(16deg); } to { transform: rotate(0); } }

  /* Rubber stamp for codes that do not work */
  .stamp {
    position: absolute; left: 34%; top: 50%; z-index: 4; padding: 5px 10px; border: 3px solid var(--tomato-dk); border-radius: 8px;
    color: var(--tomato-dk); font: 900 17px/1 system-ui, sans-serif; letter-spacing: .14em; white-space: nowrap;
    background: rgba(255, 250, 241, .88); opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(2); pointer-events: none;
  }
  .stamp.slam { animation: slam 1.7s cubic-bezier(.3, 1.4, .5, 1) forwards; }
  @keyframes slam { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-16deg) scale(2.2); } 14% { opacity: 1; transform: translate(-50%, -50%) rotate(-9deg) scale(.94); } 22% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(1); } }
  .coupon-wrap.shake { animation: shake .45s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px) rotate(-1deg); } 40%, 80% { transform: translateX(7px) rotate(1deg); } }

  /* Sample codes */
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 14px; font-size: 12.5px; color: var(--muted); }
  .chip {
    padding: 5px 9px; border: 1px dashed rgba(224, 71, 59, .55); border-radius: 8px; cursor: pointer; background: transparent;
    font: 750 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--tomato-dk);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s;
  }
  [data-theme="dark"] .chip { color: var(--tomato); }
  .chip:hover { background: rgba(224, 71, 59, .1); transform: translateY(-2px) rotate(-2deg); }

  /* ---------- Totals ---------- */
  .totals { margin: 0; display: grid; gap: 0; font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; font-weight: 650; }
  .row s { margin-right: 6px; color: var(--muted); font-weight: 500; }
  .disc-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.34, 1.3, .64, 1); }
  .disc-wrap.show { grid-template-rows: 1fr; }
  .disc-wrap > div { overflow: hidden; }
  .disc-wrap .row dt, .disc-wrap .row dd { color: var(--mint); font-weight: 700; }
  .code-tag { margin-left: 6px; padding: 2px 6px; border-radius: 5px; font: 800 11px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; background: rgba(35, 150, 106, .12); }
  .total { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .total dt { color: var(--ink); font-weight: 750; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .total dd { font-size: 22px; font-weight: 850; letter-spacing: -.01em; }
  .total dd.flash { animation: flash .9s ease; }
  @keyframes flash { 30% { color: var(--mint); transform: scale(1.08); } }
  .save { padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800; color: #fff; background: var(--mint); transform: scale(0); transition: transform .45s cubic-bezier(.34, 1.8, .5, 1); }
  .save.show { transform: scale(1); }

  .status { min-height: 20px; margin: 10px 0 0; font-size: 13.5px; font-weight: 600; text-align: center; }
  .status[data-tone="good"] { color: var(--mint); }
  .status[data-tone="bad"] { color: var(--tomato-dk); }
  [data-theme="dark"] .status[data-tone="bad"] { color: var(--tomato); }
  .status.pop { animation: statusIn .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(6px); } }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <main class="basket" id="basket">
    <div class="head">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M6 10h18l-1.6 15.2a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8z" fill="#e0473b"/><path d="M10.5 12V8.5a4.5 4.5 0 0 1 9 0V12" fill="none" stroke="#f4b63f" stroke-width="2.4" stroke-linecap="round"/><path d="M9 14h12" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></svg>
      <h1>Your basket</h1>
      <span class="count" id="count">3 items</span>
    </div>

    <ul class="items">
      <li class="item" data-i="0">
        <span class="thumb" aria-hidden="true">
          <svg width="30" height="34" viewBox="0 0 30 34"><rect x="5" y="6" width="20" height="26" rx="3" fill="#b23a2c"/><rect x="5" y="13" width="20" height="11" fill="#f4e2bf"/><path d="M9 18.5h12" stroke="#b23a2c" stroke-width="2" stroke-linecap="round"/><rect x="4" y="3" width="22" height="5" rx="2" fill="#6e4a1f"/></svg>
        </span>
        <div><p class="name">Masala chai tin</p><p class="meta">250 g · PKR 650</p></div>
        <div class="right">
          <span class="line" id="line0">PKR 1,300</span>
          <span class="stepper"><button type="button" data-step="-1" aria-label="One less chai tin">−</button><output id="qty0" aria-label="Chai tins">2</output><button type="button" data-step="1" aria-label="One more chai tin">+</button></span>
        </div>
      </li>
      <li class="item" data-i="1">
        <span class="thumb b" aria-hidden="true">
          <svg width="34" height="30" viewBox="0 0 34 30"><path d="M3 9h13l-1.5 14a3 3 0 0 1-3 2.6H7.5a3 3 0 0 1-3-2.6z" fill="#a24a2a"/><path d="M18 9h13l-1.5 14a3 3 0 0 1-3 2.6h-4a3 3 0 0 1-3-2.6z" fill="#c2643a"/><ellipse cx="9.5" cy="9" rx="6.5" ry="1.8" fill="#6d2c14"/><ellipse cx="24.5" cy="9" rx="6.5" ry="1.8" fill="#7e3a1b"/><path d="M9 6c0-2 2-2 2-4M24 6c0-2 2-2 2-4" stroke="#fff" stroke-opacity=".8" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        </span>
        <div><p class="name">Clay cup set</p><p class="meta">4 cups · PKR 2,350</p></div>
        <div class="right">
          <span class="line" id="line1">PKR 2,350</span>
          <span class="stepper"><button type="button" data-step="-1" aria-label="One less cup set">−</button><output id="qty1" aria-label="Cup sets">1</output><button type="button" data-step="1" aria-label="One more cup set">+</button></span>
        </div>
      </li>
    </ul>

    <!-- Coupon ticket: the field lives on the yellow part, the red stub gets snipped off -->
    <div class="coupon-wrap" id="wrap">
      <div class="coupon" id="coupon">
        <div class="part main">
          <label for="code">Promo code</label>
          <div class="field" id="field">
            <input id="code" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Enter a code" aria-describedby="chips status">
            <button type="button" class="apply" id="apply"><span class="label">Apply</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
          </div>
          <div class="applied-row">
            <span class="tick" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <strong id="appliedCode"></strong><span id="appliedNote"></span>
            <button type="button" class="remove" id="remove" aria-label="Remove promo code">×</button>
          </div>
        </div>
        <div class="part stub" id="stub" aria-hidden="true">
          <div class="faces">
            <div class="face a"><big>%</big><small>SAVE</small></div>
            <div class="face b"><big id="stubBig">−20%</big><small id="stubSmall">OFF</small></div>
          </div>
        </div>
        <span class="perf" aria-hidden="true"></span>
        <svg class="scissors" viewBox="0 0 34 34" aria-hidden="true">
          <g class="blade u"><path d="M15 17L33 13.5 33 15.5z" fill="#d9dee3" stroke="#7d868e" stroke-width=".8"/><circle cx="7" cy="10" r="5" fill="none" stroke="#2b2118" stroke-width="3"/><path d="M11 13l4 4" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/></g>
          <g class="blade l"><path d="M15 17L33 20.5 33 18.5z" fill="#c3c9cf" stroke="#7d868e" stroke-width=".8"/><circle cx="7" cy="24" r="5" fill="none" stroke="#e0473b" stroke-width="3"/><path d="M11 21l4-4" stroke="#e0473b" stroke-width="3" stroke-linecap="round"/></g>
          <circle cx="15" cy="17" r="1.6" fill="#2b2118"/>
        </svg>
        <span class="stamp" id="stamp" aria-hidden="true">NOT VALID</span>
      </div>
    </div>

    <div class="chips" id="chips">Try
      <button type="button" class="chip" data-code="CHAI20">CHAI20</button>
      <button type="button" class="chip" data-code="FREESHIP">FREESHIP</button>
      <button type="button" class="chip" data-code="EID500">EID500</button>
    </div>

    <dl class="totals">
      <div class="row"><dt>Subtotal</dt><dd id="sub">PKR 3,650</dd></div>
      <div class="row"><dt>Delivery</dt><dd id="ship">PKR 250</dd></div>
      <div class="disc-wrap" id="discWrap"><div><div class="row"><dt>Promo<span class="code-tag" id="discTag"></span></dt><dd id="disc">−PKR 0</dd></div></div></div>
      <div class="row total"><dt>Total <span class="save" id="save">You save PKR 0</span></dt><dd id="total">PKR 3,900</dd></div>
    </dl>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const input = $("code"), applyBtn = $("apply"), coupon = $("coupon"), wrap = $("wrap"), field = $("field");
  const stub = $("stub"), stamp = $("stamp"), statusEl = $("status"), saveEl = $("save"), discWrap = $("discWrap");

  // ---- Basket data and promo rules ----
  const ITEMS = [{ price: 650, qty: 2 }, { price: 2350, qty: 1 }];
  const DELIVERY = 250;
  const CODES = {
    CHAI20: { kind: "pct", value: 20, cap: 1000, big: "−20%", small: "OFF", note: "20% off" },
    FREESHIP: { kind: "ship", big: "FREE", small: "DELIVERY", note: "Free delivery" },
    EID500: { kind: "flat", value: 500, min: 3500, big: "−500", small: "PKR OFF", note: "PKR 500 off" },
    RAMZAN10: { kind: "expired" }
  };
  let applied = "";
  let busy = false;

  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const subtotal = () => ITEMS.reduce((s, it) => s + it.price * it.qty, 0);
  function discountFor(code, sub) {
    const c = CODES[code];
    if (!c) return 0;
    if (c.kind === "pct") return Math.min(Math.round((sub * c.value) / 100), c.cap);
    if (c.kind === "flat") return c.value;
    if (c.kind === "ship") return DELIVERY;
    return 0;
  }

  // ---- Cancellable waits ----
  const CANCEL = { cancelled: true };
  let gen = 0;
  function pause(ms, g, isAnim) {
    const t = isAnim && reduce ? Math.min(ms, 140) : ms;
    return new Promise((ok, no) => setTimeout(() => (g === gen ? ok() : no(CANCEL)), t));
  }
  const quiet = (p) => p.catch((e) => { if (e !== CANCEL) throw e; });
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function say(msg, tone) { statusEl.textContent = msg; statusEl.dataset.tone = tone || ""; restart(statusEl, "pop"); }

  // ---- Numbers that roll to their new value ----
  const shown = new Map();
  function roll(el, to, prefix) {
    const from = shown.has(el) ? shown.get(el) : to;
    shown.set(el, to);
    if (reduce || from === to) { el.textContent = prefix + fmt(to); return; }
    const t0 = performance.now(), dur = 850;
    cancelAnimationFrame(el._raf);
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = prefix + fmt(from + (to - from) * e);
      if (k < 1) el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  }

  // ---- Draw every total from the current basket and code ----
  function render() {
    const sub = subtotal();
    ITEMS.forEach((it, i) => {
      $("qty" + i).value = it.qty;
      $("qty" + i).textContent = it.qty;
      roll($("line" + i), it.price * it.qty, "");
      const step = document.querySelectorAll(".item")[i].querySelectorAll(".stepper button");
      step[0].disabled = it.qty <= 1;
      step[1].disabled = it.qty >= 9;
    });
    $("count").textContent = ITEMS.reduce((s, it) => s + it.qty, 0) + " items";
    roll($("sub"), sub, "");
    const disc = applied ? discountFor(applied, sub) : 0;
    const ship = $("ship");
    if (applied && CODES[applied].kind === "ship") ship.innerHTML = "<s>" + fmt(DELIVERY) + "</s>Free";
    else ship.textContent = fmt(DELIVERY);
    discWrap.classList.toggle("show", !!applied);
    $("discTag").textContent = applied;
    roll($("disc"), disc, "−");
    roll($("total"), sub + DELIVERY - disc, "");
    saveEl.textContent = "You save " + fmt(disc);
    saveEl.classList.toggle("show", disc > 0);
    return disc;
  }

  // Quantity steppers keep the promo rules honest
  document.querySelectorAll(".item").forEach((li, i) => {
    li.querySelectorAll(".stepper button").forEach((b) => b.addEventListener("click", () => {
      ITEMS[i].qty = Math.max(1, Math.min(9, ITEMS[i].qty + Number(b.dataset.step)));
      restart($("qty" + i), "bump");
      const code = applied, c = CODES[code];
      if (code && c.min && subtotal() < c.min) {
        quiet(removeCode(gen, true));
        say(code + " needs a basket over " + fmt(c.min) + ", so it was taken off.", "bad");
        return;
      }
      render();
      restart($("total"), "flash");
    }));
  });

  // ---- Apply a code ----
  async function apply(g) {
    if (busy) return;
    const code = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    input.value = code;
    if (!code) { say("Type a promo code first.", "bad"); restart(wrap, "shake"); return; }
    busy = true;
    applyBtn.classList.add("loading");
    wrap.classList.add("lift");
    say("Checking " + code + "…");
    await pause(700, g, true);
    applyBtn.classList.remove("loading");
    const c = CODES[code];
    let problem = "";
    if (!c) problem = "NOT VALID|We could not find " + code + ". Try one of the codes below.";
    else if (c.kind === "expired") problem = "EXPIRED|" + code + " ended on 30 March. Try another code.";
    else if (c.min && subtotal() < c.min) problem = "MIN ORDER|Add " + fmt(c.min - subtotal()) + " more to use " + code + ".";
    if (problem) {
      const [word, msg] = problem.split("|");
      wrap.classList.remove("lift");
      stamp.textContent = word;
      restart(stamp, "slam");
      await pause(160, g, true);
      restart(wrap, "shake");
      say(msg, "bad");
      busy = false;
      return;
    }

    // 1. The stub flips to show what the code is worth
    $("stubBig").textContent = c.big;
    $("stubSmall").textContent = c.small;
    coupon.classList.add("flip");
    await pause(520, g, true);
    // 2. Scissors run down the perforation
    coupon.classList.add("cutting");
    crumbs();
    await pause(820, g, true);
    coupon.classList.add("cut");
    // 3. The stub tears free and flies into the totals
    applied = code;
    flyStub();
    await pause(260, g, true);
    const disc = render();
    restart($("total"), "flash");
    $("appliedCode").textContent = code;
    $("appliedNote").textContent = c.note;
    coupon.classList.add("applied");
    wrap.classList.remove("lift");
    await pause(380, g, true);
    // 4. Hole-punch confetti from the total
    punches($("total"));
    say(code + " applied. You save " + fmt(disc) + ".", "good");
    busy = false;
  }

  function flyStub() {
    const a = stub.getBoundingClientRect();
    const b = discWrap.getBoundingClientRect();
    const dx = b.left + b.width * 0.75 - (a.left + a.width / 2);
    const dy = b.top + 8 - (a.top + a.height / 2);
    if (reduce) { stub.classList.add("gone"); return; }
    const anim = stub.animate([
      { transform: "none", opacity: 1 },
      { transform: "translate(10px, 6px) rotate(10deg)", opacity: 1, offset: 0.2 },
      { transform: "translate(" + dx * 0.6 + "px," + (dy * 0.6 - 30) + "px) rotate(-8deg) scale(.7)", opacity: 1, offset: 0.65 },
      { transform: "translate(" + dx + "px," + dy + "px) rotate(-14deg) scale(.25)", opacity: 0 }
    ], { duration: 760, easing: "cubic-bezier(.45, 0, .3, 1)", fill: "forwards" });
    anim.onfinish = () => stub.classList.add("gone");
  }

  // ---- Remove the code: the stub drops back on and totals roll back ----
  async function removeCode(g, silent) {
    busy = true;
    stub.getAnimations().forEach((a) => a.cancel());
    applied = "";
    coupon.classList.remove("applied", "cutting", "cut", "flip");
    stub.classList.remove("gone");
    restart(stub, "back");
    render();
    input.value = "";
    if (!silent) say("Promo code removed.");
    await pause(500, g, true);
    busy = false;
  }

  // ---- Little particles ----
  const fx = $("fx");
  function crumbs() {
    if (reduce) return;
    const r = coupon.getBoundingClientRect();
    const x = r.right - 86;
    for (let n = 0; n < 14; n++) {
      const p = document.createElement("i");
      const s = 2 + Math.random() * 3;
      p.style.width = s + "px";
      p.style.height = s * 1.6 + "px";
      p.style.borderRadius = "1px";
      p.style.background = n % 2 ? "#f4b63f" : "#e0473b";
      fx.append(p);
      const y = r.top + 6 + (n / 14) * (r.height - 12);
      p.animate([
        { transform: "translate(" + x + "px," + y + "px)", opacity: 1 },
        { transform: "translate(" + (x + (Math.random() - 0.5) * 50) + "px," + (y + 50 + Math.random() * 50) + "px) rotate(" + Math.random() * 400 + "deg)", opacity: 0 }
      ], { duration: 700 + Math.random() * 400, delay: n * 52, easing: "cubic-bezier(.3,.4,.6,1)", fill: "both" }).onfinish = () => p.remove();
    }
  }
  function punches(from) {
    if (reduce) return;
    const r = from.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    const COLORS = ["#f4b63f", "#e0473b", "#23966a", "#fde7c2", "#f2a594"];
    for (let n = 0; n < 40; n++) {
      const p = document.createElement("i");
      const s = 5 + Math.random() * 6;
      p.style.width = p.style.height = s + "px";
      p.style.background = COLORS[n % COLORS.length];
      fx.append(p);
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
      const d = 50 + Math.random() * 140;
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.4)", opacity: 1 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + dy) + "px) scale(1)", opacity: 1, offset: 0.45 },
        { transform: "translate(" + (x0 + dx * 1.2) + "px," + (y0 + dy + 120) + "px) scale(.8)", opacity: 0 }
      ], { duration: 1300 + Math.random() * 700, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => p.remove();
    }
  }

  // ---- Wiring ----
  applyBtn.addEventListener("click", () => quiet(apply(gen)));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); quiet(apply(gen)); } });
  input.addEventListener("input", () => {
    const pos = input.selectionStart;
    const v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (v !== input.value) { input.value = v; try { input.setSelectionRange(pos, pos); } catch (e) { /* not a text field */ } }
  });
  $("remove").addEventListener("click", () => quiet(removeCode(gen)).then(() => input.focus()));
  document.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", async () => {
    if (busy) return;
    const g = gen;
    if (applied) await quiet(removeCode(g, true));
    input.value = chip.dataset.code;
    quiet(apply(g));
  }));

  // ---- Instant reset used when a real person takes over ----
  function hardReset() {
    gen++;
    busy = false;
    stub.getAnimations().forEach((a) => a.cancel());
    applied = "";
    coupon.classList.remove("applied", "cutting", "cut", "flip");
    stub.classList.remove("gone", "back");
    wrap.classList.remove("lift", "shake");
    field.classList.remove("demo-focus");
    applyBtn.classList.remove("loading", "press");
    stamp.classList.remove("slam");
    input.value = "";
    ITEMS[0].qty = 2;
    ITEMS[1].qty = 1;
    render();
    say("");
  }

  // ---- Auto-demo: types a few codes, good and bad, while nobody is using it ----
  let demoOn = true, demoTimer = 0, round = 0;
  const DEMO = ["CHAI20", "SAVE99", "FREESHIP", "RAMZAN10", "EID500"];
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); hardReset(); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) =>
    window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));

  async function runDemo() {
    const g = gen;
    const code = DEMO[round++ % DEMO.length];
    field.classList.add("demo-focus");
    for (let i = 1; i <= code.length; i++) { input.value = code.slice(0, i); await pause(95, g); }
    await pause(260, g);
    field.classList.remove("demo-focus");
    applyBtn.classList.add("press");
    await pause(140, g);
    applyBtn.classList.remove("press");
    await apply(g);
    if (applied) { await pause(2600, g); await removeCode(g); }
    else { await pause(1700, g); input.value = ""; say(""); }
    demoTimer = setTimeout(() => quiet(runDemo()), 1400);
  }

  render();
  say("Add a promo code to save on this order.");
  demoTimer = setTimeout(() => quiet(runDemo()), 400);
})();
</script>
</body>
</html>
