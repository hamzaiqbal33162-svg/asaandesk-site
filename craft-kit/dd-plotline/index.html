<!doctype html>
<!-- Chill & Craft · Plotline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotline · Real-estate CRM</title>
<meta name="description" content="A real-estate CRM with a live listings map, homes for sale and rent, a deals pipeline, leads, viewings and live client chat.">
<script>
  /* Theme before first paint: ?theme= wins, then the saved choice, then the system */
  (function () { try { var q = new URLSearchParams(location.search).get("theme"), s = null; try { s = JSON.parse(localStorage.getItem("plotline:theme")); } catch (e) {} document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {} })();
</script>
<style>
/* ---------- Theme tokens: slate and sea-teal with a coral spark ---------- */
:root{
  --ease:cubic-bezier(.2,.85,.25,1.05);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#eef2f3;--surface:#fff;--surface2:#f3f6f7;--text:#1b262c;--muted:#5f7079;--line:#dbe3e6;--line-strong:#a9b8be;
  --accent:#0f8b8d;--accent-ink:#fff;--coral:#ef6f5e;--ok:#2a9d6f;--warn:#d99a21;--bad:#d64545;--info:#3b7dd8;
  --c1:#0f8b8d;--c2:#ef6f5e;--c3:#f2b33d;--c4:#3b7dd8;--c5:#8a67c7;--c6:#5c7a89;
  --map-land:#e3ebe8;--map-block:#d3dfdb;--map-road:#fff;--map-water:#a8d5dc;--map-park:#c4e0c2;
  --head:#1f2d35;--head-ink:#cfdde3;
  --r-btn:9px;--r-dlg:16px;--r-in:9px;--pad:16px;
  --toast-bg:#1f2d35;--tip-bg:#1f2d35;--grid:#e6ecee;--hover:#eef6f6;--track:#e3e9eb;
}
[data-theme=dark]{
  --bg:#0f171b;--surface:#16222a;--surface2:#1b2a33;--text:#e2ecef;--muted:#8fa4ad;--line:#253740;--line-strong:#3b5260;
  --accent:#2cc4c6;--accent-ink:#04191a;--coral:#ff8a7a;--ok:#4cc38f;--warn:#f0b54a;--bad:#ff7070;--info:#6ea6f2;
  --c1:#2cc4c6;--c2:#ff8a7a;--c3:#f5c35e;--c4:#6ea6f2;--c5:#ad8ff0;--c6:#89a7b6;
  --map-land:#15242b;--map-block:#1d313a;--map-road:#2a414b;--map-water:#16424c;--map-park:#1b3a2c;
  --head:#0a1216;--head-ink:#9fb4bd;
  --toast-bg:#e2ecef;--toast-ink:#0f171b;--tip-bg:#e2ecef;--tip-ink:#0f171b;--grid:#1e2f37;--hover:#1a2d35;--track:#22343d;
}
/* ---------- Base: reset and shared components, styled by the theme tokens above ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link,var(--accent))}
h1,h2,h3{line-height:1.2}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.sp{flex:1}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{min-width:0}
.view.quiet .rise{animation:none}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:var(--r-btn,10px);font-weight:600;font-size:.93em;line-height:1.2;white-space:nowrap;transition:transform .15s var(--ease),background .2s,box-shadow .2s,border-color .2s;text-decoration:none}
.btn:hover{border-color:var(--line-strong,var(--muted))}
.btn:active{transform:scale(.95) translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -6px var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:.84em}
.btn .ic{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-btn,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s var(--ease),background .2s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn .cnt{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
[data-theme-toggle] .i-sun{display:none}
[data-theme=dark] [data-theme-toggle] .i-sun{display:block}
[data-theme=dark] [data-theme-toggle] .i-moon{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;font-size:.84em;font-weight:500;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip small{opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-btn,10px);padding:3px;gap:2px;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:calc(var(--r-btn,10px) - 3px);font-size:.84em;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78em;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{--tc:var(--ok)}.tag.warn{--tc:var(--warn)}.tag.bad{--tc:var(--bad)}.tag.info{--tc:var(--info,var(--accent))}.tag.muted{--tc:var(--muted)}
.av{width:32px;height:32px;border-radius:var(--r-av,50%);display:inline-grid;place-items:center;font-weight:700;font-size:.74em;color:#fff;background:hsl(var(--h) var(--av-s,52%) var(--av-l,46%));flex:none;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:1.1em}
.av.open{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.pbar{display:inline-block;width:100%;height:6px;border-radius:6px;background:var(--track,color-mix(in srgb,var(--muted) 18%,transparent));overflow:hidden;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .6s var(--ease)}
.pbar.bad i{background:var(--bad)}.pbar.ok i{background:var(--ok)}.pbar.warn i{background:var(--warn)}
.note-bad{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:.88em}
.empty{display:grid;justify-items:center;gap:4px;padding:26px 10px;color:var(--muted);text-align:center}
.empty .ic{width:30px;height:30px;opacity:.6}
.empty b{color:var(--text)}
/* tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-btn,10px);padding:0 11px;background:var(--surface2);min-width:0;flex:1 1 170px;max-width:300px;color:var(--muted)}
.search input{border:0;background:transparent;padding:8px 0;outline:0;min-width:0;width:100%;color:var(--text)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.search.big{max-width:none;padding:2px 14px;font-size:1.05em}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad,18px) * -1);padding:0 var(--pad,18px)}
.tbl{width:100%;border-collapse:collapse;font-size:.92em;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{transition:background .15s}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover,.tbl tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl .who-c{display:flex;align-items:center;gap:10px}
.tbl .who-c small{display:block;color:var(--muted);font-size:.86em}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit}
.th-sort .arr::after{content:"↕";opacity:.35}
.th-sort.on .arr::after{content:"↑";opacity:1}
.th-sort.on.desc .arr::after{content:"↓"}
.num .th-sort{flex-direction:row-reverse}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:.85em;color:var(--muted);flex-wrap:wrap}
.pbtns{display:flex;gap:4px;flex-wrap:wrap}
.pg{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;display:inline-grid;place-items:center;font-size:.92em}
.pg[aria-current]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pg:disabled{opacity:.4;cursor:default}
.pg.gap{border:0;background:none}
.pg .ic{width:15px;height:15px}
/* modals and drawers */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(10,12,20,.48));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .26s}
.ov.open{opacity:1}
.dlg{background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--r-dlg,16px);width:min(540px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);transform:translateY(18px) scale(.97);transition:transform .32s var(--ease);outline:0}
.ov.open .dlg{transform:none}
.ov.side{place-items:stretch end;padding:0}
.ov.side .dlg{width:min(460px,100%);max-height:none;height:100%;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(104%)}
.ov.side.open .dlg{transform:none}
.dlg.wide{width:min(780px,100%)}
.dlg.sm{width:min(420px,100%)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:1.06em}
.dlg-h .icon-btn{width:34px;height:34px}
.dlg-b{padding:16px 18px;overflow:auto;flex:1}
.dlg-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm-msg{margin:0;color:var(--muted)}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
body.modal-open{overflow:hidden}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{grid-column:span 2;display:grid;gap:5px;min-width:0}
.fld.half{grid-column:span 1}
.fld label{font-size:.82em;font-weight:600;color:var(--muted)}
.fld label i{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-in,9px);padding:9px 11px;width:100%;min-width:0;color:var(--text)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fld [aria-invalid=true]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface2))}
.fld.chk label{display:flex;gap:8px;align-items:center;color:var(--text);font-weight:500;font-size:.92em}
.fld.chk input{width:auto}
.err{color:var(--bad);font-size:.78em;min-height:0}
.err:empty{display:none}
.help{color:var(--muted);font-size:.78em}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
@media (max-width:520px){.fld.half{grid-column:span 2}}
/* toasts */
#toasts{position:fixed;z-index:120;bottom:16px;right:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;background:var(--toast-bg,#15171c);color:var(--toast-ink,#fff);padding:10px 10px 10px 14px;border-radius:var(--r-toast,12px);box-shadow:0 14px 34px -8px rgba(0,0,0,.4);animation:tin .38s var(--ease) both;font-size:.9em;max-width:420px}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .tdot{background:var(--warn)}.toast.bad .tdot{background:var(--bad)}
.tbtn{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.9em}
/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:130;pointer-events:none;background:var(--tip-bg,#14161b);color:var(--tip-ink,#fff);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:9px;opacity:0;transition:opacity .12s;box-shadow:0 10px 24px rgba(0,0,0,.28);max-width:240px}
.tip.on{opacity:1}
.tip div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip div b{margin-left:auto;padding-left:10px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart>svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart svg:focus-visible{outline-offset:4px}
.gy line{stroke:var(--grid,var(--line));stroke-dasharray:3 5}
.gy text,.gx{fill:var(--muted);font-size:11px}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 5;stroke-width:1.6}
.anim .ln:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:drawon 1.4s var(--ease) forwards}
.anim .ar{animation:fadein 1.2s .35s both}
.guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;pointer-events:none}
.dots circle{stroke:var(--surface-solid,var(--surface));stroke-width:2;pointer-events:none}
.col{transform-box:view-box}
.anim .col{animation:grow .85s var(--ease) both;animation-delay:var(--d,0ms)}
.col.dim{opacity:.45}
.refl{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
.refl-t{fill:var(--bad);font-size:11px;font-weight:600}
.col{transition:opacity .2s}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes drawon{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8em;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap>svg{flex:none;height:auto}
.trk{stroke:var(--track,color-mix(in srgb,var(--muted) 16%,transparent))}
.dseg{transition:opacity .2s}
.dseg.dim{opacity:.3}
.anim .sweep{animation:sweep 1.3s var(--ease) both}
@keyframes sweep{from{stroke-dashoffset:var(--C)}}
.dc-v{font-size:22px;font-weight:700;fill:var(--text)}
.dc-s{font-size:11px;fill:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:.88em}
.dl li{display:flex;align-items:center;gap:8px}
.dl li i{width:10px;height:10px;border-radius:3px;flex:none}
.dl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl li em{color:var(--muted);font-style:normal;width:38px;text-align:right}
.gauge .gv{transition:stroke-dasharray .8s var(--ease)}
.anim.gauge .gv{animation:gauge 1.3s var(--ease) both}
@keyframes gauge{from{stroke-dasharray:0 100}}
.anim.hm .hc{animation:fadein .5s both;animation-delay:var(--d)}
.spark{display:block;overflow:visible}
.spark .ln{stroke-width:2}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:.88em}
.hb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l small{display:block;color:var(--muted);font-size:.86em}
.hb-t{height:10px;border-radius:6px;background:var(--track,color-mix(in srgb,var(--muted) 15%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:0;border-radius:inherit;transition:width .9s var(--ease);transition-delay:var(--d)}
.hbars.go .hb-t i{width:var(--w)}
.hb b{font-variant-numeric:tabular-nums}
/* popovers, notifications and command search */
.pop{position:fixed;z-index:90;background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -12px rgba(0,0,0,.35);width:min(340px,calc(100vw - 16px));animation:popin .22s var(--ease);overflow:hidden}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notes{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.notes button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:9px;font-size:.88em;color:var(--text)}
.notes button:hover{background:var(--hover,color-mix(in srgb,var(--accent) 8%,transparent))}
.notes small{display:block;color:var(--muted);font-size:.85em}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.notes .unread .nd{background:var(--accent)}
.notes .unread button{font-weight:600}
.cmdk .dlg-b{padding:12px}
.cmd-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmd-list button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;color:var(--text)}
.cmd-list [aria-selected=true] button{background:var(--accent);color:var(--accent-ink)}
.cmd-list small{opacity:.7}
.cmd-hint{margin:10px 2px 0;font-size:.78em;color:var(--muted)}
/* mobile nav scrim */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s;border:0;padding:0;width:100%}
body.nav-open .scrim{opacity:1;pointer-events:auto}
/* reduced motion: keep every function, drop the big movement */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}}
/* ---------- Plotline layout ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.top{position:sticky;top:0;z-index:50;background:var(--head);color:var(--head-ink);box-shadow:0 3px 0 var(--accent)}
.top-in{display:flex;align-items:center;gap:16px;padding:0 22px;height:60px;max-width:1500px;margin:0 auto}
.brand{display:flex;gap:9px;align-items:center;color:#fff;text-decoration:none;flex:none}
.brand svg{width:34px;height:34px}
.brand b{font-size:1.25em;letter-spacing:-.01em}
.nav{position:relative;display:flex;align-self:stretch;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:0 13px;color:var(--head-ink);text-decoration:none;font-weight:600;font-size:.92em;white-space:nowrap;transition:color .2s}
.nav a:hover{color:#fff}

/* ---------- Count-up numbers ---------- */
const FMT = { int: fmt, money: (n) => money(n), msh: (n) => money(n, true), short, pct: (n) => Math.round(n) + "%", h: (n) => nf1.format(n) + "h", dec: (n) => nf1.format(n) };
const countMem = new Map();
function countUp(root, quiet) {
  $$("[data-count]", root).forEach((el) => {
    const to = +el.dataset.count, f = FMT[el.dataset.f] || fmt, key = el.dataset.key;
    const from = quiet && key && countMem.has(key) ? countMem.get(key) : quiet ? to : 0;

/* ---------- Popovers: bell list, menus ---------- */
let pop = null;
function closePop() { if (pop) { const p = pop; pop = null; p.el.remove(); if (p.anchor && p.anchor.isConnected) p.anchor.setAttribute("aria-expanded", "false"); } }
function popover(anchor, html, cls = "") {

/* ---------- Command search (Ctrl+K) ---------- */
function palette() {
  if (modals.length) return;
  const items = [...Object.entries(APP.pages).filter(([, p]) => !p.hidden).map(([k, p]) => ({ label: p.title, hint: "Page", run: () => go("#/" + k) })), ...(APP.search ? APP.search() : []), { label: "Toggle light / dark theme", hint: "Action", run: () => Theme.toggle() }];
  const m = modal({ title: "Search", cls: "cmdk", body: `<label class="search big">${ic("search")}<span class="sr">Search pages and records</span><input type="search" placeholder="Jump to a page, person or record…" autofocus></label><ul class="cmd-list" role="listbox" aria-label="Results"></ul><p class="cmd-hint">↑ ↓ to move · Enter to open · Esc to close</p>` });
  const inp = $("input", m.el), list = $(".cmd-list", m.el);
  let sel = 0, cur = [];
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    cur = items.filter((i) => !q || (i.label + " " + i.hint).toLowerCase().includes(q)).slice(0, 9);
    sel = clamp(sel, 0, Math.max(0, cur.length - 1));
    list.innerHTML = cur.length ? cur.map((i, k) => `<li role="option" aria-selected="${k === sel}"><button type="button" data-k="${k}" tabindex="-1"><span>${esc(i.label)}</span><small>${esc(i.hint)}</small></button></li>`).join("") : `<li class="empty">No matches</li>`;
  };
  const run = (k) => { const it = cur[k]; if (it) { m.close(); it.run(); } };
  inp.addEventListener("input", () => { sel = 0; draw(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(cur.length - 1, sel + 1); draw(); }
    if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  list.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) run(+b.dataset.k); });
  draw();
}

    fields: [{ k: "client", label: "Client", req: true }, { k: "listing", label: "Listing", type: "select", opts: DB.listings.map((l) => ({ v: l.id, l: l.id + " · " + l.title })) }, { k: "value", label: "Agreed value (Rs)", type: "number", min: 1000, max: 5000000000, req: true, half: true }, { k: "stage", label: "Stage", type: "select", opts: STAGES.map((s, i) => ({ v: i, l: s })), half: true }, { k: "agent", label: "Agent", type: "select", opts: DB.agents.map((a) => ({ v: a.id, l: a.name })), half: true }, { k: "next", label: "Next step on", type: "date", req: true, half: true }],
    values: d || { stage: 0, next: iso(addDays(TODAY, 2)), agent: DB.agents[0].id, listing: DB.listings[0].id, value: DB.listings[0].price },
    onSave: (x) => { x.stage = +x.stage; x.mode = (lById(x.listing) || { mode: "sale" }).mode; if (d) Object.assign(d, x); else DB.deals.push(Object.assign({ id: "DL-" + rint(800, 999), lead: "" }, x)); landed = d ? d.id : null; save(); toast(d ? "Deal saved" : "Deal created"); refresh(); },
    onDelete: d ? () => { DB.deals.splice(DB.deals.indexOf(d), 1); save(); toast("Deal deleted"); refresh(); } : null,
  });
}

/* ---------- Page: Leads ---------- */
function pgLeads(v) {
  v.innerHTML = head("Leads", `${DB.leads.filter((l) => l.heat === "Hot").length} hot leads`, `<button type="button" class="btn pri" data-act="new">${ic("plus")}Add lead</button>`) + `<section class="grid"><article class="card s12"><div id="lt"></div></article></section>`;
  dataTable($("#lt", v), { id: "leads", label: "Leads", pageSize: 10, sort: "added", dir: -1, chips: { k: "heat", opts: ["Hot", "Warm", "Cold", "New"] }, rows: () => DB.leads, onRow: (l) => leadForm(l), cols: [{ k: "name", label: "Name", fmt: (x, l) => `<div class="who-c">${av(x)}<div><b>${esc(x)}</b><small>${esc(l.phone)}</small></div></div>` }, { k: "want", label: "Wants", fmt: (x, l) => `${esc(x)} · ${esc(l.type)}` }, { k: "area", label: "Area" }, { k: "budget", label: "Budget", num: true, fmt: (x) => money(x, true) }, { k: "agent", label: "Agent", val: (l) => (aById(l.agent) || { name: "" }).name, fmt: (x, l) => esc((aById(l.agent) || { name: "—" }).name) }, { k: "heat", label: "Heat", fmt: (x) => tag(x, tone(x)) }, { k: "id", label: "Chat", sort: false, fmt: (x) => `<button type="button" class="btn sm ghost" data-chat="${x}" aria-label="Open chat">${ic("chat")}</button>` }] });
  v.addEventListener("click", (e) => { if (e.target.closest('[data-act="new"]')) leadForm(); const c = e.target.closest("[data-chat]"); if (c) { const ld = DB.leads.find((x) => x.id === c.dataset.chat); let cv = DB.convs.find((x) => x.lead === ld.id); if (!cv) { cv = { id: "c" + uid(), lead: ld.id, name: ld.name, listing: ld.listing, online: false, unread: 0, msgs: [] }; DB.convs.unshift(cv); save(); } chatOpen = cv.id; go("#/chat"); } });
}
function leadForm(l) {
  formModal({ title: l ? l.name : "Add lead", side: true, save: l ? "Save" : "Add", fields: [{ k: "name", label: "Name", req: true }, { k: "phone", label: "Phone", req: true, pattern: "^[0-9+ -]{7,16}$", patternMsg: "Digits, spaces or dashes" }, { k: "want", label: "Wants to", type: "select", opts: ["Buy", "Rent", "Sell"], half: true }, { k: "type", label: "Type", type: "select", opts: TYPES, half: true }, { k: "area", label: "Area", type: "select", opts: AREAS.map((a) => a[0]), half: true }, { k: "budget", label: "Budget (Rs)", type: "number", min: 10000, max: 5000000000, req: true, half: true }, { k: "heat", label: "Heat", type: "select", opts: ["Hot", "Warm", "Cold", "New"], half: true }, { k: "agent", label: "Agent", type: "select", opts: DB.agents.map((a) => ({ v: a.id, l: a.name })), half: true }], values: l || { want: "Buy", type: "House", area: "Gulberg", heat: "New", agent: DB.agents[0].id, budget: 25000000 }, onSave: (d) => { if (l) Object.assign(l, d); else DB.leads.unshift(Object.assign({ id: "LE-" + rint(400, 999), added: iso(TODAY), listing: DB.listings[0].id }, d)); save(); toast(l ? "Lead saved" : "Lead added"); refresh(); }, onDelete: l ? () => { DB.leads.splice(DB.leads.indexOf(l), 1); save(); toast("Lead deleted"); refresh(); } : null });
}

/* ---------- Page: Chat (live) ---------- */
let chatOpen = null;
const REPLIES = ["That sounds good, thank you!", "Can you send more pictures of the kitchen?", "Is parking included?", "We can come at 5pm.", "Please share the owner's final price."];
function pgChat(v) {
  if (!DB.convs.find((c) => c.id === chatOpen)) chatOpen = DB.convs[0] && DB.convs[0].id;
  const c = DB.convs.find((x) => x.id === chatOpen);
  if (c) c.unread = 0;
  save(); chatCount();
  const l = c && lById(c.listing);
  v.innerHTML = head("Chat", "Live chat with buyers and tenants") + `<section class="card chat enter"><div class="convs" role="group" aria-label="Conversations">${DB.convs.map((x) => `<button type="button" data-c="${x.id}" aria-pressed="${x.id === chatOpen}">${av(x.name)}${x.online ? '<span class="on" aria-label="online"></span>' : ""}<div><b>${esc(x.name)}</b><small>${esc((x.msgs[x.msgs.length - 1] || { txt: "Say hello" }).txt)}</small></div>${x.unread ? `<span class="un">${x.unread}</span>` : ""}</button>`).join("")}</div>
    <div class="thread">${c ? `<div class="th-h">${av(c.name)}<div><b>${esc(c.name)}</b><small>${c.online ? "Online now" : "Last seen " + ago(Date.now() - 36e5 * 2)}</small></div><span class="sp"></span><button type="button" class="btn sm" data-act="share">${ic("home")}Share listing</button><button type="button" class="btn sm" data-act="book">${ic("key")}Book viewing</button></div><div class="msgs" id="msgs" aria-live="polite">${c.msgs.map(msgHTML).join("")}</div><form class="composer" id="comp"><label class="sr" for="mIn">Message</label><input id="mIn" placeholder="Type a message…" autocomplete="off" maxlength="400"><button type="submit" class="btn pri">${ic("send")}<span class="sr">Send</span></button></form>` : `<div class="empty">${ic("chat")}<b>No chats yet</b></div>`}</div>
    <aside class="ctx" aria-label="Listing in this chat">${l ? `<div class="art">${art(l, 240, 110)}</div><b>${esc(l.title)}</b><span class="muted">${esc(priceTxt(l))} · ${esc(l.area)}</span>${tag(l.status, tone(l.status))}<button type="button" class="btn sm" data-open="${l.id}">Open listing</button>` : `<span class="muted">No listing linked</span>`}</aside></section>`;
  const box = $("#msgs", v);
  if (box) box.scrollTop = box.scrollHeight;
  const push = (m) => { c.msgs.push(m); save(); if (box.isConnected) { box.insertAdjacentHTML("beforeend", msgHTML(m)); box.scrollTop = box.scrollHeight; } };
  const reply = () => { const ty = document.createElement("div"); ty.className = "typing"; ty.innerHTML = "<i></i><i></i><i></i>"; setTimeout(() => { if (box.isConnected) { box.append(ty); box.scrollTop = box.scrollHeight; } }, 500); setTimeout(() => { ty.remove(); push({ who: "them", t: Date.now(), txt: pick(REPLIES) }); }, 2000); };
  if (c) $("#comp", v).onsubmit = (e) => { e.preventDefault(); const i = $("#mIn", v), t = i.value.trim(); if (!t) return; push({ who: "me", t: Date.now(), txt: t }); i.value = ""; reply(); };
  v.addEventListener("click", (e) => {
    const b = e.target.closest("[data-c]"); if (b) { chatOpen = b.dataset.c; refresh(); return; }
    const o = e.target.closest("[data-open]"); if (o) openListing(lById(o.dataset.open));
    const a = e.target.closest("[data-act]"); if (!a || !c) return;
    if (a.dataset.act === "share") formModal({ title: "Share a listing", cls: "sm", save: "Share", fields: [{ k: "l", label: "Listing", type: "select", opts: DB.listings.filter((x) => x.status === "Active").map((x) => ({ v: x.id, l: x.title + " · " + priceTxt(x) })) }], onSave: (d) => { const x = lById(d.l); c.listing = x.id; push({ who: "me", t: Date.now(), txt: "Have a look at this one:", lst: x.id }); reply(); setTimeout(refresh, 50); } });
    if (a.dataset.act === "book") viewingForm(c.listing, c.name, (vw) => { push({ who: "sys", t: Date.now(), txt: `Viewing booked for ${dshort(vw.date)} at ${vw.time}` }); });
  });
  every(20000, () => { const x = pick(DB.convs.filter((z) => z.id !== chatOpen)); if (!x) return; x.msgs.push({ who: "them", t: Date.now(), txt: pick(["Hello, any update?", "Is the owner flexible on price?", "Can I bring my family to the viewing?"]) }); x.unread++; x.online = true; save(); chatCount(); notify("New message from " + x.name, "info", "#/chat"); const bt = $(`[data-c="${x.id}"]`, v); if (bt) { const u = $(".un", bt); if (u) u.textContent = x.unread; else bt.insertAdjacentHTML("beforeend", `<span class="un">${x.unread}</span>`); } });
}
const msgHTML = (m) => { const l = m.lst && lById(m.lst); return `<div class="msg ${m.who === "me" ? "me" : m.who === "sys" ? "sys" : "them"}">${esc(m.txt)}${l ? `<span class="lst">${art(l, 64, 44)}<span><b>${esc(l.title)}</b><br>${esc(priceTxt(l))}</span></span>` : ""}<small>${ago(m.t)}</small></div>`; };

/* ---------- Page: Viewings ---------- */
function pgViewings(v) {
  const up = DB.viewings.filter((x) => x.date >= iso(TODAY)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)), days = [...new Set(up.map((x) => x.date))];
  v.innerHTML = head("Viewings", `${up.length} coming up`, `<button type="button" class="btn pri" data-act="new">${ic("plus")}Book viewing</button>`) +
    `<section class="grid"><article class="card s8"><div class="agenda">${days.map((d) => `<div class="ag-day"><h3>${dlong(d)}</h3>${up.filter((x) => x.date === d).map((x) => { const l = lById(x.listing); return `<div class="ag"><span class="t">${x.time}</span>${l ? `<span class="art">${art(l, 70, 48)}</span>` : ""}<div><b>${esc(x.client)}</b><small>${l ? esc(l.title) : "Listing removed"} · ${esc((aById(x.agent) || { name: "" }).name)}</small></div><button type="button" class="btn sm" data-done="${x.id}">${ic("check")}Done</button><button type="button" class="btn sm ghost" data-cancel="${x.id}" aria-label="Cancel viewing">${ic("x")}</button></div>`; }).join("")}</div>`).join("") || `<div class="empty">${ic("key")}<b>No viewings booked</b></div>`}</div></article>
    <article class="card s4"><div class="card-h"><h2>Viewings per agent</h2></div><div id="va"></div></article></section>`;
  hbars($("#va", v), DB.agents.map((a, i) => ({ name: a.name, value: DB.viewings.filter((x) => x.agent === a.id).length, color: `var(--c${(i % 6) + 1})` })), fmt);
  v.addEventListener("click", (e) => {
    if (e.target.closest('[data-act="new"]')) viewingForm();
    const d = e.target.closest("[data-done]"); if (d) { const x = DB.viewings.find((y) => y.id === d.dataset.done); DB.viewings.splice(DB.viewings.indexOf(x), 1); const dl = DB.deals.find((z) => z.listing === x.listing && z.stage < 2); if (dl) dl.stage = 2; save(); toast(dl ? "Viewing done, deal moved to Offer" : "Viewing marked done"); refresh(); }
    const c = e.target.closest("[data-cancel]"); if (c) confirmBox("Cancel this viewing?", { title: "Cancel viewing?", ok: "Cancel viewing" }).then((ok) => { if (!ok) return; const i = DB.viewings.findIndex((y) => y.id === c.dataset.cancel), x = DB.viewings[i]; DB.viewings.splice(i, 1); save(); toast("Viewing cancelled", { undo: () => { DB.viewings.splice(i, 0, x); save(); refresh(); } }); refresh(); });
  });
}
function viewingForm(listing, client, after) {
  formModal({ title: "Book a viewing", save: "Book", fields: [{ k: "listing", label: "Listing", type: "select", opts: DB.listings.map((l) => ({ v: l.id, l: l.title })) }, { k: "client", label: "Client", req: true }, { k: "date", label: "Date", type: "date", req: true, half: true, check: (x) => (x < iso(TODAY) ? "Pick today or later" : "") }, { k: "time", label: "Time", type: "time", req: true, half: true }, { k: "agent", label: "Agent", type: "select", opts: DB.agents.map((a) => ({ v: a.id, l: a.name })) }], values: { listing: listing || DB.listings[0].id, client: client || "", date: iso(addDays(TODAY, 1)), time: "11:00", agent: (lById(listing) || { agent: DB.agents[0].id }).agent }, onSave: (d) => { const vw = Object.assign({ id: uid(), done: false }, d); DB.viewings.push(vw); save(); notify(`Viewing booked: ${d.client} on ${dshort(d.date)}`, "ok", "#/viewings"); toast("Viewing booked"); if (after) after(vw); else refresh(); } });
}

/* ---------- Page: Agents ---------- */
function pgAgents(v) {
  const rows = DB.agents.map((a, i) => { const ds = DB.deals.filter((d) => d.agent === a.id); return { a, i, closed: ds.filter((d) => d.stage === 5).length, open: ds.filter((d) => d.stage < 5).length, fees: sum(ds.filter((d) => d.stage === 5), fee), pipe: sum(ds.filter((d) => d.stage < 5), fee), listings: DB.listings.filter((l) => l.agent === a.id).length }; });
  v.innerHTML = head("Agents", "Who is closing and what is in their pipeline") + `<section class="grid"><article class="card s7"><div class="card-h"><h2>Fees earned and in pipeline</h2></div><div id="af"></div></article><article class="card s5"><div class="card-h"><h2>Share of listings</h2></div><div id="al"></div></article><article class="card s12"><ul class="list">${rows.map((r) => `<li>${av(r.a.name)}<div><b>${esc(r.a.name)}</b><small>${r.listings} listings · ${r.open} open deals · ${r.closed} closed of ${r.a.target} target</small></div>${bar(r.closed / r.a.target, r.closed >= r.a.target ? "ok" : "")}<b style="min-width:90px;text-align:right">${money(r.fees, true)}</b></li>`).join("")}</ul></article></section>`;
  barChart($("#af", v), { labels: rows.map((r) => r.a.name.split(" ")[0]), stacked: true, h: 230, fmt: (n) => money(n, true), tipFmt: (n) => money(n), label: "Fees per agent", series: [{ name: "Earned", data: rows.map((r) => r.fees), color: "var(--c1)" }, { name: "In pipeline", data: rows.map((r) => r.pipe), color: "var(--c3)" }] });
  donut($("#al", v), { items: rows.map((r, i) => ({ name: r.a.name, value: r.listings, color: `var(--c${(i % 6) + 1})` })), sub: "listings", label: "Listings per agent" });
}

/* ---------- Page: Settings ---------- */
function pgSettings(v) {
  const s = DB.settings, f = [{ k: "agency", label: "Agency name", req: true }, { k: "saleFee", label: "Sale fee (% of price)", type: "number", min: 0, max: 5, step: 0.1, req: true, half: true }, { k: "rentFee", label: "Rent fee (% of one month)", type: "number", min: 0, max: 300, req: true, half: true }];
  v.innerHTML = head("Settings") + `<section class="grid"><article class="card s7"><div class="card-h"><h2>Agency</h2></div><form class="form" id="sf" novalidate>${f.map((x) => fieldHTML(x, s[x.k])).join("")}<div class="fld"><button class="btn pri" type="submit">Save</button></div></form></article><article class="card s5"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Day map or night map</small></div><button type="button" class="btn" data-theme-toggle>${ic("moon", "i-moon")}${ic("sun", "i-sun")}Switch</button></div><div class="set-row"><div><b>Export</b><small>JSON of the demo</small></div><button type="button" class="btn" data-act="json">${ic("download")}Download</button></div><div class="set-row"><div><b>Reset demo</b><small>Restore sample listings</small></div><button type="button" class="btn danger ghost" data-reset>Reset</button></div></article></section>`;
  Theme.set(Theme.get(), false);
  $("#sf", v).onsubmit = (e) => { e.preventDefault(); const d = readForm(e.target, f); if (d) { Object.assign(s, d); save(); toast("Saved, fees recalculated"); } };
  v.addEventListener("click", (e) => { if (e.target.closest('[data-act="json"]')) download("plotline-data.json", JSON.stringify(DB, null, 2), "application/json"); });
}

const APP = {
  key: "plotline", name: "Plotline", v: 1, seedNo: 71, home: "overview", navAxis: "x", seed: seedData,
  pages: { overview: { title: "Overview", render: pgOverview }, listings: { title: "Listings", render: pgListings }, deals: { title: "Deals", render: pgDeals }, leads: { title: "Leads", render: pgLeads }, chat: { title: "Chat", render: pgChat }, viewings: { title: "Viewings", render: pgViewings }, agents: { title: "Agents", render: pgAgents }, settings: { title: "Settings", render: pgSettings } },
  search: () => [...DB.listings.map((l) => ({ label: l.title, hint: l.id + " · " + priceTxt(l), run: () => openListing(l) })), ...DB.leads.map((l) => ({ label: l.name, hint: "Lead · " + l.heat, run: () => { go("#/leads"); setTimeout(() => leadForm(l), 60); } }))],
  afterRender: () => chatCount(),
};
boot();
chatCount();
</script>
</body>
</html>
