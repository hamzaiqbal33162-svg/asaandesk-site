<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">

<title>Photo Pinch · delete photos from a grid</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: warm sunset ---------- */
  :root {
    color-scheme: light;
    --bg: #fbf1ea;
    --bg2: #ffe1d2;
    --card: #fffaf7;
    --line: #f1e2d8;
    --ink: #2a1720;
    --muted: #87707a;
    --rose: #f43f5e;
    --peach: #fb923c;
    --sel: #2f6bff;
    --sh: 120, 50, 40;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #150c14;
    --bg2: #2c1220;
    --card: #1e121b;
    --line: #34202d;
    --ink: #fbeef2;
    --muted: #b8a0ab;
    --rose: #ff5c79;
    --peach: #fdba74;
    --sel: #6d9bff;
    --sh: 0, 0, 0;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .frame { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 20px 16px; overflow: hidden; overflow: clip; background: radial-gradient(120% 70% at 50% 0%, var(--bg2), var(--bg) 70%); }

  .card {
    position: relative;
    width: min(470px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 16px 16px 12px;
    box-shadow: 0 44px 80px -52px rgba(var(--sh), .6), 0 2px 8px -4px rgba(var(--sh), .14);
  }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 0 2px; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.015em; }
  .top p { margin: 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sel-btn { margin-left: auto; border: 0; border-radius: 99px; padding: 8px 15px; font: inherit; font-size: 13.5px; font-weight: 750; cursor: pointer; color: var(--ink); background: color-mix(in srgb, var(--peach) 22%, var(--card)); transition: background-color .25s, color .25s, scale .2s var(--spring); }
  .sel-btn:active, .sel-btn.pressed { scale: .92; }
  .selecting .sel-btn { background: var(--ink); color: var(--card); }

  /* ---------- Photo grid ---------- */
  /* square grid area: deleting a whole row never changes the card height (the bin stays put) */
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 6px; aspect-ratio: 1; }
  .cell { position: relative; aspect-ratio: 1; }
  .cell[hidden] { display: none; }
  /* overflow hidden so a restored photo is clipped into a round bead while it grows back */
  .tile { position: relative; display: block; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 12px; background: var(--line); cursor: pointer; overflow: hidden; }
  .ph { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; transition: scale .35s var(--spring), border-radius .35s; }
  .ph svg { width: 100%; height: 100%; display: block; animation: drift 9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -1.1s); }
  .tile:hover .ph { scale: 1.02; }
  .cell.sel .ph { scale: .86; border-radius: 16px; }
  .cell.sel .tile::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 2.5px var(--sel); opacity: .7; }
  .chk { position: absolute; right: 7px; top: 7px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; background: rgba(0, 0, 0, .22); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); opacity: 0; scale: .3; transition: opacity .2s, scale .35s var(--spring), background-color .2s; transition-delay: calc(var(--i) * 30ms); }
  .chk svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s; }
  .selecting .chk { opacity: 1; scale: 1; }
  .cell.sel .chk { background: var(--sel); border-color: #fff; scale: 1.08; transition-delay: 0s; }
  .cell.sel .chk svg { opacity: 1; }
  .tile:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- Action bar and toast share one slot ---------- */
  .slot { position: relative; height: 56px; margin-top: 12px; overflow: hidden; }
  .bar, .toast { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; border-radius: 15px; transform: translateY(120%); opacity: 0; transition: transform .45s var(--spring), opacity .25s, visibility 0s .45s; visibility: hidden; }
  .bar { padding: 0 6px 0 14px; background: color-mix(in srgb, var(--peach) 14%, var(--card)); border: 1px solid var(--line); }
  .bar.show, .toast.show { transform: none; opacity: 1; visibility: visible; transition: transform .45s var(--spring), opacity .25s, visibility 0s; }
  .bar span, .toast span { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .del { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 11px; padding: 10px 15px; font: inherit; font-size: 14px; font-weight: 780; color: #fff; background: linear-gradient(135deg, var(--peach), var(--rose)); box-shadow: 0 10px 18px -12px var(--rose); cursor: pointer; transition: scale .2s var(--spring), filter .2s, opacity .2s; }
  .del:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .del:not(:disabled):active, .del.pressed { scale: .93; }
  .del svg, .toast svg { width: 19px; height: 19px; overflow: visible; }
  .binlid { transform-box: fill-box; transform-origin: 0 100%; transition: rotate .3s var(--spring); }
  .del.hungry .binlid { rotate: -28deg; }
  .toast { padding: 0 6px 0 12px; background: #2a1720; color: #fdf0f3; }
  :root[data-theme="dark"] .toast { background: #3f2333; }
  .undo { border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 780; background: #ffd0b8; color: #2a1720; cursor: pointer; transition: scale .2s var(--spring); }
  .undo:active, .undo.pressed { scale: .9; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- Pinched beads and the pinch fingers ---------- */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .ghost { position: absolute; overflow: hidden; border-radius: 12px; box-shadow: 0 12px 24px -12px rgba(0, 0, 0, .45); }
  .ghost svg { width: 100%; height: 100%; display: block; }
  .finger { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: rgba(255, 255, 255, .85); box-shadow: 0 0 0 2px rgba(47, 107, 255, .6), 0 4px 10px rgba(0, 0, 0, .25); }
  .drop { position: absolute; width: 6px; height: 6px; border-radius: 50%; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes drift { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.1) translate(-2.5%, 1.5%); } }

  /* Calm mode: every step still happens, without the big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <main class="card" id="card" aria-labelledby="title">
    <header class="top">
      <div>
        <h1 id="title">Hunza trip</h1>
        <p id="sub">9 photos · 39.9 MB</p>
      </div>
      <button class="sel-btn" id="selBtn" type="button" aria-pressed="false">Select</button>
    </header>
    <ul class="grid" id="grid" aria-label="Photos"></ul>
    <div class="slot">
      <div class="bar" id="bar">
        <span id="barText">Tap photos to select</span>
        <button class="del" id="delBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="binlid" d="M4 7h16M9 7V4.5h6V7" /><path d="M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5" /></svg>
          Delete
        </button>
      </div>
      <div class="toast" id="toast">
        <svg id="toastBin" viewBox="0 0 24 24" fill="none" stroke="#ffd0b8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5" /></svg>
        <span id="toastText">Deleted</span>
        <button class="undo" id="undoBtn" type="button">Undo</button>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>
  <div class="layer" id="layer" aria-hidden="true"></div>
</div>

<script>
  // ---------- Photo Pinch: pick photos, they pinch into beads, drop in the bin, and the grid closes up ----------
  (function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const frame = $("frame"), card = $("card"), layer = $("layer"), grid = $("grid"), selBtn = $("selBtn"), sub = $("sub");
    const bar = $("bar"), barText = $("barText"), delBtn = $("delBtn"), toast = $("toast"), toastText = $("toastText"), toastBin = $("toastBin"), undoBtn = $("undoBtn"), status = $("status");

    // ---------- Nine drawn photos (SVG scenes, no image files) ----------
    const PHOTOS = [
      { name: "Lake at noon", kind: "lake", sky: ["#7dd3fc", "#e0f2fe"], a: "#0e7490", b: "#164e63", sun: "#fffbe6", mb: 4.2 },
      { name: "Pink peaks", kind: "peaks", sky: ["#fda4af", "#fde68a"], a: "#7c3aed", b: "#4c1d95", sun: "#fff1c1", mb: 5.1 },
      { name: "Desert road", kind: "dunes", sky: ["#fdba74", "#fef3c7"], a: "#ea580c", b: "#9a3412", sun: "#fffbeb", mb: 3.6 },
      { name: "Kite day", kind: "kites", sky: ["#93c5fd", "#e0f2fe"], a: "#4ade80", b: "#15803d", mb: 2.9 },
      { name: "Night sky", kind: "night", sky: ["#1e1b4b", "#4338ca"], a: "#0f172a", b: "#1e293b", sun: "#fef9c3", mb: 6.4 },
      { name: "Pine valley", kind: "forest", sky: ["#a7f3d0", "#f7fee7"], a: "#15803d", b: "#14532d", mb: 4.8 },
      { name: "Sunset sea", kind: "sea", sky: ["#f472b6", "#fb923c"], a: "#2563eb", b: "#1e3a8a", sun: "#fde68a", mb: 3.3 },
      { name: "Old city", kind: "city", sky: ["#fcd34d", "#fff7d6"], a: "#9a3412", b: "#7c2d12", sun: "#ffffff", mb: 5.6 },
      { name: "Hill farm", kind: "hills", sky: ["#bae6fd", "#f0f9ff"], a: "#84cc16", b: "#3f6212", sun: "#fef08a", mb: 4.0 }
    ];
    let uid = 0;
    function scene(p) {
      const k = "s" + uid++;
      const sky = `<defs><linearGradient id="${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#${k})"/>`;
      const sun = p.sun ? `<circle cx="72" cy="28" r="15" fill="${p.sun}" opacity=".35"/><circle cx="72" cy="28" r="9" fill="${p.sun}"/>` : "";
      let body = "";
      switch (p.kind) {
        case "lake":
          body = `<path d="M0 66L18 40L30 54L48 30L64 52L80 38L100 60V70H0z" fill="${p.a}"/><path d="M44 36l4-6 4 6-4-2z" fill="#fff"/><rect y="66" width="100" height="34" fill="#38bdf8"/><path d="M8 76h22M50 82h30M18 90h26M64 72h20" stroke="#fff" stroke-width="1.6" opacity=".55" stroke-linecap="round"/>`;
          break;
        case "peaks":
          body = `<path d="M0 78L20 46L32 60L50 22L68 56L82 40L100 64V100H0z" fill="${p.a}"/><path d="M44 34L50 22L56 34L51 31L48 35z" fill="#fff"/><path d="M0 88Q30 72 55 84T100 80V100H0z" fill="${p.b}"/>`;
          break;
        case "dunes":
          body = `<path d="M0 70Q28 54 52 66T100 60V100H0z" fill="${p.a}"/><path d="M0 84Q40 70 70 86T100 82V100H0z" fill="${p.b}"/><path d="M50 100L58 70" stroke="#fde68a" stroke-width="3" stroke-dasharray="4 4"/>`;
          break;
        case "kites":
          body = `<path d="M0 80Q35 66 60 78T100 74V100H0z" fill="${p.a}"/><path d="M0 92Q40 82 100 90V100H0z" fill="${p.b}"/>
            <g><rect x="22" y="22" width="12" height="12" fill="#f43f5e" transform="rotate(45 28 28)"/><path d="M28 36q-3 8 2 14t-1 14" stroke="#f43f5e" fill="none" stroke-width="1.2"/></g>
            <g><rect x="60" y="16" width="10" height="10" fill="#facc15" transform="rotate(45 65 21)"/><path d="M65 28q4 7-1 12t2 12" stroke="#ca8a04" fill="none" stroke-width="1.2"/></g>
            <g><rect x="78" y="38" width="8" height="8" fill="#8b5cf6" transform="rotate(45 82 42)"/><path d="M82 48q-2 6 2 10" stroke="#8b5cf6" fill="none" stroke-width="1.2"/></g>`;
          break;
        case "night":
          body = `<g fill="#fff">${[[12, 14], [28, 30], [44, 10], [58, 34], [86, 12], [92, 40], [20, 46], [36, 20]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 0.8 : 1.3}"/>`).join("")}</g><path d="M0 76L24 58L40 68L60 50L80 66L100 56V100H0z" fill="${p.b}"/><path d="M0 88Q40 76 100 86V100H0z" fill="${p.a}"/>`;
          break;
        case "forest":
          body = `<path d="M0 70Q50 58 100 70V100H0z" fill="#86efac"/>${[[10, 62, 1], [24, 56, 1.3], [40, 64, 1], [58, 54, 1.4], [74, 62, 1.1], [90, 58, 1.2]].map(([x, y, s]) => `<path d="M${x} ${y - 22 * s}L${x + 9 * s} ${y + 14}H${x - 9 * s}z" fill="${p.a}"/>`).join("")}<path d="M0 86Q50 76 100 86V100H0z" fill="${p.b}"/>`;
          break;
        case "sea":
          body = `<rect y="62" width="100" height="38" fill="${p.a}"/><path d="M60 62h24" stroke="${p.sun}" stroke-width="2.4"/><path d="M64 68h16M68 74h8" stroke="${p.sun}" stroke-width="1.6" opacity=".7"/><path d="M0 84q12-4 25 0t25 0 25 0 25 0V100H0z" fill="${p.b}"/>`;
          break;
        case "city":
          body = `<g fill="${p.a}"><rect x="6" y="56" width="14" height="44"/><rect x="22" y="48" width="10" height="52"/><path d="M36 64a12 12 0 0 1 24 0V100H36z"/><rect x="46" y="38" width="4" height="26"/><rect x="62" y="52" width="12" height="48"/><rect x="78" y="60" width="16" height="40"/></g><g fill="#fde68a" opacity=".8"><rect x="10" y="62" width="3" height="4"/><rect x="25" y="56" width="3" height="4"/><rect x="66" y="58" width="3" height="4"/><rect x="83" y="66" width="3" height="4"/></g><rect y="92" width="100" height="8" fill="${p.b}"/>`;
          break;
        default:
          body = `<path d="M0 66Q30 50 58 64T100 58V100H0z" fill="${p.a}"/><path d="M0 82Q36 66 64 80T100 76V100H0z" fill="${p.b}"/><path d="M30 100Q40 86 56 82T76 70" stroke="#fef3c7" stroke-width="3" fill="none"/><path d="M70 62h10v8H70z" fill="#fff"/><path d="M68 63l7-6 7 6z" fill="#ef4444"/>`;
      }
      return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${sky}${sun}${body}</svg>`;
    }

    const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
    const calm = () => calmQ.matches;
    const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 200) : ms));
    const SPRING = CSS.supports("transition-timing-function", "linear(0, 1)")
      ? "linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1)"
      : "cubic-bezier(.34, 1.56, .64, 1)";
    function play(el, frames, opts) {
      if (calm() || !el.animate) return Promise.resolve();
      const a = el.animate(frames, opts);
      return new Promise((res) => { a.onfinish = res; a.oncancel = res; });
    }
    const say = (m) => { if (!demo.on) status.textContent = m; };
    const press = (el) => { el.classList.add("pressed"); setTimeout(() => el.classList.remove("pressed"), 170); };
    function centerOf(el) { const r = el.getBoundingClientRect(), f = frame.getBoundingClientRect(); return { x: r.left - f.left + r.width / 2, y: r.top - f.top + r.height / 2 }; }
    const mb = (v) => v.toFixed(1) + " MB";

    // ---------- Build the grid ----------
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const cells = PHOTOS.map((p, i) => {
      const li = document.createElement("li");
      li.className = "cell";
      li.dataset.i = i;
      li.style.setProperty("--i", i);
      li.innerHTML = `<button class="tile" type="button" aria-pressed="false" aria-label="${p.name}, ${mb(p.mb)}"><span class="ph">${scene(p)}</span><span class="chk" aria-hidden="true">${CHECK}</span></button>`;
      grid.appendChild(li);
      return li;
    });
    const S = { selecting: false, sel: new Set(), busy: false, history: [] };
    const visible = () => cells.filter((c) => !c.hidden);

    function updateText() {
      const vis = visible(), total = vis.reduce((t, c) => t + PHOTOS[+c.dataset.i].mb, 0);
      sub.textContent = `${vis.length} photo${vis.length === 1 ? "" : "s"} · ${mb(total)}`;
      const n = S.sel.size, sz = [...S.sel].reduce((t, i) => t + PHOTOS[i].mb, 0);
      barText.textContent = n ? `${n} selected · ${mb(sz)}` : "Tap photos to select";
      delBtn.disabled = !n;
      delBtn.setAttribute("aria-label", n ? `Delete ${n} photo${n === 1 ? "" : "s"}` : "Delete");
    }
    function setSelecting(on) {
      S.selecting = on;
      card.classList.toggle("selecting", on);
      selBtn.textContent = on ? "Done" : "Select";
      selBtn.setAttribute("aria-pressed", String(on));
      if (!on) { S.sel.forEach((i) => markSel(i, false)); S.sel.clear(); }
      if (on) hideToast();
      bar.classList.toggle("show", on);
      updateText();
    }
    function markSel(i, on) {
      const li = cells[i], b = li.querySelector(".tile");
      li.classList.toggle("sel", on);
      b.setAttribute("aria-pressed", String(on));
      if (on) play(li.querySelector(".chk"), [{ transform: "scale(.4)" }, { transform: "scale(1.25)", offset: 0.5 }, { transform: "none" }], { duration: 380, easing: "ease-out" });
    }
    function toggle(i) {
      if (S.busy) return;
      if (!S.selecting) setSelecting(true);
      const on = !S.sel.has(i);
      if (on) S.sel.add(i); else S.sel.delete(i);
      markSel(i, on);
      updateText();
    }
    function flip(mutate) {
      const before = new Map(visible().map((c) => [c, c.getBoundingClientRect()]));
      mutate();
      visible().forEach((c, k) => {
        const a = before.get(c);
        if (!a) return;
        const b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
        if (Math.abs(dx) + Math.abs(dy) < 0.5) return;
        const tilt = Math.max(-7, Math.min(7, dx * 0.04));
        play(c, [{ transform: `translate(${dx}px, ${dy}px) rotate(${tilt}deg)` }, { transform: `translate(${dx * 0.1}px, ${dy * 0.1}px) rotate(${-tilt * 0.3}deg) scale(1.03)`, offset: 0.6 }, { transform: "none" }], { duration: 700, delay: 200 + k * 45, easing: "cubic-bezier(.3, .9, .3, 1)", fill: "backwards" });
      });
    }

    // ---------- Delete: shiver, pinch into a bead, drop into the bin, the grid closes up ----------
    function makeGhost(i) {
      const ph = cells[i].querySelector(".ph"), r = ph.getBoundingClientRect(), f = frame.getBoundingClientRect();
      const g = document.createElement("div");
      g.className = "ghost";
      g.style.cssText = `left:${r.left - f.left}px;top:${r.top - f.top}px;width:${r.width}px;height:${r.height}px;border-radius:16px`;
      g.innerHTML = scene(PHOTOS[i]);
      layer.appendChild(g);
      return { g, x: r.left - f.left, y: r.top - f.top, w: r.width, h: r.height };
    }
    function fingers(o, delay) {
      if (calm()) return;
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      [[-1, -1], [1, 1]].forEach(([sx, sy]) => {
        const f = document.createElement("i");
        f.className = "finger";
        f.style.left = cx + "px";
        f.style.top = cy + "px";
        layer.appendChild(f);
        const off = o.w * 0.36;
        const an = f.animate([
          { transform: `translate(${sx * off}px, ${sy * off}px) scale(.4)`, opacity: 0 },
          { transform: `translate(${sx * off}px, ${sy * off}px) scale(1)`, opacity: 1, offset: 0.25 },
          { transform: `translate(${sx * 6}px, ${sy * 6}px) scale(.9)`, opacity: 1, offset: 0.8 },
          { transform: `translate(${sx * 6}px, ${sy * 6}px) scale(.5)`, opacity: 0 }
        ], { duration: 720, delay, easing: "cubic-bezier(.5, 0, .3, 1)", fill: "backwards" });
        an.onfinish = an.oncancel = () => f.remove();
      });
    }
    function splash(p, color) {
      if (calm()) return;
      for (let k = 0; k < 7; k++) {
        const d = document.createElement("i");
        d.className = "drop";
        d.style.left = p.x - 3 + "px";
        d.style.top = p.y - 3 + "px";
        d.style.background = k % 2 ? color : "#ffd0b8";
        layer.appendChild(d);
        const a = -Math.PI / 2 + (k - 3) * 0.42, dist = 18 + Math.random() * 16;
        const an = d.animate([{ transform: "translate(0, 0)", opacity: 1 }, { transform: `translate(${Math.cos(a) * dist}px, ${Math.sin(a) * dist}px) scale(.4)`, opacity: 0 }], { duration: 480, easing: "cubic-bezier(.2, .8, .3, 1)" });
        an.onfinish = an.oncancel = () => d.remove();
      }
    }
    async function deleteSelected() {
      if (S.busy || !S.sel.size) return;
      S.busy = true;
      const ids = [...S.sel].sort((a, b) => a - b);
      const size = ids.reduce((t, i) => t + PHOTOS[i].mb, 0);
      say(`Deleting ${ids.length} photos`);
      delBtn.classList.add("hungry");
      await Promise.all(ids.map((i, k) => play(cells[i].querySelector(".ph"), [
        { transform: "none" }, { transform: "rotate(-3deg)" }, { transform: "rotate(3deg)" }, { transform: "rotate(-2deg)" }, { transform: "none" }
      ], { duration: 320, delay: k * 50 })));
      const bin = centerOf(delBtn.querySelector("svg"));
      const ghosts = ids.map((i) => makeGhost(i));
      flip(() => ids.forEach((i) => { cells[i].hidden = true; cells[i].classList.remove("sel"); cells[i].querySelector(".tile").setAttribute("aria-pressed", "false"); }));
      await Promise.all(ghosts.map((o, k) => {
        const dx = bin.x - (o.x + o.w / 2), dy = bin.y - (o.y + o.h / 2), delay = k * 140;
        fingers(o, delay);
        return play(o.g, [
          { transform: "none", borderRadius: "16px", offset: 0 },
          { transform: "scale(1.04)", borderRadius: "18px", offset: 0.12 },
          { transform: "scale(.34)", borderRadius: "50%", offset: 0.42, easing: "cubic-bezier(.5, 0, .3, 1)" },
          { transform: "translate(0, -16px) scale(.2)", borderRadius: "50%", offset: 0.56 },
          { transform: `translate(${dx * 0.55}px, ${dy * 0.55 - 80}px) scale(.15)`, borderRadius: "50%", offset: 0.78 },
          { transform: `translate(${dx}px, ${dy}px) scale(.07)`, borderRadius: "50%", offset: 1 }
        ], { duration: 1450, delay, easing: "cubic-bezier(.45, 0, .55, 1)", fill: "both" }).then(() => {
          o.g.remove();
          splash(bin, PHOTOS[ids[k]].sky[0]);
          play(delBtn, [{ transform: "none" }, { transform: "translateY(3px) scale(1.05, .92)" }, { transform: "none" }], { duration: 300, easing: "ease-out" });
        });
      }));
      delBtn.classList.remove("hungry");
      S.history.push(ids);
      S.sel.clear();
      setSelecting(false);
      updateText();
      showToast(`${ids.length} photo${ids.length === 1 ? "" : "s"} deleted · ${mb(size)} freed`);
      say(`${ids.length} photos deleted. Undo is available.`);
      S.busy = false;
    }
    async function undo() {
      if (S.busy || !S.history.length) return;
      S.busy = true;
      const ids = S.history.pop();
      const from = centerOf(toastBin);
      flip(() => ids.forEach((i) => { cells[i].hidden = false; }));
      hideToast();
      updateText();
      await Promise.all(ids.map((i, k) => {
        const t = cells[i].querySelector(".tile"), r = t.getBoundingClientRect(), f = frame.getBoundingClientRect();
        const dx = from.x - (r.left - f.left + r.width / 2), dy = from.y - (r.top - f.top + r.height / 2);
        return play(t, [
          { transform: `translate(${dx}px, ${dy}px) scale(.07)`, borderRadius: "50%", opacity: 0.6 },
          { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - 70}px) scale(.16)`, borderRadius: "50%", opacity: 1, offset: 0.4 },
          { transform: "scale(.36)", borderRadius: "50%", offset: 0.62 },
          { transform: "scale(1.05)", borderRadius: "14px", offset: 0.86 },
          { transform: "none", borderRadius: "12px" }
        ], { duration: 1100, delay: k * 130, easing: "cubic-bezier(.3, .7, .4, 1)", fill: "backwards" });
      }));
      say(`${ids.length} photos restored`);
      S.busy = false;
    }

    let toastTimer = 0;
    function showToast(text) {
      toastText.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 8000);
    }
    function hideToast() { toast.classList.remove("show"); clearTimeout(toastTimer); }

    grid.addEventListener("click", (e) => {
      const t = e.target.closest(".tile");
      if (!t) return;
      toggle(+t.closest(".cell").dataset.i);
    });
    selBtn.addEventListener("click", (e) => { const btn = e.currentTarget; press(btn); if (!S.busy) setSelecting(!S.selecting); });
    delBtn.addEventListener("click", () => { deleteSelected(); });
    undoBtn.addEventListener("click", () => { undo(); });
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Delete" || e.key === "Backspace") && S.selecting && S.sel.size) { e.preventDefault(); deleteSelected(); }
      if (e.key === "Escape" && S.selecting && !S.busy) setSelecting(false);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
    });

    // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
    const demo = { on: true, timer: 0, k: 0 };
    const PLANS = [[1, 5], [0, 4, 8], [3, 7]];
    function stopDemo() { if (!demo.on) return; demo.on = false; clearTimeout(demo.timer); }
    addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
    addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
    function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
    async function runDemo() {
      if (!demo.on) return;
      if (S.busy) return scheduleDemo(600);
      if (S.history.length) { press(undoBtn); await wait(170); await undo(); return scheduleDemo(2200); }
      const plan = PLANS[demo.k % PLANS.length];
      demo.k += 1;
      if (S.selecting) setSelecting(false);
      for (const i of plan) {
        if (!demo.on) return;
        toggle(i);
        await wait(520);
      }
      if (!demo.on) return;
      press(delBtn);
      await wait(180); if (!demo.on) return;
      await deleteSelected();
      scheduleDemo(2300);
    }
    updateText();
    scheduleDemo(450);
  })();
</script>
</body>
</html>
