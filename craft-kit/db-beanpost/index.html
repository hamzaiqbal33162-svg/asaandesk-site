<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-beanpost:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Beanpost look: bold coffee blocks, cream and orange ---------- */
:root {
  --font: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --display: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.6, .55, 1);
  --bg: #f4ead9; --surface: #fffaf1; --surface2: #efe2cc; --ink: #2e1a10; --muted: #7a5e4a; --line: rgba(59, 36, 24, .14); --line-strong: rgba(59, 36, 24, .25);
  --accent: #f26b1d; --accent-ink: #fff; --ok: #1f7a6c; --warn: #c98a12; --err: #c23a2b; --focus: #1f7a6c;
  --c1: #f26b1d; --c2: #1f7a6c; --c3: #f2b134; --c4: #3b2418; --c5: #c95f8c; --c6: #c9b49a;
  --brown: #3b2418; --cream: #fffaf1;
  --r: 8px; --r-sm: 6px; --r-btn: 6px; --r-seg: 6px; --overlay: rgba(46, 26, 16, .5); --tip-bg: #3b2418; --chip-on: #3b2418; --chip-on-ink: #fffaf1;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #1a110c; --surface: #24180f; --surface2: #301f14; --ink: #f6e8d6; --muted: #c2a389; --line: rgba(246, 232, 214, .1); --line-strong: rgba(246, 232, 214, .2);
  --accent: #ff8a3d; --accent-ink: #1a0d05; --ok: #4cc3ad; --warn: #f5c04f; --err: #ff6f5e;
  --c1: #ff8a3d; --c2: #4cc3ad; --c3: #f5c04f; --c4: #8a5a3e; --c5: #e889b2; --c6: #5c4535;
  --brown: #0f0905; --overlay: rgba(0, 0, 0, .6); --tip-bg: #f6e8d6; --tip-ink: #1a110c; --chip-on: #ff8a3d; --chip-on-ink: #1a0d05;
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; }
.skip:focus { left: 8px; }
.grow { flex: 1; } .mut { color: var(--muted); font-size: 13px; }
.btn { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 12.5px; border: 2px solid var(--ink); }
.btn.primary { border-color: var(--accent); }
.btn.danger { border-color: var(--err); }

/* ---------- Header with block navigation ---------- */
.app { min-height: 100vh; overflow-x: clip; }
.hdr { position: sticky; top: 0; z-index: 40; background: var(--brown); color: var(--cream); }
.hdr-row { display: flex; align-items: center; gap: 10px; padding: 12px 28px 6px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
.brand svg { width: 42px; height: 42px; transition: transform .5s var(--spring); }
.brand:hover svg { transform: rotate(-12deg) scale(1.08); }
.brand b { display: block; font-family: var(--display); font-size: 22px; letter-spacing: -.01em; line-height: 1; }
.brand small { display: block; font-size: 12px; opacity: .7; margin-top: 3px; }
.hdr .ibtn { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .15); color: var(--cream); }
.nav { position: relative; display: flex; gap: 4px; padding: 6px 28px 0; max-width: 1440px; margin: 0 auto; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-radius: 8px 8px 0 0; color: rgba(255, 250, 241, .7); text-decoration: none; font-weight: 800; font-size: 13.5px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; transition: color .2s; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a .k-ic { width: 18px; height: 18px; }
.nav .k-marker { position: absolute; left: 0; bottom: 0; top: 6px; border-radius: 8px 8px 0 0; background: var(--bg); transition: transform .45s var(--spring), width .35s var(--ease); z-index: 0; }
.nav-n { font-style: normal; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; }
.nav-n[hidden] { display: none; }
#view { max-width: 1440px; margin: 0 auto; padding: 24px 28px 50px; min-width: 0; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.ph h1 { margin: 0; font-family: var(--display); font-size: 40px; letter-spacing: -.02em; line-height: 1; text-transform: uppercase; }
.ph p { margin: 8px 0 0; color: var(--muted); font-weight: 500; }
.ph-act { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.k-in { animation-name: bpIn; animation-duration: .55s; animation-timing-function: var(--spring); }
@keyframes bpIn { from { opacity: 0; transform: translateY(26px) scale(.98); } }

/* ---------- Blocks and cards ---------- */
.card { background: var(--surface); border: 2px solid var(--line-strong); border-radius: var(--r); padding: 18px; min-width: 0; transition: transform .3s var(--spring), box-shadow .3s; }
.card:hover { transform: translateY(-3px); box-shadow: 6px 6px 0 var(--line-strong); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-family: var(--display); font-size: 17px; text-transform: uppercase; letter-spacing: .01em; }
.blks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.blk { border: 0; color: #fff; overflow: hidden; position: relative; }
.blk::after { content: ""; position: absolute; right: -24px; bottom: -24px; width: 96px; height: 96px; border-radius: 50%; border: 18px solid rgba(255, 255, 255, .14); }
.blk.orange { background: var(--c1); } .blk.brown { background: var(--brown); } .blk.teal { background: var(--c2); } .blk.mustard { background: var(--c3); color: #2e1a10; }
[data-theme="dark"] .blk.brown { background: #4a2e1f; }
.blk span { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .9; }
.blk b { display: block; font-family: var(--display); font-size: 32px; margin: 6px 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.02em; }
.bx { font-size: 12.5px; font-weight: 600; opacity: .92; min-height: 18px; display: flex; gap: 6px; align-items: center; }
.bx .k-delta { color: inherit; }
.lnk { background: rgba(255, 255, 255, .2); border: 0; color: inherit; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.pipe { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.pipe-s { flex: 1; min-width: 110px; display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: 8px; border: 2px dashed var(--line-strong); background: var(--surface); color: var(--ink); text-align: left; animation: bpIn .6s var(--spring) backwards; animation-delay: calc(var(--i) * 90ms + .2s); transition: border-color .2s, transform .2s; }
.pipe-s:hover { border-color: var(--accent); transform: translateY(-2px); }
.pipe-s b { font-family: var(--display); font-size: 30px; }
.pipe-s span { font-weight: 800; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.pipe-a { color: var(--accent); display: grid; }
.g2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.oli { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; transition: background-color .2s; }
.oli:hover, .oli:focus-visible { background: var(--surface2); }
.oi { width: 36px; height: 36px; border-radius: 8px; background: var(--c3); color: #2e1a10; display: grid; place-items: center; font-weight: 900; font-size: 12px; flex: none; }
.oli div { flex: 1; min-width: 0; }
.oli b { display: block; font-size: 14px; }
.oli small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ot { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-weight: 800; font-size: 13px; }
.oli.fresh { animation: bpIn .7s var(--spring); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.fr { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fr li { display: grid; grid-template-columns: 1fr 120px 36px; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 600; }
.frb { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--c2) calc((1 - var(--d)) * 100%), var(--surface2) 0); }
.frb.mid { background: linear-gradient(90deg, var(--c3) calc((1 - var(--d)) * 100%), var(--surface2) 0); }
.frb.old { background: linear-gradient(90deg, var(--err) calc((1 - var(--d)) * 100%), var(--surface2) 0); }
.fr b { text-align: right; }
.bagart { width: 44px; height: 52px; flex: none; }
.bagart .bg { fill: var(--brown); } .bagart .tp { fill: none; stroke: var(--c3); stroke-width: 3; } .bagart .lb { fill: var(--c1); } .bagart .lt { fill: #fff; font: 900 8px var(--display); }
[data-theme="dark"] .bagart .bg { fill: #5a3a26; }
.bagart.sm { width: 34px; height: 40px; } .bagart.xs { width: 30px; height: 36px; }

/* ---------- Order drawer ---------- */
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.who b { display: block; font-size: 17px; } .who small { color: var(--muted); }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 2px solid var(--line); }
.lines li span { flex: 1; } .lines small { display: block; color: var(--muted); }
.sumd { margin: 12px 0 0; }
.sumd div { display: flex; justify-content: space-between; padding: 4px 0; }
.sumd dt { color: var(--muted); } .sumd dd { margin: 0; font-weight: 700; }
.sumd .tot { font-family: var(--display); font-size: 18px; }
.sumd .tot dt { color: var(--ink); }
.tot { display: flex; justify-content: space-between; margin: 10px 0; }

/* ---------- Packing station (signature) ---------- */
.station { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) 230px; gap: 18px; align-items: start; }
.pick { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
.pk-b { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 2px dashed var(--line-strong); background: var(--surface); text-align: left; transition: border-color .2s, background-color .2s, transform .2s var(--spring); }
.pk-b:hover { transform: translateX(4px); }
.pk-b span { flex: 1; } .pk-b small { display: block; color: var(--muted); }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; color: transparent; transition: all .3s var(--spring); }
.pk-b.on { border-style: solid; border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.pk-b.on .tick { background: var(--ok); border-color: var(--ok); color: #fff; transform: scale(1.1); }
.pk-a { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.pk-stage { overflow: hidden; }
.belt { position: relative; height: 290px; perspective: 700px; background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%); }
.rollers { position: absolute; left: -20px; right: -20px; bottom: 18px; height: 16px; background: repeating-linear-gradient(90deg, #6b6158 0 14px, #8f857b 14px 28px); border-radius: 8px; }
.box { position: absolute; left: 50%; bottom: 34px; width: 210px; height: 140px; margin-left: -105px; background: #c8925a; border-radius: 4px; box-shadow: inset 0 -12px 0 rgba(0, 0, 0, .08), 0 14px 20px -12px rgba(0, 0, 0, .5); transform-style: preserve-3d; transition: transform 1s cubic-bezier(.6, 0, .4, 1); }
.box::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22px; background: #a9733f; border-radius: 4px 4px 0 0; }
.box-in { position: absolute; left: 14px; right: 14px; top: 8px; height: 40px; display: flex; justify-content: center; gap: 6px; align-items: flex-end; }
.drop { opacity: 0; transform: translateY(-140px) rotate(-14deg); transition: transform .6s var(--spring), opacity .25s; }
.drop.in { opacity: 1; transform: translateY(0) rotate(0); }
.flap { position: absolute; top: 0; width: 50%; height: 70px; background: #d6a067; border: 1px solid rgba(0, 0, 0, .1); transform-origin: top; transition: transform .6s var(--spring); }
.f1 { left: 0; transform: rotateX(180deg) translateY(-1px); transform-origin: 50% 0; }
.f2 { right: 0; transform: rotateX(180deg) translateY(-1px); transform-origin: 50% 0; }
.flap { transform-origin: 50% 0; top: 0; }
.box.sealed .f1, .box.sealed .f2 { transform: rotateX(0deg); }
.box .f1, .box .f2 { top: 0; height: 70px; }
.box:not(.sealed) .f1 { transform: translateY(-70px) rotateX(-160deg); }
.box:not(.sealed) .f2 { transform: translateY(-70px) rotateX(-160deg); }
.tape { position: absolute; left: 50%; top: 0; width: 26px; height: 0; margin-left: -13px; background: rgba(240, 220, 170, .85); transition: height .5s var(--ease); }
.box.taped .tape { height: 140px; }
.label { position: absolute; right: 12px; bottom: 14px; width: 104px; padding: 6px 7px; background: #fff; color: #222; font-size: 9px; line-height: 1.25; border-radius: 2px; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transform: translateY(-160px) rotate(-6deg); opacity: 0; transition: transform .7s var(--spring), opacity .2s; }
.label b { display: block; font-size: 10px; } .label .k-bc { width: 100%; height: 14px; margin: 3px 0 0; }
.box.labelled .label { transform: none; opacity: 1; }
.box.gone { transform: translateX(160%) rotate(3deg); }
.pk-msg { text-align: center; font-weight: 800; margin: 12px 0 0; min-height: 1.4em; }
.ql { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ql button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: 2px solid transparent; background: var(--surface2); }
.ql b { display: block; font-size: 13.5px; } .ql small { color: var(--muted); font-size: 12px; }
.ql li.cur button { border-color: var(--accent); }
.done-c { text-align: center; padding: 40px 20px; }
.done-c svg { width: 160px; }
.dbx { fill: #c8925a; stroke: var(--brown); stroke-width: 2; }
.dck { fill: none; stroke: var(--ok); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: chk .8s .3s var(--ease) forwards; }
@keyframes chk { to { stroke-dashoffset: 0; } }
.done-c h2 { font-family: var(--display); text-transform: uppercase; }

/* ---------- Subscriptions, roasts ---------- */
.subcard { display: grid; gap: 4px; padding: 18px; border-radius: 8px; background: var(--brown); color: var(--cream); margin-bottom: 12px; position: relative; overflow: hidden; }
.subcard::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; border: 22px solid rgba(242, 107, 29, .35); }
.subcard span { font-size: 12px; opacity: .7; } .subcard b { font-family: var(--display); font-size: 20px; } .subcard em { font-style: normal; color: var(--c3); font-weight: 800; } .subcard small { opacity: .8; }
.roasts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; margin-bottom: 18px; }
.rc { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; color: var(--ink); cursor: pointer; animation: bpIn .5s var(--spring) backwards; animation-delay: calc(var(--i) * 40ms); }
.rc .bagart { width: 60px; height: 70px; margin-bottom: 6px; transition: transform .4s var(--spring); }
.rc:hover .bagart { transform: rotate(-8deg) translateY(-4px); }
.rc b { font-size: 15px; } .rc small { color: var(--muted); }
.rc-f { display: flex; justify-content: space-between; width: 100%; font-weight: 800; font-size: 13px; }
.rc-f em { font-style: normal; color: var(--accent); }
.rc-age { font-size: 11.5px; color: var(--muted); }
.lo { color: var(--err); }
.set-f { display: flex; justify-content: flex-end; margin-top: 16px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--line); }
.set-row b { display: block; } .set-row small { color: var(--muted); font-size: 13px; }

/* ---------- Responsive: block tabs become a bottom bar ---------- */
@media (max-width: 1180px) {
  .station { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pk-q { grid-column: 1 / -1; }
  .blks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nav a span { display: none; }
  .nav a { padding: 10px 16px 12px; }
}
@media (max-width: 760px) {
  .nav { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 60; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--brown); justify-content: space-between; gap: 0; }
  .nav a { flex: 1; justify-content: center; padding: 12px 0; border-radius: 8px; }
  .nav .k-marker { top: 6px; bottom: 6px; border-radius: 8px; }
  .nav-n { position: absolute; top: 2px; right: 10%; min-width: 17px; height: 17px; font-size: 10px; }
  .hdr-row { padding: 10px 14px; }
  #view { padding: 18px 14px 90px; }
  .ph h1 { font-size: 30px; }
  .g2, .station { grid-template-columns: minmax(0, 1fr); }
  .pipe-a { display: none; }
}
@media (max-width: 480px) {
  .blks { grid-template-columns: minmax(0, 1fr); }
  .blk b { font-size: 26px; }
  .roasts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fr li { grid-template-columns: 1fr 70px 32px; }

  const L = openModal({ title: "Add a discount", body: `<div class="k-disc">${seg("dm", ["Percent", "Amount", "Code"], "Percent", "Discount type")}<div class="k-dpre">${[5, 10, 15, 20, 25].map((v) => `<button type="button" class="btn sm" data-dp="${v}">${v}%</button>`).join("")}</div><div class="k-field"><label for="dIn" data-dl>Percent off</label><input id="dIn" type="number" min="0" step="any" inputmode="decimal" aria-describedby="dErr"><small class="k-err" id="dErr"></small></div><p class="k-hint" data-dh>Codes to try: ${Object.keys(codes).map(esc).join(", ") || "none"}</p></div>`, foot: `${Cart.disc ? `<button type="button" class="btn ghost" data-drm>Remove discount</button>` : ""}<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-dap>Apply</button>` });

  segWire(box, "dm", setMode); hint.hidden = true;

  const apply = () => {
    const v = inp.value.trim(); err.textContent = "";
    if (mode === "Code") { const c = codes[v.toUpperCase()]; if (!c) { err.textContent = "That code is not valid"; inp.setAttribute("aria-invalid", "true"); return; } Cart.disc = { type: c.type, v: c.v, label: v.toUpperCase() }; }

    L.close(); emit("cart", {}); toast("Discount applied: " + Cart.disc.label);

  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); apply(); } });
  const rm = $("[data-drm]", box); if (rm) rm.addEventListener("click", () => { Cart.disc = null; L.close(); emit("cart", {}); toast("Discount removed", "info"); });
}
const ceilTo = (v, s) => Math.ceil(v / s) * s;
/* payment: cash with change, or card with a simulated terminal. done({method, tendered, change, ref}) */
function payModal(total, done, o = {}) {
  const steps = CUR.dec ? [5, 10, 20, 50, 100] : [100, 500, 1000, 5000];
  const quick = Array.from(new Set(steps.map((s) => ceilTo(total, s)))).filter((v) => v >= total).slice(0, 4);
  const methods = ["Cash", "Card"].concat(o.wallet ? ["Wallet"] : []);
  const L = openModal({ title: "Take payment", cls: "k-paym", body: `<div class="k-pay"><div class="k-paytotal"><span>Amount due</span><b>${money(total)}</b></div>${seg("pm", methods, "Cash", "Payment method")}
    <div data-pane="Cash"><div class="k-field"><label for="payIn">Cash received</label><input id="payIn" type="number" min="0" step="any" inputmode="decimal" placeholder="${esc(num(quick[0] || total, CUR.dec))}" aria-describedby="payErr"><small class="k-err" id="payErr"></small></div><div class="k-quick">${quick.map((q) => `<button type="button" data-qc="${q}">${money(q)}</button>`).join("")}<button type="button" data-qc="${total}">Exact</button></div><div class="k-change"><span>Change to give</span><b data-chg aria-live="polite">${money(0)}</b></div><button type="button" class="btn primary big" data-paycash>${ic("cash")} Take cash</button></div>
    <div data-pane="Card" hidden><div class="k-term" aria-hidden="true"><div class="k-term-scr"><small>Charge</small><b>${money(total)}</b><em data-tmsg>Ready</em></div><div class="k-term-keys">${"123456789".split("").map((k) => `<i>${k}</i>`).join("")}</div><div class="k-term-card"></div></div><p class="k-cstat" data-cstat aria-live="polite">Ask the customer to tap, insert or swipe their card.</p><button type="button" class="btn primary big" data-paycard>${ic("card")} Charge ${money(total)}</button></div>
    ${o.wallet ? `<div data-pane="Wallet" hidden><div class="k-wallet"><svg viewBox="0 0 120 120" class="k-qr" aria-hidden="true">${qrish(o.walletSeed || 7)}</svg><p>Customer scans this code with their mobile wallet app, then you confirm when the payment message arrives.</p></div><button type="button" class="btn primary big" data-paywallet>${ic("wallet")} Payment received</button></div>` : ""}</div>` });
  const box = L.box, inp = $("#payIn", box), chg = $("[data-chg]", box), err = $("#payErr", box);
  segWire(box, "pm", (m) => { $$("[data-pane]", box).forEach((p) => (p.hidden = p.dataset.pane !== m)); if (m === "Cash") inp.focus(); });
  const upd = () => { const v = Number(inp.value) || 0; chg.textContent = money(Math.max(0, v - total)); err.textContent = ""; inp.setAttribute("aria-invalid", "false"); };
  inp.addEventListener("input", upd);
  $(".k-quick", box).addEventListener("click", (e) => { const b = e.target.closest("[data-qc]"); if (b) { inp.value = b.dataset.qc; upd(); } });
  const finish = (p) => { if (L.closed) return; L.close(); done(p); };
  const cash = () => { const v = Number(inp.value); if (!inp.value || !isFinite(v) || v < total) { err.textContent = !inp.value ? "Enter the cash received" : "That is less than the amount due"; inp.setAttribute("aria-invalid", "true"); inp.focus(); return; } finish({ method: "Cash", tendered: roundCur(v), change: roundCur(v - total), ref: "" }); };
  $("[data-paycash]", box).addEventListener("click", cash);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); cash(); } });
  const cb = $("[data-paycard]", box), stat = $("[data-cstat]", box), term = $(".k-term", box), tmsg = $("[data-tmsg]", box);
  cb.addEventListener("click", () => {
    cb.disabled = true; stat.textContent = "Waiting for the card…"; tmsg.textContent = "Tap card"; term.classList.add("tap");
    setTimeout(() => { if (L.closed) return; stat.textContent = "Reading card…"; tmsg.textContent = "Reading"; }, 700);
    setTimeout(() => { if (L.closed) return; const code = String(ri(100000, 999999)); term.classList.add("ok"); tmsg.textContent = "Approved"; stat.textContent = "Approved · auth code " + code; setTimeout(() => finish({ method: "Card", tendered: total, change: 0, ref: "Auth " + code }), 650); }, 1500);
  });
  const wb = $("[data-paywallet]", box); if (wb) wb.addEventListener("click", () => finish({ method: "Wallet", tendered: total, change: 0, ref: "Ref " + ri(10000000, 99999999) }));
  return L;
}
/* a QR-like pattern drawn from a seed (decoration only) */
function qrish(sd) {
  let s = sd * 9301 + 49297, out = "";
  const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const on = f ? (x % 6 === 0 || y % 6 === 0 || (x > 13 ? x - 14 : x) % 6 === 0 || (y > 13 ? y - 14 : y) % 6 === 0 || ((x % 7 > 1 && x % 7 < 5) && (y % 7 > 1 && y % 7 < 5))) : r() > 0.5;
    if (on) out += `<rect x="${6 + x * 5.15}" y="${6 + y * 5.15}" width="5.2" height="5.2"/>`;
  }
  return out;
}
function barcode(txt) {
  let x = 0, out = "";
  [...String(txt)].forEach((ch) => { const v = ch.charCodeAt(0); for (let b = 0; b < 4; b++) { const w = 1 + ((v >> b) & 1) + ((v >> (b + 3)) & 1); out += `<rect x="${x}" y="0" width="${w}" height="34"/>`; x += w + 1 + ((v >> (b + 1)) & 1); } });
  return `<svg class="k-bc" viewBox="0 0 ${x} 34" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;
}
/* receipt markup. s: {id,t,lines:[{name,qty,price}],sub,disc,discLabel,mem,tax,total,method,tendered,change,ref,staff,member} */
function receiptHTML(s, shop) {
  const row = (a, b, cls) => `<div class="${cls || ""}"><span>${a}</span><span>${b}</span></div>`;
  return `<div class="k-receipt"><div class="k-rch"><b>${esc(shop.name)}</b><span>${esc(shop.addr || "")}</span><span>${fmtDT(s.t)} · ${esc(s.id)}</span>${s.staff ? `<span>Served by ${esc(s.staff)}</span>` : ""}</div><div class="k-rcl">${s.lines.map((l) => row(`${l.qty} × ${esc(l.name)}`, money(l.price * l.qty))).join("")}</div><div class="k-rct">${row("Subtotal", money(s.sub))}${s.disc ? row("Discount" + (s.discLabel ? " · " + esc(s.discLabel) : ""), "-" + money(s.disc)) : ""}${s.mem ? row("Member saving", "-" + money(s.mem)) : ""}${s.tax ? row("Tax", money(s.tax)) : ""}${row("Total", money(s.total), "tot")}${row(esc(s.method) + (s.ref ? " · " + esc(s.ref) : ""), money(s.tendered))}${s.change ? row("Change", money(s.change)) : ""}${s.member ? row("Member", esc(s.member)) : ""}</div>${barcode(s.id)}<p class="k-rcf">${esc(shop.foot || "Thank you, see you again soon")}</p>${s.status === "Refunded" ? `<p class="k-rcref">REFUNDED</p>` : ""}</div>`;
}
function showReceipt(s, shop, extraFoot) {
  const L = openModal({ title: "Receipt " + esc(s.id), cls: "k-recm", body: receiptHTML(s, shop), foot: `${extraFoot || ""}<span class="sp"></span><button type="button" class="btn ghost" data-rmail>${ic("mail")} Email</button><button type="button" class="btn primary" data-rprint>${ic("print")} Print</button>` });
  $("[data-rprint]", L.box).addEventListener("click", printNow);
  $("[data-rmail]", L.box).addEventListener("click", () => toast("Receipt " + s.id + " sent to the customer's email"));
  return L;
}
function printNow() { document.body.classList.add("k-printing"); try { window.print(); } catch (e) { /* ignore */ } setTimeout(() => document.body.classList.remove("k-printing"), 600); }

/* =========================================================
   Beanpost: an online store dashboard for a small coffee
   roaster, from today's sales to packing orders.
   ========================================================= */
const APP = { name: "Beanpost" };
Store.key = "db-beanpost";
CUR.sym = "Rs "; CUR.dec = 0;
const VER = 2, D = 365;
const ROASTS = [["Swat Valley espresso", "Blend", 2400, "Dark"], ["Margalla morning", "Blend", 2100, "Medium"], ["Ethiopia Guji", "Single origin", 3600, "Light"], ["Colombia Huila", "Single origin", 3200, "Medium"], ["Brazil Cerrado", "Single origin", 2800, "Medium"], ["Decaf night owl", "Blend", 2600, "Medium"], ["Cold brew pack", "Brew kit", 1900, "Coarse"], ["Pour-over starter kit", "Brew kit", 6800, "Gear"]];
const OST = ["New", "Packed", "Shipped", "Delivered", "Cancelled"];
const oK = (s) => ({ New: "warn", Packed: "info", Shipped: "info", Delivered: "ok", Cancelled: "err" })[s];
const PLANS = [["250 g", 2200], ["500 g", 4000], ["1 kg", 7400]];
const FREQ = ["Weekly", "Every 2 weeks", "Monthly"];

/* ---------- State ---------- */
let S;
const save = () => Store.save(S);
const zeros = () => new Array(D).fill(0);
const dayIdx = (t) => D - 1 - Math.round((today0() - new Date(t).setHours(0, 0, 0, 0)) / DAY);
const roast = (id) => S.roasts.find((r) => r.id === id);
const addRev = (t, a) => { const i = dayIdx(t); if (i >= 0) S.d.rev[i] += a; };
const fresh = (r) => Math.round((Date.now() - r.roasted) / DAY);
function newOrder(t, c, status) {
  const lines = []; for (let j = 0; j < pick([1, 1, 2, 3]); j++) { const r = pick(S.roasts); const ex = lines.find((l) => l.id === r.id); if (ex) ex.qty++; else lines.push({ id: r.id, name: r.name, price: r.price, qty: 1, grind: pick(["Whole bean", "Espresso", "Filter", "French press"]) }); }
  const sub = sum(lines, (l) => l.price * l.qty);
  return { id: "BP-" + ++S.seq, t, cust: c.id, name: c.name, city: c.city, lines, ship: sub >= 5000 ? 0 : 250, total: sub + (sub >= 5000 ? 0 : 250), status, track: "", sub: chance(0.25) };
}
function seedData() {
  seed(7070);
  const t0 = today0(), now = Date.now();
  S = { seq: 8800, cfg: { shop: "Margalla Roasting Co", city: "Islamabad", freeOver: 5000 }, roasts: [], customers: [], orders: [], subs: [], batches: [], d: { rev: zeros(), hour: Array.from({ length: 24 }, () => 0), yhour: Array.from({ length: 24 }, () => 0), subs: zeros() } };
  S.roasts = ROASTS.map((r, i) => ({ id: "R" + (i + 1), name: r[0], kind: r[1], price: r[2], level: r[3], stock: chance(0.2) ? ri(1, 5) : ri(12, 60), roasted: now - ri(1, 12) * DAY, sold: ri(40, 300) }));
  for (let i = 0; i < 40; i++) { const n = person(); S.customers.push({ id: "C" + (i + 1), name: n, city: pick(CITIES), email: emailOf(n), orders: ri(1, 16), spend: ri(3, 90) * 1000, fav: pick(ROASTS)[0] }); }
  const g = series(D, 26000 / 1.4, { growth: 0.4, week: [1.15, 1.05, 0.95, 0.9, 0.95, 1, 1.1], noise: 0.2 }), frac = clamp((new Date().getHours() + 1) / 24, 0.1, 1);
  g[D - 1] = Math.round(g[D - 1] * frac); S.d.rev = g;
  for (let h = 0; h < 24; h++) { const w = h < 7 ? 0.2 : h < 10 ? 1.4 : h < 13 ? 1 : h < 18 ? 0.8 : h < 23 ? 1.3 : 0.4; S.d.yhour[h] = Math.round((g[D - 2] / 20) * w * rnd(0.7, 1.3)); S.d.hour[h] = h <= new Date().getHours() ? Math.round((g[D - 1] / (20 * frac)) * w * rnd(0.7, 1.3) * 0.9) : 0; }
  let subs = 60; S.d.subs = S.d.subs.map(() => (subs = Math.max(40, subs + (chance(0.5) ? ri(0, 2) : -ri(0, 1)))));
  for (let k = 0; k < 44; k++) { const t = Math.round(now - Math.pow(rand(), 1.5) * 9 * DAY), age = (now - t) / DAY; const o = newOrder(t, pick(S.customers), age > 4 ? "Delivered" : age > 1.5 ? "Shipped" : age > 0.4 ? pick(["Packed", "New"]) : "New"); if (o.status === "Shipped" || o.status === "Delivered") o.track = "PK" + ri(10000000, 99999999); S.orders.push(o); }
  S.orders.sort((a, b) => b.t - a.t);
  for (let i = 0; i < 26; i++) { const c = S.customers[i], p = ri(0, 2), f = ri(0, 2); S.subs.push({ id: "SB-" + (100 + i), cust: c.id, name: c.name, roast: pick(S.roasts.slice(0, 6)).id, plan: p, freq: f, next: t0 + ri(0, 20) * DAY, status: chance(0.12) ? "Paused" : "Active", since: t0 - ri(20, 400) * DAY }); }
  S.batches = Array.from({ length: 8 }, (_, k) => { const r = pick(S.roasts.slice(0, 6)); return { id: "RB-" + (300 - k), rid: r.id, name: r.name, green: ri(8, 20), bags: 0, t: now - k * 1.5 * DAY - ri(0, 10) * 36e5, roaster: pick(["Usman", "Hania"]) }; });
  S.batches.forEach((b) => (b.bags = Math.floor((b.green * 0.84) / 0.25)));
  return S;
}
const mrr = () => sum(S.subs.filter((s) => s.status === "Active"), (s) => PLANS[s.plan][1] * [4.33, 2.17, 1][s.freq]);

const head = (title, sub, actions = "") => `<div class="ph" data-in><div><h1>${title}</h1><p>${sub}</p></div><div class="ph-act">${actions}</div></div>`;
const blk = (label, value, fmt, extra, tone, id) => `<div class="card blk ${tone || ""}"><span>${label}</span><b data-count="${value}" data-fmt="${fmt}"${id ? ` id="${id}"` : ""}>${FMT[fmt](value)}</b><div class="bx">${extra || ""}</div></div>`;
const bag = (r, cls) => `<svg class="bagart ${cls || ""}" viewBox="0 0 60 70" aria-hidden="true"><path d="M12 10h36l4 56H8z" class="bg"/><path d="M12 10l6-6h24l6 6" class="tp"/><rect x="16" y="26" width="28" height="22" rx="3" class="lb"/><text x="30" y="40" text-anchor="middle" class="lt">${esc((r.level || "").slice(0, 4).toUpperCase())}</text></svg>`;

/* ---------- Today ---------- */
Router.add("today", "Today", (v) => {

    + `<div class="blks">${blk("Sales today", S.d.rev[D - 1], "money", delta(S.d.rev[D - 8] ? (S.d.rev[D - 1] - S.d.rev[D - 8]) / S.d.rev[D - 8] : null) + " vs last week", "orange", "bRev")}${blk("Orders today", todayO.length, "int", `${S.cfg.freeOver ? "free delivery over " + moneyS(S.cfg.freeOver) : ""}`, "brown", "bOrd")}${blk("To pack", by("New"), "int", `<button type="button" class="lnk" data-go="packing">Pack now →</button>`, "teal", "bPack")}${blk("Monthly subscriptions", mrr(), "money", `${S.subs.filter((s) => s.status === "Active").length} active`, "mustard")}</div>
    <div class="pipe" data-in>${["New", "Packed", "Shipped", "Delivered"].map((s, i) => `<button type="button" class="pipe-s" data-act="pipeTo" data-s="${s}" style="--i:${i}"><b>${by(s)}</b><span>${s}</span></button>`).join(`<i class="pipe-a" aria-hidden="true">${ic("arrow")}</i>`)}</div>
    <div class="g2"><div class="card"><div class="card-h"><h2>Sales by hour</h2><span class="mut">today against yesterday</span></div><div id="hBars"></div></div><div class="card"><div class="card-h"><h2>Latest orders</h2><span class="live">live</span></div><ul class="ol" id="ol">${S.orders.slice(0, 6).map(oLi).join("")}</ul></div></div>
    <div class="g2"><div class="card"><div class="card-h"><h2>What's selling</h2></div><div id="tTop"></div></div><div class="card"><div class="card-h"><h2>Freshness</h2><span class="mut">days since roast</span></div><ul class="fr">${S.roasts.filter((r) => r.kind !== "Brew kit").map((r) => `<li><span>${esc(r.name)}</span><i class="frb ${fresh(r) > 10 ? "old" : fresh(r) > 6 ? "mid" : ""}" style="--d:${Math.min(1, fresh(r) / 14)}"></i><b>${fresh(r)}d</b></li>`).join("")}</ul></div></div>`;
  const hrs = Array.from({ length: 24 }, (_, h) => h);
  barChart($("#hBars", v), { labels: hrs.map((h) => (h % 12 || 12) + (h < 12 ? "a" : "p")), series: [{ name: "Today", data: S.d.hour, color: "var(--c1)" }, { name: "Yesterday", data: S.d.yhour, color: "var(--c6)" }], fmt: short, tip: money, h: 220 });
  hbars($("#tTop", v), S.roasts.slice().sort((a, b) => b.sold - a.sold).slice(0, 5).map((r, i) => ({ name: r.name, value: r.sold, sub: r.level + " · " + r.stock + " bags left", color: `var(--c${(i % 4) + 1})` })), (n) => n + " bags");
  $("#ol", v).addEventListener("click", (e) => { const r = e.target.closest("[data-ord]"); if (r) orderDrawer(r.dataset.ord); });
  Timers.every(9000, () => {

    const ul = $("#ol"); if (ul) { ul.insertAdjacentHTML("afterbegin", oLi(o).replace('class="oli"', 'class="oli fresh"')); while (ul.children.length > 6) ul.lastElementChild.remove(); }
    countTo($("#bRev"), S.d.rev[D - 1]); countTo($("#bOrd"), S.orders.filter((x) => x.t >= today0()).length); countTo($("#bPack"), S.orders.filter((x) => x.status === "New").length);

  });

const oLi = (o) => `<li class="oli" data-ord="${o.id}" tabindex="0" role="button" aria-label="Order ${o.id}"><span class="oi">${esc(o.name.split(" ").map((w) => w[0]).join(""))}</span><div><b>${esc(o.name)}</b><small>${o.id} · ${o.lines.map((l) => l.qty + "× " + l.name).join(", ")}</small></div><span class="ot">${money(o.total)}${badge(o.status, oK(o.status))}</span></li>`;

  const b = L.box, fin = (m) => { save(); paintChrome(); L.close(); toast(m); Router.refresh(); }, g = (s, f) => { const x = $(s, b); if (x) x.addEventListener("click", f); };
  g("[data-pk]", () => { L.close(); packId = o.id; location.hash = "#/packing"; if (Router.cur === "packing") Router.refresh(); });
  g("[data-sh]", () => { o.status = "Shipped"; o.track = "PK" + ri(10000000, 99999999); fin(`${o.id} shipped`); });
  g("[data-dv]", () => { o.status = "Delivered"; fin(`${o.id} delivered`); });
  g("[data-x]", () => confirmBox(`Cancel ${o.id} and refund ${money(o.total)}?`, () => { o.status = "Cancelled"; addRev(o.t, -o.total); fin(`${o.id} cancelled`); }, { yes: "Cancel order" }));

Router.add("orders", "Orders", (v) => {
  v.innerHTML = head("Orders", "Every web order. Open one to pack, ship or cancel it.", `<button type="button" class="btn" data-act="exportOrders">${ic("download")} CSV</button>`) + `<div class="card"><div id="oT"></div></div>`;

});
ACT.exportOrders = () => csv("beanpost-orders.csv", S.orders, [["Order", (o) => o.id], ["Date", (o) => isoDate(o.t)], ["Customer", (o) => o.name], ["City", (o) => o.city], ["Status", (o) => o.status], ["Total", (o) => o.total]]);

/* ---------- Signature: the packing station ---------- */
let packId = null, packed = {};
Router.add("packing", "Packing", (v) => {
  const queue = S.orders.filter((o) => o.status === "New").sort((a, b) => a.t - b.t);
  if (!queue.find((o) => o.id === packId)) { packId = queue[0] ? queue[0].id : null; packed = {}; }
  const o = S.orders.find((x) => x.id === packId);
  v.innerHTML = head("Packing", `${queue.length} order${queue.length === 1 ? "" : "s"} waiting. Tick each bag into the box, seal it, print the label and send it off.`, "")
    + (o ? `<div class="station"><div class="card pk-list"><div class="card-h"><h2>${o.id}</h2>${badge(o.city, "info")}</div><p class="who"><b>${esc(o.name)}</b><small>${o.lines.length} line${o.lines.length > 1 ? "s" : ""} · ${money(o.total)}</small></p><ul class="pick">${o.lines.map((l, i) => `<li><button type="button" class="pk-b${packed[i] ? " on" : ""}" data-act="packLine" data-i="${i}" aria-pressed="${!!packed[i]}">${bag(roast(l.id) || {}, "sm")}<span><b>${l.qty} × ${esc(l.name)}</b><small>${esc(l.grind)}</small></span><i class="tick">${ic("check")}</i></button></li>`).join("")}</ul><div class="pk-a"><button type="button" class="btn" data-act="skipPack">Skip for now</button><button type="button" class="btn primary" data-act="sealBox" id="sealBtn"${o.lines.every((_, i) => packed[i]) ? "" : " disabled"}>${ic("box")} Seal and label</button></div></div>
      <div class="card pk-stage"><div class="belt" aria-hidden="true"><div class="box" id="box"><div class="box-in">${o.lines.map((l, i) => `<span class="drop${packed[i] ? " in" : ""}" data-d="${i}" style="--i:${i}">${bag(roast(l.id) || {}, "xs")}</span>`).join("")}</div><div class="flap f1"></div><div class="flap f2"></div><div class="tape"></div><div class="label"><b>${esc(o.name)}</b><span>${esc(o.city)}</span><small>${o.id}</small>${barcode(o.id)}</div></div><div class="rollers"></div></div><p class="pk-msg" id="pkMsg" aria-live="polite">${o.lines.every((_, i) => packed[i]) ? "Everything is in. Seal the box." : "Tick each bag as it goes into the box."}</p></div>
      <div class="card pk-q"><div class="card-h"><h2>Up next</h2></div><ul class="ql">${queue.slice(0, 7).map((x) => `<li class="${x.id === o.id ? "cur" : ""}"><button type="button" data-act="pickPack" data-id="${x.id}"><b>${x.id}</b><small>${esc(x.name)} · ${sum(x.lines, (l) => l.qty)} bags</small></button></li>`).join("")}</ul></div></div>`
      : `<div class="card done-c"><svg viewBox="0 0 120 90" aria-hidden="true"><rect x="20" y="30" width="80" height="50" rx="4" class="dbx"/><path d="M20 30l14-16h52l14 16" class="dbx"/><path d="M44 54l10 10 22-22" class="dck"/></svg><h2>All packed</h2><p class="mut">Nothing is waiting. New orders show up here as they come in.</p><button type="button" class="btn primary" data-go="today">Back to Today</button></div>`);
});
Object.assign(ACT, {
  packLine: (b) => { const i = +b.dataset.i; packed[i] = !packed[i]; b.classList.toggle("on", packed[i]); b.setAttribute("aria-pressed", String(packed[i])); const d = $(`[data-d="${i}"]`); if (d) d.classList.toggle("in", packed[i]); const o = S.orders.find((x) => x.id === packId), all = o && o.lines.every((_, k) => packed[k]); $("#sealBtn").disabled = !all; $("#pkMsg").textContent = all ? "Everything is in. Seal the box." : "Tick each bag as it goes into the box."; },
  sealBox: () => {
    const o = S.orders.find((x) => x.id === packId); if (!o) return; const box = $("#box"), btn = $("#sealBtn"); btn.disabled = true;
    const steps = [["sealed", "Folding the flaps…", 0], ["taped", "Taping it shut…", 700], ["labelled", "Printing the label…", 1300], ["gone", "On the conveyor to the courier…", 2300]];
    const t = reduced() ? 0 : 1;
    steps.forEach(([c, m, ms]) => setTimeout(() => { if (!box.isConnected) return; box.classList.add(c); $("#pkMsg").textContent = m; }, ms * t));
    setTimeout(() => { o.status = "Shipped"; o.track = "PK" + ri(10000000, 99999999); o.lines.forEach((l) => { const r = roast(l.id); if (r) { r.stock = Math.max(0, r.stock - l.qty); r.sold += l.qty; } }); save(); paintChrome(); toast(`${o.id} packed and handed to the courier · ${o.track}`); Notes.add(`${o.id} shipped to ${o.city}`, "ok"); packed = {}; packId = null; if (Router.cur === "packing") Router.refresh(); }, 3200 * t + 20);
  },
  skipPack: () => { const q = S.orders.filter((o) => o.status === "New").sort((a, b) => a.t - b.t), i = q.findIndex((o) => o.id === packId); packId = q.length ? q[(i + 1) % q.length].id : null; packed = {}; Router.refresh(); },
  pickPack: (b) => { packId = b.dataset.id; packed = {}; Router.refresh(); }
});

/* ---------- Subscriptions ---------- */
Router.add("subs", "Subscriptions", (v) => {
  const act = S.subs.filter((s) => s.status === "Active");
  v.innerHTML = head("Subscriptions", "Coffee on repeat. Pause, skip or change a plan for any subscriber.", `<button type="button" class="btn primary" data-act="newSub">${ic("plus")} New subscriber</button>`)
    + `<div class="blks">${blk("Active", act.length, "int", "", "teal")}${blk("Monthly value", mrr(), "money", "", "orange")}${blk("Shipping this week", act.filter((s) => s.next < today0() + 7 * DAY).length, "int", "", "brown")}${blk("Paused", S.subs.filter((s) => s.status === "Paused").length, "int", "", "mustard")}</div>
    <div class="g2"><div class="card"><div id="sbT"></div></div><div class="card"><div class="card-h"><h2>Active subscribers, 12 months</h2></div><div id="sbLine"></div></div></div>`;
  table($("#sbT", v), { rows: () => S.subs, keys: ["name", "id", (s) => (roast(s.roast) || {}).name || ""], chips: { values: ["All", "Active", "Paused", "Cancelled"], key: "status" }, size: 9, sort: 4, caption: "Subscriptions", onRow: subDrawer, cols: [{ label: "Subscriber", k: "name", f: (s) => `<b>${esc(s.name)}</b>` }, { label: "Coffee", v: (s) => (roast(s.roast) || {}).name, f: (s) => esc((roast(s.roast) || {}).name || "") }, { label: "Plan", k: "plan", f: (s) => `${PLANS[s.plan][0]} · ${FREQ[s.freq].toLowerCase()}` }, { label: "Status", k: "status", f: (s) => badge(s.status, s.status === "Active" ? "ok" : s.status === "Paused" ? "warn" : "err") }, { label: "Next", k: "next", f: (s) => (s.status === "Active" ? fmtDate(s.next) : "–") }] });
  const m = byRange(S.d.subs, "12M"); lineChart($("#sbLine", v), { labels: m.labels, series: [{ name: "Subscribers", data: m.labels.map((_, i) => Math.round(m.data[i] / 30)), color: "var(--c2)" }], fmt: (n) => String(Math.round(n)), h: 220 });
});
function subDrawer(id) {
  const s = S.subs.find((x) => x.id === id); if (!s) return;
  const L = openModal({ title: esc(s.name), drawer: true, body: `<div class="subcard"><span>${s.id}</span><b>${esc((roast(s.roast) || {}).name || "")}</b><em>${PLANS[s.plan][0]} · ${FREQ[s.freq]}</em><small>${money(PLANS[s.plan][1])} each delivery · since ${fmtDateY(s.since)}</small></div><p class="tot"><span>Next delivery</span><b>${s.status === "Active" ? fmtDateY(s.next) : s.status}</b></p>`, foot: `${s.status !== "Cancelled" ? `<button type="button" class="btn ghost" data-cx>Cancel plan</button>` : ""}<span class="sp"></span>${s.status === "Active" ? `<button type="button" class="btn" data-skip>Skip next</button><button type="button" class="btn" data-pause>Pause</button>` : s.status === "Paused" ? `<button type="button" class="btn primary" data-res>Resume</button>` : ""}<button type="button" class="btn primary" data-edit>${ic("edit")} Change</button>` });
  const b = L.box, fin = (m) => { save(); L.close(); toast(m); Router.refresh(); }, g = (sl, f) => { const x = $(sl, b); if (x) x.addEventListener("click", f); };
  g("[data-skip]", () => { s.next += [7, 14, 30][s.freq] * DAY; fin(`Next delivery moved to ${fmtDate(s.next)}`); });
  g("[data-pause]", () => { s.status = "Paused"; fin("Plan paused"); });
  g("[data-res]", () => { s.status = "Active"; s.next = Math.max(s.next, today0() + DAY); fin("Plan resumed"); });
  g("[data-cx]", () => confirmBox(`Cancel ${s.name}'s plan?`, () => { s.status = "Cancelled"; fin("Plan cancelled"); }, { yes: "Cancel plan" }));
  g("[data-edit]", () => { L.close(); formModal({ title: "Change plan", fields: [{ k: "roast", label: "Coffee", type: "select", options: S.roasts.filter((r) => r.kind !== "Brew kit").map((r) => [r.id, r.name]), full: true }, { k: "plan", label: "Size", type: "select", options: PLANS.map((p, i) => [i, `${p[0]} · ${money(p[1])}`]) }, { k: "freq", label: "How often", type: "select", options: FREQ.map((f, i) => [i, f]) }], values: s, save: (x) => { s.roast = x.roast; s.plan = +x.plan; s.freq = +x.freq; save(); toast("Plan changed"); Router.refresh(); return true; } }); });
}
ACT.newSub = () => formModal({ title: "New subscriber", fields: [{ k: "c", label: "Customer", type: "select", options: S.customers.map((c) => [c.id, c.name]), full: true }, { k: "roast", label: "Coffee", type: "select", options: S.roasts.filter((r) => r.kind !== "Brew kit").map((r) => [r.id, r.name]), full: true }, { k: "plan", label: "Size", type: "select", options: PLANS.map((p, i) => [i, p[0]]) }, { k: "freq", label: "How often", type: "select", options: FREQ.map((f, i) => [i, f]) }], save: (x) => { const c = S.customers.find((y) => y.id === x.c); S.subs.unshift({ id: "SB-" + (200 + S.subs.length), cust: c.id, name: c.name, roast: x.roast, plan: +x.plan, freq: +x.freq, next: today0() + 2 * DAY, status: "Active", since: Date.now() }); save(); toast(`${c.name} subscribed`); Router.refresh(); return true; } });

/* ---------- Roasts: products and roast batches ---------- */
Router.add("roasts", "Roasts", (v) => {
  v.innerHTML = head("Roasts", "Your coffees and brew kits, with stock in bags and how fresh each roast is.", `<button type="button" class="btn" data-act="newRoast">${ic("plus")} New coffee</button><button type="button" class="btn primary" data-act="roastBatch">${ic("flame")} Log a roast</button>`)
    + `<div class="roasts">${S.roasts.map((r, i) => `<button type="button" class="card rc" data-act="editRoast" data-id="${r.id}" style="--i:${i}">${bag(r)}<b>${esc(r.name)}</b><small>${esc(r.kind)} · ${esc(r.level)}</small><span class="rc-f"><em>${money(r.price)}</em><span class="${r.stock <= 5 ? "lo" : ""}">${r.stock} bags</span></span>${r.kind !== "Brew kit" ? `<span class="rc-age">roasted ${fresh(r)} day${fresh(r) === 1 ? "" : "s"} ago</span>` : ""}</button>`).join("")}</div>
    <div class="card"><div class="card-h"><h2>Roast log</h2></div><div id="rbT"></div></div>`;
  table($("#rbT", v), { rows: () => S.batches, search: false, size: 6, sort: 0, dir: -1, caption: "Roast log", cols: [{ label: "Roasted", k: "t", f: (b) => fmtDT(b.t), cls: "nw" }, { label: "Batch", k: "id" }, { label: "Coffee", k: "name" }, { label: "Green beans", k: "green", f: (b) => b.green + " kg", cls: "num" }, { label: "Bags", k: "bags", cls: "num" }, { label: "Roaster", k: "roaster" }] });
});
function roastForm(r) { formModal({ title: r ? "Edit coffee" : "New coffee", drawer: true, fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "kind", label: "Type", type: "select", options: ["Blend", "Single origin", "Brew kit"] }, { k: "level", label: "Roast", type: "select", options: ["Light", "Medium", "Dark", "Coarse", "Gear"] }, { k: "price", label: "Price per bag (Rs)", type: "number", min: 1, req: true }, { k: "stock", label: "Bags in stock", type: "number", min: 0, step: 1, req: true }], values: r || { kind: "Single origin", level: "Medium", stock: 0 }, save: (x) => { const d = { name: x.name, kind: x.kind, level: x.level, price: Math.round(x.price), stock: Math.round(x.stock) }; if (r) Object.assign(r, d); else S.roasts.push(Object.assign({ id: "R" + Date.now().toString(36), roasted: Date.now(), sold: 0 }, d)); save(); toast(r ? "Saved" : "Coffee added"); Router.refresh(); return true; }, del: r ? () => { S.roasts = S.roasts.filter((y) => y !== r); save(); toast("Deleted", "info"); Router.refresh(); } : null }); }
Object.assign(ACT, {
  newRoast: () => roastForm(null), editRoast: (b) => roastForm(roast(b.dataset.id)),
  roastBatch: () => formModal({ title: "Log a roast", submit: "Add to stock", fields: [{ k: "r", label: "Coffee", type: "select", options: S.roasts.filter((r) => r.kind !== "Brew kit").map((r) => [r.id, r.name]), full: true }, { k: "green", label: "Green beans (kg)", type: "number", min: 1, step: "any", req: true }, { k: "who", label: "Roaster", type: "select", options: ["Usman", "Hania"] }], values: { green: 12 }, save: (x) => { const r = roast(x.r), bags = Math.floor((x.green * 0.84) / 0.25); r.stock += bags; r.roasted = Date.now(); S.batches.unshift({ id: "RB-" + (301 + S.batches.length), rid: r.id, name: r.name, green: x.green, bags, t: Date.now(), roaster: x.who }); save(); toast(`${bags} bags of ${r.name} added (16% weight lost in the roast)`); if (["roasts", "today"].includes(Router.cur)) Router.refresh(); return true; } })
});

/* ---------- Customers ---------- */
Router.add("customers", "Customers", (v) => {
  v.innerHTML = head("Customers", "People who drink your coffee, with their favourite roast.", "") + `<div class="card"><div id="cT"></div></div>`;
  table($("#cT", v), { rows: () => S.customers.map((c) => Object.assign({ isSub: S.subs.some((s) => s.cust === c.id && s.status === "Active") }, c)), keys: ["name", "city", "email", "fav"], chips: { values: ["All", "Subscribers"], test: (c) => c.isSub }, size: 10, sort: 4, caption: "Customers", onRow: (id) => { const c = S.customers.find((x) => x.id === id), os = S.orders.filter((o) => o.cust === id); openModal({ title: esc(c.name), drawer: true, body: `<p class="who"><b>${esc(c.name)}</b><small>${esc(c.city)} · ${esc(c.email)}</small></p><p class="tot"><span>Lifetime spend</span><b>${money(c.spend)}</b></p><p class="tot"><span>Favourite</span><b>${esc(c.fav)}</b></p><ul class="ol">${os.slice(0, 5).map(oLi).join("") || `<li class="k-emptyp">No recent orders</li>`}</ul>`, foot: `<button type="button" class="btn" data-close>Close</button><button type="button" class="btn primary" data-act="sendCode" data-n="${esc(c.name)}">${ic("gift")} Send a 10% code</button>` }); },
    cols: [{ label: "Customer", k: "name", f: (c) => `<b>${esc(c.name)}</b>${c.isSub ? " " + badge("Subscriber", "info") : ""}` }, { label: "City", k: "city" }, { label: "Favourite", k: "fav" }, { label: "Orders", k: "orders", cls: "num" }, { label: "Spent", k: "spend", f: (c) => money(c.spend), cls: "num" }] });
});
ACT.sendCode = (b) => toast(`Code BEANS10 sent to ${b.dataset.n}`);

/* ---------- Reports and settings ---------- */
let rRange = "30D";
Router.add("reports", "Reports", (v) => {
  v.innerHTML = head("Reports", "Sales over time and which coffees carry the shop.", `${seg("rr", ["7D", "30D", "12M"], rRange, "Range")}<button type="button" class="btn" data-act="csvRep">${ic("download")} CSV</button>`)
    + `<div class="blks" id="rK"></div><div class="g2"><div class="card"><div class="card-h"><h2>Sales</h2></div><div id="rLine"></div></div><div class="card"><div class="card-h"><h2>By coffee</h2><span class="mut">all time</span></div><div id="rDon"></div></div></div><div class="card"><div class="card-h"><h2>Orders by city</h2></div><div id="rCity"></div></div>`;
  segWire($(".ph-act", v), "rr", (x) => { rRange = x; drawRep(); });
  drawRep();
  donut($("#rDon", v), { items: S.roasts.slice(0, 6).map((r, i) => ({ name: r.name, value: r.sold * r.price, color: `var(--c${i + 1})` })), fmt: moneyS, size: 170, sub: "all time" });
  const cities = {}; S.orders.forEach((o) => (cities[o.city] = (cities[o.city] || 0) + 1));
  barChart($("#rCity", v), { labels: Object.keys(cities), series: [{ name: "Orders", data: Object.values(cities), color: "var(--c1)" }], fmt: (n) => String(Math.round(n)), h: 200 });
});
function drawRep() {
  const k = $("#rK"); if (!k) return; const rev = rangeSum(S.d.rev, rRange), n = Math.round(rev / 3600);
  k.innerHTML = blk("Sales", rev, "money", delta(rangeDelta(S.d.rev, rRange)), "orange") + blk("Orders", n, "int", "", "brown") + blk("Average order", n ? rev / n : 0, "money", "", "teal") + blk("Subscriptions", mrr(), "money", "a month", "mustard");
  counts(k);
  const a = byRange(S.d.rev, rRange);
  lineChart($("#rLine"), { labels: a.labels, series: [{ name: "Sales", data: a.data, color: "var(--c1)" }], fmt: short, tip: money, h: 240 });
}
ACT.csvRep = () => csv("beanpost-sales.csv", Array.from({ length: 30 }, (_, i) => D - 30 + i), [["Date", (i) => isoDate(today0() - (D - 1 - i) * DAY)], ["Sales", (i) => S.d.rev[i]]]);
Router.add("settings", "Settings", (v) => {
  v.innerHTML = head("Settings", "Shop details, delivery and data.", "") + `<div class="g2"><form class="card" id="sF" novalidate><div class="card-h"><h2>Shop</h2></div>${fieldsHTML([{ k: "shop", label: "Shop name", req: true, full: true }, { k: "city", label: "City", type: "select", options: CITIES }, { k: "freeOver", label: "Free delivery over (Rs)", type: "number", min: 0, req: true }], S.cfg)}<div class="set-f"><button class="btn primary" type="submit">Save</button></div></form><div class="card"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Light roast or dark roast</small></div><button type="button" class="btn" data-act="theme">${ic("moon")} Switch</button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample roastery</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const f = $("#sF", v);
  f.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(f, [{ k: "shop", label: "Shop", req: true }, { k: "city", label: "City" }, { k: "freeOver", label: "Free delivery", type: "number", min: 0, req: true }]); if (!x) return; Object.assign(S.cfg, x); save(); paintChrome(); toast("Saved"); });
});
ACT.reset = () => confirmBox("Reset all demo data on this device?", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); packId = null; packed = {}; save(); paintChrome(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset" });

/* ---------- Boot ---------- */

paintIcons(); Theme.label(); paintChrome();

Router.start();
