<!doctype html>
<!-- Chill & Craft · Chai Stall · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chai Stall · brew, pull and serve a cup of tea</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL wins over the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens (afternoon = light, late night = dark) ---------- */
  :root {
    --page: #f8efe6; --page2: #f3d9c0; --ink: #2d1b12; --muted: #7b6050; --line: rgba(45, 27, 18, 0.12);
    --wall: #f1d2ad; --wall2: #e7c098; --awnA: #1f8a85; --awnB: #fbf0dc; --board: #24312b; --chalk: #f4efe2;
    --wood: #8a5432; --wood2: #6d3f22; --woodTop: #a8673e; --panel: #c2452f; --shelf: #9b6038; --bulb: #fff1c2; --bulbGlow: 0.25;
    --steam: 255, 255, 255; --chip: rgba(255, 255, 255, 0.82); --btn: #b23a1f; --btnInk: #fff6ea; --focus: #1f6f8b; --night: 0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #120d0b; --page2: #2b1a12; --ink: #f7ede4; --muted: #c0a796; --line: rgba(255, 255, 255, 0.1);
      --wall: #3a2a24; --wall2: #2e211c; --awnA: #155e5a; --awnB: #cbbfa8; --board: #16201b; --chalk: #efe6d2;
      --wood: #5e3820; --wood2: #4a2b17; --woodTop: #774629; --panel: #8f3322; --shelf: #6a4026; --bulb: #ffd774; --bulbGlow: 1;
      --steam: 255, 240, 225; --chip: rgba(40, 28, 22, 0.86); --btn: #f2a641; --btnInk: #2b1405; --focus: #7fd1e6; --night: 1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #120d0b; --page2: #2b1a12; --ink: #f7ede4; --muted: #c0a796; --line: rgba(255, 255, 255, 0.1);
    --wall: #3a2a24; --wall2: #2e211c; --awnA: #155e5a; --awnB: #cbbfa8; --board: #16201b; --chalk: #efe6d2;
    --wood: #5e3820; --wood2: #4a2b17; --woodTop: #774629; --panel: #8f3322; --shelf: #6a4026; --bulb: #ffd774; --bulbGlow: 1;
    --steam: 255, 240, 225; --chip: rgba(40, 28, 22, 0.86); --btn: #f2a641; --btnInk: #2b1405; --focus: #7fd1e6; --night: 1;
    color-scheme: dark;
  }

  /* ---------- Page and stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; overflow-x: clip;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: radial-gradient(110% 70% at 50% 0%, var(--page2), transparent 70%), var(--page);
  }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-x: clip; }
  .cap, .scene { width: min(500px, 100%, calc((100vh - 270px) * 0.8)); min-width: 260px; }
  .controls { width: min(520px, 100%); }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .cap b { font-size: 15px; color: var(--ink); }
  .cap span { font-variant-numeric: tabular-nums; text-align: right; }
  .scene {
    position: relative; aspect-ratio: 4 / 5; border-radius: 26px; overflow: hidden; isolation: isolate; touch-action: manipulation;
    background: var(--wall);
    box-shadow: 0 30px 60px -24px rgba(70, 30, 10, 0.55), 0 10px 22px -12px rgba(70, 30, 10, 0.35), inset 0 0 0 1px var(--line);
  }
  .scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .night { opacity: var(--night); }
  .glowB { opacity: var(--bulbGlow); }
  .chalk { fill: var(--chalk); font: 700 10px system-ui, sans-serif; }
  .chalk.h { font: 800 12px system-ui, sans-serif; letter-spacing: 0.08em; }
  .tk text { font: 700 8.2px system-ui, sans-serif; fill: #3a2a1f; }
  .tk .nm { font: 800 9.4px system-ui, sans-serif; }
  .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

  /* ---------- Controls ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: 600 14px/1 system-ui, sans-serif;
    box-shadow: 0 6px 16px -10px rgba(0, 0, 0, 0.4); transition: transform 0.18s cubic-bezier(.3, 1.6, .5, 1), background 0.2s;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px) scale(0.97); }
  .btn.main { background: var(--btn); color: var(--btnInk); border-color: transparent; min-width: 132px; justify-content: center; }
  .btn.main.urgent { animation: urgent 0.5s ease-in-out infinite alternate; }
  @keyframes urgent { to { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(242, 166, 65, 0.35); } }
  .btn[aria-disabled="true"] { opacity: 0.65; cursor: default; }
  .btn:focus-visible, .seg input:focus-visible + span, .tog input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); }
  .seg label, .tog { position: relative; }
  .seg input, .tog input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .seg span { display: block; padding: 9px 11px; border-radius: 999px; font: 600 13px/1 system-ui, sans-serif; color: var(--muted); transition: background 0.25s, color 0.25s; }
  .seg input:checked + span { background: var(--btn); color: var(--btnInk); }
  .tog span { display: inline-flex; align-items: center; gap: 6px; padding: 11px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); font: 600 13px/1 system-ui, sans-serif; color: var(--muted); }
  .tog span::before { content: ""; width: 12px; height: 12px; border-radius: 4px; border: 2px solid currentColor; }
  .tog input:checked + span { color: var(--ink); }
  .tog input:checked + span::before { background: var(--btn); border-color: var(--btn); box-shadow: inset 0 0 0 2px var(--chip); }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; text-align: center; max-width: 500px; }
  .hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; max-width: 500px; }
  @media (max-height: 720px) { .hint { display: none; } }
  @media (max-width: 420px) { .btn { padding: 10px 12px; font-size: 13px; } .btn.main { min-width: 0; } .seg span { padding: 9px 8px; font-size: 12.5px; } }
  @media (prefers-reduced-motion: reduce) { .blink, .btn.main.urgent { animation: none; } }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Chai Stall: brew tea for each order, lower the flame before it boils over, pull it into the glass and get paid</h1>
  <div class="cap"><b>Chai Stall</b><span id="till">Served 0 · PKR 0</span></div>
  <div class="scene" id="scene">
    <svg viewBox="0 0 400 500" aria-hidden="true" id="art">
      <defs>
        <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--wall2)"/><stop offset="1" style="stop-color: var(--wall)"/></linearGradient>
        <radialGradient id="bulbG"><stop offset="0" stop-color="#ffe9a6" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/></radialGradient>
        <radialGradient id="flameG" cx="0.5" cy="0.9" r="0.8"><stop offset="0" stop-color="#bfe6ff"/><stop offset="0.5" stop-color="#3d8bff"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/></radialGradient>
        <linearGradient id="steelG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b8390"/><stop offset="0.35" stop-color="#e4e8ee"/><stop offset="0.6" stop-color="#a9b0bb"/><stop offset="1" stop-color="#5d6470"/></linearGradient>
        <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.08"/><stop offset="0.8" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></linearGradient>
        <clipPath id="glassClip"><path d="M-15 -58 L-12 0 H12 L15 -58Z"/></clipPath>
        <pattern id="awn" width="40" height="60" patternUnits="userSpaceOnUse"><rect width="20" height="60" style="fill: var(--awnA)"/><rect x="20" width="20" height="60" style="fill: var(--awnB)"/></pattern>
      </defs>

      <!-- back wall, shelf with jars, clock, menu board and ticket rail -->
      <rect width="400" height="500" fill="url(#wallG)"/>
      <path d="M0 230 H400" stroke="#000" stroke-opacity="0.06" stroke-width="2"/>
      <g opacity="0.07" fill="#000"><circle cx="40" cy="260" r="2"/><circle cx="120" cy="300" r="2"/><circle cx="330" cy="280" r="2"/><circle cx="180" cy="330" r="2"/></g>
      <rect x="14" y="214" width="132" height="7" rx="2" style="fill: var(--shelf)"/>
      <rect x="20" y="221" width="6" height="12" style="fill: var(--shelf)"/><rect x="134" y="221" width="6" height="12" style="fill: var(--shelf)"/>
      <g id="jars">
        <g transform="translate(36 214)"><rect x="-14" y="-38" width="28" height="38" rx="6" fill="#dff1f4" fill-opacity="0.5" stroke="#9fb9c0" stroke-width="1.2"/><rect x="-15" y="-43" width="30" height="7" rx="2" fill="#c8553d"/>
          <g fill="#d99a52"><rect x="-10" y="-30" width="20" height="5" rx="2"/><rect x="-10" y="-23" width="20" height="5" rx="2"/><rect x="-10" y="-16" width="20" height="5" rx="2"/><rect x="-10" y="-9" width="20" height="5" rx="2"/></g></g>
        <g transform="translate(76 214)"><rect x="-13" y="-34" width="26" height="34" rx="6" fill="#dff1f4" fill-opacity="0.5" stroke="#9fb9c0" stroke-width="1.2"/><rect x="-14" y="-39" width="28" height="6" rx="2" fill="#2f6fa3"/>
          <g fill="#e9c27a"><circle cx="-5" cy="-8" r="5"/><circle cx="5" cy="-9" r="5"/><circle cx="0" cy="-17" r="5"/><circle cx="-5" cy="-25" r="5"/><circle cx="6" cy="-24" r="5"/></g></g>
        <g transform="translate(116 214)"><rect x="-13" y="-36" width="26" height="36" rx="3" fill="#b8433a"/><rect x="-13" y="-36" width="26" height="6" fill="#8d2f28"/><rect x="-9" y="-24" width="18" height="12" rx="2" fill="#f6e7c8"/><text x="0" y="-15" text-anchor="middle" font-size="7" font-weight="800" fill="#8d2f28">TEA</text></g>
      </g>
      <g transform="translate(232 132)">
        <circle r="17" fill="#fbf4e6" stroke="#6d3f22" stroke-width="3"/>
        <g stroke="#6d3f22" stroke-width="1.2"><path d="M0 -13 V-10 M13 0 H10 M0 13 V10 M-13 0 H-10"/></g>
        <path id="hH" d="M0 0 V-7" stroke="#2d1b12" stroke-width="2" stroke-linecap="round"/>
        <path id="mH" d="M0 0 V-11" stroke="#2d1b12" stroke-width="1.3" stroke-linecap="round"/>
        <circle r="1.6" fill="#2d1b12"/>
      </g>
      <g transform="translate(262 104)">
        <rect width="126" height="112" rx="6" fill="#6d3f22"/>
        <rect x="5" y="5" width="116" height="102" rx="3" style="fill: var(--board)"/>
        <text class="chalk h" x="63" y="24" text-anchor="middle">MENU</text>
        <path d="M30 30 H96" stroke="#f4efe2" stroke-opacity="0.4" stroke-dasharray="3 3"/>
        <text class="chalk" x="14" y="46">Milk tea</text><text class="chalk" x="112" y="46" text-anchor="end">80</text>
        <text class="chalk" x="14" y="62">Cardamom</text><text class="chalk" x="112" y="62" text-anchor="end">100</text>
        <text class="chalk" x="14" y="78">Pink tea</text><text class="chalk" x="112" y="78" text-anchor="end">150</text>
        <text class="chalk" x="14" y="94">Rusk</text><text class="chalk" x="112" y="94" text-anchor="end">40</text>
        <text x="63" y="104" text-anchor="middle" font-size="6.5" font-weight="700" style="fill: var(--chalk)" opacity="0.7">PRICES IN PKR</text>
      </g>
      <path d="M12 110 H214" stroke="#6d3f22" stroke-width="2.4" stroke-linecap="round"/>
      <g id="tickets"></g>

      <!-- the stall keeper behind the counter -->
      <g id="keeper">
        <path d="M150 360 Q152 290 178 274 Q205 262 232 274 Q258 290 260 360Z" fill="#5b3a29"/>
        <path d="M188 274 L205 300 L222 274 Q205 268 188 274Z" fill="#f3ead8"/>
        <path d="M178 278 Q175 320 180 360 H230 Q235 320 232 278 Q218 300 205 302 Q192 300 178 278Z" fill="#7c4f36"/>
        <rect x="197" y="250" width="16" height="22" rx="6" fill="#b97b52"/>
        <ellipse cx="205" cy="232" rx="23" ry="25" fill="#c98b62"/>
        <path d="M182 222 Q183 200 205 198 Q227 200 228 222 Q216 214 205 214 Q194 214 182 222Z" fill="#f7f1e3"/>
        <path d="M182 222 Q205 210 228 222" fill="none" stroke="#d9cfbb" stroke-width="2"/>
        <g class="blink"><ellipse cx="196" cy="234" rx="2.2" ry="2.8" fill="#2d1b12"/><ellipse cx="214" cy="234" rx="2.2" ry="2.8" fill="#2d1b12"/></g>
        <path d="M193 226 Q196 224 199 226 M211 226 Q214 224 217 226" stroke="#4a2b17" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M194 246 Q205 243 216 246 Q213 250 205 249 Q197 250 194 246Z" fill="#3a2418"/>
        <path id="mouth" d="M198 252 Q205 256 212 252" stroke="#7a3a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="182" cy="234" rx="3" ry="5" fill="#b97b52"/><ellipse cx="228" cy="234" rx="3" ry="5" fill="#b97b52"/>
        <circle cx="190" cy="243" r="4" fill="#e88a7a" opacity="0.35"/><circle cx="220" cy="243" r="4" fill="#e88a7a" opacity="0.35"/>
      </g>
      <!-- the keeper's resting arm -->
      <path id="armL" d="M176 284 Q150 320 160 350" fill="none" stroke="#5b3a29" stroke-width="12" stroke-linecap="round"/>
      <circle id="handL" cx="160" cy="352" r="6" fill="#c98b62"/>

      <!-- counter: top slab, then a painted front panel -->
      <rect x="0" y="356" width="400" height="12" style="fill: var(--woodTop)"/>
      <rect x="0" y="356" width="400" height="3" fill="#fff" opacity="0.18"/>
      <rect x="0" y="368" width="400" height="132" style="fill: var(--wood)"/>
      <rect x="10" y="378" width="380" height="112" rx="8" style="fill: var(--panel)"/>
      <rect x="16" y="384" width="368" height="100" rx="6" fill="none" stroke="#ffd23f" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
      <g id="motifs"></g>
      <text x="200" y="443" text-anchor="middle" font-size="25" font-weight="900" fill="#fff6e0" letter-spacing="3" stroke="#6d1f12" stroke-width="5" paint-order="stroke">FRESH CHAI</text>
      <text x="200" y="465" text-anchor="middle" font-size="9" font-weight="800" fill="#ffd23f" letter-spacing="2">BOILED TWICE · POURED HIGH</text>

      <!-- till box at the right -->
      <g transform="translate(362 356)">
        <path d="M-28 0 V-24 Q-28 -28 -24 -28 H24 Q28 -28 28 -24 V0Z" style="fill: var(--wood2)"/>
        <rect x="-16" y="-31" width="32" height="5" rx="2" fill="#2d1b12"/>
        <rect x="-22" y="-20" width="44" height="12" rx="2" fill="#000" opacity="0.18"/>
        <text id="tillTxt" y="-11" text-anchor="middle" font-size="8.5" font-weight="800" fill="#ffd23f">0</text>
      </g>

      <!-- stove with its blue flame -->
      <g transform="translate(96 356)">
        <rect x="-44" y="-18" width="88" height="18" rx="4" fill="#2f3440"/>
        <rect x="-44" y="-18" width="88" height="4" rx="2" fill="#4a5161"/>
        <circle cx="32" cy="-9" r="4.5" fill="#8a919e"/><path id="knob" d="M32 -9 V-13" stroke="#2f3440" stroke-width="1.6" stroke-linecap="round"/>
        <g id="flame" transform="translate(0 -20)"></g>
      </g>

      <!-- the pan: it rides to the glass for the high pour -->
      <g id="pan" transform="translate(96 336)">
        <path d="M37 -36 L84 -45" stroke="#5d6470" stroke-width="4" stroke-linecap="round"/>
        <path d="M66 -42 L86 -46" stroke="#3a2418" stroke-width="7" stroke-linecap="round"/>
        <path d="M-37 -46 L-34 -2 Q0 4 34 -2 L37 -46Z" fill="url(#steelG)"/>
        <ellipse cx="0" cy="-46" rx="37" ry="7" fill="#3a3f48"/>
        <ellipse id="tea" cx="0" cy="-45" rx="34" ry="5.6" fill="#c9d8e0"/>
        <path id="foam" d="M-34 -45 Q0 -45 34 -45" fill="#e2c39a"/>
        <g id="bubbles"></g>
        <path id="drip" d="" fill="#a8703f"/>
        <ellipse cx="0" cy="-46" rx="37" ry="7" fill="none" stroke="#c9ced6" stroke-width="2"/>
      </g>
      <!-- the keeper's working arm (a soft rubber-hose sleeve) reaches the pan handle -->
      <path id="armR" d="" fill="none" stroke="#5b3a29" stroke-width="12" stroke-linecap="round"/>
      <circle id="handR" r="6.5" fill="#c98b62"/>

      <!-- the glass on its saucer, the pour stream and the rusk -->
      <g id="stream"><path id="streamP" d="" fill="none" stroke="#b07a4a" stroke-width="4.5" stroke-linecap="round"/><path id="streamH" d="" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/></g>
      <g id="cup" transform="translate(240 356)">
        <ellipse cx="0" cy="1" rx="30" ry="5" fill="#000" opacity="0.18"/>
        <ellipse cx="0" cy="-1" rx="28" ry="5" fill="#f4f1ea" stroke="#c9c2b4"/>
        <g id="rusk" opacity="0" transform="translate(19 -5) rotate(-12)"><rect x="-9" y="-4" width="20" height="7" rx="2.5" fill="#d99a52"/><path d="M-6 -2 h14 M-6 1 h14" stroke="#b8763a" stroke-width="0.8"/></g>
        <g transform="translate(0 -2)">
          <path d="M-15 -58 L-12 0 H12 L15 -58Z" fill="#fff" fill-opacity="0.18"/>
          <g clip-path="url(#glassClip)">
            <rect id="liq" x="-16" y="0" width="32" height="0" fill="#b07a4a"/>
            <rect id="froth" x="-16" y="0" width="32" height="0" fill="#e8cda8"/>
            <g id="nuts"></g>
          </g>
          <path d="M-15 -58 L-12 0 H12 L15 -58Z" fill="url(#glassG)" stroke="#fff" stroke-opacity="0.7" stroke-width="1.2"/>
          <path d="M-10 -52 L-8.5 -6" stroke="#fff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
      <!-- a customer's hand comes in to take the glass -->
      <g id="customer" opacity="0">
        <path id="custArm" d="" fill="none" stroke="#3a6ea5" stroke-width="16" stroke-linecap="round"/>
        <circle id="custHand" r="8.5" fill="#d9a27a"/>
      </g>
      <g id="coins"></g>

      <!-- awning, string lights and the bell -->
      <path d="M0 0 H400 V58 H0Z" fill="url(#awn)"/>
      <path d="M0 0 H400 V10 H0Z" fill="#000" opacity="0.12"/>
      <g id="scallops"></g>
      <path id="wire" d="M0 74 Q200 98 400 74" fill="none" stroke="#2d1b12" stroke-width="1"/>
      <g id="bulbs"></g>
      <g id="bell" transform="translate(378 64)">
        <path d="M0 -6 V2" stroke="#2d1b12" stroke-width="1.2"/>
        <g id="bellBody"><path d="M-8 14 Q-8 2 0 2 Q8 2 8 14Z" fill="#d4a93c"/><path d="M-9 14 H9" stroke="#a07a20" stroke-width="2" stroke-linecap="round"/><circle cy="16" r="2" fill="#a07a20"/></g>
      </g>
      <g id="fx"></g>
    </svg>
    <canvas id="steam" aria-hidden="true"></canvas>
  </div>

  <div class="controls">
    <button class="btn main" id="brew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1 -5 5h-1a5 5 0 0 1 -5 -5z M16 10h2a2 2 0 0 1 0 4h-2 M8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/></svg><span id="brewLabel">Brew</span></button>
    <div class="seg" role="radiogroup" aria-label="Tea to brew">
      <label><input type="radio" name="tea" value="milk" checked><span>Milk tea</span></label>
      <label><input type="radio" name="tea" value="cardamom"><span>Cardamom</span></label>
      <label><input type="radio" name="tea" value="pink"><span>Pink tea</span></label>
    </div>
    <label class="tog"><input type="checkbox" id="ruskBox"><span>Rusk</span></label>

      b.dataset.life = "0.5";
    }
    [].slice.call(bg.childNodes).forEach(function (c) { var l = +c.dataset.life - dt; c.dataset.life = l; c.setAttribute("cy", f1(+c.getAttribute("cy") - dt * 10 - foam * dt * 30)); if (l <= 0 || panPos.a !== 0) c.remove(); });
    // the keeper's arm follows the handle
    var gp = gripPoint(), sh = { x: 232, y: 284 };
    var mx = (sh.x + gp.x) / 2 + 20, my = Math.max(sh.y, gp.y) + 24;
    $("armR").setAttribute("d", "M" + sh.x + " " + sh.y + " Q" + f1(mx) + " " + f1(my) + " " + f1(gp.x) + " " + f1(gp.y));
    $("handR").setAttribute("cx", f1(gp.x)); $("handR").setAttribute("cy", f1(gp.y));
    // the pour stream
    if (pourK > 0) {
      var lp = lipPoint(), top = -2 - 58 * fill * 0.88 + 356 - 2;
      $("streamP").setAttribute("d", "M" + f1(lp.x) + " " + f1(lp.y) + " Q" + f1(lp.x - 2) + " " + f1((lp.y + top) / 2) + " 240 " + f1(top));
      $("streamP").setAttribute("stroke", teaCol);
      $("streamH").setAttribute("d", "M" + f1(lp.x + 1) + " " + f1(lp.y + 4) + " L241 " + f1(top - 6));
      if (!calm && Math.random() < dt * 30) splashes.push({ x: 240 + rnd(-6, 6), y: top, vx: rnd(-30, 30), vy: rnd(-60, -20), life: 0.4 });
    } else { $("streamP").setAttribute("d", ""); $("streamH").setAttribute("d", ""); }
    // glass fill and froth
    var lh = 58 * fill * 0.88, frothH = Math.min(8, fill * 12);
    $("liq").setAttribute("y", f1(-lh)); $("liq").setAttribute("height", f1(lh)); $("liq").setAttribute("fill", TEAS[brewKind].col);
    $("froth").setAttribute("y", f1(-lh - 0.5)); $("froth").setAttribute("height", fill > 0.05 ? f1(frothH * (pourK ? 1.2 : 1)) : 0); $("froth").setAttribute("fill", TEAS[brewKind].froth);
    // customer's arm reaches in from the lower right, takes the glass
    var cu = ease(custU), hx = lerp(430, 262, cu), hy = lerp(520, 322, cu);
    $("customer").setAttribute("opacity", custU > 0.01 ? 1 : 0);
    $("custArm").setAttribute("d", "M440 540 Q" + f1(lerp(430, 330, cu)) + " " + f1(lerp(520, 420, cu)) + " " + f1(hx) + " " + f1(hy));
    $("custHand").setAttribute("cx", f1(hx)); $("custHand").setAttribute("cy", f1(hy));
    var ca = ease(cupAway);
    $("cup").setAttribute("transform", "translate(" + f1(240 + ca * 190) + " " + f1(356 + ca * 160) + ")");
    // bell and bulbs swing on springs
    bellV += (-bellA * 90 - bellV * 3.5) * dt; bellA += bellV * dt;
    $("bellBody").setAttribute("transform", "rotate(" + f1(clamp(bellA, -40, 40)) + " 0 2)");
    bulbs.forEach(function (bl, i) {
      bl.v += (-bl.a * 40 - bl.v * 2.2) * dt + (calm ? 0 : Math.sin(t * 0.8 + i) * 2 * dt);
      bl.a += bl.v * dt; bl.g.setAttribute("transform", "rotate(" + f1(bl.a) + ")");
    });
    // coins fall, bounce and slide into the till
    for (var i = coins.length - 1; i >= 0; i--) {
      var c = coins[i];
      if (c.delay > 0) { c.delay -= dt; c.el.setAttribute("opacity", 0); continue; }
      c.el.setAttribute("opacity", 1);
      c.life -= dt; c.vy += 600 * dt; c.y += c.vy * dt; c.x += c.vx * dt;
      if (c.y > 349) { c.y = 349; c.vy = -c.vy * 0.45; c.vx += 30 * dt * 10; c.bounce++; }
      if (c.x > 352 || c.life <= 0) { c.el.remove(); coins.splice(i, 1); continue; }
      c.el.setAttribute("transform", "translate(" + f1(c.x) + " " + f1(c.y) + ") scale(" + f1(c.bounce % 2 ? 0.7 : 1) + " 1)");
    }
    // tea leaves falling into the pan and splashes from the pour
    var fx = $("fx");
    for (i = leafBits.length - 1; i >= 0; i--) {
      var lb = leafBits[i]; lb.y += lb.vy * dt;
      if (!lb.el) lb.el = el("rect", { width: f1(lb.s), height: f1(lb.s * 0.6), fill: lb.c }, fx);
      lb.el.setAttribute("x", f1(lb.x)); lb.el.setAttribute("y", f1(lb.y));
      if (lb.y > 290) { lb.el.remove(); leafBits.splice(i, 1); }
    }
    for (i = splashes.length - 1; i >= 0; i--) {
      var sp = splashes[i]; sp.life -= dt; sp.vy += 300 * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      if (!sp.el) sp.el = el("circle", { r: 1.3, fill: teaCol }, fx);
      sp.el.setAttribute("cx", f1(sp.x)); sp.el.setAttribute("cy", f1(sp.y));
      if (sp.life <= 0) { sp.el.remove(); splashes.splice(i, 1); }
    }
  }
  var splashes = [];
  function clock() {
    var d = new Date(), m = d.getMinutes() + d.getSeconds() / 60, h = (d.getHours() % 12) + m / 60;
    $("hH").setAttribute("transform", "rotate(" + f1(h * 30) + ")"); $("mH").setAttribute("transform", "rotate(" + f1(m * 6) + ")");
  }
  clock(); setInterval(clock, 1000);

  /* ---------- 7. Main loop ---------- */
  var last = performance.now(), custT = 18;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
    stepBrew(dt, t); stepTickets(dt); stepSteam(dt, t);
    custT -= dt;
    if (custT <= 0) { custT = rnd(16, 26); if (tickets.filter(function (x) { return !x.done; }).length < 2) { var tk = addTicket(); if (tk) say(tk.name + " walks up: " + TEAS[tk.kind].name.toLowerCase() + (tk.rusk ? " and a rusk." : ".")); } }
    render(t, dt); drawSteam();
    requestAnimationFrame(frame);
  }

  /* ---------- 8. Input ---------- */
  $("brew").addEventListener("click", function () {
    if (stage === "idle") startBrew();
    else if (stage === "boil") lowerFlame();
    else say(stage === "pour" ? "Pouring: watch the froth build." : "Busy brewing. Wait for the boil to lower the flame.");
  });
  $("ring").addEventListener("click", function () {
    var tk = addTicket();
    if (tk) say("Ding! " + tk.name + " orders " + TEAS[tk.kind].name.toLowerCase() + (tk.rusk ? " and a rusk." : "."));
  });
  document.querySelectorAll('input[name="tea"]').forEach(function (r) { r.addEventListener("change", function () { say(TEAS[r.value].name + " chosen. PKR " + TEAS[r.value].price + "."); }); });
  $("ruskBox").addEventListener("change", function (e) { say(e.target.checked ? "A rusk on the saucer: PKR 40 more." : "No rusk this time."); });
  function logical(e) { var r = scene.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 400, y: (e.clientY - r.top) / r.height * 500 }; }
  scene.addEventListener("pointermove", function (e) {
    var p = logical(e), now = perf();
    ptr.vx = (p.x - ptr.x) / Math.max(0.016, now - ptr.t); ptr.vy = (p.y - ptr.y) / Math.max(0.016, now - ptr.t);
    ptr.vx = clamp(ptr.vx, -600, 600); ptr.vy = clamp(ptr.vy, -600, 600); ptr.x = p.x; ptr.y = p.y; ptr.t = now;
    bulbs.forEach(function (b) { if (Math.abs(b.x - p.x) < 18 && Math.abs(b.y + 9 - p.y) < 22) b.v += ptr.vx * 0.05; });
  });
  scene.addEventListener("pointerdown", function (e) {
    var p = logical(e);
    if (p.x > 360 && p.y < 96) { $("ring").click(); return; }
    if (stage === "boil" && Math.hypot(p.x - 96, p.y - 320) < 70) { lowerFlame(); return; }
    if (p.x > 30 && p.x < 170 && p.y > 270 && p.y < 360 && stage === "idle") startBrew();
  });
  window.addEventListener("keydown", function (e) { if ((e.key === "f" || e.key === "F") && stage === "boil") lowerFlame(); });

  /* ---------- 9. Auto demo until the visitor takes over ---------- */
  var demoOn = true, timers = [], KINDS = ["cardamom", "pink", "milk"], di = 0;
  function at(ms, fn) { timers.push(setTimeout(function () { if (demoOn) fn(); }, ms)); }
  function demo() {
    if (!demoOn) return;
    if (stage === "idle") {
      if (!tickets.filter(function (x) { return !x.done; }).length) addTicket(KINDS[di % 3], di % 2 === 0);
      di++;
      var tk = tickets.filter(function (x) { return !x.done; })[0]; if (tk) matchControls(tk);
      startBrew();
    }
    // lower the flame when the foam nears the rim, both boils
    var iv = setInterval(function () { if (!demoOn) { clearInterval(iv); return; } if (stage === "boil" && foam > 0.8) lowerFlame(); if (stage === "idle") { clearInterval(iv); at(1800, demo); } }, 100);
    timers.push(iv);
  }
  function stopDemo(e) { if (!e.isTrusted || !demoOn) return; demoOn = false; timers.forEach(function (x) { clearTimeout(x); clearInterval(x); }); }
  ["pointerdown", "keydown", "wheel"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });

  addTicket("cardamom", true);
  requestAnimationFrame(frame);
  at(700, demo);
})();
</script>
</body>
</html>
