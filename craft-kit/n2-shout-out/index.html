<!doctype html>
<!-- Chill & Craft · Shout Out · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shout Out · chat composer with mentions and topics</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: lilac and coral (light), grape night (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #ece7fb;
    --bg2: #f8f5ff;
    --card: #ffffff;
    --ink: #1c1433;
    --muted: #6f6790;
    --line: #e6e0f6;
    --soft: #f4f1fc;
    --vio: #6a46f5;
    --vio2: #8f72ff;
    --coral: #f0555a;
    --mint: #1fb98a;
    --bubble: #f1edfc;
    --shadow: rgba(60, 30, 140, .25);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0a19;
    --bg2: #171127;
    --card: #161024;
    --ink: #efeaff;
    --muted: #a097c4;
    --line: #2a2242;
    --soft: #1e1733;
    --vio: #9c86ff;
    --vio2: #b9a8ff;
    --coral: #ff7a7e;
    --mint: #3fe0ad;
    --bubble: #221a3a;
    --shadow: rgba(0, 0, 0, .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 18px 14px;
    overflow: hidden;
    background:
      radial-gradient(40% 30% at 15% 15%, color-mix(in srgb, var(--vio) 18%, transparent), transparent 70%),
      radial-gradient(40% 30% at 90% 85%, color-mix(in srgb, var(--coral) 14%, transparent), transparent 70%),
      radial-gradient(90% 80% at 50% 40%, var(--bg2), var(--bg));
  }
  .card {
    position: relative;
    width: min(100%, 420px);
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -48px var(--shadow), 0 10px 24px -16px var(--shadow);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.97); } }

  /* ---------- Header + team strip ---------- */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
  .chan { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hash { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--vio), var(--coral)); color: #fff; font-weight: 900; font-size: 18px; }
  h1 { margin: 0; font-size: 16.5px; letter-spacing: -.01em; }
  .chan small { display: block; font-size: 12px; color: var(--muted); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--mint); white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); animation: beat 1.8s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.5); opacity: .5; } }

  .team { display: flex; justify-content: space-between; gap: 4px; margin: 12px 0 0; padding: 0 12px 12px; border-bottom: 1px solid var(--line); list-style: none; }
  .team li { flex: 1; min-width: 0; }
  .mate {
    position: relative; display: grid; justify-items: center; gap: 4px; width: 100%; padding: 4px 0; border: 0; border-radius: 12px;
    background: none; color: var(--ink); font: 600 11px/1.1 var(--ff); cursor: pointer;
  }
  .mate:hover .av { transform: translateY(-3px); }
  .av {
    position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(140deg, var(--a1), var(--a2)); color: #fff; font-weight: 800; font-size: 13.5px;
    box-shadow: 0 6px 12px -6px var(--a2); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
    animation: bob 4s ease-in-out infinite; animation-delay: calc(var(--i) * -.7s);
  }
  @keyframes bob { 50% { translate: 0 -2px; } }
  .av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--card); background: var(--dot, var(--mint)); }
  .av .badge {
    position: absolute; top: -5px; right: -7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--coral); color: #fff; font-size: 10.5px; font-weight: 800; line-height: 18px; text-align: center;
    border: 2px solid var(--card); transform: scale(0); transition: transform .4s cubic-bezier(.34, 1.8, .64, 1);
  }
  .mate.pinged .badge { transform: scale(1); }
  .mate.ping .av { animation: jump .7s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes jump { 30% { transform: translateY(-10px) scale(1.12); } 60% { transform: translateY(1px) scale(.96); } }
  .mate.ping .av::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--coral); animation: ring .8s ease-out forwards; }
  @keyframes ring { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
  .mate span.nm { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* ---------- Thread ---------- */
  .thread { height: 214px; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 6px; scrollbar-width: thin; }
  .thread::-webkit-scrollbar { width: 6px; }
  .thread::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--line); }
  .m { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; margin-bottom: 10px; }
  .m .av { width: 30px; height: 30px; font-size: 11px; animation: none; box-shadow: none; }
  .m .av::after { display: none; }
  .m b { font-size: 12.5px; }
  .m time { margin-left: 6px; font-size: 11px; color: var(--muted); }
  .bub { display: inline-block; max-width: 100%; margin-top: 3px; padding: 8px 11px; border-radius: 4px 14px 14px 14px; background: var(--bubble); font-size: 14px; line-height: 1.42; overflow-wrap: anywhere; }
  .m.me { grid-template-columns: minmax(0, 1fr); justify-items: end; }
  .m.me .bub { border-radius: 14px 4px 14px 14px; background: linear-gradient(135deg, var(--vio), color-mix(in srgb, var(--vio) 70%, var(--coral))); color: #fff; }
  .m.me .who { text-align: right; }
  .pill { border-radius: 6px; font-weight: inherit; }
  .bub .pill { padding: 0 4px; background: color-mix(in srgb, var(--vio) 16%, transparent); color: var(--vio); font-weight: 700; }
  .bub .pill.t { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral); }
  .m.me .bub .pill { background: rgba(255, 255, 255, .22); color: #fff; }
  .seen { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 11px; color: var(--muted); opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s; }
  .seen.on { opacity: 1; transform: none; }
  .seen svg { width: 18px; height: 12px; }
  .seen path { fill: none; stroke: var(--mint); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; }
  .seen.on path { animation: draw .35s ease-out forwards; }
  .seen.on path + path { animation-delay: .18s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .typing { display: inline-flex; gap: 4px; padding: 11px 12px; border-radius: 4px 14px 14px 14px; background: var(--bubble); }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dots 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dots { 40% { transform: translateY(-4px); opacity: .5; } }
  .m.pop { animation: pop .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.95); } }

  /* ---------- Composer: a textarea over a highlight layer that paints the pills ---------- */
  .compose { position: relative; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .box { position: relative; border-radius: 16px; background: var(--soft); border: 1.5px solid var(--line); transition: border-color .2s, box-shadow .2s; }
  .box:focus-within { border-color: var(--vio); box-shadow: 0 0 0 4px color-mix(in srgb, var(--vio) 18%, transparent); }
  .box.shake { animation: shake .4s ease; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .hl, .mirror, textarea {
    margin: 0; padding: 11px 13px; border: 0; width: 100%; font: 400 15px/22px var(--ff); letter-spacing: 0;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 4;
  }
  .hl { position: absolute; inset: 0 0 auto 0; height: 66px; overflow: hidden; color: var(--ink); pointer-events: none; }
  .hl .pill { background: color-mix(in srgb, var(--vio) 18%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--vio) 18%, transparent); color: var(--vio); }
  .hl .pill.t { background: color-mix(in srgb, var(--coral) 18%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--coral) 18%, transparent); color: var(--coral); }
  .hl .q { border-bottom: 2px dotted var(--vio); }
  .hl.whoosh { animation: whoosh .4s ease-in forwards; }
  @keyframes whoosh { to { transform: translateY(-16px); opacity: 0; } }
  .mirror { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
  textarea {
    position: relative; display: block; height: 66px; resize: none; outline: none; background: transparent; overflow-y: auto;
    color: transparent; caret-color: var(--vio); scrollbar-width: none;
  }
  textarea::-webkit-scrollbar { display: none; }
  textarea::placeholder { color: var(--muted); }
  textarea::selection { background: color-mix(in srgb, var(--vio) 30%, transparent); color: transparent; }
  .tools { display: flex; align-items: center; gap: 6px; padding: 0 6px 6px 8px; }
  .tool {
    display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 10px; background: none; color: var(--muted);
    font: 800 16px/1 var(--ff); cursor: pointer; transition: background .2s, color .2s;
  }
  .tool:hover { background: var(--card); color: var(--vio); }
  .hintline { flex: 1; min-width: 0; overflow: hidden; font-size: 11.5px; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; }
  .send {
    position: relative; display: grid; place-items: center; width: 40px; height: 36px; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--vio), var(--vio2)); color: #fff; box-shadow: 0 8px 14px -8px var(--vio);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
  }
  .send:hover { transform: translateY(-2px); }
  .send:active { transform: scale(.92); }
  .send[aria-disabled="true"] { opacity: .45; }
  .send svg { width: 18px; height: 18px; }
  .send.fly svg { animation: fly .6s cubic-bezier(.5, 0, .6, 1); }
  @keyframes fly { 45% { transform: translate(16px, -16px) rotate(12deg); opacity: 0; } 46% { transform: translate(-14px, 14px); opacity: 0; } 100% { transform: none; opacity: 1; } }

  /* ---------- Suggestion popover ---------- */
  .pop {
    position: absolute; bottom: calc(100% - 4px); left: 12px; z-index: 5; width: 250px; padding: 6px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 24px 40px -18px var(--shadow), 0 4px 10px -6px var(--shadow);
    opacity: 0; transform: translateY(8px) scale(.96); transform-origin: 20% 100%; pointer-events: none;
    transition: opacity .18s, transform .32s cubic-bezier(.34, 1.56, .64, 1), left .2s ease;
  }
  .pop.on { opacity: 1; transform: none; pointer-events: auto; }
  .pop h2 { margin: 2px 8px 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .pop ul { margin: 0; padding: 0; list-style: none; }
  .opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; align-items: center; padding: 6px 8px; border-radius: 11px; cursor: pointer; animation: optIn .3s cubic-bezier(.34, 1.4, .64, 1) backwards; animation-delay: calc(var(--i) * 35ms); }
  @keyframes optIn { from { opacity: 0; transform: translateX(-8px); } }
  .opt[aria-selected="true"] { background: color-mix(in srgb, var(--vio) 13%, transparent); }
  .opt .av { width: 28px; height: 28px; font-size: 10.5px; animation: none; box-shadow: none; }
  .opt .av::after { width: 9px; height: 9px; border-width: 2px; }
  .opt .ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral); font-weight: 900; }
  .opt b { display: block; overflow: hidden; font-size: 13.5px; white-space: nowrap; text-overflow: ellipsis; }
  .opt b mark { background: none; color: var(--vio); text-decoration: underline 2px; text-underline-offset: 3px; }
  .opt small { display: block; font-size: 11.5px; color: var(--muted); }
  .none { margin: 6px 8px 8px; font-size: 12.5px; color: var(--muted); }

  button:focus-visible { outline: 3px solid var(--vio); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <header class="head">
      <div class="chan">
        <span class="hash" aria-hidden="true">#</span>
        <div><h1 id="title">orders</h1><small>Shop team · 6 members</small></div>
      </div>
      <span class="live"><i aria-hidden="true"></i>5 online</span>
    </header>
    <ul class="team" id="team" aria-label="Team: press a person to mention them"></ul>

    <div class="thread" id="thread" aria-label="Messages" aria-live="polite"></div>

    <div class="compose">
      <div class="pop" id="pop" role="dialog" aria-label="Suggestions">
        <h2 id="popTitle">People</h2>
        <ul id="opts" role="listbox" aria-label="Suggestions"></ul>
      </div>
      <div class="box" id="box">
        <div class="hl" id="hl" aria-hidden="true"></div>
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <label class="sr" for="ta">Message #orders</label>
        <textarea id="ta" rows="2" spellcheck="false" placeholder="Message #orders, type @ to mention" role="combobox" aria-autocomplete="list" aria-controls="opts" aria-expanded="false"></textarea>
        <div class="tools">
          <button class="tool" id="atBtn" type="button" aria-label="Mention someone">@</button>
          <button class="tool" id="hashBtn" type="button" aria-label="Add a topic">#</button>
          <span class="hintline" id="hintline">Enter sends · Shift+Enter new line</span>
          <button class="send" id="send" type="button" aria-label="Send message" aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <p class="sr" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function esc(s) { return s.replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }

  // ---------- The team and the topics (made-up shop) ----------
  var PEOPLE = [
    { n: "Ayesha Khan", r: "Packing", a: ["#ff8a5b", "#f0457a"], reply: "On it, packing them now." },
    { n: "Bilal Ahmed", r: "Rider", a: ["#3fb6ff", "#5163ff"], reply: "Leaving in 10 minutes." },
    { n: "Sana Malik", r: "Accounts", a: ["#22d3a5", "#0f8f7c"], reply: "Checked, the refund is done." },
    { n: "Usman Tariq", r: "Store", a: ["#ffc53d", "#ff7a1a"], reply: "Shelf restocked this morning.", away: true },
    { n: "Hira Javed", r: "Design", a: ["#b98cff", "#7446f0"], reply: "Banner coming up after lunch." },
    { n: "Zain Qureshi", r: "Support", a: ["#ff6fb5", "#c13cf0"], reply: "I will call the customer." }
  ];
  var TOPICS = [
    { n: "orders", d: "New and pending orders" }, { n: "returns", d: "Refunds and exchanges" },
    { n: "stock", d: "What is running low" }, { n: "eid-sale", d: "Plans for the Eid sale" }
  ];
  function initials(n) { return n.split(" ").map(function (w) { return w[0]; }).join(""); }
  function avatar(p, i) { return '<span class="av" style="--a1:' + p.a[0] + ";--a2:" + p.a[1] + ";--i:" + (i || 0) + (p.away ? ";--dot:#f5b83d" : "") + '">' + initials(p.n) + "</span>"; }
  var TOKEN = new RegExp("@(" + PEOPLE.map(function (p) { return p.n; }).join("|") + ")|#(" + TOPICS.map(function (t) { return t.n; }).join("|") + ")\\b", "g");

  var team = $("#team"), thread = $("#thread"), ta = $("#ta"), hl = $("#hl"), mirror = $("#mirror"), box = $("#box");
  var pop = $("#pop"), opts = $("#opts"), sendBtn = $("#send"), status = $("#status"), hintline = $("#hintline");

  team.innerHTML = PEOPLE.map(function (p, i) {
    return '<li><button class="mate" type="button" data-i="' + i + '" aria-label="Mention ' + p.n + ", " + p.r + '">' +
      avatar(p, i).replace("</span>", '<span class="badge">0</span></span>') + '<span class="nm">' + p.n.split(" ")[0] + "</span></button></li>";
  }).join("");
  var mates = [].slice.call(team.querySelectorAll(".mate"));

  // ---------- Thread ----------
  function render(text) {
    // text -> HTML with mention and topic pills (only names we know become pills)
    var out = "", at = 0;
    text.replace(TOKEN, function (m, person, topic, idx) {
      out += esc(text.slice(at, idx)) + '<span class="pill' + (topic ? " t" : "") + '">' + esc(m) + "</span>";
      at = idx + m.length;
      return m;
    });
    return out + esc(text.slice(at));
  }
  function clock(minsAgo) {
    var d = new Date(Date.now() - minsAgo * 60000);
    return d.toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit", hour12: true }).replace(/\s?(am|pm)/i, function (x) { return " " + x.trim().toUpperCase(); });
  }
  function addMsg(who, text, opt) {
    opt = opt || {};
    var el = document.createElement("div");
    el.className = "m" + (who ? "" : " me") + (opt.pop ? " pop" : "");
    el.innerHTML = (who ? avatar(who) : "") + '<div><div class="who"><b>' + (who ? esc(who.n) : "You") + "</b><time>" + clock(opt.ago || 0) + "</time></div>" +
      '<div class="bub">' + render(text) + "</div>" + (who ? "" : '<div class="seen"><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6.5l3 3L10 3"/><path d="M7 9.5L13 3"/></svg><span></span></div>') + "</div>";
    thread.appendChild(el);
    while (thread.children.length > 7) thread.firstChild.remove();
    thread.scrollTop = thread.scrollHeight;
    return el;
  }
  addMsg(PEOPLE[2], "Morning! 14 new orders came in overnight, most of them for the #eid-sale bundles.", { ago: 18 });
  addMsg(PEOPLE[0], "Great, I will start with the Karachi ones.", { ago: 12 });
  addMsg(PEOPLE[1], "Bike is fuelled, ready for the evening run.", { ago: 6 });

  // ---------- Composer: highlight layer + caret mirror ----------
  var trig = null; // { ch: "@" | "#", start, query }
  function paint() {
    var v = ta.value, html = render(v);
    if (trig) {
      // underline the half-typed query so you can see what is being searched
      var raw = v.slice(trig.start, trig.start + 1 + trig.query.length);
      html = render(v.slice(0, trig.start)) + '<span class="q">' + esc(raw) + "</span>" + render(v.slice(trig.start + 1 + trig.query.length));
    }
    hl.innerHTML = html + "​";
    hl.scrollTop = ta.scrollTop;
    var empty = !v.trim();
    sendBtn.setAttribute("aria-disabled", String(empty));
  }
  ta.addEventListener("scroll", function () { hl.scrollTop = ta.scrollTop; });

  function detect() {
    var pos = ta.selectionStart, before = ta.value.slice(0, pos), m = /(^|[\s(])([@#])([\w-]{0,20})$/.exec(before);
    if (m && ta.selectionStart === ta.selectionEnd) trig = { ch: m[2], start: pos - m[3].length - 1, query: m[3] };
    else trig = null;
    showPop();
    paint();
  }
  var items = [], active = 0;
  function showPop() {
    if (!trig) { closePop(); return; }
    var q = trig.query.toLowerCase();
    var list = trig.ch === "@" ? PEOPLE : TOPICS;
    items = list.map(function (x) {
      var n = x.n.toLowerCase(), at = n.indexOf(q), word = n.split(" ").some(function (w) { return w.indexOf(q) === 0; });
      return at < 0 ? null : { x: x, at: at, score: at === 0 ? 0 : word ? 1 : 2 };
    }).filter(Boolean).sort(function (a, b) { return a.score - b.score; }).slice(0, 4);
    active = Math.min(active, Math.max(0, items.length - 1));
    $("#popTitle").textContent = trig.ch === "@" ? "People" : "Topics";
    if (!items.length) opts.innerHTML = '<li class="none">No ' + (trig.ch === "@" ? "teammate" : "topic") + " called “" + esc(trig.query) + "”</li>";
    else opts.innerHTML = items.map(function (it, i) {
      var n = it.x.n, len = q.length, name = esc(n.slice(0, it.at)) + (len ? "<mark>" + esc(n.slice(it.at, it.at + len)) + "</mark>" : "") + esc(n.slice(it.at + len));
      return '<li class="opt" role="option" id="op' + i + '" style="--i:' + i + '" aria-selected="' + (i === active) + '">' +
        (trig.ch === "@" ? avatar(it.x) : '<span class="ic" aria-hidden="true">#</span>') +
        "<span><b>" + (trig.ch === "#" ? "#" : "") + name + "</b><small>" + esc(it.x.r || it.x.d) + "</small></span></li>";
    }).join("");
    // place the popover under the caret's column
    mirror.style.width = ta.clientWidth + "px";
    mirror.innerHTML = esc(ta.value.slice(0, trig.start)) + '<span id="mk">​</span>';
    var mk = $("#mk"), boxW = box.clientWidth, w = pop.offsetWidth || 250;
    var left = Math.max(0, Math.min(boxW - w, mk.offsetLeft - 18)) + 12;
    pop.style.left = left + "px";
    pop.classList.add("on");
    ta.setAttribute("aria-expanded", "true");
    if (items.length) ta.setAttribute("aria-activedescendant", "op" + active); else ta.removeAttribute("aria-activedescendant");
  }
  function closePop() {
    pop.classList.remove("on");
    ta.setAttribute("aria-expanded", "false");
    ta.removeAttribute("aria-activedescendant");
    active = 0;
  }
  function setActive(i) {
    active = i;
    [].forEach.call(opts.querySelectorAll(".opt"), function (li, j) { li.setAttribute("aria-selected", String(j === i)); });
    ta.setAttribute("aria-activedescendant", "op" + i);
  }
  function pick(i) {
    var it = items[i];
    if (!it || !trig) return;
    var token = trig.ch + it.x.n + " ", v = ta.value, end = trig.start + 1 + trig.query.length;
    ta.value = v.slice(0, trig.start) + token + v.slice(end);
    var caret = trig.start + token.length;
    ta.setSelectionRange(caret, caret);
    trig = null; closePop(); paint();
    status.textContent = (it.x.r ? "Mentioned " : "Added topic #") + it.x.n;
  }
  // insert text at the caret (team strip and the @ / # buttons)
  function insert(text) {
    var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    var pad = s > 0 && !/\s/.test(v[s - 1]) ? " " : "";
    ta.value = v.slice(0, s) + pad + text + v.slice(e);
    var c = s + pad.length + text.length;
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(c, c);
    detect();
  }

  ta.addEventListener("input", detect);
  ta.addEventListener("click", detect);
  ta.addEventListener("keyup", function (e) { if (/Arrow(Left|Right)|Home|End/.test(e.key)) detect(); });
  ta.addEventListener("blur", function () { setTimeout(function () { if (document.activeElement !== ta) closePop(); }, 150); });
  ta.addEventListener("keydown", function (e) {
    var open = pop.classList.contains("on") && items.length;
    if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); setActive((active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length); return; }
    if (open && (e.key === "Enter" || e.key === "Tab")) { e.preventDefault(); pick(active); return; }
    if (e.key === "Escape" && pop.classList.contains("on")) { e.preventDefault(); trig = null; closePop(); paint(); return; }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); return; }
    // Backspace right after a mention removes the whole mention at once
    if (e.key === "Backspace" && ta.selectionStart === ta.selectionEnd) {
      var pos = ta.selectionStart, before = ta.value.slice(0, pos), m = null, mm;
      TOKEN.lastIndex = 0;
      while ((mm = TOKEN.exec(before))) m = mm;
      if (m && m.index + m[0].length === pos) {
        e.preventDefault();
        ta.value = before.slice(0, m.index) + ta.value.slice(pos);
        ta.setSelectionRange(m.index, m.index);
        detect();
        status.textContent = "Removed " + m[0];
      }
    }
  });
  opts.addEventListener("pointerdown", function (e) { e.preventDefault(); }); // keep the textarea focused
  opts.addEventListener("click", function (e) { var li = e.target.closest(".opt"); if (li) pick(+li.id.slice(2)); });
  opts.addEventListener("pointermove", function (e) { var li = e.target.closest(".opt"); if (li && +li.id.slice(2) !== active) setActive(+li.id.slice(2)); });
  mates.forEach(function (b) { b.addEventListener("click", function () { insert("@" + PEOPLE[+b.dataset.i].n + " "); }); });
  $("#atBtn").addEventListener("click", function () { insert("@"); });
  $("#hashBtn").addEventListener("click", function () { insert("#"); });

  // ---------- Send: bubble flies up, mentioned people get pinged, one of them replies ----------
  var replyTimer = 0, replyId = 0, typingEl = null;
  function send() {
    var text = ta.value.trim();
    if (!text) {
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      hintline.textContent = "Write something first";
      status.textContent = "The message is empty.";
      return;
    }
    var from = box.getBoundingClientRect();
    var el = addMsg(null, text);
    var to = el.getBoundingClientRect();
    if (!reduce.matches && el.animate) {
      el.animate([
        { transform: "translate(" + (from.left - to.left) + "px," + (from.top - to.top) + "px) scale(.94)", opacity: .4 },
        { transform: "none", opacity: 1 }
      ], { duration: 620, easing: "cubic-bezier(.34,1.3,.64,1)" });
    }
    sendBtn.classList.remove("fly"); void sendBtn.offsetWidth; sendBtn.classList.add("fly");
    hl.classList.add("whoosh");
    setTimeout(function () { hl.classList.remove("whoosh"); paint(); }, 400);
    ta.value = ""; trig = null; closePop();
    hintline.textContent = "Enter sends · Shift+Enter new line";
    // who was mentioned?
    var named = [], m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(text))) if (m[1]) { var p = PEOPLE.findIndex(function (x) { return x.n === m[1]; }); if (named.indexOf(p) < 0) named.push(p); }
    var seen = el.querySelector(".seen");
    named.forEach(function (pi, k) {
      setTimeout(function () {
        var b = mates[pi], badge = b.querySelector(".badge");
        badge.textContent = +badge.textContent + 1;
        b.classList.add("pinged");
        b.classList.remove("ping"); void b.offsetWidth; b.classList.add("ping");
      }, 450 + k * 180);
    });
    setTimeout(function () {
      seen.querySelector("span").textContent = named.length ? "Sent · notified " + named.map(function (i) { return PEOPLE[i].n.split(" ")[0]; }).join(", ") : "Sent to #orders";
      seen.classList.add("on");
    }, 420);
    status.textContent = "Message sent" + (named.length ? ", " + named.length + " notified" : "");
    // the first person you mentioned starts typing and answers
    clearTimeout(replyTimer);
    if (typingEl) { typingEl.remove(); typingEl = null; }
    var id = ++replyId;
    if (named.length) {
      replyTimer = setTimeout(function () {
        if (id !== replyId) return;
        var who = PEOPLE[named[0]], t = typingEl = document.createElement("div");
        t.className = "m pop";
        t.innerHTML = avatar(who) + '<div><div class="who"><b>' + esc(who.n) + '</b><time>typing</time></div><span class="typing" aria-label="typing"><i></i><i></i><i></i></span></div>';
        thread.appendChild(t);
        thread.scrollTop = thread.scrollHeight;
        replyTimer = setTimeout(function () {
          t.remove(); typingEl = null;
          if (id !== replyId) return;
          addMsg(who, who.reply, { pop: true });
          var b = mates[named[0]];
          b.classList.remove("pinged");
          b.querySelector(".badge").textContent = "0";
        }, 1500);
      }, 1100);
    }
  }
  sendBtn.addEventListener("click", function () { send(); ta.focus({ preventScroll: true }); });
  paint();

  // ---------- Auto demo: types a message with a mention and a topic, then loops ----------
  var demoOn = true;
  function stopDemo(e) { if (e.isTrusted) demoOn = false; }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function type(s, gap) {
    for (var i = 0; i < s.length; i++) {
      await pause(gap || 60);
      var p = ta.selectionStart;
      ta.value = ta.value.slice(0, p) + s[i] + ta.value.slice(p);
      ta.setSelectionRange(p + 1, p + 1);
      ta.dispatchEvent(new Event("input"));
    }
  }
  var SCRIPTS = [
    [["@bi", 0, 900], ["please collect 3 boxes from ", null, 0], ["#ord", 0, 800], ["before 5", null, 0]],
    [["@sa", 0, 900], ["can you check the refund in ", null, 0], ["#ret", 0, 800], ["for order 2187", null, 0]],
    [["@hi", 0, 800], ["and ", null, 0], ["@zai", 0, 800], ["the ", null, 0], ["#eid", 0, 700], ["banner goes live tomorrow", null, 0]]
  ];
  async function demo() {
    try {
      await pause(900);
      var k = 0;
      while (demoOn) {
        ta.value = ""; ta.setSelectionRange(0, 0); detect();
        var steps = SCRIPTS[k++ % SCRIPTS.length];
        for (var s = 0; s < steps.length; s++) {
          var st = steps[s];
          await type(st[0], st[1] === null ? 38 : 120);
          if (st[1] !== null) {
            await pause(st[2]);
            if (pop.classList.contains("on") && items.length) { setActive(Math.min(1, items.length - 1)); await pause(280); setActive(0); await pause(260); pick(0); }
          }
        }
        await pause(800);
        send();
        await pause(4200);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
