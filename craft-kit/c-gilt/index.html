<!doctype html>
<!-- Chill & Craft · Gilt · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilt · black and gold code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (the card is black and gold in both themes) ---------- */
  :root {
    color-scheme: light;
    --stage: #f3eee3;
    --stage-glow: #fffaf0;
    --card: #0e0d0b;
    --card-2: #181610;
    --ivory: #efe6cf;
    --muted: #a39878;
    --gold: #d9b45a;
    --gold-hi: #fff0c2;
    --gold-lo: #5b4416;
    --deny: #c0392b;
    --shadow: rgba(60, 45, 10, .35);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #050505;
    --stage-glow: #1d1708;
    --shadow: rgba(0, 0, 0, .8);
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(circle at 50% 40%, var(--stage-glow), var(--stage) 65%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- Black card with a fine gold edge ---------- */
  .card {
    position: relative;
    overflow: hidden;
    width: min(100%, 400px);
    padding: 26px 20px 24px;
    border-radius: 22px;
    text-align: center;
    color: var(--ivory);
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .012) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, var(--card-2), var(--card) 60%);
    box-shadow: inset 0 0 0 1px rgba(217, 180, 90, .45), inset 0 0 0 6px var(--card), inset 0 0 0 7px rgba(217, 180, 90, .18), 0 30px 60px -25px var(--shadow);
  }
  /* Foil sweep that runs once on success */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 232, 170, .28) 50%, transparent 65%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .card.granted::after { transform: translateX(120%); transition: transform 1.1s ease; }

  /* Crest: art deco sunburst that turns into a gold medal */
  .crest { position: relative; width: 66px; height: 66px; margin: 0 auto 8px; }
  .crest svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.3, 1.5, .5, 1), opacity .3s; }
  .crest .medal { opacity: 0; transform: scale(.4) rotate(-90deg); }
  .card.granted .crest .sun { opacity: 0; transform: scale(1.4); }
  .card.granted .crest .medal { opacity: 1; transform: none; }

  .eyebrow { margin: 0; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 6px 0 4px; font: 600 clamp(21px, 5.6vw, 25px) / 1.2 ui-serif, Georgia, "Times New Roman", serif; letter-spacing: .02em; }
  .sub { margin: 0; font-size: 14px; color: var(--muted); }

  /* ---------- Debossed slots with a gold rim that catches the light ---------- */
  .slots { display: flex; justify-content: center; gap: clamp(9px, 3vw, 14px); margin: 24px 0 8px; }
  .slot {
    --lx: 20%;
    --ly: -10%;
    display: block;
    padding: 2px;
    border-radius: 15px;
    background: radial-gradient(110px circle at var(--lx) var(--ly), var(--gold-hi), var(--gold) 30%, var(--gold-lo) 70%, #241a06);
    transition: box-shadow .25s;
  }
  .slot input {
    display: block;
    width: clamp(50px, 14.5vw, 60px);
    height: 66px;
    padding: 0;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(180deg, #050504, #15130e);
    box-shadow: inset 0 4px 8px rgba(0, 0, 0, .95), inset 0 -1px 0 rgba(255, 215, 130, .14);
    color: var(--gold);
    -webkit-text-fill-color: var(--gold);
    caret-color: var(--gold-hi);
    text-align: center;
    font: 600 30px/1 ui-serif, Georgia, "Times New Roman", serif;
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 230, 160, .25);
    outline: none;
  }
  .slot input:disabled { opacity: 1; }
  .slot:focus-within { box-shadow: 0 0 0 3px rgba(217, 180, 90, .35), 0 0 22px rgba(217, 180, 90, .35); }
  .slot:hover:not(:focus-within) { box-shadow: 0 0 16px rgba(217, 180, 90, .28); }
  .slot { position: relative; overflow: hidden; }

  /* Each digit is pressed into the slot, then a shine runs across the gold */
  .slot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(105deg, transparent 30%, rgba(255, 240, 194, .55) 50%, transparent 70%);
    transform: translateX(-130%);
    pointer-events: none;
  }
  .slot.pop::after { animation: shine .75s ease .12s; }
  @keyframes shine { to { transform: translateX(130%); } }
  .slot.pop input { animation: press .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes press {
    0% { transform: scale(.8); box-shadow: inset 0 9px 16px #000; }
    55% { transform: scale(1.05); }
    100% { transform: none; }
  }

  /* Success: slots lift one after another and the card edge glows */
  .card.granted .slot { animation: lift .65s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * .09s + .35s); }
  @keyframes lift { 45% { transform: translateY(-12px); box-shadow: 0 12px 24px -8px rgba(217, 180, 90, .6); } }
  .card.granted { animation: goldPulse 1.6s ease; }
  @keyframes goldPulse {
    30% { box-shadow: inset 0 0 0 1px rgba(255, 232, 170, .9), inset 0 0 0 6px var(--card), inset 0 0 0 7px rgba(217, 180, 90, .6), 0 0 50px rgba(217, 180, 90, .45), 0 30px 60px -25px var(--shadow); }
  }
  .crest::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--gold);
    opacity: 0;
  }
  .card.granted .crest::after { animation: ring 1s ease-out .45s; }
  @keyframes ring { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(2.4); } }
  .slot.filled input { box-shadow: inset 0 4px 8px rgba(0, 0, 0, .95), inset 0 0 14px rgba(217, 180, 90, .18); }
  .card.granted .slot input { color: var(--gold-hi); -webkit-text-fill-color: var(--gold-hi); text-shadow: 0 0 12px rgba(255, 220, 140, .6); }
  .card.denied .slot { background: radial-gradient(110px circle at var(--lx) var(--ly), #ffb4a8, var(--deny) 35%, #4a0d08 75%); }
  .card.denied .slots { animation: shake .45s ease; }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .card.checking .slot { animation: glint .7s ease-in-out infinite alternate; animation-delay: calc(var(--i) * .1s); }
  @keyframes glint { to { box-shadow: 0 0 18px rgba(255, 220, 140, .55); } }

  /* ---------- Status, hint and buttons ---------- */
  .status { min-height: 22px; margin: 14px 0 4px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--gold-hi); }
  .status[data-tone="bad"] { color: #ff8e80; }
  .hint { margin: 6px 0 16px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
  .hint b { color: var(--gold); font: 600 18px ui-serif, Georgia, serif; letter-spacing: .35em; margin-left: 6px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 11px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .ghost { background: transparent; border: 1px solid rgba(217, 180, 90, .5); color: var(--gold); }
  .ghost:disabled { opacity: .45; cursor: default; }
  .solid { border: 0; color: #2b1f05; background: linear-gradient(135deg, var(--gold-hi), var(--gold) 45%, #a07a2a); }
  button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s, background .2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  .ghost:hover:not(:disabled) { background: rgba(217, 180, 90, .1); }
  .solid:hover { box-shadow: 0 0 22px rgba(217, 180, 90, .5); }
  button:active:not(:disabled) { transform: scale(.94); transition-duration: .08s; }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); letter-spacing: .12em; } }

  /* ---------- Celebration particles: gold flakes ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="crest" aria-hidden="true">
      <!-- Art deco sunburst -->
      <svg class="sun" viewBox="0 0 66 66" fill="none" stroke="#d9b45a" stroke-width="1.6">
        <path d="M8 46a25 25 0 0 1 50 0"/>
        <path d="M16 46a17 17 0 0 1 34 0"/>
        <path d="M33 46V14M33 46L15 24M33 46l18-22M33 46L9 34M33 46l24-12"/>
        <path d="M4 50h58M14 55h38"/>
        <circle cx="33" cy="46" r="3" fill="#d9b45a"/>
      </svg>
      <!-- Gold medal with a pressed check -->
      <svg class="medal" viewBox="0 0 66 66">
        <defs>
          <radialGradient id="coin" cx="35%" cy="30%" r="75%">
            <stop offset="0" stop-color="#fff0c2"/>
            <stop offset=".45" stop-color="#d9b45a"/>
            <stop offset="1" stop-color="#7a5a1c"/>
          </radialGradient>
        </defs>
        <circle cx="33" cy="33" r="29" fill="url(#coin)"/>
        <circle cx="33" cy="33" r="23" fill="none" stroke="#7a5a1c" stroke-width="1.5" stroke-dasharray="2 3"/>
        <path d="M22 34l8 8 15-17" fill="none" stroke="#5b4416" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 34l8 8 15-17" fill="none" stroke="#fff0c2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 1.4)" opacity=".7"/>
      </svg>
    </div>
    <p class="eyebrow">Private access</p>
    <h1 id="title">Enter your passcode</h1>
    <p class="sub">A 4-digit code was sent to your registered number.</p>

    <!-- Four debossed slots, each one a real input -->
    <div class="slots" id="slots" role="group" aria-labelledby="title" aria-describedby="hint">
      <span class="slot" style="--i:0"><input inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 4"></span>
      <span class="slot" style="--i:1"><input inputmode="numeric" autocomplete="off" aria-label="Digit 2 of 4"></span>
      <span class="slot" style="--i:2"><input inputmode="numeric" autocomplete="off" aria-label="Digit 3 of 4"></span>
      <span class="slot" style="--i:3"><input inputmode="numeric" autocomplete="off" aria-label="Digit 4 of 4"></span>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Demo code<b id="demo"></b></p>
    <div class="actions">
      <button type="button" class="ghost" id="resend">Resend code</button>
      <button type="button" class="solid" id="again" hidden>Lock again</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const card = document.getElementById("card");
  const slots = Array.from(document.querySelectorAll(".slot"));
  const boxes = slots.map((s) => s.querySelector("input"));
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");
  let demo = "";
  let busy = false;

  // ---- The gold rims catch the light where the pointer is ----
  card.addEventListener("pointermove", (e) => {
    slots.forEach((slot) => {
      const r = slot.getBoundingClientRect();
      slot.style.setProperty("--lx", e.clientX - r.left + "px");
      slot.style.setProperty("--ly", e.clientY - r.top + "px");
    });
  });
  card.addEventListener("pointerleave", () => {
    slots.forEach((slot) => {
      slot.style.removeProperty("--lx");
      slot.style.removeProperty("--ly");
    });
  });

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo;
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    restart(statusEl, "pop");
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;              // reflow so the animation plays again
    el.classList.add(cls);
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    slots[i].classList.toggle("filled", d !== "");
    if (d) {
      restart(slots[i], "pop");       // pressed in, then a shine
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
    }
  }

  // ---- Celebration: gold flakes drift out of the medal ----
  const fx = document.getElementById("fx");
  const GOLD = ["#fff0c2", "#d9b45a", "#f5d27a", "#a07a2a"];
  function flakes(from) {
    if (reduce) return;
    const r = from.getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    for (let n = 0; n < 42; n++) {
      const p = document.createElement("i");
      const w = 4 + Math.random() * 8;
      p.style.width = w + "px";
      p.style.height = w * (0.4 + Math.random() * 0.6) + "px";
      p.style.background = GOLD[n % GOLD.length];
      p.style.boxShadow = "0 0 6px rgba(255, 220, 140, .7)";
      fx.append(p);
      const angle = Math.random() * Math.PI * 2;
      const d = 60 + Math.random() * 160;
      const dx = Math.cos(angle) * d;
      const dy = Math.sin(angle) * d;
      const spin = (Math.random() - 0.5) * 900;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.2)", opacity: 1 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + dy) + "px) rotate(" + spin / 2 + "deg) rotateY(180deg)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (x0 + dx * 1.1) + "px," + (y0 + dy + 140) + "px) rotate(" + spin + "deg) rotateY(540deg)", opacity: 0 }
      ], { duration: 1600 + Math.random() * 900, easing: "cubic-bezier(.2, .65, .35, 1)" }).onfinish = () => p.remove();
    }
  }
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // ---- Check the code ----
  async function verify(code) {
    busy = true;
    setLocked(true);
    say("Verifying…");
    card.classList.add("checking");
    await wait(900);
    card.classList.remove("checking");

    if (code === demo) {
      // Stage 1: foil shine sweeps the card. Stage 2: crest turns into a medal.
      // Stage 3: ring, rising slots and a shower of gold flakes.
      card.classList.add("granted");
      say("Access granted. Welcome, member.", "good");
      await wait(450);
      flakes(card.querySelector(".crest"));
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      card.classList.add("denied");
      say("Access denied. Please check the code.", "bad");
      await wait(800);
      card.classList.remove("denied");
      clearAll();
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", () => {
    card.classList.remove("granted");
    againBtn.hidden = true;
    clearAll();
    newCode();
    busy = false;
    setLocked(false);
    say("Locked. A new demo code is ready.");
    focusBox(0);
  });

  let cooldown = 0;
  resendBtn.addEventListener("click", () => {
    if (busy || cooldown) return;
    newCode();
    clearAll();
    say("A new code has been sent.");
    focusBox(0);
    cooldown = 15;
    resendBtn.disabled = true;
    resendBtn.textContent = "Resend in 15s";
    const tick = setInterval(() => {
      cooldown--;
      resendBtn.textContent = cooldown ? "Resend in " + cooldown + "s" : "Resend code";
      if (!cooldown) { clearInterval(tick); resendBtn.disabled = false; }
    }, 1000);
  });

  newCode();
})();
</script>
</body>
</html>
