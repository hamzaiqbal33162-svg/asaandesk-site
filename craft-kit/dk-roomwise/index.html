<!doctype html>
<!-- Chill & Craft · Roomwise · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomwise · Family household money</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: lemon cream + citrus (light), olive night + citrus (dark) ---------- */
  :root {
    --bg: #fffbea; --surface: #ffffff; --surface-2: #fff4c7; --panel: #fffef8; --tab: #f6edc4;
    --ink: #1e3a2b; --muted: #6d7a5f; --line: #efe3b0; --grid: #f3ebc8;
    --lime: #86b817; --orange: #ff8a1f; --lemon: #ffd23f; --berry: #d9467a; --leaf: #2f8f5b; --sky: #3ba3d0;
    --accent: #ff8a1f; --accent-ink: #1e1200; --good: #2f8f5b; --bad: #d9467a; --warn: #ff8a1f;
    --radius: 22px; --radius-sm: 14px; --tip-bg: #1e3a2b; --tip-ink: #fffbea;
    --wall: #fff8dc; --roof: #e2533f;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #151a10; --surface: #1d2416; --surface-2: #262f1c; --panel: #1f2717; --tab: #10140b;
    --ink: #f3f6e4; --muted: #a3ad8c; --line: #313b24; --grid: #283120;
    --lime: #b6e33d; --orange: #ffa04a; --lemon: #ffe066; --berry: #ff7aa6; --leaf: #6fd39a; --sky: #6cc6ef;
    --accent: #ffa04a; --good: #6fd39a; --bad: #ff7aa6;
    --tip-bg: #f3f6e4; --tip-ink: #1d2416;
    --wall: #232c19; --roof: #b9432f;
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- Shell: header + folder tabs ---------- */
  body { background: var(--tab); color: var(--ink); font: 15px/1.45 "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  .head { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 16px 24px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 900; font-size: 1.4rem; letter-spacing: -.02em; }
  .brand svg { width: 40px; height: 40px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
  .brand:hover svg { transform: rotate(-10deg) scale(1.06); }
  .head .grow { flex: 1; }
  .fam { display: flex; }
  .fam .cc-av { width: 34px; height: 34px; margin-left: -8px; border: 3px solid var(--tab); font-size: .72rem; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
  .icon-btn:hover { background: var(--lemon); color: #1e3a2b; }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .icon-btn .ic { width: 19px; height: 19px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px; border-radius: 10px; background: var(--berry); color: #fff; font-size: .66rem; font-weight: 900; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--tab); }
  .badge:empty { display: none; }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .menu-btn, .scrim { display: none; }
  .tabs { position: relative; max-width: 1320px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; align-items: flex-end; }
  .tabs a { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 12px 18px 14px; border-radius: 18px 18px 0 0; color: var(--muted); text-decoration: none; font-weight: 800; transition: color .2s, transform .25s cubic-bezier(.3,1.6,.5,1); }
  .tabs a:hover { color: var(--ink); transform: translateY(-2px); }
  .tabs a[aria-current="page"] { color: var(--ink); }
  .tabs a .dot { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: var(--c); color: #1e3a2b; }
  .tabs .ic { width: 16px; height: 16px; }
  .tabs .mark { position: absolute; bottom: 0; left: 0; top: 0; background: var(--bg); border-radius: 18px 18px 0 0; transition: transform .45s cubic-bezier(.3,1.3,.5,1), width .3s; }
  .sheet { background: var(--bg); min-height: calc(100vh - 130px); }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 24px 50px; overflow-x: clip; }
  .page-h { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-h h1 { margin: 0; font-size: 1.8rem; font-weight: 900; letter-spacing: -.02em; }
  .page-h p { margin: 0; color: var(--muted); }
  .page-h .grow { flex: 1; }
  .btn { border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--orange); color: #1e1200; border-color: var(--ink); }
  .btn.danger { background: var(--berry); }
  .cc-dialog { border: 2px solid var(--ink); box-shadow: 0 8px 0 var(--ink); }

  /* ---------- Chunky cards ---------- */

  if (!b || b.day === day) return;
  b.day = day; save(); toast(`${b.name} moved to the ${day}${[, "st", "nd", "rd"][day % 10 > 3 || Math.floor(day / 10) === 1 ? 0 : day % 10] || "th"}`); rerender();
}
function billMenu(id) {
  const b = S.bills.find((x) => x.id === id);
  if (!b) return;
  pickBox(`${b.name} · ${money(b.amt)}`, [b.paid ? { value: "unpay", label: "Mark as not paid", icon: "refresh" } : { value: "pay", label: "Pay from the family pot", icon: "check" }, { value: "move", label: "Move to another day…", icon: "calendar" }, { value: "edit", label: "Edit bill", icon: "edit" }, { value: "del", label: "Delete bill", icon: "trash" }]).then((v) => {
    if (v === "pay") { if (S.pot < b.amt) return toast("Not enough in the pot", "bad"); S.pot -= b.amt; b.paid = true; save(); toast(b.name + " paid"); rerender(); }
    if (v === "unpay") { S.pot += b.amt; b.paid = false; save(); toast(b.name + " marked unpaid"); rerender(); }
    if (v === "move") { const dim = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate(); setTimeout(() => pickBox("Move " + b.name + " to…", Array.from({ length: dim }, (_, i) => ({ value: i + 1, label: `${DAY[new Date(TODAY.getFullYear(), TODAY.getMonth(), i + 1).getDay()]} ${i + 1} ${MON[TODAY.getMonth()]}`, hint: S.bills.filter((x) => x.day === i + 1).map((x) => x.name).join(", ") }))).then((d) => d && moveBill(b.id, d)), 300); }
    if (v === "edit") setTimeout(() => formModal({ title: "Edit bill", values: b, fields: [{ name: "name", label: "Bill", required: true }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1 }], onSubmit: (x) => { Object.assign(b, x); save(); toast("Saved"); rerender(); } }), 300);
    if (v === "del") setTimeout(() => confirmBox(`Delete the bill "${b.name}"?`).then((ok) => { if (ok) { S.bills = S.bills.filter((x) => x !== b); save(); toast("Bill deleted"); rerender(); } }), 300);
  });
}

/* ---------- Spending ---------- */
PAGE.spending = () => {
  $("#acts").innerHTML = `<button class="btn primary" id="addS">${ic("plus")}Add spending</button>`;
  view.innerHTML = `<div class="grid"><section class="card s12"><div class="card-h"><h2>Daily spending</h2><span class="grow"></span><div class="seg" role="group" aria-label="Range">${["7D", "30D", "90D"].map((r) => `<button type="button" data-r="${r}" aria-pressed="${r === spR}">${r}</button>`).join("")}</div></div><div id="dLine"></div></section><section class="card s12"><div id="sTbl"></div></section></div>`;
  const draw = (m) => { const n = { "7D": 7, "30D": 30, "90D": 90 }[spR], days = Array.from({ length: n }, (_, i) => iso(addDays(TODAY, i - n + 1))); lineChart($("#dLine"), { labels: days.map(fdate), area: true, height: 210, series: [{ name: "Spent", data: days.map((d) => sum(S.tx.filter((t) => t.date === d).map((t) => t.amt))), color: "var(--orange)" }], tipFmt: (v) => money(v) }, m); };
  draw(false);
  $$("[data-r]", view).forEach((b) => b.addEventListener("click", () => { spR = b.dataset.r; $$("[data-r]", view).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); draw(true); }));
  dataTable($("#sTbl"), {
    rows: () => S.tx.map((t) => ({ ...t, room: roomOf(t.cat).room, name: fname(t.who), _t: t })), sort: "date", size: 10, search: "Search spending…", keys: ["what", "room", "name", "cat"],
    chips: { k: "room", values: ["All"].concat(ROOMS.map((r) => r.room)) },
    cols: [{ k: "date", label: "Date", f: (v) => fdate(v) }, { k: "what", label: "What", f: (v) => `<b>${esc(v)}</b>` }, { k: "room", label: "Room", f: (v, r) => `<span class="tag" style="background:var(${roomOf(r.cat).c});color:#1e3a2b">${esc(v)}</span>` }, { k: "name", label: "Who" }, { k: "amt", label: "Amount", cls: "r", f: (v) => `<span class="amt">${money(v)}</span>` }, { k: "x", label: "", sort: false, f: () => `<div class="rowbtns"><button data-act="edit" aria-label="Edit">${ic("edit")}</button><button data-act="del" aria-label="Delete">${ic("trash")}</button></div>` }],
    onAct: (a, r) => { if (a === "edit") spendForm(r._t); else confirmBox(`Delete "${r.what}"? ${money(r.amt)} goes back to the pot.`).then((ok) => { if (ok) { S.tx = S.tx.filter((t) => t !== r._t); S.pot += r.amt; save(); toast("Deleted"); rerender(); } }); },
    onRow: (r) => spendForm(r._t),
  });
  $("#addS").addEventListener("click", () => spendForm());
};
let spR = "30D";

/* ---------- Plans (family saving goals) ---------- */
PAGE.plans = () => {
  $("#acts").innerHTML = `<button class="btn primary" id="newP">${ic("plus")}New plan</button>`;
  view.innerHTML = `<div class="grid">${S.plans.map((p) => { const pc = clamp((p.saved / p.target) * 100, 0, 100), days = Math.max(0, Math.ceil((new Date(p.date) - TODAY) / 864e5)); return `<section class="card s6" data-plan="${p.id}"><div class="card-h"><span class="icon-btn" style="width:40px;height:40px;background:var(--lemon);color:#1e3a2b">${ic(p.icon)}</span><div><h2>${esc(p.name)}</h2><small>${fdateY(p.date)} · ${days} days to go</small></div></div><div style="display:flex;justify-content:space-between;font-weight:800"><span>${money(p.saved)}</span><span class="muted">${Math.round(pc)}% of ${money(p.target)}</span></div><div class="bar2" style="margin:10px 0 12px"><i data-w="${pc}" style="background:linear-gradient(90deg,var(--lime),var(--lemon))"></i></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><small class="muted">${p.saved >= p.target ? "Ready!" : "Put aside " + money(Math.ceil((p.target - p.saved) / Math.max(1, days / 30))) + " a month"}</small><div style="display:flex;gap:6px"><button class="btn sm primary" data-a="add">${ic("plus")}Add</button><button class="btn sm" data-a="edit" aria-label="Edit plan">${ic("edit")}</button><button class="btn sm" data-a="del" aria-label="Delete plan">${ic("trash")}</button></div></div></section>`; }).join("")}</div>`;
  fill();
  view.querySelector(".grid").addEventListener("click", (e) => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const p = S.plans.find((x) => x.id === b.closest("[data-plan]").dataset.plan), a = b.dataset.a;
    if (a === "add") formModal({ title: "Add to " + p.name, intro: `From the family pot (${money(S.pot)}).`, fields: [{ name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1, max: Math.max(1, S.pot) }], onSubmit: (v) => { S.pot -= v.amt; p.saved += v.amt; save(); toast(p.saved >= p.target ? p.name + " is fully saved!" : Math.round((p.saved / p.target) * 100) + "% saved"); rerender(); } });
    if (a === "edit") planForm(p);
    if (a === "del") confirmBox(`Delete the plan "${p.name}"? ${money(p.saved)} goes back to the pot.`).then((ok) => { if (ok) { S.pot += p.saved; S.plans = S.plans.filter((x) => x !== p); save(); toast("Plan deleted"); rerender(); } });
  });
  $("#newP").addEventListener("click", () => planForm());
};
function planForm(p) { formModal({ title: p ? "Edit plan" : "New plan", values: p || { icon: "star", date: iso(addDays(TODAY, 120)) }, fields: [{ name: "name", label: "Plan", required: true, placeholder: "e.g. Cousin's wedding" }, { name: "target", label: "Target (Rs)", type: "number", required: true, min: 100, half: true }, { name: "date", label: "When", type: "date", required: true, half: true, check: (v) => (new Date(v) <= TODAY ? "Pick a future date" : "") }, { name: "icon", label: "Icon", type: "select", options: [["star", "Star"], ["gift", "Gift"], ["plane", "Trip"], ["school", "School"], ["home", "Home"], ["heart", "Family"]] }], onSubmit: (v) => { if (p) Object.assign(p, v); else S.plans.push({ id: uid(), saved: 0, ...v }); save(); toast(p ? "Plan saved" : "Plan created"); rerender(); } }); }

/* ---------- Family ---------- */
PAGE.family = () => {
  const earners = S.fam.filter((m) => m.earns > 0), totE = sum(earners.map((m) => m.earns)) || 1, totC = sum(earners.map((m) => S.contrib[m.id] || 0)) || 1;
  view.innerHTML = `<div class="grid">
    <section class="card s7"><div class="card-h"><h2>Who puts in</h2><small>this month's contributions to the pot</small><span class="grow"></span><button class="btn sm" id="contrib">${ic("plus")}Add contribution</button></div>
      <div class="split" aria-hidden="true">${earners.map((m, i) => `<i data-fb="${((S.contrib[m.id] || 0) / totC) * 100}" style="background:${["var(--lime)", "var(--orange)", "var(--sky)"][i % 3]}">${fname(m.id)}</i>`).join("")}</div>
      <ul class="feed" style="margin-top:12px">${earners.map((m) => `<li>${avatar(m.name)}<span class="grow"><b>${fname(m.id)}</b><br><small>earns ${money(m.earns)} · fair share ${Math.round((m.earns / totE) * 100)}%</small></span><span class="amt">${money(S.contrib[m.id] || 0)}</span></li>`).join("")}</ul></section>
    <section class="card s5"><div class="card-h"><h2>Who spent</h2><small>this month</small></div><div id="whoD"></div></section>
    <section class="s12"><div class="members">${S.fam.map((m) => `<section class="card member" data-m="${m.id}"><div class="card-h">${avatar(m.name)}<div><h2>${esc(m.name)}</h2><small>${esc(m.role)}</small></div></div><p class="muted" style="margin:0 0 10px">Spent this month: <b style="color:var(--ink)">${money(sum(S.tx.filter((t) => t.who === m.id && sameMonth(t.date)).map((t) => t.amt)))}</b></p><div style="display:flex;gap:6px"><button class="btn sm" data-a="edit">${ic("edit")}Edit</button>${m.role === "Kid" ? `<button class="btn sm" data-a="del" aria-label="Remove ${esc(m.name)}">${ic("trash")}</button>` : ""}</div></section>`).join("")}<section class="card member" style="display:grid;place-items:center"><button class="btn primary" id="addM">${ic("plus")}Add member</button></section></div></section>
  </div>`;
  requestAnimationFrame(() => $$("[data-fb]", view).forEach((i) => (i.style.flexBasis = i.dataset.fb + "%")));
  donut($("#whoD"), { items: S.fam.map((m, i) => ({ label: fname(m.id), value: sum(S.tx.filter((t) => t.who === m.id && sameMonth(t.date)).map((t) => t.amt)), color: ["var(--lime)", "var(--orange)", "var(--sky)", "var(--berry)"][i % 4] })), size: 160, thick: 24, center: [moneyShort(spentAll()), "spent"], fmt: (v) => money(v) });
  $("#contrib").addEventListener("click", () => formModal({ title: "Add to the family pot", values: { who: earners[0] && earners[0].id }, fields: [{ name: "who", label: "From", type: "select", options: earners.map((m) => [m.id, fname(m.id)]) }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 100 }], onSubmit: (v) => { S.contrib[v.who] = (S.contrib[v.who] || 0) + v.amt; S.pot += v.amt; save(); toast(`${fname(v.who)} added ${money(v.amt)}`); rerender(); } }));
  view.querySelector(".members").addEventListener("click", (e) => { const b = e.target.closest("[data-a]"); if (!b) return; const m = mem(b.closest("[data-m]").dataset.m); if (b.dataset.a === "edit") memberForm(m); else confirmBox(`Remove ${m.name} from the household?`, "Remove").then((ok) => { if (ok) { S.fam = S.fam.filter((x) => x !== m); save(); drawFam(); toast("Removed"); rerender(); } }); });
  $("#addM").addEventListener("click", () => memberForm());
};
function memberForm(m) { formModal({ title: m ? "Edit " + fname(m.id) : "Add member", values: m || { role: "Kid", earns: 0 }, fields: [{ name: "name", label: "Full name", required: true }, { name: "role", label: "Role", type: "select", options: ["Parent", "Kid", "Grandparent"], half: true }, { name: "earns", label: "Monthly income (Rs)", type: "number", min: 0, half: true }], onSubmit: (v) => { v.earns = +v.earns || 0; if (m) Object.assign(m, v); else S.fam.push({ id: uid(), ...v }); save(); drawFam(); toast(m ? "Saved" : "Welcome to the family!"); rerender(); } }); }

/* ---------- Settings ---------- */
PAGE.settings = () => {
  view.innerHTML = `<div class="grid"><section class="card s12">
    <div class="set-row"><div><b>Household name</b><small>${esc(S.name)}</small></div><button class="btn" id="hn">${ic("edit")}Rename</button></div>
    <div class="set-row"><div><b>Family pot</b><small>${money(S.pot)}</small></div><button class="btn" id="adj">${ic("plus")}Add money</button></div>
    <div class="set-row"><div><b>Theme</b><small>Lemon day or olive night</small></div><button class="btn" data-theme-toggle>${ic("moon")}Toggle theme</button></div>
    <div class="set-row"><div><b>Reset demo data</b><small>Rooms, bills, plans and spending go back to the start</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div></section></div>`;
  $("#hn").addEventListener("click", () => formModal({ title: "Household name", values: { name: S.name }, fields: [{ name: "name", label: "Name", required: true }], onSubmit: (v) => { S.name = v.name; save(); toast("Renamed"); rerender(); } }));
  $("#adj").addEventListener("click", () => formModal({ title: "Add money to the pot", fields: [{ name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1 }], onSubmit: (v) => { S.pot += v.amt; save(); toast(money(v.amt) + " added"); rerender(); } }));
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data?", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); save(); drawFam(); drawBell(); toast("Demo data reset"); rerender(); } }));
};

/* ---------- Start ---------- */
drawFam();
drawBell();
initShell(() => pageCmds(PAGES, [{ label: "Add spending", icon: "plus", run: () => spendForm() }, { label: "New plan", icon: "star", run: () => planForm() }].concat(ROOMS.map((r) => ({ label: "Open the " + r.room.toLowerCase(), icon: "home", run: () => roomModal(r.k) })))));
startRouter(PAGES.map((p) => p[0]), "home", render);
</script>
</body>
</html>
