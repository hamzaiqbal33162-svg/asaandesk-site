<!doctype html>
<!-- Chill & Craft · Airwave · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airwave · phone number with country code, then a 6-digit code</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: emerald, cream and saffron ---------- */
  :root {
    color-scheme: light;
    --bg: #f6efdc;
    --bg-2: #dcefe4;
    --card: #fffcf4;
    --ink: #143029;
    --muted: #5f7a72;
    --line: rgba(20, 48, 41, .13);
    --em: #0d7a5f;
    --em-2: #23a37f;
    --saf: #f2a33a;
    --saf-2: #ffc670;
    --ok: #109e6f;
    --bad: #d9443f;
    --field: #f3f0e3;
    --sky-a: #d9f0e6;
    --sky-b: #fff3d9;
    --city: #b9d8c9;
    --city-2: #9cc7b3;
    --steel: #3d5b52;
    --shadow: rgba(20, 70, 50, .25);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1a17;
    --bg-2: #10261f;
    --card: #12241f;
    --ink: #eaf6f0;
    --muted: #9dbcb2;
    --line: rgba(234, 246, 240, .13);
    --em: #3cc99c;
    --em-2: #67dfb7;
    --saf: #ffb54f;
    --saf-2: #ffd08a;
    --ok: #3cd69f;
    --bad: #ff7a6f;
    --field: #1a322b;
    --sky-a: #0f2e27;
    --sky-b: #1d2a1f;
    --city: #1d3d34;
    --city-2: #17342c;
    --steel: #8fb5a9;
    --shadow: rgba(0, 0, 0, .6);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px 16px;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(circle at 80% 12%, var(--bg-2), transparent 50%),
      radial-gradient(circle at 10% 90%, rgba(242, 163, 58, .18), transparent 50%),
      var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .card { position: relative; width: min(100%, 420px); border-radius: 28px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 40px 70px -40px var(--shadow); animation: rise .8s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  .top { position: relative; overflow: hidden; border-radius: 28px 28px 0 0; }

  /* ---------- Scene: tower, waves and phone ---------- */
  .scene { display: block; width: 100%; height: auto; }
  .scene .s1 { stop-color: var(--sky-a); }
  .scene .s2 { stop-color: var(--sky-b); }
  .scene .city { fill: var(--city); }
  .scene .city2 { fill: var(--city-2); }
  .scene .steel { stroke: var(--steel); stroke-width: 2.2; stroke-linecap: round; fill: none; }
  .scene .lamp { fill: #ff4d4d; animation: blinkLamp 1.6s steps(1) infinite; }
  .scene.verified .lamp { fill: var(--ok); animation: none; }
  @keyframes blinkLamp { 50% { opacity: .2; } }
  .scene .wave { fill: none; stroke: var(--em-2); stroke-width: 2.4; stroke-linecap: round; opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
  .scene.ping .wave { animation: wave 1.1s ease-out 2; }
  .scene.ping .wave.w2 { animation-delay: .18s; }
  .scene.ping .wave.w3 { animation-delay: .36s; }
  @keyframes wave { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: .9; } 100% { opacity: 0; transform: scale(1.25); } }
  .scene .route { fill: none; stroke: var(--em-2); stroke-width: 1.8; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .45; }
  .scene .packet { fill: var(--saf); opacity: 0; }
  .scene .env { opacity: 0; }
  .scene .env rect { fill: var(--saf); }
  .scene .env path { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linejoin: round; }
  .scene .phone { transform-box: fill-box; transform-origin: 50% 50%; }
  .scene .phone.buzz { animation: buzz .5s linear; }
  @keyframes buzz { 10%, 30%, 50%, 70%, 90% { transform: rotate(-7deg); } 20%, 40%, 60%, 80% { transform: rotate(7deg); } }
  .scene .pbody { fill: var(--ink); }
  .scene .pscreen { fill: var(--em); }
  .scene .pdot { fill: var(--saf); transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); transition: transform .45s cubic-bezier(.34, 1.9, .5, 1); }
  .scene.sms .pdot { transform: scale(1); }
  .scene .pcheck { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .5s ease .1s; }
  .scene.verified .pcheck { stroke-dashoffset: 0; }
  .scene .halo { fill: none; stroke: var(--ok); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
  .scene.verified .halo { animation: halo 1s ease-out; }
  @keyframes halo { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2); } }
  .scene .cloud { fill: #fff; opacity: .7; animation: drift 30s linear infinite; }
  .scene .cloud.k2 { animation-duration: 44s; animation-delay: -20s; opacity: .5; }
  [data-theme="dark"] .scene .cloud { opacity: .12; }
  @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(420px); } }

  /* SMS toast that drops over the scene */
  .toast {
    position: absolute; left: 12px; right: 12px; top: 10px; z-index: 2;
    display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 18px; text-align: left;
    background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px var(--line), 0 14px 26px -16px var(--shadow);
    transform: translateY(-130%); opacity: 0; transition: transform .6s cubic-bezier(.3, 1.5, .5, 1), opacity .3s;
  }
  .toast.in { transform: none; opacity: 1; }
  .toast i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(160deg, var(--em-2), var(--em)); }
  .toast span { font-size: 12.5px; line-height: 1.35; color: var(--muted); }
  .toast b { color: var(--ink); }
  .toast .num { font-weight: 800; color: var(--em); letter-spacing: .08em; white-space: nowrap; }

  /* ---------- Steps: all three share one grid cell, so the height never jumps ---------- */
  .steps { display: grid; overflow-x: clip; padding: 18px 22px 22px; }
  .step { grid-area: 1 / 1; opacity: 0; visibility: hidden; transform: translateX(40px); transition: transform .55s cubic-bezier(.3, 1.3, .5, 1), opacity .3s, visibility 0s .55s; }
  .step.past { transform: translateX(-40px); }
  .step.now { opacity: 1; visibility: visible; transform: none; transition: transform .55s cubic-bezier(.3, 1.3, .5, 1), opacity .35s .05s, visibility 0s; }
  h1 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .sub { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .sub b { color: var(--ink); white-space: nowrap; }

  /* Country picker and number */
  .numrow { position: relative; display: flex; gap: 8px; margin-top: 16px; }
  .cc {
    flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px 0 9px; height: 50px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 750; font-size: 15px; transition: box-shadow .2s;
  }
  .cc:hover, .cc[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--em); }
  .cc svg { transition: transform .3s; }
  .cc[aria-expanded="true"] svg { transform: rotate(180deg); }
  .flag { flex: none; width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .12); }
  .tel { position: relative; flex: 1; min-width: 0; }
  .tel input {
    width: 100%; height: 50px; padding: 0 40px 0 14px; border: 0; border-radius: 14px; outline: none;
    background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 17px; font-weight: 650; letter-spacing: .03em; font-variant-numeric: tabular-nums;
    transition: box-shadow .2s;
  }
  .tel input:focus { box-shadow: inset 0 0 0 2px var(--em), 0 0 0 5px rgba(13, 122, 95, .13); }
  .tel .tick { position: absolute; right: 12px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); transform: scale(0); transition: transform .4s cubic-bezier(.34, 1.9, .5, 1); }
  .tel.valid .tick { transform: scale(1); }
  .hint { min-height: 18px; margin: 8px 2px 0; font-size: 12.5px; color: var(--muted); }
  .pop {
    position: absolute; left: 0; top: 56px; z-index: 5; width: min(290px, 100%); padding: 8px; border-radius: 16px;
    background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 22px 40px -18px var(--shadow);
    transform-origin: 20% 0; animation: popIn .35s cubic-bezier(.3, 1.5, .5, 1);
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(.94); } }
  .pop input { width: 100%; padding: 9px 11px; border: 0; border-radius: 10px; outline: none; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; }
  .pop input:focus { box-shadow: inset 0 0 0 2px var(--em); }
  .pop ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 196px; overflow: auto; }
  .pop li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 8px 9px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .pop li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pop li.active { background: rgba(13, 122, 95, .12); }
  .pop li[aria-selected="true"] { font-weight: 750; }
  .pop .none { padding: 10px; font-size: 13px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 13px 18px;
    border: 0; border-radius: 14px; cursor: pointer; font-weight: 800; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, var(--em), var(--em-2)); box-shadow: 0 12px 22px -12px var(--shadow);
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled), .btn.press { transform: scale(.96); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn[aria-busy="true"]:disabled { opacity: 1; }  /* still working: keep it bright */
  .btn.ghost { color: var(--em); background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); }
  .link { padding: 0; border: 0; background: none; color: var(--em); font-weight: 750; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .btn:focus-visible, .cc:focus-visible, .link:focus-visible { outline: 2.5px solid var(--saf); outline-offset: 3px; }
  .spin { display: inline-block; vertical-align: -3px; flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Code boxes */
  .boxes { display: flex; justify-content: center; gap: clamp(5px, 1.8vw, 8px); margin-top: 18px; }
  .cell { flex: 0 1 auto; width: clamp(36px, 11vw, 48px); height: 56px; }
  .cell input {
    width: 100%; height: 100%; padding: 0; border: 0; border-radius: 14px; outline: none; text-align: center;
    background: var(--field); color: var(--ink); caret-color: var(--saf);
    font: 800 23px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1), background .3s;
  }
  .cell input:focus, .cell.cur input { box-shadow: inset 0 0 0 2px var(--em), 0 0 0 5px rgba(13, 122, 95, .13); transform: translateY(-3px); }
  .cell.filled input { box-shadow: inset 0 0 0 2px var(--em-2); }
  .cell.land input { animation: land .42s cubic-bezier(.34, 1.8, .5, 1); }
  @keyframes land { 0% { transform: scale(.8); } 55% { transform: scale(1.12); } }
  .boxes.check .cell input { animation: wave2 .7s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms); }
  @keyframes wave2 { 50% { transform: translateY(-6px); box-shadow: inset 0 0 0 2px var(--saf); } }
  .boxes.good .cell input { background: var(--ok); color: #fff; box-shadow: none; }
  .boxes.bad { animation: shake .45s ease; }
  .boxes.bad .cell input { box-shadow: inset 0 0 0 2px var(--bad); }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .cell input:disabled { opacity: .45; }
  .resend { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .resend b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .status { min-height: 20px; margin: 12px 0 0; font-size: 13.5px; font-weight: 650; text-align: center; }
  .status[data-tone="good"] { color: var(--ok); }
  .status[data-tone="bad"] { color: var(--bad); }

  .done { text-align: center; }
  .seal { width: 76px; height: 76px; margin: 4px auto 10px; }
  .seal circle { fill: none; stroke: var(--ok); stroke-width: 5; stroke-dasharray: 220; stroke-dashoffset: 220; }
  .seal path { fill: none; stroke: var(--ok); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; }
  .step.now .seal circle { transition: stroke-dashoffset .7s ease .2s; stroke-dashoffset: 0; }
  .step.now .seal path { transition: stroke-dashoffset .4s ease .75s; stroke-dashoffset: 0; }

  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; }

  @media (max-width: 380px) { .steps { padding: 16px 16px 18px; } .cell { height: 52px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="top">
      <svg class="scene" id="scene" viewBox="0 0 360 130" aria-hidden="true">
        <defs><linearGradient id="awSky" x1="0" y1="0" x2="0" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset="1"/></linearGradient></defs>
        <rect width="360" height="130" fill="url(#awSky)"/>
        <g class="cloud"><ellipse cx="60" cy="26" rx="20" ry="6"/><ellipse cx="68" cy="21" rx="10" ry="6"/></g>
        <g class="cloud k2"><ellipse cx="200" cy="18" rx="16" ry="5"/><ellipse cx="206" cy="14" rx="8" ry="5"/></g>
        <path class="city2" d="M0 130V96h18v-10h14v10h10V84h16v12h8V90h20v40zM150 130V92h12v-8h10v8h14V80l9-9 9 9v50zM230 130V98h16V88h18v10h12V90h20v40zM300 130V100h20v-6h16v6h24v30z"/>
        <path class="city" d="M0 130v-18h40v-6h26v6h34v-10h30v10h46v-8h24v8h38v-12h30v12h40v-6h52v24z"/>
        <!-- tower -->
        <g>
          <path class="steel" d="M54 122L70 34M86 122L70 34M58 100h24M61 80h18M64 60h12M58 100L79 80M82 100L61 80M61 80L76 60M79 80L64 60"/>
          <path class="steel" d="M64 42l-8-4M76 42l8-4"/>
          <circle class="lamp" cx="70" cy="31" r="3.2"/>
          <path class="wave w1" d="M60 26a14 14 0 0 1 20 0"/>
          <path class="wave w2" d="M54 20a22 22 0 0 1 32 0"/>
          <path class="wave w3" d="M48 14a30 30 0 0 1 44 0"/>
        </g>
        <path class="route" id="route" d="M76 32 Q 180 -18 284 56"/>
        <circle class="packet" id="packet" r="4"/>
        <g class="env" id="env"><rect x="-9" y="-6" width="18" height="12" rx="2"/><path d="M-8 -5l8 6 8-6"/></g>
        <!-- phone -->
        <g class="phone" id="phone">
          <rect class="pbody" x="272" y="56" width="34" height="60" rx="7"/>
          <rect class="pscreen" x="275.5" y="62" width="27" height="46" rx="3"/>
          <path class="pcheck" d="M282 85l5 5 9-10"/>
          <circle class="pdot" cx="304" cy="58" r="5"/>
          <circle class="halo" cx="289" cy="86" r="18"/>
        </g>
      </svg>
      <div class="toast" id="toast" aria-hidden="true">
        <i><svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 3c4.4 0 8 2.8 8 6.3s-3.6 6.2-8 6.2c-.9 0-1.8-.1-2.6-.3L3.5 17l.9-3.3C2.9 12.6 2 11 2 9.3 2 5.8 5.6 3 10 3z" fill="#fff"/></svg></i>
        <span><b>Messages · now</b><br>Demo code: <span class="num" id="smsCode">000 000</span>. It expires in 10 minutes.</span>
      </div>
    </div>

    <div class="steps">
      <!-- Step 1: number -->
      <section class="step now" id="step1" aria-labelledby="h1">
        <h1 id="h1">What is your mobile number?</h1>
        <p class="sub">We will text you a 6-digit code to check it is you.</p>
        <div class="numrow">
          <button type="button" class="cc" id="cc" aria-haspopup="listbox" aria-expanded="false" aria-controls="ccList" aria-label="Country code">
            <span class="flag" id="ccFlag"></span><span id="ccDial">+92</span>
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="tel" id="telWrap">
            <input id="tel" type="tel" inputmode="numeric" autocomplete="tel-national" aria-label="Mobile number" aria-describedby="hint" placeholder="300 1234567">
            <span class="tick" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.5l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </div>
          <div class="pop" id="pop" hidden>
            <input id="ccSearch" type="text" placeholder="Search country or code" aria-label="Search countries" aria-controls="ccList" autocomplete="off">
            <ul id="ccList" role="listbox" aria-label="Countries"></ul>
          </div>
        </div>
        <p class="hint" id="hint"></p>
        <button type="button" class="btn" id="send" disabled><span id="sendText">Send code</span></button>
      </section>

      <!-- Step 2: code -->
      <section class="step" id="step2" aria-labelledby="h2">
        <h1 id="h2">Enter the code</h1>
        <p class="sub">Sent by text to <b id="sentTo">+92 300 1234567</b>. <button type="button" class="link" id="edit">Edit number</button></p>
        <div class="boxes" id="boxes" role="group" aria-labelledby="h2"></div>
        <div class="resend"><span id="resendWait">New code in <b id="secs">0:30</b></span><button type="button" class="link" id="resend" hidden>Send a new code</button></div>
      </section>

      <!-- Step 3: done -->
      <section class="step done" id="step3" aria-labelledby="h3">
        <svg class="seal" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="33"/><path d="M24 39l10 10 19-21"/></svg>
        <h1 id="h3">Number verified</h1>
        <p class="sub"><b id="doneNum">+92 300 1234567</b> is now linked to your account.</p>
        <button type="button" class="btn ghost" id="another">Use another number</button>
      </section>
    </div>
    <p class="status" id="status" role="status" aria-live="polite" style="margin:-8px 22px 18px"></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const LEN = 6;

  // ---- Countries: dial code, number pattern (# = digit), a rule for the first digit, and a flag drawn with CSS ----
  const COUNTRIES = [
    { id: "PK", name: "Pakistan", dial: "+92", fmt: "### #######", first: /^3/, eg: "300 1234567", note: "Mobile numbers start with 3, like 300 1234567.", flag: "radial-gradient(circle at 70% 36%,#fff 0 7%,transparent 8%),radial-gradient(circle at 68% 52%,#01411c 0 17%,transparent 18%),radial-gradient(circle at 61% 54%,#fff 0 23%,transparent 24%),linear-gradient(90deg,#fff 0 26%,#01411c 26%)" },
    { id: "AE", name: "United Arab Emirates", dial: "+971", fmt: "## ### ####", first: /^5/, eg: "50 123 4567", note: "Mobile numbers start with 5, like 50 123 4567.", flag: "linear-gradient(90deg,#ef3340 0 28%,transparent 28%),linear-gradient(#00843d 0 33%,#fff 33% 66%,#111 66%)" },
    { id: "SA", name: "Saudi Arabia", dial: "+966", fmt: "## ### ####", first: /^5/, eg: "51 234 5678", note: "Mobile numbers start with 5, like 51 234 5678.", flag: "linear-gradient(transparent 58%,#fff 58% 64%,transparent 64%),#006c35" },
    { id: "GB", name: "United Kingdom", dial: "+44", fmt: "#### ######", first: /^7/, eg: "7400 123456", note: "Mobile numbers start with 7, like 7400 123456.", flag: "linear-gradient(90deg,transparent 42%,#c8102e 42% 58%,transparent 58%),linear-gradient(transparent 40%,#c8102e 40% 60%,transparent 60%),#012169" },
    { id: "US", name: "United States", dial: "+1", fmt: "(###) ###-####", first: /^[2-9]/, eg: "(212) 555-0147", note: "Ten digits, like (212) 555-0147.", flag: "linear-gradient(#3c3b6e,#3c3b6e) 0 0/46% 54% no-repeat,repeating-linear-gradient(#b22234 0 7.7%,#fff 7.7% 15.4%)" },
    { id: "CA", name: "Canada", dial: "+1", fmt: "(###) ###-####", first: /^[2-9]/, eg: "(416) 555-0199", note: "Ten digits, like (416) 555-0199.", flag: "radial-gradient(circle,#d52b1e 0 18%,transparent 19%),linear-gradient(90deg,#d52b1e 0 27%,#fff 27% 73%,#d52b1e 73%)" },
    { id: "QA", name: "Qatar", dial: "+974", fmt: "#### ####", first: /^[3567]/, eg: "3312 3456", note: "Eight digits, like 3312 3456.", flag: "linear-gradient(90deg,#fff 0 34%,#8a1538 34%)" },
    { id: "OM", name: "Oman", dial: "+968", fmt: "#### ####", first: /^9/, eg: "9212 3456", note: "Mobile numbers start with 9, like 9212 3456.", flag: "linear-gradient(90deg,#db161b 0 30%,transparent 30%),linear-gradient(#fff 0 33%,#db161b 33% 66%,#008000 66%)" },
    { id: "MY", name: "Malaysia", dial: "+60", fmt: "##-### ####", first: /^1/, eg: "12-345 6789", note: "Mobile numbers start with 1, like 12-345 6789.", flag: "linear-gradient(#010066,#010066) 0 0/50% 57% no-repeat,repeating-linear-gradient(#cc0001 0 7.1%,#fff 7.1% 14.2%)" },
    { id: "TR", name: "Turkey", dial: "+90", fmt: "### ### ## ##", first: /^5/, eg: "532 123 45 67", note: "Mobile numbers start with 5, like 532 123 45 67.", flag: "radial-gradient(circle at 47% 50%,#e30a17 0 19%,transparent 20%),radial-gradient(circle at 39% 50%,#fff 0 25%,transparent 26%),#e30a17" }
  ];
  let country = COUNTRIES[0];

  const scene = $("scene"), route = $("route"), packet = $("packet"), env = $("env"), phoneG = $("phone"), toast = $("toast");
  const tel = $("tel"), telWrap = $("telWrap"), sendBtn = $("send"), cc = $("cc"), pop = $("pop"), search = $("ccSearch"), list = $("ccList");
  const boxesEl = $("boxes"), statusEl = $("status");

  // ---- Cancellable waits ----
  const CANCEL = { cancelled: true };
  let gen = 0;
  const pause = (ms, g) => new Promise((ok, no) => setTimeout(() => (g === gen ? ok() : no(CANCEL)), ms));
  const anim = (ms, g) => pause(reduce ? Math.min(ms, 120) : ms, g);
  const quiet = (p) => p.catch((e) => { if (e !== CANCEL) throw e; });
  const restart = (el, cls) => { el.classList.remove(cls); void (el.offsetWidth || el.getBoundingClientRect()); el.classList.add(cls); };
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function tween(ms, g, fn) {
    if (reduce) { fn(1); return Promise.resolve(); }
    return new Promise((ok, no) => {
      const t0 = performance.now();
      const step = (now) => {
        if (g !== gen) return no(CANCEL);
        const t = Math.min(1, (now - t0) / ms);
        fn(ease(t));
        if (t < 1) requestAnimationFrame(step); else ok();
      };
      requestAnimationFrame(step);
    });
  }
  function say(msg, tone) { statusEl.textContent = msg; statusEl.dataset.tone = tone || ""; }

  // ---- Steps ----
  let stepNow = 1;
  function goStep(n) {
    stepNow = n;
    [1, 2, 3].forEach((k) => {
      const s = $("step" + k);
      s.classList.toggle("now", k === n);
      s.classList.toggle("past", k < n);
      s.inert = k !== n;
    });
  }

  // ---- Number formatting and checks ----
  const maxDigits = () => country.fmt.split("#").length - 1;
  function format(d) {
    let out = "", k = 0;
    for (const ch of country.fmt) {
      if (k >= d.length) break;
      if (ch === "#") out += d[k++]; else out += ch;
    }
    return out;
  }
  function digitsOf(text) {
    let d = String(text).replace(/[^\d+]/g, "");
    const dial = country.dial.replace("+", "");
    if (d.startsWith("+" + dial)) d = d.slice(dial.length + 1);
    else if (d.startsWith("00" + dial)) d = d.slice(dial.length + 2);
    d = d.replace(/\D/g, "");
    if (d.length > maxDigits() && d.startsWith(dial)) d = d.slice(dial.length);
    if (d.startsWith("0")) d = d.replace(/^0+/, "");        // local numbers are often typed with a leading 0
    return d.slice(0, maxDigits());
  }
  function isValid(d) { return d.length === maxDigits() && country.first.test(d); }
  let digits = "";
  function setNumber(text) {
    digits = digitsOf(text);
    tel.value = format(digits);
    const ok = isValid(digits);
    telWrap.classList.toggle("valid", ok);
    sendBtn.disabled = !ok || busy;
    $("hint").textContent = digits && !country.first.test(digits) ? "That does not look right. " + country.note : country.note;
  }
  tel.addEventListener("input", () => setNumber(tel.value));
  tel.addEventListener("keydown", (e) => { if (e.key === "Enter" && !sendBtn.disabled) { e.preventDefault(); quiet(sendCode(gen)); } });

  // ---- Country picker (a listbox with search and arrow keys) ----
  let shown = COUNTRIES.slice(), active = 0;
  function paintCountry() {
    $("ccFlag").style.background = country.flag;
    $("ccDial").textContent = country.dial;
    cc.setAttribute("aria-label", "Country code: " + country.name + " " + country.dial);
    tel.placeholder = country.eg;
  }
  function renderList() {
    const q = search.value.trim().toLowerCase();
    shown = COUNTRIES.filter((c) => !q || c.name.toLowerCase().includes(q) || c.dial.includes(q.replace(/^\+?/, "+")) || c.id.toLowerCase() === q);
    active = Math.max(0, Math.min(active, shown.length - 1));
    list.innerHTML = "";
    if (!shown.length) { const li = document.createElement("li"); li.className = "none"; li.textContent = "No country matches that."; list.append(li); return; }
    shown.forEach((c, i) => {
      const li = document.createElement("li");
      li.id = "opt-" + c.id;
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", c === country ? "true" : "false");
      li.className = i === active ? "active" : "";
      li.innerHTML = '<span class="flag"></span><span></span><span></span>';
      li.children[0].style.background = c.flag;
      li.children[1].textContent = c.name;
      li.children[2].textContent = c.dial;
      li.addEventListener("click", () => choose(c));
      li.addEventListener("pointermove", () => { if (active !== i) { active = i; markActive(); } });
      list.append(li);
    });
    markActive();
  }
  function markActive() {
    Array.from(list.children).forEach((li, i) => li.classList.toggle("active", i === active));
    const li = list.children[active];
    if (li && li.id) {
      search.setAttribute("aria-activedescendant", li.id);
      // keep the active row in view by scrolling only the list, never the page
      const top = li.offsetTop - list.offsetTop, bottom = top + li.offsetHeight;
      if (top < list.scrollTop) list.scrollTop = top;
      else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight;
    }
  }
  function openPicker() {
    pop.hidden = false;
    cc.setAttribute("aria-expanded", "true");
    search.value = "";
    active = COUNTRIES.indexOf(country);
    renderList();
    if (!demoOn) search.focus();
  }
  function closePicker(back) {
    if (pop.hidden) return;
    pop.hidden = true;
    cc.setAttribute("aria-expanded", "false");
    if (back && !demoOn) cc.focus();
  }
  function choose(c) {
    country = c;
    paintCountry();
    closePicker(false);
    setNumber(digits);
    if (!demoOn) tel.focus();
  }
  cc.addEventListener("click", () => (pop.hidden ? openPicker() : closePicker(true)));
  search.addEventListener("input", () => { active = 0; renderList(); });
  search.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(shown.length - 1, active + 1); markActive(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); markActive(); }
    else if (e.key === "Enter") { e.preventDefault(); if (shown[active]) choose(shown[active]); }
    else if (e.key === "Escape") { e.preventDefault(); closePicker(true); }
  });
  document.addEventListener("pointerdown", (e) => { if (!pop.hidden && !pop.contains(e.target) && !cc.contains(e.target)) closePicker(false); });

  // ---- Signal flights across the sky ----
  const RL = route.getTotalLength();
  async function flight(g, el, back, ms) {
    el.style.opacity = "1";
    await tween(ms, g, (t) => {
      const p = route.getPointAtLength(back ? RL * (1 - t) : RL * t);
      el.setAttribute("transform", "translate(" + p.x.toFixed(1) + " " + p.y.toFixed(1) + ")");
    });
    el.style.opacity = "0";
  }

  // ---- Code boxes: typing, paste, backspace, delete, arrows, Home/End ----
  const cells = [], inputs = [];
  for (let i = 0; i < LEN; i++) {
    const c = document.createElement("span");
    c.className = "cell";
    c.style.setProperty("--i", i);
    const inp = document.createElement("input");
    inp.inputMode = "numeric";
    inp.autocomplete = i ? "off" : "one-time-code";
    inp.setAttribute("aria-label", "Digit " + (i + 1) + " of " + LEN);
    c.append(inp);
    boxesEl.append(c);
    cells.push(c); inputs.push(inp);
  }
  const vals = Array(LEN).fill("");
  let code = "", busy = false, tries = 3, resends = 0;
  function setCh(i, ch) { vals[i] = ch; inputs[i].value = ch; cells[i].classList.toggle("filled", !!ch); if (ch) restart(cells[i], "land"); }
  function clearBoxes() { for (let i = 0; i < LEN; i++) setCh(i, ""); boxesEl.classList.remove("good", "bad", "check"); }
  function mark(i) { cells.forEach((c, n) => c.classList.toggle("cur", n === i && demoOn)); }
  function focusBox(i) { i = Math.max(0, Math.min(LEN - 1, i)); if (!demoOn) { inputs[i].focus(); inputs[i].select(); } }
  function fillFrom(start, text) { let i = start; for (const ch of text) { if (i >= LEN) break; setCh(i++, ch); } focusBox(i); whenFull(); }
  function whenFull() { if (!busy && stepNow === 2 && vals.every(Boolean)) quiet(verify(gen)); }
  inputs.forEach((inp, i) => {
    inp.addEventListener("focus", () => requestAnimationFrame(() => inp.select()));
    inp.addEventListener("input", (e) => {
      if (busy) { inp.value = vals[i]; return; }
      const got = inp.value.replace(/\D/g, "");
      if (e.inputType === "insertText" && e.data && e.data.length === 1) {
        const d = e.data.replace(/\D/g, "");
        if (!d) { inp.value = vals[i]; return; }
        setCh(i, d); focusBox(i + 1); whenFull();
      } else if (got.length > 1) fillFrom(got.length >= LEN ? 0 : i, got);
      else { setCh(i, got); if (got) { focusBox(i + 1); whenFull(); } }
    });
    inp.addEventListener("keydown", (e) => {
      if (busy) return;
      if (e.key === "Backspace") { e.preventDefault(); if (vals[i]) setCh(i, ""); else if (i > 0) { setCh(i - 1, ""); focusBox(i - 1); } }
      else if (e.key === "Delete") { e.preventDefault(); setCh(i, ""); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); focusBox(i - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); focusBox(i + 1); }
      else if (e.key === "Home") { e.preventDefault(); focusBox(0); }
      else if (e.key === "End") { e.preventDefault(); focusBox(LEN - 1); }
    });
    inp.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const d = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (d) fillFrom(d.length >= LEN ? 0 : i, d); else say("Only numbers can be pasted here.", "bad");
    });
  });
  function lockBoxes(on) { inputs.forEach((b) => (b.disabled = on)); }

  // ---- Resend countdown ----
  let timer = 0;
  function startTimer(s) {
    clearInterval(timer);
    let left = s;
    $("resend").hidden = true;
    $("resendWait").hidden = false;
    const paint = () => { $("secs").textContent = "0:" + String(left).padStart(2, "0"); };
    paint();
    timer = setInterval(() => {
      left--;
      paint();
      if (left <= 0) {
        clearInterval(timer);
        $("resendWait").hidden = true;
        $("resend").hidden = false;
        $("resend").disabled = resends >= 3;
        $("resend").textContent = resends >= 3 ? "No more codes today" : "Send a new code";
      }
    }, 1000);
  }

  // ---- Send: your number flies to the tower, the tower texts the phone ----
  const pretty = () => country.dial + " " + format(digits);
  async function sendCode(g) {
    if (busy || !isValid(digits)) return;
    busy = true;
    closePicker(false);
    sendBtn.disabled = true;
    $("sendText").innerHTML = '<span class="spin" aria-hidden="true"></span> Sending…';
    sendBtn.setAttribute("aria-busy", "true");
    say("");
    toast.classList.remove("in");
    scene.classList.remove("sms", "verified");
    await flight(g, packet, true, 650);
    restart(scene, "ping");
    await anim(450, g);
    await flight(g, env, false, 900);
    restart(phoneG, "buzz");
    scene.classList.add("sms");
    code = "";
    for (let i = 0; i < LEN; i++) code += Math.floor(Math.random() * 10);
    $("smsCode").textContent = code.slice(0, 3) + " " + code.slice(3);
    toast.classList.add("in");
    $("sentTo").textContent = pretty();
    $("sendText").textContent = "Send code"; sendBtn.removeAttribute("aria-busy");
    tries = 3;
    clearBoxes();
    lockBoxes(false);
    goStep(2);
    startTimer(30);
    busy = false;
    setTimeout(() => focusBox(0), 350);
  }
  sendBtn.addEventListener("click", () => quiet(sendCode(gen)));

  // ---- Verify ----
  async function verify(g) {
    busy = true;
    mark(-1);
    lockBoxes(true);
    boxesEl.classList.add("check");
    say("Checking…");
    await anim(900, g);
    boxesEl.classList.remove("check");
    if (vals.join("") === code) {
      boxesEl.classList.add("good");
      scene.classList.remove("sms");
      scene.classList.add("verified");
      toast.classList.remove("in");
      clearInterval(timer);
      await anim(500, g);
      $("doneNum").textContent = pretty();
      goStep(3);
      say("");
      sparks();
      busy = false;
      if (!demoOn) $("another").focus();
      return;
    }
    tries--;
    restart(boxesEl, "bad");
    say(tries > 0 ? "That code is not right. " + tries + (tries === 1 ? " try" : " tries") + " left." : "Too many tries. Ask for a new code.", "bad");
    await anim(500, g);
    clearBoxes();
    busy = false;
    if (tries > 0) { lockBoxes(false); focusBox(0); }
  }

  // ---- Edit, resend and start over ----
  $("edit").addEventListener("click", () => {
    if (busy) return;
    clearInterval(timer);
    toast.classList.remove("in");
    scene.classList.remove("sms");
    goStep(1);
    setNumber(tel.value);           // turns Send code back on for the kept number
    say("");
    setTimeout(() => { if (!demoOn) { tel.focus(); tel.select(); } }, 300);
  });
  $("resend").addEventListener("click", () => {
    if (busy || resends >= 3) return;
    resends++;
    say("Sending a new code. The old one stops working.");
    quiet(sendCode(gen));
  });
  function startOver() {
    clearInterval(timer);
    busy = false;
    resends = 0;
    country = COUNTRIES[0];
    paintCountry();
    setNumber("");
    toast.classList.remove("in");
    scene.classList.remove("sms", "verified");
    $("sendText").textContent = "Send code"; sendBtn.removeAttribute("aria-busy");
    packet.style.opacity = "0";
    env.style.opacity = "0";
    closePicker(false);
    clearBoxes();
    goStep(1);
    say("");
  }
  $("another").addEventListener("click", () => { startOver(); tel.focus(); });

  // ---- Sparks from the phone in the scene ----
  function sparks() {
    if (reduce) return;
    const r = phoneG.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    const C = ["#0d7a5f", "#f2a33a", "#23a37f", "#ffc670"];
    for (let n = 0; n < 30; n++) {
      const p = document.createElement("i");
      const s = 5 + Math.random() * 6;
      p.style.width = p.style.height = s + "px";
      p.style.background = C[n % 4];
      p.style.borderRadius = n % 2 ? "50%" : "2px";
      $("fx").append(p);
      const a = (n / 30) * Math.PI * 2, d = 50 + Math.random() * 70;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.2)", opacity: 1 },
        { transform: "translate(" + (x0 + Math.cos(a) * d) + "px," + (y0 + Math.sin(a) * d) + "px) rotate(200deg) scale(1)", opacity: 1, offset: 0.6 },
        { transform: "translate(" + (x0 + Math.cos(a) * d * 1.25) + "px," + (y0 + Math.sin(a) * d * 1.25 + 40) + "px) rotate(320deg) scale(.4)", opacity: 0 }
      ], { duration: 1200 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => p.remove();
    }
  }

  // ---- Auto-demo: type a number (picking a country every other round), send, type the code ----
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); gen++; mark(-1); startOver(); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) =>
    window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  async function press(el, g) { el.classList.add("press"); await pause(170, g); el.classList.remove("press"); }
  async function runDemo() {
    const g = gen;
    round++;
    await pause(600, g);
    let num = "3001234567";
    if (round % 2 === 0) {
      openPicker();
      const target = COUNTRIES.findIndex((c) => c.id === "AE");
      while (active !== target) { await pause(260, g); active += target > active ? 1 : -1; markActive(); }
      await pause(450, g);
      choose(COUNTRIES[target]);
      num = "501234567";
      await pause(400, g);
    }
    for (let k = 1; k <= num.length; k++) { setNumber(num.slice(0, k)); await pause(95, g); }
    await pause(400, g);
    await press(sendBtn, g);
    await sendCode(g);
    await pause(900, g);
    for (let i = 0; i < LEN; i++) { mark(i); await pause(110, g); setCh(i, code[i]); await pause(70, g); }
    mark(-1);
    await verify(g);
    await pause(2600, g);
    startOver();
    demoTimer = setTimeout(() => quiet(runDemo()), 500);
  }

  paintCountry();
  setNumber("");
  goStep(1);
  demoTimer = setTimeout(() => quiet(runDemo()), 300);
})();
</script>
</body>
</html>
