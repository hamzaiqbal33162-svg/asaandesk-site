<!doctype html>
<!-- Chill & Craft · Pillow · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pillow · Soft play and share buttons</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: one soft surface, two shadows ---------- */
  :root {
    --surface: #e7ded3;
    --hi: #fff8ee;
    --lo: rgba(150, 128, 102, 0.55);
    --ink: #4a3d33;
    --muted: #8b7c6e;
    --accent: #d6714a;
    --track: #dcd1c4;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --surface: #2b2e35;
    --hi: #393d46;
    --lo: #1b1d22;
    --ink: #e9e2da;
    --muted: #9c968f;
    --accent: #f09a73;
    --track: #24272d;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--surface);
  }
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; }
  .wrap { display: grid; justify-items: center; gap: 22px; width: 100%; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 26px; width: 100%; }
  .status { margin: 0; min-height: 1.3em; font-size: 0.88rem; color: var(--muted); text-align: center; }

  /* Raised and pressed looks */
  .raised { background: var(--surface); box-shadow: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi); }
  button.raised { transition: box-shadow 0.3s ease, transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1); }
  button.raised:hover { box-shadow: 11px 11px 22px var(--lo), -11px -11px 22px var(--hi); }
  button.raised:active, button.raised.sunk { box-shadow: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi); transform: scale(0.96); transition-duration: 0.12s; }

  /* ---------- A pod grows from a circle into a pill on a spring ---------- */
  .pod {
    --open-w: min(340px, calc(100vw - 32px));
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 84px;
    height: 84px;
    padding: 10px;
    border-radius: 42px;
    transition: width 0.9s cubic-bezier(0.3, 1.3, 0.4, 1);
    transition-timing-function: linear(0, 0.099, 0.295, 0.531, 0.76, 0.952, 1.092, 1.175, 1.207, 1.2, 1.166, 1.12, 1.07, 1.026, 0.992, 0.97, 0.959, 0.958, 0.964, 0.974, 0.984, 0.994, 1.001, 1.006, 1.008, 1.006, 1.002, 1);
  }
  .pod.share { --open-w: min(300px, calc(100vw - 32px)); }
  .pod.open { width: var(--open-w); }
  .pod.closing { transition: width 0.45s cubic-bezier(0.6, 0, 0.3, 1.3); }

  .round { flex: none; width: 64px; height: 64px; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--accent); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button.round.raised[aria-pressed="true"], button.round.raised[aria-expanded="true"] { box-shadow: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* Play ↔ pause morph: two halves change shape with clip-path */
  .pp { position: relative; width: 22px; height: 24px; display: flex; margin-left: 3px; transition: margin 0.3s ease; }
  .pp i { flex: 1; background: currentColor; transition: clip-path 0.4s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .pp i:first-child { clip-path: polygon(0 0, 100% 25%, 100% 75%, 0 100%); }
  .pp i:last-child { clip-path: polygon(0 25%, 100% 50%, 100% 50%, 0 75%); }
  .round[aria-pressed="true"] .pp { margin-left: 0; }
  .round[aria-pressed="true"] .pp i:first-child { clip-path: polygon(10% 0, 70% 0, 70% 100%, 10% 100%); }
  .round[aria-pressed="true"] .pp i:last-child { clip-path: polygon(30% 0, 90% 0, 90% 100%, 30% 100%); }
  .round:hover .pp { transform: translateX(1px); }

  /* Share icon: three nodes that spread on hover and turn into a cross when open */
  .share-ico { width: 26px; height: 26px; overflow: visible; transition: transform 0.5s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .share-ico .node { transition: transform 0.4s cubic-bezier(0.3, 1.7, 0.5, 1), opacity 0.2s; transform-box: fill-box; transform-origin: center; }
  .round:hover .share-ico .n1 { transform: translate(1px, -1px); }
  .round:hover .share-ico .n3 { transform: translate(1px, 1px); }
  .share-ico .cross { opacity: 0; transition: opacity 0.2s; }
  .round[aria-expanded="true"] .share-ico { transform: rotate(135deg); }
  .round[aria-expanded="true"] .share-ico .node { transform: scale(0); opacity: 0; }
  .round[aria-expanded="true"] .share-ico .cross { opacity: 1; }

  /* Extra controls fade in once the pod has room */
  .more { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0s linear 0.2s; }
  .pod.open .more { opacity: 1; visibility: visible; transition: opacity 0.2s ease 0.15s, visibility 0s; }
  .pod:not(.open) .more { margin-left: -12px; overflow: hidden; }

  /* Player details */
  .info { flex: 1; min-width: 0; }
  .title { display: flex; align-items: center; gap: 6px; font-size: 0.86rem; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .title span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
  .eq i { width: 3px; height: 4px; border-radius: 2px; background: var(--accent); }
  .playing .eq i { animation: eq 0.8s ease-in-out infinite; }
  .playing .eq i:nth-child(2) { animation-duration: 0.6s; animation-delay: -0.3s; }
  .playing .eq i:nth-child(3) { animation-duration: 0.95s; animation-delay: -0.55s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 12px; } }
  .time { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }

  .seek { --p: 0%; -webkit-appearance: none; appearance: none; width: 100%; height: 10px; margin: 7px 0 2px; border-radius: 6px; background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p) 100% no-repeat, var(--track); box-shadow: inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi); cursor: pointer; transform-origin: 0 50%; }
  .seek::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 2px 2px 5px var(--lo), -2px -2px 5px var(--hi); transition: transform 0.3s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .seek:hover::-webkit-slider-thumb { transform: scale(1.25); }
  .seek::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--surface); box-shadow: 2px 2px 5px var(--lo), -2px -2px 5px var(--hi); }

  .mini { position: relative; flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--ink); cursor: pointer; }
  .mini svg { width: 18px; height: 18px; }
  .mini .ok { display: none; color: var(--accent); }
  .mini.done .ico { display: none; }
  .mini.done .ok { display: block; }
  .mini.loading::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: conic-gradient(var(--accent) 0 30%, transparent 30%); -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .share .more { justify-content: space-around; }

  /* Soft puffs and the bloom ring */
  .puff { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); pointer-events: none; z-index: 5; }
  .bloom { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 2px var(--accent); opacity: 0; pointer-events: none; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .pod, .pod.closing, .more, .pod.open .more, button.raised, .pp, .pp i, .share-ico, .share-ico .node, .seek::-webkit-slider-thumb { transition: none; }
    .playing .eq i, .mini.loading::after { animation: none; }
    .playing .eq i { height: 9px; }
    .puff, .bloom { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="wrap">
      <div class="row">
        <!-- Play pod -->
        <div class="pod raised" id="player">
          <span class="bloom" id="bloom-play" aria-hidden="true"></span>
          <button class="round raised" id="play" type="button" aria-pressed="false" aria-label="Play episode">
            <span class="pp" aria-hidden="true"><i></i><i></i></span>
          </button>
          <div class="more" id="player-more">
            <div class="info">
              <div class="title"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span>Rain on the Margallas · Ep. 12</span></div>
              <label class="sr" for="seek">Position in episode</label>
              <input class="seek" id="seek" type="range" min="0" max="200" step="1" value="0" />
              <div class="time" aria-hidden="true"><span id="now">0:00</span><span>3:20</span></div>
            </div>
            <button class="mini raised" id="close-player" type="button" aria-label="Close player">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
            </button>
          </div>
        </div>

        <!-- Share pod -->
        <div class="pod share raised" id="sharer">
          <span class="bloom" id="bloom-share" aria-hidden="true"></span>
          <button class="round raised" id="share" type="button" aria-expanded="false" aria-controls="share-more" aria-label="Share episode">
            <svg class="share-ico" viewBox="0 0 24 24" aria-hidden="true">
              <path class="node" d="M8.8 10.7l6.4-3.9M8.8 13.3l6.4 3.9" stroke="currentColor" stroke-width="2" />
              <circle class="node n1" cx="17.5" cy="5.5" r="2.6" fill="currentColor" />
              <circle class="node" cx="6.5" cy="12" r="2.6" fill="currentColor" />
              <circle class="node n3" cx="17.5" cy="18.5" r="2.6" fill="currentColor" />
              <path class="cross" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            </svg>
          </button>
          <div class="more" id="share-more" role="group" aria-label="Share options">
            <button class="mini raised" type="button" data-act="copy" aria-label="Copy link">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
              <svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="mini raised" type="button" data-act="email" aria-label="Share by email">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" /><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
              <svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="mini raised" type="button" data-act="message" aria-label="Share in a message">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10H10l-5 4v-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
              <svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="mini raised" type="button" data-act="save" aria-label="Save for later">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
              <svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Press Play or Share.</p>
    </div>
  </main>

<script>
  // Pillow: two soft circles. Press sinks them in, then they spring open into a mini player and a share row.
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), status = $("status");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping, delay) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear", delay: delay || 0, fill: "backwards" });
    }

    // Anticipation: the button sinks into the surface for a moment
    async function sink(btn) {
      if (calm.matches) return;
      btn.classList.add("sunk");
      await wait(130);
      btn.classList.remove("sunk");
    }
    // Finish: a soft ring blooms around a pod
    function bloom(el) {
      if (calm.matches) return;
      el.animate([{ opacity: 0.8, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.15, 1.4)" }], { duration: 650, easing: "ease-out" });
    }
    // Soft puffs that float up from a button
    function puffs(btn) {
      if (calm.matches) return;
      var s = stage.getBoundingClientRect(), r = btn.getBoundingClientRect();
      var x = r.left - s.left + r.width / 2 - 5, y = r.top - s.top + r.height / 2 - 5;
      for (var i = 0; i < 7; i++) {
        var p = document.createElement("i");
        p.className = "puff";
        stage.appendChild(p);
        var a = -Math.PI / 2 + (i - 3) * 0.38, d = 30 + Math.random() * 16;
        p.animate([
          { transform: "translate(" + x + "px," + y + "px) scale(0.3)", opacity: 0.7 },
          { transform: "translate(" + (x + Math.cos(a) * d).toFixed(1) + "px," + (y + Math.sin(a) * d).toFixed(1) + "px) scale(" + (0.6 + Math.random() * 0.6).toFixed(2) + ")", opacity: 0 }
        ], { duration: 600 + Math.random() * 300, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
    }
    // Content inside a pod arrives in a stagger
    function stagger(items, base) {
      if (calm.matches) return;
      items.forEach(function (el, i) {
        springTo(el, function (p) { return { transform: "translateX(" + ((1 - p) * -14).toFixed(1) + "px) scale(" + (0.6 + 0.4 * p).toFixed(3) + ")", opacity: Math.min(1, p * 1.5) }; }, 280, 14, base + i * 70);
      });
    }
    async function collapse(pod) {
      pod.classList.add("closing");
      pod.classList.remove("open");
      await wait(calm.matches ? 0 : 450);
      pod.classList.remove("closing");
      if (!calm.matches) springTo(pod, function (p) { return { transform: "scale(" + (1.08 - 0.08 * p).toFixed(3) + "," + (0.92 + 0.08 * p).toFixed(3) + ")" }; }, 300, 9);
    }

    /* ---------- Player ---------- */
    var player = $("player"), play = $("play"), seek = $("seek"), now = $("now"), closePlayer = $("close-player");
    var LENGTH = 200; // seconds (3:20)
    var pos = 0, timer = null;

    function fmt(s) { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
    function draw() {
      seek.value = Math.round(pos);
      seek.style.setProperty("--p", (pos / LENGTH) * 100 + "%");
      seek.setAttribute("aria-valuetext", fmt(pos) + " of 3:20");
      now.textContent = fmt(pos);
    }
    function setPlaying(on) {
      play.setAttribute("aria-pressed", String(on));
      play.setAttribute("aria-label", on ? "Pause episode" : "Play episode");
      player.classList.toggle("playing", on);
      clearInterval(timer);
      if (on) {
        timer = setInterval(function () {
          pos = Math.min(LENGTH, pos + 0.25);
          draw();
          if (pos >= LENGTH) { setPlaying(false); pos = 0; draw(); status.textContent = "Episode finished."; bloom($("bloom-play")); }
        }, 250);
      }
    }

    play.addEventListener("click", async function () {
      if (!player.classList.contains("open")) {
        await sink(play);
        player.classList.add("open");
        setPlaying(true);
        status.textContent = "Playing Rain on the Margallas, episode 12.";
        var info = player.querySelector(".info");
        stagger([info.children[0], seek, info.querySelector(".time"), closePlayer], 160);
        if (!calm.matches) springTo(seek, function (p) { return { transform: "scaleX(" + Math.max(0, p).toFixed(3) + ")" }; }, 200, 16, 240);
        setTimeout(function () { bloom($("bloom-play")); }, calm.matches ? 0 : 500);
        return;
      }
      var on = play.getAttribute("aria-pressed") !== "true";
      setPlaying(on);
      if (!calm.matches) springTo(play, function (p) { return { transform: "scale(" + (0.9 + 0.1 * p).toFixed(3) + ")" }; }, 320, 10);
      status.textContent = on ? "Playing." : "Paused at " + fmt(pos) + ".";
    });
    seek.addEventListener("input", function () { pos = Number(seek.value); draw(); });
    closePlayer.addEventListener("click", async function () {
      setPlaying(false);
      pos = 0;
      draw();
      status.textContent = "Player closed.";
      play.focus();
      await collapse(player);
    });
    draw();

    /* ---------- Share ---------- */
    var sharer = $("sharer"), share = $("share");
    var options = Array.prototype.slice.call(sharer.querySelectorAll(".mini"));
    var LINK = "asaandesk.com/craft/pillow#episode-12";

    async function setShare(open) {
      share.setAttribute("aria-expanded", String(open));
      share.setAttribute("aria-label", open ? "Close share options" : "Share episode");
      if (open) {
        await sink(share);
        sharer.classList.add("open");
        stagger(options, 140);
        setTimeout(function () { bloom($("bloom-share")); }, calm.matches ? 0 : 450);
      } else {
        options.forEach(function (o) { o.classList.remove("done", "loading"); });
        await collapse(sharer);
      }
    }
    share.addEventListener("click", function () {
      var open = share.getAttribute("aria-expanded") !== "true";
      setShare(open);
      status.textContent = open ? "Share options open. Pick one." : "Share options closed.";
    });
    sharer.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && sharer.classList.contains("open")) { setShare(false); share.focus(); }
    });

    var messages = {
      copy: "Link copied: " + LINK,
      email: "Email draft ready with the episode link.",
      message: "Message ready to send.",
      save: "Saved to your listen-later list."
    };
    options.forEach(function (o) {
      o.addEventListener("click", async function () {
        if (o.classList.contains("loading")) return;
        var act = o.dataset.act;
        o.classList.remove("done");
        // anticipation: sink, then a soft spinner while it works
        await sink(o);
        o.classList.add("loading");
        status.textContent = "Working on it…";
        var copied = act !== "copy" ? Promise.resolve(true) :
          navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(LINK).then(function () { return true; }, function () { return false; }) : Promise.resolve(false);
        var results = await Promise.all([copied, wait(calm.matches ? 0 : 550)]);
        o.classList.remove("loading");
        // finish: the icon pops into a tick and puffs float up
        o.classList.add("done");
        status.textContent = results[0] ? messages[act] : "Copy this link: " + LINK;
        if (!calm.matches) springTo(o.querySelector(".ok"), function (p) { return { transform: "scale(" + p.toFixed(3) + ") rotate(" + ((1 - p) * -45).toFixed(1) + "deg)" }; }, 300, 11);
        puffs(o);
        setTimeout(function () { o.classList.remove("done"); }, 2000);
      });
    });
  })();
</script>
</body>
</html>
