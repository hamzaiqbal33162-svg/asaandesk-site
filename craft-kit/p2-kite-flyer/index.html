<style>

<main class="stage">

  <div class="cap"><b>Kite Flyer</b><span id="readout">Height 0 m · Line 0 m</span></div>
  <div class="scene" id="scene">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="badge" id="badge" aria-hidden="true"></div>
  </div>
  <div class="controls">
    <button class="btn main" id="pull" type="button" aria-describedby="holdHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5M6 11l6 -6l6 6"/></svg>
      Pull
    </button>
    <button class="btn" id="letOut" type="button" aria-describedby="holdHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M19 12h3"/></svg>
      Let out
    </button>
    <button class="btn" id="loop" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a8 8 0 1 0 3 -8"/><path d="M4 4v4h4"/></svg>
      Loop
    </button>
  </div>
  <label class="wind" for="wind"><span>Wind</span><input id="wind" type="range" min="0" max="100" value="60"><output id="windOut" for="wind">Breezy</output></label>
  <p class="status" id="status" aria-live="polite">Steer with your pointer. Hold Pull to climb.</p>
  <p class="hint" id="holdHint">Hold Pull or press on the sky to tug the line. Arrow keys work too: up pulls, down lets out, left and right steer.</p>
</main>

<script>

  var LIGHT = {

    t.fillStyle = hz; t.fillRect(0, 300, W, 120);

      t.fillStyle = P.shade; t.fillRect(h.x + h.w - 8, h.top, 8, 470 - h.top);
      t.fillStyle = "rgba(255,255,255,0.28)"; t.fillRect(h.x - 2, h.top - 5, h.w + 4, 5); // parapet cap
      if (h.tank) { t.fillStyle = n % 2 ? "#3c4a5c" : "#2f3b4b"; rr(t, h.x + 10, h.top - 22, 18, 17, 3); t.fill(); t.fillStyle = "rgba(255,255,255,0.18)"; t.fillRect(h.x + 12, h.top - 20, 4, 13); }

    t.fillStyle = P.parapet; t.fillRect(0, 452, W, 48);

      t.fillStyle = "#57a85f"; t.beginPath(); t.arc(p[0] + 3, 432, 6, 0, TAU); t.fill();

    if (d > line && loopT < 0) { var nx = dx / d, ny = dy / d; kite.x = hand.x + nx * line; kite.y = hand.y + ny * line; var vr = kite.vx * nx + kite.vy * ny; if (vr > 0) { kite.vx -= vr * nx; kite.vy -= vr * ny; } }
    if (kite.y > 426) { kite.y = 426; kite.vy = Math.min(0, kite.vy); }
    kite.x = clamp(kite.x, 30, 370); kite.y = Math.max(32, kite.y);
    var wantA = clamp(kite.vx * 0.004, -0.5, 0.5) + (calm ? 0 : Math.sin(t * 6.5) * 0.05 * (0.4 + wind)) + (loopT >= 0 ? loopT * TAU : 0) - side * (e - 60 * DEG) * 0.25;
    kite.a += (wantA - kite.a) * Math.min(1, dt * (loopT >= 0 ? 30 : 8));
    if (loopT < 0 && kite.a > Math.PI) kite.a -= TAU;
    // milestones and the dip warning
    var hM = heightM();
    best = Math.max(best, hM);
    var next = [50, 100, 150][milestone];
    if (next && hM >= next) {
      milestone++; burst(kite.x, kite.y, 34); scarePigeons();
      badge(next + " m up!"); say(next === 150 ? "Sky high: 150 metres! The pigeons came up to see." : next + " metres up. Keep going!");

  }
  function stepRope(dt) {
    var calm = reduce.matches, dist = Math.hypot(kite.x - hand.x, kite.y - hand.y);
    var slack = 1 + 0.05 * clamp(0.9 - wind, 0, 1) + (letting ? 0.03 : 0);
    var seg = Math.max(dist, Math.min(line, dist * 1.08)) * slack / (N - 1);
    var gy = 200 * dt * dt, wx = (calm ? 0.3 : 1) * wind * 50 * dt * dt;
    for (var j = 1; j < N - 1; j++) {
      var p = rope[j], vx = (p.x - p.px) * 0.98, vy = (p.y - p.py) * 0.98;

    }
    rope[0].x = hand.x; rope[0].y = hand.y; rope[N - 1].x = kite.x; rope[N - 1].y = kite.y + 4;
    for (var it = 0; it < 12; it++) {
      for (j = 0; j < N - 1; j++) {
        var a = rope[j], b = rope[j + 1], ddx = b.x - a.x, ddy = b.y - a.y, dd = Math.hypot(ddx, ddy) || 0.001, diff = (dd - seg) / dd * 0.5;
        if (j > 0) { a.x += ddx * diff; a.y += ddy * diff; }

    var tw = (calm ? 0.4 : 1) * (60 + wind * 140) * dt * dt;
    for (j = 1; j < tail.length; j++) {
      var q = tail[j], qvx = (q.x - q.px) * 0.92, qvy = (q.y - q.py) * 0.92;
      q.px = q.x; q.py = q.y; q.x += qvx + tw; q.y += qvy + 90 * dt * dt;
    }
    for (it = 0; it < 4; it++) for (j = 0; j < tail.length - 1; j++) {
      var u = tail[j], v = tail[j + 1], ex = v.x - u.x, ey = v.y - u.y, el2 = Math.hypot(ex, ey) || 0.001, df = (el2 - 7) / el2;
      v.x -= ex * df; v.y -= ey * df;
    }
  }

  /* ---------- 5. Sparkles and paper confetti ---------- */
  var COLS = ["#ffe066", "#ff7aa0", "#7fe0e8", "#ffffff", "#ffb347"];
  function spark(x, y, n) { for (var j = 0; j < n; j++) sparks.push({ x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: rnd(-20, 20), vy: rnd(-20, 20), life: rnd(0.5, 0.9), max: 0.9, s: rnd(1.5, 3), c: COLS[j % 5], star: true }); }
  function burst(x, y, n) {
    if (reduce.matches) n = Math.ceil(n / 4);
    for (var j = 0; j < n; j++) { var a = rnd(0, TAU), v = rnd(60, 170); sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: rnd(0.8, 1.5), max: 1.5, s: rnd(2.5, 5), c: COLS[j % 5], rot: rnd(0, 6), vr: rnd(-8, 8), star: j % 3 === 0 }); }
  }

  /* ---------- 6. Drawing ---------- */
  function drawKiteShape(g, s, c1, c2, bow) {
    // a diamond kite with two coloured halves, a centre disc and bowed cross spars
    g.beginPath(); g.moveTo(0, -26 * s); g.lineTo(18 * s, -6 * s); g.lineTo(0, 22 * s); g.closePath(); g.fillStyle = c1; g.fill();
    g.beginPath(); g.moveTo(0, -26 * s); g.lineTo(-18 * s, -6 * s); g.lineTo(0, 22 * s); g.closePath(); g.fillStyle = c2; g.fill();
    g.beginPath(); g.moveTo(-18 * s, -6 * s); g.lineTo(0, 22 * s); g.lineTo(18 * s, -6 * s); g.closePath(); g.fillStyle = "rgba(0,0,0,0.12)"; g.fill();
    g.beginPath(); g.arc(0, -5 * s, 5.5 * s, 0, TAU); g.fillStyle = "#fff"; g.fill();
    g.beginPath(); g.arc(0, -5 * s, 3 * s, 0, TAU); g.fillStyle = c1; g.fill();
    g.strokeStyle = "rgba(60,30,20,0.55)"; g.lineWidth = 1.1 * s;
    g.beginPath(); g.moveTo(0, -26 * s); g.lineTo(0, 22 * s); g.moveTo(-18 * s, -6 * s); g.quadraticCurveTo(0, (-6 - bow) * s, 18 * s, -6 * s); g.stroke();
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(skyL, 0, 0);
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    var j;
    if (P.stars) for (j = 0; j < stars.length; j++) { var st = stars[j]; ctx.globalAlpha = 0.5 + 0.4 * Math.sin(t * 1.6 + st.ph); ctx.fillStyle = "#fff"; ctx.fillRect(st.x, st.y, st.r, st.r); }
    ctx.globalAlpha = 1;
    // clouds: a lit top and a warm underside
    clouds.forEach(function (c) {
      c.puffs.forEach(function (p) { ctx.fillStyle = P.cloudB; ctx.beginPath(); ctx.arc(c.x + p[0] * c.s, c.y + p[1] * c.s + 4 * c.s, p[2] * c.s, 0, TAU); ctx.fill(); });
      c.puffs.forEach(function (p) { ctx.fillStyle = P.cloud; ctx.beginPath(); ctx.arc(c.x + p[0] * c.s, c.y + p[1] * c.s, p[2] * c.s, 0, TAU); ctx.fill(); });
    });
    // streaks of wind
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
    streaks.forEach(function (s) { ctx.globalAlpha = Math.min(1, s.life) * 0.6; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.len, s.y); ctx.stroke(); });
    ctx.globalAlpha = 1;
    // distant kites and their thin lines
    farKites.forEach(function (k) {
      var kx = k.x + Math.sin(t * 0.6 + k.ph) * 14, ky = k.y + Math.cos(t * 0.8 + k.ph) * 9;
      ctx.strokeStyle = "rgba(60,30,30,0.35)"; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.quadraticCurveTo(kx + 20, ky + 140, k.ax, 380); ctx.stroke();
      ctx.save(); ctx.translate(kx, ky); ctx.rotate(Math.sin(t * 1.7 + k.ph) * 0.2); drawKiteShape(ctx, k.s, k.c, k.c2, 3); ctx.restore();
    });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(townL, 0, 0);
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    // laundry on a line between two roof poles
    var lx0 = 156, lx1 = 236, ly = perchY(170) - 30;
    ctx.strokeStyle = "#5a4636"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(lx0, ly + 30); ctx.lineTo(lx0, ly - 2); ctx.moveTo(lx1, ly + 30); ctx.lineTo(lx1, ly - 2); ctx.stroke();
    ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(lx0, ly); ctx.quadraticCurveTo((lx0 + lx1) / 2, ly + 8, lx1, ly); ctx.stroke();
    cloth.forEach(function (cl, n) {
      var cx = lx0 + 10 + n * 15, cy = ly + 3 + Math.sin(n / 4 * Math.PI) * 6, flap = (reduce.matches ? 0.2 : 1) * wind * Math.sin(t * 7 + n * 1.3);
      ctx.save(); ctx.translate(cx, cy); ctx.transform(1, 0, flap * 0.5, 1, 0, 0);
      ctx.fillStyle = cl[0];
      if (cl[1]) { ctx.fillRect(-5, 0, 10, 13); ctx.fillRect(-8, 0, 16, 4); } else { ctx.fillRect(-4, 0, 8, 15); }
      ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(2, 0, 3, 13);
      ctx.restore();
    });
    // pigeons: sitting on a parapet or wheeling in the sky
    ctx.fillStyle = isDark() ? "#cfd3e6" : "#4a4f63";
    pigeons.forEach(function (p) {
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.mode === "sit") { ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.6, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(3.2, -2.4, 1.7, 0, TAU); ctx.fill(); }
      else { var fl = Math.sin(p.t * 20) * 4; ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-5, -fl); ctx.quadraticCurveTo(-2, 0, 0, 0); ctx.quadraticCurveTo(2, 0, 5, -fl); ctx.stroke(); }
      ctx.restore();
    });
    drawFlyer(t);
    // the line: a soft shadow and a bright thread
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = isDark() ? "rgba(255,240,220,0.85)" : "rgba(70,40,30,0.75)"; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(rope[0].x, rope[0].y);
    for (j = 1; j < N; j++) ctx.lineTo(rope[j].x, rope[j].y);
    ctx.stroke();
    // tail with little bows
    ctx.strokeStyle = "#e83f6f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tail[0].x, tail[0].y);
    for (j = 1; j < tail.length; j++) ctx.lineTo(tail[j].x, tail[j].y);
    ctx.stroke();
    for (j = 2; j < tail.length; j += 3) {
      var q = tail[j]; ctx.fillStyle = j % 2 ? "#ffe066" : "#7fe0e8";
      ctx.beginPath(); ctx.moveTo(q.x - 5.5, q.y - 4); ctx.lineTo(q.x + 5.5, q.y + 4); ctx.lineTo(q.x + 5.5, q.y - 4); ctx.lineTo(q.x - 5.5, q.y + 4); ctx.closePath(); ctx.fill();
    }
    // the kite itself, with a glow at night
    ctx.save(); ctx.translate(kite.x, kite.y); ctx.rotate(kite.a);
    if (isDark()) { var kg = ctx.createRadialGradient(0, 0, 2, 0, 0, 40); kg.addColorStop(0, "rgba(255,180,120,0.35)"); kg.addColorStop(1, "rgba(255,180,120,0)"); ctx.fillStyle = kg; ctx.fillRect(-40, -40, 80, 80); }
    ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = 6 * sc; ctx.shadowOffsetY = 3 * sc;
    drawKiteShape(ctx, 1.3, "#e83f6f", "#ffbf3c", 4 + Math.sin(t * 8) * (reduce.matches ? 0 : 1.5));
    ctx.restore();
    // sparkles
    sparks.forEach(function (s) {
      ctx.globalAlpha = Math.max(0, Math.min(1, s.life / s.max * 1.6));
      ctx.fillStyle = s.c;
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot || 0);
      if (s.star) { ctx.beginPath(); for (var m = 0; m < 8; m++) { var rr2 = m % 2 ? s.s * 0.35 : s.s, a = m * Math.PI / 4; ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } ctx.fill(); }
      else ctx.fillRect(-s.s / 2, -s.s / 3, s.s, s.s * 0.66);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }
  function drawFlyer(t) {
    // the flyer stands behind the parapet: kurta, cap, one arm up holding the line, a spool at the waist
    var bob = reduce.matches ? 0 : Math.sin(t * 2.2) * 0.6;
    ctx.save(); ctx.translate(0, bob);
    ctx.fillStyle = P.kurta; ctx.beginPath(); ctx.moveTo(92, 449); ctx.lineTo(95, 424); ctx.quadraticCurveTo(103, 418, 112, 424); ctx.lineTo(116, 449); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(104, 426, 2, 22);
    ctx.fillStyle = "#c98b62"; ctx.beginPath(); ctx.arc(103, 410, 8.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#2b2b3a"; ctx.beginPath(); ctx.arc(103, 407, 8.6, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); ctx.fillRect(96, 404, 15, 3);
    ctx.fillStyle = "#3b2516"; ctx.beginPath(); ctx.arc(106.5, 410, 1.1, 0, TAU); ctx.fill();
    // arm towards the hand
    ctx.strokeStyle = P.kurta; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(SH.x + 4, SH.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();
    ctx.fillStyle = "#c98b62"; ctx.beginPath(); ctx.arc(hand.x, hand.y, 3, 0, TAU); ctx.fill();
    // spool, spinning when the line runs out
    ctx.save(); ctx.translate(97, 440); ctx.rotate(spoolA);
    ctx.fillStyle = "#b5793f"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#6b4423"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke();
    ctx.fillStyle = "#f2e6d0"; ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  var spoolA = 0;

  /* ---------- 7. Main loop ---------- */
  var last = performance.now(), readT = 0, demoReel = false;
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
    // the hand follows the line direction, with a jerk back on every tug
    var ang = Math.atan2(kite.y - SH.y, kite.x - SH.x); ang = clamp(ang, -2.6, -0.3);
    var pullBack = (pulling || t < holdUntil) && !reduce.matches ? Math.max(0, Math.sin(t * 16)) * 4 : 0;
    hand.x = SH.x + Math.cos(ang) * (20 - pullBack); hand.y = SH.y + Math.sin(ang) * (20 - pullBack) + pullBack * 0.6;
    if (letting || t < letUntil) spoolA += dt * 14;
    stepKite(dt, t); stepRope(dt);
    var calm = reduce.matches;
    clouds.forEach(function (c) { c.x += c.sp * (0.4 + wind) * dt * (calm ? 0.4 : 1); if (c.x > 470) { c.x = -90; c.y = rnd(40, 250); } });
    if (!calm && Math.random() < dt * wind * (1 + Math.max(0, gustAt(t)) * 3)) streaks.push({ x: rnd(-60, 300), y: rnd(30, 330), len: rnd(30, 80), life: 1 });
    for (var j = streaks.length - 1; j >= 0; j--) { var s = streaks[j]; s.x += (160 + wind * 200) * dt; s.life -= dt * 1.2; if (s.life <= 0) streaks.splice(j, 1); }
    for (j = sparks.length - 1; j >= 0; j--) { var p = sparks[j]; p.life -= dt; if (p.life <= 0) { sparks.splice(j, 1); continue; } p.vy += 60 * dt; p.vx *= 0.98; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot !== undefined) p.rot += p.vr * dt; }
    // pigeons wheel around the kite, then come home
    if (flockT > 0) flockT -= dt;
    pigeons.forEach(function (p, n) {
      p.t += dt;
      if (p.mode === "fly") {
        if (p.delay > 0) { p.delay -= dt; return; }
        p.ang += dt * 1.6;
        var cx = kite.x * 0.6 + 120, cy = Math.min(300, kite.y + 40), tx = cx + Math.cos(p.ang) * p.rad, ty = cy + Math.sin(p.ang) * p.rad * 0.45;
        p.x += (tx - p.x) * Math.min(1, dt * 2.2); p.y += (ty - p.y) * Math.min(1, dt * 2.2);
        if (flockT <= 0) p.mode = "home";
      } else if (p.mode === "home") {
        var dx = p.hx - p.x, dy = p.hy - p.y, dd = Math.hypot(dx, dy);
        if (dd < 1) { p.mode = "sit"; p.x = p.hx; p.y = p.hy; } else { var sp = Math.min(dd * 2, 90) * dt; p.x += dx / dd * sp; p.y += dy / dd * sp; }
      } else { p.x = p.hx + (Math.sin(p.t * 0.7 + n) > 0.85 ? 1.5 : 0); p.y = p.hy; }
    });
    readT -= dt;
    if (readT <= 0) { readT = 0.2; $("readout").textContent = "Height " + Math.round(heightM()) + " m · Line " + Math.round(line * 0.42) + " m"; }
    draw(t);
    requestAnimationFrame(frame);
  }

  /* ---------- 8. Input: hold buttons, the sky, keys and the wind slider ---------- */
  function nowS() { return performance.now() / 1000; }
  function startPull() { if (!pulling) { pulling = true; tug = 1; $("pull").classList.add("held"); } }
  function endPull() { if (pulling) { pulling = false; holdUntil = nowS() + 0.25; $("pull").classList.remove("held"); } }
  function startLet() { if (!letting) { letting = true; $("letOut").classList.add("held"); } }
  function endLet() { if (letting) { letting = false; letUntil = nowS() + 0.35; $("letOut").classList.remove("held"); if (line >= 399) say("All the line is out. Pull to bring it in."); } }
  function holdButton(btn, start, end) {
    var lastStart = -9;
    function go() { lastStart = nowS(); start(); }
    btn.addEventListener("pointerdown", function (e) { e.preventDefault(); go(); try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) { btn.addEventListener(ev, end); });
    btn.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); go(); } });
    btn.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); end(); } });
    btn.addEventListener("blur", end);
    // a click that did not come with a press (for example from a screen reader) is a short tug
    btn.addEventListener("click", function () { if (nowS() - lastStart < 0.6) return; go(); setTimeout(end, 300); });
  }
  holdButton($("pull"), function () { startPull(); say("Pulling: the kite climbs into the wind."); }, endPull);
  holdButton($("letOut"), function () { startLet(); say("Letting out line: the kite drifts further and higher."); }, endLet);
  $("loop").addEventListener("click", function () {
    if (loopT >= 0) return;
    if (heightM() < 30) { say("Get the kite above 30 metres first, then try a loop."); badge("Climb higher first"); return; }
    loopFrom = { x: kite.x, y: kite.y }; loopT = 0; say("Loop!");
  });
  var NAMES = ["Still", "Light air", "Breezy", "Windy", "Gusty"];
  $("wind").addEventListener("input", function (e) {
    wind = e.target.value / 100;
    $("windOut").textContent = NAMES[Math.min(4, Math.floor(wind * 4.99))];
  });
  function logical(e) { var r = scene.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  scene.addEventListener("pointermove", function (e) { if (e.isTrusted) steerX = logical(e).x; });
  scene.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") steerX = null; });
  scene.addEventListener("pointerdown", function (e) {
    var p = logical(e); steerX = p.x;
    if (p.x > 240 && p.x < 350 && p.y > 300 && p.y < 420) { scarePigeons(); say("Whoosh: the pigeons take off."); }
    startPull();
    try { scene.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  ["pointerup", "pointercancel"].forEach(function (ev) { scene.addEventListener(ev, endPull); });
  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "wind") return;
    if (e.key === "ArrowUp") { e.preventDefault(); startPull(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); startLet(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); steerX = clamp((steerX == null ? kite.x : steerX) + (e.key === "ArrowLeft" ? -24 : 24), 20, 380); }
  });
  window.addEventListener("keyup", function (e) { if (e.key === "ArrowUp") endPull(); if (e.key === "ArrowDown") endLet(); });

  /* ---------- 9. Auto demo until the visitor takes over ---------- */
  var demoOn = true, timers = [];
  function at(ms, fn) { timers.push(setTimeout(function () { if (demoOn) fn(); }, ms)); }
  function demo() {
    if (!demoOn) return;
    at(200, function () { startLet(); autoSteer = 10; });
    at(1900, function () { endLet(); });
    at(2300, function () { startPull(); });
    at(3900, function () { endPull(); });
    at(4500, function () { $("loop").click(); });
    at(6600, function () { autoSteer = -105; });
    at(8200, function () { autoSteer = 55; startLet(); });
    at(9400, function () { endLet(); startPull(); });
    at(10600, function () { endPull(); });
    at(11200, function () { demoReel = true; startPull(); });
    at(13400, function () { endPull(); demoReel = false; autoSteer = 0; });
    at(14200, demo);
  }
  function stopDemo(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false; timers.forEach(clearTimeout); autoSteer = 0; demoReel = false;
    if (pulling && e.target !== $("pull")) endPull();
    if (letting) endLet();
  }
  ["pointerdown", "keydown", "wheel"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });

  requestAnimationFrame(frame);
  demo();
})();
</script>
</body>
