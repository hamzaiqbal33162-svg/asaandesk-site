<!doctype html>
<!-- Chill & Craft · Hobline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobline · job desk for kitchen fitters</title>
<style>
/* ---------- Core layout: shared structure. The look lives in the theme block below. ---------- */
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-h:var(--font);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:14px;--r2:9px;--side:236px;--pad:22px;--gap:16px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.5,.64,1);
--bg:#f5f6f8;--tx:#16181d;--mu:#667085;--line:#e4e7ec;--card:#fff;--card-solid:#fff;--hover:rgba(16,24,40,.05);--inp:#fff;--ac:#4f46e5;--on-ac:#fff;--ok:#12a150;--warn:#d98a06;--bad:#d92d20;--info:#1f7ae0;
--sh:0 1px 2px rgba(16,24,40,.06);--sh2:0 12px 28px -10px rgba(16,24,40,.22);--side-bg:#fff;--side-tx:#16181d;--side-mu:#667085;--side-act:rgba(79,70,229,.1);--side-on:#4f46e5;--top-bg:rgba(245,246,248,.8);--col-bg:rgba(16,24,40,.04);
--c1:#4f46e5;--c2:#0ea5a4;--c3:#f59e0b;--c4:#ec4899;--c5:#22c55e;--c6:#64748b;--tip-bg:#111318;--toast-bg:#15171c}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 var(--font);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color:var(--tx)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-h)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}.mu{color:var(--mu)}.nowrap{white-space:nowrap}.tnum{font-variant-numeric:tabular-nums}
.skip{position:fixed;left:8px;top:-60px;z-index:300;padding:8px 12px;border-radius:8px;background:var(--ac);color:var(--on-ac);text-decoration:none}.skip:focus{top:8px}
/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 14px;background:var(--side-bg);color:var(--side-tx);overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1.1 var(--font-h);padding:4px 8px;letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand svg{width:32px;height:32px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r2);text-decoration:none;color:var(--side-mu);font-weight:560;transition:color .2s}
.nav a:hover{color:var(--side-tx)}
.nav a[aria-current=page]{color:var(--side-on)}
.nav .mk{position:absolute;left:0;top:0;width:0;height:0;border-radius:var(--r2);background:var(--side-act);transition:transform .42s var(--spring),width .35s var(--ease),height .3s var(--ease),opacity .2s;pointer-events:none;z-index:0}
.nav .ct{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--side-act);color:var(--side-on)}
.side-foot{margin-top:auto}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px var(--pad);background:var(--top-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tt{min-width:0}
.ptitle{font:750 20px/1.2 var(--font-h);margin:0;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{margin:1px 0 0;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{padding:var(--pad);outline:none;flex:1}
.only-m{display:none!important}
kbd{font:600 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--mu)}
.ubtn{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer}
.ubtn .av{width:34px;height:34px}
.dotn{position:absolute;top:6px;right:6px;min-width:8px;height:8px;border-radius:99px;background:var(--bad);box-shadow:0 0 0 2px var(--card-solid);display:none}
.dotn.on{display:block;animation:pulse 2s 4}
#bellBtn{position:relative}
[data-theme=dark] .tm-d,[data-theme=light] .tm-l{display:none}
/* top-nav layout */
.L-top{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
.L-top .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px var(--pad);gap:22px;overflow:visible}
.L-top .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.L-top .side-foot{margin:0 0 0 auto}
.L-top .top{top:var(--topnav-h,62px)}
/* icon rail layout */
.L-rail{--side:88px}
.L-rail .side{align-items:center;padding:16px 8px}
.L-rail .brand{flex-direction:column;gap:4px;font-size:11px;padding:0}
.L-rail .nav a{flex-direction:column;gap:4px;padding:10px 6px;width:72px;font-size:10.5px;text-align:center;line-height:1.15}
.L-rail .nav a .ct{position:absolute;top:4px;right:6px;margin:0;padding:0 5px;font-size:10px}
.L-rail .side-foot{display:flex;flex-direction:column;align-items:center}
/* page grid */
.page{display:flex;flex-direction:column;gap:var(--gap)}
.g{display:grid;gap:var(--gap);min-width:0}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.card{position:relative;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .28s var(--ease),box-shadow .28s,background-color .3s}
.card.lift:hover,.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.ch{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;min-width:0}
.ch h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.ch p{margin:0;font-size:12px;color:var(--mu)}
.kpi .l{font-size:12.5px;color:var(--mu);font-weight:560;display:flex;align-items:center;gap:6px}
.kpi .v{font:800 26px/1.15 var(--font-h);letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .spark{position:absolute;right:12px;bottom:12px}
.delta{font-size:12px;font-weight:700}.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
/* enter animation (staggered per card) */
.page.enter>*:not(.g),.page.enter .card{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.page.enter .kcard{animation:rise .45s var(--ease) both;animation-delay:calc(var(--d,0)*28ms + 140ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 20%,transparent)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gsw{from{stroke-dasharray:0 2}}
.dl0{font-size:11px;fill:var(--mu)}
/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,var(--r2));border:1px solid var(--line);background:var(--card-solid);color:var(--tx);font-weight:620;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:transform .14s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,color .2s;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--line))}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-ac);box-shadow:0 6px 16px -8px var(--ac)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--bad);border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;gap:5px}
.btn.icon{width:36px;padding:0}.btn.icon.sm{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;font-weight:620;color:var(--mu);transition:all .2s var(--ease)}
.chip:hover{color:var(--tx)}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--hover);gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--mu);transition:all .2s}
.seg button[aria-pressed=true]{background:var(--card-solid);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:680;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--ac)) 15%,transparent);color:color-mix(in srgb,var(--c,var(--ac)) 80%,var(--tx))}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--ac))}
.tag.plain::before{display:none}
.av{--h:200;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h) 62% 86%);color:hsl(var(--h) 50% 28%);font-size:11px;font-weight:760;flex:none;letter-spacing:.02em}
[data-theme=dark] .av{background:hsl(var(--h) 34% 30%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:42px;height:42px;font-size:14px}.av.sm{width:22px;height:22px;font-size:9px}
.avs{display:inline-flex}.avs .av{margin-left:-7px;box-shadow:0 0 0 2px var(--card-solid)}.avs .av:first-child{margin-left:0}
.prog{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.prog>i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--c,var(--ac));transform-origin:left;animation:growx 1s var(--ease) both;transition:width .5s var(--ease)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;color:var(--mu);text-align:center}
.empty .i{width:28px;height:28px;opacity:.6}
.empty p{margin:0}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.switch input:checked+i{background:var(--ac)}
.switch input:checked+i::after{transform:translateX(16px)}
.switch input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.list>li:last-child{border-bottom:0}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:650;font-size:13px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
/* table */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:7px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--inp);min-width:0;flex:1 1 180px;max-width:300px;color:var(--mu);transition:border-color .2s,box-shadow .2s}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--tx)}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:680;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.th{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
.th i{width:8px;height:8px;opacity:.35;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);transition:transform .2s,opacity .2s}
th[aria-sort=ascending] .th i{opacity:1;transform:rotate(-135deg) translate(-2px,-1px)}th[aria-sort=descending] .th i{opacity:1}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{transition:background-color .15s;animation:fade .4s var(--ease) both;animation-delay:calc(var(--d,0)*22ms)}
.tbl tbody tr[data-i]{cursor:pointer}
.tbl tbody tr[data-i]:hover{background:var(--hover)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mu);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}
.pager .pg button[aria-current=page]{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:650}
.field label b{color:var(--bad)}
.field input,.field select,.field textarea,.inp{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--inp);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.field textarea{height:auto;padding:9px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.field.bad{animation:shake .35s}
.err{color:var(--bad);font-size:11.5px;font-weight:600;min-height:0}
.err:empty{display:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* modal and drawer layers */
.layer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.backdrop{position:absolute;inset:0;background:rgba(8,10,18,.48);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.layer.in .backdrop{opacity:1}.layer.out .backdrop{opacity:0}
.layer.out{pointer-events:none}
.modal-box{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--card-solid);color:var(--tx);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .38s var(--spring),opacity .22s;outline:none}
.modal-box.wide{width:min(820px,100%)}
.layer.in .modal-box{transform:none;opacity:1}.layer.out .modal-box{transform:translateY(10px) scale(.98);opacity:0}
.layer.drawer{place-items:stretch end;padding:0}
.drawer-box{position:relative;width:min(500px,100%);height:100%;display:flex;flex-direction:column;background:var(--card-solid);color:var(--tx);border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.45);transform:translateX(100%);transition:transform .42s var(--ease);outline:none}
.drawer-box.wide{width:min(640px,100%)}
.layer.in .drawer-box{transform:none}.layer.out .drawer-box{transform:translateX(100%)}
.lh{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.lh h2{margin:0;font-size:17px;flex:1;min-width:0;letter-spacing:-.01em}
.lb{padding:4px 18px 18px;overflow-y:auto;flex:1}
.lf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0 0 14px;font-size:13px}
.dl dt{color:var(--mu)}.dl dd{margin:0;min-width:0}
/* popover menus */
.menu{position:fixed;z-index:160;min-width:190px;max-width:calc(100vw - 16px);padding:5px;background:var(--card-solid);color:var(--tx);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.4);animation:pop .2s var(--ease);transform-origin:top right}
.menu>button,.menu .mi{display:flex;gap:9px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;font-size:13px;color:inherit}
.menu>button:hover,.menu>button:focus-visible{background:var(--hover);outline:none}
.menu .mh{padding:6px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:700}
.np{width:min(340px,calc(100vw - 24px))}
.np ul{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.np li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;color:inherit}
.np li button:hover{background:var(--hover)}
.np li.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:6px;vertical-align:1px}
.np b{display:block;font-size:13px;font-weight:600}.np small{color:var(--mu);font-size:11.5px}
.nph{display:flex;align-items:center;padding:6px 6px 8px 10px}
/* toasts and chart tooltip */
.toasts{position:fixed;right:16px;bottom:16px;z-index:220;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:9px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--toast-bg);color:#fff;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);font-weight:560;font-size:13.5px;animation:tin .45s var(--spring) both;pointer-events:auto;max-width:min(380px,calc(100vw - 32px))}
.toast .i{color:#7ee2a8}.toast.bad .i{color:#ff9b8f}.toast.warn .i{color:#ffd27a}
.toast.out{animation:tout .3s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.ctip{position:fixed;left:0;top:0;z-index:250;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg);color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap}
.ctip.on{opacity:1;transform:none}
.ctip .tt0{font-weight:700;margin-bottom:2px}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;overflow:visible;max-width:100%}
.ax text,.chart text{font-size:11px;fill:var(--mu);font-family:var(--font)}
.gl line{stroke:var(--line);stroke-dasharray:3 4}
.ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;animation:draw 1.2s var(--ease) both;animation-delay:calc(var(--d,0)*120ms)}
.fade{animation:fade .9s .3s var(--ease) both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:grow .75s var(--ease) both;animation-delay:calc(var(--d,0)*35ms)}
.bar.hz{transform-origin:0 50%}.bar.hz.grow{animation-name:growx}
.band{fill:transparent}.band.on{fill:var(--hover)}
.gd{stroke:var(--mu);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.hd{opacity:0;stroke:var(--card-solid);stroke-width:2.5}
.arc{fill:none;transition:opacity .2s,stroke-width .2s}
.dn-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn-wrap svg{flex:none}
.dleg{list-style:none;margin:0;padding:0;flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.dleg li{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:7px;transition:background-color .15s}
.dleg li.on{background:var(--hover)}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dv{font:800 22px var(--font-h);fill:var(--tx)!important}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mu);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hm rect.c{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) both;animation-delay:calc(var(--d,0)*5ms)}
.hm rect.c:hover{stroke:var(--tx);stroke-width:1.5}
.spark{display:block;overflow:visible}
.hb{display:flex;flex-direction:column;gap:9px}
.hb>div{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb .prog{height:9px}
.hb b{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
/* kanban */
.kb{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;align-items:flex-start;min-height:200px}
.kcol{flex:0 0 268px;background:var(--col-bg);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;transition:background-color .2s,box-shadow .2s}
.kcol.hi{box-shadow:inset 0 0 0 2px var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--col-bg))}
.kh{display:flex;align-items:center;gap:8px;font-weight:720;font-size:13px;padding:2px 2px 4px 4px}
.kh .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kh em{font-style:normal;font-size:11.5px;color:var(--mu);font-weight:700}
.kh small{margin-left:auto;color:var(--mu);font-weight:600;font-size:11.5px}
.kh small+button,.kh em+button{margin-left:auto}
.kcards{display:flex;flex-direction:column;gap:8px;min-height:50px}
.kcard{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r2);padding:10px 34px 10px 12px;cursor:grab;box-shadow:var(--sh);transition:transform .22s var(--ease),box-shadow .22s,opacity .2s;user-select:none;-webkit-user-select:none}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kcard.ghosted{opacity:.3}
.kcard .kmove{position:absolute;top:6px;right:4px;opacity:.55}
.kcard:hover .kmove,.kcard:focus-within .kmove{opacity:1}
.grip{position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:14px;height:30px;padding:0;border:0;background:none;color:var(--mu);opacity:0;cursor:grab;touch-action:none;display:grid;place-items:center}
.grip .i{width:14px;height:14px}
.kcard:hover .grip{opacity:.7}
@media (hover:none){.grip{opacity:.6}.kcard{padding-left:16px}}
.kempty{margin:0;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r2);text-align:center;color:var(--mu);font-size:12.5px}
.drag-ghost{position:fixed!important;z-index:180;pointer-events:none;margin:0!important;transform:rotate(2.5deg) scale(1.04);box-shadow:0 24px 50px -12px rgba(0,0,0,.45)!important;opacity:.96;transition:none!important;animation:none!important}
.ins{height:3px;border-radius:3px;background:var(--ac);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* month calendar */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calh h3{margin:0 6px;font-size:17px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.cal .dh{padding:6px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cd{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .15s}
.cd.out{background:var(--hover)}.cd.out .dn{opacity:.45}
.cd.hi{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.cd .dn{border:0;background:none;font-size:12px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:inherit;flex:none}
.cd .dn:hover{background:var(--hover)}
.cd.today .dn{background:var(--ac);color:var(--on-ac)}
.cd [data-list]{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:620;background:color-mix(in srgb,var(--c) 18%,var(--card-solid));color:var(--tx);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;transition:transform .15s,box-shadow .15s}
.ev:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.cd .more{border:0;background:none;font-size:11px;color:var(--mu);text-align:left;cursor:pointer;padding:0 4px;font-weight:650}
/* gantt */
.gantt{overflow:auto;position:relative;border:1px solid var(--line);border-radius:var(--r2);max-height:560px}
.gin{position:relative;display:grid;min-width:max-content}
.gl0{position:sticky;left:0;z-index:3;background:var(--card-solid);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden}
.ghd{position:sticky;top:0;z-index:4;background:var(--card-solid);border-bottom:1px solid var(--line)}
.ghd.gl0{z-index:5}
.gdays{display:flex}
.gdays span{flex:none;text-align:center;font-size:10.5px;color:var(--mu);font-weight:650;padding:3px 0;border-left:1px solid transparent}
.gdays span.we{background:var(--hover)}
.gdays span.td{color:var(--ac);font-weight:800}
.gmon{display:flex;font-size:11px;font-weight:750;border-bottom:1px solid var(--line)}
.gmon span{flex:none;padding:3px 8px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.gtr{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(var(--dw)*7) 100%;background-position:var(--wo,0) 0}
.gb{position:absolute;top:7px;height:calc(100% - 14px);border:0;border-radius:7px;background:color-mix(in srgb,var(--c) 30%,var(--card-solid));color:var(--tx);font-size:11.5px;font-weight:680;text-align:left;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;touch-action:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent);transform-origin:left;transition:box-shadow .2s,left .25s var(--ease),width .25s var(--ease)}
.gb.anim{animation:growx .8s var(--ease) both;animation-delay:calc(var(--d,0)*45ms)}
.gb>i{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--c);opacity:.55;border-radius:inherit;pointer-events:none}
.gb>span{position:relative}
.gb.drag{transition:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.4),inset 0 0 0 2px var(--c);z-index:2}
.gb .gh{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.gb .gh::after{content:"";position:absolute;right:3px;top:30%;bottom:30%;width:2px;border-radius:2px;background:currentColor;opacity:.4}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);z-index:2;pointer-events:none}
.gtoday::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.gdeps{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
.gdeps path{fill:none;stroke:var(--mu);stroke-width:1.4;opacity:.7}
/* files and comments in detail drawers */
.files{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;animation:rise .35s var(--ease) both}
.files .fi{width:34px;height:40px;border-radius:6px;display:grid;place-items:end center;padding-bottom:4px;font-size:9px;font-weight:800;color:#fff;background:var(--c);flex:none;text-transform:uppercase;clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%)}
.files .fn{display:flex;flex-direction:column;min-width:0;flex:1}
.files .fn b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fn small{color:var(--mu);font-size:11.5px}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mu);font-size:12.5px;cursor:pointer;transition:all .2s}
.drop:hover,.drop.hi{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}
.thread{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:12px}
.thread li{display:flex;gap:10px;animation:rise .35s var(--ease) both}
.thread p{margin:0;font-size:13px}
.thread .bub{background:var(--hover);padding:8px 11px;border-radius:4px 12px 12px 12px;min-width:0;flex:1}
.cform{display:flex;flex-direction:column;gap:8px}
.cform textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--inp);resize:vertical;outline:none}
.cform textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.cform .row{justify-content:flex-end}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.checks label:hover{background:var(--hover)}
.checks input{width:16px;height:16px;accent-color:var(--ac)}
.checks input:checked+span{text-decoration:line-through;color:var(--mu)}
/* command search */
.cmdk ul{list-style:none;margin:10px 0 0;padding:0;max-height:320px;overflow:auto}
.cmdk li button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;cursor:pointer;color:inherit;font-size:13.5px}
.cmdk li button[aria-selected=true]{background:var(--ac);color:var(--on-ac)}
.cmdk .search{max-width:none;height:44px}
/* timer chip */
.tchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--tx);font:700 12.5px var(--mono)}
.tchip[hidden]{display:none}
.tchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.6s infinite}
.tchip span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font);font-weight:600}
/* responsive */
@media (max-width:1180px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.g-21,.g-12,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app,.L-top,.L-rail{grid-template-columns:minmax(0,1fr)}
  .side,.L-top .side,.L-rail .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:min(280px,84vw);flex-direction:column;align-items:stretch;padding:18px 14px;transform:translateX(-105%);transition:transform .35s var(--ease);box-shadow:20px 0 60px -20px rgba(0,0,0,.4);overflow-y:auto}
  .L-top .nav,.L-rail .nav{flex-direction:column;overflow:visible}
  .L-rail .nav a{flex-direction:row;width:auto;font-size:14px;padding:9px 12px;gap:11px}
  .L-rail .nav a .ct{position:static;margin-left:auto}
  .L-rail .brand{flex-direction:row;font-size:17px}
  .L-top .side-foot{margin:auto 0 0}
  .L-top .top{top:0}
  .nav-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(8,10,18,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .nav-open .scrim{opacity:1;pointer-events:auto}
  .only-m{display:inline-flex!important}
  .hide-s{display:none!important}
}
@media (max-width:640px){
  :root{--pad:14px;--gap:12px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .ptitle{font-size:17px}
  .kpi .v{font-size:21px}
  .kpi .spark{display:none}
  .cd{min-height:62px;padding:2px}
  .ev{font-size:0;height:7px;padding:0;border-left-width:0;background:var(--c)}
  .cal .dh{padding:4px 2px;text-align:center;font-size:10px;letter-spacing:0}
  .dl{grid-template-columns:90px 1fr}
  .kcol{flex-basis:248px}
  .top{gap:4px}
  .hide-xs{display:none!important}
}
@media (max-width:440px){.tchip span{display:none}.top .btn.icon,.top #cmdBtn{width:32px;padding:0}.ubtn .av{width:30px;height:30px}.top{padding-left:10px;padding-right:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* ---------- Hobline look: walnut and cream, outlined cards, serif headings ---------- */
:root{--font-h:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--r:10px;--r2:7px;--side:230px}
[data-theme=light]{--bg:#f5efe6;--tx:#2a211b;--mu:#7a6b5d;--line:#e4d9c9;--card:#fffcf7;--card-solid:#fffcf7;--hover:rgba(90,60,30,.06);--inp:#fff;--ac:#8a5a35;--on-ac:#fff8ef;--ok:#3f7d4f;--warn:#b7791f;--bad:#b4442c;--info:#3f6c93;--sh:none;--sh2:0 14px 30px -14px rgba(80,50,20,.38);--side-bg:#2a2019;--side-tx:#f6ecdf;--side-mu:#bba996;--side-act:rgba(246,236,223,.11);--side-on:#fff3e2;--top-bg:rgba(245,239,230,.86);--col-bg:#eee4d5;--c1:#8a5a35;--c2:#6f8f72;--c3:#c8693f;--c4:#5b7a99;--c5:#c09a22;--c6:#a3968a;--wood:#e9d3b5;--tip-bg:#2a2019;--toast-bg:#2a2019}
[data-theme=dark]{--bg:#15100c;--tx:#f3eadf;--mu:#a8988a;--line:#3a2f26;--card:#1e1712;--card-solid:#231b15;--hover:rgba(255,235,210,.06);--inp:#1a1410;--ac:#d69c63;--on-ac:#1d140c;--ok:#7cc08a;--warn:#e0b04f;--bad:#e8765c;--info:#7fa7d1;--sh:none;--sh2:0 16px 34px -14px rgba(0,0,0,.75);--side-bg:#0e0a07;--side-tx:#f3eadf;--side-mu:#9d8d7e;--side-act:rgba(214,156,99,.15);--side-on:#f1c08f;--top-bg:rgba(21,16,12,.86);--col-bg:#1a1410;--c1:#d69c63;--c2:#8fb393;--c3:#e08a62;--c4:#86a7c9;--c5:#e0c060;--c6:#8e8378;--wood:#5a4231;--tip-bg:#000;--toast-bg:#2e241c}
.side{background:var(--side-bg) repeating-linear-gradient(97deg,transparent 0 26px,rgba(255,255,255,.022) 26px 28px,transparent 28px 61px)}
.brand span{font-size:20px;font-weight:700;letter-spacing:.01em}
.nav a{border-radius:6px;font-size:13.5px}
.nav .mk{border-radius:6px;box-shadow:inset 3px 0 0 var(--side-on)}
.ptitle{font-size:25px;font-weight:700}
.card .ch h3{font:700 17px/1.2 var(--font-h)}
.kpi{border-top:3px solid var(--kc,var(--ac));border-radius:4px 4px var(--r) var(--r)}
.kpi .v{font-family:var(--font-h);font-weight:700}
.crew{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px;font-size:12.5px;color:var(--side-mu)}
.crew b{display:block;color:var(--side-tx);font:700 14px var(--font-h);margin-bottom:6px}
.crew .avs .av{box-shadow:0 0 0 2px var(--side-bg)}
.crew .btn{width:100%;margin-top:10px;background:var(--side-on);color:#2a2019;border:0}
/* kitchen plan, the signature drawing */
.plan-card{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:center}
.plan{width:100%;height:auto;display:block;max-height:290px}
.plan .w{fill:none;stroke:var(--tx);stroke-width:5;stroke-linejoin:round;stroke-dasharray:1;animation:draw 1.1s var(--ease) both}
.plan .u{fill:var(--wood);stroke:var(--tx);stroke-width:1.3;stroke-dasharray:1;animation:draw .7s var(--ease) both,pfill .7s var(--ease) both;animation-delay:calc(var(--d)*55ms + .3s),calc(var(--d)*55ms + .8s);transition:fill .2s;cursor:help}
.plan .u:hover{fill:color-mix(in srgb,var(--ac) 45%,var(--wood))}
.plan .x{fill:none;stroke:var(--tx);stroke-width:1.2;stroke-dasharray:1;animation:draw .6s var(--ease) both;animation-delay:calc(var(--d)*55ms + .6s)}
.plan .win{fill:var(--card-solid);stroke:var(--c4);stroke-width:2}
.plan .dim{fill:none;stroke:var(--mu);stroke-width:1}
.plan text{font:600 10.5px var(--font);fill:var(--mu)}
.plan .lab{font:italic 700 11px var(--font-h);fill:var(--ac);animation:fade .6s 1.6s both}
@keyframes pfill{from{fill-opacity:0}}
.pinfo h4{margin:0;font:700 20px/1.2 var(--font-h)}
.pinfo .dl{margin:12px 0}
.steps{display:flex;gap:4px;margin:6px 0 14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--hover)}
.steps i.on{background:var(--ac);animation:growx .5s var(--ease) both;transform-origin:left;animation-delay:calc(var(--d)*60ms + .9s)}
/* job cards */
.kc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.kid{font:700 11px var(--mono);color:var(--mu)}
.kt{display:block;font:700 14.5px var(--font-h)}
.kc-bot{display:flex;align-items:center;gap:6px;margin:8px 0 7px;font-size:12px;color:var(--mu)}
.kc-bot b{color:var(--tx);font-size:12.5px}
.kcard small{display:flex;align-items:center;gap:4px}.kcard small .i{width:13px;height:13px}
.kcol{border-top:3px solid var(--c);border-radius:4px 4px var(--r) var(--r)}
/* week planner */
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.wkg{min-width:780px;display:grid;grid-template-columns:200px repeat(6,minmax(92px,1fr))}
.wkh{padding:10px;font-size:12px;font-weight:700;color:var(--mu);border-bottom:1px solid var(--line);border-left:1px solid var(--line);position:sticky;top:0;background:var(--card-solid)}
.wkh b{display:block;font:700 18px var(--font-h);color:var(--tx)}
.wkh.td b{color:var(--ac)}
.wf{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid var(--line);min-width:0}
.wf small{display:block;color:var(--mu);font-size:11.5px}
.wf .prog{width:70px;height:5px;margin-top:5px}
.wrow{grid-column:2/-1;position:relative;min-height:80px;border-bottom:1px solid var(--line)}
.wcells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.wc{border-left:1px solid var(--line);transition:background-color .15s}
.wc.td{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.wc.hi,.tray.hi{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.wc .ins{display:none}
.wblocks{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px 4px;padding:7px 4px;pointer-events:none;align-content:start}
.wj{pointer-events:auto;position:relative;min-width:0;padding:6px 26px 6px 9px;border-radius:7px;background:color-mix(in srgb,var(--c) 17%,var(--card-solid));border-left:4px solid var(--c);font-size:12px;line-height:1.3;cursor:grab;touch-action:none;box-shadow:0 1px 0 var(--line);transition:transform .18s var(--ease),box-shadow .18s}
.page.enter .wj{animation:rise .45s var(--ease) both;animation-delay:calc(var(--d,0)*40ms + .2s)}
.wj:hover{transform:translateY(-2px);box-shadow:var(--sh2)}

.stockq{display:flex;align-items:center;gap:8px}
.stockq .prog{width:80px}

  drawer({title:j.id+' · '+c.n,wide:true,body:`<div class="row" style="margin-bottom:12px"><span class="tag" style="--c:${SG(j.stage).c}">${esc(SG(j.stage).l)}</span><span class="tag plain" style="--c:var(--c4)">${esc(j.type)}</span><span class="sp"></span><label class="vh" for="jst">Stage</label><select id="jst" class="inp" style="width:auto">${STAGES.map(s=>`<option value="${s.id}"${s.id===j.stage?' selected':''}>${s.l}</option>`).join('')}</select></div>
    ${tabsHTML('jd',['Details','Checklist <span class="mu" data-chk></span>','Plan','Files <span class="mu" data-fcount></span>','Comments <span class="mu" data-ccount></span>'])}
    <div id="jdp0" role="tabpanel" aria-labelledby="jdt0"><dl class="dl"><dt>Customer</dt><dd><b>${esc(c.n)}</b> · ${esc(c.ph)}</dd><dt>Address</dt><dd>${esc(c.area)}, ${esc(D.settings.city)}</dd><dt>Layout</dt><dd>${esc(j.layout)}</dd><dt>Job value</dt><dd><b>${money(j.value)}</b></dd><dt>Fitter</dt><dd>${av(F(j.fitter).n,'sm')} ${esc(F(j.fitter).n)}</dd><dt>Fit date</dt><dd>${j.fit?fmtDY(j.fit)+' · '+j.days+' day'+(j.days>1?'s':''):'<span class="mu">Not scheduled</span>'}</dd><dt>Created</dt><dd>${fmtDY(j.created)}</dd></dl>
      <div class="row"><button class="btn pri sm" data-jedit>${ic('edit')}Edit job</button><button class="btn sm" data-jgo="schedule">${ic('cal')}Open in schedule</button><button class="btn sm" data-jnext>${ic('right')}Next stage</button><span class="sp"></span><button class="btn sm danger ghost" data-jdel>${ic('trash')}Delete</button></div></div>
    <div id="jdp1" role="tabpanel" aria-labelledby="jdt1" hidden><div class="prog" style="margin:4px 0 12px"><i data-chkbar style="--w:${done(j)*10}%"></i></div><ul class="checks">${j.check.map((x,i)=>`<li><label><input type="checkbox" data-ck="${i}"${x.d?' checked':''}><span>${esc(x.t)}</span></label></li>`).join('')}</ul></div>
    <div id="jdp2" role="tabpanel" aria-labelledby="jdt2" hidden><div data-plan>${planSVG(j)}</div><div class="row" style="margin-top:8px"><label class="vh" for="jlay">Layout</label><select id="jlay" class="inp" style="width:auto">${LAYOUTS.map(l=>`<option${l===j.layout?' selected':''}>${l}</option>`).join('')}</select><button class="btn sm" data-replay>${ic('refresh')}Replay drawing</button></div></div>
    <div id="jdp3" role="tabpanel" aria-labelledby="jdt3" hidden><div data-files></div></div>
    <div id="jdp4" role="tabpanel" aria-labelledby="jdt4" hidden><div data-thread></div></div>`,
  onOpen(b,close){tabsBind(b);bindDetail(b,j,save);planTips(b);const chk=()=>{$('[data-chk]',b).textContent=done(j)+'/10';const bar=$('[data-chkbar]',b);bar&&bar.style.setProperty('--w',done(j)*10+'%')};chk();
    $('#jst',b).onchange=e=>{setStage(j,e.target.value);close();openJob(j.id)};
    $('#jlay',b).onchange=e=>{j.layout=e.target.value;save();$('[data-plan]',b).innerHTML=planSVG(j)};
    b.addEventListener('change',e=>{const k=e.target.dataset.ck;if(k!=null){j.check[+k].d=e.target.checked;save();chk();refresh();if(done(j)===10)toast(j.id+' checklist complete')}});
    b.addEventListener('click',e=>{if(e.target.closest('[data-replay]'))$('[data-plan]',b).innerHTML=planSVG(j);
      if(e.target.closest('[data-jedit]')){close();jobForm(j)}
      if(e.target.closest('[data-jgo]')){if(j.fit)UI.wk=Math.floor(diffD(j.fit,weekStart(0))/7);close();go('schedule')}
      if(e.target.closest('[data-jnext]')){const i=STAGES.findIndex(s=>s.id===j.stage);if(i<STAGES.length-1){setStage(j,STAGES[i+1].id);close();openJob(j.id)}else toast('This job is already complete','warn')}
      if(e.target.closest('[data-jdel]')){close();confirmBox(`Delete job ${j.id} for ${c.n}? Files and comments go with it.`).then(ok=>{if(ok){D.jobs=D.jobs.filter(x=>x!==j);save();refresh();toast(j.id+' deleted')}})}})}})}
function setStage(j,st){if(j.stage===st)return;const was=j.stage;j.stage=st;
  if(st==='booked'&&!j.fit){let d=addD(T0,2);if(d.getDay()===0)d=addD(d,1);j.fit=iso(d);toast(`${j.id} booked for ${fmtD(j.fit)}. Fine-tune it on the schedule.`)}
  if(st==='done'&&was!=='done'){j.check.forEach(c=>c.d=true);D.rev[11].inv+=j.value;D.settings.nDone&&note(`${j.id} is complete. Invoice ${money(j.value,1)}`,'check','jobs')}else note(`${j.id} moved to ${SG(st).l}`,'board','jobs');
  save();refresh()}
function jobForm(j,st){const isNew=!j;
  formModal({title:isNew?'New job':'Edit '+j.id,values:j||{cust:D.customers[0].id,type:'Full kitchen',layout:'L-shape',value:850000,fitter:'f1',fit:'',days:3,stage:st||'enq'},fields:[
    {k:'cust',label:'Customer',type:'select',opts:D.customers.map(c=>[c.id,c.n+' · '+c.area]),full:true},{k:'type',label:'Job type',type:'select',opts:TYPES.map(t=>t[0])},{k:'layout',label:'Layout',type:'select',opts:LAYOUTS},
    {k:'value',label:'Job value (Rs)',type:'number',req:true,min:1000,step:500},{k:'stage',label:'Stage',type:'select',opts:STAGES.map(s=>[s.id,s.l])},
    {k:'fitter',label:'Fitter',type:'select',opts:D.fitters.map(f=>[f.id,f.n])},{k:'fit',label:'Fit date',type:'date',check:(v,all)=>['booked','fitting'].includes(all.stage)&&!v?'Booked jobs need a fit date':v&&pd(v).getDay()===0?'We do not fit on Sundays':''},{k:'days',label:'Days on site',type:'number',req:true,min:1,max:10}],
    submit:isNew?'Create job':'Save changes',
    onSubmit(v){if(isNew){const id='HB-'+(D.jn++);D.jobs.unshift({id,...v,fit:v.fit||null,check:CHECK.map(t=>({t,d:false})),files:[],comments:[],created:iso(T0)});D.settings.nNew&&note(`New job ${id} for ${C(v.cust).n}`,'plus','jobs');toast('Job '+id+' created')}else{Object.assign(j,v,{fit:v.fit||null});toast(j.id+' saved')}save();refresh()}})}
/* ---------- Week planner helpers ---------- */
const weekStart=w=>{const d=addD(T0,-((T0.getDay()+6)%7)+w*7);return iso(d)};
function wkMenu(btn,j){const ws=weekStart(UI.wk);menu(btn,[{h:'Reschedule '+j.id},{l:'One day later',ic:'cr',fn:()=>{j.fit=iso(addD(j.fit||ws,pd(addD(j.fit||ws,1)).getDay()===0?2:1));save();refresh();toast(j.id+' moved to '+fmtD(j.fit))}},{l:'One day earlier',ic:'cl',fn:()=>{j.fit=iso(addD(j.fit||ws,pd(addD(j.fit||ws,-1)).getDay()===0?-2:-1));save();refresh();toast(j.id+' moved to '+fmtD(j.fit))}},
  ...D.fitters.filter(f=>f.id!==j.fitter).map(f=>({l:'Give to '+f.n,ic:'user',fn:()=>{j.fitter=f.id;if(!j.fit)j.fit=ws;save();refresh();toast(j.id+' assigned to '+f.n)}})),{l:'Unschedule',ic:'x',fn:()=>{j.fit=null;save();refresh();toast(j.id+' moved to the tray')}}])}
/* ---------- Pages ---------- */
APP.pages={
today:{t:'Today',sub:()=>`${WKD[(T0.getDay()+6)%7]}, ${fmtDY(T0)} · ${onSite(iso(T0)).length} crews on site`,r(el){
  const act=active(),mon=D.rev[11],today=onSite(iso(T0)),pipe=D.quotes.filter(q=>q.status==='Sent'),feat=D.jobs.filter(j=>['fitting','booked'].includes(j.stage)),j=feat[UI.planIdx%Math.max(1,feat.length)];
  el.innerHTML=`<div class="g g-4">${kpi('Active jobs',act.length,'n','board','var(--c1)',spark(Array.from({length:8},(_,w)=>sum(D.util.map(u=>u[w]))),'var(--c1)'))}${kpi('Fitting this week',D.jobs.filter(j=>j.fit&&diffD(j.fit,weekStart(0))>=0&&diffD(j.fit,weekStart(0))<7).length,'n','cal','var(--c2)',`<div class="delta up">${today.length} on site today</div>`)}${kpi('Quotes out',sum(pipe.map(qTotal)),'ms','invoice','var(--c5)',`<div class="delta mu">${pipe.length} waiting for a yes</div>`)}${kpi('Invoiced this month',mon.inv,'ms','coin','var(--c3)',spark(D.rev.map(r=>r.inv),'var(--c3)',110,34,'ms'))}</div>
  <div class="g g-21"><section class="card plan-card" aria-label="Featured job plan">${j?`<div data-plan>${planSVG(j)}</div><div class="pinfo"><span class="tag" style="--c:${SG(j.stage).c}">${SG(j.stage).l}</span><h4 style="margin-top:8px">${esc(C(j.cust).n)}</h4><p class="mu" style="margin:2px 0 0">${esc(j.id)} · ${esc(j.layout)} ${esc(j.type.toLowerCase())} · ${esc(C(j.cust).area)}</p><dl class="dl"><dt>Fitter</dt><dd>${esc(F(j.fitter).n)}</dd><dt>On site</dt><dd>${j.fit?fmtD(j.fit)+' · '+j.days+'d':'Not booked'}</dd><dt>Value</dt><dd><b>${money(j.value)}</b></dd></dl><div class="steps" aria-label="Checklist ${done(j)} of 10">${j.check.map((c,i)=>`<i class="${c.d?'on':''}" style="--d:${i}"></i>`).join('')}</div><div class="row"><button class="btn pri sm" data-open="${j.id}">${ic('eye')}Open job</button><button class="btn sm" data-nextplan>${ic('cr')}Next plan</button><button class="btn sm icon" data-replay aria-label="Replay drawing">${ic('refresh')}</button></div></div>`:'<div class="empty">'+ic('board')+'<p>No booked jobs yet.</p></div>'}</section>
  <section class="card"><div class="ch"><h3>On site today</h3><span class="sp"></span><button class="btn sm ghost" data-go="schedule">Week ${ic('right')}</button></div><ul class="list">${today.map(j=>`<li>${av(F(j.fitter).n)}<div class="ell" style="flex:1"><b>${esc(C(j.cust).n)}</b><br><small class="mu">${esc(j.id)} · ${esc(C(j.cust).area)} · day ${diffD(iso(T0),j.fit)+1} of ${j.days}</small></div><button class="btn sm" data-open="${j.id}">Open</button></li>`).join('')||'<li class="empty">'+ic('sun')+'<p>No crews on site today.</p></li>'}</ul>
  <div class="ch" style="margin-top:14px"><h3>Needs attention</h3></div><ul class="list">${[...D.stock.filter(s=>s.qty<s.min).slice(0,2).map(s=>`<li>${ic('box')}<span class="ell" style="flex:1">${esc(s.n)}: ${s.qty} left</span><button class="btn sm ghost" data-go="materials">Reorder</button></li>`),...D.jobs.filter(j=>j.stage==='booked'&&!j.fit).slice(0,2).map(j=>`<li>${ic('cal')}<span class="ell" style="flex:1">${esc(j.id)} has no fit date</span><button class="btn sm ghost" data-go="schedule">Plan</button></li>`)].join('')||'<li class="mu">All clear.</li>'}</ul></section></div>
  <div class="g g-21"><section class="card"><div class="ch"><h3>Invoiced and costs</h3><p>Rupees per month</p><span class="sp"></span><div class="seg" role="group" aria-label="Range">${[6,12].map(n=>`<button aria-pressed="${UI.rev===n}" data-rng="${n}">${n}M</button>`).join('')}</div></div><div class="chart" id="revC"></div></section>
  <section class="card"><div class="ch"><h3>Pipeline</h3><p>Open jobs by stage</p></div><div id="pipeC"></div></section></div>`;
  const drawRev=m=>{const r=D.rev.slice(-UI.rev);lineChart($('#revC',el),{labels:r.map(x=>x.m),series:[{n:'Invoiced',d:r.map(x=>x.inv),c:'var(--c1)'},{n:'Costs',d:r.map(x=>x.cost),c:'var(--c2)'}],fmt:v=>'Rs '+short(v),yw:58,h:230,morph:m})};drawRev(false);
  donut($('#pipeC',el),{items:STAGES.slice(0,6).map(s=>({n:s.l,v:D.jobs.filter(j=>j.stage===s.id).length,c:s.c})),label:'open jobs'});
  planTips(el);
  el.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o)openJob(o.dataset.open);if(e.target.closest('[data-nextplan]')){UI.planIdx++;refresh()}if(e.target.closest('[data-replay]')){const p=$('[data-plan]',el);p.innerHTML=planSVG(j)}
    const r=e.target.closest('[data-rng]');if(r){UI.rev=+r.dataset.rng;$$('[data-rng]',el).forEach(b=>b.setAttribute('aria-pressed',b===r));drawRev(true)}})}},
jobs:{t:'Jobs',sub:'Drag a card to move a job along. Touch: drag the grip, or use the ⋯ menu.',r(el){
  el.innerHTML=`<div class="row"><label class="search">${ic('search')}<span class="vh">Search jobs</span><input id="jq" type="search" placeholder="Search customer, area or job no." value="${esc(UI.jobs.q)}"></label><div class="chips" role="group" aria-label="Fitter">${['All',...D.fitters.map(f=>f.n.split(' ')[0])].map(n=>`<button class="chip" data-fit="${n}" aria-pressed="${UI.jobs.f===n}">${n}</button>`).join('')}</div><span class="sp"></span><button class="btn pri" data-newjob>${ic('plus')}New job</button></div><div id="board"></div>`;
  const draw=()=>{const q=UI.jobs.q.toLowerCase(),items=D.jobs.filter(j=>(UI.jobs.f==='All'||F(j.fitter).n.startsWith(UI.jobs.f))&&(!q||(j.id+' '+C(j.cust).n+' '+C(j.cust).area+' '+j.type).toLowerCase().includes(q)));
    kanban($('#board',el),{cols:STAGES,items,col:j=>j.stage,label:j=>j.id+', '+C(j.cust).n,sum:its=>money(sum(its.map(j=>j.value)),1),
      card:j=>`<div class="kc-top"><span class="kid">${j.id}</span><span class="tag plain" style="--c:var(--c4)">${esc(j.type)}</span></div><b class="kt">${esc(C(j.cust).n)}</b><small class="mu">${ic('pin')}${esc(C(j.cust).area)} · ${esc(j.layout)}</small><div class="kc-bot">${av(F(j.fitter).n,'sm')}<span>${j.fit?fmtD(j.fit):'No date'}</span><span class="sp"></span><b>${money(j.value,1)}</b></div><div class="prog" title="Checklist ${done(j)} of 10"><i style="--w:${done(j)*10}%;--c:${SG(j.stage).c}"></i></div>`,
      onOpen:openJob,onAdd:col=>jobForm(null,col),
      onMove:(id,col,before)=>{const j=J(id);D.jobs=D.jobs.filter(x=>x!==j);const bi=before?D.jobs.findIndex(x=>x.id===before):-1;if(bi<0)D.jobs.push(j);else D.jobs.splice(bi,0,j);if(j.stage!==col){setStage(j,col);toast(`${j.id} moved to ${SG(col).l}`)}else{save();refresh()}}})};
  draw();
  $('#jq',el).addEventListener('input',e=>{UI.jobs.q=e.target.value;draw()});
  el.addEventListener('click',e=>{const c=e.target.closest('[data-fit]');if(c){UI.jobs.f=c.dataset.fit;$$('[data-fit]',el).forEach(b=>b.setAttribute('aria-pressed',b===c));draw()}})}},
schedule:{t:'Schedule',sub:'Drag jobs between fitters and days. The tray holds booked jobs with no date.',r(el){
  const ws=weekStart(UI.wk),days=Array.from({length:6},(_,i)=>iso(addD(ws,i)));let n=0;
  const blocks=f=>D.jobs.filter(j=>j.fitter===f.id&&j.fit&&j.stage!=='enq').map(j=>{const s=diffD(j.fit,ws),e=s+j.days-1;if(e<0||s>5)return'';const a=Math.max(0,s),b=Math.min(5,e);return`<div class="wj" tabindex="0" data-id="${j.id}" style="grid-column:${a+1}/span ${b-a+1};--c:${SG(j.stage).c};--d:${n++}" aria-label="${j.id} ${esc(C(j.cust).n)}, ${fmtD(j.fit)}, ${j.days} days"><b>${esc(C(j.cust).n)}</b><span>${j.id} · ${esc(C(j.cust).area)}</span><button class="btn icon ghost sm" data-wkm="${j.id}" aria-label="Reschedule ${j.id}">${ic('more')}</button></div>`}).join('');
  const used=f=>{let c=0;D.jobs.forEach(j=>{if(j.fitter===f.id&&j.fit&&j.stage!=='enq')for(let k=0;k<j.days;k++){const x=diffD(addD(j.fit,k),ws);if(x>=0&&x<6)c++}});return Math.min(6,c)};
  const tray=D.jobs.filter(j=>j.stage==='booked'&&!j.fit);
  el.innerHTML=`<div class="row"><button class="btn icon sm" data-wk="-1" aria-label="Previous week">${ic('cl')}</button><h3 style="margin:0;font:700 19px var(--font-h)">${fmtD(days[0])} – ${fmtDY(days[5])}</h3><button class="btn icon sm" data-wk="1" aria-label="Next week">${ic('cr')}</button><button class="btn sm" data-wk="0">This week</button><span class="sp"></span><span class="mu">${D.fitters.length} crews · ${sum(D.fitters.map(used))} of ${D.fitters.length*6} crew-days booked</span></div>
  <div id="wkroot"><div class="wk"><div class="wkg"><div class="wkh">Crew</div>${days.map(d=>`<div class="wkh${d===iso(T0)?' td':''}">${wd(d)}<b>${pd(d).getDate()}</b></div>`).join('')}
  ${D.fitters.map(f=>`<div class="wf">${av(f.n)}<div class="ell"><b>${esc(f.n)}</b><small>${esc(f.role)} · ${used(f)}/6 days</small><div class="prog"><i style="--w:${used(f)/6*100}%"></i></div></div></div><div class="wrow"><div class="wcells">${days.map(d=>`<div class="wc${d===iso(T0)?' td':''}" data-f="${f.id}" data-day="${d}"></div>`).join('')}</div><div class="wblocks">${blocks(f)}</div></div>`).join('')}</div></div>
  <section class="card" style="margin-top:var(--gap)"><div class="ch"><h3>Tray</h3><p>Booked jobs waiting for a date. Drag one onto a crew and day.</p></div><div class="tray" data-tray>${tray.map(j=>`<div class="wj" tabindex="0" data-id="${j.id}" style="--c:${SG(j.stage).c}"><b>${esc(C(j.cust).n)}</b><span>${j.id} · ${j.days} day${j.days>1?'s':''}</span><button class="btn icon ghost sm" data-wkm="${j.id}" aria-label="Schedule ${j.id}">${ic('more')}</button></div>`).join('')||'<p class="mu" style="margin:6px">Nothing waiting. Drag a job here to unschedule it.</p>'}</div></section></div>`;
  const root=$('#wkroot',el);
  dnd(root,{item:'.wj',zone:'.wc,.tray',touchAny:true,onDrop:(id,z)=>{const j=J(id);if(z.dataset.tray!==undefined){if(!j.fit)return;j.fit=null;save();refresh();toast(j.id+' moved to the tray');return}j.fitter=z.dataset.f;j.fit=z.dataset.day;if(j.stage==='survey'||j.stage==='quote')j.stage='booked';save();refresh();toast(`${j.id} → ${F(j.fitter).n.split(' ')[0]}, ${wd(j.fit)} ${fmtD(j.fit)}`)}});
  el.addEventListener('click',e=>{const w=e.target.closest('[data-wk]');if(w){const v=+w.dataset.wk;UI.wk=v?UI.wk+v:0;refresh();return}const m=e.target.closest('[data-wkm]');if(m){wkMenu(m,J(m.dataset.wkm));return}const b=e.target.closest('.wj');if(b&&!justDropped())openJob(b.dataset.id)});
  el.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('.wj');if(b&&e.target===b&&e.key==='Enter')openJob(b.dataset.id)})}},
quotes:{t:'Quotes',sub:'Build a quote line by line. An accepted quote becomes a booked job.',r(el){

  el.innerHTML=`<div class="g g-4">${kpi('Waiting for reply',sum(sent.map(qTotal)),'ms','send','var(--c5)')}${kpi('Accepted',sum(acc.map(qTotal)),'ms','check','var(--c2)')}${kpi('Win rate',acc.length/Math.max(1,acc.length+dec.length)*100,'p','target','var(--c1)')}${kpi('Average quote',sum(D.quotes.map(qTotal))/Math.max(1,D.quotes.length),'ms','coin','var(--c3)')}</div><section class="card" id="qt"></section>`;

  el.addEventListener('click',e=>{if(e.target.closest('[data-newq]'))quoteModal(null);if(e.target.closest('[data-qexp]'))download('hobline-quotes.csv',csv([['Quote','Customer','Date','Status','Total'],...D.quotes.map(q=>[q.id,C(q.cust).n,q.date,q.status,qTotal(q)])]))})}},
customers:{t:'Customers',sub:'Everyone who asked, booked or bought.',r(el){
  const spend=c=>sum(D.jobs.filter(j=>j.cust===c.id&&j.stage==='done').map(j=>j.value)),cnt=c=>D.jobs.filter(j=>j.cust===c.id).length;
  el.innerHTML=`<section class="card" id="ct"></section>`;
  table($('#ct',el),{st:UI.cust,ph:'Search name, phone or area',size:10,sortK:'n',
    tools:`<button class="btn" data-cexp>${ic('download')}Export</button><button class="btn pri" data-newc>${ic('plus')}Add customer</button>`,rows:()=>D.customers,onRow:c=>custDrawer(c),
    cols:[{k:'n',l:'Name',r:c=>`<span class="row" style="flex-wrap:nowrap">${av(c.n)}<b>${esc(c.n)}</b></span>`},{k:'area',l:'Area'},{k:'ph',l:'Phone',r:c=>`<span class="tnum">${esc(c.ph)}</span>`},{k:'jobs',l:'Jobs',num:1,v:cnt,r:c=>cnt(c)},{k:'spend',l:'Spent',num:1,v:spend,r:c=>money(spend(c))},{k:'since',l:'Customer since',r:c=>fmtDY(c.since)}]});
  el.addEventListener('click',e=>{if(e.target.closest('[data-newc]'))custForm(null);if(e.target.closest('[data-cexp]'))download('hobline-customers.csv',csv([['Name','Area','Phone','Since'],...D.customers.map(c=>[c.n,c.area,c.ph,c.since])]))})}},
materials:{t:'Materials',sub:'Workshop stock. Items under their reorder level show in red.',r(el){
  const val=sum(D.stock.map(s=>s.qty*s.cost)),low=D.stock.filter(s=>s.qty<s.min),cats=[...new Set(D.stock.map(s=>s.cat))];
  el.innerHTML=`<div class="g g-4">${kpi('Stock value',val,'ms','box','var(--c1)')}${kpi('Below reorder level',low.length,'n','flag','var(--bad)')}${kpi('Orders on the way',D.orders.length,'n','truck','var(--c4)')}${kpi('Item lines',D.stock.length,'n','list','var(--c2)')}</div>
  <div class="g g-21"><section class="card" id="mt"></section><div class="g" style="align-content:start"><section class="card"><div class="ch"><h3>Value by category</h3></div><div class="chart" id="mc"></div></section><section class="card"><div class="ch"><h3>On the way</h3></div><ul class="list">${D.orders.map(o=>{const s=D.stock.find(x=>x.id===o.item)||{n:'Item'};return`<li>${ic('truck')}<div class="ell" style="flex:1"><b>${esc(s.n)}</b><br><small class="mu">${o.id} · ${o.qty} due ${fmtD(o.eta)}</small></div><button class="btn sm" data-recv="${o.id}">Receive</button></li>`}).join('')||'<li class="mu">No open orders.</li>'}</ul></section></div></div>`;
  table($('#mt',el),{st:UI.mat,ph:'Search stock',size:9,chips:{opts:['Low stock',...cats],test:(s,c)=>c==='Low stock'?s.qty<s.min:s.cat===c},rows:()=>D.stock,
    cols:[{k:'n',l:'Item',r:s=>`<b>${esc(s.n)}</b><br><small class="mu">${esc(s.cat)}</small>`},{k:'qty',l:'In stock',num:1,r:s=>`<span class="stockq" style="justify-content:flex-end"><span class="prog"><i style="--w:${Math.min(100,s.qty/(s.min*2.5)*100)}%;--c:${s.qty<s.min?'var(--bad)':'var(--c2)'}"></i></span><b style="color:${s.qty<s.min?'var(--bad)':'inherit'}">${s.qty}</b></span>`},{k:'min',l:'Reorder at',num:1},{k:'cost',l:'Unit cost',num:1,r:s=>money(s.cost)},{k:'act',l:'Adjust',sort:false,r:s=>`<span class="row" style="flex-wrap:nowrap;gap:4px"><button class="btn icon sm" data-act="dec" aria-label="Use one ${esc(s.n)}">−</button><button class="btn icon sm" data-act="inc" aria-label="Add one ${esc(s.n)}">+</button><button class="btn sm" data-act="order">Order</button></span>`}],
    act:(a,s)=>{if(a==='dec'){if(s.qty<1){toast('None left to use','warn');return}s.qty--;if(s.qty===s.min-1)note(s.n+' is below reorder level','box','materials')}if(a==='inc')s.qty++;if(a==='order'){orderForm(s);return}save();refresh()}});
  barChart($('#mc',el),{labels:cats,series:[{n:'Value',d:cats.map(c=>sum(D.stock.filter(s=>s.cat===c).map(s=>s.qty*s.cost))),c:'var(--c1)'}],fmt:v=>'Rs '+short(v),yw:56,h:200});
  el.addEventListener('click',e=>{const r=e.target.closest('[data-recv]');if(r){const o=D.orders.find(x=>x.id===r.dataset.recv),s=D.stock.find(x=>x.id===o.item);s.qty+=o.qty;D.orders=D.orders.filter(x=>x!==o);save();refresh();toast(`Received ${o.qty} × ${s.n}`)}})}},
reports:{t:'Reports',sub:'How the workshop is doing.',r(el){
  const r=D.rev.slice(-UI.rep),inv=sum(r.map(x=>x.inv)),cost=sum(r.map(x=>x.cost)),dn=D.jobs.filter(j=>j.stage==='done');
  el.innerHTML=`<div class="row"><div class="seg" role="group" aria-label="Range">${[3,6,12].map(n=>`<button data-rr="${n}" aria-pressed="${UI.rep===n}">${n} months</button>`).join('')}</div><span class="sp"></span><button class="btn" data-rexp>${ic('download')}Export</button></div>
  <div class="g g-4">${kpi('Invoiced',inv,'ms','coin','var(--c1)')}${kpi('Gross margin',(inv-cost)/Math.max(1,inv)*100,'p','chart','var(--c2)')}${kpi('Jobs completed',dn.length,'n','check','var(--ok)')}${kpi('Average job',sum(dn.map(j=>j.value))/Math.max(1,dn.length),'ms','target','var(--c3)')}</div>
  <div class="g g-21"><section class="card"><div class="ch"><h3>Quoted vs invoiced</h3></div><div class="chart" id="rq"></div></section><section class="card"><div class="ch"><h3>Work by type</h3></div><div id="rt"></div></section></div>
  <div class="g g-2"><section class="card"><div class="ch"><h3>Average days in each stage</h3></div><div class="chart" id="rs"></div></section><section class="card"><div class="ch"><h3>Crew days booked</h3><p>Last 8 weeks</p></div><div class="chart" id="rh"></div></section></div>`;
  barChart($('#rq',el),{labels:r.map(x=>x.m),series:[{n:'Quoted',d:r.map(x=>x.q),c:'var(--c5)'},{n:'Invoiced',d:r.map(x=>x.inv),c:'var(--c1)'}],fmt:v=>'Rs '+short(v),yw:58});
  donut($('#rt',el),{items:TYPES.map((t,i)=>({n:t[0],v:sum(D.jobs.filter(j=>j.type===t[0]).map(j=>j.value)),c:`var(--c${i+1})`})),fmt:v=>money(v,1),label:'all jobs'});
  barChart($('#rs',el),{labels:STAGES.slice(0,6).map(s=>s.l),series:[{n:'Days',d:D.stageDays,c:'var(--c2)'}],fmt:v=>v+'d',h:200});
  heat($('#rh',el),{rows:D.fitters.map(f=>f.n.split(' ')[0]),cols:Array.from({length:8},(_,i)=>'W'+(i+1)),v:(r,c)=>D.util[r][c],fmt:v=>v+' of 6 days',c:'var(--c1)',ch:24});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-rr]');if(b){UI.rep=+b.dataset.rr;refresh()}if(e.target.closest('[data-rexp]'))download('hobline-revenue.csv',csv([['Month','Quoted','Invoiced','Costs'],...D.rev.map(x=>[x.m,x.q,x.inv,x.cost])]))})}},
settings:{t:'Settings',sub:'Business details, preferences and demo data.',r(el){const s=D.settings,th=document.documentElement.dataset.theme;
  el.innerHTML=`<div class="g g-2"><section class="card"><div class="ch"><h3>Business</h3></div><form class="form" id="sf" novalidate>${fieldHTML({k:'biz',label:'Business name',req:1,full:1},s.biz)}${fieldHTML({k:'phone',label:'Phone'},s.phone)}${fieldHTML({k:'city',label:'City'},s.city)}${fieldHTML({k:'tax',label:'Default tax %',type:'number',min:0,max:30},s.tax)}<div class="field full"><button class="btn pri" type="submit" style="justify-self:start">Save details</button></div></form></section>
  <section class="card"><div class="ch"><h3>Preferences</h3></div><ul class="list"><li><label class="switch"><input type="checkbox" data-set="sat"${s.sat?' checked':''}><i></i>We fit on Saturdays</label></li><li><label class="switch"><input type="checkbox" data-set="nNew"${s.nNew?' checked':''}><i></i>Notify me about new jobs</label></li><li><label class="switch"><input type="checkbox" data-set="nDone"${s.nDone?' checked':''}><i></i>Notify me when a job completes</label></li><li><span style="flex:1">Theme</span><div class="seg" role="group" aria-label="Theme"><button data-th="light" aria-pressed="${th==='light'}">Light</button><button data-th="dark" aria-pressed="${th==='dark'}">Dark</button></div></li></ul>
  <div class="ch" style="margin-top:18px"><h3>Crew</h3></div><ul class="list">${D.fitters.map(f=>`<li>${av(f.n)}<span style="flex:1"><b>${esc(f.n)}</b><br><small class="mu">${esc(f.role)}</small></span><button class="btn sm ghost" data-fed="${f.id}">${ic('edit')}Edit</button></li>`).join('')}</ul>
  <div class="ch" style="margin-top:18px"><h3>Demo data</h3></div><p class="mu" style="margin:0 0 10px">Changes are kept in this browser. Reset to start again with the sample workshop.</p><button class="btn danger" data-reset>${ic('refresh')}Reset demo data</button></section></div>`;
  $('#sf',el).addEventListener('submit',e=>{e.preventDefault();const f=e.target,x=f.elements,v={biz:x.biz.value.trim(),phone:x.phone.value.trim(),city:x.city.value.trim(),tax:x.tax.value};const bad=(k,m)=>{const fl=$(`.field[data-k="${k}"]`,f);fl.classList.toggle('bad',!!m);$('.err',fl).textContent=m||''};bad('biz',v.biz?'':'Enter your business name');const t=+v.tax;bad('tax',v.tax===''||isNaN(t)||t<0||t>30?'Enter 0 to 30':'');if(!v.biz||v.tax===''||isNaN(t)||t<0||t>30)return;Object.assign(s,v,{tax:t});save();toast('Business details saved')});
  el.addEventListener('change',e=>{const k=e.target.dataset.set;if(k){s[k]=e.target.checked;save();toast('Preference saved')}});
  el.addEventListener('click',e=>{const t=e.target.closest('[data-th]');if(t)setTheme(t.dataset.th,1);if(e.target.closest('[data-reset]'))resetDemo();const fe=e.target.closest('[data-fed]');if(fe){const f=F(fe.dataset.fed);formModal({title:'Edit '+f.n,values:f,fields:[{k:'n',label:'Name',req:1,full:1},{k:'role',label:'Role',type:'select',opts:['Lead fitter','Fitter','Joiner','Electrician','Plumber']}],onSubmit(v){Object.assign(f,v);save();refresh();toast('Crew member saved')}})}})}}};
/* ---------- Quote builder with live totals ---------- */
function quoteModal(q){const isNew=!q,w=q?JSON.parse(JSON.stringify(q)):{id:'Q-'+D.qn,cust:D.customers[0].id,date:iso(T0),status:'Draft',items:[{n:CAT[0][0],q:4,p:CAT[0][1]},{n:CAT[3][0],q:3,p:CAT[3][1]},{n:CAT[10][0],q:2,p:CAT[10][1]}],tax:D.settings.tax};
  modal({title:isNew?'New quote':'Quote '+w.id+' · '+w.status,wide:true,body:`<div class="form"><div class="field"><label for="qc">Customer</label><select id="qc">${D.customers.map(c=>`<option value="${c.id}"${c.id===w.cust?' selected':''}>${esc(c.n)} · ${esc(c.area)}</option>`).join('')}</select></div><div class="field"><label for="qtx">Tax %</label><input id="qtx" type="number" min="0" max="30" value="${w.tax}"><small class="err" id="qtxe"></small></div></div><div class="tscroll" style="margin-top:14px"><table class="tbl qlines"><thead><tr><th>Item</th><th>Qty</th><th class="num">Rate</th><th class="num">Amount</th><th><span class="vh">Remove</span></th></tr></thead><tbody></tbody></table></div><div class="row" style="margin-top:8px"><button class="btn sm" data-ladd type="button">${ic('plus')}Add line</button><small class="err" id="qle"></small></div><div class="qtot" aria-live="polite"></div>`,
    foot:`${!isNew?`<button class="btn danger ghost" data-qdel>${ic('trash')}Delete</button>`:''}<span class="sp"></span>${!isNew&&w.status!=='Accepted'?`<button class="btn" data-qacc>${ic('check')}Mark accepted</button>`:''}<button class="btn ghost" data-qsave="Draft">Save draft</button><button class="btn pri" data-qsave="Sent">${ic('send')}${w.status==='Sent'?'Resend':'Send'} quote</button>`,
    onOpen(b,close){const tb=$('.qlines tbody',b),tot=$('.qtot',b);
      const totals=()=>{const sub=sum(w.items.map(i=>(+i.q||0)*i.p)),tx=Math.round(sub*(+w.tax||0)/100);tot.innerHTML=`<span>Subtotal</span><b>${money(sub)}</b><span>Tax ${+w.tax||0}%</span><b>${money(tx)}</b><span>Total</span><b class="gt">${money(sub+tx)}</b>`;$$('tr[data-li]',tb).forEach((tr,i)=>{tr.cells[3].innerHTML=`<b>${money((+w.items[i].q||0)*w.items[i].p)}</b>`})};
      const paint=()=>{tb.innerHTML=w.items.map((it,i)=>`<tr data-li="${i}"><td><label class="vh" for="ql${i}">Item</label><select id="ql${i}" class="inp" data-lf="n">${CAT.map(c=>`<option${c[0]===it.n?' selected':''}>${esc(c[0])}</option>`).join('')}</select></td><td><label class="vh" for="qq${i}">Quantity</label><input id="qq${i}" class="inp" data-lf="q" type="number" min="1" value="${it.q}" style="width:76px"></td><td class="num">${money(it.p)}</td><td class="num"></td><td><button class="btn icon ghost sm" type="button" data-ldel="${i}" aria-label="Remove line ${i+1}">${ic('x')}</button></td></tr>`).join('');totals()};paint();
      b.addEventListener('input',e=>{const tr=e.target.closest('tr[data-li]');if(tr&&e.target.dataset.lf==='q'){w.items[+tr.dataset.li].q=e.target.value===''?'':+e.target.value;totals()}if(e.target.id==='qtx'){w.tax=e.target.value;totals()}});
      b.addEventListener('change',e=>{const tr=e.target.closest('tr[data-li]');if(tr&&e.target.dataset.lf==='n'){const c=CAT.find(x=>x[0]===e.target.value);Object.assign(w.items[+tr.dataset.li],{n:c[0],p:c[1]});paint()}if(e.target.id==='qc')w.cust=e.target.value});
      b.addEventListener('click',e=>{if(e.target.closest('[data-ladd]')){w.items.push({n:CAT[1][0],q:1,p:CAT[1][1]});paint();$('#ql'+(w.items.length-1),b).focus()}const d=e.target.closest('[data-ldel]');if(d){w.items.splice(+d.dataset.ldel,1);paint()}
        const sv=e.target.closest('[data-qsave]'),acc=e.target.closest('[data-qacc]');
        if(sv||acc){const le=$('#qle',b),te=$('#qtxe',b),badQ=w.items.some(i=>!(i.q>=1)),t=+w.tax;le.textContent=!w.items.length?'Add at least one line':badQ?'Each line needs a quantity of 1 or more':'';te.textContent=w.tax===''||isNaN(t)||t<0||t>30?'Enter 0 to 30':'';if(le.textContent||te.textContent)return;
          w.tax=t;w.status=acc?'Accepted':sv.dataset.qsave;if(isNew){D.quotes.unshift(w);D.qn++}else Object.assign(q,w);
          if(w.status==='Accepted'){const id='HB-'+(D.jn++),c=C(w.cust);D.jobs.unshift({id,cust:w.cust,type:'Full kitchen',layout:'L-shape',value:qTotal(w),fitter:'f1',fit:null,days:3,stage:'booked',check:CHECK.map((t,i)=>({t,d:i<3})),files:[],comments:[],created:iso(T0)});note(`${w.id} accepted. Job ${id} booked for ${c.n}`,'check','schedule');toast(`Accepted. ${id} is in the schedule tray`)}else toast(w.status==='Sent'?`Quote ${w.id} sent to ${C(w.cust).n}`:'Draft saved');
          save();close();refresh()}
        if(e.target.closest('[data-qdel]')){close();confirmBox(`Delete quote ${q.id}?`).then(ok=>{if(ok){D.quotes=D.quotes.filter(x=>x!==q);save();refresh();toast('Quote deleted')}})}})}})}
/* ---------- Customers: drawer and form ---------- */
function custDrawer(c){const js=D.jobs.filter(j=>j.cust===c.id);
  drawer({title:c.n,body:`<div class="row" style="margin-bottom:14px">${av(c.n,'lg')}<div><b style="font:700 18px var(--font-h)">${esc(c.n)}</b><br><span class="mu">${esc(c.area)}, ${esc(D.settings.city)}</span></div></div><dl class="dl"><dt>Phone</dt><dd class="tnum">${esc(c.ph)}</dd><dt>Since</dt><dd>${fmtDY(c.since)}</dd><dt>Total spent</dt><dd><b>${money(sum(js.filter(j=>j.stage==='done').map(j=>j.value)))}</b></dd></dl><div class="ch"><h3>Jobs</h3></div><ul class="list">${js.map(j=>`<li><span class="tag" style="--c:${SG(j.stage).c}">${SG(j.stage).l}</span><span class="ell" style="flex:1">${j.id} · ${esc(j.type)}</span><b>${money(j.value,1)}</b><button class="btn sm" data-oj="${j.id}">Open</button></li>`).join('')||'<li class="mu">No jobs yet.</li>'}</ul>`,
    foot:`<button class="btn danger ghost" data-cdel>${ic('trash')}Delete</button><span class="sp"></span><button class="btn" data-ced>${ic('edit')}Edit</button><button class="btn pri" data-cjob>${ic('plus')}New job</button>`,
    onOpen(b,close){b.addEventListener('click',e=>{const o=e.target.closest('[data-oj]');if(o){close();openJob(o.dataset.oj)}if(e.target.closest('[data-ced]')){close();custForm(c)}if(e.target.closest('[data-cjob]')){close();jobForm(null);setTimeout(()=>{const s=$('.layer:last-child select[name=cust]');if(s)s.value=c.id},20)}
      if(e.target.closest('[data-cdel]')){close();if(js.length){toast(`${c.n} has ${js.length} job${js.length>1?'s':''}. Delete those first.`,'warn');return}confirmBox(`Delete ${c.n}?`).then(ok=>{if(ok){D.customers=D.customers.filter(x=>x!==c);save();refresh();toast('Customer deleted')}})}})}})}
function custForm(c){formModal({title:c?'Edit customer':'Add customer',values:c||{area:AREAS[0]},fields:[{k:'n',label:'Full name',req:1,full:1},{k:'ph',label:'Phone',req:1,ph:'0300-1234567',check:v=>/^0\d{3}-?\d{7}$/.test(v)?'':'Use the format 0300-1234567'},{k:'area',label:'Area',type:'select',opts:AREAS}],submit:c?'Save':'Add customer',onSubmit(v){if(c)Object.assign(c,v);else D.customers.unshift({id:'c'+uid(),...v,since:iso(T0)});save();refresh();toast(c?'Customer saved':v.n+' added')}})}
function orderForm(s){formModal({title:'Order '+s.n,values:{qty:Math.max(1,s.min*2-s.qty),eta:dIso(3)},fields:[{k:'qty',label:'Quantity',type:'number',req:1,min:1,max:999},{k:'eta',label:'Expected',type:'date',req:1}],submit:'Place order',onSubmit(v){D.orders.push({id:'PO-'+ri(89,999),item:s.id,qty:v.qty,eta:v.eta});save();refresh();toast(`Ordered ${v.qty} × ${s.n}`)}})}
/* ---------- Commands, sidebar footer and start ---------- */
APP.cmds=()=>[{l:'New job',ic:'plus',fn:()=>jobForm(null)},{l:'New quote',ic:'invoice',fn:()=>quoteModal(null)},{l:'Add customer',ic:'user',fn:()=>custForm(null)},...D.jobs.slice(0,12).map(j=>({l:'Open '+j.id+' · '+C(j.cust).n,ic:'board',fn:()=>openJob(j.id)}))];
APP.sideFoot=()=>{const t=onSite(iso(T0));return`<div class="crew"><b>On site today</b><div class="avs">${t.map(j=>av(F(j.fitter).n,'sm')).join('')||'<span>No crews out</span>'}</div><p style="margin:8px 0 0">${t.length} job${t.length===1?'':'s'} · workshop open 9 to 6</p><button class="btn sm" data-newjob>${ic('plus')}New job</button></div>`};
APP.init=()=>document.addEventListener('click',e=>{if(e.target.closest('[data-newjob]'))jobForm(null)});
boot();
</script>
