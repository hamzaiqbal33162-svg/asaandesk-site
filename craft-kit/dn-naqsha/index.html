<!doctype html>
<!-- Chill & Craft · Naqsha · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naqsha · Housing society plots and instalments</title>
<style>
/* ===== Shared base: reset, overlays, forms, tables, charts (themed by the variables below) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* page entrance: each app picks --enter-anim */
.enter{animation:var(--enter-anim,rise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px)}}
@keyframes blurin{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.row-in{animation:fadein .4s ease both;animation-delay:calc(var(--i,0) * 28ms)}

/* buttons press in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm,10px);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;background:var(--surface2);color:var(--text);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .35s}

/* chips and segmented control */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent,#fff)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .4s cubic-bezier(.3,1.3,.5,1),width .4s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:800;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 50% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 82%)}

/* tooltip, toasts, popovers */
#tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tip-bg,#111827);color:var(--tip-ink,#f9fafb);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:240px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#toasts{position:fixed;z-index:130;right:16px;bottom:16px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#111827);color:var(--tip-ink,#fff);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastin .45s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{color:var(--good)}
.toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--warn)}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.pop{position:fixed;z-index:110;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm,12px);box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;animation:pop .2s ease-out}
.pop [role="menuitem"]{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pop [role="menuitem"]:hover,.pop [role="menuitem"]:focus{background:var(--surface2);outline:none}
.pop-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{display:grid;gap:2px;padding:9px 10px 9px 22px;border-radius:8px;text-decoration:none;position:relative}
.note:hover{background:var(--surface2)}
.note.unread::before{content:"";position:absolute;left:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* modal and drawer */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.backdrop.side{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r,16px);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:modalin .38s cubic-bezier(.2,1.1,.3,1)}
.modal.wide{max-width:760px}
.modal.drawer{max-width:min(500px,100vw);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);animation:drawerin .4s cubic-bezier(.2,.9,.2,1)}
.backdrop.out{animation:fadein .22s reverse forwards}
.backdrop.out .modal{animation:modalin .22s reverse forwards}
.backdrop.out .drawer{animation:drawerin .25s reverse forwards}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes drawerin{from{transform:translateX(100%)}}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px}
.m-x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.m-body{padding:18px}
.m-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--surface);border-top:1px solid var(--line)}

/* forms with inline errors */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:10px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);animation:shake .35s}
.field .hint{color:var(--muted);font-size:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* data tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-search input{width:min(260px,100%);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tbl-search{flex:1 1 180px;max-width:280px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover,.tbl tr.click:focus{background:var(--surface2);outline:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sort-ic{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.3;transition:transform .2s}
th[aria-sort] .sort-ic{opacity:1}
th[aria-sort="ascending"] .sort-ic{transform:rotate(180deg) translateY(4px)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.pager button[disabled]{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.6,.1,.2,1) forwards}
.chart .fade{animation:fadein 1s .35s both}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hover{transition:opacity .15s;pointer-events:none}
.chart .hover circle{stroke:var(--surface);stroke-width:2.5}
.chart .grow{animation:grow .75s cubic-bezier(.2,.9,.3,1.15) both}
.chart .bcol{transition:opacity .2s}
.chart.hovering .bcol{opacity:.45}
.chart.hovering .bcol.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut{position:relative;flex:none}
.donut svg{overflow:visible}
.donut .seg-c{fill:none;transition:stroke-width .2s}
.donut .seg-c:hover{stroke-width:calc(var(--sw) * 1.25)}
.donut .sweep{animation:sweep .9s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 var(--C)}}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1 1 140px;min-width:0}
.lg li{display:flex;align-items:center;gap:4px}
.lg b{margin-left:auto;padding-left:10px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-f{display:block;height:100%;border-radius:999px;transform-origin:left}
.hb-f.growx{animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.ring-v{animation:ringin 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringin{from{stroke-dasharray:0 1}}
.gauge .g-v{animation:ringin 1.3s cubic-bezier(.3,.9,.3,1) both}
.hm{display:grid;gap:3px}
.hm-c{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0;animation:pop .4s both}
.spark{height:38px}

/* drag and drop */
.dragging{opacity:.35}
.ghost{position:fixed;z-index:140;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.3);opacity:.95;transition:none!important;animation:none!important}
.drop-hot{outline:2px dashed var(--accent);outline-offset:3px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* command search */
.cmdk .m-body{padding:12px}
.cmdk-in{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto}
.cmdk-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk-list li[aria-selected="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.cmdk-list li small{opacity:.7}
.cmdk-k{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* mobile nav drawer (sidebar apps) */
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.menu-btn{display:none!important}
@media (max-width:860px){
  .menu-btn{display:inline-grid!important}
  .side{position:fixed!important;z-index:60;top:0;bottom:0;left:0;width:min(280px,84vw)!important;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* theme switch reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,0))}}

/* print only the chosen area */
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}body.printing #print-root{display:block}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Naqsha look: blueprint paper, ink lines, drafting numbers, bracket marker ===== */
:root{--mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;--bg:#eaf1fa;--surface:#f8fbff;--surface2:#e3ecf7;--text:#0d2240;--muted:#56688a;--line:#c5d5ea;--grid:rgba(29,78,216,.08);--accent:#1d4ed8;--on-accent:#fff;--good:#0f9d74;--warn:#d98a06;--bad:#d63a3a;--c1:#1d4ed8;--c2:#0f9d74;--c3:#d63a3a;--c4:#d98a06;--c5:#7c8db0;--avail:#ffffff;--r:4px;--r-sm:4px;--tip-bg:#0d2240;--enter-anim:pop}
[data-theme="dark"]{--bg:#0a1c36;--surface:#0e2545;--surface2:#13305a;--text:#e6f0ff;--muted:#8fa9cf;--line:#2a4c7c;--grid:rgba(160,200,255,.07);--accent:#7cc4ff;--on-accent:#06172e;--good:#3ee0a8;--warn:#ffc35a;--bad:#ff7b7b;--c1:#7cc4ff;--c2:#3ee0a8;--c3:#ff7b7b;--c4:#ffc35a;--c5:#7f95b8;--avail:#13305a;--tip-bg:#020b18}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--grid) 50%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--grid) 50%,transparent) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.mono,.num{font-family:var(--mono)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* drafting sidebar with a bracket marker */
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent)}
.brand{display:grid;gap:4px;text-decoration:none;color:inherit}
.brand b{font-size:22px;font-weight:800;letter-spacing:.3em;text-transform:uppercase}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav{position:relative;display:grid;gap:2px;counter-reset:n}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;transition:color .2s}
.nav a::before{counter-increment:n;content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:11px;opacity:.7}
.nav a:hover,.nav a[aria-current="page"]{color:var(--text)}
.nav-marker{position:absolute;left:0;right:0;top:0;pointer-events:none;transition:transform .45s cubic-bezier(.5,1.6,.4,1),height .3s;z-index:0}
.nav-marker::before,.nav-marker::after{content:"";position:absolute;top:0;bottom:0;width:10px;border:2px solid var(--accent)}
.nav-marker::before{left:0;border-right:0}
.nav-marker::after{right:0;border-left:0}
.scale{margin-top:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.scale i{display:block;height:6px;margin:4px 0;background:repeating-linear-gradient(90deg,var(--text) 0 20px,transparent 20px 40px);border:1px solid var(--text)}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);position:sticky;top:0;z-index:30;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top-t{flex:1;min-width:0}
.top-t h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border-radius:2px}
#view{padding:20px 24px 32px;flex:1}
/* outlined drafting cards */
.card{position:relative;background:var(--surface);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:3px;border-radius:var(--r);padding:18px;transition:transform .25s,outline-color .25s,outline-offset .25s;min-width:0}
.card:hover{transform:translateY(-2px);outline-color:var(--accent);outline-offset:5px}
.btn{border-radius:2px;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.btn.wa{background:#1f9d55;color:#fff}
.chip,.seg,.seg button,.seg .thumb{border-radius:2px}
.h2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.h2 h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.6fr}
.g2{grid-template-columns:1fr 1fr}
.mt{margin-top:18px}
.kpi .k-l{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .k-v{font-family:var(--mono);font-size:26px;font-weight:700;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi .dim{position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--accent)}
/* plot map (signature) */
.mapwrap{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface2);touch-action:none;cursor:grab;border-radius:2px}
.mapwrap.panning{cursor:grabbing}
.mapwrap svg{display:block;width:100%;height:auto;min-height:280px}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px;z-index:2}
.zoom .icon-btn{width:34px;height:34px;background:var(--surface)}
.road{fill:color-mix(in srgb,var(--muted) 18%,var(--surface2))}
.road-l{fill:none;stroke:var(--surface);stroke-width:1.5;stroke-dasharray:10 8}
.blk{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,.1,.3,1) forwards}
.plot{stroke:color-mix(in srgb,var(--accent) 55%,transparent);stroke-width:1;cursor:pointer;transition:fill .3s,stroke-width .15s;animation:plotin .5s both}
.plot:hover,.plot:focus{stroke:var(--text);stroke-width:2.5;outline:none}
.plot.dim{opacity:.18}
.plot.sel{stroke:var(--text);stroke-width:3}
@keyframes plotin{from{opacity:0}}
.ptxt{font-family:var(--mono);font-size:8px;fill:var(--text);pointer-events:none;opacity:.75}
.zone{fill:color-mix(in srgb,var(--good) 18%,var(--surface2));stroke:var(--good);stroke-width:1}
.zlbl{font-family:var(--mono);font-size:11px;fill:var(--text);font-weight:700;letter-spacing:.12em;pointer-events:none}
.blbl{font-family:var(--mono);font-size:13px;font-weight:800;fill:var(--accent);letter-spacing:.2em}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lg i{display:inline-block;width:14px;height:10px;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:600}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{position:relative;padding:0 0 14px 22px;font-size:13.5px;border-left:2px dashed var(--line);margin-left:6px}
.hist li::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;background:var(--surface);border:2px solid var(--accent);transform:rotate(45deg)}
.hist li:last-child{border-left-color:transparent}
.hist small{display:block;color:var(--muted)}
.tbl tr.over td{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.tbl tr.paid td{color:var(--muted)}
.plan{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rcpt{font-family:Georgia,serif;color:#111;background:#fff;border:2px solid #1d4ed8;padding:18px;max-width:560px}
.rcpt h2{margin:0;text-align:center;letter-spacing:.1em}
.rcpt .w{font-style:italic;border-bottom:1px dotted #555;padding:4px 0}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{background:var(--surface)}.top{padding:12px 14px}#view{padding:14px}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:12px}.kpi .k-v{font-size:19px}.kpi .dim{display:none}.top-t h1{font-size:16px}.card{padding:14px;outline-offset:2px}}
</style>
</head>

<script>
'use strict';
/* ===== Mini core: helpers, data seeding, router, theme, overlays, tables, charts, drag and drop ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10;
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
let RM=!!RMQ.matches;try{RMQ.addEventListener('change',e=>{RM=e.matches})}catch(e){}

/* --- seeded random so the demo data is the same on every load --- */
let R=Math.random;
function seedRng(s){let a=s>>>0;R=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],chance=p=>R()<p;
let _n=0;const uid=p=>(p||'')+(Date.now()%1e8).toString(36)+(++_n).toString(36);

/* --- Pakistani names, cities and phone numbers for demo data --- */
const PK={m:['Ahmed','Bilal','Usman','Hamza','Ali','Hassan','Imran','Faisal','Kashif','Zubair','Saad','Waqas','Adnan','Junaid','Rizwan','Tariq','Asad','Fahad','Shahid','Naveed','Arslan','Danish','Haris','Owais','Salman','Yasir','Nadeem','Sohail'],
f:['Ayesha','Fatima','Sana','Hira','Maryam','Zainab','Amna','Rabia','Nida','Iqra','Saima','Mehwish','Komal','Sadia','Bushra','Farah','Anum','Kiran','Laiba','Areeba','Samina','Noreen'],
l:['Khan','Malik','Butt','Sheikh','Qureshi','Chaudhry','Siddiqui','Raza','Iqbal','Abbasi','Mirza','Hashmi','Javed','Aslam','Rana','Awan','Baig','Ansari','Gill','Bhatti','Mughal','Niazi'],
cities:['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta','Sialkot','Gujranwala','Hyderabad','Bahawalpur','Sargodha','Abbottabad','Sukkur']};
const pname=g=>pick(g==='f'?PK.f:g==='m'?PK.m:(chance(.5)?PK.m:PK.f))+' '+pick(PK.l);
const phone=()=>'03'+rnd(0,4)+rnd(0,9)+'-'+String(rnd(1000000,9999999));

/* --- number and money formats (PKR) --- */
const NF=new Intl.NumberFormat('en-US');
const num=n=>NF.format(Math.round(+n||0));
const rs=n=>((+n||0)<0?'-':'')+'Rs '+NF.format(Math.abs(Math.round(+n||0)));
function short(n){n=+n||0;const a=Math.abs(n),s=n<0?'-':'',f=(v,u)=>s+(v>=100?Math.round(v):+v.toFixed(1))+u;return a>=1e9?f(a/1e9,'B'):a>=1e6?f(a/1e6,'M'):a>=1e3?f(a/1e3,'K'):s+Math.round(a)}
const rsk=n=>'Rs '+short(n);
const pct=(n,d=0)=>(+n||0).toFixed(d)+'%';
const FMT={num,rs,short,rsk,pct:v=>pct(v),pct1:v=>pct(v,1)};

/* --- dates (local, day precision) --- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addM=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};
const today=iso(TODAY);
const dd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
const ddy=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const daysAgo=s=>Math.round((TODAY-pd(s))/864e5);
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mlabel=k=>{const p=k.split('-');return MON[+p[1]-1]+' '+p[0].slice(2)};

/* --- storage that never throws (works when storage is blocked) --- */
const store={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* --- icons (our own simple strokes) --- */
const ICO={home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',cart:'<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',chart:'M4 20V11M10 20V5M16 20v-6M2 20h20',gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a5.5 5.5 0 0 1 3.5 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'M12 5v14M5 12h14',minus:'M5 12h14',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',menu:'M4 7h16M4 12h16M4 17h16',x:'M6 6l12 12M18 6L6 18',check:'M5 12.5l4.5 4.5L19 7',phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',truck:'<path d="M2 6h11v10H2zM13 9h4.5l3 3.5V16H13"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',file:'M6 2.5h8l4.5 4.5v14.5H6zM14 2.5V7h4.5M9 12h6M9 16h6',receipt:'M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21zM9 8h6M9 12h6M9 16h3',wrench:'M15 4a5 5 0 0 0-4.6 6.9L4 17.3V20h2.7l6.4-6.4A5 5 0 0 0 20 9l-3 3-3-1-1-3 3-3z',trophy:'M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.6 4M16 6h3.5a3.5 3.5 0 0 1-3.6 4M12 13v4M8.5 21h7M9.5 17h5v4h-5z',edit:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',print:'M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z',chat:'M4 20l1.3-3.9A8 8 0 1 1 8 19zM9 10h.01M12 10h.01M15 10h.01',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',arrow:'M5 12h14M13 6l6 6-6 6',filter:'M4 5h16l-6 7v6l-4 2v-8z',refresh:'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',alert:'M12 3l10 18H2zM12 10v5M12 18h.01',shop:'M3 9l2-5h14l2 5M4 9v11h16V9M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M10 20v-5h4v5',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>',food:'M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1-3 4-3 7h3v11',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',map:'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',down:'M12 4v12M6 11l6 6 6-6M5 20h14',hash:'M5 9h14M5 15h14M10 4L8 20M16 4l-2 16',coin:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',school:'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6',spark:'M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6'};
const ic=(n,s=20)=>{const d=ICO[n]||'';return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d[0]==='<'?d:`<path d="${d}"/>`}</svg>`};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=s=>String(s).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(n,cls='')=>`<span class="av ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;

/* --- WhatsApp reminder: only builds a wa.me link, the user opens it --- */
const WA_BASE='https://wa'+'.me/';
const waLink=(ph,text)=>WA_BASE+String(ph).replace(/\D/g,'').replace(/^0/,'92')+'?text='+encodeURIComponent(text);

/* --- tooltip and toasts --- */
function tip(html,x,y){const t=$('#tip');if(!t)return;t.innerHTML=html;t.style.opacity=1;const w=t.offsetWidth,h=t.offsetHeight;let L=x+14,T=y-h-12;if(L+w>innerWidth-8)L=x-w-14;if(L<8)L=8;if(T<8)T=y+18;t.style.transform=`translate(${L}px,${T}px)`}
function hideTip(){const t=$('#tip');if(t)t.style.opacity=0}
function toast(msg,kind='ok'){const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=ic(kind==='bad'?'alert':kind==='info'?'bell':'check',18)+`<span>${esc(msg)}</span>`;box.append(t);while(box.children.length>4)box.firstElementChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},3200)}

/* --- modal and drawer with focus trap, Esc to close --- */
const MODALS=[];let _m=0;
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function modal({title,body,actions=[],side=false,wide=false,cls='',onOpen,onClose}){
  const prev=document.activeElement,id='mt'+(++_m),bd=document.createElement('div');
  bd.className='backdrop'+(side?' side':'');
  bd.innerHTML=`<div class="modal ${side?'drawer':''} ${wide?'wide':''} ${cls}" role="dialog" aria-modal="true" aria-labelledby="${id}"><header class="m-head"><h2 id="${id}">${title}</h2><button class="m-x" data-close aria-label="Close">${ic('x',18)}</button></header><div class="m-body">${body}</div>${actions.length?`<footer class="m-foot">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-act="${i}">${a.label}</button>`).join('')}</footer>`:''}</div>`;
  document.body.append(bd);
  const el=bd.firstElementChild;let done=false;
  const close=()=>{if(done)return;done=true;const i=MODALS.indexOf(api);if(i>-1)MODALS.splice(i,1);hideTip();onClose&&onClose();const fin=()=>{bd.remove();if(prev&&prev.isConnected)prev.focus({preventScroll:true})};if(RM)fin();else{bd.classList.add('out');setTimeout(fin,230)}};
  const api={el,close,bd};MODALS.push(api);
  bd.addEventListener('mousedown',e=>{if(e.target===bd)close()});
  el.addEventListener('click',e=>{if(e.target.closest('[data-close]')){close();return}const b=e.target.closest('[data-act]');if(b&&b.parentElement.classList.contains('m-foot')){const a=actions[+b.dataset.act];if(a.fn&&a.fn(el,api)===false)return;close()}});
  onOpen&&onOpen(el,api);
  const f=el.querySelector('[autofocus]')||el.querySelector('.m-body '+FOCUSABLE.split(',').join(',.m-body '))||el.querySelector('.m-foot .btn')||el.querySelector('.m-x');
  f&&f.focus({preventScroll:true});
  return api;
}
function confirmBox(text,onYes,yes='Delete',danger=true){modal({title:'Please confirm',body:`<p style="margin:0">${text}</p>`,actions:[{label:'Cancel',cls:'ghost'},{label:yes,cls:danger?'danger':'primary',fn:()=>{onYes()}}]})}

/* --- popovers and menus (keyboard friendly) --- */
let POP=null;

/* ===================== Naqsha: housing society plots + instalments ===================== */
const KEY='dn-naqsha-v1';
const SIZES={'5M':['5 Marla',4500000],'10M':['10 Marla',8500000],'1K':['1 Kanal',16000000],'4C':['4 Marla commercial',12000000]};
const STATUS=[['avail','Available','var(--avail)'],['res','Reserved','#a8b8d8'],['book','On instalments','color-mix(in srgb,var(--accent) 35%,var(--surface))'],['sold','Fully paid','color-mix(in srgb,var(--good) 45%,var(--surface))'],['over','Overdue','color-mix(in srgb,var(--bad) 50%,var(--surface))']],STN=Object.fromEntries(STATUS.map(s=>[s[0],s[1]])),STF=Object.fromEntries(STATUS.map(s=>[s[0],s[2]]));
const MODES=['Cash','Cheque','Bank deposit','Pay order'];

/* site layout: blocks of plots around a boulevard (map units) */
function layout(){const P=[],B=[];
  const blk=(id,x0,y0,cols,rows,pw,ph,size,gap=16)=>{let n=1;const w=cols*pw,h=rows*ph+Math.floor((rows-1)/2)*gap;B.push({id,x:x0-6,y:y0-6,w:w+12,h:h+12});for(let r=0;r<rows;r++){const y=y0+r*ph+Math.floor(r/2)*gap;for(let c=0;c<cols;c++){const corner=c===0||c===cols-1;P.push({id:id+'-'+n,block:id,n:n++,x:x0+c*pw,y,w:pw,h:ph,size,corner,park:false})}}};
  blk('A',36,36,12,4,31,48,'5M');blk('B',496,36,10,3,37,60,'10M');blk('C',36,348,12,2,31,48,'5M');blk('D',496,348,8,1,45,56,'1K');blk('M',36,302,12,1,31,30,'4C',0);
  return{P,B}}
const MAP=layout();

/* Indian-style amount in words for receipts */
function words(n){n=Math.round(n);if(!n)return'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:t[Math.floor(x/10)]+(x%10?'-'+a[x%10]:''),three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  let s='';const cr=Math.floor(n/1e7),lk=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,rest=n%1000;if(cr)s+=three(cr)+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(rest)s+=three(rest);return s.trim()}

/* ---------- seeded society ---------- */
function seed(){seedRng(6203);
  const cfg={name:'Gulmohar Gardens',loc:'Raiwind Road, Lahore',phone:'0300-8877665',down:25,months:36,poss:10,sur:2,tfee:50000,code:'GG',prices:Object.fromEntries(Object.entries(SIZES).map(([k,v])=>[k,v[1]]))};
  const plots={},files=[],rcpts=[];let fno=101,rno=5001;
  MAP.P.forEach(p=>{plots[p.id]={st:p.park?'res':'avail',file:null}});
  const pool=MAP.P.filter(p=>!p.park).sort(()=>R()-.5),nSold=Math.round(pool.length*.68);
  pool.slice(0,nSold).forEach((p,i)=>{const price=Math.round(cfg.prices[p.size]*(p.corner?1.1:1)/1000)*1000,back=rnd(2,40),bd=addM(TODAY,-back);bd.setDate(rnd(1,25));const owner=pname('m'),kind=i%14===0?'def':i%6===0?'late':i%9===0?'full':'good';
    const f={id:uid('f'),no:cfg.code+'-'+p.block+'-'+String(fno++).padStart(4,'0'),plot:p.id,price,booked:iso(bd),owner,cnic:rnd(31101,38403)+'-'+rnd(1000000,9999999)+'-'+rnd(1,9),phone:phone(),hist:[],pays:{},kind:kind==='full'?'full':'plan',status:'Active'};
    f.hist.push({d:iso(bd),t:'Allotted to '+owner,fee:0});if(chance(.22)){const td=iso(addD(bd,rnd(60,400)));if(td<today){const nw=pname();f.hist.push({d:td,t:'Transferred from '+f.owner+' to '+nw,fee:cfg.tfee});f.owner=nw;f.cnic=rnd(31101,38403)+'-'+rnd(1000000,9999999)+'-'+rnd(1,9);f.phone=phone()}}
    const sch=schedule(f,cfg),lastI=sch.filter(x=>x.due<=today).length-1,stopAt=kind==='def'?lastI+1-rnd(2,6):999;
    sch.forEach((x,k)=>{if(x.due>today)return;if(k>=stopAt)return;if(k===lastI&&k>0&&chance(kind==='late'?.4:kind==='good'?.1:0))return;{let pdte=addD(pd(x.due),kind==='late'?rnd(3,40):rnd(-5,6));if(pdte>TODAY)pdte=TODAY;const late=Math.max(0,Math.floor((pdte-pd(x.due))/(30*864e5)));const sur=Math.round(x.amt*cfg.sur/100*late);const r={no:'R-'+(rno++),file:f.id,n:x.n,date:iso(pdte),amt:x.amt+sur,sur,mode:pick(MODES),kind:x.label};f.pays[x.n]=r.no;rcpts.push(r)}});
    if(kind==='full'){sch.forEach(x=>{if(f.pays[x.n])return;const r={no:'R-'+(rno++),file:f.id,n:x.n,date:iso(addD(bd,rnd(0,30))),amt:x.amt,sur:0,mode:'Pay order',kind:x.label};f.pays[x.n]=r.no;rcpts.push(r)})}
    files.push(f);plots[p.id].file=f.id});
  pool.slice(nSold,nSold+4).forEach(p=>plots[p.id].st='res');
  rcpts.sort((a,b)=>a.date.localeCompare(b.date));
  return{cfg,plots,files,rcpts,rseq:rno}}
/* instalment plan: down payment, monthly instalments, possession */
function schedule(f,cfg){cfg=cfg||S.cfg;const down=Math.round(f.price*cfg.down/100),poss=Math.round(f.price*cfg.poss/100),mon=Math.round((f.price-down-poss)/cfg.months/100)*100,out=[{n:0,label:'Down payment',due:f.booked,amt:down}];
  for(let k=1;k<=cfg.months;k++)out.push({n:k,label:'Instalment '+k,due:iso(addM(pd(f.booked),k)).slice(0,8)+pad(Math.min(28,pd(f.booked).getDate())),amt:k===cfg.months?f.price-down-poss-mon*(cfg.months-1):mon});
  out.push({n:cfg.months+1,label:'Possession',due:iso(addM(pd(f.booked),cfg.months+1)).slice(0,8)+'10',amt:poss});return out}
let S=store.get(KEY,null);if(!S||!S.files||!S.plots)S=seed();

/* ---------- money state per file ---------- */
const FL=id=>S.files.find(f=>f.id===id),PM=id=>MAP.P.find(p=>p.id===id);
/* receipt lookup by number, indexed once per change (thousands of receipts) */
let RCI=null,RCN=-1;const RC=no=>{if(!RCI||RCN!==S.rcpts.length){RCI=new Map(S.rcpts.map(r=>[r.no,r]));RCN=S.rcpts.length}return RCI.get(no)};
function fstat(f){const sch=schedule(f),rows=sch.map(x=>{const r=f.pays[x.n]?RC(f.pays[x.n]):null,late=!r&&x.due<today?Math.max(1,Math.ceil(daysAgo(x.due)/30)):0;return{...x,r,state:r?'Paid':x.due<today?'Overdue':x.due.slice(0,7)===today.slice(0,7)?'Due':'Upcoming',sur:r?r.sur:Math.round(x.amt*S.cfg.sur/100*late),late}});
  const paid=sum(rows.filter(x=>x.r),x=>x.amt),over=rows.filter(x=>x.state==='Overdue');return{rows,paid,pct:paid/f.price*100,over,overAmt:sum(over,x=>x.amt+x.sur),next:rows.find(x=>!x.r),oldest:over[0]?daysAgo(over[0].due):0}}
function plotState(id){const p=S.plots[id];if(!p)return'avail';if(!p.file)return p.st;const f=FL(p.file);if(!f)return'avail';const s=fstat(f);return s.over.length?'over':s.pct>=99.99?'sold':'book'}

function receive(f,after){const s=fstat(f),open=s.rows.filter(x=>!x.r);if(!open.length){toast('This file is fully paid','info');return}const F=[{k:'n',label:'Pay against',type:'select',opts:open.slice(0,8).map(x=>[x.n,x.label+' · '+dd(x.due)+' · '+rs(x.amt+x.sur)])},{k:'mode',label:'Mode',type:'select',opts:MODES},{k:'date',label:'Date',type:'date',req:true,val:today,check:v=>v>today?'Cannot be a future date':''}];

/* ---------- file drawer: owner, plan, transfers ---------- */
function openFile(id){const m=modal({title:'File',side:true,body:'<div class="fd"></div>'});

    $('.fd',m.el).innerHTML=`<div class="plan" style="margin-bottom:14px"><div style="position:relative;width:86px;height:86px">${ring(s.pct/100,86,s.over.length?'var(--bad)':'var(--good)',8)}<b class="mono" style="position:absolute;inset:0;display:grid;place-items:center;font-size:15px">${Math.round(s.pct)}%</b></div><div class="kv"><span>Plot</span><b>${esc(f.plot)} · ${SIZES[p.size][0]}${p.corner?' · corner':''}</b><span>Owner</span><b>${esc(f.owner)}</b><span>CNIC</span><b>${maskC(f.cnic)}</b><span>Mobile</span><b>${esc(f.phone)}</b><span>Price</span><b>${rs(f.price)}</b><span>Paid</span><b>${rs(s.paid)}</b><span>Overdue</span><b style="color:${s.over.length?'var(--bad)':'var(--good)'}">${s.over.length?rs(s.overAmt)+' ('+s.over.length+')':'None'}</b></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px"><button class="btn primary" data-a="pay">${ic('cash',15)}Receive payment</button><button class="btn" data-a="plan">${ic('list',15)}Schedule</button><button class="btn" data-a="tr">${ic('users',15)}Transfer file</button>${s.over.length?waA(f,s):''}<button class="btn ghost" data-a="letter">${ic('print',15)}Allotment letter</button></div>
    <h3 class="h2" style="margin:0 0 10px"><span style="font-size:13px;letter-spacing:.14em">OWNERSHIP HISTORY</span></h3><ul class="hist">${f.hist.map(h=>`<li><b>${esc(h.t)}</b><small>${ddy(h.d)}${h.fee?' · transfer fee '+rs(h.fee):''}</small></li>`).join('')}</ul>`};
  m.el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const f=FL(id),s=fstat(f);
    if(a.dataset.a==='pay')receive(f,paint);
    if(a.dataset.a==='plan'){m.close();INF=id;go('instalments')}
    if(a.dataset.a==='letter')printHTML(`<div class="rcpt"><h2>${esc(S.cfg.name.toUpperCase())}</h2><p style="text-align:center">${esc(S.cfg.loc)}</p><h3>Provisional allotment letter</h3><p>File ${esc(f.no)} · Plot ${esc(f.plot)} (${SIZES[PM(f.plot).size][0]}) is allotted to <b>${esc(f.owner)}</b>, CNIC ${esc(f.cnic)}, against a total price of ${rs(f.price)} (Rupees ${words(f.price)} Only), payable as per the attached schedule.</p><p>Date: ${ddy(today)}</p></div>`);
    if(a.dataset.a==='tr'){if(s.over.length){toast('Clear '+rs(s.overAmt)+' overdue first. A transfer needs a no-demand certificate.','bad');return}const F=[{k:'owner',label:'New owner name',req:true},{k:'cnic',label:'New owner CNIC',req:true,ph:'35202-1234567-1',check:v=>/^\d{5}-\d{7}-\d$/.test(v)?'':'Use the format 12345-1234567-1'},{k:'phone',label:'New owner mobile',type:'tel',req:true},{k:'fee',label:'Transfer fee (Rs)',type:'money',req:true,min:0,max:5000000,val:S.cfg.tfee}];
      modal({title:'Transfer '+esc(f.no),body:formHTML(F)+`<p class="muted" style="font-size:13px;margin:12px 0 0">From ${esc(f.owner)}. No dues are pending, so the no-demand certificate is clear.</p>`,actions:[{label:'Cancel',cls:'ghost'},{label:'Transfer file',cls:'primary',fn:mm=>{const v=readForm(mm,F);if(!v)return false;f.hist.push({d:today,t:'Transferred from '+f.owner+' to '+v.owner,fee:v.fee});if(v.fee){const r={no:'R-'+(S.rseq++),file:f.id,n:-1,date:today,amt:v.fee,sur:0,mode:'Pay order',kind:'Transfer fee'};S.rcpts.push(r)}Object.assign(f,{owner:v.owner,cnic:v.cnic,phone:v.phone});save();paint();refresh();toast(f.no+' now belongs to '+v.owner)}}]})}});
  paint()}

  $('#miniMap',el).innerHTML=mapSVG(false);$('#miniMap',el).addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p)openPlot(p.dataset.p)});
  table($('#ovDue',el),{id:'ovdue',rows:()=>thisM.map(x=>({...x,id:x.f.id})),sortCol:0,pageSize:6,cols:[{label:'Due',k:'due',f:x=>dd(x.due)},{label:'File',v:x=>x.f.no,f:x=>`<span class="mono">${esc(x.f.no)}</span><br><small class="muted">${esc(x.f.owner)}</small>`},{label:'Amount',num:true,k:'amt',f:x=>rs(x.amt)},{label:'',v:x=>x.state,f:x=>stTag(x.state)}],onRow:id=>openFile(id),empty:'Nothing due this month.'});
  const dr=()=>{const d=dueVsColl(monthsBack(OR2==='6M'?6:12));barChart($('#ovR',el),{labels:d.map(x=>mlabel(x.m)),series:[{name:'Due',color:'var(--c5)',data:d.map(x=>x.due)},{name:'Collected',color:'var(--c1)',data:d.map(x=>x.col)}],fmt:rsk,tfmt:rs,h:230})};dr();bindSeg(el,'or2',v=>{OR2=v;dr()});
  const blocks=['A','B','C','D','M'];barChart($('#ovB',el),{labels:blocks.map(b=>b==='M'?'Commercial':'Block '+b),series:[{name:'Sold',color:'var(--c1)',data:blocks.map(b=>MAP.P.filter(p=>p.block===b&&S.plots[p.id].file).length)},{name:'Available',color:'var(--c5)',data:blocks.map(b=>MAP.P.filter(p=>p.block===b&&!S.plots[p.id].file&&S.plots[p.id].st==='avail').length)}],stacked:true,fmt:num,h:230,padL:34})}

  <text class="zlbl" x="200" y="294" style="font-size:9px">MAIN BOULEVARD</text>
  <rect class="zone" x="496" y="410" width="170" height="60"/><text class="zlbl" x="581" y="444" text-anchor="middle">PARK</text><rect class="zone" x="676" y="410" width="80" height="60" style="fill:color-mix(in srgb,var(--warn) 18%,var(--surface2));stroke:var(--warn)"/><text class="zlbl" x="716" y="444" text-anchor="middle">MOSQUE</text><rect class="zone" x="766" y="410" width="94" height="60" style="fill:color-mix(in srgb,var(--accent) 12%,var(--surface2));stroke:var(--accent)"/><text class="zlbl" x="813" y="444" text-anchor="middle">SCHOOL</text>
  ${MAP.B.map((b,i)=>`<path class="blk" pathLength="1" d="M${b.x} ${b.y}h${b.w}v${b.h}h${-b.w}Z" style="animation-delay:${i*150}ms"/><text class="blbl" x="${b.x}" y="${b.y-6}">${b.id==='M'?'COMMERCIAL':'BLOCK '+b.id}</text>`).join('')}
  ${MAP.P.filter(p=>!p.park).map((p,i)=>{const s=plotState(p.id);return `<rect class="plot ${vis(p)?'':'dim'}" data-p="${p.id}" ${full?`tabindex="0" role="button" aria-label="Plot ${p.id}, ${SIZES[p.size][0]}, ${STN[s]}"`:''} x="${p.x+1}" y="${p.y+1}" width="${p.w-2}" height="${p.h-2}" style="fill:${STF[s]};animation-delay:${600+i*5}ms"/>${p.w>30?`<text class="ptxt" x="${p.x+p.w/2}" y="${p.y+p.h/2+3}" text-anchor="middle">${p.n}</text>`:''}`}).join('')}</g></svg>`}
function pgMap(el){head('Plot map','Click a plot for its file, or book an available one');const st={};MAP.P.forEach(p=>{const s=plotState(p.id);st[s]=(st[s]||0)+1});
  el.innerHTML=`<section class="card"><div class="h2"><div class="chips" role="group" aria-label="Status">${[['all','All'],...STATUS.map(s=>[s[0],s[1]+' '+(st[s[0]]||0)])].map(([k,l])=>`<button class="chip" data-mf="${k}" aria-pressed="${MF===k}">${l}</button>`).join('')}</div>${segHTML('ms',[['all','All sizes'],...Object.entries(SIZES).map(([k,v])=>[k,v[0].replace(' commercial',' comm.')])],MS,'Plot size')}</div>
  <div class="mapwrap" id="mw"><div class="zoom"><button class="icon-btn" id="zi" aria-label="Zoom in">${ic('plus',16)}</button><button class="icon-btn" id="zo" aria-label="Zoom out">${ic('minus',16)}</button><button class="icon-btn" id="zr" aria-label="Reset view">${ic('refresh',15)}</button></div>${mapSVG(true)}</div>
  <div class="lg" style="margin-top:12px">${STATUS.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join('')}<span class="muted">Drag to pan · Ctrl + wheel to zoom</span></div></section>`;
  const mw=$('#mw',el),zg=()=>$('#zg',el),apply=()=>{zg().setAttribute('transform',`translate(${r1(ZM.x)},${r1(ZM.y)}) scale(${r1(ZM.k*100)/100})`)},zoom=(f,cx=440,cy=240)=>{const k=clamp(ZM.k*f,1,4);if(k===ZM.k){toast(k>=4?'That is the closest zoom':'Already showing the whole site','info');return}ZM.x=cx-(cx-ZM.x)*(k/ZM.k);ZM.y=cy-(cy-ZM.y)*(k/ZM.k);ZM.k=k;if(k===1){ZM.x=0;ZM.y=0}apply()};

  mw.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const r=mw.getBoundingClientRect(),sx=880/(r.width||880);zoom(e.deltaY<0?1.15:1/1.15,(e.clientX-r.left)*sx,(e.clientY-r.top)*sx)},{passive:false});
  let drag=null;mw.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,ox:ZM.x,oy:ZM.y,moved:false}});

  el.addEventListener('click',e=>{const f=e.target.closest('[data-mf]');if(f){MF=f.dataset.mf;refresh()}});bindSeg(el,'ms',v=>{MS=v;refresh()})}

function pgInstalments(el){if(!FL(INF))INF=(S.files.find(f=>fstat(f).over.length)||S.files[0]||{}).id;const f=FL(INF);head('Instalments','Schedule per file: paid, due and overdue with surcharge');if(!f){el.innerHTML='<p class="empty">No files yet.</p>';return}const s=fstat(f);
  el.innerHTML=`<section class="card"><div class="h2"><label style="flex:1 1 260px"><span class="sr">File</span><select class="inp" id="iF">${S.files.map(x=>`<option value="${x.id}" ${x.id===INF?'selected':''}>${esc(x.no)} · ${esc(x.owner)} · plot ${esc(x.plot)}</option>`).join('')}</select></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="iPay">${ic('cash',15)}Receive payment</button><button class="btn" id="iOpen">Open file</button>${s.over.length?waA(f,s):''}</div></div>
  <div class="grid g4" style="margin-bottom:16px">${[['Total price',rs(f.price)],['Paid',rs(s.paid)+' · '+Math.round(s.pct)+'%'],['Overdue',s.over.length?rs(s.overAmt):'None'],['Next due',s.next?dd(s.next.due)+' · '+rs(s.next.amt):'Fully paid']].map(k=>`<div class="kpi"><div class="k-l">${k[0]}</div><div class="k-v" style="font-size:18px">${k[1]}</div></div>`).join('')}</div>
  <div id="iT"></div></section>`;
  table($('#iT',el),{id:'sch'+INF,chips:['All','Paid','Overdue','Due','Upcoming'],chipFn:(x,c)=>x.state===c,rows:()=>s.rows.map(x=>({...x,id:String(x.n)})),pageSize:12,rowCls:x=>x.state==='Overdue'?'over':x.state==='Paid'?'paid':'',
    cols:[{label:'#',k:'n',num:true},{label:'Instalment',k:'label'},{label:'Due date',k:'due',f:x=>dd(x.due)+' '+pd(x.due).getFullYear()},{label:'Amount',k:'amt',num:true,f:x=>rs(x.amt)},{label:'Surcharge',num:true,k:'sur',f:x=>x.sur?rs(x.sur):'-'},{label:'Status',k:'state',f:x=>stTag(x.state)},{label:'Receipt',nosort:true,f:x=>x.r?`<button class="link" data-rc="${x.r.no}">${x.r.no}</button> <small class="muted">${dd(x.r.date)}</small>`:'-'}]});
  $('#iF',el).addEventListener('change',e=>{INF=e.target.value;refresh()});$('#iPay',el).addEventListener('click',()=>receive(f));$('#iOpen',el).addEventListener('click',()=>openFile(f.id));
  el.addEventListener('click',e=>{const r=e.target.closest('[data-rc]');if(r)showRcpt(r.dataset.rc)})}

/* receipts */
function pgReceipts(el){head('Receipts','Every payment received, with print');const cm=today.slice(0,7);
  el.innerHTML=`<div class="grid g4">${[['Receipts',S.rcpts.length,'num'],['This month',sum(S.rcpts.filter(r=>r.date.slice(0,7)===cm),r=>r.amt),'rsk'],['Surcharge collected',sum(S.rcpts,r=>r.sur),'rsk'],['Transfer fees',sum(S.rcpts.filter(r=>r.kind==='Transfer fee'),r=>r.amt),'rsk']].map((k,i)=>`<article class="card kpi"><div class="k-l">${k[0]}</div><div class="k-v">${cnt(k[1],k[2],'rc'+i)}</div></article>`).join('')}</div><section class="card mt"><div id="rT"></div></section>`;
  table($('#rT',el),{id:'rc',search:'Search receipt, file or owner',chips:['All',...MODES],chipFn:(r,c)=>r.mode===c,rows:()=>S.rcpts.map(r=>({...r,id:r.no})),sortCol:1,sortDir:-1,pageSize:11,text:r=>{const f=FL(r.file);return r.no+' '+(f?f.no+' '+f.owner:'')},
    cols:[{label:'Receipt',k:'no',f:r=>`<b class="mono">${r.no}</b>`},{label:'Date',k:'date',f:r=>ddy(r.date)},{label:'File',v:r=>(FL(r.file)||{}).no||'',f:r=>{const f=FL(r.file);return f?`<span class="mono">${esc(f.no)}</span><br><small class="muted">${esc(f.owner)}</small>`:'-'}},{label:'For',k:'kind'},{label:'Mode',k:'mode'},{label:'Amount',k:'amt',num:true,f:r=>`<b>${rs(r.amt)}</b>${r.sur?`<br><small class="muted">incl. ${rs(r.sur)} surcharge</small>`:''}`}],onRow:id=>showRcpt(id)})}

/* recovery */
let RR2='12M';
function pgRecovery(el){head('Recovery','Overdue instalments, aging and reminders');const FS=S.files.map(f=>({id:f.id,f,s:fstat(f)})).filter(x=>x.s.over.length),bk=[0,0,0,0];FS.forEach(x=>x.s.over.forEach(o=>{const d=daysAgo(o.due);bk[d<=30?0:d<=60?1:d<=90?2:3]+=o.amt+o.sur}));
  el.innerHTML=`<div class="grid g21"><section class="card"><div class="h2"><h2>Due vs collected</h2>${segHTML('rr2',['6M','12M'],RR2,'Range')}</div><div class="chart" id="rC"></div></section><section class="card"><div class="h2"><h2>Overdue by age</h2></div><div id="rA"></div></section></div>
  <section class="card mt"><div class="h2"><h2>Defaulters (${FS.length})</h2><span class="muted" style="font-size:12.5px">3 or more unpaid instalments can lead to a cancellation notice</span></div><div id="rT"></div></section>`;
  const dr=()=>{const d=dueVsColl(monthsBack(RR2==='6M'?6:12));lineChart($('#rC',el),{labels:d.map(x=>mlabel(x.m)),series:[{name:'Due',color:'var(--c5)',data:d.map(x=>x.due)},{name:'Collected',color:'var(--c1)',data:d.map(x=>x.col)}],fmt:rsk,tfmt:rs,h:240})};dr();bindSeg(el,'rr2',v=>{RR2=v;dr()});
  donut($('#rA',el),{items:['1-30 days','31-60 days','61-90 days','90+ days'].map((l,i)=>({label:l,value:bk[i],color:['var(--c4)','var(--c3)','color-mix(in srgb,var(--bad) 75%,#000)','var(--text)'][i]})),tfmt:rsk,center:rsk(sum(bk)),sub:'overdue',size:160});
  table($('#rT',el),{id:'rec',search:'Search file or owner',chips:['All','1 instalment','2 instalments','3 or more'],chipFn:(x,c)=>c==='3 or more'?x.s.over.length>=3:x.s.over.length===+c[0],rows:()=>FS,sortCol:3,sortDir:-1,pageSize:8,text:x=>x.f.no+' '+x.f.owner,
    cols:[{label:'File',v:x=>x.f.no,f:x=>`<b class="mono">${esc(x.f.no)}</b><br><small class="muted">${esc(x.f.owner)} · plot ${esc(x.f.plot)}</small>`},{label:'Unpaid',num:true,v:x=>x.s.over.length},{label:'Oldest',num:true,v:x=>x.s.oldest,f:x=>x.s.oldest+' days'},{label:'Overdue',num:true,v:x=>x.s.overAmt,f:x=>`<b style="color:var(--bad)">${rs(x.s.overAmt)}</b>`},{label:'',nosort:true,f:x=>`<span style="display:inline-flex;gap:6px">${waA(x.f,x.s)}<button class="btn sm" data-notice="${x.id}">${x.s.over.length>=3?'Final notice':'Notice'}</button></span>`}],onRow:id=>openFile(id)});
  el.addEventListener('click',e=>{const n=e.target.closest('[data-notice]');if(!n)return;const f=FL(n.dataset.notice),s=fstat(f);printHTML(`<div class="rcpt"><h2>${esc(S.cfg.name.toUpperCase())}</h2><p style="text-align:center">${esc(S.cfg.loc)}</p><h3>${s.over.length>=3?'Final notice before cancellation':'Payment notice'}</h3><p>Date: ${ddy(today)}</p><p>Dear ${esc(f.owner)}, file ${esc(f.no)} (plot ${esc(f.plot)}) has ${s.over.length} unpaid instalments since ${ddy(s.over[0].due)}. The amount due with surcharge is ${rs(s.overAmt)} (Rupees ${words(s.overAmt)} Only). Please pay within 15 days.</p></div>`);toast('Notice for '+f.no+' sent to print')})}

/* settings */
function pgSettings(el){head('Settings','Society, payment plan and prices');const F=[{k:'name',label:'Society name',req:true},{k:'loc',label:'Location',req:true},{k:'phone',label:'Site office mobile',type:'tel',req:true},{k:'down',label:'Down payment (%)',type:'number',min:0,max:100,req:true},{k:'months',label:'Monthly instalments',type:'number',min:1,max:120,req:true},{k:'poss',label:'On possession (%)',type:'number',min:0,max:100,req:true,check:(v,o)=>v+o.down>=100?'Down payment + possession must be below 100%':''},{k:'sur',label:'Late surcharge per month (%)',type:'number',min:0,max:20,req:true},{k:'tfee',label:'Transfer fee (Rs)',type:'money',min:0,max:5000000,req:true}];
  el.innerHTML=`<div class="grid g21"><section class="card"><div class="h2"><h2>Society and plan</h2></div><div id="sf">${formHTML(F,S.cfg)}</div><p class="muted" style="font-size:12.5px">Plan changes apply to every file's schedule.</p><button class="btn primary" id="sv">${ic('check',15)}Save</button></section><div class="grid" style="align-content:start"><section class="card"><div class="h2"><h2>Base prices</h2></div><table class="tbl"><tbody>${Object.entries(SIZES).map(([k,v])=>`<tr><td>${v[0]}</td><td class="num"><label class="sr" for="pr_${k}">${v[0]} price</label><input class="inp" style="width:140px" id="pr_${k}" type="number" min="100000" value="${S.cfg.prices[k]}"></td></tr>`).join('')}</tbody></table><p class="muted" style="font-size:12.5px">Corner plots cost 10% more. Applies to new bookings.</p></section><section class="card"><div class="h2"><h2>Demo data</h2></div><p class="muted" style="margin:0 0 12px">Restore ${MAP.P.length} plots, about 90 files with transfers and 3 years of receipts.</p><button class="btn danger" id="rs">${ic('refresh',15)}Reset demo data</button></section></div></div>`;
  $('#sv',el).addEventListener('click',()=>{const v=readForm($('#sf',el),F);if(!v)return;let bad=false;Object.keys(SIZES).forEach(k=>{const n=+$('#pr_'+k,el).value;if(!(n>=100000))bad=true;else S.cfg.prices[k]=n});if(bad){toast('Prices must be at least Rs 100,000','bad');return}Object.assign(S.cfg,v);save();refresh();paintSide();toast('Settings saved')});
  $('#rs',el).addEventListener('click',()=>confirmBox('Reset all demo data?',()=>{S=seed();save();Object.keys(TS).forEach(k=>delete TS[k]);INF='';MF='all';MS='all';ZM={k:1,x:0,y:0};refresh();paintSide();toast('Demo data reset')},'Reset'))}

function paintSide(){$('#sideSoc').textContent=S.cfg.name}
/* ---------- boot ---------- */
$('[data-menu]').innerHTML=ic('menu');$('[data-cmdk]').innerHTML=ic('search',17);paintSide();
boot({name:'Naqsha',key:KEY,routes:[{path:'overview',label:'Overview',render:pgOverview},{path:'map',label:'Plot map',render:pgMap},{path:'files',label:'Plot files',render:pgFiles},{path:'instalments',label:'Instalments',render:pgInstalments},{path:'receipts',label:'Receipts',render:pgReceipts},{path:'recovery',label:'Recovery',render:pgRecovery},{path:'settings',label:'Settings',render:pgSettings}],
  commands:[{label:'Available plots on the map',run:()=>{MF='avail';go('map')}},{label:'Overdue plots on the map',run:()=>{MF='over';go('map')}},{label:'Files with 3 or more unpaid',run:()=>{TS.rec={q:'',chip:'3 or more',sort:3,dir:-1,page:0};go('recovery')}},{label:'Transferred files',run:()=>{TS.files={q:'',chip:'Transferred',sort:null,dir:1,page:0};go('files')}}],
  notes:()=>{const n=[];S.files.map(f=>({f,s:fstat(f)})).filter(x=>x.s.over.length>=3).slice(0,4).forEach(x=>n.push({id:'def-'+x.f.id+x.s.over.length,text:x.f.no+' has '+x.s.over.length+' unpaid instalments',sub:rs(x.s.overAmt)+' with surcharge',href:'#/recovery'}));const wk=S.files.flatMap(f=>fstat(f).rows.filter(r=>!r.r&&r.due>=today&&daysAgo(r.due)>=-7));if(wk.length)n.push({id:'wk-'+today+wk.length,text:wk.length+' instalments fall due this week',sub:rs(sum(wk,x=>x.amt)),href:'#/overview'});return n}});
</script>
</body>
</html>
