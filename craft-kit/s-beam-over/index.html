<!doctype html>
<!-- Chill & Craft · Beam Over · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beam Over · Nearby share radar</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg1: #e6f4fa;
    --bg2: #cfe9f4;
    --card: rgba(255, 255, 255, 0.78);
    --ink: #0b3142;
    --muted: #5b7b8a;
    --line: rgba(11, 49, 66, 0.12);
    --radar: #f4fbfe;
    --ring: rgba(14, 116, 144, 0.16);
    --beam: #0891b2;
    --glow: rgba(8, 145, 178, 0.45);
    --ok: #16a34a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg1: #06111b;
    --bg2: #0b2131;
    --card: rgba(13, 30, 44, 0.82);
    --ink: #e2f6fd;
    --muted: #86a8b8;
    --line: rgba(226, 246, 253, 0.1);
    --radar: #081a27;
    --ring: rgba(34, 211, 238, 0.16);
    --beam: #22d3ee;
    --glow: rgba(34, 211, 238, 0.55);
    --ok: #a3e635;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: radial-gradient(80% 70% at 50% 40%, var(--bg1), var(--bg2)); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

  /* ---------- Stage ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; isolation: isolate; }
  .stage::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; -webkit-mask: radial-gradient(55% 55% at 50% 50%, rgba(0, 0, 0, 0.6), transparent); mask: radial-gradient(55% 55% at 50% 50%, rgba(0, 0, 0, 0.6), transparent); }

  /* ---------- Card ---------- */
  .card { width: min(420px, 100%); padding: 18px 18px 16px; border-radius: 28px; background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 40px 70px -40px rgba(4, 40, 60, 0.55), 0 0 0 1px var(--line); animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .head h1 { margin: 0; font-size: 1.12rem; }
  .head p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
  .file { display: flex; align-items: center; gap: 9px; margin-top: 12px; padding: 8px 10px; border-radius: 14px; background: color-mix(in srgb, var(--beam) 10%, transparent); }
  .thumb { position: relative; width: 36px; height: 36px; flex: none; border-radius: 9px; background: linear-gradient(140deg, #f472b6, #fb923c 55%, #facc15); }
  .thumb::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 6px; height: 10px; background: rgba(255, 255, 255, 0.85); clip-path: polygon(0 100%, 30% 20%, 55% 70%, 75% 40%, 100% 100%); }
  .file b { display: block; font-size: 0.86rem; }
  .file span { font-size: 0.74rem; color: var(--muted); }
  .wifi { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; color: var(--beam); background: color-mix(in srgb, var(--beam) 12%, transparent); white-space: nowrap; }
  .wifi i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ---------- Radar ---------- */
  .radar { position: relative; width: min(320px, 100%); aspect-ratio: 1; margin: 14px auto 6px; }
  .disc { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: radial-gradient(circle, transparent 0 16%, var(--ring) 16.3% 16.8%, transparent 17% 33%, var(--ring) 33.3% 33.8%, transparent 34% 49.4%, var(--ring) 49.6% 50%), var(--radar); box-shadow: inset 0 0 0 1px var(--line), inset 0 0 40px rgba(8, 145, 178, 0.08); }
  .disc::before, .disc::after { content: ""; position: absolute; background: var(--ring); }
  .disc::before { left: 50%; top: 4%; bottom: 4%; width: 1px; }
  .disc::after { top: 50%; left: 4%; right: 4%; height: 1px; }
  .sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 270deg, color-mix(in srgb, var(--beam) 6%, transparent) 300deg, color-mix(in srgb, var(--beam) 42%, transparent) 359deg, transparent 360deg); transition: opacity 0.5s; }
  .radar.busy .sweep { opacity: 0.35; }
  .ping { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; margin: -50% 0 0 -50%; border-radius: 50%; border: 1.5px solid var(--beam); opacity: 0; animation: ping 3.6s ease-out infinite; }
  .ping:nth-child(2) { animation-delay: 1.2s; }
  .ping:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ping { 0% { transform: scale(0.12); opacity: 0.55; } 100% { transform: scale(1); opacity: 0; } }

  /* You, in the middle */
  .me { position: absolute; left: 50%; top: 50%; width: 46px; height: 66px; margin: -33px 0 0 -23px; border-radius: 12px; background: var(--ink); box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.5); display: grid; place-items: center; }
  .me::after { content: "You"; position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); font-size: 0.7rem; font-weight: 700; color: var(--muted); }
  .me .screen { position: absolute; inset: 4px; border-radius: 9px; background: linear-gradient(160deg, #164e63, #0e7490); }
  .me .doc { position: relative; width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(140deg, #f472b6, #fb923c 55%, #facc15); box-shadow: 0 6px 10px -4px rgba(0, 0, 0, 0.5); transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .radar.busy .me .doc { transform: translateY(-5px) scale(1.12); }

  /* Beam */
  .beam { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .beam path { fill: none; stroke: var(--beam); stroke-width: 1; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--glow)); }
  .beam circle { fill: var(--beam); filter: drop-shadow(0 0 2px var(--glow)); }

  /* People nearby */
  .spot { position: absolute; width: 72px; height: 72px; margin: -24px 0 0 -36px; visibility: hidden; }
  .spot.found { visibility: visible; }
  .blip { position: relative; display: grid; justify-items: center; width: 72px; padding: 0; border: 0; background: none; cursor: pointer; transition: opacity 0.4s, filter 0.4s; animation: drift 6s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -4px); } }
  .blip:focus-visible { outline: none; }
  .blip:focus-visible .av { box-shadow: 0 0 0 3px var(--radar), 0 0 0 6px var(--ink); }
  .av { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; color: #fff; background: var(--c); box-shadow: 0 0 0 3px var(--radar), 0 8px 14px -6px rgba(0, 0, 0, 0.45); transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .blip:hover .av { transform: scale(1.08); }
  .dev { position: absolute; right: -4px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--radar); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .dev svg { width: 12px; height: 12px; }
  .ring { position: absolute; left: 50%; top: 23px; width: 58px; height: 58px; margin: -29px 0 0 -29px; transform: rotate(-90deg); overflow: visible; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .target .ring, .done .ring { opacity: 1; }
  .ring circle { fill: none; stroke: var(--beam); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; }
  .done .ring circle { stroke: var(--ok); }
  .tick { position: absolute; left: 50%; top: 23px; width: 24px; height: 24px; margin: -32px 0 0 8px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; box-shadow: 0 0 0 3px var(--radar); opacity: 0; transform: scale(0); transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1), opacity 0.2s; }
  .tick svg { width: 13px; height: 13px; }
  .done .tick { opacity: 1; transform: scale(1); }
  .nm { margin-top: 5px; padding: 2px 7px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: var(--radar); box-shadow: 0 0 0 1px var(--line); white-space: nowrap; }
  .radar.busy .spot:not(.target) .blip { opacity: 0.4; }
  .radar.busy .spot:not(.target) .av { transform: scale(0.9); }
  .found-pop { position: absolute; left: 50%; top: 23px; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid var(--beam); pointer-events: none; }

  /* Status */
  .status { display: flex; align-items: center; gap: 10px; min-height: 46px; margin-top: 8px; padding: 8px 8px 8px 14px; border-radius: 16px; background: color-mix(in srgb, var(--beam) 8%, transparent); }
  .status .txt { flex: 1; min-width: 0; font-size: 0.82rem; }
  .status .txt b { display: block; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .txt span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; margin-top: 5px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--beam); transform: scaleX(0); transform-origin: 0 50%; }
  .cancel { height: 32px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; font-size: 0.78rem; font-weight: 700; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .cancel.show { opacity: 1; pointer-events: auto; }
  .cancel:focus-visible { outline: 3px solid var(--beam); outline-offset: 2px; }
  .spark { position: fixed; z-index: 30; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .card, .ping, .blip, .wifi i { animation: none; }
    .av, .tick, .me .doc, .sweep { transition-duration: 0.01s; }
    .spark, .found-pop { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <div class="head">
        <div>
          <h1 id="title">Share nearby</h1>
          <p>Tap someone close by to beam the file over.</p>
        </div>
        <span class="wifi"><i aria-hidden="true"></i>Visible</span>
      </div>
      <div class="file">
        <span class="thumb" aria-hidden="true"></span>
        <div><b>Mehndi-photos.zip</b><span>48 photos · 24 MB</span></div>
      </div>

      <div class="radar" id="radar">
        <div class="disc" aria-hidden="true">
          <span class="ping"></span><span class="ping"></span><span class="ping"></span>
          <div class="sweep" id="sweep"></div>
        </div>
        <svg class="beam" id="beam" viewBox="0 0 100 100" aria-hidden="true"></svg>
        <div class="me" aria-hidden="true"><span class="screen"></span><span class="doc" id="doc"></span></div>
        <div id="people" role="group" aria-label="People nearby"></div>
      </div>

      <div class="status">
        <div class="txt" aria-live="polite"><b id="line1">Looking for people nearby…</b><span id="line2">Keep both devices unlocked</span></div>
        <button class="cancel" id="cancel" type="button">Cancel</button>
      </div>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    </section>
  </main>

<script>
  // ---------- Beam Over: a radar finds people nearby; tap one to beam a file over ----------
  const $ = (s) => document.querySelector(s);
  const radar = $("#radar");
  const sweep = $("#sweep");
  const beam = $("#beam");
  const people = $("#people");
  const line1 = $("#line1");
  const line2 = $("#line2");
  const cancelBtn = $("#cancel");
  const bar = $("#bar");
  const doc = $("#doc");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  const SIZE_MB = 24;

  // Device icons
  const ICON = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2.5" /><path d="M11 18h2" /></svg>',
    laptop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="10" rx="1.5" /><path d="M3 19h18" /></svg>',
    tablet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5" /><path d="M11 18h2" /></svg>',
    tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M9 21h6" /></svg>'
  };
  // Where people sit on the radar: angle in degrees (0 = right, clockwise), radius in % of the disc
  const PEOPLE = [
    { name: "Zainab", ini: "ZA", dev: "phone", a: -42, r: 33, c: "linear-gradient(135deg,#f472b6,#be185d)" },
    { name: "Ali", ini: "AL", dev: "laptop", a: 22, r: 36, c: "linear-gradient(135deg,#60a5fa,#1d4ed8)" },
    { name: "Living room", ini: "TV", dev: "tv", a: 96, r: 33, c: "linear-gradient(135deg,#94a3b8,#334155)" },
    { name: "Mehwish", ini: "MS", dev: "tablet", a: 158, r: 31, c: "linear-gradient(135deg,#fbbf24,#c2410c)" },
    { name: "Hamza", ini: "HZ", dev: "phone", a: 218, r: 35, c: "linear-gradient(135deg,#34d399,#047857)" }
  ];

  const spots = PEOPLE.map((p, i) => {
    const x = 50 + p.r * Math.cos(p.a * Math.PI / 180);
    const y = 50 + p.r * Math.sin(p.a * Math.PI / 180);
    p.x = x;
    p.y = y;
    const s = document.createElement("div");
    s.className = "spot";
    s.style.left = x + "%";
    s.style.top = y + "%";
    s.innerHTML =
      '<button class="blip" type="button" style="--c:' + p.c + ";--d:" + -i * 1.3 + 's">' +
      '<span class="av">' + p.ini + '<span class="dev" aria-hidden="true">' + ICON[p.dev] + "</span></span>" +
      '<svg class="ring" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="27" pathLength="1" /></svg>' +
      '<span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span>' +
      '<span class="nm">' + p.name + "</span></button>";
    const btn = s.querySelector(".blip");
    btn.setAttribute("aria-label", "Send to " + p.name + " (" + p.dev + ")");
    btn.addEventListener("click", () => send(i));
    people.appendChild(s);
    p.spot = s;
    p.btn = btn;
    return s;
  });

  // ---------- Sweep + discovery ----------
  const TURN = 3200;
  let sweepAnim = null;
  if (!calm() && sweep.animate) sweepAnim = sweep.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: TURN, iterations: Infinity });
  let found = 0;
  PEOPLE.forEach((p) => {
    // the sweep's leading edge starts pointing up (-90°) and turns clockwise
    const at = calm() ? 200 : (((p.a + 90) % 360 + 360) % 360) / 360 * TURN;
    setTimeout(() => {
      p.spot.classList.add("found");
      found++;
      if (state === "idle") { line1.textContent = found + (found === 1 ? " person" : " people") + " nearby"; line2.textContent = "Tap someone to send the file"; }
      play(p.btn, [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1, offset: 0.6 }, { transform: "scale(1)" }], { duration: 520, easing: "ease-out" });
      if (!calm()) {
        const pop = document.createElement("span");
        pop.className = "found-pop";
        p.btn.appendChild(pop);
        pop.animate([{ transform: "scale(1)", opacity: 0.8 }, { transform: "scale(2.2)", opacity: 0 }], { duration: 800, easing: "ease-out" }).onfinish = () => pop.remove();
      }
    }, at + 120);
  });

  // ---------- Sending ----------
  let state = "idle"; // idle | sending | done
  let token = 0;
  let current = -1;

  function drawBeam(p) {
    beam.innerHTML = "";
    // a gentle curve from the centre to the person
    const mx = (50 + p.x) / 2, my = (50 + p.y) / 2;
    const dx = p.x - 50, dy = p.y - 50;
    const len = Math.hypot(dx, dy);
    const cx = mx - (dy / len) * 9, cy = my + (dx / len) * 9;
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", "M50 50Q" + cx.toFixed(2) + " " + cy.toFixed(2) + " " + p.x.toFixed(2) + " " + p.y.toFixed(2));
    path.setAttribute("pathLength", "1");
    path.style.strokeDasharray = "1 2"; // the gap is longer than the path, so no stray end cap shows
    path.style.strokeDashoffset = "1";
    beam.appendChild(path);
    const dots = [];
    for (let i = 0; i < 5; i++) {
      const c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("r", "1.3");
      c.style.opacity = "0";
      beam.appendChild(c);
      dots.push(c);
    }
    return { path, dots };
  }

  async function send(i) {
    if (state !== "idle") return;
    const p = PEOPLE[i];
    const my = ++token;
    state = "sending";
    current = i;
    p.spot.classList.add("target");
    p.btn.classList.remove("done");
    const ringC = p.btn.querySelector(".ring circle");
    ringC.style.transition = "none";
    ringC.style.strokeDashoffset = "1";

    // 1. Anticipation: the person pulses, everyone else dims, the file lifts and the sweep slows
    radar.classList.add("busy");
    if (sweepAnim && sweepAnim.updatePlaybackRate) sweepAnim.updatePlaybackRate(0.3);
    line1.textContent = "Connecting to " + p.name + "…";
    line2.textContent = "Waiting for " + p.name + " to accept";
    cancelBtn.classList.add("show");
    await play(p.btn.querySelector(".av"), [{ transform: "scale(1)" }, { transform: "scale(.86)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }], { duration: 520, easing: "ease-out" });
    if (my !== token) return;

    // 2. The beam draws out to them, then packets stream along it
    const { path, dots } = drawBeam(p);
    await play(path, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 420, easing: "cubic-bezier(.6,0,.2,1)" });
    path.style.strokeDashoffset = "0";
    if (my !== token) return;

    // 3. Progress: ring fills, MB and time tick up
    const t0 = performance.now();
    let sent = 0;
    let raf = 0;
    const total = path.getTotalLength ? path.getTotalLength() : 0;
    await new Promise((resolve) => {
      let last = t0;
      function step(t) {
        if (my !== token) { resolve(); return; }
        const dt = (t - last) / 1000;
        last = t;
        sent = Math.min(SIZE_MB, sent + dt * (7 + Math.random() * 3.5));
        const k = sent / SIZE_MB;
        ringC.style.strokeDashoffset = String(1 - k);
        bar.style.transform = "scaleX(" + k + ")";
        const left = Math.max(0, (SIZE_MB - sent) / 8.5);
        line1.textContent = "Sending to " + p.name + " · " + Math.round(k * 100) + "%";
        line2.textContent = sent.toFixed(1) + " of " + SIZE_MB + " MB · " + (left < 1 ? "almost done" : Math.ceil(left) + " s left");
        if (!calm() && total) {
          dots.forEach((d, j) => {
            const u = ((t - t0) / 700 + j / dots.length) % 1;
            const pt = path.getPointAtLength(u * total);
            d.setAttribute("cx", pt.x);
            d.setAttribute("cy", pt.y);
            d.style.opacity = String(Math.sin(u * Math.PI));
          });
        }
        if (sent >= SIZE_MB) { resolve(); return; }
        raf = requestAnimationFrame(step);
      }
      raf = requestAnimationFrame(step);
    });
    cancelAnimationFrame(raf);
    if (my !== token) return;

    // 4. Finish: the beam fades into the person, their avatar pops with a tick, rings and sparks
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    state = "done";
    cancelBtn.classList.remove("show");
    dots.forEach((d) => d.remove());
    play(path, [{ strokeDashoffset: 0 }, { strokeDashoffset: -1 }], { duration: 380, easing: "ease-in" }).then(() => { if (path.isConnected) path.remove(); });
    if (calm()) path.remove();
    p.btn.classList.add("done");
    play(p.btn.querySelector(".av"), [{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(.95)" }, { transform: "scale(1)" }], { duration: 560, easing: "ease-out" });
    const r = p.btn.querySelector(".av").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    for (let k = 0; k < 2; k++) {
      if (calm()) break;
      const pop = document.createElement("span");
      pop.className = "found-pop";
      pop.style.borderColor = "var(--ok)";
      p.btn.appendChild(pop);
      pop.animate([{ transform: "scale(1)", opacity: 0.9 }, { transform: "scale(2.6)", opacity: 0 }], { duration: 900, delay: k * 220, easing: "ease-out", fill: "backwards" }).onfinish = () => pop.remove();
    }
    line1.textContent = "Sent to " + p.name;
    line2.textContent = SIZE_MB + " MB in " + secs + " s · " + p.name + " saved 48 photos";
    radar.classList.remove("busy");
    if (sweepAnim && sweepAnim.updatePlaybackRate) sweepAnim.updatePlaybackRate(1);
    await wait(2400);
    if (my !== token) return;

    // 5. Reset
    reset(p);
    if (demoOn) queueDemo(1600);
  }

  function reset(p) {
    state = "idle";
    current = -1;
    p.spot.classList.remove("target");
    p.btn.classList.remove("done");
    const ringC = p.btn.querySelector(".ring circle");
    ringC.style.transition = "stroke-dashoffset .4s ease";
    ringC.style.strokeDashoffset = "1";
    bar.style.transform = "";
    line1.textContent = found + " people nearby";
    line2.textContent = "Tap someone to send the file";
  }

  cancelBtn.addEventListener("click", () => {
    if (state !== "sending") return;
    const p = PEOPLE[current];
    token++;
    cancelBtn.classList.remove("show");
    radar.classList.remove("busy");
    if (sweepAnim && sweepAnim.updatePlaybackRate) sweepAnim.updatePlaybackRate(1);
    const path = beam.querySelector("path");
    beam.querySelectorAll("circle").forEach((d) => d.remove());
    if (path) play(path, [{ strokeDashoffset: 0 }, { strokeDashoffset: 1 }], { duration: 300, easing: "ease-in" }).then(() => path.remove());
    play(p.btn.querySelector(".av"), [{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(4px)" }, { transform: "none" }], { duration: 320 });
    reset(p);
    line1.textContent = "Cancelled · nothing was sent to " + p.name;
    p.btn.focus();
  });

  function burst(x, y) {
    if (calm()) return;
    const cols = ["#22d3ee", "#a3e635", "#f472b6", "#facc15", "#ffffff"];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.left = x - 3 + "px";
      s.style.top = y - 3 + "px";
      s.style.background = cols[i % cols.length];
      document.body.appendChild(s);
      const a = (i / 18) * Math.PI * 2;
      const d = 34 + Math.random() * 30;
      s.animate([
        { transform: "translate(0,0) scale(1.3)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) scale(.4)", opacity: 0 }
      ], { duration: 700 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Auto-demo: beams the file to someone every few seconds while idle ----------
  let demoOn = true;
  let demoTimer = 0;
  let pickIndex = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  const ORDER = [0, 1, 3, 4, 2];
  function runDemo() {
    if (!demoOn) return;
    if (state !== "idle") { queueDemo(1200); return; }
    const i = ORDER[pickIndex++ % ORDER.length];
    if (!PEOPLE[i].spot.classList.contains("found")) { queueDemo(500); return; }
    send(i);
  }
  queueDemo(1300);
</script>
</body>
</html>
