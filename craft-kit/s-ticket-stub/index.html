<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #fde8ef;
    --stripe: rgba(255, 93, 143, 0.08);
    --card: #fffaf4;
    --ink: #231942;
    --muted: #7a6f8f;
    --line: rgba(35, 25, 66, 0.12);
    --pink: #ff5d8f;
    --pink-deep: #e23c72;
    --paper: #fff1dc;
    --paper-ink: #231942;
    --gold1: #ffd56b;
    --gold2: #f0a414;
    --ok: #12a37a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #120d22;
    --stripe: rgba(255, 93, 143, 0.06);
    --card: #1c1533;
    --ink: #f6eefc;
    --muted: #a99cc2;
    --line: rgba(246, 238, 252, 0.11);
    --pink: #ff6b9a;
    --pink-deep: #ff4f86;
    --paper: #2c2350;
    --paper-ink: #fff1dc;
    --gold1: #ffd56b;
    --gold2: #f0a414;
    --ok: #34d39e;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

  /* ---------- Stage: candy stripes under a soft spotlight ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; background: repeating-linear-gradient(-45deg, var(--stripe) 0 18px, transparent 18px 36px); }
  .stage::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(50% 50% at 50% 45%, var(--bg), transparent 85%); }
  .stage::after { content: ""; position: absolute; z-index: -1; width: 60vmin; height: 60vmin; left: 50%; top: 45%; margin: -30vmin 0 0 -30vmin; border-radius: 50%; background: radial-gradient(circle, rgba(255, 93, 143, 0.22), transparent 70%); animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.18); opacity: 0.7; } }

  /* ---------- Card ---------- */
  .card { width: min(460px, 100%); padding: 22px; border-radius: 26px; background: var(--card); box-shadow: 0 40px 70px -42px rgba(120, 20, 70, 0.5), 0 0 0 1px var(--line); animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
  .kicker { margin: 0; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pink-deep); }
  .card h1 { margin: 4px 0 6px; font-size: clamp(1.18rem, 5.4vw, 1.45rem); line-height: 1.15; letter-spacing: -0.01em; }
  .card h1 em { font-style: normal; color: var(--pink-deep); }
  .lead { margin: 0 0 18px; font-size: 0.88rem; line-height: 1.45; color: var(--muted); }

  /* ---------- Ticket ---------- */
  .ticket { --stub: 96px; position: relative; display: flex; height: 124px; filter: drop-shadow(0 14px 16px rgba(120, 20, 70, 0.22)); }
  .main { position: relative; flex: 1; min-width: 0; padding: 16px 18px; border-radius: 16px 0 0 16px; background: var(--paper); color: var(--paper-ink); -webkit-mask: radial-gradient(circle at 100% 0, transparent 11px, #000 11.5px), radial-gradient(circle at 100% 100%, transparent 11px, #000 11.5px); -webkit-mask-composite: source-in; mask-composite: intersect; overflow: hidden; }
  .main::before { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 93, 143, 0.18), transparent 70%); }
  .main small { display: block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.16em; color: var(--pink-deep); }
  .code { display: flex; margin: 8px 0 6px; font: 800 clamp(1.35rem, 6.4vw, 1.95rem) / 1 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 0.04em; }
  .code span { display: inline-block; }
  .valid { font-size: 0.74rem; opacity: 0.7; }
  .perf { position: absolute; right: 0; top: 14px; bottom: 14px; border-left: 2.5px dashed rgba(127, 100, 140, 0.45); }
  .cut { position: absolute; right: -2px; top: 0; bottom: 0; width: 5px; background: var(--card); transform: scaleY(0); transform-origin: 50% 0; }

  .stub { position: relative; width: var(--stub); flex: none; padding: 0; border: 0; background: none; cursor: pointer; perspective: 500px; }
  .stub:focus-visible { outline: none; }
  .stub:focus-visible .front { box-shadow: inset 0 0 0 3px var(--ink); }
  .flipper { position: absolute; inset: 0; transform-style: preserve-3d; }
  .front, .back { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; border-radius: 0 16px 16px 0; backface-visibility: hidden; -webkit-mask: radial-gradient(circle at 0 0, transparent 11px, #000 11.5px), radial-gradient(circle at 0 100%, transparent 11px, #000 11.5px); -webkit-mask-composite: source-in; mask-composite: intersect; }
  .front { background: var(--pink); color: #fff; }
  .back { background: var(--ok); color: #fff; transform: rotateY(180deg); }
  .front svg, .back svg { width: 26px; height: 26px; }
  .front b, .back b { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.14em; }
  .stub:hover .front svg { animation: wig 0.6s ease-in-out; }
  @keyframes wig { 30% { transform: rotate(-10deg); } 60% { transform: rotate(8deg); } }

  /* Scissors that travel down the perforation */
  .scissors { position: absolute; right: calc(var(--stub) - 16px); top: -20px; z-index: 3; width: 32px; height: 32px; color: var(--ink); opacity: 0; pointer-events: none; }
  .scissors svg { width: 32px; height: 32px; overflow: visible; }
  .blade { transform-box: view-box; transform-origin: 12px 12px; }

  /* ---------- Share row ---------- */
  .share { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .sb { display: flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 14px; background: transparent; text-decoration: none; font-size: 0.84rem; font-weight: 700; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), border-color 0.2s, background 0.2s; }
  .sb:hover { transform: translateY(-2px); border-color: var(--pink); }
  .sb:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .sb svg { width: 18px; height: 18px; flex: none; }

  /* ---------- Reward track ---------- */
  .track { margin-top: 18px; padding: 14px; border-radius: 18px; background: color-mix(in srgb, var(--pink) 9%, transparent); }
  .coins { display: flex; align-items: center; gap: 6px; }
  .coins .rail { flex: 1; height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
  .coins .rail i { position: absolute; inset: 0; background: var(--gold2); transform: scaleX(0); transform-origin: 0 50%; transition: transform 0.6s ease; }
  .coins .rail.on i { transform: scaleX(1); }
  .coin { position: relative; width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 0.64rem; font-weight: 900; color: transparent; border: 2px dashed var(--line); overflow: hidden; }
  .coin.full { border: 0; color: #6a4300; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold1) 40%, var(--gold2)); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.35), 0 4px 8px -4px rgba(150, 90, 0, 0.6); }
  .coin.full::after { content: ""; position: absolute; inset: -20%; background: linear-gradient(110deg, transparent 40%, rgba(255, 255, 255, 0.7) 50%, transparent 60%); transform: translateX(-120%); animation: sheen 4.5s ease-in-out infinite; animation-delay: calc(var(--i) * 0.25s); }
  @keyframes sheen { 0%, 70% { transform: translateX(-120%); } 90%, 100% { transform: translateX(120%); } }
  .coin.next { animation: wait 1.8s ease-in-out infinite; border-color: var(--gold2); }
  @keyframes wait { 50% { transform: scale(1.08); } }
  .track p { margin: 10px 0 0; font-size: 0.82rem; color: var(--muted); }
  .track p b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 40; display: inline-flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 0.86rem; font-weight: 700; transform: translate(-50%, 180%); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1); }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; color: var(--ok); flex: none; }
  .bit { position: fixed; z-index: 30; pointer-events: none; }
  .mini { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold1) 40%, var(--gold2)); }
  .spark { width: 7px; height: 7px; border-radius: 50%; }

  @media (max-width: 400px) {
    .lead { font-size: 0.84rem; }
    .card { padding: 18px 14px; }
    .ticket { --stub: 84px; }
    .main { padding: 14px; }
    .share { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .sb { gap: 5px; padding: 0 6px; font-size: 0.8rem; }
    .coin { width: 32px; height: 32px; }
  }
  @media (max-width: 359px) {
    .sb span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::after, .card, .coin.full::after, .coin.next, .stub:hover .front svg { animation: none; }
    .toast, .sb, .coins .rail i { transition-duration: 0.01s; }
    .bit, .scissors { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <p class="kicker">Refer a friend</p>
      <h1 id="title">Give <em>PKR 500</em>, get PKR 500</h1>
      <p class="lead">Friends get PKR 500 off their first order with your code. You get PKR 500 each time one of them orders.</p>

      <div class="ticket" id="ticket">
        <div class="main">
          <small>YOUR CODE</small>
          <div class="code" id="code" aria-label="Code AYESHA500"></div>
          <span class="valid">Valid till 31 December · any order</span>
          <span class="perf" aria-hidden="true"></span>
          <span class="cut" id="cut" aria-hidden="true"></span>
        </div>
        <button class="stub" id="stub" type="button" aria-label="Copy code AYESHA500">
          <span class="flipper" id="flipper">
            <span class="front" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2.5" /><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v9A2.5 2.5 0 0 0 6.5 17H8" /></svg>
              <b>COPY</b>
            </span>
            <span class="back" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg>
              <b>COPIED</b>
            </span>
          </span>
        </button>
        <span class="scissors" id="scissors" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <g class="blade b1"><circle cx="6" cy="5" r="3" /><path d="M8.1 7.1 20 21" /></g>
            <g class="blade b2"><circle cx="18" cy="5" r="3" /><path d="M15.9 7.1 12.9 10.6M10.9 13 4 21" /></g>
            <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" />
          </svg>
        </span>
      </div>

      <div class="share">
        <a class="sb" id="sms" href="#" aria-label="Send the code in a message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z" /></svg><span>Message</span></a>
        <a class="sb" id="mail" href="#" aria-label="Send the code by email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></svg><span>Email</span></a>
        <button class="sb" id="more" type="button" aria-label="Share the code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /></svg><span>Share</span></button>
      </div>

      <div class="track">
        <div class="coins" id="coins"></div>
        <p id="trackText"></p>
      </div>
    </section>
    <div class="toast" id="toast" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10" /></svg><span id="toastText"></span></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

<script>
  // ---------- Ticket Stub: a referral code whose stub is snipped, torn off and flipped to copy ----------
  const $ = (s) => document.querySelector(s);
  const CODE = "AYESHA500";
  const LINK = "https://shop.example/r/" + CODE;
  const codeEl = $("#code");
  const stub = $("#stub");
  const flipper = $("#flipper");
  const cut = $("#cut");
  const scissors = $("#scissors");
  const coinsEl = $("#coins");
  const trackText = $("#trackText");
  const toast = $("#toast");
  const toastText = $("#toastText");
  const status = $("#status");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { status.textContent = t; };
  let toastTimer = 0;
  function showToast(t) {
    toastText.textContent = t;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
  }

  // Code letters (each one hops during the copy)
  CODE.split("").forEach((c) => { const s = document.createElement("span"); s.textContent = c; s.setAttribute("aria-hidden", "true"); codeEl.appendChild(s); });

  // Share links
  const MSG = "Use my code " + CODE + " for PKR 500 off your first order: " + LINK;
  $("#sms").href = "sms:?&body=" + encodeURIComponent(MSG);
  $("#mail").href = "mailto:?subject=" + encodeURIComponent("PKR 500 off your first order") + "&body=" + encodeURIComponent(MSG);
  $("#more").addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: "PKR 500 off", text: MSG, url: LINK }); say("Shared"); } catch (e) { /* closed */ }
    } else tear(true);
  });

  // ---------- Reward track ----------
  const GOAL = 5;
  let joined = 3;
  function drawTrack() {
    coinsEl.innerHTML = "";
    for (let i = 0; i < GOAL; i++) {
      if (i) { const r = document.createElement("span"); r.className = "rail" + (i < joined ? " on" : ""); r.innerHTML = "<i></i>"; coinsEl.appendChild(r); }
      const c = document.createElement("span");
      c.className = "coin" + (i < joined ? " full" : i === joined ? " next" : "");
      c.style.setProperty("--i", i);
      c.textContent = "500";
      coinsEl.appendChild(c);
    }
    coinsEl.setAttribute("aria-hidden", "true");
    trackText.innerHTML = "<b>" + joined + " of " + GOAL + "</b> friends joined · <b>PKR " + (joined * 500).toLocaleString("en-US") + "</b> earned";
  }
  drawTrack();

  // ---------- Clipboard ----------
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  // ---------- Tear: snip down the perforation, tear the stub, flip it, then a fresh one slides in ----------
  let busy = false;
  async function tear(real) {
    if (busy) return;
    busy = true;
    const ok = real ? await writeClipboard(CODE) : true;

    // 1. Anticipation: the stub leans and the scissors appear at the top of the perforation
    play(stub, [{ transform: "rotate(0)" }, { transform: "rotate(3deg) translateX(2px)" }, { transform: "rotate(0)" }], { duration: 300, easing: "ease-out" });
    if (!calm()) {
      await play(scissors, [{ opacity: 0, transform: "translateY(-14px) scale(.6) rotate(-20deg)" }, { opacity: 1, transform: "translateY(0) scale(1) rotate(0)" }], { duration: 300, easing: "cubic-bezier(.3,1.6,.5,1)" });
      scissors.style.opacity = "1";

      // 2. Snip, snip: the scissors travel down while the blades open and close and the cut opens behind them
      const h = stub.offsetHeight + 8;
      const snips = 4;
      const b1 = scissors.querySelector(".b1"), b2 = scissors.querySelector(".b2");
      const cutting = [];
      cutting.push(play(scissors, [{ transform: "translateY(0)" }, { transform: "translateY(" + h + "px)" }], { duration: 760, easing: "cubic-bezier(.4,0,.6,1)", fill: "forwards" }));
      cutting.push(play(cut, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 760, easing: "cubic-bezier(.4,0,.6,1)", fill: "forwards" }));
      for (let i = 0; i < snips; i++) {
        play(b1, [{ transform: "rotate(0)" }, { transform: "rotate(16deg)" }, { transform: "rotate(0)" }], { duration: 190, delay: i * 190 });
        play(b2, [{ transform: "rotate(0)" }, { transform: "rotate(-16deg)" }, { transform: "rotate(0)" }], { duration: 190, delay: i * 190 });
      }
      await Promise.all(cutting);
      play(scissors, [{ opacity: 1 }, { opacity: 0, transform: "translateY(" + (h + 16) + "px) rotate(25deg)" }], { duration: 220, fill: "forwards" }).then(() => {
        scissors.getAnimations().forEach((a) => a.cancel());
        scissors.style.opacity = "0";
      });
    }

    // 3. Tear: the stub swings away from the ticket and flips over to show COPIED
    const t = stub.getBoundingClientRect();
    coinBurst(t.left, t.top + t.height / 2, 5);
    if (!calm()) {
      await play(stub, [
        { transform: "translate(0,0) rotate(0)" },
        { transform: "translate(6px,-4px) rotate(-6deg)", offset: 0.3 },
        { transform: "translate(22px,10px) rotate(9deg)" }
      ], { duration: 360, easing: "cubic-bezier(.3,.7,.3,1.2)", fill: "forwards" });
    }
    // the code letters hop one after another while it is copied
    [...codeEl.children].forEach((s, i) => play(s, [{ transform: "none" }, { transform: "translateY(-7px)", color: "#ff5d8f" }, { transform: "none" }], { duration: 420, delay: i * 40, easing: "ease-out" }));
    flipper.style.transition = calm() ? "none" : "transform .6s cubic-bezier(.3,1.4,.4,1)";
    flipper.style.transform = "rotateY(180deg)";
    stub.setAttribute("aria-label", ok ? "Code copied" : "Copy blocked");
    say(ok ? "Code " + CODE + " copied" : "Could not copy, select the code instead");
    showToast(ok ? "Code " + CODE + " copied · paste it anywhere" : "Copy blocked · select the code");
    await wait(calm() ? 900 : 1100);

    // 4. The torn stub floats up and away with a sparkle
    if (!calm()) {
      const r = stub.getBoundingClientRect();
      sparkle(r.left + r.width / 2, r.top + r.height / 2);
      await play(stub, [
        { transform: "translate(22px,10px) rotate(9deg)", opacity: 1 },
        { transform: "translate(40px,-60px) rotate(-8deg) scale(.8)", opacity: 0 }
      ], { duration: 460, easing: "cubic-bezier(.5,0,.7,.4)", fill: "forwards" });
    }

    // 5. Reset: a fresh stub slides in from the right and the perforation closes again
    stub.getAnimations().forEach((a) => a.cancel());
    flipper.style.transition = "none";
    flipper.style.transform = "";
    cut.getAnimations().forEach((a) => a.cancel());
    stub.setAttribute("aria-label", "Copy code " + CODE);
    await play(stub, [{ transform: "translateX(70px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 640, easing: SPRING });
    busy = false;
  }
  stub.addEventListener("click", () => tear(true));

  // Little PKR coins pop out of the tear; sparkles where the stub flies off
  function coinBurst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const c = document.createElement("i");
      c.className = "bit mini";
      c.style.left = x - 9 + "px";
      c.style.top = y - 9 + "px";
      document.body.appendChild(c);
      const dx = 20 + Math.random() * 60;
      const up = 40 + Math.random() * 50;
      c.animate([
        { transform: "translate(0,0) scale(.4) rotateY(0)", opacity: 1 },
        { transform: "translate(" + dx * 0.6 + "px," + -up + "px) scale(1) rotateY(360deg)", opacity: 1, offset: 0.45 },
        { transform: "translate(" + dx + "px," + (40 + Math.random() * 30) + "px) scale(.7) rotateY(720deg)", opacity: 0 }
      ], { duration: 900 + Math.random() * 300, delay: i * 50, easing: "cubic-bezier(.3,.6,.5,1)", fill: "backwards" }).onfinish = () => c.remove();
    }
  }
  function sparkle(x, y) {
    if (calm()) return;
    const cols = ["#ff5d8f", "#ffd56b", "#34d39e", "#ffffff"];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("i");
      s.className = "bit spark";
      s.style.left = x - 3.5 + "px";
      s.style.top = y - 3.5 + "px";
      s.style.background = cols[i % cols.length];
      document.body.appendChild(s);
      const a = (i / 14) * Math.PI * 2;
      const d = 26 + Math.random() * 34;
      s.animate([
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) scale(.3)", opacity: 0 }
      ], { duration: 700 + Math.random() * 200, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // A friend uses the code: a coin drops into the next slot (shown in the auto-demo)
  async function friendJoins(name) {
    if (joined >= GOAL) { joined = 3; drawTrack(); await wait(400); }
    const slots = coinsEl.querySelectorAll(".coin");
    const c = slots[joined];
    const rail = c.previousElementSibling;
    joined++;
    c.className = "coin full";
    play(c, [{ transform: "translateY(-46px) rotateY(0) scale(.6)", opacity: 0 }, { transform: "translateY(4px) rotateY(540deg) scale(1.1)", opacity: 1, offset: 0.7 }, { transform: "translateY(0) rotateY(720deg) scale(1)" }], { duration: 760, easing: "ease-out" });
    if (rail) rail.classList.add("on");
    if (slots[joined]) slots[joined].classList.add("next");
    trackText.innerHTML = "<b>" + joined + " of " + GOAL + "</b> friends joined · <b>PKR " + (joined * 500).toLocaleString("en-US") + "</b> earned";
    const r = c.getBoundingClientRect();
    sparkle(r.left + r.width / 2, r.top + r.height / 2);
    showToast(name + " used your code · +PKR 500");
    say(name + " used your code. You earned PKR 500.");
  }

  // ---------- Auto-demo: snip and copy every few seconds; every other round a friend joins ----------
  let demoOn = true;
  let demoTimer = 0;
  let round = 0;
  const FRIENDS = ["Bilal", "Hina", "Omar", "Sana"];
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demoOn) return;
    if (busy) { queueDemo(1200); return; }
    await tear(false);
    if (!demoOn) return;
    if (round++ % 2 === 0) { await wait(700); if (demoOn) await friendJoins(FRIENDS[(round >> 1) % FRIENDS.length]); }
    queueDemo(2600);
  }
  queueDemo(420);
</script>
</body>
