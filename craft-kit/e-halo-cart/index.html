<!doctype html>
<!-- Chill and Craft · Halo Cart · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Cart · Chill and Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #eeeae5;
    --card: #fbfaf8;
    --ink: #1c1b1a;
    --muted: #77716a;
    --line: #e2ddd6;
    --core: #1c1b1a;
    --on-core: #fbfaf8;
    --coral: #ff5d4a;
    --ok: #1fae6b;
    --wax: #f2b33d;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #131211;
    --card: #1e1c1b;
    --ink: #f3efe9;
    --muted: #a69f96;
    --line: #34302d;
    --core: #f3efe9;
    --on-core: #1c1b1a;
    --coral: #ff7a6a;
    --ok: #34d17f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--stage);
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .card {
    width: 100%; max-width: 330px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 30px;
    padding: 14px;
    box-shadow: 0 24px 50px -30px rgba(0, 0, 0, .45);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 12px; }
  .brand { font-weight: 800; letter-spacing: .14em; font-size: 12px; text-transform: uppercase; }
  .total {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700;
    padding: 6px 10px; border-radius: 999px;
    background: var(--stage);
  }
  .total .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
  .total.pop { animation: pop .55s var(--spring); }
  .total.pop .dot { animation: dotPulse .6s ease-out; }
  @keyframes pop { 30% { transform: scale(.9) rotate(-3deg); } 60% { transform: scale(1.1) rotate(2deg); } }
  @keyframes dotPulse { 0% { box-shadow: 0 0 0 0 var(--coral); } 100% { box-shadow: 0 0 0 10px transparent; } }

  /* ---------- Candle picture ---------- */
  .art {
    position: relative;
    height: 200px;
    border-radius: 22px;
    background:
      radial-gradient(circle at 50% 38%, rgba(255, 196, 92, .45), transparent 55%),
      linear-gradient(180deg, #2a2522, #3b332d);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .art::after { /* warm halo that breathes */
    content: ""; position: absolute; left: 50%; top: 22%; width: 120px; height: 120px; margin-left: -60px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255, 195, 92, .35), transparent 70%);
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.18); opacity: .7; } }
  .art svg { position: relative; z-index: 1; width: 130px; height: 170px; transition: transform .6s var(--spring); }
  .art:hover svg { transform: translateY(-6px) rotate(-3deg); }
  .wax { fill: var(--wax); transition: fill .45s; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
  .art:hover .flame { animation-duration: .6s; }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    30% { transform: scale(.92, 1.08) rotate(3deg); }
    60% { transform: scale(1.05, .95) rotate(-1deg); }
  }
  .art.swap svg { animation: swap .5s var(--spring); }
  @keyframes swap { 40% { transform: scale(.9, 1.06); } }

  .info { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 14px 6px 4px; }
  h1 { margin: 0; font-size: 18px; line-height: 1.2; }
  .price { margin: 4px 0 0; font-size: 17px; font-weight: 800; }
  .price small { font-size: 12px; font-weight: 500; color: var(--muted); }
  #price { display: inline-block; }
  #price.tick { animation: tick .4s var(--spring); }
  @keyframes tick { from { transform: translateY(-8px); opacity: 0; } }

  fieldset { border: 0; margin: 10px 0 0; padding: 0 6px; }
  legend { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .scents { display: flex; gap: 8px; flex-wrap: wrap; }
  .scents label { position: relative; }
  .scents input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .scents span {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px 6px 6px; border-radius: 999px;
    border: 1.5px solid var(--line);
    font-size: 13px; font-weight: 650;
    transition: transform .4s var(--spring), border-color .2s;
  }
  .scents label:hover span { transform: translateY(-2px); }
  .scents span::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--c); transition: transform .4s var(--spring); }
  .scents input:checked + span { border-color: var(--ink); }
  .scents input:checked + span::before { transform: scale(1.25); }
  .scents input:focus-visible + span { outline: 3px solid var(--coral); outline-offset: 2px; }

  /* ---------- The round button ---------- */
  .halo {
    position: relative;
    width: 88px; height: 88px;
    padding: 0; border: 0; background: none;
    border-radius: 50%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .halo:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .halo[aria-disabled="true"] { cursor: default; }
  .ring { position: absolute; inset: 0; width: 88px; height: 88px; transform: rotate(-90deg); transition: opacity .3s; }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: var(--line); transform-box: fill-box; transform-origin: center; transition: stroke .3s; }
  .halo:not([aria-disabled]):hover .track { stroke: var(--coral); stroke-dasharray: 3 7; animation: turn 6s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .ring .prog { stroke: var(--coral); stroke-linecap: round; stroke-dasharray: 239; stroke-dashoffset: 239; }
  /* Glowing dot that leads the ring as it fills */
  .lead { position: absolute; inset: 0; opacity: 0; }
  .lead::before { content: ""; position: absolute; left: 50%; top: 3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--coral), 0 0 14px var(--coral); }
  .core {
    position: absolute; left: 12px; top: 12px; width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--core); color: var(--on-core);
    overflow: hidden;
    display: grid; place-items: center;
    transition: background .3s, transform .45s var(--spring), box-shadow .3s;
  }
  .halo:not([aria-disabled]):hover .core { transform: scale(1.06); box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .5); }
  .halo:active .core { transform: scale(.88); transition-duration: .08s; }
  .core svg { position: absolute; width: 30px; height: 30px; }
  .cart-ico { transition: transform .2s; }
  .halo:not([aria-disabled]):hover .cart-ico { animation: nudge .6s ease; }
  @keyframes nudge { 30% { transform: translateX(3px) rotate(-8deg); } 60% { transform: translateX(-2px); } }
  .check-ico path { stroke-dasharray: 26; stroke-dashoffset: 26; }

  /* 1. Anticipation: the core squashes */
  .halo.is-press .core { animation: squish .35s var(--spring); }
  @keyframes squish { 35% { transform: scale(.82); } 70% { transform: scale(1.06); } }
  /* 2. Ring fills with a leading dot, cart engine shakes */
  .halo.is-filling .ring .prog { stroke-dashoffset: 0; transition: stroke-dashoffset 1s cubic-bezier(.6, .1, .4, 1); }
  .halo.is-filling .lead { opacity: 1; transform: rotate(360deg); transition: transform 1s cubic-bezier(.6, .1, .4, 1), opacity .15s; }
  .halo.is-filling .cart-ico { animation: idle .12s linear infinite; }
  @keyframes idle { 50% { transform: translate(.6px, -.8px); } }

  /* 3. Cart drives out, check draws in, ring turns green */
  .halo.is-done .lead { opacity: 0; }
  .halo.is-done .core { background: var(--ok); color: #fff; animation: bounce .55s var(--spring); }
  .halo.is-done .ring .prog { stroke: var(--ok); }
  .halo.is-done .cart-ico { animation: away .45s cubic-bezier(.6, 0, .9, .4) forwards; }
  .halo.is-done .check-ico path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s ease-out .25s; }
  .halo.is-done .ring { animation: pulse .55s ease-out; }
  @keyframes away {
    0% { transform: none; }
    25% { transform: translateX(-6px) rotate(8deg); }
    100% { transform: translateX(60px) rotate(-8deg); }
  }
  @keyframes bounce { 30% { transform: scale(1.15); } 60% { transform: scale(.95); } }
  @keyframes pulse { 50% { transform: rotate(-90deg) scale(1.1); } }

  /* 4. Fade the ring, bring the cart back from the left */
  .halo.is-fading .ring { opacity: 0; }
  .halo.is-fading .check-ico { opacity: 0; transition: opacity .25s; }
  .halo.is-back .cart-ico { animation: back .5s cubic-bezier(.2, .9, .3, 1.3); }
  @keyframes back { from { transform: translateX(-60px); } }

  /* Burst of dots around the ring */
  .burst { position: absolute; left: 44px; top: 44px; pointer-events: none; }
  .burst i { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); opacity: 0; }
  .burst i:nth-child(even) { background: var(--ok); }
  .halo.is-done .burst i { animation: burst .65s ease-out; }
  @keyframes burst {
    from { opacity: 1; transform: rotate(var(--a)) translateY(-40px) scale(1); }
    to { opacity: 0; transform: rotate(var(--a)) translateY(-64px) scale(.3); }
  }

  /* Mini candle that flies to the cart total (made by script) */
  .fly { position: fixed; z-index: 30; width: 26px; height: 34px; margin: -17px 0 0 -13px; pointer-events: none; }
  .bit { position: fixed; z-index: 30; width: 6px; height: 9px; margin: -4px 0 0 -3px; border-radius: 2px; pointer-events: none; }

  .status { margin: 12px 6px 4px; font-size: 12.5px; color: var(--muted); min-height: 1.5em; }
  .status.tick { animation: tick .4s var(--spring); }
  .link { border: 0; background: none; padding: 0; color: var(--ink); font: 700 12.5px system-ui, sans-serif; text-decoration: underline; cursor: pointer; }
  .link:hover { color: var(--coral); }
  .link:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .halo.is-done .cart-ico { opacity: 0; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="pName">
    <div class="head">
      <span class="brand">Mehak Candles</span>
      <span class="total" id="total"><span class="dot" aria-hidden="true"></span><span id="totalText">Cart empty</span></span>
    </div>

    <div class="art" id="art" aria-hidden="true">
      <!-- Candle in a glass jar -->
      <svg viewBox="0 0 130 170" id="candle">
        <path class="flame" d="M65 22c8 10 9 18 0 26-9-8-8-16 0-26Z" fill="#ffc35c"/>
        <path d="M65 34c3 4 3 8 0 11-3-3-3-7 0-11Z" fill="#fff4d6"/>
        <path d="M65 48v10" stroke="#2a2522" stroke-width="2"/>
        <rect x="26" y="56" width="78" height="100" rx="16" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
        <path class="wax" d="M30 74c12 4 24-4 35 0s24 4 35 0v62a14 14 0 0 1-14 14H44a14 14 0 0 1-14-14Z"/>
        <rect x="38" y="100" width="54" height="26" rx="5" fill="#fbfaf8"/>
        <path d="M46 110h38M52 117h26" stroke="#1c1b1a" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M36 64v70" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="info">
      <div>
        <h1 id="pName">Soy Jar Candle</h1>
        <p class="price"><span id="price">Rs 1,850</span> <small>· 40 hour burn</small></p>
      </div>
      <button class="halo" id="halo" type="button" aria-label="Add Saffron candle to cart, Rs 1,850">
        <svg class="ring" viewBox="0 0 88 88" aria-hidden="true">
          <circle class="track" cx="44" cy="44" r="38"/>
          <circle class="prog" cx="44" cy="44" r="38"/>
        </svg>
        <span class="lead" aria-hidden="true"></span>
        <span class="core" aria-hidden="true">
          <svg class="cart-ico" viewBox="0 0 30 30"><path d="M3 6h3.5l2.6 12.5h12.6L24.5 10H8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11.5" cy="23" r="2" fill="currentColor"/><circle cx="20" cy="23" r="2" fill="currentColor"/></svg>
          <svg class="check-ico" viewBox="0 0 30 30"><path d="m7 15.5 5.5 5.5L23.5 9.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="burst" aria-hidden="true">
          <i style="--a:0deg"></i><i style="--a:45deg"></i><i style="--a:90deg"></i><i style="--a:135deg"></i>
          <i style="--a:180deg"></i><i style="--a:225deg"></i><i style="--a:270deg"></i><i style="--a:315deg"></i>
        </span>
      </button>
    </div>

    <fieldset>
      <legend>Scent</legend>
      <div class="scents">
        <label><input type="radio" name="scent" value="saffron" checked><span style="--c:#f2b33d">Saffron</span></label>
        <label><input type="radio" name="scent" value="jasmine"><span style="--c:#f3e7c9">Jasmine</span></label>
        <label><input type="radio" name="scent" value="oud"><span style="--c:#7a4a2e">Oud</span></label>
      </div>
    </fieldset>

    <p class="status" id="status">Pick a scent, then tap the round button.</p>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const SCENTS = {
      saffron: { name: "Saffron", price: 1850, wax: "#f2b33d" },
      jasmine: { name: "Jasmine", price: 1650, wax: "#f3e7c9" },
      oud: { name: "Oud", price: 2250, wax: "#7a4a2e" }
    };
    let cart = {}; // scent -> qty
    let busy = false;

    const $ = (id) => document.getElementById(id);
    const halo = $("halo"), art = $("art"), priceEl = $("price"), totalEl = $("total");
    const totalText = $("totalText"), statusEl = $("status"), live = $("live");

    const money = (n) => "Rs " + n.toLocaleString("en-US");
    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 80) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps the done state readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const current = () => document.querySelector('input[name="scent"]:checked').value;

    // Scent picker: recolour the wax and update the price and button label
    function paintScent(animate) {
      const s = SCENTS[current()];
      document.documentElement.style.setProperty("--wax", s.wax);
      priceEl.textContent = money(s.price);
      halo.setAttribute("aria-label", "Add " + s.name + " candle to cart, " + money(s.price));
      if (animate) { replay(art, "swap"); replay(priceEl, "tick"); }
    }
    document.querySelectorAll('input[name="scent"]').forEach((r) => r.addEventListener("change", () => paintScent(true)));

    // Cart summary in the header and under the card
    function paintCart() {
      let count = 0, sum = 0;
      const parts = [];
      Object.keys(cart).forEach((k) => {
        count += cart[k];
        sum += cart[k] * SCENTS[k].price;
        parts.push(SCENTS[k].name + " ×" + cart[k]);
      });
      totalText.textContent = count ? count + " · " + money(sum) : "Cart empty";
      statusEl.textContent = "";
      replay(statusEl, "tick");
      if (!count) { statusEl.textContent = "Pick a scent, then tap the round button."; return; }
      statusEl.append("In cart: " + parts.join(", ") + " · ");
      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "link";
      clear.textContent = "Clear";
      clear.addEventListener("click", () => {
        cart = {};
        paintCart();
        replay(totalEl, "pop");
        halo.focus();
        live.textContent = "Cart cleared.";
      });
      statusEl.append(clear);
    }

    // A tiny candle flies from the picture to the cart total
    function flyToTotal(wax) {
      return new Promise((resolve) => {
        if (RM || !art.animate) { resolve(); return; }
        const a = art.getBoundingClientRect(), b = totalEl.getBoundingClientRect();
        const f = document.createElement("span");
        f.className = "fly";
        f.innerHTML = '<svg viewBox="0 0 26 34"><path d="M13 1c4 5 4 8 0 11-4-3-4-6 0-11Z" fill="#ffc35c"/><rect x="3" y="12" width="20" height="21" rx="5" fill="' + wax + '" stroke="#fff" stroke-width="1.5"/></svg>';
        f.style.left = a.left + a.width / 2 + "px";
        f.style.top = a.top + a.height / 2 + "px";
        document.body.appendChild(f);
        const dx = b.left + 12 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
        f.animate([
          { transform: "translate(0,0) scale(.6) rotate(0)", opacity: 0 },
          { transform: "translate(0,-20px) scale(1.4) rotate(-10deg)", opacity: 1, offset: 0.2 },
          { transform: `translate(${dx * 0.6}px,${dy - 50}px) scale(1) rotate(12deg)`, opacity: 1, offset: 0.6 },
          { transform: `translate(${dx}px,${dy}px) scale(.3) rotate(0)`, opacity: 0.4 }
        ], { duration: 800, easing: "cubic-bezier(.45,0,.3,1)" }).onfinish = () => { f.remove(); resolve(); };
      });
    }

    // A few sparks around the cart total when the candle lands
    function sparks(el) {
      if (RM || !el.animate) return;
      const r = el.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        const b = document.createElement("i");
        b.className = "bit";
        b.style.left = r.left + 14 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = i % 2 ? "var(--coral)" : "#ffc35c";
        document.body.appendChild(b);
        const a = (Math.PI * 2 * i) / 10, d = 24 + Math.random() * 18;
        b.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) rotate(200deg) scale(.4)`, opacity: 0 }
        ], { duration: 600, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => b.remove();
      }
    }

    halo.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      const key = current();
      halo.setAttribute("aria-disabled", "true");
      halo.classList.remove("is-back");
      live.textContent = "Adding " + SCENTS[key].name + " candle…";

      // 1. Anticipation
      replay(halo, "is-press");
      await wait(220);
      // 2. Progress: the ring fills with a glowing lead dot
      halo.classList.add("is-filling");
      await wait(1000);
      // 3. Cart drives out, check, burst, and a candle flies to the total
      halo.classList.add("is-done");
      const landed = flyToTotal(SCENTS[key].wax);
      await landed;
      cart[key] = (cart[key] || 0) + 1;
      paintCart();
      replay(totalEl, "pop");
      sparks(totalEl);
      live.textContent = SCENTS[key].name + " candle added. Cart: " + totalText.textContent + ".";
      await hold(900);
      // 4. Fade the ring, then reset with the cart rolling back
      halo.classList.add("is-fading");
      await wait(320);
      halo.classList.remove("is-press", "is-filling", "is-done", "is-fading");
      halo.classList.add("is-back");
      halo.removeAttribute("aria-disabled");
      busy = false;
    });

    paintScent(false);
  })();
</script>
</body>
</html>
