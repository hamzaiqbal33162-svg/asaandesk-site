<!doctype html>
<!-- Chill & Craft · Wax Seal · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wax Seal · envelope code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #efe5d6;
    --text: #3a2a1c;
    --muted: #7b6550;
    --env: #d7b083;
    --env-back: #c49a6c;
    --env-line: rgba(90, 55, 25, .18);
    --letter: #fffaf0;
    --ink: #1f2a44;
    --line: #c9bba3;
    --wax: #9b1c31;
    --wax-dark: #6d1022;
    --wax-light: #d25a6c;
    --good: #2f6f3e;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #15110d;
    --text: #f1e6d4;
    --muted: #b9a38a;
    --env: #7a5539;
    --env-back: #5c3e28;
    --env-line: rgba(0, 0, 0, .3);
    --letter: #f4ecda;
    --wax: #b4243b;
    --wax-dark: #7c1527;
    --wax-light: #e57c8c;
    --good: #8fd6a0;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    color: var(--text);
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--stage) 80%, #fff 20%), var(--stage) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .desk { width: min(100%, 360px); text-align: center; }
  h1 { margin: 0 0 4px; font: 700 clamp(21px, 5.6vw, 26px) / 1.2 ui-serif, Georgia, "Times New Roman", serif; }
  .sub { margin: 0; font-size: 14px; color: var(--muted); }

  /* ---------- The envelope ---------- */
  .envelope {
    position: relative;
    height: 196px;
    margin: 118px 0 18px;          /* room for the letter that sticks out */
    perspective: 900px;
  }
  .env-back {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: var(--env-back);
    box-shadow: 0 20px 34px -18px rgba(40, 20, 5, .6);
  }
  /* Top flap: open (pointing up, behind the letter) until the code is right */
  .flap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 52%;
    z-index: 1;
    background: linear-gradient(180deg, var(--env-back), var(--env));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transform: rotateX(180deg);
    transition: transform .55s cubic-bezier(.5, 0, .3, 1);
  }
  .letter {
    position: absolute;
    left: 16px;
    right: 16px;
    top: -102px;
    height: 172px;
    z-index: 2;
    padding: 12px 10px 0;
    border-radius: 4px;
    background: var(--letter);
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(40, 20, 5, .18);
    transition: transform .6s cubic-bezier(.5, 0, .3, 1);
  }
  .letter-head {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #8a7a62;
  }
  .sign { margin: 14px 0 0; font: italic 14px ui-serif, Georgia, serif; color: #8a7a62; }
  /* Front pocket with a V cut, so the letter shows through */
  .pocket {
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: 8px;
    background:
      linear-gradient(to top right, transparent calc(50% - 1px), var(--env-line) 50%, transparent calc(50% + 1px)),
      linear-gradient(to top left, transparent calc(50% - 1px), var(--env-line) 50%, transparent calc(50% + 1px)),
      var(--env);
    clip-path: polygon(0 0, 50% 47%, 100% 0, 100% 100%, 0 100%);
    pointer-events: none;
  }

  /* ---------- Ink digits on the letter ---------- */
  .digits { display: flex; justify-content: center; gap: 12px; }
  .digits input {
    width: 48px;
    height: 54px;
    padding: 0;
    border: 0;
    border-bottom: 2px dashed var(--line);
    border-radius: 6px 6px 0 0;
    background: transparent;
    color: var(--ink);
    caret-color: var(--wax);
    text-align: center;
    font: 700 32px/1 ui-serif, Georgia, "Times New Roman", serif;
    transition: border-color .2s, background .2s;
  }
  .digits input:focus { outline: none; background: rgba(155, 28, 49, .07); border-bottom: 2px solid var(--wax); }
  .digits input:hover:not(:focus):not(:disabled) { background: rgba(31, 42, 68, .05); border-bottom-style: solid; }
  .digits input:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); }
  .digits input.inked { border-bottom: 2px solid var(--ink); animation: ink .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes ink {
    0% { filter: blur(4px); transform: scale(1.45) rotate(-8deg); opacity: .3; }
    45% { filter: none; opacity: 1; }
    100% { transform: none; }
  }
  .letter.smudge { animation: shake .45s ease; }
  .letter.smudge input { color: var(--wax); -webkit-text-fill-color: var(--wax); border-bottom-color: var(--wax); }
  @keyframes shake {
    20%, 60% { transform: translateX(-7px) rotate(-1deg); }
    40%, 80% { transform: translateX(7px) rotate(1deg); }
  }

  /* ---------- Sealing steps ---------- */
  .envelope.tucked .letter { transform: translateY(112px); }      /* 1: letter goes in */
  .envelope.closed .flap { z-index: 4; transform: rotateX(0); }  /* 2: flap closes */
  .seal {                                                        /* 3: wax seal stamps */
    position: absolute;
    left: 50%;
    top: 52%;
    z-index: 5;
    width: 70px;
    height: 70px;
    margin: -35px 0 0 -35px;
    opacity: 0;
    transform: scale(2.2) rotate(-25deg);
    pointer-events: none;
  }
  .envelope.sealed .seal {
    opacity: 1;
    transform: scale(1) rotate(0);
    transition: transform .4s cubic-bezier(.2, 1.5, .5, 1), opacity .15s;
  }
  .seal svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 4px rgba(50, 10, 15, .45)); }
  /* Stamp ripple, then the whole envelope bounces like it was pressed */
  .seal::before, .seal::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 3px solid var(--wax);
    opacity: 0;
  }
  .envelope.sealed .seal::before { animation: ripple .8s ease-out .3s; }
  .envelope.sealed .seal::after { animation: ripple .9s ease-out .45s; border-color: var(--wax-light); }
  @keyframes ripple { from { opacity: .8; transform: scale(.8); } to { opacity: 0; transform: scale(2.6); } }
  .envelope.cheer { animation: envHop .9s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes envHop {
    25% { transform: translateY(6px) scaleY(.94) scaleX(1.03); }
    60% { transform: translateY(-12px) rotate(-2.5deg); }
  }

  /* ---------- Status, hint and buttons ---------- */
  .status { min-height: 22px; margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--good); }
  .status[data-tone="bad"] { color: var(--wax-light); }
  [data-theme="light"] .status[data-tone="bad"] { color: var(--wax); }
  .hint { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  .hint b { font: 700 18px ui-serif, Georgia, serif; letter-spacing: .3em; color: var(--text); }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  .ghost { background: transparent; border: 1.5px solid var(--muted); color: var(--text); }
  .ghost:disabled { opacity: .5; cursor: default; }
  .solid { border: 0; background: var(--wax); color: #fff3f0; }
  button:focus-visible { outline: 3px solid var(--wax-light); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, background .2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  .solid:hover { box-shadow: 0 8px 18px -8px var(--wax); }
  .ghost:hover:not(:disabled) { background: rgba(155, 28, 49, .08); }
  button:active:not(:disabled) { transform: scale(.94); transition-duration: .08s; }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Particles: ink splashes and wax sparks ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <main class="desk">
    <h1 id="title">Seal your sign-in</h1>
    <p class="sub">Write the 4-digit code we emailed to z.ahmed@…</p>

    <div class="envelope" id="env">
      <div class="env-back"></div>
      <div class="flap"></div>
      <div class="letter" id="letter">
        <p class="letter-head">Your sign-in code</p>
        <!-- Four ink lines, each one a real input -->
        <div class="digits" role="group" aria-labelledby="title" aria-describedby="hint">
          <input inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 4">
          <input inputmode="numeric" autocomplete="off" aria-label="Digit 2 of 4">
          <input inputmode="numeric" autocomplete="off" aria-label="Digit 3 of 4">
          <input inputmode="numeric" autocomplete="off" aria-label="Digit 4 of 4">
        </div>
        <p class="sign">With care, the Sign-in Desk</p>
      </div>
      <div class="pocket"></div>
      <div class="seal" aria-hidden="true">
        <!-- Wax blob with a pressed-in check mark -->
        <svg viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="30" fill="var(--wax)"/>
          <circle cx="12" cy="20" r="7" fill="var(--wax)"/>
          <circle cx="58" cy="18" r="6" fill="var(--wax)"/>
          <circle cx="62" cy="47" r="7" fill="var(--wax)"/>
          <circle cx="20" cy="60" r="6.5" fill="var(--wax)"/>
          <circle cx="44" cy="63" r="5" fill="var(--wax)"/>
          <circle cx="35" cy="35" r="21" fill="none" stroke="var(--wax-dark)" stroke-width="3"/>
          <circle cx="35" cy="35" r="21" fill="none" stroke="var(--wax-light)" stroke-width="1" opacity=".55" transform="translate(-1 -1)"/>
          <path d="M25 36l7 7 13-15" fill="none" stroke="var(--wax-dark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 36l7 7 13-15" fill="none" stroke="var(--wax-light)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".7" transform="translate(-1 -1.2)"/>
        </svg>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Demo code: <b id="demo"></b></p>
    <div class="actions">
      <button type="button" class="ghost" id="resend">Email a new code</button>
      <button type="button" class="solid" id="again" hidden>Open a new letter</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const env = document.getElementById("env");
  const letter = document.getElementById("letter");
  const boxes = Array.from(letter.querySelectorAll("input"));
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");
  let demo = "";
  let busy = false;

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo;
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    statusEl.classList.remove("pop");
    void statusEl.offsetWidth;
    statusEl.classList.add("pop");
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    boxes[i].classList.remove("inked");
    if (d) {
      void boxes[i].offsetWidth;            // restart the ink animation
      boxes[i].classList.add("inked");
      splash(boxes[i], 7, ["#1f2a44", "#34405f"], [10, 26], [2, 4.5], 500);   // ink drops
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
    }
  }

  // ---- Particles: little drops flying out of an element ----
  const fx = document.getElementById("fx");
  function splash(from, count, colors, dist, size, time) {
    if (reduce) return;
    const r = from.getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    for (let n = 0; n < count; n++) {
      const p = document.createElement("i");
      const s = size[0] + Math.random() * (size[1] - size[0]);
      p.style.width = p.style.height = s + "px";
      p.style.background = colors[n % colors.length];
      fx.append(p);
      const angle = Math.random() * Math.PI * 2;
      const d = dist[0] + Math.random() * (dist[1] - dist[0]);
      const at = (x, y, k) => "translate(" + (x - s / 2) + "px," + (y - s / 2) + "px) scale(" + k + ")";
      p.animate([
        { transform: at(x0, y0, 0.3), opacity: 1 },
        { transform: at(x0 + Math.cos(angle) * d, y0 + Math.sin(angle) * d, 1), opacity: 1, offset: 0.55 },
        { transform: at(x0 + Math.cos(angle) * d * 1.15, y0 + Math.sin(angle) * d + d * 0.6, 0.4), opacity: 0 }
      ], { duration: time + Math.random() * time * 0.6, easing: "cubic-bezier(.2, .7, .3, 1)" }).onfinish = () => p.remove();
    }
  }
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // ---- Check the code, then seal the envelope ----
  async function verify(code) {
    busy = true;
    setLocked(true);
    say("Reading your code…");
    await wait(600);

    if (code === demo) {
      say("Sealing the envelope…");
      env.classList.add("tucked");     // letter slides into the pocket
      await wait(600);
      env.classList.add("closed");     // flap folds down
      await wait(560);
      env.classList.add("sealed");     // wax seal stamps on
      await wait(280);
      env.classList.add("cheer");      // the stamp squashes the envelope, then it hops
      splash(env.querySelector(".seal"), 34, ["#9b1c31", "#d25a6c", "#f3c85e", "#fff1d6"], [50, 150], [4, 10], 900);
      say("Sealed and verified. You're signed in.", "good");
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      say("The ink smudged: that code is not right. Try again.", "bad");
      letter.classList.add("smudge");
      await wait(700);
      letter.classList.remove("smudge");
      clearAll();
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", async () => {
    againBtn.hidden = true;
    env.classList.remove("sealed", "cheer");
    await wait(150);
    env.classList.remove("closed");
    await wait(450);
    env.classList.remove("tucked");
    clearAll();
    newCode();
    say("A fresh letter is ready for a new code.");
    await wait(450);
    busy = false;
    setLocked(false);
    focusBox(0);
  });

  let cooldown = 0;
  resendBtn.addEventListener("click", () => {
    if (busy || cooldown) return;
    newCode();
    clearAll();
    say("We emailed you a new code.");
    focusBox(0);
    cooldown = 15;
    resendBtn.disabled = true;
    resendBtn.textContent = "Email again in 15s";
    const tick = setInterval(() => {
      cooldown--;
      resendBtn.textContent = cooldown ? "Email again in " + cooldown + "s" : "Email a new code";
      if (!cooldown) { clearInterval(tick); resendBtn.disabled = false; }
    }, 1000);
  });

  newCode();
})();
</script>
</body>
</html>
