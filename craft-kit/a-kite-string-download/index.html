<!doctype html>
<!-- Chill and Craft · Kite String · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kite String · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --sky1: #fffaf0;
    --sky2: #ffe7b3;
    --track: #f3dfb6;
    --string: #7c5a2a;
    --text: #3d2a12;
    --muted: #87683f;
    --chip: #3d2a12;
    --chip-text: #fff8e8;
    --magenta: #e11d74;
    --orange: #f97316;
    --yellow: #facc15;
    --green: #16a34a;
    --focus: #2563eb;
    --stars: transparent;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --sky1: #2a1d4a;
      --sky2: #0e0a1c;
      --track: #3a2d58;
      --string: #d9c6ff;
      --text: #f4ecff;
      --muted: #b9a8d9;
      --chip: #f4ecff;
      --chip-text: #2a1d4a;
      --focus: #93c5fd;
      --stars: rgba(255, 255, 255, .6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --sky1: #2a1d4a;
    --sky2: #0e0a1c;
    --track: #3a2d58;
    --string: #d9c6ff;
    --text: #f4ecff;
    --muted: #b9a8d9;
    --chip: #f4ecff;
    --chip-text: #2a1d4a;
    --focus: #93c5fd;
    --stars: rgba(255, 255, 255, .6);
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(1.3px 1.3px at 18% 22%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 72% 16%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 86% 40%, var(--stars) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 30% 60%, var(--stars) 50%, transparent 51%),
      radial-gradient(circle at 50% 20%, var(--sky1), var(--sky2) 85%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; width: 100%; }

  /* ---------- The whole widget ---------- */
  .kd { --kx: .5; position: relative; width: 280px; max-width: 100%; height: 210px; }

  /* Row that centres the button; the button turns into the track */
  .row { position: absolute; left: 0; right: 0; bottom: 20px; height: 76px; display: flex; align-items: center; justify-content: center; }
  .orb {
    position: relative;
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--track);
    color: #fff;
    font: inherit;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 16px 30px -16px rgba(225, 29, 116, .8);
    transition: width .7s var(--spring), height .5s cubic-bezier(.6, 0, .3, 1), box-shadow .3s, transform .45s var(--spring);
  }
  /* Colourful skin of the button (fades out while it is a track) */
  .orb::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, var(--magenta), var(--orange) 60%, var(--yellow)); transition: opacity .3s; }
  /* Pulse ring on hover */
  .orb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .7); opacity: 0; }
  .orb:hover { transform: rotate(-8deg) scale(1.07); box-shadow: 0 20px 34px -16px rgba(225, 29, 116, .9); }
  .orb:hover::after { animation: ring 1s ease-out infinite; }
  .orb:active { transform: scale(.92); transition-duration: .1s; }
  .orb:focus-visible { outline: 3px solid var(--focus); outline-offset: 5px; }
  .orb[aria-disabled="true"] { cursor: progress; transform: none; }
  .orb > * { position: relative; }

  .arrow { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; grid-area: 1 / 1; transition: transform .6s var(--spring), opacity .25s; }
  .orb:hover .arrow { animation: bob .8s ease-in-out infinite; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--kx) * 100%); background: linear-gradient(90deg, var(--magenta), var(--orange), var(--yellow)); opacity: 0; transition: width .45s var(--spring), opacity .2s; }
  .saved { grid-area: 1 / 1; display: flex; align-items: center; gap: 8px; font-size: 16.5px; font-weight: 700; white-space: nowrap; opacity: 0; transform: scale(.6); transition: opacity .25s, transform .5s var(--spring); }
  .saved svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .saved path { stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .4s .25s ease-out; }

  /* ---------- Kite (rides above the track) ---------- */
  .kite {
    position: absolute;
    left: calc(10px + var(--kx) * (100% - 20px));
    bottom: 63px; /* bottom of the string touches the track */
    width: 40px;
    height: 84px;
    margin-left: -20px;
    opacity: 0;
    transform: translateY(30px) scale(.2) rotate(-40deg);
    transform-origin: 50% 25%;
    pointer-events: none;
    transition: left .45s var(--spring), opacity .25s, transform .7s var(--spring);
  }
  .kite svg { width: 100%; height: 100%; overflow: visible; }
  .kite .art { transform-box: view-box; transform-origin: 20px 84px; }
  .kite .tail { fill: none; stroke: var(--magenta); stroke-width: 1.6; stroke-linecap: round; transform-box: view-box; transform-origin: 20px 46px; }
  .kite .bow { fill: var(--green); }
  .kite .sticks { fill: none; stroke: rgba(60, 30, 10, .55); stroke-width: 1; }
  .kite .string { fill: none; stroke: var(--string); stroke-width: 1.2; stroke-dasharray: 70; stroke-dashoffset: 70; transition: stroke-dashoffset .5s .3s ease-out; }
  .tl { fill: var(--magenta); }
  .tr { fill: var(--yellow); }
  .bl { fill: var(--green); }
  .br { fill: var(--orange); }
  .kpct {
    position: absolute;
    left: 50%;
    top: -28px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--chip-text);
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transform: translateX(-50%);
  }

  .fx { position: absolute; left: 50%; bottom: 58px; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; width: 8px; height: 8px; pointer-events: none; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }

  .cap { margin: 0; font-size: 13.5px; color: var(--muted); text-align: center; }
  .cap b { color: var(--text); font-weight: 650; }

  /* ---------- States ---------- */
  /* working: the button stretches into a string-thin track; the kite flies */
  .kd[data-state="working"] .orb { width: calc(100% - 20px); height: 10px; box-shadow: none; transform: none; }
  .kd[data-state="working"] .orb::before { opacity: 0; }
  .kd[data-state="working"] .orb::after { display: none; }
  .kd[data-state="working"] .fill { opacity: 1; }
  .kd:is([data-state="working"], [data-state="done"], [data-state="saved"]) .arrow { opacity: 0; transform: translateY(-40px) scale(.3) rotate(45deg); animation: none; transition: transform .35s cubic-bezier(.4, 0, .9, .5), opacity .25s .1s; }
  .kd[data-state="working"] .kite { opacity: 1; transform: none; transition-delay: 0s, .15s, .15s; }
  .kd[data-state="working"] .kite .string { stroke-dashoffset: 0; }
  .kd[data-state="working"] .kite .art { animation: bob-kite 1.6s ease-in-out infinite; }
  .kd[data-state="working"] .kite .tail { animation: flutter .5s ease-in-out infinite alternate; }

  /* done: the track flashes while the kite loops away */
  .kd[data-state="done"] .orb { width: calc(100% - 20px); height: 10px; box-shadow: none; transform: none; }
  .kd[data-state="done"] .orb::before { opacity: 0; }
  .kd[data-state="done"] .fill { opacity: 1; animation: flash .5s ease-out; }
  .kd[data-state="done"] .kite { opacity: 1; transform: none; transition: none; }

  /* saved: springs back into a pill */
  .kd[data-state="saved"] .orb { width: 200px; height: 58px; }
  .kd[data-state="saved"] .saved { opacity: 1; transform: none; transition-delay: .15s; }
  .kd[data-state="saved"] .saved path { stroke-dashoffset: 0; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
  @keyframes bob-kite { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-4px) rotate(5deg); } }
  @keyframes flutter { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
  @keyframes flash { 0% { filter: brightness(1.6); } 100% { filter: none; } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="kd" data-state="idle">
    <!-- The kite: four coloured panels, a tail with bows and its string -->
    <div class="kite" aria-hidden="true">
      <span class="kpct">0%</span>
      <svg viewBox="0 0 40 84">
        <path class="string" d="M20 22Q8 54 20 84" />
        <g class="art">
          <path class="tl" d="M20 2L4 20h16z" />
          <path class="tr" d="M20 2l16 18H20z" />
          <path class="bl" d="M4 20l16 26V20z" />
          <path class="br" d="M36 20L20 46V20z" />
          <path class="sticks" d="M20 2v44M4 20q16-6 32 0" />
          <g class="tail">
            <path d="M20 46q7 6 0 12t0 12" />
            <path class="bow" d="M16 56l4 2-4 2zM24 56l-4 2 4 2zM16 68l4 2-4 2zM24 68l-4 2 4 2z" />
          </g>
        </g>
      </svg>
    </div>

    <div class="row">
      <button class="orb" type="button" aria-label="Download" aria-describedby="cap">
        <span class="fill" aria-hidden="true"></span>
        <svg class="arrow" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 5v17M8 15.5l7 7 7-7" /></svg>
        <span class="saved" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M3.5 9.5l3.5 3.5 7.5-8" /></svg>Saved</span>
      </button>
    </div>
    <span class="fx" aria-hidden="true"></span>
  </div>
  <p class="cap" id="cap"><b>Spring-Wallpapers.zip</b> · 12 MB</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Kite String download button ----------
  const kd = document.querySelector(".kd");
  const orb = kd.querySelector(".orb");
  const arrow = kd.querySelector(".arrow");
  const kite = kd.querySelector(".kite");
  const kpct = kd.querySelector(".kpct");
  const fx = kd.querySelector(".fx");
  const status = document.getElementById("status");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  let busy = false;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Kite-coloured diamonds thrown from the pill
  function confetti(count) {
    if (calm()) return;
    const colors = ["#e11d74", "#f97316", "#facc15", "#16a34a"];
    for (let i = 0; i < count; i++) {
      const p = document.createElement("i");
      p.className = "particle";
      p.style.background = colors[i % colors.length];
      fx.appendChild(p);
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.6;
      const d = 60 + Math.random() * 50;
      p.animate([
        { transform: "translate(-50%, -50%) scale(.3) rotate(0)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d).toFixed(1) + "px)) scale(1) rotate(220deg)", opacity: 1, offset: .55 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d * 1.1).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d + 30).toFixed(1) + "px)) scale(.6) rotate(400deg)", opacity: 0 }
      ], { duration: 1100 + Math.random() * 400, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => p.remove();
    }
  }

  function setProgress(p) {
    kd.style.setProperty("--kx", (p / 100).toFixed(3));
    kpct.textContent = Math.round(p) + "%";
  }

  // Fake download with uneven chunks
  function simulateDownload(onTick) {
    return new Promise((resolve) => {
      let p = 0;
      (function step() {
        p = Math.min(100, p + 2 + Math.random() * 6);
        onTick(p);
        if (p >= 100) resolve();
        else setTimeout(step, 150 + Math.random() * 110);
      })();
    });
  }

  orb.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    orb.setAttribute("aria-disabled", "true");

    // 1. Anticipation: the orb squashes, the arrow coils
    await Promise.all([
      play(orb, [{ transform: "scale(1)" }, { transform: "scale(1.16, .8)" }, { transform: "scale(.94, 1.08)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" }),
      play(arrow, [{ transform: "translateY(0)" }, { transform: "translateY(5px) scaleY(.75)" }, { transform: "translateY(0)" }], { duration: 360, easing: "ease-in-out" })
    ]);

    // 2. The arrow flies up and becomes a kite; the orb stretches into a track
    setProgress(0);
    kd.dataset.state = "working";
    status.textContent = "Download started.";
    await wait(700);

    // 3. Progress: the kite glides along the string as the track fills
    let spoken = 0;
    await simulateDownload((p) => {
      setProgress(p);
      if (p - spoken >= 25 && p < 100) {
        spoken = Math.floor(p / 25) * 25;
        status.textContent = "Downloading, " + spoken + " percent.";
      }
    });
    await wait(350);

    // 4. Finish: the kite loops once and soars away
    kd.dataset.state = "done";
    await play(kite, [
      { transform: "translate(0, 0) rotate(0) scale(1)", opacity: 1 },
      { transform: "translate(-6px, -30px) rotate(-180deg) scale(1.1)", opacity: 1, offset: .35 },
      { transform: "translate(4px, -48px) rotate(-360deg) scale(1)", opacity: 1, offset: .6 },
      { transform: "translate(70px, -150px) rotate(-340deg) scale(.4)", opacity: 0 }
    ], { duration: 1100, easing: "cubic-bezier(.45, 0, .55, 1)", fill: "forwards" });

    // 5. The track springs back into a pill that says Saved; confetti
    kd.dataset.state = "saved";
    orb.setAttribute("aria-label", "Saved");
    setProgress(50);
    confetti(18);
    status.textContent = "Download complete. Spring-Wallpapers.zip is saved.";
    await wait(2300);

    // 6. Reset: pill to orb, the arrow springs back in
    if (kite.getAnimations) kite.getAnimations().forEach((a) => a.cancel());
    kd.dataset.state = "idle";
    orb.setAttribute("aria-label", "Download");
    await wait(600);
    orb.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
