<!doctype html>
<!-- Chill & Craft · Rain Pane · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain Pane · wipe the misted window</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    --page: #dfe5ec; --page2: #c4cfdb; --ink: #1d2733; --muted: #586477;
    --wall: #eadfce; --wall2: #e0d1bc; --glow: #ffe2b0;
    --wood: #8d5c3c; --wood-hi: #b98457; --wood-dk: #5d3923;
    --cat: #3b3540; --cat-rim: #8c8597;
    --chip: rgba(255, 255, 255, 0.74); --chip-line: rgba(29, 39, 51, 0.12);
    --on: #1d2733; --on-ink: #f4f1ea; --focus: #d9480f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0a0f1d; --page2: #18203a; --ink: #e8ecf5; --muted: #9ba7bd;
      --wall: #2b2330; --wall2: #241d29; --glow: #ffb565;
      --wood: #5c3b2b; --wood-hi: #7e5238; --wood-dk: #34211a;
      --cat: #120f17; --cat-rim: #6f7fa8;
      --chip: rgba(24, 30, 52, 0.72); --chip-line: rgba(255, 255, 255, 0.1);
      --on: #f1e7d6; --on-ink: #1a1520; --focus: #ffc078;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0a0f1d; --page2: #18203a; --ink: #e8ecf5; --muted: #9ba7bd;
    --wall: #2b2330; --wall2: #241d29; --glow: #ffb565;
    --wood: #5c3b2b; --wood-hi: #7e5238; --wood-dk: #34211a;
    --cat: #120f17; --cat-rim: #6f7fa8;
    --chip: rgba(24, 30, 52, 0.72); --chip-line: rgba(255, 255, 255, 0.1);
    --on: #f1e7d6; --on-ink: #1a1520; --focus: #ffc078;
    color-scheme: dark;
  }

  /* ---------- Page and stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 70% at 50% 0%, var(--page2), transparent 70%),
      var(--page);
  }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap {
    width: min(500px, 100%, calc((100vh - 210px) * 0.8));
    min-width: 280px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: var(--muted); padding: 0 4px;
  }
  .cap b { font-size: 15px; color: var(--ink); letter-spacing: 0.01em; }
  .scene {
    position: relative;
    width: min(500px, 100%, calc((100vh - 210px) * 0.8));
    min-width: 280px;
    aspect-ratio: 4 / 5;
    border-radius: 28px;
    overflow: hidden;
    isolation: isolate;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 30px 60px -20px rgba(8, 12, 30, 0.55), 0 12px 24px -12px rgba(8, 12, 30, 0.4);
  }
  .scene canvas, .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .quake { animation: quake 0.5s cubic-bezier(.36, .07, .19, .97); }
  @keyframes quake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(2px, 1px); }
    30%, 50%, 70% { transform: translate(-3px, -1px); }
    40%, 60% { transform: translate(3px, 1px); }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* the glass is the interactive surface laid over the drawing */
  .glass {
    position: absolute; left: 9.5%; top: 7.2%; width: 81%; height: 72.4%;
    cursor: crosshair; touch-action: none; border-radius: 2px; outline: none;
  }
  .glass:focus-visible { box-shadow: 0 0 0 3px var(--focus) inset; }
  .finger {
    position: absolute; width: 6.5%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, rgba(255, 255, 255, 0.95), rgba(255, 228, 205, 0.75) 42%, rgba(255, 205, 170, 0) 70%);
    transform: translate(-50%, -50%) scale(0.4); opacity: 0;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(.34, 1.56, .64, 1);
    pointer-events: none;
  }
  .finger.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .finger.up { opacity: 0.45; transform: translate(-50%, -50%) scale(1.3); }
  .glint {
    position: absolute; left: 9.5%; top: 7.2%; width: 81%; height: 72.4%; overflow: hidden; pointer-events: none;
  }
  .glint::before {
    content: ""; position: absolute; top: -20%; bottom: -20%; width: 30%; left: -40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.28), transparent);
    transform: skewX(-18deg); opacity: 0;
  }
  .glint.go::before { animation: glint 1.1s cubic-bezier(.3, .7, .3, 1); }
  @keyframes glint { 0% { left: -40%; opacity: 1; } 100% { left: 120%; opacity: 0.6; } }
  .count {
    position: absolute; left: 50%; top: 13%; transform: translate(-50%, -8px) scale(0.8);
    padding: 7px 16px; border-radius: 999px; font: 800 18px/1 system-ui, sans-serif; letter-spacing: 0.04em;
    color: #fff; background: rgba(15, 20, 40, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .count.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .count.boom { font-size: 26px; background: rgba(255, 120, 60, 0.75); }

  /* ---------- Room drawing ---------- */
  .wall { fill: var(--wall); }
  .wall2 { fill: var(--wall2); }
  .lc1 { stop-color: var(--glow); stop-opacity: 0.32; }
  .lc2 { stop-color: var(--glow); stop-opacity: 0; }
  .wood { fill: var(--wood); }
  .wood-hi { fill: var(--wood-hi); }
  .wood-dk { fill: var(--wood-dk); }
  .cat { fill: var(--cat); }
  .cat-rim { fill: none; stroke: var(--cat-rim); stroke-width: 1.6; stroke-linecap: round; opacity: 0.8; }
  .tail { transform-box: view-box; transform-origin: 116px 402px; animation: tail 3.2s ease-in-out infinite; }
  @keyframes tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
  .ear { transform-box: fill-box; transform-origin: 50% 100%; animation: ear 6s ease-in-out infinite; }
  @keyframes ear { 0%, 92%, 100% { transform: rotate(0); } 95% { transform: rotate(-14deg); } }
  .steam { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: 0; animation: steam 3.4s ease-in-out infinite; }
  .steam.s2 { animation-delay: -1.7s; }
  @keyframes steam { 0% { transform: translateY(6px); opacity: 0; } 45% { opacity: 0.45; } 100% { transform: translateY(-16px); opacity: 0; } }
  .cup.rattle { animation: rattle 0.45s linear; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes rattle { 25% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } 75% { transform: rotate(2deg); } }
  .bulb { animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ---------- Controls ---------- */
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .seg {
    display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--chip-line);
    background: var(--chip); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .seg label { position: relative; }
  .seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .seg span {
    display: block; padding: 9px 13px; border-radius: 999px; font: 600 14px/1 system-ui, sans-serif; color: var(--muted);
    transition: background 0.25s ease, color 0.25s ease;
  }
  .seg input:checked + span { background: var(--on); color: var(--on-ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn {
    appearance: none; border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink);
    font: 600 14px/1 system-ui, sans-serif; padding: 10px 15px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform 0.25s cubic-bezier(.34, 1.56, .64, 1), box-shadow 0.25s ease;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(0, 0, 0, 0.45); }
  .btn:active { transform: scale(0.95); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; text-align: center; }
  .hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .tail, .ear, .steam, .bulb, .cup.rattle, .quake, .glint.go::before { animation: none; }
    .steam { opacity: 0.3; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Rain Pane: a misted window on a rainy evening that you can wipe and draw on</h1>
  <div class="cap"><b>Rain Pane</b><span id="clock">rain outside</span></div>
  <div class="scene" id="scene">
    <!-- outside street, fog and raindrops are painted on this canvas -->
    <canvas id="cv" aria-hidden="true"></canvas>

    <!-- the room in front of the glass -->
    <svg viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
          <rect class="wall" width="18" height="18"/>
          <rect class="wall2" x="7" width="4" height="18"/>
        </pattern>
        <radialGradient id="roomGlow" cx="0.15" cy="1" r="0.9">
          <stop offset="0" class="lc1"/><stop offset="1" class="lc2"/>
        </radialGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
          <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.55" stop-color="#fff" stop-opacity="0.05"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e89a4a"/><stop offset="1" stop-color="#9c4f1d"/>
        </linearGradient>
        <linearGradient id="sillShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- wall with a hole for the glass -->
      <path fill="url(#paper)" fill-rule="evenodd" d="M0 0H400V500H0Z M38 36H362V398H38Z"/>
      <path fill="url(#roomGlow)" fill-rule="evenodd" d="M0 0H400V500H0Z M38 36H362V398H38Z"/>
      <!-- glass sheen -->
      <rect x="38" y="36" width="324" height="362" fill="url(#sheen)"/>

      <!-- window frame -->
      <path class="wood" fill-rule="evenodd" d="M24 22H376V404H24Z M38 36H362V404H38Z"/>
      <path class="wood-hi" d="M24 22H376V25H24Z M24 22H27V404H24Z"/>
      <path class="wood-dk" d="M38 36H362V39H38Z M38 36H41V404H38Z"/>
      <rect class="wood" x="196" y="36" width="8" height="368"/>
      <rect class="wood-hi" x="196" y="36" width="2" height="368"/>
      <rect class="wood" x="38" y="150" width="324" height="8"/>
      <rect class="wood-hi" x="38" y="150" width="324" height="2"/>

      <!-- sill and its shadow on the wall -->
      <rect x="8" y="424" width="384" height="26" fill="url(#sillShade)"/>
      <path class="wood-hi" d="M30 398H370L392 410H8Z"/>
      <rect class="wood" x="8" y="410" width="384" height="16" rx="3"/>
      <rect class="wood-dk" x="8" y="422" width="384" height="4" rx="2"/>

      <!-- fairy lights across the top -->
      <path d="M14 20 Q107 64 200 34 Q293 64 386 20" fill="none" stroke="#2c2620" stroke-width="1.4" opacity="0.8"/>
      <g id="bulbs"></g>

      <!-- a cat on the sill watching the rain; its head follows the drops you make -->
      <g class="tail"><path class="cat" d="M112 401 C134 404 150 398 152 386 C153 379 147 377 145 383 C143 392 132 396 112 395Z"/></g>
      <path class="cat" d="M76 404 C70 384 76 362 95 360 C114 362 120 384 114 404Z"/>
      <path class="cat-rim" d="M80 384 C82 370 88 364 95 363"/>
      <g id="head">
        <path class="cat ear" d="M81 345 L84 326 L94 338Z"/>
        <path class="cat ear" d="M109 345 L106 326 L96 338Z" style="animation-delay:-3s"/>
        <ellipse class="cat" cx="95" cy="348" rx="16" ry="14.5"/>
        <path class="cat-rim" d="M82 341 C85 335 90 333 96 333"/>
      </g>

      <!-- a glass of chai with a saucer -->
      <g class="cup" id="cup">
        <ellipse cx="312" cy="401" rx="24" ry="4" fill="#d9d4cb"/>
        <path d="M298 362 L326 362 L322 399 L302 399Z" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
        <path d="M299 372 L325 372 L322 399 L302 399Z" fill="url(#tea)"/>
        <ellipse cx="312" cy="372" rx="13" ry="2.4" fill="#f2c08a"/>
        <path d="M303 366 L305 395" stroke="#fff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
      </g>
      <path class="steam" d="M306 356 q-5 -8 0 -16 q5 -8 0 -16"/>
      <path class="steam s2" d="M318 356 q-5 -8 0 -16 q5 -8 0 -16"/>
    </svg>

    <div class="glint" id="glint"></div>
    <div class="count" id="count" aria-hidden="true"></div>
    <div class="finger" id="finger"></div>
    <div id="glass" class="glass" tabindex="0" role="application" aria-roledescription="misted window"
         aria-label="Misted window. Drag across the glass to wipe it, or use the arrow keys." aria-describedby="hint"></div>
  </div>

  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="How hard it rains">
      <label><input type="radio" name="rain" value="0"><span>Drizzle</span></label>
      <label><input type="radio" name="rain" value="1" checked><span>Rain</span></label>
      <label><input type="radio" name="rain" value="2"><span>Downpour</span></label>
    </div>
    <button class="btn" id="draw" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"/></svg>
      <span id="drawLabel">Draw a heart</span>
    </button>
    <button class="btn" id="thunder" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor"/></svg>
      Thunder
    </button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">The window is misted over. Wipe it to see the street.</p>
  <p id="hint" class="hint">Drag on the glass to wipe it. The mist slowly comes back.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;
  // Drawing units: the scene is 400 x 500; the glass is the rectangle below
  var W = 400, H = 500, GX0 = 38, GY0 = 36, GX1 = 362, GY1 = 398;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)");
  var darkMQ = matchMedia("(prefers-color-scheme: dark)");
  function isDark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : darkMQ.matches; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a.toFixed(3) + ")"; }

  var scene = $("scene"), cv = $("cv"), ctx = cv.getContext("2d"), glass = $("glass");
  var statusEl = $("status"), finger = $("finger"), countEl = $("count");
  // Offscreen layers: the street (redrawn each frame), the still city, the mist, and mist speckles
  var outC = document.createElement("canvas"), oc = outC.getContext("2d");
  var cityC = document.createElement("canvas"), cc = cityC.getContext("2d");
  var FS = 0.5; // the mist is kept at half resolution
  var fogC = document.createElement("canvas"), fc = fogC.getContext("2d");
  var dotC = document.createElement("canvas"), dc = dotC.getContext("2d");
  var maskC = document.createElement("canvas"), mc = maskC.getContext("2d");
  fogC.width = dotC.width = maskC.width = W * FS;
  fogC.height = dotC.height = maskC.height = H * FS;
  var S = 1, pal = null;

  function say(msg) { statusEl.textContent = msg; }

  /* ---------- 1. Colours for day and night ---------- */
  function palette() {
    return isDark() ? {
      sky: ["#060a17", "#121b35", "#3a2d4d"], far: "#1b2343", near: "#0d1226", winOff: "rgba(40,50,80,0.6)",
      win: [[255, 196, 120], [255, 228, 170], [150, 205, 255]], winP: 0.36, road: ["#151b2e", "#0a0e1a"],
      lamp: [255, 186, 104], neon: [[255, 80, 165], [60, 225, 210]], fog: [118, 136, 168], fogA: 0.6,
      rain: "rgba(190,210,255,0.22)", dot: "rgba(220,232,255,0.55)", flash: [200, 215, 255], night: true
    } : {
      sky: ["#73879d", "#a3b3c3", "#cdd5dc"], far: "#8a99aa", near: "#66768a", winOff: "rgba(70,85,100,0.5)",
      win: [[255, 226, 170], [244, 240, 228]], winP: 0.14, road: ["#5d6976", "#46505b"],
      lamp: [255, 212, 150], neon: [[255, 120, 170], [70, 196, 186]], fog: [232, 237, 243], fogA: 0.7,
      rain: "rgba(60,80,100,0.25)", dot: "rgba(255,255,255,0.7)", flash: [255, 255, 255], night: false
    };
  }

  /* ---------- 2. The street outside (generated once) ---------- */
  var far = [], near = [], lamps = [], neons = [], streaks = [];
  function genCity() {
    var x = 30, w;
    while (x < 372) { w = rnd(20, 44); far.push({ x: x, w: w, h: rnd(100, 220) }); x += w + rnd(-4, 4); }
    x = 24;
    while (x < 376) {
      w = rnd(34, 66);
      var b = { x: x, w: w, h: rnd(70, 165), wins: [] };
      for (var yy = 330 - b.h + 10; yy < 318; yy += 13) {
        for (var xx = b.x + 5; xx < b.x + b.w - 8; xx += 10) b.wins.push({ x: xx, y: yy, r: Math.random(), c: Math.floor(Math.random() * 3) });
      }
      near.push(b); x += w + rnd(3, 10);
    }
    lamps = [{ x: 92, y: 296 }, { x: 228, y: 292 }, { x: 338, y: 298 }];
    neons = [{ x: 150, y: 246, r: 24, c: 0, ph: 0 }, { x: 286, y: 232, r: 17, c: 1, ph: 2.1 }];
    for (var i = 0; i < 160; i++) streaks.push({ x: rnd(0, W), y: rnd(0, H), l: rnd(8, 18), v: rnd(380, 520) });
  }

  // Paint the still part of the street once per size or theme change
  function renderCity() {
    cityC.width = outC.width = cv.width; cityC.height = outC.height = cv.height;
    cc.setTransform(S, 0, 0, S, 0, 0);
    var g = cc.createLinearGradient(0, 0, 0, 330);
    g.addColorStop(0, pal.sky[0]); g.addColorStop(0.6, pal.sky[1]); g.addColorStop(1, pal.sky[2]);
    cc.fillStyle = g; cc.fillRect(0, 0, W, 340);
    cc.fillStyle = pal.far; cc.globalAlpha = 0.85;
    far.forEach(function (b) { cc.fillRect(b.x, 330 - b.h, b.w, b.h); });
    cc.globalAlpha = 1;
    near.forEach(function (b) {
      cc.fillStyle = pal.near; cc.fillRect(b.x, 330 - b.h, b.w, b.h);
      b.wins.forEach(function (wn) {
        if (wn.r < pal.winP) { cc.fillStyle = rgba(pal.win[wn.c % pal.win.length], 0.95); }
        else cc.fillStyle = pal.winOff;
        cc.fillRect(wn.x, wn.y, 5, 7);
      });
    });
    var rg = cc.createLinearGradient(0, 330, 0, 400);
    rg.addColorStop(0, pal.road[0]); rg.addColorStop(1, pal.road[1]);
    cc.fillStyle = rg; cc.fillRect(0, 330, W, 170);
    cc.strokeStyle = pal.near; cc.lineWidth = 2;
    lamps.forEach(function (l) { cc.beginPath(); cc.moveTo(l.x, l.y + 4); cc.lineTo(l.x, 336); cc.stroke(); });
    cc.fillStyle = pal.night ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.3)";
    for (var x = 10; x < W; x += 34) cc.fillRect(x, 361, 16, 1.6);
  }

  // A soft round blur of light ("bokeh")
  function bokeh(c, x, y, r, col, a) {
    var g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(0.5, rgba(col, a * 0.45)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  // A light's long reflection on the wet road
  function streak(c, x, y, len, w, col, a) {
    var g = c.createLinearGradient(0, y, 0, y + len);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.fillRect(x - w / 2, y, w, len);
  }

  /* ---------- 3. Cars, rickshaws and lightning ---------- */
  var cars = [], carIn = 0.6, flash = 0, bolt = null;
  function spawnCar() {
    var dir = Math.random() < 0.5 ? 1 : -1;

    var r = scene.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    S = Math.max(0.5, r.width / W * dpr);
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    renderCity();
  }
  function retheme() { pal = palette(); tintFog(); makeDots(); renderCity(); }
  darkMQ.addEventListener("change", retheme);
  window.addEventListener("resize", resize);

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
    last = now;
    carIn -= dt;
    if (carIn <= 0) { spawnCar(); carIn = rnd(1.8, 4.2); }
    cars.forEach(function (c) { c.x += c.dir * c.v * (c.rick ? 0.6 : 1) * dt; });
    cars = cars.filter(function (c) { return c.x > -60 && c.x < W + 60; });
    flash = Math.max(0, flash - dt * 4);

    fogAdd(1 - Math.pow(1 - 0.0028, dt * 60)); // the mist slowly returns
    runJob(dt);
    updateDrops(dt);
    paintOutside(t, dt);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(outC, 0, 0);
    ctx.globalAlpha = pal.fogA; ctx.drawImage(fogC, 0, 0, cv.width, cv.height);
    mc.globalCompositeOperation = "source-over"; mc.clearRect(0, 0, maskC.width, maskC.height); mc.drawImage(dotC, 0, 0);
    mc.globalCompositeOperation = "destination-in"; mc.drawImage(fogC, 0, 0);
    ctx.globalAlpha = 0.9; ctx.drawImage(maskC, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    drawDrops();

    // the cat turns its head toward what is happening on the glass
    var target = job ? fingerPos.x : lookX;
    var want = Math.max(-24, Math.min(24, (target - 95) / 7));
    catAng += (want - catAng) * Math.min(1, dt * (reduce.matches ? 10 : 4));
    head.setAttribute("transform", "rotate(" + catAng.toFixed(1) + " 95 362)");
    requestAnimationFrame(loop);
  }

  pal = palette();
  genCity();
  fogAdd(1); fogAdd(1);
  makeDots();
  resize();
  for (var i = 0; i < 120; i++) addDrop(rnd(GX0 + 2, GX1 - 2), rnd(GY0 + 2, GY1 - 6), 0.7 + Math.pow(Math.random(), 3) * 3);
  tickClock(); setInterval(tickClock, 20000);
  requestAnimationFrame(loop);
  demoT = setTimeout(demo, 250);
})();
</script>
