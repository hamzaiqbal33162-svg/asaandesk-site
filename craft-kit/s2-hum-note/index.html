<title>Hum Note · Hold to record, slide to cancel, release to send</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg1: #fde6f1;
    --bg2: #e9e1ff;
    --card: #ffffff;
    --thread: #faf5fd;
    --ink: #241632;
    --muted: #7d6f8e;
    --line: rgba(36, 22, 50, 0.1);
    --in: #ffffff;
    --g1: #d6249f;
    --g2: #7b2ff7;
    --rec: #ff3d6e;
    --tick: #3aa0ff;
    --ok: #19a974;
    --shadow: rgba(90, 30, 120, 0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg1: #1d0e2b;
    --bg2: #0d0a1c;
    --card: #1a1228;
    --thread: #140e20;
    --ink: #f4ebfc;
    --muted: #a798ba;
    --line: rgba(244, 235, 252, 0.1);
    --in: #261b37;
    --g1: #e83aae;
    --g2: #8b45ff;
    --rec: #ff5a85;
    --tick: #5cb6ff;
    --ok: #3fd69d;
    --shadow: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg2); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--g2); outline-offset: 2px; }

  /* ---------- Stage: dusk gradient with drifting bokeh ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
  .bokeh { position: absolute; z-index: -1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--g1) 30%, transparent), transparent 68%); pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
  .bokeh.b2 { background: radial-gradient(circle, color-mix(in srgb, var(--g2) 30%, transparent), transparent 68%); animation-duration: 15s; animation-direction: alternate-reverse; }
  @keyframes drift { to { transform: translate(40px, -30px) scale(1.15); } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }

  /* ---------- Chat card ---------- */
  .chat { position: relative; display: flex; flex-direction: column; width: min(400px, 100%); height: 500px; border-radius: 30px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 50px 80px -50px var(--shadow); overflow: visible; animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .head { display: flex; align-items: center; gap: 11px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .av { position: relative; display: grid; place-items: center; width: 42px; height: 42px; flex: none; border-radius: 50%; background: linear-gradient(140deg, #ffb36b, #ff5f8f); color: #fff; font-weight: 900; font-size: 0.86rem; }
  .av::after { content: ""; position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2.5px var(--card); }
  .head b { display: block; font-size: 0.96rem; }
  .head small { display: block; font-size: 0.74rem; color: var(--muted); transition: color 0.3s; }
  .head small.live { color: var(--rec); font-weight: 700; }
  .src { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; font-size: 0.72rem; font-weight: 800; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .src svg { width: 14px; height: 14px; }
  .src[aria-pressed="true"] { border-color: var(--rec); color: var(--rec); }

  .thread { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 10px; overflow-y: auto; overflow-x: hidden; background: radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--g1) 7%, transparent), transparent 40%), var(--thread); scrollbar-width: none; }
  .thread::-webkit-scrollbar { display: none; }
  .day { align-self: center; padding: 3px 10px; border-radius: 999px; background: var(--line); font-size: 0.66rem; font-weight: 800; color: var(--muted); }
  .msg { position: relative; max-width: 80%; padding: 9px 12px; border-radius: 18px; font-size: 0.88rem; line-height: 1.4; box-shadow: 0 6px 14px -12px var(--shadow); flex: none; }
  .msg.in { align-self: flex-start; background: var(--in); border-bottom-left-radius: 6px; box-shadow: 0 0 0 1px var(--line), 0 6px 14px -12px var(--shadow); }
  .msg.out { align-self: flex-end; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; border-bottom-right-radius: 6px; }
  .msg .t { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; font-size: 0.64rem; opacity: 0.8; vertical-align: -2px; }
  .ticks { display: inline-grid; width: 18px; height: 12px; }
  .ticks svg { grid-area: 1 / 1; width: 18px; height: 12px; transition: opacity 0.25s; }
  .ticks .t2 path { stroke: currentColor; }
  .ticks.blue { color: #b9e2ff; }
  .voice { display: grid; grid-template-columns: 36px 1fr; grid-template-rows: auto auto; align-items: center; column-gap: 9px; width: 248px; padding: 9px 12px 7px 9px; }
  .pp { grid-row: 1 / 3; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.22); color: #fff; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .pp:active { transform: scale(0.9); }
  .pp svg { width: 16px; height: 16px; }
  .wave { position: relative; display: flex; align-items: center; gap: 2px; height: 28px; cursor: pointer; touch-action: none; border-radius: 6px; }
  .wave i { flex: 1; min-width: 2px; height: calc(var(--h) * 100%); border-radius: 2px; background: rgba(255, 255, 255, 0.45); transform-origin: 50% 50%; transition: background 0.12s; }
  .wave i.on { background: #fff; }
  .wave .head-dot { position: absolute; top: 50%; left: 0; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); pointer-events: none; }
  .vmeta { display: flex; align-items: center; gap: 7px; font-size: 0.66rem; font-weight: 700; opacity: 0.92; font-variant-numeric: tabular-nums; }
  .speed { height: 18px; padding: 0 7px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.24); color: #fff; font-size: 0.62rem; font-weight: 900; cursor: pointer; }
  .vmeta .ticks { margin-left: auto; }
  .react { position: absolute; left: -10px; bottom: -10px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 1.5px var(--line), 0 6px 10px -6px var(--shadow); transform: scale(0); }
  .react svg { width: 14px; height: 14px; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; border-radius: 18px; border-bottom-left-radius: 6px; background: var(--in); box-shadow: 0 0 0 1px var(--line); }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: hop 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hop { 30% { transform: translateY(-5px); } 60% { transform: none; } }

  /* ---------- Composer ---------- */
  .comp { position: relative; display: flex; align-items: center; gap: 10px; height: 70px; padding: 0 12px 0 14px; border-top: 1px solid var(--line); border-radius: 0 0 30px 30px; background: var(--card); }
  .field { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--thread); box-shadow: inset 0 0 0 1.5px var(--line); outline: none; font-size: 0.9rem; transition: opacity 0.25s, transform 0.35s; }
  .field:focus { box-shadow: inset 0 0 0 2px var(--g2); }
  .rec { position: absolute; left: 14px; right: 74px; top: 0; bottom: 0; display: flex; align-items: center; gap: 9px; opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; overflow: hidden; }
  .comp.recording .rec { opacity: 1; visibility: visible; }
  .comp.recording .field { opacity: 0; transform: translateX(-20px); pointer-events: none; }
  .rdot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--rec); animation: blinkr 1s ease-in-out infinite; }
  @keyframes blinkr { 50% { opacity: 0.25; } }
  .timer { flex: none; width: 38px; font-size: 0.86rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .live { flex: 1; min-width: 0; height: 34px; }
  .slide { position: relative; flex: none; margin-right: 2px; font-size: 0.74rem; font-weight: 800; color: var(--muted); white-space: nowrap; background: linear-gradient(90deg, var(--muted) 30%, var(--ink) 50%, var(--muted) 70%) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shine 1.6s linear infinite; padding-left: 14px; }
  .slide::before { content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -4px; border-left: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
  @keyframes shine { to { background-position: -200% 0; } }
  .comp.locked .slide { display: none; }
  .bin { display: none; }
  .comp.locked .bin { display: grid; }
  .ibtn { place-items: center; width: 34px; height: 34px; flex: none; padding: 0; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--rec) 12%, transparent); color: var(--rec); cursor: pointer; }
  .ibtn svg { width: 17px; height: 17px; }

  .mic { position: relative; z-index: 3; display: grid; place-items: center; width: 50px; height: 50px; flex: none; padding: 0; border: 0; border-radius: 50%; background: linear-gradient(140deg, var(--g1), var(--g2)); color: #fff; cursor: pointer; box-shadow: 0 12px 20px -10px var(--shadow); touch-action: none; transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.3s; }
  .mic svg { position: absolute; width: 22px; height: 22px; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.25s; }
  .mic .i-send { opacity: 0; transform: rotate(-90deg) scale(0.5); }
  .mic.text .i-mic, .comp.locked .mic .i-mic { opacity: 0; transform: rotate(90deg) scale(0.5); }
  .mic.text .i-send, .comp.locked .mic .i-send { opacity: 1; transform: none; }
  .comp.recording:not(.locked) .mic { transform: translateY(-10px) scale(1.5); background: var(--rec); }
  .ripple { position: absolute; inset: 0; border-radius: 50%; background: var(--rec); opacity: 0; pointer-events: none; }
  .comp.recording:not(.locked) .ripple { opacity: 0.22; transform: scale(var(--lv, 1)); transition: transform 0.08s linear; }
  .comp.recording:not(.locked) .ripple.r2 { opacity: 0.12; transform: scale(calc(var(--lv, 1) * 1.25)); }
  .lockpill { position: absolute; right: 20px; bottom: 82px; z-index: 2; display: grid; justify-items: center; gap: 2px; width: 36px; padding: 9px 0 8px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 10px 18px -10px var(--shadow); color: var(--muted); opacity: 0; transform: translateY(16px); transition: opacity 0.25s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
  .comp.recording:not(.locked) .lockpill { opacity: 1; transform: translateY(var(--ly, 0px)); }
  .lockpill svg { width: 16px; height: 16px; }
  .lockpill .chev { width: 12px; height: 12px; animation: up 1.2s ease-in-out infinite; }
  @keyframes up { 50% { transform: translateY(-4px); } }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .toast { position: fixed; left: 50%; bottom: 18px; z-index: 40; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 0.84rem; font-weight: 700; transform: translate(-50%, 200%); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1); }
  .toast.show { transform: translate(-50%, 0); }
  .trash { position: absolute; left: 0; top: 0; width: 34px; height: 40px; color: var(--rec); }
  .trash svg { width: 100%; height: 100%; overflow: visible; }
  .lid { transform-box: fill-box; transform-origin: 0% 100%; }
  .blob { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(140deg, var(--g1), var(--g2)); }

  @media (max-width: 440px) {
    .chat { height: 520px; border-radius: 26px; }
    .comp { border-radius: 0 0 26px 26px; }
    .voice { width: 228px; }
    .src span { display: none; }
  }
  @media (max-height: 560px) { .chat { height: calc(100dvh - 32px); min-height: 420px; } }
  @media (prefers-reduced-motion: reduce) {
    .bokeh, .chat, .rdot, .slide, .lockpill .chev, .typing i { animation: none !important; }
    .mic, .mic svg, .lockpill, .field, .toast { transition-duration: 0.01s !important; }
    .comp.recording:not(.locked) .mic { transform: none; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <span class="bokeh" style="width:280px;height:280px;left:8%;top:10%" aria-hidden="true"></span>
    <span class="bokeh b2" style="width:340px;height:340px;right:6%;bottom:6%" aria-hidden="true"></span>
    <span class="bokeh" style="width:160px;height:160px;right:20%;top:16%" aria-hidden="true"></span>
    <section class="chat" aria-label="Chat with Zara">
      <header class="head">
        <span class="av" aria-hidden="true">ZR</span>
        <div><b>Zara Rizvi</b><small id="presence">online · Karachi</small></div>
        <button class="src" id="src" type="button" aria-pressed="false" title="Record with your own microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg><span id="srcText">Demo voice</span></button>
      </header>
      <div class="thread" id="thread" aria-live="polite" aria-relevant="additions">
        <span class="day">Today</span>
        <div class="msg in">Are you coming to the mehndi tonight?<span class="t">7:42 PM</span></div>
      </div>
      <div class="comp" id="comp">
        <label class="sr-only" for="field">Message</label>
        <input class="field" id="field" placeholder="Message" autocomplete="off" />
        <div class="rec" aria-hidden="true">
          <button class="ibtn bin" id="del" type="button" aria-label="Delete recording" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg></button>
          <span class="rdot"></span><span class="timer" id="timer">0:00</span>
          <canvas class="live" id="live"></canvas>
          <span class="slide" id="slide">Slide to cancel</span>
        </div>
        <span class="lockpill" id="lockpill" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path id="shackle" d="M8 11V8a4 4 0 0 1 8 0v3" /></svg><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 7.5 3-3 3 3" /></svg></span>
        <button class="mic" id="mic" type="button" aria-label="Record a voice note. Hold, or press to start">
          <span class="ripple"></span><span class="ripple r2"></span>
          <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
          <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Hum Note: hold to record a voice note, slide to cancel, lift to lock, release to send ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { $("#status").textContent = t; };
  let toastT = 0;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }
  const clock = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const timeNow = () => new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

  const thread = $("#thread"), comp = $("#comp"), mic = $("#mic"), field = $("#field"), fx = $("#fx");
  const live = $("#live"), lctx = live.getContext("2d");
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5Z" /></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" /></svg>';
  const TICKS = '<span class="ticks" aria-hidden="true"><svg class="t0" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="6" r="4.4" /><path d="M9 3.6V6l1.6 1" /></svg><svg class="t1" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"><path d="m2 6.5 3 3 6-7" /></svg><svg class="t2" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"><path d="m2 6.5 3 3 6-7M8 9.5l6-7" /></svg></span>';

  // ---------- A pretend voice: syllables of louder bars with short gaps ----------
  function demoLevels(n, seed) {
    let s = seed || 7;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const out = [];
    while (out.length < n) {
      const len = 3 + Math.floor(rnd() * 5), peak = 0.45 + rnd() * 0.55;
      for (let k = 0; k < len && out.length < n; k++) out.push(Math.max(0.12, peak * Math.sin((Math.PI * (k + 0.5)) / len) * (0.75 + rnd() * 0.25)));
      for (let k = 0, gap = 1 + Math.floor(rnd() * 2); k < gap && out.length < n; k++) out.push(0.08 + rnd() * 0.08);
    }
    return out;
  }
  const resample = (arr, n) => Array.from({ length: n }, (_, i) => { const a = Math.floor((i / n) * arr.length), b = Math.max(a + 1, Math.floor(((i + 1) / n) * arr.length)); let m = 0; for (let k = a; k < b && k < arr.length; k++) m = Math.max(m, arr[k]); return Math.max(0.1, m); });

  // ---------- Voice bubbles with play, scrub and speed ----------
  const BARS = 30;
  let current = null; // the bubble that is playing
  function voiceBubble(note, fresh) {
    const el = document.createElement("div");
    el.className = "msg out voice";
    el.innerHTML = '<button class="pp" type="button">' + ICON_PLAY + '</button><div class="wave" tabindex="0" role="slider" aria-valuemin="0"></div><div class="vmeta"><span class="time"></span><button class="speed" type="button" aria-label="Playback speed 1 times">1×</button><span class="t"></span>' + TICKS + '</div><span class="react" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#ff3d6e"><path d="M12 21s-7.5-4.6-9.4-9.3C1.2 8.2 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 5.8 3.7 4.4 7.2C19.5 16.4 12 21 12 21Z" /></svg></span>';
    const wave = el.querySelector(".wave");
    note.levels.forEach((h) => { const i = document.createElement("i"); i.style.setProperty("--h", Math.min(1, h).toFixed(2)); wave.appendChild(i); });
    const dot = document.createElement("span"); dot.className = "head-dot"; wave.appendChild(dot);
    el.querySelector(".t").textContent = note.at || timeNow();
    const b = { el, note, pos: 0, speed: 1, playing: false };
    el._b = b;

      const b = notes[notes.length - 1] && notes[notes.length - 1]._b;
      if (!b) { queueDemo(1000); return; }
      demoNote = b;
      toggle(b, false);
      await wait(1200);
      if (demoOn && b.playing) b.el.querySelector(".speed").click();
      await wait(2600);
      if (!demoOn) return;
      if (b.playing) stopPlay(b);
      if (b.speed !== 1) { b.speed = 1; b.el.querySelector(".speed").textContent = "1×"; }
      b.pos = 0; paintBubble(b);
      demoNote = null;
      queueDemo(1800);
    }
  }
  queueDemo(900);
</script>
</body>
</html>
