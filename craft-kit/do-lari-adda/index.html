<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Lari Adda look: truck-art colour strips, hanging bead fringe, slab type ======================= */
  :root {
    --slab: Rockwell, "Roboto Slab", "Zilla Slab", "Bookman Old Style", Georgia, serif;
    --bg: #faf1e1; --surface: #fffdf7; --surface2: #f3e8d4; --field: #fffaf0; --ink: #1d2433; --mut: #6a6658; --line: #e6d8bd;
    --acc: #d92d2a; --acc-ink: #fff; --teal: #0e7c7b; --yel: #f2b400; --grn: #2a9d4b; --pink: #d9408f; --navy: #1b2c5c;
    --ok: #23874a; --warn: #b5700a; --bad: #c9302c;
    --c1: #d92d2a; --c2: #0e7c7b; --c3: #f2b400; --c4: #1b2c5c; --c5: #d9408f; --c6: #2a9d4b;
    --rb: 10px; --ri: 10px; --rm: 16px; --map: #f0e2c4; --map2: #e3cfa6;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1822; --surface: #152331; --surface2: #1d2f40; --field: #112030; --ink: #f6ecd6; --mut: #a7a08c; --line: #2a3d50;
    --acc: #ff5a4f; --acc-ink: #1a0b0a; --teal: #33c2c0; --yel: #ffc93c; --grn: #5fd38a; --pink: #ff6fb5; --navy: #0a1424;
    --ok: #5fd38a; --warn: #ffc93c; --bad: #ff6a5f;
    --c1: #ff5a4f; --c2: #33c2c0; --c3: #ffc93c; --c4: #8fb4ff; --c5: #ff6fb5; --c6: #5fd38a;
    --map: #1b2d3e; --map2: #24394d; --toast: #1d2f40;
    color-scheme: dark;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  h1, h2, h3, .slab { font-family: var(--slab); font-weight: 700; letter-spacing: -.01em; }
  h3 { margin: 0 0 10px; font-size: 17px; }
  .strip { background: repeating-linear-gradient(90deg, var(--c1) 0 16px, var(--c3) 16px 32px, var(--c2) 32px 48px, var(--c5) 48px 64px, var(--c6) 64px 80px); }
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar: navy with a yellow chevron marker */
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--navy); color: #f3e9d2; display: flex; flex-direction: column; z-index: 60; }
  .side .strip { height: 8px; flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; color: inherit; text-decoration: none; }
  .brand b { font-family: var(--slab); font-size: 21px; display: block; line-height: 1; }
  .brand small { opacity: .65; font-size: 11px; }
  .nav { position: relative; display: grid; gap: 2px; padding: 4px 10px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 10px 14px; color: rgba(243, 233, 210, .72); text-decoration: none; font-weight: 650; transition: color .2s, padding .25s; }
  .nav a:hover { color: #fff; padding-left: 18px; }
  .nav a[aria-current="page"] { color: #1d2433; }
  .nav .marker { position: absolute; left: 10px; right: 10px; top: 0; height: 40px; background: var(--yel); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); transition: transform .5s cubic-bezier(.3, 1.35, .4, 1), height .3s; opacity: 0; }
  .side-foot { margin-top: auto; padding: 14px 16px 18px; font-size: 12px; opacity: .8; display: grid; gap: 4px; }
  .side-foot b { font-family: var(--slab); font-size: 18px; color: var(--yel); }
  .scrim { display: none; }
  .main { min-width: 0; overflow-x: clip; }
  /* Header with the hanging bead fringe */
  .top { position: relative; display: flex; align-items: center; gap: 10px; padding: 14px 24px 22px; }
  .top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 4px; height: 14px; background: radial-gradient(circle at 50% 78%, var(--yel) 0 3px, transparent 3.5px) 0 0 / 18px 14px repeat-x, radial-gradient(circle at 50% 78%, var(--c1) 0 3px, transparent 3.5px) 9px 2px / 18px 14px repeat-x, linear-gradient(var(--line), var(--line)) 0 0 / 100% 2px no-repeat; transform-origin: top; animation: swingF 2.4s ease-in-out 2; }
  @keyframes swingF { 25% { transform: skewX(6deg); } 75% { transform: skewX(-6deg); } }
  .top h2 { margin: 0; flex: 1; min-width: 0; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srch { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--mut); min-width: 210px; }
  .srch kbd { margin-left: auto; font: 700 10.5px/1 system-ui; padding: 3px 6px; border-radius: 5px; background: var(--surface2); }
  .ibtn { border-width: 2px; }
  .menu-btn { display: none !important; }
  .view { padding: 8px 24px 44px; display: grid; gap: 16px; max-width: 1420px; }

  /* Cards with a truck-art strip and corner rivets; they swing in like hanging boards */
  .card { position: relative; overflow: hidden; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 22px 18px 18px; min-width: 0; transition: transform .25s, box-shadow .25s; background-image: radial-gradient(circle, var(--line) 0 2.5px, transparent 3px), radial-gradient(circle, var(--line) 0 2.5px, transparent 3px); background-size: 10px 10px; background-repeat: no-repeat; background-position: 8px calc(100% - 8px), calc(100% - 8px) calc(100% - 8px); }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--c1) 0 16px, var(--c3) 16px 32px, var(--c2) 32px 48px, var(--c5) 48px 64px, var(--c6) 64px 80px); }
  .card:hover { transform: translateY(-3px) rotate(-.2deg); box-shadow: 0 14px 0 -6px color-mix(in srgb, var(--c3) 45%, transparent); }
  .in { animation: swing .7s cubic-bezier(.3, 1.2, .4, 1) backwards; animation-delay: calc(var(--i) * 60ms); transform-origin: 50% 0; }
  @keyframes swing { 0% { opacity: 0; transform: rotate(-3deg) translateY(-16px); } 60% { opacity: 1; transform: rotate(1.2deg); } }
  .ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .ph h1 { margin: 0; font-size: 30px; }
  .ph p { margin: 4px 0 0; }
  .g { display: grid; gap: 16px; }
  .k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .c21 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  .c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ch-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ch-h h3 { margin: 0; }
  .ch-h p { margin: 3px 0 0; font-size: 12.5px; }

  .ibtn.sm { width: 30px; height: 30px; } .ibtn.sm .ic { width: 15px; height: 15px; }
  .reg { display: inline-block; font: 800 11.5px/1 ui-monospace, Menlo, Consolas, monospace; padding: 4px 7px; border-radius: 5px; background: var(--yel); color: #1d2433; border: 2px solid #1d2433; letter-spacing: .05em; white-space: nowrap; }

  .kpi { display: grid; gap: 4px; }
  .kpi .lab { font-size: 12px; font-weight: 700; color: var(--mut); display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .lab .ic { width: 26px; height: 26px; padding: 5px; border-radius: 8px; color: #fff; background: var(--k, var(--c1)); }

  /* Signature: the live route map with moving trucks */
  .mapwrap { position: relative; }
  .map { width: 100%; height: auto; display: block; max-height: 470px; }
  .map .land { fill: var(--map); stroke: var(--map2); stroke-width: 2; }
  .map .road { fill: none; stroke: var(--map2); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .map .road2 { fill: none; stroke: var(--surface); stroke-width: 1.5; stroke-dasharray: 5 6; }
  .map .road.hot { stroke: color-mix(in srgb, var(--c3) 70%, var(--map2)); }
  .map .city circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .map .city text { fill: var(--ink); font: 700 11px var(--slab); paint-order: stroke; stroke: var(--map); stroke-width: 3px; }
  .map .trk { transition: transform 1s linear; cursor: pointer; }

  .map .trk .body { stroke: var(--ink); stroke-width: 1.2; }
  .map .trk:hover .halo, .map .trk.sel .halo { opacity: 1; }
  .map .halo { opacity: 0; fill: none; stroke: var(--c3); stroke-width: 3; transition: opacity .2s; }
  .map .trk.late .body { fill: var(--bad) !important; }
  .scrub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

  .brow:hover { background: color-mix(in srgb, var(--c3) 22%, var(--surface2)); }
  .brow.head { background: none; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); font-weight: 700; }
  .brow > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flap { display: inline-block; padding: 3px 6px; border-radius: 4px; font: 800 10.5px/1.2 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .05em; background: #1d2433; color: var(--yel); text-align: center; min-width: 76px; }
  .flap.road { color: #7fe3a0; } .flap.late { color: #ff8a80; } .flap.done { color: #c9c1ad; } .flap.load { color: #9fd3ff; }
  .flap.flip { animation: flip .6s ease-in-out; }
  @keyframes flip { 0% { transform: perspective(200px) rotateX(0); } 50% { transform: perspective(200px) rotateX(90deg); } 100% { transform: perspective(200px) rotateX(0); } }

  /* Bilty: form and the live carbon-copy slip */
  .bilty { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  .slip-tot { display: flex; justify-content: space-between; padding: 10px 14px; font-family: var(--slab); font-size: 17px; }
  .stamp { display: inline-block; margin: 4px 14px 0; padding: 4px 10px; border: 3px double #c9302c; color: #c9302c; font: 800 14px/1 var(--slab); text-transform: uppercase; transform: rotate(-6deg); opacity: .85; }

  .fsec { margin: 2px 0 14px; padding-top: 12px; border-top: 2px dashed var(--line); }
  .fsec:first-child { border-top: 0; padding-top: 0; }
  .fsec h4 { margin: 0 0 10px; font-family: var(--slab); font-size: 14px; color: var(--teal); }

  /* Fleet and drivers */
  .trucks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .truck { text-align: left; color: inherit; display: grid; gap: 8px; }
  .truck .art { height: 56px; display: grid; place-items: center; border-radius: 10px; background: var(--surface2); }
  .truck .art svg { width: 110px; height: 50px; }
  .cap { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
  .cap i { display: block; height: 100%; width: var(--w); background: repeating-linear-gradient(90deg, var(--c2) 0 8px, var(--c3) 8px 16px); }
  .facts { display: grid; grid-template-columns: 120px 1fr; gap: 7px 12px; font-size: 13.5px; margin: 10px 0 14px; }

  .stops { list-style: none; margin: 8px 0 14px; padding: 0 0 0 16px; border-left: 3px dashed var(--line); display: grid; gap: 10px; }
  .stops li { position: relative; font-size: 13px; }
  .stops li::before { content: ""; position: absolute; left: -24px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); }
  .stops li.done::before { background: var(--ok); border-color: var(--ok); }
  .stops li.now::before { background: var(--c3); border-color: var(--c1); }
  .rows { display: grid; gap: 5px; font-size: 13px; }
  .rows div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .rows .tot { font-weight: 800; border-bottom: 0; font-size: 15px; }
  .set-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .chk { display: flex !important; align-items: center; gap: 8px; color: var(--ink) !important; font-size: 13px !important; padding-top: 22px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--acc); }

  @media (max-width: 1150px) { .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bilty { grid-template-columns: 1fr; } .slip { position: static; } }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }

    body.nav-open .side { transform: none; box-shadow: 20px 0 60px rgba(0, 0, 0, .4); }
    .scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(10, 15, 25, .5); opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.nav-open .scrim { opacity: 1; pointer-events: auto; }

  }
  @media (max-width: 600px) {
    .top { padding: 12px 14px 22px; } .view { padding: 6px 14px 34px; }
    .srch { min-width: 0; padding: 9px; } .srch span, .srch kbd { display: none; }
    .kpi .val { font-size: 23px; }
    .brow { grid-template-columns: 64px minmax(0, 1fr) 84px; }
    .brow > :nth-child(3), .brow > :nth-child(5) { display: none; }
    .slip-g { grid-template-columns: 1fr; } .slip-g > div:nth-child(odd) { border-right: 0; }
    .facts { grid-template-columns: 96px 1fr; }
  }
  @media print { body > *:not(.ov) { display: none !important; } .ov { position: static; background: none; backdrop-filter: none; } .modal { box-shadow: none; transform: none; max-height: none; } .m-h button, .m-f { display: none !important; } }
</style>

<script>
/* ======================= Shared kit (same in every Chill & Craft dashboard) ======================= */
"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */
let _seed = 1;
const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */
const PK = {
  m: ["Ahmed", "Bilal", "Usman", "Hamza", "Ali", "Imran", "Faisal", "Zubair", "Saad", "Kamran", "Asif", "Tariq", "Shahid", "Naveed", "Waqas", "Adeel", "Fahad", "Junaid", "Rizwan", "Salman", "Danish", "Arslan", "Haris", "Owais", "Shoaib", "Yasir", "Moiz", "Talha"],
  f: ["Ayesha", "Fatima", "Sana", "Hira", "Maryam", "Zainab", "Amna", "Mahnoor", "Rabia", "Iqra", "Sadia", "Noor", "Kiran", "Saba", "Anum", "Mehwish", "Hina", "Uzma", "Bushra", "Nida", "Laiba", "Areeba"],
  last: ["Khan", "Malik", "Butt", "Qureshi", "Sheikh", "Chaudhry", "Abbasi", "Siddiqui", "Mirza", "Raza", "Awan", "Javed", "Rana", "Baig", "Hashmi", "Gondal", "Shah", "Memon", "Baloch", "Niazi", "Ansari", "Jutt", "Kazmi", "Bhatti"],
  cities: ["Karachi", "Lahore", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Gujranwala", "Hyderabad", "Sukkur", "Bahawalpur", "Abbottabad"],
};
const pname = (g) => pick(g === "f" ? PK.f : g === "m" ? PK.m : rnd() < 0.5 ? PK.f : PK.m) + " " + pick(PK.last);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + ri(1000000, 9999999);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

/* ---------- Number formats: Rs 12,500 · 1.2M · $1,240 ---------- */
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = (n) => (n < 0 ? "-" : "") + "Rs " + num(Math.abs(n));
const short = (n) => { const a = Math.abs(+n || 0), s = n < 0 ? "-" : "", f = (v, u) => s + (v >= 100 ? Math.round(v) : +v.toFixed(1)) + u; return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + (a % 1 ? +a.toFixed(1) : a); };
const rss = (n) => (n < 0 ? "-" : "") + "Rs " + short(Math.abs(n));
const usd = (n, d = 0) => (n < 0 ? "-$" : "$") + num(Math.abs(n), d);
const pct = (n, d = 0) => num(n, d) + "%";
const FMT = { num: (v) => num(v), rs, rss, short, usd, usd2: (v) => usd(v, 2), pct: (v) => pct(v, 1), pct0: (v) => pct(v) };

/* ---------- Dates (local, no time zone surprises) ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = pd(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };

  const roads = Object.keys(ROUTES).map((r) => { const d = "M" + routePts(r).map((p) => p.join(",")).join(" L"); return `<path class="road${used.has(r) ? " hot" : ""}" d="${d}"/><path class="road2" d="${d}"/>`; }).join("");
  const cities = Object.entries(CITY).map(([n, [x, y]]) => `<g class="city"><circle cx="${x}" cy="${y}" r="${n === "Karachi" || n === "Lahore" ? 6 : 4.5}"/><text x="${x + (x > 300 ? -8 : 9)}" y="${y + (n === "Hyderabad" ? 14 : -7)}" text-anchor="${x > 300 ? "end" : "start"}">${n}</text></g>`).join("");
  el.innerHTML = `<div class="mapwrap"><svg class="map" viewBox="0 0 380 460" role="img" aria-label="Map of live trips between Pakistani cities"><path class="land" d="${LAND}"/>${roads}${cities}<g id="trucks"></g></svg></div>${opts.scrub ? `<div class="scrub"><label for="scrub" class="sm">Look ahead</label><input id="scrub" type="range" min="0" max="24" step="1" value="${OFFSET}" aria-valuetext="${OFFSET} hours ahead"><b id="scrubLab">${OFFSET ? "+" + OFFSET + " h · " + hm(nowMs()) : "Now · live"}</b><button type="button" class="btn sm ghost" id="play">${ico("arrow")} Play next 24 h</button></div>` : ""}`;
  placeTrucks(el, true);
}
function placeTrucks(el, first) {
  const g = $("#trucks", el); if (!g) return;
  const L = S.trips.filter(live);
  $$(".trk", g).forEach((n) => { if (!L.some((t) => t.id === n.getAttribute("data-trip"))) n.remove(); });
  L.forEach((t) => {
    let n = $(`.trk[data-trip="${t.id}"]`, g);
    if (!n) { n = document.createElementNS("http://www.w3.org/2000/svg", "g"); n.setAttribute("class", "trk instant"); n.setAttribute("data-trip", t.id); n.setAttribute("tabindex", "0"); n.setAttribute("role", "button"); n.innerHTML = `<circle class="halo" r="13"/><rect class="body" x="-9" y="-5" width="18" height="10" rx="2" style="fill:${t.status === "Loading" ? "var(--c4)" : "var(--c3)"}"/><rect x="5" y="-5" width="5" height="10" rx="1" style="fill:var(--c1)"/>`; g.append(n); }
    const p = pointAt(t.route, prog(t)), late = nowMs() > t.eta && t.status !== "Arrived";
    n.setAttribute("aria-label", `${trOf(t.truck).reg}, ${t.route}, ${Math.round(prog(t) * 100)} percent`);
    n.classList.toggle("late", late || t.status === "Delayed");
    n.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${(p.a * 180 / Math.PI).toFixed(0)}deg)`;
    if (first) requestAnimationFrame(() => n.classList.remove("instant"));
  });
}
/* Departure board rows */
const boardRows = (L) => `<div class="board" role="list"><div class="brow head" aria-hidden="true"><span>Truck</span><span>Route</span><span>Driver</span><span>Status</span><span>ETA</span></div>${L.map((t) => `<button type="button" class="brow" role="listitem" data-trip="${t.id}"><span class="reg">${esc(trOf(t.truck).reg)}</span><span>${esc(t.route)}</span><span>${esc(drOf(t.driver).name)}</span><span><b class="flap ${flapCls(t.status)}" data-st="${t.status}">${t.status}</b></span><span class="sm">${t.status === "Arrived" ? "done" : hm(t.eta).slice(4)}</span></button>`).join("")}</div>`;
/* Every second: move trucks; flip a tile when a trip's status changes */
function liveTick(v) {
  const now = Date.now(); let changed = 0;
  S.trips.forEach((t) => { if (t.status === "Loading" && now >= t.dep) { t.status = "On road"; changed++; } if ((t.status === "On road" || t.status === "Delayed") && now >= t.eta) { t.status = "Arrived"; S.bilty.forEach((b) => { if (b.trip === t.id) b.status = "Delivered"; }); changed++; } });
  if (changed) { save(); paintSide(); }
  placeTrucks(v);
  $$(".flap[data-st]", v).forEach((f) => { const t = tripOf(f.closest("[data-trip]").getAttribute("data-trip")); if (t && f.dataset.st !== t.status) { f.dataset.st = t.status; f.textContent = t.status; f.className = "flap " + flapCls(t.status) + (RM ? "" : " flip"); } });
}

  };

  });

function arrive(t) {
  const prev = { status: t.status, eta: t.eta }, B = S.bilty.filter((b) => b.trip === t.id), bs = B.map((b) => b.status), R = ROUTES[t.route];
  t.status = "Arrived"; t.eta = Math.min(t.eta, Date.now()); B.forEach((b) => (b.status = "Delivered"));
  const pay = { id: uid("L"), date: TODAY, driver: t.driver, kind: "Trip pay", note: `${t.route} (${t.id})`, amt: Math.round((R.km * S.set.perKm) / 100) * 100 + S.set.khuraki * Math.ceil(R.hrs / 24 + 1) };
  S.ledger.push(pay);
  afterChange(`${trOf(t.truck).reg} arrived. ${B.length} bilties delivered, trip pay ${rs(pay.amt)} added.`, { undo: () => { Object.assign(t, prev); B.forEach((b, i) => (b.status = bs[i])); S.ledger = S.ledger.filter((l) => l !== pay); afterChange("Arrival undone"); } });
}

  const t = S.trucks.find((x) => x.id === id); if (!t) return;
  const L = S.trips.filter((x) => x.truck === id).sort((a, b) => b.dep - a.dep), dr = drOf(t.driver);
  const m = modal({ drawer: true, title: t.reg, body: `<div class="art" style="display:grid;place-items:center;height:80px;border-radius:12px;background:var(--surface2);margin-bottom:12px">${TRUCK_SVG()}</div><dl class="facts"><dt>Type</dt><dd>${esc(t.type)}</dd><dt>Driver</dt><dd>${esc(dr.name)}${dr.phone ? " · " + esc(dr.phone) : ""}</dd><dt>CNIC</dt><dd>${dr.cnic ? dr.cnic.slice(0, 5) + "-•••••••-" + dr.cnic.slice(-1) : "—"}</dd><dt>Licence</dt><dd>${esc(dr.licence || "—")}</dd><dt>Fitness</dt><dd>${fdy(t.fitness)}</dd><dt>Token tax</dt><dd>${fdy(t.token)}</dd><dt>Odometer</dt><dd>${num(t.odo)} km</dd></dl><h3>Recent trips</h3><div class="rows">${L.slice(0, 6).map((x) => `<div><button type="button" class="lnk" data-trip="${x.id}">${x.id}</button><span>${esc(x.route)}</span><b class="flap ${flapCls(x.status)}">${x.status}</b></div>`).join("") || '<div class="empty-st">No trips yet.</div>'}</div>`, foot: `<button type="button" class="btn ghost danger-t" data-tdel>${ico("trash")} Remove</button><button type="button" class="btn ghost" data-tedit>${ico("edit")} Edit</button>` });
  $("[data-tedit]", m.el).onclick = () => { m.close(); truckForm(t); };
  $("[data-tdel]", m.el).onclick = async () => { if (S.trips.some((x) => x.truck === t.id && live(x))) return toast("This truck is on a trip right now", { type: "bad" }); if (!(await ask(`Remove ${t.reg} from the fleet?`, { ok: "Remove" }))) return; const i = S.trucks.indexOf(t); S.trucks.splice(i, 1); m.close(); afterChange(`${t.reg} removed`, { undo: () => { S.trucks.splice(i, 0, t); afterChange("Truck restored"); } }); };
}

/* ======================= Global wiring ======================= */
const DO = {
  trip: () => tripForm(), truck: () => truckForm(), driver: () => driverForm(), advance: () => ledgerForm("Advance"), settle: () => ledgerForm("Paid"), theme: () => Theme.toggle(),
  csv: () => {
    if (!window.Blob || !URL.createObjectURL) return toast("Downloads are not available here", { type: "warn" });
    const rows = [["Bilty", "Date", "Route", "Sender", "Receiver", "Goods", "Packages", "Tons", "Freight", "Labour", "Terms", "Status"], ...S.bilty.map((b) => [b.id, b.date, b.route, b.consignor, b.consignee, b.goods, b.pk, b.tons, b.freight, b.labour, b.terms, b.status])];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" })); a.download = "lari-adda-bilties.csv"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); toast("Bilties CSV downloaded");
  },
  reset: async () => { if (!(await ask("Reset trucks, trips and bilties to the sample company?", { title: "Reset demo data", ok: "Reset" }))) return; S = Store.reset(); OFFSET = 0; Bell.read.clear(); afterChange("Demo data reset"); },
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (d && DO[d.dataset.do]) return DO[d.dataset.do](d);
  const tr = e.target.closest("[data-trip]"); if (tr) return openTrip(tr.getAttribute("data-trip"));
  const tk = e.target.closest("[data-truck]"); if (tk) openTruck(tk.dataset.truck);
});
document.addEventListener("keydown", (e) => { const g = e.target.closest && e.target.closest(".trk"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openTrip(g.getAttribute("data-trip")); } });
APP.notes = () => {
  const L = [];
  S.trips.filter((t) => t.status === "Delayed").forEach((t) => L.push({ id: "dl" + t.id + t.eta, t: `${trOf(t.truck).reg} delayed`, d: `${t.route}: ${t.reason}`, go: "#/trips/" + t.id }));
  S.trucks.forEach((t) => { const f = dayDiff(TODAY, t.fitness); if (f < 30) L.push({ id: "fit" + t.id + t.fitness, t: `${t.reg} fitness ${f < 0 ? "expired" : "due in " + f + " days"}`, d: "Book the inspection", go: "#/fleet" }); });
  const w = S.bilty.filter((b) => b.status === "Booked"); if (w.length) L.push({ id: "wait" + w.length, t: `${w.length} bilties waiting at the adda`, d: "Dispatch a truck for them", go: "#/loads" });
  return L.slice(0, 9);
};
APP.cmds = () => [{ label: "New bilty", run: () => Router.go("bilty") }, { label: "Dispatch a truck", run: DO.trip }, { label: "Give a driver advance", run: DO.advance }, { label: "Pay a driver", run: DO.settle }, { label: "Add a truck", run: DO.truck }, { label: "Switch light or dark theme", run: DO.theme }, ...S.trips.filter(live).map((t) => ({ label: `${t.id} · ${trOf(t.truck).reg} · ${t.route}`, hint: "Trip", run: () => openTrip(t.id) })), ...S.bilty.slice(-25).map((b) => ({ label: `${b.id} · ${b.consignor} → ${b.consignee}`, hint: "Bilty", run: () => openBilty(b.id) })), ...S.trucks.map((t) => ({ label: `${t.reg} · ${t.type}`, hint: "Truck", run: () => openTruck(t.id) }))];
APP.onRoute = (id) => { if (id !== "trips") { OFFSET = 0; clearInterval(PLAY); PLAY = 0; } };
paintSide();
boot();
</script>
</body>
</html>
