<!doctype html>
<!-- Chill & Craft · Brickwork · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brickwork · donation card where every gift lays a brick</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: desert sand, turquoise sky and brick (light), a desert night (dark) ---------- */
  :root {
    --bg: #efe4d0; --bg-2: #fbf6ec; --card: #fffcf6; --edge: rgba(70, 40, 20, 0.1); --ink: #2b1d14; --muted: #7a6656; --soft: #f6eedf; --soft-2: #eadcc4;
    --accent: #0f8b8d; --accent-2: #15a6a3; --on-accent: #fff; --brick: #c8643b; --brick-2: #a94f2c; --good: #2f8a5b; --shadow: rgba(80, 50, 20, 0.3); --focus: #0f8b8d;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0a08; --bg-2: #1d1712; --card: #16120e; --edge: rgba(255, 255, 255, 0.08); --ink: #f4ebe0; --muted: #b3a291; --soft: #201a14; --soft-2: #2e251c;
    --accent: #3fd0c9; --accent-2: #6fe3dc; --on-accent: #062a29; --brick: #e07a4f; --brick-2: #c4643c; --good: #63d39a; --shadow: rgba(0, 0, 0, 0.7); --focus: #3fd0c9;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(60% 50% at 80% 10%, var(--bg-2), transparent 70%), var(--bg); }
  .stage::before { content: ""; position: absolute; inset: auto -10% -30% -10%; height: 60%; background: radial-gradient(50% 60% at 50% 100%, var(--soft-2), transparent 70%); pointer-events: none; }

  .card { position: relative; width: min(940px, 100%); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); border-radius: 30px; background: var(--card); border: 1px solid var(--edge); overflow: hidden;
    box-shadow: 0 50px 90px -50px var(--shadow), 0 12px 28px -20px var(--shadow); animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(0.96); } }

  /* ---------- The building site ---------- */
  .site { position: relative; min-height: 520px; overflow: hidden; background: #f3d9a8; }
  .site > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .dune1 { animation: dune 28s ease-in-out infinite alternate; } .dune2 { animation: dune 40s ease-in-out infinite alternate-reverse; }
  /* dark theme: the same site at dusk */
  :root[data-theme="dark"] .sk1 { stop-color: #10394a; } :root[data-theme="dark"] .sk2 { stop-color: #3f6f73; } :root[data-theme="dark"] .sk3 { stop-color: #e0a56a; }
  :root[data-theme="dark"] .dune2 { fill: #b98a52; } :root[data-theme="dark"] .dune1 { fill: #a8783f; }
  :root[data-theme="dark"] .site { background: #1d3a40; }
  @keyframes dune { to { transform: translateX(-14px); } }
  .cloud.c1 { animation: drift 46s ease-in-out infinite alternate; } .cloud.c2 { animation: drift 64s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translateX(46px); } }
  .sunG { transform-box: fill-box; transform-origin: center; animation: glow 5s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.08); opacity: 0.85; } }
  .birds path { fill: none; stroke: #3c4b52; stroke-width: 1.3; stroke-linecap: round; }
  .birds { animation: fly 30s linear infinite; }
  @keyframes fly { from { transform: translateX(-60px); } to { transform: translateX(470px); } }
  .birds path { animation: flap 0.7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes flap { to { transform: scaleY(0.4); } }
  .brick { transform-box: fill-box; transform-origin: 50% 100%; stroke: #edd9b9; stroke-width: 1.6; }
  .brick.todo { fill: none; stroke: rgba(120, 70, 40, 0.35); stroke-width: 1; stroke-dasharray: 3 3; }
  .brick.next { stroke: rgba(15, 139, 141, 0.9); stroke-width: 1.4; animation: blinkline 1.4s ease-in-out infinite; }
  @keyframes blinkline { 50% { stroke-opacity: 0.3; } }
  .brick.drop { animation: drop 0.75s cubic-bezier(0.5, 0, 0.75, 0.3) backwards, land 0.45s cubic-bezier(0.3, 1.8, 0.5, 1) backwards; animation-delay: var(--d), calc(var(--d) + 0.75s); }
  @keyframes drop { from { transform: translateY(-260px) rotate(var(--rot, 8deg)); opacity: 1; } to { transform: translateY(0) rotate(0); } }
  @keyframes land { 0% { transform: scale(1.12, 0.7); } 60% { transform: scale(0.96, 1.08); } 100% { transform: none; } }
  .brick.mine { animation-name: drop, land, glint; animation-duration: 0.75s, 0.45s, 1.6s; animation-delay: var(--d), calc(var(--d) + 0.75s), calc(var(--d) + 1.1s); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0.3), cubic-bezier(0.3, 1.8, 0.5, 1), ease; }
  @keyframes glint { 30% { fill: #f1b25a; } }
  .brick.out { animation: out 0.4s cubic-bezier(0.6, 0, 0.8, 0.4) forwards; animation-delay: var(--d); }
  @keyframes out { to { transform: translateY(-30px) scale(0.6); opacity: 0; } }
  .puff { fill: #f4e3c4; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .puff.go { animation: puff 0.6s ease-out forwards; }
  @keyframes puff { 0% { opacity: 0.9; transform: scale(0.3); } 100% { opacity: 0; transform: scale(1.8) translateY(-4px); } }
  .roof { transform: translateY(-240px); opacity: 0; transition: transform 0.9s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.2s; }
  .done .roof { transform: none; opacity: 1; }
  .pole { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) 0.8s; }
  .done .pole { transform: none; }
  .flag { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) 1.3s; }
  .done .flag { transform: none; }
  .done .flag path { animation: wave 1.2s ease-in-out infinite alternate; }
  @keyframes wave { to { d: path("M0 0 C 8 4, 16 -4, 26 2 L26 16 C 16 10, 8 18, 0 14 Z"); } }
  .kid { opacity: 0; }
  .done .kid { animation: walk 3.2s cubic-bezier(0.4, 0, 0.4, 1) forwards; animation-delay: calc(1.6s + var(--k) * 0.35s); }
  @keyframes walk { 0% { opacity: 0; transform: translateX(-90px); } 10% { opacity: 1; } 85% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(8px); } }
  .done .kid .bob { animation: bob 0.32s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-2px); } }
  .sign { position: absolute; left: 16px; top: 16px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 14px; background: rgba(255, 252, 246, 0.9); color: #2b1d14; font-size: 12.5px; font-weight: 800; box-shadow: 0 10px 20px -12px rgba(60, 30, 10, 0.5); }
  .sign b { color: #a94f2c; font-variant-numeric: tabular-nums; }
  .sign.pop { animation: signpop 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes signpop { 40% { transform: scale(1.1); } }
  .banner { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 30px) scale(0.9); opacity: 0; padding: 10px 16px; border-radius: 16px; background: #0f8b8d; color: #fff; text-align: center; white-space: nowrap; transition: opacity 0.4s 1.4s, transform 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) 1.4s; box-shadow: 0 14px 30px -14px rgba(0, 60, 60, 0.6); }
  .done .banner { opacity: 1; transform: translate(-50%, 0); }
  .banner strong { display: block; font-size: 15px; }
  .banner span { font-size: 12px; opacity: 0.85; }

  /* ---------- Campaign panel ---------- */
  .info { padding: 24px 26px 22px; display: flex; flex-direction: column; min-width: 0; }
  .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: dotp 1.6s ease-in-out infinite; }
  @keyframes dotp { 50% { opacity: 0.3; } }
  h1 { margin: 8px 0 4px; font-size: clamp(22px, 2.8vw, 27px); line-height: 1.15; letter-spacing: -0.015em; }
  .org { margin: 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .org svg { width: 15px; height: 15px; flex: none; }
  .raised { margin-top: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .raised strong { font-size: 28px; font-weight: 850; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .raised span { font-size: 13px; color: var(--muted); font-weight: 650; }
  .bar { position: relative; height: 12px; border-radius: 99px; background: var(--soft-2); margin-top: 10px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: calc(var(--p, 0) * 100%); border-radius: inherit; background: repeating-linear-gradient(-45deg, var(--brick) 0 8px, var(--brick-2) 8px 16px); background-size: 22.6px 22.6px; transition: width 1s cubic-bezier(0.3, 1.3, 0.5, 1); animation: march 1s linear infinite; }
  @keyframes march { to { background-position: 22.6px 0; } }
  .done-card .bar i { background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, var(--accent-2) 8px 16px); background-size: 22.6px 22.6px; }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .num { padding: 9px 10px; border-radius: 14px; background: var(--soft); }
  .num b { display: block; font-size: 17px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .num small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; }
  .lbl { margin: 16px 0 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .amts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .amt { position: relative; padding: 10px 6px; border-radius: 14px; border: 1.5px solid var(--edge); background: var(--card); text-align: center; transition: border-color 0.25s, background 0.25s, transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .amt b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .amt small { display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); font-weight: 700; }
  .amt small i { width: 10px; height: 5px; border-radius: 1px; background: var(--brick); }
  .amt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .amt:active { transform: scale(0.94); }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
  .fld { position: relative; }
  .fld label { position: absolute; left: 12px; top: 7px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--muted); pointer-events: none; }
  .fld input[type="text"], .fld input[type="number"] { width: 100%; padding: 22px 12px 8px; border-radius: 14px; border: 1.5px solid var(--edge); background: var(--soft); font-size: 14.5px; font-weight: 700; outline: none; transition: border-color 0.2s, background 0.2s; -moz-appearance: textfield; }
  .fld input::-webkit-outer-spin-button, .fld input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .fld input:focus { border-color: var(--accent); background: var(--card); }
  .fld .eq { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11.5px; font-weight: 800; color: var(--brick); pointer-events: none; }
  .anon { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 650; color: var(--muted); cursor: pointer; width: max-content; }
  .anon input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .give { position: relative; margin-top: 14px; height: 54px; border: 0; border-radius: 17px; background: var(--accent); color: var(--on-accent); font-weight: 850; font-size: 15px; overflow: hidden; box-shadow: 0 16px 28px -14px var(--accent); transition: transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1), background 0.3s; }
  .give:active { transform: scale(0.96); }
  .give .fill { position: absolute; inset: 0; width: 0; background: rgba(255, 255, 255, 0.22); }
  .give.work .fill { animation: work 1.2s cubic-bezier(0.4, 0, 0.3, 1) forwards; }
  @keyframes work { to { width: 100%; } }
  .give span { position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .give svg { width: 18px; height: 18px; fill: currentColor; }
  .give.ok { background: var(--good); }
  .give.ok svg { animation: beat 0.8s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes beat { 30% { transform: scale(1.4); } }
  .give.busy { pointer-events: none; }
  .err { min-height: 0; margin-top: 6px; font-size: 12px; font-weight: 700; color: #d0453d; }
  .err:empty { margin: 0; }
  .donors { margin-top: 14px; height: 74px; overflow: hidden; position: relative; mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  .donors ul { list-style: none; margin: 0; padding: 0; transition: transform 0.6s cubic-bezier(0.3, 1.2, 0.5, 1); }
  .donors li { height: 37px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .donors .av { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 850; color: #fff; }
  .donors li b { font-weight: 750; }
  .donors li > span:last-child { color: var(--muted); margin-left: auto; font-size: 12px; white-space: nowrap; }
  .donors li.you { animation: youin 0.7s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes youin { from { transform: translateX(-20px); opacity: 0; } }

  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.82); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--brick); opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  @media (max-width: 800px) {
    .card { grid-template-columns: minmax(0, 1fr); max-width: 460px; border-radius: 26px; }
    .site { min-height: 0; height: 222px; }
    .info { padding: 16px 16px 16px; }
    .info > .lbl { display: none; }
    .amts { margin-top: 12px; }
    h1 { font-size: 21px; }
    .raised { margin-top: 10px; } .raised strong { font-size: 24px; }
    .nums { margin-top: 10px; } .num { padding: 7px 9px; } .num b { font-size: 15px; }
    .lbl { margin: 12px 0 7px; }
    .amt { padding: 8px 4px; }
    .anon { display: none; }
    .give { margin-top: 10px; height: 50px; }
    .donors { margin-top: 10px; height: 37px; mask-image: none; -webkit-mask-image: none; }
    .banner { bottom: 12px; padding: 8px 12px; }
    .org .long { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <article class="card" id="card" aria-labelledby="ttl">
    <div class="site" id="site">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" role="img" id="siteSvg" aria-label="A classroom wall being built, one brick per PKR 500">
        <defs>
          <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-120" x2="0" y2="300"><stop class="sk1" offset="0" stop-color="#4cc3c0"/><stop class="sk2" offset="0.65" stop-color="#bfe7d8"/><stop class="sk3" offset="1" stop-color="#f7e2b6"/></linearGradient>
          <radialGradient id="sunR"><stop offset="0" stop-color="#fff6d2"/><stop offset="0.4" stop-color="#ffe08a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
        </defs>
        <rect x="-400" y="-500" width="1200" height="800" fill="url(#sky)"/>
        <g class="cloud c1" fill="#fff" opacity="0.75"><ellipse cx="90" cy="-120" rx="44" ry="13"/><ellipse cx="112" cy="-130" rx="26" ry="14"/><ellipse cx="300" cy="-50" rx="36" ry="10"/><ellipse cx="318" cy="-58" rx="20" ry="11"/></g>
        <g class="cloud c2" fill="#fff" opacity="0.55"><ellipse cx="200" cy="-180" rx="50" ry="12"/><ellipse cx="60" cy="10" rx="30" ry="8"/></g>
        <circle class="sunG" cx="320" cy="70" r="56" fill="url(#sunR)"/><circle cx="320" cy="70" r="20" fill="#fff4c9"/>
        <g class="birds"><path d="M0 60 q5 -5 10 0 q5 -5 10 0"/><path d="M26 48 q4 -4 8 0 q4 -4 8 0" style="animation-delay:-.3s"/></g>
        <path class="dune2" d="M-400 232 L-60 230 Q40 196 140 222 T340 214 T520 224 L800 226 V300 H-400Z" fill="#ecc98d"/>
        <path class="dune1" d="M-400 248 L-60 246 Q60 222 180 244 T420 238 T520 246 L800 246 V300 H-400Z" fill="#e2b876"/>
        <!-- acacia tree -->
        <g transform="translate(26 262)"><path d="M0 0 C2 -20 -2 -34 6 -46 M6 -46 C 12 -52 18 -54 26 -56 M6 -46 C 0 -52 -8 -54 -14 -55" stroke="#6a4a2e" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="6" cy="-60" rx="30" ry="8" fill="#6f8f4e"/><ellipse cx="-6" cy="-64" rx="16" ry="5" fill="#7fa05a"/></g>
        <rect x="-400" y="262" width="1200" height="60" fill="#d9a865"/><path d="M-400 262 H800" stroke="#c89452" stroke-width="2"/>
        <!-- openings behind the bricks: a window and a green door -->
        <rect x="122" y="166" width="54" height="50" fill="#5b3a28"/><rect x="126" y="170" width="46" height="42" fill="#9fd8d3"/><path d="M149 170v42M126 191h46" stroke="#8a5a34" stroke-width="3"/>
        <rect x="226" y="190" width="52" height="72" fill="#5b3a28"/><rect x="230" y="194" width="44" height="68" rx="2" fill="#2f7a72"/><circle cx="266" cy="230" r="2.2" fill="#f1c27a"/><path d="M236 202h32M236 248h32" stroke="#276a63" stroke-width="2"/>
        <g id="wall"></g>
        <g id="puffs"></g>
        <!-- appears when the wall is done -->
        <g class="roof"><path d="M58 104 L342 104 L352 90 L48 90 Z" fill="#9aa5ad"/><path d="M48 90 L352 90" stroke="#7d8890" stroke-width="2"/><g stroke="#b4bec5" stroke-width="2"><path d="M70 92v10M95 92v10M120 92v10M145 92v10M170 92v10M195 92v10M220 92v10M245 92v10M270 92v10M295 92v10M320 92v10"/></g>
          <rect x="128" y="68" width="144" height="20" rx="3" fill="#fffcf6"/><text x="200" y="82" text-anchor="middle" font-size="9" font-weight="800" fill="#0f8b8d" font-family="system-ui, sans-serif">GIRLS SCHOOL MITHI</text></g>
        <rect class="pole" x="330" y="40" width="3" height="52" fill="#6b5b4b"/>
        <g transform="translate(333 42)"><g class="flag"><path d="M0 0 C 8 -4, 16 4, 26 0 L26 14 C 16 18, 8 10, 0 14 Z" fill="#0f8b8d"/><circle cx="13" cy="7" r="3" fill="#fff"/></g></g>
        <g id="kids"></g>
      </svg>
      <div class="sign" id="sign" aria-hidden="true"><svg width="18" height="10" viewBox="0 0 18 10"><rect width="18" height="10" rx="1.5" fill="#c8643b"/></svg><span><b id="toGoSign">30</b> bricks to go</span></div>
      <div class="banner" aria-hidden="true"><strong>The classroom is built!</strong><span>Thank you, every one of you</span></div>
    </div>

    <div class="info">
      <div class="eyebrow"><i></i>Fundraiser · Tharparkar</div>
      <h1 id="ttl">A classroom for the girls of Mithi</h1>
      <p class="org"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 2.1 3.2-.3.9 3.1 2.8 1.6-1.1 3 1.1 3-2.8 1.6-.9 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.9-3.1-2.8-1.6 1.1-3-1.1-3 2.8-1.6.9-3.1 3.2.3z" fill="#0f8b8d"/><path d="M8.5 12.2l2.4 2.3 4.6-4.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>Run by Sabeen Ashraf<span class="long"> · receipts for every rupee</span></p>

      <div class="raised"><strong id="raised" aria-live="polite">PKR 0</strong><span>raised of PKR 1,200,000</span></div>
      <div class="bar" id="bar"><i></i></div>
      <div class="nums">
        <div class="num"><b id="donorsN">1,276</b><small>donors</small></div>
        <div class="num"><b id="toGo">30</b><small>bricks to go</small></div>
        <div class="num"><b>9</b><small>days left</small></div>
      </div>

      <div class="lbl" id="amtL">Give bricks · PKR 500 each</div>
      <div class="amts" role="group" aria-labelledby="amtL">
        <button type="button" class="amt" data-v="500" aria-pressed="false"><b>500</b><small><i></i>1 brick</small></button>
        <button type="button" class="amt" data-v="2500" aria-pressed="true"><b>2,500</b><small><i></i>5 bricks</small></button>
        <button type="button" class="amt" data-v="5000" aria-pressed="false"><b>5,000</b><small><i></i>10 bricks</small></button>
      </div>
      <div class="row2">
        <div class="fld"><label for="custom">Other amount, PKR</label><input type="number" id="custom" min="500" step="500" inputmode="numeric" placeholder="e.g. 10000" /><span class="eq" id="eq"></span></div>
        <div class="fld"><label for="who">Name on the wall</label><input type="text" id="who" maxlength="24" placeholder="Optional" autocomplete="name" /></div>
      </div>
      <label class="anon"><input type="checkbox" id="anon" /> Give anonymously</label>
      <button class="give" id="give" type="button"><span class="fill"></span><span id="giveT"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.6 12 20 12 20z"/></svg>Give PKR 2,500 · 5 bricks</span></button>
      <div class="err" id="err" role="alert"></div>
      <div class="donors" aria-label="Recent donors"><ul id="donors"></ul></div>
    </div>
  </article>
  <p class="sr-only" aria-live="polite" id="say"></p>
</main>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="ghost" id="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
  (function () {
    "use strict";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
    var NS = "http://www.w3.org/2000/svg";
    function say(t) { $("#say").textContent = t; }
    function wait(fn, ms) { return setTimeout(fn, reduce.matches ? Math.min(ms, 30) : ms); }
    var GOAL = 1200000, PER = 500, START_TO_GO = 30;

    /* ---------- The wall: running bond, bottom row first, with gaps for the window and door ---------- */
    var X0 = 70, X1 = 330, BW = 26, BH = 12, GROUND = 262, ROWS = 13, bricks = [];
    (function () {
      var seed = 5; function r() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
      var tones = ["#c8643b", "#bd5c35", "#d0704a", "#b85633", "#c96a40"], html = "";
      for (var row = 0; row < ROWS; row++) {
        var y = GROUND - (row + 1) * BH, off = row % 2 ? BW / 2 : 0, x = X0;
        var cuts = off ? [BW / 2] : []; // odd rows start with a half brick
        var xs = []; if (off) { xs.push([X0, BW / 2]); x = X0 + BW / 2; }
        while (x + BW <= X1 + 0.1) { xs.push([x, BW]); x += BW; }
        if (x < X1 - 0.1) xs.push([x, X1 - x]);
        xs.forEach(function (b) {
          var cx = b[0] + b[1] / 2, cy = y + BH / 2;
          var win = cx > 122 && cx < 176 && cy > 166 && cy < 216, door = cx > 226 && cx < 278 && cy > 190;
          if (win || door) return;
          bricks.push({ x: b[0], y: y, w: b[1], fill: tones[Math.floor(r() * tones.length)], rot: ((r() - 0.5) * 30).toFixed(1) });
        });
        cuts = null;
      }
      bricks.forEach(function (b, i) { html += '<rect class="brick" id="b' + i + '" x="' + b.x.toFixed(1) + '" y="' + b.y + '" width="' + b.w.toFixed(1) + '" height="' + BH + '" rx="1" style="--rot:' + b.rot + 'deg"/>'; });
      $("#wall").innerHTML = html;
      // three children for the finale
      var kids = [["#0f8b8d", "#f1c27a"], ["#c8643b", "#6b4a2e"], ["#6a5acd", "#2b1d14"]].map(function (c, k) {
        return '<g transform="translate(' + (236 + k * 12) + ' 0)"><g class="kid" style="--k:' + k + '"><g class="bob"><circle cx="0" cy="238" r="5" fill="' + c[1] + '"/><rect x="-5" y="243" width="10" height="13" rx="4" fill="' + c[0] + '"/><path d="M-3 256v6M3 256v6" stroke="#2b1d14" stroke-width="2.2" stroke-linecap="round"/><rect x="3" y="244" width="5" height="7" rx="1" fill="#f6eedf"/></g></g></g>';
      }).join("");
      $("#kids").innerHTML = kids;
    })();
    var S = { laid: bricks.length - START_TO_GO, donors: 1276, amount: 2500, busy: false, done: false };
    function toGo() { return bricks.length - S.laid; }
    function raised() { return GOAL - toGo() * PER; }

    // bricks from fromIdx up to S.laid fall in, `gap` seconds apart after `base` seconds; each lands with a dust puff
    function paintWall(fromIdx, mineName, gap, base) {
      gap = gap || 0.08; base = base || 0;
      bricks.forEach(function (b, i) {
        var el = $("#b" + i);
        if (i < S.laid) {
          if (fromIdx !== undefined && i >= fromIdx) {
            var d = base + (i - fromIdx) * gap;
            el.setAttribute("class", "brick drop" + (mineName ? " mine" : "")); el.style.setProperty("--d", reduce.matches ? "0s" : d.toFixed(3) + "s");
            el.style.fill = b.fill;
            (function (b, delay) { setTimeout(function () { puff(b); }, reduce.matches ? 0 : delay); })(b, d * 1000 + 760);
          } else if (!/drop/.test(el.getAttribute("class"))) { el.setAttribute("class", "brick"); el.style.fill = b.fill; }
        } else { el.setAttribute("class", "brick todo" + (i === S.laid ? " next" : "")); el.style.fill = ""; }
      });
    }
    function puff(b) {
      if (reduce.matches) return;
      var g = $("#puffs"), c1 = document.createElementNS(NS, "circle"), c2 = document.createElementNS(NS, "circle");
      [[c1, b.x + 3, 3.5], [c2, b.x + b.w - 3, 3]].forEach(function (p) { p[0].setAttribute("cx", p[1]); p[0].setAttribute("cy", b.y + BH); p[0].setAttribute("r", p[2]); p[0].setAttribute("class", "puff go"); g.appendChild(p[0]); });
      setTimeout(function () { c1.remove(); c2.remove(); }, 700);
    }

    /* ---------- Numbers that roll ---------- */
    var shownR = 0, rRaf = 0;
    function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
    function numbers(animate) {
      var target = raised(), from = shownR, t0 = performance.now(), dur = animate && !reduce.matches ? 1400 : 1;
      cancelAnimationFrame(rRaf);
      (function step(now) { var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); shownR = from + (target - from) * e; $("#raised").textContent = "PKR " + fmt(shownR); if (k < 1) rRaf = requestAnimationFrame(step); })(t0);
      $("#bar").style.setProperty("--p", (target / GOAL).toFixed(4));
      $("#toGo").textContent = toGo(); $("#donorsN").textContent = fmt(S.donors);
      var sg = $("#sign"); sg.classList.remove("pop"); void sg.offsetWidth; if (animate) sg.classList.add("pop");
      $("#sign span").innerHTML = toGo() ? '<b id="toGoSign">' + toGo() + "</b> brick" + (toGo() === 1 ? "" : "s") + " to go" : "<b>Done!</b> Every brick is in";
    }

    /* ---------- Choosing an amount ---------- */
    function bricksFor(v) { return Math.floor(v / PER); }
    function setAmount(v, fromChip) {
      S.amount = v; var n = Math.min(bricksFor(v), toGo());
      $$(".amt").forEach(function (b) { b.setAttribute("aria-pressed", String(fromChip && +b.dataset.v === v)); });
      $("#eq").textContent = !fromChip && v >= PER ? "= " + bricksFor(v) + " brick" + (bricksFor(v) === 1 ? "" : "s") : "";
      giveLabel();
    }
    function giveLabel() {
      if (S.done) { $("#giveT").innerHTML = "Build it again"; return; }
      var n = Math.min(bricksFor(S.amount), toGo());
      $("#giveT").innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.6 12 20 12 20z"/></svg>Give PKR ' + fmt(S.amount) + " · " + n + " brick" + (n === 1 ? "" : "s");
    }
    $$(".amt").forEach(function (b) { b.addEventListener("click", function () { $("#custom").value = ""; $("#err").textContent = ""; setAmount(+b.dataset.v, true); }); });
    $("#custom").addEventListener("input", function () {
      var v = Math.round(+$("#custom").value || 0); $("#err").textContent = "";
      if (v > 0) setAmount(v, false); else setAmount(2500, true);
    });

    /* ---------- Give: pay (simulated) → bricks fall and land → numbers roll → thanks ---------- */
    $("#give").addEventListener("click", function () {
      if (S.busy) return;
      if (S.done) { rebuild(); return; }
      var v = S.amount, n = Math.min(bricksFor(v), toGo());
      if (n < 1) { $("#err").textContent = "The smallest gift is PKR 500, one brick."; return; }
      var btn = $("#give"), name = $("#anon").checked ? "" : $("#who").value.trim();
      S.busy = true; btn.classList.add("busy", "work"); $("#giveT").textContent = "Processing PKR " + fmt(v) + "…"; say("Processing your gift");
      wait(function () {
        btn.classList.remove("work"); $("#giveT").textContent = "Laying " + n + " brick" + (n === 1 ? "" : "s") + "…";
        var from = S.laid; S.laid += n; S.donors++;
        paintWall(from, name || "you"); numbers(true); addDonor(name, n, true);
        var extra = bricksFor(v) > n ? " The extra goes to desks and books." : "";
        wait(function () {
          btn.classList.add("ok"); $("#giveT").innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.6 12 20 12 20z"/></svg>Thank you' + (name ? ", " + name.split(" ")[0] : "") + "! " + n + " brick" + (n === 1 ? "" : "s") + " laid";
          say("Thank you. " + n + " bricks laid. " + (toGo() ? toGo() + " to go." : "The classroom is complete.") + extra);
          if (!toGo()) finish();
          wait(function () { btn.classList.remove("ok", "busy"); S.busy = false; giveLabel(); }, 2400);
        }, n * 80 + 1300);
      }, 1200);
    });
    function finish() {
      S.done = true; $("#card").classList.add("done-card"); $("#site").classList.add("done");
      wait(function () { burst(); }, 1400);
    }
    function rebuild() {
      // the last 30 bricks lift off (newest first) and the campaign is back to its final push
      S.done = false; $("#site").classList.remove("done"); $("#card").classList.remove("done-card");
      var keep = bricks.length - START_TO_GO;
      for (var i = S.laid - 1, k = 0; i >= keep; i--, k++) { var el = $("#b" + i); el.setAttribute("class", "brick out"); el.style.setProperty("--d", (k * 0.02).toFixed(2) + "s"); }
      S.busy = true;
      wait(function () { S.laid = keep; S.donors = 1276; paintWall(); numbers(true); S.busy = false; giveLabel(); say("Reset: 30 bricks to go"); }, 900);
    }

    /* ---------- Recent donors: newest on top, the list scrolls by itself ---------- */
    var COLORS = ["#0f8b8d", "#c8643b", "#6a5acd", "#2f8a5b", "#b48a3c", "#d0453d"];
    var DONORS = [["Bilal K.", 20, "2 min ago"], ["Anonymous", 5, "6 min ago"], ["Fatima and Omer", 50, "12 min ago"], ["Hira S.", 2, "20 min ago"], ["Imran Q.", 10, "34 min ago"], ["Nadia R.", 4, "1 h ago"]];
    function li(d, you) {
      var init = d[0] === "Anonymous" ? "?" : d[0].split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2);
      return '<li' + (you ? ' class="you"' : "") + '><span class="av" style="background:' + COLORS[d[0].length % COLORS.length] + '">' + init + "</span><b>" + d[0] + "</b> · " + d[1] + " brick" + (d[1] === 1 ? "" : "s") + "<span>" + d[2] + "</span></li>";
    }
    function renderDonors() { $("#donors").innerHTML = DONORS.map(function (d, i) { return li(d, i === 0 && d.you); }).join(""); }
    function addDonor(name, n) { var d = [name || "Anonymous", n, "just now"]; d.you = true; DONORS.unshift(d); if (DONORS.length > 8) DONORS.pop(); tick = 0; $("#donors").style.transform = "none"; renderDonors(); }
    var tick = 0;
    setInterval(function () {
      if (document.hidden || reduce.matches) return;
      var ul = $("#donors"), rows = ul.children.length, view = Math.round($(".donors").clientHeight / 37) || 1;
      tick = (tick + 1) % Math.max(1, rows - view + 1); ul.style.transform = "translateY(" + -tick * 37 + "px)";
    }, 3200);

    /* confetti: little bricks and turquoise paper */
    var cv = $("#fx"), ctx = cv.getContext("2d"), bits = [], fxRaf = 0;
    function sizeFx() { var d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    function burst() {
      if (reduce.matches) return;
      var r = $("#site").getBoundingClientRect(), cols = ["#0f8b8d", "#15a6a3", "#c8643b", "#f1b25a", "#ffffff"];
      for (var i = 0; i < 110; i++) bits.push({ x: r.left + Math.random() * r.width, y: r.top - 10 - Math.random() * 60, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 3, s: 5 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.25, c: cols[i % 5], life: 0 });
      if (!fxRaf) fxRaf = requestAnimationFrame(fxStep);
    }
    function fxStep() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      bits = bits.filter(function (b) { return b.life < 170; });
      bits.forEach(function (b) { b.life++; b.vy += 0.05; b.vx += Math.sin(b.life * 0.08 + b.r) * 0.04; b.x += b.vx; b.y += b.vy; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.min(1, (170 - b.life) / 30); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2 * Math.abs(Math.cos(b.life * 0.12))); ctx.restore(); });
      fxRaf = bits.length ? requestAnimationFrame(fxStep) : 0;
    }

    /* ---------- Auto-demo: plays on load and every few seconds; any real input stops it ---------- */
    var ghost = $("#ghost"), demoOn = !reduce.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function aim(x, y) { ghost.style.setProperty("--gx", Math.min(innerWidth - 30, x) + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function ghostTo(el, then) {
      var r = el.getBoundingClientRect(); ghost.classList.add("show"); aim(r.left + Math.min(r.width * 0.55, 90), r.top + r.height * 0.6);
      later(function () { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (demoOn && then) then(); }, 170); }, 820);
    }
    function typeInto(el, text, ms) { el.value = ""; text.split("").forEach(function (ch, i) { later(function () { el.value += ch; el.dispatchEvent(new Event("input")); }, i * ms); }); }
    function stopDemo() { if (!demoOn) return; demoOn = false; timers.forEach(clearTimeout); ghost.classList.remove("show", "tap"); }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }); });
    function demo() {
      if (!demoOn) return;
      later(function () { ghostTo($('.amt[data-v="5000"]'), function () { $('.amt[data-v="5000"]').click(); }); }, 200);
      later(function () { ghostTo($("#who"), function () { typeInto($("#who"), "Areeba", 70); }); }, 1700);
      later(function () { ghostTo($("#give"), function () { $("#give").click(); }); }, 3200);
      later(function () { ghostTo($("#custom"), function () { $("#who").value = ""; typeInto($("#custom"), "10000", 90); }); }, 9000);
      later(function () { ghostTo($("#give"), function () { $("#give").click(); }); }, 10900);
      later(function () { ghost.classList.remove("show"); }, 12100);
      later(function () { ghostTo($("#give"), function () { $("#custom").value = ""; setAmount(2500, true); $("#give").click(); }); }, 21500);
      later(function () { ghost.classList.remove("show"); }, 22700);
      later(demo, 25000);
    }

    /* ---------- Start: the wall builds up to today's height, then waits for the last 30 bricks ---------- */
    // wide, short frames (phones) show the whole scene; tall frames crop the sides instead of the roof
    function fitScene() { $("#siteSvg").setAttribute("preserveAspectRatio", "xMidYMax meet"); } // the sky and sand reach past the edges, so the whole site always shows
    renderDonors(); setAmount(2500, true); sizeFx(); fitScene(); addEventListener("resize", function () { sizeFx(); fitScene(); });
    if (reduce.matches) { paintWall(); numbers(false); }
    else {
      // intro: the top courses already laid drop in quickly so the first second shows the wall growing
      var introFrom = Math.max(0, S.laid - 24);
      bricks.forEach(function (b, i) { var el = $("#b" + i); if (i < introFrom) { el.setAttribute("class", "brick"); el.style.fill = b.fill; } });
      paintWall(introFrom, "", 0.035, 0.2);
      numbers(true);
    }
    if (demoOn) later(demo, 2600);
  })();
</script>
