/* ---------- The till (cash drawer): notes by value, plus loose coins ---------- */
const DENOMS = [5000, 1000, 500, 100, 50, 20, 10];
const NOTE_C = { 5000: "var(--n5000)", 1000: "var(--n1000)", 500: "var(--n500)", 100: "var(--n100)", 50: "var(--n50)", 20: "var(--n20)", 10: "var(--n10)" };
const emptyNotes = () => ({ 5000: 0, 1000: 0, 500: 0, 100: 0, 50: 0, 20: 0, 10: 0, c: 0 });
const notesValue = (g) => sum(DENOMS.map((d) => d * (g[d] || 0))) + (g.c || 0);
/* What a customer hands over for a bill: exact notes, or the next big note */
function handOver(total, r = Math.random) {
 const out = emptyNotes();
 const big = DENOMS.slice().reverse().find((d) => d >= total);
 /* people pay with one bigger note only when it is not far above the bill */
 if (total >= 80 && big && big <= total * 2.6 && r() < 0.55) { out[big] = 1; return out; }
 let left = Math.ceil(total / 10) * 10;
 if (r() < 0.5 && total > 150) left = Math.ceil(total / 100) * 100;
 for (const d of DENOMS) { const n = Math.floor(left / d); if (n) { out[d] = n; left -= n * d; } }
 const coins = Math.ceil(total / 10) * 10 - total;
 if (coins && left === 0 && out[10]) { out[10]--; out.c = 10 - coins; }
 return out;
}
/* Take an amount out of the till as change: biggest notes that fit, coins for the rest */
function takeOut(g, amt) {
 const out = emptyNotes();
 let left = Math.round(amt);
 for (const d of DENOMS) { const n = Math.min(g[d] || 0, Math.floor(left / d)); if (n) { out[d] = n; g[d] -= n; left -= n * d; } }
 if (left > 0) { out.c = left; g.c = (g.c || 0) - left; }
 return out;
}
function putIn(g, notes) { DENOMS.forEach((d) => (g[d] = (g[d] || 0) + (notes[d] || 0))); g.c = (g.c || 0) + (notes.c || 0); }
/* Ring a cash payment through the till: notes in, change out */
function ringCash(g, total, r) {
 const inn = handOver(total, r);
 putIn(g, inn);
 const change = notesValue(inn) - total;
 const out = change > 0 ? takeOut(g, change) : emptyNotes();
 return { inn, out, change };
}

  el.innerHTML = `<div class="donut${vert ? " v" : ""}"><svg viewBox="0 0 132 132" role="img" aria-label="${esc(sub)}"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--well)" stroke-width="16"/>${arcs}<text x="66" y="66" text-anchor="middle">${esc(centre)}</text><text class="s" x="66" y="82" text-anchor="middle">${esc(sub)}</text></svg>

  if (!again && !RM) requestAnimationFrame(() => requestAnimationFrame(() => $$(".sl", el).forEach((c) => c.setAttribute("stroke-dasharray", c.dataset.len + " " + C))));
  const svg = $("svg", el);
  const hi = (i) => $$(".sl", el).forEach((c) => c.classList.toggle("dim", i != null && +c.dataset.i !== i));

 });
}

/* ---------- Till drawing ---------- */
/* Notes in a compartment sit in a small pile; each new note lands on top */
const VIS = 14;
function noteEl(d, i, isNew) {
 const r = seeded(d * 31 + i * 7);
 /* small notes sit in shallow trays, so their piles rise less */
 const x = ((r() - 0.5) * 7).toFixed(1), rot = ((r() - 0.5) * 7).toFixed(1), y = (-i * (d <= 20 ? 0.7 : 1.7)).toFixed(1);
 return `<i class="note${isNew ? " in" : ""}" data-v="${num(d)}" style="--nc:${NOTE_C[d]};--x:${x}px;--y:${y}px;--r:${rot}deg;z-index:${i + 1}"><span class="wm"></span></i>`;
}
function coinEls(amt) {
 const n = clamp(Math.ceil(amt / 120), amt > 0 ? 1 : 0, 9), r = seeded(5);
 return Array.from({ length: n }, (_, i) => `<i class="coin" style="--x:${(6 + r() * 22).toFixed(0)}px;--y:${(6 + r() * 22).toFixed(0)}px"></i>`).join("");
}
function tillHTML(g, mini = false) {
 const comp = (d) => `<div class="comp" data-d="${d}"><div class="pile">${Array.from({ length: Math.min(g[d] || 0, mini ? 6 : VIS) }, (_, i) => noteEl(d, i, false)).join("")}</div><div class="lbl"><span>Rs</span><b>${num(d)}</b><span data-n="${d}">×${num(g[d] || 0)}</span></div></div>`;
 if (mini) return `<div class="till mini" data-till="mini" aria-label="Till: ${RS(notesValue(g))}"><div class="tray">${DENOMS.map(comp).join("")}</div></div>`;
 return `<div class="till" data-till="big" role="img" aria-label="Cash drawer holding ${RS(notesValue(g))}">
  <div class="tray">${DENOMS.slice(0, 5).map(comp).join("")}</div>
  <div class="tray2">${comp(20)}${comp(10)}<div class="comp" data-d="c"><div class="coins">${coinEls(g.c)}</div><div class="lbl"><span>Coins</span><b data-n="c">${RS(Math.max(0, g.c))}</b></div></div></div></div>`;
}
/* Animate money moving through every till on screen */
function tillMove(mv) {
 if (!mv) return;
 $$("[data-till]").forEach((el) => {
  const mini = el.dataset.till === "mini", cap = mini ? 6 : VIS;
  DENOMS.forEach((d) => {
   const comp = $(`.comp[data-d="${d}"]`, el);
   if (!comp) return;
   const pile = $(".pile", comp), have = $$(".note", pile).filter((n) => !n.classList.contains("out"));
   const nIn = mv.inn[d] || 0, nOut = mv.out[d] || 0;
   /* change leaves from the top of the pile */
   for (let k = 0; k < nOut && have.length; k++) { const n = have.pop(); n.classList.add("out"); setTimeout(() => n.remove(), 560); }
   for (let k = 0; k < nIn; k++) {
    const count = $$(".note:not(.out)", pile).length;
    if (count >= cap) continue;
    pile.insertAdjacentHTML("beforeend", noteEl(d, count, true));
    const last = pile.lastElementChild;
    last.style.animationDelay = k * 120 + "ms";
   }
   const lbl = $(`[data-n="${d}"]`, comp);
   if (lbl) lbl.textContent = "×" + num(S.till[d] || 0);
  });
  const cl = $('[data-n="c"]', el);
  if (cl) cl.textContent = RS(Math.max(0, S.till.c));
  if (!mini && (mv.inn.c || mv.out.c)) { const cc = $(".coins", el); if (cc) cc.innerHTML = coinEls(S.till.c); }
  el.classList.remove("kick"); void el.offsetWidth; el.classList.add("kick");
 });
}

}

function kAnimate(c, old) {

  const ov = $(".over", tr); if (nb > c.limit && !ov) tr.insertAdjacentHTML("beforeend", '<i class="over"></i>'); if (nb <= c.limit && ov) ov.remove();

  if (e.key === "Escape" && e.target.value) { e.target.value = ""; drawSug(); e.stopPropagation(); }
 }
});
document.addEventListener("submit", (e) => {
 const f = e.target, sf = f.dataset && f.dataset.sf;
 if (!sf) return;
 e.preventDefault();
 const val = (n) => (f.elements[n] ? f.elements[n].value.trim() : "");
 const err = (n, m) => { const el = $("#s-" + n + "-e", f); if (el) el.textContent = m; const inp = f.elements[n]; if (inp) m ? inp.setAttribute("aria-invalid", "true") : inp.removeAttribute("aria-invalid"); return !!m; };
 const fail = () => { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); };
 if (sf === "shop") {
  const o = +val("open"), c = +val("close");
  const bad = [err("name", val("name").length < 3 ? "Add the shop name" : ""), err("area", !val("area") ? "Add the area" : ""), err("city", !val("city") ? "Add the city" : ""), err("phone", !PHONE_RE.test(val("phone")) ? "Like 0300-555 0000" : ""), err("wallet", !PHONE_RE.test(val("wallet")) ? "Like 0300-555 0000" : ""), err("open", !(o >= 0 && o <= 23) ? "0 to 23" : ""), err("close", !(c > o && c <= 24) ? "After opening, up to 24" : "")].some(Boolean);
  if (bad) return fail();
  Object.assign(S.shop, { name: val("name"), area: val("area"), city: val("city"), phone: val("phone"), wallet: val("wallet"), open: o, close: c }); save(); drawSide(); toast("Shop saved");
 }
 if (sf === "receipt") { const bad = [err("header", val("header").length < 3 ? "The receipt needs a header" : ""), err("footer", val("footer").length > 200 ? "Keep it under 200 letters" : "")].some(Boolean); if (bad) return fail(); S.shop.header = val("header"); S.shop.footer = val("footer"); save(); toast("Receipt saved"); }
 if (sf === "credit") { const bad = ["polite", "friendly", "firm"].map((k) => err("tpl-" + k, val("tpl-" + k).length < 20 ? "Write a little more" : !val("tpl-" + k).includes("{amount}") ? "Include {amount} so they know what they owe" : "")).some(Boolean); if (bad) return fail(); ["polite", "friendly", "firm"].forEach((k) => (S.tpl[k] = val("tpl-" + k))); S.tone = f.elements.tone.value; save(); toast("Messages saved"); }
 if (sf === "till") { const ks = [["f100", 100], ["f50", 50], ["f20", 20], ["f10", 10], ["fc", "c"]]; const bad = ks.map(([n]) => err(n, !(val(n) !== "" && +val(n) >= 0 && +val(n) <= 5000 && Number.isInteger(+val(n))) ? "A whole number, 0 or more" : "")).some(Boolean); if (bad) return fail(); ks.forEach(([n, d]) => (S.floatNotes[d] = +val(n))); save(); toast("Float saved: " + RS(notesValue(S.floatNotes))); const pn = $("#spanel"); pn.innerHTML = setPanel(); }
});
document.addEventListener("reset", (e) => { if (e.target.dataset && e.target.dataset.sf) setTimeout(() => toast("Changes undone"), 0); });
function applyUi() { document.documentElement.classList.toggle("compact", S.ui.density === "compact"); }
function tickClock() { const c = $("#clock"); if (c) c.textContent = "Live · " + hm(nowMs()); }

/* ---------- Boot ---------- */
ROUTES = { today: pgToday, counter: pgCounter, credit: pgCredit, stock: pgStock, cashup: pgCashup, expenses: pgExpenses, reports: pgReports, staff: pgStaff, settings: pgSettings };
(function () { const q = new URLSearchParams(location.search).get("theme"); const saved = store.get(KEY + ":theme", "system"); if (!q && saved !== "system") document.documentElement.dataset.theme = saved; })();
applyUi();
drawSide();
drawBell();
initShell(cmds);
addEventListener("hashchange", route);
route();
tickClock();
every(30000, tickClock);
every(6500, liveSale);
