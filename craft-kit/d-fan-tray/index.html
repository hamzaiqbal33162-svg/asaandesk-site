<!doctype html>
<!-- Chill & Craft · Fan Tray · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fan Tray · chat box with a swinging tool fan</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #efe9dc;
    --win: #fffdf8;
    --edge: #e6dfcf;
    --ink: #1f2328;
    --muted: #6d6a62;
    --in: #f2ede2;
    --out: #1f2328;
    --out-ink: #ffffff;
    --accent: #ffb703;
    --accent-ink: #1f2328;
    --field: #f5f1e8;
    --fan: rgba(255, 253, 248, 0.94);
    --shadow: rgba(50, 40, 20, 0.28);
    --focus: #1f2328;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e0e10;
    --win: #19191c;
    --edge: #2a2a2f;
    --ink: #f3f1ec;
    --muted: #a19d94;
    --in: #26262b;
    --out: #ffb703;
    --out-ink: #1b1400;
    --accent: #ffb703;
    --accent-ink: #1b1400;
    --field: #232328;
    --fan: rgba(36, 36, 41, 0.95);
    --shadow: rgba(0, 0, 0, 0.7);
    --focus: #ffb703;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 40%), radial-gradient(circle at 85% 80%, color-mix(in srgb, #a066ff 14%, transparent), transparent 40%);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .chat {
    position: relative;
    width: min(390px, 100%);
    height: min(580px, calc(100vh - 32px));
    min-height: 480px;
    background: var(--win);
    border: 1px solid var(--edge);
    border-radius: 28px;
    box-shadow: 0 34px 60px -36px var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--edge); }
  .avatar { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #1f2328; background: linear-gradient(140deg, #ffd166, #ff9f1c); }
  .avatar::after { content: ""; position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: #2bb673; box-shadow: 0 0 0 2px var(--win); }
  .head b { display: block; font-size: 15px; }
  .head small { color: var(--muted); font-size: 12px; }

  /* ---------- Messages ---------- */
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 8px; transition: filter 0.35s, opacity 0.35s; }
  .msg { max-width: 80%; padding: 10px 13px; border-radius: 18px; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  .msg.in { align-self: flex-start; background: var(--in); border-bottom-left-radius: 6px; transform-origin: 0 100%; }
  .msg.out { align-self: flex-end; background: var(--out); color: var(--out-ink); border-bottom-right-radius: 6px; transform-origin: 100% 100%; }
  .msg.pop { animation: bubble 0.55s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes bubble { from { opacity: 0; transform: translateY(18px) scale(0.6); } }
  .msg .att { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 8px; border-radius: 12px; background: rgba(127, 127, 127, 0.16); font-size: 12.5px; }
  .msg .att img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
  .msg .att i { width: 22px; height: 22px; border-radius: 7px; flex: none; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
  .chat.fan-open .log { filter: blur(2px); opacity: 0.45; }

  /* ---------- Composer ---------- */
  .composer { position: relative; z-index: 3; padding: 8px 10px 12px; border-top: 1px solid var(--edge); background: var(--win); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px 8px; }
  .chips:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
    padding: 4px 4px 4px 6px; border-radius: 12px; background: var(--field); border: 1px solid var(--edge);
    font-size: 12.5px; font-weight: 600;
  }
  .chip i { width: 22px; height: 22px; border-radius: 7px; flex: none; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
  .chip img { width: 26px; height: 26px; border-radius: 7px; object-fit: cover; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .chip button { width: 24px; height: 24px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .chip button:hover { background: var(--edge); color: var(--ink); }
  .chip .wave { display: inline-flex; gap: 2px; align-items: center; height: 16px; }
  .chip .wave b { width: 3px; border-radius: 2px; background: #ff4d8d; animation: eq 0.6s ease-in-out infinite alternate; }
  .chip .wave b:nth-child(2) { animation-delay: 0.1s; } .chip .wave b:nth-child(3) { animation-delay: 0.2s; } .chip .wave b:nth-child(4) { animation-delay: 0.3s; }
  @keyframes eq { from { height: 4px; } to { height: 15px; } }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.shake { animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .plus, .send {
    flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; touch-action: none;
    transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.3s, color 0.3s;
  }
  .plus { background: var(--field); color: var(--ink); }
  .plus svg, .send svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .plus[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
  .plus[aria-expanded="true"] svg { transform: rotate(135deg); }
  .plus:active, .send:active { transform: scale(0.86); transition-duration: 0.08s; }
  .send { background: var(--accent); color: var(--accent-ink); }
  .send:hover svg { transform: rotate(-12deg) translate(1px, -1px); }
  .send.fly svg { animation: fly 0.6s cubic-bezier(0.5, 0, 0.3, 1); }
  @keyframes fly { 45% { transform: translate(26px, -26px) rotate(-20deg); opacity: 0; } 46% { transform: translate(-20px, 20px); opacity: 0; } }
  .field {
    flex: 1; min-width: 0; resize: none; border: 1px solid var(--edge); background: var(--field); color: var(--ink);
    border-radius: 21px; padding: 10px 14px; font: inherit; font-size: 14px; line-height: 1.4; max-height: 100px; height: 42px;
  }
  .hint { min-height: 0; margin: 6px 4px 0; font-size: 12px; color: #e5484d; }
  .hint:empty { display: none; }

  /* ---------- The fan of tools ---------- */
  .scrim { position: absolute; inset: 0; z-index: 2; background: transparent; display: none; }
  .chat.fan-open .scrim { display: block; }
  .tray { position: absolute; z-index: 4; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .fan-bg {
    position: absolute;
    left: -170px;
    top: -170px;
    width: 340px;
    height: 340px;
    overflow: visible;
    transform: rotate(-80deg) scale(0.5);
    transform-origin: 50% 50%;
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.3, 1.25, 0.45, 1), opacity 0.25s;
    filter: drop-shadow(0 14px 18px var(--shadow));
  }
  .fan-bg path { fill: var(--fan); stroke: var(--edge); }
  .tool {
    --r: 132px;
    position: absolute;
    left: -21px;
    top: -21px;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: var(--c);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 0;
    /* closed: tucked in at the hinge, rotated back */
    transform: rotate(calc(var(--a) - 80deg)) translate(30px) rotate(calc(80deg - var(--a))) scale(0.3);
    transition: transform 0.32s cubic-bezier(0.5, 0, 0.8, 0.4), opacity 0.2s;
    transition-delay: calc((4 - var(--i)) * 25ms);
    box-shadow: 0 8px 16px -8px var(--c);
  }
  .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .tool .tip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--win);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s, transform 0.2s;
    pointer-events: none;
  }
  .chat.fan-open .fan-bg { transform: none; opacity: 1; }
  .chat.fan-open .tool {
    pointer-events: auto;
    opacity: 1;
    transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))) scale(1);
    transition: transform 0.6s cubic-bezier(0.3, 1.55, 0.45, 1), opacity 0.2s, box-shadow 0.2s;
    transition-delay: calc(var(--i) * 45ms);
  }
  .chat.fan-open .tool:hover, .chat.fan-open .tool:focus-visible, .chat.fan-open .tool.hot {
    transform: rotate(var(--a)) translate(calc(var(--r) + 6px)) rotate(calc(-1 * var(--a))) scale(1.18);
    transition-delay: 0s;
    transition-duration: 0.25s;
  }
  .tool:hover .tip, .tool:focus-visible .tip, .tool.hot .tip { opacity: 1; transform: translateX(-50%); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="chat" id="chat" aria-label="Chat with Noor from Inkwell Books">
    <header class="head">
      <span class="avatar" aria-hidden="true">N</span>
      <div><b>Noor · Inkwell Books</b><small>Usually replies in a minute</small></div>
    </header>

    <div class="log" id="log" aria-live="polite">
      <div class="msg in">Hi! I can help you find a book, check stock or hold a copy for you.</div>
      <div class="msg in">Tap the + to send a photo of a cover, a list, your location or a quick poll.</div>
    </div>

    <div class="scrim" id="scrim"></div>

    <div class="composer">
      <div class="chips" id="chips" aria-label="Attachments"></div>
      <div class="row" id="row">
        <button class="plus" id="plus" type="button" aria-expanded="false" aria-controls="tray" aria-label="Attach">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <label class="sr-only" for="field">Message</label>
        <textarea class="field" id="field" rows="1" placeholder="Write a message…"></textarea>
        <button class="send" id="send" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"/><path d="m11 13 9-9"/></svg>
        </button>
      </div>
      <p class="hint" id="hint" role="alert"></p>
    </div>

    <div class="tray" id="tray" role="group" aria-label="Attach tools">
      <svg class="fan-bg" viewBox="0 0 340 340" aria-hidden="true"><path d="M142.6 14.4A158 158 0 0 1 327.6 181L277.7 177.5A108 108 0 0 0 151.3 63.6Z"/></svg>
      <button class="tool" type="button" data-tool="photo" style="--a:-88deg; --i:0; --c:#ff7a59" aria-label="Photo" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg><span class="tip">Photo</span>
      </button>
      <button class="tool" type="button" data-tool="file" style="--a:-68deg; --i:1; --c:#5b8def" aria-label="Document" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span class="tip">Document</span>
      </button>
      <button class="tool" type="button" data-tool="place" style="--a:-48deg; --i:2; --c:#2bb673" aria-label="Location" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="tip">Location</span>
      </button>
      <button class="tool" type="button" data-tool="poll" style="--a:-28deg; --i:3; --c:#a066ff" aria-label="Poll" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="tip">Poll</span>
      </button>
      <button class="tool" type="button" data-tool="voice" style="--a:-8deg; --i:4; --c:#ff4d8d" aria-label="Voice note" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span class="tip">Voice</span>
      </button>
    </div>
    <input type="file" id="pick-photo" accept="image/*" hidden />
    <input type="file" id="pick-file" hidden />
  </section>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    var chat = document.getElementById("chat");
    var log = document.getElementById("log");
    var plus = document.getElementById("plus");
    var tray = document.getElementById("tray");
    var tools = Array.prototype.slice.call(tray.querySelectorAll(".tool"));
    var chips = document.getElementById("chips");
    var field = document.getElementById("field");
    var send = document.getElementById("send");
    var row = document.getElementById("row");
    var hint = document.getElementById("hint");
    var status = document.getElementById("status");
    var pickPhoto = document.getElementById("pick-photo");
    var pickFile = document.getElementById("pick-file");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var COLORS = { photo: "#ff7a59", file: "#5b8def", place: "#2bb673", poll: "#a066ff", voice: "#ff4d8d" };
    var attachments = []; // { kind, label, url, el }
    var lastTool = null;

    // ---------- Opening and closing the fan ----------
    function placeTray() {
      var c = chat.getBoundingClientRect();
      var p = plus.getBoundingClientRect();
      tray.style.left = p.left - c.left + p.width / 2 + "px";
      tray.style.top = p.top - c.top + p.height / 2 + "px";
    }
    function isOpen() { return chat.classList.contains("fan-open"); }
    function openFan(fromKeyboard) {
      placeTray();
      chat.classList.add("fan-open");
      plus.setAttribute("aria-expanded", "true");
      plus.setAttribute("aria-label", "Close attach tools");
      tools.forEach(function (t) { t.tabIndex = 0; });
      if (fromKeyboard) setTimeout(function () { tools[0].focus(); }, 60);
    }
    function closeFan(returnFocus) {
      chat.classList.remove("fan-open");
      plus.setAttribute("aria-expanded", "false");
      plus.setAttribute("aria-label", "Attach");
      tools.forEach(function (t) { t.tabIndex = -1; t.classList.remove("hot"); });
      if (returnFocus) plus.focus();
    }

    // Press and hold the + then slide onto a tool and let go to pick it.
    var gesture = false, swallowClick = false, hot = null;
    plus.addEventListener("pointerdown", function (e) {
      if (isOpen()) return;
      openFan(false);
      gesture = true;
      swallowClick = true;
      if (plus.setPointerCapture) plus.setPointerCapture(e.pointerId);
    });
    plus.addEventListener("pointermove", function (e) {
      if (!gesture) return;
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var t = el && el.closest ? el.closest(".tool") : null;
      if (t !== hot) {
        if (hot) hot.classList.remove("hot");
        hot = t;
        if (hot) hot.classList.add("hot");
      }
    });
    plus.addEventListener("pointerup", function () {
      if (!gesture) return;
      gesture = false;
      if (hot) {
        var t = hot;
        hot.classList.remove("hot");
        hot = null;
        swallowClick = false;
        useTool(t);
      }
    });
    plus.addEventListener("click", function (e) {
      if (swallowClick) { swallowClick = false; return; }
      if (isOpen()) closeFan(false);
      else openFan(e.detail === 0);
    });
    document.getElementById("scrim").addEventListener("click", function () { closeFan(false); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && isOpen()) closeFan(true);
    });
    tools.forEach(function (t, i) {
      t.addEventListener("click", function () { useTool(t); });
      t.addEventListener("keydown", function (e) {
        var n = null;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") n = (i + 1) % tools.length;
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = (i - 1 + tools.length) % tools.length;
        if (n === null) return;
        e.preventDefault();
        tools[n].focus();
      });
    });

    // ---------- Tools ----------
    function useTool(t) {
      var kind = t.dataset.tool;
      lastTool = t;
      closeFan(false);
      if (kind === "photo") { pickPhoto.value = ""; pickPhoto.click(); return; }
      if (kind === "file") { pickFile.value = ""; pickFile.click(); return; }
      if (kind === "place") addChip("place", "Shop pin · Anarkali, Lahore");
      if (kind === "poll") addChip("poll", "Poll: Fiction or poetry?");
      if (kind === "voice") recordVoice();
      field.focus();
    }
    function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
    pickPhoto.addEventListener("change", function () {
      var f = pickPhoto.files && pickPhoto.files[0];
      if (f) addChip("photo", f.name + " · " + size(f.size), URL.createObjectURL(f));
    });
    pickFile.addEventListener("change", function () {
      var f = pickFile.files && pickFile.files[0];
      if (f) addChip("file", f.name + " · " + size(f.size));
    });
    var GLYPH = { photo: "▣", file: "≡", place: "⌖", poll: "▥", voice: "●" };

    function addChip(kind, label, url) {
      var item = { kind: kind, label: label, url: url };
      var el = document.createElement("span");
      el.className = "chip";
      el.innerHTML = (url ? '<img alt="" src="' + url + '">' : '<i style="background:' + COLORS[kind] + '">' + GLYPH[kind] + "</i>") +
        '<span></span><button type="button" aria-label="Remove ' + kind + '">×</button>';
      el.querySelector("span").textContent = label;
      el.querySelector("button").addEventListener("click", function () { removeChip(item); });
      chips.appendChild(el);
      item.el = el;
      attachments.push(item);
      status.textContent = "Attached: " + label;
      flyIn(el);
      return item;
    }
    // The chip flies from the tool that made it into the composer.
    function flyIn(el) {
      if (reduce.matches || !el.animate) return;
      var from = lastTool ? lastTool.getBoundingClientRect() : plus.getBoundingClientRect();
      var to = el.getBoundingClientRect();
      var dx = from.left + from.width / 2 - (to.left + to.width / 2);
      var dy = from.top + from.height / 2 - (to.top + to.height / 2);
      el.animate([
        { transform: "translate(" + dx + "px," + dy + "px) scale(0.3)", opacity: 0.2 },
        { transform: "translate(" + dx * 0.35 + "px," + (dy * 0.35 - 30) + "px) scale(0.9)", opacity: 1, offset: 0.55 },
        { transform: "none", opacity: 1 }
      ], { duration: 620, easing: "cubic-bezier(.3,1.2,.5,1)" });
    }
    function removeChip(item) {
      attachments = attachments.filter(function (a) { return a !== item; });
      var el = item.el;
      if (item.url) URL.revokeObjectURL(item.url);
      if (reduce.matches || !el.animate) { el.remove(); return; }
      el.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0.4)", opacity: 0 }], { duration: 220, easing: "ease-in" }).onfinish = function () { el.remove(); };
      field.focus();
    }
    function recordVoice() {
      var item = addChip("voice", "Recording 0:00");
      var label = item.el.querySelector("span");
      label.insertAdjacentHTML("beforebegin", '<span class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b></span>');
      var secs = 0;
      var timer = setInterval(function () {
        secs++;
        if (attachments.indexOf(item) < 0) { clearInterval(timer); return; }
        if (secs < 3) { label.textContent = "Recording 0:0" + secs; return; }
        clearInterval(timer);
        label.textContent = "Voice note 0:03";
        item.label = "Voice note 0:03";
        var w = item.el.querySelector(".wave");
        if (w) w.remove();
        status.textContent = "Voice note recorded";
      }, 1000);
    }

    // ---------- Sending ----------
    function autosize() {
      field.style.height = "42px";
      field.style.height = Math.min(100, field.scrollHeight + 2) + "px";
    }
    field.addEventListener("input", function () { autosize(); hint.textContent = ""; });
    field.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
    });
    send.addEventListener("click", doSend);

    function bubble(cls, html) {
      var m = document.createElement("div");
      m.className = "msg " + cls + " pop";
      m.innerHTML = html;
      log.appendChild(m);
      log.scrollTop = log.scrollHeight;
      return m;
    }
    function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    function doSend() {
      var text = field.value.trim();
      var ready = attachments.filter(function (a) { return a.label.indexOf("Recording") !== 0; });
      if (!text && !ready.length) {
        row.classList.remove("shake");
        void row.offsetWidth;
        row.classList.add("shake");
        hint.textContent = "Type a message or attach something first.";
        return;
      }
      var html = text ? esc(text).replace(/\n/g, "<br>") : "";
      ready.forEach(function (a) {
        html += '<div class="att">' + (a.url ? '<img alt="" src="' + a.url + '">' : '<i style="background:' + COLORS[a.kind] + '">' + GLYPH[a.kind] + "</i>") + "<span>" + esc(a.label) + "</span></div>";
      });
      bubble("out", html);
      send.classList.remove("fly");
      void send.offsetWidth;
      send.classList.add("fly");
      var kinds = ready.map(function (a) { return a.kind; });
      ready.forEach(function (a) { a.el.remove(); });
      attachments = attachments.filter(function (a) { return ready.indexOf(a) < 0; });
      field.value = "";
      autosize();
      hint.textContent = "";
      replyTo(kinds);
    }

    var replyTimers = [];
    function replyTo(kinds) {
      replyTimers.forEach(clearTimeout);
      var typing;
      replyTimers = [
        setTimeout(function () { typing = bubble("in", '<span class="typing" aria-label="Noor is typing"><span></span><span></span><span></span></span>'); }, 450),
        setTimeout(function () {
          if (typing) typing.remove();
          var say = "Got it! Give me a moment to check the shelves.";
          if (kinds.indexOf("photo") >= 0) say = "Lovely cover! We have 2 copies of that one. Shall I hold one for you?";
          else if (kinds.indexOf("place") >= 0) say = "Thanks, that is 10 minutes from our shop. Delivery today is PKR 150.";
          else if (kinds.indexOf("poll") >= 0) say = "Poetry wins at our counter today. Fiction is a close second!";
          else if (kinds.indexOf("voice") >= 0) say = "Thanks for the voice note. I will call you back in 5 minutes.";
          else if (kinds.indexOf("file") >= 0) say = "Your list came through. 6 of the 8 books are in stock.";
          bubble("in", esc(say));
        }, 1700)
      ];
    }

    window.addEventListener("resize", function () { if (isOpen()) placeTray(); });
  })();
</script>
</body>
</html>
