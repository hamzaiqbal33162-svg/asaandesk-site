<!doctype html>
<!-- Chill & Craft · Dunecrest · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunecrest · Loan management</title>
<meta name="description" content="A loan management app for a private lender, in warm sand glass over a drawn desert house, with schedules, a pipeline, collections and an hourglass calculator.">
<style>
/* ===================== Shared core styles (each design sets the tokens) ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:var(--icw,1.8);stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
html.theming *,html.theming *::before{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s,box-shadow .45s!important}
#view{outline:none}
.sp{flex:1}
.mut{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel-solid,var(--panel));padding:.55em 1em;border-radius:var(--r2,10px);font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .15s var(--ease),background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.btn:active,.ib:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:0 6px 18px -8px var(--acc)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:.4em .7em;font-size:.8rem}
.btn.full{width:100%}
.lnk{background:none;border:0;padding:0;color:var(--acc);font-weight:600;font-size:.82rem}
.ib{position:relative;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:var(--r2,10px);border:1px solid var(--line);background:var(--panel-solid,var(--panel));color:var(--text);transition:transform .15s,background .2s;flex:none}
.ib:hover{background:var(--hover)}
.ib[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;animation:pop .4s var(--spring)}
/* cards and grids */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r,16px);padding:var(--pad,18px);box-shadow:var(--sh,none);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;min-width:0}
.card.lift:hover,.lift-all .card:hover{transform:translateY(-3px);box-shadow:var(--sh-h,var(--sh))}
.enter .card{animation:cardIn .62s var(--ease) both;animation-delay:calc(var(--i,0) * 48ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes fade{from{opacity:0}}
.ch-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch-h h2,.ch-h h3{font-size:1rem;font-weight:700}
.ch-h p{color:var(--muted);font-size:.8rem}
.g{display:grid;gap:var(--gap,16px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.sall{grid-column:1/-1}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}.g3 .s3,.g4 .s3{grid-column:1/-1}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.s2,.s3{grid-column:auto}}
/* KPI */
.kpi .k-l{font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .k-s{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.kpi [data-spark]{height:34px;margin-top:8px}
.dl{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:.78rem}
.dl .i{width:.9em;height:.9em}.dl-up{color:var(--ok)}.dl-dn{color:var(--bad)}
/* badges and avatars */
.bd{display:inline-flex;align-items:center;gap:.3em;padding:.18em .6em;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.bd-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.bd-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 17%,transparent)}
.bd-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.bd-info{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 60% 52%),hsl(calc(var(--h) + 40) 62% 42%))}
.who{display:flex;align-items:center;gap:9px;min-width:0}.who b{display:block;font-weight:600}.who small{display:block;color:var(--muted);font-size:.75rem}
/* table */
.tb-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tb-q{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r2,10px);padding:0 10px;background:var(--field,transparent);min-width:0;flex:1 1 180px;max-width:280px;color:var(--muted)}
.tb-q input{border:0;background:none;outline:none;padding:.5em 0;width:100%;min-width:0;color:var(--text)}
.tb-q:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.34em .8em;font-size:.78rem;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.tb-wrap{overflow-x:auto;margin:0 calc(var(--pad,18px) * -1);padding:0 var(--pad,18px)}
table.tb{width:100%;border-collapse:collapse;font-size:.85rem}
.tb th{text-align:left;font-weight:700;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th button{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:3px}
.tb th .so{opacity:.35;width:13px;height:13px}.tb th[aria-sort=ascending] .so,.tb th[aria-sort=descending] .so{opacity:1;color:var(--acc)}
.tb td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tb tbody tr{transition:background .15s}
.tb tbody tr[data-i]{cursor:pointer}
.tb tbody tr[data-i]:hover,.tb tbody tr[data-i]:focus-visible{background:var(--hover)}
.tb tbody tr:focus-visible{outline-offset:-2px}
.tb .r,.r{text-align:right}
.tb th.r button{flex-direction:row-reverse}
.row-in{animation:rowIn .45s var(--ease) both;animation-delay:var(--d)}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
.tb-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pg{display:flex;gap:4px}
.pg button{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:.8rem;font-weight:600;color:var(--text)}
.pg button[aria-current]{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.empty{display:grid;place-items:center;gap:8px;padding:30px 12px;color:var(--muted);text-align:center;font-size:.85rem;white-space:normal}
.empty .i{width:28px;height:28px;opacity:.6}
/* layers: modal and drawer */
.ly{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.ly-bg{position:absolute;inset:0;background:var(--scrim,rgba(8,10,18,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .28s}
.ly.open .ly-bg{opacity:1}
.ly-box{position:relative;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 90px -20px rgba(0,0,0,.45);transform:translateY(18px) scale(.96);opacity:0;transition:transform .34s var(--spring),opacity .22s}
.ly-box.wide{width:min(760px,100%)}
.ly.open .ly-box{transform:none;opacity:1}
.ly-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.ly-hd h2{font-size:1.08rem;flex:1;font-weight:700}
.ly-x{width:2.1rem;height:2.1rem}
.ly-bd{padding:14px 18px 18px}
.ly-drawer{place-items:stretch end;padding:0}
.ly-drawer .ly-box{width:min(470px,100%);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);transform:translateX(100%);border-right:0}
.ly-drawer .ly-box.wide{width:min(640px,100%)}
.ly-sm .ly-box{width:min(400px,100%)}
.ly-ft{display:flex;gap:8px;align-items:center;padding-top:16px;flex-wrap:wrap}
.cf-t{color:var(--muted)}
/* forms */
.frm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.frm-note{font-size:.84rem;color:var(--muted);margin-bottom:12px}
.frm-err{color:var(--bad);font-size:.82rem;margin-top:8px;min-height:0}
.frm-err:empty{display:none}
.fld{display:grid;gap:5px;align-content:start;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:.78rem;font-weight:700;color:var(--muted)}
.fld>label b{color:var(--bad)}
.fld input,.fld select,.fld textarea,.inp{width:100%;padding:.62em .75em;border:1px solid var(--line);border-radius:var(--r2,10px);background:var(--field,var(--bg));color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:shake .35s}
.fld small{font-size:.74rem;color:var(--muted)}
.err{margin:0;color:var(--bad);font-size:.75rem;font-weight:600}
.err:empty{display:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.86rem;font-weight:600}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw input+span{width:40px;height:23px;border-radius:12px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw input+span::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(17px)}
.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{accent-color:var(--acc);width:100%}
@media (max-width:520px){.frm-grid{grid-template-columns:1fr}}
/* tooltip, toasts, popovers, command search */
#tip{position:fixed;left:0;top:0;z-index:95;pointer-events:none;background:var(--tipbg,#14161d);color:var(--tiptext,#f4f5f8);padding:8px 10px;border-radius:9px;font-size:.76rem;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;max-width:250px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#tip.on{opacity:1;transform:none}
#tip b{display:block;margin-bottom:3px;font-size:.78rem}
#tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
#tip .tr span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
#tip .tr i{width:8px;height:8px;border-radius:50%;flex:none}
#tip .tr-m{opacity:.75}
#toasts{position:fixed;z-index:96;bottom:16px;right:16px;display:grid;gap:8px;max-width:calc(100% - 32px);justify-items:end}
.tst{display:flex;align-items:center;gap:10px;background:var(--tipbg,#14161d);color:var(--tiptext,#fff);padding:10px 14px;border-radius:12px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateY(20px) scale(.96);opacity:0;transition:transform .35s var(--spring),opacity .25s;font-size:.85rem;font-weight:600}
.tst.in{transform:none;opacity:1}
.tst .i{color:var(--ok)}.tst-warn .i,.tst-err .i{color:var(--warn)}.tst-err .i{color:var(--bad)}
.tst-u{background:none;border:0;color:var(--acc);font-weight:800;padding:0 0 0 6px}
.pop{position:fixed;z-index:85;width:min(340px,calc(100vw - 16px));background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r,14px);box-shadow:0 24px 60px -18px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .2s,transform .25s var(--spring)}
.pop.open{opacity:1;transform:none}
.pop-hd,.pop-ft{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.pop-l{list-style:none;margin:0;padding:0 6px;max-height:340px;overflow:auto}
.pop-l li{display:flex;gap:10px;padding:10px 8px;border-radius:10px;font-size:.82rem}
.pop-l li.unread{background:var(--hover)}
.pop-l li p{color:var(--muted)}
.pop-l small{color:var(--muted);font-size:.72rem}
.pop-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:currentColor;padding:0}
.pop-mn{width:auto;min-width:190px}
.mn{list-style:none;margin:0;padding:6px}
.mn button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:.55em .7em;border-radius:8px;font-size:.85rem;color:var(--text)}
.mn button:hover,.mn button:focus-visible{background:var(--hover)}
.mn button.danger{color:var(--bad)}
.ly-cmd{place-items:start center;padding-top:12vh}
.ly-cmd .ly-hd{display:none}
.cmd input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 4px;font-size:1.05rem;outline:none;color:var(--text)}
.cmd ul{list-style:none;margin:8px 0 0;padding:0}
.cmd li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:.9rem}
.cmd li[aria-selected=true]{background:var(--acc);color:var(--acc-ink)}
.cmd-h{font-size:.72rem;color:var(--muted);margin-top:10px}
/* charts */
.ch{display:block;overflow:visible;max-width:100%}
.ch text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.ch .gl{stroke:var(--grid,var(--line));stroke-width:1}
.ch .gl.zero{stroke:var(--muted);stroke-opacity:.5}
.ch .ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.ch .ln.dash{stroke-dasharray:5 5;opacity:.8}
.ch.anim .ln:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
.ch.anim .ln.dash,.ch.anim .band{animation:fade 1s .9s both}
.ch.anim .ar{animation:fade 1.1s .35s both}
.ch .band{fill-opacity:.13;stroke:none}
.ch .goal{stroke:var(--warn);stroke-dasharray:3 4}.ch .goal-t{fill:var(--warn);font-weight:700}
.ch .mark{stroke:var(--muted);stroke-dasharray:2 3;opacity:.7}.ch .mark-t{font-weight:700}
.ch .guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:.7;pointer-events:none}
.ch .hd{fill:var(--panel-solid,var(--bg));stroke-width:2.5;pointer-events:none}
.ch .hit{cursor:crosshair}
@keyframes draw{to{stroke-dashoffset:0}}
.ch .bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s,filter .2s}
.ch .bar.neg{transform-origin:50% 0}
.ch .bar:hover{filter:brightness(1.15) saturate(1.1)}
.ch.anim .bar{animation:grow .75s var(--ease) both;animation-delay:var(--d)}
@keyframes grow{from{transform:scaleY(0)}}
.ch .hm{transform-box:fill-box;transform-origin:center}
.ch.anim .hm{animation:pop .5s var(--ease) both;animation-delay:var(--d)}
.ch-empty{display:grid;place-items:center;gap:6px;min-height:140px;color:var(--muted);font-size:.85rem}
.ch-empty .i{width:28px;height:28px;opacity:.5}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.lg-i{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;font-size:.78rem;color:var(--muted);font-weight:600}
.lg-i i{width:10px;height:10px;border-radius:3px}
.lg-i[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn-w{position:relative;flex:none;margin:auto}
.dn-t{fill:none;stroke:var(--line)}
.dn-s{fill:none;stroke-width:var(--th,20px);transition:stroke-width .25s var(--ease);cursor:pointer}
.dn-s:hover{stroke-width:calc(var(--th,20px) + 6px)}
.ch.anim .dn-s,.ch.anim .gg-v,.ring-v{animation:sweep .95s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes sweep{from{stroke-dasharray:0 100}}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.dn-c small{font-size:.72rem;color:var(--muted)}
.dn-l{list-style:none;margin:0;padding:0;flex:1 1 150px;display:grid;gap:7px;font-size:.8rem;min-width:0}
.dn-l li{display:flex;align-items:center;gap:8px}
.dn-l i{width:10px;height:10px;border-radius:3px;flex:none}
.dn-l span{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);width:34px;text-align:right;font-size:.72rem}
.gg{position:relative;margin:auto}
.gg-t{fill:none;stroke:var(--line);stroke-linecap:round}
.gg-v{fill:none;stroke-linecap:round}
.gg-c{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-c b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.gg-c small{color:var(--muted);font-size:.75rem}
.ring{transform:rotate(0);flex:none}
.ring-t{fill:none;stroke:var(--line)}.ring-v{fill:none;stroke-linecap:round}
.hb{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.hb li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.82rem}
.hb-l{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb b{font-variant-numeric:tabular-nums}
.hb-t{grid-column:1/-1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:hbw .9s var(--ease) both;animation-delay:var(--d)}
@keyframes hbw{from{width:0}}
.pb{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;width:var(--w);background:var(--acc);border-radius:inherit;animation:hbw .9s var(--ease) both;transition:width .6s var(--ease)}
/* segmented control */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:calc(var(--r2,10px) + 2px);background:var(--seg,color-mix(in srgb,var(--muted) 14%,transparent));flex:none}

/* collections and charts derive from the schedules */
function series(n) { const exp = Array(n).fill(0), got = Array(n).fill(0), int = Array(n).fill(0), bal = Array(n).fill(0); DB.loans.forEach(L => { const S = sched(L), ms = monthsSince(L.start); for (let k = 0; k < n; k++) { const m = n - 1 - k, idx = ms - m; if (idx >= 1 && idx <= L.term) { const r = S[idx - 1]; exp[k] += r.pay; const missed = (L.late && m < L.late) || (L.status === 'Paid off' && idx > L.term); if (!missed) { got[k] += r.pay; int[k] += r.int; } } if (idx >= 0 && L.status !== 'Paid off') bal[k] += idx === 0 ? L.amount : S[Math.min(idx, L.term) - 1].bal; } }); return { exp, got, int, bal }; }
const kpi = (id, l, v, f, icn, sub = '', sp, col) => `<div class="card kpi lift"><p class="k-l">${ic(icn)}${l}</p><p class="k-v" id="${id}" data-count="${Math.round(v * 100) / 100}" data-fmt="${f}">0</p><div class="k-s">${sub}</div>${sp ? `<div data-spark="${JSON.stringify(sp.map(Math.round))}" data-color="${col || 'var(--c1)'}"></div>` : ''}</div>`;
const lateAmt = L => payOf(L) * (L.late || 0) * (1 + DB.cfg.fee / 100);
/* hourglass: top sand = what is left, bottom = what is repaid */
function hourglass(p, big) { const id = 'hg' + (++gid); const t = 1 - clamp(p, 0, 1); return `<svg class="hg ${big ? 'hg-big' : ''}" viewBox="0 0 120 180" role="img" aria-label="${Math.round(p * 100)} percent repaid"><defs><clipPath id="${id}a"><path d="M22 16h76c0 30-28 44-34 58h-8C50 60 22 46 22 16z"/></clipPath><clipPath id="${id}b"><path d="M22 164h76c0-30-28-44-34-58h-8c-6 14-34 28-34 58z"/></clipPath></defs><g clip-path="url(#${id}a)"><rect class="sand mv" x="0" y="16" width="120" height="60" style="transform:translateY(${f1(t * 0 + (1 - t) * 60)}px)"/></g><g clip-path="url(#${id}b)"><rect class="sand-b mv" x="0" y="106" width="120" height="60" style="transform:translateY(${f1((1 - p) * 60)}px)"/></g><line class="drip" x1="60" y1="74" x2="60" y2="160"/><path class="frame" d="M22 16h76c0 30-28 44-34 58v32c6 14 34 28 34 58H22c0-30 28-44 34-58V74C50 60 22 46 22 16z"/><rect class="cap" x="12" y="8" width="96" height="8" rx="4"/><rect class="cap" x="12" y="164" width="96" height="8" rx="4"/></svg>`; }
function setGlass(svg, p) { const r = $$('.mv', svg); if (r.length < 2) return; r[0].style.transform = `translateY(${f1((1 - clamp(1 - p, 0, 1)) * 60)}px)`; r[1].style.transform = `translateY(${f1((1 - clamp(p, 0, 1)) * 60)}px)`; svg.setAttribute('aria-label', Math.round(p * 100) + ' percent repaid'); svg.classList.add('flow'); clearTimeout(svg._t); svg._t = setTimeout(() => svg.classList.remove('flow'), 700); }

/* ---------- pages ---------- */
const PG = {};
PG.overview = v => {
  const A = active(), S = series(12), out = sum(A, balOf), book = sum(A, L => L.amount), late = DB.loans.filter(L => L.late), arrears = sum(late, lateAmt), wr = sum(A, L => L.rate * balOf(L)) / Math.max(1, out), rep = book ? 1 - out / book : 0;
  v.innerHTML = `<div class="g g21"><div class="card hero lift"><div id="hg-o">${hourglass(0)}</div><div><h2>${esc(DB.me.firm)} book</h2><p>${A.length} live loans to ${new Set(A.map(L => L.b)).size} borrowers</p><p class="big" id="k-rep" data-count="${(rep * 100).toFixed(1)}" data-fmt="pct">0</p><p>of all money lent has already come back. ${money(out, { short: true })} is still out.</p><div class="ly-ft"><button type="button" class="btn pri" data-act="newApp">${ic('plus')}New application</button><a class="btn ghost" href="#/repayments">${ic('cal')}Due this month</a></div></div></div>
   <div class="card"><div class="ch-h"><h2>Book by product</h2></div><div id="o-dn"></div></div></div>
  <div class="g g4 mt">${kpi('k-out', 'Outstanding principal', out, 'smoney', 'coin', `${delta(4.2)} this quarter`, S.bal)}${kpi('k-col', 'Collected this month', S.got[11], 'money', 'down', `of ${money(S.exp[11], { short: true })} due`, S.got, 'var(--c3)')}${kpi('k-arr', 'In arrears', arrears, 'money', 'alert', `${late.length} loans late`)}${kpi('k-rate', 'Weighted rate', wr, 'pct2', 'percent', 'by balance')}</div>
  <div class="g g21 mt"><div class="card"><div class="ch-h"><div><h2>Repayments</h2><p class="mut" style="font-size:.82rem">What was due against what came in</p></div></div><div id="o-rep"></div></div>
   <div class="card"><div class="ch-h"><h2>Due next</h2><span class="sp"></span><a class="lnk" href="#/repayments">Calendar</a></div><ul class="mini">${A.map(L => ({ L, d: new Date(NOW.getFullYear(), NOW.getMonth() + (L.day < NOW.getDate() ? 1 : 0), L.day) })).sort((a, b) => a.d - b.d).slice(0, 6).map(({ L, d }) => `<li>${av(bName(L.b))}<div><b>${esc(bName(L.b))}</b><br><small class="mut">${fd(+d)} · ${L.id}</small></div><span class="amt">${money(payOf(L))}</span></li>`).join('')}</ul></div></div>`;
  later(350, () => { const h = $('#hg-o svg'); h && setGlass(h, rep); });
  donut($('#o-dn', v), { data: PRODUCTS.map(p => ({ label: p, value: sum(A.filter(L => L.product === p), balOf), color: PC[p] })), fmt: x => money(x, { short: true }), label: 'Outstanding', size: 170, thick: 22 });
  lineChart($('#o-rep', v), { labels: monthsBack(12), series: [{ name: 'Due', data: S.exp, color: 'var(--c2)', dash: true }, { name: 'Collected', data: S.got, color: 'var(--c1)' }], area: true, h: 230, fmt: x => '$' + short(x), vfmt: money });
};
PG.loans = v => {
  const A = active();
  v.innerHTML = `<div class="g g4">${kpi('l-n', 'Live loans', A.length, 'int', 'file')}${kpi('l-b', 'Original book', sum(A, L => L.amount), 'smoney', 'coin')}${kpi('l-avg', 'Average loan', sum(A, L => L.amount) / Math.max(1, A.length), 'money', 'tag')}${kpi('l-ltv', 'Average loan to value', sum(A, L => L.ltv) / Math.max(1, A.length), 'pct0', 'home')}</div><div class="card mt" id="l-tb"></div>`;
  table($('#l-tb', v), { id: 'loans', label: 'loans', ph: 'Search loans, borrowers, cities…', cols: [{ k: 'id', label: 'Loan', fmt: L => `<b>${L.id}</b><br><small class="mut">${esc(L.product)}</small>` }, { k: 'b', label: 'Borrower', fmt: L => `<div class="who">${av(bName(L.b))}<div><b>${esc(bName(L.b))}</b><small>${esc(L.ptype)} · ${esc(L.city)}</small></div></div>`, sort: L => bName(L.b) }, { k: 'amount', label: 'Amount', cls: 'r', fmt: L => money(L.amount) }, { k: 'rate', label: 'Rate', cls: 'r', fmt: L => pct(L.rate, 2) }, { k: 'term', label: 'Term', cls: 'r', fmt: L => L.term + ' mo' }, { k: 'bal', label: 'Balance', cls: 'r', fmt: L => `<b>${money(balOf(L))}</b>`, sort: balOf }, { k: 'status', label: 'Status', fmt: L => badge(L.status, L.status === 'Late' ? 'warn' : L.status === 'Paid off' ? 'info' : '') }],
    rows: () => DB.loans, search: L => L.id + ' ' + bName(L.b) + ' ' + L.city + ' ' + L.product, chips: { key: L => L.status, opts: ['All', 'Current', 'Late', 'Default', 'Paid off'] }, size: 8, csv: true, csvName: 'dunecrest-loans', onRow: openLoan, tools: `<button type="button" class="btn pri" data-act="newApp">${ic('plus')}New application</button>` });
};
function openLoan(L) {
  const S = sched(L), n = paidN(L), bal = balOf(L), paidPrin = L.amount - bal;
  drawer(L.id + ' · ' + bName(L.b), `<div style="display:flex;gap:16px;align-items:center"><div id="ld-hg">${hourglass(paidPrin / L.amount)}</div><div><p class="mut">${esc(L.product)} · ${esc(L.ptype)} in ${esc(L.city)}</p><p class="disp" style="font-size:2rem">${money(bal)}</p><p class="mut">left of ${money(L.amount)} · ${badge(L.status)}</p></div></div>
  <div class="kv"><div><small>Rate</small><b>${pct(L.rate, 2)}</b></div><div><small>Payment</small><b>${money(payOf(L))}/mo</b></div><div><small>Paid</small><b>${n} of ${L.term}</b></div><div><small>Loan to value</small><b>${L.ltv}%</b></div><div><small>Due day</small><b>${L.day}th</b></div><div><small>Type</small><b>${L.io ? 'Interest only' : 'Amortizing'}</b></div></div>
  <p class="sec">Schedule</p><div class="sch"><table><thead><tr><th scope="col">#</th><th scope="col">Date</th><th scope="col">Payment</th><th scope="col">Principal</th><th scope="col">Interest</th><th scope="col">Balance</th></tr></thead><tbody>${S.slice(Math.max(0, n - 3), Math.max(0, n - 3) + 24).map(r => `<tr class="${r.k <= n ? 'paid' : r.k === n + 1 ? 'now' : ''}"><td>${r.k}</td><td>${MON[new Date(r.t).getMonth()]} ${new Date(r.t).getFullYear()}</td><td>${money(r.pay)}</td><td>${money(r.prin)}</td><td>${money(r.int)}</td><td>${money(r.bal)}</td></tr>`).join('')}</tbody></table></div>
  ${L.log.length ? `<p class="sec">Notes</p><ul class="mini">${L.log.map(x => `<li>${ic('chat')}<span>${esc(x.txt)}</span><small class="mut amt">${fd(x.t)}</small></li>`).join('')}</ul>` : ''}
  <footer class="ly-ft"><button type="button" class="btn ghost" data-act="stmt" data-id="${L.id}">${ic('mail')}Send statement</button><span class="sp"></span>${L.status !== 'Paid off' ? `<button type="button" class="btn pri" data-act="recPay" data-id="${L.id}">${ic('coin')}Record payment</button>` : ''}</footer>`, b => { later(300, () => { const h = $('#ld-hg svg', b); h && setGlass(h, paidPrin / L.amount); }); }, true);
}
act('stmt', b => { const L = byId(DB.loans, b.dataset.id); toast(`Statement for ${L.id} emailed to ${bName(L.b)}`); });
act('recPay', b => { const L = byId(DB.loans, b.dataset.id); closeLayers(); const due = L.late ? lateAmt(L) : payOf(L); formModal({ title: 'Record payment · ' + L.id, submit: 'Record', values: { amt: Math.round(due), date: iso(T0), how: 'Bank transfer' }, note: L.late ? `${bName(L.b)} is ${L.late} payment${L.late > 1 ? 's' : ''} behind, including the ${DB.cfg.fee}% late fee.` : `Regular payment is ${money(payOf(L))}.`, fields: [{ k: 'amt', label: 'Amount ($)', type: 'money', req: true, min: 1 }, { k: 'date', label: 'Received on', type: 'date', req: true }, { k: 'how', label: 'Method', type: 'select', opts: ['Bank transfer', 'Card', 'Check'], full: true }],
  onSubmit: x => { const k = Math.min(L.late || 0, Math.floor(x.amt / payOf(L))); if (L.late) { L.late -= k; if (!L.late && L.status !== 'Default') L.status = 'Current'; } L.log.unshift({ t: Date.now(), txt: `Payment of ${money(x.amt)} by ${x.how.toLowerCase()}` }); save(); refresh(); toast(`${money(x.amt)} recorded for ${L.id}`); notify('Payment received', `${bName(L.b)} · ${money(x.amt)}`, 'ok'); } }); });

PG.applications = v => {
  const Ap = DB.apps;
  v.innerHTML = `<div class="g g4">${STAGE.map((s, i) => kpi('a-' + i, s, sum(Ap.filter(a => a.stage === s), a => a.amount), 'smoney', ['inbox', 'search', 'check', 'send'][i], `${Ap.filter(a => a.stage === s).length} applications`)).join('')}</div>
  <div class="ch-h mt"><p class="mut" style="font-size:.85rem">Drag a card to move it along. Keyboard: focus a card and press its ••• button.</p><span class="sp"></span><button type="button" class="btn pri" data-act="newApp">${ic('plus')}New application</button></div>
  <div class="board" id="board">${STAGE.map(s => { const cs = Ap.filter(a => a.stage === s); return `<section class="col" data-stage="${s}" aria-label="${s}"><div class="col-h">${s}<small>${cs.length} · ${money(sum(cs, a => a.amount), { short: true })}</small></div>${cs.map(a => `<article class="app-c ${App.landed === a.id ? 'land' : ''}" data-id="${a.id}" tabindex="0" aria-label="${esc(bName(a.b) + ', ' + money(a.amount) + ', ' + s)}"><div class="t"><span class="dd-h" aria-hidden="true">${ic('grip')}</span>${av(bName(a.b))}<b>${esc(bName(a.b))}</b><button type="button" class="mv" data-act="moveA" data-id="${a.id}" aria-label="Move ${a.id}">${ic('more')}</button></div><p class="amt">${money(a.amount)}</p><small>${esc(a.product)} · ${a.term} mo · ${pct(a.rate, 2)} · ${esc(a.city)}</small><div class="meter" title="Loan to value ${a.ltv}%"><i style="--w:${a.ltv}%;background:${a.ltv > 75 ? 'var(--warn)' : 'var(--c3)'}"></i></div><small>LTV ${a.ltv}% · score ${(byId(DB.borrowers, a.b) || {}).score || '—'}</small></article>`).join('') || '<p class="empty">Drop an application here</p>'}</section>`; }).join('')}</div>`;
  App.landed = null;
  dnd($('#board', v), { item: '.app-c', zone: '.col', onDrop: (id, z) => moveApp(id, z.dataset.stage) });
  $('#board', v).addEventListener('click', e => { const c = e.target.closest('.app-c'); if (c && !e.target.closest('button')) openApp(byId(DB.apps, c.dataset.id)); });
  $('#board', v).addEventListener('keydown', e => { const c = e.target.closest('.app-c'); if (c && e.target === c && e.key === 'Enter') openApp(byId(DB.apps, c.dataset.id)); });
};
function moveApp(id, stage) { const a = byId(DB.apps, id); if (!a || a.stage === stage) return; if (stage === 'Funded') { fundApp(a); return; } a.stage = stage; App.landed = id; save(); refresh(); toast(`${id} moved to ${stage}`); }
function fundApp(a) { confirmDlg({ title: 'Fund this loan?', text: `${money(a.amount)} goes to ${esc(bName(a.b))} today and a new loan starts with its schedule.`, ok: 'Fund loan', onOk: () => { a.stage = 'Funded'; App.landed = a.id; const io = a.product === 'Bridge' || a.product === 'Fix & flip' || a.product === 'Construction'; DB.loans.unshift({ id: 'LN-' + (2100 + DB.loans.length), b: a.b, product: a.product, io, ptype: pick(PTYPES), city: a.city, amount: a.amount, rate: a.rate, term: a.term, start: mStart(0), day: Math.min(28, NOW.getDate()), status: 'Current', late: 0, ltv: a.ltv, log: [{ t: Date.now(), txt: 'Funded from ' + a.id }] }); save(); closeLayers(); refresh(); toast(`Loan funded: ${money(a.amount)} to ${bName(a.b)}`); notify('Loan funded', `${a.id} is now live`, 'ok'); } }); }
act('moveA', b => { const a = byId(DB.apps, b.dataset.id); menu(b, STAGE.map(s => ({ label: 'Move to ' + s, icon: 'arrowR', disabled: s === a.stage, run: () => moveApp(a.id, s) }))); });
function openApp(a) { const br = byId(DB.borrowers, a.b) || {}, p = a.io ? 0 : pmt(a.amount, a.rate, a.term); drawer(a.id + ' · ' + bName(a.b), `<p class="disp" style="font-size:2rem">${money(a.amount)}</p><p class="mut">${esc(a.product)} in ${esc(a.city)} · applied ${fd(a.at, 1)} · ${badge(a.stage)}</p>
  <div class="kv"><div><small>Rate</small><b>${pct(a.rate, 2)}</b></div><div><small>Term</small><b>${a.term} months</b></div><div><small>Payment</small><b>${money(p || a.amount * a.rate / 1200)}</b></div><div><small>Loan to value</small><b>${a.ltv}%</b></div><div><small>Credit score</small><b>${br.score || '—'}</b></div><div><small>Borrower since</small><b>${br.since ? fd(br.since, 1) : 'New'}</b></div></div>
  <footer class="ly-ft"><button type="button" class="btn ghost danger" data-act="declineA" data-id="${a.id}">Decline</button><span class="sp"></span>${a.stage !== 'Funded' ? `<button type="button" class="btn pri" data-act="advA" data-id="${a.id}">${a.stage === 'Approved' ? 'Fund loan' : 'Move to ' + STAGE[STAGE.indexOf(a.stage) + 1]}</button>` : ''}</footer>`); }
act('advA', b => { const a = byId(DB.apps, b.dataset.id); closeLayers(); moveApp(a.id, STAGE[STAGE.indexOf(a.stage) + 1]); });
act('declineA', b => confirmDlg({ title: 'Decline this application?', text: 'It is removed from the pipeline and the borrower gets a polite email.', ok: 'Decline', danger: true, onOk: () => { DB.apps = DB.apps.filter(a => a.id !== b.dataset.id); save(); closeLayers(); refresh(); toast('Application declined'); } }));
act('newApp', () => formModal({ title: 'New application', submit: 'Add to pipeline', values: { product: 'Rental', term: '120', rate: DB.cfg.base, city: CITIES[0], ltv: 65 }, fields: [{ k: 'b', label: 'Borrower', type: 'select', opts: [['', 'Choose a borrower…'], ...DB.borrowers.map(x => [x.id, x.name])], req: true, full: true }, { k: 'product', label: 'Product', type: 'select', opts: PRODUCTS }, { k: 'city', label: 'City', type: 'select', opts: CITIES }, { k: 'amount', label: 'Amount ($)', type: 'money', req: true, min: 10000, max: 5e6 }, { k: 'rate', label: 'Rate (%)', type: 'number', step: '0.01', req: true, min: 1, max: 30 }, { k: 'term', label: 'Term', type: 'select', opts: [['12', '12 months'], ['24', '24 months'], ['60', '5 years'], ['120', '10 years'], ['360', '30 years']] }, { k: 'ltv', label: 'Loan to value (%)', type: 'number', req: true, min: 1, max: 95 }],
  onSubmit: x => { DB.apps.unshift({ id: 'AP-' + (400 + DB.apps.length), b: x.b, product: x.product, amount: x.amount, rate: x.rate, term: +x.term, ltv: x.ltv, stage: 'Applied', city: x.city, at: Date.now() }); App.landed = DB.apps[0].id; save(); if (App.cur !== 'applications') location.hash = '#/applications'; else refresh(); toast('Application added to the pipeline'); } }));

PG.borrowers = v => {
  v.innerHTML = `<div class="card" id="b-tb"></div>`;
  table($('#b-tb', v), { id: 'borrowers', label: 'borrowers', cols: [{ k: 'name', label: 'Borrower', fmt: x => `<div class="who">${av(x.name)}<div><b>${esc(x.name)}</b><small>${esc(x.email)}</small></div></div>` }, { k: 'score', label: 'Credit score', fmt: x => `<span style="display:inline-flex;align-items:center;gap:8px">${ring((x.score - 300) / 550 * 100, x.score > 740 ? 'var(--c3)' : x.score > 670 ? 'var(--c5)' : 'var(--c2)', 30, 4)}<b class="score">${x.score}</b></span>` }, { k: 'n', label: 'Loans', cls: 'r', fmt: x => DB.loans.filter(L => L.b === x.id).length, sort: x => DB.loans.filter(L => L.b === x.id).length }, { k: 'owed', label: 'Owes', cls: 'r', fmt: x => money(sum(DB.loans.filter(L => L.b === x.id), balOf)), sort: x => sum(DB.loans.filter(L => L.b === x.id), balOf) }, { k: 'st', label: 'Standing', fmt: x => { const l = DB.loans.filter(L => L.b === x.id); return l.some(L => L.status === 'Default') ? badge('Default') : l.some(L => L.late) ? badge('Late', 'warn') : badge('Good', 'ok'); }, sort: false }],
    rows: () => DB.borrowers, sort: { i: 3, dir: -1 }, search: x => x.name + ' ' + x.email, size: 9, csv: true, csvName: 'dunecrest-borrowers', onRow: openBorrower, tools: `<button type="button" class="btn pri" data-act="addB">${ic('plus')}Add borrower</button>` });
};
function openBorrower(x) { const ls = DB.loans.filter(L => L.b === x.id), D = [['id', 'Photo ID'], ['income', 'Proof of income'], ['bank', 'Bank statements'], ['title', 'Property title']];
  drawer(x.name, `<div class="who">${av(x.name)}<div><b>${esc(x.name)}</b><small>${esc(x.email)} · ${esc(x.phone)}</small></div></div>
  <div class="kv"><div><small>Credit score</small><b>${x.score}</b></div><div><small>Loans</small><b>${ls.length}</b></div><div><small>Owes</small><b>${money(sum(ls, balOf), { short: true })}</b></div></div>
  <p class="sec">Loans</p><ul class="mini">${ls.map(L => `<li>${ic('file')}<div><b>${L.id}</b><br><small class="mut">${esc(L.product)} · ${pct(L.rate, 2)}</small></div>${badge(L.status)}<span class="amt">${money(balOf(L))}</span></li>`).join('') || '<li class="mut">No loans yet</li>'}</ul>
  <p class="sec">Documents</p>${D.map(([k, l]) => `<div class="ctl"><span>${l}</span><label class="sw"><input type="checkbox" role="switch" data-doc="${k}" ${x.docs[k] ? 'checked' : ''}><span></span><span class="sr">${l} received</span></label></div>`).join('')}
  <footer class="ly-ft"><button type="button" class="btn ghost danger" data-act="delB" data-id="${x.id}">${ic('trash')}Delete</button><span class="sp"></span><button type="button" class="btn pri" data-act="newApp">${ic('plus')}New application</button></footer>`, b => b.addEventListener('change', e => { const k = e.target.dataset.doc; if (k) { x.docs[k] = e.target.checked; save(); toast(`${D.find(d => d[0] === k)[1]} marked ${e.target.checked ? 'received' : 'missing'}`); } })); }
act('delB', b => { const x = byId(DB.borrowers, b.dataset.id); if (DB.loans.some(L => L.b === x.id && L.status !== 'Paid off')) { toast('This borrower still has a live loan', 'warn'); return; } confirmDlg({ title: 'Delete ' + x.name + '?', text: 'Their contact details and documents are removed.', ok: 'Delete', danger: true, onOk: () => { DB.borrowers = DB.borrowers.filter(y => y !== x); save(); closeLayers(); refresh(); toast('Borrower deleted'); } }); });
act('addB', () => formModal({ title: 'Add borrower', submit: 'Add', fields: [{ k: 'name', label: 'Full name', req: true, minLen: 3 }, { k: 'email', label: 'Email', type: 'email', req: true }, { k: 'phone', label: 'Phone', req: true, check: p => /^[0-9()+\-\s]{7,}$/.test(p) ? '' : 'Enter a valid phone number' }, { k: 'score', label: 'Credit score', type: 'number', req: true, min: 300, max: 850 }], onSubmit: x => { DB.borrowers.unshift({ id: uid('b'), ...x, since: Date.now(), docs: { id: false, income: false, bank: false, title: false } }); save(); refresh(); toast(x.name + ' added'); } }));

PG.repayments = v => {
  const off = DB.cal || 0, base = new Date(NOW.getFullYear(), NOW.getMonth() + off, 1), y = base.getFullYear(), m = base.getMonth(), days = new Date(y, m + 1, 0).getDate(), lead = base.getDay();
  const A = active().filter(L => { const s = new Date(L.start), e = addM(L.start, L.term); return +new Date(y, m, 28) >= +s && +new Date(y, m, 1) <= e; });
  const dueOn = d => A.filter(L => L.day === d);
  const st = (L, d) => { const t = +new Date(y, m, d); if (L.late && (off < 0 || (off === 0 && t <= T0))) return 'late'; return t < T0 ? 'paid' : ''; };
  const totDue = sum(A, payOf), got = sum(A.filter(L => st(L, L.day) === 'paid'), payOf);
  v.innerHTML = `<div class="g g4">${kpi('r-due', 'Due this month', totDue, 'money', 'cal', `${A.length} payments`)}${kpi('r-got', 'Collected', got, 'money', 'check', pct(got / Math.max(1, totDue) * 100, 0) + ' of due')}${kpi('r-left', 'Still to come', sum(A.filter(L => !st(L, L.day)), payOf), 'money', 'clock')}${kpi('r-late', 'Late', sum(A.filter(L => st(L, L.day) === 'late'), payOf), 'money', 'alert')}</div>
  <div class="card mt"><div class="cal-h"><button type="button" class="ib" data-act="cal" data-d="-1" aria-label="Previous month">‹</button><h2>${MON[m]} ${y}</h2><button type="button" class="ib" data-act="cal" data-d="1" aria-label="Next month">›</button>${off ? '<button type="button" class="btn sm ghost" data-act="cal" data-d="0">Today</button>' : ''}<span class="sp"></span><small class="mut">Click a day to see who pays</small></div>
  <div class="cal">${WD.map(d => `<span class="wd">${d}</span>`).join('')}${Array.from({ length: lead }, () => '<span class="day blank" aria-hidden="true"></span>').join('')}${Array.from({ length: days }, (_, i) => { const d = i + 1, ls = dueOn(d), today = off === 0 && d === NOW.getDate(); return `<button type="button" class="day ${today ? 'today' : ''} ${ls.length ? 'has' : ''}" data-act="day" data-d="${d}" aria-label="${d} ${MON[m]}: ${ls.length} payments due"><span class="dn">${d}</span>${ls.slice(0, 2).map(L => `<span class="due ${st(L, d)}">${money(payOf(L), { short: true })} ${esc(bName(L.b).split(' ')[0])}</span>`).join('')}${ls.length > 2 ? `<small class="mut">+${ls.length - 2} more</small>` : ''}</button>`; }).join('')}</div></div>`;
  act('day', b => { const d = +b.dataset.d, ls = dueOn(d); drawer(`${d} ${MON[m]} ${y}`, ls.length ? `<ul class="mini">${ls.map(L => `<li>${av(bName(L.b))}<div><b>${esc(bName(L.b))}</b><br><small class="mut">${L.id} · ${esc(L.product)}</small></div>${badge(st(L, d) === 'paid' ? 'Paid' : st(L, d) === 'late' ? 'Late' : 'Due')}<span class="amt">${money(payOf(L))}</span><button type="button" class="ib" data-act="recPay" data-id="${L.id}" aria-label="Record payment for ${L.id}">${ic('coin')}</button></li>`).join('')}</ul>` : `<div class="empty">${ic('cal')}<span>Nothing due on this day.</span></div>`); });
};
act('cal', b => { const d = +b.dataset.d; DB.cal = d === 0 ? 0 : (DB.cal || 0) + d; save(); render(App.map.repayments, [], false); });

PG.collections = v => {
  const late = DB.loans.filter(L => L.late), dl = L => L.late * 30 - 30 + ((NOW.getDate() - L.day + 30) % 30) + 1, bucket = d => d <= 30 ? 0 : d <= 60 ? 1 : d <= 90 ? 2 : 3, B = ['1–30 days', '31–60 days', '61–90 days', '90+ days'], amts = [0, 0, 0, 0], cnt = [0, 0, 0, 0];
  late.forEach(L => { const k = bucket(dl(L)); amts[k] += lateAmt(L); cnt[k]++; }); const mx = Math.max(1, ...amts);
  v.innerHTML = `<div class="card"><div class="ch-h"><h2>Arrears by age</h2><span class="sp"></span><span class="mut" style="font-size:.85rem">${money(sum(amts))} across ${late.length} loans</span></div><div class="bk">${B.map((b, i) => `<div><small>${b}</small><b>${money(amts[i], { short: true })}</b><small>${cnt[i]} loans</small><i style="--w:${f1(amts[i] / mx * 100)}%;--bk:${['var(--c5)', 'var(--c2)', 'var(--bad)', 'var(--c4)'][i]}"></i></div>`).join('')}</div></div>
  <div class="card mt" id="c-tb"></div>`;
  table($('#c-tb', v), { id: 'coll', label: 'late loans', cols: [{ k: 'b', label: 'Borrower', fmt: L => `<div class="who">${av(bName(L.b))}<div><b>${esc(bName(L.b))}</b><small>${L.id} · ${esc(byId(DB.borrowers, L.b) ? byId(DB.borrowers, L.b).phone : '')}</small></div></div>`, sort: L => bName(L.b) }, { k: 'dl', label: 'Days late', cls: 'r', fmt: L => `<b class="${dl(L) > 60 ? 'neg' : ''}">${dl(L)}</b>`, sort: dl }, { k: 'due', label: 'Owed now', cls: 'r', fmt: L => money(lateAmt(L)), sort: lateAmt }, { k: 'log', label: 'Last contact', fmt: L => L.log[0] ? `<small>${esc(L.log[0].txt)} · ${fd(L.log[0].t)}</small>` : '<small class="mut">No contact yet</small>', sort: false }, { k: 'x', label: '', cls: 'r', sort: false, fmt: L => `<button type="button" class="btn sm ghost" data-act="logCall" data-id="${L.id}">${ic('chat')}Log call</button> <button type="button" class="btn sm" data-act="plan" data-id="${L.id}">Payment plan</button>` }],
    rows: () => DB.loans.filter(L => L.late), sort: { i: 1, dir: -1 }, search: L => bName(L.b) + ' ' + L.id, size: 8, empty: 'Nobody is late. Lovely.', onRow: openLoan });
};
act('logCall', b => { const L = byId(DB.loans, b.dataset.id); formModal({ title: 'Log contact · ' + bName(L.b), submit: 'Save note', values: { out: 'Promised to pay' }, fields: [{ k: 'out', label: 'Outcome', type: 'select', opts: ['Promised to pay', 'No answer', 'Asked for a plan', 'Disputes the amount'], full: true }, { k: 'note', label: 'Note', type: 'textarea', full: true, ph: 'What was agreed?' }], onSubmit: x => { L.log.unshift({ t: Date.now(), txt: x.out + (x.note ? ': ' + x.note : '') }); save(); refresh(); toast('Contact logged'); } }); });
act('plan', b => { const L = byId(DB.loans, b.dataset.id), owed = lateAmt(L); formModal({ title: 'Payment plan · ' + L.id, submit: 'Start plan', values: { n: '3' }, note: `${money(owed)} is overdue. Spread it over a few months on top of the regular payment.`, fields: [{ k: 'n', label: 'Spread over', type: 'select', opts: [['2', '2 months'], ['3', '3 months'], ['4', '4 months'], ['6', '6 months']], full: true }], onInput: (x, f) => { const p = $('.frm-note', f); if (p) p.textContent = `${money(owed)} overdue → ${money(owed / +x.n + payOf(L))} a month for ${x.n} months.`; }, onSubmit: x => { L.late = 0; L.status = 'Current'; L.log.unshift({ t: Date.now(), txt: `Payment plan: ${money(owed / +x.n)} extra for ${x.n} months` }); save(); refresh(); toast('Plan started. The loan is back to current.'); } }); });

PG.calculator = v => {
  const C = App.tst.calc || (App.tst.calc = { amount: 300000, rate: DB.cfg.base, years: 15, month: 0 });
  v.innerHTML = `<div class="g g21"><div class="card"><div class="calc"><div>${[['amount', 'Loan amount', 20000, 2000000, 5000, money], ['rate', 'Interest rate', 2, 20, .05, x => pct(x, 2)], ['years', 'Term', 1, 30, 1, x => x + ' years']].map(([k, l, a, b, s, f]) => `<div class="sl"><label for="c-${k}">${l}<output id="co-${k}">${f(C[k])}</output></label><input type="range" id="c-${k}" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${C[k]}"></div>`).join('')}
   <div class="sl"><label for="c-month">Scrub through the loan<output id="co-month">Month 0</output></label><input type="range" id="c-month" min="0" max="${C.years * 12}" step="1" value="${C.month}"></div>
   <div class="rd"><div><small>Monthly payment</small><b id="cr-p">–</b></div><div><small>Balance at this month</small><b id="cr-b">–</b></div><div><small>Interest paid so far</small><b id="cr-i">–</b></div></div></div>
   <div id="c-hg" style="display:grid;justify-items:center;gap:6px">${hourglass(0, true)}<small class="mut" id="c-pct">0% repaid</small></div></div></div>
  <div class="card"><div class="ch-h"><h2>Total cost</h2></div><div id="c-dn"></div><div class="ly-ft"><button type="button" class="btn pri full" data-act="calcApp">${ic('plus')}Start an application</button></div></div></div>
  <div class="card mt"><div class="ch-h"><div><h2>Principal and interest by year</h2><p class="mut" style="font-size:.82rem">Early years are mostly interest; the line marks where you scrubbed</p></div></div><div id="c-bars"></div></div>`;
  const run = (still) => { const n = C.years * 12, L = { amount: C.amount, rate: C.rate, term: n, start: T0, io: false }, S = sched(L), p = S[0] ? S[0].pay : 0, mo = clamp(C.month, 0, n), bal = mo ? S[mo - 1].bal : C.amount, intSoFar = sum(S.slice(0, mo), r => r.int), totInt = sum(S, r => r.int);
    $('#cr-p').textContent = money(p); $('#cr-b').textContent = money(bal); $('#cr-i').textContent = money(intSoFar); $('#co-month').textContent = 'Month ' + mo + ' · year ' + Math.ceil(mo / 12 || 0); $('#c-pct').textContent = pct((1 - bal / C.amount) * 100, 0) + ' repaid'; setGlass($('#c-hg svg'), 1 - bal / C.amount);
    const yrs = Array.from({ length: C.years }, (_, y) => S.slice(y * 12, y * 12 + 12)), el = $('#c-bars');
    CH.bar(el, { labels: yrs.map((_, y) => 'Y' + (y + 1)), series: [{ name: 'Principal', data: yrs.map(r => sum(r, x => x.prin)), color: 'var(--c1)' }, { name: 'Interest', data: yrs.map(r => sum(r, x => x.int)), color: 'var(--c2)' }], stack: true, h: 220, radius: 6, fmt: x => '$' + short(x), vfmt: money, colorFn: (i, val, x) => i < Math.ceil(mo / 12) ? null : `color-mix(in srgb, ${x.color} 45%, transparent)` }, still);
    CH.donut($('#c-dn'), { data: [{ label: 'Principal', value: C.amount, color: 'var(--c1)' }, { label: 'Interest', value: totInt, color: 'var(--c2)' }], fmt: x => money(x, { short: true }), label: 'You pay back', size: 170, thick: 24 }, still); };
  run(false); let raf = 0;
  $$('input[type=range]', v).forEach(i => { i.oninput = () => { const k = i.dataset.k; if (k) { C[k] = +i.value; $('#co-' + k).textContent = k === 'amount' ? money(C[k]) : k === 'rate' ? pct(C[k], 2) : C[k] + ' years'; if (k === 'years') { const mi = $('#c-month'); mi.max = C.years * 12; C.month = Math.min(C.month, C.years * 12); mi.value = C.month; } } else C.month = +i.value; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => run(true)); }; });
};
act('calcApp', () => { const C = App.tst.calc; App.acts.newApp(); later(30, () => { const f = $('.ly form'); if (!f) return; f.elements.amount.value = C.amount; f.elements.rate.value = C.rate; const t = C.years >= 25 ? '360' : C.years >= 8 ? '120' : C.years >= 4 ? '60' : C.years >= 2 ? '24' : '12'; f.elements.term.value = t; }); });

PG.reports = v => {
  const S = series(12);
  v.innerHTML = `<div class="g g2"><div class="card"><div class="ch-h"><h2>Interest earned</h2><span class="sp"></span><button type="button" class="btn sm ghost" data-act="csvR">${ic('download')}CSV</button></div><div id="r-int"></div></div><div class="card"><div class="ch-h"><h2>Loan book</h2><span class="sp"></span>${seg('brange', ['6M', '12M', '24M'], DB.prefs.range, 'Range')}</div><div id="r-book"></div></div>
  <div class="card"><div class="ch-h"><h2>Loan to value spread</h2></div><div id="r-ltv"></div></div><div class="card"><div class="ch-h"><h2>Lending by city</h2></div>${hbars(CITIES.map((c, i) => ({ label: c, value: sum(active().filter(L => L.city === c), balOf), color: `var(--c${i % 6 + 1})` })).sort((a, b) => b.value - a.value), x => money(x, { short: true }))}</div></div>`;
  barChart($('#r-int', v), { labels: monthsBack(12), series: [{ name: 'Interest', data: S.int, color: 'var(--c1)' }], h: 220, radius: 8, fmt: x => '$' + short(x), vfmt: money });
  const book = r => { const n = +r.replace('M', ''), s = series(n); lineChart($('#r-book', v), { labels: monthsBack(n), series: [{ name: 'Outstanding', data: s.bal, color: 'var(--c3)' }], area: true, h: 220, fmt: x => '$' + short(x), vfmt: money }); };
  book(DB.prefs.range); onSeg('brange', r => { DB.prefs.range = r; save(); book(r); });
  const bins = [[0, 50], [50, 60], [60, 70], [70, 80], [80, 101]]; barChart($('#r-ltv', v), { labels: ['< 50%', '50–60%', '60–70%', '70–80%', '80%+'], series: [{ name: 'Loans', data: bins.map(([a, b]) => active().filter(L => L.ltv >= a && L.ltv < b).length), color: 'var(--c5)' }], h: 200, radius: 10, fmt: x => num(x), colorFn: i => i === 4 ? 'var(--c2)' : null });
};
act('csvR', () => { const S = series(12), ML = monthsBack(12); download('dunecrest-interest.csv', csv(ML.map((m, i) => ({ m, due: Math.round(S.exp[i]), got: Math.round(S.got[i]), int: Math.round(S.int[i]) })), [{ k: 'm', label: 'Month' }, { k: 'due', label: 'Due' }, { k: 'got', label: 'Collected' }, { k: 'int', label: 'Interest' }])); });

PG.settings = v => {
  v.innerHTML = `<div class="g g2"><div class="card"><div class="ch-h"><h2>Lending defaults</h2></div><form class="frm" id="cfg" novalidate><div class="frm-grid">${fieldHTML({ k: 'base', label: 'Base rate (%)', type: 'number', step: '0.05' }, DB.cfg.base)}${fieldHTML({ k: 'fee', label: 'Late fee (%)', type: 'number' }, DB.cfg.fee)}${fieldHTML({ k: 'grace', label: 'Grace period (days)', type: 'number', full: true }, DB.cfg.grace)}</div><footer class="ly-ft"><span class="sp"></span><button class="btn pri" type="submit">Save defaults</button></footer></form></div>
  <div class="card"><div class="ch-h"><h2>Profile</h2></div><form class="frm" id="me" novalidate><div class="frm-grid">${fieldHTML({ k: 'name', label: 'Your name' }, DB.me.name)}${fieldHTML({ k: 'firm', label: 'Company' }, DB.me.firm)}${fieldHTML({ k: 'email', label: 'Email', type: 'email', full: true }, DB.me.email)}</div><footer class="ly-ft"><span class="sp"></span><button class="btn pri" type="submit">Save profile</button></footer></form></div>
  <div class="card"><div class="ch-h"><h2>Reminders</h2></div>${[['due', 'Payment due', 'Email borrowers 3 days before'], ['late', 'Late notice', 'Text borrowers the day after a miss'], ['weekly', 'Weekly digest', 'A Monday summary to you']].map(([k, l, s]) => `<div class="ctl"><div><b>${l}</b><small>${s}</small></div><label class="sw"><input type="checkbox" role="switch" data-act="pref" data-k="${k}" ${DB.prefs[k] ? 'checked' : ''}><span></span><span class="sr">${l}</span></label></div>`).join('')}</div>
  <div class="card"><div class="ch-h"><h2>Demo data</h2></div><p class="mut" style="font-size:.88rem">Changes stay in this browser. Reset to bring back 34 sample loans and 12 applications.</p><div class="ly-ft"><span class="sp"></span><button type="button" class="btn ghost danger" data-act="reset">${ic('refresh')}Reset demo data</button></div></div></div>`;
  const wire = (id, F, fn) => { const f = $('#' + id, v); f.onsubmit = e => { e.preventDefault(); const x = readForm(f, F), errs = {}; F.forEach(d => { const m = checkField(d, f.elements[d.k].value, x); if (m) errs[d.k] = m; }); if (showErrs(f, errs)) fn(x); }; };
  wire('cfg', [{ k: 'base', label: 'Base rate', type: 'number', req: true, min: 1, max: 30 }, { k: 'fee', label: 'Late fee', type: 'number', req: true, min: 0, max: 25 }, { k: 'grace', label: 'Grace period', type: 'number', req: true, min: 0, max: 30 }], x => { DB.cfg = x; save(); toast('Lending defaults saved'); });
  wire('me', [{ k: 'name', label: 'Name', req: true }, { k: 'firm', label: 'Company', req: true }, { k: 'email', label: 'Email', type: 'email', req: true }], x => { DB.me = x; save(); greet(); toast('Profile saved'); });
};
act('pref', el => { DB.prefs[el.dataset.k] = el.checked; save(); toast(el.closest('.ctl').querySelector('b').textContent + (el.checked ? ' on' : ' off')); });
act('reset', () => confirmDlg({ title: 'Reset demo data?', text: 'Loans, applications and borrowers go back to the sample.', ok: 'Reset', danger: true, onOk: () => { resetDB(makeDB); greet(); } }));

/* ---------- boot ---------- */
function greet() { const h = NOW.getHours(); $('#hi').textContent = `${h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}, ${DB.me.name.split(' ')[0]}`; }
App.find = q => [...DB.loans.filter(L => (L.id + ' ' + bName(L.b)).toLowerCase().includes(q)).slice(0, 5).map(L => ({ label: L.id + ' · ' + bName(L.b), icon: 'file', run: () => openLoan(L) })), ...DB.borrowers.filter(x => x.name.toLowerCase().includes(q)).slice(0, 3).map(x => ({ label: x.name + ' · borrower', icon: 'user', run: () => openBorrower(x) }))];
App.cmds = [{ label: 'New application', icon: 'plus', run: () => App.acts.newApp() }, { label: 'Add borrower', icon: 'user', run: () => App.acts.addB() }];
start({ name: 'Dunecrest', home: 'overview', routes: [
  { id: 'overview', label: 'Home', title: 'Overview', icon: 'home', render: PG.overview },
  { id: 'loans', label: 'Loans', icon: 'file', render: PG.loans },
  { id: 'applications', label: 'Pipeline', title: 'Applications', icon: 'layers', render: PG.applications },
  { id: 'borrowers', label: 'People', title: 'Borrowers', icon: 'users', render: PG.borrowers },
  { id: 'repayments', label: 'Due', title: 'Repayments', icon: 'cal', render: PG.repayments },
  { id: 'collections', label: 'Arrears', title: 'Collections', icon: 'alert', render: PG.collections },
  { id: 'calculator', label: 'Calc', title: 'Loan calculator', icon: 'clock', render: PG.calculator },
  { id: 'reports', label: 'Reports', icon: 'chart', render: PG.reports },
  { id: 'settings', label: 'Settings', icon: 'settings', render: PG.settings }] });
greet();
DB.loans.filter(L => L.late).slice(0, 2).forEach(L => notify('Payment missed', `${bName(L.b)} · ${L.id} is ${L.late} payment${L.late > 1 ? 's' : ''} behind`, 'bad'));
notify('Application received', 'AP-310 from ' + bName(DB.apps[0].b), 'info');
every(45000, () => { const L = pick(active()); if (L) notify('Payment received', `${bName(L.b)} paid ${money(payOf(L))} on ${L.id}`, 'ok'); }, true);
</script>
</body>
</html>
