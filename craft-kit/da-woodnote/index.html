<!doctype html>
<!-- Chill & Craft · Woodnote · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodnote · glass sales dashboard for a furniture workshop</title>
<script>
  // Early theme pick: ?theme= wins, then the saved choice, then the system setting
  (function () { try { var q = new URLSearchParams(location.search).get('theme'), s = JSON.parse(localStorage.getItem('da-woodnote:theme') || 'null'); document.documentElement.dataset.theme = q === 'light' || q === 'dark' ? q : s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { } })();
</script>
<style>
/* ---------- Core kit styles: base, controls, layers, table, charts, board (themed by variables) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:14px/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-h,inherit);line-height:1.2}
p{margin:0}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
h1:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--panel-solid,var(--panel));color:var(--text);font-weight:600;font-size:13px;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-2,var(--muted));box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:var(--muted);transition:background .2s,color .2s,transform .12s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:30px;height:30px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.chip{min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;flex:none;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme=dark] .av{background:hsl(var(--h) 32% 27%);color:hsl(var(--h) 70% 84%)}
.av.lg{width:52px;height:52px;font-size:17px}
.row-acts{display:inline-flex;gap:2px}
kbd{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--hover)}
/* page entrance (dashboards may set --enter to their own keyframes) */
.in{animation:var(--enter,ccRise) .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px)}}
/* layers: modal, drawer, confirm, command search */
.layer{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim,rgba(10,12,20,.48));opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(540px,100%);max-height:min(90vh,780px);display:flex;flex-direction:column;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--rl,16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(14px) scale(.97);transition:opacity .25s,transform .32s cubic-bezier(.2,.8,.2,1)}
.layer.wide .sheet{width:min(860px,100%)}
.layer.open .scrim{opacity:1}
.layer.open .sheet{opacity:1;transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sheet-h h2{font-size:17px;overflow-wrap:anywhere}
.sheet-b{padding:4px 18px 18px;overflow:auto;overscroll-behavior:contain}
.sheet-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.layer.drawer{place-items:stretch end;padding:0}
.layer.drawer .sheet{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rl,16px) 0 0 var(--rl,16px);border-right:0;transform:translateX(60px)}
.layer.drawer.wide .sheet{width:min(640px,100%)}
.layer.drawer.open .sheet{transform:none}
.confirm-m{color:var(--muted)}
.layer.cmdk{place-items:start center;padding-top:12vh}
.layer.cmdk .sheet-h{padding-bottom:4px}
.cmd-in{width:100%;height:44px;padding:0 14px;border-radius:var(--ri,10px);border:1px solid var(--line);background:var(--field,transparent);outline:none;font-size:15px}
.cmd-in:focus{border-color:var(--accent)}
.cmd-l{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.cmd-l li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.cmd-l li small{margin-left:auto;color:var(--muted);font-size:11px}
.cmd-l li[aria-selected=true]{background:var(--hover);color:var(--accent)}
.cmd-empty{color:var(--muted)}
.cmd-k{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.layer.modal{place-items:end center;padding:0}.layer.modal .sheet{border-radius:var(--rl,16px) var(--rl,16px) 0 0;width:100%;transform:translateY(40px)}.layer.modal.open .sheet{transform:none}.layer.cmdk{place-items:start center;padding:10px}}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form.shake{animation:ccShake .35s}
@keyframes ccShake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.f{display:grid;gap:5px;grid-column:1/-1;min-width:0}
.f.half{grid-column:auto}
@media (max-width:520px){.f.half{grid-column:1/-1}}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,transparent);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.f [aria-invalid=true]{border-color:var(--bad)}
.f-err{color:var(--bad);font-size:11.5px}
.f-err:empty{display:none}
.f-chk label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}
.f-chk input{width:16px;height:16px;min-height:0;accent-color:var(--accent)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:150;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(12px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:none}
.t-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;flex:none}
.toast.bad .t-ic{background:var(--bad)}
.toast.warn .t-ic{background:var(--warn)}
.t-ic .ic{width:13px;height:13px}
.t-a{margin-left:auto;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0 0 0 8px}
/* tooltip */
#tip{position:fixed;left:0;top:0;z-index:160;pointer-events:none;padding:8px 10px;border-radius:9px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:12px;line-height:1.5;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:240px}
#tip.on{opacity:1;transform:none}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* popovers, menus, notifications */
.pop{position:fixed;z-index:120;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.4);padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.pop.on{opacity:1;transform:none}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:disabled{opacity:.45;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .sw{width:9px;height:9px;border-radius:3px;flex:none}
.menu-t{font-size:11px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.notes{width:min(320px,calc(100vw - 30px))}
.notes-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px}
.notes ul{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:9px;font-size:13px;color:var(--muted)}
.notes li .ic{margin-top:2px}
.notes li span{display:grid}
.notes li small{font-size:11px;opacity:.8}
.notes li.unread{color:var(--text);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.n-empty{justify-content:center}
[data-bell]{position:relative}
[data-bell][data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPing .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ccPing{from{transform:scale(0)}}
/* segmented control */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--rs,10px);background:var(--hover);gap:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);border-radius:calc(var(--rs,10px) - 2px);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--text)}
.seg-i{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:calc(var(--rs,10px) - 2px);background:var(--panel-solid,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s}
/* table */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.srch{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:var(--ri,9px);background:var(--field,transparent);color:var(--muted);flex:1 1 200px;max-width:340px;transition:border-color .2s,box-shadow .2s}
.srch input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--text);padding:6px 0}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:var(--tbl-min,640px)}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.th-b{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.si::after{content:"\2195";opacity:.35;font-size:11px}
th[aria-sort=ascending] .si::after{content:"\2191";opacity:1;color:var(--accent)}
th[aria-sort=descending] .si::after{content:"\2193";opacity:1;color:var(--accent)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{animation:ccRow .35s backwards;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes ccRow{from{opacity:0;transform:translateY(6px)}}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover{background:var(--hover)}
.tbl tr.click:focus-visible{outline-offset:-2px}
.cell-u{display:flex;align-items:center;gap:10px;min-width:0}
.cell-u b{display:block;font-weight:600}
.cell-u small{display:block;color:var(--muted);font-size:11.5px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pg-b{display:flex;gap:4px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);display:inline-grid;place-items:center;font-size:12px;transition:background .2s,transform .12s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current=page]{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{display:grid;justify-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty b{color:var(--text)}
/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid,var(--line));stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font,system-ui,sans-serif)}
.chart .xh{stroke:var(--muted);stroke-dasharray:3 3;opacity:.7}
.chart .dot{stroke:var(--panel-solid,var(--panel));stroke-width:2.5}
.chart .bcol{transition:opacity .2s}
.chart .bcol.dim{opacity:.4}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,.05,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.fade{animation:ccFade 1s .35s backwards}
@keyframes ccFade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.growx{transform-origin:0 50%;animation:ccGrowX .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrowX{from{transform:scaleX(0)}}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px}
.nodata{display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:13px;text-align:center}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-v{position:relative;width:var(--ds,160px);max-width:100%;flex:none}
.donut-t{stroke:var(--hover)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;display:block;line-height:1.1}
.donut-c span{font-size:11px;color:var(--muted)}
.donut .seg{transition:stroke-dasharray 1.1s cubic-bezier(.3,.7,.2,1),stroke-width .2s;cursor:pointer}
.donut .seg.on{stroke-width:15}
.dl{display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl-r{display:grid;grid-template-columns:10px 1fr auto 38px;gap:8px;align-items:center;cursor:default}
.dl-r i{width:10px;height:10px;border-radius:3px}
.dl-r small{color:var(--muted);text-align:right}
.gauge{position:relative;max-width:260px;margin:0 auto}
.g-track{stroke:var(--hover)}
.g-val{transition:stroke-dasharray 1.3s cubic-bezier(.3,.7,.2,1)}
.g-c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.g-c b{display:block;font-size:22px;line-height:1.1}
.g-c span{font-size:11px;color:var(--muted)}
.hb{display:grid;gap:11px}
.hb-t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.hb-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:inherit}
.hm{display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.hm-x{text-align:center}
.hm-y{padding-right:6px;white-space:nowrap}
.hm-c{height:20px;border-radius:4px;background:var(--hm,var(--accent));opacity:calc(.08 + var(--a) * .92);transition:transform .15s}
.hm-c:hover{transform:scale(1.15)}
.pop-in{animation:ccPop .5s backwards;animation-delay:calc(var(--j) * 22ms)}
@keyframes ccPop{from{opacity:0;transform:scale(.4)}}
.fn{display:grid;gap:9px}
.fn-r{display:grid;gap:3px}
.fn-r small{font-size:11px;color:var(--muted)}
.fn-bar{width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs,9px);color:#fff;font-size:12.5px;min-width:0;overflow:hidden;white-space:nowrap}
.fn-bar span{overflow:hidden;text-overflow:ellipsis}
.wipe{animation:ccWipe 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes ccWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.spark{min-width:60px}
/* board */
.board{display:grid;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start;scrollbar-width:thin}
.board-y{grid-auto-flow:column;grid-auto-columns:minmax(min(262px,82vw),1fr)}
.board-x{grid-auto-flow:row}
.lane{min-width:0;display:flex;flex-direction:column;transition:background .2s,box-shadow .2s}
.lane-l{display:grid;gap:10px;min-height:84px;align-content:start;padding:2px}
.board-x .lane-l{grid-auto-flow:column;grid-auto-columns:minmax(220px,240px);overflow-x:auto;align-content:stretch;padding-bottom:6px}
.dcard{position:relative;user-select:none;-webkit-user-select:none;cursor:grab;transition:box-shadow .2s,transform .2s,opacity .2s}
.dcard:active{cursor:grabbing}
.dmove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:0;background:var(--hover);color:var(--muted);opacity:0;touch-action:none;cursor:grab;transition:opacity .2s,background .2s}
.dcard:hover .dmove,.dcard:focus-within .dmove,.dmove[aria-expanded=true]{opacity:1}
@media (hover:none){.dmove{opacity:1}}
.dsrc{opacity:.3;outline:2px dashed var(--lc,var(--accent));outline-offset:-2px}
.dghost{position:fixed!important;z-index:140;pointer-events:none;margin:0;box-shadow:0 26px 50px -14px rgba(0,0,0,.45);transform:rotate(var(--tilt,2.5deg)) scale(1.04);transition:transform .2s}
.dghost.drop{transform:none;transition:translate .18s ease-out,transform .18s}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.lane.over{background:color-mix(in srgb,var(--lc,var(--accent)) 10%,transparent)}
.lane-empty{display:grid;place-items:center;min-height:72px;border:1.5px dashed var(--line);border-radius:var(--rm,12px);color:var(--muted);font-size:12px;padding:8px;text-align:center}
.burst{position:fixed;inset:0;width:100vw;height:100vh;z-index:170;pointer-events:none}
/* reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
/* ================= Woodnote look: warm sand glass over walnut and amber light ================= */
:root{--font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;--font-h:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--bg:#efe2cf;--glass:rgba(255,249,240,.56);--glass-2:rgba(255,249,240,.78);--panel:var(--glass);--panel-solid:#fbf4ea;--text:#3a2416;--muted:#8a6a52;--line:rgba(120,80,45,.18);--line-2:rgba(120,80,45,.38);--hover:rgba(140,90,50,.09);--field:rgba(255,255,255,.6);--accent:#a8562a;--on-accent:#fff8ef;--ok:#4f8a52;--warn:#c58316;--bad:#bf3f2c;--c1:#a8562a;--c2:#5f8a6c;--c3:#d39a3c;--c4:#4f6fa3;--c5:#8a5a9e;--c6:#b9a089;--tip-bg:#3a2416;--tip-text:#fff3e3;--rl:22px;--rb:12px;--ri:11px;--rs:12px;--rm:14px;--enter:wnIn;--b1:#f0b76c;--b2:#9a5a33;--b3:#f6d9b0;--b4:#c97b47;--tag:#f5e3c8;--tag2:#ead2ad;--grain:rgba(120,70,30,.10)}
[data-theme=dark]{--bg:#1a120c;--glass:rgba(42,29,20,.52);--glass-2:rgba(48,33,23,.82);--panel-solid:#2a1d14;--text:#f6e8d6;--muted:#c09c7e;--line:rgba(255,214,170,.12);--line-2:rgba(255,214,170,.28);--hover:rgba(255,214,170,.08);--field:rgba(0,0,0,.22);--accent:#e9a15c;--on-accent:#2a1a0f;--ok:#8fc48f;--warn:#f0b54b;--bad:#ff8a6e;--c1:#e9a15c;--c2:#8dc0a0;--c3:#f3c66e;--c4:#8fb0e6;--c5:#c9a0dc;--c6:#8a7362;--tip-bg:#f6e8d6;--tip-text:#2a1a0f;--b1:#7a3f17;--b2:#3b2214;--b3:#a2622e;--b4:#5d3218;--tag:#4a3222;--tag2:#3e2a1c;--grain:rgba(255,200,150,.07)}
@keyframes wnIn{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(6px)}}
body{background:var(--bg);overflow-x:hidden}
/* drawn backdrop: soft light blobs + wood grain lines (parallax follows the pointer) */
.bgx{position:fixed;inset:-40px;z-index:0;pointer-events:none;overflow:hidden}
.bgx i{position:absolute;border-radius:50%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.bgx .b1{width:60vmax;height:60vmax;left:-14vmax;top:-20vmax;background:radial-gradient(circle,var(--b1) 0,transparent 66%);transform:translate(calc(var(--px,0) * 30px),calc(var(--py,0) * 20px))}
.bgx .b2{width:55vmax;height:55vmax;right:-18vmax;bottom:-22vmax;background:radial-gradient(circle,var(--b2) 0,transparent 64%);opacity:.75;transform:translate(calc(var(--px,0) * -40px),calc(var(--py,0) * -26px))}
.bgx .b3{width:38vmax;height:38vmax;left:38%;top:18%;background:radial-gradient(circle,var(--b3) 0,transparent 62%);opacity:.8;transform:translate(calc(var(--px,0) * 18px),calc(var(--py,0) * 30px))}
.bgx .b4{width:30vmax;height:30vmax;left:8%;bottom:-6vmax;background:radial-gradient(circle,var(--b4) 0,transparent 60%);opacity:.5}
.grain{position:absolute;inset:0;width:100%;height:100%}
.grain path{fill:none;stroke:var(--grain);stroke-width:1.4}
/* glass helper */
.glass,.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.35);backdrop-filter:blur(20px) saturate(1.35);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 24px 48px -30px rgba(70,35,10,.55)}
[data-theme=dark] .glass,[data-theme=dark] .card{box-shadow:inset 0 1px 0 rgba(255,220,180,.12),0 24px 48px -28px rgba(0,0,0,.7)}
/* floating icon rail */
.rail{position:fixed;left:16px;top:16px;bottom:16px;z-index:50;width:76px;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:linear-gradient(150deg,#c4743d,#7a3f1d);box-shadow:0 8px 20px -8px rgba(122,63,29,.8)}
nav[data-nav]{position:relative;display:flex;flex-direction:column;gap:6px;margin-top:6px}
nav[data-nav] a{position:relative;z-index:1;display:grid;place-items:center;width:48px;height:48px;border-radius:16px;color:var(--muted);transition:color .25s}
nav[data-nav] a:hover,nav[data-nav] a[aria-current=page]{color:var(--text)}
nav[data-nav] a[aria-current=page]{color:var(--on-accent)}
nav[data-nav] .lbl{position:absolute;left:62px;top:50%;transform:translate(-6px,-50%);padding:6px 10px;border-radius:9px;background:var(--tip-bg);color:var(--tip-text);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
nav[data-nav] a:hover .lbl,nav[data-nav] a:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
.rail-mk{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:16px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#5a2a10));box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent);opacity:0;transition:transform .55s cubic-bezier(.34,1.4,.5,1),width .3s,height .3s}
.rail-foot{margin-top:auto}
/* main column */
.wrap{position:relative;z-index:1;margin-left:108px;min-height:100vh;overflow-x:clip}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px 8px 8px}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h2{font-family:var(--font-h);font-size:15px;font-weight:600}
.srch-b{margin-left:auto;display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border-radius:14px;color:var(--muted);font-size:13px;min-width:220px;text-align:left}
.srch-b kbd{margin-left:auto;background:transparent}
.top .icon-btn{width:42px;height:42px;border-radius:14px}
main{padding:10px 28px 48px 8px}
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}
.page-h h1{font-family:var(--font-h);font-size:36px;font-weight:600;letter-spacing:-.01em}
.page-h h1 em{font-style:italic;color:var(--accent)}
.page-h p{color:var(--muted);margin-top:4px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
/* cards: glass with a light that follows the pointer (signature) */
.card{position:relative;border-radius:var(--rl);padding:20px;min-width:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card>*{position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,-40%),rgba(255,236,205,.55),transparent 65%);opacity:0;transition:opacity .35s}
[data-theme=dark] .card::before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,-40%),rgba(255,190,120,.16),transparent 65%)}
.card:hover{transform:translateY(-3px)}
.card:hover::before{opacity:1}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-family:var(--font-h);font-size:19px;font-weight:600}
.btn{border-color:var(--line-2);background:var(--glass-2);border-radius:999px}
.btn.primary{background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#4a200a));border-color:transparent;box-shadow:0 10px 22px -12px color-mix(in srgb,var(--accent) 80%,transparent)}
.chip{background:var(--glass-2);border-color:var(--line-2)}
.seg{background:var(--glass-2);border:1px solid var(--line)}
.seg-i{background:var(--accent);box-shadow:0 6px 14px -6px var(--accent)}
.seg button[aria-pressed=true]{color:var(--on-accent)}
.sheet,.pop{background:var(--glass-2);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border-color:var(--line-2)}
.layer.drawer .sheet{border-radius:28px 0 0 28px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
/* KPI tiles */
.kpi{display:grid;gap:4px}
.kpi .k-t{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .k-t .ic{color:var(--accent)}
.kpi b{font-family:var(--font-h);font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.kpi small .up{color:var(--ok);font-weight:700}
/* segments */
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.sg{display:grid;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.sg .sg-i{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--sc) 22%,transparent);color:var(--sc)}
.sg b{font-family:var(--font-h);font-size:24px;font-weight:600}
.sg span{color:var(--muted);font-size:12px}
.sg[aria-pressed=true]{outline:2px solid var(--sc);outline-offset:2px}
.sgdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:6px}
/* deal board: hanging wooden tags in glass trays */
.lane{border-radius:24px;padding:14px 12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2)}
.lane-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 12px;border-bottom:1px dashed var(--line-2);margin-bottom:14px}
.lane-h b{font-family:var(--font-h);font-size:17px;font-weight:600}
.lane-h .cnt{font-size:12px;color:var(--muted)}
.lane-h small{margin-left:auto;font-weight:700;color:var(--accent);font-size:12.5px}
.lane-l{gap:16px;padding-top:6px}
.dcard{border-radius:16px 16px 18px 18px;padding:22px 14px 12px;background:repeating-linear-gradient(97deg,transparent 0 9px,var(--grain) 9px 10px,transparent 10px 23px),linear-gradient(170deg,var(--tag),var(--tag2));border:1px solid var(--line-2);box-shadow:0 10px 20px -14px rgba(70,35,10,.6);display:grid;gap:6px;transform-origin:50% -10px}
.dcard::before{content:"";position:absolute;left:50%;top:8px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.dcard::after{content:"";position:absolute;left:50%;top:-14px;width:1.5px;height:24px;background:linear-gradient(var(--muted),transparent);opacity:.5}
.dcard:hover{animation:wnSwing 1.1s ease-in-out}
@keyframes wnSwing{20%{transform:rotate(2.2deg)}45%{transform:rotate(-1.6deg)}70%{transform:rotate(.8deg)}}
.dcard .sgtag{justify-self:start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc)}
.dcard b{font-family:var(--font-h);font-size:15.5px;font-weight:600;line-height:1.2}
.dcard .who{font-size:12px;color:var(--muted)}
.dcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.dcard .amt{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.dcard .wood{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dcard .wood i{width:12px;height:12px;border-radius:4px;background:var(--wc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dmove{top:auto;bottom:10px;right:10px;background:rgba(255,255,255,.35);display:none}
.dcard:hover .dmove,.dcard:focus-within .dmove{display:grid}
@media (hover:none){.dmove{display:grid}}
.dghost{--tilt:5deg;transform-origin:50% -10px}
@media (prefers-reduced-motion:no-preference){.dghost{animation:wnSwing 1s ease-in-out infinite}}
.lane.over{background:color-mix(in srgb,var(--accent) 16%,var(--glass))}
/* workshop line (live) */
.line-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stations{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.station{border-radius:20px;padding:12px;min-height:280px;display:flex;flex-direction:column;gap:8px}
.station h3{font-family:var(--font-h);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.station h3 small{font-family:var(--font);font-size:11px;color:var(--muted);font-weight:600}
.tok{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;align-items:center;padding:9px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line);text-align:left;font:inherit;color:inherit;width:100%;transition:transform .2s,box-shadow .2s}
.tok:hover{transform:translateY(-2px);box-shadow:0 10px 18px -12px rgba(70,35,10,.6)}
.tok.arrive{animation:wnArrive .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes wnArrive{from{opacity:0;transform:translateX(-30px) scale(.9)}}
.tok svg.ring{grid-row:span 2}
.tok b{font-size:12.5px;line-height:1.2}
.tok small{font-size:11px;color:var(--muted)}
.ring circle{fill:none;stroke-width:4}
.ring .rt{stroke:var(--line-2)}
.ring .rv{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .8s}
/* catalog */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
.prod{display:grid;gap:8px}
.prod .art{height:118px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--wc) 35%,var(--tag)),var(--tag2));color:var(--wc)}
.prod .art svg{width:96px;height:72px;filter:drop-shadow(0 6px 8px rgba(60,30,10,.25));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.prod:hover .art svg{transform:translateY(-4px) scale(1.05)}
.prod h3{font-family:var(--font-h);font-size:17px;font-weight:600}
.prod .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.prod .price{font-weight:800;color:var(--text);font-size:15px}
.prod .acts{display:flex;gap:6px}
/* drawer bits */
.dd-big{font-family:var(--font-h);font-size:30px;font-weight:600;display:block;margin:2px 0 12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.kv dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:600}
.steps{display:flex;gap:4px;margin:6px 0 16px;flex-wrap:wrap}
.steps span{flex:1 1 60px;text-align:center;font-size:11px;font-weight:600;padding:6px 2px;border-radius:9px;background:var(--hover);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--on-accent)}
.steps span.done{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--text)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block}.set-row small{color:var(--muted);font-size:12px}
.tg{position:relative;width:46px;height:26px;border-radius:99px;border:1px solid var(--line-2);background:var(--hover);padding:0;flex:none;transition:background .3s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--panel-solid);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tg[aria-checked=true]{background:var(--accent)}
.tg[aria-checked=true]::after{transform:translateX(20px)}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mini li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.mini .bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--hover);overflow:hidden}
.mini .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c3),var(--accent));transition:width 1s}
.mini button{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
/* responsive: rail becomes a floating bottom dock */
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2{grid-template-columns:minmax(0,1fr)}.segs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .rail{top:auto;left:10px;right:10px;bottom:10px;width:auto;height:66px;flex-direction:row;padding:0 8px;border-radius:24px;justify-content:center}
  .rail .logo,.rail-foot{display:none}
  nav[data-nav]{flex-direction:row;margin:0;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
  nav[data-nav] a{width:44px;height:48px;flex:none}
  nav[data-nav] .lbl{display:none}
  .rail-mk{width:44px}
  .wrap{margin-left:0}
  .top{padding:12px 16px 4px}
  .srch-b{min-width:0;width:42px;padding:0;justify-content:center}
  .srch-b span,.srch-b kbd{display:none}
  main{padding:8px 16px 100px}
  .page-h h1{font-size:30px}
}
@media (max-width:560px){.top .btn .lbl,.top .kick{display:none}.kv{grid-template-columns:1fr}.card{padding:16px}.segs{gap:10px}.kpi b{font-size:24px}}
@media (max-width:400px){.g-kpi,.segs{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="bgx" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><svg class="grain" id="grain" preserveAspectRatio="none" viewBox="0 0 1000 1000"></svg></div>
<!-- Floating glass rail: logo, icon navigation with a sliding disc -->
<aside class="rail glass" aria-label="Sidebar">
  <a class="logo" href="#/overview" aria-label="Woodnote home"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 20c2-9 6-14 14-15-2 4-2 7 0 9-4 0-7 2-9 6" fill="#fff6ea"/><path d="M5 20c3-3 6-5 10-6" stroke="#7a3f1d" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></a>
  <nav data-nav aria-label="Main">
    <span class="rail-mk" aria-hidden="true"></span>
    <a href="#/overview" aria-label="Overview">__I_home__<span class="lbl">Overview</span></a>
    <a href="#/deals" aria-label="Deal board">__I_board__<span class="lbl">Deal board</span></a>
    <a href="#/orders" aria-label="Orders">__I_receipt__<span class="lbl">Orders</span></a>
    <a href="#/customers" aria-label="Customers">__I_users__<span class="lbl">Customers</span></a>
    <a href="#/workshop" aria-label="Workshop">__I_zap__<span class="lbl">Workshop line</span></a>
    <a href="#/catalog" aria-label="Catalog">__I_box__<span class="lbl">Catalog</span></a>
    <a href="#/reports" aria-label="Reports">__I_pie__<span class="lbl">Reports</span></a>
    <a href="#/settings" aria-label="Settings">__I_sliders__<span class="lbl">Settings</span></a>
  </nav>
  <div class="rail-foot">__AV__</div>
</aside>
<div class="wrap">
  <header class="top">
    <div><p class="kick">Woodnote Atelier · Lahore</p><h2 id="topTitle">Overview</h2></div>
    <button type="button" class="srch-b glass" data-cmdk aria-label="Search (Ctrl K)">__I_search__<span>Search orders, people…</span><kbd>Ctrl K</kbd></button>
    <button type="button" class="icon-btn glass" data-bell aria-haspopup="true" aria-expanded="false" aria-label="Notifications">__I_bell__</button>
    <button type="button" class="icon-btn glass" data-theme-toggle aria-label="Toggle theme"></button>
    <button type="button" class="btn primary" id="qDeal">__I_plus__<span class="lbl">New enquiry</span></button>
  </header>
  <main id="main" data-outlet tabindex="-1"></main>
</div>
<script>
/* ================= Core kit: router, charts, table, board, modal, toast =================
   Small helpers shared by this dashboard. Everything below is plain JS, no libraries. */
'use strict';

// ---------- 1. Tiny DOM + math helpers ----------

// ---------- Page: Orders ----------
function openOrder(o) {
  const D = drawer(o.no + ' · ' + o.item, `<span class="pill">${esc(o.seg)}</span><b class="dd-big">${fmt.money(o.amount)}</b><div class="steps">${[...STATIONS, 'Delivered'].map((s, k) => `<span class="${k < o.station ? 'done' : k === o.station ? 'on' : ''}">${esc(s)}</span>`).join('')}</div><dl class="kv"><div><dt>Customer</dt><dd>${esc(o.cust)}</dd></div><div><dt>Wood</dt><dd><span class="sgdot" style="--sc:${WC[o.wood]}"></span>${esc(o.wood)}</dd></div><div><dt>Placed</dt><dd>${fmt.dateY(o.placed)}</dd></div><div><dt>Due</dt><dd>${fmt.dateY(o.due)}</dd></div></dl><button type="button" class="btn" data-adv${o.station >= 6 ? ' disabled' : ''}>${ic('arrow', 16)} Move to next station</button>`, `<button type="button" class="btn ghost" data-del>${ic('trash', 16)} Delete</button><button type="button" class="btn primary" data-edit>${ic('edit', 16)} Edit</button>`);
  $('[data-adv]', D.el).onclick = () => { o.station = Math.min(6, o.station + 1); o.progress = 0; save(); D.close(); toast(`${o.no} moved to ${statusOf(o)}`); APP.refresh(); };
  $('[data-edit]', D.el).onclick = () => { D.close(); form({ title: 'Edit ' + o.no, fields: orderFields(), values: o, onSubmit: v => { Object.assign(o, v); save(); toast('Order saved'); APP.refresh(); } }); };
  $('[data-del]', D.el).onclick = () => { D.close(); ask(`Delete order ${o.no}?`).then(ok => { if (!ok) return; const i = DB.orders.indexOf(o); DB.orders.splice(i, 1); save(); APP.refresh(); toast('Order deleted', 'ok', { label: 'Undo', run: () => { DB.orders.splice(i, 0, o); save(); APP.refresh(); } }); }); };
}
const orderFields = () => [{ name: 'item', label: 'Item', required: true }, { name: 'cust', label: 'Customer', type: 'select', options: DB.cust.map(c => c.name), half: true }, { name: 'seg', label: 'Segment', type: 'select', options: SEGS.map(s => s.id), half: true }, { name: 'wood', label: 'Wood', type: 'select', options: WOODS.map(w => w.n), half: true }, { name: 'amount', label: 'Amount (Rs)', type: 'number', min: 1000, required: true, half: true }, { name: 'due', label: 'Due date', type: 'date', required: true, half: true }, { name: 'kind', label: 'Piece type', type: 'select', options: Object.keys(ART), half: true }];
function pOrders(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Orders</h1><p>Every confirmed piece, from cutting to the delivery van.</p></div><div class="ph-a"><button type="button" class="btn primary" data-add>${ic('plus', 16)} New order</button></div></div><section class="card" data-in><div id="ot"></div></section>`;
  const T = table($('#ot', out), {
    id: 'wn-orders', rows: () => DB.orders.map(o => Object.assign(o, { status: statusOf(o) })), ph: 'Search orders…', search: ['no', 'cust', 'item', 'wood'], sort: 'placed', dir: -1, min: 860,
    chips: { k: 'status', label: 'Status', options: [...STATIONS, 'Delivered'] },
    cols: [{ k: 'no', label: 'Order', render: o => `<b>${esc(o.no)}</b>` }, { k: 'item', label: 'Piece', render: o => `<div class="cell-u"><span style="color:${WC[o.wood]};width:40px;display:inline-grid">${art(o.kind, 'width="40" height="30"')}</span><div><b>${esc(o.item)}</b><small>${esc(o.wood)}</small></div></div>` }, { k: 'cust', label: 'Customer', render: o => `${esc(o.cust)}<br><small class="muted"><span class="sgdot" style="--sc:${SEGC[o.seg]}"></span>${esc(o.seg)}</small>` }, { k: 'amount', label: 'Amount', num: true, render: o => fmt.money(o.amount) }, { k: 'status', label: 'Status', render: o => pill(o.status, o.station >= 6 ? 'ok' : o.station >= 4 ? 'acc' : '') }, { k: 'due', label: 'Due', render: o => `<span class="${o.station < 6 && o.due < TODAY ? 'muted' : ''}" style="${o.station < 6 && o.due < TODAY ? 'color:var(--bad);font-weight:700' : ''}">${fmt.date(o.due)}</span>` }],
    onRow: openOrder
  });
  $('[data-add]', out).onclick = () => form({ title: 'New order', submit: 'Create order', fields: orderFields(), values: { seg: 'Walk-in', wood: 'Sheesham', due: TODAY + 21 * DAY, kind: 'Table', cust: DB.cust[0].name }, onSubmit: v => { DB.orders.unshift(Object.assign({ id: uid('o'), no: 'WN-' + (2410 + DB.orders.length + 1), station: 0, progress: 0, placed: Date.now() }, v)); save(); toast('Order created'); T.draw(); } });
}

// ---------- Page: Customers ----------
function pCustomers(out) {
  const segTot = SEGS.map(s => DB.cust.filter(c => c.seg === s.id)), all = sum(DB.cust.map(c => c.spent)) || 1;
  out.innerHTML = `<div class="page-h"><div><h1>Customers</h1><p>Designers, hotels, shops and walk-in buyers. Tap a type to filter.</p></div><div class="ph-a"><button type="button" class="btn primary" data-add>${ic('plus', 16)} Add customer</button></div></div>
  <div class="segs">${SEGS.map((s, k) => `<button type="button" class="card sg" data-sg="${s.id}" aria-pressed="${ST.cseg === s.id}" style="--sc:${s.color}"><span class="sg-i">${ic(s.icon, 20)}</span><b>${Math.round(sum(segTot[k].map(c => c.spent)) / all * 100)}%</b><span>${s.id} · ${segTot[k].length} customers</span></button>`).join('')}</div>
  <section class="card"><div id="ct"></div></section>`;
  const fields = [{ name: 'name', label: 'Name', required: true }, { name: 'seg', label: 'Type', type: 'select', options: SEGS.map(s => s.id), half: true }, { name: 'city', label: 'City', type: 'select', options: CITIES, half: true }, { name: 'phone', label: 'Phone', type: 'tel', required: true, half: true }];
  const C = crud($('#ct', out), {
    id: 'wn-cust', list: () => DB.cust, rows: () => DB.cust.filter(c => ST.cseg === 'all' || c.seg === ST.cseg), fields, addLabel: 'Add customer', ph: 'Search customers…', search: ['name', 'city', 'seg'], sort: 'spent', dir: -1, min: 700,
    make: (v, old) => Object.assign({ spent: old ? old.spent : 0, since: old ? old.since : Date.now() }, v),
    cols: [{ k: 'name', label: 'Customer', render: c => `<div class="cell-u">${avatar(c.name)}<div><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div></div>` }, { k: 'seg', label: 'Type', render: c => `<span class="sgdot" style="--sc:${SEGC[c.seg]}"></span>${esc(c.seg)}` }, { k: 'city', label: 'City' }, { k: 'spent', label: 'Spent', num: true, render: c => fmt.money(c.spent) }, { k: 'since', label: 'Customer since', render: c => fmt.dateY(c.since) }, { k: 'x', label: '', sort: false, render: rowActs }],
    detail: c => { const os = DB.orders.filter(o => o.cust === c.name); return `<span class="pill">${esc(c.seg)} · ${esc(c.city)}</span><b class="dd-big">${fmt.money(c.spent)}</b><dl class="kv"><div><dt>Phone</dt><dd>${esc(c.phone)}</dd></div><div><dt>Since</dt><dd>${fmt.dateY(c.since)}</dd></div></dl><h3 class="card-h" style="font-family:var(--font-h)">Orders (${os.length})</h3><ul class="mini">${os.map(o => `<li><span><b>${esc(o.item)}</b> <span class="muted">· ${esc(o.no)}</span></span><span>${fmt.mshort(o.amount)}</span></li>`).join('') || '<li class="muted">No orders yet.</li>'}</ul>`; },
    onChange: () => { save(); APP.refresh(); }
  });
  $('[data-add]', out).onclick = C.add;
  out.addEventListener('click', e => { const b = e.target.closest('[data-sg]'); if (!b) return; ST.cseg = ST.cseg === b.dataset.sg ? 'all' : b.dataset.sg; $$('[data-sg]', out).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.sg === ST.cseg))); C.T.draw(); toast(ST.cseg === 'all' ? 'Showing every customer' : 'Showing ' + ST.cseg + ' customers'); });
}

// ---------- Page: Workshop line (live: pieces move between stations) ----------
function pWorkshop(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Workshop <em>line</em></h1><p>Live view of the floor. Pieces advance on their own; tap one to see it or rush it.</p></div><div class="ph-a line-ctl"><span class="pill ok" id="lnState" aria-live="polite">● running</span><button type="button" class="btn" data-run>${ic('pause', 16)} Pause</button></div></div><div class="stations" id="stn" data-in></div>`;
  const ring = p => { const c = 2 * Math.PI * 12; return `<svg class="ring" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle class="rt" cx="15" cy="15" r="12"/><circle class="rv" cx="15" cy="15" r="12" stroke-dasharray="${(p / 100 * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 15 15)"/></svg>`; };
  const draw = arrived => {
    $('#stn', out).innerHTML = STATIONS.map((s, k) => { const L = DB.orders.filter(o => o.station === k); return `<section class="station glass" aria-label="${s}"><h3>${s}<small>${L.length}</small></h3>${L.map(o => `<button type="button" class="tok${o.id === arrived ? ' arrive' : ''}" data-o="${o.id}">${ring(o.progress)}<b>${esc(o.item)}</b><small>${esc(o.no)} · ${fmt.date(o.due)}</small></button>`).join('') || '<p class="muted" style="font-size:12px">Station is free.</p>'}</section>`; }).join('');
  };
  draw();
  const tick = () => {
    if (!ST.running) return;
    const live = DB.orders.filter(o => o.station < 6); if (!live.length) return;
    const o = live[Math.floor(Math.random() * live.length)]; o.progress += 20 + Math.floor(Math.random() * 30);
    if (o.progress >= 100) { o.progress = 0; o.station++; if (o.station === 6) note(`${o.no} for ${o.cust} is ready to deliver`, 'info', true); draw(o.id); }
    else { const t = $(`[data-o="${o.id}"] .rv`, out); if (t) { const c = 2 * Math.PI * 12; t.setAttribute('stroke-dasharray', `${(o.progress / 100 * c).toFixed(1)} ${c.toFixed(1)}`); } }
    save();
  };
  pageEvery(1600, tick);
  out.addEventListener('click', e => {
    const r = e.target.closest('[data-run]'), t = e.target.closest('[data-o]');
    if (r) { ST.running = !ST.running; r.innerHTML = ST.running ? ic('pause', 16) + ' Pause' : ic('play', 16) + ' Resume'; $('#lnState', out).textContent = ST.running ? '● running' : '❚❚ paused'; $('#lnState', out).className = 'pill ' + (ST.running ? 'ok' : 'warn'); toast(ST.running ? 'Line running' : 'Line paused'); }
    else if (t) { const o = DB.orders.find(x => x.id === t.dataset.o); const D = drawer(o.no, `<b class="dd-big">${esc(o.item)}</b><p class="muted">${esc(o.cust)} · ${esc(o.wood)} · due ${fmt.dateY(o.due)}</p><div class="steps">${STATIONS.map((s, k) => `<span class="${k < o.station ? 'done' : k === o.station ? 'on' : ''}">${s}</span>`).join('')}</div><p>Progress at <b>${STATIONS[o.station]}</b>: ${o.progress}%</p>`, `<button type="button" class="btn ghost" data-x>Close</button><button type="button" class="btn primary" data-rush>${ic('zap', 16)} Rush to next station</button>`); $('[data-rush]', D.el).onclick = () => { o.station = Math.min(6, o.station + 1); o.progress = 0; save(); D.close(); draw(o.id); toast(`${o.no} rushed to ${statusOf(o)}`); }; }
  });
}

// ---------- Page: Catalog ----------
const prodFields = () => [{ name: 'name', label: 'Piece name', required: true }, { name: 'kind', label: 'Shape', type: 'select', options: Object.keys(ART), half: true }, { name: 'wood', label: 'Default wood', type: 'select', options: WOODS.map(w => w.n), half: true }, { name: 'price', label: 'Price (Rs)', type: 'number', min: 1000, required: true, half: true }, { name: 'cost', label: 'Cost (Rs)', type: 'number', min: 0, required: true, half: true, check: (v, all) => v > all.price ? 'Cost is above the price.' : '' }, { name: 'lead', label: 'Lead time (days)', type: 'number', min: 1, max: 120, required: true, half: true }];
function pCatalog(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Catalog</h1><p>Pieces the workshop makes, with price, margin and lead time.</p></div><div class="ph-a"><button type="button" class="btn primary" data-add>${ic('plus', 16)} Add piece</button></div></div><div class="cat" id="cat"></div>`;
  const draw = () => { $('#cat', out).innerHTML = DB.prods.map((p, i) => `<article class="card prod in" style="--i:${Math.min(i, 10)};--wc:${WC[p.wood]}"><div class="art">${art(p.kind)}</div><h3>${esc(p.name)}</h3><div class="meta"><span><span class="sgdot" style="--sc:${WC[p.wood]}"></span>${esc(p.wood)} · ${p.lead} days</span><span class="price">${fmt.money(p.price)}</span></div><div class="meta"><span>Margin ${Math.round((p.price - p.cost) / p.price * 100)}%</span><span class="acts"><button type="button" class="icon-btn sm" data-ed="${p.id}" aria-label="Edit ${esc(p.name)}">${ic('edit', 15)}</button><button type="button" class="icon-btn sm" data-rm="${p.id}" aria-label="Delete ${esc(p.name)}">${ic('trash', 15)}</button></span></div></article>`).join('') || `<div class="card empty" style="grid-column:1/-1">${ic('box', 24)}<b>No pieces yet</b><span>Add your first piece.</span></div>`; };
  draw();
  out.addEventListener('click', e => {
    const ed = e.target.closest('[data-ed]'), rm = e.target.closest('[data-rm]');
    if (e.target.closest('[data-add]')) form({ title: 'Add piece', submit: 'Add piece', fields: prodFields(), values: { kind: 'Table', wood: 'Sheesham', lead: 14 }, onSubmit: v => { DB.prods.push(Object.assign({ id: uid('p') }, v)); save(); toast(`${v.name} added`); draw(); } });
    else if (ed) { const p = DB.prods.find(x => x.id === ed.dataset.ed); form({ title: 'Edit ' + p.name, fields: prodFields(), values: p, onSubmit: v => { Object.assign(p, v); save(); toast('Piece saved'); draw(); } }); }
    else if (rm) { const p = DB.prods.find(x => x.id === rm.dataset.rm); ask(`Remove ${p.name} from the catalog?`).then(ok => { if (!ok) return; const i = DB.prods.indexOf(p); DB.prods.splice(i, 1); save(); draw(); toast('Piece removed', 'ok', { label: 'Undo', run: () => { DB.prods.splice(i, 0, p); save(); draw(); } }); }); }
  });
}

// ---------- Page: Reports ----------
function pReports(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Reports</h1><p>How the year is going, by customer type, wood and season.</p></div></div>
  <section class="grid g-2"><article class="card"><div class="card-h"><h2>Monthly sales mix</h2></div><div id="r1"></div></article><article class="card"><div class="card-h"><h2>Win rate</h2></div><div id="r2"></div></article></section>
  <section class="grid g-3"><article class="card"><div class="card-h"><h2>Revenue by wood</h2></div><div id="r3"></div></article><article class="card"><div class="card-h"><h2>Quote to order</h2></div><div id="r4"></div></article><article class="card"><div class="card-h"><h2>Walk-in visits</h2><span class="muted">by day and hour</span></div><div id="r5"></div></article></section>`;
  barChart($('#r1', out), { labels: monthsBack(12), stacked: true, height: 250, fmt: fmt.money, yfmt: fmt.mshort, yw: 58, series: SEGS.map((s, k) => ({ name: s.id, data: DB.bySeg[k], color: s.color })), label: 'Monthly sales by customer type' });
  const won = DB.orders.length, lost = DB.lost + 9;
  gauge($('#r2', out), { value: won, max: won + lost, text: Math.round(won / (won + lost) * 100) + '%', sub: `${won} won · ${lost} lost`, label: 'Win rate', color: '--c2' });
  hbars($('#r3', out), WOODS.map(w => ({ label: w.n, value: sum(DB.orders.filter(o => o.wood === w.n).map(o => o.amount)), color: w.c })).sort((a, b) => b.value - a.value), { fmt: fmt.mshort });
  funnel($('#r4', out), { steps: STAGES.map((s, i) => ({ label: s.name, value: DB.deals.filter(d => STAGES.findIndex(x => x.id === d.stage) >= i).length + (i === 4 ? 0 : 6 - i), color: s.color })) });
  const r = rng(5); heatmap($('#r5', out), { rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], cols: ['11', '1', '3', '5', '7'], v: (a, b) => Math.round((a === 5 ? 9 : 4) * (b === 3 || b === 4 ? 1.6 : 1) * (0.5 + r())), unit: 'visitors', fmt: fmt.n });
}

// ---------- Page: Settings ----------
function pSettings(out) {
  const sf = [{ name: 'name', label: 'Workshop name', required: true }, { name: 'city', label: 'City', type: 'select', options: CITIES, half: true }, { name: 'days', label: 'Open days', required: true, half: true }];
  out.innerHTML = `<div class="page-h"><div><h1>Settings</h1><p>Workshop details, alerts and the look of the glass.</p></div></div>
  <section class="grid g-2"><article class="card"><div class="card-h"><h2>Workshop</h2></div><form class="form" id="sf" novalidate>${sf.map(f => fieldHtml(f, DB.shop[f.name], 'sf')).join('')}<div class="f"><button class="btn primary" type="submit" style="justify-self:start">Save details</button></div></form></article>
  <article class="card"><div class="card-h"><h2>Alerts and look</h2></div>${[['sms', 'SMS when an order is ready', 'Text the customer on dispatch'], ['digest', 'Morning summary', 'A short note at 9 am'], ['sound', 'Chime on new enquiry', 'A soft sound in the browser']].map(([k, t, s]) => `<div class="set-row"><div><b id="lb_${k}">${t}</b><small>${s}</small></div><button type="button" class="tg" role="switch" aria-checked="${!!DB.prefs[k]}" aria-labelledby="lb_${k}" data-p="${k}"></button></div>`).join('')}<div class="set-row"><div><b>Theme</b><small>Sand glass by day, walnut glass by night</small></div>${seg('Theme', [{ v: 'light', l: 'Sand' }, { v: 'dark', l: 'Walnut' }], document.documentElement.dataset.theme)}</div><div class="set-row"><div><b>Reset demo data</b><small>Restore the sample workshop</small></div><button type="button" class="btn danger sm" data-reset>Reset</button></div></article></section>`;
  const fm = $('#sf', out);
  fm.addEventListener('submit', e => { e.preventDefault(); const v = readForm(fm, sf), er = checkForm(sf, v); sf.forEach(f => { const el = fm.elements.namedItem(f.name); if (er[f.name]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); $('#sf_' + f.name + '_e', out).textContent = er[f.name] || ''; }); if (Object.keys(er).length) return; Object.assign(DB.shop, v); save(); $('.kick').textContent = v.name + ' · ' + v.city; toast('Workshop details saved'); });
  segBind(out, v => { store.set(KEY + ':theme', v); applyTheme(v); });
  out.addEventListener('click', e => {
    const t = e.target.closest('[data-p]');
    if (t) { const k = t.dataset.p; DB.prefs[k] = !DB.prefs[k]; t.setAttribute('aria-checked', String(DB.prefs[k])); save(); toast('Saved'); }
    if (e.target.closest('[data-reset]')) ask('Reset all demo data?', { ok: 'Reset' }).then(ok => { if (!ok) return; DB = seed(); save(); APP.refresh(); toast('Demo data restored'); });
  });
}

// ---------- Start ----------
$('.kick').textContent = DB.shop.name + ' · ' + DB.shop.city;
$('#qDeal').onclick = () => newDeal();
const APP = startApp({
  key: KEY, name: 'Woodnote', def: 'overview', outlet: $('#main'), nav: $('[data-nav]'), marker: $('.rail-mk'), axis: 'xy',
  pages: { overview: { title: 'Overview', icon: 'home', render: pOverview }, deals: { title: 'Deal board', icon: 'board', render: pDeals }, orders: { title: 'Orders', icon: 'receipt', render: pOrders }, customers: { title: 'Customers', icon: 'users', render: pCustomers }, workshop: { title: 'Workshop line', icon: 'zap', render: pWorkshop }, catalog: { title: 'Catalog', icon: 'box', render: pCatalog }, reports: { title: 'Reports', icon: 'pie', render: pReports }, settings: { title: 'Settings', icon: 'sliders', render: pSettings } },
  onRoute: () => { $('#topTitle').textContent = document.title.split(' · ')[0]; },
  notes: [['Margalla Suites approved the oak sample', 'win', 25], ['WN-2418 is waiting at quality check', 'info', 70], ['Sheesham stock is running low', 'bad', 300, true]],
  cmd: () => [{ label: 'New enquiry', hint: 'Action', icon: 'plus', run: () => newDeal() }, ...DB.deals.filter(d => d.stage !== 'lost').map(d => ({ label: d.item + ' · ' + d.cust, hint: 'Enquiry', icon: 'board', run: () => openDeal(d) })), ...DB.orders.map(o => ({ label: o.no + ' · ' + o.item, hint: 'Order · ' + statusOf(o), icon: 'receipt', run: () => openOrder(o) }))]
});
</script>
</body>
