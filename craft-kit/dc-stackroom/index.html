<html lang="en">
<head>
<meta charset="utf-8">

<title>Stackroom · Stock and orders · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
/* ===== Core UI parts: buttons, forms, tables, layers, toasts, charts (each app themes them with variables) ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 10px; --r-inp: 9px; --r-modal: 18px;
  --scrim: rgba(12, 14, 22, .45); --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .45);
  --toast-bg: #17191f; --toast-ink: #fff; --tip-bg: #121419; --tip-ink: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.i { width: 18px; height: 18px; flex: none; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1; text-decoration: none; white-space: nowrap; transition: transform .14s, background-color .2s, border-color .2s, box-shadow .2s, filter .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn .i { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.bell { position: relative; }
.bell .badge-n { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge-n[hidden] { display: none; }
.bell.ring .i { animation: ring .8s ease; transform-origin: 50% 10%; }
@keyframes ring { 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

/* Segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg-k { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--accent); transition: left .35s cubic-bezier(.3, 1.3, .5, 1), width .35s; }

/* Chips, badges, avatars, progress */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .cnt { opacity: .7; font-weight: 500; }
.badge { --b: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { --b: var(--ok); } .badge.warn { --b: var(--warn); } .badge.bad { --b: var(--bad); } .badge.info { --b: var(--info); } .badge.acc { --b: var(--accent); }
.ava { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; letter-spacing: .02em; }
.meter { height: 7px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--mc, var(--accent)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; }
.delta .i { width: 14px; height: 14px; }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full, .form .full { grid-column: 1 / -1; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-inp); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.err .inp { border-color: var(--bad); }
.ferr { font-size: 12px; color: var(--bad); }
.ferr:empty { display: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; appearance: none; -webkit-appearance: none; border-radius: 99px; background: var(--line-2); transition: background-color .25s; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* Data table */
.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 180px; max-width: 300px; display: block; }
.search .inp { padding-left: 34px; min-height: 36px; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th > button, .tbl th > .th { display: flex; align-items: center; gap: 4px; width: 100%; padding: 9px 12px; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
.tbl th.r > button, .tbl th.r > .th { justify-content: flex-end; }
.tbl th .ar { width: 0; height: 0; border: 4px solid transparent; opacity: 0; transition: opacity .2s; }
.tbl th[aria-sort="ascending"] .ar { border-bottom-color: currentColor; margin-top: -4px; opacity: 1; }
.tbl th[aria-sort="descending"] .ar { border-top-color: currentColor; margin-top: 4px; opacity: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tbody tr { transition: background-color .15s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tbody tr.rowin { animation: rowin .4s both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } }
.tbl .r { text-align: right; }
.tbl .acts { display: flex; gap: 4px; justify-content: flex-end; }
.cellname { display: flex; align-items: center; gap: 10px; }
.cellname small { display: block; color: var(--muted); font-size: 11.5px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pager .pbtns { display: flex; gap: 6px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty .i { width: 34px; height: 34px; opacity: .55; }
.empty b { color: var(--ink); }

/* Layers: modal, drawer, menu, command search */
.layer { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.layer .scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-modal); box-shadow: var(--shadow-lg); animation: pop .34s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 10px 20px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.layer.drawer-l { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { position: relative; height: 100%; width: min(460px, 100%); background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slidein .4s cubic-bezier(.2, .8, .2, 1) both; }
.drawer .modal-b { flex: 1; }
.drawer .modal-f { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.layer.closing .scrim { animation: fade .22s reverse both; }
.layer.closing .modal { animation: pop .22s reverse both; }
.layer.closing .drawer { animation: slidein .26s reverse both; }
.modal.shake { animation: shake .4s; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes slidein { from { transform: translateX(100%); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 6px 0 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 110; min-width: 190px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s both; }
.menu.wide { width: 330px; }
.menu > button, .menu .mi { display: flex; width: 100%; text-align: left; gap: 9px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; color: inherit; }
.menu > button:hover, .menu > button:focus-visible { background: var(--hover); outline: none; }
.menu > button.dz { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.menu .mh { padding: 6px 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.notes li { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
.notes li.unread { background: var(--hover); }
.notes li i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--info); }
.notes li.ok i { background: var(--ok); } .notes li.warn i { background: var(--warn); } .notes li.bad i { background: var(--bad); }
.notes small { display: block; color: var(--muted); font-size: 11px; }
.layer.cmdk-l { align-items: flex-start; padding-top: 12vh; }
.modal.cmdk .modal-b { padding: 0 12px 12px; }
.cmdk ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.cmdk li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; text-align: left; font-size: 13.5px; }
.cmdk li button small { margin-left: auto; color: var(--muted); }
.cmdk li[aria-selected="true"] button, .cmdk li button:hover { background: var(--hover); }

/* Toasts and tooltip */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 11px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; animation: toastin .4s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast > i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.toast.warn > i { background: var(--warn); } .toast.bad > i { background: var(--bad); } .toast.info > i { background: var(--info); }
.toast button { margin-left: 6px; border: 0; background: rgba(255, 255, 255, .16); color: inherit; border-radius: 7px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
.toast.out { animation: toastout .26s both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }
.tip { position: fixed; z-index: 160; left: 0; top: 0; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 250px; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .tr span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* Charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.6, .1, .2, 1) forwards; }
.chart .ar.in { animation: fade 1s .35s both; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.chart .dot { stroke: var(--surface); stroke-width: 2; opacity: 0; transition: opacity .15s; }
.chart.hov .guide, .chart.hov .dot { opacity: 1; }
.chart .bar { transition: opacity .2s; }
.chart.hov .bar:not(.hl) { opacity: .45; }
.chart .seg-arc { fill: none; transition: stroke-width .2s, opacity .2s; cursor: pointer; }
.chart .seg-arc.dim { opacity: .35; }
.chart .empty-c { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-box { position: relative; flex: none; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-size: 20px; line-height: 1.1; }
.donut-c span { font-size: 11px; color: var(--muted); }
.dleg { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: grid; gap: 6px; font-size: 12.5px; }
.dleg li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: default; transition: background-color .15s; }
.dleg li:hover { background: var(--hover); }
.dleg li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dleg li em { font-style: normal; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.blist { display: grid; gap: 10px; }
.blist .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; cursor: default; }
.blist .bl > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blist .bl b { font-variant-numeric: tabular-nums; }
.blist .bt { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.blist .bt i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--bc, var(--c1)); }
.funnel { display: grid; gap: 8px; }
.funnel .fs { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; align-items: center; gap: 10px; font-size: 12.5px; cursor: default; }
.funnel .fb { height: 30px; display: flex; justify-content: center; }
.funnel .fb i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--fc, var(--c1)); }
.funnel .fs em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Drag and drop */
.dragging { opacity: .35; }
.ghost { position: fixed !important; z-index: 140; margin: 0 !important; pointer-events: none; transform: rotate(2.5deg) scale(1.03); box-shadow: var(--shadow-lg); }
.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
[data-handle] { touch-action: none; cursor: grab; }

/* Page entrance */
.rise { animation: rise .62s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ===== Stackroom look: concrete, navy and safety yellow; square corners, thick edges, stencil labels ===== */
:root {
  --head: Bahnschrift, "DIN Alternate", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --bg: #e2e3df; --surface: #f6f6f3; --surface-2: #e9e9e4; --ink: #101826; --muted: #555e6c; --line: #c6c8c1; --line-2: #8e938b; --edge: #1b2436; --hover: rgba(255, 194, 26, .16);
  --accent: #ffc21a; --on-accent: #101826; --ok: #2b8a3e; --warn: #b35c00; --bad: #d6336c; --info: #1c6dd0; --grid: #d9dad4;
  --c1: #e8590c; --c2: #1c6dd0; --c3: #8a6a2f; --c4: #2b8a3e; --c5: #7048e8; --c6: #495057;
  --side: #0f1b2d; --side-ink: #aab6c8; --upright: #1c3d6e; --beam: #f08c00;
  --hazard: repeating-linear-gradient(-45deg, var(--accent) 0 9px, #101826 9px 18px);
  --r: 0px; --r-btn: 2px; --r-inp: 2px; --r-modal: 2px;
  --toast-bg: #101826; --toast-ink: #ffc21a; --tip-bg: #101826; --scrim: rgba(16, 24, 38, .5);
  --shadow-lg: 8px 8px 0 rgba(16, 24, 38, .25);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #121417; --surface: #1b1e23; --surface-2: #23272e; --ink: #e9ebef; --muted: #98a0ad; --line: #30353e; --line-2: #4a515c; --edge: #4a515c; --hover: rgba(255, 204, 51, .1);
  --accent: #ffcc33; --on-accent: #121417; --ok: #51cf66; --warn: #ffa94d; --bad: #ff6b9a; --info: #5c9cf0; --grid: #262a31;
  --c1: #ff8a3d; --c2: #5c9cf0; --c3: #c9a46a; --c4: #51cf66; --c5: #9775fa; --c6: #adb5bd;
  --side: #0a0c0f; --side-ink: #8d97a6; --upright: #3b5b8f; --beam: #e8890c;
  --toast-bg: #ffcc33; --toast-ink: #121417; --tip-bg: #e9ebef; --tip-ink: #121417; --scrim: rgba(0, 0, 0, .6); --shadow-lg: 8px 8px 0 rgba(0, 0, 0, .5);
  color-scheme: dark;
}
body { background: var(--bg) repeating-linear-gradient(90deg, transparent 0 79px, color-mix(in srgb, var(--line) 45%, transparent) 79px 80px); }
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
.lbl-m, .ch h3, .kpi .lbl, .nav a, .tbl th, .chip, .crumb { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; }

/* Navy sidebar with a hazard top edge and a yellow block marker */
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; background: var(--side); color: var(--side-ink); overflow-y: auto; z-index: 60; border-right: 3px solid var(--edge); }
.side::before { content: ""; height: 10px; flex: none; background: var(--hazard); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #fff; text-decoration: none; font-family: var(--head); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
.brand svg { width: 36px; height: 36px; flex: none; }
.brand small { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--side-ink); font-weight: 600; }
.nav { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: var(--side-ink); text-decoration: none; font-size: 11.5px; font-weight: 700; transition: color .2s; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: #101826; }
.nav .num-b { margin-left: auto; font-size: 10px; background: rgba(255, 255, 255, .12); color: #fff; padding: 1px 6px; }
.nav a[aria-current="page"] .num-b { background: #101826; color: var(--accent); }
.nav .marker { position: absolute; left: 10px; right: 10px; top: 0; height: 40px; background: var(--accent); transition: transform .4s cubic-bezier(.6, 0, .2, 1), height .3s, opacity .3s; }
.nav .marker::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 14px; background: repeating-linear-gradient(-45deg, #101826 0 4px, transparent 4px 8px); opacity: .55; }
.side-foot { margin-top: auto; padding: 14px 16px; border-top: 1px solid rgba(255, 255, 255, .1); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; }
.side-foot b { display: block; color: var(--accent); font-size: 12px; }
.scrim-nav { display: none; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 10px 24px; background: var(--surface); border-bottom: 3px solid var(--edge); }
.top h1 { font-family: var(--head); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.crumb { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.shift { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 6px 10px; border: 2px solid var(--edge); text-transform: uppercase; letter-spacing: .06em; display: inline-flex; gap: 6px; align-items: center; }
.shift i { width: 8px; height: 8px; background: var(--ok); display: inline-block; }
.menu-btn { display: none; }
main { padding: 20px 24px 40px; overflow-x: clip; }
.btn { border-width: 2px; border-color: var(--edge); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; font-size: 11.5px; }
.btn.pri { color: var(--on-accent); border-color: var(--edge); }
.btn.ghost { border-color: transparent; }
.btn:hover { box-shadow: 3px 3px 0 var(--edge); transform: translate(-1px, -1px); }
.btn.ghost:hover { box-shadow: none; transform: none; }
.btn:active:not(:disabled) { box-shadow: none; transform: translate(1px, 1px); }
.badge { border-radius: 0; font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; }
.chip { border-radius: 0; border-width: 2px; font-size: 10.5px; }
.seg, .seg button, .seg-k { border-radius: 0; }
.seg { border: 2px solid var(--edge); }
.inp { border-width: 2px; }
.modal, .drawer { border: 3px solid var(--edge); }
.modal::before, .drawer::before { content: ""; display: block; height: 8px; background: var(--hazard); }
.tbl th { font-size: 10.5px; }
.tbl td { border-bottom-color: var(--line); }

/* Cards: square blocks with thick edges */
@keyframes rise { from { opacity: 0; transform: translateY(-12px); } }
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.g11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { position: relative; background: var(--surface); border: 2px solid var(--edge); padding: 16px 18px; min-width: 0; transition: transform .2s, box-shadow .2s; }
.card.lift:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--edge); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -16px -18px 14px; padding: 9px 18px; border-bottom: 2px solid var(--edge); background: var(--surface-2); flex-wrap: wrap; }
.ch h3 { font-size: 12px; font-weight: 800; }
.ch p { font-size: 11.5px; color: var(--muted); }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.bar-row p { color: var(--muted); max-width: 72ch; }
.kpi { padding-top: 22px; }
.kpi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: var(--hazard); }
.kpi .lbl { font-size: 10.5px; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; }
.kpi .lbl .i { width: 16px; height: 16px; color: var(--ink); }
.kpi .val { font-family: var(--head); font-size: 34px; font-weight: 800; line-height: 1; margin: 8px 0 6px; }
.kpi .ft { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .sp { width: 80px; }
.mono { font-family: var(--mono); }

/* Signature: the rack map; crates fill bins by stock level and slide in when a delivery is put away */
.floor { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
.dock { border: 2px dashed var(--line-2); padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; position: relative; padding-top: 22px; }
.dock::before { content: "Dock"; position: absolute; top: 0; left: 0; right: 0; height: 16px; background: var(--hazard); color: transparent; }
.dock .dk { font-family: var(--mono); font-size: 10.5px; border: 2px solid var(--edge); background: var(--surface); padding: 6px; display: grid; gap: 4px; text-align: left; }
.dock .dk b { font-size: 11px; }
.dock .pal { display: flex; gap: 2px; flex-wrap: wrap; }
.racks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.rack { position: relative; padding: 0 5px 12px; border-left: 6px solid var(--upright); border-right: 6px solid var(--upright); }
.rack::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0; height: 6px; background: var(--upright); }
.rack-h { font: 800 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; text-align: center; margin-bottom: 4px; }
.shelf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; padding-top: 3px; border-bottom: 5px solid var(--beam); margin-bottom: 4px; }
.bin { position: relative; height: 52px; border: 1px dashed var(--line-2); background: transparent; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center; gap: 2px; padding: 3px 3px 2px; transition: background-color .2s, outline-color .2s; min-width: 0; }
.bin:hover { background: var(--hover); }
.bin.empty .bc { position: absolute; inset: 0; display: grid; place-items: center; font: 700 8.5px var(--mono); color: var(--muted); opacity: .7; }
.bin.low { border: 2px solid var(--bad); }
.bin.hl, .bin.find { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; }
.bin.find { animation: blink 1s 3; }
@keyframes blink { 50% { outline-color: transparent; } }
.crate { width: calc(50% - 1px); height: calc(50% - 2px); min-width: 6px; background: linear-gradient(45deg, transparent 44%, rgba(0, 0, 0, .28) 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, rgba(0, 0, 0, .18) 44% 56%, transparent 56%), var(--cc); border: 1.5px solid rgba(0, 0, 0, .4); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
.crate.new { animation: cratein .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d); }
@keyframes cratein { from { opacity: 0; transform: translateX(-160px) rotate(-10deg); } 70% { transform: translateX(4px); } }
.racks.mini .bin { height: 30px; padding: 2px; }
.racks.mini .bin.empty .bc { display: none; }
.racks.mini { gap: 10px; }
.legend-r { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 10px; }
.legend-r span { display: inline-flex; gap: 6px; align-items: center; }
.legend-r i { width: 12px; height: 9px; border: 1.5px solid rgba(0, 0, 0, .4); }

/* Boards and lists */
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { border: 2px solid var(--edge); background: var(--surface-2); min-height: 330px; display: flex; flex-direction: column; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; font: 800 11.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; border-bottom: 2px solid var(--edge); background: var(--surface); }
.col-h .n { background: var(--ink); color: var(--surface); padding: 0 7px; }
.col.over { background: var(--hover); }
.col-b { padding: 10px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.oc { background: var(--surface); border: 2px solid var(--edge); padding: 10px; cursor: grab; transition: transform .15s, box-shadow .15s; }
.oc:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--edge); }
.oc.ws { border-left: 7px solid var(--c2); }
.oc .t { display: flex; justify-content: space-between; align-items: center; font: 700 11.5px var(--mono); }
.oc .grip { display: inline-flex; color: var(--muted); }
.oc .grip .i { width: 16px; height: 16px; }
.oc .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 6px; }
.oc.flash { animation: rowin .5s both; }
.mlist { list-style: none; margin: 0; padding: 0; }
.mlist li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line-2); font-size: 13px; }
.mlist li:last-child { border-bottom: 0; }
.mlist li > div { flex: 1; min-width: 0; }
.mlist small { display: block; color: var(--muted); font-size: 11.5px; }
.tagm { font: 700 10.5px var(--mono); padding: 2px 6px; border: 2px solid var(--edge); white-space: nowrap; }
.picklist { list-style: none; margin: 0 0 14px; padding: 0; border: 2px solid var(--edge); }
.picklist li { display: grid; grid-template-columns: auto 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.picklist li:last-child { border-bottom: 0; }
.picklist input { width: 18px; height: 18px; accent-color: var(--ink); }
.picklist li.done { background: color-mix(in srgb, var(--ok) 10%, transparent); }
.picklist li.done span { text-decoration: line-through; color: var(--muted); }
.check-tbl td .qtyc { display: inline-flex; align-items: center; gap: 4px; }
.check-tbl input { width: 64px; min-height: 32px; padding: 4px 6px; text-align: center; }
.check-tbl .qtyc button { width: 28px; height: 28px; border: 2px solid var(--edge); background: var(--surface-2); display: grid; place-items: center; padding: 0; }
.check-tbl .qtyc button .i { width: 14px; height: 14px; }
.check-tbl tr.diff { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.putaway { display: grid; gap: 12px; }
.putaway .racks { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.pa-list { list-style: none; margin: 0; padding: 0; font: 12px var(--mono); display: grid; gap: 4px; }
.timeline { list-style: none; margin: 4px 0 14px; padding: 0; display: flex; }
.timeline li { flex: 1; text-align: center; font: 700 10px var(--mono); text-transform: uppercase; padding: 7px 2px; border: 2px solid var(--edge); margin-left: -2px; color: var(--muted); }
.timeline li.done { background: var(--surface-2); color: var(--ink); }
.timeline li.now { background: var(--accent); color: var(--on-accent); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px dashed var(--line-2); }
.set-row:last-child { border-bottom: 0; }
.set-row p { font-size: 12px; color: var(--muted); }
.switch { border-radius: 0; }
.switch::after { border-radius: 0; }
.stockcell { min-width: 130px; }
.meter { border-radius: 0; height: 8px; border: 1px solid var(--line-2); }
.meter i { border-radius: 0; }

/* Responsive */
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12, .g11 { grid-template-columns: minmax(0, 1fr); } .racks { grid-template-columns: repeat(2, minmax(0, 1fr)); } .shift { display: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; transform: translateX(-105%); transition: transform .3s cubic-bezier(.6, 0, .2, 1); }
  body.nav-open .side { transform: none; }
  .scrim-nav { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
  body.nav-open .scrim-nav { display: block; }
  .menu-btn { display: inline-flex; }
  .top { padding: 10px 14px; }
  .top h1 { font-size: 21px; }
  main { padding: 14px 14px 32px; }
  .floor { grid-template-columns: minmax(0, 1fr); }
  .dock { flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 560px) { .g4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; } .kpi .val { font-size: 26px; } .kpi .sp { display: none; } .crumb { display: none; } .racks { grid-template-columns: minmax(0, 1fr); } .board { grid-template-columns: repeat(4, 80vw); } .card { padding: 14px; } .ch { margin: -14px -14px 12px; padding: 8px 14px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main menu">
    <a class="brand" href="#/overview" aria-label="Stackroom home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="37" fill="#ffc21a" stroke="#101826" stroke-width="3"/><rect x="8" y="22" width="11" height="10" fill="#101826"/><rect x="21" y="22" width="11" height="10" fill="#101826"/><rect x="14.5" y="10" width="11" height="10" fill="#101826"/><path d="M8 34h24" stroke="#101826" stroke-width="2"/></svg>
      <span>Stackroom<small id="co-name">Keamari Spice Works</small></span>
    </a>
    <nav class="nav" data-nav aria-label="Pages"><span class="marker" aria-hidden="true"></span></nav>
    <div class="side-foot"><b>Warehouse KHI-1</b>West Wharf, Karachi<br>Shift B · 14:00–22:00</div>
  </aside>
  <div class="scrim-nav" data-nav-close></div>
  <div class="main-col">
    <header class="top">
      <button class="btn icon ghost menu-btn" data-menu-btn aria-label="Open menu" aria-expanded="false"></button>
      <div class="grow"><div class="crumb" id="crumb">Keamari Spice Works / Warehouse</div><h1 id="pt">Overview</h1></div>
      <span class="shift"><i></i>Dock open</span>
      <button class="btn icon" data-cmdk aria-label="Search pages and actions"></button>
      <button class="btn icon" data-theme-btn aria-label="Switch theme"></button>
      <button class="btn icon bell" data-bell aria-label="Notifications"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (small, shared, no libraries) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fin = (v) => (Number.isFinite(+v) ? +v : 0); /* any non-finite number (NaN, Infinity) becomes 0 */
const sum = (a, f = (x) => x) => a.reduce((s, x, i) => s + fin(f(x, i)), 0);
const mq = (q) => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const RM = mq("(prefers-reduced-motion: reduce)").matches;
const DAY = 864e5;
const MON = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
const WD = "Sun Mon Tue Wed Thu Fri Sat".split(" ");
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
const pad = (n) => String(n).padStart(2, "0");
let _uid = 0;
const uid = (p = "u") => p + (++_uid).toString(36);
const ease = (t) => 1 - Math.pow(1 - t, 3);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/* Seeded random numbers, so the demo data is the same on every load */
function rng(seed) {
  let a = seed >>> 0 || 1;
  const r = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.shuffle = (arr) => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  return r;
}
const PK = {
  first: "Ayesha Bilal Hamza Fatima Usman Zainab Ali Hira Saad Maryam Omar Sana Faisal Iqra Danish Mahnoor Kamran Rabia Imran Nida Tariq Amna Hassan Sadia Junaid Areeba Waqas Mehwish Fahad Kiran Shahzad Laiba Asad Rimsha Noman Anum Zeeshan Hafsa Adeel Saba".split(" "),
  last: "Khan Ahmed Malik Qureshi Siddiqui Butt Chaudhry Sheikh Raza Hussain Mirza Javed Iqbal Akhtar Abbasi Farooq Baig Rana Shah Aslam Nawaz Haider Anwar Zafar".split(" "),
  cities: "Lahore Karachi Islamabad Rawalpindi Faisalabad Multan Peshawar Quetta Sialkot Hyderabad Gujranwala Abbottabad Bahawalpur Sukkur".split(" "),
};
const person = (r) => r.pick(PK.first) + " " + r.pick(PK.last);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (n, cls = "") => `<span class="ava ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;
const phone = (r) => "03" + r.int(0, 4) + r.int(0, 9) + "-" + r.int(1000000, 9999999);

/* Number, money and date formatting */
const fmt = {
  n: (v, d = 0) => (+v || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }),
  short(v) {
    v = +v || 0; const a = Math.abs(v);
    const [div, suf] = a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e3 ? [1e3, "K"] : [1, ""];
    if (!suf) return String(Math.round(v));
    const x = v / div; return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1).replace(/\.0$/, "")) + suf;
  },
  pkr: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.n(Math.abs(v)),
  pkrS: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.short(Math.abs(v)),
  usd: (v) => (v < 0 ? "-$" : "$") + fmt.n(Math.abs(v)),
  usd2: (v) => (v < 0 ? "-$" : "$") + fmt.n(Math.abs(v), 2),
  usdS: (v) => (v < 0 ? "-$" : "$") + fmt.short(Math.abs(v)),
  pct: (v, d = 1) => ((+v || 0) * 100).toFixed(d) + "%",
  date: (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()]; },
  dateY: (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); },

/* ================= Orders: flow, drawers, modals ================= */
const nextSt = (o) => ({ New: "Picking", Picking: "Packed", Packed: "Shipped", Shipped: "Delivered" })[o.status];
function moveOrder(o, s) {
  if (!o || !s || o.status === s) return false;
  const from = O_ST.indexOf(o.status), to = O_ST.indexOf(s);
  if (o.status === "Cancelled") { toast("Cancelled orders cannot move", "warn"); return false; }
  if (from >= 3 && to < 3) { toast(`#${o.id} has already left the building`, "warn"); return false; }
  if (to >= 2 && from < 2) {
    const short = o.lines.find((l) => onHand(l.kid) < l.qty);
    if (short) { toast(`Not enough ${kName(short.kid)} on the shelf to pack #${o.id}`, "bad"); return false; }
    o.picked = o.lines.map((l) => ({ kid: l.kid, from: takeOut(l.kid, l.qty) }));
    alertLow(o.lines.map((l) => l.kid));
  }
  if (to < 2 && from === 2) { (o.picked || []).forEach((p) => p.from.forEach((f) => { const b = D().bins[f.code]; if (b && (b.kid === p.kid || !b.kid)) { b.kid = p.kid; b.qty += f.qty; } else putAway(p.kid, f.qty); })); o.picked = []; }
  if (to >= 3 && !o.courier) o.courier = D().settings.courier;
  if (s === "Shipped") { const c = cust(o.cid); if (c && c.type !== "Online") c.balance += o.total; }
  o.status = s; save();
  toast(`#${o.id} → ${BOARD[s] || s}${s === "Packed" ? ": stock taken from the bins" : s === "Shipped" ? " with " + o.courier : ""}`);
  return true;
}
async function cancelOrder(o) {

}

/* ================= Receiving: check-in with counts, then put-away ================= */
function checkIn(inb) {
  if (!inb || inb.status !== "At dock") return;
  const lines = inb.lines.filter((l) => sku(l.kid));
  const m = Layer.open({
    title: `Check in ${esc(inb.id)}`, wide: 1,
    body: `<p class="muted" style="margin-bottom:10px">${esc(supName(inb.sid))}. Count the cases on the pallet. Damaged cases are not put away.</p><div class="tbl-wrap"><table class="tbl check-tbl"><caption class="sr">Delivery lines</caption><thead><tr><th><span class="th">Item</span></th><th class="r"><span class="th">Expected</span></th><th><span class="th">Counted</span></th><th><span class="th">Damaged</span></th><th><span class="th">Check</span></th></tr></thead><tbody>${lines.map((l, i) => `<tr data-ln="${i}"><td><b>${esc(kName(l.kid))}</b><br><small class="muted mono">${sku(l.kid).cs} per case</small></td><td class="r mono">${l.cases}</td><td><span class="qtyc"><button type="button" data-st="-1" aria-label="One case less">${ic("minus")}</button><input class="inp" type="number" min="0" value="${l.cases}" data-c aria-label="Counted cases for ${esc(kName(l.kid))}"><button type="button" data-st="1" aria-label="One case more">${ic("plus")}</button></span></td><td><input class="inp" type="number" min="0" value="0" data-dmg aria-label="Damaged cases for ${esc(kName(l.kid))}"></td><td class="st"></td></tr>`).join("")}</tbody></table></div><p class="cart-err ferr" id="ci-err" role="alert" style="margin-top:8px"></p>`,
    foot: `<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" data-book>${ic("check")}Book in and put away</button>`,
  });
  const rows = () => $$("[data-ln]", m.body);
  const paint = () => rows().forEach((tr) => {
    const l = lines[+tr.dataset.ln], c = parseInt(tr.querySelector("[data-c]").value, 10), dmg = parseInt(tr.querySelector("[data-dmg]").value, 10) || 0;
    const st = tr.querySelector(".st");
    if (Number.isNaN(c) || c < 0) { st.innerHTML = badge("Enter a count", "bad"); tr.classList.add("diff"); return; }
    const diff = c - l.cases;
    st.innerHTML = (diff === 0 ? badge("Matches", "ok") : badge(diff < 0 ? `Short ${-diff}` : `Over ${diff}`, "warn")) + (dmg ? " " + badge(`${dmg} damaged`, "bad") : "");
    tr.classList.toggle("diff", diff !== 0 || dmg > 0);
  });
  m.body.addEventListener("input", paint);
  m.body.addEventListener("click", (e) => { const b = e.target.closest("[data-st]"); if (!b) return; const inp = b.parentElement.querySelector("[data-c]"); inp.value = Math.max(0, (parseInt(inp.value, 10) || 0) + +b.dataset.st); paint(); });
  paint();
  m.el.querySelector("[data-book]").addEventListener("click", () => {
    const err = $("#ci-err", m.body), vals = rows().map((tr) => ({ c: parseInt(tr.querySelector("[data-c]").value, 10), d: parseInt(tr.querySelector("[data-dmg]").value, 10) || 0 }));
    const bad = vals.findIndex((v) => Number.isNaN(v.c) || v.c < 0 || v.d < 0 || v.d > v.c);
    if (bad >= 0) { err.textContent = `Check line ${bad + 1}: counted must be 0 or more and damaged cannot be more than counted.`; return; }
    const fresh = {}, placed = [];
    let issues = 0;
    lines.forEach((l, i) => {
      const k = sku(l.kid), good = vals[i].c - vals[i].d;
      l.counted = vals[i].c; l.damaged = vals[i].d;
      if (vals[i].c !== l.cases || vals[i].d) issues++;
      const out = putAway(l.kid, good * k.cs);
      out.forEach((p) => { const before = D().bins[p.code].qty - p.qty, f0 = Math.ceil(Math.min(1, before / (cap() * k.cs)) * 4) * (before > 0 ? 1 : 0), f1 = Math.max(1, Math.ceil(Math.min(1, D().bins[p.code].qty / (cap() * k.cs)) * 4)); fresh[p.code] = Math.max(1, f1 - f0); placed.push(`${p.code} ← ${cases(k, p.qty)} cs ${k.name}${p.over ? " (over capacity)" : ""}`); });
    });
    inb.status = "Received"; inb.recAt = Date.now(); inb.note = issues ? `${issues} line${issues > 1 ? "s" : ""} with a difference` : "Received in full";
    save();
    if (issues) Bell.add(`${inb.id}: ${issues} line${issues > 1 ? "s" : ""} short, over or damaged; supplier notified`, "warn"); else Bell.add(`${inb.id} received in full`, "ok", true);
    const rk = [...new Set(Object.keys(fresh).map((c) => c[0]))];
    m.el.querySelector("h2").textContent = "Put-away";
    m.body.innerHTML = `<div class="putaway"><p class="muted">Crates are sliding into their bins. Highlighted bins just received stock.</p><div class="racks">${rk.map((r) => rackHTML(r, { fresh, hl: new Set(Object.keys(fresh)) })).join("")}</div><ul class="pa-list">${placed.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>`;
    m.el.querySelector(".modal-f").innerHTML = `<button type="button" class="btn" data-map>Open rack map</button><button type="button" class="btn pri" data-close>Done</button>`;
    m.el.querySelector("[data-map]").addEventListener("click", () => { m.close(); R.go("warehouse"); });
    toast(`${inb.id} booked in${issues ? ` with ${issues} difference${issues > 1 ? "s" : ""}` : " in full"}`, issues ? "warn" : "ok");
    R.refresh();
  });
}
function inbDrawer(i) {
  if (!i) return;
  const dr = drawer({ title: esc(i.id), body: `<dl class="dl"><dt>Supplier</dt><dd>${esc(supName(i.sid))}</dd><dt>Due</dt><dd>${fmt.dateY(i.eta)}</dd><dt>Status</dt><dd>${badge(i.status, i.status === "Received" ? "ok" : "info")}</dd>${i.note ? `<dt>Note</dt><dd>${esc(i.note)}</dd>` : ""}</dl><ul class="picklist">${i.lines.map((l) => `<li><span>${ic("box")}</span><b class="mono">${l.cases} cs</b><span>${esc(kName(l.kid))}</span><b class="mono">${l.counted != null ? "got " + l.counted + (l.damaged ? ` (${l.damaged} dmg)` : "") : ""}</b></li>`).join("")}</ul>`, foot: i.status === "Expected" ? `<button type="button" class="btn danger" data-del>Cancel delivery</button><button type="button" class="btn pri" data-arr>Truck arrived</button>` : `<button type="button" class="btn" data-close>Close</button>` });
  const a = dr.el.querySelector("[data-arr]"); if (a) a.addEventListener("click", () => { i.status = "At dock"; i.eta = Date.now(); save(); dr.close(); R.refresh(); toast(`${i.id} is at the dock`, "info"); });
  const d = dr.el.querySelector("[data-del]"); if (d) d.addEventListener("click", async () => { if (await confirmDlg(`Cancel expected delivery ${esc(i.id)}?`, { title: "Cancel delivery?", ok: "Cancel delivery" })) { D().inbound = D().inbound.filter((x) => x !== i); save(); Layer.closeAll(); R.refresh(); toast(`${i.id} cancelled`, "warn"); } });
}
function schedModal(sid) {
  const ss = D().suppliers; if (!ss.length) return toast("Add a supplier first", "warn");
  const s0 = sid && sup(sid) ? sid : ss[0].id;
  const opts = (id) => { const ks = D().skus.filter((k) => k.sid === id); return (ks.length ? ks : D().skus).map((k) => ({ value: k.id, label: `${k.name} (${onHand(k.id)} on hand)` })); };
  const m = formModal({
    title: "Schedule a delivery", submit: "Schedule", values: { sid: s0, c1: 6, k2: "", due: fmt.iso(TODAY + ((sup(s0) || { lead: 3 }).lead) * DAY) },
    fields: [
      { name: "sid", label: "Supplier", type: "select", full: 1, options: ss.map((s) => ({ value: s.id, label: `${s.name} · ${s.lead}-day lead` })) },
      { name: "k1", label: "Item", type: "select", options: opts(s0) }, { name: "c1", label: "Cases", type: "number", min: 1, max: 200, required: 1 },
      { name: "k2", label: "Second item", type: "select", options: [{ value: "", label: "None" }].concat(opts(s0)) }, { name: "c2", label: "Cases", type: "number", min: 1, max: 200, validate: (v, a) => (a.k2 && Number.isNaN(v) ? "Enter cases" : a.k2 && a.k2 === a.k1 ? "Already on this delivery" : "") },
      { name: "due", label: "Due date", type: "date", required: 1, full: 1, validate: (v) => (parseISO(v) < TODAY ? "Pick today or later" : "") },
    ],
    onSubmit: (v) => {
      const lines = [[v.k1, v.c1], [v.k2, v.c2]].filter(([id, c]) => id && c > 0).map(([kid, c]) => ({ kid, cases: c }));
      const i = { id: "IN-" + D().seq.inb++, sid: v.sid, eta: parseISO(v.due) + 10 * 3600e3, status: days(parseISO(v.due)) === 0 ? "At dock" : "Expected", lines, note: "" };
      D().inbound.push(i); save(); R.refresh(); toast(`${i.id} scheduled with ${supName(v.sid)} for ${fmt.date(i.eta)}`);
    },
  });
  m.form.elements.sid.addEventListener("change", () => { const o = opts(m.form.elements.sid.value); ["k1", "k2"].forEach((n, j) => { m.form.elements[n].innerHTML = (j ? '<option value="">None</option>' : "") + o.map((x) => `<option value="${x.value}">${esc(x.label)}</option>`).join(""); }); });
}

/* ================= Bins, items, suppliers, customers ================= */
function binDrawer(code) {
  const b = D().bins[code]; if (!b) return;
  const k = sku(b.kid), empty = binCodes().filter((c) => !D().bins[c].kid && c !== code);
  if (!k) {
    const movable = Object.entries(D().bins).filter(([c, x]) => x.kid && c !== code);
    const dr = drawer({ title: `Bin ${code}`, body: `<div class="empty">${ic("box")}<b>This bin is empty</b><span>Move a bin's stock here to free space elsewhere.</span></div><label class="field"><span class="lbl-m" style="font-size:11px">Move from</span><select class="inp" id="mv-from">${movable.map(([c, x]) => `<option value="${c}">${c} · ${esc(kName(x.kid))}</option>`).join("")}</select></label>`, foot: `<button type="button" class="btn pri" data-mvhere ${movable.length ? "" : "disabled"}>Move stock here</button>` });
    dr.el.querySelector("[data-mvhere]").addEventListener("click", () => { const from = $("#mv-from", dr.el).value; moveBin(from, code); dr.close(); });
    return;
  }
  const pct = Math.round(Math.min(1, b.qty / (cap() * k.cs)) * 100);
  const dr = drawer({
    title: `Bin ${code}`,
    body: `<dl class="dl"><dt>Item</dt><dd>${esc(k.name)}</dd><dt>SKU</dt><dd class="mono">${esc(k.sku)}</dd><dt>Units</dt><dd>${fmt.n(b.qty)}</dd><dt>Cases</dt><dd>${cases(k, b.qty)} of ${cap()}</dd><dt>Fill</dt><dd>${pct}%</dd><dt>Item total</dt><dd>${fmt.n(onHand(k.id))} in ${binsOf(k.id).length} bin${binsOf(k.id).length > 1 ? "s" : ""}</dd><dt>Reserved</dt><dd>${fmt.n(allocated(k.id))}</dd></dl><div class="meter" style="--mc:${isLow(k) ? "var(--bad)" : CAT_C[k.cat]}"><i style="width:${pct}%"></i></div>
      <label class="field" style="margin-top:16px"><span class="lbl-m" style="font-size:11px">Move everything to an empty bin</span><select class="inp" id="mv-to">${empty.map((c) => `<option>${c}</option>`).join("")}</select></label>`,
    foot: `<button type="button" class="btn" data-mv ${empty.length ? "" : "disabled"}>${ic("move")}Move</button><button type="button" class="btn pri" data-cnt>Count bin</button>`,
  });
  dr.el.querySelector("[data-mv]").addEventListener("click", () => { moveBin(code, $("#mv-to", dr.el).value); dr.close(); });
  dr.el.querySelector("[data-cnt]").addEventListener("click", () => { dr.close(); binCount(code); });
  setTimeout(() => { const i = dr.el.querySelector(".meter i"); if (i) i.style.width = pct + "%"; }, 50);
}
function moveBin(from, to) {
  const a = D().bins[from], b = D().bins[to]; if (!a || !b || !a.kid || b.kid) return toast("Pick an empty target bin", "warn");
  D().bins[to] = { kid: a.kid, qty: a.qty, at: Date.now() }; D().bins[from] = { kid: null, qty: 0, at: 0 };
  save(); R.refresh(); toast(`${kName(D().bins[to].kid)} moved ${from} → ${to}`);
}
function binCount(code) {
  const b = D().bins[code], k = sku(b && b.kid); if (!k) return;
  formModal({
    title: `Count bin ${code}`, submit: "Save count", values: { qty: b.qty },
    note: `${esc(k.name)} · ${k.cs} units per case`,
    fields: [{ name: "qty", label: "Units counted", type: "number", min: 0, required: 1 }, { name: "why", label: "Reason", type: "select", options: ["Cycle count", "Damaged in store", "Found extra", "Sample taken"] }],
    onSubmit: (v) => { const diff = v.qty - b.qty; b.qty = v.qty; b.at = Date.now(); save(); R.refresh(); toast(`${code}: ${diff >= 0 ? "+" : ""}${diff} units (${v.why})`, diff < 0 ? "warn" : "ok"); alertLow([k.id]); },
  });
}
function countModal(k) {
  const bs = binsOf(k.id);
  if (!bs.length) return formModal({ title: `Put ${esc(k.name)} in a bin`, submit: "Put away", fields: [{ name: "qty", label: "Units found", type: "number", min: 1, required: 1 }], onSubmit: (v) => { const out = putAway(k.id, v.qty); save(); R.refresh(); toast(`${v.qty} units put away in ${out.map((o) => o.code).join(", ")}`); } });
  binCount(bs.sort((a, b) => a.code.localeCompare(b.code))[0].code);
}
function skuDrawer(k) {
  if (!k) return;
  const dr = drawer({
    title: esc(k.name),
    body: `<dl class="dl"><dt>SKU</dt><dd class="mono">${esc(k.sku)}</dd><dt>Category</dt><dd>${esc(k.cat)}</dd><dt>Supplier</dt><dd>${esc(supName(k.sid))}</dd><dt>Retail / trade</dt><dd>${money(k.price)} / ${money(k.whole)}</dd><dt>Case</dt><dd>${k.cs} units</dd><dt>On hand</dt><dd>${fmt.n(onHand(k.id))}</dd><dt>Reserved</dt><dd>${fmt.n(allocated(k.id))}</dd><dt>Available</dt><dd>${fmt.n(avail(k.id))}</dd><dt>Reorder at</dt><dd>${fmt.n(k.reorder)}</dd></dl>
      <h3 class="lbl-m" style="font-size:11px;margin-bottom:8px">Bins</h3><ul class="picklist">${binsOf(k.id).map((b) => `<li><span>${ic("box")}</span><b class="mono">${b.code}</b><span>${cases(k, b.qty)} cases</span><b class="mono">${b.qty}</b></li>`).join("") || "<li><span></span><span></span><span class='muted'>Not in any bin</span><span></span></li>"}</ul>`,
    foot: `<button type="button" class="btn" data-edit>${ic("edit")}Edit</button><button type="button" class="btn" data-cnt>Count</button><button type="button" class="btn pri" data-sch>Order more</button>`,
  });
  dr.el.querySelector("[data-edit]").addEventListener("click", () => { dr.close(); skuModal(k); });
  dr.el.querySelector("[data-cnt]").addEventListener("click", () => { dr.close(); countModal(k); });
  dr.el.querySelector("[data-sch]").addEventListener("click", () => { dr.close(); schedModal(k.sid); });
}
function skuModal(k) {
  formModal({
    title: k ? "Edit item" : "Add item", submit: k ? "Save" : "Add item",
    values: k || { cat: "Spice mix", cs: 24, price: 200, whole: 150, cost: 90, reorder: 120, qty: 0 },
    fields: [
      { name: "name", label: "Item name", required: 1, full: 1 },
      { name: "cat", label: "Category", type: "select", options: Object.keys(CAT_C) },
      { name: "sid", label: "Supplier", type: "select", options: D().suppliers.map((s) => ({ value: s.id, label: s.name })), validate: (v) => (sup(v) ? "" : "Add a supplier first") },
      { name: "price", label: "Retail price (Rs)", type: "number", min: 1, required: 1 },
      { name: "whole", label: "Trade price (Rs)", type: "number", min: 1, required: 1, validate: (v, a) => (v > a.price ? "Trade price should not be above retail" : "") },
      { name: "cost", label: "Unit cost (Rs)", type: "number", min: 0, required: 1 },
      { name: "cs", label: "Units per case", type: "number", min: 1, max: 200, required: 1 },
      { name: "reorder", label: "Reorder level (units)", type: "number", min: 0, required: 1 },
      ...(k ? [] : [{ name: "qty", label: "Opening units (put away now)", type: "number", min: 0, required: 1 }]),
    ],
    onSubmit: (v) => {
      const rec = { name: v.name, cat: v.cat, sid: v.sid, price: v.price, whole: v.whole, cost: v.cost, cs: v.cs, reorder: v.reorder };
      if (k) Object.assign(k, rec);
      else { const n = Object.assign({ id: "k" + Date.now(), sku: "KSW-" + (101 + D().skus.length + Math.floor(Math.random() * 50)) }, rec); D().skus.push(n); if (v.qty > 0) { const out = putAway(n.id, v.qty); if (!out.length) toast("No empty bin left; stock not placed", "warn"); } }
      save(); R.refresh(); toast(k ? `${v.name} updated` : `${v.name} added`);
    },
  });
}
async function deleteSku(k) {
  if (D().orders.some((o) => ["New", "Picking", "Packed"].includes(o.status) && o.lines.some((l) => l.kid === k.id))) return toast(`${k.name} is on open orders; finish them first`, "warn");
  if (!(await confirmDlg(`Delete ${esc(k.name)} and empty its bins?`, { title: "Delete item?" }))) return;
  binsOf(k.id).forEach((b) => (D().bins[b.code] = { kid: null, qty: 0, at: 0 }));
  D().skus = D().skus.filter((x) => x !== k); save(); R.refresh(); toast(`${k.name} deleted`, "warn");
}
function supDrawer(s) {
  if (!s) return;
  const ins = D().inbound.filter((i) => i.sid === s.id).sort((a, b) => b.eta - a.eta);
  const dr = drawer({ title: esc(s.name), body: `<dl class="dl"><dt>City</dt><dd>${esc(s.city)}</dd><dt>Contact</dt><dd>${esc(s.contact)}</dd><dt>Phone</dt><dd>${esc(s.phone)}</dd><dt>Lead time</dt><dd>${s.lead} days</dd><dt>Fill rate</dt><dd>${(s.fill * 100).toFixed(1)}%</dd></dl><h3 class="lbl-m" style="font-size:11px;margin-bottom:8px">Deliveries</h3><ul class="mlist">${ins.map((i) => `<li><span class="tagm">${esc(i.id)}</span><div>${sum(i.lines, (l) => l.cases)} cases<small>${fmt.date(i.eta)}</small></div>${badge(i.status, i.status === "Received" ? "ok" : "info")}</li>`).join("") || "<li class='muted'>No deliveries yet</li>"}</ul>`, foot: `<button type="button" class="btn" data-edit>${ic("edit")}Edit</button><button type="button" class="btn pri" data-sch>Schedule delivery</button>` });
  dr.el.querySelector("[data-edit]").addEventListener("click", () => { dr.close(); supModal(s); });
  dr.el.querySelector("[data-sch]").addEventListener("click", () => { dr.close(); schedModal(s.id); });
}
function supModal(s) {
  formModal({
    title: s ? "Edit supplier" : "Add supplier", submit: s ? "Save" : "Add supplier", values: s || { lead: 3, city: "Karachi" },
    fields: [{ name: "name", label: "Company", required: 1, full: 1 }, { name: "city", label: "City", type: "select", options: PK.cities.concat(["Gwadar", "Jhelum"]) }, { name: "lead", label: "Lead time (days)", type: "number", min: 1, max: 60, required: 1 }, { name: "contact", label: "Contact person", required: 1 }, { name: "phone", label: "Phone", type: "tel", required: 1, placeholder: "03xx-xxxxxxx" }],
    onSubmit: (v) => { const rec = { name: v.name, city: v.city, lead: v.lead, contact: v.contact, phone: v.phone }; if (s) Object.assign(s, rec); else D().suppliers.push(Object.assign({ id: "s" + Date.now(), fill: 0.95 }, rec)); save(); R.refresh(); toast(s ? `${v.name} updated` : `${v.name} added`); },
  });
}
async function deleteSup(s) {
  const n = D().skus.filter((k) => k.sid === s.id).length;
  if (n) return toast(`${s.name} supplies ${n} item${n > 1 ? "s" : ""}; reassign them first`, "warn");
  if (!(await confirmDlg(`Delete ${esc(s.name)}?`, { title: "Delete supplier?" }))) return;
  D().suppliers = D().suppliers.filter((x) => x !== s); save(); R.refresh(); toast(`${s.name} deleted`, "warn");
}
function custDrawer(c) {
  if (!c) return;
  const os = D().orders.filter((o) => o.cid === c.id).sort((a, b) => b.placed - a.placed);
  const dr = drawer({ title: esc(c.name), body: `<dl class="dl"><dt>Type</dt><dd>${esc(c.type)}</dd><dt>City</dt><dd>${esc(c.city)}</dd><dt>Phone</dt><dd>${esc(c.phone)}</dd><dt>Terms</dt><dd>${c.terms ? c.terms + " days credit" : "Paid upfront"}</dd><dt>Balance</dt><dd>${money(c.balance)}</dd></dl><h3 class="lbl-m" style="font-size:11px;margin-bottom:8px">Orders</h3><ul class="mlist">${os.map((o) => `<li><span class="tagm">#${o.id}</span><div>${money(o.total)}<small>${fmt.date(o.placed)}</small></div>${badge(o.status, O_B[o.status])}</li>`).join("") || "<li class='muted'>No orders yet</li>"}</ul>`, foot: `${c.balance ? `<button type="button" class="btn" data-pay>Record payment</button>` : ""}<button type="button" class="btn pri" data-ord>New order</button>` });
  const p = dr.el.querySelector("[data-pay]"); if (p) p.addEventListener("click", () => { dr.close(); payModal(c); });
  dr.el.querySelector("[data-ord]").addEventListener("click", () => { dr.close(); orderModal(c.id); });
}
function payModal(c) {
  formModal({
    title: `Payment from ${esc(c.name)}`, submit: "Record payment", values: { amt: c.balance, how: "Bank transfer" },
    fields: [{ name: "amt", label: "Amount (Rs)", type: "number", min: 1, required: 1, validate: (v) => (v > c.balance ? `Balance is only ${money(c.balance)}` : "") }, { name: "how", label: "Method", type: "select", options: ["Bank transfer", "Cheque", "Cash"] }],
    onSubmit: (v) => { c.balance -= v.amt; save(); R.refresh(); toast(`${money(v.amt)} received from ${c.name} by ${v.how.toLowerCase()}`); },
  });
}
function custModal() {
  formModal({
    title: "Add customer", submit: "Add customer", values: { type: "Wholesale", city: "Karachi" },
    fields: [{ name: "name", label: "Name or shop name", required: 1, full: 1 }, { name: "type", label: "Type", type: "select", options: ["Wholesale", "Distributor", "Online"] }, { name: "city", label: "City", type: "select", options: PK.cities }, { name: "phone", label: "Phone", type: "tel", required: 1, placeholder: "03xx-xxxxxxx", full: 1 }],
    onSubmit: (v) => { D().customers.push({ id: "c" + Date.now(), name: v.name, type: v.type, city: v.city, phone: v.phone, terms: v.type === "Online" ? 0 : 30, balance: 0 }); save(); R.refresh(); toast(`${v.name} added`); },
  });
}

/* ================= Shell ================= */
function paintShell() {
  const s = D().settings;
  $("#co-name").textContent = s.company;
  const n = D().orders.filter((o) => o.status === "New").length, dk = D().inbound.filter((i) => i.status === "At dock").length;
  const a = $("#nb-pick"), b = $("#nb-rec"); if (a) { a.textContent = n; a.hidden = !n; } if (b) { b.textContent = dk; b.hidden = !dk; }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-neworder],[data-checkin],[data-sched],[data-addsku],[data-addsup],[data-addcust],[data-shipall],[data-exportorders],[data-exportsales]");
  if (!b) return;
  if (b.hasAttribute("data-neworder")) orderModal();
  else if (b.hasAttribute("data-checkin")) checkIn(D().inbound.find((i) => i.id === b.dataset.checkin));
  else if (b.hasAttribute("data-sched")) schedModal(b.dataset.sched || null);
  else if (b.hasAttribute("data-addsku")) skuModal();
  else if (b.hasAttribute("data-addsup")) supModal();
  else if (b.hasAttribute("data-addcust")) custModal();
  else if (b.hasAttribute("data-shipall")) { const p = D().orders.filter((o) => o.status === "Packed"); if (!p.length) return toast("No packed orders to ship", "info"); p.forEach((o) => moveOrder(o, "Shipped")); R.refresh(); toast(`${p.length} orders handed to ${D().settings.courier}`); }
  else if (b.hasAttribute("data-exportorders")) downloadCSV("orders.csv", [["Order", "Placed", "Customer", "Channel", "Units", "Total", "Status"], ...D().orders.map((o) => [o.id, fmt.dt(o.placed), cName(o.cid), channel(o), sum(o.lines, (l) => l.qty), o.total, o.status])]);
  else if (b.hasAttribute("data-exportsales")) downloadCSV("sales.csv", [["Day", "Online", "Wholesale"], ...kpiSpark(90, (o) => [fmt.iso(TODAY + o * DAY), histAt("on", o), histAt("ws", o)])]);
});
const ROUTES = [
  { id: "overview", label: "Overview", icon: "grid", render: Pages.overview },
  { id: "orders", label: "Orders", icon: "receipt", render: Pages.orders },
  { id: "picking", label: "Picking", icon: "list", render: Pages.picking },
  { id: "inventory", label: "Inventory", icon: "box", render: Pages.inventory },
  { id: "receiving", label: "Receiving", icon: "truck", render: Pages.receiving },
  { id: "warehouse", label: "Warehouse", icon: "warehouse", render: Pages.warehouse },
  { id: "suppliers", label: "Suppliers", icon: "building", render: Pages.suppliers },
  { id: "customers", label: "Customers", icon: "users", render: Pages.customers },
  { id: "reports", label: "Reports", icon: "chart", render: Pages.reports },
  { id: "settings", label: "Settings", icon: "settings", render: Pages.settings },
];
$("[data-nav]").insertAdjacentHTML("beforeend", ROUTES.map((r) => `<a href="#/${r.id}">${ic(r.icon)}<span>${r.label}</span>${r.id === "picking" ? '<span class="num-b" id="nb-pick"></span>' : r.id === "receiving" ? '<span class="num-b" id="nb-rec"></span>' : ""}</a>`).join(""));
$("[data-menu-btn]").innerHTML = ic("menu");
$("[data-cmdk]").innerHTML = ic("search");
const R = Router({
  routes: ROUTES, def: "overview", main: $("#main"), title: "Stackroom",
  onRoute: (id) => { const r = ROUTES.find((x) => x.id === id); $("#pt").textContent = r.label; $("#crumb").textContent = D().settings.company + " / Warehouse KHI-1"; paintShell(); },
});
seedBell();
R.start();
Cmdk.add([
  { label: "New order", icon: "plus", hint: "Action", run: () => orderModal() },
  { label: "Check in a delivery at the dock", icon: "truck", hint: "Action", run: () => { const i = D().inbound.find((x) => x.status === "At dock"); if (i) checkIn(i); else toast("No trucks at the dock", "info"); } },
  { label: "Schedule a delivery", icon: "cal", hint: "Action", run: () => schedModal() },
  { label: "Add item", icon: "box", hint: "Action", run: () => skuModal() },
  { label: "Add customer", icon: "user", hint: "Action", run: () => custModal() },
  { label: "Switch theme", icon: "moon", hint: "Action", run: () => Theme.toggle() },
]);
</script>
</body>
</html>
