<html lang="en">
<head>
<meta charset="utf-8">

<title>Needledrop · record shop desk</title>
<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-needledrop:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Needledrop look: warm 70s record shop ---------- */
:root {
  --font: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.7, .5, 1);
  --bg: #f3e6cc; --surface: #fbf3e1; --surface2: #efdfbf; --ink: #2b1d16; --muted: #7b6250; --line: #2b1d16; --soft: rgba(43, 29, 22, .16); --line-strong: #2b1d16;
  --accent: #e0662c; --accent-ink: #fff8ec; --ok: #2b7a62; --warn: #c7860d; --err: #c43c33; --focus: #2b6f9f;
  --c1: #e0662c; --c2: #2b6f69; --c3: #e8b33a; --c4: #8e4fa5; --c5: #3c7fb5; --c6: #d94f4f;
  --side: #2b1d16; --side-ink: #f3e6cc; --side-mut: #c4a98d;
  --r: 18px; --r-sm: 12px; --r-btn: 999px; --overlay: rgba(43, 29, 22, .5); --tip-bg: #2b1d16; --tip-ink: #f3e6cc; --grid: rgba(43, 29, 22, .12);
  --chip-on: #2b1d16; --chip-on-ink: #f3e6cc;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #1b1310; --surface: #261b16; --surface2: #33251e; --ink: #f6e7cf; --muted: #c2a68b; --line: #f6e7cf; --soft: rgba(246, 231, 207, .14); --line-strong: #f6e7cf;
  --accent: #f07a3f; --accent-ink: #1b1310; --ok: #5cc9a3; --warn: #f1bf4f; --err: #ff7468;
  --c1: #f07a3f; --c2: #4fb3a8; --c3: #f1bf4f; --c4: #c08ad6; --c5: #6fa9dc; --c6: #ff7468;
  --side: #120c0a; --overlay: rgba(0, 0, 0, .6); --tip-bg: #f6e7cf; --tip-ink: #1b1310; --grid: rgba(246, 231, 207, .1); --chip-on: #f6e7cf; --chip-on-ink: #1b1310;
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
body { background: var(--bg) radial-gradient(circle at 1px 1px, var(--soft) 1px, transparent 1.5px) 0 0 / 18px 18px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 10px; }
.skip:focus { left: 8px; }
.grow { flex: 1; } .mut { color: var(--muted); font-size: 13px; }
.btn { border: 2.5px solid var(--line); font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--line); }
.btn.danger { border-color: var(--line); }
.ibtn { border: 2.5px solid var(--line); border-radius: 50%; box-shadow: 0 3px 0 var(--line); }
.k-modal, .k-pop { border: 3px solid var(--line); box-shadow: 0 8px 0 var(--line), 0 30px 60px rgba(0, 0, 0, .3); }
.k-mh h2 { font-weight: 900; }
.k-chip { border: 2px solid var(--line); color: var(--ink); font-weight: 700; }
.k-search, .k-field input, .k-field select, .k-field textarea, .k-input { border: 2.5px solid var(--line); }
.k-table th { border-bottom: 2.5px solid var(--line); color: var(--ink); }
.k-table td { border-bottom: 1.5px dashed var(--soft); }
.k-seg { border: 2.5px solid var(--line); background: var(--surface); }
.k-seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.k-badge { border: 1.5px solid currentColor; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); color: var(--side-ink); padding: 18px 0 18px 14px; display: flex; flex-direction: column; gap: 18px; z-index: 50; background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .02) 0 2px, transparent 2px 6px); }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; padding-right: 14px; }
.logo { width: 46px; height: 46px; animation: logoSpin 4s var(--ease) 1; }
@keyframes logoSpin { from { transform: rotate(-540deg); } }
.brand b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -.01em; }
.brand small { color: var(--side-mut); font-size: 12px; }
.nav { position: relative; display: flex; flex-direction: column; gap: 3px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px 0 0 16px; color: var(--side-mut); text-decoration: none; font-weight: 700; font-size: 14.5px; transition: color .25s; }
.nav a:hover { color: var(--side-ink); }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a .k-ic { width: 20px; height: 20px; }
.nav .k-marker { position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 18px 0 0 18px; background: var(--bg); transition: transform .5s var(--spring), height .3s; z-index: 0; }
.nav .k-marker::before, .nav .k-marker::after { content: ""; position: absolute; right: 0; width: 18px; height: 18px; background: transparent; }
.nav .k-marker::before { top: -18px; border-bottom-right-radius: 18px; box-shadow: 6px 6px 0 6px var(--bg); }
.nav .k-marker::after { bottom: -18px; border-top-right-radius: 18px; box-shadow: 6px -6px 0 6px var(--bg); }
.np { margin-top: auto; margin-right: 14px; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1.5px solid rgba(255, 255, 255, .1); }
.np-l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--side-mut); font-weight: 800; }
.np-r { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.np-r .cover { width: 44px; height: 44px; border-radius: 6px; flex: none; }
.np-r b { display: block; font-size: 13px; } .np-r small { color: var(--side-mut); font-size: 12px; }
.eq { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
.eq i { width: 4px; background: #e8b33a; border-radius: 2px; height: 30%; animation: eq 1s ease-in-out 6 alternate; }
.eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; } .eq i:nth-child(4) { animation-delay: .1s; } .eq i:nth-child(5) { animation-delay: .3s; }
@keyframes eq { to { height: 100%; } }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 26px; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.menu-btn { display: none; }
.search-btn { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 2.5px solid var(--line); background: var(--surface); color: var(--muted); min-width: 280px; font-weight: 700; }
.search-btn kbd { margin-left: auto; font: 800 11px var(--font); padding: 2px 7px; border-radius: 8px; background: var(--surface2); }
#view { padding: 8px 26px 48px; min-width: 0; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.ph h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
.ph p { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
.ph-act { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.k-in { animation-name: ndIn; animation-duration: .65s; animation-timing-function: var(--spring); }
@keyframes ndIn { from { opacity: 0; transform: translateY(24px) rotate(-1deg); } }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 2.5px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: 0 5px 0 var(--line); min-width: 0; transition: transform .3s var(--spring), box-shadow .3s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--line); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 18px; font-weight: 900; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px; }
.kpi { background: color-mix(in srgb, var(--t) 18%, var(--surface)); }
.kpi span { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi b { display: block; font-size: 27px; font-weight: 900; letter-spacing: -.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kx { font-size: 12px; color: var(--muted); min-height: 16px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.c-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; margin-bottom: 18px; }
.c-side { display: grid; gap: 18px; align-content: start; }
.g2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }

/* ---------- The takings record (signature) ---------- */
.deck { position: relative; width: 100%; max-width: 320px; margin: 0 auto; }
.vinyl { width: 100%; height: auto; display: block; overflow: visible; }
.disc { fill: #17100d; }
.groove { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 1; }
.track { fill: none; stroke: rgba(255, 255, 255, .06); stroke-width: 9; }
.ring { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-width .2s; cursor: default; }
.ring:hover { stroke-width: 12; }
.ring.k-anim { animation: kSweep 1.4s var(--ease) backwards; animation-delay: calc(.3s + var(--i) * 150ms); }
.lbl { fill: var(--c3); }
.lbl-arc { fill: none; stroke: rgba(43, 29, 22, .25); stroke-width: 2; }
.hole { fill: var(--surface); }
.spin { transform-origin: 130px 130px; }
.spin.go { animation: spin 7s cubic-bezier(.15, .6, .35, 1) 1; }
@keyframes spin { from { transform: rotate(-1440deg); } }
.arm { transform-origin: 268px 34px; }
.arm.drop { animation: arm 1.6s .2s var(--spring) backwards; }
@keyframes arm { from { transform: rotate(-32deg); } }
.arm-b { fill: #c9b9a4; stroke: #2b1d16; stroke-width: 3; }
.arm-s { fill: none; stroke: #d8c8b2; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .35)); }
.arm-h { fill: #2b1d16; }
.lbl-t { position: absolute; left: 43.33%; top: 48.15%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; color: #2b1d16; line-height: 1.1; }
.lbl-t small { display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; }
.lbl-t b { display: block; font-size: 19px; font-weight: 900; }
.lbl-t span { font-size: 10px; font-weight: 700; }
.vleg { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vleg li { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.vleg i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.vleg b { margin-left: auto; font-variant-numeric: tabular-nums; }
.sleeves { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.sleeve { display: flex; flex-direction: column; gap: 6px; border: 0; background: none; padding: 0; text-align: left; animation: ndIn .6s var(--spring) backwards; animation-delay: calc(var(--i) * 70ms + .2s); }
.sleeve .cover { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 2px solid var(--line); transition: transform .35s var(--spring); }
.sleeve:hover .cover { transform: rotate(-4deg) scale(1.06); }
.sleeve b { display: block; font-size: 12px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sleeve small { color: var(--muted); font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rlist li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; }
.rlist li:hover { background: var(--surface2); }
.rlist .cover { width: 38px; height: 38px; border-radius: 5px; flex: none; }
.rlist div { flex: 1; min-width: 0; }
.rlist div b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rlist small { color: var(--muted); font-size: 12px; }
.rlist li.fresh { animation: ndIn .7s var(--spring); background: color-mix(in srgb, var(--accent) 15%, transparent); }

/* ---------- Till: flip through the crate ---------- */
.tillw { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.ttools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.ttools .k-search { max-width: none; }
.crate { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.rec { position: relative; display: flex; flex-direction: column; padding: 0; border: 2.5px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; text-align: left; box-shadow: 0 4px 0 var(--line); transition: transform .35s var(--spring), box-shadow .3s; animation: ndIn .5s var(--spring) backwards; animation-delay: calc(var(--i) * 25ms); }
.rec .cover { width: 100%; aspect-ratio: 1; display: block; position: relative; z-index: 2; transition: transform .45s var(--spring); }
.rec-disc { position: absolute; left: 50%; top: 6px; width: 86%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, var(--c3) 0 16%, #17100d 17% 100%); z-index: 1; transition: transform .45s var(--spring); }
.rec:hover { transform: translateY(-4px); box-shadow: 0 8px 0 var(--line); }
.rec:hover .cover { transform: translateX(-14%); }
.rec:hover .rec-disc { transform: translateX(-28%); }
.rec.pulled .cover { animation: pull .5s var(--spring); }
@keyframes pull { 40% { transform: translateY(-30%) rotate(-6deg); } }
.rec[disabled] { opacity: .45; pointer-events: none; }
.rec-b { position: relative; z-index: 3; background: var(--surface); padding: 8px 10px 10px; display: grid; gap: 1px; border-top: 2.5px solid var(--line); }
.rec-b > b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-b small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-f { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.rec-f em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; }
.rec-f b { font-size: 13.5px; }
.bag { position: sticky; top: 82px; padding: 0; overflow: hidden; }
.bag:hover { transform: none; }
.bag-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; background: var(--ink); color: var(--bg); }
.bag-h b { font-size: 20px; font-weight: 900; }
.bag-l { list-style: none; margin: 0; padding: 8px 12px; max-height: 300px; overflow: auto; }
.bag-l li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1.5px dashed var(--soft); font-size: 13px; animation: ndIn .4s var(--spring); }
.bag-l li.k-emptyp { display: block; }
.bag-l .cover { width: 36px; height: 36px; border-radius: 5px; flex: none; }
.bag-l li > span:nth-child(2) { flex: 1; min-width: 0; }
.bag-l small { display: block; color: var(--muted); }
.q { display: inline-flex; align-items: center; gap: 2px; }
.q button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 900; line-height: 1; }
.q b { min-width: 20px; text-align: center; }
.bag-t { padding: 10px 16px; border-top: 2.5px solid var(--line); display: grid; gap: 4px; font-weight: 700; }
.bag-t div { display: flex; justify-content: space-between; }
.bag-t .tot { font-size: 22px; font-weight: 900; }
.bag-a { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 12px; }
.bag .big { width: calc(100% - 32px); margin: 0 16px 16px; }
.mini .cover, .mini { width: 38px; height: 38px; border-radius: 5px; display: block; flex: none; }

/* ---------- Mail, label, wants, gigs ---------- */
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.plain { list-style: none; margin: 0; padding: 0; }
.plain li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1.5px dashed var(--soft); font-size: 14px; }
.dh { font-size: 15px; font-weight: 900; margin: 16px 0 8px; }
.checks { display: grid; gap: 10px; }
.pk { display: inline-flex; gap: 4px; }
.pk i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.pk i.on { background: var(--ok); }
.rels { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
.rel { display: flex; gap: 16px; align-items: flex-start; }
.rel-art { position: relative; width: 110px; flex: none; }
.rel-art .cover { position: relative; z-index: 2; width: 110px; height: 110px; border-radius: 6px; border: 2.5px solid var(--line); display: block; transition: transform .45s var(--spring); }
.rel-v { position: absolute; top: 6px; left: 6px; width: 98px; height: 98px; border-radius: 50%; background: radial-gradient(circle, var(--c1) 0 15%, #17100d 16% 100%); z-index: 1; transition: transform .5s var(--spring); }
.rel:hover .rel-v { transform: translateX(42px) rotate(120deg); }
.rel-b { flex: 1; min-width: 0; display: grid; gap: 3px; }

Router.add("wants", "Wantlists", (v) => {
  const rows = S.customers.map((c) => { const hits = S.records.filter((r) => r.stock > 0 && c.wants.some((w) => w === r.artist)); return Object.assign({ hits: hits.length, hitList: hits }, c); });
  v.innerHTML = head("Wantlists", "Who is looking for what. When a match lands in the racks, text them.", `<button type="button" class="btn primary" data-act="addWant">${ic("plus")} Add a want</button>`) + `<div class="kpis k4">${kpi("Diggers", rows.length, "int", "", 1)}${kpi("Wants", sum(rows, (r) => r.wants.length), "int", "", 2)}${kpi("In stock now", rows.filter((r) => r.hits).length, "int", "<small>customers with a match</small>", 3)}${kpi("Texted", sum(rows, (r) => r.told.length), "int", "", 4)}</div><div class="card"><div id="wT"></div></div>`;
  table($("#wT", v), { rows: () => rows, keys: ["name", "phone", (c) => c.wants.join(" ")], chips: { values: ["All", "Has a match"], test: (c) => c.hits > 0 }, size: 9, caption: "Wantlists", cols: [{ label: "Customer", k: "name", f: (c) => `<div class="k-cellp">${avatar(c.name)}<div><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div></div>` }, { label: "Looking for", v: (c) => c.wants.join(), f: (c) => c.wants.map((w) => `<span class="want">${esc(w)}</span>`).join("") }, { label: "In the racks", k: "hits", f: (c) => (c.hits ? badge(c.hits + " match", "ok") : `<span class="mut">Not yet</span>`) }, { label: "", sort: false, f: (c) => (c.hits ? `<button type="button" class="btn sm primary" data-act="tell" data-id="${c.id}">${ic("chat")} Text</button>` : "") }] });
});
Object.assign(ACT, {
  tell: (b) => { const c = S.customers.find((x) => x.id === b.dataset.id), hits = S.records.filter((r) => r.stock > 0 && c.wants.includes(r.artist)); c.told.push(Date.now()); save(); toast(`Texted ${c.name}: ${hits.map((r) => r.title).slice(0, 2).join(", ")} is in`); b.disabled = true; b.textContent = "Sent"; },
  addWant: () => formModal({ title: "Add a want", fields: [{ k: "c", label: "Customer", type: "select", options: S.customers.map((c) => [c.id, c.name]), full: true }, { k: "w", label: "Artist they want", type: "select", options: ARTISTS, full: true }], save: (x) => { const c = S.customers.find((y) => y.id === x.c); if (c.wants.includes(x.w)) return "Already on their list"; c.wants.push(x.w); save(); toast(`${x.w} added to ${c.name}'s list`); Router.refresh(); return true; } })
});

/* ---------- Gigs ---------- */
Router.add("gigs", "Gigs", (v) => {
  const up = S.gigs.filter((g) => g.t > Date.now()).sort((a, b) => a.t - b.t), past = S.gigs.filter((g) => g.t <= Date.now());
  v.innerHTML = head("Gigs", "In-store shows in the back room. Selling a ticket adds to gig takings.", `<button type="button" class="btn primary" data-act="newGig">${ic("plus")} New gig</button>`)
    + `<div class="gigs">${up.map((g, i) => `<article class="card gig" style="--i:${i}"><div class="gdate"><b>${new Date(g.t).getDate()}</b><span>${MON[new Date(g.t).getMonth()]}</span><small>${WD[new Date(g.t).getDay()]} ${fmtTime(g.t)}</small></div><div class="gb"><b>${esc(g.name)}</b><div class="press"><i style="width:${((g.sold / g.cap) * 100).toFixed(0)}%"></i></div><small>${g.sold} of ${g.cap} tickets · ${money(g.price)} each</small><div class="ga"><button type="button" class="btn sm primary" data-act="sellTix" data-id="${g.id}"${g.sold >= g.cap ? " disabled" : ""}>${ic("plus")} Sell ticket</button><span>${money(g.sold * g.price)} taken</span></div></div></article>`).join("") || `<div class="card"><p class="k-emptyp">No gigs booked. Add one.</p></div>`}</div>
    <div class="card"><div class="card-h"><h2>Past gigs</h2></div><ul class="plain">${past.map((g) => `<li><span>${esc(g.name)} · ${fmtDate(g.t)}</span><b>${g.sold}/${g.cap} · ${money(g.sold * g.price)}</b></li>`).join("") || `<li class="k-emptyp">None yet</li>`}</ul></div>`;
});
Object.assign(ACT, {
  sellTix: (b) => { const g = S.gigs.find((x) => x.id === b.dataset.id); payModal(g.price, (pay) => { g.sold++; addRev(2, Date.now(), g.price); save(); toast(`Ticket sold for ${g.name} (${pay.method})`); Router.refresh(); }); },
  newGig: () => formModal({ title: "New gig", fields: [{ k: "name", label: "Who is playing", req: true, full: true }, { k: "date", label: "Date", type: "date", req: true }, { k: "cap", label: "Capacity", type: "number", min: 10, step: 1, req: true }, { k: "price", label: "Ticket price (Rs)", type: "number", min: 0, req: true }], values: { date: isoDate(Date.now() + 14 * DAY), cap: 60, price: 1500 }, save: (x) => { const t = new Date(x.date + "T20:00").getTime(); if (t < Date.now()) return "Pick a future date"; S.gigs.push({ id: "G" + Date.now().toString(36), name: x.name, t, cap: Math.round(x.cap), sold: 0, price: Math.round(x.price) }); save(); toast("Gig booked"); Router.refresh(); return true; } })
});

/* ---------- Takings report ---------- */
let rRange = "30D";
Router.add("reports", "Takings", (v) => {
  v.innerHTML = head("Takings", "Money in, by channel, format and genre.", `${seg("tr", ["7D", "30D", "12M"], rRange, "Range")}<button type="button" class="btn" data-act="exportTake">${ic("download")} CSV</button>`)
    + `<div class="kpis k4" id="tK"></div><div class="g2"><div class="card"><div class="card-h"><h2>Takings by channel</h2></div><div id="tLine"></div></div><div class="card"><div class="card-h"><h2>Channel share</h2></div><div id="tDon"></div></div></div><div class="g2"><div class="card"><div class="card-h"><h2>Records in stock by genre</h2></div><div id="tGen"></div></div><div class="card"><div class="card-h"><h2>Busy hours at the counter</h2><span class="mut">last 6 days</span></div><div id="tHeat"></div></div></div>`;
  segWire($(".ph-act", v), "tr", (x) => { rRange = x; drawTake(); });
  drawTake();
  hbars($("#tGen", v), GENRES.map((g, i) => ({ name: g, value: sum(S.records.filter((r) => r.genre === g), (r) => r.stock), color: `var(--c${(i % 4) + 1})` })).sort((a, b) => b.value - a.value), (n) => num(n) + " records");
  const hrs = Array.from({ length: 11 }, (_, i) => 11 + i), order = [1, 2, 3, 4, 5, 6, 0], grid = order.map(() => hrs.map(() => 0));
  S.sales.forEach((x) => { const d = new Date(x.t), h = d.getHours() - 11; if (h >= 0 && h < 11) grid[order.indexOf(d.getDay())][h]++; });
  heat($("#tHeat", v), { rows: order.map((d) => WD[d]), cols: hrs.map((h) => (h > 12 ? h - 12 + "p" : h + (h === 12 ? "p" : "a"))), data: grid, fmt: (n) => n + " sales", color: "var(--c1)" });
});
function drawTake() {
  const all = S.d.rev.reduce((a, r) => a.map((x, k) => x + r[k]), zeros()), k = $("#tK"); if (!k) return;
  k.innerHTML = kpi("Total", rangeSum(all, rRange), "money", delta(rangeDelta(all, rRange)), 1) + CH.slice(0, 3).map((c, i) => kpi(c, rangeSum(S.d.rev[i], rRange), "money", delta(rangeDelta(S.d.rev[i], rRange)), i + 2)).join("");
  counts(k);
  const a = byRange(S.d.rev[0], rRange);
  lineChart($("#tLine"), { labels: a.labels, series: CH.map((c, i) => ({ name: c, data: byRange(S.d.rev[i], rRange).data, color: CHC[i] })), fmt: short, tip: money, h: 240, area: false, label: "Takings by channel" });
  donut($("#tDon"), { items: CH.map((c, i) => ({ name: c, value: rangeSum(S.d.rev[i], rRange), color: CHC[i] })), fmt: moneyS, sub: rRange, size: 170 });
}
ACT.exportTake = () => csv("needledrop-takings.csv", Array.from({ length: 30 }, (_, i) => D - 30 + i), [["Date", (i) => isoDate(today0() - (D - 1 - i) * DAY)]].concat(CH.map((c, k) => [c, (i) => S.d.rev[k][i]])));

/* ---------- Settings ---------- */
Router.add("settings", "Settings", (v) => {
  v.innerHTML = head("Settings", "Shop details, the daily target and royalty rate.", "") + `<div class="g2"><form class="card" id="sF" novalidate><div class="card-h"><h2>Shop</h2></div>${fieldsHTML([{ k: "shop", label: "Shop name", req: true, full: true }, { k: "city", label: "City", type: "select", options: CITIES }, { k: "target", label: "Daily target (Rs)", type: "number", min: 1000, req: true }, { k: "royalty", label: "Artist royalty %", type: "number", min: 0, max: 60, req: true }], S.cfg)}<div class="set-f"><button class="btn primary" type="submit">Save</button></div></form><div class="card"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Day or late-night shop</small></div><button type="button" class="btn" data-act="theme">${ic("moon")} Switch</button></div><div class="set-row"><div><b>Reset demo data</b><small>Restock the sample crates</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const f = $("#sF", v);
  f.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(f, [{ k: "shop", label: "Shop", req: true }, { k: "city", label: "City" }, { k: "target", label: "Target", type: "number", min: 1000, req: true }, { k: "royalty", label: "Royalty", type: "number", min: 0, max: 60, req: true }]); if (!x) return; Object.assign(S.cfg, x); save(); toast("Saved"); });
});
ACT.reset = () => confirmBox("Reset all demo data on this device?", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); Cart.clear(); save(); nowPlaying(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset" });

/* ---------- Boot ---------- */
S = loadState(seedData, VER);
paintIcons(); Theme.label(); nowPlaying();
Timers.every(60000, nowPlaying, false);
CMDS = [{ label: "Add a record", run: () => recordForm(null) }, { label: "Open the till", run: () => (location.hash = "#/till") }, { label: "Book a gig", run: ACT.newGig }, { label: "Switch theme", run: () => Theme.toggle() }];
Notes.add(`${S.mail.filter((o) => o.status === "New").length} mail orders to pack`, "warn");
Notes.add(`${S.customers.filter((c) => S.records.some((r) => r.stock > 0 && c.wants.includes(r.artist))).length} wantlists have a match in the racks`, "ok");
Notes.add(`${S.releases[0].title} is nearly sold out, think about a repress`, "info");
Router.start();

</script>
</body>
</html>
