<!doctype html>
<!-- Chill & Craft · Freelane · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freelane · Banking for one-person businesses</title>
<meta name="description" content="A business banking app for freelancers and tiny studios: balance with a forecast, invoices, pots that split every payment, cards, transfers and insights.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem("cc-freelane-1:theme")); } catch (e) { s = null; }
    var t = q === "light" || q === "dark" ? q : s || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* =========================================================
   Base: shared structure. The skin below sets the colours,
   shapes and layout that make this dashboard its own.
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-h,inherit);margin:0;line-height:1.2}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted,.mut{color:var(--muted)}
.sm{font-size:.86em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w,240px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--side,var(--panel));color:var(--side-ink,var(--ink));overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.15em;padding:4px 8px 14px}
.brand svg{width:30px;height:30px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm,8px);text-decoration:none;color:var(--side-mut,var(--muted));font-weight:600;transition:color .2s}
.nav a:hover{color:var(--side-ink,var(--ink))}
.nav a[aria-current="page"]{color:var(--nav-on,var(--acc-ink))}
.nav-marker{position:absolute;left:0;top:0;width:100%;height:40px;border-radius:var(--r-sm,8px);background:var(--acc);opacity:0;transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s,width .3s,opacity .2s;pointer-events:none;z-index:0}
.nav-sec{font-size:.7em;text-transform:uppercase;letter-spacing:.14em;color:var(--side-mut,var(--muted));padding:14px 12px 4px;opacity:.8}
.nav-n{margin-left:auto;font-style:normal;font-size:.72em;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.main{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 26px;background:var(--top-bg,transparent)}
.top h1{font-size:1.35em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:6px 26px 40px;outline:none}
.menu-btn{display:none!important}
.nav-scrim{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.ph h2{font-size:1.45em;margin-right:auto}
.ph p{width:100%;margin:0;color:var(--muted)}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}
 body.nav-open .side{transform:none}
 body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;animation:fadeIn .25s}
 .menu-btn{display:inline-grid!important}
 .top{padding:12px 16px}
 .view{padding:4px 16px 32px}
}

/* ---------- Grid and cards ---------- */
.grid{display:grid;gap:var(--gap,16px);margin-bottom:var(--gap,16px)}
.g-k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.span2{grid-column:span 2}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--panel);border:var(--card-bd,1px solid var(--line));border-radius:var(--r,14px);padding:var(--pad,18px);box-shadow:var(--shadow,none);transition:transform .3s cubic-bezier(.3,.8,.3,1),box-shadow .3s,border-color .3s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h,var(--shadow,none))}
.card.flat:hover{transform:none}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{font-size:1.02em;margin-right:auto}
.ch .sub{color:var(--muted);font-size:.84em;font-weight:500}
.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:650}
.li small{color:var(--muted)}

/* ---------- KPI cards ---------- */
.kpi{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.kpi-i{position:absolute;right:14px;top:14px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--acc)}
.kpi-l{color:var(--muted);font-size:.84em;font-weight:650}
.kpi-v{font-size:1.65em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--font-n,inherit);white-space:nowrap}
.kpi-d{display:inline-flex;align-items:center;gap:2px;font-size:.8em;font-weight:700}
.kpi-d small{font-weight:500;color:var(--muted)}
.kpi-d .i{width:15px;height:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi-s{font-size:.82em;color:var(--muted)}
.kpi-sp{margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-btn,var(--r-sm,9px));cursor:pointer;font-weight:650;font-size:.93em;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s,color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn:active,.icon-btn:active,.chip:active,.seg button:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:var(--btn-sh,none)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.84em}
.btn .i{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm,9px);cursor:pointer;transition:transform .12s,background .2s,border-color .2s;flex:none;padding:0}
.icon-btn:hover{border-color:var(--acc)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm .i{width:15px;height:15px}
.icon-btn[disabled]{opacity:.4;cursor:default}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ring{animation:ring .7s}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
[data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
.kbd{font-size:.75em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- Inputs and forms ---------- */
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-in,var(--r-sm,9px));background:var(--in-bg,var(--panel));color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=range]{padding:0;min-height:24px;accent-color:var(--acc);border:0;background:none;box-shadow:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:.84em;font-weight:650;color:var(--muted)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:.8em}
.err:empty{display:none}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog span{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);transition:background .25s;flex:none}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span::after{transform:translateX(17px)}
.tog input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.srch input{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.84em;font-weight:650;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--r-sm,9px);background:var(--panel2);border:1px solid var(--line);flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-weight:650;font-size:.84em;color:var(--muted);cursor:pointer;border-radius:calc(var(--r-sm,9px) - 2px);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--seg-on,var(--ink))}
.seg-th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-sm,9px) - 2px);background:var(--seg-th,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .3s}

/* ---------- Tables ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar .srch{flex:1 1 200px;max-width:320px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92em}
.tbl th{text-align:left;font-size:.76em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num,.tbl td.num{text-align:right}
.th-s{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.th-s:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th-s .ar{opacity:.45;font-size:.85em}
[aria-sort] .th-s{color:var(--ink)}
[aria-sort] .ar{opacity:1;color:var(--acc)}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover,tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--acc) 8%,transparent))}
tr.click:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.rows-in tr{animation:rowIn .4s both;animation-delay:calc(var(--ri,0) * 30ms)}
@keyframes rowIn{from{opacity:0;translate:0 6px}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85em;color:var(--muted)}
.pg-b{display:flex;gap:4px;align-items:center}
.pgn{min-width:30px;height:30px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;font-weight:650;color:var(--muted)}
.pgn[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.cell2{display:flex;align-items:center;gap:10px;min-width:0}
.cell2 b{display:block;font-weight:650}
.cell2 small{display:block;color:var(--muted);font-size:.85em}

/* ---------- Status pills, avatars, meters ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.77em;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--pc,var(--muted)) 15%,transparent);color:var(--pc,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-paid,.s-approved,.s-active,.s-valid,.s-signed,.s-done,.s-accepted,.s-booked{--pc:var(--ok)}
.s-sent,.s-review,.s-open,.s-scheduled,.s-partial{--pc:var(--info)}
.s-pending,.s-expiring,.s-unsigned,.s-leave{--pc:var(--warn)}
.s-overdue,.s-rejected,.s-expired,.s-frozen,.s-cancelled,.s-declined{--pc:var(--bad)}
.s-draft{--pc:var(--muted)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-av,50%);background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 26%);font-weight:800;font-size:.76em;flex:none;letter-spacing:.02em}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:54px;height:54px;font-size:1em}
.av.sm{width:26px;height:26px;font-size:.66em}
.meter{display:block;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--acc);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.6}
.empty b{color:var(--ink)}
.empty.sm{padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.88em}
.kv dd{margin:0;font-weight:600;text-align:right}

/* ---------- Modals, drawers, menus, command search ---------- */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.ov-bg{position:absolute;inset:0;background:var(--ov,rgba(10,12,20,.5));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.dlg{position:relative;width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;background:var(--dlg-bg,var(--panel));color:var(--ink);border:1px solid var(--line);border-radius:var(--r-dlg,var(--r,16px));box-shadow:0 30px 80px rgba(0,0,0,.35);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1.1)}
.ov.open .ov-bg{opacity:1}
.ov.open .dlg{opacity:1;transform:none}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dlg-h h2{font-size:1.12em;margin-right:auto}
.dlg-b{padding:6px 18px 16px;overflow:auto}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.ov.sm .dlg{width:min(400px,100%)}
.ov.wide .dlg{width:min(760px,100%)}
.ov.xl .dlg{width:min(1120px,100%);max-height:94vh}
.ov.drawer{place-items:stretch end;padding:0}
.ov.drawer .dlg{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(100%)}
.ov.drawer.wide .dlg{width:min(640px,100%)}
.ov.drawer.open .dlg{transform:none}
.ov.pop{place-items:start end;padding:64px 16px 16px}
.ov.pop .ov-bg,.ov.menu .ov-bg{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.ov.pop .dlg{width:min(370px,100%);transform:translateY(-8px) scale(.98);transform-origin:top right}
.ov.menu{display:block;padding:0}
.ov.menu .dlg{position:fixed;width:220px;transform:translateY(-6px);border-radius:12px}
.ov.menu .dlg-h{padding:10px 12px 4px}
.ov.menu .dlg-h h2{font-size:.76em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ov.menu .dlg-h .icon-btn{display:none}
.ov.menu .dlg-b{padding:2px 6px 6px}
.mnu{display:flex;flex-direction:column}
.mi{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--panel2)}
.mi[disabled]{opacity:.55;cursor:default}
.ov.cmdk{place-items:start center;padding-top:12vh}
.cmd-l{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cmd-l button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.cmd-l [aria-selected="true"] button,.cmd-l button:hover{background:var(--panel2)}
.cmd-l small{color:var(--muted)}
.srch.big input{min-height:46px;font-size:1.05em}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.notes li{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.notes li.new{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.notes li small{display:block;color:var(--muted);font-size:.8em}
.notes .i{color:var(--acc);margin-top:2px}
@media (max-width:560px){.ov{padding:0;place-items:end stretch}.ov .dlg{width:100%;border-radius:var(--r-dlg,16px) var(--r-dlg,16px) 0 0;max-height:92vh}.ov.drawer .dlg{border-radius:0}.ov.pop{padding:56px 8px 8px}.ov.menu .dlg{width:220px;border-radius:12px}.ov.cmdk{padding-top:0}}

/* ---------- Toasts and tooltip ---------- */
.toasts{position:fixed;right:18px;bottom:var(--toast-b,18px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm,10px);background:var(--toast-bg,#16181d);color:var(--toast-ink,#fff);box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;font-size:.92em;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:min(380px,calc(100vw - 36px))}
.toast.show{opacity:1;transform:none}
.toast .i{color:var(--ok)}.toast.bad .i{color:var(--bad)}.toast.warn .i{color:var(--warn)}
.t-undo{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
@media (max-width:560px){.toasts{left:12px;right:12px;align-items:stretch}}
.tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip div i{width:8px;height:8px;border-radius:3px;flex:none}
.tip div span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tip .mut{opacity:.75;display:block}

/* ---------- Charts ---------- */
.chart{position:relative;min-width:0;outline:none}
.chart svg{display:block;overflow:visible}
.chart:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.gl{stroke:var(--grid,var(--line));stroke-dasharray:3 4}
.zl{stroke:var(--muted);stroke-width:1;opacity:.6}
.ax{fill:var(--muted);font-size:11px;font-family:var(--font-n,inherit)}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 6;opacity:.9}
.ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawOn 1.3s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes drawOn{to{stroke-dashoffset:0}}
.ar.fade,.band.fade{animation:fadeIn 1.2s .35s both}
.band{opacity:.2}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--panel);stroke-width:2.5}
.bar{transition:opacity .2s}
.bar.dim{opacity:.35}
.bar.grow{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .75s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d,0ms)}
.bar.grow.neg{transform-origin:50% 0}
@keyframes barUp{from{transform:scaleY(0)}}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82em;color:var(--muted);margin-bottom:8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.spk{display:block;overflow:visible}
.spk .ln{stroke-width:2}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dn-w{position:relative;flex:none}
.seg-bg{fill:none;stroke:var(--panel2)}
.dseg{fill:none;transition:opacity .2s;cursor:pointer}
.dseg.dim{opacity:.28}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.25em;font-weight:800}
.dn-c small{color:var(--muted);font-size:.76em}
.dn-l{list-style:none;margin:0;padding:0;flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dn-l li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.88em;transition:background .2s;outline-offset:-2px}
.dn-l li.on{background:var(--panel2)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);font-size:.9em;min-width:34px;text-align:right}
.hb{margin-bottom:11px}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:.88em;margin-bottom:5px}
.hb-l small{display:block;color:var(--muted);font-size:.85em}
.hb-t{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.gg{position:relative;max-width:240px;margin:0 auto}
.gg svg{display:block}
.gg-bg,.gg-v{fill:none;stroke-linecap:round}
.gg-bg{stroke:var(--panel2)}
.gg-t{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-t b{display:block;font-size:1.55em;font-weight:800;line-height:1.1}
.gg-t small{color:var(--muted);font-size:.8em}
.hm{display:grid;gap:3px;font-size:.72em}
.hm-x,.hm-y{color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.hm-y{text-align:right;padding-right:6px;align-self:center}
.hm-c{aspect-ratio:1.4;border-radius:4px;background:color-mix(in srgb,var(--hm,var(--acc)) var(--a),var(--panel2));animation:fadeIn .5s both;animation-delay:var(--d)}
.hm-c:hover{outline:2px solid var(--ink);outline-offset:-1px}

/* ---------- Drag and drop ---------- */
.drag-ghost{box-shadow:0 24px 50px rgba(0,0,0,.3);opacity:.96;transition:none!important;animation:none!important}
.drop-ph{border:2px dashed var(--acc);border-radius:var(--r-sm,10px);background:color-mix(in srgb,var(--acc) 8%,transparent);margin-bottom:8px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.over{outline:2px dashed var(--acc);outline-offset:-3px}
.dropped{animation:drop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:scale(1.06)}}
.grip{cursor:grab;touch-action:none;border:0;background:none;color:var(--muted);padding:2px;display:inline-grid;place-items:center}

/* ---------- Reduced motion: keep it calm ---------- */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}


/* ---------- Invoice editor and paper ---------- */
.ie{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
.ie-p{background:var(--paper-desk,var(--panel2));border-radius:var(--r-sm,10px);padding:16px;overflow:auto;max-height:72vh}
.ie-page .ie-p{max-height:none}
.ie-items{border:0;padding:0;margin:16px 0;min-width:0}
.ie-items legend{font-weight:700;margin-bottom:8px;font-size:.92em;padding:0}
.ie-head,.ie-r{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 92px 32px;gap:6px;align-items:center}
.ie-head{font-size:.72em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 2px 4px}
.ie-r{margin-bottom:6px}
.ie-r.new{animation:rise .35s both}
.ie-r output{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;font-size:.88em;overflow:hidden;text-overflow:ellipsis}
.ie-dx{display:flex;gap:6px}.ie-dx select{width:78px;flex:none}
.ie-sum{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm,10px);background:var(--panel2);display:grid;gap:4px;font-size:.92em}
.ie-sum div{display:flex;justify-content:space-between}
.ie-g{font-size:1.15em;font-weight:800;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.ie-pv-t{display:none!important}
.ie-page .ie-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:860px){.ie{grid-template-columns:minmax(0,1fr)}.ie-p{display:none}.ie.show-pv .ie-p{display:block}.ie.show-pv .ie-f{display:none}.ie-pv-t{display:inline-flex!important}}
@media (max-width:520px){.ie-head{display:none}.ie-r{grid-template-columns:minmax(0,1fr) 54px 74px 30px}.ie-r output{display:none}}
.paper{position:relative;background:var(--paper,#fff);color:var(--paper-ink,#1d1d1f);border-radius:var(--paper-r,6px);padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.14);font-size:13px;overflow:hidden;font-family:var(--paper-font,inherit)}
.pp-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--paper-acc,var(--acc))}
.pp-from{display:flex;flex-direction:column;gap:2px}
.pp-from svg{width:34px;height:34px;margin-bottom:6px}
.pp-from b{font-size:1.15em}
.pp-from small,.pp-to span,.pp-to small,.pp-meta span{color:var(--paper-mut,#6b6b73)}
.pp-meta{text-align:right}
.pp-meta h3{font-size:1.55em;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-acc,var(--acc));margin-bottom:6px}
.pp-meta div{display:flex;justify-content:flex-end;gap:10px}
.pp-to{display:flex;flex-direction:column;gap:2px;margin:16px 0}
.pp-to small{text-transform:uppercase;letter-spacing:.1em;font-size:.74em}
.pp-t{width:100%;border-collapse:collapse}
.pp-t th{text-align:left;font-size:.74em;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-mut,#6b6b73);border-bottom:1px solid rgba(0,0,0,.12);padding:7px 4px}
.pp-t td{padding:8px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
.pp-t .num{text-align:right;white-space:nowrap}
.pp-tot{margin:14px 0 0 auto;width:min(270px,100%);display:grid;gap:4px}
.pp-tot div{display:flex;justify-content:space-between;gap:10px}
.pp-g{border-top:2px solid var(--paper-ink,#1d1d1f);padding-top:6px;margin-top:4px;font-size:1.18em;font-weight:800}
.pp-n{margin:18px 0 0;padding-top:12px;border-top:1px dashed rgba(0,0,0,.18);color:var(--paper-mut,#55555c);white-space:pre-wrap}
.pp-stamp{position:absolute;right:26px;top:40%;padding:6px 16px;border:4px solid currentColor;border-radius:8px;font-size:30px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-14deg);opacity:0;pointer-events:none}
.st-paid .pp-stamp{color:#1f9d55;opacity:.8;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both .2s}
.st-overdue .pp-stamp{color:#d23c3c;opacity:.75;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both .2s}
.st-accepted .pp-stamp{color:#1f9d55;opacity:.8;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both .2s}
.st-declined .pp-stamp,.st-expired .pp-stamp{color:#d23c3c;opacity:.7;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both .2s}
.st-draft .pp-stamp{color:#9a9aa2;opacity:.3}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.4)}}
.print-area{display:none}
@media print{body.printing>*:not(.print-area){display:none!important}body.printing .print-area{display:block}body.printing{background:#fff}}

/* =========================================================
   Skin: Freelane (neo-brutalist: thick borders, hard shadows, lime, violet and orange blocks, mono numbers)
   ========================================================= */
/* Tokens: neo-brutalist. Thick ink borders, hard shadows, loud blocks of colour. */
:root{
  --font:"Archivo","Helvetica Neue","Arial Black",system-ui,-apple-system,Arial,sans-serif;
  --font-n:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --fs:14px;--r:0px;--r-sm:0px;--r-dlg:0px;--side-w:220px;--gap:18px;--pad:18px;
  --bg:#f4f1ea;--panel:#ffffff;--panel2:#f0ede4;--ink:#111111;--muted:#5d5a52;--line:#111111;
  --acc:#7b5cff;--acc-ink:#fff;--lime:#c6f432;--orange:#ff7a1a;--pink:#ff5ca8;--sky:#4cc3ff;
  --ok:#1a9e4b;--warn:#c47400;--bad:#e2321f;--info:#2b62e8;
  --c1:#7b5cff;--c2:#ff7a1a;--c3:#2fb36b;--c4:#ff5ca8;--c5:#4cc3ff;--c6:#8b877c;
  --bw:2.5px;--hs:4px 4px 0 var(--ink);--hs2:7px 7px 0 var(--ink);
  --side:transparent;--side-ink:#111;--side-mut:#111;--nav-on:#111;
  --shadow:var(--hs);--shadow-h:var(--hs2);--toast-bg:#111;--grid:rgba(17,17,17,.12);--tip-bg:#111;
  --paper:#fff;--paper-acc:#7b5cff;--paper-desk:#c6f432;--paper-r:0;
}
[data-theme="dark"]{
  --bg:#0f0f0f;--panel:#1a1a1a;--panel2:#242424;--ink:#f2f2f2;--muted:#a8a8a0;--line:#f2f2f2;
  --acc:#9b83ff;--acc-ink:#0f0f0f;--ok:#5fe08f;--warn:#ffb347;--bad:#ff6a57;--info:#7aa2ff;
  --c1:#9b83ff;--c2:#ff9a4a;--c3:#5fe08f;--c4:#ff7ab9;--c5:#6fd0ff;--c6:#9a968c;
  --hs:4px 4px 0 var(--lime);--hs2:7px 7px 0 var(--lime);--toast-bg:#c6f432;--toast-ink:#111;--grid:rgba(242,242,242,.12);--tip-bg:#c6f432;--tip-ink:#111;
  --paper-desk:#2a2a2a;
}
h1,h2,h3,.ch h3{font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.kpi-v,.num,.ax{font-family:var(--font-n)}
.kpi-v{font-size:1.9em;font-weight:800}
.kpi-l{text-transform:uppercase;font-weight:800;color:var(--ink);font-size:.74em;letter-spacing:.06em}
.card{border:var(--bw) solid var(--line);box-shadow:var(--hs)}
.card:hover{transform:translate(-2px,-2px);box-shadow:var(--hs2)}
.kpi:nth-child(1){background:var(--lime);color:#111}
.kpi:nth-child(1) .kpi-l,.kpi:nth-child(1) .kpi-s,.kpi:nth-child(1) .kpi-d small{color:#111}
.kpi:nth-child(3){background:var(--acc);color:#fff}
.kpi:nth-child(3) .kpi-l,.kpi:nth-child(3) .kpi-s,.kpi:nth-child(3) .kpi-d small{color:#fff}
.btn,.icon-btn,.chip,input,select,textarea,.seg{border:var(--bw) solid var(--line);border-radius:0}
.btn{box-shadow:3px 3px 0 var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:.82em}
.btn:hover{border-color:var(--line);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--lime);color:#111}
.btn.danger{background:var(--bad)}
.icon-btn{box-shadow:3px 3px 0 var(--ink)}
.icon-btn:active{transform:translate(2px,2px);box-shadow:none}
.chip{font-weight:800;color:var(--ink);text-transform:uppercase;font-size:.74em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{padding:0;background:var(--panel)}
.seg button{border-radius:0;font-family:var(--font-n);font-weight:700}
.seg-th{top:0;bottom:0;border-radius:0;background:var(--ink);box-shadow:none}
.seg button[aria-pressed="true"]{color:var(--bg)}
.pill{border-radius:0;border:1.5px solid currentColor;background:transparent;font-family:var(--font-n);text-transform:uppercase}
.tbl th{color:var(--ink);border-bottom:var(--bw) solid var(--line)}
.dlg{border:var(--bw) solid var(--line);box-shadow:8px 8px 0 var(--ink)}
.ov-bg{backdrop-filter:none;background:rgba(17,17,17,.35)}
.toast{border-radius:0;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.meter{border-radius:0;height:10px;border:1.5px solid var(--line);background:var(--panel)}
.meter i{border-radius:0}
.av{border-radius:0;border:2px solid var(--line)}

/* Header bar */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 22px;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.brand{padding:0;font-weight:900;letter-spacing:.06em;color:var(--ink)}
.brand svg{width:34px;height:34px}
.hdr-sp{flex:1}
.who-b{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;margin-right:6px}
.who-b small{color:var(--muted);font-size:.78em}
@media (max-width:640px){.who-b{display:none}}
/* Chunky list nav */
.side{position:sticky;top:60px;height:calc(100vh - 60px);padding:22px 0 22px 22px;background:none}
.nav{gap:8px}
.nav a{border:var(--bw) solid transparent;border-radius:0;padding:10px 12px;font-weight:800;text-transform:uppercase;font-size:.82em;letter-spacing:.04em;color:var(--ink)}
.nav a:hover{border-color:var(--line)}
.nav-marker{border-radius:0;background:var(--lime);border:var(--bw) solid var(--line);box-shadow:3px 3px 0 var(--ink)}
[data-theme="dark"] .nav a[aria-current="page"]{color:#111}
.side-box{margin-top:auto;padding:14px;border:var(--bw) solid var(--line);background:var(--orange);color:#111;box-shadow:var(--hs)}
.side-box small{display:block;text-transform:uppercase;font-weight:800;font-size:.72em}
.side-box b{font:800 1.5em var(--font-n)}
@media (max-width:900px){.side{top:0;height:100vh;padding:70px 16px 16px;background:var(--bg);border-right:var(--bw) solid var(--line)}}
.pt{font-size:2.4em;padding:20px 26px 0;letter-spacing:-.02em}
.view{padding:14px 26px 44px}
@media (max-width:900px){.pt{font-size:1.7em;padding:14px 16px 0}.view{padding:10px 16px 34px}}

/* Payday split (Sankey) */
.split{position:relative}
.split svg{display:block;width:100%;height:auto;overflow:visible}
.rib{fill:none;stroke-linecap:butt;opacity:.9}
.rib.go{stroke-dasharray:1;stroke-dashoffset:1;animation:pour 1.2s cubic-bezier(.5,0,.2,1) forwards;animation-delay:var(--d)}
@keyframes pour{to{stroke-dashoffset:0}}
.node{stroke:var(--line);stroke-width:2.5}
.nlab{font:800 13px var(--font);fill:var(--ink);text-transform:uppercase}
.nval{font:700 13px var(--font-n);fill:var(--ink)}
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--gap)}
.pot h3{font-size:1em}
.pot .big{font:800 1.8em var(--font-n);margin:6px 0}
.pot .tube{height:120px;border:var(--bw) solid var(--line);position:relative;background:var(--panel2);margin:10px 0}
.pot .tube i{position:absolute;left:0;right:0;bottom:0;height:var(--h);transition:height 1s cubic-bezier(.3,.8,.3,1)}
.pot .tube span{position:absolute;right:6px;top:4px;font:700 .8em var(--font-n)}
.rule{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.rule:last-child{border:0}
.rule input[type=range]{flex:1}
.rule output{font:800 1.1em var(--font-n);min-width:46px;text-align:right}

/* Cards */
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.bcard{position:relative;aspect-ratio:1.586;border:var(--bw) solid var(--line);box-shadow:var(--hs2);padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#111;overflow:hidden}
.bcard .no{font:800 1.15em var(--font-n);letter-spacing:.08em}
.bcard .tag{align-self:flex-start;background:#111;color:#fff;padding:2px 8px;font-weight:800;font-size:.72em;text-transform:uppercase}
.bcard .r{display:flex;justify-content:space-between;font-weight:800;text-transform:uppercase;font-size:.8em}
.bcard .frz{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(-45deg,rgba(17,17,17,.85) 0 12px,rgba(17,17,17,.6) 12px 24px);color:var(--lime);font:900 1.8em var(--font);letter-spacing:.2em;transform:scale(1.3);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.bcard.frozen .frz{transform:none;opacity:1}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.tx:last-child{border:0}
.tx .ic{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel2);flex:none}
.tx b{display:block}.tx small{color:var(--muted)}
.tx .num{margin-left:auto;font-weight:800;white-space:nowrap}
.plus{color:var(--ok)}
.tax-card{background:var(--pink);color:#111}
.tax-card .big{font:800 2em var(--font-n)}
.flow-bar{display:flex;height:34px;border:var(--bw) solid var(--line);margin:10px 0}
.flow-bar i{display:grid;place-items:center;font:800 .74em var(--font-n);color:#111;border-right:2px solid var(--line);transition:flex .6s}
.flow-bar i:last-child{border:0}

</style>
</head>
<body>
<!-- App shell: a blocky header across the top and a chunky list nav on the left -->

/* =========================================================
   Core helpers: DOM, numbers, dates, storage, router, UI

'use strict';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches; // reduced motion flag, checked by every animation

const sum = a => a.reduce((s, v) => s + (+v || 0), 0);

const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const groupSum = (rows, key, val) => rows.reduce((m, r) => { const k = typeof key === 'function' ? key(r) : r[key]; m[k] = (m[k] || 0) + (typeof val === 'function' ? val(r) : r[val]); return m; }, {});

/* ---------- Seeded random numbers, so demo data is the same each time ---------- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = rng(1);
const rnd = (a, b) => a + R() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() < p;

/* ---------- Dates are stored as 'YYYY-MM-DD' strings ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const TODAY_S = iso(new Date());
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = pd(s); d.setDate(1); d.setMonth(d.getMonth() + n); return iso(d); };
const daysAgo = n => addDays(TODAY_S, -n);
const dayDiff = (a, b) => Math.round((pd(a) - pd(b)) / 864e5);
const fDate = s => { if (!s) return '—'; const d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fDay = s => { const d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fMon = k => { const d = pd(k.length === 7 ? k + '-01' : k); return MON[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); };
const monthKeys = n => Array.from({ length: n }, (_, i) => addMonths(TODAY_S, i - n + 1).slice(0, 7));
const ago = s => { const n = dayDiff(TODAY_S, s); return n === 0 ? 'today' : n === 1 ? 'yesterday' : n > 0 ? n + ' days ago' : 'in ' + -n + ' days'; };

/* ---------- Number and money formats ---------- */
const CUR = { sym: 'Rs ', dp: 0 }; // each app sets its own symbol
const nf = (n, dp = 0) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const money = (n, dp = CUR.dp) => (n < -0.004 ? '-' : '') + CUR.sym + nf(Math.abs(n), dp);
const short = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; return s + (a >= 1e9 ? +(a / 1e9).toFixed(1) + 'B' : a >= 1e6 ? +(a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? +(a / 1e3).toFixed(1) + 'K' : nf(a)); };
const smoney = n => (n < 0 ? '-' : '') + CUR.sym + short(Math.abs(n));
const FMT = { money: v => money(v), smoney, num: v => nf(v), short, pct: v => nf(v, 1) + '%', pct0: v => nf(v) + '%', raw: v => String(Math.round(v)) };

/* ---------- Storage: works even when localStorage is blocked ---------- */
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};

const ico = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.info}</svg>`;

/* ---------- Small HTML builders ---------- */
const PILL = { draft: 'Draft', sent: 'Sent', paid: 'Paid', overdue: 'Overdue', pending: 'Pending', approved: 'Approved', rejected: 'Rejected', active: 'Active', frozen: 'Frozen', expiring: 'Expiring', expired: 'Expired', valid: 'Valid', signed: 'Signed', unsigned: 'To sign', leave: 'On leave', review: 'In review', done: 'Done', open: 'Open', booked: 'Booked', cancelled: 'Cancelled', partial: 'Part paid', scheduled: 'Scheduled', accepted: 'Accepted', declined: 'Declined' };
const pill = (s, label) => `<span class="pill s-${esc(s)}">${esc(label || PILL[s] || cap(s))}</span>`;
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;
const seg = (act, opts, cur, label = 'Choose range') => `<div class="seg" role="group" aria-label="${esc(label)}"><span class="seg-th" aria-hidden="true"></span>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" data-act="${act}" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`; }).join('')}</div>`;
const chips = (act, opts, cur) => `<div class="chips">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" class="chip" data-act="${act}" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`; }).join('')}</div>`;
// KPI card: value counts up, delta shows the change
function kpi(o) {
  const d = o.delta;
  return `<div class="card kpi ${o.cls || ''}">${o.icon ? `<span class="kpi-i">${ico(o.icon)}</span>` : ''}<span class="kpi-l">${esc(o.label)}</span><b class="kpi-v" id="${o.id}" data-count="${o.value}" data-fmt="${o.fmt || 'money'}">0</b>${d != null ? `<span class="kpi-d ${(o.good ?? d >= 0) ? 'up' : 'down'}">${ico(d >= 0 ? 'up' : 'down')}${nf(Math.abs(d), 1)}%<small> ${esc(o.vs || 'vs last month')}</small></span>` : o.sub ? `<span class="kpi-s">${o.sub}</span>` : ''}${o.spark ? `<span class="kpi-sp">${spark(o.spark, o.sc)}</span>` : ''}</div>`;
}
const bar = (p, color) => `<span class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(clamp(p, 0, 100))}"><i style="--w:${clamp(p, 0, 100).toFixed(1)}%${color ? ';background:' + color : ''}"></i></span>`;

/* ---------- Count-up numbers ---------- */
let NUMPREV = {};
function countUp(el, to, fmt) {
  const k = el.id || el.dataset.k || '', from = NUMPREV[k] ?? 0; if (k) NUMPREV[k] = to;
  if (RM || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = 900;
  const f = now => { const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
const countAll = root => $$('[data-count]', root).forEach(el => countUp(el, +el.dataset.count, FMT[el.dataset.fmt] || FMT.money));

/* ---------- Toasts (aria-live) ---------- */
function toast(msg, kind = 'ok', undo) {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = 'toast ' + kind;
  t.innerHTML = `${ico(kind === 'bad' ? 'alert' : kind === 'warn' ? 'info' : 'check')}<span>${esc(msg)}</span>${undo ? '<button type="button" class="t-undo">Undo</button>' : ''}`;
  box.append(t); requestAnimationFrame(() => t.classList.add('show'));
  const kill = () => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); };
  if (undo) t.querySelector('.t-undo').onclick = () => { undo(); kill(); };
  setTimeout(kill, undo ? 5200 : 3200);
}

/* ---------- Tooltip (one shared, follows the pointer) ---------- */
function tipShow(html, x, y) {
  const t = $('#tip'); if (!t) return; t.innerHTML = html; t.classList.add('on');
  const w = t.offsetWidth, h = t.offsetHeight; let L = x + 14, T = y - h - 12;
  if (L + w > innerWidth - 8) L = x - w - 14; if (T < 8) T = y + 18; if (L < 8) L = 8;
  t.style.transform = `translate(${L}px,${T}px)`;
}
const tipHide = () => { const t = $('#tip'); if (t) t.classList.remove('on'); };

/* ---------- Modals, drawers, pop-overs: focus trap, Esc closes ---------- */
let MODALS = [], MID = 0;
const focusables = r => $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])', r).filter(e => !e.hidden && e.offsetParent !== null || e === document.activeElement);
function modal(o) {
  const last = document.activeElement, n = ++MID, w = document.createElement('div');
  w.className = 'ov ' + (o.cls || '');
  w.innerHTML = `<div class="ov-bg" data-close></div><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT${n}"><header class="dlg-h"><h2 id="dlgT${n}">${o.title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ico('x')}</button></header><div class="dlg-b">${o.body || ''}</div>${o.foot ? `<footer class="dlg-f">${o.foot}</footer>` : ''}</div>`;
  document.body.append(w);
  const m = { el: w, dlg: w.querySelector('.dlg'), body: w.querySelector('.dlg-b') };
  m.close = () => { if (m.done) return; m.done = true; w.classList.remove('open'); MODALS = MODALS.filter(x => x !== m); setTimeout(() => w.remove(), RM ? 0 : 280); o.onClose && o.onClose(); if (last && last.focus && document.contains(last)) last.focus(); };
  w.addEventListener('click', e => { if (e.target.closest('[data-close]')) m.close(); });
  MODALS.push(m);
  requestAnimationFrame(() => w.classList.add('open'));
  o.onOpen && o.onOpen(m);
  const first = $('[autofocus]', w) || $('.dlg-b input,.dlg-b select,.dlg-b textarea', w) || $('.dlg-b button', w) || $('.dlg-f button', w) || $('[data-close].icon-btn', w);
  setTimeout(() => first && first.focus(), 30);
  return m;
}
const drawer = (title, body, foot, cls = '') => modal({ title, body, foot, cls: 'drawer ' + cls });
function confirmBox(msg, onOk, o = {}) {
  const m = modal({ title: o.title || 'Are you sure?', cls: 'sm', body: `<p class="muted">${msg}</p>`, foot: `<button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn ${o.danger === false ? 'pri' : 'danger'}" data-ok>${esc(o.ok || 'Delete')}</button>` });
  m.el.querySelector('[data-ok]').onclick = () => { m.close(); onOk(); };
  return m;
}
// Small menu next to a button (used for "Move to…" and row actions)
function menu(btn, items, title = 'Options') {

  title: 'Invoices', render(v) {
    const g = s => sum(D.inv.filter(x => invStatus(x) === s).map(invTotal));
    v.innerHTML = `<div class="grid g-k">${kpi({ id: 'i1', label: 'Paid, 6 months', value: g('paid') })}${kpi({ id: 'i2', label: 'Sent', value: g('sent') })}${kpi({ id: 'i3', label: 'Overdue', value: g('overdue') })}${kpi({ id: 'i4', label: 'Drafts', value: g('draft') })}</div>
    <div class="grid g21"><section class="card flat"><div id="invT"></div></section><section class="card"><div class="ch"><h3>By status</h3></div><div class="chart" id="invDn"></div></section></div>`;
    table($('#invT'), { rows: D.inv, ph: 'Search invoices…', keys: ['no', x => client(x.client).name], sort: 'issue', dir: -1, chips: { opts: ['All', 'Draft', 'Sent', 'Overdue', 'Paid'], fn: (x, c) => invStatus(x) === c.toLowerCase() }, tools: `<span class="sp"></span><button type="button" class="btn pri" data-act="newInv">${ico('plus')}New invoice</button>`, onRow: invDrawer,
      cols: [{ k: 'no', label: 'No.', f: x => `<b class="num">${esc(x.no)}</b>` }, { k: 'client', label: 'Client', sv: x => client(x.client).name, f: x => esc(client(x.client).name) }, { k: 'due', label: 'Due', f: x => fDay(x.due) }, { k: 'st', label: 'Status', sv: invStatus, f: x => pill(invStatus(x)) }, { k: 'tot', label: 'Amount', num: true, sv: invTotal, f: x => money(invTotal(x)) }] });
    donut($('#invDn'), { items: [['Paid', g('paid'), 'var(--c3)'], ['Sent', g('sent'), 'var(--c1)'], ['Overdue', g('overdue'), 'var(--bad)'], ['Draft', g('draft'), 'var(--c6)']].map(([name, value, color]) => ({ name, value, color })), label: 'Invoiced', size: 140, sw: 18 });
  }
};
function editInv(x) {
  invEditor({ inv: x, clients: D.clients, biz: biz(), logo: LOGO, tax: 0, terms: 30, notes: 'Thanks! Pay to the account below within 30 days.', nextNo: () => 'ZA-' + String(D.set.next).padStart(3, '0'), noTaken: y => D.inv.some(z => z.no === y.no && z.id !== y.id),
    onSave: (y, isNew) => { const was = x ? x.status : 'draft'; if (isNew) { D.inv.push(y); D.set.next++; } else Object.assign(x, y); const it = isNew ? y : x; if (it.status === 'paid' && was !== 'paid') { it.paidOn = TODAY_S; landPayment(invTotal(it), client(it.client).name, { inv: it.id }); } else { commit('Invoice ' + y.no + ' saved'); if (it.status === 'sent' && was === 'draft') notify(y.no + ' sent to ' + client(y.client).name); } },
    onDelete: y => { D.inv = D.inv.filter(z => z.id !== y.id); commit('Invoice deleted'); } });
}
ACT.newInv = () => editInv(null);
function invDrawer(x) {
  const m = drawer('Invoice ' + esc(x.no), `<div style="padding:12px;background:var(--paper-desk);border:var(--bw) solid var(--line)">${invPaper(x, { biz: biz(), client: client(x.client), logo: LOGO })}</div>`, `<button type="button" class="btn ghost danger" data-x="del">${ico('trash')}</button><button type="button" class="btn" data-x="print">${ico('print')}</button><span class="sp"></span><button type="button" class="btn" data-x="edit">${ico('edit')}Edit</button>${x.status === 'draft' ? `<button type="button" class="btn pri" data-x="send">${ico('send')}Send</button>` : x.status === 'sent' ? `<button type="button" class="btn pri" data-x="paid">${ico('check')}Mark paid</button>` : ''}`, 'wide');
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; const k = b.dataset.x; if (k === 'print') { printPaper(invPaper(x, { biz: biz(), client: client(x.client), logo: LOGO })); return; } m.close();
    if (k === 'send') { x.status = 'sent'; commit(x.no + ' sent to ' + client(x.client).email); }
    if (k === 'paid') ACT.paidInv({ dataset: { id: x.id } });
    if (k === 'edit') editInv(x);
    if (k === 'del') confirmBox('Delete ' + esc(x.no) + '?', () => { D.inv = D.inv.filter(z => z !== x); commit('Invoice deleted'); }); });
}
ACT.paidInv = b => { const x = byId(D.inv, b.dataset.id); if (!x || x.status === 'paid') return; x.status = 'paid'; x.paidOn = TODAY_S; landPayment(invTotal(x), client(x.client).name, { inv: x.id }); };

/* ---------- Page: Pots ---------- */
PAGES.pots = {
  title: 'Pots', render(v) {
    v.innerHTML = `<section class="card"><div class="ch"><h3>Payday split</h3><span class="sub">Try a payment and watch where it goes</span></div><div class="row" style="margin-bottom:10px"><label class="fld" style="flex:0 1 180px"><span class="lbl">Payment ($)</span><input type="number" id="demoAmt" min="1" value="${ST.demo}"></label><button type="button" class="btn pri" data-act="demoSplit" style="align-self:flex-end">${ico('play')}Pour it</button><button type="button" class="btn" data-act="fakePay" style="align-self:flex-end">${ico('download')}Simulate a real payment</button></div><div class="split" id="spP"></div></section>
    <div class="grid g21" style="margin-top:var(--gap)"><div class="pots">${Object.keys(D.pots).map(k => { const g = D.goals[k], h = g ? clamp(D.pots[k] / g * 100, 0, 100) : clamp(D.pots[k] / 6000 * 100, 0, 100); return `<section class="card pot"><h3>${POTN[k]}</h3><div class="big" id="pot_${k}" data-count="${D.pots[k]}" data-fmt="money">0</div><div class="tube"><i style="--h:${h.toFixed(1)}%;background:${POTC[k]}"></i><span>${g ? nf(h) + '% of ' + smoney(g) : 'for tax day'}</span></div><div class="row"><button type="button" class="btn sm" data-act="potMove" data-k="${k}" data-dir="in">Add</button><button type="button" class="btn sm" data-act="potMove" data-k="${k}" data-dir="out">Take out</button></div></section>`; }).join('')}</div>
    <section class="card" id="rulesC"><div class="ch"><h3>Split rules</h3></div><div class="rule"><span style="width:90px"><b>Tax</b></span><input type="range" min="0" max="50" value="${D.rules.tax}" data-rule="tax" aria-label="Tax share"><output id="o_tax">${D.rules.tax}%</output></div><div class="rule"><span style="width:90px"><b>Rainy day</b></span><input type="range" min="0" max="40" value="${D.rules.rainy}" data-rule="rainy" aria-label="Rainy day share"><output id="o_rainy">${D.rules.rainy}%</output></div><div class="flow-bar" id="ruleBar">${splitParts(100).map(p => `<i style="flex:${p.v};background:${p.color}">${nf(p.v)}%</i>`).join('')}</div><small class="err" id="ruleErr"></small><button type="button" class="btn pri" data-act="saveRules">Save rules</button></section></div>`;
    sankey($('#spP'), ST.demo, false);
    $('#rulesC').addEventListener('input', e => { const r = e.target.closest('[data-rule]'); if (!r) return; D.rules[r.dataset.rule] = +r.value; $('#o_' + r.dataset.rule).textContent = r.value + '%'; const ok = D.rules.tax + D.rules.rainy <= 90; $('#ruleErr').textContent = ok ? '' : 'Leave at least 10% to spend'; $('#ruleBar').innerHTML = splitParts(100).map(p => `<i style="flex:${Math.max(0, p.v)};background:${p.color}">${nf(p.v)}%</i>`).join(''); sankey($('#spP'), ST.demo, false); });
  }
};
ACT.demoSplit = () => { const a = +$('#demoAmt').value; if (!(a > 0)) { toast('Enter an amount above 0', 'warn'); return; } ST.demo = a; sankey($('#spP'), a, true); };
ACT.fakePay = () => { const a = +$('#demoAmt').value || 0; if (!(a > 0)) { toast('Enter an amount above 0', 'warn'); return; } landPayment(a, pick(D.clients).name); };
ACT.saveRules = () => { if (D.rules.tax + D.rules.rainy > 90) { toast('Leave at least 10% to spend', 'bad'); return; } commit('Split rules saved'); };
ACT.potMove = b => { const k = b.dataset.k, inn = b.dataset.dir === 'in', max = inn ? main() : D.pots[k]; formModal({ title: (inn ? 'Add to ' : 'Take from ') + POTN[k], save: inn ? 'Add' : 'Take out', fields: [{ k: 'amt', label: 'Amount ($)', type: 'number', min: 1, step: .01, req: true, full: true, check: a => a > max ? 'Only ' + money(max) + ' available' : '' }], onSave: x => { D.pots[k] = Math.round((D.pots[k] + (inn ? x.amt : -x.amt)) * 100) / 100; D.tx.unshift({ id: uid('t'), date: TODAY_S, who: POTN[k] + ' pot', amt: inn ? -x.amt : x.amt, cat: 'Pots', pot: k }); commit(money(x.amt) + (inn ? ' added to ' : ' taken from ') + POTN[k]); } }); };

/* ---------- Page: Activity ---------- */
PAGES.activity = {
  title: 'Activity', render(v) {
    v.innerHTML = `<section class="card flat"><div id="txT"></div></section>`;
    table($('#txT'), { rows: D.tx, per: 10, ph: 'Search activity…', keys: ['who', 'cat'], sort: 'date', dir: -1, chips: { opts: ['All', 'Money in', 'Money out', 'Pots', 'Card'], fn: (t, c) => c === 'Money in' ? t.amt > 0 : c === 'Money out' ? t.amt < 0 && t.cat !== 'Pots' : c === 'Pots' ? t.cat === 'Pots' : !!t.card }, tools: `<span class="sp"></span><button type="button" class="btn" data-act="csv">${ico('download')}CSV</button>`, onRow: txForm,
      cols: [{ k: 'date', label: 'Date', f: t => fDay(t.date) }, { k: 'who', label: 'Who', f: t => `<b>${esc(t.who)}</b>${t.note ? `<br><small class="muted">${esc(t.note)}</small>` : ''}` }, { k: 'cat', label: 'Category' }, { k: 'card', label: 'Card', f: t => t.card ? '•• ' + esc((byId(D.cards, t.card) || {}).last4 || '') : '' }, { k: 'amt', label: 'Amount', num: true, f: t => `<b class="${t.amt > 0 ? 'plus' : ''}">${t.amt > 0 ? '+' : ''}${money(t.amt)}</b>` }] });
  }
};
function txForm(t) { formModal({ title: esc(t.who), intro: `<p class="num" style="font-size:1.6em;font-weight:800">${t.amt > 0 ? '+' : ''}${money(t.amt)}</p>`, fields: [{ k: 'cat', label: 'Category', type: 'select', opts: ['Income', 'Software', 'Workspace', 'Equipment', 'Travel', 'Meals', 'Phone & internet', 'Fees', 'Pots', 'Tax', 'Other'], full: true }, { k: 'note', label: 'Note', full: true }], values: t, onSave: x => { Object.assign(t, x); commit('Saved'); } }); }
ACT.csv = () => download('freelane-activity.csv', toCSV(D.tx, [['date', 'Date'], ['who', 'Who'], ['cat', 'Category'], ['amt', 'Amount']]));

/* ---------- Page: Cards ---------- */
PAGES.cards = {
  title: 'Cards', render(v) {
    const mk = TODAY_S.slice(0, 7), spent = k => -sum(D.tx.filter(t => t.card === k.id && t.date.startsWith(mk)).map(t => t.amt));
    v.innerHTML = `<div class="ph"><p>Make a virtual card for each job or subscription. Freeze it when you are done.</p><button type="button" class="btn pri" data-act="newCard">${ico('plus')}New virtual card</button></div><div class="bcards">${D.cards.map(k => `<div><div class="bcard${k.frozen ? ' frozen' : ''}" style="background:${k.color}" id="bc_${k.id}"><span class="tag">${esc(k.kind)}</span><div class="no">•••• •••• •••• ${esc(k.last4)}</div><div class="r"><span>${esc(k.name)}</span><span>${esc(D.set.name)}</span></div><span class="frz" aria-hidden="true">FROZEN</span></div><div class="row" style="margin-top:14px;justify-content:space-between"><span class="num">${money(spent(k))} / ${smoney(k.limit)}</span><span class="row"><button type="button" class="btn sm" data-act="freeze" data-id="${k.id}" aria-pressed="${k.frozen}">${k.frozen ? 'Unfreeze' : 'Freeze'}</button><button type="button" class="icon-btn sm" data-act="cardDel" data-id="${k.id}" aria-label="Delete card ${esc(k.name)}">${ico('trash')}</button></span></div>${bar(spent(k) / k.limit * 100, 'var(--ink)')}</div>`).join('')}</div>`;
  }
};
ACT.freeze = b => { const k = byId(D.cards, b.dataset.id); k.frozen = !k.frozen; $('#bc_' + k.id).classList.toggle('frozen', k.frozen); save(); toast(k.name + (k.frozen ? ' card frozen' : ' card is live')); setTimeout(() => { if (PAGE === 'cards') refresh(); }, RM ? 0 : 450); };
ACT.cardDel = b => { const k = byId(D.cards, b.dataset.id); confirmBox('Delete the ' + esc(k.name) + ' card?', () => { D.cards = D.cards.filter(x => x !== k); commit('Card deleted'); }); };
ACT.newCard = () => formModal({ title: 'New virtual card', save: 'Create', fields: [{ k: 'name', label: 'Name it', req: true, full: true, ph: 'For example: Moonshot job' }, { k: 'limit', label: 'Monthly limit ($)', type: 'number', min: 10, req: true }, { k: 'color', label: 'Colour', type: 'select', opts: [['#c6f432', 'Lime'], ['#7b5cff', 'Violet'], ['#ff7a1a', 'Orange'], ['#ff5ca8', 'Pink'], ['#4cc3ff', 'Sky']] }], values: { limit: 200, color: '#ff5ca8' }, onSave: x => { D.cards.push({ id: uid('k'), ...x, kind: 'Virtual', frozen: false, last4: String(1000 + Math.floor(Math.random() * 8999)) }); commit(x.name + ' card is ready'); } });

/* ---------- Page: Transfers ---------- */
PAGES.transfers = {
  title: 'Transfers', render(v) {
    v.innerHTML = `<div class="grid g2"><section class="card"><div class="ch"><h3>Send money</h3></div><form id="sendF" novalidate>${fieldsHTML(sendF(), { from: 'main', payee: D.payees[0].id })}<div class="row" style="margin-top:14px"><span class="sp"></span><button type="submit" class="btn pri">${ico('send')}Send</button></div></form></section>
    <section class="card"><div class="ch"><h3>Scheduled</h3><button type="button" class="btn sm" data-act="addSched">${ico('plus')}Schedule</button></div><ul class="list">${D.sched.map(s => `<li class="li"><span class="grow"><b>${esc((byId(D.payees, s.payee) || {}).name || 'Payee')}</b><small>${esc(s.every)} · next ${fDay(s.next)}</small></span><b class="num">${money(s.amt)}</b><label class="tog"><span class="sr">Active</span><input type="checkbox" data-act="schedTog" data-id="${s.id}"${s.on ? ' checked' : ''}><span></span></label></li>`).join('') || '<li class="muted">Nothing scheduled.</li>'}</ul><div class="ch" style="margin-top:16px"><h3>Payees</h3><button type="button" class="btn sm" data-act="addPayee">${ico('plus')}Payee</button></div><ul class="list">${D.payees.map(p => `<li class="li">${av(p.name, 'sm')}<span class="grow"><b>${esc(p.name)}</b><small>${esc(p.acct)}</small></span></li>`).join('')}</ul></section></div>`;
    $('#sendF').addEventListener('submit', e => { e.preventDefault(); const x = readFields($('#sendF'), sendF()); if (!x) return; const p = byId(D.payees, x.payee); if (x.from === 'main') D.tx.unshift({ id: uid('t'), date: TODAY_S, who: p.name, amt: -x.amt, cat: x.cat, note: x.ref }); else { D.pots[x.from] = Math.round((D.pots[x.from] - x.amt) * 100) / 100; D.tx.unshift({ id: uid('t'), date: TODAY_S, who: p.name + ' (from ' + POTN[x.from] + ')', amt: 0, cat: x.cat, note: x.ref + ' · ' + money(x.amt) + ' paid from pot' }); } commit(money(x.amt) + ' sent to ' + p.name); });
  }
};
const sendF = () => [{ k: 'payee', label: 'To', type: 'select', opts: D.payees.map(p => [p.id, p.name]), full: true }, { k: 'from', label: 'From', type: 'select', opts: [['main', 'Main · ' + smoney(main())]].concat(Object.keys(D.pots).map(k => [k, POTN[k] + ' · ' + smoney(D.pots[k])])) }, { k: 'amt', label: 'Amount ($)', type: 'number', min: .01, step: .01, req: true, check: (a, o) => a > (o.from === 'main' ? main() : D.pots[o.from]) ? 'Not enough in that account' : '' }, { k: 'cat', label: 'Category', type: 'select', opts: ['Workspace', 'Fees', 'Tax', 'Equipment', 'Other'] }, { k: 'ref', label: 'Reference', req: true }];
ACT.schedTog = b => { const s = byId(D.sched, b.dataset.id); s.on = b.checked; save(); sideBox(); toast(s.on ? 'Scheduled payment on' : 'Scheduled payment paused'); };
ACT.addSched = () => formModal({ title: 'Schedule a payment', save: 'Schedule', fields: [{ k: 'payee', label: 'To', type: 'select', opts: D.payees.map(p => [p.id, p.name]), full: true }, { k: 'amt', label: 'Amount ($)', type: 'number', min: 1, req: true }, { k: 'every', label: 'How often', type: 'select', opts: ['Once', 'Weekly', 'Monthly', 'Every 3 months'] }, { k: 'next', label: 'First payment', type: 'date', req: true, check: d => d <= TODAY_S ? 'Pick a future date' : '' }], values: { every: 'Monthly', next: addDays(TODAY_S, 7) }, onSave: x => { D.sched.push({ id: uid('q'), ...x, on: true }); commit('Scheduled'); } });
ACT.addPayee = () => formModal({ title: 'New payee', save: 'Add', fields: [{ k: 'name', label: 'Name', req: true, full: true }, { k: 'acct', label: 'Account number', req: true, check: x => x.replace(/\D/g, '').length >= 6 ? '' : 'At least 6 digits' }], onSave: x => { D.payees.push({ id: uid('y'), name: x.name, acct: '•• ' + x.acct.replace(/\D/g, '').slice(-4) }); commit(x.name + ' added'); } });

/* ---------- Page: Insights ---------- */
PAGES.insights = {
  title: 'Insights', render(v) {
    const ks = monthKeys(6), yr = TODAY_S.slice(0, 4), inc = sum(D.tx.filter(t => t.amt > 0 && t.date.startsWith(yr)).map(t => t.amt)), due = inc * D.rules.tax / 100 - 1850;
    v.innerHTML = `<div class="grid g3"><section class="card tax-card"><div class="ch"><h3>Tax check</h3></div><small>Estimated tax still to pay this year</small><div class="big">${money(Math.max(0, due))}</div><p>${D.pots.tax >= due ? `You have <b>${money(D.pots.tax - due)}</b> more than you need in the tax pot.` : `You are <b>${money(due - D.pots.tax)}</b> short in the tax pot.`}</p></section><section class="card span2"><div class="ch"><h3>In and out</h3><span class="sub">6 months, pots not counted</span></div><div class="chart" id="ioB"></div></section></div>
    <div class="grid g2"><section class="card"><div class="ch"><h3>Who pays you</h3></div><div id="byC"></div></section><section class="card"><div class="ch"><h3>Where it goes</h3></div><div class="chart" id="catDn"></div></section></div>`;
    barChart($('#ioB'), { labels: ks.map(fMon), series: [{ name: 'In', data: ks.map(k => sum(D.tx.filter(t => t.amt > 0 && t.date.startsWith(k)).map(t => t.amt))), color: 'var(--c3)' }, { name: 'Out', data: ks.map(k => -sum(D.tx.filter(t => t.amt < 0 && t.cat !== 'Pots' && t.date.startsWith(k)).map(t => t.amt))), color: 'var(--c2)' }], fmt: x => money(x), h: 220 });
    const byC = {}; D.inv.filter(x => x.status === 'paid').forEach(x => { byC[x.client] = (byC[x.client] || 0) + invTotal(x); });
    hbars($('#byC'), Object.entries(byC).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id, value], i) => ({ name: client(id).name, value, color: ['#7b5cff', '#ff7a1a', '#2fb36b', '#ff5ca8', '#4cc3ff', '#8b877c'][i] })), x => money(x));
    const g = groupSum(D.tx.filter(t => t.amt < 0 && t.cat !== 'Pots'), 'cat', t => -t.amt);
    donut($('#catDn'), { items: Object.entries(g).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value), label: 'Spent, 6 months', size: 140, sw: 18 });
  }
};

/* ---------- Page: Settings ---------- */
const setF = [{ k: 'name', label: 'Your name', req: true }, { k: 'trade', label: 'What you do', req: true }, { k: 'email', label: 'Email on invoices', type: 'email', req: true, full: true }, { k: 'addr', label: 'Address on invoices', req: true, full: true }];
PAGES.settings = {
  title: 'Settings', render(v) {
    v.innerHTML = `<div class="grid g2"><section class="card"><div class="ch"><h3>You</h3></div><form id="setF" novalidate>${fieldsHTML(setF, D.set)}<div class="row" style="margin-top:14px"><button type="submit" class="btn pri">Save</button></div></form></section><section class="card"><div class="ch"><h3>Look</h3></div><div class="row"><button type="button" class="btn" data-act="setTheme" data-v="light">${ico('sun')}Paper</button><button type="button" class="btn" data-act="setTheme" data-v="dark">${ico('moon')}Ink</button></div><div class="ch" style="margin-top:22px"><h3>Data</h3></div><div class="row"><button type="button" class="btn" data-act="csv">${ico('download')}Export</button><button type="button" class="btn danger" data-act="reset">${ico('refresh')}Reset demo data</button></div></section></div>`;
    $('#setF').addEventListener('submit', e => { e.preventDefault(); const x = readFields($('#setF'), setF); if (x) { Object.assign(D.set, x); whoBox(); commit('Saved'); } });
  }
};
ACT.setTheme = b => { setTheme(b.dataset.v); toast('Theme changed'); };
ACT.reset = () => confirmBox('Reset everything to the demo?', () => { D = seed(); save(); whoBox(); refresh(); sideBox(); toast('Demo data reset'); }, { ok: 'Reset' });

/* ---------- Boot ---------- */
const whoBox = () => { $('.who-b b').textContent = D.set.name; $('.who-b small').textContent = D.set.trade; };
whoBox(); sideBox();
boot({
  name: 'Freelane', key: KEY, home: 'home',
  nav: [['home', 'Home', 'home'], ['activity', 'Activity', 'receipt'], ['invoices', 'Invoices', 'doc'], ['pots', 'Pots', 'layers'], ['cards', 'Cards', 'card'], ['transfers', 'Transfers', 'send'], ['insights', 'Insights', 'chart'], ['settings', 'Settings', 'cog']],
  notes: [['Moonshot Games opened invoice ' + (D.inv[D.inv.length - 1] || {}).no, 'info', '11:02'], ['Your tax pot passed ' + smoney(Math.floor(D.pots.tax / 1000) * 1000), 'ok', 'yesterday'], ['An invoice is more than 2 weeks late', 'bad', '3 days ago']],
  commands: [{ label: 'New invoice', hint: 'Action', run: ACT.newInv }, { label: 'New virtual card', hint: 'Action', run: ACT.newCard }, { label: 'Simulate a payment', hint: 'Action', run: () => landPayment(1200, 'Kettle & Co.') }],
  search: q => D.clients.filter(c => c.name.toLowerCase().includes(q)).map(c => ({ label: c.name, hint: 'Client', run: () => go('invoices') }))
});

</script>
</body>
</html>
