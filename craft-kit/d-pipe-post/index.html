<!doctype html>
<!-- Chill & Craft · Pipe Post · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipe Post · send button with an air tube</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #ece3d2;
    --card: #fffaf0;
    --edge: #e3d6bd;
    --wall: #f3ead8;
    --ink: #2b2116;
    --muted: #7a6a55;
    --brass: #c9963a;
    --brass-dark: #7a5520;
    --brass-light: #f1d48f;
    --glass: rgba(255, 255, 255, 0.55);
    --lit: #12b3a3;
    --red: #d8443a;
    --ok: #1f9d55;
    --field: #fbf5e9;
    --shadow: rgba(80, 55, 20, 0.3);
    --focus: #2b2116;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b1412;
    --card: #13201c;
    --edge: #22352f;
    --wall: #182a25;
    --ink: #f2ead9;
    --muted: #a8b3a6;
    --brass: #d9a94d;
    --brass-dark: #8a6224;
    --brass-light: #ffe2a0;
    --glass: rgba(255, 255, 255, 0.14);
    --lit: #3ef0d0;
    --red: #ff6a5c;
    --ok: #45d483;
    --field: #0f1b18;
    --shadow: rgba(0, 0, 0, 0.7);
    --focus: #ffe2a0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image: repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in srgb, var(--edge) 50%, transparent) 46px 47px);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card {
    width: min(560px, 100%);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 26px;
    box-shadow: 0 34px 60px -40px var(--shadow);
    overflow: hidden;
  }

  /* ---------- The tube scene ---------- */
  .scene { display: block; width: 100%; height: auto; background: var(--wall); border-bottom: 1px solid var(--edge); }
  .rivet { fill: var(--brass); opacity: 0.55; }
  .tube-outer { fill: none; stroke: var(--brass-dark); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
  .tube-inner { fill: none; stroke: var(--wall); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
  .tube-glass { fill: none; stroke: var(--glass); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
  .tube-lit { fill: none; stroke: var(--lit); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; filter: url(#lit-blur); }
  .tube-shine { fill: none; stroke: #fff; stroke-width: 1.6; opacity: 0.45; stroke-linecap: round; }
  .ring { fill: var(--brass); stroke: var(--brass-dark); stroke-width: 1; }
  .brass { fill: var(--brass); stroke: var(--brass-dark); stroke-width: 1.5; }
  .brass-dark { fill: var(--brass-dark); }
  .label { font: 700 8px system-ui, sans-serif; letter-spacing: 1.5px; fill: var(--muted); }
  .dial { fill: var(--card); stroke: var(--brass-dark); stroke-width: 2; }
  .needle { stroke: var(--red); stroke-width: 2; stroke-linecap: round; transform-origin: 110px 134px; transform: rotate(-60deg); transition: transform 0.7s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .scene.pressure .needle { transform: rotate(48deg); }
  .lamp { fill: var(--red); transition: fill 0.3s; }
  .lamp-glow { fill: var(--ok); opacity: 0; transition: opacity 0.3s; }
  .scene.arrived .lamp { fill: var(--ok); }
  .scene.arrived .lamp-glow { opacity: 0.5; animation: glow 1s ease-in-out 2; }
  @keyframes glow { 50% { opacity: 0.15; } }
  .door { transform-box: fill-box; transform-origin: 0% 50%; transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .scene.arrived .door { transform: scaleX(0.15) skewY(-12deg); }
  .capsule { opacity: 0; }
  .capsule.on { opacity: 1; }
  .capsule .body { fill: var(--glass); stroke: var(--brass-dark); stroke-width: 1.2; }
  .capsule .paper { fill: #fff8e6; }
  .capsule .cap { fill: var(--brass); stroke: var(--brass-dark); stroke-width: 1; }
  .whoosh { stroke: var(--lit); stroke-width: 2; stroke-linecap: round; opacity: 0; }
  .inlet { fill: var(--brass); stroke: var(--brass-dark); stroke-width: 1.5; transform-box: fill-box; transform-origin: 50% 100%; }
  .inlet.thunk { animation: thunk 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes thunk { 40% { transform: scale(1.12, 0.86); } }
  .receiver.bounce { animation: bounce 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bounce { 35% { transform: scale(1.06, 0.92); } 70% { transform: scale(0.98, 1.04); } }

  /* ---------- The form ---------- */
  form { padding: 16px 18px 18px; }
  .title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .title h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  .title small { color: var(--muted); font-size: 12px; }
  .fields { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
  .fields label { display: block; font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 4px; }
  input, textarea {
    width: 100%; border: 1.5px solid var(--edge); background: var(--field); color: var(--ink);
    border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, textarea:focus { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 25%, transparent); outline: none; }
  textarea { resize: none; height: 64px; }
  .bad textarea { border-color: var(--red); animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .hint { margin: 0; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .bad .hint { color: var(--red); font-weight: 600; }
  .send {
    position: relative;
    flex: none;
    min-width: 150px;
    height: 46px;
    padding: 0 18px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--brass-light), var(--brass) 55%, var(--brass-dark));
    color: #2b1a05;
    font: inherit;
    font-weight: 800;
    font-size: 14.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 10px 18px -10px var(--brass-dark);
    transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), filter 0.2s;
  }
  .send:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .send:active { transform: translateY(1px) scale(0.96); transition-duration: 0.08s; }
  .send[data-state="working"] { cursor: progress; }
  .send[data-state="done"] { background: linear-gradient(180deg, #8ff0b8, var(--ok)); color: #04210f; }
  .send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .send .dots i { display: inline-block; width: 5px; height: 5px; margin: 0 1px; border-radius: 50%; background: currentColor; animation: hop 0.9s infinite; }
  .send .dots i:nth-child(2) { animation-delay: 0.12s; }
  .send .dots i:nth-child(3) { animation-delay: 0.24s; }
  @keyframes hop { 30% { transform: translateY(-4px); } 60% { transform: none; } }

  /* the note that flies from the text box into the inlet */
  .flying-note {
    position: fixed;
    z-index: 10;
    padding: 8px 10px;
    border-radius: 10px;
    background: #fff8e6;
    color: #2b2116;
    font-size: 13px;
    box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    pointer-events: none;
  }

  /* ---------- The front desk inbox ---------- */
  .inbox { border-top: 1px dashed var(--edge); margin: 0 18px; padding: 12px 0 16px; }
  .inbox h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .inbox ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .inbox li { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 8px 10px; border-radius: 12px; background: var(--field); border: 1px solid var(--edge); }
  .inbox li b { flex: none; }
  .inbox li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .inbox li time { flex: none; font-size: 11px; color: var(--muted); }
  .inbox li.new { animation: slide-in 0.6s cubic-bezier(0.3, 1.4, 0.5, 1); }
  @keyframes slide-in { from { opacity: 0; transform: translateY(-12px) scale(0.95); } }

  @media (max-width: 480px) {
    .fields { grid-template-columns: 1fr; }
    .foot { flex-direction: column-reverse; align-items: stretch; }
    .send { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="form-title">
    <svg class="scene" id="scene" viewBox="0 0 400 180" aria-hidden="true">
      <defs><filter id="lit-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6" /></filter></defs>
      <g class="rivets">
        <circle class="rivet" cx="12" cy="12" r="2.5"/><circle class="rivet" cx="388" cy="12" r="2.5"/><circle class="rivet" cx="12" cy="168" r="2.5"/><circle class="rivet" cx="388" cy="168" r="2.5"/>
      </g>
      <!-- pressure gauge -->
      <circle class="dial" cx="110" cy="134" r="19"/>
      <path d="M96 140a15 15 0 0 1 28 0" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 3"/>
      <line class="needle" x1="110" y1="134" x2="110" y2="120"/>
      <circle cx="110" cy="134" r="2.5" class="brass-dark"/>
      <text class="label" x="110" y="166" text-anchor="middle">PSI</text>

      <!-- the tube (same path drawn in layers) -->
      <g id="tube">
        <path class="tube-outer" id="path" d="M50 150V84C50 50 70 34 104 34H170C204 34 214 58 214 78C214 104 190 116 172 104C154 92 162 66 188 62C214 58 236 64 258 64H316C342 64 352 80 352 104V124"/>
        <path class="tube-inner" d="M50 150V84C50 50 70 34 104 34H170C204 34 214 58 214 78C214 104 190 116 172 104C154 92 162 66 188 62C214 58 236 64 258 64H316C342 64 352 80 352 104V124"/>
        <path class="tube-lit" id="lit" d="M50 150V84C50 50 70 34 104 34H170C204 34 214 58 214 78C214 104 190 116 172 104C154 92 162 66 188 62C214 58 236 64 258 64H316C342 64 352 80 352 104V124"/>
      </g>
      <g id="rings"></g>
      <!-- capsule rides inside the tube -->
      <g class="capsule" id="capsule">
        <line class="whoosh" x1="-30" y1="-4" x2="-18" y2="-4"/><line class="whoosh" x1="-36" y1="3" x2="-20" y2="3"/>
        <rect class="body" x="-15" y="-6" width="30" height="12" rx="6"/>
        <rect class="paper" x="-9" y="-3.5" width="18" height="7" rx="2"/>
        <rect class="cap" x="-16" y="-6.5" width="6" height="13" rx="3"/>
        <rect class="cap" x="10" y="-6.5" width="6" height="13" rx="3"/>
      </g>
      <g id="glass-top">
        <path class="tube-glass" d="M50 150V84C50 50 70 34 104 34H170C204 34 214 58 214 78C214 104 190 116 172 104C154 92 162 66 188 62C214 58 236 64 258 64H316C342 64 352 80 352 104V124"/>
        <path class="tube-shine" d="M46 146V84C46 52 66 31 102 30H170"/>
      </g>

      <!-- inlet funnel -->
      <path class="inlet" id="inlet" d="M30 176L36 150H64L70 176Z"/>
      <rect class="brass-dark" x="38" y="146" width="24" height="5" rx="2"/>
      <text class="label" x="74" y="172">INLET</text>

      <!-- receiver box at the front desk -->
      <g class="receiver" id="receiver">
        <rect class="brass" x="322" y="122" width="62" height="48" rx="8"/>
        <rect x="330" y="132" width="34" height="30" rx="4" fill="var(--wall)" stroke="var(--brass-dark)"/>
        <rect class="door brass" x="330" y="132" width="34" height="30" rx="4"/>
        <circle class="lamp-glow" cx="374" cy="138" r="8"/>
        <circle class="lamp" cx="374" cy="138" r="4"/>
        <text class="label" x="300" y="166" text-anchor="end">FRONT DESK</text>
      </g>
    </svg>

    <form id="form" novalidate>
      <div class="title"><h2 id="form-title">Send a note to the front desk</h2><small>Tubeworks Studio</small></div>
      <div class="fields">
        <div><label for="name">Your name</label><input id="name" type="text" autocomplete="name" placeholder="Hina" maxlength="30" /></div>
        <div><label for="msg">Note</label><textarea id="msg" maxlength="200" placeholder="Can we move my fitting to Friday?" aria-describedby="hint"></textarea></div>
      </div>
      <div class="foot">
        <p class="hint" id="hint" aria-live="polite">Notes arrive by air tube in about two seconds.</p>
        <button class="send" id="send" type="submit" data-state="idle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg><span>Send</span>
        </button>
      </div>
    </form>

    <div class="inbox">
      <h3>Front desk inbox</h3>
      <ul id="inbox" aria-live="polite">
        <li><b>Usman</b><span>Fabric samples are on the shelf.</span><time>9:12</time></li>
      </ul>
    </div>
  </section>
</main>

<script>
  (function () {
    var scene = document.getElementById("scene");
    var path = document.getElementById("path");
    var lit = document.getElementById("lit");
    var capsule = document.getElementById("capsule");
    var inlet = document.getElementById("inlet");
    var receiver = document.getElementById("receiver");
    var form = document.getElementById("form");
    var nameEl = document.getElementById("name");
    var msgEl = document.getElementById("msg");
    var hint = document.getElementById("hint");
    var send = document.getElementById("send");
    var inbox = document.getElementById("inbox");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var whooshes = capsule.querySelectorAll(".whoosh");
    var L = path.getTotalLength();
    var busy = false, raf = 0;
    var IDLE_HINT = hint.textContent;

    // ---------- Brass rings along the tube, placed from the path itself ----------
    var rings = document.getElementById("rings");
    [0.12, 0.3, 0.62, 0.8, 0.95].forEach(function (f) {
      var p = path.getPointAtLength(L * f), q = path.getPointAtLength(Math.min(L, L * f + 1));
      var a = (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI;
      var r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("class", "ring");
      r.setAttribute("x", -3);
      r.setAttribute("y", -11);
      r.setAttribute("width", 6);
      r.setAttribute("height", 22);
      r.setAttribute("rx", 2);
      r.setAttribute("transform", "translate(" + p.x + " " + p.y + ") rotate(" + a + ")");
      rings.appendChild(r);
    });
    lit.style.strokeDasharray = L;
    lit.style.strokeDashoffset = L;

    // ---------- Button states ----------
    function setButton(state, html) {
      send.dataset.state = state;
      send.innerHTML = html;
    }
    var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg>';
    var DOTS = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';

    // ---------- Moving the capsule along the tube ----------
    function placeCapsule(len) {
      var p = path.getPointAtLength(len);
      var ahead = path.getPointAtLength(Math.min(L, len + 1));
      var behind = path.getPointAtLength(Math.max(0, len - 1));
      var a = (Math.atan2(ahead.y - behind.y, ahead.x - behind.x) * 180) / Math.PI;
      capsule.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + p.y.toFixed(2) + ") rotate(" + a.toFixed(1) + ")");
    }
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function travel(done) {
      var start = performance.now(), D = 2300, prev = 0;
      function frame(now) {
        var t = Math.min(1, (now - start) / D);
        var len = ease(t) * L;
        placeCapsule(len);
        lit.style.strokeDashoffset = L - len; // the tube lights up behind the capsule
        var speed = Math.abs(len - prev);
        prev = len;
        for (var i = 0; i < whooshes.length; i++) whooshes[i].style.opacity = Math.min(0.9, speed / 6);
        if (t < 1) raf = requestAnimationFrame(frame);
        else done();
      }
      raf = requestAnimationFrame(frame);
    }

    // ---------- The note lifts off the text box and drops into the inlet ----------
    function flyNote(text, done) {
      if (reduce.matches || !document.body.animate) { done(); return; }
      var a = msgEl.getBoundingClientRect(), b = inlet.getBoundingClientRect();
      var note = document.createElement("div");
      note.className = "flying-note";
      note.textContent = text.length > 60 ? text.slice(0, 57) + "…" : text;
      note.style.left = a.left + "px";
      note.style.top = a.top + "px";
      note.style.width = a.width + "px";
      note.style.height = a.height + "px";
      document.body.appendChild(note);
      var dx = b.left + b.width / 2 - (a.left + a.width / 2);
      var dy = b.top + b.height / 3 - (a.top + a.height / 2);
      note.animate([
        { transform: "none", opacity: 1 },
        { transform: "translate(" + dx * 0.4 + "px," + (dy * 0.4 - 40) + "px) rotate(-6deg) scale(0.6, 0.5)", opacity: 1, offset: 0.45 },
        { transform: "translate(" + dx + "px," + dy + "px) rotate(-18deg) scale(0.06, 0.12)", opacity: 0.6 }
      ], { duration: 650, easing: "cubic-bezier(.45,0,.4,1)" }).onfinish = function () {
        note.remove();
        done();
      };
    }

    function deliver(name, text) {
      var li = document.createElement("li");
      li.className = "new";
      var now = new Date();
      li.innerHTML = "<b></b><span></span><time></time>";
      li.querySelector("b").textContent = name;
      li.querySelector("span").textContent = text;
      li.querySelector("time").textContent = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
      inbox.insertBefore(li, inbox.firstChild);
      while (inbox.children.length > 3) inbox.removeChild(inbox.lastChild);
    }

    function reset() {
      busy = false;
      scene.classList.remove("arrived", "pressure");
      capsule.classList.remove("on");
      lit.style.transition = "opacity 0.6s";
      lit.style.opacity = "0";
      setTimeout(function () {
        lit.style.transition = "";
        lit.style.opacity = "";
        lit.style.strokeDashoffset = L;
      }, 650);
      setButton("idle", ARROW + "<span>Send</span>");
      hint.textContent = IDLE_HINT;
    }

    // ---------- Send: idle → rolling up → in the tube → delivered → idle ----------
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      var text = msgEl.value.trim();
      var name = nameEl.value.trim() || "Guest";
      if (!text) {
        form.classList.remove("bad");
        void form.offsetWidth;
        form.classList.add("bad");
        hint.textContent = "Write a few words for the note first.";
        msgEl.focus();
        return;
      }
      form.classList.remove("bad");
      busy = true;
      setButton("working", DOTS + "<span>Rolling up</span>");
      hint.textContent = "Rolling your note into a capsule…";

      flyNote(text, function () {
        msgEl.value = "";
        inlet.classList.remove("thunk");
        void inlet.getBoundingClientRect();
        inlet.classList.add("thunk");
        placeCapsule(0);
        capsule.classList.add("on");
        scene.classList.add("pressure");
        setButton("working", DOTS + "<span>In the tube</span>");
        hint.textContent = "Whoosh! Your note is on its way.";
        var arrive = function () {
          scene.classList.add("arrived");
          receiver.classList.remove("bounce");
          void receiver.getBoundingClientRect();
          receiver.classList.add("bounce");
          capsule.classList.remove("on");
          deliver(name, text);
          setButton("done", "<span>Delivered ✓</span>");
          hint.textContent = "Delivered to the front desk.";
          setTimeout(reset, 2200);
        };
        if (reduce.matches) {
          lit.style.strokeDashoffset = 0;
          setTimeout(arrive, 300);
        } else {
          setTimeout(function () { travel(arrive); }, 350);
        }
      });
    });
    msgEl.addEventListener("input", function () {
      if (form.classList.contains("bad")) { form.classList.remove("bad"); hint.textContent = IDLE_HINT; }
    });
  })();
</script>
</body>
</html>
