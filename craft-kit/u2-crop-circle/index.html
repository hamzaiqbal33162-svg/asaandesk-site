<!doctype html>
<!-- Chill & Craft · Crop Circle · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Circle · avatar upload</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --bg1: #f4f0ff;
    --bg2: #ddd3f7;
    --card: #ffffff;
    --edge: #e7e0fa;
    --ink: #1d1535;
    --soft: #6b6288;
    --well: #f5f2fd;
    --accent: #6d4aff;
    --accent2: #a78bfa;
    --gold: #e0a524;
    --ok: #12a36b;
    --bad: #e0445a;
    --focus: #2563eb;
    --shadow: 0 34px 70px -40px rgba(56, 30, 140, .55);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #1c1838;
      --bg2: #0a0817;
      --card: #16122b;
      --edge: #2a2449;
      --ink: #efeaff;
      --soft: #a59cc8;
      --well: #1f1a3a;
      --accent: #8b6cff;
      --accent2: #c4b1ff;
      --gold: #f5c451;
      --ok: #3ccf8e;
      --bad: #ff6b80;
      --focus: #93c5fd;
      --shadow: 0 34px 70px -40px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1c1838;
    --bg2: #0a0817;
    --card: #16122b;
    --edge: #2a2449;
    --ink: #efeaff;
    --soft: #a59cc8;
    --well: #1f1a3a;
    --accent: #8b6cff;
    --accent2: #c4b1ff;
    --gold: #f5c451;
    --ok: #3ccf8e;
    --bad: #ff6b80;
    --focus: #93c5fd;
    --shadow: 0 34px 70px -40px rgba(0, 0, 0, .9);
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    color: var(--ink);
    background:
      radial-gradient(60% 50% at 15% 10%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 70%),
      radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2) 92%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { width: 100%; padding: 22px 16px; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
  .card {
    position: relative;
    width: 740px;
    max-width: 100%;
    padding: 20px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--edge);
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 272px;
    gap: 14px 22px;
  }
  .top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .top p { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
  .badge { flex: none; max-width: 46%; padding: 6px 11px; border-radius: 999px; background: var(--well); border: 1px solid var(--edge); font-size: 12px; font-weight: 700; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s, background .3s; }
  .badge[data-tone="ok"] { color: var(--ok); }
  .badge[data-tone="bad"] { color: var(--bad); }

  /* ---------- Cropper ---------- */
  .work { display: grid; justify-items: center; gap: 12px; min-width: 0; }
  .cropper {
    position: relative;
    width: min(330px, 100%);
    aspect-ratio: 1;
    border-radius: 24px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background: repeating-conic-gradient(#d9d2ee 0 25%, #efebfa 0 50%) 0 0 / 22px 22px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
    outline: none;
  }
  :root[data-theme="dark"] .cropper { background: repeating-conic-gradient(#221d3d 0 25%, #1a1631 0 50%) 0 0 / 22px 22px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cropper { background: repeating-conic-gradient(#221d3d 0 25%, #1a1631 0 50%) 0 0 / 22px 22px; } }
  .cropper:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
  .cropper.dragging { cursor: grabbing; }
  .cropper canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* dark veil with a round hole the size of the crop */
  .shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle closest-side, transparent 79.4%, rgba(14, 8, 36, .62) 80%); transition: opacity .4s; }
  .shade.deep { background: radial-gradient(circle closest-side, transparent 79.4%, rgba(14, 8, 36, .86) 80%); }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .ring .dash { fill: none; stroke: rgba(255, 255, 255, .9); stroke-width: .7; stroke-dasharray: 2.2 1.6; transform-origin: 50px 50px; animation: spin 30s linear infinite; }
  .ring .solid { fill: none; stroke: #fff; stroke-width: .45; opacity: .5; }
  .ring .glint { transform-origin: 50px 50px; animation: spin 5.5s linear infinite; }
  .ring .glint circle { fill: var(--gold); filter: drop-shadow(0 0 1.6px var(--gold)); }
  .ring .grid { stroke: rgba(255, 255, 255, .55); stroke-width: .35; opacity: 0; transition: opacity .25s; }
  .cropper.dragging .ring .grid, .cropper.show-grid .ring .grid { opacity: 1; }
  .ring .wrapper { transform-origin: 50px 50px; transition: transform .55s var(--spring); }
  .cropper.tight .ring .wrapper { transform: scale(.93); }
  .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 5px 10px; border-radius: 999px; background: rgba(14, 8, 36, .66); color: #fff; font-size: 11.5px; font-weight: 650; white-space: nowrap; pointer-events: none; transition: opacity .3s; }
  .cropper.drop-on { box-shadow: inset 0 0 0 3px var(--accent2), 0 0 0 6px color-mix(in srgb, var(--accent2) 30%, transparent); }
  .flash { position: absolute; left: 10%; top: 10%; width: 80%; height: 80%; border-radius: 50%; background: #fff; opacity: 0; pointer-events: none; }

  .tools { display: flex; align-items: center; gap: 8px; width: min(330px, 100%); }
  .ib {
    flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
    border: 1px solid var(--edge); background: var(--well); color: var(--ink); cursor: pointer; font: inherit;
    transition: transform .35s var(--spring), background .2s;
  }
  .ib:hover { background: color-mix(in srgb, var(--accent2) 18%, var(--well)); }
  .ib:active { transform: scale(.9); }
  .ib:focus-visible, .btn:focus-visible, .dl:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; cursor: pointer; }
  input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Profile side ---------- */
  .side { display: grid; align-content: start; gap: 12px; min-width: 0; }
  .pcard { position: relative; display: grid; justify-items: center; text-align: center; padding: 18px 14px 14px; border-radius: 22px; background: var(--well); border: 1px solid var(--edge); }
  .pcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 54px; border-radius: 22px 22px 0 0; background: linear-gradient(120deg, var(--accent), var(--accent2) 60%, var(--gold)); opacity: .9; }
  .av-wrap { position: relative; width: 104px; height: 104px; display: grid; place-items: center; }
  .av { position: relative; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #8b6cff, #f5a3c7); color: #fff; font-weight: 800; font-size: 26px; letter-spacing: .02em; border: 3px solid var(--card); overflow: hidden; }
  .av canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .av.has canvas { opacity: 1; }
  .prog { position: absolute; inset: 0; width: 104px; height: 104px; transform: rotate(-90deg); pointer-events: none; }
  .prog circle { fill: none; stroke-width: 4; stroke-linecap: round; }
  .prog .track { stroke: color-mix(in srgb, var(--accent2) 25%, transparent); opacity: 0; transition: opacity .3s; }
  .prog .bar { stroke: var(--accent); stroke-dasharray: 301.6; stroke-dashoffset: 301.6; transition: stroke-dashoffset .12s linear, stroke .3s; }
  .pcard.uploading .track { opacity: 1; }
  .pcard.done .bar { stroke: var(--ok); }
  .pcard h2 { margin: 6px 0 0; font-size: 16px; }
  .pcard p { margin: 2px 0 0; font-size: 12.5px; color: var(--soft); }
  .live { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--edge); width: 100%; }
  .live figure { margin: 0; display: grid; justify-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--soft); text-transform: uppercase; letter-spacing: .08em; }
  .live canvas { border-radius: 50%; background: var(--edge); display: block; }
  .actions { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
  .actions .ghost { padding: 0 14px; }
  .btn {
    position: relative; height: 46px; border-radius: 14px; border: 0; font: inherit; font-size: 14.5px; font-weight: 750; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; overflow: hidden;
    transition: transform .35s var(--spring), filter .2s, background .3s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(.96); transition-duration: .1s; }
  .btn.ghost { background: var(--well); color: var(--ink); border: 1px solid var(--edge); }
  .btn.main { background: linear-gradient(180deg, var(--accent2), var(--accent)); color: #fff; box-shadow: 0 14px 24px -14px var(--accent), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .btn.main[aria-disabled="true"] { cursor: progress; }
  .btn.main[data-state="done"] { background: linear-gradient(180deg, #34d399, #0f9a62); box-shadow: 0 14px 24px -14px #0f9a62; }
  .btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .btn .lbl { overflow: hidden; text-overflow: ellipsis; }
  .note { margin: 0; min-height: 34px; font-size: 12.5px; line-height: 1.4; color: var(--soft); }
  .dl { display: inline-block; margin-top: 2px; color: var(--accent); font-weight: 750; font-size: 13px; text-decoration: none; border-bottom: 1.5px solid currentColor; }
  .dl[hidden] { display: none; }

  .fly { position: absolute; z-index: 5; border-radius: 50%; pointer-events: none; transform-origin: 0 0; box-shadow: 0 18px 30px -12px rgba(40, 20, 110, .6); }
  .spark { position: absolute; z-index: 6; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 2px; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .shake { animation: shake .4s ease-in-out; }

  @media (max-width: 700px) {
    .card { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 12px; }
    .cropper, .tools { width: min(300px, 100%); }
    .pcard { grid-template-columns: auto minmax(0, 1fr); justify-items: start; text-align: left; align-items: center; column-gap: 12px; padding: 12px; }
    .pcard::before { display: none; }
    .av-wrap { border-radius: 50%; background: conic-gradient(from 210deg, var(--accent), var(--accent2), var(--gold), var(--accent)); }
    .av-wrap { grid-row: 1 / 3; width: 76px; height: 76px; }
    .av-wrap .prog { width: 76px; height: 76px; }
    .av { width: 64px; height: 64px; font-size: 20px; }
    .pcard h2 { margin: 0; align-self: end; }
    .pcard p { align-self: start; }
    .live { grid-column: 1 / -1; margin-top: 8px; padding-top: 8px; }
    .note { min-height: 18px; }
  }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" id="card" aria-labelledby="ttl">
    <header class="top">
      <div><h1 id="ttl">Profile photo</h1><p>Drag to frame your face, zoom, then save.</p></div>
      <span class="badge" id="badge">Sample photo</span>
    </header>

    <div class="work">
      <div class="cropper" id="cropper" tabindex="0" role="group" aria-label="Crop area. Drag or use the arrow keys to move the photo, plus and minus to zoom, R to rotate.">
        <canvas id="view" aria-hidden="true"></canvas>
        <span class="shade" id="shade"></span>
        <span class="flash" id="flash"></span>
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs><clipPath id="hole"><circle cx="50" cy="50" r="40" /></clipPath></defs>
          <g class="grid" clip-path="url(#hole)">
            <path d="M36.7 10V90M63.3 10V90M10 36.7H90M10 63.3H90" />
          </g>
          <g class="wrapper">
            <circle class="solid" cx="50" cy="50" r="40" />
            <circle class="dash" id="dash" cx="50" cy="50" r="40" />
            <g class="glint"><circle cx="50" cy="10" r="1.5" /></g>
          </g>
        </svg>
        <span class="hint" id="hint">Drag to move · scroll to zoom</span>
      </div>
      <div class="tools">
        <button class="ib" id="zoomOut" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
        <button class="ib" id="zoomIn" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg></button>
        <button class="ib" id="rotate" type="button" aria-label="Rotate 90 degrees"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 1-2.4-5.7M20 4v5h-5" /></svg></button>
      </div>
    </div>

    <div class="side">
      <div class="pcard" id="pcard">
        <div class="av-wrap" id="avWrap">
          <div class="av" id="av"><span id="initials">AK</span><canvas id="avCanvas" width="176" height="176" aria-hidden="true"></canvas></div>
          <svg class="prog" viewBox="0 0 104 104" aria-hidden="true"><circle class="track" cx="52" cy="52" r="48" /><circle class="bar" id="bar" cx="52" cy="52" r="48" /></svg>
        </div>
        <h2>Ayesha Khan</h2>
        <p>Product designer · Lahore</p>
        <div class="live" aria-label="Live preview">
          <figure><canvas id="p1" width="44" height="44"></canvas>Feed</figure>
          <figure><canvas id="p2" width="30" height="30"></canvas>Chat</figure>
          <figure><canvas id="p3" width="20" height="20"></canvas>Tag</figure>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="choose" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><circle cx="9" cy="10" r="1.8" /><path d="M21 16l-5-5-8 8" /></svg>
          <span class="lbl">Choose</span>
        </button>
        <button class="btn main" id="save" type="button" data-state="idle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 19h14" /></svg>
          <span class="lbl" id="saveLbl">Save avatar</span>
        </button>
      </div>
      <p class="note" id="note">JPG, PNG, WebP or GIF. The photo is read on your device; the upload is simulated.</p>
      <a class="dl" id="dl" download="avatar.png" hidden>Download your 256 px PNG</a>
      <input class="sr-only" type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
  // ---------- Crop Circle avatar upload ----------
  const $ = (s) => document.querySelector(s);
  const card = $("#card"), cropper = $("#cropper"), view = $("#view"), vctx = view.getContext("2d");
  const shade = $("#shade"), flash = $("#flash"), hint = $("#hint"), dash = $("#dash");
  const zoomEl = $("#zoom"), badge = $("#badge"), note = $("#note"), statusEl = $("#status");
  const pcard = $("#pcard"), av = $("#av"), avCanvas = $("#avCanvas"), bar = $("#bar"), avWrap = $("#avWrap");
  const saveBtn = $("#save"), saveLbl = $("#saveLbl"), fileEl = $("#file"), dl = $("#dl");
  const previews = ["#p1", "#p2", "#p3"].map((s) => $(s));
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const say = (t) => { statusEl.textContent = t; };
  const kb = (n) => (n < 1024 ? n + " bytes" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB");
  const DEFAULT_NOTE = note.textContent;

  // ---------- Run control: every sequence carries an id; a newer id cancels the old one ----------
  const STOP = new Error("stopped");
  let runId = 0, busy = false;
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === runId ? res() : rej(STOP)), ms));
  const guard = (id) => { if (id !== runId) throw STOP; };

  // ---------- Crop state ----------
  // The image sits behind a round hole whose diameter is 80% of the square crop area.
  let img = null, iw = 1, ih = 1, zoom = 1, rot = 0, ox = 0, oy = 0, S = 300, srcName = "sample";
  const D = () => S * 0.8;
  const dims = () => (rot % 2 ? [ih, iw] : [iw, ih]);                  // width and height after rotation
  const base = () => S / Math.min(...dims());                          // zoom 1 = the short side fills the whole square
  function clampOffsets() {
    // keep the whole square covered, so no empty edge ever shows round the circle
    const [w, h] = dims(), s = base() * zoom;
    const mx = Math.max(0, (w * s - S) / 2), my = Math.max(0, (h * s - S) / 2);
    ox = Math.min(mx, Math.max(-mx, ox));
    oy = Math.min(my, Math.max(-my, oy));
  }
  // Draws the photo into any square canvas: k = canvas pixels per crop-area CSS pixel
  function paint(ctx, size, k, clipCircle) {
    ctx.clearRect(0, 0, size, size);
    if (!img) return;
    ctx.save();
    if (clipCircle) { ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); ctx.clip(); }
    ctx.imageSmoothingQuality = "high";
    ctx.translate(size / 2 + ox * k, size / 2 + oy * k);
    ctx.rotate(rot * Math.PI / 2);
    const s = base() * zoom * k;
    ctx.scale(s, s);
    ctx.drawImage(img, -iw / 2, -ih / 2);
    ctx.restore();
  }
  const dpr = () => Math.min(2, window.devicePixelRatio || 1);
  function render() {
    const px = Math.round(S * dpr());
    if (view.width !== px) { view.width = px; view.height = px; }
    paint(vctx, px, dpr(), false);
    previews.forEach((c) => {
      const n = c.width;
      if (!c.dataset.px) { const css = n; c.style.width = css + "px"; c.style.height = css + "px"; c.width = c.height = css * 2; c.dataset.px = "1"; }
      paint(c.getContext("2d"), c.width, c.width / D(), true);
    });
  }
  function setZoom(v) {
    const old = base() * zoom;
    zoom = Math.min(3, Math.max(1, v));
    const r = (base() * zoom) / old;
    ox *= r; oy *= r;
    clampOffsets();
    zoomEl.value = zoom.toFixed(2);
    zoomEl.setAttribute("aria-valuetext", Math.round(zoom * 100) + "%");
    render();
  }
  function move(dx, dy) { ox += dx; oy += dy; clampOffsets(); render(); }
  function rotate() {
    rot = (rot + 1) % 4;
    [ox, oy] = [-oy, ox];                                              // the framed spot turns with the photo
    clampOffsets();
    render();
    play(view, [{ transform: "rotate(-90deg) scale(.92)" }, { transform: "rotate(0) scale(1)" }], { duration: 520, easing: SPRING });
    say("Rotated to " + rot * 90 + " degrees.");
  }
  new ResizeObserver(() => {
    const ns = cropper.clientWidth || 300;
    if (ns === S) return;
    ox *= ns / S; oy *= ns / S; S = ns;
    render();
  }).observe(cropper);

  // ---------- A sample portrait, drawn on the spot ----------
  function samplePortrait() {
    const c = document.createElement("canvas");
    c.width = 640; c.height = 800;
    const g = c.getContext("2d");
    const bg = g.createLinearGradient(0, 0, 0, 800);
    bg.addColorStop(0, "#ffd9a8"); bg.addColorStop(.55, "#f3b6c8"); bg.addColorStop(1, "#b9a4ff");
    g.fillStyle = bg; g.fillRect(0, 0, 640, 800);
    g.fillStyle = "rgba(255, 246, 220, .75)"; g.beginPath(); g.arc(470, 210, 150, 0, 7); g.fill();
    for (let i = 0; i < 14; i++) { g.fillStyle = "rgba(255,255,255," + (0.08 + (i % 4) * 0.04) + ")"; g.beginPath(); g.arc((i * 137) % 640, 90 + ((i * 211) % 520), 14 + (i % 5) * 9, 0, 7); g.fill(); }
    // hair behind the head
    g.fillStyle = "#2b1915"; g.beginPath(); g.ellipse(320, 330, 150, 175, 0, 0, 7); g.fill();
    g.fillRect(172, 330, 296, 230);
    // shirt and scarf
    g.fillStyle = "#1f8a85"; g.beginPath(); g.ellipse(320, 860, 290, 260, 0, Math.PI, 0); g.fill();
    g.fillStyle = "#c27f59"; g.fillRect(283, 440, 74, 120);
    g.beginPath(); g.moveTo(268, 600); g.lineTo(320, 690); g.lineTo(372, 600); g.fill();
    g.strokeStyle = "#e0467c"; g.lineWidth = 46; g.lineCap = "round"; g.beginPath(); g.moveTo(120, 640); g.quadraticCurveTo(320, 760, 540, 610); g.stroke();
    // face
    g.fillStyle = "#d99a70"; g.beginPath(); g.ellipse(320, 330, 112, 134, 0, 0, 7); g.fill();
    g.fillStyle = "#2b1915"; g.beginPath(); g.ellipse(300, 222, 132, 70, -.25, Math.PI, 0); g.fill();
    g.fillStyle = "rgba(255,110,120,.28)"; [[262, 382], [378, 382]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 26, 0, 7); g.fill(); });
    g.fillStyle = "#2b1915"; [[280, 330], [360, 330]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 9, 12, 0, 0, 7); g.fill(); });
    g.strokeStyle = "#2b1915"; g.lineWidth = 6; g.lineCap = "round";
    [[258, 298, 300, 292], [340, 292, 382, 298]].forEach(([a, b, c2, d]) => { g.beginPath(); g.moveTo(a, b); g.quadraticCurveTo((a + c2) / 2, b - 12, c2, d); g.stroke(); });
    g.strokeStyle = "#a8603f"; g.lineWidth = 4; g.beginPath(); g.moveTo(320, 340); g.quadraticCurveTo(312, 370, 324, 374); g.stroke();
    g.strokeStyle = "#8a2f36"; g.lineWidth = 7; g.beginPath(); g.moveTo(288, 404); g.quadraticCurveTo(320, 428, 352, 404); g.stroke();
    g.fillStyle = "#f2c14e"; [[208, 372], [432, 372]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); g.beginPath(); g.arc(x, y + 22, 6, 0, 7); g.fill(); });
    return c;
  }
  function useImage(source, w, h, name) {
    img = source; iw = w; ih = h; srcName = name;
    rot = 0; ox = 0; oy = 0; zoom = 1;
    setZoom(1);
  }

  // ---------- Real file reading ----------
  function readFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { complain(file.name + " is not a picture. Pick a JPG, PNG, WebP or GIF."); return; }
    const url = URL.createObjectURL(file);
    const pic = new Image();
    pic.onload = () => {
      stopAll();
      useImage(pic, pic.naturalWidth, pic.naturalHeight, file.name);
      badge.textContent = file.name; badge.dataset.tone = "";
      note.textContent = file.name + " · " + pic.naturalWidth + " × " + pic.naturalHeight + " px · " + kb(file.size) + ". Frame it, then save.";
      say("Loaded " + file.name + ". Drag to frame it, then press Save avatar.");
      intro();
    };
    pic.onerror = () => { URL.revokeObjectURL(url); complain("That picture could not be opened. Try another file."); };
    pic.src = url;
  }
  function complain(msg) {
    badge.textContent = "Not a picture"; badge.dataset.tone = "bad";
    note.textContent = msg; say(msg);
    cropper.classList.remove("shake"); void cropper.offsetWidth; cropper.classList.add("shake");
  }
  $("#choose").addEventListener("click", () => fileEl.click());
  fileEl.addEventListener("change", () => { readFile(fileEl.files[0]); fileEl.value = ""; });
  cropper.addEventListener("dragover", (e) => { e.preventDefault(); cropper.classList.add("drop-on"); });
  cropper.addEventListener("dragleave", () => cropper.classList.remove("drop-on"));
  cropper.addEventListener("drop", (e) => { e.preventDefault(); cropper.classList.remove("drop-on"); readFile(e.dataTransfer.files[0]); });
  ["dragover", "drop"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));

  // ---------- Pan, zoom and rotate by hand ----------
  let drag = null;
  cropper.addEventListener("pointerdown", (e) => {
    if (busy) return;
    drag = { x: e.clientX, y: e.clientY, ox, oy };
    cropper.setPointerCapture(e.pointerId);
    cropper.classList.add("dragging");
    hint.style.opacity = 0;
  });
  cropper.addEventListener("pointermove", (e) => {
    if (!drag) return;
    ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y;
    clampOffsets(); render();
  });
  const endDrag = () => { if (drag) { drag = null; cropper.classList.remove("dragging"); } };
  cropper.addEventListener("pointerup", endDrag);
  cropper.addEventListener("pointercancel", endDrag);
  cropper.addEventListener("wheel", (e) => { if (busy) return; e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
  cropper.addEventListener("keydown", (e) => {
    if (busy) return;
    const step = e.shiftKey ? 24 : 8;
    const keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (keys[e.key]) { e.preventDefault(); cropper.classList.add("show-grid"); move(...keys[e.key]); }
    else if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(zoom + .1); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); setZoom(zoom - .1); }
    else if (e.key === "r" || e.key === "R") { e.preventDefault(); rotate(); }
  });
  cropper.addEventListener("keyup", () => cropper.classList.remove("show-grid"));
  zoomEl.addEventListener("input", () => setZoom(parseFloat(zoomEl.value)));
  $("#zoomIn").addEventListener("click", () => setZoom(zoom + .2));
  $("#zoomOut").addEventListener("click", () => setZoom(zoom - .2));
  $("#rotate").addEventListener("click", () => { if (!busy) rotate(); });

  // ---------- Motion helpers ----------
  // Tween the crop (zoom and offsets) to a target, frame by frame; stops if a newer run starts
  function tween(to, ms, id) {
    const from = { zoom, ox, oy };
    if (calm()) ms = 1;
    return new Promise((res, rej) => {
      const t0 = performance.now();
      const step = (t) => {
        if (id !== runId) return rej(STOP);
        const p = Math.min(1, (t - t0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        zoom = from.zoom + (to.zoom - from.zoom) * e;
        ox = from.ox + (to.ox - from.ox) * e; oy = from.oy + (to.oy - from.oy) * e;
        clampOffsets(); zoomEl.value = zoom.toFixed(2); render();
        p < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
  }
  function intro() {
    play(view, [{ transform: "scale(1.18)", filter: "blur(8px)", opacity: 0 }, { transform: "scale(1)", filter: "blur(0)", opacity: 1 }], { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" });
    play(dash, [{ strokeDashoffset: 260, opacity: 0 }, { strokeDashoffset: 0, opacity: 1 }], { duration: 900, easing: "ease-out" });
    play(cropper, [{ transform: "scale(.96)" }, { transform: "scale(1.01)" }, { transform: "scale(1)" }], { duration: 600, easing: SPRING });
  }
  function sparkle() {
    if (calm()) return;
    const colors = ["#f5c451", "#a78bfa", "#ffffff", "#f5a3c7", "#34d399"];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.background = colors[i % colors.length];
      if (i % 3 === 0) s.style.borderRadius = "50%";
      avWrap.appendChild(s);
      const a = (i / 16) * Math.PI * 2 + Math.random() * .3, r = 52 + Math.random() * 30;
      s.animate([
        { transform: "translate(0,0) scale(.4) rotate(0)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r}px) scale(1) rotate(${200 + i * 30}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${Math.cos(a) * r * 1.25}px, ${Math.sin(a) * r * 1.25 + 18}px) scale(.3) rotate(${380 + i * 30}deg)`, opacity: 0 }
      ], { duration: 950 + Math.random() * 350, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }
  const toBlob = (c) => new Promise((res) => c.toBlob((b) => res(b), "image/png"));

  // ---------- Save: crop → lift → upload → land ----------
  async function save(id, real) {
    busy = true;
    const btn = saveBtn;                                       // keep the element before any await
    btn.setAttribute("aria-disabled", "true");
    btn.dataset.state = "working";
    saveLbl.textContent = "Cropping…";
    hint.style.opacity = 0;
    say("Cropping your photo.");

    // 1. Anticipation: the ring tightens, the veil darkens, a soft flash marks the cut
    cropper.classList.add("tight");
    shade.classList.add("deep");
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.94, .9)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    play(flash, [{ opacity: 0 }, { opacity: .75 }, { opacity: 0 }], { duration: 420, easing: "ease-out" });
    await sleep(420, id);

    // 2. The real crop: a 256 × 256 round PNG
    const out = document.createElement("canvas");
    out.width = out.height = 256;
    paint(out.getContext("2d"), 256, 256 / D(), true);
    const blob = await toBlob(out);
    guard(id);

    // 3. The cut-out lifts off and arcs into the profile card
    const cr = card.getBoundingClientRect(), r = cropper.getBoundingClientRect(), a = av.getBoundingClientRect();
    const d = D();
    const fly = document.createElement("canvas");
    fly.width = fly.height = 256;
    fly.getContext("2d").drawImage(out, 0, 0);
    fly.className = "fly";
    fly.style.width = fly.style.height = d + "px";
    const x0 = r.left - cr.left + (r.width - d) / 2, y0 = r.top - cr.top + (r.height - d) / 2;
    fly.style.left = x0 + "px"; fly.style.top = y0 + "px";
    card.appendChild(fly);
    const dx = a.left - cr.left - x0, dy = a.top - cr.top - y0, k = a.width / d;
    saveLbl.textContent = "Uploading…";
    await play(fly, [
      { transform: "translate(0,0) scale(1)", offset: 0 },
      { transform: "translate(0,-10px) scale(1.04)", offset: .15 },
      { transform: `translate(${dx * .55}px, ${dy * .55 - 70}px) scale(${(1 + k) / 2}) rotate(-10deg)`, offset: .6 },
      { transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(0)` }
    ], { duration: 900, easing: "cubic-bezier(.45,0,.3,1)" });
    fly.remove();
    guard(id);
    const actx = avCanvas.getContext("2d");
    actx.clearRect(0, 0, 176, 176); actx.drawImage(out, 0, 0, 176, 176);
    av.classList.add("has");
    play(av, [{ transform: "scale(.82)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 520, easing: SPRING });
    cropper.classList.remove("tight");
    shade.classList.remove("deep");

    // 4. Upload progress runs round the avatar (simulated)
    pcard.classList.add("uploading");
    let pct = 0;
    while (pct < 100) {
      pct = Math.min(100, pct + 4 + Math.random() * 9);
      bar.style.strokeDashoffset = 301.6 * (1 - pct / 100);
      saveLbl.textContent = "Sending " + Math.round(pct) + "%";
      await sleep(calm() ? 30 : 75, id);
    }

    // 5. Finish: green ring, sparkles, real file details
    pcard.classList.add("done");
    btn.dataset.state = "done";
    saveLbl.textContent = "Saved";
    sparkle();
    play(avWrap, [{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 560, easing: SPRING });
    badge.textContent = "Saved"; badge.dataset.tone = "ok";
    note.textContent = "Saved a 256 × 256 round PNG, " + kb(blob.size) + ", from " + srcName + ".";
    if (real) {
      if (dl.href) URL.revokeObjectURL(dl.href);
      dl.href = URL.createObjectURL(blob);
      dl.hidden = false;
    }
    say("Avatar saved. 256 by 256 pixels, " + kb(blob.size) + ".");
    await sleep(2200, id);

    // 6. Reset the controls (the new avatar stays)
    pcard.classList.remove("uploading", "done");
    bar.style.strokeDashoffset = 301.6;
    idleButton();
    busy = false;
  }
  function idleButton() {
    saveBtn.dataset.state = "idle";
    saveBtn.removeAttribute("aria-disabled");
    saveLbl.textContent = "Save avatar";
    play(saveLbl, [{ transform: "translateY(8px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 360, easing: SPRING });
  }
  // Stop any running sequence and put every moving part back
  function stopAll() {
    runId++;
    busy = false;
    card.querySelectorAll(".fly").forEach((f) => f.remove());
    cropper.classList.remove("tight", "show-grid", "dragging");
    shade.classList.remove("deep");
    pcard.classList.remove("uploading", "done");
    bar.style.strokeDashoffset = 301.6;
    hint.style.opacity = "";
    idleButton();
  }
  saveBtn.addEventListener("click", async () => {
    if (busy || !img) return;
    const id = ++runId;
    try { await save(id, true); } catch (e) { if (e !== STOP) throw e; }
  });

  // ---------- Auto demo: frames the face, saves, then eases back (no file is offered) ----------
  let demoOn = true, demoTimer = 0;
  function scheduleDemo(ms) {
    clearTimeout(demoTimer);
    if (demoOn) demoTimer = setTimeout(demo, ms);
  }
  async function demo() {
    if (!demoOn || busy) return scheduleDemo(1500);
    const id = ++runId;
    try {
      busy = true;
      cropper.classList.add("show-grid");
      // the sample face sits 70 px above the picture's centre: pan across, then settle on it
      await tween({ zoom: 1.15, ox: 46 * base() * 1.15, oy: 30 * base() * 1.15 }, 700, id);
      await tween({ zoom: 1.32, ox: 0, oy: 60 * base() * 1.32 }, 800, id);
      cropper.classList.remove("show-grid");
      await sleep(350, id);
      busy = false;
      await save(id, false);
      busy = true;
      await tween({ zoom: 1, ox: 0, oy: 0 }, 800, id);
      busy = false;
      badge.textContent = "Sample photo"; badge.dataset.tone = "";
      note.textContent = DEFAULT_NOTE;
      hint.style.opacity = "";
      scheduleDemo(2600);
    } catch (e) { if (e !== STOP) throw e; }
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    if (busy) stopAll();
  }
  ["pointerdown", "keydown", "dragenter", "wheel"].forEach((t) => addEventListener(t, takeOver, { capture: true, passive: true }));

  // ---------- Start ----------
  S = cropper.clientWidth || 300;
  const sample = samplePortrait();
  useImage(sample, sample.width, sample.height, "the sample photo");
  intro();
  scheduleDemo(450);
</script>
</body>
