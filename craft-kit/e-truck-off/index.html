<!doctype html>
<!-- Chill & Craft · Truck Off · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truck Off · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #e5f4ec;
    --card: #ffffff;
    --ink: #0f2a1f;
    --muted: #5b7569;
    --line: #d3e9dd;
    --green: #0d8a5c;
    --green-2: #0a6f4a;
    --orange: #f97316;
    --road: #c9e3d5;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #0a1611;
    --card: #11231b;
    --ink: #e4f4eb;
    --muted: #8db2a1;
    --line: #1f3a2e;
    --green: #16a874;
    --green-2: #0f8a5c;
    --orange: #fb923c;
    --road: #183126;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--stage);
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Product card ---------- */
  .card {
    width: 100%; max-width: 360px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 18px 18px 20px;
    box-shadow: 0 20px 44px -24px rgba(13, 80, 55, .45);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  .hero {
    position: relative;
    border-radius: 18px;
    background: linear-gradient(135deg, #c7f0da, #fde7cf);
    height: 150px;
    display: grid; place-items: center;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .hero::before { /* soft rings behind the shoe */
    content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%;
    border: 18px solid rgba(255, 255, 255, .35);
    transition: transform .8s var(--spring);
  }
  .hero:hover::before { transform: scale(1.12); }
  .hero svg { position: relative; width: 210px; max-width: 80%; height: auto; transition: transform .6s var(--spring); }
  .hero:hover svg { transform: rotate(-6deg) translateY(-6px); }
  .shoe { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .tag {
    position: absolute; top: 10px; left: 10px;
    padding: 4px 9px; border-radius: 999px;
    background: var(--orange); color: #fff;
    font-size: 11px; font-weight: 800; letter-spacing: .05em;
    animation: tagIn .6s var(--spring) .3s backwards;
  }
  @keyframes tagIn { from { transform: scale(0) rotate(-20deg); } }
  h1 { margin: 0; font-size: 19px; }
  .sub { margin: 3px 0 10px; font-size: 13px; color: var(--muted); }
  .price { font-size: 20px; font-weight: 800; margin-bottom: 12px; }

  fieldset { border: 0; margin: 0 0 16px; padding: 0; }
  legend { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
  .sizes label { position: relative; }
  .sizes input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sizes span {
    display: grid; place-items: center;
    min-width: 46px; height: 38px; padding: 0 10px;
    border: 1.5px solid var(--line); border-radius: 12px;
    font-weight: 700; font-size: 14px;
    transition: background .2s, border-color .2s, color .2s, transform .4s var(--spring);
  }
  .sizes label:hover span { transform: translateY(-2px); border-color: var(--green); }
  .sizes input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--card); animation: chosen .4s var(--spring); }
  @keyframes chosen { 40% { transform: scale(1.15); } }
  .sizes input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }

  /* ---------- Slot: the button and the confirmation share one spot ---------- */
  .slot { position: relative; display: grid; min-height: 70px; align-items: center; justify-items: center; }
  .slot > .buy, .slot > .done { grid-area: 1 / 1; }
  .road {
    position: absolute; left: -40px; right: -40px; bottom: 0; height: 3px; opacity: 0;
    background: repeating-linear-gradient(90deg, var(--muted) 0 16px, transparent 16px 30px);
    transition: opacity .3s;
  }
  .slot.moving .road { opacity: .5; animation: dashes .35s linear infinite; }
  @keyframes dashes { to { background-position: -30px 0; } }

  /* ---------- Buy button that becomes a truck ---------- */
  .buy {
    position: relative;
    width: 260px; max-width: 100%; height: 62px;
    padding: 0; border: 0;
    background: transparent;
    color: #fff;
    cursor: pointer;
    font: 800 16px system-ui, sans-serif;
    transition: transform .45s var(--spring);
    -webkit-tap-highlight-color: transparent;
  }
  .buy:not(.pack):hover { transform: translateY(-3px); }
  .buy:not(.pack):active { transform: scale(.95); transition-duration: .08s; }
  .buy:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; border-radius: 18px; }
  .buy[aria-disabled="true"] { cursor: default; }
  .buy.press .cargo { animation: squash .35s var(--spring); }
  @keyframes squash { 35% { transform: scale(1.05, .85); } 70% { transform: scale(.98, 1.04); } }

  /* Cargo box = the button body */
  .cargo {
    position: absolute; left: 0; top: 0; z-index: 2; width: 100%; height: 58px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--green), var(--green-2));
    box-shadow: 0 12px 22px -12px var(--green);
    display: grid; place-items: center;
    overflow: hidden;
    transform-origin: 50% 100%;
    transition: left .45s cubic-bezier(.5, 0, .2, 1), width .45s cubic-bezier(.5, 0, .2, 1), height .45s, top .45s, border-radius .45s;
  }
  .buy:not(.pack):hover .cargo { box-shadow: 0 18px 26px -12px var(--green); }
  .txt { display: flex; align-items: center; gap: 8px; transition: opacity .2s, transform .3s; white-space: nowrap; }
  .txt svg { width: 20px; height: 20px; transition: transform .4s var(--spring); }
  .buy:not(.pack):hover .txt svg { transform: rotate(-12deg) scale(1.15); }
  .logo { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .25s .3s; font: 800 10px system-ui, sans-serif; letter-spacing: .14em; }
  .meter { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(255, 255, 255, .22); }
  .cargo.thump { animation: thump .3s var(--spring); }
  @keyframes thump { 40% { transform: scale(1.03, .9); } }

  /* Cab, wheels, parcels and smoke start hidden */
  .cab {
    position: absolute; left: 186px; top: 16px; z-index: 2; width: 50px; height: 32px;
    border-radius: 6px 16px 6px 4px;
    background: var(--orange);
    transform: scaleX(0); transform-origin: left center;
    transition: transform .35s var(--spring) .25s;
  }
  .cab::before { /* window */
    content: ""; position: absolute; right: 7px; top: 5px; width: 18px; height: 12px;
    border-radius: 3px 9px 3px 3px; background: #dff6ff;
  }
  .cab::after { /* head light */
    content: ""; position: absolute; right: -2px; bottom: 6px; width: 6px; height: 5px;
    border-radius: 2px; background: #fde047;
  }
  .beam { position: absolute; left: 236px; top: 36px; width: 60px; height: 22px; z-index: 1; opacity: 0; background: linear-gradient(90deg, rgba(253, 224, 71, .7), transparent); clip-path: polygon(0 35%, 100% 0, 100% 100%, 0 65%); }
  .wheel {
    position: absolute; top: 42px; z-index: 3; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle, #e5e7eb 0 3px, #1f2937 3.5px);
    transform: scale(0);
    transition: transform .35s var(--spring);
  }
  .wheel::after { content: ""; position: absolute; left: 9px; top: 2px; width: 2px; height: 16px; background: #6b7280; }
  .w1 { left: 52px; transition-delay: .4s; }
  .w2 { left: 128px; transition-delay: .48s; }
  .w3 { left: 200px; transition-delay: .56s; }
  .pk { position: absolute; top: -40px; z-index: 1; width: 18px; height: 15px; border-radius: 3px; background: #c68b59; opacity: 0; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15); }
  .pk::after { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: #8a5a32; }
  .pk1 { left: 62px; }
  .pk2 { left: 96px; }
  .pk3 { left: 130px; }
  .puff { position: absolute; left: 14px; top: 42px; width: 12px; height: 12px; border-radius: 50%; background: #9ca3af; opacity: 0; }
  .speed { position: absolute; left: -36px; top: 14px; width: 30px; opacity: 0; }
  .speed i { display: block; height: 3px; margin: 5px 0; border-radius: 2px; background: var(--muted); }
  .speed i:nth-child(2) { width: 70%; margin-left: 30%; }

  /* Step 1: fold into a truck (cab and wheels spring out one by one) */
  .buy.pack .cargo { left: 24px; width: 160px; height: 46px; top: 2px; border-radius: 8px; }
  .buy.pack .txt { opacity: 0; transform: translateY(14px); }
  .buy.pack .logo { opacity: 1; }
  .buy.pack .cab, .buy.pack .wheel { transform: none; }

  /* Step 2: loading, three parcels drop in and the meter fills */
  .buy.loading .meter { height: 100%; transition: height 1.3s ease-in-out; }
  .buy.loading .pk { animation: pkDrop .4s cubic-bezier(.55, 0, .85, .4) forwards; }
  .buy.loading .pk2 { animation-delay: .35s; }
  .buy.loading .pk3 { animation-delay: .7s; }
  @keyframes pkDrop {
    0% { opacity: 1; transform: translateY(0) rotate(-14deg); }
    100% { opacity: 1; transform: translateY(66px) rotate(0); }
  }

  /* Step 3: engine starts */
  .buy.rumble { animation: rumble .1s linear infinite; }
  .buy.rumble .puff, .buy.drive .puff { animation: puff .55s ease-out infinite; }
  .buy.rumble .p2, .buy.drive .p2 { animation-delay: .18s; }
  .buy.rumble .p3, .buy.drive .p3 { animation-delay: .36s; }
  .buy.rumble .beam, .buy.drive .beam { opacity: 1; transition: opacity .2s; }
  @keyframes rumble { 50% { transform: translateY(-1px); } }
  @keyframes puff {
    0% { opacity: .7; transform: translate(0, 0) scale(.4); }
    100% { opacity: 0; transform: translate(-30px, -10px) scale(1.7); }
  }

  /* Step 4: rev back, then drive off the screen */
  .buy.drive { animation: drive 1.05s cubic-bezier(.55, 0, .85, .35) forwards; }
  .buy.drive .wheel, .buy.return .wheel { animation: spin .22s linear infinite; }
  .buy.drive .speed { opacity: .7; transition: opacity .2s .3s; }
  @keyframes drive {
    0% { transform: none; }
    18% { transform: translateX(-14px) rotate(-2deg); }
    30% { transform: translateX(-10px) rotate(1deg); }
    100% { transform: translateX(115vw); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Step 6: come back from the left, then unfold */
  .buy.return { animation: comeBack .8s cubic-bezier(.2, .9, .3, 1.15); }
  @keyframes comeBack { from { transform: translateX(-115vw); } to { transform: none; } }

  /* Confirmation */
  .done {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 16px;
    background: var(--road);
    animation: doneIn .55s var(--spring);
  }
  .done[hidden] { display: none; }
  @keyframes doneIn { from { opacity: 0; transform: translateY(10px) scale(.85); } }
  .done .tick { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: grid; place-items: center; animation: tagIn .5s var(--spring) .1s backwards; }
  .done .tick svg { width: 20px; height: 20px; }
  .done .tick path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .35s ease-out .35s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done p { margin: 0; font-size: 13px; line-height: 1.35; flex: 1; min-width: 0; animation: doneIn .5s var(--spring) .15s backwards; }
  .done strong { display: block; font-size: 14px; }
  .again {
    flex: none;
    border: 0; border-radius: 10px; padding: 8px 10px;
    background: var(--ink); color: var(--card);
    font: 700 12.5px system-ui, sans-serif; cursor: pointer;
    transition: transform .4s var(--spring);
    animation: doneIn .5s var(--spring) .25s backwards;
  }
  .again:hover { transform: translateY(-2px); }
  .again:active { transform: scale(.94); transition-duration: .08s; }
  .again:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  .bit { position: fixed; z-index: 30; width: 7px; height: 11px; margin: -5px 0 0 -3px; border-radius: 2px; pointer-events: none; }
  .bit.round { width: 8px; height: 8px; border-radius: 50%; }

  @media (max-width: 380px) {
    .done { flex-wrap: wrap; }
    .again { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .buy.drive { opacity: 0; }
    .pk { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="pName">
    <div class="hero">
      <span class="tag">NEW</span>
      <!-- Trail shoe picture -->
      <svg viewBox="0 0 220 110" aria-hidden="true">
        <ellipse cx="110" cy="100" rx="86" ry="6" fill="#0f2a1f" opacity=".14"/>
        <g class="shoe">
          <path d="M24 78c0-14 6-30 16-38l26-6 16 14c14 8 34 10 58 12 30 3 52 8 56 22l2 10H30c-4 0-6-6-6-14Z" fill="#0d8a5c"/>
          <path d="M66 34l10-14c4-4 12-4 14 2l6 22" fill="#0a6f4a"/>
          <path d="M22 84h178l2 8c0 4-2 6-6 6H30c-6 0-8-6-8-14Z" fill="#f8fafc"/>
          <path d="M24 92h178" stroke="#f97316" stroke-width="4"/>
          <path d="M86 50l8 10M98 52l8 10M110 54l8 10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <path d="M150 64c14 1 32 4 44 12" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
          <circle cx="46" cy="58" r="6" fill="#f97316"/>
        </g>
      </svg>
    </div>

    <h1 id="pName">Rawal Trail Runner</h1>
    <p class="sub">Grippy sole for Margalla hikes · 2 colours</p>
    <div class="price">Rs 7,499</div>

    <fieldset>
      <legend>Size (EU)</legend>
      <div class="sizes">
        <label><input type="radio" name="size" value="40"><span>40</span></label>
        <label><input type="radio" name="size" value="41"><span>41</span></label>
        <label><input type="radio" name="size" value="42" checked><span>42</span></label>
        <label><input type="radio" name="size" value="43"><span>43</span></label>
        <label><input type="radio" name="size" value="44"><span>44</span></label>
      </div>
    </fieldset>

    <div class="slot" id="slot">
      <span class="road" aria-hidden="true"></span>
      <button class="buy" id="buy" type="button">
        <span class="cargo" id="cargo">
          <span class="meter"></span>
          <span class="txt">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Buy Now · Rs 7,499
          </span>
          <span class="logo" id="logo" aria-hidden="true">LOADING</span>
        </span>
        <span class="pk pk1" aria-hidden="true"></span>
        <span class="pk pk2" aria-hidden="true"></span>
        <span class="pk pk3" aria-hidden="true"></span>
        <span class="cab" aria-hidden="true"></span>
        <span class="beam" aria-hidden="true"></span>
        <span class="wheel w1" aria-hidden="true"></span>
        <span class="wheel w2" aria-hidden="true"></span>
        <span class="wheel w3" aria-hidden="true"></span>
        <span class="puff p1" aria-hidden="true"></span>
        <span class="puff p2" aria-hidden="true"></span>
        <span class="puff p3" aria-hidden="true"></span>
        <span class="speed" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>

      <div class="done" id="done" hidden>
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <p id="doneText"><strong>Order placed!</strong>On its way</p>
        <button class="again" id="again" type="button">Buy again</button>
      </div>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const buy = document.getElementById("buy");
    const cargo = document.getElementById("cargo");
    const logo = document.getElementById("logo");
    const slot = document.getElementById("slot");
    const done = document.getElementById("done");
    const doneText = document.getElementById("doneText");
    const again = document.getElementById("again");
    const live = document.getElementById("live");
    let busy = false;
    let run = 0; // bumps on reset so an old sequence stops

    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 80) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps the done state readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const size = () => (document.querySelector('input[name="size"]:checked') || { value: "42" }).value;

    // Confetti from the middle of an element
    function confetti(el, n) {
      if (RM || !el.animate) return;
      const r = el.getBoundingClientRect();
      const colors = ["#0d8a5c", "#f97316", "#fde68a", "#38bdf8", "#ffffff"];
      for (let i = 0; i < n; i++) {
        const b = document.createElement("i");
        b.className = "bit" + (i % 3 ? "" : " round");
        b.style.left = r.left + 24 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = colors[i % colors.length];
        document.body.appendChild(b);
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
        const d = 70 + Math.random() * 70;
        const x = Math.cos(a) * d, y = Math.sin(a) * d, spin = (Math.random() - 0.5) * 900;
        b.animate([
          { transform: "translate(0,0) scale(.3)", opacity: 1 },
          { transform: `translate(${x}px,${y}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(${x * 1.2}px,${y + 110}px) rotate(${spin}deg) scale(.7)`, opacity: 0 }
        ], { duration: 1200 + Math.random() * 400, easing: "cubic-bezier(.15,.7,.35,1)" }).onfinish = () => b.remove();
      }
    }

    buy.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      const me = ++run;
      const hadFocus = document.activeElement === buy;
      buy.setAttribute("aria-disabled", "true");
      live.textContent = "Placing your order…";

      // 1. Anticipation: the button squashes
      replay(buy, "press");
      await wait(150);
      // 2. Fold into a truck: cargo shrinks, cab and wheels spring out
      logo.textContent = "LOADING";
      buy.classList.add("pack");
      await wait(800);
      // 3. Loading: parcels drop in one by one while the meter fills
      buy.classList.add("loading");
      for (let i = 0; i < 3; i++) { await wait(i ? 350 : 400); replay(cargo, "thump"); }
      await wait(450);
      logo.textContent = "READY";
      live.textContent = "Packed. The truck is leaving.";
      // 4. Engine start: rumble, smoke and headlight
      buy.classList.add("rumble");
      await wait(450);
      // 5. Rev back and drive off the screen
      buy.classList.remove("rumble");
      buy.classList.add("drive");
      slot.classList.add("moving");
      await wait(1050);
      if (me !== run) return;
      slot.classList.remove("moving");

      // 6. Confirmation with confetti
      const order = "TR-" + Math.floor(10000 + Math.random() * 90000);
      doneText.textContent = "";
      const strong = document.createElement("strong");
      strong.textContent = "Order " + order + " placed";
      doneText.append(strong, "Size " + size() + " · arrives in 2 to 4 days");
      buy.hidden = true;
      done.hidden = false;
      confetti(done, 26);
      live.textContent = "Order " + order + " placed. Size " + size() + ". Your truck is on the way.";
      if (hadFocus) again.focus();
      await hold(5500);
      if (me === run) reset();
    });

    // 7. Reset: the truck drives back in from the left, then unfolds into a button
    async function reset() {
      if (!busy) return;
      const me = ++run;
      const hadFocus = document.activeElement === again;
      done.hidden = true;
      buy.hidden = false;
      buy.classList.remove("drive", "loading");
      buy.classList.add("return");
      slot.classList.add("moving");
      if (hadFocus) buy.focus();
      live.textContent = "Ready for another order.";
      await wait(800);
      slot.classList.remove("moving");
      buy.classList.remove("return", "pack");
      await wait(600);
      if (me !== run) return;
      buy.removeAttribute("aria-disabled");
      busy = false;
    }
    again.addEventListener("click", reset);
  })();
</script>
</body>
</html>
