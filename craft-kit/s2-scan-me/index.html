<!doctype html>
<!-- Chill & Craft · Scan Me · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scan Me · A share card that draws a real QR code</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #edf4e9;
    --dot: rgba(15, 43, 46, 0.11);
    --blob1: rgba(190, 236, 52, 0.42);
    --blob2: rgba(56, 168, 156, 0.26);
    --card: #ffffff;
    --panel: rgba(255, 255, 255, 0.72);
    --field: #f3f7f0;
    --ink: #0f2b2e;
    --muted: #5d7375;
    --line: rgba(15, 43, 46, 0.12);
    --lime: #c4f135;
    --lime-ink: #5d8000;
    --shadow: rgba(24, 66, 50, 0.45);
    --ok: #13a36f;
    --err: #d9412b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a191b;
    --dot: rgba(196, 241, 53, 0.08);
    --blob1: rgba(170, 220, 30, 0.18);
    --blob2: rgba(40, 160, 150, 0.2);
    --card: #12282b;
    --panel: rgba(18, 40, 43, 0.72);
    --field: #0c1f21;
    --ink: #e9f5ee;
    --muted: #93aba8;
    --line: rgba(233, 245, 238, 0.12);
    --lime: #c8f542;
    --lime-ink: #c8f542;
    --shadow: rgba(0, 0, 0, 0.7);
    --ok: #3ad69a;
    --err: #ff7a62;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--lime-ink); outline-offset: 3px; }

  /* ---------- Stage: a drifting dot grid with two soft blobs ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; isolation: isolate; }
  .stage::before { content: ""; position: absolute; inset: -40px; z-index: -2; background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px); background-size: 22px 22px; animation: drift 18s linear infinite; }
  @keyframes drift { to { transform: translate(22px, 22px); } }
  .blob { position: absolute; z-index: -1; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(40px); pointer-events: none; }
  .blob.a { left: -12vmax; top: -16vmax; background: radial-gradient(circle, var(--blob1), transparent 66%); animation: roam 14s ease-in-out infinite alternate; }
  .blob.b { right: -14vmax; bottom: -18vmax; background: radial-gradient(circle, var(--blob2), transparent 66%); animation: roam 17s ease-in-out infinite alternate-reverse; }
  @keyframes roam { to { transform: translate(6vmax, 4vmax) scale(1.1); } }

  .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 26px; width: 100%; max-width: 760px; }

  /* ---------- Share card ---------- */
  .lift { animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .lift.late { animation-delay: 0.12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(0.97); } }
  .card { position: relative; width: min(344px, calc(100vw - 32px)); padding: 20px 22px 20px; border-radius: 30px; background: var(--card); box-shadow: 0 50px 80px -52px var(--shadow), 0 0 0 1px var(--line); transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1); animation: float 6.5s ease-in-out infinite; }
  @keyframes float { 50% { translate: 0 -6px; } }
  .head { display: flex; align-items: center; gap: 12px; }
  .avatar { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 15px; background: conic-gradient(from 210deg, #f6b544, #e8735a, #c4f135, #f6b544); color: #0f2b2e; font-weight: 900; font-size: 0.92rem; letter-spacing: 0.02em; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.45); }
  .head h1 { margin: 0; font-size: 1.06rem; letter-spacing: -0.01em; }
  .head p { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); font-size: 0.72rem; font-weight: 800; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: beat 1.8s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.6); opacity: 0.5; } }

  /* The white plate keeps the code readable in both themes */
  .plate { position: relative; width: min(246px, 100%); aspect-ratio: 1; margin: 16px auto 12px; padding: 20px; border-radius: 24px; background: #fff; box-shadow: inset 0 0 0 1px rgba(15, 43, 46, 0.08), 0 20px 34px -24px rgba(15, 43, 46, 0.55); overflow: hidden; transition: transform 0.4s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .plate canvas { display: block; width: 100%; height: 100%; transition: filter 0.35s, opacity 0.35s; }
  .plate.stale canvas { filter: blur(2.5px) saturate(0.4); opacity: 0.55; }
  .sheen { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.75) 50%, transparent 62%); transform: translateX(-130%); animation: sheen 5.5s ease-in-out 2.6s infinite; pointer-events: none; }
  @keyframes sheen { 0%, 72% { transform: translateX(-130%); } 92%, 100% { transform: translateX(130%); } }
  .corners { position: absolute; inset: 9px; opacity: 0; transform: scale(1.22); pointer-events: none; }
  .corners i { position: absolute; width: 28px; height: 28px; border: 3.5px solid #7fb000; }
  .corners i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .corners i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .corners i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .corners i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .stale-chip { position: absolute; left: 50%; top: 50%; padding: 8px 13px; border-radius: 999px; background: #0f2b2e; color: #fff; font-size: 0.78rem; font-weight: 800; white-space: nowrap; transform: translate(-50%, -50%) scale(0.7); opacity: 0; transition: opacity 0.25s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
  .plate.stale .stale-chip { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .okbadge { position: absolute; right: 10px; top: 10px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: #fff; opacity: 0; transform: scale(0.3); pointer-events: none; }
  .okbadge svg { width: 17px; height: 17px; }
  .cap { margin: 0; text-align: center; }
  .cap b { display: block; font-size: 0.92rem; }
  .cap span { position: relative; display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 8px; font: 600 0.78rem/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  .cap span::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: color-mix(in srgb, var(--lime) 55%, transparent); transform: scaleX(0); transform-origin: 0 50%; }
  .cap span.hit::before { animation: mark 1.4s cubic-bezier(0.2, 0.8, 0.3, 1); }
  @keyframes mark { 30%, 70% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }

  /* Phone that rises to scan the code */
  .phone { position: absolute; left: 50%; top: 64px; z-index: 6; width: 152px; height: 300px; margin-left: -76px; padding: 8px; border-radius: 32px; background: linear-gradient(160deg, #1d2a2d, #070d0e); box-shadow: 0 46px 60px -34px rgba(0, 0, 0, 0.75), inset 0 0 0 2px #33464a; opacity: 0; transform: translateY(90px) rotate(9deg) scale(0.9); pointer-events: none; }
  .screen { position: relative; height: 100%; border-radius: 25px; overflow: hidden; display: grid; place-items: center; background: radial-gradient(70% 50% at 50% 46%, #3c5a5e, #142123 70%), #142123; }
  .screen::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 4px); }
  .notch { position: absolute; top: 7px; left: 50%; width: 44px; height: 12px; margin-left: -22px; border-radius: 8px; background: #000; z-index: 3; }
  .view { position: relative; width: 104px; height: 104px; }
  .view canvas { width: 100%; height: 100%; border-radius: 10px; display: block; }
  .view .brk { position: absolute; inset: -10px; }
  .view .brk i { position: absolute; width: 22px; height: 22px; border: 3px solid #fff; }
  .view .brk i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .view .brk i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
  .view .brk i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
  .view .brk i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
  .banner { position: absolute; left: 7px; right: 7px; top: 24px; z-index: 2; display: flex; align-items: center; gap: 7px; padding: 8px 9px; border-radius: 15px; background: rgba(255, 255, 255, 0.95); color: #0f2b2e; font-size: 10.5px; line-height: 1.25; transform: translateY(-150%); }
  .banner .g { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 7px; background: #c4f135; font-weight: 900; font-size: 9px; }
  .banner b { display: block; font-size: 10.5px; }
  .banner span { display: block; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4e6466; }

  /* ---------- Settings panel ---------- */
  .panel { width: min(340px, calc(100vw - 32px)); padding: 20px 20px 22px; border-radius: 26px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 30px 60px -50px var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .lbl, legend { display: block; margin: 0 0 7px; padding: 0; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .field { position: relative; display: flex; align-items: center; height: 48px; padding: 0 12px 0 14px; border-radius: 15px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow 0.2s; }
  .field:focus-within { box-shadow: inset 0 0 0 2px var(--lime-ink); }
  .field.bad { box-shadow: inset 0 0 0 2px var(--err); }
  .field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font: 600 0.86rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .count { flex: none; margin-left: 8px; font-size: 0.7rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .info { margin: 7px 0 16px; font-size: 0.74rem; color: var(--muted); min-height: 1.1em; }
  .info b { color: var(--ink); }
  .info.bad { color: var(--err); }
  fieldset { margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; border-radius: 16px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); }
  .opt { position: relative; }
  .opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .opt span { display: flex; align-items: center; justify-content: center; gap: 7px; height: 38px; border-radius: 11px; font-size: 0.8rem; font-weight: 750; color: var(--muted); transition: background 0.25s, color 0.25s, transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
  .opt input:checked + span { background: var(--card); color: var(--ink); box-shadow: 0 6px 14px -10px var(--shadow), 0 0 0 1px var(--line); }
  .opt input:active + span { transform: scale(0.94); }
  .opt input:focus-visible + span { outline: 3px solid var(--lime-ink); outline-offset: 1px; }
  .mini3 { display: grid; grid-template-columns: repeat(3, 4px); gap: 1.5px; }
  .mini3 i { width: 4px; height: 4px; background: currentColor; }
  .round .mini3 i { border-radius: 50%; }
  .soft .mini3 i { border-radius: 1.5px; transform: scale(0.92); }
  .sw { display: flex; gap: 10px; }
  .sw .opt span { width: 34px; height: 34px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25), 0 0 0 1.5px var(--line); }
  .sw .opt input:checked + span { background: var(--c); box-shadow: 0 0 0 3px var(--card), 0 0 0 5.5px var(--ink); transform: scale(0.92); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 15px; border: 1.5px solid var(--line); background: transparent; font-size: 0.88rem; font-weight: 800; cursor: pointer; overflow: hidden; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), border-color 0.2s, background 0.2s; }
  .btn:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--lime-ink) 60%, var(--line)); }
  .btn:active { transform: scale(0.95); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.primary { grid-column: 1 / -1; height: 50px; border: 0; background: var(--lime); color: #0f2b2e; box-shadow: 0 14px 24px -14px rgba(110, 150, 0, 0.9), inset 0 -3px 0 rgba(0, 0, 0, 0.1); }
  .btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%); transform: translateX(-120%); }
  .btn.primary.working::after { animation: run 0.9s linear infinite; }
  @keyframes run { to { transform: translateX(120%); } }
  .btn.done { border-color: var(--ok); color: var(--ok); }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .bit { position: absolute; left: 0; top: 0; width: 8px; height: 8px; border-radius: 2px; }

  @media (max-width: 760px) {
    .stage { padding: 18px 16px 28px; }
    .wrap { gap: 14px; }
    .plate { width: min(222px, 100%); margin: 12px auto 10px; }
    /* on phones the buttons come right after the link, the style pickers below */
    .panel { display: flex; flex-direction: column; }
    .panel .actions { order: 1; margin-bottom: 16px; }
    .panel fieldset { order: 2; }
    .panel fieldset:last-of-type { margin-bottom: 0; }
  }
  @media (max-width: 380px) {
    .card { padding: 18px 16px; }
    .panel { padding: 18px 14px; }
    .plate { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::before, .blob, .card, .lift, .pill i, .sheen, .btn.primary.working::after, .cap span.hit::before { animation: none !important; }
    .card { transition: none; transform: none; }
    .btn, .opt span, .plate, .stale-chip { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <span class="blob a" aria-hidden="true"></span>
    <span class="blob b" aria-hidden="true"></span>
    <div class="wrap">
      <div class="lift">
        <section class="card" id="card" aria-labelledby="shop">
          <header class="head">
            <span class="avatar" aria-hidden="true">LB</span>
            <div><h1 id="shop">Lahore Bakes</h1><p>Menu · open till 11 pm</p></div>
            <span class="pill"><i aria-hidden="true"></i>Open</span>
          </header>
          <div class="plate" id="plate">
            <canvas id="qr" role="img" aria-label="QR code"></canvas>
            <span class="sheen" aria-hidden="true"></span>
            <span class="corners" id="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="stale-chip" aria-hidden="true">Press Make code</span>
            <span class="okbadge" id="okbadge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg></span>
          </div>
          <p class="cap"><b>Scan for today's menu</b><span id="capUrl"></span></p>
          <div class="phone" id="phone" aria-hidden="true">
            <div class="screen">
              <span class="notch"></span>
              <div class="banner" id="banner"><span class="g">LB</span><div><b>Open in browser</b><span id="bannerUrl"></span></div></div>
              <div class="view"><canvas id="mini" width="208" height="208"></canvas><span class="brk" id="brk"><i></i><i></i><i></i><i></i></span></div>
            </div>
          </div>
        </section>
      </div>

      <div class="lift late">
        <section class="panel" aria-label="Code settings">
          <label class="lbl" for="link">Link or text</label>
          <div class="field" id="field">
            <input id="link" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="151" value="https://lahorebakes.example/menu" aria-describedby="info" />
            <span class="count" id="count" aria-hidden="true"></span>
          </div>
          <p class="info" id="info"></p>
          <fieldset>
            <legend>Dots</legend>
            <div class="seg">
              <label class="opt square"><input type="radio" name="dots" value="square" /><span><b class="mini3" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></b>Square</span></label>
              <label class="opt round"><input type="radio" name="dots" value="round" checked /><span><b class="mini3" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></b>Round</span></label>
              <label class="opt soft"><input type="radio" name="dots" value="soft" /><span><b class="mini3" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></b>Soft</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Colour</legend>
            <div class="sw">
              <label class="opt" style="--c:#0f2b2e"><input type="radio" name="col" value="#0f2b2e" checked aria-label="Deep teal" /><span></span></label>
              <label class="opt" style="--c:#4a1d5e"><input type="radio" name="col" value="#4a1d5e" aria-label="Plum" /><span></span></label>
              <label class="opt" style="--c:#1f5130"><input type="radio" name="col" value="#1f5130" aria-label="Forest" /><span></span></label>
              <label class="opt" style="--c:#0b3d78"><input type="radio" name="col" value="#0b3d78" aria-label="Ocean" /><span></span></label>
              <label class="opt" style="--c:#8a2f12"><input type="radio" name="col" value="#8a2f12" aria-label="Rust" /><span></span></label>
            </div>
          </fieldset>
          <div class="actions">
            <button class="btn primary" id="make" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3" /></svg><span>Make code</span></button>
            <button class="btn" id="copy" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1" /><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" /></svg><span>Copy link</span></button>
            <button class="btn" id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" /></svg><span>Save PNG</span></button>
          </div>
        </section>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Scan Me: a share card that draws a real, scannable QR code with motion ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const statusEl = $("#status");
  const say = (t) => { statusEl.textContent = t; };

  // ---------- A small QR encoder (byte mode, error level Q, versions 1 to 10, up to 151 bytes) ----------

    makeBtn.classList.remove("working");
    makeBtn.querySelector("span").textContent = "Make code";
    const corners = $("#corners"), ok = $("#okbadge");
    corners.style.opacity = "1"; corners.style.transform = "scale(1)";
    play(corners, [{ opacity: 0, transform: "scale(1.25)" }, { opacity: 1, transform: "scale(1)" }], { duration: 560, easing: SPRING });
    ok.style.opacity = "1"; ok.style.transform = "scale(1)";
    play(ok, [{ transform: "scale(.2) rotate(-40deg)" }, { transform: "scale(1) rotate(0)" }], { duration: 620, easing: SPRING });
    burst(plate);
    say("QR code ready for " + text);
    busy = false;
    await wait(calm() ? 300 : 500);
    if (id !== run) return;
    await phoneScan(id);
    if (id !== run) return;
    hideFinish(true);
    if (demo) queueDemo(2600);
  }
  makeBtn.addEventListener("click", () => makeCode(false));

  function hideFinish(soft) {
    const corners = $("#corners"), ok = $("#okbadge");
    if (soft && !calm()) {
      play(corners, [{ opacity: 1 }, { opacity: 0 }], { duration: 400 });
      play(ok, [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.4)" }], { duration: 400 });
    }
    corners.style.opacity = "0"; corners.style.transform = "scale(1.22)";
    ok.style.opacity = "0"; ok.style.transform = "scale(.3)";
  }

  // The phone rises over the card, its brackets lock onto the code and a banner drops in
  async function phoneScan(id) {
    if (calm()) return;
    const phone = $("#phone"), brk = $("#brk"), banner = $("#banner");
    phone.style.opacity = "1";
    await play(phone, [{ opacity: 0, transform: "translateY(90px) rotate(9deg) scale(.9)" }, { opacity: 1, transform: "translateY(0) rotate(-2deg) scale(1)" }], { duration: 760, easing: SPRING, fill: "forwards" });
    if (id !== run) { resetPhone(); return; }
    await play(brk, [{ transform: "scale(1.35)", opacity: 0.3 }, { transform: "scale(.92)", opacity: 1, offset: 0.7 }, { transform: "scale(1)", opacity: 1 }], { duration: 560, easing: "ease-out" });
    play(phone, [{ transform: "translateY(0) rotate(-2deg)" }, { transform: "translateY(0) rotate(-3.4deg)" }, { transform: "translateY(0) rotate(-0.6deg)" }, { transform: "translateY(0) rotate(-2deg)" }], { duration: 300 });
    await play(banner, [{ transform: "translateY(-150%)" }, { transform: "translateY(0)" }], { duration: 600, easing: SPRING, fill: "forwards" });
    await wait(1300);
    if (id !== run) { resetPhone(); return; }
    await play(phone, [{ opacity: 1, transform: "translateY(0) rotate(-2deg) scale(1)" }, { opacity: 0, transform: "translateY(110px) rotate(6deg) scale(.92)" }], { duration: 520, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    resetPhone();
  }
  function resetPhone() {
    const phone = $("#phone"), banner = $("#banner");
    phone.getAnimations().forEach((a) => a.cancel());
    banner.getAnimations().forEach((a) => a.cancel());
    phone.style.opacity = "0";
  }
  function drawMini() {
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.fillStyle = "#fff"; mctx.fillRect(0, 0, 208, 208);
    if (!code) return;
    const s = 184 / code.size;
    paintStill(mctx, code, parts, 12, 12, s, style, colour);
  }

  // Little dots burst out of the plate corners
  const fx = $("#fx");
  function burst(el) {
    if (calm()) return;
    const r = el.getBoundingClientRect();
    const cols = [colour, "#c4f135", "#f6b544", "#e8735a"];
    for (let i = 0; i < 22; i++) {
      const b = document.createElement("i");
      b.className = "bit";
      b.style.background = cols[i % cols.length];
      const sx = r.left + (i % 2 ? r.width - 14 : 14), sy = r.top + (i % 4 < 2 ? 14 : r.height - 14);
      const a = Math.atan2(sy - (r.top + r.height / 2), sx - (r.left + r.width / 2)) + (Math.random() - 0.5) * 1.1;
      const d = 40 + Math.random() * 60;
      fx.appendChild(b);
      b.animate([
        { transform: "translate(" + sx + "px," + sy + "px) scale(.4) rotate(0)", opacity: 1 },
        { transform: "translate(" + (sx + Math.cos(a) * d) + "px," + (sy + Math.sin(a) * d) + "px) scale(1) rotate(" + (Math.random() * 360) + "deg)", opacity: 1, offset: 0.6 },
        { transform: "translate(" + (sx + Math.cos(a) * d * 1.2) + "px," + (sy + Math.sin(a) * d * 1.2 + 26) + "px) scale(.5) rotate(" + (Math.random() * 540) + "deg)", opacity: 0 }
      ], { duration: 900 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => b.remove();
    }
  }

  // ---------- Copy and save ----------
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  function flash(btn, label, good) {
    const span = btn.querySelector("span");
    const was = btn.dataset.label || span.textContent;
    btn.dataset.label = was;
    span.textContent = label;
    btn.classList.toggle("done", good);
    play(btn, [{ transform: "scale(.92)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 480, easing: "ease-out" });
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { span.textContent = was; btn.classList.remove("done"); }, 1700);
  }
  copyBtn.addEventListener("click", async (e) => {
    const btn = e.currentTarget; // keep it before the await
    const text = codeText || input.value.trim();
    const ok = await writeClipboard(text);
    capUrl.classList.remove("hit"); void capUrl.offsetWidth; capUrl.classList.add("hit");
    flash(btn, ok ? "Copied" : "Select the link", ok);
    say(ok ? "Link copied" : "Copy was blocked. Select the link in the field instead.");
  });
  saveBtn.addEventListener("click", (e) => {
    const btn = e.currentTarget;
    if (!code) { say("Make a code first"); return; }
    // a 1024 px PNG with a white quiet zone of four dots on every side
    const c = document.createElement("canvas"); c.width = c.height = 1024;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, 1024, 1024);
    const s = 1024 / (code.size + 8);
    paintStill(g, code, parts, s * 4, s * 4, s, style, colour);
    const done = (url, revoke) => {
      const a = document.createElement("a");
      a.href = url; a.download = "lahore-bakes-qr.png";
      document.body.appendChild(a); a.click(); a.remove();
      if (revoke) setTimeout(() => URL.revokeObjectURL(url), 4000);
      flash(btn, "Saved", true);
      say("PNG saved: lahore-bakes-qr.png");
    };
    if (c.toBlob) c.toBlob((b) => { if (b) done(URL.createObjectURL(b), true); else done(c.toDataURL("image/png"), false); }, "image/png");
    else done(c.toDataURL("image/png"), false);
  });

  // ---------- Gentle tilt that follows the pointer ----------
  const card = $("#card");
  if (matchMedia("(pointer: fine)").matches) {
    card.addEventListener("pointermove", (e) => {
      if (calm()) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty("--ry", ((e.clientX - r.left) / r.width - 0.5) * 8 + "deg");
      card.style.setProperty("--rx", -((e.clientY - r.top) / r.height - 0.5) * 8 + "deg");
    });
    card.addEventListener("pointerleave", () => { card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg"); });
  }

  // ---------- Auto-demo: restyle, type a new link, rebuild; stops on any real input ----------
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function typeLink(text) {
    input.value = "";
    refreshField();
    for (const ch of text) {
      if (!demoOn) return false;
      input.value += ch;
      refreshField();
      await wait(38);
    }
    return true;
  }
  const LINKS = ["https://lahorebakes.example/eid-boxes", "https://lahorebakes.example/menu"];
  async function runDemo() {
    if (!demoOn) return;
    if (busy) { queueDemo(1200); return; }
    const step = round++ % 4;
    if (step === 0) { check("dots", "square"); check("col", "#0b3d78"); restyle("square", "#0b3d78"); queueDemo(3200); }
    else if (step === 1) { if (await typeLink(LINKS[0]) && demoOn) makeCode(true); }
    else if (step === 2) { check("dots", "soft"); check("col", "#4a1d5e"); restyle("soft", "#4a1d5e"); queueDemo(3200); }
    else { check("dots", "round"); check("col", "#0f2b2e"); restyle("round", "#0f2b2e"); await wait(900); if (demoOn && await typeLink(LINKS[1]) && demoOn) makeCode(true); }
  }

  // ---------- Start ----------
  new ResizeObserver(() => sizeCanvas()).observe(canvas);
  sizeCanvas();
  refreshField();
  setTimeout(() => makeCode(true), 200);
</script>
</body>
</html>
