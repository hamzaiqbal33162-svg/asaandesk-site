<!doctype html>
<!-- Chill & Craft · Hour Hand · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hour Hand · time picker dial with a live sky</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* Sky colours are typed custom properties so the sky can fade smoothly as the time changes */
  @property --sky1 { syntax: "<color>"; inherits: true; initial-value: #ff9a66; }
  @property --sky2 { syntax: "<color>"; inherits: true; initial-value: #ffd09a; }
  @property --night { syntax: "<number>"; inherits: true; initial-value: 0; }

  /* ---------- Colours: frosted white over the sky (light), deep navy glass (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #dfe8f5;
    --card: rgba(255, 255, 255, .9);
    --ink: #13203a;
    --muted: #5e6b85;
    --line: #dde4f0;
    --face: #f1f5fb;
    --face2: #e4ebf6;
    --amber: #f08a12;
    --amber2: #ffb547;
    --open: #12a586;
    --warn: #d4570f;
    --shadow: rgba(20, 40, 80, .28);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #070b16;
    --card: rgba(16, 23, 40, .9);
    --ink: #e8eefc;
    --muted: #8f9cba;
    --line: #26324d;
    --face: #182239;
    --face2: #111a2e;
    --amber: #ffa53a;
    --amber2: #ffc66e;
    --open: #34d3ad;
    --warn: #ff8a4c;
    --shadow: rgba(0, 0, 0, .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 18px 14px;
    overflow: hidden;
    transition: --sky1 1s ease, --sky2 1s ease, --night 1s ease;
    background:
      radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--sky1) 45%, transparent), transparent 75%),
      radial-gradient(70% 60% at 50% 100%, color-mix(in srgb, var(--sky2) 35%, transparent), transparent 75%),
      var(--bg);
  }
  .card {
    position: relative;
    width: min(100%, 400px);
    border-radius: 30px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -46px var(--shadow), 0 10px 24px -16px var(--shadow);
    backdrop-filter: blur(10px);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.97); } }

  /* ---------- Sky strip with sun, moon, stars and a little skyline ---------- */
  .sky { display: block; width: 100%; height: 96px; }
  [data-theme="dark"] .sky { filter: brightness(.8) saturate(1.1); }
  .sky .s1 { stop-color: var(--sky1); }
  .sky .s2 { stop-color: var(--sky2); }
  .sky .stars { opacity: var(--night); }
  .sky .stars circle { fill: #fff; animation: twinkle 2.4s ease-in-out infinite alternate; }
  .sky .stars circle:nth-child(3n) { animation-delay: -.8s; }
  .sky .stars circle:nth-child(3n+1) { animation-delay: -1.6s; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
  .sky .clouds { opacity: calc(1 - var(--night)); }
  .sky .clouds g { animation: drift 22s linear infinite; }
  .sky .clouds g:nth-child(2) { animation-duration: 30s; animation-delay: -12s; }
  @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(440px); } }
  .sky .city { fill: color-mix(in srgb, #151b35 84%, var(--sky1)); }
  .sky .wins rect { fill: #ffd479; opacity: var(--night); }
  .sky .wins rect:nth-child(4n) { opacity: calc(var(--night) * .4); }
  .sky .sunGlow { fill: #ffe28a; opacity: .35; animation: pulse 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { to { transform: scale(1.25); opacity: .15; } }
  .datechip {
    position: absolute; top: 12px; left: 14px; padding: 5px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
    color: #13203a; background: rgba(255, 255, 255, .78); backdrop-filter: blur(6px);
  }

  .body { padding: 14px 18px 18px; }
  h1 { margin: 0; font-size: clamp(18px, 5vw, 20px); letter-spacing: -.015em; }
  .sub { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

  /* ---------- Digital readout: rolling digits and the AM / PM switch ---------- */
  .readout { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0 6px; }
  .seg {
    position: relative; width: 74px; height: 58px; overflow: hidden; border: 0; border-radius: 16px;
    background: var(--face); color: var(--muted); font: 800 36px/58px var(--ff); font-variant-numeric: tabular-nums; cursor: pointer;
    transition: color .25s, background .25s, box-shadow .25s;
  }
  .seg.on { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--face)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--amber) 55%, transparent); }
  .roll { position: absolute; inset: 0; }
  .roll span { position: absolute; inset: 0; text-align: center; }
  .roll .in { animation: rollIn .38s cubic-bezier(.34, 1.56, .64, 1) both; }
  .roll .out { animation: rollOut .3s ease-in both; }
  .roll.down .in { animation-name: rollInDown; }
  .roll.down .out { animation-name: rollOutDown; }
  @keyframes rollIn { from { transform: translateY(70%); opacity: 0; } }
  @keyframes rollOut { to { transform: translateY(-70%); opacity: 0; } }
  @keyframes rollInDown { from { transform: translateY(-70%); opacity: 0; } }
  @keyframes rollOutDown { to { transform: translateY(70%); opacity: 0; } }
  .colon { font: 800 32px/1 var(--ff); color: var(--muted); animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .ampm { display: grid; gap: 4px; margin-left: 6px; }
  .ampm button {
    display: flex; align-items: center; gap: 5px; height: 27px; padding: 0 10px; border: 0; border-radius: 10px;
    background: var(--face); color: var(--muted); font: 800 12.5px/1 var(--ff); cursor: pointer; transition: background .25s, color .25s, transform .3s;
  }
  .ampm button svg { width: 14px; height: 14px; }
  .ampm button[aria-checked="true"] { background: var(--ink); color: var(--card); transform: scale(1.04); }
  [data-theme="dark"] .ampm button[aria-checked="true"] { color: #0b1222; }

  /* ---------- The dial ---------- */
  .dialwrap { position: relative; display: grid; place-items: center; }
  .dial { width: min(100%, 236px); aspect-ratio: 1; display: block; touch-action: none; cursor: grab; outline: none; overflow: visible; }
  .dial.grab { cursor: grabbing; }
  .dial:focus-visible .face { stroke: var(--amber); stroke-width: 3; }
  .dial.shake { animation: shake .45s ease; }
  @keyframes shake { 20% { transform: rotate(-4deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(1deg); } }
  .f1 { stop-color: var(--face); }
  .f2 { stop-color: var(--face2); }
  .face { fill: url(#faceG); stroke: var(--line); stroke-width: 1.5; }
  .track { fill: none; stroke: var(--line); stroke-width: 6; }
  .openArc { fill: none; stroke: var(--open); stroke-width: 6; stroke-linecap: round; animation: arcIn .6s ease both; }
  @keyframes arcIn { from { opacity: 0; } }
  .tick { stroke: var(--muted); stroke-width: 1; opacity: .35; }
  .tick.big { stroke-width: 2; opacity: .6; }
  .nums text {
    fill: var(--ink); font: 700 15px var(--ff); text-anchor: middle; dominant-baseline: central;
    transition: opacity .35s, transform .5s cubic-bezier(.34, 1.56, .64, 1), fill .3s; transition-delay: calc(var(--i) * 18ms);
    transform-box: fill-box; transform-origin: center;
  }
  .nums.min text { font-size: 13px; }
  .nums text.shut { fill: var(--muted); opacity: .38; }
  .nums.hide text { opacity: 0; transform: scale(.4) rotate(-40deg); }
  .hand { stroke: var(--amber); stroke-width: 3; stroke-linecap: round; }
  .tail { stroke: var(--amber); stroke-width: 5; stroke-linecap: round; opacity: .5; }
  .knob { fill: var(--amber); filter: drop-shadow(0 3px 5px rgba(200, 100, 0, .45)); }
  .knob.closed { fill: var(--warn); }
  .knobRing { fill: none; stroke: var(--amber2); stroke-width: 2; opacity: .7; transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(1.7); opacity: 0; } }
  .knobText { fill: #fff; font: 800 15px var(--ff); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .cap { fill: var(--card); stroke: var(--amber); stroke-width: 3; }
  .modeTag { fill: var(--muted); font: 700 9.5px var(--ff); letter-spacing: .14em; text-anchor: middle; }

  /* ---------- Quick picks, status and the book button ---------- */
  .quick { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 0; }
  .quick button {
    padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--face); color: var(--ink);
    font: 600 12px/1 var(--ff); cursor: pointer; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), border-color .2s;
  }
  .quick button:hover { transform: translateY(-2px); border-color: var(--amber); }
  .quick button b { color: var(--amber); }
  .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 12px; }
  .msg { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); min-height: 34px; }
  .msg i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--open); box-shadow: 0 0 0 4px color-mix(in srgb, var(--open) 22%, transparent); }
  .msg.bad i { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 22%, transparent); }
  .msg.bad { color: var(--warn); font-weight: 600; }
  .book {
    position: relative; height: 46px; padding: 0 18px; border: 0; border-radius: 15px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(180deg, var(--amber2), var(--amber)); color: #2a1300; font: 800 14px/1 var(--ff);
    box-shadow: 0 10px 18px -10px rgba(230, 120, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), filter .25s, opacity .25s;
  }
  .book:hover { transform: translateY(-2px); }
  .book:active { transform: scale(.96); }
  .book[aria-disabled="true"] { filter: grayscale(.85); opacity: .6; }
  .book.ready { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-3px) rotate(-1deg); } 90% { transform: translateY(0) rotate(1deg); } }
  .book.busy { color: transparent; }
  .book.busy::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; border: 2.5px solid #2a1300; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }

  /* ---------- Pickup ticket ---------- */
  .ticketBox {
    position: absolute; inset: 96px 0 0; display: grid; place-items: center; padding: 18px; pointer-events: none;
    background: color-mix(in srgb, var(--card) 40%, transparent); opacity: 0; transition: opacity .3s; backdrop-filter: blur(3px);
  }
  .ticketBox.on { opacity: 1; pointer-events: auto; }
  .ticket {
    position: relative; width: min(100%, 300px); padding: 18px 18px 16px; border-radius: 18px; text-align: center;
    background: linear-gradient(160deg, #fff7e8, #ffe7c2); color: #2a1300; box-shadow: 0 24px 40px -20px rgba(120, 60, 0, .6);
    transform: translateY(120%) rotate(6deg); transition: transform .7s cubic-bezier(.34, 1.4, .64, 1);
    -webkit-mask: radial-gradient(circle 9px at 0 62%, transparent 98%, #000) , radial-gradient(circle 9px at 100% 62%, transparent 98%, #000);
    mask: radial-gradient(circle 9px at 0 62%, transparent 98%, #000), radial-gradient(circle 9px at 100% 62%, transparent 98%, #000);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  .ticketBox.on .ticket { transform: none; }
  .ticket small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #a35a00; }
  .ticket strong { display: block; margin: 4px 0 2px; font-size: 40px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .ticket p { margin: 0; font-size: 12.5px; color: #6d4a22; }
  .ticket hr { margin: 14px -18px 12px; border: 0; border-top: 2px dashed rgba(163, 90, 0, .35); }
  .bars { display: flex; justify-content: center; gap: 2px; height: 28px; margin-bottom: 12px; }
  .bars i { width: 2px; background: #2a1300; }
  .again { padding: 9px 14px; border: 0; border-radius: 12px; background: #2a1300; color: #fff7e8; font: 700 13px/1 var(--ff); cursor: pointer; }
  .sprinkle { position: absolute; left: 50%; top: 30%; width: 4px; height: 11px; border-radius: 3px; pointer-events: none; animation: burst 1.3s cubic-bezier(.2, .7, .3, 1) forwards; }
  @keyframes burst {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
  }

  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 360px) { .seg { width: 64px; font-size: 32px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="card" id="card" aria-labelledby="title">
    <svg class="sky" viewBox="0 0 400 96" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset="1"/></linearGradient>
        <mask id="crescent"><rect x="-20" y="-20" width="40" height="40" fill="#fff"/><circle cx="6" cy="-4" r="10" fill="#000"/></mask>
      </defs>
      <rect width="400" height="96" fill="url(#skyG)"/>
      <g class="stars">
        <circle cx="30" cy="20" r="1.2"/><circle cx="78" cy="44" r=".9"/><circle cx="122" cy="16" r="1.4"/><circle cx="170" cy="36" r="1"/>
        <circle cx="214" cy="12" r="1.1"/><circle cx="262" cy="30" r="1.4"/><circle cx="300" cy="14" r=".9"/><circle cx="342" cy="40" r="1.2"/>
        <circle cx="380" cy="18" r="1"/><circle cx="148" cy="54" r=".8"/><circle cx="236" cy="50" r=".9"/><circle cx="56" cy="58" r=".8"/>
      </g>
      <g class="clouds">
        <g><ellipse cx="0" cy="30" rx="22" ry="7" fill="#fff" opacity=".85"/><ellipse cx="12" cy="25" rx="13" ry="8" fill="#fff" opacity=".85"/></g>
        <g><ellipse cx="0" cy="52" rx="16" ry="5" fill="#fff" opacity=".7"/><ellipse cx="8" cy="48" rx="9" ry="6" fill="#fff" opacity=".7"/></g>
      </g>
      <g id="sun"><circle class="sunGlow" r="22"/><circle r="12" fill="#ffd54a"/></g>
      <g id="moon"><circle r="10" fill="#f4f1ff" mask="url(#crescent)"/></g>
      <path class="city" d="M0 96 V74 H18 V66 H34 V78 H46 V60 H58 V70 H70 V82 H84 V64 L92 58 L100 64 V82 H112 V50 H116 V40 H119 V50 H123 V82 H138 V68 H156 V76 H172 Q186 54 200 76 H214 V62 H230 V72 H244 V56 H262 V80 H276 V66 H290 V74 H306 V58 H312 V46 H315 V58 H321 V78 H338 V68 H356 V80 H372 V64 H388 V74 H400 V96 Z"/>
      <g class="wins">
        <rect x="22" y="70" width="3" height="3"/><rect x="50" y="64" width="3" height="3"/><rect x="50" y="72" width="3" height="3"/><rect x="88" y="70" width="3" height="3"/>
        <rect x="142" y="72" width="3" height="3"/><rect x="150" y="72" width="3" height="3"/><rect x="218" y="66" width="3" height="3"/><rect x="248" y="62" width="3" height="3"/>
        <rect x="254" y="70" width="3" height="3"/><rect x="280" y="70" width="3" height="3"/><rect x="342" y="72" width="3" height="3"/><rect x="376" y="68" width="3" height="3"/>
      </g>
    </svg>
    <span class="datechip" id="date">Today</span>

    <div class="body">
      <h1 id="title">When will you pick up your cake?</h1>
      <p class="sub">Gulberg bakery · open 10:00 AM to 9:30 PM</p>

      <div class="readout">
        <button class="seg on" id="hBtn" type="button" aria-label="Hour"><span class="roll" id="hRoll"><span>05</span></span></button>
        <span class="colon" aria-hidden="true">:</span>
        <button class="seg" id="mBtn" type="button" aria-label="Minutes"><span class="roll" id="mRoll"><span>30</span></span></button>
        <div class="ampm" role="radiogroup" aria-label="Morning or evening">
          <button type="button" role="radio" data-pm="0" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>AM</button>
          <button type="button" role="radio" data-pm="1" aria-checked="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>PM</button>
        </div>
      </div>

      <div class="dialwrap">
        <svg class="dial" id="dial" viewBox="-120 -120 240 240" role="slider" tabindex="0" aria-label="Clock dial" aria-valuemin="1" aria-valuemax="12" aria-valuenow="5">
          <defs><radialGradient id="faceG" cx="50%" cy="38%" r="70%"><stop class="f1" offset="0"/><stop class="f2" offset="1"/></radialGradient></defs>
          <circle class="face" r="114"/>
          <circle class="track" r="104"/>
          <g id="arcs"></g>
          <g id="ticks"></g>
          <g class="nums" id="hNums"></g>
          <g class="nums min hide" id="mNums"></g>
          <text class="modeTag" id="modeTag" y="34">HOUR</text>
          <line class="tail" id="tail" x1="0" y1="0" x2="0" y2="0"/>
          <line class="hand" id="hand" x1="0" y1="0" x2="0" y2="-78"/>
          <circle class="knobRing" id="knobRing" r="17" cx="0" cy="-78"/>
          <circle class="knob" id="knob" r="18" cx="0" cy="-78"/>
          <text class="knobText" id="knobText" x="0" y="-78">5</text>
          <circle class="cap" r="6"/>
        </svg>
      </div>

      <div class="quick" aria-label="Quick picks">
        <button type="button" data-t="13:00">Lunch <b>1:00</b></button>
        <button type="button" data-t="16:30">Tea <b>4:30</b></button>
        <button type="button" data-t="19:15">After work <b>7:15</b></button>
      </div>

      <div class="foot">
        <p class="msg" id="msg" aria-live="polite"><i aria-hidden="true"></i><span id="msgText">Ready for pickup at 5:30 PM</span></p>
        <button class="book" id="book" type="button">Book 5:30 PM</button>
      </div>
    </div>

    <div class="ticketBox" id="ticketBox" aria-hidden="true">
      <div class="ticket" id="ticket" role="status">
        <small>Pickup booked</small>
        <strong id="tTime">5:30 PM</strong>
        <p id="tDate">Today · Counter 2</p>
        <p>Order 2187 · Chocolate fudge cake</p>
        <hr>
        <div class="bars" id="bars" aria-hidden="true"></div>
        <button class="again" id="again" type="button">Change time</button>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var NS = "http://www.w3.org/2000/svg";
  var OPEN_FROM = 10 * 60, OPEN_TO = 21 * 60 + 30; // the bakery's hours, in minutes after midnight

  // ---------- State ----------
  var hour = 5, minute = 30, pm = true, mode = "h";
  var stage = $("#stage"), dial = $("#dial"), hNums = $("#hNums"), mNums = $("#mNums"), arcs = $("#arcs");
  var hand = $("#hand"), tail = $("#tail"), knob = $("#knob"), knobRing = $("#knobRing"), knobText = $("#knobText");
  var hBtn = $("#hBtn"), mBtn = $("#mBtn"), book = $("#book"), msg = $("#msg"), msgText = $("#msgText");
  var ampmBtns = [].slice.call(document.querySelectorAll(".ampm button"));

  // Date chip: today's real date
  var now = new Date();
  var dateText = now.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  $("#date").textContent = "Today · " + dateText;

  // ---------- Build the dial: ticks, hour numbers, minute numbers ----------
  var R_NUM = 80;
  (function build() {
    var t = "";
    for (var i = 0; i < 60; i++) {
      var a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 92 : 96;
      t += '<line class="tick' + (big ? " big" : "") + '" x1="' + (Math.sin(a) * r1).toFixed(1) + '" y1="' + (-Math.cos(a) * r1).toFixed(1) + '" x2="' + (Math.sin(a) * 100).toFixed(1) + '" y2="' + (-Math.cos(a) * 100).toFixed(1) + '"/>';
    }
    $("#ticks").innerHTML = t;
    var h = "", m = "";
    for (var k = 0; k < 12; k++) {
      var ang = k * 30 * Math.PI / 180, x = (Math.sin(ang) * R_NUM).toFixed(1), y = (-Math.cos(ang) * R_NUM).toFixed(1);
      h += '<text style="--i:' + k + '" x="' + x + '" y="' + y + '" data-v="' + (k || 12) + '">' + (k || 12) + "</text>";
      m += '<text style="--i:' + k + '" x="' + x + '" y="' + y + '" data-v="' + k * 5 + '">' + String(k * 5).padStart(2, "0") + "</text>";
    }
    hNums.innerHTML = h; mNums.innerHTML = m;
    var bars = "";
    for (var b = 0; b < 34; b++) bars += '<i style="width:' + [1, 2, 3, 1, 2][b * 7 % 5] + 'px"></i>';
    $("#bars").innerHTML = bars;
  })();

  // ---------- Time helpers ----------
  function h24(h, isPm) { return (h % 12) + (isPm ? 12 : 0); }
  function total() { return h24(hour, pm) * 60 + minute; }
  function isOpen(t) { return t >= OPEN_FROM && t <= OPEN_TO; }
  function label(h, m, isPm) { return h + ":" + String(m).padStart(2, "0") + (isPm ? " PM" : " AM"); }

  // ---------- Sky: colour keys through the day ----------
  var SKY = [[0, "#0b1433", "#1d2b5e"], [5, "#121d45", "#2c3a70"], [6.3, "#f39a77", "#fbd7b6"], [8, "#78c0f0", "#d4eeff"], [13, "#4aaef0", "#cdeeff"],
    [16.8, "#6ab3e6", "#ffe0b0"], [18.4, "#ff8758", "#ffc584"], [19.5, "#5b3f8f", "#e07a78"], [21, "#151e48", "#3a3d7a"], [24, "#0b1433", "#1d2b5e"]];
  function mix(a, b, k) {
    var p = function (c, i) { return parseInt(c.slice(1 + i * 2, 3 + i * 2), 16); };
    return "#" + [0, 1, 2].map(function (i) { return Math.round(p(a, i) + (p(b, i) - p(a, i)) * k).toString(16).padStart(2, "0"); }).join("");
  }
  var sun = $("#sun"), moon = $("#moon");
  function paintSky() {
    var T = total() / 60, i = 0;
    while (SKY[i + 1][0] < T) i++;
    var a = SKY[i], b = SKY[i + 1], k = (T - a[0]) / (b[0] - a[0]);
    stage.style.setProperty("--sky1", mix(a[1], b[1], k));
    stage.style.setProperty("--sky2", mix(a[2], b[2], k));
    var night = T < 5.4 || T > 20 ? 1 : T < 6.6 ? (6.6 - T) / 1.2 : T > 18.8 ? (T - 18.8) / 1.2 : 0;
    stage.style.setProperty("--night", night.toFixed(2));
    // sun rides an arc from 6:00 to 19:00, the moon from 19:00 to 6:00
    var fs = (T - 6) / 13, fm = ((T - 19 + 24) % 24) / 11;
    var at = function (f) { return "translate(" + (30 + f * 340).toFixed(1) + " " + (84 - Math.sin(f * Math.PI) * 62).toFixed(1) + ")"; };
    sun.setAttribute("transform", at(Math.max(0, Math.min(1, fs))));
    sun.style.opacity = fs > -.02 && fs < 1.02 ? 1 : 0;
    moon.setAttribute("transform", at(Math.max(0, Math.min(1, fm))));
    moon.style.opacity = fm >= 0 && fm <= 1 && (fs < 0 || fs > 1) ? 1 : 0;
  }
  sun.style.transition = moon.style.transition = "opacity .6s";

  // ---------- Open-hours arcs and closed numbers ----------
  function arcPath(a1, a2, r) {
    var p = function (a) { var t = a * Math.PI / 180; return (Math.sin(t) * r).toFixed(2) + " " + (-Math.cos(t) * r).toFixed(2); };
    return "M" + p(a1) + " A" + r + " " + r + " 0 " + (a2 - a1 > 180 ? 1 : 0) + " 1 " + p(a2);
  }
  function paintOpen() {
    var segs = [], d = "";
    if (mode === "h") {
      for (var k = 0; k < 12; k++) {
        var hv = k || 12, H = h24(hv, pm), open = H * 60 + 59 >= OPEN_FROM && H * 60 <= OPEN_TO;
        hNums.children[k].classList.toggle("shut", !open);
        if (open) segs.push([k * 30 - 13, k * 30 + 13]);
      }
    } else {
      var base = h24(hour, pm) * 60;
      for (var j = 0; j < 12; j++) {
        var ok = isOpen(base + j * 5);
        mNums.children[j].classList.toggle("shut", !ok);
        if (ok) segs.push([j * 30 - 13, j * 30 + 13]);
      }
    }
    // join neighbouring segments into smooth arcs
    var merged = [];
    segs.forEach(function (s) { var l = merged[merged.length - 1]; if (l && s[0] - l[1] < 6) l[1] = s[1]; else merged.push(s.slice()); });
    if (merged.length > 1 && merged[0][0] < -10 && merged[merged.length - 1][1] > 345) { merged[0][0] = merged.pop()[0] - 360; }
    merged.forEach(function (s) { d += '<path class="openArc" d="' + (s[1] - s[0] >= 359 ? arcPath(0, 180, 104) + " " + arcPath(180, 359.9, 104) : arcPath(s[0], s[1], 104)) + '"/>'; });
    arcs.innerHTML = d;
  }

  // ---------- Readout with rolling digits ----------
  function roll(el, text, down) {
    var cur = el.lastElementChild;
    if (cur && cur.textContent === text) return;
    el.classList.toggle("down", !!down);
    // while the hand is swept quickly the digits just swap, otherwise every change would restart the roll
    var t = performance.now(), quick = t - (el._t || 0) < 180;
    el._t = t;
    if (reduce.matches || !cur || quick) { el.innerHTML = "<span>" + text + "</span>"; return; }
    [].forEach.call(el.querySelectorAll(".out"), function (o) { o.remove(); });
    cur.className = "out";
    var s = document.createElement("span"); s.className = "in"; s.textContent = text; el.appendChild(s);
    setTimeout(function () { if (cur.parentNode) cur.remove(); }, 320);
  }
  var lastH = hour, lastM = minute;
  function update() {
    roll($("#hRoll"), String(hour).padStart(2, "0"), hour < lastH);
    roll($("#mRoll"), String(minute).padStart(2, "0"), minute < lastM);
    lastH = hour; lastM = minute;
    hBtn.setAttribute("aria-label", "Hour " + hour + ". Press to set the hour");
    mBtn.setAttribute("aria-label", minute + " minutes. Press to set the minutes");
    ampmBtns.forEach(function (b) { b.setAttribute("aria-checked", String((b.dataset.pm === "1") === pm)); });
    var t = total(), open = isOpen(t), txt = label(hour, minute, pm);
    msg.classList.toggle("bad", !open);
    msgText.textContent = open ? "Ready for pickup at " + txt : "We are closed at " + txt + ". Pick 10:00 AM to 9:30 PM.";
    book.textContent = open ? "Book " + txt : "Closed then";
    book.setAttribute("aria-disabled", String(!open));
    knob.classList.toggle("closed", !open);
    dial.setAttribute("aria-valuenow", mode === "h" ? hour : minute);
    dial.setAttribute("aria-valuemin", mode === "h" ? 1 : 0);
    dial.setAttribute("aria-valuemax", mode === "h" ? 12 : 55);
    dial.setAttribute("aria-valuetext", mode === "h" ? "Hour " + hour + (pm ? " PM" : " AM") : minute + " minutes past " + hour);
    paintOpen();
    paintSky();
  }

  // ---------- Hand on a spring ----------
  var cur = 150, vel = 0, target = 150, dragging = false;
  function near(a, ref) { return ref + ((((a - ref) % 360) + 540) % 360) - 180; }
  function valueAngle() { return mode === "h" ? (hour % 12) * 30 : minute * 6; }
  function aim() { target = near(valueAngle(), cur); }
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(3, (now - last) / 16.7);
    last = now;
    if (reduce.matches) { cur = target; vel = 0; }
    else for (var s = 0; s < dt; s++) {
      if (dragging) { vel = vel * .55 + (target - cur) * .32; }
      else { vel = vel * .76 + (target - cur) * .13; }
      cur += vel;
    }
    var a = cur * Math.PI / 180, x = Math.sin(a) * R_NUM, y = -Math.cos(a) * R_NUM;
    hand.setAttribute("x2", (x * .78).toFixed(2)); hand.setAttribute("y2", (y * .78).toFixed(2));
    tail.setAttribute("x2", (-x * .16).toFixed(2)); tail.setAttribute("y2", (-y * .16).toFixed(2));
    [knob, knobRing].forEach(function (c) { c.setAttribute("cx", x.toFixed(2)); c.setAttribute("cy", y.toFixed(2)); });
    knobText.setAttribute("x", x.toFixed(2)); knobText.setAttribute("y", y.toFixed(2));
    knobText.textContent = mode === "h" ? hour : String(minute).padStart(2, "0");
    requestAnimationFrame(frame);
  }

  // ---------- Modes ----------
  function setMode(m) {
    mode = m;
    hNums.classList.toggle("hide", m !== "h");
    mNums.classList.toggle("hide", m !== "m");
    hBtn.classList.toggle("on", m === "h");
    mBtn.classList.toggle("on", m === "m");
    $("#modeTag").textContent = m === "h" ? "HOUR" : "MINUTES";
    aim(); update();
  }
  function setFromAngle(a, snap) {
    var deg = ((a % 360) + 360) % 360;
    if (mode === "h") { var h = Math.round(deg / 30) % 12; hour = h || 12; }
    else minute = (Math.round(deg / 30) % 12) * 5;
    if (snap) aim();
    update();
  }

  // ---------- Pointer and keyboard on the dial ----------
  function angleOf(e) {
    var b = dial.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
    return Math.atan2(dx, -dy) * 180 / Math.PI;
  }
  dial.addEventListener("pointerdown", function (e) {
    if (ticketOn) return;
    dragging = true; dial.classList.add("grab");
    try { dial.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
    target = near(angleOf(e), cur); setFromAngle(angleOf(e), false);
    dial.focus({ preventScroll: true });
    e.preventDefault();
  });
  dial.addEventListener("pointermove", function (e) { if (!dragging) return; target = near(angleOf(e), cur); setFromAngle(angleOf(e), false); });
  var advance;
  function release() {
    if (!dragging) return;
    dragging = false; dial.classList.remove("grab");
    aim();
    if (mode === "h") { clearTimeout(advance); advance = setTimeout(function () { setMode("m"); }, 380); }
    else book.classList.toggle("ready", isOpen(total()));
  }
  dial.addEventListener("pointerup", release);
  dial.addEventListener("pointercancel", release);
  dial.addEventListener("keydown", function (e) {
    var step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 3, PageDown: -3 }[e.key];
    if (e.key === "Enter") { e.preventDefault(); if (mode === "h") setMode("m"); else book.focus(); return; }
    if (!step) return;
    e.preventDefault();
    if (mode === "h") hour = ((hour - 1 + step + 120) % 12) + 1;
    else minute = ((minute + step * 5) % 60 + 60) % 60;
    aim(); update();
  });
  hBtn.addEventListener("click", function () { setMode("h"); });
  mBtn.addEventListener("click", function () { setMode("m"); });
  ampmBtns.forEach(function (b) {
    b.addEventListener("click", function () { pm = b.dataset.pm === "1"; update(); });
  });

  // ---------- Quick picks: the hand sweeps to the hour, then the minutes ----------
  var sweepId = 0;
  async function goTo(H, M) {
    var id = ++sweepId;
    pm = H >= 12;
    setMode("h");
    hour = (H % 12) || 12; aim(); update();
    await wait(reduce.matches ? 0 : 520);
    if (id !== sweepId) return;
    setMode("m");
    minute = M; aim(); update();
    book.classList.toggle("ready", isOpen(total()));
  }
  document.querySelector(".quick").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-t]");
    if (!b || ticketOn) return;
    var p = b.dataset.t.split(":");
    goTo(+p[0], +p[1]);
  });

  // ---------- Book: busy spinner, then the ticket rises with sprinkles ----------
  var ticketBox = $("#ticketBox"), ticket = $("#ticket"), ticketOn = false, busy = false;
  function sprinkles() {
    if (reduce.matches) return;
    var cols = ["#ff5d8f", "#ffd23f", "#3ecbff", "#7bdc65", "#b57bff", "#ff8a3d"];
    for (var i = 0; i < 26; i++) {
      var s = document.createElement("i");
      s.className = "sprinkle";
      var a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 90;
      s.style.cssText = "background:" + cols[i % cols.length] + ";--x:" + (Math.cos(a) * d).toFixed(0) + "px;--y:" + (Math.sin(a) * d * .8 - 20).toFixed(0) + "px;--r:" + (Math.random() * 720 - 360).toFixed(0) + "deg;animation-delay:" + (Math.random() * 120).toFixed(0) + "ms";
      ticketBox.appendChild(s);
      setTimeout(s.remove.bind(s), 1600);
    }
  }
  function showTicket() {
    $("#tTime").textContent = label(hour, minute, pm);
    $("#tDate").textContent = "Today · " + dateText + " · Counter 2";
    ticketOn = true;
    ticketBox.classList.add("on");
    ticketBox.setAttribute("aria-hidden", "false");
    setTimeout(sprinkles, 380);
  }
  function hideTicket() {
    ticketOn = false;
    ticketBox.classList.remove("on");
    ticketBox.setAttribute("aria-hidden", "true");
    setMode("h");
  }
  async function doBook(btn, fromDemo) {
    if (busy || ticketOn) return;
    if (!isOpen(total())) {
      dial.classList.remove("shake"); void dial.getBoundingClientRect(); dial.classList.add("shake");
      msgText.textContent = "We are closed at " + label(hour, minute, pm) + ". Pick 10:00 AM to 9:30 PM.";
      return;
    }
    busy = true;
    btn.classList.remove("ready");
    btn.classList.add("busy");
    await wait(reduce.matches ? 150 : 750);
    btn.classList.remove("busy");
    busy = false;
    if (fromDemo && !demoOn) return; // the visitor took over while the demo was booking
    showTicket();
    if (!demoRunning) $("#again").focus({ preventScroll: true });
  }
  book.addEventListener("click", function (e) { var btn = e.currentTarget; doBook(btn); });
  $("#again").addEventListener("click", function () { hideTicket(); dial.focus({ preventScroll: true }); });

  // ---------- Start ----------
  setMode("h");
  cur = target = valueAngle();
  requestAnimationFrame(frame);

  // ---------- Auto demo: plays on load and loops until someone touches it ----------
  var demoOn = true, demoRunning = true;
  function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; demoRunning = false; sweepId++; } }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  // a pretend finger drags the hand round to a value
  async function drag(toAngle, ms) {
    var from = cur, to = near(toAngle, cur), t0 = performance.now();
    dragging = true;
    while (true) {
      if (!demoOn) { dragging = false; throw 0; }
      var k = Math.min(1, (performance.now() - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      target = from + (to - from) * e; setFromAngle(target, false);
      if (k >= 1) break;
      await wait(16);
    }
    dragging = false; aim();
  }
  async function demo() {
    try {
      await pause(700);
      while (demoOn) {
        pm = true; await drag(210, 900); await pause(380); setMode("m"); await pause(450);
        await drag(270, 800); await pause(500);
        await doBook(book, true); await pause(2600);
        hideTicket(); await pause(700);
        ampmBtns[1].click(); await drag(330, 800); await pause(1500); // 11 PM: closed, the message warns
        setMode("h"); await goTo(16, 30); await pause(2200);
        await goTo(17, 30); setMode("h"); await pause(1600);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
</body>
</html>
