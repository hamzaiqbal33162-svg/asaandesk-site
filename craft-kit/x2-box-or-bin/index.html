<!doctype html>
<!-- Chill & Craft · Box or Bin · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box or Bin · archive or delete forever</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: kraft paper and tomato ---------- */
  :root {
    color-scheme: light;
    --bg: #f3eadb;
    --dots: rgba(120, 84, 40, .09);
    --card: #fffdf8;
    --line: #eadcc6;
    --ink: #2b2117;
    --muted: #7f6c57;
    --kraft1: #dfa86b;
    --kraft2: #b87b3e;
    --kraft-in: #6e4320;
    --tape: #f2e2b5;
    --tomato: #e4473a;
    --tomato-soft: #fde3df;
    --leaf: #2c9b67;
    --leaf-soft: #def3e7;
    --sh: 92, 60, 24;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15100b;
    --dots: rgba(255, 220, 170, .05);
    --card: #241c14;
    --line: #3b2f22;
    --ink: #f7ecdc;
    --muted: #b6a088;
    --kraft1: #d39a5c;
    --kraft2: #9e6630;
    --kraft-in: #3d2410;
    --tape: #d8c48f;
    --tomato: #ff6a5a;
    --tomato-soft: #45201b;
    --leaf: #4cc98c;
    --leaf-soft: #173326;
    --sh: 0, 0, 0;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .frame {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 20px 16px;
    overflow: hidden;
    overflow: clip;
    background-image: radial-gradient(var(--dots) 1.2px, transparent 1.4px);
    background-size: 18px 18px;
  }
  /* a soft kraft desk mat the whole scene sits on */
  .scene {
    position: relative;
    width: min(480px, 100%);
    padding: 20px 20px 10px;
    border-radius: 30px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--card) 70%, transparent), color-mix(in srgb, var(--kraft1) 10%, var(--card)));
    border: 1px solid var(--line);
    box-shadow: 0 50px 90px -60px rgba(var(--sh), .55), inset 0 1px 0 rgba(255, 255, 255, .5);
  }

  /* ---------- Header with the archive shelf ---------- */
  .bar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .bar h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.015em; }
  .bar p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .shelf {
    margin-left: auto;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px 7px 9px;
    border-radius: 99px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 13px;
    font-weight: 650;
    box-shadow: 0 8px 18px -14px rgba(var(--sh), .6);
  }
  .shelf svg { width: 20px; height: 20px; }
  .shelf b { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--kraft2); color: #fff; display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ---------- Stage: the order card, the rising box ---------- */
  .stage { position: relative; height: 352px; overflow: hidden; overflow: clip; }
  .stage.free { overflow: visible; }
  .floor { position: absolute; left: 50%; bottom: 8px; width: 240px; height: 18px; margin-left: -120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--sh), .22), transparent); opacity: 0; transition: opacity .4s; }
  .stage.box-up .floor { opacity: 1; }

  .order {
    position: absolute;
    left: 50%;
    top: 30px;
    width: min(360px, 100%);
    margin-left: calc(min(360px, 100%) / -2);
    z-index: 2;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px 18px 14px;
    box-shadow: 0 30px 50px -34px rgba(var(--sh), .55), 0 2px 6px -3px rgba(var(--sh), .14);
    transition: transform .45s var(--spring), box-shadow .3s;
    transform-origin: 50% 60%;
    animation: float 4.6s ease-in-out infinite;
  }
  .order::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--tomato); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .stage[data-lean="arch"] .order { transform: rotate(-2.5deg) translateY(-8px); }
  .stage[data-lean="del"] .order { transform: translateY(-3px) scale(.985); box-shadow: 0 30px 50px -30px rgba(228, 71, 58, .55), 0 0 0 2px var(--tomato); }
  .stage[data-lean="del"] .order::after { opacity: .06; }
  .order.gone { visibility: hidden; }
  .who { display: flex; align-items: center; gap: 11px; }
  .av { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; background: linear-gradient(135deg, #f59e6b, #d9463b); }
  .who b { display: block; font-size: 15px; }
  .who small { color: var(--muted); font-size: 12.5px; }
  .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--leaf-soft); color: var(--leaf); font-size: 12px; font-weight: 700; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 2.2s ease-in-out infinite; }
  .rule { margin: 13px 0 10px; border: 0; border-top: 2px dashed var(--line); }
  .lines { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
  .lines li { display: flex; justify-content: space-between; gap: 10px; }
  .lines span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
  .total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .cracks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .cracks path { fill: none; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: round; opacity: .75; transition: stroke-dashoffset .38s ease-out; }
  .cracking .cracks path { stroke-dashoffset: 0; }
  .shard { position: absolute; margin: 0; animation: none; transition: none; z-index: 4; }

  /* the box is two layers (back wall, front wall) so the card can drop between them */
  .bx { position: absolute; left: 50%; bottom: 16px; width: 212px; height: 120px; margin-left: -106px; transform: translateY(190px); transition: transform .62s var(--spring); transform-origin: 50% 50%; }
  .stage.box-up .bx { transform: none; }
  .bx-back { z-index: 1; }
  .bx-back::before { content: ""; position: absolute; left: 6px; right: 6px; top: -18px; height: 40px; border-radius: 6px 6px 0 0; background: linear-gradient(var(--kraft-in), #4a2c13); }
  .bx-front { z-index: 3; }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 4px 4px 12px 12px;
    background: linear-gradient(180deg, var(--kraft1), var(--kraft2));
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .28), inset 0 -10px 18px -10px rgba(60, 30, 5, .5);
    overflow: hidden;
  }
  .face::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 3px, transparent 3px 9px); }
  .tag { position: absolute; left: 16px; bottom: 16px; width: 62px; height: 40px; border-radius: 5px; background: #fff8ea; box-shadow: 0 2px 0 rgba(60, 30, 5, .2); }
  .tag::before, .tag::after { content: ""; position: absolute; left: 8px; height: 4px; border-radius: 2px; background: #d6c4a3; }
  .tag::before { top: 11px; width: 40px; }
  .tag::after { top: 22px; width: 28px; }
  .arrows { position: absolute; right: 16px; bottom: 16px; width: 30px; height: 32px; opacity: .55; }
  .tape { position: absolute; left: 50%; top: 0; width: 30px; height: 44px; margin-left: -15px; background: linear-gradient(90deg, rgba(255, 255, 255, .25), transparent 40%), var(--tape); opacity: .95; transform: scaleY(0); transform-origin: 50% 0; transition: transform .32s cubic-bezier(.3, .8, .4, 1); box-shadow: 0 1px 2px rgba(60, 30, 5, .25); }
  .stage.taped .tape { transform: none; }
  .stamp {
    position: absolute;
    left: 50%;
    top: 52px;
    margin-left: -52px;
    width: 104px;
    padding: 5px 0;
    border: 3px solid var(--tomato);
    border-radius: 6px;
    color: var(--tomato);
    font-weight: 900;
    font-size: 14px;
    letter-spacing: .16em;
    text-align: center;
    background: rgba(255, 255, 255, .55);
    opacity: 0;
    transform: scale(2.3) rotate(-3deg);
    transition: transform .3s cubic-bezier(.5, 1.8, .6, 1), opacity .14s;
  }
  .stage.stamped .stamp { opacity: 1; transform: rotate(-9deg); }
  .flap { position: absolute; top: -18px; width: 50%; height: 20px; background: linear-gradient(180deg, #e9b67c, var(--kraft1)); border-radius: 3px; box-shadow: inset 0 -2px 0 rgba(60, 30, 5, .18); transition: transform .42s var(--spring); }
  .flap.l { left: 0; transform-origin: 0 100%; border-top-left-radius: 6px; }
  .flap.r { right: 0; transform-origin: 100% 100%; border-top-right-radius: 6px; transition-delay: .07s; }
  .stage.flaps-open .flap.l { transform: rotate(-118deg); }
  .stage.flaps-open .flap.r { transform: rotate(118deg); }
  .stage.snap .bx, .stage.snap .bx *, .stage.snap .floor { transition: none !important; }

  /* ---------- Empty state after the choice ---------- */
  .ghost {
    position: absolute;
    left: 50%;
    top: 30px;
    width: min(360px, 100%);
    margin-left: calc(min(360px, 100%) / -2);
    height: 236px;
    border: 2px dashed var(--line);
    border-radius: 20px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 6px;
    padding: 18px;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: scale(.96);
    transition: opacity .35s, transform .45s var(--spring), visibility 0s .45s;
  }
  .ghost.show { opacity: 1; visibility: visible; transform: none; transition: opacity .35s, transform .45s var(--spring), visibility 0s; }
  .ghost .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--leaf-soft); color: var(--leaf); }
  .ghost.del .ic { background: var(--tomato-soft); color: var(--tomato); }
  .ghost .ic svg { width: 28px; height: 28px; }
  .ghost b { font-size: 16px; }
  .ghost span { font-size: 13px; color: var(--muted); max-width: 260px; }
  .back {
    margin-top: 8px;
    border: 0;
    border-radius: 99px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 750;
    font-size: 14px;
    color: #fff;
    background: var(--ink);
    cursor: pointer;
    transition: transform .22s var(--spring);
  }
  :root[data-theme="dark"] .back { color: #1b140d; }
  .back:hover { transform: translateY(-2px); }
  .back:active, .back.pressed { transform: scale(.93); }

  /* ---------- The choice: one pill that splits into two ---------- */
  .choice { position: relative; height: 106px; display: grid; justify-items: center; align-content: start; padding-top: 6px; }
  .choice > * { grid-area: 1 / 1; }
  .remove, .opt, .keep, .working { transition: opacity .25s, transform .45s var(--spring), visibility 0s .45s; opacity: 0; visibility: hidden; }
  .remove {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 24px 0 18px;
    border: 0;
    border-radius: 99px;
    font: inherit;
    font-size: 15px;
    font-weight: 760;
    color: var(--ink);
    background: var(--card);
    box-shadow: 0 0 0 1.5px var(--line), 0 16px 26px -18px rgba(var(--sh), .7);
    cursor: pointer;
    transform: scale(.7);
  }
  .remove svg { width: 22px; height: 22px; }
  .remove:hover { box-shadow: 0 0 0 1.5px var(--kraft1), 0 18px 28px -18px rgba(var(--sh), .8); }
  .remove.pressed, .remove:active { scale: .94; }
  .choice[data-step="idle"] .remove { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .45s var(--spring), visibility 0s; }
  .opts { display: flex; gap: 10px; }
  .opt {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 52px;
    padding: 0 18px 0 14px;
    border: 0;
    border-radius: 16px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 760;
    cursor: pointer;
    white-space: nowrap;
  }
  .opt svg { width: 22px; height: 22px; flex: none; }
  .opt.arch { color: #3a2410; background: linear-gradient(180deg, #f0c48e, var(--kraft1)); box-shadow: 0 14px 22px -14px rgba(184, 123, 62, .9), inset 0 -3px 0 rgba(60, 30, 5, .18); transform: translateX(46px) scale(.6); }
  .opt.del { color: #fff; background: linear-gradient(180deg, #f2675a, var(--tomato)); box-shadow: 0 14px 22px -14px rgba(228, 71, 58, .95), inset 0 -3px 0 rgba(80, 10, 5, .22); transform: translateX(-46px) scale(.6); transition-delay: .05s; }
  .opt:hover { filter: brightness(1.05); }
  .opt.pressed, .opt:active { scale: .94; }
  .choice[data-step="ask"] .opt { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .5s var(--spring), visibility 0s; }
  .choice[data-step="ask"] .opt.del { transition-delay: .06s; }
  .keep { margin-top: 62px; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 650; color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .keep:hover { color: var(--ink); }
  .choice[data-step="ask"] .keep { opacity: 1; visibility: visible; transition: opacity .3s .2s, visibility 0s; }
  .working { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 99px; background: var(--card); box-shadow: 0 0 0 1.5px var(--line); font-weight: 700; font-size: 14px; transform: scale(.8); }
  .choice[data-step="work"] .working, .choice[data-step="done"] .working { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .45s var(--spring), visibility 0s; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--kraft2); animation: spin .8s linear infinite; }
  .working.red .spin { border-top-color: var(--tomato); }
  .tick { display: none; width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); color: #fff; place-items: center; }
  .tick svg { width: 14px; height: 14px; }
  .working.red .tick { background: var(--tomato); }
  .choice[data-step="done"] .spin { display: none; }
  .choice[data-step="done"] .tick { display: grid; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .layer { position: absolute; inset: 0; pointer-events: none; }
  .puff { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--kraft1); opacity: .7; }
  .flash { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: radial-gradient(closest-side, #fff, rgba(255, 255, 255, 0)); }
  .wave { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 3px solid var(--tomato); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 400px) {
    .opt { padding: 0 13px 0 11px; font-size: 13.5px; gap: 7px; }
    .bar p { display: none; }
  }
  /* Calm mode: every step still happens, without the big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <main class="scene" aria-labelledby="title">
    <header class="bar">
      <div>
        <h1 id="title">Orders</h1>
        <p>Keep a copy, or delete it for good</p>
      </div>
      <span class="shelf" id="shelf" aria-label="Archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l2-4h14l2 4z" fill="#e9b67c" /><rect x="3" y="8" width="18" height="12" rx="2" fill="#c98c4c" /><rect x="10.5" y="8" width="3" height="5" fill="#f2e2b5" /></svg>
        Archive <b id="archCount">2</b>
      </span>
    </header>

    <div class="stage" id="stage">
      <div class="floor" aria-hidden="true"></div>
      <!-- the flaps sit on the back wall so the card can drop past them -->
      <div class="bx bx-back" id="bxBack" aria-hidden="true"><div class="flap l"></div><div class="flap r"></div></div>

      <article class="order" id="order" aria-label="Order 4821 from Hina Baig">
        <div class="who">
          <span class="av" aria-hidden="true">HB</span>
          <div><b>Hina Baig</b><small>Karachi · 3 items</small></div>
          <span class="chip"><i aria-hidden="true"></i>Delivered</span>
        </div>
        <hr class="rule">
        <ul class="lines">
          <li><span>Block-print kurta × 2</span><span>PKR 5,200</span></li>
          <li><span>Gift wrap</span><span>PKR 1,000</span></li>
          <li><span>Delivery</span><span>PKR 250</span></li>
        </ul>
        <div class="total"><span>Total</span><span>PKR 6,450</span></div>
        <div class="foot">Order #4821 · placed 14 Nov</div>
        <svg class="cracks" id="cracks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      </article>

      <div class="bx bx-front" id="bxFront" aria-hidden="true">
        <div class="face">
          <div class="tag"></div>
          <svg class="arrows" viewBox="0 0 30 32"><path d="M8 30V6M3 11l5-6 5 6M22 30V6M17 11l5-6 5 6" fill="none" stroke="#5a3415" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <div class="tape"></div>
          <div class="stamp" id="stamp">ARCHIVED</div>
        </div>
      </div>

      <div class="ghost" id="ghost">
        <span class="ic" id="ghostIc" aria-hidden="true"></span>
        <b id="ghostTitle">Order archived</b>
        <span id="ghostText">It is safe in the Archive.</span>
        <button class="back" id="backBtn" type="button">Bring it back</button>
      </div>
    </div>

    <div class="choice" id="choice" data-step="idle">
      <button class="remove" id="removeBtn" type="button" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5" /></svg>
        Remove order
      </button>
      <div class="opts" role="group" aria-label="How to remove the order">
        <button class="opt arch" id="archBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l2-4h14l2 4M3 8h18v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19z" /><path d="M10 12h4" stroke-linecap="round" /></svg>
          Archive
        </button>
        <button class="opt del" id="delBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.6 2.4 2.9C11 9 11 6 12 3z" /></svg>
          Delete forever
        </button>
      </div>
      <button class="keep" id="keepBtn" type="button">Keep it (Esc)</button>
      <div class="working" id="working" aria-hidden="true">
        <i class="spin"></i>
        <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></span>
        <span id="workText">Archiving…</span>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>
  <div class="layer" id="layer" aria-hidden="true"></div>
</div>

<script>
  // ---------- Box or Bin: one Remove button that asks "archive or delete forever?" ----------
  (function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const frame = $("frame"), layer = $("layer"), stage = $("stage"), order = $("order"), cracks = $("cracks");
    const bxBack = $("bxBack"), bxFront = $("bxFront"), stamp = $("stamp"), shelf = $("shelf"), archCount = $("archCount");
    const ghost = $("ghost"), ghostIc = $("ghostIc"), ghostTitle = $("ghostTitle"), ghostText = $("ghostText"), backBtn = $("backBtn");
    const choice = $("choice"), removeBtn = $("removeBtn"), archBtn = $("archBtn"), delBtn = $("delBtn"), keepBtn = $("keepBtn");
    const working = $("working"), workText = $("workText"), status = $("status");

    const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
    const calm = () => calmQ.matches;
    const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 220) : ms));
    const rand = (a, b) => a + Math.random() * (b - a);
    // Web Animations helper that never rejects (a rejected .finished would log an error)
    function play(el, frames, opts) {
      if (calm() || !el.animate) return Promise.resolve();
      const a = el.animate(frames, opts);
      return new Promise((res) => { a.onfinish = res; a.oncancel = res; });
    }
    // cancel the script animations we left filled (CSS animations and transitions keep running)
    const clearAnims = (el) => { if (el.getAnimations) el.getAnimations().forEach((a) => { if (!("animationName" in a) && !("transitionProperty" in a)) a.cancel(); }); };
    function frameXY(x, y) { const r = frame.getBoundingClientRect(); return { x: x - r.left, y: y - r.top }; }
    function say(msg) { if (!demo.on) status.textContent = msg; }
    function press(el) { el.classList.add("pressed"); setTimeout(() => el.classList.remove("pressed"), 170); }
    const ICON_BOX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8l2-4h14l2 4M3 8h18v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19z"/><path d="M10 12h4" stroke-linecap="round"/></svg>';
    const ICON_GONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5"/><path d="M10 11l4 5M14 11l-4 5"/></svg>';

    const st = { step: "idle", busy: false, archived: 2, mode: "", dy: 0, shards: [] };
    function setStep(s) { st.step = s; choice.dataset.step = s; }
    function lean(kind) { stage.dataset.lean = st.step === "ask" ? kind : ""; }

    // ---------- Step 1: the pill splits into Archive / Delete forever ----------
    function ask(fromUser) {
      if (st.busy || st.step !== "idle") return;
      setStep("ask");
      say("Archive keeps a copy. Delete forever removes it for good. Escape keeps the order.");
      if (fromUser) setTimeout(() => archBtn.focus({ preventScroll: true }), 80);
    }
    function cancel(fromUser) {
      if (st.busy || st.step !== "ask") return;
      lean("");
      setStep("idle");
      say("Order kept");
      if (fromUser) setTimeout(() => removeBtn.focus({ preventScroll: true }), 80);
    }

    // ---------- Archive: box rises, card folds in, flaps close, tape, stamp, off to the shelf ----------
    async function archive() {
      if (st.busy || st.step !== "ask") return;
      st.busy = true;
      lean("");
      working.classList.remove("red");
      workText.textContent = "Packing it away…";
      setStep("work");
      say("Archiving order 4821");
      stage.classList.add("box-up");
      await wait(320);
      stage.classList.add("flaps-open");
      await wait(330);
      const r = order.getBoundingClientRect(), b = bxFront.getBoundingClientRect();
      st.dy = b.top + b.height * 0.5 - (r.top + r.height / 2);
      await play(order, [
        { transform: "none" },
        { transform: "translateY(-24px) scale(1.03)", offset: 0.26 },
        { transform: `translateY(${st.dy * 0.35}px) scale(.66, .52)`, offset: 0.6 },
        { transform: `translateY(${st.dy}px) scale(.42, .3)` }
      ], { duration: 1000, easing: "cubic-bezier(.45, 0, .4, 1)", fill: "forwards" });
      order.classList.add("gone");
      clearAnims(order);
      const squash = [{ transform: "none" }, { transform: "scale(1.06, .9) translateY(6px)", offset: 0.3 }, { transform: "scale(.98, 1.04)", offset: 0.65 }, { transform: "none" }];
      play(bxFront, squash, { duration: 460, easing: "ease-out" });
      play(bxBack, squash, { duration: 460, easing: "ease-out" });
      stage.classList.remove("flaps-open");
      await wait(430);
      stage.classList.add("taped");
      await wait(330);
      stage.classList.add("stamped");
      const s = stamp.getBoundingClientRect();
      puffs(s.left + s.width / 2, s.top + s.height / 2, 9);
      st.archived += 1;
      await wait(700);
      // off to the shelf in the header
      stage.classList.add("free");
      const sh = shelf.getBoundingClientRect(), f = bxFront.getBoundingClientRect();
      const tx = sh.left + 18 - (f.left + f.width / 2), ty = sh.top + sh.height / 2 - (f.top + f.height / 2);
      const fly = [
        { transform: "none", opacity: 1 },
        { transform: `translate(${tx * 0.25}px, ${ty * 0.2 - 30}px) scale(.82) rotate(-5deg)`, opacity: 1, offset: 0.35 },
        { transform: `translate(${tx}px, ${ty}px) scale(.1) rotate(10deg)`, opacity: 0.3 }
      ];
      await Promise.all([
        play(bxFront, fly, { duration: 780, easing: "cubic-bezier(.5, 0, .6, 1)", fill: "forwards" }),
        play(bxBack, fly, { duration: 780, easing: "cubic-bezier(.5, 0, .6, 1)", fill: "forwards" })
      ]);
      archCount.textContent = st.archived;
      play(shelf, [{ transform: "scale(1)" }, { transform: "scale(1.16) rotate(-3deg)", offset: 0.4 }, { transform: "scale(1)" }], { duration: 520, easing: "ease-out" });
      // put the box back under the floor, out of sight
      stage.classList.add("snap");
      stage.classList.remove("box-up", "taped", "stamped", "free");
      clearAnims(bxFront); clearAnims(bxBack);
      void stage.offsetWidth;
      stage.classList.remove("snap");
      showGhost("arch");
      working.classList.remove("red");
      workText.textContent = "Archived";
      setStep("done");
      say("Order 4821 archived. Bring it back is available.");
      st.busy = false;
    }
    async function unarchive() {
      st.busy = true;
      hideGhost();
      workText.textContent = "Unpacking…";
      setStep("work");
      stage.classList.add("snap", "free", "box-up", "taped", "stamped");
      void stage.offsetWidth;
      stage.classList.remove("snap");
      const sh = shelf.getBoundingClientRect(), f = bxFront.getBoundingClientRect();
      const tx = sh.left + 18 - (f.left + f.width / 2), ty = sh.top + sh.height / 2 - (f.top + f.height / 2);
      st.archived = Math.max(0, st.archived - 1);
      archCount.textContent = st.archived;
      const back = [
        { transform: `translate(${tx}px, ${ty}px) scale(.1) rotate(10deg)`, opacity: 0.3 },
        { transform: `translate(${tx * 0.25}px, ${ty * 0.2 - 30}px) scale(.82) rotate(-5deg)`, opacity: 1, offset: 0.65 },
        { transform: "none", opacity: 1 }
      ];
      await Promise.all([
        play(bxFront, back, { duration: 720, easing: "cubic-bezier(.3, .6, .4, 1)" }),
        play(bxBack, back, { duration: 720, easing: "cubic-bezier(.3, .6, .4, 1)" })
      ]);
      stage.classList.remove("free", "stamped");
      await wait(220);
      stage.classList.remove("taped");
      await wait(300);
      stage.classList.add("flaps-open");
      await wait(300);
      order.classList.remove("gone");
      await play(order, [
        { transform: `translateY(${st.dy}px) scale(.42, .3)` },
        { transform: "translateY(-34px) scale(1.04)", offset: 0.55 },
        { transform: "none" }
      ], { duration: 940, easing: "cubic-bezier(.3, .8, .4, 1)" });
      stage.classList.remove("flaps-open");
      await wait(260);
      stage.classList.remove("box-up");
      await wait(500);
      setStep("idle");
      say("Order 4821 is back in your list");
      st.busy = false;
    }

    // ---------- Delete forever: shake, crack, shatter into falling shards ----------
    function rayHit(cx, cy, a) {
      const dx = Math.cos(a), dy = Math.sin(a);
      let t = Infinity;
      if (dx > 1e-6) t = Math.min(t, (100 - cx) / dx);
      if (dx < -1e-6) t = Math.min(t, -cx / dx);
      if (dy > 1e-6) t = Math.min(t, (100 - cy) / dy);
      if (dy < -1e-6) t = Math.min(t, -cy / dy);
      return { x: Math.min(100, Math.max(0, cx + dx * t)), y: Math.min(100, Math.max(0, cy + dy * t)) };
    }
    function perim(p) { // position along the card's edge, clockwise from the top-left corner (0..4)
      if (p.y <= 0.01) return p.x / 100;
      if (p.x >= 99.99) return 1 + p.y / 100;
      if (p.y >= 99.99) return 2 + (100 - p.x) / 100;
      return 3 + (100 - p.y) / 100;
    }
    const CORNERS = [{ x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: 0, y: 100 }];
    function cornersBetween(p1, p2) {
      const span = (p2 - p1 + 4) % 4, out = [];
      for (let c = 1; c <= 4; c++) { const d = (c - p1 + 4) % 4; if (d > 0 && d < span) out.push({ d, pt: CORNERS[c % 4] }); }
      return out.sort((a, b) => a.d - b.d).map((o) => o.pt);
    }
    function buildShards() {
      const cx = rand(42, 60), cy = rand(34, 52), n = 8, list = [];
      const angles = Array.from({ length: n }, (_, i) => (i / n) * Math.PI * 2 + rand(-0.22, 0.22));
      const hits = angles.map((a) => rayHit(cx, cy, a));
      const k = angles.map(() => rand(0.34, 0.5));
      const mids = hits.map((h, i) => ({ x: cx + (h.x - cx) * k[i], y: cy + (h.y - cy) * k[i] }));
      let paths = "";
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n, a = hits[i], b = hits[j], ma = mids[i], mb = mids[j];
        list.push([{ x: cx, y: cy }, ma, mb]);
        list.push([ma, a, ...cornersBetween(perim(a), perim(b)), b, mb]);
        const jx = (ma.x + a.x) / 2 + rand(-3, 3), jy = (ma.y + a.y) / 2 + rand(-3, 3);
        paths += `<path pathLength="1" style="transition-delay:${i * 30}ms" d="M${cx} ${cy}L${ma.x} ${ma.y}L${jx} ${jy}L${a.x} ${a.y}"/>`;
        paths += `<path pathLength="1" style="transition-delay:${180 + i * 25}ms" d="M${ma.x} ${ma.y}L${mb.x} ${mb.y}"/>`;
      }
      cracks.innerHTML = paths;
      return { cx, cy, list };
    }
    function spawnShards(geo) {
      const r = order.getBoundingClientRect(), p = frameXY(r.left, r.top);
      return geo.list.map((poly, i) => {
        const el = order.cloneNode(true);
        el.removeAttribute("id");
        el.querySelectorAll("[id]").forEach((x) => x.removeAttribute("id"));
        el.className = "order shard";
        el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${r.width}px;height:${r.height}px;clip-path:polygon(${poly.map((q) => `${q.x.toFixed(2)}% ${q.y.toFixed(2)}%`).join(",")})`;
        el.classList.add("cracking");
        layer.appendChild(el);
        const c = poly.reduce((s, q) => ({ x: s.x + q.x / poly.length, y: s.y + q.y / poly.length }), { x: 0, y: 0 });
        let dx = ((c.x - geo.cx) / 100) * r.width, dy = ((c.y - geo.cy) / 100) * r.height;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        const inner = i % 2 === 0;
        const end = `translate(${(dx * rand(60, 150)).toFixed(1)}px, ${(dy * 40 + rand(300, 420)).toFixed(1)}px) rotate(${rand(-220, 220).toFixed(0)}deg) scale(${rand(0.7, 0.95).toFixed(2)})`;
        const gap = `translate(${(dx * 7).toFixed(1)}px, ${(dy * 7).toFixed(1)}px)`;
        return { el, end, gap, delay: (inner ? 0 : 70) + rand(0, 90), dur: rand(1000, 1400) };
      });
    }
    async function shatter() {
      if (st.busy || st.step !== "ask") return;
      st.busy = true;
      lean("");
      working.classList.add("red");
      workText.textContent = "Deleting for good…";
      setStep("work");
      say("Deleting order 4821 for good");
      await wait(480);   // let the hover lean transition settle, then the anticipation shake
      await play(order, [
        { transform: "none" }, { transform: "translateX(-7px) rotate(-1.2deg)" }, { transform: "translateX(7px) rotate(1.2deg)" },
        { transform: "translateX(-5px) rotate(-.6deg)" }, { transform: "translateX(4px)" }, { transform: "none" }
      ], { duration: 440, easing: "ease-in-out" });
      const geo = buildShards();
      void cracks.offsetWidth;
      order.classList.add("cracking");
      await wait(520);
      const r = order.getBoundingClientRect();
      const ip = frameXY(r.left + (geo.cx / 100) * r.width, r.top + (geo.cy / 100) * r.height);
      blast(ip);
      st.shards = spawnShards(geo);
      order.classList.add("gone");
      await Promise.all(st.shards.map((s) => play(s.el, [
        { transform: "none", opacity: 1, offset: 0 },
        { transform: s.gap, opacity: 1, offset: 0.12, easing: "cubic-bezier(.5, 0, .9, .5)" },
        { transform: s.end, opacity: 0, offset: 1 }
      ], { duration: s.dur, delay: s.delay, fill: "both" })));
      st.shards.forEach((s) => { s.el.style.visibility = "hidden"; clearAnims(s.el); });
      showGhost("del");
      working.classList.add("red");
      workText.textContent = "Deleted for good";
      setStep("done");
      say("Order 4821 deleted for good");
      st.busy = false;
    }
    function blast(p) {
      if (calm()) return;
      const f = document.createElement("i"), w = document.createElement("i");
      f.className = "flash"; w.className = "wave";
      [f, w].forEach((el) => { el.style.left = p.x + "px"; el.style.top = p.y + "px"; layer.appendChild(el); });
      const a = f.animate([{ transform: "scale(.2)", opacity: 1 }, { transform: "scale(3)", opacity: 0 }], { duration: 420, easing: "ease-out" });
      const b = w.animate([{ transform: "scale(.3)", opacity: 0.9 }, { transform: "scale(4.2)", opacity: 0 }], { duration: 760, easing: "cubic-bezier(.2, .8, .3, 1)" });
      a.onfinish = a.oncancel = () => f.remove();
      b.onfinish = b.oncancel = () => w.remove();
    }
    async function reassemble() {
      st.busy = true;
      hideGhost();
      working.classList.remove("red");
      workText.textContent = "Rewinding the demo…";
      setStep("work");
      await wait(200);
      const shards = st.shards;
      shards.forEach((s) => { s.el.style.visibility = ""; });
      await Promise.all(shards.map((s) => play(s.el, [
        { transform: s.end, opacity: 0 },
        { transform: s.gap, opacity: 1, offset: 0.85 },
        { transform: "none", opacity: 1 }
      ], { duration: s.dur * 0.75, delay: 260 - s.delay, easing: "cubic-bezier(.2, .7, .3, 1)", fill: "both" })));
      order.classList.remove("gone", "cracking");
      shards.forEach((s) => s.el.remove());
      st.shards = [];
      play(order, [{ transform: "scale(1.04)" }, { transform: "none" }], { duration: 520, easing: "cubic-bezier(.3, 1.5, .6, 1)" });
      await wait(260);
      cracks.innerHTML = "";
      setStep("idle");
      say("Demo order restored");
      st.busy = false;
    }

    // ---------- Little helpers for the finish ----------
    function puffs(x, y, n) {
      if (calm()) return;
      const p = frameXY(x, y);
      for (let i = 0; i < n; i++) {
        const el = document.createElement("i");
        el.className = "puff";
        el.style.left = p.x - 6 + "px";
        el.style.top = p.y - 6 + "px";
        layer.appendChild(el);
        const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), d = rand(50, 80);
        const an = el.animate([
          { transform: "translate(0, 0) scale(.5)", opacity: 0.8 },
          { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d * 0.6}px) scale(${rand(1.4, 2.2)})`, opacity: 0 }
        ], { duration: rand(520, 760), easing: "cubic-bezier(.2, .8, .3, 1)" });
        an.onfinish = an.oncancel = () => el.remove();
      }
    }
    function showGhost(kind) {
      st.mode = kind;
      ghost.classList.toggle("del", kind === "del");
      ghostIc.innerHTML = kind === "del" ? ICON_GONE : ICON_BOX;
      ghostTitle.textContent = kind === "del" ? "Order #4821 deleted for good" : "Order #4821 archived";
      ghostText.textContent = kind === "del" ? "There is no copy left. This is a demo, so you can rewind it." : "Packed, taped and on the Archive shelf. Nothing was lost.";
      backBtn.textContent = kind === "del" ? "Rewind the demo" : "Bring it back";
      ghost.classList.add("show");
    }
    function hideGhost() { ghost.classList.remove("show"); }

    // ---------- Wiring ----------
    removeBtn.addEventListener("click", (e) => { press(e.currentTarget); ask(true); });
    archBtn.addEventListener("click", () => { archive(); });
    delBtn.addEventListener("click", () => { shatter(); });
    keepBtn.addEventListener("click", () => cancel(true));
    backBtn.addEventListener("click", () => {
      if (st.busy || st.step !== "done") return;
      if (st.mode === "del") reassemble(); else unarchive();
    });
    [[archBtn, "arch"], [delBtn, "del"]].forEach(([b, kind]) => {
      b.addEventListener("pointerenter", () => lean(kind));
      b.addEventListener("focus", () => lean(kind));
      b.addEventListener("pointerleave", () => lean(""));
      b.addEventListener("blur", () => lean(""));
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") cancel(true); });

    // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
    const demo = { on: true, timer: 0, k: 0 };
    function stopDemo() {
      if (!demo.on) return;
      demo.on = false;
      clearTimeout(demo.timer);
      [removeBtn, archBtn, delBtn, backBtn].forEach((b) => b.classList.remove("pressed"));
    }
    addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
    addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
    function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
    async function runDemo() {
      if (!demo.on) return;
      if (st.busy) return scheduleDemo(700);
      if (st.step === "done") {
        press(backBtn);
        await wait(180); if (!demo.on) return;
        await (st.mode === "del" ? reassemble() : unarchive());
        return scheduleDemo(2600);
      }
      if (st.step === "ask") cancel(false);
      const del = demo.k % 2 === 1;
      demo.k += 1;
      press(removeBtn);
      await wait(170); if (!demo.on) return;
      ask(false);
      await wait(800); if (!demo.on || st.step !== "ask") return;
      const b = del ? delBtn : archBtn;
      lean(del ? "del" : "arch");
      await wait(900); if (!demo.on || st.step !== "ask") return;
      press(b);
      await wait(170); if (!demo.on || st.step !== "ask") return;
      await (del ? shatter() : archive());
      scheduleDemo(2000);
    }
    scheduleDemo(600);
  })();
</script>
</body>
</html>
