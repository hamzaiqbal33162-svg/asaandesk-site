<!doctype html>
<!-- Chill & Craft · Frostpane · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frostpane · frosted-glass B2B sales CRM with invoices</title>
<script>
  // Early theme pick: ?theme= wins, then the saved choice, then the system setting
  (function () { try { var q = new URLSearchParams(location.search).get('theme'), s = JSON.parse(localStorage.getItem('da-frostpane:theme') || 'null'); document.documentElement.dataset.theme = q === 'light' || q === 'dark' ? q : s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { } })();
</script>
<style>
/* ---------- Core kit styles: base, controls, layers, table, charts, board (themed by variables) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:14px/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-h,inherit);line-height:1.2}
p{margin:0}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
h1:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--panel-solid,var(--panel));color:var(--text);font-weight:600;font-size:13px;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-2,var(--muted));box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:var(--muted);transition:background .2s,color .2s,transform .12s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:30px;height:30px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.chip{min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;flex:none;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme=dark] .av{background:hsl(var(--h) 32% 27%);color:hsl(var(--h) 70% 84%)}
.av.lg{width:52px;height:52px;font-size:17px}
.row-acts{display:inline-flex;gap:2px}
kbd{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--hover)}
/* page entrance (dashboards may set --enter to their own keyframes) */
.in{animation:var(--enter,ccRise) .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px)}}
/* layers: modal, drawer, confirm, command search */
.layer{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim,rgba(10,12,20,.48));opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(540px,100%);max-height:min(90vh,780px);display:flex;flex-direction:column;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--rl,16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(14px) scale(.97);transition:opacity .25s,transform .32s cubic-bezier(.2,.8,.2,1)}
.layer.wide .sheet{width:min(860px,100%)}
.layer.open .scrim{opacity:1}
.layer.open .sheet{opacity:1;transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sheet-h h2{font-size:17px;overflow-wrap:anywhere}
.sheet-b{padding:4px 18px 18px;overflow:auto;overscroll-behavior:contain}
.sheet-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.layer.drawer{place-items:stretch end;padding:0}
.layer.drawer .sheet{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rl,16px) 0 0 var(--rl,16px);border-right:0;transform:translateX(60px)}
.layer.drawer.wide .sheet{width:min(640px,100%)}
.layer.drawer.open .sheet{transform:none}
.confirm-m{color:var(--muted)}
.layer.cmdk{place-items:start center;padding-top:12vh}
.layer.cmdk .sheet-h{padding-bottom:4px}
.cmd-in{width:100%;height:44px;padding:0 14px;border-radius:var(--ri,10px);border:1px solid var(--line);background:var(--field,transparent);outline:none;font-size:15px}
.cmd-in:focus{border-color:var(--accent)}
.cmd-l{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.cmd-l li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.cmd-l li small{margin-left:auto;color:var(--muted);font-size:11px}
.cmd-l li[aria-selected=true]{background:var(--hover);color:var(--accent)}
.cmd-empty{color:var(--muted)}
.cmd-k{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.layer.modal{place-items:end center;padding:0}.layer.modal .sheet{border-radius:var(--rl,16px) var(--rl,16px) 0 0;width:100%;transform:translateY(40px)}.layer.modal.open .sheet{transform:none}.layer.cmdk{place-items:start center;padding:10px}}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form.shake{animation:ccShake .35s}
@keyframes ccShake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.f{display:grid;gap:5px;grid-column:1/-1;min-width:0}
.f.half{grid-column:auto}
@media (max-width:520px){.f.half{grid-column:1/-1}}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,transparent);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.f [aria-invalid=true]{border-color:var(--bad)}
.f-err{color:var(--bad);font-size:11.5px}
.f-err:empty{display:none}
.f-chk label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}
.f-chk input{width:16px;height:16px;min-height:0;accent-color:var(--accent)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:150;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(12px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:none}
.t-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;flex:none}
.toast.bad .t-ic{background:var(--bad)}
.toast.warn .t-ic{background:var(--warn)}
.t-ic .ic{width:13px;height:13px}
.t-a{margin-left:auto;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0 0 0 8px}
/* tooltip */
#tip{position:fixed;left:0;top:0;z-index:160;pointer-events:none;padding:8px 10px;border-radius:9px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:12px;line-height:1.5;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:240px}
#tip.on{opacity:1;transform:none}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* popovers, menus, notifications */
.pop{position:fixed;z-index:120;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.4);padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.pop.on{opacity:1;transform:none}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:disabled{opacity:.45;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .sw{width:9px;height:9px;border-radius:3px;flex:none}
.menu-t{font-size:11px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.notes{width:min(320px,calc(100vw - 30px))}
.notes-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px}
.notes ul{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:9px;font-size:13px;color:var(--muted)}
.notes li .ic{margin-top:2px}
.notes li span{display:grid}
.notes li small{font-size:11px;opacity:.8}
.notes li.unread{color:var(--text);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.n-empty{justify-content:center}
[data-bell]{position:relative}
[data-bell][data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPing .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ccPing{from{transform:scale(0)}}
/* segmented control */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--rs,10px);background:var(--hover);gap:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);border-radius:calc(var(--rs,10px) - 2px);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--text)}
.seg-i{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:calc(var(--rs,10px) - 2px);background:var(--panel-solid,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s}
/* table */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.srch{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:var(--ri,9px);background:var(--field,transparent);color:var(--muted);flex:1 1 200px;max-width:340px;transition:border-color .2s,box-shadow .2s}
.srch input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--text);padding:6px 0}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:var(--tbl-min,640px)}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.th-b{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.si::after{content:"\2195";opacity:.35;font-size:11px}
th[aria-sort=ascending] .si::after{content:"\2191";opacity:1;color:var(--accent)}
th[aria-sort=descending] .si::after{content:"\2193";opacity:1;color:var(--accent)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{animation:ccRow .35s backwards;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes ccRow{from{opacity:0;transform:translateY(6px)}}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover{background:var(--hover)}
.tbl tr.click:focus-visible{outline-offset:-2px}
.cell-u{display:flex;align-items:center;gap:10px;min-width:0}
.cell-u b{display:block;font-weight:600}
.cell-u small{display:block;color:var(--muted);font-size:11.5px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pg-b{display:flex;gap:4px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);display:inline-grid;place-items:center;font-size:12px;transition:background .2s,transform .12s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current=page]{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{display:grid;justify-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty b{color:var(--text)}
/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid,var(--line));stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font,system-ui,sans-serif)}
.chart .xh{stroke:var(--muted);stroke-dasharray:3 3;opacity:.7}
.chart .dot{stroke:var(--panel-solid,var(--panel));stroke-width:2.5}
.chart .bcol{transition:opacity .2s}
.chart .bcol.dim{opacity:.4}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,.05,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.fade{animation:ccFade 1s .35s backwards}
@keyframes ccFade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.growx{transform-origin:0 50%;animation:ccGrowX .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrowX{from{transform:scaleX(0)}}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px}
.nodata{display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:13px;text-align:center}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-v{position:relative;width:var(--ds,160px);max-width:100%;flex:none}
.donut-t{stroke:var(--hover)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;display:block;line-height:1.1}
.donut-c span{font-size:11px;color:var(--muted)}
.donut .seg{transition:stroke-dasharray 1.1s cubic-bezier(.3,.7,.2,1),stroke-width .2s;cursor:pointer}
.donut .seg.on{stroke-width:15}
.dl{display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl-r{display:grid;grid-template-columns:10px 1fr auto 38px;gap:8px;align-items:center;cursor:default}
.dl-r i{width:10px;height:10px;border-radius:3px}
.dl-r small{color:var(--muted);text-align:right}
.gauge{position:relative;max-width:260px;margin:0 auto}
.g-track{stroke:var(--hover)}
.g-val{transition:stroke-dasharray 1.3s cubic-bezier(.3,.7,.2,1)}
.g-c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.g-c b{display:block;font-size:22px;line-height:1.1}
.g-c span{font-size:11px;color:var(--muted)}
.hb{display:grid;gap:11px}
.hb-t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.hb-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:inherit}
.hm{display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.hm-x{text-align:center}
.hm-y{padding-right:6px;white-space:nowrap}
.hm-c{height:20px;border-radius:4px;background:var(--hm,var(--accent));opacity:calc(.08 + var(--a) * .92);transition:transform .15s}
.hm-c:hover{transform:scale(1.15)}
.pop-in{animation:ccPop .5s backwards;animation-delay:calc(var(--j) * 22ms)}
@keyframes ccPop{from{opacity:0;transform:scale(.4)}}
.fn{display:grid;gap:9px}
.fn-r{display:grid;gap:3px}
.fn-r small{font-size:11px;color:var(--muted)}
.fn-bar{width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs,9px);color:#fff;font-size:12.5px;min-width:0;overflow:hidden;white-space:nowrap}
.fn-bar span{overflow:hidden;text-overflow:ellipsis}
.wipe{animation:ccWipe 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes ccWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.spark{min-width:60px}
/* board */
.board{display:grid;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start;scrollbar-width:thin}
.board-y{grid-auto-flow:column;grid-auto-columns:minmax(min(262px,82vw),1fr)}
.board-x{grid-auto-flow:row}
.lane{min-width:0;display:flex;flex-direction:column;transition:background .2s,box-shadow .2s}
.lane-l{display:grid;gap:10px;min-height:84px;align-content:start;padding:2px}
.board-x .lane-l{grid-auto-flow:column;grid-auto-columns:minmax(220px,240px);overflow-x:auto;align-content:stretch;padding-bottom:6px}
.dcard{position:relative;user-select:none;-webkit-user-select:none;cursor:grab;transition:box-shadow .2s,transform .2s,opacity .2s}
.dcard:active{cursor:grabbing}
.dmove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:0;background:var(--hover);color:var(--muted);opacity:0;touch-action:none;cursor:grab;transition:opacity .2s,background .2s}
.dcard:hover .dmove,.dcard:focus-within .dmove,.dmove[aria-expanded=true]{opacity:1}
@media (hover:none){.dmove{opacity:1}}
.dsrc{opacity:.3;outline:2px dashed var(--lc,var(--accent));outline-offset:-2px}
.dghost{position:fixed!important;z-index:140;pointer-events:none;margin:0;box-shadow:0 26px 50px -14px rgba(0,0,0,.45);transform:rotate(var(--tilt,2.5deg)) scale(1.04);transition:transform .2s}
.dghost.drop{transform:none;transition:translate .18s ease-out,transform .18s}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.lane.over{background:color-mix(in srgb,var(--lc,var(--accent)) 10%,transparent)}
.lane-empty{display:grid;place-items:center;min-height:72px;border:1.5px dashed var(--line);border-radius:var(--rm,12px);color:var(--muted);font-size:12px;padding:8px;text-align:center}
.burst{position:fixed;inset:0;width:100vw;height:100vh;z-index:170;pointer-events:none}
/* reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
/* ================= Frostpane look: one frosted window floating over a cool aurora ================= */
:root{--font:"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;--bg:#e6edfb;--glass:rgba(255,255,255,.46);--glass-2:rgba(255,255,255,.68);--glass-3:rgba(255,255,255,.3);--panel:var(--glass);--panel-solid:#f4f7ff;--text:#18213d;--muted:#5f6b8f;--line:rgba(80,100,160,.16);--line-2:rgba(80,100,160,.3);--hover:rgba(90,110,200,.09);--field:rgba(255,255,255,.55);--accent:#4f5bff;--on-accent:#fff;--ok:#0e9f7e;--warn:#d38a0b;--bad:#e0435f;--c1:#4f5bff;--c2:#16b6a0;--c3:#a259ff;--c4:#ff8a4c;--c5:#2aa7e8;--c6:#97a2c4;--tip-bg:#18213d;--tip-text:#fff;--a1:#9fd8ff;--a2:#c7b2ff;--a3:#a5f3dc;--a4:#ffd2e6;--rl:22px;--rb:12px;--ri:12px;--rs:12px;--rm:16px;--edge:rgba(255,255,255,.75);--enter:fpIn}
[data-theme=dark]{--bg:#060918;--glass:rgba(22,30,62,.42);--glass-2:rgba(28,38,78,.72);--glass-3:rgba(18,24,52,.36);--panel-solid:#141b3a;--text:#eaf0ff;--muted:#99a6d1;--line:rgba(160,180,255,.12);--line-2:rgba(160,180,255,.24);--hover:rgba(140,160,255,.1);--field:rgba(10,14,34,.5);--accent:#7c86ff;--on-accent:#060918;--ok:#3ee0b6;--warn:#ffc35c;--bad:#ff6f88;--c1:#7c86ff;--c2:#3ee0c4;--c3:#c08bff;--c4:#ffa070;--c5:#5cc8ff;--c6:#58628a;--tip-bg:#eaf0ff;--tip-text:#060918;--a1:#1b6dff;--a2:#7a3dff;--a3:#14c4a3;--a4:#ff3d9a;--edge:rgba(255,255,255,.14)}
@keyframes fpIn{from{opacity:0;filter:blur(14px);transform:scale(1.025)}}
body{background:var(--bg);overflow-x:hidden}
/* aurora backdrop: still by default (calm CPU), hue follows pipeline health */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:hue-rotate(var(--hue,0deg));transition:filter 2.5s ease}
.aurora i{position:absolute;border-radius:50%;opacity:.85}
.aurora .r1{width:90vmax;height:40vmax;left:-20vmax;top:-12vmax;background:radial-gradient(closest-side,var(--a1),transparent);transform:rotate(-14deg)}
.aurora .r2{width:80vmax;height:36vmax;right:-24vmax;top:16vh;background:radial-gradient(closest-side,var(--a2),transparent);transform:rotate(18deg)}
.aurora .r3{width:70vmax;height:34vmax;left:10vw;bottom:-14vmax;background:radial-gradient(closest-side,var(--a3),transparent);transform:rotate(-6deg)}
.aurora .r4{width:40vmax;height:40vmax;left:44vw;top:30vh;background:radial-gradient(closest-side,var(--a4),transparent);opacity:.45}
.aurora .rise{animation:fpRise 7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fpRise{from{opacity:0;transform:translateY(12vh) rotate(-14deg)}}
/* the window */
.win{position:relative;z-index:1;margin:18px;min-height:calc(100vh - 36px);display:grid;grid-template-columns:232px minmax(0,1fr);border-radius:30px;background:var(--glass-3);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--edge);box-shadow:0 40px 90px -40px rgba(20,30,90,.55);overflow:clip}
.side{position:sticky;top:0;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:18px;padding:18px 14px;border-right:1px solid var(--line);background:var(--glass-3)}
.lights{display:flex;gap:7px;padding:2px 6px 4px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff6159}.lights i:nth-child(2){background:#ffbd2e}.lights i:nth-child(3){background:#28c941}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;padding:0 6px}
nav[data-nav]{position:relative;display:grid;gap:2px}
nav[data-nav] .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 12px 6px}
nav[data-nav] a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:550;font-size:14px;transition:color .25s}

nav[data-nav] a[aria-current=page]{color:var(--text)}
.glow{position:absolute;left:0;right:0;top:0;border-radius:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--c3) 22%,transparent));border:1px solid var(--edge);box-shadow:0 8px 24px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35);opacity:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1),height .3s}
.health{margin-top:auto;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge)}

.health .bar{height:6px;border-radius:9px;background:var(--hover);overflow:hidden}
.health .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c4),var(--c2));transition:width 1.4s cubic-bezier(.3,.8,.3,1)}
/* top bar inside the window */
.main{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--glass-3);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.top h2{font-size:15px;font-weight:600}
.top .srch-b{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--edge);background:var(--glass);color:var(--muted);min-width:240px;text-align:left}

.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card,.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 18px 40px -26px rgba(20,30,90,.5)}
[data-theme=dark] .card,[data-theme=dark] .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px -24px rgba(0,0,0,.7)}
.card{border-radius:var(--rl);padding:18px;min-width:0;transition:transform .3s,box-shadow .3s,background .3s}

.card-h h2{font-size:15px;font-weight:650}
.btn{border-color:var(--edge);background:var(--glass)}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--c3));border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
.chip{border-color:var(--edge);background:var(--glass)}
.seg{background:var(--glass-3);border:1px solid var(--edge)}
.seg-i{background:var(--glass-2);box-shadow:0 4px 12px -6px rgba(20,30,90,.5)}
.sheet,.pop{background:var(--glass-2);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border-color:var(--edge)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.kpi{display:grid;gap:6px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;width:120px;height:120px;right:-40px;top:-50px;border-radius:50%;background:radial-gradient(closest-side,var(--kc),transparent);opacity:.55}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.kpi small .up{color:var(--ok);font-weight:700}
/* health rings */
.hring{position:relative;width:46px;height:46px;flex:none}
.hring svg{transform:rotate(-90deg)}
.hring circle{fill:none;stroke-width:5}
.hring .t{stroke:var(--hover)}
.hring .v{stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.3,.7,.2,1)}
.hring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:700}
/* deal board: glass columns with glowing chips */
.lane{border-radius:20px;padding:10px;background:var(--glass-3);border:1px solid var(--edge)}
.lane-h{display:flex;align-items:center;gap:8px;padding:6px 6px 12px}
.lane-h b{font-weight:650}
.lane-h .cnt{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--glass-2);color:var(--muted)}
.lane-h small{margin-left:auto;font-weight:700;font-size:12.5px}
.lane-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lc);box-shadow:0 0 10px var(--lc)}
.dcard{border-radius:16px;padding:12px;display:grid;gap:7px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 0 var(--lc)}
.dcard:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px -4px var(--lc);transform:translateY(-2px)}
.dcard b{font-weight:650;padding-right:28px;line-height:1.25}
.dcard .co{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.dcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dcard .v{font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.dcard .p{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--lc) 20%,transparent)}
.dcard .av{width:20px;height:20px;font-size:8.5px}
.dmove{background:var(--glass-2)}
.dghost{--tilt:1.5deg;box-shadow:0 0 34px -2px var(--accent),0 30px 50px -20px rgba(0,0,0,.5)!important;background:var(--glass-2)!important}
.lane.over{background:color-mix(in srgb,var(--lc) 14%,var(--glass-3));box-shadow:0 0 24px -8px var(--lc)}
/* invoices split view */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.pv{position:sticky;top:84px}
.inv-paper{position:relative;border-radius:18px;padding:22px;background:var(--panel-solid);color:var(--text);overflow:hidden;border:1px solid var(--edge)}
.inv-paper h3{font-size:20px;font-weight:700}
.inv-paper .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:6px 0 14px}
.inv-paper table{width:100%;border-collapse:collapse;font-size:13px}
.inv-paper th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line-2)}
.inv-paper td{padding:8px 4px;border-bottom:1px solid var(--line)}
.inv-paper .sum{display:grid;justify-content:end;gap:3px;margin-top:10px;font-size:13px}
.inv-paper .sum div{display:flex;justify-content:space-between;gap:30px}
.inv-paper .sum .g{font-size:19px;font-weight:800}
.payb{margin-top:14px}
.payb .track{height:10px;border-radius:99px;background:var(--hover);overflow:hidden}
.payb .track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c5),var(--c2));transition:width 1.1s cubic-bezier(.3,.8,.3,1)}
.payb .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.ribbon{position:absolute;right:-48px;top:22px;width:180px;padding:6px 0;text-align:center;transform:rotate(38deg);background:linear-gradient(90deg,var(--c2),var(--c5));color:#fff;font-weight:800;letter-spacing:.2em;font-size:13px;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.ribbon::after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg)}
.ribbon.shine::after{animation:fpShine 1.2s .2s ease-in-out}
@keyframes fpShine{to{left:220px}}
.ribbon.drop{animation:fpDrop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes fpDrop{from{transform:rotate(38deg) translateY(-80px);opacity:0}}
tr.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)!important}
/* line items */
.li{display:grid;gap:8px;margin:4px 0 10px}
.li-r{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 34px;gap:6px;align-items:center}
.li-r.h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.li-r select,.li-r input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--field);padding:0 8px;min-width:0}
.li-r input[aria-invalid=true]{border-color:var(--bad)}
.li-tot{display:grid;justify-content:end;gap:3px;font-size:13px}
.li-tot div{display:flex;justify-content:space-between;gap:24px}
.li-tot .g{font-size:18px;font-weight:800;color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.kv dt{font-size:11.5px;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:650}
.big{display:block;font-size:30px;font-weight:700;margin:2px 0 12px;letter-spacing:-.02em}
.stg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.stg button{flex:1 1 70px;padding:8px 4px;border-radius:10px;border:1px solid var(--edge);background:var(--glass);font-size:11.5px;font-weight:650;color:var(--muted)}
.stg button[aria-pressed=true]{background:var(--sc);color:#fff;border-color:transparent;box-shadow:0 0 16px -4px var(--sc)}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lst li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--glass-3);border:1px solid var(--line);font-size:13px}
.lst li>button{all:unset;display:flex;align-items:center;gap:10px;width:100%;cursor:pointer}
.lst li>button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.lst .t{flex:1;min-width:0}.lst .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lst .t small{color:var(--muted)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block}.set-row small{color:var(--muted);font-size:12px}
.tg{position:relative;width:46px;height:26px;border-radius:99px;border:1px solid var(--edge);background:var(--glass-3);padding:0;flex:none;transition:background .3s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tg[aria-checked=true]{background:linear-gradient(120deg,var(--accent),var(--c3))}
.tg[aria-checked=true]::after{transform:translateX(20px)}
/* responsive */
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2,.split{grid-template-columns:minmax(0,1fr)}.pv{position:static}}
@media (max-width:880px){
  .win{margin:0;border-radius:0;grid-template-columns:minmax(0,1fr);border:0;min-height:100vh}
  .side{position:fixed;left:10px;top:10px;bottom:10px;height:auto;width:250px;z-index:60;border-radius:24px;border:1px solid var(--edge);background:var(--glass-2);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);transform:translateX(-110%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .nav-open .side{transform:none}
  .scrim-nav{position:fixed;inset:0;z-index:55;background:rgba(6,9,24,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .nav-open .scrim-nav{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-grid!important}
  .top{padding:10px 14px}
  .top .srch-b{min-width:0}
  main{padding:16px 14px 36px}
}
@media (max-width:600px){.top .srch-b span,.top .srch-b kbd,.top h2{display:none}.top .srch-b{width:38px;padding:0;justify-content:center}.page-h h1{font-size:25px}.kpi b{font-size:22px}.kv{grid-template-columns:1fr}.li-r{grid-template-columns:minmax(0,1fr) 54px 78px 30px}.card{padding:14px}}
@media (max-width:400px){.g-kpi{grid-template-columns:minmax(0,1fr)}}
</style>

<body>
<div class="aurora" id="aurora" aria-hidden="true"><i class="r1 rise"></i><i class="r2 rise"></i><i class="r3 rise"></i><i class="r4"></i></div>
<div class="win">

    <nav data-nav aria-label="Main">
      <span class="glow" aria-hidden="true"></span>
      <a href="#/overview">__I_grid__<span>Overview</span></a>
      <a href="#/deals">__I_board__<span>Deals</span></a>
      <span class="grp" aria-hidden="true">Customers</span>

<script>
/* ================= Core kit: router, charts, table, board, modal, toast =================
   Small helpers shared by this dashboard. Everything below is plain JS, no libraries. */
'use strict';

// ---------- 1. Tiny DOM + math helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const uid = (p = 'i') => p + Math.random().toString(36).slice(2, 9);

  out.addEventListener('click', e => { const i = e.target.closest('[data-inv]'); if (i) { ST.sel = i.dataset.inv; location.hash = '#/invoices'; } if (e.target.closest('[data-nd]')) newDeal(); if (e.target.closest('[data-nq]')) quoteForm(); });
}

// ---------- Page: Deals ----------
function pDeals(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Deals</h1><p>Drag a chip across the glass. Closing a deal offers to quote it.</p></div><div class="ph-a"><button type="button" class="btn primary" data-nd>${ic('plus', 16)} New deal</button></div></div><div id="bd" data-in></div>`;
  board($('#bd', out), {
    stages: STAGES, list: () => DB.deals, label: d => d.title, onOpen: openDeal,
    head: (s, l) => `<b>${s.name}</b><span class="cnt">${l.length}</span><small>${fmt.mshort(sum(l.map(d => d.value)))}</small>`,
    card: d => `<b>${esc(d.title)}</b><span class="co">${avatar(d.owner)}${esc(d.account)}</span><span class="row"><span class="v">${fmt.money(d.value)}</span><span class="p">${stage(d.stage).p}%</span></span>`,
    onMove: (d, from, to) => { moved(d, from, to); if (to === 'won' && from !== 'won') { const c = $(`.dcard[data-id="${d.id}"]`, out), r = c && c.getBoundingClientRect(); burst(r && r.width ? r.left + r.width / 2 : innerWidth / 2, r && r.width ? r.top : 240, ['#4f5bff', '#16b6a0', '#a259ff', '#9fd8ff']); } }
  });
  out.addEventListener('click', e => { if (e.target.closest('[data-nd]')) newDeal(); });
}

// ---------- Page: Accounts ----------
function pAccounts(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Accounts</h1><p>Business customers with seats, recurring revenue and a health score.</p></div><div class="ph-a"><button type="button" class="btn primary" data-add>${ic('plus', 16)} Add account</button></div></div><section class="card" data-in><div id="at"></div></section>`;
  const fields = [{ name: 'name', label: 'Account name', required: true }, { name: 'industry', label: 'Industry', type: 'select', options: IND, half: true }, { name: 'city', label: 'City', required: true, half: true }, { name: 'seats', label: 'Seats', type: 'number', min: 1, required: true, half: true }, { name: 'mrr', label: 'Monthly recurring (USD)', type: 'number', min: 0, required: true, half: true }, { name: 'health', label: 'Health (0–100)', type: 'number', min: 0, max: 100, required: true, half: true }, { name: 'owner', label: 'Owner', type: 'select', options: DB.team, half: true }];
  const C = crud($('#at', out), {
    id: 'fp-acct', list: () => DB.accounts, rows: () => DB.accounts, fields, addLabel: 'Add account', ph: 'Search accounts…', search: ['name', 'industry', 'city', 'owner'], sort: 'mrr', dir: -1, min: 760, chips: { k: 'industry', label: 'Industry', options: IND },
    cols: [{ k: 'name', label: 'Account', render: a => `<div class="cell-u">${ring(a.health, hcol(a.health))}<div><b>${esc(a.name)}</b><small>${esc(a.city)}</small></div></div>`, val: a => a.name }, { k: 'industry', label: 'Industry' }, { k: 'seats', label: 'Seats', num: true }, { k: 'mrr', label: 'MRR', num: true, render: a => fmt.money(a.mrr) }, { k: 'health', label: 'Health', num: true }, { k: 'owner', label: 'Owner' }, { k: 'x', label: '', sort: false, render: rowActs }],
    detail: a => { const inv = DB.invoices.filter(i => i.account === a.name); return `<div style="display:flex;gap:14px;align-items:center">${ring(a.health, hcol(a.health))}<b class="big" style="margin:0">${fmt.money(a.mrr)}<small style="font-size:13px;color:var(--muted)"> / month</small></b></div><dl class="kv" style="margin-top:14px"><div><dt>Industry</dt><dd>${esc(a.industry)}</dd></div><div><dt>Seats</dt><dd>${a.seats}</dd></div><div><dt>City</dt><dd>${esc(a.city)}</dd></div><div><dt>Owner</dt><dd>${esc(a.owner)}</dd></div></dl><h3 style="font-size:14px;margin-bottom:8px">Invoices (${inv.length})</h3><ul class="lst">${inv.map(i => `<li><span class="t"><b>${esc(i.no)}</b><small>${st(i)}</small></span><b>${fmt.money(totT(i))}</b></li>`).join('') || '<li>No invoices yet.</li>'}</ul><h3 style="font-size:14px;margin:14px 0 8px">People</h3><ul class="lst">${DB.contacts.filter(c => c.account === a.name).map(c => `<li>${avatar(c.name)}<span class="t"><b>${esc(c.name)}</b><small>${esc(c.title)}</small></span></li>`).join('') || '<li>No contacts yet.</li>'}</ul>`; },
    onChange: save
  });
  $('[data-add]', out).onclick = C.add;
}

// ---------- Page: Contacts ----------
function pContacts(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Contacts</h1><p>Buyers, approvers and IT leads at each account.</p></div><div class="ph-a"><button type="button" class="btn primary" data-add>${ic('plus', 16)} Add contact</button></div></div><section class="card" data-in><div id="ct"></div></section>`;
  const fields = [{ name: 'name', label: 'Name', required: true, half: true }, { name: 'title', label: 'Job title', half: true }, { name: 'account', label: 'Account', type: 'select', options: DB.accounts.map(a => a.name), half: true }, { name: 'email', label: 'Email', type: 'email', required: true, half: true }, { name: 'phone', label: 'Phone', type: 'tel' }];
  const C = crud($('#ct', out), {
    id: 'fp-ct', list: () => DB.contacts, rows: () => DB.contacts, fields, addLabel: 'Add contact', ph: 'Search contacts…', search: ['name', 'account', 'email', 'title'], sort: 'name', dir: 1, min: 700,
    cols: [{ k: 'name', label: 'Name', render: c => `<div class="cell-u">${avatar(c.name)}<div><b>${esc(c.name)}</b><small>${esc(c.title || '')}</small></div></div>` }, { k: 'account', label: 'Account' }, { k: 'email', label: 'Email' }, { k: 'phone', label: 'Phone' }, { k: 'x', label: '', sort: false, render: rowActs }],
    detail: c => `<p class="muted">${esc(c.title || '')} · ${esc(c.account)}</p><dl class="kv" style="margin-top:12px"><div><dt>Email</dt><dd>${esc(c.email)}</dd></div><div><dt>Phone</dt><dd>${esc(c.phone || '—')}</dd></div></dl><button type="button" class="btn" data-q>${ic('file', 16)} Quote for ${esc(c.account)}</button>`,
    onOpen: (c, D) => { $('[data-q]', D.el).onclick = () => { D.close(); quoteForm({ account: c.account }); }; },
    onChange: save
  });

}

// ---------- Page: Quotes ----------
function pQuotes(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Quotes</h1><p>Price it, send it, then turn an accepted quote into an invoice in one click.</p></div><div class="ph-a"><button type="button" class="btn primary" data-nq>${ic('plus', 16)} New quote</button></div></div><section class="card" data-in><div id="qt"></div></section>`;
  const T = table($('#qt', out), {
    id: 'fp-q', rows: () => DB.quotes.map(q => Object.assign(q, { total: totT(q) })), ph: 'Search quotes…', search: ['no', 'account'], sort: 'date', dir: -1, min: 720, chips: { k: 'status', label: 'Status', options: ['Draft', 'Sent', 'Accepted', 'Declined', 'Invoiced'] },
    cols: [{ k: 'no', label: 'Quote', render: q => `<b>${esc(q.no)}</b>` }, { k: 'account', label: 'Account' }, { k: 'date', label: 'Date', render: q => fmt.date(q.date) }, { k: 'total', label: 'Total', num: true, render: q => fmt.money(q.total) }, { k: 'status', label: 'Status', render: q => pill(q.status, q.status === 'Accepted' || q.status === 'Invoiced' ? 'ok' : q.status === 'Declined' ? 'bad' : q.status === 'Sent' ? 'acc' : '') }, { k: 'x', label: '', sort: false, render: q => `<span class="row-acts">${q.status !== 'Invoiced' && q.status !== 'Declined' ? `<button type="button" class="btn sm" data-act="conv">${ic('receipt', 14)} Invoice</button>` : ''}</span>` }],
    onRow: q => {
      const D = drawer(q.no, `<span class="muted">${esc(q.account)} · ${fmt.dateY(q.date)}</span><b class="big">${fmt.money(totT(q))}</b><ul class="lst">${q.lines.map(l => `<li><span class="t"><b>${esc(l.name)}</b><small>${l.qty} × ${fmt.money(l.price)}</small></span><b>${fmt.money(l.qty * l.price)}</b></li>`).join('')}</ul><div class="stg" role="group" aria-label="Status" style="margin-top:14px">${['Draft', 'Sent', 'Accepted', 'Declined'].map(s => `<button type="button" data-qs="${s}" aria-pressed="${q.status === s}" style="--sc:${s === 'Declined' ? '#e0435f' : s === 'Accepted' ? '#16b6a0' : '#4f5bff'}">${s}</button>`).join('')}</div>`, `<button type="button" class="btn ghost" data-del>${ic('trash', 16)} Delete</button><button type="button" class="btn" data-edit>${ic('edit', 16)} Edit</button><button type="button" class="btn primary" data-conv${q.status === 'Invoiced' ? ' disabled' : ''}>${ic('receipt', 16)} Convert to invoice</button>`);
      D.el.addEventListener('click', e => { const b = e.target.closest('[data-qs]'); if (!b) return; q.status = b.dataset.qs; save(); $$('[data-qs]', D.el).forEach(x => x.setAttribute('aria-pressed', String(x === b))); toast(`${q.no} marked ${q.status.toLowerCase()}`); T.draw(); });
      $('[data-conv]', D.el).onclick = () => { D.close(); toInvoice(q); };
      $('[data-edit]', D.el).onclick = () => { D.close(); quoteForm({}, q); };
      $('[data-del]', D.el).onclick = () => { D.close(); ask(`Delete ${q.no}?`).then(ok => { if (!ok) return; const i = DB.quotes.indexOf(q); DB.quotes.splice(i, 1); save(); T.draw(); toast('Quote deleted', 'ok', { label: 'Undo', run: () => { DB.quotes.splice(i, 0, q); save(); T.draw(); } }); }); };
    },
    onAct: (a, q) => { if (a === 'conv') toInvoice(q); }
  });
  out.addEventListener('click', e => { if (e.target.closest('[data-nq]')) quoteForm(); });
}

// ---------- Page: Invoices (split view, partial payments, shine ribbon) ----------
function pInvoices(out) {
  const all = DB.invoices, owed = sum(all.map(i => totT(i) - paid(i)));
  out.innerHTML = `<div class="page-h"><div><h1>Invoices</h1><p>${fmt.money(owed)} still to collect. Pick an invoice to preview it and record a payment.</p></div><div class="ph-a"><button type="button" class="btn" data-remind>${ic('send', 16)} Remind overdue</button></div></div><div class="split"><section class="card" data-in><div id="it"></div></section><section class="pv" id="pv" aria-live="polite" data-in></section></div>`;
  const preview = (fresh) => {
    const i = DB.invoices.find(x => x.id === ST.sel) || DB.invoices[0]; if (!i) { $('#pv', out).innerHTML = `<div class="card empty">${ic('receipt', 24)}<b>No invoices</b></div>`; return; } ST.sel = i.id;
    $$('tr.click', out).forEach(tr => tr.classList.toggle('sel', tr.dataset.id === i.id));
    const t = totT(i), p = paid(i), s = st(i);
    $('#pv', out).innerHTML = `<div class="inv-paper card">${s === 'Paid' ? `<div class="ribbon${fresh ? ' drop shine' : ''}">PAID</div>` : ''}<h3>${esc(i.no)}</h3><div class="meta"><span>Bill to <b style="color:var(--text)">${esc(i.account)}</b></span><span>Issued ${fmt.date(i.date)} · Due ${fmt.date(i.due)}</span></div><table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>${i.lines.map(l => `<tr><td>${esc(l.name)}</td><td class="num">${l.qty}</td><td class="num">${fmt.money(l.qty * l.price)}</td></tr>`).join('')}</tbody></table><div class="sum"><div><span>Subtotal</span><span>${fmt.money(subT(i))}</span></div><div><span>Tax ${DB.co.tax}%</span><span>${fmt.money(t - subT(i))}</span></div><div class="g"><span>Total</span><span>${fmt.money(t)}</span></div></div>
      <div class="payb"><div class="track"><i style="width:0" data-w="${Math.min(100, p / t * 100)}"></i></div><div class="lbl"><span>${fmt.money(p)} paid</span><span>${fmt.money(Math.max(0, t - p))} left</span></div></div>
      ${(i.payments || []).length ? `<ul class="lst" style="margin-top:12px">${i.payments.map(x => `<li><span class="t"><b>${fmt.money(x.amt)}</b><small>${esc(x.method)} · ${fmt.date(x.at)}</small></span></li>`).join('')}</ul>` : ''}
      <div class="ph-a" style="margin-top:14px"><button type="button" class="btn primary" data-pay${s === 'Paid' ? ' disabled' : ''}>${ic('coin', 16)} Record payment</button><button type="button" class="btn" data-print>${ic('print', 16)} Print</button><button type="button" class="btn ghost" data-delinv>${ic('trash', 16)} Delete</button></div></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => { const b = $('.payb i', out); if (b) b.style.width = b.dataset.w + '%'; }));
  };
  const T = table($('#it', out), {
    id: 'fp-inv', rows: () => DB.invoices.map(i => Object.assign(i, { status: st(i), total: totT(i) })), ph: 'Search invoices…', search: ['no', 'account'], sort: 'date', dir: -1, min: 520, pageSize: 7, chips: { k: 'status', label: 'Status', options: ['Open', 'Part paid', 'Overdue', 'Paid'] },
    cols: [{ k: 'no', label: 'Invoice', render: i => `<b>${esc(i.no)}</b><br><small class="muted">${esc(i.account)}</small>` }, { k: 'total', label: 'Total', num: true, render: i => fmt.money(i.total) }, { k: 'due', label: 'Due', render: i => fmt.date(i.due) }, { k: 'status', label: 'Status', render: i => pill(i.status, i.status === 'Paid' ? 'ok' : i.status === 'Overdue' ? 'bad' : i.status === 'Part paid' ? 'warn' : 'acc') }],
    onRow: i => { ST.sel = i.id; preview(); if (innerWidth < 1180) $('#pv', out).scrollIntoView({ behavior: RM() ? 'auto' : 'smooth', block: 'start' }); },
    onDraw: () => setTimeout(() => $$('tr.click', out).forEach(tr => tr.classList.toggle('sel', tr.dataset.id === ST.sel)), 0)
  });
  preview();
  out.addEventListener('click', e => {
    const i = DB.invoices.find(x => x.id === ST.sel);
    if (e.target.closest('[data-pay]') && i) { const left = totT(i) - paid(i); form({ title: 'Record payment · ' + i.no, submit: 'Record', fields: [{ name: 'amt', label: 'Amount (USD)', type: 'number', min: 1, max: left, required: true, half: true }, { name: 'method', label: 'Method', type: 'select', options: ['Bank transfer', 'Card', 'Cheque'], half: true }], values: { amt: left, method: 'Bank transfer' }, onSubmit: v => { (i.payments = i.payments || []).push({ amt: v.amt, method: v.method, at: Date.now() }); save(); const done = st(i) === 'Paid'; toast(done ? `${i.no} fully paid` : `${fmt.money(v.amt)} recorded`); if (done) note(`${i.account} settled ${i.no}`, 'win', true); T.draw(); preview(done); } }); }
    if (e.target.closest('[data-print]')) { toast('Opening the print dialog'); setTimeout(() => { try { print(); } catch (er) { } }, 250); }
    if (e.target.closest('[data-delinv]') && i) ask(`Delete ${i.no}?`).then(ok => { if (!ok) return; const k = DB.invoices.indexOf(i); DB.invoices.splice(k, 1); ST.sel = null; save(); T.draw(); preview(); toast('Invoice deleted', 'ok', { label: 'Undo', run: () => { DB.invoices.splice(k, 0, i); ST.sel = i.id; save(); T.draw(); preview(); } }); });
    if (e.target.closest('[data-remind]')) { const n = DB.invoices.filter(x => st(x) === 'Overdue').length; toast(n ? `Reminders sent for ${n} overdue invoices` : 'Nothing is overdue', n ? 'ok' : 'warn'); }
  });
}

// ---------- Page: Reports ----------
function pReports(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Reports</h1><p>Bookings, collections and account health.</p></div></div>
  <section class="grid g-2"><article class="card"><div class="card-h"><h2>Bookings by month</h2></div><div id="r1"></div></article><article class="card"><div class="card-h"><h2>Revenue by product</h2></div><div id="r2"></div></article></section>
  <section class="grid g-3"><article class="card"><div class="card-h"><h2>Days to pay</h2></div><div id="r3"></div></article><article class="card"><div class="card-h"><h2>Health by industry</h2></div><div id="r4"></div></article><article class="card"><div class="card-h"><h2>Quote win rate</h2></div><div id="r5"></div></article></section>`;
  barChart($('#r1', out), { labels: monthsBack(12), height: 230, fmt: fmt.money, yfmt: fmt.mshort, series: [{ name: 'Booked', data: DB.booked, color: '--c1' }], label: 'Bookings by month' });
  hbars($('#r2', out), DB.catalog.map(k => ({ label: k.name, value: sum(DB.invoices.flatMap(i => i.lines).filter(l => l.item === k.id).map(l => l.qty * l.price)) })).sort((a, b) => b.value - a.value), { fmt: fmt.mshort, ci: 2 });
  const pays = DB.invoices.filter(i => (i.payments || []).length).map(i => Math.max(0, Math.round((i.payments[0].at - i.date) / DAY)));
  barChart($('#r3', out), { labels: ['0–7', '8–14', '15–21', '22–30', '30+'], height: 190, series: [{ name: 'Invoices', data: [[0, 7], [8, 14], [15, 21], [22, 30], [31, 999]].map(([a, b]) => pays.filter(d => d >= a && d <= b).length), color: '--c5' }], label: 'Days to pay' });
  hbars($('#r4', out), IND.map(n => { const l = DB.accounts.filter(a => a.industry === n); return { label: n, value: l.length ? Math.round(sum(l.map(a => a.health)) / l.length) : 0, color: '' }; }), { fmt: v => v + ' / 100', ci: 1 });
  const acc = DB.quotes.filter(q => q.status === 'Accepted' || q.status === 'Invoiced').length, dec = DB.quotes.filter(q => q.status === 'Declined').length;
  gauge($('#r5', out), { value: acc, max: Math.max(1, acc + dec), text: Math.round(acc / Math.max(1, acc + dec) * 100) + '%', sub: `${acc} accepted · ${dec} declined`, label: 'Quote win rate', color: '--c2' });
}

// ---------- Page: Settings ----------
function pSettings(out) {
  const cf = [{ name: 'name', label: 'Company name', required: true }, { name: 'email', label: 'Billing email', type: 'email', required: true }, { name: 'tax', label: 'Tax (%)', type: 'number', min: 0, max: 30, required: true, half: true }, { name: 'terms', label: 'Payment terms (days)', type: 'number', min: 0, max: 120, required: true, half: true }];
  out.innerHTML = `<div class="page-h"><div><h1>Settings</h1><p>Billing details, automations and the glass.</p></div></div><section class="grid g-2"><article class="card"><div class="card-h"><h2>Billing</h2></div><form class="form" id="cf" novalidate>${cf.map(f => fieldHtml(f, DB.co[f.name], 'cf')).join('')}<div class="f"><button type="submit" class="btn primary" style="justify-self:start">Save billing</button></div></form></article>
  <article class="card"><div class="card-h"><h2>Automations</h2></div>${[['auto', 'Auto-remind overdue', 'Send a polite note 3 days after the due date'], ['wins', 'Closed-won alerts', 'Ring the bell when a deal closes'], ['weekly', 'Weekly pipeline email', 'Monday 8 am summary']].map(([k, t, s]) => `<div class="set-row"><div><b id="fl_${k}">${t}</b><small>${s}</small></div><button type="button" class="tg" role="switch" aria-checked="${!!DB.prefs[k]}" aria-labelledby="fl_${k}" data-pr="${k}"></button></div>`).join('')}<div class="set-row"><div><b>Theme</b><small>Frost by day, aurora by night</small></div>${seg('Theme', [{ v: 'light', l: 'Frost' }, { v: 'dark', l: 'Aurora' }], document.documentElement.dataset.theme)}</div><div class="set-row"><div><b>Reset demo data</b><small>Restore the sample IT company</small></div><button type="button" class="btn danger sm" data-reset>Reset</button></div></article></section>`;
  const fm = $('#cf', out);
  fm.addEventListener('submit', e => { e.preventDefault(); const v = readForm(fm, cf), er = checkForm(cf, v); cf.forEach(f => { const el = fm.elements.namedItem(f.name); if (er[f.name]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); $('#cf_' + f.name + '_e', out).textContent = er[f.name] || ''; }); if (Object.keys(er).length) return; Object.assign(DB.co, v); save(); toast('Billing saved'); });
  segBind(out, v => { store.set(KEY + ':theme', v); applyTheme(v); });
  out.addEventListener('click', e => { const t = e.target.closest('[data-pr]'); if (t) { const k = t.dataset.pr; DB.prefs[k] = !DB.prefs[k]; t.setAttribute('aria-checked', String(DB.prefs[k])); save(); toast('Saved'); } if (e.target.closest('[data-reset]')) ask('Reset all demo data?', { ok: 'Reset' }).then(ok => { if (!ok) return; DB = seed(); ST.sel = null; save(); APP.refresh(); toast('Demo data restored'); }); });
}

// ---------- Start ----------
health();
const APP = startApp({
  key: KEY, name: 'Frostpane', def: 'overview', outlet: $('#main'), nav: $('[data-nav]'), marker: $('.glow'),
  pages: { overview: { title: 'Overview', icon: 'grid', render: pOverview }, deals: { title: 'Deals', icon: 'board', render: pDeals }, accounts: { title: 'Accounts', icon: 'building', render: pAccounts }, contacts: { title: 'Contacts', icon: 'users', render: pContacts }, quotes: { title: 'Quotes', icon: 'file', render: pQuotes }, invoices: { title: 'Invoices', icon: 'receipt', render: pInvoices }, reports: { title: 'Reports', icon: 'pie', render: pReports }, settings: { title: 'Settings', icon: 'sliders', render: pSettings } },
  onRoute: () => { $('#tTitle').textContent = document.title.split(' · ')[0]; },
  notes: [['Meridian Capital accepted Q-2204', 'win', 22], ['INV-2207 is overdue by 9 days', 'bad', 80], ['Security audit booked for next Tuesday', 'info', 300, true]],
  cmd: () => [{ label: 'New deal', hint: 'Action', icon: 'plus', run: () => newDeal() }, { label: 'New quote', hint: 'Action', icon: 'file', run: () => quoteForm() }, ...DB.deals.map(d => ({ label: d.title, hint: 'Deal · ' + stage(d.stage).name, icon: 'board', run: () => openDeal(d) })), ...DB.invoices.map(i => ({ label: i.no + ' · ' + i.account, hint: 'Invoice · ' + st(i), icon: 'receipt', run: () => { ST.sel = i.id; location.hash = '#/invoices'; APP.refresh(); } })), ...DB.accounts.map(a => ({ label: a.name, hint: 'Account', icon: 'building', run: () => { location.hash = '#/accounts'; } }))]
});
</script>
