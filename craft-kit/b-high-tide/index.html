<!doctype html>
<!-- Chill & Craft · High Tide · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>High Tide · Liquid fill buttons</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f2f6fa;
    --ink: #0b2a4a;
    --muted: #5d7187;
    --rule: rgba(11, 42, 74, 0.08);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #07121f;
    --ink: #e4eefb;
    --muted: #8ea3bd;
    --rule: rgba(228, 238, 251, 0.06);
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  /* Calm stage with faint horizontal "water lines" */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px); }
  .wrap { display: grid; justify-items: center; gap: 24px; text-align: center; width: min(560px, 100%); }
  .eyebrow { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .small-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .status { margin: 0; min-height: 1.3em; font-size: 0.9rem; color: var(--muted); }
  .status b { color: var(--ink); }

  /* ---------- Liquid button ---------- */
  .tide {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 28px;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1rem;
    font-weight: 750;
    letter-spacing: 0.01em;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color 0.4s ease, transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .tide.hero { padding: 20px 44px; font-size: 1.2rem; border-radius: 18px; border-width: 3px; }
  .tide:active { transform: scale(0.95, 0.92); transition-duration: 0.1s; }
  .tide:focus-visible { outline: 3px solid var(--c2); outline-offset: 4px; }
  .text, .copy { display: inline-flex; align-items: center; gap: 10px; }
  .text svg, .copy svg { width: 1.1em; height: 1.1em; transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }

  /* Liquid body (clips the white copy of the label) and its wave crest move together */
  .liquid, .crest {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100%;
    z-index: 1;
    transform: translateY(108%);
    transition: transform 0.6s cubic-bezier(0.55, 0, 0.8, 0.4);
  }
  .liquid { overflow: hidden; background: linear-gradient(180deg, var(--c1), var(--c2)); }
  .crest { pointer-events: none; }
  /* The white label sits inside the liquid and moves the opposite way, so it never shifts */
  .copy { position: absolute; inset: 0; justify-content: center; color: #fff; transform: translateY(-108%); transition: transform 0.6s cubic-bezier(0.55, 0, 0.8, 0.4); }
  .wave { position: absolute; left: 0; bottom: calc(100% - 1px); width: 200%; height: 12px; fill: var(--c1); transform-origin: 50% 100%; animation: slide 1.4s linear infinite; }
  .wave.back { opacity: 0.5; height: 15px; animation-duration: 2.2s; animation-direction: reverse; }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* Rise on hover / focus / tap, with a wobbly spring so the surface sloshes past the top */
  .tide:hover .liquid, .tide:hover .crest, .tide:focus-visible .liquid, .tide:focus-visible .crest, .tide.wet .liquid, .tide.wet .crest,
  .tide:hover .copy, .tide:focus-visible .copy, .tide.wet .copy {
    transform: translateY(0);
    transition: transform 1s cubic-bezier(0.25, 0.9, 0.3, 1.1);
    transition-timing-function: linear(0, 0.165, 0.495, 0.916, 1.173, 1.302, 1.31, 1.234, 1.122, 0.995, 0.926, 0.899, 0.907, 0.937, 0.981, 1.01, 1.028, 1.032, 1.027, 1.016, 1.003, 0.994, 0.99, 0.992, 0.997, 1.002, 1);
  }
  .tide:hover .wave, .tide:focus-visible .wave { animation: slide 0.7s linear infinite, swell 1.2s ease-out; }
  @keyframes swell { 0% { scale: 1 2.4; } 100% { scale: 1 1; } }
  .tide:hover, .tide:focus-visible, .tide.wet { border-color: var(--c2); }
  .tide:hover .text svg, .tide:hover .copy svg, .tide.wet .copy svg { transform: translateX(5px); }

  /* Bubbles: drift up once full, boil while working */
  .liquid i { position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.75); opacity: 0; }
  .liquid i:nth-of-type(1) { left: 14%; }
  .liquid i:nth-of-type(2) { left: 42%; width: 4px; height: 4px; }
  .liquid i:nth-of-type(3) { left: 71%; }
  .liquid i:nth-of-type(4) { left: 88%; width: 3px; height: 3px; }
  .tide:hover .liquid i, .tide:focus-visible .liquid i, .tide.wet .liquid i { animation: bubble 1.8s ease-in infinite 0.9s; }
  .tide:hover .liquid i:nth-of-type(2), .tide.wet .liquid i:nth-of-type(2) { animation-duration: 1.3s; animation-delay: 1.2s; }
  .tide:hover .liquid i:nth-of-type(3), .tide.wet .liquid i:nth-of-type(3) { animation-duration: 2.2s; animation-delay: 1.5s; }
  .tide:hover .liquid i:nth-of-type(4), .tide.wet .liquid i:nth-of-type(4) { animation-delay: 1.05s; }
  .tide.boil .liquid i { animation: bubble 0.5s ease-in infinite !important; }
  .tide.boil .liquid i:nth-of-type(2n) { animation-delay: 0.2s !important; }
  @keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }

  /* Droplets and splash ring */
  .drop { position: absolute; left: 0; top: 0; width: 7px; height: 9px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; pointer-events: none; z-index: 5; }
  .ring { position: absolute; z-index: 2; width: 16px; height: 16px; margin: -8px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.9); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .liquid, .crest, .copy,
    .tide:hover .liquid, .tide:hover .crest, .tide:focus-visible .liquid, .tide:focus-visible .crest, .tide.wet .liquid, .tide.wet .crest,
    .tide:hover .copy, .tide:focus-visible .copy, .tide.wet .copy { transition: none; }
    .wave, .liquid i, .tide:hover .wave, .tide:focus-visible .wave, .tide:hover .liquid i, .tide:focus-visible .liquid i, .tide.wet .liquid i, .tide.boil .liquid i { animation: none !important; }
    .tide, .text svg, .copy svg { transition: none; }
    .drop, .ring { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="wrap">
      <p class="eyebrow">Hover to fill · press to pour</p>

      <button class="tide hero" type="button" style="--c1:#2ad4d9;--c2:#1f63ff" data-work="Placing order" data-done="Ordered" data-note="Order placed. Your basket is on its way.">
        <span class="liquid" aria-hidden="true"><span class="copy"><span class="lbl">Order now</span><svg viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span><i></i><i></i><i></i><i></i></span>
        <span class="crest" aria-hidden="true">
          <svg class="wave back" viewBox="0 0 120 12" preserveAspectRatio="none"><path d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 V12 H0 Z" /></svg>
          <svg class="wave" viewBox="0 0 120 12" preserveAspectRatio="none"><path d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 V12 H0 Z" /></svg>
        </span>
        <span class="text"><span class="lbl">Order now</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
      </button>

      <div class="small-row">
        <button class="tide" type="button" style="--c1:#ffae4a;--c2:#f2416b" data-work="Checking tables" data-done="Booked" data-note="Table for two, tonight at 8 PM.">
          <span class="liquid" aria-hidden="true"><span class="copy"><span class="lbl">Book a table</span></span><i></i><i></i><i></i><i></i></span>
          <span class="crest" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 120 12" preserveAspectRatio="none"><path d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 V12 H0 Z" /></svg>
            <svg class="wave" viewBox="0 0 120 12" preserveAspectRatio="none"><path d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 V12 H0 Z" /></svg>
          </span>
          <span class="text"><span class="lbl">Book a table</span></span>
        </button>
        <button class="tide" type="button" style="--c1:#9be15d;--c2:#139e6a" data-work="Setting up" data-done="You're in" data-note="Free trial started. 14 days on us.">
          <span class="liquid" aria-hidden="true"><span class="copy"><span class="lbl">Start free</span></span><i></i><i></i><i></i><i></i></span>
          <span class="crest" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 120 12" preserveAspectRatio="none"><path d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 V12 H0 Z" /></svg>
            <svg class="wave" viewBox="0 0 120 12" preserveAspectRatio="none"><path d="M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 V12 H0 Z" /></svg>
          </span>
          <span class="text"><span class="lbl">Start free</span></span>
        </button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite">Three tides, one idea.</p>
    </div>
  </main>

<script>
  // High Tide: CSS fills the button on hover. A press runs: squash → splash → the liquid drains and
  // refills as a progress bar while bubbles boil → bounce, splash and a done label → it drains away.
  (function () {
    var stage = document.getElementById("stage");
    var status = document.getElementById("status");
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".tide"));
    var calm = matchMedia("(prefers-reduced-motion: reduce)");

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }

    // Droplets jump out of the top edge and fall back with gravity
    function splash(btn, n, power) {
      var s = stage.getBoundingClientRect(), r = btn.getBoundingClientRect();
      var cs = getComputedStyle(btn), colors = [cs.getPropertyValue("--c1").trim(), cs.getPropertyValue("--c2").trim()];
      for (var i = 0; i < n; i++) {
        var d = document.createElement("i");
        d.className = "drop";
        d.style.background = colors[i % 2];
        stage.appendChild(d);
        var x = r.left - s.left + r.width * (0.15 + Math.random() * 0.7), y = r.top - s.top + 2;
        var vx = (Math.random() - 0.5) * 70, vy = -(power * (0.5 + Math.random() * 0.6)), frames = [];
        for (var k = 0; k <= 10; k++) {
          var t = k / 10;
          var dy = vy * t + 2.4 * power * t * t;
          frames.push({ transform: "translate(" + (x + vx * t).toFixed(1) + "px," + (y + dy).toFixed(1) + "px) scale(" + (1 - t * 0.4).toFixed(2) + ")", opacity: t > 0.8 ? (1 - t) * 5 : 1 });
        }
        d.animate(frames, { duration: 650 + Math.random() * 250, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(d);
      }
    }
    function ring(btn, x, y) {
      var r = document.createElement("span");
      r.className = "ring";
      r.style.left = x + "px";
      r.style.top = y + "px";
      btn.appendChild(r);
      r.animate([{ transform: "scale(0.4)", opacity: 1 }, { transform: "scale(10)", opacity: 0 }], { duration: 650, easing: "ease-out" }).onfinish = function () { r.remove(); };
    }
    function setLabel(btn, text) {
      btn.querySelectorAll(".lbl").forEach(function (l) { l.textContent = text; });
    }

    buttons.forEach(function (btn) {
      var original = btn.querySelector(".text .lbl").textContent;
      var liquid = btn.querySelector(".liquid"), crest = btn.querySelector(".crest"), copy = btn.querySelector(".copy");
      var tapTimer = null;

      // Phones have no hover: keep the button filled for a moment after a tap
      btn.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "mouse" || btn.dataset.running) return;
        btn.classList.add("wet");
        clearTimeout(tapTimer);
        tapTimer = setTimeout(function () { if (!btn.dataset.running) btn.classList.remove("wet"); }, 1600);
      });

      btn.addEventListener("click", async function (e) {
        if (btn.dataset.running) return;
        btn.dataset.running = "1";
        clearTimeout(tapTimer);
        btn.classList.add("wet");
        btn.setAttribute("aria-busy", "true");
        var r = btn.getBoundingClientRect();
        var x = e.detail === 0 ? r.width / 2 : e.clientX - r.left;
        var y = e.detail === 0 ? r.height / 2 : e.clientY - r.top;

        if (calm.matches) {
          setLabel(btn, btn.dataset.work);
          status.textContent = btn.dataset.work + "…";
          await wait(900);
        } else {
          // 1. Anticipation: squash down
          await btn.animate([{ transform: "scale(1)" }, { transform: "scale(1.04, 0.86)" }], { duration: 120, easing: "ease-in" }).finished;
          springTo(btn, function (p) { return { transform: "scale(" + (1.04 - 0.04 * p).toFixed(3) + "," + (0.86 + 0.14 * p).toFixed(3) + ")" }; }, 320, 9);
          // 2. Main: splash out of the top and a ring from the press point
          splash(btn, 12, 60);
          ring(btn, x, y);
          // 3. Action: the liquid drains and refills as a progress bar while bubbles boil
          setLabel(btn, btn.dataset.work);
          status.textContent = btn.dataset.work + "…";
          btn.classList.add("boil");
          var level = [{ transform: "translateY(0)" }, { transform: "translateY(100%)", offset: 0.15 }, { transform: "translateY(55%)", offset: 0.55 }, { transform: "translateY(30%)", offset: 0.75 }, { transform: "translateY(0)" }];
          var counter = level.map(function (k) { var o = { transform: k.transform.replace("translateY(", "translateY(-").replace("--", "-") }; if (k.offset) o.offset = k.offset; return o; });
          liquid.animate(level, { duration: 1500, easing: "ease-in-out" });
          crest.animate(level, { duration: 1500, easing: "ease-in-out" });
          await copy.animate(counter, { duration: 1500, easing: "ease-in-out" }).finished;
          btn.classList.remove("boil");
        }

        // 4. Finish: done label, a bounce and a bigger splash
        setLabel(btn, btn.getAttribute("data-done") + " ✓");
        status.innerHTML = "<b>" + original + ":</b> " + btn.dataset.note;
        btn.removeAttribute("aria-busy");
        if (!calm.matches) {
          springTo(btn, function (p) { return { transform: "translateY(" + (Math.sin(p * Math.PI) * -6).toFixed(2) + "px) scale(" + (1 + Math.sin(p * Math.PI) * 0.06).toFixed(3) + ")" }; }, 200, 10);
          splash(btn, 18, 80);
          ring(btn, r.width / 2, r.height / 2);
        }

        // 5. Reset: hold for a moment, then drain and restore the label
        await wait(1700);
        btn.classList.remove("wet");
        await wait(calm.matches ? 0 : 350);
        setLabel(btn, original);
        delete btn.dataset.running;
      });
    });
  })();
</script>
</body>
</html>
