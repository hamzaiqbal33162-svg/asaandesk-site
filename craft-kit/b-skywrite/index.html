<!doctype html>
<!-- Chill & Craft · Skywrite · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skywrite · Send button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --sky-top: #dce8ff;
    --sky-bottom: #fbf3ff;
    --ink: #17203f;
    --muted: #56628a;
    --btn: #1a2457;
    --btn-ink: #ffffff;
    --btn-ring: rgba(26, 36, 87, 0.16);
    --trail: #0fae83;
    --trail-soft: rgba(15, 174, 131, 0.28);
    --star: rgba(255, 255, 255, 0);
    --cloud: rgba(255, 255, 255, 0.85);
    --chip: #ffffff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --sky-top: #060b22;
    --sky-bottom: #17123a;
    --ink: #eaf0ff;
    --muted: #9ba6cc;
    --btn: #f3f6ff;
    --btn-ink: #0c1433;
    --btn-ring: rgba(62, 240, 180, 0.22);
    --trail: #3ef0b4;
    --trail-soft: rgba(62, 240, 180, 0.3);
    --star: rgba(255, 255, 255, 0.85);
    --cloud: rgba(255, 255, 255, 0.04);
    --chip: #1c2350;
    color-scheme: dark;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(170deg, var(--sky-top), var(--sky-bottom));
  }

  /* ---------- Stage: two star layers that drift at different speeds ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .layer { position: absolute; inset: -20px; pointer-events: none; transition: transform 1.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .layer.far {
    background-image:
      radial-gradient(1.1px 1.1px at 12% 18%, var(--star), transparent 70%),
      radial-gradient(1px 1px at 27% 74%, var(--star), transparent 70%),
      radial-gradient(1.2px 1.2px at 46% 12%, var(--star), transparent 70%),
      radial-gradient(1px 1px at 63% 82%, var(--star), transparent 70%),
      radial-gradient(1px 1px at 90% 64%, var(--star), transparent 70%),
      radial-gradient(1px 1px at 55% 40%, var(--star), transparent 70%);
    animation: twinkle 3.2s ease-in-out infinite alternate;
  }
  .layer.near {
    background-image:
      radial-gradient(1.8px 1.8px at 78% 26%, var(--star), transparent 70%),
      radial-gradient(1.6px 1.6px at 8% 88%, var(--star), transparent 70%),
      radial-gradient(1.7px 1.7px at 33% 34%, var(--star), transparent 70%),
      radial-gradient(160px 60px at 18% 30%, var(--cloud), transparent 70%),
      radial-gradient(200px 70px at 84% 76%, var(--cloud), transparent 70%);
  }
  .stage.flying .layer.far { transform: translateX(-10px); }
  .stage.flying .layer.near { transform: translateX(-28px); }
  @keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }

  /* Flight layer covers the stage and never blocks clicks */
  .sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .trail { fill: none; stroke: var(--trail); stroke-width: 2.5; stroke-linecap: round; opacity: 0; }
  .trail.glow { stroke: var(--trail-soft); stroke-width: 12; }
  .flyer { color: var(--trail); opacity: 0; }
  .puff { fill: var(--trail-soft); transform-box: fill-box; transform-origin: center; animation: puff 0.9s ease-out forwards; }
  @keyframes puff { from { transform: scale(0.6); opacity: 0.9; } to { transform: scale(3.2); opacity: 0; } }

  .center { position: relative; display: grid; justify-items: center; gap: 14px; text-align: center; }
  .bit { position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 2px; pointer-events: none; z-index: 5; }

  /* ---------- The Send button ---------- */
  .send {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-width: 11rem;
    padding: 12px 26px 12px 12px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-ink);
    font-family: inherit;
    font-size: 1.06rem;
    font-weight: 650;
    line-height: 1;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 0 0 6px var(--btn-ring), 0 14px 30px -12px rgba(10, 20, 60, 0.55);
    transition: transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .send:hover { transform: translateY(-3px); box-shadow: 0 0 0 8px var(--btn-ring), 0 20px 36px -14px rgba(10, 20, 60, 0.6); }
  .send:active, .send.pressing { transform: scale(0.94); transition-duration: 0.12s; }
  .send:focus-visible { outline: 3px solid var(--trail); outline-offset: 9px; }
  .send[aria-disabled="true"] { cursor: progress; }

  /* Sheen sweeps across once on hover */
  .sheen { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  .sheen::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -40%;
    width: 30%;
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--trail) 35%, transparent), transparent);
    transform: translateX(0) skewX(-18deg);
  }
  .send:hover .sheen::before { animation: sheen 0.9s ease; }
  @keyframes sheen { to { transform: translateX(560%) skewX(-18deg); } }

  /* Ripple ring that rolls out when the message is delivered */
  .wave { position: absolute; inset: -6px; border-radius: inherit; border: 2px solid var(--trail); opacity: 0; pointer-events: none; }

  /* Icon slot: plane, progress ring, streaks and tick */
  .icon {
    position: relative;
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--btn-ink) 12%, transparent);
    transition: background 0.3s ease;
  }
  .icon > svg { position: absolute; overflow: visible; }
  .plane { width: 24px; height: 24px; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .send:hover .plane { animation: bob 1.4s ease-in-out infinite; }
  .send:active .plane, .send.pressing .plane { transform: translateX(-4px) rotate(12deg) scale(0.9); animation: none; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(-12deg); } }
  .send[data-state="sending"] .plane, .send[data-state="sent"] .plane { opacity: 0; animation: none; }

  .ring { width: 40px; height: 40px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke: var(--trail); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 113.1; stroke-dashoffset: 113.1; opacity: 0; transition: opacity 0.3s; }
  .send[data-state="sending"] .ring circle { opacity: 1; }

  .streaks { position: absolute; right: 70%; top: 50%; width: 30px; height: 14px; margin-top: -7px; pointer-events: none; }
  .streaks i { position: absolute; right: 0; height: 2px; border-radius: 2px; background: var(--trail); transform-origin: right center; transform: scaleX(0); }
  .streaks i:nth-child(1) { top: 1px; width: 18px; }
  .streaks i:nth-child(2) { top: 6px; width: 28px; }
  .streaks i:nth-child(3) { top: 11px; width: 14px; }

  .tick { width: 24px; height: 24px; transform: scale(0); }
  .tick path { stroke-dasharray: 30; stroke-dashoffset: 30; }
  .send[data-state="sent"] .icon { background: var(--trail); color: #062a20; }

  /* Label rolls between words */
  .label { position: relative; display: inline-block; min-width: 5.2em; height: 1.2em; overflow: hidden; text-align: left; }
  .label span { position: absolute; left: 0; top: 0.1em; white-space: nowrap; }

  /* Delivery chip */
  .chip {
    margin: 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    box-shadow: 0 10px 24px -14px rgba(10, 20, 60, 0.5);
    opacity: 0;
    transform: translateY(-8px) scale(0.8);
  }
  .chip b { color: var(--trail); }
  .status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 0.95rem; }

  /* Calm version: no flight path, the button still changes state */
  @media (prefers-reduced-motion: reduce) {
    .send, .plane, .layer { transition: none; }
    .layer.far, .send:hover .plane, .send:hover .sheen::before { animation: none; }
    .puff, .bit { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="layer far" aria-hidden="true"></div>
    <div class="layer near" aria-hidden="true"></div>

    <!-- Flight layer: glow trail, sharp trail, puffs and the flying plane -->
    <svg class="sky" id="sky" aria-hidden="true">
      <defs>
        <g id="plane-shape">
          <path d="M-11 -9 L11 0 L-11 9 L-6.5 0 Z" fill="currentColor" />
          <path d="M-6.5 0 L11 0 L-3.5 5.5 Z" fill="currentColor" opacity="0.55" />
        </g>
      </defs>
      <path class="trail glow" id="trail-glow" d="" />
      <path class="trail" id="trail" d="" />
      <g id="puffs"></g>
      <g class="flyer" id="flyer"><use href="#plane-shape" /></g>
    </svg>

    <div class="center">
      <button class="send" id="send" type="button" data-state="idle">
        <span class="sheen" aria-hidden="true"></span>
        <span class="wave" id="wave" aria-hidden="true"></span>
        <span class="icon" id="icon" aria-hidden="true">
          <svg class="ring" viewBox="0 0 40 40"><circle id="ring" cx="20" cy="20" r="18" /></svg>
          <span class="streaks" id="streaks"><i></i><i></i><i></i></span>
          <svg class="plane" id="plane" viewBox="-12 -12 24 24"><use href="#plane-shape" /></svg>
          <svg class="tick" id="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </span>
        <span class="label" id="label"><span>Send</span></span>
      </button>
      <p class="chip" id="chip" aria-hidden="true"><b>&#10003;</b> Delivered · <span id="chip-time">just now</span></p>
      <p class="status" id="status" role="status" aria-live="polite">Ready when you are.</p>
    </div>
  </main>

<script>
  // Skywrite: wind-up, launch, loop-the-loop flight with a trail, delivery burst, glide back.
  (function () {
    var NS = "http://www.w3.org/2000/svg";
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), btn = $("send"), icon = $("icon"), plane = $("plane"), label = $("label");
    var ring = $("ring"), streaks = $("streaks"), tick = $("tick"), wave = $("wave"), chip = $("chip");
    var status = $("status"), trail = $("trail"), glow = $("trail-glow"), puffs = $("puffs"), flyer = $("flyer");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var busy = false;
    var RING = 113.1;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Spring helper: samples a damped spring from 0 to 1 (it overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }

    // Particles flung from (x, y) inside host, pulled down by gravity
    function burst(host, x, y, colors, count, power) {
      for (var i = 0; i < count; i++) {
        var p = document.createElement("i");
        p.className = "bit";
        p.style.background = colors[i % colors.length];
        if (i % 3 === 0) p.style.borderRadius = "50%";
        host.appendChild(p);
        var a = Math.random() * Math.PI * 2;
        var s = power * (0.45 + Math.random() * 0.75);
        var vx = Math.cos(a) * s, vy = Math.sin(a) * s - power * 0.35;
        var spin = (Math.random() - 0.5) * 720, frames = [];
        for (var k = 0; k <= 10; k++) {
          var t = k / 10, e = 1 - Math.pow(1 - t, 2);
          frames.push({
            transform: "translate(" + (x + vx * e).toFixed(1) + "px," + (y + vy * e + 70 * t * t).toFixed(1) + "px) rotate(" + (spin * t).toFixed(0) + "deg) scale(" + (1 - t * 0.5).toFixed(2) + ")",
            opacity: t > 0.7 ? (1 - t) / 0.3 : 1
          });
        }
        p.animate(frames, { duration: 700 + Math.random() * 500, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
    }

    // Rolls the label to a new word: old one slides up, new one springs in from below
    function roll(text) {
      var old = label.firstElementChild;
      var next = document.createElement("span");
      next.textContent = text;
      label.appendChild(next);
      if (calm.matches) { old.remove(); return; }
      old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-110%)", opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" }).onfinish = function () { old.remove(); };
      springTo(next, function (p) { return { transform: "translateY(" + ((1 - p) * 110).toFixed(1) + "%)", opacity: Math.min(1, p * 1.5) }; }, 300, 18);
    }

    // Swoop + loop + exit path that starts in the icon slot
    function flightPath() {
      var s = stage.getBoundingClientRect();
      var i = icon.getBoundingClientRect();
      var x = i.left + i.width / 2 - s.left;
      var y = i.top + i.height / 2 - s.top;
      var k = Math.max(0.5, Math.min(1, (s.width - x - 24) / 210, (y - 20) / 190));
      function p(dx, dy) { return (x + dx * k).toFixed(1) + " " + (y + dy * k).toFixed(1); }
      return "M" + p(0, 0) +
        " C" + p(90, 28) + " " + p(205, -18) + " " + p(190, -110) +
        " C" + p(178, -186) + " " + p(70, -188) + " " + p(78, -118) +
        " C" + p(86, -58) + " " + p(250, -60) + " " + (s.width + 80) + " " + (y - 250 * k).toFixed(1);
    }

    function puff(x, y) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", x.toFixed(1));
      c.setAttribute("cy", y.toFixed(1));
      c.setAttribute("r", "3");
      c.setAttribute("class", "puff");
      c.addEventListener("animationend", function () { c.remove(); });
      puffs.appendChild(c);
    }

    // Main flight: the plane follows the path, the trail draws behind, the ring fills
    function fly() {
      return new Promise(function (resolve) {
        var d = flightPath();
        trail.setAttribute("d", d);
        glow.setAttribute("d", d);
        var len = trail.getTotalLength();
        [trail, glow].forEach(function (p) {
          p.getAnimations().forEach(function (a) { a.cancel(); });
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = len;
          p.style.opacity = "1";
        });
        flyer.style.opacity = "1";
        stage.classList.add("flying");
        var start = performance.now(), duration = 1700, n = 0;
        (function frame(now) {
          var t = Math.min(1, (now - start) / duration);
          var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          var at = e * len;
          var pt = trail.getPointAtLength(at);
          var a = trail.getPointAtLength(Math.max(0, at - 2));
          var b = trail.getPointAtLength(Math.min(len, at + 2));
          var angle = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
          var scale = 1 + 0.5 * Math.sin(Math.PI * t);
          flyer.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ") rotate(" + angle.toFixed(1) + ") scale(" + scale.toFixed(2) + ")");
          trail.style.strokeDashoffset = len - at;
          glow.style.strokeDashoffset = len - at;
          ring.style.strokeDashoffset = (RING * (1 - t)).toFixed(1);
          if (++n % 3 === 0 && at > 20) {
            var tail = trail.getPointAtLength(at - 16);
            puff(tail.x, tail.y);
          }
          if (t < 1) requestAnimationFrame(frame);
          else { flyer.style.opacity = "0"; resolve(len); }
        })(start);
      });
    }

    function stamp() {
      var d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    async function send() {
      busy = true;
      btn.setAttribute("aria-disabled", "true");
      status.textContent = "Sending your message…";

      if (calm.matches) {
        btn.dataset.state = "sending";
        roll("Sending");
        await wait(800);
        btn.dataset.state = "sent";
        roll("Sent");
        tick.style.transform = "none";
        tick.firstElementChild.style.strokeDashoffset = "0";
        chip.style.opacity = "1";
        chip.style.transform = "none";
        status.textContent = "Delivered. Your message is on its way.";
        await wait(2000);
        tick.style.transform = "";
        tick.firstElementChild.style.strokeDashoffset = "";
        chip.style.opacity = "";
        chip.style.transform = "";
        btn.dataset.state = "idle";
        roll("Send");
        return done();
      }

      // 1. Anticipation: the button squashes and the plane winds back
      btn.animate([{ transform: "scale(1)" }, { transform: "scale(1.05, 0.9)" }], { duration: 180, easing: "cubic-bezier(0.5, 0, 0.75, 0)", fill: "forwards" });
      await plane.animate([{ transform: "none" }, { transform: "translate(-7px, 3px) rotate(16deg) scale(0.86)" }], { duration: 200, easing: "cubic-bezier(0.5, 0, 0.75, 0)", fill: "forwards" }).finished;
      plane.getAnimations().forEach(function (a) { a.cancel(); });
      btn.getAnimations().forEach(function (a) { a.cancel(); });

      // 2. Launch: button springs back, streaks fire, label rolls
      btn.dataset.state = "sending";
      springTo(btn, function (p) { return { transform: "scale(" + (1.05 - 0.05 * p).toFixed(3) + "," + (0.9 + 0.1 * p).toFixed(3) + ")" }; }, 320, 10);
      Array.prototype.forEach.call(streaks.children, function (s, i) {
        s.animate([{ transform: "translateX(0) scaleX(0)", opacity: 1 }, { transform: "translateX(-6px) scaleX(1)", opacity: 1, offset: 0.4 }, { transform: "translateX(-26px) scaleX(0.2)", opacity: 0 }], { duration: 420, delay: i * 50, easing: "ease-out" });
      });
      roll("Sending");

      // 3. Flight with trail and progress ring
      var len = await fly();

      // 4. Finish: tick pops, ring wave, sparkle burst, delivery chip
      stage.classList.remove("flying");
      btn.dataset.state = "sent";
      roll("Sent");
      status.textContent = "Delivered. Your message is on its way.";
      springTo(tick, function (p) { return { transform: "scale(" + p.toFixed(3) + ") rotate(" + ((1 - p) * -40).toFixed(1) + "deg)" }; }, 280, 11).onfinish = function () { tick.style.transform = "none"; };
      tick.firstElementChild.animate([{ strokeDashoffset: 30 }, { strokeDashoffset: 0 }], { duration: 380, delay: 80, easing: "ease-out", fill: "forwards" });
      wave.animate([{ transform: "scale(1)", opacity: 0.9 }, { transform: "scale(1.45, 1.9)", opacity: 0 }], { duration: 700, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)" });
      springTo(btn, function (p) { return { transform: "scale(" + (1 + Math.sin(p * Math.PI) * 0.06).toFixed(3) + ")" }; }, 200, 12);
      var s = stage.getBoundingClientRect(), r = icon.getBoundingClientRect();
      burst(stage, r.left + r.width / 2 - s.left, r.top + r.height / 2 - s.top, ["#3ef0b4", "#0fae83", "#ffffff", "#ffd36b"], 22, 90);
      $("chip-time").textContent = stamp();
      springTo(chip, function (p) { return { transform: "translateY(" + ((1 - p) * -8).toFixed(1) + "px) scale(" + (0.8 + 0.2 * p).toFixed(3) + ")", opacity: Math.min(1, p * 1.4) }; }, 240, 13).onfinish = function () { chip.style.opacity = "1"; chip.style.transform = "none"; };

      await wait(2100);

      // 5. Reset: the trail slides away, tick shrinks, plane glides home
      [trail, glow].forEach(function (p) {
        p.animate([{ strokeDashoffset: 0, opacity: 1 }, { strokeDashoffset: -len, opacity: 0 }], { duration: 900, easing: "cubic-bezier(0.6, 0, 0.3, 1)", fill: "forwards" });
      });
      chip.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-6px) scale(0.9)" }], { duration: 250, fill: "forwards" }).onfinish = function () {
        chip.getAnimations().forEach(function (a) { a.cancel(); });
        chip.style.opacity = "";
        chip.style.transform = "";
      };
      await tick.animate([{ transform: "none", opacity: 1 }, { transform: "scale(0) rotate(30deg)", opacity: 0 }], { duration: 220, easing: "ease-in" }).finished;
      tick.style.transform = "";
      tick.firstElementChild.getAnimations().forEach(function (a) { a.cancel(); });
      ring.style.strokeDashoffset = RING;
      btn.dataset.state = "idle";
      roll("Send");
      springTo(plane, function (p) { return { transform: "translate(" + ((1 - p) * -26).toFixed(1) + "px," + ((1 - p) * 10).toFixed(1) + "px) rotate(" + ((1 - p) * -24).toFixed(1) + "deg)", opacity: Math.min(1, p * 2) }; }, 200, 12);
      status.textContent = "Ready when you are.";
      done();
    }

    function done() {
      btn.removeAttribute("aria-disabled");
      busy = false;
    }

    // Press feedback for keyboard users too
    btn.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !busy) btn.classList.add("pressing"); });
    btn.addEventListener("keyup", function () { btn.classList.remove("pressing"); });
    btn.addEventListener("blur", function () { btn.classList.remove("pressing"); });

    btn.addEventListener("click", function () {
      if (busy) return;
      btn.classList.remove("pressing");
      send();
    });
  })();
</script>
</body>
</html>
