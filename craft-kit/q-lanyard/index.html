<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lanyard · team badges that swing and flip</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: lavender wall + wooden rail (light), night violet + steel rail (dark) ---------- */
  :root {
    --bg: #ece6ff; --bg-2: #faf8ff; --ink: #1d1838; --muted: #6c6790; --card: #ffffff; --card-2: #f6f3ff;
    --line: rgba(29, 24, 56, 0.1); --rail-1: #e0bf96; --rail-2: #a97e52; --rail-3: #7d5733;
    --shadow: rgba(52, 30, 120, 0.3); --focus: #1d1838;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e0b1c; --bg-2: #1d1838; --ink: #f2efff; --muted: #a8a2cf; --card: #231f3d; --card-2: #2b2649;
    --line: rgba(255, 255, 255, 0.09); --rail-1: #9a96ba; --rail-2: #5c5880; --rail-3: #36324f;
    --shadow: rgba(0, 0, 0, 0.65); --focus: #ffd56b;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    background: radial-gradient(70% 55% at 50% 30%, var(--bg-2), var(--bg));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }

  .stage { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 12px 18px; overflow: hidden; }
  .head { text-align: center; max-width: 520px; padding: 0 8px; }
  .eyebrow { display: inline-block; margin: 0 0 8px; padding: 5px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: clamp(24px, 4.2vw, 38px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 800; }
  .lede { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; }

  /* ---------- Rack: one rail on wide screens, two rails on phones ---------- */
  .rack { --row: 360px; position: relative; display: grid; grid-template-columns: repeat(4, 196px); justify-content: center; width: min(900px, 100%); margin-top: 22px; }
  .rack::before, .rack::after {
    content: ""; position: absolute; left: 4%; right: 4%; top: 12px; height: 11px; border-radius: 6px;
    background: linear-gradient(180deg, var(--rail-1), var(--rail-2) 60%, var(--rail-3));
    box-shadow: 0 6px 10px -6px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }
  .rack::after { display: none; }
  .slot { position: relative; height: var(--row); display: flex; justify-content: center; }
  .hook { position: absolute; top: 9px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 3px solid var(--rail-3); z-index: 2; }

  /* the swinging part: strap + badge turn around the hook */
  .swing { position: absolute; top: 17px; left: 50%; width: 0; transform-origin: 0 0; will-change: transform; }
  .strap {
    position: absolute; left: -8px; top: 0; width: 16px; height: var(--len); border-radius: 3px;
    background: repeating-linear-gradient(180deg, var(--c) 0 9px, color-mix(in srgb, var(--c) 70%, #000) 9px 11px);
    box-shadow: inset 2px 0 0 rgba(255, 255, 255, 0.25), inset -2px 0 0 rgba(0, 0, 0, 0.12);
  }
  .holder { position: absolute; top: var(--len); left: calc(var(--w) / -2); width: var(--w); transform-origin: 50% 0; perspective: 800px; will-change: transform; filter: drop-shadow(0 18px 14px var(--shadow)); }
  /* (the shadow sits on .holder: a filter on .badge itself would flatten the 3D flip) */
  .clip { position: absolute; left: 50%; top: -6px; width: 22px; height: 18px; margin-left: -11px; z-index: 3; border-radius: 4px 4px 6px 6px; background: linear-gradient(180deg, #f2f4f8, #aab0bf); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.25); }
  .clip::after { content: ""; position: absolute; left: 6px; right: 6px; top: 6px; height: 3px; border-radius: 2px; background: #7d8496; }

  /* the badge flips in 3D */
  .badge { position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d; transition: transform 0.95s cubic-bezier(0.3, 1.35, 0.4, 1); }
  .flipped .badge { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 16px; background: var(--card); border: 1px solid var(--line); overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; }
  .back { transform: rotateY(180deg); background: linear-gradient(180deg, var(--card), var(--card-2)); padding: 34px 12px 12px; align-items: stretch; }
  .band { position: relative; width: 100%; height: 40px; flex: none; background: var(--c); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px; }
  .band::before { /* slot punched into the card for the clip */ content: ""; position: absolute; top: 7px; left: 50%; width: 30px; height: 7px; margin-left: -15px; border-radius: 4px; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3); }
  .org { font-size: 9.5px; font-weight: 800; letter-spacing: 0.22em; color: rgba(255, 255, 255, 0.92); }
  .pic { width: 76px; height: 76px; margin-top: 14px; flex: none; border-radius: 22px; overflow: hidden; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 28%, transparent), 0 8px 14px -8px var(--shadow); }
  .pic svg { display: block; width: 100%; height: 100%; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; animation-delay: var(--blink); }
  @keyframes blink { 0%, 95%, 100% { transform: none; } 97% { transform: scaleY(0.1); } }
  .nm { margin-top: 10px; font-size: 15.5px; font-weight: 780; letter-spacing: -0.01em; text-align: center; padding: 0 8px; }
  .rl { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .city { display: flex; align-items: center; gap: 4px; margin-top: 5px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 12%, transparent); font-size: 10.5px; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
  .city svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.4; }
  .code { margin-top: auto; width: 100%; padding: 6px 14px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bars { height: 18px; flex: 1; max-width: 90px; color: var(--ink); opacity: 0.75; background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 4px, currentColor 4px 5px, transparent 5px 7px, currentColor 7px 10px, transparent 10px 12px); }
  .id { font: 700 10px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .flipper { position: absolute; inset: 0; z-index: 2; width: 100%; border: 0; border-radius: 16px; background: transparent; cursor: grab; }
  .flipper:active { cursor: grabbing; }

  .back h3 { margin: 0; font-size: 14px; letter-spacing: -0.01em; }
  .back .lbl { margin-top: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chips i { font-style: normal; font-size: 11px; font-weight: 650; padding: 3px 7px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 72%, var(--ink)); }
  .loc { display: flex; align-items: center; gap: 5px; margin-top: 9px; font-size: 11.5px; color: var(--muted); }
  .loc svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
  .back .top-strip { position: absolute; left: 0; right: 0; top: 0; height: 22px; background: var(--c); }
  .back .top-strip::before { content: ""; position: absolute; top: 7px; left: 50%; width: 30px; height: 7px; margin-left: -15px; border-radius: 4px; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3); }
  .acts { display: flex; gap: 6px; margin-top: auto; }
  .hi {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border: 0; border-radius: 11px; cursor: pointer;
    background: var(--c); color: #fff; font: inherit; font-size: 13px; font-weight: 750; transition: transform 0.4s cubic-bezier(0.3, 1.7, 0.5, 1), background 0.3s;
  }
  .hi svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform-origin: 70% 90%; }
  .hi.press { transform: scale(0.92); transition-duration: 0.1s; }
  .hi.waving svg { animation: wave 0.9s ease-in-out; }
  @keyframes wave { 15%, 45%, 75% { transform: rotate(-22deg); } 30%, 60% { transform: rotate(16deg); } }
  .hi.sent { background: #1f9d6b; }
  .turn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .turn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* speech bubble + hearts when you say hi */
  .bubble { position: absolute; right: -18px; top: 30px; z-index: 5; padding: 7px 11px; border-radius: 14px 14px 14px 4px; background: var(--ink); color: var(--card); font-size: 12.5px; font-weight: 750; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-10px, 10px) scale(0.4); transform-origin: 0 100%; transition: opacity 0.2s, transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .bubble.show { opacity: 1; transform: none; }
  .heart { position: absolute; left: 50%; top: 40%; width: 14px; height: 14px; z-index: 5; pointer-events: none; fill: var(--c); animation: float 1.4s ease-out forwards; }
  @keyframes float { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -110px) scale(1.15) rotate(var(--r)); } }

  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; margin: -3px 0 0 -4px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 80vw), var(--gy, 110vh)); transition: transform 0.7s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost.follow { transition: opacity 0.35s; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #7b5cff; opacity: 0; }
  .ghost.tap::after { animation: tapring 0.5s ease-out; }
  @keyframes tapring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  /* ---------- Phones: two rails of two badges ---------- */
  @media (max-width: 820px) {
    .rack { --row: 268px; grid-template-columns: repeat(2, 168px); width: min(380px, 100%); margin-top: 16px; }
    .rack::after { display: block; top: calc(var(--row) + 12px); }
    .slot { --w: 140px !important; --h: 206px !important; }
    .slot:nth-child(odd) { --len: 26px !important; }
    .slot:nth-child(even) { --len: 44px !important; }
    .pic { width: 58px; height: 58px; border-radius: 17px; margin-top: 10px; }
    .band { height: 32px; padding-bottom: 5px; }
    .org { font-size: 8.5px; }
    .nm { margin-top: 7px; }
    .city { margin-top: 3px; }
    .code { padding: 4px 11px 9px; }
    .bars { height: 15px; }
    .nm { font-size: 14px; }
    .rl { font-size: 11.5px; }
    .back { padding: 28px 10px 10px; }
    .chips i { font-size: 10.5px; padding: 2px 6px; }
    .hi { height: 32px; font-size: 12.5px; }
    .turn { width: 32px; height: 32px; }
    .bubble { right: -10px; top: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="head">
    <p class="eyebrow">The team</p>
    <h1>Meet the people behind the counter</h1>
    <p class="lede">Tap a badge to turn it over. Drag one to give it a swing.</p>
  </header>
  <section class="rack" id="rack" aria-label="Team badges"></section>
  <p class="sr-only" aria-live="polite" id="status"></p>
</main>
<div class="ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3.1-1.4-3-6.4 6.3-.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
  (function () {
    "use strict";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (s, r) { return (r || document).querySelector(s); };

    /* ---------- Team (made-up people) and their drawn portraits ---------- */
    var EYES = '<g class="eyes" fill="#2a1d17"><circle cx="34.5" cy="37" r="1.8"/><circle cx="45.5" cy="37" r="1.8"/></g>';
    var BODY = function (shirt, skin) { return '<path d="M8 82c2-16 14-24 32-24s30 8 32 24z" fill="' + shirt + '"/><rect x="34" y="46" width="12" height="14" rx="5" fill="' + skin + '" opacity=".85"/>'; };
    var TEAM = [
      { name: "Ayesha Noor", role: "Product designer", c: "#ff6b4a", len: 40, city: "Lahore", yrs: 4, skills: ["Design systems", "Motion", "Research"],
        art: '<rect width="80" height="80" fill="#ffd9cc"/>' + BODY("#ff6b4a", "#d9a07a") +
          '<path d="M20 42c0-15 9-26 20-26s20 11 20 26c0 9-3 15-7 19l8 21H19l8-21c-4-4-7-10-7-19z" fill="#1f6f78"/><ellipse cx="40" cy="38" rx="12" ry="14" fill="#e8b48f"/>' +
          EYES + '<path d="M35.5 44.5q4.5 3.5 9 0" stroke="#8a4a35" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M26 30c4-8 9-11 14-11" stroke="#2c8c96" stroke-width="2" fill="none" stroke-linecap="round"/>' },
      { name: "Danish Qureshi", role: "Backend engineer", c: "#14a38f", len: 78, city: "Karachi", yrs: 3, skills: ["Payments", "Uptime", "Databases"],
        art: '<rect width="80" height="80" fill="#c9f1ea"/>' + BODY("#14a38f", "#b8835e") +
          '<ellipse cx="40" cy="37" rx="14" ry="16" fill="#c99168"/><path d="M26 33c0-12 7-17 14-17s15 4 15 15c-3-4-8-6-15-6s-11 3-14 8z" fill="#2b1d16"/>' +
          '<path d="M27 40c1 10 6 15 13 15s12-5 13-15c-2 4-6 6-13 6s-11-2-13-6z" fill="#2b1d16"/>' + EYES +
          '<g fill="none" stroke="#1d1d1d" stroke-width="1.6"><circle cx="34.5" cy="37" r="4.6"/><circle cx="45.5" cy="37" r="4.6"/><path d="M39.1 37h1.8"/></g><path d="M36 46.5q4 2.5 8 0" stroke="#f3d2bd" stroke-width="1.6" fill="none" stroke-linecap="round"/>' },
      { name: "Mehwish Khan", role: "Customer success", c: "#7b5cff", len: 56, city: "Islamabad", yrs: 2, skills: ["Onboarding", "Training", "Calm calls"],
        art: '<rect width="80" height="80" fill="#e4dcff"/><path d="M21 40c0-15 8-24 19-24s19 9 19 24v30H21z" fill="#3a2418"/>' + BODY("#7b5cff", "#e2ad86") +
          '<ellipse cx="40" cy="37" rx="13" ry="15" fill="#efbf98"/><path d="M26 33c3-9 9-13 15-13 7 0 11 5 13 11-7-5-15-5-28 2z" fill="#3a2418"/>' +
          EYES + '<path d="M35.5 44q4.5 4 9 0" stroke="#a5523f" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="26.5" cy="44" r="2" fill="#f5c542"/><circle cx="53.5" cy="44" r="2" fill="#f5c542"/>' },
      { name: "Saad Farooq", role: "Growth lead", c: "#e09a00", len: 30, city: "Faisalabad", yrs: 5, skills: ["Partnerships", "Search", "Cricket stats"],
        art: '<rect width="80" height="80" fill="#ffecb8"/>' + BODY("#e09a00", "#a8724c") +
          '<ellipse cx="40" cy="38" rx="14" ry="15.5" fill="#b97f56"/><g fill="#1e1410"><circle cx="30" cy="26" r="6"/><circle cx="38" cy="22" r="7"/><circle cx="47" cy="24" r="6.5"/><circle cx="53" cy="31" r="4.5"/><circle cx="26.5" cy="32" r="4.5"/></g>' +
          EYES + '<path d="M34.5 43q5.5-3 11 0q-5.5 2-11 0z" fill="#1e1410"/><path d="M36 47q4 2.5 8 0" stroke="#7a4129" stroke-width="1.6" fill="none" stroke-linecap="round"/>' }
    ];
    var rack = $("#rack"), status = $("#status");
    var B = []; // one record per badge with its physics state

    TEAM.forEach(function (p, i) {
      var slot = document.createElement("div");
      slot.className = "slot";
      slot.style.cssText = "--c:" + p.c + ";--len:" + p.len + "px;--w:164px;--h:238px;--blink:" + (i * 1.3) + "s";
      slot.innerHTML =
        '<span class="hook" aria-hidden="true"></span>' +
        '<div class="swing"><span class="strap" aria-hidden="true"></span><div class="holder"><span class="clip" aria-hidden="true"></span>' +
        '<span class="bubble" aria-hidden="true">Hi there!</span>' +
        '<div class="badge">' +
        '<div class="face front"><span class="band"><span class="org">STUDIO PASS</span></span>' +
        '<span class="pic"><svg viewBox="0 0 80 80" aria-hidden="true">' + p.art + "</svg></span>" +
        '<span class="nm">' + p.name + '</span><span class="rl">' + p.role + "</span>" +
        '<span class="city"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/></svg>' + p.city + "</span>" +
        '<span class="code" aria-hidden="true"><span class="bars"></span><span class="id">ID 0' + (241 + i * 37) + "</span></span>" +
        '<button class="flipper" type="button" aria-label="' + p.name + ", " + p.role + '. Turn over for details"></button></div>' +
        '<div class="face back" inert><span class="top-strip" aria-hidden="true"></span><h3>' + p.name + "</h3>" +
        '<span class="lbl">Ask me about</span><span class="chips">' + p.skills.map(function (s) { return "<i>" + s + "</i>"; }).join("") + "</span>" +
        '<span class="loc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>' + p.city + " · " + p.yrs + " years with us</span>" +
        '<span class="acts"><button class="hi" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3.2 16a1.5 1.5 0 0 1 2.4-1.8L8 16"/></svg><span>Say hi</span></button>' +
        '<button class="turn" type="button" aria-label="Turn ' + p.name + "'s badge back over\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4\"/></svg></button></span></div>" +
        "</div></div></div>";
      rack.appendChild(slot);
      var b = { i: i, p: p, slot: slot, swing: $(".swing", slot), holder: $(".holder", slot), hook: $(".hook", slot),
        th: 0, w: 0, ph: 0, pw: 0, drag: null, flipped: false, phase: i * 1.7, waving: false };
      // the badges arrive with a little swing of their own
      b.th = reduce.matches ? 0 : (i % 2 ? 0.3 : -0.28);
      B.push(b);

      var flipper = $(".flipper", slot), back = $(".back", slot), front = $(".front", slot);
      flipper.addEventListener("click", function () { if (!b.moved) flip(b, true); b.moved = false; });
      $(".turn", slot).addEventListener("click", function () { flip(b, false); });
      back.addEventListener("click", function (e) { if (!e.target.closest("button") && !b.moved) flip(b, false); b.moved = false; });
      $(".hi", slot).addEventListener("click", function () { sayHi(b); });
      b.front = front; b.back = back;

      // drag anywhere on the badge (except its buttons) to swing it
      slot.addEventListener("pointerdown", function (e) {
        if (e.button > 0 || (e.target.closest("button") && !e.target.closest(".flipper"))) return;
        if (!e.target.closest(".badge")) return;
        grab(b, e.clientX, e.clientY);
        try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        var move = function (ev) { pull(b, ev.clientX, ev.clientY); };
        var up = function () { letGo(b); removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); };
        addEventListener("pointermove", move);
        addEventListener("pointerup", up);
        addEventListener("pointercancel", up);
      });
    });

    /* ---------- Pendulum physics ----------
       th = the strap's angle around the hook; ph = the badge's own wobble around the clip, pushed by th's acceleration. */
    function hookPoint(b) { var r = b.hook.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
    function grab(b, x, y) {
      var h = hookPoint(b);
      b.drag = { a0: Math.atan2(x - h.x, y - h.y), th0: b.th, x0: x, y0: y, target: b.th };
      b.moved = false;
    }
    function pull(b, x, y) {
      if (!b.drag) return;
      var h = hookPoint(b), a = Math.atan2(x - h.x, y - h.y);
      if (Math.abs(x - b.drag.x0) + Math.abs(y - b.drag.y0) > 6) b.moved = true;
      b.drag.target = Math.max(-1.1, Math.min(1.1, b.drag.th0 - (a - b.drag.a0)));
    }
    function letGo(b) { b.drag = null; }
    var last = performance.now(), clock = 0;
    function step(now) {
      var dt = Math.min(0.034, (now - last) / 1000);
      last = now; clock += dt;
      B.forEach(function (b) {
        if (reduce.matches) { b.th = 0; b.ph = 0; }
        else {
          for (var s = 0; s < 2; s++) {
            var h = dt / 2, acc;
            if (b.drag) acc = 260 * (b.drag.target - b.th) - 26 * b.w;
            else acc = -9.5 * Math.sin(b.th) - 0.55 * b.w + 0.22 * Math.sin(clock * 0.9 + b.phase) + 0.12 * Math.sin(clock * 1.7 + b.phase * 2);
            b.w += acc * h; b.th += b.w * h;
            var pacc = -34 * b.ph - 2.6 * b.pw - 0.55 * acc;
            b.pw += pacc * h; b.ph += b.pw * h;
          }
        }
        b.swing.style.transform = "rotate(" + b.th.toFixed(4) + "rad)";
        b.holder.style.transform = "rotate(" + b.ph.toFixed(4) + "rad)";
      });
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    /* ---------- Flip and say hi ---------- */
    function flip(b, toBack) {
      if (b.flipped === toBack) return;
      b.flipped = toBack;
      b.slot.classList.toggle("flipped", toBack);
      b.front.inert = toBack; b.back.inert = !toBack;
      b.w += (toBack ? 1.5 : -1.2); b.pw += toBack ? 4 : -4; // turning it over sets it swinging
      var target = toBack ? $(".hi", b.slot) : $(".flipper", b.slot);
      if (b.slot.contains(document.activeElement)) setTimeout(function () { target.focus({ preventScroll: true }); }, 60);
      status.textContent = toBack ? b.p.name + ", " + b.p.role + ". Ask about " + b.p.skills.join(", ") + ". " + b.p.city + ", " + b.p.yrs + " years with us." : b.p.name + "'s badge turned back.";
    }
    function sayHi(b) {
      var btn = $(".hi", b.slot), label = $("span", btn), bubble = $(".bubble", b.slot);
      if (b.waving) return;
      b.waving = true;
      btn.classList.add("press"); // anticipation
      setTimeout(function () { btn.classList.remove("press"); btn.classList.add("waving"); label.textContent = "Waving…"; }, 110);
      setTimeout(function () { // finish: the badge answers, wiggles and hearts float up
        btn.classList.remove("waving"); btn.classList.add("sent"); label.textContent = "Said hi";
        bubble.textContent = "Hi! I'm " + b.p.name.split(" ")[0] + "!";
        bubble.classList.add("show");
        b.pw += 6; b.w += 0.6;
        hearts(b);
        status.textContent = "You said hi to " + b.p.name + ".";
      }, 1000);
      setTimeout(function () { bubble.classList.remove("show"); }, 2900);
      setTimeout(function () { btn.classList.remove("sent"); label.textContent = "Say hi"; b.waving = false; }, 3400);
    }
    function hearts(b) {
      if (reduce.matches) return;
      for (var k = 0; k < 5; k++) {
        var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "heart"); s.setAttribute("aria-hidden", "true");
        s.innerHTML = '<path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.5 1.2 5.3 3.2 1.8-2 3.2-3.2 5.3-3.2 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/>';
        s.style.setProperty("--dx", (k - 2) * 22 + "px");
        s.style.setProperty("--r", (k - 2) * 12 + "deg");
        s.style.animationDelay = k * 90 + "ms";
        $(".holder", b.slot).appendChild(s);
        setTimeout(s.remove.bind(s), 1900);
      }
    }

    /* ---------- Auto-demo ---------- */
    var ghost = $(".ghost"), demoOn = !reduce.matches, timers = [], round = 0;
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function ghostAt(x, y) { ghost.style.setProperty("--gx", x + "px"); ghost.style.setProperty("--gy", y + "px"); }
    function ghostOver(el, fx, fy) { var r = el.getBoundingClientRect(); ghost.classList.add("show"); ghostAt(r.left + r.width * fx, r.top + r.height * fy); }
    function tap(then) { ghost.classList.add("tap"); later(function () { ghost.classList.remove("tap"); if (then) then(); }, 170); }
    function stopDemo() {
      if (!demoOn) return;
      demoOn = false; timers.forEach(clearTimeout);
      ghost.classList.remove("show", "tap", "follow");
      B.forEach(function (b) { b.drag = null; });
    }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) {
      addEventListener(t, function (e) { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true });
    });
    function demoSwing(b) {
      var r = $(".badge", b.slot).getBoundingClientRect(), x0 = r.left + r.width * 0.5, y0 = r.top + r.height * 0.62;
      ghost.classList.add("show"); ghostAt(x0, y0);
      later(function () {
        tap();
        grab(b, x0, y0);
        ghost.classList.add("follow");
        var t0 = performance.now();
        (function frame(now) {
          if (!demoOn) return;
          var k = Math.min(1, (now - t0) / 650), e = Math.sin(k * Math.PI / 2), dx = 120 * e;
          pull(b, x0 + dx, y0 - 10 * e); ghostAt(x0 + dx, y0 - 10 * e);
          if (k < 1) requestAnimationFrame(frame);
          else { letGo(b); ghost.classList.remove("follow"); }
        })(t0);
      }, 800);
    }
    function demo() {
      if (!demoOn) return;
      var a = B[round % 2 ? 3 : 1], f = B[round % 2 ? 0 : 2];
      round++;
      later(function () { demoSwing(a); }, 0);
      later(function () { ghostOver($(".badge", f.slot), 0.5, 0.45); }, 2400);
      later(function () { tap(function () { flip(f, true); }); }, 3200);
      later(function () { ghostOver($(".hi", f.slot), 0.45, 0.55); }, 4300);
      later(function () { tap(function () { sayHi(f); }); }, 5100);
      later(function () { ghostOver($(".turn", f.slot), 0.5, 0.55); }, 7400);
      later(function () { tap(function () { flip(f, false); }); }, 8200);
      later(function () { ghost.classList.remove("show"); }, 8900);
      later(demo, 10200);
    }
    ghostAt(innerWidth * 0.8, innerHeight + 40);
    if (demoOn) later(demo, 900);
  })();
</script>
</body>
</html>
