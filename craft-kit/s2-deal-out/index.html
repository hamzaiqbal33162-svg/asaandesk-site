<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Out · Share a photo by dealing it to friends</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f4efe4;
    --bg2: #eadfca;
    --ink: #1f2a24;
    --muted: #6d6a5d;
    --line: rgba(31, 42, 36, 0.13);
    --field: #fffaf0;
    --felt1: #2f8a62;
    --felt2: #1b5c40;
    --rim1: #9a6a36;
    --rim2: #6a431d;
    --gold: #e7b84d;
    --card: #fffaf0;
    --cardback: #b8323f;
    --ok: #17a673;
    --shadow: rgba(60, 40, 10, 0.45);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1411;
    --bg2: #121d18;
    --ink: #eef3ea;
    --muted: #9fae9f;
    --line: rgba(238, 243, 234, 0.12);
    --field: #16221d;
    --felt1: #25734f;
    --felt2: #123f2c;
    --rim1: #6d4722;
    --rim2: #3f2710;
    --gold: #f0c35c;
    --card: #fbf4e6;
    --cardback: #a62a37;
    --ok: #3fd69d;
    --shadow: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Stage: a warm room with a soft lamp over the table ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; background: radial-gradient(120% 80% at 50% 0%, var(--bg), var(--bg2)); }
  .stage::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 42%; width: 900px; height: 600px; margin: -300px 0 0 -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 214, 120, 0.32), transparent); animation: lamp 6s ease-in-out infinite; }
  @keyframes lamp { 50% { opacity: 0.65; transform: scale(1.06); } }
  .wrap { width: min(600px, 100%); display: grid; gap: 14px; justify-items: center; }
  .top { text-align: center; animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .kicker { margin: 0; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 3px 0 0; font-size: clamp(1.2rem, 4.6vw, 1.5rem); letter-spacing: -0.015em; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(0.97); } }

  /* ---------- The table ---------- */
  .tablewrap { position: relative; width: 100%; padding: 48px 34px 46px; animation: rise 0.9s 0.08s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .table { position: relative; width: 100%; aspect-ratio: 16 / 9.2; }
  .felt { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(60% 60% at 50% 42%, var(--felt1), var(--felt2)); box-shadow: 0 0 0 9px var(--rim1), 0 0 0 11px var(--gold), 0 0 0 16px var(--rim2), 0 40px 60px -20px var(--shadow), inset 0 10px 40px rgba(0, 0, 0, 0.35); overflow: hidden; }
  .felt::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.4px); background-size: 6px 6px; }
  .felt::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 1.5px dashed rgba(255, 236, 180, 0.28); }

  /* Deck in the middle */
  .deck { position: absolute; left: 50%; top: 47%; width: clamp(76px, 20%, 118px); aspect-ratio: 4 / 5; padding: 0; border: 0; background: none; cursor: pointer; transform: translate(-50%, -50%); }
  .deck .c { position: absolute; inset: 0; border-radius: 10px; background: var(--card); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12), 0 10px 16px -10px rgba(0, 0, 0, 0.6); }
  .deck .c3 { transform: translate(5px, 5px) rotate(5deg); background: repeating-linear-gradient(45deg, var(--cardback) 0 5px, color-mix(in srgb, var(--cardback) 80%, #fff) 5px 10px); box-shadow: inset 0 0 0 4px var(--card), 0 8px 14px -8px rgba(0, 0, 0, 0.6); }
  .deck .c2 { transform: translate(2px, 2px) rotate(-3deg); background: repeating-linear-gradient(-45deg, var(--cardback) 0 5px, color-mix(in srgb, var(--cardback) 80%, #fff) 5px 10px); box-shadow: inset 0 0 0 4px var(--card), 0 8px 14px -8px rgba(0, 0, 0, 0.6); }
  .deck .top { padding: 5px 5px 0; overflow: hidden; animation: idle 4.5s ease-in-out infinite; }
  @keyframes idle { 50% { transform: translateY(-3px) rotate(-1deg); } }
  .deck:hover .top { animation-play-state: paused; transform: translateY(-5px) rotate(-2deg); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .photo { display: block; width: 100%; border-radius: 7px; }
  .photo svg { display: block; width: 100%; height: auto; border-radius: 7px; }
  .cap { display: block; padding: 4px 2px 0; font-size: clamp(0.5rem, 1.6vw, 0.66rem); font-weight: 800; color: #2a2a22; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck:focus-visible { outline: none; }
  .deck:focus-visible .top { box-shadow: 0 0 0 3px var(--gold), 0 10px 16px -10px rgba(0, 0, 0, 0.6); }
  .hint { position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%); font-size: 0.62rem; font-weight: 700; color: rgba(255, 240, 200, 0.78); white-space: nowrap; pointer-events: none; }

  /* Seats around the rim */
  .seat { position: absolute; z-index: 2; display: grid; justify-items: center; gap: 3px; width: 76px; padding: 0; border: 0; background: none; cursor: pointer; transform: translate(-50%, -50%); transition: opacity 0.3s, filter 0.3s; }
  .seat .face { position: relative; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--g); color: #fff; font-size: 0.95rem; font-weight: 900; letter-spacing: 0.02em; box-shadow: 0 0 0 3px var(--bg), 0 10px 16px -10px var(--shadow); transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1), box-shadow 0.3s; }
  .seat .name { font-size: 0.72rem; font-weight: 750; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 86%, transparent); transition: background 0.3s, color 0.3s; }
  .seat:hover .face { transform: translateY(-3px) scale(1.05); }
  .seat[aria-pressed="true"] .face { transform: translateY(-5px) scale(1.08); box-shadow: 0 0 0 3px var(--gold), 0 0 0 7px color-mix(in srgb, var(--gold) 30%, transparent), 0 14px 18px -10px var(--shadow); }
  .seat[aria-pressed="true"] .name { background: var(--gold); color: #2b1d04; }
  .seat.dim { opacity: 0.32; filter: grayscale(0.7); }
  .seat.match .face { animation: nudge 0.9s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(-6px) scale(1.06); } }
  .seat:focus-visible { outline: none; }
  .seat:focus-visible .face { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--ink); }
  .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events: none; }
  .ring circle { fill: none; stroke: var(--ok); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 207.3; stroke-dashoffset: 207.3; }
  .tick { position: absolute; right: -4px; top: -4px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2.5px var(--bg); transform: scale(0); }
  .tick svg { width: 13px; height: 13px; }
  .num { position: absolute; left: -5px; top: -5px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #2b1d04; font-size: 0.66rem; font-weight: 900; box-shadow: 0 0 0 2.5px var(--bg); transform: scale(0); transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .seat[aria-pressed="true"] .num { transform: scale(1); }
  .peek { position: absolute; right: -14px; bottom: -6px; width: 22px; height: 28px; border-radius: 4px; background: var(--card); box-shadow: 0 4px 8px -3px rgba(0, 0, 0, 0.5); transform: rotate(14deg) scale(0); overflow: hidden; }
  .peek svg { display: block; width: 100%; height: 100%; }

  /* ---------- Controls ---------- */
  .controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; width: 100%; animation: rise 0.9s 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .field { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 15px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line), 0 10px 20px -18px var(--shadow); transition: box-shadow 0.2s; }
  .field:focus-within { box-shadow: inset 0 0 0 2px var(--gold); }
  .field svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
  .field input { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; outline: none; background: none; font-size: 0.88rem; }
  .field input::placeholder { color: var(--muted); }
  .deal { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 48px; padding: 0 20px; border: 0; border-radius: 15px; background: linear-gradient(180deg, #c93e4c, #a12a37); color: #fff; font-weight: 850; font-size: 0.92rem; cursor: pointer; box-shadow: 0 14px 22px -14px rgba(160, 30, 50, 0.95), inset 0 -3px 0 rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), filter 0.2s; white-space: nowrap; overflow: hidden; }
  .deal:hover { transform: translateY(-2px); }
  .deal:active { transform: scale(0.95); }
  .deal svg { width: 19px; height: 19px; }
  .deal .n { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); font-variant-numeric: tabular-nums; }
  .deal.empty { filter: saturate(0.55); }
  .deal .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--gold); transform: scaleX(0); transform-origin: 0 50%; transition: transform 0.4s ease; }

  .toast { position: fixed; left: 50%; bottom: 18px; z-index: 40; display: inline-flex; align-items: center; gap: 9px; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 0.86rem; font-weight: 700; transform: translate(-50%, 200%); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1); }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; flex: none; color: var(--ok); }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .fly { position: absolute; left: 0; top: 0; border-radius: 9px; background: var(--card); padding: 4px; box-shadow: 0 16px 24px -10px rgba(0, 0, 0, 0.55); transform-origin: 50% 50%; }
  .fly svg { display: block; width: 100%; height: auto; border-radius: 6px; }
  .spark { position: absolute; left: 0; top: 0; width: 9px; height: 9px; transform: rotate(45deg); }

  @media (max-width: 560px) {
    .tablewrap { padding: 34px 22px 40px; }
    .seat { width: 62px; }
    .seat .face { width: 44px; height: 44px; font-size: 0.82rem; }
    .seat .name { font-size: 0.64rem; padding: 0 5px; }
    .controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .deal { grid-column: 1 / -1; }
    .hint { display: none; }
    .peek { right: -10px; width: 18px; height: 23px; }
  }
  @media (max-width: 370px) {
    .tablewrap { padding: 30px 18px 36px; }
    .seat .name { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::before, .top, .tablewrap, .controls, .deck .top, .seat.match .face { animation: none !important; }
    .seat .face, .num, .toast, .deal { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="wrap">
      <header class="top">
        <p class="kicker">Share photos</p>
        <h1>Deal the trip album to your friends</h1>
      </header>

      <div class="tablewrap">
        <div class="table" id="table" role="group" aria-label="Friends around the table">
          <div class="felt" aria-hidden="true"></div>
          <button class="deck" id="deck" type="button" aria-label="Next photo">
            <span class="c c3" aria-hidden="true"></span>
            <span class="c c2" aria-hidden="true"></span>
            <span class="c top" id="topCard" aria-hidden="true"><span class="photo" id="photo"></span><span class="cap" id="cap"></span></span>
            <span class="hint" aria-hidden="true">Tap for the next photo</span>
          </button>
        </div>
      </div>

      <div class="controls">
        <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg><span class="sr-only">Find a friend</span><input id="search" type="search" placeholder="Find a friend" autocomplete="off" /></label>
        <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z" /></svg><span class="sr-only">Add a note</span><input id="note" type="text" maxlength="60" placeholder="Add a note" autocomplete="off" /></label>
        <button class="deal empty" id="dealBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="10" height="14" rx="2" transform="rotate(-10 8.5 13)" /><rect x="10" y="4" width="10" height="14" rx="2" transform="rotate(8 15 11)" /></svg><span id="dealText">Deal to</span><span class="n" id="dealN">0</span><span class="bar" id="bar"></span></button>
      </div>
    </div>
    <div class="toast" id="toast" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10" /></svg><span id="toastText"></span></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Deal Out: pick friends around a table, then deal the photo to each of them ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const status = $("#status");
  const say = (t) => { status.textContent = t; };
  let toastTimer = 0;
  function toast(t) {
    $("#toastText").textContent = t;
    $("#toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 2600);
  }

  // ---------- Four trip photos, drawn as small SVG scenes ----------
  const PHOTOS = [
    { name: "Hunza valley", tone: "#f3a37a", svg: '<svg viewBox="0 0 100 92"><defs><linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb38a"/><stop offset="1" stop-color="#ffe2b8"/></linearGradient></defs><rect width="100" height="92" fill="url(#h1)"/><circle cx="72" cy="26" r="10" fill="#fff4d6"/><path d="M0 62 22 30l12 14 16-26 20 30 10-10 20 24v30H0Z" fill="#7a6aa8"/><path d="M22 30l6 8-6-2-5 6Zm28-12 7 11-7-3-6 7Z" fill="#fff"/><path d="M0 70c20-8 38-6 52 0s34 8 48 2v20H0Z" fill="#4f9a5c"/><g fill="#f6c453"><circle cx="16" cy="74" r="3"/><circle cx="26" cy="78" r="2.4"/><circle cx="70" cy="80" r="3"/><circle cx="84" cy="76" r="2.2"/></g></svg>' },
    { name: "Clifton beach", tone: "#7c5bd6", svg: '<svg viewBox="0 0 100 92"><defs><linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4bd0"/><stop offset=".6" stop-color="#ff8a6b"/><stop offset="1" stop-color="#ffc58a"/></linearGradient></defs><rect width="100" height="92" fill="url(#h2)"/><circle cx="50" cy="54" r="14" fill="#ffe08a"/><rect y="54" width="100" height="38" fill="#2f4f9e"/><g stroke="#9fc2ff" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M14 62h18M56 66h22M30 72h26M8 80h16M64 80h24"/></g><path d="M0 84c18-5 34-5 50 0s32 4 50-1v9H0Z" fill="#f2c98d"/></svg>' },
    { name: "Old city night", tone: "#2c3d7a", svg: '<svg viewBox="0 0 100 92"><rect width="100" height="92" fill="#1d2a5e"/><circle cx="78" cy="20" r="8" fill="#fff3c8"/><circle cx="82" cy="17" r="7" fill="#1d2a5e"/><g fill="#fff" opacity=".8"><circle cx="14" cy="14" r="1"/><circle cx="34" cy="24" r=".9"/><circle cx="56" cy="10" r="1.1"/><circle cx="62" cy="30" r=".8"/></g><g fill="#0d1636"><path d="M8 92V56h6v-14l2-4 2 4v14h6v36Z"/><path d="M76 92V56h6v-14l2-4 2 4v14h6v36Z"/><path d="M26 92V60c0-12 24-12 24 0v32Zm24 0V60c0-12 24-12 24 0v32Z"/><path d="M36 50c0-8 14-8 14 0Zm14 0c0-8 14-8 14 0Z"/></g><g fill="#ffcf6b"><rect x="34" y="70" width="4" height="8" rx="2"/><rect x="60" y="70" width="4" height="8" rx="2"/></g></svg>' },
    { name: "Chai at dusk", tone: "#c9763a", svg: '<svg viewBox="0 0 100 92"><defs><linearGradient id="h4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d2a2"/><stop offset="1" stop-color="#e9a66a"/></linearGradient></defs><rect width="100" height="92" fill="url(#h4)"/><rect y="62" width="100" height="30" fill="#8a4f28"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M30 40c-4-5 4-8 0-13M42 40c-4-5 4-8 0-13M66 42c-4-5 4-8 0-13"/></g><path d="M22 46h28l-3 20a5 5 0 0 1-5 4H30a5 5 0 0 1-5-4Z" fill="#fff8ee"/><path d="M50 50h4a5 5 0 0 1 0 10h-5" fill="none" stroke="#fff8ee" stroke-width="3"/><path d="M56 48h24l-3 18a5 5 0 0 1-5 4H64a5 5 0 0 1-5-4Z" fill="#e6f1ff"/><rect x="24" y="48" width="24" height="5" fill="#b8692f"/><rect x="58" y="50" width="20" height="4" fill="#b8692f"/></svg>' }
  ];
  let photoIx = 0;
  function showPhoto() {
    const p = PHOTOS[photoIx];
    $("#photo").innerHTML = p.svg;
    $("#cap").textContent = p.name;
    $("#deck").setAttribute("aria-label", "Photo " + (photoIx + 1) + " of 4: " + p.name + ". Press for the next photo");
  }
  showPhoto();

  // ---------- Friends around the rim ----------
  const FRIENDS = [
    ["Ayesha", "linear-gradient(140deg,#ff8a7a,#d9467a)"], ["Bilal", "linear-gradient(140deg,#5cc3ff,#2f6be0)"],
    ["Zara", "linear-gradient(140deg,#ffd36b,#f08a2c)"], ["Usman", "linear-gradient(140deg,#7ee0b0,#1f9a6a)"],
    ["Hina", "linear-gradient(140deg,#c79bff,#7a4ae0)"], ["Omar", "linear-gradient(140deg,#ff9fd0,#e0508f)"],
    ["Fatima", "linear-gradient(140deg,#9ee6ff,#2aa3c9)"], ["Danish", "linear-gradient(140deg,#ffb07a,#d0582c)"]
  ];
  const table = $("#table");
  const seats = FRIENDS.map(([name, g], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "seat";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", name);
    b.style.setProperty("--g", g);
    // around an ellipse, starting at the top and going clockwise
    const a = -Math.PI / 2 + (i / FRIENDS.length) * Math.PI * 2;
    b.style.left = 50 + Math.cos(a) * 50 + "%";
    b.style.top = 50 + Math.sin(a) * 50 + "%";
    b.innerHTML = '<span class="face" aria-hidden="true">' + name.slice(0, 2).toUpperCase() +
      '<svg class="ring" viewBox="0 0 70 70"><circle cx="35" cy="35" r="33" /></svg>' +
      '<span class="num"></span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg></span><span class="peek"></span></span>' +
      '<span class="name" aria-hidden="true">' + name + "</span>";
    b.addEventListener("click", () => toggle(i));
    b.addEventListener("keydown", (e) => {
      const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      seats[(i + step + seats.length) % seats.length].focus();
    });
    table.appendChild(b);
    return b;
  });
  let picked = []; // seat indexes in the order they were picked
  function toggle(i) {
    if (dealing) return;
    const at = picked.indexOf(i);
    if (at >= 0) picked.splice(at, 1); else picked.push(i);
    const on = at < 0;
    seats[i].setAttribute("aria-pressed", String(on));
    if (on) play(seats[i].querySelector(".face"), [{ transform: "translateY(0) scale(1)" }, { transform: "translateY(-12px) scale(1.16)" }, { transform: "translateY(-5px) scale(1.08)" }], { duration: 520, easing: SPRING });
    refreshPicked();
    say((on ? "Picked " : "Removed ") + FRIENDS[i][0] + ". " + picked.length + " picked.");
  }
  function refreshPicked() {
    picked.forEach((i, k) => { seats[i].querySelector(".num").textContent = k + 1; });
    const n = $("#dealN");
    if (n.textContent !== String(picked.length)) {
      n.textContent = picked.length;
      play(n, [{ transform: "translateY(-60%) scale(.6)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: SPRING });
    }
    $("#dealBtn").classList.toggle("empty", !picked.length);
    $("#dealBtn").setAttribute("aria-label", "Deal the photo to " + picked.length + (picked.length === 1 ? " friend" : " friends"));
  }
  refreshPicked();

  // ---------- Search dims the friends who do not match; Enter picks the first match ----------
  const search = $("#search");
  function filter() {
    const q = search.value.trim().toLowerCase();
    seats.forEach((s, i) => {
      const hit = !q || FRIENDS[i][0].toLowerCase().includes(q);
      s.classList.toggle("dim", !hit);
      s.classList.toggle("match", !!q && hit);
    });
  }
  search.addEventListener("input", filter);
  search.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const q = search.value.trim().toLowerCase();
    const i = FRIENDS.findIndex(([n], k) => q && n.toLowerCase().includes(q) && !picked.includes(k));
    if (i >= 0) toggle(i);
    search.value = ""; filter();
  });

  // ---------- Deck: tap for the next photo (a quick riffle) ----------
  let riffling = false;
  async function riffle(next) {
    if (riffling) return;
    riffling = true;
    const c2 = $("#deck .c2"), c3 = $("#deck .c3"), top = $("#topCard");
    play(c3, [{ transform: "translate(5px,5px) rotate(5deg)" }, { transform: "translate(46%,4px) rotate(14deg)" }, { transform: "translate(5px,5px) rotate(5deg)" }], { duration: 520, easing: "cubic-bezier(.4,0,.3,1)" });
    play(c2, [{ transform: "translate(2px,2px) rotate(-3deg)" }, { transform: "translate(-46%,2px) rotate(-14deg)" }, { transform: "translate(2px,2px) rotate(-3deg)" }], { duration: 520, easing: "cubic-bezier(.4,0,.3,1)" });
    await play(top, [{ transform: "rotateY(0)" }, { transform: "translateY(-8px) rotateY(90deg)" }], { duration: 200, easing: "ease-in" });
    if (next) { photoIx = (photoIx + 1) % PHOTOS.length; showPhoto(); }
    await play(top, [{ transform: "translateY(-8px) rotateY(-90deg)" }, { transform: "translateY(0) rotateY(0)" }], { duration: 380, easing: SPRING });
    riffling = false;
  }
  $("#deck").addEventListener("click", () => { if (!dealing) { riffle(true); say("Showing " + PHOTOS[(photoIx + 1) % 4].name); } });

  // ---------- Deal: shuffle, fly a copy to each friend, fill their ring, tick ----------
  let dealing = false;
  const fx = $("#fx");
  const RING = 207.3;
  async function deal() {
    if (dealing) return;
    if (!picked.length) {
      // nobody picked: the empty seats wiggle to invite a tap
      say("Pick at least one friend first");
      toast("Tap a friend to pick them first");
      seats.forEach((s, k) => play(s.querySelector(".face"), [{ transform: "rotate(0)" }, { transform: "rotate(-10deg)" }, { transform: "rotate(8deg)" }, { transform: "rotate(0)" }], { duration: 420, delay: k * 40 }));
      return;
    }
    dealing = true;
    const order = picked.slice();
    const btn = $("#dealBtn"), bar = $("#bar"), label = $("#dealText");
    const note = $("#note").value.trim();
    clearPeeks();
    // 1. Anticipation: the deck lifts and riffles
    label.textContent = "Shuffling";
    play($("#deck"), [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-56%) scale(1.06)" }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: 640, easing: "ease-in-out" });
    await riffle(false);
    // 2. Main: one copy per friend, flying in an arc with a spin
    label.textContent = "Dealing";
    let done = 0;
    const flights = order.map((i, k) => wait(k * (calm() ? 60 : 170)).then(() => flyTo(i)).then(() => {
      done++;
      bar.style.transform = "scaleX(" + done / order.length + ")";
      label.textContent = "Sent " + done + " of " + order.length;
    }));
    await Promise.all(flights);
    // 4. Finish: sparkle burst and a summary
    const names = order.map((i) => FRIENDS[i][0]);
    const who = names.length === 1 ? names[0] : names.length === 2 ? names.join(" and ") : names.slice(0, 2).join(", ") + " and " + (names.length - 2) + " more";
    toast(PHOTOS[photoIx].name + " sent to " + who + (note ? " · “" + note + "”" : ""));
    say(PHOTOS[photoIx].name + " sent to " + names.join(", ") + (note ? " with the note: " + note : ""));
    label.textContent = "Dealt";
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.06)" }, { transform: "scale(1)" }], { duration: 420, easing: SPRING });
    await wait(calm() ? 900 : 1900);
    // 5. Reset: rings and ticks fade one by one, the seats settle back
    for (const i of order) {
      const s = seats[i];
      s.setAttribute("aria-pressed", "false");
      play(s.querySelector(".tick"), [{ transform: "scale(1)" }, { transform: "scale(0)" }], { duration: 260, fill: "forwards" }).then(() => { s.querySelector(".tick").getAnimations().forEach((a) => a.cancel()); s.querySelector(".tick").style.transform = ""; });
      const ring = s.querySelector(".ring circle");
      ring.style.transition = calm() ? "none" : "stroke-dashoffset .5s ease";
      ring.style.strokeDashoffset = RING;
      await wait(calm() ? 0 : 70);
    }
    picked = [];
    refreshPicked();
    bar.style.transform = "scaleX(0)";
    label.textContent = "Deal to";
    $("#note").value = "";
    dealing = false;
    if (demoOn) queueDemo(2400);
  }
  $("#dealBtn").addEventListener("click", deal);

  function flyTo(i) {
    const seat = seats[i], face = seat.querySelector(".face");
    const from = $("#topCard").getBoundingClientRect(), to = face.getBoundingClientRect();
    const arrive = () => {
      // 3. Progress: the friend catches it, the ring fills, a tick pops and the card tucks in behind
      play(face, [{ transform: "translateY(-5px) scale(1.08)" }, { transform: "translateY(2px) scale(1.16,.9)" }, { transform: "translateY(-5px) scale(1.08)" }], { duration: 420, easing: SPRING });
      const ring = seat.querySelector(".ring circle");
      ring.style.transition = calm() ? "none" : "stroke-dashoffset .62s cubic-bezier(.3,.7,.3,1)";
      ring.style.strokeDashoffset = 0;
      const peek = seat.querySelector(".peek");
      peek.innerHTML = PHOTOS[photoIx].svg.replace(/id="h(\d)"/, 'id="p' + i + '$1"').replace(/url\(#h(\d)\)/, "url(#p" + i + "$1)");
      peek.style.transform = "rotate(14deg) scale(1)";
      play(peek, [{ transform: "rotate(-30deg) scale(.2)" }, { transform: "rotate(14deg) scale(1)" }], { duration: 560, easing: SPRING });
      return wait(calm() ? 0 : 560).then(() => {
        const tick = seat.querySelector(".tick");
        tick.style.transform = "scale(1)";
        play(tick, [{ transform: "scale(0) rotate(-60deg)" }, { transform: "scale(1) rotate(0)" }], { duration: 520, easing: SPRING });
        sparks(to.left + to.width / 2, to.top + to.height / 2);
      });
    };
    if (calm()) return arrive();
    const card = document.createElement("div");
    card.className = "fly";
    card.style.width = from.width + "px";
    card.innerHTML = PHOTOS[photoIx].svg.replace(/id="h(\d)"/, 'id="f' + i + '$1"').replace(/url\(#h(\d)\)/, "url(#f" + i + "$1)");
    fx.appendChild(card);
    const sx = from.left, sy = from.top;
    const ex = to.left + to.width / 2 - from.width / 2, ey = to.top + to.height / 2 - from.height / 2;
    const mx = (sx + ex) / 2, my = Math.min(sy, ey) - 50;
    const spin = (ex > sx ? 1 : -1) * 360;
    return card.animate([
      { transform: "translate(" + sx + "px," + sy + "px) rotate(0) scale(1)", opacity: 1 },
      { transform: "translate(" + sx + "px," + (sy - 14) + "px) rotate(" + spin * 0.04 + "deg) scale(1.05)", offset: 0.12 },
      { transform: "translate(" + mx + "px," + my + "px) rotate(" + spin * 0.6 + "deg) scale(.66)", offset: 0.55 },
      { transform: "translate(" + ex + "px," + ey + "px) rotate(" + (spin + 14) + "deg) scale(.3)", opacity: 1, offset: 0.92 },
      { transform: "translate(" + ex + "px," + ey + "px) rotate(" + (spin + 14) + "deg) scale(.2)", opacity: 0 }
    ], { duration: 720, easing: "cubic-bezier(.3,.6,.3,1)" }).finished.catch(() => {}).then(() => { card.remove(); return arrive(); });
  }
  function clearPeeks() {
    seats.forEach((s) => {
      const p = s.querySelector(".peek");
      if (p.style.transform.includes("scale(1)")) play(p, [{ transform: "rotate(14deg) scale(1)" }, { transform: "rotate(40deg) scale(0)" }], { duration: 260 });
      p.style.transform = "";
    });
  }
  function sparks(x, y) {
    if (calm()) return;
    const cols = ["#e7b84d", "#ffffff", "#ff7a8a", "#7ee0b0"];
    for (let k = 0; k < 10; k++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.background = cols[k % cols.length];
      fx.appendChild(s);
      const a = (k / 10) * Math.PI * 2 + Math.random() * 0.4, d = 30 + Math.random() * 26;
      s.animate([
        { transform: "translate(" + (x - 4) + "px," + (y - 4) + "px) rotate(45deg) scale(.4)", opacity: 1 },
        { transform: "translate(" + (x - 4 + Math.cos(a) * d) + "px," + (y - 4 + Math.sin(a) * d) + "px) rotate(225deg) scale(.9)", opacity: 0 }
      ], { duration: 650 + Math.random() * 250, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Auto-demo: pick a few friends, sometimes via search, then deal; stops on real input ----------
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); search.value = ""; filter(); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  const PLANS = [[0, 1, 4], [2, 5], [3, 6, 7, 1]];
  async function runDemo() {
    if (!demoOn || dealing) return;
    const plan = PLANS[round % PLANS.length];
    if (round % 3 === 1) {
      // search for Zara letter by letter, then pick her
      for (const ch of "za") { if (!demoOn) return; search.value += ch; filter(); await wait(260); }
      await wait(500);
      if (!demoOn) return;
      search.value = ""; filter();
    }
    if (round > 0 && demoOn) { await riffle(true); }
    round++;
    for (const i of plan) { if (!demoOn) return; toggle(i); await wait(420); }
    if (!demoOn) return;
    if (round % 2 === 0) $("#note").value = "Miss you all!";
    await wait(350);
    if (demoOn) deal();
  }
  queueDemo(700);
</script>
</body>
</html>
