<!doctype html>
<!-- Chill & Craft · Deep Bin · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Bin · delete button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --bg1: #f6f6f7;
    --bg2: #e2e2e6;
    --card: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --btn: #f4f4f5;
    --btn-line: #e4e4e7;
    --btn-hover: #ececef;
    --crimson: #e11d48;
    --thumb: #fef3c7;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #1c1c20;
      --bg2: #09090b;
      --card: #1f1f23;
      --text: #fafafa;
      --muted: #a1a1aa;
      --btn: #27272a;
      --btn-line: #3f3f46;
      --btn-hover: #2f2f33;
      --crimson: #fb7185;
      --thumb: #3b3220;
      --focus: #93c5fd;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1c1c20;
    --bg2: #09090b;
    --card: #1f1f23;
    --text: #fafafa;
    --muted: #a1a1aa;
    --btn: #27272a;
    --btn-line: #3f3f46;
    --btn-hover: #2f2f33;
    --crimson: #fb7185;
    --thumb: #3b3220;
    --focus: #93c5fd;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body { overflow-x: hidden; } /* particles may fly past the edges */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2) 80%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; width: 100%; }

  /* Card and "removed" note share one cell, so nothing jumps */
  .slot { display: grid; place-items: center; width: 300px; max-width: 100%; }
  .slot > * { grid-area: 1 / 1; }

  /* ---------- Cart item card ---------- */
  .item {
    width: 100%;
    padding: 16px;
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 20px 40px -26px rgba(0, 0, 0, .55), 0 1px 0 rgba(0, 0, 0, .03);
    transition: transform .7s var(--spring), opacity .35s;
  }
  .row { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .thumb { flex: none; width: 68px; height: 68px; border-radius: 14px; background: var(--thumb); display: grid; place-items: center; transition: transform .5s var(--spring); }
  .item:hover .thumb { transform: rotate(-4deg) scale(1.04); }
  .thumb svg { width: 56px; height: 56px; }
  .info { min-width: 0; }
  .name { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
  .opts { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .price { margin: 0; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Delete button ---------- */
  .del {
    --hx: calc(100% - 32px); /* centre of the can, used by the hole */
    position: relative;
    display: block;
    width: 100%;
    height: 52px;
    padding: 0;
    border: 1px solid var(--btn-line);
    border-radius: 14px;
    background: var(--btn);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    transition: background-color .2s, transform .4s var(--spring);
  }
  .del:hover { background: var(--btn-hover); }
  .del:active { transform: scale(.97); transition-duration: .1s; }
  .del:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .del[aria-disabled="true"] { cursor: default; }

  /* The hole: the inside of the can, seen from above */
  .hole {
    position: absolute;
    inset: 0;
    background:
      repeating-radial-gradient(circle at var(--hx) 50%, rgba(255, 255, 255, .07) 0 2px, transparent 2px 14px),
      radial-gradient(circle at var(--hx) 50%, #000 0 6%, #1c0610 24%, #4c0519 55%, #9f1239 100%);
    clip-path: circle(0px at var(--hx) 50%);
    transition: clip-path .55s cubic-bezier(.7, 0, .3, 1);
  }
  /* A slow swirl inside the hole */
  .hole::after {
    content: "";
    position: absolute;
    left: calc(100% - 32px);
    top: 50%;
    width: 640px;
    height: 640px;
    margin: -320px 0 0 -320px;
    background: repeating-conic-gradient(rgba(255, 255, 255, .07) 0 8deg, transparent 8deg 30deg);
    border-radius: 50%;
    animation: spin 1.6s linear infinite;
  }
  .word { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: color .3s, opacity .3s, transform .4s var(--spring); }
  .word span { display: inline-block; transition: transform .5s cubic-bezier(.6, 0, .9, .5), opacity .4s; }
  .del:hover .word { transform: translateX(-4px); }
  .can { position: absolute; right: 20px; top: 13px; width: 24px; height: 24px; transition: transform .5s cubic-bezier(.6, 0, .4, 1), opacity .4s; }
  .can svg { width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--crimson); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; transform-origin: 50% 100%; }
  .lid { transform-box: fill-box; transform-origin: 100% 100%; transition: transform .35s var(--spring); }
  .del:hover .lid { transform: rotate(16deg); }

  .fx { position: absolute; right: 32px; top: 18px; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }

  /* ---------- States ---------- */
  /* zoom: dive into the can; its dark, swirling inside fills the button */
  .del:is([data-state="zoom"], [data-state="swallow"]) .hole { clip-path: circle(150% at var(--hx) 50%); }
  .del:is([data-state="zoom"], [data-state="swallow"]) .can { transform: scale(3.8) rotate(-12deg); opacity: 0; }
  .del:is([data-state="zoom"], [data-state="swallow"]) .word { color: #fff; transform: none; }
  /* swallow: the word slides to the hole while each letter spins down */
  .del[data-state="swallow"] .word { transform: translateX(calc(50% - 32px)) scale(.15); opacity: 0; transition: transform .65s cubic-bezier(.6, 0, .9, .5), opacity .35s .35s, color .3s; }
  .del[data-state="swallow"] .word span { transform: rotate(-200deg) scale(.4); opacity: 0; transition-delay: calc(var(--i) * 45ms); }
  /* close: the hole shrinks back to the can, which pops up and gulps */
  .del:is([data-state="close"], [data-state="gone"]) .word { opacity: 0; transition: none; }
  .del:is([data-state="close"], [data-state="gone"]) .word span { transition: none; }
  .del[data-state="close"] .can svg { animation: gulp .55s var(--spring); }

  /* Card tips over and falls away; the note springs up */
  .slot[data-open="false"] .item { transform: translateY(18px) rotate(4deg) scale(.88); opacity: 0; visibility: hidden; transition: transform .5s cubic-bezier(.5, 0, .9, .5), opacity .4s .1s, visibility 0s .5s; }
  .removed {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px) scale(.92);
    transition: opacity .3s, transform .3s, visibility 0s .3s;
  }
  .slot[data-open="false"] .removed { opacity: 1; visibility: visible; transform: none; transition: opacity .35s .3s, transform .7s .3s var(--spring), visibility 0s; }
  .removed p { margin: 0; font-size: 14.5px; }
  .removed small { color: var(--muted); font-size: 13px; }
  .undo { padding: 9px 18px; border: 1px solid var(--btn-line); border-radius: 999px; background: var(--card); color: var(--crimson); font: inherit; font-weight: 650; cursor: pointer; transition: transform .35s var(--spring), background-color .2s; }
  .undo:hover { background: var(--btn); transform: scale(1.05); }
  .undo:active { transform: scale(.95); }
  .undo:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes gulp { 0% { transform: scale(.4); } 40% { transform: scale(1.3, .75); } 70% { transform: scale(.92, 1.1); } 100% { transform: scale(1); } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="slot" data-open="true">
    <article class="item" aria-labelledby="itemName">
      <div class="row">
        <div class="thumb" aria-hidden="true">
          <!-- A printed kurta, drawn with SVG -->
          <svg viewBox="0 0 64 64">
            <defs>
              <pattern id="print" width="7" height="7" patternUnits="userSpaceOnUse">
                <circle cx="3.5" cy="3.5" r="1.2" fill="#fff7d6" />
              </pattern>
            </defs>
            <path d="M24 10l4-2q4 4 8 0l4 2 10 7-4 8-4-3v32H22V22l-4 3-4-8z" fill="#d97706" />
            <path d="M24 10l4-2q4 4 8 0l4 2 10 7-4 8-4-3v32H22V22l-4 3-4-8z" fill="url(#print)" />
            <path d="M32 12v14" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" />
            <path d="M22 48h20" stroke="#92400e" stroke-width="2" />
          </svg>
        </div>
        <div class="info">
          <h1 class="name" id="itemName">Printed lawn kurta</h1>
          <p class="opts">Size M · Qty 1</p>
          <p class="price">PKR 4,500</p>
        </div>
      </div>

      <button class="del" type="button" data-state="idle" aria-label="Delete Printed lawn kurta from cart">
        <span class="hole" aria-hidden="true"></span>
        <span class="word" aria-hidden="true"><span style="--i:0">D</span><span style="--i:1">e</span><span style="--i:2">l</span><span style="--i:3">e</span><span style="--i:4">t</span><span style="--i:5">e</span></span>
        <span class="can" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <g class="lid"><path d="M3 6h18" /><path d="M9 6V4.2c0-.7.5-1.2 1.2-1.2h3.6c.7 0 1.2.5 1.2 1.2V6" /></g>
            <path d="M5.5 9l1.1 11.4A2 2 0 0 0 8.6 22h6.8a2 2 0 0 0 2-1.6L18.5 9" />
            <path d="M10 12v6M14 12v6" />
          </svg>
        </span>
        <span class="fx" aria-hidden="true"></span>
      </button>
    </article>

    <div class="removed">
      <p><b>Printed lawn kurta</b> was removed.</p>
      <small>Your cart is empty · PKR 0</small>
      <button class="undo" type="button">Undo</button>
    </div>
  </div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Deep Bin delete button ----------
  const slot = document.querySelector(".slot");
  const del = document.querySelector(".del");
  const can = del.querySelector(".can svg");
  const fx = del.querySelector(".fx");
  const undoBtn = document.querySelector(".undo");
  const status = document.getElementById("status");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  let busy = false;
  let restoreTimer = 0;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // A small puff of dust out of the can
  function puff(count) {
    if (calm()) return;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("i");
      p.className = "particle";
      p.style.background = i % 2 ? "rgba(225, 29, 72, .55)" : "rgba(160, 160, 170, .6)";
      fx.appendChild(p);
      const dx = (i - (count - 1) / 2) * 9;
      p.animate([
        { transform: "translate(-50%, -50%) scale(.3)", opacity: .9 },
        { transform: "translate(calc(-50% + " + dx + "px), calc(-50% - " + (12 + Math.random() * 10).toFixed(1) + "px)) scale(1.4)", opacity: 0 }
      ], { duration: 650, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => p.remove();
    }
  }

  // Each step is a state that CSS draws
  const steps = [
    ["zoom", 560],    // dive into the can
    ["swallow", 720], // the word spirals into the hole
    ["close", 560]    // hole closes, can pops back and gulps
  ];

  del.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    del.setAttribute("aria-disabled", "true");
    status.textContent = "Deleting Printed lawn kurta.";

    // Anticipation: the can wiggles and the button presses in
    await Promise.all([
      play(can, [{ transform: "rotate(0)" }, { transform: "rotate(-14deg)" }, { transform: "rotate(12deg)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(0)" }], { duration: 380, easing: "ease-in-out" }),
      play(del, [{ transform: "scale(1)" }, { transform: "scale(.97, .92)" }, { transform: "scale(1)" }], { duration: 320, easing: "ease-out" })
    ]);

    for (const [state, ms] of steps) {
      del.dataset.state = state;
      if (state === "close") setTimeout(() => puff(5), calm() ? 0 : 220);
      await wait(ms);
    }

    // The card tips away and the note with Undo springs up
    del.dataset.state = "gone";
    slot.dataset.open = "false";
    status.textContent = "Printed lawn kurta was removed from your cart. Undo is available.";
    await wait(500);
    undoBtn.focus();
    restoreTimer = setTimeout(() => restore("Demo reset. The kurta is back in the cart."), 6000);
  });

  // Undo (or the auto reset) brings the card back with a spring
  function restore(message) {
    clearTimeout(restoreTimer);
    const hadFocus = document.activeElement === undoBtn;
    slot.dataset.open = "true";
    del.dataset.state = "idle";
    del.removeAttribute("aria-disabled");
    busy = false;
    status.textContent = message;
    if (hadFocus) del.focus(); // keep keyboard users on the card
  }

  undoBtn.addEventListener("click", () => restore("Undone. Printed lawn kurta is back in your cart."));
</script>
</body>
</html>
