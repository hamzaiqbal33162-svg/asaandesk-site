<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel Deck · Cassette play and pause keys</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f4e7cf;
    --stripe-a: #e2672b;
    --stripe-b: #f1b23b;
    --stripe-c: #8c3b1f;
    --deck: #4a2f22;
    --deck-hi: #6b4532;
    --face: #fbf3e2;
    --ink: #3a2418;
    --muted: #8a6a55;
    --window: #2a1a12;
    --shell: #f7eedc;
    --tape: #5a3524;
    --key: #f6ead2;
    --key-edge: #cdb38c;
    --play: #e2672b;
    --play-edge: #a8461a;
    --led: #ff6a2b;
    --meter: #fff6e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1a120d;
    --stripe-a: #c4562a;
    --stripe-b: #d39a2f;
    --stripe-c: #6e2f19;
    --deck: #2c1d15;
    --deck-hi: #3d2a1f;
    --face: #241812;
    --ink: #f6e6cc;
    --muted: #b39478;
    --window: #120a06;
    --shell: #e9dcc2;
    --tape: #4a2b1c;
    --key: #3a2a20;
    --key-edge: #1d130d;
    --play: #e2672b;
    --play-edge: #8e3b16;
    --led: #ff7a3d;
    --meter: #f3e5c8;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---------- Stage: retro sunset stripes ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 26px 16px; overflow: hidden; background: var(--bg); }
  .stripes { position: absolute; left: -10%; right: -10%; top: 58%; height: 120px; transform: rotate(-8deg); background: linear-gradient(var(--stripe-b) 0 33%, var(--stripe-a) 33% 66%, var(--stripe-c) 66%); opacity: 0.9; }
  .sun { position: absolute; width: 300px; height: 300px; top: 8%; right: 8%; border-radius: 50%; background: repeating-linear-gradient(transparent 0 18px, var(--bg) 18px 24px), linear-gradient(var(--stripe-b), var(--stripe-a)); opacity: 0.35; animation: rise 12s ease-in-out infinite; }
  @keyframes rise { 50% { transform: translateY(14px); } }

  /* ---------- Deck ---------- */
  .deck { position: relative; width: min(460px, 100%); padding: 16px; border-radius: 26px; background: linear-gradient(180deg, var(--deck-hi), var(--deck)); box-shadow: 0 2px 0 rgba(255, 255, 255, 0.12) inset, 0 40px 70px -36px rgba(40, 15, 0, 0.75); }
  .bay { position: relative; padding: 12px; border-radius: 16px; background: var(--window); box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.6); }
  .bay svg { display: block; width: 100%; height: auto; overflow: visible; }
  .glass { position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(115deg, rgba(255, 255, 255, 0.14) 0 22%, transparent 22% 34%, rgba(255, 255, 255, 0.07) 34% 40%, transparent 40%); pointer-events: none; }
  .led { position: absolute; top: 10px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #5a3a2a; }
  .led.on { background: var(--led); box-shadow: 0 0 10px var(--led); animation: led 1.6s ease-in-out infinite; }
  @keyframes led { 50% { opacity: 0.6; } }

  .info { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin: 14px 2px 14px; color: #f6e6cc; }
  .now { min-width: 0; }
  .now small { display: block; font-size: 0.66rem; letter-spacing: 0.14em; font-weight: 800; opacity: 0.65; }
  .now b { display: block; margin-top: 3px; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now > span { display: flex; align-items: center; gap: 10px; margin-top: 4px; font: 600 0.78rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; opacity: 0.85; }
  .counter { display: inline-flex; padding: 3px 4px; border-radius: 5px; background: #120a06; box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8); }
  .counter .d { display: block; width: 0.8em; height: 1.1em; overflow: hidden; text-align: center; color: #fff1d6; }
  .counter .strip { display: block; }
  .counter .strip i { display: block; height: 1.1em; line-height: 1.1em; font-style: normal; }
  .meters { display: flex; gap: 8px; }
  .meter { width: 74px; height: 48px; border-radius: 8px; background: var(--meter); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25), inset 0 6px 10px rgba(255, 190, 120, 0.35); overflow: hidden; }
  .meter svg { display: block; width: 100%; height: 100%; }

  /* ---------- Piano keys ---------- */
  .keys { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; }
  .key {
    position: relative;
    height: 58px;
    border: 0;
    border-radius: 10px 10px 14px 14px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--key) 100%, #fff 10%), var(--key));
    color: var(--ink);
    box-shadow: 0 7px 0 var(--key-edge), 0 12px 14px -6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: transform 0.09s ease-out, box-shadow 0.09s ease-out;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .key svg { width: 26px; height: 26px; display: block; margin: 0 auto; overflow: visible; }
  .key.down, .key[aria-pressed="true"] { transform: translateY(5px); box-shadow: 0 2px 0 var(--key-edge), 0 4px 8px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  .key:focus-visible { outline: 3px solid var(--stripe-b); outline-offset: 4px; }
  .key.play { background: linear-gradient(180deg, color-mix(in srgb, var(--play) 85%, #fff 15%), var(--play)); color: #fff8ec; box-shadow: 0 7px 0 var(--play-edge), 0 12px 14px -6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .key.play.down, .key.play[aria-pressed="true"] { box-shadow: 0 2px 0 var(--play-edge), 0 4px 8px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  .key small { display: block; margin-top: 3px; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.1em; opacity: 0.7; }
  #pp { d: path("M8 5 L13 7.9 L13 16.1 L8 19 Z M13 7.9 L19 12 L19 12 L13 16.1 Z"); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 420px) {
    .deck { padding: 12px; }
    .bay { padding: 8px; }
    .meter { width: 58px; height: 40px; }
    .key { height: 52px; }
  }
  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .deck { scale: 1.3; } }
  @media (prefers-reduced-motion: reduce) {
    .sun, .led.on { animation: none; }
    .key { transition: none; }
  }
</style>
</head>
<body>

    <span class="sun" aria-hidden="true"></span><span class="stripes" aria-hidden="true"></span>
    <section class="deck" id="deck" aria-label="Cassette player">
      <div class="bay">
        <svg viewBox="0 0 320 196" aria-hidden="true">
          <defs>

            <linearGradient id="lbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--shell)" /><stop offset="1" style="stop-color: var(--shell)" /></linearGradient>
          </defs>

            <text x="38" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#8c3b1f">SIDE A</text>
            <text x="98" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#3a2418">Sunday mixtape</text>
            <text x="252" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#8a6a55">C60</text>

              <circle id="packL" cx="118" cy="102" r="38" style="fill: var(--tape)" />

            <g id="hubR" transform="translate(202 102)"><circle r="13" fill="#f7f1e4" /><circle r="7.5" fill="#1d120c" /><g fill="#f7f1e4"><rect x="-1.6" y="-8.4" width="3.2" height="4" /><rect x="-1.6" y="-8.4" width="3.2" height="4" transform="rotate(60)" /><rect x="-1.6" y="-8.4" width="3.2" height="4" transform="rotate(120)" /><rect x="-1.6" y="-8.4" width="3.2" height="4" transform="rotate(180)" /><rect x="-1.6" y="-8.4" width="3.2" height="4" transform="rotate(240)" /><rect x="-1.6" y="-8.4" width="3.2" height="4" transform="rotate(300)" /></g></g>
            <rect x="76" y="76" width="168" height="52" rx="10" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2" />
            <!-- lower trapezoid with the tape running past the head -->
            <path d="M70 190 L84 150 H236 L250 190 Z" style="fill: var(--shell)" stroke="#000" stroke-opacity="0.12" />
            <path id="tapeline" d="M84 170 H236" style="stroke: var(--tape)" stroke-width="3" />
            <circle cx="40" cy="168" r="5" fill="none" stroke="#000" stroke-opacity="0.2" /><circle cx="280" cy="168" r="5" fill="none" stroke="#000" stroke-opacity="0.2" />
            <circle cx="104" cy="170" r="6" fill="#d9cdb4" /><circle cx="216" cy="170" r="6" fill="#d9cdb4" />

        </svg>
        <span class="glass" aria-hidden="true"></span>
        <span class="led" id="led" aria-hidden="true"></span>
      </div>

      <div class="info">
        <div class="now">
          <small>NOW PLAYING</small>
          <b id="title">Monsoon Drive</b>
          <span><span class="counter" id="counter" aria-hidden="true"></span><span id="time">0:00 / 4:00</span></span>
        </div>
        <div class="meters" aria-hidden="true">
          <div class="meter"><svg viewBox="0 0 74 48"><path d="M10 40 A30 30 0 0 1 64 40" fill="none" stroke="#3a2418" stroke-opacity="0.35" stroke-width="1" /><path d="M50 18 A30 30 0 0 1 64 40" fill="none" stroke="#e23d2b" stroke-width="3" /><g id="ticksL" stroke="#3a2418" stroke-opacity="0.55"></g><text x="8" y="16" font-size="6" font-weight="800" fill="#3a2418" opacity="0.6">VU L</text><line id="needleL" x1="37" y1="46" x2="37" y2="12" stroke="#1d120c" stroke-width="1.4" stroke-linecap="round" /><circle cx="37" cy="46" r="4" fill="#3a2418" /></svg></div>
          <div class="meter"><svg viewBox="0 0 74 48"><path d="M10 40 A30 30 0 0 1 64 40" fill="none" stroke="#3a2418" stroke-opacity="0.35" stroke-width="1" /><path d="M50 18 A30 30 0 0 1 64 40" fill="none" stroke="#e23d2b" stroke-width="3" /><g id="ticksR" stroke="#3a2418" stroke-opacity="0.55"></g><text x="8" y="16" font-size="6" font-weight="800" fill="#3a2418" opacity="0.6">VU R</text><line id="needleR" x1="37" y1="46" x2="37" y2="12" stroke="#1d120c" stroke-width="1.4" stroke-linecap="round" /><circle cx="37" cy="46" r="4" fill="#3a2418" /></svg></div>

        <button class="key" id="ff" type="button" aria-label="Next song. Hold to fast forward."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6 L12 12 L4 18 Z M12 6 L20 12 L12 18 Z" fill="currentColor" /></svg><small>FF</small></button>

<script>
  // Reel Deck: a cassette player with chunky piano keys.
  // Play = the key thunks down and the deck jolts (anticipation) → the motor spins the reels up and the VU needles
  // jump (main) → the tape moves from one reel to the other, the counter rolls and the needles dance (progress) →
  // pause lets the reels coast to a stop, the needles drop and the key springs up (finish). REW / FF wind the tape.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var play = $("play"), rew = $("rew"), ff = $("ff"), pp = $("pp"), deck = $("deck"), cassette = $("cassette"), led = $("led");
    var hubL = $("hubL"), hubR = $("hubR"), packL = $("packL"), packR = $("packR"), sheenL = $("sheenL"), roller = $("roller");
    var needleL = $("needleL"), needleR = $("needleR"), title = $("title"), time = $("time"), counter = $("counter"), status = $("status");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var PLAY = "M8 5 L13 7.9 L13 16.1 L8 19 Z M13 7.9 L19 12 L19 12 L13 16.1 Z";
    var PAUSE = "M6.5 5 L10.5 5 L10.5 19 L6.5 19 Z M13.5 5 L17.5 5 L17.5 19 L13.5 19 Z";
    var SONGS = [["Monsoon Drive", 0], ["Chai at Midnight", 58], ["Coastal Highway", 121], ["Rooftop Kites", 182]];
    var LENGTH = 240, RMIN = 17, RMAX = 38;

    // ---------- Tape state ----------
    var T = { pos: 0, speed: 0, target: 0, playing: false, seekTo: null, angL: 0, angR: 0, vuL: 0, vuR: 0, vvL: 0, vvR: 0, rollA: 0 };
    var song = -1;

    function fmt(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

    // VU meter ticks
    ["ticksL", "ticksR"].forEach(function (id) {
      var g = $(id);
      for (var k = 0; k <= 8; k++) {
        var a = (-50 + k * 12.5) * Math.PI / 180;
        var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("x1", (37 + Math.sin(a) * 28).toFixed(1)); l.setAttribute("y1", (46 - Math.cos(a) * 28).toFixed(1));
        l.setAttribute("x2", (37 + Math.sin(a) * (k % 2 ? 31 : 33)).toFixed(1)); l.setAttribute("y2", (46 - Math.cos(a) * (k % 2 ? 31 : 33)).toFixed(1));
        g.appendChild(l);
      }
    });

    // ---------- Mechanical counter (three rolling digits) ----------
    var strips = [];
    for (var d = 0; d < 3; d++) {
      var wrap = document.createElement("span"); wrap.className = "d";
      var s = document.createElement("span"); s.className = "strip";
      for (var n = 0; n <= 10; n++) { var i = document.createElement("i"); i.textContent = n % 10; s.appendChild(i); }
      wrap.appendChild(s); counter.appendChild(wrap); strips.push(s);
    }
    function setCounter(c) {
      c = ((c % 1000) + 1000) % 1000;
      var v0 = c % 10, carry = Math.max(0, v0 - 9);
      var t1 = Math.floor(c / 10) % 10, v1 = t1 + carry;
      var v2 = Math.floor(c / 100) % 10 + (t1 === 9 ? carry : 0);
      [v2, v1, v0].forEach(function (v, k) { strips[k].style.transform = "translateY(" + (-v * (100 / 11)).toFixed(3) + "%)"; });
    }

    // ---------- One loop drives reels, packs, counter, needles ----------
    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      // seeking (REW/FF taps) winds fast toward a spot, then falls back to play or stop
      var tgt = T.target;
      if (T.seekTo !== null) {
        var gap = T.seekTo - T.pos;
        tgt = Math.sign(gap) * Math.min(60, 2 + Math.abs(gap) * 1.6);
        if (Math.abs(gap) < 0.6) { T.pos = T.seekTo; T.seekTo = null; tgt = T.target; }
      }
      // the motor has inertia: spin up and coast down instead of jumping
      var k = calm.matches ? 1 : 1 - Math.exp(-dt / (Math.abs(tgt) > Math.abs(T.speed) ? 0.22 : 0.35));
      T.speed += (tgt - T.speed) * k;
      if (Math.abs(T.speed) < 0.002 && tgt === 0) T.speed = 0;
      var before = T.pos;
      T.pos = Math.max(0, Math.min(LENGTH, T.pos + T.speed * dt));
      var moved = dt > 0 ? (T.pos - before) / dt : 0; // real tape speed (zero when stuck at either end)
      if (T.pos >= LENGTH && T.playing && T.seekTo === null) endOfSide();
      if (T.pos <= 0 && T.speed < 0 && T.seekTo === null) T.speed = 0;

      // tape moves from left to right: the packs keep their area, so radii follow a square root
      var p = T.pos / LENGTH;
      var rL = Math.sqrt(RMIN * RMIN + (RMAX * RMAX - RMIN * RMIN) * (1 - p));
      var rR = Math.sqrt(RMIN * RMIN + (RMAX * RMAX - RMIN * RMIN) * p);
      packL.setAttribute("r", rL.toFixed(2)); sheenL.setAttribute("r", (rL - 5).toFixed(2));
      packR.setAttribute("r", rR.toFixed(2));
      // the tape runs at one speed, so a small reel turns faster than a big one
      var tape = moved * 28; // px of tape per second (28 at normal speed)
      T.angL += (tape / rL) * dt * 57.3; T.angR += (tape / rR) * dt * 57.3;
      hubL.setAttribute("transform", "translate(118 102) rotate(" + (T.angL % 360).toFixed(2) + ")");
      hubR.setAttribute("transform", "translate(202 102) rotate(" + (T.angR % 360).toFixed(2) + ")");
      T.rollA += tape / 7 * dt * 57.3;
      roller.setAttribute("transform", "translate(236 182) rotate(" + (T.rollA % 360).toFixed(1) + ")");

      setCounter(T.pos * 2.5);
      time.textContent = fmt(T.pos) + " / " + fmt(LENGTH);
      var cur = 0;
      for (var q = 0; q < SONGS.length; q++) if (T.pos >= SONGS[q][1]) cur = q;
      if (cur !== song) { song = cur; showTitle(SONGS[cur][0]); }

      // VU needles: music when playing, a whine when winding, a faint tremble at rest
      var t = now / 1000, level = 0, levelR = 0;
      if (T.playing && T.seekTo === null) {
        var beat = Math.pow(Math.abs(Math.sin(t * Math.PI * 1.9)), 6);
        level = 0.45 + 0.25 * Math.sin(t * 7.3) * Math.sin(t * 2.1) + beat * 0.3 + (Math.random() - 0.5) * 0.12;
        levelR = 0.45 + 0.25 * Math.sin(t * 6.1 + 1) * Math.sin(t * 1.7) + beat * 0.28 + (Math.random() - 0.5) * 0.12;
        level *= Math.min(1, Math.abs(T.speed)); levelR *= Math.min(1, Math.abs(T.speed));
      } else if (T.seekTo !== null || Math.abs(T.speed) > 1.5) { level = 0.2 + Math.random() * 0.06; levelR = level; }
      else if (!calm.matches) { level = 0.02 + Math.sin(t * 3) * 0.01; levelR = 0.02 + Math.cos(t * 2.6) * 0.01; }
      T.vvL += (-260 * (T.vuL - level) - 16 * T.vvL) * dt; T.vuL += T.vvL * dt;
      T.vvR += (-260 * (T.vuR - levelR) - 16 * T.vvR) * dt; T.vuR += T.vvR * dt;
      if (calm.matches) { T.vuL = level; T.vuR = levelR; }
      needleL.setAttribute("transform", "rotate(" + (-50 + Math.max(-0.05, Math.min(1.08, T.vuL)) * 100).toFixed(1) + " 37 46)");
      needleR.setAttribute("transform", "rotate(" + (-50 + Math.max(-0.05, Math.min(1.08, T.vuR)) * 100).toFixed(1) + " 37 46)");
      requestAnimationFrame(frame);
    }

    function showTitle(text) {
      if (title.textContent === text) return;
      if (calm.matches || song < 0) { title.textContent = text; return; }
      title.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-8px)" }], { duration: 160, easing: "ease-in" }).finished.then(function () {
        title.textContent = text;
        title.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: "ease-out" });
      }).catch(function () { title.textContent = text; });
      if (T.playing) status.textContent = "Now playing " + text + ".";
    }

    // ---------- Play / pause ----------
    function morphIcon(to) {
      if (calm.matches) { pp.style.d = 'path("' + to + '")'; return; }
      pp.animate([{ d: 'path("' + (to === PLAY ? PAUSE : PLAY) + '")' }, { d: 'path("' + to + '")' }], { duration: 260, easing: "cubic-bezier(0.3, 0.7, 0.3, 1)" });
      pp.style.d = 'path("' + to + '")';
    }
    function thunk() {
      if (calm.matches) return;
      cassette.animate([{ transform: "translateY(0)" }, { transform: "translateY(1.5px)" }, { transform: "translateY(-0.6px)" }, { transform: "none" }], { duration: 200, easing: "ease-out" });
      deck.animate([{ transform: "none" }, { transform: "translateY(1px)" }, { transform: "none" }], { duration: 140, easing: "ease-out" });
    }
    function setPlaying(on) {
      if (on === T.playing) return;
      if (on && T.pos >= LENGTH - 0.5) { T.seekTo = 0; status.textContent = "Rewinding to the start."; }
      T.playing = on;
      play.setAttribute("aria-pressed", String(on));
      play.setAttribute("aria-label", on ? "Pause" : "Play");
      $("pplabel").textContent = on ? "PAUSE" : "PLAY";
      led.classList.toggle("on", on);
      morphIcon(on ? PAUSE : PLAY);
      thunk();
      if (on) {
        // the motor engages a beat after the key goes down
        setTimeout(function () { if (T.playing) T.target = 1; }, calm.matches ? 0 : 110);
        if (T.seekTo === null) status.textContent = "Playing " + SONGS[song < 0 ? 0 : song][0] + ".";
      } else {
        T.target = 0;
        status.textContent = "Paused at " + fmt(T.pos) + ".";
        // the key springs back up with a bounce
        if (!calm.matches) play.animate([{ transform: "translateY(5px)" }, { transform: "translateY(-3px)", offset: 0.45 }, { transform: "translateY(1px)", offset: 0.75 }, { transform: "none" }], { duration: 360, easing: "ease-out" });
      }
    }
    function endOfSide() {
      setPlaying(false);
      T.pos = LENGTH;
      status.textContent = "End of side A. Press play to rewind and start again.";
    }
    play.addEventListener("click", function () { setPlaying(!T.playing); });

    // ---------- REW / FF: tap jumps a song, hold winds ----------
    function wind(btn, dir) {
      var holdT = 0, held = false;
      function down() {
        btn.classList.add("down");
        held = false;
        clearTimeout(holdT);
        holdT = setTimeout(function () { held = true; T.seekTo = null; T.target = dir * 8; status.textContent = dir > 0 ? "Fast forwarding." : "Rewinding."; }, 260);
      }
      function up(e) {
        if (!btn.classList.contains("down")) return;
        btn.classList.remove("down");
        clearTimeout(holdT);
        if (held) { T.target = T.playing ? 1 : 0; held = false; }
        else if (e && e.type !== "pointercancel") skip(dir);
        thunk();
      }
      btn.addEventListener("pointerdown", function (e) { if (e.button === 0) { btn.setPointerCapture(e.pointerId); down(); } });
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); down(); } });
      btn.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); up(e); } });
      btn.addEventListener("blur", function () { up({ type: "pointercancel" }); });
      // a click without a press (screen readers) still skips
      btn.addEventListener("click", function (e) { if (e.detail === 0 && !btn.classList.contains("down") && !held) skip(dir); });
    }
    function skip(dir) {
      var cur = 0;
      for (var q = 0; q < SONGS.length; q++) if (T.pos >= SONGS[q][1]) cur = q;
      var to;
      if (dir > 0) to = cur + 1 < SONGS.length ? SONGS[cur + 1][1] : LENGTH;
      else to = T.pos - SONGS[cur][1] > 3 || cur === 0 ? SONGS[cur][1] : SONGS[cur - 1][1];
      T.seekTo = to;
      if (calm.matches) { T.pos = to; T.seekTo = null; }
      var name = to >= LENGTH ? "the end of side A" : SONGS.filter(function (x) { return x[1] === to; })[0][0];
      status.textContent = (dir > 0 ? "Winding forward to " : "Winding back to ") + name + ".";
    }
    wind(rew, -1);
    wind(ff, 1);

    setCounter(0);
    requestAnimationFrame(frame);

    // ---------- Auto demo: play, skip a song, pause, play again ----------
    var demoOn = !calm.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(function () { if (demoOn) fn(); }, ms)); }
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; timers.forEach(clearTimeout); [rew, ff].forEach(function (b) { b.classList.remove("down"); }); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function press(btn, ms, fn) { btn.classList.add("down"); later(function () { btn.classList.remove("down"); fn(); thunk(); }, ms); }
    function demo() {
      setPlaying(true);
      later(function () { press(ff, 160, function () { skip(1); }); }, 3600);
      later(function () { setPlaying(false); }, 6600);
      later(demo, 8200);
    }
    if (demoOn) later(demo, 380);
  })();
</script>
</body>
</html>
