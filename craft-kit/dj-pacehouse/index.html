<!doctype html>
<!-- Chill & Craft · Pacehouse · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pacehouse · training and club app for runners</title>
<style>
/* ===== Core: reset, charts, toasts, modals, tables (theme comes from variables) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:var(--bg);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:200;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 46%);flex:none}
/* entrance */
.cc-in{animation:var(--enter,ccRise) .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes ccFade{from{opacity:0}}
/* charts */
.cc-chart{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.cc-grid{stroke:var(--grid,var(--line));stroke-width:1}
.cc-ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,0,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.cc-area{animation:ccFade 1s .35s both}
.cc-guide{stroke:var(--mut);stroke-dasharray:3 3;pointer-events:none}
.cc-dots{pointer-events:none}.cc-dots circle{stroke:var(--card-solid,#fff);stroke-width:2}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.cc-col{fill:var(--fg);fill-opacity:0;transition:fill-opacity .15s}.cc-col:hover{fill-opacity:.06}
.cc-seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke-width .2s}
.cc-seg:hover{stroke-width:calc(var(--th) + 5px)!important}
.cc-cell{animation:ccFade .5s both;animation-delay:calc(var(--i,0) * 7ms)}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.cc-legend i,.cc-tip i,.cc-dleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none}
.cc-tip{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:240px}
.cc-tip b{font-weight:700}
.cc-empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:14px}
.cc-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cc-donut-w{position:relative;flex:none}
.cc-donut-w svg{display:block}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:20px;line-height:1.1}.cc-donut-c span{font-size:11px;color:var(--mut)}
.cc-dleg{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:13px}
.cc-dleg li{display:flex;align-items:center;gap:4px}.cc-dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc-dleg em{font-style:normal;color:var(--mut);width:38px;text-align:right}
.cc-gauge{position:relative;margin:auto}.cc-gauge svg{display:block}
.cc-gv{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.cc-gauge-c{position:absolute;inset:0 0 10% 0;display:grid;place-content:center;text-align:center}
.cc-gauge-c b{font-size:24px;line-height:1.1}.cc-gauge-c span{font-size:11px;color:var(--mut)}
.cc-hbars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cc-hbars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.cc-hbars i{grid-column:1/-1;height:7px;border-radius:9px;background:var(--track,var(--line));overflow:hidden}
.cc-hbars em{display:block;height:100%;width:var(--w);border-radius:inherit;animation:ccBarW .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes ccBarW{from{width:0}}
.cc-ringv{animation:ccRing 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ccRing{from{stroke-dasharray:0 var(--c)}}
/* toasts */
.cc-toasts{position:fixed;z-index:1001;bottom:16px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.cc-toast{pointer-events:auto;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;animation:ccToast .38s cubic-bezier(.2,.8,.2,1)}
.cc-toast .ic{width:18px;height:18px;color:var(--ok,#3c9)}.cc-toast.bad .ic{color:var(--bad,#e55)}
.cc-toast.out{opacity:0;transform:translateY(8px);transition:.25s}
.cc-toast button{background:none;border:0;color:var(--tipacc,var(--acc));font-weight:700;padding:0 0 0 6px}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* modal and drawer */
.cc-back{position:fixed;inset:0;z-index:900;background:var(--scrim,rgba(8,10,14,.5));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cc-back.cc-on{opacity:1}.cc-back.cc-out{opacity:0;pointer-events:none}
.cc-modal{background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:var(--rm,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:none}
.cc-on .cc-modal{transform:none}
.cc-small{width:min(420px,100%)}
.cc-drawer-back{place-items:stretch end;padding:0}
.cc-drawer{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rm,16px) 0 0 var(--rm,16px);transform:translateX(100%)}
.cc-mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:2}
.cc-mhead h2{margin:0;font-size:18px;line-height:1.25}
.cc-x{background:none;border:0;padding:6px;border-radius:10px;display:grid;color:var(--mut)}
.cc-x:hover{background:var(--hover)}
.cc-mbody{padding:8px 20px 20px}
.cc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cc-confirm{margin:4px 0 0;color:var(--mut)}
.cc-hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cc-field.full{grid-column:1/-1}
.cc-field label{font-size:12px;font-weight:600;color:var(--mut)}
.cc-field input,.cc-field select,.cc-field textarea{border:1px solid var(--line);background:var(--inp,transparent);border-radius:var(--ri,10px);padding:9px 11px;min-width:0;width:100%}
.cc-field select option{background:var(--card-solid,#fff);color:var(--fg)}
.cc-field [aria-invalid=true]{border-color:var(--bad,#e55)}
.cc-err{color:var(--bad,#e55);font-size:12px}
.cc-err:empty{display:none}
.cc-shake{animation:ccShake .38s}
@keyframes ccShake{25%{translate:-7px 0}75%{translate:7px 0}}
@media (max-width:520px){.cc-fields{grid-template-columns:1fr}.cc-drawer{border-radius:0}}
/* table */
.cc-ttools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cc-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:1 1 180px;max-width:320px;color:var(--mut);background:var(--inp,transparent)}
.cc-search .ic{width:16px;height:16px}
.cc-search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--fg)}
.cc-search:focus-within{outline:2px solid var(--focus,var(--acc));outline-offset:1px}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap}
.cc-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);transition:background .2s,color .2s,border-color .2s}
.cc-chip:hover{color:var(--fg)}
.cc-chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.cc-twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.cc-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cc-table th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.cc-table th button:focus-visible{outline:2px solid var(--focus,var(--acc))}
.cc-sort::after{content:"\2195";opacity:.35;font-style:normal}
[aria-sort=ascending] .cc-sort::after{content:"\2191";opacity:1}
[aria-sort=descending] .cc-sort::after{content:"\2193";opacity:1}
.cc-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table .num{text-align:right;font-variant-numeric:tabular-nums}
.cc-table th.num button{flex-direction:row-reverse}
.cc-click{cursor:pointer;transition:background .15s}.cc-click:hover{background:var(--hover)}
.cc-pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.cc-pager div{display:flex;gap:6px}
/* popovers, menus, bell */
.cc-pop{position:fixed;z-index:950;background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);min-width:220px;max-width:min(340px,calc(100vw - 16px));opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.cc-pop.cc-on{opacity:1;transform:none}
.cc-menu{display:flex;flex-direction:column;padding:6px;max-height:60vh;overflow:auto}
.cc-menu-t{font-size:12px;color:var(--mut);padding:6px 10px}
.cc-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}
.cc-menu button:hover,.cc-menu button:focus{background:var(--hover)}
.cc-bell{width:320px;max-width:100%}
.cc-bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cc-bell ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.cc-bell li button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px;border-radius:10px;font-size:13px;align-items:flex-start}
.cc-bell li button:hover{background:var(--hover)}
.cc-bell li.unread button{font-weight:600}
.cc-bell li.unread button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin:6px 0 0 auto;flex:none}
.cc-bell small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.cc-link{background:none;border:0;color:var(--acc);font-size:12px;font-weight:600;padding:2px}
.cc-clear{display:block;margin:0 auto 10px}
.cc-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad,#e5484d);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes ccPop{from{transform:scale(0)}}
/* range switch */
.cc-seg{position:relative;display:inline-flex;background:var(--seg,var(--hover));border-radius:999px;padding:3px;flex:none}
.cc-seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut);border-radius:999px;transition:color .2s}
.cc-seg button[aria-pressed=true]{color:var(--segfg,var(--fg))}
.cc-seg-ind{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:999px;background:var(--segind,var(--card-solid,#fff));box-shadow:0 1px 5px rgba(0,0,0,.16);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s}
/* drag and drop */
.cc-ghost{opacity:.94;box-shadow:0 22px 44px rgba(0,0,0,.32)!important;animation:none!important;transition:none!important}
.cc-dragging{opacity:.35}
.cc-over{outline:2px dashed var(--acc)!important;outline-offset:-3px}
.cc-dragmode,.cc-dragmode *{cursor:grabbing!important;user-select:none}
/* command search */
.cc-cmdk{width:min(560px,100%);align-self:start;margin-top:10vh}
.cc-cmdk-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--inp,transparent);outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0}
.cc-cmdk-list button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.cc-cmdk-list [aria-selected=true] button{background:var(--hover);color:var(--acc)}
.cc-hidden *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.cc-draw{stroke-dashoffset:0}}
/* ===== Pacehouse look: race black and electric lime, italic numbers, sharp corners ===== */
:root{--bg:#f3f4ee;--card:#fff;--card-solid:#fff;--modal:#fff;--fg:#10120b;--mut:#666d58;--line:#e1e4d6;--grid:#eceee4;--hover:rgba(16,18,11,.05);--track:#e6e9db;--inp:#fafbf6;
--lime:#c6ff3d;--acc:#4f7d00;--onacc:#fff;--hot:#ff5a2c;--c1:#7cb300;--c2:#ff5a2c;--c3:#2f7fd8;--c4:#9b59d0;--c5:#8a917a;--ok:#4f9a00;--bad:#e2402a;--warn:#e89a00;
--side:#0d0e0a;--sidefg:#eef3df;--sidemut:#8d957b;--tipbg:#10120b;--tipfg:#f1f5e6;--tipacc:#c6ff3d;--rm:6px;--ri:4px;--enter:phIn;--map1:#e9ecdf;--map2:#dfe3d2;--road:#fff;--park:#cfe3b0;--water:#a8cfe8}
[data-theme=dark]{--bg:#0b0c09;--card:#14160f;--card-solid:#17190f;--modal:#17190f;--fg:#f1f5e6;--mut:#8d957b;--line:#262a1d;--grid:#1d2016;--hover:rgba(198,255,61,.06);--track:#252a1b;--inp:#101209;
--acc:#c6ff3d;--onacc:#0b0c09;--c1:#c6ff3d;--c2:#ff6a3d;--c3:#58a6ff;--c4:#c084fc;--c5:#7c846a;--ok:#c6ff3d;--bad:#ff6a4d;--warn:#ffc04d;--tipbg:#f1f5e6;--tipfg:#0b0c09;--tipacc:#4f7d00;--map1:#15180f;--map2:#1b1f14;--road:#2a2f20;--park:#1f3014;--water:#173246}
@keyframes phIn{from{opacity:0;transform:translateX(26px) skewX(-5deg)}}
body{background:var(--bg)}
.num,.big{font-style:italic;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--sidefg);display:flex;flex-direction:column;padding:20px 0;z-index:30;overflow:hidden}
.side::after{content:"";position:absolute;right:-60px;bottom:-40px;width:200px;height:200px;border:28px solid rgba(198,255,61,.08);border-radius:50%;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 22px;color:inherit;text-decoration:none}
.brand svg{width:40px;height:40px}.brand b{font-size:19px;font-style:italic;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.nav{position:relative;display:flex;flex-direction:column;padding:0 12px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 14px;color:var(--sidemut);text-decoration:none;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;transition:color .2s}
.nav a:hover{color:var(--sidefg)}.nav a[aria-current=page]{color:#0b0c09}
.nav-marker{position:absolute;left:0;top:0;background:#c6ff3d;transform-origin:left;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);transition:transform .45s cubic-bezier(.3,1.3,.4,1),width .3s,height .3s}
.side-foot{margin-top:auto;padding:14px 20px;font-size:12px;color:var(--sidemut);position:relative;z-index:1}
.side-foot b{display:block;color:var(--sidefg);font-size:14px}
.main{min-width:0;overflow-x:clip}
.top{display:flex;align-items:center;gap:10px;padding:14px 26px;border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.top h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut)}
.ib{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);transition:transform .12s}
.ib:active{transform:scale(.92)}
[data-theme=dark] .ib .sun,[data-theme=light] .ib .moon{display:none}
.menu{display:none}
.view{padding:22px 26px 50px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:38px;font-style:italic;font-weight:900;letter-spacing:-.04em;text-transform:uppercase;line-height:1}
.ph p{margin:6px 0 0;color:var(--mut)}
.g{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card::after{content:"";position:absolute;right:0;top:0;width:34px;height:34px;background:linear-gradient(225deg,var(--lime) 50%,transparent 50%);opacity:.9;pointer-events:none}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);flex-wrap:wrap;padding-right:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card-solid);border-radius:4px;padding:9px 14px;font-weight:800;font-size:13px;color:var(--fg);text-transform:uppercase;letter-spacing:.04em;transition:transform .1s,background .2s}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.95)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:#0b0c09}
.btn.ghost{background:transparent}.btn.sm{padding:5px 9px;font-size:11px}.btn .ic{width:16px;height:16px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.cc-chip[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#0b0c09}
.cc-seg{border-radius:4px}.cc-seg button{border-radius:3px;text-transform:uppercase}.cc-seg-ind{border-radius:3px;background:var(--lime)}.cc-seg button[aria-pressed=true]{color:#0b0c09}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .big{font-size:40px;line-height:1;display:block;margin-top:6px}
.kpi small{color:var(--mut);font-size:12px}
.up{color:var(--ok)}
/* feed */
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed b{display:block}.feed small{color:var(--mut)}
.feed .stats{display:flex;gap:14px;margin-top:4px;font-size:13px}.feed .stats span{font-style:italic;font-weight:800}
.kudo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 10px;font-weight:800;color:var(--fg);font-size:12px}
.kudo .ic{width:16px;height:16px}
.kudo[aria-pressed=true]{background:var(--hot);border-color:var(--hot);color:#fff}
.kudo.pop .ic{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}

.blk{fill:var(--map2)}.road{stroke:var(--road);stroke-width:7;fill:none;stroke-linecap:round}
.rt{fill:none;stroke:var(--hot);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.rt-glow{fill:none;stroke:var(--hot);stroke-width:14;opacity:.18;stroke-linecap:round;stroke-linejoin:round}
.runner{fill:var(--lime);stroke:#0b0c09;stroke-width:3}
.runner-ring{fill:none;stroke:var(--lime);stroke-width:2;animation:ringp 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ringp{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.wp{fill:var(--card-solid);stroke:var(--hot);stroke-width:3}
.drawing .mapw{cursor:crosshair;outline:2px dashed var(--hot);outline-offset:2px}
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.readout div{background:var(--hover);border-radius:4px;padding:10px}.readout small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}.readout b{font-size:22px}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rlist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:4px;padding:10px 12px;color:var(--fg);transition:border-color .2s,background .2s}
.rlist button:hover{border-color:var(--acc)}.rlist button[aria-current=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rlist b{flex:1}.rlist .num{font-size:18px}
/* plan board */
.board{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{border:1px solid var(--line);border-radius:4px;padding:8px;min-height:220px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.day h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between}
.day.today{border-color:var(--acc);box-shadow:inset 0 3px 0 var(--lime)}
.ses{border-radius:4px;padding:8px;background:var(--hover);border-left:4px solid var(--sc);cursor:grab;touch-action:none;font-size:13px}
.ses b{display:block;font-size:13px}.ses small{color:var(--mut);font-size:11px}
.ses .acts{display:flex;gap:4px;margin-top:6px}.ses .acts button{border:1px solid var(--line);background:none;border-radius:3px;font-size:10px;font-weight:800;padding:2px 6px;color:var(--mut);text-transform:uppercase}
.ses .acts button:hover{color:var(--fg)}
.gtag{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--sc);color:#0b0c09}

.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:10px;max-width:520px;margin:10px auto 0}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .av{width:54px;height:54px;font-size:18px;animation:bounce .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d) + .5s)}

.pod b{font-size:14px;text-align:center}.pod small{color:var(--mut);font-style:italic;font-weight:800}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes bounce{from{transform:translateY(-30px) scale(.4);opacity:0}}

.badge.ok{background:var(--lime);color:#0b0c09}.badge.bad{background:var(--hot);color:#fff}

.ra{display:flex;gap:2px;justify-content:flex-end}.ra button{border:0;background:none;padding:5px;border-radius:4px;color:var(--mut);display:grid}.ra button:hover{background:var(--hover);color:var(--fg)}.ra .ic{width:15px;height:15px}
.sw{width:44px;height:24px;border-radius:3px;background:var(--track);border:0;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:2px;background:#fff;transition:transform .25s}
.sw[aria-checked=true]{background:var(--lime)}.sw[aria-checked=true]::after{transform:translateX(20px);background:#0b0c09}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:1/-1}
.scrim{display:none}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.shell{grid-template-columns:1fr}

  const moveTo = (id, d) => { const a = find(id); if (!a || a[0] === d) return; const [s] = PLAN[a[0]].splice(a[1], 1); PLAN[d].push(s); draw(); toast(`${s.g} ${s.t.toLowerCase()} moved to ${WK[d]}`, { icon: 'cal' }); };

  dnd($('#bd'), { item: '.ses', zone: '.pday', onDrop: (it, z) => moveTo(it.dataset.id, +z.dataset.d) });
  v.addEventListener('click', (e) => {
    const t = (k) => e.target.closest(`[data-${k}]`);
    if (t('g')) { gf = t('g').dataset.g; draw(); }
    else if (t('mv')) { const b = t('mv'); moveMenu(b, 'Move to day', WK.map((x, i) => [i, x]), (d) => moveTo(b.dataset.mv, +d)); }
    else if (t('ed')) { const a = find(t('ed').dataset.ed); form(PLAN[a[0]][a[1]]); }
    else if (t('rm')) { const a = find(t('rm').dataset.rm); const [s] = PLAN[a[0]].splice(a[1], 1); draw(); toast(`${s.t} removed`, { action: 'Undo', run: () => { PLAN[a[0]].splice(a[1], 0, s); draw(); } }); }
    else if (t('add')) form(null, +t('add').dataset.add);
  });
  $('#ns').addEventListener('click', () => form(null, (TODAY.getDay() + 6) % 7));
}, 'cal');

/* ===== Page: Routes (the runner moves along the map, the profile follows) ===== */
let DRAW = null, raf = 0;
page('routes', 'Routes', (v) => {
  const draw = () => {
    const rt = ROUTES.find((r) => r.id === ACTIVE) || ROUTES[0];
    v.innerHTML = ph('Routes', 'Press Play: a runner goes round the route and the height chart follows.', `<button class="btn" type="button" id="nr">${I('edit')}${DRAW ? 'Cancel drawing' : 'Draw a route'}</button>`) + `<div class="g" style="grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)">
    <section class="card ${DRAW ? 'drawing' : ''}" id="mapc"><p class="h">${DRAW ? `New route · ${DRAW.length} points · ${dist(routeKm(DRAW), 2)}` : esc(rt.name)}<span>${DRAW ? 'Click the map to add points' : dist(rt.km, 1) + ' · ' + Math.round(Math.max(...rt.elev) - Math.min(...rt.elev)) + ' m climb'}</span></p><div class="mapw" id="map"></div>
      ${DRAW ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" type="button" id="undo">${I('chevl')}Undo point</button><button class="btn primary" type="button" id="saveR"${DRAW.length < 2 ? ' disabled' : ''}>${I('check')}Save route</button></div>` : `<div class="readout" aria-live="polite"><div><small>Distance</small><b class="num" id="roD">0.0</b></div><div><small>Time</small><b class="num" id="roT">0:00</b></div><div><small>Height</small><b class="num" id="roH">${rt.elev[0]} m</b></div><div><small>Pace</small><b class="num">${pace(rt.km * 300, rt.km)}</b></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" type="button" id="play">${I('play')}Play</button><button class="btn" type="button" id="share">${I('route')}Share</button>${ROUTES.indexOf(rt) > 4 ? `<button class="btn" type="button" id="delR">${I('trash')}Delete</button>` : ''}</div>`}</section>
    <section class="card"><p class="h">Route library</p><ul class="rlist">${ROUTES.map((r) => `<li><button type="button" data-r="${r.id}" aria-current="${r.id === ACTIVE && !DRAW}"><b>${esc(r.name)}</b><span class="num">${dist(r.km, 1)}</span></button></li>`).join('')}</ul></section>
    ${DRAW ? '' : `<section class="card full"><p class="h">Height along the route<span>metres</span></p><div id="prof" style="position:relative"></div></section>`}</div>`;
    const inner = DRAW ? `<path class="rt" d="${pathOf(DRAW)}"/>${DRAW.map((p, i) => `<circle class="wp" cx="${p[0]}" cy="${p[1]}" r="${i ? 5 : 7}"/>`).join('')}` : `<path class="rt-glow" d="${pathOf(rt.pts)}"/><path class="rt ${RM ? '' : 'cc-draw'}" pathLength="1" d="${pathOf(rt.pts)}"/><circle class="runner-ring" cx="${rt.pts[0][0]}" cy="${rt.pts[0][1]}" r="9" id="rring"/><circle class="runner" cx="${rt.pts[0][0]}" cy="${rt.pts[0][1]}" r="8" id="rdot"/>`;
    $('#map').innerHTML = mapSvg({ label: DRAW ? 'Map, click to add route points' : rt.name + ' route map', inner });
    if (!DRAW) lineChart($('#prof'), { labels: rt.elev.map((_, i) => dist((rt.km * i) / (rt.elev.length - 1), 1)), series: [{ name: 'Height', data: rt.elev, color: 'var(--c2)' }], min: Math.floor(Math.min(...rt.elev) - 2), max: Math.ceil(Math.max(...rt.elev) + 2), h: 170, fmt: (x) => fmt(x), tfmt: (x) => fmt(x, 1) + ' m', title: 'Elevation profile' });
  };
  const routeKm = (pts) => +(cum(pts).pop() * 0.012).toFixed(2);
  draw();
  const play = () => {
    const rt = ROUTES.find((r) => r.id === ACTIVE); if (!rt) return;
    cancelAnimationFrame(raf);
    const dur = RM ? 0 : 6500, t0 = performance.now(), prof = $('#prof svg'), W = prof ? +prof.getAttribute('width') : 0;
    let cursor = prof && $('#cur', prof);
    if (prof && !cursor) { prof.insertAdjacentHTML('beforeend', `<g id="cur"><line y1="12" y2="${prof.getAttribute('height') - 26}" stroke="var(--c2)" stroke-width="2"/><circle r="6" fill="var(--lime)" stroke="#0b0c09" stroke-width="2"/></g>`); cursor = $('#cur', prof); }
    const lo = Math.floor(Math.min(...rt.elev) - 2), hi = Math.ceil(Math.max(...rt.elev) + 2), H = prof ? +prof.getAttribute('height') : 0;
    const step = (now) => {
      if (!$('#rdot')) return;
      const f = dur ? Math.min(1, (now - t0) / dur) : 1, [x, y] = at(rt.pts, f), ei = f * (rt.elev.length - 1), e0 = rt.elev[Math.floor(ei)], e1 = rt.elev[Math.min(rt.elev.length - 1, Math.floor(ei) + 1)], el = e0 + (e1 - e0) * (ei % 1);
      ['#rdot', '#rring'].forEach((s) => { $(s).setAttribute('cx', x.toFixed(1)); $(s).setAttribute('cy', y.toFixed(1)); });
      $('#roD').textContent = dist(rt.km * f, 2); $('#roT').textContent = hms(rt.km * 300 * f); $('#roH').textContent = fmt(el, 1) + ' m';
      if (cursor) { const cx = 44 + (W - 56) * f, cy = 12 + (H - 38) * (1 - (el - lo) / (hi - lo)); cursor.setAttribute('transform', `translate(${cx.toFixed(1)},0)`); $('circle', cursor).setAttribute('cy', cy.toFixed(1)); }
      if (f < 1 && !document.hidden) raf = requestAnimationFrame(step); else { $('#play') && ($('#play').innerHTML = I('refresh') + 'Replay'); if (f >= 1) toast(`${rt.name} done: ${dist(rt.km, 1)}`, { icon: 'trophy' }); }
    };
    $('#play').innerHTML = I('pause') + 'Running…';
    raf = requestAnimationFrame(step);
  };
  v.addEventListener('click', async (e) => {
    const t = (s) => e.target.closest(s);
    if (t('[data-r]')) { cancelAnimationFrame(raf); DRAW = null; ACTIVE = t('[data-r]').dataset.r; draw(); }
    else if (t('#play')) play();
    else if (t('#share')) { const rt = ROUTES.find((r) => r.id === ACTIVE); toast(`Link to ${rt.name} copied for the club chat`, { icon: 'route' }); }
    else if (t('#nr')) { cancelAnimationFrame(raf); DRAW = DRAW ? null : []; draw(); }
    else if (t('#undo')) { DRAW.pop(); draw(); }
    else if (t('#delR')) { const rt = ROUTES.find((r) => r.id === ACTIVE); if (await confirmBox('Delete route?', `${rt.name} will leave the library.`)) { ROUTES.splice(ROUTES.indexOf(rt), 1); ACTIVE = 'canal'; draw(); toast('Route deleted'); } }
    else if (t('#saveR')) { const pts = DRAW.slice(); modal({ title: 'Name your route', ok: 'Save route', body: fields([{ name: 'n', label: 'Route name', full: true, ph: 'e.g. Morning bridge loop' }]) + `<p class="cc-hint">${pts.length} points, ${dist(routeKm(pts), 2)}</p>`, onOk: (f) => { const d = check(f, { n: (x) => (!x.trim() ? 'Give it a name' : ROUTES.some((r) => r.name.toLowerCase() === x.trim().toLowerCase()) ? 'A route has this name already' : '') }); if (!d) return false; seed(pts.length * 13); const id = uid(); ROUTES.push({ id, name: d.n.trim(), km: routeKm(pts), pts, elev: [...Array(40)].map((_, i) => +(212 + Math.sin(i / 4) * 2 + rf(-0.5, 0.5)).toFixed(1)) }); DRAW = null; ACTIVE = id; draw(); toast(`Route "${d.n.trim()}" saved`, { icon: 'route' }); } }); }
    else if (t('#map') && DRAW) { const s = $('#map svg'), r = s.getBoundingClientRect(), k = 600 / (r.width || 600); DRAW.push([Math.round((e.clientX - r.left) * k), Math.round((e.clientY - r.top) * k)]); draw(); }
  });
}, 'route');

  v.addEventListener('click', (e) => { const g = e.target.closest('[data-g]'); if (g) { gf = g.dataset.g; $('#lt')._st = null; draw(); } });
}, 'star');

/* ===== Page: Settings ===== */
page('settings', 'Settings', (v) => {
  v.innerHTML = ph('Settings', 'Club details, units and look.') + `<div class="g c2"><section class="card"><p class="h">Club</p><form id="cf" novalidate>${fields([{ name: 'n', label: 'Club name', value: $('.side-foot b').textContent, full: true }, { name: 'coach', label: 'Head coach', value: 'Sana Mirza' }, { name: 'city', label: 'City', value: 'Lahore' }])}<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" type="submit">Save</button></div></form></section>
  <section class="card"><p class="h">Preferences</p><ul class="feed"><li><span></span><span><b>Units</b><small>kilometres or miles everywhere</small></span><span id="un"></span></li><li><span></span><span><b>Theme</b><small>race night or track day</small></span><span id="th"></span></li><li><span></span><span><b>Weekly club summary</b><small>sent every Sunday night</small></span><button class="sw" type="button" role="switch" aria-checked="true" id="sum" aria-label="Weekly club summary"></button></li><li><span></span><span><b>Reset demo data</b><small>members, runs, plan and events</small></span><button class="btn danger" type="button" id="reset">${I('refresh')}Reset</button></li></ul></section></div>`;
  seg($('#un'), [['km', 'km'], ['mi', 'mi']], U, (x) => { U = x; toast(`Distances now in ${x === 'km' ? 'kilometres' : 'miles'}`); });
  seg($('#th'), [['dark', 'Night'], ['light', 'Day']], document.documentElement.dataset.theme, (t) => setTheme(t));
  $('#sum').addEventListener('click', (e) => { const on = e.currentTarget.getAttribute('aria-checked') !== 'true'; e.currentTarget.setAttribute('aria-checked', String(on)); toast(`Weekly summary ${on ? 'on' : 'off'}`); });
  $('#cf').addEventListener('submit', (e) => { e.preventDefault(); const d = check(e.target, { n: need('Club name'), coach: need('Head coach'), city: need('City') }); if (!d) return; $('.side-foot').innerHTML = `<b>${esc(d.n.trim())}</b>${esc(d.city.trim())} · coach ${esc(d.coach.trim())}`; toast('Club saved'); });
  $('#reset').addEventListener('click', async () => { if (await confirmBox('Reset demo data?', 'Members, runs, plans and events go back to the sample club.', 'Reset')) { location.hash = '#/club'; location.reload(); } });
}, 'sliders');

/* ===== Start ===== */
$('[data-nav]').insertAdjacentHTML('beforeend', App.order.map((id) => `<a href="#/${id}">${I(App.pages[id].icon)}<span>${App.pages[id].label}</span></a>`).join(''));
$$('[data-i]').forEach((e) => e.insertAdjacentHTML('afterbegin', I(e.dataset.i)));
App.onRoute.push(() => cancelAnimationFrame(raf));
App.onTheme = () => { if (App.cur === 'settings') rerender(); };
notify('Hira ran a personal best: 10 km in 48:12', 'trophy', 25);
notify('6 members still owe this month\'s fee', 'money', 300);
notify('Canal Bank 10K: 84 runners going', 'cal', 900);
boot({ name: 'Pacehouse', key: 'pacehouse', cmds: [{ label: 'Log a run', run: () => runForm() }, { label: 'New member', run: () => memberForm() }, ...ROUTES.map((r) => ({ label: 'Play route: ' + r.name, run: () => { ACTIVE = r.id; DRAW = null; go('routes'); } }))] });
</script>
</body>
</html>
