<!doctype html>
<!-- Chill & Craft · Keycap Nav · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycap Nav · keyboard-first menu</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: a cream retro keyboard by day, a backlit graphite one by night ---------- */
  :root {
    color-scheme: light;
    --bg: #e8e2d6;
    --bg2: #d9d0bf;
    --card: #f8f4ec;
    --card2: #f1ebe0;
    --rule: #e2d9ca;
    --ink: #24211c;
    --ink2: #6d665b;
    --soft: #a69e90;
    --ktop: #fdfaf4;
    --ktop2: #ece5d8;
    --kside: #c7bda9;
    --kink: #3a342c;
    --glow: transparent;
    --orange: #f06a2a;
    --teal: #1b9c91;
    --teal2: #127a71;
    --shadow: rgba(60, 45, 20, .24);
    --focus: #127a71;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0f13;
    --bg2: #161a22;
    --card: #15181e;
    --card2: #1a1e25;
    --rule: #262b35;
    --ink: #eceef3;
    --ink2: #9aa0ad;
    --soft: #5c6270;
    --ktop: #2c3039;
    --ktop2: #23272f;
    --kside: #0f1115;
    --kink: #e8ebf2;
    --glow: rgba(64, 224, 208, .35);
    --orange: #ff7b3e;
    --teal: #2fc9bb;
    --teal2: #23a99c;
    --shadow: rgba(0, 0, 0, .62);
    --focus: #5fe3d6;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: radial-gradient(60% 50% at 50% 0%, var(--bg2), transparent 70%), var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px 14px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .app {
    position: relative;
    width: min(900px, 100%);
    padding: 14px 18px 18px;
    border-radius: 28px;
    background: linear-gradient(180deg, var(--card), var(--card2));
    box-shadow: 0 44px 90px -50px var(--shadow), 0 0 0 1px var(--rule);
  }

  /* ---------- A keycap, the building block of everything here ---------- */
  .key {
    position: relative; display: inline-grid; place-items: center;
    min-width: 40px; height: 40px; padding: 0 10px;
    border: 0; border-radius: 9px;
    font: 700 14px var(--mono); color: var(--kink); letter-spacing: 0;
    background: radial-gradient(120% 90% at 50% 20%, var(--ktop), var(--ktop2));
    box-shadow: 0 4px 0 var(--kside), 0 7px 10px -2px rgba(0, 0, 0, .25), 0 0 14px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .55);
    transition: transform .07s ease-out, box-shadow .07s ease-out, background .2s;
  }
  :root[data-theme="dark"] .key { box-shadow: 0 4px 0 var(--kside), 0 7px 12px -2px rgba(0, 0, 0, .6), 0 6px 16px -6px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .key.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--kside), 0 2px 4px rgba(0, 0, 0, .25), 0 0 22px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .key.esc { background: radial-gradient(120% 90% at 50% 20%, #ff9a64, var(--orange)); color: #fff; --kside: #b8481a; }
  .key.lead { background: radial-gradient(120% 90% at 50% 20%, #4cc9bd, var(--teal)); color: #fff; --kside: var(--teal2); }
  :root[data-theme="dark"] .key.esc { --kside: #8d3510; }
  :root[data-theme="dark"] .key.lead { --kside: #0f6b63; }
  .key.lit { background: radial-gradient(120% 90% at 50% 20%, #fff6d6, #ffe08a); color: #3a2c00; }
  :root[data-theme="dark"] .key.lit { background: radial-gradient(120% 90% at 50% 20%, #4de6d8, #23a99c); color: #04201d; }
  .key small { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; opacity: .65; }

  /* ---------- Header + nav ---------- */
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .key { min-width: 38px; height: 38px; padding: 0; font-size: 16px; }
  .brand b { display: block; font-size: 16px; letter-spacing: -.02em; }
  .brand small { display: block; font-size: 12px; color: var(--ink2); }
  .help { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border: 0; border-radius: 12px; background: none; font-size: 13px; font-weight: 700; color: var(--ink2); }
  .help .key { min-width: 28px; height: 28px; padding: 0 7px; border-radius: 7px; font-size: 13px; box-shadow: 0 3px 0 var(--kside), 0 5px 7px -2px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .help:hover { color: var(--ink); }
  .nav { position: relative; display: flex; gap: 4px; padding: 8px; border-radius: 18px; background: color-mix(in srgb, var(--ink) 5%, transparent); box-shadow: inset 0 0 0 1px var(--rule); }
  .item {
    position: relative; z-index: 1; flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; padding: 0 8px; border: 0; border-radius: 12px; background: none;
    font-size: 14px; font-weight: 750; color: var(--ink2);
    transition: color .25s;
  }
  .item svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item:hover { color: var(--ink); }
  .item[aria-current="page"] { color: var(--ink); }
  .item .hint {
    flex: none; display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 5px;
    font: 700 11px var(--mono); color: var(--kink);
    background: linear-gradient(180deg, var(--ktop), var(--ktop2)); box-shadow: 0 2px 0 var(--kside), inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: opacity .3s, transform .3s var(--spring);
  }
  .nohints .item .hint { opacity: 0; transform: scale(.4); }
  /* the floating keycaps that rise out of the links in go-to mode */
  .cap {
    --rise: -34px;
    position: absolute; left: 50%; top: 0; z-index: 4; min-width: 40px; height: 40px; margin-left: -20px; padding: 0;
    pointer-events: none; opacity: 0; transform: translateY(6px) scale(.4);
  }
  .layer .cap { animation: rise .46s var(--spring) both; animation-delay: calc(var(--i) * 40ms); }
  .cap.down { translate: 0 4px; } /* the rise animation holds transform, so the press uses translate */
  @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.4); } to { opacity: 1; transform: translateY(var(--rise)) scale(1); } }
  .layer .item .lb, .layer .item svg { opacity: .45; }
  .bar {
    position: absolute; z-index: 0; left: 0; top: 8px; height: 46px; width: 100px; border-radius: 12px;
    background: radial-gradient(120% 90% at 50% 15%, var(--ktop), var(--ktop2));
    box-shadow: 0 4px 0 var(--kside), 0 8px 14px -6px rgba(0, 0, 0, .3), 0 6px 18px -8px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .55);
  }
  :root[data-theme="dark"] .bar { box-shadow: 0 4px 0 var(--kside), 0 8px 14px -6px rgba(0, 0, 0, .6), 0 8px 22px -8px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .07); }

  /* ---------- The go-to HUD with a draining timer ---------- */
  .hud { position: absolute; left: 50%; top: 100%; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; margin-top: 8px; border-radius: 14px; background: var(--ink); color: var(--card); font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 16px 30px -16px rgba(0, 0, 0, .5); transform: translate(-50%, -8px) scale(.9); opacity: 0; pointer-events: none; transition: opacity .2s, transform .4s var(--spring); }
  .hud.on { opacity: 1; transform: translate(-50%, 0); }
  .hud .key { min-width: 28px; height: 28px; padding: 0 7px; font-size: 12.5px; }
  .hud .arrow { opacity: .6; }
  .hud .wait { width: 18px; height: 18px; }
  .hud .wait circle { fill: none; stroke: var(--teal); stroke-width: 3; stroke-dasharray: 44; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: center; }
  .hud.timing .wait circle { animation: drain 1.8s linear forwards; }
  @keyframes drain { to { stroke-dashoffset: 44; } }

  /* ---------- Page ---------- */
  .page { position: relative; margin-top: 16px; min-height: 230px; padding: 16px 18px; border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
  .page h1 { margin: 0 0 4px; font-size: clamp(21px, 3.6vw, 27px); letter-spacing: -.03em; min-height: 1.2em; }
  .page h1 .caret { display: inline-block; width: 2px; height: .95em; margin-left: 2px; vertical-align: -2px; background: var(--teal); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .page .sub { margin: 0 0 14px; font-size: 13.5px; color: var(--ink2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { padding: 12px 14px; border-radius: 14px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--rule); }
  .tile b { display: block; font-size: 24px; letter-spacing: -.04em; }
  .tile span { font-size: 12.5px; color: var(--ink2); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; font-size: 14px; transition: background .2s; }
  .list li + li { margin-top: 2px; }
  .list li .meta { margin-left: auto; font-size: 12px; color: var(--ink2); white-space: nowrap; }
  .list li .who { font-weight: 750; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
  .list li.read .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--soft); }
  .list li.sel { background: color-mix(in srgb, var(--teal) 14%, transparent); box-shadow: inset 3px 0 0 var(--teal); }
  .prog { flex: 0 0 34%; height: 8px; border-radius: 4px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
  .prog i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--teal), color-mix(in srgb, var(--teal) 60%, #fff)); transform-origin: 0 50%; }
  .week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .day { min-height: 110px; padding: 8px; border-radius: 12px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--rule); font-size: 12px; color: var(--ink2); }
  .day b { display: block; margin-bottom: 6px; color: var(--ink); font-size: 12.5px; }
  .ev { margin-top: 4px; padding: 5px 6px; border-radius: 7px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding: 0 4px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink2); }
  .bars i { display: block; width: 100%; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, color-mix(in srgb, var(--teal) 70%, #fff), var(--teal)); transform-origin: 50% 100%; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed var(--rule); font-size: 14px; }
  .opt small { display: block; font-size: 12px; color: var(--ink2); }
  .sw { position: relative; flex: none; width: 46px; height: 28px; }
  .sw input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--rule); transition: background .25s; pointer-events: none; }
  .sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ktop); box-shadow: 0 2px 0 var(--kside), 0 3px 5px rgba(0, 0, 0, .2); transition: transform .35s var(--spring); }
  .sw input:checked + span { background: var(--teal); }
  .sw input:checked + span::after { transform: translateX(18px); }
  .sw input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ripple { position: absolute; z-index: 5; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid var(--teal); pointer-events: none; }

  /* ---------- On-screen keys ---------- */
  .deck { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 10px; margin-top: 16px; padding: 14px 12px 16px; border-radius: 20px; background: color-mix(in srgb, var(--ink) 6%, transparent); box-shadow: inset 0 0 0 1px var(--rule), inset 0 10px 18px -16px rgba(0, 0, 0, .4); }
  .deck .grp { display: flex; gap: 8px; align-items: center; }
  .deck .lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin-right: 2px; }

  /* ---------- Cheat sheet ---------- */
  .sheet { position: absolute; inset: 10px; z-index: 10; display: grid; place-items: center; border-radius: 22px; background: color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet.on { opacity: 1; pointer-events: auto; }
  .sheet .box { width: min(460px, 100%); padding: 18px 20px; border-radius: 20px; background: var(--card); box-shadow: 0 30px 60px -30px var(--shadow), 0 0 0 1px var(--rule); transform: translateY(14px) scale(.96); transition: transform .45s var(--spring); }
  .sheet.on .box { transform: none; }
  .sheet h2 { margin: 0 0 10px; font-size: 17px; letter-spacing: -.02em; }
  .sheet ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
  .sheet li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
  .sheet li .key { min-width: 26px; height: 26px; padding: 0 6px; font-size: 11.5px; box-shadow: 0 3px 0 var(--kside), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .sheet .close { margin-top: 14px; display: flex; justify-content: flex-end; }
  .sheet.on li { animation: drop .45s var(--spring) both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

  @media (max-width: 880px) {
    .item .lb { display: none; }
    .item { gap: 5px; }
    .cap { --rise: -3px; } /* narrow: the cap pops up over its own item instead of above it */
  }
  @media (max-width: 520px) {
    .app { padding: 12px 12px 14px; border-radius: 22px; }
    .help span.t { display: none; }
    .nav { padding: 6px; gap: 2px; }
    .item { height: 42px; padding: 0 4px; }
    .item .hint { min-width: 17px; height: 17px; font-size: 10px; }
    .bar { top: 6px; height: 42px; }
    .deck { gap: 10px 6px; padding: 12px 8px 14px; }
    .deck .grp { gap: 6px; }
    .deck .key { min-width: 34px; height: 36px; padding: 0 7px; font-size: 13px; }
    .deck .lbl { display: none; }
    .week { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .week .day:nth-child(n+4) { display: none; }
    .sheet ul { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .layer .cap { opacity: 1; transform: translateY(var(--rise)); }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="app" id="app" aria-labelledby="ttl">
    <header class="top">
      <div class="brand"><span class="key lead" aria-hidden="true">W</span><div><b id="ttl">Workbench</b><small>Studio Saba · Karachi</small></div></div>
      <button class="help" id="helpBtn" type="button" aria-haspopup="dialog"><span class="key" aria-hidden="true">?</span><span class="t">Shortcuts</span></button>
    </header>
    <div style="position:relative">
      <nav class="nav" id="nav" aria-label="Main">
        <span class="bar" id="bar" aria-hidden="true"></span>
      </nav>
      <div class="hud" id="hud" aria-hidden="true"></div>
    </div>

    <article class="page" id="page" aria-live="off"></article>

    <div class="deck" id="deck" role="group" aria-label="On-screen keys">
      <div class="grp"><span class="lbl">Go to</span><button class="key lead" type="button" data-k="g" aria-label="G, go to">G</button></div>
      <div class="grp" id="letters"></div>
      <div class="grp"><button class="key" type="button" data-k="[" aria-label="Previous page">[</button><button class="key" type="button" data-k="]" aria-label="Next page">]</button></div>
      <div class="grp"><button class="key" type="button" data-k="j" aria-label="J, next item">J</button><button class="key" type="button" data-k="k" aria-label="K, previous item">K</button></div>
      <div class="grp"><button class="key esc" type="button" data-k="Escape" aria-label="Escape"><small>ESC</small></button></div>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <div class="box">
        <h2 id="shT">Keyboard shortcuts</h2>
        <ul id="shList"></ul>
        <div class="close"><button class="key" type="button" id="shClose" aria-label="Close shortcuts"><small>ESC</small></button></div>
      </div>
    </div>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </section>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 40); };
  const pkr = (n) => "PKR " + n.toLocaleString("en-US");

  // ---------- Pages and their keys ----------
  const ICONS = {
    h: '<path d="M3 9l6-5 6 5v6a1 1 0 0 1-1 1h-3v-4H7v4H4a1 1 0 0 1-1-1Z"/>',
    p: '<rect x="2.5" y="3" width="13" height="12" rx="2"/><path d="M6 7h6M6 10h4"/>',
    i: '<path d="M2.5 9.5l2-5.5h9l2 5.5V14a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1Z"/><path d="M2.5 9.5h4l1 2h3l1-2h4"/>',
    c: '<rect x="2.5" y="3.5" width="13" height="12" rx="2"/><path d="M2.5 7.5h13M6 2v3M12 2v3"/>',
    r: '<path d="M3 15V9M7.5 15V4M12 15v-4M15.5 15H2"/>',
    s: '<circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M3.9 14.1l1.4-1.4M12.7 5.3l1.4-1.4"/>'
  };
  const PAGES = [
    { k: "h", name: "Home" }, { k: "p", name: "Projects" }, { k: "i", name: "Inbox" },
    { k: "c", name: "Calendar" }, { k: "r", name: "Reports" }, { k: "s", name: "Settings" }
  ];
  const inbox = [
    { who: "Ayesha Siddiqui", sub: "Logo files for the bakery", t: "9:40", read: false },
    { who: "Bilal Ahmed", sub: "Invoice for October", t: "9:12", read: false },
    { who: "Hira Malik", sub: "Can we move Friday's review?", t: "Yesterday", read: true },
    { who: "Omar Farooq", sub: "Photos from the shoot", t: "Mon", read: true }
  ];
  let inboxSel = 0;
  const settings = { hints: true, compact: false };
  const BODY = {
    h: () => '<p class="sub">Monday, 24 November · press <b>G</b> then a letter to jump anywhere.</p><div class="tiles"><div class="tile"><b>4</b><span>tasks due today</span></div><div class="tile"><b>' + inbox.filter((m) => !m.read).length + '</b><span>unread messages</span></div><div class="tile"><b>2</b><span>meetings</span></div><div class="tile"><b>' + pkr(184000) + '</b><span>billed this month</span></div></div>',
    p: () => '<p class="sub">Three active projects</p><ul class="list">' + [["Bakery website, Karachi", 72], ["Eid campaign", 40], ["Clinic booking app", 88]].map((p) => '<li><span class="who">' + p[0] + '</span><span class="prog"><i style="width:' + p[1] + '%"></i></span><span class="meta">' + p[1] + "%</span></li>").join("") + "</ul>",
    i: () => '<p class="sub">Use <b>J</b> and <b>K</b> to move, <b>Enter</b> to mark read</p><ul class="list" id="inboxList">' + inbox.map((m, n) => '<li class="' + (m.read ? "read" : "") + (n === inboxSel ? " sel" : "") + '"><span class="dot" aria-hidden="true"></span><span class="who">' + m.who + '</span><span class="meta">' + m.t + "</span></li>").join("") + "</ul>",
    c: () => '<p class="sub">This week</p><div class="week">' + [["Mon 24", [["Team stand-up", "var(--teal)"]]], ["Tue 25", [["Bakery review", "var(--orange)"]]], ["Wed 26", []], ["Thu 27", [["Shoot, Clifton", "#7c6cf0"], ["Invoices", "var(--teal)"]]], ["Fri 28", [["Clinic demo", "var(--orange)"]]]].map((d) => '<div class="day"><b>' + d[0] + "</b>" + (d[1].length ? d[1].map((e) => '<div class="ev" style="--c:' + e[1] + '">' + e[0] + "</div>").join("") : "Free") + "</div>").join("") + "</div>",
    r: () => '<p class="sub">Billed per month, in thousands of rupees</p><div class="bars">' + [["Jun", 96], ["Jul", 120], ["Aug", 88], ["Sep", 142], ["Oct", 160], ["Nov", 184]].map((b) => '<div><i style="height:' + Math.round(b[1] / 184 * 100) + 'px"></i>' + b[0] + "</div>").join("") + "</div>",
    s: () => '<p class="sub">Your preferences are kept while the page is open</p>' +
      '<label class="opt"><span>Show key hints<small>Small keycaps next to each menu item</small></span><span class="sw"><input type="checkbox" id="optHints"' + (settings.hints ? " checked" : "") + '><span></span></span></label>' +
      '<label class="opt"><span>Compact menu<small>Icons only in the menu</small></span><span class="sw"><input type="checkbox" id="optCompact"' + (settings.compact ? " checked" : "") + '><span></span></span></label>'
  };

  // ---------- Build nav, floating caps, deck keys, cheat sheet ----------
  const app = $("#app"), nav = $("#nav"), bar = $("#bar"), page = $("#page"), hud = $("#hud");
  const items = PAGES.map((p, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item";
    b.style.setProperty("--i", n);
    b.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true">' + ICONS[p.k] + '</svg><span class="lb">' + p.name + '</span><span class="hint" aria-hidden="true">' + p.k.toUpperCase() + '</span><span class="key cap" aria-hidden="true">' + p.k.toUpperCase() + "</span>";
    b.setAttribute("aria-keyshortcuts", "G " + p.k.toUpperCase());
    b.setAttribute("aria-label", p.name);
    nav.appendChild(b);
    return b;
  });
  const letters = $("#letters");
  PAGES.forEach((p) => { const k = document.createElement("button"); k.type = "button"; k.className = "key"; k.dataset.k = p.k; k.textContent = p.k.toUpperCase(); k.setAttribute("aria-label", p.k.toUpperCase() + ", " + p.name); letters.appendChild(k); });
  const deckKey = (k) => $('#deck [data-k="' + (k === "?" ? "?" : k) + '"]');
  const SHORTS = [["G H", "Home"], ["G P", "Projects"], ["G I", "Inbox"], ["G C", "Calendar"], ["G R", "Reports"], ["G S", "Settings"], ["[ ]", "Previous / next page"], ["J K", "Move in Inbox"], ["?", "This sheet"], ["ESC", "Cancel or close"]];
  $("#shList").innerHTML = SHORTS.map((s, i) => '<li style="--i:' + i + '">' + s[0].split(" ").map((x) => '<span class="key">' + x + "</span>").join("") + "<span>" + s[1] + "</span></li>").join("");

  // ---------- The sliding spacebar under the current item ----------
  let cur = 0;
  function moveBar(instant) {
    const it = items[cur], nr = nav.getBoundingClientRect(), r = it.getBoundingClientRect();
    const x = r.left - nr.left, w = r.width;
    if (instant || reduce) { bar.style.transform = "translateX(" + x + "px)"; bar.style.width = w + "px"; return; }
    const from = bar.getBoundingClientRect(), fx = from.left - nr.left;
    const dir = Math.sign(x - fx) || 1;
    bar.animate([
      { transform: "translateX(" + fx + "px)", width: from.width + "px" },
      { transform: "translateX(" + (Math.min(fx, x) - 4) + "px) scaleY(.82)", width: (Math.abs(x - fx) * .6 + Math.max(w, from.width)) + "px", offset: .45 },
      { transform: "translateX(" + (x + dir * 5) + "px) scaleY(.9)", width: w + "px", offset: .78 },
      { transform: "translateX(" + x + "px)", width: w + "px" }
    ], { duration: 560, easing: "cubic-bezier(.3,.7,.3,1)" });
    bar.style.transform = "translateX(" + x + "px)"; bar.style.width = w + "px";
  }

  // ---------- Pages: heading types itself, content rises ----------
  let typing = 0;
  function render(n, animate) {
    const p = PAGES[n];
    page.innerHTML = '<h1><span class="tx"></span><span class="caret" aria-hidden="true"></span></h1>' + BODY[p.k]();
    const tx = page.querySelector(".tx");
    const id = ++typing;
    if (!animate || reduce) { tx.textContent = p.name; } else {
      (async () => { for (let k = 1; k <= p.name.length; k++) { if (id !== typing) return; tx.textContent = p.name.slice(0, k); await sleep(38); } })();
      [...page.children].slice(1).forEach((el, k) => el.animate([{ transform: "translateY(14px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 520, delay: 120 + k * 80, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }));
      page.querySelectorAll(".prog i").forEach((el, k) => el.animate([{ transform: "scaleX(0)" }, { transform: "none" }], { duration: 800, delay: 250 + k * 90, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }));
      page.querySelectorAll(".bars i").forEach((el, k) => el.animate([{ transform: "scaleY(0)" }, { transform: "scaleY(1.06)", offset: .75 }, { transform: "none" }], { duration: 700, delay: 200 + k * 60, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }));
      page.querySelectorAll(".tile, .day, .opt").forEach((el, k) => el.animate([{ transform: "translateY(10px) scale(.97)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 480, delay: 160 + k * 55, easing: "cubic-bezier(.34,1.45,.64,1)", fill: "backwards" }));
    }
    bindPage();
  }
  function bindPage() {
    const h = $("#optHints"), c = $("#optCompact");
    if (h) h.addEventListener("change", () => { settings.hints = h.checked; app.classList.toggle("nohints", !h.checked); say(h.checked ? "Key hints shown" : "Key hints hidden"); });
    if (c) c.addEventListener("change", () => { settings.compact = c.checked; nav.querySelectorAll(".lb").forEach((l) => { l.style.display = c.checked ? "none" : ""; }); moveBar(true); say(c.checked ? "Compact menu" : "Full menu"); });
  }
  function go(n, how) {
    n = (n + PAGES.length) % PAGES.length;
    if (n === cur) { if (!reduce) items[n].animate([{ transform: "none" }, { transform: "translateY(-3px)" }, { transform: "none" }], { duration: 300, easing: "cubic-bezier(.34,1.56,.64,1)" }); return; }
    cur = n;
    items.forEach((it, k) => { if (k === n) it.setAttribute("aria-current", "page"); else it.removeAttribute("aria-current"); });
    moveBar(false);
    render(n, true);
    say(PAGES[n].name + (how ? ", " + how : ""));
  }

  // ---------- Key presses: physical keycap feel + ripple ----------
  function pressKey(el, hold) {
    if (!el) return;
    el.classList.add("down");
    setTimeout(() => el.classList.remove("down"), hold || 140);
  }
  function ripple(el) {
    if (reduce || !el) return;
    const a = app.getBoundingClientRect(), r = el.getBoundingClientRect();
    const d = document.createElement("i");
    d.className = "ripple";
    d.style.left = (r.left - a.left + r.width / 2) + "px"; d.style.top = (r.top - a.top + r.height / 2) + "px";
    app.appendChild(d);
    d.animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(9)", opacity: 0 }], { duration: 560, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => d.remove();
  }

  // ---------- Go-to mode: G raises a keycap out of every item ----------
  let leader = false, leadT = 0;
  function hudShow(html, timing) {
    hud.innerHTML = html;
    hud.classList.toggle("timing", !!timing);
    hud.classList.add("on");
  }
  function hudHide(ms) { clearTimeout(hud._t); hud._t = setTimeout(() => hud.classList.remove("on"), ms || 0); }
  function startLeader() {
    if (leader) return;
    leader = true;
    nav.classList.add("layer");
    hudShow('<span class="key lead">G</span><span class="arrow">→</span><span>Go to…</span><svg class="wait" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7"/></svg>', true);
    clearTimeout(hud._t);
    say("Go to: press H, P, I, C, R or S");
    clearTimeout(leadT);
    leadT = setTimeout(() => cancelLeader(true), 1800);
  }
  function cancelLeader(timedOut) {
    if (!leader) return;
    leader = false;
    clearTimeout(leadT);
    nav.classList.remove("layer");
    if (timedOut) { hudShow('<span class="key lead">G</span><span>Timed out</span>'); hudHide(700); }
    else hudHide(0);
  }
  async function finishLeader(n) {
    leader = false;
    clearTimeout(leadT);
    const cap = items[n].querySelector(".cap");
    cap.classList.add("down", "lit");
    ripple(cap);
    hudShow('<span class="key lead">G</span><span class="arrow">→</span><span class="key lit">' + PAGES[n].k.toUpperCase() + "</span><span>" + PAGES[n].name + "</span>");
    await sleep(reduce ? 0 : 170);
    nav.classList.remove("layer");
    cap.classList.remove("down", "lit");
    go(n, "G then " + PAGES[n].k.toUpperCase());
    hudHide(900);
  }
  const sheet = $("#sheet");
  let opener = null;
  sheet.inert = true;
  function openSheet(focusIt) { opener = document.activeElement; sheet.inert = false; sheet.classList.add("on"); if (focusIt) $("#shClose").focus({ preventScroll: true }); say("Keyboard shortcuts"); }
  function closeSheet() { const back = sheet.contains(document.activeElement); sheet.classList.remove("on"); sheet.inert = true; if (back && opener && opener.focus) opener.focus({ preventScroll: true }); say("Shortcuts closed"); }

  function inboxMove(d) {
    if (PAGES[cur].k !== "i") return false;
    inboxSel = (inboxSel + d + inbox.length) % inbox.length;
    page.querySelectorAll("#inboxList li").forEach((li, k) => li.classList.toggle("sel", k === inboxSel));
    say(inbox[inboxSel].who + ": " + inbox[inboxSel].sub);
    return true;
  }
  // one place that handles a key, from the real keyboard or the on-screen deck
  function handle(key, fromDeck) {
    const k = key.length === 1 ? key.toLowerCase() : key;
    pressKey(deckKey(k === "?" ? "?" : k));
    if (sheet.classList.contains("on")) { if (k === "Escape" || k === "?") closeSheet(); return true; }
    if (k === "Escape") { cancelLeader(false); return true; }
    if (leader) {
      const n = PAGES.findIndex((p) => p.k === k);
      if (n >= 0) { finishLeader(n); return true; }
      if (k !== "g") { cancelLeader(false); hudShow('<span class="key">' + key.toUpperCase() + "</span><span>is not a page key</span>"); hudHide(800); return true; }
      return true;
    }
    if (k === "g") { startLeader(); return true; }
    if (k === "?") { openSheet(!demo); return true; }
    if (k === "[") { go(cur - 1, "previous"); return true; }
    if (k === "]") { go(cur + 1, "next"); return true; }
    if (k === "j") return inboxMove(1) || true;
    if (k === "k") return inboxMove(-1) || true;
    if (k === "Enter" && PAGES[cur].k === "i" && !fromDeck) { inbox[inboxSel].read = !inbox[inboxSel].read; render(cur, false); say(inbox[inboxSel].who + (inbox[inboxSel].read ? " marked read" : " marked unread")); return true; }
    return false;
  }
  addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.closest("input, textarea, select") && t.type !== "checkbox")) return;
    // Enter on a focused button keeps its normal meaning, except in the Inbox list
    if (e.key === "Enter" && t && t.closest && t.closest("button")) return;
    const known = /^[a-z?\[\]]$/i.test(e.key) || e.key === "Escape" || e.key === "Enter";
    if (!known) return;
    if (handle(e.key, false)) e.preventDefault();
  });
  $("#deck").addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) handle(b.dataset.k, true); });
  items.forEach((it, n) => it.addEventListener("click", () => { cancelLeader(false); go(n, "clicked"); }));
  $("#helpBtn").addEventListener("click", () => { pressKey($("#helpBtn .key")); openSheet(true); });
  $("#shClose").addEventListener("click", closeSheet);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
  sheet.addEventListener("keydown", (e) => { if (e.key === "Tab") { e.preventDefault(); $("#shClose").focus(); } });
  addEventListener("resize", () => moveBar(true));

  // ---------- Start ----------
  items[0].setAttribute("aria-current", "page");
  render(0, true);
  requestAnimationFrame(() => moveBar(true));
  if (!reduce) {
    items.forEach((it, k) => it.animate([{ transform: "translateY(10px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 480, delay: 80 + k * 60, easing: "cubic-bezier(.34,1.45,.64,1)", fill: "backwards" }));
    [...$("#deck").querySelectorAll(".key")].forEach((k, i) => k.animate([{ transform: "translateY(-12px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 460, delay: 200 + i * 35, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "backwards" }));
  }

  // ---------- Auto demo: someone types G then a letter, opens the sheet, walks the inbox ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  const tap = async (k, wait) => { if (!demo) return false; handle(k, true); await sleep(wait); return demo; };
  (async () => {
    await sleep(1300);
    const tour = ["p", "i", "r", "c", "s", "h"];
    let n = 0;
    while (demo) {
      const k = tour[n++ % tour.length];
      if (!(await tap("g", 650))) break;
      if (!(await tap(k, 1900))) break;
      if (k === "i") { for (const j of ["j", "j", "k"]) if (!(await tap(j, 480))) break; await sleep(700); }
      if (n % 4 === 0) { if (!(await tap("?", 1700))) break; if (!(await tap("Escape", 900))) break; }
      if (n % 3 === 0) { if (!(await tap("]", 1500))) break; }
      await sleep(900);
    }
  })();
})();
</script>
</body>
</html>
