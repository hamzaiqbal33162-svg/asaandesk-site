<!doctype html>
<!-- Chill & Craft · Tiffin Route · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiffin Route · Home-cooked lunch delivery desk</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
    if (q === "light" || q === "dark") document.documentElement.dataset.themeLock = "1";
  })();
</script>
<style>
  /* ---------- Theme: brushed steel tiffin, turmeric and chilli red ---------- */
  :root {
    --bg: #f3f2ee; --side: #fafaf7; --band-a: #e1e5e8; --band-b: #eceeef; --brush: rgba(255,255,255,.55);
    --card: #ffffff; --card-2: #f6f6f2; --sunk: #ebedee; --panel: #ffffff;
    --ink: #1b1f22; --ink-2: #3b4247; --muted: #687076; --line: rgba(27,31,34,.09); --line-2: rgba(27,31,34,.15);
    --steel: #8d979f; --steel-l: #d5dade; --steel-d: #59626a;
    --tur: #e2a11b; --tur-ink: #8a5900; --tur-soft: #fbefd1;
    --chi: #c8372b; --chi-h: #b32d22; --chi-ink: #ad2c21; --chi-soft: #fbe3df;
    --leaf: #2c8654; --leaf-soft: #dcf0e3; --sky: #3a77a6; --sky-soft: #dee9f3;
    --accent: var(--chi); --accent-ink: #fff; --focus: #c8372b;
    --good: var(--leaf); --bad: var(--chi); --warn: var(--tur-ink);
    --shadow: 0 1px 2px rgba(20,24,28,.05), 0 8px 20px -14px rgba(20,24,28,.22);
    --shadow-h: 0 2px 4px rgba(20,24,28,.06), 0 18px 32px -16px rgba(20,24,28,.32);
    --radius: 14px; --radius-sm: 10px;
    --overlay: rgba(24,28,32,.32); --tip-bg: #1d2226; --tip-ink: #fff;
    --map-land: #eef0ea; --map-sea: #d3e2ea; --map-wave: #bed3df; --map-road: #ffffff; --map-case: #dcdfd8; --map-street: #e2e5df; --map-park: #dcebd6;
    --crate-a: #4a535a; --crate-b: #2f363b; --crate-edge: #6c767d; --crate-bar: rgba(255,255,255,.07); --stage: #eef0f1;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #111315; --side: #15181a; --band-a: #1b1f22; --band-b: #16191c; --brush: rgba(255,255,255,.025);
    --card: #1b1f22; --card-2: #212629; --sunk: #262b2f; --panel: #1d2124;
    --ink: #eceeea; --ink-2: #c5cacd; --muted: #959ea5; --line: rgba(255,255,255,.075); --line-2: rgba(255,255,255,.13);
    --steel: #7f8a92; --steel-l: #3a4146; --steel-d: #aab3ba;
    --tur: #f0b23a; --tur-ink: #f4c665; --tur-soft: rgba(240,178,58,.14);
    --chi: #f0604f; --chi-h: #ff7363; --chi-ink: #ff8a7c; --chi-soft: rgba(240,96,79,.15);
    --leaf: #5cc68b; --leaf-soft: rgba(92,198,139,.14); --sky: #78b2df; --sky-soft: rgba(120,178,223,.14);
    --accent-ink: #1b0a07; --focus: #f0b23a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.7);
    --shadow-h: 0 2px 4px rgba(0,0,0,.35), 0 20px 36px -18px rgba(0,0,0,.8);
    --overlay: rgba(0,0,0,.5); --tip-bg: #f1f2ee; --tip-ink: #16191c;
    --map-land: #1e2326; --map-sea: #142229; --map-wave: #1c313b; --map-road: #2d3438; --map-case: #23292c; --map-street: #252b2e; --map-park: #1d2a22;
    --crate-a: #3b4349; --crate-b: #252b2f; --crate-edge: #7d878e; --crate-bar: rgba(255,255,255,.06); --stage: #171a1d;
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: clip; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; max-width: 100%; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: 11px; font-weight: 700; color: hsl(var(--h) 45% 24%); background: hsl(var(--h) 45% 86%); flex: none; letter-spacing: .02em; position: relative; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 60% 86%); background: hsl(var(--h) 22% 28%); }
  .cc-av.lg { width: 44px; height: 44px; font-size: 14px; }
  .cc-av.sm { width: 24px; height: 24px; font-size: 9.5px; }

  /* ---------- Buttons, pills, chips, inputs ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 13px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 600; font-size: 12.5px; white-space: nowrap; text-decoration: none; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s, color .2s; }
  .btn:hover { border-color: var(--steel); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { background: var(--chi); border-color: transparent; color: #fff; }
  [data-theme="dark"] .btn.primary { color: #1b0a07; }
  .btn.primary:hover { background: var(--chi-h); box-shadow: 0 8px 18px -10px var(--chi); }
  .btn.dark { background: var(--ink); border-color: transparent; color: var(--bg); }
  .btn.tur { background: var(--tur); border-color: transparent; color: #2b1d00; }
  .btn.ghost { background: transparent; }
  .btn.danger { background: var(--chi); border-color: transparent; color: #fff; }
  .btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .btn.xs { min-height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 7px; gap: 4px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); position: relative; flex: none; transition: border-color .2s, background .2s; }
  .icon-btn:hover { border-color: var(--steel); color: var(--ink); }
  .icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }
  .icon-btn.bare { border-color: transparent; background: transparent; }
  .icon-btn[disabled] { opacity: .3; pointer-events: none; }
  .icon-btn .dotn { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--chi); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--band-a); }
  .icon-btn .dotn:empty { display: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .pill.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-waiting { background: var(--sunk); color: var(--muted); }
  .st-packed, .st-paused, .st-due, .st-progress { background: var(--tur-soft); color: var(--tur-ink); }
  .st-out { background: var(--sky-soft); color: var(--sky); }
  .st-delivered, .st-active, .st-paid, .st-resolved { background: var(--leaf-soft); color: var(--leaf); }
  .st-ending, .st-overdue, .st-open, .st-late { background: var(--chi-soft); color: var(--chi-ink); }
  .vt { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 650; border: 1px solid currentColor; white-space: nowrap; }
  .vt::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
  .v-chi { color: var(--chi-ink); } .v-tur { color: var(--tur-ink); } .v-sky { color: var(--sky); } .v-leaf { color: var(--leaf); }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--sunk); gap: 2px; flex: none; }
  .seg button { border: 0; background: transparent; padding: 4px 10px; min-height: 26px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background .2s, color .2s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 12px; font-weight: 600; color: var(--ink-2); transition: background .2s, color .2s, border-color .2s; }
  .chip:hover { border-color: var(--steel); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
  .chip i { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  .inp, .sel { height: 34px; padding: 0 11px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-size: 12.5px; min-width: 0; }
  .sel { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
  .inp:focus, .sel:focus { outline: none; border-color: var(--chi); box-shadow: 0 0 0 3px var(--chi-soft); }
  .sbox { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card); color: var(--muted); min-width: 0; }
  .sbox:focus-within { border-color: var(--chi); box-shadow: 0 0 0 3px var(--chi-soft); }
  .sbox input { border: 0; outline: 0; background: transparent; min-width: 0; width: 100%; font-size: 12.5px; color: var(--ink); }
  .switch { position: relative; width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--steel-l); flex: none; transition: background .2s; padding: 0; }
  [data-theme="dark"] .switch { background: #3d454b; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  .switch[aria-checked="true"] { background: var(--leaf); }
  .switch[aria-checked="true"]::after { transform: translateX(16px); }
  kbd { display: inline-block; padding: 0 5px; min-width: 18px; height: 18px; line-height: 17px; border-radius: 5px; border: 1px solid var(--line-2); font: 600 10.5px/17px inherit; color: var(--muted); background: var(--card); text-align: center; }

  /* ---------- Shared dialogs, toasts, popovers, tooltips, command search ---------- */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 12px; background: var(--tip-bg); color: var(--tip-ink); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: 12.5px; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--leaf); }
  .cc-toast.bad .ic { color: var(--chi); }
  .cc-toast.warn .ic { color: var(--tur); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateY(10px); } }
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(700px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; overflow: hidden; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: 16px 0 0 16px; transform: translateY(0) translateX(30px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 2; }
  .cc-dh h2 { font-size: 16px; letter-spacing: -.01em; }
  .cc-x { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); }
  .cc-x:hover { background: var(--sunk); }
  .cc-db { padding: 6px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--ink-2); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; max-height: 60vh; overflow: auto; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 9px 12px; text-align: left; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--chi); }
  .cc-pick small { margin-left: auto; color: var(--muted); }
  .cc-pick img { width: 40px; height: 32px; border-radius: 6px; object-fit: cover; }
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; align-content: start; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--ink); font-size: 13px; }
  .cc-field textarea { resize: vertical; }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--chi); box-shadow: 0 0 0 3px var(--chi-soft); }
  .cc-field [aria-invalid="true"] { border-color: var(--chi); }
  .cc-err { color: var(--chi-ink); font-size: 11.5px; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: 11.5px; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 110px; max-width: 260px; padding: 8px 10px; border-radius: 10px; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 2px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; width: min(560px, 100%); }
  .cc-cmdk-q { width: 100%; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--chi); background: var(--card-2); font-size: 14px; }
  .cc-cmdk-q:focus { outline: none; box-shadow: 0 0 0 3px var(--chi-soft); }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--sunk); }
  .cc-cmdk-list li[aria-selected="true"] .ic { color: var(--chi); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* ---------- App shell: sidebar, top bar, band ---------- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .scrim { display: none; }
  .side { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px 12px; z-index: 40; scrollbar-width: thin; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; text-decoration: none; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(150deg, #2b3237, #14181b); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 8px -3px rgba(0,0,0,.4); flex: none; }
  .logo svg { width: 20px; height: 26px; }
  .brand b { display: block; font-size: 15px; letter-spacing: -.015em; }
  .brand small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .nav { display: grid; gap: 2px; position: relative; }
  .nav a { display: flex; align-items: center; gap: 10px; height: 35px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-weight: 550; font-size: 13px; position: relative; transition: background .2s, color .2s; }
  .nav a .ic { color: var(--muted); transition: color .2s; }
  .nav a:hover { background: var(--sunk); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .nav a[aria-current="page"] .ic { color: var(--chi); }
  .nav .mark { position: absolute; left: -12px; top: 0; width: 3px; height: 35px; border-radius: 0 3px 3px 0; background: var(--tur); transition: transform .35s cubic-bezier(.3,1.3,.5,1), opacity .2s; pointer-events: none; }
  .nav .badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--chi-soft); color: var(--chi-ink); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  .nav .badge.n { background: var(--sunk); color: var(--muted); }
  .side h3 { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); font-weight: 600; margin: 16px 10px 4px; letter-spacing: .02em; }
  .side-area { display: flex; align-items: center; gap: 9px; width: 100%; height: 29px; padding: 0 10px; border: 0; background: transparent; border-radius: 8px; color: var(--ink-2); font-size: 12.5px; text-align: left; transition: background .2s; }
  .side-area:hover { background: var(--sunk); }
  .side-area em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .ring { width: 15px; height: 15px; transform: rotate(-90deg); flex: none; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: var(--steel-l); }
  .ring .fg { stroke: var(--leaf); stroke-linecap: round; transition: stroke-dasharray .6s; }
  .side-rider { display: flex; align-items: center; gap: 9px; padding: 4px 10px; border-radius: 8px; text-decoration: none; }
  .side-rider:hover { background: var(--sunk); }
  .side-rider b { display: block; font-size: 12.5px; font-weight: 600; }
  .side-rider small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }

  /* ---------- Signature 1: the rider's carrier that tiffins stack into ---------- */

  @keyframes rigGo { 20% { transform: translateX(-8px); } to { transform: translateX(330px); } }
  @keyframes rigCome { from { transform: translateX(-330px); } }
  .crate { position: relative; margin: 0 4px; height: calc(var(--rows, 2) * 42px + 12px); border-radius: 7px 7px 5px 5px; border: 2px solid var(--crate-edge); background: repeating-linear-gradient(90deg, transparent 0 15px, var(--crate-bar) 15px 17px), linear-gradient(180deg, var(--crate-a), var(--crate-b)); box-shadow: inset 0 10px 16px -12px rgba(0,0,0,.6); }

  .wheel { position: relative; width: 36px; height: 36px; margin: -3px auto 0; border-radius: 50%; background: radial-gradient(circle, #cfd5d9 0 4px, #59626a 5px 7px, #22272a 8px 12px, #121517 13px); }
  .wheel::before { content: ""; position: absolute; left: -10px; right: -10px; top: -4px; height: 14px; border-radius: 14px 14px 0 0; border: 3px solid #5d666d; border-bottom: 0; }

  .packer-f { display: flex; align-items: center; gap: 10px; margin-top: 10px; }

  /* ---------- Kitchen page ---------- */

    { id: uid(), text: `${subs[4].name} paused lunches until ${fdate(subs[4].pause.to)}`, icon: "pause", read: false },
    { id: uid(), text: "Shakeel is 9 minutes behind on the DHA route", icon: "clock", read: false },
    { id: uid(), text: `${st.pays.filter((p) => p.status === "overdue").length} payments are overdue by more than 3 days`, icon: "coin", read: false },
    { id: uid(), text: `New complaint from ${subs[41].name}: missing item`, icon: "flag", read: true },
    { id: uid(), text: "Next week's menu is not published yet", icon: "calendar", read: true },
  ];
  return st;
}

/* Today's orders: one per subscriber who is not paused, routed per area by nearest stop first */
function makeDay(st) {
  reseed(hashStr(iso(SDAY)));
  st.day = iso(SDAY);
  st.clock = 12 * 60 + 44;
  st.pk = 0;
  const sub = (id) => st.subs.find((s) => s.id === id);
  st.orders = [];
  st.subs.forEach((s) => {
    if (pausedOn(s, SDAY) || s.status === "ended") return;
    st.orders.push({ id: "o-" + s.id, sub: s.id, area: s.area, n: s.n, variant: s.variant, note: s.note, status: "waiting", stop: 0, at: 0, late: false });
  });
  AREAS.forEach((a) => {
    const list = st.orders.filter((o) => o.area === a.id);
    let cur = KITCHEN, k = 1;
    const left = list.slice();
    while (left.length) {
      left.sort((p, q) => mdist(sub(p.sub), cur) - mdist(sub(q.sub), cur));
      const nx = left.shift();
      nx.stop = k++;
      cur = sub(nx.sub);
    }
    const n = list.length, nd = Math.round(n * 0.28), no = Math.round(n * 0.18), np = 0;
    list.sort((p, q) => p.stop - q.stop).forEach((o, i) => {
      o.status = i < nd ? "delivered" : i < nd + no ? "out" : i < nd + no + np ? "packed" : "waiting";
      if (o.status === "delivered") { o.at = st.clock - (nd - i) * 6 - randi(1, 3); o.late = false; }
    });
    let load = 0;
    const target = randi(4, 9);
    for (const o of list.filter((x) => x.status === "waiting")) { if (load + o.n > target) break; o.status = "packed"; load += o.n; }
  });
  st.riders = RIDERS.map((r) => {
    const done = st.orders.filter((o) => o.area === r.area && o.status === "delivered").sort((p, q) => p.at - q.at);
    const out = st.orders.some((o) => o.area === r.area && o.status === "out");
    return { ...r, last: done.length ? done[done.length - 1].id : null, home: !done.length, legT: out ? rand(0.2, 0.6) : 0, trips: 2, cash: randi(4, 14) * 500 };
  });
  /* the live feed starts with what already happened today */
  const feed = [];
  st.orders.filter((o) => o.status === "delivered").sort((p, q) => q.at - p.at).slice(0, 5).forEach((o) => {
    const r = st.riders.find((x) => x.area === o.area);
    feed.push({ t: o.at, k: "deliver", text: `${r.name.split(" ")[0]} delivered ${o.n} ${o.n > 1 ? "tiffins" : "tiffin"} to ${sub(o.sub).name}` });
  });
  feed.push({ t: st.clock - 9, k: "send", text: `Asif left with ${randi(12, 15)} tiffins for PECHS (trip 2)` });
  const ps = st.subs.find((s) => pausedOn(s, SDAY));
  if (ps) feed.push({ t: st.clock - 14, k: "pause", text: `${ps.name} paused lunches until ${fdate(ps.pause.to)}` });
  feed.push({ t: st.clock - 18, k: "pay", text: `${st.subs[1].name} paid Rs 9,600 by bank transfer` });
  feed.push({ t: st.clock - 23, k: "send", text: `Imran left with 16 tiffins for Clifton (trip 2)` });
  st.feed = feed.sort((p, q) => q.t - p.t).slice(0, 9);
}

function invoiceAmt(st, s) {
  const p = st.plans.find((x) => x.id === s.plan) || st.plans[0];
  return p.id === "ofc" ? p.price * s.n * 24 : p.id === "fam" ? p.price * s.n : p.price;
}
function makePayments(st) {
  reseed(77);
  st.pays = [];
  const cur = MON[TODAY.getMonth()] + " " + TODAY.getFullYear();
  const pm = addDays(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), -1);
  const prev = MON[pm.getMonth()] + " " + pm.getFullYear();
  st.subs.forEach((s) => {
    const amt = invoiceAmt(st, s), r = R();
    const status = r < 0.72 ? "paid" : r < 0.89 ? "due" : "overdue";
    const m = R(), method = m < 0.45 ? "bank" : m < 0.75 ? "wallet" : "cash";
    const ref = () => (method === "bank" ? "TRX-" + randi(100000, 999999) : method === "wallet" ? "WL-" + randi(10000, 99999) : "");
    if (status === "paid") st.pays.push({ id: "p" + uid(), sub: s.id, amt, method, status, date: iso(addDays(TODAY, -randi(0, 22))), period: cur, ref: ref() });
    else st.pays.push({ id: "p" + uid(), sub: s.id, amt, method, status, date: iso(addDays(TODAY, status === "due" ? randi(1, 7) : -randi(3, 12))), period: cur, ref: "" });
    st.pays.push({ id: "p" + uid(), sub: s.id, amt, method, status: "paid", date: iso(addDays(TODAY, -randi(26, 50))), period: prev, ref: ref() });
  });
}
function makeComplaints(st) {
  const owners = ["Farah Siddiqui", "Kaleem Ahmed (head cook)", "Packing team"];
  st.cpl = CPL0.map((c, i) => {
    const s = st.subs[c.s], r = RIDERS.find((x) => x.area === s.area);
    const date = iso(addDays(SDAY, -c.d));
    const owner = c.t === "late" || c.t === "cold" ? r.name : owners[i % 3];
    const log = [{ k: "raised", t: `${fdate(date)}, ${clockStr(c.h)}`, text: "Raised by phone call" }];
    if (c.st !== "open") log.push({ k: "assigned", t: `${fdate(date)}, ${clockStr(c.h + 12)}`, text: `Assigned to ${owner}` });
    if (c.st === "resolved") {
      log.push({ k: "note", t: `${fdate(date)}, ${clockStr(c.h + 40)}`, text: "Called the subscriber and said sorry" });
      if (c.credit) log.push({ k: "credit", t: `${fdate(date)}, ${clockStr(c.h + 44)}`, text: `Credit of Rs ${num(c.credit)} added to next bill` });
      log.push({ k: "resolved", t: `${fdate(addDays(parseIso(date), c.d > 4 ? 1 : 0))}, ${clockStr(c.h + 95)}`, text: "Marked resolved" });
    }
    return { id: "c" + (i + 1), type: c.t, sub: s.id, area: s.area, rider: r.name, date, time: c.h, status: c.st, owner: c.st === "open" ? "" : owner, credit: c.credit || 0, text: c.text, log, fix: c.st === "resolved" ? randi(40, 300) : 0 };
  });
}

/* ---------- State: load, or build a fresh demo ---------- */
let S = store.get(KEY, null);
if (!S || S.v !== 1 || !Array.isArray(S.subs) || !S.cfg) S = seed();
if (S.day !== iso(SDAY)) makeDay(S); /* a new day: fresh orders, riders and feed */
const save = () => store.set(KEY, S);
save();

/* ---------- Look-ups and small derived numbers ---------- */
const subOf = (id) => S.subs.find((s) => s.id === id) || { id, name: "Former subscriber", area: "clf", addr: "", x: KITCHEN.x, y: KITCHEN.y, n: 1, plan: "std", variant: "reg", phone: "" };
const areaOf = (id) => AREAS.find((a) => a.id === id) || AREAS[0];
const riderOf = (areaId) => S.riders.find((r) => r.area === areaId);
const riderById = (id) => S.riders.find((r) => r.id === id) || S.riders[0];
const planOf = (id) => S.plans.find((p) => p.id === id) || S.plans[0];
const dishOf = (id) => S.dishes.find((d) => d.id === id);
const orderById = (id) => S.orders.find((o) => o.id === id);
const ordersIn = (areaId) => S.orders.filter((o) => o.area === areaId);
const tiffins = (list) => sum(list.map((o) => o.n));
const carrierLoad = (areaId) => tiffins(S.orders.filter((o) => o.area === areaId && o.status === "packed"));
const routeOf = (r) => S.orders.filter((o) => o.area === r.area && (o.status === "out" || o.status === "delivered")).sort((a, b) => a.stop - b.stop);
const doneSeq = (r) => S.orders.filter((o) => o.area === r.area && o.status === "delivered").sort((a, b) => a.at - b.at);
const nextStop = (r) => routeOf(r).find((o) => o.status === "out");
const ptOf = (o) => { const s = subOf(o.sub); return { x: s.x, y: s.y }; };
const lastPoint = (r) => (r.home || !r.last || !orderById(r.last) ? KITCHEN : ptOf(orderById(r.last)));
const firstName = (n) => String(n).split(" ")[0];
const subStatus = (s) => (pausedOn(s, SDAY) ? "paused" : s.status === "ending" ? "ending" : "active");
const SUB_ST = { active: "Active", paused: "Paused", ending: "Ending soon" };
const balanceOf = (sid) => sum(S.pays.filter((p) => p.sub === sid && p.status !== "paid").map((p) => p.amt));
const varTag = (v) => `<span class="vt ${VARS[v].cls}">${VARS[v].name}</span>`;
const dishImg = (d, w = 40, h = 40) => (d && d.img ? `<img src="${IMG(d.img)}" alt="" width="${w}" height="${h}" loading="lazy">` : `<span class="dish-ic c-${d ? d.course : "main"}">${ic(COURSE_IC[d ? d.course : "main"])}</span>`);
const WEEK_START = addDays(SDAY, -(SDAY.getDay() - 1));
const weekDate = (i) => addDays(WEEK_START, i);
const todayIdx = () => clamp(SDAY.getDay() - 1, 0, 5);
function dayCost(i) { const m = S.menu[i]; return sum(["main", "bread", "extra"].map((c) => (dishOf(m[c]) || { cost: 0 }).cost)) + PACKING_COST; }
const avgPrice = () => Math.round(planOf("std").price / 24);

/* History for reports: 90 working days, made once per day from a seed */
const HIST = (() => {
  reseed(hashStr("hist" + iso(TODAY)));
  const out = [];
  let d = addDays(SDAY, -1), k = 0;
  while (out.length < 90) {
    if (d.getDay() !== 0) {
      const trend = 1 - k * 0.0028, wk = [0, 1.04, 1.02, 1, 1.03, 0.97, 0.78][d.getDay()];
      const t = Math.round((150 * trend + rand(-9, 9)) * wk);
      out.unshift({ date: iso(d), label: fdate(d), dow: d.getDay(), tiffins: t, ontime: clamp(rand(88, 99) - (d.getDay() === 5 ? 3 : 0), 80, 100), revenue: Math.round(t * rand(372, 392)), left: randi(0, 7), cpl: R() < 0.32 ? randi(1, 2) : 0 });
      k++;
    }
    d = addDays(d, -1);
  }
  return out;
})();

<script>
/* =====================================================================
   Tiffin Route: shell, live kitchen simulation, kitchen board and the
   riders map. The other pages follow in the next script.
   ===================================================================== */
const view = $("#view");
const ui = {
  packArea: AREAS.slice().sort((a, b) => carrierLoad(b.id) - carrierLoad(a.id))[0].id,
  boardSt: "all", boardVar: "all", boardQ: "", boardMore: {}, lunchDay: todayIdx(),
  subQ: "", subSt: "all", subArea: "", subPlan: "", subSort: "name", subDir: 1, subPage: 0,
  rider: "r1", mapAll: true, payTab: "all", payQ: "", payMethod: "", payPage: 0,
  cplTab: "open", cplSel: null, cplQ: "", repRange: 30, setTab: "kitchen", menuDay: todayIdx(), libQ: "", libCourse: "all",

let current = null;
const toMin = (hhmm) => { const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + (m || 0); };

const kpi = (label, icon, value, sub, extra = "") => `<div class="kpi"><span class="l">${ic(icon)}${label}</span><b class="v">${value}</b>${sub ? `<span class="s">${sub}</span>` : ""}${extra}</div>`;
const band = ({ crumb, title, sub, kpis = "", n = 4, actions = "", side = "", cls = "", extra = "" }) => `
  <section class="band">

        ${extra}
      </div>
      ${side || (actions ? `<div class="band-actions">${actions}</div>` : "")}
    </div>
  </section>`;
const crumbOf = (t) => `${esc(S.cfg.kitchen)}<i></i>${t}`;

/* ---------- Sidebar: pages, areas today, riders ---------- */
function drawNav() {
  const open = S.cpl.filter((c) => c.status !== "resolved").length;
  const overdue = S.pays.filter((p) => p.status === "overdue").length;
  const badge = { subscribers: [S.subs.length, "n"], payments: [overdue, ""], complaints: [open, ""] };
  $("#nav").innerHTML = `<span class="mark" aria-hidden="true"></span>` + PAGES.map(([id, label, icon]) => `<a href="#/${id}"${id === current ? ' aria-current="page"' : ""}>${ic(icon)}<span>${label}</span>${badge[id] && badge[id][0] ? `<span class="badge ${badge[id][1]}">${badge[id][0]}</span>` : ""}</a>`).join("");
  moveMarker();
}
function drawSide() {
  const box = $("#sideAreas");
  const rows = AREAS.map((a) => { const l = ordersIn(a.id), T = tiffins(l), d = tiffins(l.filter((o) => o.status === "delivered")); return { a, T, d }; });
  if (box.children.length !== AREAS.length) {
    box.innerHTML = rows.map(({ a, T, d }) => `<button type="button" class="side-area" data-act="area" data-a="${a.id}" aria-label="${a.name}: ${d} of ${T} tiffins delivered">${ringSVG(T ? (d / T) * 100 : 0)}<span>${a.name}</span><em>${d}/${T}</em></button>`).join("");
  } else {
    rows.forEach(({ a, T, d }, i) => {
      const b = box.children[i];
      b.querySelector(".fg").setAttribute("stroke-dasharray", `${T ? (d / T) * 100 : 0} 100`);
      b.querySelector("em").textContent = `${d}/${T}`;

    });
  }
  $("#areasTot").textContent = tiffins(S.orders);
  const rb = $("#sideRiders");
  const rr = S.riders.map((r) => {
    const nx = nextStop(r), rt = routeOf(r);
    return { r, nx, st: nx ? `${areaOf(r.area).name} · stop ${rt.indexOf(nx) + 1} of ${rt.length}` : r.home ? "At the kitchen" : "Heading back" };
  });
  if (rb.children.length !== S.riders.length) {
    rb.innerHTML = rr.map(({ r, nx, st }) => `<a class="side-rider" href="#/riders" data-act="rider" data-r="${r.id}">${avatar(r.name, "", `<i class="on ${nx ? "" : "idle"}"></i>`)}<span><b>${esc(r.name)}</b><small>${st}</small></span></a>`).join("");
  } else {
    rr.forEach(({ nx, st }, i) => { const a = rb.children[i]; a.querySelector("small").textContent = st; a.querySelector(".on").className = "on" + (nx ? "" : " idle"); });
  }
  $("#ridersTot").textContent = rr.filter((x) => x.nx).length + " moving";
}
function drawBell() { $("#bellN").textContent = S.notes.filter((n) => !n.read).length || ""; }
function note(text, icon = "bell") { S.notes.unshift({ id: uid(), text, icon, read: false }); S.notes = S.notes.slice(0, 14); drawBell(); }

/* ---------- Theme and motion ---------- */
const SYS_RM = RM;
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $("[data-theme-toggle]");
  if (b) { b.innerHTML = ic(t === "dark" ? "sun" : "moon"); b.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme"); }
}
function applyPrefs() {
  RM = SYS_RM || !!S.cfg.calm;
  document.documentElement.classList.toggle("calm", !!S.cfg.calm);
  if (document.documentElement.dataset.themeLock) { setTheme(document.documentElement.dataset.theme); return; }
  const sys = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  setTheme(S.cfg.theme === "light" || S.cfg.theme === "dark" ? S.cfg.theme : sys);
}

/* ---------- Live feed ---------- */
const FEED_IC = { deliver: ["check", "deliver"], send: ["bike", "send"], pack: ["box", "pack"], pause: ["pause", ""], pay: ["coin", ""], alert: ["alert", "alert"] };
const feedLi = (f, isNew) => `<li class="${isNew ? "new" : ""}"><span class="fi ${(FEED_IC[f.k] || FEED_IC.alert)[1]}">${ic((FEED_IC[f.k] || FEED_IC.alert)[0])}</span><p>${esc(f.text)}</p><time>${clockStr(f.t)}</time></li>`;
function pushFeed(k, text) {
  const item = { t: S.clock, k, text };
  S.feed.unshift(item);
  S.feed = S.feed.slice(0, 12);
  const ul = current === "kitchen" && $("#feed");
  if (ul) { ul.insertAdjacentHTML("afterbegin", feedLi(item, !RM)); while (ul.children.length > 7) ul.lastElementChild.remove(); }
}

/* =====================================================================
   Live kitchen simulation: riders move along their routes, tick off
   stops, come back for the next carrier; the packing team packs one
   order every few seconds. Pause it from the kitchen or settings.
   ===================================================================== */
const TICK = 2600, SPEED = 11;
let lastTick = performance.now();
function simTick() {
  lastTick = performance.now();
  if (!S.cfg.live) return;
  S.clock = Math.min(S.clock + 0.5, 15 * 60);
  const changed = [];
  S.riders.forEach((r) => {
    const nx = nextStop(r);
    if (!nx && r.home) return;
    const from = lastPoint(r), to = nx ? ptOf(nx) : KITCHEN;
    r.legT = Math.min(1, r.legT + SPEED / Math.max(1, mdist(from, to)));
    if (r.legT < 1) return;
    r.legT = 0;
    if (nx) {
      deliver(nx, r);
      changed.push(nx);
    } else {
      r.home = true;
      pushFeed("send", `${firstName(r.name)} is back at the kitchen for the next carrier`);
    }
  });
  if (S.cfg.autopack) { S.pk = (S.pk || 0) + 1; if (S.pk % 3 === 0) autoPack(); }
  save();
  liveUpdate(changed);
}
function deliver(o, r) {
  o.status = "delivered";
  o.at = S.clock;
  o.late = S.clock > toMin(S.cfg.winTo);
  r.last = o.id;
  r.home = false;
  r.legT = 0;
  if (Math.random() < 0.3) r.cash += 400 * o.n;
  pushFeed("deliver", `${firstName(r.name)} delivered ${o.n} ${o.n > 1 ? "tiffins" : "tiffin"} to ${subOf(o.sub).name}${o.late ? " (late)" : ""}`);
}
function autoPack() {
  const cap = S.cfg.carrier;
  /* a rider waits at the kitchen with a loaded carrier: send it off */
  for (const a of AREAS) {
    const r = riderOf(a.id), load = carrierLoad(a.id);
    const left = ordersIn(a.id).some((o) => o.status === "waiting");
    if (r.home && !nextStop(r) && load > 0 && (load >= cap * 0.5 || !left)) { sendCarrier(a.id, true); return; }
  }
  /* otherwise pack the next order where it fits; areas whose rider is nearly done come first */
  const cands = AREAS.map((a) => {
    const o = ordersIn(a.id).filter((x) => x.status === "waiting").sort((x, y) => x.stop - y.stop)[0];
    return { a, o, left: routeOf(riderOf(a.id)).filter((x) => x.status === "out").length };
  }).filter((c) => c.o && carrierLoad(c.a.id) + c.o.n <= cap);
  if (!cands.length) return;
  cands.sort((x, y) => x.left - y.left);
  const c = Math.random() < 0.6 ? cands[0] : cands[Math.floor(Math.random() * cands.length)];
  packOrder(c.o, null, true);
}
function liveUpdate(changed) {
  $("#clock").textContent = clockStr(S.clock);
  const dn = $("#dlNow");
  if (dn) { dn.style.left = dpos(S.clock) + "%"; $("#dlNowT").textContent = clockStr(S.clock); }
  drawSide();
  if (current === "kitchen") { changed.forEach(patchOrder); updateKitchen(); }
  if (current === "riders") RD.refresh(changed, changed.length > 0);
}
function setLive(on) {
  S.cfg.live = on;
  save();
  $("#liveDot").classList.toggle("off", !on);
  $$("[data-live-label]").forEach((b) => (b.innerHTML = on ? ic("pause") + "Pause live" : ic("play") + "Resume live"));
  $$(".live[data-feed-dot]").forEach((d) => d.classList.toggle("off", !on));
  toast(on ? "Live updates are on" : "Live updates paused");
}

/* =====================================================================
   Signature 1: the packing line. Each packed order drops its tiffins
   into the rider's carrier (bottom row first, then stacked on top);
   a full carrier rides away and an empty one rolls in.
   ===================================================================== */
const slotPos = (i) => ({ left: 4 + (i % 8) * 33, bottom: 6 + Math.floor(i / 8) * 41 });
const tfHTML = (i, v, delay) => { const p = slotPos(i); return `<svg class="tf${delay >= 0 ? " drop" : ""}" style="left:${p.left}px;bottom:${p.bottom}px;color:${VARS[v].c};--d:${Math.max(0, delay)}ms" viewBox="0 0 30 40" aria-hidden="true" focusable="false"><use href="#tiffin"/></svg>`; };
function rigHTML(a, intro) {
  const rows = Math.ceil(S.cfg.carrier / 8);
  let i = 0, tf = "";
  S.orders.filter((o) => o.area === a && o.status === "packed").forEach((o) => { for (let k = 0; k < o.n; k++, i++) tf += tfHTML(i, o.variant, intro && !RM ? 260 + i * 75 : -1); });
  return `<div class="rig" id="rig"><div class="crate" style="--rows:${rows}">${tf}<span class="stamp">TIFFIN ROUTE · ${esc(areaOf(a).name.toUpperCase())}</span></div><div class="rack"></div><div class="wheel"></div></div>`;
}
function packerState(a) {
  const r = riderOf(a), load = carrierLoad(a), cap = S.cfg.carrier;
  if (load >= cap) return ["Full, ready to go", "st-ending"];
  if (r.home && !nextStop(r)) return [load ? "Rider is waiting" : "Rider at the kitchen", "st-packed"];
  return [nextStop(r) ? "Rider on the road" : "Rider heading back", "st-out"];
}
function packerHTML(intro) {
  const a = ui.packArea, r = riderOf(a), cap = S.cfg.carrier, load = carrierLoad(a), rows = Math.ceil(cap / 8);
  const [st, cls] = packerState(a);
  const wait = ordersIn(a).filter((o) => o.status === "waiting").length;

function lunchDots(s) {

      const p = s.pause && iso(d) >= s.pause.from && iso(d) <= s.pause.to;
      const r = R();
      out.unshift({ d, k: p ? "pause" : r < 0.08 ? "late" : r < 0.1 ? "miss" : "" });
    }
    d = addDays(d, -1);
  }
  return `<div class="dots">${out.map((x) => `<i class="${x.k}" data-tip="${esc(`<b>${DAYL[x.d.getDay()]}, ${fdate(x.d)}</b><div>${x.k === "pause" ? "Paused" : x.k === "late" ? "Delivered late" : x.k === "miss" ? "Missed, credit given" : "Delivered on time"}</div>`)}"></i>`).join("")}</div>`;
}

function exportCSV(name, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(`Saved ${name} (${rows.length - 1} rows)`);
  } catch (e) { toast("This browser blocked the download", "bad"); }
}

  const p = VIEWS[name];

    patchOrder(o); updateKitchen(); drawSide();
    toast(`${subOf(o.sub).name} is back in the waiting line`);
  },
  boardMore(el) { ui.boardMore[el.dataset.a] = true; const c = $("#cards-" + el.dataset.a); if (c) c.innerHTML = colCards(el.dataset.a); },
  lunchDay(el) { ui.lunchDay = +el.dataset.i; const c = $("#lunch"); if (c) { c.outerHTML = lunchCard(); const img = $("#lunch .lunch-ph img"); if (img && !RM) img.animate([{ opacity: 0, transform: "scale(1.05)" }, { opacity: 1, transform: "scale(1)" }], { duration: 450, easing: "ease-out" }); } },
  liveToggle() { setLive(!S.cfg.live); },
  newDay() { makeDay(S); save(); ui.packArea = AREAS.slice().sort((a, b) => carrierLoad(b.id) - carrierLoad(a.id))[0].id; $("#clock").textContent = clockStr(S.clock); afterChange(); toast(`A fresh lunch day: ${tiffins(S.orders)} tiffins to cook`); },
  rider(el) { ui.rider = el.dataset.r; if (current === "riders") { rerender(); const m = $(".mapcard"); if (m && el.closest("tr")) m.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); } },
  mapAll(el) { ui.mapAll = el.dataset.v === "1"; $$('[data-act="mapAll"]').forEach((b) => b.setAttribute("aria-pressed", String(b === el))); RD.refresh([]); },
  callRider() { const r = riderById(ui.rider); toast(`Calling ${r.name} on ${r.phone}`); },
  replan() {
    const r = riderById(ui.rider), outs = routeOf(r).filter((o) => o.status === "out");
    if (outs.length < 2) { toast(`${firstName(r.name)} has fewer than two stops left`, "warn"); return; }
    const len = (list) => { let p = riderPos(r, 0), d = 0; list.forEach((o) => { d += mdist(p, ptOf(o)); p = ptOf(o); }); return d; };
    const before = len(outs), nums = outs.map((o) => o.stop).sort((a, b) => a - b), left = outs.slice(), plan = [];
    let cur = lastPoint(r);
    while (left.length) { left.sort((a, b) => mdist(ptOf(a), cur) - mdist(ptOf(b), cur)); const nx = left.shift(); plan.push(nx); cur = ptOf(nx); }
    plan.forEach((o, i) => (o.stop = nums[i]));
    r.legT = 0;
    save();
    RD.refresh([]);
    const saved = Math.max(0, before - len(plan));
    toast(saved > 0 ? `Route re-planned, about ${(saved * 0.03).toFixed(1)} km shorter` : "This route is already the shortest");
  },
  stopMove(el) {
    const o = orderById(el.dataset.id), r = riderOf(o.area), outs = routeOf(r).filter((x) => x.status === "out"), i = outs.indexOf(o), j = i + +el.dataset.dir;
    if (j < 0 || j >= outs.length) return;
    const t = outs[j].stop; outs[j].stop = o.stop; o.stop = t;
    if (i === 0 || j === 0) r.legT = 0;
    save();
    RD.refresh([]);
    toast(`${subOf(o.sub).name} moved ${+el.dataset.dir < 0 ? "earlier" : "later"}`);
  },
  stopDone(el) {
    const o = orderById(el.dataset.id);
    if (!o || o.status !== "out") return;
    const r = riderOf(o.area);
    const first = nextStop(r) === o;
    deliver(o, r);
    if (!first) r.legT = 0;
    save();
    if (current === "riders") RD.refresh([o]); else { patchOrder(o); updateKitchen(); }
    drawSide();
    toast(`${subOf(o.sub).name} marked delivered`);
  },
  addSub() { subForm(); },
  subOpen(el) { openSub(el.dataset.id); },
  subEdit(el) { const s = sub1(el); if (!s) return; closeAll(); subForm(s); },
  subPause(el) { const s = sub1(el); if (!s) return; closeAll(); pauseForm(s); },
  subResume(el) { const s = sub1(el); if (!s) return; closeAll(); resumeSub(s); },
  async subDel(el) {
    const s = sub1(el);
    if (!s) return;
    if (!(await confirmBox(`Delete ${s.name}? Their unpaid bills and today's tiffin (if not sent yet) go too.`, "Delete subscriber"))) return;
    S.subs.splice(S.subs.indexOf(s), 1);
    S.pays = S.pays.filter((p) => p.sub !== s.id || p.status === "paid");
    S.orders = S.orders.filter((o) => o.sub !== s.id || o.status === "out" || o.status === "delivered");
    save();
    closeAll();
    toast(`${s.name} deleted`);
    afterChange();
  },
  subSort(el) { const k = el.dataset.k; if (ui.subSort === k) ui.subDir *= -1; else { ui.subSort = k; ui.subDir = k === "balance" || k === "n" ? -1 : 1; } drawSubTable(); },
  subPage(el) { ui.subPage += +el.dataset.d; drawSubTable(); },
  exportSubs() { exportCSV("tiffin-route-subscribers.csv", [["Name", "Type", "Phone", "Area", "Address", "Plan", "Tiffins", "Variant", "Status", "Balance (Rs)"], ...subList().map((s) => [s.name, s.kind, s.phone, areaOf(s.area).name, s.addr, planOf(s.plan).name, s.n, VARS[s.variant].name, SUB_ST[subStatus(s)], balanceOf(s.id)])]); },
  menuDay(el) { ui.menuDay = +el.dataset.i; $$(".wk-h").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.i === ui.menuDay))); const p = $("#prep"); if (p) p.innerHTML = prepHTML(); },
  async cell(el) {
    const i = +el.dataset.i, c = el.dataset.c;
    const opts = S.dishes.filter((d) => d.course === c).map((d) => ({ label: d.name, hint: `Rs ${d.cost} · ★ ${d.rating.toFixed(1)}`, img: d.img ? IMG(d.img) : "", icon: COURSE_IC[c], value: d.id }));
    const v = await pickBox(`${DAYL[weekDate(i).getDay()]} · ${courseName(c)}`, opts, "Pick the dish for this slot.");
    if (v) setDish(i, c, v);
  },
  async dishAdd(el) {
    const d = dishOf(el.dataset.id);
    if (!d) return;
    const v = await pickBox(`Plan ${d.name}`, S.menu.map((m, i) => ({ label: `${DAYL[weekDate(i).getDay()]}, ${fdate(weekDate(i))}`, hint: `now: ${(dishOf(m[d.course]) || { name: "empty" }).name}`, icon: "calendar", value: String(i) })), `It goes in the ${courseName(d.course)} slot of the day you pick.`);
    if (v != null) setDish(+v, d.course, d.id);
  },
  addDish() {
    formModal({
      title: "New dish", submit: "Add dish",
      values: { course: "main", cost: 120, spice: "1" },
      fields: [
        { name: "name", label: "Dish name", required: true, placeholder: "For example Chicken and spinach curry", check: (v) => (v.length < 3 ? "Use at least 3 letters" : S.dishes.some((d) => d.name.toLowerCase() === v.toLowerCase()) ? "This dish is already in the list" : "") },
        { name: "course", label: "Slot", type: "select", half: true, options: COURSES.map(([c, l]) => [c, l]) },
        { name: "cost", label: "Cost per tiffin (Rs)", type: "number", min: 5, max: 1000, half: true, required: true },
        { name: "spice", label: "Spice", type: "select", half: true, options: [["0", "Not spicy"], ["1", "Mild"], ["2", "Medium"], ["3", "Hot"]] },
        { name: "main", label: "Main ingredient", half: true, placeholder: "For example Chicken", required: true },
      ],
      onSubmit(v) {
        const d = { id: "d" + uid(), name: v.name, course: v.course, cost: Math.round(v.cost), spice: +v.spice, rating: 4.5, votes: 0, ing: [[v.main, v.course === "main" ? 150 : 90]] };
        S.dishes.unshift(d);
        ui.libCourse = "all"; ui.libQ = "";
        save();
        toast(`${v.name} added. Drag it onto a day`);
        rerender();
      },
    });
  },
  copyWeek() { S.menu = WEEK0.map((d) => ({ ...d })); S.published = false; save(); MN.refresh(); toast("Last week's menu copied in"); },
  publishMenu() { S.published = true; save(); MN.refresh(); note("This week's menu was sent to subscribers", "calendar"); toast(`Menu sent to ${S.subs.length} subscribers by text message`); },
  printPrep() { window.print(); },
  payRecord(el) { payForm(el.dataset.sub, el.dataset.id); },
  payReceipt(el) { const p = S.pays.find((x) => x.id === el.dataset.id); if (p) receipt(p); },
  remind(el) {
    const p = S.pays.find((x) => x.id === el.dataset.id);
    if (!p) return;
    p.reminded = true;
    save();
    toast(`Reminder sent to ${subOf(p.sub).name}`);
    drawPayTable();
    const o = $("#overList"); if (o) o.innerHTML = overdueHTML();
  },
  remindAll() {
    const list = S.pays.filter((p) => p.status === "overdue" && !p.reminded);
    if (!list.length) { toast("Everyone overdue has a reminder already", "warn"); return; }
    list.forEach((p) => (p.reminded = true));
    save();
    toast(`${list.length} reminders sent by text message`);
    rerender();
  },
  payPage(el) { ui.payPage += +el.dataset.d; drawPayTable(); },
  cplSel(el) { ui.cplSel = el.dataset.id; $$(".citem").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === ui.cplSel))); const d = $("#cplDetail"); if (d) { d.innerHTML = cplDetailHTML(); if (!RM) d.animate([{ opacity: 0.4, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: "ease-out" }); } },
  cplStart(el) { const c = cpl1(el); if (!c) return; c.status = "progress"; ui.cplTab = "progress"; ui.cplSel = c.id; if (!c.owner) c.owner = S.cfg.lead; cplLog(c, "assigned", `${c.owner} started fixing it`); save(); toast("Marked in progress"); afterChange(); },
  cplResolve(el) {
    const c = cpl1(el);
    if (!c) return;
    formModal({
      title: "Resolve this complaint", submit: "Resolve",
      values: { credit: c.type === "late" || c.type === "spill" ? 400 : 0 },
      fields: [
        { name: "how", label: "What was done", type: "textarea", required: true, placeholder: "For example: Called her, sent a fresh tiffin", check: (v) => (v.length < 5 ? "Write a few words" : "") },
        { name: "credit", label: "Credit on the next bill (Rs)", type: "number", min: 0, max: 2000, hint: "0 for no credit" },
      ],
      onSubmit(v) {
        c.status = "resolved";
        ui.cplTab = "resolved";
        ui.cplSel = c.id;
        c.credit += +v.credit || 0;
        c.fix = Math.max(10, Math.round(S.clock - c.time) + daysBetween(c.date, SDAY) * 1440);
        cplLog(c, "note", v.how);
        if (+v.credit) cplLog(c, "credit", `Credit of ${money(+v.credit)} added to next bill`);
        cplLog(c, "resolved", "Marked resolved by " + S.cfg.lead);
        save();
        toast("Complaint resolved");
        afterChange();
      },
    });
  },
  cplReopen(el) { const c = cpl1(el); if (!c) return; c.status = "open"; ui.cplTab = "open"; ui.cplSel = c.id; cplLog(c, "raised", "Reopened"); save(); toast("Complaint reopened"); afterChange(); },
  cplNote(el) {
    const c = cpl1(el), t = $("#cplNote");
    if (!c || !t) return;
    if (t.value.trim().length < 3) { t.setAttribute("aria-invalid", "true"); t.focus(); toast("Write a short note first", "warn"); return; }
    cplLog(c, "note", t.value.trim());
    save();
    drawCpl();
    toast("Note added");
  },
  cplCall(el) { const c = cpl1(el); if (c) toast(`Calling ${subOf(c.sub).name} on ${subOf(c.sub).phone}`); },
  async cplDel(el) {
    const c = cpl1(el);
    if (!c) return;
    if (!(await confirmBox(`Delete the ${CTYPES[c.type].name.toLowerCase()} complaint from ${subOf(c.sub).name}?`, "Delete"))) return;
    S.cpl.splice(S.cpl.indexOf(c), 1);
    ui.cplSel = null;
    save();
    toast("Complaint deleted");
    afterChange();
  },
  cplNew() { cplForm(); },
  exportRep() { exportCSV(`tiffin-route-last-${ui.repRange}-days.csv`, [["Date", "Tiffins", "On time %", "Revenue (Rs)", "Leftovers", "Complaints"], ...HIST.slice(-ui.repRange).map((x) => [x.date, x.tiffins, x.ontime.toFixed(1), x.revenue, x.left, x.cpl])]); },
  setTab(el) { ui.setTab = el.dataset.v; drawSetPanel(); },
  setTabGo(el) { ui.setTab = el.dataset.v; },
  carrier(el) { S.cfg.carrier = +el.dataset.v; save(); drawSetPanel(); toast(`Carriers now hold ${S.cfg.carrier} tiffins`); },
  liveSwitch() { setLive(!S.cfg.live); drawSetPanel(); },
  autopack() { S.cfg.autopack = !S.cfg.autopack; save(); drawSetPanel(); toast(S.cfg.autopack ? "The packing team packs on its own" : "Only you pack now"); },
  alertSwitch(el) { const k = el.dataset.k; S.cfg.alerts[k] = !S.cfg.alerts[k]; save(); el.setAttribute("aria-checked", String(S.cfg.alerts[k])); toast("Alert setting saved"); },
  themePick(el) { S.cfg.theme = el.dataset.v; delete document.documentElement.dataset.themeLock; save(); applyPrefs(); redrawCharts(); drawSetPanel(); },
  calm() { S.cfg.calm = !S.cfg.calm; save(); applyPrefs(); drawSetPanel(); toast(S.cfg.calm ? "Calm motion is on" : "Full motion is back"); },
  reset() { resetData(); },
  exportJson() {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
      a.download = "tiffin-route-data.json";
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast("Saved tiffin-route-data.json");
    } catch (e) { toast("This browser blocked the download", "bad"); }
  },
  readAll() { S.notes.forEach((n) => (n.read = true)); save(); drawBell(); if (openPop) openPop.close(); toast("All alerts read"); },
  signout() { toast("This is a demo, so you stay signed in"); },
};
const CH = {
  cplOwner(el) { const c = S.cpl.find((x) => x.id === el.dataset.id); if (!c || !el.value) return; c.owner = el.value; if (c.status === "open") { c.status = "progress"; ui.cplTab = "progress"; } ui.cplSel = c.id; cplLog(c, "assigned", "Assigned to " + el.value); save(); toast("Assigned to " + el.value); afterChange(); },
};

document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t.closest) return;
  if (t.closest("[data-theme-toggle]")) { toggleTheme(); return; }
  const menu = t.closest("[data-menu]");
  if (menu) { const on = document.documentElement.classList.toggle("nav-open"); menu.setAttribute("aria-expanded", String(on)); return; }
  if (t.closest("[data-scrim]")) { document.documentElement.classList.remove("nav-open"); return; }
  if (t.closest("[data-cmdk]")) { cmdk(cmds); return; }
  const bell = t.closest("#bell");
  if (bell) { openBell(bell); return; }
  const a = t.closest("[data-act]");
  if (a && !a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!modals.length) cmdk(cmds); }
  if (e.key === "Escape" && document.documentElement.classList.contains("nav-open")) document.documentElement.classList.remove("nav-open");
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", (e) => {
  const el = e.target.closest && e.target.closest("[data-in]");
  if (!el) return;
  ui[el.dataset.in] = el.value;
  if (el.dataset.in.startsWith("sub")) ui.subPage = 0;
  if (el.dataset.in.startsWith("pay")) ui.payPage = 0;
  if (UPD[el.dataset.in]) UPD[el.dataset.in]();
});
document.addEventListener("change", (e) => {
  const el = e.target.closest && e.target.closest("[data-ch]");
  if (!el) return;
  if (CH[el.dataset.ch]) { CH[el.dataset.ch](el); return; }
  ui[el.dataset.ch] = el.value;
  if (el.dataset.ch.startsWith("sub")) ui.subPage = 0;
  if (el.dataset.ch.startsWith("pay")) ui.payPage = 0;
  if (UPD[el.dataset.ch]) UPD[el.dataset.ch]();
});
document.addEventListener("submit", (e) => { const f = e.target.closest && e.target.closest("form[data-form]"); if (f) { e.preventDefault(); FORMS[f.dataset.form](f); } });
/* Drag a dish from the list onto a day in the menu planner */
document.addEventListener("dragstart", (e) => { const d = e.target.closest && e.target.closest(".dish[data-dish]"); if (!d) return; e.dataTransfer.setData("text/plain", d.dataset.dish); e.dataTransfer.effectAllowed = "copy"; d.classList.add("dragging"); });
document.addEventListener("dragend", () => { $$(".dish.dragging").forEach((d) => d.classList.remove("dragging")); $$(".cell.over").forEach((c) => c.classList.remove("over")); });
document.addEventListener("dragover", (e) => { const c = e.target.closest && e.target.closest(".cell[data-drop]"); if (!c) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; $$(".cell.over").forEach((x) => x !== c && x.classList.remove("over")); c.classList.add("over"); });
document.addEventListener("drop", (e) => { const c = e.target.closest && e.target.closest(".cell[data-drop]"); if (!c) return; e.preventDefault(); c.classList.remove("over"); setDish(+c.dataset.i, c.dataset.c, e.dataTransfer.getData("text/plain")); });
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { redrawCharts(); moveMarker(); }, 160); });

/* ---------- Boot ---------- */
$$("[data-ic]").forEach((el) => (el.outerHTML = ic(el.dataset.ic)));
applyPrefs();
$("#leadName").textContent = S.cfg.lead;
$("#clock").textContent = clockStr(S.clock);
$("#liveDot").classList.toggle("off", !S.cfg.live);
drawNav();
drawSide();
drawBell();
startRouter(PAGES.map((p) => p[0]), "kitchen", render);
every(TICK, simTick);
</script>
</body>
