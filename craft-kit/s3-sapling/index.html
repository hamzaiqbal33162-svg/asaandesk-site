<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sapling · A referral link that grows a tree</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: sage paper, terracotta pot, fresh leaves ---------- */
  :root {
    --bg: #ecefdf;
    --card: #fffdf6;
    --field: #f5f4ea;
    --ink: #1e2a1f;
    --muted: #6d7867;
    --line: rgba(30, 42, 31, 0.13);
    --accent: #2f8a4c;
    --accent2: #226b39;
    --leaf1: #7cc35f;
    --leaf2: #3f9147;
    --trunk: #8a5a3c;
    --trunk2: #6c4229;
    --pot: #d2774c;
    --pot2: #b35d36;
    --soil: #5a3c28;
    --fruit: #f39a2b;
    --bloom: #f6a3bd;
    --gold: #f2b33d;
    --bad: #cf4a3a;
    --glow: #fff5c8;
    --shadow: rgba(50, 70, 40, 0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1812;
    --card: #15211a;
    --field: #1b2a21;
    --ink: #e9f2e4;
    --muted: #93a58f;
    --line: rgba(233, 242, 228, 0.1);
    --accent: #4fc276;
    --accent2: #3aa560;
    --leaf1: #62c46f;
    --leaf2: #2e8a47;
    --trunk: #7a5038;
    --trunk2: #5a3826;
    --pot: #b8643f;
    --pot2: #934b2b;
    --soil: #3b281c;
    --fruit: #ffab3d;
    --bloom: #f590b0;
    --gold: #ffc54d;
    --bad: #ff7262;
    --glow: #f9e27a;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Stage ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; isolation: isolate; background: radial-gradient(55% 60% at 30% 40%, color-mix(in srgb, var(--leaf1) 20%, transparent), transparent 70%), var(--bg); }
  .stage::before { content: ""; position: absolute; z-index: -1; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in srgb, var(--ink) 3%, transparent) 46px 47px); }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(0.98); } }
  .card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); width: min(780px, 100%); border-radius: 28px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 50px 90px -50px var(--shadow); overflow: hidden; animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }

  /* ---------- Tree scene ---------- */
  .scene { position: relative; min-height: 360px; overflow: hidden; background: radial-gradient(80% 60% at 50% 30%, var(--glow), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--leaf1) 14%, var(--card)), color-mix(in srgb, var(--leaf2) 20%, var(--card))); }
  :root[data-theme="dark"] .scene { background: radial-gradient(70% 50% at 50% 30%, rgba(98, 196, 111, 0.16), transparent 70%), linear-gradient(180deg, #13241a, #0f1c14); }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene svg * { transform-box: view-box; }
  .sway { transform-origin: 160px 306px; animation: sway 6s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  .flut { animation: flut 2.6s ease-in-out infinite; }
  @keyframes flut { 50% { transform: rotate(5deg); } }
  .mote { animation: mote 7s ease-in-out infinite; }
  @keyframes mote { 0%, 100% { transform: translate(0, 0); opacity: 0.2; } 50% { transform: translate(10px, -26px); opacity: 0.9; } }
  .bud { animation: bud 1.4s ease-in-out infinite; }
  @keyframes bud { 50% { transform: scale(1.25); } }
  .reward { position: absolute; left: 50%; top: 16px; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 16px 30px -14px var(--shadow); white-space: nowrap; transform: translate(-50%, -140%); opacity: 0; }
  .reward .coin { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b8, var(--gold) 60%, #c98a16); color: #6b4708; font-weight: 900; font-size: 0.62rem; }
  .reward b { display: block; font-size: 0.86rem; }
  .reward small { color: var(--muted); font-size: 0.7rem; }

  /* ---------- Panel ---------- */
  .panel { display: flex; flex-direction: column; gap: 12px; padding: 22px 22px 20px; min-width: 0; }
  .panel h1 { margin: 0; font-size: 1.18rem; letter-spacing: -0.015em; }
  .panel header p { margin: 3px 0 0; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  .panel header b { color: var(--ink); }
  .lbl { display: block; margin-bottom: 6px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .link { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 5px 0 13px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); }
  .url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 0.82rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
  .url b { color: var(--ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: 11px; background: var(--ink); color: var(--card); font-size: 0.82rem; font-weight: 800; cursor: pointer; flex: none; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.25s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: scale(0.94); }
  .btn svg { width: 16px; height: 16px; }
  .btn.ok { background: var(--accent); color: #fff; }
  .form { display: flex; gap: 8px; }
  .form input { flex: 1; min-width: 0; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--field); font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s; }
  .form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .form input[aria-invalid="true"] { border-color: var(--bad); }
  .form .btn { height: 46px; padding: 0 18px; border-radius: 14px; background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 12px 20px -12px var(--accent2); }
  .form .btn[disabled] { opacity: 0.5; cursor: default; transform: none; }
  .err { min-height: 1em; margin: -6px 2px 0; font-size: 0.74rem; color: var(--bad); }
  .goal { display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .bar i { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
  .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--leaf1), var(--accent)); transform: scaleX(0); transform-origin: left; transition: transform 0.6s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .bar i.on::after { transform: scaleX(1); }
  .bar.full i::after { background: linear-gradient(90deg, var(--gold), #f08a2b); }
  .goal span { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .goal b { color: var(--ink); }
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 42px; padding: 5px 6px 5px 5px; border-radius: 13px; background: var(--field); font-size: 0.8rem; }
  .list li.new { animation: slide 0.55s cubic-bezier(0.3, 1.4, 0.5, 1); }
  @keyframes slide { from { opacity: 0; transform: translateY(-10px) scale(0.96); } }
  .av { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 10px; color: #fff; font-weight: 900; font-size: 0.72rem; }
  .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); white-space: nowrap; }
  .pill.opened { background: color-mix(in srgb, var(--gold) 22%, transparent); color: color-mix(in srgb, var(--gold) 55%, var(--ink)); }
  .pill.joined { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .nudge { height: 26px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; font-size: 0.7rem; font-weight: 800; cursor: pointer; }
  .nudge:hover { border-color: var(--accent); }
  .more { margin: 0; font-size: 0.72rem; color: var(--muted); text-align: center; }
  .reset { align-self: flex-start; height: 30px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 0.74rem; font-weight: 750; cursor: pointer; }
  .reset:hover { color: var(--ink); background: var(--field); }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .seed, .petal, .plus { position: absolute; left: 0; top: 0; }
  .seed { width: 22px; height: 16px; border-radius: 4px; background: var(--card); box-shadow: 0 0 0 1.5px var(--accent), 0 6px 12px -4px rgba(0, 0, 0, 0.35); }
  /* the flying invite is a tiny envelope: two diagonal strokes make the flap */
  .seed::after { content: ""; position: absolute; inset: 1px 2px auto; height: 9px; background: linear-gradient(to bottom left, transparent 46%, var(--accent) 47% 57%, transparent 58%) right / 50% 100% no-repeat, linear-gradient(to bottom right, transparent 46%, var(--accent) 47% 57%, transparent 58%) left / 50% 100% no-repeat; }
  .petal { width: 9px; height: 12px; border-radius: 80% 0 80% 0; }
  .plus { padding: 3px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 850; white-space: nowrap; }

  @media (max-width: 680px) {
    .card { grid-template-columns: 1fr; }
    .scene { min-height: 270px; }
    .panel { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .sway, .flut, .mote, .bud, .list li.new { animation: none !important; }
    .bar i::after, .btn { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <div class="scene" id="scene">
        <svg id="svg" viewBox="0 0 320 360" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Your referral tree. Each friend who joins grows a branch.">
          <defs>
            <linearGradient id="trunkG" x1="0" x2="1"><stop offset="0" stop-color="var(--trunk2)" /><stop offset=".5" stop-color="var(--trunk)" /><stop offset="1" stop-color="var(--trunk2)" /></linearGradient>
            <linearGradient id="potG" x1="0" x2="1"><stop offset="0" stop-color="var(--pot2)" /><stop offset=".45" stop-color="var(--pot)" /><stop offset="1" stop-color="var(--pot2)" /></linearGradient>
            <radialGradient id="fruitG" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffe3a6" /><stop offset=".5" stop-color="var(--fruit)" /><stop offset="1" stop-color="#d06d12" /></radialGradient>
            <symbol id="leaf" viewBox="-7 -24 14 25" overflow="visible"><path d="M0 0C-7-6-7-16 0-23 7-16 7-6 0 0Z" /><path d="M0-1V-20" stroke="rgba(0,0,0,.18)" stroke-width="1" /></symbol>
          </defs>
          <!-- floating pollen / fireflies -->
          <g fill="var(--glow)"><circle class="mote" cx="60" cy="140" r="2" /><circle class="mote" cx="250" cy="110" r="1.6" style="animation-delay:-2s" /><circle class="mote" cx="270" cy="220" r="2.2" style="animation-delay:-4s" /><circle class="mote" cx="44" cy="240" r="1.5" style="animation-delay:-5.5s" /></g>
          <ellipse cx="160" cy="352" rx="90" ry="7" fill="rgba(0,0,0,.12)" />
          <g class="sway" id="tree">
            <path d="M153 306C152 270 157 240 156 210 155 170 158 130 158.4 96L161.6 96C162 130 165 170 164 210 163 240 168 270 167 306Z" fill="url(#trunkG)" />
            <path d="M159 300C158 260 161 220 160 180" stroke="rgba(0,0,0,.14)" stroke-width="1.2" fill="none" />
            <g id="branches"></g>
            <g id="crown"></g>
            <g id="blooms"></g>
          </g>
          <!-- the pot and its name tag -->
          <path d="M108 300h104l-10 52H118Z" fill="url(#potG)" />
          <rect x="102" y="292" width="116" height="14" rx="4" fill="var(--pot)" />
          <rect x="102" y="292" width="116" height="4" rx="2" fill="#fff" opacity=".18" />
          <ellipse cx="160" cy="294" rx="54" ry="4" fill="var(--soil)" />
          <path id="ribbon" d="M112 318h96" stroke="var(--gold)" stroke-width="5" opacity="0" />
          <g transform="translate(204 268) rotate(8)"><path d="M0 0v34" stroke="var(--trunk2)" stroke-width="2" /><rect x="-4" y="-16" width="46" height="18" rx="3" fill="#f3e2c3" stroke="#c9a978" /><text id="tagText" x="19" y="-4" text-anchor="middle" font-size="8.5" font-weight="800" fill="#5b4126" font-family="system-ui,sans-serif">0 friends</text></g>
        </svg>
        <div class="reward" id="reward" aria-hidden="true"><span class="coin">PKR</span><span><b>PKR 500 credit unlocked</b><small>Five friends joined your circle</small></span></div>
      </div>

      <div class="panel">
        <header><h1 id="title">Grow your circle</h1><p>Every friend who joins grows a branch. <b>5 friends</b> unlock <b>PKR 500</b> credit.</p></header>
        <div>
          <span class="lbl">Your link</span>
          <div class="link"><span class="url" id="url">shop.example/r/<b>HINA-7Q4</b></span><button class="btn" id="copy" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2.5" /><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v9A2.5 2.5 0 0 0 6.5 17H8" /></svg><span>Copy</span></button></div>
        </div>
        <form class="form" id="form" novalidate>
          <label class="sr-only" for="email">Friend's email</label>
          <input id="email" type="email" inputmode="email" autocomplete="off" placeholder="friend@email.com" aria-describedby="err" />
          <button class="btn" id="invite" type="submit">Invite</button>
        </form>
        <p class="err" id="err" aria-live="polite"></p>
        <div class="goal"><div class="bar" id="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span id="goalText"></span></div>
        <ul class="list" id="list" aria-label="Invited friends"></ul>
        <p class="more" id="more" hidden></p>
        <button class="reset" id="reset" type="button">Start a new tree</button>
      </div>
    </section>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Sapling: each invite plants a bud; each friend who joins grows a full branch ----------
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = "cubic-bezier(.3, 1.7, .5, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { $("#status").textContent = t; };
  const svg = $("#svg"), fx = $("#fx");
  const GOAL = 5, PER = 100;
  function toScreen(x, y) { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; const p = pt.matrixTransform(svg.getScreenCTM()); return [p.x, p.y]; }
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };

  // ---------- Branch slots: 8 places on the trunk, alternating sides, lower ones longer ----------
  const SLOTS = [
    { y: 262, d: -1, len: 86 }, { y: 244, d: 1, len: 84 }, { y: 218, d: -1, len: 78 }, { y: 198, d: 1, len: 76 },
    { y: 174, d: -1, len: 66 }, { y: 154, d: 1, len: 62 }, { y: 132, d: -1, len: 50 }, { y: 116, d: 1, len: 46 }
  ];
  const branchesG = $("#branches");
  const branches = SLOTS.map((s, i) => {
    const bx = 160, by = s.y, tx = bx + s.d * s.len, ty = by - 30 - (8 - i) * 2;
    // the branch group turns around its base on the trunk (used by Nudge)
    const g = el("g", { class: "br", style: "transform-origin:" + bx + "px " + by + "px" }, branchesG);
    const d = "M" + bx + " " + by + "C" + (bx + s.d * 22) + " " + (by - 4) + " " + (bx + s.d * s.len * 0.65) + " " + (by - 16) + " " + tx + " " + ty;
    const limb = el("path", { d, fill: "none", stroke: "url(#trunkG)", "stroke-width": String(6 - i * 0.4), "stroke-linecap": "round" }, g);
    const L = limb.getTotalLength();
    limb.style.strokeDasharray = L + "px"; limb.style.strokeDashoffset = L + "px";
    // the bud that shows a pending invite, near the trunk (outer group places it, the circle animates)
    const b0 = limb.getPointAtLength(L * 0.16);
    const bud = el("g", { transform: "translate(" + b0.x.toFixed(1) + " " + b0.y.toFixed(1) + ")", opacity: "0" }, g);
    const budDot = el("circle", { r: "4.2", fill: "var(--leaf1)", class: "bud", style: "transform-origin:0 0" }, bud);
    // leaves along the limb, alternating sides: outer group places, middle group rustles, the leaf pops
    const leaves = [0.38, 0.55, 0.72, 0.88, 1].map((t, k) => {
      const p = limb.getPointAtLength(L * t), q = limb.getPointAtLength(Math.min(L, L * t + 1));
      const ang = (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI + 90;
      const side = k % 2 ? 1 : -1;
      const w = el("g", { transform: "translate(" + p.x.toFixed(1) + " " + p.y.toFixed(1) + ") rotate(" + (ang + side * 52 + (t === 1 ? -side * 40 : 0)).toFixed(0) + ")" }, g);
      const rustle = el("g", { style: "transform-origin:0 0" }, w);
      return el("use", { href: "#leaf", width: "14", height: "25", x: "-7", y: "-24", fill: k % 2 ? "var(--leaf1)" : "var(--leaf2)", style: "transform:scale(0);transform-origin:0 0" }, rustle);
    });
    // fruit hanging at the tip
    const tip = limb.getPointAtLength(L * 0.8);
    const fruit = el("g", { transform: "translate(" + tip.x.toFixed(1) + " " + (tip.y + 9).toFixed(1) + ")" }, g);
    const fr = el("g", { style: "transform:scale(0);transform-origin:0 -8px" }, fruit);
    el("path", { d: "M0-8v3", stroke: "var(--trunk2)", "stroke-width": "1.4" }, fr);
    el("circle", { r: "6.5", fill: "url(#fruitG)" }, fr);
    el("circle", { cx: "-2", cy: "-2", r: "1.6", fill: "#fff", opacity: ".6" }, fr);
    return { g, limb, L, bud, budDot, leaves, fr, tip: { x: tx, y: ty }, mid: limb.getPointAtLength(L * 0.55) };
  });

  // a small crown of leaves so the sapling always looks alive
  const crown = $("#crown");
  const CROWN = [[160, 96, 0], [160, 98, -38], [160, 98, 38], [160, 108, -70], [160, 108, 70]];
  const crownLeaves = CROWN.map(([x, y, r], i) => {
    const w = el("g", { transform: "translate(" + x + " " + y + ") rotate(" + r + ")" }, crown);
    const g2 = el("g", { class: "flut", style: "transform-origin:0 0;animation-delay:" + (-i * 0.5) + "s" }, w);
    return el("use", { href: "#leaf", width: "14", height: "25", x: "-7", y: "-24", fill: i % 2 ? "var(--leaf1)" : "var(--leaf2)", style: "transform:scale(0);transform-origin:0 0" }, g2);
  });

  // ---------- Growth helpers ----------
  function growLimb(b, to, dur) {
    const from = parseFloat(b.limb.style.strokeDashoffset);
    const target = b.L * (1 - to);
    b.limb.style.strokeDashoffset = target + "px";
    return play(b.limb, [{ strokeDashoffset: from + "px" }, { strokeDashoffset: target + "px" }], { duration: dur, easing: "cubic-bezier(.3,.9,.3,1)" });
  }
  function pop(node, delay, scale) {
    node.style.transform = "scale(" + (scale || 1) + ")";
    return play(node, [{ transform: "scale(0)" }, { transform: "scale(" + (scale || 1) + ")" }], { duration: 620, delay: delay || 0, easing: SPRING, fill: "backwards" });
  }
  function hide(node) { node.style.transform = "scale(0)"; }

  // ---------- Friends ----------
  const COLORS = ["#e0703a", "#5b7be0", "#c1508f", "#1f9a8a", "#8a63d2", "#d4a017", "#3f8f45", "#e05a5a"];
  const START = [{ email: "ayesha.k@mail.example", st: "joined" }, { email: "omar.farooq@mail.example", st: "joined" }];
  let friends = [], invitedCount = 0, rewarded = false, growing = 0;
  const list = $("#list");
  const joined = () => friends.filter((f) => f.st === "joined").length;

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function rowHtml(f) {
    const ini = esc(f.email[0].toUpperCase());
    const pill = f.st === "joined" ? '<span class="pill joined">Joined · +PKR ' + PER + "</span>" : f.st === "opened" ? '<span class="pill opened">Opened</span>' : f.st === "nudged" ? '<span class="pill opened">Nudged</span>' : '<span class="pill">Invite sent</span>';
    const nudge = f.st === "opened" && f.slow ? '<button class="nudge" type="button" data-i="' + f.i + '">Nudge</button>' : "";
    return '<span class="av" style="background:' + f.c + '">' + ini + '</span><span class="who">' + esc(f.email) + "</span>" + nudge + pill;
  }
  function renderList(newIx) {
    const shown = friends.slice().reverse().slice(0, 3);
    list.innerHTML = "";
    shown.forEach((f) => {
      const li = document.createElement("li");
      li.innerHTML = rowHtml(f);
      if (f.i === newIx) li.className = "new";
      list.appendChild(li);
    });
    const rest = friends.length - shown.length;
    $("#more").hidden = rest <= 0;
    $("#more").textContent = "+ " + rest + " more " + (rest === 1 ? "friend" : "friends") + " on your tree";
  }
  function renderGoal() {
    const j = joined();
    document.querySelectorAll("#bar i").forEach((b, i) => b.classList.toggle("on", i < j));
    $("#bar").classList.toggle("full", j >= GOAL);
    $("#goalText").innerHTML = j >= GOAL ? "<b>" + j + " friends joined</b> · PKR " + j * PER + " earned" : "<b>" + j + " of " + GOAL + "</b> friends joined · PKR " + (GOAL - j) * PER + " to go";
    $("#tagText").textContent = j + (j === 1 ? " friend" : " friends");
    const full = friends.length >= SLOTS.length;
    $("#email").disabled = full; $("#invite").disabled = full;
    if (full) $("#email").placeholder = "Your tree is full: share your link";
  }
  list.addEventListener("click", (e) => {
    const b = e.target.closest(".nudge");
    if (!b) return;
    nudge(friends[+b.dataset.i]);
  });

  // ---------- Invite: a seed packet flies to the tree, a bud appears, the friend opens and joins ----------
  const okEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  $("#form").addEventListener("submit", (e) => { e.preventDefault(); invite($("#email").value.trim()); });
  $("#email").addEventListener("input", () => { $("#email").removeAttribute("aria-invalid"); $("#err").textContent = ""; });
  async function invite(email, demo) {
    const input = $("#email"), err = $("#err");
    if (!okEmail(email)) { input.setAttribute("aria-invalid", "true"); err.textContent = "That email does not look right."; play(input, [{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 360 }); return; }
    if (friends.some((f) => f.email.toLowerCase() === email.toLowerCase())) { input.setAttribute("aria-invalid", "true"); err.textContent = "You already invited " + email + "."; return; }
    if (friends.length >= SLOTS.length) return;
    const i = friends.length;
    invitedCount++;
    const f = { i, email, st: "sent", c: COLORS[i % COLORS.length], slow: invitedCount % 3 === 0 };
    friends.push(f);
    input.value = "";
    renderList(i); renderGoal();
    say("Invite sent to " + email);
    const b = branches[i];
    await flySeed(input, i);
    if (!friends.includes(f)) return; // the tree was reset meanwhile
    // the bud swells on the trunk
    b.bud.setAttribute("opacity", "1");
    play(b.budDot, [{ transform: "scale(0)" }, { transform: "scale(1)" }], { duration: 520, easing: SPRING });
    growing++;
    await wait(calm() ? 300 : 1300 + Math.random() * 700);
    open(f);
    await wait(calm() ? 300 : 1500 + Math.random() * 800);
    growing--;
    if (!f.slow) join(f);
  }
  function flySeed(from, slot) {
    if (calm()) return Promise.resolve();
    const r = from.getBoundingClientRect();
    const s = document.createElement("i");
    s.className = "seed";
    fx.appendChild(s);
    const [tx, ty] = toScreen(160, SLOTS[slot].y);
    const sx = r.left + 16, sy = r.top + r.height / 2 - 8;
    const mx = (sx + tx) / 2, my = Math.min(sy, ty) - 90;
    return s.animate([
      { transform: "translate(" + sx + "px," + sy + "px) scale(.6) rotate(0)", opacity: 0 },
      { transform: "translate(" + sx + "px," + (sy - 14) + "px) scale(1.1) rotate(-10deg)", opacity: 1, offset: 0.15 },
      { transform: "translate(" + mx + "px," + my + "px) scale(1) rotate(-200deg)", opacity: 1, offset: 0.6 },
      { transform: "translate(" + (tx - 11) + "px," + (ty - 8) + "px) scale(.3) rotate(-360deg)", opacity: 0.7 }
    ], { duration: 900, easing: "cubic-bezier(.45,0,.35,1)" }).finished.catch(() => {}).then(() => s.remove());
  }
  function open(f) {
    if (!friends.includes(f) || f.st !== "sent") return;
    f.st = "opened";
    renderList(); renderGoal();
    growLimb(branches[f.i], 0.4, 900);
    pop(branches[f.i].leaves[0], 300);
    say(f.email + " opened your invite" + (f.slow ? ". Give them a nudge?" : ""));
  }
  async function nudge(f) {
    if (!f || f.st !== "opened") return;
    f.st = "nudged";
    renderList();
    say("Nudged " + f.email);
    // a gentle shake of that branch as the reminder goes out
    play(branches[f.i].g, [{ transform: "rotate(0)" }, { transform: "rotate(-3deg)" }, { transform: "rotate(2deg)" }, { transform: "rotate(0)" }], { duration: 600, easing: "ease-in-out" });
    await wait(calm() ? 200 : 1400);
    join(f);
  }
  async function join(f) {
    if (!friends.includes(f) || f.st === "joined") return;
    f.st = "joined";
    renderList(); renderGoal();
    const b = branches[f.i];
    b.bud.setAttribute("opacity", "0");
    say(f.email + " joined. +PKR " + PER + " credit.");
    // main: the branch shoots out to full length, leaves unfurl one after another, fruit drops in
    growLimb(b, 1, 1000);
    b.leaves.forEach((lf, k) => pop(lf, 260 + k * 110, 1 - k * 0.04));
    await wait(calm() ? 0 : 700);
    pop(b.fr, 0);
    play(b.fr, [{ transform: "translateY(-14px) scale(.4)" }, { transform: "translateY(2px) scale(1.15)", offset: 0.6 }, { transform: "translateY(0) scale(1)" }], { duration: 700, easing: "ease-out" });
    const [px, py] = toScreen(b.tip.x, b.tip.y);
    floatPlus(px, py, "+PKR " + PER);
    play($("#tree"), [{ transform: "rotate(0)" }, { transform: "rotate(" + (SLOTS[f.i].d * 1.6) + "deg)" }, { transform: "rotate(0)" }], { duration: 900, easing: "ease-in-out" });
    if (joined() >= GOAL && !rewarded) reward();
  }
  function floatPlus(x, y, text) {
    if (calm()) return;
    const p = document.createElement("span");
    p.className = "plus"; p.textContent = text;
    fx.appendChild(p);
    p.animate([{ transform: "translate(" + (x - 30) + "px," + y + "px) scale(.5)", opacity: 0 }, { transform: "translate(" + (x - 30) + "px," + (y - 20) + "px) scale(1.05)", opacity: 1, offset: 0.25 }, { transform: "translate(" + (x - 30) + "px," + (y - 54) + "px) scale(1)", opacity: 0 }], { duration: 1500, easing: "ease-out" }).onfinish = () => p.remove();
  }

  // ---------- Reward: the whole tree blossoms, a ribbon ties the pot, petals fall ----------
  const bloomsG = $("#blooms");
  function blossomAt(x, y, k) {
    const g = el("g", { transform: "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")" }, bloomsG);
    const inner = el("g", { style: "transform-origin:0 0" }, g);
    for (let a = 0; a < 5; a++) el("ellipse", { cx: "0", cy: "-4", rx: "2.8", ry: "4", fill: "var(--bloom)", transform: "rotate(" + a * 72 + ")" }, inner);
    el("circle", { r: "2", fill: "var(--gold)" }, inner);
    pop(inner, k * 70);
  }
  async function reward() {
    rewarded = true;
    const spots = [[160, 82], [146, 92], [174, 92]];
    branches.forEach((b) => { if (parseFloat(b.limb.style.strokeDashoffset) < 1) spots.push([b.tip.x, b.tip.y - 2], [b.mid.x, b.mid.y - 6]); });
    spots.sort((a, b) => b[1] - a[1]).forEach(([x, y], k) => blossomAt(x, y, k));
    $("#ribbon").setAttribute("opacity", "1");
    play($("#ribbon"), [{ strokeDasharray: "0 200" }, { strokeDasharray: "200 0" }], { duration: 700, easing: "ease-out" });
    const r = $("#reward");
    r.style.opacity = "1"; r.style.transform = "translate(-50%, 0)";
    play(r, [{ transform: "translate(-50%, -140%)", opacity: 0 }, { transform: "translate(-50%, 8%)", opacity: 1, offset: 0.65 }, { transform: "translate(-50%, 0)", opacity: 1 }], { duration: 700, easing: "ease-out" });
    play(r.querySelector(".coin"), [{ transform: "rotateY(0)" }, { transform: "rotateY(720deg)" }], { duration: 1100, easing: "cubic-bezier(.2,.8,.3,1)" });
    petals();
    say("Five friends joined. PKR 500 credit unlocked.");
  }
  function petals() {
    if (calm()) return;
    const sr = $("#scene").getBoundingClientRect();
    for (let i = 0; i < 26; i++) {
      const p = document.createElement("i");
      p.className = "petal";
      p.style.background = i % 3 ? "var(--bloom)" : "var(--gold)";
      fx.appendChild(p);
      const x = sr.left + Math.random() * sr.width, y = sr.top - 10, sw = (Math.random() - 0.5) * 80;
      p.animate([
        { transform: "translate(" + x + "px," + y + "px) rotate(0)", opacity: 0 },
        { transform: "translate(" + (x + sw) + "px," + (y + sr.height * 0.45) + "px) rotate(200deg)", opacity: 1, offset: 0.4 },
        { transform: "translate(" + (x - sw * 0.5) + "px," + (y + sr.height * 0.95) + "px) rotate(420deg)", opacity: 0 }
      ], { duration: 2600 + Math.random() * 1600, delay: Math.random() * 900, easing: "ease-in-out", fill: "backwards" }).onfinish = () => p.remove();
    }
  }

  // ---------- Copy the referral link: the leaves rustle ----------
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  $("#copy").addEventListener("click", (e) => copyLink(e.currentTarget, true));
  async function copyLink(btn, real) {
    const ok = real ? await writeClipboard("https://shop.example/r/HINA-7Q4") : true;
    const span = btn.querySelector("span");
    span.textContent = ok ? "Copied" : "Select it";
    btn.classList.toggle("ok", ok);
    crownLeaves.concat(...branches.map((b) => b.leaves)).forEach((lf, k) => play(lf.parentNode, [{ transform: "rotate(0)" }, { transform: "rotate(" + (k % 2 ? 9 : -9) + "deg)" }, { transform: "rotate(0)" }], { duration: 520, delay: k * 12 }));
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { span.textContent = "Copy"; btn.classList.remove("ok"); }, 1600);
    say(ok ? "Referral link copied" : "Copy was blocked, select the link instead");
  }

  // ---------- Start over: leaves turn amber and fall, branches pull back, two friends stay ----------
  let resetting = false;
  $("#reset").addEventListener("click", () => resetTree(true));
  async function resetTree(animated) {
    if (resetting) return;
    resetting = true;
    if (animated && !calm()) {
      branches.forEach((b, i) => {
        if (i < START.length) return;
        b.leaves.concat([b.fr]).forEach((lf, k) => {
          if (lf.style.transform === "scale(0)") return;
          lf.style.fill = "#d99a3a";
          play(lf, [{ transform: lf.style.transform, opacity: 1 }, { transform: "translate(" + ((Math.random() - 0.5) * 40) + "px," + (60 + Math.random() * 60) + "px) rotate(" + (Math.random() * 300) + "deg) scale(.8)", opacity: 0 }], { duration: 1100 + Math.random() * 500, delay: k * 60, easing: "cubic-bezier(.4,0,.8,.6)" });
        });
      });
      const r = $("#reward");
      if (r.style.opacity === "1") play(r, [{ transform: "translate(-50%, 0)", opacity: 1 }, { transform: "translate(-50%, -140%)", opacity: 0 }], { duration: 450, easing: "ease-in" });
      await wait(900);
      branches.forEach((b, i) => { if (i >= START.length) growLimb(b, 0, 700); });
      await wait(700);
    }
    branches.forEach((b, i) => {
      if (i >= START.length) { b.limb.style.strokeDashoffset = b.L + "px"; b.leaves.forEach(hide); hide(b.fr); }
      b.leaves.forEach((lf) => { lf.style.fill = ""; });
      b.fr.style.fill = "";
      b.bud.setAttribute("opacity", "0");
    });
    bloomsG.innerHTML = "";
    $("#ribbon").setAttribute("opacity", "0");
    const r = $("#reward"); r.style.opacity = "0"; r.style.transform = "translate(-50%, -140%)";
    friends = START.map((s, i) => ({ i, email: s.email, st: s.st, c: COLORS[i] }));
    invitedCount = 0; rewarded = false;
    renderList(); renderGoal();
    $("#email").placeholder = "friend@email.com";
    say("A fresh tree with your first two friends");
    resetting = false;
  }

  // ---------- Intro: the sapling grows its crown and its first two branches ----------
  async function intro() {
    crownLeaves.forEach((lf, i) => pop(lf, 150 + i * 90));
    START.forEach((s, i) => {
      const b = branches[i];
      growLimb(b, 1, 900);
      b.leaves.forEach((lf, k) => pop(lf, 400 + i * 200 + k * 90, 1 - k * 0.04));
      pop(b.fr, 900 + i * 200);
    });
    if (calm()) { START.forEach((s, i) => { branches[i].limb.style.strokeDashoffset = "0px"; }); }
  }

  // ---------- Auto-demo: invite friends one by one, nudge the slow one, bloom, start over ----------
  const DEMO = ["bilal.ahmed@mail.example", "sana.j@mail.example", "hamza.q@mail.example", "zoya.r@mail.example", "faisal@mail.example"];
  let demoOn = true, demoTimer = 0, dix = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demoOn || resetting) return;
    if (rewarded) { await wait(2600); if (!demoOn) return; await resetTree(true); dix = 0; queueDemo(1600); return; }
    // nudge anyone who is waiting
    const slow = friends.find((f) => f.st === "opened" && f.slow);
    if (slow && !growing) { nudge(slow); queueDemo(2600); return; }
    if (friends.length >= SLOTS.length) { queueDemo(2000); return; }
    const email = DEMO[dix++ % DEMO.length];
    const input = $("#email");
    for (let i = 1; i <= email.length; i++) { if (!demoOn) return; input.value = email.slice(0, i); await wait(calm() ? 0 : 22); }
    await wait(250);
    if (!demoOn) return;
    play($("#invite"), [{ transform: "scale(1)" }, { transform: "scale(.92)" }, { transform: "scale(1)" }], { duration: 260 });
    invite(email, true);
    queueDemo(2200);
  }

  // ---------- Start ----------
  resetTree(false);
  intro();
  queueDemo(1200);
</script>
</body>
</html>
