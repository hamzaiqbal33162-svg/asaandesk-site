<title>Tag Along · Follow button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #eceafd;
    --blob-a: #d9d3ff;
    --blob-b: #ffe1d2;
    --card: #ffffff;
    --ink: #1c1838;
    --muted: #6b6788;
    --line: rgba(40, 30, 110, 0.1);
    --indigo: #5b4bff;
    --indigo-deep: #3f2fe0;
    --mint: #16c79a;
    --peach: #ff9f7a;
    --soft: #f3f1ff;
    --warn: #e5484d;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0d22;
    --blob-a: #2a2066;
    --blob-b: #3a1f33;
    --card: #1a1734;
    --ink: #f1efff;
    --muted: #a39fc8;
    --line: rgba(200, 190, 255, 0.12);
    --indigo: #7d6fff;
    --indigo-deep: #5b4bff;
    --mint: #2ee0b0;
    --peach: #ffb08f;
    --soft: #241f47;
    --warn: #ff6b6f;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---------- Stage with two slow blobs ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; background: var(--bg); }
  .blob { position: absolute; width: 420px; height: 420px; border-radius: 50%; filter: blur(60px); opacity: 0.8; animation: float 14s ease-in-out infinite; }
  .blob.a { background: var(--blob-a); left: -120px; top: -140px; }
  .blob.b { background: var(--blob-b); right: -140px; bottom: -160px; animation-delay: -7s; }
  @keyframes float { 50% { transform: translate(40px, 30px) scale(1.08); } }

  /* ---------- Profile card ---------- */
  .card { position: relative; width: min(380px, 100%); border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 36px 70px -40px rgba(40, 20, 120, 0.55); }
  .cover { height: 92px; border-radius: 26px 26px 0 0; overflow: hidden; }
  .cover svg { display: block; width: 100%; height: 100%; }
  .stroke { animation: brush 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .stroke.s2 { animation-duration: 9s; animation-delay: -3s; }
  @keyframes brush { 50% { transform: translateX(12px) rotate(-3deg); } }
  .row { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 18px; margin-top: -40px; gap: 10px; }
  .face { position: relative; width: 86px; height: 86px; flex: none; }
  .face .ring { position: absolute; inset: -5px; width: 96px; height: 96px; transform: rotate(-90deg); overflow: visible; }
  .ring circle { fill: none; stroke: url(#rg); stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .face.on .ring { animation: turn 9s linear infinite; }
  @keyframes turn { to { transform: rotate(270deg); } }
  .portrait { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 4px solid var(--card); background: #ffd9c7; }
  .portrait svg { display: block; width: 100%; height: 100%; }
  .badge { position: absolute; right: -2px; bottom: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--mint); border: 3px solid var(--card); display: grid; place-items: center; transform: scale(0); }
  .badge svg { width: 13px; height: 13px; }
  .face.on .badge { transform: scale(1); }

  .actions { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; }
  .follow {
    position: relative;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 18px 0 14px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    color: #fff;
    font: inherit;
    font-weight: 750;
    font-size: 0.92rem;
    white-space: nowrap;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 10px 20px -10px var(--indigo);
    transition: transform 0.4s cubic-bezier(0.3, 1.7, 0.5, 1), background 0.3s, color 0.3s, box-shadow 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .follow:hover { transform: translateY(-2px); }
  .follow:focus-visible, .bell:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; }
  .follow .ico { width: 16px; height: 16px; flex: none; display: block; }
  .follow .ico svg { display: block; width: 100%; height: 100%; }
  .follow.is-following { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .follow.confirm { background: color-mix(in srgb, var(--warn) 14%, var(--card)); color: var(--warn); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--warn) 40%, transparent); }
  .follow .fuse { position: absolute; left: 12px; right: 12px; bottom: 6px; height: 2px; border-radius: 2px; background: currentColor; opacity: 0; transform-origin: left; }
  .follow .spin { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  .bell { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--soft); color: var(--ink); cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--line); -webkit-tap-highlight-color: transparent; }
  .bell[hidden] { display: none; }
  .bell svg { width: 19px; height: 19px; overflow: visible; }
  .bell .dot { fill: var(--peach); transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .bell[aria-pressed="true"] { color: var(--indigo); }
  .bell[aria-pressed="true"] .dot { transform: scale(1); }
  .bell .cup { transform-origin: 12px 3px; }

  .body { padding: 12px 20px 18px; }
  .body h1 { margin: 0; font-size: 1.18rem; letter-spacing: -0.01em; }
  .role { margin: 2px 0 0; font-size: 0.82rem; color: var(--indigo); font-weight: 650; }
  .bio { margin: 8px 0 14px; font-size: 0.86rem; color: var(--muted); line-height: 1.45; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats div { text-align: center; position: relative; }
  .stats dt { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
  .stats dd { margin: 2px 0 0; font-weight: 800; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  .odo { display: inline-flex; height: 1.2em; line-height: 1.2em; overflow: hidden; vertical-align: top; }
  .odo .d { display: inline-block; width: 0.62em; text-align: center; }
  .odo .strip { display: block; }
  .odo .strip b { display: block; height: 1.2em; font-weight: inherit; }
  .plus1 { position: absolute; left: 50%; top: -6px; font-size: 0.78rem; font-weight: 800; color: var(--mint); opacity: 0; pointer-events: none; }
  .friends { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .stack { display: flex; padding-left: 8px; }
  .mini { width: 28px; height: 28px; margin-left: -8px; border-radius: 50%; border: 2.5px solid var(--card); display: grid; place-items: center; font-size: 0.6rem; font-weight: 800; color: #fff; flex: none; }
  .mini.you { background: var(--mint); overflow: hidden; }
  .friends small { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
  .friends small b { color: var(--ink); }

  /* overlay for the flying plus, its trail and confetti */
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 4; }
  .fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .trail { fill: none; stroke: var(--indigo); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 7; }
  .flyer { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 3px solid var(--card); border-radius: 50%; background: var(--mint); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.4); opacity: 0; }
  .flyer svg { width: 16px; height: 16px; }
  .bit { position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 50%; }
  .bit.tri { border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 8px; height: 8px; }
  .bit.bar { border-radius: 2px; width: 10px; height: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.36; } }
  @media (prefers-reduced-motion: reduce) {
    .blob, .stroke, .face.on .ring { animation: none; }
    .follow, .bell .dot { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <span class="blob a" aria-hidden="true"></span><span class="blob b" aria-hidden="true"></span>
    <article class="card" id="card" aria-labelledby="name">
      <div class="cover" aria-hidden="true">
        <svg viewBox="0 0 380 92" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="cv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b6bff" /><stop offset="1" stop-color="#ff9f7a" /></linearGradient>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b4bff" /><stop offset="0.5" stop-color="#ff7aa8" /><stop offset="1" stop-color="#16c79a" /></linearGradient>
          </defs>
          <rect width="380" height="92" fill="url(#cv)" />
          <path class="stroke" d="M-10 64 C60 30 120 80 190 50 S310 20 400 46" stroke="#fff" stroke-opacity="0.35" stroke-width="16" fill="none" stroke-linecap="round" />
          <path class="stroke s2" d="M20 20 C90 40 150 6 230 22 S330 60 390 30" stroke="#ffd36e" stroke-opacity="0.45" stroke-width="7" fill="none" stroke-linecap="round" />
          <circle cx="330" cy="26" r="9" fill="#fff" opacity="0.5" /><circle cx="60" cy="30" r="5" fill="#fff" opacity="0.45" />
        </svg>
      </div>
      <div class="row">
        <div class="face" id="face">
          <svg class="ring" viewBox="0 0 96 96" aria-hidden="true"><circle id="ring" cx="48" cy="48" r="46" pathLength="100" /></svg>
          <div class="portrait">
            <!-- Drawn portrait (not a photo) -->
            <svg viewBox="0 0 80 80" role="img" aria-label="Drawn portrait of Hira Baig">
              <rect width="80" height="80" fill="#ffd9c7" />
              <path d="M14 80 C16 60 28 54 40 54 C52 54 64 60 66 80 Z" fill="#5b4bff" />
              <path d="M22 80 C26 64 34 60 40 60 C46 60 54 64 58 80" fill="#ff9f7a" opacity="0.7" />
              <path d="M18 44 C14 20 26 10 40 10 C56 10 66 22 62 46 C60 56 58 62 54 64 L26 64 C22 60 19 54 18 44 Z" fill="#2b1d2e" />
              <ellipse cx="40" cy="38" rx="15" ry="18" fill="#e8a888" />
              <path d="M25 32 C28 20 50 18 56 30 C48 26 36 26 25 32 Z" fill="#2b1d2e" />
              <circle cx="34" cy="38" r="1.8" fill="#2b1d2e" /><circle cx="46" cy="38" r="1.8" fill="#2b1d2e" />
              <path d="M35 46 Q40 50 45 46" stroke="#a5523e" stroke-width="1.8" fill="none" stroke-linecap="round" />
              <circle cx="31" cy="43" r="2.6" fill="#ff8f8f" opacity="0.45" /><circle cx="49" cy="43" r="2.6" fill="#ff8f8f" opacity="0.45" />
              <circle cx="25" cy="44" r="1.6" fill="#ffd36e" />
            </svg>
          </div>
          <span class="badge" id="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
        </div>
        <div class="actions">
          <button class="bell" id="bell" type="button" aria-pressed="false" aria-label="Notify me about new posts" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><g class="cup" id="cup"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /><path d="M10 21.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></g><circle class="dot" cx="18.5" cy="5.5" r="3.4" /></svg>
          </button>
          <button class="follow" id="follow" type="button" aria-pressed="false">
            <span class="ico" id="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path id="glyph" d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
            <span class="txt" id="txt">Follow</span>
            <svg class="spin" id="spin" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="3" /><path d="M13 3 a10 10 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
            <span class="fuse" id="fuse" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="body">
        <h1 id="name">Hira Baig</h1>
        <p class="role">Illustrator · Lahore</p>
        <p class="bio">Painting chai stalls, rickshaws and rainy streets, one small scene a day.</p>
        <dl class="stats">
          <div id="fbox"><dt>Followers</dt><dd><span class="odo" id="odo" aria-hidden="true"></span><span class="sr" id="followers-sr"></span></dd><span class="plus1" id="plus1" aria-hidden="true">+1</span></div>
          <div><dt>Following</dt><dd>318</dd></div>
          <div><dt>Posts</dt><dd>96</dd></div>
        </dl>
        <div class="friends">
          <span class="stack" id="stack" aria-hidden="true">
            <span class="mini" style="background:#ff7aa8">AK</span><span class="mini" style="background:#f5a524">SN</span><span class="mini" style="background:#3fa7ff">MR</span>
          </span>
          <small id="friends">Followed by <b>Ali</b>, <b>Sana</b> and 12 others</small>
        </div>
      </div>
      <div class="fx" id="fx" aria-hidden="true">
        <svg><defs><mask id="reveal" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><path id="trail-mask" d="" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" /></mask></defs><path class="trail" id="trail" d="" mask="url(#reveal)" opacity="0" /></svg>
        <span class="flyer" id="flyer"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" /></svg></span>
      </div>
    </article>
    <p class="sr" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // Tag Along: a follow button whose plus sign hops across to the profile picture.
  // Follow = squash, the plus spins loose (anticipation) → it flies along a dotted arc to the avatar while the
  // button folds into a spinner (main + progress) → it lands as a check badge, the story ring draws, your face
  // joins the "followed by" stack, the count rolls and confetti pops (finish) → the button opens as "Following".
  // Unfollow asks once more ("Unfollow?") with a burning fuse before it undoes everything.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var card = $("card"), follow = $("follow"), txt = $("txt"), ico = $("ico"), glyph = $("glyph"), spin = $("spin"), fuse = $("fuse");
    var face = $("face"), ring = $("ring"), badge = $("badge"), bell = $("bell"), cup = $("cup");
    var fx = $("fx"), trail = $("trail"), flyer = $("flyer"), stack = $("stack"), friends = $("friends"), odo = $("odo"), plus1 = $("plus1"), status = $("status");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var PLUS = "M12 5v14M5 12h14", CHECK = "M5 12.5l4.5 4.5L19 7.5";
    var followers = 12480, state = "idle", run = 0, confirmTimer = 0;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function springFrames(frame, stiff, damp) {
      var x = 0, v = 0, out = [];
      for (var n = 0; n < 60; n++) { out.push(frame(x)); v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; }
      out.push(frame(1));
      return out;
    }
    function at(el) { var a = el.getBoundingClientRect(), c = card.getBoundingClientRect(), k = c.width / card.offsetWidth || 1; return { x: (a.left - c.left + a.width / 2) / k, y: (a.top - c.top + a.height / 2) / k }; }

    // ---------- Odometer for the follower count ----------
    function buildOdo(n) {
      odo.innerHTML = "";
      n.toLocaleString("en-US").split("").forEach(function (ch) {
        var d = document.createElement("span");
        d.className = "d";
        if (/\d/.test(ch)) {
          var s = document.createElement("span");
          s.className = "strip";
          for (var k = 0; k < 20; k++) { var b = document.createElement("b"); b.textContent = k % 10; s.appendChild(b); }
          s.style.transform = "translateY(" + -ch * 5 + "%)";
          s.dataset.v = ch;
          d.appendChild(s);
        } else d.textContent = ch;
        odo.appendChild(d);
      });
      $("followers-sr").textContent = n.toLocaleString("en-US");
    }
    function rollOdo(n, up) {
      var digits = n.toLocaleString("en-US").split("");
      var strips = odo.querySelectorAll(".strip");
      if (strips.length !== digits.filter(function (c) { return /\d/.test(c); }).length) { buildOdo(n); return; }
      var si = 0;
      digits.forEach(function (ch) {
        if (!/\d/.test(ch)) return;
        var s = strips[si++], from = +s.dataset.v, to = +ch;
        if (from === to) return;
        s.dataset.v = ch;
        s.getAnimations().forEach(function (a) { a.cancel(); });
        s.style.transform = "translateY(" + -to * 5 + "%)";
        if (calm.matches) return;
        // spin through a full turn so even a +1 feels like a roll
        var a = up ? from : from + 10, b = up ? to + 10 : to;
        s.animate(springFrames(function (p) { return { transform: "translateY(" + (-(a + (b - a) * p) * 5).toFixed(2) + "%)" }; }, 120, 13), { duration: 1000, easing: "linear" });
      });
      $("followers-sr").textContent = n.toLocaleString("en-US");
    }

    // ---------- Confetti from the badge ----------
    function confetti(o) {
      var colors = [getComputedStyle(card).getPropertyValue("--indigo"), getComputedStyle(card).getPropertyValue("--mint"), getComputedStyle(card).getPropertyValue("--peach"), "#ffd36e"];
      var kinds = ["", "tri", "bar"];
      for (var i = 0; i < 18; i++) {
        var b = document.createElement("i");
        b.className = "bit " + kinds[i % 3];
        b.style.background = colors[i % colors.length].trim();
        fx.appendChild(b);
        var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp = 50 + Math.random() * 60;
        var x = o.x, y = o.y, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp, rot = Math.random() * 360, frames = [];
        for (var k = 0; k <= 16; k++) {
          frames.push({ transform: "translate(" + (x - 4).toFixed(1) + "px," + (y - 4).toFixed(1) + "px) rotate(" + (rot + k * 30).toFixed(0) + "deg)", opacity: k > 11 ? (16 - k) / 5 : 1 });
          x += vx / 16; y += vy / 16; vy += 9; vx *= 0.93;
        }
        b.animate(frames, { duration: 900 + Math.random() * 300, easing: "linear", fill: "forwards" }).finished.then((function (e) { return function () { e.remove(); }; })(b)).catch(function () {});
      }
    }

    // ---------- Button helpers ----------
    function setLabel(text, path) {
      txt.textContent = text;
      if (path) glyph.setAttribute("d", path);
    }
    function morphWidth(fn, from) {
      // measure the width before and after a content change, then spring between them
      var w0 = from || follow.offsetWidth;
      follow.getAnimations().forEach(function (a) { if (a.effect && a.effect.getKeyframes && /width/.test(JSON.stringify(a.effect.getKeyframes()))) a.cancel(); });
      fn();
      follow.style.width = "";
      var w1 = follow.offsetWidth;
      if (calm.matches || w0 === w1) return;
      follow.animate(springFrames(function (p) { return { width: (w0 + (w1 - w0) * p).toFixed(1) + "px" }; }, 220, 16), { duration: 1000, easing: "linear" });
    }

    // ---------- Follow ----------
    async function doFollow() {
      var id = ++run;
      state = "busy";
      follow.setAttribute("aria-pressed", "true");
      follow.setAttribute("aria-busy", "true");
      status.textContent = "Following Hira Baig.";
      followers++;
      if (calm.matches) { finishFollow(); return; }
      var start = at(ico), land = at(badge);
      // 1. Anticipation: squash, the plus spins loose
      follow.animate([{ transform: "scale(1)" }, { transform: "scale(0.93, 0.88)" }, { transform: "scale(1)" }], { duration: 240, easing: "ease-out" });
      await ico.animate([{ transform: "rotate(0) scale(1)" }, { transform: "rotate(-90deg) scale(1.3)" }], { duration: 180, easing: "ease-in", fill: "forwards" }).finished.catch(function () {});
      if (id !== run) return;
      // 2. The button folds into a round spinner; the plus flies along a dotted arc to the avatar
      var w0 = follow.offsetWidth;
      follow.style.width = w0 + "px";
      follow.animate([{ width: w0 + "px" }, { width: "42px" }], { duration: 300, easing: "cubic-bezier(0.5, 0, 0.3, 1.2)", fill: "forwards" });
      txt.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: "forwards" });
      ico.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 80, fill: "forwards" });
      spin.animate([{ opacity: 0, transform: "rotate(0)" }, { opacity: 1, transform: "rotate(360deg)", offset: 0.25 }, { opacity: 1, transform: "rotate(1080deg)" }], { duration: 900, delay: 160, easing: "linear", fill: "both" });
      var c = { x: (start.x + land.x) / 2, y: Math.min(start.y, land.y) - 90 };
      var arcD = "M" + start.x.toFixed(1) + " " + start.y.toFixed(1) + " Q" + c.x.toFixed(1) + " " + c.y.toFixed(1) + " " + land.x.toFixed(1) + " " + land.y.toFixed(1);
      var tm = $("trail-mask");
      trail.setAttribute("d", arcD); tm.setAttribute("d", arcD);
      var len = Math.ceil(trail.getTotalLength ? trail.getTotalLength() : 320) + 4;
      tm.setAttribute("stroke-dasharray", len + " " + len);
      // the dotted trail is revealed behind the flyer by a mask that draws itself, then fades
      tm.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 760, easing: "cubic-bezier(0.45, 0, 0.35, 1)", fill: "forwards" });
      trail.animate([{ opacity: 1 }, { opacity: 1, offset: 0.6 }, { opacity: 0 }], { duration: 1300, easing: "ease-out" });
      var frames = [];
      for (var k = 0; k <= 20; k++) {
        var t = k / 20, u = 1 - t;
        var x = u * u * start.x + 2 * u * t * c.x + t * t * land.x, y = u * u * start.y + 2 * u * t * c.y + t * t * land.y;
        frames.push({ transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (t * 540).toFixed(0) + "deg) scale(" + (0.7 + Math.sin(t * Math.PI) * 0.6).toFixed(2) + ")", opacity: 1 });
      }
      flyer.style.opacity = "1";
      await flyer.animate(frames, { duration: 760, easing: "cubic-bezier(0.45, 0, 0.35, 1)", fill: "forwards" }).finished.catch(function () {});
      if (id !== run) return;
      // 3. Landing: the plus becomes the check badge, the ring draws, your face joins the stack
      flyer.getAnimations().forEach(function (a) { a.cancel(); });
      flyer.style.opacity = "0";
      face.classList.add("on");
      badge.animate(springFrames(function (p) { return { transform: "scale(" + p.toFixed(3) + ") rotate(" + ((1 - p) * -120).toFixed(1) + "deg)" }; }, 260, 11), { duration: 1000, easing: "linear" });
      ring.animate([{ strokeDashoffset: 100 }, { strokeDashoffset: 0 }], { duration: 700, easing: "cubic-bezier(0.3, 0.7, 0.3, 1)", fill: "forwards" });
      face.animate([{ transform: "scale(1)" }, { transform: "scale(1.06)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
      confetti(land);
      joinStack();
      rollOdo(followers, true);
      plus1.animate([{ opacity: 0, transform: "translate(-50%, 6px)" }, { opacity: 1, transform: "translate(-50%, -6px)", offset: 0.3 }, { opacity: 0, transform: "translate(-50%, -16px)" }], { duration: 1000, easing: "ease-out" });
      await wait(260);
      if (id !== run) return;
      finishFollow(true);
    }
    function finishFollow(animated) {
      spin.getAnimations().forEach(function (a) { a.cancel(); });
      var wNow = follow.offsetWidth; // still the folded circle at this point
      [txt, ico, follow].forEach(function (el) { el.getAnimations().forEach(function (a) { a.cancel(); }); });
      face.classList.add("on");
      ring.style.strokeDashoffset = "0";
      if (!animated) { rollOdo(followers, true); joinStack(); }
      morphWidth(function () { setLabel("Following", CHECK); }, wNow);
      follow.removeAttribute("aria-busy");
      if (animated) {
        txt.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: 120, easing: "ease-out", fill: "backwards" });
        ico.animate(springFrames(function (p) { return { transform: "scale(" + p.toFixed(3) + ")" }; }, 300, 12), { duration: 1000, easing: "linear" });
      }
      follow.classList.add("is-following");
      bell.hidden = false;
      if (animated) bell.animate(springFrames(function (p) { return { transform: "scale(" + p.toFixed(3) + ") rotate(" + ((1 - p) * 40).toFixed(1) + "deg)", opacity: Math.min(1, p * 2) }; }, 220, 12), { duration: 1000, easing: "linear" });
      state = "following";
    }
    function joinStack() {
      if (stack.querySelector(".you")) return;
      var me = document.createElement("span");
      me.className = "mini you";
      me.textContent = "You";
      stack.insertBefore(me, stack.firstChild);
      friends.innerHTML = "Followed by <b>you</b>, <b>Ali</b>, <b>Sana</b> and 12 others";
      if (calm.matches) return;
      me.animate(springFrames(function (p) { return { width: (28 * Math.min(1, p)).toFixed(1) + "px", transform: "scale(" + p.toFixed(3) + ")" }; }, 200, 12), { duration: 1000, easing: "linear" });
    }

    // ---------- Unfollow (with one confirm) ----------
    function askUnfollow() {
      state = "confirm";
      follow.classList.add("confirm");
      morphWidth(function () { setLabel("Unfollow?", "M6 6l12 12M18 6L6 18"); });
      status.textContent = "Press again to unfollow.";
      fuse.style.opacity = "0.6";
      if (!calm.matches) follow.animate([{ transform: "translateX(0)" }, { transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "translateX(-2px)" }, { transform: "translateX(0)" }], { duration: 320 });
      fuse.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 2600, easing: "linear", fill: "forwards" });
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(function () { if (state === "confirm") backToFollowing(); }, 2600);
    }
    function backToFollowing() {
      state = "following";
      follow.classList.remove("confirm");
      fuse.style.opacity = "0";
      fuse.getAnimations().forEach(function (a) { a.cancel(); });
      morphWidth(function () { setLabel("Following", CHECK); });
      status.textContent = "Still following.";
    }
    async function doUnfollow() {
      var id = ++run;
      clearTimeout(confirmTimer);
      follow.classList.remove("confirm");
      fuse.style.opacity = "0";
      fuse.getAnimations().forEach(function (a) { a.cancel(); });
      followers--;
      follow.setAttribute("aria-pressed", "false");
      follow.classList.remove("is-following");
      status.textContent = "Unfollowed Hira Baig.";
      bell.setAttribute("aria-pressed", "false");
      state = "idle";
      morphWidth(function () { setLabel("Follow", PLUS); });
      rollOdo(followers, false);
      var me = stack.querySelector(".you");
      friends.innerHTML = "Followed by <b>Ali</b>, <b>Sana</b> and 12 others";
      if (calm.matches) { if (me) me.remove(); face.classList.remove("on"); ring.style.strokeDashoffset = ""; bell.hidden = true; return; }
      ring.getAnimations().forEach(function (a) { a.cancel(); });
      ring.style.strokeDashoffset = "";
      ring.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: 100 }], { duration: 420, easing: "ease-in" });
      badge.animate([{ transform: "scale(1)" }, { transform: "scale(1.2)", offset: 0.3 }, { transform: "scale(0) rotate(90deg)" }], { duration: 360, easing: "ease-in" });
      face.classList.remove("on");
      bell.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(0.4)", opacity: 0 }], { duration: 220, easing: "ease-in" }).finished.then(function () { if (id === run) bell.hidden = true; }).catch(function () {});
      if (me) me.animate([{ width: "28px", transform: "scale(1)", opacity: 1 }, { width: "0px", transform: "scale(0.3)", opacity: 0 }], { duration: 300, easing: "ease-in" }).finished.then(function () { me.remove(); }).catch(function () { me.remove(); });
    }

    follow.addEventListener("click", function () {
      if (state === "idle") doFollow();
      else if (state === "following") askUnfollow();
      else if (state === "confirm") doUnfollow();
    });

    // ---------- Bell: get notified about new posts ----------
    bell.addEventListener("click", function () {
      var onNow = bell.getAttribute("aria-pressed") !== "true";
      bell.setAttribute("aria-pressed", String(onNow));
      status.textContent = onNow ? "You'll be told about new posts." : "Post alerts off.";
      if (calm.matches) return;
      cup.animate([{ transform: "rotate(0)" }, { transform: "rotate(22deg)" }, { transform: "rotate(-18deg)" }, { transform: "rotate(12deg)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(0)" }], { duration: onNow ? 700 : 300, easing: "ease-out" });
    });

    buildOdo(followers);

    // ---------- Auto demo: follow, turn on alerts, unfollow (with the confirm), repeat ----------
    var demoOn = !calm.matches, timers = [];
    function later(fn, ms) { timers.push(setTimeout(function () { if (demoOn) fn(); }, ms)); }
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; timers.forEach(clearTimeout); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function demo() {
      if (state === "idle") doFollow();
      later(function () { if (state === "following") bell.click(); }, 2700);
      later(function () { if (state === "following") askUnfollow(); }, 4700);
      later(function () { if (state === "confirm") doUnfollow(); }, 5700);
      later(demo, 7600);
    }
    if (demoOn) later(demo, 380);
  })();
</script>
