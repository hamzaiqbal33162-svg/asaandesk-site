<html lang="en">

<title>Cobble Bag · street shoes in a paper bag</title>
<script>

<style>
  /* ---------- Animatable shoe colours (smooth recolour) ---------- */
  @property --su { syntax: "<color>"; inherits: true; initial-value: #c6f432; }
  @property --ss { syntax: "<color>"; inherits: true; initial-value: #1d1d1d; }
  @property --sa { syntax: "<color>"; inherits: true; initial-value: #151515; }

  /* ---------- Colour tokens ---------- */
  :root {
    --page: #f7f5f0;
    --paper: #fffdf7;
    --card: #ffffff;
    --ink: #151515;
    --muted: #5f584c;
    --line: rgba(21, 21, 21, 0.13);
    --kraft: #c89f6b;
    --kraft-lt: #e8d5b5;
    --kraft-dk: #9a7140;
    --lime: #c6f432;
    --lime-ink: #151515;
    --tomato: #ff5a36;
    --sticker: #151515;
    --sticker-ink: #f7f5f0;
    --field: #ffffff;
    --shadow: 0 1px 0 rgba(21, 21, 21, 0.06), 0 12px 30px -14px rgba(60, 40, 10, 0.35);
    --focus: #ff5a36;
    --speck: rgba(120, 90, 50, 0.07);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --out: cubic-bezier(.22, 1, .36, 1);
    --heavy: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #161618; --paper: #232226; --card: #1f1e22; --ink: #f3f0e8; --muted: #aaa396;
      --line: rgba(243, 240, 232, 0.13); --kraft-lt: #4a3b29; --kraft-dk: #8a6338; --sticker: #c6f432; --sticker-ink: #151515;
      --field: #29282d; --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 16px 34px -16px rgba(0, 0, 0, 0.8); --focus: #c6f432; --speck: rgba(255, 220, 160, 0.035);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #161618; --paper: #232226; --card: #1f1e22; --ink: #f3f0e8; --muted: #aaa396;
    --line: rgba(243, 240, 232, 0.13); --kraft-lt: #4a3b29; --kraft-dk: #8a6338; --sticker: #c6f432; --sticker-ink: #151515;
    --field: #29282d; --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 16px 34px -16px rgba(0, 0, 0, 0.8); --focus: #c6f432; --speck: rgba(255, 220, 160, 0.035);
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; overflow-x: clip; }
  body {
    margin: 0;
    color: var(--ink);
    font: 16px/1.5 var(--heavy);
    background-color: var(--page);
    /* paper specks */
    background-image:
      radial-gradient(var(--speck) 1px, transparent 1.4px),
      radial-gradient(var(--speck) 1px, transparent 1.4px);
    background-size: 23px 23px, 37px 37px;
    background-position: 0 0, 11px 17px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--heavy); font-weight: 900; letter-spacing: -0.02em; line-height: 1.02; margin: 0; }
  p { margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  .sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .skip { position: fixed; left: 12px; top: -60px; z-index: 90; background: var(--ink); color: var(--page); border: 0; padding: 10px 14px; border-radius: 10px; font-weight: 800; transition: top .25s var(--out); }
  .skip:focus { top: 10px; }

  /* ---------- Buttons ---------- */
  .btn {
    --bg: var(--ink); --fg: var(--page);
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    min-height: 48px; padding: 0 22px; border: 2.5px solid var(--ink); border-radius: 14px;
    background: var(--bg); color: var(--fg); font-weight: 850; text-decoration: none; letter-spacing: .01em;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .25s var(--spring), box-shadow .25s var(--spring), background .2s;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px) scale(.98); box-shadow: 1px 1px 0 var(--ink); transition-duration: .08s; }
  .btn.lime { --bg: var(--lime); --fg: var(--lime-ink); }
  .btn.ghost { --bg: transparent; --fg: var(--ink); }
  .btn.tomato { --bg: var(--tomato); --fg: #151515; }
  .btn[disabled] { opacity: .65; cursor: progress; }
  .btn .ico { width: 20px; height: 20px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px;
    border: 2px solid var(--line); border-radius: 999px; background: var(--card); font-weight: 700; font-size: .9rem;
    transition: transform .2s var(--spring), background .2s, border-color .2s, color .2s;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .chip:active { transform: scale(.94); }
  .sticker {
    display: inline-block; padding: 5px 11px; border-radius: 8px; background: var(--sticker); color: var(--sticker-ink);
    font: 900 .74rem/1.2 var(--heavy); letter-spacing: .12em; text-transform: uppercase; transform: rotate(-3deg);
    box-shadow: 2px 2px 0 rgba(0,0,0,.18);
  }
  .sticker.lime { background: var(--lime); color: #151515; transform: rotate(2deg); }
  .sticker.tomato { background: var(--tomato); color: #151515; transform: rotate(-2deg); }

  /* ---------- Header + nav ---------- */
  .top {
    position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px clamp(12px, 3vw, 28px); background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 2px solid var(--ink);
  }
  .logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 950; font-size: 1.3rem; letter-spacing: -.03em; }
  .logo svg { width: 34px; height: 34px; transition: transform .5s var(--spring); }
  .logo:hover svg { transform: rotate(-14deg) scale(1.1); }
  .logo span { font: 800 .7rem/1 var(--mono); background: var(--kraft); color: #151515; padding: 4px 6px; border-radius: 5px; transform: rotate(-6deg); display: inline-block; }
  .nav { position: relative; display: flex; gap: 2px; margin-left: auto; padding: 4px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); }
  .nav a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: .92rem; text-decoration: none; transition: color .25s; }
  .nav a[aria-current="page"] { color: #151515; }
  .nav-mark { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--lime); border: 2px solid #151515; transition: transform .55s var(--spring), width .55s var(--spring), opacity .3s; opacity: 0; }
  .badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--tomato); color: #151515; font: 900 .75rem/1 var(--mono); }
  .badge.bump { animation: bump .6s var(--spring); }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.55) rotate(-10deg); } 60% { transform: scale(.85) rotate(6deg); } 100% { transform: scale(1); } }
  .theme-btn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); display: grid; place-items: center; transition: transform .4s var(--spring); }
  .theme-btn:hover { transform: rotate(25deg) scale(1.06); }
  .theme-btn svg { width: 20px; height: 20px; }
  @media (max-width: 560px) {
    .top { padding: 8px 12px; }
    .nav { order: 3; width: 100%; justify-content: space-between; margin-left: 0; }
    .nav a { padding: 7px 10px; font-size: .86rem; }
    .theme-btn { margin-left: auto; }
  }

  /* ---------- Layout: page + docked paper bag ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 24px; padding: 0 clamp(12px, 3vw, 28px); max-width: 1440px; margin: 0 auto; }
  .view { position: relative; min-width: 0; padding: 18px 0 140px; outline: none; }
  .dock { position: fixed; right: 12px; bottom: 12px; z-index: 45; width: 96px; }
  .dock-sum { display: none; }
  @media (min-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr) 220px; }
    .view { padding-bottom: 60px; }
    .dock { position: sticky; top: 92px; right: auto; bottom: auto; width: auto; align-self: start; padding-top: 26px; }
    .dock-sum { display: block; text-align: center; margin-top: 4px; font-weight: 800; }
    .dock-sum small { display: block; color: var(--muted); font-weight: 600; font-size: .8rem; }
  }

  /* ---------- The paper bag (SVG) ---------- */
  .bagbtn { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 18px; transition: transform .4s var(--spring); }
  .bagbtn:hover { transform: translateY(-4px) rotate(-2deg); }
  .bagbtn:active { transform: scale(.95); }
  .bag-svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 10px 12px rgba(80, 50, 15, .28)); }
  .bag-body { transform-box: view-box; transform-origin: 100px 228px; }
  .bag-body.drop { animation: bagDrop .75s var(--out); }
  @keyframes bagDrop {
    0% { transform: none; } 18% { transform: scale(1.1, .84); } 42% { transform: scale(.94, 1.08) translateY(-8px); }
    64% { transform: scale(1.03, .97); } 82% { transform: scale(.99, 1.01) translateY(-2px); } 100% { transform: none; }
  }
  .bag-flap { transform-box: fill-box; transform-origin: 50% 0%; transition: transform .38s var(--spring); }
  .bag-svg.open .bag-flap { transform: scaleY(-.85) skewX(-3deg); }
  .bag-mouth { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .35s var(--spring); }
  .bag-svg.open .bag-mouth { transform: scale(1.06, 1.6); }
  .bag-handles { transform-box: view-box; transform-origin: 100px 80px; }
  .bag-svg.open .bag-handles { transform: scaleX(1.12); transition: transform .3s var(--spring); }
  .bag-handles { transition: transform .4s var(--spring); }
  .bag-tag { transform-box: view-box; transform-origin: 131px 84px; animation: tagIdle 4s ease-in-out infinite; }
  .bag-tag.swing { animation: tagSwing 1.1s var(--out); }
  @keyframes tagIdle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
  @keyframes tagSwing { 0% { transform: rotate(0); } 20% { transform: rotate(-28deg); } 45% { transform: rotate(18deg); } 65% { transform: rotate(-9deg); } 85% { transform: rotate(4deg); } 100% { transform: rotate(-3deg); } }
  .tag-n { transform-box: fill-box; transform-origin: 50% 50%; }
  .tag-n.flip { animation: flipNum .5s var(--spring); }
  @keyframes flipNum { 0% { transform: scaleY(1); } 45% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
  .peek > g { transform-box: fill-box; transform-origin: 50% 100%; }
  .peek .newpeek { animation: peekIn .7s var(--spring); }
  @keyframes peekIn { from { transform: translateY(40px); } }
  .burst { position: absolute; left: 50%; top: 30%; width: 0; height: 0; pointer-events: none; }
  .burst i { --a: 0deg; position: absolute; left: -2px; top: -7px; width: 4px; height: 14px; border-radius: 4px; background: var(--ink); opacity: 0; transform: rotate(var(--a)) translateY(-40px); }
  .burst i:nth-child(2) { --a: 45deg; } .burst i:nth-child(3) { --a: 90deg; } .burst i:nth-child(4) { --a: 135deg; }
  .burst i:nth-child(5) { --a: 180deg; } .burst i:nth-child(6) { --a: 225deg; } .burst i:nth-child(7) { --a: 270deg; } .burst i:nth-child(8) { --a: 315deg; }
  .burst.go i { animation: crinkle .6s var(--out) forwards; }
  @keyframes crinkle {
    0% { opacity: 0; transform: rotate(var(--a)) translateY(-30px) scaleY(.3); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-66px) scaleY(1); }
  }
  .dock.away .bagbtn { animation: dockAway .5s var(--out) forwards; }
  @keyframes dockAway { to { transform: translateY(30px) scale(.4); opacity: 0; } }
  .dock.popback .bagbtn { animation: dockPop .8s var(--spring); }
  @keyframes dockPop { 0% { transform: translateY(40px) scale(.2) rotate(-30deg); opacity: 0; } 60% { transform: translateY(-8px) scale(1.12) rotate(6deg); opacity: 1; } 100% { transform: none; } }
  .bagbtn.unfold { animation: unfold .45s var(--out) forwards; }
  @keyframes unfold { 40% { transform: scale(1.15, .9) rotate(-4deg); } 100% { transform: scale(1.5) rotate(8deg); opacity: 0; } }
  .bagbtn.refold { animation: refold .7s var(--spring); }
  @keyframes refold { 0% { transform: scale(1.4) rotate(10deg); opacity: 0; } 60% { transform: scale(.92) rotate(-3deg); opacity: 1; } 100% { transform: none; } }

  /* ---------- Receipt (cart) ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(20, 14, 6, .45); backdrop-filter: blur(2px); animation: fade .3s ease; }
  .scrim.closing { animation: fade .3s ease reverse forwards; }
  @keyframes fade { from { opacity: 0; } }
  .drawer { position: fixed; z-index: 61; right: 12px; bottom: 12px; width: min(430px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; overscroll-behavior: contain; padding: 12px 4px; transform-origin: 85% 100%; }
  .drawer.opening { animation: receiptOpen .62s var(--out); }
  .drawer.closing { animation: receiptClose .42s cubic-bezier(.6, 0, .8, .4) forwards; }
  @keyframes receiptOpen {
    0% { transform: translateY(30px) scale(.25) rotate(8deg); clip-path: inset(85% 0 0 0); opacity: 0; }
    35% { transform: translateY(0) scale(1.03) rotate(-1deg); clip-path: inset(55% 0 0 0); opacity: 1; }
    100% { transform: none; clip-path: inset(0 0 0 0); }
  }
  @keyframes receiptClose { 0% { transform: none; clip-path: inset(0 0 0 0); } 100% { transform: translateY(40px) scale(.25) rotate(10deg); clip-path: inset(80% 0 0 0); opacity: 0; } }
  @media (min-width: 1100px) { .drawer { top: 80px; bottom: auto; right: 24px; transform-origin: 80% 0%; max-height: calc(100dvh - 100px); } }
  .receipt {
    position: relative; background: var(--paper); color: var(--ink); padding: 22px 20px 26px; margin: 10px 0;
    box-shadow: var(--shadow); font-size: .95rem;
  }
  .receipt::before, .receipt::after { content: ""; position: absolute; left: 0; right: 0; height: 10px; }
  .receipt::before { top: -10px; background: conic-gradient(from 135deg at top, var(--paper) 90deg, transparent 0) 50% / 16px 100%; }
  .receipt::after { bottom: -10px; background: conic-gradient(from -45deg at bottom, var(--paper) 90deg, transparent 0) 50% / 16px 100%; }
  .rc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .rc-head h2 { font-size: 1.6rem; }
  .rc-meta { font: 600 .74rem/1.4 var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
  .rc-x { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); display: grid; place-items: center; font-size: 1.2rem; font-weight: 900; transition: transform .35s var(--spring); }
  .rc-x:hover { transform: rotate(90deg); }
  .rc-rule { border: 0; border-top: 2px dashed var(--line); margin: 14px 0; }
  .rc-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .rc-line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--line); overflow: hidden; }
  .rc-line.enter { animation: lineIn .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes lineIn { from { opacity: 0; transform: translateX(26px) rotate(1.5deg); } }
  .rc-art { width: 64px; height: 46px; border-radius: 10px; background: var(--kraft-lt); display: grid; place-items: center; overflow: hidden; }
  .rc-art svg { width: 60px; height: 36px; }
  .rc-name { font-weight: 850; line-height: 1.2; overflow-wrap: anywhere; }
  .rc-name a { text-decoration: none; }
  .rc-name a:hover { text-decoration: underline; }
  .rc-opt { font: 600 .75rem/1.4 var(--mono); color: var(--muted); }
  .rc-ctl { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .qty { display: inline-flex; align-items: center; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--card); }
  .qty button { width: 32px; height: 32px; border: 0; background: none; font-weight: 900; font-size: 1.05rem; transition: background .2s; }
  .qty button:hover { background: var(--lime); color: #151515; }
  .qty button:active { transform: scale(.85); }
  .qty output, .qty span { min-width: 26px; text-align: center; font: 800 .9rem var(--mono); }
  .qty.big button { width: 44px; height: 44px; }
  .qty.big span { min-width: 34px; font-size: 1.05rem; }
  .rc-rm { border: 0; background: none; font-weight: 700; font-size: .8rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
  .rc-rm:hover { color: var(--tomato); }
  .rc-price { font: 800 .9rem/1.2 var(--mono); text-align: right; white-space: nowrap; }
  .rc-line.leaving { animation: lineOut .45s var(--out) .18s forwards; }
  .rc-line.leaving > * { animation: crumple .3s ease-in forwards; }
  @keyframes crumple { to { transform: scale(.4) rotate(-18deg); opacity: 0; filter: blur(1px); } }
  @keyframes lineOut { to { height: 0; padding: 0; margin: 0; opacity: 0; border-width: 0; } }
  .paperball {
    position: fixed; z-index: 80; width: 34px; height: 34px; border-radius: 46% 54% 50% 48%; pointer-events: none;
    background:
      linear-gradient(35deg, transparent 45%, rgba(0,0,0,.18) 47%, transparent 50%),
      linear-gradient(-60deg, transparent 40%, rgba(0,0,0,.14) 42%, transparent 46%),
      linear-gradient(120deg, transparent 55%, rgba(255,255,255,.5) 57%, transparent 60%),
      radial-gradient(circle at 35% 30%, #fffef8, #e9e2d2 60%, #cfc5ae);
    box-shadow: 0 6px 10px rgba(0,0,0,.25);
  }
  .rc-empty { text-align: center; padding: 10px 0 4px; }
  .rc-empty svg { width: 120px; height: 140px; margin: 0 auto 6px; display: block; animation: sway 3s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .rc-empty p { color: var(--muted); margin: 4px 0 14px; }
  .promo { display: flex; gap: 8px; margin-top: 4px; }
  .promo input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--field); font: 800 .95rem var(--mono); text-transform: uppercase; letter-spacing: .08em; }
  .promo button { height: 44px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--page); font-weight: 850; }
  .promo button:active { transform: scale(.94); }
  .promo.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-9px) rotate(-1deg); } 40% { transform: translateX(8px) rotate(1deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  .hint { font: 600 .78rem/1.5 var(--mono); color: var(--muted); margin-top: 6px; }
  .hint b { background: var(--lime); color: #151515; padding: 1px 5px; border-radius: 4px; }
  .err { color: var(--tomato); font-weight: 750; font-size: .84rem; margin-top: 6px; min-height: 0; }
  :root[data-theme="light"] .err { color: #c2321a; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .err { color: #c2321a; } }
  .totals { display: grid; gap: 6px; font: 700 .9rem/1.3 var(--mono); position: relative; }
  .totals div { display: flex; justify-content: space-between; gap: 10px; }
  .totals .disc { color: #2f7d1e; overflow: hidden; }
  :root[data-theme="dark"] .totals .disc { color: var(--lime); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .totals .disc { color: var(--lime); } }
  .totals .disc.enter { animation: discIn .6s var(--spring); }
  @keyframes discIn { from { max-height: 0; opacity: 0; transform: translateX(-20px); } to { max-height: 40px; } }
  .totals .grand { font-size: 1.12rem; font-weight: 900; padding-top: 8px; border-top: 2px solid var(--ink); }
  .free-meter { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin: 6px 0 2px; }
  .free-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--kraft), var(--lime)); border-radius: 8px; transition: width .7s var(--spring); }
  .stamp {
    position: absolute; right: 8px; top: 8px; z-index: 2; padding: 6px 10px; border: 3px double var(--tomato); border-radius: 8px;
    color: var(--tomato); font: 950 .95rem/1.1 var(--mono); letter-spacing: .1em; text-transform: uppercase; transform: rotate(-11deg);
    background: color-mix(in srgb, var(--tomato) 8%, transparent); mix-blend-mode: multiply; text-align: center; pointer-events: none;
  }
  :root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
  .stamp small { display: block; font-size: .62rem; letter-spacing: .14em; }
  .stamp.thud { animation: thud .55s cubic-bezier(.2, .9, .3, 1.3); }
  @keyframes thud { 0% { transform: scale(2.6) rotate(-24deg); opacity: 0; } 55% { transform: scale(.92) rotate(-10deg); opacity: 1; } 75% { transform: scale(1.04) rotate(-11deg); } 100% { transform: rotate(-11deg); } }
  .receipt.jolt { animation: jolt .35s ease; }
  @keyframes jolt { 30% { transform: translateY(3px); } 60% { transform: translateY(-1px); } }
  .ink { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--tomato); pointer-events: none; animation: inkDot .6s var(--out) forwards; }
  @keyframes inkDot { from { transform: translate(0, 0) scale(1.4); } to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  .applied { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 60px; padding: 8px 124px 8px 10px; border: 2px dashed var(--tomato); border-radius: 10px; font: 700 .85rem var(--mono); }
  .applied button { border: 0; background: none; font-weight: 800; text-decoration: underline; color: var(--muted); }
  .rc-cta { margin-top: 16px; display: grid; gap: 10px; }
  .rc-cta .btn { width: 100%; }
  .barcode { height: 34px; margin-top: 16px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px); opacity: .8; }

  /* ---------- Page transition: paper sheets ---------- */
  .sheet { min-width: 0; }
  .sheet.in { animation: sheetIn .62s var(--out) both; }
  .sheet.out { position: absolute; left: 0; right: 0; top: 18px; pointer-events: none; animation: sheetOut .3s ease-in forwards; }
  @keyframes sheetIn {
    0% { opacity: 0; transform: translate(70px, 20px) rotate(3deg); filter: drop-shadow(0 30px 30px rgba(0,0,0,.25)); }
    60% { opacity: 1; transform: translate(-6px, 0) rotate(-.4deg); }
    100% { transform: none; filter: none; }
  }
  @keyframes sheetOut { to { opacity: 0; transform: translate(-50px, -10px) rotate(-3deg); } }

  /* ---------- Shared section bits ---------- */
  .sec { margin-top: clamp(40px, 7vw, 80px); }
  .sec-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .sec-head h2 { font-size: clamp(1.7rem, 4.4vw, 2.8rem); }
  .sec-head p { color: var(--muted); max-width: 42ch; }
  .rv { opacity: 0; transform: translateY(26px) rotate(.6deg); transition: opacity .7s var(--out), transform .8s var(--spring); transition-delay: calc(var(--d, 0) * 70ms); }
  .rv.in { opacity: 1; transform: none; }

  /* ---------- Shoe art ---------- */
  .shoe { display: block; width: 100%; height: auto; overflow: visible; }
  .su { fill: var(--su); }
  .ss { fill: var(--ss); }
  .sa { fill: var(--sa); }
  .sa-st { stroke: var(--sa); fill: none; }
  .shoe-c { transition: --su .6s ease, --ss .6s ease, --sa .6s ease; }

  /* ---------- Home: hero ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: center; padding-top: 10px; }
  @media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); } }
  .hero h1 { font-size: clamp(2.6rem, 8.5vw, 5.4rem); margin: 14px 0 14px; text-wrap: balance; }
  .hero h1 .hl { display: inline-block; background: var(--lime); color: #151515; padding: 0 .12em; border-radius: 10px; transform: rotate(-2deg); }
  .hero h1 .word { display: inline-block; animation: wordUp .8s var(--spring) both; animation-delay: calc(var(--w) * 90ms + 150ms); }
  @keyframes wordUp { from { opacity: 0; transform: translateY(.6em) rotate(6deg); } }
  .hero-lede { color: var(--muted); font-size: 1.08rem; max-width: 46ch; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 26px; }
  .hero-stats div { font-weight: 900; font-size: 1.3rem; }
  .hero-stats small { display: block; font-weight: 650; font-size: .8rem; color: var(--muted); }
  .stage {
    position: relative; aspect-ratio: 5 / 4; min-height: 260px; border: 2.5px solid var(--ink); border-radius: 26px; overflow: hidden;
    background: radial-gradient(120% 90% at 70% 10%, color-mix(in srgb, var(--lime) 55%, var(--page)) 0%, var(--kraft-lt) 60%, var(--kraft) 100%);
    box-shadow: 8px 8px 0 var(--ink);
  }
  .stage .sun { position: absolute; width: 38%; aspect-ratio: 1; right: 8%; top: 8%; border-radius: 50%; background: repeating-radial-gradient(circle, var(--tomato) 0 10px, color-mix(in srgb, var(--tomato) 70%, var(--page)) 10px 20px); opacity: .9; animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cobbles { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background-color: #6f5a43; overflow: hidden; }
  .cobbles::before { content: ""; position: absolute; inset: 0 -120px 0 0; background:
      radial-gradient(ellipse 22px 12px at 26px 14px, #a58a69 92%, transparent 100%) 0 0 / 60px 30px,
      radial-gradient(ellipse 22px 12px at 56px 44px, #8d7254 92%, transparent 100%) 0 0 / 60px 30px;
    background-color: #5a4835; animation: road 1.4s linear infinite; }
  @keyframes road { to { transform: translateX(-60px); } }
  .walker { position: absolute; left: 12%; width: 74%; bottom: 17%; transform-origin: 30% 100%; animation: step 1.4s cubic-bezier(.5, 0, .5, 1) infinite; }
  @keyframes step {
    0% { transform: translateY(0) scale(1.05, .93) rotate(0); }
    12% { transform: translateY(0) scale(1, 1) rotate(0); }
    35% { transform: translateY(-26%) scale(.97, 1.04) rotate(-9deg); }
    55% { transform: translateY(-30%) scale(.98, 1.03) rotate(-4deg); }
    80% { transform: translateY(-4%) scale(1, 1) rotate(2deg); }
    90% { transform: translateY(0) scale(1.07, .9) rotate(0); }
    100% { transform: translateY(0) scale(1.05, .93) rotate(0); }
  }
  .walker .lace { transform-box: fill-box; transform-origin: 50% 0; animation: lace 1.4s ease-in-out infinite; }
  @keyframes lace { 0%, 100% { transform: rotate(10deg); } 40% { transform: rotate(-24deg); } 70% { transform: rotate(18deg); } }
  .shadow-oval { position: absolute; left: 22%; width: 56%; height: 5%; bottom: 15%; border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(2px); animation: shad 1.4s cubic-bezier(.5, 0, .5, 1) infinite; }
  @keyframes shad { 0%, 12%, 90%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(.6); opacity: .35; } }
  .puff { position: absolute; bottom: 18%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: #efe2c8; opacity: 0; animation: puff 1.4s ease-out infinite; }
  .puff.p1 { left: 14%; } .puff.p2 { left: 26%; width: 6%; animation-delay: .05s; } .puff.p3 { left: 70%; width: 7%; animation-delay: .02s; }
  @keyframes puff { 0%, 86% { opacity: 0; transform: translate(0, 0) scale(.3); } 90% { opacity: .9; } 100% { opacity: 0; transform: translate(-18px, -14px) scale(1.4); } }
  .puff.p3 { animation-name: puffR; }
  @keyframes puffR { 0%, 86% { opacity: 0; transform: translate(0, 0) scale(.3); } 90% { opacity: .9; } 100% { opacity: 0; transform: translate(18px, -12px) scale(1.4); } }
  .drop-sticker { position: absolute; left: 4%; top: 5%; width: 27%; min-width: 92px; animation: spin 14s linear infinite; }
  .drop-sticker svg { display: block; width: 100%; height: auto; }
  .price-flag { position: absolute; right: 5%; bottom: 30%; padding: 8px 12px; border: 2.5px solid #151515; border-radius: 10px; background: #fffdf7; color: #151515; font: 900 .95rem/1.1 var(--mono); transform: rotate(5deg); box-shadow: 3px 3px 0 #151515; animation: flagBob 2.8s ease-in-out infinite; }
  .price-flag small { display: block; font: 700 .66rem var(--heavy); letter-spacing: .1em; text-transform: uppercase; }
  @keyframes flagBob { 50% { transform: rotate(-3deg) translateY(-6px); } }
  .hero-dots { position: absolute; left: 50%; bottom: 3.5%; translate: -50% 0; display: flex; gap: 8px; z-index: 2; }
  .hero-dots button { padding: 0; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fffdf7; box-shadow: 0 0 0 2px #151515; transition: transform .3s var(--spring); }
  .hero-dots button[aria-pressed="true"] { transform: scale(1.25); box-shadow: 0 0 0 2px #151515, 0 0 0 5px var(--lime); }

  /* ---------- Marquee ---------- */
  .marquee { margin: 46px calc(-1 * clamp(12px, 3vw, 28px)) 0; background: var(--lime); color: #151515; border-block: 2.5px solid #151515; transform: rotate(-1.6deg); overflow: hidden; }
  .marquee-track { display: flex; width: max-content; animation: marq 26s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee span { display: inline-flex; align-items: center; gap: 18px; padding: 12px 18px; font: 900 1.05rem/1 var(--heavy); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .marquee svg { width: 34px; height: 20px; }
  @keyframes marq { to { transform: translateX(-50%); } }

  /* ---------- Category cards ---------- */
  .cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 720px) { .cats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .cat {
    position: relative; display: grid; gap: 6px; padding: 14px; border: 2.5px solid var(--ink); border-radius: 20px; text-decoration: none; overflow: hidden;
    background: var(--card); transition: transform .4s var(--spring), box-shadow .4s var(--spring);
  }
  .cat:hover { transform: translateY(-6px) rotate(-1.2deg); box-shadow: 6px 8px 0 var(--ink); }
  .cat:nth-child(even):hover { transform: translateY(-6px) rotate(1.2deg); }
  .cat .cat-art { aspect-ratio: 16 / 10; border-radius: 12px; display: grid; place-items: center; background: var(--tint, var(--kraft-lt)); }
  .cat .cat-art svg { width: 82%; transition: transform .5s var(--spring); }
  .cat:hover .cat-art svg { transform: translateY(-10%) rotate(-8deg) scale(1.06); }
  .cat b { font-size: 1.1rem; font-weight: 900; }
  .cat small { color: var(--muted); font-weight: 650; padding-right: 38px; }
  .cat .arrow { position: absolute; right: 14px; bottom: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--page); display: grid; place-items: center; transition: transform .4s var(--spring); }
  .cat:hover .arrow { transform: rotate(-45deg) scale(1.1); }

  /* ---------- Product cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 16px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .pc-body { padding: 8px 10px 12px; } }
  .pcard {
    --rx: 0deg; --ry: 0deg;
    position: relative; display: flex; flex-direction: column; min-width: 0; border: 2.5px solid var(--ink); border-radius: 20px; background: var(--card);
    transform: perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .35s var(--out), box-shadow .35s var(--out); will-change: transform;
  }
  .pcard:hover { box-shadow: 6px 6px 0 var(--ink); }
  .pcard.enter { animation: cardIn .6s var(--spring) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.94) rotate(-2deg); } }
  .pc-art { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; margin: 8px 8px 0; border-radius: 14px; background: var(--tint, var(--kraft-lt)); overflow: hidden; text-decoration: none; }
  .pc-art svg { width: 86%; transition: transform .5s var(--spring); }
  .pcard:hover .pc-art svg { transform: translateY(-8%) rotate(-6deg) scale(1.05); }
  .pc-art .sticker { position: absolute; left: 8px; top: 8px; }
  .pc-body { display: grid; gap: 4px; padding: 10px 14px 14px; }
  .pc-name { font-weight: 900; font-size: 1.04rem; line-height: 1.2; text-decoration: none; overflow-wrap: anywhere; }
  .pc-name:hover { text-decoration: underline; }
  .pc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pc-price { font: 850 .95rem var(--mono); }
  .stars { color: #e3a008; font-size: .82rem; letter-spacing: 1px; }
  .stars span { color: var(--muted); font: 700 .74rem var(--mono); letter-spacing: 0; margin-left: 4px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
  .qa { justify-self: start; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--lime); color: #151515; font-weight: 850; font-size: .85rem; transition: transform .25s var(--spring); }
  .qa:hover { transform: rotate(-2deg) scale(1.04); }
  .qa:active { transform: scale(.92); }
  .qa-sizes { display: none; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .qa-sizes.on { display: flex; }
  .qa-sizes button { min-width: 38px; height: 34px; border: 2px solid var(--ink); border-radius: 8px; background: var(--card); font: 800 .8rem var(--mono); animation: cardIn .4s var(--spring) both; animation-delay: calc(var(--i) * 35ms); }
  .qa-sizes button:hover { background: var(--ink); color: var(--page); }
  .qa-sizes button[disabled] { opacity: .4; text-decoration: line-through; cursor: not-allowed; }

  /* ---------- How it works + reviews ---------- */
  .steps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); counter-reset: s; }
  .stepc { position: relative; padding: 18px; border-radius: 18px; background: var(--kraft-lt); border: 2.5px dashed var(--kraft-dk); }
  .stepc::before { counter-increment: s; content: "0" counter(s); font: 900 2.4rem/1 var(--mono); color: var(--kraft-dk); }
  .stepc svg { position: absolute; right: 12px; top: 12px; width: 64px; height: 64px; }
  .stepc h3 { font-size: 1.2rem; margin: 8px 0 4px; }
  .stepc p { color: var(--muted); font-size: .94rem; }
  .stepc .bob { animation: flagBob 3s ease-in-out infinite; transform-box: fill-box; }
  .reviews { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
  .review { padding: 18px; border-radius: 18px; background: var(--card); border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--kraft); transform: rotate(var(--r, 0deg)); transition: transform .4s var(--spring); }
  .review:hover { transform: rotate(0) translateY(-4px); }
  .review p { margin: 8px 0 12px; }
  .review footer { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .review footer i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 900; color: #151515; background: var(--c, var(--lime)); border: 2px solid #151515; }
  .review footer small { display: block; font-weight: 600; color: var(--muted); }

  /* ---------- Footer ---------- */
  .foot { margin-top: 70px; padding: 26px 20px; border-radius: 24px; background: var(--ink); color: var(--page); display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
  .foot h2 { font-size: 1.6rem; }
  .foot p { color: color-mix(in srgb, var(--page) 70%, transparent); font-size: .92rem; margin-top: 6px; }
  .news { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .news input { flex: 1 1 180px; min-width: 0; height: 46px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--page); background: transparent; color: var(--page); }
  .news input::placeholder { color: color-mix(in srgb, var(--page) 55%, transparent); }
  .news .btn { --bg: var(--lime); --fg: #151515; border-color: var(--page); box-shadow: 3px 3px 0 var(--page); min-height: 46px; }
  .news-msg { min-height: 1.4em; margin-top: 8px; font-weight: 750; }
  .news-msg.ok { color: var(--lime); }
  .news-msg.bad { color: #ff8a6e; }

  /* ---------- Shop listing ---------- */
  .page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
  .page-head h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); }
  .crumbs { font: 700 .78rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .shop { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  @media (min-width: 900px) { .shop { grid-template-columns: 250px minmax(0, 1fr); } }
  .filters { display: grid; gap: 18px; align-content: start; padding: 16px; border: 2.5px solid var(--ink); border-radius: 20px; background: var(--card); }
  .filters fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .filters legend { font-weight: 900; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; padding: 0; }
  .filters .wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters .chip { min-height: 34px; padding: 0 11px; font-size: .84rem; }
  .sw { padding: 0; width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--card); box-shadow: 0 0 0 2px var(--line); transition: transform .3s var(--spring), box-shadow .2s; }
  .sw:hover { transform: scale(1.12); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--ink); transform: scale(1.1); }
  .sizes-f button { width: 42px; height: 36px; border: 2px solid var(--line); border-radius: 9px; background: var(--card); font: 800 .82rem var(--mono); transition: transform .25s var(--spring); }
  .sizes-f button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .sizes-f button:active { transform: scale(.9); }
  .range-row { display: flex; justify-content: space-between; font: 700 .8rem var(--mono); color: var(--muted); }
  input[type="range"] { width: 100%; accent-color: var(--tomato); }
  .tog { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: .9rem; cursor: pointer; }
  .tog input { width: 20px; height: 20px; accent-color: var(--ink); }
  .filters-toggle { display: none; }
  @media (max-width: 899px) {
    .filters-toggle { display: inline-flex; }
    .filters.collapsed { display: none; }
    .filters.opened { animation: cardIn .45s var(--spring); }
  }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .toolbar label { font-weight: 750; font-size: .9rem; display: inline-flex; align-items: center; gap: 8px; }
  .toolbar select { height: 40px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--field); font-weight: 700; max-width: 100%; }
  .count { font: 800 .85rem var(--mono); }
  .empty { text-align: center; padding: 34px 16px; border: 2.5px dashed var(--line); border-radius: 20px; }
  .empty svg { width: 130px; height: 120px; display: block; margin: 0 auto 10px; animation: sway 3s ease-in-out infinite; }
  .empty p { color: var(--muted); margin: 6px 0 16px; }

  /* ---------- Product page ---------- */
  .pdp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  @media (min-width: 900px) { .pdp { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
  .viewer { position: relative; border: 2.5px solid var(--ink); border-radius: 26px; background: var(--tint, var(--kraft-lt)); overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; }
  .viewer:active { cursor: grabbing; }
  .viewer-stage { position: relative; aspect-ratio: 5 / 4; display: grid; place-items: center; perspective: 900px; }
  .viewer-stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(transparent, rgba(0,0,0,.1)); }
  .turn { width: 84%; transform-style: preserve-3d; transition: transform .7s var(--spring); }
  .turn.dragging { transition: none; }
  .turn .shoe { filter: drop-shadow(0 18px 14px rgba(0,0,0,.22)); }
  .turn.paint { animation: paint .6s var(--spring); }
  @keyframes paint { 30% { scale: .94; } 60% { scale: 1.04; } }
  .v-shadow { position: absolute; left: 20%; right: 20%; bottom: 14%; height: 6%; border-radius: 50%; background: rgba(0,0,0,.25); filter: blur(3px); transition: transform .6s var(--spring); }
  .viewer-ctl { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 2; }
  .viewer-ctl button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #151515; background: #fffdf7; color: #151515; font-weight: 900; transition: transform .3s var(--spring); }
  .viewer-ctl button:hover { transform: scale(1.1); }
  .viewer-ctl button:active { transform: scale(.88); }
  .angle-dots { display: flex; gap: 6px; }
  .angle-dots i { width: 9px; height: 9px; border-radius: 9px; background: rgba(21,21,21,.3); transition: width .4s var(--spring), background .3s; }
  .angle-dots i.on { width: 26px; background: #151515; }
  .angle-name { position: absolute; top: 12px; right: 12px; z-index: 2; }
  .drag-hint { position: absolute; top: 12px; left: 12px; z-index: 2; font: 700 .72rem var(--mono); background: rgba(255,253,247,.85); color: #151515; padding: 5px 8px; border-radius: 8px; }
  .info h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin: 10px 0 6px; overflow-wrap: anywhere; }
  .info .price { font: 900 1.5rem var(--mono); margin: 10px 0 4px; }

  /* ---------- Bag actions ---------- */
  function addToBag(id, size, color, qty, srcEl) {
    var key = id + "|" + size + "|" + color, p = byId(id);
    var line = null;
    state.bag.forEach(function (l) { if (l.key === key) line = l; });
    if (line) {
      if (line.qty >= 9) { announce("You already have 9 of these in the bag"); return false; }
      line.qty = Math.min(9, line.qty + qty);
      state.bag.splice(state.bag.indexOf(line), 1);
      state.bag.unshift(line);
    } else state.bag.unshift({ key: key, id: id, size: size, color: color, qty: Math.min(9, qty) });
    save();
    flyToBag(p, color, srcEl, function () {
      dropInBag();
      refreshBagUI({ newKey: key });
      announce(p.name + " · UK " + size + " · " + COLORS[color].name + " dropped in your bag");
    });
    return true;
  }
  function setQty(key, delta) {
    state.bag.forEach(function (l) { if (l.key === key) l.qty = Math.max(1, Math.min(9, l.qty + delta)); });

  function removeLine(key, btn) {
    var p = null;
    state.bag.forEach(function (l) { if (l.key === key) p = byId(l.id); });
    var box = btn && btn.closest(".receipt"), boxId = box && box.id;
    var commit = function () {
      state.bag = state.bag.filter(function (l) { return l.key !== key; });
      if (!state.bag.length) state.promo = null;
      save();
      refreshBagUI();
      announce((p ? p.name : "Item") + " removed from your bag");

      if (focusTo) focusTo.focus();

    if (calm() || !li) { commit(); return; }
    var r = li.getBoundingClientRect();

    setTimeout(function () { if (ball.parentNode) ball.parentNode.removeChild(ball); }, 1100);

  /* ---------- Flight: a shoe copy arcs into the bag mouth ---------- */
  function flyToBag(p, color, src, done) {
    var svg = $("#dockBagSlot svg");
    var a = src && src.getBoundingClientRect ? src.getBoundingClientRect() : null;
    var b = svg ? svg.getBoundingClientRect() : null;
    if (calm() || !a || !b || !a.width || !b.width) { done(); return; }
    var fly = document.createElement("div");
    fly.className = "flyer";
    fly.innerHTML = shoeSVG(typeOf(p), color);
    $("#flyLayer").appendChild(fly);
    var w = 120, sx = a.left + a.width / 2 - w / 2, sy = a.top + a.height / 2 - 35;
    var ex = b.left + b.width * 0.5 - w / 2, ey = b.top + b.height * 0.16 - 35;
    var cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 170;
    var frames = [];
    for (var i = 0; i <= 16; i++) {
      var t = i / 16, u = 1 - t;
      var x = u * u * sx + 2 * u * t * cx + t * t * ex, y = u * u * sy + 2 * u * t * cy + t * t * ey;
      frames.push({ transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (-20 + 290 * t).toFixed(1) + "deg) scale(" + (1.1 - 0.75 * t).toFixed(3) + ")", opacity: t > 0.94 ? 0 : 1 });
    }
    setTimeout(function () { svg.classList.add("open"); }, 420);
    var anim = fly.animate(frames, { duration: 860, easing: "cubic-bezier(.45,.05,.55,.95)", fill: "forwards" });
    var fin = false;
    var end = function () {
      if (fin) return; fin = true;
      if (fly.parentNode) fly.parentNode.removeChild(fly);
      done();
      setTimeout(function () { svg.classList.remove("open"); }, 340);
    };
    anim.onfinish = end;
    setTimeout(end, 1050);
  }

  var VIEWS = {};

  function router() {
    var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    var name = parts[0] || "home", arg = parts[1] ? decodeURIComponent(parts[1]) : null;
    var ok = !!VIEWS[name];
    if (name === "p" && !byId(arg)) ok = false;
    if (name === "shop" && arg && !CATS[arg]) ok = false;
    if (name === "home" && parts[0]) ok = false;

    var h1 = $("h1", sheet);

      o.classList.remove("in"); o.classList.add("out");

  document.addEventListener("pointerout", function (e) {
    var c = e.target.closest && e.target.closest(".pcard");
    if (c && !c.contains(e.relatedTarget)) { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); }
  });
  window.addEventListener("resize", moveMarker);
  window.addEventListener("hashchange", function () { popBack(); router(); });

  /* ---------- Start ---------- */
  load();
  renderDock();
  $("#hdrCount").textContent = totals().count;
  lastTotal = totals().total;
  setThemeIcon();
  router();
})();
</script>
</body>
</html>
