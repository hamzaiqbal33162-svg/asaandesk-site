<!doctype html>
<!-- Chill & Craft · Manila Tabs · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manila Tabs · filing folder tab menu</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: manila folders on a slate-blue office desk, red stamp ink ---------- */
  :root {
    color-scheme: light;
    --bg: #dbe3ec;
    --bg2: #c5d3e2;
    --desk: #eef2f7;
    --desk2: #e1e8f0;
    --rule: #d3dce7;
    --ink: #1c2633;
    --ink2: #5a6879;
    --soft: #94a2b3;
    --man: #efd59e;
    --man2: #e4c584;
    --man3: #cfa960;
    --paper: #fffdf7;
    --pink: #252a31;
    --pink2: #6b6f76;
    --pline: #ece6d8;
    --stamp: #d23a2e;
    --ok: #2f9e6b;
    --shadow: rgba(25, 40, 60, .24);
    --focus: #2b6fd6;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1119;
    --bg2: #14213a;
    --desk: #172230;
    --desk2: #111a25;
    --rule: #26344a;
    --ink: #e7edf5;
    --ink2: #9aa8ba;
    --soft: #5f6e82;
    --man: #cdb077;
    --man2: #bb9c62;
    --man3: #9f8149;
    --paper: #e4dccb;
    --pink: #22262c;
    --pink2: #5c5e62;
    --pline: #d3c9b4;
    --stamp: #c4352a;
    --ok: #2a8f60;
    --shadow: rgba(0, 0, 0, .6);
    --focus: #8ab4ff;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(60% 55% at 85% 0%, var(--bg2), transparent 70%),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, .03) 0 2px, transparent 2px 6px),
      var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px 14px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .app {
    --bh: 316px;
    position: relative;
    width: min(800px, 100%);
    padding: 16px 18px 20px;
    border-radius: 28px;
    background: linear-gradient(180deg, var(--desk), var(--desk2));
    box-shadow: 0 44px 90px -50px var(--shadow), 0 0 0 1px var(--rule);
  }

  /* ---------- Header with a real file search ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(160deg, var(--man), var(--man3)); box-shadow: 0 10px 18px -12px var(--shadow), inset 0 0 0 1px rgba(0, 0, 0, .08); }
  .logo svg { width: 24px; height: 24px; }
  .brand b { display: block; font-size: 16.5px; letter-spacing: -.02em; }
  .brand small { display: block; font-size: 12.5px; color: var(--ink2); }
  .find { position: relative; flex: 1 1 220px; max-width: 300px; }
  .find svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--soft); pointer-events: none; }
  .find input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--rule); background: var(--desk); font-size: 14px; }
  .find input::placeholder { color: var(--soft); }
  .find small { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink2); background: var(--desk2); padding: 2px 6px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .find.hit small { opacity: 1; }

  /* ---------- The folder stack: back folders sit higher and smaller, only their tabs show ---------- */
  .stack { position: relative; height: calc(var(--bh) + 4 * 26px + 40px); margin-top: 6px; }
  .folder {
    --d: 0; --x: 2%; --tc: #e05a47; --delay: 0ms;
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--bh);
    transform: translateY(calc(var(--d) * -26px)) scale(calc(1 - var(--d) * .026));
    transform-origin: 50% 0;
    transition: transform .62s var(--spring) var(--delay);
  }
  .leaf { position: absolute; inset: 0; transform-origin: 50% 100%; }
  .tab {
    position: absolute; left: var(--x); bottom: calc(100% - 3px); width: 19%; height: 34px;
    display: flex; align-items: center; gap: 7px; padding: 0 10px;
    border: 0; border-radius: 11px 11px 0 0;
    background: linear-gradient(180deg, var(--man), var(--man2));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 -4px 10px -8px var(--shadow);
    font-size: 13px; font-weight: 750; letter-spacing: -.01em; color: #3b2d14; white-space: nowrap; overflow: hidden;
    transition: transform .35s var(--spring), filter .3s;
  }
  .tab .sticker { flex: none; width: 9px; height: 16px; border-radius: 3px; background: var(--tc); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { transform: translateY(-4px); }
  .tab:focus-visible { outline-offset: -3px; }
  .folder:not(.front) .tab { filter: brightness(.94) saturate(.9); }
  .tab.match { animation: match 1s ease-in-out infinite; }
  @keyframes match { 50% { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--focus); } }
  .body {
    position: absolute; inset: 0; border-radius: 4px 14px 14px 14px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0) 30px),
      linear-gradient(180deg, var(--man), var(--man2));
    box-shadow: 0 -1px 0 rgba(255, 255, 255, .4) inset, 0 20px 34px -26px var(--shadow), 0 0 0 1px rgba(80, 60, 20, .12);
  }
  .body::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(110, 80, 30, .25); }
  .closed-label { position: absolute; left: 20px; top: 10px; font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: rgba(70, 50, 20, .55); transition: opacity .3s; }
  .folder.front .closed-label { opacity: 0; }
  .paper {
    position: absolute; left: 16px; right: 16px; top: 12px; bottom: 30px;
    border-radius: 6px; overflow: hidden;
    background:
      linear-gradient(90deg, transparent 38px, color-mix(in srgb, var(--stamp) 22%, transparent) 38px 39px, transparent 39px),
      repeating-linear-gradient(180deg, transparent 0 25px, var(--pline) 25px 26px),
      var(--paper);
    color: var(--pink);
    box-shadow: 0 8px 18px -12px rgba(0, 0, 0, .35);
    opacity: 0; transform: translateY(16px);
    transition: opacity .35s, transform .5s var(--spring);
  }
  .folder.front .paper { opacity: 1; transform: none; }
  .doc { position: absolute; inset: 0; overflow: auto; padding: 14px 18px 14px 52px; scrollbar-width: thin; }
  .flap { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; border-radius: 0 0 14px 14px; background: linear-gradient(180deg, var(--man2), var(--man3)); box-shadow: 0 -6px 12px -8px rgba(60, 40, 10, .45); }
  .flap::before { content: ""; position: absolute; left: 50%; top: 9px; width: 70px; height: 5px; margin-left: -35px; border-radius: 3px; background: rgba(60, 40, 10, .18); }
  .clip { position: absolute; left: 30px; top: -2px; width: 22px; height: 58px; transform-origin: 50% 10%; opacity: 0; }
  .folder.front .clip { opacity: 1; }
  .imprint {
    position: absolute; right: 18px; top: 16px; padding: 5px 10px; border: 2.5px solid var(--stamp); border-radius: 6px;
    font: 800 12px var(--mono); letter-spacing: .12em; color: var(--stamp); transform: rotate(-9deg); opacity: 0; pointer-events: none;
    mix-blend-mode: multiply; text-align: center; line-height: 1.25;
  }
  :root[data-theme="dark"] .imprint { mix-blend-mode: normal; }
  .imprint small { display: block; font-size: 9.5px; letter-spacing: .18em; }
  .stamper { position: absolute; right: 44px; top: -96px; width: 70px; height: 96px; opacity: 0; pointer-events: none; z-index: 3; }
  .ink { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--stamp); pointer-events: none; }

  /* paper content */
  .doc h2 { margin: 0 0 2px; font-size: 19px; letter-spacing: -.02em; }
  .doc .sub { margin: 0 0 10px; font-size: 12.5px; color: var(--pink2); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 6px 0; border-bottom: 1px dashed var(--pline); font-size: 13.5px; }
  .rows li > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows li small { color: var(--pink2); font-size: 12px; }
  .amt { font: 700 13px var(--mono); }
  .sum { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 6px; border-top: 2px solid var(--pink); font-weight: 800; font-size: 14px; }
  .sum .amt { font-size: 15px; }
  .sum .amt.pop { animation: pop .5s var(--spring); }
  @keyframes pop { 40% { transform: scale(1.15); } }
  .paid { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, .06); font-size: 12px; font-weight: 750; color: var(--pink2); transition: background .25s, color .25s, transform .3s var(--spring); }
  .paid i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-style: normal; font-size: 10px; line-height: 1; }
  .paid[aria-pressed="true"] { background: var(--ok); color: #fff; }
  .paid[aria-pressed="true"] i::before { content: "✓"; }
  .paid:active { transform: scale(.92); }
  .low { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: color-mix(in srgb, var(--stamp) 16%, transparent); color: var(--stamp); font-size: 11px; font-weight: 800; }
  .req { padding: 5px 11px; border: 0; border-radius: 999px; background: var(--pink); color: var(--paper); font-size: 12px; font-weight: 750; transition: transform .3s var(--spring); }
  .req:active { transform: scale(.94); }
  .req[disabled] { background: var(--ok); color: #fff; cursor: default; }

  @media (max-width: 560px) {
    .app { --bh: 360px; padding: 14px 12px 16px; border-radius: 22px; }
    .tab { width: 19.4%; padding: 0 6px; gap: 5px; font-size: 11.5px; height: 32px; }
    .tab .sticker { display: none; }
    .tab { box-shadow: inset 0 3px 0 var(--tc), inset 0 4px 0 rgba(255, 255, 255, .35); }
    .paper { left: 10px; right: 10px; }
    .doc { padding: 12px 12px 12px 46px; }
    .find { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="app" id="app" aria-labelledby="ttl">
    <header class="bar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z" fill="#fff8e6" stroke="#6b4f1d" stroke-width="1.5"/></svg></span>
        <div><b id="ttl">Noor Traders</b><small>Records room · Faisalabad</small></div>
      </div>
      <div class="find" id="find">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <label class="sr-only" for="q">Find a file</label>
        <input id="q" type="search" placeholder="Find a file, e.g. salary" autocomplete="off">
        <small aria-hidden="true">Enter</small>
      </div>
    </header>
    <nav class="stack" id="stack" aria-label="Record folders"></nav>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </section>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 40); };
  const pkr = (n) => "PKR " + n.toLocaleString("en-US");

  // ---------- Data: five folders, each with its own tab position and sticker colour ----------
  const invoices = [
    { no: "INV-1041", to: "Ahmed Electronics", amt: 84500, paid: true },
    { no: "INV-1042", to: "Rahim Textiles", amt: 126000, paid: false },
    { no: "INV-1043", to: "Sialkot Sports Co.", amt: 47250, paid: false },
    { no: "INV-1044", to: "Fatima Foods", amt: 31800, paid: true }
  ];
  const boxes = [{ y: "2023", n: 14, asked: false }, { y: "2024", n: 21, asked: false }, { y: "2025", n: 9, asked: false }];
  const FOLDERS = [
    { id: "clients", name: "Clients", tc: "#e05a47", words: "client customer buyer people ahmed rahim fatima",
      doc: () => '<h2>Clients</h2><p class="sub">Four active accounts · balances owed to us</p><ul class="rows">' +
        [["Ahmed Electronics", "Lahore", 0], ["Rahim Textiles", "Faisalabad", 126000], ["Sialkot Sports Co.", "Sialkot", 47250], ["Fatima Foods", "Multan", 0]]
          .map((c) => "<li><span>" + c[0] + " <small>· " + c[1] + "</small></span><span class=\"amt\">" + (c[2] ? pkr(c[2]) : "settled") + "</span></li>").join("") + "</ul>" },
    { id: "invoices", name: "Invoices", tc: "#3a7bd5", words: "invoice bill unpaid paid due money",
      doc: () => '<h2>Invoices</h2><p class="sub">Tap a row to mark it paid</p><ul class="rows">' +
        invoices.map((v, i) => "<li><span>" + v.no + " <small>· " + v.to + "</small></span><button type=\"button\" class=\"paid\" data-inv=\"" + i + "\" aria-pressed=\"" + v.paid + "\" aria-label=\"" + v.no + ", " + pkr(v.amt) + ", paid\"><i aria-hidden=\"true\"></i>" + pkr(v.amt) + "</button></li>").join("") +
        '</ul><div class="sum"><span>Still unpaid</span><span class="amt" id="unpaid">' + pkr(unpaid()) + "</span></div>" },
    { id: "payroll", name: "Payroll", tc: "#3aa676", words: "payroll salary salaries staff wages pay team",
      doc: () => '<h2>Payroll · November</h2><p class="sub">Paid on the 1st of each month</p><ul class="rows">' +
        [["Usman Tariq", "Store manager", 95000], ["Sadia Iqbal", "Accounts", 82000], ["Kamran Ali", "Driver", 48000], ["Zainab Noor", "Sales", 61000]]
          .map((p) => "<li><span>" + p[0] + " <small>· " + p[1] + "</small></span><span class=\"amt\">" + pkr(p[2]) + "</span></li>").join("") +
        '</ul><div class="sum"><span>Total</span><span class="amt">' + pkr(286000) + "</span></div>" },
    { id: "stock", name: "Stock", tc: "#f0b429", words: "stock inventory items godown warehouse cloth thread",
      doc: () => '<h2>Stock</h2><p class="sub">Counted on 20 November</p><ul class="rows">' +
        [["Cotton lawn, rolls", 42, false], ["Khaddar, rolls", 6, true], ["Thread cones", 310, false], ["Buttons, boxes", 4, true], ["Shipping cartons", 120, false]]
          .map((s) => "<li><span>" + s[0] + (s[2] ? '<span class="low">low</span>' : "") + "</span><span class=\"amt\">" + s[1] + "</span></li>").join("") + "</ul>" },
    { id: "archive", name: "Archive", tc: "#8a5cd0", words: "archive old past year box records history 2023 2024",
      doc: () => '<h2>Archive</h2><p class="sub">Boxes kept in the back room · request one to your desk</p><ul class="rows">' +
        boxes.map((b, i) => "<li><span>Year " + b.y + " <small>· " + b.n + " files</small></span><button type=\"button\" class=\"req\" data-box=\"" + i + "\"" + (b.asked ? " disabled>Requested ✓" : ">Request box") + "</button></li>").join("") + "</ul>" }
  ];
  function unpaid() { return invoices.filter((v) => !v.paid).reduce((s, v) => s + v.amt, 0); }

  // ---------- Build folders ----------
  const stack = $("#stack");
  const CLIP = '<svg class="clip" viewBox="0 0 22 58" aria-hidden="true"><path d="M7 50V12a4 4 0 0 1 8 0v34a7 7 0 0 1-14 0V8a10 10 0 0 1 20 0v40" fill="none" stroke="#9aa6b2" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const STAMPER = '<svg class="stamper" viewBox="0 0 70 96" aria-hidden="true"><ellipse cx="35" cy="14" rx="14" ry="12" fill="#6b3a24"/><rect x="29" y="22" width="12" height="40" rx="5" fill="#8a4c2f"/><rect x="10" y="60" width="50" height="16" rx="4" fill="#3b3f47"/><rect x="8" y="76" width="54" height="10" rx="2" fill="var(--stamp)"/></svg>';
  const els = FOLDERS.map((f, k) => {
    const el = document.createElement("div");
    el.className = "folder";
    el.style.setProperty("--x", (1.5 + k * 19.6) + "%");
    el.style.setProperty("--tc", f.tc);
    el.innerHTML =
      '<div class="leaf"><button class="tab" type="button" aria-label="' + f.name + ' folder"><i class="sticker" aria-hidden="true"></i><span>' + f.name + "</span></button>" +
      '<div class="body"><span class="closed-label" aria-hidden="true">' + f.name + " · 2025</span>" +
      '<div class="paper"><div class="doc" tabindex="-1"></div><div class="imprint" aria-hidden="true"></div></div>' + CLIP +
      '<div class="flap" aria-hidden="true"></div>' + STAMPER + "</div></div>";
    stack.appendChild(el);
    f.el = el; f.tab = el.querySelector(".tab"); f.docEl = el.querySelector(".doc");
    return el;
  });
  let order = FOLDERS.map((_, k) => k); // order[0] is the front folder
  function layout(skip) {
    order.forEach((k, d) => {
      const el = els[k];
      if (k === skip) return;
      el.style.setProperty("--d", d);
      el.style.zIndex = String(100 - d);
    });
  }

  // ---------- Animation helpers ----------
  function play(el, frames, opts) {
    if (reduce) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const today = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short" }).toUpperCase();

  function inkSplash(paper) {
    if (reduce) return;
    const imp = paper.querySelector(".imprint"), pr = paper.getBoundingClientRect(), ir = imp.getBoundingClientRect();
    const cx = ir.left - pr.left + ir.width / 2, cy = ir.top - pr.top + ir.height / 2;
    for (let i = 0; i < 10; i++) {
      const d = document.createElement("i");
      d.className = "ink";
      d.style.left = cx + "px"; d.style.top = cy + "px";
      paper.appendChild(d);
      const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 26;
      d.animate([{ transform: "translate(-50%,-50%) scale(1)", opacity: .9 }, { transform: "translate(" + (Math.cos(a) * v) + "px," + (Math.sin(a) * v * .6) + "px) scale(.3)", opacity: 0 }], { duration: 520 + Math.random() * 200, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => d.remove();
    }
  }
  // The rubber stamp drops, thumps and lifts, leaving the date in red
  async function stampIt(f) {
    const body = f.el.querySelector(".body"), stamper = body.querySelector(".stamper"), imp = body.querySelector(".imprint");
    imp.innerHTML = "OPENED<small>" + today + "</small>";
    if (reduce) { imp.style.opacity = ".85"; return; }
    imp.style.opacity = "0";
    await play(stamper, [
      { transform: "translate(10px,-40px) rotate(8deg)", opacity: 0 },
      { transform: "translate(0,-26px) rotate(-3deg)", opacity: 1, offset: .45 },
      { transform: "translate(0,58px) scale(1,.92)", opacity: 1, offset: .62 },
      { transform: "translate(0,58px) scale(1,.96)", opacity: 1, offset: .72 },
      { transform: "translate(6px,-50px) rotate(6deg)", opacity: 0 }
    ], { duration: 980, easing: "cubic-bezier(.4,0,.3,1)" }).then(() => {});
    imp.style.opacity = ".85";
  }
  // fire the imprint at the moment of impact
  function stampWithImpact(f) {
    const body = f.el.querySelector(".body"), imp = body.querySelector(".imprint"), paper = body.querySelector(".paper");
    stampIt(f);
    if (reduce) return;
    setTimeout(() => {
      imp.style.opacity = ".85";
      imp.animate([{ transform: "rotate(-9deg) scale(1.25)", opacity: 0 }, { transform: "rotate(-9deg) scale(1)", opacity: .9 }], { duration: 220, easing: "cubic-bezier(.2,.9,.3,1.3)" });
      inkSplash(paper);
      play(f.el.querySelector(".leaf"), [{ transform: "none" }, { transform: "translateY(3px) scaleY(.99)" }, { transform: "none" }], { duration: 240 });
    }, 600);
  }
  function fill(f, animate) {
    f.docEl.innerHTML = f.doc();
    if (!animate || reduce) return;
    [...f.docEl.querySelectorAll("h2, .sub, li, .sum")].forEach((el, i) => el.animate(
      [{ transform: "translateX(-10px)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 420, delay: 140 + i * 60, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }
    ));
    play(f.el.querySelector(".clip"), [{ transform: "rotate(-28deg) translateY(-10px)" }, { transform: "rotate(6deg)", offset: .6 }, { transform: "none" }], { duration: 560, delay: 60, easing: "cubic-bezier(.3,.8,.4,1)" });
  }
  function markFront() {
    els.forEach((el, k) => {
      const front = order[0] === k;
      el.classList.toggle("front", front);
      if (front) FOLDERS[k].tab.setAttribute("aria-current", "page"); else FOLDERS[k].tab.removeAttribute("aria-current");
      el.querySelector(".paper").inert = !front;
    });
  }

  // ---------- Bring a folder to the front ----------
  let busy = false, queued = -1;
  async function pick(k) {
    const d = order.indexOf(k);
    if (busy) { queued = k; return; }
    if (d === 0) {
      play(els[k].querySelector(".leaf"), [{ transform: "none" }, { transform: "translateY(-8px) rotate(-.6deg)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.34,1.56,.64,1)" });
      return;
    }
    busy = true;
    const f = FOLDERS[k], el = els[k];
    say("Opening " + f.name);
    order = [k].concat(order.filter((x) => x !== k));

    if (reduce) { layout(); markFront(); fill(f, false); stampIt(f); busy = false; return; }

    // 1) anticipation: the tab perks up and the folders in front part a little
    const parted = order.slice(1, d + 1).map((j) => els[j].querySelector(".leaf"));
    parted.forEach((leaf, i) => play(leaf, [{ transform: "none" }, { transform: "perspective(900px) rotateX(-7deg)", offset: .5 }, { transform: "none" }], { duration: 760, delay: i * 40, easing: "ease-in-out" }));
    await play(f.tab, [{ transform: "none" }, { transform: "translateY(-9px)" }], { duration: 170, easing: "ease-out" });
    els[order[1]].classList.remove("front");

    // 2) lift it out of the stack, carry it over the top and set it down in front;
    //    the others slide back one step each, a beat apart
    const from = "translateY(" + (-26 * d) + "px) scale(" + (1 - d * .026) + ")";
    el.style.transition = "none";
    const lift = play(el, [
      { transform: from },
      { transform: "translateY(" + (-26 * d - 104) + "px) scale(1.015) rotate(-1.4deg)", offset: .42 },
      { transform: "translateY(10px) scale(1.004) rotate(.3deg)", offset: .8 },
      { transform: "translateY(0) scale(1)" }
    ], { duration: 940, easing: "cubic-bezier(.45,.1,.3,1)" });
    setTimeout(() => { el.style.zIndex = "200"; }, 390);
    order.slice(1).forEach((j, i) => { els[j].style.setProperty("--delay", (300 + i * 60) + "ms"); });
    layout(k);
    el.style.setProperty("--d", 0);
    await lift;
    el.style.transition = "";
    layout();
    els.forEach((x) => x.style.setProperty("--delay", "0ms"));

    // 3) land: the paper slides up, the clip snaps on, the stamp comes down
    markFront();
    fill(f, true);
    stampWithImpact(f);
    await sleep(900);
    busy = false;
    if (queued >= 0) { const q = queued; queued = -1; pick(q); }
  }

  // ---------- Clicks, keys and the forms on the papers ----------
  FOLDERS.forEach((f, k) => {
    f.tab.addEventListener("click", () => pick(k));
    f.tab.addEventListener("keydown", (e) => {
      let to = -1;
      if (e.key === "ArrowRight") to = (k + 1) % FOLDERS.length;
      if (e.key === "ArrowLeft") to = (k - 1 + FOLDERS.length) % FOLDERS.length;
      if (e.key === "Home") to = 0;
      if (e.key === "End") to = FOLDERS.length - 1;
      if (to < 0) return;
      e.preventDefault(); FOLDERS[to].tab.focus();
    });
  });
  stack.addEventListener("click", (e) => {
    const pay = e.target.closest("[data-inv]"), box = e.target.closest("[data-box]");
    if (pay) {
      const v = invoices[Number(pay.dataset.inv)];
      v.paid = !v.paid;
      pay.setAttribute("aria-pressed", String(v.paid));
      const u = $("#unpaid"); u.textContent = pkr(unpaid());
      u.classList.remove("pop"); void u.offsetWidth; u.classList.add("pop");
      say(v.no + (v.paid ? " marked paid" : " marked unpaid") + ". Still unpaid " + pkr(unpaid()));
    }
    if (box) {
      const b = boxes[Number(box.dataset.box)];
      b.asked = true; box.disabled = true; box.textContent = "Requested ✓";
      say("Box " + b.y + " requested");
    }
  });

  // Search: a matching tab bobs; Enter opens it
  const q = $("#q"), find = $("#find");
  let match = -1;
  function findMatch(text) {
    const t = text.trim().toLowerCase();
    if (!t) return -1;
    return FOLDERS.findIndex((f) => f.name.toLowerCase().startsWith(t) || f.words.split(" ").some((w) => w.startsWith(t)));
  }
  q.addEventListener("input", () => {
    match = findMatch(q.value);
    FOLDERS.forEach((f, k) => f.tab.classList.toggle("match", k === match));
    find.classList.toggle("hit", match >= 0);
    if (q.value.trim()) say(match >= 0 ? FOLDERS[match].name + " folder matches, press Enter" : "No folder matches");
  });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && match >= 0) {
      e.preventDefault();
      pick(match);
      FOLDERS[match].tab.classList.remove("match");
      find.classList.remove("hit");
    }
    if (e.key === "Escape") { q.value = ""; q.dispatchEvent(new Event("input")); }
  });

  // ---------- Start: folders drop into the stack one by one ----------
  layout();
  markFront();
  fill(FOLDERS[0], false);
  if (reduce) stampIt(FOLDERS[0]); else setTimeout(() => stampWithImpact(FOLDERS[0]), 1080);
  if (!reduce) {
    els.slice().reverse().forEach((el, i) => el.querySelector(".leaf").animate(
      [{ transform: "translateY(-60px)", opacity: 0 }, { opacity: 1, offset: .35 }, { transform: "none", opacity: 1 }],
      { duration: 640, delay: 80 + i * 90, easing: "cubic-bezier(.34,1.4,.64,1)", fill: "backwards" }
    ));
  }

  // ---------- Auto demo: type a search, then flip through folders ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  async function typeDemo(word) {
    for (const ch of word) { if (!demo) return; q.value += ch; q.dispatchEvent(new Event("input")); await sleep(120); }
    await sleep(500);
    if (!demo) return;
    if (match >= 0) { const m = match; FOLDERS[m].tab.classList.remove("match"); find.classList.remove("hit"); await pick(m); }
    await sleep(300);
    q.value = ""; q.dispatchEvent(new Event("input"));
  }
  (async () => {
    await sleep(2700);
    const tour = [2, 1, 4, 3, 0];
    let k = 0;
    while (demo) {
      if (k % 3 === 1) await typeDemo("sal");
      else await pick(tour[k % tour.length]);
      k++;
      await sleep(2300);
    }
    if (q.value && !document.activeElement.isSameNode(q)) { q.value = ""; q.dispatchEvent(new Event("input")); }
  })();
})();
</script>
</body>
</html>
