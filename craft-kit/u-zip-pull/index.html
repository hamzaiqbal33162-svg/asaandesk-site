<!doctype html>
<!-- Chill & Craft · Zip Pull · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zip Pull · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --bg1: #fbf4e7;
    --bg2: #e2d2b6;
    --denim1: #2f5488;
    --denim2: #1c355a;
    --tape: #14243d;
    --thread: #f4b942;
    --ink: #fbf3e2;
    --ink-soft: #c5d3e8;
    --note: #6e5a3c;
    --patch1: #b9733b;
    --patch2: #8a4f22;
    --paper: #fffdf8;
    --focus: #e8553a;
    --shadow: rgba(28, 53, 90, .55);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #1b2335;
      --bg2: #070a12;
      --denim1: #3561a0;
      --denim2: #1b3359;
      --tape: #0c1628;
      --ink-soft: #b7c7e2;
      --note: #a8b3c7;
      --paper: #f4efe4;
      --focus: #ffb37a;
      --shadow: rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1b2335;
    --bg2: #070a12;
    --denim1: #3561a0;
    --denim2: #1b3359;
    --tape: #0c1628;
    --ink-soft: #b7c7e2;
    --note: #a8b3c7;
    --paper: #f4efe4;
    --focus: #ffb37a;
    --shadow: rgba(0, 0, 0, .7);
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body, .stage { grid-template-columns: minmax(0, 1fr); } /* fixed-width cards never widen the page */
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2) 85%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* soft dotted canvas texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(120, 90, 50, .14) 1px, transparent 1.3px);
    background-size: 18px 18px;
    mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent);
  }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 96px 16px 32px; width: 100%; }
  .scene { position: relative; width: 372px; max-width: 100%; }

  /* ---------- The paper that comes out of the zip at the end ---------- */
  .sheet {
    position: absolute;
    left: 50%;
    top: -6px;
    width: 92px;
    height: 112px;
    margin-left: -46px;
    border-radius: 8px;
    background: var(--paper);
    box-shadow: 0 14px 28px -14px rgba(0, 0, 0, .55);
    transform: translateY(20px) scale(.6);
    opacity: 0;
    z-index: 0;
  }
  .sheet::before { /* folded corner */
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 22px;
    height: 22px;
    border-radius: 0 8px 0 6px;
    background: linear-gradient(225deg, var(--bg2) 50%, #e9dfcd 50%);
  }
  .sheet i { position: absolute; left: 14px; height: 5px; border-radius: 3px; background: #d9d2c4; }
  .sheet i:nth-child(1) { top: 18px; width: 38px; background: #e8553a; }
  .sheet i:nth-child(2) { top: 34px; width: 62px; }
  .sheet i:nth-child(3) { top: 46px; width: 54px; }
  .sheet i:nth-child(4) { top: 58px; width: 64px; }
  .sheet i:nth-child(5) { top: 70px; width: 40px; }
  .sheet b { /* tick badge */
    position: absolute;
    right: -12px;
    bottom: -10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #22a06b;
    box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .6), 0 0 0 3px var(--paper);
    transform: scale(0);
  }
  .sheet b svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- The pouch button ---------- */
  .pouch {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    padding: 0 0 16px;
    border: 0;
    border-radius: 26px;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    background:
      repeating-linear-gradient(115deg, rgba(255, 255, 255, .07) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(25deg, rgba(0, 0, 0, .08) 0 1px, transparent 1px 4px),
      linear-gradient(170deg, var(--denim1), var(--denim2));
    box-shadow: 0 26px 40px -24px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -6px 14px rgba(0, 0, 0, .25);
    transition: transform .5s var(--spring), box-shadow .3s;
    -webkit-tap-highlight-color: transparent;
  }
  /* stitched seam all round */
  .pouch::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px dashed var(--thread);
    border-radius: 20px;
    opacity: .75;
    pointer-events: none;
  }
  .pouch:hover { transform: translateY(-3px); box-shadow: 0 32px 44px -24px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -6px 14px rgba(0, 0, 0, .25); }
  .pouch:active { transform: scale(.975); transition-duration: .12s; }
  .pouch:focus-visible { outline: 3px solid var(--focus); outline-offset: 5px; }

  .zip { display: block; padding: 10px 14px 0; }
  .zip svg { display: block; width: 100%; height: auto; overflow: visible; }

  .body { position: relative; display: flex; align-items: center; gap: 14px; padding: 4px 24px 0; }
  /* stitched leather patch with the file type */
  .patch {
    flex: none;
    width: 50px;
    height: 50px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, var(--patch1), var(--patch2));
    box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .12), inset 0 0 0 4.5px rgba(255, 220, 170, .5), 0 8px 14px -8px rgba(0, 0, 0, .6);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    color: #fff1dc;
  }
  .patch svg { width: 24px; height: 24px; fill: none; stroke: #fff1dc; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .patch .tick { display: none; }
  .pouch[data-state="done"] .patch { background: linear-gradient(160deg, #2bb37a, #178a59); }
  .pouch[data-state="done"] .patch .arrow { display: none; }
  .pouch[data-state="done"] .patch .tick { display: inline; }
  .words { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .title { font-size: 18px; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct {
    position: absolute;
    right: 24px;
    top: 50%;
    margin-top: -9px;
    min-width: 50px;
    font-size: 15px;
    font-weight: 800;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--thread);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .3s, transform .45s var(--spring);
  }
  .pouch[data-state="working"] .pct { opacity: 1; transform: none; }
  .pouch[data-state="working"] .words { padding-right: 58px; }

  .fx { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 2; }
  .spark { position: absolute; width: 8px; height: 8px; border-radius: 2px; }

  .hint { margin: 0; max-width: 360px; font-size: 13.5px; line-height: 1.5; text-align: center; color: var(--note); }
  .hint kbd { font: inherit; font-weight: 700; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="scene">
    <div class="sheet" id="sheet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i>
      <b><svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.8 3.8 7.2-8" /></svg></b>
    </div>

    <button class="pouch" id="pouch" type="button" data-state="idle" aria-describedby="hint">
      <span class="zip" aria-hidden="true">
        <svg viewBox="0 0 312 44" id="zipSvg">
          <defs>
            <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbe7a6" />
              <stop offset=".45" stop-color="#d9a640" />
              <stop offset="1" stop-color="#8a5f17" />
            </linearGradient>
            <linearGradient id="lining" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd08a" />
              <stop offset=".5" stop-color="#ff8a4c" />
              <stop offset="1" stop-color="#d9452b" />
            </linearGradient>
          </defs>
          <!-- zip tape -->
          <rect x="14" y="9" width="290" height="26" rx="6" fill="var(--tape)" opacity=".85" />
          <!-- the open gap, drawn each frame -->
          <path id="slit" fill="url(#lining)" d="" />
          <path id="glow" fill="#fff6d9" opacity=".55" d="" />
          <g id="teeth"></g>
          <!-- slider and pull tab -->
          <g id="slider">
            <path d="M-13 -10.5 H8 Q14 -10.5 14 -4 V4 Q14 10.5 8 10.5 H-13 Q-17 10.5 -17 5 V-5 Q-17 -10.5 -13 -10.5Z" fill="url(#brass)" stroke="#6d4a10" stroke-width="1" />
            <path d="M-12 -7 H6" stroke="#fff4c9" stroke-width="1.6" stroke-linecap="round" opacity=".8" />
            <g id="tab">
              <rect x="1" y="-6.5" width="34" height="13" rx="6.5" fill="url(#brass)" stroke="#6d4a10" stroke-width="1" />
              <circle cx="28" cy="0" r="3" fill="var(--tape)" />
              <path d="M6 -3 H20" stroke="#fff4c9" stroke-width="1.4" stroke-linecap="round" opacity=".8" />
            </g>
            <circle r="4.2" fill="#b98522" stroke="#6d4a10" stroke-width="1" />
          </g>
        </svg>
      </span>
      <span class="body">
        <span class="patch" aria-hidden="true">
          <svg viewBox="0 0 24 24"><g class="arrow"><path d="M12 4v11M7 10.5l5 5 5-5" /><path d="M5 19.5h14" /></g><path class="tick" d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        </span>
        <span class="words">
          <span class="title" id="title">Download lookbook</span>
          <span class="meta" id="meta">Winter-Lawn-26.pdf · 6.4 MB</span>
        </span>
        <span class="pct" id="pct" aria-hidden="true">0%</span>
      </span>
    </button>
    <span class="fx" id="fx" aria-hidden="true"></span>
  </div>

  <p class="hint" id="hint">Press to pull the zip and download. Press again while it runs to stop. Works with <kbd>Enter</kbd> and <kbd>Space</kbd>.</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Zip Pull download button ----------
  const $ = (s) => document.querySelector(s);
  const pouch = $("#pouch"), titleEl = $("#title"), metaEl = $("#meta"), pctEl = $("#pct");
  const statusEl = $("#status"), sheet = $("#sheet"), fx = $("#fx");
  const slit = $("#slit"), glow = $("#glow"), slider = $("#slider"), tab = $("#tab"), teethG = $("#teeth");

  const FILE = { name: "Winter-Lawn-26.pdf", size: 6.4 };      // MB
  const TY = 22, X0 = 44, X1 = 272;                               // zip line y, slider start / end x
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;

  // ---------- Run control: each sequence has an id; a newer run cancels the older one ----------
  const STOP = new Error("stopped");
  let runId = 0;
  let state = "idle";            // idle | working | done | resetting
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === runId ? res() : rej(STOP)), ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));

  // ---------- Build the brass teeth ----------
  const NS = "http://www.w3.org/2000/svg";
  const teeth = [];
  for (let i = 0; i < 32; i++) {
    const x = 34 + i * 8.4;
    const up = document.createElementNS(NS, "rect");
    up.setAttribute("x", "-2.7"); up.setAttribute("y", "-7.5"); up.setAttribute("width", "5.4"); up.setAttribute("height", "8.5"); up.setAttribute("rx", "1.3");
    up.setAttribute("fill", "url(#brass)");
    const dn = up.cloneNode();
    dn.setAttribute("y", "-1");
    teethG.append(up, dn);
    teeth.push({ x, up, dn, last: -1 });
  }

  // How far the two rows have parted at x, for a slider at sx (a soft V behind the slider)
  const gap = (x, sx) => Math.max(0, Math.min(8.5, (sx - 16 - x) * .2));

  // ---------- Physics: the slider glides to its target, the tab swings on a spring ----------
  const sim = { sx: X0, target: X0, ease: 7, ang: 160, vel: 0, angTarget: 160, lastSx: -1 };
  let lastT = performance.now();

  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    const prev = sim.sx;
    sim.sx += (sim.target - sim.sx) * Math.min(1, dt * sim.ease);
    const v = (sim.sx - prev) / Math.max(dt, .001);

    // tab: points along the pull while working, rests folded to the left and sways when idle
    let target = sim.angTarget;
    if (state === "working") target = Math.max(-22, Math.min(22, -v * .05));
    else if (state === "idle" && !calm()) target += Math.sin(now / 620) * 7;
    if (calm()) { sim.ang = target; sim.vel = 0; }
    else {
      const a = 150 * (target - sim.ang) - 11 * sim.vel;
      sim.vel += a * dt;
      sim.ang += sim.vel * dt;
    }
    slider.setAttribute("transform", `translate(${sim.sx.toFixed(2)} ${TY})`);
    tab.setAttribute("transform", `rotate(${sim.ang.toFixed(2)})`);

    // teeth and the open gap only change when the slider moves
    if (Math.abs(sim.sx - sim.lastSx) > .02) {
      sim.lastSx = sim.sx;
      teeth.forEach((t) => {
        const d = gap(t.x, sim.sx);
        if (Math.abs(d - t.last) < .01) return;
        t.last = d;
        t.up.setAttribute("transform", `translate(${t.x} ${TY - d * 1.05}) rotate(${(-d * 2.2).toFixed(2)})`);
        t.dn.setAttribute("transform", `translate(${t.x + 4.2} ${TY + d * 1.05}) rotate(${(d * 2.2).toFixed(2)})`);
      });
      let top = "", bot = "", gtop = "", gbot = "";
      for (let x = 26; x <= sim.sx - 10; x += 4) {
        const d = gap(x, sim.sx);
        top += `${top ? "L" : "M"}${x} ${(TY - d * 1.15).toFixed(2)}`;
        bot = `L${x} ${(TY + d * 1.15).toFixed(2)}` + bot;
        gtop += `${gtop ? "L" : "M"}${x} ${(TY - d * .45).toFixed(2)}`;
        gbot = `L${x} ${(TY + d * .45).toFixed(2)}` + gbot;
      }
      slit.setAttribute("d", top ? top + bot + "Z" : "");
      glow.setAttribute("d", gtop ? gtop + gbot + "Z" : "");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Text helpers ----------
  async function swap(el, text) {
    if (el.dataset.to === text || (!el.dataset.to && el.textContent === text)) return;   // already showing, or on its way
    el.dataset.to = text;
    await play(el, [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-9px)", opacity: 0 }], { duration: 130, easing: "ease-in" });
    if (el.dataset.to !== text) return;            // a newer label won
    el.textContent = text;
    play(el, [{ transform: "translateY(9px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 420, easing: SPRING });
  }
  const setState = (s) => { state = s; pouch.dataset.state = s; };

  // Brass sparks burst out of the open zip
  function sparks(n) {
    if (calm()) return;
    const colors = ["#f8d77a", "#ffb35c", "#fff2c4", "#e8553a", "#7fb2ff"];
    const box = $("#zipSvg").getBoundingClientRect(), scene = $(".scene").getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.background = colors[i % colors.length];
      s.style.left = (box.left - scene.left + box.width * (.25 + Math.random() * .5)) + "px";
      s.style.top = (box.top - scene.top + box.height * .5) + "px";
      fx.appendChild(s);
      const ang = -Math.PI * (.12 + .76 * (i / (n - 1))) + (Math.random() - .5) * .3;
      const dist = 70 + Math.random() * 70;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      s.animate([
        { transform: "translate(-50%,-50%) scale(.4) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx * .7}px, ${dy * .9}px) scale(1) rotate(${200 + i * 30}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${dx}px, ${dy * .6 + 60}px) scale(.5) rotate(${380 + i * 30}deg)`, opacity: 0 }
      ], { duration: 1000 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- The download sequence ----------
  async function download(id) {
    // 1. Anticipation: the pouch squashes, the slider backs up a hair and the tab flips over
    setState("working");
    sim.angTarget = 0;
    sim.ease = 7;
    sim.target = X0 - 6;
    play(pouch, [{ transform: "scale(1)" }, { transform: "scale(1.03,.94)" }, { transform: "scale(.99,1.02)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
    swap(titleEl, "Unzipping…");
    pctEl.textContent = "0%";
    statusEl.textContent = "Downloading " + FILE.name + ".";
    await sleep(380, id);

    // 2. The pull: progress drives the slider; the zip opens behind it
    let p = 0;
    sim.ease = 6;
    while (p < 100) {
      p = Math.min(100, p + 2.2 + Math.random() * 3.6);
      sim.target = X0 + (X1 - X0) * p / 100;
      pctEl.textContent = Math.round(p) + "%";
      metaEl.textContent = (FILE.size * p / 100).toFixed(1) + " of " + FILE.size + " MB · " + (2.4 + Math.random()).toFixed(1) + " MB/s";
      if (p > 8) swap(titleEl, "Downloading…");
      await sleep(95, id);
    }
    await sleep(380, id);

    // 3. Finish: the file pops out of the open zip with sparks and a tick
    setState("done");
    swap(titleEl, "Saved to Downloads");
    metaEl.textContent = FILE.name + " · " + FILE.size + " MB";
    statusEl.textContent = "Download complete. " + FILE.name + " saved.";
    sheet.style.opacity = 1;
    sparks(16);
    const out = calm()
      ? (sheet.style.transform = "translateY(-92px) rotate(-6deg)", Promise.resolve())
      : sheet.animate([
        { transform: "translateY(20px) scale(.6) rotate(0deg)" },
        { transform: "translateY(-112px) scale(1.04) rotate(-9deg)", offset: .55 },
        { transform: "translateY(-88px) scale(1) rotate(-5deg)", offset: .8 },
        { transform: "translateY(-92px) scale(1) rotate(-6deg)" }
      ], { duration: 900, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" }).finished.catch(() => {});
    play(pouch, [{ transform: "scale(1)" }, { transform: "scale(1.04,.95)" }, { transform: "scale(1)" }], { duration: 520, easing: SPRING });
    await out;
    play(sheet.querySelector("b"), [{ transform: "scale(0) rotate(-40deg)" }, { transform: "scale(1) rotate(0)" }], { duration: 520, easing: SPRING, fill: "forwards" });
    if (calm()) sheet.querySelector("b").style.transform = "scale(1)";
    await sleep(2100, id);

    // 4. Reset: the file slides home and the zip closes again
    await zipBack(id, "Download lookbook");
  }

  async function zipBack(id, label) {
    setState("resetting");
    sheet.getAnimations().forEach((a) => a.cancel());
    sheet.querySelector("b").getAnimations().forEach((a) => a.cancel());
    sheet.querySelector("b").style.transform = "";
    if (sheet.style.opacity === "1") {
      await play(sheet, [{ transform: "translateY(-92px) rotate(-6deg)", opacity: 1 }, { transform: "translateY(-104px) rotate(-2deg)", opacity: 1, offset: .3 }, { transform: "translateY(20px) scale(.6)", opacity: 1 }], { duration: 560, easing: "cubic-bezier(.5,0,.6,1)" });
    }
    sheet.style.opacity = 0;
    sheet.style.transform = "";
    sim.ease = 5;
    sim.target = X0;
    sim.angTarget = 160;
    swap(titleEl, label);
    metaEl.textContent = FILE.name + " · " + FILE.size + " MB";
    await sleep(calm() ? 100 : 900, id);
    setState("idle");
  }

  // Put everything back at once (used when a run is cancelled)
  function hardReset() {
    sheet.getAnimations().forEach((a) => a.cancel());
    sheet.style.opacity = 0;
    sheet.style.transform = "";
    sheet.querySelector("b").style.transform = "";
    sim.target = X0;
    sim.ease = 5;
    sim.angTarget = 160;
    titleEl.textContent = titleEl.dataset.to = "Download lookbook";
    metaEl.textContent = FILE.name + " · " + FILE.size + " MB";
    setState("idle");
  }

  async function start(fromUser) {
    const id = ++runId;
    try {
      await download(id);
      if (!fromUser) scheduleDemo(2600);
    } catch (e) {
      if (e !== STOP) throw e;
    }
  }

  // Click: start, or stop a running download
  pouch.addEventListener("click", async () => {
    if (state === "working") {
      const id = ++runId;
      statusEl.textContent = "Download stopped.";
      try { await zipBack(id, "Download lookbook"); } catch (e) { if (e !== STOP) throw e; }
      return;
    }
    if (state === "idle") start(true);
  });

  // ---------- Auto demo: plays on load and every few seconds, until the visitor takes over ----------
  let demoOn = true, demoTimer = 0;
  function scheduleDemo(ms) {
    clearTimeout(demoTimer);
    if (demoOn) demoTimer = setTimeout(() => { if (demoOn && state === "idle") start(false); else scheduleDemo(1500); }, ms);
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    if (state !== "idle") { runId++; hardReset(); }
  }
  ["pointerdown", "keydown"].forEach((t) => addEventListener(t, takeOver, true));
  scheduleDemo(450);
</script>
</body>
</html>
