<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebloom · Support desk</title>
<meta name="description" content="A customer support dashboard with a drag-and-drop case board, live SLA timers, case conversations, customers, team, knowledge base and reports.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "casebloom:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: soft clay by day, deep teal-charcoal by night
   ========================================================= */
:root {
  color-scheme: light;
  --font: "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 18px; --r-sm: 12px;
  --bg: #ece6dc; --surface: #f4efe7; --surface2: #e7e0d5; --ink: #22302e; --muted: #6a7572; --line: rgba(35, 48, 46, .1);
  --accent: #0e8a80; --accent-ink: #fff; --focus: #0e8a80; --peach: #ee8455; --ok: #2c8a55; --warn: #c48510; --bad: #cf4f3a; --info: #3a78d0;
  --c1: #0e8a80; --c2: #ee8455; --c3: #6a7fd6; --c4: #d1a62e; --c5: #9aa39f;
  --raise: 6px 6px 14px rgba(160, 140, 112, .36), -6px -6px 14px rgba(255, 255, 255, .88);
  --raise-sm: 3px 3px 8px rgba(160, 140, 112, .34), -3px -3px 8px rgba(255, 255, 255, .85);
  --well: inset 3px 3px 8px rgba(160, 140, 112, .32), inset -3px -3px 8px rgba(255, 255, 255, .78);
  --tip-bg: #22302e; --note: #fff4cf; --note-ink: #5a4a10;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #192023; --surface: #1e2629; --surface2: #172022; --ink: #e2ebe8; --muted: #91a09b; --line: rgba(255, 255, 255, .07);
  --accent: #3cc2b4; --accent-ink: #062523; --focus: #3cc2b4; --peach: #f39a72; --ok: #4fca86; --warn: #e9b04a; --bad: #ef7a64; --info: #6ea2f0;
  --c1: #3cc2b4; --c2: #f39a72; --c3: #8a9cf0; --c4: #e9c45a; --c5: #6f7d79;
  --raise: 6px 6px 14px rgba(0, 0, 0, .5), -5px -5px 12px rgba(255, 255, 255, .035);
  --raise-sm: 3px 3px 8px rgba(0, 0, 0, .45), -3px -3px 8px rgba(255, 255, 255, .03);
  --well: inset 3px 3px 8px rgba(0, 0, 0, .5), inset -3px -3px 8px rgba(255, 255, 255, .03);
  --note: #3b3518; --note-ink: #f2e3a6;
}
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.gauge { position: relative; margin: 0 auto; width: 100%; }

.g-bg { stroke: color-mix(in srgb, var(--ink) 9%, transparent); }

@keyframes gsweep { from { stroke-dasharray: 0 1; } }
.g-num { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; display: grid; }

.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 8px; }
.fn-bar { width: var(--w); min-width: fit-content; display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm, 8px); color: #fff; font-size: 12.5px; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; overflow: hidden; white-space: nowrap; }
.fn-row em { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; }

/* drag board */
.kboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.kcol { display: flex; flex-direction: column; min-height: 220px; border-radius: var(--r, 12px); }

.klist.kover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.kcard { position: relative; padding: 11px 12px; padding-right: 36px; border-radius: var(--r-sm, 10px); background: var(--surface); border: 1px solid var(--line); cursor: grab; user-select: none; transition: transform .15s, box-shadow .2s; }
@media (pointer: fine) { .kcard { touch-action: none; } }
.kcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }

/* page entrance (each app restyles @keyframes rise) */

@media (prefers-reduced-motion: reduce) {

}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .drawer { border-radius: 0; } }

/* =========================================================
   2. Shell: a slim icon rail and a calm header
   ========================================================= */
.skip { position: absolute; left: -999px; top: 8px; z-index: 200; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 10px; }
.skip:focus { left: 8px; }
.shell { display: grid; grid-template-columns: 92px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; overflow-y: auto; scrollbar-width: none; }

.nav { position: relative; display: grid; gap: 6px; width: 100%; }
.nav a { position: relative; z-index: 1; display: grid; justify-items: center; gap: 3px; padding: 9px 2px 7px; border-radius: 14px; text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 650; transition: color .2s, box-shadow .25s; }

.nav-n { position: absolute; top: 4px; right: 10px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--peach); color: #fff; font-size: 10px; line-height: 17px; font-weight: 800; }
.nav-n:empty { display: none; }
.nav-marker { position: absolute; left: -10px; top: 0; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); transition: transform .45s cubic-bezier(.3, 1.3, .4, 1), height .3s; pointer-events: none; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; justify-items: center; padding-top: 10px; }
.main { min-width: 0; padding: 18px 26px 50px 8px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.menu-btn { display: none; }
.search { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 440px; height: 42px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--surface); box-shadow: var(--well); color: var(--muted); text-align: left; }
.search span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 11px var(--mono); color: var(--muted); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icon-btn { border-radius: 14px; box-shadow: var(--raise-sm); background: var(--surface); }
.icon-btn:hover { background: var(--surface); }
.icon-btn:active { box-shadow: var(--well); }
.status-sw { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 99px; box-shadow: var(--raise-sm); background: var(--surface); font-size: 12.5px; font-weight: 650; border: 0; }
.status-sw i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.status-sw.away i { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
.t-ic .i-sun { display: none; } [data-theme="dark"] .t-ic .i-sun { display: block; } [data-theme="dark"] .t-ic .i-moon { display: none; }
.nav-scrim { display: none; }
.view { outline: none; }

/* =========================================================
   3. Neumorphic cards, buttons and fields
   ========================================================= */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }

.btn { border: 0; background: var(--surface); box-shadow: var(--raise-sm); border-radius: 14px; min-height: 40px; }
.btn:hover { color: var(--accent); }
.btn:active { box-shadow: var(--well); transform: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 4px 4px 12px color-mix(in srgb, var(--accent) 45%, transparent), -3px -3px 8px rgba(255, 255, 255, .5); }
[data-theme="dark"] .btn.primary { box-shadow: 4px 4px 12px rgba(0, 0, 0, .5); }
.btn.primary:hover { color: var(--accent-ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.ghost { box-shadow: none; background: transparent; }
.btn.danger.ghost { box-shadow: none; color: var(--bad); border: 0; }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { border: 0; background: var(--surface); box-shadow: var(--well); border-radius: 12px; }
.tbl-search { border: 0; box-shadow: var(--well); border-radius: 99px; background: var(--surface); }
.chip { border: 0; box-shadow: var(--raise-sm); background: var(--surface); }
.chip[aria-pressed="true"] { box-shadow: var(--well); background: var(--surface); color: var(--accent); }
.seg { box-shadow: var(--well); background: var(--surface); border-radius: 14px; }
.seg-thumb { box-shadow: var(--raise-sm); background: var(--surface); border-radius: 11px; }
.seg button[aria-pressed="true"] { color: var(--accent); }
.layer { background: var(--surface); border: 0; }
.pop { background: var(--surface); border: 0; box-shadow: var(--raise), 0 20px 40px rgba(0, 0, 0, .15); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--raise); min-width: 0; transition: transform .25s, box-shadow .25s; }
.card:hover { transform: translateY(-2px); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { font-size: 15px; font-weight: 750; }
.kpi { position: relative; background: var(--surface); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--raise); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; transition: transform .25s; }
.kpi:hover { transform: translateY(-3px); }
.kpi span { color: var(--muted); font-size: 13px; font-weight: 600; grid-column: 1; }
.kpi b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; grid-column: 1; }
.kpi .k-dial { grid-column: 2; grid-row: 1 / span 3; width: 58px; height: 58px; border-radius: 50%; box-shadow: var(--well); display: grid; place-items: center; color: var(--kc); }
.kpi small { grid-column: 1; font-size: 12px; color: var(--muted); }
.kpi small.up { color: var(--ok); } .kpi small.down { color: var(--bad); }
@keyframes rise { from { opacity: 0; transform: scale(.96) translateY(10px); } }
.pill { background: transparent; box-shadow: var(--raise-sm); }
.av { box-shadow: var(--raise-sm); }

/* priority, channel and SLA ring */
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--pc); }
.prio::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--pc); }
.p-Urgent { --pc: var(--bad); } .p-High { --pc: var(--peach); } .p-Normal { --pc: var(--info); } .p-Low { --pc: var(--c5); }
.chan { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; color: var(--muted); box-shadow: var(--raise-sm); }
.chan .ic { width: 14px; height: 14px; }
.sla { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; color: var(--sc); white-space: nowrap; }
.sla svg { width: 26px; height: 26px; transform: rotate(-90deg); }
.sla .rb { fill: none; stroke: color-mix(in srgb, var(--ink) 10%, transparent); stroke-width: 4; }
.sla .rf { fill: none; stroke: var(--sc); stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray .8s; }
.sla.ok { --sc: var(--ok); } .sla.warn { --sc: var(--warn); } .sla.bad { --sc: var(--bad); } .sla.mute { --sc: var(--muted); }
.sla.bad svg { animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 50% { transform: rotate(-90deg) scale(1.15); } }

/* drag board */
.kboard { grid-auto-columns: minmax(268px, 1fr); gap: 18px; }
.kcol { background: var(--surface); box-shadow: var(--well); border-radius: 20px; padding: 4px 4px 0; }
.kcol-h h3 { font-size: 14px; font-weight: 750; }
.kcount { min-width: 26px; text-align: center; padding: 1px 8px; border-radius: 99px; box-shadow: var(--raise-sm); font-weight: 800; color: var(--ink); }
.kcard { --pc: var(--c5); border: 0; background: var(--surface); box-shadow: var(--raise-sm); border-radius: 14px; display: grid; gap: 8px; border-left: 4px solid var(--pc); }
.kcard:has(.p-Urgent) { --pc: var(--bad); } .kcard:has(.p-High) { --pc: var(--peach); } .kcard:has(.p-Normal) { --pc: var(--info); }
.kcard:hover { box-shadow: var(--raise); }
.kc-top { display: flex; align-items: center; gap: 8px; }
.kc-id { font: 12px var(--mono); color: var(--muted); }
.kc-sub { font-size: 13.5px; font-weight: 650; line-height: 1.35; }
.kc-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.kc-foot .av { width: 24px; height: 24px; font-size: 10px; }
.kc-foot .grow1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.klist.kover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.col-add { margin: 0 8px 4px; }
.petal { position: fixed; z-index: 130; width: 12px; height: 12px; border-radius: 12px 0; background: var(--pc, var(--accent)); pointer-events: none; animation: petal .95s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes petal { from { transform: translate(0, 0) rotate(0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); opacity: 0; } }
.board-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }

/* case page: thread and properties */
.case { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.thread { display: grid; gap: 14px; }
.msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; animation: rise .45s both; }
.msg .bub { padding: 12px 14px; border-radius: 4px 16px 16px 16px; background: var(--surface); box-shadow: var(--raise-sm); }
.msg.agent { grid-template-columns: 1fr 36px; }
.msg.agent .av { order: 2; }
.msg.agent .bub { border-radius: 16px 4px 16px 16px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.msg.note .bub { background: var(--note); color: var(--note-ink); box-shadow: none; border: 1px dashed color-mix(in srgb, var(--note-ink) 35%, transparent); }
.bub header { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.msg.note .bub header { color: inherit; opacity: .75; }
.bub p { white-space: pre-wrap; }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; border-radius: 16px; box-shadow: var(--raise-sm); background: var(--surface); width: fit-content; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .4; } }
.composer { display: grid; gap: 10px; }
.composer textarea { min-height: 96px; resize: vertical; }
.composer.is-note textarea { background: var(--note); color: var(--note-ink); }
.comp-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.props { display: grid; gap: 14px; position: sticky; top: 16px; }
.props .field label { font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 99px; box-shadow: var(--raise-sm); font-size: 12px; font-weight: 650; }
.tag button { border: 0; background: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0; }
.tag button .ic { width: 12px; height: 12px; }
.mini-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mini-list li { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.mini-list li a { flex: 1; min-width: 0; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-list li a:hover { color: var(--accent); }
.csat { display: flex; gap: 4px; color: var(--c4); }
.csat .ic { width: 16px; height: 16px; fill: currentColor; }
.csat .off { color: color-mix(in srgb, var(--ink) 15%, transparent); }

/* team, knowledge base, settings */
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.agent { display: grid; gap: 12px; }
.agent-top { display: flex; align-items: center; gap: 12px; }
.agent-top b { display: block; font-size: 15px; } .agent-top small { color: var(--muted); }
.st-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); margin-left: auto; }
.st-dot.Away { background: var(--warn); } .st-dot.Offline { background: var(--c5); }
.load { height: 10px; border-radius: 99px; box-shadow: var(--well); overflow: hidden; }
.load i { display: block; height: 100%; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--peach)); transition: width .8s cubic-bezier(.3, 1.3, .4, 1); }
.agent dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; text-align: center; }
.agent dt { font-size: 11px; color: var(--muted); } .agent dd { margin: 0; font-weight: 800; font-size: 16px; }
.kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.kb { display: grid; gap: 10px; align-content: start; }
.kb h3 { font-size: 15px; font-weight: 750; }
.kb p { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kb-foot { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.kb-foot .grow1 { flex: 1; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row small { display: block; color: var(--muted); font-size: 12px; }
.sla-tbl input { width: 70px; min-height: 32px; padding: 4px 8px; text-align: right; }

/* =========================================================
   4. Responsive
   ========================================================= */
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: 1 / -1; } .case { grid-template-columns: 1fr; } .props { position: static; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: 100px; background: var(--bg); transform: translateX(-110%); transition: transform .3s cubic-bezier(.2, .9, .3, 1); box-shadow: 10px 0 40px rgba(0, 0, 0, .2); }
  .nav-open .rail { transform: none; }
  .nav-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(20, 24, 22, .4); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav-open .nav-scrim { opacity: 1; pointer-events: auto; }
  .menu-btn { display: inline-grid; }
  .main { padding: 14px 16px 40px; }
  .status-sw span { display: none; }
}
@media (max-width: 560px) { .s3, .s6 { grid-column: 1 / -1; } .grid { gap: 14px; } .search span, .search kbd { display: none; } .search { flex: 0 0 42px; padding: 0; justify-content: center; } .ph h1 { font-size: 22px; } .agent dl { grid-template-columns: repeat(3, 1fr); } }

    <nav class="nav" aria-label="Pages">

  <div class="grid"><section class="card s6"><div class="card-h"><h2>SLA targets (hours)</h2><button type="button" class="btn sm primary" id="sl-save">Save</button></div><table class="tbl sla-tbl"><thead><tr><th scope="col">Priority</th><th scope="col" class="r">First reply</th><th scope="col" class="r">Solve within</th></tr></thead><tbody>${PRIOS.map((p) => `<tr><td><span class="prio p-${p}">${p}</span></td><td class="r"><label class="sr-only" for="sl-${p}-0">${p} first reply hours</label><input class="inp" type="number" min="1" max="200" id="sl-${p}-0" value="${pol()[p][0]}"></td><td class="r"><label class="sr-only" for="sl-${p}-1">${p} solve hours</label><input class="inp" type="number" min="1" max="500" id="sl-${p}-1" value="${pol()[p][1]}"></td></tr>`).join("")}</tbody></table><p class="err" id="sl-e" aria-live="polite"></p></section>
  <section class="card s6"><div class="card-h"><h2>Saved replies</h2><button type="button" class="btn sm" id="mc-add">${ic("plus")}Add</button></div><div id="mc"></div></section>
  <section class="card s6"><div class="card-h"><h2>Alerts</h2></div>${[["mail", "Email me new urgent cases", "Straight away, any time of day"], ["assign", "Tell me when a case is assigned to me", "In the bell and by email"], ["sound", "Play a sound for new cases", "Only while this tab is open"]].map(([k, l, s]) => `<div class="set-row"><div><b>${l}</b><small>${s}</small></div>${sw("pf-" + k, DB.prefs[k], l, `data-pf="${k}"`)}</div>`).join("")}</section>
  <section class="card s6"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Dark theme</b><small>Teal and charcoal</small></div>${sw("st-dark", Theme.get() === "dark", "Dark theme")}</div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample cases and team</small></div><button type="button" class="btn sm danger ghost" id="st-reset">${ic("refresh")}Reset</button></div></section></div>`;
  const macros = () => { $("#mc").innerHTML = DB.macros.map((m) => `<div class="set-row"><div style="min-width:0"><b>${esc(m.name)}</b><small style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px">${esc(m.text)}</small></div><button type="button" class="icon-btn" data-mc="${m.id}" aria-label="Edit ${esc(m.name)}">${ic("edit")}</button></div>`).join(""); };
  macros();
  const editM = (m) => formLayer({ title: m ? "Edit saved reply" : "New saved reply", values: m || {}, fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "text", label: "Reply", type: "textarea", rows: 5, req: true, full: true }], onDelete: m ? () => { DB.macros.splice(DB.macros.indexOf(m), 1); save(); macros(); toast("Saved reply deleted", "warn"); } : null, onSubmit: (x) => { if (m) Object.assign(m, x); else DB.macros.push({ id: uid("m"), ...x }); save(); macros(); toast("Saved reply stored"); } });
  on($("#mc"), "click", "[data-mc]", (e, b) => editM(DB.macros.find((m) => m.id === b.dataset.mc)));
  $("#mc-add").onclick = () => editM(null);
  $("#sl-save").onclick = () => { const np = {}; let bad = ""; PRIOS.forEach((p) => { const a = +$(`#sl-${p}-0`).value, b = +$(`#sl-${p}-1`).value; if (!(a >= 1) || !(b >= 1)) bad = "Every target needs at least 1 hour"; else if (b < a) bad = `${p}: solve time must be longer than first reply`; np[p] = [a, b]; }); $("#sl-e").textContent = bad; if (bad) return; DB.pol = np; save(); toast("SLA targets saved. Timers updated."); };
  on(v, "change", "[data-pf]", (e, i) => { DB.prefs[i.dataset.pf] = i.checked; save(); toast("Saved"); });
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-reset").onclick = async () => { if (await confirmBox("Reset demo data?", "Every case, customer and article goes back to the sample.", "Reset")) { store.del(KEY); DB = seed(); navCount(); meStatus(); rerender(); toast("Demo data reset"); } };
} };

/* ---------- Your status, live SLA timers and new cases arriving ---------- */
function meStatus() { const b = $("#me-status"), s = agent(ME).status; b.classList.toggle("away", s !== "Online"); $("span", b).textContent = s; b.setAttribute("aria-label", `Your status: ${s.toLowerCase()}. Click to change.`); }
$("#me-status").onclick = (e) => menu(e.currentTarget, ["Online", "Away", "Offline"].map((s) => ({ label: s, run: () => { agent(ME).status = s; save(); meStatus(); toast("You are " + s.toLowerCase(), "info"); if (App.cur === "team") rerender(); } })));
every(1000, () => { $$("[data-sla]").forEach((el) => { const c = caseOf(el.dataset.sla); if (!c) return; const s = sla(c), t = el.querySelector("span"); if (t && t.textContent !== s.txt) { t.textContent = s.txt; el.className = "sla " + s.k; el.querySelector(".rf").style.strokeDasharray = (s.f * 100).toFixed(1) + " 100"; } }); });
every(9000, () => {
  if (chance(0.45)) return;
  const [s, tag] = pick(SUBJ), cu = pick(DB.customers), c = { id: "#" + DB.seq++, subject: s, tags: [tag], cust: cu.id, chan: pick(Object.keys(CHANS)), prio: pick(["Urgent", "High", "Normal", "Normal", "Low"]), status: "new", agent: null, created: Date.now(), replied: false, solvedAt: null, csat: null, msgs: [{ from: "customer", who: cu.contact, t: Date.now(), text: pick(OPEN_MSG).replace("{s}", s) }] };
  DB.cases.unshift(c); if (DB.cases.length > 90) DB.cases.pop(); save(); navCount();
  Notes.add(`New ${c.prio.toLowerCase()} case ${c.id} from ${cu.name} by ${c.chan.toLowerCase()}`, c.prio === "Urgent" ? "bad" : "info");
  if (App.cur === "board" && !layers.length && !document.querySelector(".kghost")) { const el = $("#kb"); if (el) { const y = el.scrollLeft; rerender(); $("#kb") && ($("#kb").scrollLeft = y); const k = $(`.kcard[data-id="${CSS.escape(c.id)}"]`); k && k.classList.add("kdrop"); } }
});
App.commands = () => [{ label: "New case", hint: "Create", run: () => newCase() }, { label: "New help article", hint: "Help docs", run: () => editArticle(null) }, ...DB.cases.slice(0, 15).map((c) => ({ label: `${c.id} ${c.subject}`, hint: cust(c.cust).name, run: () => go("#/case/" + encodeURIComponent(c.id)) })), ...DB.customers.slice(0, 10).map((c) => ({ label: c.name, hint: "Customer", run: () => openCustomer(c) }))];
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; };
[["Urgent case #4820 is past its first-reply time", "bad", 12], ["Saffron Bakers rated their case 5 out of 5", "info", 55], ["Bank sync topic is up 40% this week", "warn", 300]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
navCount(); meStatus();
boot({ title: "Casebloom", key: "casebloom", def: "overview" });
</script>
</body>
</html>
