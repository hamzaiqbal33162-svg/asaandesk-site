<head>
<meta charset="utf-8">

<title>Glimpse · Marketing analytics portal for agencies</title>
<script>/* set the theme before first paint: ?theme= wins, then saved, then system */(function(){var d=document.documentElement,t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(d.dataset.key+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d.dataset.def||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=t})();</script>
<style>
/* ---------- theme tokens: daylight sky with coral, or deep navy at night ---------- */
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
--bg:#edf2f8;--surface:#ffffff;--surface-2:#f2f6fb;--text:#14213d;--muted:#5f6c86;--line:#dfe6f0;--hover:rgba(255,107,74,.07);--accent:#f0603f;--on-accent:#fff;--ring:rgba(240,96,63,.2);
--c1:#2f6fed;--c2:#f0603f;--c3:#13a89e;--c4:#9b5de5;--c5:#f2a541;--c6:#64748b;--ok:#0f8a64;--ok-bg:rgba(19,168,158,.13);--bad:#d6334d;--bad-bg:rgba(214,51,77,.1);--warn:#b0700e;--warn-bg:rgba(242,165,65,.16);--info-bg:rgba(47,111,237,.1);
--side:#ffffff;--sh:0 1px 2px rgba(20,33,61,.05),0 8px 30px -18px rgba(20,33,61,.35);--grid:rgba(20,33,61,.08);--map-dot:rgba(20,33,61,.18);--r:14px;--r-btn:9px;--r-in:9px;--r-seg:9px}
[data-theme="dark"]{--bg:#0a1324;--surface:#111d33;--surface-2:#16243f;--text:#e7eefb;--muted:#8b9bbb;--line:#1f2f4f;--hover:rgba(255,128,96,.09);--accent:#ff8060;--on-accent:#0a1324;--ring:rgba(255,128,96,.25);
--c1:#5b93ff;--c2:#ff8060;--c3:#2fd3c3;--c4:#b98cff;--c5:#ffc069;--c6:#94a3b8;--ok:#2fd3c3;--ok-bg:rgba(47,211,195,.13);--bad:#ff6b81;--bad-bg:rgba(255,107,129,.13);--warn:#ffc069;--warn-bg:rgba(255,192,105,.13);--info-bg:rgba(91,147,255,.15);
--side:#0e192d;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7);--grid:rgba(231,238,251,.07);--map-dot:rgba(231,238,251,.2)}
/* ---------- Core UI kit (shared parts, coloured by the theme tokens above) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--field,var(--surface-2));border:1px solid var(--line);border-radius:var(--r-in,10px);padding:.58em .75em;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=checkbox],input[type=radio],input[type=range],input[type=color]{width:auto;padding:0;box-shadow:none}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:var(--iw,1.8);stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.num,.tnum{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--surface);padding:.55em .95em;border-radius:var(--r-btn,10px);font-weight:600;font-size:.88rem;line-height:1.2;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:.36em .65em;font-size:.78rem}
.btn:disabled{opacity:.5;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-btn,10px);position:relative;color:inherit;transition:background-color .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--hover)}
.ibtn:active{transform:scale(.9)}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);animation:dotPop .4s var(--ease)}
.ibtn .dot[hidden]{display:none}
@keyframes dotPop{from{transform:scale(0)}}
/* segmented control with a sliding pill */
.seg{position:relative;display:inline-flex;padding:3px;background:var(--surface-2);border-radius:var(--r-seg,10px);border:1px solid var(--line);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;padding:.36em .8em;font-size:.8rem;font-weight:600;color:var(--muted);border-radius:calc(var(--r-seg,10px) - 3px);transition:color .2s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--seg-on,var(--text))}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-seg,10px) - 3px);background:var(--seg-pill,var(--surface));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .38s var(--ease),width .38s var(--ease)}
/* badges, deltas, avatars */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg,var(--ring));color:var(--accent)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:.78rem;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.delta .i{width:.95em;height:.95em}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:.7rem;font-weight:700;flex:none;background:hsl(var(--h) 62% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 75% 86%)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:.76rem}
/* switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background-color .25s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-weight:650;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2,var(--line));white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background-color .15s;cursor:pointer;animation:rowIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num .th-sort{flex-direction:row-reverse}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.th-sort{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.th-sort .i{opacity:.3;transition:transform .25s var(--ease),opacity .2s}
th[aria-sort] .th-sort .i{opacity:1}
th[aria-sort="ascending"] .th-sort .i{transform:rotate(180deg)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 180px;max-width:300px;display:block}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:.34em .8em;border-radius:99px;border:1px solid var(--line);font-size:.78rem;font-weight:650;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--chip-on,var(--accent));border-color:transparent;color:var(--on-accent,#fff)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);font-weight:650;color:var(--text);transition:background-color .2s,transform .15s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent,#fff);border-color:transparent}
.pager button:disabled{opacity:.35;cursor:default}
.empty{display:grid;place-items:center;gap:6px;padding:26px 12px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.55}
/* overlays: modal, drawer */
.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(8,10,20,.48));opacity:0;transition:opacity .24s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ovl.open{opacity:1}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--r-modal,16px);box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line);transform:translateY(18px) scale(.96);transition:transform .34s var(--ease)}
.modal.wide{width:min(780px,100%)}
.ovl.open .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
.m-head h2{font-size:1.06rem}
.m-body{padding:10px 18px 18px;display:grid;gap:12px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
.m-text{color:var(--muted)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:650;color:var(--muted)}
.err{color:var(--bad);font-size:.75rem}
.err:empty{display:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100vw);height:100%;background:var(--surface-solid,var(--surface));border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.25);transform:translateX(104%);transition:transform .38s var(--ease);display:flex;flex-direction:column;color:var(--text)}
.ovl.open .drawer{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.06rem}
.d-body{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.d-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
/* popovers and menus */
.pop{position:fixed;z-index:90;min-width:200px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:6px;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:.86rem}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.on{font-weight:700;color:var(--accent)}
.mi.danger{color:var(--bad)}
.pop-t{padding:6px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.notes{max-height:330px;overflow:auto;display:grid;gap:2px}
.note{display:flex;gap:10px;padding:9px 8px;border-radius:8px;font-size:.84rem;align-items:flex-start}
.note .i{margin-top:2px;color:var(--accent)}
.note.new{background:var(--hover)}
.note small{color:var(--muted)}
/* command search */
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);background:var(--surface-solid,var(--surface));border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease);color:var(--text)}
.ovl.open .cmdk{transform:none}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{border:0;background:transparent;box-shadow:none;padding:6px 0;font-size:1rem}
kbd{font:600 .7rem/1 var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.cmdk-list{max-height:min(360px,55vh);overflow:auto;padding:6px}
.cmdk-it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.cmdk-it small{margin-left:auto;color:var(--muted)}
.cmdk-it[aria-selected="true"]{background:var(--hover);color:var(--accent)}
/* toasts */
.toasts{position:fixed;z-index:100;right:16px;bottom:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);box-shadow:0 12px 30px rgba(0,0,0,.28);font-size:.86rem;animation:toastIn .4s var(--ease);transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(8px) scale(.97)}
.toast.ok .i{color:#7be3a6}.toast.err .i{color:#ff8f8f}.toast.info .i{color:#9cc4ff}
.t-act{font-weight:700;color:#9cc4ff;margin-left:4px;padding:2px 4px;border-radius:6px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* chart tooltip */
.tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;background:var(--tip-bg,rgba(14,17,27,.95));color:var(--tip-fg,#fff);padding:8px 11px;border-radius:10px;font-size:.78rem;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:opacity .12s;min-width:120px;max-width:260px}
.tip.on{opacity:1}
.tip .tr{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:3px}
.tip .tr span{display:flex;align-items:center;gap:6px;opacity:.82}
.tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.ch{display:block;overflow:visible;max-width:100%;outline:none}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.ch text{font-size:11px;fill:var(--axis,var(--muted));font-family:var(--font)}
.ch .grid{stroke:var(--grid,var(--line));stroke-width:1;stroke-dasharray:var(--grid-dash,3 4)}
.ch .zero{stroke:var(--axis,var(--muted));stroke-width:1;opacity:.5}
.ch-line{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ch-line.dash{stroke-dasharray:5 5;stroke-width:1.8;opacity:.85}
.ch.enter .ch-line:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.3s var(--ease) .1s forwards}
.ch.enter .ch-area,.ch.enter .ch-line.dash,.ch.enter .tgt{animation:chFade 1s ease .3s both}
.tgt{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:6 4}
.guide{stroke:var(--axis,var(--muted));stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.hdot{fill:var(--surface-solid,var(--surface));stroke-width:2.5;opacity:0;transition:opacity .15s}
.ch.hover .guide,.ch.hover .hdot{opacity:1}
.ch-bar{transition:opacity .2s}
.ch.enter .ch-bar{transform-box:fill-box;transform-origin:50% 100%;animation:chGrow .8s var(--ease) both;animation-delay:calc(var(--i) * 26ms)}
.ch.enter .ch-bar.neg{transform-origin:50% 0}
.ch.colhover .col:not(.on) .ch-bar{opacity:.38}
.ch-seg{fill:none;transition:stroke-width .25s var(--ease),opacity .2s;cursor:pointer}
.ch-seg.dim{opacity:.35}
.ch.enter .ch-seg{animation:chSweep 1.1s var(--ease) both;animation-delay:calc(var(--i) * 110ms)}
.ch-cell{transform-box:fill-box;transform-origin:center;transition:opacity .15s}
.ch.enter .ch-cell,.ch.enter .ch-cellt{animation:chPop .55s var(--ease) both;animation-delay:calc(var(--i) * 12ms)}
.ch .ch-cellt{font-size:10px;font-weight:600;pointer-events:none}
.ch .ch-cellt.hi{fill:#fff}
.ch.enter .ch-fun{transform-box:fill-box;transform-origin:50% 50%;animation:chGrowX .8s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.ch.enter .ch-gauge{animation:chSweep 1.4s var(--ease) both}
.spark{display:block;overflow:visible}
.sp-l{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:chDraw 1.2s var(--ease) .25s forwards}
@keyframes chDraw{to{stroke-dashoffset:0}}
@keyframes chFade{from{opacity:0}}
@keyframes chGrow{from{transform:scaleY(0)}}
@keyframes chGrowX{from{transform:scaleX(0)}}
@keyframes chSweep{from{stroke-dasharray:0 100}}
@keyframes chPop{from{opacity:0;transform:scale(.4)}}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;font-size:.76rem}
.lg button{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:650;padding:2px 0;transition:opacity .2s}
.lg button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn .ch{flex:none}
.dn-l{display:grid;gap:6px;flex:1;min-width:150px;font-size:.82rem}
.dn-l button{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;text-align:left;padding:3px 4px;border-radius:6px}
.dn-l button:hover,.dn-l button:focus-visible{background:var(--hover)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l small{color:var(--muted);min-width:38px;text-align:right}
.dn-v{font-size:20px!important;font-weight:750;fill:var(--text)!important}
.dn-s{font-size:10.5px!important}
.hbars{display:grid;gap:4px}
.hb{display:grid;grid-template-columns:minmax(64px,34%) 1fr auto;gap:10px;align-items:center;font-size:.82rem;padding:4px 0}
.hb>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
/* =====================================================================
   Core kit: helpers, router, charts and UI pieces used by this app.
   Plain JS, no libraries. The app code further down builds on it.
   ===================================================================== */
'use strict';

/* ---------- small DOM and math helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const avg = a => (a.length ? sum(a) / a.length : 0);
const lerp = (a, b, t) => a + (b - a) * t;
const f1 = v => Math.round(v * 10) / 10;
let _uid = 0;
const uid = (p = 'u') => p + (++_uid).toString(36) + Math.random().toString(36).slice(2, 5);
const clone = o => JSON.parse(JSON.stringify(o));
const motionQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
let RM = !!motionQ.matches; // reduced motion: skip big movement
if (motionQ.addEventListener) motionQ.addEventListener('change', e => { RM = e.matches; });

/* ---------- seeded random numbers, so demo data is the same every visit ---------- */
let _seed = 1;
function seed(n) { _seed = (n >>> 0) || 1; }
function rand() { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rnd = (a = 0, b = 1) => a + rand() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(rand() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function walk(n, start, drift = 0.02, vol = 0.08) { const out = []; let v = start; for (let i = 0; i < n; i++) { out.push(v); v = Math.max(0, v * (1 + drift + (rand() - 0.5) * vol)); } return out; }
const FIRST = ['Ayesha', 'Bilal', 'Hamza', 'Sana', 'Usman', 'Zara', 'Faisal', 'Hira', 'Omar', 'Mahnoor', 'Danish', 'Iqra', 'Saad', 'Noor', 'Ali', 'Fatima', 'Kamran', 'Mehwish', 'Raza', 'Amna', 'Junaid', 'Sara', 'Tariq', 'Laiba', 'Waqas', 'Rabia', 'Adeel', 'Maryam', 'Imran', 'Areeba'];
const LAST = ['Khan', 'Malik', 'Qureshi', 'Siddiqui', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Ahmed', 'Abbasi', 'Baig', 'Rana', 'Shah', 'Aslam', 'Farooq', 'Nadeem'];
const CITIES = ['Karachi', 'Lahore', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Quetta', 'Sialkot', 'Hyderabad'];
const person = () => pick(FIRST) + ' ' + pick(LAST);
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (name, cls = '') => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---------- number and date formatting ---------- */
let CUR = '$'; // '$' or 'Rs'
const num = (n, d = 0) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
function short(n, d = 1) {
  n = +n || 0; const a = Math.abs(n), s = n < 0 ? '−' : '';
  const f = (v, u) => s + String(+v.toFixed(d)) + u;
  return a >= 1e9 ? f(a / 1e9, 'B') : a >= 1e6 ? f(a / 1e6, 'M') : a >= 1e4 ? f(a / 1e3, 'K') : s + num(a, a < 100 && a % 1 ? 1 : 0);
}
const curSym = () => (CUR === 'Rs' ? 'Rs ' : CUR);
const money = (n, d = 0) => ((+n || 0) < 0 ? '−' : '') + curSym() + num(Math.abs(n), d);
const moneyS = n => ((+n || 0) < 0 ? '−' : '') + curSym() + short(Math.abs(n));
const pct = (n, d = 1) => num(n, d) + '%';
const FMT = { num: n => num(n), short: n => short(n), money: n => money(n), money2: n => money(n, 2), moneyS, pct: n => pct(n), pct0: n => pct(n, 0), x: n => num(n, 1) + '×', raw: n => String(n) };
const fmtOf = f => (typeof f === 'function' ? f : FMT[f] || FMT.num);
function delta(v, good = 1) { const up = v >= 0; return `<span class="delta ${(up ? 1 : -1) * good > 0 ? 'up' : 'down'}">${ic(up ? 'up' : 'down')}${pct(Math.abs(v))}</span>`; }
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
const pad2 = n => String(n).padStart(2, '0');
const isoD = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const toD = d => (typeof d === 'string' ? parseD(d) : d);
const dd = d => { d = toD(d); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const ddy = d => { d = toD(d); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const monthsBack = n => Array.from({ length: n }, (_, i) => addMonths(TODAY, i - n + 1));
const mLabel = d => MON[d.getMonth()];
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
function ago(mins) { mins = Math.max(0, Math.round(mins)); if (mins < 1) return 'just now'; if (mins < 60) return mins + 'm ago'; const h = Math.floor(mins / 60); if (h < 24) return h + 'h ago'; return Math.floor(h / 24) + 'd ago'; }

/* ---------- safe storage: works even when the browser blocks it ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

/* ---------- file download made in the page (CSV, JSON): no network ---------- */
function download(name, text, type = 'text/csv') {
  try {
    const url = URL.createObjectURL(new Blob([text], { type })), a = document.createElement('a');

    setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Downloaded ' + name);
  } catch (e) { toast('Download is not available in this preview', 'err'); }

const csv = rows => rows.map(r => r.map(v => (/[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v)).join(',')).join('\n');

/* ---------- icons (stroke style, 24px grid) ---------- */
const IC = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', bars: 'M4 20h16M7 16v-5M12 16V6M17 16v-8', trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',

    table('#e-tbl', { ph: 'Search emails…', size: 6, sort: 'date', dir: -1, chips: { k: 'status', values: ['Sent', 'Scheduled', 'Draft'] }, rows: () => CD.emails.map(e => ({ ...e, or: e.sent ? (e.opens / e.sent) * 100 : 0, ctr: e.sent ? (e.clicks / e.sent) * 100 : 0 })), cols: [{ k: 'name', label: 'Email', f: v => `<b>${esc(v)}</b>` }, { k: 'status', label: 'Status', f: v => `<span class="badge ${v === 'Sent' ? 'ok' : v === 'Scheduled' ? 'info' : ''}">${v}</span>` }, { k: 'date', label: 'Date', f: v => dd(v) }, { k: 'sent', label: 'Sent', num: true, f: v => (v ? num(v) : '—') }, { k: 'or', label: 'Open rate', num: true, f: v => (v ? pct(v) : '—') }, { k: 'ctr', label: 'Click rate', num: true, f: v => (v ? pct(v, 2) : '—') }, { k: 'conv', label: 'Conv.', num: true, f: v => num(v) }], acts: r => (r.status === 'Sent' ? '' : `<button type="button" class="ibtn" data-ra="del" aria-label="Delete email">${ic('trash')}</button>`), onAct: async (a, r) => { if (!(await confirmBox('Delete this email?', `“${r.name}” will be removed.`))) return; CD.emails = CD.emails.filter(e => e.id !== r.id); persist('emails'); refresh(); toast('Email deleted'); }, onRow: r => toast(r.status === 'Sent' ? `${r.name}: ${num(r.opens)} opens, ${num(r.clicks)} clicks` : `${r.name} is ${r.status.toLowerCase()} for ${dd(r.date)}`, 'info') });

page('clients', {

  html: () => `<div class="ph rise"><div><h1>Clients</h1><p>Every account the agency runs. Open one to switch the whole portal.</p></div><div class="ph-act"><button type="button" class="btn primary sm" data-act="addClient">${ic('plus')}Add client</button></div></div><section class="clients" id="clients"></section>`,

function clientForm(c) {

    onOk: f => {
      if (!validate(f, { name: V.min(2), site: v => (/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(v) ? '' : 'Like example.com'), retainer: V.num(0, 1000000), ...(isNew ? { base: V.num(50, 1000000) } : {}) })) return false;

page('reports', {
  title: 'Reports', icon: 'file',
  html: () => `<div class="ph rise"><div><h1>Reports</h1><p>${esc(client().name)} · build a client report, download it or send it on a schedule</p></div></div>
  <section class="rb"><article class="card rise"><div class="card-h"><h2>Sections</h2></div>${['KPIs', 'Traffic', 'Acquisition', 'Ads', 'Keywords', 'Social', 'Email'].map(s => `<label class="ck"><input type="checkbox" data-sec="${s}"${UI.rep.secs.includes(s) ? ' checked' : ''}>${s}</label>`).join('')}<div style="margin:12px 0">${seg('repDays', [['7', '7 days'], ['30', '30 days'], ['90', '90 days']], UI.rep.days, 'Report period')}</div><div class="row" style="flex-wrap:wrap"><button type="button" class="btn sm" data-act="repCsv">${ic('download')}CSV</button><button type="button" class="btn sm primary" data-act="repSched">${ic('clock')}Schedule</button></div></article>
  <article class="card rise"><div class="paper"><h3 id="rp-title"></h3><p class="muted" id="rp-sub" style="font-size:.82rem;margin-bottom:12px"></p><div class="rprev" id="rprev"></div></div></article></section>
  <article class="card rise"><div class="card-h"><h2>Scheduled reports</h2></div><div id="sched"></div></article>`,
  fill: () => {
    $$('[data-sec]').forEach(c => { if (!c._on) { c._on = 1; c.addEventListener('change', () => { UI.rep.secs = $$('[data-sec]:checked').map(x => x.dataset.sec); drawReport(); }); } });

  }
});
function repRows() {
  const n = UI.rep.days, v = (() => { const sp = sum(cur(CD.spend, n)), cv = sum(cur(CD.conv, n)); return { sp, cv }; })(), s = sum(cur(CD.sessions, n));
  const R = { KPIs: [['Sessions', short(s), cur(CD.sessions, n)], [CD.c.type === 'shop' ? 'Orders' : 'Leads', num(v.cv), cur(CD.conv, n)]], Traffic: [['Users', short(sum(cur(CD.users, n))), cur(CD.users, n)], ['Bounce rate', pct(avg(cur(CD.bounce, n))), cur(CD.bounce, n)]], Acquisition: [['Top source', SOURCES.map(x => [x.name, sum(cur(CD.by[x.id], n))]).sort((a, b) => b[1] - a[1])[0][0], cur(CD.by.org, n)]], Ads: [['Ad spend', money(v.sp), cur(CD.spend, n)], ['ROAS', num((v.cv * CD.c.value) / (v.sp || 1), 1) + '×', cur(CD.conv, n)]], Keywords: [['Keywords in top 10', String(CD.kws.filter(k => k.hist[11] <= 10).length), CD.kws.map(k => -k.hist[11])]], Social: [['New followers', num(sum(SOC.map(x => CD.fol[x.id][D - 1] - CD.fol[x.id][D - n]))), cur(CD.fol.ig, n)]], Email: [['Subscribers', num(CD.list[D - 1]), cur(CD.list, n)]] };
  return UI.rep.secs.flatMap(sec => (R[sec] || []).map(r => [sec, ...r]));
}
function drawReport() {

}
SEG.repDays = v => { UI.rep.days = +v; drawReport(); };
ACT.repCsv = () => { const rows = repRows(); if (!rows.length) { toast('Pick at least one section', 'err'); return; } download(`${CD.c.id}-report-${UI.rep.days}d.csv`, csv([['Section', 'Metric', 'Value'], ...rows.map(r => r.slice(0, 3))])); };
ACT.repSched = () => { if (!UI.rep.secs.length) { toast('Pick at least one section', 'err'); return; } modal({ title: 'Schedule this report', ok: 'Schedule', body: `<div class="grid2">${field('Every', 'freq', { type: 'select', opts: ['Weekly', 'Every 2 weeks', 'Monthly'] })}${field('Send to', 'to', { type: 'email', ph: 'client@example.com' })}</div><p class="m-text">Sections: ${esc(UI.rep.secs.join(', '))}</p>`, onOk: f => { if (!validate(f, { to: V.email })) return false; const d = formData(f); DB.schedules.push({ id: uid('s'), client: DB.cur, freq: d.freq, to: d.to, sections: UI.rep.secs.join(', ') }); save(); refresh(); toast(`${d.freq} report scheduled for ${d.to}`); note(`Report scheduled for ${client().name}`, 'clock'); } }); };
