<!doctype html>
<!-- Chill & Craft · Candle Wish · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candle Wish · blow out the birthday candles</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens (light first, dark below) ---------- */
  :root {
    --page: #f7efe9;
    --ink: #3a2631;
    --muted: #7b6470;
    --panel: #ffffff;
    --chip: #f1e6ea;
    --line: rgba(58, 38, 49, 0.14);
    --room: #2b2130;          /* the dark room */
    --lit1: #fff2e2;          /* room after the lights come on */
    --lit2: #ffd6c4;
    --dark: #140b17;          /* shadow laid over the cake */
    --banner-ink: #7a1f45;
    --banner-glow: rgba(255, 255, 255, 0.85);
    --accent: #e2541c;
    --accent-ink: #ffffff;
    --focus: #7c3aed;
    --smoke-rgb: 160, 150, 165;
    --table: #5a3b2b;
    --table-edge: #7a5240;
    --plate: #e6e1ec;
    --plate-in: #f7f4fa;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d090f; --ink: #f7e9ef; --muted: #b8a1ad; --panel: #1b1319; --chip: #2a1f27;
      --line: rgba(247, 233, 239, 0.13); --room: #0b060c; --lit1: #45303b; --lit2: #22151d; --dark: #040205;
      --banner-ink: #fff0dc; --banner-glow: rgba(255, 110, 150, 0.6);
      --accent: #ff8a3d; --accent-ink: #1d0d04; --focus: #ffd166; --smoke-rgb: 150, 140, 155;
      --table: #3a271d; --table-edge: #503628; --plate: #d8d2e0; --plate-in: #ebe7f0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0d090f; --ink: #f7e9ef; --muted: #b8a1ad; --panel: #1b1319; --chip: #2a1f27;
    --line: rgba(247, 233, 239, 0.13); --room: #0b060c; --lit1: #45303b; --lit2: #22151d; --dark: #040205;
    --banner-ink: #fff0dc; --banner-glow: rgba(255, 110, 150, 0.6);
    --accent: #ff8a3d; --accent-ink: #1d0d04; --focus: #ffd166; --smoke-rgb: 150, 140, 155;
    --table: #3a271d; --table-edge: #503628; --plate: #d8d2e0; --plate-in: #ebe7f0;
    color-scheme: dark;
  }

  /* ---------- Page ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- The room: candlelight glow is driven by --a (strength) and --r (radius) ---------- */
  .room {
    --a: 0.5;
    --r: 120px;
    position: relative;
    width: min(540px, 94vw, calc((100vh - 230px) * 1.333));
    min-width: 280px;
    aspect-ratio: 4 / 3;
    border-radius: 24px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(255, 196, 120, var(--a)) 0, rgba(255, 140, 70, calc(var(--a) * 0.32)) var(--r), rgba(255, 120, 60, 0) calc(var(--r) * 2.3)),
      var(--room);
    box-shadow: 0 24px 60px rgba(10, 4, 14, 0.4);
  }
  .lights {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 18%, var(--lit1), var(--lit2));
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  .party .lights { opacity: 1; }
  .room svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* cake colours stay the same in both themes; the shade layer darkens them */
  .string { fill: none; stroke: rgba(255, 255, 255, 0.45); stroke-width: 1.2; }
  #bunting, .shade { transition: opacity 0.5s ease; }
  .shade { fill: var(--dark); pointer-events: none; }
  .table { fill: var(--table); }
  .table-edge { fill: var(--table-edge); }
  .plate { fill: var(--plate); }
  .plate-in { fill: var(--plate-in); }
  .cake-shadow { fill: rgba(0, 0, 0, 0.22); }
  .tier-b { fill: #6b3a2b; }
  .drip-b { fill: #ff9fbe; }
  .top-b { fill: #ffc3d6; }
  .tier-t { fill: #fde4c4; }
  .drip-t { fill: #5b2f22; }
  .top-t { fill: #7b4532; }
  .pearl { fill: #fff6df; }
  .rosette { fill: #fff8f0; }
  .wick { fill: none; stroke: #2b2118; stroke-width: 1.4; stroke-linecap: round; }
  .c-shade { fill: #000; opacity: 0; }

  /* ---------- Birthday banner (shows when every candle is out) ---------- */
  .banner {
    position: absolute;
    left: 50%;
    top: 13%;
    width: 90%;
    text-align: center;
    color: var(--banner-ink);
    text-shadow: 0 2px 14px var(--banner-glow);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -14px) scale(0.92);
    transition: opacity 0.6s ease 0.25s, transform 0.8s cubic-bezier(.34, 1.56, .64, 1) 0.25s;
  }
  .banner strong { display: block; font-size: clamp(18px, 4.8vw, 30px); font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .banner .wish { display: block; margin-top: 2px; font-size: clamp(13px, 3vw, 17px); font-weight: 600; }
  .party .banner { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* every flame is also a real button */
  .flame-btn {
    position: absolute;
    height: 13%;
    padding: 0;
    border: 0;
    border-radius: 45%;
    background: transparent;
    transform: translate(-50%, -50%);
    cursor: pointer;
  }
  .flame-btn[aria-disabled="true"] { cursor: default; }
  .flame-btn:focus-visible { outline: 2px dashed var(--focus); outline-offset: 2px; }

  /* ---------- Controls ---------- */
  .controls { width: min(540px, 94vw); display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; }
  .stepper, .name {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px 4px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .lbl, .name { font-size: 13px; font-weight: 700; color: var(--muted); }
  .round {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: var(--chip);
    color: var(--ink);
    font: 700 18px system-ui, sans-serif;
    cursor: pointer;
  }
  .round:disabled { opacity: 0.4; cursor: default; }
  output { min-width: 1.4em; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
  .name input {
    width: 9em;
    padding: 6px 8px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: 600 15px system-ui, sans-serif;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 14px system-ui, sans-serif;
    cursor: pointer;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  #blow { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #blow.active { background: var(--accent); color: var(--accent-ink); transform: scale(0.97); }
  .round:focus-visible, .btn:focus-visible, .name input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .party + .controls #relight { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(226, 84, 28, 0.18); } }

  /* live microphone level with the threshold line */
  .meter {
    position: relative;
    width: 110px;
    height: 10px;
    border-radius: 6px;
    background: var(--chip);
    overflow: hidden;
    opacity: 0.45;
    transition: opacity 0.3s;
  }
  .meter.live { opacity: 1; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #5fd39b, #ffc04d 60%, #ff5d5d); }
  .meter b { position: absolute; left: 24%; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.7; }
  .meter.hot { box-shadow: 0 0 0 2px rgba(255, 93, 93, 0.35); }
  .status { margin: 0; min-height: 1.4em; text-align: center; font-size: 15px; font-weight: 600; }
  .note { margin: 0; min-height: 1.2em; text-align: center; font-size: 13px; color: var(--muted); }

  /* effects canvas sits over the page and never takes clicks */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  @media (prefers-reduced-motion: reduce) {
    .banner { transition: opacity 0.4s ease; transform: translate(-50%, 0); }
    .party .banner { transform: translate(-50%, 0); }
    .party + .controls #relight { animation: none; }
    .lights, #bunting, .shade { transition-duration: 0.2s; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Candle Wish: blow out the candles on a birthday cake</h1>

  <div class="room" id="room">
    <div class="lights" aria-hidden="true"></div>
    <svg id="svg" viewBox="0 0 400 300" aria-hidden="true">
      <defs>
        <!-- striped wax, one pattern per colour -->
        <pattern id="st0" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="7" height="7" fill="#ff8fb3"/><rect width="3" height="7" fill="#fff4f8"/></pattern>
        <pattern id="st1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="7" height="7" fill="#6fd0bb"/><rect width="3" height="7" fill="#f2fffb"/></pattern>
        <pattern id="st2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="7" height="7" fill="#b39cff"/><rect width="3" height="7" fill="#f7f3ff"/></pattern>
        <pattern id="st3" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="7" height="7" fill="#ffcf5c"/><rect width="3" height="7" fill="#fffaf0"/></pattern>
        <pattern id="st4" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="7" height="7" fill="#72bfff"/><rect width="3" height="7" fill="#f2f9ff"/></pattern>
        <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#fff2a8"/><stop offset="0.45" stop-color="#ffb43d"/><stop offset="1" stop-color="#ff5e1a" stop-opacity="0.85"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0" stop-color="#ffd28a" stop-opacity="0.6"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
        </radialGradient>
        <!-- darker sides give each tier some roundness -->
        <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="0.3"/><stop offset="0.22" stop-color="#000" stop-opacity="0"/>
          <stop offset="0.78" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.34"/>
        </linearGradient>
      </defs>
      <g id="bunting"></g>
      <g id="cake"></g>
      <g id="shade" class="shade">
        <rect x="0" y="268" width="400" height="32"/>
        <ellipse cx="200" cy="268" rx="160" ry="14"/>
        <rect x="80" y="182" width="240" height="84" rx="12"/>
        <ellipse cx="200" cy="186" rx="120" ry="11"/>
        <rect x="120" y="122" width="160" height="70" rx="10"/>
        <ellipse cx="200" cy="128" rx="80" ry="10"/>
      </g>
      <g id="candles"></g>
      <g id="flames"></g>
    </svg>
    <div class="banner" id="banner" aria-hidden="true">
      <strong>Happy birthday, <span id="bName">Zainab</span>!</strong>
      <span class="wish">Make a wish.</span>
    </div>
    <div id="flameBtns"></div>
  </div>

  <div class="controls">
    <div class="row">
      <div class="stepper" role="group" aria-labelledby="cLabel">
        <span id="cLabel" class="lbl">Candles</span>
        <button type="button" class="round" id="minus" aria-label="One candle fewer">&minus;</button>
        <output id="nOut">5</output>
        <button type="button" class="round" id="plus" aria-label="One candle more">+</button>
      </div>
      <label class="name">Name <input id="name" type="text" value="Zainab" maxlength="20" autocomplete="off"></label>
    </div>
    <div class="row">
      <button type="button" class="btn" id="mic" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="micLabel">Use microphone</span>
      </button>
      <div class="meter" id="meter" aria-hidden="true"><i id="lvl"></i><b></b></div>
      <button type="button" class="btn ghost" id="blow">Hold to blow</button>
      <button type="button" class="btn ghost" id="relight">Light them again</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="note" id="micMsg" aria-live="polite"></p>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  (function () {
    "use strict";
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    const NS = "http://www.w3.org/2000/svg";
    const $ = (id) => document.getElementById(id);
    const room = $("room"), svg = $("svg"), fx = $("fx"), ctx = fx.getContext("2d");
    const cakeG = $("cake"), candlesG = $("candles"), flamesG = $("flames"), shade = $("shade");
    const bunting = $("bunting"), btnWrap = $("flameBtns");
    const statusEl = $("status"), micMsg = $("micMsg"), micBtn = $("mic"), micLabel = $("micLabel");
    const blowBtn = $("blow"), relightBtn = $("relight"), meter = $("meter"), lvl = $("lvl");
    const nOut = $("nOut"), minus = $("minus"), plus = $("plus"), nameIn = $("name"), bName = $("bName");

    const el = (tag, attrs, parent) => {
      const n = document.createElementNS(NS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(n);
      return n;
    };
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const easeBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
    const f1 = (n) => n.toFixed(1);
    let seed = 9;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

    /* ---------- 1. Bunting and cake (drawn once) ---------- */
    const FLAGS = ["#ff6b9a", "#ffd166", "#5ec8e8", "#a28bff", "#7ed38a"];
    el("path", { d: "M0 12 Q200 60 400 12", class: "string" }, bunting);
    for (let i = 0; i < 12; i++) {
      const t = 0.05 + i * 0.082, x = 400 * t, y = 12 + 96 * t * (1 - t); // points on the sagging string
      el("path", { d: `M${f1(x - 10)} ${f1(y - 1)} L${f1(x + 10)} ${f1(y + 1)} L${f1(x)} ${f1(y + 20)}Z`, fill: FLAGS[i % FLAGS.length] }, bunting);
    }

    // frosting band with rounded drips hanging from it
    function dripPath(x0, x1, top, band) {
      let d = `M${x0} ${top} H${x1} V${band}`, x = x1;
      while (x > x0 + 14) {
        const w = 8 + rnd() * 6, len = 8 + rnd() * 16, gap = 6 + rnd() * 10;
        const xr = x - gap, xl = xr - w;
        if (xl < x0 + 4) break;
        d += ` L${f1(xr)} ${band} C${f1(xr)} ${f1(band + len)} ${f1(xl)} ${f1(band + len)} ${f1(xl)} ${band}`;
        x = xl;
      }
      return d + ` L${x0} ${band}Z`;
    }
    const SPRINKLES = ["#ff5d8f", "#ffd23f", "#3ec1d3", "#8ac926", "#b388ff", "#ffffff"];
    function sprinkles(cx, cy, rx, ry, n, avoid) {
      let made = 0, guard = 0;
      while (made < n && guard++ < 600) {
        const x = (rnd() * 2 - 1) * rx, y = (rnd() * 2 - 1) * ry;
        if ((x * x) / (rx * rx) + (y * y) / (ry * ry) > 1 || Math.abs(x) < avoid) continue;
        el("rect", {
          x: f1(cx + x - 2), y: f1(cy + y - 0.8), width: 4, height: 1.6, rx: 0.8,
          fill: SPRINKLES[made % SPRINKLES.length],
          transform: `rotate(${Math.round(rnd() * 180)} ${f1(cx + x)} ${f1(cy + y)})`
        }, cakeG);
        made++;
      }
    }
    el("rect", { x: 0, y: 268, width: 400, height: 32, class: "table" }, cakeG);
    el("rect", { x: 0, y: 268, width: 400, height: 3, class: "table-edge" }, cakeG);
    el("ellipse", { cx: 200, cy: 268, rx: 160, ry: 14, class: "plate" }, cakeG);
    el("ellipse", { cx: 200, cy: 266, rx: 142, ry: 9, class: "plate-in" }, cakeG);
    el("ellipse", { cx: 200, cy: 266, rx: 124, ry: 6, class: "cake-shadow" }, cakeG);
    el("rect", { x: 80, y: 186, width: 240, height: 80, rx: 12, class: "tier-b" }, cakeG);
    el("path", { d: dripPath(80, 320, 182, 198), class: "drip-b" }, cakeG);
    el("rect", { x: 80, y: 182, width: 240, height: 84, rx: 12, fill: "url(#side)" }, cakeG);
    el("ellipse", { cx: 200, cy: 186, rx: 120, ry: 11, class: "top-b" }, cakeG);
    sprinkles(200, 186, 114, 8, 16, 84);
    el("rect", { x: 120, y: 128, width: 160, height: 64, rx: 10, class: "tier-t" }, cakeG);
    el("path", { d: dripPath(120, 280, 124, 138), class: "drip-t" }, cakeG);
    el("rect", { x: 120, y: 124, width: 160, height: 68, rx: 10, fill: "url(#side)" }, cakeG);
    el("ellipse", { cx: 200, cy: 128, rx: 80, ry: 10, class: "top-t" }, cakeG);
    sprinkles(200, 128, 74, 7, 26, 0);
    for (let x = 88; x <= 312; x += 12) el("circle", { cx: x, cy: 261, r: 3.2, class: "pearl" }, cakeG);
    for (let x = 127; x <= 273; x += 11) el("circle", { cx: x, cy: 189, r: 2.6, class: "pearl" }, cakeG);

    /* ---------- 2. Candles ---------- */
    let candles = [], count = 5;
    function buildCandles(n) {
      candlesG.textContent = "";
      flamesG.textContent = "";
      btnWrap.textContent = "";
      const span = n > 1 ? Math.min(120, (n - 1) * 26) : 0;
      const step = n > 1 ? span / (n - 1) : 0;
      candles = [];
      for (let i = 0; i < n; i++) {
        candles.push({
          i, x: 200 - span / 2 + i * step,
          baseY: 131 + (n > 3 ? (i % 2 ? 5 : -2) : 1), // zigzag rows add depth
          h: 30 + ((i * 7) % 3) * 3,
          ph: Math.random() * 6.28, sens: 0.7 + Math.random() * 0.9,
          lit: true, wind: 0, size: -i * 0.22         // negative size = staggered light-up
        });
      }
      candles.slice().sort((a, b) => a.baseY - b.baseY).forEach(drawCandle);
      const w = n > 1 ? Math.min(7, (step / 400) * 100 * 0.95) : 7;
      candles.forEach((c) => makeButton(c, w));
    }
    function drawCandle(c) {
      const g = el("g", { transform: `translate(${f1(c.x)} ${c.baseY})` }, candlesG);
      el("ellipse", { cx: 0, cy: 0, rx: 7, ry: 2.6, class: "rosette" }, g);
      el("rect", { x: -4.5, y: -c.h, width: 9, height: c.h, rx: 2, fill: `url(#st${c.i % 5})` }, g);
      el("rect", { x: -3, y: -c.h + 2, width: 1.8, height: c.h - 4, rx: 0.9, fill: "#fff", opacity: 0.35 }, g);
      c.shadeEl = el("rect", { x: -4.5, y: -c.h, width: 9, height: c.h, rx: 2, class: "c-shade" }, g);
      el("path", { d: `M0 ${-c.h} q1.6 -3 0 -6`, class: "wick" }, g);
      // the flame lives in its own layer so its glow sits above every candle
      c.fg = el("g", {}, flamesG);
      c.halo = el("circle", { r: 30, cy: -10, fill: "url(#halo)" }, c.fg);
      el("path", { d: "M0 2 C-7 -2 -7.5 -12 0 -25 C7.5 -12 7 -2 0 2Z", fill: "url(#flameOuter)" }, c.fg);
      el("path", { d: "M0 1 C-3.6 -1 -3.8 -7 0 -14 C3.8 -7 3.6 -1 0 1Z", fill: "#fff8dc" }, c.fg);
      el("ellipse", { cx: 0, cy: -1, rx: 2.4, ry: 3, fill: "#7fb2ff", opacity: 0.75 }, c.fg);
    }
    function makeButton(c, w) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "flame-btn";
      b.style.left = (c.x / 4).toFixed(2) + "%";
      b.style.top = ((c.baseY - c.h - 16) / 3).toFixed(2) + "%";
      b.style.width = w.toFixed(2) + "%";
      b.addEventListener("click", () => putOut(c));
      c.btn = b;
      labelButton(c);
      btnWrap.appendChild(b);
    }
    function labelButton(c) {
      c.btn.setAttribute("aria-label", c.lit ? `Blow out candle ${c.i + 1}` : `Candle ${c.i + 1} is out`);
      if (c.lit) c.btn.removeAttribute("aria-disabled");
      else c.btn.setAttribute("aria-disabled", "true");
    }

    /* ---------- 3. Status, putting out, the party ---------- */
    let party = false, finaleTimer = 0, relighting = false;
    const litCount = () => candles.filter((c) => c.lit).length;
    const plural = (n) => `${n} ${n === 1 ? "candle" : "candles"}`;
    const who = () => nameIn.value.trim() || "friend";
    const say = (text) => { statusEl.textContent = text; };
    const sayLit = () => say(`${plural(litCount())} lit. Blow, hold the button, or tap a flame.`);

    function putOut(c) {
      if (!c.lit) return;
      c.lit = false;
      c.wind = 0;
      labelButton(c);
      puffSmoke(c);
      sparks(c, 6);
      const left = litCount();
      clearTimeout(finaleTimer);
      if (left > 0) say(`Whoosh! ${plural(left)} still lit.`);
      else {
        say("All out!");
        finaleTimer = setTimeout(startParty, reduce.matches ? 200 : 650);
      }
    }
    function startParty() {
      if (party || litCount() > 0) return;
      party = true;
      room.classList.add("party");
      say(`All out! Happy birthday, ${who()}! Make a wish.`);
      if (stream) { stopMic(); micMsg.textContent = "Microphone switched off. Turn it on again for the next round."; }
      launchConfetti();
    }
    function endParty() {
      party = false;
      clearTimeout(finaleTimer);
      room.classList.remove("party");
    }
    function relight() {
      if (relighting) return;
      endParty();
      const dark = candles.filter((c) => !c.lit);
      if (!dark.length) { say("Every candle is already lit."); return; }
      relighting = true;
      // one by one, like a match moving along the cake
      dark.forEach((c, k) => setTimeout(() => {
        if (!candles.includes(c)) return; // the cake was rebuilt meanwhile
        c.lit = true; c.size = 0; c.wind = 0; c.sens = 0.7 + Math.random() * 0.9;
        labelButton(c);
        sparks(c, 5);
        if (k === dark.length - 1) { relighting = false; sayLit(); }
      }, k * (reduce.matches ? 80 : 230)));
    }
    relightBtn.addEventListener("click", relight);

    function setCount(n) {
      count = clamp(n, 1, 9);
      nOut.textContent = String(count);
      minus.disabled = count <= 1;
      plus.disabled = count >= 9;
      if (minus.disabled && document.activeElement === minus) plus.focus();
      if (plus.disabled && document.activeElement === plus) minus.focus();
      endParty();
      relighting = false;
      buildCandles(count);
      sayLit();
    }
    minus.addEventListener("click", () => setCount(count - 1));
    plus.addEventListener("click", () => setCount(count + 1));
    nameIn.addEventListener("input", () => { bName.textContent = who(); });

    /* ---------- 4. Blowing: hold button ---------- */
    let holding = false, holdS = 0;
    const press = () => { holding = true; blowBtn.classList.add("active"); };
    const release = () => { holding = false; blowBtn.classList.remove("active"); };
    blowBtn.addEventListener("pointerdown", (e) => { blowBtn.setPointerCapture(e.pointerId); press(); });
    ["pointerup", "pointercancel", "lostpointercapture", "blur"].forEach((ev) => blowBtn.addEventListener(ev, release));
    blowBtn.addEventListener("contextmenu", (e) => e.preventDefault());
    blowBtn.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!e.repeat) press(); }
    });
    blowBtn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); });

    /* ---------- 5. Blowing: microphone ---------- */
    const THR = 0.12, FULL = 0.5; // RMS threshold and the level that fills the meter
    let stream = null, audio = null, analyser = null, bytes = null;
    let level = 0, above = 0, quiet = 0, micS = 0, micBusy = false;

    async function startMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        micMsg.textContent = "This browser can't use a microphone here. Hold the button or tap a flame instead.";
        return;
      }
      micMsg.textContent = "Asking for the microphone…";
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        const AC = window.AudioContext || window.webkitAudioContext;
        audio = new AC();
        if (audio.state === "suspended") await audio.resume();
        analyser = audio.createAnalyser();
        analyser.fftSize = 1024;
        audio.createMediaStreamSource(stream).connect(analyser);
        bytes = new Uint8Array(analyser.fftSize);
        micBtn.setAttribute("aria-pressed", "true");
        micLabel.textContent = "Stop microphone";
        meter.classList.add("live");
        micMsg.textContent = "Microphone on. Blow until the bar passes the line.";
      } catch (err) {
        stopMic();
        const name = err && err.name;
        micMsg.textContent = name === "NotAllowedError" || name === "SecurityError"
          ? "Microphone access was blocked. Hold the button or tap a flame instead."
          : name === "NotFoundError"
            ? "No microphone was found. Hold the button or tap a flame instead."
            : "The microphone could not start here. Hold the button or tap a flame instead.";
      }
    }
    function stopMic() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (audio && audio.state !== "closed") {
        const closing = audio.close();
        if (closing && closing.catch) closing.catch(() => {});
      }
      stream = null; audio = null; analyser = null; micS = 0; above = 0;
      micBtn.setAttribute("aria-pressed", "false");
      micLabel.textContent = "Use microphone";
      meter.classList.remove("live", "hot");
    }
    micBtn.addEventListener("click", async () => {
      if (micBusy) return;
      if (stream) { stopMic(); micMsg.textContent = "Microphone off."; return; }
      micBusy = true;
      await startMic();
      micBusy = false;
    });
    function readMic(dt) {
      if (!analyser) { level = Math.max(0, level - dt * 0.8); micS = 0; return; }
      analyser.getByteTimeDomainData(bytes);
      let sum = 0;
      for (let k = 0; k < bytes.length; k++) { const v = (bytes[k] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / bytes.length);
      level = Math.max(rms, level - dt * 0.8); // fast rise, gentle fall
      // a blow is loud for a while; a click or a word is not
      if (rms > THR) { above += dt; quiet = 0; }
      else { quiet += dt; if (quiet > 0.08) above = 0; }
      micS = above >= 0.12 ? clamp(0.4 + (rms - THR) / 0.25) : 0;
    }
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) return;
      release();
      if (stream) { stopMic(); micMsg.textContent = "Microphone turned off while the page was hidden."; }
    });
    window.addEventListener("pagehide", stopMic);

    /* ---------- 6. Effects canvas: embers, sparks, smoke, confetti, streamers, balloons ---------- */
    const parts = [];
    let W = 0, H = 0, svgRect = svg.getBoundingClientRect();
    let smokeRGB = "160,150,165";
    function readColours() {
      smokeRGB = getComputedStyle(document.documentElement).getPropertyValue("--smoke-rgb").trim() || smokeRGB;
    }
    function sizeCanvas() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      fx.width = Math.round(W * dpr);
      fx.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", sizeCanvas);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColours);

    // SVG point -> page point (k = how many page px one SVG unit is)
    function toPage(x, y) {
      const r = svgRect;
      return { x: r.left + (x / 400) * r.width, y: r.top + (y / 300) * r.height, k: r.width / 400 };
    }
    const wickTop = (c) => toPage(c.x, c.baseY - c.h - 6);

    function ember(c) {
      const p = toPage(c.x, c.baseY - c.h - 28);
      parts.push({ type: "ember", x: p.x, y: p.y, vx: (Math.random() - 0.5) * 14 * p.k, vy: -(28 + Math.random() * 36) * p.k, r: (0.6 + Math.random() * 0.8) * p.k, ph: Math.random() * 6.28, age: 0, life: 0.9 + Math.random() * 0.6 });
    }
    function sparks(c, n) {
      if (reduce.matches) return;
      const p = wickTop(c);
      for (let i = 0; i < n; i++) {
        parts.push({ type: "spark", x: p.x, y: p.y - 6 * p.k, vx: (Math.random() - 0.5) * 180 * p.k, vy: -(60 + Math.random() * 110) * p.k, g: 420 * p.k, r: 1.1 * p.k, age: 0, life: 0.45 + Math.random() * 0.3 });
      }
    }
    function puffSmoke(c) {
      const p = wickTop(c), calm = reduce.matches, n = calm ? 3 : 12;
      for (let i = 0; i < n; i++) {
        parts.push({ type: "smoke", x0: p.x, x: p.x, y: p.y - (calm ? i * 6 * p.k : 0), vy: -(22 + Math.random() * 10) * p.k, ph: Math.random() * 6.28, age: -i * 0.07, life: calm ? 1.2 : 2.3, r0: 1.6 * p.k, grow: 5 * p.k, k: p.k, still: calm });
      }
    }
    const CONF = ["#ff5d8f", "#ffd23f", "#3ec1d3", "#8ac926", "#b388ff", "#ff9f45", "#ffffff"];
    function launchConfetti() {
      const r = room.getBoundingClientRect(), k = r.width / 520;
      const pick = () => CONF[Math.floor(Math.random() * CONF.length)];
      if (reduce.matches) {
        // no flying: confetti simply appears across the room and fades
        for (let i = 0; i < 60; i++) {
          parts.push({ type: "conf", still: true, x: r.left + Math.random() * r.width, y: r.top + Math.random() * r.height, rot: Math.random() * 6.28, flip: 0, w: 8 * k, h: 4 * k, c: pick(), age: 0, life: 2.6 });
        }
        return;
      }
      [[r.left + 8, 1], [r.right - 8, -1]].forEach(([x0, dir]) => {
        for (let i = 0; i < 70; i++) {
          const a = ((-90 + dir * (24 + Math.random() * 34)) * Math.PI) / 180, sp = (520 + Math.random() * 560) * k;
          parts.push({
            type: "conf", x: x0, y: r.bottom - 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 520 * k, k,
            rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 14, flip: Math.random() * 6.28, flipV: 6 + Math.random() * 8,
            ph: Math.random() * 6.28, w: (6 + Math.random() * 5) * k, h: (3 + Math.random() * 3) * k, c: pick(), age: Math.random() * -0.25, life: 6.5
          });
        }
        for (let i = 0; i < 7; i++) {
          const a = ((-90 + dir * (20 + Math.random() * 30)) * Math.PI) / 180, sp = (480 + Math.random() * 380) * k;
          parts.push({ type: "streamer", x: x0, y: r.bottom - 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 260 * k, k, ph: Math.random() * 6.28, c: pick(), trail: [], age: 0, life: 5 });
        }
      });
      for (let i = 0; i < 6; i++) {
        const x = r.left + (0.1 + i * 0.16 + Math.random() * 0.04) * r.width;
        parts.push({ type: "balloon", x0: x, x, y: r.bottom + 30 + Math.random() * 90, vy: -(55 + Math.random() * 35) * k, r: (14 + Math.random() * 5) * k, k, ph: Math.random() * 6.28, c: CONF[i % 6], age: 0, life: 14 });
      }
    }

    function stepParts(dt) {
      ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += dt;
        const gone = p.type === "balloon" ? p.y < -160 : p.y > H + 60;
        if (p.age >= p.life || gone) { parts.splice(i, 1); continue; }
        if (p.age < 0) continue; // waiting for its turn
        const fade = clamp(1 - p.age / p.life);
        ctx.globalAlpha = 1;
        switch (p.type) {
          case "ember":
            p.vx += Math.sin(p.age * 9 + p.ph) * 20 * dt; // drifts as it rises
            p.x += p.vx * dt; p.y += p.vy * dt;
            ctx.fillStyle = `rgba(255,176,80,${(fade * 0.9).toFixed(3)})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
            break;
          case "spark":
            p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
            ctx.fillStyle = `rgba(255,214,120,${fade.toFixed(3)})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
            break;
          case "smoke": {
            if (!p.still) { p.y += p.vy * dt; p.x = p.x0 + Math.sin(p.age * 3 + p.ph) * p.age * 8 * p.k; }
            const r = p.r0 + p.age * p.grow;
            ctx.fillStyle = `rgba(${smokeRGB},${(0.38 * fade).toFixed(3)})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
            break;
          }
          case "conf":
            if (!p.still) {
              p.vy += p.g * dt;
              const drag = Math.max(0, 1 - 2.1 * dt);
              p.vx *= drag; p.vy *= drag;
              p.vx += Math.sin(p.age * 4 + p.ph) * 40 * p.k * dt; // flutter
              p.x += p.vx * dt; p.y += p.vy * dt;
              p.rot += p.spin * dt; p.flip += p.flipV * dt;
            }
            ctx.globalAlpha = clamp((p.life - p.age) / 0.8);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.scale(1, Math.cos(p.flip)); // paper turning over
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
            break;
          case "streamer":
            p.vy += p.g * dt;
            p.vx *= Math.max(0, 1 - 1.6 * dt); p.vy *= Math.max(0, 1 - 1.6 * dt);
            p.vx += Math.sin(p.age * 7 + p.ph) * 160 * p.k * dt; // curly ribbon
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.trail.push({ x: p.x, y: p.y });
            if (p.trail.length > 16) p.trail.shift();
            ctx.globalAlpha = clamp((p.life - p.age) / 1);
            ctx.strokeStyle = p.c;
            ctx.lineWidth = 2.6 * p.k;
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.beginPath();
            p.trail.forEach((q, j) => (j ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
            ctx.stroke();
            break;
          case "balloon": {
            p.y += p.vy * dt;
            p.x = p.x0 + Math.sin(p.age * 1.3 + p.ph) * 12 * p.k;
            const by = p.y + p.r * 1.2;
            ctx.strokeStyle = "rgba(130,118,140,0.75)";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, by);
            ctx.quadraticCurveTo(p.x + Math.sin(p.age * 2) * 8 * p.k, by + 22 * p.k, p.x, by + 44 * p.k);
            ctx.stroke();
            ctx.fillStyle = p.c;
            ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(p.x, by - 2); ctx.lineTo(p.x - 3 * p.k, by + 4 * p.k); ctx.lineTo(p.x + 3 * p.k, by + 4 * p.k); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.ellipse(p.x - p.r * 0.35, p.y - p.r * 0.45, p.r * 0.2, p.r * 0.34, -0.4, 0, Math.PI * 2); ctx.fill();
            break;
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    /* ---------- 7. Main loop: flames, wind, room light ---------- */
    let prev = performance.now(), T = 0, blowVis = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      T += dt;
      const calm = reduce.matches;
      svgRect = svg.getBoundingClientRect();

      holdS = holding ? Math.min(1, Math.max(holdS, 0.35) + dt * 2.2) : Math.max(0, holdS - dt * 4);
      readMic(dt);
      lvl.style.width = (clamp(level / FULL) * 100).toFixed(1) + "%";
      meter.classList.toggle("hot", micS > 0);
      const blow = litCount() ? Math.max(holdS, micS) : 0;
      blowVis += (blow - blowVis) * Math.min(1, dt * 10);

      let light = 0;
      for (const c of candles) {
        if (c.lit) {
          c.size = Math.min(1, c.size + dt / 0.35);
          // each candle gathers "wind" while you blow and goes out past a limit
          if (blow > 0 && c.size >= 1) { c.wind += blow * dt * c.sens; if (c.wind > 0.6) putOut(c); }
          else c.wind = Math.max(0, c.wind - dt * 0.5);
        } else {
          c.size = Math.max(0, c.size - dt / 0.15);
        }
        const grow = clamp(c.size);
        const ds = c.lit && !calm ? easeBack(grow) : grow;
        light += Math.min(1, ds);
        // flicker: two sine waves at odd speeds; blowing leans and squashes the flame
        const n1 = calm ? 0 : Math.sin(T * 13 + c.ph) * 0.5 + Math.sin(T * 7.3 + c.ph * 2) * 0.5;
        const gust = blowVis * (calm ? 0.3 : 1);
        const lean = (calm ? 0 : Math.sin(T * 5.1 + c.ph) * 4) - gust * (24 + (calm ? 0 : 8 * Math.sin(T * 23 + c.ph)));
        const sy = Math.max(0.001, (1 + 0.09 * n1) * (1 - 0.35 * gust) * ds);
        const sx = Math.max(0.001, (1 - 0.05 * n1) * (1 + 0.18 * gust) * ds);
        c.fg.setAttribute("transform", `translate(${f1(c.x)} ${c.baseY - c.h - 6}) skewX(${lean.toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
        c.fg.style.opacity = ds > 0.02 ? "1" : "0";
        c.halo.style.opacity = (0.8 + 0.15 * n1 - 0.35 * gust).toFixed(2);
        c.shadeEl.style.opacity = party ? "0" : ((1 - Math.min(1, ds)) * 0.55).toFixed(2);
        if (!calm && c.lit && grow >= 1 && Math.random() < dt * 1.3) ember(c);
      }

      // the wall glow grows with the number of lit candles and flickers with them
      const frac = candles.length ? light / candles.length : 0;
      const flick = calm ? 0 : Math.sin(T * 11) * 0.5 + Math.sin(T * 17.3) * 0.3 + Math.sin(T * 5.1) * 0.2;
      room.style.setProperty("--a", (0.06 + 0.5 * frac * (1 + 0.1 * flick)).toFixed(3));
      room.style.setProperty("--r", (svgRect.width * (0.1 + 0.26 * frac) * (1 + 0.04 * flick)).toFixed(1) + "px");
      shade.style.opacity = party ? "0" : (0.82 - 0.64 * frac).toFixed(2);
      bunting.style.opacity = party ? "1" : (0.16 + 0.3 * frac).toFixed(2);

      stepParts(dt);
      requestAnimationFrame(frame);
    }

    readColours();
    sizeCanvas();
    setCount(5);
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
