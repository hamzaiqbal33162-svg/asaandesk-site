<!doctype html>
<!-- Chill & Craft · Zap Rail · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zap Rail · menu underline that jumps like a spark</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #edf0f6;
    --grid: rgba(18, 24, 38, 0.06);
    --card: #ffffff;
    --edge: #dfe4ee;
    --ink: #121826;
    --muted: #5b6477;
    --soft: #f3f5fa;
    --core: #0b5cff;
    --glow: #38c6ff;
    --spark: #ffb800;
    --focus: #0b5cff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a0d13;
    --grid: rgba(120, 200, 255, 0.05);
    --card: #121722;
    --edge: #222a3a;
    --ink: #eef3ff;
    --muted: #8e98ad;
    --soft: #171e2c;
    --core: #fff7b8;
    --glow: #44e0ff;
    --spark: #ffe14d;
    --focus: #44e0ff;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card {
    width: min(640px, 100%);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 22px;
    box-shadow: 0 30px 60px -40px rgba(10, 30, 80, 0.5);
    overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 4px; }
  .head .mark {
    width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
    background: var(--ink); color: var(--glow);
  }
  .head .mark svg { width: 18px; height: 18px; fill: currentColor; }
  .head b { font-size: 15px; letter-spacing: -0.01em; }
  .head small { display: block; color: var(--muted); font-size: 12px; }

  /* ---------- The menu ---------- */
  .rail { position: relative; padding: 0 12px; border-bottom: 1px solid var(--edge); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative;
    flex: none;
    border: 0;
    background: none;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    padding: 16px 12px 18px;
    cursor: pointer;
    border-radius: 10px 10px 0 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color 0.2s, transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .tab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .tab:hover { color: var(--ink); }
  .tab:hover svg { transform: rotate(-10deg) scale(1.12); }
  .tab:active { transform: scale(0.93); transition-duration: 0.08s; }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab:focus-visible { outline-offset: -4px; }
  /* the item the spark lands on gets a little electric shock */
  .tab.shock { animation: shock 0.36s steps(6); }
  .tab.shock svg { animation: jolt 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); color: var(--glow); }
  @keyframes shock {
    20% { transform: translate(1px, -1px); text-shadow: 0 0 8px var(--glow); }
    40% { transform: translate(-1px, 1px); }
    60% { transform: translate(1px, 0); text-shadow: 0 0 12px var(--glow); }
    80% { transform: translate(-1px, 0); }
  }
  @keyframes jolt { from { transform: scale(1.6) rotate(-18deg); filter: drop-shadow(0 0 6px var(--glow)); } }
  .head .mark.flicker { animation: flick 0.4s steps(4); }
  @keyframes flick { 25% { opacity: 0.3; } 50% { opacity: 1; } 75% { opacity: 0.5; } }

  /* the underline: placed by JS, it shrinks away and flashes back on the new item */
  .wire {
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 3px;
    width: 40px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--glow), var(--core), var(--glow));
    box-shadow: 0 0 10px var(--glow);
    transform-origin: center;
    transition: transform 0.16s ease-in;
    pointer-events: none;
  }
  .wire.off { transform: scaleX(0); }
  .wire.flash { animation: flash 0.45s ease-out; }
  @keyframes flash {
    0% { transform: scaleX(0.2); box-shadow: 0 0 26px 4px var(--glow); }
    40% { transform: scaleX(1.12); }
    100% { transform: scaleX(1); box-shadow: 0 0 10px var(--glow); }
  }

  /* the spark overlay sits over the whole menu */
  .zap { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .zap .halo { fill: none; stroke: var(--glow); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; filter: url(#zap-blur); }
  .zap .bolt { fill: none; stroke: var(--core); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .zap .fork { fill: none; stroke: var(--core); stroke-width: 1.2; stroke-linecap: round; opacity: 0.8; }
  .zap .spark { stroke: var(--spark); stroke-width: 2; stroke-linecap: round; }

  /* ---------- Panel content ---------- */
  .panel { padding: 20px; min-height: 230px; }
  .panel h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
  .panel p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; font-size: 14px; max-width: 52ch; }
  .panel.enter { animation: in 0.35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .facts { perspective: 700px; }
  .fact { background: var(--soft); border: 1px solid var(--edge); border-radius: 14px; padding: 12px; font-size: 13px; color: var(--muted); transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1), border-color 0.25s; }
  .fact:hover { transform: translateY(-3px); border-color: var(--glow); }
  .fact.in { animation: fact-in 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
  @keyframes fact-in { from { opacity: 0; transform: translateY(14px) rotateX(-45deg); } }
  .fact b { display: block; color: var(--ink); font-size: 18px; }

  @media (max-width: 520px) {
    .tab svg { display: none; }
  }
  @media (max-width: 420px) {
    .rail { padding: 0 6px; }
    .tab { padding: 16px 9px 18px; font-size: 13.5px; }
    .panel { padding: 18px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="card">
    <header class="head">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 13.5h6.5L9 22l11-12.5h-6.8z"/></svg></span>
      <div><b>Voltline</b><small>Home solar kits</small></div>
    </header>

    <div class="rail" id="rail">
      <div class="tabs" role="tablist" aria-label="Voltline sections">
        <button class="tab" role="tab" id="t0" aria-controls="panel" aria-selected="true" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Overview</button>
        <button class="tab" role="tab" id="t1" aria-controls="panel" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>Plans</button>
        <button class="tab" role="tab" id="t2" aria-controls="panel" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1.5 5.5-1.5 8 0v15c-2.5-1.5-5-1.5-8 0zM12 5c2.5-1.5 5-1.5 8 0v15c-3-1.5-5.5-1.5-8 0"/></svg>Guides</button>
        <button class="tab" role="tab" id="t3" aria-controls="panel" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.5-2 2.5-5 2.5"/></svg>Support</button>
      </div>
      <span class="wire" id="wire" aria-hidden="true"></span>
      <svg class="zap" id="zap" aria-hidden="true">
        <defs><filter id="zap-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5" /></filter></defs>
        <g id="zap-layer"></g>
      </svg>
    </div>

    <section class="panel" id="panel" role="tabpanel" aria-labelledby="t0" tabindex="0"></section>
  </div>
</main>

<script>
  (function () {
    var rail = document.getElementById("rail");
    var tabs = Array.prototype.slice.call(rail.querySelectorAll(".tab"));
    var wire = document.getElementById("wire");
    var layer = document.getElementById("zap-layer");
    var panel = document.getElementById("panel");
    var mark = document.querySelector(".head .mark");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var NS = "http://www.w3.org/2000/svg";
    var active = 0;   // the selected tab
    var shown = 0;    // where the underline is right now (can differ while hovering)
    var token = 0;    // cancels an older spark when a new one starts
    var hoverTimer = 0;

    // ---------- Panel content ----------
    function fact(label, value) { return '<div class="fact"><b>' + value + "</b>" + label + "</div>"; }
    var panels = [
      { h: "Keep the fans on", p: "A quiet battery and two roof panels that carry a small home through load-shedding.",
        f: fact("backup for fans and lights", "9 hours") + fact("to install", "1 day") + fact("warranty", "5 years") },
      { h: "Pick a plan", p: "Pay once or in easy monthly steps. Prices include fitting in Lahore, Karachi and Islamabad.",
        f: fact("Starter, 1 kW", "PKR 185,000") + fact("Family, 3 kW", "PKR 420,000") + fact("Monthly, 3 kW", "PKR 21,500") },
      { h: "Short guides", p: "Plain-language help for looking after your panels and battery.",
        f: fact("Cleaning dusty panels", "4 min") + fact("Reading the battery light", "2 min") + fact("Saving on summer bills", "5 min") },
      { h: "We pick up", p: "Real people on the phone every day from 9 am to 9 pm, with a site visit within 48 hours.",
        f: fact("reply time", "12 min") + fact("cities covered", "14") }
    ];
    function render(i) {
      var d = panels[i];
      panel.innerHTML = "<h2>" + d.h + "</h2><p>" + d.p + '</p><div class="facts">' + d.f + "</div>";
      panel.setAttribute("aria-labelledby", tabs[i].id);
      panel.classList.remove("enter");
      void panel.offsetWidth;
      panel.classList.add("enter");
      Array.prototype.forEach.call(panel.querySelectorAll(".fact"), function (el, k) {
        el.style.animationDelay = 120 + k * 80 + "ms";
        el.classList.add("in");
      });
    }

    // ---------- Geometry helpers ----------
    function spanOf(i) {
      var r = rail.getBoundingClientRect();
      var t = tabs[i].getBoundingClientRect();
      return { left: t.left - r.left + 10, width: t.width - 20, mid: t.left - r.left + t.width / 2 };
    }
    function placeWire(i) {
      var s = spanOf(i);
      wire.style.left = s.left + "px";
      wire.style.width = s.width + "px";
    }
    function sizeZap() {
      var svg = layer.ownerSVGElement;
      svg.setAttribute("viewBox", "0 0 " + rail.clientWidth + " " + rail.clientHeight);
    }

    // ---------- Drawing the spark ----------
    // A jagged path that arcs up from one tab to the other.
    function boltPoints(x1, x2, y) {
      var dist = Math.abs(x2 - x1);
      var n = Math.max(6, Math.round(dist / 16));
      var lift = Math.min(30, 10 + dist * 0.12);
      var pts = [];
      for (var i = 0; i <= n; i++) {
        var t = i / n;
        var jitter = i === 0 || i === n ? 0 : (Math.random() - 0.5) * 12;
        pts.push([x1 + (x2 - x1) * t + (i === 0 || i === n ? 0 : (Math.random() - 0.5) * 6), y - Math.sin(Math.PI * t) * lift + jitter]);
      }
      return pts;
    }
    function toPath(pts) {
      return pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("");
    }
    function make(tag, cls, attrs) {
      var el = document.createElementNS(NS, tag);
      el.setAttribute("class", cls);
      for (var k in attrs) el.setAttribute(k, attrs[k]);
      layer.appendChild(el);
      return el;
    }
    function spark(x1, x2, myToken) {
      layer.textContent = "";
      var y = rail.clientHeight - 2;
      var pts = boltPoints(x1, x2, y);
      var halo = make("path", "halo", { d: toPath(pts) });
      var bolt = make("path", "bolt", { d: toPath(pts) });
      // a short fork that splits off near the middle
      var m = pts[Math.floor(pts.length / 2)];
      var fork = make("path", "fork", { d: "M" + m[0] + " " + m[1] + "l" + (Math.random() * 16 - 8) + " -9l" + (Math.random() * 10 - 5) + " -7" });
      var len = bolt.getTotalLength();
      [halo, bolt].forEach(function (p) {
        p.style.strokeDasharray = len;
        p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 110, easing: "ease-in", fill: "forwards" });
      });
      // flicker: re-roll the jagged shape twice, then fade out
      setTimeout(function () {
        if (myToken !== token) return;
        var d = toPath(boltPoints(x1, x2, y));
        halo.setAttribute("d", d); bolt.setAttribute("d", d);
        halo.style.strokeDasharray = bolt.style.strokeDasharray = "none";
        fork.style.opacity = 0;
      }, 150);
      setTimeout(function () {
        if (myToken !== token) return;
        var d = toPath(boltPoints(x1, x2, y));
        halo.setAttribute("d", d); bolt.setAttribute("d", d);
      }, 210);
      layer.animate([{ opacity: 1 }, { opacity: 0.35 }, { opacity: 1 }, { opacity: 0 }], { duration: 420, delay: 120, easing: "linear", fill: "forwards" });
      // little sparks fly out where the bolt lands
      setTimeout(function () {
        if (myToken !== token) return;
        for (var i = 0; i < 6; i++) {
          var a = -Math.PI * (0.15 + 0.7 * (i / 5));
          var s = make("line", "spark", { x1: x2, y1: y, x2: x2 + Math.cos(a) * 4, y2: y + Math.sin(a) * 4 });
          s.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: "translate(" + Math.cos(a) * 16 + "px," + Math.sin(a) * 16 + "px)", opacity: 0 }],
            { duration: 320, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" });
        }
      }, 110);
    }

    // ---------- Moving the underline ----------
    function jump(to) {
      if (to === shown) return;
      var from = shown;
      shown = to;
      var myToken = ++token;
      if (reduce.matches) {
        placeWire(to);
        return;
      }
      layer.getAnimations && layer.getAnimations().forEach(function (a) { a.cancel(); });
      wire.classList.remove("flash");
      wire.classList.add("off");
      mark.classList.remove("flicker");
      void mark.offsetWidth;
      mark.classList.add("flicker");
      spark(spanOf(from).mid, spanOf(to).mid, myToken);
      setTimeout(function () {
        if (myToken !== token) return;
        wire.style.transition = "none";
        placeWire(to);
        void wire.offsetWidth;
        wire.style.transition = "";
        wire.classList.remove("off");
        wire.classList.add("flash");
        // the landing item gets a jolt
        tabs.forEach(function (t) { t.classList.remove("shock"); });
        void tabs[to].offsetWidth;
        tabs[to].classList.add("shock");
      }, 130);
    }

    function select(i, focus) {
      clearTimeout(hoverTimer);
      if (i !== active) {
        tabs[active].setAttribute("aria-selected", "false");
        tabs[active].tabIndex = -1;
        tabs[i].setAttribute("aria-selected", "true");
        tabs[i].tabIndex = 0;
        active = i;
        render(i);
      }
      if (focus) tabs[i].focus();
      jump(i);
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () { select(i, false); });
      // hovering previews the jump; a short delay keeps fast sweeps calm
      tab.addEventListener("mouseenter", function () {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () { jump(i); }, 70);
      });
      tab.addEventListener("keydown", function (e) {
        var next = null;
        if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
        else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = tabs.length - 1;
        if (next === null) return;
        e.preventDefault();
        select(next, true);
      });
    });
    rail.addEventListener("mouseleave", function () {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function () { jump(active); }, 120);
    });

    function resync() {
      sizeZap();
      wire.style.transition = "none";
      placeWire(shown);
      void wire.offsetWidth;
      wire.style.transition = "";
    }
    window.addEventListener("resize", resync);
    // on very narrow screens the menu can scroll sideways; keep the underline attached
    rail.querySelector(".tabs").addEventListener("scroll", resync, { passive: true });

    render(0);
    sizeZap();
    placeWire(0);
  })();
</script>
</body>
</html>
