<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leafroll · People, hours and pay</title>
<meta name="description" content="A mint glass HR dashboard for a remote team: staff, hours you drag to set, time off board and payroll with payslips.">
<script>
  /* Theme before first paint: ?theme= wins, then the saved choice, then the system */
  (function () { try { var q = new URLSearchParams(location.search).get("theme"), s = null; try { s = JSON.parse(localStorage.getItem("leafroll:theme")); } catch (e) {} document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {} })();
</script>
<style>
/* ---------- Theme tokens: soft mint glass ---------- */
:root{
  --ease:cubic-bezier(.22,.9,.24,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#e6f5ee;--glass:rgba(255,255,255,.52);--glass-2:rgba(255,255,255,.34);--glass-line:rgba(255,255,255,.75);
  --surface:rgba(255,255,255,.55);--surface-solid:#f5fcf9;--surface2:rgba(255,255,255,.6);--text:#0f2b22;--muted:#4d6d62;--line:rgba(15,43,34,.1);--line-strong:rgba(15,43,34,.28);
  --accent:#0f9f76;--accent-ink:#fff;--ok:#0f9f76;--warn:#d98b1b;--bad:#d64b5f;--info:#3f7fe0;
  --c1:#0f9f76;--c2:#4f86ea;--c3:#f0a23b;--c4:#9a78e6;--c5:#e2678c;--c6:#25b5c2;
  --blob1:#8fe0be;--blob2:#7fd6d0;--blob3:#d8f4b0;--blob4:#c7dcff;
  --r-btn:14px;--r-dlg:24px;--r-in:12px;--pad:20px;--fs:14px;
  --shadow:0 10px 40px -12px rgba(16,70,52,.25);--toast-bg:#0f2b22;--tip-bg:#0f2b22;--grid:rgba(15,43,34,.08);--hover:rgba(255,255,255,.55);--track:rgba(15,43,34,.08);--scrim:rgba(14,40,32,.25);
}
[data-theme=dark]{
  --bg:#06120e;--glass:rgba(22,48,40,.5);--glass-2:rgba(22,48,40,.3);--glass-line:rgba(160,255,215,.12);
  --surface:rgba(22,48,40,.55);--surface-solid:#0e211b;--surface2:rgba(30,62,52,.55);--text:#e2f6ee;--muted:#93b8aa;--line:rgba(200,255,230,.1);--line-strong:rgba(200,255,230,.3);
  --accent:#3cdaa6;--accent-ink:#04261b;--ok:#3cdaa6;--warn:#f2b54e;--bad:#ff7a8c;--info:#7ba9ff;
  --c1:#3cdaa6;--c2:#7ba9ff;--c3:#f6bb5c;--c4:#b9a0ff;--c5:#ff8db0;--c6:#4fd3de;
  --blob1:#0f5a45;--blob2:#0c4a52;--blob3:#244a1c;--blob4:#1d2f5c;
  --shadow:0 14px 44px -14px rgba(0,0,0,.6);--toast-bg:#e2f6ee;--toast-ink:#06120e;--tip-bg:#e2f6ee;--tip-ink:#06120e;--grid:rgba(200,255,230,.07);--hover:rgba(60,218,166,.08);--track:rgba(200,255,230,.08);--scrim:rgba(0,0,0,.45);
}
/* ---------- Base: reset and shared components, styled by the theme tokens above ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link,var(--accent))}
h1,h2,h3{line-height:1.2}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.sp{flex:1}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{min-width:0}
.view.quiet .rise{animation:none}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:var(--r-btn,10px);font-weight:600;font-size:.93em;line-height:1.2;white-space:nowrap;transition:transform .15s var(--ease),background .2s,box-shadow .2s,border-color .2s;text-decoration:none}
.btn:hover{border-color:var(--line-strong,var(--muted))}
.btn:active{transform:scale(.95) translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -6px var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:.84em}
.btn .ic{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-btn,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s var(--ease),background .2s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn .cnt{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
[data-theme-toggle] .i-sun{display:none}
[data-theme=dark] [data-theme-toggle] .i-sun{display:block}
[data-theme=dark] [data-theme-toggle] .i-moon{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;font-size:.84em;font-weight:500;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip small{opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-btn,10px);padding:3px;gap:2px;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:calc(var(--r-btn,10px) - 3px);font-size:.84em;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78em;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{--tc:var(--ok)}.tag.warn{--tc:var(--warn)}.tag.bad{--tc:var(--bad)}.tag.info{--tc:var(--info,var(--accent))}.tag.muted{--tc:var(--muted)}
.av{width:32px;height:32px;border-radius:var(--r-av,50%);display:inline-grid;place-items:center;font-weight:700;font-size:.74em;color:#fff;background:hsl(var(--h) var(--av-s,52%) var(--av-l,46%));flex:none;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:1.1em}
.av.open{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.pbar{display:inline-block;width:100%;height:6px;border-radius:6px;background:var(--track,color-mix(in srgb,var(--muted) 18%,transparent));overflow:hidden;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .6s var(--ease)}
.pbar.bad i{background:var(--bad)}.pbar.ok i{background:var(--ok)}.pbar.warn i{background:var(--warn)}
.note-bad{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:.88em}
.empty{display:grid;justify-items:center;gap:4px;padding:26px 10px;color:var(--muted);text-align:center}
.empty .ic{width:30px;height:30px;opacity:.6}
.empty b{color:var(--text)}
/* tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-btn,10px);padding:0 11px;background:var(--surface2);min-width:0;flex:1 1 170px;max-width:300px;color:var(--muted)}
.search input{border:0;background:transparent;padding:8px 0;outline:0;min-width:0;width:100%;color:var(--text)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.search.big{max-width:none;padding:2px 14px;font-size:1.05em}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad,18px) * -1);padding:0 var(--pad,18px)}
.tbl{width:100%;border-collapse:collapse;font-size:.92em;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{transition:background .15s}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover,.tbl tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl .who-c{display:flex;align-items:center;gap:10px}
.tbl .who-c small{display:block;color:var(--muted);font-size:.86em}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit}
.th-sort .arr::after{content:"↕";opacity:.35}
.th-sort.on .arr::after{content:"↑";opacity:1}
.th-sort.on.desc .arr::after{content:"↓"}
.num .th-sort{flex-direction:row-reverse}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:.85em;color:var(--muted);flex-wrap:wrap}
.pbtns{display:flex;gap:4px;flex-wrap:wrap}
.pg{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;display:inline-grid;place-items:center;font-size:.92em}
.pg[aria-current]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pg:disabled{opacity:.4;cursor:default}
.pg.gap{border:0;background:none}
.pg .ic{width:15px;height:15px}
/* modals and drawers */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(10,12,20,.48));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .26s}
.ov.open{opacity:1}
.dlg{background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--r-dlg,16px);width:min(540px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);transform:translateY(18px) scale(.97);transition:transform .32s var(--ease);outline:0}
.ov.open .dlg{transform:none}
.ov.side{place-items:stretch end;padding:0}
.ov.side .dlg{width:min(460px,100%);max-height:none;height:100%;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(104%)}
.ov.side.open .dlg{transform:none}
.dlg.wide{width:min(780px,100%)}
.dlg.sm{width:min(420px,100%)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:1.06em}
.dlg-h .icon-btn{width:34px;height:34px}
.dlg-b{padding:16px 18px;overflow:auto;flex:1}
.dlg-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm-msg{margin:0;color:var(--muted)}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
body.modal-open{overflow:hidden}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{grid-column:span 2;display:grid;gap:5px;min-width:0}
.fld.half{grid-column:span 1}
.fld label{font-size:.82em;font-weight:600;color:var(--muted)}
.fld label i{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-in,9px);padding:9px 11px;width:100%;min-width:0;color:var(--text)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fld [aria-invalid=true]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface2))}
.fld.chk label{display:flex;gap:8px;align-items:center;color:var(--text);font-weight:500;font-size:.92em}
.fld.chk input{width:auto}
.err{color:var(--bad);font-size:.78em;min-height:0}
.err:empty{display:none}
.help{color:var(--muted);font-size:.78em}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
@media (max-width:520px){.fld.half{grid-column:span 2}}
/* toasts */
#toasts{position:fixed;z-index:120;bottom:16px;right:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;background:var(--toast-bg,#15171c);color:var(--toast-ink,#fff);padding:10px 10px 10px 14px;border-radius:var(--r-toast,12px);box-shadow:0 14px 34px -8px rgba(0,0,0,.4);animation:tin .38s var(--ease) both;font-size:.9em;max-width:420px}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .tdot{background:var(--warn)}.toast.bad .tdot{background:var(--bad)}
.tbtn{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.9em}
/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:130;pointer-events:none;background:var(--tip-bg,#14161b);color:var(--tip-ink,#fff);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:9px;opacity:0;transition:opacity .12s;box-shadow:0 10px 24px rgba(0,0,0,.28);max-width:240px}
.tip.on{opacity:1}
.tip div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip div b{margin-left:auto;padding-left:10px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart>svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart svg:focus-visible{outline-offset:4px}
.gy line{stroke:var(--grid,var(--line));stroke-dasharray:3 5}
.gy text,.gx{fill:var(--muted);font-size:11px}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 5;stroke-width:1.6}
.anim .ln:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:drawon 1.4s var(--ease) forwards}
.anim .ar{animation:fadein 1.2s .35s both}
.guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;pointer-events:none}
.dots circle{stroke:var(--surface-solid,var(--surface));stroke-width:2;pointer-events:none}
.col{transform-box:view-box}
.anim .col{animation:grow .85s var(--ease) both;animation-delay:var(--d,0ms)}
.col.dim{opacity:.45}
.refl{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
.refl-t{fill:var(--bad);font-size:11px;font-weight:600}
.col{transition:opacity .2s}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes drawon{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8em;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap>svg{flex:none;height:auto}
.trk{stroke:var(--track,color-mix(in srgb,var(--muted) 16%,transparent))}
.dseg{transition:opacity .2s}
.dseg.dim{opacity:.3}
.anim .sweep{animation:sweep 1.3s var(--ease) both}
@keyframes sweep{from{stroke-dashoffset:var(--C)}}
.dc-v{font-size:22px;font-weight:700;fill:var(--text)}
.dc-s{font-size:11px;fill:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:.88em}
.dl li{display:flex;align-items:center;gap:8px}
.dl li i{width:10px;height:10px;border-radius:3px;flex:none}
.dl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl li em{color:var(--muted);font-style:normal;width:38px;text-align:right}
.gauge .gv{transition:stroke-dasharray .8s var(--ease)}
.anim.gauge .gv{animation:gauge 1.3s var(--ease) both}
@keyframes gauge{from{stroke-dasharray:0 100}}
.anim.hm .hc{animation:fadein .5s both;animation-delay:var(--d)}
.spark{display:block;overflow:visible}
.spark .ln{stroke-width:2}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:.88em}
.hb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l small{display:block;color:var(--muted);font-size:.86em}
.hb-t{height:10px;border-radius:6px;background:var(--track,color-mix(in srgb,var(--muted) 15%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:0;border-radius:inherit;transition:width .9s var(--ease);transition-delay:var(--d)}
.hbars.go .hb-t i{width:var(--w)}
.hb b{font-variant-numeric:tabular-nums}
/* popovers, notifications and command search */
.pop{position:fixed;z-index:90;background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -12px rgba(0,0,0,.35);width:min(340px,calc(100vw - 16px));animation:popin .22s var(--ease);overflow:hidden}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notes{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.notes button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:9px;font-size:.88em;color:var(--text)}
.notes button:hover{background:var(--hover,color-mix(in srgb,var(--accent) 8%,transparent))}
.notes small{display:block;color:var(--muted);font-size:.85em}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.notes .unread .nd{background:var(--accent)}
.notes .unread button{font-weight:600}
.cmdk .dlg-b{padding:12px}
.cmd-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmd-list button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;color:var(--text)}
.cmd-list [aria-selected=true] button{background:var(--accent);color:var(--accent-ink)}
.cmd-list small{opacity:.7}
.cmd-hint{margin:10px 2px 0;font-size:.78em;color:var(--muted)}
/* mobile nav scrim */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s;border:0;padding:0;width:100%}
body.nav-open .scrim{opacity:1;pointer-events:auto}
/* reduced motion: keep every function, drop the big movement */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}}
/* ---------- Pay-out progress and payslip ---------- */
.payout .po-top{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.po-ring{width:84px;height:84px;flex:none}
.po-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.po-arc{stroke:var(--ok);stroke-linecap:round;transition:stroke-dasharray .25s}

  parse() {
    const h = location.hash.replace(/^#\/?/, "");
    const [p, ...rest] = h.split("/");

  },
  start() { addEventListener("hashchange", () => this.render()); this.render(); this.started = true; },
  render(quiet = false) {
    const { page, arg } = this.parse();
    const P = APP.pages[page], main = $("#main");
    if (page !== this.cur || arg !== this.arg) quiet = false;
    this.cur = page; this.arg = arg;
    const keep = {};
    $$("[data-keep-scroll]", main).forEach((el) => (keep[el.dataset.keepScroll] = [el.scrollLeft, el.scrollTop]));
    const y = window.scrollY, my = main.scrollTop;
    Charts.clear(); stopPageTimers(); hideTip(); closePop();
    if (!quiet) Charts.mem.clear();
    const view = document.createElement("div");
    view.className = "view" + (quiet ? " quiet" : "");
    view.dataset.page = page;
    main.replaceChildren(view);
    P.render(view, arg);
    document.title = P.title + " · " + APP.name;
    $$("[data-route]").forEach((a) => (a.dataset.route === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    moveMarker();
    $$("[data-keep-scroll]", main).forEach((el) => { const k = keep[el.dataset.keepScroll]; if (k) { el.scrollLeft = k[0]; el.scrollTop = k[1]; } });
    if (quiet) { window.scrollTo(0, y); main.scrollTop = my; }
    else {
      window.scrollTo(0, 0); main.scrollTop = 0;

/* The sliding marker behind the active nav link */

    const r = a.getBoundingClientRect(), p = nav.getBoundingClientRect();

  t.innerHTML = `<span class="tdot" aria-hidden="true"></span><span class="tmsg">${esc(msg)}</span>`;
  const dismiss = () => { if (t.out) return; t.out = true; t.classList.add("out"); setTimeout(() => t.remove(), calm() ? 0 : 320); };
  if (opt.undo) {
    const b = document.createElement("button");
    b.className = "tbtn"; b.type = "button"; b.textContent = opt.undoLabel || "Undo";
    b.onclick = () => { opt.undo(); dismiss(); };
    t.append(b);
  }
  box.append(t);
  while (box.children.length > 4) box.firstElementChild.remove();
  setTimeout(dismiss, opt.ms || 3800);
}

/* ================================================================
   Payroll: work out a pay run, approve it, "send" payments with a
   progress animation, and open a printable payslip for anyone.
   Tax and fund rates are simple demo estimates, not advice.
   ================================================================ */
/* Monthly salary tax estimate from yearly slabs (demo) */
function taxSlabs(monthly, slabs) {
  const y = monthly * 12;
  let t = 0, prev = 0;
  for (const [cap, rate] of slabs) { if (y > prev) t += (Math.min(y, cap) - prev) * rate; prev = cap; }
  return Math.max(0, t / 12);
}
const SLABS_PK = [[600000, 0], [1200000, 0.01], [2200000, 0.11], [3200000, 0.23], [4100000, 0.3], [Infinity, 0.35]];
const SLABS_INTL = [[12000, 0], [48000, 0.12], [100000, 0.22], [Infinity, 0.3]];

/* One person's pay line. cfg = {hours(p), ot(p), tax(gross), fund, adj: {pid:{bonus,adv,unpaid}}} */
function payLine(p, cfg, adj = {}) {
  const hours = cfg.hours ? cfg.hours(p) : 0, otH = cfg.ot ? cfg.ot(p) : 0;
  const hourly = p.payType === "hourly";
  const base = hourly ? p.rate * Math.max(0, hours - otH) : p.salary;
  const unitRate = hourly ? p.rate : p.salary / 173;
  const otPay = otH * unitRate * 1.5;
  const allow = p.allow || 0, bonus = +adj.bonus || 0;
  const unpaid = (+adj.unpaid || 0) * (hourly ? p.rate * 8 : p.salary / 26);
  const gross = Math.max(0, base + otPay + allow + bonus - unpaid);
  const tax = cfg.tax(gross), fund = base * (cfg.fund ?? 0.05), adv = +adj.adv || 0;
  const ded = tax + fund + adv;
  return { pid: p.id, hours, otH, base, otPay, allow, bonus, unpaid, gross, tax, fund, adv, ded, net: gross - ded };
}
function payRunLines(run, people, cfg) {
  if (run.status !== "draft" && run.lines) return run.lines;
  return people.map((p) => payLine(p, cfg, (run.adj || {})[p.id]));
}
const payTotals = (lines) => ({ gross: sum(lines, (l) => l.gross), ded: sum(lines, (l) => l.ded), net: sum(lines, (l) => l.net), tax: sum(lines, (l) => l.tax), fund: sum(lines, (l) => l.fund), ot: sum(lines, (l) => l.otPay), n: lines.length });

/* Edit bonus, advance and unpaid days for one person in a draft run */
function payAdjust(run, p, cfg, done) {
  const a = (run.adj = run.adj || {})[p.id] || {};
  formModal({
    title: "Adjust pay · " + p.name, side: true, save: "Update run",
    intro: `<p class="muted">Changes apply to ${esc(run.label)} only. Totals update as soon as you save.</p>`,
    fields: [
      { k: "bonus", label: `Bonus or commission (${CUR.sym.trim()})`, type: "number", min: 0, max: 10000000 },
      { k: "adv", label: `Advance to recover (${CUR.sym.trim()})`, type: "number", min: 0, max: 10000000 },
      { k: "unpaid", label: "Unpaid leave days", type: "number", min: 0, max: 26 },
      { k: "why", label: "Note for the payslip", ph: "e.g. Eid bonus, festival advance" },
    ],
    values: { bonus: a.bonus || "", adv: a.adv || "", unpaid: a.unpaid || "", why: a.why || "" },
    onSave: (d) => { run.adj[p.id] = { bonus: +d.bonus || 0, adv: +d.adv || 0, unpaid: +d.unpaid || 0, why: d.why }; save(); toast("Pay updated for " + p.name); done(); },
  });
}

/* Approve: freeze the lines so they stop changing */
async function payApprove(run, people, cfg, done) {
  const lines = payRunLines(run, people, cfg), t = payTotals(lines);
  if (!(await confirmBox(`Approve ${run.label} for ${t.n} people? Net pay ${money(t.net)}. Lines will be locked.`, { title: "Approve pay run?", ok: "Approve", danger: false }))) return;
  run.lines = clone(lines);
  run.status = "approved";

/* Pay: progress through each person, then mark the run paid */
function payOut(run, people, cfg, done) {
  const lines = payRunLines(run, people, cfg), t = payTotals(lines), pm = new Map(people.map((p) => [p.id, p]));
  const m = modal({
    title: "Sending payments", cls: "payout",
    body: `<div class="po-top"><div class="po-ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="50" fill="none" stroke-width="10"/><circle class="po-arc" cx="60" cy="60" r="50" fill="none" stroke-width="10" pathLength="100" style="stroke-dasharray:0 100"/><path class="po-tick" d="M40 62l14 14 28-30" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg></div><div><b class="po-amt" aria-live="polite">${money(0)}</b><small>of ${money(t.net)} to ${t.n} people</small></div></div><ol class="po-list">${lines.map((l) => `<li data-p="${l.pid}"><span class="po-dot" aria-hidden="true"></span><span>${esc((pm.get(l.pid) || {}).name || "")}</span><b>${money(l.net)}</b></li>`).join("")}</ol>`,
    foot: `<button type="button" class="btn pri" data-close disabled>Done</button>`,
  });
  const items = $$(".po-list li", m.el), arc = $(".po-arc", m.el), amt = $(".po-amt", m.el), btn = $("[data-close]", m.el);
  let i = 0, paid = 0;
  const finish = () => {
    run.lines = clone(lines); run.status = "paid"; run.paidOn = Date.now(); save();
    m.el.classList.add("done");
    amt.textContent = money(t.net);
    arc.style.strokeDasharray = "100 100";
    btn.disabled = false; btn.focus();
    notify(`${run.label} paid · ${t.n} payments sent`, "ok");
    toast(`${t.n} payments sent`);
    done();
  };
  if (calm()) { items.forEach((li) => li.classList.add("ok")); finish(); return; }
  const tick = () => {
    if (!m.el.isConnected) { finish(); return; }
    const li = items[i];
    if (li) { li.classList.add("ok"); li.scrollIntoView({ block: "nearest" }); paid += lines[i].net; amt.textContent = money(paid); arc.style.strokeDasharray = `${((i + 1) / items.length) * 100} 100`; }
    i++;
    if (i < items.length) setTimeout(tick, Math.max(40, 1600 / items.length)); else setTimeout(finish, 250);
  };
  setTimeout(tick, 300);
}

/* ---------- Demo data ---------- */

  const ns = names(26, NAMES_INTL);

    return { id: "m" + (i + 1), code: "SP-" + (31 + i), name, team, role: pick(ROLES[team]), city: pl[0], country: pl[1], payType: hourly ? "hourly" : "salary", salary: hourly ? 0 : salary, rate: hourly ? rint(18, 32) : Math.round(salary / 173), allow: hourly ? 0 : pick([0, 0, 100, 150]), start: iso(addDays(TODAY, -rint(20, 1600))), email: name.toLowerCase().replace(/\s+/g, ".") + "@leafroll.example", acct: String(rint(1000, 9999)), pto: rint(6, 22), note: "" };
  });
  const hours = {};
  people.forEach((p) => {
    hours[p.id] = {};
    for (let k = 0; k < 90; k++) { const d = addDays(TODAY, -k), wd = dow(d); if (wd > 4 || iso(d) < p.start || chance(0.05)) continue; hours[p.id][iso(d)] = k === 0 ? +rnd(2, 5).toFixed(1) : Math.round(rnd(6.5, 9.6) * 4) / 4; }
  });
  const off = [];
  for (let i = 0; i < 14; i++) { const p = pick(people), f = addDays(TODAY, rint(-10, 40)), d = pick([1, 2, 3, 5]); off.push({ id: "t" + i, pid: p.id, type: pick(["Vacation", "Vacation", "Sick", "Personal"]), from: iso(f), to: iso(addDays(f, d - 1)), days: d, status: i < 6 ? "Pending" : i < 12 ? "Approved" : "Declined", note: pick(["Trip home", "Wedding", "Dentist", "Recharge week", "Conference"]) }); }
  const runs = [];
  const base = payTotals(people.map((p) => payLine(p, { hours: () => 168, ot: () => 0, tax: (g) => taxSlabs(g, SLABS_INTL), fund: 0.04 })));
  for (let m = 11; m >= 1; m--) { const d = addMonths(TODAY, -m), f = 0.78 + (11 - m) * 0.02 + rnd(-0.015, 0.02); runs.push({ id: "r" + iso(d).slice(0, 7), period: iso(d).slice(0, 7), label: MONTHS_FULL[d.getMonth()] + " " + d.getFullYear(), status: "paid", paidOn: new Date(d.getFullYear(), d.getMonth(), 26).getTime(), totals: { gross: base.gross * f, net: base.net * f, tax: base.tax * f, fund: base.fund * f, n: Math.round(people.length * (0.78 + (11 - m) * 0.02)) } }); }
  runs.push({ id: "r" + monthStart.slice(0, 7), period: monthStart.slice(0, 7), label: MONTHS_FULL[TODAY.getMonth()] + " " + TODAY.getFullYear(), status: "draft", adj: { m4: { bonus: 600, why: "Launch bonus" } } });
  return { people, hours, off, runs, approved: {}, settings: { company: "Leafroll Labs", week: 40, fund: 4, payday: 26 }, notes: [{ id: "a", text: "6 time off requests are waiting", kind: "info", t: Date.now() - 36e5 * 4, read: false, go: "#/timeoff" }, { id: "b", text: "Hours for last week look complete", kind: "ok", t: Date.now() - 36e5 * 20, read: false, go: "#/hours" }] };

/* ---------- The team leafroll: one leaf per person, one branch per team ---------- */
function teamLeafroll(el) {
  el.classList.add("chart", "leafroll");
  Charts.add(el, (first) => {
    const W = Math.max(320, el.clientWidth || 640), H = 320, cx = W / 2, animate = first && !calm();
    const leaf = "M0 0C5-9 17-11 26 0C17 11 5 9 0 0Z";
    let br = "", leaves = "", lbl = "", n = 0;
    TEAMS.forEach((t, i) => {
      const side = i % 2 ? 1 : -1, y0 = H - 50 - i * 42, len = Math.min(W * 0.42, 250), x1 = cx + side * len, y1 = y0 - 46;
      const qx = cx + side * len * 0.45, qy = y0 + 4;
      br += `<path class="sp-br" pathLength="1" style="--d:${0.5 + i * 0.12}s" d="M${cx + side * 2},${y0}Q${qx},${qy} ${x1},${y1}"/>`;
      lbl += `<text class="sp-lbl" x="${x1 + side * 8}" y="${y1 + 4}" text-anchor="${side > 0 ? "start" : "end"}">${esc(t)}</text>`;
      const ps = DB.people.filter((p) => p.team === t);
      ps.forEach((p, k) => {
        const tt = (k + 1) / (ps.length + 1), mx = (1 - tt) * (1 - tt) * cx + 2 * (1 - tt) * tt * qx + tt * tt * x1, my = (1 - tt) * (1 - tt) * y0 + 2 * (1 - tt) * tt * qy + tt * tt * y1;
        const up = k % 2 ? 1 : -1, ang = (side > 0 ? -20 : 200) + up * 38 * side;
        const isNew = p.start >= iso(addDays(TODAY, -60));
        leaves += `<g class="sp-leaf${isNew ? " new" : ""}" data-p="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}, ${esc(p.role)}" transform="translate(${mx.toFixed(1)} ${my.toFixed(1)}) rotate(${ang})" style="--d:${(0.9 + n++ * 0.045).toFixed(2)}s"><path d="${leaf}" style="fill:${TC(t)}"/></g>`;
      });
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="${animate ? "anim" : ""}" role="group" aria-label="Team leafroll: each leaf is a person"><path class="sp-stem" pathLength="1" d="M${cx},${H}C${cx - 8},${H - 120} ${cx + 10},${H - 200} ${cx},22"/>${br}${leaves}${lbl}<circle cx="${cx}" cy="20" r="5" style="fill:var(--accent)"/></svg>`;
    const svg = $("svg", el);
    svg.onpointermove = (e) => { const g = e.target.closest(".sp-leaf"); if (!g) return hideTip(); const p = pById(g.dataset.p); showTip(`<b>${esc(p.name)}</b><div>${esc(p.role)}</div><div>${esc(p.city)}, ${esc(p.country)}</div>`, e.clientX, e.clientY); };
    svg.onpointerleave = hideTip;
    svg.onclick = (e) => { const g = e.target.closest(".sp-leaf"); if (g) openPerson(pById(g.dataset.p)); };
    svg.onkeydown = (e) => { const g = e.target.closest(".sp-leaf"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPerson(pById(g.dataset.p)); } };
  });
}
/* concentric rings: each team's hours this week against its target */

      : `<article class="card s6"><div class="bigpay">${run.status === "paid" ? `<span class="tag ok">Paid ${dshort(new Date(run.paidOn))}</span><b>${money(t.net)}</b><p class="muted">Sent to ${t.n} people. Payslips are ready.</p><button type="button" class="btn pri" data-act="next">${ic("plus")}Start next month</button>` : run.status === "approved" ? `<span class="tag info">Approved</span><b>${money(t.net)}</b><p class="muted">Ready to send ${t.n} transfers</p><button type="button" class="btn pri" data-act="pay">${ic("send")}Pay now</button>` : `<span class="tag warn">Draft</span><b>${money(t.net)}</b><p class="muted">Approve the run first</p><button type="button" class="btn" data-tab="1">Go to approve</button>`}</div></article><article class="card s6"><div class="card-h"><h2>Payslips</h2></div><ul class="list" style="max-height:280px;overflow:auto">${lines.slice(0, 30).map((l) => { const p = pm.get(l.pid); return p ? `<li>${av(p.name)}<div><b>${esc(p.name)}</b><small>${money(l.net)} net</small></div><button type="button" class="btn sm" data-slip="${p.id}">${ic("file")}Open</button></li>` : ""; }).join("")}</ul></article>`}
    </section>`;
  if (payTab === 0) dataTable($("#lines", v), { id: "plines", label: "Pay lines", pageSize: 8, chips: { k: "team", opts: TEAMS }, sort: "name", rows: () => lines.map((l) => Object.assign({ name: (pm.get(l.pid) || {}).name || "Former", team: (pm.get(l.pid) || {}).team }, l)), cols: [{ k: "name", label: "Person", fmt: (x, l) => `<div class="who-c">${av(x)}<div><b>${esc(x)}</b><small>${esc(l.team || "")}</small></div></div>` }, { k: "hours", label: "Hours", num: true, fmt: hrs }, { k: "base", label: "Base", num: true, fmt: (x) => money(x) }, { k: "otPay", label: "Overtime", num: true, fmt: (x) => (x ? money(x) : "–") }, { k: "bonus", label: "Bonus", num: true, fmt: (x) => (x ? "+" + money(x) : "–") }, { k: "ded", label: "Deductions", num: true, fmt: (x) => money(x) }, { k: "net", label: "Net", num: true, fmt: (x) => `<b>${money(x)}</b>` }], onRow: (l) => { const p = pm.get(l.pid); if (!p) return; if (run.status === "draft") payAdjust(run, p, PAYCFG, refresh); else openPayslip(l, p, run, CO()); } });
  if (payTab === 1) donut($("#split", v), { items: [{ name: "Net pay", value: t.net, color: "var(--c1)" }, { name: "Taxes", value: t.tax, color: "var(--c5)" }, { name: "Fund", value: t.fund, color: "var(--c4)" }, { name: "Advances", value: sum(lines, (l) => l.adv), color: "var(--c3)" }], fmt: (n) => money(n, true), center: money(t.gross, true), sub: "gross", label: "Gross pay split" });
  v.addEventListener("click", (e) => {
    const tb = e.target.closest("[data-tab]");
    if (tb) { payTab = +tb.dataset.tab; refresh(); return; }
    const s = e.target.closest("[data-slip]");
    if (s) { const l = lines.find((x) => x.pid === s.dataset.slip); openPayslip(l, pm.get(s.dataset.slip), run, CO()); return; }
    const a = e.target.closest("[data-act]");
    if (!a) return;
    if (a.dataset.act === "approve") payApprove(run, DB.people, PAYCFG, () => { payTab = 2; refresh(); });
    if (a.dataset.act === "reopen") { run.status = "draft"; delete run.lines; save(); payTab = 0; toast("Run reopened"); refresh(); }
    if (a.dataset.act === "pay") payOut(run, DB.people, PAYCFG, refresh);
    if (a.dataset.act === "next") { const d = addMonths(parseISO(run.period + "-01"), 1); run.totals = payTotals(run.lines || lines); DB.runs.push({ id: "r" + iso(d).slice(0, 7), period: iso(d).slice(0, 7), label: MONTHS_FULL[d.getMonth()] + " " + d.getFullYear(), status: "draft", adj: {} }); payTab = 0; save(); toast("New run started"); refresh(); }
    if (a.dataset.act === "csv") download(`leafroll-pay-${run.period}.csv`, toCSV(lines.map((l) => Object.assign({ name: (pm.get(l.pid) || {}).name }, l)), [{ k: "name", label: "Name" }, { k: "gross", label: "Gross", csv: (r) => r.gross.toFixed(2) }, { k: "ded", label: "Deductions", csv: (r) => r.ded.toFixed(2) }, { k: "net", label: "Net", csv: (r) => r.net.toFixed(2) }]), "text/csv");
  });
}

/* ---------- Page: Insights ---------- */
function pgInsights(v) {
  const lines = runLines(), pm = new Map(DB.people.map((p) => [p.id, p]));
  const weeks = [...Array(12)].map((_, i) => addDays(monday(TODAY), (i - 11) * 7));
  const otW = weeks.map((w) => sum(DB.people, (p) => Math.max(0, hoursIn(p.id, iso(w), iso(addDays(w, 6))) - DB.settings.week)));
  const ten = [0, 0, 0, 0, 0];
  DB.people.forEach((p) => { const y = (TODAY - parseISO(p.start)) / (365 * DAY); ten[y < 0.5 ? 0 : y < 1 ? 1 : y < 2 ? 2 : y < 3 ? 3 : 4]++; });
  const byC = {}; DB.people.forEach((p) => (byC[p.country] = (byC[p.country] || 0) + 1));
  v.innerHTML = head("Insights", "How the team is growing, working and paid") +
    `<section class="grid">
      <article class="card s7"><div class="card-h"><h2>Cost by team this month</h2></div><div id="cost"></div></article>
      <article class="card s5"><div class="card-h"><h2>Where people live</h2></div><div id="where"></div></article>
      <article class="card s7"><div class="card-h"><h2>Overtime hours, last 12 weeks</h2></div><div id="otw"></div></article>
      <article class="card s5"><div class="card-h"><h2>Time with us</h2></div><div id="ten"></div></article>
    </section>`;
  hbars($("#cost", v), TEAMS.map((t) => ({ name: t, value: sum(lines.filter((l) => (pm.get(l.pid) || {}).team === t), (l) => l.gross), color: TC(t), sub: DB.people.filter((p) => p.team === t).length + " people" })).sort((a, b) => b.value - a.value), (n) => money(n, true));
  donut($("#where", v), { items: Object.entries(byC).map(([k, n], i) => ({ name: k, value: n, color: `var(--c${(i % 6) + 1})` })), sub: "people", label: "People by country" });
  lineChart($("#otw", v), { labels: weeks.map((w) => dshort(w)), area: true, h: 210, fmt: short, tipFmt: hrs, label: "Overtime per week", series: [{ name: "Overtime", data: otW, color: "var(--c3)" }] });
  barChart($("#ten", v), { labels: ["< 6m", "6–12m", "1–2y", "2–3y", "3y+"], h: 210, fmt: fmt, label: "Tenure", series: [{ name: "People", data: ten, color: "var(--c2)" }] });
}

/* ---------- Page: Settings ---------- */
function pgSettings(v) {
  const s = DB.settings, fields = [{ k: "company", label: "Company name", req: true }, { k: "week", label: "Target hours a week", type: "number", min: 10, max: 60, req: true, half: true }, { k: "payday", label: "Pay day", type: "number", min: 1, max: 28, req: true, half: true }, { k: "fund", label: "Benefits fund (%)", type: "number", min: 0, max: 15, step: 0.5, req: true, half: true }];
  v.innerHTML = head("Settings") + `<section class="grid"><article class="card s7"><div class="card-h"><h2>Company</h2></div><form class="form" id="sf" novalidate>${fields.map((f) => fieldHTML(f, s[f.k])).join("")}<div class="fld"><button type="submit" class="btn pri">Save</button></div></form></article><article class="card s5"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Mint day or deep night</small></div><button type="button" class="btn" data-theme-toggle>${ic("moon", "i-moon")}${ic("sun", "i-sun")}Switch</button></div><div class="set-row"><div><b>Export</b><small>All demo data as JSON</small></div><button type="button" class="btn" data-act="json">${ic("download")}Download</button></div><div class="set-row"><div><b>Reset demo</b><small>Restore the sample team</small></div><button type="button" class="btn danger ghost" data-reset>Reset</button></div></article></section>`;
  Theme.set(Theme.get(), false);
  $("#sf", v).onsubmit = (e) => { e.preventDefault(); const d = readForm(e.target, fields); if (d) { Object.assign(s, d); save(); toast("Settings saved"); } };
  v.addEventListener("click", (e) => { if (e.target.closest('[data-act="json"]')) download("leafroll-data.json", JSON.stringify(DB, null, 2), "application/json"); });
}

/* ---------- App config ---------- */
const APP = {
  key: "leafroll", name: "Leafroll", v: 1, seedNo: 31, home: "home", navAxis: "y", seed: seedData,
  pages: { home: { title: "Home", render: pgHome }, staff: { title: "Staff", render: pgStaff }, hours: { title: "Hours", render: pgHours }, pay: { title: "Pay", render: pgPay }, timeoff: { title: "Time off", render: pgTimeoff }, insights: { title: "Insights", render: pgInsights }, settings: { title: "Settings", render: pgSettings } },
  search: () => DB.people.map((p) => ({ label: p.name, hint: p.role + " · " + p.city, run: () => { go("#/staff"); setTimeout(() => openPerson(p), 60); } })),
};
/* the marker slides down the rail on desktop and across the bottom bar on phones */
const railAxis = () => { const m = $(".nav-marker"); const x = innerWidth <= 900 ? "x" : "y"; if (m.dataset.axis !== x) { m.dataset.axis = x; m.style.width = ""; m.style.height = ""; } };
addEventListener("resize", railAxis);
railAxis();
boot();
</script>
