<!doctype html>
<!-- Chill & Craft · Jump Bar · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump Bar · command palette</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { if (document.documentElement.hasAttribute("data-picked")) return; document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: deep indigo, violet and an electric lime ---------- */
  :root {
    color-scheme: light;
    --bg1: #ecebfa;
    --bg2: #d9d6f2;
    --app: #f7f6fd;
    --side: #1d1a47;
    --side2: #2a2663;
    --on-side: #c9c5f5;
    --panel: #ffffff;
    --line: #e7e4f7;
    --ink: #17142e;
    --ink2: #57527a;
    --soft: #948fb5;
    --violet: #6d4aff;
    --violet2: #a08bff;
    --lime: #c8f53a;
    --on-lime: #1a2200;
    --chip: #f0eefb;
    --good: #138a52;
    --warn: #b7791f;
    --bad: #d03a3a;
    --veil: rgba(29, 26, 71, .32);
    --focus: #6d4aff;
    --spring: cubic-bezier(.34, 1.4, .64, 1);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #15122c;
    --bg2: #07060f;
    --app: #0f0d1d;
    --side: #0a0916;
    --side2: #171433;
    --on-side: #8f89c9;
    --panel: #181530;
    --line: #2a2650;
    --ink: #f0eeff;
    --ink2: #b3add9;
    --soft: #736d9f;
    --violet: #8f7bff;
    --violet2: #b9abff;
    --lime: #d4ff4a;
    --chip: #221e44;
    --good: #4fd896;
    --warn: #f2b84b;
    --bad: #ff6b6b;
    --veil: rgba(4, 3, 12, .55);
    --focus: #b9abff;
  }

  /* ---------- Stage and app ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: var(--sans); color: var(--ink); background: radial-gradient(100% 80% at 30% 0%, var(--bg1), var(--bg2)); overflow: hidden; transition: background .5s; }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .app { position: relative; display: flex; width: min(1060px, 100%); height: min(620px, calc(100vh - 48px)); min-height: 520px; border-radius: 22px; background: var(--app); box-shadow: 0 50px 100px -60px rgba(30, 20, 90, .8), 0 0 0 1px var(--line); overflow: hidden; transition: background .5s; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
  .side { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 72px; padding: 16px 0; background: linear-gradient(180deg, var(--side2), var(--side)); }
  .logo { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 14px; border-radius: 13px; background: var(--lime); color: var(--on-lime); font: 800 17px/1 var(--sans); }
  .nav { position: relative; display: grid; place-items: center; width: 46px; height: 46px; border: 0; border-radius: 14px; background: none; color: var(--on-side); cursor: pointer; transition: background .2s, color .2s; }
  .nav:hover { background: rgba(255, 255, 255, .07); color: #fff; }
  .nav[aria-current="page"] { background: rgba(255, 255, 255, .12); color: var(--lime); }
  .nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .nav.hit { animation: hit .6s var(--spring); }
  @keyframes hit { 30% { transform: scale(.8); } 65% { transform: scale(1.18); } }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 12px; height: 66px; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .crumb { color: var(--soft); font-size: 13.5px; white-space: nowrap; }
  .crumb b { color: var(--ink); font-weight: 650; }
  .pill {
    display: flex; align-items: center; gap: 10px;
    width: min(340px, 42%); height: 40px; margin-left: auto; padding: 0 8px 0 13px;
    border: 0; border-radius: 12px; cursor: text;
    background: var(--chip); color: var(--soft);
    box-shadow: inset 0 0 0 1px var(--line);
    font-size: 14px; text-align: left;
    transition: box-shadow .2s, transform .3s var(--spring), opacity .2s;
  }
  .pill:hover { box-shadow: inset 0 0 0 1.5px var(--violet2); }
  .pill.press { transform: scale(.96); box-shadow: inset 0 0 0 2px var(--violet); }
  .pill.gone { opacity: 0; }
  .pill svg, .pin svg { flex: none; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .pill span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  kbd { display: inline-flex; align-items: center; gap: 2px; padding: 4px 7px; border-radius: 7px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 2px 0 var(--line); color: var(--ink2); font: 650 11px/1 var(--mono); white-space: nowrap; transition: transform .15s, background .15s; }
  kbd.down { transform: translateY(2px); box-shadow: 0 0 0 1px var(--violet2); background: var(--lime); color: var(--on-lime); }
  .iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--chip); color: var(--ink2); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .me { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--violet2), var(--violet)); color: #fff; font-size: 13px; font-weight: 700; }

  /* app pages */
  .page { position: relative; flex: 1; padding: 22px 24px; overflow: hidden; }
  .page h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
  .page .sub { margin: 0 0 18px; color: var(--ink2); font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { padding: 14px 16px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
  .kpi small { color: var(--soft); font-size: 12.5px; }
  .kpi b { display: block; margin-top: 6px; font-size: 21px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 30% { box-shadow: 0 0 0 2px var(--lime), 0 0 30px -6px var(--lime); } }
  .grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
  .box { padding: 14px 16px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); min-width: 0; }
  .box h2 { margin: 0 0 10px; color: var(--soft); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 130px; }
  .bars i { flex: 1; height: var(--h); border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--violet2), var(--violet)); transform-origin: bottom; animation: rise .8s var(--spring) both; animation-delay: calc(var(--k) * 50ms); }
  .bars i:last-child { background: linear-gradient(180deg, var(--lime), color-mix(in srgb, var(--lime) 60%, var(--violet))); }
  @keyframes rise { from { transform: scaleY(0); } }
  .days { display: flex; gap: 8px; margin-top: 6px; color: var(--soft); font-size: 11px; }
  .days span { flex: 1; text-align: center; }
  .rows { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
  .rows li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); font-size: 14px; }
  .rows li:first-child { border-top: 0; }
  .rows li.new { animation: newRow 1.6s ease-out; border-radius: 10px; }
  @keyframes newRow { 0% { background: var(--lime); color: var(--on-lime); transform: scale(1.02); } 60% { background: color-mix(in srgb, var(--lime) 30%, transparent); transform: none; } 100% { background: transparent; } }
  .rows .num { font: 600 12.5px/1 var(--mono); color: var(--ink2); }
  .rows .amt { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
  .st { padding: 4px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .st.Paid { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .st.Due { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .st.Overdue { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .cust { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
  .cust.new { animation: flash 1.6s ease-out; }
  .av { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 14px; background: var(--c); }
  .cust b { display: block; font-size: 14px; }
  .cust small { color: var(--soft); font-size: 12.5px; }
  .sw { position: relative; flex: none; width: 44px; height: 26px; margin-left: auto; border: 0; border-radius: 13px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: background .25s; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .3); transition: transform .4s var(--spring); }
  .sw[aria-checked="true"] { background: var(--violet); }
  .sw[aria-checked="true"]::after { transform: translateX(18px); }

  /* ---------- The palette ---------- */
  .veil { position: absolute; inset: 0; z-index: 8; background: var(--veil); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .veil.on { opacity: 1; pointer-events: auto; }
  .pal {
    position: absolute; z-index: 9; left: 50%; top: 12%;
    width: min(580px, calc(100% - 28px));
    margin-left: calc(min(580px, calc(100% - 28px)) / -2);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: 0 40px 80px -30px rgba(20, 10, 70, .6), 0 0 0 1px var(--line);
    transform-origin: 0 0;
    overflow: hidden;
  }
  .pal[hidden] { display: none; }
  .pin { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; color: var(--soft); }
  .pin input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-size: 17px; caret-color: var(--violet); }
  .pin input::placeholder { color: var(--soft); }
  .chips { position: relative; display: flex; gap: 4px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
  .chip { position: relative; z-index: 1; padding: 7px 12px; border: 0; border-radius: 999px; background: none; color: var(--ink2); font-size: 13px; font-weight: 650; cursor: pointer; transition: color .2s; }
  .chip[aria-pressed="true"] { color: #fff; }
  .chipbg { position: absolute; left: 0; top: 0; height: 31px; border-radius: 999px; background: var(--violet); transition: transform .45s var(--spring), width .45s var(--spring); }
  .res { position: relative; max-height: 300px; margin: 0; padding: 6px 8px 8px; overflow-y: auto; list-style: none; }
  .grp { padding: 10px 10px 4px; color: var(--soft); font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .opt { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 12px; cursor: pointer; font-size: 14.5px; transition: color .15s; }
  .opt .ic { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--chip); color: var(--ink2); transition: background .2s, color .2s, transform .4s var(--spring); }
  .opt .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .opt .hint { margin-left: auto; color: var(--soft); font-size: 12px; white-space: nowrap; }
  .opt mark { background: none; color: var(--violet); font-weight: 750; }
  .opt[aria-selected="true"] { color: var(--on-lime); }
  .opt[aria-selected="true"] mark { color: var(--on-lime); text-decoration: underline 2px; text-underline-offset: 3px; }
  .opt[aria-selected="true"] .ic { background: rgba(0, 0, 0, .1); color: var(--on-lime); }
  .opt[aria-selected="true"] .hint { color: color-mix(in srgb, var(--on-lime) 60%, transparent); }
  .opt.go { animation: go .5s var(--spring); }
  .opt.go .ic { transform: rotate(360deg) scale(1.15); }
  @keyframes go { 40% { transform: scale(1.03); } }
  .hl { position: absolute; left: 8px; right: 8px; top: 0; z-index: 0; border-radius: 12px; background: var(--lime); box-shadow: 0 10px 24px -14px var(--lime); transition: transform .32s var(--spring), height .25s; pointer-events: none; }
  .none { padding: 30px 10px 34px; text-align: center; color: var(--soft); font-size: 14px; }
  .none b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 15px; }
  .foot { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--soft); font-size: 12px; flex-wrap: wrap; }
  .comet { position: absolute; z-index: 10; left: 0; top: 0; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 16px 4px var(--lime); pointer-events: none; }
  .spark { position: absolute; z-index: 10; left: 0; top: 0; width: 8px; height: 8px; margin: -4px; border-radius: 50%; border: 2px solid var(--lime); pointer-events: none; }
  .toast { position: absolute; left: 50%; bottom: 18px; z-index: 11; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; background: var(--side); color: #fff; font-size: 13.5px; white-space: nowrap; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; transition: transform .5s var(--spring), opacity .3s; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
  .toast i { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); }

  @media (max-width: 700px) {
    .stage { padding: 12px; }
    .app { height: min(700px, calc(100vh - 24px)); }
    .side { width: 56px; padding: 12px 0; gap: 4px; }
    .logo { width: 36px; height: 36px; margin-bottom: 8px; }
    .nav { width: 42px; height: 42px; }
    .top { gap: 8px; height: 60px; padding: 0 12px; }
    .crumb, .me, .pill kbd { display: none; }
    .pill { width: auto; flex: 1; margin-left: 0; }
    .page { padding: 16px 14px; }
    .grid2 { grid-template-columns: 1fr; }
    .grid2 .box:last-child { display: none; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpi:nth-child(3) { display: none; }
    .kpi b { font-size: 17px; }
    .pal { top: 8%; }
    .foot { display: none; }
    .res { max-height: 340px; }
    .cards { grid-template-columns: 1fr; gap: 8px; }
    .rows .num { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="app" id="app">
    <aside class="side">
      <span class="logo" aria-hidden="true">T</span>
      <nav aria-label="Main" id="sideNav" style="display:grid;gap:8px"></nav>
    </aside>
    <div class="main">
      <header class="top">
        <span class="crumb">Tally Desk / <b id="crumb">Dashboard</b></span>
        <button class="pill" id="pill" type="button" aria-haspopup="dialog" aria-label="Search or jump to, Control K"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search or jump to…</span><kbd id="kbd">Ctrl K</kbd></button>
        <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        <span class="me" aria-hidden="true">FA</span>
      </header>
      <section class="page" id="page"></section>
    </div>
    <div class="veil" id="veil"></div>
    <div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Command menu" hidden>
      <div class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="q" type="text" role="combobox" aria-expanded="true" aria-controls="res" aria-autocomplete="list" aria-label="Type a command or search" placeholder="Type a command or search…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
      <div class="chips" id="chips"><span class="chipbg" id="chipbg"></span></div>
      <ul class="res" id="res" role="listbox" aria-label="Commands"><li class="hl" id="hl" aria-hidden="true"></li></ul>
      <div class="foot" aria-hidden="true"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>Tab</kbd> filter</span></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"><i></i><span id="toastText"></span></div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pkr = (n) => "PKR " + Math.round(n).toLocaleString("en-US");

  // ---------- Icons ----------
  const IC = {
    dash: '<rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/>',
    inv: '<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 11.5h6M9 15h3"/>',
    users: '<circle cx="9" cy="8.5" r="3.5"/><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5M16 5.5a3 3 0 0 1 0 6M18 15c1.6.6 2.6 2.2 3 5"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5V6M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

  // ---------- App data and pages ----------
  const PAGES = [["Dashboard", "dash"], ["Invoices", "inv"], ["Customers", "users"], ["Reports", "chart"], ["Settings", "gear"]];
  const data = {
    invoices: [["INV-0142", "Al-Noor Traders", 48500, "Due"], ["INV-0141", "Mehran Foods", 126000, "Paid"], ["INV-0140", "Gulberg Bakers", 18750, "Overdue"], ["INV-0139", "Saba Textiles", 92300, "Paid"], ["INV-0138", "Indus Motor Works", 35000, "Paid"]],
    customers: [["Al-Noor Traders", "Karachi", 48500, "#6d4aff"], ["Mehran Foods", "Hyderabad", 0, "#13a37a"], ["Gulberg Bakers", "Lahore", 18750, "#e0743a"], ["Saba Textiles", "Faisalabad", 0, "#d0457a"], ["Indus Motor Works", "Multan", 35000, "#3a7bd5"]],
    expenses: 184200, paid: 1268000, next: 143,
    settings: [["Email the daily summary", true], ["Remind overdue customers", true], ["Round totals to the rupee", false]],
  };
  const NEW_CUST = [["Khyber Fresh Mart", "Peshawar", "#8f6b2f"], ["Zarnosh Crafts", "Quetta", "#5a8f2f"], ["Ravi Paper Co.", "Sialkot", "#2f6b8f"]];
  let cur = 0, fresh = "";
  const page = $("page"), crumb = $("crumb");
  function pageHTML(i) {
    const recv = data.invoices.filter((x) => x[3] !== "Paid").reduce((s, x) => s + x[2], 0);
    const inv = (rows) => `<ul class="rows">${rows.map((x) => `<li class="${x[0] === fresh ? "new" : ""}"><span class="num">${x[0]}</span><span>${x[1]}</span><span class="amt">${pkr(x[2])}</span><span class="st ${x[3]}">${x[3]}</span></li>`).join("")}</ul>`;
    switch (i) {
      case 0: return `<h1>Good evening, Faraz</h1><p class="sub">Here is how the shop is doing this week</p>
        <div class="kpis"><div class="kpi"><small>Receivable</small><b>${pkr(recv)}</b></div><div class="kpi"><small>Paid this month</small><b>${pkr(data.paid)}</b></div><div class="kpi" id="expKpi"><small>Expenses</small><b>${pkr(data.expenses)}</b></div></div>
        <div class="grid2"><div class="box"><h2>Sales this week</h2><div class="bars">${[42, 58, 35, 70, 64, 88, 96].map((h, k) => `<i style="--h:${h}%;--k:${k}"></i>`).join("")}</div><div class="days">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<span>${d}</span>`).join("")}</div></div>
        <div class="box"><h2>Latest invoices</h2>${inv(data.invoices.slice(0, 3))}</div></div>`;
      case 1: return `<h1>Invoices</h1><p class="sub">${data.invoices.length} invoices · ${pkr(recv)} still to collect</p><div class="box">${inv(data.invoices.slice(0, 6))}</div>`;
      case 2: return `<h1>Customers</h1><p class="sub">${data.customers.length} customers across Pakistan</p><div class="cards">${data.customers.slice(0, 6).map((c) => `<div class="cust${c[0] === fresh ? " new" : ""}"><span class="av" style="--c:${c[3]}">${c[0].split(" ").map((w) => w[0]).slice(0, 2).join("")}</span><span><b>${c[0]}</b><small>${c[1]} · ${c[2] ? pkr(c[2]) + " due" : "all paid"}</small></span></div>`).join("")}</div>`;
      case 3: return `<h1>Reports</h1><p class="sub">November so far</p><div class="kpis"><div class="kpi"><small>Revenue</small><b>${pkr(2140000)}</b></div><div class="kpi"><small>Profit</small><b>${pkr(612000)}</b></div><div class="kpi"><small>Best day</small><b>Saturday</b></div></div>
        <div class="box"><h2>Revenue by week</h2><div class="bars">${[48, 66, 74, 92].map((h, k) => `<i style="--h:${h}%;--k:${k}"></i>`).join("")}</div><div class="days">${["Week 1", "Week 2", "Week 3", "Week 4"].map((d) => `<span>${d}</span>`).join("")}</div></div>`;
      default: return `<h1>Settings</h1><p class="sub">Tally Desk for Faraz General Store</p><div class="box"><ul class="rows">${data.settings.map((s, k) => `<li><span>${s[0]}</span><button class="sw" type="button" role="switch" aria-checked="${s[1]}" data-k="${k}" aria-label="${s[0]}"></button></li>`).join("")}</ul></div>`;
    }
  }
  function showPage(i, quiet) {
    cur = i;
    crumb.textContent = PAGES[i][0];
    sideBtns.forEach((b, k) => (k === i ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    page.innerHTML = pageHTML(i);
    page.querySelectorAll(".sw").forEach((b) => b.addEventListener("click", () => { const s = data.settings[+b.dataset.k]; s[1] = !s[1]; b.setAttribute("aria-checked", s[1]); }));
    fresh = "";
    if (reduce || quiet) return;
    [...page.children].forEach((el, k) => el.animate([{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 520, delay: k * 60, easing: "cubic-bezier(.3,1.3,.5,1)", fill: "backwards" }));
  }
  const sideNav = $("sideNav");
  PAGES.forEach(([n, ic], k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "nav"; b.setAttribute("aria-label", n); b.title = n;
    b.innerHTML = svg(ic);
    b.addEventListener("click", () => showPage(k));
    sideNav.appendChild(b);
  });
  const sideBtns = [...sideNav.children];

  // ---------- Commands ----------
  const CMDS = [
    ...PAGES.map(([n, ic], k) => ({ g: "Pages", label: `Go to ${n}`, ic, hint: "Page", kw: n, run: () => ({ to: sideBtns[k], done: () => { showPage(k); return `Opened ${n}`; } }) })),
    { g: "Create", label: "New invoice", ic: "plus", hint: "Invoices", kw: "bill add", run: () => ({ to: sideBtns[1], done: () => {
      const no = "INV-0" + data.next++, c = data.customers[(data.next) % data.customers.length];
      data.invoices.unshift([no, c[0], 27400 + (data.next % 5) * 3150, "Due"]); fresh = no; showPage(1); return `Invoice ${no} created for ${c[0]}`; } }) },
    { g: "Create", label: "New customer", ic: "plus", hint: "Customers", kw: "client add", run: () => ({ to: sideBtns[2], done: () => {
      const c = NEW_CUST[data.customers.length % NEW_CUST.length];
      data.customers.unshift([c[0], c[1], 0, c[2]]); fresh = c[0]; showPage(2); return `${c[0]} added`; } }) },
    { g: "Create", label: "New expense", ic: "plus", hint: "PKR 6,500", kw: "spend cost add", run: () => ({ to: sideBtns[0], done: () => {
      data.expenses += 6500; showPage(0, true); const k = $("expKpi"); if (k) k.classList.add("flash"); return "Expense of PKR 6,500 added"; } }) },
    { g: "Actions", label: "Switch theme", ic: "moon", hint: "Light or dark", kw: "dark light mode colour color", run: () => ({ to: $("themeBtn"), done: () => { flipTheme(); return `${document.documentElement.dataset.theme === "dark" ? "Dark" : "Light"} theme on`; } }) },
    { g: "Actions", label: "Export page as PDF", ic: "down", hint: "Download", kw: "save print pdf", run: () => ({ to: $("pill"), done: () => `${PAGES[cur][0]} export ready, 1 page, 84 KB` }) },
    { g: "Actions", label: "Copy invite link", ic: "link", hint: "Team", kw: "share teammate people", run: () => ({ to: $("pill"), done: () => "Invite link ready to share" }) },
  ];
  CMDS.forEach((c, k) => (c.id = "c" + k));
  const recent = [];

  function flipTheme() {
    const r = document.documentElement;
    r.setAttribute("data-picked", "");
    r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  }

  // fuzzy match: letters in order; runs and word starts score higher
  function match(q, s) {
    const t = s.toLowerCase();
    let j = 0, prev = -2, score = 0;
    const idx = [];
    for (let i = 0; i < t.length && j < q.length; i++) {
      if (t[i] === q[j]) { idx.push(i); score += (i === prev + 1 ? 3 : 1) + (i === 0 || t[i - 1] === " " ? 2 : 0); prev = i; j++; }
    }
    return j === q.length ? { score: score - s.length * .02, idx } : null;
  }
  const mark = (s, idx) => [...s].map((ch, i) => (idx.includes(i) ? `<mark>${ch}</mark>` : ch)).join("");

  // ---------- Palette state ----------
  const pal = $("pal"), veil = $("veil"), q = $("q"), res = $("res"), hl = $("hl"), chips = $("chips"), chipbg = $("chipbg"), pill = $("pill"), live = $("live");
  const FILTERS = ["All", "Pages", "Create", "Actions"];
  FILTERS.forEach((f, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = f; b.tabIndex = -1;
    b.setAttribute("aria-pressed", k === 0);
    b.addEventListener("click", () => { setFilter(k); q.focus(); });
    chips.appendChild(b);
  });
  const chipBtns = [...chips.querySelectorAll(".chip")];
  let filter = 0, shown = [], act = 0, isOpen = false, running = false;

  function setFilter(k) {
    filter = k;
    chipBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === k));
    placeChip();
    render();
  }
  function placeChip() {
    const b = chipBtns[filter];
    chipbg.style.width = b.offsetWidth + "px";
    chipbg.style.transform = `translate(${b.offsetLeft}px, ${b.offsetTop}px)`;
  }
  // anim: the staggered rise on open / filter change; while typing the rows only flicker softly so they stay readable
  function render(anim = true) {
    const s = q.value.trim().toLowerCase().replace(/\s+/g, " ");
    let list = CMDS.filter((c) => filter === 0 || c.g === FILTERS[filter]);
    let rows;
    if (s) {
      rows = list.map((c) => {
        const m = match(s.replace(/ /g, ""), c.label.toLowerCase().replace(/ /g, "")) ? match(s, c.label) || matchLoose(s, c.label) : null;
        const k = m ? null : match(s.replace(/ /g, ""), c.kw.toLowerCase().replace(/ /g, ""));
        return m ? { c, score: m.score + 5, idx: m.idx } : k ? { c, score: k.score, idx: [] } : null;
      }).filter(Boolean).sort((a, b) => b.score - a.score);
    } else {
      rows = list.map((c) => ({ c, score: 0, idx: [] }));
      if (filter === 0 && recent.length) rows = [...recent.map((c) => ({ c, idx: [], rec: true })), ...rows.filter((r) => !recent.includes(r.c))];
    }
    shown = rows;
    act = Math.min(act, Math.max(0, rows.length - 1));
    let html = "", g = "";
    rows.forEach((r, k) => {
      const grp = r.rec ? "Recent" : s ? "Best matches" : r.c.g;
      if (grp !== g) { g = grp; html += `<li class="grp" role="presentation">${grp}</li>`; }
      html += `<li class="opt" role="option" id="o${k}" aria-selected="${k === act}" data-k="${k}"><span class="ic">${svg(r.c.ic)}</span><span>${mark(r.c.label, r.idx)}</span><span class="hint">${r.c.hint}</span></li>`;
    });
    if (!rows.length) html = `<li class="none" role="presentation"><b>Nothing called “${q.value.trim().replace(/[<>&]/g, "")}”</b>Try a page name, “new” or “theme”.</li>`;
    res.innerHTML = html;
    res.prepend(hl);
    res.querySelectorAll(".opt").forEach((o) => {
      o.addEventListener("pointermove", () => { if (+o.dataset.k !== act) setAct(+o.dataset.k); });
      o.addEventListener("click", () => { setAct(+o.dataset.k); runAct(); });
    });
    if (!reduce && anim) [...res.querySelectorAll(".opt, .grp, .none")].forEach((el, k) => el.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 280, delay: Math.min(k, 8) * 22, easing: "ease-out", fill: "backwards" }));
    else if (!reduce) res.querySelectorAll(".opt mark").forEach((m) => m.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 160 }));
    setAct(act, true);
  }
  // multi-word queries match each word against the words of the label
  function matchLoose(s, label) {
    const words = s.split(" ").filter(Boolean), t = label.toLowerCase();
    let pos = 0, score = 0;
    const idx = [];
    for (const w of words) {
      const at = t.indexOf(w, pos);
      if (at < 0) return null;
      for (let i = 0; i < w.length; i++) idx.push(at + i);
      score += w.length * 3; pos = at + w.length;
    }
    return { score, idx };
  }
  function setAct(k, jump) {
    const opts = res.querySelectorAll(".opt");
    if (!opts.length) { hl.style.opacity = 0; q.removeAttribute("aria-activedescendant"); return; }
    act = Math.max(0, Math.min(opts.length - 1, k));
    opts.forEach((o, i) => o.setAttribute("aria-selected", i === act));
    const o = opts[act];
    hl.style.opacity = 1;
    if (jump) { hl.style.transition = "none"; requestAnimationFrame(() => (hl.style.transition = "")); }
    hl.style.height = o.offsetHeight + "px";
    hl.style.transform = `translateY(${o.offsetTop}px)`;
    q.setAttribute("aria-activedescendant", o.id);
    const top = o.offsetTop - res.scrollTop;
    if (top < 0) res.scrollTop = o.offsetTop - 30;
    else if (top + o.offsetHeight > res.clientHeight) res.scrollTop = o.offsetTop + o.offsetHeight - res.clientHeight + 8;
  }

  // ---------- Open and close: the pill grows into the palette (FLIP) and shrinks back ----------
  function flipFrom() {
    const a = $("app").getBoundingClientRect(), p = pill.getBoundingClientRect(), r = pal.getBoundingClientRect();
    return { dx: p.left - r.left, dy: p.top - r.top, sx: p.width / r.width, sy: p.height / r.height, a };
  }
  async function openPal() {
    if (isOpen) return;
    isOpen = true;
    q.value = ""; act = 0; filter = 0;
    pal.hidden = false;
    chipBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === 0));
    render();
    placeChip();
    veil.classList.add("on");
    pill.classList.add("gone");
    live.textContent = "Command menu open";
    q.focus({ preventScroll: true });
    if (reduce) return;
    const f = flipFrom();
    pal.animate([
      { transform: `translate(${f.dx}px, ${f.dy}px) scale(${f.sx}, ${f.sy})`, borderRadius: "40px", opacity: .4 },
      { transform: "none", borderRadius: "20px", opacity: 1 },
    ], { duration: 520, easing: "cubic-bezier(.2,1.15,.35,1)" });
    [...pal.children].forEach((el, k) => el.animate([{ opacity: 0 }, { opacity: 0, offset: .35 }, { opacity: 1 }], { duration: 380 + k * 40 }));
  }
  async function closePal(back = true) {
    if (!isOpen) return;
    isOpen = false;
    veil.classList.remove("on");
    if (!reduce) {
      const f = flipFrom();
      const fades = [...pal.children].map((el) => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: "forwards" }));
      await pal.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${f.dx}px, ${f.dy}px) scale(${f.sx}, ${f.sy})`, borderRadius: "40px", opacity: .3 }], { duration: 340, easing: "cubic-bezier(.5,0,.3,1)" }).finished;
      fades.forEach((x) => x.cancel());
    }
    if (isOpen) return;
    pal.hidden = true;
    pill.classList.remove("gone");
    if (back) pill.focus({ preventScroll: true });
  }

  // ---------- Running a command: the row lifts, a check spins in, the palette folds away, a comet flies ----------
  let toastT = 0;
  function toast(t) { $("toastText").textContent = t; $("toast").classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("on"), 2300); }
  async function runAct() {
    if (running || !shown[act]) return;
    running = true;
    const c = shown[act].c, o = res.querySelectorAll(".opt")[act];
    const plan = c.run();
    const was = recent.indexOf(c);
    if (was >= 0) recent.splice(was, 1);
    recent.unshift(c); recent.length = Math.min(recent.length, 2);
    if (!reduce && o) {
      o.querySelector(".ic").innerHTML = svg("check");
      o.classList.add("go");
      await sleep(320);
    }
    await closePal(false);
    if (!reduce) await comet(pill, plan.to);
    const msg = plan.done();
    toast(msg);
    live.textContent = msg;
    if (plan.to && plan.to.classList.contains("nav")) { plan.to.classList.remove("hit"); void plan.to.offsetWidth; plan.to.classList.add("hit"); }
    running = false;
  }
  function comet(from, to) {
    if (!to) return Promise.resolve();
    const a = $("app").getBoundingClientRect(), f = from.getBoundingClientRect(), t = to.getBoundingClientRect();
    const x0 = f.left - a.left + f.width / 2, y0 = f.top - a.top + f.height / 2, x1 = t.left - a.left + t.width / 2, y1 = t.top - a.top + t.height / 2;
    const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 60 + (y1 > y0 ? 80 : 0);
    const pts = [];
    for (let k = 0; k <= 12; k++) { const s = k / 12, u = 1 - s; pts.push([u * u * x0 + 2 * u * s * mx + s * s * x1, u * u * y0 + 2 * u * s * my + s * s * y1]); }
    const app = $("app"), parts = [];
    for (let k = 0; k < 4; k++) {
      const d = document.createElement("i");
      d.className = "comet";
      if (k) { d.style.transform = "scale(.6)"; d.style.opacity = .6 - k * .12; }
      app.appendChild(d); parts.push(d);
      d.animate(pts.map(([x, y]) => ({ transform: `translate(${x}px, ${y}px) scale(${1 - k * .2})` })), { duration: 560, delay: k * 40, easing: "cubic-bezier(.5,0,.3,1)", fill: "both" }).onfinish = () => d.remove();
    }
    return sleep(600).then(() => {
      const s = document.createElement("i");
      s.className = "spark"; app.appendChild(s);
      s.animate([{ transform: `translate(${x1}px, ${y1}px) scale(1)`, opacity: 1 }, { transform: `translate(${x1}px, ${y1}px) scale(6)`, opacity: 0 }], { duration: 600, easing: "ease-out" }).onfinish = () => s.remove();
    });
  }

  // ---------- Input ----------
  pill.addEventListener("click", openPal);
  veil.addEventListener("click", () => closePal());
  $("themeBtn").addEventListener("click", () => { flipTheme(); live.textContent = "Theme switched"; });
  q.addEventListener("input", () => { act = 0; render(false); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setAct((act + 1) % Math.max(1, shown.length)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setAct((act - 1 + shown.length) % Math.max(1, shown.length)); }
    else if (e.key === "Enter") { e.preventDefault(); runAct(); }
    else if (e.key === "Tab") { e.preventDefault(); setFilter((filter + (e.shiftKey ? FILTERS.length - 1 : 1)) % FILTERS.length); }
  });
  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ((k === "k" && (e.ctrlKey || e.metaKey)) || (k === "/" && !isOpen && document.activeElement.tagName !== "INPUT")) {
      e.preventDefault();
      isOpen ? closePal() : openPal();
    } else if (e.key === "Escape" && isOpen) { e.preventDefault(); closePal(); }
  });
  addEventListener("resize", () => { if (isOpen) { placeChip(); setAct(act, true); } });

  // ---------- Start and demo ----------
  showPage(0);
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  async function type(text) {
    for (const ch of text) { if (!demo) return false; q.value += ch; act = 0; render(false); await sleep(85 + Math.random() * 50); }
    return demo;
  }
  async function press(keyLabel) {
    const kb = $("kbd");
    kb.classList.add("down"); pill.classList.add("press");
    await sleep(160);
    kb.classList.remove("down"); pill.classList.remove("press");
  }
  (async () => {
    await sleep(700);
    const script = [["new inv"], ["cust"], ["theme"], ["", 1, 3], ["exp"], ["theme"], ["dash"]];
    let i = 0;
    while (demo) {
      const [text, filt, downs] = script[i++ % script.length];
      await press();
      if (!demo) return;
      await openPal();
      await sleep(420);
      if (filt) { setFilter(filt); await sleep(500); }
      if (!(await type(text))) return;
      for (let k = 0; k < (downs || 0); k++) { await sleep(380); if (!demo) return; setAct(act + 1); }
      await sleep(650);
      if (!demo) return;
      await runAct();
      await sleep(2300);
    }
  })();
})();
</script>
</body>
