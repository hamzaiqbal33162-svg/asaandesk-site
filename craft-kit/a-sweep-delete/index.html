<!doctype html>
<!-- Chill and Craft · Sweep Bin · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweep Bin · delete button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --bg: #f4f1ee;
    --bg-dot: #e4dfda;
    --red: #e5484d;
    --red-hover: #d63b40;
    --red-deep: #a8202a;
    --done: #2c303a;
    --text: #2b2d33;
    --muted: #7a7470;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #13151a;
      --bg-dot: #1f222a;
      --red: #ef5459;
      --red-hover: #f7686c;
      --red-deep: #b4232b;
      --done: #343a47;
      --text: #eceef3;
      --muted: #969aa6;
      --focus: #93c5fd;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #13151a;
    --bg-dot: #1f222a;
    --red: #ef5459;
    --red-hover: #f7686c;
    --red-deep: #b4232b;
    --done: #343a47;
    --text: #eceef3;
    --muted: #969aa6;
    --focus: #93c5fd;
  }

  /* ---------- Stage: a calm dotted floor ---------- */
  * { box-sizing: border-box; }
  body { overflow-x: hidden; } /* particles may fly past the edges */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.4px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 16px 24px; }

  /* ---------- Button ---------- */
  .btn {
    position: relative;
    width: 230px;
    height: 58px;
    padding: 0;
    border: 0;
    border-radius: 14px;
    background: var(--red);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 12px 26px -14px rgba(200, 30, 40, .9), inset 0 -3px 0 rgba(0, 0, 0, .12);
    transition: background-color .3s, transform .4s var(--spring), box-shadow .3s;
  }
  .btn:hover { background: var(--red-hover); transform: translateY(-2px); box-shadow: 0 16px 28px -14px rgba(200, 30, 40, 1), inset 0 -3px 0 rgba(0, 0, 0, .12); }
  .btn:active { transform: translateY(1px) scale(.97); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .btn[aria-disabled="true"] { cursor: default; transform: none; }

  /* The bin sits on the left and travels to the right */
  .bin { position: absolute; left: 16px; top: 15px; width: 24px; height: 28px; will-change: transform; }
  .bin svg { width: 100%; height: 100%; overflow: visible; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform-origin: 50% 100%; transition: transform .4s var(--spring); }
  .lid { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .35s var(--spring); }
  .btn:hover .lid { transform: rotate(-18deg); }
  .btn:hover .bin svg { transform: translateY(-2px); }

  .label, .after { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; white-space: nowrap; }
  .label { left: 50px; right: 16px; transition: opacity .3s, transform .4s var(--spring); }
  .btn:hover .label { transform: translateX(2px); }
  .label span { display: inline-block; }
  .after { left: 16px; right: 52px; opacity: 0; transform: translateX(-16px) scale(.9); transition: opacity .3s, transform .6s var(--spring); }
  .after svg { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -2px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .after path { stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .4s .25s ease-out; }

  /* Crumbs and puffs */
  .particle { position: absolute; width: 5px; height: 5px; border-radius: 2px; background: #fff; pointer-events: none; }
  .particle.puff { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, .85); }

  /* Confirm countdown bar */
  .timer { width: 230px; height: 3px; border-radius: 3px; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--red-deep); transform-origin: left; transform: scaleX(0); }

  .hint { margin: 0; min-height: 1.3em; font-size: 13.5px; color: var(--muted); text-align: center; }

  /* ---------- States ---------- */
  .btn[data-state="confirm"] { background: var(--red-deep); animation: nudge .45s ease-in-out; }
  .btn[data-state="confirm"] .lid { transform: rotate(-28deg); animation: chatter .5s ease-in-out infinite alternate; }
  .btn[data-state="confirm"] + .timer i { animation: drain 3s linear forwards; }

  .btn[data-state="eating"] .lid { animation: chomp .18s ease-in-out infinite alternate; }

  .btn:is([data-state="done"], [data-state="returning"]) { background: var(--done); }
  .btn:is([data-state="done"], [data-state="returning"]) .label { opacity: 0; }
  .btn[data-state="done"] .after { opacity: 1; transform: none; }
  .btn[data-state="done"] .after path { stroke-dashoffset: 0; }

  @keyframes chomp { from { transform: rotate(0); } to { transform: rotate(-34deg); } }
  @keyframes chatter { from { transform: rotate(-22deg); } to { transform: rotate(-32deg); } }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .btn[data-state="confirm"] + .timer i { transform: scaleX(1); }
  }
</style>
</head>
<body>
<main class="stage">
  <button class="btn" type="button" data-state="idle" aria-describedby="hint">
    <span class="bin" aria-hidden="true">
      <svg viewBox="0 0 24 28">
        <g class="lid"><path d="M2.5 7.5h19" /><path d="M9 7.5V4.6c0-.6.5-1.1 1.1-1.1h3.8c.6 0 1.1.5 1.1 1.1v2.9" /></g>
        <path d="M5 11l1.2 13.1A2.2 2.2 0 0 0 8.4 26h7.2a2.2 2.2 0 0 0 2.2-1.9L19 11" />
        <path d="M10 14.5v7M14 14.5v7" />
      </svg>
    </span>
    <span class="label"><span>Delete</span></span>
    <span class="after" aria-hidden="true"><span><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" /></svg>Deleted</span></span>
  </button>
  <div class="timer" aria-hidden="true"><i></i></div>
  <p class="hint" id="hint">Trip-Photos.zip · press twice to confirm</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Sweep Bin delete button ----------
  const btn = document.querySelector(".btn");
  const bin = btn.querySelector(".bin");
  const binArt = bin.querySelector("svg");
  const label = btn.querySelector(".label");
  const labelText = label.querySelector("span");
  const hint = document.getElementById("hint");
  const status = document.getElementById("status");

  const BIN_LEFT = 16;
  const BIN_W = 24;
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const IDLE_HINT = "Trip-Photos.zip · press twice to confirm";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 300) : ms));
  const easeInOut = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  let state = "idle";
  let confirmTimer = 0;

  function setState(s) {
    state = s;
    btn.dataset.state = s;
  }

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Run fn(t) from t=0 to t=1 over ms milliseconds
  function tween(ms, fn) {
    return new Promise((resolve) => {
      if (calm()) { fn(1); resolve(); return; }
      const start = performance.now();
      requestAnimationFrame(function frame(now) {
        const t = Math.min(1, (now - start) / ms);
        fn(t);
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      });
    });
  }

  // A crumb or puff flying off at (x, y)
  function particle(x, y, dx, dy, puff) {
    if (calm()) return;
    const c = document.createElement("span");
    c.className = "particle" + (puff ? " puff" : "");
    c.style.left = x + "px";
    c.style.top = y + "px";
    btn.appendChild(c);
    c.animate([
      { transform: "translate(-50%, -50%) scale(" + (puff ? .4 : 1) + ")", opacity: 1 },
      { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) rotate(200deg) scale(" + (puff ? 1.6 : .6) + ")", opacity: 0 }
    ], { duration: puff ? 700 : 520, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => c.remove();
  }

  async function swapText(text) {
    await play(labelText, [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-10px)", opacity: 0 }], { duration: 120, easing: "ease-in" });
    labelText.textContent = text;
    play(labelText, [{ transform: "translateY(10px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 420, easing: SPRING });
  }

  // Move the bin (with a little hop) and hide every letter it has passed
  function moveBin(x, hop) {
    bin.style.transform = "translate(" + x.toFixed(1) + "px, " + (-hop).toFixed(1) + "px)";
    const binRight = BIN_LEFT + x + BIN_W;
    const eaten = Math.max(0, binRight - label.offsetLeft - 4);
    label.style.clipPath = "inset(0 0 0 " + eaten + "px)";
  }

  // Step 1: ask once more
  function askConfirm() {
    setState("confirm");
    play(binArt, [{ transform: "scale(1)" }, { transform: "scale(1.2, .8)" }, { transform: "scale(1)" }], { duration: 320, easing: SPRING });
    swapText("Really delete?");
    hint.textContent = "Press again within 3 seconds, or Esc to cancel";
    status.textContent = "Press again to confirm the delete.";
    confirmTimer = setTimeout(() => cancelConfirm("Delete cancelled."), 3000);
  }

  function cancelConfirm(message) {
    if (state !== "confirm") return;
    clearTimeout(confirmTimer);
    setState("idle");
    swapText("Delete");
    hint.textContent = IDLE_HINT;
    status.textContent = message;
  }

  // Step 2: crouch, leap, then sweep across eating the label
  async function sweep() {
    clearTimeout(confirmTimer);
    setState("eating");
    btn.setAttribute("aria-disabled", "true");
    hint.textContent = "Deleting…";

    // Anticipation: the button and the bin crouch, then the bin springs up
    await Promise.all([
      play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.03, .9)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-out" }),
      play(binArt, [{ transform: "scale(1)" }, { transform: "scale(1.25, .7)", offset: .4 }, { transform: "translateY(-10px) scale(.9, 1.15)", offset: .75 }, { transform: "translateY(0) scale(1)" }], { duration: 420, easing: "ease-in-out" })
    ]);

    const travel = btn.clientWidth - BIN_LEFT * 2 - BIN_W;
    let lastCrumb = 0;
    await tween(1300, (t) => {
      const x = travel * easeInOut(t);
      const hop = Math.abs(Math.sin(t * Math.PI * 6)) * 3; // little steps
      moveBin(x, hop);
      const now = performance.now();
      if (now - lastCrumb > 70 && t > .08 && t < .92) {
        lastCrumb = now;
        particle(BIN_LEFT + x + 12, 12, Math.random() * 30 - 18, -16 - Math.random() * 22, false);
      }
    });

    // Step 3: a happy burp, then the result springs in
    setState("done");
    play(binArt, [{ transform: "scale(1)" }, { transform: "scale(1.3, .75)" }, { transform: "scale(.9, 1.1)" }, { transform: "scale(1)" }], { duration: 500, easing: "ease-out" });
    for (let i = 0; i < 3; i++) particle(BIN_LEFT + travel + 12, 10, (i - 1) * 10, -24 - i * 6, true);
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.96, 1.05)" }, { transform: "scale(1)" }], { duration: 450, easing: SPRING });
    hint.textContent = "Trip-Photos.zip was deleted";
    status.textContent = "Trip-Photos.zip was deleted.";
    await wait(2300);

    // Step 4: hop back home and reset
    setState("returning");
    label.style.clipPath = "";
    labelText.textContent = "Delete";
    await tween(700, (t) => {
      bin.style.transform = "translate(" + (travel * (1 - easeInOut(t))).toFixed(1) + "px, " + (-Math.abs(Math.sin(t * Math.PI * 4)) * 4).toFixed(1) + "px)";
    });
    bin.style.transform = "";
    setState("idle");
    play(labelText, [{ transform: "translateY(10px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 450, easing: SPRING });
    hint.textContent = IDLE_HINT;
    btn.removeAttribute("aria-disabled");
  }

  btn.addEventListener("click", () => {
    if (state === "idle") {
      askConfirm(); // the CSS nudge is the anticipation here
    } else if (state === "confirm") {
      sweep();
    }
  });

  btn.addEventListener("keydown", (e) => {
    if (e.key === "Escape") cancelConfirm("Delete cancelled.");
  });
</script>
</body>
</html>
