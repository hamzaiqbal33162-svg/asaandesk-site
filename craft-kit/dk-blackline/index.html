<!doctype html>
<!-- Chill & Craft · Blackline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackline · Freelance cash runway</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: paper white and ink black, one orange ---------- */
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f2f2; --panel: #ffffff;
    --ink: #0a0a0a; --muted: #6b6b6b; --line: #0a0a0a; --soft: #dedede; --grid: #e6e6e6;
    --side-bg: #0a0a0a; --side-ink: #ffffff; --side-muted: #8a8a8a;
    --accent: #ff5a1f; --accent-ink: #0a0a0a; --good: #0a0a0a; --bad: #ff5a1f; --warn: #ff5a1f;
    --radius: 0px; --radius-sm: 0px; --tip-bg: #0a0a0a; --tip-ink: #fff; --overlay: rgba(0,0,0,.55);
    --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0a0a0a; --surface: #0a0a0a; --surface-2: #161616; --panel: #111111;
    --ink: #f4f4f4; --muted: #8f8f8f; --line: #f4f4f4; --soft: #2a2a2a; --grid: #1f1f1f;
    --side-bg: #f4f4f4; --side-ink: #0a0a0a; --side-muted: #6b6b6b;
    --good: #f4f4f4; --tip-bg: #f4f4f4; --tip-ink: #0a0a0a;
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- Shell: inverted index sidebar ---------- */
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 26px 0; background: var(--side-bg); color: var(--side-ink); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 24px 26px; color: inherit; text-decoration: none; font-weight: 900; font-size: 1.5rem; letter-spacing: -.04em; text-transform: uppercase; }
  .brand svg { width: 34px; height: 34px; }
  .nav { position: relative; display: grid; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 14px; padding: 13px 24px; color: var(--side-muted); text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 1.02rem; transition: color .2s, padding .3s; }
  .nav a small { font-size: .7rem; font-weight: 700; letter-spacing: .1em; }
  .nav a:hover { color: var(--side-ink); padding-left: 30px; }
  .nav a[aria-current="page"] { color: var(--side-bg); }
  .nav .mark { position: absolute; left: 0; right: 0; top: 0; background: var(--accent); transition: transform .45s cubic-bezier(.7,0,.2,1), height .3s; }
  .side-foot { margin-top: auto; padding: 0 24px; display: grid; gap: 10px; font-size: .78rem; color: var(--side-muted); text-transform: uppercase; letter-spacing: .08em; }
  .side-foot b { color: var(--side-ink); font-size: 1.6rem; letter-spacing: -.03em; text-transform: none; }
  main { min-width: 0; padding: 0 0 60px; overflow-x: clip; }
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: stretch; height: 64px; border-bottom: 2px solid var(--line); background: var(--bg); }
  .top h1 { margin: 0; display: flex; align-items: center; padding: 0 28px; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb { display: grid; place-items: center; width: 64px; border: 0; border-left: 2px solid var(--line); background: none; color: var(--ink); position: relative; transition: background .2s, color .2s; }
  .tb:hover { background: var(--ink); color: var(--bg); }
  .tb .ic { width: 22px; height: 22px; stroke-width: 2.2; }
  .badge { position: absolute; top: 12px; right: 12px; min-width: 18px; height: 18px; display: grid; place-items: center; background: var(--accent); color: #0a0a0a; font-size: .66rem; font-weight: 900; }
  .badge:empty { display: none; }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .menu-btn { display: none !important; }
  .scrim { display: none; }
  .wrap { padding: 28px; }
  .btn { border: 2px solid var(--line); border-radius: 0; background: var(--bg); color: var(--ink); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: .8rem; min-height: 42px; }
  .btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); box-shadow: none; }
  .btn.primary:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.danger { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:active { transform: translate(2px, 2px); }
  .cc-dialog { border: 2px solid var(--line); box-shadow: 10px 10px 0 var(--accent); }
  .cc-field input, .cc-field select, .cc-field textarea { border: 2px solid var(--line); border-radius: 0; background: var(--bg); }

/* ---------- Runway maths ---------- */
const mk = (d) => { d = new Date(d); return d.getFullYear() * 12 + d.getMonth(); };
const NOWM = mk(TODAY);
const cash = () => sum(S.accts.map((a) => a.bal));
const fixedM = () => sum(S.fixed.map((f) => f.amt));
const flexM = () => sum(S.outs.filter((o) => mk(o.date) >= NOWM - 3 && mk(o.date) < NOWM).map((o) => o.amt)) / 3 || sum(S.outs.slice(0, 20).map((o) => o.amt)) / 3;
const inM = () => sum(S.pays.filter((p) => mk(p.date) >= NOWM - 6 && mk(p.date) < NOWM).map((p) => p.amt)) / 6;

let SC = { inc: 100, spend: 0, pause: 0, oneoff: 0, preset: "Normal" };
/* Project the balance month by month; the runway is where it first hits zero */
function project(sc = SC, months = 18) {
  const inc = (inM() * sc.inc) / 100, out = (fixedM() + flexM()) * (1 + sc.spend / 100);
  let bal = cash() - sc.oneoff, run = null;
  const line = [bal];
  for (let m = 1; m <= months; m++) {
    const pipeIn = sum(S.pipe.filter((p) => p.month === m).map((p) => (p.amt * p.odds) / 100)) * (sc.inc > 0 ? 1 : 0);
    const got = m <= sc.pause ? 0 : inc;
    const nb = bal + got + pipeIn - out;
    if (run == null && nb < 0) run = m - 1 + bal / (bal - nb);
    bal = nb;
    line.push(bal);
  }
  if (run == null && cash() - sc.oneoff < 0) run = 0;

  barChart($("#outBars"), { labels, stacked: true, height: 240, radius: 0, series: [{ name: "Fixed", data: labels.map(() => fixedM()), color: "var(--ink)" }, { name: "Flexible", data: flex, color: "var(--accent)" }], tipFmt: (v) => money(v) });
  $("#addOut").addEventListener("click", () => outForm());
  const fixedForm = (f) => formModal({ title: f ? "Edit bill" : "New fixed bill", values: f || {}, fields: [{ name: "name", label: "Bill", required: true }, { name: "amt", label: "Monthly amount (Rs)", type: "number", required: true, min: 1 }], onSubmit: (v) => { if (f) Object.assign(f, v); else S.fixed.push({ id: uid(), ...v }); save(); toast("Saved. Runway updated"); rerender(); } });
  $("#addFixed").addEventListener("click", () => fixedForm());
  view.querySelector(".s4 .list").addEventListener("click", (e) => { const ed = e.target.closest("[data-fx]"), d = e.target.closest("[data-fxdel]"); if (ed) fixedForm(S.fixed.find((f) => f.id === ed.dataset.fx)); if (d) { const f = S.fixed.find((x) => x.id === d.dataset.fxdel); confirmBox(`Delete the bill "${f.name}"?`).then((ok) => { if (ok) { S.fixed = S.fixed.filter((x) => x !== f); save(); toast("Bill deleted"); rerender(); } }); } });
  dataTable($("#outTbl"), { rows: () => S.outs, sort: "date", search: "Search spending…", chips: { k: "cat", values: ["All"].concat(OUT_CATS) }, cols: [{ k: "date", label: "Date", f: (v) => fdate(v) }, { k: "what", label: "What" }, { k: "cat", label: "Category" }, { k: "amt", label: "Amount", cls: "r", f: (v) => money(-v) }, { k: "x", label: "", sort: false, f: () => `<div class="rowbtns"><button data-act="edit" aria-label="Edit">${ic("edit")}</button><button data-act="del" aria-label="Delete">${ic("trash")}</button></div>` }], onAct: (a, r) => { if (a === "edit") outForm(r); else confirmBox(`Delete "${r.what}"?`).then((ok) => { if (ok) { S.outs = S.outs.filter((x) => x !== r); save(); toast("Deleted"); rerender(); } }); }, onRow: (r) => outForm(r) });
};

/* ---------- Accounts + transfers ---------- */
PAGE.accounts = () => {
  const tot = cash() || 1;
  view.innerHTML = `<div class="grid">
    <section class="card s8"><div class="card-h"><h2>Where the cash is</h2><span class="grow"></span><button class="btn primary" id="xfer">${ic("swap")}Move money</button><button class="btn" id="addAcct">${ic("plus")}Account</button></div>
      <div style="display:grid;gap:18px">${S.accts.map((a) => `<div class="acct" data-acct="${a.id}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b style="text-transform:uppercase">${esc(a.name)}</b><span style="font-size:1.5rem;font-weight:900;letter-spacing:-.03em" data-to="${a.bal}">${money(0)}</span></div><div class="bar"><i data-w="${(a.bal / tot) * 100}"></i></div><div style="display:flex;justify-content:space-between"><small class="muted">${((a.bal / tot) * 100).toFixed(1)}% of your cash</small><span class="rowbtns"><button data-ea="${a.id}" aria-label="Edit ${esc(a.name)}">${ic("edit")}</button>${S.accts.length > 1 ? `<button data-da="${a.id}" aria-label="Delete ${esc(a.name)}">${ic("trash")}</button>` : ""}</span></div></div>`).join("")}</div></section>
    <section class="card s4 orange-block"><h2>Total cash</h2><div class="kpi"><div class="val" data-to="${cash()}" style="font-size:2.6rem">${money(0)}</div><small>= ${rwText(project({ inc: 100, spend: 0, pause: 0, oneoff: 0 }).run)} months of runway</small></div></section>
    <section class="card s12"><div class="card-h"><h2>Mix</h2></div><div id="acctDonut"></div></section>
  </div>`;
  requestAnimationFrame(() => $$("[data-w]", view).forEach((i) => (i.style.width = i.dataset.w + "%")));
  donut($("#acctDonut"), { items: S.accts.map((a, i) => ({ label: a.name, value: a.bal, color: ["var(--accent)", "var(--ink)", "var(--muted)", "#bbb"][i % 4] })), size: 160, center: [moneyShort(cash()), "cash"], fmt: (v) => money(v) });
  $("#xfer").addEventListener("click", xferForm);
  $("#addAcct").addEventListener("click", () => acctForm());
  view.querySelector(".s8").addEventListener("click", (e) => { const ed = e.target.closest("[data-ea]"), d = e.target.closest("[data-da]"); if (ed) acctForm(S.accts.find((a) => a.id === ed.dataset.ea)); if (d) { const a = S.accts.find((x) => x.id === d.dataset.da); confirmBox(`Delete ${a.name}? Its ${money(a.bal)} moves to ${S.accts.find((x) => x !== a).name}.`).then((ok) => { if (ok) { S.accts.find((x) => x !== a).bal += a.bal; S.accts = S.accts.filter((x) => x !== a); save(); toast("Account deleted"); rerender(); } }); } });
};
function acctForm(a) { formModal({ title: a ? "Edit account" : "New account", values: a || { bal: 0 }, fields: [{ name: "name", label: "Name", required: true }, { name: "bal", label: "Balance (Rs)", type: "number", required: true, min: 0 }], onSubmit: (v) => { if (a) Object.assign(a, v); else S.accts.push({ id: uid(), ...v }); save(); toast("Saved"); rerender(); } }); }
function xferForm() {
  const opts = S.accts.map((a) => [a.id, a.name + " · " + moneyShort(a.bal)]);
  formModal({ title: "Move money", values: { from: S.accts[1] ? S.accts[1].id : S.accts[0].id, to: S.accts[0].id }, fields: [{ name: "from", label: "From", type: "select", options: opts, half: true }, { name: "to", label: "To", type: "select", options: opts, half: true, check: (v, x) => (v === x.from ? "Pick a different account" : "") }, { name: "amt", label: "Amount (Rs)", type: "number", required: true, min: 1, check: (v, x) => { const a = S.accts.find((y) => y.id === x.from); return a && v > a.bal ? `Only ${money(a.bal)} there` : ""; } }], submit: "Move", onSubmit: (v) => {
    const a = S.accts.find((x) => x.id === v.from), b = S.accts.find((x) => x.id === v.to);
    a.bal -= v.amt; b.bal += v.amt; save();
    /* a thick orange line shoots from one account to the other, then the numbers update */
    const ea = $(`[data-acct="${a.id}"]`), eb = $(`[data-acct="${b.id}"]`);
    if (ea && eb && !RM) { const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect(), line = document.createElement("div"); line.className = "xfer-anim"; const x1 = ra.right - 40, y1 = ra.top + 20, x2 = rb.right - 40, y2 = rb.top + 20, len = Math.hypot(x2 - x1, y2 - y1); Object.assign(line.style, { left: x1 + "px", top: y1 + "px", width: len + "px", transform: `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad) scaleX(0)` }); document.body.appendChild(line); const ang = Math.atan2(y2 - y1, x2 - x1); tween(600, (t) => (line.style.transform = `rotate(${ang}rad) scaleX(${t})`), () => { line.remove(); $$(`[data-acct] [data-to]`).forEach((el) => { const id = el.closest("[data-acct]").dataset.acct; countUp(el, S.accts.find((x) => x.id === id).bal, (x) => money(x), 600); }); const tot = cash() || 1; $$("[data-acct]").forEach((el) => { const ac = S.accts.find((x) => x.id === el.dataset.acct); $(".bar i", el).style.width = (ac.bal / tot) * 100 + "%"; }); }); }
    else rerender();
    toast(`Moved ${money(v.amt)} to ${b.name}`);
  } });
}

/* ---------- Buffer (emergency fund) ---------- */
PAGE.buffer = () => {
  const need = (fixedM() + flexM()) * S.bufferMonths, sav = (S.accts.find((a) => a.id === "sav") || { bal: 0 }).bal, p = clamp(sav / need, 0, 1);
  view.innerHTML = `<div class="grid">
    <section class="card s6"><div class="card-h"><h2>Safety buffer</h2><small>money you do not touch</small></div><div id="bufG"></div><p style="text-align:center;margin:10px 0 0"><b>${money(sav)}</b> <span class="muted">of ${money(need)} (${S.bufferMonths} months of costs)</span></p></section>
    <section class="card s6"><div class="card-h"><h2>Target size</h2></div><div class="knob"><div class="knob-h"><label for="bm">Months of costs</label><output id="bmO">${S.bufferMonths}</output></div><input class="bl" id="bm" type="range" min="1" max="12" value="${S.bufferMonths}"></div><p class="muted" id="bmTxt" style="margin-top:14px"></p><div class="cc-df" style="padding:8px 0 0"><button class="btn primary" id="bmSave">Save target</button></div></section>
    <section class="card s12"><div class="card-h"><h2>Months to fill it</h2><small>if you add a fixed amount each month</small></div><div id="fill"></div></section>
  </div>`;
  gauge($("#bufG"), { value: p * 100, max: 100, color: "var(--accent)", label: "buffer filled", fmt: () => Math.round(p * 100) + "%", tip: money(Math.max(0, need - sav)) + " still to go", size: 260 });
  const bm = $("#bm"), upd = () => { const n = +bm.value, nd = (fixedM() + flexM()) * n; $("#bmO").textContent = n; $("#bmTxt").textContent = `A ${n}-month buffer is ${money(nd)}. You are ${sav >= nd ? "there already" : money(nd - sav) + " short"}.`; };
  bm.addEventListener("input", upd); upd();
  $("#bmSave").addEventListener("click", () => { S.bufferMonths = +bm.value; save(); toast("Buffer target: " + S.bufferMonths + " months"); rerender(); });
  const gap = Math.max(0, need - sav), opts = [10000, 25000, 50000, 75000, 100000];
  barChart($("#fill"), { labels: opts.map((o) => moneyShort(o) + "/mo"), height: 200, radius: 0, series: [{ name: "Months", data: opts.map((o) => Math.ceil(gap / o)), color: "var(--ink)" }], fmt: (v) => v + "", tipFmt: (v) => v + " months" });
};

/* ---------- Settings ---------- */
PAGE.settings = () => {
  view.innerHTML = `<div class="grid"><section class="card s12">
    <div class="set-row"><div><b>Profile</b><small>${esc(S.profile.name)} · ${esc(S.profile.work)}</small></div><button class="btn" id="prof">${ic("user")}Edit</button></div>
    <div class="set-row"><div><b>Theme</b><small>Paper white or ink black</small></div><button class="btn" data-theme-toggle>${ic("moon")}Toggle theme</button></div>
    <div class="set-row"><div><b>Export</b><small>Payments and spending as CSV</small></div><button class="btn" id="csv">${ic("download")}Download CSV</button></div>
    <div class="set-row"><div><b>Reset demo data</b><small>Accounts, payments, bills and pipeline</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div></section></div>`;
  $("#prof").addEventListener("click", () => formModal({ title: "Profile", values: S.profile, fields: [{ name: "name", label: "Name", required: true }, { name: "work", label: "What you do", required: true }], onSubmit: (v) => { S.profile = v; save(); toast("Saved"); rerender(); } }));
  $("#csv").addEventListener("click", () => { const csv = [["Date", "Type", "Who / what", "Amount"]].concat(S.pays.map((p) => [p.date, "in", p.client, p.amt]), S.outs.map((o) => [o.date, "out", o.what, -o.amt])).map((r) => r.join(",")).join("\n"); try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "blackline.csv"; a.click(); toast("CSV downloaded"); } catch (e) { toast("Downloads are blocked here", "warn"); } });
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data?", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); SC = { ...PRESETS.Normal, preset: "Normal" }; save(); drawBell(); toast("Demo data reset"); rerender(); } }));
};

/* ---------- Start ---------- */
addEventListener("resize", () => { if (current === "runway" && $("#plane")) { clearTimeout(rwT); rwT = setTimeout(() => updRunway(false), 200); } });
drawBell();
initShell(() => pageCmds(PAGES.map(([a, b]) => [a, b, "chevR"]), [{ label: "Log a payment", icon: "in", run: () => payForm() }, { label: "Add spending", icon: "out", run: () => outForm() }, { label: "Move money", icon: "swap", run: xferForm }, { label: "Add expected work", icon: "briefcase", run: pipeForm }].concat(Object.keys(PRESETS).map((k) => ({ label: "Scenario: " + k, icon: "plane", run: () => { SC = { ...PRESETS[k], preset: k }; if (current === "runway") { syncKnobs(); updRunway(true); } else location.hash = "#/runway"; } })))));
startRouter(PAGES.map((p) => p[0]), "runway", render);
</script>
</body>
</html>
