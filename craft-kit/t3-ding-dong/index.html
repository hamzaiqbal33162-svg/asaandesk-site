<script>
  // Ding Dong: a doorbell button that really gets the door answered.
  // Press = the button sinks and two chime notes ring out (ding, then a lower dong) with rings and floating notes →
  // the hall light comes on behind the little window and a shadow walks past → "Coming!" → the knob turns and the
  // door swings open with a spring, warm light spills onto the porch and the host waves you in → after a moment the
  // door swings shut with a soft bump and the porch lamp fades. A real chime plays when you press it yourself.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var house = $("house"), front = $("front"), bell = $("bell"), snd = $("snd"), status = $("status"), fx = $("fx"), bubble = $("bubble");
    var door = $("door"), knob = $("knob"), hall = $("hall"), peep = $("peep"), shade = $("shade"), spill = $("spill"), halo = $("halo");
    var host = $("host"), arm = $("arm"), outfit = $("outfit"), sleeves = [].slice.call(document.querySelectorAll(".sleeve"));
    var NS = "http://www.w3.org/2000/svg";

    // who answers, in turn: name, outfit colour, greeting
    var HOSTS = [["Ayesha", "#3a7fc4", "Welcome in!"], ["Bilal", "#2f9e7a", "Oh, hello there!"], ["Zara", "#c2477a", "Come in, the tea is ready!"], ["Omar", "#e08a2c", "Right on time!"]];
    var S = { busy: false, open: false, visit: 0, sound: true, run: 0 };

    // stars for the night sky
    (function () {
      var box = $("stars");
      for (var i = 0; i < 16; i++) {
        var s = document.createElement("i");
        s.style.left = (4 + Math.random() * 92).toFixed(1) + "%";
        s.style.top = (8 + Math.random() * 80).toFixed(1) + "%";
        s.style.animationDelay = (-Math.random() * 2.6).toFixed(2) + "s";
        box.appendChild(s);
      }
    })();

    function wait(ms) { return new Promise(function (r) { setTimeout(r, calm.matches ? Math.min(ms, 400) : ms); }); }
    function spring(stiff, damp) {
      var x = 0, v = 0, out = [0];
      for (var i = 0; i < 300; i++) { v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; out.push(x); if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break; }
      out[out.length - 1] = 1;
      return out;
    }
    function springKeys(stiff, damp, map) { var c = spring(stiff, damp); return { keys: c.map(map), ms: (c.length * 1000) / 60 }; }

    // ---------- Sound: a two-tone chime made with the Web Audio API (only after your own press) ----------
    var ac = null;
    function tone(f, at, len, vol) {
      [[1, vol, len], [2.76, vol * 0.22, len * 0.4], [5.4, vol * 0.08, len * 0.2]].forEach(function (p) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f * p[0];
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(p[1], at + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, at + p[2]);
        o.connect(g); g.connect(ac.destination);
        o.start(at); o.stop(at + p[2] + 0.05);
      });
    }
    function chime() {
      if (!S.sound) return;
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") ac.resume().catch(function () {});
        var n = ac.currentTime + 0.03;
        tone(659.25, n, 1.5, 0.16);
        tone(523.25, n + 0.48, 2.1, 0.18);
      } catch (err) { /* no audio here: the chime is only shown */ }
    }
    snd.addEventListener("click", function () {
      S.sound = !S.sound;
      snd.setAttribute("aria-pressed", String(S.sound));
      status.textContent = S.sound ? "Chime sound on." : "Chime sound off. The bell still rings on screen.";
    });

    // ---------- Visual chime: rings, notes and the words ----------
    function bellCentre() {
      var f = front.getBoundingClientRect(), b = bell.getBoundingClientRect(), s = f.width / (front.offsetWidth || 1) || 1;
      return { x: (b.left - f.left + b.width / 2) / s, y: (b.top - f.top + b.height / 2) / s };
    }
    function noteSvg() {
      var s = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
      s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "note");
      p.setAttribute("d", "M10 3.5h2.2v12.6a3.7 3.7 0 1 1-2.2-3.4zM12.2 3.5c2.6 1 5.6 2.4 6 6.4-1.4-1.6-3.6-2.4-6-2.6z");
      p.setAttribute("fill", "currentColor");
      s.appendChild(p);
      return s;
    }
    function burst(big, word) {
      var c = bellCentre();
      if (calm.matches) return;
      var ring = document.createElement("i");
      ring.className = "ring"; ring.style.left = c.x + "px"; ring.style.top = c.y + "px";
      fx.appendChild(ring);
      ring.animate([{ transform: "scale(0.8)", opacity: 0.95, borderWidth: "4px" }, { transform: "scale(" + (big ? 5.2 : 3.6) + ")", opacity: 0, borderWidth: "1px" }], { duration: big ? 1100 : 800, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = function () { ring.remove(); };
      [0, 1, 2].slice(0, big ? 3 : 2).forEach(function (i) {
        var n = noteSvg(), dx = -30 - Math.random() * 40 + i * 26, rot = (Math.random() - 0.5) * 50;
        n.style.left = c.x + "px"; n.style.top = c.y + "px";
        fx.appendChild(n);
        n.animate([
          { transform: "translate(0,0) scale(0.3) rotate(0deg)", opacity: 0 },
          { transform: "translate(" + dx * 0.4 + "px,-30px) scale(1.15) rotate(" + rot * 0.5 + "deg)", opacity: 1, offset: 0.25 },
          { transform: "translate(" + dx + "px,-" + (110 + i * 22) + "px) scale(0.9) rotate(" + rot + "deg)", opacity: 0 }
        ], { duration: 1400 + i * 160, delay: i * 90, easing: "cubic-bezier(.2,.6,.3,1)", fill: "backwards" }).onfinish = function () { n.remove(); };
      });
      var w = document.createElement("span");
      w.className = "word"; w.textContent = word;
      w.style.left = (c.x - (big ? 44 : 22)) + "px"; w.style.top = (c.y - (big ? 72 : 94)) + "px"; w.style.fontSize = big ? "1.4rem" : "1rem";
      fx.appendChild(w);
      w.animate([{ transform: "scale(0.4)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1, offset: 0.2 }, { transform: "scale(1)", opacity: 1, offset: 0.7 }, { transform: "translateY(-14px) scale(1)", opacity: 0 }], { duration: 1200, easing: "ease-out" }).onfinish = function () { w.remove(); };
    }
    function say(text, ms) {
      bubble.textContent = text;
      if (calm.matches) { bubble.style.opacity = "1"; setTimeout(function () { if (bubble.textContent === text) bubble.style.opacity = "0"; }, ms || 1600); return; }
      bubble.getAnimations().forEach(function (a) { a.cancel(); });
      bubble.animate([
        { opacity: 0, transform: "translateY(10px) scale(0.5)" }, { opacity: 1, transform: "translateY(-3px) scale(1.08)", offset: 0.12 },
        { opacity: 1, transform: "translateY(0) scale(1)", offset: 0.2 }, { opacity: 1, transform: "translateY(0) scale(1)", offset: 0.88 },
        { opacity: 0, transform: "translateY(-6px) scale(0.95)" }
      ], { duration: ms || 1600, easing: "ease-out" });
    }
    function fade(el, to, ms) {
      var from = getComputedStyle(el).opacity;
      el.style.opacity = to;
      if (!calm.matches) el.animate([{ opacity: from }, { opacity: to }], { duration: ms, easing: "ease-out" });
    }

    // ---------- The door ----------
    var doorAnim = null;
    function openDoor() {
      if (doorAnim) doorAnim.cancel();
      door.style.transform = "rotateY(76deg)";
      if (calm.matches) return;
      var sk = springKeys(150, 13, function (p) { return { transform: "rotateY(" + (76 * p).toFixed(2) + "deg)" }; });
      doorAnim = door.animate(sk.keys, { duration: sk.ms, easing: "linear" });
    }
    function closeDoor() {
      if (doorAnim) doorAnim.cancel();
      door.style.transform = "rotateY(0deg)";
      if (calm.matches) return;
      doorAnim = door.animate([
        { transform: "rotateY(76deg)", easing: "cubic-bezier(.5,0,.9,.6)" },
        { transform: "rotateY(0deg)", offset: 0.72, easing: "ease-out" },
        { transform: "rotateY(7deg)", offset: 0.84, easing: "ease-in" },
        { transform: "rotateY(0deg)" }
      ], { duration: 900 });
    }
    function lamp(on) {
      house.classList.toggle("lamp-on", on);
      if (on && !calm.matches) {
        halo.style.opacity = "1";
        halo.animate([{ opacity: 0 }, { opacity: 0.8 }, { opacity: 0.15 }, { opacity: 1 }, { opacity: 0.55 }, { opacity: 1 }], { duration: 700 });
      } else fade(halo, on ? "1" : "0", 900);
    }
    function dressHost(h) {
      outfit.setAttribute("fill", h[1]);
      sleeves.forEach(function (s) { s.setAttribute("stroke", h[1]); });
    }

    // ---------- Ring! ----------
    async function ring(byUser) {
      if (byUser) chime();
      bell.animate([{ transform: "scale(1)" }, { transform: "scale(0.82)", offset: 0.25 }, { transform: "scale(1.08)", offset: 0.6 }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
      burst(false, "ding");
      setTimeout(function () { burst(true, "dong!"); }, calm.matches ? 0 : 480);
      if (S.busy) {
        // already on the way: ringing again only hurries them up
        if (S.open) say("I'm right here!", 1400); else say("Coming, coming!", 1400);
        return;
      }
      S.busy = true;
      var run = ++S.run, h = HOSTS[S.visit++ % HOSTS.length];
      dressHost(h);
      status.innerHTML = "<b>Ding… dong!</b> The bell is ringing inside.";
      await wait(850);
      lamp(true);
      fade(hall, "1", 600); fade(peep, "1", 500);
      await wait(400);
      if (!calm.matches) shade.animate([{ transform: "translateX(0)" }, { transform: "translateX(84px)" }], { duration: 1000, easing: "ease-in-out" });
      status.innerHTML = "<b>" + h[0] + "</b> is coming to the door…";
      await wait(300);
      say("Coming!", 1300);
      await wait(1000);
      if (!calm.matches) knob.animate([{ transform: "rotate(0)" }, { transform: "rotate(-46deg)", offset: 0.5 }, { transform: "rotate(0)" }], { duration: 380, easing: "ease-in-out" });
      await wait(200);
      openDoor(); S.open = true;
      fade(spill, "1", 700);
      if (!calm.matches) {
        host.animate([{ transform: "translateY(8px) scale(0.92)" }, { transform: "translateY(-3px) scale(1.02)", offset: 0.6 }, { transform: "translateY(0) scale(1)" }], { duration: 700, easing: "ease-out", delay: 120, fill: "backwards" });
        arm.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-26deg)" }, { transform: "rotate(14deg)" }, { transform: "rotate(-26deg)" }, { transform: "rotate(14deg)" }, { transform: "rotate(0deg)" }], { duration: 1500, delay: 300, easing: "ease-in-out" });
      }
      await wait(380);
      say(h[2], 2200);
      status.innerHTML = "<b>" + h[0] + "</b> opened the door: “" + h[2] + "”";
      await wait(2700);
      if (run !== S.run) return;
      closeDoor(); S.open = false;
      fade(spill, "0", 500);
      await wait(660);
      if (!calm.matches) front.animate([{ transform: "translateY(0)" }, { transform: "translateY(1.5px)" }, { transform: "translateY(0)" }], { duration: 160 });
      fade(hall, "0", 500); fade(peep, "0", 500);
      status.textContent = "Door closed. Press the bell again for another visit.";
      S.busy = false;
      await wait(2200);
      if (!S.busy) lamp(false);
    }
    bell.addEventListener("click", function (e) { ring(e.isTrusted); });

    // ---------- Auto demo: ring every few seconds until you touch anything ----------
    var demoOn = !calm.matches, timer = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function loop(ms) { timer = setTimeout(function () { if (!demoOn) return; if (!S.busy) ring(false); loop(9400); }, ms); }
    if (demoOn) loop(500);
  })();
</script>
</body>
