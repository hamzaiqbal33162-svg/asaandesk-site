<!doctype html>
<!-- Chill & Craft · Brightfield · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightfield · B2B solar sales dashboard and CRM</title>
<script>
  // Early theme pick: ?theme= wins, then the saved choice, then the system setting
  (function () { try { var q = new URLSearchParams(location.search).get('theme'), s = JSON.parse(localStorage.getItem('da-brightfield:theme') || 'null'); document.documentElement.dataset.theme = q === 'light' || q === 'dark' ? q : s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { } })();
</script>
<style>
/* ---------- Core kit styles: base, controls, layers, table, charts, board (themed by variables) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:14px/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-h,inherit);line-height:1.2}
p{margin:0}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
h1:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--panel-solid,var(--panel));color:var(--text);font-weight:600;font-size:13px;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line-2,var(--muted));box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:var(--muted);transition:background .2s,color .2s,transform .12s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:30px;height:30px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.chip{min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;flex:none;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme=dark] .av{background:hsl(var(--h) 32% 27%);color:hsl(var(--h) 70% 84%)}
.av.lg{width:52px;height:52px;font-size:17px}
.row-acts{display:inline-flex;gap:2px}
kbd{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--hover)}
/* page entrance (dashboards may set --enter to their own keyframes) */
.in{animation:var(--enter,ccRise) .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px)}}
/* layers: modal, drawer, confirm, command search */
.layer{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim,rgba(10,12,20,.48));opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(540px,100%);max-height:min(90vh,780px);display:flex;flex-direction:column;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--rl,16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(14px) scale(.97);transition:opacity .25s,transform .32s cubic-bezier(.2,.8,.2,1)}
.layer.wide .sheet{width:min(860px,100%)}
.layer.open .scrim{opacity:1}
.layer.open .sheet{opacity:1;transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sheet-h h2{font-size:17px;overflow-wrap:anywhere}
.sheet-b{padding:4px 18px 18px;overflow:auto;overscroll-behavior:contain}
.sheet-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.layer.drawer{place-items:stretch end;padding:0}
.layer.drawer .sheet{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rl,16px) 0 0 var(--rl,16px);border-right:0;transform:translateX(60px)}
.layer.drawer.wide .sheet{width:min(640px,100%)}
.layer.drawer.open .sheet{transform:none}
.confirm-m{color:var(--muted)}
.layer.cmdk{place-items:start center;padding-top:12vh}
.layer.cmdk .sheet-h{padding-bottom:4px}
.cmd-in{width:100%;height:44px;padding:0 14px;border-radius:var(--ri,10px);border:1px solid var(--line);background:var(--field,transparent);outline:none;font-size:15px}
.cmd-in:focus{border-color:var(--accent)}
.cmd-l{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto}
.cmd-l li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.cmd-l li small{margin-left:auto;color:var(--muted);font-size:11px}
.cmd-l li[aria-selected=true]{background:var(--hover);color:var(--accent)}
.cmd-empty{color:var(--muted)}
.cmd-k{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.layer.modal{place-items:end center;padding:0}.layer.modal .sheet{border-radius:var(--rl,16px) var(--rl,16px) 0 0;width:100%;transform:translateY(40px)}.layer.modal.open .sheet{transform:none}.layer.cmdk{place-items:start center;padding:10px}}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form.shake{animation:ccShake .35s}
@keyframes ccShake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.f{display:grid;gap:5px;grid-column:1/-1;min-width:0}
.f.half{grid-column:auto}
@media (max-width:520px){.f.half{grid-column:1/-1}}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,transparent);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.f textarea{resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.f [aria-invalid=true]{border-color:var(--bad)}
.f-err{color:var(--bad);font-size:11.5px}
.f-err:empty{display:none}
.f-chk label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}
.f-chk input{width:16px;height:16px;min-height:0;accent-color:var(--accent)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:150;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(12px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:none}
.t-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;flex:none}
.toast.bad .t-ic{background:var(--bad)}
.toast.warn .t-ic{background:var(--warn)}
.t-ic .ic{width:13px;height:13px}
.t-a{margin-left:auto;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0 0 0 8px}
/* tooltip */
#tip{position:fixed;left:0;top:0;z-index:160;pointer-events:none;padding:8px 10px;border-radius:9px;background:var(--tip-bg,#14161c);color:var(--tip-text,#fff);font-size:12px;line-height:1.5;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:240px}
#tip.on{opacity:1;transform:none}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* popovers, menus, notifications */
.pop{position:fixed;z-index:120;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.4);padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.pop.on{opacity:1;transform:none}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:disabled{opacity:.45;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .sw{width:9px;height:9px;border-radius:3px;flex:none}
.menu-t{font-size:11px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.notes{width:min(320px,calc(100vw - 30px))}
.notes-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px}
.notes ul{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:9px;font-size:13px;color:var(--muted)}
.notes li .ic{margin-top:2px}
.notes li span{display:grid}
.notes li small{font-size:11px;opacity:.8}
.notes li.unread{color:var(--text);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.n-empty{justify-content:center}
[data-bell]{position:relative}
[data-bell][data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPing .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ccPing{from{transform:scale(0)}}
/* segmented control */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--rs,10px);background:var(--hover);gap:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);border-radius:calc(var(--rs,10px) - 2px);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--text)}
.seg-i{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:calc(var(--rs,10px) - 2px);background:var(--panel-solid,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s}
/* table */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.srch{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:var(--ri,9px);background:var(--field,transparent);color:var(--muted);flex:1 1 200px;max-width:340px;transition:border-color .2s,box-shadow .2s}
.srch input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--text);padding:6px 0}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:var(--tbl-min,640px)}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.th-b{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.si::after{content:"\2195";opacity:.35;font-size:11px}
th[aria-sort=ascending] .si::after{content:"\2191";opacity:1;color:var(--accent)}
th[aria-sort=descending] .si::after{content:"\2193";opacity:1;color:var(--accent)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{animation:ccRow .35s backwards;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes ccRow{from{opacity:0;transform:translateY(6px)}}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover{background:var(--hover)}
.tbl tr.click:focus-visible{outline-offset:-2px}
.cell-u{display:flex;align-items:center;gap:10px;min-width:0}
.cell-u b{display:block;font-weight:600}
.cell-u small{display:block;color:var(--muted);font-size:11.5px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pg-b{display:flex;gap:4px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);display:inline-grid;place-items:center;font-size:12px;transition:background .2s,transform .12s}
.pager button:active{transform:scale(.92)}
.pager button[aria-current=page]{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{display:grid;justify-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty b{color:var(--text)}
/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid,var(--line));stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font,system-ui,sans-serif)}
.chart .xh{stroke:var(--muted);stroke-dasharray:3 3;opacity:.7}
.chart .dot{stroke:var(--panel-solid,var(--panel));stroke-width:2.5}
.chart .bcol{transition:opacity .2s}
.chart .bcol.dim{opacity:.4}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,.05,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.fade{animation:ccFade 1s .35s backwards}
@keyframes ccFade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.growx{transform-origin:0 50%;animation:ccGrowX .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
@keyframes ccGrowX{from{transform:scaleX(0)}}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px}
.nodata{display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:13px;text-align:center}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-v{position:relative;width:var(--ds,160px);max-width:100%;flex:none}
.donut-t{stroke:var(--hover)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;display:block;line-height:1.1}
.donut-c span{font-size:11px;color:var(--muted)}
.donut .seg{transition:stroke-dasharray 1.1s cubic-bezier(.3,.7,.2,1),stroke-width .2s;cursor:pointer}
.donut .seg.on{stroke-width:15}
.dl{display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl-r{display:grid;grid-template-columns:10px 1fr auto 38px;gap:8px;align-items:center;cursor:default}
.dl-r i{width:10px;height:10px;border-radius:3px}
.dl-r small{color:var(--muted);text-align:right}
.gauge{position:relative;max-width:260px;margin:0 auto}
.g-track{stroke:var(--hover)}
.g-val{transition:stroke-dasharray 1.3s cubic-bezier(.3,.7,.2,1)}
.g-c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.g-c b{display:block;font-size:22px;line-height:1.1}
.g-c span{font-size:11px;color:var(--muted)}
.hb{display:grid;gap:11px}
.hb-t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}
.hb-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:inherit}
.hm{display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.hm-x{text-align:center}
.hm-y{padding-right:6px;white-space:nowrap}
.hm-c{height:20px;border-radius:4px;background:var(--hm,var(--accent));opacity:calc(.08 + var(--a) * .92);transition:transform .15s}
.hm-c:hover{transform:scale(1.15)}
.pop-in{animation:ccPop .5s backwards;animation-delay:calc(var(--j) * 22ms)}
@keyframes ccPop{from{opacity:0;transform:scale(.4)}}
.fn{display:grid;gap:9px}
.fn-r{display:grid;gap:3px}
.fn-r small{font-size:11px;color:var(--muted)}
.fn-bar{width:var(--w);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs,9px);color:#fff;font-size:12.5px;min-width:0;overflow:hidden;white-space:nowrap}
.fn-bar span{overflow:hidden;text-overflow:ellipsis}
.wipe{animation:ccWipe 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes ccWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.spark{min-width:60px}
/* board */
.board{display:grid;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start;scrollbar-width:thin}
.board-y{grid-auto-flow:column;grid-auto-columns:minmax(min(262px,82vw),1fr)}
.board-x{grid-auto-flow:row}
.lane{min-width:0;display:flex;flex-direction:column;transition:background .2s,box-shadow .2s}
.lane-l{display:grid;gap:10px;min-height:84px;align-content:start;padding:2px}
.board-x .lane-l{grid-auto-flow:column;grid-auto-columns:minmax(220px,240px);overflow-x:auto;align-content:stretch;padding-bottom:6px}
.dcard{position:relative;user-select:none;-webkit-user-select:none;cursor:grab;transition:box-shadow .2s,transform .2s,opacity .2s}
.dcard:active{cursor:grabbing}
.dmove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:0;background:var(--hover);color:var(--muted);opacity:0;touch-action:none;cursor:grab;transition:opacity .2s,background .2s}
.dcard:hover .dmove,.dcard:focus-within .dmove,.dmove[aria-expanded=true]{opacity:1}
@media (hover:none){.dmove{opacity:1}}
.dsrc{opacity:.3;outline:2px dashed var(--lc,var(--accent));outline-offset:-2px}
.dghost{position:fixed!important;z-index:140;pointer-events:none;margin:0;box-shadow:0 26px 50px -14px rgba(0,0,0,.45);transform:rotate(var(--tilt,2.5deg)) scale(1.04);transition:transform .2s}
.dghost.drop{transform:none;transition:translate .18s ease-out,transform .18s}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.lane.over{background:color-mix(in srgb,var(--lc,var(--accent)) 10%,transparent)}

/* ================= Brightfield look: soft raised neumorphic panels, sun yellow and deep teal ================= */
:root{--font:"Gill Sans","Gill Sans MT",Calibri,"Segoe UI",system-ui,sans-serif;--bg:#e7ecf1;--panel:#e7ecf1;--panel-solid:#eef2f6;--text:#1d3640;--muted:#6a8290;--line:#d3dbe3;--line-2:#b9c6d2;--hover:#dde4eb;--field:#e7ecf1;--accent:#0f766e;--on-accent:#fff;--sun:#f5b301;--ok:#1a9a62;--warn:#d98e04;--bad:#d9534f;--c1:#0f766e;--c2:#f5b301;--c3:#3b82c4;--c4:#e8743b;--c5:#8f6cc9;--c6:#9cb0bd;--tip-bg:#1d3640;--tip-text:#fff;--sd:rgba(150,168,190,.55);--sl:rgba(255,255,255,.95);--out:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);--out-s:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);--in:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl);--rl:24px;--rb:14px;--ri:14px;--rs:14px;--rm:18px;--enter:bfIn}
[data-theme=dark]{--bg:#152427;--panel:#152427;--panel-solid:#1a2c30;--text:#e3f1f0;--muted:#8fb0b1;--line:#22383c;--line-2:#2e4a4f;--hover:#1b2f33;--field:#152427;--accent:#2dd4bf;--on-accent:#0b1a1c;--sun:#ffc83d;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--c1:#2dd4bf;--c2:#ffc83d;--c3:#60a5fa;--c4:#fb923c;--c5:#b794f4;--c6:#5c7d80;--tip-bg:#e3f1f0;--tip-text:#0b1a1c;--sd:rgba(0,0,0,.5);--sl:rgba(120,190,180,.06)}
@keyframes bfIn{from{opacity:0;transform:scale(.95);box-shadow:none}}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
/* sidebar with a pressed-in sliding marker */
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;z-index:60;background:var(--bg)}

.top .srch-b{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:16px;border:0;background:var(--bg);box-shadow:var(--in);color:var(--muted);flex:1;max-width:440px;text-align:left}

/* pipeline: pressed trays with raised cards */
.lane{border-radius:24px;padding:12px;box-shadow:var(--in)}

.dsrc{outline:0;box-shadow:var(--in)!important;opacity:.5}

/* quote builder */
.qb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px}
.qf{display:grid;gap:14px}
.qrow{display:grid;gap:6px}

.qrow input[type=range]{accent-color:var(--accent);width:100%}

.roof{border-radius:18px;padding:14px;box-shadow:var(--in);min-height:150px}
.roof svg{display:block;width:100%;height:auto}
.pnl{fill:url(#pnlG);stroke:var(--bg);stroke-width:1.5;rx:2}

@keyframes bfPanel{from{opacity:0;transform:scale(.2) rotate(-20deg)}}
.fit{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;color:var(--muted)}
.fit b.ok{color:var(--ok)}.fit b.bad{color:var(--bad)}
/* installs */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:18px}
.site{display:grid;gap:8px;text-align:left;width:100%;font:inherit;color:inherit;border:0;cursor:pointer}
.site .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.site b{font-weight:700}
.site .now{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}

.big{display:block;font-size:32px;font-weight:600;margin:4px 0 12px}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stg button{flex:1 1 74px;padding:9px 4px;border-radius:12px;border:0;background:var(--bg);box-shadow:var(--out-s);font-size:12px;font-weight:700;color:var(--muted)}
.stg button[aria-pressed=true]{box-shadow:var(--in);color:var(--accent)}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lst li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;box-shadow:var(--in);font-size:13.5px}
.lst .t{flex:1;min-width:0}.lst .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lst .t small{color:var(--muted)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row b{display:block}.set-row small{color:var(--muted);font-size:12.5px}
.nm{position:relative;width:52px;height:30px;border-radius:99px;border:0;background:var(--bg);box-shadow:var(--in);padding:0;flex:none}
.nm::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--bg);box-shadow:var(--out-s);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .3s}

/* responsive */
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero,.qb{grid-template-columns:minmax(0,1fr)}}
@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:600px){.top .srch-b span,.top .srch-b kbd,.top .btn .lbl{display:none}.top .srch-b{flex:0 0 44px;padding:0;justify-content:center}.page-h h1{font-size:26px}.kpi b{font-size:22px}.qsum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kv{grid-template-columns:1fr}.card{padding:16px}.grid{gap:16px}}

/* ================= Core kit: router, charts, table, board, modal, toast =================

const FIRST = ['Ayesha', 'Bilal', 'Hamza', 'Sana', 'Usman', 'Mahnoor', 'Ali', 'Fatima', 'Zain', 'Hira', 'Saad', 'Iqra', 'Omar', 'Maryam', 'Faraz', 'Noor', 'Danish', 'Amna', 'Rehan', 'Zoya', 'Talha', 'Areeba', 'Kashif', 'Mehwish', 'Junaid', 'Rabia', 'Haris', 'Sadia', 'Imran', 'Laiba', 'Fahad', 'Anum'];

// ---------- Signature: the solar day (sun follows the clock, or scrub it) ----------
function solarDay(el, getH) {
  el.classList.add('chart', 'sday');
  chartMount(el, first => {
    const W = Math.max(200, el.clientWidth || 620), H = 210, cx = W / 2, by = H - 26, R = Math.min(W * .42, H - 46);
    const X = h => cx - R + 2 * R * (h - SUN_UP) / (SUN_DN - SUN_UP), Y = h => by - (R * .92) * sunF(h);
    let curve = ''; for (let h = SUN_UP; h <= SUN_DN + .001; h += .25) curve += (curve ? 'L' : 'M') + r1(X(h)) + ',' + r1(Y(h));
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Solar day: output across daylight hours"><defs><linearGradient id="genG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--sun);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></linearGradient><clipPath id="sdClip"><rect x="0" y="0" height="${H}" width="0"/></clipPath></defs>
      <path class="arc" d="M${r1(cx - R)},${by}A${r1(R)},${r1(R)} 0 0 1 ${r1(cx + R)},${by}"/><line class="hz" x1="0" x2="${W}" y1="${by}" y2="${by}"/>
      <g clip-path="url(#sdClip)"><path class="gen" d="${curve}L${r1(X(SUN_DN))},${by}L${r1(X(SUN_UP))},${by}Z"/><path class="genl" d="${curve}"/></g>
      ${[6.5, 9, 12, 15, 17.75].map(h => `<text x="${r1(X(h))}" y="${H - 6}" text-anchor="middle">${hm(h)}</text>`).join('')}
      <g class="sun"><g class="rays">${Array.from({ length: 8 }, (_, i) => `<line x1="0" y1="-19" x2="0" y2="-25" style="stroke:var(--sun)" stroke-width="3" stroke-linecap="round" transform="rotate(${i * 45})"/>`).join('')}</g><circle r="13" style="fill:var(--sun)"/><circle r="13" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/></g></svg>`;
    const sunG = $('.sun', el), clip = $('#sdClip rect', el);
    el._set = (h, anim) => {
      const day = h > SUN_UP && h < SUN_DN, ang = Math.PI * (1 - clamp((h - SUN_UP) / (SUN_DN - SUN_UP), 0, 1)), x = day ? cx + R * Math.cos(ang) : (h <= SUN_UP ? cx - R : cx + R), y = day ? by - R * Math.sin(ang) : by + 6;
      sunG.style.transform = `translate(${r1(x)}px,${r1(y)}px)`; sunG.style.opacity = day ? 1 : .35;
      const w = clamp(X(clamp(h, SUN_UP, SUN_DN)), 0, W);
      if (anim && !RM()) { const from = +clip.getAttribute('width') || 0; tween(1200, t => clip.setAttribute('width', sz(from + (w - from) * t))); } else clip.setAttribute('width', sz(w));
    };
    el._set(getH(), first);
    el.onpointermove = el.onpointerdown = e => { const r = el.getBoundingClientRect(), xs = (e.clientX - r.left) * W / (r.width || W), h = clamp(SUN_UP + (xs - (cx - R)) / (2 * R) * (SUN_DN - SUN_UP), SUN_UP, SUN_DN); tip(`<b>${hm(h)}</b><div>Fleet output: <b>${fmtKw(fleetKw(h))}</b></div>`, e.clientX, e.clientY); };
    el.onpointerleave = untip;
  });
}

    <button type="button" class="btn primary" data-save style="justify-self:start">${ic('file', 16)} Save as proposal</button>
  </div></article>
  <article class="card"><div class="qsum"><div><span>System size</span><b id="rk">0</b></div><div><span>Panels</span><b id="rp">0</b></div><div><span>Price</span><b id="rc">0</b></div><div><span>Saves a year</span><b id="rs">0</b></div><div><span>Pays back in</span><b id="rb">0</b></div><div><span>Monthly units</span><b id="ru">0</b></div></div>
    <div class="roof" id="roof" aria-live="polite"></div><div class="fit"><span id="fitA"></span><b id="fitB"></b></div></article></section>
  <article class="card"><div class="card-h"><h2>25 years of savings</h2><span class="muted" id="be"></span></div><div id="sv"></div></article>`;
  let last = -1;
  const draw = () => {
    const c = calc(q);
    $('#obill', out).textContent = fmt.money(q.bill); $('#oroof', out).textContent = fmt.n(q.roof) + ' sq ft'; $('#oh', out).textContent = q.hours.toFixed(1) + ' h';
    countUp($('#rk', out), c.kw, fmtKw, 500); countUp($('#rp', out), c.panels, fmt.n, 500); countUp($('#rc', out), c.cost, fmt.mshort, 500); countUp($('#rs', out), c.save1, fmt.mshort, 500); $('#rb', out).textContent = c.payback.toFixed(1) + ' yrs'; countUp($('#ru', out), c.units, fmt.n, 500);
    const fits = c.area <= q.roof; $('#fitA', out).textContent = `Needs about ${fmt.n(c.area)} sq ft`; const fb = $('#fitB', out); fb.textContent = fits ? 'Fits on the roof' : 'Too big for the roof'; fb.className = fits ? 'ok' : 'bad';
    // panel grid: redraw only when the count changes, new panels pop in
    if (c.panels !== last) {
      const shown = Math.min(c.panels, 160), cols = Math.max(8, Math.ceil(Math.sqrt(shown * 2.2))), rows = Math.ceil(shown / cols), pw = 22, ph = 14, g = 3, W = cols * (pw + g), H = rows * (ph + g);
      $('#roof', out).innerHTML = `<svg viewBox="0 0 ${W} ${Math.max(H, 40)}" role="img" aria-label="${c.panels} panels"><defs><linearGradient id="pnlG" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2f5d8a"/><stop offset="1" stop-color="#173a5c"/></linearGradient></defs>${Array.from({ length: shown }, (_, i) => `<rect class="pnl${i >= last ? ' in' : ''}" style="--k:${Math.max(0, i - Math.max(0, last))}" x="${(i % cols) * (pw + g)}" y="${Math.floor(i / cols) * (ph + g)}" width="${pw}" height="${ph}" rx="2"/>`).join('')}</svg>${c.panels > shown ? `<p class="muted" style="font-size:12px;margin-top:6px">+ ${c.panels - shown} more panels</p>` : ''}`;
      last = c.panels;
    }
    const yrs = Array.from({ length: 26 }, (_, i) => i), cum = yrs.map(y => Math.round(c.save1 * y * Math.pow(1.04, y / 2)));
    lineChart($('#sv', out), { labels: yrs.map(y => 'Y' + y), series: [{ name: 'Savings', data: cum, color: '--c1' }, { name: 'System price', data: yrs.map(() => c.cost), dash: true, color: '--c4' }], height: 220, fmt: fmt.money, yfmt: fmt.mshort, yw: 60, label: 'Savings over 25 years' });
    const be = cum.findIndex(v => v >= c.cost); $('#be', out).textContent = be > 0 ? `Breaks even in year ${be}` : 'Breaks even after 25 years';
  };
  draw();
  let t; const later = () => { clearTimeout(t); t = setTimeout(draw, 60); };
  $('#qbill', out).addEventListener('input', e => { q.bill = +e.target.value; later(); });
  $('#qroof', out).addEventListener('input', e => { q.roof = +e.target.value; later(); });
  $('#qh', out).addEventListener('input', e => { q.hours = +e.target.value; later(); });
  $('#qa', out).addEventListener('change', e => { q.acct = e.target.value; const a = DB.accounts.find(x => x.name === q.acct); if (a) { q.bill = clamp(a.bill, 50000, 3000000); $('#qbill', out).value = q.bill; } draw(); });
  segBind(out, v => { q.type = v; draw(); });
  $('[data-save]', out).onclick = () => { const c = calc(q); if (c.area > q.roof) { toast('This system does not fit the roof. Lower the size or add roof area.', 'bad'); return; } const d = { id: uid('d'), acct: q.acct, kw: c.kw, value: c.cost, stage: 'proposal', owner: DB.team[0], roof: 'Flat concrete', close: TODAY + 21 * DAY, order: -1 }; DB.deals.push(d); save(); toast(`Proposal saved · ${c.kw} kW for ${q.acct}`, 'ok', { label: 'View', run: () => { location.hash = '#/pipeline'; } }); };
}

// ---------- Page: Installs (live meters) ----------
function pInstalls(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Installs</h1><p>Live output across every system we have built.</p></div><div class="ph-a"><span class="pill ok">● updating</span></div></div><div class="fleet" id="fl"></div>`;
  const draw = () => { const h = nowH(); $('#fl', out).innerHTML = DB.sites.map((s, i) => { const k = s.online ? s.kw * s.eff * sunF(h) : 0; return `<button type="button" class="card site in" style="--i:${Math.min(i, 12)}" data-s="${s.id}"><span class="hd"><b>${esc(s.acct)}</b><span class="dot${s.online ? '' : ' off'}" title="${s.online ? 'Online' : 'Maintenance'}"></span></span><span class="muted" style="font-size:12.5px">${esc(s.city)} · ${s.kw} kW system</span><span class="now"><span data-k="${s.id}">${fmt.n(k)}</span> <small>kW now</small></span><span class="meter"><i style="width:${Math.round(k / s.kw * 100)}%"></i></span></button>`; }).join(''); };
  draw();
  pageEvery(2000, () => { const h = nowH(); DB.sites.forEach(s => { const el = $(`[data-k="${s.id}"]`, out); if (!el) return; const k = s.online ? s.kw * s.eff * sunF(h) * (1 + (Math.random() - .5) * .06) : 0; el.textContent = fmt.n(k); el.closest('.site').querySelector('.meter i').style.width = Math.round(k / s.kw * 100) + '%'; }); });
  out.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b) return; const s = DB.sites.find(x => x.id === b.dataset.s);
    const D = drawer(s.acct, `<b class="big">${s.kw} kW</b><dl class="kv"><div><dt>City</dt><dd>${esc(s.city)}</dd></div><div><dt>Live since</dt><dd>${fmt.dateY(s.since)}</dd></div><div><dt>Performance</dt><dd>${Math.round(s.eff * 100)}%</dd></div><div><dt>Status</dt><dd>${s.online ? 'Online' : 'Maintenance'}</dd></div></dl><div id="sdc"></div>`, `<button type="button" class="btn" data-tg>${s.online ? 'Start maintenance' : 'Bring online'}</button><button type="button" class="btn primary" data-x>Done</button>`);
    lineChart($('#sdc', D.el), { labels: Array.from({ length: 23 }, (_, i) => hm(6 + i / 2)), series: [{ name: 'Output', data: Array.from({ length: 23 }, (_, i) => Math.round(s.kw * s.eff * sunF(6 + i / 2))), color: '--c2' }], height: 180, fmt: fmtKw, label: 'Output today' });
    $('[data-tg]', D.el).onclick = () => { s.online = !s.online; save(); D.close(); draw(); toast(s.online ? `${s.acct} is back online` : `${s.acct} is in maintenance`); };
  });
}

// ---------- Page: Reports ----------
function pReports(out) {
  out.innerHTML = `<div class="page-h"><div><h1>Reports</h1><p>Kilowatts sold, where they went and how fast deals close.</p></div></div>
  <section class="grid g-2"><article class="card"><div class="card-h"><h2>kW signed per month</h2></div><div id="r1"></div></article><article class="card"><div class="card-h"><h2>Accounts by industry</h2></div><div id="r2"></div></article></section>
  <section class="grid g-3"><article class="card"><div class="card-h"><h2>Stage funnel</h2></div><div id="r3"></div></article><article class="card"><div class="card-h"><h2>Pipeline by owner</h2></div><div id="r4"></div></article><article class="card"><div class="card-h"><h2>Average price per kW</h2></div><div id="r5"></div></article></section>`;
  barChart($('#r1', out), { labels: monthsBack(12), height: 230, fmt: fmtKw, series: [{ name: 'kW signed', data: DB.kwMonth, color: '--c2' }], label: 'kW signed per month' });
  donut($('#r2', out), { data: IND.map(i => ({ label: i, value: DB.accounts.filter(a => a.industry === i).length })), center: { value: String(DB.accounts.length), label: 'accounts' }, label: 'Accounts by industry' });
  funnel($('#r3', out), { steps: STAGES.map((s, i) => ({ label: s.name, value: DB.deals.filter(d => STAGES.findIndex(x => x.id === d.stage) >= i).length, color: s.color })) });
  hbars($('#r4', out), DB.team.map(t => ({ label: t, value: sum(DB.deals.filter(d => d.owner === t && d.stage !== 'signed').map(d => d.kw)), note: 'kW in play' })), { fmt: fmtKw, ci: 0 });
  lineChart($('#r5', out), { labels: monthsBack(12), series: [{ name: 'Rs per kW', data: DB.rev.map((v, i) => Math.round(v / Math.max(1, DB.kwMonth[i]))), color: '--c3' }], height: 180, fmt: fmt.money, yfmt: fmt.mshort, zero: false, label: 'Average price per kW' });
}

// ---------- Page: Settings ----------
function pSettings(out) {
  const pf = [{ name: 'kw', label: 'Price per kW, on-grid (Rs)', type: 'number', min: 50000, required: true, half: true }, { name: 'batt', label: 'Battery add-on per kW (Rs)', type: 'number', min: 0, required: true, half: true }, { name: 'watt', label: 'Panel size (W)', type: 'number', min: 200, max: 800, required: true, half: true }, { name: 'tariff', label: 'Grid tariff (Rs per unit)', type: 'number', min: 10, max: 200, required: true, half: true }];
  out.innerHTML = `<div class="page-h"><div><h1>Settings</h1><p>Pricing used by the quote builder, alerts and theme.</p></div></div><section class="grid g-2"><article class="card"><div class="card-h"><h2>Pricing</h2></div><form class="form" id="pf" novalidate>${pf.map(f => fieldHtml(f, DB.price[f.name], 'pf')).join('')}<div class="f"><button type="submit" class="btn primary" style="justify-self:start">Save pricing</button></div></form></article>
  <article class="card"><div class="card-h"><h2>Alerts and theme</h2></div>${[['survey', 'Survey reminders', 'Remind the owner the day before a site survey'], ['finance', 'Financing updates', 'When a bank answers a financing request'], ['weekly', 'Weekly kW report', 'Every Friday afternoon']].map(([k, t, s]) => `<div class="set-row"><div><b id="sl_${k}">${t}</b><small>${s}</small></div><button type="button" class="nm" role="switch" aria-checked="${!!DB.prefs[k]}" aria-labelledby="sl_${k}" data-pr="${k}"></button></div>`).join('')}<div class="set-row"><div><b>Theme</b><small>Daylight or night shift</small></div>${seg('Theme', [{ v: 'light', l: 'Day' }, { v: 'dark', l: 'Night' }], document.documentElement.dataset.theme)}</div><div class="set-row"><div><b>Reset demo data</b><small>Restore sample accounts, deals and sites</small></div><button type="button" class="btn danger sm" data-reset>Reset</button></div></article></section>`;
  const fm = $('#pf', out);
  fm.addEventListener('submit', e => { e.preventDefault(); const v = readForm(fm, pf), er = checkForm(pf, v); pf.forEach(f => { const el = fm.elements.namedItem(f.name); if (er[f.name]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); $('#pf_' + f.name + '_e', out).textContent = er[f.name] || ''; }); if (Object.keys(er).length) return; Object.assign(DB.price, v); save(); toast('Pricing saved. New quotes use it.'); });
  segBind(out, v => { store.set(KEY + ':theme', v); applyTheme(v); });
  out.addEventListener('click', e => { const t = e.target.closest('[data-pr]'); if (t) { const k = t.dataset.pr; DB.prefs[k] = !DB.prefs[k]; t.setAttribute('aria-checked', String(DB.prefs[k])); save(); toast('Saved'); } if (e.target.closest('[data-reset]')) ask('Reset all demo data?', { ok: 'Reset' }).then(ok => { if (!ok) return; DB = seed(); save(); APP.refresh(); toast('Demo data restored'); }); });
}

// ---------- Start ----------
const APP = startApp({
  key: KEY, name: 'Brightfield', def: 'overview', outlet: $('#main'), nav: $('[data-nav]'), marker: $('.pit'),
  pages: { overview: { title: 'Overview', icon: 'sun', render: pOverview }, pipeline: { title: 'Pipeline', icon: 'board', render: pPipeline }, accounts: { title: 'Accounts', icon: 'building', render: pAccounts }, quote: { title: 'Quote builder', icon: 'zap', render: pQuote }, installs: { title: 'Installs', icon: 'pin', render: pInstalls }, reports: { title: 'Reports', icon: 'chart', render: pReports }, settings: { title: 'Settings', icon: 'sliders', render: pSettings } },
  notes: [['Bank approved financing for a 320 kW mill system', 'win', 30], ['Site survey tomorrow in Faisalabad', 'info', 120], ['One system went into maintenance', 'bad', 400, true]],
  cmd: () => [{ label: 'New quote', hint: 'Action', icon: 'zap', run: () => { location.hash = '#/quote'; } }, { label: 'New deal', hint: 'Action', icon: 'plus', run: () => newDeal() }, ...DB.deals.map(d => ({ label: d.acct + ' · ' + d.kw + ' kW', hint: STAGES.find(s => s.id === d.stage).name, icon: 'board', run: () => openDeal(d) })), ...DB.accounts.map(a => ({ label: a.name, hint: 'Account · ' + a.city, icon: 'building', run: () => { location.hash = '#/accounts'; } }))]
});
sideTick();
</script>
</body>
</html>
