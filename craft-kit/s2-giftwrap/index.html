<!doctype html>
<!-- Chill & Craft · Giftwrap · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Giftwrap · Send a gift card that wraps itself</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg1: #fff1f2;
    --bg2: #fde3e8;
    --card: #ffffff;
    --well: #fff7f8;
    --ink: #2a1219;
    --muted: #84626b;
    --line: rgba(42, 18, 25, 0.12);
    --ruby: #c81d4e;
    --ruby2: #a3123b;
    --gold: #e7b549;
    --ok: #179e68;
    --bad: #d93a32;
    --shadow: rgba(120, 20, 50, 0.32);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg1: #1d0c14;
    --bg2: #12070d;
    --card: #1f1118;
    --well: #180c12;
    --ink: #fbecef;
    --muted: #b8949d;
    --line: rgba(251, 236, 239, 0.11);
    --ruby: #e8386b;
    --ruby2: #c4204f;
    --gold: #f1c35c;
    --ok: #40d69c;
    --bad: #ff6a5f;
    --shadow: rgba(0, 0, 0, 0.75);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg2); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- Stage: blush paper with slow drifting confetti ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; background: radial-gradient(90% 70% at 50% 20%, var(--bg1), var(--bg2)); }
  .drift { position: absolute; z-index: -1; top: -20px; width: 8px; height: 8px; border-radius: 2px; opacity: 0.5; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }

  .wrap { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 340px); gap: 26px; align-items: center; justify-content: center; width: min(760px, 100%); padding: 20px; border-radius: 30px; background: color-mix(in srgb, var(--card) 72%, transparent); box-shadow: 0 0 0 1px var(--line), 0 50px 80px -50px var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }

  /* ---------- Preview: voucher, gift box and receipt ---------- */
  .scene { position: relative; height: 300px; display: grid; place-items: center; perspective: 900px; }
  .voucher { --v1: #0f7a5a; --v2: #0a4e3b; position: relative; width: 300px; max-width: 100%; aspect-ratio: 1.6; padding: 16px 18px; border-radius: 20px; color: #fff; background: linear-gradient(140deg, var(--v1), var(--v2)); box-shadow: 0 26px 40px -24px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.18); overflow: hidden; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1), background 0.5s; animation: float 6s ease-in-out infinite; z-index: 1; }
  @keyframes float { 50% { translate: 0 -6px; } }
  .voucher .pat { position: absolute; inset: 0; opacity: 0.28; pointer-events: none; }
  .voucher .pat svg { width: 100%; height: 100%; }
  .voucher::after { content: ""; position: absolute; inset: -30%; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.35) 50%, transparent 60%); transform: translateX(-60%); animation: holo 5s ease-in-out 1.5s infinite; pointer-events: none; }
  @keyframes holo { 0%, 65% { transform: translateX(-60%); } 90%, 100% { transform: translateX(60%); } }
  .vtop { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.9; }
  .vtop b { font-size: 0.82rem; letter-spacing: 0.02em; text-transform: none; }
  .amt { position: relative; margin-top: 18px; font-size: 2.05rem; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .amt small { font-size: 0.9rem; font-weight: 800; margin-right: 4px; opacity: 0.85; }
  .vfor { position: relative; margin-top: 12px; font-size: 0.82rem; font-weight: 700; }
  .vmsg { position: relative; margin-top: 3px; font-size: 0.74rem; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chipgold { position: absolute; right: 18px; bottom: 16px; width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #fff1c2, var(--gold) 45%, #a87a1c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }
  .chipgold::before { content: ""; position: absolute; inset: 7px 0; border-top: 1px solid rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(0, 0, 0, 0.2); }

  .box { position: absolute; left: 50%; bottom: 0; z-index: 2; width: 220px; height: 198px; margin-left: -110px; opacity: 0; pointer-events: none; }
  .box svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .box svg * { transform-box: view-box; }
  .lid { transform-origin: 110px 64px; }
  .bow { transform-origin: 110px 54px; }
  .gtag { transform-origin: 140px 58px; }

  .receipt { position: absolute; inset: 10px 0; z-index: 3; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; opacity: 0; visibility: hidden; transition: opacity 0.4s, visibility 0.4s; }
  .receipt.show { opacity: 1; visibility: visible; }
  .receipt .badge { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: var(--ok); color: #fff; box-shadow: 0 14px 24px -12px var(--ok); }
  .receipt .badge svg { width: 30px; height: 30px; }
  .receipt h2 { margin: 6px 0 0; font-size: 1.12rem; }
  .receipt p { margin: 0; font-size: 0.84rem; color: var(--muted); max-width: 280px; }
  .code { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 6px 6px 14px; border-radius: 13px; background: var(--well); box-shadow: inset 0 0 0 1.5px var(--line); }
  .code b { font: 800 0.92rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.06em; }
  .sm { height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--ink); color: var(--card); font-size: 0.78rem; font-weight: 800; cursor: pointer; }
  .again { margin-top: 6px; height: 36px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 11px; background: transparent; font-size: 0.8rem; font-weight: 800; cursor: pointer; }

  /* ---------- Form ---------- */
  .form { display: grid; gap: 12px; }
  .lbl { display: block; margin: 0 0 6px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 34px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--card); font-size: 0.8rem; font-weight: 800; cursor: pointer; font-variant-numeric: tabular-nums; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.2s, border-color 0.2s, color 0.2s; }
  .chip:hover { transform: translateY(-2px); border-color: var(--ruby); }
  .chip[aria-pressed="true"] { background: var(--ruby); border-color: var(--ruby); color: #fff; }
  .chips.occ { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .occ .chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; padding: 0 4px; font-size: 0.74rem; white-space: nowrap; }
  .occ .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--d); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6); }
  .other { display: none; width: 110px; height: 34px; padding: 0 10px; border: 0; border-radius: 11px; background: var(--well); box-shadow: inset 0 0 0 1.5px var(--ruby); font-weight: 800; font-size: 0.82rem; outline: none; }
  .other.on { display: inline-block; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .inp { width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--well); box-shadow: inset 0 0 0 1.5px var(--line); outline: none; font-size: 0.86rem; transition: box-shadow 0.2s; }
  .inp:focus { box-shadow: inset 0 0 0 2px var(--ruby); }
  .inp.bad { box-shadow: inset 0 0 0 2px var(--bad); }
  textarea.inp { height: 58px; padding: 9px 12px; resize: none; line-height: 1.35; }
  .msgrow { position: relative; }
  .msgrow small { position: absolute; right: 10px; bottom: 7px; font-size: 0.66rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { min-height: 1em; margin: -4px 0 0; font-size: 0.74rem; font-weight: 700; color: var(--bad); }
  .pay { display: flex; align-items: center; gap: 12px; }
  .pay > span { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
  .pay > span b { display: block; font-size: 0.98rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .send { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; height: 50px; padding: 0 20px; border: 0; border-radius: 16px; background: linear-gradient(180deg, var(--ruby), var(--ruby2)); color: #fff; font-weight: 900; font-size: 0.92rem; cursor: pointer; box-shadow: 0 16px 24px -14px rgba(180, 20, 60, 0.95), inset 0 -3px 0 rgba(0, 0, 0, 0.16); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); white-space: nowrap; }
  .send:hover { transform: translateY(-2px); }
  .send:active { transform: scale(0.95); }
  .send svg { width: 20px; height: 20px; }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .conf { position: absolute; left: 0; top: 0; width: 8px; height: 12px; border-radius: 2px; }

  @media (max-width: 760px) {
    .stage { padding: 16px; }
    .wrap { grid-template-columns: 1fr; gap: 10px; padding: 16px; max-width: 420px; }
    .scene { height: 226px; }
    .voucher { width: 264px; padding: 14px 16px; }
    .amt { margin-top: 14px; }
    .box { width: 180px; height: 162px; margin-left: -90px; }
    .receipt { inset: 0; gap: 4px; }
    .receipt .badge { width: 46px; height: 46px; }
    .receipt h2 { margin-top: 2px; font-size: 1.02rem; }
    .receipt p { font-size: 0.8rem; }
    .again { height: 32px; margin-top: 2px; }
    .chip { padding: 0 9px; font-size: 0.76rem; }
    textarea.inp { height: 50px; }
  }
  @media (max-width: 360px) {
    .two { grid-template-columns: 1fr; }
    .amt { font-size: 1.7rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drift, .wrap, .voucher, .voucher::after { animation: none !important; }
    .voucher { transform: none; transition: none; }
    .chip, .send, .inp, .receipt { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="wrap">
      <div class="scene" id="scene">
        <div class="voucher" id="voucher" aria-hidden="true">
          <span class="pat" id="pat"></span>
          <div class="vtop"><span>Gift card</span><b>Noor &amp; Co.</b></div>
          <div class="amt"><small>PKR</small><span id="vAmt">2,500</span></div>
          <div class="vfor" id="vFor">For someone special</div>
          <div class="vmsg" id="vMsg">Your note shows here</div>
          <span class="chipgold"></span>
        </div>
        <div class="box" id="box" aria-hidden="true">
          <svg viewBox="0 0 220 198">
            <defs>
              <linearGradient id="bx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" id="bx1" stop-color="#0f7a5a" /><stop offset="1" id="bx2" stop-color="#0a4e3b" /></linearGradient>
              <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8" /><stop offset=".5" stop-color="#e7b549" /><stop offset="1" stop-color="#b8861f" /></linearGradient>
            </defs>
            <ellipse cx="110" cy="192" rx="86" ry="7" fill="rgba(0,0,0,.18)" />
            <rect class="bxr" x="36" y="80" width="148" height="108" rx="8" fill="url(#bx)" stroke-width="2" />
            <rect x="36" y="80" width="148" height="12" fill="rgba(0,0,0,.18)" />
            <path id="ribV" d="M110 84V188" stroke="url(#gd)" stroke-width="18" fill="none" />
            <path id="ribH" d="M36 134H184" stroke="url(#gd)" stroke-width="13" fill="none" />
            <g class="lid" id="lid">
              <rect class="bxr" x="28" y="58" width="164" height="28" rx="7" fill="url(#bx)" stroke-width="2" />
              <rect x="28" y="78" width="164" height="8" rx="3" fill="rgba(0,0,0,.15)" />
              <path id="ribL" d="M110 58V86" stroke="url(#gd)" stroke-width="18" fill="none" />
            </g>
            <g class="bow" id="bow">
              <path d="M110 56c-24-30-50-16-40 2 7 12 26 4 40-2Z" fill="url(#gd)" stroke="#b8861f" stroke-width="1.5" />
              <path d="M110 56c24-30 50-16 40 2-7 12-26 4-40-2Z" fill="url(#gd)" stroke="#b8861f" stroke-width="1.5" />
              <path d="M104 58 92 82M116 58l12 24" stroke="url(#gd)" stroke-width="6" stroke-linecap="round" />
              <circle cx="110" cy="56" r="8" fill="#e7b549" stroke="#b8861f" stroke-width="1.5" />
            </g>
            <g class="gtag" id="gtag">
              <path d="M140 58c8 6 14 12 18 22" stroke="#b8861f" stroke-width="1.4" fill="none" />
              <g transform="translate(146 78) rotate(14)"><rect width="58" height="26" rx="5" fill="#fff8ea" stroke="#d9b77a" /><circle cx="7" cy="13" r="2.4" fill="#d9b77a" /><text id="tagText" x="33" y="17" text-anchor="middle" font-size="10" font-weight="800" fill="#2a1219" font-family="system-ui, sans-serif">To Zainab</text></g>
            </g>
          </svg>
        </div>
        <div class="receipt" id="receipt" aria-hidden="true">
          <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg></span>
          <h2 id="rTitle">Gift sent</h2>
          <p id="rInfo"></p>
          <div class="code"><b id="rCode">GFT-0000-0000</b><button class="sm" id="copyCode" type="button">Copy code</button></div>
          <button class="again" id="again" type="button">Send another</button>
        </div>
      </div>

      <form class="form" id="form" novalidate>
        <div>
          <span class="lbl" id="lOcc">Occasion</span>
          <div class="chips occ" role="group" aria-labelledby="lOcc" id="occ"></div>
        </div>
        <div>
          <span class="lbl" id="lAmt">Amount</span>
          <div class="chips" role="group" aria-labelledby="lAmt" id="amts">
            <button class="chip" type="button" data-a="1000">1,000</button><button class="chip" type="button" data-a="2500">2,500</button><button class="chip" type="button" data-a="5000">5,000</button><button class="chip" type="button" data-a="other">Other</button>
            <label class="sr-only" for="other">Other amount in rupees</label><input class="other" id="other" type="number" inputmode="numeric" min="500" max="50000" step="100" placeholder="PKR" />
          </div>
        </div>
        <div class="two">
          <div><label class="lbl" for="name">To</label><input class="inp" id="name" maxlength="28" placeholder="Their name" autocomplete="off" /></div>
          <div><label class="lbl" for="contact">Email or phone</label><input class="inp" id="contact" maxlength="40" placeholder="name@mail.example" autocomplete="off" /></div>
        </div>
        <div class="msgrow"><label class="lbl" for="note">Message</label><textarea class="inp" id="note" maxlength="90" placeholder="Write a short note"></textarea><small id="noteCount">0/90</small></div>
        <p class="err" id="err" aria-live="assertive"></p>
        <div class="pay"><span>You pay<b id="pay">PKR 2,500</b>no fees</span><button class="send" id="send" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2" /><path d="M2 9h20M12 9v12M12 9c-2-4-7-5-7-2s5 2 7 2c2 0 7 1 7-2s-5-2-7 2Z" /></svg><span id="sendText">Wrap and send</span></button></div>
      </form>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Giftwrap: design a gift card, then watch it get boxed, ribboned and sent ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { $("#status").textContent = t; };
  const pkr = (n) => n.toLocaleString("en-US");
  // blend two hex colours: t = 0 gives a, t = 1 gives b
  const mix = (a, b, t) => {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const x = p(a), y = p(b);
    return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
  };

  // Background confetti that drifts down slowly
  (function () {
    const cols = ["#e7b549", "#c81d4e", "#ff9fb7", "#1d9b78"];
    for (let i = 0; i < 14; i++) {
      const d = document.createElement("i");
      d.className = "drift";
      d.setAttribute("aria-hidden", "true");
      d.style.left = (i * 7.3 + Math.random() * 4) % 100 + "%";
      d.style.background = cols[i % cols.length];
      d.style.animationDuration = 9 + Math.random() * 9 + "s";
      d.style.animationDelay = -Math.random() * 18 + "s";
      $("#stage").appendChild(d);
    }
  })();

  // ---------- Occasions restyle the card and the box ----------
  const OCC = [
    { id: "eid", name: "Eid", v1: "#0f7a5a", v2: "#0a4e3b", pat: '<svg viewBox="0 0 300 188"><g fill="#fff"><path d="M250 30a22 22 0 1 0 16 36 18 18 0 1 1-16-36Z"/><path d="m40 40 3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/><path d="m200 140 2 5 5 1-4 3 1 5-4-2-4 2 1-5-4-3 5-1Z"/><path d="m120 24 2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1Z"/></g></svg>' },
    { id: "bday", name: "Birthday", v1: "#e84a8a", v2: "#a8226a", pat: '<svg viewBox="0 0 300 188"><g fill="#fff"><rect x="30" y="30" width="8" height="14" rx="2" transform="rotate(20 34 37)"/><rect x="250" y="40" width="8" height="14" rx="2" transform="rotate(-30 254 47)"/><circle cx="200" cy="30" r="5"/><circle cx="60" cy="150" r="4"/><rect x="220" y="140" width="8" height="14" rx="2" transform="rotate(50 224 147)"/><circle cx="150" cy="170" r="3"/><rect x="110" y="20" width="6" height="12" rx="2" transform="rotate(-15 113 26)"/></g></svg>' },
    { id: "thanks", name: "Thank you", v1: "#128a8a", v2: "#0b5560", pat: '<svg viewBox="0 0 300 188"><g fill="#fff"><path d="M250 20c30 10 30 50 0 60-10-20-10-40 0-60Z"/><path d="M30 140c20-20 50-10 50 10-20 10-40 6-50-10Z"/><path d="M200 150c10-14 30-12 34 0-12 8-24 8-34 0Z"/></g></svg>' },
    { id: "wedding", name: "Wedding", v1: "#b0173f", v2: "#6e0b28", pat: '<svg viewBox="0 0 300 188"><g fill="none" stroke="#ffd98a" stroke-width="2.5"><path d="M250 20c20 0 30 20 16 34-10 10-26 4-24-8 2-10 16-10 16-2"/><path d="M30 150c-10-20 6-40 26-34 14 4 14 22 2 24-8 2-12-8-6-12"/><circle cx="210" cy="160" r="10"/><circle cx="210" cy="160" r="4"/><circle cx="120" cy="22" r="6"/></g></svg>' }
  ];
  let occ = OCC[0], amount = 2500, shownAmt = 2500;
  const occWrap = $("#occ");
  OCC.forEach((o) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.o = o.id;
    b.style.setProperty("--d", o.v1);
    b.innerHTML = '<i aria-hidden="true"></i>' + o.name;
    b.addEventListener("click", () => setOcc(o.id, true));
    occWrap.appendChild(b);
  });
  function setOcc(id, byUser) {
    occ = OCC.find((o) => o.id === id) || OCC[0];
    occWrap.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.o === occ.id)));
    const v = $("#voucher");
    v.style.setProperty("--v1", occ.v1); v.style.setProperty("--v2", occ.v2);
    $("#pat").innerHTML = occ.pat;
    // the box is a pale tint of the card colour with a darker outline, so card and box read apart
    $("#bx1").setAttribute("stop-color", mix(occ.v1, "#ffffff", 0.8)); $("#bx2").setAttribute("stop-color", mix(occ.v1, "#ffffff", 0.58));
    document.querySelectorAll(".bxr").forEach((r) => r.setAttribute("stroke", occ.v2));
    if (byUser) { play(v, [{ transform: "rotateY(0)" }, { transform: "rotateY(14deg) scale(.97)" }, { transform: "rotateY(0)" }], { duration: 520, easing: SPRING }); say(occ.name + " card"); }
  }

  // ---------- Amount: chips or a custom value, with a rolling number on the card ----------
  const other = $("#other");
  document.querySelectorAll("#amts .chip").forEach((c) => c.addEventListener("click", () => {
    document.querySelectorAll("#amts .chip").forEach((k) => k.setAttribute("aria-pressed", String(k === c)));
    if (c.dataset.a === "other") { other.classList.add("on"); if (!demoOn) other.focus(); setAmount(+other.value || amount); }
    else { other.classList.remove("on"); setAmount(+c.dataset.a); }
  }));
  other.addEventListener("input", () => { const v = Math.round(+other.value); if (v) setAmount(Math.min(50000, Math.max(0, v))); });
  let rollRaf = 0;
  function setAmount(n) {
    amount = n;
    $("#pay").textContent = "PKR " + pkr(n);
    cancelAnimationFrame(rollRaf);
    const from = shownAmt, t0 = performance.now(), el = $("#vAmt");
    if (calm()) { shownAmt = n; el.textContent = pkr(n); return; }
    const step = (now) => {
      const p = Math.min(1, (now - t0) / 520), e = 1 - Math.pow(1 - p, 3);
      shownAmt = Math.round(from + (n - from) * e);
      el.textContent = pkr(shownAmt);
      if (p < 1) rollRaf = requestAnimationFrame(step);
    };
    rollRaf = requestAnimationFrame(step);
    play(el, [{ transform: "translateY(-4px)" }, { transform: "none" }], { duration: 300 });
  }

  // ---------- Live preview of name and note ----------
  const name = $("#name"), contact = $("#contact"), note = $("#note"), err = $("#err");
  function preview() {
    $("#vFor").textContent = name.value.trim() ? "For " + name.value.trim() : "For someone special";
    $("#vMsg").textContent = note.value.trim() || "Your note shows here";
    $("#noteCount").textContent = note.value.length + "/90";
  }
  [name, contact, note].forEach((el) => el.addEventListener("input", () => { el.classList.remove("bad"); err.textContent = ""; preview(); }));

  // ---------- Card tilt that follows the pointer ----------
  const voucher = $("#voucher");
  if (matchMedia("(pointer: fine)").matches) {
    $("#scene").addEventListener("pointermove", (e) => {
      if (calm() || busy) return;
      const r = voucher.getBoundingClientRect();
      voucher.style.setProperty("--ry", ((e.clientX - r.left) / r.width - 0.5) * 14 + "deg");
      voucher.style.setProperty("--rx", -((e.clientY - r.top) / r.height - 0.5) * 12 + "deg");
    });
    $("#scene").addEventListener("pointerleave", () => { voucher.style.setProperty("--rx", "0deg"); voucher.style.setProperty("--ry", "0deg"); });
  }

  // ---------- Validate ----------
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const PHONE = /^(\+92|0092|0)3\d{2}[\s-]?\d{7}$/;
  function check() {
    const problems = [];
    if (!name.value.trim()) problems.push([name, "Add who the gift is for"]);
    const c = contact.value.trim();
    if (!EMAIL.test(c) && !PHONE.test(c.replace(/\s+/g, " "))) problems.push([contact, "Use an email or a mobile number like 0300 1234567"]);
    if (!amount || amount < 500 || amount > 50000) problems.push([other, "Pick an amount from PKR 500 to 50,000"]);
    problems.forEach(([el]) => { el.classList.add("bad"); play(el, [{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 360 }); });
    if (problems.length) { err.textContent = problems[0][1]; if (!demoOn) problems[0][0].focus(); say(problems[0][1]); }
    return !problems.length;
  }

  // ---------- Wrap and send ----------
  let busy = false, lastCode = "";
  const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const code = () => { let s = "GFT-"; for (let i = 0; i < 8; i++) { s += ALPHA[Math.floor(Math.random() * ALPHA.length)]; if (i === 3) s += "-"; } return s; };
  const fx = $("#fx");
  async function wrapAndSend() {
    if (busy) return;
    if (!check()) return;
    busy = true;
    if ($("#receipt").classList.contains("show")) { resetCard(); await wait(calm() ? 0 : 650); }
    const who = name.value.trim();
    $("#sendText").textContent = "Wrapping…";
    $("#tagText").textContent = "To " + (who.length > 9 ? who.slice(0, 8) + "…" : who);
    voucher.style.setProperty("--rx", "0deg"); voucher.style.setProperty("--ry", "0deg");
    const box = $("#box"), lid = $("#lid"), bow = $("#bow"), gtag = $("#gtag");
    const ribs = ["#ribV", "#ribH", "#ribL"].map((s) => $(s));
    // hide ribbons, bow and tag; the lid waits above, open
    ribs.forEach((r) => { const L = r.getTotalLength(); r.style.strokeDasharray = L; r.style.strokeDashoffset = L; });
    bow.style.opacity = "0"; gtag.style.opacity = "0";
    // 1. Anticipation: the card lifts and tips back; the box rises with its lid off to the side
    box.style.opacity = "1";
    play(voucher, [{ transform: "none" }, { transform: "translateY(-46px) rotateX(18deg) scale(.92)" }], { duration: 480, easing: "cubic-bezier(.3,1.3,.5,1)", fill: "forwards" });
    lid.style.transform = "translate(0,-14px) rotate(-3deg)";
    await play(box, [{ transform: "translateY(60px) scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 560, easing: SPRING });
    await play(lid, [{ transform: "translate(0,-14px) rotate(-3deg)" }, { transform: "translate(70px,-70px) rotate(24deg)" }], { duration: 380, easing: SPRING });
    lid.style.transform = "translate(70px,-70px) rotate(24deg)";
    // 2. Main: the card drops into the box, the lid lands with a squash
    await play(voucher, [{ transform: "translateY(-46px) rotateX(18deg) scale(.92)", opacity: 1 }, { transform: "translateY(10px) rotateX(70deg) scale(.5)", opacity: 1, offset: 0.7 }, { transform: "translateY(60px) rotateX(80deg) scale(.42)", opacity: 0 }], { duration: 620, easing: "cubic-bezier(.5,0,.6,1)", fill: "forwards" });
    voucher.style.visibility = "hidden";
    await play(lid, [{ transform: "translate(70px,-70px) rotate(24deg)" }, { transform: "translate(0,-26px) rotate(-4deg)", offset: 0.6 }, { transform: "translate(0,2px) rotate(0) scale(1.04,.92)", offset: 0.85 }, { transform: "none" }], { duration: 640, easing: "ease-in" });
    lid.style.transform = "";
    play(box, [{ transform: "scale(1)" }, { transform: "scale(1.05,.94)" }, { transform: "scale(1)" }], { duration: 300 });
    // 3. Progress: the ribbons draw around the box, the bow ties itself, the tag swings on
    $("#sendText").textContent = "Tying the bow…";
    for (const r of ribs) {
      if (calm()) { r.style.strokeDashoffset = 0; continue; }
      const L = r.getTotalLength();
      await r.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 300, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }).finished.catch(() => {});
      r.style.strokeDashoffset = 0;
    }
    bow.style.opacity = "1";
    await play(bow, [{ transform: "scale(0) rotate(-40deg)" }, { transform: "scale(1.3) rotate(8deg)", offset: 0.6 }, { transform: "scale(1) rotate(0)" }], { duration: 600, easing: "ease-out" });
    gtag.style.opacity = "1";
    play(gtag, [{ transform: "rotate(-50deg)", opacity: 0 }, { transform: "rotate(18deg)", opacity: 1, offset: 0.4 }, { transform: "rotate(-8deg)", offset: 0.7 }, { transform: "rotate(0)" }], { duration: 1000, easing: "ease-out" });
    $("#sendText").textContent = "Sending…";
    // two happy hops
    for (let k = 0; k < 2; k++) await play(box, [{ transform: "none" }, { transform: "translateY(4px) scale(1.06,.92)", offset: 0.2 }, { transform: "translateY(-26px) scale(.95,1.06)", offset: 0.55 }, { transform: "translateY(2px) scale(1.04,.95)", offset: 0.85 }, { transform: "none" }], { duration: 480 });
    // 4. Finish: it launches with a sparkle trail and confetti bursts
    const br = box.getBoundingClientRect();
    confetti(br.left + br.width / 2, br.top + br.height / 2);
    await play(box, [{ transform: "none", opacity: 1 }, { transform: "translateY(10px) scale(1.08,.9)", offset: 0.15 }, { transform: "translateY(-420px) rotate(-14deg) scale(.6)", opacity: 0 }], { duration: 820, easing: "cubic-bezier(.5,0,.75,0)" });
    box.style.opacity = "0";
    lastCode = code();
    $("#rCode").textContent = lastCode;
    $("#rInfo").textContent = "PKR " + pkr(amount) + " is on its way to " + who + " at " + contact.value.trim() + ". It never expires.";
    const rc = $("#receipt");
    rc.classList.add("show"); rc.setAttribute("aria-hidden", "false");
    play(rc.querySelector(".badge"), [{ transform: "scale(0) rotate(-60deg)" }, { transform: "scale(1) rotate(0)" }], { duration: 620, easing: SPRING });
    $("#sendText").textContent = "Wrap and send";
    say("Gift sent. PKR " + pkr(amount) + " is on its way to " + who + ". Code " + lastCode + ".");
    busy = false;
    if (demoOn) queueDemo(2600, true);
  }
  $("#form").addEventListener("submit", (e) => { e.preventDefault(); wrapAndSend(); });

  function confetti(x, y) {
    if (calm()) return;
    const cols = ["#e7b549", "#c81d4e", "#ff9fb7", "#1d9b78", "#ffffff", occ.v1];
    for (let i = 0; i < 36; i++) {
      const c = document.createElement("i");
      c.className = "conf"; c.style.background = cols[i % cols.length];
      fx.appendChild(c);
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 120 + Math.random() * 160;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
      c.animate([
        { transform: "translate(" + x + "px," + y + "px) rotate(0) scale(.6)", opacity: 1 },
        { transform: "translate(" + (x + dx) + "px," + (y + dy) + "px) rotate(" + (Math.random() * 720) + "deg) scale(1)", opacity: 1, offset: 0.5 },
        { transform: "translate(" + (x + dx * 1.3) + "px," + (y + dy + 220) + "px) rotate(" + (Math.random() * 1080) + "deg) scale(.8)", opacity: 0 }
      ], { duration: 1500 + Math.random() * 700, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => c.remove();
    }
  }

  // ---------- Receipt actions ----------
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }
  $("#copyCode").addEventListener("click", async (e) => {
    const btn = e.currentTarget; // keep it before the await
    const ok = await writeClipboard(lastCode);
    btn.textContent = ok ? "Copied" : "Select it";
    play(btn, [{ transform: "scale(.9)" }, { transform: "scale(1.06)" }, { transform: "none" }], { duration: 380 });
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = "Copy code"; }, 1600);
    say(ok ? "Code copied" : "Copy was blocked, select the code instead");
  });
  function resetCard() {
    const rc = $("#receipt");
    rc.classList.remove("show"); rc.setAttribute("aria-hidden", "true");
    voucher.getAnimations().forEach((a) => a.cancel());
    voucher.style.visibility = "";
    ["#ribV", "#ribH", "#ribL"].forEach((s) => $(s).getAnimations().forEach((a) => a.cancel()));
    play(voucher, [{ transform: "translateY(40px) scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 640, easing: SPRING });
  }
  $("#again").addEventListener("click", () => { resetCard(); name.value = ""; contact.value = ""; note.value = ""; preview(); if (!demoOn) name.focus(); say("Ready for another gift"); });

  // ---------- Auto-demo: fill the form like a person would and send; stops on real input ----------
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms, afterSend) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(() => runDemo(afterSend), ms); }
  async function type(el, t) {
    el.value = "";
    for (const ch of t) { if (!demoOn) return false; el.value += ch; el.dispatchEvent(new Event("input")); await wait(34); }
    return true;
  }
  const PLANS = [
    { o: "eid", a: "2500", n: "Zainab", c: "zainab@mail.example", m: "Happy Eid! Treat yourself to something lovely." },
    { o: "bday", a: "5000", n: "Bilal", c: "0300 1234567", m: "Happy birthday, champ!" },
    { o: "wedding", a: "other", v: 7500, n: "Hina and Saad", c: "hina@mail.example", m: "For your new home, with love." }
  ];
  async function runDemo(afterSend) {
    if (!demoOn || busy) return;
    if (afterSend) { resetCard(); await wait(900); if (!demoOn) return; }
    const p = PLANS[round++ % PLANS.length];
    setOcc(p.o, false);
    document.querySelector('#amts .chip[data-a="' + p.a + '"]').click();
    if (p.v) { other.value = String(p.v); setAmount(p.v); }
    await wait(300);
    if (!(await type(name, p.n)) || !(await type(contact, p.c)) || !(await type(note, p.m))) return;
    await wait(500);
    if (demoOn) wrapAndSend();
  }

  // ---------- Start ----------
  setOcc("eid", false);
  document.querySelector('#amts .chip[data-a="2500"]').setAttribute("aria-pressed", "true");
  ["1000", "5000", "other"].forEach((a) => document.querySelector('#amts .chip[data-a="' + a + '"]').setAttribute("aria-pressed", "false"));
  preview();
  queueDemo(700);
</script>
</body>
</html>
