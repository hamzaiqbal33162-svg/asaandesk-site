<script>/* Pick the theme before first paint: ?theme= wins, then the saved choice, then the default */(function(k,d){var t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(k+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})('chalkline','');</script>
<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Chalkline look: bold notebook blocks with hard shadows; dark mode is a chalkboard ================= */
:root{--font:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;--hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Neue",cursive;--rb:10px;--ri:10px;--rm:16px;--rp:12px;
--bg:#f6efe0;--surface:#fffdf6;--surface2:#f9f3e6;--ink:#1e1a15;--line:#1e1a15;--soft:#e6dcc7;--text:#1e1a15;--muted:#6a6152;--hover:rgba(30,26,21,.06);--accent:#ff6a45;--on-accent:#1e1a15;--ok:#1f9e7a;--warn:#d9940a;--danger:#e0413a;--info:#4f6ef7;--field:#fff;
--c1:#ff6a45;--c2:#ffc63a;--c3:#2bb39c;--c4:#4f7cff;--c5:#b58aff;--c6:#ff8db0;--hard:4px 4px 0 var(--ink);--hard2:6px 6px 0 var(--ink);--board:#203a32;--chalk:#f4f1e8}
[data-theme="dark"]{--bg:#141c18;--surface:#1c2722;--surface2:#22302a;--ink:#05090a;--line:rgba(236,242,232,.55);--soft:rgba(236,242,232,.14);--text:#eef3ea;--muted:#a7b5aa;--hover:rgba(236,242,232,.07);--accent:#ff8a6b;--on-accent:#141c18;--ok:#58d6ae;--warn:#ffd25a;--danger:#ff7a70;--info:#8aa2ff;--field:#18221e;
--c1:#ff8a6b;--c2:#ffd25a;--c3:#58d6ae;--c4:#8aa8ff;--c5:#cba8ff;--c6:#ffa3c3;--hard:4px 4px 0 rgba(0,0,0,.55);--hard2:6px 6px 0 rgba(0,0,0,.55);--board:#0f1c17;--toast-bg:#2c3b34}
body{background-image:linear-gradient(var(--soft) 1px,transparent 1px);background-size:100% 30px}
[data-theme="dark"] body{background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.04),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.03),transparent 40%)}
h1,h2,.display{font-weight:850;letter-spacing:-.02em}
.btn{border:2px solid var(--line);box-shadow:3px 3px 0 var(--ink);font-weight:750;transition:transform .12s,box-shadow .12s,background .2s}
[data-theme="dark"] .btn{box-shadow:3px 3px 0 rgba(0,0,0,.6)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);border-color:var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.primary{color:#1e1a15}
.chip{border:2px solid var(--line);color:var(--text)}
.chip[aria-pressed="true"]{color:#1e1a15}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--hard);min-width:0;transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}
.card:hover{transform:translate(-2px,-2px);box-shadow:var(--hard2)}
.tbl th{color:var(--text);border-bottom:2px solid var(--line)}
.search{border:2px solid var(--line)}
.fld input,.fld select,.fld textarea,.inp{border:2px solid var(--line)}
.modal,.drawer,.pop{border:2px solid var(--line);box-shadow:var(--hard2)}
.segc{border:2px solid var(--line);background:var(--surface2)}
.segc button[aria-pressed="true"]{background:var(--c2);color:#1e1a15;box-shadow:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* Notebook sidebar with spiral binding and divider tabs */
.side{position:sticky;top:0;height:100vh;padding:18px 0 18px 30px;display:flex;flex-direction:column;gap:14px;overflow:auto;background:var(--surface);border-right:2px solid var(--line);z-index:40}
.side::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 7px,var(--bg) 4px,var(--line) 4.5px 5.5px,transparent 6px) 0 0/14px 26px repeat-y}
.brand{display:flex;align-items:center;gap:10px;padding-right:14px}
.brand b{font-size:21px;font-weight:900;letter-spacing:-.03em}
.brand small{display:block;font-family:var(--hand);font-size:12px;color:var(--muted);font-weight:400}
.nav{position:relative;display:grid;gap:6px;padding-right:0}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:9px 12px;margin-right:14px;border-radius:12px 0 0 12px;color:var(--text);text-decoration:none;font-weight:750;font-size:13.5px;transition:margin .3s cubic-bezier(.3,1.4,.5,1),color .2s}
.nav a .tabdot{width:12px;height:12px;border-radius:4px;border:2px solid var(--line);background:var(--tc);flex:none}
.nav a:hover{margin-right:8px}
.nav a[aria-current="page"]{margin-right:-2px;color:#1e1a15}
.nav-marker{position:absolute;left:0;right:-2px;top:0;border-radius:12px 0 0 12px;background:var(--mc,var(--c2));border:2px solid var(--line);border-right:0;transition:transform .45s cubic-bezier(.3,1.35,.5,1),height .3s,background .3s;pointer-events:none}
.side-note{margin:auto 14px 0 0;padding:12px;border:2px dashed var(--line);border-radius:12px;font-family:var(--hand);font-size:13px;transform:rotate(-1.5deg);background:var(--c2);color:#1e1a15}
.main-wrap{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .sp{flex:1}
.bellbox{display:flex;align-items:center;gap:8px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;font-weight:800;font-size:13px;background:var(--surface);font-variant-numeric:tabular-nums}
.bellbox i{width:9px;height:9px;border-radius:50%;background:var(--c1);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.menu-btn{display:none}
main{padding:20px 24px 44px;outline:none}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:30px;line-height:1.05}
.ph p{color:var(--muted);margin-top:4px;font-weight:600}
.ph-a{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g{display:grid;gap:18px;margin-bottom:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:16px}
.ch p{font-size:12px;color:var(--muted);font-weight:600}
/* Block KPIs */
.blk{background:var(--bc);color:#1e1a15;display:grid;gap:4px;position:relative;overflow:hidden}
.blk .bi{position:absolute;right:-8px;bottom:-14px;opacity:.18}
.blk .bi .ic{width:86px;height:86px;stroke-width:1.6}
.blk small{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.blk b{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1}
.blk span{font-size:12.5px;font-weight:650}
/* Chalkboard (signature) */
.board{background:var(--board);color:var(--chalk);border-color:var(--line);position:relative;overflow:hidden;padding:18px 20px 20px;min-height:236px}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.07),transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.05),transparent 55%);pointer-events:none}
.board::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:wipe 1.6s .1s ease-out both;pointer-events:none}
@keyframes wipe{to{left:120%}}
.board .ledge{position:absolute;left:0;right:0;bottom:0;height:10px;background:#8a6a45;border-top:2px solid rgba(0,0,0,.35)}
.board .ledge::before{content:"";position:absolute;left:22%;top:-7px;width:34px;height:7px;border-radius:3px;background:#f4f1e8}
.board .ledge::after{content:"";position:absolute;left:30%;top:-6px;width:22px;height:6px;border-radius:3px;background:#ffd25a}
.chalk{width:100%;height:auto;display:block;overflow:visible}
.chalk text{font-family:var(--hand);fill:transparent;stroke:var(--chalk);stroke-width:.8;stroke-dasharray:900;stroke-dashoffset:900;animation:write 2.6s cubic-bezier(.5,0,.3,1) forwards,chalkfill .8s 1.8s forwards}
.chalk .t2{animation-delay:.6s,2.4s}.chalk .t3{animation-delay:1.1s,2.8s;stroke:#ffd25a}
.chalk .ul{fill:none;stroke:#ffd25a;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s 2.2s forwards}
@keyframes write{to{stroke-dashoffset:0}}
@keyframes chalkfill{to{fill:var(--chalk);stroke-width:.3}}
.chalk .t3{--chalk:#ffd25a}
.board-foot{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-weight:700}
.pbar{flex:1;min-width:160px;height:12px;border:2px solid var(--chalk);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#ffd25a 0 6px,#ffc12e 6px 12px);width:var(--p);transition:width 1s linear}
.board .btn{background:transparent;color:var(--chalk);border-color:var(--chalk);box-shadow:none}
.board .btn:hover{background:rgba(255,255,255,.08)}
/* Timetable */
.tt{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.per{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface2);transition:transform .2s}
.per .t{font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
.per .t small{display:block;color:var(--muted);font-weight:600}
.per b{display:block;font-size:13.5px}.per small{color:var(--muted);font-size:12px}
.per.free{border-style:dashed;background:transparent}
.per.now{background:var(--c2);color:#1e1a15;transform:translateX(6px);box-shadow:var(--hard)}
.per.now small{color:#3d342a}
.per.past{opacity:.55}
.sw{width:14px;height:14px;border-radius:5px;border:2px solid var(--line);background:var(--cc);display:inline-block;vertical-align:-2px;margin-right:6px}
/* To-do */
.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:2px dashed var(--soft)}
.todo li.done span{text-decoration:line-through;color:var(--muted)}
.todo span{flex:1;font-weight:600;font-size:13.5px}
.box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center;padding:0;color:transparent;flex:none;transition:background .2s}
.box[aria-pressed="true"]{background:var(--c3);color:#1e1a15}
.box .ic{width:14px;height:14px;stroke-width:3}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
/* Class cards */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cc-badge{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--cc);color:#1e1a15;font-weight:900;font-size:17px;flex:none;box-shadow:3px 3px 0 var(--ink)}
.cc-top b{display:block;font-size:16px}.cc-top small{color:var(--muted);font-weight:600}
.cc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;font-weight:650;padding:6px 0;border-top:2px dashed var(--soft)}
/* Kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;overflow-x:auto;padding:4px 6px 10px 2px}
.kcol{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:320px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--kc) 10%,transparent)}
.kcol h3{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}
.kcol h3 span:last-child{display:grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--kc);border:2px solid var(--line);color:#1e1a15}
.kcard{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink);display:grid;gap:6px;font-size:12.5px;transition:transform .18s,box-shadow .18s;animation:rise .45s both}
.kcard:hover{transform:translate(-1px,-2px) rotate(-.5deg);box-shadow:5px 5px 0 var(--ink)}
.kcard b{font-size:13.5px}
.kcard .kr{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:650}
.kcard .mv{border:2px solid var(--line);background:var(--surface2);border-radius:8px;width:28px;height:26px;display:grid;place-items:center;padding:0}
.subbar{height:8px;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.subbar i{display:block;height:100%;width:var(--w);background:var(--c3);animation:hbw .9s both}
/* Gradebook */
.gb-wrap{overflow:auto;max-height:560px;border:2px solid var(--line);border-radius:12px}
.gb{border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px;width:100%}
.gb th,.gb td{padding:6px 8px;border-bottom:1.5px solid var(--soft);text-align:center;white-space:nowrap}
.gb th{position:sticky;top:0;background:var(--surface2);z-index:2;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.gb td:first-child,.gb th:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1}
.gb th:first-child{z-index:3;background:var(--surface2)}
.gb input{width:58px;height:30px;text-align:center;border:2px solid var(--soft);border-radius:8px;background:var(--field);color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.gb input:focus{outline:none;border-color:var(--accent)}
.gb input.lo{background:color-mix(in srgb,var(--danger) 14%,var(--field))}
.gb input.hi{background:color-mix(in srgb,var(--ok) 14%,var(--field))}
.gb tfoot td{font-weight:850;background:var(--surface2);position:sticky;bottom:0}
.letter{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:7px;border:2px solid var(--line);font-weight:900;background:var(--lc)}
/* Attendance */
.roll{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.roll li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.roll li .grow{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pla{display:flex;border:2px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.pla button{border:0;background:transparent;width:30px;height:28px;font-weight:900;font-size:12px;color:var(--muted);transition:background .2s}
.pla button+button{border-left:2px solid var(--line)}
.pla button[aria-pressed="true"][data-v="P"]{background:var(--c3);color:#1e1a15}
.pla button[aria-pressed="true"][data-v="L"]{background:var(--c2);color:#1e1a15}
.pla button[aria-pressed="true"][data-v="A"]{background:var(--c1);color:#1e1a15}
/* Planner */
.plan-wrap{overflow-x:auto}
.plan{display:grid;grid-template-columns:70px repeat(5,minmax(130px,1fr));gap:8px;min-width:760px}
.plan .ph2{font-weight:850;text-align:center;font-size:13px;padding:4px}
.plan .pt{font-size:11.5px;font-weight:800;color:var(--muted);align-self:center}
.slot{min-height:64px;border:2px dashed var(--soft);border-radius:12px;padding:4px;transition:background .2s,border-color .2s}
.slot.brk{border:0;min-height:24px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.lp{background:color-mix(in srgb,var(--cc) 35%,var(--surface));border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;box-shadow:2px 2px 0 var(--ink);text-align:left;width:100%;color:var(--text);display:block}
.lp b{display:block;font-size:12px}.lp span{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ideas{display:flex;flex-wrap:wrap;gap:10px;min-height:70px;padding:8px;border:2px dashed var(--line);border-radius:14px}
.ideas .lp{width:180px}
/* Lists, drawers */
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:2px dashed var(--soft)}
.li .grow{flex:1;min-width:0}.li b{display:block;font-size:13px}.li small{display:block;color:var(--muted);font-size:11.5px}
.pf{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf b{font-size:16px;display:block}.pf small{color:var(--muted)}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.dlist dt{color:var(--muted)}.dlist dd{margin:0;font-weight:700}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--soft)}
.set-row:last-child{border-bottom:0}.set-row b{display:block}.set-row small{color:var(--muted)}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-104%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}body.nav-open .side{transform:none;box-shadow:var(--hard2)}.scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(20,16,10,.4);opacity:0;pointer-events:none;transition:opacity .3s}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top,main{padding-left:14px;padding-right:14px}}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:24px}.bellbox span,.top .btn span{display:none}.top{gap:6px}.roll{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="4" width="34" height="26" rx="5" fill="#203a32" stroke="currentColor" stroke-width="2.5"/><path d="M9 21c3-6 6-6 8 0s5 6 8-2" fill="none" stroke="#f4f1e8" stroke-width="2.4" stroke-linecap="round"/><rect x="24" y="31" width="12" height="5" rx="2" fill="#ffc63a" stroke="currentColor" stroke-width="2"/></svg><div><b>Chalkline</b><small>a teacher's whole day</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker"></span></nav>
    <div class="side-note" id="sideNote">Remember: science fair forms due Friday!</div>
  </aside>
  <div class="scrim" data-scrim></div>
  <div class="main-wrap">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="side"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="bellbox" aria-live="off"><i></i><b id="bellTxt">—</b><span id="bellSub"></span></div>
      <span class="sp"></span>
      <button type="button" class="btn sm" data-cmdk aria-label="Search (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg><span>Search</span></button>
      <button type="button" class="icon-btn" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    save(); refresh(); } });
  el.addEventListener('click', e => { const b = e.target.closest('.lp'); if (!b) return; const src = b.dataset.src, x = getSrc(src);
    formModal({ title: 'Edit lesson', submit: 'Save', values: { ...x, where: src }, fields: [{ k: 'cls', label: 'Class', type: 'select', opts: D.classes.map(c => ({ v: c.id, l: cName(c) })) }, { k: 'topic', label: 'Topic', req: true }, { k: 'where', label: 'Move to…', type: 'select', opts: [{ v: src, l: 'Keep where it is' }, { v: 'ideas', l: 'Lesson ideas' }, ...WD.flatMap(d => TEACH.map((t, k) => ({ v: d + '|' + k, l: `${DOW[d]} P${k + 1}${D.plan[d][k] ? ' (swap)' : ''}` })))].filter((o, i, a) => a.findIndex(y => y.v === o.v) === i) }],
      onDelete: () => { put(src, null); save(); toast('Lesson removed', 'warn'); refresh(); },
      onSubmit(v) { x.cls = v.cls; x.topic = v.topic; if (v.where !== src) { if (v.where === 'ideas') { if (!src.startsWith('idea')) { put(src, null); D.ideas.push({ id: 'i' + uid(), cls: x.cls, topic: x.topic }); } } else { const [d, k] = v.where.split('|'), cur = D.plan[d][+k]; if (src.startsWith('idea')) { if (cur) D.ideas.push({ id: 'i' + uid(), cls: cur.cls, topic: cur.topic }); put(src, null); D.plan[d][+k] = { cls: x.cls, topic: x.topic }; } else { put(src, cur || null); D.plan[d][+k] = x; } } } save(); toast('Lesson saved'); refresh(); } }); });
}

/* ---------- Page: Settings ---------- */
function pSettings(el) {
  el.innerHTML = `<div class="ph" data-rise><div><h1>Settings</h1><p>Your details, the sticky note and demo data</p></div></div><div class="g g2">
  <section class="card"><div class="ch"><h2>Profile</h2></div><form class="frm" id="mf" novalidate>${fieldHTML({ k: 'name', label: 'Your name', req: true }, D.me.name)}${fieldHTML({ k: 'school', label: 'School' }, D.me.school)}${fieldHTML({ k: 'email', label: 'Email', type: 'email' }, D.me.email)}<div><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card"><div class="ch"><h2>Sticky note</h2><p>Shown at the bottom of the sidebar</p></div><textarea class="inp" id="stick" rows="4" maxlength="120">${esc(D.notes)}</textarea><div style="margin-top:10px"><button type="button" class="btn" data-stick>Update note</button></div></section></div>
  <section class="card"><div class="set-row"><div><b>Bell times</b><small>${PERIODS.filter(p => !p[2]).length} periods, 8:00 AM to 1:40 PM, break at 10:00 AM</small></div><span class="badge">Fixed by school</span></div><div class="set-row"><div><b>Theme</b><small>Notebook paper or chalkboard. ?theme=dark in the address also works.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample classes, scores and registers</small></div><button type="button" class="btn danger" data-a="reset">${ic('refresh')}Reset</button></div></section>`;
  syncThemeBtns();
  $('#mf', el).onsubmit = e => { e.preventDefault(); const f = e.target, n = f.elements.name, em = f.elements.email; let ok = true; [n, em].forEach(x => { x.removeAttribute('aria-invalid'); $('#' + x.id + '-e').textContent = ''; }); if (!n.value.trim()) { n.setAttribute('aria-invalid', 'true'); $('#' + n.id + '-e').textContent = 'Name is required'; ok = false; } if (em.value && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value)) { em.setAttribute('aria-invalid', 'true'); $('#' + em.id + '-e').textContent = 'Enter a valid email'; ok = false; } if (!ok) return; D.me = { name: n.value.trim(), school: f.elements.school.value.trim(), email: em.value.trim() }; save(); toast('Profile saved'); };
  $('[data-stick]', el).onclick = () => { D.notes = $('#stick', el).value.trim() || 'Have a lovely day!'; $('#sideNote').textContent = D.notes; save(); toast('Sticky note updated'); };
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'today', label: 'Today', icon: 'home', c: 'var(--c2)', render: pToday }, { id: 'classes', label: 'Classes', icon: 'grid', c: 'var(--c4)', render: pClasses }, { id: 'students', label: 'Students', icon: 'users', c: 'var(--c3)', render: pStudents },
  { id: 'assignments', label: 'Assignments', icon: 'clip', c: 'var(--c1)', render: pAssign }, { id: 'gradebook', label: 'Gradebook', icon: 'book', c: 'var(--c5)', render: pGradebook }, { id: 'attendance', label: 'Attendance', icon: 'check', c: 'var(--c3)', render: pAttendance },
  { id: 'planner', label: 'Planner', icon: 'cal', c: 'var(--c6)', render: pPlanner }, { id: 'settings', label: 'Settings', icon: 'gear', c: 'var(--c2)', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}" style="--tc:${r.c}"><span class="tabdot" aria-hidden="true"></span>${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
document.addEventListener('click', e => {
  const t = e.target;
  const td = t.closest('[data-todo]'); if (td) { const x = D.todos.find(y => y.id === td.dataset.todo); x.done = !x.done; save(); toast(x.done ? 'Ticked off. Nice!' : 'Back on the list'); refresh(); return; }
  const dt = t.closest('[data-deltodo]'); if (dt) { D.todos = D.todos.filter(y => y.id !== dt.dataset.deltodo); save(); toast('To-do removed', 'warn'); refresh(); return; }
  const cl = t.closest('[data-class]'); if (cl) { classDrawer(cls(cl.dataset.class)); return; }
  const tk = t.closest('[data-take]'); if (tk) { attClass = tk.dataset.take; attDate = iso(TODAY); ROUTER.go('attendance'); return; }
  const gr = t.closest('[data-grade]'); if (gr) { moveAssign(D.assigns.find(a => a.id === gr.dataset.grade), 'Graded'); return; }
  const mv = t.closest('[data-mvas]'); if (mv) { const a = D.assigns.find(x => x.id === mv.dataset.mvas); menu(mv, STAGES.map(([s]) => ({ label: s, disabled: s === a.stage })).concat([{ label: 'Edit…', act: 'edit', icon: 'edit' }]), o => o.act === 'edit' ? assignDrawer(a) : moveAssign(a, o.label), 'Move to'); return; }
  const kc = t.closest('.kcard'); if (kc && !t.closest('button')) { assignDrawer(D.assigns.find(a => a.id === kc.dataset.as)); return; }
  const dc = t.closest('[data-delclass]'); if (dc) { const c = cls(dc.dataset.delclass); confirmBox(`Delete ${cName(c)} and its ${roster(c.id).length} students?`, () => { D.classes = D.classes.filter(x => x !== c); D.students = D.students.filter(s => s.cls !== c.id); D.assigns = D.assigns.filter(a => a.cls !== c.id); WD.forEach(d => { D.tt[d] = D.tt[d].map(x => x === c.id ? null : x); D.plan[d] = D.plan[d].map(x => x && x.cls === c.id ? null : x); }); D.ideas = D.ideas.filter(x => x.cls !== c.id); save(); toast(`${c.name} deleted`, 'warn'); refresh(); }); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'assign') formModal({ title: 'New assignment', submit: 'Create', side: true, values: { cls: (D.classes[0] || {}).id, stage: 'Assigned', due: iso(addDays(TODAY, 7)), pts: 20 }, fields: assignFields(), onSubmit(v) { D.assigns.unshift({ id: 'h' + uid(), ...v, subs: 0, size: roster(v.cls).length }); save(); toast(`"${v.title}" set for ${cls(v.cls).name}`); refresh(); } });
  else if (a === 'todo') { const i = $('#todoIn'); if (i) i.focus(); else formModal({ title: 'Add a to-do', submit: 'Add', fields: [{ k: 't', label: 'What needs doing?', req: true }], onSubmit(v) { D.todos.unshift({ id: 't' + uid(), t: v.t, done: false }); save(); toast('Added to your list'); refresh(); } }); }
  else if (a === 'student') formModal({ title: 'Add a student', submit: 'Add student', side: true, values: { cls: (D.classes[0] || {}).id, g: 'F' }, fields: [{ k: 'name', label: 'Full name', req: true }, { k: 'cls', label: 'Class', type: 'select', half: true, opts: D.classes.map(c => ({ v: c.id, l: cName(c) })) }, { k: 'g', label: 'Sex', type: 'select', half: true, opts: [{ v: 'F', l: 'Girl' }, { v: 'M', l: 'Boy' }] }, { k: 'parent', label: 'Parent name', req: true, half: true }, { k: 'phone', label: 'Parent phone', type: 'tel', req: true, half: true }], onSubmit(v) { D.students.push({ id: 's' + uid(), ...v, ab: .7, att: {}, scores: ASSESS.map(() => null), note: '' }); save(); toast(`${v.name} added to ${cls(v.cls).name}`); refresh(); } });
  else if (a === 'class') formModal({ title: 'Add a class', submit: 'Add class', values: { subj: 'Mathematics' }, fields: [{ k: 'name', label: 'Class name', req: true, half: true, ph: 'e.g. 8-B', check: v => D.classes.some(c => c.name.toLowerCase() === v.toLowerCase()) ? 'You already have that class' : '' }, { k: 'subj', label: 'Subject', type: 'select', half: true, opts: ['Mathematics', 'Science', 'English', 'Computing'] }, { k: 'room', label: 'Room', req: true }], onSubmit(v) { D.classes.push({ id: 'c' + uid(), ...v, color: `var(--c${(D.classes.length % 6) + 1})` }); save(); toast(`${v.name} ${v.subj} added`); refresh(); } });
  else if (a === 'idea') formModal({ title: 'New lesson idea', submit: 'Add idea', values: { cls: (D.classes[0] || {}).id }, fields: [{ k: 'cls', label: 'Class', type: 'select', opts: D.classes.map(c => ({ v: c.id, l: cName(c) })) }, { k: 'topic', label: 'Idea', req: true, ph: 'e.g. Paper plane experiment' }], onSubmit(v) { D.ideas.push({ id: 'i' + uid(), ...v }); save(); toast('Idea saved. Drag it into the week.'); refresh(); } });
  else if (a === 'export') toast(`Exported ${roster(gbClass).length} rows for ${cls(gbClass).name}`);
  else if (a === 'reset') confirmBox('Put back the sample classes and scores? Your changes will be lost.', () => { store.del(KEY); D = makeData(); save(); $('#sideNote').textContent = D.notes; toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
/* the sliding tab takes the colour of the active page */
const recolour = r => { const m = $('.nav-marker'); if (m) m.style.setProperty('--mc', r.c); };
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), { label: 'New assignment', hint: 'Action', icon: 'plus', run: () => $('[data-a="assign"]') ? $('[data-a="assign"]').click() : ROUTER.go('assignments') }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }, ...D.students.map(s => ({ label: s.name, hint: 'Student · ' + cls(s.cls).name, icon: 'user', run: () => studentDrawer(s) })), ...D.classes.map(c => ({ label: cName(c), hint: 'Class', icon: 'grid', run: () => classDrawer(c) }))];

/* Start */
initTheme('chalkline', '');
$('#sideNote').textContent = D.notes;
const late = D.assigns.filter(a => a.stage === 'Assigned' && a.due < iso(TODAY)); if (late.length) addNote(`${late.length} assignments are past their due date`, 'warn', new Date(Date.now() - 5e6));
addNote(`${D.assigns.filter(a => a.stage === 'Submitted').length} piles of work are waiting to be marked`, 'info', new Date(Date.now() - 2e7));
addNote('Staff meeting moved to Thursday, 2:00 PM', 'info', new Date(Date.now() - 9e7));
updClock(); every(1000, updClock, false); save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'today', title: 'Chalkline', onChange: recolour });
</script>
</body>
</html>
