<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: linen desk, black enamel and a red ribbon (light), oxblood night (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --type: "Courier New", Courier, "Nimbus Mono PS", "Liberation Mono", ui-monospace, monospace;
    --bg: #e7ded0;
    --bg2: #f4eee4;
    --card: #fbf8f2;
    --ink: #221c19;
    --muted: #7c7068;
    --line: #e3d9cb;
    --paper: #fffdf6;
    --paperInk: #2a2320;
    --body: #1f1d1c;
    --body2: #3a3633;
    --chrome: #cfd3d6;
    --red: #c8322b;
    --amber: #d9861a;
    --green: #2d8a5b;
    --shadow: rgba(60, 40, 20, .28);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #130a0a;
    --bg2: #1f1212;
    --card: #1e1414;
    --ink: #f3e9e3;
    --muted: #b09c93;
    --line: #362424;
    --paper: #f1e8d6;
    --paperInk: #231c18;
    --body: #0b0909;
    --body2: #2b2523;
    --chrome: #8e9398;
    --red: #ff5a4e;
    --amber: #ffad45;
    --green: #4fd08f;
    --shadow: rgba(0, 0, 0, .7);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 18px 14px;
    overflow: hidden;
    background:
      repeating-linear-gradient(0deg, transparent 0 3px, color-mix(in srgb, var(--ink) 2.5%, transparent) 3px 4px),
      repeating-linear-gradient(90deg, transparent 0 3px, color-mix(in srgb, var(--ink) 2%, transparent) 3px 4px),
      radial-gradient(80% 70% at 50% 40%, var(--bg2), var(--bg));
  }
  .card {
    position: relative;
    width: min(100%, 420px);
    padding: 16px 16px 18px;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -48px var(--shadow), 0 10px 24px -16px var(--shadow);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.97); } }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .kicker { margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  h1 { margin: 0; font-size: clamp(17px, 4.8vw, 19.5px); letter-spacing: -.015em; }
  .to { padding: 6px 10px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; }

  /* ---------- The machine ---------- */
  .machine { position: relative; margin-top: 12px; overflow: hidden; border-radius: 20px; background: linear-gradient(180deg, var(--bg2), var(--card) 40%); padding-top: 6px; }
  .paperwrap { position: relative; margin: 0 22px; transition: transform .7s cubic-bezier(.5, 0, .3, 1); }
  .paperwrap.away { transform: translateY(-130%); }
  .paperwrap.feed { transform: translateY(110%); transition: none; }
  .paper {
    position: relative; border-radius: 4px 4px 0 0; background: var(--paper);
    box-shadow: 0 -2px 10px -4px var(--shadow), inset 0 0 0 1px rgba(0, 0, 0, .05);
    background-image: linear-gradient(90deg, transparent 0 calc(100% - 2px), color-mix(in srgb, var(--red) 0%, transparent) 0);
    transition: box-shadow .3s;
  }
  .paper.over { box-shadow: 0 -2px 10px -4px var(--shadow), inset -4px 0 0 var(--red); }
  .hl, .mirror, textarea {
    margin: 0; padding: 12px 14px 10px; border: 0; width: 100%; font: 700 15px/22px var(--type); letter-spacing: 0;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
  }
  .hl { position: absolute; inset: 0 0 auto 0; height: 154px; overflow: hidden; color: var(--paperInk); pointer-events: none; text-shadow: 0 0 .6px rgba(0, 0, 0, .55); }
  .hl mark { background: color-mix(in srgb, var(--red) 22%, transparent); color: var(--red); border-radius: 2px; text-decoration: line-through 1.5px; }
  .hl .uni { background: color-mix(in srgb, var(--amber) 35%, transparent); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px var(--amber); }
  textarea { position: relative; display: block; height: 154px; resize: none; outline: none; background: transparent; color: transparent; caret-color: var(--red); overflow-y: auto; scrollbar-width: none; }
  textarea::-webkit-scrollbar { display: none; }
  textarea::placeholder { color: #9b8f84; font-weight: 400; }
  textarea::selection { background: rgba(200, 50, 43, .22); color: transparent; }
  .paper:focus-within { box-shadow: 0 -2px 10px -4px var(--shadow), 0 0 0 3px color-mix(in srgb, var(--red) 40%, transparent); }

  /* margin scale with the carriage pointer and the bell mark */
  .scale { position: relative; height: 26px; margin: 0 10px; border-radius: 6px; background: linear-gradient(180deg, var(--chrome), color-mix(in srgb, var(--chrome) 70%, #000)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
  .scale .ticks { position: absolute; left: 14px; right: 14px; top: 3px; height: 9px; background: repeating-linear-gradient(90deg, #2a2522 0 1px, transparent 1px calc(100% / 32)); opacity: .7; }
  .scale .nums { position: absolute; left: 14px; right: 14px; bottom: 1px; display: flex; justify-content: space-between; font: 700 8.5px var(--mono, ui-monospace, monospace); color: #2a2522; }
  .scale .warnmark { position: absolute; top: 2px; width: 2px; height: 22px; background: var(--amber); }
  .scale .pointer { position: absolute; top: -5px; left: 14px; width: 14px; height: 14px; margin-left: -7px; transition: left .25s cubic-bezier(.34, 1.56, .64, 1); }
  .scale .pointer::before { content: ""; position: absolute; left: 0; top: 0; border: 7px solid transparent; border-top: 9px solid var(--red); }
  .scale .zone { position: absolute; top: 0; bottom: 0; right: 14px; width: 12.5%; background: color-mix(in srgb, var(--amber) 28%, transparent); }

  .roller { position: relative; height: 22px; margin: 0 2px; border-radius: 11px; background: repeating-linear-gradient(90deg, #111 0 3px, #2b2b2b 3px 6px); box-shadow: inset 0 4px 6px rgba(255, 255, 255, .12), inset 0 -5px 7px rgba(0, 0, 0, .6); }
  .roller.spin { animation: spin .25s linear infinite; }
  @keyframes spin { to { background-position: 12px 0; } }
  .roller::before, .roller::after { content: ""; position: absolute; top: -3px; width: 18px; height: 28px; border-radius: 8px; background: linear-gradient(180deg, var(--chrome), #555); }
  .roller::before { left: -2px; }
  .roller::after { right: -2px; }

  .body { position: relative; padding: 10px 12px 12px; border-radius: 0 0 20px 20px; background: linear-gradient(180deg, var(--body2), var(--body)); }
  .keys { display: grid; gap: 5px; margin-right: 44px; }
  .keys div { display: flex; justify-content: center; gap: 4px; }
  .keys span {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #d9d4cc 60%, #a49e95);
    color: #1f1d1c; font: 800 10px var(--ff); box-shadow: 0 3px 0 #000, 0 0 0 2px #555; transition: transform .08s, box-shadow .08s, background .2s;
  }
  .keys span.wide { width: 120px; border-radius: 12px; }
  .keys span.down { transform: translateY(3px); box-shadow: 0 0 0 #000, 0 0 0 2px var(--red); background: radial-gradient(circle at 40% 35%, #fff, #ffd6cf 60%, #e58c80); }
  .typebar { position: absolute; left: 50%; bottom: 100%; width: 3px; height: 42px; margin-left: -1.5px; border-radius: 2px; background: linear-gradient(var(--chrome), #555); transform-origin: 50% 100%; transform: rotate(70deg) scaleY(.4); opacity: 0; }
  .typebar.hit { animation: strike .16s ease-out; }
  @keyframes strike { 0% { opacity: 1; transform: rotate(var(--a, 60deg)) scaleY(.5); } 60% { opacity: 1; transform: rotate(0) scaleY(1); } 100% { opacity: 0; transform: rotate(0) scaleY(1); } }

  /* the bell */
  .bell { position: absolute; right: 8px; top: 50%; z-index: 3; width: 40px; height: 40px; margin-top: -24px; pointer-events: none; }
  .bell svg { width: 100%; height: 100%; overflow: visible; }
  .bell .cup { fill: var(--chrome); stroke: #555; stroke-width: 1.2; transform-origin: 23px 8px; transform-box: view-box; }
  .bell.ring .cup { animation: swing .7s cubic-bezier(.3, 1.6, .6, 1); }
  .bell.ring2 .cup { animation: swing .5s cubic-bezier(.3, 1.6, .6, 1) 2; }
  @keyframes swing { 20% { transform: rotate(18deg); } 45% { transform: rotate(-14deg); } 70% { transform: rotate(7deg); } }
  .bell .wave { fill: none; stroke: var(--amber); stroke-width: 2; stroke-linecap: round; opacity: 0; }
  .bell.ring .wave, .bell.ring2 .wave { animation: wave .8s ease-out; }
  .bell.ring2 .wave { stroke: var(--red); animation-iteration-count: 2; animation-duration: .5s; }
  .bell .wave.b { animation-delay: .1s; }
  @keyframes wave { 0% { opacity: 1; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.3); } }
  .bell .wave { transform-origin: 23px 22px; transform-box: view-box; }
  .ding { position: absolute; right: 4px; top: -24px; z-index: 3; padding: 3px 7px; border-radius: 8px; background: var(--amber); color: #2a1300; font: 900 11px var(--ff); letter-spacing: .1em; opacity: 0; transform: translateY(6px) scale(.6); pointer-events: none; }
  .ding.on { animation: ding 1.1s cubic-bezier(.34, 1.56, .64, 1); }
  .ding.red { background: var(--red); color: #fff; }
  @keyframes ding { 15% { opacity: 1; transform: none; } 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }

  /* receipt after sending */
  .slip {
    position: absolute; left: 50%; top: 8px; z-index: 4; width: min(86%, 300px); padding: 12px 14px; border-radius: 6px; text-align: center;
    background: var(--paper); color: var(--paperInk); font: 700 13px/1.45 var(--type); box-shadow: 0 16px 30px -14px var(--shadow);
    transform: translate(-50%, -140%); transition: transform .6s cubic-bezier(.34, 1.4, .64, 1);
  }
  .slip.on { transform: translate(-50%, 0); }
  .slip b { display: block; color: var(--green); font-size: 14px; letter-spacing: .08em; }
  .fall { position: absolute; z-index: 5; font: 700 15px var(--type); color: var(--red); pointer-events: none; animation: fall 1s cubic-bezier(.5, 0, .9, .5) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 160px) rotate(var(--r)); opacity: 0; } }

  /* ---------- Counter ---------- */
  .count { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 12px; }
  .left { min-width: 86px; padding: 6px 10px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); text-align: center; transition: background .3s, border-color .3s; }
  .left strong { display: block; font: 800 24px/1.05 var(--ff); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .left small { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .left.warn { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--card)); }
  .left.warn strong { color: var(--amber); }
  .left.over { border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--card)); }
  .left.over strong { color: var(--red); }
  .left.bump { animation: bump .35s cubic-bezier(.34, 1.8, .64, 1); }
  @keyframes bump { 40% { transform: scale(1.1); } }
  .info p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .info p b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .info .note { margin-top: 3px; font-weight: 600; color: var(--ink); }
  .info .note.warn { color: var(--amber); }
  .info .note.over { color: var(--red); }

  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg2); color: var(--ink);
    font: 700 13px/1 var(--ff); cursor: pointer; white-space: nowrap; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn[hidden] { display: none; }
  .btn.send { margin-left: auto; border: 0; background: linear-gradient(180deg, #e2463d, var(--red)); color: #fff; padding: 0 20px; box-shadow: 0 10px 18px -10px var(--red); }
  .btn.send.busy { opacity: .7; pointer-events: none; }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 370px) { .keys span { width: 19px; height: 19px; font-size: 9px; } .keys span.wide { width: 96px; } }
  /* the paper sits behind the scale, roller and body so a new sheet can feed up from under the roller */
  .paperwrap { z-index: 0; }
  .scale, .roller, .body { z-index: 1; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <header class="head">
      <div>
        <p class="kicker">Customer SMS</p>
        <h1 id="title">Write the Eid sale message</h1>
      </div>
      <span class="to">To 240 customers</span>
    </header>

    <div class="machine" id="machine">
      <div class="slip" id="slip" role="status"><b>SENT</b><span id="slipText">240 customers · 1 SMS each</span></div>

      <div class="paperwrap" id="paperwrap">
        <div class="paper" id="paper">
          <div class="hl" id="hl" aria-hidden="true"></div>
          <label class="sr" for="ta">SMS message</label>
          <textarea id="ta" spellcheck="false" placeholder="Type your SMS here…" aria-describedby="note"></textarea>
        </div>
      </div>
      <div class="scale" aria-hidden="true">
        <span class="zone" id="zone"></span>
        <span class="ticks"></span>
        <span class="warnmark" id="warnmark"></span>
        <span class="nums" id="nums"><span>0</span><span>40</span><span>80</span><span>120</span><span>160</span></span>
        <span class="pointer" id="pointer"></span>
      </div>
      <div class="roller" id="roller" aria-hidden="true"></div>
      <div class="body" aria-hidden="true">
        <i class="typebar" id="typebar"></i>
        <div class="keys" id="keys"></div>
        <div class="bell" id="bell">
          <svg viewBox="0 0 46 46"><path class="wave" d="M6 14a20 20 0 0 0 0 16M40 14a20 20 0 0 1 0 16"/><path class="wave b" d="M1 10a26 26 0 0 0 0 24M45 10a26 26 0 0 1 0 24"/>
            <path class="cup" d="M23 8c-7 0-10 6-10 12v6l-3 4h26l-3-4v-6c0-6-3-12-10-12z"/><circle cx="23" cy="33" r="3" fill="#555"/><rect x="21" y="4" width="4" height="5" rx="1.5" fill="#555"/></svg>
        </div>
        <span class="ding" id="ding">DING</span>
      </div>
    </div>

    <div class="count">
      <div class="left" id="left"><strong id="leftNum">160</strong><small id="leftLbl">left</small></div>
      <div class="info">
        <p><b id="parts">1 SMS</b> · <b id="chars">0</b> characters · <b id="cost">PKR 120</b></p>
        <p class="note" id="note" aria-live="polite">One SMS holds 160 characters. The bell rings 20 before the end.</p>
      </div>
    </div>

    <div class="acts">
      <button class="btn" id="plain" type="button" hidden>Use plain text</button>
      <button class="btn" id="trim" type="button" hidden>Trim to 1 SMS</button>
      <button class="btn send" id="send" type="button">Send SMS</button>
    </div>
    <p class="sr" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function esc(s) { return s.replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }

  // ---------- SMS rules: plain (GSM) text fits 160 per SMS (153 per part when longer); any special character drops it to 70 (67) ----------
  var GSM = "@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !\"#¤%&'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà";
  var EXT = "^{}\\[~]|€"; // these count as two
  var PLAIN = { "’": "'", "‘": "'", "“": '"', "”": '"', "–": "-", "—": "-", "…": "...", " ": " " };
  var RECIPIENTS = 240, RATE = .5, MAX_PARTS = 3;
  function measure(s) {
    var gsm = true, w = [];
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (GSM.indexOf(c) >= 0) w.push(1); else if (EXT.indexOf(c) >= 0) w.push(2); else { gsm = false; w.push(1); }
    }
    var count = w.reduce(function (a, b) { return a + b; }, 0), single = gsm ? 160 : 70, per = gsm ? 153 : 67;
    var parts = count === 0 ? 1 : count <= single ? 1 : Math.ceil(count / per);
    // index where the text stops fitting in one SMS
    var cut = s.length, acc = 0;
    for (var j = 0; j < s.length; j++) { acc += w[j]; if (acc > single) { cut = j; break; } }
    return { gsm: gsm, count: count, single: single, per: per, parts: parts, cut: cut, w: w };
  }

  var ta = $("#ta"), hl = $("#hl"), paper = $("#paper"), wrap = $("#paperwrap"), bell = $("#bell"), ding = $("#ding");
  var pointer = $("#pointer"), left = $("#left"), leftNum = $("#leftNum"), note = $("#note"), status = $("#status");
  var trimBtn = $("#trim"), plainBtn = $("#plain"), sendBtn = $("#send"), roller = $("#roller"), typebar = $("#typebar");

  // ---------- Keyboard (decoration that reacts to typing) ----------
  var ROWS = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  $("#keys").innerHTML = ROWS.map(function (r) { return "<div>" + r.split("").map(function (k) { return '<span data-k="' + k + '">' + k + "</span>"; }).join("") + "</div>"; }).join("") +
    '<div><span class="wide" data-k=" "></span></div>';
  function press(ch) {
    var k = /^[a-z ]$/i.test(ch) ? document.querySelector('.keys [data-k="' + ch.toUpperCase() + '"]') : null; // letters and space only
    if (k) { k.classList.add("down"); setTimeout(function () { k.classList.remove("down"); }, 110); }
    typebar.style.setProperty("--a", (Math.random() * 120 - 60).toFixed(0) + "deg");
    typebar.classList.remove("hit"); void typebar.offsetWidth; typebar.classList.add("hit");
  }

  // ---------- Paint the paper, the scale and the counter ----------
  var stage = 0; // 0 fine, 1 bell rang (20 left), 2 over one SMS
  function ring(level) {
    if (reduce.matches) return;
    bell.classList.remove("ring", "ring2"); void bell.offsetWidth; bell.classList.add(level === 2 ? "ring2" : "ring");
    ding.textContent = level === 2 ? "DING DING" : "DING";
    ding.classList.toggle("red", level === 2);
    ding.classList.remove("on"); void ding.offsetWidth; ding.classList.add("on");
  }
  function update(fromTyping) {
    var v = ta.value, m = measure(v);
    // highlight: what no longer fits in one SMS is struck through; special characters glow
    var mark = function (s) { return esc(s).replace(/[^\x00-\x7F£$¥èéùìòÇØøÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ¤¡ÄÖÑÜ§¿äöñüà€\n]/g, function (c) { return '<span class="uni">' + c + "</span>"; }); };
    var html = mark(v.slice(0, m.cut));
    if (m.cut < v.length) html += "<mark>" + mark(v.slice(m.cut)) + "</mark>";
    hl.innerHTML = html + "​";
    hl.scrollTop = ta.scrollTop;

    var leftN = m.single - m.count, over = m.count > m.single, warn = !over && leftN <= 20;
    leftNum.textContent = over ? "+" + (m.count - m.single) : leftN;
    $("#leftLbl").textContent = over ? "over 1 SMS" : "left";
    left.classList.toggle("warn", warn);
    left.classList.toggle("over", over);
    paper.classList.toggle("over", over);
    $("#chars").textContent = m.count;
    $("#parts").textContent = m.parts + (m.parts > 1 ? " SMS parts" : " SMS");
    $("#cost").textContent = "PKR " + (RECIPIENTS * m.parts * RATE).toLocaleString("en-US");
    pointer.style.left = "calc(14px + (100% - 28px) * " + Math.min(1, m.count / m.single).toFixed(4) + ")";
    $("#warnmark").style.left = "calc(14px + (100% - 28px) * " + ((m.single - 20) / m.single).toFixed(4) + ")";
    $("#zone").style.width = "calc((100% - 28px) * " + (20 / m.single).toFixed(4) + ")";
    var n = $("#nums").children;
    for (var i = 0; i < 5; i++) n[i].textContent = Math.round(m.single * i / 4);
    // the note under the counter
    var text, cls = "";
    if (!m.gsm) { text = "Special characters found, so one SMS holds only 70. Use plain text to fit 160."; cls = "warn"; }
    else if (over) { text = "Now " + m.parts + " SMS parts, so it costs " + m.parts + " times as much. Trim or shorten it."; cls = "over"; }
    else if (warn) { text = leftN + " characters left before a second SMS."; cls = "warn"; }
    else text = "One SMS holds 160 characters. The bell rings 20 before the end.";
    if (m.gsm && over && m.parts >= MAX_PARTS) text = "That is the maximum of 3 SMS parts.";
    note.textContent = text; note.className = "note " + cls;
    trimBtn.hidden = !over;
    plainBtn.hidden = m.gsm || !/[’‘“”–—… ]/.test(v);
    // bell: rings once at 20 left, twice when it spills over; re-arms when you go back
    var lvl = over ? 2 : warn ? 1 : 0;
    if (lvl > stage && fromTyping !== false) {
      ring(lvl);
      status.textContent = lvl === 2 ? "Over one SMS, now " + m.parts + " parts." : leftN + " characters left.";
      left.classList.remove("bump"); void left.offsetWidth; left.classList.add("bump");
    }
    stage = lvl;
    return m;
  }

  ta.addEventListener("beforeinput", function (e) {
    // hard stop at 3 SMS parts
    if (!e.data) return;
    var s = ta.selectionStart, en = ta.selectionEnd, next = ta.value.slice(0, s) + e.data + ta.value.slice(en), m = measure(next);
    if (m.parts > MAX_PARTS) { e.preventDefault(); left.classList.remove("bump"); void left.offsetWidth; left.classList.add("bump"); note.textContent = "That is the maximum of 3 SMS parts."; }
  });
  ta.addEventListener("input", function (e) {
    var m = measure(ta.value);
    if (m.parts > MAX_PARTS) { // a long paste: keep what fits in 3 parts
      var maxCount = m.per * MAX_PARTS, acc = 0, k = 0;
      while (k < m.w.length && acc + m.w[k] <= maxCount) acc += m.w[k++];
      ta.value = ta.value.slice(0, k);
    }
    if (e.data) press(e.data.slice(-1));
    else if (e.inputType === "insertLineBreak") press(" ");
    update(true);
  });
  ta.addEventListener("scroll", function () { hl.scrollTop = ta.scrollTop; });

  // ---------- Trim: the extra letters drop off the paper ----------
  function dropLetters(text) {
    if (reduce.matches) return;
    var box = $("#machine").getBoundingClientRect(), p = paper.getBoundingClientRect();
    text.slice(0, 14).split("").forEach(function (c, i) {
      if (c === " ") return;
      var s = document.createElement("span");
      s.className = "fall"; s.textContent = c;
      s.style.cssText = "left:" + (p.right - box.left - 30 - (14 - i) * 9 + 120 * 0).toFixed(0) + "px;top:" + (p.bottom - box.top - 30) + "px;--x:" + (Math.random() * 60 - 30).toFixed(0) + "px;--r:" + (Math.random() * 400 - 200).toFixed(0) + "deg;animation-delay:" + i * 30 + "ms";
      $("#machine").appendChild(s);
      setTimeout(s.remove.bind(s), 1400);
    });
  }
  function trim() {
    var m = measure(ta.value);
    if (m.cut >= ta.value.length) return;
    var gone = ta.value.slice(m.cut);
    dropLetters(gone);
    ta.value = ta.value.slice(0, m.cut).replace(/\s+$/, "");
    stage = 1;
    update(false);
    status.textContent = "Trimmed " + gone.length + " characters. It fits in one SMS.";
  }
  trimBtn.addEventListener("click", trim);
  function plain() {
    ta.value = ta.value.replace(/[’‘“”–—… ]/g, function (c) { return PLAIN[c]; });
    stage = 0;
    var m = update(false);
    note.textContent = "Swapped curly quotes and dashes for plain ones: " + (m.count <= m.single ? "back to one SMS of 160." : m.parts + " parts.");
    status.textContent = note.textContent;
  }
  plainBtn.addEventListener("click", plain);

  // ---------- Send: the paper rolls up and out, a slip confirms, fresh paper feeds in ----------
  var sending = false;
  async function send(btn) {
    if (sending) return;
    var m = measure(ta.value);
    if (!ta.value.trim()) {
      paper.classList.remove("shake"); void paper.offsetWidth; paper.classList.add("shake");
      note.textContent = "Type your message first."; note.className = "note over";
      return;
    }
    sending = true;
    btn.classList.add("busy");
    btn.textContent = "Sending…";
    roller.classList.add("spin");
    wrap.classList.add("away");
    await wait(reduce.matches ? 50 : 700);
    roller.classList.remove("spin");
    $("#slipText").textContent = RECIPIENTS + " customers · " + m.parts + (m.parts > 1 ? " SMS parts each" : " SMS each") + " · PKR " + (RECIPIENTS * m.parts * RATE).toLocaleString("en-US");
    $("#slip").classList.add("on");
    status.textContent = "Sent to " + RECIPIENTS + " customers.";
    await wait(reduce.matches ? 400 : 1700);
    $("#slip").classList.remove("on");
    // a new sheet feeds in from under the roller
    ta.value = ""; stage = 0; update(false);
    wrap.classList.remove("away"); wrap.classList.add("feed");
    void wrap.offsetWidth;
    wrap.classList.remove("feed");
    roller.classList.add("spin");
    await wait(reduce.matches ? 50 : 650);
    roller.classList.remove("spin");
    btn.classList.remove("busy");
    btn.textContent = "Send SMS";
    sending = false;
  }
  sendBtn.addEventListener("click", function (e) { var btn = e.currentTarget; send(btn); });

  update(false);

  // ---------- Auto demo: types past the bell and the margin, trims, sends; then fixes curly quotes ----------
  var demoOn = true;
  function stopDemo(e) { if (e.isTrusted) demoOn = false; }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function type(s, gap) {
    for (var i = 0; i < s.length; i++) {
      await pause(gap);
      ta.value += s[i];
      ta.scrollTop = ta.scrollHeight;
      press(s[i]);
      update(true);
    }
  }
  var A = "Eid sale is live at Noor Fabrics! 30% off all lawn suits until Sunday. Free delivery in Lahore on orders over PKR 3,000. Visit us at Liberty Market or reply STOP to opt out.";
  var B = "We’re open till 11 PM tonight for Eid shopping. See you at Noor Fabrics!";
  async function demo() {
    try {
      await pause(700);
      ta.value = A.slice(0, 96); update(false);
      while (demoOn) {
        await type(A.slice(ta.value.length), 55); await pause(1300);
        trim(); await pause(1500);
        await send(sendBtn); if (!demoOn) throw 0;
        await pause(500);
        await type(B, 45); await pause(1600);
        plain(); await pause(1600);
        await send(sendBtn); if (!demoOn) throw 0;
        await pause(400);
        ta.value = A.slice(0, 96); update(false);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
</body>
</html>
