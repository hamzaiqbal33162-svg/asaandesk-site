<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owlstack · Security operations</title>
<meta name="description" content="A security operations console for a small team: a live threat radar, alert triage with bulk actions, an incident board, assets, detections, playbooks and reports.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "owlstack:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: black and neon at night, paper and forest by day
   ========================================================= */
:root {
  color-scheme: light;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r: 2px; --r-sm: 2px;
  --bg: #f4f5f2; --surface: #ffffff; --surface2: #f0f2ee; --ink: #0b0f0c; --muted: #5c665f; --line: #d6dbd4;
  --accent: #0a7a42; --accent-ink: #fff; --focus: #0a7a42; --ok: #0a7a42; --warn: #b26b00; --bad: #d0213d; --info: #1f6fd1;
  --crit: #d0213d; --high: #e0661b; --med: #b8930b; --low: #1f6fd1;
  --c1: #0a7a42; --c2: #d0213d; --c3: #e0661b; --c4: #1f6fd1; --c5: #8a948d;
  --glow: none; --radar: #0a7a42; --tip-bg: #0b0f0c;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #040605; --surface: #0a0f0c; --surface2: #070b09; --ink: #d8f5e3; --muted: #6f8a7a; --line: #16231b;
  --accent: #39ff8f; --accent-ink: #02140a; --focus: #39ff8f; --ok: #39ff8f; --warn: #ffb547; --bad: #ff3d6e; --info: #4cc3ff;
  --crit: #ff3d6e; --high: #ff8a3d; --med: #ffd447; --low: #4cc3ff;
  --c1: #39ff8f; --c2: #ff3d6e; --c3: #ff8a3d; --c4: #4cc3ff; --c5: #4d6357;
  --glow: 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent); --radar: #39ff8f;
}
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbars { display: grid; gap: 11px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
.hb-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.hb-fill { height: 100%; width: var(--w); border-radius: inherit; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hbIn { from { width: 0; } }
.heat { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }
.heat .hx { text-align: center; } .heat .hy { padding-right: 6px; align-self: center; white-space: nowrap; }
.hc { aspect-ratio: 1.5; min-height: 10px; border-radius: 3px; opacity: var(--a); animation: cellIn .45s var(--d) both; }
.hc:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
@keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
.gauge { position: relative; margin: 0 auto; width: 100%; }
.gauge svg { display: block; overflow: visible; }
.g-bg, .g-val { fill: none; stroke-width: 14; stroke-linecap: round; }
.g-bg { stroke: color-mix(in srgb, var(--ink) 9%, transparent); }
.gsweep { animation: gsweep 1.3s cubic-bezier(.3,0,.2,1) both; }
@keyframes gsweep { from { stroke-dasharray: 0 1; } }
.g-num { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; display: grid; }
.g-num b { font-size: 28px; line-height: 1; } .g-num span { font-size: 12px; color: var(--muted); }
.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 8px; }
.fn-bar { width: var(--w); min-width: fit-content; display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm, 8px); color: #fff; font-size: 12.5px; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; overflow: hidden; white-space: nowrap; }
.fn-row em { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; }

/* drag board */
.kboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.kcol { display: flex; flex-direction: column; min-height: 220px; border-radius: var(--r, 12px); }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.kcol-h h3 { font-size: 13.5px; flex: 1; }
.kdot { width: 9px; height: 9px; border-radius: 50%; }
.kcount { font-size: 12px; color: var(--muted); }
.klist { display: grid; gap: 9px; padding: 6px 8px 12px; min-height: 80px; flex: 1; align-content: start; border-radius: var(--r, 12px); transition: background .2s; }
.klist.kover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.kcard { position: relative; padding: 11px 12px; padding-right: 36px; border-radius: var(--r-sm, 10px); background: var(--surface); border: 1px solid var(--line); cursor: grab; user-select: none; transition: transform .15s, box-shadow .2s; }
@media (pointer: fine) { .kcard { touch-action: none; } }
.kcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
.kmove { position: absolute; top: 5px; right: 4px; width: 28px; height: 28px; }
.kdragging { opacity: .25; }
.kghost { position: fixed; left: 0; top: 0; z-index: 110; pointer-events: none; box-shadow: 0 22px 48px rgba(0,0,0,.3); cursor: grabbing; }
.kph { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: var(--r-sm, 10px); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.kempty { padding: 18px 8px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-sm, 10px); }
.kdrop { animation: kdrop .6s cubic-bezier(.2,.9,.3,1.4); }
@keyframes kdrop { 0% { transform: scale(.92); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 60% { box-shadow: 0 0 0 10px transparent; } 100% { transform: none; } }

/* page entrance (each app restyles @keyframes rise) */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .drawer { border-radius: 0; } }

/* =========================================================
   2. Shell: a command deck with squared tabs, no sidebar
   ========================================================= */
body { font-size: 13.5px; }
[data-theme="dark"] body { background-image: repeating-linear-gradient(0deg, rgba(57, 255, 143, .018) 0 1px, transparent 1px 3px); }
.skip { position: absolute; left: -999px; top: 8px; z-index: 200; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; }
.skip:focus { left: 8px; }
.deck { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.deck-row { display: flex; align-items: center; gap: 14px; padding: 10px 22px; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.mark svg { width: 34px; height: 34px; }
.mark b { font: 800 16px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.mark small { display: block; font: 10.5px var(--mono); color: var(--muted); letter-spacing: .08em; }
.defcon { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line); font: 700 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.defcon i { display: inline-block; width: 10px; height: 10px; background: var(--high); box-shadow: 0 0 10px var(--high); animation: blinkx 1.4s infinite; }
@keyframes blinkx { 50% { opacity: .35; } }
.deck-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.cmdk-b { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); font: 12px var(--mono); min-width: 220px; }
.cmdk-b span { flex: 1; text-align: left; }
kbd { font: 10.5px var(--mono); padding: 1px 5px; border: 1px solid var(--line); }
.t-ic .i-sun { display: none; } [data-theme="dark"] .t-ic .i-sun { display: block; } [data-theme="dark"] .t-ic .i-moon { display: none; }
.icon-btn { border-radius: 2px; }
.tabs { position: relative; display: flex; gap: 0; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 11px 14px; text-decoration: none; color: var(--muted); font: 700 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; transition: color .2s; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); text-shadow: var(--glow); }
.tabs .ic { width: 15px; height: 15px; }
.tab-n { font-size: 10.5px; padding: 0 5px; background: var(--bad); color: #fff; letter-spacing: 0; }
.tab-n:empty { display: none; }
.nav-marker { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent); box-shadow: var(--glow); transition: transform .4s cubic-bezier(.3, 1.2, .4, 1), width .3s; pointer-events: none; }
.menu-btn { display: none; }
.nav-scrim { display: none; }
.wrap { padding: 20px 22px 50px; overflow-x: clip; }
.view { outline: none; }

/* =========================================================
   3. Panels
   ========================================================= */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.ph h1 { font: 800 22px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.ph h1:focus { outline: none; }
.ph p { color: var(--muted); margin-top: 4px; font-family: var(--mono); font-size: 12.5px; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 2px; font: 700 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; min-height: 34px; }
.btn.primary { box-shadow: var(--glow); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.card, .kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 14px; min-width: 0; transition: transform .2s, border-color .2s, box-shadow .2s; }
.card:hover, .kpi:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: var(--glow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font: 700 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.card-h h2::before { content: "■ "; color: var(--accent); }
.kpi span { font: 700 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kpi b { display: block; font: 800 30px var(--mono); margin: 6px 0 0; color: var(--kc, var(--ink)); text-shadow: var(--glow); }
.kpi small { font: 11.5px var(--mono); color: var(--muted); }
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kc, var(--accent)); }
@keyframes rise { from { opacity: 0; transform: translateX(-10px); } 60% { opacity: 1; } }
.pill { border-radius: 0; font: 700 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.chip { border-radius: 0; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tbl { font-size: 13px; } .tbl th { font: 700 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.tbl td { padding: 8px 12px; }
.code { font: 12px var(--mono); }
.layer, .pop, .modal, .drawer, .seg, .seg button, .seg-thumb, .av, .tbl-search, .field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { border-radius: 2px; }
.sev { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--sc); }
.sev::before { content: ""; width: 9px; height: 9px; background: var(--sc); box-shadow: 0 0 8px color-mix(in srgb, var(--sc) 60%, transparent); }
.sev.Critical { --sc: var(--crit); } .sev.High { --sc: var(--high); } .sev.Medium { --sc: var(--med); } .sev.Low { --sc: var(--low); }
.checkcell input { width: 16px; height: 16px; accent-color: var(--accent); }
.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 10px; border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); font: 12px var(--mono); }
.bulk[hidden] { display: none; }

/* radar: the signature view */
.radar-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; align-items: center; }
.radar { position: relative; aspect-ratio: 1; width: 100%; max-width: 380px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--radar) 9%, transparent) 0 30%, transparent 70%), repeating-radial-gradient(circle, transparent 0 18.5%, color-mix(in srgb, var(--radar) 30%, transparent) 18.5% 19%); border: 1px solid color-mix(in srgb, var(--radar) 45%, transparent); overflow: hidden; }
.radar::before, .radar::after { content: ""; position: absolute; background: color-mix(in srgb, var(--radar) 22%, transparent); }
.radar::before { left: 50%; top: 0; bottom: 0; width: 1px; } .radar::after { top: 50%; left: 0; right: 0; height: 1px; }
.sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, color-mix(in srgb, var(--radar) 45%, transparent), transparent 18%, transparent); animation: sweep 4s linear infinite; }
.paused .sweep, .paused .blip { animation-play-state: paused; }
@keyframes sweep { to { transform: rotate(360deg); } }
.blip { position: absolute; z-index: 2; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 0; padding: 0; background: var(--sc); box-shadow: 0 0 10px var(--sc); cursor: pointer; animation: blipIn .6s cubic-bezier(.2, 1.5, .4, 1) both, glowp 4s ease-out infinite; animation-delay: 0s, var(--d); }
.blip.Critical { --sc: var(--crit); width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; } .blip.High { --sc: var(--high); } .blip.Medium { --sc: var(--med); } .blip.Low { --sc: var(--low); width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; }
.blip:hover, .blip:focus-visible { transform: scale(1.5); outline: 2px solid var(--ink); outline-offset: 2px; }
@keyframes blipIn { from { transform: scale(0); } }
@keyframes glowp { 0% { opacity: 1; } 70% { opacity: .35; } 100% { opacity: .35; } }
.radar-key { display: grid; gap: 8px; font: 12px var(--mono); }
.radar-key div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.rlabel { position: absolute; font: 700 9.5px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font: 12px var(--mono); }
.feed li { display: grid; grid-template-columns: 54px 90px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-left: 3px solid var(--sc, var(--line)); background: var(--surface2); }
.feed li.new { animation: rise .5s both; }
.feed li span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed time { color: var(--muted); }

/* incident board and page */
.kboard { grid-auto-columns: minmax(230px, 1fr); gap: 10px; }
.kcol { border: 1px solid var(--line); background: var(--surface); border-radius: 2px; }
.kcol-h h3 { font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.kdot { border-radius: 0; }
.kcard { --sc: var(--low); border-radius: 2px; border-left: 3px solid var(--sc); display: grid; gap: 6px; background: var(--surface2); }
.kcard:has(.sev.Critical) { --sc: var(--crit); } .kcard:has(.sev.High) { --sc: var(--high); } .kcard:has(.sev.Medium) { --sc: var(--med); }
.kcard b { font-size: 13px; }
.kc-f { display: flex; align-items: center; gap: 8px; font: 11px var(--mono); color: var(--muted); }
.kc-f .av { width: 22px; height: 22px; font-size: 9.5px; }
.ir { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
.stages { display: flex; gap: 0; margin-bottom: 14px; overflow-x: auto; }
.stages button { flex: 1; min-width: 110px; padding: 10px 8px; border: 1px solid var(--line); margin-right: -1px; background: var(--surface); font: 700 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); position: relative; }
.stages button.done { color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.stages button[aria-current="step"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--glow); z-index: 1; }
.tl { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
.tl li { position: relative; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: -22px; top: 4px; width: 10px; height: 10px; background: var(--surface); border: 2px solid var(--accent); }
.tl time { display: block; font: 11px var(--mono); color: var(--muted); }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tasks li { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border: 1px solid var(--line); background: var(--surface2); }
.tasks li.done span { text-decoration: line-through; color: var(--muted); }
.tasks input { width: 16px; height: 16px; accent-color: var(--accent); }
.tasks span { flex: 1; }
.prog { height: 6px; background: var(--surface2); border: 1px solid var(--line); margin: 6px 0 12px; }
.prog i { display: block; height: 100%; width: var(--w); background: var(--accent); box-shadow: var(--glow); transition: width .5s; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.facts div { padding: 8px 10px; border: 1px solid var(--line); background: var(--surface2); }
.facts span { display: block; font: 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; } .facts b { font: 700 13px var(--mono); word-break: break-all; }
pre.json { margin: 0; padding: 12px; background: var(--surface2); border: 1px solid var(--line); font: 12px/1.55 var(--mono); overflow: auto; max-height: 220px; }
.sec-t { font: 700 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
.ptree { font: 12px/1.7 var(--mono); padding: 10px 12px; background: var(--surface2); border: 1px solid var(--line); }
.ptree .bad { color: var(--bad); font-weight: 700; }
.pb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pb { display: grid; gap: 10px; align-content: start; }
.pb ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: s; }
.pb li { counter-increment: s; display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 5px 8px; border: 1px solid var(--line); }
.pb li::before { content: counter(s, decimal-leading-zero); font: 700 11px var(--mono); color: var(--muted); }
.pb li.run { border-color: var(--warn); color: var(--warn); }
.pb li.ok { border-color: var(--accent); color: var(--accent); }
.pb li.ok::after { content: "✓"; margin-left: auto; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row small { display: block; color: var(--muted); font-size: 12px; }
.iso { color: var(--bad); font: 700 11px var(--mono); }

/* =========================================================
   4. Responsive
   ========================================================= */
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: 1 / -1; } .ir { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .menu-btn { display: inline-grid; }
  .tabs { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: 250px; flex-direction: column; padding: 16px 0; background: var(--surface); border-right: 1px solid var(--line); transform: translateX(-104%); transition: transform .3s; overflow-y: auto; }
  .tabs a { padding: 12px 18px; }
  .nav-open .tabs { transform: none; }
  .nav-marker { display: none; }
  .tabs a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .nav-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav-open .nav-scrim { opacity: 1; pointer-events: auto; }
  .cmdk-b { min-width: 0; } .cmdk-b span, .cmdk-b kbd, .defcon span { display: none; }
  .wrap, .deck-row { padding-left: 14px; padding-right: 14px; }
  .radar-wrap { grid-template-columns: 1fr; }
}
@media (max-width: 560px) { .s3, .s6 { grid-column: 1 / -1; } .ph h1 { font-size: 18px; } .mark small { display: none; } .feed li { grid-template-columns: 50px 1fr; } .feed li span:nth-child(2) { display: none; } }
</style>

const dur = (ms) => { const m = Math.round(ms / MIN); return m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : Math.floor(m / 1440) + "d " + Math.floor((m % 1440) / 60) + "h"; };
const FMT = { n: fmt, k: short, rs, rsk, usd, usdk, pct: (v) => pct(v), pct0: (v) => pct(v, 0), d1: (v) => fmt(v, 1), ms: (v) => fmt(v) + " ms", min: (v) => fmt(v) + "m", usd2: (v) => usd(v, 2), pct2: (v) => pct(v, 2) };

// a believable wavy series: base value, weekly rhythm, slow trend and noise

/* ---------- Toasts (announced politely to screen readers) ---------- */
function toast(msg, kind = "ok", action) {
  const box = $("#toasts"); if (!box) return;
  const t = node(`<div class="toast ${kind}"><span class="toast-dot" aria-hidden="true"></span><span>${esc(msg)}</span></div>`);
  if (action) { const b = node(`<button type="button" class="toast-act">${esc(action.label)}</button>`); b.onclick = () => { action.run(); t.remove(); }; t.append(b); }
  box.append(t); while (box.children.length > 4) box.firstElementChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, action ? 5200 : 3200);
}

/* ---------- Dialogs: modal, drawer and command palette share one layer system ---------- */
const layers = [];
function openLayer({ kind = "modal", title = "", body = "", actions = [], wide = false, onClose, cls = "" }) {

  const box = back.firstElementChild, b = $(".layer-b", back), f = $(".layer-f", back);
  typeof body === "string" ? (b.innerHTML = body) : body && b.append(body);
  const api = { el: box, body: b, kind, close };
  actions.forEach((a) => { const btn = node(`<button type="button" class="btn ${a.kind || ""}">${a.icon ? ic(a.icon) : ""}${esc(a.label)}</button>`); btn.onclick = () => { if (a.run && a.run(api) === false) return; if (!a.keep) close(); }; f.append(btn); });
  if (!actions.length) f.remove();
  function close() { if (!back.isConnected || back.classList.contains("out")) return; back.classList.add("out"); const i = layers.indexOf(api); if (i > -1) layers.splice(i, 1); setTimeout(() => back.remove(), RM ? 0 : 240); onClose && onClose(); if (!layers.length && prev && prev.focus && prev.isConnected) prev.focus({ preventScroll: true }); }
  back.addEventListener("pointerdown", (e) => { if (e.target === back) close(); });
  $(".layer-x", back).onclick = close;
  document.body.append(back); layers.push(api);
  requestAnimationFrame(() => requestAnimationFrame(() => back.classList.add("in")));
  const first = $("input:not([type=hidden]):not([disabled]),select,textarea", b) || $(".layer-f .btn:last-child", box) || $(".layer-x", box);
  first && first.focus({ preventScroll: true });
  return api;
}

    else if (fd.type === "textarea") ctl = `<textarea id="${id}" name="${fd.k}" rows="${fd.rows || 3}" placeholder="${esc(fd.ph || "")}"${req} ${aria}>${esc(v)}</textarea>`;
    else if (fd.type === "check") ctl = `<label class="check"><input type="checkbox" id="${id}" name="${fd.k}" ${v ? "checked" : ""}><span>${esc(fd.text || fd.label)}</span></label>`;
    else if (fd.type === "range") ctl = `<div class="range-row"><input type="range" id="${id}" name="${fd.k}" min="${fd.min ?? 0}" max="${fd.max ?? 100}" step="${fd.step ?? 1}" value="${esc(v)}" ${aria}><output for="${id}">${esc(v)}</output></div>`;
    else ctl = `<input id="${id}" name="${fd.k}" type="${fd.type || "text"}" value="${esc(v)}" placeholder="${esc(fd.ph || "")}" ${fd.min != null ? `min="${fd.min}"` : ""} ${fd.max != null ? `max="${fd.max}"` : ""} ${fd.step != null ? `step="${fd.step}"` : ""}${req} ${aria}>`;

/* ---------- Playbooks ---------- */
function runPlaybook(p, ir) {
  const body = node(`<div class="pb"><p class="muted">${esc(p.name)} · ${p.steps.length} steps${ir ? " · for " + ir.id : ""}</p><ol>${p.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol><div class="prog"><i style="--w:0%"></i></div></div>`);
  const L = modal({ title: "Running playbook", body, actions: [{ label: "Close", kind: "ghost" }] });
  const lis = $$("li", body), bar = $(".prog i", body); let i = 0;
  const step = () => { if (!body.isConnected) return; if (i > 0) { lis[i - 1].classList.remove("run"); lis[i - 1].classList.add("ok"); } bar.style.setProperty("--w", (i / lis.length) * 100 + "%"); if (i >= lis.length) { p.runs++; if (ir) { ir.log.push({ t: Date.now(), who: "Owlstack", text: `Playbook “${p.name}” finished (${p.steps.length} steps)` }); } save(); toast(`Playbook “${p.name}” finished`); if (ir && App.cur === "incident") setTimeout(() => { L.close(); rerender(); }, 600); return; } lis[i].classList.add("run"); i++; setTimeout(step, RM ? 50 : 650); };
  step();
}

  <div class="grid"><section class="card s6"><div class="card-h"><h2>On call</h2></div>${DB.team.map((u) => `<div class="set-row"><span class="row">${av(u.name)}<span><b>${esc(u.name)}</b><small>${u.role}</small></span></span><label class="row" style="gap:6px"><input type="radio" name="oncall" value="${u.id}" ${u.oncall ? "checked" : ""} style="accent-color:var(--accent)"><span class="code">on call</span></label></div>`).join("")}</section>
  <section class="card s6"><div class="card-h"><h2>Data sources</h2></div>${Object.keys(DB.integrations).map((k, i) => `<div class="set-row"><div><b>${k}</b><small>${DB.integrations[k] ? "sending events" : "not connected"}</small></div>${sw("in-" + i, DB.integrations[k], k, `data-in="${esc(k)}"`)}</div>`).join("")}</section>
  <section class="card s6"><div class="card-h"><h2>Paging</h2></div>${[["page", "Phone call for critical alerts", "Calls the on-call analyst"], ["mail", "Email digest every hour", "Open alerts and incidents"], ["chat", "Post to team chat", "Every new incident"]].map(([k, l, s]) => `<div class="set-row"><div><b>${l}</b><small>${s}</small></div>${sw("pg-" + k, DB.prefs[k], l, `data-pf="${k}"`)}</div>`).join("")}</section>
  <section class="card s6"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Dark theme</b><small>Black and neon</small></div>${sw("st-dark", Theme.get() === "dark", "Dark theme")}</div><div class="set-row"><div><b>Reset demo data</b><small>Alerts, incidents and hosts return to the sample</small></div><button type="button" class="btn sm danger ghost" id="st-reset">${ic("refresh")}Reset</button></div></section></div>`;
  on(v, "change", "[name=oncall]", (e, r) => { DB.team.forEach((u) => (u.oncall = u.id === r.value)); save(); toast(user(r.value).name + " is on call"); });
  on(v, "change", "[data-in]", (e, i) => { DB.integrations[i.dataset.in] = i.checked; save(); i.closest(".set-row").querySelector("small").textContent = i.checked ? "sending events" : "not connected"; toast(i.dataset.in + (i.checked ? " connected" : " disconnected"), i.checked ? "ok" : "warn"); });
  on(v, "change", "[data-pf]", (e, i) => { DB.prefs[i.dataset.pf] = i.checked; save(); toast("Saved"); });
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-reset").onclick = async () => { if (await confirmBox("Reset demo data?", "Everything returns to the sample console.", "Reset")) { store.del(KEY); DB = seed(); counts(); rerender(); toast("Demo data reset"); } };
} };

/* ---------- Live: new alerts land on the radar and the feed ---------- */
every(5000, () => {
  if (chance(0.3)) return;
  const r = pick(DB.rules.filter((x) => x.on)), as = pick(DB.assets); if (!r) return;
  const a = { id: "AL-" + DB.seq++, rule: r.id, title: r.name, src: r.src, sev: r.sev, tac: r.tac, host: as.name, user: (pick(FIRST) + "." + pick(LAST)).toLowerCase(), ip: `${ri(10, 220)}.${ri(0, 255)}.${ri(0, 255)}.${ri(1, 254)}`, status: "New", owner: null, t: Date.now(), outcome: null, inc: null };
  DB.alerts.unshift(a); if (DB.alerts.length > 120) DB.alerts.pop(); r.hits[6]++; DB.daily[SEVS.indexOf(a.sev)][29]++;
  if (a.sev === "Critical") Notes.add(`Critical: ${a.title} on ${a.host}`, "bad");
  save(); counts();
  const f = $("#feed"); if (f) { f.prepend(node(feedLi(a, true))); while (f.children.length > 11) f.lastElementChild.remove(); }
  const rd = $("#radar"); if (rd) { rd.insertAdjacentHTML("beforeend", blip(a)); const bl = rd.querySelectorAll(".blip"); if (bl.length > 44) bl[0].remove(); }
  const k = $("#k-open"); k && countUp(k, DB.alerts.filter((x) => x.status !== "Closed").length, fmt, 500);
  const kc = $("#k-crit"); kc && countUp(kc, DB.alerts.filter((x) => x.status !== "Closed" && x.sev === "Critical").length, fmt, 500);
});
document.addEventListener("visibilitychange", () => document.body.classList.toggle("paused", document.hidden));
App.commands = () => [{ label: "Declare an incident", hint: "Incidents", run: () => { go("#/incidents"); setTimeout(() => $("#ir-new") && $("#ir-new").click(), 60); } }, ...DB.incidents.map((x) => ({ label: `${x.id} ${x.title}`, hint: "Incident", run: () => go("#/incident/" + x.id) })), ...DB.alerts.slice(0, 12).map((a) => ({ label: `${a.id} ${a.title} · ${a.host}`, hint: "Alert", run: () => openAlert(a) })), ...DB.assets.slice(0, 10).map((a) => ({ label: a.name, hint: "Host", run: () => { go("#/assets"); } }))];
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; };
[["Critical: Many files renamed fast on khi-file-03", "bad", 8], ["IR-117 moved to containment", "warn", 50], ["Mail gateway is not connected", "info", 300]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
counts();
boot({ title: "Owlstack", key: "owlstack", def: "overview" });
</script>
</body>
