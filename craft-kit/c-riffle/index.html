<!doctype html>
<!-- Chill and Craft · Riffle · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riffle · playing card code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #e4ece2;
    --felt: #2f7d57;
    --felt-deep: #1d5b3e;
    --rim: #6b4426;
    --text: #f6f2e6;
    --muted: #cfe5d6;
    --card: #fffaf0;
    --card-edge: #e3d6bb;
    --red: #c8323c;
    --black: #1f1d22;
    --back: #7d1f2c;
    --back-2: #962a3b;
    --gold: #f3c85e;
    --good: #a8f0c4;
    --bad: #ffb3a8;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #0a1510;
    --felt: #1e5c41;
    --felt-deep: #0f3524;
    --rim: #3d2716;
    --text: #f1ede0;
    --muted: #a9c9b4;
    --card: #f7f0de;
    --card-edge: #cbbd9c;
    --back: #5f1622;
    --back-2: #741d2c;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- The felt table ---------- */
  .table {
    width: min(100%, 440px);
    padding: 26px 18px 22px;
    border-radius: 30px;
    text-align: center;
    color: var(--text);
    background:
      radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.5px) 0 0 / 7px 7px,
      radial-gradient(ellipse at 50% 25%, var(--felt), var(--felt-deep) 75%);
    box-shadow: inset 0 0 0 7px var(--rim), inset 0 0 0 9px rgba(0, 0, 0, .25), 0 24px 50px -18px rgba(0, 0, 0, .55);
  }
  .suits { margin: 0; letter-spacing: .5em; font-size: 14px; color: var(--gold); }
  .suits .r { color: #ff9b9b; }
  h1 { margin: 6px 0 4px; font-size: clamp(21px, 5.5vw, 26px); font-family: ui-serif, Georgia, "Times New Roman", serif; }
  .sub { margin: 0; font-size: 14px; color: var(--muted); }

  /* ---------- Cards (each one is a real input) ---------- */
  .hand {
    position: relative;
    display: flex;
    justify-content: center;
    gap: clamp(8px, 3vw, 14px);
    margin: 24px 0 16px;
    perspective: 900px;
  }
  .card {
    position: relative;
    display: block;
    width: clamp(54px, 16vw, 74px);
    aspect-ratio: 5 / 7;
    cursor: text;
    transition: transform .3s ease;
  }
  .card-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateY(180deg);              /* empty card: face down */
    transition: transform .5s cubic-bezier(.3, 1.4, .5, 1);
  }
  .card.up .card-inner { transform: rotateY(0); }   /* filled card: face up */
  .face, .back {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 2px 0 var(--card-edge), 0 10px 18px -6px rgba(0, 0, 0, .5);
  }
  .face { background: var(--card); color: var(--black); }
  .card.red .face { color: var(--red); }
  .pip { position: absolute; font-size: 13px; line-height: 1; }
  .pip.top { top: 6px; left: 7px; }
  .pip.bottom { bottom: 6px; right: 7px; transform: rotate(180deg); }
  .digit {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: center;
    font: 700 clamp(28px, 8.5vw, 40px) / 1 ui-serif, Georgia, "Times New Roman", serif;
    caret-color: transparent;
    outline: none;
  }
  .digit::selection { background: transparent; }
  .back {
    transform: rotateY(180deg);
    background: repeating-linear-gradient(45deg, var(--back) 0 5px, var(--back-2) 5px 10px);
    box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 5.5px var(--gold), 0 10px 18px -6px rgba(0, 0, 0, .5);
  }
  .back::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 20px;
    height: 20px;
    border: 2px solid var(--gold);
    background: var(--back);
    transform: rotate(45deg);
  }

  /* Focus: the active card lifts and gets a gold ring */
  .card:focus-within { transform: translateY(-9px); }
  .card:focus-within .face,
  .card:focus-within .back { outline: 3px solid var(--gold); outline-offset: 3px; }
  .card:focus-within .back { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { outline-offset: 7px; outline-color: rgba(243, 200, 94, .45); } }
  .card:hover:not(:focus-within) { transform: translateY(-4px) rotate(-1.5deg); }

  /* Each new digit "deals" its card with a springy toss */
  .card.dealt { animation: deal .6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes deal {
    0% { transform: translateY(-26px) rotate(-10deg) scale(1.08); }
    55% { transform: translateY(-4px) rotate(2deg) scale(1); }
  }

  /* ---------- Shuffle, win and miss animations ---------- */
  .hand.shuffling .card { animation: riffle 1.1s cubic-bezier(.5, 0, .3, 1); }
  @keyframes riffle {
    0% { transform: none; }
    25% { transform: translateX(var(--dx)) translateY(-6px) rotate(calc(var(--side) * 3deg)); }
    45% { transform: translateX(calc(var(--dx) + var(--side) * 36px)) rotate(calc(var(--side) * 16deg)); }
    68% { transform: translateX(var(--dx)) translateY(-12px) rotate(0deg); }
    100% { transform: none; }
  }
  .hand.won .card { transform: translateY(var(--fy)) rotate(var(--fr)); }
  .hand.won .card:nth-child(1) { --fr: -14deg; --fy: 10px; }
  .hand.won .card:nth-child(2) { --fr: -5deg; --fy: 0px; }
  .hand.won .card:nth-child(3) { --fr: 5deg; --fy: 0px; }
  .hand.won .card:nth-child(4) { --fr: 14deg; --fy: 10px; }
  .hand.won .face { box-shadow: 0 0 0 2px var(--gold), 0 12px 22px -6px rgba(0, 0, 0, .55); }
  /* Celebration: the fanned hand does a little wave */
  .hand.cheer .card { animation: hop .55s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--n) * .09s); }
  @keyframes hop { 45% { transform: translateY(calc(var(--fy) - 18px)) rotate(var(--fr)) scale(1.06); } }
  .table.win { animation: tableGlow 1.4s ease; }
  @keyframes tableGlow {
    35% { box-shadow: inset 0 0 0 7px var(--rim), inset 0 0 0 9px rgba(0, 0, 0, .25), 0 0 0 8px rgba(243, 200, 94, .5), 0 0 60px rgba(243, 200, 94, .45); }
  }
  .hand.miss { animation: shake .45s ease; }
  .hand.miss .face { box-shadow: 0 0 0 3px var(--bad), 0 10px 18px -6px rgba(0, 0, 0, .5); }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* Poker chip with a check mark, shown on success */
  .chip {
    position: absolute;
    left: 50%;
    bottom: -18px;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--gold);
    box-shadow: inset 0 0 0 4px #fff4d6, inset 0 0 0 7px var(--gold), inset 0 0 0 9px rgba(0, 0, 0, .15), 0 6px 14px rgba(0, 0, 0, .4);
    transform: scale(0) rotate(-120deg);
    transition: transform .45s cubic-bezier(.3, 1.6, .5, 1) .15s;
    pointer-events: none;
  }
  .hand.won .chip { transform: scale(1) rotate(0); }
  .chip svg { width: 22px; height: 22px; }

  /* ---------- Status, hint and buttons ---------- */
  .status { min-height: 22px; margin: 24px 0 6px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--good); }
  .status[data-tone="bad"] { color: var(--bad); }
  .hint {
    display: inline-block;
    margin: 4px 0 14px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    background: rgba(0, 0, 0, .22);
    color: var(--muted);
  }
  .hint b { color: var(--gold); letter-spacing: .25em; font-size: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .ghost { border: 1.5px solid rgba(255, 255, 255, .35); background: transparent; color: var(--text); }
  .ghost:disabled { opacity: .55; cursor: default; }
  .solid { border: 0; background: var(--gold); color: #3a2a06; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), background .2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  .ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
  button:active:not(:disabled) { transform: scale(.94); transition-duration: .08s; }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Celebration particles: flying suits and chips ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; margin: -11px 0 0 -8px; font-style: normal; font-size: 22px; line-height: 1; color: var(--card); }
  .fx i.red { color: #ff5a64; }
  .fx i.coin { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px #fff4d6, inset 0 0 0 4px var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <main class="table" id="table">
    <p class="suits" aria-hidden="true">♠ <span class="r">♥</span> ♣ <span class="r">♦</span></p>
    <h1 id="title">Deal in your code</h1>
    <p class="sub">We sent a 4-digit code to +92 300 ••• 4417.</p>

    <!-- Four playing cards. Each card holds one real input. -->
    <div class="hand" id="hand" role="group" aria-labelledby="title" aria-describedby="hint">
      <label class="card">
        <span class="card-inner">
          <span class="face"><span class="pip top" aria-hidden="true">♠</span><input class="digit" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 4"><span class="pip bottom" aria-hidden="true">♠</span></span>
          <span class="back" aria-hidden="true"></span>
        </span>
      </label>
      <label class="card red">
        <span class="card-inner">
          <span class="face"><span class="pip top" aria-hidden="true">♥</span><input class="digit" inputmode="numeric" autocomplete="off" aria-label="Digit 2 of 4"><span class="pip bottom" aria-hidden="true">♥</span></span>
          <span class="back" aria-hidden="true"></span>
        </span>
      </label>
      <label class="card">
        <span class="card-inner">
          <span class="face"><span class="pip top" aria-hidden="true">♣</span><input class="digit" inputmode="numeric" autocomplete="off" aria-label="Digit 3 of 4"><span class="pip bottom" aria-hidden="true">♣</span></span>
          <span class="back" aria-hidden="true"></span>
        </span>
      </label>
      <label class="card red">
        <span class="card-inner">
          <span class="face"><span class="pip top" aria-hidden="true">♦</span><input class="digit" inputmode="numeric" autocomplete="off" aria-label="Digit 4 of 4"><span class="pip bottom" aria-hidden="true">♦</span></span>
          <span class="back" aria-hidden="true"></span>
        </span>
      </label>
      <span class="chip" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a2a06" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Demo code: <b id="demo"></b></p>
    <div class="actions">
      <button type="button" class="ghost" id="resend">Send a new code</button>
      <button type="button" class="solid" id="again" hidden>Deal again</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const hand = document.getElementById("hand");
  const cards = Array.from(hand.querySelectorAll(".card"));
  const boxes = cards.map((card) => card.querySelector("input"));
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");   // what is in each box
  let demo = "";                      // the code we "sent"
  let busy = false;                   // true while shuffling or after success

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo.split("").join(" ");
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    restart(statusEl, "pop");
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;              // reflow so the animation plays again
    el.classList.add(cls);
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    cards[i].classList.toggle("up", d !== "");   // flip the card face up
    if (d) {
      restart(cards[i], "dealt");               // springy toss as it lands
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
    }
  }

  // ---- Celebration: suits and chips burst out of the gold chip ----
  const fx = document.getElementById("fx");
  const tableEl = document.getElementById("table");
  const SUITS = ["♠", "♥", "♣", "♦"];
  function burst(from) {
    if (reduce) return;
    const r = from.getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    for (let n = 0; n < 36; n++) {
      const p = document.createElement("i");
      if (n % 3 === 2) p.className = "coin";
      else {
        p.textContent = SUITS[n % 4];
        if (n % 2) p.className = "red";
      }
      fx.append(p);
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;   // mostly upwards
      const dist = 90 + Math.random() * 150;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const spin = (Math.random() - 0.5) * 600;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.2)", opacity: 1 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + dy) + "px) rotate(" + spin / 2 + "deg) scale(1)", opacity: 1, offset: 0.45 },
        { transform: "translate(" + (x0 + dx * 1.2) + "px," + (y0 + dy + 170) + "px) rotate(" + spin + "deg) scale(.8)", opacity: 0 }
      ], { duration: 1300 + Math.random() * 600, easing: "cubic-bezier(.2, .6, .35, 1)" }).onfinish = () => p.remove();
    }
  }
  cards.forEach((card, i) => card.style.setProperty("--n", i));
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }   // ignore letters
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);      // autofill or drop
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // ---- Shuffle, then check the code ----
  function measure() {
    // How far each card must travel to reach the middle of the hand
    // (layout positions, so the toss animation does not disturb the numbers)
    const mid = hand.clientWidth / 2;
    cards.forEach((card, i) => {
      card.style.setProperty("--dx", mid - (card.offsetLeft + card.offsetWidth / 2) + "px");
      card.style.setProperty("--side", i < LEN / 2 ? -1 : 1);
    });
  }

  async function verify(code) {
    busy = true;
    setLocked(true);
    say("Shuffling the deck…");
    measure();
    hand.classList.add("shuffling");
    await wait(1150);
    hand.classList.remove("shuffling");

    if (code === demo) {
      // Stage 1: fan the hand out. Stage 2: chip spins in.
      // Stage 3: suits burst, the table glows and the cards wave.
      hand.classList.add("won");
      say("Code accepted. Welcome back to the table!", "good");
      await wait(550);
      burst(hand.querySelector(".chip"));
      tableEl.classList.add("win");
      hand.classList.add("cheer");
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      say("Wrong hand: that code does not match. Try again.", "bad");
      hand.classList.add("miss");
      await wait(500);
      hand.classList.remove("miss");
      clearAll();                     // cards flip face down again
      await wait(350);
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", () => {
    hand.classList.remove("won", "cheer");
    tableEl.classList.remove("win");
    againBtn.hidden = true;
    clearAll();
    newCode();
    busy = false;
    setLocked(false);
    say("A fresh code is dealt. Enter it to play again.");
    focusBox(0);
  });

  let cooldown = 0;
  resendBtn.addEventListener("click", () => {
    if (busy || cooldown) return;
    newCode();
    clearAll();
    say("New code sent. Check the demo code below.");
    focusBox(0);
    cooldown = 15;
    resendBtn.disabled = true;
    const tick = setInterval(() => {
      cooldown--;
      resendBtn.textContent = cooldown ? "Send again in " + cooldown + "s" : "Send a new code";
      if (!cooldown) { clearInterval(tick); resendBtn.disabled = false; }
    }, 1000);
    resendBtn.textContent = "Send again in 15s";
  });

  newCode();
})();
</script>
</body>
</html>
