<script>/* Pick the theme before first paint: ?theme= wins, then the saved choice, then the default */(function(k,d){var t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(k+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})('notara','');</script>
<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Notara look: plum stage sidebar, brass accents, serif numbers ================= */
:root{--font:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--rb:12px;--ri:10px;--rm:20px;
--bg:#f6f2ea;--surface:#fffdf8;--surface2:#f3ede1;--line:#e8e0d0;--text:#231e32;--muted:#706983;--hover:rgba(70,45,10,.06);--accent:#a8741a;--on-accent:#fff;--ok:#2b9467;--warn:#c47f06;--danger:#d2475f;--info:#5b4fd6;--field:#fff;
--c1:#c88d1e;--c2:#6c55e0;--c3:#1f9e93;--c4:#d9486e;--c5:#3b82d6;--c6:#5aa832;--side:#1e1932;--side2:#2a2345;--side-ink:#d6cfe8;--brass:#e8b65c;--shadow:0 18px 40px -24px rgba(40,25,70,.35)}
[data-theme="dark"]{--bg:#0e0c18;--surface:#17142a;--surface2:#201c37;--line:rgba(255,255,255,.08);--text:#eee9f8;--muted:#9a92b5;--hover:rgba(255,255,255,.06);--accent:#e8b65c;--on-accent:#1b1406;--ok:#4cd39a;--warn:#f0b13d;--danger:#f2708a;--info:#9d8cff;--field:#110e20;
--c1:#e8b65c;--c2:#9d8cff;--c3:#4fd1c5;--c4:#f2799a;--c5:#7ab8ff;--c6:#a6e27f;--side:#0a0813;--side2:#16122a;--side-ink:#cfc7e6;--toast-bg:#2b2546;--shadow:0 18px 40px -20px rgba(0,0,0,.6)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;background:radial-gradient(120% 60% at 0% 0%,var(--side2),var(--side) 60%);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:16px;overflow:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;color:#fff;letter-spacing:.01em;padding:2px 6px}
.brand small{display:block;font-family:var(--font);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);opacity:.85}
.stave{height:26px;margin:0 6px;background:repeating-linear-gradient(180deg,rgba(232,182,92,.28) 0 1px,transparent 1px 6px);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);position:relative}
.stave i{position:absolute;top:var(--y);left:var(--x);width:7px;height:5px;border-radius:50%;background:var(--brass);animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{50%{transform:translateY(-3px)}}
.nav{position:relative;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;color:inherit;text-decoration:none;font-size:13.5px;font-weight:500;position:relative;z-index:1;transition:color .2s,transform .2s}
.nav a:hover{color:#fff;transform:translateX(2px)}
.nav a[aria-current="page"]{color:#fff}
.nav a[aria-current="page"] .ic{color:var(--brass)}
.nav-marker{position:absolute;left:0;right:0;top:0;border-radius:12px;background:linear-gradient(90deg,rgba(232,182,92,.24),rgba(232,182,92,.03));box-shadow:inset 3px 0 0 var(--brass);transition:transform .5s cubic-bezier(.3,1.35,.5,1),height .3s;pointer-events:none}
.side-card{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:12px}
.side-card b{color:#fff;font-size:13px}
.side-eq{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:8px}
.side-eq i{flex:1;background:linear-gradient(var(--brass),#b0721c);border-radius:2px;height:30%;animation:eq 1.1s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-.17s)}
.side-eq.off i{animation:none;height:12%;opacity:.4}
@keyframes eq{0%{height:15%}50%{height:95%}100%{height:40%}}
.who{display:flex;align-items:center;gap:10px;padding:6px;font-size:12px}
.who b{display:block;color:#fff;font-size:13px}
/* Top bar */
.main-wrap{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.menu-btn{display:none}
.find{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;min-width:0;flex:0 1 340px;transition:border-color .2s}
.find:hover{border-color:var(--accent)}
.find kbd{margin-left:auto;font:inherit;font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.top .sp{flex:1}
.clock{font-family:var(--serif);font-size:15px;color:var(--muted);white-space:nowrap}
main{padding:4px 26px 44px;outline:none}
.scrim{display:none}
/* Page header + grids */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.ph h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em;line-height:1.15}
.ph p{margin-top:4px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.g{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:15px;font-weight:650}
.ch p{font-size:12px;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.kpi-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi-i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.kpi-v{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-f{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:30px}
.kpi-f small{font-size:12px}
.idot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--nc);margin-right:6px}
/* Piano roll: today's lessons as notes on room lanes (signature) */
.roll{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.roll-in{display:grid;grid-template-columns:104px minmax(0,1fr);min-width:720px}
.keys{display:grid;grid-template-rows:26px repeat(5,46px)}
.key{position:relative;display:flex;align-items:center;padding-left:12px;font-size:12px;font-weight:600;background:linear-gradient(90deg,var(--surface2),var(--surface));border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;margin-bottom:-1px}
.key::after{content:"";position:absolute;right:0;top:0;width:34px;height:58%;background:var(--text);opacity:.82;border-radius:0 0 4px 4px}
[data-theme="dark"] .key::after{background:#05040a;opacity:1;box-shadow:inset 0 -2px 0 rgba(255,255,255,.12)}
.lanes{position:relative;display:grid;grid-template-rows:26px repeat(5,46px);background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%)}
.hrs{position:relative;font-size:11px;color:var(--muted)}
.hrs span{position:absolute;top:4px;transform:translateX(-50%)}
.hrs span:first-child{transform:none}.hrs span:last-child{transform:translateX(-100%)}
.lane{position:relative;border-top:1px solid var(--line)}
.lane:last-child{border-bottom:1px solid var(--line)}
.note{position:absolute;top:6px;bottom:6px;border-radius:9px;border:1px solid color-mix(in srgb,var(--nc) 55%,transparent);border-left:4px solid var(--nc);background:color-mix(in srgb,var(--nc) 18%,var(--surface));color:var(--text);font-size:11px;padding:2px 6px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.25;animation:noteIn .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms);transition:box-shadow .25s,transform .2s}
.note b{display:block;font-size:11.5px}.note span{color:var(--muted);font-size:10.5px}
.note:hover{transform:translateY(-2px);z-index:2}
.note.in{box-shadow:0 0 0 2px var(--nc),0 6px 22px -4px var(--nc)}
.note.done{opacity:.5}
.note.noshow{opacity:.6;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--danger) 14%,var(--surface)) 0 6px,var(--surface) 6px 12px);border-left-color:var(--danger)}
@keyframes noteIn{from{opacity:0;transform:translateX(80px)}}
.playhead{position:absolute;top:22px;bottom:0;width:2px;margin-left:-1px;background:var(--accent);box-shadow:0 0 14px var(--accent);pointer-events:none;transition:left 1s linear;z-index:3}
.playhead::before{content:"";position:absolute;top:-6px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.roll-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
/* Lists */
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;transition:background .2s}
.li:hover{background:var(--hover)}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-family:var(--serif);font-size:14px;min-width:64px;color:var(--accent)}
.acts{display:flex;gap:6px}
/* Rooms right now */
.rooms{display:grid;gap:8px}
.room{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.room .grow{flex:1;min-width:0}.room b{font-size:13px}.room small{display:block;color:var(--muted);font-size:11.5px}
.eqs{display:flex;align-items:flex-end;gap:2px;width:30px;height:24px}
.eqs i{flex:1;border-radius:2px;background:var(--nc,var(--accent));height:20%;animation:eq 1s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-.21s)}
.eqs.off i{animation:none;opacity:.3;height:14%}
/* Week schedule */
.sched-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sched-tools label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.sched-tools .inp{width:auto;min-height:34px;padding:5px 10px}
.wk-wrap{overflow-x:auto}
.wk{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr));min-width:760px}
.wk-h{position:sticky;top:0;padding:8px 6px;text-align:center;font-size:12px;font-weight:650;border-bottom:1px solid var(--line)}
.wk-h small{display:block;color:var(--muted);font-weight:500}
.wk-h.today{color:var(--accent)}
.gut{position:relative}
.gut span{position:absolute;right:8px;font-size:10.5px;color:var(--muted);transform:translateY(-50%)}
.dcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(180deg,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh));transition:background-color .2s}
.dcol.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.lz{position:absolute;padding:3px 6px;border-radius:8px;border:0;border-left:3px solid var(--nc);background:color-mix(in srgb,var(--nc) 20%,var(--surface));color:var(--text);font-size:10.5px;text-align:left;overflow:hidden;line-height:1.25;box-shadow:0 1px 0 var(--line);transition:box-shadow .2s,transform .2s}
.lz:hover{box-shadow:0 8px 20px -10px var(--nc);transform:scale(1.02);z-index:3}
.lz b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lz span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
/* Teachers */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tc-top{display:flex;align-items:center;gap:12px}
.tc-top b{display:block;font-size:15px}.tc-top small{color:var(--muted)}
.tc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;text-align:center}
.tc-stats b{display:block;font-family:var(--serif);font-size:20px;font-weight:500}.tc-stats small{font-size:11px;color:var(--muted)}
.tc-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{color:var(--accent);font-size:13px;letter-spacing:1px}
/* Profile drawer */
.pf{display:flex;align-items:center;gap:14px;padding:6px 0 14px}
.pf .grow{flex:1}.pf b{font-size:15px;display:block}.pf small{color:var(--muted)}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:4px 0 14px}
.dlist dt{color:var(--muted)}.dlist dd{margin:0;font-weight:600}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:700}
/* Instruments */
.inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.art{height:96px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--nc) 30%,transparent),transparent 70%),var(--surface2);margin-bottom:12px;color:var(--nc)}
.art svg{width:120px;height:80px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card:hover .art svg{animation:wiggle .6s ease}
@keyframes wiggle{30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.it-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.it-h b{font-size:14px}
.it-m{font-size:12px;color:var(--muted);margin:6px 0 12px;min-height:34px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--serif);font-size:22px;font-weight:500}
/* Recitals */
.ev-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--side2),var(--side));color:#fff;border:0}
.ev-hero h2{font-family:var(--serif);font-size:26px;font-weight:500}
.ev-hero p{color:var(--side-ink)}
.ev-hero .count{display:flex;gap:16px;margin-top:14px}
.ev-hero .count b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;color:var(--brass)}
.ev-hero .count small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-ink)}
.ev-hero svg.notes-bg{position:absolute;right:-10px;bottom:-10px;width:220px;opacity:.16;fill:none;stroke:#fff;stroke-width:1.5}
.prog{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--surface2);border:1px solid transparent}
.pi .n{font-family:var(--serif);font-size:18px;color:var(--accent);min-width:22px;text-align:center}
.pi .grow{flex:1;min-width:0}.pi b{display:block;font-size:13px}.pi small{color:var(--muted);font-size:11.5px}
.grip{color:var(--muted);cursor:grab}
.seats{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:10px}
.seats i{aspect-ratio:1;border-radius:3px;background:var(--hover)}
.seats i.s{background:var(--accent);animation:heatIn .4s both;animation-delay:calc(var(--k)*6ms)}
/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:13.5px}.set-row small{color:var(--muted);font-size:12px}
.fees{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* Responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}body.nav-open .side{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.4)}.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,8,20,.45);opacity:0;pointer-events:none;transition:opacity .3s;display:block}body.nav-open .scrim{opacity:1;pointer-events:auto}.menu-btn{display:inline-grid}.top,main{padding-left:16px;padding-right:16px}.clock{display:none}}
@media (max-width:560px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:25px}.find kbd,.find span{display:none}.find{flex:0 0 auto}.fees{grid-template-columns:1fr}.kpi-v{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="lgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2cf86"/><stop offset="1" stop-color="#b2741b"/></linearGradient></defs><rect width="36" height="36" rx="11" fill="url(#lgB)"/><path d="M8 12h20M8 16h20M8 20h20M8 24h20" stroke="#fff" stroke-opacity=".25"/><path d="M15.5 25.5a3.2 3.2 0 1 1-1.8-2.9V10.2l10.5-2.2v13.3a3.2 3.2 0 1 1-1.8-2.9v-7.4l-6.9 1.5z" fill="#1d1606"/></svg>
      <div>Notara<small>Music school desk</small></div>
    </div>
    <div class="stave" aria-hidden="true"><i style="--x:18%;--y:3px;--d:0s"></i><i style="--x:36%;--y:9px;--d:-.6s"></i><i style="--x:55%;--y:15px;--d:-1.2s"></i><i style="--x:74%;--y:6px;--d:-1.8s"></i></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker"></span></nav>
    <div class="side-card" id="sideNow" aria-live="polite"></div>
    <div class="who"><span class="av" style="--h:32">ZA</span><div><b>Zara Ahmed</b>Front desk · Lahore branch</div></div>
  </aside>
  <div class="scrim" data-scrim></div>
  <div class="main-wrap">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="side"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button type="button" class="find" data-cmdk aria-label="Search pages and actions (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg><span>Search students, pages, actions…</span><kbd>Ctrl K</kbd></button>
      <span class="sp"></span>
      <span class="clock" id="clock"></span>
      <button type="button" class="icon-btn" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');

/* Donut with sweep-in segments, centre count and legend. a = {data:[{label,value,color}], size, thick, fmt, center:{value,label,fmt}} */

  if (!quiet) { countAll(el); if (!RM) $$('.seg', el).forEach((s, i) => { if (s.animate) s.animate([{ strokeDasharray: `0 ${C}` }, { strokeDasharray: `${s.dataset.len} ${C}` }], { duration: 650, delay: 120 + i * 110, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'backwards' }); }); }
  const segsEl = $$('.seg', el);

}

function rollHTML() {

/* ---------- Page: Week schedule (drag to reschedule) ---------- */
let fTeacher = 'All', fRoom = 'All';
function laneMap(list) {
  const out = {}; let cl = [], end = -1;
  const flush = () => { const cols = []; cl.forEach(l => { let c = cols.findIndex(e => e <= l.start); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = l.start + l.dur; out[l.id] = { c }; }); cl.forEach(l => out[l.id].n = cols.length); cl = []; };
  list.forEach(l => { if (l.start >= end && cl.length) flush(); cl.push(l); end = Math.max(end, l.start + l.dur); }); flush(); return out;
}
function pSchedule(el) {
  const monday = addDays(TODAY, -((TD + 6) % 7)), H = (CLOSE - OPEN) / 60 * HH;
  const show = l => (fTeacher === 'All' || l.teacher === fTeacher) && (fRoom === 'All' || l.room === fRoom);
  const vis = D.lessons.filter(show);
  el.innerHTML = PH('Week schedule', 'Drag a lesson to a new day or time. Press Enter on a lesson for Move to… and Edit.', `<button type="button" class="btn primary" data-a="book">${ic('plus')}Book lesson</button>`) +
    `<section class="card"><div class="sched-tools"><label>Teacher <select class="inp" id="fT"><option value="All">All teachers</option>${D.teachers.map(t => `<option value="${t.id}"${fTeacher === t.id ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label><label>Room <select class="inp" id="fR"><option value="All">All rooms</option>${ROOMS.map(r => `<option${fRoom === r ? ' selected' : ''}>${r}</option>`).join('')}</select></label><span class="badge">${vis.length} lessons this week</span><div class="roll-leg" style="margin-left:auto">${INST.map(i => `<span>${instDot(i)}${i}</span>`).join('')}</div></div>
    <div class="wk-wrap"><div class="wk" id="wk" style="--hh:${HH}px"><div></div>${WEEK.map((d, i) => `<div class="wk-h${d === TD ? ' today' : ''}">${DOW[d]}<small>${fshort(addDays(monday, i))} · ${vis.filter(l => l.dow === d).length}</small></div>`).join('')}
    <div class="gut" style="height:${H}px">${Array.from({ length: (CLOSE - OPEN) / 60 }, (_, i) => i ? `<span style="top:${i * HH}px">${hm(OPEN + i * 60).replace(':00', '')}</span>` : '').join('')}</div>
    ${WEEK.map(d => { const list = vis.filter(l => l.dow === d).sort((a, b) => a.start - b.start), lm = laneMap(list); return `<div class="dcol${d === TD ? ' today' : ''}" data-dow="${d}" style="height:${H}px">${list.map(l => { const p = lm[l.id], s = stu(l.student); return `<button type="button" class="lz" data-drag data-id="${l.id}" style="top:${(l.start - OPEN) / 60 * HH + 1}px;height:${l.dur / 60 * HH - 2}px;left:calc(${(p.c / p.n * 100).toFixed(2)}% + 2px);width:calc(${(100 / p.n).toFixed(2)}% - 4px);--nc:${IC[l.inst]}" aria-label="${esc(s.name)}, ${l.inst}, ${DOWL[d]} ${hm(l.start)}"><b>${esc(first(s.name))}</b><span>${hm(l.start)} · ${l.inst}</span></button>`; }).join('')}${d === TD && nowMin() > OPEN && nowMin() < CLOSE ? `<div class="now-line" style="top:${(nowMin() - OPEN) / 60 * HH}px"></div>` : ''}</div>`; }).join('')}</div></div></section>`;
  $('#fT', el).onchange = e => { fTeacher = e.target.value; refresh(); };
  $('#fR', el).onchange = e => { fRoom = e.target.value; refresh(); };
  const wk = $('#wk', el);
  wk.addEventListener('click', e => { const b = e.target.closest('.lz'); if (b) lessonCard(D.lessons.find(l => l.id === b.dataset.id)); });

    }
  });
}

    if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { f.elements.email.setAttribute('aria-invalid', 'true'); $('#' + f.elements.email.id + '-e').textContent = 'Enter a valid email'; ok = false; }
    if (!ok) return; ['name', 'city', 'phone', 'email'].forEach(k => { f.elements[k].removeAttribute('aria-invalid'); D.school[k] = f.elements[k].value.trim(); }); save(); toast('School profile saved'); };
  $('#ff', el).onsubmit = e => { e.preventDefault(); const f = e.target; let bad = false; INST.forEach(i => { const v = +f.elements[i].value; if (!(v >= 0) || f.elements[i].value === '') { bad = true; f.elements[i].setAttribute('aria-invalid', 'true'); $('#' + f.elements[i].id + '-e').textContent = 'Enter a fee'; } else { f.elements[i].removeAttribute('aria-invalid'); $('#' + f.elements[i].id + '-e').textContent = ''; D.fees[i] = v; } }); if (!bad) { save(); toast('Fees saved'); } };
}

/* ---------- Shell: nav, sidebar live card, clock, actions ---------- */
const ROUTES = [
  { id: 'desk', label: 'Front desk', icon: 'home', render: pDesk }, { id: 'schedule', label: 'Schedule', icon: 'cal', render: pSchedule }, { id: 'students', label: 'Students', icon: 'users', render: pStudents },
  { id: 'teachers', label: 'Teachers', icon: 'user', render: pTeachers }, { id: 'billing', label: 'Billing', icon: 'wallet', render: pBilling }, { id: 'instruments', label: 'Instruments', icon: 'music', render: pInstruments },
  { id: 'recitals', label: 'Recitals', icon: 'star', render: pEvents }, { id: 'reports', label: 'Reports', icon: 'chart', render: pReports }, { id: 'settings', label: 'Settings', icon: 'gear', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}">${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
function updSide() {
  const n = nowMin(), busy = todays().filter(l => l.start <= n && n < l.start + l.dur && lst(l) !== 'noshow').length;
  $('#sideNow').innerHTML = `<b>${busy ? busy + ' room' + (busy > 1 ? 's' : '') + ' playing' : 'All rooms quiet'}</b><div>${busy ? 'Lessons in progress right now' : 'Next lesson ' + ((todays().find(l => l.start > n) || {}).start ? hm(todays().find(l => l.start > n).start) : 'tomorrow')}</div><div class="side-eq${busy ? '' : ' off'}" aria-hidden="true">${Array.from({ length: 14 }, (_, k) => `<i style="--k:${k}"></i>`).join('')}</div>`;
}
function tick() { const d = new Date(); $('#clock').textContent = `${DOW[d.getDay()]} ${hm(d.getHours() * 60 + d.getMinutes())}`; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'), n = e.target.closest('[data-lesson]'), ck = e.target.closest('[data-ci],[data-ns],[data-fin]');
  if (n && $('#main').contains(n)) { lessonCard(D.lessons.find(l => l.id === n.dataset.lesson)); return; }
  if (ck && $('#main').contains(ck)) { const id = ck.dataset.ci || ck.dataset.ns || ck.dataset.fin, l = D.lessons.find(x => x.id === id); setState(l, ck.dataset.ci ? 'in' : ck.dataset.ns ? 'noshow' : 'done'); return; }
  if (e.target.closest('[data-tw]')) { teacherWeek(tch(e.target.closest('[data-tw]').dataset.tw)); return; }
  if (e.target.closest('[data-te]')) { teacherForm(tch(e.target.closest('[data-te]').dataset.te)); return; }
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'book') lessonForm(); else if (a === 'student') studentForm(); else if (a === 'pay') payForm(); else if (a === 'teacher') teacherForm(); else if (a === 'gen') genInvoices(); else if (a === 'addinst') addInstrument();
  else if (a === 'export') { const rows = D.invoices.map(i => [i.id, stu(i.student).name, i.month, i.amount, i.status].join(',')); toast(`Export ready: ${rows.length} invoice rows`); }
  else if (a === 'reset') confirmBox('Put back the original sample data? Your changes will be lost.', () => { store.del(KEY); D = makeData(); seedToday(); save(); toast('Demo data reset'); refresh(); updSide(); }, { yes: 'Reset data' });
});
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), { label: 'Book a lesson', hint: 'Action', icon: 'plus', run: () => lessonForm() }, { label: 'New student', hint: 'Action', icon: 'user', run: () => studentForm() }, { label: 'Take a payment', hint: 'Action', icon: 'cash', run: () => payForm() }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }, ...D.students.map(s => ({ label: s.name, hint: s.inst + ' student', icon: 'user', run: () => { ROUTER.go('students'); setTimeout(() => studentDrawer(s), 80); } }))];

/* Start */
initTheme('notara', '');
const od = D.invoices.filter(i => i.status === 'Overdue');
if (od[0]) addNote(`${stu(od[0].student).name}'s ${mlabel(od[0].month)} invoice is overdue`, 'danger', addDays(new Date(), -1));
const dueBack = D.rentals.find(r => r.status === 'Rented'); if (dueBack) addNote(`${dueBack.type} ${dueBack.id} is due back ${fshort(dueBack.due)}`, 'warn', new Date(Date.now() - 5e6));
addNote(`${D.events[0].name}: ${D.events[0].sold} of ${D.events[0].seats} seats sold`, 'info', new Date(Date.now() - 9e5));
updSide(); tick();
every(15000, () => { tick(); updSide(); }, false);
save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'desk', title: 'Notara' });
</script>
</body>
