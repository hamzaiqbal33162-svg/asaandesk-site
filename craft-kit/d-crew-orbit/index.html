<!doctype html>
<!-- Chill and Craft · Crew Orbit · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crew Orbit · 3D team slider</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #f3ede2;
    --bg-2: #e9e0cf;
    --ink: #17271f;
    --muted: #5f6b62;
    --accent: #1f5f4a;
    --accent-ink: #ffffff;
    --chip: #e3eadf;
    --card-shadow: rgba(30, 40, 20, 0.35);
    --focus: #1f5f4a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #101511;
    --bg-2: #18201a;
    --ink: #edf3ec;
    --muted: #9fae9f;
    --accent: #7fd8a8;
    --accent-ink: #0e1a13;
    --chip: #1f2a22;
    --card-shadow: rgba(0, 0, 0, 0.7);
    --focus: #7fd8a8;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(90% 70% at 50% 35%, var(--bg), var(--bg-2));
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
    overflow: hidden;
  }
  .intro { text-align: center; padding: 0 16px; }
  .intro small { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .intro h2 { margin: 4px 0 0; font-size: clamp(24px, 5vw, 34px); letter-spacing: -0.02em; }

  /* ---------- The 3D ring of portraits ---------- */
  .orbit {
    --w: clamp(124px, 34vw, 184px);
    position: relative;
    width: 100%;
    height: calc(var(--w) * 1.3 + 40px);
    margin-top: 10px;
    perspective: 1000px;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  .orbit.dragging { cursor: grabbing; }
  .orbit:focus-visible { outline-offset: -6px; border-radius: 20px; }
  /* a soft pool of shadow on the floor under the ring */
  .orbit::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: min(560px, 92%);
    height: 34px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--card-shadow), transparent);
    opacity: 0.55;
    pointer-events: none;
  }
  /* .member is placed on the ring by JS; .face inside it tilts toward the pointer */
  .member {
    position: absolute;
    left: 50%;
    top: 20px;
    width: var(--w);
    height: calc(var(--w) * 1.3);
    margin-left: calc(var(--w) / -2);
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.25, 1.15, 0.35, 1), opacity 0.45s;
    cursor: pointer;
  }
  .orbit.dragging .member { transition: opacity 0.2s; }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 40px -24px var(--card-shadow);
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1), box-shadow 0.4s;
  }
  .face::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(180px circle at var(--gx, 50%) var(--gy, 0%), rgba(255, 255, 255, 0.35), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .member.is-center:hover .face::after { opacity: 1; }
  .member:not(.is-center):hover .face { transform: translateY(-6px); }
  .member svg {
    display: block;
    width: 100%;
    height: 100%;
    filter: grayscale(1) contrast(0.92) brightness(1.04);
    transition: filter 0.6s ease;
  }
  .member.is-center { cursor: default; }
  .member.is-center .face { box-shadow: 0 30px 50px -22px var(--card-shadow), 0 0 0 3px var(--accent); }
  .member.is-center svg { filter: none; }
  .member .tagname {
    position: absolute;
    left: 10px;
    bottom: 10px;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    color: #17271f;
    font-size: 12px;
    font-weight: 700;
  }

  /* ---------- Details for the person in the middle ---------- */
  .info { text-align: center; padding: 0 16px; min-height: 124px; max-width: 460px; }
  .info h3 { margin: 6px 0 2px; font-size: 20px; }
  .info .role { margin: 0; color: var(--accent); font-weight: 650; font-size: 14px; }
  .info .bio { margin: 8px 0 10px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
  .chips span { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .info .in { animation: up 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
  @keyframes up { from { opacity: 0; transform: translateY(10px) scale(0.96); } }
  .chips span { display: inline-block; }

  .controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .arrow {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--accent); background: none; color: var(--accent);
    display: grid; place-items: center; cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .arrow:hover { background: var(--accent); color: var(--accent-ink); transform: translateY(-2px); }
  .arrow:active { transform: scale(0.88); transition-duration: 0.08s; }
  #prev:hover svg { transform: translateX(-2px); }
  #next:hover svg { transform: translateX(2px); }
  .arrow svg { transition: transform 0.25s; }
  .arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .dots { display: flex; gap: 2px; }
  .dot { width: 22px; height: 22px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
  .dot::after { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--muted); opacity: 0.45; transition: width 0.3s, opacity 0.3s, background 0.3s; }
  .dot[aria-current="true"]::after { width: 18px; background: var(--accent); opacity: 1; }
  @media (max-width: 400px) { .dot { width: 18px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="intro">
    <small>Our team</small>
    <h2>The people behind the work</h2>
  </header>

  <div class="orbit" id="orbit" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Team members. Use the left and right arrow keys to turn."></div>

  <section class="info" id="info" aria-live="polite">
    <h3 id="name"></h3>
    <p class="role" id="role"></p>
    <p class="bio" id="bio"></p>
    <div class="chips" id="chips"></div>
  </section>

  <div class="controls">
    <button class="arrow" id="prev" type="button" aria-label="Previous person"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" type="button" aria-label="Next person"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</main>

<script>
  (function () {
    var orbit = document.getElementById("orbit");
    var dotsEl = document.getElementById("dots");
    var info = document.getElementById("info");

    // ---------- The team (illustrated, not photos) ----------
    var team = [
      { name: "Ayesha Rana", role: "Design lead", bio: "Turns messy briefs into calm, clear screens. Sketches every idea on paper first.", skills: ["UI design", "Workshops", "Type"],
        look: { style: "hijab", skin: "#e8b48f", hair: "#3a2a22", scarf: "#c8553d", shirt: "#1f5f4a", bg: "#f2c48d" } },
      { name: "Bilal Qureshi", role: "Front-end engineer", bio: "Builds fast pages that work on slow phones. Will talk about cricket stats for hours.", skills: ["HTML/CSS", "Speed", "Access"],
        look: { style: "short", beard: true, skin: "#c98f63", hair: "#22170f", shirt: "#e76f51", bg: "#a8d5ba" } },
      { name: "Hira Siddiqui", role: "Product manager", bio: "Keeps the plan short and the meetings shorter. Makes the team's best cup of tea.", skills: ["Roadmaps", "Research", "Writing"],
        look: { style: "long", glasses: true, skin: "#f1c6a4", hair: "#4a2c1d", shirt: "#264653", bg: "#bcc4ff" } },
      { name: "Usman Tariq", role: "Back-end engineer", bio: "Makes the servers boring, in the best way. Weekend hiker in the Margalla Hills.", skills: ["APIs", "Databases", "Security"],
        look: { style: "short", glasses: true, skin: "#b97a50", hair: "#1b1410", shirt: "#3d5a80", bg: "#ffd77a" } },
      { name: "Zara Malik", role: "Motion designer", bio: "Adds the small bounces you did not notice but would miss. Collects old film posters.", skills: ["Animation", "Illustration", "3D"],
        look: { style: "bun", skin: "#e0a77f", hair: "#2d1c14", shirt: "#2a9d8f", bg: "#f6b3c2" } },
      { name: "Danish Akram", role: "Data analyst", bio: "Finds the one chart that settles the argument. Plays the flute badly but proudly.", skills: ["Analytics", "SQL", "Charts"],
        look: { style: "short", beard: true, skin: "#d39a6e", hair: "#3b2618", shirt: "#f4a261", bg: "#9ed4ea" } },
      { name: "Mehwish Noor", role: "Client success", bio: "Answers before you finish asking. Knows every client's favourite biscuit.", skills: ["Support", "Training", "Care"],
        look: { style: "long", skin: "#f0c09a", hair: "#1f1410", shirt: "#c1121f", bg: "#d7bde2" } }
    ];

    // ---------- Simple SVG portrait from a few traits ----------
    function shade(hex, f) {
      var n = parseInt(hex.slice(1), 16);
      var r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
      return "rgb(" + r + "," + g + "," + b + ")";
    }
    function portrait(p) {
      var L = p.look, s = L.skin, h = L.hair, out = [];
      out.push('<rect width="200" height="260" fill="' + L.bg + '"/>');
      out.push('<circle cx="158" cy="44" r="48" fill="#fff" opacity=".22"/><circle cx="34" cy="200" r="30" fill="#fff" opacity=".14"/>');
      if (L.style === "long") out.push('<path d="M56 116C46 58 154 58 144 116L152 206C128 216 72 216 48 206Z" fill="' + h + '"/>');
      if (L.style === "bun") out.push('<circle cx="100" cy="60" r="17" fill="' + h + '"/>');
      if (L.style === "hijab") out.push('<path d="M100 56C64 56 46 86 46 118C46 154 56 178 38 214V260H162V214C144 178 154 154 154 118C154 86 136 56 100 56Z" fill="' + L.scarf + '"/>');
      out.push('<path d="M26 260C30 206 64 186 100 186S170 206 174 260Z" fill="' + L.shirt + '"/>');
      if (L.style !== "hijab") {
        out.push('<path d="M86 144H114V184C108 192 92 192 86 184Z" fill="' + shade(s, 0.86) + '"/>');
        out.push('<ellipse cx="64" cy="120" rx="6" ry="9" fill="' + shade(s, 0.93) + '"/><ellipse cx="136" cy="120" rx="6" ry="9" fill="' + shade(s, 0.93) + '"/>');
      }
      out.push('<ellipse cx="100" cy="116" rx="' + (L.style === "hijab" ? 33 : 36) + '" ry="' + (L.style === "hijab" ? 39 : 42) + '" fill="' + s + '"/>');
      if (L.style === "short" || L.style === "bun") out.push('<path d="M64 112C60 76 80 64 102 64C126 64 142 80 136 112C130 96 116 88 100 90C84 90 72 98 64 112Z" fill="' + h + '"/>');
      if (L.style === "long") out.push('<path d="M64 116C58 76 92 62 112 68C130 72 142 90 136 116C128 98 112 88 92 86C86 96 74 104 64 116Z" fill="' + h + '"/>');
      if (L.style === "hijab") out.push('<path d="M66 108C68 80 84 70 100 70C116 70 132 80 134 108C126 92 114 86 100 86C86 86 74 92 66 108Z" fill="' + shade(L.scarf, 0.82) + '"/>');
      if (L.beard) out.push('<path d="M66 122C66 154 84 162 100 162S134 154 134 122C128 142 116 148 100 148S72 142 66 122Z" fill="' + h + '"/>');
      // face
      out.push('<path d="M78 106Q86 101 94 106M106 106Q114 101 122 106" stroke="' + shade(h, 1) + '" stroke-width="3" stroke-linecap="round" fill="none"/>');
      out.push('<ellipse cx="86" cy="118" rx="3.6" ry="4.3" fill="#24170f"/><ellipse cx="114" cy="118" rx="3.6" ry="4.3" fill="#24170f"/>');
      out.push('<path d="M100 121Q97 131 103 132" stroke="' + shade(s, 0.78) + '" stroke-width="2.5" stroke-linecap="round" fill="none"/>');
      out.push('<circle cx="77" cy="132" r="6" fill="#ff7a6b" opacity=".28"/><circle cx="123" cy="132" r="6" fill="#ff7a6b" opacity=".28"/>');
      out.push('<path d="M89 140Q100 149 111 140" stroke="#7a3328" stroke-width="3" stroke-linecap="round" fill="none"/>');
      if (L.glasses) out.push('<g fill="none" stroke="#1b1b1b" stroke-width="2.5"><circle cx="86" cy="118" r="10.5"/><circle cx="114" cy="118" r="10.5"/><path d="M96.5 117h7M75.5 116l-9-3M124.5 116l9-3"/></g>');
      return '<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + out.join("") + "</svg>";
    }

    // ---------- Build cards and dots ----------
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var cards = team.map(function (p, i) {
      var el = document.createElement("div");
      el.className = "member";
      el.innerHTML = '<div class="face">' + portrait(p) + '<span class="tagname">' + p.name.split(" ")[0] + "</span></div>";
      el.addEventListener("click", function () { if (!dragMoved) go(i); });
      // the middle card tilts toward the pointer, with a glare
      el.addEventListener("pointermove", function (e) {
        if (e.pointerType !== "mouse" || !el.classList.contains("is-center") || dragging) return;
        var r = el.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        el.style.setProperty("--gx", px * 100 + "%");
        el.style.setProperty("--gy", py * 100 + "%");
        if (reduce.matches) return;
        el.style.setProperty("--ry", (px - 0.5) * 20 + "deg");
        el.style.setProperty("--rx", (0.5 - py) * 16 + "deg");
      });
      el.addEventListener("pointerleave", function () {
        el.style.setProperty("--rx", "0deg");
        el.style.setProperty("--ry", "0deg");
      });
      orbit.appendChild(el);
      return el;
    });
    var dots = team.map(function (p, i) {
      var b = document.createElement("button");
      b.className = "dot";
      b.type = "button";
      b.setAttribute("aria-label", "Show " + p.name);
      b.addEventListener("click", function () { go(i); });
      dotsEl.appendChild(b);
      return b;
    });

    var n = team.length;
    var cur = 0;

    // ---------- Place every card around a (possibly fractional) position ----------
    // pos = cur when resting; while dragging it slides between people.
    function layout(pos) {
      if (pos === undefined) pos = cur;
      var w = cards[0].offsetWidth;
      var spacing = w * 0.66;
      cards.forEach(function (c, i) {
        var off = (((i - pos) % n) + n) % n;
        if (off > n / 2) off -= n;
        var abs = Math.abs(off);
        var rot = Math.max(-40, Math.min(40, -off * 30));
        var lift = Math.max(0, 1 - abs) * 14; // the middle card floats a little forward
        c.style.transform = "translateX(" + off * spacing + "px) translateZ(" + (lift - abs * 120) + "px) rotateY(" + rot + "deg)";
        c.style.zIndex = String(Math.round(20 - abs * 4));
        c.style.opacity = String(Math.max(0, Math.min(1, 3 - abs)));
        c.style.pointerEvents = abs > 2.2 ? "none" : "";
        c.classList.toggle("is-center", abs < 0.5);
      });
      var near = ((Math.round(pos) % n) + n) % n;
      dots.forEach(function (d, i) {
        if (i === near) d.setAttribute("aria-current", "true");
        else d.removeAttribute("aria-current");
      });
    }
    function showInfo() {
      var p = team[cur];
      document.getElementById("name").textContent = p.name;
      document.getElementById("role").textContent = p.role + " · " + (cur + 1) + " of " + n;
      document.getElementById("bio").textContent = p.bio;
      document.getElementById("chips").innerHTML = p.skills.map(function (s) { return "<span>" + s + "</span>"; }).join("");
      // name, role, bio and chips follow each other in
      Array.prototype.forEach.call(info.querySelectorAll("h3, p, .chips span"), function (el, k) {
        el.classList.remove("in");
        void el.offsetWidth;
        el.style.animationDelay = k * 60 + "ms";
        el.classList.add("in");
      });
    }
    function go(i) {
      if (!isFinite(i)) return;
      i = ((i % n) + n) % n;
      if (i === cur) return;
      cur = i;
      layout();
      showInfo();
    }

    document.getElementById("prev").addEventListener("click", function () { go(cur - 1); });
    document.getElementById("next").addEventListener("click", function () { go(cur + 1); });
    orbit.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
    });

    // ---------- Drag or swipe: the ring follows your finger, then snaps ----------
    var startX = 0, lastX = 0, lastT = 0, vel = 0, dragging = false, dragMoved = false, dragPos = 0;
    function spacing() { return Math.max(40, cards[0].offsetWidth * 0.66); }
    orbit.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      dragging = true;
      dragMoved = false;
      startX = lastX = e.clientX;
      lastT = performance.now();
      vel = 0;
    });
    orbit.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      if (!dragMoved && Math.abs(dx) > 8) {
        dragMoved = true;
        orbit.classList.add("dragging");
        if (orbit.setPointerCapture) orbit.setPointerCapture(e.pointerId);
      }
      if (!dragMoved) return;
      var now = performance.now();
      vel = (e.clientX - lastX) / Math.max(1, now - lastT); // px per ms, for a flick
      lastX = e.clientX;
      lastT = now;
      dragPos = cur - dx / spacing();
      layout(dragPos);
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      orbit.classList.remove("dragging");
      if (dragMoved) {
        // a quick flick carries on a little further
        var land = Math.round(dragPos - (vel * 140) / spacing());
        var i = ((land % n) + n) % n;
        if (i === cur) layout();
        else go(i);
      }
      // let the click that follows a drag be ignored, then reset
      setTimeout(function () { dragMoved = false; }, 0);
    }
    orbit.addEventListener("pointerup", endDrag);
    orbit.addEventListener("pointercancel", function () {
      dragging = false;
      dragMoved = false;
      orbit.classList.remove("dragging");
      layout();
    });

    window.addEventListener("resize", function () { layout(); });

    // ---------- Entrance: the cards fan out from the middle, one after another ----------
    cards.forEach(function (c) {
      c.style.transition = "none";
      c.style.transform = "translateZ(-420px) rotateY(0deg) scale(0.6)";
      c.style.opacity = "0";
    });
    void orbit.offsetWidth;
    cards.forEach(function (c, i) {
      var off = (((i - cur) % n) + n) % n;
      if (off > n / 2) off -= n;
      c.style.transition = "";
      c.style.transitionDelay = 120 + Math.abs(off) * 110 + "ms";
    });
    layout();
    setTimeout(function () { cards.forEach(function (c) { c.style.transitionDelay = ""; }); }, 1100);
    showInfo();
  })();
</script>
</body>
</html>
