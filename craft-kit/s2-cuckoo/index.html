<!doctype html>
<!-- Chill & Craft · Cuckoo · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cuckoo · Schedule a message on a cuckoo clock</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #eef0e2;
    --paper: rgba(90, 120, 70, 0.07);
    --card: #fffdf6;
    --ink: #2a1d12;
    --muted: #7b6e5c;
    --line: rgba(42, 29, 18, 0.13);
    --field: #f8f4e8;
    --accent: #2f6f4f;
    --accent2: #3f8a60;
    --brass: #d9a441;
    --red: #d94a32;
    --ok: #2f9e64;
    --shadow: rgba(60, 40, 15, 0.42);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1714;
    --paper: rgba(170, 210, 150, 0.04);
    --card: #18241e;
    --ink: #f2ebda;
    --muted: #a89e8a;
    --line: rgba(242, 235, 218, 0.12);
    --field: #121c17;
    --accent: #3a8a62;
    --accent2: #4aa476;
    --brass: #e7b450;
    --red: #ec5a40;
    --ok: #52cf8e;
    --shadow: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }

  /* ---------- Stage: a papered wall with a warm lamp ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; background: repeating-linear-gradient(90deg, var(--paper) 0 2px, transparent 2px 38px), var(--bg); }
  .stage::before { content: ""; position: absolute; z-index: -1; left: 30%; top: 40%; width: 70vmax; height: 70vmax; margin: -35vmax 0 0 -35vmax; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 200, 110, 0.28), transparent); animation: glow 7s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: 0.6; transform: scale(1.08); } }
  .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 22px 40px; width: 100%; max-width: 820px; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }

  /* ---------- The clock ---------- */
  .clock { position: relative; width: 236px; flex: none; animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .clock svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 26px 22px var(--shadow)); }
  .clock svg * { transform-box: view-box; }
  .pend { transform-origin: 120px 262px; animation: swing 1.5s ease-in-out infinite alternate; }
  .pend.fast { animation-duration: 0.32s; }
  @keyframes swing { from { transform: rotate(-11deg); } to { transform: rotate(11deg); } }
  .cone { transition: transform 1.4s cubic-bezier(0.3, 1.4, 0.4, 1); }
  .door { transform-origin: 104px 78px; }
  .bird { transform-origin: 112px 84px; opacity: 0; transform: scale(0.4); }
  .beak2 { transform-origin: 137px 78px; }
  .hand { transform-origin: 120px 170px; }
  .marker { transform-origin: 120px 170px; opacity: 0; transition: opacity 0.4s; }
  .marker.on { opacity: 1; }
  .bubble { opacity: 0; transform-origin: 160px 64px; }
  .dial { cursor: grab; touch-action: none; outline: none; }
  .dial:active { cursor: grabbing; }
  .dial:focus-visible .face-ring { stroke: var(--brass); stroke-width: 5; }
  .face-ring { fill: none; stroke: transparent; stroke-width: 0; }
  .leafs { animation: sway 5s ease-in-out infinite; transform-origin: 120px 30px; }
  @keyframes sway { 50% { transform: rotate(2.5deg); } }
  .dial-hint { margin: 10px 0 0; text-align: center; font-size: 0.74rem; font-weight: 700; color: var(--muted); }

  /* ---------- Composer card ---------- */
  .note { width: min(380px, 100%); padding: 18px; border-radius: 26px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 40px 70px -48px var(--shadow); animation: rise 0.9s 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  .to { display: flex; align-items: center; gap: 10px; }
  .av { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: linear-gradient(140deg, #ffb36b, #e0533a); color: #fff; font-weight: 900; font-size: 0.86rem; }
  .to b { display: block; font-size: 0.95rem; }
  .to small { display: block; font-size: 0.74rem; color: var(--muted); }
  .tag { margin-left: auto; padding: 5px 9px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent2); font-size: 0.68rem; font-weight: 800; white-space: nowrap; }
  textarea { display: block; width: 100%; margin: 12px 0 12px; padding: 11px 13px; border: 0; border-radius: 15px; resize: none; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 0.9rem; line-height: 1.45; outline: none; transition: box-shadow 0.2s, opacity 0.3s; }
  textarea:focus { box-shadow: inset 0 0 0 2px var(--accent2); }
  textarea[readonly] { opacity: 0.55; }
  .lbl { margin: 0 0 7px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { height: 34px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; font-size: 0.77rem; font-weight: 750; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), border-color 0.2s, background 0.2s; }
  .chip:hover { transform: translateY(-2px); border-color: var(--accent2); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; }
  .seg { display: flex; padding: 4px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); }
  .seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; font-size: 0.8rem; font-weight: 750; color: var(--muted); cursor: pointer; transition: background 0.25s, color 0.25s; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 4px 10px -6px var(--shadow), 0 0 0 1px var(--line); }
  .seg.day { flex: 1; } .seg.day button { flex: 1; }
  .readout { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 14px 0 12px; padding: 11px 14px; border-radius: 16px; background: color-mix(in srgb, var(--brass) 14%, transparent); }
  .readout b { font-size: 1.04rem; font-variant-numeric: tabular-nums; }
  .readout span { font-size: 0.78rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .readout.bad { background: color-mix(in srgb, var(--red) 14%, transparent); }
  .readout.bad span { color: var(--red); }
  .actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .actions.two { grid-template-columns: 1.4fr 1fr; }
  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1.5px solid var(--line); border-radius: 15px; background: transparent; font-weight: 800; font-size: 0.9rem; cursor: pointer; overflow: hidden; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.95); }
  .btn svg { width: 19px; height: 19px; flex: none; }
  .btn.go { border: 0; background: linear-gradient(180deg, var(--accent2), var(--accent)); color: #fff; box-shadow: 0 14px 22px -14px rgba(30, 90, 60, 0.95), inset 0 -3px 0 rgba(0, 0, 0, 0.16); }
  .btn[hidden] { display: none; }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .sheet { position: absolute; left: 0; top: 0; border-radius: 15px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); padding: 10px 12px; font-size: 0.86rem; line-height: 1.4; color: var(--ink); overflow: hidden; transform-origin: 0 0; }
  .env { position: absolute; left: 0; top: 0; width: 44px; height: 30px; }
  .env svg { width: 100%; height: 100%; display: block; }
  .dotf { position: absolute; left: 0; top: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  .feather { position: absolute; left: 0; top: 0; width: 12px; height: 6px; border-radius: 50% 50% 50% 50% / 100% 100% 0 0; }
  .toast { position: fixed; left: 50%; bottom: 18px; z-index: 40; display: inline-flex; align-items: center; gap: 9px; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 0.86rem; font-weight: 700; transform: translate(-50%, 200%); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1); }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 700px) {
    .stage { padding: 18px 16px 24px; }
    .wrap { gap: 10px; }
    .clock { width: 148px; }
    .dial-hint { margin-top: 4px; }
    .note { padding: 14px 15px; }
    textarea { margin: 10px 0; }
    .readout { margin: 10px 0; padding: 9px 13px; }
  }
  @media (max-width: 370px) {
    .row { flex-wrap: wrap; }
    .chip { padding: 0 10px; font-size: 0.76rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::before, .clock, .note, .pend, .leafs { animation: none !important; }
    .cone, .chip, .btn, .toast, .marker { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="wrap">
      <div class="clock">
        <svg viewBox="0 0 240 380">
          <defs>
            <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0663a" /><stop offset="1" stop-color="#5c3318" /></linearGradient>
            <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e3d1c" /><stop offset="1" stop-color="#43230d" /></linearGradient>
            <radialGradient id="brass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff0b8" /><stop offset=".45" stop-color="#e2ad48" /><stop offset="1" stop-color="#9a6b1c" /></radialGradient>
            <radialGradient id="face" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fffaf0" /><stop offset="1" stop-color="#efe0c0" /></radialGradient>
          </defs>
          <!-- weights and pendulum hang behind the house -->
          <g id="weights">
            <line x1="88" y1="250" x2="88" y2="318" stroke="#b58a3c" stroke-width="2.4" stroke-dasharray="3 2.2" />
            <line x1="152" y1="250" x2="152" y2="300" stroke="#b58a3c" stroke-width="2.4" stroke-dasharray="3 2.2" />
            <g class="cone" id="coneL"><path d="M88 316c-9 0-12 10-12 20s5 22 12 26c7-4 12-16 12-26s-3-20-12-20Z" fill="#7b4a22" /><path d="M78 330h20M77 340h22M79 350h18" stroke="#4e2c10" stroke-width="2" stroke-linecap="round" /></g>
            <g class="cone" id="coneR"><path d="M152 298c-9 0-12 10-12 20s5 22 12 26c7-4 12-16 12-26s-3-20-12-20Z" fill="#7b4a22" /><path d="M142 312h20M141 322h22M143 332h18" stroke="#4e2c10" stroke-width="2" stroke-linecap="round" /></g>
          </g>
          <g class="pend" id="pend"><line x1="120" y1="258" x2="120" y2="336" stroke="#c99a45" stroke-width="3" /><circle cx="120" cy="344" r="15" fill="url(#brass)" /><path d="M120 334c-5 4-6 13 0 20 6-7 5-16 0-20Z" fill="#3f7a48" /></g>
          <!-- house -->
          <rect x="42" y="72" width="156" height="190" rx="10" fill="url(#wood)" />
          <path d="M42 252h156v10a10 10 0 0 1-10 10H52a10 10 0 0 1-10-10Z" fill="#4a2810" />
          <path d="M120 30 206 100H34Z" fill="#b57944" />
          <path d="M120 6 236 98l-18 10L120 30 22 108 4 98Z" fill="url(#roof)" />
          <path d="M120 6 236 98l-4 3L120 12 8 101 4 98Z" fill="#8a5428" />
          <!-- carved leaves and a little bird on top -->
          <g class="leafs" fill="#3f7a48">
            <ellipse cx="104" cy="22" rx="11" ry="5" transform="rotate(-30 104 22)" />
            <ellipse cx="136" cy="22" rx="11" ry="5" transform="rotate(30 136 22)" />
            <ellipse cx="120" cy="12" rx="5" ry="10" fill="#4f9258" />
            <circle cx="120" cy="5" r="4" fill="#d94a32" />
          </g>
          <g fill="#3f7a48" opacity=".95">
            <ellipse cx="30" cy="104" rx="12" ry="5" transform="rotate(25 30 104)" /><ellipse cx="210" cy="104" rx="12" ry="5" transform="rotate(-25 210 104)" />
            <ellipse cx="62" cy="252" rx="14" ry="5" transform="rotate(-15 62 252)" /><ellipse cx="178" cy="252" rx="14" ry="5" transform="rotate(15 178 252)" />
          </g>
          <!-- the cuckoo's doorway, bird and door -->
          <path d="M104 98V70a16 16 0 0 1 32 0v28Z" fill="#1d0f06" />
          <g class="bird" id="bird">
            <rect x="96" y="82" width="18" height="4" rx="2" fill="#c99a45" />
            <path d="M104 86c-8 2-12-3-14-8 6 1 10 2 14 4Z" fill="#9b2f1f" />
            <ellipse cx="114" cy="84" rx="14" ry="10" fill="#e0533a" />
            <path d="M106 82c4-5 12-5 16 0-5 3-11 3-16 0Z" fill="#a83520" />
            <circle cx="127" cy="75" r="8" fill="#e8653f" />
            <circle cx="129.5" cy="73.5" r="2.4" fill="#fff" /><circle cx="130" cy="73.6" r="1.3" fill="#1a0c05" />
            <path d="M134 74 143 76.5 134 78Z" fill="#f2b233" />
            <path class="beak2" id="beak2" d="M134 78 142 79 134 81Z" fill="#d9951c" />
            <g id="beakLetter" opacity="0"><rect x="139" y="74" width="16" height="11" rx="1.5" fill="#fffaf0" stroke="#c99a45" /><path d="m139 74.6 8 5.4 8-5.4" fill="none" stroke="#c99a45" /></g>
          </g>
          <g class="door" id="door"><path d="M104 98V70a16 16 0 0 1 16-16v44Z" fill="#c2834a" /><path d="M120 54a16 16 0 0 1 16 16v28h-16Z" fill="#a86d38" /><circle cx="116" cy="80" r="1.8" fill="#f0c36a" /><circle cx="124" cy="80" r="1.8" fill="#f0c36a" /></g>
          <!-- dial (drag it, or use the arrow keys) -->
          <g class="dial" id="dial" tabindex="0" role="slider" aria-label="Send time" aria-valuemin="0" aria-valuemax="1435">
            <circle cx="120" cy="170" r="66" fill="url(#brass)" />
            <circle cx="120" cy="170" r="58" fill="url(#face)" />
            <circle class="face-ring" cx="120" cy="170" r="62" />
            <g id="ticks" stroke="#6b4a2a" stroke-linecap="round"></g>
            <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="13" fill="#3a2614" text-anchor="middle" aria-hidden="true">
              <text x="120" y="142">XII</text><text x="155" y="175">III</text><text x="120" y="208">VI</text><text x="85" y="175">IX</text>
            </g>
            <g class="marker" id="marker"><path d="M120 106 115 114h10Z" fill="#d94a32" /></g>
            <g class="hand" id="hHour"><path d="M120 174 117 160c-4-4-3-10 3-14 6 4 7 10 3 14Z" fill="#2b1a0e" /><rect x="118.6" y="150" width="2.8" height="24" rx="1.4" fill="#2b1a0e" /></g>
            <g class="hand" id="hMin"><path d="M120 176 118 128c-3-3-2-7 2-10 4 3 5 7 2 10Z" fill="#2b1a0e" /><rect x="119" y="126" width="2" height="50" rx="1" fill="#2b1a0e" /></g>
            <circle cx="120" cy="170" r="4.5" fill="url(#brass)" stroke="#6b4a1a" stroke-width="1" />
          </g>
          <!-- speech bubble -->
          <g class="bubble" id="bubble" aria-hidden="true"><rect x="150" y="38" width="78" height="26" rx="13" fill="#fffaf0" stroke="#c99a45" stroke-width="1.5" /><path d="M156 62 148 72 164 63Z" fill="#fffaf0" /><text x="189" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#2b1a0e" font-family="system-ui, sans-serif">Cuckoo!</text></g>
        </svg>
        <p class="dial-hint" aria-hidden="true">Drag the clock face to set the time</p>
      </div>

      <section class="note" aria-labelledby="noteTitle">
        <div class="to">
          <span class="av" aria-hidden="true">ZK</span>
          <div><b id="noteTitle">Zainab Khan</b><small>Birthday tomorrow · Islamabad</small></div>
          <span class="tag">Send later</span>
        </div>
        <label class="sr-only" for="msg">Message to Zainab</label>
        <textarea id="msg" rows="3" maxlength="240">Happy birthday, Zainab! Breakfast is on me tomorrow, see you at 9.</textarea>
        <p class="lbl" id="sendAt">Send at</p>
        <div class="chips" role="group" aria-labelledby="sendAt">
          <button class="chip" type="button" data-q="hour">In 1 hour</button>
          <button class="chip" type="button" data-q="tonight">Tonight 9 PM</button>
          <button class="chip" type="button" data-q="morning">Tomorrow 8 AM</button>
        </div>
        <div class="row">
          <div class="seg day" role="group" aria-label="Day"><button type="button" data-day="0">Today</button><button type="button" data-day="1">Tomorrow</button></div>
          <div class="seg" role="group" aria-label="Morning or evening"><button type="button" data-pm="0">AM</button><button type="button" data-pm="1">PM</button></div>
        </div>
        <div class="readout" id="readout"><b id="when"></b><span id="left"></span></div>
        <div class="actions" id="actions">
          <button class="btn go" id="schedule" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l2.5 2M5 4 2.5 6.5M19 4l2.5 2.5" /></svg><span>Schedule</span></button>
          <button class="btn go" id="sendNow" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-5 16-3-7Z" /></svg><span>Send now</span></button>
          <button class="btn" id="cancel" type="button" hidden><span>Cancel</span></button>

      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div class="fx" id="fx" aria-hidden="true"></div>

<script>
  // ---------- Cuckoo: pick a time on a cuckoo clock; the bird delivers your message when it strikes ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { $("#status").textContent = t; };
  let toastT = 0;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2800); }

  // Hour ticks on the dial
  (function () {
    let h = "";
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI * 2, big = i % 5 === 0;
      const r1 = big ? 48.5 : 52, r2 = 55;
      h += '<line x1="' + (120 + Math.sin(a) * r1).toFixed(1) + '" y1="' + (170 - Math.cos(a) * r1).toFixed(1) + '" x2="' + (120 + Math.sin(a) * r2).toFixed(1) + '" y2="' + (170 - Math.cos(a) * r2).toFixed(1) + '" stroke-width="' + (big ? 2.2 : 1) + '"/>';
    }
    $("#ticks").innerHTML = h;
  })();

  // ---------- Time state ----------
  // sel.day: 0 today, 1 tomorrow; sel.min: minutes after midnight (0..1435, steps of 5)
  const sel = { day: 1, min: 8 * 60 };
  const fmt = (min) => { const h = Math.floor(min / 60) % 24, m = min % 60; return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM"); };
  const dayName = (d) => (d ? "Tomorrow" : "Today");
  function target() { const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() + sel.day); return new Date(t.getTime() + sel.min * 60000); }
  function leftText(ms) {
    if (ms <= 0) return "now";
    const m = Math.ceil(ms / 60000), h = Math.floor(m / 60);
    return "in " + (h ? h + " h " : "") + (m % 60) + " min";
  }
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };

  // Hands: an absolute minute count, so they can spin forward several turns
  let shown = sel.min, tween = 0;
  function setHands(m) {
    shown = m;
    $("#hMin").style.transform = "rotate(" + (m * 6) + "deg)";
    $("#hHour").style.transform = "rotate(" + (m * 0.5) + "deg)";
  }
  function moveHands(to, dur) {
    cancelAnimationFrame(tween);
    if (calm() || !dur) { setHands(to); return Promise.resolve(); }
    const from = shown, t0 = performance.now();
    return new Promise((res) => {
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        setHands(from + (to - from) * e);
        if (p < 1) tween = requestAnimationFrame(step); else res();
      };
      tween = requestAnimationFrame(step);
    });
  }
  // shortest way round the 12-hour face to show minute m
  function showSel(dur) {
    let to = sel.min;
    const d = ((to - shown) % 720 + 1080) % 720 - 360;
    return moveHands(shown + d, dur == null ? 520 : dur);
  }

  const readout = $("#readout"), whenEl = $("#when"), leftEl = $("#left"), dial = $("#dial");
  function refresh() {
    whenEl.textContent = dayName(sel.day) + " · " + fmt(sel.min);
    const ms = target() - Date.now();
    const past = ms <= 0 && !scheduled;
    readout.classList.toggle("bad", past);
    leftEl.textContent = scheduled ? leftText(when - Date.now()) : past ? "That time has passed" : leftText(ms);
    document.querySelectorAll("[data-day]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.day === sel.day)));
    document.querySelectorAll("[data-pm]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.pm === (sel.min >= 720 ? 1 : 0))));
    dial.setAttribute("aria-valuenow", sel.min);
    dial.setAttribute("aria-valuetext", fmt(sel.min) + " " + dayName(sel.day).toLowerCase());
  }
  function setSel(day, min, dur) {
    sel.day = day; sel.min = ((Math.round(min / 5) * 5) % 1440 + 1440) % 1440;
    refresh();
    if (!scheduled) showSel(dur);
  }
  function clearChips() { document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on")); }

  // Quick times
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    if (scheduled || sending) return;
    clearChips(); c.classList.add("on");
    const q = c.dataset.q, n = nowMin();
    if (q === "hour") { const m = Math.ceil((n + 60) / 5) * 5; setSel(m >= 1440 ? 1 : 0, m % 1440); }
    else if (q === "tonight") setSel(n >= 21 * 60 ? 1 : 0, 21 * 60);
    else setSel(1, 8 * 60);
    play(c, [{ transform: "scale(.9)" }, { transform: "scale(1.06)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
    say("Send time " + dayName(sel.day) + " " + fmt(sel.min));
  }));
  document.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => { if (scheduled || sending) return; clearChips(); setSel(+b.dataset.day, sel.min); }));
  document.querySelectorAll("[data-pm]").forEach((b) => b.addEventListener("click", () => { if (scheduled || sending) return; clearChips(); const pm = +b.dataset.pm; setSel(sel.day, (sel.min % 720) + pm * 720, 700); }));

  // Dial: drag round the face (crossing XII flips AM and PM), or arrows / Page keys
  const svg = document.querySelector(".clock svg");
  let dragging = false, lastM12 = 0;
  function angleMin(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let a = Math.atan2(p.x - 120, -(p.y - 170)) * 180 / Math.PI;
    if (a < 0) a += 360;
    return Math.round((a / 360) * 720 / 5) * 5 % 720;
  }
  dial.addEventListener("pointerdown", (e) => {
    if (scheduled || sending) return;
    dragging = true; dial.setPointerCapture(e.pointerId); clearChips();
    lastM12 = sel.min % 720;
    onDrag(e);
  });
  function onDrag(e) {
    const m12 = angleMin(e);
    let pm = sel.min >= 720 ? 1 : 0;
    if (lastM12 > 540 && m12 < 180) pm = 1 - pm; // forward past XII
    else if (lastM12 < 180 && m12 > 540) pm = 1 - pm; // back past XII
    lastM12 = m12;
    sel.min = m12 + pm * 720;
    refresh();
    moveHands(shown + ((((sel.min - shown) % 720) + 1080) % 720 - 360), 0);
  }
  dial.addEventListener("pointermove", (e) => { if (dragging) onDrag(e); });
  dial.addEventListener("pointerup", () => { if (!dragging) return; dragging = false; say("Send time " + dayName(sel.day) + " " + fmt(sel.min)); });
  dial.addEventListener("pointercancel", () => { dragging = false; });
  dial.addEventListener("keydown", (e) => {
    if (scheduled || sending) return;
    const step = { ArrowUp: 5, ArrowRight: 5, ArrowDown: -5, ArrowLeft: -5, PageUp: 60, PageDown: -60 }[e.key];
    if (!step) return;
    e.preventDefault(); clearChips();
    setSel(sel.day, sel.min + step, 160);
  });

  // ---------- Schedule ----------
  let scheduled = false, sending = false, when = 0, tickTimer = 0, run = 0;
  const msg = $("#msg"), fx = $("#fx");
  const schedBtn = $("#schedule"), sendBtn = $("#sendNow"), cancelBtn = $("#cancel"), actions = $("#actions");
  const env = () => '<svg viewBox="0 0 44 30"><rect x="1" y="1" width="42" height="28" rx="4" fill="#fffaf0" stroke="#c99a45" stroke-width="1.6"/><path d="m2 3 20 14L42 3" fill="none" stroke="#c99a45" stroke-width="1.6"/><circle cx="22" cy="17" r="3.4" fill="#d94a32"/></svg>';
  const rectOf = (el) => el.getBoundingClientRect();

  function lockFields(on) {
    msg.readOnly = on;
    document.querySelectorAll(".chip, .seg button").forEach((b) => { b.disabled = on; });
    schedBtn.hidden = on; sendBtn.hidden = !on; cancelBtn.hidden = !on;
    actions.classList.toggle("two", on);
  }

  async function schedule() {
    if (scheduled || sending) return;
    if (!msg.value.trim()) { msg.focus(); say("Write a message first"); play(msg, [{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 300 }); return; }
    if (target() - Date.now() <= 0) {
      // a time that has passed: nudge to tomorrow and explain
      play(readout, [{ transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 400 });
      setSel(1, sel.min);
      say("That time has passed today, so it is set for tomorrow. Press Schedule again.");
      toast("Moved to tomorrow · press Schedule again");
      return;
    }
    const id = ++run;
    scheduled = true;
    when = target().getTime();
    lockFields(true);
    // 1. Anticipation: the door cracks open, the note lifts
    const door = $("#door");
    play(door, [{ transform: "scaleX(1)" }, { transform: "scaleX(.15)" }], { duration: 380, easing: "cubic-bezier(.3,1.4,.5,1)", fill: "forwards" });
    play(msg, [{ transform: "scale(1)" }, { transform: "scale(.97)" }, { transform: "scale(1)" }], { duration: 360 });
    // 2. Main: the message folds into an envelope and flies into the doorway
    await foldAndFly(rectOf(msg), rectOf(door), false);
    if (id !== run) return;
    play(door, [{ transform: "scaleX(.15)" }, { transform: "scaleX(1.08)" }, { transform: "scaleX(1)" }], { duration: 520, easing: SPRING, fill: "forwards" }).then(() => door.getAnimations().forEach((a) => a.cancel()));
    // 3. Progress: the cone weight drops, hands show the real time and a red pin marks the send time
    $("#coneL").style.transform = "translateY(8px)";
    $("#marker").style.transform = "rotate(" + (sel.min % 720) * 0.5 + "deg)";
    $("#marker").classList.add("on");
    await moveHands(shown + ((((nowMin() - shown) % 720) + 1080) % 720 - 360), 900);
    refresh();
    say("Scheduled for " + dayName(sel.day).toLowerCase() + " at " + fmt(sel.min) + ", " + leftText(when - Date.now()));
    toast("Scheduled · " + dayName(sel.day) + " " + fmt(sel.min));
    // 4. Finish: a brass ring pulses off the dial
    pulse();
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      if (!scheduled || sending) return;
      setHands(shown + ((((nowMin() - shown) % 720) + 1080) % 720 - 360));
      refresh();
      if (Date.now() >= when) strike(false); // the real time has come
    }, 1000);
  }
  schedBtn.addEventListener("click", schedule);

  function pulse() {
    if (calm()) return;
    const r = rectOf(dial);
    const ring = document.createElement("i");
    ring.style.cssText = "position:absolute;left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;border-radius:50%;border:3px solid var(--brass)";
    fx.appendChild(ring);
    ring.animate([{ transform: "scale(1)", opacity: 0.9 }, { transform: "scale(1.5)", opacity: 0 }], { duration: 900, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => ring.remove();
  }

  // The note shrinks into an envelope and arcs to the door (or back, when cancelled)
  async function foldAndFly(from, to, back) {
    if (calm()) return;
    if (!back) {
      const sheet = document.createElement("div");
      sheet.className = "sheet";
      sheet.textContent = msg.value;
      sheet.style.width = from.width + "px"; sheet.style.height = from.height + "px";
      fx.appendChild(sheet);
      await sheet.animate([
        { transform: "translate(" + from.left + "px," + from.top + "px) scale(1)", borderRadius: "15px", opacity: 1 },
        { transform: "translate(" + (from.left + from.width / 2 - 22) + "px," + (from.top + from.height / 2 - 15) + "px) scale(" + 44 / from.width + "," + 30 / from.height + ")", borderRadius: "40px", opacity: 0.4 }
      ], { duration: 420, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" }).finished.catch(() => {});
      sheet.remove();
    }
    const e = document.createElement("div");
    e.className = "env"; e.innerHTML = env();
    fx.appendChild(e);
    const a = back ? to : from, b = back ? from : to;
    const sx = a.left + a.width / 2 - 22, sy = a.top + a.height / 2 - 15, ex = b.left + b.width / 2 - 22, ey = b.top + b.height / 2 - 15;
    const mx = (sx + ex) / 2, my = Math.min(sy, ey) - 80;
    await e.animate([
      { transform: "translate(" + sx + "px," + sy + "px) rotate(0) scale(" + (back ? 0.4 : 1) + ")" },
      { transform: "translate(" + mx + "px," + my + "px) rotate(" + (ex < sx ? -18 : 18) + "deg) scale(1.1)", offset: 0.5 },
      { transform: "translate(" + ex + "px," + ey + "px) rotate(0) scale(" + (back ? 1 : 0.4) + ")", opacity: back ? 0 : 1 }
    ], { duration: 820, easing: "cubic-bezier(.4,.1,.3,1)", fill: "forwards" }).finished.catch(() => {});
    e.remove();
  }

  // ---------- Strike: hands race to the time, the door bursts open, the bird calls and flies the letter off ----------
  async function strike(fastForward) {
    if (!scheduled || sending) return;
    sending = true;
    const id = ++run;
    clearInterval(tickTimer);
    sendBtn.disabled = true; cancelBtn.disabled = true;
    const pend = $("#pend"), door = $("#door"), bird = $("#bird"), bubble = $("#bubble");
    // 1. Anticipation and race: the pendulum speeds up and the hands spin forward to the pin
    if (fastForward) {
      pend.classList.add("fast");
      // forward round the face to the pin, plus one more turn of the hour hand when it is over 12 hours away
      const ahead = (((sel.min - shown) % 720) + 720) % 720 + (when - Date.now() > 720 * 60000 ? 720 : 0);
      await moveHands(shown + ahead, calm() ? 0 : 1600);
      pend.classList.remove("fast");
    } else setHands(sel.min);
    if (id !== run) return;
    // 2. Main: the door flies open and the bird springs out on its arm
    play(door, [{ transform: "scaleX(1)" }, { transform: "scaleX(-.25)" }], { duration: 300, easing: "cubic-bezier(.3,1.5,.5,1)", fill: "forwards" });
    await wait(calm() ? 0 : 140);
    bird.style.opacity = "1"; bird.style.transform = "scale(1)";
    $("#beakLetter").setAttribute("opacity", "1");
    await play(bird, [{ opacity: 1, transform: "translate(0,0) scale(.4)" }, { transform: "translate(8px,4px) scale(1.25)", offset: 0.55 }, { opacity: 1, transform: "translate(4px,2px) scale(1)" }], { duration: 620, easing: SPRING });
    bird.style.transform = "translate(4px,2px) scale(1)";
    // 3. Progress: two calls with the beak opening
    bubble.style.opacity = "1";
    for (let k = 0; k < 2; k++) {
      play(bubble, [{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1.08)", opacity: 1 }, { transform: "scale(1)", opacity: 1 }], { duration: 340, easing: "ease-out" });
      await play($("#beak2"), [{ transform: "rotate(0)" }, { transform: "rotate(24deg)" }, { transform: "rotate(0)" }], { duration: 360 });
      play(bird, [{ transform: "translate(4px,2px) scale(1)" }, { transform: "translate(10px,4px) scale(1.08)" }, { transform: "translate(4px,2px) scale(1)" }], { duration: 300 });
      await wait(calm() ? 0 : 220);
    }
    // 4. Finish: the letter leaves the beak and flies off with a dotted trail; feathers drift down
    const lr = rectOf($("#beakLetter"));
    $("#beakLetter").setAttribute("opacity", "0");
    flyAway(lr);
    feathers(rectOf(bird));
    const sentAt = fmt(sel.min);
    toast("Delivered to Zainab · " + (fastForward ? "sent now" : sentAt));
    say("Message delivered to Zainab" + (fastForward ? " now" : " at " + sentAt));
    await wait(calm() ? 600 : 1100);
    bubble.style.opacity = "0";
    // 5. Reset: the bird ducks back in, the door shuts, the weight is pulled back up
    await play(bird, [{ opacity: 1, transform: "translate(4px,2px) scale(1)" }, { opacity: 0, transform: "translate(0,0) scale(.4)" }], { duration: 360, easing: "cubic-bezier(.5,0,.7,.4)" });
    bird.style.opacity = "0"; bird.style.transform = "scale(.4)";
    await play(door, [{ transform: "scaleX(-.25)" }, { transform: "scaleX(1.1)" }, { transform: "scaleX(1)" }], { duration: 480, easing: SPRING, fill: "forwards" });
    door.getAnimations().forEach((a) => a.cancel());
    $("#coneL").style.transform = "";
    $("#marker").classList.remove("on");
    finishReset();
  }
  sendBtn.addEventListener("click", () => strike(true));

  function finishReset() {
    scheduled = false; sending = false;
    sendBtn.disabled = false; cancelBtn.disabled = false;
    lockFields(false);
    refresh();
    showSel(700);
    if (demoOn) queueDemo(2600);
  }

  cancelBtn.addEventListener("click", async () => {
    if (!scheduled || sending) return;
    sending = true;
    ++run;
    clearInterval(tickTimer);
    const door = $("#door");
    play(door, [{ transform: "scaleX(1)" }, { transform: "scaleX(.15)" }], { duration: 300, fill: "forwards" });
    await foldAndFly(rectOf(msg), rectOf(door), true);
    play(door, [{ transform: "scaleX(.15)" }, { transform: "scaleX(1)" }], { duration: 420, easing: SPRING, fill: "forwards" }).then(() => door.getAnimations().forEach((a) => a.cancel()));
    $("#coneL").style.transform = "";
    $("#marker").classList.remove("on");
    toast("Schedule cancelled · nothing was sent");
    say("Schedule cancelled. Nothing was sent.");
    finishReset();
  });

  function flyAway(r) {
    if (calm()) return;
    const e = document.createElement("div");
    e.className = "env"; e.innerHTML = env();
    fx.appendChild(e);
    const sx = r.left, sy = r.top, ex = innerWidth + 60, ey = Math.max(-60, sy - 260);
    const anim = e.animate([
      { transform: "translate(" + sx + "px," + sy + "px) rotate(0) scale(.5)" },
      { transform: "translate(" + (sx + 40) + "px," + (sy - 50) + "px) rotate(-12deg) scale(1)", offset: 0.25 },
      { transform: "translate(" + (sx + (ex - sx) * 0.6) + "px," + (sy - 120) + "px) rotate(10deg) scale(.9)", offset: 0.65 },
      { transform: "translate(" + ex + "px," + ey + "px) rotate(-6deg) scale(.7)" }
    ], { duration: 1500, easing: "cubic-bezier(.4,0,.6,1)" });
    const trail = setInterval(() => {
      const b = e.getBoundingClientRect();
      const d = document.createElement("i");
      d.className = "dotf";
      fx.appendChild(d);
      d.animate([{ transform: "translate(" + (b.left + 6) + "px," + (b.top + b.height / 2) + "px) scale(1)", opacity: 0.9 }, { transform: "translate(" + (b.left + 6) + "px," + (b.top + b.height / 2 + 8) + "px) scale(.2)", opacity: 0 }], { duration: 700 }).onfinish = () => d.remove();
    }, 70);
    anim.onfinish = () => { clearInterval(trail); e.remove(); };
  }
  function feathers(r) {
    if (calm()) return;
    const cols = ["#e0533a", "#f2b233", "#a83520"];
    for (let k = 0; k < 6; k++) {
      const f = document.createElement("i");
      f.className = "feather"; f.style.background = cols[k % 3];
      fx.appendChild(f);
      const x = r.left + r.width * Math.random(), y = r.top + r.height / 2;
      const dx = (Math.random() - 0.5) * 80;
      f.animate([
        { transform: "translate(" + x + "px," + y + "px) rotate(0)", opacity: 1 },
        { transform: "translate(" + (x + dx * 0.5 + 14) + "px," + (y + 50) + "px) rotate(40deg)", offset: 0.4 },
        { transform: "translate(" + (x + dx - 10) + "px," + (y + 110) + "px) rotate(-30deg)", opacity: 1, offset: 0.75 },
        { transform: "translate(" + (x + dx) + "px," + (y + 150) + "px) rotate(10deg)", opacity: 0 }
      ], { duration: 1600 + Math.random() * 700, delay: k * 60, easing: "ease-in-out" }).onfinish = () => f.remove();
    }
  }

  // ---------- Auto-demo: choose a quick time, schedule, then fast-forward; stops on real input ----------
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demoOn || scheduled || sending) return;
    const r = round++ % 2;
    if (r === 0) { document.querySelector('[data-q="morning"]').click(); }
    else { clearChips(); setSel(1, 18 * 60 + 30, 900); }
    await wait(1100);
    if (!demoOn) return;
    await schedule();
    await wait(1800);
    if (!demoOn || !scheduled) return;
    strike(true);
  }

  // ---------- Start ----------
  setHands(sel.min - 90);
  refresh();
  setTimeout(() => showSel(900), 250);
  setInterval(() => { if (!scheduled && !sending) refresh(); }, 15000);
  queueDemo(1500);
</script>
</body>
</html>
