<html lang="en">
<head>
<meta charset="utf-8">

<title>Branchling · tree navigation</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: sage, moss and terracotta blossoms on paper ---------- */
  :root {
    color-scheme: light;
    --bg1: #e9f0e1;
    --bg2: #cddcc1;
    --card: #fbfaf3;
    --pane: #f3f2e6;
    --line: #e2e3d2;
    --ink: #1f2e25;
    --ink2: #5b6b5e;
    --soft: #93a08f;
    --vine: #93b87c;
    --vine2: #4f8a3c;
    --leaf: #86b56f;
    --leaf-on: #3d9c46;
    --ctr: #f2c879;
    --sel: #e2eed6;
    --mark: #f7e08a;
    --shadow: rgba(40, 70, 40, .25);
    --focus: #3d9c46;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #0f1913;
    --bg2: #18271d;
    --card: #162119;
    --pane: #1b291f;
    --line: #29392d;
    --ink: #e8f1e3;
    --ink2: #a8bba7;
    --soft: #6c8270;
    --vine: #4c7a43;
    --vine2: #86c172;
    --leaf: #5c9a52;
    --leaf-on: #93e07c;
    --ctr: #f4cf86;
    --sel: #233a29;
    --mark: #6d6324;
    --shadow: rgba(0, 0, 0, .55);
    --focus: #93e07c;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { min-height: 100vh; font-family: var(--sans); color: var(--ink); background: radial-gradient(70% 60% at 85% 10%, var(--bg2), transparent 70%), radial-gradient(60% 50% at 0% 100%, var(--bg2), transparent 70%), var(--bg1); }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px 12px; overflow: hidden; }
  .fern { position: absolute; width: 260px; height: 260px; pointer-events: none; opacity: .45; fill: var(--vine); animation: sway 8s ease-in-out infinite; transform-origin: 0% 100%; }
  .fern.a { left: -40px; bottom: -30px; }
  .fern.b { right: -50px; top: -40px; transform: rotate(180deg); animation-delay: -4s; transform-origin: 100% 0; }
  @keyframes sway { 50% { rotate: 4deg; } }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    width: min(940px, 100%);
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    border-radius: 28px;
    background: var(--card);
    box-shadow: 0 50px 90px -50px var(--shadow), 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .panes { display: grid; grid-template-columns: 1fr; min-height: 0; }
  @media (min-width: 720px) { .panes { grid-template-columns: 340px minmax(0, 1fr); height: 560px; } }
  .side { display: flex; flex-direction: column; min-height: 0; padding: 16px 12px 10px; background: var(--pane); border-bottom: 1px solid var(--line); }
  @media (min-width: 720px) { .side { border-bottom: 0; border-right: 1px solid var(--line); } }
  .side-top { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px; }
  .side-top b { margin-right: auto; font-size: 16px; letter-spacing: -.01em; }
  .side-top b small { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); }
  .ib { width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; transition: transform .3s var(--spring); }
  .ib:active { transform: scale(.88); }
  .ib svg { width: 18px; height: 18px; fill: none; stroke: var(--ink2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .find { display: flex; align-items: center; gap: 8px; height: 40px; margin: 0 4px 8px; padding: 0 12px; border-radius: 13px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  .find:focus-within { box-shadow: 0 0 0 2px var(--focus); }
  .find svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--soft); stroke-width: 2.2; stroke-linecap: round; }
  .find input { width: 100%; border: 0; outline: none; background: none; font-size: 14px; }
  .treebox { position: relative; flex: 1; min-height: 0; height: min(300px, 40vh); overflow: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
  @media (min-width: 720px) { .treebox { height: auto; } }
  .none { margin: 18px 8px; color: var(--ink2); font-size: 13.5px; text-align: center; }

  /* ---------- The tree ---------- */
  [role="tree"], [role="group"] { list-style: none; margin: 0; padding: 0; }
  [role="group"] { padding-left: 22px; }
  [role="treeitem"] { position: relative; outline: none; }
  [role="treeitem"].gone { display: none; }
  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px 0 4px; border-radius: 12px; cursor: pointer; user-select: none; transition: background .25s; }
  .row:hover { background: color-mix(in srgb, var(--sel) 60%, transparent); }
  [role="treeitem"]:focus-visible > .row { outline: 2.5px solid var(--focus); outline-offset: -2px; }
  [aria-selected="true"] > .row { background: var(--sel); }
  [aria-selected="true"] > .row .nm { font-weight: 750; }
  .tw { flex: none; width: 16px; height: 16px; display: grid; place-items: center; }
  .tw svg { width: 12px; height: 12px; fill: none; stroke: var(--soft); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .45s var(--spring); }
  [aria-expanded="true"] > .row .tw svg { transform: rotate(90deg); }
  .nm { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 1px; }
  .ct { flex: none; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; background: var(--card); box-shadow: 0 0 0 1px var(--line); font-size: 11px; font-weight: 750; color: var(--ink2); }

  /* folder = a bud that opens into a blossom */
  .bud { flex: none; width: 24px; height: 24px; overflow: visible; }
  .bud .p { fill: var(--pc, #e07a5f); transform: rotate(calc(var(--r) * .12 - 22deg)) translateY(-3px) scale(.72); transition: transform .55s var(--spring) calc(var(--k) * 30ms); }
  .bud .c { fill: var(--ctr); transform: scale(.35); transition: transform .5s var(--spring) .12s; }
  .bud .stem { stroke: var(--vine2); stroke-width: 1.8; fill: none; stroke-linecap: round; transition: opacity .3s; }
  [aria-expanded="true"] > .row .bud .p { transform: rotate(var(--r)) translateY(-5px) scale(1); }
  [aria-expanded="true"] > .row .bud .c { transform: scale(1); }
  [aria-expanded="true"] > .row .bud .stem { opacity: 0; }
  /* file = a leaf */
  .leafi { flex: none; width: 24px; height: 24px; }
  .leafi path { fill: var(--leaf); transition: fill .3s; }
  .leafi .vein { fill: none; stroke: var(--card); stroke-width: 1.4; stroke-linecap: round; }
  [aria-selected="true"] > .row .leafi path:not(.vein) { fill: var(--leaf-on); }
  [aria-selected="true"] > .row .leafi { animation: dew 2.6s ease-in-out infinite; }
  @keyframes dew { 50% { transform: rotate(-8deg) scale(1.08); } }
  .glint { position: absolute; left: 40px; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px var(--leaf-on); opacity: 0; pointer-events: none; }
  .glint.on { animation: glint .9s ease-out; }
  @keyframes glint { 30% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(.4) translateY(-8px); } }

  /* children: rows slide open, vine segments grow down, then curl out to each child */
  .kids { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.3, .9, .3, 1); }
  .kids > ul { min-height: 0; overflow: hidden; }
  [aria-expanded="true"] > .kids { grid-template-rows: 1fr; }
  [role="group"] > [role="treeitem"] > .row { opacity: 0; transform: translateX(-10px); transition: opacity .3s, transform .45s var(--spring), background .25s; }
  [aria-expanded="true"] > .kids > [role="group"] > [role="treeitem"] > .row { opacity: 1; transform: none; transition-delay: calc(var(--i) * 55ms + 80ms), calc(var(--i) * 55ms + 80ms), 0s; }
  [role="group"] > [role="treeitem"]::after { content: ""; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: var(--vine); transform-origin: 50% 0; transform: scaleY(0); transition: transform .3s ease calc(var(--i) * 55ms); }
  [role="group"] > [role="treeitem"]:last-child::after { bottom: auto; height: 12px; }
  [role="group"] > [role="treeitem"]::before { content: ""; position: absolute; left: 15px; top: 6px; width: 16px; height: 12px; border-left: 2px solid var(--vine); border-bottom: 2px solid var(--vine); border-bottom-left-radius: 12px; transform-origin: 0 0; transform: scale(0); transition: transform .4s var(--spring) calc(var(--i) * 55ms + 100ms); }
  [aria-expanded="true"] > .kids > [role="group"] > [role="treeitem"]::after,
  [aria-expanded="true"] > .kids > [role="group"] > [role="treeitem"]::before { transform: none; }
  .lf { position: absolute; z-index: 2; left: 19px; top: 11px; width: 9px; height: 6px; border-radius: 0 100% 0 100%; background: var(--vine2); transform: rotate(-30deg) scale(0); transform-origin: 0 100%; transition: transform .5s var(--spring) calc(var(--i) * 55ms + 220ms); pointer-events: none; }
  [role="tree"] > [role="treeitem"] > .lf { display: none; }
  [aria-expanded="true"] > .kids > [role="group"] > [role="treeitem"] > .lf { transform: rotate(-30deg) scale(1); animation: leafsway 3.2s ease-in-out infinite calc(var(--i) * -.7s); }
  @keyframes leafsway { 50% { rotate: 14deg; } }
  /* sap: a glow runs from the root down to the page you open */
  .sap > .row .bud .c, .sap > .row .leafi path:not(.vein) { filter: drop-shadow(0 0 4px var(--leaf-on)); }
  .sap > .row { background: color-mix(in srgb, var(--sel) 80%, transparent); }
  .pollen { position: absolute; z-index: 5; left: 0; top: 0; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--ctr); pointer-events: none; }

  /* ---------- The page preview ---------- */
  .doc { position: relative; padding: 20px 22px 22px; min-width: 0; overflow: auto; }
  .doc .art { position: absolute; right: -8px; bottom: -6px; width: min(240px, 46%); height: auto; opacity: .2; pointer-events: none; }
  .doc .art .st { fill: none; stroke: var(--vine2); stroke-width: 3; stroke-linecap: round; }
  .doc .art .lv { fill: var(--vine2); transform-box: fill-box; transform-origin: 0% 100%; animation: leafsway 4s ease-in-out infinite; }
  .doc .art .lv:nth-child(odd) { animation-delay: -2s; }
  .rel { margin-top: 18px; }
  .rel small { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
  .rel div { display: flex; flex-wrap: wrap; gap: 8px; }
  .relb { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border: 0; border-radius: 12px; background: var(--pane); box-shadow: 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 650; transition: transform .35s var(--spring), box-shadow .2s; }
  .relb:hover { transform: translateY(-2px); box-shadow: 0 0 0 1.5px var(--vine); }
  .relb svg { width: 18px; height: 18px; }
  .relb path { fill: var(--leaf); }
  .relb .vein { fill: none; stroke: var(--card); stroke-width: 1.4; }
  .doc .body { position: relative; }
  .doc .body > * { animation: grow .6s var(--spring) backwards; }
  .doc .body > :nth-child(2) { animation-delay: .06s; } .doc .body > :nth-child(3) { animation-delay: .12s; } .doc .body > :nth-child(4) { animation-delay: .18s; } .doc .body > :nth-child(5) { animation-delay: .24s; }
  @keyframes grow { from { opacity: 0; transform: translateY(14px); } }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; color: var(--ink2); font-weight: 650; }
  .crumbs span + span::before { content: "›"; margin-right: 4px; color: var(--soft); }
  .doc h2 { margin: 8px 0 10px; font-size: clamp(22px, 4.6vw, 30px); letter-spacing: -.03em; line-height: 1.1; }
  .doc p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.6; color: var(--ink); max-width: 56ch; }
  .doc .meta { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 6px 10px; border-radius: 10px; background: var(--pane); font-size: 12.5px; color: var(--ink2); }
  .doc .meta i { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf-on); box-shadow: 0 0 0 3px color-mix(in srgb, var(--leaf-on) 25%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <svg class="fern a" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 95C30 70 45 45 80 10c-6 18-14 30-26 42 10-3 20-2 28 2-14 4-26 6-38 12 8 2 16 6 20 12-14-2-26-2-38 4 4 4 8 8 8 13Z"/></svg>
  <svg class="fern b" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 95C30 70 45 45 80 10c-6 18-14 30-26 42 10-3 20-2 28 2-14 4-26 6-38 12 8 2 16 6 20 12-14-2-26-2-38 4 4 4 8 8 8 13Z"/></svg>
  <section class="card" aria-label="Shop handbook">
    <div class="panes">
      <nav class="side" aria-label="Handbook pages">
        <div class="side-top">
          <b>Shop handbook<small>Gulberg branch · 13 pages</small></b>
          <button class="ib" id="expandAll" type="button" aria-label="Expand all folders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg></button>
          <button class="ib" id="collapseAll" type="button" aria-label="Collapse all folders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 5 5 5-5M7 20l5-5 5 5"/></svg></button>
        </div>
        <label class="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="find" type="search" placeholder="Find a page" aria-label="Find a page" aria-controls="tree" autocomplete="off"></label>
        <div class="treebox" id="treebox">
          <ul role="tree" id="tree" aria-label="Handbook pages"></ul>
          <p class="none" id="none" hidden>No page matches that. Try “care” or “hours”.</p>
        </div>
      </nav>
      <article class="doc" id="doc" aria-live="polite">
        <svg class="art" viewBox="0 0 200 200" aria-hidden="true"><path class="st" d="M196 198C150 160 120 120 112 30"/><path class="st" d="M140 140c-30-6-52-2-70 12M122 92c22-14 46-18 66-12"/><path class="lv" d="M70 152c-6-16 2-30 18-34 4 16-2 30-18 34Z"/><path class="lv" d="M188 80c-8 14-22 20-36 14 8-14 22-20 36-14Z"/><path class="lv" d="M112 30c-12 10-14 26-6 38 12-10 14-26 6-38Z"/><path class="lv" d="M100 150c-16-2-26-14-24-30 16 2 26 14 24 30Z"/><path class="lv" d="M160 120c4-16 18-24 34-20-4 16-18 24-34 20Z"/></svg>
        <div class="body" id="docBody"></div>
      </article>
    </div>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </section>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s) => document.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 30); };

  // ---------- The handbook ----------
  const D = (t, p1, p2, u) => ({ t, p: [p1, p2], u });
  const TREE = [
    { id: "start", name: "Getting started", pc: "#e07a5f", kids: [
      { id: "welcome", name: "Welcome", doc: D("Welcome", "Welcome to the Gulberg branch. This handbook has everything you need for your first month: how we open, how we price and who to ask.", "Start with Opening hours, then read Your first week. If something here is out of date, tell Sana.", "Updated 12 Nov by Sana") },
      { id: "hours", name: "Opening hours", doc: D("Opening hours", "We open at 10:00 and close at 21:00, Monday to Saturday. On Sundays we open at 13:00.", "The first person in switches on the lights, counts the cash drawer and unlocks the fitting room.", "Updated 12 Nov by Sana") },
      { id: "week", name: "Your first week", doc: D("Your first week", "Day one is shadowing on the shop floor. On day two you learn the till, and by Friday you run a shift with a buddy.", "Ask questions. Nobody expects you to remember every fabric name in week one.", "Updated 3 Nov by Usman") }
    ] },
    { id: "products", name: "Products", pc: "#b5739d", kids: [
      { id: "fabrics", name: "Fabrics", pc: "#d9a441", kids: [
        { id: "lawn", name: "Cotton lawn care", doc: D("Cotton lawn care", "Lawn is light and breathable. Wash it cold, inside out, and dry it in the shade so the colours stay bright.", "Tell customers to iron it slightly damp for the crispest finish.", "Updated 18 Nov by Hira") },
        { id: "linen", name: "Linen care", doc: D("Linen care", "Linen softens with every wash. Wash it at 30 degrees and never tumble dry on high heat.", "Creases are part of its charm; a quick steam is enough before wearing.", "Updated 18 Nov by Hira") }
      ] },
      { id: "pricing", name: "Pricing rules", doc: D("Pricing rules", "Prices end in 0 or 50, never 99. Stitching is a flat PKR 1,500 per kurta.", "Discounts above 10% need a manager's okay. Note every discount in the till.", "Updated 9 Nov by Sana") },
      { id: "wrap", name: "Gift wrapping", doc: D("Gift wrapping", "Wrapping is free for orders above PKR 5,000, otherwise PKR 200.", "Use the cream paper and the mustard thread, and tie the knot on the left.", "Updated 1 Nov by Hira") }
    ] },
    { id: "team", name: "Team", pc: "#e0b23a", kids: [
      { id: "rota", name: "Shift rota", doc: D("Shift rota", "The morning shift runs 10:00 to 15:30 and the evening shift 15:30 to 21:00. Post swaps in the team chat by Thursday.", "Usman and Hira lead the weekend shifts this month.", "Updated 16 Nov by Usman") },
      { id: "contacts", name: "Contacts", doc: D("Contacts", "Manager: Sana Malik, extension 101. Stock room: Usman Tariq, extension 104.", "For deliveries call City Riders; the number is on the board by the back door.", "Updated 2 Nov by Sana") }
    ] },
    { id: "policies", name: "Policies", pc: "#6c9bd2", kids: [
      { id: "returns", name: "Returns", doc: D("Returns", "Unworn items can be returned within 14 days with the receipt. Stitched kurtas can be altered for free but not returned.", "Refunds go back the way the customer paid. Cash refunds need a manager.", "Updated 10 Nov by Sana") },
      { id: "delivery", name: "Delivery", doc: D("Delivery", "Delivery is free in Lahore and PKR 250 to other cities. Orders placed before 14:00 leave the same day.", "Express stitching ships in 3 days for PKR 350 extra.", "Updated 10 Nov by Usman") },
      { id: "payments", name: "Payments", doc: D("Payments", "We take cash, cards and bank transfer. There is a card machine at both tills.", "For a bank transfer, wait for the payment SMS before you hand over the order.", "Updated 7 Nov by Sana") }
    ] },
    { id: "changes", name: "What changed", doc: D("What changed", "18 Nov: a new linen care page. 12 Nov: Sunday opening moved to 13:00.", "Older changes are kept in the shared files folder.", "Updated 18 Nov by Hira") }
  ];

  // ---------- Build ----------
  const chev = `<span class="tw" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="m4.5 2.5 3.5 3.5-3.5 3.5"/></svg></span>`;
  const bud = (pc) => `<svg class="bud" viewBox="-12 -12 24 24" aria-hidden="true" style="--pc:${pc}"><path class="stem" d="M0 4v8"/>${[0, 1, 2, 3, 4].map((k) => `<ellipse class="p" rx="3.6" ry="6.2" style="--r:${k * 72}deg;--k:${k}"/>`).join("")}<circle class="c" r="3.3"/></svg>`;
  const leaf = `<svg class="leafi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10.5 10.5 5 19.5 4.5 19 13.5 13.5 19 5 19Z"/><path class="vein" d="M6 18 15 9"/></svg>`;
  const files = (n) => n.kids ? n.kids.reduce((s, k) => s + files(k), 0) : 1;
  const BY = {};
  function build(nodes, level, parent) {
    return nodes.map((n, i) => {
      BY[n.id] = n; n.parent = parent;
      const folder = !!n.kids;
      return `<li role="treeitem" id="ti-${n.id}" data-id="${n.id}" aria-level="${level}" aria-setsize="${nodes.length}" aria-posinset="${i + 1}" ${folder ? 'aria-expanded="false"' : 'aria-selected="false"'} tabindex="-1" style="--i:${i}">
        <span class="lf" aria-hidden="true"></span>
        <div class="row">${folder ? chev : '<span class="tw"></span>'}${folder ? bud(n.pc) : leaf}<span class="nm">${n.name}</span>${folder ? `<span class="ct" aria-hidden="true">${files(n)}</span>` : ""}<i class="glint"></i></div>
        ${folder ? `<div class="kids"><ul role="group">${build(n.kids, level + 1, n)}</ul></div>` : ""}
      </li>`;
    }).join("");
  }
  const tree = $("#tree");
  tree.innerHTML = build(TREE, 1, null);
  const items = $$('[role="treeitem"]', tree);
  const li = (id) => $("#ti-" + id);
  const isFolder = (el) => el.hasAttribute("aria-expanded");
  const isOpen = (el) => el.getAttribute("aria-expanded") === "true";
  const parentOf = (el) => el.parentElement.closest('[role="treeitem"]');
  const ancestors = (el) => { const a = []; let p = parentOf(el); while (p) { a.unshift(p); p = parentOf(p); } return a; };
  const visible = () => items.filter((el) => !el.classList.contains("gone") && ancestors(el).every(isOpen));
  const nameOf = (el) => BY[el.dataset.id].name;

  // ---------- Focus (one tab stop for the whole tree) ----------
  let focused = items[0];
  function focusItem(el, real) {
    if (!el) return;
    items.forEach((x) => { x.tabIndex = x === el ? 0 : -1; });
    focused = el;
    if (real) el.focus();
    // keep the item in view inside the tree box (never scrolls the page itself)
    const box = $("#treebox"), rb = box.getBoundingClientRect(), rr = el.querySelector(".row").getBoundingClientRect();
    if (rr.height && (rr.top < rb.top + 4 || rr.bottom > rb.bottom - 4)) box.scrollTo({ top: Math.max(0, box.scrollTop + rr.top - rb.top - box.clientHeight / 2 + 18), behavior: reduce ? "auto" : "smooth" });
  }

  // ---------- Open and close folders: the bud blooms and pollen drifts up ----------
  function pollen(el) {
    if (reduce) return;
    const card = $(".card"), cr = card.getBoundingClientRect(), b = el.querySelector(".bud").getBoundingClientRect();
    const x = b.left + b.width / 2 - cr.left, y = b.top + b.height / 2 - cr.top;
    for (let k = 0; k < 6; k++) {
      const p = document.createElement("i");
      p.className = "pollen"; card.appendChild(p);
      const dx = (Math.random() - .5) * 40, dy = -24 - Math.random() * 26;
      p.animate([{ transform: `translate(${x}px,${y}px) scale(.4)`, opacity: 0 }, { opacity: 1, offset: .2 }, { transform: `translate(${x + dx}px,${y + dy}px) scale(1)`, opacity: 0 }], { duration: 900 + Math.random() * 500, delay: k * 40, easing: "cubic-bezier(.2,.7,.3,1)", fill: "backwards" }).onfinish = () => p.remove();
    }
  }
  function setOpen(el, open, quiet) {
    if (!el || !isFolder(el) || isOpen(el) === open) return;
    el.setAttribute("aria-expanded", String(open));
    if (open && !quiet) pollen(el);
    if (!quiet) say(`${nameOf(el)} ${open ? "expanded" : "collapsed"}`);
  }

  // ---------- Select a page: sap glows down the branch, the page grows in ----------
  let selected = null;
  function select(el, real) {
    if (!el || isFolder(el)) return;
    ancestors(el).forEach((a) => setOpen(a, true, true));
    items.forEach((x) => { if (!isFolder(x)) x.setAttribute("aria-selected", String(x === el)); });
    selected = el;
    focusItem(el, real);
    const chain = [...ancestors(el), el];
    if (!reduce) chain.forEach((c, k) => {
      setTimeout(() => { c.classList.add("sap"); setTimeout(() => c.classList.remove("sap"), 420); }, k * 110);
    });
    const g = el.querySelector(".glint");
    setTimeout(() => { g.classList.remove("on"); void g.offsetWidth; g.classList.add("on"); }, reduce ? 0 : chain.length * 110);
    render(el);
  }
  function render(el) {
    const n = BY[el.dataset.id], d = n.doc;
    const crumbs = ["Handbook", ...ancestors(el).map(nameOf)];
    const rel = (REL[n.id] || []).map((id) => `<button class="relb" type="button" data-go="${id}">${leaf}<span>${BY[id].name}</span></button>`).join("");
    $("#docBody").innerHTML = `<div class="crumbs">${crumbs.map((c) => `<span>${c}</span>`).join("")}</div><h2>${d.t}</h2><p>${d.p[0]}</p><p>${d.p[1]}</p><span class="meta"><i></i>${d.u}</span><div class="rel"><small>Related pages</small><div>${rel}</div></div>`;
  }

  // related pages: each one opens its branch and selects it in the tree
  const REL = { welcome: ["hours", "week"], hours: ["welcome", "rota"], week: ["rota", "contacts"], lawn: ["linen", "wrap"], linen: ["lawn", "pricing"], pricing: ["returns", "payments"], wrap: ["pricing", "delivery"], rota: ["contacts", "hours"], contacts: ["rota", "delivery"], returns: ["payments", "delivery"], delivery: ["returns", "wrap"], payments: ["returns", "pricing"], changes: ["welcome", "linen"] };
  $("#docBody").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) select(li(b.dataset.go), e.isTrusted); });

  // ---------- Mouse ----------
  tree.addEventListener("click", (e) => {
    const row = e.target.closest(".row"); if (!row) return;
    const el = row.parentElement;
    if (isFolder(el)) { setOpen(el, !isOpen(el)); focusItem(el, e.isTrusted); }
    else select(el, e.isTrusted);
  });

  // ---------- Keyboard (the usual tree keys) ----------
  let typed = "", typedAt = 0;
  tree.addEventListener("keydown", (e) => {
    const el = e.target.closest('[role="treeitem"]'); if (!el) return;
    const vis = visible(), i = vis.indexOf(el);
    let next = null;
    switch (e.key) {
      case "ArrowDown": next = vis[i + 1]; break;
      case "ArrowUp": next = vis[i - 1]; break;
      case "Home": next = vis[0]; break;
      case "End": next = vis[vis.length - 1]; break;
      case "ArrowRight":
        if (isFolder(el)) { if (!isOpen(el)) setOpen(el, true); else next = vis[i + 1]; }
        break;
      case "ArrowLeft":
        if (isFolder(el) && isOpen(el)) setOpen(el, false); else next = parentOf(el);
        break;
      case "Enter": case " ":
        if (isFolder(el)) setOpen(el, !isOpen(el)); else select(el, true);
        break;
      case "*":
        [...el.parentElement.children].forEach((s) => setOpen(s, true));
        break;
      default:
        if (e.key.length === 1 && /\S/.test(e.key) && !e.ctrlKey && !e.metaKey) {
          const now = Date.now(); typed = now - typedAt > 700 ? e.key.toLowerCase() : typed + e.key.toLowerCase(); typedAt = now;
          const order = [...vis.slice(i + 1), ...vis.slice(0, i + 1)];
          next = order.find((x) => nameOf(x).toLowerCase().startsWith(typed)) || null;
          if (!next) return;
        } else return;
    }
    e.preventDefault();
    if (next) focusItem(next, true);
  });
  tree.addEventListener("focusin", (e) => { const el = e.target.closest('[role="treeitem"]'); if (el && el !== focused) focusItem(el, false); });

  // ---------- Expand and collapse everything, in a cascade ----------
  const folders = items.filter(isFolder);
  $("#expandAll").addEventListener("click", () => {
    folders.forEach((f, k) => setTimeout(() => { if (!isOpen(f)) { setOpen(f, true, true); if (k % 2 === 0) pollen(f); } }, reduce ? 0 : k * 70));
    say("All folders expanded");
  });
  $("#collapseAll").addEventListener("click", () => { [...folders].reverse().forEach((f, k) => setTimeout(() => setOpen(f, false, true), reduce ? 0 : k * 50)); say("All folders collapsed"); focusItem(items[0], false); });

  // ---------- Find: shows matches and the branches that lead to them ----------
  const find = $("#find");
  let saved = null;
  function applyFind(q) {
    q = q.trim().toLowerCase();
    items.forEach((el) => { el.querySelector(".nm").textContent = nameOf(el); });
    if (!q) {
      items.forEach((el) => el.classList.remove("gone"));
      if (saved) { saved.forEach(([f, o]) => f.setAttribute("aria-expanded", o)); saved = null; }
      $("#none").hidden = true;
      return;
    }
    if (!saved) saved = folders.map((f) => [f, f.getAttribute("aria-expanded")]);
    const hit = new Set();
    items.forEach((el) => {
      if (!nameOf(el).toLowerCase().includes(q)) return;
      hit.add(el); ancestors(el).forEach((a) => hit.add(a));
      $$('[role="treeitem"]', el).forEach((d) => hit.add(d));
      const nm = el.querySelector(".nm"), name = nameOf(el), at = name.toLowerCase().indexOf(q);
      nm.innerHTML = `${name.slice(0, at)}<mark>${name.slice(at, at + q.length)}</mark>${name.slice(at + q.length)}`;
    });
    items.forEach((el) => el.classList.toggle("gone", !hit.has(el)));
    folders.forEach((f) => { if (hit.has(f)) f.setAttribute("aria-expanded", "true"); });
    $("#none").hidden = hit.size > 0;
    const n = [...hit].filter((x) => !isFolder(x)).length;
    say(n ? `${n} page${n > 1 ? "s" : ""} found` : "No pages found");
  }
  find.addEventListener("input", () => applyFind(find.value));
  find.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); focusItem(visible()[0], true); } if (e.key === "Escape") { find.value = ""; applyFind(""); } });

  // ---------- Start: Getting started blooms open, Welcome is selected ----------
  focusItem(items[0], false);
  select(li("welcome"), false);
  if (!reduce) { li("start").setAttribute("aria-expanded", "false"); setTimeout(() => setOpen(li("start"), true, false), 250); }

  // ---------- Auto demo: grow branches, open pages, search, prune ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  async function typeFind(text) {
    for (const ch of text) { if (!demo) return; find.value += ch; applyFind(find.value); await sleep(120); }
  }
  (async () => {
    await sleep(1400);
    while (demo) {
      setOpen(li("products"), true); await sleep(800); if (!demo) break;
      setOpen(li("fabrics"), true); await sleep(800); if (!demo) break;
      select(li("linen"), false); await sleep(1600); if (!demo) break;
      setOpen(li("team"), true); await sleep(700); if (!demo) break;
      select(li("rota"), false); await sleep(1600); if (!demo) break;
      setOpen(li("products"), false); await sleep(800); if (!demo) break;
      await typeFind("ret"); if (!demo) break; await sleep(700); if (!demo) break;
      select(li("returns"), false); await sleep(1500); if (!demo) break;
      find.value = ""; applyFind(""); await sleep(600); if (!demo) break;
      setOpen(li("team"), false); setOpen(li("policies"), false); setOpen(li("fabrics"), false); await sleep(600); if (!demo) break;
      select(li("hours"), false); await sleep(1500);
    }
  })();
})();
</script>
</body>
</html>
