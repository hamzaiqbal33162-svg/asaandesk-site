<!doctype html>
<!-- Chill & Craft · Slat Drop · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slat Drop · venetian blind mega menu</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: forest green, brass and warm oak ---------- */
  :root {
    color-scheme: light;
    --bg1: #efe9dc;
    --bg2: #ddd3bf;
    --site: #f8f4ea;
    --head: #1f3a2c;
    --head2: #2a4b39;
    --on-head: #f4ecd9;
    --on-head2: #b9c8b5;
    --panel: #fffdf7;
    --line: #e7dfcd;
    --ink: #1f2a22;
    --ink2: #55604f;
    --soft: #8a907f;
    --brass: #c99b49;
    --brass2: #e8c27a;
    --wall: #eadfca;
    --floor: #d9c3a0;
    --wood: #a8703f;
    --wood2: #7d4f2a;
    --slat1: #f1d3a0;
    --slat2: #cf9a60;
    --slat3: #a46c3a;
    --cord: #f7eedb;
    --tile: #f2eadb;
    --focus: #c99b49;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #121a15;
    --bg2: #070a08;
    --site: #141c17;
    --head: #0d1611;
    --head2: #1a2a20;
    --on-head: #efe5cf;
    --on-head2: #93a796;
    --panel: #18221c;
    --line: #26342b;
    --ink: #eee6d3;
    --ink2: #b7bfae;
    --soft: #85917f;
    --brass: #d9ac5a;
    --brass2: #f0cd88;
    --wall: #1d2821;
    --floor: #2a2a20;
    --wood: #8c5c33;
    --wood2: #5f3c1f;
    --slat1: #b98a55;
    --slat2: #8a5b31;
    --slat3: #5e3b1d;
    --cord: #d9c7a2;
    --tile: #1f2b24;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--sans);
    background: radial-gradient(110% 80% at 50% 0%, var(--bg1), var(--bg2));
    overflow-x: hidden;
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 36px 18px; }
  .site { position: relative; width: min(1080px, 100%); border-radius: 22px; background: var(--site); box-shadow: 0 50px 100px -60px rgba(20, 40, 25, .7), 0 0 0 1px var(--line); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, a { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; border-radius: 8px; }

  /* ---------- Header ---------- */
  .head {
    position: relative; z-index: 5;
    display: flex; align-items: center; gap: 22px;
    height: 72px; padding: 0 26px;
    border-radius: 22px 22px 0 0;
    background: linear-gradient(180deg, var(--head2), var(--head));
    color: var(--on-head);
  }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--on-head); text-decoration: none; font: 600 19px/1 var(--serif); white-space: nowrap; }
  .logo svg { width: 30px; height: 30px; }
  .logo .lf { fill: var(--brass); }
  .logo .ls { fill: none; stroke: var(--on-head); stroke-width: 2; stroke-linecap: round; }
  .shop { position: relative; height: 100%; }
  .shop ul { display: flex; height: 100%; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .trig {
    display: flex; align-items: center; gap: 6px;
    height: 100%; padding: 0 14px;
    border: 0; background: none; cursor: pointer;
    color: var(--on-head2);
    font-weight: 600; font-size: 15px;
    transition: color .2s;
  }
  .trig:hover, .trig[aria-expanded="true"] { color: var(--on-head); }
  .trig svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .45s var(--spring); }
  .trig[aria-expanded="true"] svg { transform: rotate(180deg); }
  .marker {
    position: absolute; bottom: 0; left: 0;
    height: 4px; width: 0;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(90deg, var(--brass), var(--brass2), var(--brass));
    box-shadow: 0 -4px 14px -2px var(--brass);
    transition: transform .55s var(--spring), width .55s var(--spring), opacity .3s;
    opacity: 0;
  }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .total { color: var(--on-head2); font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cart {
    position: relative; display: grid; place-items: center;
    width: 42px; height: 42px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: rgba(255, 255, 255, .08); color: var(--on-head);
    transition: transform .35s var(--spring), background .2s;
  }
  .cart:hover { background: rgba(255, 255, 255, .15); }
  .cart svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .cart.bump { animation: bump .6s var(--spring); }
  @keyframes bump { 25% { transform: scale(.82) rotate(-8deg); } 60% { transform: scale(1.14) rotate(5deg); } }
  .badge {
    position: absolute; top: -5px; right: -5px;
    min-width: 20px; height: 20px; padding: 0 5px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: var(--brass); color: #1f1a10;
    font: 750 11px/1 var(--sans);
    box-shadow: 0 0 0 2px var(--head);
    transform: scale(0);
    transition: transform .45s var(--spring);
  }
  .badge.on { transform: scale(1); }

  /* ---------- Hero behind the menu ---------- */
  .hero { display: grid; grid-template-columns: 1fr 1.05fr; align-items: center; gap: 22px; min-height: 470px; padding: 40px 48px 44px; }
  .kicker { margin: 0; color: var(--wood); font: 700 12px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
  .hero h1 { margin: 16px 0 14px; font: 500 clamp(32px, 4.6vw, 54px)/1.05 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
  .hero p { max-width: 40ch; margin: 0; color: var(--ink2); font-size: 16px; line-height: 1.6; }
  .go {
    margin-top: 24px; padding: 13px 22px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: var(--head); color: var(--on-head);
    font-weight: 650; font-size: 14.5px;
    transition: transform .35s var(--spring);
  }
  .go:hover { transform: translateY(-2px); }
  .room { width: 100%; height: auto; display: block; }
  .wallc { fill: var(--wall); }
  .floorc { fill: var(--floor); }
  .glass { fill: url(#sky); }
  .frame { fill: none; stroke: var(--wood2); stroke-width: 6; }
  .beam { fill: var(--brass2); opacity: .22; animation: beam 6s ease-in-out infinite; }
  @keyframes beam { 50% { opacity: .32; } }
  .rug { fill: var(--brass); opacity: .35; }
  .pot { fill: var(--wood); }
  .leaf { fill: #5d8a58; transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite; }
  .leaf:nth-child(2n) { animation-delay: -2.5s; fill: #4b7748; }
  @keyframes sway { 50% { transform: rotate(4deg); } }
  .lampc { fill: none; stroke: var(--wood2); stroke-width: 4; stroke-linecap: round; }
  .shade { fill: var(--brass); }
  .glow { fill: var(--brass2); opacity: .25; animation: beam 4s ease-in-out infinite; }
  .mote { fill: var(--brass2); animation: mote 7s linear infinite; }
  @keyframes mote { from { transform: translate(0, 0); opacity: 0; } 20% { opacity: .8; } to { transform: translate(18px, -90px); opacity: 0; } }
  .k1 { stop-color: #cfe4f2; } .k2 { stop-color: #fbe9c6; }
  :root[data-theme="dark"] .k1 { stop-color: #1b2c4a; }
  :root[data-theme="dark"] .k2 { stop-color: #3b3554; }

  /* furniture drawn as SVG symbols; --fab is the fabric colour */
  .fab { fill: var(--fab, #6f8f5e); }
  .fab.dk { fill: color-mix(in srgb, var(--fab, #6f8f5e) 76%, #000); }
  .fab.lt { fill: color-mix(in srgb, var(--fab, #6f8f5e) 84%, #fff); }
  .wd { fill: var(--wood); }
  .wd.dk { fill: var(--wood2); }
  .lin { fill: #f6efe2; }
  .shd { fill: #000; opacity: .12; }
  .cane { fill: none; stroke: var(--wood); stroke-width: 5; stroke-linecap: round; }
  .stripe { fill: none; stroke: #fff; stroke-opacity: .55; stroke-width: 4; }

  /* ---------- The mega menu ---------- */
  .mega {
    --drop: 0;
    position: absolute; left: 0; right: 0; top: 72px; z-index: 4;
    clip-path: inset(0 -40px calc((1 - var(--drop)) * 100%) -40px);
    border-radius: 0 0 22px 22px;
  }
  .mega.full { clip-path: none; }
  .mega[hidden] { display: none; }
  .sheet {
    position: relative;
    display: grid; grid-template-columns: repeat(3, 1fr) 1.35fr; gap: 26px;
    padding: 28px 30px 30px;
    border-radius: 0 0 22px 22px;
    background: var(--panel);
    box-shadow: 0 40px 60px -40px rgba(0, 0, 0, .45), 0 1px 0 var(--line) inset;
    overflow: hidden;
  }
  .sheet::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 42%, rgba(255, 240, 205, .2) 50%, transparent 58%);
    transform: translateX(-100%);
  }
  .sheet.sweep::after { animation: sweep 1.1s ease-out; }
  @keyframes sweep { to { transform: translateX(100%); } }
  .col h2 { margin: 0 0 12px; color: var(--soft); font: 700 11.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
  .col ul { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .col a {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; margin: 0 -10px;
    border-radius: 9px;
    color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 520;
    transition: background .2s, padding .35s var(--spring);
  }
  .col a .n { margin-left: auto; color: var(--soft); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .col a .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brass); transform: scale(0); transition: transform .35s var(--spring); }
  .col a:hover, .col a:focus-visible, .col a.hl { background: var(--tile); padding-left: 14px; }
  .col a:hover .dot, .col a:focus-visible .dot, .col a.hl .dot { transform: scale(1); }
  /* rows rise in as the slats open over them */
  .row { opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .5s var(--spring); transition-delay: calc(var(--r) * 34ms + 80ms); }
  .mega.show .row { opacity: 1; transform: none; }

  .feat { display: grid; grid-template-rows: auto auto; gap: 12px; padding: 14px; border-radius: 16px; background: var(--tile); }
  .pic { position: relative; border-radius: 12px; background: radial-gradient(90% 90% at 50% 100%, color-mix(in srgb, var(--fab) 22%, var(--panel)), var(--panel)); overflow: hidden; transition: background .5s; }
  .pic svg { display: block; width: 100%; height: auto; }
  .pic .it { transform-origin: 50% 100%; }
  .pic .it.land { animation: land .7s var(--spring); }
  @keyframes land { 0% { transform: translateY(-14px) scale(.96); opacity: .3; } 60% { transform: translateY(2px) scale(1.01, .98); opacity: 1; } }
  .fname { margin: 0; font: 600 18px/1.2 var(--serif); }
  .fline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .price { font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; }
  .note { margin: 2px 0 0; color: var(--soft); font-size: 12.5px; }
  .sw { display: flex; gap: 7px; }
  .sw button {
    width: 24px; height: 24px; padding: 0;
    border: 2px solid var(--panel); border-radius: 50%; cursor: pointer;
    background: var(--c);
    box-shadow: 0 0 0 1.5px var(--line);
    transition: transform .35s var(--spring), box-shadow .2s;
  }
  .sw button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--ink); transform: scale(1.12); }
  .add {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 14px;
    border: 0; border-radius: 11px; cursor: pointer;
    background: var(--head); color: var(--on-head);
    font-weight: 650; font-size: 14px;
    transition: transform .35s var(--spring);
  }
  .add:active { transform: scale(.95); }
  .add svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

  /* the blind: a head rail, wooden slats on ladder cords and a weighted bottom rail */
  .blind { position: absolute; inset: 0; z-index: 3; perspective: 900px; pointer-events: none; border-radius: 0 0 22px 22px; overflow: hidden; transition: opacity .28s; }
  .blind.gone { opacity: 0; }
  .slat {
    position: absolute; left: 0; right: 0;
    top: calc(var(--i) * 100% / var(--n));
    height: calc(100% / var(--n) + 1.5px);
    background:
      repeating-linear-gradient(178.6deg, rgba(60, 30, 5, .08) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(181.2deg, rgba(255, 240, 210, .09) 0 1px, transparent 1px 8px),
      linear-gradient(180deg, var(--slat1), var(--slat2) 55%, var(--slat3));
    box-shadow: 0 2px 3px -1px rgba(40, 20, 5, .35);
    transform-origin: 50% 50%;
    transition: transform .55s cubic-bezier(.3, 1.45, .5, 1);
    transition-delay: calc(var(--i) * 40ms);
  }
  .blind.open .slat { transform: rotateX(-86deg); }
  .blind.rev .slat { transition-duration: .32s; transition-timing-function: cubic-bezier(.5, 0, .7, .4); transition-delay: calc((var(--n) - 1 - var(--i)) * 28ms); }
  .blind.snap .slat { transition: none; }
  .cordl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--cord); opacity: .8; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1); }
  .rail { position: absolute; left: 0; right: 0; top: 0; height: 9px; background: linear-gradient(180deg, var(--brass2), var(--brass)); }
  .hem {
    position: absolute; left: -6px; right: -6px; z-index: 6;
    top: calc(var(--drop) * 100% - 12px);
    height: 12px; border-radius: 6px;
    background: linear-gradient(180deg, var(--slat2), var(--slat3));
    box-shadow: 0 6px 12px -4px rgba(0, 0, 0, .45);
    pointer-events: none;
    transition: opacity .25s;
  }
  .hem::after { content: ""; position: absolute; left: 50%; top: 10px; width: 3px; height: 16px; margin-left: -1.5px; border-radius: 2px; background: var(--brass); box-shadow: 0 14px 0 2px var(--brass); }
  .hem.gone { opacity: 0; }

  .fly { position: fixed; z-index: 20; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--c); box-shadow: 0 6px 14px -4px rgba(0, 0, 0, .5), inset 0 0 0 3px rgba(255, 255, 255, .45); pointer-events: none; }
  .toast {
    position: absolute; left: 50%; bottom: 18px; z-index: 6;
    padding: 10px 16px; border-radius: 999px;
    background: var(--head); color: var(--on-head);
    font-size: 13.5px; white-space: nowrap;
    transform: translate(-50%, 30px); opacity: 0;
    transition: transform .5s var(--spring), opacity .3s;
    pointer-events: none;
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }

  /* ---------- Phones and narrow frames ---------- */
  @media (max-width: 760px) {
    .stage { padding: 16px 10px; }
    .head { flex-wrap: wrap; height: auto; padding: 12px 14px 0; gap: 4px 10px; }
    .logo { flex: 1; font-size: 17px; }
    .total { display: none; }
    .shop { order: 3; width: 100%; height: 46px; }
    .shop ul { justify-content: space-between; }
    .trig { padding: 0 6px; font-size: 14px; }
    .trig svg { display: none; }
    .mega { top: 104px; }
    .sheet { grid-template-columns: 1fr 1fr; gap: 16px 18px; padding: 16px 16px 20px; }
    .col:nth-child(3) { display: none; }
    .feat { grid-column: 1 / -1; grid-row: 1; grid-template-columns: 128px 1fr; grid-template-rows: auto; align-items: center; padding: 10px; }
    .fname { font-size: 16px; }
    .col a { padding: 6px 10px; font-size: 14px; }
    .hero { grid-template-columns: 1fr; min-height: 560px; padding: 26px 20px 26px; gap: 8px; align-content: start; }
    .hero h1 { font-size: 31px; }
    .hero p { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>

<main class="stage">
  <div class="site" id="site">
    <header class="head" id="head">
      <a class="logo" href="#" aria-label="Larch and Loom, home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path class="lf" d="M16 3c6 6 7 13 0 22-7-9-6-16 0-22z"/><path class="ls" d="M16 9v20M16 15l-4-3M16 20l4-3"/></svg>
        <span>Larch &amp; Loom</span>
      </a>
      <nav class="shop" aria-label="Shop">
        <ul id="trigs"></ul>
        <span class="marker" id="marker" aria-hidden="true"></span>
      </nav>
      <div class="tools">
        <span class="total" id="total" aria-hidden="true">PKR 0</span>
        <button class="cart" id="cart" type="button" aria-label="Cart, empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
          <span class="badge" id="badge">0</span>
        </button>
      </div>
    </header>

    <div class="mega" id="mega" role="region" aria-label="Menu" hidden>
      <div class="sheet" id="sheet"></div>
      <div class="blind" id="blind" aria-hidden="true"></div>
      <div class="hem" id="hem" aria-hidden="true"></div>
    </div>

    <section class="hero" aria-labelledby="hh">
      <div>
        <p class="kicker">Winter edit 2026</p>
        <h1 id="hh">Rooms that feel like a slow Sunday morning.</h1>
        <p>Solid sheesham, washed linen and hand-woven cane, made in Chiniot and delivered free in Lahore, Karachi and Islamabad.</p>
        <button class="go" type="button" id="shopEdit">Shop the edit</button>
      </div>
      <svg class="room" viewBox="0 0 420 320" aria-hidden="true">
        <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="k1"/><stop offset="1" class="k2"/></linearGradient></defs>
        <rect class="wallc" x="0" y="0" width="420" height="250" rx="18"/>
        <rect class="floorc" x="0" y="246" width="420" height="74" rx="10"/>
        <path class="glass" d="M150 196V86a60 60 0 0 1 120 0v110z"/>
        <path class="frame" d="M150 196V86a60 60 0 0 1 120 0v110zM210 26v170M150 130h120"/>
        <path class="beam" d="M150 196h120l60 100H110z"/>
        <ellipse class="rug" cx="215" cy="290" rx="150" ry="18"/>
        <circle class="mote" cx="200" cy="230" r="1.6"/><circle class="mote" cx="240" cy="250" r="1.2" style="animation-delay:-2.5s"/><circle class="mote" cx="180" cy="260" r="1.4" style="animation-delay:-5s"/>
        <path class="lampc" d="M372 290V120q0-30-40-30"/>
        <circle class="glow" cx="330" cy="120" r="34"/>
        <path class="shade" d="M312 94h38l-8 22h-22z"/>
        <g transform="translate(36 160)"><g><path class="leaf" d="M20 70C4 50 2 26 10 8c10 18 14 40 10 62z"/><path class="leaf" d="M24 72c-4-26 4-50 22-62 2 24-6 46-22 62z"/><path class="leaf" d="M18 74C8 64-4 56-12 40c16 2 28 14 30 34z"/></g><path class="pot" d="M2 72h40l-6 46H8z"/></g>
        <use href="#sofa" x="96" y="168" width="250" height="150" id="heroSofa" style="--fab:#6f8f5e"/>
      </svg>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pkr = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  let run = 0; // sequence token: a newer open/close stops older ones

  // ---------- Menu data ----------
  const MENUS = [
    { name: "Living", cols: [
        ["Shop by piece", [["Sofas", 24], ["Armchairs", 18], ["Coffee tables", 15], ["Bookshelves", 11], ["Rugs", 32]]],
        ["Shop by room", [["Small flats", 40], ["Family lounges", 36], ["Reading corners", 12], ["Guest rooms", 19]]],
        ["Materials", [["Sheesham wood", 58], ["Walnut", 21], ["Cane and rattan", 17], ["Washed linen", 26]]]],
      feat: { art: "sofa", name: "Haveli three-seater", price: 148500, note: "Solid sheesham frame, linen cover", sw: [["Olive", "#6f8f5e"], ["Clay", "#c4694a"], ["Ink blue", "#3c5a86"]] } },
    { name: "Bedroom", cols: [
        ["Shop by piece", [["Beds", 16], ["Side tables", 22], ["Wardrobes", 9], ["Dressers", 7], ["Bedding", 44]]],
        ["Shop by size", [["Single", 6], ["Double", 10], ["King", 8], ["Kids rooms", 14]]],
        ["Comfort", [["Mattresses", 12], ["Pillows", 30], ["Quilts for winter", 18], ["Blackout curtains", 15]]]],
      feat: { art: "bed", name: "Chinar king bed", price: 212000, note: "Walnut finish, slatted base included", sw: [["Oat", "#cdb48c"], ["Sage", "#8fa785"], ["Rose", "#cf8f86"]] } },
    { name: "Dining", cols: [
        ["Shop by piece", [["Dining sets", 13], ["Chairs", 27], ["Sideboards", 8], ["Bar stools", 10], ["Tableware", 52]]],
        ["Seats", [["Four seats", 7], ["Six seats", 9], ["Eight seats", 4], ["Benches", 6]]],
        ["Finishes", [["Natural oil", 20], ["Dark walnut", 14], ["Painted", 9], ["Marble tops", 5]]]],
      feat: { art: "dine", name: "Six-seat dining set", price: 186000, note: "Sheesham table, cushioned chairs", sw: [["Mustard", "#d39d34"], ["Teal", "#2f7f7a"], ["Plum", "#7d4a6c"]] } },
    { name: "Outdoor", cols: [
        ["Shop by piece", [["Loungers", 9], ["Garden sets", 11], ["Parasols", 8], ["Planters", 25], ["Lanterns", 19]]],
        ["Spaces", [["Balconies", 21], ["Rooftops", 15], ["Lawns", 12], ["Verandas", 10]]],
        ["Made for weather", [["Sun-safe fabric", 18], ["Teak", 7], ["All-weather cane", 13], ["Covers", 9]]]],
      feat: { art: "patio", name: "Cane lounger and parasol", price: 64900, note: "All-weather cane, washable cushion", sw: [["Coral", "#e0694b"], ["Sea", "#3a8bb0"], ["Lime", "#8aac38"]] } },
  ];

  const trigs = $("trigs"), marker = $("marker"), mega = $("mega"), sheet = $("sheet"), blind = $("blind"), hem = $("hem"), head = $("head");
  const live = $("live"), toast = $("toast");
  const say = (t) => { live.textContent = t; };
  const N = 9; // slats

  // ---------- Build the triggers and the blind ----------
  MENUS.forEach((m, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button class="trig" type="button" aria-expanded="false" aria-controls="mega">${m.name}<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>`;
    trigs.appendChild(li);
  });
  const tb = [...trigs.querySelectorAll(".trig")];
  blind.style.setProperty("--n", N);
  blind.innerHTML = Array.from({ length: N }, (_, i) => `<i class="slat" style="--i:${i}"></i>`).join("") +
    `<i class="cordl" style="left:14%"></i><i class="cordl" style="right:14%"></i><i class="rail"></i>`;

  // ---------- Panel content ----------
  const pick = MENUS.map(() => 0); // chosen swatch per menu
  function render(i) {
    const m = MENUS[i], f = m.feat, c = f.sw[pick[i]][1];
    let r = 0;
    sheet.innerHTML = m.cols.map(([h, links]) =>
      `<div class="col"><h2 class="row" style="--r:${r++}">${h}</h2><ul>` +
      links.map(([t, n]) => `<li class="row" style="--r:${r++}"><a href="#${t.toLowerCase().replace(/[^a-z]+/g, "-")}"><span class="dot"></span>${t}<span class="n">${n}</span></a></li>`).join("") +
      `</ul></div>`).join("") +
      `<div class="feat row" style="--r:2;--fab:${c}">
        <div class="pic"><svg viewBox="0 0 200 124" aria-hidden="true"><g class="it land"><use href="#${f.art}" x="8" y="6" width="184" height="112"/></g></svg></div>
        <div>
          <p class="fname">${f.name}</p>
          <p class="note">${f.note}</p>
          <div class="fline" style="margin-top:10px">
            <span class="price">${pkr(f.price)}</span>
            <div class="sw" role="radiogroup" aria-label="Colour">${f.sw.map(([n, col], k) => `<button type="button" role="radio" aria-checked="${k === pick[i]}" aria-label="${n}" style="--c:${col}"></button>`).join("")}</div>
          </div>
          <button class="add" type="button" style="margin-top:12px;width:100%"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add to cart</button>
        </div>
      </div>`;
    mega.setAttribute("aria-label", m.name + " menu");
    // wire the panel
    sheet.querySelectorAll(".col a").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      note(`Opening ${a.firstChild.nextSibling.textContent.trim()} · ${a.querySelector(".n").textContent} pieces`);
    }));
    const sws = [...sheet.querySelectorAll(".sw button")];
    sws.forEach((b, k) => b.addEventListener("click", () => choose(i, k)));
    sheet.querySelector(".sw").addEventListener("keydown", (e) => {
      const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!d) return;
      e.preventDefault();
      const k = (pick[i] + d + sws.length) % sws.length;
      choose(i, k); sheet.querySelectorAll(".sw button")[k].focus();
    });
    sheet.querySelector(".add").addEventListener("click", () => addToCart(i));
  }
  function choose(i, k) {
    pick[i] = k;
    const f = MENUS[i].feat, c = f.sw[k][1];
    sheet.querySelector(".feat").style.setProperty("--fab", c);
    sheet.querySelectorAll(".sw button").forEach((b, j) => b.setAttribute("aria-checked", j === k));
    const it = sheet.querySelector(".it");
    it.classList.remove("land"); void it.getBoundingClientRect(); it.classList.add("land");
    if (MENUS[i].feat.art === "sofa") $("heroSofa").style.setProperty("--fab", c);
    say(`${f.name} in ${f.sw[k][0]}`);
  }
  let noteT = 0;
  function note(t) {
    toast.textContent = t; toast.classList.add("on");
    clearTimeout(noteT); noteT = setTimeout(() => toast.classList.remove("on"), 2000);
  }

  // ---------- Cart: a fabric swatch flies into the bag, the badge and total count up ----------
  let count = 0, total = 0;
  const cart = $("cart"), badge = $("badge"), totalEl = $("total");
  function addToCart(i) {
    const f = MENUS[i].feat, colour = f.sw[pick[i]];
    const from = sheet.querySelector(".pic").getBoundingClientRect(), to = cart.getBoundingClientRect();
    const done = () => {
      count++;
      const was = total; total += f.price;
      badge.textContent = count; badge.classList.add("on");
      cart.classList.remove("bump"); void cart.offsetWidth; cart.classList.add("bump");
      cart.setAttribute("aria-label", `Cart, ${count} item${count > 1 ? "s" : ""}, ${pkr(total)}`);
      const t0 = performance.now();
      const tick = (now) => {
        const p = Math.max(0, Math.min(1, (now - t0) / 600));
        totalEl.textContent = pkr(was + (total - was) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      say(`Added ${f.name} in ${colour[0]}. Cart: ${count} item${count > 1 ? "s" : ""}, ${pkr(total)}`);
    };
    if (reduce) return done();
    const fly = document.createElement("div");
    fly.className = "fly"; fly.style.setProperty("--c", colour[1]);
    document.body.appendChild(fly);
    const x0 = from.left + from.width / 2, y0 = from.top + from.height / 2, x1 = to.left + to.width / 2, y1 = to.top + to.height / 2;
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.max(0, Math.min(1, (now - t0) / 720)), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e - Math.sin(p * Math.PI) * 120;
      fly.style.transform = `translate(${x}px, ${y}px) scale(${1.3 - p * .6})`;
      fly.style.left = "0px"; fly.style.top = "0px";
      if (p < 1) requestAnimationFrame(step); else { fly.remove(); done(); }
    };
    requestAnimationFrame(step);
  }

  // ---------- Marker under the open trigger ----------
  function placeMarker(i) {
    if (i < 0) { marker.style.opacity = 0; marker.style.width = "0px"; return; }
    const n = marker.parentElement.getBoundingClientRect(), r = tb[i].getBoundingClientRect();
    marker.style.opacity = 1;
    marker.style.width = r.width - 16 + "px";
    marker.style.transform = `translateX(${r.left - n.left + 8}px)`;
  }

  // ---------- The blind drop: a damped spring on --drop (0 = rolled up, 1 = down) ----------
  let drop = 0;
  const setDrop = () => mega.style.setProperty("--drop", drop.toFixed(4));
  function springTo(target, k, c, token) {
    return new Promise((res) => {
      let v = 0, last = performance.now();
      const f = (now) => {
        if (token !== run) return res(false);
        const dt = Math.min(32, now - last) / 1000; last = now;
        v += (k * (target - drop) - c * v) * dt;
        drop += v * dt;
        if (Math.abs(target - drop) < .003 && Math.abs(v) < .02) { drop = target; setDrop(); return res(true); }
        setDrop(); requestAnimationFrame(f);
      };
      requestAnimationFrame(f);
    });
  }

  let open = -1;
  function setTrig(i) {
    tb.forEach((b, k) => b.setAttribute("aria-expanded", k === i));
    placeMarker(i);
  }
  // Open menu i: lower the closed blind with a bounce, tilt the slats open top to bottom, then fade the blind away.
  // If another menu is open, the slats close bottom-up, the content changes behind them, and they open again.
  async function openMenu(i) {
    if (i === open) return;
    const token = ++run, was = open;
    open = i;
    setTrig(i);
    say(`${MENUS[i].name} menu open`);
    if (reduce) {
      render(i); mega.hidden = false; drop = 1; setDrop();
      blind.classList.add("gone"); hem.classList.add("gone"); mega.classList.add("show", "full");
      return true;
    }
    if (was >= 0 && !mega.hidden) {
      blind.classList.remove("gone"); hem.classList.remove("gone");
      blind.classList.add("rev"); blind.classList.remove("open");
      await sleep(N * 28 + 300);
      if (token !== run) return false;
      mega.classList.remove("show");
      render(i);
      await sleep(30);
      if (token !== run) return false;
      blind.classList.remove("rev");
      void blind.offsetWidth;
    } else {
      render(i);
      mega.hidden = false;
      mega.classList.remove("show", "full");
      blind.classList.add("snap"); blind.classList.remove("open", "rev", "gone"); hem.classList.remove("gone");
      void blind.offsetWidth; blind.classList.remove("snap");
    }
    // the blind may still be part way up (a close was interrupted): bring it down with a bounce
    if (drop < .999) {
      mega.classList.remove("full");
      if (!(await springTo(1, 230, 15, token))) return false;
    }
    mega.classList.add("full");
    blind.classList.add("open");
    mega.classList.add("show");
    await sleep(N * 40 + 420);
    if (token !== run) return false;
    blind.classList.add("gone"); hem.classList.add("gone");
    sheet.classList.remove("sweep"); void sheet.offsetWidth; sheet.classList.add("sweep");
    return true;
  }
  // Close: the slats tilt shut bottom-up, then the blind rolls up and is gone.
  async function closeMenu() {
    if (open < 0) return;
    const token = ++run;
    open = -1;
    setTrig(-1);
    say("Menu closed");
    if (reduce) { mega.hidden = true; mega.classList.remove("show", "full"); drop = 0; setDrop(); return; }
    blind.classList.remove("gone"); hem.classList.remove("gone");
    blind.classList.add("rev"); blind.classList.remove("open");
    mega.classList.remove("show");
    await sleep(N * 28 + 260);
    if (token !== run) return;
    mega.classList.remove("full");
    if (!(await springTo(0, 260, 30, token))) return;
    mega.hidden = true;
  }

  // ---------- Input ----------
  tb.forEach((b, i) => {
    b.addEventListener("click", () => (open === i ? closeMenu() : openMenu(i)));
    b.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        const n = (i + (e.key === "ArrowRight" ? 1 : -1) + tb.length) % tb.length;
        tb[n].focus();
        if (open >= 0) openMenu(n);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        const first = () => { const a = sheet.querySelector(".col a"); if (a) a.focus(); };
        if (open !== i) openMenu(i).then(first); else first();
      }
    });
  });
  // hover intent on devices with a mouse
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let hoverT = 0, leaveT = 0;
  if (fine) {
    tb.forEach((b, i) => b.addEventListener("pointerenter", (e) => {
      if (e.isTrusted) demo = false;
      clearTimeout(leaveT); clearTimeout(hoverT);
      hoverT = setTimeout(() => openMenu(i), open >= 0 ? 60 : 140);
    }));
    [head, mega].forEach((el) => {
      el.addEventListener("pointerleave", () => { clearTimeout(hoverT); leaveT = setTimeout(closeMenu, 320); });
      el.addEventListener("pointerenter", () => clearTimeout(leaveT));
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && open >= 0) { const t = tb[open]; closeMenu(); t.focus(); }
  });
  document.addEventListener("pointerdown", (e) => {
    if (open >= 0 && !head.contains(e.target) && !mega.contains(e.target)) closeMenu();
  });
  $("shopEdit").addEventListener("click", () => openMenu(0));
  cart.addEventListener("click", () => note(count ? `${count} item${count > 1 ? "s" : ""} in your cart · ${pkr(total)}` : "Your cart is empty"));
  addEventListener("resize", () => placeMarker(open));

  // ---------- Auto demo: open menus, try a colour, add to cart, until someone takes over ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  const hoverLink = async (k) => {
    const links = sheet.querySelectorAll(".col a");
    links.forEach((a) => a.classList.remove("hl"));
    if (links[k]) links[k].classList.add("hl");
  };
  (async () => {
    let m = 0;
    await sleep(380);
    while (demo) {
      if (!(await openMenu(m))) break;
      for (const k of [0, 1, 2]) { await sleep(420); if (!demo) return; hoverLink(k); }
      await sleep(420); if (!demo) return;
      choose(m, (pick[m] + 1) % 3);
      await sleep(700); if (!demo) return;
      addToCart(m);
      await sleep(1300); if (!demo) return;
      hoverLink(-1);
      if (!(await openMenu((m + 1) % MENUS.length))) break;
      await sleep(1500); if (!demo) return;
      await closeMenu();
      await sleep(1600);
      m = (m + 2) % MENUS.length;
    }
  })();
})();
</script>
</body>
</html>
