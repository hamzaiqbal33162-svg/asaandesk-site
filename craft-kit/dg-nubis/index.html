<!doctype html>
<!-- Chill & Craft · Nubis · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nubis · Weather dashboard</title>
<style>
/* ---------- Nubis look: night slate and sky blue with an amber sun ---------- */
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--bg:#e8f1f9;--bg2:#dbe8f4;--panel:#ffffff;--panel-solid:#ffffff;--field:#f2f7fc;--text:#0e2238;--muted:#5a6f86;--line:#d3e1ee;--grid:#e3edf6;--accent:#0284c7;--accent-ink:#fff;--sun:#f59e0b;--focus:#0284c7;
--good:#16a34a;--warn:#d97706;--bad:#dc2626;--c1:#0284c7;--c2:#f59e0b;--c3:#0d9488;--c4:#7c3aed;--c5:#db2777;--c6:#64748b;
--r:18px;--rb:12px;--tip-bg:#0e2238;--hover:rgba(2,132,199,.08);--land:#cfe0cf;--land2:#b8cfb7;--sea:#bcd9ef;--mount:#a9bfa8;--river:#7fb3dc;--cityc:#0e2238;--hero1:#5fb3f0;--hero2:#9fd3f7;--enter-anim:nb-rise}
[data-theme=dark]{--bg:#0a1322;--bg2:#0e1a2e;--panel:#111f36;--panel-solid:#111f36;--field:#0d1a2e;--text:#e6eefb;--muted:#8ba2c2;--line:#1f3352;--grid:#16284a;--accent:#38bdf8;--accent-ink:#04121f;--sun:#fbbf24;--focus:#7dd3fc;
--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--c1:#38bdf8;--c2:#fbbf24;--c3:#2dd4bf;--c4:#a78bfa;--c5:#f472b6;--c6:#94a3b8;--tip-bg:#02060d;--hover:rgba(56,189,248,.08);--land:#152a3f;--land2:#1c3550;--sea:#0a1830;--mount:#203a55;--river:#1f5a8a;--cityc:#e6eefb;--hero1:#0f2a4d;--hero2:#1b3f6e}
/* ---------- Core UI: shared structure. Each app sets its own look with the variables above. ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.55em .95em;border-radius:var(--rb,var(--r));font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .12s,background-color .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active,.ibtn:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.35em .7em;font-size:.78rem}
.btn .ic{width:16px;height:16px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,var(--r));border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s,border-color .2s,background-color .2s;position:relative;flex:none}
.ibtn:hover{border-color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:15px;height:15px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--panel)}
.badge[hidden]{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:.18em .62em;border-radius:99px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h,200) 55% 48%);color:#fff;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
/* staggered page entrance */
.enter{animation:var(--enter-anim,c-rise) .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes c-rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes c-fade{from{opacity:0}}
@keyframes c-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes c-land{0%{transform:scale(1.06)}100%{transform:none}}
.landed{animation:c-land .35s cubic-bezier(.2,.8,.2,1)}
/* tooltip */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;left:0;top:0}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{width:8px;height:8px;border-radius:2px;background:var(--sw)}
.tip .tr span{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
/* modal, drawer, command search */
.ovl{position:fixed;inset:0;z-index:60;background:var(--scrim,rgba(8,10,16,.52));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s}
.ovl.on{opacity:1}
.modal,.drawer,.cmdk{background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal{border-radius:calc(var(--r) + 4px);width:min(540px,100%);max-height:calc(100dvh - 32px);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(780px,100%)}
.modal.small{width:min(420px,100%)}
.ovl.on .modal,.ovl.on .cmdk{transform:none}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;border-width:0 0 0 1px;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ovl.on .drawer{transform:none}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:1.05rem}
.l-body{padding:18px;overflow:auto;flex:1;min-height:0}
.l-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf-msg{color:var(--muted)}
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);border-radius:calc(var(--r) + 4px);transform:translateY(-10px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.cmdk .l-head{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.cmdk .l-body{padding:0}
.ck-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:calc(var(--r) - 2px);text-align:left}
.cmdk li small{color:var(--muted)}
.cmdk li[aria-selected=true] button{background:var(--hover,color-mix(in srgb,var(--accent) 14%,transparent))}
.cmdk .empty{padding:20px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field,var(--bg));border-radius:var(--rb,var(--r));padding:.6em .7em;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.fld textarea{resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:c-shake .3s}
.fld .err{color:var(--bad);font-size:.74rem;font-weight:600}
.fld .err:empty{display:none}
@keyframes c-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent)}
/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar-x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar-x:empty{display:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:0 .65em;background:var(--field,var(--bg));flex:1 1 180px;max-width:300px;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:.55em 0;outline:none;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.32em .8em;font-size:.78rem;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip em{font-style:normal;opacity:.7;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th>button,.tbl th>.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%}
.tbl th>.th{cursor:default}
.tbl th>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th.n>button,.tbl th.n>.th{justify-content:flex-end}
.tbl .si{width:0;height:0;border:4px solid transparent;opacity:.25;border-top-color:currentColor;margin-top:4px}
.tbl th[aria-sort=ascending] .si{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px;opacity:1}
.tbl th[aria-sort=descending] .si{opacity:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl tbody tr[data-id]{cursor:pointer;transition:background-color .15s}
.tbl tbody tr[data-id]:hover{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-u{display:flex;align-items:center;gap:9px}
.cell-u small{display:block;color:var(--muted);font-size:.74rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pager .pg-btns{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:600}
/* popovers: bell and menus */
.pop{position:fixed;z-index:75;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);min-width:190px;max-width:min(350px,calc(100vw - 24px));padding:6px;animation:c-pop .18s ease both}
.pop .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r) - 2px);gap:8px;align-items:center;font-size:.86rem}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 12%,transparent));outline:none}
.bell-pop{width:340px;padding:0}
.bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-l{max-height:340px;overflow:auto;padding:6px}
.bell-i{display:flex;gap:10px;padding:9px 8px;border-radius:calc(var(--r) - 2px);font-size:.84rem}
.bell-i small{display:block;color:var(--muted);font-size:.74rem}
.bell-i.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-i .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.bell-i .dot.warn{background:var(--warn)}.bell-i .dot.bad{background:var(--bad)}.bell-i .dot.ok{background:var(--good)}
/* toasts */
.toasts{position:fixed;z-index:98;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--tip-bg,#16181d);color:var(--tip-ink,#fff);padding:11px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:c-toast .38s cubic-bezier(.2,.8,.2,1) both;font-size:.86rem;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(16px)}
.toast>i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.toast.warn>i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.toast.bad>i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.toast .btn{margin-left:auto;color:inherit;border-color:rgba(255,255,255,.3);background:transparent}
@keyframes c-toast{from{opacity:0;transform:translateY(14px) scale(.96)}}
/* segmented range switch */
.segc{display:inline-flex;position:relative;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:3px;background:var(--field,var(--bg));flex:none}
.segc button{position:relative;z-index:1;border:0;background:transparent;padding:.32em .75em;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:calc(var(--rb,var(--r)) - 2px);transition:color .25s}
.segc button[aria-pressed=true]{color:var(--accent-ink,#fff)}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--rb,var(--r)) - 2px);background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--muted);font-size:10.5px;font-family:var(--font-chart,inherit)}
.ax line{stroke:var(--grid,var(--line));stroke-dasharray:2 4}
.ax .base{stroke-dasharray:none}
.ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:c-draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.fadein{animation:c-fade .9s .3s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:c-grow .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes c-grow{from{transform:scaleY(0)}}
.dim .bar{opacity:.35}.dim .bar.hl{opacity:1}
.sweep{animation:c-sweep 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes c-sweep{from{stroke-dasharray:0 9999}}
.arc{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:auto;flex:none}
.d-c{font-weight:800;fill:var(--text)}.d-l{fill:var(--muted);font-size:11px}
.dleg{display:grid;gap:7px;flex:1;min-width:150px;font-size:.82rem}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;background:var(--sw);flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dleg small{color:var(--muted);width:3.2em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sw)}
.legend i.dash{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sw) 0 4px,transparent 4px 7px)}
.hl-g{opacity:0;transition:opacity .15s;pointer-events:none}
.hl-g line{stroke:var(--muted);stroke-dasharray:3 3}
.hl-g circle{stroke:var(--panel-solid,var(--panel));stroke-width:2}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.hb-t{height:9px;border-radius:9px;background:var(--track,color-mix(in srgb,var(--text) 8%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes c-w{from{width:0}}
.hb b{font-variant-numeric:tabular-nums}
.hm rect{transition:opacity .2s}
.hm .cell{animation:c-fade .5s both}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col-bg,color-mix(in srgb,var(--text) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background-color .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:10px;flex-wrap:wrap}
.kcol-h i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.kcol-h small{margin-left:auto;color:var(--muted);font-weight:600}
.kc-n{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none;position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.kc-f{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.kc-f .ibtn{width:26px;height:26px}
.grip{touch-action:none;cursor:grab}
.k-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:calc(var(--r) - 2px)}
.drop-on{outline-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:85;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.32);transition:none!important;opacity:.95}
body.is-dragging{cursor:grabbing;user-select:none}
/* month calendar */
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mc-h b{min-width:9em;text-align:center}
.mc-h .mc-x{margin-left:auto;display:flex;gap:8px}
.mc-wd,.mc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc-wd span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.mc-days{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mc-d{background:var(--panel-solid,var(--panel));min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.mc-d.out{background:color-mix(in srgb,var(--panel-solid,var(--panel)) 80%,var(--bg))}
.mc-d.out .mc-n{opacity:.4}
.mc-n{border:0;background:transparent;font-size:.74rem;font-weight:700;width:24px;height:24px;border-radius:50%;padding:0}
.mc-d.today .mc-n{background:var(--accent);color:var(--accent-ink,#fff)}
.mc-e{font-size:.7rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--text);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none}
.mc-more{border:0;background:transparent;font-size:.68rem;color:var(--muted);text-align:left;padding:0 4px}
@media (max-width:640px){.mc-d{min-height:64px}.mc-e{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--ec)}}
@media (max-width:540px){.form{grid-template-columns:1fr}.l-body{padding:14px}.toasts{right:12px;left:12px;bottom:12px;max-width:none}}
/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

body{font-size:14px;background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),radial-gradient(700px 400px at 100% 0%,color-mix(in srgb,var(--sun) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.mono{font-family:var(--mono)}
.thin{font-weight:300;letter-spacing:-.04em}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:#fff;padding:8px 12px;border-radius:10px}
.skip:focus{left:8px}
/* ---------- header with place pills and capsule tabs ---------- */
.head{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 26px 6px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand b{font-size:1.25rem;font-weight:700;letter-spacing:-.03em}
.brand small{display:block;font-size:.66rem;color:var(--muted)}
.places{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:14px}
.places::-webkit-scrollbar{display:none}
.places button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;transition:all .2s}
.places button b{color:var(--text);font-weight:700}
.places button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.places button[aria-pressed=true] b{color:var(--accent-ink)}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn{border-radius:12px;background:var(--panel)}
.unit{border:1px solid var(--line);background:var(--panel);border-radius:12px;height:36px;padding:0 10px;font-weight:700;color:var(--text)}
.tabs{position:relative;display:flex;gap:2px;padding:4px 26px 10px;max-width:1440px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.86rem;transition:color .25s}
.tabs a .ic{width:16px;height:16px}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current=page]{color:var(--text)}
.tabs .nav-marker{position:absolute;top:4px;bottom:10px;left:0;border-radius:99px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:0 0 18px -4px var(--accent);transition:transform .45s cubic-bezier(.3,1.2,.5,1),width .45s,opacity .2s;pointer-events:none}
#view{padding:22px 26px 46px;max-width:1440px;margin:0 auto;overflow-x:clip}
@keyframes nb-rise{from{opacity:0;transform:translateY(18px);filter:saturate(.3)}}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:1.8rem;font-weight:700;letter-spacing:-.03em}
.ph p{color:var(--muted);margin-top:4px}
.ph-x{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;min-width:0;transition:transform .3s,box-shadow .3s,border-color .3s}
.kpi:hover,.place:hover,.plan:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--accent) 60%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:1rem;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{display:flex;flex-direction:column}
.k-i{position:absolute;right:16px;top:16px;color:var(--accent)}

.k-v{font-size:1.9rem;font-weight:300;letter-spacing:-.04em;margin-top:4px}
.k-d{font-size:.76rem;font-weight:700}

.g{display:grid;gap:14px;margin-bottom:14px}
.g-21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}

.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{border-radius:12px}
.chip{border-radius:99px}

.hero{background:linear-gradient(140deg,var(--hero1),var(--hero2));color:#fff;border:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}

.temp{font-size:5.6rem;font-weight:200;letter-spacing:-.06em;line-height:1}

.cond{font-size:1.15rem;font-weight:600}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.84rem}
.facts span{display:flex;align-items:center;gap:6px}
.sky{width:180px;height:150px}
.sky .rays{transform-origin:70px 60px;animation:nb-spin 24s linear infinite}
.sky .sunc{fill:var(--sun)}
.sky .rays path{stroke:var(--sun);stroke-width:5;stroke-linecap:round}
.sky .cl{fill:#fff;animation:nb-drift 7s ease-in-out infinite alternate}
.sky .cl2{fill:rgba(255,255,255,.75);animation:nb-drift 9s ease-in-out infinite alternate-reverse}
.sky .drop{stroke:#bfe6ff;stroke-width:3;stroke-linecap:round;animation:nb-rain 1s linear infinite}
.sky .moon{fill:#fef3c7}
.sky .st{fill:#fff;animation:nb-tw 2.6s ease-in-out infinite}
@keyframes nb-spin{to{transform:rotate(360deg)}}
@keyframes nb-drift{to{transform:translateX(12px)}}
@keyframes nb-rain{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(22px);opacity:0}}
@keyframes nb-tw{50%{opacity:.2}}
.sunarc{width:100%;height:auto;display:block}
.sunarc .arcp{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 5}
.sunarc .arcd{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round}
.sunarc .sund{fill:var(--sun);filter:drop-shadow(0 0 6px var(--sun))}
.sunarc text{font:600 11px var(--font);fill:var(--muted)}
.compass{width:110px;height:110px}
.compass circle{fill:none;stroke:var(--line)}
.compass text{font:700 9px var(--font);fill:var(--muted)}
.compass .nd{fill:var(--accent);transform-origin:55px 55px;transition:transform 1.2s cubic-bezier(.3,1.3,.5,1)}
.hours{display:flex;gap:0;overflow-x:auto;margin-top:6px;padding-bottom:4px}
.hr{flex:1 0 44px;text-align:center;font-size:.74rem;color:var(--muted)}
.hr b{display:block;color:var(--text);font-size:.86rem;margin-top:2px}
.hr i{display:block;height:34px;position:relative;margin:4px 8px 0}
.hr i em{position:absolute;bottom:0;left:0;right:0;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 70%,transparent);height:var(--p)}
.ten{list-style:none;margin:0;padding:0}
.ten li{display:grid;grid-template-columns:58px 30px 46px 40px 1fr 40px;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--grid);font-size:.86rem}
.ten li:last-child{border-bottom:0}
.ten .pp{color:var(--accent);font-weight:700;font-size:.76rem}
.ten .lo{color:var(--muted);text-align:right}
.ten .bar{height:6px;border-radius:3px;background:var(--grid);position:relative}
.ten .bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--sun));left:var(--a);right:var(--b);animation:c-fade .8s both}
.wi{width:26px;height:26px}
/* ---------- radar (signature) ---------- */
.radar-card{padding:12px}
.rmap{display:block;width:100%;height:auto;border-radius:14px;background:var(--sea)}
.rmap .land{fill:var(--land);stroke:var(--land2);stroke-width:2}
.rmap .mnt{fill:var(--mount)}
.rmap .river{fill:none;stroke:var(--river);stroke-width:2.5;stroke-linecap:round}
.rmap .ring{fill:none;stroke:color-mix(in srgb,var(--accent) 35%,transparent);stroke-dasharray:3 6}
.rmap .sweep{transform-origin:500px 230px;animation:nb-spin 4s linear infinite}
.rmap .cell{transition:transform 1s linear,opacity .6s}
.rmap .cloud{transition:transform 1s linear;fill:rgba(255,255,255,.35)}
.rmap .city circle{fill:var(--panel-solid);stroke:var(--cityc);stroke-width:2}
.rmap .city text{font:700 12px var(--font);fill:var(--cityc);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.rmap .city.wet circle{fill:var(--accent)}
.rmap .city{cursor:pointer;outline:none}
.rmap .city:focus-visible circle{stroke:var(--accent);stroke-width:4}
.rmap .warr path{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round}
.rmap .tblob{opacity:.35}
.rmap .layer{transition:opacity .4s}
.rmap .layer.off{opacity:0;pointer-events:none}
.rbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.rbar input[type=range]{flex:1;min-width:180px}
.rtime{font:700 .9rem var(--mono);min-width:7.5em}
.rleg{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted)}
.rleg i{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#86efac,#facc15,#fb923c,#ef4444,#c026d3)}
.layers{display:flex;flex-direction:column;gap:10px}
.rain-list{list-style:none;margin:0;padding:0}
.rain-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:.86rem;cursor:pointer}

.rain-list .rate{width:70px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.rain-list .rate i{display:block;height:100%;width:var(--w);background:var(--rc);transition:width 1s}

.places-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

.place .top{display:flex;justify-content:space-between;align-items:flex-start}
.place .tt{font-size:2.6rem;font-weight:200;letter-spacing:-.05em}
.place small{color:var(--muted)}
.place .acts{display:flex;gap:6px;margin-top:10px}
.place.def{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;border-left:5px solid var(--ac)}
.alert .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.alert b{display:block}
.alert p{color:var(--muted);font-size:.86rem;margin-top:2px}
.alist{display:flex;flex-direction:column;gap:12px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan h3{font-size:1.05rem}
.plan .pr{font-size:2.2rem;font-weight:300;letter-spacing:-.04em;margin:6px 0}
.plan ul{list-style:none;margin:10px 0;padding:0;font-size:.84rem;color:var(--muted)}
.plan ul li{padding:4px 0;display:flex;gap:6px;align-items:center}
.plan.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.dsec{margin-top:16px}
.dsec h3{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.minilist{list-style:none;margin:0;padding:0;font-size:.86rem}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21,.g-12{grid-template-columns:minmax(0,1fr)}.g-3{grid-template-columns:minmax(0,1fr)}.plans{grid-template-columns:minmax(0,1fr)}}

<script>
/* ================= Core helpers (shared by every page of this app) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
let RM = mqRM.matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
let NS = 'craft:';
let APPNAME = 'App';

/* --- seeded random, so the demo data is the same on every load --- */
let _s = 1;
const seed = n => { _s = (n >>> 0) || 1; };
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Number.isNaN(+v) ? a : Math.max(a, Math.min(b, v));
/* every number written into SVG goes through fin/fx, so NaN or Infinity can never reach an attribute */
const fin = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const fx = (v, p = 1) => fin(v).toFixed(p);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const lerp = (a, b, t) => a + (b - a) * t;
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 8);

/* --- number, money and date formatting --- */
const fmt = (n, d = 0) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const short = (n, d = 1) => { n = +n || 0; const a = Math.abs(n), s = n < 0 ? '-' : ''; const f = (v, u) => s + v.toFixed(d).replace(/\.0+$/, '') + u; return a >= 1e9 ? f(a / 1e9, 'B') : a >= 1e6 ? f(a / 1e6, 'M') : a >= 1e3 ? f(a / 1e3, 'K') : s + fmt(a, a < 10 && a % 1 ? 1 : 0); };
let CUR = 'Rs ';
const money = (n, d = 0) => (n < 0 ? '-' : '') + CUR + fmt(Math.abs(n), d);
const moneyS = n => (n < 0 ? '-' : '') + CUR + short(Math.abs(n));
const pct = (n, d = 0) => fmt(n, d) + '%';
const FMT = { fmt: v => fmt(v), money: v => money(v), moneyS: v => moneyS(v), short: v => short(v), pct: v => pct(v), pct1: v => pct(v, 1), dec1: v => fmt(v, 1), dec2: v => fmt(v, 2) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY = 864e5;
const NOW = new Date(); NOW.setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fd = d => MON[d.getMonth()] + ' ' + d.getDate();
const fdy = d => fd(d) + ', ' + d.getFullYear();
const fdl = d => DAYN[d.getDay()] + ', ' + fd(d);
const ftime = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const ago = d => { const s = Math.max(0, (Date.now() - d) / 1000); return s < 50 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const lastMonths = n => Array.from({ length: n }, (_, i) => { const d = new Date(NOW.getFullYear(), NOW.getMonth() - n + 1 + i, 1); return MON[d.getMonth()]; });
const lastDays = n => Array.from({ length: n }, (_, i) => fd(addDays(NOW, i - n + 1)));
/* smooth random walk for demo series */

/* Data table: search, filter chips, column sort, pagination, row click */
function DataTable(el, c) {

  el.innerHTML = `<div class="tbar">${c.search !== false ? `<label class="search">${ic('search')}<span class="sr">Search</span><input type="search" placeholder="${esc(c.ph || 'Search…')}"></label>` : ''}${c.filters ? `<div class="chips" role="group" aria-label="Filter">${c.filters.map((f, i) => `<button type="button" class="chip" aria-pressed="${i === 0}" data-f="${esc(f.label)}">${esc(f.label)}<em></em></button>`).join('')}</div>` : ''}<div class="tbar-x">${c.tools || ''}</div></div><div class="tw"><table class="tbl"><thead><tr>${c.cols.map(col => `<th class="${col.num ? 'n' : ''}" scope="col"${col.k && col.sort !== false ? ' aria-sort="none"' : ''}>${col.k && col.sort !== false ? `<button type="button" data-k="${col.k}">${esc(col.label)}<span class="si"></span></button>` : `<span class="th">${esc(col.label)}</span>`}</th>`).join('')}</tr></thead><tbody></tbody></table></div><div class="pager"><span class="pg-info" aria-live="polite"></span><span class="pg-btns"><button class="btn sm ghost" type="button" data-pg="-1">‹ Prev</button><button class="btn sm ghost" type="button" data-pg="1">Next ›</button></span></div>`;
  const tb = el.querySelector('tbody'), info = el.querySelector('.pg-info');
  const rows = () => {
    let r = c.rows();
    if (st.q) { const q = st.q.toLowerCase(), keys = c.keys || c.cols.map(k => k.k).filter(Boolean); r = r.filter(x => keys.some(k => String(x[k] ?? '').toLowerCase().includes(q))); }
    if (c.filters) { const f = c.filters.find(f => f.label === st.f); if (f && f.fn) r = r.filter(f.fn); }
    if (st.k) r = [...r].sort((a, b) => { const A = a[st.k], B = b[st.k]; return (typeof A === 'number' && typeof B === 'number' ? A - B : A instanceof Date ? A - B : String(A).localeCompare(String(B), undefined, { numeric: true })) * st.d; });
    return r;
  };
  const draw = () => {
    const r = rows(), pages = Math.max(1, Math.ceil(r.length / ps)); st.p = clamp(st.p, 0, pages - 1);
    const sl = r.slice(st.p * ps, st.p * ps + ps);
    tb.innerHTML = sl.length ? sl.map(x => `<tr tabindex="0" data-id="${esc(x.id)}">${c.cols.map(col => `<td class="${col.num ? 'n num' : ''}">${col.f ? col.f(x[col.k], x) : esc(x[col.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${c.cols.length}"><div class="empty">${c.empty || 'Nothing matches. Try another search or filter.'}</div></td></tr>`;
    info.textContent = r.length ? `${st.p * ps + 1}–${Math.min(r.length, st.p * ps + ps)} of ${r.length}` : '0 results';

    if (c.filters) { const all = c.rows(); el.querySelectorAll('.chip').forEach(b => { const f = c.filters.find(f => f.label === b.dataset.f); b.querySelector('em').textContent = ' ' + (f && f.fn ? all.filter(f.fn).length : all.length); }); }
    el.querySelectorAll('th[aria-sort]').forEach(th => { const k = th.querySelector('button').dataset.k; th.setAttribute('aria-sort', k === st.k ? (st.d > 0 ? 'ascending' : 'descending') : 'none'); });
    c.after && c.after(r);
  };
  const s = el.querySelector('.search input'); s && s.addEventListener('input', () => { st.q = s.value.trim(); st.p = 0; draw(); });

    const ch = e.target.closest('.chip'); if (ch && el.contains(ch) && ch.closest('.tbar')) { st.f = ch.dataset.f; st.p = 0; el.querySelectorAll('.tbar .chip').forEach(b => b.setAttribute('aria-pressed', b === ch)); draw(); return; }

  draw();
  return { draw, st };
}

/* where the cells and clouds are at a time offset (minutes from now) */
const cellAt = (c, t) => [((c.x + c.vx * (DB.t + t) / 2) % 900 + 900) % 900, c.y + c.vy * (DB.t + t) / 2];

const LVL = { Extreme: 'var(--c5)', Severe: 'var(--bad)', Moderate: 'var(--warn)', Minor: 'var(--c1)' };
page('alerts', 'Alerts', v => {
  v.innerHTML = pageHead('Alerts', 'Official warnings for your places, and your own rules.', `<button class="btn pri" type="button" data-add>${ic('plus')}New rule</button>`) + `<div class="g g-21"><section><div class="alist" id="al"></div></section><section class="card" style="align-self:start"><div class="card-h"><h2>Your rules</h2></div><div class="dt" id="rt"></div></section></div>`;
  const drawA = () => { $('#al', v).innerHTML = DB.alerts.map(a => `<article class="card alert" style="--ac:${LVL[a.level]}"><span class="ai">${ic(a.icon)}</span><div><b>${esc(a.title)}</b><small class="muted">${esc(a.area)} · ${fd(a.from)} ${ftime(a.from)} to ${fd(a.to)} ${ftime(a.to)}</small><p>${esc(a.text)}</p></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${tagS(a.level)}<button class="btn sm" type="button" data-dis="${a.id}">Dismiss</button></div></article>`).join('') || '<div class="card empty">No warnings right now.</div>'; };
  const rt = DataTable($('#rt', v), { rows: () => DB.rules, search: false, cols: [{ k: 'place', label: 'Place' }, { k: 'metric', label: 'When', f: (m, r) => `${m} ${r.op} ${r.val}${r.unit}` }, { k: 'on', label: 'On', sort: false, f: (x, r) => `<label class="sw"><input type="checkbox" role="switch" data-act="tog" ${x ? 'checked' : ''} aria-label="Rule for ${esc(r.place)} on"></label>` }], onAct: (a, r, el) => { r.on = el.checked; toast(`Rule ${r.on ? 'on' : 'off'}`); }, onRow: r => ruleModal(r) });
  const ruleModal = r => { const L = formModal({ title: r ? 'Edit rule' : 'New alert rule', fields: [{ k: 'place', label: 'Place', type: 'select', options: CN }, { k: 'metric', label: 'Measure', type: 'select', options: ['Rain', 'Temperature', 'Wind', 'AQI'] }, { k: 'op', label: 'When it goes', type: 'select', options: ['above', 'below'] }, { k: 'val', label: 'Value', type: 'number', min: 0, max: 1000, req: true, def: 5 }], values: r || {}, submit: r ? 'Save' : 'Create rule', onSubmit: x => { const unit = { Rain: 'mm/h', Temperature: '°C', Wind: ' km/h', AQI: '' }[x.metric]; if (r) Object.assign(r, x, { unit }); else DB.rules.push({ id: 'R' + (DB.seq.r++), ...x, unit, on: true }); rt.draw(); toast(r ? 'Rule saved' : 'Rule created'); } }); if (r) { L.el.querySelector('.l-foot').insertAdjacentHTML('afterbegin', `<button class="btn ghost" type="button" data-delr style="margin-right:auto">${ic('trash')}Delete</button>`); L.el.querySelector('[data-delr]').onclick = async () => { if (await confirmBox('Delete this rule?')) { DB.rules.splice(DB.rules.indexOf(r), 1); L.close(); rt.draw(); toast('Rule deleted', 'warn'); } }; } };
  $('#rt', v).addEventListener('click', e => { if (e.target.closest('.sw')) e.stopPropagation(); }, true);
  $('#rt', v).addEventListener('change', e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; const r = DB.rules.find(x => x.id === tr.dataset.id); r.on = e.target.checked; toast(`Rule ${r.on ? 'on' : 'off'}`); });
  $('#al', v).addEventListener('click', e => { const b = e.target.closest('[data-dis]'); if (!b) return; const i = DB.alerts.findIndex(a => a.id === b.dataset.dis), a = DB.alerts.splice(i, 1)[0]; drawA(); toast('Alert dismissed', 'warn', { undo: () => { DB.alerts.splice(i, 0, a); drawA(); } }); });
  $('[data-add]', v).onclick = () => ruleModal(); drawA(); pageRefresh = () => { drawA(); rt.draw(); };
});

/* --- Air quality --- */
page('air', 'Air quality', v => {
  const w = W(), [band, col] = aqiBand(w.aqi);
  v.innerHTML = pageHead(`Air in ${esc(w.name)}`, `${band}. ${w.aqi > 150 ? 'Wear a mask outside and keep windows shut.' : 'Fine for most people to be outdoors.'}`) + `<div class="g g-12"><section class="card"><div class="card-h"><h2>Air quality index</h2></div><div class="chart" id="ag" style="display:grid;place-items:center"></div></section><section class="card"><div class="card-h"><h2>Pollutants</h2><small>µg/m³</small></div><div id="pol"></div></section></div><section class="card" style="margin-bottom:14px"><div class="card-h"><h2>When the air is worst</h2><small>AQI by day and hour, this week</small></div><div class="chart" id="ah"></div></section><section class="card"><div class="card-h"><h2>All cities now</h2></div><div id="ac"></div></section>`;
  gauge($('#ag', v), { value: w.aqi, max: 400, size: 240, color: col, fmt: x => Math.round(x), sub: band, label: 'Air quality index' });
  hbars($('#pol', v), [['PM2.5', w.aqi * .55], ['PM10', w.aqi * .9], ['Ozone', 38], ['Nitrogen dioxide', w.aqi * .18], ['Sulphur dioxide', 9]].map(([l, x], i) => ({ label: l, value: Math.round(x), color: i < 2 ? col : 'var(--c1)' })), { fmt: x => x + ' µg/m³' });
  heatmap($('#ah', v), { rows: DAYN, cols: Array.from({ length: 24 }, (_, h) => pad(h)), data: w.aqiHist, color: col, fmt: x => 'AQI ' + x, cell: 22 });
  hbars($('#ac', v), CN.map(n => ({ label: n, value: DB.wx[n].aqi, color: aqiBand(DB.wx[n].aqi)[1] })).sort((a, b) => b.value - a.value), { fmt: x => x + ' · ' + aqiBand(x)[0] });
});

/* --- Climate history --- */
page('climate', 'Climate', v => {
  let city = DB.place;
  v.innerHTML = pageHead('Climate', 'Average temperature and rainfall by month, so you can plan trips and crops.', `<label class="sr" for="cc">City</label><select class="inp" id="cc" style="width:auto">${CN.map(n => `<option ${n === city ? 'selected' : ''}>${n}</option>`).join('')}</select>`) + `<section class="kpis" id="ck"></section><div class="g g-2"><section class="card"><div class="card-h"><h2>Average temperature</h2></div><div class="chart" id="ct"></div></section><section class="card"><div class="card-h"><h2>Rainfall</h2></div><div class="chart" id="cr"></div></section></div>`;
  const draw = () => { const m = DB.wx[city].months, hot = m.reduce((a, b) => b.t > a.t ? b : a), wet = m.reduce((a, b) => b.rain > a.rain ? b : a);
    $('#ck', v).innerHTML = [{ label: 'Yearly average', value: avg(m.map(x => x.t)), f: 'deg', icon: 'thermo' }, { label: 'Warmest month', value: hot.t, f: 'deg', icon: 'sun', note: hot.m }, { label: 'Yearly rainfall', value: sum(m.map(x => x.rain)), f: 'mm', icon: 'umbrella' }, { label: 'Wettest month', value: wet.rain, f: 'mm', icon: 'cloud', note: wet.m }].map(kpiHTML).join(''); counts($('#ck', v));
    lineChart($('#ct', v), { labels: MON, series: [{ name: 'Average', data: m.map(x => tC(x.t)), color: 'var(--sun)' }], h: 220, min: 'auto', yfmt: x => fmt(x) + '°', tfmt: x => fmt(x) + '°' + UNIT });
    barChart($('#cr', v), { labels: MON, series: [{ name: 'Rainfall', data: m.map(x => x.rain), color: 'var(--accent)' }], h: 220, tfmt: x => x + ' mm' }); };
  $('#cc', v).onchange = e => { city = e.target.value; draw(); };
  draw(); pageRefresh = draw;
});
FMT.mm = x => fmt(x) + ' mm';

/* --- API and billing (the SaaS side) --- */
page('api', 'API & billing', v => {
  const PLANS = [['Free', 0, '1,000 calls a day', ['Current weather', '3-day forecast']], ['Pro', 49, '100,000 calls a day', ['Everything in Free', 'Radar tiles', 'Alerts and webhooks', 'Air quality']], ['Business', 299, '2 million calls a day', ['Everything in Pro', 'Climate history', 'Priority support', 'Team seats']]];
  v.innerHTML = pageHead('API & billing', 'Keys for your apps, how much you use and what you pay.', `<button class="btn pri" type="button" data-key>${ic('key')}New API key</button>`) + `<section class="kpis" id="uk"></section><div class="g g-21"><section class="card"><div class="card-h"><h2>API calls, last 30 days</h2></div><div class="chart" id="uc"></div></section><section class="card"><div class="card-h"><h2>Today's quota</h2></div><div class="chart" id="uq" style="display:grid;place-items:center"></div></section></div><section class="card" style="margin-bottom:14px"><div class="card-h"><h2>API keys</h2></div><div class="dt" id="kt"></div></section><div class="plans" id="pl"></div><section class="card" style="margin-top:14px"><div class="card-h"><h2>Invoices</h2></div><div class="dt" id="it"></div></section>`;
  const lim = { Free: 1000, Pro: 100000, Business: 2000000 };
  const draw = () => {
    const today = DB.usage[29];
    $('#uk', v).innerHTML = [{ label: 'Calls today', value: today, f: 'short', icon: 'zap' }, { label: 'Calls this month', value: sum(DB.usage), f: 'short', icon: 'chart', delta: 12.6 }, { label: 'Active keys', value: DB.keys.filter(k => k.status === 'Active').length, icon: 'key' }, { label: 'Plan', value: PLANS.find(p => p[0] === DB.set.plan)[1], f: 'money', icon: 'wallet', note: DB.set.plan + ' plan, per month' }].map(kpiHTML).join(''); counts($('#uk', v));
    barChart($('#uc', v), { labels: lastDays(30), series: [{ name: 'Calls', data: DB.usage, color: 'var(--accent)' }], h: 220, xw: 46, tfmt: fmt });
    gauge($('#uq', v), { value: Math.min(today, lim[DB.set.plan]), max: lim[DB.set.plan], size: 220, color: today / lim[DB.set.plan] > .85 ? 'var(--bad)' : 'var(--accent)', fmt: x => short(x), sub: 'of ' + short(lim[DB.set.plan]) + ' calls', label: 'Daily quota' });
    $('#pl', v).innerHTML = PLANS.map(([n, p, c, f]) => `<section class="card plan${n === DB.set.plan ? ' cur' : ''}"><h3>${n}</h3><div class="pr">${p ? money(p) : 'Free'}<small class="muted" style="font-size:.9rem">${p ? ' a month' : ''}</small></div><small class="muted">${c}</small><ul>${f.map(x => `<li>${ic('check')}${x}</li>`).join('')}</ul><button class="btn${n === DB.set.plan ? '' : ' pri'}" type="button" data-plan="${n}" ${n === DB.set.plan ? 'disabled' : ''} style="width:100%">${n === DB.set.plan ? 'Your plan' : PLANS.findIndex(x => x[0] === n) > PLANS.findIndex(x => x[0] === DB.set.plan) ? 'Upgrade' : 'Downgrade'}</button></section>`).join('');
    kt.draw(); it.draw();
  };
  const kt = DataTable($('#kt', v), { rows: () => DB.keys, search: false, sort: 'created', cols: [{ k: 'name', label: 'Name' }, { k: 'key', label: 'Key', sort: false, f: x => `<span class="key">${x.slice(0, 12)}…${x.slice(-4)}</span>` }, { k: 'scope', label: 'Access' }, { k: 'calls', label: 'Calls, 30 days', num: true, f: x => fmt(x) }, { k: 'last', label: 'Last used', f: x => ago(x) }, { k: 'status', label: 'Status', f: x => tagS(x) }, { k: 'id', label: 'Actions', sort: false, f: (x, k) => k.status === 'Active' ? `<button class="btn sm" type="button" data-act="copy">Copy</button> <button class="btn sm" type="button" data-act="revoke">Revoke</button>` : '' }], onAct: async (a, k) => { if (a === 'copy') { try { await navigator.clipboard.writeText(k.key); toast('Key copied'); } catch (e) { toast('Copy is blocked here. Select the key in the drawer instead.', 'warn'); } } else if (await confirmBox(`Revoke “${esc(k.name)}”? Apps using it stop working at once.`, { ok: 'Revoke key' })) { k.status = 'Revoked'; draw(); toast('Key revoked', 'warn'); } }, onRow: k => drawer({ title: esc(k.name), body: `${tagS(k.status)}<dl class="dl" style="margin-top:12px"><dt>Key</dt><dd class="key" style="word-break:break-all;text-align:right">${k.key}</dd><dt>Access</dt><dd>${k.scope}</dd><dt>Created</dt><dd>${fdy(k.created)}</dd><dt>Calls, 30 days</dt><dd>${fmt(k.calls)}</dd></dl><div class="dsec"><h3>Example request</h3><pre class="key" style="white-space:pre-wrap;background:var(--field);padding:12px;border-radius:10px">GET /v1/now?place=Lahore\nheader: x-api-key: ${k.key.slice(0, 12)}…</pre></div>` }) });
  const it = DataTable($('#it', v), { rows: () => DB.invoices, search: false, sort: 'date', cols: [{ k: 'id', label: 'Invoice' }, { k: 'date', label: 'Date', f: d => fdy(d) }, { k: 'plan', label: 'Plan' }, { k: 'amount', label: 'Amount', num: true, f: x => money(x) }, { k: 'status', label: 'Status', f: x => tagS(x) }], onRow: x => { if (x.status === 'Due') confirmBox(`Pay invoice ${x.id} for ${money(x.amount)} with the card on file?`, { ok: 'Pay now', danger: false, title: 'Pay invoice' }).then(ok => { if (ok) { x.status = 'Paid'; draw(); Bell.add('Payment received', x.id + ' · ' + money(x.amount), 'ok'); } }); else toast(`${x.id} was paid on ${fd(x.date)}`); } });
  v.addEventListener('click', async e => { const p = e.target.closest('[data-plan]'); if (!p) return; const n = p.dataset.plan; if (await confirmBox(`Switch to the ${n} plan? The change shows on your next invoice.`, { ok: 'Switch to ' + n, danger: false, title: 'Change plan' })) { DB.set.plan = n; draw(); Bell.add('Plan changed to ' + n, 'Takes effect today', 'ok'); } });
  $('[data-key]', v).onclick = () => formModal({ title: 'New API key', fields: [{ k: 'name', label: 'Key name', req: true, ph: 'Mobile app', valid: x => DB.keys.some(k => k.name.toLowerCase() === x.toLowerCase() && k.status === 'Active') ? 'You already have an active key with this name' : '' }, { k: 'scope', label: 'Access', type: 'select', options: ['Read', 'Read and write'] }], submit: 'Create key', onSubmit: x => { const k = { id: 'K' + (DB.seq.k++), ...x, status: 'Active', key: 'nb_live_' + Math.random().toString(16).slice(2, 14) + Math.random().toString(16).slice(2, 14), created: new Date(), last: new Date(), calls: 0 }; DB.keys.unshift(k); draw(); toast('Key created. Copy it now.'); } });
  draw(); pageRefresh = draw;
  every(3000, () => { DB.usage[29] += ri(20, 140); const kv = $$('#uk .k-v', v)[0]; kv && countUp(kv, DB.usage[29], FMT.short, 600); });
});

/* --- Settings --- */
page('settings', 'Settings', v => {
  v.innerHTML = pageHead('Settings', 'Units, your account and display.') + `<div class="g g-2"><section class="card"><div class="card-h"><h2>Units</h2></div><div class="set-sec">${switchHTML('s-f', 'Show temperatures in °F', UNIT === 'F')}${switchHTML('s-mph', 'Show wind in mph', DB.set.wind === 'mph')}</div><div class="card-h" style="margin:18px 0 12px"><h2>Account</h2></div><form class="form" id="af" novalidate>${formHTML([{ k: 'org', label: 'Organisation', req: true }, { k: 'email', label: 'Billing email', type: 'email', req: true }], DB.set)}<div class="fld full"><button class="btn pri" type="submit">${ic('check')}Save</button></div></form></section><section class="card set-sec"><div class="card-h" style="margin:0"><h2>Display</h2></div>${switchHTML('s-dark', 'Night theme', Theme.get() === 'dark')}${switchHTML('s-rm', 'Reduce motion (radar sweep stops)', document.documentElement.classList.contains('rm'))}<div class="card-h" style="margin:8px 0 0"><h2>Demo data</h2></div><p class="muted">Weather, places, keys and invoices here are invented.</p><button class="btn danger" type="button" data-reset style="justify-self:start">${ic('refresh')}Reset demo data</button></section></div>`;
  $('#s-f', v).onchange = e => { setUnit(e.target.checked ? 'F' : 'C'); };
  $('#s-mph', v).onchange = e => { DB.set.wind = e.target.checked ? 'mph' : 'km/h'; LS.set('wind', DB.set.wind); toast('Wind in ' + DB.set.wind); };
  $('#af', v).addEventListener('submit', e => { e.preventDefault(); const x = readForm(e.target, [{ k: 'org', label: 'Organisation', req: true }, { k: 'email', label: 'Email', type: 'email', req: true }]); if (x) { Object.assign(DB.set, x); toast('Account saved'); } });
  $('#s-dark', v).onchange = e => Theme.set(e.target.checked ? 'dark' : 'light');
  $('#s-rm', v).onchange = e => { RM = e.target.checked; document.documentElement.classList.toggle('rm', RM); toast(RM ? 'Motion reduced' : 'Motion back on'); };
  $('[data-reset]', v).onclick = async () => { if (await confirmBox('Reset all demo data? Your changes will be lost.', { ok: 'Reset data' })) { LS.del('place'); DB = makeData(); drawPlaces(); Bell.list = []; Bell.badge(); toast('Demo data reset'); location.hash = '#/now'; } };
});
function setUnit(u) { UNIT = u; LS.set('unit', u); $('#unit').textContent = '°' + u; drawPlaces(); redo(); toast('Temperatures in °' + u); }

/* ================= Start ================= */
DB = makeData();
UNIT = LS.get('unit', 'C'); DB.set.wind = LS.get('wind', 'km/h'); $('#unit').textContent = '°' + UNIT;
Theme.init(); /* ?theme= first, then your saved choice, then the system setting */
drawPlaces();
$('#places').addEventListener('click', e => { const b = e.target.closest('[data-place]'); b && setPlace(b.dataset.place); });
$('#unit').onclick = () => setUnit(UNIT === 'C' ? 'F' : 'C');
Bell.init($('[data-bell]'));
Bell.add('Heavy rain warning for Islamabad', 'Until 21:00 tonight', 'warn', true);
Bell.add('Smog: very unhealthy in Lahore', 'AQI above 250', 'bad', true);
Cmdk.extra = [{ label: 'Switch °C and °F', hint: 'Action', run: () => setUnit(UNIT === 'C' ? 'F' : 'C') }, { label: 'New API key', hint: 'Action', run: () => { location.hash = '#/api'; setTimeout(() => { const b = $('[data-key]'); b && b.click(); }, 300); } }, { label: 'Toggle night theme', hint: 'Action', run: () => Theme.toggle() }, ...CN.map(n => ({ label: 'Weather in ' + n, hint: 'Place', run: () => { if (DB.places.some(p => p.name === n)) { setPlace(n); location.hash = '#/now'; } else toast('Add ' + n + ' on the Places page first', 'warn'); } }))];
/* the weather clock: one real second moves the rain one minute */
every(1000, () => { DB.t += 1; }, true);
every(20000, () => { if (rnd() < .5) { const n = pick(['Islamabad', 'Peshawar', 'Murree']); const r = rainAt(n); if (r > 1) Bell.add(`Rain in ${n}`, fmt(r, 1) + ' mm/h right now', 'info', true); } }, true);
Router.start();
</script>
</body>
</html>
