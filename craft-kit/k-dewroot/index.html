<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dewroot · small-batch skincare</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ================= Colour tokens ================= */
  :root {
    --page: #fbf6ef; --page2: #f3ece0; --card: rgba(255, 255, 255, .64); --solid: #fffdf9;
    --ink: #26332b; --muted: #5b685e; --line: rgba(38, 51, 43, .14);
    --sage: #a9bfa0; --sage2: #5f8a5a; --blush: #f3cfc6; --honey: #e8b04b;
    --btn: #26332b; --btn-ink: #fbf6ef; --glass-b: rgba(255, 255, 255, .8);
    --chip: rgba(169, 191, 160, .24); --pool: #d9e8d6; --pool2: #b8d1b3;
    --shadow: 0 24px 50px -26px rgba(38, 51, 43, .5); --shadow-s: 0 10px 24px -14px rgba(38, 51, 43, .45);
    --focus: #b8571c; --danger: #b23b2a; --ok: #3f7a4f;
    --round: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    --spring: cubic-bezier(.34, 1.56, .64, 1); --soft: cubic-bezier(.22, 1, .36, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #101914; --page2: #16211b; --card: rgba(31, 46, 37, .62); --solid: #18241d;
      --ink: #edf3e8; --muted: #a6b8a4; --line: rgba(237, 243, 232, .13);
      --sage: #b7d9a3; --sage2: #9fd18a; --blush: #e3a497; --honey: #f0c063;
      --btn: #bfe3a6; --btn-ink: #122018; --glass-b: rgba(255, 255, 255, .09);
      --chip: rgba(183, 217, 163, .13); --pool: #1f3a2c; --pool2: #2c5340;
      --shadow: 0 24px 50px -26px rgba(0, 0, 0, .85); --shadow-s: 0 10px 24px -14px rgba(0, 0, 0, .8);
      --focus: #ffb36b; --danger: #ff8d76; --ok: #9fd18a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #101914; --page2: #16211b; --card: rgba(31, 46, 37, .62); --solid: #18241d;
    --ink: #edf3e8; --muted: #a6b8a4; --line: rgba(237, 243, 232, .13);
    --sage: #b7d9a3; --sage2: #9fd18a; --blush: #e3a497; --honey: #f0c063;
    --btn: #bfe3a6; --btn-ink: #122018; --glass-b: rgba(255, 255, 255, .09);
    --chip: rgba(183, 217, 163, .13); --pool: #1f3a2c; --pool2: #2c5340;
    --shadow: 0 24px 50px -26px rgba(0, 0, 0, .85); --shadow-s: 0 10px 24px -14px rgba(0, 0, 0, .8);
    --focus: #ffb36b; --danger: #ff8d76; --ok: #9fd18a;
    color-scheme: dark;
  }

  /* ================= Base ================= */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
  body {
    margin: 0; min-height: 100vh; overflow-x: clip;
    background: var(--page); color: var(--ink);
    font-family: var(--round); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; max-width: 100%; }
  h1, h2, h3 { line-height: 1.08; letter-spacing: -.025em; margin: 0 0 .45em; font-weight: 800; text-wrap: balance; }
  h2 { font-size: clamp(1.8rem, 4.4vw, 2.9rem); }
  p { margin: 0 0 1em; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  .wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .76rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--sage2); margin: 0 0 .8em; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .glass {
    background: var(--card); border: 1px solid var(--glass-b); border-radius: 28px;
    box-shadow: var(--shadow); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  }
  .skip { position: fixed; left: 12px; top: -70px; z-index: 100; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font-weight: 700; cursor: pointer; transition: top .3s var(--spring); }
  .skip:focus { top: 12px; }

  /* Soft fixed background blobs */
  .bgdeco { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bgdeco i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .45; }
  .bgdeco i:nth-child(1) { width: 46vmax; height: 46vmax; left: -16vmax; top: -18vmax; background: var(--sage); }
  .bgdeco i:nth-child(2) { width: 40vmax; height: 40vmax; right: -18vmax; bottom: -16vmax; background: var(--blush); }

  /* ================= Buttons ================= */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; overflow: hidden;
    font-weight: 750; font-size: 1rem; text-decoration: none; cursor: pointer; white-space: nowrap;
    transition: transform .4s var(--spring), box-shadow .3s, background .3s, color .3s;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(1px) scale(.95); transition-duration: .12s; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-main { background: var(--btn); color: var(--btn-ink); box-shadow: 0 14px 28px -16px var(--btn); }
  .btn-main::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%); transform: translateX(-120%); transition: transform .8s var(--soft); }
  .btn-main:hover::after { transform: translateX(120%); }
  .btn-ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .round-btn {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--solid);
    display: grid; place-items: center; cursor: pointer; color: var(--ink);
    transition: transform .4s var(--spring), background .3s, opacity .3s;
  }
  .round-btn:hover { transform: scale(1.08); background: var(--chip); }
  .round-btn:active { transform: scale(.88); }
  .round-btn[disabled], .round-btn[aria-disabled="true"] { opacity: .35; cursor: default; transform: none; }
  .round-btn svg { width: 20px; height: 20px; }
  .shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

  /* ================= Header ================= */
  .top {
    position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line);
    background: var(--page); background: color-mix(in srgb, var(--page) 74%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  }
  .top-in { display: flex; align-items: center; gap: 10px; height: 66px; }
  .logo { display: flex; align-items: center; gap: 8px; margin-right: auto; font-weight: 850; font-size: 1.28rem; letter-spacing: -.03em; text-decoration: none; min-width: 0; }
  .logo svg { width: 32px; height: 32px; flex: none; transition: transform .6s var(--spring); }
  .logo:hover svg { transform: rotate(-14deg) scale(1.1); }
  .nav { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--chip); }
  .nav a, .nav button {
    position: relative; z-index: 1; padding: 8px 14px; border: 0; border-radius: 999px; background: none;
    font-weight: 700; font-size: .92rem; color: var(--muted); text-decoration: none; cursor: pointer; transition: color .35s, transform .35s var(--spring);
  }
  .nav a:hover, .nav button:hover { color: var(--ink); }
  .nav a:active, .nav button:active { transform: scale(.92); }
  .nav .on { color: var(--btn-ink); }
  .nav .on:hover { color: var(--btn-ink); }
  .nav-marker {
    position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 40px; border-radius: 999px; background: var(--btn);
    box-shadow: 0 6px 16px -8px var(--btn); opacity: 0;
    transition: transform .6s var(--spring), width .6s var(--spring), opacity .3s;
  }
  .bag-btn {
    position: relative; flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%;
    background: var(--card); border: 1px solid var(--glass-b); box-shadow: var(--shadow-s); color: var(--ink);
    transition: transform .45s var(--spring), box-shadow .3s;
  }
  .bag-btn:hover { transform: translateY(-2px) rotate(-6deg); }
  .bag-btn svg { width: 30px; height: 30px; overflow: visible; }
  .bag-lid { transform-box: view-box; transform-origin: 9px 17px; transition: transform .5s var(--spring); }
  .bag-btn.open .bag-lid { transform: rotate(-34deg) translateY(-1px); }
  .bag-btn::after {
    content: "Drop here"; position: absolute; top: calc(100% + 8px); right: -4px; padding: 4px 10px; border-radius: 999px;
    background: var(--btn); color: var(--btn-ink); font-size: .72rem; font-weight: 800; white-space: nowrap;
    opacity: 0; transform: translateY(-6px) scale(.8); transition: opacity .3s, transform .4s var(--spring); pointer-events: none;
  }
  .bag-btn.drop-ready { animation: glow 1.1s ease-in-out infinite; }
  .bag-btn.drop-ready::after { opacity: 1; transform: none; }
  .bag-btn.drop-hot { transform: scale(1.25); }
  @keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(169, 191, 160, .35), 0 0 34px 8px rgba(232, 176, 75, .45); } }
  .badge {
    position: absolute; top: -5px; right: -5px; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px;
    background: var(--honey); color: #2b2110; font-size: .72rem; font-weight: 850; line-height: 21px; text-align: center;
    box-shadow: 0 0 0 2px var(--page); transform: scale(0); transition: transform .45s var(--spring);
  }
  .badge.has { transform: scale(1); }
  .badge.bump { animation: bump .65s var(--spring); }
  @keyframes bump { 30% { transform: scale(1.65) rotate(-12deg); } 60% { transform: scale(.85) rotate(6deg); } 100% { transform: scale(1); } }
  @media (max-width: 460px) {
    .nav [data-nav="routine"] { display: none; }
    .nav a, .nav button { padding: 8px 11px; }
    .logo span { font-size: 1.12rem; }
  }

  /* ================= View transition ================= */
  #view { display: block; min-height: 70vh; transition: opacity .5s var(--soft), filter .5s var(--soft), transform .7s var(--spring); }
  #view:focus { outline: none; }
  #view.v-out { opacity: 0; filter: blur(12px); transform: translateY(-10px) scale(.985); transition-duration: .28s; }
  #view.v-pre { opacity: 0; filter: blur(14px); transform: translateY(18px); transition: none; }
  .veil { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
  .veil i {
    position: absolute; bottom: -70px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .2) 34%, rgba(169, 191, 160, .35) 70%, transparent 72%);
    border: 1px solid rgba(255, 255, 255, .55);
    animation: veilUp var(--t, 1.1s) var(--soft) forwards;
  }
  @keyframes veilUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(calc(-100vh - 120px)) translateX(var(--dx, 0)) scale(1.15); opacity: 0; } }

  /* ================= Effects layer, ghost bottles, sparks, toast ================= */
  .fx { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
  .ghost { position: fixed; will-change: transform; filter: drop-shadow(0 14px 16px rgba(38, 51, 43, .3)); }
  .ghost svg { width: 100%; height: 100%; }
  .ghost.drag { transition: transform .08s linear; }
  .spark { position: fixed; border-radius: 50%; }
  .spark.star { border-radius: 2px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .petal { position: fixed; top: -40px; width: 18px; height: 22px; }
  .bubble-f { position: fixed; bottom: -40px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .8); background: radial-gradient(circle at 30% 30%, #fff, rgba(169, 191, 160, .25) 60%, transparent 70%); }
  .toast {
    position: fixed; left: 50%; bottom: 20px; z-index: 80; display: flex; align-items: center; gap: 10px;
    max-width: calc(100% - 32px); padding: 12px 18px 12px 12px; border-radius: 999px;
    background: var(--btn); color: var(--btn-ink); font-weight: 650; font-size: .92rem; box-shadow: var(--shadow);
    transform: translate(-50%, 160%); transition: transform .55s var(--spring);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast .t-ic { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--honey); display: grid; place-items: center; color: #2b2110; }
  .toast .t-ic svg { width: 16px; height: 16px; }

  /* ================= Home: hero ================= */
  .hero { position: relative; padding: 34px 0 64px; overflow: hidden; overflow: clip; }
  .blobs { position: absolute; inset: 0; pointer-events: none; }
  .blob { position: absolute; opacity: .85; animation: morph 16s ease-in-out infinite alternate; }
  .b1 { width: min(620px, 92vw); aspect-ratio: 1; right: -12%; top: -14%; background: radial-gradient(circle at 35% 35%, var(--blush), transparent 68%); }
  .b2 { width: min(460px, 80vw); aspect-ratio: 1; left: -14%; bottom: -20%; background: radial-gradient(circle at 60% 40%, var(--sage), transparent 66%); animation-duration: 19s; animation-delay: -6s; }
  .b3 { width: min(300px, 60vw); aspect-ratio: 1; right: 30%; top: 40%; background: radial-gradient(circle, rgba(232, 176, 75, .45), transparent 65%); animation-duration: 13s; animation-delay: -3s; }
  @keyframes morph {
    0% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: rotate(0) scale(1); }
    50% { border-radius: 61% 39% 38% 62% / 55% 61% 39% 45%; transform: rotate(24deg) scale(1.06) translate(2%, -3%); }
    100% { border-radius: 36% 64% 52% 48% / 62% 35% 65% 38%; transform: rotate(-12deg) scale(.96) translate(-3%, 2%); }
  }
  .hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: center; }
  .hero-copy { min-width: 0; }
  .pill-tag { padding: 7px 14px 7px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--glass-b); color: var(--ink); letter-spacing: .08em; animation: rise .9s var(--spring) both; }
  .pill-tag .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--sage2); box-shadow: 0 0 0 0 var(--sage); animation: ping 2s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px transparent; } }
  .hero-title { font-size: clamp(2.5rem, 7vw, 4.9rem); line-height: 1; letter-spacing: -.045em; margin: .25em 0 .35em; }
  .hero-title em { position: relative; font-style: italic; color: var(--honey); white-space: nowrap; }
  .hero-title .swash { position: absolute; left: -4%; right: -4%; bottom: -.12em; width: 108%; height: .3em; overflow: visible; }
  .hero-title .swash path { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.1s var(--soft) 1.5s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .word { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; opacity: 0; transform: translateY(.45em) scale(.3) rotate(-14deg); filter: blur(6px); animation: bloom .95s var(--spring) forwards; animation-delay: calc(var(--i) * 34ms + 120ms); }
  @keyframes bloom { to { opacity: 1; transform: none; filter: blur(0); } }
  .lede { font-size: 1.12rem; color: var(--muted); max-width: 34em; animation: rise 1s var(--soft) .7s both; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; animation: rise 1s var(--soft) .85s both; }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 30px 0 0; padding: 0; list-style: none; animation: rise 1s var(--soft) 1s both; }
  .hero-stats b { display: block; font-size: 1.5rem; letter-spacing: -.03em; }
  .hero-stats span { font-size: .85rem; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } }

  /* Hero stage: pool, dripping pipette, floating bottles, bubbles */
  .hero-stage { position: relative; width: 100%; max-width: 540px; aspect-ratio: 1; justify-self: center; }
  .sun { position: absolute; width: 46%; aspect-ratio: 1; right: 6%; top: 4%; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #ffe3a3, var(--honey) 60%, transparent 71%); opacity: .55; animation: sunPulse 6s ease-in-out infinite; }
  @keyframes sunPulse { 50% { transform: scale(1.08); opacity: .7; } }
  .pool { position: absolute; left: 8%; right: 8%; bottom: 9%; height: 17%; }
  .pool svg { width: 100%; height: 100%; }
  .ripples { position: absolute; left: 8%; right: 8%; bottom: 9%; height: 17%; pointer-events: none; }
  .ripple { position: absolute; left: 50%; top: 50%; width: 64%; height: 64%; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); opacity: 0; transform: translate(-50%, -50%) scale(.1); animation: ripple 3.2s infinite ease-out; }
  .ripple:nth-child(2) { animation-delay: .22s; border-width: 1.5px; }
  .ripple:nth-child(3) { animation-delay: .44s; border-width: 1px; }
  @keyframes ripple { 0%, 49% { opacity: 0; transform: translate(-50%, -50%) scale(.1); } 51% { opacity: .95; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } }
  .pipette { position: absolute; left: 45.5%; top: 0; width: 9%; }
  .pipette .bulb { transform-box: fill-box; transform-origin: 50% 100%; animation: squeeze 3.2s infinite; }
  @keyframes squeeze { 0%, 4% { transform: scaleY(1); } 12% { transform: scaleY(.78) scaleX(1.12); } 24%, 100% { transform: none; } }
  .drop-lane { position: absolute; left: 50%; top: 28.6%; height: 53.6%; width: 14px; margin-left: -7px; }
  .drop { position: absolute; left: 0; top: 0; width: 14px; height: 19px; transform-origin: 50% 0; animation: drip 3.2s infinite cubic-bezier(.55, 0, 1, .45); }
  @keyframes drip {
    0% { top: 0; transform: scale(0); opacity: 1; }
    22% { top: 0; transform: scale(1); }
    27% { top: 0; transform: scale(.9, 1.18); }
    48% { top: calc(100% - 19px); transform: scale(.8, 1.3); opacity: 1; }
    50% { top: calc(100% - 19px); transform: scale(1.5, .3); opacity: 0; }
    100% { top: calc(100% - 19px); opacity: 0; }
  }
  .splash { position: absolute; left: 50%; top: 82%; width: 0; height: 0; }
  .splash i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--sage2); opacity: 0; animation: splash 3.2s infinite; }
  .splash i:nth-child(2) { --sx: 16px; animation-delay: .03s; }
  .splash i:nth-child(3) { --sx: -14px; }
  @keyframes splash { 0%, 49% { opacity: 0; transform: none; } 50% { opacity: .9; } 60% { transform: translate(var(--sx, 2px), -22px); } 72% { opacity: 0; transform: translate(calc(var(--sx, 2px) * 1.5), 0); } 100% { opacity: 0; } }
  .hb { position: absolute; }
  .hb1 { left: 3%; bottom: 17%; width: 25%; }
  .hb2 { right: 4%; bottom: 25%; width: 21%; }
  .hb3 { right: 18%; bottom: 1%; width: 28%; }
  .par { transform: translate3d(0, calc(var(--py, 0) * var(--k, 0) * 1px), 0); }
  .float { animation: floaty var(--dur, 6s) ease-in-out infinite; animation-delay: var(--del, 0s); }
  .float svg { width: 100%; height: auto; filter: drop-shadow(0 18px 18px rgba(38, 51, 43, .22)); }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(var(--r0, -3deg)); } 50% { transform: translateY(-16px) rotate(var(--r1, 3deg)); } }
  .hb-shadow { width: 70%; height: 10px; margin: -4px auto 0; border-radius: 50%; background: radial-gradient(rgba(38, 51, 43, .3), transparent 70%); animation: shadowy var(--dur, 6s) ease-in-out infinite; animation-delay: var(--del, 0s); }
  @keyframes shadowy { 50% { transform: scale(.72); opacity: .55; } }
  .bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 40%; }
  .bubbles i { position: absolute; bottom: -20px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .85); background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .9), rgba(255, 255, 255, .1) 45%, transparent 70%); animation: bub var(--t, 7s) linear infinite; animation-delay: var(--d, 0s); }
  @keyframes bub { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 12% { opacity: 1; } 50% { transform: translate(var(--w, 10px), -260px) scale(.9); } 100% { transform: translate(0, -540px) scale(1.1); opacity: 0; } }
  .leaf { position: absolute; width: 14%; transform-origin: 90% 90%; animation: sway 5s ease-in-out infinite; }
  .leaf.l1 { left: 0; top: 10%; }
  .leaf.l2 { right: -2%; top: 50%; width: 11%; animation-delay: -2s; transform-origin: 10% 90%; }
  @keyframes sway { 50% { transform: rotate(14deg); } }
  .tag-float { position: absolute; padding: 8px 12px; border-radius: 16px; font-size: .78rem; font-weight: 800; white-space: nowrap; animation: floaty 7s ease-in-out infinite; --r0: -2deg; --r1: 2deg; }
  .tag-float small { display: block; font-weight: 600; color: var(--muted); font-size: .68rem; }
  .tag-float.t1 { left: 4%; top: 6%; animation-delay: -1s; }
  .tag-float.t2 { right: 0; top: 34%; animation-delay: -4s; }

  /* Marquee strip */
  .marquee { overflow: hidden; border-block: 1px solid var(--line); background: var(--chip); }
  .marquee-track { display: flex; width: max-content; animation: marq 34s linear infinite; }
  .marquee span { display: inline-flex; align-items: center; gap: 14px; padding: 14px 18px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .marquee span::after { content: ""; width: 10px; height: 10px; border-radius: 50% 0; background: var(--sage2); transform: rotate(45deg); }
  @keyframes marq { to { transform: translateX(-50%); } }

  /* Sections */
  .sec { padding: 84px 0; scroll-margin-top: 70px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 8px; }
  .sec-head > div:first-child { max-width: 640px; min-width: 0; }
  [data-reveal] { opacity: 0; transform: translateY(34px) scale(.97); transition: opacity .9s var(--soft), transform 1s var(--spring); transition-delay: var(--d, 0s); }
  [data-reveal].in { opacity: 1; transform: none; }

  /* ================= Shelf (drag carousel) ================= */
  .shelf-ctrl { display: flex; gap: 10px; }
  .shelf-vp { position: relative; overflow: hidden; overflow: clip; touch-action: pan-y; cursor: grab; padding: 28px 0 34px; }
  .shelf-vp:focus-visible { outline-offset: -4px; border-radius: 30px; }
  .shelf-vp.dragging { cursor: grabbing; }
  .shelf-track {
    position: relative; display: flex; gap: 18px; width: max-content;
    padding-inline: calc((100% - min(1180px, 100% - 32px)) / 2);
    will-change: transform; user-select: none; -webkit-user-select: none;
  }
  .scard { position: relative; flex: none; width: clamp(228px, 64vw, 272px); padding: 14px 14px 16px; display: flex; flex-direction: column; transition: transform .55s var(--spring); }
  .scard:hover { transform: translateY(-6px) rotate(-.6deg); }
  .dragging .scard:hover { transform: none; }
  .grab {
    position: relative; height: 214px; display: grid; place-items: end center; padding-bottom: 10px; border-radius: 22px; cursor: grab;
    background: radial-gradient(circle at 50% 78%, var(--liq, #fff) -20%, transparent 62%), linear-gradient(160deg, var(--chip), transparent);
    touch-action: pan-y; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .grab svg, .card-art svg, .line-art svg { transition: transform .6s var(--spring), opacity .35s; }
  .grab svg { height: 92%; width: auto; filter: drop-shadow(0 14px 12px rgba(38, 51, 43, .22)); }
  .scard:hover .grab svg { transform: translateY(-10px) rotate(-5deg); }
  .grab .lift { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: var(--card); font-size: .68rem; font-weight: 800; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .4s var(--spring); }
  .grab .lift svg { width: 12px; height: 12px; filter: none; }
  .scard:hover .lift { opacity: 1; transform: none; }
  .grab.holding svg { animation: wiggle .32s ease-in-out 2; }
  @keyframes wiggle { 25% { transform: rotate(-7deg) scale(1.06); } 75% { transform: rotate(7deg) scale(1.06); } }
  .art-src.lifted svg { opacity: 0; transform: translateY(-30px) scale(.3) rotate(-30deg); transition-duration: .25s; }
  .scard h3, .card h3 { font-size: 1.08rem; margin: 12px 0 2px; letter-spacing: -.02em; }
  .scard h3 a, .card h3 a { text-decoration: none; }
  .scard h3 a:hover, .card h3 a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .card-type { font-size: .78rem; font-weight: 700; color: var(--muted); margin: 0; }
  .card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 12px; }
  .price { font-weight: 850; letter-spacing: -.01em; }
  .rating { display: inline-flex; align-items: center; gap: 3px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .rating svg { width: 13px; height: 13px; color: var(--honey); }
  .card-scents { display: flex; gap: 4px; margin-top: 8px; }
  .card-scents i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .1); }
  .add-btn {
    position: relative; display: inline-grid; place-items: center; min-height: 40px; min-width: 84px; padding: 0 16px; overflow: hidden;
    border: 0; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font-weight: 800; font-size: .88rem; cursor: pointer;
    transition: transform .4s var(--spring), box-shadow .3s;
  }
  .add-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 20px -10px var(--btn); }
  .add-btn:active { transform: scale(.88); transition-duration: .1s; }
  .add-btn .ok, .add-big .ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--ok); color: var(--btn-ink); transform: translateY(105%); transition: transform .45s var(--spring); }
  .add-btn .ok svg, .add-big .ok svg { width: 18px; height: 18px; }
  .ok path { stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .4s .18s; }
  .done > .ok { transform: none; }
  .done > .ok path { stroke-dashoffset: 0; }
  .dots { position: relative; display: flex; justify-content: center; gap: 2px; margin: 0 auto; width: max-content; max-width: 100%; }
  .dot { position: relative; z-index: 1; width: 22px; height: 26px; border: 0; background: none; cursor: pointer; padding: 0; }
  .dot::before { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--line); transition: transform .35s var(--spring), background .3s; }
  .dot:hover::before { transform: scale(1.5); }
  .dot[aria-current="true"]::before { background: transparent; }
  .dot-pill { position: absolute; left: 0; top: 50%; width: 22px; height: 10px; margin-top: -5px; border-radius: 999px; background: var(--btn); transition: transform .5s var(--spring); }
  .dot-pill::after { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid var(--sage); opacity: .6; }
  .shelf-hint { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 0; font-size: .85rem; color: var(--muted); text-align: center; }
  .shelf-hint svg { width: 18px; height: 18px; animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(6px); } }

  /* ================= Routine quiz ================= */
  .routine-grid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 26px; align-items: start; }
  .rq { padding: 28px; }
  .rq fieldset { border: 0; margin: 0 0 18px; padding: 0; min-width: 0; }
  .rq legend { font-weight: 800; margin-bottom: 10px; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--solid);
    font-weight: 700; font-size: .92rem; cursor: pointer; transition: transform .4s var(--spring), background .3s, color .3s, border-color .3s;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--sage2); }
  .chip:active { transform: scale(.9); }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: transparent; transform: scale(1.05); }
  .q-err { min-height: 1.4em; margin: 10px 0 0; color: var(--danger); font-weight: 700; font-size: .9rem; }
  .r-out { min-width: 0; }
  .r-empty { display: grid; place-items: center; gap: 10px; min-height: 340px; padding: 26px; text-align: center; border: 2px dashed var(--line); border-radius: 28px; color: var(--muted); }
  .r-empty svg { width: 140px; animation: floaty 6s ease-in-out infinite; }
  .r-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; perspective: 900px; }
  .r-card { position: relative; padding: 14px; display: flex; flex-direction: column; animation: flipIn .9s var(--spring) both; animation-delay: var(--d, 0s); transform-origin: 50% 100%; }
  @keyframes flipIn { from { opacity: 0; transform: rotateX(-70deg) translateY(40px) scale(.9); } }
  .r-card .step { position: absolute; top: 12px; left: 12px; z-index: 1; padding: 4px 10px; border-radius: 999px; background: var(--honey); color: #2b2110; font-size: .72rem; font-weight: 850; }
  .r-card .r-art { height: 150px; display: grid; place-items: end center; border-radius: 18px; background: radial-gradient(circle at 50% 80%, var(--liq), transparent 64%), var(--chip); }
  .r-card .r-art svg { height: 88%; width: auto; transition: transform .6s var(--spring), opacity .3s; }
  .r-card h3 { font-size: 1rem; margin: 10px 0 4px; }
  .r-card p { font-size: .86rem; color: var(--muted); margin: 0 0 8px; }
  .r-card a { font-size: .85rem; font-weight: 800; margin-top: auto; }
  .r-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; animation: rise .8s var(--soft) .5s both; }

  /* ================= Ingredients ================= */
  .ing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 30px; }
  .ing { padding: 22px; transition: transform .6s var(--spring), box-shadow .4s; }
  .ing:hover { transform: translateY(-8px) rotate(-1deg); }
  .ing .ing-art { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 14px; background: radial-gradient(circle at 35% 30%, var(--solid), var(--chip)); }
  .ing svg { width: 92px; height: 92px; }
  .ing .draw { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.6s var(--soft) calc(var(--d, 0s) + .25s); }
  .ing .fillin { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: 50% 80%; transition: opacity .8s calc(var(--d, 0s) + .9s), transform 1s var(--spring) calc(var(--d, 0s) + .9s); }
  .ing.in .draw { stroke-dashoffset: 0; }
  .ing.in .fillin { opacity: 1; transform: none; }
  .ing h3 { font-size: 1.15rem; margin-bottom: 4px; }
  .ing .from { font-size: .78rem; font-weight: 800; color: var(--sage2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .ing p:last-child { margin: 0; color: var(--muted); font-size: .92rem; }

  /* ================= Hydration meter ================= */
  .hyd-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 48px; align-items: center; }
  .meter { position: relative; width: min(340px, 100%); margin-inline: auto; aspect-ratio: 1; }
  .meter svg { width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--chip); stroke-width: 14; }
  .ring-fill { fill: none; stroke: url(#hydRing); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 2.2s var(--soft) .2s; }
  .meter.in .ring-fill { stroke-dashoffset: 28; }
  .hyd-water { transform: translateY(196px); transition: transform 2.4s var(--spring) .2s; }
  .meter.in .hyd-water { transform: translateY(76px); }
  .wv { animation: wave 3.4s linear infinite; }
  .wv2 { animation-duration: 5s; animation-direction: reverse; opacity: .55; }
  @keyframes wave { to { transform: translateX(40px); } }
  .meter-num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .meter-num b { font-size: clamp(2.6rem, 9vw, 3.6rem); letter-spacing: -.05em; line-height: 1; color: #fff; text-shadow: 0 2px 14px rgba(38, 51, 43, .45); }
  .meter-num span { font-size: .8rem; font-weight: 800; color: #fff; text-shadow: 0 1px 8px rgba(38, 51, 43, .5); }
  .bars { display: grid; gap: 16px; margin: 24px 0 18px; }
  .bar-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 750; margin-bottom: 6px; }
  .bar-track { height: 12px; border-radius: 99px; background: var(--chip); overflow: hidden; }
  .bar-track i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--sage), var(--sage2) 60%, var(--honey)); transition: width 1.8s var(--spring); transition-delay: var(--d, 0s); }
  .bars.in .bar-track i { width: var(--w); }

  /* ================= Reviews ================= */
  .rev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
  .rev { padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: transform .6s var(--spring); }
  .rev:hover { transform: translateY(-6px) rotate(.8deg); }
  .stars { display: flex; gap: 2px; color: var(--honey); }
  .stars svg { width: 18px; height: 18px; }
  .rev .stars svg { opacity: 0; transform: scale(0) rotate(-90deg); transition: opacity .3s, transform .6s var(--spring); transition-delay: calc(var(--d, 0s) + var(--s) * 90ms + .3s); }
  .rev.in .stars svg { opacity: 1; transform: none; }
  .stars svg.dim { color: var(--line); }
  .rev blockquote { margin: 0; font-size: 1.02rem; }
  .who { display: flex; align-items: center; gap: 10px; margin-top: auto; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 850; color: #26332b; background: linear-gradient(135deg, var(--a1), var(--a2)); flex: none; }
  .who b { display: block; line-height: 1.2; }
  .who small { color: var(--muted); }

  /* ================= FAQ ================= */
  .faq-list { display: grid; gap: 12px; margin-top: 26px; }
  .faq-item { border-radius: 22px; overflow: hidden; }
  .faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 0; background: none; text-align: left; font-weight: 800; font-size: 1.04rem; cursor: pointer; }
  .faq-q .pm { position: relative; width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--chip); transition: transform .5s var(--spring), background .3s; }
  .faq-q .pm::before, .faq-q .pm::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; margin: -1px 0 0 -6px; border-radius: 2px; background: currentColor; transition: transform .45s var(--spring); }
  .faq-q .pm::after { transform: rotate(90deg); }
  .faq-q[aria-expanded="true"] .pm { transform: rotate(180deg); background: var(--honey); color: #2b2110; }
  .faq-q[aria-expanded="true"] .pm::after { transform: rotate(0); }
  .faq-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s var(--soft); }
  .faq-a > div { overflow: hidden; visibility: hidden; transition: visibility 0s .55s; }
  .faq-item.open .faq-a > div { visibility: visible; transition: none; }
  .faq-a p { margin: 0; padding: 0 20px 20px; color: var(--muted); opacity: 0; transform: translateY(-8px); transition: opacity .4s, transform .5s var(--spring); }
  .faq-item.open .faq-a { grid-template-rows: 1fr; }
  .faq-item.open .faq-a p { opacity: 1; transform: none; transition-delay: .1s; }

  /* ================= Newsletter + footer ================= */
  .news { position: relative; overflow: hidden; padding: clamp(26px, 5vw, 50px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
  .news::before { content: ""; position: absolute; width: 340px; aspect-ratio: 1; right: -90px; top: -120px; background: radial-gradient(circle, var(--blush), transparent 66%); animation: morph 14s infinite alternate; pointer-events: none; }
  .news > * { position: relative; }
  .news-form { display: flex; flex-wrap: wrap; gap: 10px; }
  .news-form input { flex: 1 1 200px; min-width: 0; }
  .news-btn { min-width: 150px; }
  .news-btn .dots3 { display: none; gap: 4px; }
  .news-btn .dots3 i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: hop .8s infinite; }
  .news-btn .dots3 i:nth-child(2) { animation-delay: .12s; }
  .news-btn .dots3 i:nth-child(3) { animation-delay: .24s; }
  .news-btn.working .dots3 { display: inline-flex; }
  .news-btn.working .lbl { display: none; }
  .news-btn.done { background: var(--ok); color: var(--btn-ink); }
  @keyframes hop { 40% { transform: translateY(-6px); } }
  .foot { margin-top: 40px; padding: 40px 0 90px; border-top: 1px solid var(--line); }
  .foot-in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 22px; }
  .foot-links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .foot-links a, .foot-links button { border: 0; background: none; padding: 4px 0; font-weight: 700; color: var(--muted); text-decoration: none; cursor: pointer; }
  .foot-links a:hover, .foot-links button:hover { color: var(--ink); }

  /* ================= Form fields (shared) ================= */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label, .lbl-t { font-weight: 750; font-size: .9rem; }
  .input, .field input, .field select, .field textarea {
    width: 100%; min-height: 50px; padding: 0 16px; border-radius: 16px; border: 1.5px solid var(--line);
    background: var(--solid); font-size: 1rem; transition: border-color .3s, box-shadow .3s;
  }
  .field textarea { padding: 12px 16px; min-height: 84px; resize: vertical; }
  .input:hover, .field input:hover, .field select:hover, .field textarea:hover { border-color: var(--sage2); }
  .field.bad input, .field.bad select, .field.bad textarea, .input.bad { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(178, 59, 42, .12); }
  .err { min-height: 0; margin: 0; color: var(--danger); font-size: .84rem; font-weight: 700; }
  .err:empty { display: none; }

  /* ================= Page heads ================= */
  .page { padding: 40px 0 40px; }
  .page-head { margin-bottom: 26px; }
  .page-head h1 { font-size: clamp(2.1rem, 5.6vw, 3.6rem); letter-spacing: -.045em; }
  .page-head > * { animation: rise .9s var(--spring) both; }
  .page-head > *:nth-child(2) { animation-delay: .08s; }
  .page-head > *:nth-child(3) { animation-delay: .16s; }

  /* ================= Shop listing ================= */
  .type-tabs { position: relative; display: flex; gap: 2px; padding: 4px; max-width: 100%; width: max-content; overflow-x: auto; scrollbar-width: none; border-radius: 999px; background: var(--chip); margin-bottom: 22px; }
  .type-tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; z-index: 1; flex: none; padding: 9px 16px; border: 0; border-radius: 999px; background: none; font-weight: 750; font-size: .92rem; color: var(--muted); cursor: pointer; transition: color .35s; }
  .tab[aria-pressed="true"] { color: var(--btn-ink); }
  .tab-marker { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 50px; border-radius: 999px; background: var(--btn); transition: transform .55s var(--spring), width .55s var(--spring); }
  .shop-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 26px; align-items: start; }
  .filters { position: sticky; top: 84px; padding: 22px; border-radius: 26px; }
  .f-group { border: 0; padding: 0; margin: 0 0 22px; min-width: 0; }
  .f-group legend { font-weight: 850; padding: 0; margin-bottom: 10px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; font-weight: 600; }
  .check input { width: 20px; height: 20px; accent-color: var(--sage2); margin: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .74rem; font-weight: 700; color: var(--muted); }
  .sw {
    position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .85), transparent 42%), var(--c);
    box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .1); transition: transform .45s var(--spring), box-shadow .3s;
  }
  .sw:hover { transform: scale(1.1) rotate(-8deg); }
  .sw:active { transform: scale(.85); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--page), 0 0 0 5.5px var(--ink); transform: scale(1.06); }
  .sw::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 8px; margin: -6px 0 0 -7px; border: solid #26332b; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) scale(0); transition: transform .4s var(--spring); }
  .sw[aria-pressed="true"]::after { transform: rotate(-45deg) scale(1); }
  .range { width: 100%; accent-color: var(--sage2); }
  .range-val { font-weight: 800; }
  .shop-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .shop-bar .count { margin: 0; font-weight: 750; color: var(--muted); }
  .shop-bar select { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--solid); font-weight: 700; max-width: 100%; }
  .filter-toggle { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
  .card { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 10px 10px 14px; border-radius: 26px; transition: transform .55s var(--spring); }
  .card:hover { transform: translateY(-6px); }
  .card-art { display: grid; place-items: end center; aspect-ratio: 1 / 1.02; padding-bottom: 8px; border-radius: 20px; background: radial-gradient(circle at 50% 80%, var(--liq) -30%, transparent 64%), linear-gradient(160deg, var(--chip), transparent); text-decoration: none; }
  .card-art svg { height: 86%; width: auto; filter: drop-shadow(0 12px 10px rgba(38, 51, 43, .2)); }
  .card:hover .card-art svg { transform: translateY(-8px) rotate(4deg) scale(1.04); }
  .card-body { display: flex; flex-direction: column; flex: 1; padding: 0 4px; min-width: 0; }
  .card .card-row { flex-wrap: wrap; }
  .new-tag { position: absolute; top: 18px; left: 18px; padding: 3px 9px; border-radius: 999px; background: var(--honey); color: #2b2110; font-size: .7rem; font-weight: 850; }
  .empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 40px 20px; border-radius: 26px; border: 2px dashed var(--line); }
  .empty svg { width: 120px; animation: floaty 5s ease-in-out infinite; }
  @media (max-width: 860px) {
    .shop-layout { grid-template-columns: 1fr; }
    .filters { position: static; display: none; }
    .filters.open { display: block; animation: dropIn .55s var(--spring); }
    .filter-toggle { display: inline-flex; min-height: 44px; padding: 0 18px; }
  }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-16px) scale(.97); } }
  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 8px 8px 12px; border-radius: 22px; }
    .card h3 { font-size: .95rem; }
    .card .add-btn { min-width: 0; width: 100%; }
    .rating { display: none; }
  }

  /* ================= Product page ================= */
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; font-size: .86rem; font-weight: 700; color: var(--muted); }
  .crumbs li + li::before { content: "/"; margin-right: 6px; opacity: .5; }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; }
  .pdp-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(22px, 4vw, 48px); align-items: start; }
  .pdp-art { position: sticky; top: 84px; aspect-ratio: 1; border-radius: 36px; overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 50% 74%, var(--liq) -10%, transparent 58%), linear-gradient(160deg, var(--chip), var(--card)); border: 1px solid var(--glass-b); box-shadow: var(--shadow); animation: rise .9s var(--spring) both; }
  .pdp-art .halo { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--liq), transparent 66%); opacity: .55; animation: morph 12s infinite alternate; transition: background .6s; }
  .pdp-art .plinth { position: absolute; bottom: 9%; width: 56%; height: 9%; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, var(--solid), var(--pool2)); box-shadow: 0 16px 30px -14px rgba(38, 51, 43, .5); }
  .pdp-bottle { position: relative; height: 74%; margin-bottom: 4%; display: grid; place-items: end center; }
  .pdp-bottle svg { height: 100%; width: auto; filter: drop-shadow(0 22px 22px rgba(38, 51, 43, .3)); animation: floaty 6s ease-in-out infinite; --r0: -2deg; --r1: 2deg; }
  .pdp-bottle.lifted svg { animation: none; opacity: 0; transform: translateY(-40px) scale(.4); transition: opacity .25s, transform .3s; }
  .liq { transform-box: fill-box; transform-origin: 50% 100%; }
  .liq.fill { animation: fillUp 1.3s var(--spring); }
  @keyframes fillUp { from { transform: scaleY(.04); } }
  .liq rect, .liq path { transition: fill .6s; }
  .bottle stop { transition: stop-color .6s; }
  .bub { animation: bubIn 2.6s linear infinite; }
  @keyframes bubIn { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-62px); opacity: 0; } }
  .scent-tag { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; font-weight: 800; font-size: .86rem; }
  .scent-tag i { width: 24px; height: 24px; border-radius: 50%; background: var(--liq); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .6); transition: background .5s; }
  .scent-tag.pop { animation: pop .6s var(--spring); }
  @keyframes pop { 40% { transform: scale(1.15) rotate(-3deg); } }
  .pdp-info { min-width: 0; animation: rise .9s var(--spring) .1s both; }
  .pdp-info h1 { font-size: clamp(2rem, 5vw, 3.3rem); letter-spacing: -.045em; margin-bottom: .25em; }
  .pdp-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin: 8px 0 14px; }
  .pdp-price b { font-size: 1.7rem; letter-spacing: -.03em; }
  .opt-group { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
  .opt-group legend { display: flex; justify-content: space-between; width: 100%; font-weight: 850; padding: 0; margin-bottom: 10px; }
  .opt-group legend span { font-weight: 650; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 16px 8px 10px; border-radius: 18px;
    border: 1.5px solid var(--line); background: var(--solid); cursor: pointer; text-align: left;
    transition: transform .45s var(--spring), border-color .3s, box-shadow .3s;
  }
  .opt:hover { transform: translateY(-3px); border-color: var(--sage2); }
  .opt:active { transform: scale(.94); }
  .opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink), 0 10px 20px -14px var(--ink); }
  .opt .vial { width: 18px; border-radius: 5px 5px 7px 7px; background: linear-gradient(var(--chip), var(--sage)); box-shadow: inset 0 0 0 1.5px var(--line); transition: transform .45s var(--spring); }
  .opt[aria-pressed="true"] .vial { transform: scale(1.12) rotate(-6deg); background: linear-gradient(var(--blush), var(--honey)); }
  .opt b { display: block; line-height: 1.15; }
  .opt small { color: var(--muted); font-weight: 650; }
  .sw-row { display: flex; flex-wrap: wrap; gap: 14px; }
  .buy-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .qty { display: inline-flex; align-items: center; border-radius: 999px; border: 1.5px solid var(--line); background: var(--solid); }
  .qty button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: none; font-size: 1.25rem; font-weight: 700; cursor: pointer; transition: transform .35s var(--spring), background .2s; }
  .qty button:hover { background: var(--chip); }
  .qty button:active { transform: scale(.8); }
  .qty button[disabled] { opacity: .35; cursor: default; }
  .qty output { min-width: 26px; text-align: center; font-weight: 850; }
  .qty output.pop { animation: pop .45s var(--spring); }
  .add-big { flex: 1 1 220px; min-height: 56px; }
  .add-big.press { transform: scale(.94, .9); transition-duration: .15s; }
  .add-big.working { pointer-events: none; }
  .add-big .ok { border-radius: inherit; font-weight: 800; }
  .perks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 22px 0; }
  .perk { padding: 12px; border-radius: 18px; background: var(--chip); font-size: .8rem; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  .perk svg { width: 22px; height: 22px; color: var(--sage2); }
  .ptabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--chip); width: max-content; max-width: 100%; position: relative; }
  .ptab { position: relative; z-index: 1; padding: 8px 14px; border: 0; border-radius: 999px; background: none; font-weight: 750; cursor: pointer; color: var(--muted); transition: color .3s; }
  .ptab[aria-selected="true"] { color: var(--btn-ink); }
  .ptab-marker { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--btn); transition: transform .5s var(--spring), width .5s var(--spring); }
  .ppanel { padding: 16px 4px 0; animation: rise .5s var(--soft); }
  .ppanel ul { margin: 0; padding-left: 1.1em; }
  .related { margin-top: 70px; }
  @media (max-width: 860px) {
    .pdp-grid { grid-template-columns: 1fr; }
    .pdp-art { position: relative; top: 0; max-width: 520px; width: 100%; justify-self: center; }
  }
  @media (max-width: 420px) { .perks { grid-template-columns: 1fr; } .perk { flex-direction: row; align-items: center; } }

  /* ================= Bag ================= */
  .bag-grid, .co-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 370px); gap: 24px; align-items: start; }
  .line { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; margin-bottom: 12px; border-radius: 24px; animation: rise .7s var(--spring) both; animation-delay: var(--d, 0s); }
  .line-art { height: 104px; border-radius: 18px; display: grid; place-items: end center; padding-bottom: 6px; background: radial-gradient(circle at 50% 80%, var(--liq), transparent 66%), var(--chip); }
  .line-art svg { height: 90%; width: auto; }
  .line h3 { font-size: 1.05rem; margin: 0 0 2px; }
  .line h3 a { text-decoration: none; }
  .line .meta { margin: 0 0 10px; font-size: .86rem; color: var(--muted); }
  .line-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .line-total { margin-left: auto; font-weight: 850; }
  .line-total.pop { animation: pop .45s var(--spring); }
  .rm { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--chip); cursor: pointer; transition: transform .4s var(--spring), background .3s, color .3s; }
  .rm svg { width: 18px; height: 18px; }
  .rm:hover { background: var(--danger); color: #fff; transform: rotate(-12deg) scale(1.08); }
  .summary { position: sticky; top: 84px; padding: 24px; }
  .summary h2 { font-size: 1.4rem; }
  .ship { margin-bottom: 16px; padding: 14px; border-radius: 18px; background: var(--chip); }
  .ship p { margin: 0 0 8px; font-size: .88rem; font-weight: 700; }
  .ship-bar { position: relative; height: 10px; border-radius: 99px; background: var(--card); }
  .ship-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--sage), var(--sage2), var(--honey)); transition: width .8s var(--spring); }
  .ship-bar i::after { content: ""; position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50% 0; background: var(--sage2); transform: rotate(45deg); box-shadow: 0 0 0 3px var(--card); }
  .sums { display: grid; gap: 10px; margin: 0 0 16px; }
  .sums .row { display: flex; justify-content: space-between; gap: 10px; }
  .sums .row b { font-weight: 800; }
  .sum-total { padding-top: 12px; border-top: 1.5px dashed var(--line); font-size: 1.2rem; }
  .sum-total b { font-size: 1.35rem; letter-spacing: -.02em; }
  .disc-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .55s var(--spring), opacity .4s; }
  .disc-wrap > div { overflow: hidden; }
  .disc-wrap { margin-top: -10px; transition: grid-template-rows .55s var(--spring), opacity .4s, margin-top .4s; }
  .disc-wrap.on { margin-top: 0; }
  .disc-wrap.on { grid-template-rows: 1fr; opacity: 1; }
  .disc-wrap .row { color: var(--ok); }
  .promo { margin: 0 0 18px; }
  .promo-row { display: flex; gap: 8px; margin-top: 6px; }
  .promo-row .input { flex: 1; min-width: 0; min-height: 46px; text-transform: uppercase; }
  .promo-row .btn { min-height: 46px; padding: 0 18px; }
  .promo-hint { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }
  .promo-hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; color: var(--ink); background: var(--chip); padding: 1px 6px; border-radius: 6px; }
  .promo-chip { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 16px; background: var(--chip); font-weight: 800; animation: pop .6s var(--spring); }
  .promo-chip button { border: 0; background: var(--solid); border-radius: 999px; padding: 6px 12px; font-weight: 750; cursor: pointer; }
  .mini { display: grid; gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }
  .mini li { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .88rem; }
  .mini .m-art { position: relative; height: 54px; border-radius: 12px; background: var(--chip); display: grid; place-items: end center; padding-bottom: 3px; }
  .mini .m-art svg { height: 88%; width: auto; }
  .mini .m-art em { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 99px; background: var(--btn); color: var(--btn-ink); font-style: normal; font-size: .7rem; font-weight: 850; display: grid; place-items: center; }
  .mini small { display: block; color: var(--muted); }
  .bag-empty { display: grid; place-items: center; text-align: center; padding: 30px 0 20px; }
  .bag-empty svg { width: 190px; margin-bottom: 10px; }
  .bag-empty .pouch { animation: floaty 5s ease-in-out infinite; }
  .bag-empty .cta { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  @media (max-width: 900px) {
    .bag-grid, .co-grid { grid-template-columns: 1fr; }
    .summary { position: static; }
  }
  @media (max-width: 420px) { .line { grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 12px; } .line-art { height: 86px; } }

  /* ================= Checkout ================= */
  .steps { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; font-size: .82rem; font-weight: 800; color: var(--muted); flex-wrap: wrap; }
  .steps li { display: flex; align-items: center; gap: 8px; }
  .steps li i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: var(--chip); }
  .steps li.on i { background: var(--btn); color: var(--btn-ink); }
  .steps li.done i { background: var(--ok); color: var(--btn-ink); }
  .steps .ln { width: 34px; height: 2px; background: var(--line); position: relative; overflow: hidden; }
  .steps .ln::after { content: ""; position: absolute; inset: 0; background: var(--ok); transform: scaleX(0); transform-origin: left; animation: lnFill .9s var(--soft) .4s forwards; }
  @keyframes lnFill { to { transform: none; } }
  .co-form { padding: clamp(18px, 4vw, 30px); }
  .co-form fieldset { border: 0; margin: 0 0 22px; padding: 0; min-width: 0; }
  .co-form legend { font-size: 1.15rem; font-weight: 850; padding: 0; margin-bottom: 12px; }
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .fgrid .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }
  .pays { display: grid; gap: 10px; }
  .pay { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--solid); cursor: pointer; transition: border-color .3s, transform .4s var(--spring), background .3s; }
  .pay:hover { transform: translateY(-2px); }
  .pay input { width: 20px; height: 20px; margin: 0; accent-color: var(--sage2); flex: none; }
  .pay b { display: block; }
  .pay small { color: var(--muted); }
  .pay svg { width: 30px; height: 30px; margin-left: auto; color: var(--sage2); flex: none; }
  .pay.sel { border-color: var(--ink); background: var(--chip); }
  .pay-extra { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--spring); }
  .pay-extra > div { overflow: hidden; visibility: hidden; transition: visibility 0s .5s; }
  .pay-extra.on > div { visibility: visible; transition: none; }
  .pay-extra.on { grid-template-rows: 1fr; }
  .pay-extra .inner { padding-top: 14px; }
  .fake-card { position: relative; width: min(300px, 100%); aspect-ratio: 1.6; margin-bottom: 14px; padding: 18px; border-radius: 20px; color: #fff; overflow: hidden; background: linear-gradient(135deg, #3d5a45, #26332b 60%, #6f8f66); box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; }
  .fake-card::before { content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -70px; border-radius: 50%; background: radial-gradient(circle, rgba(232, 176, 75, .7), transparent 66%); }
  .fake-card .num { position: relative; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(.9rem, 4.4vw, 1.12rem); letter-spacing: .08em; }
  .fake-card .chipc { position: relative; width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #f6d98b, #c9962f); }
  .fake-card .row2 { position: relative; display: flex; justify-content: space-between; font-size: .78rem; opacity: .9; }
  .bank { padding: 14px; border-radius: 16px; background: var(--chip); font-size: .9rem; }
  .bank p { margin: 0 0 4px; }
  .place { width: 100%; min-height: 58px; font-size: 1.05rem; white-space: normal; text-align: center; }
  .place .spin { display: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  .place.working .spin { display: block; }
  .place.working { pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .place-prog { height: 6px; margin-top: 12px; border-radius: 9px; background: var(--chip); overflow: hidden; opacity: 0; transition: opacity .3s; }
  .place-prog.on { opacity: 1; }
  .place-prog i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--sage2), var(--honey)); transition: width .7s var(--soft); }
  .place-step { min-height: 1.5em; margin: 10px 0 0; font-weight: 700; text-align: center; }

  /* ================= Done ================= */
  .done-wrap { text-align: center; max-width: 640px; margin-inline: auto; }
  .done-badge { width: 170px; height: 170px; margin: 0 auto 10px; }
  .done-badge .c1 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1s var(--soft) .2s forwards; }
  .done-badge .ck { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .6s var(--soft) .9s forwards; }
  .done-badge .bl { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); animation: popIn .7s var(--spring) forwards; }
  @keyframes popIn { to { transform: none; } }
  .done-card { text-align: left; padding: 22px; margin: 22px 0; }
  .order-no { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--chip); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }

  /* ================= Responsive: home ================= */
  @media (max-width: 860px) {
    .hero { padding-top: 22px; }
    .hero-grid { grid-template-columns: 1fr; }
    .hero-stage { max-width: 420px; }
    .routine-grid, .hyd-grid, .news { grid-template-columns: 1fr; }
    .sec { padding: 64px 0; }
  }
  @media (max-width: 640px) {
    .r-steps { grid-template-columns: 1fr; }
    .r-card { flex-direction: row; flex-wrap: wrap; gap: 0 14px; }
    .r-card .r-art { width: 110px; height: 130px; flex: none; }
    .r-card .r-txt { flex: 1 1 140px; min-width: 0; }
    .tag-float { font-size: .7rem; padding: 6px 10px; }
    .rq { padding: 20px; }
  }

  /* ================= Reduced motion: keep every function, drop big motion ================= */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; scroll-behavior: auto !important; }
    .ch { opacity: 1; transform: none; filter: none; }
    [data-reveal] { opacity: 1; transform: none; }
    .bubbles, .drop-lane, .splash, .ripples, .veil { display: none; }
    .marquee-track { animation: none; }
  }
</style>
</head>

<div class="bgdeco" aria-hidden="true"><i></i><i></i></div>
<button class="skip" type="button" data-skip>Skip to content</button>

<!-- ================= Header: logo, nav with sliding marker, bag (also the drop zone) ================= -->
<header class="top">
  <div class="top-in wrap">
    <a class="logo" href="#/" aria-label="Dewroot home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="logoG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd3b2"/><stop offset="1" stop-color="#5f8a5a"/></linearGradient></defs>
        <path d="M16 4C16 4 6 15 6 21a10 10 0 0 0 20 0C26 15 16 4 16 4Z" fill="url(#logoG)"/>
        <path d="M16 9c3-5 8-6 11-5-1 4-5 7-11 5Z" fill="#e8b04b"/>

        <path d="M12.5 21.5h15" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M20 33.5c-3.4-1.2-4.4-4.6-3-7.6 3.2.2 5.1 3.6 3 7.6Z" fill="#fff" opacity=".85"/>
        <g class="bag-lid">
          <path d="M15 14.5v-3a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="7.5" y="13.5" width="25" height="5" rx="2.5" style="fill:var(--ink)"/>

  <div class="wrap foot-in">

      <a class="logo" href="#/" aria-label="Dewroot home, footer"><span>dewroot</span></a>
      <p class="muted" style="max-width:30em;margin-top:8px">Plant-first skincare, mixed in small batches in Lahore and delivered across Pakistan. This is a demo store: prices are in PKR and no real orders are placed.</p>
    </div>

      <a href="#/shop">All products</a>
      <button type="button" data-jump="routine">Routine quiz</button>
      <button type="button" data-jump="ingredients">Ingredients</button>
      <button type="button" data-jump="faq">Help</button>
      <a href="#/bag">Your bag</a>

        if (h) h.focus();
      } else {
        updateTotals(true);
        var f = next && next.isConnected ? next.querySelector(".rm") : null;
        (f || $("h1", view)).focus();
      }
    };
    if (RM) { finish(); return; }
    var h = row.offsetHeight;
    row.style.overflow = "hidden";
    var a = row.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(80px) rotate(3deg) scale(.94)" }], { duration: 320, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    onDone(a, function () {
      var b = row.animate([{ height: h + "px", marginBottom: "12px", paddingTop: "14px", paddingBottom: "14px" }, { height: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }], { duration: 280, easing: "ease-in-out", fill: "forwards" });
      onDone(b, finish, 500);
    }, 500);
  }

  /* ================= Checkout ================= */
  function field(id, label, control, cls) {
    return '<div class="field' + (cls ? " " + cls : "") + '"><label for="' + id + '">' + label + "</label>" +
      control.replace(' id="' + id + '"', ' id="' + id + '" aria-describedby="' + id + 'Err"') + '<p class="err" id="' + id + 'Err" aria-live="polite"></p></div>';
  }
  function payOpt(v, title, sub, icon, on) {
    return '<label class="pay' + (on ? " sel" : "") + '"><input type="radio" name="pay" value="' + v + '"' + (on ? " checked" : "") + "><span><b>" + title + "</b><small>" + sub + "</small></span>" + icon + "</label>";
  }
  function vCheckout() {
    if (!S.bag.length) {
      view.innerHTML = emptyBag("Nothing to check out yet", "Your bag is empty. Add a bottle or two first, then come back here.");
      return "Checkout";
    }
    var t = totals();
    view.innerHTML = '<section class="wrap page"><header class="page-head">' +
      '<ol class="steps" aria-label="Checkout progress"><li class="done"><i>' + ICON.check.replace("<svg ", '<svg style="width:14px;height:14px" ') + '</i>Bag</li><li class="ln" aria-hidden="true"></li><li class="on" aria-current="step"><i>2</i>Details</li><li class="ln" aria-hidden="true" style="opacity:.5"></li><li><i>3</i>Done</li></ol>' +
      '<h1 tabindex="-1">Checkout</h1><p class="muted">Delivery anywhere in Pakistan. Pay at your door, by card or by bank transfer.</p></header>' +
      '<div class="co-grid"><form class="co-form glass" id="coForm" novalidate>' +
      '<fieldset><legend>Contact</legend><div class="fgrid">' +
      field("coName", "Full name", '<input id="coName" autocomplete="name" placeholder="Ayesha Khan">', "full") +
      field("coPhone", "Mobile number", '<input id="coPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0300-1234567">') +
      field("coEmail", "Email", '<input id="coEmail" type="email" autocomplete="email" placeholder="ayesha@example.pk">') +
      "</div></fieldset>" +
      '<fieldset><legend>Delivery</legend><div class="fgrid">' +
      field("coAddr", "Street address", '<textarea id="coAddr" autocomplete="street-address" placeholder="House 12, Street 4, Gulberg III"></textarea>', "full") +
      field("coCity", "City", '<select id="coCity" autocomplete="address-level2"><option value="">Choose a city</option>' + CITIES.map(function (c) { return "<option>" + c + "</option>"; }).join("") + "</select>") +
      field("coNote", "Delivery note (optional)", '<input id="coNote" placeholder="Ring the bell twice">') +
      "</div></fieldset>" +
      '<fieldset><legend>Payment</legend><div class="pays">' +
      payOpt("cod", "Cash on delivery", "Pay when the parcel reaches you", ICON.cash, true) +
      payOpt("card", "Debit or credit card", "Demo only, nothing is charged", ICON.card) +
      payOpt("bank", "Bank transfer", "We ship once it clears", ICON.bank) + "</div>" +
      '<div class="pay-extra" id="xCard"><div><div class="inner"><div class="fake-card" aria-hidden="true"><span class="chipc"></span><span class="num" id="fcNum">•••• •••• •••• ••••</span><span class="row2"><span id="fcName">YOUR NAME</span><span id="fcExp">MM/YY</span></span></div><div class="fgrid">' +
      field("ccNum", "Card number", '<input id="ccNum" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242" maxlength="19">', "full") +
      field("ccExp", "Expiry", '<input id="ccExp" inputmode="numeric" autocomplete="off" placeholder="MM/YY" maxlength="5">') +
      field("ccCvc", "CVC", '<input id="ccCvc" inputmode="numeric" autocomplete="off" placeholder="123" maxlength="4">') +
      "</div></div></div></div>" +
      '<div class="pay-extra" id="xBank"><div><div class="inner"><div class="bank"><p><b>Dewroot Botanicals (demo account)</b></p><p>Account 0123 4567 8901 2345</p><p class="muted">Use your order number as the reference.</p></div></div></div></div>' +
      "</fieldset>" +
      '<button class="btn btn-main place" type="submit" id="placeBtn"><span class="spin" aria-hidden="true"></span><span id="placeLbl">Place order · ' + fmt(t.total) + "</span></button>" +
      '<div class="place-prog" aria-hidden="true"><i></i></div><p class="place-step" id="placeStep" aria-live="polite"></p></form>' +
      '<aside class="summary glass" aria-labelledby="sumH"><h2 id="sumH">Your order</h2><ul class="mini">' + S.bag.map(miniHTML).join("") + "</ul>" + SHIP + SUMS +
      '<a href="#/bag" style="font-weight:800;font-size:.9rem">Edit bag</a></aside></div></section>';
    updateTotals(false);

    var form = $("#coForm", view), placing = false;
    var payVal = function () { var c = $('input[name="pay"]:checked', form); return c ? c.value : "cod"; };
    var rules = {
      coName: function (v) { return v.trim().length >= 3 ? "" : "Please enter your full name."; },
      coPhone: function (v) { return /^03\d{2}-?\d{7}$/.test(v.replace(/\s+/g, "")) ? "" : "Use a Pakistani mobile number like 0300-1234567."; },
      coEmail: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "" : "Please enter a valid email address."; },
      coAddr: function (v) { return v.trim().length >= 8 ? "" : "Please enter your full street address."; },
      coCity: function (v) { return v ? "" : "Choose your city."; },
      ccNum: function (v) { return payVal() !== "card" || v.replace(/\D/g, "").length === 16 ? "" : "The card number needs 16 digits."; },
      ccExp: function (v) {
        if (payVal() !== "card") return "";
        var m = /^(0[1-9]|1[0-2])\/(\d{2})$/.exec(v.trim());
        return m && +m[2] >= 26 ? "" : "Use MM/YY with a date in the future.";
      },
      ccCvc: function (v) { return payVal() !== "card" || /^\d{3,4}$/.test(v.trim()) ? "" : "The CVC is 3 or 4 digits."; }
    };
    function check(id) {
      var el = $("#" + id, form), msg = rules[id](el.value), fl = el.closest(".field");
      fl.classList.toggle("bad", !!msg);
      $("#" + id + "Err", form).textContent = msg;
      if (msg) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid");
      return !msg;
    }
    Object.keys(rules).forEach(function (id) {
      var el = $("#" + id, form);
      el.addEventListener("blur", function () { if (el.value) check(id); });
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function () { if (el.closest(".field").classList.contains("bad")) check(id); });
    });
    // Live card preview with simple formatting
    var num = $("#ccNum", form), exp = $("#ccExp", form), nameIn = $("#coName", form);
    num.addEventListener("input", function () {
      var d = num.value.replace(/\D/g, "").slice(0, 16);
      num.value = d.replace(/(\d{4})(?=\d)/g, "$1 ");
      var shown = (d + "•".repeat(16 - d.length)).replace(/(.{4})(?=.)/g, "$1 ");
      $("#fcNum", form).textContent = shown;
    });
    exp.addEventListener("input", function () {
      var d = exp.value.replace(/\D/g, "").slice(0, 4);
      exp.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
      $("#fcExp", form).textContent = exp.value || "MM/YY";
    });
    nameIn.addEventListener("input", function () { $("#fcName", form).textContent = (nameIn.value.trim() || "Your name").toUpperCase().slice(0, 22); });
    form.addEventListener("change", function (e) {
      if (e.target.name !== "pay") return;
      var v = payVal();
      $$(".pay", form).forEach(function (l) { l.classList.toggle("sel", l.querySelector("input").checked); });
      $("#xCard", form).classList.toggle("on", v === "card");
      $("#xBank", form).classList.toggle("on", v === "bank");
      if (v !== "card") ["ccNum", "ccExp", "ccCvc"].forEach(check);
    });
    // Place order: idle -> working (three timed stages) -> confirmation
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (placing) return;
      var bad = Object.keys(rules).filter(function (id) { return !check(id); });
      var stepEl = $("#placeStep", form);
      if (bad.length) {
        var first = $("#" + bad[0], form);
        first.focus();
        restart(first.closest(".field"), "shake");
        stepEl.textContent = "Please fix " + bad.length + (bad.length === 1 ? " field" : " fields") + " above.";
        return;
      }
      placing = true;
      var myTok = token, btn = $("#placeBtn", form), prog = $(".place-prog", form), bar = prog.querySelector("i"), lbl = $("#placeLbl", form);
      btn.classList.add("working");
      prog.classList.add("on");
      var stages = ["Checking stock in Lahore…", "Wrapping your bottles in leaves…", "Confirming your order…"], gap = RM ? 150 : 750;
      stages.forEach(function (s, i) {
        setTimeout(function () { if (myTok !== token) return; stepEl.textContent = s; lbl.textContent = s; bar.style.width = ((i + 1) / stages.length * 100).toFixed(0) + "%"; }, gap * i);
      });
      setTimeout(function () {
        if (myTok !== token) return; // shopper left the page: no order
        var tt = totals();
        S.order = {
          no: "DR-" + Math.floor(10000 + Math.random() * 89999),
          name: nameIn.value.trim().split(/\s+/)[0],
          city: $("#coCity", form).value,
          pay: payVal(), total: tt.total, n: tt.n,
          lines: S.bag.map(function (l) { return { id: l.id, size: l.size, scent: l.scent, qty: l.qty }; })
        };
        S.bag = []; S.promo = null; pendingQty = 0;
        save(); updateBadge(false);
        location.hash = "#/done";
      }, gap * stages.length + 250);
    });
    return "Checkout";
  }

  /* ================= Order confirmed ================= */
  var DONE_BADGE = '<svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="70" style="fill:var(--chip)"/>' +
    '<circle class="c1" cx="85" cy="85" r="70" fill="none" style="stroke:var(--sage2)" stroke-width="6" pathLength="100" transform="rotate(-90 85 85)" stroke-linecap="round"/>' +
    '<path class="ck" d="M55 87l20 20 40-44" fill="none" style="stroke:var(--sage2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>' +
    '<path class="bl" style="animation-delay:1.1s" d="M140 40c-14-2-24 8-22 22 14 2 24-8 22-22Z" fill="#a9cc84"/>' +
    '<path class="bl" style="animation-delay:1.25s" d="M28 128c12-6 26-2 30 10-12 6-26 2-30-10Z" fill="#f2a2ab"/>' +
    '<circle class="bl" style="animation-delay:1.35s" cx="146" cy="122" r="7" fill="#f7c873"/><circle class="bl" style="animation-delay:1.45s" cx="30" cy="40" r="5" fill="#a9bfa0"/></svg>';
  function vDone() {
    var o = S.order;
    if (!o) {
      view.innerHTML = '<section class="wrap page"><div class="bag-empty">' + POUCH + '<h1 tabindex="-1">No recent order</h1><p class="muted">Orders you place show up here right after checkout.</p><div class="cta"><a class="btn btn-main" href="#/shop">Browse the shop</a></div></div></section>';
      return "Order";
    }
    var fast = ["Karachi", "Lahore", "Islamabad", "Rawalpindi"].indexOf(o.city) > -1;
    var payName = { cod: "Cash on delivery", card: "Card (demo)", bank: "Bank transfer" }[o.pay];
    view.innerHTML = '<section class="wrap page"><div class="done-wrap"><div class="done-badge" aria-hidden="true">' + DONE_BADGE + "</div>" +
      '<p class="eyebrow">Order confirmed</p><h1 tabindex="-1">Thank you, ' + esc(o.name) + "!</h1>" +
      '<p>Order <span class="order-no">' + o.no + "</span> is being packed in our Lahore studio and should reach " + esc(o.city) + " in " + (fast ? "two to four" : "four to six") + " working days. We will text you when it leaves.</p>" +
      '<div class="done-card glass"><ul class="mini">' + o.lines.map(miniHTML).join("") + '</ul><div class="sums"><div class="row"><span>Payment</span><b>' + payName + '</b></div><div class="row sum-total"><span>Total</span><b>' + fmt(o.total) + "</b></div></div></div>" +
      '<button class="btn btn-main" type="button" id="again">Continue shopping ' + ICON.arrow + "</button></div></section>";
    $("#again", view).addEventListener("click", function () {
      S.order = null;
      S.f = freshFilters();
      location.hash = "#/";
    });
    setTimeout(function () {
      if (!S.route || S.route.name !== "done") return;
      celebrate(40);
      var b = $(".done-badge", view);
      if (b) { var r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 24); }
    }, RM ? 0 : 600);
    return "Order confirmed";
  }

  /* ================= Global wiring ================= */
  document.addEventListener("click", function (e) {
    // "Home" while already home: glide back to the top
    var home = e.target.closest ? e.target.closest('a[href="#/"]') : null;
    if (home && S.route && S.route.name === "home" && !e.defaultPrevented) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });
      return;
    }
    var t = e.target.closest ? e.target.closest("[data-jump],[data-add],[data-skip],[data-goto]") : null;
    if (!t) return;
    if (t.hasAttribute("data-jump")) {
      var id = t.getAttribute("data-jump");
      if (S.route && S.route.name === "home") jumpTo(id);
      else { pendingJump = id; location.hash = "#/"; }
    } else if (t.hasAttribute("data-add")) {
      var card = t.closest("[data-card]");
      quickAdd(t.getAttribute("data-add"), t, card ? card.querySelector(".art-src") : null);
    } else if (t.hasAttribute("data-goto")) {
      location.hash = "#/p/" + t.getAttribute("data-goto");
    } else if (t.hasAttribute("data-skip")) {
      var h = $("h1", view);
      (h || view).focus();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (cancelDrag) cancelDrag();
    var fl = $("#filters.open", view);
    if (fl) {
      fl.classList.remove("open");
      var tg = $("#fToggle", view);
      if (tg) { tg.setAttribute("aria-expanded", "false"); tg.focus(); }
    }
  });

  VIEWS = { home: vHome, shop: vShop, product: vProduct, bag: vBag, checkout: vCheckout, done: vDone };
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("hashchange", route);
  updateBadge(false);
  route();
})();
</script>
</body>
</html>
