<!doctype html>
<!-- Chill & Craft · Mossbank · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mossbank · People, time and payroll</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: lilac + periwinkle + warm cream canvas, white glass cards, one deep plum card, tangerine accent ---------- */
  :root {
    --bg: #efeaf6; --g1: #dbd1fb; --g2: #c8d2fc; --g3: #fde6cf; --g4: #f3dff0;
    --card: rgba(255,255,255,.66); --card-2: rgba(255,255,255,.52); --well: rgba(96,72,150,.075); --solid: #fbf9fe;
    --edge: rgba(255,255,255,.92); --line: rgba(52,32,84,.1); --line-2: rgba(52,32,84,.17);
    --ink: #21172e; --muted: #6b6380; --faint: #9a93ab;
    --plum: #2b1a3e; --plum-2: #47305f; --on-plum: #f7f1fd; --on-plum-2: #bcadd0;
    --accent: #f2762e; --accent-2: #ffb47e; --accent-soft: rgba(242,118,46,.14); --accent-ink: #2b1204;
    --peri: #6c7af0; --lilac: #a993f2; --rose: #e687b3; --sand: #e2b878;
    --good: #23946e; --warn: #c97d12; --bad: #d1463f;
    --nav-on: #2b1a3e; --nav-on-ink: #fff;
    --shade: rgba(64,32,110,.2); --panel: #fbf9fe; --overlay: rgba(40,20,60,.3); --tip-bg: #251933; --tip-ink: #fff;
    --radius: 16px; --radius-sm: 11px; --focus: #6c7af0;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #110c19; --g1: #2c1f52; --g2: #18204e; --g3: #3b2211; --g4: #2a1434;
    --card: rgba(34,26,49,.7); --card-2: rgba(255,255,255,.045); --well: rgba(255,255,255,.055); --solid: #1d1629;
    --edge: rgba(255,255,255,.085); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
    --ink: #f2edfa; --muted: #aaa1bd; --faint: #7c7490;
    --plum: #22143a; --plum-2: #44295f; --on-plum: #f7f1fd; --on-plum-2: #c4b6d8;
    --accent: #ff8a45; --accent-2: #ffbb8c; --accent-soft: rgba(255,138,69,.16); --accent-ink: #2b1204;
    --peri: #8f9aff; --lilac: #bba8ff; --rose: #f39ec6; --sand: #e9c58e;
    --good: #4cc89b; --warn: #f2a83c; --bad: #ff7b72;
    --nav-on: #efe6ff; --nav-on-ink: #22172f;
    --shade: rgba(0,0,0,.55); --panel: #1c1528; --overlay: rgba(0,0,0,.55); --tip-bg: #f3edfb; --tip-ink: #1c1528; --focus: #ffbb8c;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; overflow-x: clip; min-height: 100vh; background: var(--bg); color: var(--ink); font: 13px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Shared kit pieces (buttons, toasts, dialogs, forms, tips, command search, tables, charts) ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 600; font-size: 12.5px; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--nav-on); border-color: transparent; color: var(--nav-on-ink); }
  .btn.primary:hover { box-shadow: 0 8px 20px -10px var(--shade); }
  .btn.hot { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn.hot:hover { box-shadow: 0 8px 22px -10px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 28px; padding: 0 11px; font-size: 12px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 12px; background: var(--tip-bg); color: var(--tip-ink); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: 12.5px; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--accent); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(20,0,40,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(430px, 100%); height: 100%; max-height: none; border-radius: 20px 0 0 20px; transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
  .cc-x { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--well); }
  .cc-db { padding: 6px 18px 18px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 12px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: 11.5px; font-weight: 650; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea, .inp { width: 100%; min-height: 36px; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus, .inp:focus { outline: none; border-color: var(--peri); box-shadow: 0 0 0 3px color-mix(in srgb, var(--peri) 22%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: 11.5px; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: 11.5px; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px -20px rgba(20,0,40,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 110px; max-width: 260px; padding: 8px 10px; border-radius: 10px; background: var(--tip-bg); color: var(--tip-ink); font-size: 11.5px; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 2px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--peri); background: var(--card-2); font-size: 14px; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--well); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
  .cc-cmdk-foot kbd, kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line-2); font: 600 10.5px/1.6 inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 280px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--peri); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip, .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--muted); font-size: 12px; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--nav-on); color: var(--nav-on-ink); border-color: transparent; }
  .chip em { font-style: normal; opacity: .6; font-weight: 700; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 620px; }
  .cc-tbl th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 22ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--well); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--nav-on); color: var(--nav-on-ink); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 26px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 28px; height: 28px; opacity: .6; }
  .cc-empty b { color: var(--ink); }
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--line-2); stroke-dasharray: 2 4; }
  .cc-zero { stroke: var(--line-2); }
  .cc-line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.2s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .7s cubic-bezier(.2,.9,.25,1.05) both; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--solid); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--well); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: 11px; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 150px; display: grid; gap: 2px; font-size: 12px; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--well); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.7; }
  .cc-in { animation: ccRise .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(14px) scale(.985); } }

  /* ---------- Canvas: soft pastel light with faint contour lines (a moss bank seen from above) ---------- */
  .canvas { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(55% 60% at 3% 0%, var(--g1), transparent 70%), radial-gradient(45% 55% at 97% 4%, var(--g2), transparent 72%), radial-gradient(55% 55% at 76% 106%, var(--g3), transparent 70%), radial-gradient(42% 50% at -4% 98%, var(--g4), transparent 70%), var(--bg); }
  .canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
  .canvas path { fill: none; stroke: var(--ink); stroke-opacity: .05; stroke-width: 1; }

  /* ---------- Shell: brand chip, centre pill nav with sliding marker, tool buttons ---------- */
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; max-width: 1440px; margin: 0 auto; padding: 14px 20px 10px; }
  /* once the page scrolls, a frosted band sits behind the bar so cards slide under it cleanly */
  .top::before {
    content: ""; position: fixed; top: 0; left: 0; right: 0; height: 84px; z-index: -1; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
    -webkit-mask-image: linear-gradient(#000 72%, transparent); mask-image: linear-gradient(#000 72%, transparent);
    opacity: 0; transition: opacity .3s;
  }
  .scrolled .top::before { opacity: 1; }
  .glass { background: var(--card); border: 1px solid var(--edge); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); box-shadow: 0 10px 28px -22px var(--shade); }
  .brand { display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 5px; border-radius: 999px; text-decoration: none; flex: none; }
  .brand svg { width: 30px; height: 30px; display: block; }
  .brand b { font-size: 15px; letter-spacing: -.02em; }
  .brand small { color: var(--muted); font-size: 11.5px; font-weight: 600; padding-left: 9px; border-left: 1px solid var(--line-2); }
  .nav { position: relative; display: flex; gap: 2px; margin: 0 auto; padding: 4px; border-radius: 999px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 12.5px; white-space: nowrap; transition: color .25s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--nav-on-ink); }
  .nav a .ic { width: 15px; height: 15px; }
  .nav a i { font-style: normal; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .nav .mark { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--nav-on); box-shadow: 0 6px 16px -8px var(--shade); transition: transform .45s cubic-bezier(.3,1.25,.5,1), width .35s; }
  .tools { display: flex; gap: 6px; align-items: center; flex: none; }
  .ibtn { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--ink); padding: 0; transition: transform .15s; }
  .ibtn:active { transform: scale(.92); }
  .ibtn .ic { width: 17px; height: 17px; }
  .spill { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 12px; border-radius: 999px; color: var(--muted); font-size: 12.5px; }
  .spill kbd { font-size: 10px; }
  .badge { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--bg); box-sizing: content-box; }
  .badge:empty { display: none; }
  .me { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; padding: 0; border: 2px solid var(--edge); background: var(--well); }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  main { max-width: 1440px; margin: 0 auto; padding: 4px 20px 40px; }
  #view { min-height: 60vh; }
  .phbar { display: none; }

  /* ---------- Page heads ---------- */
  .ph { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin: 4px 0 14px; }
  .ph .grow { flex: 1; }

  .feed li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .feed li:last-child { border-bottom: 0; }
  .feed li.new { animation: feedIn .55s cubic-bezier(.2,.9,.3,1.15) both; }
  .feed b { font-weight: 650; }
  .feed .t { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .feed .grow { min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-12px) scale(.98); background: var(--accent-soft); } }
  .site { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .cert { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .cert:last-child { border-bottom: 0; }
  .cert .meter { grid-column: 1 / -1; height: 5px; }

  /* ---------- People ---------- */
  .ppl td .who b { font-size: 12.5px; }
  .ppl tbody tr.sel { background: color-mix(in srgb, var(--lilac) 16%, transparent); }
  .ckb { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--card-2); display: grid; place-items: center; padding: 0; color: transparent; }
  .ckb[aria-checked="true"] { background: var(--nav-on); border-color: transparent; color: var(--nav-on-ink); }
  .ckb .ic { width: 12px; height: 12px; stroke-width: 2.6; }
  .bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--nav-on); color: var(--nav-on-ink); font-weight: 650; font-size: 12px; animation: tkIn .3s both; }
  .bulk .btn { background: rgba(255,255,255,.12); border-color: transparent; color: inherit; }
  [data-theme="dark"] .bulk .btn { background: rgba(0,0,0,.08); }
  .mix { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; margin: 8px 0 10px; }
  .mix i { background: var(--c); transition: flex-grow .6s; }
  .tmrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 12px; border-bottom: 1px dashed var(--line); }
  .tmrow:last-child { border-bottom: 0; }
  .tmrow i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .tmrow em { font-style: normal; color: var(--muted); font-size: 11px; }
  .annv { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .annv:last-child { border-bottom: 0; }
  .annv .yrs { margin-left: auto; font-weight: 750; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 70%, var(--ink)); }
  .pf-hero { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 4px 0 10px; }
  .pf-hero h3 { margin: 6px 0 0; font-size: 18px; letter-spacing: -.02em; }
  .pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .pf-grid div { padding: 8px 10px; border-radius: 11px; background: var(--well); min-width: 0; }
  .pf-grid small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
  .pf-grid b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Time ---------- */
  .clock { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
  .digits { font: 640 46px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .digits span { color: var(--faint); }
  .run .digits span { color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .ctrls { display: flex; gap: 8px; }
  .cbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--card-2); color: var(--ink); padding: 0; transition: transform .15s; }
  .cbtn:active { transform: scale(.92); }
  .cbtn.main { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: 0 10px 22px -12px var(--accent); }
  .run .cbtn.main { background: var(--nav-on); color: var(--nav-on-ink); box-shadow: none; }
  .cbtn .ic { width: 18px; height: 18px; }
  .ribbon { position: relative; height: 34px; border-radius: 10px; background: var(--well); margin-top: 12px; overflow: hidden; }
  .ribbon i { position: absolute; top: 6px; bottom: 6px; border-radius: 6px; background: var(--c); transform-origin: left; animation: ribIn .6s both; }
  .ribbon i.live { background: repeating-linear-gradient(135deg, var(--accent) 0 6px, var(--accent-2) 6px 10px); background-size: 28px 28px; animation: ribIn .6s both, slide 1s linear infinite; }
  @keyframes ribIn { from { transform: scaleX(0); } }
  @keyframes slide { to { background-position: 28px 0; } }
  .ribbon .nowl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .entries .list > li { font-size: 12px; }
  .entries .dotc { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .mcal .dh { font-size: 10.5px; color: var(--muted); text-align: center; font-weight: 650; padding-bottom: 2px; }
  .md { position: relative; min-height: 62px; padding: 6px 7px; border-radius: 10px; border: 1px solid transparent; display: flex; flex-direction: column; justify-content: space-between; text-align: left; color: var(--ink); background: color-mix(in srgb, var(--accent) calc(var(--v) * 1%), color-mix(in srgb, var(--lilac) 18%, var(--solid))); transform-origin: center; }
  .md.bl { animation: bloom .45s cubic-bezier(.2,.9,.3,1.25) both; }
  .md:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .md b { font-size: 11.5px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .md small { font-size: 10.5px; color: color-mix(in srgb, var(--ink) 65%, transparent); font-weight: 600; }
  /* five thin crew bars per day: how much of each crew was on shift */
  .md .cb { display: flex; gap: 3px; height: 18px; align-items: flex-end; }
  .md .cb i { width: 5px; flex: none; border-radius: 3px; background: var(--c); height: calc(var(--h) * 1%); min-height: 2px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--solid) 45%, transparent); }
  .md.today { border-color: var(--ink); }
  .md.fut { background: repeating-linear-gradient(135deg, var(--card-2) 0 6px, var(--well) 6px 7px); }
  .md.out { visibility: hidden; }
  .md[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--peri); }

  /* ---------- Payroll ---------- */
  .tl-list { display: grid; gap: 2px; max-height: 702px; overflow: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; }
  .tl { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; border: 0; background: none; text-align: left; color: var(--ink); transition: background .2s; }
  .tl:hover { background: var(--well); }
  .tl[aria-current="true"] { background: var(--nav-on); color: var(--nav-on-ink); }
  .tl[aria-current="true"] small { color: inherit; opacity: .7; }
  .tl .net { margin-left: auto; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .step i { display: block; height: 6px; border-radius: 3px; background: var(--well); }
  .step.done i { background: color-mix(in srgb, var(--lilac) 38%, var(--ink)); }
  .step.now i { background: var(--accent); }
  .step b { display: block; font-size: 11.5px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step small { display: block; color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .tots div { padding: 9px 10px; border-radius: 12px; background: var(--well); min-width: 0; }
  .tots small { display: block; color: var(--muted); font-size: 10.5px; font-weight: 650; white-space: nowrap; }
  .tots b { display: block; font-size: 15px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tots .net { background: var(--accent); color: var(--accent-ink); }
  .tots .net small { color: var(--accent-ink); opacity: .7; }
  .caps { display: flex; gap: 6px; align-items: stretch; margin: 6px 0 12px; }
  .caps > div { height: 30px; border-radius: 999px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 750; white-space: nowrap; overflow: hidden; }
  .caps .w { flex: 1; min-width: 0; }
  .caps .o, .caps .l { flex: none; }
  .caps .w { background: color-mix(in srgb, var(--lilac) 38%, var(--ink)); color: #fff; }
  [data-theme="dark"] .caps .w { color: #1c1528; }
  .caps .o { background: var(--accent); color: var(--accent-ink); }
  .caps .l { background: repeating-linear-gradient(135deg, var(--well) 0 5px, transparent 5px 9px), color-mix(in srgb, var(--sand) 35%, transparent); color: var(--ink); }
  .tsg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .tsg .dh { font-size: 10.5px; color: var(--muted); text-align: center; font-weight: 650; }
  .tc { min-height: 58px; border-radius: 11px; border: 1px solid var(--line); background: var(--card-2); padding: 6px 7px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; color: var(--ink); transition: border-color .2s, transform .2s; }
  .tc:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .tc > span { font-size: 11px; color: var(--muted); font-weight: 650; font-variant-numeric: tabular-nums; }
  .hv { font-size: 10.5px; font-weight: 750; padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, var(--peri) 16%, transparent); color: color-mix(in srgb, var(--peri) 62%, var(--ink)); font-variant-numeric: tabular-nums; }
  .hv.ot { background: var(--accent); color: var(--accent-ink); }
  .hv.lv { background: color-mix(in srgb, var(--sand) 34%, transparent); color: color-mix(in srgb, var(--sand) 40%, var(--ink)); }
  .hv.bh { background: var(--well); color: var(--muted); }
  .tc.we { background: transparent; border-style: dashed; }
  .tc.fut { opacity: .5; }
  .tc.today { border-color: var(--ink); }
  .tc.out { visibility: hidden; }
  .docs { display: flex; gap: 6px; flex-wrap: wrap; }
  .doc { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); font-size: 11.5px; font-weight: 650; color: var(--ink); }
  .doc:hover { border-color: var(--ink); }
  .doc .ic { width: 14px; height: 14px; }
  .mbars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 84px; }
  .mbars div { display: grid; gap: 4px; align-content: end; height: 100%; text-align: center; font-size: 10px; color: var(--muted); font-weight: 650; }
  .mbars i { display: block; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--lilac) 55%, transparent); transform-origin: bottom; animation: ccGrow .7s cubic-bezier(.2,.9,.25,1.05) both; }
  .mbars div:last-child i { background: var(--accent); }
  .mbars.five { grid-template-columns: repeat(5, minmax(0, 1fr)); height: 74px; }
  .mbars.five div:last-child i { background: color-mix(in srgb, var(--lilac) 55%, transparent); }
  .mbars.five div.on i { background: var(--accent); }
  .mbars.five div.on { color: var(--ink); }
  .places { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .place { padding: 11px 12px; border-radius: 12px; background: var(--well); min-width: 0; display: grid; gap: 6px; }
  .place .top-r { display: flex; align-items: center; gap: 8px; }
  .place b { font-size: 12.5px; }
  .place small { color: var(--muted); font-size: 11px; }
  .bline { display: grid; gap: 5px; padding: 6px 0; }
  .bline .kv b { font-variant-numeric: tabular-nums; }

  /* ---------- Leave ---------- */
  .gantt { display: grid; grid-template-columns: 150px minmax(0, 1fr); row-gap: 5px; column-gap: 10px; align-items: center; }
  .gscale { position: relative; height: 20px; font-size: 10px; color: var(--faint); font-weight: 650; }
  .gscale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .glane { position: relative; height: 26px; border-radius: 8px; background: var(--well); overflow: hidden; }
  .glane .we { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line) 4px 5px); }
  .gb { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; background: var(--c); color: #fff; font-size: 10.5px; font-weight: 750; padding: 0 7px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; border: 0; transform-origin: left; animation: ribIn .6s both; }
  .gb.pend { background: repeating-linear-gradient(135deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 60%, #fff) 6px 10px); color: #1c1528; }
  .gtoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 2; }
  .req { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .req:last-child { border-bottom: 0; }
  .req .when { font-size: 11.5px; color: var(--muted); }

  /* ---------- Hiring ---------- */
  .starter { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; padding: 10px; }
  .starter .pic { border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--well); }
  .starter .pic img { width: 100%; height: 100%; object-fit: cover; }
  .starter h3 { margin: 2px 0 0; font-size: 15px; letter-spacing: -.01em; }
  .mini-ring { width: 46px; height: 46px; flex: none; }
  .mini-ring text { font-size: 12px; font-weight: 750; fill: var(--ink); }
  .kan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kcol { border-radius: 14px; background: var(--well); padding: 10px; min-height: 280px; transition: outline-color .2s, background .2s; outline: 2px dashed transparent; outline-offset: -2px; }
  .kcol.over { outline-color: var(--accent); background: var(--accent-soft); }
  .kcol h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 12px; }
  .kcol h3 em { font-style: normal; color: var(--muted); }
  .kc { background: var(--solid); border-radius: 12px; padding: 10px 11px; margin-bottom: 8px; border: 1px solid var(--line); cursor: grab; box-shadow: 0 8px 18px -14px var(--shade); transition: transform .2s, box-shadow .2s, opacity .2s; }
  .kc:hover { transform: translateY(-2px); box-shadow: 0 14px 24px -14px var(--shade); }
  .kc.drag { opacity: .4; }
  .kc b { display: block; font-size: 12.5px; }
  .kc small { color: var(--muted); font-size: 11px; }
  .kc .kf { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 11px; }
  .banner { position: relative; border-radius: 13px; overflow: hidden; aspect-ratio: 16 / 7; background: var(--well); margin: -2px 0 10px; }
  .banner img { width: 100%; height: 100%; object-fit: cover; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(22,10,36,.82)); }
  .banner div { position: absolute; z-index: 1; left: 12px; right: 12px; bottom: 10px; color: #fff; }
  .banner b { display: block; font-size: 15px; letter-spacing: -.01em; }
  .banner small { color: rgba(255,255,255,.8); font-size: 11.5px; }

  /* ---------- Reports + settings ---------- */
  .kpi { display: grid; gap: 4px; }
  .kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .stabs { display: grid; gap: 3px; }
  .stab { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 12px; border: 0; background: none; text-align: left; font-weight: 620; color: var(--muted); font-size: 12.5px; }
  .stab:hover { color: var(--ink); }
  .stab[aria-selected="true"] { background: var(--solid); color: var(--ink); box-shadow: 0 6px 16px -12px var(--shade); }
  .stab .ic { width: 15px; height: 15px; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .srow:last-child { border-bottom: 0; }
  .srow small { display: block; color: var(--muted); font-size: 11.5px; }
  .switch { position: relative; width: 40px; height: 23px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--well); flex: none; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: var(--faint); transition: transform .3s cubic-bezier(.3,1.5,.5,1), background .2s; }
  .switch[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 30%, transparent); border-color: transparent; }
  .switch[aria-checked="true"]::after { transform: translateX(17px); background: var(--accent); }
  .form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 12px; }
  .form2 .cc-field { grid-column: span 1; }
  .form2 .cc-field.full { grid-column: span 2; }

  /* ---------- Phone bar + more sheet ---------- */
  .more { position: fixed; left: 10px; right: 10px; bottom: 78px; z-index: 41; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 10px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 50px -20px rgba(20,0,40,.5); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s, transform .3s; }
  .more-open .more { opacity: 1; transform: none; pointer-events: auto; }
  .more a { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--well); text-decoration: none; font-weight: 650; }
  .more a[aria-current="page"] { background: var(--nav-on); color: var(--nav-on-ink); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1400px) { .nav a .ic { display: none; } .brand small { display: none; } }
  @media (max-width: 1300px) { .pulse { grid-template-columns: repeat(4, minmax(128px, 160px)); } .spill span, .spill kbd { display: none; } .spill { width: 38px; padding: 0; justify-content: center; } .hello h1 { font-size: 30px; } .nav a { padding: 7px 10px; } }
  @media (max-width: 1180px) {
    .hello { grid-template-columns: minmax(0, 1fr); }
    .pulse { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8, .s9 { grid-column: span 12; } .s6 { grid-column: span 12; }
    .r2 { grid-row: auto; }
    .tots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 960px) {
    .nav { display: none; }
    .tools { margin-left: auto; }
    .phbar { display: flex; position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 40; justify-content: space-around; padding: 6px; border-radius: 20px; }
    .phbar a, .phbar button { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; min-width: 56px; border-radius: 14px; border: 0; background: none; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 700; }
    .phbar .ic { width: 19px; height: 19px; }
    .phbar a[aria-current="page"] { background: var(--nav-on); color: var(--nav-on-ink); }
    main { padding-bottom: 100px; }
    .kan { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .top { padding: 10px 12px 8px; }
    main { padding: 2px 12px 100px; }
    .s2, .s3, .s6 { grid-column: span 12; }
    .grid { gap: 12px; }
    h1, .hello h1 { font-size: 26px; }
    .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tools [data-theme-toggle] { display: none; }
    .wk { grid-template-columns: 30px repeat(5, minmax(0, 1fr)); }
    .ev small { display: none; }
    .tots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tots .net { grid-column: span 2; }
    .steps small { display: none; }
    .digits { font-size: 36px; }
    .gantt { grid-template-columns: 92px minmax(0, 1fr); }
    .gantt .who small { display: none; }
    .kan { grid-template-columns: 1fr; }
    .rfacts.four, .places { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* People table on phones: select, name and today's status; tap a row for the full profile */
    .ppl table { min-width: 0; }
    .ppl td .who small { display: none; }
    .ppl th:nth-child(n+3):nth-child(-n+7), .ppl td:nth-child(n+3):nth-child(-n+7), .ppl th:nth-child(9), .ppl td:nth-child(9) { display: none; }
    .kcol { min-height: 0; }
    .cc-fields, .form2 { grid-template-columns: 1fr; }
    .cc-field.half, .form2 .cc-field, .form2 .cc-field.full { grid-column: span 1; }
    .md { min-height: 48px; padding: 4px 5px; }
    .md small { display: none; }

function download(name, text, type = "text/plain") {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
    toast("Downloaded " + name);
  } catch (e) { toast("Download blocked by the browser", "bad"); }
}

  <div class="grid st">

    <section class="card s8"><div class="ch"><h2>Payroll cost by team</h2><span class="grow"></span><span class="seg" role="group" aria-label="Range"><button data-rr="6" aria-pressed="${repRange === 6}">6 months</button><button data-rr="12" aria-pressed="${repRange === 12}">12 months</button></span></div><div id="costC"></div></section>

        <div><small>Average tenure</small><b>${num(tenure, 1)} years</b></div>
        <div><small>Starting soon</small><b>${S.people.filter((p) => p.start > iso(TODAY)).length}</b></div>

const pct0 = (f) => (f >= 0 ? "+" : "−") + Math.abs(f * 100).toFixed(1) + "%";

/* ---------- Settings: company, pay schedule, overtime rules, notifications, theme, data ---------- */
let setTab = "company";
const SWITCH = (k, obj, label, sub) => `<div class="srow"><div><b>${label}</b><small>${sub}</small></div><button class="switch" role="switch" aria-checked="${!!S[obj][k]}" data-sw="${obj}.${k}" aria-label="${label}"></button></div>`;
function fieldsHTML(list, vals) { return list.map((f) => `<div class="cc-field${f.full ? " full" : ""}"><label for="st-${f.name}">${esc(f.label)}</label>${f.type === "select" ? `<select id="st-${f.name}" name="${f.name}">${f.options.map((o) => `<option${String(o) === String(vals[f.name]) ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>` : `<input id="st-${f.name}" name="${f.name}" type="${f.type || "text"}" value="${esc(vals[f.name])}"${f.type === "number" ? ` step="any" min="${f.min}" max="${f.max}" inputmode="decimal"` : ""}>`}<small class="cc-err" id="st-${f.name}-e"></small></div>`).join(""); }
function checkForm(form, list) {
  let bad = null; const out = {};
  list.forEach((f) => {
    const el = form.elements[f.name]; let v = el.value.trim(), err = "";
    if (f.type === "number") {
      v = parseFloat(v);
      if (isNaN(v)) err = "Enter a number"; else if (v < f.min || v > f.max) err = `Between ${f.min} and ${f.max}`;
    }
    else if (!v) err = "This field is required";
    else if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) err = "Enter a valid email address";
    $("#st-" + f.name + "-e").textContent = err; err ? el.setAttribute("aria-invalid", "true") : el.removeAttribute("aria-invalid");
    if (err && !bad) bad = el; out[f.name] = v;
  });
  if (bad) { bad.focus(); form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake"); return null; }
  return out;
}
