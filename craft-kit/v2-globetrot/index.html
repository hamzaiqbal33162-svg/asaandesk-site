<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globetrot · region and currency selector</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: deep ocean navy, sea teal and a gold pin ---------- */
  :root {
    color-scheme: light;
    --bg1: #e9f1fa;
    --bg2: #cfe0f3;
    --card: #ffffff;
    --card2: #f5f8fc;
    --line: #e1e8f2;
    --ink: #0f2140;
    --ink2: #566683;
    --soft: #93a1b8;
    --teal: #12a594;
    --gold: #f2b33d;
    --ocean1: #1f4f8a;
    --ocean2: #0c2547;
    --land: #8fe3d4;
    --grid: rgba(255, 255, 255, .14);
    --shadow: rgba(15, 40, 80, .3);
    --focus: #12a594;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #070f1f;
    --bg2: #0f2140;
    --card: #0f1a30;
    --card2: #13213b;
    --line: #213152;
    --ink: #eaf1fb;
    --ink2: #a3b3cc;
    --soft: #6b7b97;
    --teal: #3fd6c2;
    --gold: #ffc65a;
    --ocean1: #153a6a;
    --ocean2: #050f22;
    --land: #5fe0cb;
    --grid: rgba(255, 255, 255, .1);
    --shadow: rgba(0, 0, 0, .6);
    --focus: #3fd6c2;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { min-height: 100vh; font-family: var(--sans); color: var(--ink); background: radial-gradient(70% 60% at 80% 0%, var(--bg2), transparent 70%), var(--bg1); }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px 12px; overflow: hidden; }
  .orbit { position: absolute; width: 760px; height: 760px; left: 50%; top: 50%; margin: -380px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--teal) 30%, transparent); animation: spin 90s linear infinite; pointer-events: none; }
  .orbit::after { content: ""; position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 16px var(--gold); }
  @keyframes spin { to { transform: rotate(1turn); } }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }

  /* ---------- Shop ---------- */
  .shop { position: relative; width: min(920px, 100%); border-radius: 28px; background: var(--card); box-shadow: 0 50px 90px -50px var(--shadow), 0 0 0 1px var(--line); }
  .bar { display: flex; align-items: center; gap: 14px; height: 66px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 8px; margin-right: auto; font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
  .logo i { width: 28px; height: 28px; border-radius: 9px; background: conic-gradient(from 200deg, var(--teal), var(--gold), var(--teal)); }
  .links { display: none; gap: 18px; font-size: 14px; font-weight: 650; color: var(--ink2); }
  @media (min-width: 720px) { .links { display: flex; } }
  .region {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 8px;
    border: 0; border-radius: 14px; background: var(--card2); box-shadow: 0 0 0 1px var(--line);
    font-size: 14px; font-weight: 750; transition: transform .3s var(--spring), box-shadow .3s;
  }
  .region:hover { box-shadow: 0 0 0 1.5px var(--teal); }
  .region:active { transform: scale(.94); }
  .region[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--teal); }
  .mini { width: 26px; height: 26px; }
  .mini .ball { fill: var(--ocean1); }
  .mini .m { fill: none; stroke: var(--land); stroke-width: 1.3; transform-box: fill-box; transform-origin: center; animation: mer 4s linear infinite; }
  .mini .m.b { animation-delay: -2s; }
  .mini .eq { stroke: var(--land); stroke-width: 1.1; opacity: .7; }
  @keyframes mer { 0% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.08); opacity: .3; } 100% { transform: scaleX(-1); opacity: .9; } }
  .code { display: inline-flex; align-items: center; gap: 6px; perspective: 200px; }
  .code span { display: inline-block; }
  .flag { flex: none; display: inline-block; width: 22px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); background-size: 100% 100%; }

  .hero { padding: 22px 20px 6px; }
  .hero h1 { margin: 0; font-size: clamp(25px, 5.6vw, 36px); letter-spacing: -.03em; line-height: 1.08; }
  .ship { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 0; padding: 7px 12px; border-radius: 12px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); font-size: 13px; font-weight: 650; color: var(--ink2); }
  .ship i { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 22%, transparent); animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 50% { box-shadow: 0 0 0 7px transparent; } }
  .ship b { color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 20px 22px; }
  .trust { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 20px 20px; padding: 14px; border-radius: 18px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); }
  .trust div { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12.5px; color: var(--ink2); }
  .trust b { display: block; color: var(--ink); font-size: 13px; }
  .trust i { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
  .trust svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 640px) { .trust { grid-template-columns: 1fr; gap: 8px; padding: 12px; } .trust div:nth-child(n+2) { display: none; } }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .item { border-radius: 20px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
  .item .pic { height: 112px; display: grid; place-items: center; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 30%, var(--card2)), var(--card2)); }
  .item .pic svg { width: 76px; height: 76px; }
  .item .tx { padding: 10px 12px 12px; }
  .item b { display: block; font-size: 13.5px; }
  .item small { display: block; color: var(--ink2); font-size: 12px; margin-top: 1px; }
  .price { position: relative; display: block; height: 22px; margin-top: 6px; overflow: hidden; font-size: 15.5px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .price span { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .price .ch { display: inline-block; position: static; animation: roll .55s var(--spring) backwards; }
  @keyframes roll { from { transform: translateY(110%); opacity: 0; } }
  .price .out { animation: out .3s ease-in forwards; }
  @keyframes out { to { transform: translateY(-110%); opacity: 0; } }

  /* ---------- The region popover ---------- */
  .pop {
    position: absolute; z-index: 10; top: 72px; right: 10px;
    width: min(370px, calc(100% - 20px));
    padding: 14px; border-radius: 26px;
    background: var(--card); box-shadow: 0 40px 80px -30px var(--shadow), 0 0 0 1px var(--line);
    transform-origin: calc(100% - 50px) -12px;
  }
  .pop.open { animation: popIn .55s var(--spring); }
  .pop.closing { animation: popOut .3s ease-in forwards; }
  @keyframes popIn { from { opacity: 0; transform: scale(.35) translateY(-20px); } }
  @keyframes popOut { to { opacity: 0; transform: scale(.4) translateY(-16px); } }
  .ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .ph b { font-size: 16px; }
  .x { width: 34px; height: 34px; border: 0; border-radius: 11px; background: var(--card2); display: grid; place-items: center; }
  .x svg { width: 14px; height: 14px; stroke: var(--ink2); stroke-width: 2.4; stroke-linecap: round; }
  .globe { position: relative; height: 196px; margin: 0 -14px; display: grid; place-items: center; overflow: hidden; }
  .globe canvas { width: 196px; height: 196px; }
  .glab { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); padding: 4px 10px; border-radius: 10px; background: color-mix(in srgb, var(--card) 85%, transparent); box-shadow: 0 0 0 1px var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; backdrop-filter: blur(4px); }
  .find { display: flex; align-items: center; gap: 8px; height: 42px; margin-top: 8px; padding: 0 12px; border-radius: 13px; background: var(--card2); box-shadow: 0 0 0 1px var(--line); }
  .find:focus-within { box-shadow: 0 0 0 2px var(--teal); }
  .find svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--soft); stroke-width: 2.2; stroke-linecap: round; }
  .find input { width: 100%; border: 0; outline: none; background: none; font-size: 14px; }
  .list { list-style: none; margin: 8px 0 0; padding: 0 2px 0 0; max-height: 158px; overflow: auto; scrollbar-width: thin; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 13px; cursor: pointer; transition: background .2s, transform .3s var(--spring); }
  .opt:hover, .opt.active { background: var(--card2); }
  .opt.active { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--teal) 60%, transparent); }
  .opt:active { transform: scale(.98); }
  .opt .ct { min-width: 0; flex: 1; }
  .opt b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt small { font-size: 12px; color: var(--ink2); }
  .opt em { font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--ink2); }
  .opt .tick { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: #fff; transform: scale(0); transition: transform .4s var(--spring); }
  .opt .tick svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .opt[aria-selected="true"] .tick { transform: scale(1); }
  .opt[aria-selected="true"] em { color: var(--teal); }
  .none { padding: 12px; color: var(--ink2); font-size: 13px; text-align: center; }
  .fmt { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .fmt label { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
  .fmt select { height: 36px; padding: 0 10px; border-radius: 11px; border: 0; background: var(--card2); box-shadow: 0 0 0 1px var(--line); font-size: 13px; font-weight: 650; }
  .note { margin: 8px 0 0; font-size: 11.5px; color: var(--soft); text-align: center; }
  .toast { position: absolute; z-index: 11; left: 50%; bottom: 18px; padding: 10px 16px; border-radius: 14px; background: var(--ink); color: var(--card); font-size: 13.5px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); animation: toast 2.6s var(--spring) forwards; pointer-events: none; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.9); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 10px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .orbit, .mini .m { animation: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="orbit" aria-hidden="true"></div>
  <section class="shop" id="shop" aria-label="Loom and Lane home goods">
    <header class="bar">
      <div class="logo"><i aria-hidden="true"></i>Loom &amp; Lane</div>
      <nav class="links" aria-label="Shop"><span>Shop</span><span>New in</span><span>Gifts</span></nav>
      <button class="region" id="regionBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop">
        <svg class="mini" viewBox="0 0 26 26" aria-hidden="true"><circle class="ball" cx="13" cy="13" r="11"/><ellipse class="m" cx="13" cy="13" rx="5" ry="11"/><ellipse class="m b" cx="13" cy="13" rx="5" ry="11"/><path class="eq" d="M2 13h22"/></svg>
        <span class="code" id="code"><span class="flag" id="btnFlag"></span><span id="btnText">PKR</span></span>
        <span class="sr-only" id="btnName">Region: Pakistan, prices in PKR. Change region</span>
      </button>
    </header>
    <div class="hero">
      <h1>Handmade in Lahore,<br>shipped to your door</h1>
      <p class="ship" aria-live="polite"><i aria-hidden="true"></i><span id="ship">Delivers to Lahore</span></p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="trust">
      <div><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></i><span><b>Ships from Lahore</b><span id="trustShip">Tracked to your door</span></span></div>
      <div><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></i><span><b>Duties shown up front</b>No surprise fees</span></div>
      <div><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></i><span><b>14-day returns</b>Free in Pakistan</span></div>
    </div>

    <div class="pop" id="pop" role="dialog" aria-labelledby="popTitle" hidden>
      <div class="ph"><b id="popTitle">Deliver to</b><button class="x" id="closeBtn" type="button" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></div>
      <div class="globe"><canvas id="globe" width="392" height="392" aria-hidden="true"></canvas><span class="glab" id="glab">Lahore</span></div>
      <label class="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" placeholder="Search country, city or currency" aria-label="Search country, city or currency" autocomplete="off"></label>
      <ul class="list" id="list" role="listbox" aria-label="Countries"></ul>
      <div class="fmt"><label for="lang">Language and format</label><select id="lang"><option value="en-PK">English (Pakistan)</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option></select></div>
      <p class="note">Demo exchange rates · you can change this any time</p>
    </div>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </section>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s) => document.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 50) : ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 30); };
  const D2R = Math.PI / 180;

  // ---------- Regions (rates are demo values, prices are set in PKR) ----------
  const FLAG = {
    PK: "radial-gradient(circle at 66% 44%, #01411c 0 14%, transparent 15%), radial-gradient(circle at 61% 50%, #fff 0 21%, transparent 22%), linear-gradient(90deg, #fff 0 25%, #01411c 25%)",
    AE: "linear-gradient(90deg, #ce1126 0 26%, transparent 26%), linear-gradient(#00732f 0 33.3%, #fff 33.3% 66.6%, #111 66.6%)",
    SA: "linear-gradient(transparent 62%, #fff 62% 68%, transparent 68%) 50% 0 / 60% 100% no-repeat, #006c35",
    GB: "linear-gradient(90deg, transparent 43%, #c8102e 43% 57%, transparent 57%), linear-gradient(transparent 38%, #c8102e 38% 62%, transparent 62%), linear-gradient(90deg, transparent 37%, #fff 37% 63%, transparent 63%), linear-gradient(transparent 30%, #fff 30% 70%, transparent 70%), #012169",
    US: "linear-gradient(#3c3b6e 0 0) 0 0 / 44% 54% no-repeat, repeating-linear-gradient(#b22234 0 15.4%, #fff 15.4% 30.8%)",
    CA: "radial-gradient(circle, #d52b1e 0 17%, transparent 18%), linear-gradient(90deg, #d52b1e 0 25%, #fff 25% 75%, #d52b1e 75%)",
    TR: "radial-gradient(circle at 45% 50%, #e30a17 0 16%, transparent 17%), radial-gradient(circle at 39% 50%, #fff 0 22%, transparent 23%), #e30a17",
    MY: "linear-gradient(#010066 0 0) 0 0 / 50% 57% no-repeat, repeating-linear-gradient(#cc0001 0 14.3%, #fff 14.3% 28.6%)"
  };
  const REG = [
    { id: "PK", country: "Pakistan", city: "Lahore", cur: "PKR", rate: 1, lat: 31.55, lon: 74.34, tz: "Asia/Karachi", days: [1, 2], ship: 0 },
    { id: "AE", country: "United Arab Emirates", city: "Dubai", cur: "AED", rate: .0132, lat: 25.2, lon: 55.27, tz: "Asia/Dubai", days: [3, 5], ship: 2900 },
    { id: "SA", country: "Saudi Arabia", city: "Riyadh", cur: "SAR", rate: .0135, lat: 24.71, lon: 46.68, tz: "Asia/Riyadh", days: [4, 6], ship: 3200 },
    { id: "GB", country: "United Kingdom", city: "London", cur: "GBP", rate: .0028, lat: 51.51, lon: -.13, tz: "Europe/London", days: [5, 8], ship: 5400 },
    { id: "US", country: "United States", city: "New York", cur: "USD", rate: .0036, lat: 40.71, lon: -74, tz: "America/New_York", days: [6, 9], ship: 6200 },
    { id: "CA", country: "Canada", city: "Toronto", cur: "CAD", rate: .0049, lat: 43.65, lon: -79.38, tz: "America/Toronto", days: [6, 9], ship: 6200 },
    { id: "TR", country: "Türkiye", city: "Istanbul", cur: "TRY", rate: .12, lat: 41.01, lon: 28.98, tz: "Europe/Istanbul", days: [5, 7], ship: 4300 },
    { id: "MY", country: "Malaysia", city: "Kuala Lumpur", cur: "MYR", rate: .016, lat: 3.14, lon: 101.69, tz: "Asia/Kuala_Lumpur", days: [5, 8], ship: 4100 }
  ];
  let cur = REG[0], locale = "en-PK";

  // ---------- Products ----------
  const ITEMS = [
    { name: "Block print cushion", note: "Hand-stamped cotton", pkr: 2400, c: "#e07a5f", art: '<rect x="12" y="14" width="52" height="48" rx="12" fill="#e07a5f"/><g fill="#fff3e6" opacity=".9"><circle cx="26" cy="28" r="4"/><circle cx="50" cy="28" r="4"/><circle cx="38" cy="38" r="5"/><circle cx="26" cy="48" r="4"/><circle cx="50" cy="48" r="4"/></g><path d="M12 22q-5-4-6-8M64 22q5-4 6-8M12 54q-5 4-6 8M64 54q5 4 6 8" stroke="#c45a40" stroke-width="2.5" fill="none" stroke-linecap="round"/>' },
    { name: "Brass table lamp", note: "Etched by hand", pkr: 6800, c: "#f2b33d", art: '<path d="M24 14h28l8 24H16Z" fill="#fff1d1"/><path d="M24 14h28l8 24H16Z" fill="none" stroke="#d9952a" stroke-width="2"/><rect x="35" y="38" width="6" height="18" fill="#d9952a"/><ellipse cx="38" cy="60" rx="16" ry="5" fill="#c4841f"/><circle cx="30" cy="26" r="1.6" fill="#d9952a"/><circle cx="38" cy="22" r="1.6" fill="#d9952a"/><circle cx="46" cy="28" r="1.6" fill="#d9952a"/>' },
    { name: "Handwoven throw", note: "Pure wool, Swat valley", pkr: 4500, c: "#12a594", art: '<rect x="10" y="18" width="56" height="38" rx="6" fill="#2f8f83"/><path d="M10 28h56M10 36h56M10 44h56" stroke="#9fe3d6" stroke-width="3"/><path d="M14 56v8M20 56v8M26 56v8M32 56v8M38 56v8M44 56v8M50 56v8M56 56v8M62 56v8" stroke="#2f8f83" stroke-width="2" stroke-linecap="round"/>' },
    { name: "Clay mug pair", note: "Glazed in Multan blue", pkr: 1900, c: "#4f7cc9", art: '<rect x="10" y="26" width="24" height="30" rx="5" fill="#3f6fc0"/><path d="M34 32h4a6 6 0 0 1 0 12h-4" fill="none" stroke="#3f6fc0" stroke-width="3.5"/><rect x="40" y="20" width="24" height="36" rx="5" fill="#2a4f96"/><path d="M64 26h4a6 6 0 0 1 0 12h-4" fill="none" stroke="#2a4f96" stroke-width="3.5"/><path d="M14 36h16M44 32h16" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>' }
  ];

  // ---------- Money and dates in the chosen format ----------
  const money = (pkr, r = cur) => new Intl.NumberFormat(locale, { style: "currency", currency: r.cur, currencyDisplay: "code", maximumFractionDigits: r.cur === "PKR" ? 0 : 2, minimumFractionDigits: r.cur === "PKR" ? 0 : 2 }).format(pkr * r.rate).replace(/ /g, " ");
  const when = (days) => { const d = new Date(); d.setDate(d.getDate() + days); return new Intl.DateTimeFormat(locale, { weekday: "short", day: "numeric", month: "short", timeZone: cur.tz }).format(d); };
  const clock = (tz) => new Intl.DateTimeFormat(locale, { hour: "2-digit", minute: "2-digit", timeZone: tz }).format(new Date());
  // a price rolls over one character at a time, like an airport board
  function setPrice(el, text, animate) {
    const old = el.querySelector("span:not(.out)");
    if (old && old.dataset.v === text) return;
    const nu = document.createElement("span");
    nu.dataset.v = text;
    nu.innerHTML = animate && !reduce ? `<b class="sr-only">${text}</b>` + [...text].map((ch, i) => `<i class="ch" style="animation-delay:${i * 28}ms" aria-hidden="true">${ch === " " ? "&nbsp;" : ch}</i>`).join("") : text;
    if (old && animate && !reduce) { old.classList.add("out"); setTimeout(() => old.remove(), 320); } else if (old) old.remove();
    el.appendChild(nu);
  }
  function renderShop(animate) {
    ITEMS.forEach((it, i) => setPrice($("#pr" + i), money(it.pkr), animate));
    renderButton();
  }
  function renderButton() {
    const s = cur.ship ? money(cur.ship) + " shipping" : "free delivery";
    $("#trustShip").textContent = `${cur.days[0]} to ${cur.days[1]} days to ${cur.city}`;
    $("#ship").innerHTML = `Delivers to <b>${cur.city}</b> by ${when(cur.days[1])} · ${s}`;
    $("#btnFlag").style.background = FLAG[cur.id];
    $("#btnText").textContent = cur.id + " · " + cur.cur;
    $("#btnName").textContent = `Region: ${cur.country}, prices in ${cur.cur}. Change region`;
  }

  // ---------- The list (a combobox: type to filter, arrows to move, Enter to choose) ----------
  const list = $("#list"), q = $("#q");
  let shown = REG.slice(), active = 0;
  function renderList() {
    const s = q.value.trim().toLowerCase();
    shown = REG.filter((r) => !s || `${r.country} ${r.city} ${r.cur}`.toLowerCase().includes(s));
    active = Math.max(0, shown.indexOf(cur));
    list.innerHTML = shown.length ? shown.map((r, i) => `<li class="opt${i === active ? " active" : ""}" role="option" id="opt-${r.id}" data-id="${r.id}" aria-selected="${r === cur}"><span class="flag" style="background:${FLAG[r.id]}"></span><span class="ct"><b>${r.country}</b><small>${r.city} · <time data-tz="${r.tz}">${clock(r.tz)}</time></small></span><em>${r.cur}</em><span class="tick" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="m2.5 6.2 2.4 2.3 4.6-5"/></svg></span></li>`).join("") : `<li class="none">No country matches that</li>`;
    q.setAttribute("aria-activedescendant", shown.length ? "opt-" + shown[active].id : "");
  }
  function setActive(i) {
    if (!shown.length) return;
    active = (i + shown.length) % shown.length;
    $$(".opt", list).forEach((o, k) => o.classList.toggle("active", k === active));
    const el = $$(".opt", list)[active];
    q.setAttribute("aria-activedescendant", el.id);
    // keep it in view inside the list only
    if (el.offsetTop < list.scrollTop) list.scrollTop = el.offsetTop - 4;
    else if (el.offsetTop + el.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = el.offsetTop + el.offsetHeight - list.clientHeight + 4;
    peek = shown[active];
  }
  q.addEventListener("input", () => renderList());
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter") { e.preventDefault(); if (shown[active]) choose(shown[active].id); }
  });
  list.addEventListener("click", (e) => { const o = e.target.closest(".opt"); if (o) choose(o.dataset.id); });
  list.addEventListener("pointermove", (e) => { const o = e.target.closest(".opt"); if (o) { const i = shown.findIndex((r) => r.id === o.dataset.id); if (i !== active) setActive(i); } });
  setInterval(() => { $$("time[data-tz]", list).forEach((t) => { t.textContent = clock(t.dataset.tz); }); if (!busy) $("#glab").textContent = `${(peek || cur).city} · ${clock((peek || cur).tz)}`; }, 1000);
  $("#lang").addEventListener("change", (e) => { locale = e.target.value; renderShop(true); renderList(); say("Format changed to " + e.target.selectedOptions[0].text); });

  // ---------- The globe: a dot map on an orthographic sphere ----------
  const POLY = [
    [[-165, 65], [-160, 71], [-140, 70], [-120, 72], [-95, 74], [-80, 72], [-65, 62], [-55, 52], [-66, 45], [-75, 38], [-81, 31], [-80, 25], [-90, 30], [-97, 26], [-97, 20], [-90, 16], [-83, 10], [-78, 8], [-88, 14], [-105, 20], [-112, 30], [-118, 34], [-124, 40], [-124, 48], [-132, 55], [-150, 60], [-165, 60]],
    [[-52, 60], [-42, 60], [-22, 70], [-18, 77], [-30, 83], [-55, 82], [-70, 78], [-58, 70]],
    [[-78, 8], [-72, 12], [-62, 10], [-50, 1], [-35, -5], [-39, -15], [-48, -26], [-58, -38], [-65, -42], [-68, -53], [-74, -50], [-74, -40], [-71, -18], [-76, -14], [-81, -5], [-79, 2]],
    [[-17, 21], [-16, 12], [-8, 5], [5, 5], [9, 4], [10, -2], [13, -12], [12, -18], [15, -27], [18, -34], [25, -34], [33, -27], [35, -23], [40, -15], [40, -3], [51, 11], [43, 12], [37, 20], [33, 31], [20, 32], [10, 37], [0, 36], [-6, 36], [-10, 30]],
    [[-10, 36], [-9, 43], [-1, 46], [-4, 48], [2, 51], [8, 54], [9, 57], [5, 59], [6, 62], [14, 67], [22, 70], [30, 71], [42, 68], [60, 70], [70, 73], [80, 73], [100, 77], [115, 74], [140, 72], [160, 70], [180, 68], [180, 64], [165, 60], [156, 51], [142, 52], [140, 46], [130, 42], [127, 38], [126, 35], [122, 30], [120, 25], [110, 20], [108, 12], [104, 9], [100, 13], [100, 6], [103, 1.5], [98, 8], [97, 16], [92, 21], [88, 22], [80, 15], [78, 8], [73, 17], [72, 21], [67, 25], [61, 25], [57, 26], [56, 24], [59, 22], [55, 17], [44, 12], [43, 16], [35, 28], [34, 31], [36, 36], [28, 37], [26, 40], [23, 40], [22, 37], [19, 41], [13, 45], [16, 41], [18, 40], [12, 44], [8, 44], [3, 43], [-1, 37], [-6, 36]],
    [[-5.5, 50], [1.5, 51], [0, 53.5], [-2, 56], [-5, 58.6], [-6, 56], [-3, 54], [-4.5, 52]],
    [[-10, 52], [-6, 52], [-6, 55], [-8, 55.3], [-10, 54]],
    [[130, 31], [136, 34], [140, 35], [142, 39], [141.5, 45], [140, 41], [136, 37], [132, 35]],
    [[114, -22], [122, -18], [130, -12], [137, -12], [142, -11], [146, -19], [153, -26], [150, -37], [140, -38], [135, -35], [129, -32], [116, -35], [114, -28]],
    [[109, 2], [117, 7], [119, 1], [116, -4], [110, -3]],
    [[95, 5.5], [100, 1], [106, -6], [103, -5], [96, 3]],
    [[105, -6], [114, -7], [114, -8.5], [106, -7.5]],
    [[44, -25], [47, -25], [50, -15], [49, -12], [44, -17]],
    [[172, -34], [178, -38], [174, -41], [171, -44], [167, -46], [172, -41]],
    [[-24, 64], [-14, 64], [-14, 66], [-22, 66.5]],
    [[120, 18], [122, 18], [126, 7], [124, 7], [120, 14]]
  ];
  const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  const vec = (lat, lon) => [Math.cos(lat * D2R) * Math.sin(lon * D2R), Math.sin(lat * D2R), Math.cos(lat * D2R) * Math.cos(lon * D2R)];
  const DOTS = [];
  for (let lat = -54; lat <= 80; lat += 2.8) {
    const step = 2.8 / Math.max(.2, Math.cos(lat * D2R));
    for (let lon = -180; lon < 180; lon += step) if (POLY.some((p) => inPoly(lon, lat, p))) DOTS.push(vec(lat, lon));
  }
  const cv = $("#globe"), ctx = cv.getContext("2d");
  let col = {};
  const readColours = () => { const cs = getComputedStyle(document.documentElement); ["--ocean1", "--ocean2", "--land", "--grid", "--gold", "--teal"].forEach((k) => { col[k] = cs.getPropertyValue(k).trim(); }); };
  readColours();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(readColours, 50));

  // view state: centre latitude/longitude, zoom spring, a flight in progress, the landing time
  const V = { lat: cur.lat - 8, lon: cur.lon - 50, zoom: .6, zv: 0, zt: 1 };
  let flight = null, landedAt = -9999, peek = null, drawing = false;
  function project(p, rot) {
    const [x, y, z] = p, x1 = x * rot.cl - z * rot.sl, z1 = x * rot.sl + z * rot.cl;
    return [x1, y * rot.cp - z1 * rot.sp, y * rot.sp + z1 * rot.cp];
  }
  function slerp(a, b, t) {
    const d = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2])), w = Math.acos(d);
    if (w < 1e-4) return a.slice();
    const s = Math.sin(w), f = Math.sin((1 - t) * w) / s, g = Math.sin(t * w) / s;
    return [a[0] * f + b[0] * g, a[1] * f + b[1] * g, a[2] * f + b[2] * g];
  }
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  let lastT = performance.now();
  function frame(now) {
    if (!drawing) return;
    const dt = Math.min(.033, (now - lastT) / 1000); lastT = now;
    // follow the flight, or drift gently over the chosen city
    let tgtLat = cur.lat - 8, tgtLon = cur.lon + (reduce ? 0 : Math.sin(now / 2600) * 7);
    if (flight) {
      const t = Math.min(1, (now - flight.t0) / flight.dur), e = ease(t);
      V.lat = flight.la0 + (flight.la1 - flight.la0) * e;
      V.lon = flight.lo0 + flight.dlon * e;
      flight.t = e;
      if (t >= 1) { flight = null; landedAt = now; V.zt = 1; }
    } else {
      let dl = ((tgtLon - V.lon + 540) % 360) - 180;
      V.lon += dl * Math.min(1, dt * 3); V.lat += (tgtLat - V.lat) * Math.min(1, dt * 3);
    }
    V.zv += (-140 * (V.zoom - V.zt) - 11 * V.zv) * dt; V.zoom += V.zv * dt;
    draw(now);
    requestAnimationFrame(frame);
  }
  function draw(now) {
    const w = cv.width, h = cv.height, R = w * .4 * V.zoom, cx = w / 2, cy = h / 2;
    const rot = { cl: Math.cos(V.lon * D2R), sl: Math.sin(V.lon * D2R), cp: Math.cos(V.lat * D2R), sp: Math.sin(V.lat * D2R) };
    ctx.clearRect(0, 0, w, h);
    // glow and ocean
    const halo = ctx.createRadialGradient(cx, cy, R * .9, cx, cy, R * 1.25);
    halo.addColorStop(0, col["--teal"] + "55"); halo.addColorStop(1, "transparent");
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, R * 1.25, 0, 7); ctx.fill();
    const sea = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R);
    sea.addColorStop(0, col["--ocean1"]); sea.addColorStop(1, col["--ocean2"]);
    ctx.fillStyle = sea; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    // graticule
    ctx.strokeStyle = col["--grid"]; ctx.lineWidth = w / 260;
    const line = (pts) => { ctx.beginPath(); let pen = false; for (const p of pts) { const [x, y, z] = project(p, rot); if (z > 0) { pen ? ctx.lineTo(cx + R * x, cy - R * y) : ctx.moveTo(cx + R * x, cy - R * y); pen = true; } else pen = false; } ctx.stroke(); };
    for (let lon = -180; lon < 180; lon += 30) { const pts = []; for (let lat = -80; lat <= 80; lat += 5) pts.push(vec(lat, lon)); line(pts); }
    for (let lat = -60; lat <= 60; lat += 30) { const pts = []; for (let lon = -180; lon <= 180; lon += 5) pts.push(vec(lat, lon)); line(pts); }
    // land dots, brighter towards the middle
    ctx.fillStyle = col["--land"];
    const s = Math.max(2, w / 150);
    for (const p of DOTS) { const [x, y, z] = project(p, rot); if (z <= 0) continue; ctx.globalAlpha = .25 + .75 * z; ctx.fillRect(cx + R * x - s / 2, cy - R * y - s / 2, s, s); }
    ctx.globalAlpha = 1;
    // every region's city as a small light; the chosen one gets a gold pin and ripples
    REG.forEach((r) => {
      const [x, y, z] = project(vec(r.lat, r.lon), rot); if (z <= 0) return;
      const px = cx + R * x, py = cy - R * y;
      ctx.fillStyle = r === cur ? col["--gold"] : "#ffffff"; ctx.globalAlpha = r === cur ? 1 : .55 + .45 * z;
      ctx.beginPath(); ctx.arc(px, py, (r === cur ? 4.2 : 2.6) * w / 196, 0, 7); ctx.fill();
      if (peek && r === peek && r !== cur) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = w / 150; ctx.beginPath(); ctx.arc(px, py, 7 * w / 196, 0, 7); ctx.stroke(); }
      ctx.globalAlpha = 1;
    });
    const since = now - landedAt;
    if (since < 1800 && !flight) {
      const [x, y, z] = project(vec(cur.lat, cur.lon), rot);
      if (z > 0) for (let k = 0; k < 3; k++) {
        const t = (since - k * 260) / 1100; if (t < 0 || t > 1) continue;
        ctx.strokeStyle = col["--gold"]; ctx.globalAlpha = 1 - t; ctx.lineWidth = w / 120;
        ctx.beginPath(); ctx.arc(cx + R * x, cy - R * y, (6 + t * 34) * w / 196, 0, 7); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // the flight: a great-circle arc that lifts off the globe, with a glowing plane at its head
    if (flight) {
      const a = flight.a, b = flight.b, head = Math.max(0, Math.min(1, flight.t * 1.06));
      ctx.strokeStyle = col["--gold"]; ctx.lineWidth = w / 110; ctx.setLineDash([w / 50, w / 70]);
      ctx.beginPath(); let pen = false, hx = 0, hy = 0;
      for (let i = 0; i <= 48; i++) {
        const t = head * i / 48, p = slerp(a, b, t), lift = 1 + .24 * Math.sin(Math.PI * t);
        const [x, y, z] = project(p, rot), X = cx + R * x * lift, Y = cy - R * y * lift;
        if (z > -.15) { pen ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); pen = true; } else pen = false;
        hx = X; hy = Y;
      }
      ctx.stroke(); ctx.setLineDash([]);
      const glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, w / 22);
      glow.addColorStop(0, "#ffffff"); glow.addColorStop(.35, col["--gold"]); glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(hx, hy, w / 22, 0, 7); ctx.fill();
    }
    // a soft shine on top
    const shine = ctx.createRadialGradient(cx - R * .45, cy - R * .5, 0, cx - R * .45, cy - R * .5, R * .9);
    shine.addColorStop(0, "rgba(255,255,255,.22)"); shine.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  }
  function startDrawing() { if (drawing) return; drawing = true; lastT = performance.now(); requestAnimationFrame(frame); }

  // ---------- Open, close, choose ----------
  const pop = $("#pop"), btn = $("#regionBtn");
  let open = false, busy = false;
  function openPop(focus) {
    if (open) return;
    open = true; pop.hidden = false;
    pop.classList.remove("closing", "open"); void pop.offsetWidth; pop.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    q.value = ""; renderList(); peek = null;
    // the globe spins in from far away
    if (!reduce) { V.zoom = .55; V.zv = 0; V.lon = cur.lon - 70; V.lat = cur.lat - 20; }
    V.zt = 1;
    $("#glab").textContent = `${cur.city} · ${clock(cur.tz)}`;
    startDrawing();
    if (focus) setTimeout(() => q.focus({ preventScroll: true }), 60);
  }
  function closePop(focusBack) {
    if (!open) return;
    open = false;
    btn.setAttribute("aria-expanded", "false");
    if (reduce) { pop.hidden = true; drawing = false; }
    else { pop.classList.add("closing"); setTimeout(() => { if (!open) { pop.hidden = true; pop.classList.remove("closing"); drawing = false; } }, 320); }
    if (focusBack) btn.focus({ preventScroll: true });
  }
  function toast(text) { $$(".toast").forEach((t) => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = text; $("#shop").appendChild(t); setTimeout(() => t.remove(), 2700); }

  async function choose(id) {
    const to = REG.find((r) => r.id === id);
    if (!to || busy) return;
    if (to === cur) { closePop(true); return; }
    busy = true;
    const from = cur;
    cur = to; peek = null;
    $$(".opt", list).forEach((o) => o.setAttribute("aria-selected", String(o.dataset.id === id)));
    say(`Flying to ${to.city}. Prices will show in ${to.cur}.`);
    $("#glab").textContent = `${from.city} → ${to.city}`;
    // take off: zoom out a touch, then rotate along the route while the plane flies
    V.zt = .86;
    const dlon = ((to.lon - V.lon + 540) % 360) - 180;
    flight = { t0: performance.now() + 120, dur: reduce ? 1 : 1500, la0: V.lat, la1: to.lat - 8, lo0: V.lon, dlon, a: vec(from.lat, from.lon), b: vec(to.lat, to.lon), t: 0 };
    await sleep(1650);
    $("#glab").textContent = `${to.city} · ${clock(to.tz)}`;
    // the button flips to the new code
    const code = $("#code");
    if (!reduce) await code.animate([{ transform: "rotateX(0)" }, { transform: "rotateX(90deg)" }], { duration: 160, easing: "ease-in" }).finished;
    renderButton();
    if (!reduce) code.animate([{ transform: "rotateX(-90deg)" }, { transform: "rotateX(0)" }], { duration: 420, easing: "cubic-bezier(.34,1.56,.64,1)" });
    await sleep(700);
    closePop(false);
    await sleep(260);
    renderShop(true);
    toast(`Prices now in ${to.cur} · delivery to ${to.city}`);
    busy = false;
  }

  btn.addEventListener("click", (e) => { if (busy) return; open ? closePop(false) : openPop(e.isTrusted); });
  $("#closeBtn").addEventListener("click", () => closePop(true));
  addEventListener("keydown", (e) => { if (e.key === "Escape" && open && !busy) closePop(true); });
  addEventListener("pointerdown", (e) => { if (open && !busy && !pop.contains(e.target) && !btn.contains(e.target)) closePop(false); });

  // ---------- Start ----------
  renderShop(false);
  renderList();

  // ---------- Auto demo: open, browse the list, fly somewhere, watch the prices roll ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  (async () => {
    await sleep(900);
    const plan = ["AE", "GB", "MY", "US", "TR", "PK"];
    let k = 0;
    while (demo) {
      openPop(false); await sleep(1300); if (!demo) break;
      const target = plan[k++ % plan.length], ti = shown.findIndex((r) => r.id === target);
      for (let i = 1; i <= Math.min(2, ti); i++) { setActive(i); await sleep(380); if (!demo) break; }
      if (!demo) break;
      setActive(ti); await sleep(650); if (!demo) break;
      await choose(target); if (!demo) break;
      await sleep(2600);
    }
  })();
})();
</script>
