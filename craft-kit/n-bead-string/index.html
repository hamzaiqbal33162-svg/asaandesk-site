<!doctype html>
<!-- Chill & Craft · Bead String · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bead String · tag input with beads on threads</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: warm sand, terracotta and lapis ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #f2e6d3;
    --bg2: #faf3e7;
    --card: #fffbf4;
    --ink: #2e2219;
    --muted: #8a7462;
    --line: #ecdcc5;
    --well: #f6ecdc;
    --thread: #9c7a5b;
    --terra: #c4553b;
    --lapis: #2f4fa8;
    --ok: #2c8f5e;
    --shadow: rgba(90, 50, 20, .22);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #120e0c;
    --bg2: #1d1612;
    --card: #1e1814;
    --ink: #f6eadc;
    --muted: #bba48f;
    --line: #382b22;
    --well: #261e18;
    --thread: #c9a27c;
    --terra: #ff7d5e;
    --lapis: #8ea6ff;
    --ok: #4fd497;
    --shadow: rgba(0, 0, 0, .6);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    overflow-x: hidden;
  }
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 18px 14px;
    background:
      radial-gradient(50% 45% at 12% 15%, color-mix(in srgb, var(--terra) 16%, transparent), transparent 70%),
      radial-gradient(50% 45% at 88% 90%, color-mix(in srgb, var(--lapis) 14%, transparent), transparent 70%),
      radial-gradient(80% 70% at 50% 45%, var(--bg2), var(--bg));
  }
  .card {
    position: relative;
    width: min(100%, 520px);
    padding: 18px 16px 16px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px var(--shadow), 0 8px 18px -14px var(--shadow);
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: clamp(19px, 5vw, 22px); letter-spacing: -.01em; }
  .lead { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
  .count { flex: none; margin: 2px 0 0; padding: 5px 10px; border-radius: 999px; background: var(--well); font: 700 12.5px/1 var(--ff); color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.full { color: var(--terra); background: color-mix(in srgb, var(--terra) 14%, transparent); }

  /* ---------- The bead tray: three threads ---------- */
  .tray {
    position: relative;
    height: 192px;
    margin: 12px 0 10px;
    border-radius: 20px;
    background:
      radial-gradient(circle, color-mix(in srgb, var(--thread) 14%, transparent) 1px, transparent 1.5px) 0 0 / 16px 16px,
      var(--well);
    box-shadow: inset 0 2px 8px -3px var(--shadow);
  }
  .tray svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .thread { fill: none; stroke: var(--thread); stroke-width: 1.8; stroke-linecap: round; }
  .knot { fill: var(--thread); transition: r .4s cubic-bezier(.34, 1.8, .64, 1); }
  .tray.tied .knot { r: 6; }
  .bow { fill: none; stroke: var(--terra); stroke-width: 2.2; stroke-linecap: round; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
  .tray.tied .bow { animation: bow .6s cubic-bezier(.34, 1.8, .64, 1) forwards; }
  @keyframes bow { from { opacity: 0; transform: scale(0) rotate(-60deg); } to { opacity: 1; transform: none; } }
  .bead {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    height: 28px;
    padding: 0 11px;
    border: 0;
    border-radius: 14px;
    color: #fff;
    font: 600 12.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    white-space: nowrap;
    cursor: pointer;
    background: linear-gradient(180deg, color-mix(in srgb, var(--b) 55%, #fff), var(--b) 45%, color-mix(in srgb, var(--b) 70%, #000));
    box-shadow: 0 6px 10px -5px rgba(0, 0, 0, .45), inset 0 -2px 3px rgba(0, 0, 0, .25);
    text-shadow: 0 1px 1px rgba(0, 0, 0, .3);
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .bead::before {
    /* glossy highlight */
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    top: 2px;
    height: 9px;
    border-radius: 9px;
    background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  .bead::after {
    /* a glint that sweeps across when the tags are saved */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .7) 50%, transparent 65%) -150% 0 / 60% 100% no-repeat;
    pointer-events: none;
  }
  .bead.glint::after { animation: glint .7s ease-out; }
  @keyframes glint { to { background-position: 250% 0; } }
  .bead .x {
    position: absolute;
    right: 3px;
    top: 50%;
    width: 18px;
    height: 18px;
    margin-top: -9px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, .3);
    opacity: 0;
    transform: scale(.4);
    transition: opacity .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .bead .x svg { width: 9px; height: 9px; }
  .bead:hover .x, .bead:focus-visible .x { opacity: 1; transform: none; }
  .bead:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .bead.warn { animation: jiggle .5s; }
  @keyframes jiggle { 20%, 60% { margin-left: -4px; } 40%, 80% { margin-left: 4px; } }
  .bead.armed { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--terra); }
  .ring { position: absolute; z-index: 1; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid var(--thread); pointer-events: none; }
  .empty { position: absolute; left: 0; right: 0; top: 50%; margin: -10px 0 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; transition: opacity .3s; }

  /* ---------- Input ---------- */
  .add { display: flex; gap: 8px; }
  .field {
    flex: 1;
    display: flex;
    align-items: center;
    height: 46px;
    min-width: 0;
    padding: 0 12px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--well);
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within { border-color: var(--terra); box-shadow: 0 0 0 4px color-mix(in srgb, var(--terra) 16%, transparent); }
  .field.bad { animation: shake .4s; border-color: var(--terra); }
  @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
  .field input { flex: 1; width: 0; min-width: 0; border: 0; outline: none; background: none; color: var(--ink); font: 600 15px/1 var(--ff); }
  .field input::placeholder { color: var(--muted); font-weight: 500; }
  .btn {
    height: 46px;
    padding: 0 16px;
    border-radius: 14px;
    border: 0;
    background: var(--ink);
    color: var(--card);
    font: 700 14px/1 var(--ff);
    cursor: pointer;
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), filter .2s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active, .btn.press { transform: scale(.94); }
  .msg { min-height: 18px; margin: 6px 2px 8px; font-size: 12.5px; color: var(--muted); }
  .msg.err { color: var(--terra); font-weight: 600; }
  .msg.good { color: var(--ok); font-weight: 600; }
  .pop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .pop span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .pop button {
    padding: 7px 11px;
    border-radius: 999px;
    border: 1.5px dashed var(--line);
    background: none;
    color: var(--ink);
    font: 600 12.5px/1 var(--ff);
    cursor: pointer;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), opacity .3s, border-color .2s;
  }
  .pop button:hover { border-color: var(--terra); transform: translateY(-2px); }
  .pop button:disabled { opacity: .35; cursor: default; transform: none; }
  .save {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 48px;
    margin-top: 14px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--terra), color-mix(in srgb, var(--terra) 60%, var(--lapis)));
    color: #fff;
    font: 700 15px/1 var(--ff);
    cursor: pointer;
    box-shadow: 0 14px 24px -16px var(--terra);
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), background .3s;
  }
  [data-theme="dark"] .save { color: #22100a; }
  .save:active, .save.press { transform: scale(.96, .9); }
  .save svg { display: none; width: 18px; height: 18px; }
  .save.done { background: var(--ok); }
  .save.done svg { display: block; animation: tick .5s cubic-bezier(.34, 1.8, .64, 1); }
  @keyframes tick { from { transform: scale(0) rotate(-40deg); } }
  button:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <header class="head">
      <div>
        <h1 id="title">Shop tags</h1>
        <p class="lead">What do you sell? String up to 8 tags.</p>
      </div>
      <p class="count" id="count" aria-hidden="true">0 / 8</p>
    </header>

    <div class="tray" id="tray">
      <svg id="threads" aria-hidden="true"></svg>
      <p class="empty" id="empty">Your beads will hang here</p>
      <div id="beads" role="group" aria-label="Your tags"></div>
    </div>

    <div class="add">
      <label class="field" id="field">
        <span class="sr">New tag</span>
        <input id="tag" maxlength="16" autocomplete="off" placeholder="Type a tag, press Enter" aria-describedby="msg">
      </label>
      <button class="btn" id="addBtn" type="button">Add</button>
    </div>
    <p class="msg" id="msg" aria-live="polite">Comma or Enter adds a bead. Backspace twice removes the last one.</p>
    <div class="pop" id="pop" role="group" aria-label="Popular tags"><span>Popular</span></div>
    <button class="save" id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="saveLabel">Save tags</span></button>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var NS = "http://www.w3.org/2000/svg";
  var MAX = 8, GAP = 5, STRANDS = 3, PAD = 26;
  var COLOURS = ["#c4553b", "#2f4fa8", "#1f9e8f", "#d99a2b", "#8a3f74", "#6f8a3a", "#e0664f", "#3b6f9e"];
  var POPULAR = ["Lawn", "Chiffon", "Bridal", "Kurta", "Embroidery", "Kids wear", "Shawls", "Handmade"];

  var tray = $("#tray"), svg = $("#threads"), beadBox = $("#beads"), input = $("#tag"), field = $("#field"), msg = $("#msg"), countEl = $("#count"), empty = $("#empty");
  var saveBtn = $("#save"), saveLabel = $("#saveLabel"), popBox = $("#pop");
  var measure = document.createElement("canvas").getContext("2d");
  measure.font = '600 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

  // ---------- Threads: three sagging strings; more beads = more sag ----------
  var W = 0, H = 0;
  var strands = [];
  for (var k = 0; k < STRANDS; k++) {
    var path = document.createElementNS(NS, "path");
    path.setAttribute("class", "thread");
    svg.appendChild(path);
    var kL = document.createElementNS(NS, "circle"), kR = document.createElementNS(NS, "circle");
    kL.setAttribute("class", "knot"); kR.setAttribute("class", "knot");
    kL.setAttribute("r", 3.5); kR.setAttribute("r", 3.5);
    svg.appendChild(kL); svg.appendChild(kR);
    var bow = document.createElementNS(NS, "path");
    bow.setAttribute("class", "bow");
    svg.appendChild(bow);
    strands.push({ path: path, kL: kL, kR: kR, bow: bow, sag: 6, v: 0, y: 0, pts: [], len: 0 });
  }
  function sizeTray() {
    W = tray.clientWidth; H = tray.clientHeight;
    strands.forEach(function (s, i) { s.y = 30 + i * ((H - 76) / (STRANDS - 1)); });
    layout();
  }
  // Points along a string (quadratic curve), with running length so beads can sit at any distance along it
  function build(s) {
    var x0 = PAD, x1 = W - PAD, cy = s.y + s.sag * 2;
    s.pts = []; s.len = 0;
    var px = x0, py = s.y;
    for (var i = 0; i <= 48; i++) {
      var t = i / 48, x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * ((x0 + x1) / 2) + t * t * x1;
      var y = (1 - t) * (1 - t) * s.y + 2 * (1 - t) * t * cy + t * t * s.y;
      if (i) s.len += Math.hypot(x - px, y - py);
      s.pts.push({ x: x, y: y, d: s.len });
      px = x; py = y;
    }
    s.path.setAttribute("d", "M" + x0 + " " + s.y + " Q" + (x0 + x1) / 2 + " " + cy.toFixed(2) + " " + x1 + " " + s.y);
    s.kL.setAttribute("cx", x0); s.kL.setAttribute("cy", s.y);
    s.kR.setAttribute("cx", x1); s.kR.setAttribute("cy", s.y);
    s.bow.setAttribute("d", "M" + x1 + " " + s.y + " c6 -9 14 -6 8 1 c8 3 6 11 -3 5 M" + x1 + " " + s.y + " l4 12 M" + x1 + " " + s.y + " l9 9");
  }
  function at(s, d) {
    var p = s.pts, n = p.length;
    d = Math.max(0, Math.min(s.len, d));
    for (var i = 1; i < n; i++) {
      if (p[i].d >= d) {
        var a = p[i - 1], b = p[i], k = (d - a.d) / ((b.d - a.d) || 1);
        return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI };
      }
    }
    return { x: p[n - 1].x, y: p[n - 1].y, ang: 0 };
  }

  // ---------- Beads ----------
  var beads = [], falling = [];
  function colourFor(text) { var h = 0; for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0; return COLOURS[h % COLOURS.length]; }
  function pos(b) { var s = strands[b.strand || 0]; return s.pts.length ? at(s, s.len / 2 + (b.c || 0)) : { x: W / 2, y: s.y, ang: 0 }; }

  // Which string each bead goes on, and its place (distance from the middle of that string)
  function layout() {
    var room = Math.max(160, W - PAD * 2 - 20), rows = [[]], used = 0;
    beads.forEach(function (b) {
      if (used + b.w > room && rows.length < STRANDS && rows[rows.length - 1].length) { rows.push([]); used = 0; }
      rows[rows.length - 1].push(b);
      used += b.w + GAP;
    });
    rows.forEach(function (row, si) {
      var total = row.reduce(function (a, b) { return a + b.w; }, 0) + GAP * (row.length - 1), x = -total / 2;
      row.forEach(function (b) {
        var target = x + b.w / 2;
        if (b.strand !== si && b.strand != null && !b.flight) { // hops across to another string
          var from = pos(b);
          b.flight = { x: from.x, y: from.y, a: from.ang, t0: performance.now(), dur: 520, lift: 26 };
        }
        b.strand = si;
        b.tc = target;
        if (b.c == null) b.c = target;
        x += b.w + GAP;
      });
    });
  }

  function add(raw, fromEl) {
    var text = raw.replace(/\s+/g, " ").trim();
    if (!text) { nope(); return false; }
    text = text.charAt(0).toUpperCase() + text.slice(1);
    var dupe = beads.filter(function (b) { return b.text.toLowerCase() === text.toLowerCase(); })[0];
    if (dupe) {
      dupe.el.classList.remove("warn"); void dupe.el.offsetWidth; dupe.el.classList.add("warn");
      say(text + " is already on the string.", "err");
      return false;
    }
    if (beads.length >= MAX) {
      strands.forEach(function (s) { s.v += 3; });
      say("The strings are full. Remove a bead to add another.", "err");
      nope();
      return false;
    }
    var el = document.createElement("button");
    el.type = "button";
    el.className = "bead";
    el.setAttribute("aria-label", text + ". Press to remove");
    el.style.setProperty("--b", colourFor(text));
    el.innerHTML = '<span>' + text.replace(/</g, "&lt;") + '</span><span class="x" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
    beadBox.appendChild(el);
    var b = { text: text, el: el, w: Math.ceil(measure.measureText(text).width) + 22, strand: null, c: null, tc: 0 };
    el.style.width = b.w + "px";
    beads.push(b);
    layout();
    // fly in from the field (or the chip that was pressed), along an arc
    var tr = tray.getBoundingClientRect(), src = (fromEl || field).getBoundingClientRect();
    b.flight = { x: src.left - tr.left + Math.min(src.width / 2, 60), y: src.top - tr.top + src.height / 2, a: -30, t0: performance.now(), dur: reduceMq.matches ? 1 : 640, lift: 70, spin: true };
    el.addEventListener("click", function () { remove(b); });
    el.addEventListener("keydown", function (e) { beadKeys(e, b); });
    changed();
    say("Added " + text + ". " + beads.length + " of " + MAX + ".", "");
    return true;
  }
  function remove(b, quiet) {
    var i = beads.indexOf(b);
    if (i < 0) return;
    var p = pos(b);
    beads.splice(i, 1);
    strands[b.strand].v -= 5; // the string twangs
    falling.push({ el: b.el, x: p.x, y: p.y, a: p.ang, vx: (Math.random() - .5) * 3, vy: -3.2, va: (Math.random() - .5) * 14, life: 0 });
    b.el.disabled = true;
    b.el.setAttribute("aria-hidden", "true");
    layout();
    changed();
    if (!quiet) say("Removed " + b.text + ".", "");
    var next = beads[Math.min(i, beads.length - 1)];
    if (document.activeElement === b.el) (next ? next.el : input).focus({ preventScroll: true });
  }
  function beadKeys(e, b) {
    var i = beads.indexOf(b);
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); (beads[i + 1] ? beads[i + 1].el : input).focus(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); if (beads[i - 1]) beads[i - 1].el.focus(); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); remove(b); }
  }
  function changed() {
    countEl.textContent = beads.length + " / " + MAX;
    countEl.classList.toggle("full", beads.length >= MAX);
    empty.style.opacity = beads.length ? 0 : 1;
    [].forEach.call(popBox.querySelectorAll("button"), function (pb) {
      pb.disabled = beads.some(function (b) { return b.text.toLowerCase() === pb.textContent.toLowerCase(); });
    });
    tray.classList.remove("tied");
    saveBtn.classList.remove("done");
    saveLabel.textContent = "Save tags";
    if (armed) { armed.el.classList.remove("armed"); armed = null; }
  }
  function say(t, kind) { msg.textContent = t; msg.className = "msg" + (kind ? " " + kind : ""); }
  function nope() { field.classList.remove("bad"); void field.offsetWidth; field.classList.add("bad"); }
  field.addEventListener("animationend", function () { field.classList.remove("bad"); });
  beadBox.addEventListener("animationend", function (e) { e.target.classList.remove("warn", "glint"); });

  // ---------- Typing: Enter or comma adds; pasted lists split on commas ----------
  var armed = null;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      if (add(input.value)) input.value = "";
    } else if (e.key === "Backspace" && !input.value && beads.length) {
      var lastB = beads[beads.length - 1];
      if (armed === lastB) remove(lastB);
      else { armed = lastB; lastB.el.classList.add("armed"); say("Press Backspace again to remove " + lastB.text + ".", ""); }
    } else if (armed && e.key !== "Backspace") { armed.el.classList.remove("armed"); armed = null; }
  });
  input.addEventListener("paste", function (e) {
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (text.indexOf(",") < 0) return;
    e.preventDefault();
    text.split(",").forEach(function (part, i) { setTimeout(function () { add(part); }, i * 120); });
  });
  $("#addBtn").addEventListener("click", function () { if (add(input.value)) input.value = ""; input.focus(); });
  POPULAR.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t;
    b.addEventListener("click", function () { add(t, b); });
    popBox.appendChild(b);
  });

  // ---------- Save: knots tie, beads glint one by one, the string pulls taut ----------
  var saving = false;
  saveBtn.addEventListener("click", async function () {
    if (saving) return;
    if (!beads.length) { say("Add at least one tag first.", "err"); nope(); return; }
    saving = true;
    tray.classList.remove("tied"); void tray.offsetWidth; tray.classList.add("tied");
    strands.forEach(function (s) { s.v -= 4; });
    beads.forEach(function (b, i) { setTimeout(function () { b.el.classList.remove("glint"); void b.el.offsetWidth; b.el.classList.add("glint"); }, reduceMq.matches ? 0 : 200 + i * 90); });
    await wait(reduceMq.matches ? 50 : 300 + beads.length * 90);
    saveBtn.classList.add("done");
    saveLabel.textContent = "Saved " + beads.length + (beads.length > 1 ? " tags" : " tag");
    say("Buyers can now find you under " + beads.slice(0, 3).map(function (b) { return b.text; }).join(", ") + (beads.length > 3 ? " and more." : "."), "good");
    saving = false;
  });

  // ---------- One animation clock: string springs, beads slide, fly and fall ----------
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(48, t - last) / 16.7;
    last = t;
    var calm = reduceMq.matches;
    strands.forEach(function (s, i) {
      var n = beads.filter(function (b) { return b.strand === i; }).length;
      var goal = 5 + n * 3.2 + (calm ? 0 : Math.sin(t / 1300 + i) * .8);
      if (calm) { s.sag = goal; s.v = 0; }
      else { s.v += (goal - s.sag) * .09 * dt; s.v *= Math.pow(.86, dt); s.sag += s.v * dt; }
      build(s);
    });
    beads.forEach(function (b) {
      b.c += (b.tc - b.c) * (calm ? 1 : Math.min(1, .16 * dt));
      var p = pos(b), x = p.x, y = p.y, a = p.ang, sc = 1;
      if (b.flight) {
        var f = b.flight, k = Math.min(1, (t - f.t0) / f.dur), e = 1 - Math.pow(1 - k, 3);
        x = f.x + (p.x - f.x) * e;
        y = f.y + (p.y - f.y) * e - Math.sin(Math.PI * k) * f.lift;
        a = f.a + (p.ang - f.a) * e + (f.spin ? (1 - e) * 200 : 0);
        sc = .7 + .3 * e + Math.sin(Math.PI * k) * .15;
        if (k >= 1) { b.flight = null; strands[b.strand].v += 4.5; ring(p.x, p.y); }
      }
      b.el.style.transform = "translate(" + (x - b.w / 2).toFixed(1) + "px," + (y - 14).toFixed(1) + "px) rotate(" + a.toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")";
    });
    falling = falling.filter(function (f) {
      f.life += dt;
      f.vy += .45 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt;
      if (f.y > H - 16 && f.vy > 0) { f.y = H - 16; f.vy *= -.42; f.vx *= .7; f.va *= .6; }
      f.el.style.transform = "translate(" + (f.x - f.el.offsetWidth / 2).toFixed(1) + "px," + (f.y - 14).toFixed(1) + "px) rotate(" + f.a.toFixed(1) + "deg)";
      f.el.style.opacity = Math.max(0, 1 - f.life / 55).toFixed(2);
      if (f.life > 55 || calm) { f.el.remove(); return false; }
      return true;
    });
    requestAnimationFrame(frame);
  }
  function ring(x, y) {
    if (reduceMq.matches) return;
    var r = document.createElement("i");
    r.className = "ring";
    r.style.left = x + "px"; r.style.top = y + "px";
    tray.appendChild(r);
    r.animate([{ transform: "scale(.3)", opacity: .8 }, { transform: "scale(1.4)", opacity: 0 }], { duration: 500, easing: "ease-out" }).onfinish = function () { r.remove(); };
  }

  sizeTray();
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(sizeTray).observe(tray); else addEventListener("resize", sizeTray);
  requestAnimationFrame(frame);

  // ---------- Auto demo: plays on load and every few seconds until someone touches it ----------
  var demoOn = true;
  function stopDemo(e) { if (e.isTrusted) demoOn = false; }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function type(s) { input.value = ""; for (var i = 0; i < s.length; i++) { input.value += s[i]; await pause(70); } }
  function chip(t) { return [].filter.call(popBox.querySelectorAll("button"), function (b) { return b.textContent === t; })[0]; }
  async function demo() {
    try {
      await pause(250);
      while (demoOn) {
        await type("Lawn"); await pause(160); add(input.value); input.value = ""; await pause(450);
        await type("Block print"); await pause(160); add(input.value); input.value = ""; await pause(500);
        add("Bridal", chip("Bridal")); await pause(550);
        add("Embroidery", chip("Embroidery")); await pause(550);
        add("Kids wear", chip("Kids wear")); await pause(700);
        await type("lawn"); await pause(160); add(input.value); input.value = ""; await pause(1100);
        remove(beads[1]); await pause(900);
        saveBtn.classList.add("press"); await pause(150); saveBtn.classList.remove("press");
        saveBtn.click(); await pause(2600);
        while (beads.length) { remove(beads[beads.length - 1], true); await pause(160); }
        say("Comma or Enter adds a bead. Backspace twice removes the last one.", "");
        await pause(1300);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
</script>
</body>
</html>
