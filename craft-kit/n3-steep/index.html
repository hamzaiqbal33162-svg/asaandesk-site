<!doctype html>
<!-- Chill & Craft · Steep · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steep · tea cup rating</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: cream linen, terracotta and sage (light), walnut tea room (dark) ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --bg: #f3e7d6;
    --bg2: #fbf5ec;
    --card: #fffaf3;
    --ink: #3b2418;
    --muted: #8b6f5c;
    --line: #eddcc6;
    --soft: #f7ecdd;
    --terra: #c8553d;
    --sage: #7d9a6a;
    --tray: #b9824f;
    --porcelain: #ffffff;
    --rim: #e9dccb;
    --inner: #f6eee3;
    --tea: #b5743a;
    --shadow: rgba(110, 60, 20, .28);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #140d09;
    --bg2: #1f150f;
    --card: #1d140e;
    --ink: #f6e6d6;
    --muted: #c0a08a;
    --line: #3a2a1f;
    --soft: #281c14;
    --terra: #ec7a5e;
    --sage: #a9c493;
    --tray: #6e4524;
    --porcelain: #f3ece4;
    --rim: #cbbcab;
    --inner: #ddd1c2;
    --shadow: rgba(0, 0, 0, .7);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--ff); color: var(--ink); background: var(--bg); }
  .stage {
    min-height: 100vh; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); padding: 18px 14px; overflow: hidden; overflow-x: clip;
    background:
      radial-gradient(55% 40% at 50% 20%, color-mix(in srgb, var(--terra) 16%, transparent), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, var(--bg2), var(--bg));
  }
  .card {
    position: relative; width: min(100%, 410px); padding: 20px 18px 18px; border-radius: 30px; overflow: hidden; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 40px 80px -46px var(--shadow), 0 12px 26px -18px var(--shadow);
    animation: rise .8s cubic-bezier(.22, 1.3, .36, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.97); } }
  .kicker { margin: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--terra); }
  h1 { margin: 4px 0 2px; font: 700 clamp(20px, 5.6vw, 23px)/1.15 var(--serif); letter-spacing: -.01em; }
  .sub { margin: 0; font-size: 12.5px; color: var(--muted); }

  /* ---------- Tray of cups with a travelling kettle ---------- */
  .tray { position: relative; margin: 14px -8px 0; padding-top: 52px; }
  .tray::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 14px; border-radius: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--tray) 80%, #fff), var(--tray)); box-shadow: 0 8px 14px -8px var(--shadow); z-index: 0; }
  .kettle { position: absolute; left: 0; top: 0; width: 64px; height: 46px; z-index: 3; pointer-events: none; transition: transform .5s cubic-bezier(.34, 1.3, .64, 1); }
  .kettle svg { width: 100%; height: 100%; overflow: visible; transform-origin: 62% 70%; transition: transform .35s cubic-bezier(.34, 1.56, .64, 1); }
  .kettle.tilt svg { transform: rotate(-26deg); }
  .kettle.fast { transition-duration: .22s; transition-timing-function: linear; }
  .kettle.whistle svg { animation: whistle .12s linear infinite alternate; }
  @keyframes whistle { from { transform: rotate(-3deg) translateY(-1px); } to { transform: rotate(3deg); } }
  .kettle .idle { animation: bob 3s ease-in-out infinite; transform-box: fill-box; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .stream { position: absolute; z-index: 2; width: 4px; margin-left: -2px; border-radius: 2px; background: linear-gradient(180deg, color-mix(in srgb, var(--tea) 70%, #fff), var(--tea)); transform-origin: top; transform: scaleY(0); transition: transform .14s ease, left .22s linear; pointer-events: none; }
  .stream.on { transform: scaleY(1); }
  .puff { position: absolute; z-index: 4; width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, .85); pointer-events: none; animation: puff 1s ease-out forwards; }
  [data-theme="light"] .puff { background: rgba(200, 190, 180, .7); }
  @keyframes puff { from { transform: translate(0, 0) scale(.4); opacity: .9; } to { transform: translate(var(--x), var(--y)) scale(2.2); opacity: 0; } }

  /* the row keeps 16px free on the right so the kettle still fits over the last cup */
  .cups { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 0; margin: 0; padding: 0 16px 10px 0; min-width: 0; }
  .cups legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cup { position: relative; display: grid; justify-items: center; cursor: pointer; padding: 2px 0; -webkit-tap-highlight-color: transparent; }
  .cup input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .cup svg { width: min(100%, 66px); height: auto; overflow: visible; transition: transform .35s cubic-bezier(.34, 1.56, .64, 1); }
  .cup:hover svg { transform: translateY(-3px); }
  .cup.clink svg { animation: clink .5s cubic-bezier(.3, 1.6, .5, 1); animation-delay: calc(var(--i) * 60ms); }
  @keyframes clink { 30% { transform: rotate(-7deg) translateY(-4px); } 60% { transform: rotate(4deg); } }
  .cup.ask svg { animation: ask .5s ease; animation-delay: calc(var(--i) * 50ms); }
  @keyframes ask { 30% { transform: translateY(-6px); } }
  .cup .num { font-size: 10px; font-weight: 800; color: var(--muted); margin-top: -2px; transition: color .3s; }
  .cup.full .num { color: var(--terra); }
  .cup input:focus-visible + svg .rimline { stroke: var(--terra); stroke-width: 3; }
  .porc { fill: var(--porcelain); stroke: var(--rim); stroke-width: 1.4; }
  .rimline { fill: var(--inner); stroke: var(--rim); stroke-width: 1.4; transition: stroke .2s; }
  .surface { fill: var(--tea); transition: fill .5s; }
  .ghost { fill: none; stroke: var(--tea); stroke-width: 1.4; stroke-dasharray: 3 3; opacity: 0; transition: opacity .25s; }
  .cup.peek .ghost { opacity: .7; }
  .swirl { fill: none; stroke: rgba(255, 240, 220, .75); stroke-width: 1.3; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: swirl 6s linear infinite; opacity: 0; transition: opacity .5s; }
  .cup.full.milk .swirl { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @keyframes swirl { to { transform: rotate(1turn); } }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: 0; }
  .cup.full .steam path { animation: steam 2.6s ease-in-out infinite; }
  .cup.full .steam path:nth-child(2) { animation-delay: -1.3s; }
  @keyframes steam { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: .45; } 100% { transform: translateY(-14px); opacity: 0; } }
  .cube { fill: #fff; stroke: #e6d6c2; }
  .drop { fill: var(--tea); }

  /* ---------- Word, chips, note, send ---------- */
  .word { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin: 12px 0 0; min-height: 28px; }
  .word b { font: 700 20px/1 var(--serif); color: var(--ink); display: inline-block; }
  .word b.roll { animation: roll .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes roll { from { transform: translateY(10px); opacity: 0; } }
  .word span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 0; min-height: 32px; }
  .chips button {
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 12.5px/1 var(--ff); cursor: pointer;
    animation: chipIn .4s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * 50ms); transition: background .2s, border-color .2s, color .2s, transform .2s;
  }
  @keyframes chipIn { from { opacity: 0; transform: scale(.6) translateY(6px); } }
  .chips button:hover { border-color: var(--terra); }
  .chips button[aria-pressed="true"] { background: var(--terra); border-color: var(--terra); color: #fff; }
  .chips .hint { font-size: 12px; color: var(--muted); align-self: center; }
  .note { position: relative; display: block; margin-top: 12px; }
  .note textarea {
    width: 100%; height: 44px; resize: none; padding: 12px 52px 10px 13px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--soft); color: var(--ink);
    font: 500 13.5px/1.35 var(--ff); outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .note textarea:focus { border-color: var(--terra); box-shadow: 0 0 0 4px color-mix(in srgb, var(--terra) 16%, transparent); }
  .note small { position: absolute; right: 12px; top: 14px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 12px; }
  .msg { margin: 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  .send {
    position: relative; height: 46px; padding: 0 18px; border: 0; border-radius: 15px; cursor: pointer; color: #fff; font: 800 14px/1 var(--ff); overflow: hidden;
    background: linear-gradient(180deg, color-mix(in srgb, var(--terra) 85%, #fff), var(--terra)); box-shadow: 0 12px 20px -12px var(--terra);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), filter .25s, opacity .25s;
  }
  .send:hover { transform: translateY(-2px); }
  .send:active { transform: scale(.96); }
  .send[aria-disabled="true"] { filter: grayscale(.6); opacity: .55; }
  .send .fillbar { position: absolute; left: 0; bottom: 0; height: 100%; width: 100%; background: rgba(255, 255, 255, .22); transform-origin: left; transform: scaleX(0); }
  .send.busy .fillbar { transition: transform .95s cubic-bezier(.4, 0, .2, 1); transform: scaleX(1); }
  .send span { position: relative; }

  /* ---------- Thank you ---------- */
  .thanks { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 4px; padding: 20px; text-align: center; background: var(--card); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .thanks.on { opacity: 1; pointer-events: auto; }
  .thanks svg { width: 150px; height: 150px; overflow: visible; }
  .heart { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 160; stroke-dashoffset: 160; opacity: .7; }
  .thanks.on .heart { animation: heart 2.2s .3s ease-out forwards; }
  @keyframes heart { 60% { stroke-dashoffset: 0; opacity: .8; } 100% { stroke-dashoffset: 0; opacity: 0; transform: translateY(-14px); } }
  .thanks h2 { margin: 4px 0 0; font: 700 22px/1.2 var(--serif); }
  .thanks p { margin: 0; font-size: 13px; color: var(--muted); }
  .thanks .big { transform: scale(.7); opacity: 0; transition: transform .6s cubic-bezier(.34, 1.56, .64, 1), opacity .3s; }
  .thanks.on .big { transform: none; opacity: 1; }
  .again { margin-top: 12px; padding: 10px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: 700 13px/1 var(--ff); cursor: pointer; }

  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--terra); outline-offset: 2px; }
  @media (max-width: 370px) { .card { padding: 16px 14px; } .tray { margin: 12px -6px 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <p class="kicker">Hilltop Tea House · Murree</p>
    <h1 id="title">How was your cardamom tea?</h1>
    <p class="sub">Order 418 · served 10 minutes ago</p>

    <div class="tray" id="tray">
      <div class="kettle" id="kettle" aria-hidden="true">
        <svg viewBox="0 0 84 60">
          <g class="idle">
            <path d="M24 44 Q8 40 4 26 L10 24 Q14 34 26 37 Z" fill="#a8432f"/>
            <path d="M22 18 Q22 10 44 10 Q66 10 66 18 L70 46 Q70 56 44 56 Q18 56 18 46 Z" fill="#c8553d"/>
            <path d="M24 22 Q30 16 40 16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45"/>
            <rect x="34" y="4" width="20" height="7" rx="3.5" fill="#8f3524"/>
            <circle cx="44" cy="3" r="3" fill="#8f3524"/>
            <path d="M62 16 Q82 16 80 32 Q78 44 68 44" fill="none" stroke="#3b2418" stroke-width="4" stroke-linecap="round"/>
            <path d="M18 44 H70" stroke="#8f3524" stroke-width="2"/>
          </g>
        </svg>
      </div>
      <div class="stream" id="stream"></div>
      <fieldset class="cups" id="cups">
        <legend>Rate your tea from 1 to 5 cups</legend>
      </fieldset>
    </div>

    <p class="word" aria-hidden="true"><b id="word">Tap a cup</b><span id="wordNum"></span></p>
    <div class="chips" id="chips" aria-label="What stood out"><span class="hint">Pick a rating to tell us more</span></div>
    <label class="note"><span class="sr">Anything else</span>
      <textarea id="note" maxlength="140" placeholder="Anything else? (optional)"></textarea><small id="noteCount">0/140</small>
    </label>
    <div class="row">
      <p class="msg" id="msg" role="status" aria-live="polite">Your rating helps the kitchen</p>
      <button class="send" id="send" type="button" aria-disabled="true"><span class="fillbar"></span><span id="sendText">Send rating</span></button>
    </div>

    <div class="thanks" id="thanks" aria-hidden="true">
      <svg viewBox="0 0 150 150" aria-hidden="true">
        <path class="heart" d="M75 70 C 60 50, 38 58, 46 76 C 52 88, 70 94, 75 100 C 80 94, 98 88, 104 76 C 112 58, 90 50, 75 70" transform="translate(0 -34)"/>
        <g class="big">
          <ellipse cx="75" cy="132" rx="54" ry="10" fill="var(--porcelain)" stroke="var(--rim)" stroke-width="2"/>
          <path d="M32 82 H118 V96 Q118 128 75 128 Q32 128 32 96 Z" fill="var(--porcelain)" stroke="var(--rim)" stroke-width="2"/>
          <path d="M118 90 q20 0 20 14 q0 14 -22 14" fill="none" stroke="var(--rim)" stroke-width="5"/>
          <ellipse cx="75" cy="82" rx="43" ry="9" fill="var(--inner)" stroke="var(--rim)" stroke-width="2"/>
          <ellipse cx="75" cy="84" rx="38" ry="6.5" fill="#9c5a26"/>
          <path d="M66 84 q9 -5 18 0 q-9 4 -14 -1" fill="none" stroke="rgba(255,240,220,.8)" stroke-width="1.6"/>
        </g>
      </svg>
      <h2 id="thanksTitle">Thank you, Ayesha</h2>
      <p id="thanksText">You rated it 4 cups.</p>
      <button class="again" id="again" type="button">Rate again</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var WORDS = ["Tap a cup", "Too weak", "Just okay", "Good brew", "Lovely", "Perfect cup"];
  var TEA = ["#b5743a", "#d6ae78", "#c69256", "#b5743a", "#9c5a26", "#7d4116"]; // deeper with a better score
  var CHIPS = {
    low: ["Too sweet", "Served cold", "Watery", "Slow service", "Not enough cardamom"],
    mid: ["Nice and hot", "Could be stronger", "Friendly staff", "Good value"],
    high: ["Strong and fresh", "Just the right sugar", "Fresh cardamom", "Great service", "Cosy spot"]
  };

  // ---------- Build five cups (each one a real radio input) ----------
  var cupsEl = $("#cups"), cups = [];
  for (var i = 1; i <= 5; i++) {
    var lab = document.createElement("label");
    lab.className = "cup"; lab.style.setProperty("--i", i - 1);
    lab.innerHTML =
      '<input type="radio" name="rate" value="' + i + '" aria-label="' + i + " cup" + (i > 1 ? "s" : "") + ": " + WORDS[i] + '">' +
      '<svg viewBox="0 0 64 74" aria-hidden="true">' +
        '<g class="steam"><path d="M26 14 q-4 -6 0 -12"/><path d="M38 14 q4 -6 0 -12"/></g>' +
        '<ellipse cx="32" cy="66" rx="29" ry="6" class="porc"/><ellipse cx="32" cy="65" rx="17" ry="3" fill="var(--inner)"/>' +
        '<path d="M53 30 q11 0 11 9 q0 9 -12 9" fill="none" stroke="var(--rim)" stroke-width="3.4"/>' +
        '<path d="M10 24 H54 V36 Q54 60 32 60 Q10 60 10 36 Z" class="porc"/>' +
        '<path d="M14 40 Q16 52 26 56" fill="none" stroke="var(--rim)" stroke-width="1.2" opacity=".6"/>' +
        '<ellipse cx="32" cy="24" rx="22" ry="5.5" class="rimline"/>' +
        '<ellipse class="ghost" cx="32" cy="25" rx="18" ry="3.6"/>' +
        '<ellipse class="surface" cx="32" cy="25" rx="0" ry="0"/>' +
        '<path class="swirl" d="M28 25 q4 -3 8 0 q-3 2.5 -6 -.5"/>' +
        '<g class="fx"></g>' +
      "</svg><span class=\"num\" aria-hidden=\"true\">" + i + "</span>";
    cupsEl.appendChild(lab);
    cups.push({ el: lab, input: lab.querySelector("input"), surface: lab.querySelector(".surface"), fx: lab.querySelector(".fx"), fill: 0 });
  }

  // ---------- Tea level in each cup: a little spring per cup ----------
  var springs = cups.map(function () { return { p: 0, v: 0, t: 0 }; });
  function frame() {
    springs.forEach(function (s, k) {
      if (reduce.matches) { s.p = s.t; s.v = 0; } else { s.v = s.v * .7 + (s.t - s.p) * .14; s.p += s.v; }
      var f = Math.max(0, s.p), y = 31 - 6 * Math.min(1, f);
      cups[k].surface.setAttribute("cy", y.toFixed(2));
      cups[k].surface.setAttribute("rx", (19 * Math.min(1.04, f)).toFixed(2));
      cups[k].surface.setAttribute("ry", (3.8 * Math.min(1.04, f)).toFixed(2));
    });
    requestAnimationFrame(frame);
  }

  // ---------- Kettle and stream positions ----------
  var tray = $("#tray"), kettle = $("#kettle"), stream = $("#stream"), kettleX = 0;
  function cupBox(k) {
    var t = tray.getBoundingClientRect(), s = cups[k].el.querySelector("svg").getBoundingClientRect();
    return { x: s.left - t.left + s.width / 2, rim: s.top - t.top + s.height * (24 / 74) }; // the rim sits 24/74 down the cup
  }
  function cupX(k) { return cupBox(k).x; }
  // the spout tip sits about 3px from the kettle's left edge, tilted or not
  function kettleTo(x) { kettleX = x - 3; kettle.style.transform = "translateX(" + kettleX.toFixed(1) + "px)"; }
  function homeX() { return tray.clientWidth - 62; }
  function streamAt(k, on) {
    var b = cupBox(k), top = 36;
    stream.style.left = b.x + "px"; stream.style.top = top + "px"; stream.style.height = Math.max(10, b.rim - top + 2) + "px";
    stream.classList.toggle("on", on);
  }

  // ---------- Rating ----------
  var rating = 0, hover = 0, pourId = 0, picked = {};
  var word = $("#word"), wordNum = $("#wordNum"), msg = $("#msg"), send = $("#send");
  function setWord(n) {
    var t = WORDS[n];
    if (word.textContent !== t) { word.textContent = t; word.classList.remove("roll"); void word.offsetWidth; word.classList.add("roll"); }
    wordNum.textContent = n ? n + " of 5" : "";
  }
  function paintTea(n) {
    document.documentElement.style.setProperty("--tea", TEA[n || 3]);
    cups.forEach(function (c, k) { c.el.classList.toggle("milk", k < rating && rating >= 4); });
  }
  function peek(n) {
    hover = n;
    cups.forEach(function (c, k) { c.el.classList.toggle("peek", n > 0 && k < n && k >= rating); });
    setWord(n || rating);
    if (busyPour) return;
    kettleTo(n ? cupX(n - 1) : rating ? cupX(rating - 1) : homeX());
  }
  var busyPour = false;
  async function pourTo(n) {
    // start from the cups that really hold tea, so a pour cut short by a new pick carries on cleanly
    var id = ++pourId, from = springs.filter(function (s) { return s.t === 1; }).length;
    stream.classList.remove("on"); kettle.classList.remove("tilt", "fast"); busyPour = false;
    rating = n;
    paintTea(n); setWord(n); renderChips();
    cups.forEach(function (c, k) { c.input.checked = k === n - 1; c.el.classList.remove("peek"); });
    send.setAttribute("aria-disabled", "false");
    msg.textContent = n + " cup" + (n > 1 ? "s" : "") + ": " + WORDS[n] + ". Add a note or send it.";
    if (n > from) {
      // the kettle tips once and glides along the row, filling each cup as it passes
      busyPour = true;
      kettle.classList.remove("fast"); kettleTo(cupX(from)); await wait(reduce.matches ? 0 : from ? 160 : 380);
      if (id !== pourId) return;
      kettle.classList.add("tilt", "fast");
      for (var k = from; k < n; k++) {
        kettleTo(cupX(k)); streamAt(k, true);
        await wait(reduce.matches ? 0 : 200);
        if (id !== pourId) return;
        springs[k].t = 1; springs[k].v += .08; cups[k].el.classList.add("full");
        await wait(reduce.matches ? 0 : 90);
      }
      stream.classList.remove("on"); kettle.classList.remove("tilt", "fast");
      busyPour = false;
      sugar(n - 1);
      cups.forEach(function (c, k) { c.el.classList.remove("clink"); if (k < n) { void c.el.offsetWidth; c.el.classList.add("clink"); } });

    var cube = document.createElementNS(NS, "rect");
    cube.setAttribute("class", "cube"); cube.setAttribute("x", 28); cube.setAttribute("y", -20); cube.setAttribute("width", 8); cube.setAttribute("height", 8); cube.setAttribute("rx", 1.5);
    fx.appendChild(cube);
    cube.animate([{ transform: "translateY(0) rotate(0)" }, { transform: "translateY(42px) rotate(40deg)", opacity: 1 }, { transform: "translateY(44px) rotate(40deg)", opacity: 0 }], { duration: 520, easing: "cubic-bezier(.5,0,.9,.6)" }).onfinish = function () {

        fx.appendChild(c);
        c.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: "translate(" + (Math.cos(a) * 14).toFixed(1) + "px," + (Math.sin(a) * 12 - 4).toFixed(1) + "px)", opacity: 0 }], { duration: 480, easing: "ease-out" }).onfinish = function () { this.effect.target.remove(); };
      }

    };
  }

  cupsEl.addEventListener("change", function (e) { if (e.target.name === "rate") pourTo(+e.target.value); });
  cups.forEach(function (c, k) {
    c.el.addEventListener("pointerenter", function () { peek(k + 1); });
    c.el.addEventListener("pointerleave", function () { peek(0); });
    // clicking the cup you already picked still gives a little clink
    c.el.addEventListener("click", function () { if (rating === k + 1) { c.el.classList.remove("clink"); void c.el.offsetWidth; c.el.classList.add("clink"); } });
  });

  // ---------- Chips for what stood out ----------
  var chipsEl = $("#chips"), lastGroup = "";
  function group(n) { return n <= 2 ? "low" : n === 3 ? "mid" : "high"; }
  function renderChips() {
    var g = group(rating);
    if (g === lastGroup) return;
    lastGroup = g; picked = {};
    chipsEl.innerHTML = CHIPS[g].map(function (t, i) { return '<button type="button" aria-pressed="false" style="--i:' + i + '">' + t + "</button>"; }).join("");
  }
  chipsEl.addEventListener("click", function (e) {

  var note = $("#note");
  note.addEventListener("input", function () { $("#noteCount").textContent = note.value.length + "/140"; });

  // ---------- Send: the kettle whistles, steam puffs, then a thank-you cup ----------
  var thanks = $("#thanks"), sending = false;
  function puffs() {
    if (reduce.matches) return;
    for (var p = 0; p < 8; p++) {

      s.className = "puff";
      s.style.left = (kettleX - 4) + "px"; s.style.top = "10px";
      s.style.setProperty("--x", (-10 - Math.random() * 30).toFixed(0) + "px"); s.style.setProperty("--y", (-14 - Math.random() * 26).toFixed(0) + "px");

  }
  send.addEventListener("click", function (e) { var btn = e.currentTarget; doSend(btn); });
  function resetAll() {
    pourId++; busyPour = false;
    thanks.classList.remove("on"); thanks.setAttribute("aria-hidden", "true");
    rating = 0; lastGroup = ""; picked = {};
    springs.forEach(function (s) { s.t = 0; });
    cups.forEach(function (c) { c.input.checked = false; c.el.classList.remove("full", "milk", "peek"); });
    stream.classList.remove("on"); kettle.classList.remove("tilt", "fast", "whistle");
    chipsEl.innerHTML = '<span class="hint">Pick a rating to tell us more</span>';
    note.value = ""; $("#noteCount").textContent = "0/140";
    send.setAttribute("aria-disabled", "true"); setWord(0); msg.textContent = "Your rating helps the kitchen";
    kettleTo(homeX());
  }
  $("#again").addEventListener("click", function () { resetAll(); cups[0].input.focus(); });

  // ---------- Start ----------
  kettle.style.transition = "none"; kettleTo(homeX()); void kettle.offsetWidth; kettle.style.transition = "";
  window.addEventListener("resize", function () { if (!busyPour) kettleTo(rating ? cupX(rating - 1) : homeX()); });
  requestAnimationFrame(frame);

  // ---------- Auto demo: hovers along the cups, pours a rating, adds a note and sends ----------
  var demoOn = true;
  function stopDemo(e) { if (!e.isTrusted || !demoOn) return; demoOn = false; resetAll(); }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function typeNote(t) { for (var i = 0; i < t.length; i++) { note.value += t[i]; $("#noteCount").textContent = note.value.length + "/140"; await pause(55); } }
  async function demo() {
    try {
      await pause(800);
      var round = 0;
      while (demoOn) {
        for (var h = 1; h <= 5; h++) { peek(h); await pause(230); }
        peek(4); await pause(400); peek(0);
        if (round % 2) { await pourTo(2); await pause(1100); await pourTo(5); }
        else await pourTo(4);
        await pause(900);
        var chip = chipsEl.querySelectorAll("button")[round % 2 ? 0 : 2]; if (chip) chip.click();
        await pause(500);
        await typeNote(round % 2 ? "Best cup in town" : "Lovely and hot");

        await doSend(send, true); await pause(2600);

})();
