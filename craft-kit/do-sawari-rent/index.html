<script>
  /* Theme first, so there is no flash: ?theme=light|dark wins, then the system setting */
  (function () { var q = new URLSearchParams(location.search).get("theme"); document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; })();

<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }
  .note[hidden] { display: none; }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Sawari Rent look: asphalt, amber road paint, bold flat blocks ======================= */
  :root {
    --bg: #ebe9e3; --surface: #ffffff; --surface2: #f1efe9; --field: #fafaf7; --ink: #15171c; --mut: #676a72; --line: #dcd9d0;
    --acc: #f2a100; --acc-ink: #17130a; --asph: #1c1f25; --asph2: #2a2e36; --teal: #0d8a8c; --red: #d8432f;
    --ok: #178a52; --warn: #b26a00; --bad: #d03a26;
    --c1: #f2a100; --c2: #0d8a8c; --c3: #1c1f25; --c4: #d8432f; --c5: #7b6cd9; --c6: #9aa0aa;
    --rb: 6px; --ri: 6px; --rm: 10px; --grid: #e4e1d8;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1114; --surface: #191c21; --surface2: #23272e; --field: #14161a; --ink: #eef0f3; --mut: #9aa0aa; --line: #2c3139;
    --acc: #ffc02e; --acc-ink: #17130a; --asph: #0a0b0d; --asph2: #1d2026; --teal: #2cc3c0; --red: #ff6a52;
    --ok: #3fcf86; --warn: #ffb547; --bad: #ff6a52;
    --c1: #ffc02e; --c2: #2cc3c0; --c3: #e7e9ee; --c4: #ff6a52; --c5: #a99cff; --c6: #6b717c;
    --grid: #262a31; --toast: #23272e;
    color-scheme: dark;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  h1, h2, h3 { font-weight: 850; letter-spacing: -.02em; }
  h3 { margin: 0 0 10px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; }

  /* Top bar with tabs and the sliding amber marker */
  .bar { position: sticky; top: 0; z-index: 50; background: var(--asph); color: #f3f1ea; }
  .bar-in { display: flex; align-items: center; gap: 14px; padding: 10px 22px 0; max-width: 1440px; margin: 0 auto; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; padding-bottom: 10px; }
  .brand b { font-size: 18px; font-weight: 900; letter-spacing: -.02em; display: block; line-height: 1; }
  .brand small { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #a8a49a; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; padding-bottom: 10px; }
  .bar .ibtn { background: var(--asph2); border-color: transparent; color: #f3f1ea; }
  .srch { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; border: 0; background: var(--asph2); color: #b9b5aa; min-width: 210px; }
  .srch kbd { margin-left: auto; font: 700 10.5px/1 system-ui; padding: 3px 6px; border-radius: 4px; background: rgba(255, 255, 255, .1); }
  .tabs { position: relative; display: flex; gap: 2px; width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { position: relative; display: flex; align-items: center; gap: 7px; padding: 11px 14px 13px; color: #b9b5aa; text-decoration: none; font-weight: 750; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; transition: color .2s; }
  .tabs a:hover { color: #fff; }
  .tabs a[aria-current="page"] { color: var(--acc); }
  .tabs .marker { position: absolute; left: 0; bottom: 0; height: 4px; width: 60px; background: var(--acc); border-radius: 4px 4px 0 0; transition: transform .45s cubic-bezier(.3, 1.3, .4, 1), width .35s; opacity: 0; }
  /* The road: a dashed lane line that drives in */
  .road { height: 10px; background: linear-gradient(var(--asph2), var(--asph2)); position: relative; overflow: hidden; }

<script>
/* ======================= Shared kit (same in every Chill & Craft dashboard) ======================= */
"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */
let _seed = 1;
const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */
const PK = {
  m: ["Ahmed", "Bilal", "Usman", "Hamza", "Ali", "Imran", "Faisal", "Zubair", "Saad", "Kamran", "Asif", "Tariq", "Shahid", "Naveed", "Waqas", "Adeel", "Fahad", "Junaid", "Rizwan", "Salman", "Danish", "Arslan", "Haris", "Owais", "Shoaib", "Yasir", "Moiz", "Talha"],
  f: ["Ayesha", "Fatima", "Sana", "Hira", "Maryam", "Zainab", "Amna", "Mahnoor", "Rabia", "Iqra", "Sadia", "Noor", "Kiran", "Saba", "Anum", "Mehwish", "Hina", "Uzma", "Bushra", "Nida", "Laiba", "Areeba"],
  last: ["Khan", "Malik", "Butt", "Qureshi", "Sheikh", "Chaudhry", "Abbasi", "Siddiqui", "Mirza", "Raza", "Awan", "Javed", "Rana", "Baig", "Hashmi", "Gondal", "Shah", "Memon", "Baloch", "Niazi", "Ansari", "Jutt", "Kazmi", "Bhatti"],
  cities: ["Karachi", "Lahore", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Gujranwala", "Hyderabad", "Sukkur", "Bahawalpur", "Abbottabad"],

    chips: { label: "Status", values: ["Reserved", "On trip", "Returned", "Cancelled", "With driver", "Out of city"], test: (r, c) => (c === "With driver" ? r.driver : c === "Out of city" ? !!r.dest : r.status === c) },
    cols: [

  const from = iso(addD(b.from, shift)), to = iso(addD(b.to, shift));
  if (from < TODAY) { toast("A booking can't start in the past", { type: "bad" }); return false; }
  const c2 = clash(carId, from, to, b.id); if (c2) { toast(`${carOf(carId).model} is taken by ${c2.id} on those days`, { type: "bad" }); return false; }
  if (carOf(carId).workshop && from <= iso(addD(today(), 2))) { toast(`${carOf(carId).model} is in the workshop`, { type: "bad" }); return false; }
  const prev = { car: b.car, from: b.from, to: b.to, rate: b.rate, total: b.total };
  Object.assign(b, { car: carId, from, to, rate: carOf(carId).rate }); b.total = quote(b).total;
  afterChange(`${b.id} moved: ${carOf(carId).model}, ${fd(from)} to ${fd(to)}`, { undo: () => { Object.assign(b, prev); afterChange(`${b.id} moved back`); } });
  return true;
}

    body.innerHTML = `<div class="cd-top">${av(r.name)}<div><b>${esc(r.name)}</b><div class="mut sm">${esc(r.phone)} · CNIC ${maskCnic(r.cnic)}</div></div>${stPill(b.status)}</div>
    <div class="car-art" style="margin-bottom:10px">${CAR_SVG(CAR_COL[c.color])}</div>
    <dl class="facts"><dt>Car</dt><dd>${esc(c.model)} <span class="plate">${esc(c.plate)}</span></dd><dt>Dates</dt><dd>${fdy(b.from)} ${esc(b.time)} → ${fdy(b.to)} (${q.days} days)</dd><dt>Trip</dt><dd>${b.dest ? "Out of city: " + esc(b.dest) : "Inside the city"} · ${b.driver ? "with driver" : "self-drive"}</dd>${b.out ? `<dt>Out</dt><dd>${num(b.out.odo)} km · fuel ${FUEL_LBL[b.out.fuel]}</dd>` : ""}${b.in ? `<dt>Back</dt><dd>${num(b.in.odo)} km · fuel ${FUEL_LBL[b.in.fuel]} · ${num(ex.km)} km driven</dd>` : ""}<dt>Deposit</dt><dd>${rs(b.deposit)}</dd></dl>
    <div class="quote"><div><span>Booking</span><b>${rs(q.total)}</b></div>${ex ? `<div><span>Return charges</span><b>${rs(ex.total)}</b></div>` : ""}<div><span>Paid</span><b>${rs(b.paid)}</b></div><div class="tot"><span>Balance</span><b>${rs(Math.max(0, (b.total || q.total) - b.paid))}</b></div></div>
    ${b.status === "Reserved" ? `<div class="row wrap" style="margin-top:12px"><span class="mut sm">Shift dates:</span><button type="button" class="btn ghost sm" data-b="-1">− 1 day</button><button type="button" class="btn ghost sm" data-b="1">+ 1 day</button><button type="button" class="btn ghost sm" data-b="car">Move to another car…</button></div>` : ""}
    <div class="m-f">${b.status === "Reserved" ? `<button type="button" class="btn ghost danger-t" data-b="cancel">${ico("x")} Cancel booking</button><button type="button" class="btn ghost" data-b="edit">${ico("edit")} Edit</button>` : ""}${live(b) ? `<button type="button" class="btn pri" data-b="ho">${ico("arrow")} ${b.status === "On trip" ? "Check in" : "Check out"}</button>` : ""}${b.status === "Returned" || b.status === "Cancelled" ? `<button type="button" class="btn ghost danger-t" data-b="del">${ico("trash")} Delete record</button>` : ""}</div>`;
  };
  m.refresh = paint; paint();
  body.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-b]"), b = bkOf(id); if (!t || !b) return;
    const a = t.dataset.b;
    if (a === "-1" || a === "1") moveBooking(b, b.car, +a);
    else if (a === "car") menu(t, S.cars.filter((c) => c.id !== b.car).map((c) => ({ label: `${c.model} · ${c.plate}${clash(c.id, b.from, b.to, b.id) ? " (busy)" : ""}`, run: () => moveBooking(b, c.id, 0) })));
    else if (a === "edit") bookingForm(b);
    else if (a === "ho") { m.close(); location.hash = "#/handover/" + b.id; }
    else if (a === "cancel") { if (!(await ask(`Cancel ${b.id} for ${custOf(b.cust).name}?`, { ok: "Cancel booking" }))) return; const prev = b.status; b.status = "Cancelled"; afterChange(`${b.id} cancelled`, { undo: () => { b.status = prev; afterChange(`${b.id} restored`); } }); }
    else if (a === "del") { if (!(await ask(`Delete the record of ${b.id}?`))) return; const i = S.bk.indexOf(b); S.bk.splice(i, 1); m.close(); afterChange(`${b.id} deleted`, { undo: () => { S.bk.splice(i, 0, b); afterChange("Record restored"); } }); }
  });
}
function openCar(id) {
  const c0 = S.cars.find((c) => c.id === id); if (!c0) return;
  const m = modal({ drawer: true, title: c0.model, body: "" }), body = $(".m-b", m.el);
  const paint = () => {
    const c = S.cars.find((x) => x.id === id); if (!c) { body.innerHTML = '<div class="empty-st">This car was removed.</div>'; return; }
    const L = S.bk.filter((b) => b.car === c.id).sort((a, b) => (a.from < b.from ? 1 : -1)), M = MODELS[c.model];
    body.innerHTML = `<div class="car-art" style="height:90px;margin-bottom:12px">${CAR_SVG(CAR_COL[c.color]).replace("<svg", '<svg style="width:170px;height:74px"')}</div><div class="row sp"><span class="plate">${esc(c.plate)}</span>${stPill(carStatus(c))}</div>
    <dl class="facts"><dt>Type</dt><dd>${M.kind} · ${M.seats} seats · ${M.fuel} · ${M.tank} L tank</dd><dt>Year, colour</dt><dd>${c.year} · ${esc(c.color)}</dd><dt>Odometer</dt><dd>${num(c.odo)} km · fuel ${FUEL_LBL[c.fuel]}</dd><dt>Next service</dt><dd>${num(c.nextKm)} km (${svcLeft(c) < 0 ? "overdue" : num(svcLeft(c)) + " km left"})</dd><dt>Token tax</dt><dd>${fdy(c.token)}</dd><dt>Insurance</dt><dd>${fdy(c.ins)}</dd><dt>Rate</dt><dd>${rs(c.rate)} a day</dd></dl>
    <h3>Recent bookings</h3>${L.slice(0, 6).map((b) => `<button type="button" class="due-row lnk" style="width:100%;color:inherit;font-weight:500;text-align:left" data-open-bk="${b.id}"><span class="tag${b.status === "On trip" ? " back" : ""}">${b.status === "Returned" ? "Done" : b.status === "Cancelled" ? "Off" : b.status === "On trip" ? "Out" : "Soon"}</span><span><b>${esc(custOf(b.cust).name)}</b><small>${fd(b.from)} → ${fd(b.to)} · ${rs(b.total || quote(b).total)}</small></span></button>`).join("") || '<div class="empty-st">No bookings yet.</div>'}
    <div class="m-f"><button type="button" class="btn ghost danger-t" data-c="del">${ico("trash")} Remove</button><button type="button" class="btn ghost" data-c="ws">${c.workshop ? "Back from workshop" : "Send to workshop"}</button><button type="button" class="btn ghost" data-c="edit">${ico("edit")} Edit</button><button type="button" class="btn pri" data-c="book">${ico("plus")} Book this car</button></div>`;
  };
  m.refresh = paint; paint();
  body.addEventListener("click", async (e) => {
    const ob = e.target.closest("[data-open-bk]"); if (ob) return openBooking(ob.dataset.openBk);
    const t = e.target.closest("[data-c]"), c = S.cars.find((x) => x.id === id); if (!t || !c) return;
    if (t.dataset.c === "edit") carForm(c);
    else if (t.dataset.c === "book") bookingForm(null, c.id);
    else if (t.dataset.c === "ws") { if (c.workshop) serviced(c.id); else { c.workshop = "General check"; afterChange(`${c.model} sent to the workshop`, { undo: () => { c.workshop = ""; afterChange("Undone"); } }); } }
    else if (t.dataset.c === "del") {
      if (S.bk.some((b) => b.car === c.id && live(b))) return toast("This car has live bookings. Cancel or finish them first.", { type: "bad" });
      if (!(await ask(`Remove ${c.model} ${c.plate} from the fleet?`, { ok: "Remove" }))) return;
      const i = S.cars.indexOf(c); S.cars.splice(i, 1); m.close(); afterChange(`${c.model} removed`, { undo: () => { S.cars.splice(i, 0, c); afterChange("Car restored"); } });
    }
  });
}
function carForm(c) {
  const isNew = !c;
  modal({
    title: isNew ? "Add a car" : "Edit " + c.model, submit: isNew ? "Add car" : "Save",
    body: `<div class="fgrid">${fld("Model", "model", { opts: Object.keys(MODELS), value: c ? c.model : "Kestrel 1.3" })}${fld("Number plate", "plate", { value: c ? c.plate : "", ph: "LEB-24-1234" })}${fld("Colour", "color", { opts: COLORS, value: c ? c.color : "White" })}${fld("Year", "year", { type: "number", value: c ? c.year : 2024, min: 2000, max: 2027 })}${fld("Daily rate (Rs)", "rate", { type: "number", value: c ? c.rate : MODELS["Kestrel 1.3"].rate, min: 1 })}${fld("Odometer (km)", "odo", { type: "number", value: c ? c.odo : 0, min: 0 })}${fld("Token tax valid till", "token", { type: "date", value: c ? c.token : iso(addD(today(), 365)) })}${fld("Insurance valid till", "ins", { type: "date", value: c ? c.ins : iso(addD(today(), 365)) })}</div>`,
    onOpen: (box) => { if (!isNew) return; const E = $("form", box).elements; E.model.addEventListener("change", () => (E.rate.value = MODELS[E.model.value].rate)); },
    onSubmit: (d) => {
      const er = check(d, { plate: [REQ("Enter the plate"), [(x) => /^[A-Za-z]{2,4}-?[A-Za-z0-9]{1,3}-?\d{1,4}$/.test(x), "Use a plate like LEB-24-1234"]], year: [[(x) => +x >= 2000 && +x <= 2027, "Use a year from 2000"]], rate: [POS("Enter the daily rate")], odo: [[(x) => x !== "" && +x >= 0, "Enter the odometer"]], token: [REQ("Pick a date")], ins: [REQ("Pick a date")] });
      if (S.cars.some((x) => x !== c && x.plate.toUpperCase() === d.plate.trim().toUpperCase())) er.plate = "This plate is already in the fleet";
      if (Object.keys(er).length) return er;
      const f = { model: d.model, plate: d.plate.trim().toUpperCase(), color: d.color, year: +d.year, rate: Math.round(+d.rate), odo: Math.round(+d.odo), token: d.token, ins: d.ins };
      if (isNew) S.cars.push({ id: "CR" + (Math.max(10, ...S.cars.map((x) => +x.id.slice(2))) + 1), ...f, fuel: 8, nextKm: f.odo + 5000, workshop: "" }); else Object.assign(c, f);
      afterChange(isNew ? `${f.model} ${f.plate} added to the fleet` : "Car saved");
    },
  });
}
function custForm(c) {
  const isNew = !c;
  modal({
    title: isNew ? "Add a renter" : "Edit " + c.name, submit: isNew ? "Add renter" : "Save",
    body: `<div class="fgrid">${fld("Full name", "name", { value: c ? c.name : "" })}${fld("Mobile", "phone", { type: "tel", value: c ? c.phone : "", ph: "0300-1234567" })}${fld("CNIC", "cnic", { value: c ? c.cnic : "", ph: "35202-1234567-1" })}${fld("City", "city", { value: c ? c.city : "Islamabad" })}${fld("Note for the desk", "flag", { span: true, value: c ? c.flag : "", ph: "Optional, for example: ask for a higher deposit" })}</div>`,
    onSubmit: (d) => {
      const er = check(d, { name: [REQ("Enter the name"), [(x) => x.length >= 3, "Use at least 3 letters"]], phone: [PHONE], cnic: [[(x) => /^\d{5}-\d{7}-\d$/.test(x), "Use the format 35202-1234567-1"]], city: [REQ("Enter the city")] });
      if (Object.keys(er).length) return er;
      const f = { name: d.name.trim(), phone: d.phone.trim(), cnic: d.cnic.trim(), city: d.city.trim(), flag: d.flag.trim() };
      if (isNew) S.cust.unshift({ id: "R" + (Math.max(200, ...S.cust.map((x) => +x.id.slice(1))) + 1), since: TODAY, ...f }); else Object.assign(c, f);
      afterChange(isNew ? `${f.name} added` : "Renter saved");
    },
  });
}
function openCust(id) {
  const c = S.cust.find((x) => x.id === id); if (!c) return;
  const m = modal({ drawer: true, title: c.name, body: "" }), body = $(".m-b", m.el);
  const paint = () => {
    if (!S.cust.includes(c)) { body.innerHTML = '<div class="empty-st">This renter was removed.</div>'; return; }
    const L = S.bk.filter((b) => b.cust === c.id).sort((a, b) => (a.from < b.from ? 1 : -1));
    body.innerHTML = `<div class="cd-top">${av(c.name, "lg")}<div><b>${esc(c.name)}</b><div class="mut sm">${esc(c.phone)} · ${esc(c.city)}</div><small class="mut">CNIC ${maskCnic(c.cnic)} · since ${fdy(c.since)}</small></div></div>${c.flag ? `<p class="note bad">${esc(c.flag)}</p>` : ""}<div class="quote"><div><span>Trips</span><b>${L.length}</b></div><div><span>Total spent</span><b>${rs(sum(L.filter((b) => b.status !== "Cancelled").map((b) => b.total || quote(b).total)))}</b></div></div><h3 style="margin-top:14px">Bookings</h3>${L.map((b) => `<button type="button" class="due-row lnk" style="width:100%;color:inherit;font-weight:500;text-align:left" data-open-bk="${b.id}"><span>${stPill(b.status)}</span><span><b>${b.id} · ${esc(carOf(b.car).model)}</b><small>${fd(b.from)} → ${fd(b.to)}${b.dest ? " · " + esc(b.dest) : ""}</small></span></button>`).join("") || '<div class="empty-st">No bookings yet.</div>'}<div class="m-f"><button type="button" class="btn ghost" data-u="edit">${ico("edit")} Edit</button><button type="button" class="btn pri" data-u="book">${ico("plus")} New booking</button></div>`;
  };
  m.refresh = paint; paint();
  body.addEventListener("click", (e) => { const ob = e.target.closest("[data-open-bk]"); if (ob) return openBooking(ob.dataset.openBk); const t = e.target.closest("[data-u]"); if (!t) return; if (t.dataset.u === "edit") custForm(c); else bookingForm(null, "", c.id); });
}
function logForm() {
  modal({
    title: "Log a service", submit: "Save entry",
    body: `<div class="fgrid">${fld("Car", "car", { opts: S.cars.map((c) => [c.id, c.model + " · " + c.plate]) })}${fld("Work done", "type", { opts: SERVICE_TYPES })}${fld("Date", "date", { type: "date", value: TODAY, max: TODAY })}${fld("Cost (Rs)", "cost", { type: "number", min: 0 })}${fld("Note", "note", { span: true, ph: "Workshop, parts…" })}</div>`,
    onSubmit: (d) => {
      const er = check(d, { cost: [POS("Enter the cost")], date: [REQ("Pick a date"), [(x) => x <= TODAY, "The date can't be in the future"]] }); if (Object.keys(er).length) return er;
      const c = carOf(d.car); S.mlog.push({ id: uid("M"), car: c.id, date: d.date, type: d.type, cost: Math.round(+d.cost), odo: c.odo, note: d.note.trim() });
      if (d.type === "Oil and filter") c.nextKm = c.odo + 5000;
      afterChange(`${d.type} logged for ${c.model}`);
    },
  });
}

/* ======================= Global wiring ======================= */
const DO = {
  new: () => bookingForm(), "add-car": () => carForm(), "add-cust": () => custForm(), log: () => logForm(), theme: () => Theme.toggle(),
  csv: () => {
    if (!window.Blob || !URL.createObjectURL) return toast("Downloads are not available here", { type: "warn" });
    const rows = [["Booking", "Renter", "Car", "Plate", "From", "To", "Driver", "Destination", "Status", "Total", "Paid"], ...S.bk.map((b) => [b.id, custOf(b.cust).name, carOf(b.car).model, carOf(b.car).plate, b.from, b.to, b.driver ? "Yes" : "No", b.dest, b.status, b.total || quote(b).total, b.paid])];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" })); a.download = "sawari-bookings.csv"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); toast("Bookings CSV downloaded");
  },
  reset: async () => { if (!(await ask("Reset cars, bookings and renters to the sample fleet?", { title: "Reset demo data", ok: "Reset" }))) return; S = Store.reset(); Bell.read.clear(); Object.assign(TL, { off: -2 }); HO.sel = ""; afterChange("Demo data reset"); },
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (d && DO[d.dataset.do]) return DO[d.dataset.do](d);
  const bk = e.target.closest(".bk[data-bk], .trip[data-bk]"); if (bk && !bk.dataset.justDragged) return openBooking(bk.dataset.bk);
  const ho = e.target.closest("[data-ho]"); if (ho) { location.hash = "#/handover/" + ho.dataset.ho; return; }
  const car = e.target.closest("[data-car]"); if (car) openCar(car.dataset.car);
});
APP.notes = () => {
  const L = [];
  S.bk.filter((b) => b.status === "On trip" && b.to < TODAY).forEach((b) => L.push({ id: "late" + b.id + b.to, t: `${carOf(b.car).model} is overdue`, d: `${custOf(b.cust).name} was due back ${fd(b.to)}`, go: "#/handover/" + b.id }));
  S.bk.filter((b) => b.status === "Reserved" && b.from <= TODAY).forEach((b) => L.push({ id: "out" + b.id, t: `Pickup today: ${carOf(b.car).model}`, d: `${custOf(b.cust).name} at ${b.time}`, go: "#/handover/" + b.id }));
  S.cars.forEach((c) => carDue(c).forEach((t, i) => L.push({ id: "svc" + c.id + i + t, t: `${c.model} ${c.plate}`, d: t, go: "#/maintenance" })));
  return L.slice(0, 10);
};
APP.cmds = () => [{ label: "New booking", run: DO.new }, { label: "Add a car", run: DO["add-car"] }, { label: "Add a renter", run: DO["add-cust"] }, { label: "Log a service", run: DO.log }, { label: "Switch light or dark theme", run: DO.theme }, ...S.cars.map((c) => ({ label: `${c.model} · ${c.plate}`, hint: "Car", run: () => openCar(c.id) })), ...S.bk.filter(live).map((b) => ({ label: `${b.id} · ${custOf(b.cust).name} · ${carOf(b.car).model}`, hint: "Booking", run: () => openBooking(b.id) })), ...S.cust.map((c) => ({ label: `${c.name} · ${c.phone}`, hint: "Renter", run: () => openCust(c.id) }))];
boot();
</script>
</body>
