<!doctype html>
<!-- Chill & Craft · Star Mint · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Mint · Favourite button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f3efe2;
    --stripe: rgba(15, 92, 74, 0.05);
    --card: #ffffff;
    --ink: #13312a;
    --muted: #64786f;
    --pill: #0f5c4a;
    --pill-ink: #f8f3df;
    --gold: #f5b81c;
    --gold-deep: #c98a00;
    --ring: rgba(245, 184, 28, 0.55);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #081a16;
    --stripe: rgba(245, 184, 28, 0.04);
    --card: #11302a;
    --ink: #eef6ef;
    --muted: #93ada3;
    --pill: #f2e7c4;
    --pill-ink: #0d2d26;
    --gold: #ffc93a;
    --gold-deep: #d79800;
    --ring: rgba(255, 201, 58, 0.5);
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; background: repeating-linear-gradient(135deg, var(--stripe) 0 14px, transparent 14px 28px), var(--bg); }

  /* ---------- Card ---------- */
  .card { width: min(340px, 100%); border-radius: 24px; background: var(--card); box-shadow: 0 30px 60px -34px rgba(8, 40, 32, 0.55); overflow: hidden; }
  .art { display: block; width: 100%; height: auto; }
  .art .sun { transform-box: fill-box; transform-origin: center; transition: transform 0.8s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .card.saved .art .sun { transform: translateY(-6px) scale(1.08); }
  .body { padding: 16px 18px 18px; }
  .body h1 { margin: 0; font-size: 1.08rem; }
  .body p { margin: 4px 0 14px; color: var(--muted); font-size: 0.86rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row small { color: var(--muted); font-size: 0.8rem; }

  /* ---------- Favourite button ---------- */
  .fav {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 16px 8px 8px;
    border: 0;
    border-radius: 999px;
    background: var(--pill);
    color: var(--pill-ink);
    font: inherit;
    font-weight: 650;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.3, 1.7, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .fav:hover { transform: translateY(-2px); }
  .fav:active { transform: scale(0.93); transition-duration: 0.1s; }
  .fav:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

  /* Rolling words and numbers */
  .roller { position: relative; display: inline-block; height: 1.2em; overflow: hidden; vertical-align: middle; }
  .roller span { display: block; line-height: 1.2em; white-space: nowrap; }
  .word { min-width: 3.3em; }
  .num { min-width: 2.6em; opacity: 0.8; font-variant-numeric: tabular-nums; font-weight: 600; }

  .slot { position: relative; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--pill-ink) 14%, transparent); perspective: 120px; }
  .star { position: absolute; width: 20px; height: 20px; overflow: visible; }
  .old { color: var(--pill-ink); transition: transform 0.5s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .fav:hover .old { transform: rotate(-18deg) scale(1.12); }
  .fav:hover .twinkle { animation: twinkle 1s ease-in-out infinite; }
  .new { opacity: 0; }
  .fav[aria-pressed="true"] .old { opacity: 0; }
  .fav[aria-pressed="true"] .new { opacity: 1; }
  .fav[aria-pressed="true"]:hover .new { animation: glint 1.2s ease-in-out infinite; }
  @keyframes glint { 50% { transform: rotate(12deg) scale(1.1); } }
  .shine { transform: translateX(-30px) skewX(-20deg); }

  /* Gold progress ring used while minting */
  .mint-ring { position: absolute; inset: -3px; width: 38px; height: 38px; transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  .mint-ring circle { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 113.1; stroke-dashoffset: 113.1; }

  /* Hover twinkle */
  .twinkle { position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; background: var(--gold); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; pointer-events: none; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }

  /* Particles */
  .bit { position: absolute; left: 0; top: 0; width: 6px; height: 6px; pointer-events: none; z-index: 3; }
  .bit.diamond { transform: rotate(45deg); }
  .bit.mini { width: 9px; height: 9px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .bit.shard { width: 7px; height: 8px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .fav, .old, .art .sun { transition: none; }
    .fav:hover .twinkle, .fav[aria-pressed="true"]:hover .new { animation: none; }
    .bit { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <article class="card" id="card">
      <!-- Drawn scene: hills at sunset -->
      <svg class="art" viewBox="0 0 340 170" role="img" aria-label="Drawing of green hills under a setting sun">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb36b" />
            <stop offset="1" stop-color="#ffe2b0" />
          </linearGradient>
        </defs>
        <rect width="340" height="170" fill="url(#sky)" />
        <circle class="sun" cx="236" cy="92" r="34" fill="#fff2cf" />
        <path d="M0 112 Q60 70 120 104 T240 96 T340 88 V170 H0 Z" fill="#2f8a6a" />
        <path d="M0 132 Q80 104 160 128 T340 118 V170 H0 Z" fill="#1d6a52" />
        <path d="M0 152 Q90 136 180 150 T340 146 V170 H0 Z" fill="#0f4d3c" />
        <g fill="#0f4d3c"><path d="M58 128 l8 -22 8 22 z" /><path d="M72 130 l6 -16 6 16 z" /><path d="M270 120 l7 -20 7 20 z" /></g>
      </svg>
      <div class="body">
        <h1>Sunset trail, Margalla Hills</h1>
        <p>Easy 5 km walk · best after 4 PM</p>
        <div class="row">
          <small id="hint">Keep it for later</small>
          <button class="fav" id="fav" type="button" aria-pressed="false" aria-describedby="count-label">
            <span class="slot" id="slot" aria-hidden="true">
              <svg class="mint-ring" viewBox="0 0 38 38"><circle id="mint" cx="19" cy="19" r="18" /></svg>
              <svg class="star old" id="old" viewBox="0 0 24 24"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.87l-5.5 2.88 1.05-6.12L3.1 9.3l6.15-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
              <svg class="star new" id="new" viewBox="0 0 24 24">
                <defs>
                  <clipPath id="star-clip"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.87l-5.5 2.88 1.05-6.12L3.1 9.3l6.15-.9z" /></clipPath>
                </defs>
                <g clip-path="url(#star-clip)">
                  <rect width="24" height="24" style="fill: var(--gold)" />
                  <path d="M12 2.8 L12 16.87 L3.1 9.3 L9.25 8.4 Z" fill="#fff" opacity="0.28" />
                  <path d="M12 16.87 L18.55 13.63 L20.9 9.3 Z" style="fill: var(--gold-deep)" opacity="0.45" />
                  <rect class="shine" id="shine" x="6" y="-4" width="5" height="32" fill="#fff" opacity="0.8" />
                </g>
              </svg>
              <i class="twinkle"></i>
            </span>
            <span class="roller word" id="word"><span>Save</span></span>
            <span class="roller num" id="num" aria-hidden="true"><span>1,284</span></span>
          </button>
          <span class="sr" id="count-label">1,284 people saved this</span>
        </div>
      </div>
    </article>
    <p class="sr" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // Star Mint: a favourite toggle.
  // Save = shrink (anticipation) → old star shatters → gold ring mints a new star → coin-flip drop → sparkle finish.
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var fav = $("fav"), slot = $("slot"), oldStar = $("old"), newStar = $("new"), mint = $("mint"), shine = $("shine");
    var word = $("word"), num = $("num"), countLabel = $("count-label"), hint = $("hint"), status = $("status"), card = $("card");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var count = 1284;
    var run = 0; // bumps on every press so an older sequence stops early

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 240; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }

    // Particles from the slot centre: kind = diamond | mini | shard
    function burst(kind, colors, n, power, gravity) {
      for (var i = 0; i < n; i++) {
        var p = document.createElement("i");
        p.className = "bit " + kind;
        p.style.background = colors[i % colors.length];
        slot.appendChild(p);
        var a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
        var s = power * (0.6 + Math.random() * 0.6);
        var vx = Math.cos(a) * s, vy = Math.sin(a) * s, spin = (Math.random() - 0.5) * 540, frames = [];
        for (var k = 0; k <= 10; k++) {
          var t = k / 10, e = 1 - Math.pow(1 - t, 2.5);
          frames.push({ transform: "translate(" + (13 + vx * e).toFixed(1) + "px," + (13 + vy * e + gravity * t * t).toFixed(1) + "px) rotate(" + (45 + spin * t).toFixed(0) + "deg) scale(" + (1 - t * 0.7).toFixed(2) + ")", opacity: t > 0.6 ? (1 - t) / 0.4 : 1 });
        }
        p.animate(frames, { duration: 600 + Math.random() * 350, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
      }
    }

    // Rolls a word or number: old slides out, new springs in (up when going up, down when going down)
    function roll(box, text, up) {
      // a quick second press: drop any half-finished roll first
      while (box.children.length > 1) box.removeChild(box.firstElementChild);
      var old = box.firstElementChild;
      old.getAnimations().forEach(function (a) { a.cancel(); });
      old.style.position = "";
      var next = document.createElement("span");
      next.textContent = text;
      if (calm.matches) { box.replaceChild(next, old); return; }
      next.style.position = "absolute";
      next.style.left = "0";
      next.style.top = "0";
      box.appendChild(next);
      var dir = up ? 1 : -1;
      old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(" + -100 * dir + "%)", opacity: 0 }], { duration: 200, easing: "ease-in", fill: "forwards" }).onfinish = function () {
        old.remove();
        next.style.position = "";
      };
      springTo(next, function (p) { return { transform: "translateY(" + ((1 - p) * 100 * dir).toFixed(1) + "%)" }; }, 320, 17);
    }

    function render(saved) {
      var text = count.toLocaleString("en-US");
      fav.setAttribute("aria-pressed", String(saved));
      roll(word, saved ? "Saved" : "Save", saved);
      roll(num, text, saved);
      countLabel.textContent = text + " people saved this";
      hint.textContent = saved ? "In your wishlist" : "Keep it for later";
      card.classList.toggle("saved", saved);
    }

    async function save(id) {
      newStar.style.opacity = "0"; // stays hidden until the drop starts
      // 1. Anticipation: pill squashes, outline star shrinks and twists
      fav.animate([{ transform: "scale(1)" }, { transform: "scale(0.9, 0.86)" }], { duration: 150, easing: "ease-in", fill: "forwards" });
      await oldStar.animate([{ transform: "none" }, { transform: "scale(0.7) rotate(-25deg)" }], { duration: 160, easing: "ease-in", fill: "forwards" }).finished;
      if (id !== run) return;
      fav.getAnimations().forEach(function (a) { a.cancel(); });
      springTo(fav, function (p) { return { transform: "scale(" + (0.9 + 0.1 * p).toFixed(3) + "," + (0.86 + 0.14 * p).toFixed(3) + ")" }; }, 320, 10);

      // 2. The old star pops up, spins and shatters
      render(true);
      var pop = oldStar.animate([
        { transform: "scale(0.7) rotate(-25deg)", opacity: 1 },
        { transform: "translateY(-26px) rotate(160deg) scale(1.3)", opacity: 1, offset: 0.6 },
        { transform: "translateY(-30px) rotate(200deg) scale(0.2)", opacity: 0 }
      ], { duration: 360, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)", fill: "forwards" });
      setTimeout(function () { if (id === run) burst("shard", [getComputedStyle(fav).color], 7, 26, 40); }, 230);
      await pop.finished;
      if (id !== run) return;

      // 3. Minting: a gold ring draws around the slot
      await mint.animate([{ strokeDashoffset: 113.1, opacity: 1 }, { strokeDashoffset: 0, opacity: 1 }], { duration: 340, easing: "cubic-bezier(0.6, 0, 0.3, 1)", fill: "forwards" }).finished;
      if (id !== run) return;

      // 4. The new gold star drops in with a coin flip, lands with a squash
      var drop = newStar.animate([
        { transform: "translateY(-40px) rotateY(0deg) scale(0.4)", opacity: 0 },
        { transform: "translateY(-18px) rotateY(360deg) scale(0.9)", opacity: 1, offset: 0.55 },
        { transform: "translateY(0) rotateY(540deg) scale(1.25, 0.8)", opacity: 1, offset: 0.85 },
        { transform: "translateY(0) rotateY(540deg) scale(1)", opacity: 1 }
      ], { duration: 520, easing: "cubic-bezier(0.4, 0, 0.6, 1)" });
      newStar.style.opacity = "";
      await drop.finished;
      if (id !== run) return;
      springTo(newStar, function (p) { return { transform: "scale(" + (1.25 - 0.25 * p).toFixed(3) + "," + (0.8 + 0.2 * p).toFixed(3) + ")" }; }, 300, 9);

      // 5. Finish: shine, ring fades out wide, sparkles and tiny stars, card glow
      shine.animate([{ transform: "translateX(-30px) skewX(-20deg)" }, { transform: "translateX(30px) skewX(-20deg)" }], { duration: 600, delay: 120, easing: "ease-in-out" });
      mint.animate([{ strokeDashoffset: 0, opacity: 1, strokeWidth: 2.5 }, { strokeDashoffset: 0, opacity: 0, strokeWidth: 8 }], { duration: 500, easing: "ease-out", fill: "forwards" });
      burst("diamond", ["#ffc93a", "#fff1b8", "#f5b81c"], 10, 34, 10);
      burst("mini", ["#ffc93a", "#ffe08a"], 6, 46, 30);
      card.animate([{ boxShadow: "0 0 0 0 rgba(245, 184, 28, 0.7), 0 30px 60px -34px rgba(8, 40, 32, 0.55)" }, { boxShadow: "0 0 0 14px rgba(245, 184, 28, 0), 0 30px 60px -34px rgba(8, 40, 32, 0.55)" }], { duration: 800, easing: "ease-out" });
      await wait(520);
      if (id !== run) return;
      cleanup();
    }

    async function unsave(id) {
      oldStar.style.opacity = "0"; // the outline waits for the gold star to cool
      render(false);
      // The gold star cools down: dims, shrinks, and the outline springs back
      await newStar.animate([{ transform: "none", opacity: 1, filter: "saturate(1)" }, { transform: "translateY(4px) scale(0.6) rotate(30deg)", opacity: 0, filter: "saturate(0)" }], { duration: 300, easing: "ease-in", fill: "forwards" }).finished;
      if (id !== run) return;
      oldStar.style.opacity = "";
      springTo(oldStar, function (p) { return { transform: "scale(" + (0.4 + 0.6 * p).toFixed(3) + ") rotate(" + ((1 - p) * 60).toFixed(1) + "deg)", opacity: Math.min(1, p * 2) }; }, 260, 12);
      cleanup();
    }

    // Removes leftover held frames so the resting CSS takes over
    function cleanup() {
      [oldStar, newStar, mint].forEach(function (el) {
        el.getAnimations().forEach(function (a) { if (a.effect && a.effect.getTiming().fill === "forwards") a.cancel(); });
      });
    }

    fav.addEventListener("click", function () {
      var saving = fav.getAttribute("aria-pressed") !== "true";
      var id = ++run;
      count += saving ? 1 : -1;
      [fav, oldStar, newStar, mint].forEach(function (el) { el.getAnimations().forEach(function (a) { a.cancel(); }); });
      oldStar.style.opacity = "";
      newStar.style.opacity = "";
      status.textContent = saving ? "Saved to your wishlist." : "Removed from your wishlist.";
      if (calm.matches) { render(saving); return; }
      if (saving) save(id); else unsave(id);
    });
  })();
</script>
</body>
</html>
