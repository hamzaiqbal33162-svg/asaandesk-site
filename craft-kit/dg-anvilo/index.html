<!doctype html>
<!-- Chill & Craft · Anvilo · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anvilo · Factory management</title>
<style>
/* ---------- Anvilo look: concrete, charcoal and safety yellow ---------- */
:root{--font:"Segoe UI",system-ui,-apple-system,Roboto,Ubuntu,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
--bg:#e8e6df;--bg2:#f1efe9;--panel:#fbfaf6;--field:#f5f3ed;--text:#1b1c1e;--muted:#6b6a64;--line:#d6d2c7;--grid:#e6e3da;--accent:#f2b705;--accent-ink:#17181a;--focus:#1f6fe0;
--good:#16935d;--warn:#df7c00;--bad:#d23f2e;--c1:#e0a200;--c2:#2a6be0;--c3:#16935d;--c4:#d23f2e;--c5:#7a5bd0;--c6:#8a8a84;
--side:#17181a;--side-ink:#c9c7c0;--side-mute:#7c7a73;--r:6px;--rb:4px;--tip-bg:#17181a;--belt:#3a3c40;--belt2:#56595f;--hover:rgba(242,183,5,.13);--enter-anim:an-shutter}
[data-theme=dark]{--bg:#0f1012;--bg2:#16171a;--panel:#18191c;--field:#121315;--text:#ecebe6;--muted:#9a988f;--line:#2b2d31;--grid:#222428;--accent:#f5c400;--accent-ink:#141414;--focus:#5b9cff;
--good:#34c98a;--warn:#ffa630;--bad:#ff5f4f;--c1:#f5c400;--c2:#5b9cff;--c3:#34c98a;--c4:#ff6b5b;--c5:#a68bff;--c6:#8d8c86;--side:#0a0b0c;--tip-bg:#000;--belt:#2a2c30;--belt2:#3e4147;--hover:rgba(245,196,0,.1)}
/* ---------- Core UI: shared structure. Each app sets its own look with the variables above. ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:.55em .95em;border-radius:var(--rb,var(--r));font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .12s,background-color .2s,box-shadow .2s,border-color .2s,color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active,.ibtn:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.35em .7em;font-size:.78rem}
.btn .ic{width:16px;height:16px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:var(--rb,var(--r));border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s,border-color .2s,background-color .2s;position:relative;flex:none}
.ibtn:hover{border-color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:15px;height:15px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--panel)}
.badge[hidden]{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:.18em .62em;border-radius:99px;font-size:.72rem;font-weight:700;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h,200) 55% 48%);color:#fff;font-size:.7rem;font-weight:700;flex:none;letter-spacing:.02em}
/* staggered page entrance */
.enter{animation:var(--enter-anim,c-rise) .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes c-rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes c-fade{from{opacity:0}}
@keyframes c-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes c-land{0%{transform:scale(1.06)}100%{transform:none}}
.landed{animation:c-land .35s cubic-bezier(.2,.8,.2,1)}
/* tooltip */
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px;left:0;top:0}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:700}
.tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .tr i{width:8px;height:8px;border-radius:2px;background:var(--sw)}
.tip .tr span{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
/* modal, drawer, command search */
.ovl{position:fixed;inset:0;z-index:60;background:var(--scrim,rgba(8,10,16,.52));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s}
.ovl.on{opacity:1}
.modal,.drawer,.cmdk{background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal{border-radius:calc(var(--r) + 4px);width:min(540px,100%);max-height:calc(100dvh - 32px);transform:translateY(18px) scale(.97);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(780px,100%)}
.modal.small{width:min(420px,100%)}
.ovl.on .modal,.ovl.on .cmdk{transform:none}
.drawer-ovl{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;border-width:0 0 0 1px;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ovl.on .drawer{transform:none}
.l-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:1.05rem}
.l-body{padding:18px;overflow:auto;flex:1;min-height:0}
.l-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cf-msg{color:var(--muted)}
.cmdk-ovl{place-items:start center;padding-top:12vh}
.cmdk{width:min(560px,100%);border-radius:calc(var(--r) + 4px);transform:translateY(-10px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.cmdk .l-head{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.cmdk .l-body{padding:0}
.ck-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1rem;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:calc(var(--r) - 2px);text-align:left}
.cmdk li small{color:var(--muted)}
.cmdk li[aria-selected=true] button{background:var(--hover,color-mix(in srgb,var(--accent) 14%,transparent))}
.cmdk .empty{padding:20px}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.inp,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--field,var(--bg));border-radius:var(--rb,var(--r));padding:.6em .7em;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.fld textarea{resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:c-shake .3s}
.fld .err{color:var(--bad);font-size:.74rem;font-weight:600}
.fld .err:empty{display:none}
@keyframes c-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background-color .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--accent)}
/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar-x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbar-x:empty{display:none}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:0 .65em;background:var(--field,var(--bg));flex:1 1 180px;max-width:300px;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:.55em 0;outline:none;width:100%;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.32em .8em;font-size:.78rem;font-weight:700;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip em{font-style:normal;opacity:.7;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th>button,.tbl th>.th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%}
.tbl th>.th{cursor:default}
.tbl th>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th.n>button,.tbl th.n>.th{justify-content:flex-end}
.tbl .si{width:0;height:0;border:4px solid transparent;opacity:.25;border-top-color:currentColor;margin-top:4px}
.tbl th[aria-sort=ascending] .si{border-top-color:transparent;border-bottom-color:currentColor;margin-top:-4px;opacity:1}
.tbl th[aria-sort=descending] .si{opacity:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right}
.tbl tbody tr[data-id]{cursor:pointer;transition:background-color .15s}
.tbl tbody tr[data-id]:hover{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-u{display:flex;align-items:center;gap:9px}
.cell-u small{display:block;color:var(--muted);font-size:.74rem}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pager .pg-btns{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;font-weight:600}
/* popovers: bell and menus */
.pop{position:fixed;z-index:75;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);min-width:190px;max-width:min(350px,calc(100vw - 24px));padding:6px;animation:c-pop .18s ease both}
.pop .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r) - 2px);gap:8px;align-items:center;font-size:.86rem}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 12%,transparent));outline:none}
.bell-pop{width:340px;padding:0}
.bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-l{max-height:340px;overflow:auto;padding:6px}
.bell-i{display:flex;gap:10px;padding:9px 8px;border-radius:calc(var(--r) - 2px);font-size:.84rem}
.bell-i small{display:block;color:var(--muted);font-size:.74rem}
.bell-i.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-i .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.bell-i .dot.warn{background:var(--warn)}.bell-i .dot.bad{background:var(--bad)}.bell-i .dot.ok{background:var(--good)}
/* toasts */
.toasts{position:fixed;z-index:98;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--tip-bg,#16181d);color:var(--tip-ink,#fff);padding:11px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:c-toast .38s cubic-bezier(.2,.8,.2,1) both;font-size:.86rem;transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(16px)}
.toast>i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.toast.warn>i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.toast.bad>i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.toast .btn{margin-left:auto;color:inherit;border-color:rgba(255,255,255,.3);background:transparent}
@keyframes c-toast{from{opacity:0;transform:translateY(14px) scale(.96)}}
/* segmented range switch */
.segc{display:inline-flex;position:relative;border:1px solid var(--line);border-radius:var(--rb,var(--r));padding:3px;background:var(--field,var(--bg));flex:none}
.segc button{position:relative;z-index:1;border:0;background:transparent;padding:.32em .75em;font-size:.76rem;font-weight:700;color:var(--muted);border-radius:calc(var(--rb,var(--r)) - 2px);transition:color .25s}
.segc button[aria-pressed=true]{color:var(--accent-ink,#fff)}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--rb,var(--r)) - 2px);background:var(--accent);transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--muted);font-size:10.5px;font-family:var(--font-chart,inherit)}
.ax line{stroke:var(--grid,var(--line));stroke-dasharray:2 4}
.ax .base{stroke-dasharray:none}
.ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:c-draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.fadein{animation:c-fade .9s .3s both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:c-grow .75s cubic-bezier(.2,.8,.2,1) both}
@keyframes c-grow{from{transform:scaleY(0)}}
.dim .bar{opacity:.35}.dim .bar.hl{opacity:1}
.sweep{animation:c-sweep 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes c-sweep{from{stroke-dasharray:0 9999}}
.arc{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:auto;flex:none}
.d-c{font-weight:800;fill:var(--text)}.d-l{fill:var(--muted);font-size:11px}
.dleg{display:grid;gap:7px;flex:1;min-width:150px;font-size:.82rem}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;background:var(--sw);flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dleg small{color:var(--muted);width:3.2em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sw)}
.legend i.dash{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sw) 0 4px,transparent 4px 7px)}
.hl-g{opacity:0;transition:opacity .15s;pointer-events:none}
.hl-g line{stroke:var(--muted);stroke-dasharray:3 3}
.hl-g circle{stroke:var(--panel-solid,var(--panel));stroke-width:2}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:.82rem;margin:7px 0}
.hb-t{height:9px;border-radius:9px;background:var(--track,color-mix(in srgb,var(--text) 8%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--bc,var(--accent));animation:c-w 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes c-w{from{width:0}}
.hb b{font-variant-numeric:tabular-nums}
.hm rect{transition:opacity .2s}
.hm .cell{animation:c-fade .5s both}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col-bg,color-mix(in srgb,var(--text) 4%,transparent));border-radius:var(--r);padding:10px;min-height:120px;transition:background-color .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:10px;flex-wrap:wrap}
.kcol-h i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.kcol-h small{margin-left:auto;color:var(--muted);font-weight:600}
.kc-n{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 11px;cursor:grab;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none;position:relative}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.kc-f{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.kc-f .ibtn{width:26px;height:26px}
.grip{touch-action:none;cursor:grab}
.k-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:calc(var(--r) - 2px)}
.drop-on{outline-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:85;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.32);transition:none!important;opacity:.95}
body.is-dragging{cursor:grabbing;user-select:none}
/* month calendar */
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mc-h b{min-width:9em;text-align:center}
.mc-h .mc-x{margin-left:auto;display:flex;gap:8px}
.mc-wd,.mc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc-wd span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.mc-days{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mc-d{background:var(--panel-solid,var(--panel));min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .2s;outline:2px dashed transparent;outline-offset:-3px}
.mc-d.out{background:color-mix(in srgb,var(--panel-solid,var(--panel)) 80%,var(--bg))}
.mc-d.out .mc-n{opacity:.4}
.mc-n{border:0;background:transparent;font-size:.74rem;font-weight:700;width:24px;height:24px;border-radius:50%;padding:0}
.mc-d.today .mc-n{background:var(--accent);color:var(--accent-ink,#fff)}
.mc-e{font-size:.7rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--text);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none}
.mc-more{border:0;background:transparent;font-size:.68rem;color:var(--muted);text-align:left;padding:0 4px}
@media (max-width:640px){.mc-d{min-height:64px}.mc-e{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--ec)}}
@media (max-width:540px){.form{grid-template-columns:1fr}.l-body{padding:14px}.toasts{right:12px;left:12px;bottom:12px;max-width:none}}
/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ---------- shell ---------- */
body{font-size:13.5px}
.mono,.k-v,.tbl td.n{font-family:var(--mono)}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:4px}
.skip:focus{left:8px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{font-size:1.08rem;letter-spacing:.04em;color:#fff;display:block;line-height:1.1}
.brand small{display:block;font-size:.62rem;color:var(--side-mute);letter-spacing:.16em;text-transform:uppercase}
.nav{position:relative;flex:1;overflow-y:auto;padding:6px 10px 16px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;color:var(--side-ink);text-decoration:none;font-size:.82rem;position:relative;z-index:1;transition:color .2s,background-color .2s}
.nav a .ic{width:16px;height:16px;opacity:.8}
.nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav a[aria-current=page]{color:#141414;font-weight:700;background:transparent}
.nav a[aria-current=page] .ic{opacity:1}
.nav-marker{position:absolute;left:10px;right:10px;top:0;height:30px;background:var(--accent);border-radius:4px;transition:transform .38s cubic-bezier(.2,.8,.2,1),height .38s,opacity .2s;z-index:0;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 6px 16px -6px var(--accent)}
.grp-h{all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;cursor:pointer;padding:12px 10px 5px;font-size:.62rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--side-mute)}
.grp-h:hover{color:var(--side-ink)}
.grp-h:focus-visible{outline:2px solid var(--accent)}
.grp-h .ic{margin-left:auto;width:13px;height:13px;transition:transform .25s}
.grp.closed .grp-h .ic{transform:rotate(-90deg)}
.grp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s}
.grp-b>div{overflow:hidden}
.grp.closed .grp-b{grid-template-rows:0fr}
.grp.closed .grp-b>div{visibility:hidden;transition:visibility 0s .3s}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07);font-size:.74rem}
.shiftbox{background:rgba(255,255,255,.05);border-radius:4px;padding:10px}
.shiftbox b{color:#fff;display:flex;align-items:center;gap:6px}
.shiftbox .bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:8px;overflow:hidden}
.shiftbox .bar i{display:block;height:100%;background:var(--accent);width:var(--w);transition:width 1s}
.dotl{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(52,201,138,.25);animation:an-blink 1.6s infinite}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,var(--side) 9px 18px)}
.menu-btn{display:none}
.crumb{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--text)}
.ck-btn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:4px;color:var(--muted);min-width:230px;font-size:.8rem}
.ck-btn kbd{margin-left:auto;font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.clock{font-family:var(--mono);font-size:.78rem;display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}
.me{width:34px;height:34px;border-radius:4px;background:var(--side);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.75rem;border:0}
#view{padding:22px 22px 40px;width:100%;max-width:1520px;margin:0 auto;overflow-x:clip}
.nav-scrim{display:none}
/* ---------- page blocks ---------- */
@keyframes an-shutter{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(10px)}to{opacity:1;clip-path:inset(-30px -30px -60px -30px);transform:none}}
@keyframes an-blink{50%{opacity:.35}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:1.5rem;font-weight:800;letter-spacing:-.015em}
.ph p{color:var(--muted);margin-top:3px;font-size:.84rem}
.ph-x{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.card:hover{box-shadow:0 14px 28px -18px rgba(0,0,0,.3)}
.kpi:hover,.rep:hover,.mt:hover{transform:translateY(-3px);box-shadow:0 16px 30px -16px rgba(0,0,0,.38)}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:16px;height:16px;border-left:3px solid var(--accent);border-top:3px solid var(--accent);border-top-left-radius:var(--r);pointer-events:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.lnk{font-size:.78rem;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--muted)}
.lnk:hover{color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px;cursor:default}
.kpi[data-go]{cursor:pointer}
.k-i{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:4px;display:grid;place-items:center;background:var(--bg2);color:var(--muted)}
.k-l{font-size:.68rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding-right:36px}
.k-v{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.k-d{font-size:.74rem;font-weight:700}
.k-d small{color:var(--muted);font-weight:500}
.live-k .k-v{color:var(--text)}
.live-k::after{content:"LIVE";position:absolute;right:50px;top:16px;font:800 .58rem var(--mono);letter-spacing:.12em;color:var(--good);animation:an-blink 1.6s infinite}
.g{display:grid;gap:12px;margin-bottom:12px}
.g-31{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-21{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g-13{grid-template-columns:minmax(200px,1fr) minmax(0,3fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pbar{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--grid);vertical-align:middle;overflow:hidden;margin-right:4px}
.pbar i{display:block;height:100%;width:var(--w);background:var(--accent)}
.fam{width:10px;height:10px;border-radius:2px;background:var(--jc);flex:none}
.due,.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.due li,.alerts li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:.82rem}
.due li:last-child,.alerts li:last-child{border-bottom:0}
.due li small,.alerts li small{display:block;color:var(--muted);font-size:.72rem}
.due .d-d{margin-left:auto;text-align:right;font-family:var(--mono);font-size:.76rem}
.alerts .ai{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
.alerts .btn{margin-left:auto}
.steps{list-style:none;margin:16px 0;padding:0;display:flex;gap:4px}
.steps li{flex:1;text-align:center;font-size:.66rem;font-weight:700;color:var(--muted);padding-top:10px;border-top:4px solid var(--line)}
.steps li.on{border-color:var(--accent);color:var(--text)}
.dsec{margin-top:16px}
.dsec h3{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.minilist{list-style:none;margin:0;padding:0;font-size:.82rem}
.minilist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.inline-err{color:var(--bad);font-size:.78rem;font-weight:600;margin-top:6px;min-height:1em}
/* ---------- live line (signature) ---------- */
.line-card{padding-bottom:6px}
.lsvg{width:100%;height:auto;display:block;overflow:visible}
.lsvg .floor{fill:var(--line)}.lsvg .leg{fill:var(--belt2)}.beltbg{fill:var(--belt)}.bstripe{stroke:var(--belt2);stroke-width:4}
.belt-move{animation:an-belt .5s linear infinite}
@keyframes an-belt{to{transform:translateX(16px)}}
.part{fill:#9aa0a6;stroke:rgba(0,0,0,.25);animation:an-part 12s linear infinite,an-partc 12s linear infinite}
@keyframes an-part{from{transform:translateX(0)}to{transform:translateX(810px)}}
@keyframes an-partc{0%,66%{fill:#a3a8ae}70%,100%{fill:var(--accent)}}
.house{fill:var(--bg2);stroke:var(--line);transition:stroke .2s}
.roof{fill:var(--side)}
.metal{fill:#8b9099}.metal2{fill:#5f646b}.arm{stroke:#8b9099;stroke-width:6;fill:none;stroke-linecap:round}
.st{cursor:pointer;outline:none}
.st:hover .house,.st:focus-visible .house{stroke:var(--accent);stroke-width:2.5}
.st-l{font-size:9.5px;font-weight:800;letter-spacing:.12em;fill:var(--muted)}
.st-c{font:700 14px var(--mono);fill:var(--text)}
.laser-head{animation:an-scan 2.2s ease-in-out infinite alternate}
@keyframes an-scan{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
.beam{stroke:#ff4d2e;stroke-width:2;animation:an-beam .16s steps(2) infinite}
@keyframes an-beam{50%{opacity:.2}}
.ram{animation:an-press 1.8s cubic-bezier(.6,0,.4,1) infinite}
@keyframes an-press{0%,55%,100%{transform:translateY(0)}72%{transform:translateY(18px)}}
.spark{fill:#ffcc33;animation:an-spark .5s ease-out infinite}
@keyframes an-spark{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
.mist{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:center;animation:an-mist 1.8s ease-out infinite}
@keyframes an-mist{from{opacity:.55;transform:scale(.2)}to{opacity:0;transform:scale(1.5)}}
.carton{fill:#c79a5b}.flap{stroke:#a87c40;stroke-width:3}
.boxer{transform-box:fill-box;transform-origin:50% 100%;animation:an-boxer 2.4s ease-in-out infinite}
@keyframes an-boxer{50%{transform:scaleY(.86)}}
.lamp{fill:var(--muted)}.lamp.ok{fill:var(--good);animation:an-blink 1.6s infinite}.lamp.warn{fill:var(--warn)}.lamp.bad{fill:var(--bad)}
.st.halt *{animation-play-state:paused!important}
.st.halt .lamp.bad{animation:an-blink .7s steps(2) infinite!important;animation-play-state:running!important}
.line-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);padding:4px 2px 6px}
.line-meta b{color:var(--text);font-family:var(--mono)}
/* ---------- production plan (gantt) ---------- */
.gt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg2);position:relative}
.gt{position:relative;width:calc(var(--lw) + var(--sw) * var(--slots))}
.gt-hd{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.gt-c0{flex:none;width:var(--lw);position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line);padding:8px 10px;font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:flex-end}
.gt-day{width:calc(var(--sw) * 2);flex:none;border-right:1px solid var(--line);text-align:center;padding-top:6px;font-size:.7rem}
.gt-day b{display:block;font-size:.74rem}
.gt-day.sun{color:var(--muted)}
.gt-day.today b{color:var(--c4)}
.gt-day span{display:flex;font-size:.6rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:5px}
.gt-day span i{flex:1;font-style:normal;padding:2px 0}
.gt-body{position:relative}
.gt-row{display:flex;border-bottom:1px solid var(--line)}
.gt-row:last-child{border-bottom:0}
.gt-lab{flex:none;width:var(--lw);position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.gt-lab b{font-family:var(--mono);font-size:.78rem}
.gt-lab small{color:var(--muted);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.util{height:4px;border-radius:2px;background:var(--grid);overflow:hidden;margin-top:3px}
.util i{display:block;height:100%;width:var(--w);background:var(--accent);transition:width .45s}
.gt-lane{position:relative;flex:none;width:calc(var(--sw) * var(--slots));height:56px;background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--sw) * 2 - 1px),var(--line) calc(var(--sw) * 2 - 1px) calc(var(--sw) * 2)),repeating-linear-gradient(90deg,transparent 0 calc(var(--sw) - 1px),var(--grid) calc(var(--sw) - 1px) var(--sw))}
.gt-off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--text) 6%,transparent) 6px 12px);pointer-events:none;z-index:0}
.gt-now{position:absolute;top:0;bottom:0;width:2px;background:var(--c4);z-index:2;pointer-events:none}
.gt-now::before{content:"NOW";position:absolute;top:-1px;left:3px;font:800 .55rem var(--mono);color:#fff;background:var(--c4);padding:1px 4px;border-radius:2px;letter-spacing:.08em}
.job{position:absolute;top:7px;height:42px;z-index:1;border:0;border-radius:4px;padding:4px 14px 4px 8px;text-align:left;background-color:var(--jc);color:#fff;font-size:.72rem;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;transition:left .32s cubic-bezier(.2,.8,.2,1),width .32s,box-shadow .2s,transform .15s;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.job b{font-family:var(--mono);font-size:.7rem;white-space:nowrap}
.job span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.job:hover{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 6px 14px -6px rgba(0,0,0,.5)}
.job.run{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.16) 0 8px,transparent 8px 16px);background-size:22.63px 22.63px;animation:an-stripes 1s linear infinite}
@keyframes an-stripes{to{background-position:22.63px 0}}
.job.drag{transition:none;z-index:6;box-shadow:0 16px 34px rgba(0,0,0,.4);transform:scale(1.04);cursor:grabbing}
.job.clash{outline:3px solid var(--bad);outline-offset:1px}
.job.late::after{content:"LATE";position:absolute;right:14px;top:4px;font:800 .5rem var(--mono);background:#fff;color:var(--bad);padding:0 3px;border-radius:2px}
.job .pr{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.9);width:var(--p)}
.rz{position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.rz::after{content:"";position:absolute;right:4px;top:30%;bottom:30%;width:2px;border-radius:1px;background:rgba(255,255,255,.75)}
.gt-prev{position:absolute;top:7px;height:42px;border:2px dashed var(--accent);border-radius:4px;background:color-mix(in srgb,var(--accent) 18%,transparent);z-index:2;pointer-events:none}
.gt-prev.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.g-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:10px}
.g-leg span{display:flex;align-items:center;gap:6px}
.bl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bl{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-left:4px solid var(--jc);border-radius:4px;padding:9px 10px;background:var(--bg2);cursor:grab;touch-action:none;transition:transform .15s,opacity .2s}
.bl:hover{transform:translateY(-2px);border-style:solid}
.bl div{flex:1;min-width:0;font-size:.78rem}
.bl b{font-family:var(--mono);font-size:.76rem;display:block}
.bl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl small{color:var(--muted);font-size:.7rem}
/* ---------- shop floor ---------- */
.andon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,2fr);gap:12px;margin-bottom:12px}
.an{border-radius:var(--r);padding:12px 14px;color:#fff;background:var(--ac);position:relative;overflow:hidden}
.an b{font:700 1.8rem var(--mono);display:block;line-height:1.1}
.an span{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.an.dark{background:var(--side);color:#fff}
.an .bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;margin-top:10px;overflow:hidden}
.an .bar i{display:block;height:100%;background:var(--accent);width:var(--w);transition:width 1s}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mt header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mt header span{color:var(--muted);font-size:.78rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-big b{font:700 2rem var(--mono);letter-spacing:-.03em}
.mt-big small{color:var(--muted);margin-left:6px}
.mt-meta{font-size:.74rem;color:var(--muted);margin:6px 0 10px}
.mt-meta b{color:var(--text)}
.mt footer{display:flex;gap:6px;flex-wrap:wrap}
.mt.down{border-color:var(--bad);background:linear-gradient(var(--panel),var(--panel)) padding-box,repeating-linear-gradient(-45deg,var(--bad) 0 8px,transparent 8px 16px) border-box;border:2px solid transparent}
.bump{animation:an-bump .5s}
@keyframes an-bump{30%{color:var(--accent);transform:translateY(-2px)}}
.mt-big b{display:inline-block}
/* ---------- misc pages ---------- */
.plist{display:flex;flex-direction:column;gap:4px;padding:8px}
.plist button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:4px;font-size:.84rem;transition:background-color .2s}
.plist button:hover{background:var(--hover)}
.plist button[aria-pressed=true]{background:var(--side);color:#fff}
.plist button:focus-visible{outline:2px solid var(--accent)}
.plist small{margin-left:auto;font-family:var(--mono);font-size:.72rem;opacity:.7}
.qty-in{width:80px;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--field);font-family:var(--mono);text-align:right}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.addrow .fld{min-width:140px;flex:1}
.costgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.costgrid div{background:var(--bg2);border-radius:4px;padding:10px}
.costgrid small{display:block;font-size:.66rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.costgrid b{font:700 1.05rem var(--mono)}
.route{list-style:none;margin:0;padding:6px 2px 12px;display:flex;gap:26px;overflow-x:auto;min-height:120px;align-items:stretch}
.rstep{flex:none;width:150px;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:4px;background:var(--bg2);padding:10px;position:relative;cursor:grab;user-select:none}
.rstep:not(:last-child)::after{content:"";position:absolute;right:-22px;top:50%;width:16px;height:2px;background:var(--muted)}
.rstep:not(:last-child)::before{content:"";position:absolute;right:-23px;top:calc(50% - 4px);border:5px solid transparent;border-left-color:var(--muted)}
.rstep .no{font:800 .66rem var(--mono);color:var(--muted)}
.rstep b{display:block;margin:2px 0 6px}
.rstep .rs-x{display:flex;gap:4px;margin-top:8px}
.route.drop-on{outline:2px dashed var(--accent)}
.roster td,.roster th{text-align:center}
.roster td:first-child,.roster th:first-child{text-align:left}
.rs{width:38px;height:30px;border-radius:4px;border:1px solid var(--line);font:700 .78rem var(--mono);background:var(--bg2);transition:transform .12s,background-color .2s}
.rs-A{background:color-mix(in srgb,var(--c1) 30%,var(--panel));border-color:var(--c1)}
.rs-B{background:color-mix(in srgb,var(--c2) 26%,var(--panel));border-color:var(--c2)}
.rs-C{background:color-mix(in srgb,var(--c5) 30%,var(--panel));border-color:var(--c5)}
.rs-Off{color:var(--muted)}
.gap{color:var(--bad)!important;font-weight:800}
.bins{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:6px;align-items:center}
.bins .rk{font:800 .78rem var(--mono);color:var(--muted);text-align:center;padding-right:4px}
.bin{position:relative;height:62px;border:1px solid var(--line);border-radius:4px;background:var(--bg2);overflow:hidden;font:700 .7rem var(--mono);display:flex;align-items:flex-start;justify-content:space-between;padding:5px 6px;transition:transform .15s,border-color .2s}
.bin:hover{transform:translateY(-2px);border-color:var(--accent)}
.bin i{position:absolute;left:0;right:0;bottom:0;height:var(--f);background:var(--fc);opacity:.85;animation:an-fill .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes an-fill{from{height:0}}
.bin span{position:relative;z-index:1}
.bin em{position:relative;z-index:1;font-style:normal;opacity:.8}
.slider{display:grid;gap:4px;margin-bottom:12px}
.slider label{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700}
.slider output{font-family:var(--mono)}
.rep{display:flex;flex-direction:column;gap:10px}
.rep p{color:var(--muted);font-size:.8rem}
.rep .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.set-sec{display:grid;gap:12px}
body.compact .tbl td{padding:6px 10px}
body.compact .card{padding:10px 12px}
/* ---------- responsive ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-31,.g-21{grid-template-columns:minmax(0,1fr)}.andon{grid-template-columns:repeat(2,minmax(0,1fr))}.andon .an.dark{grid-column:1/-1}}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:268px;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}body.nav-open .side{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.4)}body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}.menu-btn{display:grid}.ck-btn{min-width:0}.ck-btn span,.ck-btn kbd{display:none}.g-2,.g-3,.g-13{grid-template-columns:minmax(0,1fr)}.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){#view{padding:16px 12px 32px}.top{padding:8px 12px;gap:8px}.clock{display:none}.k-v{font-size:1.25rem}.kpis{gap:8px}.card{padding:12px}.ph h1{font-size:1.25rem}.bins{gap:4px}.bin{height:48px;font-size:.6rem;padding:3px}.bin em{display:none}.andon{gap:8px}.an b{font-size:1.4rem}}

</head>

<script>
/* ================= Core helpers (shared by every page of this app) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
let NS = 'craft:';

/* --- seeded random, so the demo data is the same on every load --- */
let _s = 1;
const seed = n => { _s = (n >>> 0) || 1; };
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Number.isNaN(+v) ? a : Math.max(a, Math.min(b, v));
/* every number written into SVG goes through fin/fx, so NaN or Infinity can never reach an attribute */
const fin = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const fx = (v, p = 1) => fin(v).toFixed(p);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const lerp = (a, b, t) => a + (b - a) * t;
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 8);

/* --- number, money and date formatting --- */
const fmt = (n, d = 0) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const short = (n, d = 1) => { n = +n || 0; const a = Math.abs(n), s = n < 0 ? '-' : ''; const f = (v, u) => s + v.toFixed(d).replace(/\.0+$/, '') + u; return a >= 1e9 ? f(a / 1e9, 'B') : a >= 1e6 ? f(a / 1e6, 'M') : a >= 1e3 ? f(a / 1e3, 'K') : s + fmt(a, a < 10 && a % 1 ? 1 : 0); };
let CUR = 'Rs ';
const money = (n, d = 0) => (n < 0 ? '-' : '') + CUR + fmt(Math.abs(n), d);
const moneyS = n => (n < 0 ? '-' : '') + CUR + short(Math.abs(n));
const pct = (n, d = 0) => fmt(n, d) + '%';
const FMT = { fmt: v => fmt(v), money: v => money(v), moneyS: v => moneyS(v), short: v => short(v), pct: v => pct(v), pct1: v => pct(v, 1), dec1: v => fmt(v, 1), dec2: v => fmt(v, 2) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY = 864e5;
const NOW = new Date(); NOW.setHours(0, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fd = d => MON[d.getMonth()] + ' ' + d.getDate();
const fdy = d => fd(d) + ', ' + d.getFullYear();
const fdl = d => DAYN[d.getDay()] + ', ' + fd(d);
const ftime = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const ago = d => { const s = Math.max(0, (Date.now() - d) / 1000); return s < 50 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const lastMonths = n => Array.from({ length: n }, (_, i) => { const d = new Date(NOW.getFullYear(), NOW.getMonth() - n + 1 + i, 1); return MON[d.getMonth()]; });
const lastDays = n => Array.from({ length: n }, (_, i) => fd(addDays(NOW, i - n + 1)));
/* smooth random walk for demo series */
const walk = (n, start, vol, drift = 0, min = 0) => { let v = start; return Array.from({ length: n }, () => { v = Math.max(min, v * (1 + drift) + (rnd() - .5) * vol); return Math.round(v * 100) / 100; }); };

/* --- invented people and places --- */

/* --- tiny event bus and safe storage (works when storage is blocked) --- */

/* --- light and dark theme: ?theme= wins, then the saved choice, then the system --- */
const Theme = {
  init(def) {
    const q = new URLSearchParams(location.search).get('theme');

  },
  set(t, silent) {
    document.documentElement.dataset.theme = t;

  },
  get() { return document.documentElement.dataset.theme; },
  toggle() { this.set(this.get() === 'dark' ? 'light' : 'dark'); }

mqRM.addEventListener && mqRM.addEventListener('change', e => { RM = e.matches; document.documentElement.classList.toggle('rm', RM); });

/* --- timers and animation loops that pause while the tab is hidden and stop on page change --- */

function every(ms, fn, keep) { const t = { ms, fn, keep, id: 0 }; _timers.add(t); if (!document.hidden) t.id = setInterval(fn, ms); return t; }
function stopTimer(t) { if (t) { clearInterval(t.id); _timers.delete(t); } }
function loop(fn, keep) {
  const L = { fn, keep, on: true, raf: 0, last: 0 };
  L.step = t => { if (!L.on) return; const dt = L.last ? Math.min(60, t - L.last) : 16; L.last = t; if (fn(dt, t) === false) { L.stop(); return; } L.raf = requestAnimationFrame(L.step); };
  L.stop = () => { L.on = false; cancelAnimationFrame(L.raf); _loops.delete(L); };
  _loops.add(L); if (!document.hidden) L.raf = requestAnimationFrame(L.step); return L;
}
function clearPage() { _timers.forEach(t => { if (!t.keep) { clearInterval(t.id); _timers.delete(t); } }); _loops.forEach(L => { if (!L.keep) L.stop(); }); Charts.forEach((c, el) => { if (!el.isConnected) { Charts.delete(el); _ro && _ro.unobserve(el); } }); }

  _timers.forEach(t => { clearInterval(t.id); t.id = document.hidden ? 0 : setInterval(t.fn, t.ms); });
  _loops.forEach(L => { cancelAnimationFrame(L.raf); if (!document.hidden) { L.last = 0; L.raf = requestAnimationFrame(L.step); } });
  bus.emit('vis', !document.hidden);
});

/* --- count-up numbers --- */
function countUp(el, to, f = fmt, dur = 900) {
  const from = +el.dataset.v || 0; el.dataset.v = to;
  if (RM || document.hidden || from === to || !el.isConnected) { el.textContent = f(to); return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const counts = (root = document) => $$('[data-count]', root).forEach(e => countUp(e, +e.dataset.count, FMT[e.dataset.f] || fmt));

/* ---------- lookups and shared calculations ---------- */
const prod = id => DB.products.find(p => p.id === id) || DB.products[0];
const mat = id => DB.mats.find(m => m.id === id);
const mach = id => DB.machines.find(m => m.id === id);
const famColor = pid => FAMC[prod(pid).family] || 'var(--c2)';
function unitCost(p) {
  const material = sum((DB.bom[p.id] || []).map(b => { const m = mat(b.mid); return m ? m.cost * b.qty : 0; }));
  const minutes = sum((DB.routing[p.id] || []).map(s => s.min)), labour = minutes * DB.set.rate, overhead = (material + labour) * DB.set.oh / 100;
  return { material, labour, overhead, minutes, total: material + labour + overhead };
}
function qcCalc(q) { q.rate = q.inspected ? q.defects / q.inspected * 100 : 0; q.result = q.rate < 2.5 ? 'Pass' : q.rate < 6 ? 'Rework' : 'Fail'; return q; }
const SLOTS = 28;
const slotDate = s => addDays(NOW, Math.floor(s / 2));
const slotLabel = s => fdl(slotDate(s)) + (s % 2 ? ', shift B' : ', shift A');
const isLate = w => w.start != null && slotDate(w.start + w.dur - 1) > w.due;
const clashes = (m, s, d, id) => DB.wos.some(w => w.id !== id && w.mach === m && w.start != null && s < w.start + w.dur && w.start < s + d);
function nearestFree(m, s, d, id) { for (let k = 0; k < SLOTS; k++) for (const t of [s + k, s - k]) if (t >= 0 && t + d <= SLOTS && !clashes(m, t, d, id)) return t; return -1; }
const opts = a => a.map(x => typeof x === 'object' ? x : { v: x, l: x });
const sFilters = (k, list) => [{ label: 'All' }, ...list.map(s => ({ label: s, fn: r => r[k] === s }))];
const C = {
  id: (k = 'id', l = 'No.') => ({ k, label: l, f: v => `<span class="mono">${esc(v)}</span>` }),
  money: (k, l) => ({ k, label: l, num: true, f: v => money(v) }), num: (k, l, s = '') => ({ k, label: l, num: true, f: v => fmt(v) + s }),
  date: (k, l) => ({ k, label: l, f: v => v ? fd(v) : '–' }), tag: (k, l) => ({ k, label: l, f: v => tagS(v) }), txt: (k, l) => ({ k, label: l }),
  who: (k, l, sub) => ({ k, label: l, f: (v, r) => `<div class="cell-u">${avatar(v)}<div>${esc(v)}${sub ? `<small>${esc(r[sub])}</small>` : ''}</div></div>` })
};
let pageRefresh = null;
const page = (n, t, fn) => Router.add(n, t, (v, p) => { pageRefresh = null; fn(v, p); });
const redo = () => pageRefresh ? pageRefresh() : Router.refresh();
function res(name, title, cfg) { page(name, title, (v, p) => { const R = cfg(); R.title = R.title || title; R.param = p; const r = resourcePage(v, R); pageRefresh = r.refresh; }); }
function download(name, rows) {
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Downloaded ' + name); } catch (e) { toast('Download is blocked in this preview', 'warn'); }
}

function bindWo(el, w, L) {
  const f = el.querySelector('[data-sched]'), err = el.querySelector('[data-err]');
  f && f.addEventListener('submit', e => {
    e.preventDefault(); const m = f.querySelector('#wm').value, s = +f.querySelector('#ws').value, d = +f.querySelector('#wd').value;
    if (s + d > SLOTS) { err.textContent = 'The job runs past the end of the plan. Pick an earlier start.'; return; }
    if (clashes(m, s, d, w.id)) { const t = nearestFree(m, s, d, w.id); err.textContent = `That overlaps another job on ${m}.` + (t >= 0 ? ` First free start: ${slotLabel(t)}.` : ''); return; }
    Object.assign(w, { mach: m, start: s, dur: d, status: w.status === 'Running' ? 'Running' : 'Planned' }); L.close(); toast(`${w.id} planned on ${m}, ${slotLabel(s)}`); redo();

page('warehouses', 'Warehouses', v => {

  const CAP = 300, items = () => [...DB.products.map(p => ({ ...p, kind: 'p', ref: p })), ...DB.mats.map(m => ({ ...m, kind: 'm', ref: m }))];
  const racks = () => wh === 'Main store' ? ['A', 'B', 'C', 'D'] : ['E', 'F', 'G'];
  const fillOf = b => { const its = items().filter(i => i.bin === b); return { its, f: Math.min(100, sum(its.map(i => i.stock)) / CAP * 100) }; };

  const draw = () => {
    $('#wt', v).textContent = wh + ' · racks ' + racks().join(', ');
    $('#bins', v).innerHTML = racks().map((r, ri2) => `<span class="rk">${r}</span>` + Array.from({ length: 6 }, (_, i) => { const b = r + (i + 1), { its, f } = fillOf(b); return `<button class="bin" type="button" data-b="${b}" aria-label="Bin ${b}, ${Math.round(f)}% full, ${its.length} items" style="--f:${f.toFixed(0)}%;--fc:${col(f)};--d:${(ri2 * 6 + i) * 30}ms"><span>${b}</span><em>${Math.round(f)}%</em><i></i></button>`; }).join('')).join('');
    const all = [...'ABCDEFG'].flatMap(r => Array.from({ length: 6 }, (_, i) => r + (i + 1))).map(b => ({ b, ...fillOf(b) }));
    hbars($('#fb', v), all.sort((a, b) => b.f - a.f).slice(0, 7).map(x => ({ label: 'Bin ' + x.b, value: Math.round(x.f), color: col(x.f) })), { fmt: x => x + '%' });
    $('#wk', v).innerHTML = [{ label: 'Bins in use', value: all.filter(x => x.its.length).length, icon: 'grid' }, { label: 'Average fill', value: avg(all.map(x => x.f)), f: 'pct', icon: 'chart' }, { label: 'Full bins', value: all.filter(x => x.f > 85).length, icon: 'alert' }, { label: 'Empty bins', value: all.filter(x => !x.its.length).length, icon: 'box' }].map(kpiHTML).join(''); counts($('#wk', v));
    $$('.bin', v).forEach(b => { const { its } = fillOf(b.dataset.b); const mv = e => Tip.show(`<b>Bin ${b.dataset.b}</b>` + (its.length ? its.map(i => tipRow(i.name, fmt(i.stock), i.kind === 'p' ? 'var(--c2)' : 'var(--c1)')).join('') : '<div>Empty</div>'), e.clientX, e.clientY); b.addEventListener('pointermove', mv); b.addEventListener('pointerleave', () => Tip.hide()); });
  };

  cols: [C.id(), C.date('date', 'Date'), { k: 'cat', label: 'Category', f: v => statusTag(v, EXCOL) }, C.txt('note', 'Note'), C.txt('by', 'Paid by'), C.money('amount', 'Amount')],
  filters: [{ label: 'All' }, ...Object.keys(EXCOL).slice(0, 4).map(c => ({ label: c, fn: e => e.cat === c }))],
  kpis: d => { const m = monthSum(d, 'amount'); return [{ label: 'This month', value: m[5], f: 'moneyS', icon: 'wallet' }, { label: 'Last month', value: m[4], f: 'moneyS', icon: 'cal' }, { label: '6-month total', value: sum(m), f: 'moneyS', icon: 'chart' }, { label: 'Power share', value: sum(d.filter(e => e.cat === 'Electricity' || e.cat === 'Gas').map(e => e.amount)) / Math.max(1, sum(d.map(e => e.amount))) * 100, f: 'pct1', icon: 'bolt' }]; },
  chart: (el, d) => donut(el, { data: Object.keys(EXCOL).map(c => ({ label: c, value: sum(d.filter(e => e.cat === c).map(e => e.amount)), color: EXCOL[c] })), vfmt: moneyS, centerLabel: '6 months', center: moneyS(sum(d.map(e => e.amount))) }), chartTitle: 'Where the money goes',
  fields: [{ k: 'cat', label: 'Category', type: 'select', options: Object.keys(EXCOL) }, { k: 'amount', label: 'Amount (Rs)', type: 'number', min: 1, req: true }, { k: 'date', label: 'Date', type: 'date', req: true, def: dkey(NOW) }, { k: 'by', label: 'Paid by', type: 'select', options: ['Bank transfer', 'Cash', 'Cheque'] }, { k: 'note', label: 'Note', req: true, full: true }],
  make: v => ({ id: 'EX-' + (DB.seq.ex++), ...v })
}));

/* --- Product costing: what-if sliders --- */
page('costing', 'Product costing', v => {
  v.innerHTML = pageHead('Product costing', 'Unit cost built from materials, labour minutes and overhead. Move the sliders to test a change.') + `<div class="g g-13"><section class="card"><div class="card-h"><h2>What if…</h2></div><div class="slider"><label for="sr">Labour rate <output id="so1"></output></label><input type="range" id="sr" min="10" max="40" step="1" value="${DB.set.rate}"></div><div class="slider"><label for="sh">Overhead <output id="so2"></output></label><input type="range" id="sh" min="0" max="40" step="1" value="${DB.set.oh}"></div><button class="btn sm" type="button" data-reset>${ic('refresh')}Back to 18 Rs and 12%</button><div class="costgrid" id="cg"></div></section><section class="card"><div class="card-h"><h2>Cost per unit by product</h2></div><div class="chart" id="cc"></div></section></div><section class="card"><div class="card-h"><h2>Margins</h2></div><div id="ct"></div></section>`;
  const draw = (anim) => {
    $('#so1', v).textContent = money(DB.set.rate) + '/min'; $('#so2', v).textContent = DB.set.oh + '%';
    const uc = DB.products.map(p => ({ p, c: unitCost(p) }));
    barChart($('#cc', v), { labels: DB.products.map(p => p.name.split(' ').slice(0, 2).join(' ')), series: [{ name: 'Materials', data: uc.map(x => Math.round(x.c.material)), color: 'var(--c2)' }, { name: 'Labour', data: uc.map(x => Math.round(x.c.labour)), color: 'var(--c1)' }, { name: 'Overhead', data: uc.map(x => Math.round(x.c.overhead)), color: 'var(--c6)' }], stacked: true, h: 240, tfmt: money, xw: 76, anim });
    const am = avg(uc.map(x => (x.p.price - x.c.total) / x.p.price * 100));
    $('#cg', v).innerHTML = [['Average margin', `<span class="${am >= 0 ? 'up' : 'dn'}">${pct(am, 1)}</span>`], ['Loss makers', uc.filter(x => x.c.total > x.p.price).length]].map(([a, b]) => `<div><small>${a}</small><b>${b}</b></div>`).join('');
    $('#ct', v).innerHTML = `<div class="tw"><table class="tbl"><thead><tr>${['Product', 'Materials', 'Labour', 'Overhead', 'Unit cost', 'Price', 'Margin'].map((h, i) => `<th class="${i ? 'n' : ''}" scope="col"><span class="th">${h}</span></th>`).join('')}</tr></thead><tbody>${uc.map(x => { const m = (x.p.price - x.c.total) / x.p.price * 100; return `<tr><td>${esc(x.p.name)}</td><td class="n num">${money(x.c.material)}</td><td class="n num">${money(x.c.labour)}</td><td class="n num">${money(x.c.overhead)}</td><td class="n num"><b>${money(x.c.total)}</b></td><td class="n num">${money(x.p.price)}</td><td class="n num ${m >= 15 ? 'up' : 'dn'}">${pct(m, 1)}</td></tr>`; }).join('')}</tbody></table></div>`;
  };
  let t; const on = () => { DB.set.rate = +$('#sr', v).value; DB.set.oh = +$('#sh', v).value; $('#so1', v).textContent = money(DB.set.rate) + '/min'; $('#so2', v).textContent = DB.set.oh + '%'; clearTimeout(t); t = setTimeout(() => draw(false), 60); };
  $('#sr', v).oninput = on; $('#sh', v).oninput = on;
  $('[data-reset]', v).onclick = () => { $('#sr', v).value = 18; $('#sh', v).value = 12; on(); toast('Back to the standard rates'); };
  draw(); pageRefresh = () => draw();
});

/* --- Cash flow --- */
page('cashflow', 'Cash flow', v => {
  let rg = '12M';
  v.innerHTML = pageHead('Cash flow', 'Money in and out each month, the running bank balance and a three-month forecast.', '<div id="cr"></div>') + `<section class="kpis" id="ck"></section><div class="g g-21"><section class="card"><div class="card-h"><h2>Bank balance</h2></div><div class="chart" id="cb"></div></section><section class="card"><div class="card-h"><h2>In and out</h2></div><div class="chart" id="cio"></div></section></div><section class="card"><div class="card-h"><h2>Monthly detail</h2></div><div class="tw"><table class="tbl" id="ctb"></table></div></section>`;
  const draw = () => {
    const ms = rg === '6M' ? DB.months.slice(-6) : DB.months, start = 4.2e6; let bal = start;
    const balances = DB.months.map(m => (bal += m.cin - m.cout)), bShow = balances.slice(-ms.length);
    const last = balances[balances.length - 1], trend = avg(DB.months.slice(-3).map(m => m.cin - m.cout));
    const fc = [1, 2, 3].map(i => Math.round(last + trend * i)), lbl = [...ms.map(m => m.m), ...[1, 2, 3].map(i => MON[(NOW.getMonth() + i) % 12])];
    lineChart($('#cb', v), { labels: lbl, series: [{ name: 'Balance', data: [...bShow, null, null, null], color: 'var(--c2)' }, { name: 'Forecast', data: [...bShow.map((b, i) => i === bShow.length - 1 ? b : null), ...fc], color: 'var(--c1)', dash: true, noArea: true }], h: 240, morph: true, tfmt: moneyS, min: 'auto' });
    barChart($('#cio', v), { labels: ms.map(m => m.m), series: [{ name: 'In', data: ms.map(m => m.cin), color: 'var(--c3)' }, { name: 'Out', data: ms.map(m => m.cout), color: 'var(--c4)' }], h: 240, tfmt: moneyS });
    const ti = sum(ms.map(m => m.cin)), to = sum(ms.map(m => m.cout));
    $('#ck', v).innerHTML = [{ label: 'Bank balance', value: last, f: 'moneyS', icon: 'wallet' }, { label: 'Cash in', value: ti, f: 'moneyS', icon: 'down' }, { label: 'Cash out', value: to, f: 'moneyS', icon: 'up' }, { label: 'Forecast in 3 months', value: fc[2], f: 'moneyS', icon: 'chart', delta: (fc[2] - last) / last * 100 }].map(kpiHTML).join(''); counts($('#ck', v));
    let b2 = start + sum(balances.slice(0, DB.months.length - ms.length).map((_, i) => DB.months[i].cin - DB.months[i].cout));
    $('#ctb', v).innerHTML = `<thead><tr>${['Month', 'In', 'Out', 'Net', 'Balance'].map((h, i) => `<th class="${i ? 'n' : ''}" scope="col"><span class="th">${h}</span></th>`).join('')}</tr></thead><tbody>${ms.map(m => { const n = m.cin - m.cout; b2 += n; return `<tr><td>${m.m}</td><td class="n num up">${money(m.cin)}</td><td class="n num dn">${money(m.cout)}</td><td class="n num ${n >= 0 ? 'up' : 'dn'}">${money(n)}</td><td class="n num"><b>${money(b2)}</b></td></tr>`; }).join('')}</tbody>`;
  };
  segmented($('#cr', v), ['6M', '12M'], rg, r => { rg = r; draw(); }); draw(); pageRefresh = draw;
});

/* --- Reports --- */
page('reports', 'Reports', v => {
  const R = [
    ['Production output', 'Units made against plan, month by month.', el => lineChart(el, { labels: DB.months.map(m => m.m), series: [{ name: 'Units', data: DB.months.map(m => m.units), color: 'var(--c1)' }], h: 130 }), () => [['Month', 'Units', 'Plan'], ...DB.months.map(m => [m.m, m.units, m.plan])], 'output.csv'],
    ['Sales by month', 'Revenue and cost of goods for the last 12 months.', el => barChart(el, { labels: DB.months.map(m => m.m), series: [{ name: 'Revenue', data: DB.months.map(m => m.rev), color: 'var(--c2)' }], h: 130, tfmt: moneyS }), () => [['Month', 'Revenue', 'Cost'], ...DB.months.map(m => [m.m, m.rev, m.cost])], 'sales.csv'],
    ['Stock valuation', 'Raw materials at cost and goods at price.', el => donut(el, { data: [{ label: 'Materials', value: sum(DB.mats.map(m => m.stock * m.cost)), color: 'var(--c2)' }, { label: 'Finished goods', value: sum(DB.products.map(p => p.stock * p.price)), color: 'var(--c1)' }], size: 120, thick: 14, vfmt: moneyS }), () => [['Item', 'On hand', 'Value'], ...DB.mats.map(m => [m.name, m.stock, m.stock * m.cost]), ...DB.products.map(p => [p.name, p.stock, p.stock * p.price])], 'stock.csv'],
    ['Invoice ageing', 'What customers owe and for how long.', el => hbars(el, [['0–30 days', 'Due', 'var(--warn)'], ['Over 30 days', 'Overdue', 'var(--bad)']].map(([l, s, c]) => ({ label: l, value: sum(DB.inv.filter(i => i.status === s).map(i => i.amount)), color: c })), { fmt: moneyS }), () => [['Invoice', 'Customer', 'Amount', 'Status'], ...DB.inv.map(i => [i.id, i.cust, i.amount, i.status])], 'ageing.csv'],
    ['Machine efficiency', 'OEE and run hours for each machine.', el => barChart(el, { labels: DB.machines.map(m => m.id), series: [{ name: 'OEE', data: DB.machines.map(m => m.oee), color: 'var(--c3)' }], h: 130, yfmt: x => x + '%' }), () => [['Machine', 'OEE', 'Hours'], ...DB.machines.map(m => [m.id, m.oee, m.hours])], 'machines.csv'],
    ['Quality summary', 'Pass, rework and fail across all checks.', el => donut(el, { data: ['Pass', 'Rework', 'Fail'].map(s => ({ label: s, value: DB.qc.filter(q => q.result === s).length, color: SC[s] })), size: 120, thick: 14 }), () => [['Check', 'Product', 'Inspected', 'Defects', 'Result'], ...DB.qc.map(q => [q.id, q.product, q.inspected, q.defects, q.result])], 'quality.csv']
  ];
  v.innerHTML = pageHead('Reports', 'Six ready-made reports. Download any of them as a spreadsheet file.', `<button class="btn" type="button" data-print>${ic('dl')}Print page</button>`) + `<div class="g g-3">${R.map((r, i) => `<section class="card rep"><div class="card-h" style="margin:0"><h2>${r[0]}</h2></div><p>${r[1]}</p><div class="chart" data-r="${i}"></div><div class="acts"><button class="btn sm" type="button" data-dl="${i}">${ic('dl')}Download CSV</button></div></section>`).join('')}</div>`;
  R.forEach((r, i) => r[2]($(`[data-r="${i}"]`, v)));
  v.addEventListener('click', e => { const b = e.target.closest('[data-dl]'); if (b) { const r = R[+b.dataset.dl]; download(r[4], r[3]()); } if (e.target.closest('[data-print]')) { try { window.print(); } catch (x) { toast('Printing is not available here', 'warn'); } } });
});

/* --- Team --- */
res('team', 'Team', () => ({
  sub: 'Everyone at the plant.', noun: 'person', plural: 'people', data: () => DB.team, sort: 'name', dir: 1,
  cols: [C.who('name', 'Name', 'role'), C.txt('dept', 'Department'), { k: 'shift', label: 'Shift', f: v => `<span class="mono">${v}</span>` }, C.txt('phone', 'Phone'), C.date('joined', 'Joined'), C.money('pay', 'Monthly pay'), C.tag('status', 'Status')],
  filters: [{ label: 'All' }, ...['Production', 'Quality', 'Maintenance'].map(d => ({ label: d, fn: e => e.dept === d }))],
  kpis: d => [{ label: 'Headcount', value: d.length, icon: 'users' }, { label: 'Monthly payroll', value: sum(d.map(e => e.pay)), f: 'moneyS', icon: 'wallet' }, { label: 'On leave', value: d.filter(e => e.status === 'On leave').length, icon: 'cal' }, { label: 'Average tenure (years)', value: avg(d.map(e => (NOW - e.joined) / DAY / 365)), f: 'dec1', icon: 'clock' }],
  fields: [{ k: 'name', label: 'Full name', req: true }, { k: 'role', label: 'Role', req: true }, { k: 'dept', label: 'Department', type: 'select', options: ['Production', 'Quality', 'Maintenance', 'Stores', 'Sales', 'Finance'] }, { k: 'shift', label: 'Shift', type: 'select', options: ['A', 'B', 'C', 'General'] }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'pay', label: 'Monthly pay (Rs)', type: 'number', min: 0, req: true }, { k: 'status', label: 'Status', type: 'select', options: ['Active', 'On leave'] }],
  make: v => ({ id: 'E-' + ri(40, 99), ...v, joined: new Date() })
}));

/* --- Settings --- */
page('settings', 'Settings', v => {
  v.innerHTML = pageHead('Settings', 'Plant details, display and notifications.') + `<div class="g g-2"><section class="card"><div class="card-h"><h2>Plant profile</h2></div><form class="form" id="pf" novalidate>${formHTML([{ k: 'plant', label: 'Plant name', req: true, full: true }, { k: 'city', label: 'City', type: 'select', options: CITY }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'email', label: 'Email', type: 'email', req: true, full: true }], DB.set)}<div class="fld full"><button class="btn pri" type="submit">${ic('check')}Save profile</button></div></form></section>
  <section class="card set-sec"><div class="card-h" style="margin:0"><h2>Display</h2></div>${switchHTML('s-dark', 'Dark theme', Theme.get() === 'dark')}${switchHTML('s-compact', 'Compact tables', document.body.classList.contains('compact'))}${switchHTML('s-motion', 'Reduce motion', document.documentElement.classList.contains('rm'))}<div class="card-h" style="margin:8px 0 0"><h2>Notify me about</h2></div>${switchHTML('n1', 'Machine faults', true)}${switchHTML('n2', 'Late jobs', true)}${switchHTML('n3', 'Low stock', true)}${switchHTML('n4', 'Payments received', false)}</section></div>
  <section class="card"><div class="card-h"><h2>Demo data</h2></div><p class="muted" style="margin-bottom:12px">Everything here is sample data made up in the browser. Reset it to start again.</p><button class="btn danger" type="button" data-reset>${ic('refresh')}Reset demo data</button></section>`;
  const F = [{ k: 'plant', label: 'Plant name', req: true }, { k: 'city', label: 'City' }, { k: 'phone', label: 'Phone', type: 'tel', req: true }, { k: 'email', label: 'Email', type: 'email', req: true }];
  $('#pf', v).addEventListener('submit', e => { e.preventDefault(); const x = readForm(e.target, F); if (!x) return; Object.assign(DB.set, x); toast('Profile saved'); });
  $('#s-dark', v).onchange = e => Theme.set(e.target.checked ? 'dark' : 'light');
  $('#s-compact', v).onchange = e => { document.body.classList.toggle('compact', e.target.checked); LS.set('compact', e.target.checked); toast(e.target.checked ? 'Compact tables on' : 'Compact tables off'); };
  $('#s-motion', v).onchange = e => { RM = e.target.checked; document.documentElement.classList.toggle('rm', RM); toast(RM ? 'Motion reduced' : 'Motion back on'); };
  $$('[id^=n]', v).forEach(s => s.onchange = () => toast('Notification setting saved'));
  $('[data-reset]', v).onclick = async () => { if (await confirmBox('Reset all demo data? Your changes will be lost.', { ok: 'Reset data' })) { DB = makeData(); Bell.list = []; Bell.badge(); toast('Demo data reset'); location.hash = '#/overview'; } };
});

/* ================= Start ================= */
DB = makeData();
Theme.init();
if (LS.get('compact', false)) document.body.classList.add('compact');
buildNav();
Bell.init($('[data-bell]'));
Bell.add('WD-2 is down', 'Wire feed fault, maintenance on it', 'bad', true);
Bell.add('MS sheet 1.2 mm is low', 'Below the reorder point', 'warn', true);
Bell.add('SO-5141 delivered', 'Crescent Offices, Islamabad', 'ok', true);
Cmdk.extra = [{ label: 'New work order', hint: 'Action', run: newWoModal }, { label: 'Auto-schedule backlog', hint: 'Action', run: () => { location.hash = '#/plan'; setTimeout(autoSchedule, 300); } }, { label: 'Toggle dark theme', hint: 'Action', run: () => Theme.toggle() }];
/* top bar clock and shift progress, refreshed every 10 seconds */
const tickClock = () => { const d = new Date(), s = curShift(); $('#clock').textContent = ftime(d) + ' · ' + s.name; $('#sb-shift').textContent = s.name + ' running'; $('#sb-time').textContent = s.t; $('#sb-bar').style.setProperty('--w', (s.p * 100).toFixed(0) + '%'); };
tickClock(); every(10000, tickClock, true);
/* now and then something happens on the floor */
every(14000, () => { const m = pick(DB.machines.filter(x => x.status === 'Running')); if (m) Bell.add(`${m.id} finished a batch`, `${ri(20, 60)} units to the next station`, 'ok', true); }, true);
Router.start();
</script>
</body>
</html>
