<!doctype html>
<!-- Chill and Craft · Single Stroke · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single Stroke · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --paper: #fbf7ee;
    --rule: rgba(70, 110, 190, .13);
    --margin: rgba(214, 64, 64, .28);
    --ink: #1d2b4f;
    --ink-soft: rgba(29, 43, 79, .55);
    --focus: #d6402f;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  /* Dark theme: a chalkboard with chalk lines */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1f2b26;
      --rule: rgba(255, 255, 255, .045);
      --margin: rgba(255, 140, 140, .14);
      --ink: #eef2ea;
      --ink-soft: rgba(238, 242, 234, .55);
      --focus: #fca5a5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1f2b26;
    --rule: rgba(255, 255, 255, .045);
    --margin: rgba(255, 140, 140, .14);
    --ink: #eef2ea;
    --ink-soft: rgba(238, 242, 234, .55);
    --focus: #fca5a5;
  }

  /* ---------- Stage: ruled paper ---------- */
  * { box-sizing: border-box; }
  body { overflow-x: hidden; } /* particles may fly past the edges */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
      repeating-linear-gradient(180deg, transparent 0 27px, var(--rule) 27px 28px);
    color: var(--ink);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px 16px 24px; }

  /* ---------- Button: everything is drawn with one ink line ---------- */
  .btn {
    position: relative;
    width: 240px;
    height: 72px;
    padding: 0;
    border: 0;
    border-radius: 36px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: transform .45s var(--spring);
  }
  .btn:hover { transform: translateY(-2px) rotate(-1deg); }
  .btn:active { transform: scale(.96); transition-duration: .1s; }
  .btn:focus-visible { outline: 2px dashed var(--focus); outline-offset: 6px; }
  .btn[aria-disabled="true"] { cursor: progress; transform: none; }

  .art { position: absolute; inset: 0; width: 240px; height: 72px; overflow: visible; pointer-events: none; }
  .art path, .art rect, .art circle { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* The outline draws itself when the page opens */
  .frame { stroke-dasharray: 100; animation: draw 1.1s cubic-bezier(.6, 0, .3, 1) .1s backwards; }
  /* A second, offset line appears on hover, like a quick sketch */
  .sketch { stroke-dasharray: none; opacity: 0; stroke-width: 1.3 !important; transition: opacity .25s; }
  .btn:not([aria-disabled="true"]):hover .sketch { opacity: .45; animation: boil .36s steps(1) infinite; }

  .arrow { transform-box: view-box; transform-origin: 44px 34px; transition: transform .55s var(--spring), opacity .3s; }
  .arrow path { stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset .6s ease-out; animation: draw .6s ease-out .9s backwards; }
  .btn:not([aria-disabled="true"]):hover .arrow { animation: bob .8s ease-in-out infinite; }

  .track { stroke-dasharray: 2 6 !important; opacity: 0; stroke-width: 1.4 !important; transition: opacity .3s; }
  .ink { stroke-dasharray: 160; stroke-dashoffset: 160; stroke-width: 2.6 !important; transition: stroke-dashoffset .3s ease-out; }
  .page { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .7s ease-in-out; }
  .tick { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .4s ease-out; }
  .doc { transform-box: view-box; transform-origin: 78px 36px; }

  .label {
    position: absolute;
    left: 70px;
    right: 18px;
    top: 0;
    bottom: 0;
    display: grid;
    place-items: center;
    font-size: 21px;
    font-style: italic;
    letter-spacing: .01em;
    white-space: nowrap;
    transition: opacity .3s, transform .6s var(--spring);
    animation: fadeIn .5s ease-out 1.1s backwards;
  }
  .label span { display: inline-block; }
  .pct { position: absolute; left: 0; right: 0; top: 6px; text-align: center; font-size: 14px; font-style: italic; font-variant-numeric: tabular-nums; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .4s var(--spring); }

  .fx { position: absolute; left: 78px; top: 36px; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; border-radius: 50%; background: var(--ink); pointer-events: none; }

  .cap { margin: 0; font-size: 14px; font-style: italic; color: var(--ink-soft); text-align: center; }

  /* ---------- States ---------- */
  .btn:is([data-state="working"], [data-state="done"]) .label { opacity: 0; transform: translateX(14px); }
  .btn[data-state="working"] .pct { opacity: 1; transform: none; }
  .btn[data-state="working"] .track { opacity: .45; }
  .btn[data-state="working"] .arrow { animation: none; }
  .btn[data-state="working"] .arrow .head { animation: nib .5s ease-in-out infinite alternate; }

  /* done: the line becomes a file with a tick, and the label says Saved */
  .btn[data-state="done"] .arrow { opacity: 0; animation: none; }
  .btn[data-state="done"] .arrow path { stroke-dashoffset: 100; transition: none; }
  .btn[data-state="done"] .page { stroke-dashoffset: 0; transition-delay: .15s; }
  .btn[data-state="done"] .tick { stroke-dashoffset: 0; transition-delay: .8s; }
  .btn[data-state="done"] .doc { animation: boing .7s .75s var(--spring) backwards; }
  .btn[data-state="saved"] .page { stroke-dashoffset: 0; }
  .btn[data-state="saved"] .tick { stroke-dashoffset: 0; }
  .btn[data-state="saved"] .arrow { opacity: 0; animation: none; }
  .btn[data-state="saved"] .arrow path { stroke-dashoffset: 100; transition: none; }
  .btn[data-state="saved"] .label { transform: translateX(-12px); }

  @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes nib { from { transform: translateY(-.8px); } to { transform: translateY(.8px); } }
  @keyframes boil { 0% { transform: translate(1px, 1px) rotate(.4deg); } 33% { transform: translate(-1px, 1px) rotate(-.3deg); } 66% { transform: translate(1px, -1px) rotate(.2deg); } }
  @keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.15, .88); } 100% { transform: scale(1); } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; animation-delay: 0s !important; }
    .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <button class="btn" type="button" data-state="idle" aria-describedby="cap">
    <svg class="art" viewBox="0 0 240 72" aria-hidden="true">
      <rect class="sketch" x="4" y="4" width="233" height="65" rx="32.5" />
      <rect class="frame" pathLength="100" x="3" y="3" width="234" height="66" rx="33" />
      <!-- progress: a dotted guide and the ink line -->
      <path class="track" d="M40 44H200" />
      <path class="ink" d="M40 44H200" />
      <!-- the arrow: lies down and pushes the ink line along -->
      <g class="arrow">
        <path pathLength="100" d="M44 18v32" />
        <path class="head" pathLength="100" d="M34 40l10 10 10-10" />
      </g>
      <!-- the file it becomes, and a tick -->
      <g class="doc">
        <path class="page" pathLength="100" d="M62 15h20l12 12v31H62zM82 15v12h12" />
        <path class="tick" pathLength="100" d="M69 41l5.5 5.5L85 35" />
      </g>
    </svg>
    <span class="label"><span>Download</span></span>
    <span class="pct" aria-hidden="true">0%</span>
    <span class="fx" aria-hidden="true"></span>
  </button>
  <p class="cap" id="cap">Field-Notes.pdf · 3.1 MB</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Single Stroke download button ----------
  const btn = document.querySelector(".btn");
  const arrow = btn.querySelector(".arrow");
  const ink = btn.querySelector(".ink");
  const pct = btn.querySelector(".pct");
  const labelText = btn.querySelector(".label span");
  const fx = btn.querySelector(".fx");
  const status = document.getElementById("status");

  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const INK_LEN = 160; // the ink line runs from x=40 to x=200
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  let busy = false;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Ink spots flicked out around the file
  function splatter(count) {
    if (calm()) return;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("i");
      p.className = "particle";
      const s = 2 + Math.random() * 4;
      p.style.width = p.style.height = s.toFixed(1) + "px";
      fx.appendChild(p);
      const a = Math.random() * Math.PI * 2;
      const d = 30 + Math.random() * 26;
      p.animate([
        { transform: "translate(-50%, -50%) scale(.2)", opacity: 1 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d * .7).toFixed(1) + "px)) scale(1)", opacity: 1, offset: .5 },
        { transform: "translate(calc(-50% + " + (Math.cos(a) * d * 1.1).toFixed(1) + "px), calc(-50% + " + (Math.sin(a) * d * .7 + 6).toFixed(1) + "px)) scale(.8)", opacity: 0 }
      ], { duration: 900 + Math.random() * 300, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => p.remove();
    }
  }

  async function swapLabel(text) {
    await play(labelText, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 });
    labelText.textContent = text;
    play(labelText, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 450, easing: SPRING });
  }

  // The folded arrow is pushed right as the ink line grows behind it
  function setProgress(p) {
    const push = (p / 100) * 128;
    arrow.style.transform = "translate(" + (12 + push).toFixed(1) + "px, 10px) rotate(-90deg)";
    ink.style.strokeDashoffset = (INK_LEN - (32 + push)).toFixed(1);
    pct.textContent = Math.round(p) + "%";
  }

  // Fake download with uneven chunks
  function simulateDownload(onTick) {
    return new Promise((resolve) => {
      let p = 0;
      (function step() {
        p = Math.min(100, p + 2 + Math.random() * 6);
        onTick(p);
        if (p >= 100) resolve();
        else setTimeout(step, 150 + Math.random() * 110);
      })();
    });
  }

  btn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    btn.setAttribute("aria-disabled", "true");

    // 1. Anticipation: the arrow squashes, the outline flexes
    await Promise.all([
      play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.04, .9)" }, { transform: "scale(1)" }], { duration: 320, easing: "ease-out" }),
      play(arrow, [{ transform: "translateY(0) scaleY(1)" }, { transform: "translateY(6px) scaleY(.7)" }, { transform: "translateY(0) scaleY(1)" }], { duration: 340, easing: "ease-in-out" })
    ]);

    // 2. The arrow folds down flat and starts drawing a line
    btn.dataset.state = "working";
    status.textContent = "Download started.";
    setProgress(0);
    await wait(550);
    arrow.style.transition = "transform .3s ease-out, opacity .3s"; // follow the progress closely

    // 3. Progress: the arrow pushes the ink line across
    let spoken = 0;
    await simulateDownload((p) => {
      setProgress(p);
      if (p - spoken >= 25 && p < 100) {
        spoken = Math.floor(p / 25) * 25;
        status.textContent = "Downloading, " + spoken + " percent.";
      }
    });
    await wait(350);

    // 4. Finish: the line rolls back up while a file draws itself, then a tick
    ink.style.transition = "stroke-dashoffset .55s ease-in";
    ink.style.strokeDashoffset = INK_LEN;
    btn.dataset.state = "done";
    setTimeout(() => splatter(14), calm() ? 0 : 900);
    status.textContent = "Download complete. Field-Notes.pdf is saved.";
    await wait(900);
    btn.dataset.state = "saved";
    labelText.textContent = "Saved";
    play(labelText, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 450, easing: SPRING });
    await wait(2200);

    // 5. Reset: the file un-draws, the arrow draws itself back in
    arrow.style.transition = "none";
    arrow.style.transform = "";
    ink.style.transition = "";
    btn.dataset.state = "idle";
    void arrow.getBoundingClientRect(); // apply the jump before the transition comes back
    arrow.style.transition = "";
    await swapLabel("Download");
    await wait(500);
    btn.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
