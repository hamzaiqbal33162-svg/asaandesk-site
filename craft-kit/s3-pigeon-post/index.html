<head>

<title>Pigeon Post · Send a note across the rooftops</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: a warm dusk over flat city roofs ---------- */
  :root {
    --bg: #f5e4d7;
    --card: #fffaf5;
    --field: #fbf1e8;
    --ink: #2d1e2f;
    --muted: #87707a;
    --line: rgba(45, 30, 47, 0.13);
    --accent: #e0574b;
    --accent2: #bf3f36;
    --ok: #2b9a68;
    --sky1: #f3a796; --sky2: #f8cdb0; --sky3: #fde9d2;
    --sun: #fff1c9;
    --far: #eab7a7; --mid: #dc9686; --far2: #e3a191; --mid2: #cf7d70; --near2: #b6655b;
    --home: #87484a; --roof: #a45d55; --wood: #6b3d2e; --wood2: #8f5a3b;
    --win: #f6d3b3; --star: 0;
    --shadow: rgba(110, 50, 40, 0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #110f22;
    --card: #1a1730;
    --field: #221e3b;
    --ink: #f1ecf7;
    --muted: #a69cb8;
    --line: rgba(241, 236, 247, 0.11);
    --accent: #ff7a68;
    --accent2: #f0604f;
    --ok: #43cf8d;
    --sky1: #0d1230; --sky2: #241f4d; --sky3: #4a3366;
    --sun: #f4ecd2;
    --far: #2b2753; --mid: #221f45; --far2: #302b5b; --mid2: #27234b; --near2: #1e1b3c;
    --home: #15132b; --roof: #201d3d; --wood: #3a2a2f; --wood2: #54382f;
    --win: #ffcf7a; --star: 1;
    --shadow: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, textarea { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Stage ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; isolation: isolate; background: radial-gradient(70% 60% at 50% 20%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--bg); }
  .stage::after { content: ""; position: absolute; z-index: -1; inset: auto -10% -30% -10%; height: 60%; background: radial-gradient(closest-side, color-mix(in srgb, var(--sky1) 45%, transparent), transparent); animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.5; transform: scale(1.08); } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(0.98); } }

  .card { width: min(700px, 100%); border-radius: 28px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 50px 90px -50px var(--shadow); overflow: hidden; animation: rise 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }

  /* ---------- Rooftop scene ---------- */
  .scene { position: relative; overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }
  .scene svg * { transform-box: view-box; }
  .cloud { animation: drift 38s linear infinite; }
  .cloud.c2 { animation-duration: 52s; animation-delay: -20s; }
  .cloud.c3 { animation-duration: 64s; animation-delay: -41s; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(760px); } }
  .flock { animation: flock 26s linear infinite; }
  @keyframes flock { from { transform: translate(-60px, 0); } to { transform: translate(700px, -30px); } }
  .flock path { animation: flap 0.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes flap { to { transform: scaleY(0.4); } }
  .star { opacity: var(--star); animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: calc(var(--star) * 0.25); } }
  .win { fill: var(--win); opacity: calc(0.35 + var(--star) * 0.6); }
  .win.blink { animation: lamp 5s steps(1) infinite; }
  @keyframes lamp { 40% { opacity: 0.15; } 70% { opacity: calc(0.35 + var(--star) * 0.6); } }
  .kite { transform-origin: 70px 72px; animation: kite 4.2s ease-in-out infinite; }
  @keyframes kite { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-6px); } }
  .peek { animation: peek 5.5s ease-in-out infinite; }
  @keyframes peek { 0%, 55%, 100% { transform: translateY(8px); } 65%, 90% { transform: translateY(0); } }
  .pghead { animation: bob 1.9s ease-in-out infinite; }
  @keyframes bob { 0%, 60%, 100% { transform: translateX(0); } 70% { transform: translateX(2.4px); } 80% { transform: translateX(-0.6px); } }
  .flying .pghead { animation: none; }
  .pin { transition: opacity 0.35s; }
  .pin .bub { transition: transform 0.5s cubic-bezier(0.3, 1.7, 0.5, 1); transform: scale(0.55); transform-origin: 0 0; }
  .pin.on .bub { transform: scale(1); animation: pinbob 1.8s ease-in-out infinite; }
  @keyframes pinbob { 50% { transform: translateY(-4px) scale(1); } }
  .pin:not(.on) { opacity: 0.6; }

  /* the delivered note that pops up over the friend's roof */
  .note { position: absolute; left: 0; top: 0; z-index: 3; width: 210px; padding: 10px 12px 11px; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 18px 30px -16px var(--shadow); font-size: 0.78rem; line-height: 1.35; opacity: 0; pointer-events: none; transform-origin: 50% 100%; }
  .note b { display: flex; align-items: center; gap: 6px; font-size: 0.74rem; }
  .note b i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 0.6rem; }
  .note p { margin: 4px 0 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .note small { display: block; margin-top: 4px; color: var(--ok); font-weight: 750; font-size: 0.68rem; }

  /* ---------- Composer ---------- */
  .compose { padding: 16px 18px 18px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lbl { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .to { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 5px; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; font-size: 0.8rem; font-weight: 750; cursor: pointer; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.2s, border-color 0.2s; }
  .chip i { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-style: normal; font-size: 0.66rem; font-weight: 900; }
  .chip small { color: var(--muted); font-weight: 650; font-size: 0.7rem; }
  .chip:hover { transform: translateY(-1px); border-color: var(--accent); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .field { position: relative; margin-top: 12px; }
  .field textarea { display: block; width: 100%; height: 62px; resize: none; padding: 10px 14px 18px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--field); font-size: 0.92rem; line-height: 1.4; transition: border-color 0.2s, box-shadow 0.2s; }
  .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .field .count { position: absolute; right: 12px; bottom: 6px; font-size: 0.66rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .field.shake { animation: shake 0.45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .status { flex: 1; min-width: 0; font-size: 0.8rem; color: var(--muted); }
  .status b { color: var(--ink); }
  .send { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border: 0; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #fff; font-weight: 850; font-size: 0.92rem; cursor: pointer; box-shadow: 0 14px 22px -14px var(--accent2), inset 0 -3px 0 rgba(0, 0, 0, 0.16); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); flex: none; }
  .send:hover { transform: translateY(-2px); }
  .send:active { transform: scale(0.95); }
  .send svg { width: 20px; height: 20px; position: relative; }
  .send span { position: relative; }
  .send .fill { position: absolute; inset: 0; width: 0; background: rgba(255, 255, 255, 0.22); }
  .send.done { background: linear-gradient(180deg, var(--ok), color-mix(in srgb, var(--ok) 80%, #000)); }
  .send[aria-disabled="true"] { cursor: progress; }

  .fx { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
  .paper { position: absolute; left: 0; top: 0; padding: 8px 10px; border-radius: 6px; background: #fff6e3; color: #4a3428; font-size: 0.8rem; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.4); white-space: nowrap; overflow: hidden; transform-origin: 0 0; }
  .feather, .spark { position: absolute; left: 0; top: 0; }
  .spark { width: 7px; height: 7px; border-radius: 50%; }

  @media (max-width: 480px) {
    .compose { padding: 14px; }
    .chip small { display: none; }
    .foot { flex-direction: column; align-items: stretch; }
    .send { width: 100%; }
    .note { width: 170px; font-size: 0.72rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::after, .card, .cloud, .flock, .flock path, .star, .win.blink, .kite, .peek, .pghead, .pin.on .bub, .field.shake { animation: none !important; }
    .chip, .send, .pin .bub { transition-duration: 0.01s; }
    .fx { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <div class="scene" id="scene">
        <svg id="svg" viewBox="0 0 640 300" role="img" aria-labelledby="sceneT">
          <title id="sceneT">Dusk over the rooftops: your pigeon waits on the roof, three friends' roofs further away</title>
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)" /><stop offset=".55" stop-color="var(--sky2)" /><stop offset="1" stop-color="var(--sky3)" /></linearGradient>
            <radialGradient id="glow"><stop offset="0" stop-color="var(--sun)" stop-opacity=".9" /><stop offset="1" stop-color="var(--sun)" stop-opacity="0" /></radialGradient>
            <linearGradient id="neck" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fc49a" /><stop offset=".5" stop-color="#8b6ad8" /><stop offset="1" stop-color="#5fc49a" /></linearGradient>
            <pattern id="jali" width="12" height="14" patternUnits="userSpaceOnUse"><path d="M2 14V7a4 4 0 0 1 8 0v7" fill="none" stroke="var(--roof)" stroke-width="2" /></pattern>
          </defs>
          <rect width="640" height="300" fill="url(#sky)" />
          <!-- stars (dark theme only) -->
          <g fill="#fff"><circle class="star" cx="60" cy="30" r="1.3" /><circle class="star" cx="180" cy="52" r="1" style="animation-delay:-1s" /><circle class="star" cx="300" cy="22" r="1.4" style="animation-delay:-2s" /><circle class="star" cx="420" cy="44" r="1" style="animation-delay:-.5s" /><circle class="star" cx="610" cy="28" r="1.3" style="animation-delay:-1.6s" /><circle class="star" cx="250" cy="96" r=".9" style="animation-delay:-2.4s" /></g>
          <!-- low sun, or moon in the dark -->
          <circle cx="520" cy="122" r="80" fill="url(#glow)" />
          <circle cx="520" cy="122" r="30" fill="var(--sun)" />
          <g class="cloud"><path d="M0 70a14 14 0 0 1 26-6 11 11 0 0 1 20 4 9 9 0 0 1 2 17H4A8 8 0 0 1 0 70Z" fill="#fff" opacity=".55" /></g>
          <g class="cloud c2"><path d="M0 120a12 12 0 0 1 22-5 9 9 0 0 1 16 3 8 8 0 0 1 2 14H3a7 7 0 0 1-3-12Z" fill="#fff" opacity=".4" /></g>
          <g class="cloud c3"><path d="M0 40a10 10 0 0 1 18-4 8 8 0 0 1 14 3 6 6 0 0 1 1 11H3a6 6 0 0 1-3-10Z" fill="#fff" opacity=".35" /></g>
          <g class="flock" fill="none" stroke="var(--home)" stroke-width="1.4" stroke-linecap="round" opacity=".45"><path d="M10 60l4 3 4-3" /><path d="M22 54l3 2.5 3-2.5" /><path d="M26 66l3 2.5 3-2.5" /></g>

          <!-- far skyline: domes and towers in the haze -->
          <g id="layerFar">
            <path fill="var(--far)" d="M-20 300V214h40v-12h26v-18a13 13 0 0 1 26 0v18h22v26h30v-34h8v-14h4v14h8v34h44v-22a20 20 0 0 1 40 0v22h60v-30h34v30h36v-16h22v16h40v-40h6v-10h4v10h6v40h46v-24h44v24h36v-18a16 16 0 0 1 32 0v18h48V300Z" />
          </g>
          <!-- the three friends' roofs, from far to near -->
          <g id="layerMid">
            <rect x="250" y="176" width="52" height="124" fill="var(--far2)" />
            <rect x="266" y="164" width="20" height="12" rx="2" fill="var(--far2)" stroke="var(--mid2)" stroke-width="1.2" />
            <rect class="win" x="258" y="190" width="7" height="9" /><rect class="win blink" x="276" y="190" width="7" height="9" /><rect class="win" x="258" y="210" width="7" height="9" />
            <rect x="350" y="190" width="92" height="110" fill="var(--mid2)" />
            <rect x="350" y="184" width="92" height="6" fill="var(--far2)" opacity=".6" />
            <path d="M420 184v-26M414 166h12M416 172h8" stroke="var(--near2)" stroke-width="1.6" />
            <rect class="win" x="362" y="204" width="10" height="13" /><rect class="win" x="384" y="204" width="10" height="13" /><rect class="win blink" x="406" y="204" width="10" height="13" style="animation-delay:-2s" /><rect class="win" x="362" y="230" width="10" height="13" /><rect class="win" x="406" y="230" width="10" height="13" />
            <rect x="200" y="236" width="70" height="64" fill="var(--mid)" />
            <rect x="300" y="226" width="56" height="74" fill="var(--mid)" />
          </g>
          <g id="layerNear">
            <rect x="494" y="214" width="160" height="86" fill="var(--near2)" />
            <rect x="494" y="208" width="160" height="6" fill="var(--mid2)" />
            <path d="M562 208v-10M594 208v-10" stroke="var(--home)" stroke-width="2.4" />
            <rect x="556" y="178" width="44" height="22" rx="5" fill="var(--mid2)" stroke="var(--home)" stroke-width="1.6" />
            <path d="M560 186h36" stroke="var(--home)" stroke-width="1" opacity=".5" />
            <rect class="win" x="512" y="232" width="13" height="16" /><rect class="win blink" x="540" y="232" width="13" height="16" style="animation-delay:-3.5s" /><rect class="win" x="604" y="232" width="13" height="16" /><rect class="win" x="512" y="264" width="13" height="16" /><rect class="win" x="576" y="264" width="13" height="16" />
          </g>
          <!-- friend markers -->
          <g id="pins"></g>

          <!-- your roof: kite, coop and the parapet -->
          <path d="M112 172C120 140 96 100 72 84" fill="none" stroke="var(--home)" stroke-width=".9" opacity=".6" />
          <g class="kite"><path d="M70 56l15 16-15 22-15-22Z" fill="var(--accent)" /><path d="M70 56v38M55 72h30" stroke="#fff" stroke-width="1" opacity=".7" /><path d="M70 94c-4 6 4 9 0 15" fill="none" stroke="var(--accent)" stroke-width="1.4" /></g>
          <rect x="-10" y="228" width="250" height="72" fill="var(--home)" />
          <rect x="-10" y="222" width="250" height="8" fill="var(--roof)" />
          <rect x="-10" y="232" width="250" height="16" fill="url(#jali)" opacity=".7" />
          <g id="coop">
            <path d="M58 170l52-22 52 22Z" fill="var(--wood)" />
            <rect x="64" y="170" width="92" height="52" fill="var(--wood2)" />
            <path d="M64 196h92" stroke="var(--wood)" stroke-width="3" />
            <path d="M76 190v-8a7 7 0 0 1 14 0v8ZM103 190v-8a7 7 0 0 1 14 0v8ZM130 190v-8a7 7 0 0 1 14 0v8Z" fill="#2a1712" />
            <g class="peek"><circle cx="110" cy="184" r="4.6" fill="#a7b0c4" /><circle cx="111.6" cy="183" r="1" fill="#f6a23a" /><path d="M114 184.5l3.5 1-3.5 1Z" fill="#3b3434" /></g>
            <path d="M58 222h108" stroke="var(--wood)" stroke-width="3" />
          </g>

          <!-- the carrier pigeon: its feet are at 0,0; the script moves it -->
          <g id="pg">
            <g id="pgBody">
              <path id="wingFar" d="M0-18C-6-30-20-40-38-42-30-34-24-26-18-20-12-16-6-15 0-16Z" fill="#6f7c94" opacity="0" />
              <path d="M-10-14-31-11-30-5-8-8Z" fill="#5d6880" />
              <path d="M-13-12C-11-24 4-27 10-22 16-18 14-6 4-4-4-2-13-4-13-12Z" fill="#a9b3c7" />
              <path d="M5-22C9-28 14-31 16-28L14-15C10-13 5-16 5-22Z" fill="url(#neck)" opacity=".9" />
              <g class="pghead">
                <circle cx="15" cy="-30" r="5.8" fill="#a9b3c7" />
                <circle cx="17" cy="-31" r="1.5" fill="#f6a23a" /><circle cx="17.3" cy="-31" r=".7" fill="#111" />
                <path d="M20.4-30.8 26-29 20.4-27.4Z" fill="#3b3434" /><circle cx="20.6" cy="-30.6" r="1" fill="#eee" />
              </g>
              <g id="wingFold"><path d="M-9-18C0-22 8-18 8-12 2-8-8-8-15-9Z" fill="#8995ac" /><path d="M-6-14h9M-8-11h8" stroke="#3f4658" stroke-width="1.3" stroke-linecap="round" /></g>
              <g id="wingNear" opacity="0"><path d="M0-18C-6-30-20-40-38-42-30-34-24-26-18-20-12-16-6-15 0-16Z" fill="#8995ac" /><path d="M-20-30-31-37M-16-25-27-30" stroke="#3f4658" stroke-width="1.2" stroke-linecap="round" /></g>
            </g>
            <path d="M-3-5-4 0M3-5 4 0" stroke="#e7747a" stroke-width="1.8" stroke-linecap="round" />

        <div class="note" id="note" aria-hidden="true"><b><i id="noteAv"></i><span id="noteWho"></span></b><p id="noteText"></p><small id="noteTime"></small></div>
      </div>

      <div class="compose">
        <div class="row"><span class="lbl" id="toLbl">Send to</span><div class="to" id="to" role="group" aria-labelledby="toLbl"></div></div>

          <label class="sr-only" for="msg">Your note</label>
          <textarea id="msg" maxlength="80" placeholder="Write a short note for the pigeon to carry…"></textarea>
          <span class="count" id="count" aria-hidden="true">0/80</span>
        </div>
        <div class="foot">
          <p class="status" id="status" aria-live="polite">Your pigeon is resting on the roof.</p>
          <button class="send" id="send" type="button"><i class="fill" id="fill"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4C11 5 6 10 4 20" /><path d="M20 4c-1 6-5 10-12 11" /><path d="M9 11l-3-1M12 8l-2-2" /></svg><span id="sendText">Send by pigeon</span></button>
        </div>
      </div>
    </section>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

<script>
  // ---------- Pigeon Post: a carrier pigeon flies your note to a friend's roof ----------
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = "cubic-bezier(.3, 1.6, .5, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const svg = $("#svg"), pg = $("#pg"), body = $("#pgBody"), fx = $("#fx"), scene = $("#scene");
  const statusEl = $("#status");
  const say = (html) => { statusEl.innerHTML = html; };

  // ---------- Friends: each roof is at its own distance (further = smaller pigeon, longer flight) ----------
  const HOME = { x: 196, y: 222, s: 1 };
  const FRIENDS = [
    { id: "zara", name: "Zara", where: "Gulberg", km: 0.8, x: 578, y: 178, s: 0.72, ms: 1900, c: "#e0574b" },
    { id: "hamid", name: "Hamid", where: "Old City", km: 2.1, x: 396, y: 184, s: 0.5, ms: 2400, c: "#5b6fd8" },
    { id: "sana", name: "Sana", where: "Model Town", km: 4.6, x: 276, y: 164, s: 0.34, ms: 2900, c: "#1f9a73" }
  ];
  let to = FRIENDS[0];
  const pins = $("#pins");
  FRIENDS.forEach((f) => {
    // a marker over each roof
    pins.insertAdjacentHTML("beforeend",
      '<g class="pin" id="pin-' + f.id + '" transform="translate(' + f.x + " " + (f.y - 26 * f.s - 14) + ')"><g class="bub">' +
      '<path d="M0 0l-5-8h10Z" fill="' + f.c + '" /><circle cy="-16" r="11" fill="' + f.c + '" /><text y="-12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">' + f.name[0] + "</text></g></g>");
    // and a chip to pick them
    $("#to").insertAdjacentHTML("beforeend",
      '<button class="chip" type="button" data-id="' + f.id + '" aria-pressed="false"><i style="background:' + f.c + '">' + f.name[0] + "</i>" + f.name + " <small>" + f.where + " · " + f.km + " km</small></button>");
  });
  function pick(id) {
    to = FRIENDS.find((f) => f.id === id) || FRIENDS[0];
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.id === to.id)));
    FRIENDS.forEach((f) => $("#pin-" + f.id).classList.toggle("on", f === to));
  }
  $("#to").addEventListener("click", (e) => {
    const c = e.target.closest(".chip");
    if (!c || busy) return;
    pick(c.dataset.id);
    say("Sending to <b>" + to.name + "</b> in " + to.where + ", " + to.km + " km away.");
  });

  // ---------- Note field ----------
  const msg = $("#msg");
  const count = () => { $("#count").textContent = msg.value.length + "/80"; };
  msg.addEventListener("input", count);
  msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });

  // ---------- Drawing the pigeon ----------
  let pose = { x: HOME.x, y: HOME.y, s: 1, a: 0, f: 1 };
  function setPg(x, y, s, a, f) {
    pose = { x, y, s, a, f };
    pg.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") scale(" + (f * s).toFixed(3) + " " + s.toFixed(3) + ") rotate(" + a.toFixed(1) + ")");
  }
  function wings(open) {
    $("#wingFold").setAttribute("opacity", open ? "0" : "1");
    $("#wingNear").setAttribute("opacity", open ? "1" : "0");
    $("#wingFar").setAttribute("opacity", open ? "1" : "0");
  }
  function flapTo(near, far) {
    $("#wingNear").setAttribute("transform", "rotate(" + near.toFixed(1) + " 0 -18)");
    $("#wingFar").setAttribute("transform", "rotate(" + far.toFixed(1) + " 0 -18)");
  }
  function toScreen(x, y) { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; const p = pt.matrixTransform(svg.getScreenCTM()); return [p.x, p.y]; }
  const qb = (a, b, c, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
  const qd = (a, b, c, t) => 2 * (1 - t) * (b - a) + 2 * t * (c - b);
  const easeIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

  // One flight along an arc: wings beat fast on take-off, glide at the top, flare to land.
  // The far skyline drifts a little against the flight for depth.
  function fly(from, dest, dur, onProgress) {
    if (calm()) { setPg(dest.x, dest.y, dest.s, 0, 1); onProgress && onProgress(1); return Promise.resolve(); }
    scene.classList.add("flying");
    wings(true);
    const f = dest.x >= from.x ? 1 : -1;
    const cx = (from.x + dest.x) / 2, cy = Math.min(from.y, dest.y) - 110 - Math.abs(dest.x - from.x) * 0.08;
    const far = $("#layerFar"), mid = $("#layerMid");
    return new Promise((res) => {
      const t0 = performance.now();
      let lastFeather = 0;
      const frame = (now) => {
        const p = Math.min(1, Math.max(0, now - t0) / dur), e = easeIO(p);
        const x = qb(from.x, cx, dest.x, e), y = qb(from.y, cy, dest.y, e);
        const dx = qd(from.x, cx, dest.x, e) * f, dy = qd(from.y, cy, dest.y, e);
        const a = Math.max(-26, Math.min(26, (Math.atan2(dy, dx) * 180) / Math.PI * 0.5));
        setPg(x, y, from.s + (dest.s - from.s) * e, p > 0.88 ? -18 * ((p - 0.88) / 0.12) + a * (1 - (p - 0.88) / 0.12) : a, f);
        // wing beat: strong at both ends, a glide near the top of the arc
        const glide = p > 0.4 && p < 0.62;
        const amp = glide ? 9 : p > 0.88 ? 30 : 48;
        const w = Math.sin((now / 1000) * Math.PI * 2 * (glide ? 2 : 7.5)) * amp;
        flapTo(-8 + w, -16 + w * 0.8);
        const drift = Math.sin(Math.PI * p) * 8 * f;
        far.setAttribute("transform", "translate(" + (-drift * 0.6).toFixed(1) + " 0)");
        mid.setAttribute("transform", "translate(" + (-drift * 1.1).toFixed(1) + " 0)");
        onProgress && onProgress(p);
        if (p < 0.3 && now - lastFeather > 260) { lastFeather = now; feather(); }
        if (p < 1) requestAnimationFrame(frame);
        else { far.removeAttribute("transform"); mid.removeAttribute("transform"); wings(false); scene.classList.remove("flying"); res(); }
      };
      requestAnimationFrame(frame);
    });
  }

  // ---------- Little effects ----------
  function feather() {
    if (calm()) return;
    const [x, y] = toScreen(pose.x - 6 * pose.f, pose.y - 16 * pose.s);
    const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    el.setAttribute("viewBox", "0 0 10 20"); el.setAttribute("width", "9"); el.setAttribute("height", "18"); el.setAttribute("class", "feather");
    el.innerHTML = '<path d="M5 0C9 5 9 13 5 20 1 13 1 5 5 0Z" fill="#c9d0de" /><path d="M5 2v18" stroke="#8995ac" stroke-width=".8" />';
    fx.appendChild(el);
    const sway = (Math.random() - 0.5) * 60;
    el.animate([
      { transform: "translate(" + x + "px," + y + "px) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + (x + sway) + "px," + (y + 40) + "px) rotate(" + (sway * 2) + "deg)", opacity: 1, offset: 0.5 },
      { transform: "translate(" + (x - sway * 0.4) + "px," + (y + 90) + "px) rotate(" + (-sway) + "deg)", opacity: 0 }
    ], { duration: 1700 + Math.random() * 600, easing: "ease-in-out" }).onfinish = () => el.remove();
  }
  function sparkle(x, y, colors) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("i");
      s.className = "spark";
      s.style.background = colors[i % colors.length];
      fx.appendChild(s);
      const a = (i / 14) * Math.PI * 2 + Math.random() * 0.3, d = 30 + Math.random() * 34;
      s.animate([{ transform: "translate(" + x + "px," + y + "px) scale(.4)", opacity: 1 }, { transform: "translate(" + (x + Math.cos(a) * d) + "px," + (y + Math.sin(a) * d + 10) + "px) scale(1)", opacity: 0 }], { duration: 750 + Math.random() * 250, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }
  // the note leaves the text box, rolls up and flies to the pigeon's leg
  async function rollNote(text) {
    if (calm()) return;
    const r = msg.getBoundingClientRect();
    const p = document.createElement("div");
    p.className = "paper";
    p.textContent = text;
    p.style.maxWidth = Math.min(r.width - 20, 300) + "px";
    fx.appendChild(p);
    const [tx, ty] = toScreen(pose.x, pose.y - 7);
    const sx = r.left + 10, sy = r.top + 8;
    await p.animate([
      { transform: "translate(" + sx + "px," + sy + "px) scale(1)", opacity: 0.2 },
      { transform: "translate(" + sx + "px," + (sy - 12) + "px) scale(1.04)", opacity: 1, offset: 0.18 },
      { transform: "translate(" + (sx + 10) + "px," + (sy - 18) + "px) scale(.35, .2) rotate(-6deg)", opacity: 1, offset: 0.5 },
      { transform: "translate(" + (tx - 6) + "px," + (ty - 3) + "px) scale(.06, .05)", opacity: 0.9 }
    ], { duration: 950, easing: "cubic-bezier(.5,0,.3,1)" }).finished.catch(() => {});
    p.remove();
  }

  // the delivered note bubble, kept inside the scene
  function showNote(f, text) {
    const n = $("#note"), sr = scene.getBoundingClientRect();
    $("#noteAv").style.background = f.c; $("#noteAv").textContent = f.name[0];
    $("#noteWho").textContent = f.name + " got your note";
    $("#noteText").textContent = text;
    $("#noteTime").textContent = "Read at " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const [px, py] = toScreen(f.x, f.y - 30 * f.s - 34);
    const w = n.offsetWidth, h = n.offsetHeight;
    const left = Math.max(8, Math.min(sr.width - w - 8, px - sr.left - w / 2));
    const top = Math.max(6, py - sr.top - h);
    n.style.transform = "translate(" + left + "px," + top + "px)";
    n.style.opacity = "1";
    play(n, [{ opacity: 0, transform: "translate(" + left + "px," + (top + 14) + "px) scale(.6)" }, { opacity: 1, transform: "translate(" + left + "px," + top + "px) scale(1.04)", offset: 0.6 }, { opacity: 1, transform: "translate(" + left + "px," + top + "px) scale(1)" }], { duration: 560, easing: "ease-out" });
  }
  function hideNote() {
    const n = $("#note");
    if (n.style.opacity !== "1") return;
    const t = n.style.transform;
    play(n, [{ opacity: 1, transform: t }, { opacity: 0, transform: t + " translateY(-10px)" }], { duration: 320 }).then(() => { n.style.opacity = "0"; });
  }

  // ---------- Send: tie the note, take off, fly, land, deliver, fly home ----------
  let busy = false, delivered = 0;
  const btn = $("#send"), fill = $("#fill"), sendText = $("#sendText");
  btn.addEventListener("click", () => send());
  async function send(demo) {
    if (busy) return;
    const text = msg.value.trim();
    if (!text) {
      const fld = $("#field");
      fld.classList.remove("shake"); void fld.offsetWidth; fld.classList.add("shake");
      play($("#pgBody"), [{ transform: "rotate(0)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(0)" }], { duration: 500 });
      say("Write a note first, the pigeon will not fly with an empty leg.");
      if (!demo) msg.focus();
      return;
    }
    busy = true;
    const f = to;
    btn.setAttribute("aria-disabled", "true");
    hideNote();
    // 1. Anticipation: the note rolls onto the pigeon's leg, it crouches
    sendText.textContent = "Tying note…";
    say("Tying your note to the pigeon's leg…");
    await rollNote(text);
    $("#scroll").setAttribute("opacity", "1");
    play($("#scroll"), [{ transform: "scale(0)" }, { transform: "scale(1.5)" }, { transform: "scale(1)" }], { duration: 420, easing: SPRING });
    msg.value = ""; count();
    await play(body, [{ transform: "none" }, { transform: "translateY(3px) scale(1.08, .86)" }], { duration: 300, easing: "ease-in", fill: "forwards" });
    body.getAnimations().forEach((a) => a.cancel());
    // 2. Main: take off and fly the arc to the friend's roof
    sendText.textContent = "In flight…";
    let lastKm = -1;
    await fly(HOME, f, f.ms, (p) => {
      fill.style.width = (p * 100).toFixed(1) + "%";
      const km = Math.max(0, f.km * (1 - p)).toFixed(1);
      if (km !== lastKm) { lastKm = km; say("In flight to <b>" + f.name + "</b> · " + km + " km to go"); }
    });
    // 3. Finish: land with a little squash, the note pops up over the roof
    play(body, [{ transform: "scale(1.12, .84)" }, { transform: "scale(.95, 1.06)", offset: 0.5 }, { transform: "none" }], { duration: 480, easing: "ease-out" });
    $("#scroll").setAttribute("opacity", "0");
    const [sx, sy] = toScreen(f.x, f.y - 14 * f.s);
    sparkle(sx, sy, [f.c, "#ffd36b", "#fff"]);
    showNote(f, text);
    delivered++;
    btn.classList.add("done"); fill.style.width = "0";
    sendText.textContent = "Delivered";
    say("Delivered to <b>" + f.name + "</b> in " + f.where + ". " + delivered + (delivered === 1 ? " note" : " notes") + " sent today.");
    await wait(1900);
    // 4. Reset: the pigeon flies home, the bubble fades
    sendText.textContent = "Flying home…";
    hideNote();
    await fly(f, HOME, Math.max(1300, f.ms * 0.7));
    play(body, [{ transform: "scale(1.1, .88)" }, { transform: "none" }], { duration: 360, easing: "ease-out" });
    btn.classList.remove("done"); btn.removeAttribute("aria-disabled");
    sendText.textContent = "Send by pigeon";
    say("Your pigeon is back on the roof. Write another note?");
    busy = false;
    if (demoOn) queueDemo(2600);
  }

  // ---------- Auto-demo: type a note, pick a friend, send ----------
  const NOTES = ["Chai on the roof at six?", "Kite match tomorrow, bring the blue one!", "Got the Eid sweets, they were lovely", "Power is back, come over for the match"];
  let demoOn = true, demoTimer = 0, round = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demoOn || busy) return;
    pick(FRIENDS[round % FRIENDS.length].id);
    const text = NOTES[round % NOTES.length];
    round++;
    msg.value = "";
    for (let i = 1; i <= text.length; i++) {
      if (!demoOn) return;
      msg.value = text.slice(0, i); count();
      await wait(calm() ? 0 : 28);
    }
    await wait(350);
    if (demoOn) send(true);
  }

  // ---------- Start ----------
  pick("zara");
  setPg(HOME.x, HOME.y, 1, 0, 1);
  count();
  queueDemo(700);
</script>
</body>
</html>
