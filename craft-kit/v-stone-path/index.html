<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone Path · stepping stone breadcrumbs</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: river teal, sand banks, pebble grey and moss ---------- */
  :root {
    color-scheme: light;
    --bg1: #f4ecdc;
    --bg2: #dfe9e2;
    --card: #fffcf5;
    --line: #ebe2d0;
    --ink: #1f2e2d;
    --ink2: #566563;
    --soft: #8d9a97;
    --sand: #e9dcc0;
    --sand2: #d8c7a4;
    --water1: #7cc9c4;
    --water2: #3f9ea3;
    --water3: #2d8088;
    --shine: rgba(255, 255, 255, .55);
    --stone1: #d8d2c6;
    --stone2: #a59d90;
    --stone-ink: #2a2a26;
    --moss1: #b9d58e;
    --moss2: #6f9a4f;
    --row: #f7f1e5;
    --accent: #2d8088;
    --focus: #e0743a;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #0f1c1f;
    --bg2: #070d0f;
    --card: #121d20;
    --line: #213034;
    --ink: #e5efed;
    --ink2: #a9bab7;
    --soft: #6f8481;
    --sand: #1e2a28;
    --sand2: #2a3633;
    --water1: #1d4c57;
    --water2: #123844;
    --water3: #0c2a33;
    --shine: rgba(190, 230, 255, .35);
    --stone1: #78808a;
    --stone2: #4b525b;
    --stone-ink: #f1f4f6;
    --moss1: #86b062;
    --moss2: #4d7535;
    --row: #172529;
    --accent: #5cc2c0;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background: radial-gradient(90% 80% at 20% 0%, var(--bg1), transparent 70%), radial-gradient(90% 90% at 100% 100%, var(--bg2), transparent 70%), var(--bg1);
    overflow-x: hidden;
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; }
  .card { position: relative; width: min(980px, 100%); border-radius: 24px; background: var(--card); box-shadow: 0 40px 90px -55px rgba(20, 60, 60, .7), 0 0 0 1px var(--line); overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; border-radius: 12px; }

  /* ---------- Header ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 22px 14px; }
  .logo { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(140deg, var(--water1), var(--water3)); }
  .logo svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .title b { display: block; font-size: 16px; }
  .title small { color: var(--soft); font-size: 12.5px; }
  .upbtn {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    padding: 9px 14px;
    border: 0; border-radius: 11px; cursor: pointer;
    background: var(--row); color: var(--ink);
    font-size: 13.5px; font-weight: 600;
    box-shadow: 0 0 0 1px var(--line);
    transition: transform .35s var(--spring), opacity .2s;
  }
  .upbtn:hover:not(:disabled) { transform: translateY(-2px); }
  .upbtn:disabled { opacity: .45; cursor: default; }
  .upbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- The river and its stones ---------- */
  .river { position: relative; height: 116px; overflow: hidden; }
  .water { position: absolute; inset: 0; width: 100%; height: 100%; }
  .w1 { stop-color: var(--water1); } .w2 { stop-color: var(--water2); } .w3 { stop-color: var(--water3); }
  .bank { fill: var(--sand); }
  .bank2 { fill: var(--sand2); }
  .pebble { fill: var(--stone2); opacity: .5; }
  .glints { animation: flow 7s linear infinite; }
  .glints path { fill: none; stroke: var(--shine); stroke-width: 2; stroke-linecap: round; }
  .glints.b { animation-duration: 11s; opacity: .6; }
  @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  .leaf { animation: leaf 26s linear infinite; }
  .leaf path { fill: var(--moss2); }
  @keyframes leaf { from { transform: translate(-60px, 0) rotate(0deg); } 50% { transform: translate(50vw, 6px) rotate(160deg); } to { transform: translate(110vw, -2px) rotate(330deg); } }
  .crumbs { position: absolute; inset: 0; display: flex; align-items: center; gap: 24px; margin: 0; padding: 0 22px; list-style: none; }
  .crumbs li { position: relative; flex: none; }
  .stone {
    position: relative;
    display: block; max-width: 180px;
    padding: 14px 23px 15px;
    border: 0; cursor: pointer;
    border-radius: 46% 54% 42% 58% / 58% 46% 54% 42%;
    background:
      radial-gradient(70% 55% at 35% 25%, rgba(255, 255, 255, .5), transparent 70%),
      linear-gradient(170deg, var(--stone1), var(--stone2));
    color: var(--stone-ink);
    font-size: 15px; font-weight: 650; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 7px 0 -2px rgba(0, 0, 0, .14), 0 12px 16px -8px rgba(0, 30, 40, .55), inset 0 -3px 0 rgba(0, 0, 0, .12);
    transition: transform .4s var(--spring), filter .2s;
  }
  .crumbs li:nth-child(3n + 2) .stone { border-radius: 58% 42% 55% 45% / 45% 58% 42% 55%; }
  .crumbs li:nth-child(3n) .stone { border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%; }
  .stone:hover { transform: translateY(-3px) rotate(-1.5deg); }
  .stone:active { transform: translateY(2px) scale(.96); }
  .stone[aria-current="page"] {
    background:
      radial-gradient(60% 45% at 30% 20%, var(--moss1), transparent 75%),
      radial-gradient(70% 55% at 35% 25%, rgba(255, 255, 255, .45), transparent 70%),
      linear-gradient(170deg, var(--stone1), var(--stone2));
    box-shadow: 0 7px 0 -2px rgba(0, 0, 0, .14), 0 12px 16px -8px rgba(0, 30, 40, .55), inset 0 -3px 0 rgba(0, 0, 0, .12), 0 0 0 3px color-mix(in srgb, var(--moss1) 60%, transparent);
    cursor: default;
  }
  .stone.more { padding: 11px 14px 12px; letter-spacing: .1em; }
  /* little gaps of water between the stones */
  .crumbs li + li::before { content: ""; position: absolute; left: -17px; top: 50%; width: 10px; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--shine); opacity: .7; }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .ring { position: absolute; width: 60px; height: 18px; margin: -9px 0 0 -30px; border-radius: 50%; border: 2px solid var(--shine); }
  .drop { position: absolute; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--shine); }
  .bub { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; border: 1.5px solid var(--shine); }
  .shadow { position: absolute; width: 70px; height: 16px; margin: -8px 0 0 -35px; border-radius: 50%; background: rgba(0, 20, 30, .35); filter: blur(3px); }
  .menu {
    position: absolute; z-index: 5; top: 84px; left: 60px;
    min-width: 200px; padding: 6px;
    border-radius: 14px; background: var(--card);
    box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .5), 0 0 0 1px var(--line);
    transform-origin: top left;
    animation: menuIn .35s var(--spring);
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-8px) scale(.94); } }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-size: 14px; text-align: left; }
  .menu button:hover, .menu button:focus-visible { background: var(--row); }
  .menu i { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(170deg, var(--stone1), var(--stone2)); }

  /* ---------- Folder listing ---------- */
  .list { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; align-content: start; min-height: 330px; margin: 0; padding: 18px 22px 24px; list-style: none; }
  .item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 14px;
    border: 0; border-radius: 16px; cursor: pointer; text-align: left;
    background: var(--row);
    box-shadow: 0 0 0 1px var(--line);
    transition: transform .35s var(--spring), box-shadow .2s;
  }
  .item:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px var(--line), 0 14px 22px -16px rgba(0, 40, 50, .6); }
  .item.press { transform: scale(.96); box-shadow: 0 0 0 2px var(--accent); }
  .item svg { flex: none; width: 40px; height: 40px; }
  .item b { display: block; font-size: 14.5px; font-weight: 650; }
  .item small { color: var(--soft); font-size: 12.5px; }
  .ext { font: 800 6.5px/1 var(--sans); fill: #fff; letter-spacing: .02em; }
  .body { display: grid; grid-template-columns: 1fr 284px; align-items: start; }
  .info { margin: 18px 22px 24px 0; padding: 18px; border-radius: 18px; background: linear-gradient(160deg, color-mix(in srgb, var(--fc, #3f9ea3) 16%, var(--card)), var(--row)); box-shadow: 0 0 0 1px var(--line); }
  .info svg { width: 60px; height: 60px; }
  .info h2 { margin: 8px 0 2px; font-size: 19px; letter-spacing: -.01em; }
  .ipath { margin: 0; color: var(--soft); font-size: 12.5px; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
  .stats div { padding: 9px 4px; border-radius: 12px; background: var(--card); text-align: center; box-shadow: 0 0 0 1px var(--line); }
  .stats dt { color: var(--soft); font-size: 11px; }
  .stats dd { margin: 3px 0 0; font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .share { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .share span { display: block; height: 100%; width: var(--w); border-radius: 4px; background: linear-gradient(90deg, var(--water1), var(--accent)); transition: width .9s var(--spring); }
  .info small { display: block; margin-top: 6px; color: var(--soft); font-size: 12px; }
  .info .big { margin: 12px 0 0; color: var(--ink2); font-size: 12.5px; line-height: 1.45; }
  .empty { grid-column: 1 / -1; color: var(--soft); font-size: 14px; padding: 30px 0; text-align: center; }
  .toast {
    position: absolute; left: 50%; bottom: 16px; z-index: 6;
    padding: 10px 16px; border-radius: 999px;
    background: var(--ink); color: var(--card);
    font-size: 13.5px; white-space: nowrap;
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    transition: transform .5s var(--spring), opacity .3s;
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }

  @media (max-width: 760px) {
    .body { grid-template-columns: 1fr; }
    .info { display: none; }
  }
  @media (max-width: 640px) {
    .stage { padding: 16px 10px; }
    .top { padding: 14px 14px 10px; }
    .upbtn span { display: none; }
    .river { height: 92px; }
    .crumbs { gap: 18px; padding: 0 14px; }
    .crumbs li + li::before { left: -13px; width: 8px; }
    .stone { max-width: 116px; padding: 10px 14px 11px; font-size: 13px; }
    .list { grid-template-columns: 1fr; gap: 8px; padding: 14px 14px 20px; min-height: 400px; }
    .item { padding: 10px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="card" id="card">
    <div class="top">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15c3-3 6 3 9 0s6 3 9 0M3 10c3-3 6 3 9 0s6 3 9 0"/></svg></span>
      <span class="title"><b>Brookside Drive</b><small id="count">5 items</small></span>
      <button class="upbtn" id="up" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>Up one level</span></button>
    </div>
    <div class="river" id="river">
      <svg class="water" preserveAspectRatio="none" viewBox="0 0 1000 104" aria-hidden="true">
        <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="w1"/><stop offset=".55" class="w2"/><stop offset="1" class="w3"/></linearGradient></defs>
        <rect width="1000" height="104" fill="url(#wg)"/>
        <g class="glints"><path d="M40 40h30M190 64h22M330 30h40M470 72h26M610 44h34M760 66h22M900 34h30M1040 40h30M1190 64h22"/></g>
        <g class="glints b"><path d="M110 56h18M260 38h26M420 58h16M560 30h22M700 56h28M850 48h18M1110 56h18M1260 38h26"/></g>
        <path class="bank2" d="M0 0h1000v14c-60 8-120-4-190 2s-130 10-200 2-150-6-220 2-140 6-200-2-120-4-190 2z"/>
        <path class="bank" d="M0 0h1000v9c-70 6-140-2-210 2s-150 6-220 0-150-4-230 2-130 2-200-2-80 0-140 2z"/>
        <path class="bank2" d="M0 104h1000v-14c-80-6-150 4-220 0s-120-8-200-2-160 8-230 2-110-6-180 0-120 4-170-2z"/>
        <path class="bank" d="M0 104h1000v-8c-60-4-130 4-200 0s-150-6-230 0-140 4-210 0-150-4-210 0-100 2-150 0z"/>
        <ellipse class="pebble" cx="120" cy="99" rx="7" ry="3"/><ellipse class="pebble" cx="560" cy="5" rx="9" ry="3"/><ellipse class="pebble" cx="860" cy="100" rx="6" ry="2.5"/>
      </svg>
      <svg class="water" style="pointer-events:none" aria-hidden="true"><g class="leaf"><path d="M0 50c6-8 16-8 22 0-6 8-16 8-22 0z" transform="translate(0 4)"/></g></svg>
      <nav aria-label="Breadcrumb"><ol class="crumbs" id="crumbs"></ol></nav>
      <div class="fx" id="fx"></div>
    </div>
    <div class="body"><ul class="list" id="list" aria-label="Folder contents"></ul><aside class="info" id="info" aria-label="Folder details"></aside></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------- The folder tree (f = file) ----------
  const f = (n, s) => ({ n, s });
  const TREE = { n: "Home", k: [
    { n: "Clients", k: [
      { n: "Karachi", k: [
        { n: "Al-Noor Traders", k: [
          { n: "Invoices", k: [
            { n: "2026", k: [f("INV-0141.pdf", "248 KB"), f("INV-0142.pdf", "251 KB"), f("Payment receipt.jpg", "1.2 MB")] },
            { n: "2025", k: [f("INV-0098.pdf", "240 KB"), f("Year summary.xlsx", "96 KB")] },
            f("Rates 2026.pdf", "120 KB")] },
          { n: "Contracts", k: [f("Supply agreement.pdf", "860 KB")] },
          f("Logo.png", "64 KB")] },
        { n: "Mehran Foods", k: [f("Order list.xlsx", "44 KB")] },
        f("Visit notes.docx", "32 KB")] },
      { n: "Lahore", k: [{ n: "Gulberg Bakers", k: [f("Quote.pdf", "180 KB")] }, f("Route plan.pdf", "410 KB")] },
      f("Client list.xlsx", "72 KB")] },
    { n: "Photos", k: [
      { n: "Hunza trip", k: [f("Attabad Lake.jpg", "4.1 MB"), f("Passu cones.jpg", "3.8 MB"), f("Karimabad at night.jpg", "2.9 MB")] },
      { n: "Family", k: [f("Eid lunch.jpg", "3.2 MB")] }] },
    { n: "Projects", k: [{ n: "Website", k: [{ n: "Drafts", k: [f("Home page v3.fig", "12 MB")] }, f("Brief.pdf", "220 KB")] }] },
    f("Taxes 2026.xlsx", "88 KB"), f("Notes.txt", "4 KB")] };

  const crumbs = $("crumbs"), list = $("list"), fx = $("fx"), river = $("river"), live = $("live"), toast = $("toast"), up = $("up"), count = $("count");
  let path = [TREE];
  let busy = false;

  // ---------- Icons ----------
  const FOLDER_C = ["#e3a33b", "#3f9ea3", "#e0743a", "#8f74d6", "#5d9a52"];
  const EXT_C = { pdf: "#d6453b", jpg: "#8f5bd6", png: "#2d9c9c", xlsx: "#2f8f4e", docx: "#3b6fd6", txt: "#7b8794", fig: "#d64f9a" };
  function folderSvg(c) {
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 11a3 3 0 0 1 3-3h8l3 3h15a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="${c}"/><path d="M4 15h32v14a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="${c}" opacity=".75"/><path d="M4 15h32" stroke="#fff" stroke-opacity=".35"/></svg>`;
  }
  function fileSvg(name) {
    const ext = name.split(".").pop().toLowerCase(), c = EXT_C[ext] || "#7b8794";
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 4h15l8 8v22a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff" stroke="#d9d2c4"/><path d="M24 4v8h8" fill="#ece6da" stroke="#d9d2c4"/><rect x="4" y="21" width="22" height="10" rx="2.5" fill="${c}"/><text class="ext" x="15" y="28.4" text-anchor="middle">${ext.toUpperCase()}</text></svg>`;
  }

  // ---------- Stones ----------
  function stoneEls() { return [...crumbs.querySelectorAll("li")]; }
  function renderStones() {
    crumbs.innerHTML = path.map((node, k) => {
      const last = k === path.length - 1;
      return `<li data-k="${k}"><button class="stone" type="button" ${last ? 'aria-current="page"' : ""} title="${node.n}">${node.n}</button></li>`;
    }).join("");
    stoneEls().forEach((li) => li.querySelector("button").addEventListener("click", () => {
      const k = +li.dataset.k;
      if (k < path.length - 1) goTo(k);
    }));
    fit();
  }
  // When the stones do not fit across the river, the middle ones are tucked into a "…" stone with a menu.
  let menu = null;
  function fit() {
    closeMenu();
    const lis = stoneEls();
    lis.forEach((li) => (li.hidden = false));
    const old = crumbs.querySelector(".more-li");
    if (old) old.remove();
    const over = (extra) => crumbs.scrollWidth + extra > crumbs.clientWidth;
    if (!over(0) || lis.length < 3) return;
    const hidden = [];
    // hide from the second stone onwards, leaving room for the "…" stone, until the rest fit
    for (let k = 1; k < lis.length - 1 && over(84); k++) { lis[k].hidden = true; hidden.push(k); }
    const li = document.createElement("li");
    li.className = "more-li";
    li.innerHTML = `<button class="stone more" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Show ${hidden.length} hidden folder${hidden.length > 1 ? "s" : ""}">…</button>`;
    lis[0].after(li);
    const b = li.querySelector("button");
    b.addEventListener("click", (e) => { e.stopPropagation(); menu ? closeMenu() : openMenu(b, hidden); });
  }
  function openMenu(btn, hidden) {
    menu = document.createElement("div");
    menu.className = "menu"; menu.setAttribute("role", "menu");
    menu.innerHTML = hidden.map((k) => `<button type="button" role="menuitem" data-k="${k}"><i aria-hidden="true"></i>${path[k].n}</button>`).join("");
    const r = btn.getBoundingClientRect(), c = $("card").getBoundingClientRect();
    menu.style.left = r.left - c.left + "px";
    menu.style.top = r.bottom - c.top + 10 + "px";
    $("card").appendChild(menu);
    btn.setAttribute("aria-expanded", "true");
    menu.querySelectorAll("button").forEach((m) => m.addEventListener("click", () => { closeMenu(); goTo(+m.dataset.k); }));
    menu.querySelector("button").focus();
  }
  function closeMenu() {
    if (!menu) return;
    menu.remove(); menu = null;
    const b = crumbs.querySelector(".more");
    if (b) b.setAttribute("aria-expanded", "false");
  }
  document.addEventListener("click", (e) => { if (menu && !menu.contains(e.target)) closeMenu(); });

  // ---------- Water effects ----------
  function at(el) {
    const r = el.getBoundingClientRect(), v = river.getBoundingClientRect();
    return { x: r.left - v.left + r.width / 2, y: r.top - v.top + r.height / 2, w: r.width, h: r.height };
  }
  function addFx(cls, x, y) { const d = document.createElement("i"); d.className = cls; d.style.left = x + "px"; d.style.top = y + "px"; fx.appendChild(d); return d; }
  function rings(x, y, n = 2, w = 1) {
    for (let k = 0; k < n; k++) {
      const r = addFx("ring", x, y);
      r.animate([{ transform: `scale(${.4 * w})`, opacity: .9 }, { transform: `scale(${2.3 * w})`, opacity: 0 }], { duration: 900 + k * 250, delay: k * 140, easing: "cubic-bezier(.2,.7,.3,1)", fill: "both" }).onfinish = () => r.remove();
    }
  }
  function splash(x, y) {
    rings(x, y + 10, 3, 1.3);
    for (let k = 0; k < 9; k++) {
      const d = addFx("drop", x + (Math.random() - .5) * 30, y + 8);
      const dx = (Math.random() - .5) * 90, h = 20 + Math.random() * 30;
      d.animate([
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: `translate(${dx * .55}px, ${-h}px) scale(1)`, opacity: 1, offset: .45 },
        { transform: `translate(${dx}px, 10px) scale(.5)`, opacity: 0 },
      ], { duration: 560 + Math.random() * 200, easing: "cubic-bezier(.25,.6,.4,1)" }).onfinish = () => d.remove();
    }
  }
  function bubbles(x, y) {
    rings(x, y + 6, 1, .9);
    for (let k = 0; k < 5; k++) {
      const b = addFx("bub", x + (Math.random() - .5) * 40, y + 10);
      b.animate([{ transform: "translateY(0) scale(.5)", opacity: 0 }, { transform: "translateY(-10px) scale(1)", opacity: .9, offset: .3 }, { transform: `translate(${(Math.random() - .5) * 10}px, -30px) scale(1.2)`, opacity: 0 }],
        { duration: 700 + Math.random() * 300, delay: k * 70, easing: "ease-out", fill: "both" }).onfinish = () => b.remove();
    }
  }

  // ---------- Listing ----------
  let toastT = 0;
  function note(t) { toast.textContent = t; toast.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove("on"), 1900); }
  function renderList(dir) {
    const node = path[path.length - 1], kids = node.k;
    const folders = kids.filter((x) => x.k).length;
    count.textContent = `${kids.length} item${kids.length === 1 ? "" : "s"}${folders ? ` · ${folders} folder${folders === 1 ? "" : "s"}` : ""}`;
    up.disabled = path.length === 1;
    renderInfo(dir);
    list.innerHTML = kids.length ? kids.map((x, i) => x.k
      ? `<li><button class="item" type="button" data-i="${i}">${folderSvg(FOLDER_C[(path.length + i) % FOLDER_C.length])}<span><b>${x.n}</b><small>${x.k.length} item${x.k.length === 1 ? "" : "s"}</small></span></button></li>`
      : `<li><button class="item" type="button" data-i="${i}">${fileSvg(x.n)}<span><b>${x.n}</b><small>${x.s}</small></span></button></li>`).join("")
      : `<li class="empty">This folder is empty</li>`;
    list.querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => {
      const x = kids[+b.dataset.i];
      if (x.k) goDeeper(x); else note(`${x.n} · ${x.s} · preview opened`);
    }));
    if (reduce) return;
    [...list.children].forEach((li, k) => li.animate([{ opacity: 0, transform: `translateY(${dir > 0 ? 18 : -14}px) scale(.97)` }, { opacity: 1, transform: "none" }],
      { duration: 520, delay: 60 + k * 45, easing: "cubic-bezier(.3,1.35,.5,1)", fill: "backwards" }));
  }
  async function leaveList() {
    if (reduce) return;
    const a = [...list.children].map((li, k) => li.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(8px) scale(.98)" }], { duration: 170, delay: k * 18, easing: "ease-in", fill: "forwards" }));
    await sleep(170 + a.length * 18);
  }
  // ---------- Details of the current folder: counted through every folder inside it ----------
  const bytes = (s) => { const m = /([\d.]+)\s*(KB|MB)/.exec(s || ""); return m ? parseFloat(m[1]) * (m[2] === "MB" ? 1048576 : 1024) : 0; };
  const fmt = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB");
  function tally(node) {
    const t = { folders: 0, files: 0, size: 0, big: null };
    for (const x of node.k) {
      if (x.k) { const u = tally(x); t.folders += 1 + u.folders; t.files += u.files; t.size += u.size; if (u.big && (!t.big || bytes(u.big.s) > bytes(t.big.s))) t.big = u.big; }
      else { t.files++; t.size += bytes(x.s); if (!t.big || bytes(x.s) > bytes(t.big.s)) t.big = x; }
    }
    return t;
  }
  const TOTAL = tally(TREE).size;
  function renderInfo(dir) {
    const info = $("info"), node = path[path.length - 1], t = tally(node);
    let c = "#3f9ea3";
    if (path.length > 1) { const parent = path[path.length - 2]; c = FOLDER_C[(path.length - 1 + parent.k.indexOf(node)) % FOLDER_C.length]; }
    const share = TOTAL ? Math.max(2, Math.round((t.size / TOTAL) * 100)) : 0;
    info.style.setProperty("--fc", c);
    info.innerHTML = folderSvg(c) + `<h2>${node.n}</h2><p class="ipath">${path.map((p) => p.n).join(" / ")}</p>
      <dl class="stats"><div><dt>Folders</dt><dd>${t.folders}</dd></div><div><dt>Files</dt><dd>${t.files}</dd></div><div><dt>Size</dt><dd>${fmt(t.size)}</dd></div></dl>
      <div class="share"><span style="--w:0%"></span></div><small>${share}% of Brookside Drive</small>
      <p class="big">${t.big ? `Largest file inside: <b>${t.big.n}</b>, ${t.big.s}` : "No files here yet"}</p>`;
    requestAnimationFrame(() => requestAnimationFrame(() => { const b = info.querySelector(".share span"); if (b) b.style.setProperty("--w", share + "%"); }));
    if (!reduce) info.animate([{ opacity: 0, transform: `translateX(${dir > 0 ? 18 : -18}px)` }, { opacity: 1, transform: "none" }], { duration: 520, delay: 120, easing: "cubic-bezier(.3,1.3,.5,1)", fill: "backwards" });
  }

  function announce() {
    live.textContent = `Now in ${path.map((p) => p.n).join(", ")}. ${count.textContent}.`;
  }

  // ---------- Going deeper: a new stone is dropped in with a splash ----------
  async function goDeeper(node) {
    if (busy) return;
    busy = true;
    path.push(node);
    await leaveList();
    renderStones();
    const lis = stoneEls(), li = lis[lis.length - 1], st = li.querySelector(".stone");
    renderList(1);
    announce();
    if (!reduce) {
      const p = at(st);
      // anticipation: a shadow gathers on the water where the stone will land
      const sh = addFx("shadow", p.x, p.y + 14);
      sh.animate([{ transform: "scale(.3)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 300, easing: "ease-out", fill: "forwards" });
      st.animate([
        { transform: "translateY(-80px) rotate(-14deg) scale(.9)", opacity: 0, offset: 0 },
        { transform: "translateY(-80px) rotate(-14deg) scale(.9)", opacity: 1, offset: .3 },
        { transform: "translateY(5px) rotate(3deg) scale(1.06, .9)", offset: .62, easing: "cubic-bezier(.3,1.5,.5,1)" },
        { transform: "translateY(-4px) rotate(-1deg) scale(.98, 1.03)", offset: .8 },
        { transform: "none", offset: 1 },
      ], { duration: 820, easing: "cubic-bezier(.55,0,.8,.4)" });
      await sleep(820 * .62);
      sh.remove();
      splash(p.x, p.y);
      await sleep(320);
    }
    busy = false;
  }

  // ---------- Going back: the stones after the one you pick sink, last first ----------
  async function goTo(k) {
    if (busy || k >= path.length - 1) return;
    busy = true;
    closeMenu();
    const sinking = stoneEls().filter((li) => +li.dataset.k > k && !li.hidden).reverse();
    const leaving = leaveList();
    if (!reduce) {
      for (const li of sinking) {
        const st = li.querySelector(".stone"), p = at(st);
        st.animate([
          { transform: "none", opacity: 1, filter: "blur(0)" },
          { transform: "translateY(-5px) rotate(-3deg)", offset: .25 },
          { transform: "translateY(26px) rotate(6deg) scale(.8)", opacity: 0, filter: "blur(2px)" },
        ], { duration: 520, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
        setTimeout(() => bubbles(p.x, p.y), 260);
        await sleep(130);
      }
      await sleep(420);
    }
    await leaving;
    path.length = k + 1;
    renderStones();
    renderList(-1);
    announce();
    const cur = crumbs.querySelector('[aria-current="page"]');
    if (cur && !reduce) { const p = at(cur); rings(p.x, p.y + 10, 2); cur.animate([{ transform: "translateY(-6px)" }, { transform: "none" }], { duration: 500, easing: "cubic-bezier(.3,1.6,.5,1)" }); }
    busy = false;
  }

  up.addEventListener("click", () => goTo(path.length - 2));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
    if ((e.key === "Backspace" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) || (e.altKey && e.key === "ArrowLeft")) {
      if (path.length > 1) { e.preventDefault(); goTo(path.length - 2); }
    }
  });
  let rt = 0;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(fit, 100); });

  // idle: the stone you stand on sends out a slow ripple now and then
  setInterval(() => {
    if (reduce || busy || document.hidden) return;
    const cur = crumbs.querySelector('[aria-current="page"]');
    if (cur) { const p = at(cur); rings(p.x, p.y + 12, 1, 1.1); }
  }, 2600);

  // ---------- Start: the first stone lands, then a demo walk until someone takes over ----------
  renderStones();
  renderList(1);
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  async function press(name) {
    const b = [...list.querySelectorAll(".item")].find((x) => x.querySelector("b").textContent === name);
    if (!b || !demo) return false;
    b.classList.add("press");
    await sleep(260);
    b.classList.remove("press");
    if (!demo) return false;
    b.click();
    await sleep(1150);
    return demo;
  }
  (async () => {
    if (!reduce) {
      const st = crumbs.querySelector(".stone"), p = at(st);
      st.animate([{ transform: "translateY(-70px) rotate(-10deg)", opacity: 0 }, { transform: "translateY(4px) scale(1.05,.92)", opacity: 1, offset: .6 }, { transform: "none" }], { duration: 700, easing: "cubic-bezier(.5,0,.6,1)" });
      setTimeout(() => splash(p.x, p.y), 420);
    }
    await sleep(1100);
    const walks = [["Clients", "Karachi", "Al-Noor Traders", "Invoices", "2026", 1], ["Photos", "Hunza trip", 0], ["Projects", "Website", "Drafts", 0], ["Clients", "Lahore", "Gulberg Bakers", 0]];
    let w = 0;
    while (demo) {
      const walk = walks[w++ % walks.length];
      for (const step of walk) {
        if (!demo) return;
        if (typeof step === "number") { await sleep(900); if (!demo) return; await goTo(step); await sleep(1200); }
        else if (!(await press(step))) return;
      }
      if (path.length > 1) { await sleep(800); if (!demo) return; await goTo(0); await sleep(1300); }
    }
  })();
})();
</script>
</body>
</html>
