<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Back · delete with undo toast</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    color-scheme: light;
    --bg: #eef0fb;
    --blob1: #c3c6ff;
    --blob2: #ffd3e6;
    --card: #ffffff;
    --line: #e7e8f6;
    --hover: #f5f5ff;
    --ink: #1c1d3a;
    --muted: #6c6f95;
    --accent: #5b5bd6;
    --soft: #e4e3ff;
    --danger: #e5484d;
    --toast: #1d1c38;
    --toast-ink: #f3f2ff;
    --ring: #a9aaff;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0e1c;
    --blob1: #2a2b70;
    --blob2: #4b1d40;
    --card: #17182c;
    --line: #25273f;
    --hover: #1e1f38;
    --ink: #ecedfb;
    --muted: #9a9cc2;
    --accent: #8486ff;
    --soft: #2a2b55;
    --danger: #ff6369;
    --toast: #2d2e58;
    --toast-ink: #f3f2ff;
    --ring: #a9aaff;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  /* ---------- Stage with two slow colour blobs ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .blobs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; width: 440px; height: 440px; border-radius: 50%; filter: blur(80px); opacity: .6; pointer-events: none; }
  .b1 { background: var(--blob1); left: -140px; top: -160px; animation: drift1 16s ease-in-out infinite alternate; }
  .b2 { background: var(--blob2); right: -160px; bottom: -180px; animation: drift2 20s ease-in-out infinite alternate; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; width: 100%; min-width: 0; }

  /* ---------- Inbox card ---------- */
  .card {
    position: relative;
    width: min(420px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 34px 60px -38px rgba(40, 40, 120, .55), 0 2px 6px -2px rgba(40, 40, 120, .08);
  }
  .head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 18px; font-weight: 760; letter-spacing: -.01em; }
  .badge { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 720; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .head small { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  .head small i { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #35c58a; box-shadow: 0 0 0 0 rgba(53, 197, 138, .6); animation: live 2.4s ease-out infinite; vertical-align: 1px; }

  ul { list-style: none; margin: 0; padding: 4px 0; }
  .row {
    position: relative;
    height: 68px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 10px 0 18px;
    transition: background-color .2s;
  }
  .row + .row::before { content: ""; position: absolute; left: 70px; right: 0; top: 0; height: 1px; background: var(--line); }
  .row:hover, .row:focus-within, .row.demo-hover { background-color: var(--hover); }
  /* red wipe while a row is about to go */
  .row::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(229, 72, 77, 0), rgba(229, 72, 77, .2)); transform: scaleX(0); transform-origin: right; transition: transform .26s ease-out; pointer-events: none; }
  .row.doom::after { transform: scaleX(1); }
  .row.hollow > * { visibility: hidden; }
  .row[hidden] { display: none; }
  .av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; font-size: 14px; font-weight: 760; box-shadow: 0 6px 12px -6px var(--b); }
  .meta { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; gap: 7px; }
  .top b { font-size: 14.5px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.2s ease-in-out infinite; }
  .top time { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); }
  .meta p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .del {
    flex: none;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    transform: translateX(8px) scale(.9);
    transition: opacity .2s, transform .35s var(--spring), background-color .2s, color .2s;
  }
  .row:hover .del, .row:focus-within .del, .row.demo-hover .del { opacity: 1; transform: none; }
  @media (hover: none) { .del { opacity: .9; transform: none; } }
  .del:hover, .row.demo-hover .del { background: rgba(229, 72, 77, .12); color: var(--danger); }
  .del:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; opacity: 1; transform: none; }
  .del svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .del .lid { transform-box: fill-box; transform-origin: 0 100%; transition: transform .3s var(--spring); }
  .del:hover .lid, .row.demo-hover .del .lid { transform: translateY(-1.5px) rotate(-14deg); }

  /* Inbox zero */
  .empty { display: grid; justify-items: center; gap: 6px; padding: 30px 20px 34px; text-align: center; }
  .empty[hidden] { display: none; }
  .empty svg { width: 86px; height: 70px; margin-bottom: 6px; animation: bob 3s ease-in-out infinite; }
  .empty b { font-size: 16px; }
  .empty span { font-size: 13.5px; color: var(--muted); }
  .refill { margin-top: 10px; height: 40px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .3s var(--spring); }
  .refill:hover { transform: translateY(-2px); }
  .refill:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* The flying copy that morphs between a row and a toast */
  .layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 30; }
  .ghost { position: absolute; overflow: hidden; display: flex; align-items: center; padding: 0 18px; pointer-events: none; color: var(--ink); }
  .ghost .gc { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 14.5px; font-weight: 680; }
  .ghost .gt { position: absolute; inset: 0; display: flex; align-items: center; gap: 11px; padding: 0 14px; color: var(--toast-ink); white-space: nowrap; font-size: 14px; font-weight: 700; opacity: 0; }
  .gring { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ring); }

  /* ---------- Toast stack ---------- */
  .dock { position: relative; z-index: 3; width: min(380px, 100%); height: 58px; }
  .toast {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 8px 0 10px;
    border-radius: 28px;
    background: var(--toast);
    color: var(--toast-ink);
    box-shadow: 0 18px 36px -18px rgba(20, 18, 70, .75), 0 0 0 1px rgba(255, 255, 255, .06) inset;
    transform-origin: 50% 100%;
    transition: transform .5s var(--spring), opacity .3s;
  }
  .toast:not(.in) { visibility: hidden; }
  .ring { position: relative; flex: none; width: 36px; height: 36px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .trk { stroke: rgba(255, 255, 255, .14); }
  .ring .bar { stroke: var(--ring); stroke-linecap: round; stroke-dasharray: 81.68; transition: stroke .3s; }
  .dock.paused .ring .bar { stroke: #ffd27a; }
  .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 760; font-variant-numeric: tabular-nums; }
  .tt { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
  .tt b { font-size: 14px; font-weight: 700; }
  .tt span { font-size: 12.5px; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .undo { flex: none; height: 40px; padding: 0 17px; border: 0; border-radius: 20px; background: var(--ring); color: #17163a; font: inherit; font-size: 14px; font-weight: 760; cursor: pointer; transition: transform .3s var(--spring), filter .2s; }
  .undo:hover { transform: scale(1.05); filter: brightness(1.08); }
  .undo:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .undo.pressed { transform: scale(.9); }

  .hint { margin: 0; max-width: 380px; min-height: 1.4em; font-size: 13px; color: var(--muted); text-align: center; }
  kbd { font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); }

  .bit { position: absolute; z-index: 2; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes drift1 { to { transform: translate(120px, 90px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-110px, -70px) scale(.9); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(53, 197, 138, .55); } 80%, 100% { box-shadow: 0 0 0 7px rgba(53, 197, 138, 0); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div></div>
<main class="stage">
  <section class="card" aria-labelledby="inbox-title">
    <div class="head">
      <h1 id="inbox-title">Inbox</h1>
      <span class="badge" id="count" aria-label="messages">5</span>
      <small><i aria-hidden="true"></i>Synced just now</small>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 86 70" aria-hidden="true">
        <path d="M8 34l10-24h50l10 24v26a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" style="fill: var(--soft); stroke: var(--accent)" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M8 36h20l4 8h22l4-8h20" fill="none" style="stroke: var(--accent)" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M35 22l6 6 11-12" fill="none" stroke="#35c58a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <b>Inbox zero</b>
      <span>Nothing left to read. Nice.</span>
      <button class="refill" id="refill" type="button">Refill inbox</button>
    </div>
  </section>
  <div class="dock" id="dock" aria-label="Undo notifications"></div>
  <p class="hint">Undo within 5 s · <kbd>Ctrl</kbd>+<kbd>Z</kbd> works too · hover toasts to pause</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>
<!-- flying copies live in a clipped full-screen layer so they never widen the page on phones -->
<div class="layer" id="layer" aria-hidden="true"></div>

<script>
  // ---------- Take Back: a deleted row morphs into an undo toast, and Undo morphs it back ----------
  const $ = (id) => document.getElementById(id);
  const layer = $("layer"), list = $("list"), dock = $("dock"), countEl = $("count"), emptyEl = $("empty"), status = $("status");

  const PEOPLE = [
    { id: "ak", name: "Ayesha Khan", text: "Fabric samples for the spring order", time: "9:41", a: "#f7a08c", b: "#e2557a", unread: true },
    { id: "ba", name: "Bilal Ahmed", text: "Invoice #2291 · PKR 18,500 is due Friday", time: "9:12", a: "#7dd3fc", b: "#4f6df5", unread: true },
    { id: "sm", name: "Sana Mirza", text: "Can we move the shoot to Friday?", time: "Tue", a: "#fcd34d", b: "#f08c2e" },
    { id: "hr", name: "Hamid Raza", text: "Your parcel left the Lahore hub", time: "Mon", a: "#86efac", b: "#16a37f" },
    { id: "za", name: "Zainab Ali", text: "Photos from the Hunza trip are up", time: "Sun", a: "#d8b4fe", b: "#8b5cf6" }
  ];
  const UNDO_MS = 5000;
  const RING = 81.68;      // circumference of the countdown ring (r = 13)
  const ROW_H = 68;

  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 300) : ms));
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function play(el, frames, opts) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  function say(msg) { if (!demo.on) status.textContent = msg; }

  // ---------- Build the rows ----------
  const rows = new Map(); // id -> { p, li, state: shown | pending | deleted }
  const initials = (n) => n.split(" ").map((w) => w[0]).join("");
  PEOPLE.forEach((p) => {
    const li = document.createElement("li");
    li.className = "row";
    li.innerHTML =
      '<span class="av" style="--a:' + p.a + ';--b:' + p.b + '" aria-hidden="true">' + initials(p.name) + "</span>" +
      '<div class="meta"><div class="top">' + (p.unread ? '<i class="dot" aria-hidden="true"></i>' : "") +
      "<b>" + p.name + "</b><time>" + p.time + "</time></div><p>" + p.text + "</p></div>" +
      '<button class="del" type="button" aria-label="Delete message from ' + p.name + '">' +
      '<svg viewBox="0 0 20 20" aria-hidden="true"><g class="lid"><path d="M3.5 5.5h13" /><path d="M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5" /></g>' +
      '<path d="M5.2 5.5l.8 10.6a1.6 1.6 0 0 0 1.6 1.5h4.8a1.6 1.6 0 0 0 1.6-1.5l.8-10.6" /><path d="M8.3 9v5.2M11.7 9v5.2" /></svg></button>';
    li.querySelector(".del").addEventListener("click", () => del(p.id));
    list.appendChild(li);
    rows.set(p.id, { p, li, state: "shown" });
  });

  let shownCount = PEOPLE.length;
  function updateCount() {
    const n = [...rows.values()].filter((r) => r.state === "shown").length;
    emptyEl.hidden = n > 0;
    if (n === shownCount) return;
    shownCount = n;
    countEl.textContent = n;
    play(countEl, [{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(.3,1.6,.5,1)" });
  }

  // A copy of the row that flies and morphs
  function makeGhost(p, rect, asToast) {
    const g = document.createElement("div");
    g.className = "ghost";
    // two faces: the row (avatar + name) and the toast (ring + label); they cross-fade mid-flight
    g.innerHTML = '<span class="gc"><span class="av" style="--a:' + p.a + ';--b:' + p.b + '">' + initials(p.name) + "</span>" + p.name + "</span>" +
      '<span class="gt"><i class="gring"></i>Message deleted</span>';
    Object.assign(g.style, { left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px", background: asToast ? cssVar("--toast") : cssVar("--card"), borderRadius: asToast ? "28px" : "12px" });
    layer.appendChild(g);
    return g;
  }

  // Morph between two boxes along a soft arc. toToast decides the colours and the content fade.
  function morph(g, a, b, toToast) {
    const card = cssVar("--card"), toast = cssVar("--toast"), mid = cssVar("--accent");
    const box = (r) => ({ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    const vw = document.documentElement.clientWidth;
    const mw = Math.min(vw - 24, a.width * .45 + b.width * .55);
    const ml = Math.max(12, Math.min(vw - mw - 12, (a.left + b.left) / 2 + (toToast ? 22 : -22)));
    const m = {
      left: ml + "px",
      top: (a.top + b.top) / 2 - 18 + "px",
      width: mw + "px",
      height: (a.height + b.height) / 2 + "px"
    };
    const gt = g.querySelector(".gt");
    play(gt, toToast ? [{ opacity: 0 }, { opacity: 0, offset: .4 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 0, offset: .45 }, { opacity: 0 }], { duration: 640, fill: "forwards" });
    const frames = [
      Object.assign(box(a), { borderRadius: toToast ? "12px" : "28px", backgroundColor: toToast ? card : toast, boxShadow: "0 0 0 rgba(0,0,0,0)", transform: "rotate(0deg)" }),
      Object.assign(m, { offset: .5, borderRadius: "24px", backgroundColor: mid, boxShadow: "0 28px 44px -18px rgba(30,30,90,.5)", transform: "rotate(" + (toToast ? -2 : 2) + "deg)" }),
      Object.assign(box(b), { borderRadius: toToast ? "28px" : "12px", backgroundColor: toToast ? toast : card, boxShadow: "0 14px 28px -16px rgba(30,30,90,.45)", transform: "rotate(0deg)" })
    ];
    const gc = g.querySelector(".gc");
    play(gc, toToast ? [{ opacity: 1 }, { opacity: 0, offset: .45 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 0, offset: .5 }, { opacity: 1 }], { duration: 640, fill: "forwards" });
    return play(g, frames, { duration: 640, easing: "cubic-bezier(.55,0,.25,1)", fill: "forwards" });
  }

  // ---------- Toasts ----------
  const toasts = []; // newest first: { el, id, remaining, live, bar, num }
  const isOpen = () => dock.matches(":hover") || dock.contains(document.activeElement);
  function layoutToasts() {
    const open = isOpen();
    toasts.forEach((t, k) => {
      const y = open ? -k * 64 : -k * 11;
      const s = open ? 1 : 1 - k * .05;
      t.el.style.transform = "translateY(" + y + "px) scale(" + s + ")";
      t.el.style.opacity = k > 2 ? 0 : open ? 1 : 1 - k * .2;
      t.el.style.zIndex = 20 - k;
    });
  }
  ["mouseenter", "mouseleave", "focusin", "focusout"].forEach((ev) => dock.addEventListener(ev, () => setTimeout(layoutToasts)));

  function makeToast(r) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML =
      '<span class="ring" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="trk" cx="16" cy="16" r="13" /><circle class="bar" cx="16" cy="16" r="13" /></svg><b class="num">5</b></span>' +
      '<span class="tt"><b>Message deleted</b><span>From ' + r.p.name + "</span></span>" +
      '<button class="undo" type="button" aria-label="Undo delete of the message from ' + r.p.name + '">Undo</button>';
    dock.appendChild(el);
    const t = { el, id: r.p.id, remaining: UNDO_MS, live: false, bar: el.querySelector(".bar"), num: el.querySelector(".num") };
    el.querySelector(".undo").addEventListener("click", () => undo(t));
    toasts.unshift(t);
    layoutToasts();
    return t;
  }

  // One clock for every toast; hovering or focusing the stack pauses it
  let clockOn = false, clockLast = 0;
  function startClock() { if (!clockOn) { clockOn = true; clockLast = performance.now(); requestAnimationFrame(clock); } }
  function clock(now) {
    const dt = Math.max(0, Math.min(100, now - clockLast)); clockLast = now;
    const paused = isOpen();
    dock.classList.toggle("paused", paused);
    toasts.slice().forEach((t) => {
      if (!t.live) return;
      if (!paused) t.remaining -= dt;
      const f = Math.max(0, t.remaining / UNDO_MS);
      t.bar.style.strokeDashoffset = (RING * (1 - f)).toFixed(2);
      t.num.textContent = Math.max(1, Math.ceil(t.remaining / 1000));
      if (t.remaining <= 0) expire(t);
    });
    if (toasts.length) requestAnimationFrame(clock); else clockOn = false;
  }

  // Little burst of dots when a toast runs out
  function poof(x, y) {
    if (calm()) return;
    const cols = [cssVar("--ring"), cssVar("--accent"), "#ffd27a", cssVar("--danger")];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement("span");
      s.className = "bit";
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.background = cols[i % cols.length];
      layer.appendChild(s);
      const a = (i / 12) * Math.PI * 2, d = 26 + Math.random() * 26;
      s.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) scale(.2)", opacity: 0 }], { duration: 520 + Math.random() * 200, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Delete: anticipation, row collapses, copy morphs into a toast ----------
  async function del(id) {
    const r = rows.get(id);
    if (!r || r.state !== "shown") return;
    r.state = "pending";
    const li = r.li;
    const hadFocus = li.contains(document.activeElement);
    li.classList.add("doom");
    await play(li, [{ transform: "scale(1)" }, { transform: "scale(.975)", offset: .5 }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
    const from = li.getBoundingClientRect();
    const t = makeToast(r);
    const to = t.el.getBoundingClientRect();
    const g = makeGhost(r.p, from, false);
    li.classList.add("hollow");
    li.style.height = "0px";
    play(li, [{ height: ROW_H + "px" }, { height: "0px" }], { duration: 400, easing: "cubic-bezier(.6,0,.3,1)" }).then(() => { if (r.state !== "shown") li.hidden = true; });
    updateCount();
    if (hadFocus) {
      const next = [...rows.values()].find((x) => x.state === "shown");
      (next ? next.li.querySelector(".del") : t.el.querySelector(".undo")).focus();
    }
    await morph(g, from, to, true);
    g.remove();
    t.el.classList.add("in");
    play(t.el, [{ transform: t.el.style.transform + " scale(.94, 1.08)" }, { transform: t.el.style.transform + " scale(1.03, .96)", offset: .45 }, { transform: t.el.style.transform }], { duration: 420, easing: "ease-out" });
    t.live = true;
    startClock();
    say("Message from " + r.p.name + " deleted. Press Undo or Control Z within 5 seconds.");
  }

  // ---------- Undo: the toast lifts off and morphs back into its row ----------
  async function undo(t) {
    const i = toasts.indexOf(t);
    if (i < 0) return;
    toasts.splice(i, 1);
    layoutToasts();
    const r = rows.get(t.id);
    const from = t.el.getBoundingClientRect();
    const hadFocus = t.el.contains(document.activeElement);
    t.el.remove();
    const g = makeGhost(r.p, from, true);
    r.state = "shown";
    const li = r.li;
    li.hidden = false;
    li.classList.add("hollow");
    li.classList.remove("doom");
    li.style.height = "";
    updateCount();
    const rr = li.getBoundingClientRect();
    play(li, [{ height: "0px" }, { height: ROW_H + "px" }], { duration: 460, easing: "cubic-bezier(.34,1.45,.64,1)" });
    await morph(g, from, { left: rr.left, top: rr.top, width: rr.width, height: ROW_H }, false);
    g.remove();
    li.classList.remove("hollow", "doom");
    play(li, [{ backgroundColor: cssVar("--soft") }, { backgroundColor: "rgba(0,0,0,0)" }], { duration: 1300, easing: "ease-out" });
    play(li.querySelector(".av"), [{ transform: "scale(.6)" }, { transform: "scale(1.12)", offset: .6 }, { transform: "scale(1)" }], { duration: 480, easing: "ease-out" });
    if (hadFocus) li.querySelector(".del").focus();
    say("Message from " + r.p.name + " restored.");
  }

  // ---------- Time ran out: the toast squeezes to a dot and pops ----------
  async function expire(t) {
    const i = toasts.indexOf(t);
    if (i < 0) return;
    toasts.splice(i, 1);
    const r = rows.get(t.id);
    r.state = "deleted";
    const base = t.el.style.transform;
    const rect = t.el.getBoundingClientRect();
    if (t.el.contains(document.activeElement)) { const next = [...rows.values()].find((x) => x.state === "shown"); (next ? next.li.querySelector(".del") : $("refill")).focus(); }
    t.el.style.opacity = 0;
    layoutToasts();
    say("Message from " + r.p.name + " deleted for good.");
    await play(t.el, [{ transform: base, opacity: 1 }, { transform: base + " scaleX(.16)", opacity: 1, offset: .55 }, { transform: base + " translateY(10px) scale(.04)", opacity: 0 }], { duration: 520, easing: "cubic-bezier(.5,0,.6,1)" });
    poof(rect.left + rect.width / 2, rect.top + rect.height / 2);
    t.el.remove();
  }

  // ---------- Refill: everything deleted comes back with a stagger ----------
  function refill() {
    toasts.splice(0).forEach((t) => t.el.remove());
    let k = 0;
    rows.forEach((r) => {
      if (r.state === "shown") return;
      r.state = "shown";
      const li = r.li;
      li.hidden = false;
      li.classList.remove("hollow", "doom");
      li.style.height = "";
      play(li, [{ height: "0px", opacity: 0, transform: "translateX(-26px)" }, { height: ROW_H + "px", opacity: 1, transform: "none" }], { duration: 560, delay: k++ * 90, easing: "cubic-bezier(.34,1.3,.64,1)", fill: "backwards" });
    });
    updateCount();
    say("Inbox refilled.");
  }
  $("refill").addEventListener("click", () => { refill(); const f = [...rows.values()][0]; if (f) f.li.querySelector(".del").focus(); });

  // Ctrl+Z (or Cmd+Z) brings back the newest delete
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && toasts.length) {
      e.preventDefault();
      const t = toasts.find((x) => x.live);
      if (t) undo(t);
    }
  });

  // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
  const demo = { on: true, timer: 0 };
  function stopDemo() {
    if (!demo.on) return;
    demo.on = false;
    clearTimeout(demo.timer);
    document.querySelectorAll(".demo-hover").forEach((el) => el.classList.remove("demo-hover"));
  }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
  async function demoPress(r) {
    r.li.classList.add("demo-hover");
    await wait(380);
    const b = r.li.querySelector(".del");
    play(b, [{ transform: "scale(1)" }, { transform: "scale(.82)" }, { transform: "scale(1)" }], { duration: 220 });
    await wait(140);
    r.li.classList.remove("demo-hover");
  }
  async function runDemo() {
    if (!demo.on) return;
    const shown = [...rows.values()].filter((r) => r.state === "shown");
    if (shown.length < PEOPLE.length || toasts.length) { refill(); scheduleDemo(1800); return; }
    const a = shown[1], b = shown[2];
    await demoPress(a); if (!demo.on) return;
    del(a.p.id);
    await wait(1500); if (!demo.on) return;
    await demoPress(b); if (!demo.on) return;
    del(b.p.id);
    await wait(1900); if (!demo.on) return;
    const t = toasts.find((x) => x.id === b.p.id && x.live);
    if (t) {
      const u = t.el.querySelector(".undo");
      u.classList.add("pressed");
      await wait(180);
      u.classList.remove("pressed");
      undo(t);
    }
    await wait(4600); if (!demo.on) return;
    refill();
    scheduleDemo(3600);
  }
  scheduleDemo(420);
</script>
</body>
</html>
