{id:"market-note-november",cat:"Market",t:"Market note: November in the valley",ex:"Prices rose 3.2% over the year, but homes now take nine days longer to find a buyer. What that means if you plan to sell before spring.",img:"h-brick",by:"ellis",days:2,min:4,

body:["Most 1930s houses in Larkford were built with cavity walls held together by steel ties. After ninety years some of those ties have rusted, and a surveyor will look for horizontal cracks in the mortar every few courses.","The fuse board is the second thing on almost every report. If it still has wire fuses, budget around £600 for a new consumer unit and a safety certificate.","Then the bay window. Bays were often built on shallower footings than the rest of the house, so look for a crack where the bay meets the main wall. Most are old and stable; your surveyor will tell you which."],q:"Most cracks are old and stable. A good surveyor tells you which ones are not."},

body:["Seven in ten of the landlords we work with will now consider a dog. The trick is to ask early and to put the details in the tenancy rather than in an email.","Ask for a pet clause that names your dog, a professional clean at the end rather than a vague standard, and a clear line on who repairs the garden fence.","Bring a reference from your last landlord if you can. It does more than any deposit to show that you and your dog are good tenants."],q:"Put it in the tenancy, not in an email."},

body:["After a few hundred viewings a pattern shows. Buyers slow down in the kitchen, the main bedroom and the garden, and they hurry through everything else.","So that is where your time and money should go before photographs: clear the worktops, put fresh linen on the main bed and cut the grass the day before.","The spare room, the one most sellers worry about, barely registers. Tidy it, open the window and leave it be."],q:"Buyers slow down in three rooms and hurry through the rest."},

const stack=[];
function overlay(kind,o){
const scrim=document.createElement("div");

box.className=kind+" "+(o.cls||"");
box.setAttribute("role","dialog");

if(kind!=="lightbox")document.body.append(scrim);
document.body.append(box);
const prev=document.activeElement;
const h={el:box,close(){scrim.remove();box.remove();stack.splice(stack.indexOf(h),1);if(o.onClose)o.onClose();if(prev&&prev.focus)prev.focus({preventScroll:true});}};

});

function spark(vals,w=120,h=30,cls="hist-line"){
const mn=Math.min(...vals),mx=Math.max(...vals),k=(mx-mn)||1;
const pts=vals.map((v,i)=>[(i/(vals.length-1))*(w-4)+2,h-3-((v-mn)/k)*(h-6)]);

PAGES.saved={
title:()=>"Your shortlist",
html:()=>`
  <div class="wrap">
    <div class="sv-head"><div><span class="eyebrow lit">Your shortlist</span><h1 class="display" style="font-size:clamp(32px,3.6vw,48px);margin-top:14px;letter-spacing:-.04em">Homes you are keeping<br><span class="tone">an eye on.</span></h1><p class="muted" id="svSum" style="margin-top:10px"></p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-line" href="#/listings">${ic("search")}Find more homes</a><button class="btn btn-soft" type="button" data-reset>${ic("refresh")}Reset demo data</button></div></div>
    <div class="sv-grid">
      <div><div id="svList"></div><section class="pp-sec" style="margin-top:14px" aria-labelledby="cmpT"><h2 id="cmpT">Compare side by side <span class="tag soft" id="cmpN"></span></h2><div class="panel cmp" id="svCmp" style="padding:6px 10px"></div></section></div>
      <aside class="aside" style="gap:16px">
        <div class="panel pad"><h3 class="h3" style="font-size:17px;margin-bottom:6px">${ic("cal")} Viewings</h3><div id="svViews"></div></div>
        <div class="panel pad" id="alerts"><h3 class="h3" style="font-size:17px;margin-bottom:6px">${ic("bell")} Search alerts</h3><div id="svAlerts"></div>
          <form id="alForm" class="form-grid" style="margin-top:14px" novalidate><div class="form-2">${selBox("alTown","Town",opt([["","Any town"]].concat(TOWNS.map((t)=>[t.n,t.n])),""))}${selBox("alBeds","Bedrooms",opt(BEDS,"2"))}</div><div class="form-2">${selBox("alMode","Looking to",opt(MODES.map(([m,t])=>[m,t]),"buy"))}${selBox("alFreq","Email me",opt([["Instant","Straight away"],["Daily","Once a day"],["Weekly","Once a week"]],"Daily"))}</div><button class="btn btn-ink" type="submit">${ic("plus")}Add alert</button></form></div>
        <div class="panel pad"><h3 class="h3" style="font-size:17px;margin-bottom:6px">${ic("tag")} Valuations</h3><div id="svVals"></div></div>
      </aside>
    </div>
  </div>`,
init:()=>{
const draw=()=>{
const homes=S.saved.map(L).filter(Boolean);
S.cmp=S.cmp.filter((id)=>S.saved.includes(id));
$("#svSum").textContent=`${homes.length} ${homes.length===1?"home":"homes"} · ${S.alerts.length} search ${S.alerts.length===1?"alert":"alerts"} · ${S.views.length} ${S.views.length===1?"viewing":"viewings"} · kept in this browser only`;
$("#svList").innerHTML=homes.length?homes.map((l,i)=>`<div class="sv-item" style="animation-delay:${i*60}ms" data-id="${l.id}"><a href="#/property/${l.id}" class="ph"><img src="${IMG(l.img)}" alt="${esc(l.alt)}" width="900" height="675"${l.flip?' class="flip"':""}></a><div><div class="top"><div><span class="price">${priceHTML(l)}</span><div class="hc-nm"><a href="#/property/${l.id}">${esc(l.nm)}</a></div><div class="hc-sub">${esc(l.town)} · ${esc(l.type)} · <span class="tag ${l.st[0]}" style="height:20px">${esc(l.st[1])}</span></div></div><button class="ibtn" type="button" data-rmsave="${l.id}" aria-label="Remove ${esc(l.nm)}">${ic("trash")}</button></div><div class="specs" style="margin-top:8px">${specs(l)}</div><div class="note"><label class="sr-only" for="n-${l.id}">Your notes on ${esc(l.nm)}</label><textarea class="inp" id="n-${l.id}" data-note="${l.id}" placeholder="Your notes: what to ask at the viewing, what you loved">${esc(S.notes[l.id]||"")}</textarea></div><div class="row"><label class="check" style="font-size:12.5px"><input type="checkbox" data-cmp="${l.id}"${S.cmp.includes(l.id)?" checked":""}>Compare</label><span class="grow"></span><span class="muted" style="font-size:11.5px" id="ns-${l.id}"></span><a class="btn btn-line btn-sm" href="#/property/${l.id}" data-jump="book">${ic("cal")}Book a viewing</a></div></div></div>`).join(""):`<div class="empty">${ic("heart")}<h3>Nothing saved yet</h3><p>Tap the heart on any home to keep it here, with your own notes.</p><a class="btn btn-ink btn-sm" href="#/listings">Browse homes</a></div>`;
const cm=S.cmp.map(L).filter(Boolean).slice(0,3);
$("#cmpN").textContent=cm.length+" of 3";
const ppm=(l)=>(l.per?null:l.price/l.size);
const rows=[["Price",(l)=>priceHTML(l)],["Per m²",(l)=>(ppm(l)?gbp(ppm(l)):"–"),(l)=>ppm(l)||1e9,"min"],["Bedrooms",(l)=>l.beds||"–",(l)=>l.beds,"max"],["Bathrooms",(l)=>l.baths,(l)=>l.baths,"max"],["Floor area",(l)=>l.size+" m²",(l)=>l.size,"max"],["EPC",(l)=>l.epc,(l)=>-"ABCDEFG".indexOf(l.epc),"max"],["Outside",(l)=>esc(l.plot)],["Town",(l)=>esc(l.town)],["On the market",(l)=>l.days+" days"],["Agent",(l)=>AGENTS[l.ag].name]];
$("#svCmp").innerHTML=cm.length>=2?`<table class="tbl"><thead><tr><th></th>${cm.map((l)=>`<th style="text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)">${esc(l.nm)}</th>`).join("")}</tr></thead><tbody>${rows.map(([n,f,sc,dir])=>{let best=null;if(sc){const v=cm.map(sc);const b=dir==="min"?Math.min(...v):Math.max(...v);if(v.filter((x)=>x===b).length===1)best=v.indexOf(b);}return`<tr><td>${n}</td>${cm.map((l,i)=>`<td class="${i===best?"best":""}">${f(l)}</td>`).join("")}</tr>`;}).join("")}</tbody></table>`:`<p class="muted" style="padding:14px 6px">Tick “Compare” on two or three homes to see them side by side.</p>`;
$("#svViews").innerHTML=S.views.length?S.views.map((v)=>{const l=L(v.l),d=new Date(v.day);return`<div class="alert-row"><img src="${IMG(l.img)}" alt="" width="44" height="34" style="width:44px;height:34px;border-radius:8px;object-fit:cover"><div class="grow"><b>${esc(l.nm)}</b><small>${DAY[d.getDay()]} ${fdate(d)} at ${v.time} · ${v.status}</small></div><button class="ibtn" type="button" data-rmview="${v.id}" aria-label="Cancel this viewing">${ic("x")}</button></div>`;}).join(""):`<p class="muted" style="font-size:12.5px">No viewings booked. Use “Book a viewing” on any home.</p>`;
$("#svAlerts").innerHTML=S.alerts.length?S.alerts.map((a)=>`<div class="alert-row"><div class="grow"><b>${esc(a.name)}</b><small>${(n=>n+(n===1?" home matches":" homes match"))(results(Object.assign(FDEF(),a.f)).length)} today</small></div>${selBox("fq-"+a.id,"How often for "+a.name,opt([["Instant","Instant"],["Daily","Daily"],["Weekly","Weekly"]],a.freq),1)}<button class="ibtn" type="button" data-rmalert="${a.id}" aria-label="Delete this alert">${ic("trash")}</button></div>`).join(""):`<p class="muted" style="font-size:12.5px">No alerts yet.</p>`;
$("#svVals").innerHTML=S.vals.length?S.vals.map((v)=>`<div class="alert-row"><div class="grow"><b>${esc(v.addr)}, ${esc(v.town)}</b><small>Guide ${gbp(v.lo)} to ${gbp(v.hi)} · ${esc(v.when)}</small></div><span class="tag soft">Call booked</span></div>`).join(""):`<p class="muted" style="font-size:12.5px">Thinking of selling? <a class="link" href="#/sell">Get a free guide price</a></p>`;
};
const v=$("#view");
const onClick=(e)=>{
const r=e.target.closest("[data-rmsave]");
if(r){const id=r.dataset.rmsave,it=r.closest(".sv-item");it.classList.add("out");setTimeout(()=>{S.saved=S.saved.filter((x)=>x!==id);save();syncSaved();draw();toast("Removed from your shortlist",{label:"Undo",run:()=>{S.saved.unshift(id);save();syncSaved();if(curPage==="saved")draw();}});},260);}
const rv=e.target.closest("[data-rmview]");
if(rv){S.views=S.views.filter((x)=>x.id!==rv.dataset.rmview);save();draw();toast("Viewing cancelled. We have let the agent know.");}
const ra=e.target.closest("[data-rmalert]");
if(ra){S.alerts=S.alerts.filter((x)=>x.id!==ra.dataset.rmalert);save();draw();toast("Alert deleted");}
};
const onChange=(e)=>{
const c=e.target.closest("[data-cmp]");
if(c){const id=c.dataset.cmp;S.cmp=c.checked?S.cmp.filter((x)=>x!==id).concat(id).slice(-3):S.cmp.filter((x)=>x!==id);save();draw();}
if(e.target.id&&e.target.id.startsWith("fq-")){const a=S.alerts.find((x)=>"fq-"+x.id===e.target.id);if(a){a.freq=e.target.value;save();toast("Alert will email "+a.freq.toLowerCase());}}
};
let nt=0;
const onInput=(e)=>{const n=e.target.closest("[data-note]");if(!n)return;S.notes[n.dataset.note]=n.value;clearTimeout(nt);nt=setTimeout(()=>{save();const s=$("#ns-"+n.dataset.note);if(s)s.textContent="Note saved";},400);};
v.addEventListener("click",onClick);v.addEventListener("change",onChange);v.addEventListener("input",onInput);
pageStop.push(()=>{v.removeEventListener("click",onClick);v.removeEventListener("change",onChange);v.removeEventListener("input",onInput);});
$("#alForm").addEventListener("submit",(e)=>{
e.preventDefault();
const f=Object.assign(FDEF(),{mode:$("#alMode").value,town:$("#alTown").value,beds:$("#alBeds").value});
const name=filterName(f);
if(S.alerts.some((a)=>a.name===name)){toast("You already have that alert");return;}
S.alerts.unshift({id:uid(),name,f:{mode:f.mode,town:f.town,beds:f.beds},freq:$("#alFreq").value});save();draw();toast("Alert added: "+name);
});
draw();
},
};

$("#openTxt").textContent=openStatus();
setTheme(document.documentElement.dataset.theme);
feedTick();
setInterval(()=>{if(!document.hidden)feedTick();},4200);
$("#newsForm").addEventListener("submit",(e)=>{
e.preventDefault();
const v=$("#newsEmail").value.trim(),m=$("#newsMsg");
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){m.textContent="Please enter a valid email address.";m.classList.add("bad");$("#newsEmail").setAttribute("aria-invalid","true");$("#newsEmail").focus();return;}
m.classList.remove("bad");$("#newsEmail").removeAttribute("aria-invalid");m.textContent="Thank you. The first email arrives on Friday at 8 am.";$("#newsEmail").value="";
});
document.addEventListener("click",(e)=>{
const t=e.target;
const sv=t.closest("[data-save]");
if(sv){e.preventDefault();toggleSave(sv.dataset.save);return;}
const a=t.closest('a[href^="#/"]');
if(a){
if(a.dataset.mode||a.dataset.town){const f=FDEF();f.mode=a.dataset.mode||(LIST.some((l)=>l.town===a.dataset.town&&inMode(l,"buy"))?"buy":"rent");f.town=a.dataset.town||"";f.sort=S.f.sort;S.f=f;save();}
if(a.dataset.jump)pendingJump=a.dataset.jump;
if(a.getAttribute("href")===location.hash){e.preventDefault();route();}
closeMega();closeMnav();
}
if(t.closest("[data-theme-toggle]"))setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
if(t.closest("[data-pal]"))palette();
if(t.closest("[data-menu]"))openMnav();
if(t.closest("[data-mclose]"))closeMnav();
if(t.closest("[data-reset]"))resetDemo();
if(t.closest("[data-top]"))window.scrollTo({top:0,behavior:RM?"auto":"smooth"});
const m=t.closest("[data-msg]");
if(m)messageDrawer(m.dataset.msg);
const lb=t.closest("[data-lb]");
if(lb){e.preventDefault();const[id,k]=lb.dataset.lb.split(":");lightbox(L(id),+k||0);}
const sc=t.closest("[data-scrollto]");
if(sc&&!lb){const el=document.getElementById(sc.dataset.scrollto);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-84,behavior:RM?"auto":"smooth"});}
});
document.addEventListener("keydown",(e)=>{
const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(!stack.length)palette();return;}
if(e.key==="/"&&!typing&&!stack.length){e.preventDefault();palette();return;}
if(e.key==="Escape"){
if(stack.length){e.preventDefault();stack[stack.length-1].close();}
else if(mnavEl)closeMnav();
else if(hdr.classList.contains("mega-open")){closeMega();$("#megaBtn").focus();}
else{const p=$(".map-pop");if(p)p.remove();}
}
});
addEventListener("hashchange",()=>{if(!location.hash||location.hash.startsWith("#/"))route();});
addEventListener("resize",()=>onScroll());
route();
