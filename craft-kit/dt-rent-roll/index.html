<!doctype html>
<!-- Chill & Craft · Rent Roll · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent Roll · Landlord desk for Islamabad and Rawalpindi</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: warm grey stone, olive and brass, frosted glass over the Margalla hills ---------- */
  :root {
    --bg: #e6e2da; --photo-op: .6;
    --veil: linear-gradient(160deg, rgba(240,236,228,.55), rgba(222,216,205,.8));
    --glass: rgba(248,246,240,.62); --glass-strong: rgba(251,249,244,.84); --edge: rgba(255,255,255,.7); --edge2: rgba(255,255,255,.6);
    --shade: rgba(48,40,24,.22); --card: rgba(255,255,255,.52); --card2: rgba(255,255,255,.4);
    --surface: rgba(255,255,255,.62); --surface-2: rgba(70,60,40,.06); --hover: rgba(70,60,40,.07); --panel: #f6f4ef;
    --pill: #fffdf8; --pill-ink: #24221c;
    --ink: #24221c; --ink-2: #4a463d; --muted: #6c675b; --line: rgba(70,60,40,.13); --grid: rgba(70,60,40,.1);
    --olive: #5c6b2f; --olive-2: #7f8f45; --olive-soft: rgba(92,107,47,.13);
    --brass: #94701f; --brass-2: #c4994a; --brass-soft: rgba(176,134,52,.17);
    --paid: #3d7a35; --paid-soft: rgba(61,122,53,.12);
    --accent: #4f5d27; --accent-ink: #fbfaf3; --focus: #4f5d27;
    --good: #3d7a35; --bad: #b3472c; --warn: #96680f; --bad-soft: rgba(179,71,44,.12);
    --radius: 20px; --radius-sm: 12px; --tip-bg: rgba(36,33,27,.94); --tip-ink: #fff; --overlay: rgba(40,34,24,.3);
    --sk1: rgba(70,60,40,.06); --sk2: rgba(70,60,40,.13);
    /* the building drawing */
    --sky1: #c3c0b5; --sky2: #eddfc6; --sun: #f5d79a; --hill1: #aeb096; --hill2: #959a78; --facade: #ddd5c5; --facade2: #cbc1ad;
    --trim: #8d8371; --win-off: #4d4f4a; --road: #8f897b; --walk: #b9b2a2; --tree: #6f7d45; --tree2: #5b6836; --tank: #2e2d2a;
    --lit1: #ffe7ad; --lit2: #f0b04a; --glow: rgba(255,190,90,.7);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #161512; --photo-op: .5;
    --veil: linear-gradient(160deg, rgba(24,23,20,.74), rgba(16,15,13,.9));
    --glass: rgba(34,32,28,.6); --glass-strong: rgba(40,38,33,.86); --edge: rgba(255,246,226,.11); --edge2: rgba(255,246,226,.08);
    --shade: rgba(0,0,0,.55); --card: rgba(255,248,232,.045); --card2: rgba(255,248,232,.03);
    --surface: rgba(255,248,232,.07); --surface-2: rgba(255,248,232,.06); --hover: rgba(255,248,232,.06); --panel: #23211d;
    --pill: #efe9dc; --pill-ink: #1c1b17;
    --ink: #f0ebe0; --ink-2: #d2ccbe; --muted: #a59e8f; --line: rgba(255,246,226,.1); --grid: rgba(255,246,226,.07);
    --olive: #a7b86c; --olive-2: #c2d18a; --olive-soft: rgba(167,184,108,.15);
    --brass: #d8ab58; --brass-2: #ebc579; --brass-soft: rgba(216,171,88,.15);
    --paid: #8cc46c; --paid-soft: rgba(140,196,108,.13);
    --accent: #b5c779; --accent-ink: #1a1c10; --focus: #c9d98f;
    --good: #8cc46c; --bad: #ef7f62; --warn: #e0ae55; --bad-soft: rgba(239,127,98,.14);
    --tip-bg: rgba(245,240,230,.96); --tip-ink: #1d1b17; --overlay: rgba(0,0,0,.5);
    --sk1: rgba(255,248,232,.04); --sk2: rgba(255,248,232,.1);
    --sky1: #0f1116; --sky2: #2a2620; --sun: #efe6c8; --hill1: #262820; --hill2: #1d1f18; --facade: #3b372f; --facade2: #2f2b25;
    --trim: #5d564b; --win-off: #1a1b1b; --road: #26241f; --walk: #34312b; --tree: #2f3b1f; --tree2: #252f18; --tank: #0e0e0d;
    --lit1: #ffe8ad; --lit2: #f2ac40; --glow: rgba(255,180,70,.85);
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ===================== Rent Roll: page, glass and type ===================== */
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { letter-spacing: -.01em; }
  a { color: inherit; }
  .num, .tn { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .grow { flex: 1; }
  /* the Margalla hills photo, blurred far behind the glass */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
  .backdrop img { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; filter: blur(38px) saturate(.7); opacity: var(--photo-op); }
  .backdrop::after { content: ""; position: absolute; inset: 0; background: var(--veil); }
  .glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.25); -webkit-backdrop-filter: blur(24px) saturate(1.25); border: 1px solid var(--edge); box-shadow: 0 24px 50px -30px var(--shade), inset 0 1px 0 rgba(255,255,255,.14); }

  /* buttons: soft pills like the rest of the glass */
  .btn { border-radius: 999px; min-height: 36px; padding: 0 15px; font-size: 12.5px; background: var(--surface); border-color: var(--line); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: 12px; }
  .btn .ic { width: 15px; height: 15px; }
  .ibtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .15s, background .2s, border-color .2s; position: relative; flex: none; }
  .ibtn:hover { border-color: var(--olive); }
  .ibtn:active { transform: scale(.94); }
  .ibtn .ic { width: 17px; height: 17px; }
  .ibtn.sm { width: 30px; height: 30px; }
  .ibtn.sm .ic { width: 14px; height: 14px; }
  .ibtn .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--glass-strong); }
  .cc-chip { min-height: 30px; font-size: 12px; font-weight: 500; }
  .cc-chip[aria-pressed="true"] { background: var(--pill); color: var(--pill-ink); border-color: var(--line); box-shadow: 0 4px 12px -8px var(--shade); }
  .cc-tbl table { font-size: 12.5px; }
  .cc-tbl td { padding: 9px 10px; }
  .cc-tbl th { font-size: 10.5px; }
  .cc-search { min-height: 34px; border-radius: 999px; }
  .cc-pages button { border-radius: 50%; }
  .cc-pages button[aria-current="page"] { background: var(--pill); color: var(--pill-ink); border-color: var(--line); }
  .cc-dialog { background: var(--panel); }
  .cc-dh h2 { font-size: 16px; font-weight: 600; }
  .cc-field label { font-size: 12px; }
  .cc-field input, .cc-field select, .cc-field textarea { min-height: 38px; font-size: 13px; }
  .cc-cmdk-q { border-radius: 12px; }

  /* ===================== Shell: floating sidebar + top bar ===================== */
  .side { position: fixed; z-index: 40; left: 14px; top: 14px; bottom: 14px; width: 224px; border-radius: 24px; display: flex; flex-direction: column; padding: 14px 12px 12px; transition: width .3s cubic-bezier(.3,.8,.3,1), transform .3s; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 10px 4px; text-decoration: none; color: var(--ink); min-width: 0; }
  .brand-mark { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); flex: none; box-shadow: 0 6px 14px -8px var(--shade); }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
  .brand small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .collapse { margin-left: auto; }
  .side-top { display: flex; align-items: center; gap: 6px; }
  .nav { position: relative; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; overflow-y: auto; overflow-x: hidden; flex: 1; scrollbar-width: none; }
  .nav h6 { margin: 12px 12px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .nav .mark { position: absolute; left: 0; right: 0; top: 0; height: 38px; border-radius: 13px; background: var(--pill); box-shadow: 0 8px 18px -12px var(--shade); transition: transform .35s cubic-bezier(.3,.9,.3,1), height .3s, opacity .2s; z-index: 0; pointer-events: none; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px 0 12px; border-radius: 13px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; transition: color .2s, background .2s; }
  .nav a:hover { background: var(--hover); }
  .nav a[aria-current="page"] { color: var(--pill-ink); background: transparent; }
  .nav a[aria-current="page"] .ic { color: var(--olive); }
  [data-theme="dark"] .nav a[aria-current="page"] .ic { color: #5c6b2f; }
  .nav a .ic { width: 17px; height: 17px; flex: none; }
  .nav .count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
  .nav .count.bad { background: var(--bad); color: #fff; }
  .nav a[aria-current="page"] .count { background: rgba(0,0,0,.07); color: var(--pill-ink); }
  .nav a[aria-current="page"] .count.bad { background: var(--bad); color: #fff; }
  .nav .count[hidden] { display: none; }
  .side-foot { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
  .side-foot .stack { display: flex; }
  .side-foot .stack .cc-av { width: 26px; height: 26px; font-size: 9.5px; margin-left: -8px; box-shadow: 0 0 0 2px var(--glass-strong); }
  .side-foot .stack .cc-av:first-child { margin-left: 0; }
  .side-foot > div { min-width: 0; }
  .side-foot b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-foot small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 5px; box-shadow: 0 0 0 0 var(--good); animation: livePulse 2s infinite; vertical-align: 1px; }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }

  /* collapsed rail (button, or automatically on mid-size screens) */
  html.rail .side { width: 72px; }
  html.rail .brand div, html.rail .nav h6, html.rail .nav a span, html.rail .nav .count, html.rail .side-foot div { display: none; }
  html.rail .side-top { flex-direction: column; }
  html.rail .collapse { margin: 0; }
  html.rail .nav a { justify-content: center; padding: 0; }
  html.rail .nav h6 { display: block; height: 1px; margin: 8px 10px; background: var(--line); font-size: 0; }
  html.rail .side-foot { justify-content: center; padding: 8px 0; }
  html.rail .side-foot .stack .cc-av:not(:first-child) { display: none; }

  .top { position: fixed; z-index: 35; top: 14px; left: 252px; right: 14px; height: 58px; border-radius: 20px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 10px; transition: left .3s cubic-bezier(.3,.8,.3,1); }
  html.rail .top { left: 100px; }
  .search-btn { display: flex; align-items: center; gap: 9px; height: 38px; width: min(360px, 34vw); padding: 0 8px 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; text-align: left; }
  .search-btn:hover { border-color: var(--olive); }
  .search-btn .s-ic { display: grid; flex: none; }
  .search-btn .s-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kbd { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .menu-btn { display: none; }
  .month-chip { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; white-space: nowrap; color: var(--ink); text-decoration: none; transition: border-color .2s; }
  .month-chip:hover { border-color: var(--olive); }
  .month-chip svg { width: 28px; height: 28px; transform: rotate(-90deg); }
  .month-chip b { font-weight: 600; }
  .me { width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; background: none; position: relative; }
  .me .cc-av { width: 38px; height: 38px; font-size: 12px; }
  .me::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--glass-strong); }

  .main { margin-left: 252px; padding: 86px 14px 18px 0; min-height: 100vh; transition: margin-left .3s cubic-bezier(.3,.8,.3,1); }
  html.rail .main { margin-left: 100px; }
  .sheet { border-radius: 26px; padding: 22px 24px 24px; min-height: calc(100vh - 104px); }
  #view { min-width: 0; }
  #view.leave { opacity: 0; transform: translateY(6px); transition: opacity .14s, transform .14s; }
  .bottom-bar { display: none; }

  /* ===================== Page header, tabs, cards ===================== */
  .ph { display: flex; align-items: flex-end; gap: 14px 18px; flex-wrap: wrap; margin-bottom: 16px; }
  .kick { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .kick .ic { width: 14px; height: 14px; }
  .ph h1 { margin: 4px 0 5px; font-size: 30px; line-height: 1.12; font-weight: 600; letter-spacing: -.028em; }
  .ph p { margin: 0; color: var(--muted); font-size: 13px; max-width: 680px; }
  .ph p b { color: var(--ink); font-weight: 600; }
  .ph .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -2px 0 16px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { position: relative; padding: 9px 12px 10px; border: 0; background: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); animation: tabIn .3s cubic-bezier(.3,.9,.3,1); }
  @keyframes tabIn { from { transform: scaleX(.3); opacity: 0; } }
  .tabs .badge { margin-left: 6px; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .grid + .grid { margin-top: 14px; }
  .c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
  .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: 1 / -1; }
  .card { position: relative; min-width: 0; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--edge2); }
  .lift { transition: transform .25s cubic-bezier(.3,.8,.3,1), box-shadow .25s, border-color .25s; }
  .lift:hover { transform: translateY(-3px); box-shadow: 0 18px 34px -22px var(--shade); }
  .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 28px; }
  .card-h h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .card-h small { color: var(--muted); font-size: 11.5px; }
  .card-h .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .link { border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { color: var(--olive); }
  .link .ic { width: 14px; height: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .pill.plain::before { display: none; }
  .pill.ok { background: var(--paid-soft); color: var(--good); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--brass-soft); color: var(--warn); }
  .pill.olive { background: var(--olive-soft); color: var(--olive); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--pill); color: var(--pill-ink); box-shadow: 0 4px 12px -8px var(--shade); }
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row > div { min-width: 0; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; color: var(--muted); }
  .bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--olive); transform-origin: left; animation: barIn 1s cubic-bezier(.3,.8,.3,1) both; animation-delay: var(--d, 0ms); }
  @keyframes barIn { from { transform: scaleX(0); } }
  .empty-note { padding: 18px 8px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* skeleton shimmer while a data-heavy page "loads" */
  .sk { border-radius: 18px; background: linear-gradient(100deg, var(--sk1) 20%, var(--sk2) 45%, var(--sk1) 70%) 0 0 / 220% 100%; animation: shimmer 1.1s linear infinite; }
  @keyframes shimmer { to { background-position: -220% 0; } }

  /* KPI tiles */
  .kpi { display: flex; flex-direction: column; gap: 6px; min-height: 112px; }
  .kpi .k-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .kpi .k-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .kpi .k-ic .ic { width: 15px; height: 15px; }
  .kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .kpi .foot { margin-top: auto; display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .kpi .foot .bar { flex: 1; }
  .delta { font-weight: 600; color: var(--good); }
  .delta.neg { color: var(--bad); }
  .unit-dots { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-top: auto; }
  .unit-dots i { aspect-ratio: 1; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
  .unit-dots i.on { background: var(--brass-2); border-color: transparent; box-shadow: 0 0 6px -1px var(--glow); animation: dotOn .5s both; animation-delay: var(--d); }
  @keyframes dotOn { from { background: var(--surface-2); box-shadow: none; } }

  /* ===================== Signature 1: the building whose windows light up ===================== */
  .bld-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .bld-stage { position: relative; height: 288px; overflow: hidden; border-radius: 18px 18px 0 0; }
  .bld-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bld-label { position: absolute; left: 14px; top: 14px; padding: 9px 13px; border-radius: 14px; max-width: 60%; }
  .bld-label b { display: block; font-size: 15px; font-weight: 600; }
  .bld-label small { display: block; font-size: 11.5px; color: var(--muted); }
  .bld-count { position: absolute; right: 14px; top: 14px; padding: 8px 12px; border-radius: 14px; text-align: right; }
  .bld-count b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bld-count small { display: block; font-size: 11px; color: var(--muted); }
  .bld-legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .bld-legend span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .bld-legend i { width: 9px; height: 9px; border-radius: 3px; }
  .bld-thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; scrollbar-width: none; }
  .thumb { position: relative; flex: 1 0 108px; height: 62px; border-radius: 12px; overflow: hidden; border: 2px solid transparent; padding: 0; background: var(--surface-2); transition: border-color .2s, transform .2s; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
  .thumb:hover img { transform: scale(1.06); }
  .thumb span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px; font-size: 11px; font-weight: 600; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.6)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb[aria-pressed="true"] { border-color: var(--ink); }
  .thumb.all { flex: 0 0 62px; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--ink-2); font-size: 11px; font-weight: 600; border: 1px solid var(--line); }
  .thumb.all .ic { width: 16px; height: 16px; }
  .win { cursor: pointer; outline: none; }
  .win .lit, .win .bloom { opacity: 0; }
  .win.on .lit { animation: flick .9s both; animation-delay: var(--d); }
  .win.on .bloom { animation: flick .9s both; animation-delay: var(--d); }
  .win.notice.on .lit { animation-name: flickDim; }
  .win.notice.on .bloom { animation-name: flickDim; }
  @keyframes flick { 0% { opacity: 0; } 25% { opacity: .9; } 38% { opacity: .2; } 55% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes flickDim { 0% { opacity: 0; } 30% { opacity: .5; } 45% { opacity: .15; } 100% { opacity: .55; } }
  .win .frame { fill: none; stroke: var(--trim); stroke-width: 1.4; }
  .win:hover .frame, .win:focus-visible .frame { stroke: var(--ink); stroke-width: 2.2; }
  .win .late { fill: var(--bad); stroke: var(--facade); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: latePulse 1.6s ease-in-out infinite; }
  @keyframes latePulse { 50% { transform: scale(1.35); } }
  .win.flash .lit { animation: flash 1.2s ease-out; opacity: 1; }
  @keyframes flash { 0% { filter: brightness(1.8); } 100% { filter: none; } }
  .twinkle { animation: twinkle 3s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes twinkle { 50% { opacity: .2; } }
  .lamp-glow { animation: lampOn 1.2s .3s both; }
  @keyframes lampOn { from { opacity: 0; } }

  /* live activity feed */
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .feed li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 8px 6px; border-radius: 12px; }
  .feed li.new { animation: feedIn .6s cubic-bezier(.2,.9,.3,1.1) both; background: var(--olive-soft); transition: background 1.6s 1s; }
  .feed li.new.settled { background: transparent; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-12px); max-height: 0; } to { max-height: 80px; } }
  .feed .f-ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .feed .f-ic .ic { width: 14px; height: 14px; }
  .feed .f-ic.ok { background: var(--paid-soft); color: var(--good); }
  .feed .f-ic.warn { background: var(--brass-soft); color: var(--warn); }
  .feed .f-ic.bad { background: var(--bad-soft); color: var(--bad); }
  .feed b { font-weight: 600; }
  .feed p { margin: 0; font-size: 12.5px; line-height: 1.4; }
  .feed time { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* lists inside cards */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
  .list li:last-child { border-bottom: 0; }
  .list .meta { flex: 1; min-width: 0; }
  .list .meta b { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .meta small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* photo cards */
  .photo-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .photo-card .ph-img { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--surface-2); }
  .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .photo-card:hover img { transform: scale(1.05); }
  .photo-card .tag { position: absolute; left: 10px; bottom: 10px; padding: 6px 10px; border-radius: 12px; font-size: 11.5px; max-width: calc(100% - 20px); }
  .photo-card .tag b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photo-card .tag-r { position: absolute; right: 10px; top: 10px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .photo-card .pc-body { padding: 11px 14px 13px; display: grid; gap: 7px; }
  .prop-card { cursor: pointer; text-align: left; border: 1px solid var(--edge2); font: inherit; color: inherit; }
  .prop-card[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }

  /* ===================== Units ===================== */
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 2px 0 12px; }
  .tools .cc-search { flex: 0 1 260px; }
  .select { min-height: 34px; padding: 0 30px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 12.5px; }
  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; }
  .unit { display: flex; flex-direction: column; gap: 7px; padding: 12px 13px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .unit .u-top { display: flex; align-items: center; gap: 8px; }
  .unit .code { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .unit .u-win { width: 22px; height: 16px; border-radius: 4px; background: var(--win-off); border: 1.5px solid var(--trim); margin-left: auto; }
  .unit .u-win.on { background: linear-gradient(160deg, var(--lit1), var(--lit2)); box-shadow: 0 0 10px -1px var(--glow); }
  .unit .u-win.dim { background: linear-gradient(160deg, var(--lit1), var(--lit2)); opacity: .55; }
  .unit .rent { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .unit .who { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); min-width: 0; font-size: 12px; }
  .unit .who .cc-av { width: 24px; height: 24px; font-size: 9px; }
  .unit.vacant .who { color: var(--warn); font-weight: 600; }

  /* drawers: unit / tenant detail */
  .d-photo { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; margin-bottom: 12px; background: var(--surface-2); }
  .d-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-photo .tag { position: absolute; left: 10px; bottom: 10px; padding: 5px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
  .kv div { padding: 9px 11px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
  .kv dt { font-size: 11px; color: var(--muted); }
  .kv dd { margin: 1px 0 0; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-sec { margin: 14px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .d-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .history { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .history span { display: grid; gap: 3px; justify-items: center; font-size: 9.5px; color: var(--muted); }
  .history i { width: 100%; aspect-ratio: 1; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); animation: ccPop .4s both; animation-delay: var(--d); }
  .history i.ok { background: var(--paid); border-color: transparent; }
  .history i.late { background: var(--brass-2); border-color: transparent; }
  .history i.part { background: linear-gradient(135deg, var(--paid) 50%, var(--surface-2) 50%); }
  .history i.miss { background: var(--bad-soft); border-color: var(--bad); }
  .hist-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .hist-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* ===================== Tenants: renewal timeline ===================== */
  .tl { position: relative; height: 118px; margin: 6px 4px 0; }
  .tl-axis { position: absolute; left: 0; right: 0; top: 64px; height: 2px; background: var(--line); border-radius: 2px; }
  .tl-fill { position: absolute; left: 0; top: 64px; height: 2px; background: var(--olive); width: 0; border-radius: 2px; animation: tlFill 1.2s .2s cubic-bezier(.3,.8,.3,1) forwards; }
  @keyframes tlFill { to { width: var(--w); } }
  .tl-m { position: absolute; top: 72px; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
  .tl-tick { position: absolute; top: 60px; width: 1px; height: 10px; background: var(--line); }
  .tl-pin { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 0; color: var(--ink); animation: pinDrop .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay: var(--d); }
  .tl-pin small { order: -1; font-size: 10.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .tl-stack { display: flex; }
  .tl-stack .cc-av { width: 30px; height: 30px; font-size: 10px; margin-left: -9px; box-shadow: 0 0 0 2px var(--glass-strong), 0 0 0 4px var(--c); transition: transform .2s; }
  .tl-stack .cc-av:first-child { margin-left: 0; }
  .tl-stack .more { --h: 40; background: var(--surface); color: var(--ink); }
  .tl-pin::after { content: ""; width: 2px; height: 12px; background: var(--c); border-radius: 2px; }
  .tl-pin:hover .cc-av, .tl-pin:focus-visible .cc-av { transform: translateY(-3px); }
  .tl-today { position: absolute; top: 56px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--olive); box-shadow: 0 0 0 4px var(--olive-soft); }
  @keyframes pinDrop { from { opacity: 0; transform: translate(-50%, -16px); } }
  .term { display: grid; gap: 4px; min-width: 130px; }
  .term .bar { height: 5px; }
  .dots12 { display: inline-flex; gap: 2px; }
  .dots12 i { width: 6px; height: 12px; border-radius: 2px; background: var(--paid); }
  .dots12 i.late { background: var(--brass-2); }
  .dots12 i.miss { background: var(--bad); }
  .dots12 i.none { background: var(--surface-2); }
  .ren-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ren-stats div { padding: 9px 11px; border-radius: 12px; background: var(--surface-2); }
  .ren-stats b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ren-stats small { font-size: 11px; color: var(--muted); }

  /* ===================== Signature 2: the rent calendar that stamps paid days ===================== */
  .cal-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
  .cal-head span { font-size: 11px; font-weight: 600; color: var(--muted); padding-left: 8px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day { position: relative; min-height: 86px; padding: 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; overflow: hidden; transition: background .5s, border-color .2s, transform .15s; }
  .day:hover { border-color: var(--olive); }
  .day .n { font-size: 12px; font-weight: 600; }
  .day .amt { margin-top: auto; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .day .cnt { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .day.out { opacity: .38; }
  .day.future .amt { color: var(--muted); font-weight: 500; }
  .day.today { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); }
  .day.sel { background: var(--surface); border-color: var(--ink); }
  .day.inked { background: color-mix(in srgb, var(--paid) 10%, var(--card2)); }
  .day.inked .amt { color: var(--good); }
  .day .flag { display: block; max-width: calc(100% - 34px); font-size: 9px; line-height: 1.15; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); }
  .day.due-day { border-color: var(--brass-2); border-style: dashed; }
  .day.grace-day { border-style: dashed; }
  .stamp { position: absolute; right: 4px; top: 4px; width: 37px; height: 37px; color: var(--paid); transform: rotate(var(--r)); pointer-events: none; opacity: .9; }
  .stamp text { font: 800 8.5px/1 "Inter", ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; fill: currentColor; }
  .stamp .n2 { font-size: 6.5px; letter-spacing: .02em; font-weight: 700; }
  .stamp.hit { animation: stampIn .55s cubic-bezier(.3,1.3,.5,1) both; animation-delay: var(--d); }
  @keyframes stampIn { 0% { opacity: 0; transform: scale(2.5) rotate(calc(var(--r) - 24deg)); } 55% { opacity: 1; transform: scale(.88) rotate(var(--r)); } 75% { transform: scale(1.04) rotate(var(--r)); } 100% { opacity: .9; transform: scale(1) rotate(var(--r)); } }
  .day .ink { position: absolute; right: 22px; top: 22px; width: 2px; height: 2px; border-radius: 50%; box-shadow: 0 0 0 0 var(--paid); opacity: 0; pointer-events: none; }
  .day .ink.hit { animation: inkRing .7s ease-out both; animation-delay: calc(var(--d) + .28s); }
  @keyframes inkRing { 0% { opacity: .55; box-shadow: 0 0 0 0 var(--paid); } 100% { opacity: 0; box-shadow: 0 0 0 34px transparent; } }
  .day.thud { animation: thud .28s ease-out both; animation-delay: calc(var(--d) + .26s); }
  @keyframes thud { 40% { transform: translateY(1.5px) scale(.985); } }
  .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend i { width: 12px; height: 12px; border-radius: 4px; border: 1px solid var(--line); }
  .ring-wrap { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .c b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .ring .c small { font-size: 11px; color: var(--muted); }
  .methods { display: grid; gap: 8px; flex: 1; min-width: 0; }
  .methods div { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 12px; }
  .methods .bar { grid-column: 1 / -1; height: 5px; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }

  /* receipt */
  .receipt { position: relative; padding: 18px 18px 16px; border-radius: 16px; background: var(--surface); border: 1px dashed var(--line); overflow: hidden; }
  .receipt .r-top { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); margin-bottom: 10px; }
  .receipt .r-top b { font-size: 15px; display: block; }
  .receipt dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 12.5px; }
  .receipt dt { color: var(--muted); }
  .receipt dd { margin: 0; font-weight: 600; }
  .receipt .words { grid-column: 1 / -1; font-style: italic; color: var(--ink-2); font-weight: 500; }
  .receipt .big-stamp { position: absolute; right: 18px; bottom: 34px; width: 96px; height: 96px; color: var(--paid); --r: -14deg; transform: rotate(var(--r)); opacity: .85; animation: stampIn .6s .25s cubic-bezier(.3,1.3,.5,1) both; --d: .2s; }
  .receipt .big-stamp text { font: 800 15px/1 "Inter", ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; fill: currentColor; }
  .receipt .sign { margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--line); width: 52%; font-size: 11.5px; color: var(--muted); }

  /* ===================== Maintenance board ===================== */
  .techs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .tech { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px 10px; align-items: center; padding: 11px 12px; }
  .tech .cc-av { width: 38px; height: 38px; font-size: 12px; }
  .tech b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tech small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tech .busy { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .tech .busy b { display: inline; color: var(--ink); font-size: 12.5px; }
  .tech .busy .ibtn { margin-left: auto; }
  #sp-rows { max-height: 372px; overflow-y: auto; padding-right: 4px; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .col { padding: 10px; border-radius: 18px; background: var(--card2); border: 1px solid var(--edge2); min-height: 260px; transition: background .2s, border-color .2s; }
  .col.over { background: var(--olive-soft); border-color: var(--olive); }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; font-weight: 600; }
  .col-h i { width: 8px; height: 8px; border-radius: 50%; }
  .col-h .n { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
  .col-list { display: grid; gap: 8px; }
  .job { padding: 11px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--edge2); cursor: grab; display: grid; gap: 7px; }
  .job:active { cursor: grabbing; }
  .job.dragging { opacity: .45; }
  .job.moved { animation: jobIn .5s cubic-bezier(.3,1.3,.5,1); }
  @keyframes jobIn { from { transform: scale(.92); opacity: .3; } }
  .job b { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .job .row > .sub { white-space: nowrap; }
  .job .row > .sub.ell { min-width: 0; }
  .job .j-img { height: 78px; border-radius: 10px; overflow: hidden; }
  .job .j-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .job .j-foot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .job .j-foot .cc-av { width: 20px; height: 20px; font-size: 8px; }
  .job .j-acts { display: flex; gap: 6px; }
  .prio { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
  .prio.Urgent { background: var(--bad); color: #fff; }
  .prio.High { background: var(--brass-soft); color: var(--warn); }

  /* ===================== Shared bills splitter ===================== */
  .bills { display: grid; gap: 8px; }
  .bill { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--edge2); background: var(--card2); text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
  .bill:hover { transform: translateX(2px); }
  .bill[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); }
  .bill .b-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--brass-soft); color: var(--warn); }
  .bill b { display: block; font-weight: 600; font-size: 12.5px; }
  .bill small { color: var(--muted); font-size: 11.5px; }
  .bill .amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .split-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.6fr) 92px; gap: 12px; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .split-row:last-child { border-bottom: 0; }
  .split-row .bar { height: 8px; }
  .split-row .bar i { background: linear-gradient(90deg, var(--olive), var(--olive-2)); transition: transform .6s cubic-bezier(.3,.8,.3,1); animation: none; }
  .split-row.off { opacity: .5; }
  .split-row .bar i.landlord { background: repeating-linear-gradient(135deg, var(--brass-2) 0 4px, transparent 4px 7px); }
  .split-row input { width: 64px; min-height: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
  .split-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .tr { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .2s; flex: none; }
  .switch .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--pill); box-shadow: 0 2px 6px -2px var(--shade); transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
  .switch input:checked + .tr { background: var(--accent); border-color: transparent; }
  .switch input:checked + .tr::after { transform: translateX(16px); background: #fff; }
  .switch input:focus-visible + .tr { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ===================== Reports + settings ===================== */
  .hbar { display: grid; gap: 10px; }
  .hbar div { display: grid; grid-template-columns: 130px 1fr 52px; gap: 10px; align-items: center; font-size: 12.5px; }
  .hbar .bar { height: 10px; }
  .hbar em { font-style: normal; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .set-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .set-row:last-child { border-bottom: 0; }
  .set-row > div { flex: 1; min-width: 0; }
  .set-row b { display: block; font-weight: 600; font-size: 12.5px; }
  .set-row small { display: block; font-size: 11.5px; color: var(--muted); }
  .set-row output { font-weight: 600; min-width: 48px; text-align: right; }
  .set-row input[type="range"] { width: 140px; accent-color: var(--accent); }
  .preview { margin-top: 10px; padding: 12px 14px; border-radius: 14px 14px 14px 4px; background: var(--olive-soft); font-size: 12.5px; line-height: 1.5; }
  textarea.tpl { width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; resize: vertical; }

  /* notifications + quick menu popovers */
  .pop-h { display: flex; align-items: center; padding: 12px 14px 6px; font-weight: 600; }
  .pop-h .link { margin-left: auto; }
  .pop-list { list-style: none; margin: 0; padding: 4px 6px 8px; }
  .pop-list li button, .pop-list li a { width: 100%; display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; border-radius: 10px; border: 0; background: none; text-align: left; color: inherit; text-decoration: none; font: inherit; }
  .pop-list li button:hover, .pop-list li a:hover { background: var(--surface-2); }
  .pop-list .unread { font-weight: 600; }
  .pop-list small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .pop-list .f-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); }
  .pop-list .f-ic .ic { width: 14px; height: 14px; }

  /* ===================== Responsive ===================== */
  @media (max-width: 1180px) and (min-width: 901px) {
    html:not(.wide) .side { width: 72px; }
    html:not(.wide) .brand div, html:not(.wide) .nav a span, html:not(.wide) .nav .count, html:not(.wide) .side-foot div { display: none; }
    html:not(.wide) .side-top { flex-direction: column; }
    html:not(.wide) .collapse { display: none; }
    html:not(.wide) .nav a { justify-content: center; padding: 0; }
    html:not(.wide) .nav h6 { height: 1px; margin: 8px 10px; background: var(--line); font-size: 0; }
    html:not(.wide) .side-foot { justify-content: center; padding: 8px 0; }
    html:not(.wide) .side-foot .stack .cc-av:not(:first-child) { display: none; }
    html:not(.wide) .top { left: 100px; }
    html:not(.wide) .main { margin-left: 100px; }
    .c3.kpi-c, .c3.prop-c { grid-column: span 6; }
    .techs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .month-chip { display: none; }
  }
  @media (max-width: 1100px) {
    .c8.stack-md, .c4.stack-md, .c7.stack-md, .c5.stack-md, .c6.stack-md { grid-column: 1 / -1; }
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .side { transform: translateX(calc(-100% - 20px)); width: 248px; top: 10px; bottom: 10px; left: 10px; }
    html.nav-open .side { transform: none; }
    html.nav-open .scrim { opacity: 1; pointer-events: auto; }
    .scrim { position: fixed; inset: 0; z-index: 38; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .collapse { display: none; }
    .top { left: 10px !important; right: 10px; top: 10px; height: 54px; border-radius: 18px; }
    .menu-btn { display: inline-grid; }
    .search-btn { width: auto; flex: 1; min-width: 0; }
    .month-chip { display: none; }
    .main { margin-left: 0 !important; padding: 74px 10px 92px; }
    .sheet { padding: 18px 16px 20px; border-radius: 22px; }
    .c2, .c3, .c4, .c5, .c6, .c7, .c8, .c9 { grid-column: 1 / -1; }
    .c3.kpi-c, .c3.prop-c { grid-column: span 6; }
    .techs { grid-template-columns: repeat(2, minmax(0, 1fr)); }

const VIEWS = {};

function render(name, keep, fresh = !keep) {
  const v = $("#view"), tok = ++renderTok, first = !curPage, changed = curPage !== name;
  curPage = name;
  const draw = () => {
    if (tok !== renderTok) return;
    v.classList.remove("leave");
    const finish = () => {
      if (tok !== renderTok) return;
      v.innerHTML = "";
      const page = document.createElement("div");
      v.appendChild(page);
      FRESH = fresh;
      try { VIEWS[name](page); } finally { FRESH = false; }
      if (!keep) enter(page);
      countAll(page);

    if (SKEL[name] && changed && !keep && !RM && !S.set.calm) { v.innerHTML = skeleton(); enter(v); setTimeout(finish, 380); } else finish();
    if (changed && !keep) window.scrollTo({ top: 0, behavior: "instant" });
  };
  if (!first && changed && !RM && !keep) { v.classList.add("leave"); setTimeout(draw, 140); } else draw();
  document.title = PAGES.find((p) => p[0] === name)[1] + " · Rent Roll";
}

    () => { const u = pick(S.units.filter((x) => tenantIn(x.id) && x.type !== "Office")); return u ? { icon: "bolt", kind: "", html: `Meter reading added · <b>${esc(ushort(u.id))}</b> · ${randi(90, 480)} units`, u: u.id } : null; },
