    onSubmit: (v) => { const b = { id: "b" + uid(), m: CURM, status: "Draft", payVacant: true, custom: {}, meters: {}, ...v, amt: Math.round(v.amt) }; S.bills.push(b); billSel = b.id; save(); drawChrome(); toast("Bill added · choose how to split it"); if (curPage !== "utilities") location.hash = "#/utilities"; else rerender(); },
  });
}

/* =====================================================================
   Reports
   ===================================================================== */
let repRange = 12;
VIEWS.reports = (v) => {
  const ks = Array.from({ length: repRange }, (_, i) => mshift(CURM, i - repRange + 1));
  const tt = ks.map(monthTotals), ex = ks.map((k) => sum(S.exps.filter((e) => e.d.startsWith(k)).map((e) => e.amt)));
  const billed = sum(tt.map((t) => t.due)), coll = sum(tt.map((t) => t.paid)), exp = sum(ex), net = coll - exp;
  const occ = ks.map((k) => +((S.tenants.concat(S.past).filter((t) => activeIn(t, k) && (!t.out || t.out.slice(0, 7) > k)).length / Math.max(1, S.units.length)) * 100).toFixed(1));
  const late = S.tenants.map((t) => { const h = ks.map((k) => (activeIn(t, k) ? rentRow(t, k) : null)).filter((r) => r && r.st !== "Due"); const lates = h.filter((r) => r.late > S.set.grace); return { t, n: lates.length, avg: lates.length ? sum(lates.map((r) => r.late)) / lates.length : 0 }; }).filter((x) => x.n).sort((a, b) => b.n - a.n || b.avg - a.avg).slice(0, 6);
  v.innerHTML = head(`${ic("bars")}${esc(mname(ks[0]))} to ${esc(mname(CURM))}`, "Reports", `Rent, costs and occupancy across ${PROPS.length} properties · collection rate <b>${((coll / Math.max(1, billed)) * 100).toFixed(1)}%</b>`,
    `<div class="seg" role="group" aria-label="Range">${[6, 12].map((n) => `<button type="button" data-rg="${n}" aria-pressed="${repRange === n}">${n} months</button>`).join("")}</div><button class="btn" type="button" id="rp-csv">${ic("download")}Export CSV</button><button class="btn" type="button" id="rp-print">${ic("print")}Print</button>`) +
    `<div class="grid">${kpi("file", "Rent billed", billed, "short", `<span>${moneyShort(billed / repRange)} a month</span>`)}${kpi("coin", "Collected", coll, "short", `<div class="bar"><i style="width:${((coll / Math.max(1, billed)) * 100).toFixed(1)}%"></i></div><span>${((coll / Math.max(1, billed)) * 100).toFixed(1)}%</span>`)}${kpi("receipt", "Expenses", exp, "short", `<span>${Math.round((exp / Math.max(1, coll)) * 100)}% of collected rent</span>`)}${kpi("up", "Net income", net, "short", `<span class="delta">${moneyShort(net / repRange)} a month</span>`)}</div>
    <div class="grid"><div class="card c8 stack-md"><div class="card-h"><h3>Collected rent and costs</h3><small>per month</small></div><div id="rp-line"></div></div>
      <div class="card c4 stack-md"><div class="card-h"><h3>Collection by property</h3><small>${repRange} months</small></div><div class="hbar">${PROPS.map((p, i) => { const rs = ks.flatMap((k, j) => tt[j].rows.filter((r) => r.prop === p.id)); const due = sum(rs.map((r) => r.due)), pd = sum(rs.map((r) => Math.min(r.paid, r.due))), rate = due ? pd / due : 0; return `<div><span class="ell">${esc(p.short)}</span><span class="bar"><i style="width:${(rate * 100).toFixed(1)}%;--d:${i * 120}ms;background:${rate > 0.95 ? "var(--olive)" : "var(--brass-2)"}"></i></span><em>${(rate * 100).toFixed(1)}%</em></div>`; }).join("")}</div>
        <div class="d-sec" style="margin-top:18px">Occupancy now</div><div class="hbar">${PROPS.map((p, i) => { const us = S.units.filter((u) => u.prop === p.id), o = us.length ? us.filter((u) => tenantIn(u.id)).length / us.length : 0; return `<div><span class="ell">${esc(p.short)}</span><span class="bar"><i style="width:${(o * 100).toFixed(1)}%;--d:${300 + i * 120}ms;background:var(--olive-2)"></i></span><em>${Math.round(o * 100)}%</em></div>`; }).join("")}</div></div>
      <div class="card c6 stack-md"><div class="card-h"><h3>Occupancy over time</h3><small>share of units let</small></div><div id="rp-occ"></div></div>
      <div class="card c6 stack-md"><div class="card-h"><h3>Paid late most often</h3><small>more than ${S.set.grace} days after the due date</small></div><ul class="list">${late.map((x) => `<li>${avatar(x.t.name)}<div class="meta"><b>${esc(x.t.name)}</b><small>${esc(ushort(x.t.unit))} · ${dots12(x.t)}</small></div><span class="pill warn">${x.n} late</span><span class="amt">${x.avg.toFixed(0)} days avg</span></li>`).join("") || '<li class="empty-note">Nobody paid late in this range</li>'}</ul></div></div>`;
  lineChart($("#rp-line", v), { labels: ks.map((k) => MON[mfirst(k).getMonth()]), area: true, height: 240, fmt: (x) => short(x), tipFmt: (x) => money(x), series: [{ name: "Collected", data: tt.map((t) => t.paid), color: "var(--olive)" }, { name: "Expenses", data: ex, color: "var(--brass-2)" }, { name: "Net", data: tt.map((t, i) => t.paid - ex[i]), color: "var(--trim)", dash: true }] }, !FRESH);
  lineChart($("#rp-occ", v), { labels: ks.map((k) => MON[mfirst(k).getMonth()]), area: true, height: 200, zero: false, fmt: (x) => x.toFixed(0) + "%", tipFmt: (x) => x.toFixed(1) + "%", series: [{ name: "Occupancy", data: occ, color: "var(--olive-2)" }] });
  v.addEventListener("click", (e) => {
    const rg = e.target.closest("[data-rg]");
    if (rg) { repRange = +rg.dataset.rg; render("reports", true); return; }
    if (e.target.closest("#rp-print")) window.print();
    if (e.target.closest("#rp-csv")) {
      const lines = [["Month", "Rent billed (PKR)", "Collected (PKR)", "Expenses (PKR)", "Net (PKR)", "Occupancy %"]].concat(ks.map((k, i) => [mname(k), tt[i].due, tt[i].paid, ex[i], tt[i].paid - ex[i], occ[i]]));
      const blob = new Blob([lines.map((l) => l.join(",")).join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "rent-roll-report.csv"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("rent-roll-report.csv downloaded");
    }
  });
};

/* =====================================================================
   Settings
   ===================================================================== */
let setTab = "profile";
VIEWS.settings = (v) => {
  const T = [["profile", "Profile"], ["rules", "Rent rules"], ["reminders", "Reminders"], ["look", "Appearance"], ["data", "Data"]];
  v.innerHTML = head(`${ic("building")}${esc(S.set.biz)}`, "Settings", "You, your rent rules, reminders, how Rent Roll looks, and the demo data.") +
    `<div class="tabs" role="tablist" aria-label="Settings">${T.map(([id, l]) => `<button type="button" role="tab" data-tab="${id}" aria-selected="${setTab === id}">${l}</button>`).join("")}</div><div id="set-body"></div>`;
  const body = $("#set-body", v);
  const sample = monthTotals(CURM).rows.find((r) => r.st !== "Paid") || monthTotals(CURM).rows[0];
  const draw = () => {
    if (setTab === "profile") {
      body.innerHTML = `<div class="set-grid"><div class="card"><div class="card-h"><h3>Your details</h3><small>shown on receipts and reminders</small></div><form id="pf" novalidate class="cc-form"><div class="cc-fields">
        ${[["owner", "Your name", "text"], ["biz", "Business name", "text"], ["phone", "Phone", "tel"], ["email", "Email", "email"]].map(([n, l, ty]) => `<div class="cc-field ${n === "owner" || n === "biz" ? "" : "half"}"><label for="pf-${n}">${l}</label><input id="pf-${n}" name="${n}" type="${ty}" value="${esc(S.set[n])}" aria-describedby="pf-${n}-e"><small class="cc-err" id="pf-${n}-e"></small></div>`).join("")}
        </div><div class="cc-df" style="padding:14px 0 0"><button class="btn primary" type="submit">Save details</button></div></form></div>
        <div class="card"><div class="card-h"><h3>Your properties</h3><small>${S.units.length} units</small></div><ul class="list">${PROPS.map((p) => { const us = S.units.filter((u) => u.prop === p.id); return `<li><img src="${p.img}" alt="${esc(p.alt)}" width="64" height="48" loading="lazy" style="width:64px;height:48px;object-fit:cover;border-radius:10px"><div class="meta"><b>${esc(p.name)}</b><small>${esc(p.addr)}</small></div><span class="pill olive">${us.filter((u) => tenantIn(u.id)).length}/${us.length} let</span></li>`; }).join("")}</ul></div>
        <div class="card"><div class="card-h"><h3>Team and access</h3><small>who can open Rent Roll</small></div>${(S.set.team || (S.set.team = [["Imran Butt", "Caretaker, Cedar Court", "Repairs only"], ["Sobia Rafiq", "Office desk", "Rent and receipts"], ["Fahad Qureshi", "Partner", "Everything"]])).map(([n, r, a], i) => `<div class="set-row">${avatar(n)}<div><b>${esc(n)}</b><small>${esc(r)}</small></div><select class="select" data-team="${i}" aria-label="Access for ${esc(n)}">${["Repairs only", "Rent and receipts", "Everything"].map((x) => `<option ${x === a ? "selected" : ""}>${x}</option>`).join("")}</select></div>`).join("")}</div>
        <div class="card"><div class="card-h"><h3>On every receipt</h3><small>bank details tenants can pay into</small></div><dl class="kv" style="margin:0"><div><dt>Account title</dt><dd>${esc(S.set.biz)}</dd></div><div><dt>Bank</dt><dd>City Savings Bank, F-11 branch</dd></div><div><dt>Account</dt><dd>PK•• •••• •••• 4410</dd></div><div><dt>Receipt numbers</dt><dd>RR-YYMM-001 each month</dd></div></dl></div></div>`;
      body.onchange = (e) => { const s = e.target.closest("[data-team]"); if (s) { S.set.team[+s.dataset.team][2] = s.value; save(); toast(S.set.team[+s.dataset.team][0] + " can now see: " + s.value.toLowerCase()); } };
      $("#pf", body).addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target, val = (n) => f.elements[n].value.trim(), errs = {};
        if (val("owner").length < 3) errs.owner = "Enter your name";
        if (!val("biz")) errs.biz = "Enter a business name";
        if (!/^03\d{2}-?\d{7}$/.test(val("phone"))) errs.phone = "Use the format 0300-1234567";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val("email"))) errs.email = "Enter a valid email";
        ["owner", "biz", "phone", "email"].forEach((n) => { $("#pf-" + n + "-e", f).textContent = errs[n] || ""; errs[n] ? f.elements[n].setAttribute("aria-invalid", "true") : f.elements[n].removeAttribute("aria-invalid"); });
        if (Object.keys(errs).length) { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
        ["owner", "biz", "phone", "email"].forEach((n) => (S.set[n] = val(n)));
        save(); drawChrome(); toast("Details saved");
      });
    }
    if (setTab === "rules") {
      const R_ = [["dueDay", "Rent due day", "Day of the month", 1, 10, "", (x) => ordinal(x)], ["grace", "Grace period", "Days before rent counts as overdue", 0, 10, " days"], ["lateFee", "Late fee", "Added after the grace period", 0, 5, "%"], ["term", "Agreement length", "Default for new tenants", 6, 24, " months"], ["depMonths", "Security deposit", "Months of rent", 1, 4, " months"], ["inc", "Yearly increase", "Default at renewal", 0, 20, "%"]];
      body.innerHTML = `<div class="set-grid"><div class="card"><div class="card-h"><h3>Rent rules</h3><small>saved as you move a slider</small></div>${R_.map(([k, l, s, a, b, u, f]) => `<div class="set-row"><div><b>${l}</b><small>${s}</small></div><input type="range" min="${a}" max="${b}" step="1" value="${S.set[k]}" data-k="${k}" aria-label="${l}"><output>${f ? f(S.set[k]) : S.set[k] + u}</output></div>`).join("")}</div>
        <div class="card"><div class="card-h"><h3>What this means</h3></div><p class="preview" id="rule-prev" style="margin:0"></p></div></div>`;
      const prev = () => { const dd = dueDate(CURM), fee = Math.round(90000 * S.set.lateFee / 100); $("#rule-prev", body).innerHTML = `Rent for ${esc(mname(CURM))} is due on <b>${fdate(dd)}</b>. After <b>${fdate(addDays(dd, S.set.grace))}</b> it counts as overdue, and a ${S.set.lateFee}% late fee (<b>${money(fee)}</b> on a rent of ${money(90000)}) can be added. New tenants sign for ${S.set.term} months with ${S.set.depMonths} months of rent as deposit, and rent goes up ${S.set.inc}% at renewal.`; };
      prev();
      body.oninput = (e) => { const r = e.target.closest("[data-k]"); if (!r) return; S.set[r.dataset.k] = +r.value; const d = R_.find((x) => x[0] === r.dataset.k); r.nextElementSibling.textContent = d[6] ? d[6](+r.value) : r.value + d[5]; prev(); };
      body.onchange = (e) => { if (e.target.closest("[data-k]")) { save(); drawChrome(); toast("Rent rules saved"); } };
    }
    if (setTab === "reminders") {
      const tg = [["remBefore", "Three days before the due date", "A friendly heads-up"], ["remDue", "On the due date", "Only to tenants who have not paid"], ["remAfter", "When the grace period ends", "Includes the late fee"], ["remRenew", "60 days before an agreement ends", "Asks if they want to renew"]];
      body.innerHTML = `<div class="set-grid"><div class="card"><div class="card-h"><h3>Automatic reminders</h3><span class="end"><div class="seg" role="group" aria-label="Channel">${["SMS", "Email", "Both"].map((x) => `<button type="button" data-ch="${x}" aria-pressed="${S.set.channel === x}">${x}</button>`).join("")}</div></span></div>${tg.map(([k, l, s]) => `<div class="set-row"><div><b>${l}</b><small>${s}</small></div><label class="switch"><input type="checkbox" data-t="${k}" ${S.set[k] ? "checked" : ""}><span class="tr"></span><span class="sr-only">${l}</span></label></div>`).join("")}</div>
        <div class="card"><div class="card-h"><h3>Message</h3><span class="end"><button class="link" type="button" id="tpl-reset">Reset text</button></span></div><label class="sr-only" for="tpl">Reminder text</label><textarea class="tpl" id="tpl">${esc(S.set.tpl)}</textarea><div class="sub" style="margin-top:6px">Use {tenant}, {amount}, {unit}, {due} and {owner}.</div><div class="preview" id="tpl-prev"></div></div></div>`;
      const prev = () => ($("#tpl-prev", body).textContent = sample ? fillTpl(sample) : S.set.tpl);
      prev();
      body.oninput = (e) => { if (e.target.id === "tpl") { S.set.tpl = e.target.value; prev(); } };
      body.onchange = (e) => { const t = e.target.closest("[data-t]"); if (t) { S.set[t.dataset.t] = t.checked; save(); toast(t.checked ? "Reminder turned on" : "Reminder turned off"); } if (e.target.id === "tpl") { save(); toast("Message saved"); } };
      body.onclick = (e) => { const c = e.target.closest("[data-ch]"); if (c) { S.set.channel = c.dataset.ch; save(); $$("[data-ch]", body).forEach((x) => x.setAttribute("aria-pressed", String(x === c))); } if (e.target.closest("#tpl-reset")) { S.set.tpl = seed().set.tpl; save(); draw(); toast("Message reset"); } };
    }
    if (setTab === "look") {
      body.innerHTML = `<div class="set-grid"><div class="card"><div class="card-h"><h3>Appearance</h3></div>
        <div class="set-row"><div><b>Theme</b><small>Add ?theme=dark or ?theme=light to the address to fix it</small></div><div class="seg" role="group" aria-label="Theme">${["light", "dark"].map((x) => `<button type="button" data-th="${x}" aria-pressed="${APP.theme() === x}">${x === "light" ? "Light" : "Dark"}</button>`).join("")}</div></div>
        <div class="set-row"><div><b>Calm motion</b><small>Lights and stamps appear without the flicker</small></div><label class="switch"><input type="checkbox" id="calm" ${S.set.calm ? "checked" : ""}><span class="tr"></span><span class="sr-only">Calm motion</span></label></div>
        <div class="set-row"><div><b>Narrow menu</b><small>Only icons in the sidebar</small></div><label class="switch"><input type="checkbox" id="narrow" ${document.documentElement.classList.contains("rail") ? "checked" : ""}><span class="tr"></span><span class="sr-only">Narrow menu</span></label></div></div>
        <div class="card photo-card"><div class="ph-img" style="aspect-ratio:16/8"><img src="img/margalla.webp" alt="Green Margalla hills above a park with a fountain" width="1200" height="900" loading="lazy"><span class="tag glass"><b>Margalla hills</b>The photo behind the glass</span></div><div class="pc-body sub">The background is one photo of the hills above Islamabad, blurred far behind frosted glass in warm grey, olive and brass.</div></div></div>`;
      body.onclick = (e) => { const b = e.target.closest("[data-th]"); if (b) { setTheme(b.dataset.th); themeIcon(); $$("[data-th]", body).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); } };
      body.onchange = (e) => { if (e.target.id === "calm") { S.set.calm = e.target.checked; save(); applySettings(); toast(S.set.calm ? "Calm motion on" : "Calm motion off"); } if (e.target.id === "narrow") setRail(e.target.checked); };
    }
    if (setTab === "data") {
      const items = [["Units", S.units.length], ["Tenants", S.tenants.length], ["Payments", S.pays.length], ["Repair requests", S.jobs.length], ["Expenses", S.exps.length], ["Shared bills", S.bills.length]];
      body.innerHTML = `<div class="set-grid"><div class="card"><div class="card-h"><h3>What is stored</h3><small>kept in this browser only</small></div>${items.map(([l, n]) => `<div class="set-row"><div><b>${l}</b></div><output>${num(n)}</output></div>`).join("")}</div>
        <div class="card"><div class="card-h"><h3>Export and reset</h3><small>take your data with you, or start the demo again</small></div>
        <div class="set-row"><div><b>Export everything</b><small>All data as one JSON file</small></div><button class="btn sm" type="button" id="exp-json">${ic("download")}Export</button></div>
        <div class="set-row"><div><b>Reset demo data</b><small>Every unit, tenant, payment and repair back to how it started</small></div><button class="btn sm danger" type="button" id="reset">${ic("refresh")}Reset demo data</button></div></div></div>`;
      body.onclick = (e) => {
        if (e.target.closest("#reset")) resetDemo();
        if (e.target.closest("#exp-json")) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })); a.download = "rent-roll-data.json"; document.body.appendChild(a); a.click(); a.remove(); toast("rent-roll-data.json downloaded"); }
      };
    }
    enter(body);
  };
  draw();
  $(".tabs", v).addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; setTab = b.dataset.tab; $$("[data-tab]", v).forEach((x) => x.setAttribute("aria-selected", String(x === b))); body.oninput = body.onchange = body.onclick = null; draw(); });
};

/* =====================================================================
   Boot: shell wiring, command search, live feed
   ===================================================================== */
const cmds = () => pageCmds(PAGES.map((p) => [p[0], p[1], p[2]]), [
  { label: "Record a payment", icon: "coin", hint: "Rent", run: () => recordPayment() },
  { label: "Send rent reminders", icon: "msg", hint: "Rent", run: () => reminders() },
  { label: "Add a tenant", icon: "user", hint: "Tenants", run: () => tenantForm() },
  { label: "New repair request", icon: "wrench", hint: "Maintenance", run: () => jobForm() },
  { label: "Add an expense", icon: "receipt", hint: "Expenses", run: () => expenseForm() },
  { label: "Switch theme", icon: "moon", run: () => { setTheme(APP.theme() === "dark" ? "light" : "dark"); themeIcon(); rerender(); } },
]).concat(S.tenants.map((t) => ({ label: t.name + " · " + ushort(t.unit), icon: "user", hint: "Tenant", run: () => openTenant(t.id) })))
  .concat(S.units.map((u) => ({ label: propOf(u.prop).short + " · " + ulabel(u), icon: "door", hint: tenantIn(u.id) ? "Unit" : "Vacant unit", run: () => openUnit(u.id) })))
  .concat(S.pays.filter((p) => p.m >= mshift(CURM, -1)).slice(-60).reverse().map((p) => ({ label: "Receipt " + p.no + " · " + (tenantOf(p.t) || { name: "Former tenant" }).name, icon: "receipt", hint: money(p.amt), run: () => receipt(p) })));
function applySettings() { document.documentElement.classList.toggle("calm", !!S.set.calm); }
function themeIcon() { $$("[data-theme-toggle]").forEach((b) => (b.innerHTML = ic(APP.theme() === "dark" ? "sun" : "moon"))); }
function setRail(on) {
  document.documentElement.classList.toggle("rail", on);
  const c = $("#collapse");
  c.setAttribute("aria-pressed", String(on)); c.setAttribute("aria-label", on ? "Expand menu" : "Collapse menu"); c.innerHTML = ic(on ? "expand" : "collapse");
  setTimeout(() => { moveMarkers(); redrawCharts(); }, 340);
}
function boot() {
  drawNav();
  $(".menu-btn").innerHTML = ic("menu"); $("#search-ic").innerHTML = ic("search"); $("#quick").innerHTML = ic("plus");
  $$("[data-i]").forEach((s) => (s.outerHTML = ic(s.dataset.i)));
  initShell(cmds);
  themeIcon(); applySettings(); feedSeed(); drawChrome();
  setRail(false);
  $("#collapse").addEventListener("click", () => setRail(!document.documentElement.classList.contains("rail")));
  $("#bell").addEventListener("click", () => bellPop($("#bell")));
  $("#quick").addEventListener("click", () => quickPop($("#quick")));
  $("#me").addEventListener("click", () => mePop($("#me")));
  /* after the core theme toggle: new icon, and the building redraws its sky */
  document.addEventListener("click", (e) => { if (e.target.closest("[data-theme-toggle]")) { themeIcon(); if (curPage === "overview") { const st = $("#stage"); if (st) { st.innerHTML = bldSVG(bldProp) + bldOverlay(bldProp); countAll(st); } } } });
  every(5200, feedTick);
  every(60000, () => $$("#feed time[data-at]").forEach((t) => (t.textContent = relT(+t.dataset.at))));
  startRouter(PAGES.map((p) => p[0]), "overview", (name) => render(name));
}
boot();
</script>
