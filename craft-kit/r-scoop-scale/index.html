<!doctype html>
<!-- Chill & Craft · Scoop Scale · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoop Scale · weigh and add to cart</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    color-scheme: light;
    --bg1: #fdf6e8;
    --bg2: #efdcbc;
    --weave: rgba(140, 95, 40, .07);
    --ink: #2b2118;
    --muted: #85705a;
    --card: #fffaf1;
    --line: #eadbc2;
    --chip: #f6ecdb;
    --teal: #1f6f6a;
    --teal-d: #134a47;
    --saffron: #f2a51e;
    --saffron-d: #c97c06;
    --kraft: #cf9f66;
    --kraft-d: #a8763f;
    --dial: #fbf5e7;
    --focus: #1d4ed8;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1a2422;
    --bg2: #0b1110;
    --weave: rgba(170, 230, 210, .035);
    --ink: #f4ede1;
    --muted: #a3b2ab;
    --card: #1b2422;
    --line: #2c3a37;
    --chip: #233130;
    --teal: #2a8f87;
    --teal-d: #18605a;
    --dial: #f3ecdc;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  /* ---------- Stage: warm jute weave with a soft lamp glow ---------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(-45deg, var(--weave) 0 2px, transparent 2px 9px),
      radial-gradient(900px 600px at 50% 30%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { width: 100%; display: grid; place-items: center; padding: 18px 16px; }

  /* ---------- The stall card ---------- */
  .shop {
    position: relative;
    width: min(400px, 100%);
    padding: 16px 16px 18px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px rgba(80, 45, 10, .55), 0 2px 0 rgba(255, 255, 255, .55) inset;
  }
  :root[data-theme="dark"] .shop { box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .05) inset; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { flex: none; width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--teal); box-shadow: 0 8px 16px -10px var(--teal-d); }
  .logo svg { width: 24px; height: 24px; }
  .leaf { transform-origin: 12px 20px; animation: sway 3.6s ease-in-out infinite; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
  .brand > div { min-width: 0; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cartBtn {
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 12px 0 10px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .35s var(--spring), border-color .2s;
  }
  .cartBtn:hover { transform: translateY(-1px); border-color: var(--kraft); }
  .cartBtn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .cartBtn svg { width: 22px; height: 22px; }
  .badge {
    position: absolute;
    top: -7px;
    left: 22px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--saffron);
    color: #2b1a00;
    font-size: 11px;
    font-weight: 800;
    line-height: 19px;
    text-align: center;
    box-shadow: 0 0 0 2px var(--card);
  }
  .badge.zero { background: var(--line); color: var(--muted); }
  .sum { font-variant-numeric: tabular-nums; }

  /* ---------- Cart list that drops down from the header ---------- */
  .panel {
    position: absolute;
    z-index: 40;
    top: 66px;
    right: 12px;
    width: min(290px, calc(100% - 24px));
    padding: 12px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 24px 50px -20px rgba(40, 20, 0, .45);
    transform-origin: 85% 0;
    animation: drop .45s var(--spring);
  }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; font-weight: 750; }
  .panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 190px; overflow: auto; }
  .panel li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 11px; background: var(--chip); font-size: 12.5px; animation: rowIn .4s var(--spring) both; }
  .panel li span { flex: 1; min-width: 0; }
  .panel li b { font-variant-numeric: tabular-nums; }
  .panel .x { width: 26px; height: 26px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
  .panel .x:hover { background: var(--line); color: var(--ink); }
  .panel .x:focus-visible, .panel .clear:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .panel .empty { font-size: 12.5px; color: var(--muted); padding: 6px 2px; }
  .panel .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; }
  .panel .clear { border: 0; background: none; color: var(--teal); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
  :root[data-theme="dark"] .panel .clear { color: #6fd3c9; }

  /* ---------- The scale, the bag and the scoop ---------- */
  .rig { position: relative; width: 300px; height: 282px; margin: 16px auto 0; }
  .scale { position: absolute; left: 0; bottom: 0; width: 300px; height: 170px; overflow: visible; }
  .glint { animation: glint 5s ease-in-out infinite; }
  .scoop { position: absolute; left: -10px; top: -2px; width: 120px; height: 61px; overflow: visible; }
  .scoop.idle { animation: bob 2.8s ease-in-out infinite; }

  .bag { position: absolute; left: 98px; bottom: 136px; width: 104px; height: 122px; transform-origin: 50% 100%; z-index: 5; }
  .bag svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .flap {
    position: absolute;
    left: 8px;
    right: 8px;
    top: 9px;
    height: 24px;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, #b98450, #d6a86e);
    clip-path: polygon(0 0, 100% 0, 100% 78%, 92% 100%, 84% 78%, 76% 100%, 68% 78%, 60% 100%, 52% 78%, 44% 100%, 36% 78%, 28% 100%, 20% 78%, 12% 100%, 4% 78%, 0 100%);
    transform-origin: 50% 0;
    transform: perspective(300px) rotateX(-92deg);
    opacity: 0;
  }
  .bag.closed .flap { opacity: 1; transform: perspective(300px) rotateX(0); transition: transform .5s var(--spring), opacity .1s; }
  .sticker {
    position: absolute;
    right: -10px;
    bottom: 10px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    text-align: center;
    background: radial-gradient(circle at 35% 30%, #ffd36b, var(--saffron) 60%, var(--saffron-d));
    color: #3a2300;
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1.05;
    box-shadow: 0 6px 12px -6px rgba(90, 50, 0, .7), inset 0 0 0 2px rgba(255, 255, 255, .35);
    opacity: 0;
    transform: scale(1.8) rotate(-30deg);
  }
  .sticker small { display: block; font-size: 8.5px; font-weight: 700; opacity: .8; }
  .bag.stamped .sticker { opacity: 1; transform: scale(1) rotate(-10deg); transition: transform .45s var(--spring), opacity .15s; }

  /* ---------- Pickers ---------- */
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; font-size: 11.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .nuts { margin-top: 10px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 8px 7px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--chip);
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 700;
    transition: transform .35s var(--spring), border-color .2s, background .2s, box-shadow .2s;
  }
  .opt svg { flex: none; width: 19px; height: 19px; }
  @media (max-width: 400px) { .opt svg { display: none; } .opt { justify-content: center; text-align: center; } }
  .opt small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .opt span { min-width: 0; }
  .opt:hover { transform: translateY(-2px); }
  input:checked + .opt { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 12%, var(--card)); box-shadow: 0 8px 18px -12px var(--teal); }
  input:focus-visible + .opt { outline: 3px solid var(--focus); outline-offset: 2px; }
  .weights { margin-top: 12px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 14px; background: var(--chip); border: 1px solid var(--line); position: relative; }
  .seg .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 10px; background: var(--card); box-shadow: 0 4px 12px -6px rgba(60, 30, 0, .45); transition: transform .45s var(--spring); }
  .seg label { position: relative; z-index: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 750; cursor: pointer; border-radius: 10px; color: var(--muted); transition: color .2s; }
  .seg input:checked + label { color: var(--ink); }
  .seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 0; }

  .buy { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .price { flex: 1; min-width: 0; }
  .price span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price b { font-size: 21px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .add {
    --p: 0;
    position: relative;
    overflow: hidden;
    flex: none;
    height: 50px;
    min-width: 154px;
    padding: 0 18px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, #2b8a83, var(--teal-d));
    color: #f3fffd;
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 14px 24px -14px var(--teal-d), inset 0 1px 0 rgba(255, 255, 255, .2), inset 0 -3px 0 rgba(0, 0, 0, .18);
    transition: transform .35s var(--spring), filter .2s;
  }
  .add::before { content: ""; position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--p)); background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .16) 0 8px, rgba(255, 255, 255, .06) 8px 16px); }
  .add span { position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .add:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .add:active { transform: scale(.96); }
  .add:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .add[aria-disabled="true"] { cursor: progress; }
  .add.done { background: linear-gradient(180deg, #f6b938, var(--saffron-d)); color: #2b1a00; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(1deg); } }
  @keyframes glint { 0%, 70% { transform: translateX(-70px); } 100% { transform: translateX(70px); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px) scale(.92); } }
  @keyframes rowIn { from { opacity: 0; transform: translateX(12px); } }

  /* Short phones: shrink the rig a little so the whole stall fits */
  @media (max-height: 640px) { .rig { transform: scale(.9); margin: -10px auto -14px; } }

  /* Calm mode: every step still works, without big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="shop" aria-labelledby="title">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><g class="leaf"><path d="M12 21c0-6 1-11 7-15-1 6-3 10-7 12" fill="#bfe8d8" /><path d="M12 21c0-5-1-9-6-12 0 5 2 9 6 11" fill="#8fd1bb" /></g></svg>
        </span>
        <div>
          <h1 id="title">Dry fruit stall</h1>
          <p>Weighed fresh, hand packed</p>
        </div>
      </div>
      <button class="cartBtn" id="cartBtn" type="button" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" fill="var(--kraft)" /><path d="M9 10V7a3 3 0 0 1 6 0v3" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" /></svg>
        <span class="badge zero" id="badge">0</span>
        <span class="sum" id="sum">PKR 0</span>
        <span class="vh" id="cartLabel">Open cart</span>
      </button>
    </header>

    <div class="panel" id="panel" hidden role="region" aria-label="Cart">
      <h2>Your bags</h2>
      <ul id="list"></ul>
      <div class="foot"><span>Total <b id="panelTotal">PKR 0</b></span><button class="clear" id="clear" type="button">Empty cart</button></div>
    </div>

    <div class="rig" aria-hidden="true">
      <!-- the scoop pours from the top left into the open bag -->
      <svg class="scoop idle" id="scoop" viewBox="0 0 150 76">
        <defs>
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f4" /><stop offset=".55" stop-color="#b9c2c2" /><stop offset="1" stop-color="#7f8a8a" /></linearGradient>
        </defs>
        <g id="arm" transform="rotate(-14 12 40)">
          <rect x="4" y="36" width="58" height="9" rx="4.5" fill="#6b4a2b" />
          <rect x="8" y="38" width="44" height="2" rx="1" fill="#8d6a46" />
          <path d="M58 26 L122 18 Q136 17 136 31 L136 46 Q136 60 122 60 L72 60 Q58 60 58 47 Z" fill="url(#steel)" />
          <ellipse cx="129" cy="38" rx="7" ry="21" fill="#5e6767" />
          <g id="scoopNuts"></g>
          <path d="M62 30 L120 23" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" />
        </g>
      </svg>

      <div class="bag" id="bag">
        <svg viewBox="0 0 104 122">
          <defs>
            <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b47f48" /><stop offset=".22" stop-color="#d4a46b" /><stop offset=".7" stop-color="#d9ab72" /><stop offset="1" stop-color="#b07a43" /></linearGradient>
            <clipPath id="winClip"><rect id="winFill" x="26" y="98" width="52" height="0" /></clipPath>
          </defs>
          <ellipse cx="52" cy="120" rx="50" ry="4" fill="rgba(40,20,0,.18)" />
          <path d="M10 14 L94 14 L100 114 Q100 120 94 120 L10 120 Q4 120 4 114 Z" fill="url(#kraft)" />
          <path d="M10 14 L4 114 L15 114 L19 14 Z" fill="#8a5a2a" opacity=".22" />
          <path d="M94 14 L100 114 L89 114 L85 14 Z" fill="#8a5a2a" opacity=".22" />
          <ellipse id="mouth" cx="52" cy="14" rx="42" ry="6" fill="#5a3a1c" />
          <path d="M10 14 Q52 24 94 14" fill="none" stroke="#e5bd86" stroke-width="2" />
          <text x="52" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.2" fill="#6e4720" opacity=".75">FRESH · HAND PACKED</text>
          <rect x="26" y="50" width="52" height="48" rx="10" fill="rgba(255,248,232,.55)" />
          <g clip-path="url(#winClip)"><rect x="26" y="50" width="52" height="48" fill="#6b4523" /><g id="winNuts"></g></g>
          <rect x="26" y="50" width="52" height="48" rx="10" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" />
          <path d="M31 57 L42 54" stroke="#fff" stroke-opacity=".8" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        <div class="flap"></div>
        <div class="sticker" id="sticker"><div><span id="stkW">500 g</span><small>weighed</small></div></div>
      </div>

      <svg class="scale" viewBox="0 0 300 170">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c8a82" /><stop offset="1" stop-color="#155450" /></linearGradient>
          <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f2" /><stop offset="1" stop-color="#9ea9a8" /></linearGradient>
          <clipPath id="faceClip"><circle cx="150" cy="110" r="40" /></clipPath>
        </defs>
        <ellipse cx="150" cy="166" rx="118" ry="6" fill="rgba(40,20,0,.2)" />
        <rect x="56" y="160" width="26" height="8" rx="3" fill="#0e3734" />
        <rect x="218" y="160" width="26" height="8" rx="3" fill="#0e3734" />
        <path d="M60 58 H240 Q252 58 254 70 L266 152 Q268 162 256 162 H44 Q32 162 34 152 L46 70 Q48 58 60 58 Z" fill="url(#body)" />
        <path d="M62 62 H238" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round" />
        <g id="plat">
          <rect x="140" y="42" width="20" height="17" rx="3" fill="#0f3e3a" />
          <rect x="66" y="34" width="168" height="10" rx="5" fill="url(#plate)" />
          <rect x="70" y="34" width="160" height="2.5" rx="1.25" fill="#fff" opacity=".8" />
        </g>
        <circle cx="150" cy="110" r="47" fill="#0d3a37" />
        <circle cx="150" cy="110" r="44" fill="#c9a24e" />
        <circle cx="150" cy="110" r="40" fill="var(--dial)" />
        <g id="ticks"></g>
        <text id="readout" x="150" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1f3b39">0 g</text>
        <g class="needle" id="needle">
          <path d="M148.4 116 L150 75 L151.6 116 Z" fill="#d6452b" />
          <circle cx="150" cy="110" r="5" fill="#2b2118" />
          <circle cx="150" cy="110" r="2" fill="#f2a51e" />
        </g>
        <g clip-path="url(#faceClip)"><path class="glint" d="M120 60 L140 60 L170 160 L150 160 Z" fill="#fff" opacity=".35" /></g>
      </svg>
    </div>

    <fieldset class="nuts">
      <legend>Choose</legend>
      <div class="row" id="nutRow"></div>
    </fieldset>

    <fieldset class="weights">
      <legend>Weight</legend>
      <div class="seg" id="seg">
        <span class="pill" id="pill" aria-hidden="true"></span>
        <input class="vh" type="radio" name="wt" id="w250" value="250"><label for="w250">250 g</label>
        <input class="vh" type="radio" name="wt" id="w500" value="500" checked><label for="w500">500 g</label>
        <input class="vh" type="radio" name="wt" id="w1000" value="1000"><label for="w1000">1 kg</label>
      </div>
    </fieldset>

    <div class="buy">
      <p class="price" style="margin:0"><span id="line">Almonds · 500 g</span><b id="price">PKR 1,600</b></p>
      <button class="add" id="add" type="button"><span id="addTxt">Add to cart</span></button>
    </div>
  </section>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Scoop Scale: pick a dry fruit and weight, watch it weighed into a kraft bag that flies to the cart ----------
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const PRODUCTS = {
    almond: { name: "Almonds", perKg: 3200, fill: "#c98d55", dark: "#9b6334", shape: "almond" },
    pista: { name: "Pistachios", perKg: 5600, fill: "#e2cf9c", dark: "#84a043", shape: "pista" },
    walnut: { name: "Walnuts", perKg: 2800, fill: "#b8885a", dark: "#7a522c", shape: "walnut" },
  };
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 120) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  function tween(ms, fn, ease) {
    ease = ease || ((t) => 1 - Math.pow(1 - t, 3));
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) {
        const t = Math.min(1, (now - s) / ms);
        fn(ease(t));
        if (t < 1) requestAnimationFrame(f); else res();
      });
    });
  }

  const bag = $("bag"), scoop = $("scoop"), arm = $("arm"), add = $("add"), addTxt = $("addTxt");
  const needle = $("needle"), readout = $("readout"), plat = $("plat"), winFill = $("winFill"), winNuts = $("winNuts");
  const status = $("status"), cartBtn = $("cartBtn"), badge = $("badge"), sum = $("sum"), panel = $("panel"), list = $("list");

  // ---------- Small nut drawings (SVG for the chips, the scoop and the bag window) ----------
  function nutSVG(kind, x, y, s, rot) {
    const p = PRODUCTS[kind], g = document.createElementNS(NS, "g");
    g.setAttribute("transform", `translate(${x} ${y}) rotate(${rot}) scale(${s})`);
    if (kind === "almond") g.innerHTML = `<path d="M-7 0 Q-4 -4.6 6.5 -1 Q8 0 6.5 1 Q-4 4.6 -7 0Z" fill="${p.fill}"/><path d="M-4 -.6 Q0 -1.6 4 -.6" stroke="${p.dark}" stroke-width=".9" fill="none"/>`;
    else if (kind === "pista") g.innerHTML = `<ellipse rx="6" ry="4" fill="${p.fill}"/><path d="M-3 -1 Q0 1.6 3.4 -1.2" stroke="${p.dark}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    else g.innerHTML = `<circle r="5.2" fill="${p.fill}"/><path d="M0 -5 V5 M-3.6 -2.6 Q-1 0 -3.6 2.6 M3.6 -2.6 Q1 0 3.6 2.6" stroke="${p.dark}" stroke-width=".9" fill="none"/>`;
    return g;
  }
  // Build the product chips
  const nutRow = $("nutRow");
  Object.entries(PRODUCTS).forEach(([key, p], i) => {
    const id = "n-" + key;
    nutRow.insertAdjacentHTML("beforeend", `<input class="vh" type="radio" name="nut" id="${id}" value="${key}" ${i ? "" : "checked"}><label class="opt" for="${id}"><svg viewBox="-11 -11 22 22" aria-hidden="true"></svg><span>${p.name}<small>${fmt(p.perKg)}/kg</small></span></label>`);
    const svg = nutRow.querySelector(`label[for="${id}"] svg`);
    svg.appendChild(nutSVG(key, -3, 2, 1.05, -20));
    svg.appendChild(nutSVG(key, 3.5, -3, .95, 25));
  });

  // Fill the scoop and the bag window with the chosen nut
  function paintNuts(kind) {
    const sn = $("scoopNuts");
    sn.innerHTML = "";
    [[96, 22, -10], [108, 21, 15], [118, 20, -30], [102, 16, 40], [114, 14, 0]].forEach(([x, y, r]) => sn.appendChild(nutSVG(kind, x, y, 1.1, r)));
    winNuts.innerHTML = "";
    for (let row = 0; row < 7; row++) for (let col = 0; col < 6; col++) {
      winNuts.appendChild(nutSVG(kind, 28 + col * 9.4 + (row % 2) * 4.6, 96 - row * 7.2, 1.1, (row * 37 + col * 61) % 180 - 90));
    }
  }

  // ---------- Dial ticks: 0..1000 g over 270 degrees ----------
  const ang = (g) => -135 + 270 * (g / 1000);
  (function ticks() {
    const t = $("ticks");
    for (let g = 0; g <= 1000; g += 50) {
      const a = ang(g) * Math.PI / 180, major = g % 250 === 0, r1 = major ? 30 : 34;
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", 150 + Math.sin(a) * r1); l.setAttribute("y1", 110 - Math.cos(a) * r1);
      l.setAttribute("x2", 150 + Math.sin(a) * 38); l.setAttribute("y2", 110 - Math.cos(a) * 38);
      l.setAttribute("stroke", major ? "#1f3b39" : "#7c8c88"); l.setAttribute("stroke-width", major ? 1.8 : 1);
      t.appendChild(l);
      if (major) {
        const tx = document.createElementNS(NS, "text");
        tx.setAttribute("x", 150 + Math.sin(a) * 22); tx.setAttribute("y", 112.5 - Math.cos(a) * 22);
        tx.setAttribute("text-anchor", "middle"); tx.setAttribute("font-size", "6.5"); tx.setAttribute("font-weight", "700");
        tx.setAttribute("font-family", "system-ui, sans-serif"); tx.setAttribute("fill", "#456461");
        tx.textContent = g === 1000 ? "1kg" : g;
        t.appendChild(tx);
      }
    }
  })();

  // ---------- Needle spring: always running, cheap. target grams -> angle with overshoot ----------
  const dial = { a: ang(0), v: 0, target: 0, dip: 0, dipV: 0 };
  let lastT = performance.now();
  function dialLoop(now) {
    const dt = Math.min(.033, (now - lastT) / 1000); lastT = now;
    const T = ang(dial.target);
    if (calm()) { dial.a = T; dial.v = 0; }
    else { dial.v += ((T - dial.a) * 140 - dial.v * 9) * dt; dial.a += dial.v * dt; }
    // the platform dips with the weight, and gets kicked when a nut lands
    const dipT = dial.target / 1000 * 4;
    dial.dipV += ((dipT - dial.dip) * 260 - dial.dipV * 14) * dt; dial.dip += dial.dipV * dt;
    const idle = dial.target === 0 && !busy && !calm() ? Math.sin(now / 420) * .5 : 0; // tiny tremble at rest
    needle.setAttribute("transform", `rotate(${(dial.a + idle).toFixed(2)} 150 110)`);
    plat.setAttribute("transform", `translate(0 ${dial.dip.toFixed(2)})`);
    if (!flying) bag.style.translate = `0 ${dial.dip.toFixed(2)}px`;
    const g = Math.max(0, Math.round((dial.a + 135) / 270 * 1000));
    readout.textContent = g >= 1000 ? (g / 1000).toFixed(2) + " kg" : g + " g";
    requestAnimationFrame(dialLoop);
  }

  // ---------- Particles: nuts in flight, sparkles, trail ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false, fxLast = 0;
  function sizeFx() { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  sizeFx(); addEventListener("resize", sizeFx);
  function emit(P) { if (calm()) return; parts.push(Object.assign({ life: 0, rot: Math.random() * 6, vr: (Math.random() - .5) * 10 }, P)); if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(drawFx); } }
  function drawNut(p) {
    const k = PRODUCTS[p.nut];
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1.15, 1.15);
    ctx.fillStyle = k.fill; ctx.strokeStyle = k.dark; ctx.lineWidth = 1;
    ctx.beginPath();
    if (k.shape === "almond") ctx.ellipse(0, 0, 6.5, 3.6, 0, 0, 7); else if (k.shape === "pista") ctx.ellipse(0, 0, 5.6, 3.8, 0, 0, 7); else ctx.arc(0, 0, 4.8, 0, 7);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.stroke();
    ctx.restore();
  }
  function drawFx(now) {
    const dt = Math.min(.04, (now - fxLast) / 1000); fxLast = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.kind === "nut") {
        p.vy += 1100 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.y >= p.ty) { parts.splice(i, 1); p.onLand && p.onLand(); continue; }
        drawNut(p);
      } else {
        if (p.life >= p.max) { parts.splice(i, 1); continue; }
        p.vx *= .96; p.vy = p.vy * .96 + (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        const a = 1 - p.life / p.max;
        ctx.fillStyle = p.color.replace("A", a.toFixed(3));
        ctx.beginPath();
        if (p.kind === "star") { // four-point twinkle
          const r = p.size * (0.6 + a * .6);
          ctx.moveTo(p.x, p.y - r); ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r); ctx.quadraticCurveTo(p.x, p.y, p.x - r, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r);
        } else ctx.arc(p.x, p.y, p.size * a, 0, 7);
        ctx.fill();
      }
    }
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function burst(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 190;
      emit({ kind: i % 3 ? "dot" : "star", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, g: 260, max: .5 + Math.random() * .4, size: 2 + Math.random() * 3.4, color: colors[i % colors.length] });
    }
  }

  // ---------- Selection state ----------
  const cart = [];
  let busy = false, flying = false;
  const sel = () => ({ kind: document.querySelector('input[name="nut"]:checked').value, grams: +document.querySelector('input[name="wt"]:checked').value });
  const priceOf = (s) => PRODUCTS[s.kind].perKg * s.grams / 1000;
  const wLabel = (g) => (g >= 1000 ? g / 1000 + " kg" : g + " g");
  function refresh() {
    const s = sel();
    $("line").textContent = PRODUCTS[s.kind].name + " · " + wLabel(s.grams);
    $("price").textContent = fmt(priceOf(s));
    const idx = ["250", "500", "1000"].indexOf(String(s.grams));
    $("pill").style.transform = `translateX(${idx * 100}%)`;
    if (!busy) paintNuts(s.kind);
  }
  document.querySelectorAll('input[name="nut"], input[name="wt"]').forEach((r) => r.addEventListener("change", refresh));

  // ---------- Cart ----------
  const total = () => cart.reduce((a, c) => a + c.price, 0);
  let shownTotal = 0;
  function renderCart(animateSum) {
    const n = cart.length, t = total();
    badge.textContent = n;
    badge.classList.toggle("zero", n === 0);
    const from = shownTotal;
    shownTotal = t;
    if (animateSum && !calm()) tween(600, (k) => { sum.textContent = fmt(from + (t - from) * k); });
    else sum.textContent = fmt(t);
    $("panelTotal").textContent = fmt(t);
    $("cartLabel").textContent = `Open cart, ${n} ${n === 1 ? "bag" : "bags"}, ${fmt(t)}`;
    list.innerHTML = n ? "" : '<li class="empty">No bags yet. Weigh something.</li>';
    cart.forEach((c, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${PRODUCTS[c.kind].name} · ${wLabel(c.grams)}</span><b>${fmt(c.price)}</b><button class="x" type="button" aria-label="Remove ${PRODUCTS[c.kind].name} ${wLabel(c.grams)}">×</button>`;
      li.querySelector("button").addEventListener("click", () => { cart.splice(i, 1); renderCart(true); say("Removed. Cart total " + fmt(total()) + "."); (list.querySelector("button") || $("clear")).focus(); });
      list.appendChild(li);
    });
  }
  function setPanel(open) {
    panel.hidden = !open;
    cartBtn.setAttribute("aria-expanded", String(open));
  }
  cartBtn.addEventListener("click", () => setPanel(panel.hidden));
  $("clear").addEventListener("click", () => { cart.length = 0; renderCart(true); say("Cart emptied."); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) { setPanel(false); cartBtn.focus(); } });
  addEventListener("pointerdown", (e) => { if (!panel.hidden && !panel.contains(e.target) && !cartBtn.contains(e.target)) setPanel(false); });
  function say(msg) { status.textContent = msg; }

  // Where a point of an element's viewBox lands on the page
  function pagePoint(svg, x, y) {
    const m = svg.getScreenCTM(), pt = svg.createSVGPoint();
    pt.x = x; pt.y = y;
    return pt.matrixTransform(m);
  }
  // The scoop arm turns around the handle end (12, 40); armA is its angle in degrees
  let armA = -14;
  function setArm(a) { armA = a; arm.setAttribute("transform", `rotate(${a.toFixed(2)} 12 40)`); }
  function turnArm(to, ms) { const from = armA; return tween(ms, (k) => setArm(from + (to - from) * k), (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }); }
  // The open end of the scoop on the page, for the current angle
  function lipPoint() {
    const r = armA * Math.PI / 180, dx = 133 - 12, dy = 40 - 40;
    return pagePoint(scoop, 12 + dx * Math.cos(r) - dy * Math.sin(r), 40 + dx * Math.sin(r) + dy * Math.cos(r));
  }

  // ---------- The main sequence ----------
  async function weighAndAdd() {
    if (busy) return;
    busy = true;
    setPanel(false);
    const s = sel(), price = priceOf(s), kind = s.kind;
    paintNuts(kind);
    add.setAttribute("aria-disabled", "true");
    addTxt.textContent = "Weighing…";
    $("stkW").textContent = wLabel(s.grams);
    say(`Weighing ${wLabel(s.grams)} of ${PRODUCTS[kind].name}…`);

    // 1. anticipation: the button squashes, the bag puffs open, the scoop leans back
    play(add, [{ transform: "scale(1)" }, { transform: "scale(.92, .86)", offset: .35 }, { transform: "scale(1.03)", offset: .7 }, { transform: "scale(1)" }], { duration: 420 });
    play(bag, [{ transform: "scale(1)" }, { transform: "scale(1.08, .92)", offset: .4 }, { transform: "scale(.97, 1.04)", offset: .75 }, { transform: "scale(1)" }], { duration: 460 });
    scoop.classList.remove("idle");
    await turnArm(-20, 300);

    // 2. main: the scoop tips and nuts arc into the bag; the needle swings as they land
    await turnArm(4, 280);
    const N = s.grams === 250 ? 16 : s.grams === 500 ? 26 : 40, pourMs = s.grams === 1000 ? 1500 : s.grams === 500 ? 1100 : 800;
    const sn = $("scoopNuts");
    sn.style.transition = "opacity " + pourMs + "ms linear"; sn.style.opacity = "0";
    let landed = 0;
    const done = new Promise((res) => {
      if (calm()) { dial.target = s.grams; winFill.setAttribute("y", 50); winFill.setAttribute("height", 48); res(); return; }
      for (let i = 0; i < N; i++) setTimeout(() => {
        setArm(4 + Math.sin(i * 1.3) * 2.5); // the scoop jiggles while it pours
        const lip = lipPoint(), mouth = pagePoint(bag.querySelector("svg"), 52, 16);
        const sc = bag.getBoundingClientRect().width / 104;
        const tx = mouth.x + (Math.random() - .3) * 56 * sc, ty = mouth.y + 3, T = .34 + Math.random() * .12;
        emit({ kind: "nut", nut: kind, x: lip.x + (Math.random() - .5) * 6, y: lip.y + (Math.random() - .5) * 6, vx: (tx - lip.x) / T, vy: (ty - lip.y - .5 * 1100 * T * T) / T, ty, onLand() {
          landed++;
          const f = landed / N;
          dial.target = s.grams * f;
          dial.dipV += 18; // a little kick on every landing
          winFill.setAttribute("y", (98 - 48 * f).toFixed(1)); winFill.setAttribute("height", (48 * f).toFixed(1));
          if (landed === N) res();
        } });
        add.style.setProperty("--p", ((i + 1) / N * .7).toFixed(3));
      }, (i / N) * pourMs);
      setTimeout(res, pourMs + 1400); // safety net if a frame is skipped
    });
    await done;
    dial.target = s.grams; winFill.setAttribute("y", 50); winFill.setAttribute("height", 48);
    turnArm(-14, 420).then(() => scoop.classList.add("idle"));
    await wait(520); // let the needle settle with its overshoot

    // 3. progress: the bag folds shut and a weight sticker stamps on
    bag.classList.add("closed");
    $("mouth").style.opacity = "0";
    play(bag, [{ transform: "scale(1)" }, { transform: "scale(.94, 1.06)", offset: .5 }, { transform: "scale(1)" }], { duration: 380 });
    add.style.setProperty("--p", ".85");
    await wait(380);
    bag.classList.add("stamped");
    const st = $("sticker").getBoundingClientRect();
    await wait(170);
    burst(st.left + st.width / 2, st.top + st.height / 2, 10, ["rgba(242,165,30,A)", "rgba(255,230,160,A)"]);
    add.style.setProperty("--p", "1");
    await wait(380);

    // 4. finish: the bag lifts off (needle springs back to 0) and flies along an arc into the cart
    dial.target = 0;
    await flyToCart();
    cart.push({ kind, grams: s.grams, price });
    renderCart(true);
    play(cartBtn, [{ transform: "scale(1)" }, { transform: "scale(1.12, .88)", offset: .3 }, { transform: "scale(.95, 1.06)", offset: .6 }, { transform: "scale(1)" }], { duration: 520 });
    play(badge, [{ transform: "scale(1)" }, { transform: "scale(1.6)", offset: .4 }, { transform: "scale(1)" }], { duration: 480, easing: "cubic-bezier(.3,1.6,.5,1)" });
    const cb = cartBtn.getBoundingClientRect();
    burst(cb.left + 20, cb.top + cb.height / 2, 16, ["rgba(31,111,106,A)", "rgba(242,165,30,A)", "rgba(255,214,120,A)"]);
    add.classList.add("done");
    addTxt.textContent = "Added ✓";
    say(`Added ${wLabel(s.grams)} of ${PRODUCTS[kind].name}, ${fmt(price)}. Cart: ${cart.length} ${cart.length === 1 ? "bag" : "bags"}, ${fmt(total())}.`);

    // 5. reset: a fresh bag pops open on the scale
    await wait(500);
    bag.classList.remove("closed", "stamped");
    $("mouth").style.opacity = "";
    winFill.setAttribute("y", 98); winFill.setAttribute("height", 0);
    bag.style.transform = ""; bag.style.opacity = "";
    flying = false;
    sn.style.transition = "opacity .4s"; sn.style.opacity = "1";
    play(bag, [{ transform: "scale(.2, .05)", opacity: 0 }, { transform: "scale(1.08, .9)", opacity: 1, offset: .55 }, { transform: "scale(.97, 1.04)", offset: .8 }, { transform: "scale(1)" }], { duration: 560 });
    await wait(700);
    add.classList.remove("done");
    add.style.setProperty("--p", 0);
    addTxt.textContent = "Add to cart";
    add.removeAttribute("aria-disabled");
    busy = false;
    paintNuts(sel().kind);
  }

  // The real bag travels on a curved path (sampled Bézier) with a sparkle trail
  async function flyToCart() {
    const a = bag.getBoundingClientRect(), b = cartBtn.getBoundingClientRect();
    flying = true;
    bag.style.translate = "0 0";
    if (calm()) { bag.style.opacity = "0"; return; }
    const sx = a.left + a.width / 2, sy = a.top + a.height / 2, ex = b.left + 20, ey = b.top + b.height / 2;
    const cx = (sx + ex) / 2 + 30, cy = Math.min(sy, ey) - 90;
    const frames = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, u = 1 - t;
      const x = u * u * sx + 2 * u * t * cx + t * t * ex, y = u * u * sy + 2 * u * t * cy + t * t * ey;
      const s = i < 3 ? 1 + i * .04 : 1.12 - t * .96;
      frames.push({ transform: `translate(${(x - sx).toFixed(1)}px, ${(y - sy).toFixed(1)}px) rotate(${(Math.sin(t * Math.PI) * -22).toFixed(1)}deg) scale(${s.toFixed(3)})`, opacity: t > .9 ? .3 : 1 });
    }
    bag.style.zIndex = 60;
    bag.style.transformOrigin = "50% 50%";
    const anim = bag.animate(frames, { duration: 860, easing: "cubic-bezier(.5,0,.3,1)", fill: "forwards" });
    let on = true;
    (function trail() {
      if (!on) return;
      const r = bag.getBoundingClientRect();
      emit({ kind: "dot", x: r.left + r.width / 2 + (Math.random() - .5) * 8, y: r.top + r.height / 2, vx: 0, vy: 10, max: .45, size: 3.2, color: "rgba(242,165,30,A)" });
      requestAnimationFrame(trail);
    })();
    await anim.finished.catch(() => {});
    on = false;
    bag.style.opacity = "0";
    anim.cancel();
    bag.style.zIndex = "";
    bag.style.transformOrigin = "";
  }

  add.addEventListener("click", () => { weighAndAdd(); });

  // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
  const demo = { on: true, timer: 0, n: 0 };
  const DEMO = [["almond", "500"], ["pista", "250"], ["walnut", "1000"]];
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.timer); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  async function runDemo() {
    if (!demo.on) return;
    if (busy) { demo.timer = setTimeout(runDemo, 800); return; }
    const [k, w] = DEMO[demo.n++ % DEMO.length];
    if (cart.length >= 3) { cart.length = 0; renderCart(true); }
    $("n-" + k).checked = true; $("w" + w).checked = true; refresh();
    await wait(450);
    if (!demo.on) return;
    await weighAndAdd();
    if (demo.on) demo.timer = setTimeout(runDemo, 2200);
  }

  refresh();
  renderCart(false);
  requestAnimationFrame(dialLoop);
  demo.timer = setTimeout(runDemo, 250);
</script>
</body>
</html>
