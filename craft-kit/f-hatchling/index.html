<!doctype html>
<!-- Chill & Craft · Hatchling · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatchling · hold the egg to hatch a dragon</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    --bg1: #fff7ea;
    --bg2: #f1dfc2;
    --ink: #3b2a1a;
    --muted: #82694d;
    --spot: rgba(255, 255, 255, 0.85);
    --shell1: #fffaf0;
    --shell2: #ecd9b6;
    --nest1: #8a5a32;
    --nest2: #b88150;
    --track: rgba(59, 42, 26, 0.12);
    --crack: #5a3418;
    --btn-bg: #3b2a1a;
    --btn-ink: #fff7ea;
    --ghost: rgba(59, 42, 26, 0.08);
    --focus: #d9480f;
    /* the dragon palette changes with every egg (set by the script) */
    --drag: #2bb39a;
    --drag-hi: #7fe3cc;
    --drag-dk: #1f8f7c;
    --wing: #ff8a65;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #1d2b27; --bg2: #0b1311; --ink: #f3ece0; --muted: #a8b9ad;
      --spot: rgba(255, 236, 170, 0.22); --shell1: #fff4df; --shell2: #d9c19a;
      --nest1: #6b4426; --nest2: #9a6a3e; --track: rgba(243, 236, 224, 0.12);
      --crack: #4a2a12; --btn-bg: #f3ece0; --btn-ink: #13201c;
      --ghost: rgba(243, 236, 224, 0.1); --focus: #ffb347;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #1d2b27; --bg2: #0b1311; --ink: #f3ece0; --muted: #a8b9ad;
    --spot: rgba(255, 236, 170, 0.22); --shell1: #fff4df; --shell2: #d9c19a;
    --nest1: #6b4426; --nest2: #9a6a3e; --track: rgba(243, 236, 224, 0.12);
    --crack: #4a2a12; --btn-bg: #f3ece0; --btn-ink: #13201c;
    --ghost: rgba(243, 236, 224, 0.1); --focus: #ffb347;
    color-scheme: dark;
  }

  /* ---------- Layout ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(90% 70% at 50% 40%, var(--bg1), var(--bg2));
  }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .scene { position: relative; width: min(380px, 90vw, calc(100vh - 190px)); min-width: 260px; aspect-ratio: 1; }
  .scene svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .fx { position: absolute; inset: -10%; width: 120%; height: 120%; pointer-events: none; }
  .scene.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(5px, -2px); }
    30%, 50%, 70% { transform: translate(-7px, 2px); }
    40%, 60% { transform: translate(7px, -1px); }
  }
  .rays { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity 0.8s ease; }
  .rays polygon { fill: var(--wing); opacity: 0.22; }
  .hatched .rays { opacity: 1; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .w1 { stop-color: var(--wing); stop-opacity: 0.75; }
  .w2 { stop-color: var(--wing); stop-opacity: 0; }
  .egg-glow { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .holding .egg-drop { transform: scale(1.04, 0.95); }
  .egg-drop { transition: transform 0.18s ease; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Egg, nest, ring ---------- */
  .sh1 { stop-color: var(--shell1); }
  .sh2 { stop-color: var(--shell2); }
  .spots ellipse { fill: var(--drag-dk); opacity: 0.55; }
  .spots path { fill: none; stroke: var(--drag-dk); stroke-width: 2; opacity: 0.25; }
  .nest-back { fill: var(--nest1); }
  .twig { fill: none; stroke: var(--nest2); stroke-width: 7; stroke-linecap: round; }
  .twig.dk { stroke: var(--nest1); }
  .track { fill: none; stroke: var(--track); stroke-width: 8; }
  .meter { fill: none; stroke: var(--wing); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .crack { fill: none; stroke: var(--crack); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .crack-glow { fill: none; stroke: #ffd36b; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; filter: blur(3px); opacity: 0; }

  /* shell pieces only show from the moment of hatching */
  .shell-piece { opacity: 0; }
  .hatched .shell-piece { opacity: 1; }
  .hatched .whole, .hatched .cracks { opacity: 0; }
  #topShell { transform-box: fill-box; transform-origin: center; transition: transform 0.9s cubic-bezier(.2,.7,.3,1), opacity 0.9s ease 0.2s; }
  .hatched #topShell { transform: translate(70px, -190px) rotate(55deg); opacity: 0; }

  /* ---------- Dragon ---------- */
  .d-body { fill: var(--drag); }
  .d-hi { fill: var(--drag-hi); }
  .d-dk { fill: var(--drag-dk); }
  .d-belly { fill: #fff0c9; }
  .d-line { fill: none; stroke: #e6cf96; stroke-width: 2; stroke-linecap: round; }
  .d-horn { fill: #fff3d6; }
  .d-spike { fill: var(--wing); }
  .d-wing { fill: var(--wing); transform-box: fill-box; transform-origin: 100% 60%; }
  .d-ink { fill: #1d1410; }
  .d-mouth { fill: none; stroke: #1d1410; stroke-width: 2.5; stroke-linecap: round; }
  .d-eye { transform-box: fill-box; transform-origin: center; }
  .bob { transform-box: fill-box; transform-origin: 50% 90%; }
  .rise { transform: translateY(125px); transition: transform 0.75s cubic-bezier(.34,1.56,.64,1) 0.25s; }
  .hatched .rise { transform: translateY(0); }
  .hatched .bob { animation: bob 2.4s ease-in-out infinite; }
  .hatched .d-wing { animation: flap 0.9s ease-in-out infinite; }
  .hatched .d-eye { animation: blink 4s infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes flap { 50% { transform: rotate(16deg); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

  /* Tickle: a giggle wiggle, a fire bubble and smoke puffs */
  .fire, .smoke { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .tickle .bob { animation: giggle 0.5s ease-in-out 2; }
  .tickle .fire { animation: fire 1.3s ease-out forwards; }
  .tickle .smoke { animation: smoke 1.2s ease-out forwards; }
  .tickle .smoke.s2 { animation-delay: 0.15s; }
  @keyframes giggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  @keyframes fire { 0% { opacity: 0; transform: translateY(0) scale(0.2); } 20% { opacity: 1; transform: translateY(-10px) scale(1); } 100% { opacity: 0; transform: translateY(-130px) scale(1.5); } }
  @keyframes smoke { 0% { opacity: 0.7; transform: translateY(0) scale(0.4); } 100% { opacity: 0; transform: translateY(-60px) scale(1.6); } }

  .hearts path { fill: var(--wing); opacity: 0; }
  .hatched .hearts path { animation: heart 2.2s ease-out 0.9s forwards; }
  .hatched .hearts path:nth-child(2) { animation-delay: 1.1s; }
  .hatched .hearts path:nth-child(3) { animation-delay: 1.3s; }
  @keyframes heart { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-80px); } }

  /* a new egg drops into the nest */
  .egg-drop { transform-box: fill-box; transform-origin: 50% 100%; }
  .fresh .egg-drop { animation: drop 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes drop { from { transform: translateY(-60px) scale(0.85); opacity: 0; } }
  .no-anim, .no-anim * { transition: none !important; animation: none !important; }

  /* Invisible button over the egg: hold it (pointer, Space or Enter) */
  .egg-btn {
    position: absolute;
    left: 50%;
    top: 59%;
    width: 46%;
    height: 54%;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
    background: transparent;
    cursor: grab;
    touch-action: none;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .egg-btn:active { cursor: grabbing; }
  .egg-btn:focus-visible { outline: 3px dashed var(--focus); outline-offset: 6px; }

  /* ---------- Text and buttons ---------- */
  .title { margin: 0; font-size: clamp(20px, 5vw, 26px); font-weight: 800; letter-spacing: -0.01em; text-align: center; }
  .status { margin: 0; min-height: 1.5em; color: var(--muted); font-size: 15px; text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 42px; }
  .btn {
    font: 700 14px system-ui, sans-serif;
    border-radius: 999px;
    padding: 11px 18px;
    border: 0;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--btn-ink);
  }
  .btn.ghost { background: var(--ghost); color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn[hidden] { display: none; }
  .count { margin: 0; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    #topShell, .rise { transition: opacity 0.4s ease; }
    .hatched #topShell { transform: none; }
    .rise { transform: none; opacity: 0; }
    .hatched .rise { opacity: 1; }
    .hatched .bob, .hatched .d-wing, .hatched .d-eye, .tickle .bob, .fresh .egg-drop { animation: none; }
    .scene.shake, .hatched .rays { animation: none; }
    .holding .egg-drop { transform: none; }
    .tickle .fire, .tickle .smoke { animation: fade 1s ease-out forwards; }
    .hatched .hearts path { animation: fade 1.6s ease-out 0.6s forwards; }
    @keyframes fade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  }
</style>
</head>
<body>
<main class="stage" id="root">
  <h1 class="title">Hold the egg to hatch it</h1>

  <div class="scene">
    <svg viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <radialGradient id="shell" cx="38%" cy="30%" r="80%">
          <stop offset="0" class="sh1"/><stop offset="1" class="sh2"/>
        </radialGradient>
        <radialGradient id="fireGrad" cx="50%" cy="60%" r="60%">
          <stop offset="0" stop-color="#fff6b0"/><stop offset="0.5" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff5a1f"/>
        </radialGradient>
        <path id="eggShape" d="M200 140 C245 140 272 205 272 255 C272 300 240 332 200 332 C160 332 128 300 128 255 C128 205 155 140 200 140Z"/>
        <g id="spots" class="spots">
          <ellipse cx="176" cy="178" rx="9" ry="6"/>
          <ellipse cx="226" cy="196" rx="12" ry="8"/>
          <ellipse cx="160" cy="250" rx="10" ry="7"/>
          <ellipse cx="238" cy="268" rx="8" ry="6"/>
          <ellipse cx="200" cy="300" rx="11" ry="6"/>
          <ellipse cx="205" cy="160" rx="5" ry="4"/>
          <path d="M150 210 q12 -10 24 0 M214 236 q12 -10 24 0 M176 284 q12 -10 24 0"/>
        </g>
        <radialGradient id="glowGrad"><stop offset="0" class="w1"/><stop offset="1" class="w2"/></radialGradient>
        <clipPath id="clipTop"><polygon points="0,0 400,0 400,232 290,232 272,232 256,218 238,238 220,216 200,240 180,216 162,238 145,218 128,232 110,232 0,232"/></clipPath>
        <clipPath id="clipBottom"><polygon points="0,400 400,400 400,232 290,232 272,232 256,218 238,238 220,216 200,240 180,216 162,238 145,218 128,232 110,232 0,232"/></clipPath>
        <!-- the dragon shows above the shell rim, or inside the shell -->
        <clipPath id="clipDragon"><rect x="0" y="0" width="400" height="236"/><use href="#eggShape"/></clipPath>
      </defs>

      <!-- Sunburst behind the egg (shows after hatching) and a glow that grows while you hold -->
      <g id="rays" class="rays"></g>
      <circle id="eggGlow" class="egg-glow" cx="200" cy="236" r="150" fill="url(#glowGrad)"/>

      <!-- Hold progress ring -->
      <circle class="track" cx="200" cy="236" r="132"/>
      <circle id="meter" class="meter" cx="200" cy="236" r="132" pathLength="100" transform="rotate(-90 200 236)"/>

      <!-- Back of the nest -->
      <ellipse class="nest-back" cx="200" cy="318" rx="112" ry="30"/>

      <!-- Dragon (hidden inside the egg until it hatches) -->
      <g clip-path="url(#clipDragon)">
        <g class="rise">
          <g class="bob">
            <path class="d-wing" d="M165 215 C130 180 100 185 92 205 C105 205 110 215 108 225 C120 220 128 228 128 238 C140 230 152 228 165 230Z"/>
            <g transform="translate(400 0) scale(-1 1)">
              <path class="d-wing" d="M165 215 C130 180 100 185 92 205 C105 205 110 215 108 225 C120 220 128 228 128 238 C140 230 152 228 165 230Z"/>
            </g>
            <ellipse class="d-body" cx="200" cy="252" rx="54" ry="56"/>
            <ellipse class="d-belly" cx="200" cy="262" rx="33" ry="38"/>
            <path class="d-line" d="M180 244 q20 8 40 0 M178 260 q22 8 44 0"/>
            <path class="d-horn" d="M170 137 L176 112 L186 133Z"/>
            <path class="d-horn" d="M214 133 L224 112 L230 137Z"/>
            <path class="d-spike" d="M190 131 L196 116 L202 130Z M199 130 L205 117 L211 131Z"/>
            <ellipse class="d-body" cx="200" cy="172" rx="52" ry="44"/>
            <ellipse class="d-hi" cx="200" cy="191" rx="30" ry="18"/>
            <ellipse class="d-dk" cx="192" cy="186" rx="2.6" ry="3.2"/>
            <ellipse class="d-dk" cx="208" cy="186" rx="2.6" ry="3.2"/>
            <path class="d-mouth" d="M188 197 Q200 207 212 197"/>
            <g class="d-eye">
              <ellipse cx="179" cy="164" rx="11" ry="13" fill="#fff"/>
              <g class="pupil"><circle class="d-ink" cx="179" cy="166" r="7"/><circle cx="182" cy="162" r="2.6" fill="#fff"/></g>
            </g>
            <g class="d-eye">
              <ellipse cx="221" cy="164" rx="11" ry="13" fill="#fff"/>
              <g class="pupil"><circle class="d-ink" cx="221" cy="166" r="7"/><circle cx="224" cy="162" r="2.6" fill="#fff"/></g>
            </g>
            <circle cx="163" cy="185" r="6" fill="#ff8aa0" opacity="0.5"/>
            <circle cx="237" cy="185" r="6" fill="#ff8aa0" opacity="0.5"/>
            <circle class="fire" cx="200" cy="196" r="13" fill="url(#fireGrad)"/>
            <circle class="smoke" cx="191" cy="182" r="6" fill="#c9c2b8"/>
            <circle class="smoke s2" cx="209" cy="182" r="6" fill="#c9c2b8"/>
          </g>
        </g>
      </g>

      <!-- The egg: whole until it hatches, then two shell pieces -->
      <g class="egg-drop"><g id="eggWrap">
        <g class="whole">
          <use href="#eggShape" fill="url(#shell)"/>
          <use href="#spots"/>
          <ellipse cx="176" cy="170" rx="14" ry="22" fill="#fff" opacity="0.45"/>
        </g>
        <g class="shell-piece">
          <g clip-path="url(#clipBottom)"><use href="#eggShape" fill="url(#shell)"/><use href="#spots"/></g>
        </g>
        <g id="topShell" class="shell-piece">
          <g clip-path="url(#clipTop)"><use href="#eggShape" fill="url(#shell)"/><use href="#spots"/></g>
        </g>
        <g class="cracks">
          <path id="glowL" class="crack-glow" pathLength="100" d="M200 240 L180 216 L162 238 L145 218 L128 232"/>
          <path id="glowR" class="crack-glow" pathLength="100" d="M200 240 L220 216 L238 238 L256 218 L272 232"/>
          <path id="crackL" class="crack" pathLength="100" d="M200 240 L180 216 L162 238 L145 218 L128 232"/>
          <path id="crackR" class="crack" pathLength="100" d="M200 240 L220 216 L238 238 L256 218 L272 232"/>
          <path id="crackB1" class="crack" pathLength="100" d="M162 238 L158 254 L148 262"/>
          <path id="crackB2" class="crack" pathLength="100" d="M238 238 L245 252 L256 258"/>
        </g>
      </g></g>

      <!-- Little arms resting on the shell rim, in front of it -->
      <g clip-path="url(#clipDragon)">
        <g class="rise"><g class="bob">
          <ellipse class="d-body" cx="156" cy="232" rx="13" ry="9"/>
          <ellipse class="d-body" cx="244" cy="232" rx="13" ry="9"/>
        </g></g>
      </g>

      <!-- Front of the nest -->
      <path class="twig dk" d="M92 318 Q200 352 308 318"/>
      <path class="twig" d="M98 328 Q170 352 250 340"/>
      <path class="twig" d="M150 344 Q240 356 304 326"/>
      <path class="twig dk" d="M112 336 Q190 362 290 338"/>

      <!-- Hearts after hatching -->
      <g class="hearts">
        <path d="M120 150 c-6 -8 -18 -2 -12 8 l12 12 l12 -12 c6 -10 -6 -16 -12 -8z"/>
        <path d="M290 130 c-5 -7 -15 -2 -10 7 l10 10 l10 -10 c5 -9 -5 -14 -10 -7z"/>
        <path d="M300 210 c-4 -6 -12 -1 -8 5 l8 8 l8 -8 c4 -6 -4 -11 -8 -5z"/>
      </g>
    </svg>

    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
    <button id="egg" class="egg-btn" type="button" aria-label="Egg: press and hold to hatch it" aria-describedby="status"></button>
    <div id="progress" class="sr" role="progressbar" aria-label="Hatching" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </div>

  <p id="status" class="status" role="status" aria-live="polite">Press and hold the egg (or Space) until it hatches.</p>
  <div class="row">
    <button id="tickle" class="btn" type="button" hidden>Tickle</button>
    <button id="again" class="btn ghost" type="button" hidden>Lay a new egg</button>
  </div>
  <p id="count" class="count">Dragons hatched: 0</p>
</main>

<script>
  (function () {
    "use strict";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (id) { return document.getElementById(id); };
    var root = $("root"), eggBtn = $("egg"), meter = $("meter"), wrap = $("eggWrap");
    var status = $("status"), progressEl = $("progress"), title = document.querySelector(".title");
    var tickleBtn = $("tickle"), againBtn = $("again"), countEl = $("count");
    var crackL = $("crackL"), crackR = $("crackR"), glowL = $("glowL"), glowR = $("glowR");
    var crackB1 = $("crackB1"), crackB2 = $("crackB2");

    /* Each egg hides a dragon in one of these colours */
    var PALETTES = [
      { drag: "#2bb39a", hi: "#7fe3cc", dk: "#1f8f7c", wing: "#ff8a65" },
      { drag: "#8a63d2", hi: "#c3a8f5", dk: "#6644b0", wing: "#ffbf3f" },
      { drag: "#ff7b6b", hi: "#ffc0b5", dk: "#d9503f", wing: "#4fc3e8" },
      { drag: "#e9a723", hi: "#ffdc8f", dk: "#b77f08", wing: "#e85d8f" }
    ];
    var NAMES = ["Mango", "Pepper", "Biscuit", "Sparky", "Toffee", "Pistachio", "Cinder", "Noodle", "Pebble", "Pickle"];
    var HOLD_SECONDS = 2.2;

    var p = 0, holding = false, state = "egg", name = "", hatchedCount = 0, stage = 0, paletteIndex = 0;

    function setPalette(i) {
      var c = PALETTES[i], s = document.documentElement.style;
      s.setProperty("--drag", c.drag);
      s.setProperty("--drag-hi", c.hi);
      s.setProperty("--drag-dk", c.dk);
      s.setProperty("--wing", c.wing);
    }

    /* ---------- Sunburst rays (shown after hatching) ---------- */
    (function () {
      var g = $("rays");
      for (var i = 0; i < 14; i++) {
        var a = (i / 14) * Math.PI * 2, w = 0.09;
        var pts = "200,236 " +
          (200 + Math.cos(a - w) * 230).toFixed(1) + "," + (236 + Math.sin(a - w) * 230).toFixed(1) + " " +
          (200 + Math.cos(a + w) * 230).toFixed(1) + "," + (236 + Math.sin(a + w) * 230).toFixed(1);
        var poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", pts);
        g.appendChild(poly);
      }
    })();

    /* ---------- Particle layer: a canvas laid over the SVG, drawn in the same 0..400 units ---------- */
    var scene = document.querySelector(".scene"), svg = scene.querySelector("svg");
    var fx = $("fx"), fctx = fx.getContext("2d"), parts = [], eggGlow = $("eggGlow");
    function sizeFx() {
      var dpr = Math.min(2, window.devicePixelRatio || 1), w = scene.clientWidth;
      fx.width = Math.round(w * 1.2 * dpr);
      fx.height = Math.round(w * 1.2 * dpr);
      var unit = (w / 400) * dpr;
      fctx.setTransform(unit, 0, 0, unit, w * 0.1 * dpr, w * 0.1 * dpr); // the canvas overhangs by 10%
    }
    new ResizeObserver(sizeFx).observe(scene);
    function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    function add(o) { if (!reduce.matches && parts.length < 260) parts.push(o); }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function drawStar(s) {
      fctx.beginPath();
      fctx.moveTo(0, -s); fctx.lineTo(s * 0.25, -s * 0.25); fctx.lineTo(s, 0); fctx.lineTo(s * 0.25, s * 0.25);
      fctx.lineTo(0, s); fctx.lineTo(-s * 0.25, s * 0.25); fctx.lineTo(-s, 0); fctx.lineTo(-s * 0.25, -s * 0.25);
      fctx.closePath();
      fctx.fill();
    }
    function stepParts(dt) {
      fctx.save();
      fctx.setTransform(1, 0, 0, 1, 0, 0);
      fctx.clearRect(0, 0, fx.width, fx.height);
      fctx.restore();
      for (var i = parts.length - 1; i >= 0; i--) {
        var q = parts[i];
        q.life -= dt;
        if (q.life <= 0) { parts.splice(i, 1); continue; }
        var k = q.life / q.max;
        if (q.type === "mote") {
          // energy motes spiral into the egg while you hold it
          q.ang += q.spin * dt;
          q.r -= q.speed * dt;
          if (q.r < 34) { parts.splice(i, 1); continue; }
          fctx.globalAlpha = Math.min(1, (1 - k) * 3) * 0.9;
          fctx.fillStyle = q.color;
          fctx.beginPath();
          fctx.arc(200 + Math.cos(q.ang) * q.r, 236 + Math.sin(q.ang) * q.r * 0.9, q.size, 0, 6.283);
          fctx.fill();
          continue;
        }
        q.vy += (q.g || 0) * dt;
        var drag = 1 - (q.drag || 0) * dt;
        q.vx *= drag; q.vy *= drag;
        q.x += q.vx * dt; q.y += q.vy * dt;
        q.rot += (q.vr || 0) * dt;
        if (q.type === "shell" && q.y > 322 && q.vy > 0) { q.y = 322; q.vy *= -0.35; q.vx *= 0.6; q.vr *= 0.5; } // bounce on the nest
        fctx.globalAlpha = Math.min(1, k * 2.5);
        fctx.save();
        fctx.translate(q.x, q.y);
        fctx.rotate(q.rot);
        fctx.fillStyle = q.color;
        if (q.type === "shell") {
          fctx.beginPath();
          fctx.moveTo(q.pts[0], q.pts[1]); fctx.lineTo(q.pts[2], q.pts[3]); fctx.lineTo(q.pts[4], q.pts[5]);
          fctx.closePath();
          fctx.fill();
          fctx.strokeStyle = "rgba(90, 52, 24, 0.35)";
          fctx.lineWidth = 1;
          fctx.stroke();
        } else if (q.type === "spark") {
          drawStar(q.size * (0.4 + k));
        } else if (q.type === "smoke") {
          fctx.globalAlpha = k * 0.45;
          fctx.beginPath(); fctx.arc(0, 0, q.size * (1.8 - k), 0, 6.283); fctx.fill();
        } else {
          fctx.globalAlpha = k * (0.6 + 0.4 * Math.random()); // embers flicker
          fctx.beginPath(); fctx.arc(0, 0, q.size * k + 0.5, 0, 6.283); fctx.fill();
        }
        fctx.restore();
      }
      fctx.globalAlpha = 1;
    }

    // Shell fragments, sparks and a puff of nest dust when the egg bursts
    function hatchBurst() {
      var shellA = css("--shell1"), shellB = css("--shell2"), spot = css("--drag-dk"), wing = css("--wing");
      for (var i = 0; i < 16; i++) {
        var a = -Math.PI / 2 + rand(-1.2, 1.2), v = rand(180, 440), sz = rand(6, 16);
        add({ type: "shell", x: rand(160, 240), y: rand(170, 230), vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 900, rot: rand(0, 6), vr: rand(-7, 7),
          color: i % 5 === 0 ? spot : i % 2 ? shellA : shellB, pts: [-sz, -sz * 0.6, sz, -sz * 0.2, -sz * 0.2, sz * 0.8], life: rand(1.8, 2.8), max: 2.8 });
      }
      for (var j = 0; j < 30; j++) {
        var b = rand(0, 6.283), w = rand(120, 380);
        add({ type: "spark", x: 200, y: 215, vx: Math.cos(b) * w, vy: Math.sin(b) * w, drag: 2.5, g: 60, rot: rand(0, 6), vr: 6, size: rand(3, 7), color: j % 2 ? "#ffe27a" : wing, life: rand(0.8, 1.6), max: 1.6 });
      }
      for (var m = 0; m < 9; m++) {
        add({ type: "smoke", x: rand(110, 290), y: rand(316, 328), vx: rand(-20, 20), vy: rand(-50, -20), drag: 1, rot: 0, size: rand(10, 20), color: "#d8cfc2", life: 1.2, max: 1.2 });
      }
      scene.classList.remove("shake");
      void scene.offsetWidth;
      if (!reduce.matches) scene.classList.add("shake");
    }

    /* ---------- The dragon's eyes follow the pointer ---------- */
    var pupils = document.querySelectorAll(".pupil"), look = { x: 200, y: 320 };
    window.addEventListener("pointermove", function (e) {
      var m = svg.getScreenCTM();
      if (!m) return;
      var pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      var q = pt.matrixTransform(m.inverse());
      look.x = q.x; look.y = q.y;
    });
    function aimEyes() {
      var dx = look.x - 200, dy = look.y - 165, d = Math.hypot(dx, dy) || 1, k = Math.min(3.2, d / 30);
      var tr = "translate(" + ((dx / d) * k).toFixed(2) + " " + ((dy / d) * k).toFixed(2) + ")";
      for (var i = 0; i < pupils.length; i++) pupils[i].setAttribute("transform", tr);
    }

    /* ---------- Holding (pointer and keyboard) ---------- */
    function startHold() { if (state === "egg") holding = true; }
    function stopHold() { holding = false; }
    eggBtn.addEventListener("pointerdown", function (e) {
      if (state !== "egg") return;
      eggBtn.setPointerCapture(e.pointerId);
      startHold();
    });
    ["pointerup", "pointercancel", "lostpointercapture", "blur"].forEach(function (ev) {
      eggBtn.addEventListener(ev, stopHold);
    });
    eggBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    eggBtn.addEventListener("keydown", function (e) {
      if (state !== "egg") return; // after hatching, Enter/Space click the button as normal
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        if (!e.repeat) startHold();
      }
    });
    eggBtn.addEventListener("keyup", function (e) {
      if (e.key === " " || e.key === "Enter") stopHold();
    });
    eggBtn.addEventListener("click", function () {
      if (state === "hatched") tickle();
    });

    /* ---------- Drawing the hold progress ---------- */
    function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function reveal(path, amount) { path.style.strokeDashoffset = (100 - amount * 100).toFixed(1); }
    var lastAria = -1;
    function render(now) {
      meter.style.strokeDashoffset = (100 - p * 100).toFixed(2);
      var c = clamp((p - 0.25) / 0.6);
      reveal(crackL, c); reveal(crackR, c); reveal(glowL, c); reveal(glowR, c);
      reveal(crackB1, clamp((c - 0.6) / 0.4));
      reveal(crackB2, clamp((c - 0.7) / 0.3));
      glowL.style.opacity = glowR.style.opacity = (c * 0.9).toFixed(2);
      // the egg rocks harder and faster the longer you hold
      var shake = reduce.matches ? 0 : Math.sin(now / 1000 * (10 + p * 26)) * p * 7;
      wrap.setAttribute("transform", "rotate(" + shake.toFixed(2) + " 200 330)");
      // warm glow behind the egg grows and throbs with the progress
      var throb = reduce.matches ? 0 : Math.sin(now / 90) * 0.04 * p;
      eggGlow.style.opacity = (p * 0.95).toFixed(2);
      eggGlow.style.transform = "scale(" + (0.55 + p * 0.5 + throb).toFixed(3) + ")";
      var aria = Math.round(p * 10) * 10;
      if (aria !== lastAria) { lastAria = aria; progressEl.setAttribute("aria-valuenow", String(aria)); }
      // short spoken hints as the egg gets closer
      var next = p > 0.7 ? 3 : p > 0.35 ? 2 : p > 0.04 ? 1 : 0;
      if (next > stage) {
        stage = next;
        status.textContent = ["", "Keep holding…", "It's wiggling!", "Cracks! Almost there…"][stage];
      }
      if (p === 0 && stage > 0) {
        stage = 0;
        status.textContent = "The egg settled down. Hold it a little longer.";
      }
    }

    /* ---------- Hatch, tickle, new egg ---------- */
    function hatch() {
      state = "hatching";
      holding = false;
      name = NAMES[Math.floor(Math.random() * NAMES.length)];
      hatchedCount++;
      wrap.removeAttribute("transform");
      root.classList.add("hatched");
      eggGlow.style.opacity = "0";
      hatchBurst();
      title.textContent = "Meet " + name + "!";
      status.textContent = "Hatched! Say hello to " + name + ".";
      countEl.textContent = "Dragons hatched: " + hatchedCount;
      eggBtn.setAttribute("aria-label", "Tickle " + name);
      setTimeout(function () {
        state = "hatched";
        tickleBtn.hidden = false;
        againBtn.hidden = false;
        tickleBtn.textContent = "Tickle " + name;
      }, 1100);
    }
    var tickleTimer = 0;
    function tickle() {
      root.classList.remove("tickle");
      void root.offsetWidth; // restart the CSS animation
      root.classList.add("tickle");
      status.textContent = name + " giggles and puffs a tiny fire bubble.";
      for (var i = 0; i < 16; i++) {
        add({ type: "ember", x: 200 + rand(-8, 8), y: 196, vx: rand(-40, 40), vy: rand(-200, -80), drag: 0.8, g: -30, rot: 0,
          size: rand(2, 4.5), color: i % 3 ? "#ffb02e" : "#ff5a1f", life: rand(0.9, 1.5), max: 1.5 });
      }
      clearTimeout(tickleTimer);
      tickleTimer = setTimeout(function () { root.classList.remove("tickle"); }, 1400);
    }
    tickleBtn.addEventListener("click", tickle);

    againBtn.addEventListener("click", function () {
      paletteIndex = (paletteIndex + 1) % PALETTES.length;
      // reset without playing the hatch backwards
      root.classList.add("no-anim");
      root.classList.remove("hatched", "tickle", "fresh");
      setPalette(paletteIndex);
      p = 0; stage = 0; state = "egg";
      render(performance.now());
      void root.offsetWidth;
      root.classList.remove("no-anim");
      root.classList.add("fresh");
      title.textContent = "Hold the egg to hatch it";
      status.textContent = "A new egg! Press and hold it (or Space) to hatch.";
      eggBtn.setAttribute("aria-label", "Egg: press and hold to hatch it");
      tickleBtn.hidden = true;
      againBtn.hidden = true;
      eggBtn.focus();
    });

    /* ---------- Loop ---------- */
    var prev = performance.now(), moteAcc = 0;
    function loop(now) {
      var dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      root.classList.toggle("holding", holding && state === "egg");
      if (state === "egg") {
        if (holding) {
          p = Math.min(1, p + dt / HOLD_SECONDS);
          // more energy motes stream in as the egg gets closer to hatching
          moteAcc += dt * (8 + 40 * p);
          var wing = css("--wing");
          while (moteAcc > 1) {
            moteAcc -= 1;
            add({ type: "mote", ang: rand(0, 6.283), r: rand(150, 195), spin: rand(1.2, 2.6), speed: rand(90, 160), size: rand(1.4, 3.4),
              color: Math.random() < 0.5 ? wing : "#ffe27a", life: 2, max: 2 });
          }
        } else {
          p = Math.max(0, p - dt / 3);
        }
        render(now);
        if (p >= 1) hatch();
      } else {
        aimEyes();
      }
      stepParts(dt);
      requestAnimationFrame(loop);
    }
    setPalette(0);
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
