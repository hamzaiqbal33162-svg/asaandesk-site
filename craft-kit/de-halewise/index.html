<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Halewise look: frosted glass over soft drawn blobs, rounded type ================= */
:root{--font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;--rb:14px;--ri:12px;--rm:26px;--rp:16px;
--bg:#eef6f4;--surface:rgba(255,255,255,.58);--surface-solid:#fbfefd;--surface2:rgba(255,255,255,.75);--line:rgba(16,60,56,.11);--text:#0f2a2c;--muted:#5b7476;--hover:rgba(15,120,110,.08);
--accent:#0e9c88;--on-accent:#fff;--heart:#f0506a;--ok:#16a06a;--warn:#d48806;--danger:#e0445c;--info:#4a72e8;--field:rgba(255,255,255,.8);
--c1:#0e9c88;--c2:#f0506a;--c3:#5b6ef0;--c4:#f2a03d;--c5:#9b5de5;--c6:#2fb4e0;--glass-b:rgba(255,255,255,.75);--blob1:#9be8d8;--blob2:#bcd4ff;--blob3:#ffd0dc;--shadow:0 20px 50px -28px rgba(10,60,60,.45)}
[data-theme="dark"]{--bg:#06141a;--surface:rgba(18,38,46,.55);--surface-solid:#0e2229;--surface2:rgba(30,56,66,.6);--line:rgba(190,240,235,.1);--text:#e5f6f3;--muted:#8db0b0;--hover:rgba(120,240,220,.08);
--accent:#38d6bd;--on-accent:#04201b;--heart:#ff6b82;--ok:#46d996;--warn:#f3b43f;--danger:#ff6b82;--info:#7d9bff;--field:rgba(8,26,32,.7);
--c1:#38d6bd;--c2:#ff6b82;--c3:#8592ff;--c4:#f6b357;--c5:#c08cff;--c6:#5ccff5;--glass-b:rgba(255,255,255,.09);--blob1:#0b5c55;--blob2:#1a2f6b;--blob3:#5a1d3a;--toast-bg:#173a42;--shadow:0 20px 50px -24px rgba(0,0,0,.7)}
/* Drawn backdrop: blobs + faint dot grid (no images) */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.backdrop i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.backdrop i:nth-child(1){width:520px;height:520px;left:-120px;top:-140px;background:var(--blob1)}
.backdrop i:nth-child(2){width:460px;height:460px;right:-120px;top:10%;background:var(--blob2);animation-delay:-7s}
.backdrop i:nth-child(3){width:420px;height:420px;left:35%;bottom:-200px;background:var(--blob3);animation-delay:-13s}
.backdrop::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,color-mix(in srgb,var(--text) 10%,transparent) 1px,transparent 1.5px);background-size:26px 26px;mask:linear-gradient(180deg,#000,transparent 70%);-webkit-mask:linear-gradient(180deg,#000,transparent 70%)}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12)}}
.glass{background:var(--surface);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-b)}
.app{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100vh}
/* Icon rail */
.rail{position:sticky;top:14px;margin:14px 0 14px 14px;height:calc(100vh - 28px);border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:10px;z-index:40;box-shadow:var(--shadow)}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;margin-bottom:8px;box-shadow:0 10px 24px -10px var(--c1)}
.nav{position:relative;display:grid;gap:4px;width:100%}
.nav a{position:relative;z-index:1;display:grid;justify-items:center;gap:3px;padding:9px 2px;border-radius:18px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600;transition:color .2s}
.nav a .ic{width:21px;height:21px}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--accent)}
.nav-marker{position:absolute;left:4px;right:4px;top:0;border-radius:18px;background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .5s cubic-bezier(.3,1.4,.5,1),height .3s;pointer-events:none}
.rail .sp{flex:1}
.main-wrap{min-width:0;overflow-x:clip;padding:14px 22px 40px 18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:26px;font-weight:750;letter-spacing:-.02em}
.top p{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.me{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:99px;font-size:13px;font-weight:650}
.icon-btn.glass{border-radius:14px;width:40px;height:40px}
main{outline:none}
/* Grid + cards */
.g{display:grid;gap:16px;margin-bottom:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{border-radius:26px;padding:18px;min-width:0;background:var(--surface);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-b);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-3px)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:15px;font-weight:750}
.ch p{font-size:12px;color:var(--muted)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:22px;font-weight:750;letter-spacing:-.01em}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:14px}
.btn.primary{box-shadow:0 10px 22px -12px var(--accent)}
/* Live heart (signature) */
.heart-card{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--heart) 16%,var(--surface)),var(--surface))}
.hc-top{display:flex;align-items:center;gap:14px}
.beat{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--heart) 18%,transparent);color:var(--heart)}
.beat svg{width:30px;height:30px;fill:var(--heart);stroke:none;animation:beat var(--beat,.83s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(.96)}42%{transform:scale(1.12)}}
.bpm{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bpm small{font-size:14px;color:var(--muted);font-weight:650;margin-left:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--heart);text-transform:uppercase}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--heart);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.ecg{display:block;width:100%;height:110px;margin-top:6px}
.ecg .trace{fill:none;stroke:var(--heart);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;animation:ecg 5s linear infinite}
.ecg .trace2{fill:none;stroke:var(--heart);stroke-width:8;opacity:.12;animation:ecg 5s linear infinite}
@keyframes ecg{to{transform:translateX(-600px)}}
.hc-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.hc-stats b{display:block;font-size:16px;color:var(--text)}
/* Rings */
.rings{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rstack{position:relative;width:150px;height:150px;flex:none}
.rstack svg{position:absolute;inset:0;margin:auto}
.rleg{display:grid;gap:10px;font-size:12.5px;flex:1;min-width:140px}
.rleg div{display:flex;align-items:center;gap:9px}
.rleg i{width:10px;height:10px;border-radius:50%}
.rleg b{margin-left:auto;font-variant-numeric:tabular-nums}
/* Vital tiles */
.vt{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.vt-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:700}
.vt-i{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.vt-v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.vt-v small{font-size:12px;color:var(--muted);font-weight:650;margin-left:3px}
.vt-f{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
/* Lists */
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.li{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:16px;background:var(--surface2);border:1px solid var(--glass-b);transition:transform .2s}
.li:hover{transform:translateX(3px)}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-size:13px}.li small{display:block;color:var(--muted);font-size:11.5px}
.dose{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:all .25s;flex:none}
.dose[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .4s}
.dose:hover{border-color:var(--accent)}
@keyframes pop{50%{transform:scale(1.25)}}
.pill{width:30px;height:14px;border-radius:9px;background:linear-gradient(90deg,var(--pc) 50%,color-mix(in srgb,var(--pc) 35%,#fff) 50%);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.datebox{display:grid;place-items:center;width:52px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);line-height:1.05;flex:none}
.datebox b{font-size:20px}.datebox small{font-size:10.5px;font-weight:800;text-transform:uppercase;color:inherit}
.visit-hero{display:flex;gap:14px;align-items:center}
/* Vitals page */
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mtab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:16px;border:1px solid var(--glass-b);background:var(--surface);color:var(--muted);font-weight:700;font-size:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .25s}
.mtab[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 10px 24px -12px var(--tc)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stats4 div{padding:10px 12px;border-radius:16px;background:var(--surface2)}
.stats4 small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.stats4 b{font-size:18px}
.range-note{font-size:12px;color:var(--muted);margin-top:10px}
/* Calendar */
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.mcal .dh{color:var(--muted);font-size:10.5px;font-weight:800;padding:4px 0}
.mcal button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--text);position:relative;font-weight:600;font-size:12px}
.mcal button:hover{background:var(--hover)}
.mcal button.out{color:var(--muted);opacity:.45}
.mcal button.today{background:var(--accent);color:var(--on-accent)}
.mcal button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--heart)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px dashed var(--line);display:grid;gap:12px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
/* Records */
.lab{width:100%;border-collapse:collapse;font-size:13px}
.lab td,.lab th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.lab th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rbar{position:relative;height:6px;border-radius:6px;background:var(--hover);min-width:90px}
.rbar::before{content:"";position:absolute;left:25%;right:25%;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 30%,transparent);border-radius:6px}
.rbar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;margin-left:-6px;background:var(--mc);box-shadow:0 0 0 2px var(--surface-solid)}
.doc-i{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);flex:none}
/* Meds page */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mc-top{display:flex;align-items:center;gap:12px}
.mc-top .pill{width:44px;height:20px}
.mc-top b{display:block;font-size:15px}.mc-top small{color:var(--muted)}
.times{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.stock{height:8px;border-radius:8px;background:var(--hover);overflow:hidden;margin:6px 0 4px}
.stock i{display:block;height:100%;border-radius:8px;background:var(--sc,var(--accent));width:var(--w);animation:hbw 1s both}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
/* Insights */
.score{display:grid;justify-items:center;position:relative}
.score .gv{position:absolute;top:58px;text-align:center}
.score .gv b{font-size:40px;font-weight:800;display:block;line-height:1}
.score .gv small{color:var(--muted);font-size:12px}
.tips{display:grid;gap:8px}
.tipc{display:flex;gap:10px;padding:12px;border-radius:16px;background:var(--surface2);font-size:13px}
.tipc .ic{color:var(--accent);margin-top:1px}
/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:13.5px}.set-row small{color:var(--muted);font-size:12px}
.switch{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--line);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.plan{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;border:0}
.plan p{opacity:.85}.plan b.big{font-size:30px;font-weight:800;display:block;margin:6px 0}
.plan .btn{background:#fff;color:#0f2a2c;border-color:#fff}
/* Responsive: rail turns into a bottom tab bar */
@media (max-width:1100px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 12}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;left:8px;right:8px;bottom:8px;top:auto;margin:0;height:auto;flex-direction:row;padding:6px;border-radius:22px}.rail .logo,.rail .sp,.rail .rail-extra{display:none}.nav{display:flex;justify-content:space-around}.nav a{flex:1;padding:6px 0;font-size:9.5px}.nav a span{display:none}.nav a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}.nav-marker{display:none}.main-wrap{padding:12px 14px 96px}.s3{grid-column:span 12}.stats4{grid-template-columns:repeat(2,1fr)}.top h1{font-size:21px}.me span{display:none}.bpm{font-size:38px}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="rail glass" aria-label="Main navigation">
    <div class="logo" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 24s-9-5.2-9-11.6A5 5 0 0114 9.6a5 5 0 019 2.8C23 18.8 14 24 14 24z" fill="rgba(255,255,255,.25)"/><path d="M4 15h5l2-4 3 8 2.5-6 1.5 2h6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker"></span></nav>
    <span class="sp"></span>
    <button type="button" class="icon-btn rail-extra" data-theme-toggle aria-label="Switch theme"></button>
  </aside>
  <div class="main-wrap">
    <header class="top">
      <div><h1 id="hello">Hello</h1><p id="today"></p></div>
      <span class="sp"></span>
      <button type="button" class="icon-btn glass" data-cmdk aria-label="Search (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg></button>
      <button type="button" class="icon-btn glass" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <a class="me glass" href="#/settings"><span class="av" style="--h:170">AR</span><span id="meName">Ayesha Raza</span></a>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = n => (n < 0 ? '-$' : '$') + num(Math.abs(n));
const short = n => { const a = Math.abs(n), s = (v, u) => (Math.round(v * 10) / 10).toString() + u; return a >= 1e9 ? s(n / 1e9, 'B') : a >= 1e6 ? s(n / 1e6, 'M') : a >= 1e3 ? s(n / 1e3, 'K') : String(Math.round(n * 10) / 10); };
const pct = n => (n > 0 ? '+' : '') + dec(n, 1) + '%';
const FMT = { num, rs, usd, usd0, short, pct, dec1: n => dec(n, 1), raw: n => String(Math.round(n)), rsShort: n => 'Rs ' + short(n), pctPlain: n => Math.round(n) + '%', usdShort: n => '$' + short(n) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pdate = s => { if (s instanceof Date) return s; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fdate = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fday = s => { const d = pdate(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fshort = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dayDiff = (a, b) => Math.round((pdate(a) - pdate(b)) / 864e5);
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60) % 24, m = min % 60; return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : Math.floor(s / 86400) + ' d ago'; };

/* Storage that never breaks when the browser blocks it */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* Floating tooltip shared by every chart; any element with data-tip also gets it */
const tip = (() => {
  let el;

    const w = el.offsetWidth, h = el.offsetHeight; let L = x + 14, T = y - h - 12;
    if (L + w > innerWidth - 8) L = x - w - 14; if (L < 8) L = 8; if (T < 8) T = y + 18;
    el.style.transform = `translate(${L}px,${T}px)`;

})();

  $$('[data-x]', dlg).forEach(b => b.onclick = api.close);

  setTimeout(() => { const f = dlg.querySelector('[autofocus]') || dlg.querySelector('input:not([type=hidden]),select,textarea') || dlg.querySelector('.dlg-b button, .dlg-f button') || $('.dlg-x', dlg); if (f) f.focus(); }, 40);

/* Forms in a modal or drawer, with validation and inline errors */

  else if (f.type === 'checkbox') inp = `<input type="checkbox"${ad}${v ? ' checked' : ''}>`;
  else inp = `<input${ad} type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''}${f.step ? ` step="${f.step}"` : ''}>`;

  const foot = `${onDelete ? `<button type="button" class="btn danger ghost" data-del>${ic('trash')}Delete</button><span class="sp"></span>` : ''}<button type="button" class="btn ghost" data-x>Cancel</button><button type="button" class="btn primary" data-ok>${esc(submit)}</button>`;

    });
    fields.forEach(f => { if (!errs[f.k] && f.check) { const c = f.check(v[f.k], v); if (c) errs[f.k] = c; } });
    $$('.err', form).forEach(e => e.textContent = ''); $$('[aria-invalid]', form).forEach(e => e.removeAttribute('aria-invalid'));

  const inp = $('.cmdk-in', m.el), ul = $('.cmdk-list', m.el); let sel = 0, list = [];

  <div class="g g12"><section class="card s8"><div class="ch"><div><h2>Taken on time</h2><p>Share of doses ticked each day, last five weeks</p></div><span class="badge ${avg >= 85 ? 'ok' : 'warn'}">${avg}% average</span></div>${heatHTML(['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5'], DOW.slice(1).concat('Sun'), (r, c) => (D.adh[r * 7 + c] || { p: 0 }).p, { f: v => v + '% taken', color: 'var(--accent)', label: 'Doses taken per day' })}</section>
  <section class="card s4"><div class="ch"><h2>Refills</h2><p>Packs running low</p></div><ul class="list">${D.meds.slice().sort((a, b) => a.left / a.per - b.left / b.per).slice(0, 4).map(m => { const days = Math.floor(m.left / Math.max(1, m.times.length)); return `<li class="li"><span class="pill" style="--pc:${m.color}"></span><div class="grow"><b>${esc(m.name)}</b><small>${m.left} left · about ${days} days</small></div>${days <= 7 ? `<button type="button" class="btn sm primary" data-refill="${m.id}">Refill</button>` : '<span class="badge ok">OK</span>'}</li>`; }).join('')}</ul></section></div>
  ${D.meds.length ? `<div class="mgrid">${D.meds.map(m => { const p = m.left / m.per, ds = m.times.map(t => !!D.taken.doses[m.id + '|' + t]); return `<article class="card"><div class="mc-top"><span class="pill" style="--pc:${m.color}"></span><div style="flex:1;min-width:0"><b>${esc(m.name)}</b><small>${esc(m.dose)}${m.why ? ' · ' + esc(m.why) : ''}</small></div>${ringSVG(ds.filter(Boolean).length / Math.max(1, ds.length), { size: 40, thick: 5, color: m.color, tipText: `Today: ${ds.filter(Boolean).length} of ${ds.length} taken` })}</div><div class="times">${m.times.map((t, i) => `<span class="badge ${ds[i] ? 'ok' : ''}">${ds[i] ? '✓ ' : ''}${t}</span>`).join('')}</div><div class="mrow"><span>Pack</span><span>${m.left} of ${m.per}</span></div><div class="stock"><i style="--w:${(p * 100).toFixed(0)}%;--sc:${p < .25 ? 'var(--danger)' : m.color}"></i></div><div class="btnrow"><button type="button" class="btn sm" data-refill="${m.id}">${ic('refresh')}Refill</button><button type="button" class="btn sm ghost" data-medit="${m.id}">${ic('edit')}Edit</button></div></article>`; }).join('')}</div>` : `<div class="card empty">${ic('pill')}<p>No medicines yet. Add one to get reminders.</p></div>`}`;
}

/* ---------- Page: Insights ---------- */
function scoreParts() {
  const bp = series('bp', 30), hr = series('hr', 30), sl = series('sleep', 30), stp = series('steps', 30);
  const part = (rows, k) => Math.round(rows.filter(r => statusOf(k, r)[1] === 'ok').length / Math.max(1, rows.length) * 100);
  return [{ label: 'Blood pressure', value: part(bp, 'bp'), color: 'var(--c3)' }, { label: 'Heart', value: part(hr, 'hr'), color: 'var(--c2)' }, { label: 'Sleep', value: part(sl, 'sleep'), color: 'var(--c5)' }, { label: 'Activity', value: part(stp, 'steps'), color: 'var(--c6)' }, { label: 'Medicines', value: Math.round(sum(D.adh.slice(-14).map(a => a.p)) / 14), color: 'var(--c1)' }];
}
let insR = '12M';
function pInsights(el) {
  const parts = scoreParts(), score = Math.round(sum(parts.map(p => p.value)) / parts.length);
  const wk = Array.from({ length: 8 }, (_, i) => { const rows = D.V.steps.slice(-56 + i * 7, -56 + i * 7 + 7 || undefined), sl = D.V.sleep.slice(-56 + i * 7, -56 + i * 7 + 7 || undefined); return { l: 'W' + (i + 1), steps: Math.round(sum(rows.map(r => r.v)) / 7), sleep: +(sum(sl.map(r => r.v)) / 7).toFixed(1) }; });
  el.innerHTML = `<div class="ph" data-rise><h2>Insights</h2><div class="ph-a">${segc('Range', ['30D', '12M'], insR)}<button type="button" class="btn" data-a="report">${ic('download')}Doctor report</button></div></div>
  <div class="g g12"><section class="card s4"><div class="ch"><h2>Health score</h2><p>Share of days in range</p></div><div class="score">${gaugeSVG(score / 100, { w: 220, thick: 18, color: score >= 75 ? 'var(--ok)' : 'var(--warn)', tipText: `Health score ${score} of 100` })}<div class="gv"><b data-count="${score}">0</b><small>out of 100</small></div></div>${hbars(parts, v => v + '%')}</section>
  <section class="card s8"><div class="ch"><div><h2>Blood pressure against target</h2><p>Your new tablet started eight months ago</p></div></div><div id="ibp"></div></section>
  <section class="card s6"><div class="ch"><div><h2>Steps, weekly average</h2><p>Last eight weeks</p></div></div><div id="ist"></div></section>
  <section class="card s6"><div class="ch"><h2>Small wins to try</h2></div><div class="tips">${[[`You sleep ${dec(Math.abs(wk[7].sleep - wk[0].sleep), 1)} h ${wk[7].sleep >= wk[0].sleep ? 'more' : 'less'} than eight weeks ago.`, 'moon'], [`Weight is down ${dec(D.V.wt[0].v - last('wt').v, 1)} kg this year. Keep the evening walks.`, 'weight'], [`Blood pressure was in range on ${parts[0].value}% of the last 30 days.`, 'activity'], ['Fill your Vitamin D3 pack this week so you do not miss a day.', 'pill']].map(([t, i]) => `<div class="tipc">${ic(i)}<span>${esc(t)}</span></div>`).join('')}</div></section></div>`;
  const draw = () => lineChart($('#ibp', el), chartArgs('bp', insR === '30D' ? '30D' : '12M', 230));
  draw();
  barChart($('#ist', el), { labels: wk.map(w => w.l), series: [{ name: 'Steps', data: wk.map(w => w.steps), color: 'var(--c6)' }], h: 210, tfmt: v => num(v) + ' steps' });
  segBind(el, 'seg', v => { insR = v; draw(); });
}

/* ---------- Page: Profile and settings ---------- */
function pSettings(el) {
  const sw = (k, label, sub) => `<div class="set-row"><div><b>${label}</b><small>${sub}</small></div><button type="button" class="switch" role="switch" aria-checked="${!!D.set[k]}" data-sw="${k}" aria-label="${label}"></button></div>`;
  el.innerHTML = `<div class="ph" data-rise><h2>Profile and settings</h2></div><div class="g g12">
  <section class="card s7"><div class="ch"><h2>Health profile</h2><p>Shown to doctors you share with</p></div><form class="frm" id="pf" novalidate>${fieldHTML({ k: 'name', label: 'Full name', req: true, half: true }, D.prof.name)}${fieldHTML({ k: 'age', label: 'Age', type: 'number', half: true, min: 1, max: 120 }, D.prof.age)}${fieldHTML({ k: 'blood', label: 'Blood group', type: 'select', half: true, opts: ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'] }, D.prof.blood)}${fieldHTML({ k: 'height', label: 'Height (cm)', type: 'number', half: true, min: 50, max: 250 }, D.prof.height)}${fieldHTML({ k: 'allergies', label: 'Allergies' }, D.prof.allergies)}${fieldHTML({ k: 'contact', label: 'Emergency contact' }, D.prof.contact)}<div><button type="submit" class="btn primary">Save profile</button></div></form></section>
  <section class="card plan s5"><p>Your plan</p><b class="big">Halewise ${esc(D.plan)}</b><p>${D.plan === 'Family' ? 'Up to five people · $9.99 a month' : 'One person · $4.99 a month · renews 2 Dec'}</p><div class="btnrow"><button type="button" class="btn" data-a="plan">${D.plan === 'Family' ? 'Switch to Plus' : 'Upgrade to Family'}</button></div></section>
  <section class="card s12">${sw('remind', 'Medicine reminders', 'A gentle nudge at each dose time')}${sw('weekly', 'Weekly summary', 'Every Sunday evening by email')}${sw('share', 'Share with family doctor', 'Dr. Sana Malik can see your vitals')}
  <div class="set-row"><div><b>Weight units</b><small>Charts and readings switch at once</small></div>${segc('Weight units', ['kg', 'lb'], D.set.units, 'unit')}</div>
  <div class="set-row"><div><b>Theme</b><small>Follows your system until you choose. ?theme=dark in the address also works.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div>
  <div class="set-row"><div><b>Reset demo data</b><small>Bring back the sample year of readings</small></div><button type="button" class="btn danger" data-a="reset">${ic('refresh')}Reset</button></div></section></div>`;
  syncThemeBtns();
  segBind(el, 'unit', v => { D.set.units = v; save(); toast(`Weight now shown in ${v}`); });
  el.addEventListener('click', e => { const s = e.target.closest('[data-sw]'); if (!s) return; const k = s.dataset.sw; D.set[k] = !D.set[k]; s.setAttribute('aria-checked', String(D.set[k])); save(); toast(`${s.getAttribute('aria-label')} ${D.set[k] ? 'on' : 'off'}`); });
  $('#pf', el).onsubmit = e => { e.preventDefault(); const f = e.target, n = f.elements.name, a = f.elements.age; let ok = true; [n, a].forEach(x => { x.removeAttribute('aria-invalid'); $('#' + x.id + '-e').textContent = ''; });
    if (!n.value.trim()) { n.setAttribute('aria-invalid', 'true'); $('#' + n.id + '-e').textContent = 'Name is required'; ok = false; }
    if (a.value && (+a.value < 1 || +a.value > 120)) { a.setAttribute('aria-invalid', 'true'); $('#' + a.id + '-e').textContent = 'Enter an age from 1 to 120'; ok = false; }
    if (!ok) return; ['name', 'age', 'blood', 'height', 'allergies', 'contact'].forEach(k => D.prof[k] = f.elements[k].value.trim()); save(); hello(); toast('Profile saved'); };
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'today', label: 'Today', icon: 'home', render: pToday }, { id: 'vitals', label: 'Vitals', icon: 'activity', render: pVitals }, { id: 'visits', label: 'Visits', icon: 'cal', render: pVisits },
  { id: 'records', label: 'Records', icon: 'file', render: pRecords }, { id: 'meds', label: 'Meds', icon: 'pill', render: pMeds }, { id: 'insights', label: 'Insights', icon: 'chart', render: pInsights }, { id: 'settings', label: 'Profile', icon: 'user', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}" aria-label="${r.label}">${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
function hello() { const h = new Date().getHours(); $('#hello').textContent = `${h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'}, ${D.prof.name.split(' ')[0]}`; $('#meName').textContent = D.prof.name; $('#today').textContent = `${fday(TODAY)} · ${doses().filter(x => !D.taken.doses[x.key]).length} doses left today`; }
document.addEventListener('click', e => {
  const t = e.target;
  const d = t.closest('[data-dose]'); if (d) { const on = d.getAttribute('aria-pressed') !== 'true'; takeDose(d.dataset.dose, on); refresh(); hello(); return; }
  const g = t.closest('[data-goto]'); if (g) { curM = g.dataset.goto; ROUTER.go('vitals'); return; }
  const lg = t.closest('[data-log]'); if (lg) { readingForm(lg.dataset.log); return; }
  const vs = t.closest('[data-visit]'); if (vs) { visitDrawer(D.visits.find(v => v.id === vs.dataset.visit)); return; }
  const rf = t.closest('[data-refill]'); if (rf) { const m = D.meds.find(x => x.id === rf.dataset.refill); m.left += m.per; save(); toast(`${m.name} refilled: ${m.left} in stock`); refresh(); return; }
  const me = t.closest('[data-medit]'); if (me) { medForm(D.meds.find(x => x.id === me.dataset.medit)); return; }
  if (t.closest('[data-water]')) { D.water = Math.min(12, D.water + 1); save(); toast(D.water >= 8 ? 'Water goal reached. Well done!' : `${D.water} of 8 glasses today`); refresh(); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'book') visitForm(null);
  else if (a === 'addmed') medForm(null);
  else if (a === 'addrec') formModal({ title: 'Add a record', submit: 'Add record', values: { type: 'Lab', date: iso(TODAY), docI: 0 }, fields: [{ k: 'title', label: 'Title', req: true, ph: 'e.g. Blood panel' }, { k: 'type', label: 'Type', type: 'select', half: true, opts: Object.keys(RTYPES) }, { k: 'date', label: 'Date', type: 'date', half: true, req: true }, { k: 'docI', label: 'From', type: 'select', opts: DOCS.map((d, i) => ({ v: i, l: d[0] })) }], onSubmit(v) { const dd = DOCS[+v.docI]; D.records.unshift({ id: 'r' + uid(), title: v.title, type: v.type, date: v.date, by: dd[0], clinic: dd[2], size: ri(100, 900), values: [] }); save(); toast(`${v.title} added to your records`); refresh(); } });
  else if (a === 'report') toast('Doctor report ready: 30 days of vitals, medicines and visits');
  else if (a === 'plan') { D.plan = D.plan === 'Family' ? 'Plus' : 'Family'; save(); toast(`You are now on Halewise ${D.plan}`); refresh(); }
  else if (a === 'reset') confirmBox('Bring back the sample data? Your own readings will be cleared.', () => { store.del(KEY); D = makeData(); D.taken.date = iso(TODAY); save(); hello(); toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), ...MK.map(k => ({ label: 'Log ' + METRICS[k].name.toLowerCase(), hint: 'Action', icon: METRICS[k].icon, run: () => readingForm(k) })), { label: 'Book a visit', hint: 'Action', icon: 'cal', run: () => visitForm(null) }, { label: 'Add medicine', hint: 'Action', icon: 'pill', run: () => medForm(null) }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }];

/* Start */
initTheme('halewise', '');
const low = D.meds.find(m => m.left <= 7); if (low) addNote(`${low.name}: ${low.left} left. Refill soon.`, 'warn', new Date(Date.now() - 36e5));
if (upcoming()[0]) addNote(`Reminder: ${upcoming()[0].doc} on ${fday(upcoming()[0].date)} at ${upcoming()[0].time}`, 'info', new Date(Date.now() - 2e7));
addNote('Your weekly summary is ready: blood pressure trending down', 'ok', new Date(Date.now() - 9e7));
hello(); save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'today', title: 'Halewise' });
</script>
</body>
</html>
