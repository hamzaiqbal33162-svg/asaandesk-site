/* =================== Stillhouse:shell =================== */
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Inter",ui-sans-serif,system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.01em;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.grow{flex:1;}
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);}
.backdrop img{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);object-fit:cover;filter:blur(38px) saturate(1.15);opacity:.95;transition:opacity .9s;}
.backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(55% 45% at 10% 6%,var(--glow1),transparent 70%),radial-gradient(50% 55% at 95% 95%,var(--glow2),transparent 70%),var(--veil);}
.glass{background:linear-gradient(165deg,var(--glass-hi),transparent 42%),var(--glass);border:1px solid var(--edge);backdrop-filter:blur(var(--blur, 22px)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur, 22px)) saturate(1.3);box-shadow:inset 0 1px 0 var(--glass-hi), 0 22px 44px -30px var(--shade);}
.app{display:grid;grid-template-columns:232px minmax(0, 1fr);gap:16px;padding:14px 16px 24px 14px;min-height:100vh;transition:grid-template-columns .3s;}
.side{position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column;padding:14px 12px 12px;border-radius:22px;overflow:hidden auto;scrollbar-width:none;}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 6px;text-decoration:none;}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35);}
.logo svg{width:24px;height:24px;}
.brand b{display:block;font-size:15.5px;letter-spacing:-.02em;}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px;}
.slimbtn{margin-left:auto;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;}
.slimbtn:hover{color:var(--ink);background:var(--surface-2);}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:16px 10px 5px;}
.nav{display:grid;gap:2px;}
.nav a{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px 0 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:560;font-size:13px;transition:background .2s,color .2s;}
.nav a .ic{width:18px;height:18px;}
.nav a:hover{background:var(--surface-2);color:var(--ink);}
.nav a[aria-current="page"]{color:var(--ink);background:var(--glass-3);box-shadow:inset 0 0 0 1px var(--edge), 0 8px 18px -12px var(--shade);}
.nav a[aria-current="page"] .ic{color:var(--accent);}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:4px;top:11px;bottom:11px;width:3px;border-radius:3px;background:linear-gradient(var(--accent-2),var(--accent));}
.nav .cnt{margin-left:auto;min-width:20px;height:19px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;}
.nav .cnt.hot{background:var(--accent);color:var(--accent-ink);}
.nav .cnt:empty{display:none;}
.side-foot{margin-top:auto;padding-top:12px;display:grid;gap:8px;}
.homecard{padding:10px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);}
.homecard .row{display:flex;align-items:center;gap:8px;}
.stack{display:flex;}
.stack .cc-av{width:26px;height:26px;font-size:9.5px;box-shadow:0 0 0 2px var(--solid);}
.stack .cc-av + .cc-av{margin-left:-7px;}
.stack .cc-av.away{filter:grayscale(1);opacity:.55;}
.homecard b{font-size:12px;display:block;line-height:1.25;}
.homecard small{font-size:11px;color:var(--muted);display:block;line-height:1.3;}
.modes{display:grid;grid-template-columns:repeat(3, 1fr);gap:3px;margin-top:9px;padding:3px;border-radius:10px;background:var(--surface-2);}
.modes button{height:26px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:650;}
.modes button[aria-pressed="true"]{background:var(--glass-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge);}
@media (min-width:861px){
.app.slim{grid-template-columns:76px minmax(0, 1fr);}
.app.slim .brand > div,.app.slim .nav a span,.app.slim .nav .cnt,.app.slim .nav-sec,.app.slim .homecard > :not(.row),.app.slim .homecard .row > div{display:none;}
.app.slim .brand{flex-direction:column;}
.app.slim .slimbtn{margin:6px 0 0;}
.app.slim .nav a{justify-content:center;padding:0;}
.app.slim .nav a .ic{width:20px;height:20px;}
.app.slim .homecard{padding:8px 4px;}
.app.slim .homecard .row{justify-content:center;}
.app.slim .stack{flex-direction:column;align-items:center;}
.app.slim .stack .cc-av + .cc-av{margin:-6px 0 0;}
.app.slim .slimbtn svg{transform:scaleX(-1);}
}
.main{min-width:0;}
.top{position:sticky;top:14px;z-index:30;display:flex;align-items:center;gap:8px;height:58px;padding:0 10px 0 9px;border-radius:19px;}
.menu-btn{display:none;}
.searchbtn{flex:0 1 380px;min-width:0;display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 13px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--faint);font-size:13px;text-align:left;}
.searchbtn span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.searchbtn kbd{font:600 10.5px/1 inherit;padding:5px 7px;border-radius:7px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface);}
.searchbtn:hover{border-color:var(--line-2);color:var(--muted);}
.wx{display:flex;align-items:center;gap:8px;margin-left:auto;padding:0 10px;color:var(--muted);font-size:12.5px;white-space:nowrap;}
.wx b{color:var(--ink);font-weight:650;}
.wx .ic{color:var(--accent);width:18px;height:18px;}
.ibtn{position:relative;width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);transition:background .2s,transform .15s;}
.ibtn:hover{background:var(--glass-3);}
.ibtn:active{transform:scale(.94);}
.ibtn .ic{width:18px;height:18px;}
.ibtn .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--solid);}
.ibtn .dot:empty{display:block;}
.ibtn .dot.off{display:none;}
[data-theme-toggle] .t-moon,[data-theme="dark"] [data-theme-toggle] .t-sun{display:none;}
[data-theme="dark"] [data-theme-toggle] .t-moon{display:inline;}
.me{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid var(--edge);background:none;position:relative;flex:none;}
.me .cc-av{width:100%;height:100%;font-size:12px;}
.me::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--solid);}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:20px 4px 14px;}
.ph .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
.ph h1{margin:5px 0 3px;font-size:30px;line-height:1.12;letter-spacing:-.03em;font-weight:680;}
.ph p{margin:0;color:var(--muted);font-size:13px;}
.ph p b{color:var(--ink);font-weight:650;}
.ph p a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;background:none;border:0;padding:0;font:inherit;cursor:pointer;}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.ph.swap > *{animation:phIn .38s cubic-bezier(.2,.8,.2,1) both;}
.ph.swap > :nth-child(2){animation-delay:60ms;}
@keyframes phIn{from{opacity:0;transform:translateY(8px);}}
.btn{min-height:36px;padding:0 15px;border-radius:999px;background:var(--glass-3);border:1px solid var(--edge);color:var(--ink);font-size:12.5px;font-weight:650;text-decoration:none;box-shadow:0 6px 16px -12px var(--shade);}
.btn:hover{border-color:var(--accent);}
.btn .ic{width:16px;height:16px;}
.btn.primary{background:linear-gradient(140deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.3);}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;}
.btn.sm{min-height:30px;padding:0 12px;font-size:12px;}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent;}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:650;font-size:12px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;}
.linkbtn .ic{width:14px;height:14px;}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0, 1fr));grid-auto-flow:row dense;gap:14px;margin-bottom:14px;}
.fi{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--c,var(--accent));flex:none;}
.fi .ic{width:14px;height:14px;}
.s2{grid-column:span 2;}.s3{grid-column:span 3;}.s4{grid-column:span 4;}.s5{grid-column:span 5;}.s6{grid-column:span 6;}.s7{grid-column:span 7;}.s8{grid-column:span 8;}.s9{grid-column:span 9;}.s12{grid-column:span 12;}
.card{position:relative;padding:14px 16px;border-radius:var(--radius);min-width:0;}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:30px;}
.ch h3{margin:0;font-size:14px;font-weight:660;}
.ch small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;}
.ch .r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.livetag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:var(--muted);}
.livetag i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:livePulse 2s infinite;}
@keyframes livePulse{70%{box-shadow:0 0 0 6px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap;}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);}
.pill.warm{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);}
.pill.cool{color:var(--cool);background:color-mix(in srgb,var(--cool) 14%,transparent);}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;}
.card:where(.lift){transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;}
.card:where(.lift):hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--glass-hi), 0 26px 40px -26px var(--shade);}
.seg{display:inline-flex;flex-wrap:nowrap;padding:3px;gap:2px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none;}
.seg button{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:640;transition:background .2s,color .2s;}
.seg button:hover{color:var(--ink);}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--glass-3);color:var(--ink);box-shadow:0 3px 10px -6px var(--shade),inset 0 0 0 1px var(--edge);}
.seg button em{font-style:normal;font-size:10.5px;min-width:18px;height:17px;padding:0 5px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);}
.seg button[aria-selected="true"] em{background:var(--accent);color:var(--accent-ink);}
.seg.lg button{height:32px;padding:0 14px;font-size:12.5px;}
.tabbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
.sw{position:relative;flex:none;width:38px;height:22px;padding:0;border-radius:11px;border:0;background:var(--line-2);transition:background .25s;}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--knob);box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .28s cubic-bezier(.3,1.4,.5,1);}
.sw[aria-checked="true"]{background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.sw[aria-checked="true"]::after{transform:translateX(16px);}
.sw.sm{width:32px;height:19px;}
.sw.sm::after{width:13px;height:13px;}
.sw.sm[aria-checked="true"]::after{transform:translateX(13px);}
.field{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);min-width:0;}
.field:focus-within{border-color:var(--accent);}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:12.5px;height:100%;}
.field select option{background:var(--panel);color:var(--ink);}
.chipb{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:640;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.chipb[aria-pressed="true"]{background:var(--glass-3);color:var(--ink);border-color:var(--edge);box-shadow:inset 0 0 0 1px var(--accent);}
.chipb:hover{color:var(--ink);}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;accent-color:var(--accent);}
.rng::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p, 50%),var(--line-2) var(--p, 50%));}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;border-radius:50%;background:var(--knob);border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.25);}
.rng::-moz-range-track{height:5px;border-radius:3px;background:var(--line-2);}
.rng::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent);}
.rng::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--knob);border:2px solid var(--accent);}
.sk [data-sk]{position:relative;}
.sk [data-sk]::after{content:"";position:absolute;inset:-2px;z-index:5;border-radius:12px;pointer-events:none;background:linear-gradient(100deg,var(--solid) 30%,color-mix(in srgb,var(--accent) 24%,var(--solid)) 50%,var(--solid) 70%) 0 0 / 300% 100%;animation:skel .44s ease-out forwards;}
@keyframes skel{0%{background-position:100% 0;opacity:1;}75%{opacity:1;}100%{background-position:0 0;opacity:0;visibility:hidden;}}
.cc-in{--enter:shRise;animation-duration:.44s;animation-delay:calc(var(--i, 0) * 36ms);}
@keyframes shRise{from{opacity:0;transform:translateY(14px) scale(.985);}}
.view-out{opacity:0;transform:translateY(6px);transition:opacity .12s,transform .12s;}
.cc-draw{animation-duration:1s;}
/* =================== Home =================== */
.scenes{display:grid;grid-template-columns:repeat(6,minmax(0, 1fr));gap:10px;margin-bottom:14px;}
.scn{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;height:54px;padding:0 12px 0 8px;border-radius:999px;text-align:left;color:var(--ink);cursor:pointer;transition:transform .2s,box-shadow .2s;}
.scn:hover{transform:translateY(-2px);}
.scn .si{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);border:1px solid var(--line);}
.scn b{display:block;font-size:12.5px;font-weight:650;}
.scn small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scn > div{min-width:0;}
.scn.on{box-shadow:inset 0 0 0 1.5px var(--accent), 0 10px 24px -16px var(--accent);}
.scn.on .si{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;}
.scn .sweep{position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 30%,transparent),transparent);transform:translateX(-100%);pointer-events:none;}
.scn.run .sweep{animation:sweep .9s ease-out;}
@keyframes sweep{to{transform:translateX(100%);}}
.viewer{display:grid;grid-template-columns:minmax(0, 1fr) 112px;gap:10px;padding:10px;}
.cam{position:relative;overflow:hidden;border-radius:13px;background:#1a150f;color:var(--cam-ink);min-height:200px;isolation:isolate;}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s;}
.cam img.kb{animation:kb 16s ease-in-out infinite alternate;}
@keyframes kb{from{transform:scale(1.01);}to{transform:scale(1.08) translate(-1.2%, -.8%);}}
.cam .ov{position:absolute;z-index:2;display:flex;gap:6px;align-items:center;}
.cam .tl{top:10px;left:10px;}.cam .tr{top:10px;right:10px;}
.chipd{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:999px;background:rgba(18,14,9,.5);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:650;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-variant-numeric:tabular-nums;white-space:nowrap;}
.chipd .rec{width:7px;height:7px;border-radius:50%;background:#ff6b55;animation:blink 1.6s infinite;}
@keyframes blink{50%{opacity:.25;}}
.obtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(18,14,9,.5);border:1px solid rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.obtn .ic{width:15px;height:15px;}
.obtn[aria-pressed="true"]{background:#f1ca80;color:#1f1608;}
.cam .cap{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:36px 14px 12px;background:linear-gradient(transparent,rgba(12,9,5,.78));display:flex;align-items:flex-end;gap:10px;}
.cam .cap b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em;}
.cam .cap small{display:block;font-size:11.5px;opacity:.85;}
.cam .cap .r{margin-left:auto;display:flex;gap:6px;}
.cam .box{position:absolute;z-index:1;border:1.5px solid #f1ca80;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.25);animation:boxDrift 6s ease-in-out infinite alternate;}
.cam .box span{position:absolute;top:-21px;left:-1px;height:18px;padding:0 6px;border-radius:5px;background:#f1ca80;color:#1f1608;font-size:10px;font-weight:700;white-space:nowrap;line-height:18px;}
@keyframes boxDrift{to{transform:translate(6px, -3px);}}
.cam.priv img{filter:blur(14px) brightness(.55);}
.cam .privmsg{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:6px;font-size:12px;text-align:center;}
.cam .privmsg .ic{width:26px;height:26px;}
.cam .scan{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(transparent 0,rgba(255,255,255,.06) 50%,transparent 100%) 0 0 / 100% 40%;background-repeat:no-repeat;animation:scan 5s linear infinite;}
@keyframes scan{from{background-position:0 -40%;}to{background-position:0 140%;}}
.vw-main{height:100%;}
.vw-rail{display:flex;flex-direction:column;gap:8px;min-height:0;}
.thumb{position:relative;flex:1;min-height:48px;border-radius:11px;overflow:hidden;border:0;padding:0;background:#1a150f;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.thumb:hover img{transform:scale(1.06);}
.thumb span{position:absolute;left:6px;bottom:5px;right:6px;font-size:10.5px;font-weight:650;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55));}
.thumb span{z-index:1;}
.thumb[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--accent-2), 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);}
.plan{position:relative;}
.plan svg{display:block;width:100%;height:auto;overflow:visible;}
.plan .pfade{animation:pfade .38s cubic-bezier(.2,.8,.2,1) both;}
@keyframes pfade{from{opacity:0;transform:translateX(14px);}}
.rm{cursor:pointer;outline:none;}
.rm-floor{fill:var(--plan-floor);transition:fill .3s;}
.rm:hover .rm-floor{fill:color-mix(in srgb,var(--accent) 10%,var(--plan-floor));}
.rm-glow{transition:opacity .6s;pointer-events:none;}
.rm-edge{fill:none;stroke:var(--plan-wall);stroke-opacity:.55;stroke-width:1.6;transition:stroke .2s;}
.rm.sel .rm-edge{stroke:var(--accent);stroke-opacity:1;stroke-width:2.2;stroke-dasharray:7 4;animation:march 1.4s linear infinite;}
.rm:focus-visible .rm-edge{stroke:var(--accent);stroke-opacity:1;stroke-width:2.5;}
@keyframes march{to{stroke-dashoffset:-22;}}
.wall{fill:none;stroke:var(--plan-wall);stroke-width:4.5;stroke-linejoin:round;pointer-events:none;}
.win{stroke:var(--surface);stroke-width:4.5;pointer-events:none;}
.win2{stroke:var(--plan-wall);stroke-width:.9;stroke-opacity:.6;pointer-events:none;}
.door{fill:none;stroke:var(--plan-wall);stroke-opacity:.45;stroke-width:1;pointer-events:none;}
.furn{fill:none;stroke:var(--plan-wall);stroke-opacity:.2;stroke-width:1;pointer-events:none;}
.stairs{stroke:var(--plan-wall);stroke-opacity:.28;stroke-width:1;pointer-events:none;}
.plan .lbl{font-size:9.5px;font-weight:700;fill:var(--ink);pointer-events:none;letter-spacing:-.01em;}
.plan .lbl2{font-size:8.5px;fill:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums;}
.plan .hatch{fill:url(#shHatch);stroke:var(--plan-wall);stroke-opacity:.4;}
.plan .lawn{fill:color-mix(in srgb,var(--sage) 16%,transparent);}
.plan .gravel{fill:color-mix(in srgb,var(--faint) 14%,transparent);}
.plan .tree{fill:color-mix(in srgb,var(--sage) 30%,transparent);stroke:var(--sage);stroke-opacity:.5;}
.plan .cone{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--accent);stroke-opacity:.35;stroke-dasharray:3 3;pointer-events:none;}
.mini{width:100%;height:100%;}
.tdot{fill:var(--faint);opacity:.55;pointer-events:none;}
.tdot.on{fill:var(--accent);opacity:1;}
.pin-in{transform-box:fill-box;transform-origin:center;animation:pinPop .5s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--k, 0) * 55ms + 80ms);cursor:pointer;}
.pin-in .b{fill:var(--solid);stroke:var(--line-2);stroke-width:1;transition:fill .25s;}
.pin-in .ic2{fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.pin.on .b{fill:var(--accent);stroke:var(--accent-2);}
.pin.on .ic2{stroke:var(--accent-ink);}
.pin .ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;}
.pin.on .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center;}
.pin:hover .b,.pin:focus-visible .b{stroke:var(--accent);stroke-width:2;}
.pin{outline:none;}
@keyframes pinPop{from{transform:scale(0) translateY(6px);opacity:0;}}
@keyframes ring{0%{opacity:.8;transform:scale(1);}100%{opacity:0;transform:scale(2.1);}}
.who-dot{transition:transform 1.6s cubic-bezier(.4,.1,.2,1);pointer-events:none;}
.who-dot circle{stroke:var(--solid);stroke-width:1.5;}
.who-dot text{font-size:6.5px;font-weight:800;fill:#fff;text-anchor:middle;}
.plan-tip{position:absolute;top:4px;right:4px;font-size:11px;color:var(--muted);}
.rmbar{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);min-height:58px;}
.rmbar .meta{min-width:0;flex:none;width:128px;}
.rmbar .meta b{display:block;font-size:13px;}
.rmbar .meta small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dchips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;max-height:64px;overflow:hidden;}
.dchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:620;white-space:nowrap;transition:background .2s,color .2s,border-color .2s;}
.dchip i{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);}
.dchip i .ic{width:12px;height:12px;}
.dchip.on{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 14%,transparent);}
.dchip.on i{background:var(--accent);color:var(--accent-ink);}
.thermo{display:grid;justify-items:center;align-content:center;align-items:center;gap:8px;}
.dial{position:relative;width:210px;max-width:100%;aspect-ratio:1;touch-action:none;cursor:grab;border-radius:50%;outline:none;}
.dial:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);}
.dial svg{width:100%;height:100%;display:block;overflow:visible;}
.dial .tk{stroke:var(--line-2);stroke-width:2.6;stroke-linecap:round;transition:stroke .25s;}
.dial .face{fill:var(--solid);stroke:var(--edge);stroke-width:1;}
.dial .face2{fill:none;stroke:var(--line);stroke-width:1;}
.dial .now{fill:var(--ink);}
.dial .breath{fill:var(--ember);opacity:.0;transform-box:fill-box;transform-origin:center;}
.dial.heat .breath{animation:breathe 3.2s ease-in-out infinite;}
.dial.cool .breath{fill:var(--cool);animation:breathe 3.2s ease-in-out infinite;}
@keyframes breathe{0%, 100%{opacity:.05;transform:scale(.92);}50%{opacity:.2;transform:scale(1);}}
.dial-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;pointer-events:none;}
.dial-c small{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.dial-c b{font-size:40px;line-height:1.05;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.dial-c b sup{font-size:18px;vertical-align:16px;margin-left:1px;font-weight:400;}
.dial-c em{font-style:normal;font-size:11.5px;color:var(--muted);}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-top:-38px;position:relative;z-index:1;}
.stepper button{width:34px;height:28px;border-radius:999px;border:0;background:var(--glass-3);color:var(--ink);display:grid;place-items:center;}
.stepper button .ic{width:15px;height:15px;}
.stepper button:active{transform:scale(.92);}
.tfoot{display:flex;justify-content:space-between;gap:10px;width:100%;font-size:11.5px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);}
.tfoot b{color:var(--ink);font-weight:650;display:block;font-size:12.5px;}
.flow svg{display:block;width:100%;height:auto;overflow:visible;}
.flow .wire{fill:none;stroke:var(--line-2);stroke-width:2;stroke-linecap:round;transition:stroke .5s,opacity .5s;}
.flow .wire.on{stroke:var(--c);stroke-opacity:.45;stroke-width:2.4;}
.flow .wire.off{opacity:.45;stroke-dasharray:2 5;}
.flow .dots circle{fill:var(--c);}
.flow .dots.off{display:none;}
.flow .nd .bg{fill:var(--solid);stroke:var(--c);stroke-width:1.6;}
.flow .nd .halo{fill:var(--c);opacity:.12;transform-box:fill-box;transform-origin:center;animation:halo 2.8s ease-in-out infinite;}
.flow .nd.idle .halo{animation:none;opacity:.05;}
.flow .nd.idle .bg{stroke-opacity:.4;}
@keyframes halo{50%{opacity:.25;transform:scale(1.18);}}
.flow .nd .ic2{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.flow .soc{fill:none;stroke:var(--batt);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .8s;}
.fwrap{position:relative;margin-bottom:16px;}
.fl{position:absolute;transform:translateX(-50%);display:grid;justify-items:center;line-height:1.25;white-space:nowrap;pointer-events:none;}
.fl.top{transform:none;justify-items:start;}
.fl .t1{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.fl .t2{font-size:14px;font-weight:720;color:var(--ink);font-variant-numeric:tabular-nums;}
.fl .t3{font-size:10.5px;color:var(--faint);}
.fstats{display:grid;grid-template-columns:repeat(3,minmax(0, 1fr));gap:8px;margin-top:8px;}
.fstat{padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);min-width:0;}
.fstat small{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);white-space:nowrap;}
.fstat small i{width:7px;height:7px;border-radius:2px;background:var(--c);}
.fstat b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:2px;}
.feed li{display:grid;grid-template-columns:28px minmax(0, 1fr) auto;gap:9px;align-items:center;padding:6px 4px;border-radius:10px;}
.feed li.new{animation:feedIn .6s cubic-bezier(.2,.8,.2,1);}
@keyframes feedIn{from{opacity:0;transform:translateY(-10px);background:color-mix(in srgb, var(--accent) 20%, transparent);}}
.feed .fi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--c,var(--accent));}
.feed .fi .ic{width:14px;height:14px;}
.feed p{margin:0;font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.feed p small{display:block;color:var(--muted);font-size:10.5px;}
.feed time{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tonight{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:10px 11px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px;}
.tonight .big{grid-row:span 2;font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1;}
.tonight b{font-size:12px;}.tonight small{font-size:11px;color:var(--muted);}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(166px, 1fr));gap:12px;}
.tiles.six{grid-template-columns:repeat(6,minmax(0, 1fr));}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;min-height:120px;padding:12px;border-radius:16px;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .35s;}
.tile:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--glass-hi), 0 24px 34px -24px var(--shade);}
.tile.on{background:var(--on-bg),var(--glass);}
.tile .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);margin-bottom:8px;transition:background .3s,color .3s,box-shadow .3s;}
.tile .ti .ic{width:19px;height:19px;}
.tile.on .ti{background:radial-gradient(circle at 32% 28%,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent), 0 8px 18px -8px var(--accent);}
.tile .sw{position:absolute;top:12px;right:12px;}
.tile .tn{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-weight:650;font-size:13px;line-height:1.25;}
.tile .tn::after{content:"";position:absolute;inset:0;border-radius:inherit;}
.tile .sw,.tile .lvl{z-index:1;}
.tile small{color:var(--muted);font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .st{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
.tile .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile.on .st span{color:var(--ink);}
.lvl{flex:1;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;min-width:30px;}
.lvl i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1);}
.tile:not(.on) .lvl i{background:var(--faint);}
.tile .bat{color:var(--warn);}
.roompills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;}
.np{display:grid;grid-template-columns:124px minmax(0, 1fr);gap:14px;align-items:center;}
.art{width:124px;height:124px;border-radius:16px;overflow:hidden;box-shadow:0 16px 30px -18px rgba(0,0,0,.6);position:relative;}
.art svg{width:100%;height:100%;display:block;}
.art.spin .disc{animation:spin 9s linear infinite;transform-origin:62px 62px;}
@keyframes spin{to{transform:rotate(360deg);}}
.np h4{margin:0;font-size:15px;}.np .by{color:var(--muted);font-size:12px;}
.np .where{display:inline-flex;align-items:center;gap:6px;margin:6px 0 8px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--muted);}
.np .where .ic{width:13px;height:13px;color:var(--accent);}
.prog{height:5px;border-radius:3px;background:var(--line-2);position:relative;cursor:pointer;}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.ptimes{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums;}
.ctrls{display:flex;align-items:center;gap:8px;margin-top:6px;}
.ctrls button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;}
.ctrls button .ic{width:15px;height:15px;}
.ctrls .pp{width:42px;height:42px;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:var(--accent-ink);border:0;box-shadow:0 8px 18px -10px var(--accent);}
.ctrls .vol{flex:1;display:flex;align-items:center;gap:6px;color:var(--muted);min-width:60px;}
.ctrls .vol .ic{width:15px;height:15px;flex:none;}
.upnext{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:4px;}
.upnext div{display:flex;gap:10px;align-items:center;font-size:12px;}
.upnext div small{color:var(--muted);}
.upnext div em{margin-left:auto;font-style:normal;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;}
.upnext i{width:22px;height:22px;border-radius:6px;flex:none;}
/* =================== Rooms =================== */
.sticky{position:sticky;top:88px;align-self:start;}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0, 1fr));gap:12px;}
.rcard{padding:8px;border-radius:17px;cursor:pointer;display:flex;flex-direction:column;}
.rcard.sel{box-shadow:inset 0 0 0 1.5px var(--accent), 0 16px 34px -22px var(--accent);}
.rphoto{position:relative;height:116px;border-radius:12px;overflow:hidden;background:var(--surface-2);}
.rphoto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1);}
.rcard:hover .rphoto img{transform:scale(1.05);}
.rphoto .tag{position:absolute;top:7px;left:7px;}
.rphoto .lit{position:absolute;inset:0;background:radial-gradient(70% 80% at 50% 0%,rgba(255,200,110,.35),transparent 70%);mix-blend-mode:screen;opacity:0;transition:opacity .6s;pointer-events:none;}
.rcard.glow .rphoto .lit{opacity:var(--lv,.6);}
.rphoto .mini{position:absolute;inset:0;}
.rbody{padding:9px 6px 2px;display:grid;gap:4px;}
.rbody .l1{display:flex;align-items:baseline;gap:6px;}
.rbody b{font-size:13.5px;font-weight:660;}
.rbody .tmp{margin-left:auto;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:3px;}
.rbody .tmp .ic{width:13px;height:13px;color:var(--ember);}
.rbody .l2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.ldots{display:inline-flex;gap:3px;}
.ldots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);}
.ldots i.on{background:var(--accent);box-shadow:0 0 6px var(--accent-2);}
.rbody .l3{display:flex;gap:6px;margin-top:5px;}
.rd-list{display:grid;gap:2px;}
.rd-row{display:grid;grid-template-columns:34px minmax(0, 1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);}
.rd-row:last-child{border-bottom:0;}
.rd-row .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);}
.rd-row.on .ti{background:var(--accent);color:var(--accent-ink);}
.rd-row .ti .ic{width:16px;height:16px;}
.rd-row b{font-size:12.5px;display:block;}
.rd-row small{font-size:11px;color:var(--muted);display:block;}
.rd-row .rng{grid-column:2 / 4;height:16px;margin-top:-2px;}
.rstats{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));gap:8px;margin:10px 0;}
.rstat{padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);}
.rstat small{display:block;font-size:10.5px;color:var(--muted);}
.rstat b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.drawer-photo{position:relative;height:170px;border-radius:14px;overflow:hidden;margin-bottom:4px;background:var(--surface-2);}
.drawer-photo img{width:100%;height:100%;object-fit:cover;display:block;}
/* =================== Devices =================== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));gap:12px;margin-bottom:14px;}
.kpi{padding:13px 15px;border-radius:16px;min-width:0;display:grid;grid-template-columns:minmax(0, 1fr) auto;align-items:end;gap:2px 8px;}
.kpi small{grid-column:1 / -1;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.kpi small .ic{width:14px;height:14px;color:var(--accent);}
.kpi b{font-size:24px;font-weight:680;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;}
.kpi b em{font-style:normal;font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi p{grid-column:1 / -1;margin:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .cc-spark{color:var(--accent);}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.toolbar .field.q{flex:0 1 300px;}
.toolbar .r{margin-left:auto;}
.dtable td .nm{display:flex;align-items:center;gap:10px;}
.dtable td .nm i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none;}
.dtable td .nm i.on{background:var(--accent);color:var(--accent-ink);}
.dtable td .nm .ic{width:15px;height:15px;}
.cc-tbl table{font-size:12.5px;}
.cc-tbl td{padding:8px 10px;}
.cc-tbl tbody tr[tabindex="0"]:hover{background:var(--surface-2);}
/* =================== Climate =================== */
.zone{display:grid;grid-template-columns:minmax(0, 1fr) 230px;gap:14px;}
.zrooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px, 1fr));gap:8px;align-content:start;}
.zr{padding:9px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);}
.zr small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.zr b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;}
.zr em{font-style:normal;font-size:10.5px;color:var(--faint);}
.zr .bar{height:3px;border-radius:2px;background:var(--line-2);margin-top:5px;overflow:hidden;}
.zr .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cool),var(--accent),var(--ember));}
.sched{display:grid;grid-template-columns:38px repeat(24,minmax(0, 1fr));gap:3px;font-size:10.5px;color:var(--muted);}
.sched .hd{text-align:center;font-variant-numeric:tabular-nums;}
.sched .dl{display:flex;align-items:center;font-weight:650;}
.sched button{height:26px;border:0;border-radius:5px;padding:0;background:var(--line);transition:background .2s,transform .15s;}
.sched button:hover{transform:scaleY(1.12);}
.sched button.m-c{background:linear-gradient(180deg,var(--accent-2),var(--accent));}
.sched button.m-e{background:color-mix(in srgb,var(--olive) 55%,transparent);}
.sched button.m-o{background:var(--line);}
.sched button.now{box-shadow:0 0 0 2px var(--ink);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;border-radius:4px;}
.airrow{display:grid;grid-template-columns:120px minmax(0, 1fr) 70px auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);}
.airrow:last-child{border-bottom:0;}
.airrow b{font-size:12.5px;}.airrow small{display:block;font-size:11px;color:var(--muted);}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1);}
.airrow em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.setrow:last-child{border-bottom:0;}
.setrow > div{min-width:0;flex:1;}
.setrow b{display:block;font-size:12.5px;font-weight:640;}
.setrow small{display:block;font-size:11.5px;color:var(--muted);}
.setrow .rng{max-width:160px;}
/* =================== Energy =================== */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.kgrid .kpi{min-height:108px;align-content:space-between;}
.kgrid .kpi b{font-size:28px;}
.kgrid .kpi .cc-spark{grid-row:2;grid-column:1 / -1;width:100%;height:46px;margin:6px 0 2px;}
.kgrid .kpi .cc-spark path{vector-effect:non-scaling-stroke;}
.kind-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 12px;}
.kind-bar i{height:100%;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1);border-radius:3px;}
.klist{list-style:none;margin:0;padding:0;display:grid;gap:1px;}
.klist li{display:grid;grid-template-columns:10px minmax(0, 1fr) auto;gap:9px;align-items:center;padding:6px 2px;font-size:12.5px;}
.klist li i{width:9px;height:9px;border-radius:3px;}
.klist li em{font-style:normal;font-weight:650;font-variant-numeric:tabular-nums;}
.users li{display:grid;grid-template-columns:30px 200px minmax(0, 1fr) 70px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}
.users li:last-child{border-bottom:0;}
.users .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);}
.users .ti .ic{width:15px;height:15px;}
.users b{font-size:12.5px;display:block;}.users small{font-size:11px;color:var(--muted);}
.users em{font-style:normal;text-align:right;font-weight:650;font-variant-numeric:tabular-nums;}
.users{list-style:none;margin:0;padding:0;}
/* =================== Security =================== */
.camgrid{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));grid-auto-rows:172px;gap:12px;margin-bottom:14px;}
.camgrid .cam{min-height:0;border-radius:16px;box-shadow:0 0 0 1px var(--edge), 0 20px 36px -26px var(--shade);cursor:pointer;}
.camgrid .cam.big{grid-column:span 2;grid-row:span 2;}
.camgrid .cam:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.clips{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));gap:10px;}
.clip{display:grid;grid-template-columns:76px minmax(0, 1fr);gap:10px;align-items:center;padding:6px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:left;color:var(--ink);transition:transform .2s,background .2s;}
.clip:hover{transform:translateY(-2px);background:var(--glass-3);}
.clip .th{position:relative;height:52px;border-radius:9px;overflow:hidden;}
.clip .th img{width:100%;height:100%;object-fit:cover;display:block;}
.clip .th em{position:absolute;right:4px;bottom:3px;font-style:normal;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:0 4px;border-radius:4px;}
.clip b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.clip b .ic{width:13px;height:13px;color:var(--accent);flex:none;}
.clip small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.clip .unseen{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-left:auto;}
.alarm{display:grid;grid-template-columns:150px minmax(0, 1fr);gap:18px;align-items:center;}
.aring{position:relative;width:150px;height:150px;}
.aring svg{width:100%;height:100%;transform:rotate(-90deg);}
.aring .tr{fill:none;stroke:var(--line);stroke-width:9;}
.aring .fl{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s;}
.aring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.aring .c .ic{width:26px;height:26px;margin:0 auto 2px;color:var(--accent);}
.aring .c b{font-size:15px;}.aring .c small{font-size:11px;color:var(--muted);}
.locks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px, 1fr));gap:12px;}
.lock{padding:13px;border-radius:16px;display:grid;gap:10px;}
.lock .top2{display:flex;align-items:center;gap:10px;}
.lock .lk{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--bad);transition:background .3s,color .3s;}
.lock.locked .lk{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
.lock .lk .ic{width:22px;height:22px;}
.lock .lk.turn .ic{animation:turn .5s cubic-bezier(.3,1.5,.5,1);}
@keyframes turn{from{transform:rotate(-35deg) scale(.8);}}
.lock b{display:block;font-size:13px;}.lock small{display:block;font-size:11px;color:var(--muted);}
.lock .bt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
/* =================== Scenes =================== */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));gap:12px;}
.scard{padding:14px;border-radius:18px;display:flex;flex-direction:column;gap:8px;min-height:200px;}
.scard .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);border:1px solid var(--line);}
.scard .si .ic{width:21px;height:21px;}
.scard.on .si{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;}
.scard h4{margin:2px 0 0;font-size:15px;}
.scard p{margin:0;font-size:12px;color:var(--muted);line-height:1.45;}
.scard .icons{display:flex;gap:5px;flex-wrap:wrap;}
.scard .icons i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);}
.scard .icons i .ic{width:13px;height:13px;}
.scard .ft{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.scard .ft .btn{margin-left:auto;}
.scard .top3{display:flex;align-items:flex-start;gap:8px;}
.scard .top3 .mb{margin-left:auto;}
.scard.add{border-style:dashed;border-color:var(--line-2);align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--muted);background:transparent;box-shadow:none;}
.scard.add:hover{border-color:var(--accent);color:var(--ink);}
.scard.add .ic{width:26px;height:26px;}
.rules{display:grid;gap:10px;}
.rule{display:grid;grid-template-columns:40px minmax(0, 1fr) auto auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;}
.rule .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);}
.rule .flow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;}
.rule .flow2 .when{padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:600;}
.rule .flow2 .ic{width:14px;height:14px;color:var(--faint);}
.rule small{display:block;font-size:11px;color:var(--muted);margin-top:3px;}
.rule .runs{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap;}
.rule .runs b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;}
.rule.off{opacity:.62;}
.x-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;}
.x-btn:hover{color:var(--bad);border-color:var(--bad);}
.x-btn .ic{width:14px;height:14px;}
/* =================== Settings =================== */
.people{display:grid;gap:2px;}
.person{display:grid;grid-template-columns:36px minmax(0, 1fr) auto auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);}
.person:last-child{border-bottom:0;}
.person .cc-av{width:36px;height:36px;font-size:12px;}
.person b{font-size:13px;display:block;}.person small{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form2 label{display:grid;gap:5px;font-size:11.5px;font-weight:650;color:var(--muted);}
.form2 input,.form2 select{height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;}
.form2 input:focus,.form2 select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);}
.form2 [aria-invalid="true"]{border-color:var(--bad);}
.form2 .err{color:var(--bad);font-size:11px;font-weight:500;min-height:0;}
.form2 .full{grid-column:1 / -1;}
.bdpick{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));gap:10px;}
.bdpick button{position:relative;height:84px;border-radius:13px;overflow:hidden;padding:0;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface-2);}
.bdpick button img{width:100%;height:100%;object-fit:cover;display:block;}
.bdpick button span{position:absolute;left:8px;bottom:6px;color:#fff;font-size:11px;font-weight:650;text-shadow:0 1px 4px rgba(0,0,0,.7);}
.bdpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent);}
.stored li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.stored li:last-child{border-bottom:0;}
.stored li b{font-variant-numeric:tabular-nums;}
.stored{list-style:none;margin:0;padding:0;}
.kbd{font:600 11px/1 inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);white-space:nowrap;}
.poplist{padding:6px;display:grid;gap:2px;}
.poplist button,.poplist a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--ink);text-align:left;text-decoration:none;font-size:12.5px;}
.poplist button:hover,.poplist a:hover{background:var(--surface-2);}
.poplist .ic{width:16px;height:16px;color:var(--accent);}
.notes{list-style:none;margin:0;padding:0 6px 6px;max-height:340px;overflow:auto;}
.notes li{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:9px 8px;border-radius:9px;font-size:12.5px;}
.notes li i{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;}
.notes li.read i{background:transparent;}
.notes li small{display:block;color:var(--muted);font-size:11px;}
.pophd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;}
.cc-dialog{border-color:var(--edge);}
.cc-db{font-size:13px;}
.viewer-modal .cc-dialog{width:min(980px, 100%);}
.bigcam{height:min(58vh, 520px);border-radius:14px;}
.scrub{display:flex;align-items:center;gap:10px;margin-top:12px;}
.scrub .track{position:relative;flex:1;height:34px;border-radius:9px;background:var(--surface-2);overflow:hidden;cursor:pointer;}
.scrub .track i{position:absolute;top:6px;bottom:6px;width:4px;border-radius:2px;background:var(--accent);opacity:.7;}
.scrub .track b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);}
.scrub span{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:64px;}
/* =================== Bottom bar (phones) =================== */
.bbar{display:none;}
.scrim{display:none;}
@media (max-width:1360px){
.rgrid{grid-template-columns:repeat(2,minmax(0, 1fr));}
.clips{grid-template-columns:repeat(3,minmax(0, 1fr));}
.sgrid{grid-template-columns:repeat(3,minmax(0, 1fr));}
}
@media (max-width:1240px){
.scenes{grid-template-columns:repeat(3,minmax(0, 1fr));}
.wx .wxt{display:none;}
.r-s7{grid-column:span 12;}.r-s5{grid-column:span 12;}
.r-s4{grid-column:span 6;}.r-s3{grid-column:span 6;}
.zone{grid-template-columns:1fr;}
}
@media (max-width:1100px){
.tiles.six{grid-template-columns:repeat(4,minmax(0, 1fr));}
.kpis{grid-template-columns:repeat(2,minmax(0, 1fr));}
.camgrid{grid-template-columns:repeat(2,minmax(0, 1fr));}
}
@media (max-width:860px){
.app{display:block;padding:10px 12px 92px;}
.side{position:fixed;z-index:70;left:0;top:0;bottom:0;height:100%;width:260px;border-radius:0 22px 22px 0;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:var(--panel);}
.nav-open .side{transform:none;}
.nav-open .scrim{display:block;position:fixed;inset:0;z-index:65;background:var(--overlay);}
.top{top:8px;height:52px;gap:6px;}
.ch{flex-wrap:wrap;}
.fwrap{margin-bottom:24px;}
.fl .t2{font-size:13px;}
.menu-btn{display:grid;}
.searchbtn{flex:1;}
.searchbtn kbd,.wx,.top .hide-s{display:none;}
.ph{margin:16px 2px 12px;}
.ph h1{font-size:26px;}
.ph .acts{margin-left:0;width:100%;}
.g12{grid-template-columns:minmax(0, 1fr);gap:12px;}
.g12 > *{grid-column:auto !important;}
.scenes{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.scn{flex:0 0 200px;}
.viewer{grid-template-columns:1fr;}
.vw-main{height:240px;}
.vw-rail{flex-direction:row;overflow-x:auto;scrollbar-width:none;}
.thumb{flex:0 0 96px;height:58px;}
.tiles,.tiles.six{grid-template-columns:repeat(2,minmax(0, 1fr));gap:10px;}
.rgrid{grid-template-columns:repeat(2,minmax(0, 1fr));}
.sticky{position:static;}
.kpis,.kgrid{grid-template-columns:repeat(2,minmax(0, 1fr));}
.kpi b{font-size:20px;}
.camgrid{grid-template-columns:1fr 1fr;grid-auto-rows:120px;}
.clips{grid-template-columns:1fr;}
.sgrid{grid-template-columns:1fr 1fr;}
.np{grid-template-columns:96px minmax(0, 1fr);}.art{width:96px;height:96px;}
.rule{grid-template-columns:36px minmax(0, 1fr) auto;}
.rule .runs,.rule .x-btn{display:none;}
.users li{grid-template-columns:30px minmax(0, 1fr) 60px;}.users li .meter{display:none;}
.airrow{grid-template-columns:90px minmax(0, 1fr) 54px;}.airrow > :last-child{display:none;}
.alarm{grid-template-columns:1fr;justify-items:center;}
.form2{grid-template-columns:1fr;}
.bdpick{grid-template-columns:repeat(2,minmax(0, 1fr));}
.sched{grid-template-columns:30px repeat(24,minmax(0, 1fr));gap:1px;}.sched .hd:nth-child(odd){visibility:hidden;}
.bbar{display:grid;grid-template-columns:repeat(5, 1fr);position:fixed;z-index:60;left:10px;right:10px;bottom:10px;height:62px;padding:6px;border-radius:20px;}
.bbar a,.bbar button{display:grid;justify-items:center;align-content:center;gap:2px;border:0;background:none;border-radius:14px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:650;}
.bbar .ic{width:20px;height:20px;}
.bbar a[aria-current="page"]{color:var(--ink);background:var(--glass-3);}
.bbar a[aria-current="page"] .ic{color:var(--accent);}
.cc-toasts{bottom:84px;}
}
@media (max-width:420px){
.tiles{grid-template-columns:repeat(2,minmax(0, 1fr));}
.tile{min-height:112px;padding:10px;}
.rgrid{grid-template-columns:1fr;}
.fstats{grid-template-columns:1fr 1fr 1fr;gap:6px;}.fstat{padding:6px 8px;}.fstat b{font-size:12.5px;}
.rstats{grid-template-columns:1fr 1fr;}
.sgrid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){
.cam img.kb,.cam .scan,.cam .box{animation:none !important;}
}

function climateTemps(){
reseed(515);
const H=new Date().getHours(),lab=[],g=[],u=[],o=[];
for(let i=23;i>=0;i--){
const h=(H-i+24)%24,warm=(z)=>(S.sched[z][(new Date().getDay()+6)%7][h]==="c"?1:0);
lab.push(h===0?"12a":h===12?"12p":h>12?h-12+"p":h+"a");
g.push(+(18.2+warm("ground")*2.9+rand(-0.25,0.25)).toFixed(1));
u.push(+(17.4+warm("up")*2.2+rand(-0.25,0.25)).toFixed(1));
o.push(+(5.2+Math.sin(((h-8) / 24)*Math.PI*2)*3.1+rand(-0.3,0.3)).toFixed(1));
}
return{lab,g,u,o};
}

"rule-sw":(b)=>{const r=S.rules.find((x)=>x.id===b.dataset.id);r.on=!r.on;save();b.setAttribute("aria-checked",String(r.on));b.closest(".rule").classList.toggle("off",!r.on);$("#sub").innerHTML=SUBLINE.scenes();},
"rule-del":(b)=>confirmBox("Delete this rule?").then((ok)=>{if(ok){S.rules=S.rules.filter((x)=>x.id!==b.dataset.id);save();toast("Rule deleted");rerender();}}),
lockup:lockUp,
"lights-off":()=>{const n=lightsOff();addLog("light",`All lights off · ${n} switched`,ME());toast(n?`Turned off ${n} lights`:"Every light was already off");},
mode:(b)=>setAlarm(b.dataset.v==="home"?"off":b.dataset.v),
alarm:(b)=>setAlarm(b.dataset.v),
vw:(b)=>switchView(b.dataset.id),
"vw-snap":()=>toast("Snapshot saved to clips"),
"vw-talk":(b)=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",String(on));toast(on?"Speaking through the camera speaker":"Talk ended");},
"cam-open":(b)=>openCam(b.dataset.id,b.dataset.vw),
"cam-priv":(b)=>{const c=CAMS.find((x)=>x.id===b.dataset.id);toggleDev(c.dev);modals.slice().forEach((m)=>m.close());if(current==="security")rerender();else if(current==="home")switchView(UI.vw);},
scrub:(b,e)=>{const r=b.getBoundingClientRect(),f=clamp((e.clientX-r.left) / r.width,0,1),h=(1-f)*24;$("b",b).style.right=(1-f)*100+"%";b.previousElementSibling.textContent=f>0.99?"Live":`${Math.floor(h)} h ${Math.round((h%1)*60)} min ago`;},
"scrub-live":(b)=>{const t=b.previousElementSibling;$("b",t).style.right="0";t.previousElementSibling.textContent="Live";},
"room-pick":(b,e)=>{if(e.target.closest("button"))return;UI.roomSel=b.dataset.id;const P=UI.plans.rooms;if(P){P.sel=b.dataset.id;if(P.floor!==ROOM[b.dataset.id].floor)setFloor("rooms",ROOM[b.dataset.id].floor);else{const el=$("[data-plan-el=rooms]");if(el)el._draw();}}},
"room-open":(b)=>openRoom(b.dataset.id),
"room-off":(b)=>{const n=devsIn(b.dataset.id).filter((d)=>d.on&&!["sensor","lock","garage","cam","heat","appliance"].includes(d.t));n.forEach((d)=>{d.on=false;if(d.t==="blind")d.lv=0;});save();n.forEach((d)=>syncDev(d.id));addLog("light",`${ROOM[b.dataset.id].name}: all off`,ME());toast(n.length?`${ROOM[b.dataset.id].name}: ${n.length} switched off`:"Nothing was on in there");},
"rename-room":(b)=>{const r=ROOM[b.dataset.id];modals.slice().forEach((m)=>m.close());setTimeout(()=>formModal({title:"Rename "+r.name,submit:"Rename",fields:[{name:"name",label:"Room name",required:true,value:r.name,check:(v)=>(v.length<2?"Too short":v.length>22?"Keep it under 22 letters":"")}],onSubmit:(v)=>{r.name=v.name;S.rooms[r.id]&&(S.rooms[r.id].name=v.name);save();toast("Room renamed");rerender();}}),60);},
hpill:(b)=>{UI.homePill=b.dataset.v;$$("[data-act=hpill]").forEach((x)=>x.setAttribute("aria-pressed",String(x===b)));const t=$("#homeTiles");t.innerHTML=homeTiles();enter(t);},
hrange:(b)=>{UI.homeRange=b.dataset.v;segPress(b);homeBars();},
erange:(b)=>{UI.energyRange=b.dataset.v;segPress(b);enBars();},
zone:(b)=>{UI.zone=b.dataset.v;if(current==="home"){segPress(b);$("#homeThermo").innerHTML=thermoHTML(UI.zone);}else rerender();},
tstep:(b)=>setTarget(b.dataset.z,S.zones[b.dataset.z].target+ +b.dataset.d),
tmode:(b)=>{const z=S.zones[b.dataset.z];z.mode=b.dataset.v;if(z.mode==="boost")z.target=Math.max(z.target,22);save();refreshThermo(b.dataset.z);addLog("climate",`${z.name} switched to ${b.dataset.v}`,ME());},
boost:()=>{S.zones.ground.mode="boost";S.zones.ground.target=Math.max(22,S.zones.ground.target);save();refreshThermo("ground");toast("Ground floor boosted to 22° for 30 minutes");},
sched:(b)=>{const z=UI.zone,d=+b.dataset.d,h=+b.dataset.h,nx={c:"e",e:"o",o:"c"}[S.sched[z][d][h]];S.sched[z][d][h]=nx;save();b.className="m-"+nx+(b.classList.contains("now")?" now":"");b.setAttribute("aria-label",b.getAttribute("aria-label").replace(/, \w+$/,", "+(nx==="c"?"comfort":nx==="e"?"eco":"off")));},
"sched-copy":()=>{const z=UI.zone;for(let d=1;d<5;d++)S.sched[z][d]=S.sched[z][0].slice();save();rerender();toast("Monday copied to Tuesday to Friday");},
"sched-reset":()=>{S.sched[UI.zone]=seed().sched[UI.zone];save();rerender();toast("Week reset");},
"clim-tab":(b)=>{UI.climTab=b.dataset.v;render("climate");},
"sec-tab":(b)=>{UI.secTab=b.dataset.v;if(current==="security")render("security");},
"scene-tab":(b)=>{UI.sceneTab=b.dataset.v;render("scenes");},
"set-tab":(b)=>{UI.setTab=b.dataset.v;render("settings");},
"dev-tab":(b)=>{UI.devTab=b.dataset.v;if(current==="devices"){$$("[data-act=dev-tab]").forEach((x)=>x.setAttribute("aria-selected",String(x===b)));drawDevList();}},
"dev-only":(b)=>{UI.devOnly=!UI.devOnly;b.setAttribute("aria-pressed",String(UI.devOnly));drawDevList();},
"dev-view":(b)=>{UI.devView=b.dataset.v;segPress(b);drawDevList();},
"dev-clear":()=>{UI.devQ="";UI.devRoom="all";UI.devOnly=false;UI.devTab="All";rerender();},
rfloor:(b)=>{UI.roomsFloor=b.dataset.v;segPress(b);const list=ROOMS.filter((r)=>UI.roomsFloor==="all"||r.floor===UI.roomsFloor);const g=$(".rgrid");g.innerHTML=list.map(rcardHTML).join("");enter(g);if(UI.roomsFloor!=="all")setFloor("rooms",UI.roomsFloor);},
"clip-chip":(b)=>{UI.clipChip=b.dataset.v;$$("[data-act=clip-chip]").forEach((x)=>x.setAttribute("aria-pressed",String(x===b)));$("#clips").innerHTML=clipsFor().slice(0,12).map(clipHTML).join("")||`<div class="cc-empty">${ic("cam")}<b>No ${b.dataset.v.toLowerCase()} clips</b></div>`;},
"clips-seen":()=>{S.clips.forEach((c)=>(c.seen=true));save();drawShell();rerender();toast("All clips marked as seen");},
clip:(b)=>{const c=S.clips.find((x)=>x.id===b.dataset.id);c.seen=true;save();drawShell();const u=$(".unseen",b);if(u)u.remove();openCam(c.cam);},
"pref-sw":(b)=>{const k=b.dataset.k,cur=S.prefs[k]!=null?!!S.prefs[k]:b.dataset.def==="true";S.prefs[k]=!cur;save();b.setAttribute("aria-checked",String(!cur));},
"alert-sw":(b)=>{const k=b.dataset.k;S.prefs.alerts[k]=!S.prefs.alerts[k];save();b.setAttribute("aria-checked",String(S.prefs.alerts[k]));},
"batt-sw":(b)=>{const k=b.dataset.k;S.batt[k]=!S.batt[k];save();b.setAttribute("aria-checked",String(S.batt[k]));},
theme:(b)=>{S.prefs.theme=b.dataset.v;save();segPress(b);const sys=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";setTheme(b.dataset.v==="system"?sys:b.dataset.v);},
backdrop:(b)=>{S.prefs.backdrop=b.dataset.v;save();$$("[data-act=backdrop]").forEach((x)=>x.setAttribute("aria-pressed",String(x===b)));setBackdrop();},
"person-del":(b)=>{const p=S.people.find((x)=>x.id===b.dataset.id);confirmBox(`Remove ${p.name} from the household? Their door codes stop working.`,"Remove").then((ok)=>{if(ok){S.people=S.people.filter((x)=>x!==p);save();drawShell();toast(first(p.name)+" removed");rerender();}});},
csv:exportCSV,
json:()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="stillhouse-demo-data.json";document.body.appendChild(a);a.click();a.remove();toast("Saved as JSON");},
reset:resetDemo,
"mp-play":()=>{S.media.playing=!S.media.playing;save();const c=$("#npCard");if(c)c.innerHTML=npHTML();},
"mp-next":()=>{S.media.i=(S.media.i+1)%TRACKS.length;S.media.pos=0;save();const c=$("#npCard");if(c)c.innerHTML=npHTML();},
"mp-prev":()=>{if(S.media.pos>5)S.media.pos=0;else S.media.i=(S.media.i+TRACKS.length-1)%TRACKS.length;S.media.pos=0;save();const c=$("#npCard");if(c)c.innerHTML=npHTML();},
seek:(b,e)=>{const r=b.getBoundingClientRect(),tr=TRACKS[S.media.i];S.media.pos=clamp((e.clientX-r.left) / r.width,0,1)*tr.d;drawNP();},
};
const segPress=(b)=>$$("button",b.parentElement).forEach((x)=>x.setAttribute(x.hasAttribute("aria-selected")?"aria-selected":"aria-pressed",String(x===b)));
document.addEventListener("click",(e)=>{
const b=e.target.closest("[data-act]");
if(!b||!ACT[b.dataset.act])return;
if(b.tagName==="A"&&b.getAttribute("href")&&b.getAttribute("href").startsWith("#/")){ACT[b.dataset.act](b,e);return;}
ACT[b.dataset.act](b,e);
});
document.addEventListener("keydown",(e)=>{
if(e.key!=="Enter"&&e.key!==" ")return;
const t=e.target;
if(t.matches&&t.matches('[data-act][role="button"], .rcard[data-act]')){e.preventDefault();t.click();}
if(t.matches&&t.matches(".prog")){e.preventDefault();S.media.pos=Math.min(TRACKS[S.media.i].d-1,S.media.pos+10);drawNP();}
});
document.addEventListener("input",(e)=>{
const t=e.target;
if(t.dataset.lv){t.style.setProperty("--p",t.value+"%");setLevel(t.dataset.lv,+t.value,true);clearTimeout(t._sv);t._sv=setTimeout(save,300);return;}
const k=t.dataset.in;
if(!k)return;
if(k==="devq"){UI.devQ=t.value;drawDevList();}
if(k==="devroom"){UI.devRoom=t.value;drawDevList();}
if(k==="vol"){S.media.vol=+t.value;t.style.setProperty("--p",t.value+"%");save();}
if(k==="reserve"){S.batt.reserve=+t.value;t.style.setProperty("--p",(t.value / 60)*100+"%");$("[data-reserve]").textContent=t.value+"%";save();}
if(k==="blur"){S.prefs.blur=+t.value;t.style.setProperty("--p",((t.value-6) / 34)*100+"%");$("[data-blur]").textContent=t.value;setBackdrop();save();}
});
document.addEventListener("change",(e)=>{if(e.target.dataset.in==="devroom"){UI.devRoom=e.target.value;drawDevList();}});
/* ===== Live: clocks every second, the house every few seconds ===== */
function drawNP(){
const tr=TRACKS[S.media.i],bar=$("[data-np=bar]"),pos=$("[data-np=pos]"),pg=$(".prog");
if(bar)bar.style.width=((S.media.pos / tr.d)*100).toFixed(1)+"%";
if(pos)pos.textContent=mmss(S.media.pos);
if(pg)pg.setAttribute("aria-valuenow",Math.round(S.media.pos));
}
every(1000,()=>{
const n=new Date();
$$("[data-tc]").forEach((el)=>(el.textContent=hms(n)));
const ck=$("#clock");if(ck)ck.textContent=hm(n);
if(S.media.playing){S.media.pos+=1;if(S.media.pos>=TRACKS[S.media.i].d){S.media.i=(S.media.i+1)%TRACKS.length;S.media.pos=0;const c=$("#npCard");if(c)c.innerHTML=npHTML();}drawNP();}
});
const FEED_POOL=[
()=>["cam","Someone walked past the front door",""],()=>["energy",`Battery at ${S.batt.soc}%`,""],()=>["climate",`Mira's room reached ${deg(S.rooms.mira.t)}`,""],
()=>["cam","Fox crossed the garden",""],()=>["energy",E.solar>0.05?`Solar now ${FMT.kw(E.solar)}`:`House drawing ${FMT.kw(E.house)}`,""],()=>["light","Dishwasher: 30 minutes left",""],
()=>["person","Tomas moved to the kitchen","Tomas"],()=>["cam","Car slowed down on the drive",""],()=>["climate","Study air is fresh again",""],
];
let tick=0;
every(3500,()=>{
tick++;
simEnergy();
S.batt.soc=clamp(S.batt.soc+(E.batt>0.05?1:E.batt<-0.05?(tick%3===0?-1:0):0),5,100);
Object.entries(S.rooms).forEach(([id,r])=>{const z=zoneOf(id),tgt=S.zones[z].mode==="off"?16:S.zones[z].mode==="eco"?17.5:S.zones[z].target;r.t=+(r.t+clamp((tgt-r.t)*0.04,-0.08,0.08)+(Math.random()-0.5)*0.04).toFixed(2);});
FLOWS.forEach(updateFlow);
if(current==="home"){
$("#sub").innerHTML=SUBLINE.home();
if(tick%2===0){
const[k,text,who]=FEED_POOL[tick / 2%FEED_POOL.length]();
const e={id:uid(),k,text,who,at:Date.now()};
const ul=$("#feed");
if(ul){ul.insertAdjacentHTML("afterbegin",feedLi(e,true));while(ul.children.length>5)ul.lastElementChild.remove();}
}
if(tick%3===0){
const p=S.people.find((x)=>x.id===(tick%2?"tomas":"leena"));
if(p&&p.home){p.jig=(p.jig||0)+1;$$(`[data-who="${p.id}"]`).forEach((g)=>{const[x,y]=whoXY(p,S.people.indexOf(p));g.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;});}
}
const m=$("[data-vwmeta]");if(m)m.textContent=vwMeta(UI.vw);
}
if(tick%4===0){["ground","up"].forEach((z)=>$$(`.thermo[data-zone="${z}"] .dial-c em`).forEach((el)=>(el.textContent="Now "+deg(zoneNow(z)))));}
if(current==="energy"){const k=$("#kinds");if(k&&tick%2===0)k.innerHTML=kindHTML();}
});
/* ===== Start ===== */
const CMDS=()=>pageCmds(PAGES,[
...S.scenes.map((s)=>({label:"Run "+s.name,icon:s.icon,hint:"Scene",run:()=>runScene(s.id)})),
{label:"Lock every door",icon:"lock",hint:"Security",run:lockUp},
{label:"All lights off",icon:"bulb",hint:"Lights",run:()=>ACT["lights-off"]()},
{label:"Add a device",icon:"plus",hint:"Devices",run:addDevice},
{label:"New rule",icon:"repeat",hint:"Scenes",run:addRule},
{label:"Set the night alarm",icon:"shield",hint:"Security",run:()=>setAlarm("night")},
{label:"Boost the heating for 30 minutes",icon:"bolt",hint:"Climate",run:()=>ACT.boost()},
{label:"Export energy as CSV",icon:"download",hint:"Energy",run:exportCSV},
{label:"Switch theme",icon:"moon",hint:"Look",run:()=>setTheme(APP.theme()==="dark"?"light":"dark")},
{label:"Reset demo data",icon:"refresh",hint:"Settings",run:resetDemo},
...S.devices.filter((d)=>!TY[d.t].fixed).map((d)=>({label:`${d.on?"Turn off":"Turn on"} ${d.name} · ${ROOM[d.room].name}`,icon:iconOf(d),hint:"Device",run:()=>toggleDev(d.id)})),
]);
if(S.prefs.theme&&S.prefs.theme!=="system"&&!new URLSearchParams(location.search).get("theme"))document.documentElement.dataset.theme=S.prefs.theme;
simEnergy();
setBackdrop();
drawShell();
initShell(CMDS);
startRouter(PAGES.map((p)=>p[0]),"home",(name)=>render(name));
</script>
</body>
</html>
