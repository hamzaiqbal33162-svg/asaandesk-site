<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slatewise · Spend control for productions</title>
<meta name="description" content="A spend management app for a film, TV and events company: claims, approvals, crew cards, budgets, vendors and crew.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem("cc-slatewise-1:theme")); } catch (e) { s = null; }
    var t = q === "light" || q === "dark" ? q : s || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* =========================================================
   Base: shared structure. The skin below sets the colours,
   shapes and layout that make this dashboard its own.
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-h,inherit);margin:0;line-height:1.2}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted,.mut{color:var(--muted)}
.sm{font-size:.86em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w,240px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--side,var(--panel));color:var(--side-ink,var(--ink));overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.15em;padding:4px 8px 14px}
.brand svg{width:30px;height:30px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm,8px);text-decoration:none;color:var(--side-mut,var(--muted));font-weight:600;transition:color .2s}
.nav a:hover{color:var(--side-ink,var(--ink))}
.nav a[aria-current="page"]{color:var(--nav-on,var(--acc-ink))}
.nav-marker{position:absolute;left:0;top:0;width:100%;height:40px;border-radius:var(--r-sm,8px);background:var(--acc);opacity:0;transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s,width .3s,opacity .2s;pointer-events:none;z-index:0}
.nav-sec{font-size:.7em;text-transform:uppercase;letter-spacing:.14em;color:var(--side-mut,var(--muted));padding:14px 12px 4px;opacity:.8}
.nav-n{margin-left:auto;font-style:normal;font-size:.72em;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.main{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 26px;background:var(--top-bg,transparent)}
.top h1{font-size:1.35em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:6px 26px 40px;outline:none}
.menu-btn{display:none!important}
.nav-scrim{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.ph h2{font-size:1.45em;margin-right:auto}
.ph p{width:100%;margin:0;color:var(--muted)}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}
 body.nav-open .side{transform:none}
 body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;animation:fadeIn .25s}
 .menu-btn{display:inline-grid!important}
 .top{padding:12px 16px}
 .view{padding:4px 16px 32px}
}

/* ---------- Grid and cards ---------- */
.grid{display:grid;gap:var(--gap,16px);margin-bottom:var(--gap,16px)}
.g-k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.span2{grid-column:span 2}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--panel);border:var(--card-bd,1px solid var(--line));border-radius:var(--r,14px);padding:var(--pad,18px);box-shadow:var(--shadow,none);transition:transform .3s cubic-bezier(.3,.8,.3,1),box-shadow .3s,border-color .3s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h,var(--shadow,none))}
.card.flat:hover{transform:none}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{font-size:1.02em;margin-right:auto}
.ch .sub{color:var(--muted);font-size:.84em;font-weight:500}
.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:650}
.li small{color:var(--muted)}

/* ---------- KPI cards ---------- */
.kpi{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.kpi-i{position:absolute;right:14px;top:14px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--acc)}
.kpi-l{color:var(--muted);font-size:.84em;font-weight:650}
.kpi-v{font-size:1.65em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--font-n,inherit);white-space:nowrap}
.kpi-d{display:inline-flex;align-items:center;gap:2px;font-size:.8em;font-weight:700}
.kpi-d small{font-weight:500;color:var(--muted)}
.kpi-d .i{width:15px;height:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi-s{font-size:.82em;color:var(--muted)}
.kpi-sp{margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-btn,var(--r-sm,9px));cursor:pointer;font-weight:650;font-size:.93em;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s,color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn:active,.icon-btn:active,.chip:active,.seg button:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:var(--btn-sh,none)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.84em}
.btn .i{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm,9px);cursor:pointer;transition:transform .12s,background .2s,border-color .2s;flex:none;padding:0}
.icon-btn:hover{border-color:var(--acc)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm .i{width:15px;height:15px}
.icon-btn[disabled]{opacity:.4;cursor:default}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ring{animation:ring .7s}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
[data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
.kbd{font-size:.75em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- Inputs and forms ---------- */
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-in,var(--r-sm,9px));background:var(--in-bg,var(--panel));color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=range]{padding:0;min-height:24px;accent-color:var(--acc);border:0;background:none;box-shadow:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:.84em;font-weight:650;color:var(--muted)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:.8em}
.err:empty{display:none}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog span{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);transition:background .25s;flex:none}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span::after{transform:translateX(17px)}
.tog input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.srch input{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.84em;font-weight:650;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--r-sm,9px);background:var(--panel2);border:1px solid var(--line);flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-weight:650;font-size:.84em;color:var(--muted);cursor:pointer;border-radius:calc(var(--r-sm,9px) - 2px);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--seg-on,var(--ink))}
.seg-th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-sm,9px) - 2px);background:var(--seg-th,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .3s}

/* ---------- Tables ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar .srch{flex:1 1 200px;max-width:320px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92em}
.tbl th{text-align:left;font-size:.76em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num,.tbl td.num{text-align:right}
.th-s{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.th-s:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th-s .ar{opacity:.45;font-size:.85em}
[aria-sort] .th-s{color:var(--ink)}
[aria-sort] .ar{opacity:1;color:var(--acc)}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover,tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--acc) 8%,transparent))}
tr.click:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.rows-in tr{animation:rowIn .4s both;animation-delay:calc(var(--ri,0) * 30ms)}
@keyframes rowIn{from{opacity:0;translate:0 6px}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85em;color:var(--muted)}
.pg-b{display:flex;gap:4px;align-items:center}
.pgn{min-width:30px;height:30px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;font-weight:650;color:var(--muted)}
.pgn[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.cell2{display:flex;align-items:center;gap:10px;min-width:0}
.cell2 b{display:block;font-weight:650}
.cell2 small{display:block;color:var(--muted);font-size:.85em}

/* ---------- Status pills, avatars, meters ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.77em;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--pc,var(--muted)) 15%,transparent);color:var(--pc,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-paid,.s-approved,.s-active,.s-valid,.s-signed,.s-done,.s-accepted,.s-booked{--pc:var(--ok)}
.s-sent,.s-review,.s-open,.s-scheduled,.s-partial{--pc:var(--info)}
.s-pending,.s-expiring,.s-unsigned,.s-leave{--pc:var(--warn)}
.s-overdue,.s-rejected,.s-expired,.s-frozen,.s-cancelled,.s-declined{--pc:var(--bad)}
.s-draft{--pc:var(--muted)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-av,50%);background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 26%);font-weight:800;font-size:.76em;flex:none;letter-spacing:.02em}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:54px;height:54px;font-size:1em}
.av.sm{width:26px;height:26px;font-size:.66em}
.meter{display:block;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--acc);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.6}
.empty b{color:var(--ink)}
.empty.sm{padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.88em}
.kv dd{margin:0;font-weight:600;text-align:right}

/* ---------- Modals, drawers, menus, command search ---------- */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.ov-bg{position:absolute;inset:0;background:var(--ov,rgba(10,12,20,.5));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.dlg{position:relative;width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;background:var(--dlg-bg,var(--panel));color:var(--ink);border:1px solid var(--line);border-radius:var(--r-dlg,var(--r,16px));box-shadow:0 30px 80px rgba(0,0,0,.35);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1.1)}
.ov.open .ov-bg{opacity:1}
.ov.open .dlg{opacity:1;transform:none}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dlg-h h2{font-size:1.12em;margin-right:auto}
.dlg-b{padding:6px 18px 16px;overflow:auto}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.ov.sm .dlg{width:min(400px,100%)}
.ov.wide .dlg{width:min(760px,100%)}
.ov.xl .dlg{width:min(1120px,100%);max-height:94vh}
.ov.drawer{place-items:stretch end;padding:0}
.ov.drawer .dlg{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(100%)}
.ov.drawer.wide .dlg{width:min(640px,100%)}
.ov.drawer.open .dlg{transform:none}
.ov.pop{place-items:start end;padding:64px 16px 16px}
.ov.pop .ov-bg,.ov.menu .ov-bg{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.ov.pop .dlg{width:min(370px,100%);transform:translateY(-8px) scale(.98);transform-origin:top right}
.ov.menu{display:block;padding:0}
.ov.menu .dlg{position:fixed;width:220px;transform:translateY(-6px);border-radius:12px}
.ov.menu .dlg-h{padding:10px 12px 4px}
.ov.menu .dlg-h h2{font-size:.76em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ov.menu .dlg-h .icon-btn{display:none}
.ov.menu .dlg-b{padding:2px 6px 6px}
.mnu{display:flex;flex-direction:column}
.mi{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--panel2)}
.mi[disabled]{opacity:.55;cursor:default}
.ov.cmdk{place-items:start center;padding-top:12vh}
.cmd-l{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cmd-l button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.cmd-l [aria-selected="true"] button,.cmd-l button:hover{background:var(--panel2)}
.cmd-l small{color:var(--muted)}
.srch.big input{min-height:46px;font-size:1.05em}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.notes li{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.notes li.new{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.notes li small{display:block;color:var(--muted);font-size:.8em}
.notes .i{color:var(--acc);margin-top:2px}
@media (max-width:560px){.ov{padding:0;place-items:end stretch}.ov .dlg{width:100%;border-radius:var(--r-dlg,16px) var(--r-dlg,16px) 0 0;max-height:92vh}.ov.drawer .dlg{border-radius:0}.ov.pop{padding:56px 8px 8px}.ov.menu .dlg{width:220px;border-radius:12px}.ov.cmdk{padding-top:0}}

/* ---------- Toasts and tooltip ---------- */
.toasts{position:fixed;right:18px;bottom:var(--toast-b,18px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm,10px);background:var(--toast-bg,#16181d);color:var(--toast-ink,#fff);box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;font-size:.92em;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:min(380px,calc(100vw - 36px))}
.toast.show{opacity:1;transform:none}
.toast .i{color:var(--ok)}.toast.bad .i{color:var(--bad)}.toast.warn .i{color:var(--warn)}
.t-undo{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
@media (max-width:560px){.toasts{left:12px;right:12px;align-items:stretch}}
.tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip div i{width:8px;height:8px;border-radius:3px;flex:none}
.tip div span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tip .mut{opacity:.75;display:block}

/* ---------- Charts ---------- */
.chart{position:relative;min-width:0;outline:none}
.chart svg{display:block;overflow:visible}
.chart:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.gl{stroke:var(--grid,var(--line));stroke-dasharray:3 4}
.zl{stroke:var(--muted);stroke-width:1;opacity:.6}
.ax{fill:var(--muted);font-size:11px;font-family:var(--font-n,inherit)}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 6;opacity:.9}
.ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawOn 1.3s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes drawOn{to{stroke-dashoffset:0}}
.ar.fade,.band.fade{animation:fadeIn 1.2s .35s both}
.band{opacity:.2}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--panel);stroke-width:2.5}
.bar{transition:opacity .2s}
.bar.dim{opacity:.35}
.bar.grow{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .75s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d,0ms)}
.bar.grow.neg{transform-origin:50% 0}
@keyframes barUp{from{transform:scaleY(0)}}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82em;color:var(--muted);margin-bottom:8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.spk{display:block;overflow:visible}
.spk .ln{stroke-width:2}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dn-w{position:relative;flex:none}
.seg-bg{fill:none;stroke:var(--panel2)}
.dseg{fill:none;transition:opacity .2s;cursor:pointer}
.dseg.dim{opacity:.28}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.25em;font-weight:800}
.dn-c small{color:var(--muted);font-size:.76em}
.dn-l{list-style:none;margin:0;padding:0;flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dn-l li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.88em;transition:background .2s;outline-offset:-2px}
.dn-l li.on{background:var(--panel2)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);font-size:.9em;min-width:34px;text-align:right}
.hb{margin-bottom:11px}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:.88em;margin-bottom:5px}
.hb-l small{display:block;color:var(--muted);font-size:.85em}
.hb-t{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.gg{position:relative;max-width:240px;margin:0 auto}
.gg svg{display:block}
.gg-bg,.gg-v{fill:none;stroke-linecap:round}
.gg-bg{stroke:var(--panel2)}
.gg-t{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-t b{display:block;font-size:1.55em;font-weight:800;line-height:1.1}
.gg-t small{color:var(--muted);font-size:.8em}
.hm{display:grid;gap:3px;font-size:.72em}
.hm-x,.hm-y{color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.hm-y{text-align:right;padding-right:6px;align-self:center}
.hm-c{aspect-ratio:1.4;border-radius:4px;background:color-mix(in srgb,var(--hm,var(--acc)) var(--a),var(--panel2));animation:fadeIn .5s both;animation-delay:var(--d)}
.hm-c:hover{outline:2px solid var(--ink);outline-offset:-1px}

/* ---------- Drag and drop ---------- */
.drag-ghost{box-shadow:0 24px 50px rgba(0,0,0,.3);opacity:.96;transition:none!important;animation:none!important}
.drop-ph{border:2px dashed var(--acc);border-radius:var(--r-sm,10px);background:color-mix(in srgb,var(--acc) 8%,transparent);margin-bottom:8px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.over{outline:2px dashed var(--acc);outline-offset:-3px}
.dropped{animation:drop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:scale(1.06)}}
.grip{cursor:grab;touch-action:none;border:0;background:none;color:var(--muted);padding:2px;display:inline-grid;place-items:center}

/* ---------- Reduced motion: keep it calm ---------- */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* =========================================================
   Skin: Slatewise (clapperboard stripes, charcoal and safety yellow)
   ========================================================= */
/* Tokens: light (concrete paper) and dark (stage black). Yellow is the slate tape. */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-h:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --font-n:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --fs:14px;--r:4px;--r-sm:3px;--r-dlg:6px;--side-w:236px;--gap:14px;--pad:16px;
  --bg:#f1eee5;--panel:#fffdf7;--panel2:#e9e4d6;--ink:#17160f;--muted:#68645a;--line:rgba(23,22,15,.14);
  --acc:#ffc61a;--acc-ink:#17160f;--focus:#17160f;
  --ok:#1b8455;--warn:#a55f00;--bad:#cc3a25;--info:#2a68b5;
  --c1:#e3a400;--c2:#17160f;--c3:#cc3a25;--c4:#16857a;--c5:#5d4dc4;--c6:#3a86d0;
  --side:#141310;--side-ink:#f2efe6;--side-mut:#a29d8e;--nav-on:#ffc61a;
  --shadow:0 1px 0 rgba(23,22,15,.05);--shadow-h:4px 4px 0 var(--ink);
  --toast-bg:#17160f;--hover:rgba(255,198,26,.14);--stripe:#17160f;
}
[data-theme="dark"]{
  --bg:#0e0e0b;--panel:#181814;--panel2:#25241e;--ink:#f1ede0;--muted:#a59f8e;--line:rgba(241,237,224,.13);
  --acc:#ffd23f;--focus:#ffd23f;--ok:#3ccf8e;--warn:#f0a73a;--bad:#ff6a52;--info:#6aa8ff;
  --c1:#ffd23f;--c2:#f1ede0;--c3:#ff6a52;--c4:#3cc6ad;--c5:#9a8cff;--c6:#5fb0ff;
  --side:#070706;--shadow-h:4px 4px 0 var(--acc);--toast-bg:#f1ede0;--toast-ink:#17160f;--tip-bg:#f1ede0;--tip-ink:#17160f;--stripe:#f1ede0;
}
/* Headings: condensed caps like slate chalk lettering */
h1,h2,h3,.ch h3{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.05em;font-stretch:condensed}
.kpi-v,.num,.ax{font-family:var(--font-n)}

/* Sidebar: always dark, with the clapper stripes on top */
.side{padding:18px 14px 14px;border-right:1px solid #000}
.slate-top{flex:none;height:18px;margin:-18px -14px 12px;background:repeating-linear-gradient(-45deg,#f2efe6 0 14px,#141310 14px 28px)}
.brand{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.08em;font-size:1.2em;color:#f2efe6}
.prod-pick{display:flex;flex-direction:column;gap:6px;padding:0 6px 10px;margin-bottom:6px;border-bottom:1px dashed rgba(242,239,230,.18)}
.prod-pick label{font:600 10px var(--font-n);letter-spacing:.14em;text-transform:uppercase;color:var(--side-mut)}
.prod-pick select{background:#22211b;border-color:#3a382f;color:#f2efe6;min-height:34px;font-weight:600}
.nav a{border-radius:0;padding:10px 12px;font-family:var(--font-h);text-transform:uppercase;letter-spacing:.07em;font-size:.95em}
.nav-marker{border-radius:0;background:rgba(255,198,26,.13);box-shadow:inset 3px 0 0 var(--acc)}
.nav-n{background:var(--acc);color:#141310;font-family:var(--font-n)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px dashed rgba(242,239,230,.18)}
.side-foot b{display:block;font-size:.9em}.side-foot small{color:var(--side-mut);font-size:.78em}

/* Top bar */
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.ttl{margin-right:auto;min-width:0}
.ttl small{display:block;font:600 10.5px var(--font-n);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ttl h1{font-size:1.55em;letter-spacing:.06em}
.find{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);color:var(--muted);cursor:pointer;font-weight:600}
.find:hover{border-color:var(--ink)}
@media (max-width:640px){.find span{display:none}}
/* The clapper stick snaps shut on every page change */
.clap{height:9px;margin:12px 26px 6px;background:repeating-linear-gradient(-45deg,var(--stripe) 0 12px,transparent 12px 24px);border:1px solid var(--stripe);transform-origin:0 100%;border-radius:1px}
.clap.snap{animation:clap .55s cubic-bezier(.6,0,.3,1.5)}
@keyframes clap{0%{transform:rotate(-6deg)}50%{transform:rotate(0)}68%{transform:rotate(-1.4deg)}100%{transform:none}}
@media (max-width:900px){.clap{margin:10px 16px 4px}}

/* Cards: square, outlined, a hard offset shadow when lifted */
.card{border:1px solid var(--line)}
.card:hover{transform:translate(-2px,-2px)}
.ch h3{font-size:1.05em}
.kpi{padding-top:18px}
.kpi::after{content:"";position:absolute;right:0;top:0;width:44px;height:44px;background:repeating-linear-gradient(135deg,var(--stripe) 0 5px,transparent 5px 10px);clip-path:polygon(0 0,100% 0,100% 100%);opacity:.85}
.kpi-l{font:600 10.5px var(--font-n);letter-spacing:.12em;text-transform:uppercase}
.kpi-v{font-size:1.75em}
.kpi.hot{background:var(--acc);color:#17160f;border-color:#17160f}
.kpi.hot .kpi-l,.kpi.hot .kpi-s,.kpi.hot .kpi-d small{color:rgba(23,22,15,.75)}
.kpi.hot::after{background:repeating-linear-gradient(135deg,#17160f 0 5px,transparent 5px 10px)}
.btn{text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-h);font-size:.92em}
.btn.pri{border:1px solid #17160f;box-shadow:2px 2px 0 #17160f}
.btn.pri:hover{box-shadow:3px 3px 0 #17160f;transform:translate(-1px,-1px)}
.pill{border-radius:2px;font-family:var(--font-n);text-transform:uppercase;letter-spacing:.06em;font-size:.68em}
.chip{border-radius:2px;text-transform:uppercase;font-family:var(--font-h);letter-spacing:.06em}
.seg{border-radius:2px}.seg button{font-family:var(--font-n)}
.seg-th{background:var(--acc);border-radius:1px}
.seg button[aria-pressed="true"]{color:#17160f}

/* Burn reel: a strip of film, one frame per week */
.reel{overflow-x:auto;border-radius:3px;background:#121210;scrollbar-width:thin}
.reel-in{position:relative;display:grid;grid-template-columns:repeat(12,minmax(62px,1fr));gap:6px;padding:22px 10px;min-width:780px}
.reel-in::before,.reel-in::after{content:"";position:absolute;left:4px;right:4px;height:7px;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(242,239,230,.8) 7px 15px,transparent 15px 22px);border-radius:2px}
.reel-in::before{top:7px}.reel-in::after{bottom:7px}
.reel-in.roll{animation:roll 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{from{transform:translateX(36%);opacity:0}}
.frame{position:relative;display:flex;flex-direction:column;gap:5px;padding:8px 7px;border:1px solid #2f2e27;border-radius:3px;background:#22211c;color:#f2efe6;cursor:pointer;height:156px;text-align:left;transition:background .2s,transform .2s,border-color .2s}
.frame:hover,.frame:focus-visible{background:#302f28;border-color:var(--acc);transform:translateY(-3px)}
.fr-n{font:600 10px var(--font-n);opacity:.6;display:flex;justify-content:space-between}
.fr-bar{flex:1;display:flex;align-items:flex-end;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 12px)}
.fr-bar i{display:block;width:100%;height:var(--h);background:linear-gradient(#ffd23f,#e09a00);border-radius:2px 2px 0 0}
.reel-in.roll .fr-bar i{animation:frUp .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + .55s)}
.frame.over .fr-bar i{background:linear-gradient(#ff8a6e,#cc3a25)}
@keyframes frUp{from{height:0}}
.fr-v{font:700 12px var(--font-n)}
.fr-l{font-size:10px;opacity:.65}
.rec{width:7px;height:7px;border-radius:50%;background:#ff4b33;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.reel-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.82em;color:var(--muted)}
.reel-key i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:#e3a400}
.reel-key i.o{background:#cc3a25}

/* Approval queue: claims look like slates */
.q-stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start;margin-bottom:var(--gap)}
.claim{position:relative;padding:0;overflow:hidden}
.claim-top{height:12px;background:repeating-linear-gradient(-45deg,var(--stripe) 0 10px,transparent 10px 20px);border-bottom:1px solid var(--line)}
.claim-b{padding:14px 16px}
.claim h4{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.05em;font-size:1.05em;margin:0 0 2px}
.claim .amt{font:800 1.6em var(--font-n);margin:8px 0}
.claim dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 12px;font-size:.84em}
.claim dt{font:600 10px var(--font-n);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-top:2px}
.claim dd{margin:0;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.claim .acts{display:flex;gap:8px}
.claim .acts .btn{flex:1}
.claim .stamp{position:absolute;left:50%;top:44%;padding:4px 14px;border:3px solid currentColor;font:900 22px var(--font-h);letter-spacing:.14em;text-transform:uppercase;transform:translate(-50%,-50%) rotate(-12deg) scale(2);opacity:0;pointer-events:none}
.claim.go-ok .stamp{color:var(--ok);animation:stampIn .35s forwards}
.claim.go-no .stamp{color:var(--bad);animation:stampIn .35s forwards}
.claim.go-ok{animation:outR .55s .35s cubic-bezier(.5,0,.8,.4) forwards}
.claim.go-no{animation:outL .55s .35s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes stampIn{to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
@keyframes outR{to{transform:translateX(70px) rotate(5deg);opacity:0}}
@keyframes outL{to{transform:translateX(-70px) rotate(-5deg);opacity:0}}
.miss{color:var(--warn);font-weight:700}

/* Company cards: plastic cards with the slate stripe */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:var(--gap)}
.pc{padding:12px}
.pc-face{position:relative;aspect-ratio:1.586;border-radius:10px;padding:14px 16px;color:#f2efe6;background:linear-gradient(140deg,#2a2922,#0c0c0a 70%);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 22px rgba(0,0,0,.25);transition:filter .4s}
.pc-face.v{background:linear-gradient(140deg,#3b3226,#120f0b 70%)}
.pc-face::before{content:"";position:absolute;left:-12%;right:-12%;top:30%;height:20px;background:repeating-linear-gradient(-45deg,var(--acc) 0 11px,#0c0c0a 11px 22px);transform:rotate(-5deg);opacity:.95}
.pc-face>*{position:relative}
.pc-row{display:flex;justify-content:space-between;align-items:center}
.pc-chip{width:32px;height:24px;border-radius:5px;background:linear-gradient(135deg,#ecd690,#b39042)}
.pc-no{font:600 15px var(--font-n);letter-spacing:.14em}
.pc-h{font:600 11px var(--font-n);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.pc-k{font:700 10px var(--font-n);letter-spacing:.16em;opacity:.7}
.pc.frozen .pc-face{filter:saturate(.15) brightness(.85)}
.pc-ice{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,rgba(190,225,255,.55),rgba(255,255,255,.12)),repeating-linear-gradient(60deg,rgba(255,255,255,.3) 0 1px,transparent 1px 13px),repeating-linear-gradient(-60deg,rgba(255,255,255,.22) 0 1px,transparent 1px 17px);color:#0c2a44;opacity:0;transform:scale(1.08);transition:opacity .5s,transform .5s}
.pc-ice .i{width:42px;height:42px;stroke-width:1.5}
.pc.frozen .pc-ice{opacity:1;transform:none}
.pc-meta{display:flex;justify-content:space-between;font-size:.84em;margin:12px 2px 6px}
.pc-acts{display:flex;gap:6px;margin-top:10px}
.pc-acts .btn{flex:1}

/* Receipt drawn in the expense drawer */
.rcpt{position:relative;margin:4px auto 16px;width:min(270px,100%);padding:16px 16px 22px;background:#fffef8;color:#222;font:12px var(--font-n);box-shadow:0 6px 18px rgba(0,0,0,.15);clip-path:polygon(0 0,100% 0,100% 100%,95% 97%,90% 100%,85% 97%,80% 100%,75% 97%,70% 100%,65% 97%,60% 100%,55% 97%,50% 100%,45% 97%,40% 100%,35% 97%,30% 100%,25% 97%,20% 100%,15% 97%,10% 100%,5% 97%,0 100%)}
.rcpt b{display:block;text-align:center;font-size:13px;margin-bottom:6px}
.rcpt div{display:flex;justify-content:space-between;border-bottom:1px dashed #bbb;padding:3px 0}
.rcpt .tot{font-weight:800;border:0;padding-top:8px}
.rcpt.none{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none;clip-path:none;text-align:center;padding:26px 12px}
.rcpt.scan::after{content:"";position:absolute;left:0;right:0;height:3px;top:0;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:scan 1s ease-in-out 2}
@keyframes scan{50%{top:calc(100% - 3px)}}
.dept-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.prod-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.prod-c{cursor:pointer;text-align:left;font:inherit;color:inherit}
.prod-c[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--acc)}
.prod-c h4{font-family:var(--font-h);text-transform:uppercase;letter-spacing:.05em;margin:0 0 2px;font-size:1.05em}
.prod-c .big{font:800 1.3em var(--font-n);margin:8px 0 6px}
.state-ok{color:var(--ok);font-weight:700}.state-watch{color:var(--warn);font-weight:700}.state-over{color:var(--bad);font-weight:700}
.policy .fld{margin-bottom:12px}
.set-grid .card h3{margin-bottom:12px}
@media (max-width:560px){.ttl h1{font-size:1.25em}.kpi-v{font-size:1.45em}}

</style>
</head>
<body>
<!-- App shell: dark slate sidebar, top bar with the scene counter, and the page view -->
<div class="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <div class="slate-top" aria-hidden="true"></div>
    <a class="brand" href="#/overview" aria-label="Slatewise home">

/* ---------- Demo data from a seed ---------- */
function seed() {
  R = rng(2026);
  const vendors = VEND.map(([name, dept], i) => ({ id: 'v' + i, name, dept, city: pick(['Karachi', 'Lahore', 'Islamabad']), phone: '03' + rint(0, 4) + rint(10, 99) + ' ' + rint(1000000, 9999999), terms: pick([0, 7, 15, 30]) }));
  const crew = CREW.map(([name, role, dept, prod], i) => ({ id: 'c' + i, name, role, dept, prod, rate: rint(6, 40) * 1000, email: name.toLowerCase().replace(/\s+/g, '.') + '@kitehill.pk' }));
  const cards = crew.slice(0, 12).map((c, i) => ({ id: 'k' + i, crew: c.id, last4: String(rint(1000, 9999)), limit: pick([100e3, 150e3, 250e3, 400e3]), frozen: i === 4, kind: i % 3 === 2 ? 'Virtual' : 'Physical' }));
  const hasCard = id => cards.some(k => k.crew === id);
  const ex = [];
  for (let d = 179; d >= 0; d--) {
    const date = daysAgo(d), live = PRODS.filter(p => p.start <= date), n = rint(0, 3) + (d < 50 ? 1 : 0);
    for (let k = 0; k < n && live.length; k++) {
      const p = pick(live), dept = pick(DEPTS), v = pick(vendors.filter(x => x.dept === dept)), pc = crew.filter(c => c.prod === p.id), c = pick(pc.filter(x => x.dept === dept).concat(pc));
      const [a, b] = RANGE[dept], amt = Math.round(rnd(a, b) * (chance(.7) ? .3 : 1) / 50) * 50;
      let method = amt > 150e3 ? pick(['Bank transfer', 'Vendor invoice']) : chance(.72) ? 'Card' : 'Petty cash';
      if (method === 'Card' && !hasCard(c.id)) method = 'Petty cash';
      const receipt = method === 'Petty cash' ? chance(.7) : chance(.94);
      const status = d > 8 ? (chance(.04) ? 'rejected' : 'approved') : chance(.55) ? 'pending' : 'approved';
      ex.push({ id: 'e' + ex.length, date, prod: p.id, dept, vendor: v.id, crew: c.id, amt, method, receipt, status, note: pick(NOTE[dept]) });
    }
  }
  // Budgets: per production and department, set around what is being spent so some lines run hot
  const bud = {};
  PRODS.forEach(p => { bud[p.id] = {}; DEPTS.forEach(d => { const s = sum(ex.filter(e => e.prod === p.id && e.dept === d).map(e => e.amt)); bud[p.id][d] = Math.max(2e5, Math.round(s * rnd(.92, 1.7) / 1e4) * 1e4); }); });
  return { v: 1, ex: ex.reverse(), vendors, crew, cards, bud, policy: { auto: 5000, receipt: 2000, two: 250000 }, set: { company: 'Kite Hill Pictures', approver: 'Hira Qureshi', city: 'Karachi', weekly: true, sms: true } };
}
let D = LS.get(KEY) || seed();
const save = () => LS.set(KEY, D);

/* ---------- Lookups and totals ---------- */
const byId = (list, id) => list.find(x => x.id === id);
const prodName = id => (byId(PRODS, id) || {}).name || '—';
const crewName = id => (byId(D.crew, id) || { name: 'Former crew' }).name;
const vendName = id => (byId(D.vendors, id) || { name: 'Unknown vendor' }).name;
const inProd = e => ST.prod === 'all' || e.prod === ST.prod;
const live = () => D.ex.filter(e => e.status !== 'rejected' && inProd(e));
const prodsNow = () => ST.prod === 'all' ? PRODS : PRODS.filter(p => p.id === ST.prod);
const budOf = (pid, dept) => dept ? D.bud[pid][dept] : sum(Object.values(D.bud[pid]));
const budNow = dept => sum(prodsNow().map(p => budOf(p.id, dept)));
const spendBetween = (a, b) => sum(live().filter(e => e.date >= a && e.date <= b).map(e => e.amt));
const cardSpend = k => sum(D.ex.filter(e => e.method === 'Card' && e.crew === k.crew && e.status !== 'rejected' && e.date.slice(0, 7) === TODAY_S.slice(0, 7)).map(e => e.amt));
const pendingCount = () => D.ex.filter(e => e.status === 'pending').length;
const updBadges = () => { $$('[data-badge="approvals"]').forEach(b => { const n = pendingCount(); b.textContent = n; b.hidden = !n; }); };
const commit = (msg, kind, undo) => { save(); refresh(); updBadges(); if (msg) toast(msg, kind, undo); };
const clap = () => { const c = $('#clap'); if (!c || RM) return; c.classList.remove('snap'); void c.offsetWidth; c.classList.add('snap'); };

  m.el.addEventListener('click', ev => {

const exFields = () => [
  { k: 'vendor', label: 'Vendor', type: 'select', opts: D.vendors.map(v => [v.id, v.name]), req: true },
  { k: 'amt', label: 'Amount (Rs)', type: 'number', min: 1, step: 50, req: true },

function exForm(e) {
  const isNew = !e;
  formModal({
    title: isNew ? 'Add a claim' : 'Edit claim', fields: exFields(), save: isNew ? 'Add claim' : 'Save changes',
    values: e || { prod: ST.prod === 'all' ? 'mon' : ST.prod, date: TODAY_S, method: 'Card', receipt: true, vendor: D.vendors[0].id, dept: D.vendors[0].dept, crew: D.crew[0].id },
    onOpen: (m, f) => { const vs = $('#f_vendor', f), ds = $('#f_dept', f); vs.addEventListener('change', () => { const v = byId(D.vendors, vs.value); if (v) ds.value = v.dept; }); },
    onSave: v => {
      if (isNew) {
        const auto = v.amt < D.policy.auto && v.receipt;
        D.ex.unshift({ id: uid('e'), ...v, status: auto ? 'approved' : 'pending' });
        commit(auto ? 'Claim added and auto-approved (under ' + money(D.policy.auto) + ')' : 'Claim added to the approval queue');
        if (!auto) notify('New claim from ' + crewName(v.crew) + ': ' + money(v.amt));
      } else { Object.assign(e, v); commit('Claim updated'); }
    }
  });
}
function decide(id, st, reason) {
  const e = byId(D.ex, id); if (!e) return;
  const was = e.status; e.status = st; if (reason) e.reason = reason;
  clap();
  commit(st === 'approved' ? 'Approved ' + money(e.amt) + ' for ' + vendName(e.vendor) : 'Sent back to ' + crewName(e.crew), st === 'approved' ? 'ok' : 'warn', () => { e.status = was; delete e.reason; commit('Decision undone'); });
}
function askReject(id, after) {
  const e = byId(D.ex, id);
  formModal({ title: 'Send back this claim', save: 'Reject claim', intro: `<p class="muted">${esc(crewName(e.crew))} will get your note by SMS and email.</p>`, fields: [{ k: 'reason', label: 'Note to the crew member', type: 'textarea', full: true, req: true, ph: 'For example: please add the fuel receipt' }], onSave: v => { if (after) after(() => decide(id, 'rejected', v.reason)); else decide(id, 'rejected', v.reason); } });
}

function drawPlan() {
  const el = $('#planChart'); if (!el) return;
  const daily = sum(prodsNow().map(p => budOf(p.id) / Math.max(1, dayDiff(p.wrap, p.start))));
  let labels, act = [], plan = [];
  if (ST.range === '6M') {
    const ks = monthKeys(6); labels = ks.map(fMon); let a = 0, p = 0;
    ks.forEach(k => { a += sum(live().filter(e => e.date.startsWith(k)).map(e => e.amt)); p += daily * 30.4; act.push(a); plan.push(Math.round(p)); });
  } else {
    const n = ST.range === '7D' ? 7 : 30; labels = []; let a = 0;
    for (let i = n - 1; i >= 0; i--) { const d = daysAgo(i); labels.push(fDay(d)); a += spendBetween(d, d); act.push(a); plan.push(Math.round(daily * (n - i))); }
  }
  lineChart(el, { labels, series: [{ name: 'Actual spend', data: act, color: 'var(--c1)' }, { name: 'Plan', data: plan, color: 'var(--c2)', dash: true }], fmt: v => money(v), yfmt: v => short(v), h: 230, label: 'Cumulative spend against plan' });
}

function crewDrawer(c) {
  const ex = D.ex.filter(e => e.crew === c.id), k = D.cards.find(q => q.crew === c.id);
  const m = drawer(esc(c.name), `<div class="row" style="margin-bottom:14px">${av(c.name, 'lg')}<span><b>${esc(c.role)}</b><br><small class="muted">${esc(c.dept)} · ${esc(prodName(c.prod))}</small></span></div><dl class="kv"><dt>Email</dt><dd>${esc(c.email)}</dd><dt>Day rate</dt><dd>${money(c.rate)}</dd><dt>Card</dt><dd>${k ? '•••• ' + k.last4 + (k.frozen ? ' (frozen)' : '') : 'No card'}</dd><dt>All claims</dt><dd>${money(sum(ex.filter(e => e.status !== 'rejected').map(e => e.amt)))}</dd></dl><h3 style="margin:18px 0 6px;font-size:.95em">Recent claims</h3><ul class="list">${ex.slice(0, 7).map(e => `<li class="li"><span class="grow"><b>${esc(vendName(e.vendor))}</b><small>${fDay(e.date)} · ${esc(e.note)}</small></span>${pill(e.status)}<b class="num">${money(e.amt)}</b></li>`).join('') || '<li class="empty sm">No claims yet</li>'}</ul>`, `<button type="button" class="btn ghost danger" data-x="del">${ico('trash')}Remove</button><span class="sp"></span>${k ? '' : `<button type="button" class="btn ghost" data-x="card">${ico('card')}Issue card</button>`}<button type="button" class="btn pri" data-x="edit">${ico('edit')}Edit</button>`);
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x; if (x === 'edit') { m.close(); formModal({ title: 'Edit crew member', fields: cFields, values: c, onSave: y => { Object.assign(c, y); commit('Crew member saved'); } }); } if (x === 'card') { m.close(); D.cards.push({ id: uid('k'), crew: c.id, kind: 'Virtual', limit: 100000, last4: String(1000 + Math.floor(Math.random() * 8999)), frozen: false }); commit('Virtual card issued to ' + c.name); } if (x === 'del') confirmBox('Remove ' + esc(c.name) + ' from the crew list?', () => { const i = D.crew.indexOf(c); D.crew.splice(i, 1); m.close(); commit(c.name + ' removed', 'ok', () => { D.crew.splice(i, 0, c); commit('Crew member restored'); }); }, { ok: 'Remove' }); });
}

/* ---------- Page: Settings ---------- */
PAGES.settings = {
  title: 'Settings', render(v) {
    v.innerHTML = `<div class="grid g2 set-grid">
    <section class="card"><h3>Company</h3><form id="setF" novalidate>${fieldsHTML([{ k: 'company', label: 'Company name', req: true, full: true }, { k: 'approver', label: 'Main approver', type: 'select', opts: D.crew.map(c => c.name) }, { k: 'city', label: 'Head office', type: 'select', opts: ['Karachi', 'Lahore', 'Islamabad'] }, { k: 'weekly', label: 'Weekly spend email', type: 'check', hint: 'Every Monday at 9:00' }, { k: 'sms', label: 'SMS on new claims', type: 'check', hint: 'Text the approver' }], D.set)}<div class="row" style="margin-top:14px"><button type="submit" class="btn pri">Save settings</button></div></form></section>
    <section class="card"><h3>Display</h3><p class="muted">Pick a theme. Your choice is saved on this device.</p><div class="row"><button type="button" class="btn" data-act="setTheme" data-v="light">${ico('sun')}Light</button><button type="button" class="btn" data-act="setTheme" data-v="dark">${ico('moon')}Dark</button></div>
    <h3 style="margin-top:22px">Data</h3><p class="muted">Download every claim, or put the demo back the way it started.</p><div class="row"><button type="button" class="btn" data-act="exportSpend">${ico('download')}Export claims</button><button type="button" class="btn ghost danger" data-act="reset">${ico('refresh')}Reset demo data</button></div>
    <h3 style="margin-top:22px">Shortcuts</h3><dl class="kv"><dt>Search and commands</dt><dd><span class="kbd">Ctrl K</span></dd><dt>Close a dialog</dt><dd><span class="kbd">Esc</span></dd><dt>Move through a chart</dt><dd><span class="kbd">←</span> <span class="kbd">→</span></dd></dl></section></div>`;
    $('#setF').addEventListener('submit', e => { e.preventDefault(); const x = readFields($('#setF'), [{ k: 'company', label: 'Company name', req: true }, { k: 'approver', label: 'Approver' }, { k: 'city', label: 'City' }, { k: 'weekly', type: 'check' }, { k: 'sms', type: 'check' }]); if (x) { D.set = x; commit('Settings saved'); } });
  }
};
ACT.setTheme = b => { setTheme(b.dataset.v); toast(cap(b.dataset.v) + ' theme on'); };
ACT.reset = () => confirmBox('Put all demo data back to how it started? Your changes will be lost.', () => { D = seed(); ST.prod = 'all'; $('#prodSel').value = 'all'; save(); refresh(); updBadges(); toast('Demo data reset'); }, { ok: 'Reset data' });

/* ---------- Boot ---------- */
$('#prodSel').innerHTML = '<option value="all">All productions</option>' + PRODS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
$('#prodSel').addEventListener('change', e => { ST.prod = e.target.value; refresh(); toast('Showing ' + (ST.prod === 'all' ? 'all productions' : prodName(ST.prod))); });
const NAV = [['overview', 'Overview', 'home'], ['spend', 'Spend', 'receipt'], ['approvals', 'Approvals', 'check', pendingCount()], ['cards', 'Cards', 'card'], ['budgets', 'Budgets', 'pie'], ['vendors', 'Vendors', 'building'], ['crew', 'Crew', 'users'], ['settings', 'Settings', 'cog']];
boot({
  name: 'Slatewise', key: KEY, home: 'overview', nav: NAV,
  notes: [['3 claims are waiting for your approval', 'info', '09:12'], ['Card •••• ' + (D.cards[1] ? D.cards[1].last4 : '0000') + ' is close to its limit', 'bad', 'yesterday'], ['Locations on Monsoon Letters is 92% used', 'info', '2 days ago']],
  commands: [{ label: 'Add a claim', hint: 'Action', run: () => exForm() }, { label: 'Issue a card', hint: 'Action', run: ACT.newCard }, { label: 'Move budget', hint: 'Action', run: ACT.realloc }, { label: 'Export claims CSV', hint: 'Action', run: ACT.exportSpend }, { label: 'Switch theme', hint: 'Action', run: ACT.theme }],
  search: q => D.crew.filter(c => c.name.toLowerCase().includes(q)).map(c => ({ label: c.name, hint: c.role, run: () => crewDrawer(c) })).concat(D.vendors.filter(x => x.name.toLowerCase().includes(q)).map(x => ({ label: x.name, hint: 'Vendor', run: () => vendorDrawer(x) }))),
  onRoute: name => { const i = NAV.findIndex(n => n[0] === name) + 1; $('#scene').textContent = 'Scene ' + String(i).padStart(2, '0') + ' · Take ' + (1 + Math.floor(Date.now() / 4096) % 4); clap(); },
  onBoot: updBadges
});

</script>
