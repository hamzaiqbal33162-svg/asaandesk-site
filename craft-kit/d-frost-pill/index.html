<!doctype html>
<!-- Chill & Craft · Frost Pill · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frost Pill · glass tab bar with a sun and moon switch</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  // The sun and moon switch in the bar can change it afterwards.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      if (document.documentElement.dataset.userSet) return; // the switch was used
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --ink: #1e2340;
    --muted: #4f5679;
    --glass: rgba(255, 255, 255, 0.28);
    --glass-edge: rgba(255, 255, 255, 0.7);
    --glass-hi: rgba(255, 255, 255, 0.9);
    --glass-lo: rgba(30, 40, 90, 0.12);
    --glass-shadow: rgba(40, 50, 110, 0.45);
    --lens: rgba(255, 255, 255, 0.55);
    --lens-edge: rgba(255, 255, 255, 0.95);
    --icon: #3b4268;
    --focus: #1e2340;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ink: #eef0ff;
    --muted: #b3b8de;
    --glass: rgba(20, 22, 50, 0.32);
    --glass-edge: rgba(255, 255, 255, 0.18);
    --glass-hi: rgba(255, 255, 255, 0.28);
    --glass-lo: rgba(0, 0, 0, 0.35);
    --glass-shadow: rgba(0, 0, 0, 0.7);
    --lens: rgba(255, 255, 255, 0.14);
    --lens-edge: rgba(255, 255, 255, 0.35);
    --icon: #d5d8f5;
    --focus: #ffe08a;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: #8fc2ff;
    transition: color 0.6s;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* ---------- The scene behind the glass ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 112px;
  }
  .sky { position: absolute; inset: 0; transition: opacity 0.9s ease; }
  .sky.day { background: linear-gradient(180deg, #7fb8ff 0%, #b9d8ff 45%, #ffd9c0 100%); }
  .sky.night { background: linear-gradient(180deg, #070b26 0%, #1b1c4f 55%, #3d2466 100%); opacity: 0; }
  :root[data-theme="dark"] .sky.day { opacity: 0; }
  :root[data-theme="dark"] .sky.night { opacity: 1; }
  .stars {
    position: absolute; inset: 0; opacity: 0; transition: opacity 0.9s;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 14%, #fff, transparent 70%),
      radial-gradient(1px 1px at 22% 40%, #fff, transparent 70%),
      radial-gradient(1.5px 1.5px at 35% 8%, #fff, transparent 70%),
      radial-gradient(1px 1px at 52% 30%, #fff, transparent 70%),
      radial-gradient(1.5px 1.5px at 66% 12%, #fff, transparent 70%),
      radial-gradient(1px 1px at 78% 44%, #fff, transparent 70%),
      radial-gradient(1.5px 1.5px at 90% 22%, #fff, transparent 70%),
      radial-gradient(1px 1px at 14% 70%, #fff, transparent 70%),
      radial-gradient(1px 1px at 84% 78%, #fff, transparent 70%);
    animation: twinkle 3.5s ease-in-out infinite alternate;
  }
  :root[data-theme="dark"] .stars { opacity: 1; }
  @keyframes twinkle { to { filter: brightness(0.55); } }

  /* big round shapes that the glass blurs and tints */
  .orb { position: absolute; border-radius: 50%; transition: background 0.9s, transform 0.9s; animation: float 9s ease-in-out infinite alternate; }
  .orb.a { width: 46vmax; height: 46vmax; left: -12vmax; bottom: -20vmax; background: #ff8a6b; }
  .orb.b { width: 30vmax; height: 30vmax; right: -6vmax; bottom: -8vmax; background: #ffd24c; animation-delay: -3s; }
  .orb.c { width: 18vmax; height: 18vmax; left: 38%; bottom: 6%; background: #3fd0b5; animation-delay: -6s; }
  .orb.sun { width: 120px; height: 120px; right: 9%; top: 9%; background: radial-gradient(circle, #fff6c9, #ffd45a 60%); box-shadow: 0 0 60px #ffe08a; animation: none; }
  :root[data-theme="dark"] .orb.a { background: #6b3cff; }
  :root[data-theme="dark"] .orb.b { background: #ff4fa3; }
  :root[data-theme="dark"] .orb.c { background: #2b7bff; }
  :root[data-theme="dark"] .orb.sun {
    background: radial-gradient(circle at 38% 38%, #ffffff, #d9dcf5 70%);
    box-shadow: 0 0 50px rgba(220, 225, 255, 0.55);
    transform: scale(0.75);
  }
  @keyframes float { to { transform: translate(3vmax, -3vmax); } }

  /* ---------- Content that changes per tab ---------- */
  .content { position: relative; z-index: 1; width: min(560px, 100%); text-align: center; }
  .content .eyebrow { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .content h1 { margin: 6px 0 8px; font-size: clamp(28px, 7vw, 44px); letter-spacing: -0.03em; }
  .content p.lead { margin: 0 auto 18px; max-width: 34ch; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .chip {
    min-width: 120px;
    padding: 12px 16px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    backdrop-filter: blur(12px) saturate(160%);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    font-size: 13px;
    text-align: left;
  }
  .chip b { display: block; font-size: 18px; }
  .view.enter { animation: lift 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes lift { from { opacity: 0; transform: translateY(12px) scale(0.98); } }

  /* ---------- The glass bar ---------- */
  .glass {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 22px;
    /* JS tips the glass a few degrees toward the pointer */
    transform: translateX(-50%) perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    border-radius: 30px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    box-shadow: inset 0 1px 1px var(--glass-hi), inset 0 -2px 4px var(--glass-lo), 0 20px 40px -18px var(--glass-shadow);
    transition: background 0.6s, border-color 0.6s, box-shadow 0.6s, transform 0.45s cubic-bezier(0.3, 1.4, 0.5, 1);
  }
  /* the shiny streak across the top half of the glass */
  .glass::before {
    content: "";
    position: absolute;
    inset: 1px 10px auto;
    height: 45%;
    border-radius: 24px 24px 50% 50% / 24px 24px 12px 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
    pointer-events: none;
    opacity: 0.8;
  }
  :root[data-theme="dark"] .glass::before { opacity: 0.25; }

  .lens {
    position: absolute;
    top: 6px;
    left: 0;
    width: 60px;
    height: 54px;
    border-radius: 24px;
    background: var(--lens);
    border: 1px solid var(--lens-edge);
    box-shadow: inset 0 1px 2px var(--glass-hi), 0 6px 14px -8px var(--glass-shadow);
    transition: background 0.6s;
    pointer-events: none;
    will-change: transform, width;
  }
  /* a soft light that follows the pointer across the glass */
  .shine {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(130px 70px at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, 0.5), transparent 70%);
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }
  .glass:hover .shine { opacity: 1; }
  :root[data-theme="dark"] .shine { background: radial-gradient(130px 70px at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, 0.16), transparent 70%); }
  .tab, .mode {
    position: relative;
    z-index: 1;
    border: 0;
    background: none;
    color: var(--icon);
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tab {
    width: 60px;
    height: 54px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 600;
    transition: color 0.3s;
  }
  .tab svg, .mode svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab svg { transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1), scale 0.12s; }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab[aria-current="page"] svg { transform: scale(1.12); }
  .tab:hover { color: var(--ink); }
  .tab:hover svg { translate: 0 -2px; }
  .tab:active svg, .mode:active svg { scale: 0.8; }
  /* each icon reacts when chosen */
  .tab[aria-current="page"][data-anim="turn"] svg { animation: turn 0.7s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .tab[aria-current="page"][data-anim="snap"] svg { animation: snap 0.6s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .tab[aria-current="page"][data-anim="beat"] svg { animation: beat 0.7s ease-out; }
  .tab[aria-current="page"][data-anim="gear"] svg { animation: gear 0.9s cubic-bezier(0.3, 1.3, 0.5, 1); }
  @keyframes turn { from { transform: rotate(-90deg) scale(0.7); } }
  @keyframes snap { 30% { transform: rotate(-12deg) scale(0.85); } 65% { transform: rotate(6deg) scale(1.2); } }
  @keyframes beat { 20% { transform: translateY(-5px) scale(1.15); } 40% { transform: translateY(0) scale(1.12, 0.9); } 60% { transform: translateY(-2px) scale(1.15); } }
  @keyframes gear { from { transform: rotate(-180deg) scale(0.8); } }
  /* chips arrive one after another */
  .in { animation: chip-in 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
  @keyframes chip-in { from { opacity: 0; transform: translateY(18px) rotateX(-30deg) scale(0.9); } }
  .cards { perspective: 600px; }
  .chip { transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .chip:hover { transform: translateY(-3px); }
  .divider { width: 1px; height: 30px; margin: 0 4px; background: var(--glass-edge); }

  /* ---------- Sun and moon switch ---------- */
  .mode { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; }
  .mode:hover { background: var(--lens); }
  .mode svg { width: 26px; height: 26px; overflow: visible; }
  .mode .core { fill: currentColor; stroke: none; transform-box: fill-box; transform-origin: center; transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .mode .bite { transition: transform 0.5s cubic-bezier(0.3, 1.2, 0.5, 1); }
  .mode .rays { transform-origin: 12px 12px; transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.3s; }
  .mode[aria-checked="true"] .core { transform: scale(1.6); }
  .mode[aria-checked="true"] .bite { transform: translate(-8px, 5px); }
  .mode[aria-checked="true"] .rays { transform: rotate(90deg) scale(0.3); opacity: 0; }
  .mode { position: relative; }
  /* little stars (or sun sparks) that burst out of the switch */
  .pop { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .pop i {
    position: absolute; width: 6px; height: 6px; margin: -3px;
    background: #ffd45a; opacity: 0;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  }
  :root[data-theme="dark"] .pop i { background: #e9ecff; }
  .pop.go i { animation: star-out 0.7s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .pop i:nth-child(1) { --a: 0deg; } .pop i:nth-child(2) { --a: 45deg; } .pop i:nth-child(3) { --a: 90deg; } .pop i:nth-child(4) { --a: 135deg; }
  .pop i:nth-child(5) { --a: 180deg; } .pop i:nth-child(6) { --a: 225deg; } .pop i:nth-child(7) { --a: 270deg; } .pop i:nth-child(8) { --a: 315deg; }
  @keyframes star-out {
    0% { opacity: 1; transform: rotate(var(--a)) translateY(-10px) scale(0.6); }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-34px) scale(1.3) rotate(90deg); }
  }

  @media (max-width: 380px) {
    .tab, .lens { width: 54px; }
    .tab { font-size: 10px; }
    .mode { width: 44px; height: 44px; }
    .divider { margin: 0 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="sky day" aria-hidden="true"></div>
  <div class="sky night" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <span class="orb a" aria-hidden="true"></span>
  <span class="orb b" aria-hidden="true"></span>
  <span class="orb c" aria-hidden="true"></span>
  <span class="orb sun" aria-hidden="true"></span>

  <section class="content" aria-labelledby="title">
    <div class="view" id="view">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <nav class="glass" aria-label="Sections">
    <span class="shine" aria-hidden="true"></span>
    <span class="lens" id="lens" aria-hidden="true"></span>
    <button class="tab" type="button" data-anim="turn" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      Overview
    </button>
    <button class="tab" type="button" data-anim="snap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4.5 3.5"/></svg>
      Photos
    </button>
    <button class="tab" type="button" data-anim="beat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
      Music
    </button>
    <button class="tab" type="button" data-anim="gear">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      Settings
    </button>
    <span class="divider" aria-hidden="true"></span>
    <button class="mode" id="mode" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <mask id="moon-cut" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36">
          <rect x="-6" y="-6" width="36" height="36" fill="#fff"/>
          <circle class="bite" cx="23" cy="5" r="6" fill="#000"/>
        </mask>
        <g mask="url(#moon-cut)"><circle class="core" cx="12" cy="12" r="5"/></g>
        <g class="rays"><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></g>
      </svg>
      <span class="pop" id="pop" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </button>
  </nav>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var nav = document.querySelector(".glass");
    var lens = document.getElementById("lens");
    var tabs = Array.prototype.slice.call(nav.querySelectorAll(".tab"));
    var mode = document.getElementById("mode");
    var status = document.getElementById("status");
    var view = document.getElementById("view");
    var els = { eyebrow: "eyebrow", title: "title", lead: "lead", cards: "cards" };
    Object.keys(els).forEach(function (k) { els[k] = document.getElementById(els[k]); });
    var current = 0;

    // ---------- Demo content ----------
    function chip(label, value) { return '<div class="chip">' + label + "<b>" + value + "</b></div>"; }
    var screens = [
      { eyebrow: "Overview", title: "Morning, Hiba", lead: "Your week at a glance, under one sheet of frosted glass.",
        cards: chip("Weather", "24° Clear") + chip("Steps", "6,210") + chip("Next", "Design call") },
      { eyebrow: "Photos", title: "Weekend in Murree", lead: "84 new photos sorted into 3 small albums.",
        cards: chip("Pine walk", "31") + chip("Mall Road", "29") + chip("Sunset", "24") },
      { eyebrow: "Music", title: "Now playing", lead: "Slow Rain, by the Saltlight Trio. 2 of 12 in your evening mix.",
        cards: chip("Time", "1:42 / 4:05") + chip("Volume", "60%") },
      { eyebrow: "Settings", title: "Make it yours", lead: "Use the sun and moon switch in the bar to change the light.",
        cards: chip("Theme", "Auto") + chip("Text size", "Medium") + chip("Sounds", "On") }
    ];
    function render(i) {
      var s = screens[i];
      els.eyebrow.textContent = s.eyebrow;
      els.title.textContent = s.title;
      els.lead.textContent = s.lead;
      els.cards.innerHTML = s.cards;
      view.classList.remove("enter");
      void view.offsetWidth;
      view.classList.add("enter");
      Array.prototype.forEach.call(els.cards.children, function (el, k) {
        el.style.animationDelay = 120 + k * 80 + "ms";
        el.classList.add("in");
      });
    }

    // ---------- Lens follows the active tab on a spring and stretches with speed ----------
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var lx = 0, lv = 0, ltarget = 0, lw = 60, raf = 0, last = 0;
    function paintLens() {
      var stretch = Math.min(28, Math.abs(lv) * 0.03);
      lens.style.width = lw + stretch + "px";
      lens.style.transform = "translateX(" + (lx - stretch / 2) + "px) scaleY(" + (1 - stretch / 140) + ")";
    }
    function lensTick(now) {
      var dt = Math.min(0.032, Math.max(0.001, (now - last) / 1000));
      last = now;
      lv += (260 * (ltarget - lx) - 2 * Math.sqrt(260) * 0.62 * lv) * dt;
      lx += lv * dt;
      if (Math.abs(ltarget - lx) < 0.3 && Math.abs(lv) < 5) {
        lx = ltarget;
        lv = 0;
        paintLens();
        raf = 0;
        return;
      }
      paintLens();
      raf = requestAnimationFrame(lensTick);
    }
    function moveLens(instant) {
      var tab = tabs[current];
      ltarget = tab.offsetLeft;
      lw = tab.offsetWidth;
      if (instant || reduce.matches) {
        cancelAnimationFrame(raf);
        raf = 0;
        lx = ltarget;
        lv = 0;
        paintLens();
        return;
      }
      if (!raf) {
        last = performance.now();
        raf = requestAnimationFrame(lensTick);
      }
    }

    // ---------- The glass tips toward the pointer and catches the light ----------
    nav.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      var r = nav.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      nav.style.setProperty("--mx", px * 100 + "%");
      nav.style.setProperty("--my", py * 100 + "%");
      if (!reduce.matches) {
        nav.style.setProperty("--ry", (px - 0.5) * 8 + "deg");
        nav.style.setProperty("--rx", (0.5 - py) * 10 + "deg");
      }
    });
    nav.addEventListener("pointerleave", function () {
      nav.style.setProperty("--rx", "0deg");
      nav.style.setProperty("--ry", "0deg");
    });
    function select(i) {
      if (i === current) return;
      tabs[current].removeAttribute("aria-current");
      tabs[i].setAttribute("aria-current", "page");
      current = i;
      moveLens(false);
      render(i);
      status.textContent = tabs[i].textContent.trim() + " selected";
    }
    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () { select(i); });
      tab.addEventListener("keydown", function (e) {
        var next = null;
        if (e.key === "ArrowRight") next = Math.min(tabs.length - 1, i + 1);
        else if (e.key === "ArrowLeft") next = Math.max(0, i - 1);
        if (next === null) return;
        e.preventDefault();
        tabs[next].focus();
        select(next);
      });
    });

    // ---------- Sun and moon switch ----------
    function syncSwitch() {
      mode.setAttribute("aria-checked", root.dataset.theme === "dark" ? "true" : "false");
    }
    mode.addEventListener("click", function () {
      var dark = root.dataset.theme !== "dark";
      root.dataset.userSet = "1";
      root.dataset.theme = dark ? "dark" : "light";
      syncSwitch();
      var pop = document.getElementById("pop");
      pop.classList.remove("go");
      void pop.offsetWidth;
      pop.classList.add("go");
      status.textContent = dark ? "Dark mode on" : "Light mode on";
    });
    // keep the switch right if the system theme changes before it is used
    var mq = matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { setTimeout(syncSwitch, 0); });

    syncSwitch();
    render(0);
    moveLens(true);
    window.addEventListener("resize", function () { moveLens(true); });
  })();
</script>
</body>
</html>
