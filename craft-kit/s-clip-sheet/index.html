<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clip Sheet · Share sheet with copy link</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f3e9dc;
    --bg2: #e9d2bb;
    --phone: #fffaf3;
    --sheet: #fffaf3;
    --ink: #2a1c14;
    --muted: #8a6f5e;
    --line: rgba(42, 28, 20, 0.1);
    --chip: #f3e6d6;
    --accent: #cf5633;
    --accent2: #e9a23b;
    --ok: #2f9e6e;
    --shadow: rgba(90, 45, 20, 0.45);
    --frame: #1b120d;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #16100c;
    --bg2: #2b1d14;
    --phone: #1f1611;
    --sheet: #2a1f18;
    --ink: #f6eadf;
    --muted: #b49b88;
    --line: rgba(255, 240, 225, 0.09);
    --chip: #3a2b21;
    --accent: #f07a55;
    --accent2: #f0b14f;
    --ok: #46c08b;
    --shadow: rgba(0, 0, 0, 0.7);
    --frame: #3b2c22;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ---------- Stage: warm paper with a slow sun and drifting chain links ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; overflow: hidden; isolation: isolate; }
  .stage::before { content: ""; position: absolute; z-index: -2; width: 70vmin; height: 70vmin; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--bg2), transparent 70%); animation: glow 9s ease-in-out infinite alternate; }
  @keyframes glow { to { transform: translate(6vmin, 4vmin) scale(1.12); } }
  .drift { position: absolute; z-index: -1; width: 54px; color: var(--accent); opacity: 0.18; animation: float 11s ease-in-out infinite alternate; }
  .drift.d1 { left: 12%; top: 18%; }
  .drift.d2 { right: 10%; top: 58%; width: 70px; animation-duration: 14s; animation-delay: -4s; color: var(--accent2); }
  .drift.d3 { left: 18%; bottom: 10%; width: 40px; animation-duration: 9s; animation-delay: -7s; }
  @keyframes float { to { transform: translate(18px, -24px) rotate(28deg); } }

  /* ---------- Phone ---------- */
  .phone {
    position: relative;
    width: min(360px, 100%);
    height: min(520px, calc(100dvh - 40px));
    min-height: 470px;
    border-radius: 34px;
    background: var(--frame);
    padding: 7px;
    box-shadow: 0 50px 80px -46px var(--shadow), 0 0 0 1px var(--line);
    animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
  .screen { position: relative; height: 100%; border-radius: 28px; overflow: hidden; background: #120c09; }

  /* Article behind the sheet (sinks back a little when the sheet opens) */
  .article { position: absolute; inset: 0; background: var(--phone); border-radius: 28px; overflow: hidden; transform-origin: 50% 0; transition: transform 0.55s cubic-bezier(0.3, 1.2, 0.4, 1), filter 0.4s, border-radius 0.4s; }
  .open .article { transform: scale(0.92) translateY(14px); filter: brightness(0.62); border-radius: 22px; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
  .bar svg { width: 18px; height: 18px; }
  .hero { display: block; width: calc(100% - 28px); margin: 0 14px; height: auto; aspect-ratio: 320 / 150; border-radius: 18px; }
  .hero .steam path { animation: steam 3s ease-in-out infinite; }
  .hero .steam path:nth-child(2) { animation-delay: -1s; }
  .hero .steam path:nth-child(3) { animation-delay: -2s; }
  @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: 0.9; } 100% { transform: translateY(-10px); opacity: 0; } }
  .copytext { padding: 14px 18px 0; }
  .kicker { margin: 0; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .copytext h1 { margin: 4px 0 6px; font-size: 1.3rem; line-height: 1.2; letter-spacing: -0.01em; }
  .copytext p { margin: 0; font-size: 0.86rem; line-height: 1.45; color: var(--muted); }
  .by { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 0.78rem; color: var(--muted); }
  .by i { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #cf5633); display: grid; place-items: center; font-style: normal; font-size: 0.6rem; font-weight: 800; color: #fff; }
  .share {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px 12px 15px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 14px 24px -12px var(--accent);
    transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .share:hover { transform: translateY(-2px) scale(1.03); }
  .share svg { width: 18px; height: 18px; overflow: visible; }
  .share .node { animation: node 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .share .node:nth-of-type(2) { animation-delay: 0.3s; }
  .share .node:nth-of-type(3) { animation-delay: 0.6s; }
  @keyframes node { 0%, 70%, 100% { transform: none; } 20% { transform: scale(1.45); } }

  /* ---------- Backdrop + sheet ---------- */
  .backdrop { position: absolute; inset: 0; background: rgba(20, 10, 5, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.35s; }
  .open .backdrop { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 16px 16px;
    border-radius: 26px 26px 28px 28px;
    background: var(--sheet);
    box-shadow: 0 -20px 40px -20px rgba(0, 0, 0, 0.45);
    transform: translateY(105%);
    visibility: hidden;
    transition: transform 0.38s cubic-bezier(0.55, 0, 0.8, 0.2), visibility 0s linear 0.4s;
    touch-action: none;
  }
  .open .sheet { transform: none; visibility: visible; transition: transform 0.75s cubic-bezier(0.25, 1.3, 0.4, 1), visibility 0s; }
  .sheet.dragging { transition: none; }
  .grab { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 10px; cursor: grab; position: relative; }
  .grab::before { content: ""; position: absolute; left: 50%; top: 0; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--line); box-shadow: inset 0 0 0 10px rgba(127, 100, 80, 0.25); }
  .grab h2 { margin: 0; font-size: 1.02rem; }
  .x { width: 32px; height: 32px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--chip); cursor: pointer; }
  .x svg { width: 15px; height: 15px; }

  .link { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 16px; background: var(--chip); }
  .thumb { width: 42px; height: 42px; flex: none; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(140deg, var(--accent2), var(--accent)); color: #fff; }
  .thumb svg { width: 22px; height: 22px; overflow: visible; }
  .link .txt { min-width: 0; display: grid; gap: 1px; }
  .link strong { font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url { position: relative; justify-self: start; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .url .sel { position: absolute; inset: -1px -3px; border-radius: 4px; background: var(--accent); opacity: 0.22; transform: scaleX(0); transform-origin: 0 50%; }

  .people { display: flex; justify-content: space-between; gap: 4px; margin: 14px 0 6px; padding: 0; list-style: none; }
  .person { display: grid; justify-items: center; gap: 5px; width: 58px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 0.72rem; color: var(--muted); }
  .face { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; color: #fff; background: var(--c); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .person:hover .face { transform: translateY(-3px); }
  .face svg.ring { position: absolute; inset: -5px; width: 60px; height: 60px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke: var(--ok); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; }
  .person.sending .ring circle { stroke-dashoffset: 0; transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.3, 1); }
  .badge { position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ok); border: 2.5px solid var(--sheet); display: grid; place-items: center; transform: scale(0); transition: transform 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .badge svg { width: 11px; height: 11px; }
  .person.sent .badge { transform: scale(1); }
  .person.sent .nm { color: var(--ok); font-weight: 700; }

  .apps { display: flex; justify-content: space-between; gap: 6px; margin: 8px 0 14px; }
  .app { display: grid; justify-items: center; gap: 5px; width: 64px; padding: 0; border: 0; background: none; text-decoration: none; cursor: pointer; font-size: 0.72rem; color: var(--muted); }
  .app span:first-child { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--chip); color: var(--ink); transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.3s, color 0.3s; }
  .app:hover span:first-child { transform: translateY(-3px) rotate(-4deg); }
  .app svg { width: 21px; height: 21px; }
  .app.saved span:first-child { background: var(--accent2); color: #2a1c14; }
  .app.saved .bk { fill: currentColor; }

  /* The big Copy link button */
  .copy {
    position: relative;
    width: 100%;
    height: 54px;
    border: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    cursor: pointer;
    background: var(--ink);
    color: var(--sheet);
    font-weight: 700;
    font-size: 0.98rem;
    transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .copy:active { transform: scale(0.97); transition-duration: 0.1s; }
  .copy .fill { position: absolute; inset: 0; background: var(--ok); transform: scaleX(0); transform-origin: 0 50%; }
  .copy .cico, .copy .lab { position: relative; }
  .cico { width: 22px; height: 22px; }
  .cico svg { width: 22px; height: 22px; overflow: visible; }
  .cico .clip { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 0.35s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .copy.lift .clip { transform: translateY(-3px) rotate(-14deg); }
  .cico .ok { stroke-dasharray: 1 2; stroke-dashoffset: 1; }
  .copy.done .ok { stroke-dashoffset: 0; transition: stroke-dashoffset 0.4s ease 0.1s; }
  .copy.done .lines { opacity: 0; }
  .lab { display: block; height: 1.3em; overflow: hidden; line-height: 1.3; }
  .lab span { display: block; }

  .chip { position: fixed; z-index: 30; display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.78rem; font-weight: 700; white-space: nowrap; pointer-events: none; box-shadow: 0 12px 22px -10px var(--accent); }
  .chip svg { width: 14px; height: 14px; }
  .bit { position: fixed; z-index: 31; width: 12px; height: 7px; border-radius: 4px; border: 2px solid; pointer-events: none; }

  .toast { position: absolute; top: 10px; left: 50%; z-index: 5; display: inline-flex; align-items: center; gap: 8px; max-width: calc(100% - 28px); padding: 9px 14px; border-radius: 999px; background: var(--ink); color: var(--sheet); font-size: 0.8rem; font-weight: 600; white-space: nowrap; transform: translate(-50%, -160%); transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1); }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; flex: none; color: var(--ok); }

  @media (max-width: 400px) {
    .phone { padding: 5px; border-radius: 30px; }
    .person { width: 52px; }
    .face { width: 46px; height: 46px; }
    .face svg.ring { width: 56px; height: 56px; }
  }
  @media (max-height: 560px) {
    .hero { height: 112px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::before, .drift, .phone, .hero .steam path, .share .node { animation: none; }
    .article, .sheet, .open .sheet, .backdrop, .badge, .toast, .copy, .face, .app span:first-child, .person.sending .ring circle, .cico .clip { transition-duration: 0.01s; transition-delay: 0s; }
    .bit, .chip { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <svg class="drift d1" viewBox="0 0 48 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="3" y="4" width="24" height="16" rx="8" /><rect x="21" y="4" width="24" height="16" rx="8" /></g></svg>
    <svg class="drift d2" viewBox="0 0 48 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="3" y="4" width="24" height="16" rx="8" /><rect x="21" y="4" width="24" height="16" rx="8" /></g></svg>
    <svg class="drift d3" viewBox="0 0 48 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><rect x="3" y="4" width="24" height="16" rx="8" /><rect x="21" y="4" width="24" height="16" rx="8" /></g></svg>

    <div class="phone" id="phone">
      <div class="screen">
        <article class="article" aria-label="Guide">
          <div class="bar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7" /></svg>
            <span>City guides</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4Z" /></svg>
          </div>
          <!-- Hero illustration: arches at dusk with a steaming cup -->
          <svg class="hero" viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of old city arches and a cup of chai">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b25a" /><stop offset="1" stop-color="#e2683f" /></linearGradient>
            </defs>
            <rect width="320" height="150" fill="url(#sky)" />
            <circle cx="232" cy="64" r="26" fill="#ffe2a8" opacity="0.9" />
            <g fill="#9c3b22" opacity="0.55">
              <path d="M8 150V86a26 26 0 0 1 52 0v64Z" />
              <path d="M70 150V70a32 32 0 0 1 64 0v80Z" />
              <path d="M262 150V92a22 22 0 0 1 44 0v58Z" />
              <rect x="150" y="40" width="10" height="110" rx="3" />
              <path d="M146 44h18l-9-18Z" />
            </g>
            <g fill="#6e2513" opacity="0.75">
              <path d="M0 150v-30h320v30Z" />
              <path d="M22 150v-44a14 14 0 0 1 28 0v44Z" fill="#f6b25a" opacity="0.35" />
            </g>
            <g class="steam" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
              <path d="M188 84c-5-6 5-10 0-16" />
              <path d="M200 82c-5-6 5-10 0-16" />
              <path d="M212 84c-5-6 5-10 0-16" />
            </g>
            <path d="M176 92h48l-5 34a10 10 0 0 1-10 8h-18a10 10 0 0 1-10-8Z" fill="#fff7ec" />
            <path d="M224 99h6a8 8 0 0 1 0 16h-8" fill="none" stroke="#fff7ec" stroke-width="5" />
            <path d="M178 100h44" stroke="#c96d3e" stroke-width="5" />
            <ellipse cx="200" cy="138" rx="34" ry="5" fill="#fff7ec" opacity="0.8" />
          </svg>
          <div class="copytext">
            <p class="kicker">Walk · 8 stops</p>
            <h1>The old city chai trail</h1>
            <p>From doodh patti at dawn to pink chai after dark, eight stalls worth the detour.</p>
            <div class="by"><i aria-hidden="true">HB</i>by Hina Baig · 6 min read</div>
          </div>
          <button class="share" id="share" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m8.6 10.6 6.8-4M8.6 13.4l6.8 4" /><circle class="node" cx="6" cy="12" r="2.6" fill="currentColor" /><circle class="node" cx="18" cy="5" r="2.6" fill="currentColor" /><circle class="node" cx="18" cy="19" r="2.6" fill="currentColor" /></svg>
            Share
          </button>
        </article>

        <div class="backdrop" id="backdrop"></div>

        <div class="toast" id="toast" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10" /></svg><span id="toastText">Link copied</span></div>

        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert>
          <div class="grab" id="grab">
            <h2 id="sheetTitle">Share guide</h2>
            <button class="x" id="close" type="button" aria-label="Close share sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
          </div>

          <div class="link st">
            <span class="thumb" id="linkIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path class="l1" d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1" /><path class="l2" d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" /></svg></span>
            <span class="txt"><strong>The old city chai trail</strong><span class="url" id="url"><i class="sel" aria-hidden="true"></i>chaitrail.example/old-city</span></span>
          </div>

          <ul class="people" aria-label="Send to a contact">
            <li class="st"><button class="person" type="button" style="--c: linear-gradient(135deg,#f472b6,#db2777)"><span class="face">AR<svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" pathLength="1" /></svg><span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span></span><span class="nm">Ayesha</span></button></li>
            <li class="st"><button class="person" type="button" style="--c: linear-gradient(135deg,#38bdf8,#2563eb)"><span class="face">BS<svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" pathLength="1" /></svg><span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span></span><span class="nm">Bilal</span></button></li>
            <li class="st"><button class="person" type="button" style="--c: linear-gradient(135deg,#fbbf24,#ea580c)"><span class="face">HB<svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" pathLength="1" /></svg><span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span></span><span class="nm">Hina</span></button></li>
            <li class="st"><button class="person" type="button" style="--c: linear-gradient(135deg,#34d399,#0f766e)"><span class="face">OF<svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" pathLength="1" /></svg><span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span></span><span class="nm">Omar</span></button></li>
            <li class="st"><button class="person" type="button" style="--c: linear-gradient(135deg,#a78bfa,#7c3aed)"><span class="face">SM<svg class="ring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" pathLength="1" /></svg><span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10" /></svg></span></span><span class="nm">Sana</span></button></li>
          </ul>

          <div class="apps">
            <a class="app st" id="sms" href="#"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z" /></svg></span><span>Message</span></a>
            <a class="app st" id="mail" href="#"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></svg></span><span>Email</span></a>
            <button class="app st" id="save" type="button" aria-pressed="false"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path class="bk" d="M6 4h12v17l-6-4-6 4Z" /></svg></span><span class="slab">Save</span></button>
            <button class="app st" id="more" type="button"><span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></svg></span><span>More</span></button>
          </div>

          <button class="copy st" id="copy" type="button">
            <span class="fill" aria-hidden="true"></span>
            <span class="cico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2.5" /><path class="lines" d="M9 11h6M9 15h4" /><path class="ok" pathLength="1" d="m8.5 13.5 2.5 2.5 4.5-5" /><rect class="clip" x="8.5" y="2.5" width="7" height="4" rx="1.5" fill="currentColor" /></svg></span>
            <span class="lab" id="copyLab"><span>Copy link</span></span>
          </button>
        </section>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

<script>
  // ---------- Clip Sheet: bottom share sheet with a copy-link flight ----------
  const $ = (s, r = document) => r.querySelector(s);
  const phone = $("#phone");
  const shareBtn = $("#share");
  const sheet = $("#sheet");
  const grab = $("#grab");
  const closeBtn = $("#close");
  const backdrop = $("#backdrop");
  const copyBtn = $("#copy");
  const copyLab = $("#copyLab");
  const url = $("#url");
  const sel = url.querySelector(".sel");
  const linkIcon = $("#linkIcon");
  const toast = $("#toast");
  const toastText = $("#toastText");
  const status = $("#status");
  const saveBtn = $("#save");

  const LINK = "https://chaitrail.example/old-city";
  const TITLE = "The old city chai trail";
  $("#sms").href = "sms:?&body=" + encodeURIComponent(TITLE + " " + LINK);
  $("#mail").href = "mailto:?subject=" + encodeURIComponent(TITLE) + "&body=" + encodeURIComponent("Thought you would like this: " + LINK);

  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const SPRING = window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)")
    ? "linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077 24.3%, 1.104 27.8%, 1.107 31.2%, 1.096, 1.073 38.1%, 1.017 47.1%, 0.996 55.4%, 0.991 61.4%, 1 80%, 1)"
    : "cubic-bezier(.34, 1.56, .64, 1)";
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  const say = (t) => { status.textContent = t; };

  // Rolling label: old text slides up and out while the new text rises in
  function roll(box, text) {
    while (box.children.length > 1) box.firstElementChild.remove();
    const old = box.firstElementChild;
    if (old && old.textContent === text) return;
    const n = document.createElement("span");
    n.textContent = text;
    box.appendChild(n);
    if (calm() || !old || !old.animate) { if (old) old.remove(); return; }
    n.style.transform = old.style.transform = "translateY(-100%)";
    Promise.all([
      play(old, [{ transform: "none", opacity: 1 }, { transform: "translateY(-100%)", opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" }),
      play(n, [{ transform: "translateY(0)", opacity: 0 }, { transform: "translateY(-100%)", opacity: 1 }], { duration: 460, easing: SPRING })
    ]).then(() => { old.remove(); n.style.transform = ""; });
  }

  let toastTimer = 0;
  function showToast(text) {
    toastText.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  // ---------- Open / close ----------
  let isOpen = false;
  function openSheet() {
    if (isOpen) return;
    isOpen = true;
    play(shareBtn, [{ transform: "scale(1)" }, { transform: "scale(.86)" }, { transform: "scale(1)" }], { duration: 300, easing: "ease-out" });
    phone.classList.add("open");
    sheet.inert = false;
    shareBtn.setAttribute("aria-expanded", "true");
    // reset per-open state, then stagger the contents in
    sheet.querySelectorAll(".person").forEach((p) => p.classList.remove("sending", "sent"));
    sheet.querySelectorAll(".st").forEach((el, i) => play(el, [{ opacity: 0, transform: "translateY(22px) scale(.88)" }, { opacity: 1, transform: "none" }], { duration: 620, delay: 120 + i * 38, easing: SPRING, fill: "backwards" }));
    say("Share sheet open");
    setTimeout(() => { if (isOpen && !demoOn) closeBtn.focus(); }, 60);
  }
  function closeSheet() {
    if (!isOpen) return;
    isOpen = false;
    sheet.style.transform = "";
    backdrop.style.opacity = "";
    phone.classList.remove("open");
    sheet.inert = true;
    shareBtn.setAttribute("aria-expanded", "false");
    say("Share sheet closed");
    if (!demoOn) shareBtn.focus();
  }
  shareBtn.addEventListener("click", openSheet);
  closeBtn.addEventListener("click", closeSheet);
  backdrop.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => {
    if (!isOpen) return;
    if (e.key === "Escape") { closeSheet(); return; }
    if (e.key === "Tab") {
      // keep focus inside the open sheet
      const f = [...sheet.querySelectorAll("button, a[href]")];
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Drag the sheet down to dismiss; a short drag springs back
  let drag = null;
  grab.addEventListener("pointerdown", (e) => {
    if (!isOpen || e.target.closest("button")) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0 };
    grab.setPointerCapture(e.pointerId);
    sheet.classList.add("dragging");
  });
  grab.addEventListener("pointermove", (e) => {
    if (!drag) return;
    let dy = e.clientY - drag.y;
    if (dy < 0) dy = -Math.pow(-dy, 0.7); // rubber band upwards
    drag.dy = dy;
    sheet.style.transform = "translateY(" + dy + "px)";
    backdrop.style.opacity = String(1 - Math.max(0, dy) / 320);
  });
  function endDrag() {
    if (!drag) return;
    const v = drag.dy / Math.max(1, performance.now() - drag.t);
    sheet.classList.remove("dragging");
    if (drag.dy > 110 || (v > 0.5 && drag.dy > 30)) closeSheet();
    else { sheet.style.transform = ""; backdrop.style.opacity = ""; }
    drag = null;
  }
  grab.addEventListener("pointerup", endDrag);
  grab.addEventListener("pointercancel", endDrag);

  // ---------- Send to a contact: ring fills, then a tick badge pops ----------
  sheet.querySelectorAll(".person").forEach((p) => p.addEventListener("click", () => sendTo(p)));
  async function sendTo(p) {
    if (p.classList.contains("sending") || p.classList.contains("sent")) return;
    const name = p.querySelector(".nm").textContent;
    play(p.querySelector(".face"), [{ transform: "scale(1)" }, { transform: "scale(.84)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 480, easing: "ease-out" });
    p.classList.add("sending");
    say("Sending to " + name);
    await wait(calm() ? 300 : 1050);
    p.classList.add("sent");
    const b = p.querySelector(".badge").getBoundingClientRect();
    burst(b.left + b.width / 2, b.top + b.height / 2, 7, 22);
    say("Sent to " + name);
    showToast("Sent to " + name);
  }

  // ---------- Save + More ----------
  saveBtn.addEventListener("click", () => {
    const on = saveBtn.getAttribute("aria-pressed") !== "true";
    saveBtn.setAttribute("aria-pressed", String(on));
    saveBtn.classList.toggle("saved", on);
    saveBtn.querySelector(".slab").textContent = on ? "Saved" : "Save";
    play(saveBtn.firstElementChild, [{ transform: "scale(1)" }, { transform: "scale(.8) rotate(-8deg)" }, { transform: "scale(1.12) rotate(4deg)" }, { transform: "none" }], { duration: 480 });
    showToast(on ? "Saved to your reading list" : "Removed from reading list");
  });
  $("#more").addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: TITLE, url: LINK }); say("Shared"); } catch (e) { /* closed by the user */ }
    } else copyLink(true);
  });

  // ---------- Copy link: select → chip flies into the clipboard → clamp → green fill → done ----------
  let copying = false;
  async function writeClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  async function copyLink(real) {
    if (copying) return;
    copying = true;
    const ok = real ? await writeClipboard(LINK) : true;
    // 1. Anticipation: button dips, the clipboard opens its clip, the url gets selected
    copyBtn.classList.add("lift");
    play(copyBtn, [{ transform: "scale(1)" }, { transform: "scale(.96, .92)" }, { transform: "scale(1)" }], { duration: 320, easing: "ease-out" });
    roll(copyLab, "Copying…");
    sel.style.transform = "scaleX(1)";
    await play(sel, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 300, easing: "cubic-bezier(.6,0,.2,1)" });
    play(linkIcon.querySelector("svg"), [{ transform: "rotate(0)" }, { transform: "rotate(-24deg) scale(1.15)" }, { transform: "rotate(12deg)" }, { transform: "none" }], { duration: 520, easing: "ease-out" });

    // 2. A link chip lifts out of the row and arcs down into the clipboard
    if (!calm()) {
      const a = url.getBoundingClientRect();
      const b = copyBtn.querySelector(".cico").getBoundingClientRect();
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = linkIcon.innerHTML + "<span>chaitrail.example/old-city</span>";
      chip.style.left = a.left - 10 + "px";
      chip.style.top = a.top - 6 + "px";
      document.body.appendChild(chip);
      const dx = b.left + b.width / 2 - (a.left - 10) - chip.offsetWidth / 2;
      const dy = b.top + b.height / 2 - (a.top - 6) - chip.offsetHeight / 2;
      await chip.animate([
        { transform: "translate(0,0) scale(1)", opacity: 0 },
        { transform: "translate(0,-16px) scale(1.06) rotate(-3deg)", opacity: 1, offset: 0.22 },
        { transform: "translate(" + dx * 0.55 + "px," + (dy * 0.35 - 30) + "px) scale(.8) rotate(4deg)", opacity: 1, offset: 0.6 },
        { transform: "translate(" + dx + "px," + dy + "px) scale(.12) rotate(10deg)", opacity: 0.4 }
      ], { duration: 760, easing: "cubic-bezier(.45,.05,.4,1)" }).finished.catch(() => {});
      chip.remove();
    }

    // 3. The clip snaps shut and green fills the button
    copyBtn.classList.remove("lift");
    play(copyBtn.querySelector(".cico"), [{ transform: "scale(1)" }, { transform: "scale(1.35, .8)" }, { transform: "scale(.92, 1.1)" }, { transform: "none" }], { duration: 420, easing: "ease-out" });
    const fill = copyBtn.querySelector(".fill");
    fill.style.transform = "scaleX(1)";
    await play(fill, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 380, easing: "cubic-bezier(.5,0,.2,1)" });

    // 4. Done: tick draws, label rolls, chain links scatter
    copyBtn.classList.add("done");
    roll(copyLab, ok ? "Link copied" : "Press Ctrl+C to copy");
    const r = copyBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 12, 60);
    showToast(ok ? "Copied · paste it anywhere" : "Copy blocked · select the link");
    say(ok ? "Link copied to clipboard" : "Could not copy automatically");
    if (!ok) { const range = document.createRange(); range.selectNodeContents(url); getSelection().removeAllRanges(); getSelection().addRange(range); }

    // 5. Reset after a moment
    await wait(2200);
    copyBtn.classList.remove("done");
    fill.style.transform = "";
    sel.style.transform = "";
    play(fill, [{ transform: "scaleX(1)", transformOrigin: "100% 50%" }, { transform: "scaleX(0)", transformOrigin: "100% 50%" }], { duration: 360, easing: "ease-in" });
    play(sel, [{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 260 });
    roll(copyLab, "Copy link");
    copying = false;
  }
  copyBtn.addEventListener("click", () => copyLink(true));

  // Little chain links that pop out of a point
  function burst(x, y, count, spread) {
    if (calm()) return;
    const cols = [getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(), "#e9a23b", "#2f9e6e"];
    for (let i = 0; i < count; i++) {
      const s = document.createElement("i");
      s.className = "bit";
      s.style.left = x - 6 + "px";
      s.style.top = y - 3.5 + "px";
      s.style.borderColor = cols[i % cols.length];
      document.body.appendChild(s);
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.4;
      const d = spread * (0.6 + Math.random() * 0.5);
      const rot = Math.random() * 360;
      s.animate([
        { transform: "translate(0,0) rotate(" + rot + "deg) scale(.4)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * d + "px," + (Math.sin(a) * d * 0.6 - 14) + "px) rotate(" + (rot + 160) + "deg) scale(1)", opacity: 1, offset: 0.65 },
        { transform: "translate(" + Math.cos(a) * d * 1.1 + "px," + (Math.sin(a) * d * 0.6 + 10) + "px) rotate(" + (rot + 220) + "deg) scale(.6)", opacity: 0 }
      ], { duration: 800 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Auto-demo: open, send to a friend, copy, close; repeats while idle ----------
  let demoOn = true;
  let demoTimer = 0;
  let demoRound = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demoOn) return;
    openSheet();
    await wait(1000);
    if (!demoOn) return;
    const people = sheet.querySelectorAll(".person");
    sendTo(people[demoRound++ % people.length]);
    await wait(1500);
    if (!demoOn) return;
    await copyLink(false);
    await wait(500);
    if (!demoOn) return;
    closeSheet();
    queueDemo(2600);
  }
  queueDemo(650);
</script>
</body>
</html>
