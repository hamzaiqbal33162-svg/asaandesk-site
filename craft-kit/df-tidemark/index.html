<!doctype html>
<!-- Chill & Craft · Tidemark · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidemark · projects and field work for engineers</title>
<style>
/* ---------- Core layout: shared structure. The look lives in the theme block below. ---------- */
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-h:var(--font);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:14px;--r2:9px;--side:236px;--pad:22px;--gap:16px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.5,.64,1);
--bg:#f5f6f8;--tx:#16181d;--mu:#667085;--line:#e4e7ec;--card:#fff;--card-solid:#fff;--hover:rgba(16,24,40,.05);--inp:#fff;--ac:#4f46e5;--on-ac:#fff;--ok:#12a150;--warn:#d98a06;--bad:#d92d20;--info:#1f7ae0;
--sh:0 1px 2px rgba(16,24,40,.06);--sh2:0 12px 28px -10px rgba(16,24,40,.22);--side-bg:#fff;--side-tx:#16181d;--side-mu:#667085;--side-act:rgba(79,70,229,.1);--side-on:#4f46e5;--top-bg:rgba(245,246,248,.8);--col-bg:rgba(16,24,40,.04);
--c1:#4f46e5;--c2:#0ea5a4;--c3:#f59e0b;--c4:#ec4899;--c5:#22c55e;--c6:#64748b;--tip-bg:#111318;--toast-bg:#15171c}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 var(--font);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color:var(--tx)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-h)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}.mu{color:var(--mu)}.nowrap{white-space:nowrap}.tnum{font-variant-numeric:tabular-nums}
.skip{position:fixed;left:8px;top:-60px;z-index:300;padding:8px 12px;border-radius:8px;background:var(--ac);color:var(--on-ac);text-decoration:none}.skip:focus{top:8px}
/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 14px;background:var(--side-bg);color:var(--side-tx);overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1.1 var(--font-h);padding:4px 8px;letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand svg{width:32px;height:32px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r2);text-decoration:none;color:var(--side-mu);font-weight:560;transition:color .2s}
.nav a:hover{color:var(--side-tx)}
.nav a[aria-current=page]{color:var(--side-on)}
.nav .mk{position:absolute;left:0;top:0;width:0;height:0;border-radius:var(--r2);background:var(--side-act);transition:transform .42s var(--spring),width .35s var(--ease),height .3s var(--ease),opacity .2s;pointer-events:none;z-index:0}
.nav .ct{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--side-act);color:var(--side-on)}
.side-foot{margin-top:auto}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px var(--pad);background:var(--top-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tt{min-width:0}
.ptitle{font:750 20px/1.2 var(--font-h);margin:0;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{margin:1px 0 0;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{padding:var(--pad);outline:none;flex:1}
.only-m{display:none!important}
kbd{font:600 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--mu)}
.ubtn{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer}
.ubtn .av{width:34px;height:34px}
.dotn{position:absolute;top:6px;right:6px;min-width:8px;height:8px;border-radius:99px;background:var(--bad);box-shadow:0 0 0 2px var(--card-solid);display:none}
.dotn.on{display:block;animation:pulse 2s 4}
#bellBtn{position:relative}
[data-theme=dark] .tm-d,[data-theme=light] .tm-l{display:none}
/* top-nav layout */
.L-top{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
.L-top .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px var(--pad);gap:22px;overflow:visible}
.L-top .nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.L-top .side-foot{margin:0 0 0 auto}
.L-top .top{top:var(--topnav-h,62px)}
/* icon rail layout */
.L-rail{--side:88px}
.L-rail .side{align-items:center;padding:16px 8px}
.L-rail .brand{flex-direction:column;gap:4px;font-size:11px;padding:0}
.L-rail .nav a{flex-direction:column;gap:4px;padding:10px 6px;width:72px;font-size:10.5px;text-align:center;line-height:1.15}
.L-rail .nav a .ct{position:absolute;top:4px;right:6px;margin:0;padding:0 5px;font-size:10px}
.L-rail .side-foot{display:flex;flex-direction:column;align-items:center}
/* page grid */
.page{display:flex;flex-direction:column;gap:var(--gap)}
.g{display:grid;gap:var(--gap);min-width:0}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.card{position:relative;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .28s var(--ease),box-shadow .28s,background-color .3s}
.card.lift:hover,.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.ch{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;min-width:0}
.ch h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.ch p{margin:0;font-size:12px;color:var(--mu)}
.kpi .l{font-size:12.5px;color:var(--mu);font-weight:560;display:flex;align-items:center;gap:6px}
.kpi .v{font:800 26px/1.15 var(--font-h);letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .spark{position:absolute;right:12px;bottom:12px}
.delta{font-size:12px;font-weight:700}.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
/* enter animation (staggered per card) */
.page.enter>*:not(.g),.page.enter .card{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.page.enter .kcard{animation:rise .45s var(--ease) both;animation-delay:calc(var(--d,0)*28ms + 140ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 20%,transparent)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gsw{from{stroke-dasharray:0 2}}
.dl0{font-size:11px;fill:var(--mu)}
/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,var(--r2));border:1px solid var(--line);background:var(--card-solid);color:var(--tx);font-weight:620;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:transform .14s var(--ease),background-color .2s,box-shadow .2s,border-color .2s,color .2s;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--line))}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-ac);box-shadow:0 6px 16px -8px var(--ac)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--bad);border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;gap:5px}
.btn.icon{width:36px;padding:0}.btn.icon.sm{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;font-weight:620;color:var(--mu);transition:all .2s var(--ease)}
.chip:hover{color:var(--tx)}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--hover);gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--mu);transition:all .2s}
.seg button[aria-pressed=true]{background:var(--card-solid);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:680;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--ac)) 15%,transparent);color:color-mix(in srgb,var(--c,var(--ac)) 80%,var(--tx))}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--ac))}
.tag.plain::before{display:none}
.av{--h:200;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h) 62% 86%);color:hsl(var(--h) 50% 28%);font-size:11px;font-weight:760;flex:none;letter-spacing:.02em}
[data-theme=dark] .av{background:hsl(var(--h) 34% 30%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:42px;height:42px;font-size:14px}.av.sm{width:22px;height:22px;font-size:9px}
.avs{display:inline-flex}.avs .av{margin-left:-7px;box-shadow:0 0 0 2px var(--card-solid)}.avs .av:first-child{margin-left:0}
.prog{height:6px;border-radius:99px;background:var(--hover);overflow:hidden}
.prog>i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--c,var(--ac));transform-origin:left;animation:growx 1s var(--ease) both;transition:width .5s var(--ease)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 12px;color:var(--mu);text-align:center}
.empty .i{width:28px;height:28px;opacity:.6}
.empty p{margin:0}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.switch input:checked+i{background:var(--ac)}
.switch input:checked+i::after{transform:translateX(16px)}
.switch input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.list>li:last-child{border-bottom:0}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:650;font-size:13px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
/* table */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:7px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--inp);min-width:0;flex:1 1 180px;max-width:300px;color:var(--mu);transition:border-color .2s,box-shadow .2s}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--tx)}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:680;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.th{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
.th i{width:8px;height:8px;opacity:.35;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);transition:transform .2s,opacity .2s}
th[aria-sort=ascending] .th i{opacity:1;transform:rotate(-135deg) translate(-2px,-1px)}th[aria-sort=descending] .th i{opacity:1}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{transition:background-color .15s;animation:fade .4s var(--ease) both;animation-delay:calc(var(--d,0)*22ms)}
.tbl tbody tr[data-i]{cursor:pointer}
.tbl tbody tr[data-i]:hover{background:var(--hover)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mu);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}
.pager .pg button[aria-current=page]{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:650}
.field label b{color:var(--bad)}
.field input,.field select,.field textarea,.inp{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r2);background:var(--inp);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.field textarea{height:auto;padding:9px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.field.bad{animation:shake .35s}
.err{color:var(--bad);font-size:11.5px;font-weight:600;min-height:0}
.err:empty{display:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* modal and drawer layers */
.layer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.backdrop{position:absolute;inset:0;background:rgba(8,10,18,.48);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.layer.in .backdrop{opacity:1}.layer.out .backdrop{opacity:0}
.layer.out{pointer-events:none}
.modal-box{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--card-solid);color:var(--tx);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .38s var(--spring),opacity .22s;outline:none}
.modal-box.wide{width:min(820px,100%)}
.layer.in .modal-box{transform:none;opacity:1}.layer.out .modal-box{transform:translateY(10px) scale(.98);opacity:0}
.layer.drawer{place-items:stretch end;padding:0}
.drawer-box{position:relative;width:min(500px,100%);height:100%;display:flex;flex-direction:column;background:var(--card-solid);color:var(--tx);border-left:1px solid var(--line);box-shadow:-30px 0 60px -30px rgba(0,0,0,.45);transform:translateX(100%);transition:transform .42s var(--ease);outline:none}
.drawer-box.wide{width:min(640px,100%)}
.layer.in .drawer-box{transform:none}.layer.out .drawer-box{transform:translateX(100%)}
.lh{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.lh h2{margin:0;font-size:17px;flex:1;min-width:0;letter-spacing:-.01em}
.lb{padding:4px 18px 18px;overflow-y:auto;flex:1}
.lf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0 0 14px;font-size:13px}
.dl dt{color:var(--mu)}.dl dd{margin:0;min-width:0}
/* popover menus */
.menu{position:fixed;z-index:160;min-width:190px;max-width:calc(100vw - 16px);padding:5px;background:var(--card-solid);color:var(--tx);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -12px rgba(0,0,0,.4);animation:pop .2s var(--ease);transform-origin:top right}
.menu>button,.menu .mi{display:flex;gap:9px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;font-size:13px;color:inherit}
.menu>button:hover,.menu>button:focus-visible{background:var(--hover);outline:none}
.menu .mh{padding:6px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:700}
.np{width:min(340px,calc(100vw - 24px))}
.np ul{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.np li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;color:inherit}
.np li button:hover{background:var(--hover)}
.np li.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:6px;vertical-align:1px}
.np b{display:block;font-size:13px;font-weight:600}.np small{color:var(--mu);font-size:11.5px}
.nph{display:flex;align-items:center;padding:6px 6px 8px 10px}
/* toasts and chart tooltip */
.toasts{position:fixed;right:16px;bottom:16px;z-index:220;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:9px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--toast-bg);color:#fff;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);font-weight:560;font-size:13.5px;animation:tin .45s var(--spring) both;pointer-events:auto;max-width:min(380px,calc(100vw - 32px))}
.toast .i{color:#7ee2a8}.toast.bad .i{color:#ff9b8f}.toast.warn .i{color:#ffd27a}
.toast.out{animation:tout .3s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.ctip{position:fixed;left:0;top:0;z-index:250;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg);color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap}
.ctip.on{opacity:1;transform:none}
.ctip .tt0{font-weight:700;margin-bottom:2px}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;overflow:visible;max-width:100%}
.ax text,.chart text{font-size:11px;fill:var(--mu);font-family:var(--font)}
.gl line{stroke:var(--line);stroke-dasharray:3 4}
.ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;animation:draw 1.2s var(--ease) both;animation-delay:calc(var(--d,0)*120ms)}
.fade{animation:fade .9s .3s var(--ease) both}
.bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.bar.grow{animation:grow .75s var(--ease) both;animation-delay:calc(var(--d,0)*35ms)}
.bar.hz{transform-origin:0 50%}.bar.hz.grow{animation-name:growx}
.band{fill:transparent}.band.on{fill:var(--hover)}
.gd{stroke:var(--mu);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.hd{opacity:0;stroke:var(--card-solid);stroke-width:2.5}
.arc{fill:none;transition:opacity .2s,stroke-width .2s}
.dn-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn-wrap svg{flex:none}
.dleg{list-style:none;margin:0;padding:0;flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.dleg li{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:7px;transition:background-color .15s}
.dleg li.on{background:var(--hover)}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.dv{font:800 22px var(--font-h);fill:var(--tx)!important}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mu);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hm rect.c{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) both;animation-delay:calc(var(--d,0)*5ms)}
.hm rect.c:hover{stroke:var(--tx);stroke-width:1.5}
.spark{display:block;overflow:visible}
.hb{display:flex;flex-direction:column;gap:9px}
.hb>div{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb .prog{height:9px}
.hb b{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
/* kanban */
.kb{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;align-items:flex-start;min-height:200px}
.kcol{flex:0 0 268px;background:var(--col-bg);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;transition:background-color .2s,box-shadow .2s}
.kcol.hi{box-shadow:inset 0 0 0 2px var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--col-bg))}
.kh{display:flex;align-items:center;gap:8px;font-weight:720;font-size:13px;padding:2px 2px 4px 4px}
.kh .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kh em{font-style:normal;font-size:11.5px;color:var(--mu);font-weight:700}
.kh small{margin-left:auto;color:var(--mu);font-weight:600;font-size:11.5px}
.kh small+button,.kh em+button{margin-left:auto}
.kcards{display:flex;flex-direction:column;gap:8px;min-height:50px}
.kcard{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r2);padding:10px 34px 10px 12px;cursor:grab;box-shadow:var(--sh);transition:transform .22s var(--ease),box-shadow .22s,opacity .2s;user-select:none;-webkit-user-select:none}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kcard.ghosted{opacity:.3}
.kcard .kmove{position:absolute;top:6px;right:4px;opacity:.55}
.kcard:hover .kmove,.kcard:focus-within .kmove{opacity:1}
.grip{position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:14px;height:30px;padding:0;border:0;background:none;color:var(--mu);opacity:0;cursor:grab;touch-action:none;display:grid;place-items:center}
.grip .i{width:14px;height:14px}
.kcard:hover .grip{opacity:.7}
@media (hover:none){.grip{opacity:.6}.kcard{padding-left:16px}}
.kempty{margin:0;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r2);text-align:center;color:var(--mu);font-size:12.5px}
.drag-ghost{position:fixed!important;z-index:180;pointer-events:none;margin:0!important;transform:rotate(2.5deg) scale(1.04);box-shadow:0 24px 50px -12px rgba(0,0,0,.45)!important;opacity:.96;transition:none!important;animation:none!important}
.ins{height:3px;border-radius:3px;background:var(--ac);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* month calendar */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calh h3{margin:0 6px;font-size:17px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.cal .dh{padding:6px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cd{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background-color .15s}
.cd.out{background:var(--hover)}.cd.out .dn{opacity:.45}
.cd.hi{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.cd .dn{border:0;background:none;font-size:12px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:inherit;flex:none}
.cd .dn:hover{background:var(--hover)}
.cd.today .dn{background:var(--ac);color:var(--on-ac)}
.cd [data-list]{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:620;background:color-mix(in srgb,var(--c) 18%,var(--card-solid));color:var(--tx);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;transition:transform .15s,box-shadow .15s}
.ev:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.cd .more{border:0;background:none;font-size:11px;color:var(--mu);text-align:left;cursor:pointer;padding:0 4px;font-weight:650}
/* gantt */
.gantt{overflow:auto;position:relative;border:1px solid var(--line);border-radius:var(--r2);max-height:560px}
.gin{position:relative;display:grid;min-width:max-content}
.gl0{position:sticky;left:0;z-index:3;background:var(--card-solid);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden}
.ghd{position:sticky;top:0;z-index:4;background:var(--card-solid);border-bottom:1px solid var(--line)}
.ghd.gl0{z-index:5}
.gdays{display:flex}
.gdays span{flex:none;text-align:center;font-size:10.5px;color:var(--mu);font-weight:650;padding:3px 0;border-left:1px solid transparent}
.gdays span.we{background:var(--hover)}
.gdays span.td{color:var(--ac);font-weight:800}
.gmon{display:flex;font-size:11px;font-weight:750;border-bottom:1px solid var(--line)}
.gmon span{flex:none;padding:3px 8px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.gtr{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(var(--dw)*7) 100%;background-position:var(--wo,0) 0}
.gb{position:absolute;top:7px;height:calc(100% - 14px);border:0;border-radius:7px;background:color-mix(in srgb,var(--c) 30%,var(--card-solid));color:var(--tx);font-size:11.5px;font-weight:680;text-align:left;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;touch-action:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent);transform-origin:left;transition:box-shadow .2s,left .25s var(--ease),width .25s var(--ease)}
.gb.anim{animation:growx .8s var(--ease) both;animation-delay:calc(var(--d,0)*45ms)}
.gb>i{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--c);opacity:.55;border-radius:inherit;pointer-events:none}
.gb>span{position:relative}
.gb.drag{transition:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.4),inset 0 0 0 2px var(--c);z-index:2}
.gb .gh{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.gb .gh::after{content:"";position:absolute;right:3px;top:30%;bottom:30%;width:2px;border-radius:2px;background:currentColor;opacity:.4}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);z-index:2;pointer-events:none}
.gtoday::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.gdeps{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
.gdeps path{fill:none;stroke:var(--mu);stroke-width:1.4;opacity:.7}
/* files and comments in detail drawers */
.files{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;animation:rise .35s var(--ease) both}
.files .fi{width:34px;height:40px;border-radius:6px;display:grid;place-items:end center;padding-bottom:4px;font-size:9px;font-weight:800;color:#fff;background:var(--c);flex:none;text-transform:uppercase;clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%)}
.files .fn{display:flex;flex-direction:column;min-width:0;flex:1}
.files .fn b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fn small{color:var(--mu);font-size:11.5px}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mu);font-size:12.5px;cursor:pointer;transition:all .2s}
.drop:hover,.drop.hi{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}
.thread{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:12px}
.thread li{display:flex;gap:10px;animation:rise .35s var(--ease) both}
.thread p{margin:0;font-size:13px}
.thread .bub{background:var(--hover);padding:8px 11px;border-radius:4px 12px 12px 12px;min-width:0;flex:1}
.cform{display:flex;flex-direction:column;gap:8px}
.cform textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--inp);resize:vertical;outline:none}
.cform textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.cform .row{justify-content:flex-end}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.checks label:hover{background:var(--hover)}
.checks input{width:16px;height:16px;accent-color:var(--ac)}
.checks input:checked+span{text-decoration:line-through;color:var(--mu)}
/* command search */
.cmdk ul{list-style:none;margin:10px 0 0;padding:0;max-height:320px;overflow:auto}
.cmdk li button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;cursor:pointer;color:inherit;font-size:13.5px}
.cmdk li button[aria-selected=true]{background:var(--ac);color:var(--on-ac)}
.cmdk .search{max-width:none;height:44px}
/* timer chip */
.tchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--tx);font:700 12.5px var(--mono)}
.tchip[hidden]{display:none}
.tchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.6s infinite}
.tchip span{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font);font-weight:600}
/* responsive */
@media (max-width:1180px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.g-21,.g-12,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app,.L-top,.L-rail{grid-template-columns:minmax(0,1fr)}
  .side,.L-top .side,.L-rail .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:min(280px,84vw);flex-direction:column;align-items:stretch;padding:18px 14px;transform:translateX(-105%);transition:transform .35s var(--ease);box-shadow:20px 0 60px -20px rgba(0,0,0,.4);overflow-y:auto}
  .L-top .nav,.L-rail .nav{flex-direction:column;overflow:visible}
  .L-rail .nav a{flex-direction:row;width:auto;font-size:14px;padding:9px 12px;gap:11px}
  .L-rail .nav a .ct{position:static;margin-left:auto}
  .L-rail .brand{flex-direction:row;font-size:17px}
  .L-top .side-foot{margin:auto 0 0}
  .L-top .top{top:0}
  .nav-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(8,10,18,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .nav-open .scrim{opacity:1;pointer-events:auto}
  .only-m{display:inline-flex!important}
  .hide-s{display:none!important}
}
@media (max-width:640px){
  :root{--pad:14px;--gap:12px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .ptitle{font-size:17px}
  .kpi .v{font-size:21px}
  .kpi .spark{display:none}
  .cd{min-height:62px;padding:2px}
  .ev{font-size:0;height:7px;padding:0;border-left-width:0;background:var(--c)}
  .cal .dh{padding:4px 2px;text-align:center;font-size:10px;letter-spacing:0}
  .dl{grid-template-columns:90px 1fr}
  .kcol{flex-basis:248px}
  .top{gap:4px}
  .hide-xs{display:none!important}
}
@media (max-width:440px){.tchip span{display:none}.top .btn.icon,.top #cmdBtn{width:32px;padding:0}.ubtn .av{width:30px;height:30px}.top{padding-left:10px;padding-right:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* ---------- Tidemark look: slate and sea-teal, compact and technical ---------- */
:root{--r:8px;--r2:6px;--rb:6px;--side:220px;--pad:18px;--gap:14px}
[data-theme=light]{--bg:#eef2f3;--tx:#18252c;--mu:#5d6f78;--line:#d3dde1;--card:#fff;--card-solid:#fff;--hover:rgba(24,37,44,.05);--inp:#fff;--ac:#13968e;--on-ac:#fff;--ok:#1f9d6b;--warn:#c9850f;--bad:#d24b3d;--info:#2a7ab8;--sh:0 1px 2px rgba(24,37,44,.06);--sh2:0 10px 24px -12px rgba(24,37,44,.3);--side-bg:#1d2a31;--side-tx:#e6eef0;--side-mu:#93a7ae;--side-act:rgba(19,150,142,.22);--side-on:#7fe3d8;--top-bg:rgba(238,242,243,.9);--col-bg:#e6ecee;--c1:#13968e;--c2:#2a7ab8;--c3:#d08a1d;--c4:#7b6bd1;--c5:#d24b3d;--c6:#6b8791;--sea:#cfe7e6;--land:#f6f8f8;--road:#c3cfd3;--tip-bg:#1d2a31;--toast-bg:#1d2a31}
[data-theme=dark]{--bg:#0d1418;--tx:#e3ecee;--mu:#8ea2a9;--line:#24343b;--card:#121c21;--card-solid:#152127;--hover:rgba(227,236,238,.06);--inp:#0f181c;--ac:#2cc4b8;--on-ac:#062421;--ok:#46c993;--warn:#eab04a;--bad:#ef6e5f;--info:#5aa9e6;--sh:0 1px 0 rgba(0,0,0,.4);--sh2:0 12px 26px -12px rgba(0,0,0,.8);--side-bg:#091014;--side-tx:#e3ecee;--side-mu:#7f939a;--side-act:rgba(44,196,184,.16);--side-on:#7fe3d8;--top-bg:rgba(13,20,24,.9);--col-bg:#111b20;--c1:#2cc4b8;--c2:#5aa9e6;--c3:#eab04a;--c4:#a597f0;--c5:#ef6e5f;--c6:#7f9aa3;--sea:#0f3134;--land:#121c21;--road:#2a3c43;--tip-bg:#000;--toast-bg:#1b2a31}
body{font-size:13.5px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
[data-theme=dark] body{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px)}
.brand{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.nav a{padding:7px 10px;font-size:13px;border-radius:6px}
.nav .mk{border-radius:6px;box-shadow:inset 2px 0 0 var(--side-on)}
.ptitle{font-size:18px;font-weight:700;letter-spacing:.01em}
.card .ch h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:750}
.kpi .v{font:700 24px var(--mono);letter-spacing:-.03em}
.kpi{border-left:3px solid var(--kc)}
.tnum,.mono{font-family:var(--mono)}
.btn{height:32px;font-size:12.5px}
.tbl td{padding:8px 10px}
/* field map (signature) */
.map{width:100%;height:auto;display:block;border-radius:6px}
.map .sea{fill:var(--sea)}.map .land{fill:var(--land)}
.map .road{fill:none;stroke:var(--road);stroke-width:5;stroke-linecap:round}
.map .road.m{stroke-width:8}
.map .dist{font:700 10px var(--mono);fill:var(--mu);letter-spacing:.12em}
.map .site{cursor:pointer}
.map .site circle.p{fill:var(--c);stroke:var(--card-solid);stroke-width:2.5}
.map .site:hover circle.p,.map .site:focus-visible circle.p{stroke:var(--tx)}
.map .site .ring{fill:none;stroke:var(--c);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out 4}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
.map .site text{font:700 10px var(--font);fill:var(--tx)}
.map .van{transition:transform 1s linear}
.map .van rect{fill:var(--tx)}
.map .van text{font:800 8px var(--mono);fill:var(--bg)}
.map .route{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:4 5;opacity:.6}
.sweep{position:absolute;inset:0;pointer-events:none;border-radius:6px;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--ac) 35%,transparent) 360deg);-webkit-mask:radial-gradient(circle,#000 60%,transparent 61%);mask:radial-gradient(circle,#000 60%,transparent 61%);opacity:0}
.sweep.go{animation:sweep 2.4s linear 1}
@keyframes sweep{0%{opacity:.9;transform:rotate(0)}90%{opacity:.6}100%{opacity:0;transform:rotate(360deg)}}
.mapw{position:relative;overflow:hidden;border-radius:6px;border:1px solid var(--line)}
.crew li{font-size:12.5px}
.crew .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
/* workload grid */
.wl{overflow-x:auto}
.wlg{display:grid;grid-template-columns:180px repeat(6,minmax(120px,1fr));min-width:900px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.wlh{padding:8px;font:700 11px var(--mono);color:var(--mu);border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--card-solid)}
.wlp{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;min-width:0}
.wlp small{display:block;color:var(--mu);font-size:11px}
.wcell{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:74px;cursor:copy;transition:background-color .15s}
.wcell.hi{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.wcell .ld{display:flex;justify-content:space-between;font:700 10.5px var(--mono);color:var(--mu)}
.wcell .ld b{color:var(--lc)}
.wcell .bar{height:4px;border-radius:2px;background:var(--hover);overflow:hidden}
.wcell .bar i{display:block;height:100%;width:var(--w);background:var(--lc);transition:width .5s var(--ease)}
.alc{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 7px;border-radius:5px;font-size:11.5px;font-weight:650;background:color-mix(in srgb,var(--c) 16%,var(--card-solid));border-left:3px solid var(--c);cursor:grab;touch-action:none;user-select:none}
.alc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alc b{font-family:var(--mono)}
.alc .btn{width:20px;height:20px;padding:0}
.alc.ghosted{opacity:.3}
.wcell .ins{height:2px}
.page.enter .alc{animation:fade .4s var(--ease) both;animation-delay:calc(var(--d)*12ms + .1s)}
/* visits agenda */
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}

  onSubmit(x){if(v)Object.assign(v,x);else{D.visits.push({id:'V-'+(D.vn++),...x,st:'Planned',dur:0});if(D.settings.nVisit)note(`Visit planned: ${PJ(x.p).n}, ${fmtD(x.d)}`,'pin','visits')}save();refresh();toast(v?'Visit saved':'Visit planned')}})}
function issueForm(pre={}){formModal({title:'Raise an issue',values:{type:'RFI',sev:'Medium',who:'e2',due:dIso(7),...pre},fields:[{k:'t',label:'What is the issue?',req:1,full:1,check:x=>x.length<8?'Describe it in a few more words':''},{k:'type',label:'Type',type:'select',opts:['RFI','Snag','NCR']},{k:'p',label:'Project',type:'select',opts:D.projects.map(p=>[p.id,p.n])},{k:'sev',label:'Severity',type:'select',opts:['Low','Medium','High']},{k:'who',label:'Assigned to',type:'select',opts:D.people.map(m=>[m.id,m.n])},{k:'due',label:'Reply by',type:'date',req:1}],submit:'Raise',onSubmit(v){const id=(v.type==='NCR'?'NCR-':v.type==='RFI'?'RFI-':'SNG-')+String(D.iss++).padStart(3,'0');D.issues.unshift({id,...v,st:'Open',raised:iso(T0),comments:[],files:[]});note(`${id} raised on ${PJ(v.p).n}`,'flag','issues');save();refresh();toast(id+' raised')}})}
function allocForm(a,pre){formModal({title:a?'Edit allocation':'Book hours',values:a||{h:8,...pre},fields:[{k:'p',label:'Project',type:'select',full:1,opts:D.projects.map(p=>[p.id,p.n])},{k:'who',label:'Person',type:'select',opts:D.people.map(m=>[m.id,m.n])},{k:'w',label:'Week',type:'select',opts:Array.from({length:6},(_,i)=>[i,'Week of '+fmtD(addD(wk0(),i*7))])},{k:'h',label:'Hours',type:'number',req:1,min:1,max:60}],submit:a?'Save':'Book',del:a?{msg:'Remove these hours?',fn:()=>{D.alloc=D.alloc.filter(x=>x!==a);save();refresh();toast('Hours removed')}}:null,
  onSubmit(v){v.w=+v.w;if(a)Object.assign(a,v);else D.alloc.push({id:'a'+(D.an++),...v});save();refresh();const l=load(v.who,v.w),m=PE(v.who);toast(l>m.cap?`${m.n.split(' ')[0]} is now booked ${l}h that week`:'Hours booked',l>m.cap?'warn':'ok')}})}
const wk0=()=>iso(addD(T0,-((T0.getDay()+6)%7)));
/* ---------- Visit check-in: safety checklist, then a timer ---------- */
function startVisit(v){const items=['Hard hat, boots and vest on','Site permit seen and signed','Toolbox talk with the foreman','Camera and tape ready'];
  modal({title:'Check in: '+PJ(v.p).n,body:`<p class="mu" style="margin:0 0 10px">${esc(v.why)} · ${v.t}</p><ul class="checks">${items.map((t,i)=>`<li><label><input type="checkbox" data-sf="${i}"><span>${t}</span></label></li>`).join('')}</ul><small class="err" id="sfe"></small>`,foot:`<button class="btn ghost" data-close>Cancel</button><button class="btn pri" data-sgo>${ic('play')}Start visit</button>`,
    onOpen(b,close){$('[data-sgo]',b).onclick=()=>{const all=$$('[data-sf]',b).every(c=>c.checked);if(!all){$('#sfe',b).textContent='Tick every safety item before going on site';return}v.st='On site';save();close();timerStart(PJ(v.p).n+' visit','visit:'+v.id);refresh()}}})}
APP.onTimerStop=(r,sec)=>{if(String(r.ref).startsWith('visit:')){const v=D.visits.find(x=>x.id===r.ref.slice(6));if(v){v.st='Done';v.dur=sec;note(`Visit done: ${PJ(v.p).n} (${hm(sec/60)})`,'check','visits')}save()}};
APP.onTimer=()=>{if(CUR==='visits'||CUR==='ops')refresh()};

  barChart($('#ibC',el),{labels:D.projects.map(p=>p.n.split(' ')[0]),stacked:true,series:['High','Medium','Low'].map(s=>({n:s,c:sevC(s),d:D.projects.map(p=>D.issues.filter(i=>i.p===p.id&&i.sev===s&&i.st!=='Closed').length)})),fmt:fmtN,h:210,yw:30});
  el.addEventListener('click',e=>{if(e.target.closest('[data-ping]')){sw();toast(`${field.length} crews responded`)}const s=e.target.closest('[data-pj]');if(s)openProject(s.dataset.pj)});
  el.addEventListener('keydown',e=>{const s=e.target.closest&&e.target.closest('[data-pj]');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openProject(s.dataset.pj)}});
  el.addEventListener('pointermove',e=>{const s=e.target.closest&&e.target.closest('[data-pj]');if(s){const p=PJ(s.dataset.pj);tip(`<div class="tt0">${esc(p.n)}</div>${esc(p.client)}<br>${p.st} · fee used <b>${Math.round(p.used/p.fee*100)}%</b>`,e)}else if(e.target.closest&&e.target.closest('.map'))tipHide()});

    cols:[{k:'id',l:'Drawing no.',r:d=>`<span class="mono"><b>${d.id}</b></span>`},{k:'t',l:'Title',r:d=>`${esc(d.t)}<br><small class="mu">${esc(PJ(d.p).n)}</small>`},{k:'rev',l:'Rev',r:d=>`<span class="rev">${d.rev}</span>`},{k:'st',l:'Status',r:d=>`<span class="tag" style="--c:${d.st==='For construction'?'var(--ok)':d.st==='For approval'?'var(--c4)':'var(--c3)'}">${d.st}</span>`},{k:'d',l:'Issued',r:d=>`<span class="mono">${fmtD(d.d)}</span>`},{k:'go',l:'',sort:false,r:d=>`<button class="btn sm" data-act="rev">${ic('upload')}New rev</button>`}],act:(a,d)=>{if(a==='rev')revForm(d)}})}},
reports:{t:'Reports',sub:'Fees, hours and quality across the practice.',r(el){
  el.innerHTML=`<div class="row"><div class="seg" role="group" aria-label="Fee view">${[['fee','Fee burn'],['hrs','Hours']].map(([k,l])=>`<button data-rp="${k}" aria-pressed="${UI.rep===k}">${l}</button>`).join('')}</div></div><div class="g g-21"><section class="card"><div class="ch"><h3>${UI.rep==='fee'?'Fee used vs fee':'Booked hours per project'}</h3></div><div class="chart" id="r1"></div></section><section class="card"><div class="ch"><h3>Practice utilisation</h3></div><div class="chart" id="r2" style="display:grid;place-items:center"></div></section></div><div class="g g-2"><section class="card"><div class="ch"><h3>Issues opened per week</h3></div><div class="chart" id="r3"></div></section><section class="card"><div class="ch"><h3>Team load heatmap</h3></div><div class="chart" id="r4"></div></section></div>`;
  if(UI.rep==='fee')barChart($('#r1',el),{labels:D.projects.map(p=>p.n.split(' ')[0]),series:[{n:'Fee',d:D.projects.map(p=>p.fee),c:'var(--c6)'},{n:'Used',d:D.projects.map(p=>p.used),c:'var(--c1)'}],fmt:v=>'Rs '+short(v),yw:58,h:230});
  else barChart($('#r1',el),{labels:D.projects.map(p=>p.n.split(' ')[0]),series:[{n:'Hours',d:D.projects.map(p=>sum(D.alloc.filter(a=>a.p===p.id).map(a=>a.h))),c:'var(--c2)'}],fmt:v=>v+'h',h:230});
  gauge($('#r2',el),{v:Math.round(sum(D.people.map(m=>Math.min(m.cap,load(m.id,0))))/sum(D.people.map(m=>m.cap))*100),max:100,l:'this week',fmt:pct,cf:'p',c:'var(--c1)'});
  const wks=Array.from({length:6},(_,i)=>addD(T0,(i-5)*7));lineChart($('#r3',el),{labels:wks.map(w=>fmtD(w)),series:[{n:'Opened',d:wks.map(w=>D.issues.filter(i=>diffD(i.raised,w)>=0&&diffD(i.raised,w)<7).length),c:'var(--c5)'}],fmt:fmtN,h:200,yw:28});
  heat($('#r4',el),{rows:D.people.map(m=>m.n.split(' ')[0]),cols:Array.from({length:6},(_,w)=>'Wk'+(w+1)),v:(r,c)=>load(D.people[r].id,c),fmt:v=>v+'h',c:'var(--c1)',lw:60,ch:20});
  el.addEventListener('click',e=>{const r=e.target.closest('[data-rp]');if(r){UI.rep=r.dataset.rp;refresh()}})}},
settings:{t:'Settings',sub:'Firm details, capacity and demo data.',r(el){const s=D.settings,th=document.documentElement.dataset.theme;
  el.innerHTML=`<div class="g g-2"><section class="card"><div class="ch"><h3>Firm</h3></div><form class="form" id="ff" novalidate>${fieldHTML({k:'firm',label:'Firm name',req:1,full:1},s.firm)}${fieldHTML({k:'city',label:'City'},s.city)}${fieldHTML({k:'hrs',label:'Hours per week per person',type:'number',min:10,max:60},s.hrs)}<div class="field full"><button class="btn pri" style="justify-self:start">Save</button></div></form></section>
  <section class="card"><div class="ch"><h3>Preferences</h3></div><ul class="list"><li><label class="switch"><input type="checkbox" data-set="nVisit"${s.nVisit?' checked':''}><i></i>Notify me about new site visits</label></li><li><label class="switch"><input type="checkbox" data-set="live"${s.live?' checked':''}><i></i>Live crew tracking on the map</label></li><li><span style="flex:1">Theme</span><div class="seg" role="group" aria-label="Theme"><button data-th="light" aria-pressed="${th==='light'}">Light</button><button data-th="dark" aria-pressed="${th==='dark'}">Dark</button></div></li></ul><div class="ch" style="margin-top:16px"><h3>Demo data</h3></div><button class="btn danger" data-reset>${ic('refresh')}Reset demo data</button></section></div>`;
  $('#ff',el).addEventListener('submit',e=>{e.preventDefault();const x=e.target.elements,f=x.firm.value.trim(),h=+x.hrs.value,ff=$('.field[data-k=firm]',el),fh=$('.field[data-k=hrs]',el);ff.classList.toggle('bad',!f);$('.err',ff).textContent=f?'':'Enter the firm name';const bh=!(h>=10&&h<=60);fh.classList.toggle('bad',bh);$('.err',fh).textContent=bh?'Use 10 to 60':'';if(!f||bh)return;Object.assign(s,{firm:f,city:x.city.value.trim(),hrs:h});D.people.forEach(m=>m.cap=h);save();toast('Saved')});
  el.addEventListener('change',e=>{const k=e.target.dataset.set;if(k){s[k]=e.target.checked;save();toast('Saved')}});
  el.addEventListener('click',e=>{const t=e.target.closest('[data-th]');if(t)setTheme(t.dataset.th,1);if(e.target.closest('[data-reset]'))resetDemo()})}}};
function openIssue(i){drawer({title:i.id,body:`<h3 style="margin:0 0 6px">${esc(i.t)}</h3><div class="row" style="margin-bottom:12px"><span class="tag" style="--c:${sevC(i.sev)}">${i.sev}</span><span class="mu">${esc(PJ(i.p).n)} · raised ${fmtD(i.raised)} · reply by ${fmtD(i.due)}</span></div><label class="vh" for="ist2">Status</label><select id="ist2" class="inp" style="width:auto;margin-bottom:14px">${['Open','Answered','Closed'].map(s=>`<option${s===i.st?' selected':''}>${s}</option>`).join('')}</select>${tabsHTML('is',['Thread <span class="mu" data-ccount></span>','Photos and files <span class="mu" data-fcount></span>'])}<div id="isp0" role="tabpanel" aria-labelledby="ist0"><div data-thread></div></div><div id="isp1" role="tabpanel" aria-labelledby="ist1" hidden><div data-files></div></div>`,
  onOpen(b){tabsBind(b);bindDetail(b,i,save);$('#ist2',b).onchange=e=>{i.st=e.target.value;save();refresh();toast(i.id+' is '+i.st.toLowerCase())}}})}
function openDwg(d){drawer({title:d.id,body:`<h3 style="margin:0 0 4px">${esc(d.t)}</h3><p class="mu" style="margin:0 0 12px">${esc(PJ(d.p).n)} · ${d.disc}</p><div class="ch"><h3>Revision history</h3></div><ul class="list">${[...d.hist].reverse().map(h=>`<li><span class="rev">${h.rev}</span><span style="flex:1">${esc(h.note)}</span><span class="mono mu">${fmtD(h.d)}</span></li>`).join('')}</ul>`,foot:`<span class="sp"></span><button class="btn pri" data-nr>${ic('upload')}Issue revision ${String.fromCharCode(d.rev.charCodeAt(0)+1)}</button>`,onOpen(b,close){$('[data-nr]',b).onclick=()=>{close();revForm(d)}}})}
function revForm(d){const nx=String.fromCharCode(d.rev.charCodeAt(0)+1);formModal({title:`Issue ${d.id} rev ${nx}`,values:{st:d.st},fields:[{k:'note',label:'What changed?',req:1,full:1,check:v=>v.length<5?'Say a little more':''},{k:'st',label:'Status',type:'select',opts:['For comment','For approval','For construction']}],submit:'Issue revision',onSubmit(v){d.rev=nx;d.st=v.st;d.d=iso(T0);d.hist.push({rev:nx,d:iso(T0),note:v.note});note(`${d.id} rev ${nx} issued ${v.st.toLowerCase()}`,'layers','drawings');save();refresh();toast(`${d.id} is now rev ${nx}`)}})}
APP.cmds=()=>[{l:'Plan a site visit',ic:'pin',fn:()=>visitForm(null,{p:D.projects[0].id})},{l:'Raise an issue',ic:'flag',fn:()=>issueForm({p:D.projects[0].id})},{l:'Book hours',ic:'users',fn:()=>allocForm(null,{who:'e1',w:0,p:D.projects[0].id})},...D.projects.map(p=>({l:'Open '+p.n,ic:'folder',fn:()=>openProject(p.id)}))];
APP.sideFoot=()=>`<div style="border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px;font-size:12px;color:var(--side-mu)"><b style="color:var(--side-tx);display:block;margin-bottom:4px">${D.people.filter(p=>p.field).length} engineers in the field</b>${D.visits.filter(v=>v.d===iso(T0)).length} visits today</div>`;
boot();
</script>
</body>
</html>
