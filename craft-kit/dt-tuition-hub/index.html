<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Tuition Hub</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: notebook blue, chalk white and marigold (light) / a study lamp at night (dark) ---------- */
  :root {
    --bg: #f4f2ea; --bg-2: #e3e9f8; --glow: #fde9bd;
    --card: #ffffff; --card-2: #f4f3ee; --card-3: #edf1fb;
    --ink: #18213a; --ink-2: #39445f; --muted: #687188;
    --line: rgba(24,33,58,.09); --line-2: rgba(24,33,58,.17); --rule: rgba(43,89,195,.075);
    --blue: #2b59c3; --blue-d: #1d3f91; --blue-t: #e3eafb;
    --mari: #e9a01c; --mari-t: #fdf0d3; --mari-ink: #7a4d00;
    --red: #cf4637; --red-t: #fbe5e1; --green: #23845a; --green-t: #ddf1e6;
    --board: #1c283c; --board-2: #2a3a55; --chalk: #f3efe4; --chalk-2: rgba(243,239,228,.6); --frame: #a07b51;
    --shadow: 0 1px 2px rgba(24,33,58,.05), 0 10px 26px -16px rgba(24,33,58,.22);
    --shadow-lift: 0 2px 4px rgba(24,33,58,.06), 0 20px 40px -18px rgba(24,33,58,.32);
    --nav-bg: rgba(255,255,255,.82);
    --radius: 18px; --radius-sm: 12px;
    --panel: #ffffff; --surface: #ffffff; --surface-2: #f2f1eb; --accent: var(--blue); --accent-ink: #ffffff;
    --good: var(--green); --bad: var(--red); --warn: var(--mari); --grid: rgba(24,33,58,.08);
    --tip-bg: rgba(20,26,44,.95); --tip-ink: #fff; --overlay: rgba(20,26,44,.34);
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0d1322; --bg-2: #13203f; --glow: rgba(233,160,28,.13);
    --card: #151d31; --card-2: #1b2439; --card-3: #1a2645;
    --ink: #e9edf7; --ink-2: #c4cbdc; --muted: #919cb6;
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15); --rule: rgba(125,157,255,.055);
    --blue: #7f9fff; --blue-d: #aac0ff; --blue-t: rgba(127,159,255,.16);
    --mari: #f4b545; --mari-t: rgba(244,181,69,.15); --mari-ink: #f7cd7c;
    --red: #ff7f71; --red-t: rgba(255,127,113,.15); --green: #55cc96; --green-t: rgba(85,204,150,.15);
    --board: #0a111e; --board-2: #17233a; --frame: #6d5236;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.7);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 22px 44px -18px rgba(0,0,0,.8);
    --nav-bg: rgba(23,31,52,.84);
    --panel: #161f35; --surface: #151d31; --surface-2: #1e2742; --accent-ink: #0d1322; --grid: rgba(255,255,255,.07);
    --tip-bg: rgba(240,243,250,.97); --tip-ink: #121a2c; --overlay: rgba(0,0,0,.55);
    color-scheme: dark;
  }

  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide row or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .cc-av { --h: 220; display: inline-grid; place-items: center; width: 2.3em; height: 2.3em; border-radius: 50%; font-size: .78em; font-weight: 700; color: hsl(var(--h) 55% 24%); background: hsl(var(--h) 70% 87%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 32% 28%); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-size: 12.5px; font-weight: 650; text-decoration: none; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--blue); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--blue); border-color: transparent; color: var(--accent-ink); box-shadow: 0 8px 18px -10px var(--blue); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.mari { background: var(--mari); border-color: transparent; color: #2c1c00; }
  .btn.danger { background: var(--red); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 28px; padding: 0 10px; font-size: 11.5px; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: var(--radius-sm); background: var(--tip-bg); color: var(--tip-ink); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: 12.5px; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--green); }
  .cc-toast.bad .ic { color: var(--red); }
  .cc-toast.warn .ic { color: var(--mari); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateY(10px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(860px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--radius) 0 0 var(--radius); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 2; }
  .cc-dh h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
  .cc-x { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; align-content: start; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label, .cc-field .lab { font-size: 11.5px; font-weight: 650; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 38px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card-2); color: var(--ink); font-size: 13px; }
  .cc-field textarea { resize: vertical; }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--red); }
  .cc-err { color: var(--red); font-size: 11.5px; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: 11.5px; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
  .cc-days { display: flex; flex-wrap: wrap; gap: 6px; }
  .cc-days label { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card-2); font-size: 12px; font-weight: 650; color: var(--ink-2); cursor: pointer; }
  .cc-days input { width: auto; min-height: 0; margin: 0; accent-color: var(--blue); }
  .cc-days label:has(input:checked) { background: var(--blue-t); border-color: var(--blue); color: var(--blue); }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 110px; max-width: 260px; padding: 8px 10px; border-radius: 10px; background: var(--tip-bg); color: var(--tip-ink); font-size: 11.5px; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 2px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; width: min(560px, 100%); }
  .cc-cmdk-q { width: 100%; min-height: 44px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--blue); background: var(--card-2); font-size: 14px; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--blue-t); color: var(--blue); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: 11px; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line-2); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 280px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--blue); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font-size: 12.5px; }
  .cc-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .cc-chip { min-height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); font-size: 12px; font-weight: 650; transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 6px; }
  .cc-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
  .cc-chip small { opacity: .65; font-weight: 600; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
  .cc-tbl th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 650; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--blue); }
  .cc-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 22ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--card-3); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 12px; }
  .cc-pages button[aria-current="page"] { background: var(--blue); color: var(--accent-ink); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 26px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 28px; height: 28px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line-2); }
  .cc-line { fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--card); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--card-2); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .cc-donut-c small { color: var(--muted); font-size: 11px; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 150px; display: grid; gap: 2px; font-size: 12px; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--card-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance: cards rise in one after another */
  .cc-in { animation: ccRise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(14px) scale(.99); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw, .mk path, .ch-draw { stroke-dashoffset: 0 !important; }
  }

  /* ---------- Page: chalk white paper with faint notebook ruling ---------- */
  body { background: radial-gradient(900px 520px at 100% -8%, var(--glow), transparent 62%), radial-gradient(900px 640px at -12% -4%, var(--bg-2), transparent 62%), var(--bg); background-attachment: fixed; color: var(--ink); font: 13px/1.5 var(--font); min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); }
  .skip { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 8px 14px; border-radius: 10px; background: var(--blue); color: #fff; text-decoration: none; font-weight: 700; }
  .skip:focus { top: 10px; }

  /* ---------- Top bar: brand pill, sliding nav pill, tools ---------- */
  .topwrap { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); transition: box-shadow .3s; }
  .topwrap.scrolled { box-shadow: 0 1px 0 var(--line), 0 10px 24px -20px rgba(0,0,0,.4); }
  .top { display: flex; align-items: center; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 9px; flex: none; color: var(--ink); text-decoration: none; padding: 4px 14px 4px 5px; border-radius: 999px; background: var(--nav-bg); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .brand svg { width: 32px; height: 32px; display: block; }
  .brand b { display: block; font-size: 14px; font-weight: 750; letter-spacing: -.01em; line-height: 1.15; }
  .brand small { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.2; }
  .nav { position: relative; display: flex; gap: 1px; margin: 0 auto; padding: 4px; border-radius: 999px; background: var(--nav-bg); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 620; font-size: 12.5px; white-space: nowrap; transition: color .25s; }
  .nav a .ic { width: 15px; height: 15px; }
  .nav a:hover { color: var(--blue); }
  .nav a[aria-current="page"] { color: var(--accent-ink); }
  .nav a .ndot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--mari); box-shadow: 0 0 0 2px var(--nav-bg); }
  .nav .mark { position: absolute; z-index: 0; top: 4px; left: 0; height: calc(100% - 8px); border-radius: 999px; background: var(--blue); box-shadow: 0 8px 16px -8px var(--blue); transition: transform .45s cubic-bezier(.3,1.25,.4,1), width .45s cubic-bezier(.3,1.25,.4,1); }
  .tools { display: flex; gap: 7px; align-items: center; flex: none; }
  .icon-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--nav-bg); color: var(--ink); box-shadow: var(--shadow); }
  .icon-btn:hover { color: var(--blue); }
  .pill-btn { display: inline-flex; gap: 7px; align-items: center; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--nav-bg); color: var(--ink); font-weight: 650; font-size: 12.5px; box-shadow: var(--shadow); }
  .pill-btn:hover { color: var(--blue); }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--mari); color: #2c1c00; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
  .badge:empty { display: none; }
  .me { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: 12px; color: #fff; background: linear-gradient(140deg, var(--blue), #5f86e6 60%, var(--mari)); border: 2px solid var(--card); box-shadow: var(--shadow); }
  .theme-ic-dark { display: none; }
  [data-theme="dark"] .theme-ic-dark { display: block; }
  [data-theme="dark"] .theme-ic-light { display: none; }

  /* Phone bottom bar (hidden on wide screens) */
  .bbar { display: none; }

  /* ---------- Layout ---------- */
  main { max-width: 1440px; margin: 0 auto; padding: 4px 24px 40px; }
  #view { min-height: 70vh; }
  #view.leaving > * { opacity: 0; transform: translateY(6px); transition: opacity .16s, transform .16s; }
  .g { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .g + .g, .g + .card, .card + .g, .band + .g { margin-top: 14px; }
  .c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
  .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
  .stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
  /* one-column grids: never let a long line widen the column past its card */
  .stack, .list, .tc, .kpi, .bcard, .tcard, .slip, .threads, .tests, .hbars { grid-template-columns: minmax(0, 1fr); }
  .stretch { align-self: stretch; }
  .ph { display: flex; align-items: flex-end; gap: 14px; margin: 6px 0 14px; flex-wrap: wrap; }
  .ph h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.025em; font-weight: 700; margin: 0; }
  .ph p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .ph .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .eyebrow { margin: 0 0 2px !important; font-size: 12px !important; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .hello { font-size: 38px !important; font-weight: 620 !important; letter-spacing: -.035em !important; }
  .uline { position: relative; color: var(--blue); white-space: nowrap; }
  .uline svg { position: absolute; left: -2%; bottom: -9px; width: 104%; height: 14px; overflow: visible; }
  .uline path { fill: none; stroke: var(--mari); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw .9s .35s cubic-bezier(.5,.1,.2,1) forwards; }

  /* Cards */
  .card { position: relative; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; transition: transform .25s, box-shadow .25s, border-color .25s; }
  .card.lift:hover, a.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .card-h { display: flex; align-items: center; gap: 8px; margin: -2px 0 10px; min-height: 30px; }
  .card-h h2 { font-size: 14px; font-weight: 680; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  .card-h .sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card-h .grow { flex: 1; }
  .arrow { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); text-decoration: none; transition: background .2s, color .2s, transform .2s; }
  .arrow:hover { background: var(--blue); color: var(--accent-ink); transform: rotate(-8deg); }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .link { color: var(--blue); font-weight: 650; text-decoration: none; background: none; border: 0; padding: 0; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { text-decoration: underline; }
  .kbd { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--muted); }

  /* Status pills */
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 680; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .pill.plain::before { display: none; }
  .pill.paid, .pill.good { background: var(--green-t); color: var(--green); }
  .pill.due, .pill.warn { background: var(--mari-t); color: var(--mari-ink); }
  .pill.over, .pill.bad { background: var(--red-t); color: var(--red); }
  .pill.part, .pill.info { background: var(--blue-t); color: var(--blue); }
  .pill.ink { background: var(--ink); color: var(--bg); }
  .code { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 10.5px; font-weight: 750; letter-spacing: .03em; color: var(--c, var(--blue)); background: color-mix(in srgb, var(--c, var(--blue)) 14%, transparent); white-space: nowrap; }

  /* Meters: a filled part over a hatched track */
  .meter { height: 7px; border-radius: 99px; background: repeating-linear-gradient(135deg, var(--card-2) 0 4px, color-mix(in srgb, var(--line-2) 70%, transparent) 4px 5px); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--blue)); transform-origin: left; animation: growX 1s .15s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes growX { from { transform: scaleX(0); } }

  /* Skeleton shimmer while a data-heavy page draws */
  .skel { border-radius: var(--radius); background: linear-gradient(100deg, var(--card-2) 30%, var(--card) 50%, var(--card-2) 70%) 0 0 / 220% 100%; animation: shimmer 1s linear infinite; border: 1px solid var(--line); }
  @keyframes shimmer { to { background-position: -220% 0; } }

  /* Live dot */
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--red); }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* Lists inside cards */
  .list { list-style: none; margin: 0; padding: 0; display: grid; }
  .list > li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px dashed var(--line-2); min-width: 0; }
  .list > li:first-child { border-top: 0; }
  .list b { font-weight: 650; }
  .list small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  .list .end { margin-left: auto; text-align: right; flex: none; }
  .list button.li, .list a.li { all: unset; display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; border-radius: 10px; min-width: 0; }
  .list button.li:focus-visible, .list a.li:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--blue)); flex: none; }

  /* ---------- Today ---------- */
  .band { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0; }
  .band > div { padding: 12px 16px; border-left: 1px dashed var(--line-2); min-width: 0; }
  .band > div:first-child { border-left: 0; }
  .band small { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .band small .ic { color: var(--blue); }
  .band b { display: block; font-size: 22px; font-weight: 720; letter-spacing: -.025em; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
  .band b em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
  .band .meter { margin-top: 5px; }
  .band .foot { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .photo { padding: 0; overflow: hidden; color: #fff; min-height: 310px; isolation: isolate; }
  .photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .photo:hover > img { transform: scale(1.04); }
  .photo::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,16,34,.05) 25%, rgba(10,16,34,.35) 55%, rgba(10,16,34,.88)); }
  .photo .chip { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; }
  .photo .chip.r { left: auto; right: 12px; }
  .photo .ov { position: absolute; left: 16px; right: 16px; bottom: 14px; }
  .photo .ov h3 { margin: 0; font-size: 18px; letter-spacing: -.015em; line-height: 1.2; }
  .photo .ov p { margin: 3px 0 0; font-size: 12px; opacity: .88; }
  .photo .pbar { height: 5px; border-radius: 9px; background: rgba(255,255,255,.25); margin: 10px 0 6px; overflow: hidden; }
  .photo .pbar i { display: block; height: 100%; background: var(--mari); border-radius: inherit; transition: width 1s; }
  .photo .prow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  .photo .glass { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.92); color: #18213a; font-size: 12px; font-weight: 700; border: 0; text-decoration: none; }
  .photo .glass:hover { background: #fff; }
  .faces { display: flex; }
  .faces .cc-av { width: 24px; height: 24px; font-size: 9px; border: 2px solid rgba(20,26,44,.6); margin-left: -6px; }
  .faces .cc-av:first-child { margin-left: 0; }

  /* Timeline: rooms down the side, 4 to 9 PM across */
  .tl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tl { position: relative; --gut: 64px; }
  .tl-hours { position: relative; height: 18px; margin-left: var(--gut); font-size: 10.5px; color: var(--muted); }
  .tl-hours span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .tl-hours span:first-child { transform: none; }
  .tl-hours span:last-child { transform: translateX(-100%); }
  .tl-row { display: grid; grid-template-columns: var(--gut) 1fr; height: 54px; border-top: 1px dashed var(--line-2); }
  .tl-room { display: flex; flex-direction: column; justify-content: center; font-size: 11.5px; font-weight: 650; }
  .tl-room small { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .tl-lane { position: relative; background: repeating-linear-gradient(to right, transparent 0 calc(20% - 1px), var(--line) calc(20% - 1px) 20%); }
  .blk { position: absolute; top: 6px; bottom: 6px; display: block; padding: 4px 8px; border: 0; border-left: 3px solid var(--c); border-radius: 9px; background: color-mix(in srgb, var(--c) 15%, var(--card)); color: var(--ink); text-align: left; font-size: 11px; line-height: 1.3; overflow: hidden; white-space: nowrap; transition: transform .2s, box-shadow .2s; }
  .blk:hover { transform: translateY(-1px); box-shadow: 0 8px 16px -10px var(--c); z-index: 2; }
  .blk b { display: block; font-size: 11.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .blk span { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; }
  .blk.done { opacity: .5; }
  .blk.now { background: color-mix(in srgb, var(--c) 26%, var(--card)); box-shadow: 0 0 0 1.5px var(--c) inset; }
  .tl-now { position: absolute; top: 18px; bottom: 0; width: 2px; margin-left: -1px; background: var(--mari); z-index: 3; pointer-events: none; transition: left 1s linear; }
  .tl-now::before { content: attr(data-t); position: absolute; top: -18px; left: 50%; transform: translateX(-50%); padding: 1px 6px; border-radius: 6px; background: var(--mari); color: #2c1c00; font-size: 10px; font-weight: 800; white-space: nowrap; }
  .tl-now::after { content: ""; position: absolute; bottom: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--mari); }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .tags span { display: inline-flex; align-items: center; gap: 5px; }

  .regs .st { font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .regs .st.ok { color: var(--blue); }
  .regs .st.wait { color: var(--muted); font-weight: 600; }
  .ring { position: relative; width: 74px; height: 74px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .tr { stroke: var(--card-2); }
  .ring .fg { stroke: var(--blue); stroke-linecap: round; transition: stroke-dasharray 1s cubic-bezier(.2,.8,.2,1); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 750; letter-spacing: -.02em; }

  .feed li { animation: none; }
  .feed li.new { animation: feedIn .55s cubic-bezier(.2,.9,.3,1.15) both; }
  .feed li.new .li { background: var(--mari-t); }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-14px); } }
  .feed .li { padding: 2px 4px; transition: background 1.6s; }
  .fico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--blue-t); color: var(--blue); }
  .fico.pay { background: var(--green-t); color: var(--green); }
  .fico.late { background: var(--mari-t); color: var(--mari-ink); }

  .banner { position: relative; height: 92px; margin: -14px -16px 10px; border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,22,44,.72), rgba(14,22,44,.1)); }
  .banner span { position: absolute; left: 16px; bottom: 12px; z-index: 1; color: #fff; font-weight: 700; font-size: 14px; }
  .banner small { display: block; font-weight: 500; font-size: 11px; opacity: .85; }

  /* ---------- Chalk board (signature): marks grow as chalk bars ---------- */
  .board { position: relative; border-radius: 12px; overflow: hidden; color: var(--chalk); background: radial-gradient(120% 120% at 25% 10%, var(--board-2), var(--board) 70%); box-shadow: 0 0 0 5px var(--frame), 0 0 0 6px color-mix(in srgb, #000 30%, var(--frame)), inset 0 0 40px rgba(0,0,0,.35); margin: 5px; }
  .board::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 40% at 70% 80%, rgba(255,255,255,.05), transparent 70%), radial-gradient(40% 30% at 20% 70%, rgba(255,255,255,.04), transparent 70%); }
  .board svg { display: block; width: 100%; }
  .board .bh { position: absolute; left: 16px; top: 10px; right: 16px; display: flex; gap: 12px; align-items: baseline; z-index: 1; pointer-events: none; }
  .board .bh b { font-size: 15px; letter-spacing: .02em; font-weight: 650; text-shadow: 0 0 1px rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .board .bh span { font-size: 11.5px; color: var(--chalk-2); white-space: nowrap; flex: none; }
  .board.mini .bh span { display: none; }
  .board.mini .bh b { font-size: 14px; }
  .board .bh em { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--chalk-2); white-space: nowrap; }
  .board .bh em strong { color: var(--mari); font-size: 13px; }
  .chalk-write { animation: write .9s steps(22) both; }
  @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .board text { fill: var(--chalk-2); font-size: 10.5px; font-family: var(--font); }
  .board .val { fill: var(--chalk); font-size: 10.5px; font-weight: 700; animation: ccFade .5s both; }
  .ch-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: chalkUp .8s cubic-bezier(.25,.9,.3,1.05) both; }
  @keyframes chalkUp { from { transform: scaleY(0); } }
  .ch-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw .7s ease-out forwards; }
  .ch-axis { stroke: var(--chalk-2); stroke-width: 1.4; fill: none; stroke-linecap: round; }
  .ch-avg { stroke: var(--mari); stroke-width: 2; fill: none; stroke-dasharray: 7 6; animation: ccFade .6s both; }
  .ch-pass { stroke: #ff9e93; stroke-width: 1.4; fill: none; stroke-dasharray: 2 5; opacity: .8; }
  .ch-hit { fill: transparent; cursor: pointer; }
  .ch-hit:hover { fill: rgba(255,255,255,.05); }
  .board .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; color: var(--chalk-2); font-size: 13px; }
  .board .empty b { color: var(--chalk); font-size: 16px; }
  .tray { position: absolute; left: 10%; right: 10%; bottom: 0; height: 7px; border-radius: 4px 4px 0 0; background: color-mix(in srgb, #000 22%, var(--frame)); }
  .tray i { position: absolute; bottom: 4px; width: 26px; height: 5px; border-radius: 3px; background: #f4f0e6; }
  .tray i:nth-child(2) { left: 40px; width: 18px; background: var(--mari); }
  .tray i:nth-child(1) { left: 10px; }
  .board.wipe svg, .board.wipe .bh { animation: wipe .28s ease-in forwards; }
  @keyframes wipe { to { opacity: 0; transform: translateX(14px); filter: blur(2px); } }
  .chalk-card .board { margin-top: 4px; }

  /* ---------- Register (signature): fills like a paper register with pen strokes ---------- */
  .reg-wrap { position: relative; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); }
  .reg { position: relative; display: grid; grid-template-columns: 34px minmax(150px, 1fr) repeat(var(--n), 38px) 58px; min-width: max-content; font-size: 12.5px; }
  .reg > div { min-width: 0; }
  .reg .h { position: sticky; top: 0; z-index: 2; height: 44px; display: grid; place-items: center; align-content: center; background: var(--card-3); border-bottom: 2px solid color-mix(in srgb, var(--blue) 45%, transparent); font-size: 10.5px; color: var(--muted); line-height: 1.15; text-align: center; }
  .reg .h b { display: block; font-size: 13px; color: var(--ink); font-weight: 700; }
  .reg .h.nm { justify-items: start; padding-left: 12px; }
  .reg .h.on { background: color-mix(in srgb, var(--mari) 24%, var(--card)); color: var(--mari-ink); }
  .reg .h.on b { color: var(--mari-ink); }
  .reg .h.on b::after { content: ""; display: block; width: 16px; height: 2px; margin: 2px auto 0; border-radius: 2px; background: var(--mari); }
  .reg .c { height: 33px; display: grid; place-items: center; border-bottom: 1px solid color-mix(in srgb, var(--blue) 16%, transparent); border-right: 1px solid var(--line); }
  .reg .c.on { background: color-mix(in srgb, var(--mari) 9%, transparent); }
  .reg .no { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .reg .nm { justify-items: start; padding-left: 12px; border-right: 3px double color-mix(in srgb, var(--red) 55%, transparent); font-weight: 600; white-space: nowrap; overflow: hidden; }
  .reg .nm span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .reg .pc { font-weight: 700; font-size: 11.5px; font-variant-numeric: tabular-nums; border-right: 0; border-left: 3px double color-mix(in srgb, var(--red) 55%, transparent); }
  .reg .pc.low { color: var(--red); }
  .reg .ft { height: 32px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--card-2); font-variant-numeric: tabular-nums; }
  .reg .ft.on { color: var(--mari-ink); background: color-mix(in srgb, var(--mari) 18%, var(--card)); }
  .mk { width: 100%; height: 100%; display: grid; place-items: center; border: 0; padding: 0; background: transparent; border-radius: 0; transition: background .15s; }
  .mk:hover { background: var(--blue-t); }
  .mk svg { width: 21px; height: 21px; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .mk path { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .mk.ink path { stroke-dashoffset: 1; animation: penStroke .3s cubic-bezier(.5,.1,.4,1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes penStroke { to { stroke-dashoffset: 0; } }
  .mk.P svg { stroke: var(--blue); }
  .mk.A svg { stroke: var(--red); }
  .mk.L svg { stroke: var(--mari); }
  .mk.V svg { stroke: var(--muted); }
  .mk.blank::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }
  .pen { position: absolute; left: 0; top: 0; z-index: 4; width: 40px; height: 40px; pointer-events: none; opacity: 0; transition: opacity .35s; filter: drop-shadow(0 4px 4px rgba(0,0,0,.22)); }
  .pen.show { opacity: 1; }
  .legend-marks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); align-items: center; }
  .legend-marks span { display: inline-flex; align-items: center; gap: 4px; }
  .legend-marks svg { width: 16px; height: 16px; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .bchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .bchip { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 11px 0 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 12px; font-weight: 650; color: var(--ink-2); }
  .bchip .dot { width: 8px; height: 8px; }
  .bchip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 16%, var(--card)); border-color: var(--c); color: var(--ink); }
  .bchip .tick { width: 14px; height: 14px; color: var(--blue); }
  .bchip .pend { width: 7px; height: 7px; border-radius: 50%; background: var(--mari); }
  .datebox { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card-2); }
  .datebox button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; }
  .datebox button:disabled { opacity: .35; }
  .datebox span { font-size: 12px; font-weight: 700; padding: 0 8px; min-width: 132px; text-align: center; }
  .cnt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cnt div { padding: 8px; border-radius: 12px; background: var(--card-2); text-align: center; }
  .cnt b { display: block; font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .cnt small { font-size: 10.5px; color: var(--muted); }
  .hbars { display: grid; gap: 9px; }
  .hbars .hb { display: grid; grid-template-columns: 70px 1fr 42px; gap: 8px; align-items: center; font-size: 11.5px; }
  .hbars .hb span:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Batches ---------- */
  .bcard { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); text-align: left; cursor: pointer; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s, border-color .2s; }
  .bcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .bcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .bcard[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent), var(--shadow); }
  .bcard .t { display: flex; align-items: center; gap: 8px; }
  .bcard .t b { font-size: 13.5px; }
  .bcard .m { font-size: 11.5px; color: var(--muted); }
  .bcard .meter i { background: var(--c); }
  .bcard .f { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); gap: 8px; }
  .week { position: relative; display: grid; grid-template-columns: 54px repeat(6, minmax(0, 1fr)); }
  .week .wh { height: 34px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line-2); }
  .week .wh.today { color: var(--blue); }
  .week .wh.today::after { content: ""; display: block; width: 18px; height: 3px; border-radius: 3px; background: var(--blue); margin-top: -6px; }
  .week .tg { position: relative; }
  .week .tg span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .week .col { position: relative; border-left: 1px solid var(--line); background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--hh) - 1px), var(--line) calc(var(--hh) - 1px) var(--hh)); }
  .week .col.today { background-color: color-mix(in srgb, var(--blue) 5%, transparent); }
  .pblk { position: absolute; left: 4px; right: 4px; display: block; padding: 6px 8px; border: 0; border-radius: 10px; text-align: left; background: color-mix(in srgb, var(--c) 16%, var(--card)); border-top: 3px solid var(--c); color: var(--ink); font-size: 11px; line-height: 1.3; overflow: hidden; transition: transform .2s, box-shadow .2s; animation: ccPop .45s both; }
  .pblk:hover { transform: translateY(-1px); box-shadow: 0 10px 18px -12px var(--c); z-index: 2; }
  .pblk b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pblk span { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pblk.mini { left: 2px; right: 2px; padding: 2px 5px; border-top: 0; border-left: 3px solid var(--c); font-size: 10px; border-radius: 6px; }
  .clash { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--green-t); color: var(--green); font-weight: 650; font-size: 12px; margin-top: 12px; }
  .clash.bad { background: var(--red-t); color: var(--red); }

  /* ---------- Students ---------- */
  .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .who b { display: block; font-weight: 650; white-space: nowrap; }
  .who small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .attbar { display: flex; align-items: center; gap: 7px; min-width: 96px; }
  .attbar .meter { flex: 1; height: 6px; }
  .attbar span { font-weight: 700; font-size: 11.5px; min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .ibtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); }
  .ibtn:hover { color: var(--blue); border-color: var(--blue); }
  .acts-cell { display: flex; gap: 4px; justify-content: flex-end; }
  .tsel { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .prof-top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .prof-top .cc-av { width: 58px; height: 58px; font-size: 18px; }
  .prof-top h3 { margin: 0; font-size: 18px; letter-spacing: -.015em; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
  .facts div { padding: 10px; border-radius: 12px; background: var(--card-2); }
  .facts small { display: block; font-size: 10.5px; color: var(--muted); }
  .facts b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .strip { display: flex; gap: 3px; flex-wrap: wrap; margin: 6px 0 14px; }
  .strip i { width: 15px; height: 20px; border-radius: 4px; background: var(--blue); opacity: .85; }
  .strip i.A { background: var(--red); } .strip i.L { background: var(--mari); } .strip i.V { background: var(--line-2); }
  .sec-t { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 14px 0 4px; text-transform: none; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 12.5px; }
  .kv span { color: var(--muted); }

  /* ---------- Marks ---------- */
  .testcol { display: flex; flex-direction: column; }
  /* the list takes the height the board column gives it, and scrolls inside */
  .tests { flex: 1 1 0; min-height: 360px; display: grid; align-content: start; gap: 6px; overflow: auto; padding: 2px; margin: 0 -2px; }
  .tcard { display: grid; gap: 3px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: left; position: relative; transition: border-color .2s, background .2s; }
  .tcard:hover { border-color: var(--line-2); background: var(--card-3); }
  .tcard[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-t); }
  .tcard .row b { font-size: 12.5px; }
  .tcard small { color: var(--muted); font-size: 11px; }
  .mtab td input { width: 74px; min-height: 30px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card-2); text-align: right; font-variant-numeric: tabular-nums; }
  .mtab td input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  .mtab td input[aria-invalid="true"] { border-color: var(--red); background: var(--red-t); }
  .mtab .bad-msg { color: var(--red); font-size: 10.5px; display: block; }
  .grade { display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 7px; font-size: 11px; font-weight: 800; background: var(--card-2); }
  .grade.gA { background: var(--green-t); color: var(--green); } .grade.gB { background: var(--blue-t); color: var(--blue); }
  .grade.gC { background: var(--mari-t); color: var(--mari-ink); } .grade.gF { background: var(--red-t); color: var(--red); }

  /* ---------- Fees ---------- */
  .kpi { display: grid; gap: 4px; }
  .kpi small { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .kpi b { font-size: 22px; font-weight: 720; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .kpi .foot { font-size: 11px; color: var(--muted); }
  .kpi .kic { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--blue-t); color: var(--blue); }
  .kpi .kic.m { background: var(--mari-t); color: var(--mari-ink); } .kpi .kic.r { background: var(--red-t); color: var(--red); } .kpi .kic.gr { background: var(--green-t); color: var(--green); }
  .vouch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--card); }
  .slip { padding: 12px 14px; font-size: 11.5px; border-left: 2px dashed var(--line-2); display: grid; gap: 4px; align-content: start; }
  .slip:first-child { border-left: 0; }
  .slip h4 { margin: 0 0 4px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .slip h4 svg { width: 20px; height: 20px; }
  .slip .copy { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--blue); text-transform: uppercase; }
  .slip .ln { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line-2); padding: 2px 0; }
  .slip .ln span { color: var(--muted); }
  .slip .tot { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-top: 4px; }
  .slip .bars { height: 26px; margin-top: 6px; background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 3px, var(--ink) 3px 5px, transparent 5px 6px, var(--ink) 6px 7px, transparent 7px 10px); opacity: .75; }

  /* ---------- Teachers ---------- */
  .tgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tc { display: grid; gap: 9px; }
  .tc .top-r { display: flex; gap: 10px; align-items: center; }
  .tc .cc-av { width: 46px; height: 46px; font-size: 14px; }
  .tc h3 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
  .tc .m { font-size: 11.5px; color: var(--muted); }
  .tc .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tc .nums div { padding: 7px 9px; border-radius: 10px; background: var(--card-2); }
  .tc .nums small { display: block; font-size: 10.5px; color: var(--muted); }
  .tc .nums b { font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .tc .bt { display: flex; gap: 6px; flex-wrap: wrap; }
  .tc .acts2 { display: flex; gap: 6px; }
  .tc .acts2 .btn { flex: 1; }
  .addcard { display: grid; place-content: center; justify-items: center; gap: 6px; min-height: 200px; border: 2px dashed var(--line-2); border-radius: var(--radius); background: transparent; color: var(--muted); font-weight: 650; transition: border-color .2s, color .2s; }
  .addcard:hover { border-color: var(--blue); color: var(--blue); }
  .addcard .ic { width: 26px; height: 26px; }

  /* ---------- Messages ---------- */
  .msgs { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) minmax(0, 3fr); gap: 14px; height: max(560px, calc(100vh - 168px)); }
  .msgs > .card { display: flex; flex-direction: column; min-height: 0; }
  .msgs .cc-search { flex: none; max-width: none; }
  .threads { list-style: none; margin: 8px -6px 0; padding: 0 6px; overflow: auto; flex: 1; display: grid; align-content: start; gap: 2px; }
  .th { display: flex; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; position: relative; }
  .th:hover { background: var(--card-2); }
  .th[aria-pressed="true"] { background: var(--blue-t); }
  .th .tx { min-width: 0; flex: 1; }
  .th .tx b { font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .th .tx b span { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .th .tx small { display: block; color: var(--muted); font-size: 11px; }
  .th .tx p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th.unread .tx p { color: var(--ink); font-weight: 650; }
  .th.unread::after { content: ""; position: absolute; right: 10px; bottom: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--mari); }
  .th.new { animation: feedIn .6s both; }
  .conv { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px; }
  .bub { max-width: 82%; padding: 9px 12px; border-radius: 14px 14px 14px 4px; background: var(--card-2); font-size: 12.5px; line-height: 1.45; animation: ccRise .35s both; }
  .bub.me { margin-left: auto; border-radius: 14px 14px 4px 14px; background: var(--blue); color: var(--accent-ink); }
  .bub small { display: block; font-size: 10px; opacity: .7; margin-top: 3px; }
  .day-sep { align-self: center; font-size: 10.5px; color: var(--muted); padding: 2px 10px; border-radius: 99px; background: var(--card-2); }
  .compose { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
  .compose textarea { width: 100%; min-height: 58px; max-height: 140px; resize: vertical; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2); font-size: 12.5px; }
  .compose textarea:focus { outline: none; border-color: var(--blue); }
  .quick { display: flex; gap: 5px; flex-wrap: wrap; }
  .quick button { min-height: 26px; padding: 0 10px; border-radius: 999px; border: 1px dashed var(--line-2); background: transparent; font-size: 11px; color: var(--ink-2); }
  .quick button:hover { border-color: var(--blue); color: var(--blue); }

  /* ---------- Results ---------- */
  .hero { padding: 0; overflow: hidden; color: #fff; min-height: 220px; isolation: isolate; display: grid; grid-template-columns: 1.1fr 1fr; }
  .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(12,18,36,.92) 30%, rgba(12,18,36,.55)); }
  .hero .l { padding: 20px 22px; display: grid; align-content: center; gap: 6px; }
  .hero .l small { font-size: 11.5px; opacity: .8; }
  .hero .l .big { font-size: 46px; font-weight: 760; letter-spacing: -.04em; line-height: 1; }
  .hero .l .big em { font-style: normal; font-size: 16px; font-weight: 600; letter-spacing: 0; opacity: .85; margin-left: 6px; }
  .hero .hs { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; }
  .hero .hs b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .hero .hs span { font-size: 11px; opacity: .75; }
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 10px; padding: 16px 22px 0; }
  .pod { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .pod .cc-av { width: 46px; height: 46px; font-size: 14px; border: 2px solid rgba(255,255,255,.7); }
  .pod b { font-size: 12.5px; line-height: 1.2; }
  .pod small { font-size: 10.5px; opacity: .8; }
  .pod .step { width: 100%; border-radius: 10px 10px 0 0; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-bottom: 0; display: grid; place-items: center; font-size: 20px; font-weight: 800; transform-origin: bottom; animation: ccGrow .8s cubic-bezier(.2,.9,.3,1.1) both; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .pod .medal { width: 30px; height: 30px; margin-bottom: -4px; }

  /* ---------- Settings drawer ---------- */
  .set-sec { padding: 12px 0; border-top: 1px solid var(--line); }
  .set-sec:first-child { border-top: 0; padding-top: 0; }
  .set-sec h3 { margin: 0 0 8px; font-size: 13px; }
  .notes li { align-items: flex-start; }
  .notes .unread b::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--mari); vertical-align: 1px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sheet-grid a, .sheet-grid button { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 650; }
  .sheet-grid [aria-current="page"] { background: var(--blue); color: var(--accent-ink); }
  .sheet-grid .ic { width: 20px; height: 20px; }

  /* ---------- Responsive ---------- */
  /* the top bar is measured with a wide fallback font: icons go first, then the brand line, then labels */
  @media (max-width: 1600px) { .nav a .ic { display: none; } .nav a { padding: 7px 11px; } }
  @media (max-width: 1380px) { .brand small { display: none; } .nav a { padding: 7px 10px; } }
  @media (max-width: 1240px) {
    .pill-btn span { display: none; } .pill-btn { width: 38px; padding: 0; justify-content: center; }
    .tools .me { display: none; }
    .c3.photo { min-height: 300px; }
    .band b { font-size: 20px; }
    .msgs { grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); }
    .msgs > .ctx { display: none; }
  }
  @media (max-width: 1120px) {
    .nav a { padding: 7px 8px; font-size: 12px; }
    .c3, .c4, .c5 { grid-column: span 6; } .c6, .c7, .c8, .c9 { grid-column: span 12; }
    .tgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .band { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .band > div:nth-child(4) { border-left: 0; }
    .band > div:nth-child(n+4) { border-top: 1px dashed var(--line-2); }
  }
  /* below 1100 px the nav pill no longer fits: it becomes a bottom bar with a "More" sheet */
  @media (max-width: 1100px) {
    .nav, .tools .pill-btn, .tools .me { display: none; }
    .tools { margin-left: auto; }
    main { padding-bottom: 96px; }
    .bbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 45; left: 10px; right: 10px; bottom: 10px; height: 62px; padding: 6px; border-radius: 22px; background: var(--nav-bg); border: 1px solid var(--line); box-shadow: 0 18px 40px -16px rgba(0,0,0,.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .bbar a, .bbar button { display: grid; place-items: center; align-content: center; gap: 2px; border: 0; background: none; border-radius: 16px; color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 650; position: relative; }
    .bbar .ic { width: 20px; height: 20px; }
    .bbar [aria-current="page"] { color: var(--blue); background: var(--blue-t); }
    .bbar .badge { top: 2px; right: calc(50% - 20px); }
  }
  @media (max-width: 1100px) and (min-width: 701px) { .bbar { left: 50%; right: auto; width: 520px; margin-left: -260px; } }
  @media (max-width: 900px) {
    .top { padding: 10px 14px; }
    main { padding: 2px 14px 96px; }
    .g { gap: 12px; }
    .c2, .c3, .c4, .c5, .c6, .c7, .c8, .c9, .c12 { grid-column: span 12; }
    .msgs { grid-template-columns: 1fr; height: auto; }

    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Bar chart")}" class="cc-chart${again ? " cc-static" : ""}">`;
    s += sc.ticks.map((t) => `<g class="cc-grid"><line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${P.l - 7}" y="${Y(t) + 4}" text-anchor="end">${esc(f(t))}</text></g>`).join("");
    for (let i = 0; i < n; i++) {
      const x0 = P.l + band * i + (band - gw) / 2;
      S.forEach((x, k) => {
        const v = x.data[i] || 0, y = Y(v), h = Math.max(0, Y(0) - y);
        const rr = Math.min(5, bw / 2, h / 2);
        s += `<rect class="cc-bar" x="${(x0 + bw * k).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw - (S.length > 1 ? 2 : 0)).toFixed(1)}" height="${h.toFixed(1)}" rx="${rr}" style="fill:${(x.colors && x.colors[i]) || x.color};animation-delay:${i * 40 + k * 60}ms"/>`;
      });
      s += `<text x="${(x0 + gw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
      s += `<rect class="cc-hit" data-i="${i}" x="${P.l + band * i}" y="${P.t}" width="${band}" height="${ih}" fill="transparent"/>`;
    }
    s += `<line class="cc-zero" x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}"/></svg>`;
    el.innerHTML = s + legendHTML(S);
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => {
      const h = e.target.closest(".cc-hit"); if (!h) return tip.hide();
      const i = +h.dataset.i;
      $$(".cc-hit", svg).forEach((x) => x.classList.toggle("on", x === h));
      tip.show(e, `<b>${esc(o.labels[i])}</b>` + S.map((x) => `<div><i style="background:${(x.colors && x.colors[i]) || x.color}"></i>${esc(x.name)}<em>${esc((o.tipFmt || f)(x.data[i] || 0))}</em></div>`).join(""));
    });
    svg.addEventListener("pointerleave", () => { tip.hide(); $$(".cc-hit", svg).forEach((x) => x.classList.remove("on")); });
  });
}

/* Donut that sweeps in. o = {items:[{label,value,color}], size, thick, fmt, center:[big, small]} */
function donut(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, D = o.size || 150, T = o.thick || 18, r = (D - T) / 2 - 3, C = 2 * Math.PI * r;
    const items = o.items.filter((x) => x.value > 0), tot = sum(items.map((x) => x.value)), f = o.fmt || ((v) => num(v));
    let acc = 0;
    const segs = items.map((x) => { const len = tot ? (x.value / tot) * C : 0, s0 = acc; acc += len; return { ...x, len, s0 }; });
    const gap = items.length > 1 ? Math.min(3, C * 0.006) : 0;
    let s = `<div class="cc-donut-wrap"><div class="cc-donut" style="width:${D}px;height:${D}px"><svg viewBox="0 0 ${D} ${D}" width="${D}" height="${D}" role="img" aria-label="${esc(o.aria || "Donut chart")}"><circle class="cc-track" cx="${D / 2}" cy="${D / 2}" r="${r}" style="stroke-width:${T}"/>`;
    s += segs.map((x, i) => `<circle class="cc-seg" data-i="${i}" cx="${D / 2}" cy="${D / 2}" r="${r}" transform="rotate(-90 ${D / 2} ${D / 2})" style="stroke:${x.color};stroke-width:${T}" stroke-dasharray="0 ${C}" stroke-dashoffset="${-x.s0}"/>`).join("");
    s += `</svg><div class="cc-donut-c">${o.center ? `<b>${esc(o.center[0])}</b><small>${esc(o.center[1] || "")}</small>` : ""}</div></div>`;
    s += `<ul class="cc-dlegend">${segs.map((x, i) => `<li data-i="${i}"><i style="background:${x.color}"></i><span>${esc(x.label)}</span><em>${esc(f(x.value))}</em><small>${tot ? Math.round((x.value / tot) * 100) : 0}%</small></li>`).join("")}</ul>`;
    el.innerHTML = s + "</div>";
    const cs = $$(".cc-seg", el);
    const setT = (t) => cs.forEach((c, i) => c.setAttribute("stroke-dasharray", `${Math.max(0, segs[i].len * t - gap)} ${C}`));
    if (again) setT(1); else tween(1000, setT);
    const hl = (i, e) => {
      cs.forEach((c, k) => c.classList.toggle("dim", i != null && k !== i));
      $$(".cc-dlegend li", el).forEach((li, k) => li.classList.toggle("on", k === i));
      if (i != null && e) tip.show(e, `<b>${esc(segs[i].label)}</b><div><i style="background:${segs[i].color}"></i>${esc(f(segs[i].value))}<em>${Math.round((segs[i].value / tot) * 100)}%</em></div>`);
    };
    el.onpointermove = (e) => { const t = e.target.closest("[data-i]"); if (t) hl(+t.dataset.i, e); else { hl(null); tip.hide(); } };
    el.onpointerleave = () => { hl(null); tip.hide(); };
  });
}

/* Heatmap grid. o = {rows, cols, data:[[v]], color, fmt, cell, padL} */
function heatmap(el, o) {
  if (!el) return;
  el._o = o;
  chart(el, (again) => {
    const o = el._o, W = Math.max(260, el.clientWidth || 640), L = o.padL || 40, T = 18;
    const cw = (W - L) / o.cols.length, ch = o.cell || Math.min(26, cw);
    const H = T + ch * o.rows.length + 4, all = o.data.flat(), hi = Math.max(...all, 1), f = o.fmt || num;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || "Heatmap")}" class="cc-chart${again ? " cc-static" : ""}">`;
    const every_ = Math.max(1, Math.ceil(o.cols.length / Math.floor((W - L) / 30)));
    s += o.cols.map((c, j) => (j % every_ === 0 ? `<text x="${L + cw * j + cw / 2}" y="12" text-anchor="middle">${esc(c)}</text>` : "")).join("");
    o.rows.forEach((rw, i) => {
      s += `<text x="${L - 8}" y="${T + ch * i + ch / 2 + 4}" text-anchor="end">${esc(rw)}</text>`;
      o.cols.forEach((c, j) => { const v = o.data[i][j] || 0; s += `<rect class="cc-cell" data-r="${i}" data-c="${j}" x="${(L + cw * j + 1.5).toFixed(1)}" y="${T + ch * i + 1.5}" width="${Math.max(1, cw - 3).toFixed(1)}" height="${Math.max(1, ch - 3)}" rx="${Math.max(0, Math.min(5, ch / 4))}" style="fill:${v ? o.color : "var(--card-2)"};fill-opacity:${v ? (0.2 + (v / hi) * 0.8).toFixed(2) : 1};animation-delay:${(i + j) * 14}ms"/>`; });
    });
    el.innerHTML = s + "</svg>";
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => { const c = e.target.closest(".cc-cell"); if (!c) return tip.hide(); tip.show(e, `<b>${esc(o.rows[+c.dataset.r])} · ${esc(o.cols[+c.dataset.c])}</b><div>${esc(f(o.data[+c.dataset.r][+c.dataset.c]))}</div>`); });
    svg.addEventListener("pointerleave", () => tip.hide());
  });
}

/* last n session dates (ISO) of a batch, up to a day */
function sessionsOf(bid, n, upto = WORK) {
  const days = batchDays(bid), out = [];
  for (let d = new Date(upto), g = 0; out.length < n && g < 200; d = addDays(d, -1), g++) if (days.includes(d.getDay())) out.unshift(iso(d));

/* ---------- Attendance: deterministic marks for past evenings ---------- */
function genMark(st, d) {
  const g = seeded(hashStr(st.id + d)), a = g(), b = g();
  if (a < st.at) return b < 0.07 ? "L" : "P";
  return b < 0.32 ? "V" : "A";
}
/* fill every past session (and, on the first run, tonight's earlier batches) so the register never shows gaps */
function fillAttendance(firstRun) {
  const now = nowMin();
  for (const b of S.batches) {
    const recs = (S.att[b.id] = S.att[b.id] || {});
    const ses = sessionsOf(b.id, 40);
    for (const d of ses) {
      const tonight = d === WORK_ISO;
      if (recs[d]) continue;
      if (tonight) {
        /* first run only: registers of batches that started at least 15 minutes ago, except the newest one */
        if (!firstRun || !isLive) continue;
        const st = batchStart(b.id, WORK.getDay());
        if (st > now - 15) continue;
        const later = S.batches.some((o) => o.id !== b.id && batchStart(o.id, WORK.getDay()) > st && batchStart(o.id, WORK.getDay()) <= now - 15);
        if (!later) continue;
      }
      const r = {};
      for (const s of studentsOf(b.id)) if (s.joined <= d) r[s.id] = genMark(s, d);
      recs[d] = r;
    }
  }
}

    const top = new Set(order.slice(0, 3).map((r) => r.s.id));
    const D = (ms) => (again ? 0 : ms);
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(t.subject + " " + t.title)}: class average ${av.toFixed(1)} out of ${t.total}">`;
    [0, 0.5, 1].forEach((f) => (s += `<text x="${P.l - 7}" y="${Y(f * t.total) + 4}" text-anchor="end">${num(f * t.total)}</text>`));
    s += `<path class="ch-pass" d="M${P.l + 2} ${Y(0.33 * t.total).toFixed(1)} H${W - P.r}"/>`;
    s += `<g filter="url(#chalky)"><path class="ch-axis${again ? "" : " ch-draw"}" pathLength="1" d="M${P.l} ${P.t - 8} Q${P.l - 1.5} ${P.t + ih / 2} ${P.l} ${P.t + ih} T${W - P.r} ${P.t + ih + 1}"/>`;
    rows.forEach((r, i) => {
      if (r.v == null) return;
      const x = P.l + band * i + (band - bw) / 2, y = Y(r.v), h = Math.max(1.5, P.t + ih - y);
      const kind = top.has(r.s.id) ? "M" : r.v / t.total < 0.33 ? "R" : "W";
      const stroke = kind === "M" ? "#f4b545" : kind === "R" ? "#ff9e93" : "var(--chalk)";
      s += `<g class="ch-bar" style="animation-delay:${D(i * 34)}ms"><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="url(#hatch${kind})"/><path class="${again ? "" : "ch-draw"}" pathLength="1" style="stroke:${stroke};animation-delay:${D(i * 34 + 420)}ms" d="M${x.toFixed(1)} ${(y + h).toFixed(1)}V${y.toFixed(1)}H${(x + bw).toFixed(1)}V${(y + h).toFixed(1)}" fill="none" stroke-width="1.7" stroke-linejoin="round"/></g>`;
    });
    s += `</g>`;
    s += `<path class="ch-avg" style="animation-delay:${D(n * 34 + 600)}ms" d="M${P.l + 2} ${Y(av).toFixed(1)} H${W - P.r}"/><text x="${W - P.r}" y="${(Y(av) - 6).toFixed(1)}" text-anchor="end" style="fill:#f4b545;font-weight:700;animation:ccFade .5s ${D(n * 34 + 700)}ms both">avg ${av.toFixed(1)}</text>`;
    if (band >= 15) rows.forEach((r, i) => { if (r.v == null) { s += `<text x="${(P.l + band * i + band / 2).toFixed(1)}" y="${P.t + ih - 4}" text-anchor="middle" style="font-size:9px">ab</text>`; return; } s += `<text class="val" x="${(P.l + band * i + band / 2).toFixed(1)}" y="${(Y(r.v) - 5).toFixed(1)}" text-anchor="middle" style="animation-delay:${D(i * 34 + 600)}ms">${r.v}</text>`; });
    if (!o.mini && band >= 17) rows.forEach((r, i) => (s += `<text x="${(P.l + band * i + band / 2).toFixed(1)}" y="${H - 11}" text-anchor="middle" style="font-size:9.5px">${i + 1}</text>`));
    rows.forEach((r, i) => (s += `<rect class="ch-hit" data-i="${i}" x="${(P.l + band * i).toFixed(1)}" y="${P.t}" width="${band.toFixed(1)}" height="${ih}"/>`));
    el.innerHTML = `<div class="board${o.mini ? " mini" : ""}">${head}${s}</svg>${tray}</div>`;
    const svg = $("svg", el);
    svg.addEventListener("pointermove", (e) => {
      const hh = e.target.closest(".ch-hit"); if (!hh) return tip.hide();
      const r = rows[+hh.dataset.i];
      tip.show(e, `<b>${esc(r.s.name)}</b><div>${r.v == null ? "Absent on test day" : `${r.v} / ${t.total}<em>${Math.round((r.v / t.total) * 100)}% · ${grade((r.v / t.total) * 100)}</em>`}</div>`);
    });
    svg.addEventListener("pointerleave", () => tip.hide());
  });
}

async function delStudent(s) {

function threadList() {

function thLi(th, isNew) {

  if (HEAVY.includes(name) && changed && !RM) { clearHandlers(view); view.innerHTML = skeletonHTML(); setTimeout(draw, 380); } else draw();
}
/* redraw the current page in place after a change (no entrance, numbers jump straight to their value) */
function rerender() {
  if (!CUR) return;
  const view = $("#view"), y = scrollY;
  renderTok++;
  clearHandlers(view);
  PAGE_FN[CUR](view);
  $$("[data-to]", view).forEach((el) => { el.textContent = (FMT[el.dataset.f || "num"] || FMT.num)(+el.dataset.to); el.dataset.v = el.dataset.to; });
  window.scrollTo(0, y);
}

/* ---------- Boot ---------- */
function ensureMonth() {
  const cur = mkey(TODAY);
  if (!S.vouchers.some((v) => v.month === cur)) {
    const day = TODAY.getDate(), chance = day >= S.set.dueDay ? 0.66 : 0.12 + (day / S.set.dueDay) * 0.4;
    for (const s of S.students) { const v = makeVoucher(s, cur, chance); if (v) S.vouchers.push(v); }
  }
  S.pay[cur] = S.pay[cur] || {};
}
function boot() {
  const saved = store.get(KEY, null);
  if (saved && saved.v === 1 && Array.isArray(saved.students) && saved.set) { S = saved; fillAttendance(false); ensureMonth(); save(); }
  else seed();
  buildShell();
  initShell();
  startRouter(PAGES.map((p) => p[0]), "today", render);
  every(10000, tickToday);
  every(6500, deskTick);
  every(17000, incoming);
}
boot();
