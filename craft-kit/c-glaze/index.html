<!doctype html>
<!-- Chill and Craft · Glaze · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glaze · frosted glass code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #eef2ff;
    --blob-1: #ff9ecf;
    --blob-2: #7cc6ff;
    --blob-3: #ffd479;
    --glass: rgba(255, 255, 255, .38);
    --glass-line: rgba(255, 255, 255, .75);
    --cell: rgba(255, 255, 255, .45);
    --ink: #14213d;
    --muted: #4a5878;
    --mint-bg: rgba(140, 245, 205, .85);
    --mint-line: #34c79a;
    --mint-ink: #064e3b;
    --rose-bg: rgba(255, 196, 214, .9);
    --rose-line: #e2557f;
    --ring: #2563eb;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #0a0d1a;
    --blob-1: #8b3fe4;
    --blob-2: #0e7490;
    --blob-3: #be185d;
    --glass: rgba(22, 26, 46, .45);
    --glass-line: rgba(255, 255, 255, .16);
    --cell: rgba(255, 255, 255, .07);
    --ink: #eef2ff;
    --muted: #aab4d4;
    --mint-bg: rgba(52, 211, 153, .32);
    --mint-line: #6ee7b7;
    --mint-ink: #d1fae5;
    --rose-bg: rgba(244, 63, 94, .3);
    --rose-line: #fb7185;
    --ring: #93c5fd;
  }

  /* ---------- Page with soft colour blobs behind the glass ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    color: var(--ink);
    background: var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .blobs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute;
    width: 46vmax;
    height: 46vmax;
    border-radius: 50%;
    filter: blur(50px);
    opacity: .75;
    animation: drift 16s ease-in-out infinite alternate;
  }
  .blob.a { background: var(--blob-1); top: -18vmax; left: -12vmax; }
  .blob.b { background: var(--blob-2); bottom: -20vmax; right: -14vmax; animation-delay: -5s; }
  .blob.c { background: var(--blob-3); top: 30%; left: 45%; width: 26vmax; height: 26vmax; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }

  /* ---------- The glass card ---------- */
  .glass {
    position: relative;
    width: min(100%, 400px);
    padding: 26px 20px 24px;
    border-radius: 28px;
    text-align: center;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    backdrop-filter: blur(22px) saturate(1.5);
    box-shadow: 0 24px 50px -24px rgba(20, 30, 70, .45), inset 0 1px 0 rgba(255, 255, 255, .5);
  }
  .badge {
    position: relative;
    width: 56px;
    height: 56px;
    margin: 0 auto 12px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: var(--cell);
    border: 1px solid var(--glass-line);
    transition: background .4s, transform .5s cubic-bezier(.3, 1.6, .5, 1);
  }
  .badge svg { position: absolute; width: 26px; height: 26px; transition: opacity .3s, transform .4s; }
  .badge .tick { opacity: 0; transform: scale(.3); }
  .glass.done .badge { background: var(--mint-bg); border-color: var(--mint-line); transform: rotate(-8deg) scale(1.08); }
  .glass.done .badge .lock { opacity: 0; transform: scale(.3); }
  .glass.done .badge .tick { opacity: 1; transform: none; }

  h1 { margin: 0 0 6px; font-size: clamp(20px, 5.4vw, 24px); }
  .sub { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }

  /* ---------- Glass cells that flip to mint ---------- */
  .cells { display: flex; justify-content: center; gap: clamp(8px, 3vw, 14px); margin: 24px 0 8px; perspective: 600px; }
  .cells input {
    width: clamp(52px, 15vw, 62px);
    height: 66px;
    padding: 0;
    border: 1px solid var(--glass-line);
    border-radius: 16px;
    background: var(--cell);
    color: var(--ink);
    -webkit-text-fill-color: var(--ink);
    caret-color: var(--ring);
    text-align: center;
    font: 650 28px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 6px 16px -10px rgba(20, 30, 70, .5);
    transition: background .25s, border-color .25s, box-shadow .2s;
  }
  .cells input:focus { outline: none; box-shadow: 0 0 0 3px var(--ring), inset 0 1px 0 rgba(255, 255, 255, .55); }
  .cells input:disabled { opacity: 1; }
  .cells input { transition: background .25s, border-color .25s, box-shadow .2s, transform .35s cubic-bezier(.34, 1.56, .64, 1); }
  .cells input:hover:not(:focus):not(:disabled) { transform: translateY(-3px); border-color: var(--ring); }
  .cells input.mint {
    background: var(--mint-bg);
    border-color: var(--mint-line);
    color: var(--mint-ink);
    -webkit-text-fill-color: var(--mint-ink);
    animation: flipMint .6s cubic-bezier(.34, 1.3, .64, 1), ripple .8s ease-out;
  }
  @keyframes ripple {
    from { box-shadow: 0 0 0 0 var(--mint-line); }
    to { box-shadow: 0 0 0 16px transparent; }
  }
  @keyframes flipMint {
    0% { transform: rotateX(0); background: var(--cell); }
    49.9% { transform: rotateX(90deg); background: var(--cell); }
    50% { transform: rotateX(-90deg); background: var(--mint-bg); }
    100% { transform: rotateX(0); background: var(--mint-bg); }
  }
  /* Right code: a wave runs through the cells */
  .glass.done .cells input { animation: wave .7s cubic-bezier(.34, 1.56, .64, 1); animation-delay: calc(var(--i) * .09s); }
  @keyframes wave { 40% { transform: translateY(-14px) rotateX(25deg) scale(1.06); } }
  /* A light sweep across the glass and a ring around the badge */
  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .5) 50%, transparent 58%) 100% 0 / 300% 100% no-repeat;
    opacity: 0;
    pointer-events: none;
  }
  .glass.done::after { animation: sheen 1.1s ease .35s; }
  @keyframes sheen { from { opacity: 1; background-position: 100% 0; } to { opacity: .2; background-position: 0 0; } }
  .badge::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 20px;
    border: 2px solid var(--mint-line);
    opacity: 0;
  }
  .glass.done .badge::after { animation: badgeRing .9s ease-out .2s; }
  @keyframes badgeRing { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(2.2); } }
  /* Wrong code: cells turn rose and shake */
  .glass.wrong .cells input {
    background: var(--rose-bg);
    border-color: var(--rose-line);
    animation: nope .45s ease;
  }
  @keyframes nope {
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  /* ---------- Status, hint and buttons ---------- */
  .status { min-height: 22px; margin: 14px 0 4px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--mint-line); }
  [data-theme="light"] .status[data-tone="good"] { color: #047857; }
  .status[data-tone="bad"] { color: var(--rose-line); }
  .hint { margin: 6px 0 16px; font-size: 14px; color: var(--muted); }
  .hint b {
    margin-left: 6px;
    padding: 4px 12px;
    border-radius: 10px;
    background: var(--cell);
    border: 1px solid var(--glass-line);
    color: var(--ink);
    letter-spacing: .3em;
  }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 14px;
    cursor: pointer;
    color: var(--ink);
  }
  .ghost { background: var(--cell); border: 1px solid var(--glass-line); }
  .ghost:disabled { opacity: .55; cursor: default; }
  .solid { background: var(--mint-bg); border: 1px solid var(--mint-line); color: var(--mint-ink); }
  button:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, background .2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px -12px rgba(20, 30, 70, .6); }
  button:active:not(:disabled) { transform: scale(.94); box-shadow: none; transition-duration: .08s; }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Celebration particles: rising glass bubbles ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    border-radius: 50%;
    border: 1.5px solid var(--mint-line);
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .9), var(--mint-bg) 45%, transparent 70%);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    .blob { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
  </div>

  <main class="glass" id="glass">
    <div class="badge" aria-hidden="true">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg>
      <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="var(--mint-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="title">Verification code</h1>
    <p class="sub">Type the 4 digits we just sent to bilal.q@…</p>

    <!-- Four glass cells, each one a real input -->
    <div class="cells" id="cells" role="group" aria-labelledby="title" aria-describedby="hint">
      <input style="--i:0" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 4">
      <input style="--i:1" inputmode="numeric" autocomplete="off" aria-label="Digit 2 of 4">
      <input style="--i:2" inputmode="numeric" autocomplete="off" aria-label="Digit 3 of 4">
      <input style="--i:3" inputmode="numeric" autocomplete="off" aria-label="Digit 4 of 4">
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Demo code<b id="demo"></b></p>
    <div class="actions">
      <button type="button" class="ghost" id="resend">Send a new code</button>
      <button type="button" class="solid" id="again" hidden>Start over</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const glass = document.getElementById("glass");
  const boxes = Array.from(document.querySelectorAll("#cells input"));
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");
  let demo = "";
  let busy = false;

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo;
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    statusEl.classList.remove("pop");
    void statusEl.offsetWidth;        // reflow so the animation plays again
    statusEl.classList.add("pop");
  }

  // ---- Celebration: mint bubbles float up from every cell ----
  const fx = document.getElementById("fx");
  function bubbles() {
    if (reduce) return;
    boxes.forEach((box, k) => {
      const r = box.getBoundingClientRect();
      for (let n = 0; n < 9; n++) {
        const p = document.createElement("i");
        const s = 8 + Math.random() * 18;
        const x0 = r.left + Math.random() * r.width - s / 2;
        const y0 = r.top + r.height / 2 - s / 2;
        const rise = 120 + Math.random() * 180;
        const sway = (Math.random() - 0.5) * 70;
        p.style.width = p.style.height = s + "px";
        fx.append(p);
        p.animate([
          { transform: "translate(" + x0 + "px," + y0 + "px) scale(.2)", opacity: 0 },
          { transform: "translate(" + (x0 + sway) + "px," + (y0 - rise * 0.5) + "px) scale(1)", opacity: 1, offset: 0.3 },
          { transform: "translate(" + (x0 - sway * 0.5) + "px," + (y0 - rise) + "px) scale(1.15)", opacity: 0 }
        ], { duration: 1500 + Math.random() * 900, delay: k * 90 + Math.random() * 250, easing: "cubic-bezier(.3, .6, .4, 1)", fill: "backwards" }).onfinish = () => p.remove();
      }
    });
  }
  function setDigit(i, d) {
    const box = boxes[i];
    const wasFilled = vals[i] !== "";
    vals[i] = d;
    box.value = d;
    if (!d) box.classList.remove("mint");
    else if (!wasFilled) box.classList.add("mint");   // flip to mint only when it fills up
    if (d) boxes.forEach((b) => b.removeAttribute("aria-invalid"));
  }
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // ---- Check the code ----
  async function verify(code) {
    busy = true;
    setLocked(true);
    say("Checking…");
    await wait(700);

    if (code === demo) {
      // Stage 1: a wave runs through the cells. Stage 2: the lock badge turns
      // into a check with a ring. Stage 3: light sweeps the glass and bubbles rise.
      glass.classList.add("done");
      say("Verified! Your account is confirmed.", "good");
      await wait(300);
      bubbles();
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      glass.classList.add("wrong");
      say("Not quite. That code is incorrect.", "bad");
      await wait(750);
      glass.classList.remove("wrong");
      clearAll();
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", () => {
    glass.classList.remove("done");
    againBtn.hidden = true;
    clearAll();
    newCode();
    busy = false;
    setLocked(false);
    say("Ready for a new code.");
    focusBox(0);
  });

  let cooldown = 0;
  resendBtn.addEventListener("click", () => {
    if (busy || cooldown) return;
    newCode();
    clearAll();
    say("New code sent.");
    focusBox(0);
    cooldown = 15;
    resendBtn.disabled = true;
    resendBtn.textContent = "Send again in 15s";
    const tick = setInterval(() => {
      cooldown--;
      resendBtn.textContent = cooldown ? "Send again in " + cooldown + "s" : "Send a new code";
      if (!cooldown) { clearInterval(tick); resendBtn.disabled = false; }
    }, 1000);
  });

  newCode();
})();
</script>
</body>
</html>
