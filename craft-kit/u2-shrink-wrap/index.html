<script>

  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();

<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --bg1: #eef4fc;
    --bg2: #c9d8ec;
    --card: #ffffff;
    --edge: #dfe7f3;
    --ink: #0f1b2d;
    --soft: #5b6b82;
    --well: #f3f7fc;
    --accent: #2f6bff;
    --accent2: #1d4fd6;
    --heat: #ff5a36;
    --plastic: rgba(160, 205, 255, .3);
    --plastic-edge: rgba(90, 150, 235, .75);
    --steel1: #c7d0dc;
    --steel2: #8793a3;
    --ok: #12a36b;
    --focus: #2563eb;
    --shadow: 0 34px 70px -40px rgba(20, 50, 110, .55);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #121d31; --bg2: #03060c; --card: #0f1828; --edge: #1f2c44; --ink: #e8f0ff; --soft: #93a3bd; --well: #142036;
      --accent: #6b9bff; --accent2: #3f74f0; --plastic: rgba(130, 180, 255, .16); --plastic-edge: rgba(140, 190, 255, .6);
      --steel1: #5a6678; --steel2: #2f3846; --ok: #3ccf8e; --focus: #93c5fd; --shadow: 0 34px 70px -40px rgba(0, 0, 0, .95);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #121d31; --bg2: #03060c; --card: #0f1828; --edge: #1f2c44; --ink: #e8f0ff; --soft: #93a3bd; --well: #142036;
    --accent: #6b9bff; --accent2: #3f74f0; --plastic: rgba(130, 180, 255, .16); --plastic-edge: rgba(140, 190, 255, .6);
    --steel1: #5a6678; --steel2: #2f3846; --ok: #3ccf8e; --focus: #93c5fd; --shadow: 0 34px 70px -40px rgba(0, 0, 0, .95);
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr);
    color: var(--ink);
    background: radial-gradient(70% 60% at 80% 10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2) 92%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { width: 100%; padding: 20px 16px; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
  .card { position: relative; width: 720px; max-width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; padding: 18px; border-radius: 26px; background: var(--card); border: 1px solid var(--edge); box-shadow: var(--shadow); }
  .card.drop-on { box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 40%, transparent); }
  .head h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .head p { margin: 2px 0 10px; font-size: 12.5px; color: var(--soft); }

  /* ---------- File list ---------- */
  .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; max-height: 230px; overflow-y: auto; scrollbar-width: thin; }
  .item { position: relative; display: grid; grid-template-columns: 22px 30px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 8px; border-radius: 12px; background: var(--well); border: 1px solid var(--edge); cursor: pointer; transition: opacity .25s, transform .35s var(--spring); }
  .item:hover { transform: translateX(2px); }
  .item.off { opacity: .5; }
  .item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--edge); background: var(--card); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .35s var(--spring); }
  .box svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s; }
  .item input:checked + .box { background: var(--accent); border-color: var(--accent); transform: scale(1.05); }
  .item input:checked + .box svg { stroke-dashoffset: 0; }
  .item input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ext { height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 8.5px; font-weight: 900; letter-spacing: .04em; color: #fff; background: var(--c); }
  .nm { min-width: 0; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sz { font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .row2 { display: flex; gap: 8px; margin-top: 10px; }
  .namefield { flex: 1; min-width: 0; display: flex; align-items: center; height: 42px; padding: 0 12px; border-radius: 12px; background: var(--well); border: 1px solid var(--edge); }
  .namefield:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
  .namefield label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin-right: 8px; }
  .namefield input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; font-weight: 650; outline: none; }
  .namefield span { color: var(--soft); font-weight: 700; font-size: 14px; }
  .btn { height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--edge); background: var(--well); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 750; cursor: pointer; white-space: nowrap; transition: transform .35s var(--spring), filter .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(.95); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .pack { position: relative; width: 100%; height: 52px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 15px; color: #fff; font-size: 15px; overflow: hidden; background: linear-gradient(180deg, var(--accent), var(--accent2)); box-shadow: 0 16px 26px -16px var(--accent2), inset 0 1px 0 rgba(255, 255, 255, .3); }
  .pack svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .pack[aria-disabled="true"] { filter: grayscale(.8); opacity: .6; cursor: not-allowed; transform: none; }
  .pack[data-state="working"], .pack[data-state="done"] { cursor: progress; filter: none; opacity: 1; }
  .pack[data-state="done"] { background: linear-gradient(180deg, #34d399, #0f9a62); box-shadow: 0 16px 26px -16px #0f9a62; }
  .pack .lbl { overflow: hidden; text-overflow: ellipsis; }
  .readout { margin: 8px 2px 0; min-height: 34px; font-size: 12px; line-height: 1.45; color: var(--soft); font-variant-numeric: tabular-nums; }
  .readout code { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); }

  /* ---------- Vacuum scene ---------- */
  .scene { position: relative; border-radius: 20px; background: linear-gradient(180deg, var(--well), color-mix(in srgb, var(--edge) 60%, var(--well))); border: 1px solid var(--edge); overflow: hidden; min-height: 330px; display: grid; place-items: center; }
  .scene svg { width: 100%; max-width: 270px; height: auto; display: block; overflow: visible; }
  .bag { fill: var(--plastic); stroke: var(--plastic-edge); stroke-width: 1.6; }
  .mouth.back { fill: color-mix(in srgb, var(--plastic-edge) 22%, transparent); }
  .mouth.front { fill: none; stroke: var(--plastic-edge); stroke-width: 1.6; }
  .crinkle { fill: none; stroke: rgba(255, 255, 255, .8); stroke-width: 1.4; stroke-linecap: round; }
  .bottomseam { fill: none; stroke: var(--plastic-edge); stroke-width: 3; stroke-dasharray: 2 3; opacity: .8; }
  .shine { fill: none; stroke: rgba(255, 255, 255, .75); stroke-width: 4; stroke-linecap: round; opacity: .6; }
  .tile { transform-box: fill-box; transform-origin: center; transition: transform .7s var(--spring), opacity .35s; }
  .tile text { fill: #fff; font: 800 9.5px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em; }
  .seam { fill: url(#crimp); opacity: 0; }
  .barGlow { fill: var(--heat); opacity: 0; }
  .floor { fill: color-mix(in srgb, var(--ink) 12%, transparent); }
  .tag { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--edge); box-shadow: 0 12px 20px -12px rgba(0, 0, 0, .5); font-size: 12.5px; white-space: nowrap; opacity: 0; max-width: calc(100% - 24px); }
  .tag b { overflow: hidden; text-overflow: ellipsis; }
  .tag span { color: var(--soft); font-variant-numeric: tabular-nums; }
  .tag i { width: 20px; height: 20px; flex: none; border-radius: 6px; background: var(--ok); display: grid; place-items: center; }
  .tag i svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .air { fill: #fff; opacity: .9; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @keyframes hum { 50% { transform: translate(.6px, -.6px); } }
  .humming { animation: hum .07s linear infinite; }
  @keyframes breathe { 50% { transform: scale(1.012, .99); } }
  .bagwrap { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
  .tight .bagwrap { animation: none; }

  @media (max-width: 680px) {
    .card { grid-template-columns: minmax(0, 1fr); padding: 14px; gap: 12px; }
    .scene { order: -1; min-height: 228px; }
    .scene svg { max-width: 200px; margin-top: -10px; }
    .list { max-height: 214px; }
    .item { height: 36px; }
  }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" id="card" aria-labelledby="ttl">
    <div>
      <div class="head"><h1 id="ttl">Download as ZIP</h1><p>Tick the files, name the bundle, pack it.</p></div>
      <ul class="list" id="list" aria-label="Files to pack"></ul>
      <div class="row2">
        <div class="namefield"><label for="zname">Name</label><input id="zname" value="eid-orders" maxlength="40" spellcheck="false" autocomplete="off"><span>.zip</span></div>
        <button class="btn" id="addBtn" type="button">Add files</button>
      </div>
      <button class="btn pack" id="packBtn" type="button" data-state="idle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4z" /><path d="M4 8l8 4 8-4M12 12v8" /></svg>
        <span class="lbl" id="packLbl">Pack 5 files</span>
      </button>
      <p class="readout" id="readout">Builds a real ZIP on your device; nothing is sent anywhere.</p>
      <input class="sr-only" type="file" id="file" multiple tabindex="-1" aria-hidden="true">
    </div>

    <div class="scene" id="scene" aria-hidden="true">
      <svg viewBox="0 0 240 270" id="svg">
        <defs>
          <pattern id="crimp" width="6" height="12" patternUnits="userSpaceOnUse"><rect width="6" height="12" fill="#ff8a65" /><path d="M0 0l3 12 3-12" stroke="#c2410c" stroke-width="1.2" fill="none" /></pattern>
          <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter>
        </defs>
        <ellipse class="floor" cx="120" cy="252" rx="96" ry="9" />
        <g id="hose">
          <path id="hoseA" d="M250 -10C250 40 200 20 175 30" fill="none" stroke="var(--steel2)" stroke-width="9" stroke-linecap="round" />
          <path id="hoseB" d="M250 -10C250 40 200 20 175 30" fill="none" stroke="var(--steel1)" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 5" />
          <g id="nozzle"><rect x="164" y="22" width="22" height="16" rx="4" fill="var(--steel2)" /><rect x="168" y="36" width="14" height="16" rx="3" fill="var(--steel1)" /></g>
        </g>
        <g class="bagwrap" id="bagwrap">
          <ellipse class="mouth back" id="mouthBack" />
          <path class="bag" id="bag" />
          <g id="tiles"></g>
          <path class="crinkle" id="crinkle" />
          <path class="bottomseam" id="bottomSeam" />
          <path class="mouth front" id="mouthFront" />
          <path class="shine" id="shine" />
          <rect class="seam" id="seam" height="10" rx="2" />
        </g>
        <g id="air"></g>
        <g id="heater" opacity="0">
          <rect class="barGlow" id="barGlow" x="40" y="0" width="160" height="14" rx="7" filter="url(#blur)" />
          <rect x="40" y="0" width="160" height="14" rx="7" fill="var(--steel2)" />
          <rect id="barHot" x="46" y="9" width="148" height="4" rx="2" fill="var(--steel1)" />
          <rect x="112" y="-26" width="16" height="26" rx="3" fill="var(--steel2)" />
        </g>
      </svg>
      <div class="tag" id="tag"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></i><b id="tagName">eid-orders.zip</b><span id="tagSize"></span></div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
  // ---------- Shrink Wrap: a real ZIP maker with a vacuum-seal animation ----------
  const $ = (s) => document.querySelector(s);
  const card = $("#card"), list = $("#list"), zname = $("#zname"), packBtn = $("#packBtn"), packLbl = $("#packLbl"), readout = $("#readout");
  const scene = $("#scene"), bag = $("#bag"), shine = $("#shine"), tilesG = $("#tiles"), seam = $("#seam"), airG = $("#air");
  const heater = $("#heater"), barGlow = $("#barGlow"), barHot = $("#barHot"), nozzle = $("#nozzle"), hose = $("#hose"), bagwrap = $("#bagwrap");
  const tag = $("#tag"), tagName = $("#tagName"), tagSize = $("#tagSize"), fileEl = $("#file"), statusEl = $("#status");
  const SVGNS = "http://www.w3.org/2000/svg";
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const say = (t) => { statusEl.textContent = t; };
  const kb = (n) => (n < 1024 ? n + " bytes" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB");
  const MAX_TOTAL = 50 * 1048576;

  const STOP = new Error("stopped");
  let runId = 0, busy = false;
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === runId ? res() : rej(STOP)), ms));
  const guard = (id) => { if (id !== runId) throw STOP; };

  // ---------- CRC-32 and a stored (uncompressed) ZIP writer ----------
  const CRC = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  function crc32(bytes) { let c = 0xffffffff; for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  function dosTime(d) { return [(d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()]; }
  function makeZip(entries) {                      // entries: { name, bytes: Uint8Array, crc }
    const enc = new TextEncoder(), now = dosTime(new Date());
    const parts = [], central = [];
    let offset = 0;
    entries.forEach((e) => {
      const name = enc.encode(e.name);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, now[0], true); h.setUint16(12, now[1], true); h.setUint32(14, e.crc, true);
      h.setUint32(18, e.bytes.length, true); h.setUint32(22, e.bytes.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(h.buffer, name, e.bytes);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, now[0], true); c.setUint16(14, now[1], true); c.setUint32(16, e.crc, true);
      c.setUint32(20, e.bytes.length, true); c.setUint32(24, e.bytes.length, true); c.setUint16(28, name.length, true);
      c.setUint32(42, offset, true);
      central.push(c.buffer, name);
      offset += 30 + name.length + e.bytes.length;
    });
    const cdSize = central.reduce((s, b) => s + b.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
  }

  // ---------- The files: five made on the spot, plus any you add ----------
  const TYPES = { csv: "#12a36b", md: "#6d4aff", svg: "#e8751a", txt: "#64748b", json: "#0ea5e9", jpg: "#e0457b", jpeg: "#e0457b", png: "#e0457b", pdf: "#dc2626", zip: "#334155" };
  const colorFor = (name) => TYPES[(name.split(".").pop() || "").toLowerCase()] || "#475569";
  const sampleFiles = () => [
    ["orders-2026-11.csv", "order,customer,city,amount_pkr\n" + ["Ayesha Siddiqui,Lahore,4500", "Bilal Ahmed,Karachi,12800", "Hira Malik,Islamabad,7350", "Usman Tariq,Multan,2900", "Zainab Raza,Peshawar,15400"].map((r, i) => 4801 + i + "," + r).join("\n") + "\n"],
    ["eid-plan.md", "# Eid sale plan\n\n- Stock up lawn suits by the 20th\n- Free delivery over PKR 5,000\n- Shop open till 2 am on chand raat\n"],
    ["shop-logo.svg", '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#2f6bff"/><path d="M18 34l9 9 19-21" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></svg>\n'],
    ["price-list.txt", "PRICE LIST · NOVEMBER\nLawn suit, 3 piece ..... PKR 6,450\nChiffon dupatta ........ PKR 2,800\nKids kurta ............. PKR 1,950\n"],
    ["delivery-areas.json", JSON.stringify({ sameDay: ["Lahore", "Islamabad", "Rawalpindi"], nextDay: ["Karachi", "Multan", "Faisalabad"], feePkr: 250 }, null, 2) + "\n"]
  ].map(([name, text]) => ({ name, blob: new Blob([text]), on: true, sample: true }));
  let files = sampleFiles();

  const tick = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>';
  function drawList() {
    list.textContent = "";
    files.forEach((f, i) => {
      const li = document.createElement("li");
      const lab = document.createElement("label");
      lab.className = "item" + (f.on ? "" : " off");
      lab.style.setProperty("--c", colorFor(f.name));
      lab.innerHTML = '<input type="checkbox"><span class="box">' + tick + '</span><span class="ext"></span><span class="nm"></span><span class="sz"></span>';
      const cb = lab.querySelector("input");
      cb.checked = f.on;
      cb.setAttribute("aria-label", "Pack " + f.name);
      cb.addEventListener("change", () => { f.on = cb.checked; lab.classList.toggle("off", !cb.checked); refresh(); });
      lab.querySelector(".ext").textContent = (f.name.split(".").pop() || "file").slice(0, 4).toUpperCase();
      lab.querySelector(".nm").textContent = f.name;
      lab.querySelector(".sz").textContent = kb(f.blob.size);
      f.cb = cb; f.lab = lab;
      li.appendChild(lab);
      list.appendChild(li);
    });
    refresh();
  }
  const picked = () => files.filter((f) => f.on);
  const archiveName = () => (zname.value.trim().replace(/\.zip$/i, "").replace(/[^\w\- .]+/g, "-").replace(/^[-. ]+|[-. ]+$/g, "") || "bundle") + ".zip";
  function refresh() {
    const p = picked(), total = p.reduce((s, f) => s + f.blob.size, 0);
    if (!busy) {
      packBtn.setAttribute("aria-disabled", p.length ? "false" : "true");
      packLbl.textContent = p.length ? "Pack " + p.length + " file" + (p.length === 1 ? "" : "s") + " · " + kb(total) : "Tick at least one file";
      layTiles(false);
    }
  }
  zname.addEventListener("input", () => { tagName.textContent = archiveName(); });

  // adding real files from the visitor's device
  function addFiles(list2) {
    let total = files.reduce((s, f) => s + f.blob.size, 0), refused = 0;
    [...list2].forEach((f) => {
      if (total + f.size > MAX_TOTAL) { refused++; return; }
      total += f.size;
      files.push({ name: f.name, blob: f, on: true });
    });
    drawList();
    list.scrollTop = list.scrollHeight;
    readout.textContent = refused ? refused + " file(s) left out: the bundle is kept under 50 MB." : "Added. Tick or untick anything, then pack.";
    say(readout.textContent);
  }
  $("#addBtn").addEventListener("click", () => fileEl.click());
  fileEl.addEventListener("change", () => { if (fileEl.files.length) { stopAll(); addFiles(fileEl.files); } fileEl.value = ""; });
  card.addEventListener("dragover", (e) => { e.preventDefault(); card.classList.add("drop-on"); });
  card.addEventListener("dragleave", (e) => { if (!card.contains(e.relatedTarget)) card.classList.remove("drop-on"); });
  card.addEventListener("drop", (e) => { e.preventDefault(); card.classList.remove("drop-on"); if (e.dataTransfer.files.length) { stopAll(); addFiles(e.dataTransfer.files); } });
  ["dragover", "drop"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));

  // ---------- The bag: one path shape, eased between loose and tight ----------
  function bagNums(l, r, top, bottom, bul) {
    const h = bottom - top, cx = (l + r) / 2;
    return [l, top, l - bul, top + h * .35, l - bul * .6, bottom - h * .1, l + 18, bottom, cx - 20, bottom + bul * .4, cx + 20, bottom + bul * .4, r - 18, bottom,
      r + bul * .6, bottom - h * .1, r + bul, top + h * .35, r, top, cx + 30, top - 8 + bul * .3, cx - 30, top - 8 + bul * .3, l, top,
      l + 12, top + 22, l + 3 - bul * .4, (top + bottom) / 2, l + 14, bottom - 26];
  }
  const bagPath = (n) => `M${n[0]} ${n[1]}C${n[2]} ${n[3]} ${n[4]} ${n[5]} ${n[6]} ${n[7]}C${n[8]} ${n[9]} ${n[10]} ${n[11]} ${n[12]} ${n[13]}C${n[14]} ${n[15]} ${n[16]} ${n[17]} ${n[18]} ${n[19]}C${n[20]} ${n[21]} ${n[22]} ${n[23]} ${n[24]} ${n[25]}Z`;
  const shinePath = (n) => `M${n[26]} ${n[27]}Q${n[28]} ${n[29]} ${n[30]} ${n[31]}`;
  const TILE_H = 22, STACK_BOTTOM = 220;
  const loose = () => bagNums(36, 204, 46, 240, 16);
  const tightTop = (count) => STACK_BOTTOM - Math.max(1, Math.min(6, count)) * (TILE_H + 1) - 8;
  const tight = (count) => bagNums(62, 178, tightTop(count), 228, 2);
  let bagNow = loose();
  const mouthBack = $("#mouthBack"), mouthFront = $("#mouthFront"), crinkle = $("#crinkle"), bottomSeam = $("#bottomSeam");
  function setBag(n) {
    bagNow = n;
    bag.setAttribute("d", bagPath(n));
    shine.setAttribute("d", shinePath(n));
    // the open mouth, the crinkles and the bottom seam follow the bag; a tight bag is flat on top and smooth
    const l = n[0], r = n[18], top = n[1], bottom = n[7], cx = (l + r) / 2;
    const open = Math.max(0, Math.min(1, (r - l - 116) / 52)), ry = 1 + open * 8;
    mouthBack.setAttribute("cx", cx); mouthBack.setAttribute("cy", top); mouthBack.setAttribute("rx", (r - l) / 2); mouthBack.setAttribute("ry", ry);
    mouthFront.setAttribute("d", `M${l} ${top}A${(r - l) / 2} ${ry} 0 0 0 ${r} ${top}`);
    crinkle.setAttribute("d", `M${l + 12} ${top + 34}q9 14 0 30M${r - 14} ${top + 52}q-9 12 0 26M${cx - 34} ${bottom - 18}q16 -7 30 0M${cx + 18} ${top + 22}q10 6 18 0`);
    crinkle.setAttribute("opacity", (open * .85).toFixed(2));
    bottomSeam.setAttribute("d", `M${n[6] - 4} ${bottom - 5}L${n[12] + 4} ${bottom - 5}`);
  }
  // A frame-by-frame tween; ease "wobble" springs past the end and settles, "suck" speeds up then eases in
  const EASE = {
    wobble: (p) => Math.min(1.04, 1 - Math.pow(1 - p, 3) * Math.cos(p * Math.PI * 1.5) * (1 - p)),
    suck: (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2) + Math.sin(p * Math.PI * 6) * .012 * (1 - p),
    back: (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2)
  };
  function tween(ms, ease, id, onStep) {
    if (calm()) { onStep(1); return Promise.resolve(); }
    return new Promise((res, rej) => {
      const t0 = performance.now();
      const step = (t) => {
        if (id !== runId) return rej(STOP);
        const p = Math.min(1, (t - t0) / ms);
        onStep(p < 1 ? EASE[ease](p) : 1);
        p < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
  }
  function morph(to, ms, id, ease = "wobble") {
    const from = bagNow.slice();
    return tween(ms, ease, id, (e) => setBag(from.map((v, i) => v + (to[i] - v) * e)));
  }
  // the nozzle and its hose move together
  const hoseA = $("#hoseA"), hoseB = $("#hoseB");
  let noz = [0, 0];
  function setNozzle(dx, dy) {
    noz = [dx, dy];
    nozzle.setAttribute("transform", `translate(${dx} ${dy})`);
    const d = `M250 -10C250 40 ${200 + dx * .45} ${20 + dy * .6} ${175 + dx} ${30 + dy}`;
    hoseA.setAttribute("d", d); hoseB.setAttribute("d", d);
  }
  function moveNozzle(to, ms, id) {
    const from = noz.slice();
    return tween(ms, "back", id, (e) => setNozzle(from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e));
  }

  // ---------- Tiles: one per picked file (six at most), loose or stacked ----------
  // loose tiles lie in a heap at the bottom of the bag
  const LOOSE = [[50, 206, -5], [100, 200, 8], [58, 182, 5], [104, 172, -9], [66, 156, 11], [96, 140, -4]];
  function layTiles(stacked) {
    const p = picked().slice(0, 6), extra = picked().length - p.length;
    while (tilesG.children.length < p.length) {
      const g = document.createElementNS(SVGNS, "g");
      g.setAttribute("class", "tile");
      g.innerHTML = '<rect width="96" height="' + TILE_H + '" rx="6" /><text x="10" y="15"></text>';
      tilesG.appendChild(g);
    }
    [...tilesG.children].forEach((g, i) => {
      const f = p[i];
      if (!f) { g.style.opacity = 0; return; }
      g.style.opacity = 1;
      g.querySelector("rect").setAttribute("fill", colorFor(f.name));
      const label = i === 5 && extra > 0 ? "+" + (extra + 1) + " more files" : f.name.length > 15 ? f.name.slice(0, 14) + "…" : f.name;
      g.querySelector("text").textContent = label;
      const [x, y, r] = stacked ? [72, STACK_BOTTOM - (i + 1) * (TILE_H + 1), 0] : LOOSE[i];
      g.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
    });
  }
  function seamAt(n) { seam.setAttribute("x", n[0] - 6); seam.setAttribute("y", n[1] - 6); seam.setAttribute("width", n[18] - n[0] + 12); }
  function airStream(id, until) {
    // little puffs leave the bag and are pulled into the nozzle
    if (calm()) return;
    const t = setInterval(() => {
      if (id !== runId || performance.now() > until) return clearInterval(t);
      const c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("class", "air");
      c.setAttribute("r", 1.5 + Math.random() * 2.5);
      const x0 = 70 + Math.random() * 100, y0 = 110 + Math.random() * 100;
      c.setAttribute("cx", 0); c.setAttribute("cy", 0);
      airG.appendChild(c);
      c.animate([
        { transform: `translate(${x0}px, ${y0}px) scale(.4)`, opacity: 0 },
        { transform: `translate(${(x0 + 175) / 2}px, ${(y0 + 50) / 2 - 10}px) scale(1)`, opacity: .9, offset: .5 },
        { transform: "translate(175px, 48px) scale(.3)", opacity: 0 }
      ], { duration: 520 + Math.random() * 260, easing: "ease-in" }).onfinish = () => c.remove();
    }, 45);
  }

  // ---------- Pack: tiles in → vacuum → heat seal → label → real download ----------
  async function pack(id, real) {
    const btn = packBtn;                                        // keep the element before any await
    const p = picked(), name = archiveName();
    if (!p.length) return;
    busy = true;
    btn.dataset.state = "working";
    btn.setAttribute("aria-disabled", "true");
    packLbl.textContent = "Packing…";
    say("Packing " + p.length + " files into " + name + ".");

    // 1. Anticipation: the button presses in, the bag opens wide, tiles hop in one after another
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.95, .9)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    [...tilesG.children].forEach((g, i) => play(g, [{ translate: "0 -70px", opacity: 0 }, { translate: "0 6px", opacity: 1, offset: .7 }, { translate: "0 0" }], { duration: 520, delay: i * 70, easing: "ease-out" }));
    await morph(bagNums(30, 210, 40, 242, 20), 420, id);

    // 2. Read every file for real and work out its CRC-32 while the vacuum runs
    const entries = [], used = new Set();
    await moveNozzle([-63, 22], 420, id);
    hose.classList.add("humming");
    airStream(id, performance.now() + 1500);
    const sucking = morph(tight(p.length), 1500, id, "suck");
    layTiles(true);
    for (let i = 0; i < p.length; i++) {
      const f = p[i];
      const bytes = new Uint8Array(await f.blob.arrayBuffer());
      guard(id);
      let nm = f.name, k = 2;
      while (used.has(nm.toLowerCase())) nm = f.name.replace(/(\.[^.]*)?$/, " (" + k++ + ")$1");
      used.add(nm.toLowerCase());
      const crc = crc32(bytes);
      entries.push({ name: nm, bytes, crc });
      readout.innerHTML = "Packing " + (i + 1) + " of " + p.length + " · <code></code>";
      readout.lastChild.textContent = nm + " · CRC " + crc.toString(16).padStart(8, "0");
      packLbl.textContent = "Packing " + (i + 1) + " of " + p.length;
      await sleep(Math.max(60, 1300 / p.length), id);
    }
    await sucking;
    hose.classList.remove("humming");
    scene.classList.add("tight");
    await moveNozzle([0, 0], 380, id);

    // 3. Heat seal: the bar drops, glows hot, leaves a crimped seam
    packLbl.textContent = "Sealing…";
    const top = bagNow[1];
    seamAt(bagNow);
    heater.setAttribute("opacity", 1);
    await play(heater, [{ transform: `translate(0, ${top - 70}px)`, opacity: 0 }, { transform: `translate(0, ${top - 12}px)`, opacity: 1 }], { duration: 360, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    guard(id);
    heater.style.transform = `translate(0, ${top - 12}px)`;
    play(bagwrap, [{ transform: "scale(1, 1)" }, { transform: "scale(1.03, .97)" }, { transform: "scale(1)" }], { duration: 420, easing: SPRING });
    play(barGlow, [{ opacity: 0 }, { opacity: .95 }, { opacity: .6 }], { duration: 650, fill: "forwards" });
    barHot.setAttribute("fill", "#ff8a65");
    await sleep(600, id);
    seam.style.opacity = 1;
    play(seam, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    barHot.setAttribute("fill", "var(--steel1)");
    play(barGlow, [{ opacity: .6 }, { opacity: 0 }], { duration: 400, fill: "forwards" });
    await play(heater, [{ transform: `translate(0, ${top - 12}px)`, opacity: 1 }, { transform: `translate(0, ${top - 80}px)`, opacity: 0 }], { duration: 420, easing: SPRING, fill: "forwards" });
    guard(id);
    heater.setAttribute("opacity", 0);

    // 4. The real ZIP, a label slaps on, the bundle bounces
    const zip = makeZip(entries);
    tagName.textContent = name;
    tagSize.textContent = kb(zip.size);                      // the file count is in the read-out
    tag.style.opacity = 1;
    play(tag, [{ transform: "translateY(-40px) rotate(-8deg) scale(.8)", opacity: 0 }, { transform: "translateY(4px) rotate(2deg) scale(1.03)", opacity: 1, offset: .7 }, { transform: "none", opacity: 1 }], { duration: 560, easing: "ease-out" });
    play(bagwrap, [{ transform: "translateY(0)" }, { transform: "translateY(-14px)" }, { transform: "translateY(0) scale(1.02, .98)" }, { transform: "none" }], { duration: 620, easing: "ease-out" });
    if (real) {
      const url = URL.createObjectURL(zip);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    btn.dataset.state = "done";
    packLbl.textContent = (real ? "Saved " : "Packed ") + name;
    const raw = entries.reduce((s, e) => s + e.bytes.length, 0);
    readout.textContent = name + ": " + entries.length + " files, " + kb(zip.size) + " (" + kb(raw) + " of file data plus the ZIP index). Opens in any unzip tool.";
    say((real ? "Saved " : "Packed ") + name + ", " + kb(zip.size) + ".");
    await sleep(2400, id);

    // 5. Reset: the seal pops, the bag relaxes, tiles scatter back
    tag.style.opacity = 0;
    seam.style.opacity = 0;
    scene.classList.remove("tight");
    busy = false;
    layTiles(false);
    await morph(loose(), 700, id);
    btn.dataset.state = "idle";
    readout.textContent = "Builds a real ZIP on your device; nothing is sent anywhere.";
    refresh();
  }
  function stopAll() {
    runId++;
    busy = false;
    [heater, barGlow, tag, bagwrap].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    setNozzle(0, 0);
    airG.textContent = "";
    hose.classList.remove("humming");
    scene.classList.remove("tight");
    heater.setAttribute("opacity", 0);
    seam.style.opacity = 0;
    tag.style.opacity = 0;
    setBag(loose());
    packBtn.dataset.state = "idle";
    refresh();
  }
  packBtn.addEventListener("click", async () => {
    if (busy) return;
    if (!picked().length) { readout.textContent = "Tick at least one file to pack."; say(readout.textContent); return; }
    const id = ++runId;
    try { await pack(id, true); } catch (e) { if (e !== STOP) throw e; }
  });

  // ---------- Auto demo: untick or tick a file, then pack (no file is saved) ----------
  let demoOn = true, demoTimer = 0, demoStep = 0;
  function scheduleDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(demo, ms); }
  async function demo() {
    if (!demoOn || busy) return scheduleDemo(1500);
    const id = ++runId;
    try {
      const f = files[2];
      if (f && demoStep++ % 2 === 0) { f.on = !f.on; f.cb.checked = f.on; f.lab.classList.toggle("off", !f.on); refresh(); }
      play(f.lab, [{ transform: "scale(1)" }, { transform: "scale(.97)" }, { transform: "scale(1)" }], { duration: 300, easing: SPRING });
      await sleep(500, id);
      await pack(id, false);
      scheduleDemo(1500);
    } catch (e) { if (e !== STOP) throw e; }
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    stopAll();
  }
  ["pointerdown", "keydown", "dragenter"].forEach((t) => addEventListener(t, takeOver, true));

  setBag(loose());
  drawList();
  tagName.textContent = archiveName();
  // the scene settles in on load
  play(bagwrap, [{ transform: "translateY(-30px) scale(.9)", opacity: 0 }, { transform: "translateY(4px) scale(1.02)", opacity: 1, offset: .7 }, { transform: "none", opacity: 1 }], { duration: 700, easing: "ease-out" });
  scheduleDemo(700);
</script>
</body>
</html>
