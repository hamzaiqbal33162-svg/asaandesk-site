<html lang="en">
<head>

<script>
  /* Theme first, so there is no flash: ?theme=light|dark wins, then the system setting */
  (function () { var q = new URLSearchParams(location.search).get("theme"); document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; })();
</script>
<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }
  .note[hidden] { display: none; }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Amanat Fund look: mint and emerald, gold stars, open arches ======================= */
  :root {
    --bg: #edf5f0; --surface: #ffffff; --surface2: #e5f0ea; --field: #f7fbf9; --ink: #10292a; --mut: #587068; --line: #cfe2d8;
    --acc: #0f7a5f; --acc-ink: #fff; --gold: #b4872a; --pat: rgba(15, 122, 95, .07);
    --ok: #13805c; --warn: #b2730f; --bad: #c2413a;
    --zakat: #0f7a5f; --sadqa: #2b7db6; --fitrana: #c08a1e; --general: #8b55a3;
    --c1: #0f7a5f; --c2: #2b7db6; --c3: #c08a1e; --c4: #8b55a3; --c5: #d0644f; --c6: #5a8f86;
    --rb: 999px; --ri: 12px; --rm: 22px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a1613; --surface: #0f211c; --surface2: #163028; --field: #0c1c18; --ink: #e5f3ed; --mut: #92aca3; --line: #214238;
    --acc: #36c79e; --acc-ink: #04241b; --gold: #e2b75a; --pat: rgba(54, 199, 158, .06);
    --ok: #3fd39f; --warn: #f1b24a; --bad: #ff7b6e;
    --zakat: #36c79e; --sadqa: #5fb2f0; --fitrana: #e8b44a; --general: #c08ade;
    --c1: #36c79e; --c2: #5fb2f0; --c3: #e8b44a; --c4: #c08ade; --c5: #ff8a70; --c6: #79b9ad;
    --toast: #163028;
    color-scheme: dark;
  }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  /* The star lattice is an inline SVG pattern behind everything */
  .bgpat { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; color: var(--pat); }
  h1, h2, h3 { font-weight: 700; letter-spacing: -.015em; }
  h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  h3 .orn { width: 14px; height: 14px; color: var(--gold); flex: none; }
  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 0; min-height: 100vh; }

  /* Floating sidebar with a sliding emerald pill */
  .side { position: sticky; top: 14px; margin: 14px 0 14px 14px; height: calc(100vh - 28px); background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; z-index: 60; overflow-y: auto; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px 6px; color: inherit; text-decoration: none; }
  .brand b { display: block; font-size: 18px; }
  .brand small { color: var(--mut); font-size: 11.5px; }
  .nav { position: relative; display: grid; gap: 4px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 999px; color: var(--mut); text-decoration: none; font-weight: 600; transition: color .25s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--acc-ink); }
  .nav .marker { position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 999px; background: var(--acc); box-shadow: 0 8px 20px -10px var(--acc); transition: transform .5s cubic-bezier(.3, 1.25, .4, 1), height .3s; opacity: 0; }
  .side-foot { margin-top: auto; padding: 14px; border-radius: 18px; background: var(--surface2); font-size: 12.5px; display: grid; gap: 6px; }
  .side-foot b { font-size: 20px; }
  .scrim { display: none; }
  .main { min-width: 0; overflow-x: clip; }
  .top { display: flex; align-items: center; gap: 10px; padding: 18px 26px 4px; }

  .set-actions { display: flex; flex-wrap: wrap; gap: 10px; }

<script>
/* ======================= Shared kit (same in every Chill & Craft dashboard) ======================= */
"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */
let _seed = 1;
const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */
const PK = {
  m: ["Ahmed", "Bilal", "Usman", "Hamza", "Ali", "Imran", "Faisal", "Zubair", "Saad", "Kamran", "Asif", "Tariq", "Shahid", "Naveed", "Waqas", "Adeel", "Fahad", "Junaid", "Rizwan", "Salman", "Danish", "Arslan", "Haris", "Owais", "Shoaib", "Yasir", "Moiz", "Talha"],
  f: ["Ayesha", "Fatima", "Sana", "Hira", "Maryam", "Zainab", "Amna", "Mahnoor", "Rabia", "Iqra", "Sadia", "Noor", "Kiran", "Saba", "Anum", "Mehwish", "Hina", "Uzma", "Bushra", "Nida", "Laiba", "Areeba"],
  last: ["Khan", "Malik", "Butt", "Qureshi", "Sheikh", "Chaudhry", "Abbasi", "Siddiqui", "Mirza", "Raza", "Awan", "Javed", "Rana", "Baig", "Hashmi", "Gondal", "Shah", "Memon", "Baloch", "Niazi", "Ansari", "Jutt", "Kazmi", "Bhatti"],
  cities: ["Karachi", "Lahore", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Gujranwala", "Hyderabad", "Sukkur", "Bahawalpur", "Abbottabad"],
};
const pname = (g) => pick(g === "f" ? PK.f : g === "m" ? PK.m : rnd() < 0.5 ? PK.f : PK.m) + " " + pick(PK.last);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + ri(1000000, 9999999);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

/* ---------- Number formats: Rs 12,500 · 1.2M · $1,240 ---------- */
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = (n) => (n < 0 ? "-" : "") + "Rs " + num(Math.abs(n));
const short = (n) => { const a = Math.abs(+n || 0), s = n < 0 ? "-" : "", f = (v, u) => s + (v >= 100 ? Math.round(v) : +v.toFixed(1)) + u; return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + (a % 1 ? +a.toFixed(1) : a); };
const rss = (n) => (n < 0 ? "-" : "") + "Rs " + short(Math.abs(n));
const usd = (n, d = 0) => (n < 0 ? "-$" : "$") + num(Math.abs(n), d);
const pct = (n, d = 0) => num(n, d) + "%";
const FMT = { num: (v) => num(v), rs, rss, short, usd, usd2: (v) => usd(v, 2), pct: (v) => pct(v, 1), pct0: (v) => pct(v) };

/* ---------- Dates (local, no time zone surprises) ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = pd(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
/* Add months but keep the day (31 Jan + 1 month = 28 or 29 Feb) */
const addMK = (d, n) => { const x = addM(d, n), day = pd(d).getDate(), last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const pd = (s) => { if (s instanceof Date) return new Date(s); const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fd = (s) => { const d = pd(s); return d.getDate() + " " + MON[d.getMonth()]; };
const fdy = (s) => { const d = pd(s); return fd(d) + " " + d.getFullYear(); };
const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);

/* The money river: funds on the left flow into spending kinds on the right */
function river(el, list, anim) {
  const W = Math.max(320, el.clientWidth || 640), small = W < 520, H = 300, nodeW = 12, lx = small ? 64 : 110, rx = W - (small ? 92 : 150), gap = 10;
  const pairs = {}; list.forEach((x) => { const k = x.fund + "|" + x.cat; pairs[k] = (pairs[k] || 0) + x.amt; });
  const L = FUNDS.map((f) => ({ k: f, v: sum(list.filter((x) => x.fund === f).map((x) => x.amt)) })).filter((n) => n.v > 0);
  const R = CATS.map((c) => ({ k: c, v: sum(list.filter((x) => x.cat === c).map((x) => x.amt)) })).filter((n) => n.v > 0);
  const tot = sum(L.map((n) => n.v));
  if (!tot) { el.innerHTML = '<div class="empty-st">No spending in this period yet.</div>'; return; }
  const sc = (H - gap * (Math.max(L.length, R.length) - 1) - 20) / tot;
  let y = 10; L.forEach((n) => { n.y = y; n.h = Math.max(3, n.v * sc); n.off = 0; y += n.h + gap; });
  y = 10; R.forEach((n) => { n.y = y; n.h = Math.max(3, n.v * sc); n.off = 0; y += n.h + gap; });
  let bands = "", flows = "", i = 0;
  L.forEach((a) => R.forEach((b) => {
    const v = pairs[a.k + "|" + b.k]; if (!v) return;
    const h = Math.max(1.5, v * sc), y1 = a.y + a.off + h / 2, y2 = b.y + b.off + h / 2; a.off += h; b.off += h;
    const d = `M${lx + nodeW},${y1.toFixed(1)} C${((lx + rx) / 2).toFixed(1)},${y1.toFixed(1)} ${((lx + rx) / 2).toFixed(1)},${y2.toFixed(1)} ${rx},${y2.toFixed(1)}`;
    bands += `<path class="band${anim ? " draw" : ""}" pathLength="1" data-f="${a.k}" data-c="${esc(b.k)}" data-v="${v}" d="${d}" style="stroke:${FCOL[a.k]};stroke-width:${h.toFixed(1)}px;--d:${i * 90}ms"/>`;
    if (!RM && h > 5) flows += `<path class="flow" d="${d}" style="stroke-width:${Math.min(4, h / 3).toFixed(1)}px;animation-delay:${(1.2 + i * 0.1).toFixed(2)}s"/>`;
    i++;
  }));
  const nodes = L.map((n) => `<rect class="node" x="${lx}" y="${n.y.toFixed(1)}" width="${nodeW}" height="${n.h.toFixed(1)}" rx="4" style="fill:${FCOL[n.k]}"/><text x="${lx - 8}" y="${(n.y + n.h / 2).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${n.k}</text><text class="v" x="${lx - 8}" y="${(n.y + n.h / 2 + 14).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${rss(n.v)}</text>`).join("") + R.map((n) => `<rect class="node" x="${rx}" y="${n.y.toFixed(1)}" width="${nodeW}" height="${n.h.toFixed(1)}" rx="4" style="fill:var(--mut)"/><text x="${rx + nodeW + 8}" y="${(n.y + n.h / 2).toFixed(1)}" dominant-baseline="middle">${small ? n.k.split(" ")[0] : n.k}</text><text class="v" x="${rx + nodeW + 8}" y="${(n.y + n.h / 2 + 14).toFixed(1)}" dominant-baseline="middle">${rss(n.v)}</text>`).join("");
  el.innerHTML = `<svg class="river" viewBox="0 0 ${W} ${H + 10}" role="img" aria-label="Money river: where each fund was spent">${bands}${flows}${nodes}</svg>`;
  const svg = $("svg", el);
  const sh = (e) => { const b = e.target.closest(".band"); if (!b) return; $$(".band", svg).forEach((x) => x.classList.toggle("hi", x === b)); tip(`<b>${esc(b.dataset.f)} → ${esc(b.dataset.c)}</b><div>${rs(+b.dataset.v)} · ${Math.round((+b.dataset.v / tot) * 100)}% of spending</div>`, e.clientX, e.clientY); };
  svg.addEventListener("pointermove", sh); svg.addEventListener("pointerdown", sh);
  svg.addEventListener("pointerleave", () => { untip(); $$(".band", svg).forEach((x) => x.classList.remove("hi")); });
}

    $("#fams", v).innerHTML = L.map((f, i) => { const dn = rationDone(f); return `<article class="fam${dn ? " done" : ""}" data-in style="--i:${Math.min(i, 12)}"><div class="who">${av(f.head)}<span><b>${esc(f.head)}</b><small>${esc(f.area)} · ${f.members} members</small></span></div><div class="meta">${f.zakat ? '<span>Zakat eligible</span>' : '<span>Sadqa only</span>'}${f.status === "Paused" ? '<span style="color:var(--warn)">Paused</span>' : ""}<span>${rs(packCost(f))} pack</span></div><small class="mut">${esc(f.note)}</small><div class="row"><button type="button" class="btn ghost sm" data-fam="${f.id}">Details</button>${f.status === "Active" ? `<button type="button" class="btn sm deliver ${dn ? "ghost" : "pri"}" data-deliver="${f.id}" aria-pressed="${dn}">${dn ? ico("check") + " Delivered" : "Mark delivered"}</button>` : `<button type="button" class="btn sm ghost" data-resume="${f.id}">Resume</button>`}</div></article>`; }).join("") || '<div class="empty-st">No family matches.</div>';
    if (!RM) $$("#fams [data-in]", v).forEach((e) => e.classList.add("in"));
  };
  $("#fq", v).addEventListener("input", (e) => { FM.q = e.target.value; draw(); });
  v.addEventListener("click", async (e) => {
    const f = e.target.closest("[data-f]"); if (f) { FM.f = f.dataset.f; $$("[data-f]", v).forEach((x) => x.setAttribute("aria-pressed", String(x === f))); draw(); return; }
    const dl = e.target.closest("[data-deliver]"); if (dl) { if (!RM) dl.classList.add("pop"); setTimeout(() => toggleRation(dl.dataset.deliver), RM ? 0 : 220); return; }
    const rs2 = e.target.closest("[data-resume]"); if (rs2) { famOf(rs2.dataset.resume).status = "Active"; afterChange("Family is active again"); return; }
    const fd2 = e.target.closest("[data-fam]"); if (fd2) return openFam(fd2.dataset.fam);
    if (e.target.closest("[data-all]")) {
      const wait = S.fams.filter((x) => x.status === "Active" && !rationDone(x)); if (!wait.length) return toast("Every active family already has this month's pack");
      const cost = sum(wait.map(packCost));
      if (!(await ask(`Deliver ${wait.length} ration packs for ${rs(cost)}? Zakat-eligible families are paid from Zakat, the rest from Sadqa.`, { title: "Deliver to all", ok: "Deliver all", safe: true }))) return;
      const added = wait.map((x) => rationEntry(x)); S.spend.push(...added);
      afterChange(`${wait.length} ration packs delivered`, { undo: () => { S.spend = S.spend.filter((x) => !added.includes(x)); afterChange("Bulk delivery undone"); } });
    }
  });
  draw();
});
const rationEntry = (f) => ({ id: uid("X"), date: TODAY, fund: f.zakat && bal("Zakat") >= packCost(f) ? "Zakat" : "Sadqa", cat: "Monthly rations", amt: packCost(f), to: f.id, ref: "Ration " + monthKey, note: "" });
function toggleRation(id) {
  const f = famOf(id); if (!f) return;
  const ex = S.spend.find((x) => x.to === f.id && x.cat === "Monthly rations" && x.date.startsWith(monthKey));
  if (ex) { S.spend.splice(S.spend.indexOf(ex), 1); afterChange(`${f.head}: delivery removed`, { undo: () => { S.spend.push(ex); afterChange("Delivery restored"); } }); return; }
  const en = rationEntry(f);
  if (bal(en.fund) < en.amt) { if (bal("General") < en.amt) return toast(`Not enough money in ${en.fund} or General for this pack`, { type: "bad" }); en.fund = "General"; }
  S.spend.push(en);
  afterChange(`Ration pack delivered to ${f.head} (${en.fund}, ${rs(en.amt)})`, { undo: () => { S.spend.splice(S.spend.indexOf(en), 1); afterChange("Delivery undone"); } });
}

/* Zakat calculator: assets minus debts, nisab check, 2.5% due */
const ZK = { cash: 150000, bank: 620000, gold: 3, silver: 0, stock: 0, owed: 40000, debts: 90000, basis: "Silver" };
Router.add("zakat", "Zakat calculator", (v) => {
  const n = (k, l, hint) => fld(l, k, { type: "number", value: ZK[k], min: 0, hint });
  v.innerHTML = `<div class="ph"><div><h1>Zakat calculator</h1><p class="mut">A simple estimate for one year of savings. For your own case, ask a scholar you trust.</p></div></div>
  <div class="zk"><form class="card" id="zform" novalidate>
    <div class="fsec"><h4>Cash and bank</h4><div class="fgrid">${n("cash", "Cash at home (Rs)")}${n("bank", "Bank and wallet balances (Rs)")}</div></div>
    <div class="fsec"><h4>Gold and silver</h4><div class="fgrid">${n("gold", "Gold (tola)", "1 tola is about 11.66 grams")}${fld("Gold rate per tola (Rs)", "goldRate", { type: "number", value: S.set.gold, min: 0, hint: "Sample rate. Use today's market rate." })}${n("silver", "Silver (tola)")}${fld("Silver rate per tola (Rs)", "silverRate", { type: "number", value: S.set.silver, min: 0 })}</div></div>
    <div class="fsec"><h4>Business and money owed</h4><div class="fgrid">${n("stock", "Trade stock at sale value (Rs)")}${n("owed", "Money others owe you (Rs)", "Only what you expect back")}</div></div>
    <div class="fsec"><h4>Take away</h4><div class="fgrid">${n("debts", "Debts and bills due now (Rs)")}${fld("Nisab measured by", "basis", { opts: [["Silver", "Silver: 52.5 tola"], ["Gold", "Gold: 7.5 tola"]], value: ZK.basis })}</div></div>
  </form>
  <div class="zres"><div class="card"><h3>${ORN}Zakat due</h3><div class="zbig"><div id="zring"></div><div><div class="amt" id="zamt" aria-live="polite">Rs 0</div><div class="mut sm" id="zmsg"></div></div></div><div class="nisab" id="nbar" style="--w:0%;--n:50%"><i></i><em id="nlab">Nisab</em></div><div class="zrows" id="zrows"></div><div class="m-f"><button type="button" class="btn ghost" id="zreset">${ico("refresh")} Clear</button><button type="button" class="btn pri" id="zgive">${ico("heart")} Give it to the Zakat fund</button></div></div></div></div>`;
  const f = $("#zform", v), E = f.elements;
  let last = 0;
  const calc = (first) => {
    clearErrs(f);
    const g = (k) => Math.max(0, +E.namedItem(k).value || 0);
    Object.keys(ZK).forEach((k) => { if (k !== "basis") ZK[k] = g(k); }); ZK.basis = E.basis.value;
    const goldV = ZK.gold * g("goldRate"), silverV = ZK.silver * g("silverRate"), assets = ZK.cash + ZK.bank + goldV + silverV + ZK.stock + ZK.owed, net = assets - ZK.debts;
    const nisab = ZK.basis === "Silver" ? 52.5 * g("silverRate") : 7.5 * g("goldRate"), due = net >= nisab && nisab > 0 ? Math.round(net * 0.025) : 0;
    $("#zring", v).innerHTML = `<div style="position:relative;width:70px;height:70px">${ring(due ? 0.25 : 0, 70, "var(--acc)", 9, !RM && (first || due !== last))}<b style="position:absolute;inset:0;display:grid;place-items:center;font-size:13px">2.5%</b></div>`;
    const el = $("#zamt", v); el.dataset.from = last; countUp(el, due, rs); last = due;
    $("#zmsg", v).textContent = nisab <= 0 ? "Enter the gold or silver rate to find the nisab." : net >= nisab ? `Your savings of ${rs(net)} are above the nisab, so 2.5% is due.` : `Below the nisab of ${rs(nisab)}: no zakat is due this year.`;
    const top = Math.max(net, nisab) * 1.15 || 1;
    $("#nbar", v).style.setProperty("--w", clamp((net / top) * 100, 0, 100).toFixed(1) + "%"); $("#nbar", v).style.setProperty("--n", clamp((nisab / top) * 100, 4, 96).toFixed(1) + "%");
    $("#nlab", v).textContent = "Nisab " + rss(nisab);
    $("#zrows", v).innerHTML = `<div><span>Cash and bank</span><b>${rs(ZK.cash + ZK.bank)}</b></div><div><span>Gold (${ZK.gold} tola)</span><b>${rs(goldV)}</b></div><div><span>Silver (${ZK.silver} tola)</span><b>${rs(silverV)}</b></div><div><span>Stock and money owed</span><b>${rs(ZK.stock + ZK.owed)}</b></div><div><span>Less debts</span><b>− ${rs(ZK.debts)}</b></div><div><span>Net savings</span><b>${rs(net)}</b></div><div class="tot"><span>Zakat at 2.5%</span><b>${rs(due)}</b></div>`;
    $("#zgive", v).disabled = !due;
  };
  f.addEventListener("input", () => calc(false)); f.addEventListener("change", () => calc(false)); f.addEventListener("submit", (e) => e.preventDefault());
  $("#zreset", v).onclick = () => { ["cash", "bank", "gold", "silver", "stock", "owed", "debts"].forEach((k) => (E.namedItem(k).value = 0)); calc(false); toast("Calculator cleared"); };
  $("#zgive", v).onclick = () => donationForm({ type: "Zakat", amt: last, note: "From the zakat calculator" });
  calc(true);
});

      const E = $("form", box).elements, pp = $("[data-people]", box);
      const upd = () => { const fit = E.type.value === "Fitrana"; pp.hidden = !fit; if (fit) E.amt.value = Math.max(1, +E.people.value || 1) * S.set.fitrana; };
      E.type.addEventListener("change", upd); E.people.addEventListener("input", upd); upd();
    },
    onSubmit: (d) => {
      const er = check(d, { amt: [POS("Enter the amount"), [(x) => +x <= 50000000, "That looks too large"]], date: [REQ("Pick a date"), [(x) => x <= TODAY, "The date can't be in the future"]], phone: [[(x) => !x || /^03\d{2}-?\d{7}$/.test(x), "Use a number like 0300-1234567 or leave it empty"]] });
      if (d.type === "Fitrana" && !(+d.people >= 1)) er.people = "At least one person";
      if (Object.keys(er).length) return er;
      const id = "RC-" + (Math.max(5100, ...S.dons.map((x) => +x.id.slice(3))) + 1);
      S.dons.push({ id, date: d.date, donor: d.donor.trim(), phone: d.phone.trim(), type: d.type, amt: Math.round(+d.amt), method: d.method, by: d.by, note: d.note.trim() });
      afterChange(`${rs(+d.amt)} received into ${d.type}. Receipt ${id} is ready.`);
      setTimeout(() => receipt(id), 350);
    },
  });
}
function receipt(id) {
  const d = S.dons.find((x) => x.id === id); if (!d) return;
  const m = modal({ title: "Receipt " + d.id, body: `<div class="receipt"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true" style="justify-self:center"><path d="M20 2 L25 9 L33 7 L31 15 L38 20 L31 25 L33 33 L25 31 L20 38 L15 31 L7 33 L9 25 L2 20 L9 15 L7 7 L15 9 Z" fill="var(--acc)"/></svg><b>${esc(S.set.name)}</b><span class="mut sm">${esc(S.set.city)}</span><div class="amt">${rs(d.amt)}</div><span>${fTag(d.type)}</span><div class="rows"><div><span>Received from</span><b>${esc(donorName(d))}</b></div><div><span>Date</span><b>${fdy(d.date)}</b></div><div><span>Method</span><b>${esc(d.method)}</b></div><div><span>Collected by</span><b>${esc(d.by)}</b></div>${d.note ? `<div><span>Note</span><b>${esc(d.note)}</b></div>` : ""}</div><small class="mut">Kept in the ${d.type} fund and spent only on what that fund allows.</small></div>`, foot: `<button type="button" class="btn ghost danger-t" data-rdel>${ico("trash")} Delete</button><button type="button" class="btn ghost" data-close>Close</button><button type="button" class="btn pri" data-rprint>${ico("print")} Print</button>` });
  $("[data-rprint]", m.el).onclick = () => { try { window.print(); } catch (e) { toast("Printing is not available here", { type: "warn" }); } };
  $("[data-rdel]", m.el).onclick = async () => { if (!(await ask(`Delete receipt ${d.id} for ${rs(d.amt)}?`))) return; const i = S.dons.indexOf(d); S.dons.splice(i, 1); m.close(); afterChange(`${d.id} deleted`, { undo: () => { S.dons.splice(i, 0, d); afterChange("Receipt restored"); } }); };
}
function spendForm(pre = {}) {
  modal({
    title: "Record spending", submit: "Save entry", cls: "wide",
    body: `<div class="fgrid">${fld("From fund", "fund", { opts: FUNDS.map((f) => [f, `${f} · balance ${rs(bal(f))}`]), value: pre.fund || "Sadqa" })}${fld("Kind of spending", "cat", { opts: CATS, value: pre.cat || "Medical help" })}${fld("Paid for", "to", { opts: [["", "Committee or masjid"], ...S.fams.map((f) => [f.id, f.head + " · " + f.area])], value: pre.to || "" })}${fld("Amount (Rs)", "amt", { type: "number", min: 1 })}${fld("Date", "date", { type: "date", value: TODAY, max: TODAY })}${fld("Bill or reference", "ref", { ph: "e.g. Hospital bill 2231" })}${fld("Note", "note", { span: true })}<p class="note span" data-rule hidden></p></div>`,
    onOpen: (box) => { const E = $("form", box).elements, n = $("[data-rule]", box); const u = () => { const ok = ALLOWED[E.fund.value].includes(E.cat.value), fam = famOf(E.to.value); const w = !ok ? `${E.fund.value} can't pay for ${E.cat.value.toLowerCase()}. Use ${E.cat.value === "Masjid upkeep" ? "General or Sadqa" : "Sadqa or General"}.` : E.fund.value === "Zakat" && fam && !fam.zakat ? `${fam.head} is not marked as zakat eligible.` : ""; n.hidden = !w; n.textContent = w; }; E.fund.addEventListener("change", u); E.cat.addEventListener("change", u); E.to.addEventListener("change", u); u(); },
    onSubmit: (d) => {
      const er = check(d, { amt: [POS("Enter the amount"), [(x) => +x <= bal(d.fund), `Only ${rs(bal(d.fund))} left in ${d.fund}`]], date: [REQ("Pick a date"), [(x) => x <= TODAY, "The date can't be in the future"]], ref: [REQ("Add the bill or a reference so donors can trace it")] });
      if (!ALLOWED[d.fund].includes(d.cat)) er.cat = `${d.fund} can't be spent on ${d.cat.toLowerCase()}`;
      const fam = famOf(d.to); if (d.fund === "Zakat" && fam && !fam.zakat) er.to = "This family is not zakat eligible";
      if (Object.keys(er).length) return er;
      S.spend.push({ id: uid("X"), date: d.date, fund: d.fund, cat: d.cat, amt: Math.round(+d.amt), to: d.to, ref: d.ref.trim(), note: d.note.trim() });
      afterChange(`${rs(+d.amt)} spent from ${d.fund} on ${d.cat.toLowerCase()}`);
    },
  });
}
function moveForm() {
  modal({
    title: "Move money between funds", submit: "Move money",
    body: `<p class="note">Only General and Sadqa money can move between each other. Zakat and Fitrana stay where donors put them.</p><div class="fgrid" style="margin-top:12px">${fld("From", "from", { opts: [["General", `General · ${rs(bal("General"))}`], ["Sadqa", `Sadqa · ${rs(bal("Sadqa"))}`]] })}${fld("To", "to", { opts: [["Sadqa", "Sadqa"], ["General", "General"]] })}${fld("Amount (Rs)", "amt", { type: "number", min: 1 })}${fld("Reason", "note", { ph: "Committee decision" })}</div>`,
    onSubmit: (d) => {
      const er = check(d, { amt: [POS("Enter the amount"), [(x) => +x <= bal(d.from), `Only ${rs(bal(d.from))} in ${d.from}`]], note: [REQ("Write the reason")] });
      if (d.from === d.to) er.to = "Pick a different fund";
      if (Object.keys(er).length) return er;
      S.moves.push({ from: d.from, to: d.to, amt: Math.round(+d.amt), date: TODAY, note: d.note.trim() });
      afterChange(`${rs(+d.amt)} moved from ${d.from} to ${d.to}`);
    },
  });
}
function famForm(f) {
  const isNew = !f;
  modal({
    title: isNew ? "Add a family" : "Edit " + f.head, submit: isNew ? "Add family" : "Save",
    body: `<div class="fgrid">${fld("Head of family", "head", { value: f ? f.head : "" })}${fld("Mobile", "phone", { type: "tel", value: f ? f.phone : "", ph: "0300-1234567" })}${fld("Area", "area", { opts: AREAS, value: f ? f.area : AREAS[0] })}${fld("Members", "members", { type: "number", value: f ? f.members : 5, min: 1, max: 20 })}<div class="fld"><label class="chk"><input type="checkbox" name="zakat"${!f || f.zakat ? " checked" : ""}> Zakat eligible</label></div>${fld("Status", "status", { opts: ["Active", "Paused"], value: f ? f.status : "Active" })}${fld("Situation", "note", { span: true, type: "textarea", rows: 2, value: f ? f.note : "", ph: "Short note for the committee" })}</div>`,
    onSubmit: (d) => {
      const er = check(d, { head: [REQ("Enter a name"), [(x) => x.length >= 3, "Use at least 3 letters"]], phone: [PHONE], members: [[(x) => Number.isInteger(+x) && +x >= 1 && +x <= 20, "Use 1 to 20"]], note: [REQ("Add a short note")] });
      if (Object.keys(er).length) return er;
      const x = { head: d.head.trim(), phone: d.phone.trim(), area: d.area, members: +d.members, zakat: !!d.zakat, status: d.status, note: d.note.trim() };
      if (isNew) S.fams.unshift({ id: "F" + (Math.max(300, ...S.fams.map((y) => +y.id.slice(1))) + 1), since: TODAY, ...x }); else Object.assign(f, x);
      afterChange(isNew ? `${x.head}'s family added` : "Family saved");
    },
  });
}
function openFam(id) {
  const f = famOf(id); if (!f) return;
  const m = modal({ drawer: true, title: f.head, body: "" }), body = $(".m-b", m.el);
  const paint = () => {
    if (!S.fams.includes(f)) { body.innerHTML = '<div class="empty-st">This family was removed.</div>'; return; }
    const L = S.spend.filter((x) => x.to === f.id).sort((a, b) => (a.date < b.date ? 1 : -1));
    body.innerHTML = `<div class="who" style="margin-bottom:10px">${av(f.head, "")}<span><b>${esc(f.head)}</b><small>${esc(f.phone)} · ${esc(f.area)}</small></span></div><dl class="facts"><dt>Members</dt><dd>${f.members}</dd><dt>Zakat</dt><dd>${f.zakat ? "Eligible" : "Not eligible (Sadqa only)"}</dd><dt>Status</dt><dd>${f.status}</dd><dt>Helped since</dt><dd>${fdy(f.since)}</dd><dt>Situation</dt><dd>${esc(f.note)}</dd><dt>Total help</dt><dd><b>${rs(sum(L.map((x) => x.amt)))}</b></dd></dl><h3>${ORN}Help given</h3><ul class="feed">${L.map((x) => `<li>${ico(x.cat === "Monthly rations" ? "box" : "heart")}<span><b>${esc(x.cat)}</b><small>${fdy(x.date)} · ${x.fund} · ${esc(x.ref)}</small></span><b class="amt">${rs(x.amt)}</b></li>`).join("") || '<li class="empty-st">Nothing recorded yet.</li>'}</ul><div class="m-f"><button type="button" class="btn ghost danger-t" data-x="del">${ico("trash")} Remove</button><button type="button" class="btn ghost" data-x="edit">${ico("edit")} Edit</button><button type="button" class="btn pri" data-x="help">${ico("plus")} Record help</button></div>`;
  };
  m.refresh = paint; paint();
  body.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-x]"); if (!b) return;
    if (b.dataset.x === "edit") famForm(f);
    else if (b.dataset.x === "help") spendForm({ fund: f.zakat ? "Zakat" : "Sadqa", to: f.id, cat: "Medical help" });
    else if (b.dataset.x === "del") { if (!(await ask(`Remove ${f.head}'s family from the list? Past spending stays on the report.`, { ok: "Remove" }))) return; const i = S.fams.indexOf(f); S.fams.splice(i, 1); m.close(); afterChange("Family removed", { undo: () => { S.fams.splice(i, 0, f); afterChange("Family restored"); } }); }
  });
}

/* ======================= Global wiring ======================= */
const DO = {
  donate: () => donationForm(), spend: () => spendForm(), move: () => moveForm(), "add-fam": () => famForm(), theme: () => Theme.toggle(),
  print: () => { const by = FUNDS.map((f) => `<div><span>${f}</span><b>${rs(outOf(f, (x) => x.date.startsWith(monthKey)))}</b></div>`).join(""); const m = modal({ title: "Monthly summary", body: `<div class="receipt"><b>${esc(S.set.name)}</b><span class="mut">${MON[today().getMonth()]} ${today().getFullYear()}</span><div class="rows"><div><span>Donations received</span><b>${rs(sum(S.dons.filter((d) => d.date.startsWith(monthKey)).map((d) => d.amt)))}</b></div>${by}<div><span>Families given rations</span><b>${S.fams.filter(rationDone).length}</b></div><div><span>Balance held in trust</span><b>${rs(totalBal())}</b></div></div></div>`, foot: `<button type="button" class="btn ghost" data-close>Close</button><button type="button" class="btn pri" data-p>${ico("print")} Print</button>` }); $("[data-p]", m.el).onclick = () => { try { window.print(); } catch (e) {} }; },
  csv: () => {
    if (!window.Blob || !URL.createObjectURL) return toast("Downloads are not available here", { type: "warn" });
    const rows = [["Date", "Fund", "Kind", "Paid for", "Reference", "Amount"], ...S.spend.map((x) => [x.date, x.fund, x.cat, x.to ? (famOf(x.to) || {}).head || "" : x.note, x.ref, x.amt])];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((y) => `"${String(y).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" })); a.download = "amanat-spending.csv"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); toast("Spending CSV downloaded");
  },
  reset: async () => { if (!(await ask("Reset donations, families and spending to the sample committee?", { title: "Reset demo data", ok: "Reset" }))) return; S = Store.reset(); Bell.read.clear(); afterChange("Demo data reset"); },
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (d && DO[d.dataset.do]) return DO[d.dataset.do](d);
  const j = e.target.closest("button.jar[data-fund]"); if (j) location.hash = "#/funds/" + j.dataset.fund;
});
APP.notes = () => {
  const L = [], wait = S.fams.filter((f) => f.status === "Active" && !rationDone(f));
  if (wait.length) L.push({ id: "ration" + monthKey + wait.length, t: `${wait.length} families still need this month's ration`, d: "Open Families to mark deliveries", go: "#/families" });
  FUNDS.forEach((f) => { if (bal(f) < S.set.pack * 3) L.push({ id: "low" + f + Math.round(bal(f)), t: `${f} fund is running low`, d: `${rs(bal(f))} left`, go: "#/funds/" + f }); });
  const big = S.dons.filter((d) => d.amt >= 100000 && dayDiff(d.date, TODAY) <= 14); big.forEach((d) => L.push({ id: "big" + d.id, t: `Large donation: ${rs(d.amt)}`, d: `${donorName(d)} · ${d.type} · ${fd(d.date)}`, go: "#/donations" }));
  return L.slice(0, 8);
};
APP.cmds = () => [{ label: "Record a donation", run: DO.donate }, { label: "Record spending", run: DO.spend }, { label: "Add a family", run: DO["add-fam"] }, { label: "Move money between funds", run: DO.move }, { label: "Monthly summary", run: DO.print }, { label: "Switch light or dark theme", run: DO.theme }, ...S.fams.map((f) => ({ label: `${f.head} · ${f.area}`, hint: "Family", run: () => openFam(f.id) })), ...S.dons.slice(-25).map((d) => ({ label: `${d.id} · ${donorName(d)} · ${rs(d.amt)}`, hint: "Receipt", run: () => receipt(d.id) }))];
paintSide();
boot();
</script>
