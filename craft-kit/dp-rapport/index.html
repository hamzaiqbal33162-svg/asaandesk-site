<!doctype html>
<!-- Chill & Craft · Rapport · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport · Sales CRM for a solar installer</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: warm paper, deep indigo ink, apricot sunlight ---------- */
  :root {
    --bg: #fbf8f2; --side: #f5f0e6; --band-a: #fbecda; --band-b: #faf4ea; --cell: rgba(54,48,154,.07); --glow: rgba(246,170,95,.42);
    --card: #ffffff; --card-2: #faf7f1; --well: #f3eee5; --river: #d9ddf4;
    --ink: #1e1b3a; --ink-2: #3a3661; --muted: #6d6983; --faint: #a39fb2;
    --line: rgba(46,40,110,.1); --line-2: rgba(46,40,110,.17); --grid: rgba(46,40,110,.08);
    --accent: #36309a; --accent-2: #5047c4; --accent-soft: #ebe9fb; --accent-ink: #fff;
    --apricot: #f0964a; --apricot-2: #f6b47a; --apricot-soft: #fde8d2; --apricot-ink: #8d4a12;
    --good: #21865d; --good-soft: #dcf1e6; --bad: #cc3d38; --bad-soft: #fbe3e0; --warn: #d27a22;
    --s-lead: #aaa5d8; --s-survey: #f0964a; --s-design: #8b7ff0; --s-install: #36309a; --s-live: #26a073;
    --panel-a: #2e2988; --panel-b: #4c43c2;
    --shadow: 0 1px 2px rgba(30,27,58,.04), 0 8px 22px -14px rgba(30,27,58,.16);
    --shadow-lift: 0 2px 6px rgba(30,27,58,.06), 0 20px 36px -18px rgba(30,27,58,.32);
    --radius: 14px; --radius-sm: 10px;
    --surface: #ffffff; --surface-2: #f5f1ea; --panel: #fffdf9;
    --tip-bg: #1e1b3a; --tip-ink: #fff; --overlay: rgba(30,27,58,.3); --focus: #36309a;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #12112a; --side: #15142e; --band-a: #221e40; --band-b: #16152f; --cell: rgba(170,160,255,.06); --glow: rgba(246,169,101,.2);
    --card: #1c1a36; --card-2: #201e3d; --well: #272546; --river: #2a2a55;
    --ink: #efecfb; --ink-2: #cfcaee; --muted: #a49fc2; --faint: #75709a;
    --line: rgba(220,215,255,.09); --line-2: rgba(220,215,255,.16); --grid: rgba(220,215,255,.07);
    --accent: #9d96ff; --accent-2: #b8b2ff; --accent-soft: rgba(157,150,255,.16); --accent-ink: #14122e;
    --apricot: #f6a965; --apricot-2: #f8bf8b; --apricot-soft: rgba(246,169,101,.15); --apricot-ink: #fcc797;
    --good: #52cb9a; --good-soft: rgba(82,203,154,.14); --bad: #ff7c72; --bad-soft: rgba(255,124,114,.14); --warn: #f4a453;
    --s-lead: #847fb6; --s-survey: #f6a965; --s-design: #aba1f9; --s-install: #716ae9; --s-live: #52cb9a;
    --panel-a: #2a2670; --panel-b: #4a42b8;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 26px -16px rgba(0,0,0,.7);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.3), 0 22px 40px -18px rgba(0,0,0,.8);
    --surface: #1c1a36; --surface-2: #272546; --panel: #1e1c39;
    --tip-bg: #f3f0ff; --tip-ink: #17152e; --overlay: rgba(4,3,14,.6); --focus: #b8b2ff;
    color-scheme: dark;
  }
/* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
*, *::before, *::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
/* no sideways page scroll, whatever a wide header or an entrance animation does */
body{margin:0;overflow-x:clip;}
button, input, select, textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em;}
:focus-visible{outline:2px solid var(--focus, var(--accent));outline-offset:2px;}
.cc-av{--h:200;display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;font-size:.8em;font-weight:700;color:hsl(var(--h) 60% 22%);background:hsl(var(--h) 70% 84%);flex:none;letter-spacing:.02em;}
[data-theme="dark"] .cc-av{color:hsl(var(--h) 80% 88%);background:hsl(var(--h) 35% 28%);}

/* Buttons used by dialogs (apps restyle .btn to fit their look) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:38px;padding:0 16px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;transition:transform .12s, background .2s, box-shadow .2s, border-color .2s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:translateY(1px) scale(.97);}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink, #fff);}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -8px var(--accent);}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:30px;padding:0 11px;font-size:.86em;}
.btn[disabled]{opacity:.5;pointer-events:none;}

/* Toasts */
.cc-toasts{position:fixed;z-index:90;right:16px;bottom:16px;display:grid;gap:8px;width:min(340px, calc(100vw - 32px));pointer-events:none;}
.cc-toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius-sm, 10px);background:var(--tip-bg, #111);color:var(--tip-ink, #fff);box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-size:.92rem;animation:ccToast .35s cubic-bezier(.2,.9,.3,1.2) both;pointer-events:auto;}
.cc-toast .ic{color:var(--good);}
.cc-toast.bad .ic{color:var(--bad);}
.cc-toast.warn .ic{color:var(--warn);}
.cc-toast.out{animation:ccToastOut .3s ease forwards;}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.96);}}
@keyframes ccToastOut{to{opacity:0;transform:translateX(30px);}}

/* Modal + drawer */
.cc-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;}
.cc-back{position:absolute;inset:0;background:var(--overlay, rgba(10,12,20,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;}
.cc-dialog{position:relative;width:min(480px, 100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel, var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius, 16px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1);}
.cc-dialog.wide{width:min(720px, 100%);}
.cc-overlay.open .cc-back{opacity:1;}
.cc-overlay.open .cc-dialog{opacity:1;transform:none;}
.cc-overlay.is-drawer{place-items:stretch end;padding:0;}
.cc-overlay.is-drawer .cc-dialog{width:min(440px, 100%);height:100%;max-height:none;border-radius:var(--radius, 16px) 0 0 var(--radius, 16px);transform:translateX(40px);}
.cc-overlay.is-drawer.open .cc-dialog{transform:none;}
.cc-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:1;}
.cc-dh h2{margin:0;font-size:1.12rem;}
.cc-x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;}
.cc-x:hover{background:var(--surface-2);}
.cc-db{padding:8px 20px 20px;}
.cc-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px;flex-wrap:wrap;}
.cc-db .cc-df{padding:14px 0 0;}
.cc-confirm{margin:6px 0 0;color:var(--muted);line-height:1.5;}
.cc-picks{display:grid;gap:6px;}
.cc-pick{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);}
.cc-pick:hover, .cc-pick:focus-visible{border-color:var(--accent);}
.cc-pick small{margin-left:auto;color:var(--muted);}

/* Forms */
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.cc-field{display:grid;gap:5px;grid-column:span 2;}
.cc-field.half{grid-column:span 1;}
.cc-field label{font-size:.84rem;font-weight:600;color:var(--muted);}
.cc-field input, .cc-field select, .cc-field textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
.cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
.cc-field [aria-invalid="true"]{border-color:var(--bad);}
.cc-err{color:var(--bad);font-size:.8rem;min-height:0;}
.cc-err:empty{display:none;}
.cc-hint{color:var(--muted);font-size:.78rem;}
.cc-intro{margin:0 0 12px;color:var(--muted);}
.cc-form.shake{animation:ccShake .35s;}
@keyframes ccShake{25%{transform:translateX(-6px);} 50%{transform:translateX(5px);} 75%{transform:translateX(-3px);}}
@media (max-width:480px){.cc-field.half{grid-column:span 2;}}

/* Popover + tooltip */
.cc-pop{position:fixed;z-index:85;max-height:70vh;overflow:auto;background:var(--panel, var(--surface));color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm, 12px);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px);transition:opacity .2s, transform .25s;}
.cc-pop.open{opacity:1;transform:none;}
.cc-tip{position:fixed;z-index:95;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg, #111);color:var(--tip-ink, #fff);font-size:.8rem;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;}
.cc-tip.on{opacity:1;}
.cc-tip b{display:block;margin-bottom:3px;}
.cc-tip div{display:flex;align-items:center;gap:6px;}
.cc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.cc-tip em{margin-left:auto;padding-left:10px;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;}

/* Command search */
.cc-cmdk .cc-dialog{align-self:start;margin-top:10vh;}
.cc-cmdk-q{width:100%;min-height:46px;padding:0 14px;border-radius:var(--radius-sm, 10px);border:1px solid var(--accent);background:var(--surface-2);font-size:1rem;}
.cc-cmdk-q:focus{outline:none;}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto;}
.cc-cmdk-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;}
.cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover{background:var(--surface-2);color:var(--accent);}
.cc-cmdk-list small{margin-left:auto;color:var(--muted);}
.cc-cmdk-foot{margin:10px 0 0;font-size:.76rem;color:var(--muted);}
.cc-cmdk-foot kbd{padding:1px 6px;margin:0 2px;border-radius:5px;border:1px solid var(--line);font-family:inherit;}
.cc-empty-li{color:var(--muted);cursor:default !important;}

/* Data table */
.cc-tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
.cc-search{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:320px;min-height:38px;padding:0 12px;border-radius:var(--radius-sm, 10px);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);}
.cc-search:focus-within{border-color:var(--accent);}
.cc-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap;}
.cc-chip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.84rem;font-weight:600;transition:background .2s, color .2s;}
.cc-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink, #fff);border-color:transparent;}
.cc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cc-tbl table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px;}
.cc-tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.cc-tbl th button{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;}
.cc-tbl th svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5;}
.cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg{opacity:1;color:var(--accent);}
.cc-tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.cc-tbl tbody tr{animation:ccRow .35s both;animation-delay:calc(var(--r, 0) * 25ms);transition:background .15s;}
.cc-tbl tbody tr[tabindex="0"]{cursor:pointer;}
.cc-tbl tbody tr[tabindex="0"]:hover{background:var(--surface-2);}
.cc-tbl .r, .cc-tbl th.r{text-align:right;font-variant-numeric:tabular-nums;}
.cc-tbl th.r button{flex-direction:row-reverse;}
@keyframes ccRow{from{opacity:0;transform:translateY(6px);}}
.cc-pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.84rem;color:var(--muted);}
.cc-pages{display:flex;gap:4px;align-items:center;}
.cc-pages button{min-width:32px;height:32px;padding:0 6px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);}
.cc-pages button[aria-current="page"]{background:var(--accent);color:var(--accent-ink, #fff);border-color:transparent;}
.cc-pages button:disabled{opacity:.4;cursor:default;}
.cc-empty{display:grid;place-items:center;align-content:center;gap:6px;padding:28px 12px;text-align:center;color:var(--muted);}
.cc-empty .ic{width:30px;height:30px;opacity:.6;}
.cc-empty b{color:var(--ink);}

/* Charts */
.cc-chart{display:block;overflow:visible;}
.cc-chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums;}
.cc-grid line{stroke:var(--grid, var(--line));stroke-dasharray:3 4;}
.cc-zero{stroke:var(--line);}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards;}
.cc-fade{animation:ccFade .9s .3s both;}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both;transition:opacity .2s;}
.cc-bar.neg{transform-origin:50% 0;}
.cc-cell{animation:ccPop .5s both;transform-box:fill-box;transform-origin:center;}
.cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell{animation:none;stroke-dashoffset:0;}
.cc-guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;}
.cc-guide.on{opacity:.7;}
.cc-dot{opacity:0;stroke:var(--surface);stroke-width:2;}
.cc-dot.on{opacity:1;}
.cc-hit.on{fill:var(--ink);fill-opacity:.05;}
@keyframes ccDraw{to{stroke-dashoffset:0;}}
@keyframes ccFade{from{opacity:0;}}
@keyframes ccGrow{from{transform:scaleY(0);}}
@keyframes ccPop{from{opacity:0;transform:scale(.4);}}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted);}
.cc-legend span{display:inline-flex;align-items:center;gap:6px;}
.cc-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
.cc-spark{display:block;overflow:visible;}
.cc-spark .cc-line{stroke-width:1.8;}

/* Page entrance (apps can swap the keyframes via --enter) */
.cc-in{animation:var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 55ms);}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985);}}

/* Reduced motion:everything still works, without big movement */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after{animation-duration:.01ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
  .cc-draw{stroke-dashoffset:0;}
}


/* ===================== Rapport:app styles ===================== */
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
h1, h2, h3, h4, p{margin:0;}
.num, .tab{font-variant-numeric:tabular-nums;}
::selection{background:var(--apricot-soft);}
.muted{color:var(--muted);}
.grow{flex:1;}

.btn{min-height:34px;padding:0 14px;font-size:12.5px;border-radius:10px;background:var(--card);box-shadow:0 1px 1px rgba(30,27,58,.04);}
.btn.primary{background:var(--ink);color:var(--bg);}
[data-theme="dark"] .btn.primary{background:var(--accent);color:var(--accent-ink);}
.btn.primary:hover{box-shadow:0 8px 18px -10px var(--ink);filter:none;background:var(--accent);color:#fff;}
[data-theme="dark"] .btn.primary:hover{background:var(--accent-2);color:var(--accent-ink);}
.btn.sm{min-height:28px;padding:0 10px;font-size:12px;}
.btn .ic{width:15px;height:15px;}
.cc-chip{min-height:28px;padding:0 11px;font-size:12px;background:var(--card);}
.cc-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
[data-theme="dark"] .cc-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}
.cc-chip em{font-style:normal;opacity:.6;margin-left:4px;font-weight:600;}
.cc-field label{font-size:12px;}
.cc-field input, .cc-field select, .cc-field textarea{min-height:36px;font-size:13px;background:var(--card);}
.cc-tbl table{font-size:12.8px;}
.cc-tbl th{font-size:11px;padding:8px 10px;}
.cc-tbl td{padding:9px 10px;}
.cc-search{min-height:34px;background:var(--card);}
.cc-toast{font-size:13px;}
.cc-dh h2{font-size:16px;}
.cc-draw{animation-duration:.95s;}
.cc-chart text, .cc-gauge text{font-size:10.5px;}
.cc-tip{font-size:12px;}
.cc-pop{font-size:13px;}
.cc-pages button{min-width:28px;height:28px;}

.app{display:grid;grid-template-columns:240px minmax(0, 1fr);min-height:100vh;}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px;z-index:40;scrollbar-width:thin;}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 0;text-decoration:none;}
.brand svg{width:30px;height:30px;flex:none;}
.brand b{font-size:19px;letter-spacing:-.03em;font-weight:750;}
.ws{display:flex;align-items:center;gap:9px;margin:14px 0 10px;padding:8px 10px;width:100%;border-radius:11px;border:1px solid var(--line);background:var(--card);text-align:left;}
.ws i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--apricot-soft);color:var(--apricot-ink);font-style:normal;font-weight:800;font-size:11px;}
.ws span{display:grid;line-height:1.25;min-width:0;}
.ws b{font-size:12.5px;}
.ws small{color:var(--muted);font-size:11px;}
.ws .ic{margin-left:auto;color:var(--muted);width:14px;}
.nav{position:relative;display:grid;gap:2px;}
.navl{display:contents;}
.nav a, .plink, .mlink{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:550;font-size:13.2px;transition:background .2s, color .2s;}
.nav a .ic{width:17px;height:17px;color:var(--muted);transition:color .2s;}
.nav a:hover, .plink:hover, .mlink:hover{background:color-mix(in srgb, var(--card) 70%, transparent);}
.nav a[aria-current="page"]{color:var(--ink);font-weight:650;}
.nav a[aria-current="page"] .ic{color:var(--accent);}
.nav .mark{position:absolute;left:0;right:0;top:0;z-index:0;border-radius:10px;background:var(--card);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.3,.9,.3,1), height .35s, opacity .2s;}

.badge-n{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--well);color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);}

.plink .pi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;background:color-mix(in srgb, var(--pc) 16%, transparent);color:var(--pc);}
.plink .pi .ic{width:13px;height:13px;}
.plink span, .mlink span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plink[aria-current="page"], .mlink[aria-current="page"]{background:var(--card);box-shadow:var(--shadow);color:var(--ink);}
.mlink{padding:5px 8px;}

.more-l{margin:2px 10px 0;font-size:12px;color:var(--muted);text-decoration:none;}
.more-l:hover{color:var(--accent);}
.me{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;}

.me b{font-size:12.8px;}
.me small{color:var(--muted);font-size:11px;}
.me button{margin-left:auto;}

.av{position:relative;display:inline-flex;flex:none;}
.ph{width:var(--s, 30px);height:var(--s, 30px);border-radius:50%;overflow:hidden;display:block;background:var(--well);flex:none;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(var(--z, 1));transform-origin:var(--fx, 50%) var(--fy, 40%);}
.av.on::after, .av.away::after{content:"";position:absolute;right:-1px;bottom:-1px;width:32%;height:32%;min-width:8px;min-height:8px;border-radius:50%;background:var(--good);border:2px solid var(--ring, var(--side));}
.av.away::after{background:var(--faint);}
.stack{display:inline-flex;}
.stack .av + .av{margin-left:-8px;}
.stack .ph{box-shadow:0 0 0 2px var(--ring, var(--card));}
.tile{--h:30;width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;flex:none;font-size:11px;font-weight:750;letter-spacing:.02em;color:hsl(var(--h) 55% 30%);background:hsl(var(--h) 80% 93%);}
[data-theme="dark"] .tile{color:hsl(var(--h) 85% 84%);background:hsl(var(--h) 30% 24%);}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2);position:relative;}
.icon-btn:hover{background:var(--card);border-color:var(--line);}
.icon-btn .ic{width:17px;height:17px;}
.icon-btn .dotn{position:absolute;top:6px;right:6px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--apricot);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--band-a);}
.icon-btn .dotn:empty{display:none;}
[data-theme="dark"] .t-sun, [data-theme="light"] .t-moon{display:none;}

.main{min-width:0;position:relative;display:flex;flex-direction:column;}
.top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:8px;padding:0 28px;transition:background .25s, box-shadow .25s;}
.top.scrolled{background:color-mix(in srgb, var(--band-b) 84%, transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 1px 0 var(--line);}
.menu-btn{display:none;}
.qs{display:flex;align-items:center;gap:9px;width:min(380px, 40vw);height:36px;padding:0 8px 0 12px;border-radius:11px;border:1px solid var(--line);background:color-mix(in srgb, var(--card) 76%, transparent);color:var(--muted);font-size:13px;text-align:left;transition:border-color .2s, background .2s;}
.qs:hover{border-color:var(--line-2);background:var(--card);}
.qs{min-width:0;overflow:hidden;}
.qs .ic{width:16px;height:16px;}
.qs > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.qs kbd{margin-left:auto;font:600 11px/1 inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);}
.acts{margin-left:auto;display:flex;gap:8px;align-items:center;}
.live-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:color-mix(in srgb, var(--card) 70%, transparent);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--muted);}
.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:livePulse 2s infinite;}
@keyframes livePulse{70%{box-shadow:0 0 0 7px transparent;}}

.view{flex:1;min-width:0;}
.band{position:relative;margin-top:-60px;padding:74px 28px 20px;background:linear-gradient(180deg, var(--band-a), var(--band-b));border-bottom:1px solid var(--line);overflow:hidden;isolation:isolate;}
.band::before{content:"";position:absolute;z-index:-1;top:-40px;right:-60px;width:62%;height:150%;background-image:linear-gradient(var(--cell) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--cell) 1.5px, transparent 1.5px);background-size:34px 22px;transform:skewX(-24deg);-webkit-mask-image:radial-gradient(90% 80% at 100% 0%, #000 10%, transparent 70%);mask-image:radial-gradient(90% 80% at 100% 0%, #000 10%, transparent 70%);pointer-events:none;}
.band::after{content:"";position:absolute;z-index:-1;width:560px;height:560px;right:-150px;top:-330px;border-radius:50%;background:radial-gradient(circle, var(--glow) 0%, transparent 66%);pointer-events:none;animation:glow 9s ease-in-out infinite alternate;}
@keyframes glow{to{transform:translate(-40px, 16px) scale(1.06);}}
.eyebrow{font-size:12px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.eyebrow a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.eyebrow a:hover{color:var(--accent);}
.band h1{font-size:30px;line-height:1.15;letter-spacing:-.028em;font-weight:720;margin:6px 0 6px;}
.band h1 em{font-style:normal;color:var(--accent);}
.band .sub{color:var(--ink-2);font-size:13.5px;max-width:620px;}
.bhead{display:flex;gap:24px;align-items:flex-start;}
.bhead > div:first-child{flex:1;min-width:0;}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.hchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:color-mix(in srgb, var(--card) 75%, transparent);border:1px solid var(--line);font-size:12px;font-weight:550;color:var(--ink-2);text-decoration:none;}
a.hchip:hover{border-color:var(--accent);color:var(--accent);}
.hchip i{width:7px;height:7px;border-radius:50%;background:var(--c, var(--accent));}
.hchip .ic{width:14px;height:14px;color:var(--muted);}
.kpis{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.kpi{padding:0 20px;border-left:1px solid var(--line);min-width:0;display:grid;align-content:start;gap:2px;}
.kpi:first-child{border-left:0;padding-left:0;}
.kpi > span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:550;}
.kpi > span .ic{width:15px;height:15px;}
.kpi b{font-size:25px;font-weight:720;letter-spacing:-.025em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;}
.kpi b small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0;}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}
.kpi .row2{display:flex;align-items:center;gap:12px;}
.delta{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--good-soft);color:var(--good);}
.delta.down{background:var(--bad-soft);color:var(--bad);}
.delta .ic{width:11px;height:11px;stroke-width:2.4;}
.bar-t{height:6px;border-radius:4px;background:color-mix(in srgb, var(--ink) 9%, transparent);overflow:hidden;margin:6px 0 4px;}
.bar-t i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg, var(--apricot), var(--accent));width:0;transition:width 1.1s cubic-bezier(.3,.8,.2,1);}
.cells{display:flex;gap:3px;margin:6px 0 4px;}
.cells i{flex:1;height:9px;border-radius:2px;background:color-mix(in srgb, var(--ink) 9%, transparent);transform:skewX(-18deg);transition:background .3s;}
.cells i.on{background:var(--accent);}
.cells i.on.a{background:var(--apricot);}

.grid{display:grid;grid-template-columns:repeat(12, minmax(0, 1fr));gap:16px;padding:20px 28px 32px;align-items:stretch;}
.col-stack{display:grid;gap:16px;align-content:start;min-width:0;}
#fn{min-height:196px;} #rev{min-height:266px;} #dmap{min-height:242px;} #amap{min-height:466px;} #pBud{min-height:180px;} #mBars{min-height:204px;} #aTrend{min-height:110px;} #custTbl{min-height:560px;}
.s2{grid-column:span 2;} .s3{grid-column:span 3;} .s4{grid-column:span 4;} .s5{grid-column:span 5;} .s6{grid-column:span 6;} .s7{grid-column:span 7;} .s8{grid-column:span 8;} .s9{grid-column:span 9;} .s12{grid-column:1 / -1;}
.stretch{align-self:stretch;}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0;transition:box-shadow .25s, transform .25s, border-color .25s;}
.card:hover{box-shadow:var(--shadow-lift);}
.lift:hover{transform:translateY(-3px);}
.card-h{display:flex;align-items:center;gap:8px;margin:-2px 0 12px;min-height:28px;flex-wrap:wrap;}
.card-h h2{font-size:14.5px;font-weight:680;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.card-h h2 small{font-size:12px;color:var(--muted);font-weight:500;}
.card-h .meta{margin-left:auto;color:var(--muted);font-size:12px;}
.card-h .link{margin-left:auto;color:var(--accent);font-size:12px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:2px;}
.card-h .link:hover{text-decoration:underline;}
.card-h .link .ic{width:13px;height:13px;}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:var(--well);margin-left:auto;}
.seg button{height:24px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:650;transition:background .2s, color .2s;}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(30,27,58,.12);}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--well);color:var(--ink-2);}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c, var(--muted));flex:none;}
.pill.st{background:color-mix(in srgb, var(--c) 13%, transparent);color:var(--ink);}
.pill.ap{background:var(--apricot-soft);color:var(--apricot-ink);}
.pill.bad{background:var(--bad-soft);color:var(--bad);}
.pill.good{background:var(--good-soft);color:var(--good);}
.pill.ac{background:var(--accent-soft);color:var(--accent);}
.pill .ic{width:12px;height:12px;}
.datec{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;}
.datec .ic{width:12px;height:12px;color:var(--muted);}
.datec.soon{background:var(--apricot-soft);border-color:transparent;color:var(--apricot-ink);}
.datec.late{background:var(--bad-soft);border-color:transparent;color:var(--bad);}
.datec.late .ic, .datec.soon .ic{color:inherit;}
.empty-s{padding:18px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--line-2);border-radius:10px;}

.view.loading .card::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--card) 70%, #fff 30%) 50%, transparent 80%) -150% 0 / 60% 100% no-repeat,
    linear-gradient(var(--well), var(--well)) 16px 18px / 38% 13px no-repeat,
    repeating-linear-gradient(180deg, var(--well) 0 10px, transparent 10px 24px) 16px 54px / calc(100% - 32px) calc(100% - 74px) no-repeat, var(--card);
  animation:shim .8s linear infinite, skOut .22s .38s ease forwards;}
@keyframes shim{to{background-position:250% 0, 16px 18px, 16px 54px, 0 0;}}
@keyframes skOut{to{opacity:0;}}
.view-in .band > *{animation:bandIn .45s cubic-bezier(.2,.8,.2,1) both;}
.view-in .band > *:nth-child(2){animation-delay:50ms;} .view-in .band > *:nth-child(3){animation-delay:100ms;}
@keyframes bandIn{from{opacity:0;transform:translateY(10px);}}

.sun{flex:none;width:250px;display:grid;gap:4px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb, var(--card) 72%, transparent);border:1px solid var(--line);backdrop-filter:blur(6px);}
.sun svg{display:block;width:100%;height:66px;overflow:visible;}
.sun .arc{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:2 4;}
.sun .peak{fill:none;stroke:var(--apricot);stroke-width:3.5;stroke-linecap:round;opacity:.85;}
.sun .hz{stroke:var(--line-2);}
.sun .orb{fill:var(--apricot);filter:drop-shadow(0 0 6px var(--apricot));}

@keyframes spin{to{transform:rotate(360deg);}}
.sun text{font-size:10px;fill:var(--muted);}
.sun b{font-size:12.5px;}
.sun small{color:var(--muted);font-size:11.5px;}
.fn-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.fn svg{display:block;overflow:visible;}

.fn .conv rect{fill:var(--card);stroke:var(--line-2);}

.fn-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted);align-items:center;}
.fn-legend span{display:inline-flex;gap:6px;align-items:center;}

.sbars{display:grid;gap:13px;}
.sbar > div:first-child{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
.sbar b{font-weight:650;display:inline-flex;align-items:center;gap:7px;}

.fc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:2px;}

.fc small{color:var(--muted);font-size:11.5px;}
.rows{display:grid;}

.lb em small{display:block;color:var(--muted);font-size:11px;font-weight:500;}
.cbx{width:18px;height:18px;border-radius:6px;border:1.6px solid var(--line-2);background:var(--card);display:grid;place-items:center;flex:none;padding:0;color:transparent;transition:background .2s, border-color .2s;}
.cbx .ic{width:12px;height:12px;stroke-width:3;}
.cbx:hover{border-color:var(--accent);}
.cbx[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff;animation:tick .3s;}
@keyframes tick{50%{transform:scale(1.18);}}
.done-t b{text-decoration:line-through;color:var(--muted);}

.amap svg{display:block;overflow:visible;}
.amap .river{fill:none;stroke:var(--river);stroke-linecap:round;}
.amap .road{fill:none;stroke:var(--line-2);stroke-width:1.2;stroke-dasharray:1 5;stroke-linecap:round;}
.amap .tl{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .2s;animation:tileIn .5s cubic-bezier(.2,.9,.3,1.25) both;}
.amap .tl:hover, .amap .tl:focus-visible{transform:scale(1.07);}
.amap .tl:focus{outline:none;}
.amap .tl rect{stroke:transparent;stroke-width:2.5;transition:fill .4s, stroke .2s;}
.amap .tl.sel rect{stroke:var(--ink);}
.amap .tl:focus-visible rect{stroke:var(--apricot);}
.amap .tl text{font-size:10.5px;font-weight:750;pointer-events:none;}
.amap .tl .v{font-weight:600;font-size:10px;opacity:.85;}
@keyframes tileIn{from{opacity:0;transform:scale(.5);}}
.amap .cmp{fill:var(--muted);font-size:10px;font-weight:800;}
.amap .rl{font-size:9.5px;fill:var(--muted);font-style:italic;letter-spacing:.1em;}
.scale{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--muted);}
.scale i{flex:1;height:7px;border-radius:4px;max-width:180px;}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 28px 0;}
.toolbar .cc-search{flex:0 1 260px;}
.sel-s{height:30px;padding:0 28px 0 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink);}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px, 1fr);gap:14px;padding:14px 28px 28px;overflow-x:auto;align-items:start;scrollbar-width:thin;}
.col{min-width:0;border-radius:14px;padding:10px;background:color-mix(in srgb, var(--well) 55%, transparent);border:1px solid transparent;transition:background .2s, border-color .2s;}
.col.over{border-color:var(--accent);background:var(--accent-soft);}
.col.focus{animation:colFocus 1.4s;}
@keyframes colFocus{0%, 60%{box-shadow:0 0 0 3px var(--apricot);}}
.col-h{display:grid;gap:1px;padding:2px 4px 10px;}
.col-h h3{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.col-h h3 i{width:9px;height:9px;border-radius:3px;background:var(--c);transform:skewX(-15deg);}
.col-h .cnt{font-size:11px;color:var(--muted);font-weight:700;margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--card);display:grid;place-items:center;}
.col-h h3{width:100%;}
.col-h .sum{font-size:11.5px;color:var(--muted);font-weight:600;padding-left:16px;}
.col-h .sum b{color:var(--ink);}
.col-l{display:grid;grid-template-columns:minmax(0, 1fr);gap:10px;min-height:60px;}
.deal{position:relative;padding:12px 12px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:grab;transition:transform .2s, box-shadow .2s, opacity .2s;}
.deal:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
.deal.drag{opacity:.4;}
.deal::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--c);opacity:.9;}
.deal-t{display:flex;align-items:flex-start;gap:8px;}
.deal-t b{font-size:13.2px;font-weight:650;line-height:1.3;flex:1;min-width:0;}
.deal-t .icon-btn{width:24px;height:24px;margin:-3px -5px 0 0;border-radius:7px;}
.deal-t .icon-btn .ic{width:15px;height:15px;}
.deal .k{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;margin-top:2px;}
.deal .k .ic{width:12px;height:12px;}
.deal .spec{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap;}
.deal .spec span{display:inline-flex;align-items:center;gap:4px;}
.deal .spec .ic{width:12px;height:12px;color:var(--muted);}
.bat .ic, .deal .spec .bat .ic{color:var(--apricot);width:15px;height:15px;vertical-align:-3px;}
.pbar{display:flex;gap:2px;margin-top:8px;overflow:hidden;padding-left:2px;}
.pbar i{flex:none;width:7px;height:9px;border-radius:1.5px;background:var(--accent);opacity:.85;transform:skewX(-15deg);}
.pbar i.b{background:var(--apricot);}
.deal-f{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2);}
.deal-f .v{font-weight:720;font-size:13px;font-variant-numeric:tabular-nums;}
.deal-f .av{margin-left:auto;}
.deal-f{gap:5px;min-width:0;}
.deal-f .datec{padding:0 6px;}
.deal-f .datec .ic{display:none;}
.sys b{white-space:nowrap;}
.add-card{width:100%;height:36px;border-radius:10px;border:1px dashed var(--line-2);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-card:hover{border-color:var(--accent);color:var(--accent);background:var(--card);}
.nl{display:flex;align-items:flex-end;gap:22px;}
.nl svg{display:block;}
.nl .b1{fill:var(--accent);} .nl .b2{fill:var(--apricot-2);opacity:.75;}
.nl text{font-size:10px;fill:var(--muted);}
.nl .td{fill:var(--accent);font-weight:700;}
.bstat{display:grid;gap:1px;padding-left:20px;border-left:1px solid var(--line);min-width:130px;}
.bstat b{font-size:22px;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.bstat > span{font-size:12px;color:var(--muted);}
.bstat small{font-size:11.5px;color:var(--muted);}
.legend2{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:4px;}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

.cust{display:flex;align-items:center;gap:10px;min-width:0;}
.cust span{display:grid;line-height:1.3;min-width:0;}
.cust b{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cust small{color:var(--muted);font-size:11.5px;white-space:nowrap;}
.sys{display:grid;line-height:1.3;}
.sys small{color:var(--muted);font-size:11.5px;}
.ra{display:inline-flex;gap:2px;}
.ra .icon-btn{width:28px;height:28px;border-radius:8px;}
.ra .icon-btn .ic{width:15px;height:15px;}
.split{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px;margin:8px 0 5px;}
.split i{display:block;height:100%;}
.dr-h{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.dr-h .tile{width:46px;height:46px;border-radius:13px;font-size:14px;}
.dr-h b{font-size:16px;display:block;}
.dr-h small{color:var(--muted);}
.stepper{display:grid;grid-template-columns:repeat(5, 1fr);gap:4px;margin:4px 0 16px;}
.stepper button{position:relative;height:34px;border:0;border-radius:6px;background:var(--well);color:var(--muted);font-size:11px;font-weight:700;clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%, 7px 50%);padding:0 6px 0 10px;}
.stepper button:first-child{clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%);}
.stepper button.past{background:color-mix(in srgb, var(--accent) 22%, transparent);color:var(--accent);}
.stepper button.cur{background:var(--accent);color:var(--accent-ink);}
.dsec{margin-top:16px;}
.dsec h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:8px;}
.facts{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;}
.facts div{padding:9px 10px;border-radius:10px;background:var(--well);display:grid;}
.facts small{color:var(--muted);font-size:11px;}
.facts b{font-size:14px;font-variant-numeric:tabular-nums;}
.note{padding:9px 11px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);font-size:12.5px;margin-bottom:6px;}
.note small{display:block;color:var(--muted);font-size:11px;margin-top:3px;}
.addrow{display:flex;gap:6px;margin-top:8px;}
.addrow input, .addrow select{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;}

.addrow .err{color:var(--bad);font-size:11.5px;}

.tg-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 2px 6px;}

.tg-h em{font-style:normal;color:var(--faint);}
.tg-h.late{color:var(--bad);}
.task{display:flex;align-items:flex-start;gap:11px;padding:10px 10px;border-radius:10px;border:1px solid transparent;transition:background .15s, border-color .15s;}

.task .cbx{margin-top:1px;}
.task .tx{flex:1;min-width:0;display:grid;gap:6px;}
.task .tx b{font-weight:560;font-size:13px;}
.task .tg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.task .ra{opacity:0;transition:opacity .15s;}
.task:hover .ra, .task:focus-within .ra{opacity:1;}
.ctag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 3px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-2);text-decoration:none;white-space:nowrap;}
.ctag .tile{width:17px;height:17px;border-radius:4px;font-size:8px;}
.week{display:grid;grid-template-columns:repeat(7, 1fr);gap:6px;}
.wd{border-radius:10px;padding:8px 4px;text-align:center;background:var(--card-2);border:1px solid var(--line);display:grid;gap:4px;justify-items:center;}
.wd small{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;}
.wd b{font-size:15px;}
.wd.today{background:var(--ink);color:var(--bg);border-color:transparent;}
.wd.today small{color:inherit;opacity:.7;}
[data-theme="dark"] .wd.today{background:var(--accent);color:var(--accent-ink);}
.wd .dots{display:flex;gap:2px;min-height:6px;}
.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--apricot);}
.visit{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.visit:first-child{border-top:0;}
.visit .d{text-align:center;border-radius:9px;background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--c);padding:5px 0;line-height:1.15;}
.visit .d small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;}
.visit .d b{font-size:15px;}
.visit .tx{display:grid;line-height:1.35;min-width:0;}
.visit .tx b{font-size:12.8px;font-weight:620;}
.visit .tx small{color:var(--muted);font-size:11.5px;}
.ring{position:relative;width:var(--rs, 64px);height:var(--rs, 64px);flex:none;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block;}
.ring .rt{fill:none;stroke:color-mix(in srgb, var(--ink) 9%, transparent);}
.ring .rf{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray 1.1s cubic-bezier(.3,.8,.2,1);}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:750;font-size:13px;font-variant-numeric:tabular-nums;}

.area-d{display:grid;gap:12px;}
.area-d h3{font-size:18px;letter-spacing:-.02em;}
.area-d .facts{grid-template-columns:repeat(2, 1fr);}
.why{padding:10px 12px;border-radius:10px;background:var(--apricot-soft);color:var(--apricot-ink);font-size:12.5px;display:flex;gap:8px;}

.rank{display:grid;gap:4px;}

.rank em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}

.mgrid{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:16px;padding:4px 28px 32px;}

.st-on::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.st-off{display:inline-flex;align-items:center;gap:5px;}
.st-off::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);}
.well3{display:grid;grid-template-columns:repeat(3, 1fr);border-radius:11px;background:var(--card-2);border:1px solid var(--line);}
.well3 div{padding:9px 12px;display:grid;border-left:1px solid var(--line);}

.well3 b{font-size:15px;font-variant-numeric:tabular-nums;}
.qt{display:grid;gap:2px;}

.mfoot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;}

.chipbar{display:flex;align-items:center;gap:8px;padding:18px 28px 12px;flex-wrap:wrap;}
.chipbar .meta{margin-left:auto;color:var(--muted);font-size:12px;}

.ph-tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb, var(--pc) 15%, var(--card));color:var(--pc);flex:none;box-shadow:var(--shadow);}

.ptitle{display:flex;gap:16px;align-items:center;}
.pside{display:grid;gap:8px;justify-items:end;text-align:right;flex:none;}
.pside .stack{--ring:var(--band-a);}
.pside small{color:var(--muted);font-size:12px;}
.pphoto{position:relative;width:236px;height:120px;border-radius:14px;overflow:hidden;flex:none;box-shadow:var(--shadow);}
.pphoto img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);animation:kb 14s ease-in-out infinite alternate;}
@keyframes kb{to{transform:scale(1.14) translate(-3%, 2%);}}
.pphoto::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent, rgba(10,8,30,.62));}
.pphoto figcaption{z-index:1;position:absolute;left:8px;bottom:8px;right:8px;font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.pstats{display:grid;grid-template-columns:1.15fr 1fr 1fr 1.25fr;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.pstats > div{padding:0 20px;border-left:1px solid var(--line);display:flex;gap:14px;align-items:center;min-width:0;}
.pstats > div:first-child{border-left:0;padding-left:0;}
.pstats .kpi{padding:0;border:0;flex:1;}
.ms{list-style:none;margin:0;padding:0;position:relative;}
.ms li{position:relative;display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding:0 0 16px;}
.ms li::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line-2);}
.ms li.done::before{background:var(--accent);}
.ms li:last-child::before{display:none;}
.ms .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);display:grid;place-items:center;padding:0;color:transparent;z-index:1;transition:background .2s, border-color .2s;}
.ms .mk .ic{width:13px;height:13px;stroke-width:3;}
.ms li.done .mk{background:var(--accent);border-color:var(--accent);color:#fff;}
.ms li.next .mk{border-color:var(--apricot);box-shadow:0 0 0 4px var(--apricot-soft);animation:nextP 2.4s infinite;}
@keyframes nextP{50%{box-shadow:0 0 0 7px var(--apricot-soft);}}
.ms .tx{display:grid;gap:5px;padding-top:3px;min-width:0;}
.ms .tx b{font-weight:600;font-size:13px;}
.ms li.done .tx b{text-decoration:line-through;color:var(--muted);font-weight:500;}
.ms .tx > span{display:flex;gap:6px;flex-wrap:wrap;}
.ms .icon-btn{width:26px;height:26px;opacity:0;transition:opacity .15s;}
.ms li:hover .icon-btn, .ms li:focus-within .icon-btn{opacity:1;}
.ptl{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.ptl-bar{position:relative;height:8px;border-radius:5px;background:var(--well);margin:26px 6px 8px;}
.ptl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg, var(--apricot), var(--accent));}
.ptl-bar b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--card);border:2px solid var(--accent);}
.ptl-bar b.d{background:var(--accent);}
.ptl-bar em{position:absolute;bottom:13px;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;color:var(--apricot-ink);background:var(--apricot-soft);padding:1px 6px;border-radius:5px;white-space:nowrap;}
.ptl-l{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);}
.stackbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:8px;}
.stackbar i{height:100%;transition:flex-grow .8s;}
.mini-l{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.mini-l span{display:inline-flex;align-items:center;gap:5px;}
.mini-l i{width:7px;height:7px;border-radius:50%;background:var(--c);}
.prof{display:flex;gap:20px;align-items:center;}
.prof .av{--ring:var(--band-a);}
.prof .ph{--s:96px;box-shadow:0 0 0 4px var(--card), var(--shadow-lift);}
.prof .av.on::after{width:20px;height:20px;right:4px;bottom:4px;border-width:3px;border-color:var(--card);}

.back{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:10px;}

.back .ic{width:14px;height:14px;}
.grp-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;padding:10px 0 6px;border-bottom:1px solid var(--line);}
.grp-h i{width:7px;height:7px;border-radius:50%;background:var(--c);}
.grp-h small{margin-left:auto;color:var(--muted);font-weight:500;}

.set-wrap{display:grid;grid-template-columns:240px minmax(0, 1fr);gap:20px;padding:20px 28px 32px;align-items:start;}
.stabs{display:grid;gap:2px;padding:6px;}
.stabs button{display:grid;grid-template-columns:22px 1fr;column-gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);}

.stabs button small{color:var(--muted);font-size:11px;}
.stabs button[aria-selected="true"]{background:var(--well);color:var(--ink);}

.sform h2{font-size:16px;margin-bottom:2px;}
.sform > p{color:var(--muted);margin-bottom:14px;}
.photo-row{display:flex;gap:16px;align-items:center;padding:14px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);margin-bottom:16px;}
.photo-row .ph{--s:72px;}
.photo-row b{display:block;font-size:13.5px;}
.photo-row small{display:block;color:var(--muted);margin-bottom:8px;}
.tgl-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
.tgl-row:first-of-type{border-top:0;}
.tgl-row > span{flex:1;display:grid;}
.tgl-row b{font-weight:600;}
.tgl-row small{color:var(--muted);font-size:12px;}
.tgl{width:40px;height:23px;border-radius:12px;border:0;padding:0;background:var(--line-2);position:relative;flex:none;transition:background .2s;}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,.9,.3,1.3);}
.tgl[aria-checked="true"]{background:var(--accent);}
.tgl[aria-checked="true"]::after{transform:translateX(17px);}
.stg{display:grid;grid-template-columns:14px 1fr 140px 42px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);}
.stg:first-of-type{border-top:0;}
.stg i{width:12px;height:12px;border-radius:3px;background:var(--c);transform:skewX(-15deg);}
.stg input[type="text"]{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;}
.stg input[type="range"]{accent-color:var(--accent);width:100%;}
.stg output{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.sform .cc-df{padding:18px 0 0;justify-content:flex-start;}
.danger-z{margin-top:18px;padding:14px;border-radius:12px;border:1px solid color-mix(in srgb, var(--bad) 30%, transparent);background:var(--bad-soft);display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.danger-z span{flex:1;min-width:200px;display:grid;}
.danger-z small{color:var(--muted);}
.opt3{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;}
.opt3 button{border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px;display:grid;gap:8px;text-align:left;font-weight:600;font-size:12.5px;}
.opt3 button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.opt3 .sw{height:46px;border-radius:8px;border:1px solid var(--line);}

.compact .card{padding:12px;}
.compact .grid{gap:12px;}
.compact .row{padding:6px 0;}

.bbar{display:none;}
.scrim{display:none;}

@media (max-width:1360px){.sun{width:220px;} .kpi{padding:0 14px;} .kpi b{font-size:22px;}}
@media (max-width:1280px) {
  .app{grid-template-columns:220px minmax(0, 1fr);}
  .grid, .band, .toolbar, .chipbar, .set-wrap{padding-left:22px;padding-right:22px;}
  .board, .mgrid{padding-left:22px;padding-right:22px;}
  .top{padding:0 22px;}
  .xl-s6{grid-column:span 6;} .xl-s12{grid-column:1 / -1;}
  .pphoto{width:200px;}
}
@media (max-width:1100px) {
  .app{grid-template-columns:minmax(0, 1fr);}
  .side{position:fixed;left:0;top:0;bottom:0;width:262px;transform:translateX(-104%);transition:transform .3s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 60px -10px rgba(0,0,0,.4);}
  .nav-open .side{transform:none;}
  .nav-open .scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--overlay);}
  .menu-btn{display:grid;}
  .s3, .s4, .s5{grid-column:span 6;} .s7, .s8, .s9{grid-column:1 / -1;}
  .md-s12{grid-column:1 / -1;}
  .mgrid{grid-template-columns:repeat(2, minmax(0, 1fr));}
  .kpis, .pstats{grid-template-columns:repeat(2, minmax(0, 1fr));row-gap:16px;}
  .kpi:nth-child(3), .pstats > div:nth-child(3){border-left:0;padding-left:0;}
  .set-wrap{grid-template-columns:1fr;}
  .stabs{position:static;grid-template-columns:repeat(3, 1fr);}
}
@media (max-width:760px) {
  body{padding-bottom:66px;}
  .top{padding:0 12px;gap:6px;}
  .qs{flex:1;width:auto;}
  .qs kbd, .acts .btn span, .live-pill{display:none;}
  .acts .btn{padding:0 10px;}
  .card-h h2 small{display:none;}
  .grid, .band, .toolbar, .chipbar, .set-wrap, .board, .mgrid{padding-left:14px;padding-right:14px;}
  .grid{gap:12px;padding-top:14px;}
  .band{padding-top:70px;}
  .band h1{font-size:24px;}
  .bhead{flex-direction:column;gap:14px;}
  .sun, .pside, .pphoto{width:100%;justify-items:start;text-align:left;}
  .s2, .s3, .s4, .s5, .s6, .xl-s6{grid-column:1 / -1;}
  .kpis, .pstats{grid-template-columns:1fr 1fr;}
  .kpi{padding:0 10px;} .kpi b{font-size:20px;}
  .pstats > div{padding:0 10px;flex-direction:column;align-items:flex-start;gap:6px;}
  .mgrid{grid-template-columns:1fr;}
  .board{grid-auto-columns:260px;}
  .stabs{grid-template-columns:1fr 1fr;}
  .opt3{grid-template-columns:1fr;}
  .rank button{grid-template-columns:26px 1fr 70px 46px;}
  .nl{flex-wrap:wrap;}
  .bstat{padding-left:12px;min-width:0;}
  .cc-field.half{grid-column:span 2;}
  .bbar{display:grid;grid-template-columns:repeat(5, 1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;height:62px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--side) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);}
  .bbar a, .bbar button{display:grid;justify-items:center;align-content:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:650;text-decoration:none;border-radius:10px;}
  .bbar .ic{width:19px;height:19px;}
  .bbar [aria-current="page"]{color:var(--accent);background:var(--card);}
  .cc-toasts{bottom:76px;}
}
@media (max-width:420px){.kpis, .pstats{grid-template-columns:1fr 1fr;} .facts{grid-template-columns:1fr 1fr;} .week{gap:3px;} .stg{grid-template-columns:12px 1fr 80px 36px;gap:8px;}}

<script>
/* =====================================================================

const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);

const lerp = (a, b, t) => a + (b - a) * t;
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

/* ---------- Seeded random: the demo data is the same on every load ---------- */
function seeded(seed) {
 let s = seed >>> 0;
 return () => {
  s += 0x6d2b79f5;
  let t = s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

}

const reseed = (n) => (R = seeded(n));
const rand = (a, b) => a + R() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (a) => a[Math.floor(R() * a.length)];

/* ---------- Number, money and date formats ---------- */
const num = (v, dp = 0) => (+v || 0).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });

 const a = Math.abs(v), g = v < 0 ? "−" : "";
 const f = (x) => x.toFixed(dp).replace(/\.0+$/, "");
 if (a >= 1e9) return g + f(a / 1e9) + "B";
 if (a >= 1e6) return g + f(a / 1e6) + "M";
 if (a >= 1e3) return g + f(a / 1e3) + "K";
 return g + num(a, a < 10 && a % 1 ? 2 : 0);
}
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const TODAY = new Date(new Date().toDateString());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fdate = (d) => { d = new Date(d); return d.getDate() + " " + MON[d.getMonth()]; };
const fdateY = (d) => { d = new Date(d); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const monthLabels = (n) => Array.from({ length: n }, (_, i) => MON[(TODAY.getMonth() - n + 1 + i + 120) % 12]);

/* ---------- Safe storage: works even when the browser blocks it ---------- */
const store = {
 get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
 set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
 del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

/* ---------- Timers that pause while the tab is hidden ---------- */
const timers = [];
function every(ms, fn) {
 const t = { ms, fn, id: 0 };
 timers.push(t);
 if (!document.hidden) t.id = setInterval(fn, ms);
 return t;
}
document.addEventListener("visibilitychange", () => timers.forEach((t) => { clearInterval(t.id); t.id = document.hidden ? 0 : setInterval(t.fn, t.ms); }));

/* ---------- Tween + count-up numbers ---------- */
function tween(dur, fn, done) {
 if (RM || !window.requestAnimationFrame) { fn(1); if (done) done(); return; }
 const t0 = performance.now();

 const step = (now) => { const p = clamp((now - t0) / dur, 0, 1); fn(ease(p)); if (p < 1) requestAnimationFrame(step); else if (done) done(); };

}
function countUp(el, to, f = (v) => num(Math.round(v)), dur = 900) {
 if (!el) return;
 const from = el.dataset.v != null ? +el.dataset.v : 0;
 el.dataset.v = to;
 if (RM || from === to) { el.textContent = f(to); return; }
 tween(dur, (t) => (el.textContent = f(lerp(from, to, t))));
}

/* ---------- Icons: simple line icons drawn for this kit ---------- */
const O = (x, y, r) => `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
const ICONS = {

const initials = (n) => String(n).split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

/* ---------- Toasts (announced politely to screen readers) ---------- */
function toast(msg, kind = "") {
 let box = $("#cc-toasts");
 if (!box) {
  box = document.createElement("div");
  box.id = "cc-toasts";
  box.className = "cc-toasts";
  box.setAttribute("role", "status");
  box.setAttribute("aria-live", "polite");

 const t = document.createElement("div");
 t.className = "cc-toast " + kind;
 t.innerHTML = ic(kind === "bad" ? "x" : kind === "warn" ? "bell" : "check") + "<span>" + esc(msg) + "</span>";

 while (box.children.length > 4) box.firstChild.remove();
 setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 2800);
}

/* ---------- Modal + drawer with focus trap, Esc and backdrop close ---------- */
const modals = [];
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

 wrap.className = "cc-overlay" + (drawer ? " is-drawer" : "") + (cls ? " " + cls : "");
 wrap.innerHTML = `<div class="cc-back" data-close></div>
  <div class="cc-dialog${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="${id}">
   <header class="cc-dh"><h2 id="${id}">${esc(title)}</h2><button type="button" class="cc-x" data-close aria-label="Close">${ic("x")}</button></header>
   <div class="cc-db">${html}</div>
   ${actions ? '<footer class="cc-df"></footer>' : ""}
  </div>`;

 const api = { el: dlg, body: $(".cc-db", wrap), wrap, close };
 if (actions) {
  const f = $(".cc-df", wrap);
  actions.forEach((a) => {
   const b = document.createElement("button");
   b.type = "button";
   b.className = "btn " + (a.kind || "ghost");
   b.textContent = a.label;
   b.addEventListener("click", () => { const keep = a.fn ? a.fn(api) === false : false; if (!keep && a.close !== false) close(); });

  });

}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modals.length) { e.preventDefault(); modals[modals.length - 1].close(); } });

/* Confirm dialog: resolves true when the person confirms */
function confirmBox(text, ok = "Delete", kind = "danger") {

  let done = false;
  openModal({
   title: "Please confirm",
   html: `<p class="cc-confirm">${esc(text)}</p>`,
   actions: [{ label: "Cancel" }, { label: ok, kind, fn: () => { done = true; res(true); } }],
   onClose: () => { if (!done) res(false); },
  });

}

/* Pick one option (keyboard friendly "Move to..." menu) */
function pickBox(title, options) {
 return new Promise((res) => {
  let val = null;

function sunWidget() {
 const now = new Date(), h = now.getHours() + now.getMinutes() / 60;
 const rise = 7.4, set = 16.3, pk0 = 11.3, pk1 = 14.2;
 const W = 220, cx = W / 2, cy = 58, rx = 96, ry = 50;

 const arc = (a, b) => { let d = ""; for (let t = a; t <= b + 0.001; t += (b - a) / 24) { const [x, y] = pt(t); d += (d ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); } return d; };
 const up = h > rise && h < set;
 const [sx, sy] = pt(clamp(h, rise, set));
 const fmtH = (t) => String(Math.floor(t)).padStart(2, "0") + ":" + String(Math.round((t % 1) * 60)).padStart(2, "0");
 return `<div class="sun" aria-label="Sun today">
  <svg viewBox="0 0 ${W} 70" aria-hidden="true"><line class="hz" x1="4" x2="${W - 4}" y1="${cy}" y2="${cy}"/><path class="arc" d="${arc(rise, set)}"/><path class="peak" d="${arc(pk0, pk1)}"/>${up ? `<g transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><g class="rays">${Array.from({ length: 8 }, (_, i) => { const a = (i * Math.PI) / 4; return `<line x1="${(Math.cos(a) * 9).toFixed(1)}" y1="${(Math.sin(a) * 9).toFixed(1)}" x2="${(Math.cos(a) * 12).toFixed(1)}" y2="${(Math.sin(a) * 12).toFixed(1)}"/>`; }).join("")}</g><circle class="orb" r="6"/></g>` : `<circle class="orb" cx="${pt(set)[0]}" cy="${cy}" r="5" opacity=".5"/>`}<text x="4" y="69">${fmtH(rise)}</text><text x="${W - 4}" y="69" text-anchor="end">${fmtH(set)}</text></svg>
  <b>${up ? "Good survey light until " + fmtH(set - 0.6) : "Sun is down · next survey slot " + fmtH(rise + 1)}</b><small>Peak sun ${fmtH(pk0)}–${fmtH(pk1)} · clear, 9°C</small></div>`;
}

/* ---------- Signature: roof-to-revenue funnel with deal dots ---------- */
const CONV = [0.68, 0.79, 0.58, 0.97];
function funnel(el) { if (el) chart(el, () => drawFunnel(el)); }
function drawFunnel(el) {
 stopFx();
 const W = Math.max(700, el.clientWidth || 900), H = 196;
 const st = S.stages.slice(1), leadsN = S.deals.filter((d) => d.stage === "lead").length;
 const groups = st.map((s) => S.deals.filter((d) => d.stage === s.id));
 const liveQ = sum(S.deals.filter((d) => d.stage === "live").map((d) => d.value));
 const inW = 64, outW = 118, gIn = 40, gap = 58, sk = 18, ph = 112, y0 = 22;
 const pw = (W - inW - outW - gIn * 2 - gap * 3) / 4;
 const px = (i) => inW + gIn + i * (pw + gap);
 const yc = y0 + 80;
 const outX = W - outW;
 const xl = (i, yy) => px(i) + sk * (1 - (yy - y0) / ph), xr = (i, yy) => px(i) + pw - sk * ((yy - y0) / ph);
 const poly = (i) => `${px(i) + sk},${y0} ${px(i) + pw},${y0} ${px(i) + pw - sk},${y0 + ph} ${px(i)},${y0 + ph}`;
 const gid = "fg" + uid();
 let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Funnel: ${leadsN} new leads, ${groups.map((g, i) => g.length + " in " + st[i].name).join(", ")}">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--panel-b)"/><stop offset="1" style="stop-color:var(--panel-a)"/></linearGradient>
  <linearGradient id="${gid}g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="${gid}c">${st.map((_, i) => `<polygon points="${poly(i)}"/>`).join("")}</clipPath></defs>`;
 // cables
 const segs = [[inW, xl(0, yc)]].concat(st.map((_, i) => [xr(i, yc), i < 3 ? xl(i + 1, yc) : outX]));
 s += segs.map(([a, b]) => `<line class="cable" x1="${a}" x2="${b}" y1="${yc}" y2="${yc}"/><line class="cable-live" x1="${a}" x2="${b}" y1="${yc}" y2="${yc}"/>`).join("");
 // inlet + outlet
 s += `<g class="inlet"><circle cx="${inW / 2}" cy="${yc}" r="27"/><text class="t-in" x="${inW / 2}" y="${yc + 6}" text-anchor="middle">${leadsN}</text><text class="t-sm" x="${inW / 2}" y="${yc + 46}" text-anchor="middle">new leads</text></g>`;
 s += `<g class="outlet" id="fnOut"><rect x="${outX}" y="${yc - 32}" width="${outW}" height="64" rx="14"/><text class="t-out" x="${outX + outW / 2}" y="${yc - 2}" text-anchor="middle">${MK(liveQ)}</text><text class="t-sm" x="${outX + outW / 2}" y="${yc + 16}" text-anchor="middle">earning sunlight</text></g>`;
 // panels
 st.forEach((x, i) => {
  const g = groups[i], val = sum(g.map((d) => d.value));
  const days = [6, 9, 14, 0][i];
  let cells = "";
  for (let k = 1; k < 3; k++) { const yy = y0 + (ph * k) / 3; cells += `<line class="cellg" x1="${xl(i, yy)}" x2="${xr(i, yy)}" y1="${yy}" y2="${yy}"/>`; }
  for (let k = 1; k < 5; k++) cells += `<line class="cellg" x1="${px(i) + sk + (k * (pw - sk)) / 5}" y1="${y0}" x2="${px(i) + (k * (pw - sk)) / 5}" y2="${y0 + ph}"/>`;
  s += `<g class="pnl" tabindex="0" role="button" data-st="${x.id}" aria-label="${esc(x.name)}: ${g.length} deals, ${M(val)}. Open in pipeline"><polygon class="pnl-f" points="${poly(i)}" fill="url(#${gid})"/>${cells}<polygon class="pnl-o" points="${poly(i)}"/><line x1="${px(i) + sk + 2}" x2="${px(i) + sk + 30}" y1="${y0 + 1.5}" y2="${y0 + 1.5}" style="stroke:${x.c};stroke-width:3;stroke-linecap:round"/>
   <text class="t-st" x="${px(i) + sk + 8}" y="${y0 + 20}">${esc(x.name)}</text><text class="t-big" x="${px(i) + sk + 4}" y="${y0 + 50}">${UI.fnMode === "value" ? MK(val) : g.length}</text>
   <text class="t-val" x="${px(i) + 2}" y="${y0 + ph + 20}">${UI.fnMode === "value" ? g.length + " deals" : MK(val)}</text><text class="t-sm" x="${px(i) + 2}" y="${y0 + ph + 36}">${i < 3 ? "about " + days + " days here" : "switched on"}</text></g>`;
  if (i < 3) { const cx = (xr(i, yc) + xl(i + 1, yc)) / 2; s += `<g class="conv"><rect x="${cx - 21}" y="${yc - 34}" width="42" height="20" rx="10"/><text x="${cx}" y="${yc - 20}" text-anchor="middle">${Math.round(CONV[i + 1] * 100)}%</text></g>`; }
 });
 const c0 = (inW + xl(0, yc)) / 2;
 s += `<g class="conv"><rect x="${c0 - 21}" y="${yc - 34}" width="42" height="20" rx="10"/><text x="${c0}" y="${yc - 20}" text-anchor="middle">${Math.round(CONV[0] * 100)}%</text></g>`;
 s += `<g clip-path="url(#${gid}c)"><rect class="glare" id="fnGlare" x="-160" y="${y0}" width="140" height="${ph}" fill="url(#${gid}g)" transform="skewX(-18)"/></g><g class="f-dots" id="fnDots"></g></svg>`;
 el.innerHTML = s;
 const svg = $("svg", el);
 // hover + click on panels
 svg.addEventListener("pointermove", (e) => { const p = e.target.closest(".pnl"); if (!p) return tip.hide(); const i = st.findIndex((x) => x.id === p.dataset.st); const g = groups[i]; tip.show(e, `<b>${esc(st[i].name)}</b><div>Deals<em>${g.length}</em></div><div>Value<em>${M(sum(g.map((d) => d.value)))}</em></div><div>Usual odds<em>${st[i].odds}%</em></div><div style="opacity:.7;margin-top:4px">Click to open in the pipeline</div>`); });
 svg.addEventListener("pointerleave", () => tip.hide());
 const open = (p) => { UI.focusStage = p.dataset.st; location.hash = "#/pipeline"; };
 svg.addEventListener("click", (e) => { const p = e.target.closest(".pnl"); if (p) open(p); });
 svg.addEventListener("keydown", (e) => { const p = e.target.closest(".pnl"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(p); } });
 // deal dots: slow inside panels, quick along cables, some drop away between steps
 const zones = st.map((_, i) => [xl(i, yc), xr(i, yc)]);
 const dotsG = $("#fnDots", svg), out = $("#fnOut", svg), glare = $("#fnGlare", svg);
 const homeShare = S.deals.filter((d) => d.kind === "Home").length / Math.max(1, S.deals.length);
 const rr = seeded(5);
 const dots = [];
 const zoneOf = (x) => zones.findIndex(([a, b]) => x >= a && x <= b);
 const ampAt = (x) => { const z = zoneOf(x); if (z < 0) return 0; const [a, b] = zones[z]; const e = Math.min(x - a, b - x); return 15 * clamp(e / 22, 0, 1); };
 const spawn = () => { const c = document.createElementNS(SVGNS, "circle"); c.setAttribute("r", "4.2"); c.setAttribute("class", "f-dot " + (rr() < homeShare ? "home" : "biz")); dotsG.appendChild(c); dots.push({ c, x: inW / 2 + 20, lane: rr() * 2 - 1, gate: 0, drop: false, vy: 0, dy: 0, op: 1 }); };
 const gates = [xl(0, yc) - 6].concat(zones.slice(0, 3).map(([, b]) => b + 6));
 let acc = 0, gx = -160;
 const step = (dt) => {
  acc += dt; if (acc > 0.62) { acc = 0; if (dots.length < 46) spawn(); }
  for (let k = dots.length - 1; k >= 0; k--) {
   const d = dots[k];
   const z = zoneOf(d.x);
   d.x += (z >= 0 ? 24 : 105) * dt;
   if (!d.drop && d.gate < gates.length && d.x > gates[d.gate]) { if (rr() > CONV[d.gate]) d.drop = true; d.gate++; }
   if (d.drop) { d.vy += 90 * dt; d.dy += d.vy * dt; d.op -= 1.4 * dt; }
   if (d.op <= 0 || d.x > outX + 8) { if (d.x > outX + 8 && !d.drop) { out.classList.remove("bump"); void out.getBBox(); out.classList.add("bump"); } d.c.remove(); dots.splice(k, 1); continue; }
  }
  gx += 120 * dt; if (gx > W + 200) gx = -400;
 };
 const paint = () => { dots.forEach((d) => { d.c.setAttribute("cx", d.x.toFixed(1)); d.c.setAttribute("cy", (yc + d.lane * ampAt(d.x) + d.dy).toFixed(1)); d.c.setAttribute("opacity", Math.max(0, d.op).toFixed(2)); }); glare.setAttribute("x", gx.toFixed(0)); };
 for (let t = 0; t < 26; t += 0.05) step(0.05);
 paint();
 if (RM || !S.ui.motion) return;
 let last = performance.now();
 const loop = (now) => { if (!svg.isConnected) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); paint(); FX.raf = requestAnimationFrame(loop); };
 FX.raf = requestAnimationFrame(loop);
}

/* ---------- Signature: neighbourhood map by win rate ---------- */
const PAL = { light: ["#fde9d5", "#f8c896", "#ee9d6c", "#8d7ee0", "#3f37ae"], dark: ["#2f2b50", "#5d4763", "#a3654f", "#6c63e0", "#a8a1ff"] };
const PAL_T = { light: ["#5a3410", "#5a3410", "#3b1a08", "#fff", "#fff"], dark: ["#d9d5f5", "#f3e9f0", "#fff", "#fff", "#17152e"] };
const metricOf = (a, m) => (m === "leads" ? a.leads : m === "kw" ? a.kw : (a.won / a.leads) * 100);
const metricFmt = (v, m) => (m === "leads" ? num(v) : m === "kw" ? num(v) + " kW" : Math.round(v) + "%");
function areaMap(el, o) {
 if (!el) return;
 el._o = o;
 chart(el, (again) => {
  const o = el._o, th = APP.theme() === "dark" ? "dark" : "light";
  const W = Math.max(280, el.clientWidth || 360), gap = o.compact ? 5 : 7, rg = o.compact ? 16 : 24;
  const cell = Math.min((W - gap * 5) / 6, o.compact ? 58 : 104);
  const gw = cell * 6 + gap * 5, x0 = (W - gw) / 2;
  const H = cell * 4 + gap * 3 + rg + 4;
  const vals = S.areas.map((a) => metricOf(a, o.metric)), lo = Math.min(...vals), hi = Math.max(...vals);
  const bin = (v) => clamp(Math.floor(((v - lo) / (hi - lo || 1)) * 5), 0, 4);
  const X = (c) => x0 + c * (cell + gap), Y = (r) => r * (cell + gap) + (r >= 2 ? rg : 0);
  const ry = 2 * cell + gap + (gap + rg) / 2 - gap / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="group" aria-label="Map of Wexley neighbourhoods by ${o.metric === "win" ? "win rate" : o.metric}">`;
  s += `<path class="river" style="stroke-width:${rg - 2}" d="M${x0 - 14},${ry + 4} C${x0 + gw * 0.25},${ry - 6} ${x0 + gw * 0.45},${ry + 8} ${x0 + gw * 0.62},${ry} S${x0 + gw * 0.9},${ry - 5} ${x0 + gw + 14},${ry + 3}"/>`;
  s += `<text class="rl" x="${X(5) + cell / 2}" y="${ry + 3.5}" text-anchor="middle">${o.compact ? "" : "RIVER WEX"}</text>`;
  s += `<path class="road" d="M${X(0) + cell / 2},${Y(1) - gap / 2} L${X(5) + cell},${Y(1) - gap / 2} M${X(3) - gap / 2},${Y(0)} L${X(3) - gap / 2},${Y(3) + cell}"/>`;
  s += `<g transform="translate(${X(5) + cell / 2} ${cell / 2})"><path d="M0,-${cell * 0.28} L${cell * 0.1},${cell * 0.06} L0,0 L-${cell * 0.1},${cell * 0.06}z" style="fill:var(--apricot)"/><text class="cmp" y="${cell * 0.3}" text-anchor="middle">N</text></g>`;
  S.areas.forEach((a, i) => {
   const v = metricOf(a, o.metric), b = bin(v), x = X(a.c), y = Y(a.r);
   const dist = Math.hypot(a.c - 2.5, a.r - 1.5);
   s += `<g class="tl${o.sel === a.id ? " sel" : ""}" data-a="${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}: ${metricFmt(v, o.metric)}" style="animation-delay:${again || RM ? 0 : Math.round(dist * 70)}ms${again ? ";animation:none" : ""}"><rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="${o.compact ? 8 : 12}" style="fill:${PAL[th][b]}"/>`;
   s += o.compact ? `<text x="${x + cell / 2}" y="${y + cell / 2 - 1}" text-anchor="middle" style="fill:${PAL_T[th][b]}">${a.code}</text><text class="v" x="${x + cell / 2}" y="${y + cell / 2 + 12}" text-anchor="middle" style="fill:${PAL_T[th][b]}">${metricFmt(v, o.metric).replace(" kW", "")}</text>`
    : `<text x="${x + 10}" y="${y + 19}" style="fill:${PAL_T[th][b]};font-size:11.5px">${a.code}</text><text class="v" x="${x + 10}" y="${y + cell - 26}" style="fill:${PAL_T[th][b]};font-size:10.5px;opacity:.8">${esc(a.name.length > 12 ? a.name.slice(0, 11) + "…" : a.name)}</text><text x="${x + 10}" y="${y + cell - 10}" style="fill:${PAL_T[th][b]};font-size:15px;font-weight:760">${metricFmt(v, o.metric)}</text>`;
   s += `</g>`;
  });
  el.innerHTML = s + "</svg>";
  const sc = o.scaleEl || $("#dscale");
  if (sc) sc.style.background = `linear-gradient(90deg, ${PAL[th].join(",")})`;
  const svg = $("svg", el);
  svg.addEventListener("pointermove", (e) => { const t = e.target.closest(".tl"); if (!t) return tip.hide(); const a = S.areas.find((x) => x.id === t.dataset.a); tip.show(e, `<b>${esc(a.name)}</b><div>Win rate<em>${Math.round((a.won / a.leads) * 100)}%</em></div><div>Leads<em>${a.leads}</em></div><div>Won<em>${a.won}</em></div><div>Live<em>${a.kw} kW</em></div>`); });
  svg.addEventListener("pointerleave", () => tip.hide());
  const pick_ = (t) => { const a = S.areas.find((x) => x.id === t.dataset.a); if (o.onPick) o.onPick(a); };
  svg.addEventListener("click", (e) => { const t = e.target.closest(".tl"); if (t) pick_(t); });
  svg.addEventListener("keydown", (e) => { const t = e.target.closest(".tl"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick_(t); } });
 });
}

/* ---------- Pipeline: kanban with drag, keyboard moves and a lead chart ---------- */
function pgPipe(_, ctx) {
 setActs(`<button class="btn" type="button" data-do="pipeMine">${ic("user")}<span>${UI.pipeOwner === S.me.id ? "Show everyone" : "Only mine"}</span></button><button class="btn primary" type="button" data-do="newDeal">${ic("plus")}<span>New deal</span></button>`);
 const r = seeded(31), td = (TODAY.getDay() + 6) % 7;
 const tw = DAY.map((_, i) => (i <= td ? 2 + Math.round(r() * 6) : 0)), lw = DAY.map(() => 2 + Math.round(r() * 6));

 if (e.target.closest("[data-theme-toggle]")) setTimeout(() => store.set(KEY + ":theme", APP.theme()));
 const a = e.target.closest("[data-do]");

 const op = e.target.closest("[data-open]");

 const cp = e.target.closest("[data-copy]");
 if (cp && !cp.closest(".cc-dialog")) { try { navigator.clipboard.writeText(cp.dataset.copy); } catch (_) { /* blocked */ } toast("Copied " + cp.dataset.copy); return; }
 const sg = e.target.closest("[data-seg]");
 if (sg) {
  $$(`[data-seg="${sg.dataset.seg}"]`).forEach((b) => b.setAttribute("aria-pressed", String(b === sg)));
  const v = sg.dataset.v;
  if (sg.dataset.seg === "fn") { UI.fnMode = v; funnel($("#fn")); }
  if (sg.dataset.seg === "rev") { UI.revRange = +v; revChart(); }
