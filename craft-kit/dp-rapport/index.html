  if (sg.dataset.seg === "amap") { UI.areaMetric = v; drawAreaMap(); drawAreaSide(); }
  return;
 }
 const deal_ = e.target.closest(".deal");
 if (deal_ && !e.target.closest("button")) { openDeal(deal_.dataset.deal); return; }
 const po = e.target.closest("[data-pown]");
 if (po) { UI.pipeOwner = po.dataset.pown; $$("[data-pown]").forEach((b) => b.setAttribute("aria-pressed", String(b === po))); drawBoard(); return; }
 const tf = e.target.closest("[data-tf]");
 if (tf) { UI.tf = tf.dataset.tf; $$("[data-tf]").forEach((b) => b.setAttribute("aria-pressed", String(b === tf))); drawTasks(); return; }
 const tm = e.target.closest("[data-team]");
 if (tm) { UI.team = tm.dataset.team; $$("[data-team]").forEach((b) => b.setAttribute("aria-pressed", String(b === tm))); $("#mgrid").innerHTML = teamCards(); enter($("#mgrid")); fillBars($("#mgrid")); return; }
 const ar = e.target.closest("[data-area]");
 if (ar) { UI.areaSel = ar.dataset.area; $$("#amap .tl").forEach((t) => t.classList.toggle("sel", t.dataset.a === UI.areaSel)); if ($("#amap")._o) $("#amap")._o.sel = UI.areaSel; drawAreaSide(); return; }
 const ms = e.target.closest("[data-ms]");
 if (ms) { const p = proj(cur().id), m = p.ms.find((x) => x.id === ms.dataset.ms); m.done = !m.done; save(); toast(m.done ? "Milestone done" : "Milestone reopened"); rerender(); return; }
 const md = e.target.closest("[data-msdel]");
 if (md) { const p = proj(cur().id); confirmBox("Remove this milestone?", "Remove").then((ok) => { if (ok) { p.ms = p.ms.filter((x) => x.id !== md.dataset.msdel); save(); rerender(); } }); return; }
 const st = e.target.closest("[data-stab]");
 if (st) { UI.setTab = st.dataset.stab; $$("[role=tab][data-stab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.stab === UI.setTab))); const pn = $("#spanel"); pn.setAttribute("aria-labelledby", "tab-" + UI.setTab); pn.innerHTML = setPanel(); pn.classList.remove("cc-in"); void pn.offsetWidth; pn.classList.add("cc-in"); return; }
 const al = e.target.closest("[data-alert]");
 if (al) { const k = al.dataset.alert; S.alerts[k] = !S.alerts[k]; al.setAttribute("aria-checked", String(S.alerts[k])); save(); toast(S.alerts[k] ? "Alert on" : "Alert off"); return; }
 const ui = e.target.closest("[data-ui]");
 if (ui) { if (ui.dataset.ui === "density") S.ui.density = S.ui.density === "compact" ? "comfortable" : "compact"; else S.ui.motion = !S.ui.motion; ui.setAttribute("aria-checked", String(ui.dataset.ui === "density" ? S.ui.density === "compact" : S.ui.motion)); save(); applyUi(); return; }
 const tp = e.target.closest("[data-theme-pick]");
 if (tp) { const v = tp.dataset.themePick; store.set(KEY + ":theme", v); setTheme(v === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : v); $$("[data-theme-pick]").forEach((b) => b.setAttribute("aria-pressed", String(b === tp))); return; }
});
document.addEventListener("keydown", (e) => {
 const d = e.target.closest && e.target.closest(".deal");
 if (d && e.target === d && e.key === "Enter") { e.preventDefault(); openDeal(d.dataset.deal); }
});
document.addEventListener("input", (e) => {
 if (e.target.id === "pipeQ") { UI.pipeQ = e.target.value; drawBoard(); }
 if (e.target.matches && e.target.matches('.stg input[type="range"]')) e.target.nextElementSibling.textContent = e.target.value + "%";
});
document.addEventListener("change", (e) => { if (e.target.id === "pipeSort") { UI.pipeSort = e.target.value; drawBoard(); } });
document.addEventListener("submit", (e) => {
 const f = e.target;
 if (f.id === "qadd") {
  e.preventDefault();
  const t = $("#qaT"), v = t.value.trim();
  if (v.length < 4) { t.setAttribute("aria-invalid", "true"); $("#qaE").textContent = "Describe the task in a few words"; t.focus(); return; }
  t.removeAttribute("aria-invalid"); $("#qaE").textContent = "";
  S.tasks.unshift({ id: uid(), title: v, due: $("#qaD").value || iso(TODAY), pri: "Medium", owner: $("#qaO").value, deal: null, project: null, done: false });
  save(); t.value = ""; drawTasks(); drawSide(); toast("Task added");
 }
 if (f.id === "msAdd") {
  e.preventDefault();
  const t = $("#msT"), v = t.value.trim(), dt = $("#msD").value;
  if (v.length < 3 || !dt) { t.setAttribute("aria-invalid", "true"); $("#msE").textContent = !dt ? "Pick a date" : "Name the milestone"; t.focus(); return; }
  const p = proj(cur().id); p.ms.push({ id: uid(), t: v, date: dt, done: false }); p.ms.sort((a, b) => (a.date < b.date ? -1 : 1)); save(); toast("Milestone added"); rerender();
 }
 const sf = f.dataset && f.dataset.sf;
 if (!sf) return;
 e.preventDefault();
 const val = (n) => (f.elements[n] ? f.elements[n].value.trim() : "");
 const err = (n, m) => { const el = $("#s-" + n + "-e", f); if (el) el.textContent = m; const inp = f.elements[n]; if (inp) m ? inp.setAttribute("aria-invalid", "true") : inp.removeAttribute("aria-invalid"); return !!m; };
 if (sf === "profile") {
  const bad = [err("name", val("name").length < 3 ? "Your full name, please" : ""), err("title", !val("title") ? "Add a job title" : ""), err("email", !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val("email")) ? "That email does not look right" : ""), err("phone", val("phone") && !/^[+\d][\d\s()-]{6,}$/.test(val("phone")) ? "Digits and spaces only" : "")].some(Boolean);
  if (bad) { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
  Object.assign(S.me, { name: val("name"), title: val("title"), email: val("email"), phone: val("phone"), tz: f.elements.tz.value, sig: f.elements.sig.value });
  const me = mem(S.me.id); me.name = S.me.name; me.role = S.me.title; me.email = S.me.email;
  save(); drawSide(); toast("Profile saved");
 }
 if (sf === "workspace") {
  const tg = +val("target"), w = +val("watt");
  const bad = [err("wname", val("wname").length < 2 ? "Add the company name" : ""), err("town", !val("town") ? "Add a town" : ""), err("target", !(tg >= 50 && tg <= 5000) ? "Between 50 and 5,000 kW" : ""), err("watt", !(w >= 300 && w <= 700) ? "Between 300 and 700 W" : "")].some(Boolean);
  if (bad) return;
  Object.assign(S.ws, { name: val("wname"), town: val("town"), target: tg, watt: w }); save(); drawSide(); toast("Workspace saved");
 }
 if (sf === "stages") {
  const names = S.stages.map((_, i) => $("#sn-" + i).value.trim());
  const msg = names.some((n) => n.length < 2) ? "Every stage needs a name" : new Set(names.map((n) => n.toLowerCase())).size < names.length ? "Stage names must be different" : "";
  $("#stE").textContent = msg;
  if (msg) return;
  S.stages.forEach((s, i) => { s.name = names[i]; s.odds = +$("#so-" + i).value; }); save(); toast("Stages saved"); drawSide();
 }
});
document.addEventListener("reset", (e) => { if (e.target.dataset && e.target.dataset.sf) setTimeout(() => toast("Changes undone"), 0); });
const cur = () => { const p = location.hash.replace(/^#\/?/, "").split("/"); return { name: p[0], id: p[1] || "" }; };
function applyUi() { document.documentElement.classList.toggle("compact", S.ui.density === "compact"); if (!S.ui.motion) stopFx(); }

/* ---------- Live feed: a new event every few seconds ---------- */
const FEEDT = [["tobias", "finished the roof survey at", "ladder", "var(--s-survey)"], ["nell", "sent a panel layout to", "ruler", "var(--s-design)"], ["maya", "booked a survey for", "calendar", "var(--s-survey)"], ["kwame", "fitted the inverter for", "plug", "var(--s-live)"], ["rafael", "emailed a quote to", "mail", "var(--s-lead)"], [null, "opened the quote:", "eye", "var(--apricot)"], ["martin", "logged a call with", "call", "var(--s-lead)"], ["talia", "added a battery option for", "battery", "var(--accent)"]];
function tickFeed() {
 if (!S.alerts.feed || !S.ui.motion || RM) return;
 const t = FEEDT[Math.floor(Math.random() * FEEDT.length)], d = S.deals[Math.floor(Math.random() * S.deals.length)];
 if (!d) return;
 S.feed.unshift({ id: uid(), who: t[0], verb: t[1], deal: d.name, icon: t[2], c: t[3], at: Date.now(), area: area(d.area).name });
 S.feed = S.feed.slice(0, 30);
 save();
 const ul = $("#feedList");
 if (ul) ul.innerHTML = feedHTML(true);
}

/* ---------- Boot ---------- */
ROUTES = { dashboard: pgDash, pipeline: pgPipe, customers: pgCust, tasks: pgTasks, areas: pgAreas, team: pgTeam, settings: pgSettings, project: pgProject, member: pgMember };
(function () { const q = new URLSearchParams(location.search).get("theme"); const saved = store.get(KEY + ":theme", "system"); if (!q && saved !== "system") document.documentElement.dataset.theme = saved; })();

drawSide();
drawBell();
initShell(cmds);

route();
every(6500, tickFeed);
