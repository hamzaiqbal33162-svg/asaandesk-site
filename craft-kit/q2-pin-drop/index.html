<!doctype html>
<!-- Chill & Craft · Pin Drop · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pin Drop · location card with a hand-drawn map</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: paper map in sage and terracotta (light), night map (dark) ---------- */
  :root {
    --bg: #ece4d3; --bg-2: #f7f1e4; --card: #fffcf4; --edge: rgba(45, 51, 40, 0.1); --ink: #2b3127; --muted: #6f7466; --soft: #f1ebdc; --soft-2: #e6dcc7;
    --paper: #f3ecdc; --block: #e4d8bf; --block-2: #ddd0b3; --street: #fffaf0; --main: #ffffff; --casing: #d6c9ad; --park: #c9dfb0; --tree: #8fb86a; --water: #b4d6df; --water-2: #d3e8ed; --label: #8a826c;
    --pin: #d9542b; --pin-2: #f27b4f; --route: #d9542b; --trail: #8f2d12; --you: #2f7de1; --good: #2d9a5f; --warn: #d98a12; --bad: #c4423b;
    --shadow: rgba(60, 50, 20, 0.3); --focus: #d9542b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c100e; --bg-2: #151c18; --card: #161e1a; --edge: rgba(255, 255, 255, 0.08); --ink: #e8efe9; --muted: #9aa89f; --soft: #1e2823; --soft-2: #29352f;
    --paper: #131a16; --block: #1c2520; --block-2: #202a24; --street: #2a3530; --main: #36443d; --casing: #0e1411; --park: #1b3124; --tree: #2e5a3c; --water: #143039; --water-2: #1c3f4a; --label: #7f8f86;
    --pin: #ff7448; --pin-2: #ff9a74; --route: #ff7448; --trail: #ffd2c0; --you: #5aa2ff; --good: #4fd18b; --warn: #f5b74a; --bad: #ff6e66;
    --shadow: rgba(0, 0, 0, 0.7); --focus: #ff9a74;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  .stage { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; overflow: clip;
    background: radial-gradient(70% 60% at 70% 10%, var(--bg-2), transparent 70%), var(--bg); }
  /* faint contour lines drifting behind the card */
  .contour { position: absolute; inset: -10%; pointer-events: none; opacity: 0.5; color: var(--soft-2); animation: drift 40s linear infinite alternate; }
  @keyframes drift { to { transform: translate(-3%, 2%) rotate(3deg); } }

  .card { position: relative; width: min(860px, 100%); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); border-radius: 28px; background: var(--card); border: 1px solid var(--edge); overflow: hidden;
    box-shadow: 0 50px 80px -50px var(--shadow), 0 10px 24px -18px var(--shadow); animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.12) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(44px) scale(0.96); } }

  /* ---------- Map ---------- */
  .map { position: relative; min-height: 260px; background: var(--paper); overflow: hidden; }
  .map > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(0.5, 0, 0.3, 1) forwards; animation-delay: var(--d, 0s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .blk { opacity: 0; animation: fade 0.6s ease forwards; animation-delay: var(--d, 0s); }
  @keyframes fade { to { opacity: 1; } }
  .tree { transform-box: fill-box; transform-origin: center bottom; animation: tree 0.5s cubic-bezier(0.3, 2, 0.5, 1) backwards, sway 4s ease-in-out infinite; animation-delay: var(--d, 0s), calc(var(--d, 0s) + 0.5s); }
  @keyframes tree { from { transform: scale(0); } }
  @keyframes sway { 50% { transform: rotate(4deg); } }
  .wave { fill: none; stroke: var(--water-2); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  .lbl { fill: var(--label); font-size: 7.5px; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; animation: fade 0.8s ease forwards 1.3s; }

  .route { fill: none; stroke: var(--route); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .route.in { stroke-dashoffset: 0; transition: stroke-dashoffset 0.95s cubic-bezier(0.5, 0, 0.25, 1); }
  .route.out { stroke-dashoffset: -1; transition: stroke-dashoffset 0.35s cubic-bezier(0.6, 0, 0.8, 0.4); }
  .route-hi { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 3 5; opacity: 0; transition: opacity 0.4s; animation: flow 1.6s linear infinite; }
  .route.in ~ .route-hi.on { opacity: 0.85; }
  .trail { fill: none; stroke: var(--trail); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }

  .you .halo { fill: var(--you); opacity: 0.18; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
  @keyframes halo { from { transform: scale(0.6); opacity: 0.35; } to { transform: scale(2.2); opacity: 0; } }
  .you .cone { fill: var(--you); opacity: 0.22; transform-box: view-box; }
  .you { opacity: 0; animation: fade 0.5s ease forwards 1.2s; }

  /* the pin falls, squashes on landing and springs back; rings ripple from its foot */
  .pin { cursor: pointer; }
  .pin .body { transform-box: fill-box; transform-origin: 50% 100%; animation: pindrop 0.95s cubic-bezier(0.5, 0, 0.6, 1) backwards 1s; }
  @keyframes pindrop {
    0% { transform: translateY(-140px) scale(0.9, 1.1); opacity: 0; }
    55% { transform: translateY(0) scale(0.92, 1.08); opacity: 1; }
    66% { transform: translateY(0) scale(1.22, 0.72); }
    80% { transform: translateY(-12px) scale(0.94, 1.06); }
    92% { transform: translateY(0) scale(1.06, 0.94); }
    100% { transform: none; }
  }
  .pin .shade { transform-box: fill-box; transform-origin: center; animation: shade 0.95s ease backwards 1s; fill: rgba(40, 20, 0, 0.28); }
  @keyframes shade { 0% { transform: scale(0.2); opacity: 0; } 55% { transform: scale(1.2); opacity: 1; } 100% { transform: none; } }
  .pin .rip { fill: none; stroke: var(--pin); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; opacity: 0; animation: rip 2.6s ease-out infinite 2s; }
  .pin .rip.r2 { animation-delay: 3.3s; }
  @keyframes rip { from { transform: scale(0.3); opacity: 0.8; } to { transform: scale(2.6); opacity: 0; } }
  .pin.hop .body { animation: hop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes hop { 30% { transform: translateY(-16px) scale(0.92, 1.1); } 60% { transform: scale(1.12, 0.88); } }

  .mover { opacity: 0; transition: opacity 0.3s; }
  .mover.on { opacity: 1; }
  .mover .ring { fill: #fff; stroke: var(--trail); stroke-width: 2; }
  .mover .arrow { fill: var(--trail); }

  .bubble { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 8px)) scale(0.6); opacity: 0; padding: 8px 12px; border-radius: 12px; background: var(--ink); color: var(--card); font-size: 12px; font-weight: 720; white-space: nowrap; pointer-events: none; transition: opacity 0.25s, transform 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
  .bubble.on { opacity: 1; transform: translate(-50%, calc(-100% - 8px)); }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 30px); opacity: 0; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 14px; background: var(--card); color: var(--ink); font-size: 13px; font-weight: 720; white-space: nowrap; box-shadow: 0 14px 30px -14px var(--shadow); transition: opacity 0.3s, transform 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast svg { width: 18px; height: 18px; fill: none; stroke: var(--good); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .zoom { position: absolute; right: 12px; top: 12px; display: grid; gap: 1px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 18px -10px var(--shadow); }
  .zoom button { width: 34px; height: 32px; border: 0; cursor: pointer; background: var(--card); display: grid; place-items: center; }
  .zoom button:active { background: var(--soft); }
  .zoom svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

  /* ---------- Info ---------- */
  .info { padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .logo { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, var(--pin), var(--pin-2)); color: #fff; box-shadow: 0 10px 18px -10px var(--pin); }
  .logo svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .logo .steam { animation: steam 2.4s ease-in-out infinite; }
  .logo .steam.s2 { animation-delay: -1.2s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-3px); } }
  .head .t { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 830; }
  .meta { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .meta svg { width: 12px; height: 12px; fill: #f2a900; }
  .fav { width: 40px; height: 40px; border: 0; border-radius: 13px; cursor: pointer; flex: none; background: var(--soft); display: grid; place-items: center; transition: transform 0.45s cubic-bezier(0.3, 1.9, 0.5, 1), background 0.3s; }
  .fav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; transition: fill 0.25s, stroke 0.25s; }
  .fav[aria-pressed="true"] svg { fill: var(--pin); stroke: var(--pin); }
  .fav.pop { animation: fav 0.5s cubic-bezier(0.3, 1.9, 0.5, 1); }
  @keyframes fav { 35% { transform: scale(0.8); } 70% { transform: scale(1.15); } }

  .status { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; color: var(--muted); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st, var(--good)); position: relative; flex: none; }
  .status .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: beat 2s ease-out infinite; }
  @keyframes beat { to { transform: scale(2.8); opacity: 0; } }
  .status b { color: var(--st, var(--good)); font-weight: 780; }
  address { font-style: normal; font-size: 13.5px; line-height: 1.45; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 16px; background: var(--soft); position: relative; }
  .modes .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px - 12px) / 3); border-radius: 12px; background: var(--card); box-shadow: 0 6px 14px -8px var(--shadow), 0 0 0 1px var(--edge); transform: translateX(calc(var(--m, 2) * (100% + 6px))); transition: transform 0.55s cubic-bezier(0.3, 1.45, 0.45, 1); }
  .mode { position: relative; z-index: 1; height: 50px; border: 0; border-radius: 12px; background: none; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); transition: color 0.3s; }
  .mode svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .mode small { font-size: 11.5px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .mode[aria-pressed="true"] { color: var(--ink); }
  .mode[aria-pressed="true"] svg { color: var(--pin); animation: modehop 0.5s cubic-bezier(0.3, 1.9, 0.5, 1); }
  @keyframes modehop { 40% { transform: translateY(-4px) scale(1.12); } }
  .eta { margin: 0; font-size: 13px; color: var(--muted); }
  .eta b { font-size: 22px; color: var(--ink); font-weight: 850; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-right: 2px; }

  .acts { display: flex; gap: 8px; margin-top: auto; }
  .go { position: relative; flex: 1; height: 48px; border: 0; border-radius: 15px; cursor: pointer; overflow: hidden; font-size: 15px; font-weight: 790; color: #fff; background: linear-gradient(135deg, var(--pin), var(--pin-2)); box-shadow: 0 16px 26px -16px var(--pin); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.45s cubic-bezier(0.3, 1.8, 0.5, 1); }
  :root[data-theme="dark"] .go { color: #2b0e02; }
  .go:active { transform: scale(0.96); }
  .go .pr { position: absolute; inset: 0; width: var(--p, 0%); background: rgba(255, 255, 255, 0.22); }
  .go span, .go svg { position: relative; }
  .go svg { width: 18px; height: 18px; fill: currentColor; }
  .go[data-state="done"] { background: var(--good); }
  .sq { width: 48px; height: 48px; border: 0; border-radius: 15px; cursor: pointer; flex: none; background: var(--soft); display: grid; place-items: center; transition: background 0.3s, color 0.3s, transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); position: relative; }
  .sq:active { transform: scale(0.92); }
  .sq svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sq.ok { background: color-mix(in srgb, var(--good) 16%, var(--card)); color: var(--good); }
  .sq[aria-expanded="true"] { background: var(--ink); color: var(--card); }
  .tipx { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 6px); padding: 5px 9px; border-radius: 8px; background: var(--ink); color: var(--card); font-size: 11.5px; font-weight: 720; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .sq.ok .tipx { opacity: 1; transform: translate(-50%, 0); }

  .hours { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows 0.5s cubic-bezier(0.3, 1.2, 0.4, 1), visibility 0s 0.5s; margin-top: -12px; }
  .hours.open { grid-template-rows: 1fr; visibility: visible; transition-delay: 0s; margin-top: 0; }
  .hours > div { min-height: 0; overflow: hidden; }
  .hours ul { list-style: none; margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--soft); display: grid; gap: 4px; font-size: 12.5px; }
  .hours li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 4px; border-radius: 6px; }
  .hours li.today { background: var(--card); font-weight: 760; }
  .hours li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .hours.open li { animation: rowin 0.45s cubic-bezier(0.3, 1.5, 0.5, 1) backwards; animation-delay: calc(var(--k) * 40ms + 120ms); }
  @keyframes rowin { from { opacity: 0; transform: translateX(-10px); } }

  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 40; width: 26px; height: 26px; pointer-events: none; opacity: 0; transform: translate(var(--gx, 70vw), var(--gy, 105vh)); transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.35s; }
  .ghost.show { opacity: 1; }
  .ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; }
  .ghost.tap svg { transform: scale(0.8); }
  .ghost::after { content: ""; position: absolute; left: -10px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--pin); opacity: 0; }
  .ghost.tap::after { animation: ring 0.5s ease-out; }
  @keyframes ring { from { opacity: 0.95; transform: scale(0.3); } to { opacity: 0; transform: scale(1.7); } }

  @media (max-width: 760px) {
    .stage { align-items: flex-start; padding-top: max(20px, calc(50svh - 340px)); }
    .card { grid-template-columns: minmax(0, 1fr); max-width: 440px; border-radius: 26px; }
    .map { height: 236px; min-height: 0; }
    .info { padding: 16px 16px 16px; gap: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <svg class="contour" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" id="contour"></g></svg>
  <article class="card" aria-labelledby="ttl">
    <div class="map" id="map">
      <svg id="mapSvg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map showing your location and the route to Chai and Pages">
        <rect x="-200" y="-200" width="800" height="660" fill="var(--paper)"/>
        <g id="blocks"></g>
        <!-- canal -->
        <path d="M-20 26 C 110 50, 170 120, 250 160 S 370 222, 420 236" fill="none" stroke="var(--water)" stroke-width="16" stroke-linecap="round" pathLength="1" class="draw" style="--d:.1s"/>
        <path class="wave" d="M-20 26 C 110 50, 170 120, 250 160 S 370 222, 420 236"/>
        <!-- park -->
        <path class="blk" style="--d:.5s" d="M122 172q-4-8 6-9l70-4q10 0 10 9l-2 52q0 9-9 9l-68 2q-9 0-9-9z" fill="var(--park)"/>
        <g id="trees" fill="var(--tree)"></g>
        <g id="streets" fill="none" stroke-linecap="round"></g>
        <text class="lbl" x="16" y="146">Main Blvd</text>
        <text class="lbl" x="266" y="244" transform="rotate(-90 266 244)">MM Alam Rd</text>
        <text class="lbl" x="58" y="62" transform="rotate(14 58 62)">Canal Bank</text>
        <text class="lbl" x="134" y="226" style="font-size:6.5px">Rose Garden</text>
        <!-- route, progress trail and the traveller -->
        <path class="route" id="route" pathLength="1"/>
        <path class="trail" id="trail" pathLength="1"/>
        <path class="route-hi" id="routeHi"/>
        <g class="you" id="you" transform="translate(70 215)">
          <circle class="halo" r="12"/><path class="cone" d="M0 0L-9 -22A24 24 0 0 1 9 -22z"/>
          <circle r="6.5" fill="#fff"/><circle r="4.4" fill="var(--you)"/>
        </g>
        <g class="mover" id="mover"><circle class="ring" r="7.5"/><path class="arrow" d="M-3.5 3.2L0 -4.2 3.5 3.2 0 1.4z"/></g>
        <g class="pin" id="pin" transform="translate(300 80)">
          <ellipse class="shade" cx="0" cy="1" rx="9" ry="3.2"/>
          <circle class="rip" cx="0" cy="1" r="8"/><circle class="rip r2" cx="0" cy="1" r="8"/>
          <g class="body">
            <path d="M0 0C-3-9-14-15-14-26a14 14 0 0 1 28 0C14-15 3-9 0 0z" fill="var(--pin)"/>
            <path d="M0 -3C-2-9-11-14-11-26a11 11 0 0 1 11-11" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="0" cy="-26" r="8" fill="#fff"/>
            <path d="M-4.5 -29h7v4.2a3.5 3.5 0 0 1-7 0zM2.5 -28h1.4a1.6 1.6 0 0 1 0 3.2H2.4" fill="none" stroke="var(--pin)" stroke-width="1.5" stroke-linejoin="round"/>
          </g>
        </g>
      </svg>
      <div class="bubble" id="bubble">Chai &amp; Pages · 2nd floor</div>
      <div class="zoom" role="group" aria-label="Zoom the map">
        <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
        <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      </div>
      <div class="toast" id="toast" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7.5"/></svg>You have arrived</div>
    </div>

    <div class="info">
      <div class="head">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 10h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H15.5"/><path class="steam" d="M8.5 7.5c-1-1.2 1-2 0-3.5"/><path class="steam s2" d="M12 7.5c-1-1.2 1-2 0-3.5"/></svg></span>
        <div class="t">
          <h1 id="ttl">Chai &amp; Pages</h1>

<canvas class="fx" aria-hidden="true"></canvas>

    })();

      bike: { d: "M70 215L70 200L175 200L175 160Q220 128 262 108L270 105L300 105L300 84", min: 7, km: "1.9 km", via: "the canal path", n: 1 },

    }

    }
    modeBtns.forEach(function (b) { b.addEventListener("click", function () { setMode(b.dataset.m); }); });

    /* ---------- Camera: the map's viewBox eases toward a target ---------- */

    function aimAt(cx, cy, w) {

      if (w >= 400) goal = { x: 0, y: 0, w: 400, h: 260 };

    }
    function camStep() {

      camRaf = done ? 0 : requestAnimationFrame(camStep);
    }
    function zoomBy(f) {

    }
    $("#zin").addEventListener("click", function () { zoomBy(1.4); });
    $("#zout").addEventListener("click", function () { zoomBy(1 / 1.4); });

    /* ---------- Pin: tap for a label ---------- */

    /* ---------- Directions: the traveller follows the route while the map follows it ---------- */

    function directions() {

      mover.classList.add("on");

    });
    var copyBtn = $("#copy"), ADDR = "14-B, MM Alam Road, Gulberg III, Lahore";
    function copied(ok) {

    var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    function hh(h) { return h === 24 || h === 0 ? "12 AM" : h === 12 ? "12 PM" : h > 12 ? h - 12 + " PM" : h + " AM"; }

      if (h >= o[0] && h < o[1]) {

      var today = new Date().getDay(), h = "";

    function setHours(open) {

    }

    /* ---------- Confetti ---------- */
    var fx = $(".fx"), ctx = fx.getContext("2d"), bits = [], raf = 0;
    function sizeFx() { var d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }

    }

  })();
