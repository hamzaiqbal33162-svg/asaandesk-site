<!doctype html>
<!-- Chill and Craft · Tide Tabs · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tide Tabs · tab bar where the active tab fills with water</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #dff3f3;
    --bg-dots: rgba(16, 120, 130, 0.08);
    --app: #ffffff;
    --app-edge: #cfe7e8;
    --ink: #0f2e33;
    --muted: #5d7c80;
    --soft: #eef8f8;
    --line: #dcecec;
    --bar: #f4fbfb;
    --liq: #13a7bb;
    --liq-2: #6fdbe6;
    --on-liq: #ffffff;
    --focus: #0b7f8f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #061417;
    --bg-dots: rgba(80, 220, 230, 0.06);
    --app: #0c1f23;
    --app-edge: #17353a;
    --ink: #e2f7f8;
    --muted: #84a7ab;
    --soft: #112b30;
    --line: #18383d;
    --bar: #0a1a1d;
    --liq: #20c3d4;
    --liq-2: #0f7f8d;
    --on-liq: #04181b;
    --focus: #6fe6f0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.6px);
    background-size: 22px 22px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* ---------- Stage + app window ---------- */
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .app {
    width: min(420px, 100%);
    height: min(520px, calc(100vh - 32px));
    min-height: 420px;
    background: var(--app);
    border: 1px solid var(--app-edge);
    border-radius: 28px;
    box-shadow: 0 30px 60px -36px rgba(4, 60, 70, 0.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .app-head {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 20px 6px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(160deg, var(--liq-2), var(--liq));
    display: grid; place-items: center;
  }
  .logo svg { width: 18px; height: 18px; fill: #fff; }
  .app-head b { font-size: 15px; }
  .app-head small { display: block; color: var(--muted); font-size: 12px; }

  /* ---------- Content per tab ---------- */
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 14px; }
  .content h1 { font-size: 22px; margin: 6px 0 12px; letter-spacing: -0.02em; }
  .view.enter { animation: fade 0.4s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }

  .plants { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .plants li {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
    background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
    font-size: 14px;
  }
  .plants small { color: var(--muted); font-size: 12px; }
  .meter { grid-column: 1 / -1; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--liq-2), var(--liq)); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; padding: 14px; font-size: 13px; }
  .card b { display: block; font-size: 20px; margin-top: 4px; }
  .card small { color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding: 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 16px; }
  .chart span { flex: 1; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, var(--liq-2), var(--liq)); position: relative; }
  .chart em { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; font-style: normal; color: var(--muted); }
  .chart-wrap { padding-bottom: 18px; }

  /* ---------- The tab bar ---------- */
  .bar {
    display: flex;
    gap: 4px;
    padding: 12px 12px 14px;
    background: var(--bar);
    border-top: 1px solid var(--line);
  }
  .tab {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:focus-visible { outline-offset: 2px; }
  .pill {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 44px;
    padding: 0 12px;
    border-radius: 999px;
    overflow: hidden;
    isolation: isolate;
    transition: background-color 0.3s, transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1);
  }
  .tab:hover .pill { background: var(--soft); }
  .tab:active .pill { transform: scale(0.9); transition-duration: 0.08s; }
  .ico, .lbl { position: relative; z-index: 1; transition: color 0.3s 0.12s; }
  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .lbl {
    font-size: 13px;
    font-weight: 650;
    white-space: nowrap;
    max-width: 0;
    margin-left: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-width 0.45s cubic-bezier(0.3, 1.2, 0.5, 1), margin 0.45s, opacity 0.3s, color 0.3s 0.12s;
  }

  /* The liquid: a wave on top of a solid body. It sits below the pill and rises up into it. */
  .liquid {
    position: absolute;
    top: 0;
    left: -25%;
    right: -25%;
    bottom: -40%; /* oversized so it can tilt without showing its corners */
    z-index: 0;
    transform: translateY(105%);
    transition: transform 0.38s cubic-bezier(0.55, 0, 0.85, 0.4); /* draining */
  }
  .liquid::after {
    content: "";
    position: absolute;
    top: 10px; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, var(--liq), var(--liq-2) 180%);
  }
  .wave { position: absolute; top: 0; left: 0; width: 200%; height: 11px; }
  .wave path { fill: var(--liq); }
  .wave.back { opacity: 0.45; animation: slosh 2.4s linear infinite reverse; }
  .wave.front { animation: slosh 1.6s linear infinite; }
  @keyframes slosh { to { transform: translateX(-50%); } }

  .tab[aria-current="page"] { color: var(--on-liq); }
  .tab[aria-current="page"] .liquid {
    transform: translateY(4%);
    transition: transform 0.8s 0.22s cubic-bezier(0.25, 1.45, 0.45, 1); /* filling, with a little slosh */
    animation: tilt 1.2s 0.2s ease-out;
  }
  /* the surface tips toward where the water came from, then settles */
  @keyframes tilt {
    0% { rotate: var(--tilt, 0deg); }
    40% { rotate: calc(var(--tilt, 0deg) * -0.55); }
    70% { rotate: calc(var(--tilt, 0deg) * 0.2); }
    100% { rotate: 0deg; }
  }
  .tab[aria-current="page"] .lbl { max-width: 90px; margin-left: 7px; opacity: 1; }

  /* icons react once their tab is full */
  .tab[aria-current="page"][data-anim="spin"] .ico { animation: sun-spin 0.9s 0.25s cubic-bezier(0.3, 1.4, 0.5, 1) backwards; }
  .tab[aria-current="page"][data-anim="sway"] .ico { animation: sway 1s 0.25s ease-out; transform-origin: 50% 100%; }
  .tab[aria-current="page"][data-anim="grow"] .ico { animation: grow 0.7s 0.25s cubic-bezier(0.3, 1.5, 0.5, 1) backwards; transform-origin: 50% 100%; }
  .tab[aria-current="page"][data-anim="nod"] .ico { animation: nod 0.6s 0.25s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes sun-spin { from { transform: rotate(-140deg) scale(0.5); } }
  @keyframes sway { 25% { transform: rotate(-16deg); } 50% { transform: rotate(10deg); } 75% { transform: rotate(-4deg); } }
  @keyframes grow { from { transform: scaleY(0.15); } }
  @keyframes nod { 35% { transform: translateY(3px) scale(1.12, 0.86); } 70% { transform: translateY(-2px); } }

  /* droplets that jump out when the drop lands */
  .splash { position: absolute; left: 50%; top: 4px; width: 0; height: 0; pointer-events: none; z-index: 2; }
  .splash i { position: absolute; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--liq); opacity: 0; }
  .splash i:nth-child(1) { --dx: -18px; --dy: -15px; }
  .splash i:nth-child(2) { --dx: -7px; --dy: -22px; width: 4px; height: 4px; }
  .splash i:nth-child(3) { --dx: 8px; --dy: -20px; }
  .splash i:nth-child(4) { --dx: 19px; --dy: -12px; width: 4px; height: 4px; }
  .tab.dropping .splash i { animation: splash 0.6s 0.3s cubic-bezier(0.2, 0.7, 0.4, 1); }
  @keyframes splash {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    50% { opacity: 1; transform: translate(calc(var(--dx) * 0.6), var(--dy)) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), 2px) scale(0.4); }
  }

  /* staggered entrance for the screen content */
  .in { animation: rise-in 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(16px) scale(0.96); } }
  .chart span.in { animation-name: bar-grow; transform-origin: 50% 100%; }
  @keyframes bar-grow { from { transform: scaleY(0); } }
  .plants li, .card { transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .plants li:hover, .card:hover { transform: translateY(-2px); }

  /* A single drop falls into the tab just before it fills */
  .drop {
    position: absolute;
    top: -16px;
    left: 50%;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    background: var(--liq);
    border-radius: 0 50% 50% 50%;
    transform: rotate(45deg);
    opacity: 0;
    pointer-events: none;
  }
  .tab.dropping .drop { animation: fall 0.34s cubic-bezier(0.5, 0, 1, 0.6); }
  @keyframes fall {
    0% { opacity: 0; transform: translateY(-6px) rotate(45deg) scale(0.6); }
    25% { opacity: 1; }
    100% { opacity: 1; transform: translateY(26px) rotate(45deg) scale(1); }
  }

  @media (max-width: 380px) {
    .pill { padding: 0 10px; }
    .tab[aria-current="page"] .lbl { margin-left: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
    }
    .tab.dropping .drop, .tab.dropping .splash i { animation: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="app">
    <header class="app-head">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5c3.6 4.3 6.5 8 6.5 11.4A6.5 6.5 0 0 1 5.5 14C5.5 10.5 8.4 6.8 12 2.5z"/></svg></span>
      <div><b>Leafline</b><small>Plant care for small balconies</small></div>
    </header>

    <section class="content" aria-labelledby="title">
      <div class="view" id="view">
        <h1 id="title"></h1>
        <div id="body"></div>
      </div>
    </section>

    <nav class="bar" aria-label="Sections">
      <button class="tab" type="button" aria-current="page">
        <span class="drop" aria-hidden="true"></span><span class="splash" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="pill">
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 6Q30 0 60 6T120 6T180 6T240 6V11H0z"/></svg>
            <svg class="wave front" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 5Q30 11 60 5T120 5T180 5T240 5V11H0z"/></svg>
          </span>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          <span class="lbl">Today</span>
        </span>
      </button>
      <button class="tab" type="button">
        <span class="drop" aria-hidden="true"></span><span class="splash" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="pill">
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 6Q30 0 60 6T120 6T180 6T240 6V11H0z"/></svg>
            <svg class="wave front" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 5Q30 11 60 5T120 5T180 5T240 5V11H0z"/></svg>
          </span>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 2.5-7 7-7.5.2 4.6-2.6 7.5-7 7.5z"/><path d="M12 15.5C12 12 9.8 9.6 5.5 9.2c-.2 3.9 2.2 6.3 6.5 6.3z"/></svg>
          <span class="lbl">Plants</span>
        </span>
      </button>
      <button class="tab" type="button">
        <span class="drop" aria-hidden="true"></span><span class="splash" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="pill">
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 6Q30 0 60 6T120 6T180 6T240 6V11H0z"/></svg>
            <svg class="wave front" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 5Q30 11 60 5T120 5T180 5T240 5V11H0z"/></svg>
          </span>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
          <span class="lbl">Stats</span>
        </span>
      </button>
      <button class="tab" type="button">
        <span class="drop" aria-hidden="true"></span><span class="splash" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="pill">
          <span class="liquid" aria-hidden="true">
            <svg class="wave back" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 6Q30 0 60 6T120 6T180 6T240 6V11H0z"/></svg>
            <svg class="wave front" viewBox="0 0 240 11" preserveAspectRatio="none"><path d="M0 5Q30 11 60 5T120 5T180 5T240 5V11H0z"/></svg>
          </span>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.2-3.6 3.8-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>
          <span class="lbl">Me</span>
        </span>
      </button>
    </nav>
  </div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
    var view = document.getElementById("view");
    var title = document.getElementById("title");
    var body = document.getElementById("body");
    var status = document.getElementById("status");
    var current = 0;

    // ---------- Demo content, one screen per tab ----------
    function plant(name, note, level) {
      return "<li><span>" + name + "<br><small>" + note + '</small></span><small>' + level + '%</small><span class="meter"><i style="width:' + level + '%"></i></span></li>';
    }
    function bar(h, day) {
      return '<span style="height:' + h + '%"><em>' + day + "</em></span>";
    }
    var screens = [
      { title: "3 plants need water", html: '<ul class="plants">' +
        plant("Money plant", "Living room · water today", 18) +
        plant("Aloe vera", "Balcony · water in 2 days", 46) +
        plant("Sweet basil", "Kitchen window · just watered", 92) + "</ul>" },
      { title: "Your plants", html: '<div class="grid">' +
        '<div class="card">Indoor<b>7</b><small>2 thirsty</small></div>' +
        '<div class="card">Balcony<b>5</b><small>all fine</small></div>' +
        '<div class="card">Herbs<b>3</b><small>1 thirsty</small></div>' +
        '<div class="card">Cactus<b>2</b><small>sleeping</small></div></div>' },
      { title: "Water this week", html: '<div class="chart-wrap"><div class="chart" role="img" aria-label="Litres used each day, highest on Friday">' +
        bar(40, "Mon") + bar(62, "Tue") + bar(35, "Wed") + bar(70, "Thu") + bar(92, "Fri") + bar(55, "Sat") + bar(30, "Sun") + "</div></div>" },
      { title: "Hi, Mahnoor", html: '<div class="grid">' +
        '<div class="card">Streak<b>21 days</b><small>keep it up</small></div>' +
        '<div class="card">Reminders<b>7:30 am</b><small>daily</small></div></div>' }
    ];

    function render(i) {
      title.textContent = screens[i].title;
      body.innerHTML = screens[i].html;
      view.classList.remove("enter");
      void view.offsetWidth; // restart the fade
      view.classList.add("enter");
      // rows, cards and chart bars arrive one after another
      Array.prototype.forEach.call(body.querySelectorAll(".plants li, .card, .chart span"), function (el, k) {
        el.style.animationDelay = 60 + k * 60 + "ms";
        el.classList.add("in");
      });
    }

    // each tab's icon has its own reaction (see the CSS)
    ["spin", "sway", "grow", "nod"].forEach(function (a, i) { tabs[i].dataset.anim = a; });

    function select(i) {
      if (i === current) return;
      // the water tips in from the side it travelled from
      tabs[i].style.setProperty("--tilt", (i > current ? -10 : 10) + "deg");
      tabs[current].removeAttribute("aria-current");
      // restart the falling drop on the new tab
      tabs[i].classList.remove("dropping");
      void tabs[i].offsetWidth;
      tabs[i].classList.add("dropping");
      tabs[i].setAttribute("aria-current", "page");
      current = i;
      render(i);
      status.textContent = tabs[i].textContent.trim() + " tab selected";
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () { select(i); });
      tab.addEventListener("animationend", function (e) {
        if (e.animationName === "splash") tab.classList.remove("dropping");
      });
      tab.addEventListener("keydown", function (e) {
        var next = null;
        if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
        else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = tabs.length - 1;
        if (next === null) return;
        e.preventDefault();
        tabs[next].focus();
        select(next);
      });
    });

    render(0);
  })();
</script>
</body>
</html>
