<!doctype html>
<!-- Chill & Craft · Print Run · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Run · export button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --bg1: #f6f2ea;
    --bg2: #e4dccd;
    --card: #fffdf9;
    --edge: #ebe3d4;
    --ink: #1c1b20;
    --soft: #6e685d;
    --row: #f6f1e8;
    --orange: #ff6a3d;
    --orange2: #e14d22;
    --body1: #3a3a42;
    --body2: #1f1f25;
    --paper: #fffef9;
    --ok: #18a058;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #1d1c22;
      --bg2: #08080a;
      --card: #17171b;
      --edge: #2a2a31;
      --ink: #f1efe9;
      --soft: #a39e93;
      --row: #202026;
      --body1: #4a4a55;
      --body2: #26262e;
      --paper: #f5f2e8;
      --ok: #3ccf86;
      --focus: #93c5fd;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1d1c22;
    --bg2: #08080a;
    --card: #17171b;
    --edge: #2a2a31;
    --ink: #f1efe9;
    --soft: #a39e93;
    --row: #202026;
    --body1: #4a4a55;
    --body2: #26262e;
    --paper: #f5f2e8;
    --ok: #3ccf86;
    --focus: #93c5fd;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body, .stage { grid-template-columns: minmax(0, 1fr); } /* fixed-width cards never widen the page */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2) 90%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { width: 100%; padding: 22px 16px; display: grid; place-items: center; }
  .card { position: relative; width: 660px; max-width: 100%; display: grid; grid-template-columns: 1fr 230px; gap: 18px; padding: 18px; border-radius: 26px; background: var(--card); border: 1px solid var(--edge); box-shadow: 0 30px 60px -36px rgba(30, 20, 10, .7); }

  /* ---------- Data table ---------- */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 2px 10px; flex-wrap: wrap; margin: 2px 2px 10px; }
  .head h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
  .head span { font-size: 12.5px; color: var(--soft); }
  table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 13.5px; }
  th { padding: 0 10px; text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  th:last-child, td:last-child { text-align: right; }
  td { padding: 8px 10px; background: var(--row); font-variant-numeric: tabular-nums; transition: opacity .25s; }
  td:first-child { border-radius: 10px 0 0 10px; width: 34px; padding-right: 0; }
  td:last-child { border-radius: 0 10px 10px 0; font-weight: 650; }
  tr.off td { opacity: .45; }
  td .city { color: var(--soft); font-size: 12px; }
  input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: var(--orange); cursor: pointer; vertical-align: middle; }
  .total { display: flex; justify-content: space-between; padding: 8px 10px 0; font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; }

  .formats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 0 12px; padding: 4px; border-radius: 14px; background: var(--row); border: 0; }
  .formats legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .formats label { position: relative; z-index: 1; padding: 8px 0; text-align: center; font-size: 13px; font-weight: 750; letter-spacing: .04em; color: var(--soft); cursor: pointer; border-radius: 10px; transition: color .25s; }
  .formats input { position: absolute; opacity: 0; pointer-events: none; }
  .formats input:checked + span { color: var(--ink); }
  .formats input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 6px; }
  .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 10px; background: var(--card); box-shadow: 0 4px 10px -6px rgba(0, 0, 0, .5); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .5s var(--spring); }

  .export {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 54px;
    border: 0;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--orange), var(--orange2));
    color: #fff;
    font: inherit;
    font-size: 15.5px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 14px 24px -14px var(--orange2), inset 0 1px 0 rgba(255, 255, 255, .3);
    transition: transform .4s var(--spring), filter .2s;
  }
  .export:hover:not(:disabled) { transform: translateY(-2px); }
  .export:active:not(:disabled) { transform: scale(.97); transition-duration: .1s; }
  .export:disabled { filter: grayscale(.7); opacity: .6; cursor: not-allowed; }
  .export[data-state="done"] { background: linear-gradient(180deg, #22b46a, #138a4c); box-shadow: 0 14px 24px -14px #138a4c; }
  .export:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .export svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .export .tick { display: none; }
  .export[data-state="done"] .tick { display: inline; }
  .export[data-state="done"] .out { display: none; }
  .export .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Printer ---------- */
  .bay { position: relative; align-self: center; display: flex; flex-direction: column; align-items: center; min-height: 380px; }
  .printer { position: relative; z-index: 2; width: 210px; height: 92px; margin-top: 46px; }
  .printer .tray { position: absolute; left: 34px; right: 34px; top: -20px; height: 34px; border-radius: 4px 4px 0 0; background: var(--paper); border: 1px solid rgba(0, 0, 0, .14); border-bottom: 0; transform: perspective(200px) rotateX(18deg); }
  .printer .body { position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, var(--body1), var(--body2)); box-shadow: 0 18px 26px -16px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .18); }
  .printer .slot { position: absolute; left: 24px; right: 24px; bottom: 14px; height: 8px; border-radius: 4px; background: #0b0b0e; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .8); }
  .printer .rail { position: absolute; left: 30px; right: 30px; bottom: 30px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .14); }
  .printer .headb { position: absolute; left: 30px; bottom: 26px; width: 26px; height: 11px; border-radius: 3px; background: linear-gradient(180deg, var(--orange), var(--orange2)); box-shadow: 0 0 10px rgba(255, 106, 61, .5); }
  .printer .led { position: absolute; right: 22px; top: 16px; width: 9px; height: 9px; border-radius: 50%; background: #5a5a64; animation: breathe 3s ease-in-out infinite; }
  .printer.on .led { background: #3cff8f; box-shadow: 0 0 10px #3cff8f; animation: blink .4s steps(2) infinite; }
  .printer .keys { position: absolute; left: 22px; top: 15px; display: flex; gap: 6px; }
  .printer .keys i { width: 16px; height: 9px; border-radius: 5px; background: rgba(255, 255, 255, .16); }
  .paper {
    position: absolute;
    z-index: 3;                 /* in front of the printer's lower lip, so it comes out of the slot */
    left: 50%;
    top: 120px;
    width: 152px;
    margin-left: -76px;
    height: 0;
    border-radius: 0 0 6px 6px;
    background: var(--paper);
    box-shadow: 0 10px 18px -10px rgba(0, 0, 0, .5);
    overflow: hidden;
    transform-origin: 50% 0;
  }
  .paper pre { margin: 0; padding: 8px 9px; font: 600 6.6px/13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #2b2a30; white-space: pre; overflow: hidden; }
  .paper .edge { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(180deg, rgba(0, 0, 0, .25), transparent); }
  .chipfile { position: absolute; z-index: 4; left: 50%; top: 176px; width: 54px; height: 64px; margin-left: -27px; border-radius: 8px; background: var(--paper); box-shadow: 0 10px 18px -8px rgba(0, 0, 0, .55); display: grid; place-items: center; font-size: 11px; font-weight: 900; letter-spacing: .06em; color: var(--orange2); opacity: 0; }
  .chipfile::before { content: ""; position: absolute; right: 0; top: 0; width: 15px; height: 15px; border-radius: 0 8px 0 5px; background: linear-gradient(225deg, var(--card) 50%, #e8e2d4 50%); }
  .downloads { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 14px; background: var(--row); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .downloads svg { width: 18px; height: 18px; fill: none; stroke: var(--soft); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .downloads b { min-width: 22px; padding: 1px 7px; border-radius: 10px; background: var(--orange); color: #fff; text-align: center; font-variant-numeric: tabular-nums; }
  .bit { position: absolute; width: 7px; height: 9px; border-radius: 1px; pointer-events: none; z-index: 4; }

  .note { margin: 10px 2px 0; font-size: 12.5px; color: var(--soft); min-height: 18px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @keyframes blink { 50% { opacity: .3; } }
  @keyframes breathe { 50% { background: #8a8a96; } }

  @media (max-width: 640px) {
    .card { grid-template-columns: 1fr; }
    .bay { order: -1; min-height: 312px; }
  }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="t">
    <div>
      <div class="head"><h1 id="t">Sales · November</h1><span>Pick rows, pick a format</span></div>
      <table>
        <thead><tr><th><span class="sr-only">Include</span></th><th>Customer</th><th>Amount</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="total"><span id="count">5 rows</span><span id="sum">PKR 0</span></div>
      <fieldset class="formats" id="formats">
        <legend>Export format</legend>
        <span class="pill" id="pill"></span>
        <label><input type="radio" name="fmt" value="csv" checked><span>CSV</span></label>
        <label><input type="radio" name="fmt" value="json"><span>JSON</span></label>
        <label><input type="radio" name="fmt" value="txt"><span>TXT</span></label>
      </fieldset>
      <button class="export" id="export" type="button" data-state="idle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g class="out"><path d="M6 9V3.5h12V9" /><rect x="3" y="9" width="18" height="8" rx="2" /><path d="M7 14h10v6.5H7z" /></g><path class="tick" d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        <span class="lbl" id="lbl">Export</span>
      </button>
      <p class="note" id="note">Makes a real file from the rows you pick.</p>
    </div>

    <div class="bay" id="bay" aria-hidden="true">
      <div class="printer" id="printer">
        <span class="tray"></span>
        <span class="body"></span>
        <span class="keys"><i></i><i></i></span>
        <span class="led"></span>
        <span class="rail"></span>
        <span class="headb" id="headb"></span>
        <span class="slot"></span>
      </div>
      <div class="paper" id="paper"><span class="edge"></span><pre id="ink"></pre></div>
      <div class="chipfile" id="chip">CSV</div>
      <div class="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v10M7.5 9.5L12 14l4.5-4.5M4 16v3h16v-3" /></svg>Downloads <b id="dl">0</b></div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
  // ---------- Print Run export button ----------
  const $ = (s) => document.querySelector(s);
  const rowsEl = $("#rows"), sumEl = $("#sum"), countEl = $("#count"), pill = $("#pill"), btn = $("#export"), lbl = $("#lbl");
  const note = $("#note"), statusEl = $("#status"), printer = $("#printer"), headb = $("#headb"), paper = $("#paper"), ink = $("#ink");
  const chip = $("#chip"), dl = $("#dl"), bay = $("#bay");
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const pkr = (n) => "PKR " + n.toLocaleString("en-IN");          // lakh-style grouping: 1,29,750

  // ---------- Run control ----------
  const STOP = new Error("stopped");
  let runId = 0, state = "idle", saved = 0;
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === runId ? res() : rej(STOP)), ms));

  // ---------- Data ----------
  const DATA = [
    { name: "Ayesha Siddiqui", city: "Lahore", amount: 42500 },
    { name: "Hamza Qureshi", city: "Karachi", amount: 18900 },
    { name: "Mehwish Raza", city: "Islamabad", amount: 27350 },
    { name: "Faisal Nadeem", city: "Faisalabad", amount: 9800 },
    { name: "Sana Iqbal", city: "Multan", amount: 31200 }
  ];
  DATA.forEach((d, i) => {
    d.on = true;
    const tr = document.createElement("tr");
    tr.innerHTML = '<td><input type="checkbox" checked></td><td><span class="nm"></span><br><span class="city"></span></td><td></td>';
    const cb = tr.querySelector("input");
    cb.setAttribute("aria-label", "Include " + d.name);
    tr.querySelector(".nm").textContent = d.name;
    tr.querySelector(".city").textContent = d.city;
    tr.lastChild.textContent = d.amount.toLocaleString("en-IN");
    cb.addEventListener("change", () => { d.on = cb.checked; tr.classList.toggle("off", !cb.checked); refresh(); });
    d.tr = tr; d.cb = cb;
    rowsEl.appendChild(tr);
  });
  const fmt = () => document.querySelector('input[name="fmt"]:checked').value;
  const picked = () => DATA.filter((d) => d.on);

  function refresh() {
    const list = picked();
    const total = list.reduce((s, d) => s + d.amount, 0);
    countEl.textContent = list.length + " of " + DATA.length + " rows";
    sumEl.textContent = pkr(total);
    const f = fmt();
    pill.style.setProperty("--i", ["csv", "json", "txt"].indexOf(f));
    if (state === "idle") {
      btn.disabled = !list.length;
      lbl.textContent = list.length ? "Export " + list.length + " row" + (list.length > 1 ? "s" : "") + " as " + f.toUpperCase() : "Pick at least one row";
    }
  }
  document.querySelectorAll('input[name="fmt"]').forEach((r) => r.addEventListener("change", refresh));

  // ---------- Build the real file ----------
  function build() {
    const list = picked(), f = fmt();
    const total = list.reduce((s, d) => s + d.amount, 0);
    let text, type;
    if (f === "csv") {
      const q = (s) => (/[",]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
      text = ["customer,city,amount_pkr", ...list.map((d) => [q(d.name), q(d.city), d.amount].join(",")), "TOTAL,," + total].join("\n") + "\n";
      type = "text/csv";
    } else if (f === "json") {
      text = JSON.stringify({ month: "2026-11", currency: "PKR", rows: list.map((d) => ({ customer: d.name, city: d.city, amount: d.amount })), total }, null, 2) + "\n";
      type = "application/json";
    } else {
      const pad = (s, n) => (s + " ".repeat(n)).slice(0, n);
      text = ["SALES · NOVEMBER 2026", "-".repeat(36), ...list.map((d) => pad(d.name, 17) + pad(d.city, 11) + d.amount.toLocaleString("en-IN").padStart(8)), "-".repeat(36), pad("TOTAL", 28) + total.toLocaleString("en-IN").padStart(8)].join("\n") + "\n";
      type = "text/plain";
    }
    return { name: "sales-november." + f, text, type, bytes: new Blob([text]).size, ext: f.toUpperCase() };
  }

  function confetti() {
    if (calm()) return;
    const colors = ["#ff6a3d", "#ffd166", "#18a058", "#3b82f6", "#ffffff"];
    const b = bay.getBoundingClientRect(), d = $(".downloads").getBoundingClientRect();
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("i");
      s.className = "bit";
      s.style.background = colors[i % colors.length];
      s.style.left = d.left - b.left + d.width / 2 + "px";
      s.style.top = d.top - b.top + "px";
      bay.appendChild(s);
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, dist = 50 + Math.random() * 70;
      s.animate([
        { transform: "translate(-50%,0) rotate(0)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * dist}px, ${Math.sin(a) * dist}px) rotate(${240 + i * 25}deg)`, opacity: 1, offset: .5 },
        { transform: `translate(${Math.cos(a) * dist * 1.3}px, ${Math.sin(a) * dist + 70}px) rotate(${520 + i * 25}deg)`, opacity: 0 }
      ], { duration: 1300 + Math.random() * 400, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- The print run ----------
  async function run(id, real) {
    const file = build();
    state = "working";
    btn.dataset.state = "working";
    btn.disabled = false;
    btn.setAttribute("aria-disabled", "true");
    statusEl.textContent = "Exporting " + file.name + ".";

    // 1. Anticipation: the button presses in, the printer hops awake
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.95, .9)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    printer.classList.add("on");
    play(printer, [{ transform: "translateY(0)" }, { transform: "translateY(-6px) rotate(-1deg)" }, { transform: "translateY(1px) rotate(.6deg)" }, { transform: "translateY(0)" }], { duration: 480, easing: "ease-out" });
    lbl.textContent = "Warming up…";
    await sleep(460, id);

    // 2. Feed the paper out line by line while the head runs across
    const lines = file.text.split("\n").filter((l, i, a) => !(i === a.length - 1 && l === ""));
    const shown = lines.slice(0, 10);
    if (lines.length > 10) shown[9] = "… " + (lines.length - 9) + " more lines";
    ink.textContent = "";
    for (let i = 0; i < shown.length; i++) {
      lbl.textContent = "Printing line " + (i + 1) + " of " + shown.length;
      play(headb, [{ transform: "translateX(0)" }, { transform: "translateX(124px)" }, { transform: "translateX(0)" }], { duration: 230, easing: "ease-in-out" });
      ink.textContent += (i ? "\n" : "") + shown[i];
      paper.style.height = 16 + (i + 1) * 13 + "px";
      await sleep(calm() ? 60 : 230, id);
    }
    await sleep(260, id);

    // 3. Tear off, fold into a file and fly to Downloads
    printer.classList.remove("on");
    await play(paper, [{ transform: "rotate(0)" }, { transform: "rotate(-4deg) translateY(4px)" }, { transform: "rotate(-3deg) translateY(10px)" }], { duration: 300, easing: SPRING, fill: "forwards" });
    chip.textContent = file.ext;
    await play(paper, [{ transform: "rotate(-3deg) translateY(10px)", opacity: 1 }, { transform: "rotate(0) translateY(40px) scale(.35, .3)", opacity: 0 }], { duration: 360, easing: "ease-in", fill: "forwards" });
    paper.style.height = "0px";
    paper.getAnimations().forEach((a) => a.cancel());
    const d = $(".downloads").getBoundingClientRect(), c0 = bay.getBoundingClientRect();
    const dy = d.top - c0.top - 176 - 40;
    chip.style.opacity = 1;
    await play(chip, [
      { transform: "translateY(0) scale(.6)", opacity: 0 },
      { transform: "translateY(-16px) scale(1.05)", opacity: 1, offset: .3 },
      { transform: `translateY(${dy}px) scale(.35)`, opacity: .9 }
    ], { duration: 820, easing: "cubic-bezier(.5,0,.4,1)" });
    chip.style.opacity = 0;
    dl.textContent = ++saved;
    play(dl, [{ transform: "scale(1)" }, { transform: "scale(1.5)" }, { transform: "scale(1)" }], { duration: 420, easing: SPRING });
    confetti();

    // the real file is saved only when the visitor pressed Export
    if (real) {
      const url = URL.createObjectURL(new Blob([file.text], { type: file.type }));
      const a = document.createElement("a");
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    state = "done";
    btn.dataset.state = "done";
    lbl.textContent = "Saved " + file.name;
    note.textContent = file.name + " · " + file.bytes + " bytes · " + picked().length + " rows · total " + pkr(picked().reduce((s, x) => s + x.amount, 0));
    statusEl.textContent = (real ? "Saved " : "Demo made ") + file.name + ", " + file.bytes + " bytes.";
    await sleep(2300, id);

    // 4. Reset
    state = "idle";
    btn.dataset.state = "idle";
    btn.removeAttribute("aria-disabled");
    note.textContent = "Makes a real file from the rows you pick.";
    refresh();
    play(lbl, [{ transform: "translateY(8px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 380, easing: SPRING });
  }

  function hardReset() {
    [paper, chip, headb, printer].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    paper.style.height = "0px";
    chip.style.opacity = 0;
    printer.classList.remove("on");
    state = "idle";
    btn.dataset.state = "idle";
    btn.removeAttribute("aria-disabled");
    note.textContent = "Makes a real file from the rows you pick.";
    refresh();
  }

  async function start(real) {
    if (state !== "idle" || !picked().length) return;
    const id = ++runId;
    try {
      await run(id, real);
      if (!real) scheduleDemo(1800);
    } catch (e) { if (e !== STOP) throw e; }
  }
  btn.addEventListener("click", () => start(true));

  // ---------- Auto demo: toggles a row or a format, then exports (no file is saved) ----------
  let demoOn = true, demoTimer = 0, step = 0;
  function scheduleDemo(ms) {
    clearTimeout(demoTimer);
    if (!demoOn) return;
    demoTimer = setTimeout(async () => {
      if (!demoOn || state !== "idle") return scheduleDemo(1500);
      // change something first so each run prints something different
      const k = step++ % 3;
      if (k === 1) { const r = document.querySelector('input[value="json"]'); r.checked = true; DATA[3].on = false; DATA[3].cb.checked = false; DATA[3].tr.classList.add("off"); }
      if (k === 2) { const r = document.querySelector('input[value="txt"]'); r.checked = true; }
      if (k === 0 && step > 1) { document.querySelector('input[value="csv"]').checked = true; DATA.forEach((d) => { d.on = true; d.cb.checked = true; d.tr.classList.remove("off"); }); }
      refresh();
      setTimeout(() => demoOn && start(false), 450);
    }, ms);
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    clearTimeout(demoTimer);
    if (state !== "idle") { runId++; hardReset(); }
  }
  ["pointerdown", "keydown"].forEach((t) => addEventListener(t, takeOver, true));
  refresh();
  scheduleDemo(300);
</script>
</body>
</html>
