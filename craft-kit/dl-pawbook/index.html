<!doctype html>
<!-- Chill & Craft · Pawbook · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawbook · Back office for vet clinics</title>
<meta name="description" content="A money and people back office for a small group of veterinary clinics, with a cash chart you filter by clinic, bills, team, rota and leave, and documents.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem("cc-pawbook-1:theme")); } catch (e) { s = null; }
    var t = q === "light" || q === "dark" ? q : s || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* =========================================================
   Base: shared structure. The skin below sets the colours,
   shapes and layout that make this dashboard its own.
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-h,inherit);margin:0;line-height:1.2}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted,.mut{color:var(--muted)}
.sm{font-size:.86em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w,240px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--side,var(--panel));color:var(--side-ink,var(--ink));overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.15em;padding:4px 8px 14px}
.brand svg{width:30px;height:30px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm,8px);text-decoration:none;color:var(--side-mut,var(--muted));font-weight:600;transition:color .2s}
.nav a:hover{color:var(--side-ink,var(--ink))}
.nav a[aria-current="page"]{color:var(--nav-on,var(--acc-ink))}
.nav-marker{position:absolute;left:0;top:0;width:100%;height:40px;border-radius:var(--r-sm,8px);background:var(--acc);opacity:0;transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s,width .3s,opacity .2s;pointer-events:none;z-index:0}
.nav-sec{font-size:.7em;text-transform:uppercase;letter-spacing:.14em;color:var(--side-mut,var(--muted));padding:14px 12px 4px;opacity:.8}
.nav-n{margin-left:auto;font-style:normal;font-size:.72em;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.main{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 26px;background:var(--top-bg,transparent)}
.top h1{font-size:1.35em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:6px 26px 40px;outline:none}
.menu-btn{display:none!important}
.nav-scrim{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.ph h2{font-size:1.45em;margin-right:auto}
.ph p{width:100%;margin:0;color:var(--muted)}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}
 body.nav-open .side{transform:none}
 body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;animation:fadeIn .25s}
 .menu-btn{display:inline-grid!important}
 .top{padding:12px 16px}
 .view{padding:4px 16px 32px}
}

/* ---------- Grid and cards ---------- */
.grid{display:grid;gap:var(--gap,16px);margin-bottom:var(--gap,16px)}
.g-k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.span2{grid-column:span 2}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--panel);border:var(--card-bd,1px solid var(--line));border-radius:var(--r,14px);padding:var(--pad,18px);box-shadow:var(--shadow,none);transition:transform .3s cubic-bezier(.3,.8,.3,1),box-shadow .3s,border-color .3s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h,var(--shadow,none))}
.card.flat:hover{transform:none}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{font-size:1.02em;margin-right:auto}
.ch .sub{color:var(--muted);font-size:.84em;font-weight:500}
.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:650}
.li small{color:var(--muted)}

/* ---------- KPI cards ---------- */
.kpi{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.kpi-i{position:absolute;right:14px;top:14px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--acc)}
.kpi-l{color:var(--muted);font-size:.84em;font-weight:650}
.kpi-v{font-size:1.65em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--font-n,inherit);white-space:nowrap}
.kpi-d{display:inline-flex;align-items:center;gap:2px;font-size:.8em;font-weight:700}
.kpi-d small{font-weight:500;color:var(--muted)}
.kpi-d .i{width:15px;height:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi-s{font-size:.82em;color:var(--muted)}
.kpi-sp{margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-btn,var(--r-sm,9px));cursor:pointer;font-weight:650;font-size:.93em;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s,color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn:active,.icon-btn:active,.chip:active,.seg button:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:var(--btn-sh,none)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.84em}
.btn .i{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm,9px);cursor:pointer;transition:transform .12s,background .2s,border-color .2s;flex:none;padding:0}
.icon-btn:hover{border-color:var(--acc)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm .i{width:15px;height:15px}
.icon-btn[disabled]{opacity:.4;cursor:default}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ring{animation:ring .7s}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
[data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
.kbd{font-size:.75em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- Inputs and forms ---------- */
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-in,var(--r-sm,9px));background:var(--in-bg,var(--panel));color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=range]{padding:0;min-height:24px;accent-color:var(--acc);border:0;background:none;box-shadow:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:.84em;font-weight:650;color:var(--muted)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:.8em}
.err:empty{display:none}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog span{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);transition:background .25s;flex:none}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span::after{transform:translateX(17px)}
.tog input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.srch input{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.84em;font-weight:650;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--r-sm,9px);background:var(--panel2);border:1px solid var(--line);flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-weight:650;font-size:.84em;color:var(--muted);cursor:pointer;border-radius:calc(var(--r-sm,9px) - 2px);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--seg-on,var(--ink))}
.seg-th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-sm,9px) - 2px);background:var(--seg-th,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .3s}

/* ---------- Tables ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar .srch{flex:1 1 200px;max-width:320px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92em}
.tbl th{text-align:left;font-size:.76em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num,.tbl td.num{text-align:right}
.th-s{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.th-s:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th-s .ar{opacity:.45;font-size:.85em}
[aria-sort] .th-s{color:var(--ink)}
[aria-sort] .ar{opacity:1;color:var(--acc)}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover,tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--acc) 8%,transparent))}
tr.click:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.rows-in tr{animation:rowIn .4s both;animation-delay:calc(var(--ri,0) * 30ms)}
@keyframes rowIn{from{opacity:0;translate:0 6px}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85em;color:var(--muted)}
.pg-b{display:flex;gap:4px;align-items:center}
.pgn{min-width:30px;height:30px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;font-weight:650;color:var(--muted)}
.pgn[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.cell2{display:flex;align-items:center;gap:10px;min-width:0}
.cell2 b{display:block;font-weight:650}
.cell2 small{display:block;color:var(--muted);font-size:.85em}

/* ---------- Status pills, avatars, meters ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.77em;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--pc,var(--muted)) 15%,transparent);color:var(--pc,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-paid,.s-approved,.s-active,.s-valid,.s-signed,.s-done,.s-accepted,.s-booked{--pc:var(--ok)}
.s-sent,.s-review,.s-open,.s-scheduled,.s-partial{--pc:var(--info)}
.s-pending,.s-expiring,.s-unsigned,.s-leave{--pc:var(--warn)}
.s-overdue,.s-rejected,.s-expired,.s-frozen,.s-cancelled,.s-declined{--pc:var(--bad)}
.s-draft{--pc:var(--muted)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-av,50%);background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 26%);font-weight:800;font-size:.76em;flex:none;letter-spacing:.02em}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:54px;height:54px;font-size:1em}
.av.sm{width:26px;height:26px;font-size:.66em}
.meter{display:block;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--acc);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.6}
.empty b{color:var(--ink)}
.empty.sm{padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.88em}
.kv dd{margin:0;font-weight:600;text-align:right}

/* ---------- Modals, drawers, menus, command search ---------- */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.ov-bg{position:absolute;inset:0;background:var(--ov,rgba(10,12,20,.5));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.dlg{position:relative;width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;background:var(--dlg-bg,var(--panel));color:var(--ink);border:1px solid var(--line);border-radius:var(--r-dlg,var(--r,16px));box-shadow:0 30px 80px rgba(0,0,0,.35);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1.1)}
.ov.open .ov-bg{opacity:1}
.ov.open .dlg{opacity:1;transform:none}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dlg-h h2{font-size:1.12em;margin-right:auto}
.dlg-b{padding:6px 18px 16px;overflow:auto}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.ov.sm .dlg{width:min(400px,100%)}
.ov.wide .dlg{width:min(760px,100%)}
.ov.xl .dlg{width:min(1120px,100%);max-height:94vh}
.ov.drawer{place-items:stretch end;padding:0}
.ov.drawer .dlg{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(100%)}
.ov.drawer.wide .dlg{width:min(640px,100%)}
.ov.drawer.open .dlg{transform:none}
.ov.pop{place-items:start end;padding:64px 16px 16px}
.ov.pop .ov-bg,.ov.menu .ov-bg{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.ov.pop .dlg{width:min(370px,100%);transform:translateY(-8px) scale(.98);transform-origin:top right}
.ov.menu{display:block;padding:0}
.ov.menu .dlg{position:fixed;width:220px;transform:translateY(-6px);border-radius:12px}
.ov.menu .dlg-h{padding:10px 12px 4px}
.ov.menu .dlg-h h2{font-size:.76em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ov.menu .dlg-h .icon-btn{display:none}
.ov.menu .dlg-b{padding:2px 6px 6px}
.mnu{display:flex;flex-direction:column}
.mi{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--panel2)}
.mi[disabled]{opacity:.55;cursor:default}
.ov.cmdk{place-items:start center;padding-top:12vh}
.cmd-l{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cmd-l button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.cmd-l [aria-selected="true"] button,.cmd-l button:hover{background:var(--panel2)}
.cmd-l small{color:var(--muted)}
.srch.big input{min-height:46px;font-size:1.05em}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.notes li{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.notes li.new{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.notes li small{display:block;color:var(--muted);font-size:.8em}
.notes .i{color:var(--acc);margin-top:2px}
@media (max-width:560px){.ov{padding:0;place-items:end stretch}.ov .dlg{width:100%;border-radius:var(--r-dlg,16px) var(--r-dlg,16px) 0 0;max-height:92vh}.ov.drawer .dlg{border-radius:0}.ov.pop{padding:56px 8px 8px}.ov.menu .dlg{width:220px;border-radius:12px}.ov.cmdk{padding-top:0}}

/* ---------- Toasts and tooltip ---------- */
.toasts{position:fixed;right:18px;bottom:var(--toast-b,18px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm,10px);background:var(--toast-bg,#16181d);color:var(--toast-ink,#fff);box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;font-size:.92em;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:min(380px,calc(100vw - 36px))}
.toast.show{opacity:1;transform:none}
.toast .i{color:var(--ok)}.toast.bad .i{color:var(--bad)}.toast.warn .i{color:var(--warn)}
.t-undo{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
@media (max-width:560px){.toasts{left:12px;right:12px;align-items:stretch}}
.tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip div i{width:8px;height:8px;border-radius:3px;flex:none}
.tip div span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tip .mut{opacity:.75;display:block}

/* ---------- Charts ---------- */
.chart{position:relative;min-width:0;outline:none}
.chart svg{display:block;overflow:visible}
.chart:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.gl{stroke:var(--grid,var(--line));stroke-dasharray:3 4}
.zl{stroke:var(--muted);stroke-width:1;opacity:.6}
.ax{fill:var(--muted);font-size:11px;font-family:var(--font-n,inherit)}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 6;opacity:.9}
.ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawOn 1.3s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes drawOn{to{stroke-dashoffset:0}}
.ar.fade,.band.fade{animation:fadeIn 1.2s .35s both}
.band{opacity:.2}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--panel);stroke-width:2.5}
.bar{transition:opacity .2s}
.bar.dim{opacity:.35}
.bar.grow{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .75s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d,0ms)}
.bar.grow.neg{transform-origin:50% 0}
@keyframes barUp{from{transform:scaleY(0)}}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82em;color:var(--muted);margin-bottom:8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.spk{display:block;overflow:visible}
.spk .ln{stroke-width:2}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dn-w{position:relative;flex:none}
.seg-bg{fill:none;stroke:var(--panel2)}
.dseg{fill:none;transition:opacity .2s;cursor:pointer}
.dseg.dim{opacity:.28}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.25em;font-weight:800}
.dn-c small{color:var(--muted);font-size:.76em}
.dn-l{list-style:none;margin:0;padding:0;flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dn-l li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.88em;transition:background .2s;outline-offset:-2px}
.dn-l li.on{background:var(--panel2)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);font-size:.9em;min-width:34px;text-align:right}
.hb{margin-bottom:11px}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:.88em;margin-bottom:5px}
.hb-l small{display:block;color:var(--muted);font-size:.85em}
.hb-t{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.gg{position:relative;max-width:240px;margin:0 auto}
.gg svg{display:block}
.gg-bg,.gg-v{fill:none;stroke-linecap:round}
.gg-bg{stroke:var(--panel2)}
.gg-t{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-t b{display:block;font-size:1.55em;font-weight:800;line-height:1.1}
.gg-t small{color:var(--muted);font-size:.8em}
.hm{display:grid;gap:3px;font-size:.72em}
.hm-x,.hm-y{color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.hm-y{text-align:right;padding-right:6px;align-self:center}
.hm-c{aspect-ratio:1.4;border-radius:4px;background:color-mix(in srgb,var(--hm,var(--acc)) var(--a),var(--panel2));animation:fadeIn .5s both;animation-delay:var(--d)}
.hm-c:hover{outline:2px solid var(--ink);outline-offset:-1px}

/* ---------- Drag and drop ---------- */
.drag-ghost{box-shadow:0 24px 50px rgba(0,0,0,.3);opacity:.96;transition:none!important;animation:none!important}
.drop-ph{border:2px dashed var(--acc);border-radius:var(--r-sm,10px);background:color-mix(in srgb,var(--acc) 8%,transparent);margin-bottom:8px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.over{outline:2px dashed var(--acc);outline-offset:-3px}
.dropped{animation:drop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:scale(1.06)}}
.grip{cursor:grab;touch-action:none;border:0;background:none;color:var(--muted);padding:2px;display:inline-grid;place-items:center}

/* ---------- Reduced motion: keep it calm ---------- */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* =========================================================
   Skin: Pawbook (soft mint and coral pastels, floating rounded sidebar)
   ========================================================= */
/* Tokens: mint, coral, lavender and butter pastels; dark is a deep teal night */
:root{
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs:14.5px;--r:26px;--r-sm:14px;--r-btn:99px;--side-w:244px;--gap:18px;--pad:20px;
  --bg:#edf5f2;--panel:#ffffff;--panel2:#eef4f1;--ink:#24413b;--muted:#6f8580;--line:#dde9e4;
  --acc:#ff8f70;--acc-ink:#fff;--ok:#27a37a;--warn:#c98a00;--bad:#e2574c;--info:#5b7fd8;
  --c1:#3cb58f;--c2:#ff8f70;--c3:#8e7cf0;--c4:#f2b937;--c5:#5aa9e6;--c6:#e46fa6;
  --mint:#d7f1e7;--peach:#ffe3d9;--lav:#e7e2ff;--butter:#fff1c9;
  --side:#ffffff;--side-ink:#24413b;--side-mut:#7d918c;--nav-on:#fff;
  --shadow:0 2px 6px rgba(36,65,59,.04),0 12px 30px rgba(36,65,59,.07);--shadow-h:0 18px 40px rgba(36,65,59,.13);
  --toast-bg:#24413b;--grid:#e3ece8;
}
[data-theme="dark"]{
  --bg:#0f1d1c;--panel:#162927;--panel2:#1d3431;--ink:#e6f3ef;--muted:#93aba5;--line:#24403c;
  --acc:#ff9b7f;--acc-ink:#1d1210;--ok:#5fd3a9;--warn:#f4c95d;--bad:#ff7d72;--info:#8ea8ff;
  --c1:#5fd3a9;--c2:#ff9b7f;--c3:#ab9cff;--c4:#f4c95d;--c5:#7cc0f2;--c6:#f08cbc;
  --mint:#1c3a33;--peach:#3a2621;--lav:#28243f;--butter:#3a3320;
  --side:#162927;--side-ink:#e6f3ef;--side-mut:#8aa29c;--shadow:0 12px 30px rgba(0,0,0,.3);--shadow-h:0 20px 44px rgba(0,0,0,.45);
  --toast-bg:#e6f3ef;--toast-ink:#0f1d1c;--tip-bg:#e6f3ef;--tip-ink:#0f1d1c;--grid:#213935;
}
h1,h2,h3{font-weight:800;letter-spacing:-.015em}

/* Floating sidebar card */
@media (min-width:901px){.app{grid-template-columns:calc(var(--side-w) + 16px) minmax(0,1fr)}.side{top:14px;height:calc(100vh - 28px);margin:14px 0 14px 14px;border-radius:30px;box-shadow:var(--shadow)}}
.brand{font-size:1.25em;padding:6px 10px 18px}
.brand svg{width:36px;height:36px}
.nav{gap:4px}
.nav a{padding:11px 14px;border-radius:99px;font-weight:700}
.nav-marker{border-radius:99px;background:var(--acc);box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 45%,transparent)}
.side-pet{margin-top:auto;padding:12px;border-radius:22px;background:var(--mint);text-align:center}
.side-pet svg{width:100%;max-width:150px;display:block;margin:0 auto}
.side-pet small{color:var(--muted);font-weight:700;font-size:.8em}
.tail{transform-origin:14px 52px;animation:wag 2.4s ease-in-out 3}
@keyframes wag{50%{transform:rotate(-14deg)}}

/* Greeting bar */
.top{padding:22px 28px 10px}
.hello{margin-right:auto;min-width:0}
.hello small{color:var(--muted);font-weight:700}
.hello h1{font-size:1.7em}
.pill-search{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:99px;border:0;background:var(--panel);box-shadow:var(--shadow);color:var(--muted);cursor:pointer;font-weight:600}
.icon-btn{border-radius:50%;border:0;background:var(--panel);box-shadow:var(--shadow);width:40px;height:40px}
.me{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--lav);color:var(--c3);font-weight:800;font-size:.85em}
@media (max-width:900px){.top{padding:14px 16px 8px}.pill-search span{display:none}.pill-search{padding:0 12px}.me{display:none}}
@media (max-width:420px){.pill-search{display:none}}

/* Cards: soft, round and pastel-tinted KPIs */
.card{border:0}
.kpi{padding:18px 20px}
.kpi:nth-child(1){background:var(--mint)}.kpi:nth-child(2){background:var(--peach)}.kpi:nth-child(3){background:var(--lav)}.kpi:nth-child(4){background:var(--butter)}
.kpi-i{background:var(--panel);border-radius:50%}
.kpi:nth-child(2) .kpi-i{color:var(--c2)}.kpi:nth-child(3) .kpi-i{color:var(--c3)}.kpi:nth-child(4) .kpi-i{color:var(--c4)}
.kpi-v{font-size:1.8em}
.chip{border:0;background:var(--panel2);font-weight:700}
.seg{border:0}.seg-th{border-radius:99px}.seg button{border-radius:99px}
.btn{font-weight:700;border-radius:99px}
.btn.pri{box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 40%,transparent)}
input,select,textarea{border-radius:14px;background:var(--panel2);border-color:transparent}
.tbl th{border-bottom-color:var(--line)}

/* Clinic chips double as the chart filter */
.cl-chips{display:flex;gap:8px;flex-wrap:wrap}
.cl-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:2px solid transparent;background:var(--panel2);font-weight:700;cursor:pointer;color:var(--ink);transition:opacity .25s,border-color .25s,transform .12s}
.cl-chip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cl-chip i svg{width:12px;height:12px;stroke-width:3}
.cl-chip[aria-pressed="false"]{opacity:.45}
.cl-chip[aria-pressed="false"] i svg{visibility:hidden}
.cl-chip:active{transform:scale(.95)}
.band{opacity:.88;transition:opacity .3s}
.stk .band.dim{opacity:.25}
.stk-top{fill:none;stroke-width:2;stroke:var(--panel)}
.oline{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:6 6;opacity:.65}

/* The clinic map */
.map{position:relative;border-radius:22px;overflow:hidden;background:var(--mint)}
.map svg{display:block;width:100%;height:auto}
.m-land{fill:var(--panel2)}
.m-park{fill:color-mix(in srgb,var(--c1) 22%,transparent)}
.m-river{fill:none;stroke:color-mix(in srgb,var(--c5) 45%,transparent);stroke-width:10;stroke-linecap:round}
.m-road{fill:none;stroke:var(--panel);stroke-width:5;stroke-linecap:round}
.pin{cursor:pointer;outline:none}
.pin .pulse{transform-box:fill-box;transform-origin:center;opacity:0}
.pin.on .pulse{animation:pulse 1.6s ease-out 3}
@keyframes pulse{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.pin .head{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pin:hover .head,.pin:focus-visible .head{transform:translateY(-4px)}
.pin.off{opacity:.35}
.pin text{font-size:10px;font-weight:800;fill:var(--ink)}
.pin .lbl{fill:var(--panel)}
.map-key{position:absolute;left:12px;bottom:10px;font-size:.78em;font-weight:700;color:var(--muted)}

/* Bills grouped by due week */
.bill-g h4{margin:6px 0 10px;font-size:.84em;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.bill{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--panel2);margin-bottom:8px;transition:transform .2s,background .2s}
.bill:hover{transform:translateX(3px)}
.bill .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);color:var(--c3);flex:none}
.bill b{display:block}.bill small{color:var(--muted)}
.bill .num{margin-left:auto;font-weight:800;white-space:nowrap}
.bill.gone{animation:gone .45s forwards}
@keyframes gone{to{opacity:0;transform:translateX(40px);height:0;margin:0;padding:0}}

/* Team cards */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--gap)}
.mate{text-align:center;cursor:pointer;font:inherit;color:inherit;width:100%}
.mate .av{width:64px;height:64px;font-size:1.1em;margin:4px auto 10px;box-shadow:0 0 0 5px var(--panel),0 0 0 7px var(--cc,var(--line))}
.mate b{display:block}.mate small{color:var(--muted)}
.mate .row{justify-content:center;margin-top:8px}

/* Rota grid */
.rota{border-collapse:separate;border-spacing:4px;width:100%;min-width:720px}
.rota th{font-size:.78em;color:var(--muted);font-weight:700;text-align:center;padding:4px}
.rota th:first-child{text-align:left}
.rota td{padding:0}
.rota .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.88em;white-space:nowrap;padding-right:8px}
.cell{width:100%;min-height:40px;border:0;border-radius:12px;font-size:.78em;font-weight:800;cursor:pointer;color:#fff;transition:transform .15s,filter .2s;padding:4px}
.cell:hover{transform:scale(1.04)}
.cell.off{background:var(--panel2);color:var(--muted);font-weight:600}
.cell.lv{background:repeating-linear-gradient(-45deg,var(--butter) 0 6px,transparent 6px 12px);color:var(--warn);border:1px dashed var(--warn)}
.cov td{font-size:.78em;text-align:center;font-weight:700;padding:4px}
.cov .gap{color:var(--bad)}
.lreq{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--panel2);margin-bottom:8px}
.lreq .grow{flex:1;min-width:0}.lreq b{display:block}.lreq small{color:var(--muted)}

/* Document expiry timeline */
.tline{position:relative;height:96px;margin:6px 6px 0}
.tline::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--bad),var(--warn) 30%,var(--c1) 70%)}
.tdot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--panel);background:var(--c3);cursor:pointer;box-shadow:var(--shadow);animation:pop .5s both;animation-delay:var(--d)}
.tdot:hover,.tdot:focus-visible{transform:scale(1.3)}
@keyframes pop{from{transform:scale(0)}}
.tlab{position:absolute;font-size:.72em;font-weight:700;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.cl-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.cl-card .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cl-card .hd i{width:14px;height:14px;border-radius:50%}

</style>
</head>
<body>
<!-- App shell: a floating rounded sidebar, a friendly greeting bar and the page view -->
<div class="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <a class="brand" href="#/overview" aria-label="Pawbook home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="11" fill="#ff8f70"/><ellipse cx="16" cy="20" rx="6.2" ry="5" fill="#fff"/><circle cx="9" cy="13" r="2.6" fill="#fff"/><circle cx="13.5" cy="9" r="2.6" fill="#fff"/><circle cx="18.5" cy="9" r="2.6" fill="#fff"/><circle cx="23" cy="13" r="2.6" fill="#fff"/></svg>

      <small>All four clinics open today</small>
    </div>
  </aside>
  <div class="nav-scrim" data-act="menu"></div>
  <div class="main">

      <button type="button" class="icon-btn menu-btn" data-act="menu" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

      <button type="button" class="pill-search" data-act="cmdk"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Find a person, bill or page</span></button>

      <button type="button" class="icon-btn" data-act="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="bell-n" hidden>0</span></button>
      <span class="me" aria-hidden="true">SA</span>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<script>
/* =========================================================
   Core helpers: DOM, numbers, dates, storage, router, UI
   pieces (toast, modal, drawer, form, table) and charts.
   Everything is plain JS with no libraries.
   ========================================================= */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches; // reduced motion flag, checked by every animation
if (RMQ.addEventListener) RMQ.addEventListener('change', e => { RM = e.matches; });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = 'id') => p + Math.random().toString(36).slice(2, 8);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);

    donut($('#billDn'), { items: Object.entries(g).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value), label: 'Open', size: 132, sw: 16 });
  }
};
const gone = (id, f) => { const el = $(`[data-bill="${id}"]`); if (el && !RM) { el.classList.add('gone'); setTimeout(f, 430); } else f(); };
ACT.billOk = b => { const x = byId(D.bills, b.dataset.id); x.status = 'approved'; commit(x.supplier + ' approved, scheduled for ' + fDay(x.due)); };
ACT.billPay = b => { const x = byId(D.bills, b.dataset.id); confirmBox(`Pay ${money(x.amt)} to ${esc(x.supplier)} now?`, () => gone(x.id, () => { x.status = 'paid'; x.paidOn = TODAY_S; D.moves.push({ id: 'mb' + x.id, d: TODAY_S, c: x.clinic, kind: 'out', amt: x.amt }); commit('Paid ' + x.supplier, 'ok', () => { x.status = 'approved'; D.moves = D.moves.filter(m => m.id !== 'mb' + x.id); commit('Payment undone'); }); }), { title: 'Pay this bill', ok: 'Pay now', danger: false }); };
ACT.approveAll = () => { const l = D.bills.filter(b => b.status === 'pending'); confirmBox(`Approve ${l.length} bills worth ${money(sum(l.map(b => b.amt)))}?`, () => { l.forEach(b => { b.status = 'approved'; }); commit(l.length + ' bills approved', 'ok', () => { l.forEach(b => { b.status = 'pending'; }); commit('Undone'); }); }, { ok: 'Approve all', danger: false }); };
const billF = [{ k: 'supplier', label: 'Supplier', req: true, full: true }, { k: 'cat', label: 'Type', type: 'select', opts: ['Drugs & supplies', 'Lab fees', 'Utilities', 'Equipment', 'Supplies', 'Rent'] }, { k: 'clinic', label: 'Clinic', type: 'select', opts: CLIN.map(c => [c.id, c.name]) }, { k: 'ref', label: 'Their invoice no.', req: true }, { k: 'amt', label: 'Amount (Rs)', type: 'number', min: 1, req: true }, { k: 'issued', label: 'Bill date', type: 'date', req: true }, { k: 'due', label: 'Due date', type: 'date', req: true, check: (d, o) => d < o.issued ? 'Due date is before the bill date' : '' }];
ACT.addBill = () => formModal({ title: 'Add a bill', fields: billF, save: 'Add bill', values: { cat: 'Drugs & supplies', clinic: 'mt', issued: TODAY_S, due: addDays(TODAY_S, 15) }, onSave: x => { D.bills.push({ id: uid('b'), ...x, status: 'pending' }); commit('Bill added; it needs approval'); } });
ACT.billMore = b => { const x = byId(D.bills, b.dataset.id); menu(b, [['Edit bill', () => formModal({ title: 'Edit bill', fields: billF, values: x, onSave: y => { Object.assign(x, y); commit('Bill saved'); } })], ['Move due date +7 days', () => { x.due = addDays(x.due, 7); commit('Due ' + fDate(x.due)); }], ['Delete bill', () => confirmBox('Delete the bill from ' + esc(x.supplier) + '?', () => gone(x.id, () => { const i = D.bills.indexOf(x); D.bills.splice(i, 1); commit('Bill deleted', 'ok', () => { D.bills.splice(i, 0, x); commit('Restored'); }); }))]]); };

/* ---------- Page: Team ---------- */
let TQ = '', TR = 'All';
PAGES.team = {
  title: 'Team', render(v) {
    const roles = ['All', 'Vet', 'Nurse', 'Reception', 'Groomer', 'Practice manager'];
    v.innerHTML = `<div class="ph"><label class="srch" style="flex:1 1 220px;max-width:320px">${ico('search')}<span class="sr">Search team</span><input type="search" id="tq" placeholder="Search the team…" value="${esc(TQ)}"></label><div class="chips">${roles.map(r => `<button type="button" class="chip" data-act="tr" data-v="${r}" aria-pressed="${r === TR}">${r}</button>`).join('')}</div><span class="sp"></span><button type="button" class="btn pri" data-act="addMate">${ico('plus')}Add person</button></div><div class="team" id="teamG"></div>
    <section class="card" style="margin-top:var(--gap)"><div class="ch"><h3>Monthly pay by clinic</h3></div><div class="chart" id="payBar"></div></section>`;
    drawTeam();
    $('#tq').addEventListener('input', debounce(e => { TQ = e.target.value.trim().toLowerCase(); drawTeam(); }, 120));
    barChart($('#payBar'), { labels: CLIN.map(c => c.name), series: ['Vet', 'Nurse', 'Reception', 'Groomer', 'Practice manager'].map((r, i) => ({ name: r, data: CLIN.map(c => sum(D.team.filter(t => t.clinic === c.id && t.role === r).map(t => t.pay))) })), stacked: true, fmt: x => money(x), h: 210 });
  }
};
function drawTeam() {
  const l = D.team.filter(t => (TR === 'All' || t.role === TR) && (!TQ || (t.name + t.role + clin(t.clinic).name).toLowerCase().includes(TQ)));
  $('#teamG').innerHTML = l.map((t, i) => `<button type="button" class="card mate enter" style="--i:${Math.min(i, 12)};--cc:${clin(t.clinic).color}" data-act="mate" data-id="${t.id}">${av(t.name)}<b>${esc(t.name)}</b><small>${esc(t.role)} · ${esc(clin(t.clinic).name)}</small><span class="row">${t.lic ? pill(docSt({ expiry: t.lic }) === 'valid' ? 'valid' : docSt({ expiry: t.lic }), 'Licence ' + (docSt({ expiry: t.lic }) === 'valid' ? 'valid' : docSt({ expiry: t.lic }))) : ''}</span></button>`).join('') || `<div class="card empty">${ico('users')}<b>No one matches</b></div>`;
}
ACT.tr = b => { TR = b.dataset.v; $$('[data-act="tr"]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawTeam(); };
const mateF = [{ k: 'name', label: 'Full name', req: true }, { k: 'role', label: 'Role', type: 'select', opts: Object.keys(PAY) }, { k: 'clinic', label: 'Home clinic', type: 'select', opts: CLIN.map(c => [c.id, c.name]) }, { k: 'pay', label: 'Monthly pay (Rs)', type: 'number', min: 10000, step: 1000, req: true }, { k: 'phone', label: 'Mobile', req: true, check: x => /^03\d{2}[ -]?\d{7}$/.test(x) ? '' : 'Use 03xx 1234567' }, { k: 'since', label: 'Joined', type: 'date', req: true }];
ACT.addMate = () => formModal({ title: 'Add a team member', fields: mateF, save: 'Add', values: { role: 'Nurse', clinic: 'mt', pay: 85000, since: TODAY_S }, onSave: x => { const t = { id: uid('t'), ...x, lic: x.role === 'Vet' ? addDays(TODAY_S, 365) : '' }; D.team.push(t); D.rota[t.id] = WDAYS.map((d, i) => i === 6 ? 'off' : t.clinic); commit(x.name + ' joined the team'); } });
ACT.mate = b => {
  const t = byId(D.team, b.dataset.id), wk = D.rota[t.id] || [];
  const m = drawer(esc(t.name), `<div class="row" style="margin-bottom:14px">${av(t.name, 'lg')}<span><b>${esc(t.role)}</b><br><small class="muted">${esc(clin(t.clinic).name)} · since ${fDate(t.since)}</small></span></div><dl class="kv"><dt>Mobile</dt><dd>${esc(t.phone)}</dd><dt>Monthly pay</dt><dd>${money(t.pay)}</dd>${t.lic ? `<dt>Vet council licence</dt><dd>${fDate(t.lic)} ${pill(docSt({ expiry: t.lic }))}</dd>` : ''}<dt>Leave taken this year</dt><dd>${(t.name.length % 9) + 2} days</dd></dl><h3 style="margin:18px 0 8px;font-size:1em">This week</h3><div class="row" style="gap:6px">${wk.map((c, i) => `<span class="pill" style="--pc:${c === 'off' ? 'var(--muted)' : c === 'leave' ? 'var(--warn)' : clin(c).color}">${WD[(i + 1) % 7]} ${c === 'off' ? 'off' : c === 'leave' ? 'leave' : esc(clin(c).name)}</span>`).join('')}</div>`, `<button type="button" class="btn ghost danger" data-x="del">${ico('trash')}Remove</button><span class="sp"></span><button type="button" class="btn pri" data-x="edit">${ico('edit')}Edit</button>`);
  m.el.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; if (x.dataset.x === 'edit') { m.close(); formModal({ title: 'Edit ' + esc(t.name), fields: mateF, values: t, onSave: y => { Object.assign(t, y); commit('Saved'); } }); } else confirmBox('Remove ' + esc(t.name) + ' from the team?', () => { const i = D.team.indexOf(t); D.team.splice(i, 1); m.close(); commit(t.name + ' removed', 'ok', () => { D.team.splice(i, 0, t); commit('Restored'); }); }, { ok: 'Remove' }); });
};

/* ---------- Page: Rota and leave ---------- */
let ROTA_WARNED = false;
PAGES.rota = {
  title: 'Rota & leave', render(v) {
    const vets = D.team.filter(t => t.role === 'Vet'), cov = CLIN.map(c => WDAYS.map((d, i) => vets.filter(t => (D.rota[t.id] || [])[i] === c.id).length));
    v.innerHTML = `<div class="ph"><p>Week of ${fDate(WEEK0)}. Tap a shift to move someone to another clinic or give them the day off.</p><button type="button" class="btn" data-act="copyWeek">${ico('copy')}Copy to next week</button></div>
    <div class="grid g21"><section class="card"><div class="tbl-wrap"><table class="rota"><thead><tr><th>Person</th>${WDAYS.map(d => `<th${d === TODAY_S ? ' style="color:var(--acc)"' : ''}>${WD[pd(d).getDay()]}<br>${pd(d).getDate()}</th>`).join('')}</tr></thead><tbody>${D.team.map(t => `<tr><td><span class="who">${av(t.name, 'sm')}${esc(t.name.replace('Dr. ', 'Dr '))}</span></td>${(D.rota[t.id] || []).map((c, i) => `<td><button type="button" class="cell${c === 'off' ? ' off' : c === 'leave' ? ' lv' : ''}" style="${c !== 'off' && c !== 'leave' ? 'background:' + clin(c).color : ''}" data-act="cell" data-id="${t.id}" data-i="${i}" aria-label="${esc(t.name)}, ${WD[pd(WDAYS[i]).getDay()]}: ${c === 'off' ? 'day off' : c === 'leave' ? 'on leave' : esc(clin(c).name)}">${c === 'off' ? 'Off' : c === 'leave' ? 'Leave' : esc(clin(c).name.split(' ')[0])}</button></td>`).join('')}</tr>`).join('')}</tbody><tfoot class="cov">${CLIN.map((c, k) => `<tr><td style="text-align:left">Vets at ${esc(c.name)}</td>${cov[k].map(n => `<td class="${n ? '' : 'gap'}">${n || '0 !'}</td>`).join('')}</tr>`).join('')}</tfoot></table></div></section>
    <aside class="card"><div class="ch"><h3>Leave requests</h3><button type="button" class="btn sm" data-act="askLeave">${ico('plus')}Request</button></div>${leaveList()}<div class="ch" style="margin-top:18px"><h3>Decided</h3></div><ul class="list">${D.leave.filter(x => x.status !== 'pending').map(x => `<li class="li"><span class="grow"><b>${esc(tName(x.staff))}</b><small>${fDay(x.from)} – ${fDay(x.to)}</small></span>${pill(x.status)}</li>`).join('') || '<li class="muted sm">None yet.</li>'}</ul></aside></div>`;
    const gaps = sum(cov.map(r => r.filter(n => !n).length)); if (gaps && !ROTA_WARNED) { ROTA_WARNED = true; setTimeout(() => toast(gaps + ' clinic days have no vet this week', 'warn'), 400); }
  }
};
ACT.cell = b => { const t = byId(D.team, b.dataset.id), i = +b.dataset.i; menu(b, CLIN.map(c => [c.name, () => { D.rota[t.id][i] = c.id; commit(t.name + ' moved to ' + c.name); }]).concat([['Day off', () => { D.rota[t.id][i] = 'off'; commit(t.name + ' is off on ' + WD[pd(WDAYS[i]).getDay()]); }]]), WD[pd(WDAYS[i]).getDay()] + ' shift'); };
ACT.copyWeek = () => toast('This week is copied to the week of ' + fDate(addDays(WEEK0, 7)));
ACT.askLeave = () => formModal({ title: 'Request leave', save: 'Send request', fields: [{ k: 'staff', label: 'Who', type: 'select', opts: D.team.map(t => [t.id, t.name]), full: true }, { k: 'type', label: 'Type', type: 'select', opts: ['Annual', 'Sick', 'Family'] }, { k: 'note', label: 'Reason', req: true }, { k: 'from', label: 'From', type: 'date', req: true }, { k: 'to', label: 'To', type: 'date', req: true, check: (d, o) => d < o.from ? 'End is before start' : '' }], values: { from: addDays(TODAY_S, 7), to: addDays(TODAY_S, 8), type: 'Annual' }, onSave: x => { D.leave.unshift({ id: uid('l'), ...x, status: 'pending' }); commit('Leave request added'); notify('New leave request from ' + tName(x.staff)); } });

/* ---------- Page: Documents ---------- */
PAGES.documents = {
  title: 'Documents', render(v) {
    const soon = D.docs.filter(x => dayDiff(x.expiry, TODAY_S) <= 120).sort((a, b) => a.expiry < b.expiry ? -1 : 1);
    const pos = d => clamp((dayDiff(d, TODAY_S) + 20) / 140 * 100, 1, 99);
    v.innerHTML = `<section class="card"><div class="ch"><h3>Expiring in the next 4 months</h3><span class="sub">${soon.length} documents · hover a dot</span></div><div class="tline">${soon.map((x, i) => `<button type="button" class="tdot" style="left:${pos(x.expiry)}%;background:${clin(x.clinic).color};--d:${i * 50}ms;top:${i % 2 ? 34 : 66}%" data-act="docOpen" data-id="${x.id}" aria-label="${esc(x.name)}, ${esc(clin(x.clinic).name)}, ${docSt(x) === 'expired' ? 'expired' : 'expires'} ${fDate(x.expiry)}" title="${esc(x.name)} · ${fDate(x.expiry)}"></button>`).join('')}${[['Today', 20], ['+1 month', 50], ['+2 months', 80], ['+3 months', 110]].map(([l, d]) => `<span class="tlab" style="left:${d / 140 * 100}%;bottom:-2px">${l}</span>`).join('')}</div></section>
    <section class="card flat" style="margin-top:var(--gap)"><div id="docT"></div></section>`;
    table($('#docT'), { rows: D.docs, ph: 'Search documents…', keys: ['name', x => clin(x.clinic).name], sort: 'expiry', empty: 'No documents', chips: { opts: ['All', 'Expired', 'Expiring', 'Valid'], fn: (x, c) => docSt(x) === c.toLowerCase() }, tools: `<span class="sp"></span><button type="button" class="btn pri" data-act="addDoc">${ico('upload')}Add document</button>`, onRow: x => docOpen(x),
      cols: [{ k: 'name', label: 'Document', f: x => `<b>${esc(x.name)}</b><br><small class="muted">${esc(x.kind)}</small>` }, { k: 'clinic', label: 'Clinic', sv: x => clin(x.clinic).name, f: x => clDot(x.clinic) }, { k: 'expiry', label: 'Expires', f: x => `${fDate(x.expiry)}<br><small class="muted">${ago(x.expiry)}</small>` }, { k: 'st', label: 'Status', sv: docSt, f: x => pill(docSt(x)) }] });
  }
};
function docOpen(x) {
  const m = drawer(esc(x.name), `<dl class="kv"><dt>Clinic</dt><dd>${esc(clin(x.clinic).name)}</dd><dt>Type</dt><dd>${esc(x.kind)}</dd><dt>Expires</dt><dd>${fDate(x.expiry)}</dd><dt>Status</dt><dd>${pill(docSt(x))}</dd></dl><p class="muted" style="margin-top:16px">Renewing sets a new expiry date and files the new copy.</p>`, `<button type="button" class="btn ghost danger" data-x="del">${ico('trash')}Delete</button><span class="sp"></span><button type="button" class="btn pri" data-x="renew">${ico('refresh')}Renew</button>`);
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; m.close(); if (b.dataset.x === 'renew') formModal({ title: 'Renew ' + esc(x.name), save: 'Renew', fields: [{ k: 'expiry', label: 'New expiry date', type: 'date', req: true, check: d => d <= TODAY_S ? 'Choose a future date' : '' }], values: { expiry: addDays(TODAY_S, 365) }, onSave: y => { x.expiry = y.expiry; commit('Renewed until ' + fDate(y.expiry)); } }); else confirmBox('Delete ' + esc(x.name) + '?', () => { D.docs = D.docs.filter(d => d !== x); commit('Document deleted'); }); });
}
ACT.docOpen = b => docOpen(byId(D.docs, b.dataset.id));
ACT.addDoc = () => formModal({ title: 'Add a document', save: 'Add', fields: [{ k: 'name', label: 'Name', req: true, full: true }, { k: 'kind', label: 'Kind', type: 'select', opts: ['Clinic', 'Licence', 'Insurance', 'Contract'] }, { k: 'clinic', label: 'Clinic', type: 'select', opts: CLIN.map(c => [c.id, c.name]) }, { k: 'expiry', label: 'Expiry date', type: 'date', req: true, full: true }], values: { kind: 'Clinic', clinic: 'mt', expiry: addDays(TODAY_S, 365) }, onSave: x => { D.docs.push({ id: uid('d'), ...x }); commit(x.name + ' added'); } });

/* ---------- Page: Clinics ---------- */
PAGES.clinics = {
  title: 'Clinics', render(v) {
    const m0 = TODAY_S.slice(0, 7) + '-01', days = +TODAY_S.slice(8), dim = new Date(pd(TODAY_S).getFullYear(), pd(TODAY_S).getMonth() + 1, 0).getDate();
    const st = CLIN.map(c => { const r = rows().filter(x => x.c === c.id && x.d >= m0), I = sum(r.map(x => x.in)), O = sum(r.map(x => x.out)), visits = D.pays.filter(p => p.clinic === c.id).length; return { c, I, O, P: I - O, proj: I / days * dim, visits, team: D.team.filter(t => t.clinic === c.id).length }; });
    v.innerHTML = `<div class="cl-cards">${st.map(s => `<section class="card cl-card"><div class="hd"><i style="background:${s.c.color}"></i><h3>${esc(s.c.name)}</h3></div><small class="muted">Lead vet ${esc(s.c.lead)} · ${s.team} people</small><div class="chart" id="g_${s.c.id}" style="margin-top:10px"></div><dl class="kv" style="margin-top:8px"><dt>Taken so far</dt><dd>${smoney(s.I)}</dd><dt>On course for</dt><dd>${smoney(s.proj)}</dd><dt>Profit so far</dt><dd class="${s.P < 0 ? 'down' : 'up'}">${smoney(s.P)}</dd></dl></section>`).join('')}</div>
    <section class="card"><div class="ch"><h3>Profit by clinic</h3><span class="sub">last 6 months</span></div><div class="chart" id="profB"></div></section>`;
    st.forEach(s => gauge($('#g_' + s.c.id), { value: Math.round(s.proj / D.set.target[s.c.id] * 100), max: 100, label: 'of monthly target', color: s.c.color, tip: 'On course' }));
    const ks = monthKeys(6);
    barChart($('#profB'), { labels: ks.map(fMon), series: CLIN.map(c => ({ name: c.name, color: c.color, data: ks.map(k => sum(rows().filter(x => x.c === c.id && x.d.startsWith(k)).map(x => x.in - x.out))) })), fmt: x => money(x), h: 230 });
  }
};

/* ---------- Page: Settings ---------- */
const setF = [{ k: 'name', label: 'Practice name', req: true, full: true }, { k: 'owner', label: 'Owner', req: true }, { k: 'email', label: 'Accounts email', type: 'email', req: true }].concat(CLIN.map(c => ({ k: 't_' + c.id, label: c.name + ' monthly target (Rs)', type: 'number', min: 100000, step: 50000, req: true })));
PAGES.settings = {
  title: 'Settings', render(v) {
    const vals = { ...D.set }; CLIN.forEach(c => { vals['t_' + c.id] = D.set.target[c.id]; });
    v.innerHTML = `<div class="grid g2"><section class="card"><div class="ch"><h3>Practice and targets</h3></div><form id="setF" novalidate>${fieldsHTML(setF, vals)}<div class="row" style="margin-top:14px"><button type="submit" class="btn pri">Save</button></div></form></section>
    <section class="card"><div class="ch"><h3>Look</h3></div><div class="row"><button type="button" class="btn" data-act="setTheme" data-v="light">${ico('sun')}Daylight</button><button type="button" class="btn" data-act="setTheme" data-v="dark">${ico('moon')}Night shift</button></div><div class="ch" style="margin-top:22px"><h3>Data</h3></div><p class="muted">Data is saved in this browser only.</p><div class="row"><button type="button" class="btn" data-act="exportTk">${ico('download')}Export takings</button><button type="button" class="btn ghost danger" data-act="reset">${ico('refresh')}Reset demo data</button></div></section></div>`;
    $('#setF').addEventListener('submit', e => { e.preventDefault(); const x = readFields($('#setF'), setF); if (!x) return; D.set.name = x.name; D.set.owner = x.owner; D.set.email = x.email; CLIN.forEach(c => { D.set.target[c.id] = x['t_' + c.id]; }); hello(); commit('Saved'); });
  }
};
ACT.setTheme = b => { setTheme(b.dataset.v); toast('Theme changed'); };
ACT.exportTk = () => download('pawbook-takings.csv', toCSV(D.pays, [['date', 'Date'], ['owner', 'Owner'], ['pet', 'Pet'], ['svc', 'Service'], [p => clin(p.clinic).name, 'Clinic'], ['method', 'Paid by'], ['amt', 'Amount']]));
ACT.reset = () => confirmBox('Reset all demo data?', () => { D = seed(); save(); hello(); refresh(); toast('Demo data reset'); }, { ok: 'Reset' });

/* ---------- Boot ---------- */
function hello() { const h = pd(TODAY_S) && new Date().getHours(); $('#hello').textContent = (h < 12 ? 'Good morning, ' : h < 17 ? 'Good afternoon, ' : 'Good evening, ') + D.set.owner.replace(/ \w+$/, ''); }
hello();
boot({
  name: 'Pawbook', key: KEY, home: 'overview',
  nav: [['overview', 'Overview', 'home'], ['takings', 'Takings', 'coin'], ['bills', 'Bills', 'receipt'], ['team', 'Team', 'users'], ['rota', 'Rota & leave', 'cal'], ['documents', 'Documents', 'doc'], ['clinics', 'Clinics', 'pin'], ['settings', 'Settings', 'cog']],
  notes: [['Controlled drugs audit at Cantt is due this month', 'bad', '09:05'], ['Lahore Vet Pharma sent a new bill', 'info', 'yesterday'], ['DHA Phase 5 beat its weekly target', 'ok', '2 days ago']],
  commands: [{ label: 'Record a payment', hint: 'Action', run: ACT.addPay }, { label: 'Add a bill', hint: 'Action', run: ACT.addBill }, { label: 'Request leave', hint: 'Action', run: ACT.askLeave }, { label: 'Add a team member', hint: 'Action', run: ACT.addMate }],
  search: q => D.team.filter(t => t.name.toLowerCase().includes(q)).map(t => ({ label: t.name, hint: t.role, run: () => ACT.mate({ dataset: { id: t.id } }) })).concat(D.bills.filter(b => b.supplier.toLowerCase().includes(q)).slice(0, 3).map(b => ({ label: b.supplier + ' · ' + money(b.amt), hint: 'Bill', run: () => go('bills') })))
});

</script>
