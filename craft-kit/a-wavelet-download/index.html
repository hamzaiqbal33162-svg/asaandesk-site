<!doctype html>
<!-- Chill & Craft · Wavelet · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavelet · download button</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours and motion curves ---------- */
  :root {
    color-scheme: light;
    --bg1: #f3f2ee;
    --bg2: #dcdbd4;
    --btn: #0b0b0c;
    --btn-line: transparent;
    --volt: #ffd60a;
    --dim: #3d3d42;
    --text: #1b1b1e;
    --muted: #6a6a70;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #19191c;
      --bg2: #060607;
      --btn: #141416;
      --btn-line: #2c2c31;
      --text: #f1f1f3;
      --muted: #9a9aa2;
      --focus: #93c5fd;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #19191c;
    --bg2: #060607;
    --btn: #141416;
    --btn-line: #2c2c31;
    --text: #f1f1f3;
    --muted: #9a9aa2;
    --focus: #93c5fd;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body { overflow-x: hidden; } /* particles may fly past the edges */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, var(--bg1), var(--bg2) 80%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px 16px 24px; }
  .wl { position: relative; }

  /* ---------- Button ---------- */
  .btn {
    position: relative;
    width: 250px;
    height: 64px;
    padding: 0 20px 0 52px;
    border: 1px solid var(--btn-line);
    border-radius: 32px;
    background: var(--btn);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: .01em;
    cursor: pointer;
    box-shadow: 0 16px 30px -18px rgba(0, 0, 0, .8);
    transition: transform .45s var(--spring), box-shadow .3s;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 18px 34px -16px rgba(0, 0, 0, .85), 0 0 0 3px rgba(255, 214, 10, .28); }
  .btn:active { transform: scale(.96); transition-duration: .1s; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .btn[aria-disabled="true"] { cursor: progress; transform: none; }

  .arrow { position: absolute; left: 24px; top: 21px; width: 22px; height: 22px; fill: none; stroke: var(--volt); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; overflow: visible; transition: transform .55s var(--spring), opacity .25s; }
  .btn:hover .arrow { animation: bob .8s ease-in-out infinite; }
  .check { position: absolute; left: 22px; top: 20px; width: 24px; height: 24px; fill: none; stroke: var(--volt); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .check path { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .4s ease-out; }
  .label { display: block; white-space: nowrap; font-variant-numeric: tabular-nums; transition: transform .5s var(--spring), letter-spacing .3s; }
  .btn:hover .label { letter-spacing: .03em; }

  /* The wave is drawn by script, one path for the done part, one for the rest */
  .wave { position: absolute; left: 0; top: 0; width: 250px; height: 64px; overflow: visible; pointer-events: none; }
  .wave path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wave .dim { stroke: var(--dim); stroke-width: 2.2; }
  .wave .lit { stroke: var(--volt); stroke-width: 3; filter: drop-shadow(0 0 4px rgba(255, 214, 10, .7)); }

  .fx { position: absolute; left: 34px; top: 32px; width: 0; height: 0; pointer-events: none; }
  .particle { position: absolute; width: 3px; height: 12px; border-radius: 2px; background: var(--volt); pointer-events: none; }

  .cap { margin: 0; font-size: 13.5px; color: var(--muted); text-align: center; }
  .cap b { color: var(--text); font-weight: 650; }

  /* ---------- States ---------- */
  /* working: the arrow tips over and becomes the wave; the label moves up */
  .btn:is([data-state="working"], [data-state="settle"]) .arrow { transform: translate(6px, 10px) rotate(-90deg) scale(.6); opacity: 0; animation: none; transition: transform .35s cubic-bezier(.6, 0, .4, 1), opacity .2s .2s; }
  .btn:is([data-state="working"], [data-state="settle"]) .label { transform: translate(-10px, -11px) scale(.82); }
  .btn[data-state="done"] .arrow { opacity: 0; transform: translateY(-14px) scale(.5); animation: none; }
  .btn[data-state="done"] .check path { stroke-dashoffset: 0; }
  .btn[data-state="done"] .check { animation: boing .6s var(--spring); }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes boing { 0% { transform: scale(.3); } 100% { transform: scale(1); } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .fx { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wl">
    <button class="btn" type="button" data-state="idle" aria-describedby="cap">
      <svg class="arrow" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2v15M4.5 10.5L11 17l6.5-6.5" /></svg>
      <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5l6 6L21.5 5.5" /></svg>
      <svg class="wave" viewBox="0 0 250 64" aria-hidden="true"><path class="dim" d="" /><path class="lit" d="" /></svg>
      <span class="label">Download</span>
    </button>
    <span class="fx" aria-hidden="true"></span>
  </div>
  <p class="cap" id="cap"><b>Night-Drive-Mix.mp3</b> · 9.6 MB</p>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Wavelet download button ----------
  const btn = document.querySelector(".btn");
  const label = btn.querySelector(".label");
  const lit = btn.querySelector(".wave .lit");
  const dim = btn.querySelector(".wave .dim");
  const fx = document.querySelector(".fx");
  const status = document.getElementById("status");

  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const START_X = 35;      // the wave starts where the arrow was
  const FULL = 191;        // full length of the wave
  const MID_Y = 43;        // centre line of the wave
  const WAVELENGTH = 26;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduceMotion.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 250) : ms));
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  let busy = false;

  // Wave state, drawn every frame while busy
  const W = { x0: START_X, len: 0, amp: 0, phase: 0, p: 0, target: 0, pulse: false };
  let rafId = 0;
  let last = 0;

  function play(el, frames, options) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, options).finished.catch(() => {});
  }

  // Build a sine path from x=a to x=b; the ends taper so it looks like a string
  function wavePath(a, b, amp, now) {
    if (b - a < .5 || W.len < .5) return "";
    const xs = [];
    for (let x = a; x < b; x += 3) xs.push(x);
    xs.push(b);
    const energy = W.pulse && !calm() ? 1 + .18 * Math.sin(now / 240) : 1;
    return xs.map((x, i) => {
      const u = Math.min(1, Math.max(0, (x - W.x0) / W.len));
      const taper = Math.pow(Math.sin(Math.PI * u), .6);
      const y = MID_Y + amp * energy * taper * Math.sin(((x - W.x0) / WAVELENGTH) * Math.PI * 2 + W.phase);
      return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(2);
    }).join("");
  }

  function draw(now) {
    const end = W.x0 + W.len;
    const split = W.x0 + W.len * W.p;
    lit.setAttribute("d", wavePath(W.x0, split, W.amp, now));
    dim.setAttribute("d", wavePath(split, end, W.amp * .35, now));
  }

  // Main loop: the wave travels and the lit part eases toward the progress
  function loop(now) {
    const dt = last ? now - last : 16;
    last = now;
    if (!calm()) W.phase -= dt * .011;
    W.p = calm() ? W.target : W.p + (W.target - W.p) * Math.min(1, dt / 120);
    draw(now);
    rafId = requestAnimationFrame(loop);
  }
  function startLoop() {
    if (!rafId) { last = 0; rafId = requestAnimationFrame(loop); }
  }
  function stopLoop() {
    cancelAnimationFrame(rafId);
    rafId = 0;
    lit.setAttribute("d", "");
    dim.setAttribute("d", "");
  }

  // Ease some wave numbers to new values
  function tweenWave(to, ms) {
    const from = {};
    Object.keys(to).forEach((k) => (from[k] = W[k]));
    return new Promise((resolve) => {
      if (calm()) { Object.assign(W, to); resolve(); return; }
      const t0 = performance.now();
      (function step(now) {
        const t = Math.min(1, (now - t0) / ms);
        const e = easeOut(t);
        Object.keys(to).forEach((k) => (W[k] = from[k] + (to[k] - from[k]) * e));
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      })(t0);
    });
  }

  // Yellow sparks shooting out of the tick
  function sparks() {
    if (calm()) return;
    for (let i = 0; i < 12; i++) {
      const p = document.createElement("i");
      p.className = "particle";
      fx.appendChild(p);
      const deg = i * 30 + Math.random() * 10;
      const d = 30 + Math.random() * 22;
      p.animate([
        { transform: "translate(-50%, -50%) rotate(" + deg + "deg) translateY(-12px) scaleY(.4)", opacity: 1 },
        { transform: "translate(-50%, -50%) rotate(" + deg + "deg) translateY(-" + d.toFixed(1) + "px) scaleY(1)", opacity: 1, offset: .5 },
        { transform: "translate(-50%, -50%) rotate(" + deg + "deg) translateY(-" + (d + 14).toFixed(1) + "px) scaleY(.2)", opacity: 0 }
      ], { duration: 650, easing: "cubic-bezier(.2, .7, .4, 1)" }).onfinish = () => p.remove();
    }
  }

  async function swapLabel(text) {
    await play(label, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 });
    label.textContent = text;
    play(label, [{ opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0)" }], { duration: 300 });
  }

  // Fake download with uneven chunks
  function simulateDownload(onTick) {
    return new Promise((resolve) => {
      let p = 0;
      (function step() {
        p = Math.min(100, p + 2 + Math.random() * 6);
        onTick(p);
        if (p >= 100) resolve();
        else setTimeout(step, 140 + Math.random() * 110);
      })();
    });
  }

  btn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    btn.setAttribute("aria-disabled", "true");

    // 1. Anticipation: the button squashes and the arrow compresses
    await Promise.all([
      play(btn, [{ transform: "scale(1)" }, { transform: "scale(1.04, .86)" }, { transform: "scale(.98, 1.04)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" }),
      play(btn.querySelector(".arrow"), [{ transform: "scaleY(1)" }, { transform: "translateY(4px) scaleY(.6)" }, { transform: "scaleY(1)" }], { duration: 360, easing: "ease-in-out" })
    ]);

    // 2. The arrow tips over; a wave unrolls from it across the button
    Object.assign(W, { x0: START_X, len: 0, amp: 0, p: 0, target: 0, pulse: true });
    btn.dataset.state = "working";
    label.textContent = "Downloading 0%";
    status.textContent = "Download started.";
    startLoop();
    await wait(200);
    await tweenWave({ len: FULL, amp: 7 }, 650);

    // 3. Progress: the bright part of the wave grows from the left
    let spoken = 0;
    await simulateDownload((p) => {
      W.target = p / 100;
      label.textContent = "Downloading " + Math.round(p) + "%";
      if (p - spoken >= 25 && p < 100) {
        spoken = Math.floor(p / 25) * 25;
        status.textContent = "Downloading, " + spoken + " percent.";
      }
    });
    await wait(300);

    // 4. Settle: the wave calms into a straight line, then winds back into a tick
    btn.dataset.state = "settle";
    W.pulse = false;
    await tweenWave({ amp: 0 }, 380);
    await tweenWave({ len: 0 }, 320);
    stopLoop();

    // 5. Finish: tick springs in, sparks fly, the button flashes
    btn.dataset.state = "done";
    sparks();
    play(btn, [{ boxShadow: "0 0 0 0 rgba(255, 214, 10, .8)" }, { boxShadow: "0 0 0 18px rgba(255, 214, 10, 0)" }], { duration: 700, easing: "ease-out" });
    swapLabel("Saved");
    status.textContent = "Download complete. Night-Drive-Mix.mp3 is saved.";
    await wait(2300);

    // 6. Reset: tick undraws, the arrow springs back
    btn.dataset.state = "idle";
    swapLabel("Download");
    await wait(450);
    btn.removeAttribute("aria-disabled");
    busy = false;
  });
</script>
</body>
</html>
