<!doctype html>
<!-- Chill and Craft · Orbit · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit · spinning code field</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --stage: #eceefe;
    --card: #ffffff;
    --ink: #1c1840;
    --muted: #6b6890;
    --line: #d6d3f2;
    --box: #f6f5ff;
    --accent: #6d4dff;
    --accent-2: #00a8cc;
    --good: #0f9f6e;
    --bad: #e0414b;
    --glow: rgba(109, 77, 255, .28);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --stage: #090817;
    --card: #141231;
    --ink: #eeeaff;
    --muted: #9b96c8;
    --line: #2f2b5e;
    --box: #1b1842;
    --accent: #9d8aff;
    --accent-2: #4fd8f0;
    --good: #3ddc97;
    --bad: #ff6b74;
    --glow: rgba(157, 138, 255, .35);
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    color: var(--ink);
    background:
      radial-gradient(600px 300px at 15% 0%, var(--glow), transparent 70%),
      radial-gradient(500px 300px at 100% 100%, rgba(0, 168, 204, .14), transparent 70%),
      var(--stage);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: min(100%, 400px);
    padding: 28px 22px 24px;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px var(--glow);
    text-align: center;
  }

  /* Small planet with a moon going round it */
  .planet { width: 64px; height: 64px; display: block; margin: 0 auto 10px; }
  .moon { transform-origin: 32px 32px; animation: revolve 5s linear infinite; }
  @keyframes revolve { to { transform: rotate(360deg); } }

  h1 { margin: 0 0 6px; font-size: clamp(20px, 5.4vw, 24px); }
  .sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

  /* ---------- Code boxes ---------- */
  .row {
    position: relative;
    display: flex;
    justify-content: center;
    gap: clamp(8px, 3vw, 14px);
    margin: 24px 0 8px;
    min-height: 68px;
  }
  .box {
    width: clamp(52px, 15vw, 62px);
    height: 66px;
    padding: 0;
    border: 2px solid var(--line);
    border-radius: 18px;
    background: var(--box);
    color: var(--ink);
    caret-color: var(--accent);
    text-align: center;
    font: 700 28px/1 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); transform: translateY(-2px); }
  .box.filled { border-color: var(--accent-2); }
  .box:disabled { opacity: 1; -webkit-text-fill-color: var(--ink); }
  .box:hover:not(:focus):not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); transform: translateY(-1px); }

  /* Each digit spins into its box with a spring and a ripple */
  .box.pop { animation: spinPop .6s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes spinPop {
    0% { transform: rotate(-150deg) scale(.35); box-shadow: 0 0 0 0 var(--glow); }
    55% { box-shadow: 0 0 0 12px transparent; }
    100% { transform: none; }
  }

  /* Checking: a light runs round the boxes */
  .row.checking .box { animation: pulse .8s ease-in-out infinite; animation-delay: calc(var(--i) * .12s); }
  @keyframes pulse { 50% { border-color: var(--accent); box-shadow: 0 0 0 5px var(--glow); transform: translateY(-4px); } }

  /* Success: every box spins into the middle and shrinks away */
  .row.merge .box { animation: spinIn .85s cubic-bezier(.6, 0, .4, 1) forwards; animation-delay: calc(var(--i) * .05s); }
  @keyframes spinIn {
    0% { transform: none; }
    45% { transform: translateX(calc(var(--dx) * .55)) translateY(-14px) rotate(200deg) scale(.85); border-radius: 22px; }
    100% { transform: translateX(var(--dx)) rotate(540deg) scale(.15); border-radius: 50%; opacity: 0; }
  }

  /* Wrong code: wobble in red */
  .row.miss .box { border-color: var(--bad); animation: wobble .5s ease; }
  @keyframes wobble {
    25% { transform: rotate(-9deg); }
    50% { transform: rotate(7deg); }
    75% { transform: rotate(-4deg); }
  }

  /* The single check mark that the boxes become */
  .done {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    opacity: 0;
    transform: scale(.4);
    pointer-events: none;
  }
  .done circle { stroke-dasharray: 202; stroke-dashoffset: 202; }
  .done path { stroke-dasharray: 40; stroke-dashoffset: 40; }
  .row.solved .done { opacity: 1; transform: scale(1); transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; }
  .row.solved .done circle { stroke-dashoffset: 0; transition: stroke-dashoffset .6s ease .1s; }
  .row.solved .done path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s ease .55s; }
  .row.solved .done { animation: doneBounce .6s cubic-bezier(.34, 1.56, .64, 1) .9s; }
  @keyframes doneBounce { 40% { transform: scale(1.18); } 70% { transform: scale(.94); } }

  /* Shock rings that ripple out when the check lands */
  .shock {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    opacity: 0;
    pointer-events: none;
  }
  .shock.two { border-color: var(--accent-2); }
  .row.solved .shock { animation: shock 1s ease-out .55s; }
  .row.solved .shock.two { animation-delay: .75s; }
  @keyframes shock { from { opacity: .9; transform: scale(.7); } to { opacity: 0; transform: scale(3); } }

  /* The planet cheers too */
  .card.win { animation: cardGlow 1.3s ease; }
  @keyframes cardGlow { 35% { box-shadow: 0 0 0 6px var(--glow), 0 30px 60px -20px var(--glow); } }
  .card.win .planet { animation: planetPop .8s cubic-bezier(.34, 1.56, .64, 1); }
  .card.win .moon { animation-duration: .9s; }
  @keyframes planetPop { 40% { transform: scale(1.25) rotate(-12deg); } }

  /* ---------- Status, hint and buttons ---------- */
  .status { min-height: 22px; margin: 14px 0 4px; font-size: 15px; font-weight: 600; }
  .status[data-tone="good"] { color: var(--good); }
  .status[data-tone="bad"] { color: var(--bad); }
  .hint { margin: 8px 0 16px; font-size: 14px; color: var(--muted); }
  .hint b {
    display: inline-block;
    margin-left: 4px;
    padding: 3px 10px;
    border-radius: 8px;
    background: var(--box);
    border: 1px dashed var(--line);
    color: var(--accent);
    letter-spacing: .3em;
  }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 14px;
    cursor: pointer;
  }
  .ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
  .ghost:disabled { opacity: .5; cursor: default; }
  .solid { border: 0; color: #fff; background: linear-gradient(120deg, var(--accent), var(--accent-2)); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Micro-interactions ---------- */
  button { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, border-color .2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  .solid:hover { box-shadow: 0 10px 22px -10px var(--accent); }
  .ghost:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(.94); transition-duration: .08s; }
  .status.pop { animation: statusIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes statusIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Celebration particles: little stars ---------- */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; display: block; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .fx i.dot { clip-path: none; border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
    .moon { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <svg class="planet" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9d8aff"/>
          <stop offset="1" stop-color="#22c3e6"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="3 5"/>
      <circle cx="32" cy="32" r="13" fill="url(#pg)"/>
      <g class="moon"><circle cx="32" cy="5" r="4.5" fill="#ffb84d"/></g>
    </svg>
    <h1 id="title">Confirm it's you</h1>
    <p class="sub">Enter the 4-digit code we sent to your phone ending in 82.</p>

    <!-- Four code boxes; they spin together into one check mark -->
    <div class="row" id="row" role="group" aria-labelledby="title" aria-describedby="hint">
      <input class="box" style="--i:0" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 4">
      <input class="box" style="--i:1" inputmode="numeric" autocomplete="off" aria-label="Digit 2 of 4">
      <input class="box" style="--i:2" inputmode="numeric" autocomplete="off" aria-label="Digit 3 of 4">
      <input class="box" style="--i:3" inputmode="numeric" autocomplete="off" aria-label="Digit 4 of 4">
      <svg class="done" viewBox="0 0 72 72" aria-hidden="true">
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--good)" stroke-width="4" transform="rotate(-90 36 36)"/>
        <path d="M23 37l9 9 17-19" fill="none" stroke="var(--good)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="shock" aria-hidden="true"></span>
      <span class="shock two" aria-hidden="true"></span>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Demo code<b id="demo"></b></p>
    <div class="actions">
      <button type="button" class="ghost" id="resend">Resend code</button>
      <button type="button" class="solid" id="again" hidden>Verify again</button>
    </div>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 120) : ms));

  const row = document.getElementById("row");
  const boxes = Array.from(row.querySelectorAll(".box"));
  const statusEl = document.getElementById("status");
  const demoEl = document.getElementById("demo");
  const resendBtn = document.getElementById("resend");
  const againBtn = document.getElementById("again");

  const LEN = boxes.length;
  const vals = Array(LEN).fill("");
  let demo = "";
  let busy = false;

  // ---- Helpers ----
  function newCode() {
    demo = "";
    for (let i = 0; i < LEN; i++) demo += Math.floor(Math.random() * 10);
    demoEl.textContent = demo;
  }
  function say(msg, tone) {
    statusEl.textContent = msg;
    statusEl.dataset.tone = tone || "";
    restart(statusEl, "pop");
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;              // reflow so the animation plays again
    el.classList.add(cls);
  }
  function setDigit(i, d) {
    vals[i] = d;
    boxes[i].value = d;
    boxes[i].classList.toggle("filled", d !== "");
    if (d) {
      restart(boxes[i], "pop");       // the digit spins in
      boxes.forEach((b) => b.removeAttribute("aria-invalid"));
    }
  }

  // ---- Celebration: a burst of stars from the check mark ----
  const fx = document.getElementById("fx");
  const cardEl = document.getElementById("card");
  const STAR_COLORS = ["#9d8aff", "#4fd8f0", "#ffb84d", "#6d4dff", "#ffffff"];
  function burst(from) {
    if (reduce) return;
    const r = from.getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    for (let n = 0; n < 40; n++) {
      const p = document.createElement("i");
      const size = 6 + Math.random() * 12;
      if (n % 4 === 3) p.className = "dot";
      p.style.width = p.style.height = size + "px";
      p.style.background = STAR_COLORS[n % STAR_COLORS.length];
      fx.append(p);
      const angle = (n / 40) * Math.PI * 2 + Math.random() * 0.3;   // a full ring
      const dist = 70 + Math.random() * 120;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const start = "translate(" + (x0 - size / 2) + "px," + (y0 - size / 2) + "px)";
      p.animate([
        { transform: start + " scale(.2) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + (x0 + dx - size / 2) + "px," + (y0 + dy - size / 2) + "px) scale(1) rotate(180deg)", opacity: 1, offset: 0.6 },
        { transform: "translate(" + (x0 + dx * 1.15 - size / 2) + "px," + (y0 + dy * 1.15 + 30 - size / 2) + "px) scale(.2) rotate(320deg)", opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.15, .75, .3, 1)" }).onfinish = () => p.remove();
    }
  }
  function clearAll() {
    for (let i = 0; i < LEN; i++) setDigit(i, "");
  }
  function focusBox(i) {
    const box = boxes[Math.max(0, Math.min(LEN - 1, i))];
    box.focus();
    box.select();
  }
  function fillFrom(start, digits) {
    let i = start;
    for (const d of digits) {
      if (i >= LEN) break;
      setDigit(i, d);
      i++;
    }
    focusBox(i);
    checkFull();
  }
  function checkFull() {
    if (!busy && vals.every((v) => v !== "")) verify(vals.join(""));
  }
  function setLocked(locked) {
    boxes.forEach((b) => (b.disabled = locked));
  }

  // ---- Typing, paste, backspace and arrow keys ----
  boxes.forEach((box, i) => {
    box.addEventListener("focus", () => requestAnimationFrame(() => box.select()));

    box.addEventListener("input", (e) => {
      if (busy) { box.value = vals[i]; return; }
      const all = box.value.replace(/\D/g, "");
      if (e.inputType === "insertText") {
        const typed = (e.data || "").replace(/\D/g, "");
        if (!typed) { box.value = vals[i]; return; }
        setDigit(i, typed.slice(-1));
        focusBox(i + 1);
        checkFull();
      } else if (all.length > 1) {
        fillFrom(all.length >= LEN ? 0 : i, all);
      } else {
        setDigit(i, all);
        if (all) { focusBox(i + 1); checkFull(); }
      }
    });

    box.addEventListener("keydown", (e) => {
      if (busy) return;
      switch (e.key) {
        case "Backspace":
          e.preventDefault();
          if (vals[i]) setDigit(i, "");
          else if (i > 0) { setDigit(i - 1, ""); focusBox(i - 1); }
          break;
        case "Delete": e.preventDefault(); setDigit(i, ""); break;
        case "ArrowLeft": e.preventDefault(); focusBox(i - 1); break;
        case "ArrowRight": e.preventDefault(); focusBox(i + 1); break;
        case "Home": e.preventDefault(); focusBox(0); break;
        case "End": e.preventDefault(); focusBox(LEN - 1); break;
      }
    });

    box.addEventListener("paste", (e) => {
      e.preventDefault();
      if (busy) return;
      const digits = (e.clipboardData ? e.clipboardData.getData("text") : "").replace(/\D/g, "");
      if (digits) fillFrom(digits.length >= LEN ? 0 : i, digits);
      else say("Only numbers can be pasted here.", "bad");
    });
  });

  // ---- Check the code, then spin into one check mark ----
  function measure() {
    // (layout positions, so running animations do not disturb the numbers)
    const mid = row.clientWidth / 2;
    boxes.forEach((box) => {
      box.style.setProperty("--dx", mid - (box.offsetLeft + box.offsetWidth / 2) + "px");
    });
  }

  async function verify(code) {
    busy = true;
    setLocked(true);
    say("Checking your code…");
    row.classList.add("checking");
    await wait(900);
    row.classList.remove("checking");

    if (code === demo) {
      // Stage 1: boxes spin into the middle. Stage 2: the check draws itself.
      // Stage 3: shock rings, a star burst and a happy planet.
      measure();
      row.classList.add("merge");
      await wait(800);
      row.classList.add("solved");
      say("Verified. You're all set!", "good");
      await wait(600);
      burst(row.querySelector(".done"));
      cardEl.classList.add("win");
      againBtn.hidden = false;
      againBtn.focus();
    } else {
      boxes.forEach((b) => b.setAttribute("aria-invalid", "true"));
      say("That code didn't match. Please try again.", "bad");
      row.classList.add("miss");
      await wait(600);
      row.classList.remove("miss");
      clearAll();
      busy = false;
      setLocked(false);
      focusBox(0);
    }
  }

  // ---- Buttons ----
  againBtn.addEventListener("click", () => {
    row.classList.remove("merge", "solved");
    cardEl.classList.remove("win");
    againBtn.hidden = true;
    clearAll();
    newCode();
    busy = false;
    setLocked(false);
    say("New code ready. Enter it below.");
    focusBox(0);
  });

  let cooldown = 0;
  resendBtn.addEventListener("click", () => {
    if (busy || cooldown) return;
    newCode();
    clearAll();
    say("We sent a new code.");
    focusBox(0);
    cooldown = 15;
    resendBtn.disabled = true;
    resendBtn.textContent = "Resend in 15s";
    const tick = setInterval(() => {
      cooldown--;
      resendBtn.textContent = cooldown ? "Resend in " + cooldown + "s" : "Resend code";
      if (!cooldown) { clearInterval(tick); resendBtn.disabled = false; }
    }, 1000);
  });

  newCode();
})();
</script>
</body>
</html>
