<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Measure Up · Tape measure progress button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #e9e6df;
    --grid: rgba(60, 80, 110, 0.09);
    --card: #fbfaf7;
    --ink: #1f2226;
    --muted: #6c6f74;
    --line: rgba(31, 34, 38, 0.12);
    --yellow: #ffc61f;
    --yellow-b: #f0a90c;
    --rubber: #27292e;
    --steel: #9aa4ae;
    --ok: #1fbf75;
    --focus: #2b6cff;
    --shadow: rgba(40, 36, 20, 0.4);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #15171a;
    --grid: rgba(255, 210, 90, 0.06);
    --card: #202328;
    --ink: #f1efe9;
    --muted: #a3a6ab;
    --line: rgba(241, 239, 233, 0.12);
    --yellow: #ffcb2e;
    --yellow-b: #e9a40a;
    --rubber: #0d0e10;
    --steel: #a9b3bd;
    --ok: #2fd487;
    --focus: #7ea6ff;
    --shadow: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---------- Stage: a workbench sheet of graph paper ---------- */
  .stage {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow: hidden;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--bg);
  }
  .card { position: relative; width: min(560px, 100%); padding: clamp(16px, 4vw, 24px); border-radius: 24px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 36px 70px -40px var(--shadow); }
  .hd { display: flex; align-items: center; gap: 12px; }
  .thumb { flex: none; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; }
  .thumb svg { width: 100%; height: 100%; display: block; }
  h1 { margin: 0; font-size: 1.02rem; font-weight: 750; }
  .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }

  /* ---------- The rig: the tape case is the button, its tape is the progress bar ---------- */
  .rig { --cs: clamp(80px, 19vw, 96px); position: relative; height: calc(var(--cs) + 30px); margin: 14px 0 6px; }
  .case {
    position: absolute;
    z-index: 3;
    left: 0;
    top: 14px;
    width: var(--cs);
    height: var(--cs);
    padding: 0;
    border: 0;
    border-radius: 30%;
    cursor: pointer;
    background: linear-gradient(150deg, #ffe07a, var(--yellow) 40%, var(--yellow-b));
    box-shadow: inset 0 0 0 5px var(--rubber), inset 0 -8px 10px rgba(0, 0, 0, 0.18), 0 14px 22px -12px var(--shadow);
    color: #1b1c1f;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    transform-origin: 40% 80%;
  }
  .case:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .case:hover .plate { transform: rotate(-6deg); }
  .case::after { content: ""; position: absolute; inset: 5px; border-radius: inherit; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.45) 45%, transparent 60%); background-size: 260% 100%; animation: shine 4.5s ease-in-out infinite; pointer-events: none; }
  @keyframes shine { 0%, 60% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
  .plate { position: absolute; left: 12%; top: 8%; width: 76%; height: 76%; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .clabel { position: absolute; left: 0; right: 0; bottom: 11%; font-size: clamp(0.64rem, 2.2vw, 0.74rem); font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .lock { position: absolute; top: -5px; left: 26%; width: 22px; height: 9px; border-radius: 4px 4px 2px 2px; background: var(--rubber); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2); transition: transform 0.25s cubic-bezier(0.3, 1.8, 0.5, 1); }
  .case[data-locked="true"] .lock { transform: translateX(16px); }
  .mouth { position: absolute; right: -2px; bottom: 16px; width: 10px; height: 30px; border-radius: 3px; background: var(--rubber); }
  .badge { position: absolute; right: -8px; top: -8px; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--card); display: grid; place-items: center; opacity: 0; transform: scale(0); }
  .badge svg { width: 16px; height: 16px; }

  .track { position: absolute; z-index: 1; left: calc(var(--cs) - 10px); right: 0; top: calc(14px + var(--cs) - 46px); height: 30px; overflow: hidden; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 15px) 0 50% / 100% 2px no-repeat; }
  .goal { position: absolute; right: 4px; top: 2px; bottom: 2px; width: 3px; border-radius: 2px; background: var(--ok); opacity: 0.6; }
  .tape {
    position: absolute;
    left: 0;
    top: 3px;
    height: 24px;
    width: 6px;
    border-radius: 0 2px 2px 0;
    /* the scale is anchored at the hook end, so the numbers slide out of the case like a real tape */
    background:
      repeating-linear-gradient(270deg, #1d1d1d 0 1.6px, transparent 1.6px 60px) 100% 0 / 100% 12px no-repeat,
      repeating-linear-gradient(270deg, #1d1d1d 0 1px, transparent 1px 30px) 100% 0 / 100% 8px no-repeat,
      repeating-linear-gradient(270deg, #1d1d1d 0 1px, transparent 1px 6px) 100% 0 / 100% 4px no-repeat,
      linear-gradient(180deg, #ffe26a, var(--yellow) 50%, var(--yellow-b));
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.25), 0 3px 4px -2px rgba(0, 0, 0, 0.3);
  }
  .tape i { position: absolute; bottom: 1px; font: 800 9px/1 system-ui, sans-serif; font-style: normal; color: #1d1d1d; transform: translateX(50%); }
  .tape i.red { color: #d3242f; }
  .hook { position: absolute; right: -4px; top: -3px; width: 7px; height: 30px; border-radius: 2px; background: linear-gradient(90deg, #6d7681, var(--steel), #5d6670); transform-origin: 0 50%; }
  .hook::after { content: ""; position: absolute; left: 1px; top: 12px; width: 4px; height: 4px; border-radius: 50%; background: #3b4148; }
  .bubble { position: absolute; z-index: 4; top: calc(14px + var(--cs) - 84px); left: 0; padding: 5px 9px; border-radius: 9px; background: var(--ink); color: var(--card); font-size: 0.78rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; transform: translateY(6px) scale(0.8); transition: opacity 0.25s, transform 0.35s cubic-bezier(0.3, 1.7, 0.5, 1); pointer-events: none; }
  .bubble::after { content: ""; position: absolute; left: var(--tip, 50%); bottom: -4px; width: 8px; height: 8px; margin-left: -4px; background: inherit; transform: rotate(45deg); border-radius: 1px; }
  .bubble.show { opacity: 1; transform: none; }
  .spark { position: absolute; z-index: 5; left: 0; top: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--yellow); pointer-events: none; }

  /* ---------- Info row ---------- */
  .info { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; min-height: 34px; }
  .stage-text { margin: 0; font-size: 0.86rem; font-weight: 700; }
  .nums { margin: 0; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cancel { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--muted); font: inherit; font-size: 0.78rem; font-weight: 650; cursor: pointer; }
  .cancel:hover { color: var(--ink); border-color: var(--ink); }
  .cancel:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .cancel[hidden] { display: none; }
  .right { display: flex; align-items: center; gap: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.25; } }
  @media (prefers-reduced-motion: reduce) {
    .case::after { animation: none; }
    .plate, .lock, .bubble { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" id="card" aria-labelledby="ttl">
      <header class="hd">
        <span class="thumb" aria-hidden="true"><svg viewBox="0 0 44 44"><rect width="44" height="44" fill="#7fc8f8" /><circle cx="32" cy="12" r="5" fill="#fff3b0" /><path d="M0 30 Q11 22 22 28 T44 26 V44 H0 Z" fill="#2f8fd1" /><path d="M0 36 Q14 30 26 35 T44 34 V44 H0 Z" fill="#f1d29b" /></svg></span>
        <div>
          <h1 id="ttl">Photo backup</h1>
          <p class="sub">Karachi beach trip · 128 photos · 412 MB</p>
        </div>
      </header>

      <div class="rig" id="rig">
        <button class="case" id="case" type="button" aria-label="Back up 128 photos" aria-describedby="stage-text" data-locked="false">
          <span class="lock" aria-hidden="true"></span>
          <span class="mouth" aria-hidden="true"></span>
          <svg class="plate" viewBox="0 0 80 80" aria-hidden="true">
            <circle cx="40" cy="38" r="30" fill="#2a2c31" />
            <circle cx="40" cy="38" r="24" fill="#121316" />
            <circle id="coil" cx="40" cy="38" r="15" fill="none" stroke="#f5b81c" stroke-width="12" />
            <circle cx="40" cy="38" r="9.5" fill="#121316" />
            <g id="spool"><circle cx="40" cy="38" r="8" fill="#a8b0ba" /><path d="M40 30.5v15M33.5 34.2l13 7.6M33.5 41.8l13-7.6" stroke="#59616b" stroke-width="2.4" stroke-linecap="round" /></g>
            <circle cx="40" cy="38" r="2.4" fill="#eef1f4" />
          </svg>
          <span class="clabel" id="clabel">Sync</span>
          <span class="badge" id="badge" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
        </button>
        <div class="track" id="track" role="progressbar" aria-label="Backup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i class="goal" aria-hidden="true"></i>
          <div class="tape" id="tape"><b class="hook" id="hook" aria-hidden="true"></b></div>
        </div>
        <span class="bubble" id="bubble" aria-hidden="true">0%</span>
      </div>

      <div class="info">
        <p class="stage-text" id="stage-text" role="status" aria-live="polite">Ready: 128 photos waiting</p>
        <div class="right">
          <p class="nums" id="nums">Press the tape to start</p>
          <button class="cancel" id="cancel" type="button" hidden>Cancel</button>
        </div>
      </div>
    </section>
  </main>

<script>
  // Measure Up: a progress button drawn as a tape measure.
  // Start = the case squeezes and the lock clicks, the tape pulls in a hair (anticipation), then the hook flicks
  // out and the steel tape runs across as the progress bar with its scale sliding out of the case.
  // Press again to lock it (pause) and again to let it run. At 100% the lock lets go: the tape whips back into the
  // case, the case kicks from the recoil, sparks fly from the mouth and a tick badge pops. Cancel reels it in slowly.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var rig = $("rig"), caseBtn = $("case"), track = $("track"), tape = $("tape"), hook = $("hook"), bubble = $("bubble");
    var coil = $("coil"), spool = $("spool"), clabel = $("clabel"), badge = $("badge"), stageText = $("stage-text"), nums = $("nums"), cancelBtn = $("cancel");
    var TOTAL = 128, MB = 412, PEEK = 15; // PEEK: the hook rests just outside the case mouth
    var S = { mode: "idle", p: 0, len: PEEK, lenV: 0, hookA: 0, until: 0, hit: false, netT: 0 };

    function spring(stiff, damp) {
      var x = 0, v = 0, out = [0];
      for (var i = 0; i < 240; i++) { v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; out.push(x); if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break; }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiff, damp) {
      var c = spring(stiff, damp);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }

    // ---------- Scale numbers on the tape (every 60 px from the hook) ----------
    var maxLen = 300;
    function layout() {
      maxLen = Math.max(80, track.clientWidth - 12);
      [].slice.call(tape.querySelectorAll("i")).forEach(function (n) { n.remove(); });
      for (var n = 1; n * 60 < maxLen + 60; n++) {
        var t = document.createElement("i");
        t.textContent = n * 10;
        if (n % 5 === 0) t.className = "red";
        t.style.right = n * 60 + "px";
        tape.appendChild(t);
      }
    }
    layout();
    addEventListener("resize", layout);

    // ---------- States ----------
    var said = "";
    function say(text) { if (text !== said) { said = text; stageText.textContent = text; } }
    function setCase(label, aria) { clabel.textContent = label; caseBtn.setAttribute("aria-label", aria); }
    function start() {
      S.mode = "work"; S.p = 0; S.hit = false;
      caseBtn.dataset.locked = "false";
      cancelBtn.hidden = false;
      badge.getAnimations().forEach(function (a) { a.cancel(); });
      badge.style.opacity = "0";
      setCase("Pause", "Pause backup");
      say("Checking photos");
      bubble.classList.add("show");
      if (calm.matches) return;
      // anticipation: the case squeezes and the tape pulls in before it shoots out
      caseBtn.animate([{ transform: "none" }, { transform: "scale(0.9, 1.05) rotate(-3deg)" }, { transform: "scale(1.04, 0.97) rotate(1deg)" }, { transform: "none" }], { duration: 420, easing: "ease-out" });
      S.lenV = -2.5;
    }
    function pause() {
      S.mode = "paused";
      caseBtn.dataset.locked = "true";
      setCase("Resume", "Resume backup");
      say("Paused at " + Math.round(S.p * 100) + "%");
      nums.textContent = "Press the tape to carry on";
      if (!calm.matches) caseBtn.animate([{ transform: "none" }, { transform: "translateY(2px) scale(0.97)" }, { transform: "none" }], { duration: 220 });
    }
    function resume() {
      S.mode = "work";
      caseBtn.dataset.locked = "false";
      setCase("Pause", "Pause backup");
      if (!calm.matches) S.lenV += 3; // a little lurch as the lock lets go
    }
    function finish() {
      S.p = 1;
      S.mode = "hold";
      S.until = performance.now() + 320;
      cancelBtn.hidden = true;
      say("Verified. Reeling in");
      nums.textContent = TOTAL + " of " + TOTAL + " · " + MB + " MB";
    }
    function cancel() {
      if (S.mode !== "work" && S.mode !== "paused") return;
      say("Backup cancelled at " + Math.round(S.p * 100) + "%");
      nums.textContent = "Nothing was lost. Press the tape to try again";
      S.mode = "cancel";
      S.until = performance.now() + 1100;
      cancelBtn.hidden = true;
      caseBtn.dataset.locked = "false";
      bubble.classList.remove("show");
      setCase("Sync", "Back up 128 photos");
    }
    // the tape slams home: the case kicks back, sparks fly from the mouth and the tick badge pops
    function slam(speed) {
      if (S.hit) return;
      S.hit = true;
      setCase("Done", "Back up 128 photos again");
      say("All 128 photos backed up");
      bubble.classList.remove("show");
      var kick = Math.min(12, Math.abs(speed) / 5);
      springTo(caseBtn, function (p) { var e = 1 - p; return { transform: "translateX(" + (-kick * e).toFixed(2) + "px) rotate(" + (-9 * e).toFixed(2) + "deg)" }; }, 260, 9);
      spool.animate([{ transform: "rotate(0)" }, { transform: "rotate(-540deg)" }], { duration: 500, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" });
      badge.style.opacity = "1";
      springTo(badge, function (p) { return { transform: "scale(" + p.toFixed(3) + ") rotate(" + ((1 - p) * -90).toFixed(1) + "deg)" }; }, 300, 10);
      var cs = caseBtn.offsetWidth, mx = cs, my = 14 + cs - 31;
      for (var i = 0; i < 12; i++) {
        var s = document.createElement("i");
        s.className = "spark";
        rig.appendChild(s);
        var a = (Math.random() - 0.5) * 1.6, d = 22 + Math.random() * 36;
        s.animate([
          { transform: "translate(" + mx + "px," + my + "px) scale(1.4)", opacity: 1 },
          { transform: "translate(" + (mx + Math.cos(a) * d).toFixed(1) + "px," + (my + Math.sin(a) * d + 10).toFixed(1) + "px) scale(0.3)", opacity: 0 }
        ], { duration: 420 + Math.random() * 260, easing: "cubic-bezier(0.1, 0.7, 0.3, 1)" }).finished.then((function (el) { return function () { el.remove(); }; })(s), (function (el) { return function () { el.remove(); }; })(s));
      }
    }

    // ---------- Main loop ----------
    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      if (S.mode === "work") {
        // a believable network: speed wanders, with a weak patch in the middle
        S.netT += dt;
        var rate = (1 / 5.6) * (0.65 + 0.35 * Math.sin(S.netT * 1.7) + 0.25 * Math.sin(S.netT * 4.3 + 1));
        var weak = S.p > 0.55 && S.p < 0.63;
        if (weak) rate *= 0.35;
        if (S.p < 0.06) rate *= 0.6;
        S.p = Math.min(1, S.p + Math.max(0.02, rate) * dt);
        var done = Math.floor(S.p * TOTAL);
        if (S.p < 0.06) say("Checking photos");
        else if (S.p < 0.94) say(weak ? "Weak signal, slowing down" : "Sending photos");
        else say("Verifying");
        nums.textContent = done + " of " + TOTAL + " · " + (rate * MB).toFixed(1) + " MB/s · " + Math.max(1, Math.ceil((1 - S.p) / Math.max(rate, 0.02))) + " s left";
        if (S.p >= 1) finish();
      }
      if (S.mode === "hold" && now > S.until) { S.mode = "retract"; S.until = now + 900; }
      if (S.mode === "retract" && now > S.until) { S.mode = "done"; S.until = now + 2600; if (!S.hit) slam(0); }
      if (S.mode === "done" && now > S.until) {
        S.mode = "idle"; S.p = 0;
        badge.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(0.4)" }], { duration: 300, easing: "ease-in", fill: "forwards" });
        setCase("Sync", "Back up 128 photos");
        say("Ready: 128 photos waiting");
        nums.textContent = "Last backup: just now";
      }
      if (S.mode === "cancel" && now > S.until) { S.mode = "idle"; S.p = 0; }

      // where the hook should be, and how it gets there
      var target = PEEK, k = 0.12, damp = 0.72;
      if (S.mode === "work" || S.mode === "paused" || S.mode === "hold") target = PEEK + S.p * (maxLen - PEEK);
      if (S.mode === "idle" && !calm.matches) target = PEEK + Math.pow(Math.max(0, Math.sin(now / 700)), 10) * 16; // an idle tug
      if (S.mode === "retract") { k = 0.05; damp = 0.93; }
      if (S.mode === "cancel") { k = 0.03; damp = 0.84; }
      if (calm.matches) { S.len = target; S.lenV = 0; }
      else {
        S.lenV = (S.lenV + (target - S.len) * k) * damp;
        S.len += S.lenV;
        if (S.len < 0) { if (S.mode === "retract") slam(S.lenV); S.len = 0; S.lenV = -S.lenV * 0.3; }
      }
      if (calm.matches && S.mode === "retract") slam(0);
      render(now);
      requestAnimationFrame(frame);
    }

    function render(now) {
      var len = Math.max(0, S.len);
      tape.style.width = len.toFixed(1) + "px";
      // the hook leans with the tape's speed and wobbles a little at rest
      var lean = Math.max(-24, Math.min(24, -S.lenV * 1.3));
      S.hookA += (lean - S.hookA) * 0.3;
      hook.style.transform = "rotate(" + S.hookA.toFixed(1) + "deg)";
      // the spool turns as tape leaves it and the coil of tape inside gets thinner
      var frac = Math.min(1, len / maxLen), rOut = 21 - 11 * frac;
      coil.setAttribute("r", ((rOut + 9) / 2).toFixed(2));
      coil.setAttribute("stroke-width", Math.max(0.6, rOut - 9).toFixed(2));
      spool.style.transform = "rotate(" + (len * 1.8).toFixed(1) + "deg)";
      spool.style.transformOrigin = "40px 38px";
      // the bubble rides above the hook
      var pct = Math.round(S.p * 100);
      bubble.textContent = pct + "%";
      var tl = track.offsetLeft, bw = bubble.offsetWidth, x = tl + len, bx = Math.max(tl, Math.min(rig.clientWidth - bw, x - bw / 2));
      bubble.style.left = bx.toFixed(1) + "px";
      bubble.style.setProperty("--tip", Math.max(8, Math.min(bw - 8, x - bx)).toFixed(1) + "px");
      if (+track.getAttribute("aria-valuenow") !== pct) track.setAttribute("aria-valuenow", pct);
    }
    requestAnimationFrame(frame);

    function press() {
      if (S.mode === "idle" || S.mode === "done") start();
      else if (S.mode === "work") pause();
      else if (S.mode === "paused") resume();
    }
    caseBtn.addEventListener("click", press);
    cancelBtn.addEventListener("click", cancel);

    // ---------- Auto demo: run a backup, pausing halfway on every other run ----------
    var demoOn = !calm.matches, timer = 0, runs = 0, pausedRun = -1;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
