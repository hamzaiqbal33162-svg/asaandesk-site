  hbars($("#anCity", v), Object.entries(byCity).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, n], i) => ({ name: k, value: n, color: `var(--c${(i % 5) + 1})` })), moneyS);
  const cols = ["12a", "3a", "6a", "9a", "12p", "3p", "6p", "9p"], order = [1, 2, 3, 4, 5, 6, 0], grid = order.map(() => cols.map(() => 0));
  recent.forEach((o) => { const d = new Date(o.t); grid[order.indexOf(d.getDay())][Math.floor(d.getHours() / 3)]++; });
  heat($("#anHeat", v), { rows: order.map((d) => WD[d]), cols, data: grid, fmt: (n) => n + " orders", color: "var(--c2)", cell: 30, label: "Orders by hour" });
  const catRev = CATS.map((c) => sum(recent, (o) => sum(o.items.filter((x) => (prod(x.id) || {}).cat === c), (x) => x.price * x.qty)));
  barChart($("#anCat", v), { labels: CATS, series: [{ name: "Revenue", data: catRev, color: "var(--c1)" }], fmt: short, tip: money, h: 200, label: "Revenue by collection" });
});
function drawAnalytics() {
  const r = anRange, rev = rangeSum(S.d.rev, r), o = rangeSum(S.d.ord, r), s = rangeSum(S.d.sess, r), k = $("#anK"); if (!k) return;
  k.innerHTML = kpi("Revenue", rev, "money", delta(rangeDelta(S.d.rev, r)), "trend", 1) + kpi("Orders", o, "int", delta(rangeDelta(S.d.ord, r)), "bag", 2) + kpi("Visits", s, "short", delta(rangeDelta(S.d.sess, r)), "eye", 3) + kpi("Average order", o ? rev / o : 0, "money", `<small>conversion ${pct(s ? o / s : 0)}</small>`, "spark", 4);
  counts(k);
  const a = byRange(S.d.sess, r), b = byRange(S.d.ord, r);
  lineChart($("#anLine"), { labels: a.labels, series: [{ name: "Visits", data: a.data, color: "var(--c3)" }, { name: "Orders × 40", data: b.data.map((x) => x * 40), color: "var(--c2)" }], fmt: short, tip: (n) => num(n), h: 240, area: true, label: "Visits and orders" });
  funnel($("#anFun"), [{ name: "Visits", value: s }, { name: "Viewed a product", value: Math.round(s * 0.61) }, { name: "Added to bag", value: Math.round(s * 0.12) }, { name: "Started checkout", value: Math.round(s * 0.052) }, { name: "Ordered", value: o }], short);
}

/* ---------- 10. Discounts ---------- */
const codeVal = (c) => (c.type === "pct" ? c.v + "% off" : c.type === "amt" ? money(c.v) + " off" : "Free delivery");
function codeForm(c) {
  formModal({
    title: c ? "Edit code " + c.code : "New discount code", submit: c ? "Save" : "Create code",
    fields: [{ k: "code", label: "Code", req: true, check: (x) => (!/^[A-Z0-9]{3,14}$/i.test(x) ? "3 to 14 letters or numbers" : S.codes.some((y) => y.code === x.toUpperCase() && y !== c) ? "Code already exists" : "") }, { k: "type", label: "Type", type: "select", options: [["pct", "Percent off"], ["amt", "Amount off"], ["ship", "Free delivery"]] }, { k: "v", label: "Value", type: "number", min: 0, req: true }, { k: "limit", label: "Use limit (0 = no limit)", type: "number", min: 0, step: 1 }, { k: "days", label: "Runs for (days)", type: "number", min: 1, step: 1, req: true }, { k: "active", label: "Active now", type: "check" }],
    values: c ? Object.assign({}, c, { days: Math.max(1, Math.round((c.ends - today0()) / DAY)) }) : { type: "pct", v: 10, limit: 100, days: 14, active: true },
    save: (x) => { if (x.type === "pct" && x.v > 90) return "Percent off can't be over 90"; const data = { code: x.code.toUpperCase(), type: x.type, v: x.v, limit: Math.round(x.limit), ends: today0() + Math.round(x.days) * DAY, active: x.active }; if (c) Object.assign(c, data); else S.codes.unshift(Object.assign({ used: 0 }, data)); save(); toast(c ? "Code saved" : "Code " + data.code + " created"); Router.refresh(); return true; },
    del: c ? () => { S.codes = S.codes.filter((y) => y !== c); save(); toast("Code deleted", "info"); Router.refresh(); } : null
  });
}
Router.add("discounts", "Discounts", (v) => {
  v.innerHTML = head("Discounts", "Codes your customers type at checkout. Switch them on and off any time.", `<button type="button" class="btn primary" data-act="newCode">${ic("plus")} New code</button>`)
    + `<div class="tickets">${S.codes.map((c, i) => { const exp = c.ends < today0(), use = c.limit ? c.used / c.limit : 0; return `<article data-in class="ticket glass${c.active && !exp ? "" : " off"}" style="--t:var(--c${(i % 5) + 1})"><div class="tk-l"><span class="tk-v">${esc(codeVal(c))}</span><code>${esc(c.code)}</code><small>${exp ? "Ended " + fmtDate(c.ends) : "Ends " + fmtDate(c.ends)}</small></div><div class="tk-r"><div class="tk-use"><span>${c.used} used${c.limit ? " of " + c.limit : ""}</span><div class="k-hbr"><i style="width:${(Math.min(1, use) * 100).toFixed(0)}%;background:var(--t)"></i></div></div><div class="tk-a">${swHTML(String(i), c.active && !exp, "Code " + c.code + " active")}<button type="button" class="btn sm glass-btn" data-act="editCode" data-i="${i}">${ic("edit")} Edit</button><button type="button" class="btn sm glass-btn" data-act="copyCode" data-i="${i}">${ic("copy")} Copy</button></div></div></article>`; }).join("") || `<div class="card glass empty"><p>No codes yet.</p></div>`}</div>
    <div class="card glass"><div class="card-h"><h2>Uses per code</h2></div><div id="codeBars"></div></div>`;
  barChart($("#codeBars", v), { labels: S.codes.map((c) => c.code), series: [{ name: "Uses", data: S.codes.map((c) => c.used), color: "var(--c2)" }], fmt: short, tip: (n) => n + " uses", h: 200, label: "Uses per code" });
  $(".tickets", v).addEventListener("click", (e) => { const sw = e.target.closest("[data-sw]"); if (!sw) return; const c = S.codes[+sw.dataset.sw]; if (c.ends < today0()) return toast("This code has ended. Edit it to run it again.", "err"); c.active = !c.active; save(); toast(`${c.code} is ${c.active ? "on" : "off"}`); Router.refresh(); });
});
Object.assign(ACT, {
  newCode: () => codeForm(null), editCode: (b) => codeForm(S.codes[+b.dataset.i]),
  copyCode: (b) => { const c = S.codes[+b.dataset.i]; try { if (navigator.clipboard) navigator.clipboard.writeText(c.code).catch(() => {}); } catch (e) { /* ignore */ } toast(`Copied ${c.code}`); }
});

/* ---------- 11. Settings ---------- */
Router.add("settings", "Settings", (v) => {
  v.innerHTML = head("Settings", "Your shop, delivery, payments and how the glass looks.", "")
    + `<div class="set-grid"><form class="card glass" id="sStore" novalidate><div class="card-h"><h2>Shop profile</h2></div>${fieldsHTML([{ k: "name", label: "Shop name", req: true, full: true }, { k: "email", label: "Email", type: "email", req: true }, { k: "phone", label: "Phone", req: true }, { k: "city", label: "City", type: "select", options: CITIES }], S.store)}<div class="set-f"><button class="btn primary" type="submit">Save profile</button></div></form>
      <div class="card glass"><div class="card-h"><h2>Delivery zones</h2><button type="button" class="btn sm glass-btn" data-act="addZone">${ic("plus")} Zone</button></div><ul class="zones">${S.zones.map((z, i) => `<li><span>${ic("pin")}<b>${esc(z.name)}</b><small>${esc(z.eta)}</small></span><b>${money(z.rate)}</b><button type="button" class="k-x" data-act="delZone" data-i="${i}" aria-label="Remove ${esc(z.name)}">${ic("trash")}</button></li>`).join("")}</ul><form id="sFree" class="inline-f" novalidate><label for="freeOver">Free delivery over</label><input id="freeOver" class="k-input" type="number" min="0" step="500" value="${S.freeOver}"><button class="btn sm" type="submit">Save</button></form></div>
      <div class="card glass"><div class="card-h"><h2>Payments</h2></div><ul class="toggles">${Object.entries(S.pays).map(([k, on]) => `<li><span>${esc(k)}</span>${swHTML("pay:" + k, on, k)}</li>`).join("")}</ul><div class="card-h sub"><h2>Notifications</h2></div><ul class="toggles">${Object.entries(S.notif).map(([k, on]) => `<li><span>${esc(k)}</span>${swHTML("not:" + k, on, k)}</li>`).join("")}</ul></div>
      <div class="card glass"><div class="card-h"><h2>Glass and theme</h2></div><div class="k-field"><label for="blurR">Frost: <b id="blurV">${S.blur}px</b></label><input id="blurR" type="range" min="6" max="40" step="1" value="${S.blur}"></div><div class="glass-demo glass"><b>Preview</b><small>Move the slider to see the frost change.</small></div><div class="set-row"><div><b>Theme</b><small>Light or dark glass</small></div><button type="button" class="btn glass-btn" data-act="theme">${ic("moon")} Switch</button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample shop</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const f = $("#sStore", v);
  f.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(f, [{ k: "name", label: "Shop name", req: true }, { k: "email", label: "Email", type: "email", req: true }, { k: "phone", label: "Phone", req: true }, { k: "city", label: "City" }]); if (!x) return; S.store = x; save(); paintChrome(); toast("Profile saved"); });
  $("#sFree", v).addEventListener("submit", (e) => { e.preventDefault(); const n = Math.max(0, Math.round(+$("#freeOver").value || 0)); S.freeOver = n; save(); toast(n ? "Free delivery over " + money(n) : "Free delivery is off"); });
  $("#blurR", v).addEventListener("input", (e) => { S.blur = +e.target.value; applyBlur(); $("#blurV").textContent = S.blur + "px"; });
  $("#blurR", v).addEventListener("change", save);
  $(".set-grid", v).addEventListener("click", (e) => { const sw = e.target.closest("[data-sw]"); if (!sw) return; const [kind, key] = [sw.dataset.sw.slice(0, 3), sw.dataset.sw.slice(4)], obj = kind === "pay" ? S.pays : S.notif; obj[key] = !obj[key]; sw.setAttribute("aria-checked", String(obj[key])); save(); toast(`${key} ${obj[key] ? "on" : "off"}`); });
});
Object.assign(ACT, {
  addZone: () => formModal({ title: "Add delivery zone", fields: [{ k: "name", label: "City or area", req: true, full: true }, { k: "rate", label: "Rate (Rs)", type: "number", min: 0, req: true }, { k: "eta", label: "Delivery time", req: true, ph: "2-3 days" }], save: (x) => { if (S.zones.some((z) => z.name.toLowerCase() === x.name.toLowerCase())) return "That zone exists"; S.zones.splice(S.zones.length - 1, 0, { name: x.name, rate: Math.round(x.rate), eta: x.eta }); save(); toast("Zone added"); Router.refresh(); return true; } }),
  delZone: (b) => { const z = S.zones[+b.dataset.i]; if (z.name === "Rest of Pakistan") return toast("Keep a zone for the rest of the country", "err"); confirmBox(`Remove ${z.name}?`, () => { S.zones.splice(+b.dataset.i, 1); save(); toast("Zone removed", "info"); Router.refresh(); }, { yes: "Remove" }); },
  reset: () => confirmBox("Reset all demo data on this device?", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); save(); applyBlur(); paintChrome(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset" })
});

/* ---------- 12. Chrome and boot ---------- */
function applyBlur() { document.documentElement.style.setProperty("--blur", S.blur + "px"); }
function paintChrome() {
  $("#storeName").textContent = S.store.name;
  const open = S.orders.filter((o) => o.status === "Unfulfilled").length, n = $("#navOrd"); n.textContent = open; n.hidden = !open;
  $("#sideCard").innerHTML = `<div class="sc-dot"></div><div><b>${esc(S.store.name)}</b><small>Web shop is live · ${S.products.filter((p) => p.active).length} pieces</small></div>`;
  $("#meBox").innerHTML = avatar("Zara Abbasi");
}
/* the nav turns into a bottom dock on phones: the marker slides sideways there */
function navAxis() {
  const nav = $(".nav"), m = $(".nav .k-marker"); let narrow = false;
  try { narrow = matchMedia("(max-width: 860px)").matches; } catch (e) { narrow = innerWidth <= 860; }
  const ax = narrow ? "x" : "y"; if (nav.dataset.marker !== ax) { nav.dataset.marker = ax; m.style.cssText = ""; }
  Router.mark();
}
on("route", () => { const m = $(".nav .k-marker"); if (!m || reduced()) return; m.classList.remove("goo"); void m.offsetWidth; m.classList.add("goo"); });
addEventListener("resize", navAxis);
S = loadState(seedData, VER);
paintIcons(); Theme.label(); applyBlur(); paintChrome();
CMDS = [{ label: "New order", run: newOrderForm }, { label: "New product", run: () => productForm(null) }, { label: "New discount code", run: () => codeForm(null) }, { label: "Change today's target", run: ACT.setTarget }, { label: "Switch theme", run: () => Theme.toggle() }];
Notes.add(`${S.orders.filter((o) => o.status === "Unfulfilled").length} orders are waiting to be packed`, "warn");
S.products.filter((p) => p.stock <= 3).slice(0, 2).forEach((p) => Notes.add(`${p.name} is almost sold out (${p.stock} left)`, "warn"));
Notes.add("EID500 is close to its use limit", "info");
Router.start(); navAxis();
setTimeout(() => island(`${S.store.name} is live · ${S.orders.filter((o) => o.t >= today0()).length} orders today`), 900);

</script>
