<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-vitrea:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Clearcart look: liquid glass over a drawn aurora ---------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.3, 1.6, .5, 1);
  --bg: #e8ecf8; --ink: #0f1629; --muted: #4f5a74; --line: rgba(255, 255, 255, .55); --line-strong: rgba(30, 40, 80, .16);
  --surface: rgba(255, 255, 255, .55); --surface2: rgba(255, 255, 255, .42); --surface-solid: #f5f7ff; --modal-bg: rgba(248, 250, 255, .72); --input-bg: rgba(255, 255, 255, .6);
  --glass: linear-gradient(135deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .2)); --glass-line: rgba(255, 255, 255, .6);
  --glass-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -1px 2px rgba(255, 255, 255, .35), 0 24px 48px -26px rgba(40, 50, 120, .45);
  --spec: rgba(255, 255, 255, .55); --rim: rgba(255, 255, 255, .95); --blur: 22px; --sat: 175%;
  --accent: #3d5afe; --accent-ink: #fff; --ok: #0f9d74; --warn: #c27a00; --err: #e0344f; --focus: #3d5afe;
  --c1: #4b63ff; --c2: #a05cff; --c3: #13b5a3; --c4: #ff5c9d; --c5: #ff9f2e; --c6: #2fb3ff;
  --b1: #7aa3ff; --b2: #c18dff; --b3: #5fe3d0; --b4: #ff9fc9; --b5: #ffd08a; --rib: rgba(255, 255, 255, .55);
  --r: 26px; --r-sm: 14px; --r-btn: 999px; --overlay: rgba(40, 50, 100, .22); --tip-bg: rgba(18, 24, 44, .86); --grid: rgba(30, 40, 80, .08);
  --chip-on: rgba(15, 22, 41, .88); --chip-on-ink: #fff;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #060914; --ink: #eef2ff; --muted: #9ba7c6; --line: rgba(255, 255, 255, .12); --line-strong: rgba(255, 255, 255, .2);
  --surface: rgba(255, 255, 255, .08); --surface2: rgba(255, 255, 255, .07); --surface-solid: #141a30; --modal-bg: rgba(20, 26, 48, .72); --input-bg: rgba(255, 255, 255, .07);
  --glass: linear-gradient(135deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04)); --glass-line: rgba(255, 255, 255, .14);
  --glass-shadow: inset 0 1px 1px rgba(255, 255, 255, .22), inset 0 -1px 2px rgba(255, 255, 255, .06), 0 30px 60px -30px rgba(0, 0, 0, .8);
  --spec: rgba(255, 255, 255, .14); --rim: rgba(255, 255, 255, .4); --sat: 160%;
  --accent: #7d8cff; --accent-ink: #0a0f22; --ok: #37d6a2; --warn: #ffbe55; --err: #ff6b84; --focus: #9aa6ff;
  --c1: #7d8cff; --c2: #c08bff; --c3: #3ee0c8; --c4: #ff7eb3; --c5: #ffb65c; --c6: #5cc8ff;
  --b1: #2440ff; --b2: #7a26ff; --b3: #00a993; --b4: #ff2e7e; --b5: #ff8a00; --rib: rgba(160, 180, 255, .25);
  --overlay: rgba(0, 0, 0, .45); --tip-bg: rgba(30, 38, 70, .92); --grid: rgba(255, 255, 255, .07); --chip-on: rgba(238, 242, 255, .92); --chip-on-ink: #0a0f22;
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
body { background: var(--bg); min-height: 100vh; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 10px; }
.skip:focus { left: 8px; }
.mut { color: var(--muted); font-size: 13px; }
.grow { flex: 1; }

/* ---------- The drawn backdrop ---------- */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--b1) 30%, var(--bg)), transparent 60%), radial-gradient(100% 80% at 100% 100%, color-mix(in srgb, var(--b4) 26%, var(--bg)), transparent 60%), var(--bg); }
.field { position: absolute; inset: -40px; transition: transform .8s var(--ease); }
.blob { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .85; animation: blobIn 2.4s var(--ease) backwards; }
.b1 { width: 46vw; height: 46vw; left: -8vw; top: -10vw; background: radial-gradient(circle at 40% 40%, var(--b1), transparent 68%); }
.b2 { width: 40vw; height: 40vw; right: -6vw; top: 2vh; background: radial-gradient(circle at 50% 50%, var(--b2), transparent 66%); animation-delay: .15s; }
.b3 { width: 36vw; height: 36vw; left: 26vw; bottom: -14vw; background: radial-gradient(circle, var(--b3), transparent 66%); animation-delay: .3s; }
.b4 { width: 30vw; height: 30vw; right: 6vw; bottom: -4vw; background: radial-gradient(circle, var(--b4), transparent 66%); animation-delay: .45s; }
.b5 { width: 22vw; height: 22vw; left: 40vw; top: 12vh; background: radial-gradient(circle, var(--b5), transparent 66%); opacity: .6; animation-delay: .6s; }
@keyframes blobIn { from { transform: scale(.4) translateY(60px); opacity: 0; } }
.ribbons { position: absolute; inset: 0; width: 100%; height: 100%; }
.ribbons path { fill: none; stroke: var(--rib); stroke-width: 1.5; stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: ribbon 3s 0.5s var(--ease) forwards; }
.ribbons path + path { animation-delay: .9s; opacity: .6; }
@keyframes ribbon { to { stroke-dashoffset: 0; } }

/* ---------- Liquid glass ---------- */
.glass { position: relative; isolation: isolate; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)); backdrop-filter: blur(var(--blur)) saturate(var(--sat)); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow); border-radius: var(--r); }
.glass::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: radial-gradient(320px circle at var(--mx, 20%) var(--my, 0%), var(--spec), transparent 62%); transition: background .2s; }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1.2px; background: linear-gradient(145deg, var(--rim), transparent 30%, transparent 62%, color-mix(in srgb, var(--rim) 55%, transparent)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
.glass-btn { background: var(--surface); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-color: var(--glass-line); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6); }
.btn { border-radius: 999px; padding: 8px 16px; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .55), 0 10px 22px -10px var(--accent); }
.ibtn { border-radius: 50%; background: var(--surface); border-color: var(--glass-line); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5); }
.k-modal { -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%); border-color: var(--glass-line); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), 0 40px 90px -30px rgba(20, 30, 80, .55); }
.k-pop { -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%); background: var(--modal-bg); }
.k-mh { background: transparent; }
.k-drawer { border-radius: 30px 0 0 30px; }
.k-toast, .k-tip { -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 16px; }
.k-tw { border-radius: 16px; }
.k-table th { border-color: var(--line-strong); }
.k-table td { border-color: color-mix(in srgb, var(--line-strong) 60%, transparent); }
.k-seg { background: rgba(120, 130, 170, .14); }
.k-seg button[aria-pressed="true"] { background: var(--surface-solid); box-shadow: 0 4px 12px -4px rgba(20, 30, 80, .3), inset 0 1px 1px rgba(255, 255, 255, .7); }

/* ---------- Shell ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 16px; padding: 16px; min-height: 100vh; overflow-x: clip; }
.side { position: sticky; top: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; gap: 22px; padding: 18px 12px; border-radius: 32px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand b { display: block; font-size: 19px; letter-spacing: -.02em; }
.brand small { color: var(--muted); font-size: 12px; }
.logo { width: 42px; height: 42px; filter: drop-shadow(0 6px 10px rgba(80, 90, 220, .35)); animation: bob 5s ease-in-out 2; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(4deg); } }
.nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 18px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 14.5px; transition: color .25s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a .k-ic { width: 20px; height: 20px; }
.nav-n { margin-left: auto; font-style: normal; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--c4); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.nav-n[hidden] { display: none; }
.nav .k-marker { position: absolute; left: 0; top: 0; width: 100%; height: 44px; border-radius: 18px; z-index: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .42)); box-shadow: inset 0 1px 1px #fff, inset 0 -3px 8px rgba(255, 255, 255, .5), 0 10px 22px -10px rgba(60, 80, 200, .55); transition: transform .55s var(--spring), width .4s var(--ease), height .4s var(--ease); }
[data-theme="dark"] .nav .k-marker { background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .07)); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), 0 10px 26px -10px rgba(120, 140, 255, .6); }
.nav .k-marker.goo { animation: goo .55s var(--ease); }
@keyframes goo { 35% { scale: .9 1.22; } 70% { scale: 1.04 .94; } }
.side-card { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--glass-line); }
.side-card b { display: block; font-size: 13px; }
.side-card small { color: var(--muted); font-size: 12px; }
.sc-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); flex: none; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.top { position: sticky; top: 16px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 999px; }
.m-brand { display: none; align-items: center; gap: 8px; font-size: 17px; }
.m-brand svg { width: 30px; height: 30px; }
.search-btn { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--surface2); color: var(--muted); min-width: 220px; font-size: 14px; }
.search-btn kbd { margin-left: auto; font: 600 11px var(--font); padding: 2px 7px; border-radius: 8px; background: var(--surface); }
.me .k-av { width: 40px; height: 40px; }
/* the island: a dark pill that stretches to show news */
.island { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 34px; min-width: 120px; max-width: 46%; padding: 0 16px; border-radius: 999px; background: #05070d; color: #fff; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .6); transition: min-width .6s var(--spring), height .5s var(--spring), padding .4s; overflow: hidden; white-space: nowrap; }
.is-dot { width: 8px; height: 8px; border-radius: 50%; background: #39d98a; flex: none; box-shadow: 0 0 10px #39d98a; }
.is-t { opacity: 0; transform: translateY(6px); transition: opacity .3s .15s, transform .4s .15s var(--spring); overflow: hidden; text-overflow: ellipsis; }
.island.open { min-width: 330px; height: 40px; }
.island.open .is-t { opacity: 1; transform: none; }
#view { min-width: 0; padding: 4px 4px 40px; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 6px 4px 18px; }
.ph h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
.ph p { margin: 6px 0 0; color: var(--muted); }
.ph-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.k-in { animation-name: vtIn; animation-duration: .8s; }
@keyframes vtIn { from { opacity: 0; transform: translateY(22px) scale(.97); filter: blur(6px); } }

/* ---------- Cards ---------- */
.card { padding: 20px; min-width: 0; transition: transform .45s var(--spring), box-shadow .3s; }
.card.glass:hover { transform: translateY(-3px); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.card-h.sub { margin-top: 18px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
.kpi { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "i l" "v v" "x x"; align-items: center; gap: 4px 12px; }
.kpi-i { grid-area: i; width: 42px; height: 42px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, color-mix(in srgb, var(--t) 70%, #fff), var(--t)); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), 0 8px 18px -8px var(--t); }
.kpi-l { grid-area: l; color: var(--muted); font-size: 13.5px; font-weight: 550; }
.kpi-v { grid-area: v; font-size: 29px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 8px; white-space: nowrap; }
.kpi-x { grid-area: x; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); min-height: 18px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .08em; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.home-top { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.grid-h { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.span2 { grid-column: span 2; }
.bigsum { display: flex; align-items: baseline; gap: 10px; margin: -4px 0 6px; }
.bigsum b { font-size: 26px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

/* ---------- The liquid orb (signature) ---------- */
.orb-card { display: flex; flex-direction: column; }
.orb { position: relative; width: 200px; height: 200px; margin: 0 auto; }
.orb svg { width: 100%; height: 100%; overflow: visible; }
.orb-glass { fill: rgba(255, 255, 255, .16); stroke: rgba(255, 255, 255, .7); stroke-width: 1.5; filter: drop-shadow(0 18px 30px rgba(60, 70, 180, .3)); }
[data-theme="dark"] .orb-glass { fill: rgba(255, 255, 255, .05); stroke: rgba(255, 255, 255, .25); }
.orb-rim { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 2; }
.orb-lvl { transform: translateY(calc(12px + (1 - var(--p)) * 178px)); transition: transform 1.6s var(--spring); }
.w { opacity: .92; }
.w2 { opacity: .5; }
.orb.waving .w1 { animation: wave 2.6s linear 4; }
.orb.waving .w2 { animation: wave 3.4s linear 3 reverse; }
@keyframes wave { to { transform: translateX(-100px); } }
.orb-hi { fill: rgba(255, 255, 255, .55); }
.orb-hi2 { fill: rgba(255, 255, 255, .35); }
.drop { opacity: 0; }
.orb.dropping .drop { animation: drop .7s cubic-bezier(.5, 0, .9, .6); }
@keyframes drop { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: .9; transform: translateY(150px) scale(.6, 1.3); } }
.orb-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.orb-c b { font-size: 38px; font-weight: 750; letter-spacing: -.04em; color: #fff; text-shadow: 0 2px 12px rgba(20, 20, 80, .45); }
.orb-c span { font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 6px rgba(20, 20, 80, .5); }
.orb-sub { text-align: center; color: var(--muted); margin: 10px 0 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* ---------- Lists ---------- */
.olist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.orow { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 16px; cursor: pointer; transition: background-color .2s, transform .2s; }
.orow:hover, .orow:focus-visible { background: var(--surface2); }
.orow > div:nth-child(2) { flex: 1; min-width: 0; }
.orow b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow small { color: var(--muted); font-size: 12px; }
.orow-r { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.orow.fresh { animation: fresh .9s var(--spring); }
@keyframes fresh { from { opacity: 0; transform: translateY(-18px) scale(.95); background: color-mix(in srgb, var(--c1) 22%, transparent); } }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--surface2); text-align: left; transition: transform .3s var(--spring); }
.todo button:hover { transform: translateX(4px); }
.todo span { flex: 1; }
.todo b { font-size: 18px; margin-right: 4px; }

/* ---------- Products ---------- */
.ptools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.ptools .k-search { background: var(--surface); border-color: var(--glass-line); border-radius: 999px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.plist { display: grid; gap: 10px; }
.pcard { display: flex; flex-direction: column; padding: 10px; border-radius: 24px; animation: vtIn .6s var(--ease) backwards; animation-delay: calc(var(--i) * 35ms); transition: transform .4s var(--spring); }
.pcard:hover { transform: translateY(-4px); }
.pcard.off { opacity: .62; }
.plist .pcard { flex-direction: row; align-items: center; gap: 14px; }
.pc-art { display: grid; place-items: center; height: 130px; border: 0; border-radius: 18px; background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .7), color-mix(in srgb, var(--t) 22%, transparent) 70%); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .8); }
[data-theme="dark"] .pc-art { background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .16), color-mix(in srgb, var(--t) 22%, transparent) 70%); }
.plist .pc-art { width: 76px; height: 76px; flex: none; }
.art { width: 64px; height: 64px; color: var(--t); filter: drop-shadow(0 6px 8px color-mix(in srgb, var(--t) 35%, transparent)); transition: transform .5s var(--spring); }
.art .gem { fill: color-mix(in srgb, var(--t) 50%, #fff); }
.art .gs { opacity: .55; }
.pc-art:hover .art { transform: scale(1.12) rotate(-6deg); }
.plist .art { width: 46px; height: 46px; }
.pc-b { padding: 10px 6px 4px; display: grid; gap: 4px; flex: 1; min-width: 0; }
.pc-b > b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-b > small { color: var(--muted); font-size: 12px; }
.pc-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.pc-price { font-weight: 700; font-size: 16px; }
.stock { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.stock.low { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.stock.out { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
.pc-f { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.qty { display: inline-flex; gap: 4px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--surface2); display: grid; place-items: center; transition: transform .15s; }
.qty button:active { transform: scale(.85); }
.qty .k-ic { width: 14px; height: 14px; }
.pc-sw { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); }
/* iOS-style switch */
.switch { position: relative; width: 50px; height: 30px; border-radius: 999px; border: 0; padding: 0; flex: none; background: rgba(120, 130, 160, .35); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .15); transition: background-color .3s; }
.switch i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .25), inset 0 -1px 2px rgba(0, 0, 0, .08); transition: transform .45s var(--spring), width .2s; }
.switch:active i { width: 30px; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.switch[aria-checked="true"]:active i { transform: translateX(14px); }

/* ---------- Orders drawer ---------- */
.od-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.tl { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 0; }
.tl li { position: relative; display: flex; gap: 12px; padding: 0 0 14px 2px; }
.tl li::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: -2px; width: 2px; background: var(--line-strong); }
.tl li:last-child::before { display: none; }
.tl li.done::before { background: var(--accent); }
.tl i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface-solid); flex: none; z-index: 1; }
.tl li.done i { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); animation: tlPop .5s var(--spring) backwards; }
.tl li.bad i { border-color: var(--err); background: var(--err); }
@keyframes tlPop { from { transform: scale(0); } }
.tl b { display: block; font-size: 14px; }
.tl small { color: var(--muted); font-size: 12px; }
.od-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.od-items li { display: flex; align-items: center; gap: 12px; }
.od-items li > div { flex: 1; min-width: 0; }
.od-items small, .od-cust small { display: block; color: var(--muted); font-size: 12px; }
.thumb { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--t) 18%, transparent); }
.thumb .art { width: 32px; height: 32px; }
.od-sum { margin: 14px 0; padding: 12px 14px; border-radius: 16px; background: var(--surface2); display: grid; gap: 4px; }
.od-sum div { display: flex; justify-content: space-between; font-size: 14px; }
.od-sum dt { color: var(--muted); } .od-sum dd { margin: 0; font-variant-numeric: tabular-nums; }
.od-sum .tot { font-size: 17px; font-weight: 700; padding-top: 4px; }
.od-sum .tot dt { color: var(--ink); }
.od-cust { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line-strong); }
.od-cust > div { flex: 1; }

/* ---------- Customers ---------- */
.cd-h { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.cd-h b { display: block; font-size: 18px; }
.cd-h small { display: block; color: var(--muted); margin-bottom: 6px; }
.k-av.big { width: 58px; height: 58px; font-size: 18px; }
.mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.mini3 div { padding: 10px 12px; border-radius: 16px; background: var(--surface2); }
.mini3 small { display: block; color: var(--muted); font-size: 12px; }
.dh { font-size: 14px; margin: 6px 0 8px; }

/* ---------- Discounts: glass tickets ---------- */
.tickets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.ticket { display: grid; grid-template-columns: 170px minmax(0, 1fr); padding: 0; overflow: hidden; -webkit-mask: radial-gradient(12px at 170px 0, transparent 98%, #000) top / 100% 51% no-repeat, radial-gradient(12px at 170px 100%, transparent 98%, #000) bottom / 100% 51% no-repeat; mask: radial-gradient(12px at 170px 0, transparent 98%, #000) top / 100% 51% no-repeat, radial-gradient(12px at 170px 100%, transparent 98%, #000) bottom / 100% 51% no-repeat; transition: transform .45s var(--spring), opacity .3s; }
.ticket:hover { transform: translateY(-3px) rotate(-.4deg); }
.ticket.off { opacity: .6; }
.tk-l { padding: 18px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(150deg, color-mix(in srgb, var(--t) 85%, #fff), var(--t)); color: #fff; border-right: 2px dashed rgba(255, 255, 255, .6); }
.tk-v { font-size: 20px; font-weight: 750; letter-spacing: -.02em; }
.tk-l code { font: 700 14px ui-monospace, Menlo, monospace; padding: 4px 8px; border-radius: 9px; background: rgba(255, 255, 255, .25); width: max-content; }
.tk-l small { opacity: .9; font-size: 12px; }
.tk-r { padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.tk-use span { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
.tk-a { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- Settings ---------- */
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.set-f { display: flex; justify-content: flex-end; margin-top: 16px; }
.zones, .toggles { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.zones li, .toggles li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); }
.zones span { display: flex; align-items: center; gap: 8px; flex: 1; }
.zones small { color: var(--muted); font-size: 12px; }
.inline-f { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.inline-f label { font-size: 13px; color: var(--muted); }
.inline-f .k-input { width: 120px; min-height: 36px; padding: 6px 10px; }
.glass-demo { padding: 22px; margin: 6px 0 12px; border-radius: 20px; text-align: center; }
.glass-demo b, .glass-demo small { display: block; }
.glass-demo small { color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent); }
.set-row b { display: block; } .set-row small { color: var(--muted); font-size: 13px; }

/* ---------- Responsive: a floating glass dock on phones ---------- */
@media (max-width: 1220px) {
  .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-h { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-h > .span2 { grid-column: 1 / -1; }
  .search-btn { min-width: 0; }
  .search-btn span, .search-btn kbd { display: none; }
}
@media (max-width: 1040px) {
  .home-top { grid-template-columns: minmax(0, 1fr); }
  .tickets { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); padding: 10px 10px 100px; }
  .side { position: fixed; top: auto; bottom: 12px; left: 10px; right: 10px; height: auto; z-index: 60; padding: 6px; border-radius: 30px; flex-direction: row; }
  .brand, .side-card { display: none; }
  .nav { flex-direction: row; justify-content: space-between; width: 100%; gap: 0; }
  .nav a { flex: 1; justify-content: center; padding: 12px 0; border-radius: 22px; }
  .nav a span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .nav .nav-n { position: absolute; top: 4px; right: 12%; min-width: 17px; height: 17px; font-size: 10px; }
  .nav .k-marker { height: 100%; width: 50px; border-radius: 22px; }
  .top { top: 10px; }
  .m-brand { display: flex; }
  .island { display: none; }
  .island.open { display: flex; position: fixed; top: 74px; transform: translateX(-50%); min-width: 0; width: calc(100vw - 40px); max-width: 380px; }
  .grid-h, .set-grid { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
}
@media (max-width: 560px) {
  .kpis, .kpis.k4 { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .ph h1 { font-size: 25px; }
  .kpi-v { font-size: 25px; }
  .card { padding: 16px; }
  .ticket { grid-template-columns: minmax(0, 1fr); -webkit-mask: none; mask: none; }
  .tk-l { border-right: 0; border-bottom: 2px dashed rgba(255, 255, 255, .6); }
  .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pc-art { height: 100px; }
  .mini3 { grid-template-columns: 1fr 1fr; }
  .me { display: none; }
}
@media (max-width: 380px) {
  .pgrid { grid-template-columns: minmax(0, 1fr); }
}

<script>
/* =========================================================
   Core kit: helpers, router, charts, modals, tables, till.
   Plain JS, no libraries. The app code below builds on it.
   ========================================================= */
"use strict";

/* ---------- 1. Tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a, f) => a.reduce((s, x) => s + (+(f ? f(x) : x) || 0), 0);
const uid = (p) => (p || "") + Math.random().toString(36).slice(2, 7).toUpperCase();
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
/* run fn(t) from 0 to 1 over ms, then stop (no endless loops) */
function tween(ms, fn, done) {
  if (reduced()) { fn(1); if (done) done(); return; }
  const t0 = performance.now();
  const f = (t) => { const p = Math.min(1, (t - t0) / ms); fn(easeOut(p)); if (p < 1) requestAnimationFrame(f); else if (done) done(); };
  requestAnimationFrame(f);
}

/* ---------- 2. Seeded random data ---------- */
let _seed = 1;
const seed = (s) => { _seed = s; };
function rand() { _seed |= 0; _seed = (_seed + 0x6d2b79f5) | 0; let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (a) => a[Math.floor(rand() * a.length)];
const chance = (p) => rand() < p;
const FIRST = ["Ayesha", "Bilal", "Hira", "Usman", "Sana", "Hamza", "Zara", "Fahad", "Mahnoor", "Ali", "Iqra", "Saad", "Noor", "Hassan", "Maryam", "Omer", "Fatima", "Danish", "Aliza", "Taimur", "Rabia", "Faraz", "Komal", "Junaid", "Areeba", "Kashif", "Mehwish", "Yasir", "Sadia", "Shahzad", "Anum", "Waqas", "Laiba", "Adeel", "Hania", "Zain"];
const LAST = ["Khan", "Malik", "Qureshi", "Siddiqui", "Sheikh", "Butt", "Chaudhry", "Raza", "Mirza", "Javed", "Akhtar", "Hussain", "Baig", "Rana", "Abbasi", "Zaidi", "Iqbal", "Anwar", "Naqvi", "Hashmi"];
const CITIES = ["Lahore", "Karachi", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Hyderabad", "Gujranwala", "Abbottabad"];
const person = () => pick(FIRST) + " " + pick(LAST);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + String(ri(1000000, 9999999));
const emailOf = (n) => n.toLowerCase().replace(/[^a-z]+/g, ".").replace(/^\.|\.$/g, "") + ri(1, 99) + "@mail.example";

/* ---------- 3. Numbers, money and dates ---------- */
const CUR = { sym: "Rs ", dec: 0 };
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n, d) => ((+n || 0) < 0 ? "-" : "") + CUR.sym + num(Math.abs(+n || 0), d == null ? CUR.dec : d);
function short(n) {
  n = +n || 0; const a = Math.abs(n), s = n < 0 ? "-" : "";
  const f = (v, u) => s + (v >= 100 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")) + u;
  if (a >= 1e9) return f(a / 1e9, "B"); if (a >= 1e6) return f(a / 1e6, "M"); if (a >= 1e3) return f(a / 1e3, "K");
  return s + (a % 1 ? a.toFixed(1) : a);
}
const moneyS = (n) => ((+n || 0) < 0 ? "-" : "") + CUR.sym + short(Math.abs(+n || 0));
const pct = (n, d = 1) => ((+n || 0) * 100).toFixed(d) + "%";
const FMT = { money: (n) => money(n), moneyS, short, int: (n) => num(n), pct: (n) => pct(n), pct0: (n) => pct(n, 0), dec1: (n) => num(n, 1) };
const roundCur = (n) => (CUR.dec ? Math.round(n * 100) / 100 : Math.round(n));
const DAY = 864e5;
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const p2 = (n) => String(n).padStart(2, "0");
const fmtDate = (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()]; };
const fmtDateY = (t) => fmtDate(t) + " " + new Date(t).getFullYear();
const fmtTime = (t) => { const d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const fmtDT = (t) => fmtDate(t) + ", " + fmtTime(t);
const isoDate = (t) => { const d = new Date(t); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
function ago(t) {
  const m = Math.round((Date.now() - t) / 6e4);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago"; return Math.round(h / 24) + " d ago";
}
/* A daily series (oldest to newest, last = today) with weekly rhythm, growth, season and noise */
function series(days, base, o = {}) {
  const out = [], t0 = today0(), wk = o.week || [0.8, 0.85, 0.9, 0.95, 1.05, 1.35, 1.3];
  for (let i = 0; i < days; i++) {
    const d = new Date(t0 - (days - 1 - i) * DAY);
    const v = base * wk[d.getDay()] * (1 + (o.growth == null ? 0.3 : o.growth) * (i / days)) * (1 + (o.season || 0.12) * Math.sin(((d.getMonth() + (o.phase || 0)) / 12) * Math.PI * 2)) * rnd(1 - (o.noise || 0.18), 1 + (o.noise || 0.18));
    out.push(Math.max(0, Math.round(v)));
  }
  return out;
}
/* Cut a daily series into a range: 7D / 14D / 30D / 90D daily, 12M monthly */
function byRange(arr, r) {
  const n = arr.length, t0 = today0();
  if (r !== "12M") {
    const k = Math.min(n, parseInt(r, 10) || 30), data = arr.slice(n - k);
    return { data, labels: data.map((_, i) => { const d = new Date(t0 - (k - 1 - i) * DAY); return k <= 7 ? WD[d.getDay()] : d.getDate() + " " + MON[d.getMonth()]; }) };
  }
  const m = new Map();
  arr.forEach((v, i) => { const d = new Date(t0 - (n - 1 - i) * DAY), key = d.getFullYear() * 12 + d.getMonth(); m.set(key, (m.get(key) || 0) + v); });
  const keys = Array.from(m.keys()).slice(-12);
  return { labels: keys.map((k) => MON[k % 12]), data: keys.map((k) => m.get(k)) };

  return `<div class="k-receipt"><div class="k-rch"><b>${esc(shop.name)}</b><span>${esc(shop.addr || "")}</span><span>${fmtDT(s.t)} · ${esc(s.id)}</span>${s.staff ? `<span>Served by ${esc(s.staff)}</span>` : ""}</div><div class="k-rcl">${s.lines.map((l) => row(`${l.qty} × ${esc(l.name)}`, money(l.price * l.qty))).join("")}</div><div class="k-rct">${row("Subtotal", money(s.sub))}${s.disc ? row("Discount" + (s.discLabel ? " · " + esc(s.discLabel) : ""), "-" + money(s.disc)) : ""}${s.mem ? row("Member saving", "-" + money(s.mem)) : ""}${s.tax ? row("Tax", money(s.tax)) : ""}${row("Total", money(s.total), "tot")}${row(esc(s.method) + (s.ref ? " · " + esc(s.ref) : ""), money(s.tendered))}${s.change ? row("Change", money(s.change)) : ""}${s.member ? row("Member", esc(s.member)) : ""}</div>${barcode(s.id)}<p class="k-rcf">${esc(shop.foot || "Thank you, see you again soon")}</p>${s.status === "Refunded" ? `<p class="k-rcref">REFUNDED</p>` : ""}</div>`;
}
function showReceipt(s, shop, extraFoot) {
  const L = openModal({ title: "Receipt " + esc(s.id), cls: "k-recm", body: receiptHTML(s, shop), foot: `${extraFoot || ""}<span class="sp"></span><button type="button" class="btn ghost" data-rmail>${ic("mail")} Email</button><button type="button" class="btn primary" data-rprint>${ic("print")} Print</button>` });
  $("[data-rprint]", L.box).addEventListener("click", printNow);
  $("[data-rmail]", L.box).addEventListener("click", () => toast("Receipt " + s.id + " sent to the customer's email"));
  return L;
}
function printNow() { document.body.classList.add("k-printing"); try { window.print(); } catch (e) { /* ignore */ } setTimeout(() => document.body.classList.remove("k-printing"), 600); }

/* ---------- 2. State ---------- */
let S;
const save = () => Store.save(S);
const zeros = () => new Array(D).fill(0);
const dayIdx = (t) => D - 1 - Math.round((today0() - new Date(t).setHours(0, 0, 0, 0)) / DAY);
const prod = (id) => S.products.find((p) => p.id === id);
const cust = (id) => S.customers.find((c) => c.id === id);
const ord = (id) => S.orders.find((o) => o.id === id);
const catIdx = (c) => Math.max(0, CATS.indexOf(c));
const stKind = (s) => ({ Unfulfilled: "warn", Packed: "info", Shipped: "info", Delivered: "ok", Cancelled: "err", Returned: "err" })[s] || "";
const payKind = (p) => (p === "Paid" ? "ok" : p === "COD" ? "warn" : "err");
const shipFor = (city, sub) => (sub >= S.freeOver ? 0 : (S.zones.find((z) => z.name === city) || S.zones.find((z) => z.name === "Rest of Pakistan") || { rate: 300 }).rate);
function addDaily(o, sign) {
  const i = dayIdx(o.t); if (i < 0) return;
  S.d.rev[i] += sign * o.total; S.d.ord[i] += sign;
}
function makeOrder(t, c, live) {
  const items = [], n = pick([1, 1, 1, 2, 2, 3]);
  for (let k = 0; k < n; k++) {
    const pool = live ? S.products.filter((p) => p.stock > 0 && p.active) : S.products;
    if (!pool.length) break;
    const p = pick(pool), ex = items.find((x) => x.id === p.id);
    if (ex) ex.qty++; else items.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
  }
  if (!items.length) return null;
  const sub = sum(items, (x) => x.price * x.qty), disc = chance(0.15) ? Math.round(sub * 0.1) : 0, ship = shipFor(c.city, sub);
  return { id: "", t, cust: c.id, name: c.name, city: c.city, items, sub, disc, code: disc ? "GLOW10" : "", ship, total: sub - disc + ship, pay: chance(0.55) ? "Paid" : "COD", status: "Unfulfilled", src: pick(SOURCES), track: "", log: { Placed: t } };
}
function seedData() {
  seed(9122);
  const t0 = today0(), now = Date.now();
  S = {
    store: { name: "Mehr & Moss", email: "hello@mehrmoss.example", phone: "0321-5550123", city: "Lahore" },
    target: 90000, freeOver: 7500, blur: 22, seq: 1200,
    zones: [{ name: "Lahore", rate: 200, eta: "1-2 days" }, { name: "Karachi", rate: 250, eta: "2-3 days" }, { name: "Islamabad", rate: 250, eta: "2-3 days" }, { name: "Rest of Pakistan", rate: 350, eta: "3-5 days" }],
    pays: { "Cash on delivery": true, "Debit or credit card": true, "Bank transfer": true, "Mobile wallet": false },
    notif: { "New order": true, "Low stock": true, "Daily summary email": false },
    products: CATALOG.map((c, i) => ({ id: "V" + p2(i + 1), name: c[0], cat: CATS[c[1]], price: c[2], cost: Math.round(c[2] * rnd(0.3, 0.45)), art: c[3], stock: chance(0.15) ? ri(0, 3) : ri(6, 40), active: !chance(0.08), sold: 0 })),
    customers: [], orders: [],
    codes: [
      { code: "GLOW10", type: "pct", v: 10, used: 64, limit: 200, ends: t0 + 12 * DAY, active: true },
      { code: "EID500", type: "amt", v: 500, used: 118, limit: 150, ends: t0 + 3 * DAY, active: true },
      { code: "FREESHIP", type: "ship", v: 0, used: 41, limit: 0, ends: t0 + 30 * DAY, active: true },
      { code: "WELCOME15", type: "pct", v: 15, used: 22, limit: 100, ends: t0 - 4 * DAY, active: false }
    ],
    d: { rev: zeros(), ord: zeros(), sess: zeros() }
  };
  const cities = ["Lahore", "Lahore", "Karachi", "Karachi", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Sialkot", "Quetta", "Hyderabad"];
  for (let i = 0; i < 46; i++) { const name = person(); S.customers.push({ id: "C" + (301 + i), name, email: emailOf(name), phone: phone(), city: pick(cities), joined: t0 - ri(5, 700) * DAY, tags: chance(0.15) ? ["VIP"] : [], note: "" }); }
  for (let k = 20; k >= 0; k--) {
    const n = ri(4, 9);
    for (let j = 0; j < n; j++) {
      let t = t0 - k * DAY + rnd(8, 23.5) * 36e5; if (k === 0) t = Math.max(t0 + 6e4, now - rand() * 9 * 36e5); if (t > now) continue;
      const o = makeOrder(Math.round(t), pick(S.customers)); if (o) S.orders.push(o);
    }
  }
  S.orders.sort((a, b) => a.t - b.t).forEach((o) => {
    o.id = "VT-" + ++S.seq;
    const age = (now - o.t) / DAY;
    o.status = age > 6 ? (chance(0.06) ? "Returned" : chance(0.04) ? "Cancelled" : "Delivered") : age > 3 ? pick(["Shipped", "Delivered", "Delivered"]) : age > 1 ? pick(["Packed", "Shipped", "Unfulfilled"]) : "Unfulfilled";
    if (o.pay === "Paid") o.log.Paid = o.t + 5 * 6e4;
    if (["Packed", "Shipped", "Delivered", "Returned"].includes(o.status)) o.log.Packed = o.t + 20 * 36e5;
    if (["Shipped", "Delivered", "Returned"].includes(o.status)) { o.log.Shipped = o.t + 30 * 36e5; o.track = "PK" + ri(10000000, 99999999); }
    if (["Delivered", "Returned"].includes(o.status)) { o.log.Delivered = o.t + 3 * DAY; if (o.pay === "COD") { o.pay = "Paid"; o.log.Paid = o.log.Delivered; } }
    if (o.status === "Returned") { o.pay = "Refunded"; o.log.Returned = o.t + 5 * DAY; }
    if (o.status === "Cancelled") { o.log.Cancelled = o.t + 6 * 36e5; if (o.pay === "Paid") o.pay = "Refunded"; }
    o.items.forEach((x) => { const p = prod(x.id); if (p) p.sold += x.qty; });
  });
  S.orders.reverse();
  S.orders.forEach((o) => { if (o.status !== "Cancelled" && o.status !== "Returned") addDaily(o, 1); });
  /* older days follow the same rhythm */
  const avgRev = sum(S.d.rev.slice(D - 21, D - 1)) / 20, avgOrd = sum(S.d.ord.slice(D - 21, D - 1)) / 20;
  const gen = series(D, avgRev / 1.35, { growth: 0.35, season: 0.18, week: [1.1, 0.9, 0.85, 0.9, 1, 1.1, 1.2] });
  for (let i = 0; i < D - 21; i++) { S.d.rev[i] = gen[i]; S.d.ord[i] = Math.max(1, Math.round((gen[i] / avgRev) * avgOrd)); }
  for (let i = 0; i < D; i++) S.d.sess[i] = Math.round(S.d.ord[i] * rnd(38, 52));
  S.d.sess[D - 1] = Math.round(S.d.ord[D - 1] * 44);
  return S;
}

  const o = makeOrder(Date.now(), pick(S.customers), true); if (!o) return;
  o.id = "VT-" + ++S.seq; S.orders.unshift(o); addDaily(o, 1); S.d.sess[D - 1] += ri(20, 60);
  o.items.forEach((x) => { const p = prod(x.id); if (p) { p.stock = Math.max(0, p.stock - x.qty); p.sold += x.qty; } });
  save(); Notes.add(`New order ${o.id} from ${o.name}, ${money(o.total)}`, "ok"); paintChrome();
  island(`New order ${o.id} · ${money(o.total)}`, "ok");
  const ul = $("#homeOrders");
  if (ul) { ul.insertAdjacentHTML("afterbegin", ordRow(o).replace('class="orow"', 'class="orow fresh"')); while (ul.children.length > 6) ul.lastElementChild.remove(); }
  const todays = S.orders.filter((x) => x.t >= today0() && x.status !== "Cancelled");
  countTo($("#kRev"), S.d.rev[D - 1]); countTo($("#kOrd"), todays.length); countTo($("#kConv"), S.d.sess[D - 1] ? todays.length / S.d.sess[D - 1] : 0);

}

const NEXT = { Unfulfilled: ["Packed", "Mark as packed", "box"], Packed: ["Shipped", "Mark as shipped", "truck"], Shipped: ["Delivered", "Mark as delivered", "check"] };
function setStatus(o, st, extra) {
  o.status = st; o.log[st] = Date.now();
  if (st === "Shipped") o.track = extra || "PK" + ri(10000000, 99999999);
  if (st === "Delivered" && o.pay === "COD") { o.pay = "Paid"; o.log.Paid = Date.now(); }
  if (st === "Cancelled" || st === "Returned") { addDaily(o, -1); o.items.forEach((x) => { const p = prod(x.id); if (p) p.stock += x.qty; }); if (o.pay === "Paid") o.pay = "Refunded"; }
  save(); paintChrome();
}

function newOrderForm() {

    fields: [

      { k: "p1", label: "Product", type: "select", options: active.map((p) => [p.id, `${p.name} · ${money(p.price)} · ${p.stock} left`]), full: true },
      { k: "q1", label: "Quantity", type: "number", min: 1, step: 1, req: true },
