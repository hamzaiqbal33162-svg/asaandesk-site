<head>
<meta charset="utf-8">

<title>Emberhall · Restaurant back office · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
/* ===== Core UI parts: buttons, forms, tables, layers, toasts, charts (each app themes them with variables) ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 10px; --r-inp: 9px; --r-modal: 18px;
  --scrim: rgba(12, 14, 22, .45); --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .45);
  --toast-bg: #17191f; --toast-ink: #fff; --tip-bg: #121419; --tip-ink: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.i { width: 18px; height: 18px; flex: none; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1; text-decoration: none; white-space: nowrap; transition: transform .14s, background-color .2s, border-color .2s, box-shadow .2s, filter .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn .i { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.bell { position: relative; }
.bell .badge-n { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge-n[hidden] { display: none; }
.bell.ring .i { animation: ring .8s ease; transform-origin: 50% 10%; }
@keyframes ring { 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

/* Segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg-k { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--accent); transition: left .35s cubic-bezier(.3, 1.3, .5, 1), width .35s; }

/* Chips, badges, avatars, progress */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .cnt { opacity: .7; font-weight: 500; }
.badge { --b: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { --b: var(--ok); } .badge.warn { --b: var(--warn); } .badge.bad { --b: var(--bad); } .badge.info { --b: var(--info); } .badge.acc { --b: var(--accent); }
.ava { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; letter-spacing: .02em; }
.meter { height: 7px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--mc, var(--accent)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; }
.delta .i { width: 14px; height: 14px; }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full, .form .full { grid-column: 1 / -1; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-inp); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.err .inp { border-color: var(--bad); }
.ferr { font-size: 12px; color: var(--bad); }
.ferr:empty { display: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; appearance: none; -webkit-appearance: none; border-radius: 99px; background: var(--line-2); transition: background-color .25s; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* Data table */
.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 180px; max-width: 300px; display: block; }
.search .inp { padding-left: 34px; min-height: 36px; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th > button, .tbl th > .th { display: flex; align-items: center; gap: 4px; width: 100%; padding: 9px 12px; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
.tbl th.r > button, .tbl th.r > .th { justify-content: flex-end; }
.tbl th .ar { width: 0; height: 0; border: 4px solid transparent; opacity: 0; transition: opacity .2s; }
.tbl th[aria-sort="ascending"] .ar { border-bottom-color: currentColor; margin-top: -4px; opacity: 1; }
.tbl th[aria-sort="descending"] .ar { border-top-color: currentColor; margin-top: 4px; opacity: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tbody tr { transition: background-color .15s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tbody tr.rowin { animation: rowin .4s both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } }
.tbl .r { text-align: right; }
.tbl .acts { display: flex; gap: 4px; justify-content: flex-end; }
.cellname { display: flex; align-items: center; gap: 10px; }
.cellname small { display: block; color: var(--muted); font-size: 11.5px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pager .pbtns { display: flex; gap: 6px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty .i { width: 34px; height: 34px; opacity: .55; }
.empty b { color: var(--ink); }

/* Layers: modal, drawer, menu, command search */
.layer { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.layer .scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-modal); box-shadow: var(--shadow-lg); animation: pop .34s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 10px 20px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.layer.drawer-l { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { position: relative; height: 100%; width: min(460px, 100%); background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slidein .4s cubic-bezier(.2, .8, .2, 1) both; }
.drawer .modal-b { flex: 1; }
.drawer .modal-f { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.layer.closing .scrim { animation: fade .22s reverse both; }
.layer.closing .modal { animation: pop .22s reverse both; }
.layer.closing .drawer { animation: slidein .26s reverse both; }
.modal.shake { animation: shake .4s; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes slidein { from { transform: translateX(100%); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 6px 0 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 110; min-width: 190px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s both; }
.menu.wide { width: 330px; }
.menu > button, .menu .mi { display: flex; width: 100%; text-align: left; gap: 9px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; color: inherit; }
.menu > button:hover, .menu > button:focus-visible { background: var(--hover); outline: none; }
.menu > button.dz { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.menu .mh { padding: 6px 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.notes li { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
.notes li.unread { background: var(--hover); }
.notes li i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--info); }
.notes li.ok i { background: var(--ok); } .notes li.warn i { background: var(--warn); } .notes li.bad i { background: var(--bad); }
.notes small { display: block; color: var(--muted); font-size: 11px; }
.layer.cmdk-l { align-items: flex-start; padding-top: 12vh; }
.modal.cmdk .modal-b { padding: 0 12px 12px; }
.cmdk ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.cmdk li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; text-align: left; font-size: 13.5px; }
.cmdk li button small { margin-left: auto; color: var(--muted); }
.cmdk li[aria-selected="true"] button, .cmdk li button:hover { background: var(--hover); }

/* Toasts and tooltip */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 11px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; animation: toastin .4s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast > i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.toast.warn > i { background: var(--warn); } .toast.bad > i { background: var(--bad); } .toast.info > i { background: var(--info); }
.toast button { margin-left: 6px; border: 0; background: rgba(255, 255, 255, .16); color: inherit; border-radius: 7px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
.toast.out { animation: toastout .26s both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }
.tip { position: fixed; z-index: 160; left: 0; top: 0; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 250px; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .tr span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* Charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.6, .1, .2, 1) forwards; }
.chart .ar.in { animation: fade 1s .35s both; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.chart .dot { stroke: var(--surface); stroke-width: 2; opacity: 0; transition: opacity .15s; }
.chart.hov .guide, .chart.hov .dot { opacity: 1; }
.chart .bar { transition: opacity .2s; }
.chart.hov .bar:not(.hl) { opacity: .45; }
.chart .seg-arc { fill: none; transition: stroke-width .2s, opacity .2s; cursor: pointer; }
.chart .seg-arc.dim { opacity: .35; }
.chart .empty-c { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-box { position: relative; flex: none; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-size: 20px; line-height: 1.1; }
.donut-c span { font-size: 11px; color: var(--muted); }
.dleg { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: grid; gap: 6px; font-size: 12.5px; }
.dleg li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: default; transition: background-color .15s; }
.dleg li:hover { background: var(--hover); }
.dleg li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dleg li em { font-style: normal; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.blist { display: grid; gap: 10px; }
.blist .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; cursor: default; }
.blist .bl > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blist .bl b { font-variant-numeric: tabular-nums; }
.blist .bt { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.blist .bt i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--bc, var(--c1)); }
.funnel { display: grid; gap: 8px; }
.funnel .fs { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; align-items: center; gap: 10px; font-size: 12.5px; cursor: default; }
.funnel .fb { height: 30px; display: flex; justify-content: center; }
.funnel .fb i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--fc, var(--c1)); }
.funnel .fs em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Drag and drop */
.dragging { opacity: .35; }
.ghost { position: fixed !important; z-index: 140; margin: 0 !important; pointer-events: none; transform: rotate(2.5deg) scale(1.03); box-shadow: var(--shadow-lg); }
.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
[data-handle] { touch-action: none; cursor: grab; }

/* Page entrance */
.rise { animation: rise .62s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ===== Emberhall look: frosted glass over warm saffron, ember and plum light ===== */
:root {
  --font: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --head: "Futura", "Century Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --bg: #fbefe3; --ink: #2a1820; --muted: #7a5c5e; --line: rgba(120, 66, 56, .16); --line-2: rgba(120, 66, 56, .3); --hover: rgba(232, 115, 31, .12);
  --surface: rgba(255, 252, 248, .82); --surface-2: rgba(255, 255, 255, .45);
  --glass: rgba(255, 255, 255, .42); --glass-b: rgba(255, 255, 255, .7); --glass-strong: rgba(255, 249, 243, .8); --tglass: rgba(255, 255, 255, .55);
  --gshadow: 0 18px 40px -26px rgba(110, 40, 20, .45), inset 0 1px 0 rgba(255, 255, 255, .75);
  --accent: #d9601c; --on-accent: #fff; --ok: #237a4f; --warn: #a96700; --bad: #c9302c; --info: #7046b8; --grid: rgba(120, 66, 56, .12);
  --c1: #e2691f; --c2: #8650cc; --c3: #23907f; --c4: #d39a12; --c5: #d23f66; --c6: #4e72d8;
  --b1: rgba(246, 168, 59, .62); --b2: rgba(232, 86, 58, .42); --b3: rgba(126, 74, 178, .34); --b4: rgba(255, 205, 130, .55);
  --floor: rgba(255, 255, 255, .28); --tile: rgba(120, 66, 56, .07);
  --r: 22px; --r-btn: 12px; --r-inp: 12px; --r-modal: 26px;
  --toast-bg: #2a1820; --tip-bg: #2a1820; --scrim: rgba(60, 20, 30, .28);
  color-scheme: light;
}
[data-theme="dark"] {

    const items = o.items.map((x) => Object.assign({}, x, { value: Math.max(0, fin(x.value)) })), total = sum(items, (x) => x.value);

    el.innerHTML = `<div class="donut-wrap"><div class="donut-box" style="width:${sz}px;height:${sz}px"><svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" role="img" tabindex="0" aria-label="${esc(o.label || "Donut chart")}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="${th}"/>${items.map((x, i) => `<path class="seg-arc" data-i="${i}" style="stroke:${Chart.color(x, i)}" stroke-width="${th}" stroke-linecap="${gap ? "round" : "butt"}"/>`).join("")}</svg><div class="donut-c"><b class="num">${o.center != null ? esc(o.center) : esc((o.centerFmt || f)(total))}</b><span>${esc(o.centerLabel || "Total")}</span></div></div>${o.legend === false ? "" : `<ul class="dleg">${items.map((x, i) => `<li data-i="${i}"><i class="sw" style="background:${Chart.color(x, i)}"></i><span>${esc(x.label)}</span><b>${esc(f(x.value))}</b><em>${total ? Math.round(fr[i] * 100) : 0}%</em></li>`).join("")}</ul>`}</div>`;
    const svgEl = el.querySelector("svg"), segs = $$(".seg-arc", svgEl);

/* Drag and drop with pointer events (mouse drags the card, touch uses the [data-handle] grip) */
function dragBoard({ root, item, zone, onDrop }) {
  let justDragged = false;
  root.addEventListener("click", (e) => { if (justDragged) { e.stopPropagation(); e.preventDefault(); justDragged = false; } }, true);
  root.addEventListener("pointerdown", (e) => {
    const it = e.target.closest(item);
    if (!it || !root.contains(it) || e.button !== 0) return;
    const onHandle = !!e.target.closest("[data-handle]");
    if (!onHandle && (e.pointerType === "touch" || e.target.closest("button,a,input,select,textarea,label"))) return;
    const sx = e.clientX, sy = e.clientY;
    let ghost = null, over = null, ox = 0, oy = 0;
    const move = (ev) => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        const r = it.getBoundingClientRect(); ox = sx - r.left; oy = sy - r.top;
        ghost = it.cloneNode(true); ghost.classList.add("ghost"); ghost.removeAttribute("id"); ghost.style.width = r.width + "px";
        document.body.appendChild(ghost); it.classList.add("dragging"); document.body.classList.add("is-dragging");
      }
      ghost.style.left = ev.clientX - ox + "px"; ghost.style.top = ev.clientY - oy + "px";
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      const z = hit && hit.closest(zone);
      const nz = z && root.contains(z) ? z : null;
      if (nz !== over) { if (over) over.classList.remove("over"); over = nz; if (over) over.classList.add("over"); }
      ev.preventDefault();
    };
    const up = (ev) => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      if (!ghost) return;
      ghost.remove(); it.classList.remove("dragging"); document.body.classList.remove("is-dragging");
      if (over) over.classList.remove("over");
      justDragged = true; setTimeout(() => (justDragged = false), 50);
      if (over && ev.type === "pointerup") onDrop(it, over, ev);
    };
    addEventListener("pointermove", move, { passive: false }); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  });
}

/* Data table: search, filter chips, column sort, pagination, row click and row actions */
const TS = {};
function dataTable(host, o) {

  const tb = host.querySelector("tbody"), inp = host.querySelector(".search input"), info = host.querySelector(".pinfo");
  let view = [];
  const text = (r) => (o.text ? o.text(r) : o.columns.map((c) => (c.k ? r[c.k] : "")).join(" ")).toString().toLowerCase();
  function compute() {
    let rows = o.rows();
    if (o.filters) { const f = o.filters.find((x) => x.id === st.f); if (f && f.test) rows = rows.filter(f.test); }
    const q = st.q.trim().toLowerCase();
    if (q) rows = rows.filter((r) => text(r).includes(q));
    if (st.sort != null && o.columns[st.sort]) {
      const c = o.columns[st.sort], g = c.get || ((r) => r[c.k]);
      rows = rows.slice().sort((a, b) => { const x = g(a), y = g(b); return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * st.dir; });
    }
    return rows;
  }
  function paint(anim) {
    view = compute();
    const pages = Math.max(1, Math.ceil(view.length / ps));
    st.page = clamp(st.page, 0, pages - 1);
    const slice = view.slice(st.page * ps, st.page * ps + ps);
    tb.innerHTML = slice.length ? slice.map((r, i) => `<tr class="${o.onRow ? "click" : ""} ${anim !== false && !RM ? "rowin" : ""} ${o.rowCls ? o.rowCls(r) : ""}" data-r="${i}" ${o.onRow ? 'tabindex="0"' : ""} style="animation-delay:${i * 28}ms">${o.columns.map((c) => `<td class="${c.num ? "r num" : ""} ${c.cls || ""}">${c.render ? c.render(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${o.columns.length}"><div class="empty">${ic(o.emptyIcon || "search")}<b>${esc(o.empty || "Nothing matches")}</b><span>${esc(o.emptyHint || "Try another search or filter.")}</span></div></td></tr>`;
    info.textContent = view.length ? `${st.page * ps + 1}–${Math.min(view.length, st.page * ps + ps)} of ${view.length}` : "0 results";
    host.querySelector('[data-tpage="-1"]').disabled = st.page === 0;
    host.querySelector('[data-tpage="1"]').disabled = st.page >= pages - 1;
    $$("thead th", host).forEach((th, i) => { if (th.hasAttribute("aria-sort")) th.setAttribute("aria-sort", st.sort === i ? (st.dir > 0 ? "ascending" : "descending") : "none"); });
    if (o.filters) { const all = o.rows(); $$("[data-tfilt]", host).forEach((b) => { const f = o.filters.find((x) => x.id === b.dataset.tfilt); b.setAttribute("aria-pressed", b.dataset.tfilt === st.f); b.querySelector(".cnt").textContent = " " + (f.test ? all.filter(f.test).length : all.length); }); }
  }
  const rowAt = (tr) => view[st.page * ps + +tr.dataset.r];
  inp.addEventListener("input", () => { st.q = inp.value; st.page = 0; paint(false); });
  host.addEventListener("click", (e) => {
    const a = e.target.closest("[data-act]");
    if (a && tb.contains(a)) { e.stopPropagation(); const tr = a.closest("tr[data-r]"); if (tr && o.actions && o.actions[a.dataset.act]) o.actions[a.dataset.act](rowAt(tr), a); return; }
    const s = e.target.closest("[data-tsort]");
    if (s) { const i = +s.dataset.tsort; if (st.sort === i) st.dir *= -1; else { st.sort = i; st.dir = o.columns[i].num ? -1 : 1; } paint(); return; }
    const p = e.target.closest("[data-tpage]");
    if (p) { st.page += +p.dataset.tpage; paint(); return; }
    const f = e.target.closest("[data-tfilt]");
    if (f) { st.f = f.dataset.tfilt; st.page = 0; paint(); return; }
    const tr = e.target.closest("tbody tr[data-r]");
    if (tr && o.onRow && !e.target.closest("button,a,input,select,label")) o.onRow(rowAt(tr));
  });
  tb.addEventListener("keydown", (e) => { const tr = e.target.closest("tr[data-r]"); if (tr && e.target === tr && (e.key === "Enter" || e.key === " ") && o.onRow) { e.preventDefault(); o.onRow(rowAt(tr)); } });
  paint();
  return { paint, view: () => view, state: st };
}

      { k: "shift", label: "Shift" },
      { k: "inAt", label: "Status", get: (s) => s.inAt || 0, render: (s) => (s.inAt ? badge("In since " + fmt.time(s.inAt), "ok") : badge("Off", "")) },
      { k: "tips", label: "Tips (week)", num: 1, render: (s) => money(s.tips) },
      { label: "", sort: false, render: (s) => `<span class="acts"><button class="btn sm ${s.inAt ? "" : "pri"}" data-act="clock">${s.inAt ? "Clock out" : "Clock in"}</button></span>` },
    ],
    actions: { clock: (s) => { if (s.inAt) { const h = Math.max(1, Math.round(age(s.inAt) / 3600e3)); s.inAt = 0; toast(`${s.name} clocked out after ${h} h`, "info"); } else { s.inAt = Date.now(); toast(`${s.name} clocked in`); } save(); R.refresh(); } },
  });
};
function staffModal() {
  formModal({
    title: "Add staff", submit: "Add", values: { role: "Server", shift: "17:00–24:00" },
    fields: [{ name: "name", label: "Full name", required: 1, full: 1, validate: (v) => (D().staff.some((s) => s.name.toLowerCase() === v.toLowerCase()) ? "Already on the team" : "") }, { name: "role", label: "Role", type: "select", options: ["Server", "Grill chef", "Tandoor chef", "Chai master", "Host", "Kitchen porter", "Manager"] }, { name: "shift", label: "Shift", type: "select", options: ["12:00–22:00", "13:00–23:00", "17:00–24:00"] }],
    onSubmit: (v) => { D().staff.push({ id: "s" + Date.now(), name: v.name, role: v.role, shift: v.shift, inAt: 0, week: [0, 0, 0, 0, 0, 0, 0], tips: 0 }); save(); R.refresh(); toast(`${v.name} joined as ${v.role.toLowerCase()}`); },
  });
}

let range = "30D";
Pages.reports = (m) => {
  m.innerHTML = toolbar("Pick a range; every chart below follows it.", `<div id="rrng"></div><button class="btn" data-rexp>${ic("download")}Export CSV</button>`) + `
  <div class="grid g4">${kpi("r-rev", "cash", "Revenue", "", 0)}${kpi("r-cov", "users", "Covers", "", 0)}${kpi("r-chk", "receipt", "Spend per cover", "", 0)}${kpi("r-tk", "bag", "Takeaway share", "", 0)}</div>
  <div class="grid g21">${card("", `<div class="card-h"><div><h3>Revenue by channel</h3><p>Dine-in versus takeaway and delivery</p></div></div><div id="r-line"></div>`)}${card("", `<div class="card-h"><div><h3>By category</h3><p>Share of food and drink sales</p></div></div><div id="r-cat"></div>`)}</div>
  <div class="grid g21">${card("", `<div class="card-h"><div><h3>Covers</h3><p>Guests per period</p></div></div><div id="r-cov2"></div>`)}${card("", `<div class="card-h"><div><h3>Top dishes</h3><p>Plates this week</p></div></div><div id="r-top"></div>`)}</div>`;
  const share = (o) => 0.7 + 0.05 * Math.sin(o * 0.8);
  const draw = () => {
    const a = rangeData(range, (o) => histAt(o) * share(o)), b = rangeData(range, (o) => histAt(o) * (1 - share(o))), c = rangeData(range, coversAt);
    const tot = sum(a.data) + sum(b.data), cov = sum(c.data);
    countUp($("#r-rev"), tot, moneyS); $("#r-rev-f").textContent = range === "12M" ? "Last 12 months" : `Last ${range === "7D" ? 7 : 30} days`;
    countUp($("#r-cov"), cov); $("#r-cov-f").textContent = `${fmt.n(cov / a.data.length)} per ${range === "12M" ? "month" : "day"}`;
    countUp($("#r-chk"), cov ? sum(a.data) / cov : 0, money);
    countUp($("#r-tk"), tot ? (sum(b.data) / tot) * 100 : 0, (v) => v.toFixed(1) + "%");
    lineChart($("#r-line"), { id: "r-line", labels: a.labels, stack: true, fmt: money, yFmt: moneyS, height: 240, series: [{ name: "Dine-in", data: a.data }, { name: "Takeaway and delivery", data: b.data, color: "var(--c2)" }] });
    barChart($("#r-cov2"), { id: "r-cov2", labels: c.labels, fmt: (v) => fmt.n(v) + " covers", series: [{ name: "Covers", data: c.data, color: "var(--c3)" }], height: 210 });
    const catW = { Grill: 0.31, Karahi: 0.24, "Rice & sides": 0.12, Tandoor: 0.08, Chai: 0.15, Desserts: 0.1 };
    donut($("#r-cat"), { id: "r-cat", fmt: moneyS, centerFmt: moneyS, centerLabel: range, items: CATS.map((k, i) => ({ label: k, value: tot * catW[k] * (1 + 0.06 * Math.sin(i * 2 + range.length)) })) });
  };
  seg($("#rrng"), ["7D", "30D", "12M"], range, (v) => { range = v; draw(); });
  draw();
  barList($("#r-top"), { fmt: (v) => v + " plates", items: D().menu.slice().sort((a, b) => b.pop - a.pop).slice(0, 7).map((x) => ({ label: x.name, value: x.pop })) });
  $("[data-rexp]", m).addEventListener("click", () => downloadCSV("emberhall-days.csv", [["Day", "Revenue", "Covers"], ...kpiSpark(90, (o) => [fmt.iso(TODAY + o * DAY), Math.round(histAt(o)), coversAt(o)])]));
};

/* Settings: a glass modal opened from the gear */
function settingsModal() {
  const s = D().settings;
  const m = Layer.open({
    title: "Settings", wide: true,
    body: `<form class="form" id="sf" novalidate>${fieldHTML({ name: "name", label: "Restaurant name", required: 1 }, s.name)}${fieldHTML({ name: "area", label: "Address", required: 1 }, s.area)}${fieldHTML({ name: "service", label: "Service charge (%)", type: "number", min: 0, max: 25, required: 1 }, s.service)}${fieldHTML({ name: "late", label: "Ticket turns late after (min)", type: "number", min: 5, max: 60, required: 1 }, s.late)}</form>
      <div class="set-row"><div><b>Takeaway orders arrive</b><p>Simulate counter and rider orders every minute or so</p></div><input type="checkbox" class="switch" id="s-tk" ${s.takeaways ? "checked" : ""} aria-label="Simulated takeaway orders"></div>
      <div class="set-row"><div><b>Theme</b><p>Daylight glass or late-night glass</p></div><button type="button" class="btn" data-theme-btn aria-label="Switch theme"></button></div>
      <div class="set-row"><div><b>Reset demo data</b><p>Bring back the sample floor, kitchen and pantry</p></div><button type="button" class="btn danger" id="s-reset">${ic("refresh")}Reset</button></div>`,
    foot: `<button type="button" class="btn" data-close>Close</button><button type="button" class="btn pri" data-submit>${ic("check")}Save settings</button>`,
  });
  Theme.paint();
  const f = $("#sf", m.el);
  const saveIt = () => {
    let ok = true;
    [["name", (v) => (v ? "" : "Required")], ["area", (v) => (v ? "" : "Required")], ["service", (v) => (v === "" || +v < 0 || +v > 25 ? "Between 0 and 25" : "")], ["late", (v) => (v === "" || +v < 5 || +v > 60 ? "Between 5 and 60" : "")]].forEach(([n, fn]) => { const v = f.elements[n].value.trim(), msg = fn(v), w = f.querySelector(`[data-fld="${n}"]`); w.classList.toggle("err", !!msg); w.querySelector(".ferr").textContent = msg; if (msg) ok = false; });
    if (!ok) { m.el.classList.remove("shake"); void m.el.offsetWidth; if (!RM) m.el.classList.add("shake"); return; }
    Object.assign(s, { name: f.elements.name.value.trim(), area: f.elements.area.value.trim(), service: +f.elements.service.value, late: +f.elements.late.value });
    D().orders.filter((o) => o.status === "Open").forEach(retotal);
    save(); $("#rname").textContent = s.name; m.close(); R.refresh(); toast("Settings saved");
  };
  m.el.querySelector("[data-submit]").addEventListener("click", saveIt);
  f.addEventListener("submit", (e) => { e.preventDefault(); saveIt(); });
  $("#s-tk", m.el).addEventListener("change", (e) => { s.takeaways = e.target.checked; save(); toast(`Simulated takeaways ${s.takeaways ? "on" : "off"}`, "info"); });
  $("#s-reset", m.el).addEventListener("click", async () => { if (await confirmDlg("Tables, tickets, bookings and the pantry go back to the sample service.", { title: "Reset demo data?", ok: "Reset" })) { S.reset(); Bell.items = []; seedBell(); Layer.closeAll(); $("#rname").textContent = D().settings.name; R.refresh(); paintNavCount(); toast("Demo data reset"); } });
}

/* Takeaway orders keep the kitchen moving (every 70 s, paused when hidden) */
every(70000, () => {
  if (!D().settings.takeaways) return;
  if (D().tickets.filter((k) => !/^T\d/.test(k.label) && k.status !== "Served").length >= 3) return;
  const avail = D().menu.filter((d) => canServe(d)); if (!avail.length) return;
  const lines = avail.sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 3)).map((d) => ({ did: d.id, qty: 1 + (Math.random() < 0.3 ? 1 : 0) }));
  const kind = Math.random() < 0.6 ? "Takeaway" : "Delivery";
  const o = { id: ++D().seq.order, kind, tid: null, server: "Counter", covers: 0, lines: [], sub: 0, svc: 0, total: 0, status: "Paid", at: Date.now(), paidAt: Date.now(), pay: kind === "Delivery" ? "Mobile wallet" : "Card", tip: 0 };
  D().orders.push(o); sendTicket(o, lines, kind === "Delivery" ? "Rider in 20 min" : "", null);
  Bell.add(`New ${kind.toLowerCase()} order #${o.id}: ${lines.map((l) => l.qty + " " + dname(l.did)).join(", ")}`, "info");
  if (R.cur === "kitchen" || R.cur === "overview" || R.cur === "orders") R.refresh();
});
function seedBell() {
  D().pantry.filter((x) => x.stock <= x.par).forEach((x) => Bell.add(`${x.name} is below par: ${qtyU(x, x.stock)} left`, "warn", true));
  D().pantry.filter((x) => x.expiry && days(x.expiry) <= 0).forEach((x) => Bell.add(`Use the ${x.name.toLowerCase()} today`, "bad", true));
  const late1 = D().tickets.filter(late); if (late1.length) Bell.add(`${late1.length} kitchen ticket${late1.length > 1 ? "s are" : " is"} running late`, "bad", true);
  Bell.add(`${D().bookings.filter((b) => isToday(b.at) && b.status === "Booked").length} more bookings tonight`, "info", true);
}

/* Shell-wide buttons */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-settings],[data-takeaway],[data-walkin],[data-addtable],[data-seatb],[data-addbook],[data-receive],[data-adddish2],[data-addstaff]");
  if (!b) return;
  if (b.hasAttribute("data-settings")) settingsModal();
  else if (b.hasAttribute("data-takeaway")) takeawayFlow(b);
  else if (b.hasAttribute("data-walkin")) { const t = D().tables.filter((x) => x.state === "free").sort((a, c) => a.seats - c.seats)[0]; if (!t) return toast("No free tables right now", "warn"); tableDrawer(t.id, b); }
  else if (b.hasAttribute("data-addtable")) tableModal(null);
  else if (b.hasAttribute("data-seatb")) seatBooking(D().bookings.find((x) => x.id === b.dataset.seatb));
  else if (b.hasAttribute("data-addbook")) bookingModal();
  else if (b.hasAttribute("data-receive")) receiveModal(b.dataset.receive);
  else if (b.hasAttribute("data-adddish2")) dishModal(null);
  else if (b.hasAttribute("data-addstaff")) staffModal();
});

seedBell();
R.start();
Cmdk.add([
  { label: "New takeaway order", icon: "bag", hint: "Kitchen", run: () => takeawayFlow(null) },
  { label: "Seat a walk-in", icon: "users", hint: "Floor", run: () => { const t = D().tables.find((x) => x.state === "free"); if (t) tableDrawer(t.id); else toast("No free tables right now", "warn"); } },
  { label: "New booking", icon: "cal", hint: "Bookings", run: () => bookingModal() },
  { label: "Receive a delivery", icon: "truck", hint: "Pantry", run: () => receiveModal() },
  { label: "Add a dish", icon: "plus", hint: "Menu", run: () => dishModal(null) },
  { label: "Open settings", icon: "settings", hint: "Settings", run: () => settingsModal() },
  { label: "Switch theme", icon: "moon", hint: "Display", run: () => Theme.toggle() },
]);
</script>
