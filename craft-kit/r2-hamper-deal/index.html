<!doctype html>
<!-- Chill & Craft · Hamper Deal · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamper Deal · bundle builder with a live discount</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: wicker, forest-green ribbon, cream card ---------- */
  :root {
    color-scheme: light;
    --bg1: #f1f6ee;
    --bg2: #cfe0c8;
    --ink: #1e2b1f;
    --muted: #627361;
    --panel: #fdfdf8;
    --well: #f2f5ec;
    --line: #dfe7d7;
    --wick: #d7a35c;
    --wick-d: #9c6a2e;
    --wick-dd: #6e4517;
    --green: #1d6b4a;
    --green-l: #2f9a6c;
    --gold: #e0b24f;
    --focus: #c2410c;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #18291f;
    --bg2: #070d0a;
    --ink: #eef5ea;
    --muted: #9db29c;
    --panel: #111a14;
    --well: #18231b;
    --line: #253328;
    --green: #2f9a6c;
    --green-l: #4cc08b;
    --focus: #fdba74;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(520px 360px at 50% 58%, rgba(224, 178, 79, .22), transparent 70%), radial-gradient(900px 640px at 50% 0%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; overflow: clip; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .card {
    width: min(396px, 100%);
    padding: 16px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(20, 60, 30, .45), 0 8px 20px -12px rgba(20, 60, 30, .25);
    animation: rise .7s var(--spring) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .head h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .cart { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; background: var(--well); font-size: 12px; font-weight: 750; white-space: nowrap; }
  .cart svg { width: 16px; height: 16px; }
  .cart b { font-variant-numeric: tabular-nums; }

  /* ---------- Shelf of treats ---------- */
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .tile {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 1px;
    padding: 6px 4px 7px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: transform .35s var(--spring), border-color .25s, background .25s, opacity .25s;
    animation: pop .55s var(--spring) both;
  }
  .tile:nth-child(2) { animation-delay: .06s; } .tile:nth-child(3) { animation-delay: .12s; } .tile:nth-child(4) { animation-delay: .18s; } .tile:nth-child(5) { animation-delay: .24s; } .tile:nth-child(6) { animation-delay: .3s; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } }
  .tile:hover { transform: translateY(-2px); }
  .tile .ic { width: 44px; height: 44px; transition: opacity .25s, transform .35s var(--spring); }
  .tile .ic svg { width: 100%; height: 100%; display: block; }
  .tile b { font-size: 11.5px; line-height: 1.2; }
  .tile small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile[aria-pressed="true"] { border-color: var(--green); background: color-mix(in srgb, var(--green) 9%, var(--panel)); }
  .tile[aria-pressed="true"] .ic { opacity: .25; transform: scale(.85); }
  .tile .tick { position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; transform: scale(0); transition: transform .35s var(--spring); }
  .tile .tick svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tile[aria-pressed="true"] .tick { transform: scale(1); }
  .tile[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .tile:focus-visible, .slot:focus-visible, .go:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* ---------- The hamper: back drawing, items, front drawing ---------- */
  .scene { position: relative; aspect-ratio: 320 / 176; margin: 10px -2px 0; }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .basket { transform-origin: 50% 100%; }
  .front { z-index: 3; pointer-events: none; }
  .slot {
    position: absolute;
    z-index: 2;
    top: 31%;
    width: 22%;
    aspect-ratio: 1;
    margin-left: -11%;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: none;
    cursor: pointer;
    visibility: hidden;
  }
  .slot.on { visibility: visible; }
  .slot svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(60, 30, 0, .35)); }
  .tag {
    position: absolute;
    z-index: 4;
    left: 71%;
    top: 58%;
    width: 64px;
    transform-origin: 50% 0;
    animation: swing 3.2s ease-in-out infinite alternate;
    perspective: 300px;
  }
  @keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
  /* the tag is tied to the front rim with a short string */
  .tag::before { content: ""; display: block; width: 1.5px; height: 9px; margin: 0 auto; background: var(--wick-dd); }
  .tag-in {
    position: relative;
    display: grid;
    place-items: center;
    height: 46px;
    border-radius: 8px 8px 12px 12px;
    background: linear-gradient(180deg, #fff7e3, #f3dfb2);
    color: #5b3a12;
    box-shadow: 0 8px 14px -8px rgba(60, 30, 0, .6);
    text-align: center;
    line-height: 1;
    transform-style: preserve-3d;
  }
  .tag-in::before { content: ""; position: absolute; top: 5px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--wick-dd); }
  .tag-in b { display: block; margin-top: 8px; font-size: 18px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tag-in small { display: block; margin-top: 2px; font-size: 8.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .tag.hot .tag-in { background: linear-gradient(180deg, var(--green-l), var(--green)); color: #fff; }
  .tag.hot .tag-in::before { background: #fff; }

  /* ---------- Tier track ---------- */
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .tier { position: relative; height: 30px; border-radius: 10px; background: var(--well); overflow: hidden; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .tier::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--green), var(--green-l)); transform: scaleX(var(--f, 0)); transform-origin: 0 50%; transition: transform .55s var(--spring); }
  .tier span { position: relative; transition: color .3s; }
  .tier.full span { color: #fff; }

  /* ---------- Summary ---------- */
  .sum { margin-top: 10px; display: grid; gap: 3px; font-size: 13px; }
  .sum div { display: flex; justify-content: space-between; gap: 10px; }
  .sum span { color: var(--muted); }
  .sum b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sum .was b { color: var(--muted); font-weight: 600; }
  .sum .was.struck b { text-decoration: line-through; }
  .sum .off b { color: var(--green); }
  .sum .pay { margin-top: 3px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 15px; }
  .sum .pay span { color: var(--ink); font-weight: 700; }
  .save { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 8px; background: color-mix(in srgb, var(--gold) 30%, transparent); color: var(--ink); font-size: 11px; font-weight: 800; }
  .go {
    width: 100%;
    height: 50px;
    margin-top: 10px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--green-l), var(--green));
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 12px 22px -12px rgba(20, 90, 50, .8);
    transition: transform .3s var(--spring), filter .2s;
  }
  .go:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .go[aria-disabled="true"] { cursor: progress; filter: saturate(.6); }
  .go.ok { background: linear-gradient(180deg, #e0b24f, #b98625); }
  .note { margin: 6px 0 0; min-height: 1.3em; text-align: center; font-size: 12px; color: var(--muted); }
  .fly { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; filter: drop-shadow(0 8px 8px rgba(40, 20, 0, .3)); }
  .fly svg { width: 100%; height: 100%; display: block; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="ttl">
    <header class="head">
      <div><h1 id="ttl">Build an Eid hamper</h1><p>Pick up to 4 treats. More treats, bigger discount.</p></div>
      <span class="cart" id="cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19.5 8H6.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="9" cy="19" r="1.6" fill="currentColor" /><circle cx="17" cy="19" r="1.6" fill="currentColor" /></svg>Cart <b id="cartN">0</b></span>
    </header>

    <div class="shelf" id="shelf" role="group" aria-label="Treats"></div>

    <div class="scene" id="scene">
      <!-- back of the hamper: handle, inner wall and straw -->
      <svg class="basket" id="back" viewBox="0 0 320 176" aria-hidden="true">
        <defs>
          <pattern id="weave" width="22" height="14" patternUnits="userSpaceOnUse">
            <rect width="22" height="14" fill="var(--wick-d)" />
            <rect x="1" y="1.5" width="9" height="4.5" rx="2.2" fill="var(--wick)" /><rect x="12" y="1.5" width="9" height="4.5" rx="2.2" fill="#c38e47" />
            <rect x="-4.5" y="8.5" width="9" height="4.5" rx="2.2" fill="#c38e47" /><rect x="6.5" y="8.5" width="9" height="4.5" rx="2.2" fill="var(--wick)" /><rect x="17.5" y="8.5" width="9" height="4.5" rx="2.2" fill="#c38e47" />
          </pattern>
          <linearGradient id="shadeF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".3" /><stop offset=".35" stop-color="#000" stop-opacity="0" /><stop offset=".7" stop-color="#fff" stop-opacity=".08" /><stop offset="1" stop-color="#000" stop-opacity=".32" /></linearGradient>
        </defs>
        <path d="M44 92C44 2 276 2 276 92" fill="none" stroke="var(--wick-dd)" stroke-width="13" stroke-linecap="round" />
        <path d="M44 92C44 2 276 2 276 92" fill="none" stroke="var(--wick)" stroke-width="8" stroke-linecap="round" stroke-dasharray="7 5" />
        <ellipse cx="160" cy="94" rx="134" ry="20" fill="var(--wick-dd)" />
        <ellipse cx="160" cy="97" rx="122" ry="14" fill="#4f300e" />
        <g stroke="#e9c46a" stroke-width="2" stroke-linecap="round" opacity=".9">
          <path d="M60 100l-8-12M82 104l2-14M112 106l-6-13M150 108l3-15M190 107l-4-14M226 105l6-13M258 101l7-12M100 102l10-9M214 103l-11-9" />
        </g>
      </svg>
      <!-- four slots; filled ones are buttons that hop the treat back to the shelf -->
      <button class="slot" type="button" style="left:26%" tabindex="-1"></button>
      <button class="slot" type="button" style="left:42%" tabindex="-1"></button>
      <button class="slot" type="button" style="left:58%" tabindex="-1"></button>
      <button class="slot" type="button" style="left:74%" tabindex="-1"></button>
      <!-- front of the hamper, the lid, the ribbon and the bow -->
      <svg class="basket front" id="front" viewBox="0 0 320 176" aria-hidden="true">
        <path d="M26 96Q30 170 64 172H256Q290 170 294 96Q160 132 26 96Z" fill="url(#weave)" />
        <path d="M26 96Q30 170 64 172H256Q290 170 294 96Q160 132 26 96Z" fill="url(#shadeF)" />
        <path d="M26 96Q160 132 294 96" fill="none" stroke="var(--wick-dd)" stroke-width="9" stroke-linecap="round" />
        <path d="M26 96Q160 132 294 96" fill="none" stroke="var(--wick)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
        <g id="lid" opacity="0">
          <path d="M22 96Q22 40 160 40T298 96Q160 130 22 96Z" fill="url(#weave)" />
          <path d="M22 96Q22 40 160 40T298 96Q160 130 22 96Z" fill="url(#shadeF)" />
          <path d="M22 96Q160 130 298 96" fill="none" stroke="var(--wick-dd)" stroke-width="8" stroke-linecap="round" />
        </g>
        <rect id="ribbon" x="150" y="40" width="20" height="132" fill="var(--green)" style="transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0)" />
        <g id="bow" style="transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0)">
          <path d="M160 50C140 30 122 40 130 56S152 58 160 50Z" fill="var(--green-l)" />
          <path d="M160 50C180 30 198 40 190 56S168 58 160 50Z" fill="var(--green-l)" />
          <path d="M160 50l-14 26 7-2 3 6zM160 50l14 26-7-2-3 6z" fill="var(--green)" />
          <circle cx="160" cy="50" r="7" fill="var(--green)" />
        </g>
      </svg>
      <div class="tag" id="tag" aria-hidden="true"><div class="tag-in" id="tagIn"><span><b id="tagPct">Save</b><small id="tagSub">up to 15%</small></span></div></div>
    </div>

    <div class="tiers" aria-hidden="true">
      <div class="tier" id="t0"><span>2 treats · 5%</span></div>
      <div class="tier" id="t1"><span>3 treats · 10%</span></div>
      <div class="tier" id="t2"><span>4 treats · 15%</span></div>
    </div>

    <div class="sum" aria-live="off">
      <div class="was" id="wasRow"><span id="wasL">Treats · 0</span><b id="was">PKR 0</b></div>
      <div class="off"><span>Hamper discount <i class="save" id="pctChip">0%</i></span><b id="off">− PKR 0</b></div>
      <div class="pay"><span>Hamper price</span><b id="pay">PKR 0</b></div>
    </div>
    <button class="go" id="go" type="button"><span id="goTxt">Pick your first treat</span></button>
    <p class="note" id="note" aria-live="polite">Tap a treat to drop it into the hamper.</p>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Hamper Deal: treats arc into a wicker hamper; the hanging tag flips to the live discount ----------
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 80) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const E = { out: (t) => 1 - Math.pow(1 - t, 3), in: (t) => t * t * t, inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), back: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) };
  function tween(ms, fn, ease) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.max(0, Math.min(1, (now - s) / ms)); fn((ease || E.out)(t)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }
  let busy = false, queued = null;
  function run(fn) {
    return new Promise((res) => {
      const go = async () => { busy = true; try { await fn(); } finally { busy = false; res(); if (queued) { const q = queued; queued = null; q(); } } };
      if (busy) queued = go; else go();
    });
  }
  const note = (t) => { $("note").textContent = t; };

  // ---------- The treats (prices in PKR) and their drawings ----------
  const ITEMS = [
    { k: "chai", name: "Kashmiri chai", p: 950, svg: '<rect x="12" y="12" width="24" height="30" rx="3" fill="#1f6f6a"/><rect x="11" y="8.5" width="26" height="6" rx="2" fill="#d9a441"/><rect x="12" y="21" width="24" height="10" fill="#f4e3c1"/><path d="M24 22.5c-3.4 2.2-3.4 5.4 0 7 3.4-1.6 3.4-4.8 0-7z" fill="#2f8f7a"/><rect x="12" y="38" width="24" height="2.2" fill="#d9a441"/><rect x="14" y="14" width="3" height="26" fill="#fff" opacity=".18"/>' },
    { k: "honey", name: "Sidr honey", p: 1800, svg: '<rect x="15" y="8.5" width="18" height="6" rx="2" fill="#8a5a2b"/><path d="M13 16h22l-1 22a5 5 0 0 1-5 5H19a5 5 0 0 1-5-5z" fill="#f0a72a"/><path d="M13 16h22v5c-3 0-3 3.5-6 3.5S26 21 23 21s-3 4.5-6 4.5-4-2.5-4-4.5z" fill="#f9cf6a"/><path d="M19.5 29l4.5-2.6 4.5 2.6v5.2L24 36.8l-4.5-2.6z" fill="none" stroke="#fff3c9" stroke-width="1.6"/><rect x="16" y="18" width="3" height="20" rx="1.5" fill="#fff" opacity=".25"/>' },
    { k: "dates", name: "Ajwa dates", p: 1250, svg: '<rect x="6" y="19" width="36" height="21" rx="4" fill="#7b3f1d"/><rect x="6" y="19" width="36" height="6" rx="3" fill="#a0592b"/><ellipse cx="15" cy="18" rx="5.4" ry="3.6" fill="#4a210d"/><ellipse cx="24" cy="16.5" rx="5.4" ry="3.6" fill="#62300f"/><ellipse cx="33" cy="18" rx="5.4" ry="3.6" fill="#4a210d"/><rect x="17" y="28" width="14" height="7" rx="2" fill="#f3d9a6"/><path d="M20 31.5h8" stroke="#7b3f1d" stroke-width="1.4"/>' },
    { k: "almond", name: "Almonds", p: 1400, svg: '<path d="M12 13h24l2.5 26.5a3 3 0 0 1-3 3.5H12.5a3 3 0 0 1-3-3.5z" fill="#c99a63"/><path d="M12 13h24v4.5H12z" fill="#9f7039"/><rect x="15" y="21" width="18" height="17" rx="4" fill="#f7e7cb" opacity=".55"/><ellipse cx="20.5" cy="29.5" rx="3.4" ry="5.4" fill="#8b5a2b" transform="rotate(-22 20.5 29.5)"/><ellipse cx="27.5" cy="30.5" rx="3.4" ry="5.4" fill="#a76b36" transform="rotate(18 27.5 30.5)"/>' },
    { k: "saffron", name: "Saffron", p: 2200, svg: '<rect x="18.5" y="7" width="11" height="6.5" rx="1.8" fill="#b8892f"/><path d="M17.5 13.5h13V37a6.5 6.5 0 0 1-13 0z" fill="#dbe9f2"/><path d="M18.5 25h11v12a5.5 5.5 0 0 1-11 0z" fill="#c0392b"/><path d="M21 27.5l2 7M25 26.5l-1 8M27.5 28.5l-2 5" stroke="#f39c12" stroke-width="1.3" stroke-linecap="round"/><rect x="19" y="15" width="2.4" height="20" rx="1.2" fill="#fff" opacity=".6"/>' },
    { k: "biscuit", name: "Butter biscuits", p: 850, svg: '<ellipse cx="24" cy="35" rx="17" ry="7" fill="#1f3c6e"/><rect x="7" y="22" width="34" height="13" fill="#2f5597"/><ellipse cx="24" cy="22" rx="17" ry="7" fill="#4a73c0"/><ellipse cx="24" cy="22" rx="11.5" ry="4.4" fill="#f2d28b"/><circle cx="20" cy="22" r="1" fill="#b07a2b"/><circle cx="24" cy="20.6" r="1" fill="#b07a2b"/><circle cx="28" cy="22.4" r="1" fill="#b07a2b"/><path d="M7 28h34" stroke="#e0b24f" stroke-width="1.6"/>' },
  ];
  const ART = (i) => `<svg viewBox="0 0 48 48" aria-hidden="true">${ITEMS[i].svg}</svg>`;
  const pct = (n) => (n >= 4 ? 15 : n >= 3 ? 10 : n >= 2 ? 5 : 0);
  const slots = [null, null, null, null];
  const slotEls = [...document.querySelectorAll(".slot")];
  let closing = false, hampers = 0, shownPct = 0;

  // ---------- Build the shelf ----------
  const tiles = ITEMS.map((it, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", `${it.name}, ${fmt(it.p)}`);
    b.innerHTML = `<span class="ic">${ART(i)}</span><b>${it.name}</b><small>${fmt(it.p)}</small><span class="tick" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3L9.5 3.8"/></svg></span>`;
    b.addEventListener("click", () => run(() => toggle(i)));
    $("shelf").appendChild(b);
    return b;
  });
  slotEls.forEach((s, k) => s.addEventListener("click", () => { if (slots[k] !== null) run(() => toggle(slots[k])); }));

  // ---------- Summary, tiers and the tag ----------
  const shown = { was: 0, off: 0, pay: 0 };
  function rollTo(id, to, sign) {
    const a = shown[id];
    shown[id] = to;
    return tween(480, (t) => { $(id).textContent = (sign || "") + fmt(a + (to - a) * t); });
  }
  async function refresh() {
    const picks = slots.filter((x) => x !== null), n = picks.length;
    const sum = picks.reduce((a, i) => a + ITEMS[i].p, 0), p = pct(n), off = Math.round(sum * p / 100);
    $("wasL").textContent = `Treats · ${n}`;
    $("wasRow").classList.toggle("struck", off > 0);
    rollTo("was", sum);
    rollTo("off", off, "− ");
    rollTo("pay", sum - off);
    $("pctChip").textContent = p + "%";
    [2, 3, 4].forEach((need, k) => {
      const prev = k === 0 ? 1 : need - 1, f = Math.max(0, Math.min(1, (n - prev) / (need - prev)));
      $("t" + k).style.setProperty("--f", f);
      $("t" + k).classList.toggle("full", f >= 1);
    });
    tiles.forEach((b, i) => b.setAttribute("aria-disabled", String(closing || (n >= 4 && !slots.includes(i)))));
    slotEls.forEach((s, k) => { const i = slots[k]; s.classList.toggle("on", i !== null); s.tabIndex = i === null ? -1 : 0; s.setAttribute("aria-label", i === null ? "Empty slot" : `Take ${ITEMS[i].name} out`); });
    if (!closing && !$("go").classList.contains("ok")) $("goTxt").textContent = n === 0 ? "Pick your first treat" : n === 1 ? `Add 1 more to save 5% · ${fmt(sum)}` : `Add hamper to cart · ${fmt(sum - off)}`;
    if (p !== shownPct) await flipTag(p, p > shownPct);
    return { n, sum, off, p };
  }
  // The tag turns edge-on, swaps its number and swings back with a spring
  async function flipTag(p, up) {
    shownPct = p;
    const t = $("tagIn");
    await play(t, [{ transform: "rotateY(0)" }, { transform: "rotateY(90deg)" }], { duration: 180, easing: "ease-in" });
    $("tagPct").textContent = p ? p + "%" : "Save";
    $("tagSub").textContent = p ? "off" : "up to 15%";
    $("tag").classList.toggle("hot", p > 0);
    await play(t, [{ transform: "rotateY(-90deg)" }, { transform: "rotateY(14deg)" }, { transform: "rotateY(0)" }], { duration: 420, easing: "ease-out" });
    if (up) {
      play($("tag"), [{ transform: "rotate(0)" }, { transform: "rotate(-18deg)" }, { transform: "rotate(10deg)" }, { transform: "rotate(0)" }], { duration: 800, easing: "ease-out" });
      const r = $("tag").getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * .7, ["#e0b24f", "#2f9a6c", "#fff7e3"], 14);
    }
  }

  // ---------- Flights between the shelf and the hamper ----------
  async function fly(i, fromEl, toEl, up) {
    if (calm()) return;
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "fly";
    f.innerHTML = ART(i);
    const size = b.width;
    f.style.width = f.style.height = size + "px";
    document.body.appendChild(f);
    const x0 = a.left + a.width / 2 - size / 2, y0 = a.top + a.height / 2 - size / 2, x1 = b.left + b.width / 2 - size / 2, y1 = b.top + b.height / 2 - size / 2;
    const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - (up ? 50 : 70);
    const s0 = a.width / size, spin = (x1 > x0 ? 1 : -1) * 24;
    await tween(620, (t) => {
      const u = 1 - t, x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
      f.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(Math.sin(t * Math.PI) * spin).toFixed(1)}deg) scale(${(s0 + (1 - s0) * t).toFixed(3)})`;
    }, E.inOut);
    f.remove();
  }
  function wiggle() {
    ["back", "front"].forEach((id) => play($(id), [{ transform: "none" }, { transform: "scale(1.03,.95)" }, { transform: "scale(.99,1.02) rotate(-1deg)" }, { transform: "rotate(.6deg)" }, { transform: "none" }], { duration: 560, easing: "ease-out" }));
  }
  function straw(el) {
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * .75, ["#e9c46a", "#d7a35c", "#f4e3c1"], 12);
  }

  async function toggle(i) {
    if (closing) return;
    const s = slots.indexOf(i), tile = tiles[i];
    if (s >= 0) {
      // out: the treat hops up out of the straw and flies home
      const el = slotEls[s];
      await play(el, [{ transform: "none" }, { transform: "translateY(-22px) rotate(-8deg)" }], { duration: 200, easing: "ease-out" });
      el.classList.remove("on");
      slots[s] = null;
      tile.setAttribute("aria-pressed", "false");
      await fly(i, el, tile.querySelector(".ic"), true);
      play(tile, [{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
      const r = await refresh();
      note(`${ITEMS[i].name} is back on the shelf. ${r.n} in the hamper, ${fmt(r.sum - r.off)}.`);
      return;
    }
    const free = slots.indexOf(null);
    if (free < 0) {
      play($("shelf"), [{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 320 });
      note("The hamper holds 4 treats. Tap one in the hamper to swap it out.");
      return;
    }
    // in: squash the tile, arc the treat over, land it in the straw
    slots[free] = i;
    tile.setAttribute("aria-pressed", "true");
    play(tile, [{ transform: "scale(1)" }, { transform: "scale(.92,.88)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
    await fly(i, tile.querySelector(".ic"), slotEls[free], false);
    const el = slotEls[free];
    el.innerHTML = ART(i);
    el.classList.add("on");
    play(el, [{ transform: "translateY(-10px) scale(1)" }, { transform: "translateY(4px) scale(1.12,.82)" }, { transform: "translateY(-3px) scale(.96,1.06)" }, { transform: "none" }], { duration: 480, easing: "ease-out" });
    wiggle();
    straw(el);
    const r = await refresh();
    note(`${ITEMS[i].name} added. ${r.n} of 4${r.p ? `, ${r.p}% off: you save ${fmt(r.off)}` : ""}.`);
  }

  // ---------- Close the hamper: lid drops, ribbon wraps, bow pops, then it all resets ----------
  async function addHamper() {
    const btn = $("go");
    if (closing) return;
    const picks = slots.filter((x) => x !== null);
    if (!picks.length) {
      play(btn, [{ transform: "translateX(0)" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 340 });
      play(tiles[0], [{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 400 });
      note("Pick at least one treat first.");
      return;
    }
    const r0 = await refresh();
    closing = true;
    btn.setAttribute("aria-disabled", "true");
    $("goTxt").textContent = "Packing your hamper…";
    tiles.forEach((b) => b.setAttribute("aria-disabled", "true"));
    // anticipation: the treats hop together
    slotEls.forEach((el, k) => { if (slots[k] !== null) play(el, [{ transform: "none" }, { transform: "translateY(-12px)" }, { transform: "none" }], { duration: 360, delay: k * 60, easing: "ease-out" }); });
    await wait(380);
    const lid = $("lid");
    lid.setAttribute("opacity", "1");
    await tween(420, (t) => lid.setAttribute("transform", `translate(0 ${(-110 * (1 - t)).toFixed(1)})`), E.in);
    wiggle();
    straw($("scene"));
    await tween(320, (t) => { $("ribbon").style.transform = `scaleY(${t})`; });
    await tween(520, (t) => { $("bow").style.transform = `rotate(${(-40 * (1 - t)).toFixed(1)}deg) scale(${t})`; }, E.back);
    const sr = $("scene").getBoundingClientRect();
    confetti(sr.left + sr.width / 2, sr.top + sr.height * .3);
    hampers++;
    $("cartN").textContent = hampers;
    play($("cart"), [{ transform: "scale(1)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }], { duration: 460, easing: "cubic-bezier(.34,1.56,.64,1)" });
    btn.classList.add("ok");
    btn.removeAttribute("aria-disabled");
    $("goTxt").textContent = "Hamper added to cart";
    note(`Hamper of ${r0.n} added for ${fmt(r0.sum - r0.off)}${r0.off ? `, you saved ${fmt(r0.off)}` : ""}. Build another one!`);
    await wait(1700);
    // reset: bow and ribbon off, lid up, treats fly home one by one
    await tween(260, (t) => { $("bow").style.transform = `scale(${1 - t})`; $("ribbon").style.transform = `scaleY(${1 - t})`; }, E.in);
    await tween(380, (t) => { lid.setAttribute("transform", `translate(0 ${(-110 * t).toFixed(1)})`); lid.setAttribute("opacity", String(1 - t)); }, E.out);
    lid.setAttribute("opacity", "0");
    for (let k = 0; k < 4; k++) {
      const i = slots[k];
      if (i === null) continue;
      const el = slotEls[k];
      el.classList.remove("on");
      slots[k] = null;
      tiles[i].setAttribute("aria-pressed", "false");
      fly(i, el, tiles[i].querySelector(".ic"), true);
      await wait(130);
    }
    await wait(500);
    btn.classList.remove("ok");
    closing = false;
    await refresh();
  }
  $("go").addEventListener("click", () => run(addHamper));

  // ---------- Particles: straw bits, sparkles and confetti ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  function sizeFx() { const r = devicePixelRatio || 1; fx.width = innerWidth * r; fx.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  sizeFx();
  addEventListener("resize", sizeFx);
  function burst(x, y, colors, n, power) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.2, s = (1.5 + Math.random() * 3) * (power || 1);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.5 + Math.random() * 2.5, c: colors[i % colors.length], life: 1, sq: i % 2 === 0, rot: Math.random() * 6, vr: (Math.random() - .5) * .35, fade: .018 + Math.random() * .012 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
  }
  const confetti = (x, y) => burst(x, y, ["#2f9a6c", "#e0b24f", "#c0392b", "#4a73c0", "#fff7e3"], 70, 2.2);
  function drawFx() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .14; p.vx *= .985; p.life -= p.fade; p.rot += p.vr;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.sq) ctx.fillRect(-p.r * 1.4, -p.r * .45, p.r * 2.8, p.r * .9); else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Idle life: an unpicked treat on the shelf bobs now and then ----------
  setInterval(() => {
    if (busy || closing || calm() || document.hidden) return;
    const free = tiles.filter((b) => b.getAttribute("aria-pressed") === "false");
    const b = free[Math.floor(Math.random() * free.length)];
    if (b) play(b.querySelector(".ic"), [{ transform: "none" }, { transform: "translateY(-5px) rotate(-6deg)" }, { transform: "translateY(0) rotate(3deg)" }, { transform: "none" }], { duration: 800, easing: "ease-in-out" });
  }, 1700);

  // ---------- Auto-demo: fills the hamper, swaps a treat and packs it, until someone touches the page ----------
  const demo = { on: true, t: 0 };
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.t); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  const SCRIPT = [[0, 520], [1, 520], [2, 900], [1, 700], [4, 520], [5, 900], ["go", 0]];
  async function demoLoop() {
    for (const [what, pause] of SCRIPT) {
      if (!demo.on) return;
      await run(what === "go" ? addHamper : () => toggle(what));
      if (!demo.on) return;
      await wait(pause);
    }
    if (demo.on) demo.t = setTimeout(demoLoop, 1200);
  }
  refresh();
  demo.t = setTimeout(demoLoop, 900);
</script>
</body>
</html>
