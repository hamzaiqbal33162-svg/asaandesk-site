<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gable · Mortgage CRM for loan officers</title>
<meta name="description" content="A twelve-page mortgage CRM: leads, a loan pipeline board, loan files with documents, a calculator, live rates, tasks, calendar, messages and reports.">
<script>
  /* Theme before first paint: ?theme= wins, then the saved choice, then the system */
  (function () { try { var q = new URLSearchParams(location.search).get("theme"), s = null; try { s = JSON.parse(localStorage.getItem("gable:theme")); } catch (e) {} document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {} })();
</script>
<style>
/* ---------- Theme tokens: navy and brass, dense and precise ---------- */
:root{
  --ease:cubic-bezier(.2,.75,.25,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#f3f4f7;--surface:#fff;--surface2:#f6f7fa;--text:#111a27;--muted:#5c6779;--line:#e2e6ed;--line-strong:#c4cbd6;
  --accent:#1e3a64;--accent-ink:#fff;--brass:#bf973a;--ok:#1f8a5b;--warn:#c98a14;--bad:#c2413a;--info:#2c62b0;
  --c1:#2c62b0;--c2:#bf973a;--c3:#24998b;--c4:#c8553d;--c5:#6f7d94;--c6:#7d5fae;
  --side:#0e1a2c;--side-ink:#c9d2e0;--side-hi:#fff;
  --r-btn:7px;--r-dlg:12px;--r-in:7px;--r-av:7px;--pad:16px;--fs:13.5px;
  --toast-bg:#0e1a2c;--tip-bg:#0e1a2c;--grid:#edf0f4;--hover:#f1f4f9;--track:#e8ecf2;
}
[data-theme=dark]{
  --bg:#0a1120;--surface:#111b2d;--surface2:#16223a;--text:#e5eaf3;--muted:#8f9bb0;--line:#22304a;--line-strong:#34466a;
  --accent:#d1ab52;--accent-ink:#121722;--brass:#d6b25b;--ok:#3fc086;--warn:#e7b04a;--bad:#ef6a62;--info:#6f9ee8;
  --c1:#6f9ee8;--c2:#d6b25b;--c3:#3fc0b0;--c4:#ec7b62;--c5:#93a2bc;--c6:#a98be0;
  --side:#070d18;--side-ink:#9aa7bd;--side-hi:#fff;
  --toast-bg:#e5eaf3;--toast-ink:#0a1120;--tip-bg:#e5eaf3;--tip-ink:#0a1120;--grid:#1a2740;--hover:#17233b;--track:#1e2b45;
}
/* ---------- Base: reset and shared components, styled by the theme tokens above ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link,var(--accent))}
h1,h2,h3{line-height:1.2}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.sp{flex:1}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{min-width:0}
.view.quiet .rise{animation:none}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:var(--r-btn,10px);font-weight:600;font-size:.93em;line-height:1.2;white-space:nowrap;transition:transform .15s var(--ease),background .2s,box-shadow .2s,border-color .2s;text-decoration:none}
.btn:hover{border-color:var(--line-strong,var(--muted))}
.btn:active{transform:scale(.95) translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -6px var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:.84em}
.btn .ic{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-btn,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s var(--ease),background .2s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn .cnt{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
[data-theme-toggle] .i-sun{display:none}
[data-theme=dark] [data-theme-toggle] .i-sun{display:block}
[data-theme=dark] [data-theme-toggle] .i-moon{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;font-size:.84em;font-weight:500;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip small{opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-btn,10px);padding:3px;gap:2px;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:calc(var(--r-btn,10px) - 3px);font-size:.84em;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78em;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);color:var(--tc,var(--accent));white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{--tc:var(--ok)}.tag.warn{--tc:var(--warn)}.tag.bad{--tc:var(--bad)}.tag.info{--tc:var(--info,var(--accent))}.tag.muted{--tc:var(--muted)}
.av{width:32px;height:32px;border-radius:var(--r-av,50%);display:inline-grid;place-items:center;font-weight:700;font-size:.74em;color:#fff;background:hsl(var(--h) var(--av-s,52%) var(--av-l,46%));flex:none;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:1.1em}
.av.open{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.pbar{display:inline-block;width:100%;height:6px;border-radius:6px;background:var(--track,color-mix(in srgb,var(--muted) 18%,transparent));overflow:hidden;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .6s var(--ease)}
.pbar.bad i{background:var(--bad)}.pbar.ok i{background:var(--ok)}.pbar.warn i{background:var(--warn)}
.note-bad{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:.88em}
.empty{display:grid;justify-items:center;gap:4px;padding:26px 10px;color:var(--muted);text-align:center}
.empty .ic{width:30px;height:30px;opacity:.6}
.empty b{color:var(--text)}
/* tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-btn,10px);padding:0 11px;background:var(--surface2);min-width:0;flex:1 1 170px;max-width:300px;color:var(--muted)}
.search input{border:0;background:transparent;padding:8px 0;outline:0;min-width:0;width:100%;color:var(--text)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.search.big{max-width:none;padding:2px 14px;font-size:1.05em}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad,18px) * -1);padding:0 var(--pad,18px)}
.tbl{width:100%;border-collapse:collapse;font-size:.92em;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{transition:background .15s}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover,.tbl tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--accent) 7%,transparent))}
.tbl .who-c{display:flex;align-items:center;gap:10px}
.tbl .who-c small{display:block;color:var(--muted);font-size:.86em}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit}
.th-sort .arr::after{content:"↕";opacity:.35}
.th-sort.on .arr::after{content:"↑";opacity:1}
.th-sort.on.desc .arr::after{content:"↓"}
.num .th-sort{flex-direction:row-reverse}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:.85em;color:var(--muted);flex-wrap:wrap}
.pbtns{display:flex;gap:4px;flex-wrap:wrap}
.pg{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;display:inline-grid;place-items:center;font-size:.92em}
.pg[aria-current]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pg:disabled{opacity:.4;cursor:default}
.pg.gap{border:0;background:none}
.pg .ic{width:15px;height:15px}
/* modals and drawers */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--scrim,rgba(10,12,20,.48));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .26s}
.ov.open{opacity:1}
.dlg{background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--r-dlg,16px);width:min(540px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);transform:translateY(18px) scale(.97);transition:transform .32s var(--ease);outline:0}
.ov.open .dlg{transform:none}
.ov.side{place-items:stretch end;padding:0}
.ov.side .dlg{width:min(460px,100%);max-height:none;height:100%;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(104%)}
.ov.side.open .dlg{transform:none}
.dlg.wide{width:min(780px,100%)}
.dlg.sm{width:min(420px,100%)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:1.06em}
.dlg-h .icon-btn{width:34px;height:34px}
.dlg-b{padding:16px 18px;overflow:auto;flex:1}
.dlg-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm-msg{margin:0;color:var(--muted)}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
body.modal-open{overflow:hidden}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{grid-column:span 2;display:grid;gap:5px;min-width:0}
.fld.half{grid-column:span 1}
.fld label{font-size:.82em;font-weight:600;color:var(--muted)}
.fld label i{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-in,9px);padding:9px 11px;width:100%;min-width:0;color:var(--text)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fld [aria-invalid=true]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface2))}
.fld.chk label{display:flex;gap:8px;align-items:center;color:var(--text);font-weight:500;font-size:.92em}
.fld.chk input{width:auto}
.err{color:var(--bad);font-size:.78em;min-height:0}
.err:empty{display:none}
.help{color:var(--muted);font-size:.78em}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
@media (max-width:520px){.fld.half{grid-column:span 2}}
/* toasts */
#toasts{position:fixed;z-index:120;bottom:16px;right:16px;display:grid;gap:8px;max-width:calc(100vw - 32px);justify-items:end}
.toast{display:flex;align-items:center;gap:10px;background:var(--toast-bg,#15171c);color:var(--toast-ink,#fff);padding:10px 10px 10px 14px;border-radius:var(--r-toast,12px);box-shadow:0 14px 34px -8px rgba(0,0,0,.4);animation:tin .38s var(--ease) both;font-size:.9em;max-width:420px}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .tdot{background:var(--warn)}.toast.bad .tdot{background:var(--bad)}
.tbtn{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.9em}
/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:130;pointer-events:none;background:var(--tip-bg,#14161b);color:var(--tip-ink,#fff);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:9px;opacity:0;transition:opacity .12s;box-shadow:0 10px 24px rgba(0,0,0,.28);max-width:240px}
.tip.on{opacity:1}
.tip div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip div b{margin-left:auto;padding-left:10px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart>svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart svg:focus-visible{outline-offset:4px}
.gy line{stroke:var(--grid,var(--line));stroke-dasharray:3 5}
.gy text,.gx{fill:var(--muted);font-size:11px}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 5;stroke-width:1.6}
.anim .ln:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:drawon 1.4s var(--ease) forwards}
.anim .ar{animation:fadein 1.2s .35s both}
.guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;pointer-events:none}
.dots circle{stroke:var(--surface-solid,var(--surface));stroke-width:2;pointer-events:none}
.col{transform-box:view-box}
.anim .col{animation:grow .85s var(--ease) both;animation-delay:var(--d,0ms)}
.col.dim{opacity:.45}
.refl{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
.refl-t{fill:var(--bad);font-size:11px;font-weight:600}
.col{transition:opacity .2s}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes drawon{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8em;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap>svg{flex:none;height:auto}
.trk{stroke:var(--track,color-mix(in srgb,var(--muted) 16%,transparent))}
.dseg{transition:opacity .2s}
.dseg.dim{opacity:.3}
.anim .sweep{animation:sweep 1.3s var(--ease) both}
@keyframes sweep{from{stroke-dashoffset:var(--C)}}
.dc-v{font-size:22px;font-weight:700;fill:var(--text)}
.dc-s{font-size:11px;fill:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:.88em}
.dl li{display:flex;align-items:center;gap:8px}
.dl li i{width:10px;height:10px;border-radius:3px;flex:none}
.dl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl li em{color:var(--muted);font-style:normal;width:38px;text-align:right}
.gauge .gv{transition:stroke-dasharray .8s var(--ease)}
.anim.gauge .gv{animation:gauge 1.3s var(--ease) both}
@keyframes gauge{from{stroke-dasharray:0 100}}
.anim.hm .hc{animation:fadein .5s both;animation-delay:var(--d)}
.spark{display:block;overflow:visible}
.spark .ln{stroke-width:2}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:.88em}
.hb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l small{display:block;color:var(--muted);font-size:.86em}
.hb-t{height:10px;border-radius:6px;background:var(--track,color-mix(in srgb,var(--muted) 15%,transparent));overflow:hidden}
.hb-t i{display:block;height:100%;width:0;border-radius:inherit;transition:width .9s var(--ease);transition-delay:var(--d)}
.hbars.go .hb-t i{width:var(--w)}
.hb b{font-variant-numeric:tabular-nums}
/* popovers, notifications and command search */
.pop{position:fixed;z-index:90;background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -12px rgba(0,0,0,.35);width:min(340px,calc(100vw - 16px));animation:popin .22s var(--ease);overflow:hidden}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notes{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.notes button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:9px;font-size:.88em;color:var(--text)}
.notes button:hover{background:var(--hover,color-mix(in srgb,var(--accent) 8%,transparent))}
.notes small{display:block;color:var(--muted);font-size:.85em}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.notes .unread .nd{background:var(--accent)}
.notes .unread button{font-weight:600}
.cmdk .dlg-b{padding:12px}
.cmd-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmd-list button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;color:var(--text)}
.cmd-list [aria-selected=true] button{background:var(--accent);color:var(--accent-ink)}
.cmd-list small{opacity:.7}
.cmd-hint{margin:10px 2px 0;font-size:.78em;color:var(--muted)}
/* mobile nav scrim */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s;border:0;padding:0;width:100%}
body.nav-open .scrim{opacity:1;pointer-events:auto}
/* reduced motion: keep every function, drop the big movement */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}}
/* ---------- Gable layout ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.app{display:grid;grid-template-columns:var(--sw,228px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .35s var(--ease)}
body.mini{--sw:68px}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 10px;z-index:60;overflow:hidden auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px;color:var(--side-hi);text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:1.25em;letter-spacing:.02em}
.brand small{display:block;font-size:.7em;color:var(--brass);letter-spacing:.14em;text-transform:uppercase}
.nav{position:relative;display:grid;gap:1px}
.nav h3{font-size:.66em;letter-spacing:.16em;text-transform:uppercase;color:rgba(201,210,224,.5);margin:12px 10px 4px;white-space:nowrap}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:7px;color:var(--side-ink);text-decoration:none;font-weight:500;white-space:nowrap;transition:color .2s}
.nav a:hover{color:var(--side-hi)}
.nav a[aria-current=page]{color:var(--side-hi)}
.nav a .cnt{margin-left:auto;font-size:.75em;background:rgba(255,255,255,.1);border-radius:9px;padding:0 7px;font-weight:700}
.nav-marker{position:absolute;left:0;top:0;width:100%;height:36px;border-radius:7px;background:linear-gradient(90deg,rgba(191,151,58,.28),rgba(191,151,58,.06));box-shadow:inset 3px 0 0 var(--brass);transition:transform .45s var(--ease),height .3s;opacity:0}
body.mini .nav h3,body.mini .nav a span,body.mini .nav a .cnt,body.mini .brand div,body.mini .side-foot div{display:none}
body.mini .nav a{justify-content:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot small{display:block;color:rgba(201,210,224,.6)}
.side-foot b{color:var(--side-hi)}
.wrap{min-width:0}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.ticker{display:flex;gap:16px;overflow:hidden;font-family:var(--mono);font-size:.82em;white-space:nowrap;min-width:0;flex:1;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker span{display:inline-flex;gap:6px;align-items:center}
.ticker b{color:var(--text)}
.ticker .up{color:var(--ok)}.ticker .dn{color:var(--bad)}
.flash-up{animation:fup .9s}.flash-dn{animation:fdn .9s}
@keyframes fup{from{background:color-mix(in srgb,var(--ok) 30%,transparent)}}
@keyframes fdn{from{background:color-mix(in srgb,var(--bad) 30%,transparent)}}
.menu-btn{display:none}
main{padding:18px 22px 60px;overflow-x:clip;outline:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:1.6em;margin:0;letter-spacing:-.015em;outline:0}
.ph p{margin:3px 0 0;color:var(--muted)}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.crumbs{font-size:.82em;color:var(--muted);margin-bottom:4px}
.crumbs a{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;position:relative;transition:transform .25s var(--ease),box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(14,26,44,.4)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:.78em;text-transform:uppercase;letter-spacing:.1em;margin:0;color:var(--muted);font-weight:700}
.kpi .v{display:block;font-size:1.75em;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.kpi .lbl{font-size:.74em;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.kpi .lbl .ic{color:var(--brass)}
.kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* funnel */
.funnel{display:grid;gap:6px}
.fn-row{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:.86em}
.fn-bar{height:24px;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--brass)));width:0;transition:width 1s var(--ease);transition-delay:var(--d);margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-weight:700;font-size:.85em;overflow:hidden}
.funnel.go .fn-bar{width:var(--w)}
.fn-row em{font-style:normal;color:var(--muted);text-align:right;font-family:var(--mono)}
/* the house that builds with the loan */
.house{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.house svg{width:210px;max-width:100%;flex:none;overflow:visible}
.hp{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hp.fill{fill:color-mix(in srgb,var(--brass) 18%,transparent)}
.hpart{opacity:.12;transition:opacity .4s}
.hpart.on{opacity:1}
.hpart.on .hp[pathLength]{stroke-dasharray:1;stroke-dashoffset:0}
.hpart.build{opacity:1}
.hpart.build .hp[pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:drawon 1s var(--ease) forwards;animation-delay:var(--d)}
.hpart.build .fillin{animation:fadein .8s both;animation-delay:calc(var(--d) + .6s)}
.smoke{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;opacity:0}
.hpart.on .smoke{animation:smoke 2.6s ease-out 3;animation-delay:var(--d2,1.4s)}
@keyframes smoke{0%{opacity:0;transform:translateY(6px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
.keys{transform-box:fill-box;transform-origin:50% 0}
.hpart.on .keys{animation:swing 1.4s var(--ease) 2;animation-delay:1.5s}
@keyframes swing{25%{transform:rotate(14deg)}75%{transform:rotate(-10deg)}}
.stages{display:flex;gap:4px;list-style:none;margin:10px 0 0;padding:0;flex-wrap:wrap}
.stages li{flex:1;min-width:70px;font-size:.72em;text-align:center;color:var(--muted);padding-top:8px;border-top:3px solid var(--track);transition:border-color .4s,color .4s}
.stages li.done{border-color:var(--brass);color:var(--text)}
.stages li.now{border-color:var(--accent);color:var(--text);font-weight:700}
/* pipeline board */
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:420px;transition:background .2s,box-shadow .2s}
.col.over{background:color-mix(in srgb,var(--brass) 14%,var(--surface2));box-shadow:inset 0 0 0 2px var(--brass)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:.84em}
.col-h b{text-transform:uppercase;letter-spacing:.06em}
.col-h span{color:var(--muted);font-family:var(--mono)}
.lc{display:grid;gap:5px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--lc,var(--accent));border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:.86em;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s var(--ease),box-shadow .2s}
.lc:hover{transform:translateY(-2px);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.lc .r{display:flex;justify-content:space-between;gap:6px;align-items:center}
.lc small{color:var(--muted)}
.lc.lifting{opacity:.3}
.lc.ghost{position:fixed;left:0;top:0;z-index:150;pointer-events:none;box-shadow:0 20px 40px -10px rgba(0,0,0,.45);transition:none;margin:0}
.lc.landed{animation:landg .6s var(--ease)}
@keyframes landg{0%{transform:scale(1.06);box-shadow:0 0 0 4px color-mix(in srgb,var(--brass) 50%,transparent)}}
.lock{font-size:.75em;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface2);font-family:var(--mono)}
.lock.soon{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
body.dragging,body.dragging *{cursor:grabbing!important}
/* loan detail */
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.terms div{background:var(--surface2);border-radius:8px;padding:9px 10px}
.terms dt{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.terms dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checklist label{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer}
.checklist label:hover{background:var(--hover)}
.checklist input{width:16px;height:16px;accent-color:var(--accent)}
.checklist .done span{text-decoration:line-through;color:var(--muted)}
.tline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px;font-size:.88em}
.tline li{position:relative}
.tline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brass);border:2px solid var(--surface)}
.tline small{display:block;color:var(--muted)}
.note-in{display:flex;gap:8px;margin-top:10px}
.note-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface2)}
.docs{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.docs li{display:flex;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:.88em}
.docs li>div{flex:1;min-width:0}
.docs small{display:block;color:var(--muted)}
.upbar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:10px}
.upbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px}
.rng{display:grid;gap:4px;margin-bottom:12px}
.rng label{display:flex;justify-content:space-between;font-size:.84em;font-weight:600;color:var(--muted)}
.rng label b{color:var(--text);font-family:var(--mono)}
.rng input[type=range]{width:100%;accent-color:var(--accent)}
.payment{font-size:2.6em;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pmix{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0}
.pmix i{display:block;height:100%;transition:width .5s var(--ease)}
.pleg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.86em}
.pleg span{display:flex;align-items:center;gap:6px}
.pleg i{width:9px;height:9px;border-radius:3px}
.pleg b{margin-left:auto;font-family:var(--mono)}
/* rates */
.rate-tbl td.mono{font-weight:700}
.chg{font-family:var(--mono);font-size:.9em}
/* tasks */
.tgroup h3{font-size:.78em;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.task{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface);transition:opacity .3s,transform .3s var(--ease)}
.task input{width:17px;height:17px;accent-color:var(--ok)}
.task>div{flex:1;min-width:0}
.task small{display:block;color:var(--muted)}
.task.done{opacity:.55}
.task.done b{text-decoration:line-through}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.cal button.d{min-height:84px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;padding:5px;display:flex;flex-direction:column;gap:2px;font-size:.78em;color:var(--text);min-width:0;transition:border-color .2s}
.cal button.d:hover{border-color:var(--brass)}
.cal .d.out{opacity:.45}
.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .ev{border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--text);border-left:2px solid var(--ec)}
/* messages */
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);height:min(640px,calc(100vh - 170px));min-height:440px;padding:0;overflow:hidden}
.convs{border-right:1px solid var(--line);overflow:auto}
.convs button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;color:var(--text)}
.convs button[aria-pressed=true]{background:var(--hover);box-shadow:inset 3px 0 0 var(--brass)}
.convs button>div{flex:1;min-width:0}
.convs small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convs .un{width:8px;height:8px;border-radius:50%;background:var(--brass);margin-top:6px}
.thread{display:flex;flex-direction:column;min-width:0}
.th-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.th-h small{display:block;color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:8px 12px;border-radius:12px;background:var(--surface2);font-size:.92em;animation:msgin .35s var(--ease)}
.msg small{display:block;color:var(--muted);font-size:.78em;margin-top:2px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.me small{color:inherit;opacity:.7}
.msg.them{border-bottom-left-radius:4px}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}}
.typing{display:inline-flex;gap:4px;padding:10px 12px;background:var(--surface2);border-radius:12px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface2)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9em}
.list li:last-child{border-bottom:0}
.list li>div{flex:1;min-width:0}
.list small{display:block;color:var(--muted)}
/* responsive */
@media (max-width:1200px){.s2{grid-column:span 4}.s3{grid-column:span 6}.s4,.s5,.s7,.s8,.s9{grid-column:span 12}.calc{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-104%);transition:transform .3s var(--ease)}
  body.nav-open .side{transform:none}
  body.mini .nav h3,body.mini .nav a span,body.mini .brand div{display:revert}
  .menu-btn{display:inline-grid}
  [data-mini]{display:none}
  main{padding:14px 14px 60px}.top{padding:8px 14px}
  .chat{grid-template-columns:1fr}.convs{max-height:180px;border-right:0;border-bottom:1px solid var(--line)}
  .terms{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){.s2,.s3,.s6{grid-column:span 12}.ph h1{font-size:1.35em}.cal button.d{min-height:56px}.cal .ev{font-size:.85em}.fn-row{grid-template-columns:80px 1fr 50px}.msg{max-width:88%}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main menu">
    <a class="brand" href="#/dashboard"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#bf973a"/><path d="M7 17L17 8l10 9M10 15v11h14V15" fill="none" stroke="#0e1a2c" stroke-width="2.6" stroke-linejoin="round"/><path d="M15 26v-6h4v6" fill="#0e1a2c"/></svg><div><b>Gable</b><small>Loan desk</small></div></a>
    <nav class="nav" aria-label="Pages">
      <span class="nav-marker" aria-hidden="true"></span>
      <h3>Work</h3>
      <a href="#/dashboard" data-route="dashboard"><i data-ic="grid"></i><span>Dashboard</span></a>
      <a href="#/leads" data-route="leads"><i data-ic="user"></i><span>Leads</span><em class="cnt" id="nLeads"></em></a>
      <a href="#/pipeline" data-route="pipeline"><i data-ic="layers"></i><span>Pipeline</span></a>
      <a href="#/loans" data-route="loans"><i data-ic="briefcase"></i><span>Loan files</span></a>
      <a href="#/documents" data-route="documents"><i data-ic="file"></i><span>Documents</span><em class="cnt" id="nDocs"></em></a>
      <h3>Tools</h3>
      <a href="#/calculator" data-route="calculator"><i data-ic="sliders"></i><span>Calculator</span></a>
      <a href="#/rates" data-route="rates"><i data-ic="wave"></i><span>Rates</span></a>
      <h3>Day</h3>
      <a href="#/tasks" data-route="tasks"><i data-ic="check"></i><span>Tasks</span><em class="cnt" id="nTasks"></em></a>
      <a href="#/calendar" data-route="calendar"><i data-ic="cal"></i><span>Calendar</span></a>
      <a href="#/messages" data-route="messages"><i data-ic="chat"></i><span>Messages</span><em class="cnt" id="nMsgs"></em></a>
      <h3>Insight</h3>
      <a href="#/reports" data-route="reports"><i data-ic="chart"></i><span>Reports</span></a>
      <a href="#/settings" data-route="settings"><i data-ic="cog"></i><span>Settings</span></a>
    </nav>
    <div class="side-foot"><span class="av" style="--h:210">EC</span><div><b>Ethan Cole</b><small>Senior loan officer</small></div></div>
  </aside>
  <button type="button" class="scrim" aria-label="Close menu" tabindex="-1"></button>
  <div class="wrap">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" data-menu aria-label="Open menu" aria-expanded="false"><i data-ic="menu"></i></button>
      <button type="button" class="icon-btn" data-mini aria-label="Collapse sidebar" aria-pressed="false"><i data-ic="chevl"></i></button>
      <div class="ticker" id="ticker" aria-label="Live rate index" role="status" aria-live="off"></div>
      <button type="button" class="icon-btn" data-cmd aria-label="Search (Ctrl+K)"><i data-ic="search"></i></button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"><i data-ic="moon" data-cls="i-moon"></i><i data-ic="sun" data-cls="i-sun"></i></button>
      <button type="button" class="icon-btn" data-bell aria-label="Notifications" aria-expanded="false"><i data-ic="bell"></i><span class="cnt" data-bell-count hidden>0</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script>
/* ================================================================
   Core helpers: DOM, seeded demo data, formatting, storage, theme,
   hash router, toasts, modals, forms, tables, charts, count-ups,
   notifications and command search. Everything is plain JS.
   ================================================================ */
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const mq = (q) => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const calm = () => mq("(prefers-reduced-motion: reduce)").matches; // reduced motion check used by JS
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a, f = (x) => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 9);
const by = (k, dir = 1) => (a, b) => (a[k] > b[k] ? dir : a[k] < b[k] ? -dir : 0);
const clone = (o) => JSON.parse(JSON.stringify(o));

/* ---------- Seeded random numbers, so demo data is the same each load ---------- */
function mulberry(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry(7);
const reseed = (n) => (rand = mulberry(n));
const rnd = (a, b) => a + rand() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));

  parse() {

  },
  start() { addEventListener("hashchange", () => this.render()); this.render(); this.started = true; },
  render(quiet = false) {
    const { page, arg } = this.parse();

    if (page !== this.cur || arg !== this.arg) quiet = false;
    this.cur = page; this.arg = arg;
    const keep = {};
    $$("[data-keep-scroll]", main).forEach((el) => (keep[el.dataset.keepScroll] = [el.scrollLeft, el.scrollTop]));
    const y = window.scrollY, my = main.scrollTop;
    Charts.clear(); stopPageTimers(); hideTip(); closePop();
    if (!quiet) Charts.mem.clear();
    const view = document.createElement("div");
    view.className = "view" + (quiet ? " quiet" : "");
    view.dataset.page = page;
    main.replaceChildren(view);
    P.render(view, arg);
    document.title = P.title + " · " + APP.name;
    $$("[data-route]").forEach((a) => (a.dataset.route === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));

  t.innerHTML = `<span class="tdot" aria-hidden="true"></span><span class="tmsg">${esc(msg)}</span>`;
  const dismiss = () => { if (t.out) return; t.out = true; t.classList.add("out"); setTimeout(() => t.remove(), calm() ? 0 : 320); };
  if (opt.undo) {
    const b = document.createElement("button");
    b.className = "tbtn"; b.type = "button"; b.textContent = opt.undoLabel || "Undo";
    b.onclick = () => { opt.undo(); dismiss(); };
    t.append(b);
  }
  box.append(t);
  while (box.children.length > 4) box.firstElementChild.remove();
  setTimeout(dismiss, opt.ms || 3800);
}

  const n = rateRange === "30D" ? 30 : rateRange === "90D" ? 90 : 365, h = DB.hist[rateProd].slice(-n), ds = daysBack(n);
  lineChart($("#rch", v), { key: "rch", labels: ds.map((d) => dshort(d)), area: true, yMin: Math.floor(Math.min(...h) * 4) / 4 - 0.25, h: 240, fmt: (x) => x.toFixed(2) + "%", tipFmt: (x) => x.toFixed(3) + "%", label: rateProd + " rate history", series: [{ name: rateProd, data: h, color: "var(--c1)" }] });
}

/* ---------- Page: Tasks ---------- */
let taskF = "Open";
function pgTasks(v) {
  const k = iso(TODAY), list = DB.tasks.filter((t) => (taskF === "Open" ? !t.done : taskF === "Done" ? t.done : true));
  const groups = [["Overdue", list.filter((t) => !t.done && t.due < k)], ["Today", list.filter((t) => t.due === k)], ["Coming up", list.filter((t) => t.due > k)], ["Done earlier", list.filter((t) => t.done && t.due < k)]];
  const PC = { high: "var(--bad)", med: "var(--warn)", low: "var(--c5)" };
  v.innerHTML = head("Tasks", `${DB.tasks.filter((t) => !t.done).length} open`, `${seg(["Open", "Done", "All"], taskF, "data-f", "Filter")}<button type="button" class="btn pri" data-act="add">${ic("plus")}Add task</button>`) +
    `<section class="card enter">${groups.filter((g) => g[1].length).map(([g, ts]) => `<div class="tgroup"><h3>${g} · ${ts.length}</h3>${ts.sort(by("due")).map((t) => `<div class="task${t.done ? " done" : ""}"><input type="checkbox" data-task="${t.id}" ${t.done ? "checked" : ""} aria-label="Done: ${esc(t.txt)}"><span class="prio" style="background:${PC[t.prio]}" title="${t.prio} priority"></span><div><b>${esc(t.txt)}</b><small>${dlong(t.due)}${t.loan ? ` · <a href="#/loans/${t.loan}" class="mono">${t.loan}</a>` : ""}</small></div><button type="button" class="btn sm ghost" data-edit="${t.id}" aria-label="Edit task">${ic("edit")}</button></div>`).join("")}</div>`).join("") || `<div class="empty">${ic("check")}<b>No tasks here</b></div>`}</section>`;
  v.addEventListener("change", taskToggle);
  v.addEventListener("click", (e) => {
    const f = e.target.closest("[data-f]");
    if (f) { taskF = f.dataset.f; refresh(); }
    const ed = e.target.closest("[data-edit]");
    if (ed) taskForm(DB.tasks.find((t) => t.id === ed.dataset.edit));
    if (e.target.closest('[data-act="add"]')) taskForm();
  });
}
function taskForm(t) {
  formModal({ title: t ? "Edit task" : "New task", save: t ? "Save" : "Add", fields: [{ k: "txt", label: "Task", req: true }, { k: "due", label: "Due", type: "date", req: true, half: true }, { k: "prio", label: "Priority", type: "select", opts: [{ v: "high", l: "High" }, { v: "med", l: "Medium" }, { v: "low", l: "Low" }], half: true }, { k: "loan", label: "Loan file", type: "select", opts: [{ v: "", l: "None" }, ...DB.loans.map((l) => ({ v: l.id, l: l.id + " · " + l.borrower }))] }], values: t || { due: iso(TODAY), prio: "med", loan: "" }, onSave: (d) => { if (t) Object.assign(t, d); else DB.tasks.push(Object.assign({ id: uid(), done: false }, d)); save(); counts(); toast(t ? "Task saved" : "Task added"); refresh(); }, onDelete: t ? () => { DB.tasks.splice(DB.tasks.indexOf(t), 1); save(); counts(); toast("Task deleted"); refresh(); } : null });
}

/* ---------- Page: Calendar ---------- */
let calMonth = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
function events() {
  return [...DB.loans.filter((l) => l.stage < 6).map((l) => ({ date: l.close, title: "Closing · " + l.borrower, c: "var(--c4)", go: "#/loans/" + l.id })), ...DB.loans.filter((l) => l.lock).map((l) => ({ date: l.lock, title: "Lock ends · " + l.borrower, c: "var(--c2)", go: "#/loans/" + l.id })), ...DB.appts.map((a) => ({ date: a.date, title: a.time + " " + a.title, c: "var(--c1)", appt: a }))];
}
function pgCalendar(v) {
  const first = monday(calMonth), end = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0), ev = events();
  const cells = [...Array(42)].map((_, i) => addDays(first, i)).filter((d, i) => i < 35 || d <= end);
  v.innerHTML = head(`${MON[calMonth.getMonth()]} ${calMonth.getFullYear()}`, "Closings, rate locks and meetings", `<button type="button" class="icon-btn" data-m="-1" aria-label="Previous month">${ic("chevl")}</button><button type="button" class="btn" data-m="0">Today</button><button type="button" class="icon-btn" data-m="1" aria-label="Next month">${ic("chev")}</button><button type="button" class="btn pri" data-act="add">${ic("plus")}Meeting</button>`) +
    `<section class="card enter"><div class="legend" style="margin:0 0 10px"><span><i style="background:var(--c4)"></i>Closing</span><span><i style="background:var(--c2)"></i>Lock ends</span><span><i style="background:var(--c1)"></i>Meeting</span></div><div class="cal">${DOW.map((d) => `<span class="dh">${d}</span>`).join("")}${cells.map((d) => { const k = iso(d), es = ev.filter((x) => x.date === k); return `<button type="button" class="d${d.getMonth() !== calMonth.getMonth() ? " out" : ""}${k === iso(TODAY) ? " today" : ""}" data-day="${k}" aria-label="${dlong(d)}, ${es.length} events"><b>${d.getDate()}</b>${es.slice(0, 3).map((x) => `<span class="ev" style="--ec:${x.c}">${esc(x.title)}</span>`).join("")}${es.length > 3 ? `<span class="muted">+${es.length - 3}</span>` : ""}</button>`; }).join("")}</div></section>`;
  v.addEventListener("click", (e) => {
    const m = e.target.closest("[data-m]");
    if (m) { calMonth = +m.dataset.m === 0 ? new Date(TODAY.getFullYear(), TODAY.getMonth(), 1) : addMonths(calMonth, +m.dataset.m); Router.render(); return; }
    if (e.target.closest('[data-act="add"]')) apptForm(iso(TODAY));
    const d = e.target.closest("[data-day]");
    if (d) {
      const es = ev.filter((x) => x.date === d.dataset.day);
      const md = modal({ title: dlong(d.dataset.day), cls: "sm", body: es.length ? `<ul class="list">${es.map((x, i) => `<li><span class="prio" style="background:${x.c}"></span><div><b>${esc(x.title)}</b></div>${x.go ? `<a class="btn sm" href="${x.go}" data-close>Open</a>` : `<button type="button" class="btn sm ghost" data-rm="${i}">${ic("trash")}</button>`}</li>`).join("")}</ul>` : `<div class="empty">${ic("cal")}<b>Free day</b></div>`, foot: `<button type="button" class="btn pri" data-add>${ic("plus")}Add meeting</button>` });
      $("[data-add]", md.el).onclick = () => { md.close(); apptForm(d.dataset.day); };
      md.el.addEventListener("click", (ev2) => { const rm = ev2.target.closest("[data-rm]"); if (rm) { DB.appts.splice(DB.appts.indexOf(es[+rm.dataset.rm].appt), 1); save(); md.close(); toast("Meeting removed"); refresh(); } });
    }
  });
}
function apptForm(day) {
  formModal({ title: "New meeting", cls: "sm", save: "Add", fields: [{ k: "title", label: "Title", req: true, ph: "Call with borrower" }, { k: "date", label: "Date", type: "date", req: true, half: true }, { k: "time", label: "Time", type: "time", req: true, half: true }], values: { date: day, time: "10:00" }, onSave: (d) => { DB.appts.push(Object.assign({ id: uid() }, d)); save(); toast("Meeting added"); refresh(); } });
}

/* ---------- Page: Messages ---------- */
let msgOpen = null;
const REPLIES = ["Thanks Ethan, that helps a lot.", "Got it. I'll send it tonight.", "Sounds good, talk soon!", "Can you also check if we can lower the rate?", "Great news, thank you!"];
function pgMessages(v) {
  if (!DB.convs.find((c) => c.id === msgOpen)) msgOpen = DB.convs[0] && DB.convs[0].id;
  const c = DB.convs.find((x) => x.id === msgOpen);
  if (c) c.unread = false;
  counts(); save();
  v.innerHTML = head("Messages", "Chat with borrowers. Replies show up live.") +
    `<section class="card chat enter"><div class="convs" role="group" aria-label="Conversations">${DB.convs.map((x) => `<button type="button" data-c="${x.id}" aria-pressed="${x.id === msgOpen}">${av(x.name)}<div><b>${esc(x.name)}</b><small>${esc((x.msgs[x.msgs.length - 1] || { txt: "No messages yet" }).txt)}</small></div>${x.unread ? '<span class="un" aria-label="unread"></span>' : ""}</button>`).join("")}</div>
    <div class="thread">${c ? `<div class="th-h">${av(c.name)}<div><b>${esc(c.name)}</b><small><a href="#/loans/${c.loan}" class="mono">${c.loan}</a></small></div></div><div class="msgs" id="msgs" aria-live="polite">${c.msgs.map(msgHTML).join("")}</div><div class="quick">${["Your rate is locked ✓", "Please upload your latest pay stub", "Closing is confirmed"].map((q) => `<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div><form class="composer" id="comp"><label class="sr" for="mIn">Message</label><input id="mIn" placeholder="Write a message…" maxlength="400" autocomplete="off"><button type="submit" class="btn pri">${ic("send")}Send</button></form>` : `<div class="empty">${ic("chat")}<b>No conversations</b></div>`}</div></section>`;
  const box = $("#msgs", v);
  if (box) box.scrollTop = box.scrollHeight;
  const send = (txt) => {
    if (!c || !txt.trim()) return;
    c.msgs.push({ me: true, t: Date.now(), txt: txt.trim() }); save();
    box.insertAdjacentHTML("beforeend", msgHTML(c.msgs[c.msgs.length - 1]));
    const ty = document.createElement("div"); ty.className = "typing"; ty.innerHTML = "<i></i><i></i><i></i>"; ty.setAttribute("aria-label", c.name + " is typing");
    setTimeout(() => { if (!box.isConnected) return; box.append(ty); box.scrollTop = box.scrollHeight; }, 500);
    setTimeout(() => { ty.remove(); const m = { me: false, t: Date.now(), txt: pick(REPLIES) }; c.msgs.push(m); save(); if (box.isConnected) { box.insertAdjacentHTML("beforeend", msgHTML(m)); box.scrollTop = box.scrollHeight; } else { c.unread = true; counts(); } }, 1900);
    box.scrollTop = box.scrollHeight;
  };
  if (c) {
    $("#comp", v).onsubmit = (e) => { e.preventDefault(); const i = $("#mIn", v); send(i.value); i.value = ""; };
  }
  v.addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (b) { msgOpen = b.dataset.c; refresh(); } const q = e.target.closest("[data-q]"); if (q) send(q.dataset.q); });
  every(24000, () => { const x = pick(DB.convs.filter((z) => z.id !== msgOpen)); if (!x) return; x.msgs.push({ me: false, t: Date.now(), txt: pick(["Quick question about closing costs", "Just uploaded the document", "Are we still on for Friday?"]) }); x.unread = true; save(); counts(); notify("New message from " + x.name, "info", "#/messages"); const bt = $(`[data-c="${x.id}"]`, v); if (bt && !$(".un", bt)) bt.insertAdjacentHTML("beforeend", '<span class="un" aria-label="unread"></span>'); });
}
const msgHTML = (m) => `<div class="msg ${m.me ? "me" : "them"}">${esc(m.txt)}<small>${ago(m.t)}</small></div>`;

/* ---------- Page: Reports ---------- */
function pgReports(v) {
  const f = DB.funded, byP = PRODUCTS.map((p, i) => ({ name: p, value: sum(DB.loans.filter((l) => l.product === p), (l) => l.amount), color: `var(--c${i + 1})`, sub: DB.loans.filter((l) => l.product === p).length + " loans" }));
  const comp = sum(f, (x) => x.vol) * (DB.settings.bps / 10000);
  v.innerHTML = head("Reports", "Volume, sources and your commission", `<button type="button" class="btn" data-act="csv">${ic("download")}Export</button>`) +
    `<section class="grid">
      ${kpi("Funded units, 12M", "check", cnt(sum(f, (x) => x.units), "int", "r1"), "loans closed")}
      ${kpi("Average loan", "home", cnt(sum(f, (x) => x.vol) / Math.max(1, sum(f, (x) => x.units)), "msh", "r2"), "funded")}
      ${kpi("Commission, 12M", "coins", cnt(comp, "msh", "r3"), DB.settings.bps + " basis points")}
      ${kpi("Leads to funded", "chart", cnt((sum(f, (x) => x.units) / Math.max(1, sum(f, (x) => x.units) + DB.leads.length + DB.loans.filter((l) => l.stage < 6).length)) * 100, "pct", "r4"), "share of all files that funded")}
      <article class="card s8"><div class="card-h"><h2>Units and volume</h2></div><div id="uv"></div></article>
      <article class="card s4"><div class="card-h"><h2>Files by source</h2></div><div id="bs"></div></article>
      <article class="card s12"><div class="card-h"><h2>Pipeline by product</h2></div><div id="bp"></div></article>
    </section>`;
  lineChart($("#uv", v), { labels: f.map((x) => MON[+x.m.slice(5) - 1]), area: true, h: 220, fmt: (n) => money(n, true), tipFmt: (n) => money(n), label: "Funded volume", series: [{ name: "Volume", data: f.map((x) => x.vol), color: "var(--c1)" }, { name: "12-month average", data: f.map(() => sum(f, (x) => x.vol) / f.length), color: "var(--c2)", dash: true }] });
  donut($("#bs", v), { items: SOURCES.map((s, i) => ({ name: s, value: DB.loans.filter((l) => l.source === s).length, color: `var(--c${(i % 6) + 1})` })), size: 150, sub: "files", label: "Loan files by source" });
  hbars($("#bp", v), byP.sort((a, b) => b.value - a.value), (n) => money(n, true));
  v.addEventListener("click", (e) => { if (e.target.closest('[data-act="csv"]')) download("gable-funded.csv", toCSV(f, [{ k: "m", label: "Month" }, { k: "units", label: "Units" }, { k: "vol", label: "Volume" }]), "text/csv"); });
}

/* ---------- Page: Settings ---------- */
function pgSettings(v) {
  const s = DB.settings, fields = [{ k: "name", label: "Your name", req: true, half: true }, { k: "nmls", label: "Licence number", req: true, half: true }, { k: "bps", label: "Commission (basis points)", type: "number", min: 0, max: 300, req: true, half: true }, { k: "lockDays", label: "Default lock length (days)", type: "number", min: 15, max: 90, req: true, half: true }];
  v.innerHTML = head("Settings") + `<section class="grid"><article class="card s7"><div class="card-h"><h2>Profile and defaults</h2></div><form class="form" id="sf" novalidate>${fields.map((f) => fieldHTML(f, s[f.k])).join("")}<div class="fld"><button class="btn pri" type="submit">Save</button></div></form></article><article class="card s5"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Paper or night desk</small></div><button type="button" class="btn" data-theme-toggle>${ic("moon", "i-moon")}${ic("sun", "i-sun")}Switch</button></div><div class="set-row"><div><b>Compact sidebar</b><small>Icons only</small></div><button type="button" class="btn" data-mini>Toggle</button></div><div class="set-row"><div><b>Export</b><small>All demo data as JSON</small></div><button type="button" class="btn" data-act="json">${ic("download")}Download</button></div><div class="set-row"><div><b>Reset demo</b><small>Restore the sample book</small></div><button type="button" class="btn danger ghost" data-reset>Reset</button></div></article></section>`;
  Theme.set(Theme.get(), false);
  $("#sf", v).onsubmit = (e) => { e.preventDefault(); const d = readForm(e.target, fields); if (d) { Object.assign(s, d); save(); toast("Settings saved"); } };
  v.addEventListener("click", (e) => { if (e.target.closest('[data-act="json"]')) download("gable-data.json", JSON.stringify(DB, null, 2), "application/json"); });
}

const APP = {
