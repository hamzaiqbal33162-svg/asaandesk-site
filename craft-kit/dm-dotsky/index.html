<!doctype html>
<!-- Chill & Craft · Dotsky · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotsky · Every payment is a dot</title>
<meta name="description" content="A money app for a small business where every payment is a dot on one chart: brush a window, filter categories and see recurring payments join up like dotskytions.">
<style>
/* ===================== Shared core styles (each design sets the tokens) ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:var(--icw,1.8);stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
html.theming *,html.theming *::before{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s,box-shadow .45s!important}
#view{outline:none}
.sp{flex:1}
.mut{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--panel-solid,var(--panel));padding:.55em 1em;border-radius:var(--r2,10px);font-weight:600;font-size:.86rem;line-height:1.2;transition:transform .15s var(--ease),background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.btn:active,.ib:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:0 6px 18px -8px var(--acc)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:.4em .7em;font-size:.8rem}
.btn.full{width:100%}
.lnk{background:none;border:0;padding:0;color:var(--acc);font-weight:600;font-size:.82rem}
.ib{position:relative;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:var(--r2,10px);border:1px solid var(--line);background:var(--panel-solid,var(--panel));color:var(--text);transition:transform .15s,background .2s;flex:none}
.ib:hover{background:var(--hover)}
.ib[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;animation:pop .4s var(--spring)}
/* cards and grids */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r,16px);padding:var(--pad,18px);box-shadow:var(--sh,none);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;min-width:0}
.card.lift:hover,.lift-all .card:hover{transform:translateY(-3px);box-shadow:var(--sh-h,var(--sh))}
.enter .card{animation:cardIn .62s var(--ease) both;animation-delay:calc(var(--i,0) * 48ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes fade{from{opacity:0}}
.ch-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch-h h2,.ch-h h3{font-size:1rem;font-weight:700}
.ch-h p{color:var(--muted);font-size:.8rem}
.g{display:grid;gap:var(--gap,16px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.sall{grid-column:1/-1}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}.g3 .s3,.g4 .s3{grid-column:1/-1}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.s2,.s3{grid-column:auto}}
/* KPI */
.kpi .k-l{font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .k-s{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.kpi [data-spark]{height:34px;margin-top:8px}
.dl{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:.78rem}
.dl .i{width:.9em;height:.9em}.dl-up{color:var(--ok)}.dl-dn{color:var(--bad)}
/* badges and avatars */
.bd{display:inline-flex;align-items:center;gap:.3em;padding:.18em .6em;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.bd-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.bd-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 17%,transparent)}
.bd-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.bd-info{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 60% 52%),hsl(calc(var(--h) + 40) 62% 42%))}
.who{display:flex;align-items:center;gap:9px;min-width:0}.who b{display:block;font-weight:600}.who small{display:block;color:var(--muted);font-size:.75rem}
/* table */
.tb-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tb-q{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r2,10px);padding:0 10px;background:var(--field,transparent);min-width:0;flex:1 1 180px;max-width:280px;color:var(--muted)}
.tb-q input{border:0;background:none;outline:none;padding:.5em 0;width:100%;min-width:0;color:var(--text)}
.tb-q:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.34em .8em;font-size:.78rem;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.tb-wrap{overflow-x:auto;margin:0 calc(var(--pad,18px) * -1);padding:0 var(--pad,18px)}
table.tb{width:100%;border-collapse:collapse;font-size:.85rem}
.tb th{text-align:left;font-weight:700;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th button{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:3px}
.tb th .so{opacity:.35;width:13px;height:13px}.tb th[aria-sort=ascending] .so,.tb th[aria-sort=descending] .so{opacity:1;color:var(--acc)}
.tb td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tb tbody tr{transition:background .15s}
.tb tbody tr[data-i]{cursor:pointer}
.tb tbody tr[data-i]:hover,.tb tbody tr[data-i]:focus-visible{background:var(--hover)}
.tb tbody tr:focus-visible{outline-offset:-2px}
.tb .r,.r{text-align:right}
.tb th.r button{flex-direction:row-reverse}
.row-in{animation:rowIn .45s var(--ease) both;animation-delay:var(--d)}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
.tb-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.pg{display:flex;gap:4px}
.pg button{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:.8rem;font-weight:600;color:var(--text)}
.pg button[aria-current]{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.empty{display:grid;place-items:center;gap:8px;padding:30px 12px;color:var(--muted);text-align:center;font-size:.85rem;white-space:normal}
.empty .i{width:28px;height:28px;opacity:.6}
/* layers: modal and drawer */
.ly{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.ly-bg{position:absolute;inset:0;background:var(--scrim,rgba(8,10,18,.5));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .28s}
.ly.open .ly-bg{opacity:1}
.ly-box{position:relative;background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 90px -20px rgba(0,0,0,.45);transform:translateY(18px) scale(.96);opacity:0;transition:transform .34s var(--spring),opacity .22s}
.ly-box.wide{width:min(760px,100%)}
.ly.open .ly-box{transform:none;opacity:1}
.ly-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.ly-hd h2{font-size:1.08rem;flex:1;font-weight:700}
.ly-x{width:2.1rem;height:2.1rem}
.ly-bd{padding:14px 18px 18px}
.ly-drawer{place-items:stretch end;padding:0}
.ly-drawer .ly-box{width:min(470px,100%);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);transform:translateX(100%);border-right:0}
.ly-drawer .ly-box.wide{width:min(640px,100%)}
.ly-sm .ly-box{width:min(400px,100%)}
.ly-ft{display:flex;gap:8px;align-items:center;padding-top:16px;flex-wrap:wrap}
.cf-t{color:var(--muted)}
/* forms */
.frm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.frm-note{font-size:.84rem;color:var(--muted);margin-bottom:12px}
.frm-err{color:var(--bad);font-size:.82rem;margin-top:8px;min-height:0}
.frm-err:empty{display:none}
.fld{display:grid;gap:5px;align-content:start;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:.78rem;font-weight:700;color:var(--muted)}
.fld>label b{color:var(--bad)}
.fld input,.fld select,.fld textarea,.inp{width:100%;padding:.62em .75em;border:1px solid var(--line);border-radius:var(--r2,10px);background:var(--field,var(--bg));color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.fld [aria-invalid=true]{border-color:var(--bad);animation:shake .35s}
.fld small{font-size:.74rem;color:var(--muted)}
.err{margin:0;color:var(--bad);font-size:.75rem;font-weight:600}
.err:empty{display:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.86rem;font-weight:600}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw input+span{width:40px;height:23px;border-radius:12px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw input+span::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(17px)}
.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{accent-color:var(--acc);width:100%}
@media (max-width:520px){.frm-grid{grid-template-columns:1fr}}
/* tooltip, toasts, popovers, command search */
#tip{position:fixed;left:0;top:0;z-index:95;pointer-events:none;background:var(--tipbg,#14161d);color:var(--tiptext,#f4f5f8);padding:8px 10px;border-radius:9px;font-size:.76rem;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;max-width:250px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#tip.on{opacity:1;transform:none}
#tip b{display:block;margin-bottom:3px;font-size:.78rem}
#tip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
#tip .tr span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
#tip .tr i{width:8px;height:8px;border-radius:50%;flex:none}
#tip .tr-m{opacity:.75}
#toasts{position:fixed;z-index:96;bottom:16px;right:16px;display:grid;gap:8px;max-width:calc(100% - 32px);justify-items:end}
.tst{display:flex;align-items:center;gap:10px;background:var(--tipbg,#14161d);color:var(--tiptext,#fff);padding:10px 14px;border-radius:12px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateY(20px) scale(.96);opacity:0;transition:transform .35s var(--spring),opacity .25s;font-size:.85rem;font-weight:600}
.tst.in{transform:none;opacity:1}
.tst .i{color:var(--ok)}.tst-warn .i,.tst-err .i{color:var(--warn)}.tst-err .i{color:var(--bad)}
.tst-u{background:none;border:0;color:var(--acc);font-weight:800;padding:0 0 0 6px}
.pop{position:fixed;z-index:85;width:min(340px,calc(100vw - 16px));background:var(--panel-solid,var(--panel));color:var(--text);border:1px solid var(--line);border-radius:var(--r,14px);box-shadow:0 24px 60px -18px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .2s,transform .25s var(--spring)}
.pop.open{opacity:1;transform:none}
.pop-hd,.pop-ft{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.pop-l{list-style:none;margin:0;padding:0 6px;max-height:340px;overflow:auto}
.pop-l li{display:flex;gap:10px;padding:10px 8px;border-radius:10px;font-size:.82rem}
.pop-l li.unread{background:var(--hover)}
.pop-l li p{color:var(--muted)}
.pop-l small{color:var(--muted);font-size:.72rem}
.pop-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:currentColor;padding:0}
.pop-mn{width:auto;min-width:190px}
.mn{list-style:none;margin:0;padding:6px}
.mn button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:.55em .7em;border-radius:8px;font-size:.85rem;color:var(--text)}
.mn button:hover,.mn button:focus-visible{background:var(--hover)}
.mn button.danger{color:var(--bad)}
.ly-cmd{place-items:start center;padding-top:12vh}
.ly-cmd .ly-hd{display:none}
.cmd input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 4px;font-size:1.05rem;outline:none;color:var(--text)}
.cmd ul{list-style:none;margin:8px 0 0;padding:0}
.cmd li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:.9rem}
.cmd li[aria-selected=true]{background:var(--acc);color:var(--acc-ink)}
.cmd-h{font-size:.72rem;color:var(--muted);margin-top:10px}
/* charts */
.ch{display:block;overflow:visible;max-width:100%}
.ch text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.ch .gl{stroke:var(--grid,var(--line));stroke-width:1}
.ch .gl.zero{stroke:var(--muted);stroke-opacity:.5}
.ch .ln{fill:none;stroke-width:var(--lw,2.2);stroke-linecap:round;stroke-linejoin:round}
.ch .ln.dash{stroke-dasharray:5 5;opacity:.8}
.ch.anim .ln:not(.dash){stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
.ch.anim .ln.dash,.ch.anim .band{animation:fade 1s .9s both}
.ch.anim .ar{animation:fade 1.1s .35s both}
.ch .band{fill-opacity:.13;stroke:none}
.ch .goal{stroke:var(--warn);stroke-dasharray:3 4}.ch .goal-t{fill:var(--warn);font-weight:700}
.ch .mark{stroke:var(--muted);stroke-dasharray:2 3;opacity:.7}.ch .mark-t{font-weight:700}
.ch .guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:.7;pointer-events:none}
.ch .hd{fill:var(--panel-solid,var(--bg));stroke-width:2.5;pointer-events:none}
.ch .hit{cursor:crosshair}
@keyframes draw{to{stroke-dashoffset:0}}
.ch .bar{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s,filter .2s}
.ch .bar.neg{transform-origin:50% 0}
.ch .bar:hover{filter:brightness(1.15) saturate(1.1)}
.ch.anim .bar{animation:grow .75s var(--ease) both;animation-delay:var(--d)}
@keyframes grow{from{transform:scaleY(0)}}
.ch .hm{transform-box:fill-box;transform-origin:center}
.ch.anim .hm{animation:pop .5s var(--ease) both;animation-delay:var(--d)}
.ch-empty{display:grid;place-items:center;gap:6px;min-height:140px;color:var(--muted);font-size:.85rem}
.ch-empty .i{width:28px;height:28px;opacity:.5}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.lg-i{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;font-size:.78rem;color:var(--muted);font-weight:600}
.lg-i i{width:10px;height:10px;border-radius:3px}
.lg-i[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn-w{position:relative;flex:none;margin:auto}
.dn-t{fill:none;stroke:var(--line)}
.dn-s{fill:none;stroke-width:var(--th,20px);transition:stroke-width .25s var(--ease);cursor:pointer}
.dn-s:hover{stroke-width:calc(var(--th,20px) + 6px)}
.ch.anim .dn-s,.ch.anim .gg-v,.ring-v{animation:sweep .95s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes sweep{from{stroke-dasharray:0 100}}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.dn-c small{font-size:.72rem;color:var(--muted)}
.dn-l{list-style:none;margin:0;padding:0;flex:1 1 150px;display:grid;gap:7px;font-size:.8rem;min-width:0}
.dn-l li{display:flex;align-items:center;gap:8px}
.dn-l i{width:10px;height:10px;border-radius:3px;flex:none}
.dn-l span{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);width:34px;text-align:right;font-size:.72rem}
.gg{position:relative;margin:auto}
.gg-t{fill:none;stroke:var(--line);stroke-linecap:round}
.gg-v{fill:none;stroke-linecap:round}
.gg-c{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-c b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.gg-c small{color:var(--muted);font-size:.75rem}
.ring{transform:rotate(0);flex:none}
.ring-t{fill:none;stroke:var(--line)}.ring-v{fill:none;stroke-linecap:round}
.hb{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.hb li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.82rem}
.hb-l{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb b{font-variant-numeric:tabular-nums}
.hb-t{grid-column:1/-1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:hbw .9s var(--ease) both;animation-delay:var(--d)}
@keyframes hbw{from{width:0}}
.pb{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%;width:var(--w);background:var(--acc);border-radius:inherit;animation:hbw .9s var(--ease) both;transition:width .6s var(--ease)}
/* segmented control */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:calc(var(--r2,10px) + 2px);background:var(--seg,color-mix(in srgb,var(--muted) 14%,transparent));flex:none}

  const ins = [['trend', `Sales were ${pct(Math.abs(sales[0] / Math.max(1, sales[1]) - 1) * 100, 0)} ${sales[0] >= sales[1] ? 'higher' : 'lower'} last month than the month before.`, 'Sales'], ['box', `Supplies cost ${money(sup[0], { dec: 0 })} last month, ${sup[0] > sup[1] ? 'up' : 'down'} from ${money(sup[1], { dec: 0 })}.`, 'Supplies'], ['cal', `${WD[wd.indexOf(Math.max(...wd))]}day is your best day for money coming in.`, 'Weekdays']];
  v.innerHTML = `<div class="ins">${ins.map(([i, t, s]) => `<div class="card lift"><span class="ico">${ic(i)}</span><p>${esc(t)}</p><small>${s} · from your own payments</small></div>`).join('')}</div>
  <div class="g g21 mt"><div class="card"><div class="ch-h"><h2>Cash flow by week</h2>${seg('wk', [['8', '8 weeks'], ['16', '16 weeks'], ['26', '26 weeks']], App.wk || '16', 'Weeks')}</div><div id="i-bar"></div></div><div class="card"><div class="ch-h"><h2>Biggest dots, 90 days</h2></div><ul class="mini">${big.map(p => `<li><span class="dotc" style="background:${CATS[p.cat]}"></span><div><b>${esc(p.who)}</b><br><small class="mut">${fd(p.t)}</small></div><span class="amt ${p.dir === 'in' ? 'pos' : ''}">${money(sgn(p) * p.amt, { sign: true, dec: 0 })}</span></li>`).join('')}</ul></div></div>
  <div class="card mt"><div class="ch-h"><h2>Money in by weekday, 90 days</h2></div><div id="i-wd"></div></div>`;
  const wkChart = n => { n = +n; const lab = [], inn = [], out = []; for (let i = n - 1; i >= 0; i--) { const a = T0 - (i + 1) * 7 * DAY, b = a + 7 * DAY, P = DB.pay.filter(p => p.t >= a && p.t < b); lab.push(fd(a)); inn.push(tot(P, 'in')); out.push(-tot(P, 'out')); } barChart($('#i-bar', v), { labels: lab, series: [{ name: 'In', data: inn, color: 'var(--in)' }, { name: 'Out', data: out, color: 'var(--out)' }], stack: true, h: 230, fmt: x => '$' + short(x), vfmt: x => money(x, { dec: 0 }), radius: 3 }); };
  wkChart(App.wk || '16'); onSeg('wk', n => { App.wk = n; wkChart(n); });
  barChart($('#i-wd', v), { labels: WD, series: [{ name: 'Money in', data: wd, color: 'var(--acc)' }], h: 180, fmt: x => '$' + short(x), vfmt: x => money(x, { dec: 0 }), radius: 8 });
};

PG.settings = v => {
  v.innerHTML = `<div class="g g2"><div class="card"><div class="ch-h"><h2>Business</h2></div><form class="frm" id="me-f" novalidate><div class="frm-grid">${fieldHTML({ k: 'biz', label: 'Business name' }, DB.me.biz)}${fieldHTML({ k: 'name', label: 'Your name' }, DB.me.name)}${fieldHTML({ k: 'email', label: 'Email', type: 'email', full: true }, DB.me.email)}</div><footer class="ly-ft"><span class="sp"></span><button class="btn pri" type="submit">Save</button></footer></form></div>
  <div class="card"><div class="ch-h"><h2>The sky</h2></div><div class="ctl"><div><b>Size dots by amount</b><small>Bigger payments, bigger stars</small></div><label class="sw"><input type="checkbox" role="switch" data-act="pref" data-k="size" ${DB.prefs.size ? 'checked' : ''}><span></span><span class="sr">Size dots by amount</span></label></div><div class="ctl"><div><b>Join repeating payments</b><small>Draw dotskytion lines</small></div><label class="sw"><input type="checkbox" role="switch" data-act="pref" data-k="links" ${DB.prefs.links ? 'checked' : ''}><span></span><span class="sr">Join repeating payments</span></label></div><div class="ctl"><div><b>Theme</b><small>Night sky or ink on paper</small></div>${seg('th', [['light', 'Paper'], ['dark', 'Night']], document.documentElement.dataset.theme, 'Theme')}</div><div class="ctl"><div><b>Demo data</b><small>A year of sample payments</small></div><button type="button" class="btn sm ghost danger" data-act="reset">${ic('refresh')}Reset</button></div></div></div>`;
  onSeg('th', t => setTheme(t));
  const F = [{ k: 'biz', label: 'Business name', req: true }, { k: 'name', label: 'Name', req: true }, { k: 'email', label: 'Email', type: 'email', req: true }], f = $('#me-f', v);
  f.onsubmit = e => { e.preventDefault(); const x = readForm(f, F), errs = {}; F.forEach(d => { const m = checkField(d, f.elements[d.k].value, x); if (m) errs[d.k] = m; }); if (!showErrs(f, errs)) return; DB.me = x; save(); $('#biz').textContent = x.biz; toast('Saved'); };
};
act('pref', el => { DB.prefs[el.dataset.k] = el.checked; save(); toast('Saved. Open the Sky to see it.'); });
act('reset', () => confirmDlg({ title: 'Reset demo data?', text: 'A fresh year of sample payments comes back.', ok: 'Reset', danger: true, onOk: () => { S.hidden.clear(); S.sel = null; S.q = ''; resetDB(makeDB); $('#biz').textContent = DB.me.biz; } }));

/* ---------- boot ---------- */
App.find = q => { const seen = new Set(); return DB.pay.filter(p => p.who.toLowerCase().includes(q) && !seen.has(p.who) && seen.add(p.who)).slice(0, 6).map(p => ({ label: 'Highlight ' + p.who, icon: 'star', run: () => { S.q = p.who.toLowerCase(); location.hash = '#/sky'; if (App.cur === 'sky') refresh(); } })); };
App.cmds = [{ label: 'Add a payment', icon: 'plus', run: () => App.acts.addPay() }, { label: 'Show the last 7 days', icon: 'cal', run: () => { S.sel = [T0 - 7 * DAY, T0 + DAY]; location.hash = '#/sky'; if (App.cur === 'sky') refresh(); } }];
start({ name: 'Dotsky', home: 'sky', routes: [
  { id: 'sky', label: 'Sky', title: 'Sky', icon: 'star', render: PG.sky },
  { id: 'payments', label: 'Payments', icon: 'list', render: PG.payments },
  { id: 'accounts', label: 'Accounts', icon: 'wallet', render: PG.accounts },
  { id: 'categories', label: 'Budgets', title: 'Categories and budgets', icon: 'pie', render: PG.categories },
  { id: 'recurring', label: 'Repeating', title: 'Repeating payments', icon: 'repeat', render: PG.recurring },
  { id: 'contacts', label: 'Contacts', icon: 'users', render: PG.contacts },
  { id: 'insights', label: 'Insights', icon: 'spark', render: PG.insights },
  { id: 'settings', label: 'Settings', icon: 'settings', render: PG.settings }] });
$('#biz').textContent = DB.me.biz;
notify('Big payment in', 'North Pier Hotel paid $6,240.00', 'ok'); notify('Tax pot reminder', 'Quarterly tax is due on the 20th', 'info');
/* a new payment appears now and then, so the sky feels alive */
every(25000, () => { const p = { id: uid('p'), t: Date.now(), dir: 'in', cat: 'Sales', who: pick(CUSTOMERS), amt: Math.round(Math.random() * 1400 + 80), rec: false, note: '' }; DB.pay.push(p); save(); notify('Payment in', `${p.who} paid ${money(p.amt)}`, 'ok'); if (App.cur === 'sky' && !Layers.length) refresh(); }, true);
</script>
</body>
</html>
