<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () {
    var q = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem("cc-cruxbook-1:theme")); } catch (e) { s = null; }
    var t = q === "light" || q === "dark" ? q : s || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  })();

<style>
/* =========================================================
   Base: shared structure. The skin below sets the colours,
   shapes and layout that make this dashboard its own.
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;font:var(--fs,14px)/1.5 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-h,inherit);margin:0;line-height:1.2}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted,.mut{color:var(--muted)}
.sm{font-size:.86em}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowrap{white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w,240px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--side,var(--panel));color:var(--side-ink,var(--ink));overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.15em;padding:4px 8px 14px}
.brand svg{width:30px;height:30px;flex:none}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm,8px);text-decoration:none;color:var(--side-mut,var(--muted));font-weight:600;transition:color .2s}
.nav a:hover{color:var(--side-ink,var(--ink))}
.nav a[aria-current="page"]{color:var(--nav-on,var(--acc-ink))}
.nav-marker{position:absolute;left:0;top:0;width:100%;height:40px;border-radius:var(--r-sm,8px);background:var(--acc);opacity:0;transition:transform .45s cubic-bezier(.3,1.25,.5,1),height .3s,width .3s,opacity .2s;pointer-events:none;z-index:0}
.nav-sec{font-size:.7em;text-transform:uppercase;letter-spacing:.14em;color:var(--side-mut,var(--muted));padding:14px 12px 4px;opacity:.8}
.nav-n{margin-left:auto;font-style:normal;font-size:.72em;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.main{min-width:0;overflow-x:clip}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 26px;background:var(--top-bg,transparent)}
.top h1{font-size:1.35em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{padding:6px 26px 40px;outline:none}
.menu-btn{display:none!important}
.nav-scrim{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.ph h2{font-size:1.45em;margin-right:auto}
.ph p{width:100%;margin:0;color:var(--muted)}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.3)}
 body.nav-open .side{transform:none}
 body.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;animation:fadeIn .25s}
 .menu-btn{display:inline-grid!important}
 .top{padding:12px 16px}
 .view{padding:4px 16px 32px}
}

/* ---------- Grid and cards ---------- */
.grid{display:grid;gap:var(--gap,16px);margin-bottom:var(--gap,16px)}
.g-k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.span2{grid-column:span 2}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--panel);border:var(--card-bd,1px solid var(--line));border-radius:var(--r,14px);padding:var(--pad,18px);box-shadow:var(--shadow,none);transition:transform .3s cubic-bezier(.3,.8,.3,1),box-shadow .3s,border-color .3s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h,var(--shadow,none))}
.card.flat:hover{transform:none}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{font-size:1.02em;margin-right:auto}
.ch .sub{color:var(--muted);font-size:.84em;font-weight:500}
.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:650}
.li small{color:var(--muted)}

/* ---------- KPI cards ---------- */
.kpi{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.kpi-i{position:absolute;right:14px;top:14px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--acc)}
.kpi-l{color:var(--muted);font-size:.84em;font-weight:650}
.kpi-v{font-size:1.65em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--font-n,inherit);white-space:nowrap}
.kpi-d{display:inline-flex;align-items:center;gap:2px;font-size:.8em;font-weight:700}
.kpi-d small{font-weight:500;color:var(--muted)}
.kpi-d .i{width:15px;height:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi-s{font-size:.82em;color:var(--muted)}
.kpi-sp{margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-btn,var(--r-sm,9px));cursor:pointer;font-weight:650;font-size:.93em;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s,color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn:active,.icon-btn:active,.chip:active,.seg button:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;box-shadow:var(--btn-sh,none)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.84em}
.btn .i{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm,9px);cursor:pointer;transition:transform .12s,background .2s,border-color .2s;flex:none;padding:0}
.icon-btn:hover{border-color:var(--acc)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm .i{width:15px;height:15px}
.icon-btn[disabled]{opacity:.4;cursor:default}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ring{animation:ring .7s}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
[data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
.kbd{font-size:.75em;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- Inputs and forms ---------- */
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-in,var(--r-sm,9px));background:var(--in-bg,var(--panel));color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=range]{padding:0;min-height:24px;accent-color:var(--acc);border:0;background:none;box-shadow:none}
[aria-invalid="true"]{border-color:var(--bad)!important}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:.84em;font-weight:650;color:var(--muted)}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:.8em}
.err:empty{display:none}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog span{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);transition:background .25s;flex:none}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+span{background:var(--acc)}
.tog input:checked+span::after{transform:translateX(17px)}
.tog input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.srch input{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.84em;font-weight:650;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:var(--r-sm,9px);background:var(--panel2);border:1px solid var(--line);flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-weight:650;font-size:.84em;color:var(--muted);cursor:pointer;border-radius:calc(var(--r-sm,9px) - 2px);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--seg-on,var(--ink))}
.seg-th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:calc(var(--r-sm,9px) - 2px);background:var(--seg-th,var(--panel));box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .4s cubic-bezier(.3,1.2,.5,1),width .3s}

/* ---------- Tables ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tbar .srch{flex:1 1 200px;max-width:320px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92em}
.tbl th{text-align:left;font-size:.76em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num,.tbl td.num{text-align:right}
.th-s{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.th-s:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th-s .ar{opacity:.45;font-size:.85em}
[aria-sort] .th-s{color:var(--ink)}
[aria-sort] .ar{opacity:1;color:var(--acc)}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover,tr.click:focus-visible{background:var(--hover,color-mix(in srgb,var(--acc) 8%,transparent))}
tr.click:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.rows-in tr{animation:rowIn .4s both;animation-delay:calc(var(--ri,0) * 30ms)}
@keyframes rowIn{from{opacity:0;translate:0 6px}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85em;color:var(--muted)}
.pg-b{display:flex;gap:4px;align-items:center}
.pgn{min-width:30px;height:30px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;font-weight:650;color:var(--muted)}
.pgn[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.cell2{display:flex;align-items:center;gap:10px;min-width:0}
.cell2 b{display:block;font-weight:650}
.cell2 small{display:block;color:var(--muted);font-size:.85em}

/* ---------- Status pills, avatars, meters ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.77em;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--pc,var(--muted)) 15%,transparent);color:var(--pc,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-paid,.s-approved,.s-active,.s-valid,.s-signed,.s-done,.s-accepted,.s-booked{--pc:var(--ok)}
.s-sent,.s-review,.s-open,.s-scheduled,.s-partial{--pc:var(--info)}
.s-pending,.s-expiring,.s-unsigned,.s-leave{--pc:var(--warn)}
.s-overdue,.s-rejected,.s-expired,.s-frozen,.s-cancelled,.s-declined{--pc:var(--bad)}
.s-draft{--pc:var(--muted)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-av,50%);background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 26%);font-weight:800;font-size:.76em;flex:none;letter-spacing:.02em}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 70% 86%)}
.av.lg{width:54px;height:54px;font-size:1em}
.av.sm{width:26px;height:26px;font-size:.66em}
.meter{display:block;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--acc);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 10px;color:var(--muted);text-align:center}
.empty .i{width:30px;height:30px;opacity:.6}
.empty b{color:var(--ink)}
.empty.sm{padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.88em}
.kv dd{margin:0;font-weight:600;text-align:right}

/* ---------- Modals, drawers, menus, command search ---------- */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.ov-bg{position:absolute;inset:0;background:var(--ov,rgba(10,12,20,.5));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .28s}
.dlg{position:relative;width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;background:var(--dlg-bg,var(--panel));color:var(--ink);border:1px solid var(--line);border-radius:var(--r-dlg,var(--r,16px));box-shadow:0 30px 80px rgba(0,0,0,.35);opacity:0;transform:translateY(16px) scale(.97);transition:opacity .28s,transform .35s cubic-bezier(.2,.9,.3,1.1)}
.ov.open .ov-bg{opacity:1}
.ov.open .dlg{opacity:1;transform:none}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.dlg-h h2{font-size:1.12em;margin-right:auto}
.dlg-b{padding:6px 18px 16px;overflow:auto}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.ov.sm .dlg{width:min(400px,100%)}
.ov.wide .dlg{width:min(760px,100%)}
.ov.xl .dlg{width:min(1120px,100%);max-height:94vh}
.ov.drawer{place-items:stretch end;padding:0}
.ov.drawer .dlg{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--r-dlg,16px) 0 0 var(--r-dlg,16px);transform:translateX(100%)}
.ov.drawer.wide .dlg{width:min(640px,100%)}
.ov.drawer.open .dlg{transform:none}
.ov.pop{place-items:start end;padding:64px 16px 16px}
.ov.pop .ov-bg,.ov.menu .ov-bg{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.ov.pop .dlg{width:min(370px,100%);transform:translateY(-8px) scale(.98);transform-origin:top right}
.ov.menu{display:block;padding:0}
.ov.menu .dlg{position:fixed;width:220px;transform:translateY(-6px);border-radius:12px}
.ov.menu .dlg-h{padding:10px 12px 4px}
.ov.menu .dlg-h h2{font-size:.76em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ov.menu .dlg-h .icon-btn{display:none}
.ov.menu .dlg-b{padding:2px 6px 6px}
.mnu{display:flex;flex-direction:column}
.mi{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.mi:hover,.mi:focus-visible{background:var(--panel2)}
.mi[disabled]{opacity:.55;cursor:default}
.ov.cmdk{place-items:start center;padding-top:12vh}
.cmd-l{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cmd-l button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;text-align:left}
.cmd-l [aria-selected="true"] button,.cmd-l button:hover{background:var(--panel2)}
.cmd-l small{color:var(--muted)}
.srch.big input{min-height:46px;font-size:1.05em}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.notes li{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.notes li.new{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.notes li small{display:block;color:var(--muted);font-size:.8em}
.notes .i{color:var(--acc);margin-top:2px}
@media (max-width:560px){.ov{padding:0;place-items:end stretch}.ov .dlg{width:100%;border-radius:var(--r-dlg,16px) var(--r-dlg,16px) 0 0;max-height:92vh}.ov.drawer .dlg{border-radius:0}.ov.pop{padding:56px 8px 8px}.ov.menu .dlg{width:220px;border-radius:12px}.ov.cmdk{padding-top:0}}

/* ---------- Toasts and tooltip ---------- */
.toasts{position:fixed;right:18px;bottom:var(--toast-b,18px);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm,10px);background:var(--toast-bg,#16181d);color:var(--toast-ink,#fff);box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:600;font-size:.92em;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:min(380px,calc(100vw - 36px))}
.toast.show{opacity:1;transform:none}
.toast .i{color:var(--ok)}.toast.bad .i{color:var(--bad)}.toast.warn .i{color:var(--warn)}
.t-undo{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
@media (max-width:560px){.toasts{left:12px;right:12px;align-items:stretch}}
.tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;min-width:120px;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--tip-bg,#111318);color:var(--tip-ink,#fff);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px;font-size:12px}
.tip div{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip div i{width:8px;height:8px;border-radius:3px;flex:none}
.tip div span{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tip .mut{opacity:.75;display:block}

/* ---------- Charts ---------- */
.chart{position:relative;min-width:0;outline:none}
.chart svg{display:block;overflow:visible}
.chart:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.gl{stroke:var(--grid,var(--line));stroke-dasharray:3 4}
.zl{stroke:var(--muted);stroke-width:1;opacity:.6}
.ax{fill:var(--muted);font-size:11px;font-family:var(--font-n,inherit)}
.ln{fill:none;stroke-width:var(--lw,2.4);stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:5 6;opacity:.9}
.ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawOn 1.3s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes drawOn{to{stroke-dashoffset:0}}
.ar.fade,.band.fade{animation:fadeIn 1.2s .35s both}
.band{opacity:.2}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--panel);stroke-width:2.5}
.bar{transition:opacity .2s}
.bar.dim{opacity:.35}
.bar.grow{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .75s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d,0ms)}
.bar.grow.neg{transform-origin:50% 0}
@keyframes barUp{from{transform:scaleY(0)}}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82em;color:var(--muted);margin-bottom:8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.spk{display:block;overflow:visible}
.spk .ln{stroke-width:2}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dn-w{position:relative;flex:none}
.seg-bg{fill:none;stroke:var(--panel2)}
.dseg{fill:none;transition:opacity .2s;cursor:pointer}
.dseg.dim{opacity:.28}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dn-c b{font-size:1.25em;font-weight:800}
.dn-c small{color:var(--muted);font-size:.76em}
.dn-l{list-style:none;margin:0;padding:0;flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px}
.dn-l li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.88em;transition:background .2s;outline-offset:-2px}
.dn-l li.on{background:var(--panel2)}
.dn-l i{width:10px;height:10px;border-radius:3px}
.dn-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-l em{font-style:normal;color:var(--muted);font-size:.9em;min-width:34px;text-align:right}
.hb{margin-bottom:11px}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:.88em;margin-bottom:5px}
.hb-l small{display:block;color:var(--muted);font-size:.85em}
.hb-t{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:inherit;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.gg{position:relative;max-width:240px;margin:0 auto}
.gg svg{display:block}
.gg-bg,.gg-v{fill:none;stroke-linecap:round}
.gg-bg{stroke:var(--panel2)}
.gg-t{position:absolute;left:0;right:0;bottom:0;text-align:center}
.gg-t b{display:block;font-size:1.55em;font-weight:800;line-height:1.1}
.gg-t small{color:var(--muted);font-size:.8em}
.hm{display:grid;gap:3px;font-size:.72em}
.hm-x,.hm-y{color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
.hm-y{text-align:right;padding-right:6px;align-self:center}
.hm-c{aspect-ratio:1.4;border-radius:4px;background:color-mix(in srgb,var(--hm,var(--acc)) var(--a),var(--panel2));animation:fadeIn .5s both;animation-delay:var(--d)}
.hm-c:hover{outline:2px solid var(--ink);outline-offset:-1px}

/* ---------- Drag and drop ---------- */
.drag-ghost{box-shadow:0 24px 50px rgba(0,0,0,.3);opacity:.96;transition:none!important;animation:none!important}
.drop-ph{border:2px dashed var(--acc);border-radius:var(--r-sm,10px);background:color-mix(in srgb,var(--acc) 8%,transparent);margin-bottom:8px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.over{outline:2px dashed var(--acc);outline-offset:-3px}
.dropped{animation:drop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:scale(1.06)}}
.grip{cursor:grab;touch-action:none;border:0;background:none;color:var(--muted);padding:2px;display:inline-grid;place-items:center}

/* ---------- Reduced motion: keep it calm ---------- */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* =========================================================
   Skin: Cruxbook (chalkboard slate with chalk pastels, climbing-hold shapes)
   ========================================================= */
/* Tokens: light is a limestone wall, dark is a chalkboard. Chart colours are chalk sticks. */
:root{
  --font:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs:14px;--r:20px;--r-sm:12px;--side-w:250px;--gap:16px;--pad:20px;
  --bg:#e9e7e1;--panel:#f8f7f3;--panel2:#e6e3db;--ink:#25302c;--muted:#68716d;--line:rgba(37,48,44,.12);
  --acc:#1f9c75;--acc-ink:#fff;--ok:#1f9c75;--warn:#b07d00;--bad:#d4553d;--info:#3b7fc0;
  --c1:#1f9c75;--c2:#3b7fc0;--c3:#e0644d;--c4:#c99a1c;--c5:#7b67d6;--c6:#d36ba2;
  --side:#26302c;--side-ink:#eef0ea;--side-mut:#a9b3ae;--nav-on:#eef0ea;
  --shadow:0 1px 2px rgba(37,48,44,.06),0 6px 18px rgba(37,48,44,.06);--shadow-h:0 12px 30px rgba(37,48,44,.13);
  --chalk:rgba(37,48,44,.05);--toast-bg:#26302c;--grid:rgba(37,48,44,.1);
}
[data-theme="dark"]{
  --bg:#1a201e;--panel:#232b28;--panel2:#2d3632;--ink:#eef0ea;--muted:#a3ada8;--line:rgba(238,240,234,.1);
  --acc:#9fe0c4;--acc-ink:#15201c;--ok:#9fe0c4;--warn:#f6d98b;--bad:#ff9f8a;--info:#9ccff2;
  --c1:#9fe0c4;--c2:#9ccff2;--c3:#ff9f8a;--c4:#f6d98b;--c5:#c3b5f5;--c6:#f5b3d4;
  --side:#141917;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);--shadow-h:0 16px 36px rgba(0,0,0,.4);
  --chalk:rgba(255,255,255,.035);--toast-bg:#eef0ea;--toast-ink:#1a201e;--tip-bg:#eef0ea;--tip-ink:#1a201e;--grid:rgba(238,240,234,.08);
}
body{background:var(--bg) radial-gradient(1200px 500px at 70% -10%,var(--chalk),transparent 70%)}
h1,h2,h3{font-weight:750;letter-spacing:-.01em}
[data-theme="dark"] h1,[data-theme="dark"] .ch h3{text-shadow:0 0 1px rgba(238,240,234,.5),0 0 12px rgba(238,240,234,.08)}

/* Sidebar: slate with a chalk-circle marker */
.side{padding:22px 16px}
.brand{font-size:1.3em;color:var(--side-ink);padding-bottom:20px}
.brand svg{width:34px;height:34px}
.nav{gap:4px}
.nav a{padding:10px 14px;border-radius:14px}
.nav-marker{background:rgba(238,240,234,.07);border:2px dashed rgba(238,240,234,.45);border-radius:40% 60% 55% 45%/55% 45% 55% 45%}
.side-card{margin-top:auto;padding:16px;border-radius:18px 26px 20px 30px;background:rgba(159,224,196,.12);color:var(--side-ink);display:flex;flex-direction:column;gap:2px}
.side-card small{color:var(--side-mut);font-size:.78em;text-transform:uppercase;letter-spacing:.1em}
.side-card b{font-size:1.4em}
.side-card span{color:#9fe0c4;font-weight:700}

/* Top bar and the gym switcher */
.top{flex-wrap:wrap;padding:18px 28px 8px}
.top h1{font-size:1.6em}
.sites{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--panel);box-shadow:var(--shadow);overflow-x:auto;max-width:100%}
.site-b{border:0;background:none;padding:7px 14px;border-radius:99px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .25s,color .25s}
.site-b i{width:9px;height:9px;border-radius:40% 60% 55% 45%}
.site-b[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:900px){.top{padding:12px 16px 6px}.sites{order:9;width:100%}}

/* Cards: soft, rounded, with hold-shaped icons */
.card{border:0;box-shadow:var(--shadow)}
.kpi-i{width:40px;height:40px;border-radius:40% 60% 55% 45%/55% 45% 60% 40%;background:color-mix(in srgb,var(--acc) 20%,transparent)}
.kpi:nth-child(2) .kpi-i{background:color-mix(in srgb,var(--c3) 22%,transparent);color:var(--c3)}
.kpi:nth-child(3) .kpi-i{background:color-mix(in srgb,var(--c4) 24%,transparent);color:var(--c4)}
.kpi:nth-child(4) .kpi-i{background:color-mix(in srgb,var(--c5) 22%,transparent);color:var(--c5)}
.kpi-v{font-size:1.75em}
.btn{border-radius:12px}
.btn.pri{box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.seg,.seg button,.seg-th{border-radius:99px}

/* The morphing cash-flow chart */
.cf-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.cf-head h3{margin-right:auto}
.cf-big{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 12px}
.cf-big div small{display:block;color:var(--muted);font-size:.8em;font-weight:650}
.cf-big div b{font-size:1.3em;font-variant-numeric:tabular-nums}
.mA,.mB{transition:fill .5s}
.mL{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:opacity .5s}
.mR{transition:opacity .5s}
.mx-ax{transition:opacity .3s}
.col-dim .mA,.col-dim .mB{opacity:.35}
.mA.hi,.mB.hi{opacity:1!important}
.cf-lg{display:flex;gap:14px;font-size:.82em;color:var(--muted);flex-wrap:wrap}
.cf-lg span{display:inline-flex;align-items:center;gap:6px}
.cf-lg i{width:10px;height:10px;border-radius:3px}
.dust{position:absolute;pointer-events:none;width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.4;animation:dust .7s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* Site cards */
.site-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.site-c{overflow:hidden}
.site-c .blob{position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:40% 60% 55% 45%/55% 45% 60% 40%;opacity:.18}
.site-c h4{margin:0;font-size:1.1em}
.site-c .big{font-size:1.45em;font-weight:800;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.site-c .row{font-size:.84em;color:var(--muted)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini-stats div{padding:8px;border-radius:12px;background:var(--panel2);text-align:center}
.mini-stats b{display:block;font-size:1.05em}
.mini-stats small{color:var(--muted);font-size:.74em}
.acct{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel2);margin-bottom:8px}
.acct .i{width:22px;height:22px;color:var(--acc)}
.acct b{display:block}.acct small{color:var(--muted)}
.acct .num{margin-left:auto;font-weight:800;font-size:1.05em}
.shift{display:flex;flex-wrap:wrap;gap:6px}
.shift span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--panel2);font-size:.84em;font-weight:600}
.cert{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74em;font-weight:700;background:var(--panel2);margin:2px 4px 2px 0}
.cert.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.cert.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}

/* Payroll run */
.run-bar{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--bg);margin-bottom:var(--gap)}
.run-bar small{display:block;opacity:.7;font-size:.8em}
.run-bar b{font-size:1.4em;font-variant-numeric:tabular-nums}
.run-bar .btn{margin-left:auto}
.run-bar .btn.pri{background:var(--acc);color:var(--acc-ink)}
.hrs{width:78px;min-height:32px;padding:4px 8px;text-align:right}
.prog{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .25s}
.paid-row td{animation:paidFlash .8s both;animation-delay:calc(var(--ri,0) * 40ms)}
@keyframes paidFlash{from{background:color-mix(in srgb,var(--ok) 25%,transparent)}}

/* Documents */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--gap)}
.doc{display:flex;flex-direction:column;gap:6px}
.doc-ic{width:44px;height:52px;border-radius:6px 16px 6px 6px;display:grid;place-items:center;background:var(--panel2);color:var(--acc);margin-bottom:4px;position:relative}
.doc-ic::after{content:attr(data-t);position:absolute;bottom:-6px;right:-8px;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--ink);color:var(--bg)}
.doc h4{margin:0;font-size:.98em;line-height:1.3}
.doc small{color:var(--muted)}
.doc .row{margin-top:auto;padding-top:6px}
.up-prog{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}
.up-prog i{display:block;height:100%;background:var(--acc);animation:upl 1.4s ease-out forwards}
@keyframes upl{from{width:0}to{width:100%}}
.sel-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);margin-bottom:12px;animation:rise .3s both}
.sel-bar .btn{background:var(--bg);color:var(--ink);border-color:transparent}
td input[type=checkbox],th input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}

</style>
</head>
<body>
<!-- App shell: chalkboard sidebar with hold-shaped logo, a top bar with the site switcher -->
<div class="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <a class="brand" href="#/overview" aria-label="Cruxbook home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 25c-3-4-2-10 2-13 3-2 5-6 9-7 5-1 10 3 9 9-1 4-4 5-5 8-2 5-11 7-15 3z" fill="#9fe0c4"/><circle cx="13" cy="15" r="2.2" fill="#1d2422"/><path d="M4 29c6-3 18-3 24 0" stroke="#f6d98b" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-dasharray="1 4"/></svg>
      <span>Cruxbook</span>
    </a>
    <nav class="nav" data-navlist aria-label="Main"></nav>
    <div class="side-card">
      <small>Next payroll</small>
      <b id="nextPay">28 Nov</b>
      <span id="nextPayAmt">Rs 0</span>
    </div>
  </aside>
  <div class="nav-scrim" data-act="menu"></div>
  <div class="main">
    <header class="top">
      <button type="button" class="icon-btn menu-btn" data-act="menu" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 data-page-title>Overview</h1>
      <div class="sites" id="sites" role="group" aria-label="Choose a gym"></div>
      <button type="button" class="icon-btn" data-act="cmdk" aria-label="Search and commands (Ctrl K)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <button type="button" class="icon-btn" data-act="theme" aria-label="Switch theme"><svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button type="button" class="icon-btn" data-act="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="bell-n" hidden>0</span></button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<script>
/* =========================================================
   Core helpers: DOM, numbers, dates, storage, router, UI
   pieces (toast, modal, drawer, form, table) and charts.
   Everything is plain JS with no libraries.
   ========================================================= */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches; // reduced motion flag, checked by every animation
if (RMQ.addEventListener) RMQ.addEventListener('change', e => { RM = e.matches; });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = 'id') => p + Math.random().toString(36).slice(2, 8);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const groupSum = (rows, key, val) => rows.reduce((m, r) => { const k = typeof key === 'function' ? key(r) : r[key]; m[k] = (m[k] || 0) + (typeof val === 'function' ? val(r) : r[val]); return m; }, {});

/* ---------- Seeded random numbers, so demo data is the same each time ---------- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = rng(1);
const rnd = (a, b) => a + R() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() < p;

/* ---------- Dates are stored as 'YYYY-MM-DD' strings ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const TODAY_S = iso(new Date());
