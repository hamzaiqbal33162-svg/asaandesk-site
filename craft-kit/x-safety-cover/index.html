<!doctype html>
<!-- Chill & Craft · Safety Cover · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety Cover · guarded delete button</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens ---------- */
  :root {
    color-scheme: light;
    --bg: #d9dde2;
    --bg-dot: rgba(0, 0, 0, .06);
    --metal1: #eef0f2;
    --metal2: #c7ccd2;
    --engrave: #4b5159;
    --engrave-hi: rgba(255, 255, 255, .7);
    --led-off: #5b4a3a;
    --muted: #59606a;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1013;
    --bg-dot: rgba(255, 255, 255, .04);
    --metal1: #41464e;
    --metal2: #24282d;
    --engrave: #b3bac3;
    --engrave-hi: rgba(0, 0, 0, .6);
    --led-off: #2d2620;
    --muted: #9aa2ac;
    --focus: #93c5fd;
  }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
  }

  /* ---------- Stage: a workshop wall ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    background: radial-gradient(var(--bg-dot) 1.3px, transparent 1.6px) 0 0 / 18px 18px, var(--bg);
    color: var(--engrave);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px; width: 100%; }

  /* ---------- Brushed metal plate ---------- */
  .plate {
    position: relative;
    width: min(360px, 100%);
    padding: 20px 22px 18px;
    border-radius: 24px;
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .07) 0 1px, rgba(0, 0, 0, .025) 1px 3px),
      linear-gradient(160deg, var(--metal1), var(--metal2));
    box-shadow: 0 30px 50px -30px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -2px 0 rgba(0, 0, 0, .15);
    display: grid;
    justify-items: center;
  }
  .plate.thud { animation: thud .3s ease-out; }
  .plate.buzz { animation: buzz .08s linear infinite; }
  .screw { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6f7f8, #9aa1a9 60%, #6d747c); box-shadow: inset 0 -1px 1px rgba(0, 0, 0, .4), 0 1px 0 rgba(255, 255, 255, .5); }
  .screw::after { content: ""; position: absolute; left: 2px; right: 2px; top: 6px; height: 2px; border-radius: 1px; background: #5b6168; transform: rotate(var(--r)); }
  .s1 { left: 12px; top: 12px; --r: 20deg; } .s2 { right: 12px; top: 12px; --r: -35deg; } .s3 { left: 12px; bottom: 12px; --r: 70deg; } .s4 { right: 12px; bottom: 12px; --r: 5deg; }

  .tag { width: 100%; text-align: center; text-shadow: 0 1px 0 var(--engrave-hi); }
  .tag b { display: block; font-size: 13px; letter-spacing: .32em; font-weight: 800; }
  .tag span { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
  .lift { margin-top: 18px; height: 40px; display: grid; justify-items: center; align-content: end; font-size: 10.5px; letter-spacing: .3em; font-weight: 800; color: var(--muted); text-shadow: 0 1px 0 var(--engrave-hi); }
  .lift svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; animation: up 1.6s ease-in-out infinite; }

  /* ---------- The well: LED ring, socket, red button and the hinged cover ---------- */
  .well { position: relative; width: 200px; height: 200px; margin-top: 4px; }
  .ring { position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle, transparent 58%, rgba(0, 0, 0, .12) 60%, transparent 62%); }
  .leds i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px;
    border-radius: 50%;
    background: var(--led-off);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5);
    transform: rotate(calc(var(--i) * 30deg)) translateY(-92px);
    transition: background-color .15s, box-shadow .15s;
  }
  .well[data-mode="idle"] .leds i { animation: scan 2.4s linear infinite; animation-delay: calc(var(--i) * .2s); }
  .well[data-mode="armed"] .leds i { animation: armed .6s steps(1) infinite; animation-delay: calc(var(--i) * -.05s); }
  .leds i.on { background: #ff3b30; box-shadow: 0 0 10px #ff3b30, 0 0 2px #fff inset; }
  .well[data-mode="clear"] .leds i { background: #22e07a; box-shadow: 0 0 12px #22e07a; animation: none; }

  .hinge { position: absolute; left: 50%; top: 18px; width: 128px; height: 10px; margin-left: -64px; border-radius: 5px; background: linear-gradient(180deg, #8c939b, #50565d); box-shadow: 0 1px 0 rgba(255, 255, 255, .4), inset 0 1px 0 rgba(255, 255, 255, .4); z-index: 3; }
  .socket { position: absolute; left: 30px; top: 30px; width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2c2f35, #0e1013 72%); box-shadow: inset 0 8px 16px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .45), 0 0 0 6px rgba(0, 0, 0, .05); }
  .red {
    width: 104px;
    height: 104px;
    border: 0;
    border-radius: 50%;
    padding: 0;
    background: radial-gradient(circle at 40% 30%, #ff9d93 0, #ff3b30 30%, #c4141b 70%, #8e0b10 100%);
    color: rgba(255, 255, 255, .9);
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .16em;
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .35);
    cursor: pointer;
    transform: translateY(-4px);
    box-shadow: 0 8px 0 #6b070b, 0 14px 18px rgba(0, 0, 0, .5), inset 0 2px 3px rgba(255, 255, 255, .55);
    transition: transform .12s, box-shadow .12s, filter .3s;
  }
  .red[aria-disabled="true"] { cursor: default; filter: saturate(.85) brightness(.92); }
  .red:not([aria-disabled="true"]):hover { filter: brightness(1.08); }
  .red.down { transform: translateY(4px); box-shadow: 0 0 0 #6b070b, 0 3px 6px rgba(0, 0, 0, .5), inset 0 2px 3px rgba(255, 255, 255, .3); }
  .red:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }

  .cover {
    position: absolute;
    left: 22px;
    top: 22px;
    width: 156px;
    height: 156px;
    padding: 0;
    border: 0;
    border-radius: 22px;
    cursor: pointer;
    z-index: 2;
    background:
      linear-gradient(160deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .08) 38%, rgba(255, 255, 255, 0) 60%, rgba(0, 0, 0, .1)),
      rgba(255, 196, 40, .3);
    -webkit-backdrop-filter: blur(1.5px) saturate(1.3);
    backdrop-filter: blur(1.5px) saturate(1.3);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .45), inset 0 -12px 22px rgba(120, 70, 0, .15), 0 14px 22px -10px rgba(0, 0, 0, .45);
    transform-origin: 50% 0;
    transform: perspective(700px) rotateX(0deg);
    transition: transform .42s cubic-bezier(.55, 0, 1, .45);
  }
  .cover[aria-expanded="true"] { transform: perspective(700px) rotateX(112deg); transition: transform .8s var(--spring); }
  .cover:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .cover .stripes { position: absolute; left: 0; right: 0; top: 0; height: 26px; border-radius: 22px 22px 0 0; background: repeating-linear-gradient(-45deg, #f6c21c 0 10px, #1d1d1f 10px 20px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
  .cover .latch { position: absolute; left: 50%; bottom: -9px; width: 46px; height: 15px; margin-left: -23px; border-radius: 0 0 9px 9px; background: linear-gradient(180deg, #f6c21c, #d9a40c); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .2); }
  .cover .gleam { position: absolute; left: 18px; top: 36px; width: 20px; height: 90px; border-radius: 10px; background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); transform: skewX(-12deg); }
  .cover:hover:not([aria-expanded="true"]) { transform: perspective(700px) rotateX(9deg); transition: transform .35s var(--spring); }

  .shock { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px; border-radius: 50%; border: 3px solid #22e07a; opacity: 0; pointer-events: none; }

  /* ---------- LCD read-out ---------- */
  .lcd {
    width: 100%;
    margin-top: 18px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px), #0e1a12;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .45);
    color: #7dffb0;
    text-shadow: 0 0 6px rgba(125, 255, 176, .55);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    transition: color .3s;
  }
  .lcd.t-amber { color: #ffc24a; text-shadow: 0 0 6px rgba(255, 194, 74, .55); }
  .lcd.t-red { color: #ff6b5e; text-shadow: 0 0 6px rgba(255, 107, 94, .6); }
  .lcd .l { font-size: 12.5px; letter-spacing: .14em; white-space: nowrap; }
  .lcd .r { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lcd small { font-size: 11px; opacity: .7; }
  .caption { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; text-shadow: 0 1px 0 var(--engrave-hi); }

  .bit { position: fixed; z-index: 40; width: 4px; height: 10px; margin: -5px 0 0 -2px; border-radius: 2px; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @keyframes scan { 0%, 8% { background: #ffb020; box-shadow: 0 0 8px #ffb020; } 22%, 100% { background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5); } }
  @keyframes armed { 0% { background: #ffb020; box-shadow: 0 0 10px #ffb020; } 50% { background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5); } }
  @keyframes thud { 0% { transform: translateY(0); } 30% { transform: translateY(2px); } 60% { transform: translateY(-1px); } 100% { transform: none; } }
  @keyframes buzz { 0% { transform: translate(0, 0); } 25% { transform: translate(.6px, -.4px); } 50% { transform: translate(-.5px, .5px); } 75% { transform: translate(.4px, .5px); } }
  @keyframes up { 0%, 100% { transform: translateY(2px); opacity: .5; } 50% { transform: translateY(-2px); opacity: 1; } }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="plate" id="plate" aria-labelledby="plate-title">
    <i class="screw s1" aria-hidden="true"></i><i class="screw s2" aria-hidden="true"></i><i class="screw s3" aria-hidden="true"></i><i class="screw s4" aria-hidden="true"></i>
    <header class="tag"><b id="plate-title">LOG WIPE</b><span>server-lhr-02 · app + web logs</span></header>
    <div class="lift" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M7 12V2M3 6l4-4 4 4" /></svg>LIFT</div>
    <div class="well" id="well" data-mode="idle">
      <div class="ring" aria-hidden="true"></div>
      <div class="leds" id="leds" aria-hidden="true"></div>
      <div class="socket"><button class="red" id="red" type="button" tabindex="-1" aria-disabled="true">DELETE</button></div>
      <button class="cover" id="cover" type="button" aria-expanded="false" aria-controls="red" aria-label="Lift the safety cover"><span class="stripes"></span><span class="gleam"></span><span class="latch"></span></button>
      <span class="hinge" aria-hidden="true"></span>
      <span class="shock" id="shock" aria-hidden="true"></span>
    </div>
    <div class="lcd" id="lcd" aria-hidden="true"><span class="l" id="lcdL">STANDBY</span><span class="r" id="lcdR">2,846</span><small>entries</small></div>
    <p class="caption" id="cap">Lift the cover, then press the red button</p>
  </section>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  // ---------- Safety Cover: a guarded delete — lift the cover, press the button, watch the wipe ----------
  const $ = (id) => document.getElementById(id);
  const plate = $("plate"), well = $("well"), cover = $("cover"), red = $("red"), shock = $("shock");
  const lcd = $("lcd"), lcdL = $("lcdL"), lcdR = $("lcdR"), cap = $("cap"), status = $("status");
  const TOTAL = 2846, ARM_SECONDS = 8;

  // twelve LEDs round the well
  const leds = [];
  for (let i = 0; i < 12; i++) { const d = document.createElement("i"); d.style.setProperty("--i", i); $("leds").appendChild(d); leds.push(d); }

  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 300) : ms));
  const easeInOut = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
  const n = (v) => v.toLocaleString("en-US");
  function play(el, frames, opts) {
    if (calm() || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }
  function tween(ms, fn, ease) {
    ease = ease || ((t) => t);
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) {
        const t = Math.max(0, Math.min(1, (now - s) / ms));
        fn(ease(t));
        if (t < 1) requestAnimationFrame(f); else res();
      });
    });
  }
  function say(msg) { if (!demo.on) status.textContent = msg; }
  function thud() { plate.classList.remove("thud"); void plate.offsetWidth; plate.classList.add("thud"); }
  function setLcd(left, right, tone) { lcdL.textContent = left; if (right !== undefined) lcdR.textContent = right; lcd.className = "lcd" + (tone ? " t-" + tone : ""); }

  let state = "idle"; // idle | opening | armed | wiping | done
  let armTimer = 0, armLeft = 0;

  // ---------- Lift the cover ----------
  async function openCover() {
    if (state !== "idle") return;
    state = "opening";
    // anticipation: the latch catches for a moment
    await play(cover, [{ transform: "perspective(700px) rotateX(0deg)" }, { transform: "perspective(700px) rotateX(10deg)" }, { transform: "perspective(700px) rotateX(-2deg)" }, { transform: "perspective(700px) rotateX(4deg)" }], { duration: 200, easing: "ease-in-out" });
    cover.setAttribute("aria-expanded", "true");
    cover.setAttribute("aria-label", "Close the safety cover");
    red.tabIndex = 0;
    red.removeAttribute("aria-disabled");
    well.dataset.mode = "armed";
    setLcd("ARMED", undefined, "amber");
    cap.textContent = "Armed · press the red button, or Esc to close";
    say("Cover open. The delete button is armed for " + ARM_SECONDS + " seconds.");
    setTimeout(thud, 420);
    state = "armed";
    // the cover closes by itself if nothing happens
    armLeft = ARM_SECONDS;
    clearInterval(armTimer);
    lcdL.textContent = "ARMED " + armLeft + "s";
    armTimer = setInterval(() => {
      if (state !== "armed") { clearInterval(armTimer); return; }
      armLeft--;
      lcdL.textContent = "ARMED " + armLeft + "s";
      if (armLeft <= 0) { clearInterval(armTimer); closeCover("Cover closed. Nothing was deleted."); }
    }, 1000);
  }

  // ---------- Drop the cover back ----------
  async function closeCover(msg) {
    if (state !== "armed" && state !== "done") return;
    const wasArmed = state === "armed";
    clearInterval(armTimer);
    const hadFocus = document.activeElement === red;
    red.tabIndex = -1;
    red.setAttribute("aria-disabled", "true");
    cover.setAttribute("aria-expanded", "false");
    cover.setAttribute("aria-label", "Lift the safety cover");
    if (hadFocus) cover.focus();
    await wait(420);
    thud();
    play(cover, [{ transform: "perspective(700px) rotateX(0deg)" }, { transform: "perspective(700px) rotateX(7deg)" }, { transform: "perspective(700px) rotateX(0deg)" }], { duration: 280, easing: "ease-out" });
    if (wasArmed) {
      state = "idle";
      well.dataset.mode = "idle";
      setLcd("STANDBY", n(TOTAL), "");
      cap.textContent = "Lift the cover, then press the red button";
      if (msg) say(msg);
    }
  }

  // ---------- Press the red button: the wipe ----------
  async function fire() {
    if (state !== "armed") return;
    state = "wiping";
    clearInterval(armTimer);
    red.classList.add("down");
    well.dataset.mode = "wiping";
    lcd.className = "lcd t-red";
    if (!calm()) plate.classList.add("buzz");
    cap.textContent = "Wiping logs…";
    say("Deleting " + n(TOTAL) + " log entries.");
    await tween(1700, (t) => {
      const lit = Math.min(12, Math.floor(t * 12.999));
      leds.forEach((d, i) => d.classList.toggle("on", i < lit));
      lcdL.textContent = "WIPING " + Math.round(t * 100) + "%";
      lcdR.textContent = n(Math.round(TOTAL * (1 - t)));
    }, easeInOut);
    plate.classList.remove("buzz");
    red.classList.remove("down");
    // finish: everything goes green, a shock ring and sparks
    leds.forEach((d) => d.classList.remove("on"));
    well.dataset.mode = "clear";
    setLcd("CLEAR", "0", "");
    play(shock, [{ transform: "scale(.6)", opacity: 1 }, { transform: "scale(1.9)", opacity: 0 }], { duration: 700, easing: "cubic-bezier(.2,.7,.4,1)" });
    sparks();
    cap.textContent = "All " + n(TOTAL) + " entries deleted";
    say("Done. " + n(TOTAL) + " log entries deleted.");
    state = "done";
    await wait(900);
    await closeCover();
    await wait(1600);
    // reset: new logs trickle in again
    setLcd("LOGGING", "0", "amber");
    cap.textContent = "New logs are coming in…";
    well.dataset.mode = "idle";
    await tween(1200, (t) => { lcdR.textContent = n(Math.round(TOTAL * t)); }, easeInOut);
    setLcd("STANDBY", n(TOTAL), "");
    cap.textContent = "Lift the cover, then press the red button";
    state = "idle";
    if (demo.on) scheduleDemo(2600);
  }

  function sparks() {
    if (calm()) return;
    const r = $("red").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = ["#22e07a", "#a7f3d0", "#ffd166", "#ffffff"];
    for (let i = 0; i < 20; i++) {
      const b = document.createElement("span");
      b.className = "bit";
      b.style.left = cx + "px"; b.style.top = cy + "px";
      b.style.background = cols[i % 4];
      document.body.appendChild(b);
      const a = (i / 20) * Math.PI * 2, d = 80 + Math.random() * 40, deg = a * 180 / Math.PI + 90;
      b.animate([{ transform: "rotate(" + deg + "deg) translateY(-30px) scaleY(1)", opacity: 1 }, { transform: "rotate(" + deg + "deg) translateY(" + -d + "px) scaleY(.3)", opacity: 0 }], { duration: 520 + Math.random() * 200, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => b.remove();
    }
  }

  cover.addEventListener("click", () => { if (state === "idle") openCover(); else if (state === "armed") closeCover("Cover closed. Nothing was deleted."); });
  red.addEventListener("click", () => { if (red.getAttribute("aria-disabled") !== "true") fire(); });
  // a real press: the button goes down while the pointer is held
  red.addEventListener("pointerdown", () => { if (state === "armed") red.classList.add("down"); });
  red.addEventListener("pointerleave", () => { if (state === "armed") red.classList.remove("down"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state === "armed") closeCover("Cover closed. Nothing was deleted."); });

  // ---------- Auto-demo: plays on load and every few seconds until someone touches it ----------
  const demo = { on: true, timer: 0 };
  function stopDemo() { if (!demo.on) return; demo.on = false; clearTimeout(demo.timer); }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  function scheduleDemo(ms) { clearTimeout(demo.timer); if (demo.on) demo.timer = setTimeout(runDemo, ms); }
  async function runDemo() {
    if (!demo.on) return;
    if (state !== "idle") { scheduleDemo(1200); return; }
    await openCover();
    await wait(1100);
    if (!demo.on || state !== "armed") return;
    fire();
  }
  scheduleDemo(450);
</script>
</body>
</html>
