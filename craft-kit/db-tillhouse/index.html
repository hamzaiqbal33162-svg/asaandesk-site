<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-tillhouse:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Tillhouse look: warm linen, espresso sidebar, terracotta ---------- */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --bg: #f4eee6; --surface: #fffdf9; --surface2: #f2eadf; --ink: #2b231d; --muted: #7a6c60;
  --line: rgba(72, 48, 26, .12); --line-strong: rgba(72, 48, 26, .22);
  --accent: #c4532e; --accent-ink: #fff; --ok: #3d8758; --warn: #b97c0c; --err: #c23b30;
  --c1: #c4532e; --c2: #6b8f6d; --c3: #d29b33; --c4: #4f7399; --c5: #9a5e7e; --c6: #a8896a;
  --side: #2c241e; --side-ink: #f1e7da; --side-mut: #b3a291;
  --r: 18px; --r-sm: 11px; --r-btn: 12px;
  --shadow: 0 1px 0 rgba(72, 48, 26, .04), 0 14px 34px -20px rgba(72, 48, 26, .45);
  --overlay: rgba(32, 22, 14, .45); --tip-bg: #2c241e; --chip-on: #2c241e; --chip-on-ink: #fff7ee;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #17130f; --surface: #221c17; --surface2: #2d2620; --ink: #f3e9dc; --muted: #ad9d8d;
  --line: rgba(255, 235, 210, .09); --line-strong: rgba(255, 235, 210, .17);
  --accent: #e2714b; --accent-ink: #1d120b; --ok: #6cc08a; --warn: #e6b24a; --err: #f06c60;
  --c1: #e2714b; --c2: #8db790; --c3: #e8b85a; --c4: #7ea2c9; --c5: #c88bab; --c6: #c7a988;
  --side: #0f0c0a; --overlay: rgba(0, 0, 0, .6); --tip-bg: #3b3029; --chip-on: #f3e9dc; --chip-on-ink: #1d1611;
  --shadow: 0 16px 36px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; }
.skip:focus { left: 8px; }
.mut { color: var(--muted); font-size: 13px; }
.grow { flex: 1; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 22px; padding: 18px 14px; z-index: 50; }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px; }
.brand b { display: block; font-size: 18px; letter-spacing: -.01em; }
.brand small { color: var(--side-mut); font-size: 12px; }
.logo { width: 40px; height: 40px; flex: none; transition: transform .5s var(--spring); }
.brand:hover .logo { transform: rotate(-8deg) scale(1.05); }
.nav { position: relative; display: flex; flex-direction: column; gap: 3px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--side-mut); text-decoration: none; font-size: 14.5px; font-weight: 500; transition: color .25s, background-color .25s; }
.nav a:hover { color: var(--side-ink); background: rgba(255, 255, 255, .05); }
.nav a[aria-current="page"] { color: var(--accent-ink); background: transparent; }
.nav a .k-ic { width: 19px; height: 19px; }
.nav .k-marker { position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 12px; background: var(--accent); box-shadow: 0 10px 22px -10px var(--accent); transition: transform .5s var(--spring), height .3s var(--ease), opacity .2s; z-index: 0; }
.nav-n { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: #fff3e6; color: #8a3a1e; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.nav-n[hidden] { display: none; }
.side-foot { margin-top: auto; display: grid; gap: 12px; }
.till-pill { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08); }
.till-pill b, .side-me b { display: block; font-size: 13px; }
.till-pill small, .side-me small { color: var(--side-mut); font-size: 12px; }
.tp-dot { width: 10px; height: 10px; border-radius: 50%; background: #d06a5f; flex: none; }
.till-pill.on .tp-dot { background: #7fd39b; box-shadow: 0 0 0 0 rgba(127, 211, 155, .6); animation: pulse 2.2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(127, 211, 155, 0); } 100% { box-shadow: 0 0 0 0 rgba(127, 211, 155, 0); } }
.side-me { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 26px; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; }
.shop-sw .k-seg { background: var(--surface2); }
.search-btn { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; min-width: 240px; transition: border-color .2s; }
.search-btn:hover { border-color: var(--line-strong); }
.search-btn kbd { margin-left: auto; font: 600 11px var(--font); padding: 2px 6px; border-radius: 6px; background: var(--surface2); }
.me .k-av { width: 38px; height: 38px; }
#view { padding: 24px 26px 48px; min-width: 0; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.ph h1 { margin: 0; font-size: 27px; letter-spacing: -.02em; }
.ph p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; transition: transform .3s var(--ease), box-shadow .3s, border-color .3s; min-width: 0; }
.card:hover { box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { display: flex; gap: 14px; align-items: flex-start; }
.kpi:hover { transform: translateY(-3px); }
.kpi-i { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--t); background: color-mix(in srgb, var(--t) 15%, transparent); }
.kpi-i .k-ic { width: 21px; height: 21px; }
.kpi-b { min-width: 0; }
.kpi-b span { display: block; color: var(--muted); font-size: 13px; }
.kpi-b b { display: block; font-size: 24px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 2px 0; white-space: nowrap; }
.kpi-b small { color: var(--muted); font-size: 12px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .06em; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse2 1.6s infinite; }
@keyframes pulse2 { 50% { opacity: .3; } }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid-r { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.span2 { grid-column: span 2; }
.k-input.sel { width: auto; min-height: 40px; padding: 6px 12px; }
.k-in { animation-name: thIn; }
@keyframes thIn { from { opacity: 0; transform: translateY(16px) scale(.985); } }

/* ---------- Register ---------- */
.reg { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.reg-tools { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.reg-q { max-width: none; position: relative; overflow: hidden; min-height: 46px; }
.scanline { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); opacity: 0; }
.reg-q.scanning .scanline { animation: scan .5s ease-in-out 2 alternate; }
@keyframes scan { from { top: 0; opacity: 1; } to { top: 100%; opacity: 1; } }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; text-align: left; gap: 7px; padding: 9px 9px 11px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); transition: transform .3s var(--spring), box-shadow .25s, border-color .25s; animation: tileIn .45s var(--ease) backwards; animation-delay: calc(var(--i) * 22ms); }
@keyframes tileIn { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.tile:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--t) 45%, var(--line)); }
.tile:active { transform: scale(.96); transition-duration: .1s; }
.tile[disabled] { opacity: .5; cursor: not-allowed; filter: grayscale(.7); transform: none; box-shadow: none; }
.tile-art { display: grid; place-items: center; height: 94px; border-radius: 12px; background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--t) 10%, var(--surface)), color-mix(in srgb, var(--t) 22%, var(--surface))); }
.art { width: 60px; height: 60px; color: var(--t); transition: transform .45s var(--spring); }
.art .hi { fill: #fff; opacity: .32; }
.art .hs { fill: none; stroke: #fff; stroke-width: 2; opacity: .4; stroke-linecap: round; }
.tile:hover .art { transform: scale(1.1) rotate(-4deg); }
.tile-n { font-size: 13.5px; font-weight: 600; line-height: 1.25; min-height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile-f { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tile-f b { font-size: 14px; font-variant-numeric: tabular-nums; }
.tile-f small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.tile-f small.low { color: var(--warn); font-weight: 600; }
.empty-g { grid-column: 1 / -1; text-align: center; color: var(--muted); }
.flyer { position: fixed; z-index: 150; pointer-events: none; color: var(--t); margin: 0; }
.cart { position: sticky; top: 86px; display: flex; flex-direction: column; padding: 0; max-height: calc(100vh - 106px); overflow: hidden; }
.cart.bump { animation: bump .45s var(--spring); }
@keyframes bump { 40% { transform: scale(1.015); } }
.cart-h { display: flex; justify-content: space-between; align-items: center; padding: 15px 16px 13px 18px; border-bottom: 1px solid var(--line); }
.cart-h b { display: block; font-size: 16px; }
.cart-h small { color: var(--muted); font-size: 12px; }
.mchip { display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 6px 8px 10px; border-radius: 13px; background: color-mix(in srgb, var(--c3) 16%, transparent); animation: tileIn .4s var(--spring); }
.mchip > div { flex: 1; min-width: 0; }
.mchip b { display: block; font-size: 13.5px; }
.mchip small { color: var(--muted); font-size: 12px; }
.cart-l { list-style: none; margin: 0; padding: 6px 8px; overflow: auto; flex: 1; min-height: 120px; }
.cl { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "i t" "q r"; gap: 6px 10px; padding: 10px; border-radius: 12px; align-items: center; }
.cl:hover { background: var(--surface2); }
.cl.fresh { animation: clIn .5s var(--spring); }
@keyframes clIn { from { opacity: 0; transform: translateX(16px) scale(.97); background: color-mix(in srgb, var(--accent) 18%, transparent); } }
.cl-i { grid-area: i; min-width: 0; }
.cl-n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-p { color: var(--muted); font-size: 12.5px; }
.cl-t { grid-area: t; font-variant-numeric: tabular-nums; }
.qty { grid-area: q; display: inline-flex; align-items: center; width: max-content; border: 1px solid var(--line-strong); border-radius: 999px; }
.qty button { width: 30px; height: 30px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; transition: background-color .15s, transform .1s; }
.qty button:hover { background: var(--surface2); } .qty button:active { transform: scale(.85); }
.qty .k-ic { width: 15px; height: 15px; }
.qty span { min-width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.cl-rm { grid-area: r; justify-self: end; border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.cl-rm:hover { color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); }
.cart-empty { display: grid; justify-items: center; text-align: center; color: var(--muted); padding: 18px 16px; font-size: 14px; }
.bag-art { width: 120px; }
.bag-art .sh { fill: var(--line); }
.bag-art .b1 { fill: color-mix(in srgb, var(--accent) 22%, var(--surface)); animation: float 3s ease-in-out infinite; }
.bag-art .b2 { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; fill: none; }
@keyframes float { 50% { transform: translateY(-3px); } }
.cart-t { padding: 12px 18px; border-top: 1px dashed var(--line-strong); display: grid; gap: 5px; font-size: 14px; }
.cart-t > div { display: flex; justify-content: space-between; gap: 10px; }
.cart-t .dl { color: var(--ok); }
.cart-t .tot { font-size: 23px; font-weight: 750; letter-spacing: -.02em; padding-top: 5px; font-variant-numeric: tabular-nums; }
.cart-b { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 10px; }
.cart .charge { width: auto; margin: 0 16px 16px; min-height: 56px; font-size: 17px; border-radius: 15px; box-shadow: 0 14px 26px -14px var(--accent); }
.cart-fab { display: none; }

/* ---------- The cash drawer (signature) ---------- */
.till { --w: 300px; width: var(--w); max-width: 100%; margin: 0 auto; }
.till-body { position: relative; height: 70px; border-radius: 16px 16px 6px 6px; background: linear-gradient(180deg, #54453a, #2d241e); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .14), 0 10px 24px -12px rgba(0, 0, 0, .6); }
.till-scr { position: absolute; right: 14px; top: 13px; padding: 5px 10px; border-radius: 7px; background: linear-gradient(180deg, #c9ead2, #9fd2b0); color: #12361f; font: 700 13px ui-monospace, Menlo, monospace; letter-spacing: .04em; }
.till-cap { position: absolute; left: 16px; top: 18px; color: #ffe6c7; font-weight: 700; font-size: 15px; }
.till-key { position: absolute; left: 16px; bottom: 12px; width: 26px; height: 6px; border-radius: 3px; background: #c9a46a; opacity: .7; }
.till-tray { height: 0; overflow: hidden; background: #1a1411; transition: height .6s var(--spring); perspective: 500px; }
.till.open .till-tray { height: 118px; }
.tray-in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 8px; height: 118px; transform: rotateX(28deg); transform-origin: top; }
.slot { position: relative; border-radius: 5px; background: #2b221c; box-shadow: inset 0 2px 5px rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; overflow: hidden; }
.slot-l { position: absolute; top: 3px; left: 0; right: 0; text-align: center; color: #c9b8a6; font: 700 9px ui-monospace, monospace; z-index: 2; }
.note { position: absolute; left: 12%; right: 12%; bottom: 6px; height: 64%; border-radius: 3px; background: linear-gradient(160deg, color-mix(in srgb, var(--nc) 80%, #fff), var(--nc)); box-shadow: 0 -1px 0 rgba(0, 0, 0, .25), inset 0 0 0 2px rgba(255, 255, 255, .18); transform: translateY(calc(var(--k) * -4px)) rotate(calc(var(--k) * 1.3deg - 3deg)); }
.till.open .note { animation: noteIn .7s var(--spring) backwards; animation-delay: calc(.15s + var(--k) * 45ms); }
@keyframes noteIn { from { transform: translateY(40px); } }
.coins { grid-column: 1 / -1; display: none; }
.till-front { height: 40px; border-radius: 6px 6px 14px 14px; background: linear-gradient(180deg, #634f40, #3c3028); display: grid; place-items: center; box-shadow: 0 14px 24px -14px rgba(0, 0, 0, .7); }
.till-front i { width: 34%; height: 9px; border-radius: 6px; background: linear-gradient(180deg, #e2c08a, #a9834a); box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.till.mini { --w: auto; position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 5; transform: translateY(140%); transition: transform .45s var(--spring); filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .35)); }
.till.mini.show { transform: none; }
.till.big { --w: 360px; }
.till.big .till-body { height: 96px; }
.till.big.open .till-tray, .till.big .tray-in { height: 150px; }
.till.big .till-tray { height: 0; }
.till.big.open .till-tray { height: 150px; }
.till.big .coins { display: flex; gap: 6px; }
.cup { flex: 1; height: 22px; border-radius: 0 0 9px 9px; background: #2b221c; position: relative; overflow: hidden; }
.cup i { position: absolute; bottom: calc(var(--k) * 4px + 2px); left: calc(18% + var(--k) * 12%); width: 14px; height: 6px; border-radius: 50%; background: linear-gradient(180deg, #f0d48a, #b7913d); }
.till.big .tray-in { grid-template-rows: 1fr auto; }

/* ---------- Tables and badges ---------- */
.thumb { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--t) 18%, var(--surface)); }
.thumb .art { width: 30px; height: 30px; }
.thumb.sm { width: 36px; height: 36px; }

}

<script>
/* =========================================================
   Core kit: helpers, router, charts, modals, tables, till.
   Plain JS, no libraries. The app code below builds on it.
   ========================================================= */
"use strict";

/* ---------- 1. Tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a, f) => a.reduce((s, x) => s + (+(f ? f(x) : x) || 0), 0);
const uid = (p) => (p || "") + Math.random().toString(36).slice(2, 7).toUpperCase();
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
/* run fn(t) from 0 to 1 over ms, then stop (no endless loops) */
function tween(ms, fn, done) {

  const t0 = performance.now();
  const f = (t) => { const p = Math.min(1, (t - t0) / ms); fn(easeOut(p)); if (p < 1) requestAnimationFrame(f); else if (done) done(); };
  requestAnimationFrame(f);
}

/* ---------- 2. Seeded random data ---------- */
let _seed = 1;
const seed = (s) => { _seed = s; };
function rand() { _seed |= 0; _seed = (_seed + 0x6d2b79f5) | 0; let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rnd = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (a) => a[Math.floor(rand() * a.length)];
const chance = (p) => rand() < p;
const FIRST = ["Ayesha", "Bilal", "Hira", "Usman", "Sana", "Hamza", "Zara", "Fahad", "Mahnoor", "Ali", "Iqra", "Saad", "Noor", "Hassan", "Maryam", "Omer", "Fatima", "Danish", "Aliza", "Taimur", "Rabia", "Faraz", "Komal", "Junaid", "Areeba", "Kashif", "Mehwish", "Yasir", "Sadia", "Shahzad", "Anum", "Waqas", "Laiba", "Adeel", "Hania", "Zain"];
const LAST = ["Khan", "Malik", "Qureshi", "Siddiqui", "Sheikh", "Butt", "Chaudhry", "Raza", "Mirza", "Javed", "Akhtar", "Hussain", "Baig", "Rana", "Abbasi", "Zaidi", "Iqbal", "Anwar", "Naqvi", "Hashmi"];
const CITIES = ["Lahore", "Karachi", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Hyderabad", "Gujranwala", "Abbottabad"];
const person = () => pick(FIRST) + " " + pick(LAST);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + String(ri(1000000, 9999999));
const emailOf = (n) => n.toLowerCase().replace(/[^a-z]+/g, ".").replace(/^\.|\.$/g, "") + ri(1, 99) + "@mail.example";

/* ---------- 3. Numbers, money and dates ---------- */
const CUR = { sym: "Rs ", dec: 0 };
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n, d) => ((+n || 0) < 0 ? "-" : "") + CUR.sym + num(Math.abs(+n || 0), d == null ? CUR.dec : d);
function short(n) {
  n = +n || 0; const a = Math.abs(n), s = n < 0 ? "-" : "";
  const f = (v, u) => s + (v >= 100 ? Math.round(v) : v.toFixed(1).replace(/\.0$/, "")) + u;
  if (a >= 1e9) return f(a / 1e9, "B"); if (a >= 1e6) return f(a / 1e6, "M"); if (a >= 1e3) return f(a / 1e3, "K");
  return s + (a % 1 ? a.toFixed(1) : a);
}
const moneyS = (n) => ((+n || 0) < 0 ? "-" : "") + CUR.sym + short(Math.abs(+n || 0));
const pct = (n, d = 1) => ((+n || 0) * 100).toFixed(d) + "%";
const FMT = { money: (n) => money(n), moneyS, short, int: (n) => num(n), pct: (n) => pct(n), pct0: (n) => pct(n, 0), dec1: (n) => num(n, 1) };
const roundCur = (n) => (CUR.dec ? Math.round(n * 100) / 100 : Math.round(n));
const DAY = 864e5;
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const p2 = (n) => String(n).padStart(2, "0");
const fmtDate = (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()]; };
const fmtDateY = (t) => fmtDate(t) + " " + new Date(t).getFullYear();
const fmtTime = (t) => { const d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const fmtDT = (t) => fmtDate(t) + ", " + fmtTime(t);
const isoDate = (t) => { const d = new Date(t); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
function ago(t) {
  const m = Math.round((Date.now() - t) / 6e4);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago"; return Math.round(h / 24) + " d ago";
}
/* A daily series (oldest to newest, last = today) with weekly rhythm, growth, season and noise */
function series(days, base, o = {}) {
  const out = [], t0 = today0(), wk = o.week || [0.8, 0.85, 0.9, 0.95, 1.05, 1.35, 1.3];
  for (let i = 0; i < days; i++) {
    const d = new Date(t0 - (days - 1 - i) * DAY);
    const v = base * wk[d.getDay()] * (1 + (o.growth == null ? 0.3 : o.growth) * (i / days)) * (1 + (o.season || 0.12) * Math.sin(((d.getMonth() + (o.phase || 0)) / 12) * Math.PI * 2)) * rnd(1 - (o.noise || 0.18), 1 + (o.noise || 0.18));
    out.push(Math.max(0, Math.round(v)));
  }
  return out;
}
/* Cut a daily series into a range: 7D / 14D / 30D / 90D daily, 12M monthly */
function byRange(arr, r) {
  const n = arr.length, t0 = today0();

  return `<div class="k-receipt"><div class="k-rch"><b>${esc(shop.name)}</b><span>${esc(shop.addr || "")}</span><span>${fmtDT(s.t)} · ${esc(s.id)}</span>${s.staff ? `<span>Served by ${esc(s.staff)}</span>` : ""}</div><div class="k-rcl">${s.lines.map((l) => row(`${l.qty} × ${esc(l.name)}`, money(l.price * l.qty))).join("")}</div><div class="k-rct">${row("Subtotal", money(s.sub))}${s.disc ? row("Discount" + (s.discLabel ? " · " + esc(s.discLabel) : ""), "-" + money(s.disc)) : ""}${s.mem ? row("Member saving", "-" + money(s.mem)) : ""}${s.tax ? row("Tax", money(s.tax)) : ""}${row("Total", money(s.total), "tot")}${row(esc(s.method) + (s.ref ? " · " + esc(s.ref) : ""), money(s.tendered))}${s.change ? row("Change", money(s.change)) : ""}${s.member ? row("Member", esc(s.member)) : ""}</div>${barcode(s.id)}<p class="k-rcf">${esc(shop.foot || "Thank you, see you again soon")}</p>${s.status === "Refunded" ? `<p class="k-rcref">REFUNDED</p>` : ""}</div>`;
}
function showReceipt(s, shop, extraFoot) {
  const L = openModal({ title: "Receipt " + esc(s.id), cls: "k-recm", body: receiptHTML(s, shop), foot: `${extraFoot || ""}<span class="sp"></span><button type="button" class="btn ghost" data-rmail>${ic("mail")} Email</button><button type="button" class="btn primary" data-rprint>${ic("print")} Print</button>` });
  $("[data-rprint]", L.box).addEventListener("click", printNow);
  $("[data-rmail]", L.box).addEventListener("click", () => toast("Receipt " + s.id + " sent to the customer's email"));
  return L;
}
function printNow() { document.body.classList.add("k-printing"); try { window.print(); } catch (e) { /* ignore */ } setTimeout(() => document.body.classList.remove("k-printing"), 600); }

const artSVG = (k) => `<svg class="art" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">${ART[k] || ART.vase}</svg>`;
const NOTE_COL = { 5000: "#c79b3b", 1000: "#4d73a8", 500: "#3f8d5c", 100: "#b9473c", 50: "#7b5ea0", 20: "#d07a35", 10: "#4f9a8a" };

/* ---------- 2. State and helpers ---------- */
let S;
const save = () => Store.save(S);
const zeros = () => new Array(D).fill(0);
const dayIdx = (t) => D - 1 - Math.round((today0() - new Date(t).setHours(0, 0, 0, 0)) / DAY);
const prod = (id) => S.products.find((p) => p.id === id);
const memb = (id) => S.members.find((m) => m.id === id);
const shopName = (i = S.shop) => S.cfg.shops[i].name;
const catIdx = (name) => Math.max(0, CATS.indexOf(name));
const tierOf = (sp) => (sp >= 120000 ? "Gold" : sp >= 45000 ? "Silver" : "Bronze");
const tierKind = (t) => (t === "Gold" ? "warn" : t === "Silver" ? "info" : "");
const memberPct = (m) => (!m ? 0 : m.tier === "Gold" ? S.cfg.gold : m.tier === "Silver" ? S.cfg.silver : 0);
const me = () => (S.staff.find((s) => s.shop === S.shop && s.role !== "Stock") || { name: "Staff" }).name;
const shopInfo = (i) => ({ name: S.cfg.store + " · " + S.cfg.shops[i].name, addr: S.cfg.shops[i].addr, foot: S.cfg.foot });
const expected = (sh) => sh.float + sh.cash - sh.refunds + sh.paidIn - sh.paidOut;
const rcp = (x) => { const m = memb(x.member); return Object.assign({}, x, { member: m ? `${m.name} · ${m.tier} · ${num(m.points)} pts` : "" }); };

/* add or remove one receipt from the daily report arrays */
function addDaily(tx, sign) {
  const i = dayIdx(tx.t); if (i < 0 || i >= D) return;
  const f = tx.sub ? tx.total / tx.sub : 1;
  S.d.rev[tx.shop][i] += sign * tx.total; S.d.cnt[tx.shop][i] += sign;
  S.d.pay[Math.max(0, METHODS.indexOf(tx.method))][i] += sign * tx.total;
  tx.lines.forEach((l) => { S.d.cat[l.cat][i] += sign * Math.round(l.price * l.qty * f); const p = prod(l.id); S.d.cogs[i] += sign * l.qty * (p ? p.cost : l.price * 0.5); });
}
function pickProduct(shop) {
  const list = shop == null ? S.products : S.products.filter((p) => p.stock[shop] > 0);
  if (!list.length) return null;
  const a = pick(list), b = pick(list);
  return chance(0.6) ? (a.price < b.price ? a : b) : a;
}
/* a believable receipt: 1-3 lines, sometimes a member or a discount */
function fakeTx(shop, t, live) {
  const lines = [], nl = pick([1, 1, 1, 2, 2, 3]);
  for (let i = 0; i < nl; i++) {
    const p = pickProduct(live ? shop : null); if (!p) break;
    const ex = lines.find((l) => l.id === p.id);
    if (ex) ex.qty++; else lines.push({ id: p.id, name: p.name, price: p.price, qty: chance(0.18) ? 2 : 1, cat: catIdx(p.cat) });
  }
  if (!lines.length) return null;
  const sub = sum(lines, (l) => l.price * l.qty), m = chance(0.35) ? pick(S.members) : null;
  const disc = chance(0.08) ? Math.round(sub * 0.1) : 0, mem = m ? Math.round(((sub - disc) * memberPct(m)) / 100) : 0, total = sub - disc - mem;
  const r = rand(), method = r < 0.46 ? "Cash" : r < 0.86 ? "Card" : "Wallet";
  const tendered = method === "Cash" ? (chance(0.3) ? total : ceilTo(total, pick([500, 1000, 5000]))) : total;
  const staff = S.staff.filter((s) => s.shop === shop && s.role !== "Stock");
  return { id: "", t, shop, lines, sub, disc, discLabel: disc ? "10% off" : "", mem, tax: 0, total, method, tendered, change: tendered - total, ref: method === "Card" ? "Auth " + ri(100000, 999999) : method === "Wallet" ? "Ref " + ri(10000000, 99999999) : "", member: m ? m.id : null, staff: pick(staff).name, status: "Paid" };
}
function seedData() {
  seed(4417);
  const t0 = today0(), now = Date.now();
  S = {
    shop: 0, seq: 10000, tx: [], shifts: [], transfers: [],
    cfg: { store: "Tillhouse", shops: [{ name: "Gulberg", addr: "Main Boulevard, Gulberg III, Lahore" }, { name: "Clifton", addr: "Block 5, Clifton, Karachi" }], tax: 0, silver: 5, gold: 10, ppr: 1, foot: "Exchanges within 14 days with this receipt", codes: { WELCOME10: { type: "pct", v: 10 }, HOME500: { type: "amt", v: 500 } } },
    staff: [["Sana Malik", "Manager", 0], ["Bilal Raza", "Cashier", 0], ["Hira Qureshi", "Stock", 0], ["Omer Butt", "Manager", 1], ["Mahnoor Sheikh", "Cashier", 1], ["Fahad Javed", "Stock", 1]].map(([name, role, shop]) => ({ name, role, shop })),
    products: CATALOG.map((c, i) => ({ id: "P" + p2(i + 1), sku: "TH-" + (1001 + i), name: c[0], cat: CATS[c[1]], price: c[2], cost: Math.round((c[2] * rnd(0.42, 0.58)) / 10) * 10, art: c[3], reorder: 4, stock: [0, 1].map(() => (chance(0.14) ? ri(0, 3) : ri(6, 28))) })),
    members: [],
    d: { rev: [zeros(), zeros()], cnt: [zeros(), zeros()], cat: CATS.map(() => zeros()), pay: METHODS.map(() => zeros()), cogs: zeros() }
  };
  for (let i = 0; i < 42; i++) {
    const name = person(), spend = Math.round(rnd(4000, 230000) / 10) * 10;
    S.members.push({ id: "M" + (1001 + i), name, phone: phone(), email: emailOf(name), shop: ri(0, 1), spend, visits: Math.max(1, Math.round(spend / rnd(3500, 6500))), points: Math.round((spend / 100) * rnd(0.3, 1)), joined: t0 - ri(20, 900) * DAY, last: t0 - ri(0, 60) * DAY, tier: tierOf(spend) });
  }
  /* itemised receipts for the last 30 days */
  const wk = [0.8, 0.85, 0.9, 0.95, 1.05, 1.35, 1.3];
  for (let k = 29; k >= 0; k--) for (let sh = 0; sh < 2; sh++) {
    const day = t0 - k * DAY, n = Math.round((sh ? 10 : 13) * wk[new Date(day).getDay()] * rnd(0.8, 1.2));
    for (let j = 0; j < n; j++) {
      let t = day + (10 + Math.pow(rand(), 0.85) * 11.5) * 36e5;
      if (k === 0) t = Math.max(day + 6e4, now - rand() * 8 * 36e5);
      if (t > now) continue;
      const tx = fakeTx(sh, Math.round(t)); if (tx) S.tx.push(tx);
    }
  }
  S.tx.sort((a, b) => a.t - b.t).forEach((x) => { x.id = "TH-" + ++S.seq; if (x.t < t0 && chance(0.02)) x.status = "Refunded"; });
  S.tx.reverse();
  S.tx.forEach((x) => { if (x.status === "Paid") addDaily(x, 1); });
  /* older days: same rhythm, scaled from the itemised month */
  const tot30 = (arr) => sum(arr.slice(D - 30, D - 1)) / 29;
  const cnt30 = sum([0, 1], (s) => sum(S.d.cnt[s].slice(D - 30, D - 1))), rev30 = sum([0, 1], (s) => sum(S.d.rev[s].slice(D - 30, D - 1)));
  const basket = cnt30 ? rev30 / cnt30 : 4000, catW = S.d.cat.map((a) => sum(a.slice(D - 30))), payW = S.d.pay.map((a) => sum(a.slice(D - 30)));
  const cw = sum(catW) || 1, pw = sum(payW) || 1, cogsR = sum(S.d.cogs.slice(D - 30)) / (sum(catW) || 1);
  [0, 1].forEach((sh) => {
    const gen = series(D, tot30(S.d.rev[sh]) / 1.3, { growth: 0.3, season: 0.14, phase: sh * 2 });
    for (let i = 0; i < D - 30; i++) { S.d.rev[sh][i] = gen[i]; S.d.cnt[sh][i] = Math.max(1, Math.round(gen[i] / basket)); }
  });
  for (let i = 0; i < D - 30; i++) {
    const tot = S.d.rev[0][i] + S.d.rev[1][i];
    CATS.forEach((_, c) => (S.d.cat[c][i] = Math.round(((tot * catW[c]) / cw) * rnd(0.85, 1.15))));
    METHODS.forEach((_, m) => (S.d.pay[m][i] = Math.round(((tot * payW[m]) / pw) * rnd(0.9, 1.1))));
    S.d.cogs[i] = Math.round(tot * cogsR);
  }
  /* the open shifts and the shift history */
  S.shift = [0, 1].map((sh) => {
    const firstToday = S.tx.filter((x) => x.shop === sh && x.t >= t0).map((x) => x.t);
    const at = Math.min(now - 6e4, (firstToday.length ? Math.min(...firstToday) : now) - 15 * 6e4);
    const cashTx = S.tx.filter((x) => x.shop === sh && x.t >= at && x.method === "Cash" && x.status === "Paid");
    const log = cashTx.slice(0, 10).map((x) => ({ t: x.t, kind: "Cash sale", amt: x.total, note: x.id }));
    if (!sh) log.push({ t: Math.round(at + (now - at) * 0.4), kind: "Paid out", amt: -600, note: "Courier fee" });
    log.push({ t: at, kind: "Shift opened", amt: sh ? 8000 : 10000, note: "Opening float" });
    return { open: true, at, by: S.staff.find((s) => s.shop === sh).name, float: sh ? 8000 : 10000, cash: sum(cashTx, (x) => x.total), refunds: 0, paidIn: 0, paidOut: sh ? 0 : 600, log: log.sort((a, b) => b.t - a.t) };
  });
  for (let k = 1; k <= 12; k++) [0, 1].forEach((sh) => {
    const day = t0 - k * DAY, cash = sum(S.tx.filter((x) => x.shop === sh && x.t >= day && x.t < day + DAY && x.method === "Cash" && x.status === "Paid"), (x) => x.total);
    const fl = sh ? 8000 : 10000, exp = fl + cash, v = pick([0, 0, 0, 0, 0, -100, 50, -500, 20, -50]);
    S.shifts.push({ id: "SH-" + (900 - k * 2 - sh), shop: sh, date: day + 21.5 * 36e5, by: pick(S.staff.filter((s) => s.shop === sh && s.role !== "Stock")).name, float: fl, expected: exp, counted: exp + v, variance: v, note: v ? "Checked twice" : "" });
  });
  S.transfers = [0, 1, 2, 3].map((k) => { const p = pick(S.products), from = k % 2; return { id: "TR-" + (210 + k), t: t0 - (k * 3 + 1) * DAY + 13 * 36e5, pid: p.id, name: p.name, qty: ri(2, 6), from, to: 1 - from, by: k % 2 ? "Fahad Javed" : "Hira Qureshi" }; });
  return S;
}

/* ---------- 3. Recording sales (till and live feed) ---------- */
function recordSale(tx) {
  S.tx.unshift(tx); addDaily(tx, 1);
  tx.lines.forEach((l) => {
    const p = prod(l.id); if (!p) return;
    p.stock[tx.shop] = Math.max(0, p.stock[tx.shop] - l.qty);
    if (p.stock[tx.shop] <= p.reorder) Notes.add(`${p.name} is running low at ${shopName(tx.shop)} (${p.stock[tx.shop]} left)`, "warn");
  });
  const m = memb(tx.member);
  if (m) { const was = m.tier; m.spend += tx.total; m.visits++; m.last = tx.t; m.points += Math.floor((tx.total / 100) * S.cfg.ppr); m.tier = tierOf(m.spend); if (m.tier !== was) Notes.add(`${m.name} moved up to ${m.tier}`, "ok"); }
  const sh = S.shift[tx.shop];
  if (tx.method === "Cash" && sh.open) { sh.cash += tx.total; sh.log.unshift({ t: tx.t, kind: "Cash sale", amt: tx.total, note: tx.id }); }
  save();
}
/* the other shop keeps selling while you watch */
function simulateSale() {
  const shop = chance(0.75) ? 1 - S.shop : S.shop;
  if (!S.shift[shop].open) return null;
  const tx = fakeTx(shop, Date.now(), true); if (!tx) return null;
  tx.id = "TH-" + ++S.seq; recordSale(tx);
  if (tx.total > 12000) Notes.add(`Big sale at ${shopName(shop)}: ${money(tx.total)}`, "ok");
  return tx;
}
function completeSale(pay) {
  const m = memb(Cart.member), t = Cart.totals(S.cfg.tax, memberPct(m));
  const tx = { id: "TH-" + ++S.seq, t: Date.now(), shop: S.shop, lines: Cart.lines.map((l) => ({ id: l.id, name: l.name, price: l.price, qty: l.qty, cat: catIdx((prod(l.id) || {}).cat) })), sub: t.sub, disc: t.disc, discLabel: Cart.disc ? Cart.disc.label : "", mem: t.mem, tax: t.tax, total: t.total, method: pay.method, tendered: pay.tendered, change: pay.change, ref: pay.ref, member: Cart.member, staff: me(), status: "Paid" };
  recordSale(tx); Cart.clear(); drawGrid();
  const nx = $(".cart-h small"); if (nx) nx.textContent = "Next receipt TH-" + (S.seq + 1);
  toast(`Sale ${tx.id} done · ${money(tx.total)}`);
  const after = () => showReceipt(rcp(tx), shopInfo(tx.shop), `<button type="button" class="btn" data-close>${ic("plus")} New sale</button>`);
  if (pay.method === "Cash") popDrawer(pay.change, after); else after();
}
function refund(x, after) {
  confirmBox(`Refund ${x.id} for ${money(x.total)}? The items go back on the ${shopName(x.shop)} shelf.`, () => {
    x.status = "Refunded"; addDaily(x, -1);
    x.lines.forEach((l) => { const p = prod(l.id); if (p) p.stock[x.shop] += l.qty; });
    const m = memb(x.member); if (m) { m.spend = Math.max(0, m.spend - x.total); m.points = Math.max(0, m.points - Math.floor((x.total / 100) * S.cfg.ppr)); m.tier = tierOf(m.spend); }
    const sh = S.shift[x.shop]; if (x.method === "Cash" && sh.open) { sh.refunds += x.total; sh.log.unshift({ t: Date.now(), kind: "Refund", amt: -x.total, note: x.id }); }
    save(); toast(`${x.id} refunded · ${money(x.total)}`); Notes.add(`Refund ${x.id} at ${shopName(x.shop)}: ${money(x.total)}`, "warn");
    if (after) after();
  }, { yes: "Refund", title: "Refund this sale?" });
}

/* ---------- 4. Shared bits of markup ---------- */
const head = (title, sub, actions = "") => `<div class="ph" data-in><div><h1>${title}</h1><p>${sub}</p></div><div class="ph-act">${actions}</div></div>`;
const kpi = (label, value, fmt, extra, icon, tint, id) => `<div class="card kpi" style="--t:var(--c${tint})"><div class="kpi-i">${ic(icon)}</div><div class="kpi-b"><span>${label}</span><b data-count="${value}" data-fmt="${fmt}"${id ? ` id="${id}"` : ""}>${FMT[fmt](value)}</b>${extra || ""}</div></div>`;
/* the cash drawer: notes stacked by value, coins in cups. mode "mini" pops up in the cart, "big" sits on the drawer page */
function tillHTML(mode, amount) {
  const den = [5000, 1000, 500, 100, 50];
  let rest = amount == null ? 18000 : Math.max(0, amount);
  const counts = den.map((d) => { const n = Math.floor(rest / d); rest -= n * d; return clamp(n, 1, 6); });
  return `<div class="till ${mode}" aria-hidden="true"><div class="till-body"><span class="till-scr">${mode === "big" ? esc(money(amount || 0)) : "TILL"}</span><span class="till-cap"></span><i class="till-key"></i></div><div class="till-tray"><div class="tray-in">${den.map((d, i) => `<div class="slot"><span class="slot-l">${d}</span>${Array.from({ length: counts[i] }, (_, k) => `<i class="note" style="--nc:${NOTE_COL[d]};--k:${k}"></i>`).join("")}</div>`).join("")}<div class="coins">${[0, 1, 2, 3].map((c) => `<span class="cup">${[0, 1, 2].map((k) => `<i style="--k:${k};--c:${c}"></i>`).join("")}</span>`).join("")}</div></div></div><div class="till-front"><i></i></div></div>`;
}
const emptyBag = () => `<svg class="bag-art" viewBox="0 0 120 90" aria-hidden="true"><ellipse cx="60" cy="82" rx="38" ry="5" class="sh"/><path d="M30 30h60l-6 48H36z" class="b1"/><path d="M45 30v-6a15 15 0 0 1 30 0v6" fill="none" class="b2"/><path d="M52 50h16" class="b2"/></svg>`;

Router.add("register", "Register", (v) => {

    <div class="reg-tools" data-in><label class="k-search reg-q">${ic("search")}<span class="sr">Find a product</span><input id="regQ" type="search" autocomplete="off" placeholder="Search name or SKU, Enter adds" value="${esc(regQ)}"><i class="scanline" aria-hidden="true"></i></label><div class="k-chips" role="group" aria-label="Category">${["All"].concat(CATS).map((c) => `<button type="button" class="k-chip" data-rc="${c}" aria-pressed="${c === regCat}">${c}</button>`).join("")}</div></div>
    <div class="pgrid" id="pgrid"></div></section>

  });
  $(".reg-tools .k-chips", v).addEventListener("click", (e) => { const b = e.target.closest("[data-rc]"); if (!b) return; regCat = b.dataset.rc; $$("[data-rc]", v).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); drawGrid(); });

function drawGrid() {
  const g = $("#pgrid"); if (!g) return;

  g.innerHTML = items.length ? items.map((p, i) => { const st = p.stock[S.shop]; return `<button type="button" class="tile" data-add="${p.id}" style="--t:var(--c${catIdx(p.cat) + 1});--i:${Math.min(i, 18)}"${st <= 0 ? " disabled" : ""} aria-label="${esc(p.name)}, ${money(p.price)}, ${st} in stock"><span class="tile-art">${artSVG(p.art)}</span><span class="tile-n">${esc(p.name)}</span><span class="tile-f"><b>${money(p.price)}</b><small class="${st <= p.reorder ? "low" : ""}">${st <= 0 ? "Sold out" : st + " left"}</small></span></button>`; }).join("")
    : `<div class="card empty-g"><p>No products match “${esc(regQ)}”.</p><button type="button" class="btn sm" data-act="clearSearch">Clear search</button></div>`;
}
function drawCart(d) {

  L.innerHTML = Cart.lines.length ? Cart.lines.map((l) => `<li class="cl${l.id === added ? " fresh" : ""}"><div class="cl-i"><div class="cl-n">${esc(l.name)}</div><div class="cl-p">${money(l.price)} each</div></div><b class="cl-t">${money(l.price * l.qty)}</b><div class="qty"><button type="button" data-dq="-1" data-id="${l.id}" aria-label="One less ${esc(l.name)}">${ic("minus")}</button><span>${l.qty}</span><button type="button" data-dq="1" data-id="${l.id}" aria-label="One more ${esc(l.name)}">${ic("plus")}</button></div><button type="button" class="cl-rm" data-rm="${l.id}" aria-label="Remove ${esc(l.name)}">${ic("x")}</button></li>`).join("")

  $("#cartMem").innerHTML = m ? `<div class="mchip">${avatar(m.name)}<div><b>${esc(m.name)}</b><small>${m.tier} member · ${num(m.points)} pts${memberPct(m) ? " · " + memberPct(m) + "% off" : ""}</small></div><button type="button" class="k-x" data-act="unMember" aria-label="Remove member from sale">${ic("x")}</button></div>` : "";
  $("#cartT").innerHTML = `<div><span>Subtotal · ${t.count} item${t.count === 1 ? "" : "s"}</span><span>${money(t.sub)}</span></div>${t.disc ? `<div class="dl"><span>Discount · ${esc(Cart.disc.label)}</span><span>-${money(t.disc)}</span></div>` : ""}${t.mem ? `<div class="dl"><span>Member saving</span><span>-${money(t.mem)}</span></div>` : ""}${t.tax ? `<div><span>Sales tax ${S.cfg.tax}%</span><span>${money(t.tax)}</span></div>` : ""}<div class="tot"><span>Total</span><span>${money(t.total)}</span></div>`;
  const cb = $("#chargeBtn"); cb.innerHTML = `${ic("cash")} Charge ${money(t.total)}`; cb.disabled = !Cart.lines.length;

}
function addToCart(p, from) {
  if (!p) return;
  const st = p.stock[S.shop], l = Cart.lines.find((x) => x.id === p.id);
  if (st <= 0 || (l && l.qty >= st)) { toast(`Only ${st} × ${p.name} in stock at ${shopName()}`, "err"); return; }
  Cart.add(p); fly(from, $("#cartL"));
  const c = $("#cart"); if (c) { c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
}
/* the product picture flies into the cart */
function fly(from, to) {
  if (reduced() || !from || !to) return;
  const a = from.querySelector(".art"); if (!a || !a.animate) return;
  const r1 = a.getBoundingClientRect(), r2 = to.getBoundingClientRect(), c = a.cloneNode(true);
  c.classList.add("flyer"); c.style.cssText = `left:${r1.left}px;top:${r1.top}px;width:${r1.width}px;height:${r1.height}px;--t:${from.style.getPropertyValue("--t")}`;
  document.body.append(c);
  const dx = r2.left + r2.width / 2 - (r1.left + r1.width / 2), dy = r2.top + 24 - (r1.top + r1.height / 2);
  c.animate([{ transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 }, { transform: `translate(${dx * 0.5}px,${dy * 0.5 - 60}px) scale(.8) rotate(-12deg)`, opacity: 1, offset: 0.5 }, { transform: `translate(${dx}px,${dy}px) scale(.25) rotate(8deg)`, opacity: 0.2 }], { duration: 650, easing: "cubic-bezier(.45,0,.55,1)" }).onfinish = () => c.remove();
}
/* signature moment: the drawer slides open with the change to give */
function popDrawer(change, then) {

}
function memberPicker() {

function memberForm(m, after) {
  formModal({
    title: m ? "Edit member" : "New member", fields: [
      { k: "name", label: "Full name", req: true, full: true },
      { k: "phone", label: "Mobile", req: true, ph: "0300-1234567", check: (v) => (/^03\d{2}-?\d{7}$/.test(v) ? "" : "Use a mobile like 0300-1234567") },
      { k: "email", label: "Email", type: "email" },
      { k: "shop", label: "Home shop", type: "select", options: S.cfg.shops.map((s, i) => [i, s.name]) },
      { k: "points", label: "Points", type: "number", min: 0, step: 1 }
    ], values: m || { shop: S.shop, points: 50 }, submit: m ? "Save" : "Add member",
    save: (v) => {
      const data = { name: v.name, phone: v.phone, email: v.email, shop: +v.shop, points: Math.round(v.points) };
      let rec = m;
      if (m) Object.assign(m, data);
      else { rec = Object.assign({ id: "M" + (1001 + S.members.length + ri(100, 899)), spend: 0, visits: 0, tier: "Bronze", joined: Date.now(), last: Date.now() }, data); S.members.unshift(rec); Notes.add(`New member: ${rec.name}`, "ok"); }
      save(); toast(m ? "Member saved" : `${rec.name} joined with ${rec.points} welcome points`);
      if (after) after(rec); else Router.refresh(); return true;
    }
  });
}
function memberDrawer(id) {

  const txs = S.tx.filter((x) => x.member === id).slice(0, 6), next = m.tier === "Gold" ? 0 : m.tier === "Silver" ? 120000 : 45000;

    title: esc(m.name), drawer: true,
    body: `<div class="mcard ${m.tier.toLowerCase()}"><div class="mc-top"><span>${esc(S.cfg.store)} member</span><b>${m.tier}</b></div><div class="mc-name">${esc(m.name)}</div><div class="mc-row"><span>${m.id}</span><span>${num(m.points)} pts</span></div>${barcode(m.id)}</div>
      <div class="mstats"><div><small>Total spend</small><b>${money(m.spend)}</b></div><div><small>Visits</small><b>${m.visits}</b></div><div><small>Member since</small><b>${fmtDateY(m.joined)}</b></div></div>
      ${next ? `<div class="tierbar"><div class="tb-h"><span>${money(next - m.spend)} more to reach ${m.tier === "Silver" ? "Gold" : "Silver"}</span><b>${pct(m.spend / next, 0)}</b></div><div class="k-hbr"><i style="width:${((m.spend / next) * 100).toFixed(1)}%;background:var(--accent)"></i></div></div>` : `<p class="k-hint">Top tier: ${S.cfg.gold}% off every sale.</p>`}

      <p class="mcontact">${ic("chat")} ${esc(m.phone)}<br>${ic("mail")} ${esc(m.email || "No email")}</p>`,
    foot: `<button type="button" class="btn danger" data-mdel aria-label="Delete member">${ic("trash")}</button><button type="button" class="btn" data-mpts>Points</button><button type="button" class="btn" data-medit>${ic("edit")} Edit</button><span class="sp"></span><button type="button" class="btn primary" data-msale>${ic("cart")} Start a sale</button>`
  });

  $(".plist", b).addEventListener("click", (e) => { const t = e.target.closest("[data-tx]"); if (t) txDrawer(t.dataset.tx); });
  $("[data-msale]", b).addEventListener("click", () => { Cart.member = m.id; L.close(); location.hash = "#/register"; emit("cart", {}); toast(`${m.name} is on this sale`); });
  $("[data-medit]", b).addEventListener("click", () => { L.close(); memberForm(m); });
  $("[data-mpts]", b).addEventListener("click", () => formModal({ title: "Adjust points", fields: [{ k: "delta", label: "Points to add (minus to remove)", type: "number", req: true, step: 1 }, { k: "why", label: "Reason", req: true, ph: "Goodwill for a late delivery" }], save: (v) => { if (m.points + v.delta < 0) return "Points can't go below zero"; m.points += Math.round(v.delta); save(); L.close(); toast(`${m.name} now has ${num(m.points)} points`); Router.refresh(); return true; } }));
  $("[data-mdel]", b).addEventListener("click", () => confirmBox(`Delete ${m.name}? Their receipts stay, but the membership and points go.`, () => { S.members = S.members.filter((x) => x !== m); save(); L.close(); toast("Member deleted", "info"); Router.refresh(); }));

/* ---------- 9. Cash drawer: float, paid in and out, count and close ---------- */
function openShiftForm() {
  formModal({
    title: `Open the ${shopName()} till`, submit: "Open shift",
    fields: [{ k: "by", label: "Opened by", type: "select", options: S.staff.filter((s) => s.shop === S.shop).map((s) => s.name) }, { k: "float", label: "Opening float (Rs)", type: "number", min: 0, req: true, step: 1 }],
    values: { float: S.shop ? 8000 : 10000 },
    save: (v) => { const t = Date.now(); S.shift[S.shop] = { open: true, at: t, by: v.by, float: Math.round(v.float), cash: 0, refunds: 0, paidIn: 0, paidOut: 0, log: [{ t, kind: "Shift opened", amt: Math.round(v.float), note: "Opening float" }] }; save(); toast("Shift open. Float " + money(v.float)); Notes.add(`${v.by} opened the ${shopName()} till`, "ok"); Router.refresh(); return true; }
  });
}
function cashMove(dir) {
  const sh = S.shift[S.shop];
  formModal({
    title: dir > 0 ? "Paid in" : "Paid out", submit: dir > 0 ? "Add to drawer" : "Take from drawer",
    fields: [{ k: "amt", label: "Amount (Rs)", type: "number", min: 1, req: true, step: 1, check: (v) => (dir < 0 && v > expected(sh) ? "Only " + money(expected(sh)) + " is in the drawer" : "") }, { k: "why", label: "Reason", req: true, ph: dir > 0 ? "Extra change from the bank" : "Courier, cleaning, milk…" }],
    save: (v) => { const a = Math.round(v.amt); if (dir > 0) sh.paidIn += a; else sh.paidOut += a; sh.log.unshift({ t: Date.now(), kind: dir > 0 ? "Paid in" : "Paid out", amt: dir * a, note: v.why }); save(); toast(`${dir > 0 ? "Paid in" : "Paid out"} ${money(a)}`); Router.refresh(); return true; }
  });
}
function countModal() {
  const sh = S.shift[S.shop], exp = expected(sh), den = [5000, 1000, 500, 100, 50, 20, 10];
  const L = openModal({
    title: "Count and close the shift", wide: true,
    body: `<p class="k-hint">Count each note in the ${esc(shopName())} drawer. The difference updates as you type.</p><div class="cnt-grid">${den.map((d) => `<label class="cnt-row"><span class="note-chip" style="--nc:${NOTE_COL[d]}">${d}</span><input type="number" min="0" step="1" inputmode="numeric" data-den="${d}" aria-label="How many ${d} rupee notes"><b data-rt="${d}">Rs 0</b></label>`).join("")}<label class="cnt-row"><span class="note-chip coin">Coins</span><input type="number" min="0" step="1" inputmode="numeric" data-den="1" aria-label="Coins, total in rupees"><b data-rt="1">Rs 0</b></label></div><div class="cnt-sum"><div><small>Counted</small><b data-ct>Rs 0</b></div><div><small>Expected</small><b>${money(exp)}</b></div><div><small>Difference</small><b data-cv aria-live="polite">${money(-exp)}</b></div></div><div class="k-field"><label for="cntNote">Note</label><input id="cntNote" type="text" placeholder="Optional, e.g. counted twice"></div>`,
    foot: `<button type="button" class="btn ghost" data-fill>Fill with expected</button><span class="sp"></span><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-closeit>${ic("lock")} Close shift</button>`
  });
  const b = L.box, ins = $$("[data-den]", b);
  const total = () => sum(ins, (i) => (Math.max(0, Math.floor(+i.value || 0)) * +i.dataset.den));
  const upd = () => { ins.forEach((i) => ($(`[data-rt="${i.dataset.den}"]`, b).textContent = money(Math.max(0, Math.floor(+i.value || 0)) * +i.dataset.den))); const t = total(), dv = t - exp, cv = $("[data-cv]", b); $("[data-ct]", b).textContent = money(t); cv.textContent = (dv > 0 ? "+" : "") + money(dv); cv.className = dv === 0 ? "ok" : dv > 0 ? "over" : "short"; };
  b.addEventListener("input", upd);
  $("[data-fill]", b).addEventListener("click", () => { let r = exp; ins.forEach((i) => { const d = +i.dataset.den, n = Math.floor(r / d); i.value = n || ""; r -= n * d; }); upd(); });
  $("[data-closeit]", b).addEventListener("click", () => {
    const t = total();
    const doClose = () => { const v = t - exp; S.shifts.unshift({ id: "SH-" + (1000 + S.shifts.length), shop: S.shop, date: Date.now(), by: sh.by, float: sh.float, expected: exp, counted: t, variance: v, note: $("#cntNote", b).value.trim() }); sh.open = false; sh.log.unshift({ t: Date.now(), kind: "Shift closed", amt: t, note: v ? (v > 0 ? "Over " : "Short ") + money(Math.abs(v)) : "Balanced" }); save(); L.close(); toast(v ? `Shift closed, ${v > 0 ? "over" : "short"} by ${money(Math.abs(v))}` : "Shift closed and balanced"); Notes.add(`${shopName()} shift closed: ${v ? (v > 0 ? "over" : "short") + " " + money(Math.abs(v)) : "balanced"}`, v < 0 ? "err" : "ok"); Router.refresh(); };
    if (t === 0) confirmBox("You counted nothing. Close the shift with an empty drawer?", doClose, { yes: "Close anyway" }); else doClose();
  });
}
