  v.innerHTML = head("Cash drawer", `${esc(shopName())} till. Log cash in and out, then count up and close the shift.`, sh.open ? `<button type="button" class="btn" data-act="nosale">${ic("drawer")} Open drawer</button><button type="button" class="btn primary" data-act="closeShift">${ic("lock")} Count and close</button>` : `<button type="button" class="btn primary" data-act="openShift">${ic("plus")} Open shift</button>`)
    + `<div class="dr-grid"><div class="card dr-vis"><div class="card-h"><h2>Drawer</h2>${sh.open ? badge("Shift open", "ok") : badge("Shift closed", "err")}</div><div class="dr-stage">${tillHTML("big", sh.open ? exp : 0)}</div><p class="dr-note">Expected in the drawer <b data-count="${sh.open ? exp : 0}" data-fmt="money">${money(sh.open ? exp : 0)}</b></p></div>
      <div class="card dr-sum"><div class="card-h"><h2>This shift</h2><span class="mut">${sh.open ? "Opened " + fmtTime(sh.at) + " by " + esc(sh.by) : "No open shift"}</span></div><dl class="ledger"><div><dt>Opening float</dt><dd>${money(sh.float)}</dd></div><div><dt>Cash sales</dt><dd class="pos">+${money(sh.cash)}</dd></div><div><dt>Cash refunds</dt><dd class="neg">-${money(sh.refunds)}</dd></div><div><dt>Paid in</dt><dd class="pos">+${money(sh.paidIn)}</dd></div><div><dt>Paid out</dt><dd class="neg">-${money(sh.paidOut)}</dd></div><div class="tot"><dt>Expected cash</dt><dd>${money(exp)}</dd></div></dl><div class="dr-act"><button type="button" class="btn" data-act="paidIn"${dis}>${ic("plus")} Paid in</button><button type="button" class="btn" data-act="paidOut"${dis}>${ic("minus")} Paid out</button></div></div>
      <div class="card dr-log"><div class="card-h"><h2>Drawer log</h2><span class="mut">${sh.log.length} entries</span></div><ul class="log">${sh.log.slice(0, 9).map((e) => `<li><span class="lg-t">${fmtTime(e.t)}</span><span class="lg-k">${esc(e.kind)}<small>${esc(e.note)}</small></span><b class="${e.amt < 0 ? "neg" : "pos"}">${e.amt < 0 ? "-" : "+"}${money(Math.abs(e.amt))}</b></li>`).join("") || `<li class="k-emptyp">Nothing logged yet</li>`}</ul></div></div>
    <div class="card"><div class="card-h"><h2>Shift history</h2><span class="mut">${esc(shopName())}</span></div><div id="shiftT"></div></div>`;
  table($("#shiftT", v), {
    rows: () => S.shifts.filter((x) => x.shop === S.shop), search: false,
    chips: { values: ["All", "Short", "Over", "Balanced"], test: (x, c) => (c === "Short" ? x.variance < 0 : c === "Over" ? x.variance > 0 : x.variance === 0) },
    cols: [{ label: "Closed", k: "date", f: (x) => fmtDT(x.date) }, { label: "Shift", k: "id" }, { label: "By", k: "by" }, { label: "Float", k: "float", f: (x) => money(x.float), cls: "num" }, { label: "Expected", k: "expected", f: (x) => money(x.expected), cls: "num" }, { label: "Counted", k: "counted", f: (x) => money(x.counted), cls: "num" }, { label: "Difference", k: "variance", f: (x) => badge(x.variance ? (x.variance > 0 ? "+" : "") + money(x.variance) : "Balanced", x.variance < 0 ? "err" : x.variance > 0 ? "warn" : "ok") }],
    size: 6, sort: 0, dir: -1, caption: "Shift history"
  });
  if (sh.open) { const tl = $(".till.big", v); setTimeout(() => { if (tl) tl.classList.add("open"); }, reduced() ? 0 : 600); }
});
Object.assign(ACT, {
  nosale: () => { const tl = $(".till.big"); if (!tl) return; const sh = S.shift[S.shop]; if (tl.classList.contains("open")) { tl.classList.remove("open"); return; } tl.classList.add("open"); sh.log.unshift({ t: Date.now(), kind: "No sale", amt: 0, note: "Drawer opened by " + me() }); save(); toast("Drawer opened, logged as no sale", "info"); },

/* ---------- 10. Shops: side by side, live feed, stock transfers ---------- */
function shopStats(i) { const td = S.tx.filter((x) => x.shop === i && x.status === "Paid" && x.t >= today0()), tk = sum(td, (x) => x.total); return { tk, n: td.length, avg: td.length ? tk / td.length : 0 }; }
function shopCard(i) {
  const s = shopStats(i), sh = S.shift[i], staff = S.staff.filter((x) => x.shop === i);
  return `<div class="card shopc" style="--t:var(--c${i ? 4 : 1})"><div class="awning" aria-hidden="true"></div><div class="shopc-b"><div class="shopc-h"><div><h2>${esc(shopName(i))}</h2><small>${esc(S.cfg.shops[i].addr)}</small></div>${sh.open ? badge("Till open", "ok") : badge("Till closed", "err")}</div><div class="shopc-k"><div><small>Takings today</small><b id="sk${i}a" data-count="${s.tk}" data-fmt="money">${money(s.tk)}</b></div><div><small>Receipts</small><b id="sk${i}b" data-count="${s.n}" data-fmt="int">${s.n}</b></div><div><small>Average</small><b id="sk${i}c" data-count="${s.avg}" data-fmt="money">${money(s.avg)}</b></div></div><div class="sp14" id="sp${i}"></div><div class="shopc-f"><div class="avs">${staff.map((x) => avatar(x.name)).join("")}<small>${staff.length} staff</small></div><button type="button" class="btn sm${S.shop === i ? " primary" : ""}" data-act="useShop" data-i="${i}">${S.shop === i ? ic("check") + " Your till" : "Use this till"}</button></div></div></div>`;
}
const feedLi = (x) => `<li class="${x.fresh ? "fresh" : ""}"><span class="fd-dot" style="--t:var(--c${x.shop ? 4 : 1})"></span><div><b>${esc(shopName(x.shop))} · ${money(x.total)}</b><small>${x.id} · ${sum(x.lines, (l) => l.qty)} item${sum(x.lines, (l) => l.qty) === 1 ? "" : "s"} · ${esc(x.method)}</small></div><time>${x.t > Date.now() - 6e4 ? "just now" : fmtTime(x.t)}</time></li>`;
Router.add("shops", "Shops", (v) => {
  v.innerHTML = head("Shops", "Both shops side by side, updating live. Move stock to where it sells.", "")

  [0, 1].forEach((i) => spark($("#sp" + i, v), S.d.rev[i].slice(-14), `var(--c${i ? 4 : 1})`));
  const a = byRange(S.d.rev[0], "14D"), b = byRange(S.d.rev[1], "14D");
  barChart($("#shopBars", v), { labels: a.labels, series: [{ name: shopName(0), data: a.data, color: "var(--c1)" }, { name: shopName(1), data: b.data, color: "var(--c4)" }], fmt: short, tip: money, h: 220 });
  table($("#xferT", v), { rows: () => S.transfers, search: false, cols: [{ label: "When", k: "t", f: (x) => fmtDT(x.t) }, { label: "Transfer", k: "id" }, { label: "Product", k: "name" }, { label: "Qty", k: "qty", cls: "num" }, { label: "Route", v: (x) => x.from, f: (x) => `${esc(shopName(x.from))} → ${esc(shopName(x.to))}` }, { label: "By", k: "by" }], size: 5, sort: 0, dir: -1, caption: "Transfers" });

    if (!p) return;
    if (q < 1) { err.textContent = "Move at least 1"; $("#xfQ").setAttribute("aria-invalid", "true"); return; }

    save(); toast(`Moved ${q} × ${p.name} to ${shopName(to)}`); Router.refresh();
  });

  Timers.every(6000, () => {
    const x = simulateSale(); if (!x) return;

  });
});

let repRange = "30D";
Router.add("reports", "Reports", (v) => {
  v.innerHTML = head("Reports", "Takings, margin and what sells across both shops, including every sale rung up today.", `${seg("rr", ["7D", "30D", "12M"], repRange, "Report range")}<button type="button" class="btn" data-act="exportDaily">${ic("download")} CSV</button>`)
    + `<div class="kpis" id="repK"></div>
    <div class="grid-r"><div class="card span2"><div class="card-h"><h2>Takings by shop</h2></div><div id="repLine"></div></div><div class="card"><div class="card-h"><h2>Payment mix</h2></div><div id="repPay"></div></div></div>
    <div class="grid-r"><div class="card span2"><div class="card-h"><h2>Sales by category</h2></div><div id="repCat"></div></div><div class="card"><div class="card-h"><h2>Top sellers</h2><span class="mut" id="topSub"></span></div><div id="repTop"></div></div></div>
    <div class="card"><div class="card-h"><h2>Busy hours</h2><span class="mut">Receipts per hour, last 30 days</span></div><div id="repHeat"></div></div>`;
  segWire($(".ph-act", v), "rr", (r) => { repRange = r; drawReports(); });
  drawReports();
});
function drawReports() {
  const r = repRange, tot = S.d.rev[0].map((x, i) => x + S.d.rev[1][i]), cn = S.d.cnt[0].map((x, i) => x + S.d.cnt[1][i]);
  const rev = rangeSum(tot, r), n = rangeSum(cn, r), cogs = rangeSum(S.d.cogs, r), gm = rev ? (rev - cogs) / rev : 0;
  const kp = $("#repK"); if (!kp) return;
  kp.innerHTML = kpi("Takings", rev, "money", delta(rangeDelta(tot, r)), "cash", 1) + kpi("Receipts", n, "int", delta(rangeDelta(cn, r)), "receipt", 2) + kpi("Average basket", n ? rev / n : 0, "money", "", "bag", 3) + kpi("Gross margin", gm, "pct", `<small>${moneyS(rev - cogs)} profit</small>`, "trend", 4);
  counts(kp);
  const a = byRange(S.d.rev[0], r), b = byRange(S.d.rev[1], r);
  lineChart($("#repLine"), { labels: a.labels, series: [{ name: shopName(0), data: a.data, color: "var(--c1)" }, { name: shopName(1), data: b.data, color: "var(--c4)" }], fmt: short, tip: money, area: true, h: 250, label: "Takings by shop" });
  donut($("#repPay"), { items: METHODS.map((m, i) => ({ name: m, value: rangeSum(S.d.pay[i], r), color: ["var(--c2)", "var(--c4)", "var(--c3)"][i] })), fmt: moneyS, sub: "taken", size: 170, label: "Payment mix" });
  barChart($("#repCat"), { labels: a.labels, series: CATS.map((c, i) => ({ name: c, data: byRange(S.d.cat[i], r).data })), stack: true, fmt: short, tip: money, h: 250, label: "Sales by category" });
  const days = r === "7D" ? 7 : 30, since = today0() - (days - 1) * DAY, agg = {};
  S.tx.forEach((x) => { if (x.status !== "Paid" || x.t < since) return; x.lines.forEach((l) => { const g = agg[l.name] || (agg[l.name] = { name: l.name, value: 0, q: 0, cat: l.cat }); g.value += l.price * l.qty; g.q += l.qty; }); });
  $("#topSub").textContent = "last " + days + " days";
  hbars($("#repTop"), Object.values(agg).sort((x, y) => y.value - x.value).slice(0, 6).map((g) => ({ name: g.name, value: g.value, sub: g.q + " sold", color: `var(--c${g.cat + 1})` })), moneyS);
  const hrs = Array.from({ length: 12 }, (_, i) => 10 + i), order = [1, 2, 3, 4, 5, 6, 0], grid = order.map(() => hrs.map(() => 0));
  S.tx.forEach((x) => { if (x.t < today0() - 29 * DAY) return; const d = new Date(x.t), h = d.getHours() - 10; if (h >= 0 && h < 12) grid[order.indexOf(d.getDay())][h]++; });
  heat($("#repHeat"), { rows: order.map((d) => WD[d]), cols: hrs.map((h) => (h > 12 ? h - 12 + "p" : h + (h === 12 ? "p" : "a"))), data: grid, fmt: (n) => n + " receipts", color: "var(--c1)", label: "Busy hours" });
}
ACT.exportDaily = () => { const rows = Array.from({ length: D }, (_, i) => i); csv("tillhouse-daily.csv", rows, [["Date", (i) => isoDate(today0() - (D - 1 - i) * DAY)], [shopName(0), (i) => S.d.rev[0][i]], [shopName(1), (i) => S.d.rev[1][i]], ["Receipts", (i) => S.d.cnt[0][i] + S.d.cnt[1][i]]]); };

/* ---------- 12. Settings ---------- */
Router.add("settings", "Settings", (v) => {
  const c = S.cfg;
  v.innerHTML = head("Settings", "Shop details, till rules, codes and staff. Changes save on this device.", "")
    + `<div class="set-grid"><form class="card set" id="setStore" novalidate><div class="card-h"><h2>Store and receipts</h2></div>${fieldsHTML([{ k: "store", label: "Store name", req: true, full: true }, { k: "n0", label: "Shop 1 name", req: true }, { k: "n1", label: "Shop 2 name", req: true }, { k: "a0", label: "Shop 1 address", full: true }, { k: "a1", label: "Shop 2 address", full: true }, { k: "foot", label: "Receipt footer", full: true }], { store: c.store, n0: c.shops[0].name, n1: c.shops[1].name, a0: c.shops[0].addr, a1: c.shops[1].addr, foot: c.foot })}<div class="set-f"><button class="btn primary" type="submit">Save store</button></div></form>
    <form class="card set" id="setRules" novalidate><div class="card-h"><h2>Till rules</h2></div>${fieldsHTML([{ k: "tax", label: "Sales tax %", type: "number", min: 0, max: 30, req: true }, { k: "ppr", label: "Points per Rs 100", type: "number", min: 0, max: 10, req: true }, { k: "silver", label: "Silver discount %", type: "number", min: 0, max: 50, req: true }, { k: "gold", label: "Gold discount %", type: "number", min: 0, max: 50, req: true }], c)}<div class="set-f"><button class="btn primary" type="submit">Save rules</button></div></form>
    <div class="card set"><div class="card-h"><h2>Discount codes</h2></div><ul class="codes">${Object.entries(c.codes).map(([k, d]) => `<li><code>${esc(k)}</code><span>${d.type === "pct" ? d.v + "% off" : money(d.v) + " off"}</span><button type="button" class="k-x" data-act="delCode" data-k="${esc(k)}" aria-label="Remove code ${esc(k)}">${ic("trash")}</button></li>`).join("") || `<li class="k-emptyp">No codes yet</li>`}</ul><form id="addCode" class="code-f" novalidate><label class="sr" for="cdK">Code</label><input id="cdK" class="k-input" placeholder="CODE" maxlength="16"><label class="sr" for="cdT">Type</label><select id="cdT" class="k-input"><option value="pct">% off</option><option value="amt">Rs off</option></select><label class="sr" for="cdV">Value</label><input id="cdV" class="k-input" type="number" min="1" placeholder="10"><button class="btn" type="submit">${ic("plus")} Add</button></form><small class="k-err" id="cdE"></small></div>
    <div class="card set"><div class="card-h"><h2>Staff</h2><button type="button" class="btn sm" data-act="addStaff">${ic("plus")} Add</button></div><ul class="staff">${S.staff.map((s, i) => `<li>${avatar(s.name)}<div><b>${esc(s.name)}</b><small>${esc(s.role)} · ${esc(shopName(s.shop))}</small></div><button type="button" class="k-x" data-act="delStaff" data-i="${i}" aria-label="Remove ${esc(s.name)}">${ic("trash")}</button></li>`).join("")}</ul></div>
    <div class="card set"><div class="card-h"><h2>Look and data</h2></div><div class="set-row"><div><b>Theme</b><small>Light or dark, saved on this device</small></div><button type="button" class="btn" data-act="theme">${ic("moon")} Switch theme</button></div><div class="set-row"><div><b>Backup</b><small>Download everything as JSON</small></div><button type="button" class="btn" data-act="backup">${ic("download")} Download</button></div><div class="set-row"><div><b>Reset demo data</b><small>Puts back the sample shop, members and sales</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const store = $("#setStore", v), rules = $("#setRules", v);
  store.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(store, [{ k: "store", label: "Store name", req: true }, { k: "n0", label: "Shop 1 name", req: true }, { k: "n1", label: "Shop 2 name", req: true }, { k: "a0", label: "" }, { k: "a1", label: "" }, { k: "foot", label: "" }]); if (!x) return; c.store = x.store; c.shops[0] = { name: x.n0, addr: x.a0 }; c.shops[1] = { name: x.n1, addr: x.a1 }; c.foot = x.foot; APP.name = x.store; save(); paintChrome(); toast("Store details saved"); });
  rules.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(rules, [{ k: "tax", label: "Sales tax", type: "number", min: 0, max: 30, req: true }, { k: "ppr", label: "Points", type: "number", min: 0, max: 10, req: true }, { k: "silver", label: "Silver", type: "number", min: 0, max: 50, req: true }, { k: "gold", label: "Gold", type: "number", min: 0, max: 50, req: true }]); if (!x) return; Object.assign(c, x); save(); toast("Till rules saved"); });
  $("#addCode", v).addEventListener("submit", (e) => { e.preventDefault(); const k = $("#cdK").value.trim().toUpperCase(), t = $("#cdT").value, n = +$("#cdV").value, er = $("#cdE"); er.textContent = ""; if (!/^[A-Z0-9]{3,16}$/.test(k)) { er.textContent = "Use 3 to 16 letters or numbers"; return; } if (!(n > 0) || (t === "pct" && n > 100)) { er.textContent = "Enter a value above 0 (100 at most for %)"; return; } if (c.codes[k]) { er.textContent = "That code already exists"; return; } c.codes[k] = { type: t, v: n }; save(); toast("Code " + k + " added"); Router.refresh(); });
});
Object.assign(ACT, {
  delCode: (b) => confirmBox(`Remove the code ${b.dataset.k}?`, () => { delete S.cfg.codes[b.dataset.k]; save(); toast("Code removed", "info"); Router.refresh(); }, { yes: "Remove" }),
  addStaff: () => formModal({ title: "Add staff", fields: [{ k: "name", label: "Name", req: true, full: true }, { k: "role", label: "Role", type: "select", options: ["Cashier", "Manager", "Stock"] }, { k: "shop", label: "Shop", type: "select", options: S.cfg.shops.map((s, i) => [i, s.name]) }], save: (v) => { S.staff.push({ name: v.name, role: v.role, shop: +v.shop }); save(); toast(v.name + " added"); Router.refresh(); return true; } }),
  delStaff: (b) => { const s = S.staff[+b.dataset.i]; if (!s) return; if (S.staff.filter((x) => x.shop === s.shop).length < 2) return toast("Each shop needs at least one person", "err"); confirmBox(`Remove ${s.name} from staff?`, () => { S.staff.splice(+b.dataset.i, 1); save(); toast("Staff removed", "info"); Router.refresh(); }, { yes: "Remove" }); },
  backup: () => { try { const url = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: "application/json" })); const a = document.createElement("a"); a.href = url; a.download = "tillhouse-backup.json"; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); toast("Backup downloaded"); } catch (e) { toast("Download is not available here", "err"); } },
  reset: () => confirmBox("Reset all demo data? Your own sales, members and settings on this device are replaced.", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); Cart.clear(); APP.name = S.cfg.store; save(); paintChrome(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset data" })
});

/* ---------- 13. Chrome: shop switch, side status, boot ---------- */
function setShop(i) { S.shop = i; save(); paintChrome(); Router.refresh(); toast(`Now on the ${shopName(i)} till`); }
function paintChrome() {
  const sw = $("#shopSw");
  sw.innerHTML = seg("shop", S.cfg.shops.map((s) => s.name), shopName(), "Shop");
  const sh = S.shift[S.shop];
  $("#sideFoot").innerHTML = `<div class="till-pill ${sh.open ? "on" : ""}"><span class="tp-dot"></span><div><b>${esc(shopName())} till</b><small>${sh.open ? "Open · " + money(expected(sh)) + " in drawer" : "Shift closed"}</small></div></div><div class="side-me">${avatar(me())}<div><b>${esc(me())}</b><small>${esc((S.staff.find((s) => s.name === me()) || {}).role || "")}</small></div></div>`;
  $("#meBox").innerHTML = avatar(me());
  const n = Cart.totals().count, nc = $("#navCart"); nc.textContent = n; nc.hidden = !n;
}
segWire($("#shopSw"), "shop", (name) => { const i = S.cfg.shops.findIndex((s) => s.name === name); if (i > -1 && i !== S.shop) setShop(i); });
S = loadState(seedData, VER);
APP.name = S.cfg.store;
paintIcons(); Theme.label();
on("cart", (d) => { drawCart(d); paintChrome(); });
on("route", paintChrome);
CMDS = [
  { label: "New sale", hint: "Register", run: () => (location.hash = "#/register") },
  { label: "Add a product", run: () => productForm(null) },
  { label: "New member", run: () => memberForm(null) },
  { label: "Count and close the shift", run: () => { location.hash = "#/drawer"; setTimeout(() => S.shift[S.shop].open && countModal(), 80); } },
  { label: "Switch shop", run: () => setShop(1 - S.shop) },
  { label: "Switch theme", run: () => Theme.toggle() }
];
S.products.filter((p) => p.stock[S.shop] <= p.reorder).slice(0, 2).forEach((p) => Notes.add(`${p.name} is low at ${shopName()} (${p.stock[S.shop]} left)`, "warn"));
Notes.add(`${S.shift[1].by} opened the ${shopName(1)} till`, "ok");
Notes.add("Weekly stock count is due on Friday", "info");
Cart.add(S.products[11]); Cart.add(S.products[27]);
Router.start();

</script>
