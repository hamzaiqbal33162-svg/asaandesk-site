<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodh Daftar · Dairy farm · Chill & Craft</title>
<script>
  /* Theme first, so there is no flash: ?theme=light|dark wins, then the system setting */
  (function () { var q = new URLSearchParams(location.search).get("theme"); document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; })();
</script>
<style>
/* ---------- Shared kit: base, buttons, fields, tables, modals, toasts, charts ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus, var(--acc)); outline-offset: 2px; }
  #view:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.sp { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* Buttons press in */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: var(--rb, 10px); padding: .55em 1em; font-weight: 600; background: var(--surface2); color: var(--ink); transition: transform .12s, box-shadow .2s, background .2s, filter .2s; white-space: nowrap; text-decoration: none; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.95); }
  .btn.pri { background: var(--acc); color: var(--acc-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: .34em .72em; font-size: 12.5px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .ibtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--rb, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .12s, background .2s; }
  .ibtn:active { transform: scale(.92); }
  .bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .bdg[hidden] { display: none; }
  .lnk { background: none; border: 0; padding: 0; color: var(--acc); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: .16em .62em; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: color-mix(in srgb, var(--mut) 16%, transparent); color: var(--ink); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 45%); }

  /* Segmented control (range switch) */
  .segc { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }
  .segc button { border: 0; background: transparent; padding: .3em .8em; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--mut); transition: background .25s, color .25s; }
  .segc button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }

  /* Form fields */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .fgrid.c3 { grid-template-columns: repeat(3, 1fr); }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .fld.span, .fgrid > .span { grid-column: 1 / -1; }
  .fld label { font-size: 12px; font-weight: 650; color: var(--mut); }
  .fld input, .fld select, .fld textarea { width: 100%; min-width: 0; padding: .58em .75em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); transition: border-color .2s, box-shadow .2s; }
  .fld textarea { resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 26%, transparent); }
  .fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--bad); }
  .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
  .hint { color: var(--mut); font-size: 11.5px; }
  .note { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border-left: 3px solid var(--warn); }
  .note.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); border-left-color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); border-left-color: var(--bad); }
  .note[hidden] { display: none; }

  /* Table kit: search, chips, sort, paging */
  .tk-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .tk-search { position: relative; flex: 1 1 180px; max-width: 280px; }
  .tk-search input { width: 100%; padding: .55em .8em .55em 2.2em; border-radius: var(--ri, 9px); border: 1px solid var(--line); background: var(--field, var(--surface2)); }
  .tk-search .ic { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--mut); }
  .tk-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .28em .8em; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .2s, color .2s, transform .12s; }
  .chip:active { transform: scale(.94); }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tk { width: 100%; border-collapse: collapse; min-width: var(--tkmin, 640px); }
  .tk th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .th-s { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .th-s .ar::after { content: "\2195"; opacity: .35; }
  th[aria-sort="ascending"] .ar::after { content: "\2191"; opacity: 1; }
  th[aria-sort="descending"] .ar::after { content: "\2193"; opacity: 1; }
  .tk td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tk tbody tr { transition: background .15s; }
  .tk tbody tr[tabindex="0"] { cursor: pointer; }
  .tk tbody tr:hover { background: color-mix(in srgb, var(--acc) 7%, transparent); }
  .tk tbody tr.rin { animation: ccRow .38s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--r) * 26ms); }
  .tk .num, .tk th.num { text-align: right; }
  .tk th.num .th-s { flex-direction: row-reverse; }
  .tk-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
  .tk-pg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-pg button { min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; }
  .tk-pg button[aria-current="page"] { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
  .tk-pg button:disabled { opacity: .35; cursor: default; }
  .empty-st { padding: 26px 10px; text-align: center; color: var(--mut); }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }

  /* Modal and drawer with backdrop */
  .ov { position: fixed; inset: 0; z-index: 100; background: var(--scrim, rgba(10, 12, 20, .5)); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ov.on { opacity: 1; }
  .modal { background: var(--surface); color: var(--ink); border-radius: var(--rm, 16px); width: min(540px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(22px) scale(.96); transition: transform .34s cubic-bezier(.2, .9, .3, 1.15); }
  .modal.wide { width: min(780px, 100%); }
  .ov.on .modal { transform: none; }
  .ov.as-drawer { place-items: stretch end; padding: 0; }
  .drawer { background: var(--surface); color: var(--ink); width: min(460px, 100%); height: 100%; overflow: auto; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .9, .3, 1); box-shadow: -20px 0 60px rgba(0, 0, 0, .25); }
  .drawer.wide { width: min(620px, 100%); }
  .ov.on .drawer { transform: none; }
  .m-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .m-h h2 { margin: 0; font-size: 17px; }
  .m-x { flex: none; display: grid; place-items: center; border: 0; background: var(--surface2); width: 34px; height: 34px; border-radius: 50%; }
  .m-b { padding: 6px 18px 18px; }
  .m-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; flex-wrap: wrap; }
  .m-f .grow { margin-right: auto; }
  .m-msg { margin: 4px 0 0; color: var(--mut); }
  .shake { animation: ccShake .4s; }
  @keyframes ccShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Popovers: menus, notifications */
  .pop { position: fixed; z-index: 140; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); min-width: 190px; max-width: min(340px, calc(100vw - 16px)); padding: 6px; animation: ccPop .18s ease-out both; }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--surface2); }
  .pop .mi.danger { color: var(--bad); }
  .nt-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 8px; gap: 12px; }
  .nt { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  .nt .mi { display: grid; gap: 2px; padding: 9px 10px 9px 20px; position: relative; }
  .nt .mi span { color: var(--mut); font-size: 12.5px; }
  .nt .mi.unread::before { content: ""; position: absolute; left: 7px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
  @keyframes ccPop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  /* Command search (Ctrl+K) */
  .pal-in { width: 100%; padding: .75em 1em; border: 1px solid var(--line); border-radius: 10px; background: var(--field, var(--surface2)); font-size: 15px; }
  .pal { list-style: none; margin: 10px 0 6px; padding: 0; max-height: 46vh; overflow: auto; }
  .pal button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; text-align: left; }
  .pal button small { color: var(--mut); }
  .pal button.on { background: var(--acc); color: var(--acc-ink); }
  .pal button.on small { color: inherit; opacity: .8; }

  /* Toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; background: var(--toast, #16181d); color: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); font-size: 13.5px; animation: ccToast .38s cubic-bezier(.2, .9, .3, 1.3) both; max-width: min(380px, calc(100vw - 32px)); transition: opacity .3s, transform .3s; }
  .toast .ti { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .toast.warn .ti { background: var(--warn); }
  .toast.bad .ti { background: var(--bad); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  .tbtn { background: none; border: 0; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; margin-left: 4px; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.95); } }
  @media (max-width: 600px) { #toasts { left: 12px; right: 12px; align-items: stretch; } .fgrid, .fgrid.c3 { grid-template-columns: 1fr; } }

  /* Chart tooltip */
  .tip { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; background: var(--tip, #111318); color: #fff; padding: 8px 10px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 250px; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* Charts */
  .ch { display: block; overflow: visible; touch-action: pan-y; max-width: 100%; }
  .ch .gr line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .ch text { fill: var(--mut); font-size: 11px; font-family: inherit; }
  .ch .ln { fill: none; stroke-width: var(--lw, 2.6px); stroke-linecap: round; stroke-linejoin: round; }
  .ch .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.4s cubic-bezier(.45, .1, .2, 1) forwards; }
  .ch .area.fade { animation: ccFade 1s .45s backwards; }
  .ch .guide { stroke: var(--mut); stroke-dasharray: 3 3; opacity: 0; }
  .ch .hdot { fill: var(--surface); stroke-width: 2.5; opacity: 0; }
  .ch .tgt { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .hov .ch .guide, .hov .ch .hdot { opacity: 1; }
  .ch .bar { transition: opacity .2s; }
  .ch .bar.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .8s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .ch.dim .bar { opacity: .38; }
  .ch.dim .bar.hi { opacity: 1; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mut); margin-top: 8px; }
  .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .dn-w { position: relative; flex: none; }
  .dn-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .dn-c b { font-size: 19px; line-height: 1.1; }
  .dn-c small { color: var(--mut); font-size: 11px; }
  .dseg { fill: none; transition: stroke-dasharray 1.1s cubic-bezier(.3, .8, .2, 1), opacity .2s; cursor: pointer; }
  .dn svg:hover .dseg:not(:hover) { opacity: .45; }
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1; min-width: 150px; font-size: 12.5px; }
  .dlg li { display: flex; align-items: center; gap: 8px; }
  .dlg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dlg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .hb { display: grid; gap: 11px; }
  .hb-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
  .hb-l b { font-variant-numeric: tabular-nums; }
  .hb-t { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .hb-t i { display: block; height: 100%; width: var(--w); border-radius: inherit; }
  .hb-t i.grow { animation: ccW 1s cubic-bezier(.2, .9, .25, 1) backwards; animation-delay: var(--d); }
  .hm { display: grid; gap: 3px; font-size: 11px; color: var(--mut); }
  .hm .c { border-radius: 4px; min-height: 18px; position: relative; overflow: hidden; background: var(--surface2); }
  .hm .c i { position: absolute; inset: 0; background: var(--hmc, var(--acc)); opacity: var(--o); }
  .hm .c.in2 { animation: ccPopIn .4s backwards; animation-delay: var(--d); }
  .ring .rv, .gauge .gv { stroke-dashoffset: var(--o); }
  .ring .rv.anim, .gauge .gv.anim { animation: ccRing 1.3s cubic-bezier(.3, .8, .2, 1) backwards; }
  .gauge .needle { transform-origin: var(--cx) var(--cy); transform: rotate(var(--a)); }
  .gauge .needle.anim { animation: ccNeedle 1.3s cubic-bezier(.3, 1.3, .4, 1) backwards; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccW { from { width: 0; } }
  @keyframes ccRing { from { stroke-dashoffset: 100; } }
  @keyframes ccNeedle { from { transform: rotate(-90deg); } }
  @keyframes ccPopIn { from { opacity: 0; transform: scale(.4); } }

  /* Reduced motion: keep everything working, drop the big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }

  /* ======================= Doodh Daftar look: soft pressed clay, grass and sky, a round dock ======================= */
  :root {
    --round: "Avenir Next", Nunito, "Segoe UI Rounded", "Trebuchet MS", system-ui, sans-serif;
    --bg: #ecf1e6; --surface: #ecf1e6; --surface2: #e2e9da; --field: #e6ecdf; --ink: #22301f; --mut: #637360; --line: #d3dccb;
    --acc: #3c8c37; --acc-ink: #fff; --sky: #3b8bd4; --butter: #e9b93f; --milk: #fbfdf7; --sh-d: #cbd5c2; --sh-l: #ffffff;
    --ok: #2f8a3a; --warn: #b8780b; --bad: #c8443a;
    --c1: #3c8c37; --c2: #3b8bd4; --c3: #e9b93f; --c4: #c8643a; --c5: #8f6bc8; --c6: #8a9a86;
    --rb: 999px; --ri: 14px; --rm: 26px; --grid: #dbe3d2; --tip: #2b3a28; --toast: #2b3a28;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1b231e; --surface: #1b231e; --surface2: #222c25; --field: #18201b; --ink: #e8f1e3; --mut: #9bab97; --line: #2c3830;
    --acc: #7fd36f; --acc-ink: #10210d; --sky: #6fb6ff; --butter: #ffd166; --milk: #f3f6ee; --sh-d: #121814; --sh-l: #253029;
    --ok: #7fd36f; --warn: #ffc857; --bad: #ff7a6b;
    --c1: #7fd36f; --c2: #6fb6ff; --c3: #ffd166; --c4: #ff9a6b; --c5: #c3a4ff; --c6: #6f7f6c;
    --grid: #26302a; --tip: #2a352d; --toast: #2a352d;
    color-scheme: dark;
  }
  body { font-family: var(--round); font-size: 14px; }
  h1, h2, h3 { font-weight: 700; letter-spacing: -.01em; }
  h3 { margin: 0 0 12px; font-size: 16px; }
  .neu { background: var(--surface); box-shadow: 7px 7px 16px var(--sh-d), -7px -7px 16px var(--sh-l); }
  .neu-in { background: var(--surface); box-shadow: inset 5px 5px 10px var(--sh-d), inset -5px -5px 10px var(--sh-l); }

  /* Header and the round dock with a pressed-in marker */
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 24px 6px; max-width: 1400px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand b { font-size: 20px; display: block; line-height: 1.05; }
  .brand small { color: var(--mut); font-size: 11.5px; }
  .head .tools { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .ibtn { border: 0; background: var(--surface); box-shadow: 4px 4px 10px var(--sh-d), -4px -4px 10px var(--sh-l); border-radius: 50%; }
  .ibtn:active { box-shadow: inset 3px 3px 7px var(--sh-d), inset -3px -3px 7px var(--sh-l); }
  .srch { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 0; color: var(--mut); min-width: 210px; background: var(--surface); box-shadow: inset 4px 4px 9px var(--sh-d), inset -4px -4px 9px var(--sh-l); }
  .srch kbd { margin-left: auto; font: 700 10.5px/1 system-ui; padding: 3px 7px; border-radius: 999px; background: var(--surface2); }
  .dock-wrap { display: flex; justify-content: center; padding: 6px 16px 4px; }
  .dock { position: relative; display: flex; gap: 6px; padding: 8px; border-radius: 34px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }

<script>
/* ======================= Shared kit (same in every Chill & Craft dashboard) ======================= */
"use strict";
/* ---------- Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 7).toUpperCase();

/* ---------- Seeded random: the demo data is the same on every load ---------- */
let _seed = 1;
const seed = (n) => { _seed = n >>> 0; };
const rnd = () => { _seed = (_seed + 0x6d2b79f5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- Pakistani names, cities and phone numbers for demo rows ---------- */
const PK = {
  m: ["Ahmed", "Bilal", "Usman", "Hamza", "Ali", "Imran", "Faisal", "Zubair", "Saad", "Kamran", "Asif", "Tariq", "Shahid", "Naveed", "Waqas", "Adeel", "Fahad", "Junaid", "Rizwan", "Salman", "Danish", "Arslan", "Haris", "Owais", "Shoaib", "Yasir", "Moiz", "Talha"],
  f: ["Ayesha", "Fatima", "Sana", "Hira", "Maryam", "Zainab", "Amna", "Mahnoor", "Rabia", "Iqra", "Sadia", "Noor", "Kiran", "Saba", "Anum", "Mehwish", "Hina", "Uzma", "Bushra", "Nida", "Laiba", "Areeba"],
  last: ["Khan", "Malik", "Butt", "Qureshi", "Sheikh", "Chaudhry", "Abbasi", "Siddiqui", "Mirza", "Raza", "Awan", "Javed", "Rana", "Baig", "Hashmi", "Gondal", "Shah", "Memon", "Baloch", "Niazi", "Ansari", "Jutt", "Kazmi", "Bhatti"],
  cities: ["Karachi", "Lahore", "Islamabad", "Rawalpindi", "Faisalabad", "Multan", "Peshawar", "Quetta", "Sialkot", "Gujranwala", "Hyderabad", "Sukkur", "Bahawalpur", "Abbottabad"],
};
const pname = (g) => pick(g === "f" ? PK.f : g === "m" ? PK.m : rnd() < 0.5 ? PK.f : PK.m) + " " + pick(PK.last);
const phone = () => "03" + ri(0, 4) + ri(0, 9) + "-" + ri(1000000, 9999999);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (name, cls = "") => `<span class="av ${cls}" style="--h:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;

/* ---------- Number formats: Rs 12,500 · 1.2M · $1,240 ---------- */
const num = (n, d = 0) => (+n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = (n) => (n < 0 ? "-" : "") + "Rs " + num(Math.abs(n));
const short = (n) => { const a = Math.abs(+n || 0), s = n < 0 ? "-" : "", f = (v, u) => s + (v >= 100 ? Math.round(v) : +v.toFixed(1)) + u; return a >= 1e9 ? f(a / 1e9, "B") : a >= 1e6 ? f(a / 1e6, "M") : a >= 1e3 ? f(a / 1e3, "K") : s + (a % 1 ? +a.toFixed(1) : a); };
const rss = (n) => (n < 0 ? "-" : "") + "Rs " + short(Math.abs(n));
const usd = (n, d = 0) => (n < 0 ? "-$" : "$") + num(Math.abs(n), d);
const pct = (n, d = 0) => num(n, d) + "%";
const FMT = { num: (v) => num(v), rs, rss, short, usd, usd2: (v) => usd(v, 2), pct: (v) => pct(v, 1), pct0: (v) => pct(v) };

/* ---------- Dates (local, no time zone surprises) ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addD = (d, n) => { const x = pd(d); x.setDate(x.getDate() + n); return x; };
const addM = (d, n) => { const x = pd(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
/* Add months but keep the day (31 Jan + 1 month = 28 or 29 Feb) */
const addMK = (d, n) => { const x = addM(d, n), day = pd(d).getDate(), last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const iso = (d) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const pd = (s) => { if (s instanceof Date) return new Date(s); const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fd = (s) => { const d = pd(s); return d.getDate() + " " + MON[d.getMonth()]; };
const fdy = (s) => { const d = pd(s); return fd(d) + " " + d.getFullYear(); };
const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const TODAY = iso(today());
const lastMonths = (n) => Array.from({ length: n }, (_, i) => iso(addM(today(), i - n + 1)).slice(0, 7));
const mName = (k) => MON[+String(k).slice(5, 7) - 1];

/* ---------- Icons (simple stroked shapes on a 24 grid) ---------- */
const IC = {
  grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  users: "M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6",
  user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",

  v.innerHTML = `<div class="ph"><div><h1>Settings</h1><p class="mut">Farm details, milk rates and the daily target.</p></div></div>

  <div class="card"><h3>Look and data</h3><div class="set-actions"><button type="button" class="btn ghost" data-do="theme">${ico("moon")} Switch light or dark</button><button type="button" class="btn ghost" data-do="csv">${ico("doc")} Download milking (CSV)</button><button type="button" class="btn danger" data-do="reset">${ico("refresh")} Reset demo data</button></div><p class="hint" style="margin-top:12px">Changes stay in this browser when storage is allowed.</p></div>`;
  $("#setForm", v).addEventListener("submit", (e) => { e.preventDefault(); const f = e.target, d = Object.fromEntries(new FormData(f)); clearErrs(f); const er = check(d, { farm: [REQ("Enter the farm name")], place: [REQ("Enter the place")], rateCow: [POS("Enter a rate")], rateBuf: [POS("Enter a rate")], target: [POS("Enter a target")] }); if (Object.keys(er).length) return showErrs(f, er); Object.assign(S.set, { farm: d.farm.trim(), place: d.place.trim(), rateCow: +d.rateCow, rateBuf: +d.rateBuf, target: Math.round(+d.target) }); afterChange("Settings saved"); });
});

/* ======================= Forms and drawers ======================= */
function openAnimal(id) {
  const a0 = anOf(id); if (!a0) return;
  const m = modal({ drawer: true, cls: "wide", title: a0.name, body: "" }), body = $(".m-b", m.el);
  const paint = () => {
    const a = anOf(id); if (!a) { body.innerHTML = '<div class="empty-st">This animal was removed.</div>'; return; }
    const d14 = Array.from({ length: 14 }, (_, i) => iso(addD(today(), i - 14)));
    body.innerHTML = `<div style="display:flex;gap:14px;align-items:center">${face(a)}<div><b style="font-size:20px">${esc(a.name)}</b> <span class="tag">${a.tag}</span><div class="mut sm">${esc(a.breed)} ${BREEDS[a.breed].k.toLowerCase()} · ${esc(a.stage)}</div></div></div>
    <dl class="facts"><dt>Born</dt><dd>${fdy(a.born)} (${Math.floor(dayDiff(a.born, TODAY) / 365)} years)</dd><dt>Last calving</dt><dd>${a.calved ? fdy(a.calved) : "Not yet"}</dd>${Object.keys(VAX).map((k) => `<dt>${k}</dt><dd>given ${fd(a.vax[k])}, next ${fd(vaxDue(a, k))}${vaxDue(a, k) < TODAY ? ' <b class="danger-t">overdue</b>' : ""}</dd>`).join("")}${a.notes ? `<dt>Notes</dt><dd>${esc(a.notes)}</dd>` : ""}</dl>
    ${a.m.length ? `<h3>Last two weeks</h3><div data-ch></div>` : ""}
    <div class="m-f"><button type="button" class="btn ghost danger-t" data-x="del">${ico("trash")} Remove</button><button type="button" class="btn ghost" data-x="edit">${ico("edit")} Edit</button>${a.m.length ? `<a class="btn pri" href="#/yield/${a.id}" data-x="yield">${ico("chart")} Full yield chart</a>` : ""}</div>`;
    const ch = $("[data-ch]", body); if (ch) setTimeout(() => barChart(ch, { labels: d14.map((d) => String(pd(d).getDate())), tipLabel: (i) => fdy(d14[i]), series: [{ name: "Morning", data: d14.map((d) => milkOn(a, d)[0]), color: "var(--c2)" }, { name: "Evening", data: d14.map((d) => milkOn(a, d)[1]), color: "var(--c3)" }], stacked: true, h: 190, fmt: (x) => L(x), yfmt: (x) => String(x), rx: 4 }, !RM), 60);
  };
  m.refresh = paint; paint();
  body.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-x]"), a = anOf(id); if (!b || !a) return;
    if (b.dataset.x === "yield") { m.close(); return; }
    if (b.dataset.x === "edit") animalForm(a);
    else if (b.dataset.x === "del") { if (!(await ask(`Remove ${a.name} (tag ${a.tag}) from the herd? Use this when an animal is sold.`, { ok: "Remove" }))) return; const i = S.animals.indexOf(a); S.animals.splice(i, 1); m.close(); afterChange(`${a.name} removed`, { undo: () => { S.animals.splice(i, 0, a); afterChange("Animal restored"); } }); }
  });
}
function animalForm(a) {
  const isNew = !a;
  modal({
    title: isNew ? "Add an animal" : "Edit " + a.name, submit: isNew ? "Add to herd" : "Save",
    body: `<div class="fgrid">${fld("Name", "name", { value: a ? a.name : "" })}${fld("Ear tag", "tag", { value: a ? a.tag : String(Math.max(100, ...S.animals.map((x) => +x.tag || 0)) + 1) })}${fld("Breed", "breed", { opts: Object.keys(BREEDS).map((b) => [b, `${b} (${BREEDS[b].k.toLowerCase()})`]), value: a ? a.breed : "Sahiwal" })}${fld("Stage", "stage", { opts: STAGES, value: a ? a.stage : "In milk" })}${fld("Born", "born", { type: "date", value: a ? a.born : iso(addD(today(), -1200)), max: TODAY })}${fld("Last calving", "calved", { type: "date", value: a ? a.calved : "", max: TODAY })}${fld("Notes", "notes", { span: true, value: a ? a.notes : "", ph: "Optional" })}</div>`,
    onSubmit: (d) => {
      const er = check(d, { name: [REQ("Enter a name")], tag: [REQ("Enter the tag number"), [(x) => /^\d{1,5}$/.test(x), "Use digits only"]], born: [REQ("Pick the birth date")] });
      if (S.animals.some((x) => x !== a && x.tag === d.tag.trim())) er.tag = "Another animal has this tag";
      if (d.calved && d.calved < d.born) er.calved = "Calving can't be before birth";
      if (Object.keys(er).length) return er;
      const f = { name: d.name.trim(), tag: d.tag.trim(), breed: d.breed, stage: d.stage, born: d.born, calved: d.calved, notes: d.notes.trim() };
      if (isNew) { const vax = {}; Object.keys(VAX).forEach((k) => (vax[k] = TODAY)); S.animals.push({ id: "A" + String(Math.max(0, ...S.animals.map((x) => +x.id.slice(1))) + 1).padStart(2, "0"), ...f, m: f.stage === "Dry" || f.stage === "Heifer" ? [] : Array.from({ length: dIdx(TODAY) + 1 }, () => [0, 0]), vax }); }
      else { if ((f.stage === "In milk" || f.stage === "Pregnant, in milk") && !a.m.length) a.m = Array.from({ length: dIdx(TODAY) + 1 }, () => [0, 0]); Object.assign(a, f); }
      afterChange(isNew ? `${f.name} added with tag ${f.tag}` : `${f.name} saved`);
    },
  });
}
function useForm(k) {
  const F = FEEDS.find((x) => x[0] === k);
  modal({ title: "Daily use: " + F[1], submit: "Save", body: fld(`${F[2]} per day for the herd`, "use", { type: "number", step: 0.1, min: 0, value: S.feed[k].use }), onSubmit: (d) => { if (!(+d.use >= 0)) return { use: "Enter 0 or more" }; S.feed[k].use = +d.use; afterChange(`${F[1]}: ${d.use} ${F[2]} a day`); } });
}
function buyForm() {
  modal({
    title: "Record a feed purchase", submit: "Add to store",
    body: `<div class="fgrid">${fld("Item", "fi", { opts: FEEDS.map(([k, n, u]) => [k, `${n} (${u})`]) })}${fld("Quantity", "qty", { type: "number", min: 0.1, step: 0.1 })}${fld("Total cost (Rs)", "cost", { type: "number", min: 1 })}${fld("Date", "date", { type: "date", value: TODAY, max: TODAY })}</div><p class="note ok" data-pr style="margin-top:12px"></p>`,
    onOpen: (box) => { const E = $("form", box).elements, n = $("[data-pr]", box); const u = () => { const F = FEEDS.find((x) => x[0] === E.fi.value) || FEEDS[0], q = +E.qty.value || 0; if (!E.cost.matches(":focus")) E.cost.value = q ? Math.round(q * F[4]) : ""; n.textContent = `Usual price ${rs(F[4])} per ${F[2] === "bags" ? "bag" : F[2]}. After this you will have ${num(S.feed[F[0]].stock + q, 1)} ${F[2]}, about ${((S.feed[F[0]].stock + q) / Math.max(0.01, S.feed[F[0]].use)).toFixed(0)} days.`; }; $("form", box).addEventListener("input", u); $("form", box).addEventListener("change", u); u(); },
    onSubmit: (d) => { const er = check(d, { qty: [POS("Enter the quantity")], cost: [POS("Enter the cost")], date: [REQ("Pick a date")] }); if (Object.keys(er).length) return er; S.feed[d.fi].stock += +d.qty; S.buys.push({ id: uid("B"), date: d.date, item: d.fi, qty: +d.qty, cost: Math.round(+d.cost) }); afterChange(`${FEEDS.find((x) => x[0] === d.fi)[1]} added to the store`); },
  });
}
function supplyForm() {
  modal({
    title: "Record milk supply", submit: "Save supply",
    body: `<div class="fgrid">${fld("Shop", "shop", { opts: SHOPS })}${fld("Milk", "kind", { opts: [["buf", `Buffalo (${rs(S.set.rateBuf)}/L)`], ["cow", `Cow (${rs(S.set.rateCow)}/L)`]] })}${fld("Litres", "lit", { type: "number", min: 0.5, step: 0.5 })}${fld("Date", "date", { type: "date", value: TODAY, max: TODAY })}</div><p class="note ok" data-sv style="margin-top:12px">Enter the litres.</p>`,
    onOpen: (box) => { const E = $("form", box).elements, n = $("[data-sv]", box); const u = () => { const r = E.kind.value === "buf" ? S.set.rateBuf : S.set.rateCow; n.textContent = `${num(+E.lit.value || 0, 1)} L × ${rs(r)} = ${rs(Math.round((+E.lit.value || 0) * r))} added to the khata`; }; $("form", box).addEventListener("input", u); $("form", box).addEventListener("change", u); u(); },
    onSubmit: (d) => { const avail = herdDay(d.date) - sum(S.supply.filter((x) => x.date === d.date).map((x) => x.lit)), er = check(d, { lit: [POS("Enter the litres"), [(x) => d.date !== TODAY || +x <= avail + 0.05, `Only ${L(Math.max(0, avail))} of today's milk is not supplied yet`]], date: [REQ("Pick a date")] }); if (Object.keys(er).length) return er; S.supply.push({ id: uid("S"), date: d.date, shop: d.shop, lit: +(+d.lit).toFixed(1), rate: d.kind === "buf" ? S.set.rateBuf : S.set.rateCow }); afterChange(`${L(+d.lit)} supplied to ${d.shop}`); },
  });
}
function payForm() {
  modal({
    title: "Payment received", submit: "Save payment",
    body: `<div class="fgrid">${fld("Shop", "shop", { opts: SHOPS.map((s) => [s, `${s} · owes ${rs(Math.max(0, shopOwe(s)))}`]) })}${fld("Amount (Rs)", "amt", { type: "number", min: 1 })}${fld("Method", "method", { opts: ["Cash", "Bank transfer", "Mobile wallet"] })}${fld("Date", "date", { type: "date", value: TODAY, max: TODAY })}</div>`,
    onOpen: (box) => { const E = $("form", box).elements; const u = () => (E.amt.value = Math.max(0, shopOwe(E.shop.value))); E.shop.addEventListener("change", u); u(); },
    onSubmit: (d) => { const er = check(d, { amt: [POS("Enter the amount"), [(x) => +x <= Math.max(0, shopOwe(d.shop)) + 1, `${d.shop} owes ${rs(Math.max(0, shopOwe(d.shop)))}`]], date: [REQ("Pick a date")] }); if (Object.keys(er).length) return er; S.pays.push({ id: uid("P"), date: d.date, shop: d.shop, amt: Math.round(+d.amt), method: d.method }); afterChange(`${rs(+d.amt)} received from ${d.shop}`); },
  });
}
function vetForm() {
  modal({
    title: "Log a vet visit", submit: "Save visit",
    body: `<div class="fgrid">${fld("Animal", "aid", { opts: S.animals.map((a) => [a.id, `${a.tag} · ${a.name}`]) })}${fld("Date", "date", { type: "date", value: TODAY, max: TODAY })}${fld("What happened", "what", { span: true, ph: "e.g. Fever, injection given" })}${fld("Cost (Rs)", "cost", { type: "number", min: 0, value: 1500 })}</div>`,
    onSubmit: (d) => { const er = check(d, { what: [REQ("Describe the visit")], date: [REQ("Pick a date")], cost: [[(x) => x !== "" && +x >= 0, "Enter 0 or more"]] }); if (Object.keys(er).length) return er; S.vet.push({ id: uid("V"), date: d.date, aid: d.aid, what: d.what.trim(), cost: Math.round(+d.cost) }); afterChange(`Vet visit saved for ${anOf(d.aid).name}`); },
  });
}
function vaxDone(aid, k) {
  const a = anOf(aid); if (!a || !VAX[k]) return;
  const prev = a.vax[k]; a.vax[k] = TODAY;
  afterChange(`${k} given to ${a.name}. Next due ${fd(vaxDue(a, k))}`, { undo: () => { a.vax[k] = prev; afterChange("Undone"); } });
}

/* ======================= Global wiring ======================= */
const DO = {
  add: () => animalForm(), buy: () => buyForm(), supply: () => supplyForm(), pay: () => payForm(), vet: () => vetForm(), theme: () => Theme.toggle(),
  useday: async () => { if (!(await ask("Take one day's ration for the whole herd out of the store?", { ok: "Feed the herd", safe: true }))) return; const prev = Object.fromEntries(FEEDS.map(([k]) => [k, S.feed[k].stock])); FEEDS.forEach(([k]) => (S.feed[k].stock = Math.max(0, +(S.feed[k].stock - S.feed[k].use).toFixed(1)))); afterChange("Today's ration taken from the store", { undo: () => { FEEDS.forEach(([k]) => (S.feed[k].stock = prev[k])); afterChange("Undone"); } }); },
  csv: () => {
    if (!window.Blob || !URL.createObjectURL) return toast("Downloads are not available here", { type: "warn" });
    const rows = [["Date", "Tag", "Name", "Breed", "Morning L", "Evening L"]]; milking().forEach((a) => a.m.forEach((x, i) => rows.push([iso(addD(S.start, i)), a.tag, a.name, a.breed, x[0], x[1]])));
    const el = document.createElement("a"); el.href = URL.createObjectURL(new Blob([rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" })); el.download = "doodh-daftar-milking.csv"; document.body.append(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(el.href), 1500); toast("Milking CSV downloaded");
  },
  reset: async () => { if (!(await ask("Reset the herd, milking and sales to the sample farm?", { title: "Reset demo data", ok: "Reset" }))) return; S = Store.reset(); Bell.read.clear(); afterChange("Demo data reset"); },
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-do]"); if (d && DO[d.dataset.do]) return DO[d.dataset.do](d);
  const vx = e.target.closest("[data-vax]"); if (vx) { const [a, k] = vx.dataset.vax.split("|"); return vaxDone(a, k); }
  const an = e.target.closest("[data-an]"); if (an) openAnimal(an.dataset.an);
});
APP.notes = () => {
  const L2 = [];
  FEEDS.forEach(([k, n]) => { const d = daysLeft(k); if (d < 7) L2.push({ id: "feed" + k + Math.round(S.feed[k].stock), t: `${n} running low`, d: `About ${d.toFixed(0)} days left`, go: "#/feed" }); });
  S.animals.forEach((a) => Object.keys(VAX).forEach((k) => { if (vaxDue(a, k) < TODAY) L2.push({ id: "vx" + a.id + k + a.vax[k], t: `${a.name}: ${k} overdue`, d: `Tag ${a.tag} · ${VAX[k].note}`, go: "#/health" }); }));
  if (!herdDay(TODAY, 1) && new Date().getHours() >= 17) L2.unshift({ id: "pm" + TODAY, t: "Evening milking not entered", d: "Open Milking to record it", go: "#/milking" });
  return L2.slice(0, 9);
};
APP.cmds = () => [{ label: "Enter milking", run: () => Router.go("milking") }, { label: "Add an animal", run: DO.add }, { label: "Record milk supply", run: DO.supply }, { label: "Record feed purchase", run: DO.buy }, { label: "Log a vet visit", run: DO.vet }, { label: "Switch light or dark theme", run: DO.theme }, ...S.animals.map((a) => ({ label: `${a.tag} · ${a.name} · ${a.breed}`, hint: "Animal", run: () => openAnimal(a.id) })), ...SHOPS.map((s) => ({ label: s, hint: "Shop", run: () => Router.go("sales") }))];
paintHead();
boot();
</script>
</body>
