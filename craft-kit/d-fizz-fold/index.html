<!doctype html>
<!-- Chill and Craft · Fizz Fold · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fizz Fold · drink card that opens from the can</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Flavour colours: the whole card follows the chosen flavour ---------- */
  body[data-flavour="lime"] { --c1: #34b556; --c2: #b9f27c; --c3: #17733a; --tint: #e5f6dc; }
  body[data-flavour="mango"] { --c1: #ff9417; --c2: #ffd166; --c3: #b85300; --tint: #fff0d4; }
  body[data-flavour="guava"] { --c1: #f2557f; --c2: #ffc2d4; --c3: #a8224f; --tint: #ffe5ed; }

  :root {
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #63636b;
    --line: #ececf1;
    --metal-a: #f4f5f7;
    --metal-b: #b8bcc6;
    --focus: #1d1d1f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --card: #19191d;
    --ink: #f4f4f6;
    --muted: #a3a3ad;
    --line: #2b2b32;
    --metal-a: #d9dce3;
    --metal-b: #7d828e;
    --focus: #ffffff;
    color-scheme: dark;
  }
  :root[data-theme="dark"] body { --tint: #101013; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(80% 70% at 50% 40%, var(--tint), color-mix(in srgb, var(--tint) 80%, var(--c1)));
    transition: background 0.6s;
  }
  :root[data-theme="dark"] body { background: radial-gradient(80% 70% at 50% 40%, color-mix(in srgb, var(--c3) 30%, #101013), #0b0b0d); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 56px 16px 20px; }
  .cart-pill {
    position: absolute; top: 14px; right: 16px;
    display: flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; font-size: 13px; font-weight: 650;
  }
  .cart-pill svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cart-pill b { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--c1); color: #fff; font-size: 11px; display: grid; place-items: center; }
  .cart-pill.bump b { animation: bump 0.4s cubic-bezier(0.3, 1.8, 0.5, 1); }
  @keyframes bump { 50% { transform: scale(1.4); } }

  /* ---------- The card ---------- */
  .card {
    display: flex;
    background: var(--card);
    border-radius: 30px;
    box-shadow: 0 30px 60px -30px color-mix(in srgb, var(--c3) 55%, transparent), 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .can-side {
    position: relative;
    flex: none;
    width: 260px;
    height: 380px;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c2) 70%, transparent), transparent 62%);
    transition: width 0.6s cubic-bezier(0.3, 1, 0.4, 1), height 0.6s;
  }
  .brand { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-weight: 900; font-style: italic; letter-spacing: -0.02em; font-size: 18px; color: var(--c3); }
  :root[data-theme="dark"] .brand { color: var(--c2); }
  .hint { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }
  .card.open .hint { opacity: 0; animation: none; }

  .can-btn {
    position: relative;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    border-radius: 24px;
    animation: bob 3.2s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .can-btn svg { display: block; width: 116px; height: 212px; transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.5, 1); filter: drop-shadow(0 18px 14px rgba(0, 0, 0, 0.18)); }
  .can-btn:hover svg { transform: rotate(-4deg) scale(1.03); }
  .card.open .can-btn svg { transform: rotate(-12deg) scale(0.92); }
  .can-btn.pop svg { animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
  /* the can leans toward the pointer in 3D and squashes when pressed */
  .can-tilt {
    display: block;
    transform: perspective(600px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1), scale 0.12s;
  }
  .can-btn:active .can-tilt { scale: 1.06 0.9; }
  /* droplets that burst from the top when the can opens */
  .spray { position: absolute; left: 50%; top: 22%; width: 0; height: 0; pointer-events: none; z-index: 3; }
  .spray i { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: color-mix(in srgb, var(--c2) 70%, #fff); box-shadow: inset -1px -1px 0 var(--c1); }
  /* details arrive piece by piece */
  .card.open .details-inner > * { animation: piece 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
  .card.open .details-inner > :nth-child(2) { animation-delay: 0.18s; }
  .card.open .details-inner > :nth-child(3) { animation-delay: 0.24s; }
  .card.open .details-inner > :nth-child(4) { animation-delay: 0.3s; }
  .card.open .details-inner > :nth-child(5) { animation-delay: 0.36s; }
  .card.open .details-inner > :nth-child(6) { animation-delay: 0.42s; }
  .card.open .details-inner > :nth-child(7) { animation-delay: 0.48s; }
  .card.open .details-inner > :nth-child(8) { animation-delay: 0.54s; }
  @keyframes piece { from { opacity: 0; transform: translateX(24px); } }
  .opt input:checked + span { animation: chosen 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes chosen { 40% { transform: scale(1.1); } }
  .opt span { transition: box-shadow 0.2s, background 0.2s, transform 0.2s; }
  .opt:hover span { transform: translateY(-1px); }
  .qty button { transition: transform 0.15s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .qty button:active { transform: scale(0.8); }
  .qty output.tick { animation: tick 0.3s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes tick { 40% { transform: translateY(-4px) scale(1.25); } }
  .qty output { display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @keyframes pop { 30% { transform: scale(0.9, 1.06); } }

  /* can paint, driven by the flavour colours */
  .can .s-dark { stop-color: var(--c3); }
  .can .s-main { stop-color: var(--c1); }
  .can .s-light { stop-color: var(--c2); }
  .can .m-a { stop-color: var(--metal-a); }
  .can .m-b { stop-color: var(--metal-b); }
  .can .ink { fill: #ffffff; }
  .can .ink-soft { fill: rgba(255, 255, 255, 0.82); }
  .fruit { display: none; }
  body[data-flavour="lime"] .fruit.lime,
  body[data-flavour="mango"] .fruit.mango,
  body[data-flavour="guava"] .fruit.guava { display: inline; }

  /* bubbles that rise while the card is open */
  .bubble {
    position: absolute;
    bottom: 34%;
    border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--c1) 70%, #fff);
    opacity: 0;
    pointer-events: none;
  }
  .card.open .bubble { animation: rise var(--d, 2.4s) ease-in infinite; animation-delay: var(--delay, 0s); }
  @keyframes rise {
    0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
    15% { opacity: 0.9; }
    100% { opacity: 0; transform: translate(var(--drift, 0px), -190px) scale(1.1); }
  }

  /* ---------- Details panel ---------- */
  .details {
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    visibility: hidden;
    transition: max-width 0.6s cubic-bezier(0.3, 1, 0.4, 1), opacity 0.25s, visibility 0s 0.6s;
  }
  .card.open .details { max-width: 400px; opacity: 1; visibility: visible; transition: max-width 0.6s cubic-bezier(0.3, 1, 0.4, 1), opacity 0.4s 0.22s, visibility 0s; }
  .details-inner { position: relative; width: 380px; padding: 24px 24px 22px 8px; }
  .close {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: var(--line); color: var(--ink); font-size: 18px; cursor: pointer;
  }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c3); }
  :root[data-theme="dark"] .eyebrow { color: var(--c2); }
  .details h2 { margin: 2px 0 6px; font-size: 28px; letter-spacing: -0.02em; }
  .details p.desc { margin: 0 0 14px; font-size: 14px; color: var(--muted); line-height: 1.5; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  legend { font-size: 12px; font-weight: 700; color: var(--muted); padding: 0; margin-bottom: 6px; }
  .swatches, .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt span {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 999px; font-size: 13px; font-weight: 600;
    box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow 0.2s, background 0.2s;
  }
  .opt span i { width: 14px; height: 14px; border-radius: 50%; }
  .opt input:checked + span { box-shadow: inset 0 0 0 2px var(--c1); background: color-mix(in srgb, var(--c1) 12%, transparent); }
  .opt input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .fact { font-size: 11px; color: var(--muted); }
  .fact b { display: block; font-size: 15px; color: var(--ink); }
  .fact .bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .fact .bar i { display: block; height: 100%; background: var(--c1); border-radius: inherit; transition: width 0.5s; }
  .buy { display: flex; gap: 10px; align-items: center; }
  .qty { display: flex; align-items: center; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line); }
  .qty button { width: 36px; height: 42px; border: 0; background: none; color: var(--ink); font-size: 18px; cursor: pointer; border-radius: 999px; }
  .qty output { min-width: 22px; text-align: center; font-weight: 700; }
  .add {
    flex: 1;
    height: 46px;
    border: 0;
    border-radius: 999px;
    background: var(--c3);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.3s, transform 0.15s;
  }
  .add:active { transform: scale(0.97); }
  .add[data-state="working"] { cursor: progress; }
  .add[data-state="done"] { background: #1f8f4e; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #fff; animation: turn 0.7s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ---------- Narrow screens: the card opens downward ---------- */
  @media (max-width: 680px) {
    .card { flex-direction: column; width: min(360px, 100%); }
    .can-side { width: 100%; height: 340px; }
    .card.open .can-side { height: 250px; }
    .details { max-width: none; max-height: 0; transition: max-height 0.6s cubic-bezier(0.3, 1, 0.4, 1), opacity 0.25s, visibility 0s 0.6s; }
    .card.open .details { max-width: none; max-height: 640px; transition: max-height 0.6s cubic-bezier(0.3, 1, 0.4, 1), opacity 0.4s 0.22s, visibility 0s; }
    .details-inner { width: auto; padding: 6px 18px 20px; }
    .close { top: 2px; right: 12px; }
    .eyebrow { padding-right: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
    }
    .card.open .bubble { animation: none; }
  }
</style>
</head>
<body data-flavour="lime">
<main class="stage">
  <div class="cart-pill" id="cart-pill" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
    <span class="sr-only">Items in cart:</span><b id="cart-count">0</b>
  </div>

  <article class="card" id="card" aria-labelledby="flavour-name">
    <div class="can-side">
      <span class="brand" aria-hidden="true">fizzlo</span>
      <button class="can-btn" id="can" type="button" aria-expanded="false" aria-controls="details">
        <span class="sr-only" id="can-label">Fizzlo Lime Mint can. Show details</span>
        <span class="can-tilt">
        <svg class="can" viewBox="0 0 120 220" aria-hidden="true">
          <defs>
            <linearGradient id="g-body" x1="0" x2="1">
              <stop offset="0" class="s-dark" />
              <stop offset="0.22" class="s-main" />
              <stop offset="0.4" class="s-light" />
              <stop offset="0.62" class="s-main" />
              <stop offset="1" class="s-dark" />
            </linearGradient>
            <linearGradient id="g-metal" x1="0" x2="1">
              <stop offset="0" class="m-b" />
              <stop offset="0.35" class="m-a" />
              <stop offset="0.7" class="m-b" />
              <stop offset="1" class="m-b" />
            </linearGradient>
          </defs>
          <!-- body -->
          <rect x="10" y="22" width="100" height="178" rx="12" fill="url(#g-body)" />
          <!-- top and bottom metal -->
          <path d="M14 26C14 14 20 10 30 9H90C100 10 106 14 106 26Z" fill="url(#g-metal)" />
          <ellipse cx="60" cy="10" rx="31" ry="5" fill="url(#g-metal)" />
          <ellipse cx="60" cy="10" rx="25" ry="3.4" fill="#8b909b" opacity=".5" />
          <rect x="52" y="5" width="18" height="6" rx="3" fill="none" stroke="#9aa0ab" stroke-width="2" />
          <path d="M12 196H108C108 206 102 212 92 212H28C18 212 12 206 12 196Z" fill="url(#g-metal)" />
          <!-- label -->
          <text x="60" y="66" text-anchor="middle" class="ink" font-family="system-ui, sans-serif" font-size="25" font-weight="900" font-style="italic" letter-spacing="-1">fizzlo</text>
          <text x="60" y="82" text-anchor="middle" class="ink-soft" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">SPARKLING</text>
          <!-- fruit drawings -->
          <g class="fruit lime">
            <circle cx="60" cy="134" r="26" fill="#e9ffd6" />
            <circle cx="60" cy="134" r="22" fill="#9be15d" />
            <path d="M60 134V112M60 134L79 123M60 134L79 145M60 134V156M60 134L41 145M60 134L41 123" stroke="#e9ffd6" stroke-width="2.4" stroke-linecap="round" />
            <path d="M76 104c8-8 18-6 22-2-6 6-14 8-22 2z" fill="#1d7a35" />
          </g>
          <g class="fruit mango">
            <path d="M44 150c-8-22 6-44 26-42 16 2 22 20 14 34-8 14-30 24-40 8z" fill="#ffd166" />
            <path d="M50 146c-4-14 4-28 16-30" stroke="#fff3c4" stroke-width="3" fill="none" stroke-linecap="round" />
            <path d="M80 158c8 2 16-2 18-10l3 1c-2 11-12 16-22 13z" fill="#e63946" />
            <path d="M68 108c2-6 8-8 12-6" stroke="#2f7d32" stroke-width="3" fill="none" stroke-linecap="round" />
          </g>
          <g class="fruit guava">
            <circle cx="60" cy="134" r="26" fill="#c8e88a" />
            <circle cx="60" cy="134" r="20" fill="#ff8fab" />
            <g fill="#fff4b0"><circle cx="54" cy="128" r="2" /><circle cx="64" cy="126" r="2" /><circle cx="68" cy="136" r="2" /><circle cx="58" cy="140" r="2" /><circle cx="50" cy="137" r="2" /><circle cx="62" cy="146" r="2" /></g>
          </g>
          <text x="60" y="182" text-anchor="middle" class="ink-soft" font-family="system-ui, sans-serif" font-size="9" font-weight="700" id="can-flavour">LIME MINT</text>
          <!-- shine down the side of the can -->
          <rect x="26" y="26" width="7" height="168" rx="3.5" fill="#fff" opacity=".28" />
        </svg>
        </span>
      </button>
      <span class="spray" id="spray" aria-hidden="true"></span>
      <span class="hint" aria-hidden="true">Tap the can</span>
      <span class="bubbles" id="bubbles" aria-hidden="true"></span>
    </div>

    <div class="details" id="details">
      <div class="details-inner">
        <button class="close" id="close" type="button" aria-label="Close details">×</button>
        <p class="eyebrow">Fizzlo sparkling · 0% colouring</p>
        <h2 id="flavour-name">Lime Mint</h2>
        <p class="desc" id="flavour-desc"></p>

        <fieldset>
          <legend>Flavour</legend>
          <div class="swatches">
            <label class="opt"><input type="radio" name="flavour" value="lime" checked /><span><i style="background:#34b556"></i>Lime Mint</span></label>
            <label class="opt"><input type="radio" name="flavour" value="mango" /><span><i style="background:#ff9417"></i>Mango Chili</span></label>
            <label class="opt"><input type="radio" name="flavour" value="guava" /><span><i style="background:#f2557f"></i>Pink Guava</span></label>
          </div>
        </fieldset>

        <div class="facts" id="facts"></div>

        <fieldset>
          <legend>Size</legend>
          <div class="sizes">
            <label class="opt"><input type="radio" name="size" value="250" checked /><span>250 ml · PKR 120</span></label>
            <label class="opt"><input type="radio" name="size" value="330" /><span>330 ml · PKR 160</span></label>
          </div>
        </fieldset>

        <div class="buy">
          <div class="qty" role="group" aria-label="Quantity">
            <button type="button" id="minus" aria-label="One less">−</button>
            <output id="qty" aria-live="polite">2</output>
            <button type="button" id="plus" aria-label="One more">+</button>
          </div>
          <button class="add" id="add" type="button" data-state="idle">Add to cart · PKR 240</button>
        </div>
      </div>
    </div>
  </article>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    var card = document.getElementById("card");
    var can = document.getElementById("can");
    var canLabel = document.getElementById("can-label");
    var canFlavour = document.getElementById("can-flavour");
    var nameEl = document.getElementById("flavour-name");
    var descEl = document.getElementById("flavour-desc");
    var factsEl = document.getElementById("facts");
    var qtyEl = document.getElementById("qty");
    var add = document.getElementById("add");
    var cartPill = document.getElementById("cart-pill");
    var cartCount = document.getElementById("cart-count");
    var status = document.getElementById("status");
    var side = document.querySelector(".can-side");
    var tilt = document.querySelector(".can-tilt");
    var canSvg = tilt.querySelector("svg");
    var spray = document.getElementById("spray");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");

    // ---------- The can leans toward the pointer ----------
    side.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse" || reduce.matches) return;
      var r = side.getBoundingClientRect();
      tilt.style.setProperty("--ry", ((e.clientX - r.left) / r.width - 0.5) * 34 + "deg");
      tilt.style.setProperty("--rx", (0.5 - (e.clientY - r.top) / r.height) * 22 + "deg");
    });
    side.addEventListener("pointerleave", function () {
      tilt.style.setProperty("--rx", "0deg");
      tilt.style.setProperty("--ry", "0deg");
    });

    // ---------- A burst of droplets from the top of the can ----------
    function burst() {
      if (reduce.matches || !spray.animate) return;
      for (var k = 0; k < 14; k++) {
        var d = document.createElement("i");
        spray.appendChild(d);
        var a = (-160 + Math.random() * 140) * Math.PI / 180;
        var dist = 50 + Math.random() * 60;
        var dx = Math.cos(a) * dist, dy = Math.sin(a) * dist;
        var s = 0.5 + Math.random() * 0.8;
        d.animate([
          { transform: "translate(0,0) scale(0.3)", opacity: 1 },
          { transform: "translate(" + dx * 0.7 + "px," + dy + "px) scale(" + s + ")", opacity: 1, offset: 0.45 },
          { transform: "translate(" + dx + "px," + (dy + 70) + "px) scale(" + s * 0.6 + ")", opacity: 0 }
        ], { duration: 700 + Math.random() * 300, easing: "cubic-bezier(.2,.7,.5,1)", delay: Math.random() * 80 }).onfinish = (function (el) {
          return function () { el.remove(); };
        })(d);
      }
    }

    var FLAVOURS = {
      lime: { name: "Lime Mint", desc: "Squeezed lime, cool mint and soft bubbles. Bright, sharp and very cold.", sugar: 6, kcal: 45, fizz: 4 },
      mango: { name: "Mango Chili", desc: "Ripe summer mango with a warm pinch of red chili at the end.", sugar: 9, kcal: 62, fizz: 3 },
      guava: { name: "Pink Guava", desc: "Pink guava with a little black salt, the way it tastes from a street cart.", sugar: 7, kcal: 51, fizz: 5 }
    };
    var PRICES = { 250: 120, 330: 160 };
    var flavour = "lime", size = 250, qty = 2, cart = 0, timers = [];

    // ---------- Bubbles (made once, they only move while open) ----------
    var bubbles = document.getElementById("bubbles");
    for (var i = 0; i < 12; i++) {
      var b = document.createElement("span");
      var s = 5 + Math.random() * 9;
      b.className = "bubble";
      b.style.width = b.style.height = s + "px";
      b.style.left = 38 + Math.random() * 24 + "%";
      b.style.setProperty("--d", 1.8 + Math.random() * 1.6 + "s");
      b.style.setProperty("--delay", -Math.random() * 2.4 + "s");
      b.style.setProperty("--drift", (Math.random() - 0.5) * 40 + "px");
      bubbles.appendChild(b);
    }

    // ---------- Fill in the details ----------
    function money(n) { return "PKR " + n.toLocaleString("en-US"); }
    function fact(label, value, pct) {
      return '<div class="fact"><b>' + value + "</b>" + label + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }
    function paintFlavour() {
      var f = FLAVOURS[flavour];
      document.body.dataset.flavour = flavour;
      nameEl.textContent = f.name;
      descEl.textContent = f.desc;
      canFlavour.textContent = f.name.toUpperCase();
      canLabel.textContent = "Fizzlo " + f.name + " can. " + (card.classList.contains("open") ? "Hide details" : "Show details");
      factsEl.innerHTML = fact("sugar", f.sugar + " g", f.sugar * 8) + fact("calories", f.kcal, f.kcal) + fact("fizz", f.fizz + "/5", f.fizz * 20);
    }
    function paintPrice() {
      if (String(qty) !== qtyEl.textContent) {
        qtyEl.classList.remove("tick");
        void qtyEl.offsetWidth;
        qtyEl.classList.add("tick");
      }
      qtyEl.textContent = qty;
      if (add.dataset.state === "idle") add.textContent = "Add to cart · " + money(PRICES[size] * qty);
    }

    // ---------- Open and close ----------
    function setOpen(open) {
      card.classList.toggle("open", open);
      can.setAttribute("aria-expanded", String(open));
      can.classList.remove("pop");
      void can.offsetWidth;
      can.classList.add("pop");
      if (open) burst();
      paintFlavour();
      status.textContent = open ? "Details opened" : "Details closed";
    }
    can.addEventListener("click", function () { setOpen(!card.classList.contains("open")); });
    document.getElementById("close").addEventListener("click", function () { setOpen(false); can.focus(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && card.classList.contains("open")) { setOpen(false); can.focus(); }
    });

    // ---------- Choices ----------
    card.addEventListener("change", function (e) {
      if (e.target.name === "flavour") {
        flavour = e.target.value;
        paintFlavour();
        status.textContent = FLAVOURS[flavour].name + " chosen";
        // the can spins round to show off the new label
        if (!reduce.matches && canSvg.animate) {
          canSvg.animate([{ rotate: "y 0deg" }, { rotate: "y 360deg" }], { duration: 750, easing: "cubic-bezier(.3,1.15,.5,1)" });
          burst();
        }
      }
      if (e.target.name === "size") { size = +e.target.value; paintPrice(); }
    });
    document.getElementById("minus").addEventListener("click", function () { qty = Math.max(1, qty - 1); paintPrice(); });
    document.getElementById("plus").addEventListener("click", function () { qty = Math.min(24, qty + 1); paintPrice(); });

    // ---------- Add to cart: idle → working → done → idle ----------
    add.addEventListener("click", function () {
      if (add.dataset.state !== "idle") return;
      add.dataset.state = "working";
      add.innerHTML = '<span class="spin" aria-hidden="true"></span>Adding…';
      timers.push(setTimeout(function () {
        cart += qty;
        cartCount.textContent = cart;
        cartPill.classList.remove("bump");
        void cartPill.offsetWidth;
        cartPill.classList.add("bump");
        add.dataset.state = "done";
        add.textContent = "Added ✓";
        status.textContent = qty + " " + FLAVOURS[flavour].name + " added to cart";
        timers.push(setTimeout(function () {
          add.dataset.state = "idle";
          paintPrice();
        }, 1600));
      }, 900));
    });

    paintFlavour();
    paintPrice();
  })();
</script>
</body>
</html>
