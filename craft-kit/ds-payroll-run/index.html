<!doctype html>
<!-- Chill & Craft · Payroll Run · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll Run · Monthly payroll in six steps</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: slate ink and mint on a cool paper white (light) / deep slate (dark) ---------- */
  :root {
    --bg: #f1f4f3; --band: #e3ebe8; --band-line: #d3dfdb;
    --side: #16212a; --side-2: #1e2b35; --side-ink: #d3dde2; --side-muted: #8597a2; --side-line: rgba(255,255,255,.08); --side-hover: rgba(255,255,255,.06);
    --surface: #ffffff; --surface-2: #f2f5f4; --panel: #ffffff; --paper: #ffffff; --paper-ink: #1a242c; --paper-line: #e3e8e6;
    --ink: #14202a; --muted: #5a6a75; --faint: #8b99a3; --line: #dce4e1; --grid: #e7edeb;
    --accent: #0e8c69; --accent-ink: #ffffff; --mint: #33c693; --mint-2: #93e4c5; --mint-soft: #d8f2e7;
    --slate: #34495c; --slate-2: #9bb0bf; --slate-soft: #e4eaee;
    --good: #0e8c69; --bad: #cc4a3f; --warn: #b4761b; --info: #3a72c2;
    --good-soft: #dcf2e8; --bad-soft: #fbe6e3; --warn-soft: #f8edd9; --info-soft: #e2ebf8;
    --c-fixed: #34495c; --c-ot: #2fbf8d; --c-bonus: #d9a43c; --c-er: #a7bac8; --c-net: #2fbf8d; --c-proj: #b9c8d2;
    --sk: rgba(52,73,92,.08); --sk-hi: rgba(255,255,255,.75);
    --radius: 14px; --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(20,32,42,.05), 0 8px 20px -14px rgba(20,32,42,.18);
    --shadow-lift: 0 2px 4px rgba(20,32,42,.06), 0 18px 34px -16px rgba(20,32,42,.3);
    --tip-bg: #16212a; --tip-ink: #fff; --overlay: rgba(12,20,26,.4); --track: #e6ecea;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0d141a; --band: #121d22; --band-line: #1e2c33;
    --side: #0a1015; --side-2: #121b22; --side-ink: #cdd8de; --side-muted: #74868f; --side-line: rgba(255,255,255,.07); --side-hover: rgba(255,255,255,.05);
    --surface: #141e25; --surface-2: #1a262e; --panel: #16212a; --paper: #eef2f0; --paper-ink: #17212a; --paper-line: #d6dedb;
    --ink: #e3ebee; --muted: #8fa1ac; --faint: #677985; --line: #23333c; --grid: #1d2a32;
    --accent: #3fd3a0; --accent-ink: #052019; --mint: #44dba6; --mint-2: #2f9e78; --mint-soft: rgba(63,211,160,.13);
    --slate: #9db8cc; --slate-2: #5d7787; --slate-soft: #1f2d36;
    --good: #4bd8a5; --bad: #ff7b6f; --warn: #f0b552; --info: #7fb0f2;
    --good-soft: rgba(75,216,165,.13); --bad-soft: rgba(255,123,111,.13); --warn-soft: rgba(240,181,82,.13); --info-soft: rgba(127,176,242,.13);
    --c-fixed: #7f9db3; --c-ot: #44dba6; --c-bonus: #e8b85a; --c-er: #3f5868; --c-net: #44dba6; --c-proj: #34495a;
    --sk: rgba(255,255,255,.06); --sk-hi: rgba(255,255,255,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.3), 0 20px 36px -18px rgba(0,0,0,.75);
    --tip-bg: #eef3f1; --tip-ink: #14202a; --overlay: rgba(0,0,0,.55); --track: #1f2c34;
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ===================== Payroll Run layout ===================== */
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p, dl, dd { margin: 0; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .r { text-align: right; }
  .tnum { font-variant-numeric: tabular-nums; }
  .btn { min-height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13px; }
  .btn .ic { width: 15px; height: 15px; }
  .btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.mint { background: var(--mint-soft); color: var(--accent); border-color: transparent; }
  .cc-chip { min-height: 28px; font-size: 12px; padding: 0 11px; }
  .cc-search { min-height: 34px; max-width: 280px; font-size: 13px; }
  .cc-tbl table { font-size: 12.5px; }
  .cc-tbl td { padding: 8px 10px; }
  .cc-tbl th { font-size: 10.5px; padding: 8px 10px; }
  .cc-dialog { font-size: 13px; }
  .cc-dh h2 { font-size: 16px; }

  /* App shell: slate sidebar + main column */
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 12px; padding: 14px 12px 12px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; z-index: 50; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; color: #fff; text-decoration: none; }
  .brand b { display: block; font-size: 15px; letter-spacing: -.01em; line-height: 1.2; }
  .brand small { display: block; font-size: 11px; color: var(--side-muted); }
  .brand .mark svg { display: block; }
  .org { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 11px; background: var(--side-2); border: 1px solid var(--side-line); color: inherit; text-align: left; transition: border-color .2s; }
  .org:hover { border-color: rgba(51,198,147,.45); }
  .org .lg { width: 30px; height: 30px; border-radius: 8px; background: #dff5ec; color: #0b6e52; font-weight: 800; font-size: 11px; display: grid; place-items: center; flex: none; letter-spacing: .02em; }
  .org b { display: block; font-size: 12.5px; color: #fff; }
  .org small { display: block; font-size: 11px; color: var(--side-muted); }
  .org .ic { color: var(--side-muted); }
  .nav { position: relative; display: grid; gap: 2px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 9px; color: var(--side-ink); text-decoration: none; font-weight: 500; transition: background .2s, color .2s; }
  .nav a:hover { background: var(--side-hover); color: #fff; }
  .nav a[aria-current="page"] { color: #fff; font-weight: 600; }
  .nav a .ic { color: var(--side-muted); transition: color .2s; }
  .nav a[aria-current="page"] .ic { color: var(--mint); }
  .nav .marker { position: absolute; left: 0; right: 0; top: 0; height: 34px; border-radius: 9px; background: rgba(51,198,147,.13); box-shadow: inset 3px 0 0 var(--mint); transition: transform .35s cubic-bezier(.2,.8,.2,1), height .35s, opacity .2s; pointer-events: none; }
  .nav .cnt { margin-left: auto; min-width: 22px; text-align: center; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.07); color: var(--side-muted); }
  .nav .cnt.hot { background: var(--mint); color: #052019; }
  .side h6 { display: flex; align-items: center; justify-content: space-between; margin: 2px 8px 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); }
  .side h6 button { border: 0; background: none; color: var(--mint); font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 2px 4px; border-radius: 6px; }
  .runmini { display: block; padding: 11px 12px; border-radius: 12px; background: var(--side-2); border: 1px solid var(--side-line); color: inherit; text-decoration: none; transition: border-color .2s; }
  .runmini:hover { border-color: rgba(51,198,147,.45); }
  .runmini .rt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; }
  .runmini .rt b { color: #fff; font-size: 12.5px; }
  .runmini .rt span { color: var(--side-muted); font-size: 11px; }
  .segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 9px 0 7px; }
  .segs i { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); }
  .segs i.on { background: var(--mint); }
  .segs i.cur { background: linear-gradient(90deg, var(--mint), rgba(255,255,255,.12)); background-size: 200% 100%; animation: segRun 1.6s linear infinite; }
  @keyframes segRun { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .runmini small { display: block; color: var(--side-muted); font-size: 11px; }
  .runmini small b { color: var(--mint); font-weight: 600; }
  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .people button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border: 0; border-radius: 9px; background: none; color: inherit; text-align: left; transition: background .2s; }
  .people button:hover { background: var(--side-hover); }
  .people b { display: block; font-size: 12.5px; font-weight: 600; color: #fff; line-height: 1.25; }
  .people small { display: block; font-size: 11px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .people .av-wrap { position: relative; flex: none; }
  .people .av-wrap i { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--side); background: var(--mint); }
  .people .av-wrap i.away { background: #c2a04a; }
  .people .av-wrap i.off { background: #5b6b75; }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; border-top: 1px solid var(--side-line); }
  .me b { display: block; font-size: 12.5px; color: #fff; }
  .me small { display: block; font-size: 11px; color: var(--side-muted); }
  .me .iconbtn { width: 30px; height: 30px; background: transparent; border-color: var(--side-line); color: var(--side-muted); }
  @media (max-height: 880px) { .people li:nth-child(n+4) { display: none; } }
  @media (max-height: 790px) { .ppl { display: none; } }

  /* Photo avatars: the photo is zoomed onto the face with --x/--y/--z; initials when there is no photo */
  .ph { position: relative; display: inline-block; border-radius: 50%; overflow: hidden; flex: none; background: var(--slate-soft); vertical-align: middle; }
  .ph img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(var(--z, 1)) translate(calc(50% - var(--x, 50%)), calc(50% - var(--y, 50%))); }
  .ini { display: inline-grid; place-items: center; flex: none; border-radius: 50%; font-weight: 700; letter-spacing: .02em; color: hsl(var(--h) 32% 30%); background: hsl(var(--h) 28% 89%); vertical-align: middle; }
  [data-theme="dark"] .ini { color: hsl(var(--h) 45% 82%); background: hsl(var(--h) 18% 23%); }
  .side .ini { color: hsl(var(--h) 45% 84%); background: hsl(var(--h) 18% 24%); }

  /* Top bar sits on the page band */
  .main { min-width: 0; display: flex; flex-direction: column; overflow-x: clip; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 28px; background: color-mix(in srgb, var(--band) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .search { display: flex; align-items: center; gap: 9px; flex: 0 1 360px; min-width: 0; height: 36px; padding: 0 8px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; text-align: left; transition: border-color .2s, box-shadow .2s; }
  .search:hover { border-color: var(--accent); }
  .search span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search kbd, .kbd { font: 600 11px/1 inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .top .sp { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill .lv { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); animation: live 2s ease-in-out infinite; }
  @keyframes live { 50% { box-shadow: 0 0 0 6px transparent; } }
  .iconbtn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .2s, background .2s; }
  .iconbtn:hover { border-color: var(--accent); }
  .iconbtn .dotn { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
  .iconbtn .dotn[hidden] { display: none; }
  [data-theme="dark"] .t-moon, [data-theme="light"] .t-sun { display: none; }
  .menu-btn, .tbrand { display: none; }

  /* Page band: kicker, title, actions, stat strip. Faint ledger rules run behind it. */
  .view { outline: none; }
  .view.swap { animation: viewIn .3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
  .band { position: relative; padding: 0 28px; background: var(--band); border-bottom: 1px solid var(--band-line); }
  .band::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, transparent 0 27px, color-mix(in srgb, var(--accent) 7%, transparent) 27px 28px); -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
  .band > * { position: relative; }
  .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 8px 0 16px; }
  .kick { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .kick .tag { font-size: 11px; }
  .phead h1 { margin: 3px 0 4px; font-size: 30px; line-height: 1.15; font-weight: 750; letter-spacing: -.022em; }
  .sub { display: flex; flex-wrap: wrap; gap: 3px 16px; color: var(--muted); font-size: 13px; }
  .sub b { color: var(--ink); font-weight: 650; }
  .sub .warnt { color: var(--warn); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--band-line); }
  .stat { min-width: 0; padding: 13px 18px 15px; border-left: 1px solid var(--band-line); }
  .stat:first-child { border-left: 0; padding-left: 0; }
  .stat .lb { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .stat .lb .ic { width: 14px; height: 14px; }
  .stat .v { display: flex; align-items: baseline; gap: 4px; margin: 3px 0 3px; font-size: 25px; line-height: 1.15; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .v small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .stat .ft { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11.5px; color: var(--muted); }
  .stat .meter { height: 5px; margin-top: 7px; border-radius: 3px; background: color-mix(in srgb, var(--slate) 12%, transparent); overflow: hidden; }
  .stat .meter i { display: block; height: 100%; width: var(--w); border-radius: 3px; background: var(--accent); animation: meter 1s .2s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes meter { from { width: 0; } }
  .delta { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--good-soft); color: var(--good); }
  .delta.dn { background: var(--bad-soft); color: var(--bad); }
  .delta.flat { background: var(--slate-soft); color: var(--muted); }
  .delta .ic { width: 11px; height: 11px; stroke-width: 2.4; }

  /* Content grid + cards */
  .wrap { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-content: start; padding: 20px 28px 36px; }
  .card { grid-column: span 12; min-width: 0; padding: 14px 16px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
  .lift { transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s; }
  .lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; }
  .ch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; margin-bottom: 10px; }
  .ch h2 { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; letter-spacing: -.005em; }
  .ch .meta { font-size: 12px; color: var(--muted); font-weight: 500; }
  .link { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; background: none; border: 0; padding: 2px 0; }
  .link:hover { text-decoration: underline; }
  .link .ic { width: 14px; height: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 99px; font-size: 11px; font-weight: 650; background: var(--slate-soft); color: var(--muted); white-space: nowrap; }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.info { background: var(--info-soft); color: var(--info); }
  .tag .ic { width: 12px; height: 12px; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who > span:last-child { min-width: 0; }
  .dept { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .dept i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .bar { display: block; height: 6px; border-radius: 4px; background: var(--track); overflow: hidden; }
  /* quicker stagger than the core default so the page fills fast */
  .cc-in { animation-duration: .5s; animation-delay: calc(var(--i, 0) * 32ms); }
  .bar i { display: block; height: 100%; width: var(--w); border-radius: 4px; background: var(--c, var(--accent)); animation: meter .9s .15s cubic-bezier(.2,.8,.2,1) both; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .seg button { min-height: 26px; padding: 0 11px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .rowacts { display: flex; gap: 4px; justify-content: flex-end; }
  .ib { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--muted); }
  .ib:hover { border-color: var(--line); background: var(--surface-2); color: var(--ink); }
  .ib.del:hover { color: var(--bad); }
  .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .list > li:first-child { border-top: 0; }
  .empty { display: grid; place-items: center; gap: 4px; padding: 24px 8px; color: var(--muted); text-align: center; }

  /* Skeleton shimmer on data-heavy blocks (about 400 ms) */
  [data-sk] { position: relative; }
  .sk-on > * { visibility: hidden; }
  .sk-on::after { content: ""; position: absolute; inset: 4px 0; border-radius: 8px; background: linear-gradient(100deg, transparent 30%, var(--sk-hi) 50%, transparent 70%) 0 0 / 220% 100%, repeating-linear-gradient(180deg, var(--sk) 0 14px, transparent 14px 30px); animation: skMove .9s linear infinite; }
  @keyframes skMove { from { background-position: 160% 0, 0 0; } to { background-position: -60% 0, 0 0; } }

  /* ===== Signature 1: the run pipeline. Steps light up mint as the run moves on ===== */
  .pipe { --dot: 42px; position: relative; padding-top: 2px; }
  .pipe.lg { --dot: 52px; }
  .pipe ol { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); list-style: none; margin: 0; padding: 0; }
  .pipe-track { position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: calc(var(--dot) / 2); height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--slate) 14%, transparent); overflow: hidden; }
  .pipe-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p, 0) * 100%); border-radius: 4px; background: linear-gradient(90deg, var(--mint-2), var(--mint)); transition: width .8s cubic-bezier(.6,.05,.3,1); overflow: hidden; }
  .pipe-fill::after { content: ""; position: absolute; top: 0; bottom: 0; left: -70px; width: 70px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); animation: spark 2.6s linear infinite; }
  @keyframes spark { to { left: 100%; } }
  .pipe li { display: flex; justify-content: center; min-width: 0; }
  .node { display: grid; justify-items: center; gap: 1px; width: 100%; max-width: 160px; padding: 0 4px 4px; border: 0; border-radius: 12px; background: none; color: inherit; text-align: center; }
  .node .dot { position: relative; display: grid; place-items: center; width: var(--dot); height: var(--dot); margin-bottom: 6px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--slate) 22%, transparent); background: var(--surface); color: var(--faint); transition: background .4s, border-color .4s, color .4s, box-shadow .4s; }
  .node .dot .ic { width: 42%; height: 42%; }
  .node .st { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .node b { font-size: 12.5px; font-weight: 650; }
  .node small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .pipe.lg .node b { font-size: 13.5px; }
  .pipe li.done .dot { background: var(--mint); border-color: var(--mint); color: #052019; box-shadow: 0 0 0 4px var(--mint-soft), 0 8px 20px -8px var(--mint); }
  .pipe li.done .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 0 var(--mint); animation: glowSeq 4.2s ease-out infinite; animation-delay: calc(var(--i) * .35s); }
  @keyframes glowSeq { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--mint) 70%, transparent); } 22%, 100% { box-shadow: 0 0 0 10px transparent; } }
  .pipe li.cur .dot { border-color: var(--mint); color: var(--accent); }
  .pipe li.cur .dot::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--mint); animation: halo 1.8s ease-out infinite; }
  @keyframes halo { from { transform: scale(.82); opacity: .8; } to { transform: scale(1.3); opacity: 0; } }
  .pipe li.cur .st { color: var(--accent); }
  .pipe li.todo .node { cursor: not-allowed; }
  .pipe li.todo b { color: var(--muted); }
  .pipe li.lit .dot { animation: lightUp .75s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes lightUp { 0% { transform: scale(.75); } 55% { transform: scale(1.14); } 100% { transform: none; } }
  .pipe li.arrive .dot { animation: arrive .5s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes arrive { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } }
  .ck path { stroke-dasharray: 1; stroke-dashoffset: 0; stroke-width: 2.8; }
  .pipe li.lit .ck path { animation: ckDraw .45s .15s ease-out both; }
  @keyframes ckDraw { from { stroke-dashoffset: 1; } }
  .node[aria-current="step"] b { color: var(--accent); }
  .node[aria-current="step"]::after { content: ""; display: block; width: 26px; height: 3px; margin-top: 5px; border-radius: 2px; background: var(--accent); }
  .pipe-wrap { padding: 4px 0 18px; overflow-x: auto; scrollbar-width: none; }

  /* Overview */
  .runfacts { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  .fact { padding: 11px 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
  .fact small { display: block; font-size: 11.5px; color: var(--muted); }
  .fact b { display: block; margin: 2px 0 1px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .fact span { font-size: 11.5px; color: var(--muted); }
  .fact.next { background: color-mix(in srgb, var(--mint) 10%, var(--surface)); border-color: color-mix(in srgb, var(--mint) 35%, transparent); display: flex; gap: 10px; align-items: center; }
  .fact.next .btn { margin-left: auto; }
  .payday { display: grid; grid-template-columns: 116px 1fr; gap: 14px; align-items: center; }
  .ring { position: relative; width: 116px; height: 116px; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring .rt { fill: none; stroke: var(--track); stroke-width: 9; }
  .ring .rf { fill: none; stroke: var(--mint); stroke-width: 9; stroke-linecap: round; }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .c b { font-size: 26px; line-height: 1; font-weight: 750; letter-spacing: -.02em; }
  .ring .c small { font-size: 11px; color: var(--muted); }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12.5px; }
  .checks li { display: flex; align-items: center; gap: 8px; }
  .checks .cb { display: grid; place-items: center; width: 18px; height: 18px; flex: none; border-radius: 6px; border: 1.5px solid var(--line); color: transparent; }
  .checks li.y .cb { background: var(--mint); border-color: var(--mint); color: #052019; }
  .checks li.now .cb { border-color: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
  .checks li.y span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }

  slip.classList.remove("done");
  lines.forEach((l) => l.classList.remove("on"));
  slip.style.clipPath = "inset(0 0 100% 0)";
  slip.classList.add("feeding");
  slip.classList.remove("pre");
  printer.classList.add("printing");
  const H = slip.offsetHeight || 600, head = $(".head", slip), T = 1700;
  let i = 0;
  const t0 = performance.now();
  const step = (now) => {
    if (tok !== printTok) return;
    const p = clamp((now - t0) / T, 0, 1), y = p * H;
    slip.style.clipPath = `inset(0 0 ${((1 - p) * 100).toFixed(2)}% 0)`;
    head.style.transform = `translateY(${y}px)`;
    if (pct) pct.textContent = Math.round(p * 100) + "%";
    while (i < lines.length && lines[i].offsetTop <= y + 4) {
      lines[i].classList.add("on");
      $$(".amt", lines[i]).forEach((a) => countUp(a, +a.dataset.v, (v) => num(Math.round(v)), 380));
      i++;
    }
    if (p < 1) requestAnimationFrame(step);
    else {
      lines.forEach((l) => l.classList.add("on"));
      slip.style.clipPath = "";
      slip.classList.remove("feeding");
      slip.classList.add("done");
      printer.classList.remove("printing");
      if (pct) pct.textContent = "Printed";
    }
  };
  requestAnimationFrame(step);
}

function wireSettings(root) {

    if (kind === "company") {
      const v = Object.fromEntries(["name", "short", "city", "addr", "ntn", "acct", "acct4", "rule"].map((k) => [k, el[k].value.trim()]));
      if (v.name.length < 3) err.name = "Enter the company name";
      if (!v.short) err.short = "Enter a short name";
      if (!v.city) err.city = "Enter the city";
      if (!/^\d{7}-\d$/.test(v.ntn)) err.ntn = "Use 7 digits, a dash and 1 digit";
      if (!/^\d{4}$/.test(v.acct4)) err.acct4 = "Use the last 4 digits";
      setErr();
      if (Object.keys(err).length) return;
      Object.assign(S.co, v); save(); toast("Company details saved"); refreshShell();
    } else if (kind === "rules") {
      const lim = { hra: [0, 100], util: [0, 50], med: [0, 50], pf: [0, 20], eobiEmp: [0, 5000], eobiEr: [0, 20000], otx: [1, 3], hours: [160, 240] };
      const v = {};
      Object.entries(lim).forEach(([k, [a, b]]) => { const x = parseFloat(el[k].value); if (isNaN(x)) err[k] = "Enter a number"; else if (x < a || x > b) err[k] = `Between ${a} and ${b}`; v[k] = x; });
      setErr();
      if (Object.keys(err).length) return;
      Object.assign(S.set, v); save(); toast(`Pay rules saved · ${S.emps.length} people recalculated`); refreshShell();
    } else if (kind === "slabs") {
      const out = S.set.slabs.map((s, i) => ({ upto: s.upto == null ? null : parseFloat(el["upto" + i].value), rate: parseFloat(el["rate" + i].value) }));
      const bad = out.findIndex((s, i) => isNaN(s.rate) || s.rate < 0 || s.rate > 60 || (s.upto != null && (isNaN(s.upto) || s.upto <= (i ? out[i - 1].upto : -1))));
      $("#slabErr").textContent = bad >= 0 ? `Band ${bad + 1}: limits must go up and rates must be between 0 and 60.` : "";
      if (bad >= 0) return;
      S.set.slabs = out; save(); toast("Tax slabs saved"); rerender();
    } else if (kind === "approvals") { S.set.approver = el.approver.value; save(); toast("Approver saved"); }
  });
  if (f.dataset.form === "approvals") f.elements.approver.addEventListener("change", () => f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit")));
}

/* ---------- Clicks everywhere (one listener, data-act names the action) ---------- */
const A = {
  go: (b) => { closeAll(); location.hash = "#/" + b.dataset.go; },
  step: (b) => {
    const i = +b.dataset.i;
    if (i > S.run.step) { toast(`Finish ${STEPS[Math.min(S.run.step, 5)].t} first`, "warn"); return; }
    if (ui.page !== "run") { ui.runView = i; location.hash = "#/run"; return; }
    showStep(Math.min(i, 5));
  },
  "step-done": () => stepDone(),
  sync: (b) => {
    b.disabled = true;
    const box = $("#stepCard .tscroll");
    if (box && !calm()) box.classList.add("sk-on");
    setTimeout(() => {
      let n = 0;
      Object.entries(S.run.att).forEach(([id, a]) => { if (a.p == null) { a.p = S.run.wd - (+a.l || 0) - (+a.u || 0); a.note = "From time clock"; n++; } });
      save();
      if (ui.page !== "run") return;
      showStep(0);
      const sc = $("#sumCard");
      if (sc) sc.innerHTML = sumHTML();
      refreshCaptions();
      refreshShell();
      toast(n ? `Time clock synced · ${n} ${n === 1 ? "record" : "records"} filled` : "Time clock synced · nothing new");
    }, calm() ? 0 : 900);
  },
  rowchip: (b) => { $$(".cc-chip", b.parentElement).forEach((c) => c.setAttribute("aria-pressed", String(c === b))); filterRows(b.closest("#stepCard")); },
  other: (b) => {
    const e = empById(b.dataset.id), cur = S.run.other[e.id] || { amt: 0, why: "" };
    formModal({
      title: "Other deduction", submit: "Save", intro: `${esc(e.name)} · net pay before this is ${money(pay(e).net + cur.amt)}`,
      values: { amt: cur.amt || "", why: cur.why },
      fields: [{ name: "amt", label: "Amount (Rs)", type: "number", min: 0, max: 200000, required: true, half: true }, { name: "why", label: "Reason", half: true, check: (v, all) => (all.amt > 0 && v.length < 3 ? "Say what it is for" : "") }],
      onSubmit: (v) => {
        if (v.amt > pay(e).net + cur.amt) return "That is more than the net pay";
        if (v.amt > 0) S.run.other[e.id] = { amt: Math.round(v.amt), why: v.why }; else delete S.run.other[e.id];
        reopenIfNeeded(); save(); showStep(ui.runView);
        const sc = $("#sumCard");
        if (sc) sc.innerHTML = sumHTML();
        refreshCaptions(); refreshShell();
        toast(v.amt > 0 ? `Deduction saved for ${first(e.name)}` : `Deduction removed for ${first(e.name)}`);
      },
    });
  },
  "run-restart": async () => {
    if (S.run.paidAt) { toast("This month is already paid. Start the next month from the Pay step.", "bad"); return; }
    const ok = await confirmBox(`Start ${monthName(S.run.month)} again from attendance? Hours and deductions you typed are cleared.`, "Start over");
    if (!ok) return;
    reseed(Date.now() % 1000);
    S.run = newRun(S.run.month, S.emps, pickGaps());
    ui.runView = 0;
    save(); render("run"); toast("Run started again");
  },
  "run-next": async () => {
    const ok = await confirmBox(`Close ${monthName(S.run.month)} and start ${monthName(addMonths(S.run.month, 1))}?`, "Start run", "primary");
    if (!ok) return;
    const T = totals();
    S.hist.push({ m: S.run.month, gross: T.earn, fixed: T.fixed - T.unpaid, ot: T.ot, otH: T.otH, bonus: 0, tax: T.tax, net: T.net, er: T.er, heads: S.emps.length, dept: T.dept, otDept: T.otDept });
    S.hist = S.hist.slice(-12);
    reseed(Date.now() % 1000);
    S.run = newRun(addMonths(S.run.month, 1), S.emps, pickGaps());
    S.run.started = iso(TODAY);
    ui.runView = 0;
    save(); render("run"); toast(`${monthName(S.run.month)} run started`);
  },
  "bank-dl": () => { downloadBank(); if (ui.page === "run") showStep(ui.runView); else rerender(); },
  "bank-again": (b) => { download(b.dataset.f, bankCSV()); toast(`${b.dataset.f} downloaded again`); },
  "bank-copy": () => {
    const rows = bankRows(), text = `${rows.length} transfers, total ${money(sum(rows.map((r) => r.amount)))}, hash ${sum(rows.map((r) => +r.iban.slice(-4)))}`;
    try { navigator.clipboard.writeText(text).then(() => toast("Totals copied"), () => toast(text)); } catch (e) { toast(text); }
  },
  "bank-head": (b) => { S.bankOpt.header = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", String(S.bankOpt.header)); save(); toast(S.bankOpt.header ? "Header row on" : "Header row off"); },
  emp: (b) => openEmp(b.dataset.id),
  "emp-add": () => empForm(null),
  "emp-edit": (b) => { const e = empById(b.dataset.id); closeAll(); if (e) empForm(e); },
  "emp-del": (b) => { const e = empById(b.dataset.id); if (e) delEmp(e); },
  "emp-slip": (b) => { ui.slip = b.dataset.id; ui.slipMonth = S.run.month; closeAll(); if (ui.page === "payslips") showSlip(); else location.hash = "#/payslips"; },
  "emp-csv": () => { download(`kestrel-employees-${S.run.month}.csv`, [["Employee ID", "Name", "Job title", "Department", "Joined", "Basic", "Gross", "Paid by", "Bank"]].concat(S.emps.map((e) => [e.id, e.name, e.role, e.dept, e.join, e.basic, pay(e).fixed, e.pay, e.pay === "bank" ? bankName(e.bank) : ""])).map((r) => r.map(csvCell).join(",")).join("\r\n") + "\r\n"); toast(`${S.emps.length} employees exported`); },
  iban: (b) => { const e = empById(b.dataset.id); const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "Hide" : "Show"; $("#ibanTxt").textContent = on ? spaced(e.iban) : maskIban(e.iban); },
  "slip-pick": (b) => { ui.slip = b.dataset.id; showSlip(); },
  "slip-prev": () => { const i = S.emps.findIndex((e) => e.id === ui.slip); ui.slip = S.emps[(i - 1 + S.emps.length) % S.emps.length].id; showSlip(); },
  "slip-next": () => { const i = S.emps.findIndex((e) => e.id === ui.slip); ui.slip = S.emps[(i + 1) % S.emps.length].id; showSlip(); },
  "slip-reprint": () => printSlip($("#view")),
  "slip-print": () => printNow(slipHTML(empById(ui.slip), ui.slipMonth)),
  "slip-printall": () => { printNow(S.emps.map((e) => slipHTML(e, ui.slipMonth || S.run.month)).join("")); toast(`${S.emps.length} payslips sent to the printer`); },
  "slip-mail1": () => toast(`Payslip emailed to ${empById(ui.slip).name}`),
  "slip-email": async () => {
    const ok = await confirmBox(`Email ${S.emps.length} payslips for ${monthName(S.run.month)}?${S.run.appr ? "" : " They are still drafts."}`, "Send", "primary");
    if (!ok) return;
    S.run.emailed = S.emps.length; save(); toast(`${S.emps.length} payslips emailed`); rerender();
  },
  "loan-new": (b) => loanForm(b.dataset.kind),
  "loan-chip": (b) => { ui.loanChip = b.dataset.v; rerender(); },
  "loan-skip": (b) => { const l = S.loans.find((x) => x.id === b.dataset.id); if (!l) return; l.skip = !l.skip; save(); toast(l.skip ? `${first(empById(l.emp).name)} skips the ${monShort(S.run.month)} instalment` : "Instalment back on"); rerender(); },
  "loan-extra": (b) => {
    const l = S.loans.find((x) => x.id === b.dataset.id); if (!l) return;
    const left = l.amount - l.paid, e = empById(l.emp);
    formModal({ title: "Extra repayment", submit: "Record payment", intro: `${esc(e.name)} owes ${money(left)} on this ${l.type.toLowerCase()}.`, values: { amt: Math.min(left, l.inst) }, fields: [{ name: "amt", label: "Amount paid in cash (Rs)", type: "number", required: true, min: 1, max: left }],
      onSubmit: (v) => { l.paid = Math.min(l.amount, l.paid + Math.round(v.amt)); if (l.paid >= l.amount) l.status = "closed"; save(); toast(l.status === "closed" ? `${first(e.name)}'s ${l.type.toLowerCase()} is fully repaid` : `${money(v.amt)} recorded`); rerender(); } });
  },
  "loan-ok": (b) => { const l = S.loans.find((x) => x.id === b.dataset.id); if (!l) return; if (activeLoans().some((x) => x.emp === l.emp && x.type === l.type)) { toast(`${first(empById(l.emp).name)} already has an active ${l.type.toLowerCase()}`, "bad"); return; } l.status = "active"; l.at = iso(TODAY); save(); toast(`${l.type} approved for ${first(empById(l.emp).name)} · first instalment this month`); rerender(); },
  "loan-no": async (b) => { const l = S.loans.find((x) => x.id === b.dataset.id); if (!l) return; const ok = await confirmBox(`Decline ${empById(l.emp).name}'s request for ${money(l.amount)}?`, "Decline"); if (!ok) return; l.status = "declined"; save(); toast("Request declined"); rerender(); },
  "tax-csv": () => { const r = reportCSV("tax"); download(r.name, r.text); toast("Tax statement downloaded"); },
  "tax-dep": (b) => {
    const m = b.dataset.m;
    formModal({ title: `Tax deposit · ${monthName(m)}`, submit: "Mark as deposited", values: { rcpt: "", at: iso(TODAY) }, fields: [{ name: "rcpt", label: "Receipt number", required: true, placeholder: "IT-2611-4471-09", check: (v) => (/^[A-Z0-9-]{6,24}$/i.test(v) ? "" : "Letters, numbers and dashes, 6 to 24 long") }, { name: "at", label: "Deposited on", type: "date", required: true }],
      onSubmit: (v) => { S.deps[m] = { at: v.at, rcpt: v.rcpt.toUpperCase() }; save(); toast(`${monthName(m)} tax marked as deposited`); rerender(); } });
  },
  range: (b) => { const pl = $("#payLine"); ui.prevLine = pl && pl._vals; ui.range = +b.dataset.n; ui.morph = true; rerender(); },
  "rep-dl": (b) => { const r = reportCSV(b.dataset.r); download(r.name, r.text); toast(`${r.name} downloaded`); },
  stab: (b) => { ui.stab = b.dataset.k; $$(".stabs [role=tab]").forEach((t) => { const on = t === b; t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1; }); const p = $("#stabPanel"); p.setAttribute("aria-labelledby", b.id); p.innerHTML = stabHTML(ui.stab); p.classList.remove("stepbody"); void p.offsetWidth; p.classList.add("stepbody"); wireSettings(p); },
  tog: (b) => { const k = b.dataset.k; S.set[k] = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", String(S.set[k])); save(); toast("Saved"); },
  calm: (b) => { const on = !document.documentElement.classList.contains("calm"); document.documentElement.classList.toggle("calm", on); b.setAttribute("aria-checked", String(on)); S.calm = on; save(); toast(on ? "Calm motion on" : "Calm motion off"); },
  "slab-reset": () => { S.set.slabs = SLABS.map((x) => ({ ...x })); save(); toast("Demo slabs back"); rerender(); },
  reset: async () => {
    const ok = await confirmBox("Reset all demo data? People, the run, loans and settings go back to the start.", "Reset");
    if (!ok) return;
    store.del(KEY);
    S = seed(); save();
    ui.runView = null; ui.slip = null; ui.stab = "company";
    document.documentElement.classList.remove("calm");
    shell(); markCurrent(); render(ui.page); requestAnimationFrame(moveMarkers);
    toast("Demo data reset");
  },
  "export-json": () => { download("payroll-run-demo.json", JSON.stringify(S, null, 2), "application/json"); toast("Exported"); },
  org: (b) => {
    popover(b, `<div class="popl"><div class="ph-t">Companies</div><button type="button" class="it" data-pop="cur">${ic("check")}<span><b>${esc(S.co.name)}</b><small>${S.emps.length} people · ${esc(S.co.city)}</small></span></button><button type="button" class="it" data-pop="other">${ic("building")}<span><b>Kestrel Print Works</b><small>12 people · Karachi · demo only</small></span></button><button type="button" class="it" data-pop="add">${ic("plus")}<span><b>Add a company</b><small>Separate payroll and bank file</small></span></button></div>`, (p, close) => {
      p.addEventListener("click", (ev) => { const x = ev.target.closest("[data-pop]"); if (!x) return; close(); if (x.dataset.pop !== "cur") toast("This demo has one company", "warn"); });
    });
  },
  bell: (b) => {
    popover(b, `<div class="popl"><div class="ph-t"><span>Notifications</span><button type="button" class="link" data-pop="read">Mark all read</button></div>${S.notes.slice(0, 6).map((n) => `<button type="button" class="it ${n.read ? "" : "unread"}" data-pop="${n.id}">${ic(n.ic)}<span><b>${esc(n.t)}</b><small>${esc(n.s)}</small></span></button>`).join("")}</div>`, (p, close) => {
      p.addEventListener("click", (ev) => {
        const x = ev.target.closest("[data-pop]"); if (!x) return;
        if (x.dataset.pop === "read") { S.notes.forEach((n) => (n.read = true)); save(); close(); refreshShell(); toast("All caught up"); return; }
        const n = S.notes.find((y) => y.id === x.dataset.pop); if (n) { n.read = true; save(); close(); refreshShell(); if (n.go) location.hash = "#/" + n.go; }
      });
    });
  },
  signout: () => toast("This is a demo, so you stay signed in", "warn"),
};
const closeAll = () => { while (modals.length) modals[modals.length - 1].close(); };
const markCurrent = () => $$('a[href^="#/"]').forEach((a) => (a.getAttribute("href") === "#/" + ui.page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
function pickGaps() {
  const pool = S.emps.filter((e) => OT_DEPTS.includes(e.dept));
  if (pool.length < 2) return pool.map((e) => e.id);
  const a = pick(pool);
  let b = pick(pool);
  if (b === a) b = pool[(pool.indexOf(a) + 1) % pool.length];
  return [a.id, b.id];
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled || b.getAttribute("aria-disabled") === "true" && b.dataset.act !== "step") return;
  const f = A[b.dataset.act];
  if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener("input", (e) => { const el = e.target; if (el.matches && el.matches("[data-in='att'],[data-in='ot']")) onRunInput(el); });
document.addEventListener("change", (e) => {
  const el = e.target;
  if (!el.matches) return;
  if (el.matches("[data-in='skip']")) onRunInput(el);
  if (el.matches("[data-in='theme']")) setTheme(el.value);
  if (el.matches("[data-in='tick']")) { const err = $("#apErr"); if (err) err.textContent = ""; S.run.tick = Object.fromEntries($$("[data-in='tick']").map((t) => [t.dataset.k, t.checked])); }
});
/* Arrow keys move between settings tabs */
document.addEventListener("keydown", (e) => {
  const t = e.target.closest && e.target.closest(".stabs [role=tab]");
  if (!t || !["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  const all = $$(".stabs [role=tab]"), i = all.indexOf(t), n = all[(i + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length];
  n.focus(); A.stab(n);
});

/* ---------- Command search (Ctrl+K) ---------- */
const cmds = () => pageCmds(PAGES, [
  { label: "Continue the run", icon: "play", hint: "Step " + Math.min(S.run.step + 1, 6), run: () => (location.hash = "#/run") },
  { label: "Add employee", icon: "plus", run: () => empForm(null) },
  { label: "New loan", icon: "coin", run: () => loanForm("Loan") },
  { label: "Salary advance", icon: "coin", run: () => loanForm("Advance") },
  { label: "Download bank file", icon: "download", run: () => downloadBank() },
  { label: "Download payroll register", icon: "download", run: () => { const r = reportCSV("register"); download(r.name, r.text); } },
  { label: "Switch theme", icon: "moon", run: () => setTheme(APP.theme() === "dark" ? "light" : "dark") },
  { label: "Reset demo data", icon: "refresh", hint: "Settings", run: () => { ui.stab = "data"; location.hash = "#/settings"; if (ui.page === "settings") rerender(); } },
]).concat(S.emps.map((e) => ({ label: e.name, icon: "user", hint: e.role, run: () => openEmp(e.id) })));

/* ---------- Start ---------- */
if (S.calm) document.documentElement.classList.add("calm");
shell();
initShell(cmds);
startRouter(PAGES.map((p) => p[0]), "overview", render);
</script>
