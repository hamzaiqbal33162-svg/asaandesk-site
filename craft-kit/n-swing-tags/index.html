<!doctype html>
<!-- Chill & Craft · Swing Tags · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Tags · price range filter</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: emerald cloth and saffron price tags ---------- */
  :root {
    color-scheme: light;
    --ff: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg1: #e6f2ea;
    --bg2: #fbf3e2;
    --card: #fffdf8;
    --ink: #12322a;
    --muted: #5c786f;
    --line: #e2ebe4;
    --rail: #d5e3da;
    --em: #0e6b55;
    --em2: #17a682;
    --saf: #f0a417;
    --saf2: #ffd77a;
    --bar: #dbe7df;
    --shadow: rgba(14, 80, 60, .2);
    --inset: 44px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg1: #06130f;
    --bg2: #15130a;
    --card: #0f201a;
    --ink: #e6f4ed;
    --muted: #92b2a7;
    --line: #1e3a31;
    --rail: #24453a;
    --em: #2fc79b;
    --em2: #7de6c5;
    --saf: #ffbd3a;
    --saf2: #ffe09a;
    --bar: #1c3129;
    --shadow: rgba(0, 0, 0, .6);
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg1);
    overflow-x: hidden;
  }
  .stage {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 22px 14px;
    background:
      radial-gradient(60% 50% at 15% 10%, color-mix(in srgb, var(--em2) 18%, transparent), transparent 70%),
      radial-gradient(55% 45% at 90% 95%, color-mix(in srgb, var(--saf) 20%, transparent), transparent 70%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    isolation: isolate;
  }
  /* a faint block-print motif behind the card */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .35;
    background:
      radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--em) 14%, transparent) 0 3px, transparent 4px) 0 0 / 34px 34px,
      radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--saf) 16%, transparent) 0 2px, transparent 3px) 17px 17px / 34px 34px;
    -webkit-mask: radial-gradient(70% 70% at 50% 50%, transparent 40%, #000);
    mask: radial-gradient(70% 70% at 50% 50%, transparent 40%, #000);
  }
  .card {
    position: relative;
    width: min(100%, 540px);
    padding: 20px 20px 18px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 34px 70px -40px var(--shadow), 0 10px 24px -18px var(--shadow);
  }

  /* ---------- Header ---------- */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 0 0 3px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--saf); box-shadow: 0 0 0 3px color-mix(in srgb, var(--saf) 25%, transparent); }
  h1 { margin: 0; font-size: clamp(20px, 5vw, 24px); letter-spacing: -.01em; }
  .count {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin: 0;
    padding: 7px 13px;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, var(--em), color-mix(in srgb, var(--em) 60%, var(--em2)));
    box-shadow: 0 8px 18px -10px var(--em);
    font-size: 12px;
    white-space: nowrap;
  }
  [data-theme="dark"] .count { color: #04261c; }
  .count b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .count.pop { animation: pop .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop { 30% { transform: scale(1.14) rotate(-3deg); } }
  .spark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 10px;
    margin: -5px 0 0 -3px;
    border-radius: 2px 2px 3px 3px;
    background: var(--saf);
    pointer-events: none;
  }

  /* ---------- Chart + slider zone ---------- */
  .zone { position: relative; margin-top: 18px; }
  .chart {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 84px;
    padding: 0 var(--inset);
    transition: opacity .35s, transform .45s cubic-bezier(.34, 1.4, .64, 1);
  }
  .chart::after {
    /* a slow light sweep over the bars (idle motion) */
    content: "";
    position: absolute;
    inset: 0 var(--inset);
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%) -150% 0 / 60% 100% no-repeat;
    animation: sheen 5.5s ease-in-out 1.2s infinite;
    pointer-events: none;
  }
  [data-theme="dark"] .chart::after { background-image: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .1) 50%, transparent 70%); }
  @keyframes sheen { 0%, 55% { background-position: -150% 0; } 100% { background-position: 260% 0; } }
  .bar {
    flex: 1;
    height: var(--h);
    min-height: 4px;
    border-radius: 4px 4px 2px 2px;
    background: var(--bar);
    transform-origin: 50% 100%;
    transition: background-color .3s, transform .55s cubic-bezier(.34, 1.56, .64, 1) var(--d, 0s), opacity .3s var(--d, 0s);
  }
  .bar.in {
    background: linear-gradient(180deg, var(--em2), var(--em));
    box-shadow: inset 0 3px 0 var(--saf);
  }
  .bar.hop { animation: hop .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes hop { 40% { transform: scaleY(1.2); } }

  .slider {
    position: relative;
    height: 126px;
    touch-action: none;
    cursor: pointer;
    transition: opacity .35s, transform .45s cubic-bezier(.34, 1.4, .64, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .rail, .fill {
    position: absolute;
    top: 14px;
    height: 6px;
    border-radius: 6px;
  }
  .rail { left: var(--inset); right: var(--inset); background: var(--rail); }
  .fill {
    left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--a, 0));
    right: calc(var(--inset) + (100% - 2 * var(--inset)) * (1 - var(--b, 1)));
    background: linear-gradient(90deg, var(--saf), var(--em2) 30%, var(--em));
    box-shadow: 0 0 12px -2px color-mix(in srgb, var(--em2) 70%, transparent);
  }
  .thumb {
    position: absolute;
    z-index: 3;
    top: 17px;
    left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--f, 0));
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--em);
    box-shadow: 0 4px 10px -3px var(--shadow), 0 0 0 0 color-mix(in srgb, var(--em2) 40%, transparent);
    cursor: grab;
    transition: transform .4s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s;
    outline: none;
  }
  .thumb[data-i="0"] { border-color: var(--saf); }
  .thumb::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: currentColor; color: var(--em); opacity: .9; }
  .thumb[data-i="0"]::after { color: var(--saf); }
  .thumb:hover { transform: scale(1.1); }
  .thumb.grab { cursor: grabbing; transform: scale(1.2); box-shadow: 0 6px 14px -4px var(--shadow), 0 0 0 8px color-mix(in srgb, var(--em2) 20%, transparent); }
  .thumb:focus-visible { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--saf); }
  .thumb.top { z-index: 4; }

  /* The hanging tag: rotates round the knob like a pendulum (angle set from script) */
  .hang {
    position: absolute;
    z-index: 2;
    top: 17px;
    left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--f, 0));
    width: 0;
    height: 0;
    transform: rotate(var(--r, 0deg));
    pointer-events: none;
    filter: drop-shadow(0 7px 7px var(--shadow));
  }
  .string {
    position: absolute;
    left: -1px;
    top: 0;
    width: 2px;
    height: calc(var(--len, 16px) + 15px);
    border-radius: 2px;
    background: linear-gradient(var(--muted), color-mix(in srgb, var(--muted) 60%, transparent));
  }
  .tag {
    position: absolute;
    top: calc(var(--len, 16px) + 9px);
    left: 0;
    display: flex;
    align-items: baseline;
    gap: 4px;
    padding: 15px 11px 7px;
    border-radius: 6px 6px 9px 9px;
    transform: translateX(-50%);
    white-space: nowrap;
    color: #3a2400;
    background: linear-gradient(170deg, var(--saf2), var(--saf));
    clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 11px, 100% 100%, 0 100%, 0 11px);
    font-variant-numeric: tabular-nums;
  }
  .hang[data-i="1"] .tag { color: #fff; background: linear-gradient(170deg, var(--em2), var(--em)); }
  [data-theme="dark"] .hang[data-i="1"] .tag { color: #032318; }
  .tag::before {
    /* the punched hole the string goes through */
    content: "";
    position: absolute;
    left: 50%;
    top: 5px;
    width: 7px;
    height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    background: var(--card);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35);
  }
  .tag small { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; opacity: .75; }
  .tag b { font-size: 15px; }
  .tag.bump { animation: bump .32s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes bump { 40% { transform: translateX(-50%) scale(1.08); } }

  /* ---------- Results that replace the chart ---------- */
  .results {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px 0;
    visibility: hidden;
  }
  .zone.show .results { visibility: visible; }
  .zone.sinking .bar:not(.in) { transform: scaleY(0); opacity: 0; }
  .zone.sinking .bar.in { transform: scaleY(1.08); filter: brightness(1.12); }
  .zone.show .chart, .zone.show .slider { opacity: 0; transform: translateY(-10px) scale(.97); pointer-events: none; }
  .rhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
  .rhead b { color: var(--ink); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .item {
    min-width: 0;
    padding: 7px 7px 9px;
    border-radius: 16px;
    background: color-mix(in srgb, var(--card) 70%, var(--bg1));
    border: 1px solid var(--line);
    opacity: 0;
    transform: translateY(36px) rotate(var(--tilt, 0deg)) scale(.9);
  }
  .zone.show .item { animation: land .7s cubic-bezier(.34, 1.45, .64, 1) var(--d) forwards; }
  @keyframes land {
    0% { opacity: 0; transform: translateY(36px) rotate(var(--tilt)) scale(.9); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  .swatch {
    position: relative;
    height: 70px;
    border-radius: 11px;
    overflow: hidden;
    box-shadow: inset 0 -10px 18px -10px rgba(0, 0, 0, .35);
  }
  .swatch::after {
    /* a soft diagonal fold across the cloth */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(125deg, rgba(255, 255, 255, .28) 0 38%, rgba(0, 0, 0, .14) 39%, transparent 58%);
  }
  .item p { margin: 7px 2px 0; font-size: 12px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item b { display: block; margin: 3px 2px 0; font-size: 13px; color: var(--em); font-variant-numeric: tabular-nums; }
  .more { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* ---------- Fields and quick ranges ---------- */
  .controls { display: grid; gap: 10px; margin-top: 4px; }
  .fields { display: flex; align-items: center; gap: 8px; }
  .field {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 0 12px;
    height: 42px;
    border-radius: 13px;
    border: 1.5px solid var(--line);
    background: color-mix(in srgb, var(--card) 85%, var(--bg1));
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within { border-color: var(--em2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--em2) 20%, transparent); }
  .field span { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .field input {
    flex: 1;
    width: 0;
    min-width: 0;
    border: 0;
    outline: none;
    background: none;
    color: var(--ink);
    font: 600 15px/1 var(--ff);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .field.bad { border-color: #e0533d; animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
  .to { font-size: 12px; color: var(--muted); }
  .presets { display: flex; flex-wrap: wrap; gap: 7px; }
  .presets button {
    flex: 1 1 auto;
    padding: 8px 11px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: none;
    color: var(--ink);
    font: 600 12.5px/1 var(--ff);
    cursor: pointer;
    transition: background .25s, color .25s, border-color .25s, transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .presets button:hover { border-color: var(--em2); }
  .presets button:active { transform: scale(.94); }
  .presets button[aria-pressed="true"] { background: var(--em); border-color: var(--em); color: #fff; transform: scale(1.04); }
  [data-theme="dark"] .presets button[aria-pressed="true"] { color: #032318; }
  .presets button:focus-visible, .go:focus-visible { outline: 3px solid var(--saf); outline-offset: 2px; }

  /* ---------- Main button ---------- */
  .go {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: 50px;
    margin-top: 14px;
    border: 0;
    border-radius: 16px;
    overflow: hidden;
    color: #fff;
    background: linear-gradient(135deg, var(--em), color-mix(in srgb, var(--em) 55%, var(--em2)));
    box-shadow: 0 14px 26px -16px var(--em);
    font: 700 15px/1 var(--ff);
    cursor: pointer;
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), filter .2s;
  }
  [data-theme="dark"] .go { color: #032318; }
  .go:hover { filter: brightness(1.06); }
  .go:active, .go.press { transform: scale(.96, .92); }
  .go::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .3) 50%, transparent 65%) -120% 0 / 70% 100% no-repeat;
    animation: sheen 4.5s ease-in-out 2s infinite;
  }
  .go > span { grid-area: 1 / 1; transition: opacity .25s, transform .4s cubic-bezier(.34, 1.56, .64, 1); }
  .go b { font-variant-numeric: tabular-nums; }
  .dots { display: flex; gap: 6px; opacity: 0; transform: translateY(14px); }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: dot .9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .12s; }
  .dots i:nth-child(3) { animation-delay: .24s; }
  @keyframes dot { 40% { transform: translateY(-7px); } }
  .go.working .label { opacity: 0; transform: translateY(-14px); }
  .go.working .dots { opacity: 1; transform: none; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 400px) {
    :root { --inset: 42px; }
    .card { padding: 18px 15px 16px; border-radius: 24px; }
    .cards { gap: 7px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <header class="head">
      <div>
        <p class="eyebrow"><i></i>Summer lawn · 3-piece</p>
        <h1 id="title">Price range</h1>
      </div>
      <p class="count" id="countBox"><b id="count">0</b><span>suits</span></p>
    </header>

    <div class="zone" id="zone">
      <div class="chart" id="chart" aria-hidden="true"></div>
      <div class="slider" id="slider">
        <div class="rail"></div>
        <div class="fill" id="fill"></div>
        <div class="hang" data-i="0" aria-hidden="true"><i class="string"></i><span class="tag"><small>PKR</small><b>1,500</b></span></div>
        <div class="hang" data-i="1" aria-hidden="true"><i class="string"></i><span class="tag"><small>PKR</small><b>25,000</b></span></div>
        <div class="thumb" data-i="0" role="slider" tabindex="0" aria-label="Lowest price" aria-valuemin="1500" aria-valuemax="25000"></div>
        <div class="thumb" data-i="1" role="slider" tabindex="0" aria-label="Highest price" aria-valuemin="1500" aria-valuemax="25000"></div>
      </div>
      <div class="results" id="results" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <div class="fields">
        <label class="field" id="f0"><span>Min</span><input id="in0" inputmode="numeric" autocomplete="off" aria-label="Lowest price in rupees"></label>
        <span class="to" aria-hidden="true">to</span>
        <label class="field" id="f1"><span>Max</span><input id="in1" inputmode="numeric" autocomplete="off" aria-label="Highest price in rupees"></label>
      </div>
      <div class="presets" role="group" aria-label="Quick price ranges">
        <button type="button" data-r="1500,5000" aria-pressed="false">Under 5k</button>
        <button type="button" data-r="5000,10000" aria-pressed="false">5k to 10k</button>
        <button type="button" data-r="10000,18000" aria-pressed="false">10k to 18k</button>
        <button type="button" data-r="18000,25000" aria-pressed="false">Luxury 18k+</button>
      </div>
    </div>

    <button class="go" id="go" type="button"><span class="label" id="goLabel">Show <b id="goN">0</b> suits</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
    <p class="sr" id="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MIN = 1500, MAX = 25000, STEP = 500, GAP = 500;
  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (n) { return Math.round(n).toLocaleString("en-US"); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  var zone = $("#zone"), chart = $("#chart"), slider = $("#slider"), fill = $("#fill");
  var thumbs = [].slice.call(document.querySelectorAll(".thumb"));
  var hangs = [].slice.call(document.querySelectorAll(".hang"));
  var tags = hangs.map(function (h) { return h.querySelector(".tag b"); });
  var inputs = [$("#in0"), $("#in1")], fields = [$("#f0"), $("#f1")];
  var presets = [].slice.call(document.querySelectorAll(".presets button"));
  var go = $("#go"), goLabel = $("#goLabel"), goN = $("#goN"), countEl = $("#count"), countBox = $("#countBox");
  var results = $("#results"), status = $("#status");

  // ---------- Made-up stock: how many suits sit in each 1,000-rupee band (most mid-range, a premium bump) ----------
  var bins = [];
  for (var p = MIN; p < MAX; p += 1000) {
    var mid = p + 500;
    var n = 64 * Math.exp(-Math.pow((mid - 6200) / 3300, 2)) + 24 * Math.exp(-Math.pow((mid - 16500) / 2700, 2)) + 3 + ((p / 500) * 7) % 5;
    bins.push({ from: p, to: Math.min(p + 1000, MAX), n: Math.round(n) });
  }
  var top = Math.max.apply(null, bins.map(function (b) { return b.n; }));
  var bars = bins.map(function (b, i) {
    var el = document.createElement("i");
    el.className = "bar";
    el.style.setProperty("--h", (b.n / top) * 100 + "%");
    el.style.setProperty("--d", (Math.abs(i - bins.length / 2) * 0.018).toFixed(3) + "s");
    el.addEventListener("animationend", function () { el.classList.remove("hop"); });
    chart.appendChild(el);
    return el;
  });
  function countIn(lo, hi) {
    var sum = 0;
    bins.forEach(function (b) {
      var o = Math.min(hi, b.to) - Math.max(lo, b.from);
      if (o > 0) sum += b.n * (o / (b.to - b.from));
    });
    return Math.round(sum);
  }

  // ---------- State: pos = smooth position (drawn), val = snapped value (what the filter uses) ----------
  var pos = [MIN, MAX], val = [MIN, MAX];
  var shown = 0, countTween = 0, open = false, busy = false;

  function snap(v) { return clamp(Math.round(v / STEP) * STEP, MIN, MAX); }
  function frac(v) { return (v - MIN) / (MAX - MIN); }

  function render() {
    thumbs.forEach(function (t, i) {
      var f = frac(pos[i]);
      t.style.setProperty("--f", f);
      hangs[i].style.setProperty("--f", f);
      t.setAttribute("aria-valuenow", val[i]);
      t.setAttribute("aria-valuetext", "PKR " + fmt(val[i]));

        var tag = tags[i].parentNode;
        tag.classList.remove("bump"); void tag.offsetWidth; tag.classList.add("bump");
      }
      if (document.activeElement !== inputs[i]) inputs[i].value = txt;
    });
    // the thumb nearer the far end stays on top so both can always be grabbed
    thumbs[0].classList.toggle("top", pos[0] > MAX - 3000);
    fill.style.setProperty("--a", frac(pos[0]));
    fill.style.setProperty("--b", frac(pos[1]));
    thumbs[0].setAttribute("aria-valuemax", val[1] - GAP);
    thumbs[1].setAttribute("aria-valuemin", val[0] + GAP);
    bars.forEach(function (el, i) {
      var b = bins[i], inside = (b.from + b.to) / 2 >= val[0] && (b.from + b.to) / 2 <= val[1];
      if (inside !== el.classList.contains("in")) {
        el.classList.toggle("in", inside);
        if (inside && !reduceMq.matches) { el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); }
      }
    });
    presets.forEach(function (b) {
      var r = b.dataset.r.split(",").map(Number);
      b.setAttribute("aria-pressed", String(r[0] === val[0] && r[1] === val[1]));
    });

  }

  // The count badge and the button number roll to the new total
  function tweenCount(to) {
    if (to === countTween) return;
    var from = shown, t0 = performance.now(), ms = reduceMq.matches ? 1 : 420;
    countTween = to;
    (function step(t) {
      if (countTween !== to) return;
      var k = Math.min(1, (t - t0) / ms);
      shown = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      countEl.textContent = shown;
      goN.textContent = shown;
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  // Move one end (smooth while dragging), keeping a 500-rupee gap to the other end
  function moveTo(i, v) {
    if (i === 0) v = clamp(v, MIN, val[1] - GAP); else v = clamp(v, val[0] + GAP, MAX);
    pos[i] = v;
    val[i] = i === 0 ? Math.min(snap(v), val[1] - GAP) : Math.max(snap(v), val[0] + GAP);
    render();
  }

  // Glide both ends to a range (presets, keyboard, fields, the demo): the tags swing as they travel
  var glideId = 0;
  function glide(lo, hi, ms) {
    var id = ++glideId, from = pos.slice(), t0 = performance.now();
    ms = reduceMq.matches ? 1 : ms || 650;
    return new Promise(function (done) {
      (function step(t) {
        if (id !== glideId) return done();
        var k = Math.min(1, (t - t0) / ms);
        var e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        pos[0] = from[0] + (lo - from[0]) * e;
        pos[1] = from[1] + (hi - from[1]) * e;
        val[0] = snap(pos[0]); val[1] = Math.max(snap(pos[1]), val[0] + GAP);
        if (k >= 1) { pos = [lo, hi]; val = [lo, hi]; }
        render();
        if (k < 1) requestAnimationFrame(step); else done();
      })(t0);
    });
  }

  // ---------- Pointer: grab a knob, or press the rail to pull the nearest one ----------
  var drag = null;
  function valueAt(x) {
    var r = slider.getBoundingClientRect();
    return MIN + clamp((x - r.left - inset) / (r.width - 2 * inset), 0, 1) * (MAX - MIN);
  }
  slider.addEventListener("pointerdown", function (e) {
    if (open || e.button > 0) return;
    var v = valueAt(e.clientX);
    var hit = e.target.closest(".thumb");
    var i = hit ? +hit.dataset.i : Math.abs(v - pos[0]) <= Math.abs(v - pos[1]) ? 0 : 1;
    if (!hit && pos[0] === pos[1] - GAP) i = v < pos[0] ? 0 : 1;
    glideId++;
    drag = { i: i, id: e.pointerId };
    slider.setPointerCapture(e.pointerId);
    thumbs[i].classList.add("grab");
    thumbs[i].focus({ preventScroll: true });
    moveTo(i, v);
    e.preventDefault();
  });
  slider.addEventListener("pointermove", function (e) { if (drag && e.pointerId === drag.id) moveTo(drag.i, valueAt(e.clientX)); });
  function release(e) {
    if (!drag || e.pointerId !== drag.id) return;
    thumbs[drag.i].classList.remove("grab");
    drag = null;
    glide(val[0], val[1], 260); // settle onto the 500-rupee step
  }
  slider.addEventListener("pointerup", release);
  slider.addEventListener("pointercancel", release);

  // ---------- Keyboard on the knobs ----------
  thumbs.forEach(function (t, i) {
    t.addEventListener("keydown", function (e) {
      var d = { ArrowLeft: -STEP, ArrowDown: -STEP, ArrowRight: STEP, ArrowUp: STEP, PageDown: -2500, PageUp: 2500 }[e.key];
      var v = val[i];
      if (d) v += d; else if (e.key === "Home") v = MIN; else if (e.key === "End") v = MAX; else return;
      e.preventDefault();
      v = i === 0 ? clamp(v, MIN, val[1] - GAP) : clamp(v, val[0] + GAP, MAX);
      glide(i === 0 ? v : val[0], i === 1 ? v : val[1], 220);
    });
  });

  // ---------- Typed values ----------
  inputs.forEach(function (inp, i) {
    function commit() {
      var raw = inp.value.replace(/[^0-9]/g, "");
      var v = raw ? snap(+raw) : NaN;
      var ok = !isNaN(v) && (i === 0 ? v <= val[1] - GAP : v >= val[0] + GAP);
      if (!ok) {
        fields[i].classList.remove("bad"); void fields[i].offsetWidth; fields[i].classList.add("bad");
        status.textContent = i === 0 ? "The lowest price must be under the highest price." : "The highest price must be above the lowest price.";
        inp.value = fmt(val[i]);
        return;
      }
      glide(i === 0 ? v : val[0], i === 1 ? v : val[1], 700).then(function () { inp.value = fmt(val[i]); });
    }
    inp.addEventListener("change", commit);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); commit(); inp.select(); } });
    inp.addEventListener("focus", function () { inp.select(); });
    inp.addEventListener("blur", function () { inp.value = fmt(val[i]); });
  });
  fields.forEach(function (f) { f.addEventListener("animationend", function () { f.classList.remove("bad"); }); });

  presets.forEach(function (b) {
    b.addEventListener("click", function () {
      if (open) closeResults();
      var r = b.dataset.r.split(",").map(Number);
      glide(r[0], r[1], 750);
    });
  });

  // ---------- Pendulum physics for the two tags ----------
  // Each tag trails behind its knob while it moves (leans against the motion), then swings back and settles.
  // A soft breeze keeps them alive when nothing moves.
  var swing = [{ a: 0, w: 0, x: null, v: 0 }, { a: 0, w: 0, x: null, v: 0 }];
  var w = 0, inset = 44;
  function measure() {
    w = slider.clientWidth;
    inset = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--inset")) || 44;
  }
  measure();
  addEventListener("resize", measure);
  function tick(t) {
    var px = pos.map(function (p) { return inset + frac(p) * (w - 2 * inset); });
    swing.forEach(function (s, i) {
      if (s.x === null) s.x = px[i];
      var v = px[i] - s.x;
      s.x = px[i];
      s.v += (v - s.v) * 0.5;
      if (reduceMq.matches) { s.a = 0; s.w = 0; }
      else {
        var target = clamp(-s.v * 2.4, -38, 38) + Math.sin(t / 900 + i * 2.1) * 2.2;
        s.w += (target - s.a) * 0.07;
        s.w *= 0.88;
        s.a += s.w;
      }
      hangs[i].style.setProperty("--r", s.a.toFixed(2) + "deg");
    });
    // when the knobs come close, the top-price tag drops lower on a longer string so both stay readable
    var gap = Math.abs(px[1] - px[0]);
    hangs[1].style.setProperty("--len", (16 + clamp((112 - gap) / 112, 0, 1) * 46).toFixed(1) + "px");
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- Show results: bars sink, cloth cards land ----------
  var CLOTH = [
    { name: "Gulnar printed lawn", bg: "radial-gradient(circle at 30% 30%, #ff8fb1 0 22%, transparent 24%) 0 0 / 18px 18px, radial-gradient(circle at 70% 70%, #ffd166 0 14%, transparent 16%) 0 0 / 18px 18px, #2e7d6b" },
    { name: "Neel block print", bg: "conic-gradient(from 45deg, #1d3e8a 0 25%, #f5efe0 0 50%, #1d3e8a 0 75%, #f5efe0 0) 0 0 / 16px 16px" },
    { name: "Mehrun chikankari", bg: "radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.9) 0 12%, transparent 14%) 0 0 / 14px 20px, linear-gradient(#8c1d3f, #6b1230)" },
    { name: "Sahar striped kurta", bg: "repeating-linear-gradient(90deg, #f2c14e 0 7px, #fff6dc 7px 12px, #e07a2f 12px 15px, #fff6dc 15px 20px)" },
    { name: "Zarri festive suit", bg: "linear-gradient(135deg, transparent 40%, #ffd77a 40% 46%, transparent 46%) 0 0 / 14px 14px, linear-gradient(45deg, transparent 40%, #ffd77a 40% 46%, transparent 46%) 0 0 / 14px 14px, #3b1c5a" },
    { name: "Tabeer digital print", bg: "radial-gradient(circle at 50% 120%, #ff7b54 0 30%, transparent 31%) 0 0 / 22px 22px, radial-gradient(circle at 50% -20%, #5cc8b3 0 30%, transparent 31%) 0 0 / 22px 22px, #fdf1e3" }
  ];
  var batch = 0;
  function buildResults() {
    var lo = val[0], hi = val[1], total = countIn(lo, hi);
    var html = '<p class="rhead"><span><b>' + total + " suits</b> found</span><span>PKR " + fmt(lo) + " to " + fmt(hi) + '</span></p><div class="cards">';
    [0.18, 0.5, 0.84].forEach(function (k, j) {
      var c = CLOTH[(batch * 3 + j) % CLOTH.length];
      var price = Math.round((lo + (hi - lo) * k) / 50) * 50;
      html += '<div class="item" style="--d:' + (0.08 + j * 0.11) + "s;--tilt:" + [-7, 3, 8][j] + 'deg"><div class="swatch" style="background:' + c.bg + '"></div><p>' + c.name + "</p><b>PKR " + fmt(price) + "</b></div>";
    });
    html += '</div><p class="more">' + (total > 3 ? "+" + (total - 3) + " more in this range" : "That is every suit in this range") + "</p>";
    results.innerHTML = html;
    batch++;
  }
  function burst() {
    if (reduceMq.matches) return;
    for (var i = 0; i < 12; i++) {
      var s = document.createElement("i");
      s.className = "spark";
      if (i % 2) s.style.background = "var(--em2)";
      countBox.appendChild(s);
      var a = (i / 12) * Math.PI * 2, d = 34 + (i % 3) * 10;
      s.animate([
        { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
        { transform: "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) rotate(" + (i * 60) + "deg) scale(.4)", opacity: 0 }
      ], { duration: 700, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }
  async function showResults() {
    if (busy) return;
    busy = true;
    go.classList.add("working");
    go.setAttribute("aria-busy", "true");
    status.textContent = "Finding suits…";
    zone.classList.add("sinking");
    await wait(reduceMq.matches ? 150 : 900);
    buildResults();
    zone.classList.add("show");
    slider.inert = true;
    results.removeAttribute("aria-hidden");
    go.classList.remove("working");
    go.removeAttribute("aria-busy");
    goLabel.innerHTML = "&#8592; Edit price range";
    countBox.classList.remove("pop"); void countBox.offsetWidth; countBox.classList.add("pop");
    burst();
    status.textContent = "Showing " + countIn(val[0], val[1]) + " suits from PKR " + fmt(val[0]) + " to PKR " + fmt(val[1]) + ".";
    open = true;
    busy = false;
  }
  function closeResults() {
    zone.classList.remove("show", "sinking");
    slider.inert = false;
    results.setAttribute("aria-hidden", "true");
    goLabel.innerHTML = 'Show <b id="goN">' + shown + "</b> suits";
    goN = $("#goN");
    status.textContent = "Back to the price range.";
    open = false;
  }
  go.addEventListener("click", function () { if (open) closeResults(); else showResults(); });
  countBox.addEventListener("animationend", function () { countBox.classList.remove("pop"); });

  render();

  // ---------- Auto demo: plays on load and every few seconds until someone touches it ----------
  var demoOn = true;
  function stopDemo(e) { if (e.isTrusted) demoOn = false; }
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
  async function pause(ms) { await wait(ms); if (!demoOn) throw 0; }
  async function press(el) { el.classList.add("press"); await pause(160); el.classList.remove("press"); el.click(); }
  async function demo() {
    try {
      await pause(300);
      while (demoOn) {
        await glide(4000, MAX, 750); await pause(250);
        await glide(4000, 11500, 850); await pause(500);
        await press(go); await pause(2700);
        await press(go); await pause(500);
        await press(presets[3]); await pause(1500);
        await glide(MIN, MAX, 900); await pause(2600);
      }
    } catch (e) { /* stopped by the visitor */ }
  }
  demo();
})();
