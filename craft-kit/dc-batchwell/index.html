<html lang="en">
<head>
<meta charset="utf-8">

<title>Batchwell · Maker back office · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
/* ===== Core UI parts: buttons, forms, tables, layers, toasts, charts (each app themes them with variables) ===== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-btn: 10px; --r-inp: 9px; --r-modal: 18px;
  --scrim: rgba(12, 14, 22, .45); --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .45);
  --toast-bg: #17191f; --toast-ink: #fff; --tip-bg: #121419; --tip-ink: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--ok); }
.down { color: var(--bad); }
.i { width: 18px; height: 18px; flex: none; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1; text-decoration: none; white-space: nowrap; transition: transform .14s, background-color .2s, border-color .2s, box-shadow .2s, filter .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn .i { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.bell { position: relative; }
.bell .badge-n { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.bell .badge-n[hidden] { display: none; }
.bell.ring .i { animation: ring .8s ease; transform-origin: 50% 10%; }
@keyframes ring { 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

/* Segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg-k { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 999px; background: var(--accent); transition: left .35s cubic-bezier(.3, 1.3, .5, 1), width .35s; }

/* Chips, badges, avatars, progress */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .cnt { opacity: .7; font-weight: 500; }
.badge { --b: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--b); background: color-mix(in srgb, var(--b) 14%, transparent); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { --b: var(--ok); } .badge.warn { --b: var(--warn); } .badge.bad { --b: var(--bad); } .badge.info { --b: var(--info); } .badge.acc { --b: var(--accent); }
.ava { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; letter-spacing: .02em; }
.meter { height: 7px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--mc, var(--accent)); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-size: 12px; }
.delta .i { width: 14px; height: 14px; }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full, .form .full { grid-column: 1 / -1; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: var(--r-inp); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.inp { min-height: 76px; resize: vertical; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.err .inp { border-color: var(--bad); }
.ferr { font-size: 12px; color: var(--bad); }
.ferr:empty { display: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; appearance: none; -webkit-appearance: none; border-radius: 99px; background: var(--line-2); transition: background-color .25s; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }

/* Data table */
.tbl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 180px; max-width: 300px; display: block; }
.search .inp { padding-left: 34px; min-height: 36px; }
.search .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th > button, .tbl th > .th { display: flex; align-items: center; gap: 4px; width: 100%; padding: 9px 12px; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
.tbl th.r > button, .tbl th.r > .th { justify-content: flex-end; }
.tbl th .ar { width: 0; height: 0; border: 4px solid transparent; opacity: 0; transition: opacity .2s; }
.tbl th[aria-sort="ascending"] .ar { border-bottom-color: currentColor; margin-top: -4px; opacity: 1; }
.tbl th[aria-sort="descending"] .ar { border-top-color: currentColor; margin-top: 4px; opacity: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tbody tr { transition: background-color .15s; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tbody tr.rowin { animation: rowin .4s both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } }
.tbl .r { text-align: right; }
.tbl .acts { display: flex; gap: 4px; justify-content: flex-end; }
.cellname { display: flex; align-items: center; gap: 10px; }
.cellname small { display: block; color: var(--muted); font-size: 11.5px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.pager .pbtns { display: flex; gap: 6px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 12px; color: var(--muted); text-align: center; }
.empty .i { width: 34px; height: 34px; opacity: .55; }
.empty b { color: var(--ink); }

/* Layers: modal, drawer, menu, command search */
.layer { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.layer .scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .25s both; }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-modal); box-shadow: var(--shadow-lg); animation: pop .34s cubic-bezier(.2, .9, .3, 1.15) both; }
.modal.wide { width: min(820px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.modal-h h2 { font-size: 18px; }
.modal-b { padding: 10px 20px 8px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; flex-wrap: wrap; }
.layer.drawer-l { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { position: relative; height: 100%; width: min(460px, 100%); background: var(--surface); color: var(--ink); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slidein .4s cubic-bezier(.2, .8, .2, 1) both; }
.drawer .modal-b { flex: 1; }
.drawer .modal-f { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); }
.layer.closing .scrim { animation: fade .22s reverse both; }
.layer.closing .modal { animation: pop .22s reverse both; }
.layer.closing .drawer { animation: slidein .26s reverse both; }
.modal.shake { animation: shake .4s; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
@keyframes slidein { from { transform: translateX(100%); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 6px 0 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.menu { position: fixed; z-index: 110; min-width: 190px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; animation: pop .18s both; }
.menu.wide { width: 330px; }
.menu > button, .menu .mi { display: flex; width: 100%; text-align: left; gap: 9px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; color: inherit; }
.menu > button:hover, .menu > button:focus-visible { background: var(--hover); outline: none; }
.menu > button.dz { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.menu .mh { padding: 6px 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.notes li { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
.notes li.unread { background: var(--hover); }
.notes li i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--info); }
.notes li.ok i { background: var(--ok); } .notes li.warn i { background: var(--warn); } .notes li.bad i { background: var(--bad); }
.notes small { display: block; color: var(--muted); font-size: 11px; }
.layer.cmdk-l { align-items: flex-start; padding-top: 12vh; }
.modal.cmdk .modal-b { padding: 0 12px 12px; }
.cmdk ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.cmdk li button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 9px; text-align: left; font-size: 13.5px; }
.cmdk li button small { margin-left: auto; color: var(--muted); }
.cmdk li[aria-selected="true"] button, .cmdk li button:hover { background: var(--hover); }

/* Toasts and tooltip */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 11px 14px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; animation: toastin .4s cubic-bezier(.2, .9, .3, 1.25) both; }
.toast > i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.toast.warn > i { background: var(--warn); } .toast.bad > i { background: var(--bad); } .toast.info > i { background: var(--info); }
.toast button { margin-left: 6px; border: 0; background: rgba(255, 255, 255, .16); color: inherit; border-radius: 7px; padding: 4px 9px; font-weight: 700; font-size: 12px; }
.toast.out { animation: toastout .26s both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }
.tip { position: fixed; z-index: 160; left: 0; top: 0; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 250px; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 3px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
.tip .tr span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* Charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.6, .1, .2, 1) forwards; }
.chart .ar.in { animation: fade 1s .35s both; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.chart .dot { stroke: var(--surface); stroke-width: 2; opacity: 0; transition: opacity .15s; }
.chart.hov .guide, .chart.hov .dot { opacity: 1; }
.chart .bar { transition: opacity .2s; }
.chart.hov .bar:not(.hl) { opacity: .45; }
.chart .seg-arc { fill: none; transition: stroke-width .2s, opacity .2s; cursor: pointer; }
.chart .seg-arc.dim { opacity: .35; }
.chart .empty-c { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-box { position: relative; flex: none; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font-size: 20px; line-height: 1.1; }
.donut-c span { font-size: 11px; color: var(--muted); }
.dleg { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 150px; display: grid; gap: 6px; font-size: 12.5px; }
.dleg li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: default; transition: background-color .15s; }
.dleg li:hover { background: var(--hover); }
.dleg li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.dleg li em { font-style: normal; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.blist { display: grid; gap: 10px; }
.blist .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; cursor: default; }
.blist .bl > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blist .bl b { font-variant-numeric: tabular-nums; }
.blist .bt { grid-column: 1 / -1; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.blist .bt i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--bc, var(--c1)); }
.funnel { display: grid; gap: 8px; }
.funnel .fs { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; align-items: center; gap: 10px; font-size: 12.5px; cursor: default; }
.funnel .fb { height: 30px; display: flex; justify-content: center; }
.funnel .fb i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--fc, var(--c1)); }
.funnel .fs em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Drag and drop */
.dragging { opacity: .35; }
.ghost { position: fixed !important; z-index: 140; margin: 0 !important; pointer-events: none; transform: rotate(2.5deg) scale(1.03); box-shadow: var(--shadow-lg); }
.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
[data-handle] { touch-action: none; cursor: grab; }

/* Page entrance */
.rise { animation: rise .62s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Reduced motion: everything works, nothing big moves */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ===== Batchwell look: warm paper, terracotta and sage, serif headings, outlined cards ===== */
:root {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --bg: #f6f0e7; --bg-2: #efe5d8; --surface: #fffcf7; --surface-2: #f3ebdf; --ink: #2b211b; --muted: #85725f; --line: #e6d8c7; --line-2: #cdb9a3; --hover: rgba(191, 86, 54, .07);
  --accent: #bf5636; --on-accent: #fff; --ok: #4f8a5b; --warn: #a86d12; --bad: #c0392b; --info: #4f78a3; --grid: #ece1d3;
  --c1: #bf5636; --c2: #7d9a6f; --c3: #d9a441; --c4: #8a4f6d; --c5: #4f78a3; --c6: #b0896b;
  --r: 18px; --r-btn: 999px; --r-inp: 12px; --r-modal: 22px;
  --shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 14px 30px -24px rgba(90, 55, 30, .55);
  --toast-bg: #2b211b; --tip-bg: #2b211b; --scrim: rgba(43, 33, 27, .42);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #16110d; --bg-2: #1c1611; --surface: #211a15; --surface-2: #2b231d; --ink: #f4eadf; --muted: #ab9988; --line: #3a2f27; --line-2: #5a4a3d; --hover: rgba(224, 122, 87, .1);
  --accent: #e07a57; --on-accent: #1b120d; --ok: #7fbd8a; --warn: #e2a63d; --bad: #ef6b5b; --info: #86a8cf; --grid: #2f2620;
  --c1: #e07a57; --c2: #9dbb8e; --c3: #e8b85a; --c4: #c47fa2; --c5: #86a8cf; --c6: #c9a284;
  --shadow: 0 16px 36px -24px rgba(0, 0, 0, .9);
  --toast-bg: #f4eadf; --toast-ink: #1b120d; --tip-bg: #f4eadf; --tip-ink: #1b120d; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
body { background: var(--bg); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }

/* Sidebar with a sliding terracotta pill */
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 18px; background: var(--bg-2); border-right: 1px solid var(--line); overflow-y: auto; z-index: 60; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.brand svg { width: 36px; height: 36px; flex: none; }
.brand small { display: block; font-family: var(--font); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.nav { position: relative; display: flex; flex-direction: column; gap: 2px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 13px; text-decoration: none; color: var(--muted); font-weight: 600; transition: color .25s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--on-accent); }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--surface); color: var(--ink); border-radius: 99px; padding: 1px 8px; }
.nav .marker { position: absolute; left: 0; right: 0; top: 0; height: 40px; border-radius: 13px; background: var(--accent); box-shadow: 0 10px 22px -12px var(--accent); transition: transform .5s cubic-bezier(.3, 1.3, .4, 1), height .3s, opacity .3s; }
.nav-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 14px 12px 6px; font-weight: 700; }
.side-foot { margin-top: auto; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; }
.side-foot b { display: block; font-size: 13px; }
.scrim-nav { display: none; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 16px 30px 12px; background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.top h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -.015em; }
.crumb { font-size: 12px; color: var(--muted); font-weight: 600; }
.menu-btn { display: none; }
.search-btn { min-width: 210px; justify-content: flex-start; color: var(--muted); font-weight: 500; }
.search-btn kbd { margin-left: auto; font: 600 11px var(--font); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
main { padding: 4px 30px 44px; overflow-x: clip; }

/* Layout + cards */
.grid { display: grid; gap: 18px; margin-bottom: 18px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s; }
.card.lift:hover { transform: translateY(-3px); box-shadow: var(--shadow), 0 22px 40px -28px rgba(90, 55, 30, .6); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h3 { font-family: var(--serif); font-size: 18px; font-weight: 700; }
.card-h p { font-size: 12px; color: var(--muted); }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.bar-row p { color: var(--muted); max-width: 60ch; }
.kpi .lbl { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi .lbl .i { width: 15px; height: 15px; color: var(--accent); }
.kpi .val { font-family: var(--serif); font-size: 29px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 2px; }
.kpi .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.kpi .sp { width: 90px; }

/* Signature: the studio shelf of jars whose liquid level is the stock level */
.hero { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 20px; align-items: center; padding: 22px 24px; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 14%, var(--surface)) 0%, var(--surface) 55%), var(--surface); }
.hero h2 { font-family: var(--serif); font-size: 27px; letter-spacing: -.02em; }
.hero p { color: var(--muted); margin: 8px 0 16px; }
.hero .row { flex-wrap: wrap; }
.shelf { position: relative; display: flex; gap: 8px; align-items: flex-end; justify-content: space-between; overflow-x: auto; padding: 6px 4px 16px; scrollbar-width: thin; }
.shelf::after { content: ""; position: absolute; left: 0; right: 0; bottom: 8px; height: 9px; border-radius: 6px; background: linear-gradient(var(--c6), color-mix(in srgb, var(--c6) 60%, #000)); opacity: .55; }
.jarbtn { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 4px 2px 10px; border-radius: 14px; flex: none; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); }
.jarbtn:hover { transform: translateY(-6px) rotate(-2deg); }
.jarbtn span { font-size: 11px; font-weight: 700; color: var(--muted); max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jarbtn .low { position: absolute; top: 0; right: -2px; font-size: 9.5px; font-weight: 800; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 6px; animation: pulse 1.8s ease 3; }
@keyframes pulse { 50% { transform: scale(1.18); } }
.jar .lid { fill: var(--c6); }
.jar .neck { fill: color-mix(in srgb, var(--c6) 70%, var(--surface)); }
.jar .glass { fill: color-mix(in srgb, var(--surface-2) 60%, transparent); stroke: var(--line-2); stroke-width: 1.5; }
.jar .lbl { fill: var(--surface); opacity: .93; }
.jar .jt { font: 800 8px var(--font); fill: var(--ink); }
.jar .shine { stroke: #fff; stroke-opacity: .45; stroke-width: 3; stroke-linecap: round; fill: none; }
.jar .liq { transition: transform 1.7s cubic-bezier(.3, .8, .3, 1); }
.jar .wave { animation: wave 3.4s linear 3; }
@keyframes wave { to { transform: translateX(60px); } }

/* Lists */
.alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alist li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.alist .dotc { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--b); background: color-mix(in srgb, var(--b) 15%, transparent); }
.alist .dotc .i { width: 16px; height: 16px; }
.alist li > div { flex: 1; min-width: 0; font-size: 13px; }
.alist small { display: block; color: var(--muted); font-size: 11.5px; }

/* Product cards */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.pcard { display: flex; gap: 14px; align-items: center; cursor: pointer; }
.pcard .jarwrap { flex: none; }
.pcard h4 { font-size: 14.5px; margin-bottom: 3px; }
.pcard .meta { font-size: 12px; color: var(--muted); }
.pcard .nums { display: flex; gap: 14px; margin: 8px 0; font-size: 12px; }
.pcard .nums b { display: block; font-size: 15px; font-family: var(--serif); }
.pcard .row .btn { flex: 1; }

/* Kanban board for shipping */
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 12px; min-height: 320px; display: flex; flex-direction: column; gap: 10px; transition: background-color .2s; }
.col.over { background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }
.col-h { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 13px; padding: 2px 4px; }
.col-h .n { background: var(--surface); border-radius: 99px; padding: 1px 9px; font-size: 12px; }
.kc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; box-shadow: var(--shadow); cursor: grab; transition: transform .2s, box-shadow .2s; }
.kc:hover { transform: translateY(-2px); }
.kc .top-l { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.kc b { font-size: 13.5px; }
.kc .grip { color: var(--muted); padding: 2px; border-radius: 6px; display: inline-flex; }
.kc .grip .i { width: 16px; height: 16px; }
.kc .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 6px; }
.kc.flash { animation: flash 1s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* Batch builder */
.req { margin-top: 4px; display: grid; gap: 8px; grid-column: 1 / -1; }
.req .rq { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 12.5px; }
.req .rq .meter { grid-column: 1 / -1; }
.req .rq.short b { color: var(--bad); }
.req .maxline { font-size: 12.5px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); }
.pour { text-align: center; padding: 8px 0 4px; }
.pour .jars { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 12px 0 16px; }
.pour h3 { font-family: var(--serif); font-size: 20px; }
.pour .drain { display: grid; gap: 7px; text-align: left; margin-top: 10px; }
.lot { display: inline-block; margin-top: 8px; padding: 5px 12px; border-radius: 99px; border: 1px dashed var(--accent); color: var(--accent); font-weight: 800; letter-spacing: .06em; font-size: 12px; }
.qc { display: grid; gap: 8px; margin: 10px 0 16px; }
.qc label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; }
.qc input { width: 17px; height: 17px; accent-color: var(--accent); }
.timeline { list-style: none; margin: 6px 0 16px; padding: 0; display: grid; gap: 0; }
.timeline li { position: relative; padding: 0 0 14px 26px; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
.timeline li::after { content: ""; position: absolute; left: 10.5px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.done::before { background: var(--ok); }
.timeline li.now::before { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.items { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.items li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 9px 12px; border-radius: 12px; background: var(--surface-2); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row p { font-size: 12px; color: var(--muted); }
.stockcell { min-width: 150px; }
.stockcell .meter { margin-top: 5px; }

/* Responsive */
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12, .g3 { grid-template-columns: minmax(0, 1fr); } .search-btn { min-width: 0; } .search-btn span, .search-btn kbd { display: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; transform: translateX(-105%); transition: transform .38s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow-lg); }
  body.nav-open .side { transform: none; }
  .scrim-nav { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
  body.nav-open .scrim-nav { display: block; }
  .menu-btn { display: inline-flex; }
  .top { padding: 12px 16px; }
  .top h1 { font-size: 21px; }
  main { padding: 4px 16px 36px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) { .g4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; } .kpi .val { font-size: 22px; } .kpi .sp { display: none; } .card { padding: 15px; } .crumb { display: none; } .board { grid-template-columns: repeat(4, 82vw); } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main menu">
    <a class="brand" href="#/overview" aria-label="Batchwell home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="12" fill="var(--accent)"/><path d="M13 15h14l-1.5 15a3 3 0 0 1-3 2.7h-5a3 3 0 0 1-3-2.7z" fill="#fff" opacity=".95"/><rect x="14.5" y="9" width="11" height="5" rx="1.6" fill="#fff" opacity=".75"/><path d="M14.4 22c3-1.6 8.2 1.6 11.2 0l-.6 7.8a2 2 0 0 1-2 1.8h-6a2 2 0 0 1-2-1.8z" fill="var(--accent)" opacity=".55"/></svg>
      <span>Batchwell<small>Saffron Clay Studio</small></span>
    </a>
    <nav class="nav" data-nav aria-label="Pages"><span class="marker" aria-hidden="true"></span></nav>
    <div class="side-foot"><b>Studio, Gulberg III</b><span class="muted">Lahore · open till 8 pm</span></div>
  </aside>
  <div class="scrim-nav" data-nav-close></div>
  <div class="main-col">
    <header class="top">
      <button class="btn icon ghost menu-btn" data-menu-btn aria-label="Open menu" aria-expanded="false"></button>
      <div class="grow"><div class="crumb" id="crumb">Studio</div><h1 id="pt">Overview</h1></div>
      <button class="btn search-btn" data-cmdk aria-label="Search pages and actions"></button>
      <button class="btn icon ghost" data-theme-btn aria-label="Switch theme"></button>
      <button class="btn icon ghost bell" data-bell aria-label="Notifications"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script>
/* ================= Core helpers (small, shared, no libraries) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fin = (v) => (Number.isFinite(+v) ? +v : 0); /* any non-finite number (NaN, Infinity) becomes 0 */
const sum = (a, f = (x) => x) => a.reduce((s, x, i) => s + fin(f(x, i)), 0);
const mq = (q) => (window.matchMedia ? window.matchMedia(q) : { matches: false });
const RM = mq("(prefers-reduced-motion: reduce)").matches;
const DAY = 864e5;
const MON = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
const WD = "Sun Mon Tue Wed Thu Fri Sat".split(" ");
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
const pad = (n) => String(n).padStart(2, "0");
let _uid = 0;
const uid = (p = "u") => p + (++_uid).toString(36);
const ease = (t) => 1 - Math.pow(1 - t, 3);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/* Seeded random numbers, so the demo data is the same on every load */
function rng(seed) {
  let a = seed >>> 0 || 1;
  const r = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.shuffle = (arr) => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  return r;
}
const PK = {
  first: "Ayesha Bilal Hamza Fatima Usman Zainab Ali Hira Saad Maryam Omar Sana Faisal Iqra Danish Mahnoor Kamran Rabia Imran Nida Tariq Amna Hassan Sadia Junaid Areeba Waqas Mehwish Fahad Kiran Shahzad Laiba Asad Rimsha Noman Anum Zeeshan Hafsa Adeel Saba".split(" "),
  last: "Khan Ahmed Malik Qureshi Siddiqui Butt Chaudhry Sheikh Raza Hussain Mirza Javed Iqbal Akhtar Abbasi Farooq Baig Rana Shah Aslam Nawaz Haider Anwar Zafar".split(" "),
  cities: "Lahore Karachi Islamabad Rawalpindi Faisalabad Multan Peshawar Quetta Sialkot Hyderabad Gujranwala Abbottabad Bahawalpur Sukkur".split(" "),
};
const person = (r) => r.pick(PK.first) + " " + r.pick(PK.last);
const initials = (n) => String(n).split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = (n, cls = "") => `<span class="ava ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;
const phone = (r) => "03" + r.int(0, 4) + r.int(0, 9) + "-" + r.int(1000000, 9999999);

/* Number, money and date formatting */
const fmt = {
  n: (v, d = 0) => (+v || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }),
  short(v) {
    v = +v || 0; const a = Math.abs(v);
    const [div, suf] = a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e3 ? [1e3, "K"] : [1, ""];
    if (!suf) return String(Math.round(v));
    const x = v / div; return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1).replace(/\.0$/, "")) + suf;
  },
  pkr: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.n(Math.abs(v)),
  pkrS: (v) => (v < 0 ? "-Rs " : "Rs ") + fmt.short(Math.abs(v)),
  usd: (v) => (v < 0 ? "-$" : "$") + fmt.n(Math.abs(v)),
  usd2: (v) => (v < 0 ? "-$" : "$") + fmt.n(Math.abs(v), 2),
  usdS: (v) => (v < 0 ? "-$" : "$") + fmt.short(Math.abs(v)),
  pct: (v, d = 1) => ((+v || 0) * 100).toFixed(d) + "%",
  date: (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()]; },
  dateY: (t) => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); },
  time: (t) => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); },
  dt: (t) => fmt.date(t) + ", " + fmt.time(t),
  iso: (t) => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); },
  ago(t) { const s = (Date.now() - t) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago"; return Math.floor(s / 86400) + " d ago"; },
  dur(ms) { const m = Math.max(0, Math.floor(ms / 60000)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m"; },
};
const days = (t) => Math.round((t - TODAY) / DAY);
const parseISO = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : NaN; };
const badge = (t, k = "") => `<span class="badge ${k}">${esc(t)}</span>`;
const delta = (p) => `<span class="delta ${p >= 0 ? "up" : "down"}">${ic(p >= 0 ? "up" : "down")}${Math.abs(p * 100).toFixed(1)}%</span>`;

/* Data series for a range switch: 7D and 30D are days, 12M sums whole months */
function rangeData(range, valAt) {
  const labels = [], data = [];
  if (range === "12M") {
    const d = new Date(TODAY);
    for (let m = 11; m >= 0; m--) {
      const s = new Date(d.getFullYear(), d.getMonth() - m, 1).getTime();
      const e = Math.min(new Date(d.getFullYear(), d.getMonth() - m + 1, 1).getTime(), TODAY + DAY);
      let v = 0;
      for (let t = s; t < e; t += DAY) v += valAt(Math.round((t - TODAY) / DAY));
      labels.push(MON[new Date(s).getMonth()]); data.push(v);
    }

/* ================= Drawers and modals ================= */
const nextStatus = (o) => ({ New: "Packed", Packed: "Shipped", Shipped: "Delivered" })[o.status];
function setStatus(o, s) {
  o.status = s;
  if ((s === "Shipped" || s === "Delivered") && !o.courier) { o.courier = D().settings.courier; o.tracking = "KC" + Math.floor(100000 + Math.random() * 899999); }
  save(); toast(`Order #${o.id} moved to ${ST_COL[s] || s}`);
  if (s === "Delivered") Bell.add(`Order #${o.id} delivered to ${o.customer}`, "ok", true);
}
function advance(o) { const n = nextStatus(o); if (!n) return; setStatus(o, n); R.refresh(); }
async function cancelOrder(o) {
  if (!(await confirmDlg(`Cancel order #${o.id} for ${esc(o.customer)}? Its items go back on the shelf.`, { title: "Cancel order?", ok: "Cancel order" }))) return;
  o.lines.forEach((l) => { const p = prod(l.pid); if (p) p.stock += l.qty; });
  if (days(o.placed) === 0) D().hist[364] = Math.max(0, D().hist[364] - o.total);
  o.status = "Cancelled"; save(); Layer.closeAll(); R.refresh(); toast(`Order #${o.id} cancelled and restocked`, "warn");
}
function orderDrawer(o) {
  if (!o) return;
  const steps = STATUS.map((s, i) => `<li class="${o.status === "Cancelled" ? "" : STATUS.indexOf(o.status) > i ? "done" : o.status === s ? "now" : ""}"><b>${ST_COL[s]}</b>${o.status === s ? " · now" : ""}</li>`).join("");
  const n = nextStatus(o);
  const dr = drawer({
    title: `Order #${o.id}`,
    body: `<div class="row" style="margin-bottom:12px">${avatar(o.customer)}<div><b>${esc(o.customer)}</b><div class="muted" style="font-size:12px">${esc(o.city)} · ${esc(o.channel)}</div></div><span style="margin-left:auto">${badge(o.status, ST_BADGE[o.status])}</span></div>
      <ul class="items">${o.lines.map((l) => { const p = prod(l.pid); return `<li><span>${l.qty} × ${esc(p ? p.name : "Removed product")}</span><b class="num">${money(l.qty * l.price)}</b></li>`; }).join("")}<li><b>Total</b><b class="num">${money(o.total)}</b></li></ul>
      <dl class="dl"><dt>Placed</dt><dd>${fmt.dt(o.placed)}</dd><dt>Courier</dt><dd>${esc(o.courier || "Not booked")}</dd><dt>Tracking</dt><dd>${esc(o.tracking || "—")}</dd></dl>
      <h3 style="font-size:14px;margin-bottom:8px">Progress</h3><ul class="timeline">${o.status === "Cancelled" ? `<li class="now"><b>Cancelled</b></li>` : steps}</ul>`,
    foot: `<button class="btn" data-slip>${ic("printer")}Packing slip</button>${o.status !== "Cancelled" && o.status !== "Delivered" ? `<button class="btn danger" data-cancel>Cancel</button>` : ""}${n ? `<button class="btn pri" data-adv>Mark ${n.toLowerCase()}</button>` : ""}`,
  });
  dr.el.querySelector("[data-slip]").addEventListener("click", () => toast(`Packing slip for #${o.id} sent to the printer`, "info"));
  const c = dr.el.querySelector("[data-cancel]"); if (c) c.addEventListener("click", () => cancelOrder(o));
  const a = dr.el.querySelector("[data-adv]"); if (a) a.addEventListener("click", () => { advance(o); dr.close(); });
}

      { name: "customer", label: "Customer name", required: 1, placeholder: "e.g. Ayesha Khan" },
      { name: "city", label: "City", type: "select", options: PK.cities },
      { name: "channel", label: "Channel", type: "select", options: CHANNELS },
      { name: "pay", label: "Payment", type: "select", options: ["Cash on delivery", "Bank transfer", "Card"] },

    ],

      const wholesale = v.channel === "Wholesale";
      const lines = [{ pid: v.p1, qty: v.qty1 }]; if (v.p2 && v.qty2 > 0) lines.push({ pid: v.p2, qty: v.qty2 });
      lines.forEach((l) => { const p = prod(l.pid); l.price = wholesale ? Math.round(p.price * 0.7) : p.price; p.stock -= l.qty; });
      let c = D().customers.find((x) => x.name.toLowerCase() === v.customer.toLowerCase());

      D().orders.push(o); D().hist[364] += o.total; save();

}

/* Make a batch: live ingredient check, then the jars pour */
function batchModal(pid) {
  const ps = D().products;
  const m = formModal({
    title: "Make a batch", submit: "Start batch", wide: true,
    values: { pid: pid || ps[0].id, qty: 40 },
    fields: [
      { name: "pid", label: "Product", type: "select", options: ps.map((p) => ({ value: p.id, label: p.name })) },
      { name: "qty", label: "Units to make", type: "number", min: 1, max: 500, required: 1, validate: (v, all) => { const p = prod(all.pid); const c = canMake(p); return v > c ? `Ingredients cover only ${c} units` : ""; } },
      { name: "by", label: "Made by", type: "select", options: ["Hira", "Bilal", "Sana", "Usman"] },
      { name: "note", label: "Note", placeholder: "e.g. new rose water supplier" },
    ],
    extra: `<div class="req" id="req" aria-live="polite"></div>`,
    onSubmit: (v, mm) => {
      const p = prod(v.pid), before = {};
      Object.entries(p.recipe).forEach(([k, q]) => { const x = ingr(k); before[k] = x.stock; x.stock -= q * v.qty; });
      p.stock += v.qty;
      const code = "SC-" + String(new Date().getFullYear()).slice(2) + pad(new Date().getMonth() + 1) + "-" + pad(++D().seq.batch);
      D().batches.push({ id: "b" + Date.now(), code, pid: p.id, qty: v.qty, made: Date.now(), expiry: TODAY + p.shelf * DAY, by: v.by, status: "Curing", qc: [] });
      save();
      lowIng().forEach((x) => { if (before[x.id] > x.reorder) Bell.add(`${x.name} dropped below reorder (${qtyU(x, x.stock)})`, "bad"); });
      pourView(mm, p, v.qty, code, before);
      return false;
    },
  });
  const paint = () => {
    const p = prod(m.form.elements.pid.value), q = +m.form.elements.qty.value || 0;
    $("#req", m.el).innerHTML = Object.entries(p.recipe).map(([k, per]) => { const x = ingr(k), need = per * q; return `<div class="rq ${need > x.stock ? "short" : ""}"><span>${esc(x.name)}</span><b class="num">${fmt.n(need)} / ${qtyU(x, x.stock)}</b><div class="meter" style="--mc:${need > x.stock ? "var(--bad)" : "var(--c2)"}"><i style="width:${clamp((need / (x.stock || 1)) * 100, 2, 100)}%"></i></div></div>`; }).join("") + `<div class="maxline">You can make up to <b>${canMake(p)}</b> units of ${esc(p.name)} with what is on the shelf.</div>`;
  };
  m.form.addEventListener("input", paint); m.form.addEventListener("change", paint); paint();
}
function pourView(m, p, qty, code, before) {
  const n = Math.min(8, Math.max(3, Math.ceil(qty / 10)));
  m.el.querySelector("h2").textContent = "Pouring the batch";
  m.body.innerHTML = `<div class="pour"><h3>${qty} × ${esc(p.name)}</h3><p class="muted">Mixing, filling and labelling</p><div class="jars">${Array.from({ length: n }, () => jar(p, 1, 54, 64)).join("")}</div><span class="lot">LOT ${esc(code)}</span><div class="drain">${Object.keys(p.recipe).map((k) => { const x = ingr(k); return `<div class="rq"><span>${esc(x.name)}</span><b class="num">${qtyU(x, x.stock)} left</b><div class="meter" style="--mc:var(--c1)"><i data-to="${clamp((x.stock / (Math.max(before[k], x.reorder * 3) || 1)) * 100, 0, 100)}" style="width:${clamp((before[k] / (Math.max(before[k], x.reorder * 3) || 1)) * 100, 0, 100)}%"></i></div></div>`; }).join("")}</div></div>`;
  m.el.querySelector(".modal-f").innerHTML = `<button type="button" class="btn" data-viewb>See batch log</button><button type="button" class="btn pri" data-close>Done</button>`;
  m.el.querySelector("[data-viewb]").addEventListener("click", () => { m.close(); R.go("batches"); });
  fillJars(m.body, 260);
  setTimeout(() => $$(".drain [data-to]", m.body).forEach((i) => (i.style.width = i.dataset.to + "%")), 300);
  toast(`Batch ${code} started · ${qty} units added to stock`);
  R.refresh();
}

async function deleteIng(x) {

  D().ing = D().ing.filter((y) => y !== x); save(); R.refresh(); toast(`${x.name} deleted`, "warn");
}
function productModal(p) {
  formModal({
    title: p ? "Edit product" : "Add product", submit: p ? "Save" : "Add product",
    values: p || { cat: "Serum", price: 1500, stock: 0, reorder: 12, shelf: 180, color: "#e58aa0", base: "rose" },
    fields: [
      { name: "name", label: "Product name", required: 1, full: 1 },
      { name: "cat", label: "Category", type: "select", options: ["Cleanser", "Serum", "Moisturiser", "Mask", "Soap", "Balm", "Toner"] },
      { name: "price", label: "Price (Rs)", type: "number", min: 50, required: 1 },
      { name: "stock", label: "Stock now", type: "number", min: 0, required: 1 },
      { name: "reorder", label: "Reorder level", type: "number", min: 1, required: 1 },
      { name: "shelf", label: "Shelf life (days)", type: "number", min: 7, max: 1000, required: 1 },
      { name: "color", label: "Jar colour", type: "color" },
      ...(p ? [] : [{ name: "base", label: "Main ingredient (50 per unit)", type: "select", options: D().ing.map((x) => ({ value: x.id, label: x.name })) }]),
    ],
    onSubmit: (v) => {
      if (p) Object.assign(p, { name: v.name, cat: v.cat, price: v.price, stock: v.stock, reorder: v.reorder, shelf: v.shelf, color: v.color });
      else { const n = D().products.length + 1; D().products.push({ id: "p" + Date.now(), sku: "SC-" + (100 + n + Math.floor(Math.random() * 90)), name: v.name, cat: v.cat, price: v.price, stock: v.stock, reorder: v.reorder, shelf: v.shelf, color: v.color, oh: 250, w: 0.8, recipe: { [v.base]: 50, label: 1 } }); }
      save(); R.refresh(); toast(p ? `${v.name} updated` : `${v.name} added to the shelf`);
    },
  });
}
function customerModal() {
  formModal({
    title: "Add customer", submit: "Add customer",
    fields: [{ name: "name", label: "Full name", required: 1, validate: (v) => (D().customers.some((c) => c.name.toLowerCase() === v.toLowerCase()) ? "This customer already exists" : "") }, { name: "city", label: "City", type: "select", options: PK.cities }, { name: "email", label: "Email", type: "email", required: 1 }, { name: "phone", label: "Phone", type: "tel", required: 1, placeholder: "03xx-xxxxxxx" }],
    onSubmit: (v) => { D().customers.push({ id: "c" + Date.now(), name: v.name, city: v.city, email: v.email, phone: v.phone, since: Date.now(), prior: 0, priorSpent: 0 }); save(); R.refresh(); toast(`${v.name} added`); },
  });
}

/* Page-level buttons (delegated, so re-rendered pages keep working) */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-batch],[data-neworder],[data-receive],[data-addprod],[data-addingr],[data-addcust],[data-pickup],[data-export],[data-exportrev]");
  if (!b) return;
  if (b.hasAttribute("data-batch")) batchModal(b.dataset.batch || null);
  else if (b.hasAttribute("data-neworder")) orderModal();
  else if (b.hasAttribute("data-receive")) receiveModal(b.dataset.receive || null);
  else if (b.hasAttribute("data-addprod")) productModal();
  else if (b.hasAttribute("data-addingr")) ingModal();
  else if (b.hasAttribute("data-addcust")) customerModal();
  else if (b.hasAttribute("data-pickup")) {
    const packed = D().orders.filter((o) => o.status === "Packed");
    if (!packed.length) return toast("No packed orders waiting for a pickup", "info");
    packed.forEach((o) => { o.status = "Shipped"; o.courier = D().settings.courier; o.tracking = "KC" + Math.floor(100000 + Math.random() * 899999); });
    save(); R.refresh(); toast(`${D().settings.courier} will collect ${packed.length} parcels today`); Bell.add(`Pickup booked for ${packed.length} parcels`, "ok", true);
  } else if (b.hasAttribute("data-export")) downloadCSV("orders.csv", [["Order", "Placed", "Customer", "City", "Channel", "Total", "Status"], ...D().orders.map((o) => [o.id, fmt.dt(o.placed), o.customer, o.city, o.channel, o.total, o.status])]);
  else if (b.hasAttribute("data-exportrev")) downloadCSV("revenue.csv", [["Day", "Revenue", "Cost of goods"], ...kpiSpark(90, (o) => [fmt.iso(TODAY + o * DAY), Math.round(histAt(o)), Math.round(costAt(o))])]);
});

  { label: "Add customer", icon: "user", hint: "Action", run: () => customerModal() },

]);
