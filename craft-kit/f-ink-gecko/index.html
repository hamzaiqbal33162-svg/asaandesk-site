<!doctype html>
<!-- Chill & Craft · Ink Gecko · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Gecko · a line-drawn lizard that follows you</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens: ink on paper (light), chalk on slate (dark) ---------- */
  :root {
    --paper: #f5f1e8;
    --dots: rgba(40, 52, 64, 0.12);
    --ink: #22303c;
    --accent: #e4572e;
    --muted: #5d6b77;
    --bar: rgba(255, 255, 255, 0.78);
    --line: rgba(34, 48, 60, 0.18);
    --btn: #22303c;
    --btn-ink: #f5f1e8;
    --focus: #e4572e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b2428; --dots: rgba(220, 235, 230, 0.08); --ink: #dfeee6; --accent: #ffb454;
      --muted: #9fb3ab; --bar: rgba(20, 28, 31, 0.8); --line: rgba(223, 238, 230, 0.18);
      --btn: #dfeee6; --btn-ink: #1b2428; --focus: #ffb454;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b2428; --dots: rgba(220, 235, 230, 0.08); --ink: #dfeee6; --accent: #ffb454;
    --muted: #9fb3ab; --bar: rgba(20, 28, 31, 0.8); --line: rgba(223, 238, 230, 0.18);
    --btn: #dfeee6; --btn-ink: #1b2428; --focus: #ffb454;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dots) 1.2px, transparent 1.3px);
    background-size: 22px 22px;
  }
  .stage { position: relative; width: 100%; height: 100vh; min-height: 360px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Toolbar ---------- */
  .bar {
    position: absolute;
    left: 12px;
    top: 12px;
    right: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    pointer-events: none; /* the canvas under it still gets the mouse */
  }
  .bar > * { pointer-events: auto; }
  .btn {
    font: 700 14px system-ui, sans-serif;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 14px;
    background: var(--bar);
    color: var(--ink);
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .btn.solid { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .count {
    margin: 0 0 0 auto;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--bar);
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    margin: 0;
    width: max-content;
    max-width: calc(100% - 24px);
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    canvas { cursor: default; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="sr">Ink Gecko: a line-drawn lizard that crawls after your pointer and eats bugs</h1>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="bar">
    <button class="btn solid" id="bug" type="button">Drop a bug</button>
    <button class="btn" id="mode" type="button" aria-pressed="true">Follow my pointer</button>
    <p class="count" id="count" aria-live="polite">Bugs eaten: 0</p>
  </div>
  <p class="hint">Move to lead the gecko. Tap or click to drop a bug for it.</p>
</main>

<script>
  (function () {
    "use strict";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), canvas = $("c"), ctx = canvas.getContext("2d");
    var countEl = $("count"), modeBtn = $("mode");

    var W = 0, H = 0, s = 1, inkColor = "#22303c", accent = "#e4572e";
    function readColours() {
      var cs = getComputedStyle(document.documentElement);
      inkColor = cs.getPropertyValue("--ink").trim();
      accent = cs.getPropertyValue("--accent").trim();
    }

    /* ---------- Gecko body: a chain of spine points ---------- */
    var SEGMENTS = 34, spine = [], heading = 0, breath = 1;
    function segLen() { return 8 * s; }
    function halfWidth(i) {
      var w;
      if (i <= 3) w = [5, 10, 11.5, 10][i];
      else if (i === 4) w = 7;
      else if (i <= 14) w = (9 + 6 * Math.sin(((i - 4) / 10) * Math.PI)) * breath; // belly bulge that breathes
      else w = Math.max(0.8, 9 * (1 - (i - 14) / 20));                 // tapering tail
      return w * s;
    }

    /* Legs: front pair on segment 6, back pair on segment 13 */
    var LEGS = [
      { seg: 6, side: 1, ang: 0.95 }, { seg: 6, side: -1, ang: 0.95 },
      { seg: 13, side: 1, ang: 2.1 }, { seg: 13, side: -1, ang: 2.1 }
    ];
    LEGS.forEach(function (L) { L.fx = 0; L.fy = 0; L.step = 0; L.ox = 0; L.oy = 0; L.tx = 0; L.ty = 0; });
    var PARTNER = [3, 2, 1, 0]; // diagonal partners step together

    function layout() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      W = stage.clientWidth; H = stage.clientHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      s = Math.max(0.6, Math.min(1.3, Math.min(W, H) / 520));
      if (!spine.length) {
        for (var i = 0; i < SEGMENTS; i++) spine.push({ x: W / 2 + 120 * s - i * segLen(), y: H / 2 });
        LEGS.forEach(function (L) { var f = idealFoot(L); L.fx = f.x; L.fy = f.y; });
      }
    }
    new ResizeObserver(layout).observe(stage);

    function dirAt(i) {
      var a = spine[Math.max(0, i - 1)], b = spine[Math.min(SEGMENTS - 1, i + 1)];
      return Math.atan2(a.y - b.y, a.x - b.x);
    }
    function idealFoot(L) {
      var p = spine[L.seg], d = dirAt(L.seg), reach = 30 * s;
      var a = d + L.side * L.ang;
      return { x: p.x + Math.cos(a) * reach, y: p.y + Math.sin(a) * reach };
    }

    /* ---------- Targets: pointer, bugs, or a wander spot ---------- */
    var pointer = { x: 0, y: 0, last: -1e9 }, follow = true;
    var bugs = [], eaten = 0, wander = null, restUntil = 0, tongue = 0;
    var downAt = null;

    canvas.addEventListener("pointermove", function (e) {
      pointer.x = e.offsetX; pointer.y = e.offsetY; pointer.last = performance.now();
    });
    canvas.addEventListener("pointerdown", function (e) {
      pointer.x = e.offsetX; pointer.y = e.offsetY; pointer.last = performance.now();
      downAt = { x: e.clientX, y: e.clientY, t: performance.now() };
    });
    canvas.addEventListener("pointerup", function (e) {
      // a short tap (not a drag) drops a bug where you tapped
      if (downAt && Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) < 8 && performance.now() - downAt.t < 400) addBug(e.offsetX, e.offsetY);
      downAt = null;
    });
    $("bug").addEventListener("click", function () {
      var h = spine[0], x, y, tries = 0;
      do { x = 40 + Math.random() * (W - 80); y = 80 + Math.random() * (H - 140); tries++; }
      while (Math.hypot(x - h.x, y - h.y) < Math.min(W, H) * 0.3 && tries < 20);
      addBug(x, y);
    });
    modeBtn.addEventListener("click", function () {
      follow = !follow;
      modeBtn.setAttribute("aria-pressed", String(follow));
      modeBtn.textContent = follow ? "Follow my pointer" : "Let it wander";
    });

    function addBug(x, y) {
      if (bugs.length >= 4) bugs.shift();
      bugs.push({ x: x, y: y, hx: x, hy: y, ph: Math.random() * 6.28 });
    }

    function pickTarget(now) {
      var head = spine[0];
      if (bugs.length) {
        var best = bugs[0], bd = Infinity;
        bugs.forEach(function (b) { var d = Math.hypot(b.x - head.x, b.y - head.y); if (d < bd) { bd = d; best = b; } });
        return { x: best.x, y: best.y, speed: 330, bug: best };
      }
      if (follow && now - pointer.last < 2500) return { x: pointer.x, y: pointer.y, speed: 260 };
      if (reduce.matches) return null; // calm mode: no idle wandering
      if (now < restUntil) return null;
      if (!wander || Math.hypot(wander.x - head.x, wander.y - head.y) < 30 * s) {
        if (wander) { wander = null; restUntil = now + 600 + Math.random() * 1400; return null; }
        wander = { x: 60 + Math.random() * (W - 120), y: 90 + Math.random() * (H - 160) };
      }
      return { x: wander.x, y: wander.y, speed: 120 };
    }

    /* ---------- Update ---------- */
    function update(now, dt) {
      var head = spine[0], target = pickTarget(now);
      var calm = reduce.matches;
      if (target) {
        var dx = target.x - head.x, dy = target.y - head.y, dist = Math.hypot(dx, dy);
        var want = Math.atan2(dy, dx), diff = want - heading;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        var turn = 5 * dt;
        heading += Math.max(-turn, Math.min(turn, diff));
        var speed = Math.min(target.speed * s * (calm ? 0.5 : 1), dist * 2.2);
        if (dist > 10 * s) {
          head.x += Math.cos(heading) * speed * dt;
          head.y += Math.sin(heading) * speed * dt;
        }
        if (target.bug && dist < 18 * s) eat(target.bug);
      }
      // body follows the head, with a limit on how sharply each joint bends
      var L = segLen(), prevAng = heading;
      for (var i = 1; i < SEGMENTS; i++) {
        var a = spine[i - 1], b = spine[i];
        var ang = Math.atan2(a.y - b.y, a.x - b.x), d = ang - prevAng;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        if (d > 0.42) ang = prevAng + 0.42;
        if (d < -0.42) ang = prevAng - 0.42;
        b.x = a.x - Math.cos(ang) * L;
        b.y = a.y - Math.sin(ang) * L;
        prevAng = ang;
      }
      // feet stay planted until they lag too far, then take a quick step
      LEGS.forEach(function (leg, k) {
        if (leg.step > 0) {
          leg.step = Math.min(1, leg.step + dt / 0.12);
          var q = leg.step;
          leg.fx = leg.ox + (leg.tx - leg.ox) * q;
          leg.fy = leg.oy + (leg.ty - leg.oy) * q;
          if (q >= 1) { leg.step = 0; stamp(leg); }
          return;
        }
        var ideal = idealFoot(leg);
        // only step while the other diagonal pair is planted
        var otherPairPlanted = LEGS[k ^ 1].step === 0 && LEGS[PARTNER[k] ^ 1].step === 0;
        if (Math.hypot(ideal.x - leg.fx, ideal.y - leg.fy) > 20 * s && otherPairPlanted) {
          var dd = dirAt(leg.seg);
          leg.ox = leg.fx; leg.oy = leg.fy;
          leg.tx = ideal.x + Math.cos(dd) * 8 * s;
          leg.ty = ideal.y + Math.sin(dd) * 8 * s;
          leg.step = 0.0001;
        }
      });
      // bugs hover in small loops
      bugs.forEach(function (b) {
        if (calm) return;
        b.ph += dt * 3;
        b.x = b.hx + Math.cos(b.ph) * 10;
        b.y = b.hy + Math.sin(b.ph * 1.3) * 7;
      });
      tongue = Math.max(0, tongue - dt);
      if (!calm && !target && tongue === 0 && Math.random() < dt * 0.25) tongue = 0.3;

      // effects age; bugs leave a short buzzing trail
      shake = Math.max(0, shake - dt);
      nextBlink -= dt;
      if (nextBlink <= 0) { blink = 0.14; nextBlink = 2 + Math.random() * 4; }
      blink = Math.max(0, blink - dt);
      prints.forEach(function (p) { p.life -= dt; });
      while (prints.length && prints[0].life <= 0) prints.shift();
      splashes.forEach(function (p) { p.life -= dt; p.vx *= 1 - 3 * dt; p.vy *= 1 - 3 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
      splashes = splashes.filter(function (p) { return p.life > 0; });
      pops.forEach(function (p) { p.life -= dt * 0.9; p.y -= 40 * dt; });
      pops = pops.filter(function (p) { return p.life > 0; });
      if (!calm) bugs.forEach(function (b) { buzz.push({ x: b.x, y: b.y, life: 0.4 }); });
      buzz.forEach(function (p) { p.life -= dt; });
      buzz = buzz.filter(function (p) { return p.life > 0; });
    }

    /* ---------- Juice: footprints, ink splashes, score pops, a little shake ---------- */
    var prints = [], splashes = [], pops = [], buzz = [], shake = 0, blink = 0, nextBlink = 2;
    function stamp(leg) {
      if (reduce.matches) return;
      prints.push({ x: leg.fx, y: leg.fy, a: dirAt(leg.seg), life: 4 });
      if (prints.length > 60) prints.shift();
    }
    function eat(bug) {
      bugs.splice(bugs.indexOf(bug), 1);
      eaten++;
      tongue = 0.3;
      countEl.textContent = "Bugs eaten: " + eaten;
      pops.push({ x: bug.x, y: bug.y - 10, text: "+1", life: 1 });
      if (reduce.matches) return;
      shake = 0.25;
      for (var i = 0; i < 18; i++) {
        var a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
        splashes.push({ x: bug.x, y: bug.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: (1 + Math.random() * 2.5) * s, life: 0.9 + Math.random() * 0.6 });
      }
    }

    /* ---------- Draw ---------- */
    function draw(now) {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake * 4, (Math.random() - 0.5) * 10 * shake * 4);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = inkColor;
      ctx.fillStyle = inkColor;

      // fading ink footprints: a palm and four toe dots
      prints.forEach(function (p) {
        ctx.globalAlpha = Math.min(1, p.life / 4) * 0.28;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.4 * s, 0, Math.PI * 2); ctx.fill();
        for (var t = -1.5; t <= 1.5; t += 1) {
          var ta = p.a + t * 0.5;
          ctx.beginPath(); ctx.arc(p.x + Math.cos(ta) * 6 * s, p.y + Math.sin(ta) * 6 * s, 1.3 * s, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      // buzzing trails behind the bugs
      ctx.fillStyle = accent;
      buzz.forEach(function (p) {
        ctx.globalAlpha = p.life * 0.6;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.2 * s, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.fillStyle = inkColor;

      // body outline from left and right edge points
      var left = [], right = [];
      for (var i = 0; i < SEGMENTS; i++) {
        var a = dirAt(i), w = halfWidth(i), p = spine[i];
        var nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
        left.push({ x: p.x + nx * w, y: p.y + ny * w });
        right.push({ x: p.x - nx * w, y: p.y - ny * w });
      }

      // legs first, so the body outline sits on top of the hips
      ctx.lineWidth = 1.6;
      LEGS.forEach(function (leg) {
        var p = spine[leg.seg], a = dirAt(leg.seg);
        var sx = p.x + Math.cos(a + leg.side * Math.PI / 2) * halfWidth(leg.seg) * 0.7;
        var sy = p.y + Math.sin(a + leg.side * Math.PI / 2) * halfWidth(leg.seg) * 0.7;
        var seg = 17 * s, dx = leg.fx - sx, dy = leg.fy - sy;
        var d = Math.min(Math.hypot(dx, dy), seg * 1.98), base = Math.atan2(dy, dx);
        var bend = Math.acos(d / (2 * seg)) * leg.side * (leg.seg < 10 ? -1 : 1);
        var kx = sx + Math.cos(base + bend) * seg, ky = sy + Math.sin(base + bend) * seg;
        var fx = sx + Math.cos(base) * d, fy = sy + Math.sin(base) * d;
        ctx.beginPath();
        ctx.moveTo(sx, sy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy);
        ctx.stroke();
        // four splayed toes with sticky pads
        for (var t = -1.5; t <= 1.5; t += 1) {
          var ta = base + t * 0.42, tx = fx + Math.cos(ta) * 7 * s, ty = fy + Math.sin(ta) * 7 * s;
          ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.beginPath(); ctx.arc(tx, ty, 1.5 * s, 0, Math.PI * 2); ctx.fill();
        }
      });

      ctx.lineWidth = 1.8;
      ctx.beginPath();
      var nose = spine[0], hd = dirAt(0);
      ctx.moveTo(nose.x + Math.cos(hd) * 5 * s, nose.y + Math.sin(hd) * 5 * s);
      smoothThrough(left);
      var tip = spine[SEGMENTS - 1];
      ctx.lineTo(tip.x, tip.y);
      smoothThrough(right.slice().reverse());
      ctx.closePath();
      ctx.stroke();

      // ribs and a dotted spine give the sketchbook look
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.45;
      for (i = 5; i < SEGMENTS - 4; i += 2) {
        var m = 0.55;
        ctx.beginPath();
        ctx.moveTo(spine[i].x + (left[i].x - spine[i].x) * m, spine[i].y + (left[i].y - spine[i].y) * m);
        ctx.lineTo(spine[i].x + (right[i].x - spine[i].x) * m, spine[i].y + (right[i].y - spine[i].y) * m);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.7;
      for (i = 4; i < SEGMENTS - 2; i++) {
        ctx.beginPath(); ctx.arc(spine[i].x, spine[i].y, 1.1 * s, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // eyes
      var e = spine[2], ea = dirAt(2);
      [1, -1].forEach(function (side) {
        var ex = e.x + Math.cos(ea + side * Math.PI / 2) * halfWidth(2) * 0.62;
        var ey = e.y + Math.sin(ea + side * Math.PI / 2) * halfWidth(2) * 0.62;
        if (blink > 0) {
          // a closed eye is just a short line
          ctx.beginPath();
          ctx.moveTo(ex - Math.cos(ea) * 3 * s, ey - Math.sin(ea) * 3 * s);
          ctx.lineTo(ex + Math.cos(ea) * 3 * s, ey + Math.sin(ea) * 3 * s);
          ctx.stroke();
          return;
        }
        ctx.beginPath(); ctx.arc(ex, ey, 3.2 * s, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(ex + Math.cos(ea) * s, ey + Math.sin(ea) * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();
      });

      // forked tongue flick
      if (tongue > 0) {
        var len = Math.sin((tongue / 0.3) * Math.PI) * 20 * s;
        var bx = nose.x + Math.cos(hd) * 5 * s, by = nose.y + Math.sin(hd) * 5 * s;
        var tx2 = bx + Math.cos(hd) * len, ty2 = by + Math.sin(hd) * len;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(bx, by); ctx.lineTo(tx2, ty2);
        ctx.lineTo(tx2 + Math.cos(hd + 0.5) * 4 * s, ty2 + Math.sin(hd + 0.5) * 4 * s);
        ctx.moveTo(tx2, ty2);
        ctx.lineTo(tx2 + Math.cos(hd - 0.5) * 4 * s, ty2 + Math.sin(hd - 0.5) * 4 * s);
        ctx.stroke();
      }

      // bugs: a round body and two buzzing wings
      bugs.forEach(function (b) {
        var flap = reduce.matches ? 0.5 : Math.abs(Math.sin(now / 40 + b.ph));
        ctx.strokeStyle = accent;
        ctx.fillStyle = accent;
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(b.x, b.y, 4.5 * s, 3.2 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(b.x - 3 * s, b.y - 4 * s, 4 * s, (1 + 2.5 * flap) * s, -0.6, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(b.x + 3 * s, b.y - 4 * s, 4 * s, (1 + 2.5 * flap) * s, 0.6, 0, Math.PI * 2); ctx.stroke();
      });

      // ink splashes and floating score pops
      ctx.fillStyle = accent;
      splashes.forEach(function (p) {
        ctx.globalAlpha = Math.min(1, p.life * 1.5);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });
      ctx.font = "800 " + Math.round(18 * s + 4) + "px system-ui, sans-serif";
      ctx.textAlign = "center";
      pops.forEach(function (p) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillText(p.text, p.x, p.y);
      });
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // quadratic curves through the midpoints make a smooth outline
    function smoothThrough(list) {
      for (var i = 0; i < list.length - 1; i++) {
        var a = list[i], b = list[i + 1];
        ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
      }
    }

    /* ---------- Loop ---------- */
    var prev = performance.now();
    function loop(now) {
      var dt = Math.min(0.033, (now - prev) / 1000);
      prev = now;
      breath = reduce.matches ? 1 : 1 + 0.05 * Math.sin(now / 1000 * 3);
      if (spine.length) { update(now, dt); draw(now); }
      requestAnimationFrame(loop);
    }
    readColours();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColours);
    layout();
    requestAnimationFrame(loop);
  })();
