            if (k === "profit" && x < 15000) x = Math.max(x, 15200);
            if (k === "dividend" && !x) x = [0, 9000, 4200, 11250, 0, 9900][(i + 12) % 6];
            if (k === "payout" && !x && i % 3 === 0) x = 20580;
          }
          vals[k].push(x);
        });
      }
      const drawB = () => barChart($("#incBars", v), { cats, stacks: Object.keys(vals).map((k) => ({ name: TX_KINDS[k].l, color: INC_COLORS[k], vals: vals[k] })), ghostFrom: 12, h: 236, aria: "Income by month", tipFn: (i) => `<b>${cats[i]}${i >= 12 ? " (forecast)" : ""}</b>${Object.keys(vals).map((k) => `<div class="tr" style="--k:${INC_COLORS[k]}"><span><i></i>${TX_KINDS[k].l}</span><b class="m">${pkr(vals[k][i])}</b></div>`).join("")}<div class="tr"><span>Total</span><b class="m">${pkr(sum(Object.keys(vals), (k) => vals[k][i]))}</b></div>` });
      drawB();
      RESIZE = drawB;
      const tb = $("#payT", v);
      const drawP = () => {
        const list = S.payouts.slice().sort((a, b) => a.date.localeCompare(b.date)).filter((p) => UI.dv.show === "all" || (UI.dv.show === "30" ? daysFrom(p.date) <= 30 : p.st === "Announced"));
        tb.innerHTML = list.length ? list.map((p) => { const h = hById(p.hid), d = parse(p.date); return `<tr data-p="${p.id}"><td><span class="row" style="gap:8px"><span class="dchip" style="width:38px;height:38px"><span><b style="font-size:13.5px">${d.getDate()}</b><small>${MON[d.getMonth()]}</small></span></span><small class="muted hide-sm">${rel(p.date)}</small></span></td><td>${h ? `<span class="hname">${hIcon(h, true)}<span><b>${esc(h.name)}</b><small>${TX_KINDS[p.kind].l}</small></span></span>` : "—"}</td><td class="hide-sm hide-md muted" style="white-space:normal;min-width:150px">${esc(p.note || "")}</td><td class="hide-sm"><span class="pill ${p.st === "Announced" ? "up" : p.st === "Expected" ? "" : "gold"}">${esc(p.st)}</span></td><td class="r"><b class="m">${pkr(p.amt)}</b></td><td class="acts"><button type="button" class="btn sm" data-got="${p.id}">${ic("check")}<span class="hide-sm">Received</span></button></td></tr>`; }).join("") : `<tr><td colspan="6"><div class="empty">${ic("calendar")}Nothing in this view.</div></td></tr>`;
      };
      drawP();
      onSeg(v, "dvs", (x) => { UI.dv.show = x; drawP(); });
      tb.addEventListener("click", (e) => {
        const b = e.target.closest("[data-got]");
        if (!b) return;
        const p = S.payouts.find((x) => x.id === b.dataset.got);
        if (!p) return;
        const h = hById(p.hid);
        S.payouts = S.payouts.filter((x) => x !== p);
        S.tx.unshift({ id: "t" + uid(), date: iso(TODAY), kind: p.kind, hid: p.hid, qty: 0, price: 0, amount: p.amt, fee: 0, note: p.note || "" });
        moveSavings(p.amt);
        if (p.rec) { const nd = parse(p.date); S.payouts.push({ ...p, id: "p" + uid(), date: iso(new Date(nd.getFullYear(), nd.getMonth() + 1, nd.getDate())) }); }
        if (h && h.re && (h.k === "stock" || h.k === "fund")) { const q = Math.floor(p.amt / price(h)); if (q > 0) { h.cost = (h.cost * h.qty + q * price(h)) / (h.qty + q); h.qty += q; moveSavings(-q * price(h)); } }
        save();
        feedPush("coins", "up", (h ? h.name : "Payout") + " paid you", pkr(p.amt) + (h && h.re ? " · reinvested" : " · in your savings account"));
        toast(pkr(p.amt) + " received" + (h && h.re ? " and reinvested" : ""));
        refresh();
      });
      v.addEventListener("change", (e) => { const id = e.target.dataset.re; if (!id) return; const h = hById(id); h.re = e.target.checked; save(); toast(h.re ? `Dividends from ${h.name} will buy more of it` : `Dividends from ${h.name} go to your savings account`); });
    },
  };
};
</script>
<script>
/* =====================================================================
   Page: Goals — goal cards with rings, and a planner for the selected
   goal: move the sliders and watch the date you get there change
   ===================================================================== */
const GOAL_ICONS = [["cap", "Studies"], ["plane", "Travel or Hajj"], ["shield", "Emergency"], ["car", "Car"], ["rings", "Wedding"], ["home", "Home"], ["star", "Something else"]];
function goalForm(g = null) {
  const isNew = !g;
  formModal({
    title: isNew ? "New goal" : "Edit " + g.name, submit: isNew ? "Add goal" : "Save goal",
    values: g ? { name: g.name, target: g.target, saved: g.saved, monthly: g.monthly, by: g.by, ret: g.ret, icon: g.icon } : { saved: 0, monthly: 20000, ret: 10, icon: "star", by: iso(new Date(TODAY.getFullYear() + 2, TODAY.getMonth(), 1)) },
    fields: [
      { name: "name", label: "What is it for?", required: true, auto: true, placeholder: "For example: Umrah for the family", check: (v) => (v.length < 3 ? "Use at least 3 letters" : "") },
      { name: "target", label: "Target (PKR)", type: "number", half: true, required: true, min: 10000 },
      { name: "by", label: "Needed by", type: "date", half: true, required: true, check: (v) => (v <= iso(TODAY) ? "Pick a date in the future" : "") },
      { name: "saved", label: "Saved so far (PKR)", type: "number", half: true, min: 0, check: (v, a) => (v !== "" && a.target !== "" && v > a.target * 2 ? "That is far above the target" : "") },
      { name: "monthly", label: "Put in each month (PKR)", type: "number", half: true, required: true, min: 0 },
      { name: "ret", label: "Expected yearly return", type: "select", half: true, options: [0, 5, 8, 10, 12, 15].map((x) => [x, x + "%"]) },
      { name: "icon", label: "Icon", type: "select", half: true, options: GOAL_ICONS },
    ],
    onSubmit: (v) => {
      const d = g || { id: "g" + uid() };
      Object.assign(d, { name: v.name, target: v.target, by: v.by, saved: v.saved || 0, monthly: v.monthly, ret: +v.ret, icon: v.icon });
      if (isNew) { S.goals.push(d); UI.gl.sel = d.id; }
      UI.gl.monthly = null; UI.gl.ret = null;
      save();
      toast(isNew ? "Goal added: " + v.name : "Saved " + v.name);
      refresh();
    },
  });
}
function goalCard(g) {
  const gi = goalInfo(g);
  return `<article class="card goal lift${UI.gl.sel === g.id ? "" : ""}" data-g="${g.id}" aria-current="${UI.gl.sel === g.id}" tabindex="0" aria-label="${esc(g.name)}, open the planner">
    <div class="gh">${g.photo ? `<img src="img/${g.photo}.webp" alt="" width="380" height="92" loading="lazy">` : `<span class="pat" style="--g1:${g.g1 || "#1a5a43"};--g2:${g.g2 || "#0b2a20"}"></span>`}<span class="gic">${ic(g.icon)}</span><span class="st">${goalPill(g, gi)}</span></div>
    <div class="gb"><div style="min-width:0"><h3>${esc(g.name)}</h3><div class="amt"><b class="m">${pkr(g.saved, { short: true })}</b> of <span class="m">${pkr(g.target, { short: true })}</span></div><small class="muted">${esc(g.note || "")}</small></div>${ring(gi.p, 58, 6, gi.behind ? "var(--amber)" : gi.done ? "var(--green)" : "var(--gold-2)")}</div>
    <div class="gf"><button type="button" class="btn sm primary" data-add="${g.id}">${ic("plus")}Add money</button><button type="button" class="btn sm" data-edit="${g.id}">${ic("edit")}Edit</button><button type="button" class="ibtn sm" data-del="${g.id}" aria-label="Delete ${esc(g.name)}">${ic("trash")}</button></div>
  </article>`;
}
/* one row per goal: the gold bar runs from today to the month you reach it, the flag marks when you need it */
function goalTimeline() {
  if (!S.goals.length) return "";
  let last = addMonths(TODAY, 24);
  const info = S.goals.map((g) => {
    const gi = goalInfo(g), reach = gi.done ? TODAY : gi.n >= 600 ? null : parse(gi.reach), by = parse(g.by);
    [reach, by].forEach((d) => { if (d && d > last) last = d; });
    return { g, gi, reach, by };
  });
  const end = new Date(last.getFullYear() + 1, 0, 1), span = end - TODAY;
  const at = (d) => clamp(((d - TODAY) / span) * 100, 0, 100);
  const years = [];
  for (let y = TODAY.getFullYear() + 1; y < end.getFullYear(); y++) years.push(y);
  const ylines = years.map((y) => `<i class="yl" style="left:${at(new Date(y, 0, 1)).toFixed(2)}%"></i>`).join("");
  return `<section class="card">
    <div class="ch"><div><h3>${ic("calendar")}When each goal lands</h3><p>The bar runs until you reach the target at today's pace. The flag is when you need it.</p></div><div class="legend"><span style="--k:var(--gold-2)"><i></i>On time</span><span style="--k:var(--amber)"><i></i>Late</span></div></div>
    <div class="tl">${info.map(({ g, gi, reach, by }) => `<div class="tr-row"><b>${ic(g.icon)}${esc(g.name)}</b><span class="trk">${ylines}<span class="run${gi.behind ? " late" : ""}" data-w="${reach ? at(reach).toFixed(2) : 100}"></span><span class="flag" style="left:${at(by).toFixed(2)}%" title="Needed by ${fmonY(g.by)}"></span></span><small>${gi.done ? "Done" : reach ? fmonY(gi.reach) : "Not yet"}</small></div>`).join("")}
      <div class="axis"><span></span><div><span style="transform:none;left:0">Today</span>${years.filter((y) => at(new Date(y, 0, 1)) > 9 && at(new Date(y, 0, 1)) < 96).map((y) => `<span style="left:${at(new Date(y, 0, 1)).toFixed(2)}%">${y}</span>`).join("")}</div><span></span></div>
    </div>
  </section>`;
}
PAGES.goals = () => {
  if (!S.goals.find((g) => g.id === UI.gl.sel)) UI.gl.sel = (S.goals[0] || {}).id;
  const g = S.goals.find((x) => x.id === UI.gl.sel);
  const tot = sum(S.goals, (x) => x.target), sv = sum(S.goals, (x) => x.saved);
  const behind = S.goals.filter((x) => goalInfo(x).behind).length;
  return {
    title: "Goals",
    sub: `<span>${ic("target")}<b>${S.goals.length}</b> goals · <b class="m">${pkr(sv, { short: true })}</b> saved of <span class="m">${pkr(tot, { short: true })}</span></span><span>${ic("repeat")}<b class="m">${pkr(sum(S.goals, (x) => x.monthly))}</b> a month</span><span>${ic(behind ? "alert" : "check")}${behind ? `<b>${behind}</b> behind plan` : "All on track"}</span>`,
    acts: [{ label: "New goal", icon: "plus", kind: "primary", fn: () => goalForm() }],
    html: `<div class="grid">
        <div class="s8 stack"><div class="goals" id="goalGrid">${S.goals.map(goalCard).join("")}<button type="button" class="card goal add" id="goalNew">${ic("plus")}<b>Add a goal</b><small>Studies, Hajj, a home, a wedding…</small></button></div>${goalTimeline()}</div>
        <section class="card s4" id="planner">${g ? `
          <div class="ch"><div><h3>${ic(g.icon)}${esc(g.name)}</h3><p>Needed by ${fdateY(g.by)} · ${esc(g.note || "")}</p></div></div>
          <div class="row" style="gap:14px;margin-bottom:12px">${ring(goalInfo(g).p, 74, 8, "var(--gold-2)")}<div><div class="lbl">Saved</div><div class="big m">${MH(g.saved)}</div><small class="muted m">of ${pkr(g.target)}</small></div></div>
          <div class="sl"><div class="row"><label for="glM">Each month</label><b class="m" id="glMv"></b></div><input type="range" id="glM" min="0" max="${Math.max(150000, g.monthly * 3)}" step="1000" value="${UI.gl.monthly != null ? UI.gl.monthly : g.monthly}"></div>
          <div class="sl"><div class="row"><label for="glR">Yearly return</label><b id="glRv"></b></div><input type="range" id="glR" min="0" max="18" step="0.5" value="${UI.gl.ret != null ? UI.gl.ret : g.ret}"></div>
          <div id="glChart"></div>
          <div class="legend" style="margin:4px 0 8px"><span style="--k:var(--gold-2)"><i class="ln-k"></i>Your savings</span><span style="--k:var(--muted)"><i class="dash-k"></i>Target</span></div>
          <p class="note" id="glSay" style="font-size:12.5px;color:var(--ink-2)"></p>
          <div class="zsum" id="glMiles" style="font-size:12.5px"></div>
          <div class="mix-foot"><button type="button" class="btn sm ghost" id="glReset">Reset</button><span class="grow"></span><button type="button" class="btn sm primary" id="glSave">${ic("check")}Save this plan</button></div>` : `<div class="empty">${ic("target")}Add a goal to plan it here.</div>`}
        </section>
      </div>`,
    mount(v) {
      v.addEventListener("click", (e) => {
        const add = e.target.closest("[data-add]"), ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
        const gg = (id) => S.goals.find((x) => x.id === id);
        if (add) {
          const x = gg(add.dataset.add);
          formModal({ title: "Add money to " + x.name, submit: "Add", values: { amt: x.monthly || 10000 }, fields: [{ name: "amt", label: "Amount (PKR)", type: "number", required: true, min: 100, max: 50000000, auto: true }], intro: `Saved so far: <b class="m">${pkr(x.saved)}</b> of ${pkr(x.target)}.`, onSubmit: (f) => {
            const was = x.saved >= x.target;
            x.saved += f.amt; save();
            if (!was && x.saved >= x.target) { toast(`${x.name}: target reached!`); feedPush("star", "gold", x.name + " reached its target", pkr(x.saved)); }
            else toast(`${pkr(f.amt)} added to ${x.name}`);
            refresh();
          } });
          return;
        }
        if (ed) { goalForm(gg(ed.dataset.edit)); return; }
        if (del) { const x = gg(del.dataset.del); confirmBox(`Delete the goal "${x.name}"? The money stays where it is.`, "Delete goal", () => { const at = S.goals.indexOf(x); S.goals.splice(at, 1); save(); toast("Goal deleted", "", { label: "Undo", fn: () => { S.goals.splice(at, 0, x); save(); refresh(); } }); refresh(); }); return; }
        if (e.target.closest("#goalNew")) { goalForm(); return; }
        const card = e.target.closest(".goal[data-g]");
        if (card && card.dataset.g !== UI.gl.sel) { UI.gl.sel = card.dataset.g; UI.gl.monthly = null; UI.gl.ret = null; refresh(); }
      });
      $("#goalGrid", v).addEventListener("keydown", (e) => { const c = e.target.closest(".goal[data-g]"); if (c && e.target === c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); c.click(); } });
      if (!g) return;
      const mS = $("#glM", v), rS = $("#glR", v);
      const draw = (still) => {
        const mo = +mS.value, rt = +rS.value, gi = goalInfo(g, mo, rt), r = rt / 1200;
        UI.gl.monthly = mo; UI.gl.ret = rt;
        $("#glMv", v).textContent = pkr(mo);
        $("#glRv", v).textContent = pct(rt, 1);
        const N = Math.min(240, Math.max(gi.left, Math.min(gi.n, 240)) + 4);
        const vals = [], labels = [];
        let b = g.saved;
        for (let i = 0; i <= N; i++) { vals.push(b); labels.push(fmonY(iso(addMonths(TODAY, i)))); b = b * (1 + r) + mo; }
        lineChart($("#glChart", v), { series: [{ vals, color: "var(--gold-2)", area: true }, { vals: vals.map(() => g.target), color: "var(--muted)", dash: true }], labels, h: 170, still, xTicks: 4, aria: "Savings plan for " + g.name, pad: { l: 42, r: 6, t: 8, b: 22 }, tipFn: (i) => `<b>${labels[i]}</b><br><span class="m">${pkr(vals[i])}</span> saved` });
        /* milestones at this pace: quarter, half, three quarters, the whole target */
        const miles = [[0.25, "A quarter of the way"], [0.5, "Halfway"], [0.75, "Three quarters"], [1, "The whole target"]].map(([f, l]) => {
          if (g.saved >= g.target * f) return [l, "Reached", "up-t"];
          let bb = g.saved, k = 0;
          while (bb < g.target * f && k < 600) { bb = bb * (1 + r) + mo; k++; }
          return [l, k >= 600 ? "Not at this pace" : fmonY(iso(addMonths(TODAY, k))), ""];
        });
        $("#glMiles", v).innerHTML = miles.map(([l, d, c]) => `<div class="row"><span class="muted">${l}</span><b class="${c}">${d}</b></div>`).join("");
        const diff = gi.left - gi.n;
        $("#glSay", v).innerHTML = gi.done ? `${ic("star")}<span>Done: you have saved the whole amount.</span>` : gi.n >= 600 ? `${ic("alert")}<span>At this pace you will not get there. Put in more each month.</span>` : `${ic(diff >= 0 ? "check" : "clock")}<span>At <b class="m">${pkr(mo)}</b> a month and ${pct(rt, 1)} a year you reach <b class="m">${pkr(g.target, { short: true })}</b> in <b>${fmonY(gi.reach)}</b>, ${diff > 0 ? `${diff} month${diff > 1 ? "s" : ""} early` : diff === 0 ? "right on time" : `${-diff} month${diff < -1 ? "s" : ""} late. To be on time, put in <b class="m">${pkr(Math.ceil(gi.need / 500) * 500)}</b> a month`}.</span>`;
      };
      draw(false);
      mS.addEventListener("input", () => draw(true));
      rS.addEventListener("input", () => draw(true));
      $("#glReset", v).addEventListener("click", () => { mS.value = g.monthly; rS.value = g.ret; draw(true); });
      $("#glSave", v).addEventListener("click", () => { g.monthly = +mS.value; g.ret = +rS.value; UI.gl.monthly = null; UI.gl.ret = null; save(); toast("Plan saved for " + g.name); refresh(); });
      RESIZE = () => draw(true);
    },
  };
};

/* =====================================================================
   Page: Gold — live price board by karat, your gold bar, price chart,
   a tola calculator, your gold items and price alerts
   ===================================================================== */
let GDI = null;
const KARATS = [24, 22, 21, 18];
function boardRows() {
  const row = (id, label, chip, p, o) => { const c = ((p - o) / o) * 100; return `<tr><td><span class="karat"><i class="${id === "ag" ? "ag" : ""}">${chip}</i>${label}</span></td><td data-bp="${id}"><b>${fmt(p)}</b></td><td class="hide-sm" data-b10="${id}">${fmt(per10g(p))}</td><td class="hide-xs" data-b1="${id}">${fmt(p / TOLA_G)}</td><td data-bc="${id}"><span class="pill ${c >= 0 ? "up" : "down"}">${ic(c >= 0 ? "up" : "down")}${fmt(Math.abs(p - o))}</span></td></tr>`; };
  return KARATS.map((k) => row("k" + k, k + " karat", k + "K", gTola(k), gTolaO(k))).join("") + row("ag", "Silver", "Ag", MK.ag, MK.ago);
}
function alertForm() {
  formModal({
    title: "New gold price alert", submit: "Set alert",
    values: { karat: 24, dir: "above", price: Math.round(gTola(24) / 1000) * 1000 + 3000 },
    intro: `Today: 24K <b class="m">${pkr(gTola(24))}</b>, 22K <b class="m">${pkr(gTola(22))}</b> a tola.`,
    fields: [
      { name: "karat", label: "Karat", type: "select", half: true, options: KARATS.map((k) => [k, k + " karat"]) },
      { name: "dir", label: "When the price goes", type: "select", half: true, options: [["above", "Above"], ["below", "Below"]] },
      { name: "price", label: "Price per tola (PKR)", type: "number", required: true, min: 1000, check: (v, a) => { const now = gTola(+a.karat); return a.dir === "above" && v <= now ? "That is already below today's price of " + pkr(now) : a.dir === "below" && v >= now ? "That is already above today's price of " + pkr(now) : ""; } },
    ],
    onSubmit: (v) => { S.alerts.unshift({ id: "a" + uid(), karat: +v.karat, dir: v.dir, price: v.price, on: true }); save(); toast(`Alert set: ${v.karat}K ${v.dir} ${pkr(v.price)}`); if (CUR.name === "gold") refresh(); },
  });
}
/* check every alert after each tick; a hit switches the alert off */
function checkAlerts() {
  S.alerts.forEach((a) => {
    if (!a.on) return;
    const p = gTola(a.karat);
    if ((a.dir === "above" && p >= a.price) || (a.dir === "below" && p <= a.price)) {
      a.on = false; a.hit = Date.now(); save();
      if (S.prefs.notify.alerts) toast(`${a.karat}K gold is ${a.dir} ${pkr(a.price)}: now ${pkr(p)} a tola`);
      feedPush("bell", "gold", `${a.karat}K gold went ${a.dir} your alert`, `Now ${pkr(p)} a tola`);
      if (CUR.name === "gold") { const ul = $("#alerts"); if (ul) ul.innerHTML = alertsHTML(); }
      updateShell();
    }
  });
}
const alertsHTML = () => S.alerts.map((a) => `<li><span style="min-width:0"><b>${a.karat}K ${a.dir} <span class="m">${pkr(a.price)}</span></b><small>${a.hit ? "Hit " + ago(a.hit) : a.on ? `Now ${pkr(gTola(a.karat))} · ${pct(Math.abs(((a.price - gTola(a.karat)) / gTola(a.karat)) * 100), 1)} away` : "Paused"}</small></span><label class="sw"><input type="checkbox" data-al="${a.id}" ${a.on ? "checked" : ""} aria-label="Alert for ${a.karat} karat ${a.dir} ${fmt(a.price)}"><i></i></label><button type="button" class="ibtn sm bare" data-ald="${a.id}" aria-label="Delete this alert">${ic("trash")}</button></li>`).join("") || `<li><small class="muted">No alerts yet.</small></li>`;
PAGES.gold = () => {
  const T = totals(), golds = S.holdings.filter((h) => h.k === "gold"), tola = goldTolaHeld(), gv = T.by.gold.v, gc = T.by.gold.c;
  return {
    title: "Gold",
    sub: `<span>${ic("ingot")}You hold <b>${fmt(tola, 2)} tola</b> worth <b class="m">${pkr(gv)}</b></span><span>${ic("trend")}Up <b class="m up-t">${pkr(gv - gc, { plus: true })}</b> on what you paid</span><span>${ic("info")}1 tola = 11.664 grams</span>`,
    acts: [{ label: "Price alert", icon: "bell", fn: alertForm }, { label: "Buy or sell gold", icon: "swap", kind: "primary", fn: () => txForm({ kind: "buy", hid: (golds[0] || {}).id, title: "Buy or sell gold" }) }],
    html: `<div class="grid">
        <section class="card s7">
          <div class="ch"><div><h3>${ic("ingot")}Today's rates in Lahore</h3><p>Demo prices per tola, per 10 grams and per gram. They move every few seconds.</p></div><span class="pill up"><i></i>Live</span></div>
          <div class="g-hero">
            <div><div class="lbl">24 karat, one tola</div><div class="g-price m" id="gPrice"></div><div class="row" style="margin-top:6px" id="gChg"></div></div>
            <div id="gMini"></div>
          </div>
          <table class="board" style="margin-top:12px"><thead><tr><th>Metal</th><th>Per tola</th><th class="hide-sm">Per 10 grams</th><th class="hide-xs">Per gram</th><th>Today</th></tr></thead><tbody id="board">${boardRows()}</tbody></table>
        </section>
        <section class="card s5 vault">
          <div class="row"><span class="lbl">Your gold bar</span><span class="grow"></span><span class="pill">${fmt(tola, 2)} tola</span></div>
          <div class="row" style="align-items:flex-end;gap:12px;margin:6px 0 2px"><div class="v-amt m" id="gVal" style="margin:0"></div><span class="pill up" id="gGain"></span></div>
          <small id="gSay">${pct(goldShare(T))} of everything you own · target ${pct(mixTarget().gold, 0)}</small>
          <div class="ingot" id="gIngot" style="margin:14px 0 6px"></div>
          <div class="sl" style="margin:0"><div class="row" style="color:var(--vault-ink)"><label for="gMove">If gold moves</label><b id="gMoveV">Today's price</b></div><input type="range" id="gMove" min="-20" max="20" step="1" value="${UI.gd.move}"></div>
        </section>
      </div>
      <div class="grid">
        <section class="card s8">
          <div class="ch"><div><h3>${ic("trend")}Price per tola</h3><p>Five years ago a tola of 24K cost about PKR 121,500</p></div><div class="tools"><label class="sr-only" for="gK">Karat</label><select id="gK" style="width:auto;height:32px">${KARATS.map((k) => `<option value="${k}"${UI.gd.karat === k ? " selected" : ""}>${k} karat</option>`).join("")}</select>${seg("gr", [["1M", "1M"], ["6M", "6M"], ["1Y", "1Y"], ["5Y", "5Y"]], UI.gd.range, "Range")}</div></div>
          <div class="nw-head"><span class="big" id="gcBig"></span><span id="gcChg"></span></div>
          <div id="gChart"></div>
        </section>
        <section class="card s4">
          <div class="ch"><div><h3>${ic("percent")}Gold calculator</h3><p>What a piece is worth at today's rate</p></div></div>
          <div class="fields">
            <div class="field half"><label for="cW">Weight</label><input type="number" id="cW" min="0" step="0.01" value="${UI.gd.w}" inputmode="decimal"></div>
            <div class="field half"><label for="cU">Unit</label><select id="cU"><option value="tola"${UI.gd.unit === "tola" ? " selected" : ""}>Tola</option><option value="g"${UI.gd.unit === "g" ? " selected" : ""}>Grams</option></select></div>
            <div class="field half"><label for="cK">Karat</label><select id="cK">${KARATS.map((k) => `<option value="${k}"${UI.gd.ck === k ? " selected" : ""}>${k} karat</option>`).join("")}</select></div>
            <div class="field half"><label for="cM">Making charges</label><select id="cM">${[0, 5, 8, 12, 15].map((x) => `<option value="${x}"${UI.gd.making === x ? " selected" : ""}>${x}%</option>`).join("")}</select></div>
          </div>
          <div class="calc-out"><small>Value of the gold</small><b class="m" id="cOut"></b><small id="cDet"></small></div>
          <div class="mix-foot"><button type="button" class="btn sm" id="cAdd">${ic("plus")}Add to my gold</button><small class="muted" id="cErr" role="alert"></small></div>
        </section>
      </div>
      <div class="grid">
        <section class="card s8">
          <div class="ch"><div><h3>${ic("star")}Your gold</h3><p>Valued at today's rate for each karat</p></div><button type="button" class="btn sm" id="gAddItem">${ic("plus")}Add a piece</button></div>
          <div class="g-items" id="gItems">${golds.map((h) => `<button type="button" class="gitem" data-h="${h.id}" style="text-align:left;color:inherit;padding:0;font:inherit"><span class="ph-i">${h.photo ? `<img src="img/${h.photo}.webp" alt="${esc(h.name)}" width="300" height="169" loading="lazy">` : ic("coin")}</span><span class="bd"><b>${esc(h.name)} · ${h.karat}K</b><small>${fmt(h.qty, 2)} tola · ${esc(h.note || "")}</small><span class="row"><b class="m" data-gv="${h.id}">${pkr(value(h))}</b><span class="${upDown(gainOf(h))} m" style="font-size:12px;font-weight:650">${pkr(gainOf(h), { plus: true, short: true })}</span></span></span></button>`).join("")}</div>
        </section>
        <section class="card s4">
          <div class="ch"><div><h3>${ic("bell")}Price alerts</h3><p>We tell you when a rate crosses your line</p></div><button type="button" class="ibtn sm" id="alAdd" aria-label="New alert">${ic("plus")}</button></div>
          <ul class="alerts" id="alerts">${alertsHTML()}</ul>
        </section>
      </div>`,
    mount(v, anim) {
      const T2 = totals();
      cu($("#gPrice", v), MK.g24, MH, anim, 1000);
      $("#gChg", v).innerHTML = chgPill(MK.g24 - MK.g24o, ((MK.g24 - MK.g24o) / MK.g24o) * 100, "today");
      const g0 = gv - gc;
      $("#gGain", v).innerHTML = `${ic("up")}<span class="m">${pkr(g0, { plus: true, short: true })}</span>`;
      const moveSay = () => {
        const mv = +$("#gMove", v).value, gvv = T2.by.gold.v * (1 + mv / 100), all = T2.all - T2.by.gold.v + gvv, sh = (gvv / all) * 100;
        UI.gd.move = mv;
        $("#gMoveV", v).textContent = mv ? pct(mv, 0, true) + " → " + pct(sh, 1) + " gold" : "Today";
        cu($("#gVal", v), gvv, MH, false);
        if (GDI) GDI.set(sh);
        $("#gSay", v).textContent = `${pct(sh)} of everything you own · target ${pct(mixTarget().gold, 0)}${mv ? " · if gold moves " + pct(mv, 0, true) : ""}`;
      };
      cu($("#gVal", v), T2.by.gold.v * (1 + UI.gd.move / 100), MH, anim, 1200);
      GDI = ingot($("#gIngot", v), { share: goldShare(T2), target: mixTarget().gold, stamp: fmt(tola, 2) + " TOLA" });
      if (UI.gd.move) moveSay();
      $("#gMove", v).addEventListener("input", moveSay);
      const mini = () => { const pts = goldSeries("1M"); lineChart($("#gMini", v), { series: [{ vals: pts.map((p) => p.v), color: "var(--gold-2)", area: true }], labels: pts.map((p) => fdate(p.d)), h: 92, xTicks: 2, aria: "24 karat over a month", pad: { l: 4, r: 4, t: 6, b: 18 }, fmtY: () => "", tipFn: (i) => `<b>${fdate(pts[i].d)}</b><br>PKR ${fmt(pts[i].v)} a tola` }); };
      const big = (still) => {
        const k = UI.gd.karat, pts = goldSeries(UI.gd.range), vals = pts.map((p) => (p.v * k) / 24);
        $("#gcBig", v).innerHTML = MH(vals[vals.length - 1]);
        $("#gcChg", v).innerHTML = pctPill(((vals[vals.length - 1] - vals[0]) / vals[0]) * 100, 1);
        lineChart($("#gChart", v), { series: [{ vals, color: "var(--gold-2)", area: true }], labels: pts.map((p) => rangeLabel(p.d, UI.gd.range)), h: 210, still, aria: k + " karat price per tola", xTicks: 8, tipFn: (i) => `<b>${fdateY(pts[i].d)}</b><br>${k}K: PKR ${fmt(vals[i])} a tola` });
      };
      mini(); big(false);
      onSeg(v, "gr", (r) => { UI.gd.range = r; big(false); });
      $("#gK", v).addEventListener("change", (e) => { UI.gd.karat = +e.target.value; big(false); });
      /* calculator */
      const calc = () => {
        const w = parseFloat($("#cW", v).value), u = $("#cU", v).value, k = +$("#cK", v).value, mk = +$("#cM", v).value;
        UI.gd.w = isNaN(w) ? 0 : w; UI.gd.unit = u; UI.gd.ck = k; UI.gd.making = mk;
        const err = $("#cErr", v), inp = $("#cW", v);
        if (isNaN(w) || w <= 0) { inp.setAttribute("aria-invalid", "true"); err.textContent = "Enter a weight above zero"; $("#cOut", v).textContent = "—"; $("#cDet", v).textContent = ""; return null; }
        inp.removeAttribute("aria-invalid"); err.textContent = "";
        const tolas = u === "tola" ? w : w / TOLA_G, base = tolas * gTola(k), withM = base * (1 + mk / 100);
        $("#cOut", v).textContent = pkr(base);
        $("#cDet", v).textContent = `${fmt(tolas, 3)} tola · ${fmt(tolas * TOLA_G, 2)} g · with ${mk}% making: ${pkr(withM)}`;
        return { tolas, k, base };
      };
      calc();
      ["cW", "cU", "cK", "cM"].forEach((id) => $("#" + id, v).addEventListener("input", calc));
      ["cU", "cK", "cM"].forEach((id) => $("#" + id, v).addEventListener("change", calc));
      $("#cAdd", v).addEventListener("click", () => {
        const r = calc();
        if (!r) { $("#cW", v).focus(); return; }
        S.holdings.push({ id: "h" + uid(), k: "gold", name: "Gold piece", code: r.k + " karat", karat: r.k, qty: r2(r.tolas), cost: Math.round(gTola(r.k)), unit: "tola", note: "Added from the calculator" });
        save(); toast(`${fmt(r.tolas, 2)} tola of ${r.k}K added to your gold`); refresh();
      });
      $("#gItems", v).addEventListener("click", (e) => { const b = e.target.closest("[data-h]"); if (b) holdingDrawer(hById(b.dataset.h)); });
      $("#gAddItem", v).addEventListener("click", () => holdingForm());
      $("#alAdd", v).addEventListener("click", alertForm);
      const al = $("#alerts", v);
      al.addEventListener("change", (e) => { const a = S.alerts.find((x) => x.id === e.target.dataset.al); if (!a) return; a.on = e.target.checked; if (a.on) a.hit = 0; save(); al.innerHTML = alertsHTML(); toast(a.on ? "Alert is on" : "Alert paused"); });
      al.addEventListener("click", (e) => { const b = e.target.closest("[data-ald]"); if (!b) return; const at = S.alerts.findIndex((x) => x.id === b.dataset.ald), a = S.alerts[at]; S.alerts.splice(at, 1); save(); al.innerHTML = alertsHTML(); toast("Alert deleted", "", { label: "Undo", fn: () => { S.alerts.splice(at, 0, a); save(); al.innerHTML = alertsHTML(); } }); });
      RESIZE = () => { mini(); big(true); };
    },
    tick() {
      countUp($("#gPrice"), MK.g24, MH, 500);
      const c = $("#gChg");
      if (c) c.innerHTML = chgPill(MK.g24 - MK.g24o, ((MK.g24 - MK.g24o) / MK.g24o) * 100, "today");
      const upd = (id, p, o) => {
        const cell = $(`[data-bp="${id}"] b`);
        if (!cell) return;
        const old = parseFloat(cell.textContent.replace(/,/g, ""));
        if (Math.round(old) === Math.round(p)) return;
        cell.textContent = fmt(p);
        $(`[data-b10="${id}"]`).textContent = fmt(per10g(p));
        $(`[data-b1="${id}"]`).textContent = fmt(p / TOLA_G);
        const ch = p - o;
        $(`[data-bc="${id}"]`).innerHTML = `<span class="pill ${ch >= 0 ? "up" : "down"}">${ic(ch >= 0 ? "up" : "down")}${fmt(Math.abs(ch))}</span>`;
        if (!calm()) { cell.classList.remove("fu", "fd"); void cell.offsetWidth; cell.classList.add(p > old ? "fu" : "fd"); }
      };
      KARATS.forEach((k) => upd("k" + k, gTola(k), gTolaO(k)));
      upd("ag", MK.ag, MK.ago);
      S.holdings.filter((h) => h.k === "gold").forEach((h) => { const el = $(`[data-gv="${h.id}"]`); if (el) el.textContent = pkr(value(h)); });
      const T2 = totals(), mvEl = $("#gMove");
      if (mvEl && !+mvEl.value) { countUp($("#gVal"), T2.by.gold.v, MH, 500); if (GDI) GDI.set(goldShare(T2)); }
      const al = $("#alerts");
      if (al && !al.contains(document.activeElement)) al.innerHTML = alertsHTML();
    },
  };
};

/* =====================================================================
   Page: Zakat — the estimate, nisab on a scale, what counts (toggle
   each line), debts due now and payments made this Zakat year
   ===================================================================== */
function zakatPayForm() {
  formModal({
    title: "Record a Zakat payment", submit: "Save payment",
    values: { date: iso(TODAY), amt: "", to: "" },
    fields: [
      { name: "to", label: "Paid to", required: true, placeholder: "For example: a family in need, a school, a hospital", auto: true },
      { name: "amt", label: "Amount (PKR)", type: "number", half: true, required: true, min: 100 },
      { name: "date", label: "Date", type: "date", half: true, required: true, check: (v) => (v > iso(TODAY) ? "The date cannot be in the future" : "") },
    ],
    onSubmit: (v) => { S.zakat.paid.unshift({ id: "z" + uid(), date: v.date, to: v.to, amt: v.amt }); save(); toast("Payment recorded: " + pkr(v.amt)); feedPush("hand", "gold", "Zakat payment recorded", pkr(v.amt) + " · " + v.to); if (CUR.name === "zakat" || CUR.name === "overview") refresh(); },
  });
}
PAGES.zakat = () => {
  const Z = S.zakat, z = zakatCalc(), zd = daysFrom(Z.date);

  const prop = S.holdings.filter((h) => h.k === "prop");
  return {
    title: "Zakat estimate",
    sub: `<span>${ic("scale")}Based on what you own today and the nisab you choose</span><span>${ic("calendar")}Zakat date <b>${fdateY(Z.date)}</b></span><span>${ic("info")}A planning aid, not a ruling</span>`,
    acts: [{ label: "Print", icon: "print", fn: () => window.print() }, { label: "Record payment", icon: "hand", kind: "primary", fn: zakatPayForm }],

        <section class="card vault s5">

          <div class="zk-due m" id="zkDue"></div>
          <small>2.5% of <b class="m" style="color:var(--vault-ink)">${pkr(z.wealth)}</b>: what counts, less debts due now</small>
          <div class="v-stats" style="margin-bottom:12px">
            <div><span>Paid so far</span><b class="m">${pkr(z.paid, { short: true })}</b></div>
            <div><span>Left to pay</span><b class="m">${pkr(z.left, { short: true })}</b></div>
            <div><span>Days to go</span><b>${zd >= 0 ? zd : "Passed"}</b></div>
          </div>
          <div class="bar"><i data-w="${z.due ? (z.paid / z.due) * 100 : 0}"></i></div>
          <div class="row" style="justify-content:space-between;margin-top:8px;font-size:12px"><small>${Z.paid.length} payment${Z.paid.length === 1 ? "" : "s"} this Zakat year</small><button type="button" class="link" id="zkDate" style="color:#f3d27c">${ic("calendar")}Change date</button></div>
        </section>
        <section class="card s7">
          <div class="ch"><div><h3>${ic("scale")}Nisab: the line above which Zakat is due</h3><p>Pick the measure you follow. Prices are today's demo rates.</p></div>${seg("zb", [["silver", "Silver"], ["gold", "Gold"]], Z.basis, "Nisab measure")}</div>
          <div class="scale" aria-hidden="true">
            <div class="rail"></div><div class="fill" data-w="${(z.wealth / max) * 100}"></div>
            <span class="mark" data-left="${(z.nisabSilver / max) * 100}" style="left:0">Silver nisab<i></i></span>
            <span class="mark" data-left="${(z.nisabGold / max) * 100}" style="left:0">Gold nisab<i></i></span>
            <span class="mark you" data-left="${Math.min(96, (z.wealth / max) * 100)}" style="left:0">You<i></i></span>
          </div>
          <div class="grid" style="gap:12px;margin-top:10px">
            <div class="s6 nis${Z.basis === "silver" ? " on" : ""}"><small>Silver: 52.5 tola × <span class="m">${pkr(MK.ag)}</span>${Z.basis === "silver" ? " · your measure" : ""}</small><b class="m">${pkr(z.nisabSilver)}</b></div>
            <div class="s6 nis${Z.basis === "gold" ? " on" : ""}"><small>Gold: 7.5 tola × <span class="m">${pkr(gTola(24))}</span>${Z.basis === "gold" ? " · your measure" : ""}</small><b class="m">${pkr(z.nisabGold)}</b></div>
          </div>
          <p class="note" style="margin-top:12px">${ic("info")}<span>Many people use the silver measure because it is lower, so more people in need are helped. Ask a scholar you trust which one applies to you.</span></p>

      <div class="grid">
        <section class="card s7">

          <div class="set-row" style="padding-top:0"><span><b>Count gold jewellery</b><small>Your bangles set: ${fmt(sum(S.holdings.filter((h) => h.jewel), (h) => h.qty), 1)} tola. Some scholars leave out jewellery that is worn.</small></span><label class="sw"><input type="checkbox" id="zJ" ${Z.jewel ? "checked" : ""} aria-label="Count gold jewellery"><i></i></label></div>

          ${prop.map((h) => `<div class="zrow off" style="text-decoration:none"><span class="kic sm" style="--k:var(--c-prop)">${ic("home")}</span><span><b>${esc(h.name)}</b><small>Not counted: property you rent out is not zakatable. The rent you saved is in your cash.</small></span><span class="zv muted m" style="text-decoration:none">${pkr(value(h))}</span></div>`).join("")}</div>
          <div class="zsum">
            <div class="row"><span class="muted">What counts</span><b class="m">${pkr(z.assets)}</b></div>
            <div class="row"><span class="muted">Less debts due now</span><b class="m down-t">−${pkr(z.debts)}</b></div>
            <div class="row"><span class="muted">Zakatable wealth</span><b class="m">${pkr(z.wealth)}</b></div>

          </div>
        </section>
        <div class="s5 stack">
          <section class="card">
            <div class="ch"><div><h3>${ic("receipt")}Debts due now</h3><p>Taken off before the 2.5%</p></div><button type="button" class="ibtn sm" id="dAdd" aria-label="Add a debt">${ic("plus")}</button></div>
            <ul class="alerts">${Z.debts.map((d) => `<li><span><b>${esc(d.label)}</b><small class="m">${pkr(d.amt)}</small></span><span></span><button type="button" class="ibtn sm bare" data-dd="${d.id}" aria-label="Remove ${esc(d.label)}">${ic("trash")}</button></li>`).join("") || `<li><small class="muted">No debts due now.</small></li>`}</ul>
          </section>

        </div>

    mount(v, anim) {
      cu($("#zkDue", v), z.due, MH, anim, 1200);
      onSeg(v, "zb", (b) => { Z.basis = b; save(); refresh(); });
      onSeg(v, "zs", (b) => { Z.shares = b; save(); refresh(); });
      $("#zJ", v).addEventListener("change", (e) => { Z.jewel = e.target.checked; save(); refresh(); });
      $("#zRows", v).addEventListener("change", (e) => {
        const k = e.target.dataset.zi, ed = e.target.dataset.ze;
        if (k) { Z.include[k] = e.target.checked; save(); refresh(); }
        if (ed) {
          const x = parseFloat(e.target.value);
          if (isNaN(x) || x < 0) { e.target.setAttribute("aria-invalid", "true"); toast("Enter a number of zero or more", "warn"); return; }
          Z[ed] = x; save(); refresh();
        }
      });
      $("#dAdd", v).addEventListener("click", () => formModal({ title: "Add a debt due now", submit: "Add", fields: [{ name: "label", label: "What is it?", required: true, auto: true, placeholder: "For example: rent due this month" }, { name: "amt", label: "Amount (PKR)", type: "number", required: true, min: 1 }], onSubmit: (x) => { Z.debts.push({ id: "d" + uid(), label: x.label, amt: x.amt }); save(); toast("Debt added"); refresh(); } }));
      $("#zPay", v).addEventListener("click", zakatPayForm);
      $("#zkDate", v).addEventListener("click", () => formModal({ title: "Your Zakat date", submit: "Save date", values: { date: Z.date }, intro: "The day each year you work out and pay your Zakat.", fields: [{ name: "date", label: "Zakat date", type: "date", required: true }], onSubmit: (x) => { Z.date = x.date; save(); toast("Zakat date set to " + fdateY(x.date)); refresh(); } }));
      v.addEventListener("click", (e) => {
        const dd = e.target.closest("[data-dd]"), zp = e.target.closest("[data-zp]");
        if (dd) { const at = Z.debts.findIndex((d) => d.id === dd.dataset.dd), d = Z.debts[at]; Z.debts.splice(at, 1); save(); refresh(); toast("Debt removed", "", { label: "Undo", fn: () => { Z.debts.splice(at, 0, d); save(); refresh(); } }); }
        if (zp) { const at = Z.paid.findIndex((p) => p.id === zp.dataset.zp), p = Z.paid[at]; Z.paid.splice(at, 1); save(); refresh(); toast("Payment removed", "", { label: "Undo", fn: () => { Z.paid.splice(at, 0, p); save(); refresh(); } }); }
      });
    },
  };
};

      <div class="grid"><section class="card s8"><div class="ch"><div><h3>${ic("coins")}Income by holding</h3><p>For the period, after tax held back</p></div></div>${hbars(S.holdings.map((h) => ({ name: h.name, v: sum(inTx.filter((t) => t.hid === h.id && INCOME.includes(t.kind)), (t) => t.amount), k: KINDS[h.k].c, dot: true, cls: "m" })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v).map((x) => ({ ...x, label: pkr(x.v) })), null, true)}</section>
      <section class="card s4"><div class="ch"><div><h3>${ic("percent")}In one line</h3></div></div><p style="font-size:13px;line-height:1.6">Your money paid you <b class="m">${pkr(tot)}</b> in this period: about <b class="m">${pkr(tot / Math.max(1, Math.round((TODAY - parse(from)) / (30.44 * 864e5))))}</b> a month. Rent is the biggest part, then certificate profit.</p><div class="divider"></div><p class="note">${ic("info")}<span>Dividends and profit are shown after the 15% that is held back for filers.</span></p></section></div>`;

      <section class="card s5"><div class="ch"><div><h3>${ic("trend")}Gains you have not taken</h3><p>Only taxed if you sell</p></div></div>${hbars(KORDER.filter((k) => k === "stock" || k === "fund" || k === "gold" || k === "prop").map((k) => ({ name: KINDS[k].name, v: T.by[k].v - T.by[k].c, k: KINDS[k].c, dot: true, cls: "m " + upDown(T.by[k].v - T.by[k].c), label: pkr(T.by[k].v - T.by[k].c, { plus: true, short: true }) })))}<div class="divider"></div><p class="note">${ic("info")}<span>Rates are examples for a tax filer. Check the current rates before you file.</span></p></section></div>`;
  } else {
    const debts = sum(S.zakat.debts, (d) => d.amt);
    body = `<section class="card"><div class="ch"><div><h3>${ic("file")}Statement of net worth</h3><p>${esc(S.profile.name)}, ${esc(S.profile.city)} · as at ${fdateY(iso(TODAY))}</p></div><button type="button" class="btn sm" id="rpPrint">${ic("print")}Print</button></div>
      <div class="stmt"><div>${KORDER.map((k) => `<h4 style="margin-top:12px">${KINDS[k].name}</h4>${S.holdings.filter((h) => h.k === k).map((h) => `<div class="li"><span>${esc(h.name)}</span><span class="m">${pkr(value(h))}</span></div>`).join("")}`).join("")}</div>
      <div><h4 style="margin-top:12px">Summary</h4>${KORDER.map((k) => `<div class="li"><span>${KINDS[k].name}</span><span class="m">${pkr(T.by[k].v)}</span></div>`).join("")}<div class="li"><span>Total assets</span><b class="m">${pkr(T.all)}</b></div><h4 style="margin-top:18px">Owed now</h4>${S.zakat.debts.map((d) => `<div class="li"><span>${esc(d.label)}</span><span class="m">−${pkr(d.amt)}</span></div>`).join("")}<div class="li tot"><span>Net worth</span><span class="m">${pkr(T.all - debts)}</span></div><p class="note" style="margin-top:12px">${ic("info")}<span>Gold at today's rate per karat; certificates, property and cash at the values you entered.</span></p></div></div></section>`;

    title: "Reports",
    sub: `<span>${ic("bars")}How your money did, in plain numbers</span><span>${ic("calendar")}From <b>${fdateY(pts[0].d)}</b> to today</span>`,
    acts: [{ label: "Export CSV", icon: "download", fn: () => download("goldmark-report-" + UI.rp.tab + "-" + iso(TODAY) + ".csv", toCSV([["Kind", "Paid PKR", "Value PKR", "Gain PKR"], ...KORDER.map((k) => [KINDS[k].name, Math.round(T.by[k].c), Math.round(T.by[k].v), Math.round(T.by[k].v - T.by[k].c)])])) }, { label: "Print", icon: "print", fn: () => window.print() }],
    heavy: "kpi",

};

  () => ["trend", MK.kse >= MK.kseo ? "up" : "down", `KSE-100 at ${fmt(MK.kse, 0)}`, pct(((MK.kse - MK.kseo) / MK.kseo) * 100, 2, true) + " today"],
  () => ["percent", "", "Certificate profit rates unchanged", "Next review at the end of the month"],
  () => ["wallet", "", `US dollar at PKR ${fmt(MK.usd, 2)}`, "Interbank rate, demo"],
];
let amb = 0;
every(3500, () => {
  const r = marketTick();
  updateTicker(r.old);
  checkAlerts();
  if (CURP && CURP.tick) { try { CURP.tick(r.moved, r.old); } catch (err) { /* a page that is being redrawn can skip one tick */ } }
});
every(7000, () => { if (CUR.name === "overview" && !modals.length) { const a = AMBIENT[amb++ % AMBIENT.length](); feedPush(a[0], a[1], a[2], a[3], false); } });
every(10000, () => $$("time[data-at]").forEach((t) => { t.textContent = ago(+t.dataset.at); }));
</script>
