<!doctype html>
<!-- Chill & Craft · Goldmark · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goldmark · Personal investments in PKR</title>
<meta name="description" content="Goldmark: a personal investments tracker for a Pakistani saver, with stocks, funds, gold by tola, savings certificates, property, goals and a Zakat estimate.">
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* =====================================================================
     Goldmark · theme
     Deep green and gold. Light = parchment paper with a green vault card,
     dark = a night-green vault lit by gold. Every colour is a variable.
     ===================================================================== */
  :root {
    --bg: #f1eee4; --bg-glow: rgba(195,148,50,.10); --top-bg: rgba(241,238,228,.84);
    --card: #fffdf8; --card-2: #f6f2e7; --raise: #ffffff; --hover: rgba(15,52,39,.035);
    --ink: #0f2a20; --ink-2: #2a4237; --muted: #5f7268; --faint: #8b998f;
    --line: rgba(15,42,32,.11); --line-2: rgba(15,42,32,.065);
    --deep: #0f3427; --deep-2: #0a261c;
    --gold: #8d6614; --gold-2: #c39432; --gold-3: #ecca72; --gold-ink: #1c1405; --gold-soft: rgba(195,148,50,.15);
    --green: #0f7a50; --green-soft: rgba(15,122,80,.11); --red: #bf3f2b; --red-soft: rgba(191,63,43,.1); --amber: #b7791f;
    --c-stock: #1d9467; --c-fund: #2b7cad; --c-gold: #c39432; --c-cert: #6b8a2c; --c-prop: #b65f45; --c-cash: #687797;
    --mk-bg: #0f3427; --mk-ink: #f1d88c;
    --vault: radial-gradient(120% 90% at 100% 0%, #1b5a43 0%, rgba(27,90,67,0) 55%), linear-gradient(160deg, #114231 0%, #0b2c21 58%, #082119 100%);
    --vault-ink: #f6ecd0; --vault-muted: rgba(246,236,208,.64); --vault-line: rgba(246,236,208,.13);
    --sk1: rgba(15,42,32,.06); --sk2: rgba(15,42,32,.12);
    --sw-off: rgba(15,42,32,.2);
    --shadow: 0 1px 2px rgba(15,42,32,.05), 0 10px 26px -18px rgba(15,42,32,.28);
    --shadow-up: 0 2px 6px rgba(15,42,32,.06), 0 22px 40px -22px rgba(15,42,32,.42);
    --tip-bg: #0f2a20; --tip-ink: #f6ecd0; --overlay: rgba(8,24,18,.4);
    --ticker-bg: #0c2c21; --ticker-ink: #eadcb2;
    --mold: rgba(15,42,32,.07); --mold-edge: rgba(15,42,32,.22);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #050e0a; --bg-glow: rgba(38,128,90,.16); --top-bg: rgba(5,14,10,.8);
    --card: #0a1712; --card-2: #0e1f18; --raise: #152c22; --hover: rgba(220,240,228,.035);
    --ink: #e7efe9; --ink-2: #c3d2c9; --muted: #8a9f94; --faint: #61776c;
    --line: rgba(205,232,215,.085); --line-2: rgba(205,232,215,.05);
    --deep: #123d2e; --deep-2: #0c2a20;
    --gold: #e6c167; --gold-2: #d5aa47; --gold-3: #f5dc94; --gold-ink: #1a1203; --gold-soft: rgba(230,193,103,.12);
    --green: #42d496; --green-soft: rgba(66,212,150,.12); --red: #ff8070; --red-soft: rgba(255,128,112,.12); --amber: #f0b45a;
    --c-stock: #3ccb8f; --c-fund: #55acdf; --c-gold: #e6c167; --c-cert: #a8c868; --c-prop: #e48d72; --c-cash: #9ba9cd;
    --mk-bg: linear-gradient(180deg, #f2d686, #d4a944); --mk-ink: #1a1203;
    --vault: radial-gradient(120% 90% at 100% 0%, rgba(230,193,103,.13) 0%, rgba(230,193,103,0) 50%), linear-gradient(160deg, #123f2f 0%, #0b2a20 55%, #071c15 100%);
    --sk1: rgba(220,240,228,.04); --sk2: rgba(220,240,228,.09);
    --sw-off: rgba(220,240,228,.18);
    --shadow: 0 1px 0 rgba(255,255,255,.025) inset, 0 12px 32px -18px rgba(0,0,0,.8);
    --shadow-up: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 44px -22px rgba(0,0,0,.9);
    --tip-bg: #f6ecd0; --tip-ink: #0a1712; --overlay: rgba(0,0,0,.56);
    --ticker-bg: #081a13; --ticker-ink: #e2d3a6;
    --mold: rgba(230,193,103,.06); --mold-edge: rgba(230,193,103,.3);
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink);
    font: 13px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  /* a soft glow at the top of the page, behind everything */
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 520px; pointer-events: none; z-index: -1; background: radial-gradient(900px 420px at 18% -12%, var(--bg-glow), transparent 70%), radial-gradient(700px 360px at 92% -20%, var(--gold-soft), transparent 70%); }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip:focus { position: fixed !important; left: 12px; top: 12px; width: auto; height: auto; clip: auto; z-index: 100; padding: 8px 12px; background: var(--card); border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  .tn { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .up-t { color: var(--green); } .down-t { color: var(--red); } .gold-t { color: var(--gold); }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; }
  kbd { font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 3px 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--card-2); color: var(--muted); }
  /* privacy mode: amounts blur until you switch it off */
  html.hush .m { filter: blur(7px); user-select: none; }
  .m { transition: filter .25s; }

  /* ---------- Buttons, inputs, switches, chips, segmented controls ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s, filter .2s; }
  .btn:hover { border-color: var(--gold-2); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { background: linear-gradient(180deg, var(--gold-3), var(--gold-2)); color: var(--gold-ink); border-color: transparent; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 8px 18px -10px rgba(195,148,50,.9); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.deep { background: var(--deep); color: var(--gold-3); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn.danger { background: var(--red); border-color: transparent; color: #fff; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; gap: 5px; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .ibtn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); position: relative; flex: none; transition: border-color .2s, color .2s, transform .12s; text-decoration: none; }
  .ibtn:hover { color: var(--ink); border-color: var(--gold-2); }
  .ibtn:active { transform: scale(.95); }
  .ibtn.bare { border-color: transparent; background: transparent; }
  .ibtn.sm { width: 28px; height: 28px; border-radius: 8px; }
  .ibtn[aria-pressed="true"] { color: var(--gold); border-color: var(--gold-2); background: var(--gold-soft); }
  .ibtn .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--card); }
  .link { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 600; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { text-decoration: underline; }
  input[type=text], input[type=number], input[type=email], input[type=date], input[type=search], select, textarea {
    height: 36px; padding: 0 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); width: 100%; font-size: 13px; transition: border-color .2s, box-shadow .2s;
  }
  textarea { height: auto; padding: 8px 11px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold-2); box-shadow: 0 0 0 3px var(--gold-soft); }
  [aria-invalid="true"] { border-color: var(--red) !important; box-shadow: 0 0 0 3px var(--red-soft) !important; }
  input[type=range] { width: 100%; accent-color: var(--gold-2); }
  .search { position: relative; }
  .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input { padding-left: 32px; }
  .sw { position: relative; width: 36px; height: 20px; flex: none; display: inline-block; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; }
  .sw i { position: absolute; inset: 0; border-radius: 99px; background: var(--sw-off); transition: background .2s; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .22s cubic-bezier(.3,.8,.3,1.2); }
  .sw input:checked + i { background: var(--green); }
  .sw input:checked + i::after { transform: translateX(16px); }
  .sw input:focus-visible + i { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
  .chip:hover { border-color: var(--gold-2); }
  .chip[aria-pressed="true"] { background: var(--deep); color: var(--gold-3); border-color: transparent; }
  .chip .dt { width: 7px; height: 7px; border-radius: 50%; background: var(--k, var(--gold-2)); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); flex: none; }
  .seg button { position: relative; z-index: 1; border: 0; background: none; padding: 4px 11px; height: 26px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 7px; white-space: nowrap; transition: color .2s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  [data-theme="dark"] .seg button[aria-pressed="true"] { color: var(--gold-3); }
  .seg .seg-m { position: absolute; top: 3px; height: 26px; left: 0; width: 0; border-radius: 7px; background: var(--raise); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 1px var(--line-2); transition: transform .32s cubic-bezier(.3,.8,.2,1), width .32s cubic-bezier(.3,.8,.2,1); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 99px; font-size: 11px; font-weight: 650; background: var(--card-2); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.up { background: var(--green-soft); color: var(--green); }
  .pill.down { background: var(--red-soft); color: var(--red); }
  .pill.gold { background: var(--gold-soft); color: var(--gold); }
  .pill.amber { background: rgba(183,121,31,.13); color: var(--amber); }
  .pill .ic { width: 12px; height: 12px; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---------- Top bar: brand, pill nav with a sliding gold marker, tools ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: var(--top-bg); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
  .top-in { max-width: 1440px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 16.5px; letter-spacing: -.02em; text-decoration: none; color: var(--ink); flex: none; }
  .brand svg { width: 30px; height: 30px; display: block; }
  .nav { position: relative; display: flex; gap: 2px; padding: 3px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); margin-left: 8px; box-shadow: var(--shadow); }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 99px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; transition: color .25s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--mk-ink); }
  .nav .mk { position: absolute; top: 3px; height: 32px; left: 0; width: 0; border-radius: 99px; background: var(--mk-bg); box-shadow: 0 6px 16px -8px rgba(195,148,50,.8); transition: transform .4s cubic-bezier(.3,.8,.2,1), width .4s cubic-bezier(.3,.8,.2,1); }
  .nav .nb { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  .nav a[aria-current="page"] .nb { background: rgba(0,0,0,.18); color: inherit; }
  .qs { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 7px 0 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); min-width: 200px; font-size: 12.5px; flex: none; }
  .qs:hover { border-color: var(--gold-2); color: var(--ink-2); }
  .qs kbd:first-of-type { margin-left: auto; }
  .ava { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--deep); color: var(--gold-3); font-weight: 700; font-size: 12px; border: 1.5px solid var(--gold-2); text-decoration: none; flex: none; position: relative; }
  .ava::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--bg); }

  /* Ticker: demo prices that tick every few seconds and slide past */
  .ticker { position: relative; height: 32px; overflow: hidden; background: var(--ticker-bg); color: var(--ticker-ink); font-size: 12px; border-top: 1px solid rgba(230,193,103,.14); border-bottom: 1px solid rgba(230,193,103,.2); }
  .tk-live { position: absolute; left: 0; top: 0; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 7px; padding: 0 14px 0 24px; background: var(--ticker-bg); font-weight: 700; letter-spacing: .09em; font-size: 10.5px; color: #f1d88c; text-transform: uppercase; box-shadow: 14px 0 14px -4px var(--ticker-bg); }
  .tk-live i { width: 7px; height: 7px; border-radius: 50%; background: #4fdc9c; box-shadow: 0 0 0 0 rgba(79,220,156,.6); animation: pulse 2s infinite; }
  .tk-track { display: flex; width: max-content; height: 100%; align-items: center; animation: marquee 90s linear infinite; margin-left: 132px; }
  .ticker:hover .tk-track { animation-play-state: paused; }
  .tk { display: inline-flex; align-items: center; gap: 7px; padding: 0 18px; border-right: 1px solid rgba(234,220,178,.12); white-space: nowrap; }
  .tk .lab { color: rgba(234,220,178,.66); }
  .tk b { color: #fff4d6; font-weight: 650; font-variant-numeric: tabular-nums; border-radius: 4px; padding: 1px 3px; transition: background .6s; }
  .tk .c { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tk .c.up { color: #63e2a8; } .tk .c.down { color: #ff9d8e; }
  .tk b.fu { background: rgba(99,226,168,.25); transition: none; } .tk b.fd { background: rgba(255,157,142,.25); transition: none; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(79,220,156,.55); } 70% { box-shadow: 0 0 0 7px rgba(79,220,156,0); } 100% { box-shadow: 0 0 0 0 rgba(79,220,156,0); } }

  /* ---------- Page header + grid + cards ---------- */
  .page { max-width: 1440px; margin: 0 auto; padding: 22px 24px 48px; }
  .page:focus { outline: none; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .ph h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.028em; font-weight: 700; }
  .ph .sub { margin-top: 7px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
  .ph .sub > span { display: inline-flex; align-items: center; gap: 6px; }
  .ph .sub b { color: var(--ink); font-weight: 650; }
  .ph .sub .ic { color: var(--gold); }
  .ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .ph-in { animation: phIn .36s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes phIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .grid + .grid, .grid + .card, .card + .grid { margin-top: 16px; }
  .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
  .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); min-width: 0; position: relative; transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s, border-color .25s; }
  [data-theme="dark"] .card { background-image: linear-gradient(180deg, rgba(255,255,255,.018), rgba(255,255,255,0) 120px); }
  .card.lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); border-color: rgba(195,148,50,.35); }
  .ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .ch h3 { font-size: 14px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; }
  .ch h3 .ic { color: var(--gold); }
  .ch p { margin-top: 2px; color: var(--muted); font-size: 12px; }
  .ch .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .lbl { font-size: 11.5px; color: var(--muted); font-weight: 550; }
  .big { font-size: 26px; font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .cur { font-size: .5em; color: var(--muted); font-weight: 650; margin-right: 5px; letter-spacing: .02em; vertical-align: .32em; }
  .divider { height: 1px; background: var(--line-2); margin: 12px 0; }
  .empty { padding: 26px 10px; text-align: center; color: var(--muted); }
  .empty .ic { width: 28px; height: 28px; color: var(--gold); display: block; margin: 0 auto 8px; }
  .note { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
  .note .ic { color: var(--gold); margin-top: 1px; }

  /* small KPI tiles (header rows on Transactions, Dividends, Reports) */
  .kpi { display: flex; flex-direction: column; gap: 4px; }
  .kpi .lb { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 550; }
  .kpi .lb .ic { color: var(--gold); }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .nt { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* kind icon (stocks, funds, gold ...) */
  .kic { --k: var(--c-gold); width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--k) 15%, transparent); color: var(--k); }
  .kic.sm { width: 26px; height: 26px; border-radius: 8px; }
  .kic img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .hname { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hname > span { min-width: 0; }
  .hname b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hname small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kdot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; background: var(--k); flex: none; }

  /* ---------- Tables ---------- */
  .tbl { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .t .hname b, .t .hname small { max-width: 230px; }
  .show-sm { display: none; }
  .t th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t th.r, .t td.r { text-align: right; }
  .t th button { border: 0; background: none; padding: 2px 0; color: inherit; font: inherit; display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; }
  .t th button:hover { color: var(--ink); }
  .t th[aria-sort] button { color: var(--ink); }
  .t th .ic { width: 12px; height: 12px; }
  .t td { padding: 9px 9px; border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .t tbody tr:last-child td { border-bottom: 0; }
  .t tbody tr { transition: background .15s; }
  .t tbody tr:hover { background: var(--hover); }
  .t tr.click { cursor: pointer; }
  .t tr.day td { background: var(--card-2); font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 6px 10px; }
  .t tr.flash td { animation: rowFlash 1.4s ease; }
  @keyframes rowFlash { 0% { background: var(--gold-soft); } 100% { background: transparent; } }
  .t td.acts { width: 1%; }
  .t td.acts .row { gap: 4px; justify-content: flex-end; }
  .wbar { width: 52px; height: 6px; border-radius: 9px; background: var(--line-2); overflow: hidden; display: inline-block; vertical-align: middle; }
  .wbar i { display: block; height: 100%; border-radius: 9px; background: var(--k, var(--gold-2)); width: 0; transition: width .9s cubic-bezier(.2,.7,.2,1); }
  td.live b { border-radius: 4px; padding: 1px 3px; margin: -1px -3px; transition: background .8s; }
  td.live b.fu { background: var(--green-soft); transition: none; } td.live b.fd { background: var(--red-soft); transition: none; }
  .more-row { display: flex; justify-content: center; padding-top: 10px; }

  /* ---------- Skeleton shimmer (data-heavy pages, ~400 ms) and entrances ---------- */
  .sk { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--sk1) 0%, var(--sk2) 50%, var(--sk1) 100%); background-size: 200% 100%; animation: shimmer 1s linear infinite; }
  .sk.h { height: 16px; } .sk.big { height: 120px; border-radius: 12px; }
  .skrow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .enter { animation: rise .46s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .view-in { animation: viewIn .3s ease both; }
  @keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeIn { to { opacity: 1; } }
  .shake { animation: shake .36s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  /* ---------- Charts (inline SVG, drawn by the script) ---------- */
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .gl { stroke: var(--line); stroke-dasharray: 2 5; }
  .ax { fill: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .ln { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ln.dash { stroke-dasharray: 4 5; stroke-width: 1.6; }
  .ln.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.2s cubic-bezier(.3,.6,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .area { opacity: 0; animation: fadeIn .9s .25s forwards; }
  .grow-y { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 28ms); }
  @keyframes growY { from { transform: scaleY(0); } }
  .hair { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .hdot { opacity: 0; }
  .chart.hov .hair, .chart.hov .hdot { opacity: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--k); }
  .legend i.ln-k { height: 3px; border-radius: 2px; width: 14px; }
  .legend i.dash-k { height: 0; border-top: 2px dashed var(--k); background: none; width: 14px; border-radius: 0; }
  .tip { position: fixed; z-index: 95; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; line-height: 1.45; padding: 8px 10px; border-radius: 9px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 260px; left: 0; top: 0; }
  .tip.on { opacity: 1; transform: none; }
  .tip b { font-weight: 700; }
  .tip .tr { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
  .tip .tr i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; background: var(--k); }
  .hb { display: grid; grid-template-columns: minmax(0, 150px) 1fr auto; gap: 6px 12px; align-items: center; font-size: 12.5px; }
  .hb .tr { height: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
  .hb .tr i { display: block; height: 100%; border-radius: 99px; background: var(--k, var(--gold-2)); width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 12px -2px var(--k); }
  .hb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .hb .vl { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  /* stacked version for long names: name and amount on one line, the bar under them */
  .hbs { display: grid; gap: 9px; font-size: 12.5px; }
  .hbs .row { justify-content: space-between; margin-bottom: 4px; }
  .hbs .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .hbs .vl { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hbs .tr { display: block; height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
  .hbs .tr i { display: block; height: 100%; border-radius: 99px; background: var(--k, var(--gold-2)); width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
  .ring-arc { transition: stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1); }

  /* ---------- Signature 1: the gold bar that fills with your gold share ---------- */
  .ingot { position: relative; }
  .ingot svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ingot .ig-tick { stroke: var(--mold-edge); stroke-width: 1; }
  .ingot .ig-tl { font-size: 8.5px; font-weight: 600; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .ingot .ig-target { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 4 3; opacity: .7; }
  .ingot .ig-stamp { font-size: 7.5px; letter-spacing: .32em; font-weight: 700; fill: rgba(70,46,6,.55); }
  .vault .ingot .ig-tl { fill: var(--vault-muted); }
  .vault .ingot .ig-target { stroke: var(--vault-ink); }
  .vault .ingot { --mold: rgba(246,236,208,.07); --mold-edge: rgba(246,236,208,.28); }

  /* ---------- Signature 2: the allocation donut you rebalance with a drag ---------- */
  .mix { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 18px; align-items: center; }
  .donut { position: relative; width: 212px; height: 212px; margin: 0 auto; }
  .donut svg { width: 100%; height: 100%; display: block; touch-action: none; overflow: visible; }
  .donut .seg-a { transition: opacity .2s; }
  .donut .dim .seg-a:not(.on) { opacity: .35; }
  .donut .ghost { opacity: .45; }
  .donut .knob { cursor: grab; outline: none; }
  .donut .knob:active { cursor: grabbing; }
  .donut .knob circle.k1 { fill: var(--gold-3); stroke: var(--card); stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); transition: r .15s; }
  .donut .knob circle.k2 { fill: none; stroke: var(--gold-2); stroke-width: 1.5; opacity: 0; transition: opacity .2s; }
  .donut .knob:focus-visible circle.k2, .donut .knob.drag circle.k2 { opacity: 1; }
  .donut .knob.drag circle.k1 { r: 10.5; }
  .donut .knob.hint circle.k2 { animation: knobHint 1.6s ease-out 2; }
  @keyframes knobHint { 0% { opacity: .9; r: 9; } 100% { opacity: 0; r: 20; } }
  .donut .ctr { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .donut .ctr b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .donut .ctr small { display: block; font-size: 11px; color: var(--muted); max-width: 110px; line-height: 1.3; }
  .mixl { display: grid; gap: 2px; font-size: 12.5px; }
  .mixl .mr { display: grid; grid-template-columns: 12px minmax(0, 1fr) 92px 70px; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; transition: background .15s; }
  .mixl .mr.hd { color: var(--muted); font-size: 11px; font-weight: 600; padding-top: 0; }
  .mixl .mr:not(.hd):hover, .mixl .mr.on { background: var(--hover); }
  .mixl .mr > :nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
  .mixl .mr .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mixl .tg { font-weight: 700; }
  .mixl .tr-buy { color: var(--green); font-weight: 600; } .mixl .tr-sell { color: var(--red); font-weight: 600; } .mixl .tr-fix { color: var(--muted); }
  .mix-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .mix-foot.note { flex-wrap: nowrap; align-items: flex-start; }

  /* ---------- Overview ---------- */
  .vault { background: var(--vault); color: var(--vault-ink); border-color: rgba(230,193,103,.28); overflow: hidden; display: flex; flex-direction: column; }
  [data-theme="dark"] .vault { background-image: var(--vault); }
  .vault::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; background: repeating-radial-gradient(circle at 115% -20%, rgba(246,236,208,.045) 0 1px, transparent 1px 9px); }
  .vault > * { position: relative; }
  .vault .lbl, .vault small { color: var(--vault-muted); }
  .vault .cur { color: var(--vault-muted); }
  .vault .ibtn { background: rgba(246,236,208,.06); border-color: var(--vault-line); color: var(--vault-ink); }
  .vault .pill { background: rgba(246,236,208,.1); color: var(--vault-ink); }
  .vault .pill.up { background: rgba(80,220,160,.16); color: #7ff0bd; }
  .vault .pill.down { background: rgba(255,128,112,.16); color: #ffb0a4; }
  .v-amt { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 8px 0 8px; font-variant-numeric: tabular-nums; color: #fff6dc; }
  .v-chg { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--vault-muted); flex-wrap: wrap; }
  .v-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 14px; padding: 12px 0; border-top: 1px solid var(--vault-line); border-bottom: 1px solid var(--vault-line); }
  .v-stats span { display: block; font-size: 11px; color: var(--vault-muted); }
  .v-stats b { display: block; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
  .v-stats b.up-t { color: #7ff0bd; }
  .v-gold { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 10px; align-items: center; margin-top: auto; }
  .v-gold .gt b { display: block; font-size: 26px; font-weight: 750; letter-spacing: -.02em; color: #f3d27c; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .v-gold .gt span { display: block; font-size: 12px; color: var(--vault-ink); margin-top: 2px; }
  .v-gold .gt small { display: block; font-size: 11px; margin-top: 4px; }
  .nw-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .movers li, .feed li, .pay li, .goal-mini li { list-style: none; }
  .movers, .feed, .pay, .goal-mini { margin: 0; padding: 0; }
  .movers li { display: grid; grid-template-columns: minmax(0, 1fr) 70px 86px 58px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
  .movers li:last-child { border-bottom: 0; }
  .movers .r { text-align: right; font-variant-numeric: tabular-nums; }
  .movers a { text-decoration: none; color: inherit; }
  .feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .feed li:last-child { border-bottom: 0; }
  .feed li.new { animation: feedIn .6s cubic-bezier(.2,.7,.2,1); }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-10px); background: var(--gold-soft); } to { opacity: 1; transform: none; } }
  .feed .fi { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); }
  .feed .fi.up { background: var(--green-soft); color: var(--green); } .feed .fi.down { background: var(--red-soft); color: var(--red); } .feed .fi.gold { background: var(--gold-soft); color: var(--gold); }
  .feed b { font-weight: 600; display: block; font-size: 12.5px; line-height: 1.35; }
  .feed small { color: var(--muted); font-size: 11.5px; display: block; }
  .feed time { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .pay li { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
  .pay li:last-child { border-bottom: 0; }
  .dchip { width: 42px; height: 42px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); display: grid; place-items: center; text-align: center; line-height: 1.05; }
  .dchip b { font-size: 15px; font-weight: 700; display: block; }
  .dchip small { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
  .pay .amt { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .pay .amt small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
  .goal-mini li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .goal-mini li:last-child { border-bottom: 0; }
  .ring { position: relative; display: grid; place-items: center; flex: none; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring span { position: absolute; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--gold-2), var(--gold-3)); transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
  .bar.green i { background: linear-gradient(90deg, var(--green), color-mix(in srgb, var(--green) 60%, #fff)); }
  .zk-mini { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
  .count { display: inline-grid; grid-auto-flow: column; gap: 6px; }
  .count span { min-width: 46px; padding: 6px 4px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); text-align: center; }
  .count b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .count small { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }

  /* ---------- Portfolio ---------- */
  .kinds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kcard { --k: var(--c-gold); text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 13px 11px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s; color: var(--ink); min-width: 0; }
  .kcard::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--k); opacity: .75; transform: scaleX(var(--w, 0)); transform-origin: left; transition: transform 1s cubic-bezier(.2,.7,.2,1); }
  .kcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
  .kcard[aria-pressed="true"] { border-color: var(--k); box-shadow: 0 0 0 1px var(--k), var(--shadow-up); }
  .kcard .top-r { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .kcard .nm { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .kcard .vv { font-size: 18px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: block; white-space: nowrap; }
  .kcard .ft { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar .search { width: 240px; }
  .toolbar select { width: auto; }
  .plan-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); align-items: center; font-size: 12.5px; }
  .plan-row:last-child { border-bottom: 0; }
  .plan-bars { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 99px; background: var(--line-2); }
  .plan-bars i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--k); width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
  .plan-bars em { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--ink); left: 0; transition: left 1s cubic-bezier(.2,.7,.2,1); }
  .drawer-hero { border-radius: 12px; overflow: hidden; margin: -2px 0 14px; aspect-ratio: 16 / 7; background: var(--card-2); }
  .drawer-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .dl div { background: var(--card-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; }
  .dl span { display: block; font-size: 11px; color: var(--muted); }
  .dl b { display: block; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }

  /* ---------- Transactions ---------- */
  .tpill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; font-weight: 650; background: var(--card-2); color: var(--ink-2); }
  .tpill.buy { background: rgba(43,124,173,.12); color: var(--c-fund); }
  .tpill.sell { background: rgba(182,95,69,.12); color: var(--c-prop); }
  .tpill.inc { background: var(--green-soft); color: var(--green); }
  .tpill.cash { background: var(--gold-soft); color: var(--gold); }
  .tpill.out { background: var(--red-soft); color: var(--red); }
  .tpill .ic { width: 12px; height: 12px; }
  .plans li { list-style: none; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  .plans li:last-child { border-bottom: 0; }
  .plans { margin: 0; padding: 0; }
  .plans b { display: block; font-size: 12.5px; font-weight: 600; }
  .plans small { color: var(--muted); font-size: 11.5px; }

  /* ---------- Goals ---------- */
  .goals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .goal { padding: 0; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
  .goal[aria-current="true"] { border-color: var(--gold-2); box-shadow: 0 0 0 1px var(--gold-2), var(--shadow-up); }
  .goal .gh { position: relative; height: 92px; background: var(--deep); overflow: hidden; }
  .goal .gh img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .goal:hover .gh img { transform: scale(1.05); }
  .goal .gh .pat { position: absolute; inset: 0; background: radial-gradient(circle at 85% 30%, rgba(236,202,114,.35), transparent 45%), repeating-linear-gradient(135deg, rgba(246,236,208,.06) 0 2px, transparent 2px 12px), linear-gradient(135deg, var(--g1, #1a5a43), var(--g2, #0b2a20)); }
  .goal .gh .gic { position: absolute; left: 14px; bottom: 12px; width: 38px; height: 38px; border-radius: 11px; background: rgba(246,236,208,.14); color: #f6ecd0; display: grid; place-items: center; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid rgba(246,236,208,.2); }
  .goal .gh .gic .ic { width: 20px; height: 20px; }
  .goal .gh .st { position: absolute; right: 10px; top: 10px; }
  .goal .gh .pill { background: rgba(6,20,14,.74); color: #f6ecd0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(246,236,208,.14); }
  .goal .gh .pill.up .ic { color: #6ff0b5; } .goal .gh .pill.amber .ic { color: #ffc46b; } .goal .gh .pill.gold .ic { color: #f3d27c; }
  /* goal timeline: a bar from today to the month you get there, a flag at the month you need it */

  .nis { display: block; padding: 11px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }

  /* ---------- Gold ---------- */

  .calc-out { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--gold-soft); border: 1px solid rgba(195,148,50,.3); }
  .calc-out b { display: block; font-size: 22px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .calc-out small { color: var(--muted); font-size: 11.5px; }
  .alerts li { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }

  /* ---------- Zakat ---------- */
  .zk-due { font-size: 36px; font-weight: 750; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; color: #fff6dc; margin: 6px 0; }
  .scale { position: relative; height: 54px; margin: 18px 4px 6px; }

  .scale .fill { position: absolute; left: 0; top: 22px; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--green), var(--gold-2)); width: 0; transition: width 1.2s cubic-bezier(.2,.7,.2,1); }
  .scale .mark { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--muted); white-space: nowrap; transition: left 1s cubic-bezier(.2,.7,.2,1); }
  .scale .mark i { width: 2px; height: 38px; background: var(--ink-2); border-radius: 2px; margin-top: 2px; opacity: .7; }
  .scale .mark.you { color: var(--ink); font-weight: 650; }
  .scale .mark.you i { background: var(--gold-2); width: 3px; opacity: 1; }
  .zrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  .zrow:last-child { border-bottom: 0; }
  .zrow b { display: block; font-size: 12.5px; font-weight: 600; }
  .zrow small { display: block; font-size: 11.5px; color: var(--muted); }
  .zrow .zv { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .zrow .zv input { text-align: right; height: 32px; }
  .zrow.off { opacity: .5; }
  .zrow.off .zv { text-decoration: line-through; }
  .zsum { display: grid; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
  .zsum .row { justify-content: space-between; }
  .zsum .row.tot { font-size: 15px; font-weight: 700; }

  /* ---------- Reports ---------- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 9px 12px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold-2); }
  .stmt { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .stmt h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .stmt .li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dotted var(--line); font-variant-numeric: tabular-nums; }
  .stmt .li.tot { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; }

  /* ---------- Settings ---------- */
  .set-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 112px; }
  .set-nav a { padding: 8px 11px; border-radius: 9px; text-decoration: none; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .set-nav a:hover { background: var(--hover); color: var(--ink); }
  .set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line-2); }
  .set-row:last-child { border-bottom: 0; }
  .set-row b { display: block; font-size: 13px; font-weight: 600; }
  .set-row small { display: block; font-size: 12px; color: var(--muted); }
  .set-row select { width: 180px; }
  .set-row input[type=date] { width: 180px; }

  /* ---------- Modal, drawer, popover, toasts, command search ---------- */
  .ov { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .ov-back { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .25s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .dlg { position: relative; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .25s, transform .3s cubic-bezier(.2,.7,.2,1); }
  .dlg.wide { width: min(760px, 100%); }

  .db .df { padding: 14px 0 0; }
  .ov.drawer { place-items: stretch end; padding: 0; }
  .ov.drawer .dlg { width: min(460px, 100%); height: 100%; max-height: none; border-radius: 18px 0 0 18px; transform: translateX(40px); }
  .ov.drawer.open .dlg { transform: none; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { grid-column: span 2; min-width: 0; }
  .field.half { grid-column: span 1; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
  .field .hint { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .err { color: var(--red); font-size: 11.5px; display: block; }
  .field .err:not(:empty) { margin-top: 4px; }
  p.err:not(:empty) { margin-top: 10px; }
  .confirm-t { color: var(--ink-2); font-size: 13px; }
  .calc-line { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--card-2); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .pop { position: fixed; z-index: 85; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px -18px rgba(0,0,0,.45); padding: 6px; opacity: 0; transform: translateY(-6px); transition: opacity .18s, transform .22s; max-height: 70vh; overflow: auto; }
  .pop.open { opacity: 1; transform: none; }
  .pop-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .pop-i { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: inherit; font-size: 12.5px; }
  .pop-i:hover { background: var(--hover); }
  .pop-i .ic { color: var(--gold); margin-top: 2px; }
  .pop-i small { display: block; color: var(--muted); font-size: 11.5px; }
  .pop-i.read { opacity: .65; }
  .toasts { position: fixed; z-index: 99; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: calc(100vw - 24px); }
  .toast { display: flex; align-items: center; gap: 9px; padding: 10px 12px 10px 14px; border-radius: 12px; background: var(--tip-bg); color: var(--tip-ink); font-size: 12.5px; font-weight: 550; box-shadow: 0 16px 40px -12px rgba(0,0,0,.5); animation: toastIn .3s cubic-bezier(.2,.7,.2,1); max-width: 100%; }
  .toast .ic { color: var(--gold-2); }
  .toast.warn .ic { color: var(--amber); }
  .toast button { border: 0; background: rgba(230,193,103,.2); color: inherit; font-weight: 700; padding: 4px 10px; border-radius: 7px; font-size: 12px; }
  .toast.out { opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.96); } }
  .cmdk .dlg { width: min(600px, 100%); align-self: start; margin-top: 10vh; }
  .cmdk .dh { display: none; }
  .cmdk .db { padding: 0; }
  .cmdk-q { height: 52px !important; border: 0 !important; border-bottom: 1px solid var(--line) !important; border-radius: 0 !important; background: transparent !important; font-size: 15px !important; padding: 0 18px !important; box-shadow: none !important; }
  .cmdk-l { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
  .cmdk-l li { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; cursor: pointer; font-size: 13px; }
  .cmdk-l li .ic { color: var(--gold); }
  .cmdk-l li small { margin-left: auto; color: var(--muted); font-size: 11.5px; }

  .cmdk-f { display: flex; gap: 14px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

  /* ---------- Bottom bar and More sheet (tablets and phones) ---------- */
  .bbar { display: none; position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 45; height: 62px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 16px 40px -14px rgba(0,0,0,.45); padding: 6px; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .bbar a, .bbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 650; border: 0; background: none; min-width: 0; }
  .bbar .ic { width: 20px; height: 20px; }
  .bbar a[aria-current="page"] { background: var(--deep); color: var(--gold-3); }
  .sheet-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1360px) {

  }
  @media (max-width: 1180px) {

  }
  @media (max-width: 1080px) {

  @media (max-width: 720px) {

    .tk-live { padding-left: 14px; }
    .page { padding: 16px 14px 100px; }
    .ph h1 { font-size: 24px; }

    .ph .acts .btn { flex: 1; }
    .grid { gap: 12px; }
    .grid + .grid, .grid + .card, .card + .grid { margin-top: 12px; }
    .s2, .s3, .s4, .s6 { grid-column: span 12; }
    .kinds { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .goals, .g-items, .g-hero, .stmt { grid-template-columns: 1fr; }
    .mix { grid-template-columns: 1fr; }
    .hide-sm { display: none !important; }
    .show-sm { display: block !important; }
    .t td, .t th { padding: 8px 6px; }
    .t .hname b, .t .hname small { max-width: 112px; }
    .t .hname { gap: 8px; }
    .toolbar .search { width: 100%; }
    .v-amt { font-size: 30px; }
    .zrow { grid-template-columns: 36px minmax(0, 1fr) 112px; }
    .set-row { grid-template-columns: 1fr; }
    .set-row select, .set-row input[type=date] { width: 100%; }
    .movers li { grid-template-columns: minmax(0, 1fr) 80px 54px; }
    .movers li .sp { display: none; }
    #pfChips { display: none; }
    .t .hname .kic { display: none; }
    .tl .tr-row, .tl .axis { grid-template-columns: 92px minmax(0, 1fr) 54px; gap: 8px; }
    .set-nav { display: none; }
    .hb { grid-template-columns: minmax(0, 96px) 1fr auto; }
    .dl { grid-template-columns: 1fr 1fr; }
    .ov.drawer .dlg { border-radius: 18px 18px 0 0; height: auto; max-height: 92vh; align-self: end; transform: translateY(40px); }
    .ov.drawer { place-items: end stretch; }
  }
  @media (max-width: 420px) {
    .hide-xs { display: none !important; }
    .count span { min-width: 40px; }
  }

  /* ---------- Print: just the page content ---------- */
  @media print {
    .top, .bbar, .ph .acts, .toasts, .ticker { display: none !important; }
    body { background: #fff; color: #000; }
    .card { box-shadow: none; break-inside: avoid; }
  }

  /* ---------- Reduced motion: everything still works, nothing big moves ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    .tk-track { animation: none !important; }
  }
  html.calm *, html.calm *::before, html.calm *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  html.calm .tk-track { animation: none !important; }
</style>

/* ---------- Toasts, with an optional action such as Undo ---------- */
function toast(msg, kind = "", action = null) {
  let box = $("#toasts");
  if (!box) {
    box = document.createElement("div");
    box.id = "toasts"; box.className = "toasts";
    box.setAttribute("role", "status"); box.setAttribute("aria-live", "polite");
    document.body.appendChild(box);
  }
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.innerHTML = ic(kind === "warn" ? "alert" : "check") + "<span>" + esc(msg) + "</span>" + (action ? `<button type="button">${esc(action.label)}</button>` : "");
  if (action) $("button", t).addEventListener("click", () => { action.fn(); t.remove(); });
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, action ? 5200 : 2800);
}

/* ---------- Modal + drawer: focus trap, Esc and backdrop close ---------- */
const modals = [];

function openModal({ title, html = "", drawer = false, wide = false, actions = null, onOpen = null, onClose = null, cls = "" }) {
  const prev = document.activeElement;
  const id = "dlg-" + uid();
  const wrap = document.createElement("div");
  wrap.className = "ov" + (drawer ? " drawer" : "") + (cls ? " " + cls : "");
  wrap.innerHTML = `<div class="ov-back" data-close></div>
    <div class="dlg${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="${id}">
      <header class="dh"><h2 id="${id}">${esc(title)}</h2><button type="button" class="ibtn bare" data-close aria-label="Close">${ic("x")}</button></header>
      <div class="db">${html}</div>
      ${actions ? '<footer class="df"></footer>' : ""}
    </div>`;
  const dlg = $(".dlg", wrap);
  const api = { el: dlg, body: $(".db", wrap), wrap, close };
  if (actions) {
    const f = $(".df", wrap);
    actions.forEach((a) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.kind || "ghost");
      b.textContent = a.label;
      b.addEventListener("click", () => { const keep = a.fn ? a.fn(api) === false : false; if (!keep && a.close !== false) close(); });
      f.appendChild(b);
    });
  }
  let closed = false;
  function close() {
    if (closed) return;
    closed = true;
    wrap.classList.remove("open");
    setTimeout(() => wrap.remove(), calm() ? 0 : 260);
    const at = modals.indexOf(api);
    if (at >= 0) modals.splice(at, 1);
    if (onClose) onClose();
    if (prev && prev.focus && document.contains(prev)) prev.focus();
  }
  wrap.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
  wrap.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = $$(FOCUSABLE, dlg).filter((x) => x.offsetParent !== null || x === document.activeElement);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  document.body.appendChild(wrap);
  modals.push(api);
  requestAnimationFrame(() => wrap.classList.add("open"));
  if (onOpen) onOpen(api);
  const first = $("[autofocus]", dlg) || $$(FOCUSABLE, $(".db", wrap))[0] || $(".dh button", wrap);
  if (first) setTimeout(() => { if (document.contains(first)) first.focus(); }, 30);
  return api;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modals.length) { e.preventDefault(); modals[modals.length - 1].close(); } });

/* Confirm dialog: calls yes() when the person confirms */

/* ---------- Form in a modal or drawer, with validation and inline errors ---------- */
function formModal({ title, fields, values = {}, submit = "Save", drawer = false, onSubmit, intro = "", extra = "", onInput = null }) {

    if (f.type === "select") input = `<select id="${id}" name="${f.name}"${req} ${desc}>${f.options.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${String(ov) === String(v) ? " selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
    else if (f.type === "textarea") input = `<textarea id="${id}" name="${f.name}" rows="3"${req} ${desc} placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`;
    else input = `<input id="${id}" name="${f.name}" type="${f.type || "text"}" value="${esc(v)}"${req} ${desc}${f.min != null ? ` min="${f.min}"` : ""}${f.max != null ? ` max="${f.max}"` : ""}${f.type === "number" ? ` step="${f.step || "any"}" inputmode="decimal"` : ""} placeholder="${esc(f.placeholder || "")}"${f.auto ? " autofocus" : ""} autocomplete="off">`;
    return `<div class="field${f.half ? " half" : ""}" data-f="${f.name}"><label for="${id}">${esc(f.label)}${f.required ? ' <span aria-hidden="true" style="color:var(--gold)">*</span>' : ""}</label>${input}${f.hint ? `<small class="hint">${esc(f.hint)}</small>` : ""}<small class="err" id="${id}-e"></small></div>`;
  };

    title, drawer,
    html: `<form novalidate>${intro ? `<p class="confirm-t" style="margin-bottom:12px">${intro}</p>` : ""}<div class="fields">${fields.map(fieldHTML).join("")}</div>${extra}<p class="err" role="alert"></p><div class="df"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form>`,
  });

/* ---------- Popover (bell): closes on outside click or Esc ---------- */
let openPop = null;
function popover(anchor, html, onOpen, width = 330) {
  if (openPop) { const same = openPop.anchor === anchor; openPop.close(); if (same) return; }
  const p = document.createElement("div");
  p.className = "pop";
  p.innerHTML = html;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  const w = Math.min(width, innerWidth - 16);
  p.style.width = w + "px";
  p.style.left = clamp(r.left + r.width / 2 > innerWidth / 2 ? r.right - w : r.left, 8, Math.max(8, innerWidth - w - 8)) + "px";
  p.style.top = Math.min(r.bottom + 8, innerHeight - 120) + "px";
  anchor.setAttribute("aria-expanded", "true");
  const close = () => { p.remove(); anchor.setAttribute("aria-expanded", "false"); document.removeEventListener("pointerdown", out, true); document.removeEventListener("keydown", key); openPop = null; };
  const out = (e) => { if (!p.contains(e.target) && !anchor.contains(e.target)) close(); };
  const key = (e) => { if (e.key === "Escape") { close(); anchor.focus(); } };
  setTimeout(() => { document.addEventListener("pointerdown", out, true); document.addEventListener("keydown", key); });
  openPop = { anchor, close, el: p };
  if (onOpen) onOpen(p, close);
  requestAnimationFrame(() => p.classList.add("open"));
  return openPop;
}

    this.el.style.left = clamp(e.clientX + 14, 6, Math.max(6, innerWidth - w - 6)) + "px";

};

}

/* =====================================================================

}

/* =====================================================================

}

    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;

}

      <text class="ig-stamp" x="130" y="124" text-anchor="middle">${esc(stamp)}</text>

    <line x1="34" y1="48.5" x2="226" y2="48.5" stroke="rgba(255,255,255,.28)" stroke-width="1"/>

/* =====================================================================

const MIX = { mode: "now", draft: null, hover: null };

<script>

const hIcon = (h, sm = false) => (h.photo ? `<span class="kic${sm ? " sm" : ""}" style="--k:${KINDS[h.k].c}"><img src="img/${h.photo}.webp" alt="" width="32" height="32" loading="lazy"></span>` : kic(h.k, sm));

const hName = (h) => `<span class="hname">${hIcon(h)}<span><b>${esc(h.name)}</b><small>${esc(hSub(h))}</small></span></span>`;
const qtyTxt = (h) => (h.k === "gold" ? fmt(h.qty, h.qty % 1 ? 2 : 0) + " tola" : h.k === "stock" ? fmt(h.qty) + " shares" : h.k === "fund" ? fmt(h.qty) + " units" : "—");
const priceTxt = (h) => (h.k === "gold" ? fmt(price(h)) : h.k === "stock" || h.k === "fund" ? fmt(price(h), 2) : "—");
const costTxt = (h) => (h.k === "stock" || h.k === "fund" ? fmt(h.cost, 2) : h.k === "gold" ? fmt(h.cost) : "—");

function goalInfo(g, monthly = g.monthly, ret = g.ret) {
  const r = ret / 100 / 12;
  let bal = g.saved, n = 0;
  while (bal < g.target && n < 600) { bal = bal * (1 + r) + monthly; n++; }
  const left = Math.max(0, Math.round((parse(g.by) - TODAY) / (30.44 * 864e5)));
  const f = Math.pow(1 + r, left);
  const need = left > 0 ? Math.max(0, (g.target - g.saved * f) / (r ? (f - 1) / r : left)) : Math.max(0, g.target - g.saved);
  const reach = iso(new Date(TODAY.getFullYear(), TODAY.getMonth() + n, 1));
  return { n, left, need, reach, done: g.saved >= g.target, behind: g.saved >= g.target ? 0 : Math.max(0, n - left), p: clamp(g.saved / g.target, 0, 1) };
}
const goalPill = (g, gi = goalInfo(g)) => (gi.done ? `<span class="pill gold">${ic("star")}Done</span>` : gi.behind ? `<span class="pill amber">${ic("clock")}${gi.behind} month${gi.behind > 1 ? "s" : ""} behind</span>` : `<span class="pill up">${ic("check")}On track</span>`);

function zakatCalc() {
  const Z = S.zakat, inc = Z.include;
  const of = (k, f = () => 1) => sum(S.holdings.filter((h) => h.k === k), (h) => value(h) * f(h));
  const part = Z.shares === "full" ? 1 : 0.3;
  const gold = of("gold", (h) => (h.jewel && !Z.jewel ? 0 : 1));
  const rows = [
    { key: "cash", icon: "wallet", name: "Cash and deposits", note: "Savings account, term deposit and cash at home", v: of("cash") },
    { key: "gold", icon: "ingot", name: "Gold", note: `${fmt(goldTolaHeld(), 2)} tola at today's price${Z.jewel ? ", jewellery included" : ", jewellery left out"}`, v: gold },
    { key: "silver", icon: "coin", name: "Silver", note: `Tola of silver you own, at ${pkr(MK.ag)} a tola`, v: Z.silverTola * MK.ag, edit: "silverTola", ev: Z.silverTola },
    { key: "stock", icon: "candles", name: "Shares", note: Z.shares === "full" ? "Full market value of your shares" : "30% of market value, an estimate of the companies' own zakatable assets", v: of("stock") * part },
    { key: "fund", icon: "layers", name: "Mutual funds", note: Z.shares === "full" ? "Full value of your units" : "Income funds in full, equity funds at 30%", v: of("fund", (h) => (Z.shares === "full" || !/Equity/.test(h.name) ? 1 : 0.3)) },
    { key: "cert", icon: "cert", name: "Savings certificates", note: "What you paid in plus profit added so far", v: of("cert") },
    { key: "owed", icon: "hand", name: "Money owed to you", note: "Lent to a cousin, expected back this year", v: Z.owed, edit: "owed", ev: Z.owed },
  ];
  const assets = sum(rows.filter((r) => inc[r.key]), (r) => r.v);
  const debts = sum(Z.debts, (d) => d.amt);
  const wealth = Math.max(0, assets - debts);
  const nisabSilver = 52.5 * MK.ag, nisabGold = 7.5 * gTola(24);
  const nisab = Z.basis === "gold" ? nisabGold : nisabSilver;
  const due = wealth >= nisab ? wealth * 0.025 : 0;
  const paid = sum(Z.paid, (p) => p.amt);
  return { rows, assets, debts, wealth, nisab, nisabSilver, nisabGold, due, paid, left: Math.max(0, due - paid), above: wealth >= nisab };
}

/* income expected over the next 12 months, after tax held back */
function forecast12() {
  let t = 0;
  S.holdings.forEach((h) => {
    if (h.k === "stock" || h.k === "fund") t += (h.dps || 0) * h.qty * 0.85;
    if (h.rent) t += h.rent * 12;
  });
  t += 10083 * 12 + 5100 * 12;
  const td = S.payouts.find((p) => p.hid === "h18");
  if (td && daysFrom(td.date) <= 365) t += td.amt;
  return t;
}
function monthStartNW() {
  const first = iso(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const p = HIST.dly.find((x) => x.d === first) || HIST.dly[HIST.dly.length - 2];
  return p.nw;
}

      const opts = optsFor(v.kind);
      if (sel.dataset.kind !== v.kind) {

        sel.dataset.kind = v.kind;
      }
      const h = hById(sel.value);
      if (trade && h && sel.dataset.last !== sel.value) { form.elements.price.value = r2(price(h)); sel.dataset.last = sel.value; }
      const q = +form.elements.qty.value || 0, p = +form.elements.price.value || 0, fee = +form.elements.fee.value || 0, a = +form.elements.amount.value || 0;
      const total = trade ? q * p + (v.kind === "buy" ? fee : -fee) : a;
      const after = v.kind === "buy" ? savingsBal() - total : v.kind === "withdraw" ? savingsBal() - (sel.value === SAVINGS ? a : 0) : savingsBal() + (v.kind === "deposit" && sel.value !== SAVINGS ? 0 : total);
      $("#txCalc", mm.el).innerHTML = `<span>${trade ? (v.kind === "buy" ? "You pay" : "You receive") : "Amount"}</span><b class="m">${pkr(total)}</b>`;
      $("#txCalc", mm.el).title = "Savings account after: " + pkr(after);
    },
    onSubmit: (v) => {
      const h = hById(v.hid);
      if (!h) return "Pick a holding";
      const snap = JSON.stringify(S.holdings);
      const fee = +v.fee || 0;
      const tx = { id: "t" + uid(), date: v.date, kind: v.kind, hid: h.id, qty: 0, price: 0, amount: 0, fee, note: v.note };
      if (v.kind === "buy") {
        const total = v.qty * v.price + fee;
        if (total > savingsBal()) return `Your savings account has ${pkr(savingsBal())}. Add a deposit first or buy less.`;
        h.cost = (h.cost * h.qty + v.qty * v.price + fee) / (h.qty + v.qty);
        h.qty = r2(h.qty + v.qty);
        moveSavings(-total);
        Object.assign(tx, { qty: v.qty, price: v.price, amount: Math.round(v.qty * v.price) });
      } else if (v.kind === "sell") {
        const got = v.qty * v.price - fee;
        tx.gain = Math.round((v.price - h.cost) * v.qty - fee);
        h.qty = r2(h.qty - v.qty);
        moveSavings(got);
        Object.assign(tx, { qty: v.qty, price: v.price, amount: Math.round(v.qty * v.price) });
        if (h.qty <= 0) S.holdings = S.holdings.filter((x) => x.id !== h.id);
      } else if (v.kind === "deposit") {
        h.price += v.amount; h.cost = h.k === "cash" ? h.price : h.cost; tx.amount = v.amount;
      } else if (v.kind === "withdraw") {
        h.price = Math.max(0, h.price - v.amount); if (h.k === "cash") h.cost = h.price; tx.amount = v.amount;

        moveSavings(v.amount - fee); tx.amount = v.amount;

  });

}

/* ---------- Monthly statement (Overview) ---------- */
function statement() {
  const T = totals(), start = monthStartNW(), first = iso(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const mt = S.tx.filter((t) => t.date >= first);
  const dep = sum(mt.filter((t) => t.kind === "deposit"), (t) => t.amount), wd = sum(mt.filter((t) => t.kind === "withdraw"), (t) => t.amount);
  const inc = sum(mt.filter((t) => INCOME.includes(t.kind)), (t) => t.amount);
  const growth = T.all - start - dep + wd - inc;
  const name = MONTHS[TODAY.getMonth()] + " " + TODAY.getFullYear();
  const lines = [["Net worth on the 1st", start], ["Money you added", dep], ["Money you took out", -wd], ["Income: dividends, profit, rent", inc], ["Prices moved", growth], ["Net worth today", T.all]];
  openModal({
    title: "Statement for " + name, wide: false,
    html: `<p class="confirm-t" style="margin-bottom:10px">How your money moved from the 1st of ${MONTHS[TODAY.getMonth()]} to today.</p>
      <div class="stmt" style="grid-template-columns:1fr">${lines.map(([l, v], i) => `<div class="li${i === lines.length - 1 ? " tot" : ""}"><span>${l}</span><b class="m ${i > 0 && i < lines.length - 1 ? upDown(v) : ""}">${i > 0 && i < lines.length - 1 ? pkr(v, { plus: true }) : pkr(v)}</b></div>`).join("")}</div>
      <p class="note" style="margin-top:12px">${ic("info")}<span>${mt.length} transactions this month. Prices are demo prices.</span></p>`,
    actions: [{ label: "Close" }, { label: "Download CSV", kind: "primary", fn: () => download("goldmark-statement-" + iso(TODAY) + ".csv", toCSV([["Line", "PKR"], ...lines.map(([l, v]) => [l, Math.round(v)])])) }],
  });
}

  const out = [];
  S.payouts.filter((p) => daysFrom(p.date) <= 7).forEach((p) => { const h = hById(p.hid); if (h) out.push(["coins", `${h.name} pays ${pkr(p.amt)} ${rel(p.date)}`, p.note, "#/dividends"]); });
  S.alerts.filter((a) => a.on).forEach((a) => { const p = gTola(a.karat), gap = ((a.price - p) / p) * 100; if (Math.abs(gap) < 1.6) out.push(["ingot", `${a.karat}K gold is ${pct(Math.abs(gap))} from your alert`, `Alert ${a.dir} ${pkr(a.price)} a tola · now ${pkr(p)}`, "#/gold"]); });
  S.goals.forEach((g) => { const gi = goalInfo(g); if (gi.behind) out.push(["target", `${g.name} is ${gi.behind} month${gi.behind > 1 ? "s" : ""} behind`, `Put in ${pkr(gi.need)} a month to reach it by ${fmonY(g.by)}`, "#/goals"]); });
  const zd = daysFrom(S.zakat.date);
  if (zd >= 0 && zd <= 60) { const z = zakatCalc(); out.push(["scale", `Your Zakat date is ${rel(S.zakat.date)}`, `Estimate ${pkr(z.due)} · ${pkr(z.left)} still to pay`, "#/zakat"]); }
  return out;
}

function cmdItems() {

  S.goals.forEach((g) => items.push({ g: "Goals", label: g.name, icon: g.icon, hint: pkr(g.target, { short: true }), run: () => { UI.gl.sel = g.id; UI.gl.monthly = null; UI.gl.ret = null; if (CUR.name === "goals") refresh(); else location.hash = "#/goals"; } }));
  return items;
}
function cmdk() {
  const all = cmdItems();
  let sel = 0, shown = [];
  const m = openModal({
    title: "Search and jump", cls: "cmdk",
    html: `<label class="sr-only" for="cmdq">Search pages, holdings, goals and actions</label><input id="cmdq" class="cmdk-q" type="text" placeholder="Type a page, a holding, a goal or an action…" autocomplete="off" autofocus role="combobox" aria-expanded="true" aria-controls="cmdl"><ul class="cmdk-l" id="cmdl" role="listbox" aria-label="Results"></ul><p class="cmdk-f"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></p>`,
  });
  const q = $("#cmdq", m.el), ul = $(".cmdk-l", m.el);
  const draw = () => {
    const t = q.value.toLowerCase().trim();
    shown = t ? all.filter((x) => (x.label + " " + (x.hint || "")).toLowerCase().includes(t)).slice(0, 14) : all.filter((x) => x.g === "Pages" || x.g === "Actions");
    sel = clamp(sel, 0, Math.max(0, shown.length - 1));
    let g = "";
    ul.innerHTML = shown.length ? shown.map((x, i) => { const hd = x.g !== g ? `<li class="grp" role="presentation">${x.g}</li>` : ""; g = x.g; return hd + `<li role="option" id="cmd-${i}" aria-selected="${i === sel}" data-i="${i}">${ic(x.icon)}<span>${esc(x.label)}</span><small>${esc(x.hint || "")}</small></li>`; }).join("") : '<li class="grp" role="presentation">No matches</li>';
    q.setAttribute("aria-activedescendant", shown.length ? "cmd-" + sel : "");
    const cur = $(`[data-i="${sel}"]`, ul);
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  };
  const run = (i) => { const x = shown[i]; if (!x) return; m.close(); setTimeout(() => x.run(), 30); };
  q.addEventListener("input", () => { sel = 0; draw(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { sel++; draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { sel--; draw(); e.preventDefault(); }
    if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  ul.addEventListener("click", (e) => { const li = e.target.closest("[data-i]"); if (li) run(+li.dataset.i); });
  draw();
}
function setTheme(t) { document.documentElement.dataset.theme = t; updateShell(); if (CURP && RESIZE) RESIZE(); }
function toggleHush() { S.prefs.hush = !S.prefs.hush; save(); updateShell(); toast(S.prefs.hush ? "Amounts hidden. Press the eye to show them." : "Amounts shown"); }

function txFiltered() {
  const q = UI.tx.q.toLowerCase(), from = UI.tx.range === "all" ? "" : day(-+UI.tx.range);
  return S.tx.filter((t) => {
    const h = hById(t.hid);
    if (UI.tx.grp !== "all" && TX_KINDS[t.kind].grp !== UI.tx.grp) return false;
    if (UI.tx.kind !== "all" && (!h || h.k !== UI.tx.kind)) return false;
    if (from && t.date < from) return false;
    if (q && !((h ? h.name + " " + h.code : "") + " " + t.note + " " + TX_KINDS[t.kind].l).toLowerCase().includes(q)) return false;
    return true;
  });
