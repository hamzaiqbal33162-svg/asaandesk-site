<!doctype html>
<!-- Chill & Craft · Box Up · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Up · Chill & Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --stage: #f3e7d3;
    --card: #fffaf1;
    --ink: #2b2118;
    --muted: #7d6a55;
    --line: #e7d7bd;
    --kraft: #c48a4f;
    --kraft-dark: #9a6534;
    --mustard: #e9b93c;
    --belt: #2b2118;
    --wall: #f6ecdc;
    --stamp: #c2410c;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --stage: #17120c;
    --card: #221a12;
    --ink: #f4e6d0;
    --muted: #b49d80;
    --line: #3a2d20;
    --kraft: #c9925a;
    --kraft-dark: #9f6b3b;
    --mustard: #f0c453;
    --belt: #0e0a06;
    --wall: #2b2117;
    --stamp: #fb923c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      repeating-linear-gradient(45deg, transparent 0 22px, rgba(154, 101, 52, .05) 22px 24px),
      var(--stage);
    color: var(--ink);
    overflow-x: hidden;
  }
  .stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .card {
    width: 100%; max-width: 380px;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 6px 6px 0 var(--ink);
    animation: rise .6s var(--spring) backwards;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) rotate(-1deg); } }
  .product { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .product svg { flex: none; width: 52px; height: 52px; transition: transform .5s var(--spring); }
  .product:hover svg { transform: rotate(-10deg) scale(1.08); }
  .product h1 { margin: 0; font-size: 17px; }
  .product p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .product .price { margin-left: auto; font-weight: 800; font-size: 17px; white-space: nowrap; }

  /* ---------- Packing station ---------- */
  .station {
    display: block; width: 100%; height: auto;
    border-radius: 14px;
    background: var(--wall);
    border: 1.5px solid var(--line);
  }
  .shelf { fill: var(--kraft-dark); }
  .box-face { fill: var(--kraft); }
  .box-back { fill: var(--kraft-dark); }
  .flap { fill: var(--kraft); stroke: var(--kraft-dark); stroke-width: 1; }
  .flap-l { transform-origin: 150px 73px; transform: rotate(-128deg); }
  .flap-r { transform-origin: 230px 73px; transform: rotate(128deg); }
  .paper { fill: #fffdf6; transform-origin: 190px 76px; transform: scaleY(0); }
  .tape { fill: var(--mustard); opacity: .9; transform-origin: 190px 68px; transform: scaleY(0); }
  .label { transform-origin: 170px 100px; transform: scale(0); }
  .belt { fill: var(--belt); }
  .belt-line { stroke: var(--mustard); stroke-width: 2; stroke-dasharray: 10 8; }
  .leg { fill: var(--belt); }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: 0; }
  .station:hover .steam path { animation: steam 1.4s ease-out infinite; }
  .station:hover .steam path + path { animation-delay: .5s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-8px); } }
  .dust circle { fill: var(--muted); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .stamp { opacity: 0; transform-origin: 160px 62px; }
  .stamp-box { fill: none; stroke: var(--stamp); stroke-width: 4; }
  .stamp-text { fill: var(--stamp); font: 900 20px system-ui, sans-serif; letter-spacing: 3px; }

  /* Step classes on the station drive each motion */
  .station.ready .kettle { animation: wiggle .3s ease-in-out 2; transform-origin: 47px 58px; }
  @keyframes wiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  .station.pick .kettle { animation: pick .9s cubic-bezier(.4, 0, .4, 1) forwards; }
  .station.landed .parcel { animation: thump .4s var(--spring); }
  .station.landed .dust circle { animation: dust .5s ease-out; }
  .station.landed .dust circle:nth-child(2) { animation-name: dust2; }
  .station.pack .paper { transform: scaleY(1); transition: transform .3s var(--spring); }
  .station.pack .flap-l, .station.pack .flap-r { transform: rotate(0); transition: transform .5s cubic-bezier(.4, 1.5, .5, 1) .3s; }
  .station.seal .tape { transform: scaleY(1); transition: transform .35s ease-out; }
  .station.seal .label { transform: scale(1); transition: transform .35s var(--spring) .4s; }
  .station.ship .parcel { transform: translateX(230px); transition: transform 1s cubic-bezier(.5, 0, .7, 1); }
  .station.ship .belt-line { animation: belt .35s linear infinite; }
  .station.ship .kettle { opacity: 0; }
  .station.shipped .stamp { opacity: 1; animation: stamp .5s var(--spring) forwards; }
  .station.incoming .parcel { animation: slideIn .75s cubic-bezier(.2, .8, .3, 1.15); }
  .station.incoming .kettle { animation: dropIn .6s var(--spring); }

  @keyframes pick {
    0% { transform: translate(0, 0); }
    20% { transform: translate(0, -14px) rotate(-6deg); }
    45% { transform: translate(70px, -34px) rotate(10deg); }
    72% { transform: translate(142px, -18px) rotate(0); }
    100% { transform: translate(142px, 58px); }
  }
  @keyframes thump { 30% { transform: translateY(2px) scale(1, .96); } }
  @keyframes dust { from { opacity: .7; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(-16px, -8px) scale(1.6); } }
  @keyframes dust2 { from { opacity: .7; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(16px, -8px) scale(1.6); } }
  @keyframes belt { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
  @keyframes stamp { 0% { opacity: 0; transform: scale(2.2) rotate(-24deg); } 60% { opacity: 1; transform: scale(.92) rotate(-8deg); } 100% { transform: scale(1) rotate(-10deg); } }
  @keyframes slideIn { from { transform: translateX(-240px); } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-20px); } }

  /* ---------- Steps ---------- */
  .steps { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 14px; padding: 0; counter-reset: s; }
  .steps li {
    counter-increment: s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 700; color: var(--muted);
  }
  .steps li::before {
    content: counter(s);
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--line);
    background: var(--card);
    font-size: 12px;
    transition: background .25s, border-color .25s, color .25s;
  }
  .steps li.is-now { color: var(--ink); }
  .steps li.is-now::before { border-color: var(--mustard); animation: ping 1s ease-in-out infinite; }
  .steps li.is-on { color: var(--ink); }
  .steps li.is-on::before { content: "✓"; background: var(--ink); border-color: var(--ink); color: var(--card); animation: popIn .45s var(--spring); }
  @keyframes ping { 50% { box-shadow: 0 0 0 6px rgba(233, 185, 60, .35); } }
  @keyframes popIn { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* ---------- Buy button with a progress fill ---------- */
  .buy {
    position: relative;
    width: 100%; height: 56px;
    border: 2px solid var(--ink); border-radius: 14px;
    background: var(--ink); color: var(--card);
    font: 800 16px system-ui, sans-serif;
    cursor: pointer; overflow: hidden;
    transition: transform .3s var(--spring), box-shadow .15s, background .2s, color .2s;
    box-shadow: 0 5px 0 var(--kraft-dark);
  }
  .buy:not([aria-disabled]):hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--kraft-dark); }
  .buy:not([aria-disabled]):active { transform: translateY(4px); box-shadow: 0 1px 0 var(--kraft-dark); transition-duration: .06s; }
  .buy:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
  .buy[aria-disabled="true"] { cursor: default; }
  .buy::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: var(--p, 0%);
    background: repeating-linear-gradient(-45deg, var(--mustard) 0 12px, #f3cc5c 12px 24px);
    background-size: 34px 34px;
    transition: width .6s ease;
  }
  .buy.working::before { animation: stripes .6s linear infinite; }
  @keyframes stripes { to { background-position: 34px 0; } }
  .buy span { position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .buy span.swap { animation: swap .35s var(--spring); }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } }
  .buy.working { color: var(--ink); background: var(--card); }
  .buy.shipped { color: var(--ink); animation: cheer .5s var(--spring); }
  @keyframes cheer { 40% { transform: scale(1.04, .94); } }

  .note { margin: 10px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); min-height: 1.4em; }

  .bit { position: fixed; z-index: 30; width: 7px; height: 11px; margin: -5px 0 0 -3px; border-radius: 2px; pointer-events: none; }
  .bit.round { width: 8px; height: 8px; border-radius: 50%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="pName">
    <div class="product">
      <svg viewBox="0 0 52 52" aria-hidden="true">
        <rect width="52" height="52" rx="12" fill="#e9b93c" opacity=".3"/>
        <path d="M14 38c0-10 5-18 12-18s12 8 12 18Z" fill="#c48a4f"/>
        <path d="M38 28c5 0 6 4 4 8" fill="none" stroke="#9a6534" stroke-width="3" stroke-linecap="round"/>
        <path d="M14 28l-5-5" stroke="#9a6534" stroke-width="3" stroke-linecap="round"/>
        <rect x="22" y="15" width="8" height="5" rx="2" fill="#9a6534"/>
        <rect x="12" y="37" width="28" height="3" rx="1.5" fill="#9a6534"/>
      </svg>
      <div>
        <h1 id="pName">Brass Chai Kettle</h1>
        <p>1.5 litre · hand-hammered</p>
      </div>
      <span class="price">Rs 5,600</span>
    </div>

    <!-- Packing station: shelf, box on a belt, tape, label and stamp -->
    <svg class="station" id="station" viewBox="0 0 320 150" aria-hidden="true">
      <defs>
        <clipPath id="buClip"><rect width="320" height="150"/></clipPath>
      </defs>
      <g clip-path="url(#buClip)">
        <rect class="shelf" x="12" y="58" width="74" height="6" rx="2"/>
        <path class="shelf" d="M22 64v10l8-10M74 64v10l-8-10"/>

        <!-- Back of the box (moves with the front half below) -->
        <g class="parcel">
          <rect class="box-back" x="152" y="66" width="76" height="10" rx="2"/>
          <path class="paper" d="M154 76l6-8 6 6 6-8 6 7 6-8 6 8 6-7 6 8 6-7 6 8 6-7 4 8Z"/>
        </g>
        <!-- Kettle sits on the shelf, then flies into the box -->
        <g class="kettle">
          <g class="steam"><path d="M42 24c-3-3 3-5 0-9"/><path d="M50 24c-3-3 3-5 0-9"/></g>
          <path d="M30 56c0-13 7-22 17-22s17 9 17 22Z" fill="#c48a4f"/>
          <path d="M64 44c6 0 8 5 5 10" fill="none" stroke="#9a6534" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M31 46l-7-6" stroke="#9a6534" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="42" y="28" width="10" height="6" rx="2" fill="#9a6534"/>
          <rect x="28" y="54" width="38" height="4" rx="2" fill="#9a6534"/>
          <path d="M38 44c3-4 7-5 10-5" stroke="#fff" stroke-opacity=".5" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>
        <!-- Front of the box, flaps, tape and label -->
        <g class="parcel">
          <rect class="box-face" x="150" y="74" width="80" height="44" rx="2"/>
          <path d="M150 82h80" stroke="#9a6534" stroke-width="1" opacity=".5"/>
          <rect class="flap flap-l" x="150" y="70" width="40" height="6" rx="1"/>
          <rect class="flap flap-r" x="190" y="70" width="40" height="6" rx="1"/>
          <rect class="tape" x="184" y="68" width="12" height="28"/>
          <g class="label">
            <rect x="158" y="92" width="24" height="17" rx="2" fill="#fffdf6"/>
            <path d="M161 97h18M161 101h12M161 105h15" stroke="#2b2118" stroke-width="1.6"/>
          </g>
          <path d="M206 102l6 6m0-6l-6 6" stroke="#9a6534" stroke-width="2" opacity=".6"/>
        </g>
        <g class="dust"><circle cx="152" cy="116" r="5"/><circle cx="228" cy="116" r="5"/></g>

        <rect class="belt" x="-10" y="118" width="340" height="10" rx="5"/>
        <path class="belt-line" d="M-10 119H330"/>
        <rect class="leg" x="40" y="128" width="6" height="22"/>
        <rect class="leg" x="160" y="128" width="6" height="22"/>
        <rect class="leg" x="280" y="128" width="6" height="22"/>

        <!-- Big stamp once it has shipped -->
        <g class="stamp">
          <rect class="stamp-box" x="104" y="40" width="112" height="40" rx="8"/>
          <text class="stamp-text" x="160" y="68" text-anchor="middle">SHIPPED</text>
        </g>
      </g>
    </svg>

    <ol class="steps" id="steps">
      <li data-step="pick">Picked</li>
      <li data-step="pack">Packed</li>
      <li data-step="seal">Sealed</li>
      <li data-step="ship">Shipped</li>
    </ol>

    <button class="buy" id="buy" type="button"><span id="buyLabel">Buy Now · Rs 5,600</span></button>
    <p class="note" id="note">Ships from Peshawar within 24 hours.</p>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
  (() => {
    "use strict";
    const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const station = document.getElementById("station");
    const buy = document.getElementById("buy");
    const label = document.getElementById("buyLabel");
    const note = document.getElementById("note");
    const live = document.getElementById("live");
    const items = document.querySelectorAll("#steps li");
    let busy = false;

    const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 100) : ms));
    const hold = (ms) => new Promise((r) => setTimeout(r, ms)); // not shortened: keeps the done state readable
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

    function markSteps(n) {
      items.forEach((li, i) => {
        li.classList.toggle("is-on", i < n);
        li.classList.toggle("is-now", i === n);
        if (i === n) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
      });
    }
    function setLabel(text, p, say) {
      label.textContent = text;
      replay(label, "swap");
      buy.style.setProperty("--p", p + "%");
      if (say) live.textContent = say;
    }

    // Confetti from the middle of an element
    function confetti(el, n) {
      if (RM || !el.animate) return;
      const r = el.getBoundingClientRect();
      const colors = ["#e9b93c", "#c48a4f", "#c2410c", "#2b2118", "#fffdf6"];
      for (let i = 0; i < n; i++) {
        const b = document.createElement("i");
        b.className = "bit" + (i % 3 ? "" : " round");
        b.style.left = r.left + r.width / 2 + "px";
        b.style.top = r.top + r.height / 2 + "px";
        b.style.background = colors[i % colors.length];
        document.body.appendChild(b);
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
        const d = 70 + Math.random() * 80;
        const x = Math.cos(a) * d, y = Math.sin(a) * d, spin = (Math.random() - 0.5) * 900;
        b.animate([
          { transform: "translate(0,0) scale(.3)", opacity: 1 },
          { transform: `translate(${x}px,${y}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(${x * 1.2}px,${y + 110}px) rotate(${spin}deg) scale(.7)`, opacity: 0 }
        ], { duration: 1200 + Math.random() * 400, easing: "cubic-bezier(.15,.7,.35,1)" }).onfinish = () => b.remove();
      }
    }

    buy.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      buy.setAttribute("aria-disabled", "true");
      buy.classList.add("working");
      station.classList.remove("incoming");

      // 1. Anticipation: the kettle wiggles on the shelf
      markSteps(0);
      setLabel("Order received…", 8, "Order received. Picking your kettle.");
      station.classList.add("ready");
      await wait(600);
      // 2. Pick: it hops off the shelf and drops into the box with a puff of dust
      station.classList.add("pick");
      await wait(900);
      replay(station, "landed");
      setLabel("Packing the box…", 30, "Packing the box.");
      markSteps(1);
      await wait(250);
      // 3. Pack: paper fills, flaps fold shut with a spring
      station.classList.add("pack");
      await wait(900);
      // 4. Seal: tape runs down and the label stamps on
      markSteps(2);
      setLabel("Taping and labelling…", 55, "Sealing and labelling.");
      station.classList.add("seal");
      await wait(900);
      // 5. Ship: belt runs and the box rolls away
      markSteps(3);
      setLabel("Off it goes…", 80, "Shipping now.");
      station.classList.add("ship");
      await wait(1050);

      // 6. Done: stamp, confetti, tracking number
      const id = "BX-" + Math.floor(10000 + Math.random() * 90000);
      markSteps(4);
      station.classList.add("shipped");
      buy.classList.remove("working");
      buy.classList.add("shipped");
      setLabel("Shipped ✓", 100, "Shipped. Tracking number " + id + ".");
      note.textContent = "Tracking " + id + " · arrives in 2 to 3 days";
      confetti(buy, 24);
      await hold(3000);

      // 7. Reset: a fresh empty box rolls in and the kettle drops back on the shelf
      station.classList.remove("ready", "pick", "landed", "pack", "seal", "ship", "shipped");
      station.classList.add("incoming");
      buy.classList.remove("shipped");
      buy.style.setProperty("--p", "0%");
      setLabel("Buy again · Rs 5,600", 0);
      markSteps(-1);
      buy.removeAttribute("aria-disabled");
      busy = false;
    });

    markSteps(-1);
  })();
</script>
</body>
</html>
