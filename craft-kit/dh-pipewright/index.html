<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipewright · Flow automation</title>
<meta name="description" content="Build and watch automatic tasks between business tools: a blueprint-style flow builder, live executions with a waterfall view, connections, monitoring and variables.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "pipewright:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: blueprint paper by day, night blueprint by dark
   ========================================================= */
:root {
  color-scheme: light;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --r: 4px; --r-sm: 4px;
  --bg: #edf3fa; --surface: #ffffff; --surface2: #f3f7fc; --ink: #0d2240; --muted: #5b6f8b; --line: #d2deed;
  --accent: #0b67c6; --accent-ink: #fff; --focus: #0b67c6; --ok: #0f8f5f; --warn: #b7791f; --bad: #d1435b; --info: #3b7bd8;
  --c1: #0b67c6; --c2: #13a3b8; --c3: #d1435b; --c4: #7a5af0; --c5: #b7791f;
  --gridl: rgba(11, 103, 198, .07); --tip-bg: #0d2240; --wire: #8aa6c7; --pulse: #13a3b8;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a111e; --surface: #0e1829; --surface2: #0b1424; --ink: #d6e4f4; --muted: #7d92ae; --line: #1c2b43;
  --accent: #22d3ee; --accent-ink: #03121a; --focus: #22d3ee; --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --info: #60a5fa;
  --c1: #22d3ee; --c2: #60a5fa; --c3: #fb7185; --c4: #a78bfa; --c5: #fbbf24;
  --gridl: rgba(34, 211, 238, .055); --wire: #31507a; --pulse: #22d3ee;
}
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbars { display: grid; gap: 11px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
.hb-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.hb-fill { height: 100%; width: var(--w); border-radius: inherit; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hbIn { from { width: 0; } }
.heat { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }
.heat .hx { text-align: center; } .heat .hy { padding-right: 6px; align-self: center; white-space: nowrap; }
.hc { aspect-ratio: 1.5; min-height: 10px; border-radius: 3px; opacity: var(--a); animation: cellIn .45s var(--d) both; }
.hc:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
@keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
.gauge { position: relative; margin: 0 auto; width: 100%; }
.gauge svg { display: block; overflow: visible; }
.g-bg, .g-val { fill: none; stroke-width: 14; stroke-linecap: round; }
.g-bg { stroke: color-mix(in srgb, var(--ink) 9%, transparent); }
.gsweep { animation: gsweep 1.3s cubic-bezier(.3,0,.2,1) both; }
@keyframes gsweep { from { stroke-dasharray: 0 1; } }
.g-num { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; display: grid; }
.g-num b { font-size: 28px; line-height: 1; } .g-num span { font-size: 12px; color: var(--muted); }
.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 8px; }
.fn-bar { width: var(--w); min-width: fit-content; display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm, 8px); color: #fff; font-size: 12.5px; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; overflow: hidden; white-space: nowrap; }
.fn-row em { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; }

/* drag board */
.kboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.kcol { display: flex; flex-direction: column; min-height: 220px; border-radius: var(--r, 12px); }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.kcol-h h3 { font-size: 13.5px; flex: 1; }
.kdot { width: 9px; height: 9px; border-radius: 50%; }
.kcount { font-size: 12px; color: var(--muted); }
.klist { display: grid; gap: 9px; padding: 6px 8px 12px; min-height: 80px; flex: 1; align-content: start; border-radius: var(--r, 12px); transition: background .2s; }
.klist.kover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.kcard { position: relative; padding: 11px 12px; padding-right: 36px; border-radius: var(--r-sm, 10px); background: var(--surface); border: 1px solid var(--line); cursor: grab; user-select: none; transition: transform .15s, box-shadow .2s; }
@media (pointer: fine) { .kcard { touch-action: none; } }
.kcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
.kmove { position: absolute; top: 5px; right: 4px; width: 28px; height: 28px; }
.kdragging { opacity: .25; }
.kghost { position: fixed; left: 0; top: 0; z-index: 110; pointer-events: none; box-shadow: 0 22px 48px rgba(0,0,0,.3); cursor: grabbing; }
.kph { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: var(--r-sm, 10px); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.kempty { padding: 18px 8px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-sm, 10px); }
.kdrop { animation: kdrop .6s cubic-bezier(.2,.9,.3,1.4); }
@keyframes kdrop { 0% { transform: scale(.92); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 60% { box-shadow: 0 0 0 10px transparent; } 100% { transform: none; } }

/* page entrance (each app restyles @keyframes rise) */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .drawer { border-radius: 0; } }
/* ---------- Flow builder: canvas, steps, ports, wires and the side panel ---------- */
.fb { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.fb.panning { cursor: grabbing; }
.fb-stage { position: absolute; left: 0; top: 0; width: 4000px; height: 3000px; transform-origin: 0 0; }
.fb-wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.fb-wire-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.fb-wire-path { fill: none; stroke: var(--wire, var(--muted)); stroke-width: 2.2; stroke-linecap: round; transition: stroke .2s, stroke-width .2s; pointer-events: none; }
.fb-wire.sel .fb-wire-path, .fb-wire:hover .fb-wire-path { stroke: var(--accent); stroke-width: 3; }
.fb-wire.flow .fb-wire-path { stroke: var(--pulse, var(--accent)); stroke-width: 3; }
.fb-wire.fresh .fb-wire-path { animation: wireIn .7s ease-out; }
@keyframes wireIn { from { stroke: var(--accent); stroke-width: 7; opacity: .2; } }
.fb-temp { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 6 5; pointer-events: none; }
.fb-pulse { fill: var(--pulse, var(--accent)); filter: drop-shadow(0 0 6px var(--pulse, var(--accent))); }
.fb-pulse.tail { opacity: .4; filter: none; }
.fb-nodes { position: absolute; inset: 0; pointer-events: none; }
.fb-node { position: absolute; left: 0; top: 0; pointer-events: auto; }
.fb-node.drag { z-index: 5; }
.fb-body { display: block; padding: 0; margin: 0; border: 0; background: none; color: inherit; text-align: inherit; font: inherit; cursor: grab; }
.fb-node.drag .fb-body { cursor: grabbing; }
.fb-port { position: absolute; z-index: 2; width: 14px; height: 14px; margin: -7px 0 0 -7px; padding: 0; border-radius: 50%; border: 2px solid var(--surface); background: var(--port, var(--muted)); }
.fb-h .fb-port { top: 50%; } .fb-h .fb-port.in { left: 0; } .fb-h .fb-port.out { left: 100%; }
.fb-v .fb-port { left: 50%; } .fb-v .fb-port.in { top: 0; } .fb-v .fb-port.out { top: 100%; }
.fb-port.out { cursor: crosshair; background: var(--accent); transition: transform .15s; }
.fb-port.out:hover, .fb-port.out:focus-visible { transform: scale(1.4); }
.fb-port.named span { position: absolute; left: 15px; top: -4px; font-size: 10.5px; font-weight: 700; color: var(--muted); white-space: nowrap; pointer-events: none; }
.fb-v .fb-port.named span { left: 50%; top: 14px; transform: translateX(-50%); }
.fb-warn { position: absolute; top: -7px; right: -7px; display: none; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: #fff; font: 700 11px/18px var(--font); text-align: center; pointer-events: none; }
.fb-node.warn .fb-warn { display: block; }
.fb-node.drop .fb-body { outline: 3px dashed var(--accent); outline-offset: 5px; }
.fb.arming .fb-node:not(.sel) .fb-body { animation: armPulse 1.2s infinite; }
@keyframes armPulse { 50% { filter: drop-shadow(0 0 9px var(--accent)); } }
.fb-node.pop { animation: popIn .55s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes popIn { from { opacity: 0; scale: .35; } }
.fb-wire-x { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--bad); display: grid; place-items: center; pointer-events: auto; box-shadow: 0 4px 12px rgba(0, 0, 0, .18); }
.fb-wire-x .ic { width: 14px; height: 14px; }
.fb-wire-x[hidden] { display: none; }
.fb-zoom { position: absolute; right: 10px; bottom: 10px; z-index: 3; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
.fb-zoom .icon-btn { width: 32px; height: 32px; }
.fb-hint { position: absolute; left: 50%; top: 10px; z-index: 3; transform: translateX(-50%); max-width: calc(100% - 20px); padding: 6px 12px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.fb-hint:empty { display: none; }
.fp-h { display: flex; align-items: center; gap: 12px; }
.fp-ic { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 12px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.fp-cat { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.fp-h h3 { font-size: 16px; }
.fp-d { font-size: 13px; color: var(--muted); margin: 10px 0 2px; }
.fp-f { display: grid; gap: 12px; margin-top: 12px; }
.fp-c { margin-top: 16px; }
.fp-l { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.fp-c ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
.fp-c li { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; padding: 2px 2px 2px 10px; border-radius: 8px; background: var(--surface2); font-size: 13px; }
.fp-c li .icon-btn { width: 30px; height: 30px; }
.fp-link { display: flex; gap: 6px; }
.fp-link select { flex: 1; min-width: 0; min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2); }
.fp-a { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }

/* =========================================================
   2. Shell: explorer sidebar, top bar and a status bar
   ========================================================= */
body { background-color: var(--bg); background-image: linear-gradient(var(--gridl) 1px, transparent 1px), linear-gradient(90deg, var(--gridl) 1px, transparent 1px); background-size: 24px 24px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 200; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; }
.skip:focus { left: 8px; }
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; padding-bottom: 28px; overflow-x: clip; }
.side { position: sticky; top: 0; height: calc(100vh - 28px); display: flex; flex-direction: column; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
.brand svg { width: 30px; height: 30px; }
.brand b { font: 700 15px var(--mono); letter-spacing: .02em; }
.brand small { display: block; font: 10.5px var(--mono); color: var(--muted); }
.tree { position: relative; padding: 10px 8px; display: grid; gap: 1px; font-family: var(--mono); font-size: 13px; }
.tree p { padding: 12px 8px 5px; font-size: 10.5px; letter-spacing: .14em; color: var(--muted); }
.tree p::before { content: "▾ "; }
.tree a { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 18px; text-decoration: none; color: var(--muted); border-radius: 3px; transition: color .15s, background .15s; }
.tree a::before { content: ""; position: absolute; left: 8px; top: 50%; width: 6px; border-top: 1px dashed var(--line); }
.tree a .ic { width: 16px; height: 16px; }
.tree a:hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.tree a[aria-current="page"] { color: var(--ink); }
.tree a[aria-current="page"] .ic { color: var(--accent); }
.tree .badge { margin-left: auto; font-size: 10.5px; padding: 0 6px; border: 1px solid currentColor; border-radius: 3px; color: var(--bad); }
.tree .badge:empty { display: none; }
.nav-marker { position: absolute; left: 8px; right: 8px; top: 0; background: color-mix(in srgb, var(--accent) 12%, transparent); border-left: 2px solid var(--accent); border-radius: 3px; transition: transform .35s cubic-bezier(.2, .9, .3, 1.15), height .25s; pointer-events: none; }
.side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); font: 11.5px var(--mono); color: var(--muted); display: grid; gap: 6px; }
.workers { display: flex; gap: 4px; }
.workers i { width: 18px; height: 8px; border-radius: 2px; background: var(--ok); opacity: .85; animation: wk 2.4s infinite; animation-delay: calc(var(--d) * .3s); }
@keyframes wk { 50% { opacity: .35; } }
.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 22px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); }
.crumbs { font: 12.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--ink); }
.menu-btn { display: none; }
.cmd { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font: 12.5px var(--mono); min-width: 240px; }
.cmd span { flex: 1; text-align: left; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; }
.t-ic .i-sun { display: none; } [data-theme="dark"] .t-ic .i-sun { display: block; } [data-theme="dark"] .t-ic .i-moon { display: none; }
.icon-btn { border-radius: 4px; }
.nav-scrim { display: none; }
.view { padding: 20px 22px 40px; outline: none; }
.status { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 14px; font: 11.5px var(--mono); color: var(--accent-ink); background: var(--accent); overflow: hidden; white-space: nowrap; }
.status span { display: inline-flex; align-items: center; gap: 6px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: wk 1.6s infinite; }
.status .sp { margin-left: auto; }

/* =========================================================
   3. Blueprint cards with corner marks
   ========================================================= */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.ph h1 { font: 700 24px/1.2 var(--mono); letter-spacing: -.01em; }
.ph h1:focus { outline: none; }
.ph p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 4px; font-family: var(--mono); font-size: 12.5px; font-weight: 600; min-height: 34px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.card, .kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; min-width: 0; transition: transform .2s, box-shadow .2s, border-color .2s; }
.card::before, .card::after, .kpi::before, .kpi::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--accent); pointer-events: none; opacity: .55; transition: opacity .2s, transform .25s; }
.card::before, .kpi::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
.card::after, .kpi::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
.card:hover, .kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -14px color-mix(in srgb, var(--accent) 60%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.card:hover::before, .kpi:hover::before { transform: translate(-3px, -3px); opacity: 1; }
.card:hover::after, .kpi:hover::after { transform: translate(3px, 3px); opacity: 1; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font: 700 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card-h h2::before { content: "// "; color: var(--accent); }
.kpi span { font: 11.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.kpi b { display: block; font: 700 27px var(--mono); margin: 6px 0 2px; }
.kpi small { font: 12px var(--mono); color: var(--muted); }
.kpi small.up { color: var(--ok); } .kpi small.down { color: var(--bad); }
@keyframes rise { from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(6px); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
.pill { border-radius: 3px; font-family: var(--mono); font-size: 11.5px; }
.chip { border-radius: 3px; font-family: var(--mono); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tbl { font-size: 13px; } .tbl th { font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.code { font: 12.5px var(--mono); }
.layer, .pop { border-radius: 6px; }
.modal, .drawer { border-radius: 6px 0 0 6px; } .modal { border-radius: 6px; }
.seg, .seg button, .seg-thumb { border-radius: 4px; }
.av { border-radius: 4px; }

/* pipeline pulse: lanes with packets that travel when a run happens */
.lanes { display: grid; gap: 12px; }
.lane { display: grid; grid-template-columns: 170px minmax(0, 1fr) 60px; gap: 12px; align-items: center; font: 12px var(--mono); }
.lane-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; height: 18px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; border-top: 2px dashed var(--wire); }
.track .st { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border: 2px solid var(--wire); background: var(--surface); border-radius: 2px; transition: border-color .2s, background .2s; }
.track .st.hit { border-color: var(--accent); background: var(--accent); }
.packet { position: absolute; top: 4px; left: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--pc, var(--accent)); box-shadow: 0 0 10px var(--pc, var(--accent)); transition: left 1.8s linear, opacity .3s; }
.packet.err { --pc: var(--bad); }
.lane em { font-style: normal; text-align: right; color: var(--muted); }
.stream { list-style: none; margin: 0; padding: 0; font: 12px var(--mono); display: grid; gap: 4px; max-height: 300px; overflow: hidden; }
.stream li { display: grid; grid-template-columns: 62px 10px 1fr auto; gap: 8px; align-items: center; padding: 5px 8px; border-left: 2px solid var(--line); background: var(--surface2); }
.stream li i { width: 8px; height: 8px; border-radius: 50%; background: var(--info); }
.stream li.Succeeded i { background: var(--ok); } .stream li.Failed i { background: var(--bad); } .stream li.Running i { background: var(--warn); animation: wk 1s infinite; }
.stream li.Failed { border-left-color: var(--bad); }
.stream li.new { animation: tick .5s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes tick { from { opacity: 0; transform: translateX(-10px); background: color-mix(in srgb, var(--accent) 25%, transparent); } }
.stream span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stream time, .stream em { color: var(--muted); font-style: normal; }

/* =========================================================
   4. Builder: blueprint canvas, rectangular steps, inspector
   ========================================================= */
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.bar .name { flex: 1 1 220px; min-width: 0; font: 700 18px var(--mono); border: 1px solid transparent; border-radius: 4px; padding: 5px 8px; background: transparent; }
.bar .name:hover { border-color: var(--line); } .bar .name:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.ver { font: 11.5px var(--mono); color: var(--muted); padding: 3px 7px; border: 1px dashed var(--line); border-radius: 3px; }
.bar .err { flex-basis: 100%; }
.bld { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 12px; }
.pal { padding: 10px; display: grid; gap: 2px; align-content: start; font-family: var(--mono); max-height: 600px; overflow: auto; }
.pal .tbl-search { max-width: none; min-height: 32px; margin-bottom: 6px; font-size: 12px; }
.pal p { font-size: 10.5px; letter-spacing: .14em; color: var(--muted); margin: 10px 4px 4px; }
.pal button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 3px; background: none; text-align: left; font-size: 12.5px; cursor: grab; }
.pal button:hover { border-color: var(--line); background: var(--surface2); }
.pal button i { width: 6px; height: 18px; border-radius: 2px; background: var(--c); flex: none; }
.pal-ghost { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; width: 200px; padding: 8px 10px; border: 1px solid var(--c); border-top: 4px solid var(--c); background: var(--surface); font: 12px var(--mono); box-shadow: 0 16px 30px -12px rgba(0, 0, 0, .4); opacity: .95; }
.canvas-card { padding: 0; overflow: hidden; }
.canvas-card::before, .canvas-card::after { z-index: 4; }
.canvas { height: 600px; background-color: var(--surface2); background-image: linear-gradient(var(--gridl) 1px, transparent 1px), linear-gradient(90deg, var(--gridl) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--accent) 10%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent) 1px, transparent 1px); background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px; }
.pw { width: 210px; border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 4px; background: var(--surface); box-shadow: 0 6px 16px -10px rgba(0, 0, 0, .5); transition: border-color .2s, box-shadow .2s, transform .15s; display: block; }
.pw-h { display: flex; align-items: center; gap: 7px; padding: 6px 9px; font: 700 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c); border-bottom: 1px dashed var(--line); }

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches; // reduced motion
const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const node = (html) => { const t = document.createElement("template"); t.innerHTML = String(html).trim(); return t.content.firstElementChild; };
const on = (root, ev, sel, fn) => root.addEventListener(ev, (e) => { const t = e.target.closest && e.target.closest(sel); if (t && root.contains(t)) fn(e, t); });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a, f = (x) => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const avg = (a, f) => (a.length ? sum(a, f) / a.length : 0);
const uid = (p = "") => p + Math.random().toString(36).slice(2, 8);
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- Seeded random numbers, so the demo data is the same every time ---------- */
function seeded(seed) { return function () { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const fdt = (t) => fdate(t) + ", " + ftime(t);
const ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 45 ? "just now" : s < 3600 ? Math.max(1, Math.round(s / 60)) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago"; };

/* ---------- Executions: live table and a waterfall per run ---------- */
let livePaused = false;
function openExec(e) {
  const f = F(e.flow), steps = e.trace ? e.trace.filter((x) => x.node) : (f ? f.nodes : []).map((n, i, a) => ({ node: n.cfg.title || TYPES[n.type].label, lvl: e.status === "Failed" && i === a.length - 1 ? "err" : "ok", ms: ri(30, 900), msg: e.status === "Failed" && i === a.length - 1 ? e.err : "ok" }));
  const total = Math.max(1, sum(steps, (s) => s.ms || 0)); let acc = 0;
  const body = node(`<div><div class="row" style="flex-wrap:wrap;margin-bottom:6px">${pill(e.status, EXK[e.status])}<span class="code muted">${e.id} · ${fdt(e.t)} · ${(e.dur / 1000).toFixed(2)}s</span></div>${e.err ? `<p class="code" style="color:var(--bad);margin-top:8px">${esc(e.err)}</p>` : ""}
    <p class="sec-t">waterfall</p><div class="wf">${steps.map((s, i) => { const l = (acc / total) * 100, w = ((s.ms || 0) / total) * 100; acc += s.ms || 0; return `<div class="wf-row ${s.lvl === "err" ? "err" : ""}"><span${tipAttr(esc(s.msg || ""))}>${esc(s.node)}</span><span class="wf-t"><i style="--l:${l.toFixed(1)}%;--w:${w.toFixed(1)}%;--d:${i * 80}ms"></i></span><em>${s.ms || 0} ms</em></div>`; }).join("")}</div>
    <p class="sec-t">input</p><pre class="json">${json(e.payload || { ...SAMPLE, order_id: "MLG-" + (58000 + (e.t % 999)) })}</pre></div>`);
  const acts = [{ label: "open flow", kind: "ghost", run: () => (f ? go("#/builder/" + f.id) : toast("flow was deleted", "warn")) }];
  if (e.status === "Failed") acts.push({ label: "retry", kind: "primary", icon: "refresh", run: () => { e.status = "Retrying"; save(); rerender(); toast(e.id + " queued for retry", "info"); setTimeout(() => { e.status = chance(0.85) ? "Succeeded" : "Failed"; save(); navBadges(); if (App.cur === "executions") rerender(); toast(`${e.id} retry ${e.status === "Succeeded" ? "worked" : "failed again"}`, e.status === "Succeeded" ? "ok" : "bad"); }, RM ? 400 : 2500); } });
  if (e.status === "Running") acts.push({ label: "cancel run", kind: "danger", run: () => { e.status = "Failed"; e.err = "Cancelled by you"; save(); navBadges(); rerender(); toast("run cancelled", "warn"); } });
  drawer({ title: "execution " + e.id, body, actions: acts, wide: true });
}

  const team = () => { $("#tm").innerHTML = DB.team.map((m) => `<div class="set-row"><div class="row">${av(m.name)}<div><b>${esc(m.name)}</b><small>${esc(m.email)}</small></div></div><div class="row"><label class="sr-only" for="rl-${m.id}">Role of ${esc(m.name)}</label><select class="inp" id="rl-${m.id}" data-rl="${m.id}" ${m.role === "Owner" ? "disabled" : ""}>${["Owner", "Editor", "Viewer"].map((r) => `<option ${r === m.role ? "selected" : ""}>${r}</option>`).join("")}</select>${m.role === "Owner" ? "" : `<button type="button" class="icon-btn" data-rm="${m.id}" aria-label="Remove ${esc(m.name)}">${ic("trash")}</button>`}</div></div>`).join(""); };
  team();
  $("#ws").onsubmit = (e) => { e.preventDefault(); const r = +$("#ws-rt").value; $("#ws-rt-e").textContent = r >= 0 && r <= 10 && $("#ws-rt").value !== "" ? "" : "Enter 0 to 10"; if ($("#ws-rt-e").textContent) return $("#ws-rt").focus(); Object.assign(p, { retention: $("#ws-ret").value, tz: $("#ws-tz").value, retries: r }); save(); toast("settings saved"); };
  on($("#tm"), "change", "[data-rl]", (e, s) => { DB.team.find((m) => m.id === s.dataset.rl).role = s.value; save(); toast("role changed"); });
  on($("#tm"), "click", "[data-rm]", async (e, b) => { const m = DB.team.find((x) => x.id === b.dataset.rm); if (await confirmBox(`remove ${m.name}?`, "They lose access straight away.", "remove")) { DB.team.splice(DB.team.indexOf(m), 1); save(); team(); toast("removed", "warn"); } });
  $("#tm-add").onclick = () => formLayer({ title: "invite to workspace", submit: "invite", fields: [{ k: "name", label: "Name", req: true }, { k: "role", label: "Role", type: "select", options: ["Editor", "Viewer"] }, { k: "email", label: "Email", type: "email", req: true, full: true }], onSubmit: (x) => { DB.team.push({ id: uid("t"), ...x }); save(); team(); toast("invite sent to " + x.email); } });
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-json").onclick = () => download("pipewright-flows.json", JSON.stringify(DB.flows, null, 2), "application/json");
  $("#st-reset").onclick = async () => { if (await confirmBox("reset demo data?", "Every flow, run and variable returns to the sample.", "reset")) { store.del(KEY); DB = seed(); navBadges(); rerender(); toast("demo data reset"); } };
} };

/* ---------- Live: runs start, finish, and travel the pipeline lanes ---------- */
let perMin = [];
every(1800, () => {
  DB.execs.filter((e) => e.status === "Running" && Date.now() - e.t > e.dur).forEach((e) => { e.status = chance(0.9) ? "Succeeded" : "Failed"; if (e.status === "Failed") { e.err = pick(["503 from partner API", "Timeout after 30s", "Missing field: city"]); Notes.add(`${(F(e.flow) || { name: "A flow" }).name} failed: ${e.err}`, "bad"); } const li = $(`#stream li[data-id="${e.id}"]`); if (li) li.outerHTML = streamLi(e).replace("<li ", `<li data-id="${e.id}" `); });
  const act = DB.flows.filter((f) => f.status === "Active"); if (!act.length) return;
  const f = pick(act), e = mkExec(f, Date.now(), "Running"); e.dur = ri(900, 5000); e.fresh = true;
  DB.execs.unshift(e); if (DB.execs.length > 120) DB.execs.pop(); DB.hourly[23] += 1;
  perMin.push(Date.now()); perMin = perMin.filter((t) => Date.now() - t < 60000);
  $("#sb-rate").textContent = perMin.length * 2 + " runs/min"; $("#sb-q").textContent = "queue " + DB.execs.filter((x) => x.status === "Running").length;
  const s = $("#stream"); if (s) { s.prepend(node(streamLi(e, true).replace("<li ", `<li data-id="${e.id}" `))); while (s.children.length > 9) s.lastElementChild.remove(); }
  const k = $("#k-runs"); k && countUp(k, sum(DB.hourly), fmt, 500);
  const c = $(`[data-cnt="${f.id}"]`); c && (c.textContent = +c.textContent + 1);
  setTimeout(() => packet({ ...e, status: chance(0.9) ? "Succeeded" : "Failed" }), 50);
  if (App.cur === "executions" && !livePaused && App.exT && !layers.length && App.exT.st.page === 0) App.exT.render(true);
  navBadges(); save();
});
App.onRoute = (n) => { $("#crumbs").innerHTML = `margalla-logistics / <b>${esc(App.pages[n].title)}</b>`; };
App.commands = () => [{ label: "new flow", hint: "create", run: newFlow }, ...DB.flows.map((f) => ({ label: "open " + f.name, hint: "builder", run: () => go("#/builder/" + f.id) })), { label: "pause live executions", hint: "executions", run: () => { livePaused = true; go("#/executions"); } }];
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; if (FB && $("#cv")) FB.drawWires(); };
[["Courier API is degraded (p50 1.2s)", "warn", 20], ["Order to shipment failed 3 times in 10 minutes", "bad", 26], ["Daily cash report delivered", "info", 600]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
navBadges();
boot({ title: "pipewright", key: "pipewright", def: "overview" });
</script>
</body>
</html>
