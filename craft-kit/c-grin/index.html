<!doctype html>
<!-- Chill & Craft · Grin · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grin · mood feedback slider</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (the stage tint is set by the mood) ---------- */
  :root {
    color-scheme: light;
    --tint: #eef3fb;
    --card: rgba(255, 255, 255, .86);
    --ink: #22252e;
    --muted: #6a7080;
    --line: #e3e6ee;
    --field: #ffffff;
    --face: #f6c945;
    --accent: #3b5bdb;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --tint: #10141d;
    --card: rgba(26, 30, 40, .88);
    --ink: #eef0f6;
    --muted: #a2a8b8;
    --line: #313748;
    --field: #161a24;
    --accent: #8ea7ff;
  }

  /* ---------- Page ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px 16px;
    color: var(--ink);
    background: radial-gradient(circle at 50% 25%, color-mix(in srgb, var(--face) 30%, var(--tint)), var(--tint) 70%);
    transition: background .4s;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    position: relative;
    width: min(100%, 400px);
    padding: 22px 20px 20px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -36px rgba(30, 40, 80, .5);
    text-align: center;
  }
  .q { margin: 0; font-size: clamp(18px, 5vw, 21px); }

  /* ---------- The face ---------- */
  .face-wrap { width: 150px; height: 150px; margin: 10px auto 2px; }
  .face-wrap.cheer { animation: cheer .9s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes cheer {
    30% { transform: translateY(-26px) scale(1.12) rotate(-8deg); }
    55% { transform: translateY(4px) scale(.94, 1.06); }
    75% { transform: translateY(-6px) rotate(4deg); }
  }
  .face-wrap.nod { animation: nod .6s ease-in-out; }
  @keyframes nod { 30% { transform: translateY(6px) rotate(3deg); } 65% { transform: translateY(-3px) rotate(-2deg); } }
  #face { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 90%; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .tear { animation: tear 1.4s ease-in infinite; }
  @keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(34px); opacity: 0; } }
  .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.2s ease-in-out infinite alternate; }
  .spark:nth-of-type(2) { animation-delay: -.4s; }
  .spark:nth-of-type(3) { animation-delay: -.8s; }
  @keyframes twinkle { from { transform: scale(.5) rotate(0); } to { transform: scale(1.15) rotate(45deg); } }

  .word { display: inline-block; min-height: 30px; margin: 0 0 10px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .word.flip { animation: wordIn .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes wordIn { from { opacity: 0; transform: translateY(10px) rotateX(80deg) scale(.9); } }

  /* ---------- Slider ---------- */
  .slider { position: relative; margin: 0 4px 6px; }
  input[type="range"] {
    --fill: 50%;
    width: 100%;
    height: 30px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 10px;
    background: linear-gradient(90deg, #8aa2c8, #b9b4c8 35%, #f3c650 70%, #ffb020);
  }
  input[type="range"]::-moz-range-track { height: 10px; border-radius: 10px; background: linear-gradient(90deg, #8aa2c8, #b9b4c8 35%, #f3c650 70%, #ffb020); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 30px;
    height: 30px;
    margin-top: -10px;
    border-radius: 50%;
    background: var(--face);
    border: 4px solid #fff;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--face);
    border: 4px solid #fff;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.3); box-shadow: 0 0 0 10px color-mix(in srgb, var(--face) 30%, transparent); }
  input[type="range"]:hover::-moz-range-thumb { transform: scale(1.12); }
  input[type="range"]:active::-moz-range-thumb { transform: scale(1.3); }
  input[type="range"]:focus { outline: none; }
  input[type="range"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  /* ---------- Comment and send ---------- */
  textarea {
    display: block;
    width: 100%;
    min-height: 64px;
    margin: 14px 0 12px;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    resize: vertical;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .send {
    position: relative;
    width: 100%;
    padding: 13px 18px;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--ink);
    cursor: pointer;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s;
  }
  [data-theme="dark"] .send { color: #10141d; }
  .send:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 22px -12px rgba(0, 0, 0, .6); }
  .send:active:not(:disabled) { transform: scale(.96); transition-duration: .08s; }
  .send:focus-visible, .again:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .send:disabled { cursor: progress; }
  .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: currentColor; animation: hopdot .6s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .1s; }
  .dots span:nth-child(3) { animation-delay: .2s; }
  @keyframes hopdot { 50% { transform: translateY(-5px); } }

  /* Swap between the form and the thank-you note */
  .form, .thanks { transition: opacity .35s, transform .45s cubic-bezier(.34, 1.4, .64, 1), visibility .35s; }
  .card.sent .form { opacity: 0; transform: scale(.94); pointer-events: none; visibility: hidden; }
  .thanks { visibility: hidden; }
  .card.sent .thanks { visibility: visible; }
  .swap { display: grid; }
  .swap > * { grid-area: 1 / 1; min-width: 0; }
  .thanks {
    align-self: center;
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
  }
  .card.sent .thanks { opacity: 1; transform: none; pointer-events: auto; transition-delay: .15s; }
  .thanks h2 { margin: 0 0 6px; font-size: 22px; }
  .thanks p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .again {
    padding: 11px 20px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), border-color .2s;
  }
  .again:hover { transform: translateY(-2px); border-color: var(--accent); }
  .again:active { transform: scale(.95); }

  /* Particles: hearts or little stars */
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fx i { position: absolute; left: 0; top: 0; margin: -10px 0 0 -9px; font-style: normal; font-size: 20px; line-height: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main class="card" id="card">
      <h1 class="q" id="q">How was your order today?</h1>

      <!-- The face is drawn from the slider value -->
      <div class="face-wrap" id="faceWrap" aria-hidden="true">
        <svg id="face" viewBox="0 0 200 200">
          <circle id="head" cx="100" cy="100" r="86" stroke-width="4"/>
          <ellipse id="cheekL" cx="54" cy="122" rx="15" ry="9" fill="#ff7b8a"/>
          <ellipse id="cheekR" cx="146" cy="122" rx="15" ry="9" fill="#ff7b8a"/>
          <path id="browL" fill="none" stroke-width="6" stroke-linecap="round"/>
          <path id="browR" fill="none" stroke-width="6" stroke-linecap="round"/>
          <g class="eyes">
            <ellipse id="eyeL" cx="70" cy="88" rx="9" ry="12"/>
            <ellipse id="eyeR" cx="130" cy="88" rx="9" ry="12"/>
            <circle id="glintL" cx="72" cy="84" r="3" fill="#fff"/>
            <circle id="glintR" cx="132" cy="84" r="3" fill="#fff"/>
          </g>
          <path id="mouth" fill="#6b2430" stroke-width="4" stroke-linejoin="round"/>
          <ellipse id="tongue" cx="100" cy="150" rx="14" ry="7" fill="#ff8f9c"/>
          <path id="tearDrop" class="tear" d="M62 104c0 0-7 10-7 15a7 7 0 0 0 14 0c0-5-7-15-7-15z" fill="#6fb7ff"/>
          <g id="sparks" fill="#ffd34d">
            <path class="spark" d="M24 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
            <path class="spark" d="M176 30l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z"/>
            <path class="spark" d="M184 150l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
          </g>
        </svg>
      </div>

    <!-- The form and the thank-you note share one spot and cross-fade -->
    <div class="swap">
    <form class="form" id="form">
      <p class="word" id="word" aria-hidden="true">It was okay</p>
      <div class="slider">
        <input type="range" id="mood" min="0" max="100" step="1" value="50" aria-labelledby="q" aria-valuetext="It was okay">
        <div class="ends" aria-hidden="true"><span>Not good</span><span>Loved it</span></div>
      </div>

      <label class="sr" for="note">Anything else you want to tell us?</label>
      <textarea id="note" placeholder="Anything else? (optional)"></textarea>
      <button type="submit" class="send" id="send">Send feedback</button>
    </form>

    <div class="thanks" id="thanks">
      <h2 id="thanksTitle">Thank you!</h2>
      <p id="thanksText">Your feedback helps us get better.</p>
      <button type="button" class="again" id="again">Send another</button>
    </div>
    </div>
    <p class="sr" id="announce" role="status" aria-live="polite"></p>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const mood = $("mood");
  const face = $("face");
  const card = $("card");
  const root = document.documentElement;

  const lerp = (a, b, t) => a + (b - a) * t;
  // Three-point blend: sad (0) → neutral (0.5) → happy (1)
  const tri = (m, sad, mid, happy) => (m < 0.5 ? lerp(sad, mid, m * 2) : lerp(mid, happy, (m - 0.5) * 2));
  const WORDS = [[20, "Not good at all"], [40, "Could be better"], [60, "It was okay"], [80, "Pretty good"], [101, "Loved it!"]];
  const wordFor = (v) => WORDS.find((w) => v < w[0])[1];

  // ---- Draw the face for a mood between 0 and 1 ----
  let look = [0, 0];            // where the eyes look (pointer)
  function draw(m, tilt, bob) {
    const hue = lerp(212, 44, m);
    const sat = lerp(26, 92, m);
    const dark = root.dataset.theme === "dark";
    const light = dark ? lerp(58, 60, m) : lerp(74, 62, m);
    const skin = "hsl(" + hue.toFixed(0) + " " + sat.toFixed(0) + "% " + light.toFixed(0) + "%)";
    const line = "hsl(" + hue.toFixed(0) + " " + (sat * 0.6).toFixed(0) + "% " + (light - 30).toFixed(0) + "%)";
    root.style.setProperty("--face", skin);

    const head = $("head");
    head.setAttribute("fill", skin);
    head.setAttribute("stroke", line);

    // Brows: worried when sad, flat when neutral, lifted when happy
    const y1 = tri(m, 72, 62, 56), yc = tri(m, 60, 58, 44), y2 = tri(m, 54, 62, 56);
    $("browL").setAttribute("d", "M48 " + y1 + " Q66 " + yc + " 86 " + y2);
    $("browR").setAttribute("d", "M152 " + y1 + " Q134 " + yc + " 114 " + y2);
    $("browL").setAttribute("stroke", line);
    $("browR").setAttribute("stroke", line);

    // Eyes squint when very happy and droop a little when sad
    const ry = 12 - Math.max(0, m - 0.72) * 22;
    const ey = 88 + Math.max(0, 0.2 - m) * 14;
    ["L", "R"].forEach((s, k) => {
      const eye = $("eye" + s);
      eye.setAttribute("ry", ry.toFixed(1));
      eye.setAttribute("cy", ey.toFixed(1));
      eye.setAttribute("fill", line);
      const glint = $("glint" + s);
      glint.setAttribute("cx", (k ? 132 : 72) + look[0]);
      glint.setAttribute("cy", ey - 4 + look[1]);
      glint.setAttribute("opacity", ry > 7 ? 1 : 0);
    });

    // Mouth: frown band → flat line → open grin
    const y = tri(m, 152, 142, 132);
    const w = tri(m, 26, 30, 42);
    const c1 = tri(m, -22, 2, 6);
    const c2 = tri(m, -13, 6, 54);
    const mouth = $("mouth");
    mouth.setAttribute("d", "M" + (100 - w) + " " + y + " Q100 " + (y + c1) + " " + (100 + w) + " " + y + " Q100 " + (y + c2) + " " + (100 - w) + " " + y + "Z");
    mouth.setAttribute("stroke", line);
    const tongue = $("tongue");
    tongue.setAttribute("cy", (y + c2 * 0.36).toFixed(1));
    tongue.setAttribute("rx", (w * 0.42).toFixed(1));
    tongue.setAttribute("opacity", Math.max(0, (m - 0.72) * 3.6).toFixed(2));

    const blush = Math.max(0, (m - 0.55) / 0.45) * 0.6;
    $("cheekL").setAttribute("opacity", blush.toFixed(2));
    $("cheekR").setAttribute("opacity", blush.toFixed(2));
    $("tearDrop").style.visibility = m < 0.18 ? "visible" : "hidden";
    $("sparks").setAttribute("opacity", Math.max(0, (m - 0.84) / 0.16).toFixed(2));

    face.style.transform = "translateY(" + bob.toFixed(1) + "px) rotate(" + tilt.toFixed(1) + "deg)";
  }

  // ---- Spring: the face follows the slider with a little wobble ----
  let pos = 0.5;     // shown mood
  let vel = 0;       // its speed
  let raf = 0;
  function step() {
    const target = Number(mood.value) / 100;
    if (reduce) { pos = target; vel = 0; }
    vel = (vel + (target - pos) * 0.11) * 0.8;
    pos += vel;
    const settled = Math.abs(target - pos) < 0.001 && Math.abs(vel) < 0.001;
    if (settled) { pos = target; vel = 0; }
    const tilt = Math.max(-14, Math.min(14, vel * 220));
    const bob = -Math.min(10, Math.abs(vel) * 160);
    draw(Math.max(0, Math.min(1, pos)), tilt, bob);
    raf = settled ? 0 : requestAnimationFrame(step);
  }
  function kick() {
    if (!raf) raf = requestAnimationFrame(step);
  }

  // ---- Words under the face ----
  const wordEl = $("word");
  function updateWord() {
    const v = Number(mood.value);
    const word = wordFor(v);
    mood.style.setProperty("--fill", v + "%");
    mood.setAttribute("aria-valuetext", word);
    if (wordEl.textContent !== word) {
      wordEl.textContent = word;
      wordEl.classList.remove("flip");
      void wordEl.offsetWidth;
      wordEl.classList.add("flip");
    }
  }
  mood.addEventListener("input", () => {
    updateWord();
    kick();
  });

  // Eyes follow the pointer a little
  window.addEventListener("pointermove", (e) => {
    const r = face.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height * 0.44);
    const d = Math.hypot(dx, dy) || 1;
    look = [(dx / d) * Math.min(3, d / 40), (dy / d) * Math.min(3, d / 40)];
    if (!raf) draw(pos, 0, 0);
  });

  // ---- Send: sending → thank you (with a cheer) → send another ----
  const form = $("form");
  const send = $("send");
  const fx = $("fx");
  function burst(glyphs, colors) {
    if (reduce) return;
    const r = $("faceWrap").getBoundingClientRect();
    const x0 = r.left + r.width / 2;
    const y0 = r.top + r.height / 2;
    for (let n = 0; n < 30; n++) {
      const p = document.createElement("i");
      p.textContent = glyphs[n % glyphs.length];
      p.style.color = colors[n % colors.length];
      fx.append(p);
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.6;
      const d = 80 + Math.random() * 140;
      const dx = Math.cos(angle) * d;
      const dy = Math.sin(angle) * d;
      p.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(.2)", opacity: 1 },
        { transform: "translate(" + (x0 + dx) + "px," + (y0 + dy) + "px) scale(1.1) rotate(" + (dx / 4) + "deg)", opacity: 1, offset: 0.5 },
        { transform: "translate(" + (x0 + dx * 1.1) + "px," + (y0 + dy - 60) + "px) scale(.7)", opacity: 0 }
      ], { duration: 1300 + Math.random() * 600, easing: "cubic-bezier(.2, .7, .3, 1)" }).onfinish = () => p.remove();
    }
  }
  const wait = (ms) => new Promise((done) => setTimeout(done, reduce ? Math.min(ms, 100) : ms));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (send.disabled) return;
    const v = Number(mood.value);
    const word = wordFor(v);
    send.disabled = true;
    mood.disabled = true;
    $("note").disabled = true;
    send.innerHTML = 'Sending <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>';
    $("faceWrap").classList.add("nod");
    await wait(1100);
    $("faceWrap").classList.remove("nod");

    const happy = v >= 60;
    $("thanksTitle").textContent = happy ? "Thank you!" : "Thanks for telling us";
    $("thanksText").textContent = 'You said "' + word + '". ' + (happy ? "We're so glad you enjoyed it." : "We'll use this to do better.");
    card.classList.add("sent");
    $("faceWrap").classList.add("cheer");
    burst(happy ? ["♥", "★", "♥"] : ["✦", "•"], happy ? ["#ff5d7a", "#ffb020", "#ff8fab"] : ["#7aa2ff", "#9fb4d8"]);
    $("announce").textContent = "Feedback sent. " + $("thanksText").textContent;
    $("again").focus();
  });

  $("again").addEventListener("click", () => {
    card.classList.remove("sent");
    $("faceWrap").classList.remove("cheer");
    send.disabled = false;
    mood.disabled = false;
    $("note").disabled = false;
    send.textContent = "Send feedback";
    $("note").value = "";
    mood.value = 50;
    updateWord();
    kick();
    mood.focus();
  });

  updateWord();
  draw(0.5, 0, 0);
})();
</script>
</body>
</html>
