<script>/* Pick the theme before first paint: ?theme= wins, then the saved choice, then the default */(function(k,d){var t;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t!=='light'&&t!=='dark'){try{t=JSON.parse(localStorage.getItem(k+':theme'))}catch(e){}}if(t!=='light'&&t!=='dark')t=d||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})('molara','');</script>
<style>
/* ================= Core styles (each app sets its own tokens) ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ring,var(--accent));outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rb,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{color:var(--danger);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--rb,10px);border:1px solid transparent;background:transparent;color:inherit;position:relative;transition:background .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.bell-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-n[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--text);white-space:nowrap;line-height:1.6}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink,var(--warn))}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.info{background:color-mix(in srgb,var(--info,var(--accent)) 15%,transparent);color:var(--info,var(--accent))}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;font-size:12px;font-weight:700;background:hsl(var(--h) 70% 88%);color:hsl(var(--h) 45% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 32% 26%);color:hsl(var(--h) 80% 84%)}
.av.lg{width:52px;height:52px;font-size:18px}
.av.sm{width:26px;height:26px;font-size:10px}
.segc{display:inline-flex;padding:3px;border-radius:var(--rb,10px);background:var(--hover);gap:2px;flex-wrap:wrap}
.segc button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--rb,10px) - 3px);font-size:12px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.segc button[aria-pressed="true"]{background:var(--surface-solid,var(--surface));color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* Tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));flex:1 1 200px;max-width:320px;color:var(--muted);transition:border-color .2s}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.sort-i::after{content:"\2195";opacity:.35;font-size:10px}
[aria-sort="ascending"] .sort-i::after{content:"\2191";opacity:1}
[aria-sort="descending"] .sort-i::after{content:"\2193";opacity:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer;transition:background .15s}
.tbl tr.clickable:hover{background:var(--hover)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp b{display:block;font-weight:600}
.cellp small{display:block;color:var(--muted);font-size:11.5px}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center;list-style:none}
.empty .ic{width:28px;height:28px;opacity:.55}
.chart-empty{min-height:160px;align-content:center}
/* Forms */
.frm{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px);min-width:140px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-height:38px;padding:8px 11px;border-radius:var(--ri,9px);border:1px solid var(--line);background:var(--field,var(--bg));color:var(--text);transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--danger)!important;animation:shake .35s}
.err{color:var(--danger);font-size:11.5px}
.err:empty{display:none}
.req{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Modal + drawer */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:transparent;transition:background .28s,backdrop-filter .28s}
.ov.in{background:var(--scrim,rgba(10,12,20,.48));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:var(--rm,16px);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(18px) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.ov.in .modal{transform:none;opacity:1}
.modal.wide{width:min(760px,100%)}
.ov-drawer{place-items:stretch end;padding:0}
.drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--surface-solid,var(--surface));color:var(--text);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.ov.in .drawer{transform:none}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:8px 18px 16px}
.drawer .dlg-b{flex:1}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .sp{flex:1}
.confirm-msg{color:var(--muted)}
/* Toasts + tooltip + popovers */
#toasts{position:fixed;z-index:200;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--rt,12px);background:var(--toast-bg,#14161f);color:var(--toast-fg,#fff);font-size:13px;font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.45);animation:toastIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.toast.out{animation:toastOut .3s both}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.warn .toast-dot{background:var(--warn)}.toast.err .toast-dot{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.tip{position:fixed;left:0;top:0;z-index:210;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--tip-bg,rgba(17,19,28,.95));color:#fff;font-size:12px;line-height:1.5;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;max-width:250px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pop{position:absolute;z-index:95;min-width:210px;max-width:min(340px,calc(100vw - 16px));background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--line);border-radius:var(--rp,12px);box-shadow:0 22px 50px -15px rgba(0,0,0,.4);padding:6px;animation:popIn .2s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:top right}
.pop-notes{width:320px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu{display:grid;gap:1px}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button small{margin-left:auto;color:var(--muted);font-size:11px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button:disabled{opacity:.45;cursor:default}
.pop-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 4px}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;border-bottom:1px solid var(--line)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;padding:2px 4px;cursor:pointer}
.notes{list-style:none;margin:0;padding:4px 0;max-height:330px;overflow:auto}
.notes li{display:flex;gap:10px;padding:9px 8px;border-radius:8px}
.notes li.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notes p{font-size:13px}.notes small{color:var(--muted);font-size:11px}
.nd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info,var(--accent))}
.nd.warn{background:var(--warn)}.nd.danger{background:var(--danger)}.nd.ok{background:var(--ok)}
.cmdk .dlg-b{padding-top:2px}
.cmdk-in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--field,var(--bg));font-size:15px;color:var(--text)}
.cmdk-in:focus{outline:none;border-color:var(--accent)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.cmdk-list button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left}
.cmdk-list button[aria-selected="true"],.cmdk-list button:hover{background:var(--hover)}
.cmdk-list small{margin-left:auto;color:var(--muted);font-size:11px}
/* Drag and drop */
.drag-ghost{position:fixed!important;left:0;top:0;z-index:150;pointer-events:none;opacity:.94;box-shadow:0 26px 50px -12px rgba(0,0,0,.45)!important;transition:none!important;animation:none!important;margin:0!important}
.dragging{opacity:.3}
.drop-over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:color-mix(in srgb,var(--accent) 8%,transparent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
[data-drag]{touch-action:none;cursor:grab}
/* Charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line,.spark .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.spark .line{stroke-width:2}
.line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.45,0,.2,1) forwards}
.chart .area,.spark .area{animation:fadeIn 1s .35s both}
.chart.quiet .area{animation:none}
.chart .guide{stroke:var(--muted);stroke-dasharray:3 3;transition:opacity .15s}
.chart .dot{stroke:var(--surface-solid,var(--surface));stroke-width:2;transition:opacity .15s}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.chart.quiet .bar{animation:none}
.chart .band{fill:var(--hover);opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{display:block}
.donut-bg{fill:none;stroke:var(--hover)}
.seg{fill:none;transition:opacity .2s;cursor:pointer}
.seg.dim{opacity:.22}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:22px;line-height:1.1}.donut-c span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:12.5px}
.dl li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;cursor:default}
.dl i{width:10px;height:10px;border-radius:3px}
.dl em{font-style:normal;color:var(--muted);font-size:11px;min-width:32px;text-align:right}
.ring-bg{fill:none;stroke:var(--hover)}
.ring-fg{fill:none;stroke-linecap:round;animation:ringIn 1.2s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.spark{display:block;overflow:visible}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb-t{height:9px;border-radius:9px;background:var(--hover);overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);border-radius:9px;animation:hbw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hbw{from{width:0}}
.heat{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:10.5px;color:var(--muted)}
.heat i{aspect-ratio:1.5;border-radius:4px;opacity:var(--a);animation:heatIn .5s both;animation-delay:calc(var(--i)*18ms);min-height:12px}
.heat .hx{text-align:center}.heat .hy{padding-right:6px;align-self:center;white-space:nowrap}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}}
/* Page entrance */
.rise{animation:rise .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;translate:0 18px}}
.row-in{animation:rowIn .4s both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes rowIn{from{opacity:0;translate:-6px 0}}
.no-enter .rise,.no-enter .row-in{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* ================= Molara look: clinical white and cerulean, outlined cards, top navigation ================= */
:root{--font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--rb:8px;--ri:8px;--rm:12px;--rp:10px;--rt:8px;
--bg:#f3f7fa;--surface:#fff;--surface2:#f6fafc;--line:#d8e3eb;--text:#0c2233;--muted:#5b7185;--hover:rgba(10,120,170,.07);--accent:#0a86b4;--on-accent:#fff;--ok:#12976f;--warn:#c27a06;--danger:#d6405a;--info:#4d63e0;--field:#fff;
--c1:#0a86b4;--c2:#16b0a0;--c3:#7a6cf0;--c4:#eea23a;--c5:#ea6a78;--c6:#56718a;--enamel:#ffffff;--gum:#f6c9cf;--shadow:0 1px 0 rgba(12,34,51,.04)}
[data-theme="dark"]{--bg:#07121a;--surface:#0d1b26;--surface2:#112433;--line:#1f3546;--text:#dceaf3;--muted:#87a2b6;--hover:rgba(80,200,240,.08);--accent:#2cc0e6;--on-accent:#04202b;--ok:#3fd49c;--warn:#f1b445;--danger:#ff6f86;--info:#8a9cff;--field:#0a1720;
--c1:#2cc0e6;--c2:#33d6c4;--c3:#9d92ff;--c4:#f5b65a;--c5:#ff8593;--c6:#8aa6bd;--enamel:#e9f3f8;--gum:#5b2a36;--toast-bg:#163246}
body{font-size:13.5px}
/* Top navigation */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;height:58px;padding:0 22px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{position:relative;display:flex;gap:2px;height:58px;align-items:stretch;margin-left:10px;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap;transition:color .2s}
.nav a .ic{width:16px;height:16px}
.nav a:hover,.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"] .ic{color:var(--accent)}
.nav-marker{position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .35s}
.top .sp{flex:1}
.menu-btn{display:none}
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 40px;overflow-x:clip}
main{outline:none}
.scrim{display:none}
/* Headings, grid, cards */
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--muted);font-size:12.5px;margin-top:2px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;min-width:0;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 12px 26px -20px rgba(10,60,90,.5)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:14px;font-weight:700}
.ch p{font-size:12px;color:var(--muted)}
.kpi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.kpi .ki{grid-row:span 2;display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--kc) 40%,transparent);color:var(--kc);background:color-mix(in srgb,var(--kc) 9%,transparent)}
.kpi small{color:var(--muted);font-weight:600;font-size:12px}
.kpi b{font-size:24px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .kf{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
/* Chairs */
.chairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chair{border:1.5px solid var(--line);border-radius:10px;padding:12px;position:relative;overflow:hidden;background:var(--surface2)}
.chair.busy{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.chair.busy::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p);background:var(--accent);transition:width 1s linear}
.chair h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.chair b{display:block;font-size:14px;margin-top:6px}
.chair small{color:var(--muted);font-size:12px}
.chair .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:18px;margin-top:4px;display:block}
.chair-svg{width:44px;height:34px;color:var(--muted)}
.chair.busy .chair-svg{color:var(--accent)}
/* Flow board */
.flow{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.fcol{background:var(--surface2);border:1.5px dashed var(--line);border-radius:10px;padding:8px;min-height:180px;display:flex;flex-direction:column;gap:6px;transition:background .2s,border-color .2s}
.fcol h3{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:2px 4px 4px}
.fcol h3 i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fc);margin-right:6px}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-left:3px solid var(--fc);border-radius:8px;padding:8px 9px;font-size:12px;display:grid;gap:3px;transition:transform .2s,box-shadow .2s;animation:rise .45s both}
.fcard:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(0,0,0,.5)}
.fcard b{font-size:12.5px}
.fcard .fr{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted)}
.fcard .mv{border:0;background:none;color:var(--muted);padding:2px;border-radius:6px;display:grid;place-items:center}
.fcard .mv:hover{background:var(--hover);color:var(--text)}
/* Schedule */
.sch-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sch-tools .dt{font-weight:700;min-width:150px;text-align:center}
.sch-wrap{overflow-x:auto}
.sch{display:grid;min-width:640px}
.sch-h{padding:8px;text-align:center;font-weight:700;font-size:12px;border-bottom:1.5px solid var(--line);background:var(--surface)}
.sch-h small{display:block;color:var(--muted);font-weight:500}
.sch-h.today{color:var(--accent)}
.gut{position:relative}.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted)}
.scol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(180deg,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.ap{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 7px;border:1.5px solid color-mix(in srgb,var(--pc) 55%,transparent);background:color-mix(in srgb,var(--pc) 13%,var(--surface));color:var(--text);font-size:11px;text-align:left;overflow:hidden;line-height:1.3;transition:box-shadow .2s,transform .2s}
.ap:hover{z-index:3;box-shadow:0 10px 22px -12px var(--pc);transform:scale(1.02)}
.ap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap span{color:var(--muted);white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.ap.done{opacity:.55}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--pc)}
/* Tooth chart (signature) */
.odo{display:block;width:100%;max-width:560px;margin:0 auto}
.odo .tooth{cursor:pointer;outline:none}
.odo .t-in{transform-box:fill-box;transform-origin:center;animation:toothIn .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*28ms);transition:transform .2s}
.odo .tooth:hover .t-in,.odo .tooth:focus-visible .t-in{transform:scale(1.14)}
.odo .tooth:focus-visible rect{stroke:var(--accent);stroke-width:3}
.odo rect{fill:var(--tf,var(--enamel));stroke:color-mix(in srgb,var(--text) 35%,transparent);stroke-width:1.4;transition:fill .3s}
.odo .groove{fill:none;stroke:color-mix(in srgb,var(--text) 22%,transparent);stroke-width:1.2;pointer-events:none}
.odo .missing rect{fill:transparent;stroke-dasharray:3 3}
.odo .planned rect{stroke:var(--warn);stroke-dasharray:4 2;stroke-width:2}
.odo .num{font-size:10px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.odo .gum{fill:none;stroke:var(--gum);stroke-width:26;stroke-linecap:round;opacity:.55}
.odo .mid{font-size:11px;fill:var(--muted);text-anchor:middle;letter-spacing:.1em}
@keyframes toothIn{from{transform:scale(0) rotate(-20deg);opacity:0}}
.tleg{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:6px}
.tleg i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.4px solid color-mix(in srgb,var(--text) 35%,transparent);margin-right:5px;vertical-align:-2px;background:var(--tf)}
/* Lists, drawer bits */
.list{list-style:none;margin:0;padding:0;display:grid}
.li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}.li b{display:block;font-size:13px}.li small{color:var(--muted);font-size:11.5px;display:block}
.tm2{font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;color:var(--accent);font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:650;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.dlist dt{color:var(--muted)}.dlist dd{margin:0;font-weight:600}
.pf{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pf b{display:block;font-size:15px}.pf small{color:var(--muted)}
/* Plans + supplies */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.steps{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.steps li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.steps li.done span{text-decoration:line-through;color:var(--muted)}
.stp{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;flex:none;transition:all .2s;padding:0}
.stp[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.stp .ic{width:13px;height:13px}
.bar{height:6px;border-radius:6px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--bc,var(--accent));border-radius:6px;animation:hbw .9s both}
.stockc{display:flex;align-items:center;gap:8px;min-width:140px}
.stockc .bar{flex:1}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}.set-row b{display:block}.set-row small{color:var(--muted)}
/* Responsive */
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}.nav a span{display:none}.nav a{padding:0 10px}}
@media (max-width:900px){.menu-btn{display:inline-grid}.nav{position:fixed;top:58px;left:0;right:0;height:auto;flex-direction:column;background:var(--surface);border-bottom:1.5px solid var(--line);padding:8px;margin:0;transform:translateY(-120%);transition:transform .35s cubic-bezier(.2,.9,.25,1);z-index:39}.nav a{padding:11px 12px;border-radius:8px}.nav a span{display:inline}.nav a[aria-current="page"]{background:var(--hover)}body.nav-open .nav{transform:none}.nav-marker{display:none}.scrim{display:block;position:fixed;inset:58px 0 0;background:rgba(5,15,25,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:38}body.nav-open .scrim{opacity:1;pointer-events:auto}.g3,.chairs{grid-template-columns:minmax(0,1fr)}.top-in,.wrap{padding-left:14px;padding-right:14px}.hide-sm{display:none}}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}.brand small{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button type="button" class="icon-btn menu-btn" data-menu aria-label="Open menu" aria-expanded="false" aria-controls="nav"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="2"/><path d="M10.5 7.5c-2.6 0-4 2-4 4.4 0 3 1.5 4.6 2 7.6.5 3 1 5.5 2.3 5.5s1.6-3.6 2.6-5.4c.5-.9 1.7-.9 2.2 0 1 1.8 1.3 5.4 2.6 5.4s1.8-2.5 2.3-5.5c.5-3 2-4.6 2-7.6 0-2.4-1.4-4.4-4-4.4-2 0-3 1-5 1s-3-1-5-1z" style="fill:var(--accent)"/><path d="M12 12c1.2.8 6.8.8 8 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><div>Molara<small>Dental practice</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"><span class="nav-marker" data-axis="x"></span></nav>
    <span class="sp"></span>
    <button type="button" class="icon-btn" data-cmdk aria-label="Search (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5"/></svg></button>
    <button type="button" class="icon-btn" data-bell aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
    <span class="av hide-sm" style="--h:200" title="Dr. Sadia Farooq">SF</span>
  </div>
</header>
<div class="scrim" data-scrim></div>
<div class="wrap"><main id="main" tabindex="-1"></main></div>
<script>
/* ================= Core helpers (router, charts, tables, modals, toasts) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const mq = q => { try { return window.matchMedia(q); } catch (e) { return { matches: false }; } };

/* Reduced motion: CSS removes big motion, JS checks RM before animating */
const RMQ = mq('(prefers-reduced-motion: reduce)');
let RM = !!RMQ.matches;
try { RMQ.addEventListener('change', e => { RM = e.matches; }); } catch (e) {}

/* Tiny event bus */
const BUS = {};
const on = (e, f) => (BUS[e] = BUS[e] || []).push(f);
const emit = (e, d) => (BUS[e] || []).forEach(f => f(d));

/* Seeded random numbers so the demo data looks the same on every visit */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(7);
const seed = s => { rnd = mulberry(s); };
const rand = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

/* Invented people and places */
const FN_M = ['Ahmed', 'Bilal', 'Hamza', 'Usman', 'Ali', 'Zain', 'Faisal', 'Imran', 'Saad', 'Hassan', 'Omar', 'Danish', 'Junaid', 'Kamran', 'Rizwan', 'Tariq', 'Waqas', 'Yasir', 'Fahad', 'Shahzaib', 'Arslan', 'Talha'];
const FN_F = ['Ayesha', 'Fatima', 'Hira', 'Mahnoor', 'Sana', 'Zara', 'Iqra', 'Maryam', 'Noor', 'Amna', 'Sadia', 'Rabia', 'Komal', 'Hina', 'Mehwish', 'Laiba', 'Anam', 'Kiran', 'Sidra', 'Areeba', 'Alina', 'Eman'];
const LN = ['Khan', 'Malik', 'Qureshi', 'Sheikh', 'Butt', 'Chaudhry', 'Raza', 'Siddiqui', 'Hussain', 'Mirza', 'Javed', 'Iqbal', 'Abbasi', 'Baig', 'Rana', 'Awan', 'Shah', 'Ansari', 'Farooq', 'Akhtar', 'Nadeem', 'Haider'];
const CITIES = ['Lahore', 'Karachi', 'Islamabad', 'Rawalpindi', 'Faisalabad', 'Multan', 'Peshawar', 'Sialkot', 'Hyderabad', 'Abbottabad'];
const fullName = (g) => { const f = g ? g === 'F' : chance(.5); return pick(f ? FN_F : FN_M) + ' ' + pick(LN); };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const phone = () => '03' + ri(0, 4) + ri(0, 9) + '-' + ri(1000000, 9999999);
const av = (n, cls = '') => `<span class="av ${cls}" style="--h:${hash(n) % 360}" aria-hidden="true">${esc(initials(n))}</span>`;

/* Number and date formatting */
const NF = new Intl.NumberFormat('en-US');
const num = n => NF.format(Math.round(+n || 0));
const dec = (n, d = 1) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const rs = n => 'Rs ' + num(n);
const usd = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = n => (n < 0 ? '-$' : '$') + num(Math.abs(n));
const short = n => { const a = Math.abs(n), s = (v, u) => (Math.round(v * 10) / 10).toString() + u; return a >= 1e9 ? s(n / 1e9, 'B') : a >= 1e6 ? s(n / 1e6, 'M') : a >= 1e3 ? s(n / 1e3, 'K') : String(Math.round(n * 10) / 10); };
const pct = n => (n > 0 ? '+' : '') + dec(n, 1) + '%';
const FMT = { num, rs, usd, usd0, short, pct, dec1: n => dec(n, 1), raw: n => String(Math.round(n)), rsShort: n => 'Rs ' + short(n), pctPlain: n => Math.round(n) + '%', usdShort: n => '$' + short(n) };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pdate = s => { if (s instanceof Date) return s; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fdate = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fday = s => { const d = pdate(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fshort = s => { const d = pdate(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dayDiff = (a, b) => Math.round((pdate(a) - pdate(b)) / 864e5);
const hm = min => { min = Math.round(min); const h = Math.floor(min / 60) % 24, m = min % 60; return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : Math.floor(s / 86400) + ' d ago'; };

/* Storage that never breaks when the browser blocks it */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* Icons: simple stroke drawings, 24x24 */
const ICONS = {
  home: 'M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10', cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', users: 'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3-6 7-6s7 2 7 6M16 3.5a4 4 0 010 7.5M18 15c2.5.7 4 2.6 4 6',
  user: 'M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7', file: 'M6 2h8l5 5v15H6zM14 2v5h5M9 13h7M9 17h7', pill: 'M10.5 3.5a5 5 0 017 7l-7 7a5 5 0 01-7-7zM7 7l7 7',
  heart: 'M12 20s-8-4.6-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 2.5C20 15.4 12 20 12 20z', chart: 'M3 21h18M6 18v-7M11 18V6M16 18v-4M21 18V9', gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  bell: 'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4', search: 'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5', plus: 'M12 5v14M5 12h14', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12.5l4.5 4.5L19 7',

  const s = revSeries(billR);
  el.innerHTML = `<div class="ph" data-rise><div><h1>Billing</h1><p>Bills, part payments and panel claims</p></div><div class="ph-a">${segc('Range', ['7D', '30D', '12M'], billR)}<button type="button" class="btn primary" data-a="pay">${ic('cash')}Take payment</button></div></div>
  <div class="g g4">${[['Collected this month', sum(mth.map(i => i.paid)), 'rs', 'cash', 'var(--c1)'], ['Billed this month', sum(mth.map(i => i.total)), 'rs', 'file', 'var(--c3)'], ['Outstanding', sum(open.map(due)), 'rs', 'wallet', 'var(--c5)'], ['Open bills', open.length, 'num', 'flag', 'var(--c4)']].map(([l, v, f, i, c]) => `<div class="card kpi" style="--kc:${c}"><span class="ki">${ic(i)}</span><small>${l}</small><b data-count="${v}" data-fmt="${f}">${FMT[f](v)}</b></div>`).join('')}</div>
  <section class="card" style="margin-bottom:14px"><div class="ch"><div><h2>Collections by treatment type</h2><p>Money received, stacked by type</p></div></div><div id="revc"></div></section><section class="card" id="invt"></section>`;
  const args = () => { const r = revSeries(billR); return { labels: r.labels, stacked: true, h: 240, fmt: short, tfmt: rs, series: Object.keys(CATS).map((c, i) => ({ name: c, color: CATS[c], data: r.data[i] })) }; };
  barChart($('#revc', el), args());
  segBind(el, 'seg', v => { billR = v; barChart($('#revc', el), args()); });
  makeTable($('#invt', el), { rows: () => D.invoices.slice().reverse().map(i => ({ ...i, ref: i, name: pat(i.patient).name, st: invStatus(i), bal: due(i), what: i.items.map(x => x.k).join(', ') })), unit: 'bill', units: 'bills', ph: 'Search bill or patient…', keys: ['id', 'name', 'what'], pageSize: 8,
    chips: { k: 'st', opts: ['All', 'Unpaid', 'Partial', 'Paid'] },
    cols: [{ k: 'id', label: 'Bill' }, { k: 'name', label: 'Patient', f: v => `<div class="cellp">${av(v, 'sm')}<b>${esc(v)}</b></div>` }, { k: 'what', label: 'Treatment' }, { k: 'date', label: 'Date', f: v => fshort(v) }, { k: 'total', label: 'Total', num: true, f: v => rs(v) }, { k: 'bal', label: 'Balance', num: true, f: v => v ? `<b style="color:var(--danger)">${rs(v)}</b>` : '0' }, { k: 'st', label: 'Status', f: v => sBadge(v) }, { k: 'x', label: '', sort: false, f: (v, r) => r.bal ? `<button type="button" class="btn sm primary" data-act="pay">Pay</button>` : `<button type="button" class="btn sm ghost" data-act="rcpt">Receipt</button>` }],
    onAct: (a, r) => a === 'pay' ? payForm(r.ref) : toast(`Receipt for ${r.id} printed`), onRow: r => patientDrawer(pat(r.patient), 'bills') });
}

/* ---------- Page: Supplies ---------- */
function pSupplies(el) {
  const low = D.supplies.filter(s => s.stock < s.min), val = sum(D.supplies.map(s => s.stock * s.cost));
  el.innerHTML = `<div class="ph" data-rise><div><h1>Supplies</h1><p>${D.supplies.length} items · stock worth ${rs(val)}</p></div><div class="ph-a"><button type="button" class="btn" data-a="reorder" ${low.length ? '' : 'disabled'}>${ic('refresh')}Reorder ${low.length} low items</button><button type="button" class="btn primary" data-a="additem">${ic('plus')}Add item</button></div></div>
  <div class="g g21"><section class="card" id="stbl"></section><div style="display:grid;gap:14px;align-content:start"><section class="card"><div class="ch"><h2>Stock by type</h2></div><div id="sdn"></div></section><section class="card"><div class="ch"><h2>Orders</h2><span class="badge info">${D.orders.filter(o => o.status !== 'Received').length} open</span></div><ul class="list">${D.orders.slice(0, 6).map(o => `<li class="li"><div class="grow"><b>${o.id} · ${esc(o.sup)}</b><small>${esc(o.items)} · ${rs(o.total)} · ${o.status === 'Received' ? 'arrived' : 'due'} ${fshort(o.eta)}</small></div>${o.status === 'Received' ? sBadge('Received') : `<button type="button" class="btn sm" data-recv="${o.id}">Received</button>`}</li>`).join('')}</ul></section></div></div>`;
  const cats = [...new Set(D.supplies.map(s => s.cat))];
  donut($('#sdn', el), { data: cats.map((c, i) => ({ label: c, value: sum(D.supplies.filter(s => s.cat === c).map(s => s.stock * s.cost)), color: `var(--c${i + 1})` })), fmt: v => 'Rs ' + short(v), size: 140, thick: 16, center: { value: val, label: 'stock value', fmt: 'rsShort' } });
  makeTable($('#stbl', el), { rows: () => D.supplies, unit: 'item', units: 'items', ph: 'Search supplies…', keys: ['name', 'cat', 'sup'], pageSize: 9, sort: 'name',
    chips: { k: 'cat', opts: ['All', 'Low stock', ...cats], test: (r, c) => c === 'Low stock' ? r.stock < r.min : r.cat === c },
    cols: [{ k: 'name', label: 'Item', f: (v, r) => `<b>${esc(v)}</b><br><small class="muted">${esc(r.unit)} · ${esc(r.sup)}</small>` }, { k: 'stock', label: 'Stock', f: (v, r) => `<div class="stockc"><span style="min-width:22px;font-weight:700;color:${v < r.min ? 'var(--danger)' : 'inherit'}">${v}</span><div class="bar"><i style="--w:${clamp(v / r.max * 100, 2, 100).toFixed(0)}%;--bc:${v < r.min ? 'var(--danger)' : v < r.min * 1.5 ? 'var(--warn)' : 'var(--ok)'}"></i></div></div>` }, { k: 'min', label: 'Min', num: true }, { k: 'cost', label: 'Cost', num: true, f: v => rs(v) }, { k: 'x', label: '', sort: false, f: () => `<div style="display:flex;gap:4px;justify-content:flex-end"><button type="button" class="btn sm ghost" data-act="use" aria-label="Use one">−1</button><button type="button" class="btn sm" data-act="add">Restock</button></div>` }],
    onAct: (a, r) => { if (a === 'use') { if (!r.stock) { toast('None left to use', 'err'); return; } r.stock--; save(); if (r.stock === r.min - 1) addNote(`${r.name} dropped below minimum`, 'warn'); toast(`${r.name}: ${r.stock} left`, r.stock < r.min ? 'warn' : 'ok'); refresh(); } else formModal({ title: `Restock ${r.name}`, submit: 'Add stock', values: { qty: r.max - r.stock > 0 ? r.max - r.stock : 5 }, fields: [{ k: 'qty', label: `How many (${r.unit})`, type: 'number', min: 1, max: 999, req: true }], onSubmit(v) { r.stock += v.qty; save(); toast(`${r.name}: ${r.stock} in stock`); refresh(); } }); } });
}

/* ---------- Page: Reports ---------- */
function pReports(el) {
  const m12 = Array.from({ length: 12 }, (_, i) => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 11 + i, 1); return MON[d.getMonth()]; });
  const tot = D.hist.map(h => h.Preventive + h.Restorative + h.Surgery + h.Cosmetic).concat(sum(D.invoices.filter(x => x.date.slice(0, 7) === mkey(TODAY)).map(x => x.paid)));
  const last30 = D.appts.filter(a => a.date >= iso(addDays(TODAY, -30)) && a.date < iso(TODAY) && a.status === 'Done');
  const days = [1, 2, 3, 4, 5, 6];
  el.innerHTML = `<div class="ph" data-rise><div><h1>Reports</h1><p>Practice performance at a glance</p></div><div class="ph-a"><button type="button" class="btn" data-a="export">${ic('download')}Export</button></div></div>
  <div class="g g21"><section class="card"><div class="ch"><div><h2>Collections, 12 months</h2><p>All treatment types</p></div></div><div id="r1"></div></section><section class="card"><div class="ch"><h2>Treatments, last 30 days</h2></div><div id="r2"></div></section></div>
  <div class="g g2"><section class="card"><div class="ch"><div><h2>Chair use by weekday</h2><p>Share of opening hours booked, last 30 days</p></div></div>${heatHTML(CHAIRS, days.map(d => DOW[d]), (r, c) => { const list = D.appts.filter(a => a.chair === CHAIRS[r] && pdate(a.date).getDay() === days[c] && a.date >= iso(addDays(TODAY, -30)) && a.date < iso(TODAY)); const n = new Set(list.map(a => a.date)).size || 1; return Math.round(sum(list.map(a => a.dur)) / n / (CLOSE - OPEN) * 100); }, { f: v => v + '% booked', color: 'var(--c1)', label: 'Chair use' })}</section>
  <section class="card"><div class="ch"><div><h2>Production by dentist</h2><p>Treatment value, last 30 days</p></div></div>${hbars(D.dentists.map((d, i) => ({ label: d.name, value: sum(last30.filter(a => a.dentist === d.id).map(a => proc(a.proc).price)), color: `var(--c${i + 1})` })), v => 'Rs ' + short(v))}<div class="ch" style="margin-top:16px"><h2>New patients</h2></div><div id="r3"></div></section></div>`;
  lineChart($('#r1', el), { labels: m12, series: [{ name: 'Collected', data: tot, color: 'var(--c1)' }], h: 230, fmt: short, tfmt: rs });
  const pc = PROCS.map(p => ({ label: p.k, value: last30.filter(a => a.proc === p.k).length, color: CATS[p.cat] })).filter(x => x.value).sort((a, b) => b.value - a.value).slice(0, 6);
  donut($('#r2', el), { data: pc.map((x, i) => ({ ...x, color: `var(--c${i + 1})` })), size: 150, thick: 18, center: { value: last30.length, label: 'treatments' } });
  barChart($('#r3', el), { labels: m12, series: [{ name: 'New patients', data: D.hist.map(h => h.newp).concat(D.patients.filter(p => p.since.slice(0, 7) === mkey(TODAY)).length), color: 'var(--c2)' }], h: 150, fmt: v => String(Math.round(v)) });
}

/* ---------- Page: Settings ---------- */
function pSettings(el) {
  el.innerHTML = `<div class="ph" data-rise><div><h1>Settings</h1><p>Clinic details, team and demo data</p></div></div><div class="g g2">
  <section class="card"><div class="ch"><h2>Clinic</h2></div><form class="frm" id="cf" novalidate>${fieldHTML({ k: 'name', label: 'Clinic name', req: true }, D.clinic.name)}${fieldHTML({ k: 'city', label: 'City', half: true }, D.clinic.city)}${fieldHTML({ k: 'phone', label: 'Phone', type: 'tel', half: true }, D.clinic.phone)}${fieldHTML({ k: 'hours', label: 'Opening hours' }, D.clinic.hours)}<div><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card"><div class="ch"><h2>Team</h2><button type="button" class="btn sm" data-a="adddent">${ic('plus')}Add dentist</button></div><ul class="list">${D.dentists.map(d => `<li class="li">${av(d.name, 'sm')}<div class="grow"><b>${esc(d.name)}</b><small>${esc(d.role)} · ${D.appts.filter(a => a.dentist === d.id && a.date >= iso(TODAY)).length} upcoming</small></div>${D.dentists.length > 1 ? `<button type="button" class="btn sm ghost" data-deldent="${d.id}" aria-label="Remove ${esc(d.name)}">${ic('trash')}</button>` : ''}</li>`).join('')}</ul></section></div>
  <section class="card"><div class="set-row"><div><b>Theme</b><small>Clinic white or night shift. Add ?theme=dark to the address to force it.</small></div><button type="button" class="btn" data-theme-toggle="1"></button></div><div class="set-row"><div><b>Reset demo data</b><small>Brings back the sample patients, bookings and bills.</small></div><button type="button" class="btn danger" data-a="reset">${ic('refresh')}Reset demo data</button></div></section>`;
  syncThemeBtns();
  $('#cf', el).onsubmit = e => { e.preventDefault(); const f = e.target, n = f.elements.name; if (!n.value.trim()) { n.setAttribute('aria-invalid', 'true'); $('#' + n.id + '-e').textContent = 'Clinic name is required'; return; } n.removeAttribute('aria-invalid'); $('#' + n.id + '-e').textContent = ''; ['name', 'city', 'phone', 'hours'].forEach(k => D.clinic[k] = f.elements[k].value.trim()); save(); toast('Clinic details saved'); };
  el.addEventListener('click', e => { const b = e.target.closest('[data-deldent]'); if (!b) return; const d = dent(b.dataset.deldent); confirmBox(`Remove ${d.name}? Their future bookings move to ${D.dentists.find(x => x !== d).name}.`, () => { const to = D.dentists.find(x => x !== d); D.appts.forEach(a => { if (a.dentist === d.id) a.dentist = to.id; }); D.dentists = D.dentists.filter(x => x !== d); save(); toast(`${d.name} removed`, 'warn'); refresh(); }, { yes: 'Remove' }); });
}

/* ---------- Shell ---------- */
const ROUTES = [
  { id: 'today', label: 'Today', icon: 'home', render: pToday }, { id: 'appointments', label: 'Appointments', icon: 'cal', render: pAppts }, { id: 'patients', label: 'Patients', icon: 'users', render: pPatients },
  { id: 'plans', label: 'Plans', icon: 'clip', render: pPlans }, { id: 'billing', label: 'Billing', icon: 'wallet', render: pBilling }, { id: 'supplies', label: 'Supplies', icon: 'box', render: pSupplies },
  { id: 'reports', label: 'Reports', icon: 'chart', render: pReports }, { id: 'settings', label: 'Settings', icon: 'gear', render: pSettings }
];
$('#nav').insertAdjacentHTML('beforeend', ROUTES.map(r => `<a href="#/${r.id}" data-route="${r.id}">${ic(r.icon)}<span>${r.label}</span></a>`).join(''));
document.addEventListener('click', e => {
  const t = e.target;
  const mv = t.closest('[data-mvst]'); if (mv) { const a = D.appts.find(x => x.id === mv.dataset.mvst); menu(mv, STAGES.map(([s]) => ({ label: s, disabled: s === stage(a) })), o => moveStage(a, o.label), 'Move to stage'); return; }
  const fc = t.closest('.fcard'); if (fc && !t.closest('button')) { patientDrawer(pat(D.appts.find(x => x.id === fc.dataset.ap).patient)); return; }
  const st = t.closest('[data-step]'); if (st) { const [pid, i] = st.dataset.step.split('|'), pl = D.plans.find(p => p.id === pid), s = pl.steps[+i]; s.done = !s.done; const n = pl.steps.filter(x => x.done).length; pl.status = n === pl.steps.length ? 'Completed' : n ? 'In progress' : pl.status === 'Proposed' ? 'Proposed' : 'Accepted'; save(); toast(`${s.k} ${s.done ? 'done' : 'reopened'}${pl.status === 'Completed' ? ' · plan completed' : ''}`); refresh(); return; }
  const ac = t.closest('[data-acc]'); if (ac) { const pl = D.plans.find(p => p.id === ac.dataset.acc); pl.status = 'Accepted'; save(); toast(`${pat(pl.patient).name} accepted the plan`); addNote(`${pl.id} accepted · ${rs(sum(pl.steps.map(s => s.price)))}`, 'ok'); refresh(); return; }
  const as = t.closest('[data-addstep]'); if (as) { const pl = D.plans.find(p => p.id === as.dataset.addstep); formModal({ title: 'Add a step', submit: 'Add step', values: { k: 'Filling' }, fields: [{ k: 'k', label: 'Treatment', type: 'select', opts: D.procs.map(p => p.k) }, { k: 'tooth', label: 'Tooth number (optional)', type: 'number', min: 1, max: 32 }], onSubmit(v) { pl.steps.push({ k: v.k, tooth: v.tooth || null, price: proc(v.k).price, done: false }); if (pl.status === 'Completed') pl.status = 'In progress'; save(); toast(`${v.k} added to ${pl.id}`); refresh(); } }); return; }
  const dp = t.closest('[data-delplan]'); if (dp) { confirmBox('Delete this treatment plan?', () => { D.plans = D.plans.filter(p => p.id !== dp.dataset.delplan); save(); toast('Plan deleted', 'warn'); refresh(); }); return; }
  const rv = t.closest('[data-recv]'); if (rv) { const o = D.orders.find(x => x.id === rv.dataset.recv); o.status = 'Received'; (o.lines || []).forEach(([id, q]) => { const s = D.supplies.find(x => x.id === id); if (s) s.stock += q; }); save(); toast(`${o.id} received and added to stock`); refresh(); return; }
  const b = t.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'appt') apptForm(null); else if (a === 'patient') patientForm(null); else if (a === 'pay') payForm(null);
  else if (a === 'plan') formModal({ title: 'New treatment plan', submit: 'Create plan', values: { k1: 'Check-up', k2: 'Filling' }, fields: [{ k: 'patient', label: 'Patient', type: 'select', req: true, opts: [{ v: '', l: 'Choose a patient' }, ...D.patients.map(p => ({ v: p.id, l: p.name }))] }, { k: 'title', label: 'Plan title', req: true, ph: 'e.g. Two fillings and cleaning' }, { k: 'k1', label: 'First step', type: 'select', half: true, opts: D.procs.map(p => p.k) }, { k: 'k2', label: 'Second step', type: 'select', half: true, opts: [{ v: '', l: 'None' }, ...D.procs.map(p => p.k)] }], onSubmit(v) { D.plans.unshift({ id: 'TP-' + (50 + D.plans.length), patient: v.patient, title: v.title, status: 'Proposed', created: iso(TODAY), steps: [v.k1, v.k2].filter(Boolean).map(k => ({ k, tooth: null, price: proc(k).price, done: false })) }); save(); toast('Plan created and ready to share'); refresh(); } });
  else if (a === 'reorder') { const low = D.supplies.filter(s => s.stock < s.min), by = {}; low.forEach(s => (by[s.sup] = by[s.sup] || []).push(s)); Object.entries(by).forEach(([sup, items]) => D.orders.unshift({ id: 'PO-' + (312 + D.orders.length), sup, items: items.map(s => `${s.name} × ${s.max - s.stock}`).join(', '), lines: items.map(s => [s.id, s.max - s.stock]), eta: iso(addDays(TODAY, 3)), status: 'Ordered', total: sum(items.map(s => (s.max - s.stock) * s.cost)) })); save(); toast(`${Object.keys(by).length} purchase orders sent for ${low.length} items`); addNote(`Reorder sent for ${low.length} low items`, 'info'); refresh(); }
  else if (a === 'additem') formModal({ title: 'Add a supply item', submit: 'Add item', values: { cat: 'Consumables', stock: 10, min: 5, cost: 1000 }, fields: [{ k: 'name', label: 'Name', req: true }, { k: 'cat', label: 'Type', type: 'select', half: true, opts: ['Consumables', 'Anaesthetics', 'Instruments', 'Hygiene', 'Lab'] }, { k: 'unit', label: 'Unit', half: true, req: true, ph: 'e.g. box of 50' }, { k: 'stock', label: 'In stock', type: 'number', min: 0, max: 9999, req: true, half: true }, { k: 'min', label: 'Minimum', type: 'number', min: 0, max: 9999, req: true, half: true }, { k: 'cost', label: 'Cost (Rs)', type: 'number', min: 0, req: true, half: true }, { k: 'sup', label: 'Supplier', half: true, req: true }], onSubmit(v) { D.supplies.unshift({ id: 'S' + (200 + D.supplies.length), ...v, max: Math.max(v.min * 3, v.stock) }); save(); toast(`${v.name} added`); refresh(); } });
  else if (a === 'adddent') formModal({ title: 'Add a dentist', submit: 'Add', fields: [{ k: 'name', label: 'Name', req: true, ph: 'Dr. …' }, { k: 'role', label: 'Role', req: true, ph: 'e.g. Orthodontist' }], onSubmit(v) { D.dentists.push({ id: 'd' + uid(), ...v }); save(); toast(`${v.name} joined the team`); refresh(); } });
  else if (a === 'export') toast(`Report exported: ${D.invoices.length} bills, ${D.appts.length} appointments`);
  else if (a === 'reset') confirmBox('Put back the original sample data? Your changes will be lost.', () => { store.del(KEY); D = makeData(); seedFlow(); save(); toast('Demo data reset'); refresh(); }, { yes: 'Reset data' });
});
CMDK = () => [...ROUTES.map(r => ({ label: r.label, hint: 'Page', icon: r.icon, run: () => ROUTER.go(r.id) })), { label: 'New appointment', hint: 'Action', icon: 'plus', run: () => apptForm(null) }, { label: 'New patient', hint: 'Action', icon: 'user', run: () => patientForm(null) }, { label: 'Take payment', hint: 'Action', icon: 'cash', run: () => payForm(null) }, { label: 'Toggle theme', hint: 'Action', icon: 'moon', run: toggleTheme }, ...D.patients.map(p => ({ label: p.name, hint: 'Patient · ' + p.phone, icon: 'user', run: () => patientDrawer(p) }))];

/* Start */
initTheme('molara', '');
const lowS = D.supplies.filter(s => s.stock < s.min); if (lowS.length) addNote(`${lowS.length} supplies are below minimum stock`, 'warn', new Date(Date.now() - 18e5));
const unp = D.invoices.filter(i => due(i) > 0); if (unp.length) addNote(`${unp.length} bills still have a balance`, 'danger', new Date(Date.now() - 72e5));
addNote(`${todayAppts().length} patients booked for today`, 'info', new Date(Date.now() - 3e7));
save();
startRouter({ routes: ROUTES, main: $('#main'), def: 'today', title: 'Molara' });
</script>
</body>
</html>
