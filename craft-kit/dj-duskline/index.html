<!doctype html>
<!-- Chill & Craft · Duskline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duskline · smart home in smoked glass</title>
<style>
/* ===== Core: reset, charts, toasts, modals, tables (theme comes from variables) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:var(--bg);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--focus,var(--acc));outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:200;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 46%);flex:none}
/* entrance */
.cc-in{animation:var(--enter,ccRise) .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes ccRise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes ccFade{from{opacity:0}}
/* charts */
.cc-chart{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.cc-grid{stroke:var(--grid,var(--line));stroke-width:1}
.cc-ax{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.cc-line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ccDraw 1.3s cubic-bezier(.45,0,.2,1) forwards}
@keyframes ccDraw{to{stroke-dashoffset:0}}
.cc-area{animation:ccFade 1s .35s both}
.cc-guide{stroke:var(--mut);stroke-dasharray:3 3;pointer-events:none}
.cc-dots{pointer-events:none}.cc-dots circle{stroke:var(--card-solid,#fff);stroke-width:2}
.cc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ccGrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes ccGrow{from{transform:scaleY(0)}}
.cc-col{fill:var(--fg);fill-opacity:0;transition:fill-opacity .15s}.cc-col:hover{fill-opacity:.06}
.cc-seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke-width .2s}
.cc-seg:hover{stroke-width:calc(var(--th) + 5px)!important}
.cc-cell{animation:ccFade .5s both;animation-delay:calc(var(--i,0) * 7ms)}
.cc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.cc-legend i,.cc-tip i,.cc-dleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none}
.cc-tip{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:240px}
.cc-tip b{font-weight:700}
.cc-empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:14px}
.cc-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cc-donut-w{position:relative;flex:none}
.cc-donut-w svg{display:block}
.cc-donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.cc-donut-c b{font-size:20px;line-height:1.1}.cc-donut-c span{font-size:11px;color:var(--mut)}
.cc-dleg{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1;min-width:150px;font-size:13px}
.cc-dleg li{display:flex;align-items:center;gap:4px}.cc-dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cc-dleg em{font-style:normal;color:var(--mut);width:38px;text-align:right}
.cc-gauge{position:relative;margin:auto}.cc-gauge svg{display:block}
.cc-gv{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.cc-gauge-c{position:absolute;inset:0 0 10% 0;display:grid;place-content:center;text-align:center}
.cc-gauge-c b{font-size:24px;line-height:1.1}.cc-gauge-c span{font-size:11px;color:var(--mut)}
.cc-hbars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cc-hbars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.cc-hbars i{grid-column:1/-1;height:7px;border-radius:9px;background:var(--track,var(--line));overflow:hidden}
.cc-hbars em{display:block;height:100%;width:var(--w);border-radius:inherit;animation:ccBarW .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes ccBarW{from{width:0}}
.cc-ringv{animation:ccRing 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ccRing{from{stroke-dasharray:0 var(--c)}}
/* toasts */
.cc-toasts{position:fixed;z-index:1001;bottom:16px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.cc-toast{pointer-events:auto;background:var(--tipbg,#15171c);color:var(--tipfg,#fff);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;animation:ccToast .38s cubic-bezier(.2,.8,.2,1)}
.cc-toast .ic{width:18px;height:18px;color:var(--ok,#3c9)}.cc-toast.bad .ic{color:var(--bad,#e55)}
.cc-toast.out{opacity:0;transform:translateY(8px);transition:.25s}
.cc-toast button{background:none;border:0;color:var(--tipacc,var(--acc));font-weight:700;padding:0 0 0 6px}
@keyframes ccToast{from{opacity:0;transform:translateY(14px) scale(.95)}}
/* modal and drawer */
.cc-back{position:fixed;inset:0;z-index:900;background:var(--scrim,rgba(8,10,14,.5));display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .22s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cc-back.cc-on{opacity:1}.cc-back.cc-out{opacity:0;pointer-events:none}
.cc-modal{background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:var(--rm,16px);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:none}
.cc-on .cc-modal{transform:none}
.cc-small{width:min(420px,100%)}
.cc-drawer-back{place-items:stretch end;padding:0}
.cc-drawer{width:min(460px,100%);height:100%;max-height:none;border-radius:var(--rm,16px) 0 0 var(--rm,16px);transform:translateX(100%)}
.cc-mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px;position:sticky;top:0;background:inherit;z-index:2}
.cc-mhead h2{margin:0;font-size:18px;line-height:1.25}
.cc-x{background:none;border:0;padding:6px;border-radius:10px;display:grid;color:var(--mut)}
.cc-x:hover{background:var(--hover)}
.cc-mbody{padding:8px 20px 20px}
.cc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cc-confirm{margin:4px 0 0;color:var(--mut)}
.cc-hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.cc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cc-field.full{grid-column:1/-1}
.cc-field label{font-size:12px;font-weight:600;color:var(--mut)}
.cc-field input,.cc-field select,.cc-field textarea{border:1px solid var(--line);background:var(--inp,transparent);border-radius:var(--ri,10px);padding:9px 11px;min-width:0;width:100%}
.cc-field select option{background:var(--card-solid,#fff);color:var(--fg)}
.cc-field [aria-invalid=true]{border-color:var(--bad,#e55)}
.cc-err{color:var(--bad,#e55);font-size:12px}
.cc-err:empty{display:none}
.cc-shake{animation:ccShake .38s}
@keyframes ccShake{25%{translate:-7px 0}75%{translate:7px 0}}
@media (max-width:520px){.cc-fields{grid-template-columns:1fr}.cc-drawer{border-radius:0}}
/* table */
.cc-ttools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cc-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:1 1 180px;max-width:320px;color:var(--mut);background:var(--inp,transparent)}
.cc-search .ic{width:16px;height:16px}
.cc-search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--fg)}
.cc-search:focus-within{outline:2px solid var(--focus,var(--acc));outline-offset:1px}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap}
.cc-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);transition:background .2s,color .2s,border-color .2s}
.cc-chip:hover{color:var(--fg)}
.cc-chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.cc-twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.cc-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.cc-table th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.cc-table th button:focus-visible{outline:2px solid var(--focus,var(--acc))}
.cc-sort::after{content:"\2195";opacity:.35;font-style:normal}
[aria-sort=ascending] .cc-sort::after{content:"\2191";opacity:1}
[aria-sort=descending] .cc-sort::after{content:"\2193";opacity:1}
.cc-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.cc-table .num{text-align:right;font-variant-numeric:tabular-nums}
.cc-table th.num button{flex-direction:row-reverse}
.cc-click{cursor:pointer;transition:background .15s}.cc-click:hover{background:var(--hover)}
.cc-pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.cc-pager div{display:flex;gap:6px}
/* popovers, menus, bell */
.cc-pop{position:fixed;z-index:950;background:var(--modal,var(--card-solid,#fff));color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);min-width:220px;max-width:min(340px,calc(100vw - 16px));opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s}
.cc-pop.cc-on{opacity:1;transform:none}
.cc-menu{display:flex;flex-direction:column;padding:6px;max-height:60vh;overflow:auto}
.cc-menu-t{font-size:12px;color:var(--mut);padding:6px 10px}
.cc-menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}
.cc-menu button:hover,.cc-menu button:focus{background:var(--hover)}
.cc-bell{width:320px;max-width:100%}
.cc-bell-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cc-bell ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.cc-bell li button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px;border-radius:10px;font-size:13px;align-items:flex-start}
.cc-bell li button:hover{background:var(--hover)}
.cc-bell li.unread button{font-weight:600}
.cc-bell li.unread button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin:6px 0 0 auto;flex:none}
.cc-bell small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.cc-link{background:none;border:0;color:var(--acc);font-size:12px;font-weight:600;padding:2px}
.cc-clear{display:block;margin:0 auto 10px}
.cc-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad,#e5484d);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;animation:ccPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes ccPop{from{transform:scale(0)}}
/* range switch */
.cc-seg{position:relative;display:inline-flex;background:var(--seg,var(--hover));border-radius:999px;padding:3px;flex:none}
.cc-seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut);border-radius:999px;transition:color .2s}
.cc-seg button[aria-pressed=true]{color:var(--segfg,var(--fg))}
.cc-seg-ind{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:999px;background:var(--segind,var(--card-solid,#fff));box-shadow:0 1px 5px rgba(0,0,0,.16);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s}
/* drag and drop */
.cc-ghost{opacity:.94;box-shadow:0 22px 44px rgba(0,0,0,.32)!important;animation:none!important;transition:none!important}
.cc-dragging{opacity:.35}
.cc-over{outline:2px dashed var(--acc)!important;outline-offset:-3px}
.cc-dragmode,.cc-dragmode *{cursor:grabbing!important;user-select:none}
/* command search */
.cc-cmdk{width:min(560px,100%);align-self:start;margin-top:10vh}
.cc-cmdk-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--inp,transparent);outline:none}
.cc-cmdk-list{list-style:none;margin:10px 0 0;padding:0}
.cc-cmdk-list button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.cc-cmdk-list [aria-selected=true] button{background:var(--hover);color:var(--acc)}
.cc-hidden *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.cc-draw{stroke-dashoffset:0}}
/* ===== Smart-home kit: drawn rooms, cameras, thermostat dial (colours from variables) ===== */
.room-art{display:block;width:100%;height:100%}
.ra-wall{fill:var(--ra-wall,#e9e1d6)}.ra-floor{fill:var(--ra-floor,#c9a985)}.ra-board{stroke:var(--ra-board,rgba(0,0,0,.08));stroke-width:2;fill:none}.ra-skirt{fill:var(--ra-skirt,#fff)}
.ra-sky{fill:var(--ra-sky,#a9cbe6);transition:fill .8s}.ra-frame{stroke:var(--ra-frame,#fff);stroke-width:6;fill:none}
.ra-curtain{fill:var(--ra-curtain,#d9c7b0)}.ra-art{fill:var(--ra-art,#f4efe6)}.ra-acc{fill:var(--ra-acc,#d98a5b)}
.ra-tv{fill:#16181c;transition:fill .6s}.ra-tv.on{fill:var(--ra-screen,#5d86b5)}
.ra-wood{fill:var(--ra-wood,#9b6f4a);stroke:var(--ra-wood,#9b6f4a)}.ra-rug{fill:var(--ra-rug,#cdb89c)}.ra-fab{fill:var(--ra-fab,#7d8f9b)}.ra-fab2{fill:var(--ra-fab2,#93a5b0)}
.ra-metal{stroke:var(--ra-metal,#3c3c3c);stroke-width:5;fill:none;stroke-linecap:round}.ra-metal2{fill:var(--ra-metal,#3c3c3c)}.ra-dark{fill:#222}
.ra-shade{fill:var(--ra-shade,#f3e5c8)}.ra-tile{fill:var(--ra-tile,#dfe6e3)}
.ra-pot{fill:var(--ra-pot,#b8643f)}.ra-leaf{stroke:var(--ra-leaf,#4f7d45);stroke-width:10;fill:none;stroke-linecap:round}
.ra-glow{opacity:var(--glow,0);transition:opacity .7s}
.ra-dim{fill:#070a12;opacity:calc((1 - var(--glow,0)) * var(--dim,.42));transition:opacity .7s;pointer-events:none}
/* cameras */
.cam{position:relative;overflow:hidden;aspect-ratio:16/9;background:#1b1d22;isolation:isolate;border-radius:inherit}
.cam-art,.cam-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cam-art{transition:filter .5s;filter:var(--camf,none)}
.cam.night .cam-art{filter:grayscale(1) brightness(1.2) contrast(1.3) sepia(.6) hue-rotate(55deg)}
.cam.paused .cam-art{filter:grayscale(1) blur(2px) brightness(.55)}
.cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
.cam-ov{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff;z-index:2}
.cam-rec,.cam-t{background:rgba(0,0,0,.42);padding:2px 7px;border-radius:5px;display:flex;align-items:center;gap:5px}
.cam-rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff4d4d;animation:camBlink 1.4s steps(2) infinite}
.paused .cam-rec::before{background:#aaa;animation:none}
.cam-n{position:absolute;left:10px;bottom:8px;z-index:2;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.cam-flash.go{animation:camFlash .55s ease-out}
@keyframes camFlash{0%{opacity:.95}100%{opacity:0}}
@keyframes camBlink{50%{opacity:0}}
.ca-car{animation:caDrive 14s linear infinite}
@keyframes caDrive{0%{transform:translateX(-120px)}55%,100%{transform:translateX(420px)}}
.ca-cat{animation:caWalk 17s linear infinite}
@keyframes caWalk{0%{transform:translateX(-40px)}60%,100%{transform:translateX(370px)}}
.ca-sway{animation:caSway 5s ease-in-out infinite alternate}
@keyframes caSway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.ca-swing{animation:caSwing 3.2s ease-in-out infinite alternate}
@keyframes caSwing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ca-spin{animation:caMob 6s ease-in-out infinite alternate}
@keyframes caMob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.ca-blink{animation:caGlow 3s ease-in-out infinite alternate}
@keyframes caGlow{from{opacity:.35}to{opacity:1}}
.ca-flick{animation:caFlick 7s steps(1) infinite}
@keyframes caFlick{0%,92%,96%{opacity:1}94%,98%{opacity:.3}}
.cam-modal{width:min(780px,100%)}
.camv .cam{border-radius:12px}
.camv-ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.camv-ctl [aria-pressed=true]{background:var(--acc);color:var(--onacc,#fff);border-color:var(--acc)}
.camv-h{font-size:14px;margin:10px 0 8px}
.camv-ev{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.camv-ev li{display:flex;gap:12px}.camv-ev time{color:var(--mut);font-variant-numeric:tabular-nums}
/* thermostat dial */
.dial{position:relative;display:inline-block;touch-action:none;border-radius:50%;outline-offset:4px;max-width:100%}
.dial svg{display:block;max-width:100%;height:auto;cursor:grab;overflow:visible}
.dial.drag svg{cursor:grabbing}
.dl-tick{stroke:var(--mut);stroke-width:1.4;opacity:.45}.dl-tick.maj{stroke-width:2.4;opacity:.85}
.dl-track{fill:none;stroke:var(--track,var(--line));stroke-width:var(--dlw,14px);stroke-linecap:round}
.dl-val{fill:none;stroke-width:var(--dlw,14px);stroke-linecap:round}
.dl-knob{fill:var(--knob,#fff);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));transition:r .15s}
.dial.drag .dl-knob{r:15px}
.dl-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dl-v{font-size:46px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dl-l{display:block;font-size:12px;color:var(--mut);margin-top:6px}
/* ===== Duskline look: smoked glass over black-and-white rooms, one blue accent ===== */
:root{--acc:#4b8dff;--onacc:#fff;--focus:#7fb0ff;--ok:#4b8dff;--bad:#ff6b6b;--warn:#c9c9c9;
--c1:#4b8dff;--c2:#d6d9de;--c3:#8a9099;--c4:#2a5bd7;--c5:#5d636c;--dial1:#9dc0ff;--dial2:#4b8dff;
--bg:#0b0c0e;--fg:#f2f3f5;--mut:#9aa0a8;--line:rgba(255,255,255,.1);--grid:rgba(255,255,255,.07);--hover:rgba(255,255,255,.07);--track:rgba(255,255,255,.12);
--glass:rgba(20,21,24,.55);--glass2:rgba(255,255,255,.06);--edge:rgba(255,255,255,.12);--card-solid:#16171a;--modal:rgba(22,23,26,.92);--inp:rgba(255,255,255,.05);
--tipbg:#f2f3f5;--tipfg:#0b0c0e;--tipacc:#2a5bd7;--veil:linear-gradient(180deg,rgba(6,7,9,.55),rgba(6,7,9,.86));--rm:18px;--ri:10px;--enter:dkIn;--knob:#f2f3f5;

@keyframes dkIn{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
body{background:var(--bg);font-feature-settings:"tnum"}
/* backdrop: two B&W room layers that crossfade */
.bd{position:fixed;inset:0;z-index:0;overflow:hidden;background:#111}
.bd-l{position:absolute;inset:-20px;opacity:0;transition:opacity 1.1s ease,transform 8s ease;filter:grayscale(1) contrast(1.08) blur(1.5px);transform:scale(1.04)}
.bd-l.on{opacity:1;transform:scale(1)}
.bd::after{content:"";position:absolute;inset:0;background:var(--veil)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(.7);backdrop-filter:blur(22px) saturate(.7);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge)}
/* icon rail */
.rail{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0;z-index:20}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--fg);text-decoration:none}
.logo svg{width:34px;height:34px}
.nav{position:relative;display:flex;flex-direction:column;gap:6px;align-items:center}
.nav a{position:relative;z-index:1;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:var(--mut);transition:color .2s,background .2s}
.nav a:hover{color:var(--fg);background:var(--hover)}
.nav a[aria-current=page]{color:#fff}
.nav a span{display:none}
.nav-marker{position:absolute;left:0;top:0;border-radius:15px;background:var(--acc);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 26px -4px var(--acc);transition:transform .5s cubic-bezier(.3,1.25,.4,1),width .3s,height .3s}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.main{min-width:0;overflow-x:clip;padding:12px 20px 40px 18px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 16px}
.top .house b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.top .house small{color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top .sp{flex:1}
.pillx{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;color:var(--mut)}
.pillx b{color:var(--fg);font-weight:600}
.ib{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--fg);transition:transform .15s,background .2s}
.ib:hover{background:var(--hover)}.ib:active{transform:scale(.92)}
[data-theme=dark] .ib .sun,[data-theme=light] .ib .moon{display:none}
.menu{display:none}
.avs{display:flex}.avs .av{width:30px;height:30px;border:2px solid var(--bg);margin-left:-8px;font-size:11px}
.av{background:hsl(var(--h) 0% 38%)}
/* cards */
.card{border-radius:22px;padding:18px;min-width:0;position:relative;transition:translate .3s,box-shadow .3s,border-color .3s}
.card:hover{translate:0 -3px;border-color:rgba(75,141,255,.35)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl a{color:var(--acc);text-decoration:none;letter-spacing:.06em}
.big{font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1}
.big small{font-size:15px;color:var(--mut);margin-left:4px;letter-spacing:0}
.g{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:9px 15px;font-weight:600;font-size:14px;color:var(--fg);transition:transform .12s,background .2s,border-color .2s}
.btn:hover{background:var(--hover);border-color:var(--edge)}.btn:active{transform:scale(.95)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 24px -10px var(--acc)}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}.btn .ic{width:17px;height:17px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.sw{width:46px;height:26px;border-radius:99px;background:var(--track);border:1px solid var(--line);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked=true]{background:var(--acc);border-color:var(--acc)}.sw[aria-checked=true]::after{transform:translateX(20px)}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--acc) calc(var(--lv,.5) * 100%),var(--track) 0);outline-offset:6px}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
input[type=range].rng::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
/* home hero */
.homeg{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.hero{min-height:440px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.25));border:1px solid var(--line);overflow:hidden}
[data-theme=light] .hero{background:linear-gradient(180deg,transparent 30%,rgba(255,255,255,.35))}
.hero h1{font-size:46px;font-weight:300;letter-spacing:-.035em;margin:2px 0 6px;line-height:1}
.hero .stat{display:flex;gap:18px;color:var(--mut);font-size:14px;flex-wrap:wrap}.hero .stat b{color:var(--fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:18px}
.dchip{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:16px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--fg);font-size:13px;text-align:left;transition:background .25s,border-color .25s,transform .15s}
.dchip:active{transform:scale(.96)}
.dchip .di{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--hover);color:var(--mut);transition:.25s}
.dchip small{display:block;color:var(--mut);font-size:11px}
.dchip.on{border-color:rgba(75,141,255,.6)}.dchip.on .di{background:var(--acc);color:#fff;box-shadow:0 0 18px -2px var(--acc)}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:2px solid transparent;padding:0;background:#222;transition:border-color .25s,transform .2s}
.thumb .room-art{filter:grayscale(1)}
.thumb:hover{transform:translateY(-2px)}.thumb[aria-pressed=true]{border-color:var(--acc)}
.thumb span{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
.side{display:grid;gap:16px;align-content:start}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mini-row:first-of-type{border-top:0}
.mini-row .mut{color:var(--mut)}
.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.scene{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass2);color:var(--fg);text-align:left;transition:background .3s,border-color .3s,transform .15s}
.scene:hover{border-color:rgba(75,141,255,.5)}.scene:active{transform:scale(.96)}
.scene .di{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--hover)}
.scene.run{background:var(--acc);border-color:var(--acc);color:#fff}
.scene.run .di{animation:pulseRing 1s ease-out 2}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.cams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.camb{border:0;padding:0;border-radius:14px;overflow:hidden;background:none;display:block;width:100%;transition:transform .2s}
.camb:hover{transform:scale(1.02)}
.camb .cam{border-radius:14px}
/* rooms page */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:16px;margin-bottom:16px;scrollbar-width:none}
.tabs a{white-space:nowrap;padding:9px 16px;border-radius:12px;color:var(--mut);text-decoration:none;font-size:14px;font-weight:600}
.tabs a[aria-current=true]{background:var(--acc);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;min-height:160px}
.t-top{display:flex;justify-content:space-between;align-items:center}
.t-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--hover);color:var(--mut);transition:.3s}
.tile.on .t-ic{background:var(--acc);color:#fff;box-shadow:0 0 calc(10px + var(--lv,1) * 24px) -4px var(--acc)}
.tile b{font-size:15px;font-weight:600}.t-st{font-size:13px;color:var(--mut);margin-top:-6px}
.tile .rng{margin-top:auto}
.acrow{display:flex;align-items:center;gap:8px;margin-top:auto}
.acrow .btn{width:36px;height:36px;padding:0}
.acrow b{flex:1;text-align:center;font-size:24px;font-weight:300}
.lockb{display:flex;align-items:center;gap:8px}
.tile.lock.on .t-ic{background:var(--glass2);color:var(--fg);box-shadow:none}
.tile.lock:not(.on) .t-ic{background:var(--bad);color:#fff}
/* climate, security, energy */
.dialwrap{display:grid;place-items:center;padding:6px 0}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.zone{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;border:1px solid transparent;background:none;color:var(--fg);width:100%;text-align:left;transition:background .2s,border-color .2s}
.zone:hover{background:var(--hover)}.zone[aria-pressed=true]{border-color:var(--acc);background:var(--hover)}
.zone b{flex:1;font-weight:600}.zone .t{font-size:20px;font-weight:300}
.alarm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alarm button{padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;transition:.25s}
.alarm button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 10px 30px -10px var(--acc)}
.shield{display:grid;place-items:center;margin:4px auto 14px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(75,141,255,.25),transparent 70%)}
.shield svg{width:64px;height:64px;color:var(--acc)}
.armed .shield{animation:radar 2.6s ease-out infinite}
@keyframes radar{0%{box-shadow:0 0 0 0 rgba(75,141,255,.45)}100%{box-shadow:0 0 0 30px rgba(75,141,255,0)}}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .di{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--hover);color:var(--mut);flex:none}
.list .on .di,.list li.on .di{color:var(--acc)}
.list .grow{flex:1;min-width:0}.list small{display:block;color:var(--mut);font-size:12px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--hover);color:var(--mut);letter-spacing:.04em}
.badge.b{background:rgba(75,141,255,.18);color:var(--acc)}.badge.r{background:rgba(255,107,107,.16);color:var(--bad)}
.pin{display:flex;justify-content:center;gap:12px;margin:6px 0 16px}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut);transition:.2s}.pin i.f{background:var(--acc);border-color:var(--acc)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:auto}
.keys button{height:58px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);font-size:22px;font-weight:300;color:var(--fg);transition:transform .1s,background .2s}
.keys button:active{transform:scale(.9);background:var(--acc)}
.live{display:flex;align-items:baseline;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;box-shadow:0 0 10px var(--acc);animation:camBlink 2s steps(2) infinite}
.code{font:600 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.span2{grid-column:span 2}.full{grid-column:1/-1}
.ra{display:flex;gap:4px;justify-content:flex-end}
.ra button{border:0;background:none;padding:6px;border-radius:8px;color:var(--mut);display:grid}.ra button:hover{color:var(--fg);background:var(--hover)}.ra .ic{width:17px;height:17px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.ph h1{margin:0;font-size:34px;font-weight:300;letter-spacing:-.03em}
.ph p{margin:4px 0 0;color:var(--mut)}
.scrim{display:none}
@media (max-width:1100px){.homeg{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr))}.scenes{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:1fr}
 .rail{position:fixed;left:0;top:0;bottom:0;height:auto;margin:0;border-radius:0 24px 24px 0;width:220px;align-items:stretch;padding:16px 12px;transform:translateX(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:40}
 .nav-open .rail{transform:none}
 .nav{align-items:stretch}.nav a{width:auto;display:flex;gap:12px;justify-content:flex-start;padding:0 14px}.nav a span{display:inline}
 .rail-foot{flex-direction:row;justify-content:center}
 .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}.nav-open .scrim{opacity:1;pointer-events:auto}
 .menu{display:grid}.main{padding:10px 14px 40px}.pillx.wx{display:none}
 .side,.c2,.c3{grid-template-columns:1fr}.span2{grid-column:auto}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.hero h1{font-size:34px}.hero{min-height:0}.big{font-size:32px}.top .house b{font-size:17px}.avs{display:none}}
@media (max-width:520px){#liveW{display:none}}
@media (max-width:420px){.scenes{grid-template-columns:1fr 1fr}.cams{grid-template-columns:1fr}}

<div class="bd" aria-hidden="true"><div class="bd-l on" id="bdA"></div><div class="bd-l" id="bdB"></div></div>

<script>
/* ===== Core helpers: DOM, numbers, seeded data ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function energyGen(sd) {

  const hours = [...Array(24)].map((_, h) => +(0.35 + 0.95 * Math.exp(-((h - 21) ** 2) / 8) + 0.7 * Math.exp(-((h - 14) ** 2) / 10) + 0.3 * Math.exp(-((h - 7) ** 2) / 3) + rf(0, 0.15)).toFixed(2));
  const solar = [...Array(24)].map((_, h) => +(h > 6 && h < 18 ? Math.sin(((h - 6) / 12) * Math.PI) * rf(2.6, 3.2) : 0).toFixed(2));
  const days = [...Array(30)].map(() => +rf(16, 27).toFixed(1));
  const months = monthsBack(12).map((m) => { const k = MON.indexOf(m), f = Math.max(0, Math.cos(((k - 6) / 12) * 2 * Math.PI)); return Math.round(300 + 520 * f + rf(-25, 25)); });
  const split = { Cooling: 46, Water: 14, Kitchen: 15, Lighting: 9, Media: 7, Other: 9 };
  return { hours, solar, days, months, split };
}

/* ===== Page: Security ===== */
function pinPad(next) {
  let code = '';
  const m = modal({ title: `Switch alarm to ${next}`, ok: false, cancel: 'Cancel', cls: 'cc-small', body: `<p class="cc-confirm" style="text-align:center">Enter your four-digit PIN. Demo PIN: ${PIN}</p><div class="pin" aria-live="polite" aria-label="PIN digits entered">${'<i></i>'.repeat(4)}</div><p class="cc-err" id="pinE" style="text-align:center"></p><div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'].map((k) => `<button type="button" data-k="${k}" aria-label="${k === '⌫' ? 'Delete digit' : k === 'C' ? 'Clear' : k}">${k}</button>`).join('')}</div>` });
  const paint = () => $$('.pin i', m.el).forEach((x, i) => x.classList.toggle('f', i < code.length));
  const press = (k) => {
    if (k === 'C') code = ''; else if (k === '⌫') code = code.slice(0, -1); else if (code.length < 4) code += k;
    paint();
    if (code.length === 4) {
      if (code === PIN) { ALARM = next; logEvent(`Alarm set to ${next}`, 'shield'); notify(`Alarm switched to ${next}`, 'shield'); toast(`Alarm: ${next}`, { icon: 'shield' }); m.close(); if (App.cur === 'security') rerender(); }
      else { $('#pinE', m.el).textContent = 'Wrong PIN. Try again.'; m.el.classList.remove('cc-shake'); void m.el.offsetWidth; m.el.classList.add('cc-shake'); code = ''; setTimeout(paint, 250); }
    }
  };
  m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  m.el.addEventListener('keydown', (e) => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); });
}
page('security', 'Security', (v) => {
  const locks = H.devs.filter((d) => d.type === 'lock');
  v.innerHTML = ph('Security', 'Alarm, locks, sensors and everything that happened.') + `
  <div class="g c3">
    <section class="card glass ${ALARM !== 'Disarmed' ? 'armed' : ''}"><p class="lbl">Alarm</p><div class="shield">${I('shield')}</div><div class="alarm" role="group" aria-label="Alarm mode">${['Disarmed', 'Home', 'Away'].map((m) => `<button type="button" data-al="${m}" aria-pressed="${m === ALARM}">${I(m === 'Disarmed' ? 'unlock' : m === 'Home' ? 'home' : 'out')}${m}</button>`).join('')}</div></section>
    <section class="card glass"><p class="lbl">Locks</p><ul class="list">${locks.map((d) => `<li class="${d.locked ? 'on' : ''}" data-dev="${d.id}"><span class="di" data-dev="${d.id}" data-show="icon">${devIcon(d)}</span><span class="grow">${esc(d.name)}<small><span data-dev="${d.id}" data-show="state">${devState(d)}</span> · battery ${d.battery}%</small></span><button class="btn sm" type="button" data-dev="${d.id}" data-act="toggle" aria-pressed="${d.locked}">${d.locked ? 'Unlock' : 'Lock'}</button></li>`).join('')}</ul><button class="btn" type="button" id="lockAll" style="margin-top:10px;width:100%">${I('lock')}Lock every door</button></section>
    <section class="card glass"><p class="lbl">Sensors</p><ul class="list">${SENS.map(([n, s, b]) => `<li><span class="di">${I(/smoke/i.test(n) ? 'flame' : /leak/i.test(n) ? 'drop' : 'door')}</span><span class="grow">${n}<small>Battery ${b}%</small></span><span class="badge ${s === 'Open' ? 'r' : ''}">${s}</span></li>`).join('')}</ul></section>
  </div>
  <section class="card glass" style="margin-top:16px"><p class="lbl">Activity log</p><div id="logt"></div></section>`;
  table($('#logt'), { rows: () => H.log.map((x) => ({ ...x, when: x.t })), sort: 'when', dir: -1, size: 8, search: ['text', 'room'], cols: [{ k: 'when', label: 'Time', f: (x) => `${dfmt(new Date(x.t))}, ${new Date(x.t).toTimeString().slice(0, 5)}` }, { k: 'text', label: 'Event', f: (x) => `<span style="display:inline-flex;gap:8px;align-items:center">${I(x.icon || 'bolt')}${esc(x.text)}</span>` }, { k: 'room', label: 'Room' }], ph: 'Search events…' });
  v.addEventListener('click', (e) => { const b = e.target.closest('[data-al]'); if (b && b.dataset.al !== ALARM) pinPad(b.dataset.al); });
  $('#lockAll').addEventListener('click', () => { locks.forEach((d) => setDev(d, { locked: true }, { quiet: true })); logEvent('Every door locked', 'lock'); toast('Every door locked', { icon: 'lock' }); });
}, 'shield');

/* ===== Page: Climate ===== */
let ZONE = 'living';

  <div class="g" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)">
    <section class="card glass"><p class="lbl">${esc(r.name)}<span class="badge ${cur.on ? 'b' : ''}" data-dev="${cur.id}" data-show="state">${devState(cur)}</span></p><div class="dialwrap" id="dial"></div>
      <div class="modes"><button class="btn sm" type="button" data-dev="${cur.id}" data-act="toggle" aria-pressed="${cur.on}">${I('power')}Power</button><button class="btn sm" type="button" data-dev="${cur.id}" data-act="mode">${I('snow')}Change mode</button><button class="btn sm" type="button" id="fanB">${I('fan')}Fan: <span id="fanT">${cur.fanSpeed}</span></button></div></section>
    <section class="card glass"><p class="lbl">Zones</p>${acs.map((d) => `<button type="button" class="zone" data-z="${d.room}" aria-pressed="${d.room === ZONE}"><span class="di" style="width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--hover)">${I(roomOf(d).icon)}</span><b>${esc(roomOf(d).name)}</b><small style="color:var(--mut)" data-dev="${d.id}" data-show="state">${devState(d)}</small><span class="t">${fmt(roomOf(d).temp, 1)}°</span></button>`).join('')}
      <div class="g c2" style="margin-top:14px"><div><p class="lbl">Air quality</p><div id="aq"></div></div><div><p class="lbl">Humidity</p><div id="hu"></div></div></div></section>
    <section class="card glass full"><p class="lbl">Inside and outside today</p><div id="tc"></div></section>
  </div>`;
  dial($('#dial'), { value: cur.set, min: 16, max: 30, label: `${r.name} temperature`, sub: 'Target', onInput: (x) => setDev(cur, { set: x, on: true }, { quiet: true }), onChange: (x) => { logEvent(`${cur.name} in ${r.name}: ${x}°`, 'snow', r.name); toast(`${r.name} set to ${x}°`, { icon: 'snow' }); } });
  gauge($('#aq'), { value: 42, max: 150, label: 'AQI · good', size: 140, color: 'var(--c1)' });
  gauge($('#hu'), { value: Math.round(sum(INSIDE.map((x) => x.hum)) / INSIDE.length), max: 100, label: 'percent', size: 140, color: 'var(--c2)' });
  lineChart($('#tc'), { labels: hrs, series: [{ name: 'Inside', data: hrs.map((_, h) => +(avg - 1 + Math.sin(((h - 15) / 24) * Math.PI * 2) * 1.2).toFixed(1)), color: 'var(--c1)' }, { name: 'Outside', data: hrs.map((_, h) => +(28 + Math.sin(((h - 9) / 24) * Math.PI * 2) * 6).toFixed(1)), color: 'var(--c3)' }], h: 220, fmt: (x) => fmt(x) + '°', tfmt: (x) => fmt(x, 1) + '°C', title: 'Inside and outside temperature' });
  onDev(v, (d) => { if (d === cur && $('#dial')._set) $('#dial')._set(d.set); });
  v.addEventListener('click', (e) => { const z = e.target.closest('[data-z]'); if (z) { ZONE = z.dataset.z; rerender(); } });
  $('#fanB').addEventListener('click', () => { const F = ['Auto', 'Low', 'Medium', 'High']; cur.fanSpeed = F[(F.indexOf(cur.fanSpeed) + 1) % F.length]; $('#fanT').textContent = cur.fanSpeed; toast(`Fan speed: ${cur.fanSpeed}`, { icon: 'fan' }); });
}, 'thermo');

/* ===== Page: Energy ===== */
page('energy', 'Energy', (v) => {
  let rg = '24H';
  const kwhM = EN.months[11], bill = kwhM * H.tariff;
  v.innerHTML = ph('Energy', `Tariff Rs ${H.tariff} per unit · bills in rupees`) + `
  <div class="g c3"><section class="card glass"><p class="lbl">Using now</p><div class="live"><span class="dot"></span><span class="big" id="enW">${fmt(homeWatts() / 1000, 2)}<small>kW</small></span></div><div id="enG" style="margin-top:8px"></div></section>
  <section class="card glass"><p class="lbl">This month</p><div class="big" data-count="${kwhM}" data-f="kwh">0</div><p style="color:var(--mut);margin:8px 0 0">Estimated bill <b style="color:var(--fg)" data-count="${bill}" data-f="rs">0</b></p><div id="mSpark" style="margin-top:12px"></div></section>
  <section class="card glass"><p class="lbl">Where it goes</p><div id="split"></div></section></div>

  <section class="card glass" style="margin-top:16px"><p class="lbl">Using power right now</p><div id="top"></div></section>`;

  const draw = (morph) => { const x = data(rg); lineChart($('#use'), { labels: x.labels, series: [{ name: 'Used', data: x.d, color: 'var(--c1)' }], h: 240, morph, fmt: (y) => fmt(y, y < 10 && y % 1 ? 1 : 0), tfmt: (y) => fmt(y, 1) + ' kWh', title: 'Energy use' }); };
  seg($('#rg'), ['24H', '7D', '30D', '12M'], rg, (x) => { rg = x; draw(true); });
  draw(false);
  gauge($('#enG'), { value: +(homeWatts() / 1000).toFixed(2), max: 8, label: 'of 8 kW supply', size: 150, fmt: (x) => fmt(x, 2) });
  spark($('#mSpark'), EN.months, 'var(--c2)', { labels: monthsBack(12), fmt: (x) => fmt(x) + ' kWh', name: 'Month' });
  donut($('#split'), { items: Object.entries(EN.split).map(([label, value], k) => ({ label, value: Math.round((value / 100) * kwhM), color: `var(--c${(k % 5) + 1})` })), fmt: (x) => fmt(x) + ' kWh', sub: 'kWh', size: 140, title: 'Energy by use' });
  const top = () => hbars($('#top'), H.devs.filter((d) => devWatts(d) > 0).map((d) => ({ label: `${d.name} · ${roomOf(d).name}`, value: devWatts(d) })).sort((a, b) => b.value - a.value).slice(0, 7), (x) => fmt(x) + ' W');
  top();
  every(2000, () => { const w = homeWatts() * rf(0.97, 1.03); $('#enW').innerHTML = `${fmt(w / 1000, 2)}<small>kW</small>`; });
  onDev(v, () => { top(); gauge($('#enG'), { value: +(homeWatts() / 1000).toFixed(2), max: 8, label: 'of 8 kW supply', size: 150, fmt: (x) => fmt(x, 2), anim: false }); });

/* ===== Page: Automations ===== */
page('automations', 'Automations', (v) => {
  v.innerHTML = ph('Automations', 'Scenes you tap and rules that run on their own.', `<button class="btn primary" type="button" id="newA">${I('plus')}New automation</button>`) + `
  <section class="card glass"><p class="lbl">Scenes</p><div class="scenes">${sceneBtns()}</div></section>
  <section class="card glass" style="margin-top:16px"><p class="lbl">Rules</p><ul class="list" id="al"></ul></section>`;
  const draw = () => { $('#al').innerHTML = H.autos.length ? H.autos.map((a) => `<li><span class="di">${I(a.trig === 'time' ? 'clock' : a.trig === 'sunset' || a.trig === 'sunrise' ? 'sun' : a.trig === 'motion' ? 'eye' : a.trig === 'hot' ? 'thermo' : 'users')}</span><span class="grow">${esc(a.name)}<small>${esc(autoText(a))}${a.last ? ' · last ran ' + ago(a.last) : ''}</small></span><button class="btn sm" type="button" data-run="${a.id}">Run now</button><span class="ra"><button type="button" data-ed="${a.id}" aria-label="Edit ${esc(a.name)}">${I('edit')}</button><button type="button" data-del="${a.id}" aria-label="Delete ${esc(a.name)}">${I('trash')}</button></span><button class="sw" type="button" role="switch" aria-checked="${a.on}" data-tg="${a.id}" aria-label="${esc(a.name)} active"></button></li>`).join('') : '<li class="cc-empty">No rules yet. Create one to make the house run itself.</li>'; };
  draw();
  v.addEventListener('click', async (e) => {
    const g = (k) => { const b = e.target.closest(`[data-${k}]`); return b && H.autos.find((a) => a.id === b.dataset[k]); };
    let a;
    if ((a = g('tg'))) { a.on = !a.on; draw(); toast(`${a.name} ${a.on ? 'on' : 'paused'}`, { icon: 'sparkle' }); }
    else if ((a = g('run'))) { runAuto(a); draw(); }
    else if ((a = g('ed'))) autoForm(a, draw);
    else if ((a = g('del')) && (await confirmBox('Delete automation?', `"${a.name}" will stop running.`))) { H.autos = H.autos.filter((x) => x !== a); draw(); toast('Automation deleted'); }
  });
  $('#newA').addEventListener('click', () => autoForm(null, draw));
}, 'sparkle');

page('family', 'Family', (v) => {

  const draw = () => table($('#codes'), { rows: () => CODES, size: 5, cols: [{ k: 'name', label: 'For' }, { k: 'code', label: 'Code', f: (c) => `<span class="code">${c.code}</span>` }, { k: 'doors', label: 'Doors' }, { k: 'until', label: 'Valid until', f: (c) => dfmt(fromIso(c.until)) }, { k: 'x', label: '', sort: false, f: () => `<span class="ra"><button type="button" data-act="del" aria-label="Revoke code">${I('trash')}</button></span>` }], act: async (a, c) => { if (await confirmBox('Revoke this code?', `${c.name} will no longer be able to open the ${c.doors.toLowerCase()}.`, 'Remove')) { CODES = CODES.filter((x) => x !== c); draw(); toast('Code revoked', { icon: 'key' }); } } });
  draw();
  v.addEventListener('click', (e) => { const b = e.target.closest('[data-pp]'); if (!b) return; const p = PEOPLE.find((x) => x.id === b.dataset.pp); p.home = !p.home; p.where = p.home ? 'Home' : 'Out'; logEvent(`${p.name} ${p.home ? 'arrived home' : 'left home'}`, 'user'); toast(`${p.name.split(' ')[0]} is ${p.home ? 'home' : 'out'}`, { icon: 'user' }); rerender(); avs(); });
  $('#newC').addEventListener('click', () => modal({ title: 'New access code', ok: 'Create code', body: fields([{ name: 'name', label: 'Who is it for?', full: true, ph: 'e.g. Electrician' }, { name: 'doors', label: 'Doors', type: 'select', options: ['Gate', 'Front door', 'Gate and front door'] }, { name: 'until', label: 'Valid until', type: 'date', value: iso(addDays(TODAY, 7)) }]),
    onOk: (f) => { const d = check(f, { name: need('Name'), until: (x) => (!x ? 'Pick a date' : fromIso(x) < TODAY ? 'The date must be today or later' : '') }); if (!d) return false; const code = String(ri(100000, 999999)); CODES.unshift({ id: uid(), name: d.name.trim(), code, doors: d.doors, until: d.until }); draw(); toast(`Code ${code} created for ${d.name.trim()}`, { icon: 'key' }); } }));
}, 'users');
