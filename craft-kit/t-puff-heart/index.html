<html lang="en">
<head>
<meta charset="utf-8" />

<title>Puff Heart · Balloon like button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --sky-a: #efe4ff;
    --sky-b: #ffe6da;
    --cloud: rgba(255, 255, 255, 0.75);
    --card: #ffffff;
    --ink: #2a1730;
    --muted: #7d6a83;
    --line: rgba(70, 30, 80, 0.1);
    --chip: #fbf4fd;
    --rose: #ff3d6e;
    --coral: #ff8a5c;
    --rose-deep: #d81b52;
    --glow: rgba(255, 61, 110, 0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --sky-a: #1b1030;
    --sky-b: #2c1426;
    --cloud: rgba(255, 210, 235, 0.07);
    --card: #241a33;
    --ink: #fbeef8;
    --muted: #b49dbd;
    --line: rgba(255, 210, 235, 0.12);
    --chip: #2f2242;
    --rose: #ff5c86;
    --coral: #ff9a70;
    --rose-deep: #ff2e66;
    --glow: rgba(255, 92, 134, 0.4);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--sky-a);
  }

  /* ---------- Stage: a soft sky with drifting clouds ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; background: linear-gradient(160deg, var(--sky-a), var(--sky-b)); }
  .cloud { position: absolute; left: 0; height: auto; color: var(--cloud); animation: drift 30s linear infinite; pointer-events: none; }
  .c1 { top: 9%; width: 150px; animation-delay: -6s; }
  .c2 { top: 76%; width: 110px; animation-duration: 38s; animation-delay: -20s; }
  .c3 { top: 36%; width: 190px; animation-duration: 46s; animation-delay: -31s; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(110vw); } }

  /* ---------- Post card ---------- */
  .card { position: relative; width: min(360px, 100%); border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 34px 70px -38px rgba(90, 20, 70, 0.55); }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: 0.8rem; color: #fff; background: linear-gradient(135deg, var(--coral), var(--rose)); }
  .who b { display: block; font-size: 0.92rem; }
  .who small { color: var(--muted); font-size: 0.76rem; }
  .pic { position: relative; margin: 0 12px; border-radius: 18px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pic svg { display: block; width: 100%; height: auto; }
  .kite { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3.8s ease-in-out infinite; }
  .kite.k2 { animation-duration: 4.6s; animation-delay: -1.2s; }
  .kite.k3 { animation-duration: 5.2s; animation-delay: -2.4s; }
  @keyframes sway { 50% { transform: rotate(7deg) translateY(-3px); } }
  .tail { fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .big { position: absolute; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none; opacity: 0; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 16px 12px; }
  .caption { margin: 0; font-size: 0.82rem; color: var(--muted); line-height: 1.35; }
  .caption b { color: var(--ink); }

  /* ---------- Like button ---------- */
  .like {
    position: relative;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 8px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.3s, background 0.3s, transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .like:hover { transform: translateY(-2px); }
  .like:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
  .like[aria-pressed="true"] { border-color: color-mix(in srgb, var(--rose) 40%, transparent); background: color-mix(in srgb, var(--rose) 12%, var(--chip)); }
  .heart { position: relative; width: 28px; height: 28px; display: block; }
  .heart span { position: absolute; inset: 0; display: block; }
  .heart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .outline path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .fill { clip-path: inset(100% 0 0 0); }
  .like[aria-pressed="true"] .fill { clip-path: inset(0 0 0 0); }
  .like:hover .heart { animation: wiggle 0.9s ease-in-out; }
  .like[aria-pressed="true"] .heart { animation: beat 2.6s ease-in-out infinite 1.6s; }
  @keyframes wiggle { 25% { transform: rotate(-10deg) scale(1.08); } 60% { transform: rotate(7deg); } }
  @keyframes beat { 0%, 30%, 100% { transform: scale(1); } 8% { transform: scale(1.16); } 16% { transform: scale(0.98); } 22% { transform: scale(1.1); } }
  .count { position: relative; display: inline-block; height: 1.2em; overflow: hidden; min-width: 2.9em; font-variant-numeric: tabular-nums; }
  .count span { display: block; line-height: 1.2em; }
  .puff { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: 0; pointer-events: none; }

  /* balloon + particles live in a layer over the card */
  .air { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
  .balloon { position: absolute; left: 0; top: 0; width: 64px; height: 120px; overflow: visible; }
  .bit { position: absolute; left: 0; top: 0; width: 12px; height: 12px; pointer-events: none; }
  .bit.heart-bit { clip-path: path("M6 10.6s-3.8-2.3-4.8-4.7C0.5 4 1.5 2 3.5 2c1.1 0 1.9 0.6 2.5 1.5C6.6 2.6 7.4 2 8.5 2c2 0 3 2 2.3 3.9C9.8 8.3 6 10.6 6 10.6z"); }
  .bit.scrap { width: 7px; height: 4px; border-radius: 1px; }
  .ring { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid var(--rose); opacity: 0; }
  .pop { position: absolute; left: 0; top: 0; font: italic 900 1.15rem/1 system-ui, sans-serif; color: var(--rose-deep); letter-spacing: 0.02em; opacity: 0; white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.4; } }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .kite, .like:hover .heart, .like[aria-pressed="true"] .heart { animation: none; }
    .like { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <svg class="cloud c1" viewBox="0 0 120 52" aria-hidden="true"><path d="M18 50 C4 50 2 32 16 30 C14 16 32 10 40 20 C44 4 72 2 78 18 C88 10 106 16 102 30 C118 30 118 50 104 50 Z" fill="currentColor" /></svg>
    <svg class="cloud c2" viewBox="0 0 120 52" aria-hidden="true"><path d="M18 50 C4 50 2 32 16 30 C14 16 32 10 40 20 C44 4 72 2 78 18 C88 10 106 16 102 30 C118 30 118 50 104 50 Z" fill="currentColor" /></svg>
    <svg class="cloud c3" viewBox="0 0 120 52" aria-hidden="true"><path d="M18 50 C4 50 2 32 16 30 C14 16 32 10 40 20 C44 4 72 2 78 18 C88 10 106 16 102 30 C118 30 118 50 104 50 Z" fill="currentColor" /></svg>
    <article class="card" id="card">
      <header class="head">
        <span class="avatar" aria-hidden="true">ZA</span>
        <span class="who"><b>Zara Ahmed</b><small>Lahore · 2 h</small></span>
      </header>
      <!-- Drawn picture: kites over old city rooftops. Double-click or double-tap it to like. -->
      <div class="pic" id="pic">
        <svg viewBox="0 0 336 210" role="img" aria-label="Drawing of three kites over old city rooftops at sunset. Double-click to like.">
          <defs>
            <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb199" /><stop offset="0.6" stop-color="#ffd9a8" /><stop offset="1" stop-color="#fff0cf" /></linearGradient>
          </defs>
          <rect width="336" height="210" fill="url(#dusk)" />
          <circle cx="250" cy="138" r="30" fill="#fff4dc" opacity="0.9" />
          <g class="kite" style="--d:0"><path d="M70 30 L90 52 L70 78 L50 52 Z" fill="#ff3d6e" /><path d="M70 30 L70 78 M50 52 L90 52" stroke="#fff" stroke-width="1.2" opacity="0.7" /><path class="tail" d="M70 78 q-6 10 2 18 t-2 18" stroke="#ff3d6e" /></g>
          <g class="kite k2"><path d="M168 46 L182 62 L168 80 L154 62 Z" fill="#6c4cff" /><path d="M168 46 L168 80" stroke="#fff" stroke-width="1" opacity="0.7" /><path class="tail" d="M168 80 q5 8 -1 14 t1 14" stroke="#6c4cff" /></g>
          <g class="kite k3"><path d="M270 24 L284 40 L270 58 L256 40 Z" fill="#11a37f" /><path d="M270 24 L270 58" stroke="#fff" stroke-width="1" opacity="0.7" /><path class="tail" d="M270 58 q-5 8 1 14 t-1 14" stroke="#11a37f" /></g>
          <path d="M0 160 H30 V148 H56 V160 H70 V138 a14 14 0 0 1 28 0 V160 H112 V150 H140 V136 H150 V122 L154 112 L158 122 V136 H168 V160 H186 V146 H214 V160 H232 V140 a12 12 0 0 1 24 0 V160 H270 V150 H300 V142 H336 V210 H0 Z" fill="#7a3b54" />
          <path d="M0 180 H48 V170 H84 V182 H130 V172 H170 V184 H222 V174 H262 V186 H336 V210 H0 Z" fill="#5a2740" />
          <g fill="#ffd27a" opacity="0.9"><rect x="80" y="146" width="4" height="6" rx="1" /><rect x="152" y="140" width="4" height="6" rx="1" /><rect x="242" y="148" width="4" height="6" rx="1" /><rect x="196" y="152" width="4" height="5" rx="1" /></g>
        </svg>
        <svg class="big" id="big" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.1 2.9 4 6.9 4c2.2 0 3.8 1.2 5.1 3 1.3-1.8 2.9-3 5.1-3 4 0 6 4.1 4.5 7.8C19.5 16.4 12 21 12 21z" fill="#fff" /></svg>
      </div>
      <footer class="foot">
        <p class="caption"><b>Kites over the old city.</b> Spring evening from a rooftop.</p>
        <button class="like" id="like" type="button" aria-pressed="false" aria-describedby="likes-label">
          <span class="heart" id="heart" aria-hidden="true">
            <span class="outline"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.1 2.9 4 6.9 4c2.2 0 3.8 1.2 5.1 3 1.3-1.8 2.9-3 5.1-3 4 0 6 4.1 4.5 7.8C19.5 16.4 12 21 12 21z" /></svg></span>
            <span class="fill" id="fill"><svg viewBox="0 0 24 24"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--coral)" /><stop offset="1" style="stop-color: var(--rose)" /></linearGradient></defs><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.1 2.9 4 6.9 4c2.2 0 3.8 1.2 5.1 3 1.3-1.8 2.9-3 5.1-3 4 0 6 4.1 4.5 7.8C19.5 16.4 12 21 12 21z" fill="url(#rg)" /><path d="M6.4 7.2c-1.3.4-2 1.6-1.9 3" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" /></svg></span>
          </span>
          <span class="sr">Like</span>
          <span class="count" id="count" aria-hidden="true"><span>2,480</span></span>
        </button>
      </footer>
      <div class="air" id="air" aria-hidden="true"></div>
    </article>
    <p class="sr" id="likes-label">2,480 likes</p>
    <p class="sr" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // Puff Heart: a like button whose heart inflates into a balloon.
  // Like = squash and air puffs (anticipation) → the heart inflates and fills → it floats off as a balloon on a
  // string while a fresh heart springs into the button → the balloon pops into drifting confetti hearts → glow.
  // Unlike = the heart deflates with a sigh of air and drains.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var like = $("like"), heart = $("heart"), fill = $("fill"), count = $("count"), air = $("air"), card = $("card");
    var pic = $("pic"), big = $("big"), label = $("likes-label"), status = $("status");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var NS = "http://www.w3.org/2000/svg";
    var HEART = "M12 21s-7.5-4.6-9.6-9.2C.9 8.1 2.9 4 6.9 4c2.2 0 3.8 1.2 5.1 3 1.3-1.8 2.9-3 5.1-3 4 0 6 4.1 4.5 7.8C19.5 16.4 12 21 12 21z";
    var likes = 2480, run = 0;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function spring(stiff, damp) {
      var x = 0, v = 0, out = [0];
      for (var i = 0; i < 240; i++) { v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; out.push(x); if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break; }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiff, damp) {
      var c = spring(stiff, damp);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }
    // position of an element's centre inside the card
    function centre(el) {
      var a = el.getBoundingClientRect(), b = card.getBoundingClientRect(), k = b.width / card.offsetWidth || 1; // k: the card may be drawn scaled
      return { x: (a.left - b.left + a.width / 2) / k, y: (a.top - b.top + a.height / 2) / k };
    }

    // ---------- Rolling count ----------
    function roll(text, up) {
      while (count.children.length > 1) count.removeChild(count.firstElementChild);
      var old = count.firstElementChild;
      old.getAnimations().forEach(function (a) { a.cancel(); });
      old.style.position = "";
      var next = document.createElement("span");
      next.textContent = text;
      if (calm.matches) { count.replaceChild(next, old); return; }
      next.style.cssText = "position:absolute;left:0;top:0";
      count.appendChild(next);
      var d = up ? 1 : -1;
      old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(" + -100 * d + "%)", opacity: 0 }], { duration: 200, easing: "ease-in", fill: "forwards" })
        .finished.then(function () { old.remove(); next.style.position = ""; }).catch(function () {});
      springTo(next, function (p) { return { transform: "translateY(" + ((1 - p) * 100 * d).toFixed(1) + "%)" }; }, 300, 15);
    }
    function render(on) {
      like.setAttribute("aria-pressed", String(on));
      roll(likes.toLocaleString("en-US"), on);
      label.textContent = likes.toLocaleString("en-US") + " likes";
    }

    // ---------- Little air puffs (into the heart when pumping, out of it when deflating) ----------
    function puffs(into) {
      for (var i = 0; i < 4; i++) {
        var p = document.createElement("i");
        p.className = "puff";
        heart.appendChild(p);
        var a = -Math.PI / 2 + (i - 1.5) * 0.55, r = 22;
        var fx = 11 + Math.cos(a) * r, fy = 11 + Math.sin(a) * r * (into ? -1 : 1);
        var from = into ? "translate(" + fx + "px," + (fy + 4) + "px) scale(1.4)" : "translate(11px,8px) scale(0.4)";
        var to = into ? "translate(11px,11px) scale(0.2)" : "translate(" + fx + "px," + (fy - 8) + "px) scale(1.5)";
        p.animate([{ transform: from, opacity: 0 }, { opacity: 0.55, offset: 0.3 }, { transform: to, opacity: 0 }], { duration: 300 + i * 40, delay: i * 30, easing: "ease-out" })
          .finished.then((function (el) { return function () { el.remove(); }; })(p)).catch(function () {});
      }
    }

    // ---------- The balloon: a heart on a string, drawn in SVG, flown with a small physics loop ----------
    function balloon(from, id) {
      return new Promise(function (resolve) {
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "balloon");
        svg.setAttribute("viewBox", "-32 -30 64 120");
        svg.innerHTML =
          '<defs><radialGradient id="bg' + id + '" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffd0dc"/><stop offset="0.35" style="stop-color: var(--rose)"/><stop offset="1" style="stop-color: var(--rose-deep)"/></radialGradient></defs>' +
          '<path class="str" d="M0 23 L0 80" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>' +
          '<g class="body"><path d="' + HEART + '" transform="translate(-24 -26) scale(2)" fill="url(#bg' + id + ')"/>' +
          '<path d="M-2 18 l2 5 l2 -5 z" style="fill: var(--rose-deep)"/>' +
          '<ellipse cx="-11" cy="-10" rx="5" ry="3" transform="rotate(-35 -11 -10)" fill="#fff" opacity="0.65"/></g>';
        svg.style.color = getComputedStyle(card).color;
        air.appendChild(svg);
        var str = svg.querySelector(".str");
        var t0 = performance.now(), dur = 1250, rise = Math.min(from.y - 40, 190);
        var lastX = 0;
        function frame(now) {
          if (id !== run) { svg.remove(); resolve(null); return; }
          var t = Math.min(1, Math.max(0, now - t0) / dur);
          var e = 1 - Math.pow(1 - t, 2.2);
          var x = from.x + Math.sin(t * 6.2) * 14 * t;
          var y = from.y - e * rise;
          var vx = x - lastX; lastX = x;
          var tilt = Math.sin(t * 6.2 + 0.8) * 9 * t;
          var sc = 1 + Math.min(1, t * 2) * 0.12;
          svg.style.transform = "translate(" + (x - 32).toFixed(1) + "px," + (y - 30).toFixed(1) + "px) rotate(" + tilt.toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")";
          // the string trails behind the sway
          var bend = Math.max(-14, Math.min(14, -vx * 6));
          str.setAttribute("d", "M0 23 Q" + bend.toFixed(1) + " 50 " + (bend * 0.4).toFixed(1) + " 80");
          if (t < 1) requestAnimationFrame(frame);
          else resolve({ el: svg, x: x, y: y });
        }
        requestAnimationFrame(frame);
      });
    }

    // ---------- Pop: ring, a little word and drifting confetti hearts ----------
    function pop(at) {
      var ring = document.createElement("i");
      ring.className = "ring";
      air.appendChild(ring);
      ring.animate([{ transform: "translate(" + at.x + "px," + at.y + "px) scale(0.3)", opacity: 0.9 }, { transform: "translate(" + at.x + "px," + at.y + "px) scale(1.8)", opacity: 0 }], { duration: 480, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" })
        .finished.then(function () { ring.remove(); }).catch(function () {});
      var word = document.createElement("b");
      word.className = "pop";
      word.textContent = "pop!";
      air.appendChild(word);
      var wx = at.x + 18, wy = at.y - 38;
      word.animate([
        { transform: "translate(" + wx + "px," + wy + "px) rotate(-14deg) scale(0.2)", opacity: 0 },
        { transform: "translate(" + wx + "px," + (wy - 6) + "px) rotate(-8deg) scale(1.25)", opacity: 1, offset: 0.25 },
        { transform: "translate(" + wx + "px," + (wy - 10) + "px) rotate(-8deg) scale(1)", opacity: 1, offset: 0.7 },
        { transform: "translate(" + wx + "px," + (wy - 22) + "px) rotate(-6deg) scale(0.9)", opacity: 0 }
      ], { duration: 900, easing: "ease-out" }).finished.then(function () { word.remove(); }).catch(function () {});
      var colors = ["#ff3d6e", "#ff8a5c", "#ffc2d1", "#ffffff", "#ff5c86", "#ffd27a"];
      for (var i = 0; i < 22; i++) {
        var b = document.createElement("i");
        var isHeart = i % 3 !== 2;
        b.className = "bit " + (isHeart ? "heart-bit" : "scrap");
        b.style.background = colors[i % colors.length];
        air.appendChild(b);
        // sample a little physics: burst out, then drift down while swaying like petals
        var ang = (i / 22) * Math.PI * 2 + Math.random() * 0.4;
        var sp = 70 + Math.random() * 90, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp - 60;
        var x = at.x - 6, y = at.y - 6, rot = Math.random() * 360, spin = (Math.random() - 0.5) * 500, phase = Math.random() * 6;
        var frames = [], steps = 26, dt = 1.5 / steps;
        for (var k = 0; k <= steps; k++) {
          var t = k / steps;
          frames.push({ transform: "translate(" + (x + Math.sin(phase + t * 9) * 8 * t).toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (rot + spin * t).toFixed(0) + "deg) scale(" + (isHeart ? 1 - t * 0.3 : 1).toFixed(2) + ")", opacity: t > 0.75 ? (1 - t) / 0.25 : 1 });
          vx *= 0.9; vy = vy * 0.9 + 26; x += vx * dt; y += vy * dt;
        }
        b.animate(frames, { duration: 1500 + Math.random() * 500, easing: "linear", fill: "forwards" })
          .finished.then((function (el) { return function () { el.remove(); }; })(b)).catch(function () {});
      }
    }

    // ---------- Like and unlike ----------
    async function doLike(id, from) {
      // 1. Anticipation: the button dips, the heart squashes and air puffs in
      like.animate([{ transform: "scale(1)" }, { transform: "scale(0.94)" }, { transform: "scale(1)" }], { duration: 280, easing: "ease-out" });
      puffs(true);
      await heart.animate([{ transform: "scale(1)" }, { transform: "scale(1.25, 0.7) translateY(3px)" }], { duration: 170, easing: "ease-in", fill: "forwards" }).finished.catch(function () {});
      if (id !== run) return;
      heart.getAnimations().forEach(function (a) { a.cancel(); });
      // 2. Inflate: the heart swells with a wobble while it fills from the bottom
      render(true);
      fill.animate([{ clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 360, easing: "cubic-bezier(0.3, 0.6, 0.3, 1)" });
      var swell = springTo(heart, function (p) { return { transform: "scale(" + (1 + 0.7 * p).toFixed(3) + "," + (0.7 + 1 * p).toFixed(3) + ")" }; }, 200, 9);
      await wait(380);
      if (id !== run) return;
      // 3. Lift off: the big heart leaves as a balloon, a new heart springs into the button
      var start = from || centre(heart);
      swell.cancel();
      springTo(heart, function (p) { return { transform: "scale(" + p.toFixed(3) + ")" }; }, 260, 11);
      card.animate([{ boxShadow: "0 0 0 0 " + getComputedStyle(card).getPropertyValue("--glow") }, { boxShadow: "0 0 0 16px transparent" }], { duration: 900, easing: "ease-out", composite: "add" });
      var flown = await balloon(start, id);
      if (!flown || id !== run) return;
      // 4. Pop: the balloon bursts into drifting confetti hearts
      flown.el.animate([{ opacity: 1, transform: flown.el.style.transform }, { opacity: 0, transform: flown.el.style.transform + " scale(1.35)" }], { duration: 110, easing: "ease-out", fill: "forwards" })
        .finished.then(function () { flown.el.remove(); }).catch(function () {});
      pop({ x: flown.x, y: flown.y - 4 });
    }

    async function doUnlike(id) {
      render(false);
      // the heart sighs: a puff of air leaves, it shrinks with a wobble and drains from the top
      puffs(false);
      fill.animate([{ clipPath: "inset(0 0 0 0)" }, { clipPath: "inset(100% 0 0 0)" }], { duration: 420, easing: "ease-in" });
      await heart.animate([{ transform: "scale(1)" }, { transform: "scale(1.1, 0.92)", offset: 0.3 }, { transform: "scale(0.7)" }], { duration: 260, easing: "ease-in" }).finished.catch(function () {});
      if (id !== run) return;
      springTo(heart, function (p) { return { transform: "scale(" + (0.7 + 0.3 * p).toFixed(3) + ") rotate(" + ((1 - p) * -14).toFixed(1) + "deg)" }; }, 240, 8);
    }

    function clear() {
      [heart, fill, like].forEach(function (el) { el.getAnimations().forEach(function (a) { a.cancel(); }); });
      [].slice.call(air.querySelectorAll(".balloon")).forEach(function (b) { b.remove(); });
    }
    function setLiked(on, from) {
      var id = ++run;
      clear();
      likes += on ? 1 : -1;
      status.textContent = on ? "Liked. " + likes.toLocaleString("en-US") + " likes." : "Like removed.";
      if (calm.matches) { render(on); return; }
      if (on) doLike(id, from); else doUnlike(id);
    }

    like.addEventListener("click", function () { setLiked(like.getAttribute("aria-pressed") !== "true"); });

    // Double-click or double-tap the picture: a white heart flashes there and a balloon rises from it
    function bigHeart(x, y) {
      if (calm.matches) return;
      big.style.left = x + "px"; big.style.top = y + "px";
      big.animate([{ transform: "scale(0.2)", opacity: 0 }, { transform: "scale(1.2)", opacity: 0.95, offset: 0.3 }, { transform: "scale(1)", opacity: 0.95, offset: 0.55 }, { transform: "scale(1.4) translateY(-12px)", opacity: 0 }], { duration: 800, easing: "ease-out" });
    }
    var lastTap = 0;
    pic.addEventListener("pointerup", function (e) {
      var now = Date.now();
      if (now - lastTap < 320) {
        var r = pic.getBoundingClientRect(), c = card.getBoundingClientRect(), k = c.width / card.offsetWidth || 1;
        bigHeart((e.clientX - r.left) / k, (e.clientY - r.top) / k);
        if (like.getAttribute("aria-pressed") !== "true") setLiked(true, { x: (e.clientX - c.left) / k, y: (e.clientY - c.top) / k });
        lastTap = 0;
      } else lastTap = now;
    });

    // ---------- Auto demo: like, let the balloon pop, unlike, repeat, until a real input ----------
    var demoOn = !calm.matches, timer = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function demo() {
      if (!demoOn) return;
      setLiked(like.getAttribute("aria-pressed") !== "true");
      timer = setTimeout(demo, like.getAttribute("aria-pressed") === "true" ? 4200 : 1800);
    }
    if (demoOn) timer = setTimeout(demo, 350);
  })();
</script>
</body>
