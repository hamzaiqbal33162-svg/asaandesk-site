<!doctype html>
<!-- Chill & Craft · Voltra · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltra · Personal finance</title>
<script>
  /* Theme: black and neon by default; ?theme=light|dark in the URL wins */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : "dark";
  })();
</script>
<style>
  /* ---------- Theme: black + neon (dark), clean white + deep neon (light) ---------- */
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f0f2f5; --panel: #ffffff;
    --ink: #0b0d12; --muted: #687083; --line: #e3e6ec; --grid: #eceef2;
    --accent: #00b35f; --accent-ink: #fff; --pink: #d6199f; --cyan: #0094c6; --yellow: #c29200;
    --good: #00b35f; --bad: #e0245e; --warn: #c29200;
    --radius: 14px; --radius-sm: 10px; --tip-bg: #0b0d12; --tip-ink: #fff;
    --neon: none;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #050506; --surface: #0b0b0e; --surface-2: #141419; --panel: #0e0e12;
    --ink: #f2f4f8; --muted: #7c8193; --line: #1d1e25; --grid: #15161c;
    --accent: #39ff88; --accent-ink: #03140a; --pink: #ff2bd6; --cyan: #2be4ff; --yellow: #ffe14d;
    --good: #39ff88; --bad: #ff3d7f; --warn: #ffe14d;
    --tip-bg: #f2f4f8; --tip-ink: #0b0b0e;
    --neon: url(#neonGlow);
    color-scheme: dark;
  }
  /* ===== Core component styles (shared helpers). Colours come from the theme variables above. ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* no sideways page scroll, whatever a wide header or an entrance animation does */
  body { margin: 0; overflow-x: clip; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
  :focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
  .cc-av { --h: 200; display: inline-grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 50%; font-size: .8em; font-weight: 700; color: hsl(var(--h) 60% 22%); background: hsl(var(--h) 70% 84%); flex: none; letter-spacing: .02em; }
  [data-theme="dark"] .cc-av { color: hsl(var(--h) 80% 88%); background: hsl(var(--h) 35% 28%); }

  /* Buttons used by dialogs (apps restyle .btn to fit their look) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 38px; padding: 0 16px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; transition: transform .12s, background .2s, box-shadow .2s, border-color .2s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink, #fff); }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 6px 18px -8px var(--accent); }
  .btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 30px; padding: 0 11px; font-size: .86em; }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  /* Toasts */
  .cc-toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
  .cc-toast { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm, 10px); background: var(--tip-bg, #111); color: var(--tip-ink, #fff); box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); font-size: .92rem; animation: ccToast .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: auto; }
  .cc-toast .ic { color: var(--good); }
  .cc-toast.bad .ic { color: var(--bad); }
  .cc-toast.warn .ic { color: var(--warn); }
  .cc-toast.out { animation: ccToastOut .3s ease forwards; }
  @keyframes ccToast { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  @keyframes ccToastOut { to { opacity: 0; transform: translateX(30px); } }

  /* Modal + drawer */
  .cc-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
  .cc-back { position: absolute; inset: 0; background: var(--overlay, rgba(10,12,20,.5)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
  .cc-dialog { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius, 16px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.1); }
  .cc-dialog.wide { width: min(720px, 100%); }
  .cc-overlay.open .cc-back { opacity: 1; }
  .cc-overlay.open .cc-dialog { opacity: 1; transform: none; }
  .cc-overlay.is-drawer { place-items: stretch end; padding: 0; }
  .cc-overlay.is-drawer .cc-dialog { width: min(440px, 100%); height: 100%; max-height: none; border-radius: var(--radius, 16px) 0 0 var(--radius, 16px); transform: translateX(40px); }
  .cc-overlay.is-drawer.open .cc-dialog { transform: none; }
  .cc-dh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; position: sticky; top: 0; background: inherit; z-index: 1; }
  .cc-dh h2 { margin: 0; font-size: 1.12rem; }
  .cc-x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
  .cc-x:hover { background: var(--surface-2); }
  .cc-db { padding: 8px 20px 20px; }
  .cc-df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
  .cc-db .cc-df { padding: 14px 0 0; }
  .cc-confirm { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .cc-picks { display: grid; gap: 6px; }
  .cc-pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); }
  .cc-pick:hover, .cc-pick:focus-visible { border-color: var(--accent); }
  .cc-pick small { margin-left: auto; color: var(--muted); }

  /* Forms */
  .cc-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .cc-field { display: grid; gap: 5px; grid-column: span 2; }
  .cc-field.half { grid-column: span 1; }
  .cc-field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
  .cc-field input, .cc-field select, .cc-field textarea { width: 100%; min-height: 40px; padding: 8px 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
  .cc-field input:focus, .cc-field select:focus, .cc-field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .cc-field [aria-invalid="true"] { border-color: var(--bad); }
  .cc-err { color: var(--bad); font-size: .8rem; min-height: 0; }
  .cc-err:empty { display: none; }
  .cc-hint { color: var(--muted); font-size: .78rem; }
  .cc-intro { margin: 0 0 12px; color: var(--muted); }
  .cc-range { display: flex; gap: 10px; align-items: center; }
  .cc-range input { padding: 0; min-height: 0; accent-color: var(--accent); border: 0; background: none; }
  .cc-range output { min-width: 3.5em; text-align: right; font-weight: 700; }
  .cc-form.shake { animation: ccShake .35s; }
  @keyframes ccShake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @media (max-width: 480px) { .cc-field.half { grid-column: span 2; } }

  /* Popover + tooltip */
  .cc-pop { position: fixed; z-index: 85; max-height: 70vh; overflow: auto; background: var(--panel, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm, 12px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .25s; }
  .cc-pop.open { opacity: 1; transform: none; }
  .cc-tip { position: fixed; z-index: 95; pointer-events: none; min-width: 120px; max-width: 260px; padding: 9px 11px; border-radius: 10px; background: var(--tip-bg, #111); color: var(--tip-ink, #fff); font-size: .8rem; line-height: 1.45; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s; }
  .cc-tip.on { opacity: 1; }
  .cc-tip b { display: block; margin-bottom: 3px; }
  .cc-tip div { display: flex; align-items: center; gap: 6px; }
  .cc-tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cc-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-tip-tot { border-top: 1px solid rgba(255,255,255,.18); margin-top: 4px; padding-top: 4px; }

  /* Command search */
  .cc-cmdk .cc-dialog { align-self: start; margin-top: 10vh; }
  .cc-cmdk-q { width: 100%; min-height: 46px; padding: 0 14px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--accent); background: var(--surface-2); font-size: 1rem; }
  .cc-cmdk-q:focus { outline: none; }
  .cc-cmdk-list { list-style: none; margin: 10px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .cc-cmdk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .cc-cmdk-list li[aria-selected="true"], .cc-cmdk-list li:hover { background: var(--surface-2); color: var(--accent); }
  .cc-cmdk-list small { margin-left: auto; color: var(--muted); }
  .cc-cmdk-foot { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .cc-cmdk-foot kbd { padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line); font-family: inherit; }
  .cc-empty-li { color: var(--muted); cursor: default !important; }

  /* Data table */
  .cc-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cc-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm, 10px); border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
  .cc-search:focus-within { border-color: var(--accent); }
  .cc-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .84rem; font-weight: 600; transition: background .2s, color .2s; }
  .cc-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cc-tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
  .cc-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cc-tbl th button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
  .cc-tbl th svg { width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .5; }
  .cc-tbl th[aria-sort="ascending"] svg, .cc-tbl th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); }
  .cc-tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .cc-tbl tbody tr { animation: ccRow .35s both; animation-delay: calc(var(--r, 0) * 25ms); transition: background .15s; }
  .cc-tbl tbody tr[tabindex="0"] { cursor: pointer; }
  .cc-tbl tbody tr[tabindex="0"]:hover { background: var(--surface-2); }
  .cc-tbl .r, .cc-tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .cc-tbl th.r button { flex-direction: row-reverse; }
  @keyframes ccRow { from { opacity: 0; transform: translateY(6px); } }
  .cc-pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--muted); }
  .cc-pages { display: flex; gap: 4px; align-items: center; }
  .cc-pages button { min-width: 32px; height: 32px; padding: 0 6px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .cc-pages button[aria-current="page"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .cc-pages button:disabled { opacity: .4; cursor: default; }
  .cc-empty { display: grid; place-items: center; align-content: center; gap: 6px; padding: 28px 12px; text-align: center; color: var(--muted); }
  .cc-empty .ic { width: 30px; height: 30px; opacity: .6; }
  .cc-empty b { color: var(--ink); }

  /* Charts */
  .cc-chart { display: block; overflow: visible; }
  .cc-chart text, .cc-gauge text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cc-grid line { stroke: var(--grid, var(--line)); stroke-dasharray: 3 4; }
  .cc-zero { stroke: var(--line); }
  .cc-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .cc-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ccDraw 1.3s cubic-bezier(.4,.1,.2,1) forwards; }
  .cc-fade { animation: ccFade .9s .3s both; }
  .cc-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ccGrow .75s cubic-bezier(.2,.9,.25,1.05) both; transition: opacity .2s; }
  .cc-bar.neg { transform-origin: 50% 0; }
  .cc-cell { animation: ccPop .5s both; transform-box: fill-box; transform-origin: center; }
  .cc-static .cc-draw, .cc-static .cc-fade, .cc-static .cc-bar, .cc-static .cc-cell { animation: none; stroke-dashoffset: 0; }
  .cc-guide { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; }
  .cc-guide.on { opacity: .7; }
  .cc-dot { opacity: 0; stroke: var(--surface); stroke-width: 2; }
  .cc-dot.on { opacity: 1; }
  .cc-hit.on { fill: var(--ink); fill-opacity: .05; }
  @keyframes ccDraw { to { stroke-dashoffset: 0; } }
  @keyframes ccFade { from { opacity: 0; } }
  @keyframes ccGrow { from { transform: scaleY(0); } }
  @keyframes ccPop { from { opacity: 0; transform: scale(.4); } }
  .cc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .cc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cc-legend i, .cc-dlegend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cc-donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .cc-donut { position: relative; flex: none; }
  .cc-donut svg { display: block; }
  .cc-track { fill: none; stroke: var(--track, var(--surface-2)); stroke-linecap: round; }
  .cc-seg { fill: none; transition: opacity .2s, stroke-width .2s; cursor: pointer; }
  .cc-seg.dim { opacity: .3; }
  .cc-donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .cc-donut-c b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .cc-donut-c small { color: var(--muted); font-size: .76rem; }
  .cc-dlegend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: grid; gap: 4px; font-size: .86rem; }
  .cc-dlegend li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; transition: background .2s; }
  .cc-dlegend li.on { background: var(--surface-2); }
  .cc-dlegend em { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-dlegend small { color: var(--muted); min-width: 2.6em; text-align: right; }
  .cc-gauge { position: relative; display: grid; justify-items: center; }
  .cc-gfill { fill: none; stroke-linecap: round; }
  .cc-gauge-c { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; display: grid; }
  .cc-gauge-c b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .cc-gauge-c small { color: var(--muted); font-size: .78rem; }
  .cc-spark { display: block; overflow: visible; }
  .cc-spark .cc-line { stroke-width: 1.8; }

  /* Page entrance (apps can swap the keyframes via --enter) */
  .cc-in { animation: var(--enter, ccRise) .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes ccRise { from { opacity: 0; transform: translateY(16px) scale(.985); } }

  /* Reduced motion: everything still works, without big movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .cc-draw { stroke-dashoffset: 0; }
  }

  /* ---------- Shell ---------- */
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  [data-theme="dark"] body { background-image: linear-gradient(rgba(57,255,136,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,136,.035) 1px, transparent 1px); background-size: 40px 40px; }
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; color: var(--ink); text-decoration: none; font-weight: 900; font-size: 1.25rem; font-style: italic; letter-spacing: -.02em; }
  .brand svg { width: 32px; height: 32px; }
  [data-theme="dark"] .brand { text-shadow: 0 0 12px rgba(57,255,136,.5); }
  .nav { position: relative; display: grid; gap: 2px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; transition: color .2s; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--accent); }
  [data-theme="dark"] .nav a[aria-current="page"] { text-shadow: 0 0 10px rgba(57,255,136,.6); }
  .nav .ic { width: 19px; height: 19px; }
  .nav .mark { position: absolute; left: 0; right: 0; top: 0; border-radius: 10px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: 0 0 0 0 transparent; transition: transform .45s cubic-bezier(.3,1.3,.5,1), height .3s; }
  [data-theme="dark"] .nav .mark { box-shadow: 0 0 14px rgba(57,255,136,.35), inset 0 0 12px rgba(57,255,136,.12); }
  .side-card { margin-top: auto; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: .82rem; }
  .side-card b { display: block; font-size: 1.15rem; margin-top: 2px; }
  main { min-width: 0; padding: 18px 26px 44px; overflow-x: clip; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .top .grow { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 0; color: var(--muted); }
  .icon-btn { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .2s, box-shadow .2s, transform .12s; }
  .icon-btn:hover { border-color: var(--accent); }
  [data-theme="dark"] .icon-btn:hover { box-shadow: 0 0 12px rgba(57,255,136,.35); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn .ic { width: 19px; height: 19px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--pink); color: #fff; font-size: .64rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
  .badge:empty { display: none; }
  [data-theme="dark"] .t-sun, [data-theme="light"] .t-moon { display: none; }
  .menu-btn, .scrim { display: none; }
  .btn { border-radius: 10px; }
  [data-theme="dark"] .btn.primary { box-shadow: 0 0 18px rgba(57,255,136,.45); }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }

    const mv = (ev) => { s.dx = ev.clientX - s.x; s.dy = ev.clientY - s.y; if (Math.abs(s.dx) + Math.abs(s.dy) > 4) s.moved = true; if (move) move(s, ev); };
    const up = (ev) => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); if (end) end(s, ev); };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  });
}

/* Animate a number inside every [data-count] element of a root */
function countAll(root) { $$("[data-to]", root).forEach((el) => countUp(el, +el.dataset.to, FMT[el.dataset.f || "money"] || FMT.money)); }
const FMT = { money: (v) => money(v), short: (v) => moneyShort(v), num: (v) => num(Math.round(v)), pct: (v) => v.toFixed(1) + "%", int: (v) => num(Math.round(v)), usd2: (v) => money(v, { sym: "$", dp: 2 }) };

const catC = (c) => (CATS[c] ? CATS[c][1] : "#888");

function seed() {
  reseed(9090);
  const accts = [{ id: "chk", name: "Everyday checking", kind: "Checking", bal: 4820.55 }, { id: "sav", name: "High-yield savings", kind: "Savings", bal: 18240.1 }, { id: "inv", name: "Index investments", kind: "Investment", bal: 26410.0 }, { id: "cc", name: "Neon credit card", kind: "Credit", bal: -1284.32, limit: 6000 }];
  accts.forEach((a) => (a.hist = walk(a.bal, 30)));
  const merch = { Groceries: ["Fresh Basket", "Corner Market", "Green Grocer"], Dining: ["Noodle Bar", "Taco Lab", "Sunrise Cafe"], Transport: ["City Metro", "Ride Share", "Fuel Stop"], Shopping: ["Thread & Co", "Gadget Hub", "Book Nook"], Home: ["Hardware Depot", "Home Goods"], Fun: ["Cinema Plex", "Game Store", "Bowling Alley"], Health: ["Pharmacy Plus", "Gym Pass"], Subscriptions: ["Music Stream", "Cloud Drive", "Video Stream"] };
  const RANGE = { Groceries: [12, 95], Dining: [8, 60], Transport: [3, 40], Shopping: [18, 160], Home: [15, 140], Fun: [8, 70], Health: [6, 60], Subscriptions: [5, 16] };
  const tx = [];
  for (let i = 0; i < 64; i++) { const c = pick(Object.keys(CATS)), d = addDays(TODAY, -randi(0, 59)); tx.push({ id: uid(), date: iso(d), who: pick(merch[c]), cat: c, amt: -(Math.round(rand(...RANGE[c]) * 100) / 100), acct: R() < 0.6 ? "cc" : "chk" }); }
  [0, 1].forEach((m) => [1, 15].forEach((day) => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - m, day); if (d <= TODAY) tx.push({ id: uid(), date: iso(d), who: "Payroll · Lumen Works", cat: "Income", amt: 2650, acct: "chk" }); }));
  tx.sort((a, b) => (a.date < b.date ? 1 : -1));
  const hist = { in: Array.from({ length: 12 }, () => 5300 + randi(-200, 900)), out: Array.from({ length: 12 }, () => randi(3100, 4600)) };
  const budgets = { Groceries: 520, Dining: 260, Transport: 180, Shopping: 360, Home: 320, Fun: 180, Health: 200, Subscriptions: 70 };
  const cards = [{ id: uid(), name: "Main card", kind: "Physical", last4: "4417", c1: "#39ff88", c2: "#2be4ff", frozen: false, limit: 2500, online: true }, { id: uid(), name: "Online shopping", kind: "Virtual", last4: "9083", c1: "#ff2bd6", c2: "#7a5cff", frozen: false, limit: 400, online: true }, { id: uid(), name: "Subscriptions", kind: "Virtual", last4: "2265", c1: "#ffe14d", c2: "#ff8a3d", frozen: true, limit: 80, online: true }];
  const goals = [["Japan trip", 4500, 2810, "plane"], ["New laptop", 1800, 1240, "phone"], ["Emergency fund", 12000, 8600, "shield"], ["Concert tickets", 300, 90, "star"]].map(([name, target, saved, icon]) => ({ id: uid(), name, target, saved, icon, due: iso(addDays(TODAY, randi(40, 300))) }));
  const bills = [["Rent", 1450, 1, true], ["Electricity", 86.4, 8, true], ["Phone", 39, 12, false], ["Internet", 55, 18, true], ["Gym", 32, 22, false], ["Music Stream", 10.99, 25, true], ["Car insurance", 112, 27, false]].map(([name, amt, day, auto]) => ({ id: uid(), name, amt, day, auto, paid: day < TODAY.getDate() }));
  return { v: 1, accts, tx, hist, budgets, cards, goals, bills, prefs: { notify: true, round: true, weekly: false }, profile: { name: "Maya Chen", email: "maya@example.com" }, notes: [{ id: uid(), text: "Dining is at 84% of its budget", read: false }, { id: uid(), text: "Phone bill due in 3 days", read: false }, { id: uid(), text: "Payday! $2,650.00 landed", read: true }] };
}
function walk(end, n) { const a = [end]; let v = end; for (let i = 1; i < n; i++) { v -= (R() - 0.45) * Math.abs(end) * 0.03; a.push(v); } return a.reverse(); }
let S = store.get(KEY, null);

/* Add or edit a transaction: balances follow */
function txForm(row) {
  formModal({
    title: row ? "Edit transaction" : "Add transaction", drawer: true,
    values: row ? { ...row, kind: row.amt > 0 ? "in" : "out", amt: Math.abs(row.amt) } : { date: iso(TODAY), cat: "Groceries", acct: "cc", kind: "out" },
    fields: [{ name: "kind", label: "Type", type: "select", options: [["out", "Money out"], ["in", "Money in"]], half: true }, { name: "amt", label: "Amount ($)", type: "number", required: true, min: 0.01, half: true }, { name: "who", label: "Merchant or payer", required: true }, { name: "cat", label: "Category", type: "select", options: Object.keys(CATS).concat(["Income"]), half: true }, { name: "date", label: "Date", type: "date", required: true, half: true }, { name: "acct", label: "Account", type: "select", options: S.accts.map((a) => [a.id, a.name]) }],

      if (row) { acct(row.acct).bal -= row.amt; Object.assign(row, rec); } else S.tx.unshift({ id: uid(), ...rec });

  });
}

  $("#csv").addEventListener("click", () => { const csv = [["Date", "Merchant", "Category", "Account", "Amount"]].concat(S.tx.map((t) => [t.date, `"${t.who}"`, t.cat, `"${acct(t.acct).name}"`, t.amt])).map((r) => r.join(",")).join("\n"); try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "voltra-transactions.csv"; a.click(); toast("CSV downloaded"); } catch (e) { toast("Downloads are blocked here", "warn"); } });
};

/* ---------- Budgets ---------- */
PAGE.budgets = () => {
  const tot = sum(Object.values(S.budgets)), sp = sum(Object.keys(S.budgets).map((c) => spentCat(c)));
  const day = TODAY.getDate(), dim = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate();
  view.innerHTML = `<div class="grid">
    <div class="card kpi s4 neon"><div class="lbl">${ic("pie")}Budgeted</div><div class="val" data-to="${tot}" data-f="usd2">$0</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("out")}Spent</div><div class="val" data-to="${sp}" data-f="usd2">$0</div><span class="delta muted">${Math.round((sp / tot) * 100)}% used, ${Math.round((day / dim) * 100)}% of month gone</span></div>
    <div class="card kpi s4"><div class="lbl">${ic("leaf")}Left</div><div class="val ${tot - sp < 0 ? "down" : ""}" data-to="${tot - sp}" data-f="usd2">$0</div><span class="delta muted">${money((tot - sp) / Math.max(1, dim - day + 1))} a day to stay on track</span></div>
    <section class="card s12"><div class="card-h"><h2>Categories</h2><small>click a ring to change its limit</small><span class="grow"></span><button class="btn primary" id="editAll">${ic("edit")}Edit all</button></div><div class="ring-grid">${Object.entries(S.budgets).map(([c, b]) => `<button type="button" class="bring card" data-cat="${c}" style="border-style:dashed"><div class="gwrap" data-g="${c}"></div><b>${c}</b><br><small class="muted">${money(spentCat(c))} of ${money(b, { dp: 0 })}</small></button>`).join("")}</div></section>
  </div>`;
  Object.entries(S.budgets).forEach(([c, b]) => { const s = spentCat(c), p = (s / b) * 100; gauge($(`[data-g="${c}"]`), { value: Math.min(p, 100), max: 100, color: p > 100 ? "var(--bad)" : catC(c), label: p > 100 ? "over!" : "used", fmt: () => Math.round(p) + "%", size: 170, thick: 12, tip: money(Math.max(0, b - s)) + " left" }); });
  view.querySelector(".ring-grid").addEventListener("click", (e) => { const b = e.target.closest("[data-cat]"); if (!b) return; const c = b.dataset.cat; formModal({ title: c + " budget", values: { amt: S.budgets[c] }, intro: `Spent so far: ${money(spentCat(c))}. Last month: ${money(spentCat(c, NOWM - 1))}.`, fields: [{ name: "amt", label: "Monthly limit ($)", type: "number", required: true, min: 0 }], onSubmit: (v) => { S.budgets[c] = v.amt; save(); toast(c + " limit saved"); rerender(); } }); });
  $("#editAll").addEventListener("click", () => formModal({ title: "Monthly limits", values: S.budgets, fields: Object.keys(S.budgets).map((c) => ({ name: c, label: c + " ($)", type: "number", required: true, min: 0, half: true })), submit: "Save all", onSubmit: (v) => { S.budgets = v; save(); toast("Budgets saved"); rerender(); } }));
};

/* ---------- Cards (3D tilt) ---------- */
const vcardHTML = (c) => `<div class="tilt-wrap"><div class="vcard${c.frozen ? " frozen" : ""}" data-vc="${c.id}" style="--c1:${c.c1};--c2:${c.c2}"><div class="grid-lines"></div><div class="row"><b style="font-style:italic;letter-spacing:-.02em">VOLTRA</b><small>${c.kind}</small></div><div class="pan" data-pan>•••• •••• •••• ${c.last4}</div><div class="row"><div><small>Card</small><b>${esc(c.name)}</b></div><div style="text-align:right"><small>Limit</small><b>${money(c.limit, { dp: 0 })}</b></div></div><div class="glare"></div><div class="frozen-l">FROZEN</div></div></div>`;
PAGE.cards = () => {
  view.innerHTML = `<div class="card-h"><span class="muted">Move your pointer over a card to tilt it.</span><span class="grow"></span><button class="btn primary" id="newVC">${ic("plus")}New virtual card</button></div><div class="vcards">${S.cards.map((c) => `<section class="card">${vcardHTML(c)}<div class="vctl"><span style="display:flex;align-items:center;gap:8px"><button type="button" class="switch" role="switch" aria-checked="${c.frozen}" data-fr="${c.id}" aria-label="Freeze ${esc(c.name)}"></button>Freeze</span><span style="display:flex;align-items:center;gap:8px"><button type="button" class="switch" role="switch" aria-checked="${c.online}" data-on="${c.id}" aria-label="Online payments for ${esc(c.name)}"></button>Online</span><span class="grow" style="flex:1"></span><button class="btn sm" data-show="${c.id}">${ic("eye")}Show</button><button class="btn sm" data-lim="${c.id}">${ic("sliders")}Limit</button>${c.kind === "Virtual" ? `<button class="btn sm" data-del="${c.id}" aria-label="Delete ${esc(c.name)}">${ic("trash")}</button>` : ""}</div></section>`).join("")}</div>`;
  /* tilt follows the pointer, then eases back */
  $$(".vcard", view).forEach((el) => {
    el.addEventListener("pointermove", (e) => { if (RM) return; const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; el.classList.add("live"); el.style.transform = `rotateY(${(x - 0.5) * 22}deg) rotateX(${(0.5 - y) * 18}deg) scale(1.03)`; el.style.setProperty("--gx", x * 100 + "%"); el.style.setProperty("--gy", y * 100 + "%"); });
    el.addEventListener("pointerleave", () => { el.classList.remove("live"); el.style.transform = ""; });
  });
  view.querySelector(".vcards").addEventListener("click", (e) => {
    const fr = e.target.closest("[data-fr]"), on = e.target.closest("[data-on]"), sh = e.target.closest("[data-show]"), li = e.target.closest("[data-lim]"), de = e.target.closest("[data-del]");
    const c = S.cards.find((x) => x.id === (fr || on || sh || li || de || {}).dataset?.[fr ? "fr" : on ? "on" : sh ? "show" : li ? "lim" : "del"]);
    if (!c) return;
    if (fr) { c.frozen = !c.frozen; fr.setAttribute("aria-checked", String(c.frozen)); $(`[data-vc="${c.id}"]`).classList.toggle("frozen", c.frozen); save(); toast(c.frozen ? c.name + " frozen" : c.name + " unfrozen"); }
    if (on) { c.online = !c.online; on.setAttribute("aria-checked", String(c.online)); save(); toast("Online payments " + (c.online ? "on" : "off")); }
    if (sh) { const pan = $(`[data-vc="${c.id}"] [data-pan]`), full = `5310 ${String(hue(c.id) % 9000 + 1000)} ${String(hue(c.name) % 9000 + 1000)} ${c.last4}`; const showing = pan.textContent.startsWith("5310"); pan.textContent = showing ? `•••• •••• •••• ${c.last4}` : full; sh.innerHTML = ic("eye") + (showing ? "Show" : "Hide"); if (!showing) setTimeout(() => { if (pan.isConnected) { pan.textContent = `•••• •••• •••• ${c.last4}`; sh.innerHTML = ic("eye") + "Show"; } }, 8000); }
    if (li) formModal({ title: c.name + " limit", values: { limit: c.limit }, fields: [{ name: "limit", label: "Monthly limit ($)", type: "number", required: true, min: 1, max: 20000 }], onSubmit: (v) => { c.limit = v.limit; save(); toast("Limit saved"); rerender(); } });
    if (de) confirmBox(`Delete the virtual card "${c.name}"? It stops working right away.`).then((ok) => { if (ok) { S.cards = S.cards.filter((x) => x !== c); save(); toast("Card deleted"); rerender(); } });
  });
  $("#newVC").addEventListener("click", () => formModal({ title: "New virtual card", values: { limit: 100, color: "pink" }, fields: [{ name: "name", label: "Card name", required: true, placeholder: "e.g. Free trials" }, { name: "limit", label: "Monthly limit ($)", type: "number", required: true, min: 1, max: 5000, half: true }, { name: "color", label: "Glow", type: "select", options: [["green", "Green"], ["pink", "Pink"], ["cyan", "Cyan"], ["gold", "Gold"]], half: true }], submit: "Create card", onSubmit: (v) => { const col = { green: ["#39ff88", "#2be4ff"], pink: ["#ff2bd6", "#7a5cff"], cyan: ["#2be4ff", "#39ff88"], gold: ["#ffe14d", "#ff8a3d"] }[v.color]; S.cards.push({ id: uid(), name: v.name, kind: "Virtual", last4: String(randi(1000, 9999)), c1: col[0], c2: col[1], frozen: false, limit: v.limit, online: true }); save(); toast("Virtual card ready to use"); note(`Virtual card "${v.name}" created`); rerender(); } }));
};

/* ---------- Goals ---------- */
PAGE.goals = () => {
  view.innerHTML = `<div class="grid">${S.goals.map((g) => { const p = clamp((g.saved / g.target) * 100, 0, 100), days = Math.max(1, Math.ceil((new Date(g.due) - TODAY) / 864e5)); return `<section class="card s6" data-goal="${g.id}"><div class="card-h"><span class="cat-ic" style="color:var(--accent)">${ic(g.icon)}</span><div><h2>${esc(g.name)}</h2><small>by ${fdateY(g.due)}</small></div><span class="grow"></span><div class="rowbtns"><button data-g="edit" aria-label="Edit">${ic("edit")}</button><button data-g="del" aria-label="Delete">${ic("trash")}</button></div></div><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:1.4rem">${money(g.saved, { dp: 0 })}</b><span class="muted">of ${money(g.target, { dp: 0 })} · ${Math.round(p)}%</span></div><div class="pbar" style="height:12px;margin:10px 0"><i data-w="${p}" style="background:linear-gradient(90deg,var(--cyan),var(--accent));color:var(--accent)"></i></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><small class="muted">${g.saved >= g.target ? "Done!" : money((g.target - g.saved) / Math.max(1, days / 30), { dp: 0 }) + " a month to make it"}</small><button class="btn sm primary" data-g="add">${ic("plus")}Add money</button></div></section>`; }).join("")}<section class="card s6" style="display:grid;place-items:center;min-height:160px;border-style:dashed"><button class="btn" id="newG">${ic("plus")}New goal</button></section></div>`;
  fillBars();
  view.querySelector(".grid").addEventListener("click", (e) => {
    const b = e.target.closest("[data-g]"); if (!b) return;
    const g = S.goals.find((x) => x.id === b.closest("[data-goal]").dataset.goal), act = b.dataset.g;
    if (act === "add") formModal({ title: "Add to " + g.name, intro: `Moves money from ${acct("sav").name}.`, fields: [{ name: "amt", label: "Amount ($)", type: "number", required: true, min: 1, max: Math.max(1, acct("sav").bal) }], onSubmit: (v) => { acct("sav").bal -= v.amt; g.saved += v.amt; save(); toast(g.saved >= g.target ? `Goal reached: ${g.name}!` : `${Math.round((g.saved / g.target) * 100)}% there`); rerender(); } });
    if (act === "edit") goalForm(g);
    if (act === "del") confirmBox(`Delete "${g.name}"? ${money(g.saved)} goes back to savings.`).then((ok) => { if (ok) { acct("sav").bal += g.saved; S.goals = S.goals.filter((x) => x !== g); save(); toast("Goal deleted"); rerender(); } });
  });
  $("#newG").addEventListener("click", () => goalForm());
};
function goalForm(g) { formModal({ title: g ? "Edit goal" : "New goal", values: g || { icon: "star", due: iso(addDays(TODAY, 180)) }, fields: [{ name: "name", label: "Goal", required: true }, { name: "target", label: "Target ($)", type: "number", required: true, min: 1, half: true }, { name: "due", label: "By", type: "date", required: true, half: true, check: (v) => (new Date(v) <= TODAY ? "Pick a future date" : "") }, { name: "icon", label: "Icon", type: "select", options: [["star", "Star"], ["plane", "Travel"], ["phone", "Gadget"], ["shield", "Safety"], ["home", "Home"], ["gift", "Gift"]] }], onSubmit: (v) => { if (g) Object.assign(g, v); else S.goals.push({ id: uid(), saved: 0, ...v }); save(); toast(g ? "Goal saved" : "Goal created"); rerender(); } }); }

/* ---------- Bills ---------- */
PAGE.bills = () => {
  const dim = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate(), due = sum(S.bills.filter((b) => !b.paid).map((b) => b.amt));
  view.innerHTML = `<div class="grid">
    <div class="card kpi s4 neon"><div class="lbl">${ic("receipt")}Due this month</div><div class="val" data-to="${due}" data-f="usd2">$0</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("check")}Paid</div><div class="val" data-to="${sum(S.bills.filter((b) => b.paid).map((b) => b.amt))}" data-f="usd2">$0</div></div>
    <div class="card kpi s4"><div class="lbl">${ic("repeat")}On autopay</div><div class="val">${S.bills.filter((b) => b.auto).length} of ${S.bills.length}</div></div>
    <section class="card s12"><div class="card-h"><h2>${MON[TODAY.getMonth()]} at a glance</h2><small>pink = due, green = paid</small></div><div class="bills-strip" aria-hidden="true">${Array.from({ length: dim }, (_, i) => { const b = S.bills.filter((x) => x.day === i + 1); return `<span class="${b.length ? "has" : ""} ${b.length && b.every((x) => x.paid) ? "paid" : ""} ${i + 1 === TODAY.getDate() ? "today" : ""}" title="${b.map((x) => x.name).join(", ")}">${i + 1}</span>`; }).join("")}</div>
      <div id="billTbl"></div></section>
  </div>`;
  dataTable($("#billTbl"), { rows: () => S.bills.map((b) => ({ ...b, status: b.paid ? "Paid" : b.day < TODAY.getDate() ? "Late" : "Due", _b: b })), sort: "day", dir: 1, search: "Search bills…", keys: ["name"], chips: { k: "status", values: ["All", "Due", "Late", "Paid"] }, cols: [{ k: "day", label: "Day", f: (v) => fdate(new Date(TODAY.getFullYear(), TODAY.getMonth(), v)) }, { k: "name", label: "Bill", f: (v) => `<b>${esc(v)}</b>` }, { k: "amt", label: "Amount", cls: "r", f: (v) => money(v) }, { k: "auto", label: "Autopay", sort: false, f: (v, r) => `<button type="button" class="switch" role="switch" aria-checked="${v}" data-act="auto" aria-label="Autopay ${esc(r.name)}"></button>` }, { k: "status", label: "Status", f: (v) => `<span class="${v === "Paid" ? "up" : v === "Late" ? "down" : "muted"}" style="font-weight:700">${v}</span>` }, { k: "x", label: "", sort: false, f: (v, r) => `<div class="rowbtns">${r.paid ? "" : `<button data-act="pay" aria-label="Pay ${esc(r.name)}">${ic("check")}</button>`}<button data-act="del" aria-label="Delete">${ic("trash")}</button></div>` }], onAct: (a, r, el) => { const b = r._b; if (a === "auto") { b.auto = !b.auto; el.setAttribute("aria-checked", String(b.auto)); save(); toast(`Autopay ${b.auto ? "on" : "off"} for ${b.name}`); } else if (a === "pay") { if (acct("chk").bal < b.amt) return toast("Not enough in checking", "bad"); acct("chk").bal -= b.amt; b.paid = true; S.tx.unshift({ id: uid(), date: iso(TODAY), who: b.name, cat: "Home", amt: -b.amt, acct: "chk" }); save(); toast(b.name + " paid"); rerender(); } else confirmBox(`Delete the bill "${b.name}"?`).then((ok) => { if (ok) { S.bills = S.bills.filter((x) => x !== b); save(); toast("Bill deleted"); rerender(); } }); }, empty: "No bills here", emptyIcon: "receipt" });
  $("#billTbl .cc-tbar").insertAdjacentHTML("beforeend", `<button class="btn primary" id="addBill" style="margin-left:auto">${ic("plus")}Add bill</button>`);
  $("#addBill").addEventListener("click", () => formModal({ title: "New bill", values: { day: 1, auto: "no" }, fields: [{ name: "name", label: "Bill", required: true }, { name: "amt", label: "Amount ($)", type: "number", required: true, min: 0.01, half: true }, { name: "day", label: "Day of month", type: "number", required: true, min: 1, max: 31, half: true }, { name: "auto", label: "Autopay", type: "select", options: [["no", "Off"], ["yes", "On"]] }], onSubmit: (v) => { S.bills.push({ id: uid(), name: v.name, amt: v.amt, day: v.day, auto: v.auto === "yes", paid: false }); save(); toast("Bill added"); rerender(); } }));
};

/* ---------- Insights ---------- */
PAGE.insights = () => {
  const cats = Object.keys(CATS).map((c) => ({ label: c, value: spentCat(c) + spentCat(c, NOWM - 1), color: catC(c) }));
  const top = cats.slice().sort((a, b) => b.value - a.value)[0], dine = spentCat("Dining"), dineL = spentCat("Dining", NOWM - 1);
  const weeks = 8, data = DAY.map(() => Array(weeks).fill(0));
  S.tx.forEach((t) => { if (t.amt >= 0) return; const d = new Date(t.date), w = Math.floor((TODAY - d) / (7 * 864e5)); if (w < weeks) data[d.getDay()][weeks - 1 - w] += -t.amt; });
  const subs = S.tx.filter((t) => t.cat === "Subscriptions" && mk(t.date) === NOWM);
  const ins = [["bulb", `${top.label} is your biggest category`, `${money(top.value)} over two months. That is ${Math.round((top.value / sum(cats.map((c) => c.value))) * 100)}% of all spending.`], ["bowl", dine > dineL ? "Dining is up" : "Dining is down", `${money(dine)} so far this month vs ${money(dineL)} last month.`], ["repeat", `${subs.length} subscription payments this month`, `Total ${money(-sum(subs.map((t) => t.amt)))}. Cancel one you do not use and save every month.`], ["leaf", "You could save more", `Moving ${money(Math.max(25, Math.round((monthIn() - monthOut()) * 0.2)))} to savings each payday keeps your goals on track.`]];
  view.innerHTML = `<div class="grid">
    ${ins.map(([i, h, t]) => `<section class="card s3 insight"><span class="cat-ic">${ic(i)}</span><div><b>${esc(h)}</b><p class="muted" style="margin:4px 0 0;font-size:.86rem">${esc(t)}</p></div></section>`).join("")}
    <section class="card s5"><div class="card-h"><h2>Where it goes</h2><small>2 months</small></div><div id="iDonut"></div></section>
    <section class="card s7"><div class="card-h"><h2>This month vs last</h2></div><div id="iBars"></div></section>
    <section class="card s12"><div class="card-h"><h2>Spending heat</h2><small>by weekday, last 8 weeks</small></div><div id="iHeat"></div></section>
  </div>`;
  donut($("#iDonut"), { items: cats, size: 170, thick: 16, center: ["$" + short(sum(cats.map((c) => c.value))), "spent"], fmt: (v) => money(v) });
  barChart($("#iBars"), { labels: Object.keys(CATS), height: 240, radius: 3, series: [{ name: "Last month", data: Object.keys(CATS).map((c) => spentCat(c, NOWM - 1)), color: "var(--muted)" }, { name: "This month", data: Object.keys(CATS).map((c) => spentCat(c)), color: "var(--accent)" }], fmt: (v) => "$" + short(v), tipFmt: (v) => money(v) });
  heatmap($("#iHeat"), { rows: DAY, cols: Array.from({ length: weeks }, (_, i) => (i === weeks - 1 ? "This wk" : weeks - 1 - i + "w ago")), data, color: "var(--pink)", fmt: (v) => money(v) });
};

/* ---------- Settings ---------- */
PAGE.settings = () => {
  const sw = (k, label, sub) => `<div class="set-row"><div><b>${label}</b><small>${sub}</small></div><button type="button" class="switch" role="switch" aria-checked="${!!S.prefs[k]}" data-pref="${k}" aria-label="${label}"></button></div>`;
  view.innerHTML = `<div class="grid">
    <section class="card s6"><div class="card-h"><h2>Profile</h2></div><div class="set-row"><div><b>${esc(S.profile.name)}</b><small>${esc(S.profile.email)}</small></div><button class="btn" id="prof">${ic("user")}Edit</button></div></section>
    <section class="card s6"><div class="card-h"><h2>Preferences</h2></div>${sw("notify", "Spending alerts", "When a budget passes 80%")}${sw("round", "Round-ups", "Round card payments up into savings")}${sw("weekly", "Weekly email", "A short Monday summary")}</section>
    <section class="card s12"><div class="set-row"><div><b>Theme</b><small>Black and neon, or clean light</small></div><button class="btn" data-theme-toggle>${ic("moon")}Toggle theme</button></div><div class="set-row"><div><b>Reset demo data</b><small>Accounts, transactions, cards, goals and bills</small></div><button class="btn danger" id="reset">${ic("refresh")}Reset demo data</button></div></section>
  </div>`;
  $$("[data-pref]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.pref; S.prefs[k] = !S.prefs[k]; b.setAttribute("aria-checked", String(S.prefs[k])); save(); toast(b.getAttribute("aria-label") + (S.prefs[k] ? " on" : " off")); }));
  $("#prof").addEventListener("click", () => formModal({ title: "Profile", values: S.profile, fields: [{ name: "name", label: "Name", required: true }, { name: "email", label: "Email", type: "email", required: true, check: (v) => (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? "" : "Enter a valid email") }], onSubmit: (v) => { S.profile = v; save(); toast("Profile saved"); rerender(); } }));
  $("#reset").addEventListener("click", () => confirmBox("Reset all demo data?", "Reset").then((ok) => { if (ok) { store.del(KEY); S = seed(); save(); drawBell(); toast("Demo data reset"); rerender(); } }));
};

/* ---------- Start ---------- */
drawBell();
initShell(() => pageCmds(PAGES, [{ label: "Add transaction", icon: "plus", run: () => txForm() }, { label: "Transfer money", icon: "swap", run: () => xfer() }, { label: "New goal", icon: "target", run: () => goalForm() }]));
startRouter(PAGES.map((p) => p[0]), "dashboard", render);
</script>
</body>
</html>
