<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inchworm · Segmented control</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #e9f2dc;
    --dots: rgba(64, 120, 40, 0.1);
    --card: #fffdf4;
    --ink: #1c3317;
    --muted: #6c7e62;
    --line: rgba(40, 80, 20, 0.12);
    --track: #f1ecd6;
    --track-edge: rgba(80, 70, 20, 0.12);
    --worm: #8fd65a;
    --worm-dark: #4da64a;
    --ring: rgba(30, 90, 30, 0.2);
    --leg: #2f6b2c;
    --bar: #a8dc7c;
    --bar-top: #5fb34f;
    --leaf: #4da64a;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1710;
    --dots: rgba(140, 220, 110, 0.06);
    --card: #16231a;
    --ink: #e5f3dc;
    --muted: #93a98a;
    --line: rgba(160, 230, 130, 0.12);
    --track: #1f2f22;
    --track-edge: rgba(160, 230, 130, 0.1);
    --worm: #93e35f;
    --worm-dark: #3f9a4a;
    --ring: rgba(10, 50, 10, 0.3);
    --leg: #a6e886;
    --bar: #3e7a3a;
    --bar-top: #8fd65a;
    --leaf: #8fd65a;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---------- Stage: a garden table with dotted soil and two swaying leaves ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; overflow: hidden; background: radial-gradient(var(--dots) 1.5px, transparent 1.6px) 0 0 / 22px 22px, var(--bg); }
  .frond { position: absolute; width: 160px; height: 160px; color: var(--leaf); opacity: 0.35; animation: frond 5s ease-in-out infinite; transform-origin: 0 100%; }
  .frond.f1 { left: -30px; bottom: -40px; }
  .frond.f2 { right: -20px; top: -20px; transform: rotate(180deg); animation-name: frond2; animation-duration: 6.4s; transform-origin: 50% 50%; }
  @keyframes frond { 50% { transform: rotate(6deg); } }
  @keyframes frond2 { 0%, 100% { transform: rotate(180deg); } 50% { transform: rotate(186deg); } }

  /* ---------- Card ---------- */
  .card { position: relative; width: min(440px, 100%); padding: 20px 20px 18px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 30px 60px -36px rgba(20, 60, 10, 0.5); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .top h1 { margin: 0; font-size: 1.1rem; letter-spacing: -0.01em; }
  .top p { margin: 3px 0 0; color: var(--muted); font-size: 0.8rem; }
  .total { text-align: right; }
  .total b { display: block; font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .total small { color: var(--muted); font-size: 0.74rem; }

  /* ---------- Segmented control ---------- */
  .seg { position: relative; margin: 22px 0 6px; height: 52px; padding: 7px; display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 999px; background: var(--track); box-shadow: inset 0 0 0 1px var(--track-edge), inset 0 3px 6px rgba(0, 0, 0, 0.06); }
  .worm { position: absolute; left: 0; top: -46px; width: 100%; height: calc(100% + 46px); overflow: visible; pointer-events: none; }
  .seg button {
    position: relative;
    z-index: 1;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.86rem;
    font-weight: 650;
    cursor: pointer;
    transition: color 0.25s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on { color: #173a12; font-weight: 750; }
  .seg button:focus-visible { outline: 3px solid var(--worm-dark); outline-offset: 2px; }
  .leaf { position: absolute; left: 0; top: 0; width: 9px; height: 13px; background: var(--leaf); border-radius: 0 100% 0 100%; pointer-events: none; z-index: 2; }

  /* ---------- Chart ---------- */
  .chart { position: relative; height: 168px; margin-top: 16px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 1.5px dashed var(--line); padding-bottom: 0; }
  .grid { position: absolute; inset: 0 0 0 0; background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 42px; pointer-events: none; }
  .bar { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar i { display: block; width: min(30px, 100%); border-radius: 9px 9px 3px 3px; background: linear-gradient(var(--bar-top), var(--bar)); transform-origin: 50% 100%; }
  .bar.top i { background: linear-gradient(var(--worm-dark), var(--bar-top)); }
  .bar .sprout { position: absolute; width: 22px; height: 18px; color: var(--worm-dark); transform-origin: 50% 100%; }
  .labels { display: flex; gap: 6px; margin-top: 6px; }
  .labels span { flex: 1; text-align: center; font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 420px) {
    .card { padding: 16px 14px 14px; }
    .seg button { font-size: 0.78rem; }
    .chart { height: 150px; gap: 4px; }
    .labels { gap: 4px; }
    .labels span { font-size: 0.62rem; }
  }
  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .card { scale: 1.32; } }
  @media (prefers-reduced-motion: reduce) {
    .frond { animation: none; }
    .seg button { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <svg class="frond f1" viewBox="0 0 100 100" aria-hidden="true"><path d="M4 96 C20 60 50 30 96 8 C80 40 60 70 4 96 Z" fill="currentColor" /><path d="M4 96 C40 60 66 34 96 8" stroke="#fff" stroke-opacity="0.4" fill="none" /></svg>
    <svg class="frond f2" viewBox="0 0 100 100" aria-hidden="true"><path d="M4 96 C20 60 50 30 96 8 C80 40 60 70 4 96 Z" fill="currentColor" /></svg>

    <article class="card">
      <div class="top">
        <div>
          <h1>Rooftop garden</h1>
          <p>Water used, in litres</p>
        </div>
        <div class="total"><b id="total">238</b><small id="unit">litres this week</small></div>
      </div>

      <div class="seg" id="seg" role="radiogroup" aria-label="Time range">
        <svg class="worm" id="worm" aria-hidden="true">
          <g id="legs" style="fill: var(--leg)"></g>
          <path id="shade" fill="none" stroke="#000" stroke-opacity="0.12" stroke-linecap="round" />
          <path id="edge" fill="none" style="stroke: var(--worm-dark)" stroke-opacity="0.55" stroke-linecap="round" />
          <path id="body" fill="none" style="stroke: var(--worm)" stroke-linecap="round" />
          <path id="rings" fill="none" style="stroke: var(--ring)" stroke-dasharray="2.5 9" />
          <path id="sheen" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="7" stroke-linecap="round" />
          <g id="head">
            <path id="ant1" d="M2 -21 Q4 -30 9 -35" fill="none" style="stroke: var(--worm-dark)" stroke-width="2" stroke-linecap="round" />
            <circle id="bob1" cx="9" cy="-35" r="2.6" style="fill: var(--worm-dark)" />
            <path id="ant2" d="M8 -19 Q13 -27 19 -29" fill="none" style="stroke: var(--worm-dark)" stroke-width="2" stroke-linecap="round" />
            <circle id="bob2" cx="19" cy="-29" r="2.6" style="fill: var(--worm-dark)" />
            <ellipse cx="9" cy="5" rx="3.5" ry="2.2" fill="#ff8fa3" opacity="0.6" />
            <g id="eyes">
              <circle cx="0" cy="-18" r="6.6" fill="#fff" stroke="#1d3b17" stroke-opacity="0.3" />
              <circle cx="13" cy="-16" r="6.6" fill="#fff" stroke="#1d3b17" stroke-opacity="0.3" />
              <circle id="p1" cx="1.5" cy="-17.5" r="3.1" fill="#152a12" />
              <circle id="p2" cx="14.5" cy="-15.5" r="3.1" fill="#152a12" />
              <rect id="lid" x="-8" y="-25.5" width="30" height="0" style="fill: var(--worm)" />
            </g>
            <path d="M6 2 q4 4 9 0" fill="none" stroke="#1d3b17" stroke-width="1.6" stroke-linecap="round" />
          </g>
        </svg>
        <button type="button" role="radio" aria-checked="false" tabindex="-1">Day</button>
        <button type="button" role="radio" aria-checked="true" tabindex="0" class="on">Week</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1">Month</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1">Year</button>
      </div>

      <div class="chart" id="chart" role="img" aria-label=""><div class="grid"></div></div>
      <div class="labels" id="labels" aria-hidden="true"></div>
    </article>
    <p class="sr" id="status" role="status" aria-live="polite"></p>
  </main>

<script>
  // Inchworm: a segmented control whose selector is an inchworm.
  // Pick = it turns to face the way (anticipation) → reaches forward, then pulls its tail up in an arch, once per
  // segment (main move) → old bars shrink while it walks, new bars spring up (progress) → it lands with a squash,
  // blinks and flicks off two leaves (finish) → idle breathing, crawling rings and blinking.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var seg = $("seg"), btns = [].slice.call(seg.querySelectorAll("button"));
    var body = $("body"), edge = $("edge"), shade = $("shade"), rings = $("rings"), sheen = $("sheen"), head = $("head"), legs = $("legs");
    var p1 = $("p1"), p2 = $("p2"), lid = $("lid"), chart = $("chart"), labels = $("labels"), total = $("total"), unit = $("unit"), status = $("status");
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var NS = "http://www.w3.org/2000/svg";

    // Litres of water per range
    var DATA = [
      { name: "Day", unit: "litres today", labels: ["6 am", "9 am", "12 pm", "3 pm", "6 pm", "9 pm"], values: [4, 9, 2, 3, 8, 5] },
      { name: "Week", unit: "litres this week", labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], values: [28, 34, 22, 40, 31, 45, 38] },
      { name: "Month", unit: "litres this month", labels: ["Week 1", "Week 2", "Week 3", "Week 4"], values: [210, 245, 198, 262] },
      { name: "Year", unit: "litres this year", labels: ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"], values: [520, 480, 610, 840, 1120, 1380, 1290, 1210, 980, 760, 560, 500] }
    ];
    var cur = 1, run = 0;

    // ---------- Worm state: left/right edges (px inside the track), arch height, thickness, facing ----------
    var W = { L: 0, R: 0, h: 0, T: 38, dir: 1, look: 0, blink: 0, squash: 0 };
    var CY = 46 + 26; // centre line inside the svg (it reaches 46px above the track)
    var legDots = [];
    for (var i = 0; i < 4; i++) { var c = document.createElementNS(NS, "ellipse"); c.setAttribute("rx", "3.2"); c.setAttribute("ry", "2.2"); legs.appendChild(c); legDots.push(c); }

    function box(k) { var b = btns[k]; return { l: b.offsetLeft + 1, r: b.offsetLeft + b.offsetWidth - 1 }; }
    function draw(now) {
      var breathe = calm.matches ? 0 : Math.sin(now / 520) * 1.2;
      var T = W.T + breathe + W.squash * 6;
      var half = T / 2;
      var xa = W.L + half, xb = Math.max(xa + 0.5, W.R - half);
      var h = W.h, k = (xb - xa) * 0.12;
      var d = "M" + xa.toFixed(1) + " " + CY + " C" + (xa + k).toFixed(1) + " " + (CY - h * 1.33).toFixed(1) + " " + (xb - k).toFixed(1) + " " + (CY - h * 1.33).toFixed(1) + " " + xb.toFixed(1) + " " + CY;
      [body, rings].forEach(function (p) { p.setAttribute("d", d); p.setAttribute("stroke-width", T.toFixed(1)); });
      shade.setAttribute("d", d); shade.setAttribute("stroke-width", T.toFixed(1)); shade.setAttribute("transform", "translate(0 3)");
      edge.setAttribute("d", d); edge.setAttribute("stroke-width", (T + 3).toFixed(1));
      sheen.setAttribute("d", d); sheen.setAttribute("transform", "translate(0 " + (-half * 0.45).toFixed(1) + ")");
      rings.setAttribute("stroke-dashoffset", calm.matches ? "0" : (-(now / 90) % 11.5).toFixed(2));
      // little legs stay on the ground at both ends
      var feet = [xa - 5, xa + 5, xb - 5, xb + 5];
      legDots.forEach(function (e, n) { e.setAttribute("cx", feet[n].toFixed(1)); e.setAttribute("cy", (CY + half - 1).toFixed(1)); });
      // head at the leading end, mirrored when facing left
      var hx = W.dir > 0 ? xb : xa;
      var bob = calm.matches ? 0 : Math.sin(now / 300) * 1.5;
      head.setAttribute("transform", "translate(" + hx.toFixed(1) + " " + (CY + bob * 0.3).toFixed(1) + ") scale(" + W.dir + " 1)");
      $("ant1").setAttribute("d", "M2 -21 Q" + (4 + bob) + " -30 " + (9 + bob) + " -35");
      $("bob1").setAttribute("cx", (9 + bob).toFixed(1));
      $("ant2").setAttribute("d", "M8 -19 Q" + (13 + bob * 0.7) + " -27 " + (19 + bob * 0.7) + " -29");
      $("bob2").setAttribute("cx", (19 + bob * 0.7).toFixed(1));
      p1.setAttribute("cx", (1.5 + W.look * 1.8).toFixed(1));
      p2.setAttribute("cx", (14.5 + W.look * 1.8).toFixed(1));
      lid.setAttribute("height", (Math.max(0, W.blink) * 15).toFixed(1));
    }
    function loop(now) { draw(now); requestAnimationFrame(loop); }

    // A small tween runner on requestAnimationFrame; stops when a newer pick starts
    function tween(ms, fn, id) {
      return new Promise(function (res) {
        var t0 = performance.now();
        function f(now) {
          if (id !== run) { res(false); return; }
          var t = Math.min(1, Math.max(0, now - t0) / ms);
          fn(t);
          if (t < 1) requestAnimationFrame(f); else res(true);
        }
        requestAnimationFrame(f);
      });
    }
    var outBack = function (t) { var s = 1.6; t -= 1; return t * t * ((s + 1) * t + s) + 1; };
    var inOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };

    // ---------- Chart ----------
    function buildChart(k, animate) {
      var d = DATA[k], max = Math.max.apply(null, d.values), top = d.values.indexOf(max);
      [].slice.call(chart.querySelectorAll(".bar")).forEach(function (b) { b.remove(); });
      labels.innerHTML = "";
      d.values.forEach(function (v, n) {
        var bar = document.createElement("div");
        bar.className = "bar" + (n === top ? " top" : "");
        var col = document.createElement("i");
        col.style.height = Math.max(4, (v / max) * 82) + "%";
        bar.appendChild(col);
        if (n === top) {
          bar.insertAdjacentHTML("beforeend", '<svg class="sprout" viewBox="0 0 22 18" aria-hidden="true"><path d="M11 18 V9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 10 C5 10 2 6 2 2 C7 2 11 5 11 10 Z" fill="currentColor"/><path d="M11 9 C16 9 20 6 20 1 C15 1 11 4 11 9 Z" fill="currentColor" opacity="0.75"/></svg>');
          bar.lastChild.style.bottom = "calc(" + Math.max(4, (v / max) * 82) + "% + 2px)";
        }
        chart.appendChild(bar);
        var lab = document.createElement("span");
        lab.textContent = d.labels[n];
        labels.appendChild(lab);
        if (animate && !calm.matches) {
          var delay = n * (240 / d.values.length);
          col.animate(springFrames(function (p) { return { transform: "scaleY(" + p.toFixed(3) + ")" }; }, 210, 13), { duration: 900, delay: delay, easing: "linear", fill: "backwards" });
          lab.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: delay, easing: "ease-out", fill: "backwards" });
          if (n === top) bar.lastChild.animate([{ transform: "scale(0) rotate(-30deg)" }, { transform: "scale(1.3) rotate(8deg)", offset: 0.6 }, { transform: "scale(1)" }], { duration: 520, delay: delay + 380, easing: "ease-out", fill: "backwards" });
        }
      });
      chart.setAttribute("aria-label", d.name + ": " + d.values.map(function (v, n) { return d.labels[n] + " " + v + " litres"; }).join(", "));
    }
    function springFrames(frame, stiff, damp) {
      var x = 0, v = 0, out = [];
      for (var n = 0; n < 54; n++) { out.push(frame(x)); v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; }
      out.push(frame(1));
      return out;
    }
    function shrinkChart() {
      if (calm.matches) return;
      [].slice.call(chart.querySelectorAll(".bar .sprout")).forEach(function (s) { s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: "forwards" }); });
      [].slice.call(chart.querySelectorAll(".bar i")).forEach(function (b, n) {
        b.animate([{ transform: "scaleY(1)", opacity: 1 }, { transform: "scaleY(0.05)", opacity: 0.4 }], { duration: 220, delay: n * 18, easing: "ease-in", fill: "forwards" });
      });
    }
    function countTo(to, id) {
      var from = parseInt(total.textContent.replace(/,/g, ""), 10) || 0;
      if (calm.matches) { total.textContent = to.toLocaleString("en-US"); return; }
      tween(700, function (t) { total.textContent = Math.round(from + (to - from) * inOut(t)).toLocaleString("en-US"); }, id);
    }

    // ---------- Leaves flicked off the head on landing ----------
    function leaves() {
      var hx = (W.dir > 0 ? W.R - 14 : W.L + 14), hy = 10;
      for (var n = 0; n < 3; n++) {
        var l = document.createElement("i");
        l.className = "leaf";
        seg.appendChild(l);
        var vx = W.dir * (16 + n * 14), up = -26 - n * 8;
        l.animate([
          { transform: "translate(" + hx + "px," + hy + "px) rotate(0) scale(0.3)", opacity: 0 },
          { transform: "translate(" + (hx + vx * 0.5) + "px," + (hy + up) + "px) rotate(" + (W.dir * 140) + "deg) scale(1)", opacity: 1, offset: 0.4 },
          { transform: "translate(" + (hx + vx) + "px," + (hy + 30) + "px) rotate(" + (W.dir * 320) + "deg) scale(0.8)", opacity: 0 }
        ], { duration: 820 + n * 120, easing: "cubic-bezier(0.3, 0.6, 0.5, 1)" }).finished.then((function (e) { return function () { e.remove(); }; })(l)).catch(function () {});
      }
    }
    function blink() {
      var t0 = performance.now();
      (function f(now) { var t = Math.min(1, Math.max(0, now - t0) / 180); W.blink = Math.sin(Math.PI * t); if (t < 1) requestAnimationFrame(f); else W.blink = 0; })(t0);
    }

    // ---------- Walking to a segment ----------
    async function walk(k, id) {
      var to = box(k), segW = to.r - to.l;
      var dir = to.l > W.L ? 1 : to.l < W.L ? -1 : W.dir;
      var n = Math.max(1, Math.round(Math.abs(to.l - W.L) / segW));
      // 1. Anticipation: look, turn round if needed, bunch up
      W.look = dir;
      var h0 = W.h; // an interrupted walk may still be arched: flatten it while bunching up
      if (dir !== W.dir) {
        var from = W.dir;
        await tween(160, function (t) { W.dir = t < 0.5 ? from : dir; W.squash = Math.sin(Math.PI * t) * 0.8; W.h = h0 * (1 - t); }, id);
      } else {
        await tween(130, function (t) { W.squash = Math.sin(Math.PI * t) * 0.6; W.h = h0 * (1 - t); }, id);
      }
      if (id !== run) return;
      // 2. Main move: reach forward, then pull the tail up in an arch, once per segment
      var sL = (to.l - W.L) / n, sR = (to.r - W.R) / n, fast = n > 2 ? 0.75 : 1;
      for (var s = 0; s < n; s++) {
        var L0 = W.L, R0 = W.R;
        var ok = await tween(230 * fast, function (t) {
          var e = outBack(t);
          if (dir > 0) W.R = R0 + sR * e; else W.L = L0 + sL * e;
        }, id);
        if (!ok) return;
        ok = await tween(260 * fast, function (t) {
          var e = inOut(t);
          if (dir > 0) W.L = L0 + sL * e; else W.R = R0 + sR * e;
          W.h = Math.sin(Math.PI * t) * Math.min(24, Math.abs(sL) * 0.34);
        }, id);
        if (!ok) return;
        W.h = 0;
      }
      W.L = to.l; W.R = to.r;
      // 3. Land: squash and settle, the label lights up
      btns.forEach(function (b, m) { b.classList.toggle("on", m === k); });
      leaves();
      blink();
      await tween(520, function (t) { W.squash = Math.sin(t * Math.PI * 2.5) * (1 - t) * 0.9; W.look = dir * (1 - t); }, id);
      W.squash = 0;
    }

    function pick(k, focus) {
      if (k === cur) return;
      var id = ++run;
      btns.forEach(function (b, m) {
        b.setAttribute("aria-checked", String(m === k));
        b.tabIndex = m === k ? 0 : -1;
      });
      if (focus) btns[k].focus();
      var prev = cur;
      cur = k;
      unit.textContent = DATA[k].unit;
      status.textContent = DATA[k].name + " selected: " + DATA[k].values.reduce(function (a, b) { return a + b; }, 0).toLocaleString("en-US") + " " + DATA[k].unit + ".";
      var sum = DATA[k].values.reduce(function (a, b) { return a + b; }, 0);
      if (calm.matches) {
        var b = box(k); W.L = b.l; W.R = b.r; W.h = 0; W.dir = k > prev ? 1 : -1;
        btns.forEach(function (bt, m) { bt.classList.toggle("on", m === k); });
        buildChart(k, false); total.textContent = sum.toLocaleString("en-US");
        return;
      }
      btns.forEach(function (bt) { bt.classList.remove("on"); });
      shrinkChart();
      countTo(sum, id);
      setTimeout(function () { if (id === run) buildChart(k, true); }, 300);
      walk(k, id);
    }

    btns.forEach(function (b, k) {
      b.addEventListener("click", function () { pick(k, false); });
      b.addEventListener("keydown", function (e) {
        var n = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (n) { e.preventDefault(); pick((cur + n + btns.length) % btns.length, true); }
        else if (e.key === "Home") { e.preventDefault(); pick(0, true); }
        else if (e.key === "End") { e.preventDefault(); pick(btns.length - 1, true); }
      });
    });
    // keep the worm on its segment when the layout changes
    addEventListener("resize", function () { var b = box(cur); run++; W.L = b.l; W.R = b.r; W.h = 0; W.squash = 0; btns.forEach(function (bt, m) { bt.classList.toggle("on", m === cur); }); });

    // ---------- Start ----------
    var b0 = box(cur); W.L = b0.l; W.R = b0.r;
    buildChart(cur, true);
    requestAnimationFrame(loop);
    // idle blinking
    setInterval(function () { if (!calm.matches && W.h === 0) blink(); }, 3400);

    // ---------- Auto demo: the worm walks around the ranges until a real input ----------
    var demoOn = !calm.matches, timer = 0, plan = [2, 3, 0, 1], step = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function demo() {
      if (!demoOn) return;
      pick(plan[step % plan.length], false);
      step++;
      timer = setTimeout(demo, 2600);
    }
    if (demoOn) timer = setTimeout(demo, 420);
  })();
</script>
</body>
</html>
