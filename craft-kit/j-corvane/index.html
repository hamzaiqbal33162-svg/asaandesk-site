<!doctype html>
<!-- Chill and Craft · Corvane · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corvane · Menswear tailoring house · Chill and Craft</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq && mq.matches ? "dark" : "light"; }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  :root {
    --bg: #f4efe6; --panel: #fbf8f2; --panel2: #e9e1d2; --ink: #0f1a2b; --muted: #5d6573; --line: #d8cfbe;
    --brass: #a37d3b; --brass2: #d4b06a; --ox: #6e2430; --ok: #2e6b4a; --bad: #a3272f;
    --navy: #0f1a2b; --ivory: #f4efe6;
    --shadow: 0 24px 50px -28px rgba(15, 26, 43, .5);
    --slow: cubic-bezier(.65, 0, .35, 1); --out: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.4, .64, 1);
    --serif: Didot, "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, serif; --sans: "Gill Sans", "Gill Sans MT", Optima, "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c1422; --panel: #132036; --panel2: #1b2a44; --ink: #f1ebe0; --muted: #a3acbb; --line: #24334f;
    --brass: #d4b06a; --brass2: #e8cc8e; --shadow: 0 24px 50px -28px rgba(0, 0, 0, .8); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--sans); overflow-x: clip; }
  a { color: inherit; }
  svg { display: block; max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.08; margin: 0 0 .45em; letter-spacing: .01em; }
  p { margin: 0 0 1em; }
  .wrap { width: min(1160px, 100% - 32px); margin-inline: auto; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 99; background: var(--ink); color: var(--bg); padding: 8px 14px; }
  .skip:focus { left: 8px; }
  .caps { font-size: .74rem; letter-spacing: .32em; text-transform: uppercase; color: var(--brass); }
  .lbl { display: block; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 6px; color: var(--muted); }
  .pin { background-image: repeating-linear-gradient(90deg, transparent 0 23px, color-mix(in srgb, var(--brass) 22%, transparent) 23px 24px); }

  /* ---------- Header: brass underline that stretches between links ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 70px; gap: 12px; }
  .nav { position: relative; display: flex; gap: 22px; }
  .nav a { font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; text-decoration: none; padding: 8px 0; transition: color .3s; }
  .nav a:hover, .nav a[aria-current="page"] { color: var(--brass); }
  .nav-mark { position: absolute; bottom: 2px; left: 0; height: 1.5px; width: 0; background: var(--brass); transition: left .7s var(--out), width .7s var(--out); }
  .mark { font-family: var(--serif); font-size: 1.55rem; letter-spacing: .34em; text-decoration: none; padding-left: .34em; }
  .tools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .bag-btn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; text-decoration: none; transition: transform .6s var(--spring), border-color .3s; }
  .bag-btn:hover { border-color: var(--brass); transform: translateY(-2px); }
  .bag-btn svg { width: 20px; height: 20px; }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--ox); color: #fff; font-size: .7rem; display: grid; place-items: center; }
  .bag-btn.bump { animation: swing .8s var(--spring); }
  @keyframes swing { 20% { transform: rotate(14deg) scale(1.12); } 45% { transform: rotate(-10deg); } 70% { transform: rotate(5deg); } }
  .menu-btn { display: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: none; place-items: center; }
  .menu-btn i { width: 16px; height: 1.5px; background: currentColor; box-shadow: 0 5px 0 currentColor, 0 -5px 0 currentColor; }
  @media (max-width: 820px) {
    .top-in { grid-template-columns: auto 1fr auto; }
    .mark { font-size: 1.2rem; justify-self: center; }
    .menu-btn { display: grid; }
    .nav { position: absolute; top: 70px; left: 0; right: 0; flex-direction: column; gap: 0; padding: 10px 16px 18px; background: var(--bg); border-bottom: 1px solid var(--line); clip-path: inset(0 0 100% 0); visibility: hidden; transition: clip-path .6s var(--slow), visibility .6s; }
    .nav.open { clip-path: inset(0 0 0 0); visibility: visible; }
    .nav a { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .nav-mark { display: none; }
  }

  /* ---------- Buttons and fields ---------- */
  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 28px; border: 1px solid var(--ink); background: transparent; font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; text-decoration: none; overflow: hidden; isolation: isolate; transition: color .5s var(--slow), transform .4s var(--spring); }
  .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ink); transform: scaleX(0); transform-origin: right; transition: transform .6s var(--slow); }
  .btn:hover { color: var(--bg); }
  .btn:hover::before { transform: scaleX(1); transform-origin: left; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; transition: transform .5s var(--out); }
  .btn:hover svg { transform: translateX(5px); }
  .btn-solid { background: var(--ink); color: var(--bg); }
  .btn-solid::before { background: var(--brass); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  input[type="text"], input[type="search"], input[type="email"], input[type="tel"], select, textarea { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 0; background: var(--panel); transition: border-color .3s, box-shadow .3s; }
  textarea { padding: 12px 14px; min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brass); box-shadow: 0 2px 0 var(--brass); }

  /* ---------- Route curtain: two pinstriped drapes meet and part ---------- */
  .curtain { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
  .curtain i { position: absolute; top: 0; bottom: 0; width: 51%; background: var(--navy) repeating-linear-gradient(90deg, transparent 0 17px, rgba(212, 176, 106, .25) 17px 18px); transform: translateX(-101%); }
  .curtain i + i { right: 0; transform: translateX(101%); }
  main { min-height: 70vh; outline: none; }
  .view > * { animation: rise 1s var(--out) both; }
  .view > *:nth-child(2) { animation-delay: .1s; }
  .view > *:nth-child(n+3) { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } }
  .rv { opacity: 0; transform: translateY(30px); transition: opacity 1.1s var(--out), transform 1.1s var(--out); transition-delay: calc(var(--d, 0) * 110ms); }
  .rv.in { opacity: 1; transform: none; }

  /* ---------- Film hero: a tall track with a sticky stage driven by scroll ---------- */
  .film { position: relative; height: 430vh; background: var(--navy); color: var(--ivory); }
  .stage { position: sticky; top: 0; height: 100vh; min-height: 520px; overflow: hidden; display: grid; place-items: center; }
  .stage::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 31px, rgba(212, 176, 106, .07) 31px 32px), radial-gradient(ellipse at 50% 40%, #1c2c4a, #0a1220 70%); }
  .scn { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .8s var(--slow); pointer-events: none; }
  .scn.on { opacity: 1; pointer-events: auto; }
  .scn svg { width: min(92vw, 980px); height: auto; max-height: 72vh; }
  .word text { font-family: var(--serif); font-size: 150px; letter-spacing: 14px; fill: var(--ivory); }
  .thread { fill: none; stroke: #d4b06a; stroke-width: 5; stroke-linecap: round; }
  .thread.glow { stroke: #ffe3a3; stroke-width: 10; opacity: .25; filter: blur(4px); }
  .cap { position: absolute; left: 50%; bottom: 9vh; width: min(560px, 100% - 40px); translate: -50% 0; text-align: center; z-index: 2; }
  .cap h2 { font-size: clamp(1.5rem, 3.8vw, 2.6rem); margin: 6px 0; color: var(--ivory); }
  .cap p { color: #c6cdd8; margin: 0; }
  .cap .caps { color: var(--brass2); }
  .cap .w { display: inline-block; opacity: 0; transform: translateY(12px); transition: opacity .6s var(--out), transform .6s var(--out); transition-delay: calc(var(--i) * 60ms); }
  .scn.on .cap .w { opacity: 1; transform: none; }
  .film-ui { position: absolute; z-index: 3; right: 22px; top: 50%; translate: 0 -50%; display: grid; justify-items: center; gap: 10px; color: var(--brass2); font-size: .72rem; letter-spacing: .2em; }
  .rail { position: relative; width: 2px; height: 160px; background: rgba(212, 176, 106, .25); }
  .rail i { position: absolute; left: 0; top: 0; width: 2px; height: 100%; background: var(--brass2); transform-origin: top; transform: scaleY(var(--p, 0)); }
  .rail b { position: absolute; left: 50%; top: calc(var(--p, 0) * 100%); width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--brass2); box-shadow: 0 0 12px #e8cc8e; }
  .skip-film { position: absolute; z-index: 3; left: 22px; bottom: 22px; border: 1px solid rgba(212, 176, 106, .5); background: rgba(10, 18, 32, .6); color: var(--brass2); padding: 10px 18px; font-size: .7rem; letter-spacing: .24em; text-transform: uppercase; transition: background .3s; }
  .skip-film:hover { background: rgba(212, 176, 106, .2); }
  .hint { position: absolute; z-index: 3; left: 50%; top: 18px; translate: -50% 0; font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; color: #c6cdd8; animation: nudge 2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(6px); opacity: .5; } }
  .film-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 14px; }
  .film .btn { border-color: var(--brass2); color: var(--ivory); }
  .film .btn::before { background: var(--brass2); }
  .film .btn:hover { color: var(--navy); }
  @media (max-width: 640px) { .film-ui { right: 8px; } .rail { height: 110px; } .cap { bottom: 12vh; } }

  /* ---------- Sections ---------- */
  .sec { padding: 72px 0; }
  .sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 14px; margin-bottom: 30px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .sec-h h2 { font-size: clamp(1.8rem, 4vw, 2.9rem); margin: 0; }
  .link { font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; text-decoration: none; background: linear-gradient(var(--brass), var(--brass)) 0 100% / 0 1px no-repeat; padding-bottom: 4px; transition: background-size .6s var(--slow); }
  .link:hover { background-size: 100% 1px; }
  .house { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .house .herring { aspect-ratio: 4 / 3; background: repeating-linear-gradient(45deg, var(--panel2) 0 12px, var(--panel) 12px 24px), var(--panel2); background-blend-mode: multiply; position: relative; overflow: hidden; }
  .house .herring::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent 0 12px, color-mix(in srgb, var(--ink) 8%, transparent) 12px 24px); clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
  .house .herring svg { position: absolute; inset: 10%; width: 80%; height: 80%; z-index: 1; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
  .stats3 b { display: block; font-family: var(--serif); font-size: 2.2rem; font-weight: 400; color: var(--brass); }
  @media (max-width: 820px) { .house { grid-template-columns: 1fr; } }
  .rooms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .room { border: 1px solid var(--line); background: var(--panel); padding: 24px; position: relative; overflow: hidden; transition: transform .6s var(--out), box-shadow .6s; }
  .room:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
  .room::before { content: ""; position: absolute; left: 0; top: 0; height: 3px; width: 100%; background: var(--brass); transform: scaleX(0); transform-origin: left; transition: transform .8s var(--slow); }
  .room:hover::before { transform: scaleX(1); }
  .room h3 { font-size: 1.6rem; }
  .open { display: inline-flex; align-items: center; gap: 8px; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; }
  .open i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: beat 1.8s infinite; }
  .open.closed i { background: var(--bad); animation: none; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(46, 107, 74, .6); } 100% { box-shadow: 0 0 0 10px rgba(46, 107, 74, 0); } }
  @media (max-width: 900px) { .rooms { grid-template-columns: 1fr; } }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 22vw, 250px), 1fr)); gap: 26px 18px; }
  .card { position: relative; display: flex; flex-direction: column; animation: rise .9s var(--out) both; animation-delay: calc(var(--i, 0) * 70ms); }
  .card .art { position: relative; aspect-ratio: 3 / 4; padding: 22px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  .card .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(212, 176, 106, .18) 50%, transparent 70%); transform: translateX(-100%); transition: transform 1.1s var(--slow); }
  .card:hover .art::after { transform: translateX(100%); }
  .card .art svg { height: 100%; margin: auto; transition: transform 1s var(--out); }
  .card:hover .art svg { transform: scale(1.05); }
  .card-b { padding: 12px 2px 0; display: grid; gap: 2px; }
  .card h3 { font-size: 1.15rem; margin: 0; }
  .card h3 a { text-decoration: none; }
  .card h3 a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .price { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; font-size: .95rem; letter-spacing: .04em; }
  .price s { color: var(--muted); font-size: .85em; }
  .tag { position: absolute; z-index: 2; left: 10px; top: 10px; background: var(--ox); color: #fff; font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; padding: 4px 10px; }
  .qa { position: absolute; z-index: 2; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; opacity: .9; transition: transform .6s var(--spring), background .3s, color .3s; }
  .qa svg { width: 16px; height: 16px; }
  .qa:hover { background: var(--ink); color: var(--bg); transform: rotate(90deg); }
  .qa.pop { animation: swing .8s var(--spring); background: var(--brass); color: #fff; }

  /* ---------- Listing ---------- */
  .page-h { padding: 34px 0 8px; }
  .page-h h1 { font-size: clamp(2.2rem, 5.4vw, 3.8rem); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 10px; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .crumbs a { text-decoration: none; }
  .shop { display: grid; grid-template-columns: 230px 1fr; gap: 34px; padding: 12px 0 70px; align-items: start; }
  .filters { position: sticky; top: 92px; }
  .fgroup { border-top: 1px solid var(--line); padding: 16px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 12px; border: 1px solid var(--line); background: none; font-size: .78rem; letter-spacing: .06em; transition: background .4s var(--slow), color .4s, border-color .3s; }
  .chip:hover { border-color: var(--brass); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .sws { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--bg); background: var(--c); box-shadow: 0 0 0 1px var(--line); transition: transform .5s var(--spring), box-shadow .3s; }
  .sw:hover { transform: scale(1.12); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--brass); transform: scale(1.12); }
  input[type="range"] { width: 100%; accent-color: var(--brass); }
  .check { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
  .check input { width: 17px; height: 17px; accent-color: var(--brass); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 22px; }
  .toolbar .search { flex: 1 1 200px; }
  .toolbar .count { margin: 0 auto 0 0; color: var(--muted); font-size: .85rem; letter-spacing: .1em; }
  .sort { display: flex; align-items: center; gap: 8px; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }
  .sort select { width: auto; min-height: 42px; }
  .f-toggle { display: none; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 50px 16px; border: 1px dashed var(--line); }
  @media (max-width: 860px) { .shop { grid-template-columns: 1fr; } .filters { display: none; position: static; } .filters.open { display: block; animation: rise .6s var(--out); } .f-toggle { display: inline-flex; } }

  /* ---------- Product ---------- */
  .pd { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; padding: 12px 0 50px; }
  .pstage { position: relative; aspect-ratio: 4 / 5; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  .pstage::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 39px, color-mix(in srgb, var(--brass) 12%, transparent) 39px 40px); }
  .pstage .big { position: relative; height: 82%; transition: transform 1s var(--out); }
  .pstage .big svg { height: 100%; }
  .pstage .big.swap { animation: drape .9s var(--out); }
  @keyframes drape { 0% { clip-path: inset(0 0 100% 0); } 100% { clip-path: inset(0 0 0 0); } }
  .pstage[data-v="1"] .big { transform: scale(1.25) translateY(10%); }
  .pstage[data-v="2"] .big { transform: scale(2) translate(-8%, 14%); }
  .thumbs { display: flex; gap: 10px; margin-top: 12px; }
  .thumb { width: 72px; aspect-ratio: 4 / 5; padding: 6px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; transition: border-color .3s, transform .4s var(--spring); }
  .thumb svg { height: 100%; margin: auto; }
  .thumb:hover { transform: translateY(-3px); }
  .thumb[aria-pressed="true"] { border-color: var(--brass); }
  .thumb:nth-child(2) svg { transform: scale(1.25) translateY(10%); }
  .thumb:nth-child(3) svg { transform: scale(2) translate(-8%, 14%); }
  .pd h1 { font-size: clamp(2rem, 4.4vw, 3rem); }
  .pd .price { font-size: 1.25rem; margin: 6px 0 14px; }
  .opt-h { display: flex; justify-content: space-between; gap: 10px; margin: 22px 0 10px; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .size { min-width: 56px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel); transition: background .4s var(--slow), color .4s, border-color .3s, transform .4s var(--spring); }
  .size:hover:not(:disabled) { border-color: var(--brass); }
  .size[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); transform: translateY(-2px); }
  .size:disabled { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
  .buy { display: flex; flex-wrap: wrap; gap: 12px; margin: 26px 0 14px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--panel); }
  .stepper button { width: 42px; height: 52px; border: 0; background: none; font-size: 1.1rem; }
  .stepper button:hover { color: var(--brass); }
  .stepper output { min-width: 26px; text-align: center; }
  .stepper output.tick { animation: swing .5s var(--spring); }
  .notes { list-style: none; padding: 0; margin: 20px 0 0; border-top: 1px solid var(--line); }
  .notes li { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  @media (max-width: 860px) { .pd { grid-template-columns: 1fr; gap: 24px; } }
  .add { position: relative; flex: 1 1 220px; display: grid; min-height: 54px; border: 0; background: var(--ink); color: var(--bg); font-size: .74rem; letter-spacing: .26em; text-transform: uppercase; overflow: hidden; transition: transform .4s var(--spring), background .5s var(--slow); }
  .add > span { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .7s var(--out), opacity .4s; }
  .add svg { width: 18px; height: 18px; }
  .add .s1, .add .s2 { opacity: 0; transform: translateY(100%); }
  .add.press { transform: scale(.95); }
  .add.work .s0, .add.done .s0, .add.done .s1 { opacity: 0; transform: translateY(-100%); }
  .add.work .s1, .add.done .s2 { opacity: 1; transform: none; }
  .add.done { background: var(--brass); }

  function fly(from) {

  let filmOn = false, filmRaf = 0;
  function playFilm() {
    const film = $("#film"); if (!film) { filmOn = false; return; }

    const idx = Math.min(3, Math.floor(p * 4)), local = (i) => (calm() ? 1 : clamp(p * 4 - i));

    const th = $("#th1");

    let on = null;
    $$("#nav a").forEach((a) => { if (a.dataset.nav === key) { a.setAttribute("aria-current", "page"); on = a; } else a.removeAttribute("aria-current"); });
    const mk = $(".nav-mark"); if (on) { mk.style.opacity = 1; mk.style.left = on.offsetLeft + "px"; mk.style.width = on.offsetWidth + "px"; } else mk.style.opacity = 0;
  }
  function reveal() {
    const els = $$(".rv, [data-count]");
    const hit = (el) => { el.classList.add("in"); if (el.dataset.count) countUp(el, +el.dataset.count); };
    if (!("IntersectionObserver" in window)) return els.forEach(hit);
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { hit(e.target); io.unobserve(e.target); } }), { threshold: 0.2 });
    els.forEach((el) => io.observe(el)); observers.push(io);
  }

  /* ---------- Actions ---------- */
  const setPressed = (q, b) => $$(q).forEach((t) => t.setAttribute("aria-pressed", t === b ? "true" : "false"));
  const ACT = {
    menu(b) { const o = $("#nav").classList.toggle("open"); b.setAttribute("aria-expanded", o ? "true" : "false"); },
    skipfilm() { const film = $("#film"); if (film) window.scrollTo({ top: film.offsetTop + film.offsetHeight, behavior: calm() ? "auto" : "smooth" }); },
    qa(b) { const p = byId(b.dataset.id); addLine(p.id, p.colors[0], firstSize(p), 1); fly(b.closest(".card").querySelector(".art")); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 800); say(`${p.name} is in your bag`); },
    ftoggle(b) { const o = $("#filters").classList.toggle("open"); b.setAttribute("aria-expanded", o ? "true" : "false"); },
    fcat(b) { F.cat = b.dataset.v; F.sizes.clear(); setPressed("[data-act=fcat]", b); $("#fsizes").innerHTML = sizeChips(); const t = catName(F.cat) || "The collection"; $("#shopTitle").textContent = t; $("#crumb").textContent = t; drawGrid(); },
    fcol(b) { const v = b.dataset.v; F.colors.has(v) ? F.colors.delete(v) : F.colors.add(v); b.setAttribute("aria-pressed", F.colors.has(v) ? "true" : "false"); drawGrid(); },
    fsize(b) { const v = b.dataset.v; F.sizes.has(v) ? F.sizes.delete(v) : F.sizes.add(v); b.setAttribute("aria-pressed", F.sizes.has(v) ? "true" : "false"); drawGrid(); },
    freset() { Object.assign(F, { cat: "", max: 80000, sale: false, q: "" }); F.colors.clear(); F.sizes.clear(); $("#filters").innerHTML = filtersHTML(); $("[data-f=q]").value = ""; $("#shopTitle").textContent = "The collection"; $("#crumb").textContent = "The collection"; drawGrid(); say("Filters cleared"); },
    view(b) { $("#pstage").dataset.v = b.dataset.v; setPressed("[data-act=view]", b); },
    pc(b) { const p = byId(sel.id); sel.c = b.dataset.v; setPressed("[data-act=pc]", b); $("#cName").textContent = COL[sel.c][0]; const big = $("#big"); big.innerHTML = art(p, sel.c); big.classList.remove("swap"); void big.offsetWidth; big.classList.add("swap"); $$("[data-act=view]").forEach((t) => (t.innerHTML = art(p, sel.c))); },
    ps(b) { sel.s = b.dataset.v; setPressed("[data-act=ps]", b); $("#sName").textContent = sel.s; },
    pq(b) { sel.q = Math.max(1, Math.min(9, sel.q + +b.dataset.d)); const o = $("#pq"); o.textContent = sel.q; o.classList.remove("tick"); void o.offsetWidth; o.classList.add("tick"); },
    add(b) { addFlow(b); },
    lq(b) {
      const row = b.closest(".line"), l = S.bag.find((x) => x.k === row.dataset.k); if (!l) return;
      const nq = l.q + +b.dataset.d; if (nq < 1) return ACT.rm(row.querySelector(".rm"));
      l.q = Math.min(9, nq); save(); syncBadge(true);
      const o = row.querySelector("output"); o.textContent = l.q; o.classList.remove("tick"); void o.offsetWidth; o.classList.add("tick");
      row.querySelector(".l-total").textContent = pkr(byId(l.id).price * l.q); refreshSum();
    },
    async rm(b) {
      const row = b.closest(".line"); if (row.dataset.gone) return; row.dataset.gone = "1";
      const l = S.bag.find((x) => x.k === row.dataset.k), p = byId(l.id);
      S.bag = S.bag.filter((x) => x !== l); save(); syncBadge(true);
      await anim(row, [{ clipPath: "inset(0 0 0 0)", opacity: 1 }, { clipPath: "inset(0 0 0 100%)", opacity: 0.2 }], { duration: 520, easing: "cubic-bezier(.65,0,.35,1)" });
      await anim(row, [{ height: row.offsetHeight + "px", paddingTop: "18px", paddingBottom: "18px" }, { height: "0px", paddingTop: "0px", paddingBottom: "0px" }], { duration: 300 });
      row.remove(); say(`${p.name} removed`);
      if (!S.bag.length) render(); else refreshSum();
    },
    unpromo() { S.promo = ""; save(); refreshSum(); say("Promo removed"); },
    fday(b) { FIT.day = b.dataset.v; FIT.slot = ""; setPressed("[data-act=fday]", b); drawSlots(); },
    fslot(b) { FIT.slot = b.dataset.v; setPressed("[data-act=fslot]", b); $("#e-slot").textContent = ""; drawSlots(); const again = $(`[data-act=fslot][data-v="${FIT.slot}"]`); if (again) again.focus(); },
    refit() { render(); },
  };
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
  document.addEventListener("input", (e) => {
    const t = e.target, f = t.dataset.f;
    if (f === "q") { F.q = t.value; drawGrid(); }
    if (f === "max") { F.max = +t.value; $("#fmaxo").textContent = pkr(F.max); drawGrid(); }
    const form = t.form;
    if (form && form.dataset.form === "order") {
      if (t.name === "card") t.value = t.value.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
      if (t.name === "exp") t.value = t.value.replace(/\D/g, "").slice(0, 4).replace(/^(\d{2})(\d)/, "$1/$2");
      if (t.name === "cvc") t.value = t.value.replace(/\D/g, "").slice(0, 4);
      if (t.getAttribute("aria-invalid") === "true" && RULES[t.name]) check(form, t.name, true);
      coProgress(form);
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target, f = t.dataset.f;
    if (f === "sort") { F.sort = t.value; drawGrid(); }
    if (f === "sale") { F.sale = t.checked; drawGrid(); }
    const form = t.form;
    if (form && form.dataset.form === "fitting" && t.name === "room") { FIT.room = t.value; FIT.slot = ""; drawSlots(); }
    if (form && form.dataset.form === "order") {
      if (t.name === "pay") $("#cardf").classList.toggle("on", t.value === "card");
      if (t.name === "ship") $("#coRows").innerHTML = sumRows(totals(t.value));
      if (RULES[t.name] && t.value) check(form, t.name, true);
    }
  });
  document.addEventListener("focusout", (e) => { const t = e.target, form = t.form; if (form && form.dataset.form === "order" && RULES[t.name] && t.value) check(form, t.name, true); });
  const FORMS = {
    promo(f) {
      const code = f.elements.code.value.trim().toUpperCase(), msg = $("#pmsg");
      if (!code) { msg.className = "p-msg bad"; msg.textContent = "Type a code first."; return; }
      if (!PROMOS[code]) { msg.className = "p-msg bad"; msg.textContent = `"${code}" is not a house code. Try TAILOR10.`; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); return; }
      const before = totals().total; sparks(f); S.promo = code; save(); refreshSum(); say(`${code} applied: ${PROMOS[code].label}`);
      const tot = $("#sumRows .tot"); if (tot) countUp(tot, totals().total, { from: before, pre: "PKR ", ms: 900 });
    },
    order(f) { placeOrder(f); },
    fitting(f) { bookFitting(f); },
  };
  document.addEventListener("submit", (e) => { const f = e.target; if (f.dataset.form && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f); } });
  addEventListener("hashchange", render);
  addEventListener("resize", () => { markNav(parse()); if (filmOn) playFilm(); });
  syncBadge(false);
  render();
})();
</script>
</body>
</html>
