<head>

<title>Kerbside · online and in-store sales dashboard</title>
<script>/* Theme first (no flash): ?theme=light|dark wins, then the saved choice, then the system setting */
(function(){var d=document.documentElement,t=new URLSearchParams(location.search).get("theme");if(t!=="light"&&t!=="dark"){try{t=localStorage.getItem("db-kerbside:theme")}catch(e){t=null}}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}d.setAttribute("data-theme",t)})();</script>
<style>
/* ---------- Core kit styles (modal, toast, table, charts, till) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; }
h1:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.k-ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }
.k-in { animation: kIn .6s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes kIn { from { opacity: 0; transform: translateY(14px); } }
.k-av { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; font-size: 12px; font-weight: 700; background: hsl(var(--h) 60% 50% / .18); color: hsl(var(--h) 55% 32%); }
[data-theme="dark"] .k-av { color: hsl(var(--h) 70% 78%); background: hsl(var(--h) 50% 50% / .25); }
.k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface2); color: var(--muted); }
.k-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.k-badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.k-badge.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.k-badge.info { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.k-delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; }
.k-delta.up { color: var(--ok); } .k-delta.down { color: var(--err); }
.k-delta .k-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.k-emptyp { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.k-hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

/* buttons (apps restyle) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 15px; min-height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--err); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-btn, 10px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); position: relative; transition: transform .15s var(--ease), background-color .2s; flex: none; }
.ibtn:hover { transform: translateY(-1px); } .ibtn:active { transform: scale(.94); }
.ibtn .k-ic { width: 19px; height: 19px; }
.k-bn { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.k-bn[hidden] { display: none; }

/* mobile nav scrim */
.k-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.nav-open .k-scrim { opacity: 1; pointer-events: auto; }

/* segmented control */
.k-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-seg, 999px); background: var(--surface2); max-width: 100%; overflow-x: auto; }
.k-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-seg, 999px); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background-color .2s, color .2s, box-shadow .2s; }
.k-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }

/* tooltip */
.k-tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity .15s; background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.55; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-width: 260px; font-family: var(--font); }
.k-tip.on { opacity: 1; }
.k-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* charts */
.k-chart { display: block; max-width: 100%; height: auto; }
.k-grid { stroke: var(--grid, var(--line)); stroke-width: 1; }
.k-axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.k-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.k-line.k-anim { stroke-dasharray: 1; stroke-dashoffset: 1; animation: kDraw 1.4s var(--ease) forwards; animation-delay: var(--d, 0ms); }
.k-dash { stroke-dasharray: 5 5; stroke-width: 2; opacity: .7; }
@keyframes kDraw { to { stroke-dashoffset: 0; } }
.k-area.k-anim { animation: kFade 1.2s .3s var(--ease) backwards; }
@keyframes kFade { from { opacity: 0; } }
.k-bar.k-anim { transform-box: fill-box; transform-origin: 50% 100%; animation: kGrow .8s var(--ease) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes kGrow { from { transform: scaleY(0); } }
.k-col rect { transition: opacity .2s; }
.k-chart:hover .k-col:not(.on) .k-bar rect { opacity: .55; }
.k-guide { stroke: var(--muted); stroke-dasharray: 3 4; opacity: 0; }
.k-guide.on, .k-dot.on { opacity: 1; }
.k-dot { opacity: 0; stroke: var(--surface-solid, var(--surface)); stroke-width: 2.5; }
.k-heat rect.k-anim { animation: kFade .6s var(--ease) backwards; animation-delay: calc(var(--i) * 28ms); }
.k-heat rect:hover { stroke: var(--ink); stroke-width: 1.5; }
.k-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.k-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-legend i { width: 10px; height: 10px; border-radius: 3px; }
.k-donutw { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.k-donut { position: relative; flex: none; }
.k-donut svg { display: block; }
.k-track { fill: none; stroke: var(--surface2); }

circle.k-arc { fill: none; transition: stroke-width .2s, opacity .2s; }
circle.k-arc.on { opacity: .82; }
circle.k-arc.k-anim { animation: kSweep 1.1s var(--ease) backwards; animation-delay: calc(var(--i) * 110ms); }
@keyframes kSweep { from { stroke-dasharray: 0 100; } }
.k-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.k-dc b { font-size: 20px; font-variant-numeric: tabular-nums; }
.k-dc span { font-size: 12px; color: var(--muted); }
.k-dleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; min-width: 150px; flex: 1; font-size: 13px; }
.k-dleg li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; cursor: default; }
.k-dleg i { width: 10px; height: 10px; border-radius: 3px; }
.k-dleg small { color: var(--muted); text-align: right; }
.k-gauge { position: relative; display: inline-block; }
.k-gauge svg { display: block; overflow: visible; }
.k-gauge path { fill: none; stroke-linecap: round; }
.k-gv { stroke-width: 16px; }
.k-gv.k-anim { animation: kSweep 1.3s var(--ease) backwards; }
.k-gc { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
.k-gc b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.k-gc span { font-size: 12px; color: var(--muted); }
.k-spark { display: block; max-width: 100%; }
.k-hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.k-hbt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.k-hbt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-hbt b { font-variant-numeric: tabular-nums; }
.k-hbr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.k-hbr i { display: block; height: 100%; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms); }
.k-hb small { color: var(--muted); font-size: 12px; }
@keyframes kW { from { width: 0; } }
.k-fun { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.k-fun li { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.k-funb { position: absolute; left: 0; top: 0; bottom: 0; opacity: .28; border-radius: inherit; animation: kW 1s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
.k-fun span, .k-fun b, .k-fun small { position: relative; }
.k-fun small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* toasts */
.k-toasts { position: fixed; z-index: 130; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
.k-toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 11px 15px; border-radius: var(--r-sm, 10px); background: var(--tip-bg, #15161a); color: var(--tip-ink, #fff); font-size: 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, .28); animation: kToast .45s var(--spring, var(--ease)) backwards; transition: opacity .3s, transform .3s; }
.k-toast .k-ic { color: var(--ok); } .k-toast.err .k-ic { color: var(--err); } .k-toast.info .k-ic { color: var(--warn); }
.k-toast.out { opacity: 0; transform: translateY(8px); }
@keyframes kToast { from { opacity: 0; transform: translateY(18px) scale(.95); } }

/* modals and drawers */
.k-ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--overlay, rgba(10, 12, 20, .45)); opacity: 0; transition: opacity .25s; }
.k-ov.open { opacity: 1; }
.k-modal { width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); transform: translateY(18px) scale(.97); transition: transform .35s var(--ease); overscroll-behavior: contain; }
.k-ov.open .k-modal { transform: none; }
.k-wide { width: min(780px, 100%); }
.k-ov-drawer { place-items: stretch end; padding: 0; }
.k-drawer { width: min(460px, 100%); height: 100%; max-height: none; border-radius: var(--r, 16px) 0 0 var(--r, 16px); transform: translateX(100%); }
.k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--modal-bg, var(--surface)); }
.k-mh h2 { margin: 0; font-size: 18px; }
.k-mb { padding: 18px 20px; }
.k-mf { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--line); }
.k-mb .k-mf { padding: 18px 0 0; border: 0; }
.k-mf .sp { flex: 1; }
.k-x { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.k-x:hover { background: var(--surface2); color: var(--ink); }
.k-confirm { width: min(420px, 100%); }
.k-confirm p { margin: 0; }

/* forms */
.k-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.k-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.k-field.full, .k-check.full { grid-column: 1 / -1; }
.k-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.k-field input, .k-field select, .k-field textarea, .k-input { width: 100%; padding: 9px 12px; min-height: 42px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface)); color: var(--ink); }
.k-field textarea { resize: vertical; }
.k-field input:focus, .k-field select:focus, .k-field textarea:focus, .k-input:focus { outline: 2px solid var(--focus, var(--accent)); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--err) !important; }
.k-err { color: var(--err); font-size: 12px; min-height: 0; }
.k-err:empty { display: none; }
.k-check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.k-check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) { .k-form { grid-template-columns: 1fr; } }

/* tables */
.k-tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.k-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; flex: 1 1 200px; max-width: 340px; border: 1px solid var(--line); border-radius: var(--r-sm, 10px); background: var(--input-bg, var(--surface)); color: var(--muted); }
.k-search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; padding: 8px 0; color: var(--ink); }
.k-search:focus-within { outline: 2px solid var(--focus, var(--accent)); outline-offset: 1px; }
.k-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k-chip { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .2s, color .2s, transform .15s; }
.k-chip:active { transform: scale(.95); }
.k-chip[aria-pressed="true"] { background: var(--chip-on, var(--ink)); color: var(--chip-on-ink, var(--bg)); border-color: transparent; }
.k-ttools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.k-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.k-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.k-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.k-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.k-table th button:focus-visible { outline: 2px solid var(--focus, var(--accent)); }
.k-sorti::after { content: "↕"; opacity: .35; font-style: normal; font-size: 11px; }
th[aria-sort="ascending"] .k-sorti::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] .k-sorti::after { content: "↓"; opacity: 1; }
.k-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.k-table tbody tr { transition: background-color .15s; }
.k-table tbody tr[data-row] { cursor: pointer; }
.k-table tbody tr[data-row]:hover { background: var(--row-hover, var(--surface2)); }
.k-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-table .nw { white-space: nowrap; }
.k-cellp { display: flex; align-items: center; gap: 10px; min-width: 0; }
.k-cellp small { display: block; color: var(--muted); font-size: 12px; }
.k-empty { text-align: center; color: var(--muted); padding: 34px 12px !important; }
.k-empty .k-ic { width: 26px; height: 26px; opacity: .6; margin-bottom: 6px; }
.k-pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.k-pg { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; margin-left: 6px; font-size: 18px; line-height: 1; }

/* popovers, menus, notifications, command search */
.k-pop { position: fixed; z-index: 110; width: min(330px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--modal-bg, var(--surface)); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r, 14px); box-shadow: 0 22px 50px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .2s, transform .25s var(--ease); }
.k-pop.open { opacity: 1; transform: none; }
.k-menu { display: flex; flex-direction: column; padding: 6px; }
.k-menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
.k-menu button:hover, .k-menu button:focus-visible { background: var(--surface2); }
.k-notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.k-notes ul { list-style: none; margin: 0; padding: 6px; }
.k-notes li { display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
.k-notes li.new { background: var(--surface2); }
.k-notes p { margin: 0; font-size: 14px; }
.k-notes small { color: var(--muted); font-size: 12px; }
.k-dotc { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: var(--accent); }
.k-dotc.ok { background: var(--ok); } .k-dotc.warn { background: var(--warn); } .k-dotc.err { background: var(--err); }
.k-cmdk { align-self: start; margin-top: 10vh; }
.k-cmdin { max-width: none; width: 100%; }
.k-cmdl { list-style: none; margin: 10px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.k-cmdl li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
.k-cmdl li small { color: var(--muted); }
.k-cmdl li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.k-cmdl li[aria-selected="true"] small { color: inherit; opacity: .8; }

/* drag and drop */
.k-ghost { position: fixed; left: 0; top: 0; z-index: 140; pointer-events: none; opacity: .94; box-shadow: 0 24px 50px rgba(0, 0, 0, .3); margin: 0 !important; }
.k-dragging { opacity: .35; }
.k-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
[data-grip] { touch-action: none; cursor: grab; }

/* till: discount, payment, terminal, receipt */
.k-disc .k-seg { margin-bottom: 14px; }
.k-dpre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.k-dpre[hidden], [data-pane][hidden], .k-hint[hidden] { display: none; }
.k-paytotal { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm, 10px); background: var(--surface2); margin-bottom: 14px; }
.k-paytotal b { font-size: 28px; font-variant-numeric: tabular-nums; }
.k-pay > .k-seg { width: 100%; margin-bottom: 16px; }
.k-pay > .k-seg button { flex: 1; padding: 9px; }
.k-quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.k-quick button { flex: 1 1 28%; padding: 10px 6px; border-radius: var(--r-sm, 10px); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .15s; }
.k-quick button:active { transform: scale(.95); }
.k-change { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; }
.k-change b { font-size: 26px; color: var(--ok); font-variant-numeric: tabular-nums; }
.k-term { position: relative; width: 150px; height: 210px; margin: 6px auto 12px; border-radius: 22px; background: linear-gradient(160deg, #2b2f38, #14161b); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), 0 16px 30px rgba(0, 0, 0, .3); padding: 14px; overflow: hidden; }
.k-term-scr { height: 70px; border-radius: 10px; background: linear-gradient(180deg, #cfe9d9, #a9d3bb); color: #13321f; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; transition: background .3s; }
.k-term-scr small { font-size: 10px; opacity: .7; }
.k-term-scr b { font-size: 15px; }
.k-term-scr em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.k-term.ok .k-term-scr { background: linear-gradient(180deg, #b8f0c6, #6fd38b); }
.k-term-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.k-term-keys i { height: 22px; border-radius: 6px; background: #3a3f4a; color: #cdd2db; font: 600 11px/22px ui-monospace, monospace; text-align: center; font-style: normal; }
.k-term-card { position: absolute; left: 50%; top: -120px; width: 96px; height: 60px; margin-left: -48px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--c3, #888)); box-shadow: 0 10px 20px rgba(0, 0, 0, .35); transition: top .7s var(--spring, var(--ease)); }
.k-term-card::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f3d77a, #c9a23f); }
.k-term.tap .k-term-card { top: 30px; }
.k-term.ok .k-term-card { top: -120px; transition-delay: .2s; }
.k-cstat { text-align: center; color: var(--muted); margin: 0 0 14px; min-height: 1.4em; }
.k-wallet { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.k-wallet p { margin: 0; color: var(--muted); font-size: 14px; }
.k-qr { width: 112px; height: 112px; flex: none; background: #fff; border-radius: 10px; fill: #111; }
.k-receipt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #fffdf7; color: #232323; padding: 20px 18px 26px; max-width: 330px; margin: 0 auto; position: relative; box-shadow: 0 8px 22px rgba(0, 0, 0, .14); animation: kPrint .9s var(--ease) backwards; }
.k-receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px, linear-gradient(45deg, transparent 6px, #fffdf7 0) 0 0 / 12px 8px; }
@keyframes kPrint { from { clip-path: inset(0 0 100% 0); transform: translateY(-14px); } }
.k-rch { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed #999; }
.k-rch b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.k-rcl, .k-rct { padding: 8px 0; border-bottom: 1px dashed #999; }
.k-rcl > div, .k-rct > div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.k-rct .tot { font-weight: 700; font-size: 15px; padding: 5px 0; }
.k-bc { display: block; width: 80%; height: 38px; margin: 12px auto 4px; fill: #232323; }
.k-rcf { text-align: center; margin: 6px 0 0; font-size: 11.5px; }
.k-rcref { text-align: center; font-weight: 800; color: #b3261e; letter-spacing: .2em; border: 2px solid #b3261e; margin: 10px auto 0; width: max-content; padding: 2px 10px; transform: rotate(-4deg); }
.k-recm .k-mb { background: var(--surface2); }

/* reduced motion: everything still works, without big motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* printing a receipt prints only the open receipt */
@media print {
  body.k-printing > *:not(.k-ov) { display: none !important; }
  body.k-printing .k-ov { position: static; background: none; padding: 0; backdrop-filter: none; }
  body.k-printing .k-modal { box-shadow: none; border: 0; transform: none; max-height: none; background: #fff; }
  body.k-printing .k-mh, body.k-printing .k-mf { display: none; }
  body.k-printing .k-receipt { box-shadow: none; animation: none; }
}

/* ---------- Kerbside look: crisp, dense, navy and coral ---------- */
:root {
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.5, .64, 1);
  --bg: #f4f5f8; --surface: #fff; --surface2: #f1f3f7; --ink: #182033; --muted: #636d82; --line: #e3e6ed; --line-strong: #cfd4de;
  --accent: #ef5b45; --accent-ink: #fff; --ok: #12935f; --warn: #c27a06; --err: #d63b3b; --focus: #2f5bea;
  --c1: #2f5bea; --c2: #14b0a0; --c3: #f08a3c; --c4: #ef5b45; --c5: #8d5cf0; --c6: #e3b324;
  --side: #121a2d; --side-ink: #e8ecf6; --side-mut: #8c97b0;
  --r: 10px; --r-sm: 8px; --r-btn: 8px; --r-seg: 8px; --overlay: rgba(12, 18, 32, .45); --tip-bg: #182033; --chip-on: #182033; --chip-on-ink: #fff;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0c1019; --surface: #141a26; --surface2: #1b2231; --ink: #e9edf6; --muted: #98a2b8; --line: #252e40; --line-strong: #344057;
  --accent: #ff6b55; --accent-ink: #1a0b08; --ok: #3ccf8e; --warn: #f2b14a; --err: #ff6b6b; --focus: #7b9bff;
  --c1: #6e8dff; --c2: #34d1c0; --c3: #ffa35c; --c4: #ff7a66; --c5: #a985ff; --c6: #f2cb4b;
  --side: #090d15; --overlay: rgba(0, 0, 0, .6); --tip-bg: #26304a; --chip-on: #e9edf6; --chip-on-ink: #0c1019;
  color-scheme: dark;
}
[data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
body { font-size: 14px; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; }
.skip:focus { left: 8px; }
.mut { color: var(--muted); font-size: 12.5px; }
.grow { flex: 1; }
.btn { min-height: 36px; padding: 7px 13px; font-size: 13.5px; }
.btn.primary { box-shadow: 0 6px 14px -8px var(--accent); }
.ibtn { width: 36px; height: 36px; }
.k-table { font-size: 13.5px; }
.k-table td { padding: 8px 12px; }
.k-av { width: 30px; height: 30px; font-size: 11px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; transition: grid-template-columns .35s var(--ease); }
.app.mini { grid-template-columns: 70px minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--side); color: var(--side-ink); padding: 14px 10px; z-index: 50; scrollbar-width: thin; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; border-bottom: 1px solid rgba(255, 255, 255, .07); margin-bottom: 8px; }
.logo { width: 34px; height: 34px; flex: none; }
.brand-t { flex: 1; min-width: 0; }
.brand b { display: block; font-size: 16px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--side-mut); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.collapse { width: 30px; height: 30px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .06); color: var(--side-mut); display: grid; place-items: center; flex: none; }
.collapse:hover { color: #fff; }
.nav { position: relative; display: flex; flex-direction: column; gap: 1px; }
.grp { margin: 12px 10px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5f6b86; white-space: nowrap; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: var(--side-mut); text-decoration: none; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: color .2s, background-color .2s; }
.nav a:hover { color: var(--side-ink); background: rgba(255, 255, 255, .04); }
.nav a[aria-current="page"] { color: #fff; }
.nav a .k-ic { width: 18px; height: 18px; }
.nav .k-marker { position: absolute; left: 0; right: 0; top: 0; height: 36px; border-radius: 8px; background: rgba(255, 255, 255, .08); box-shadow: inset 3px 0 0 var(--accent); transition: transform .4s var(--ease), height .3s; z-index: 0; }
.nav-n { margin-left: auto; font-style: normal; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.nav-n[hidden] { display: none; }
.app.mini .brand-t, .app.mini .grp, .app.mini .nav a span, .app.mini .nav-n { display: none; }
.app.mini .brand { flex-direction: column; }
.app.mini .nav a { justify-content: center; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 10px 22px; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.crumb .k-ic { width: 12px; height: 12px; }
.crumb b { color: var(--ink); }
.scope { margin-left: 14px; }
.me .k-av { width: 34px; height: 34px; }
#view { padding: 20px 22px 44px; min-width: 0; }
#view:focus { outline: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.ph h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.ph p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.ph-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.k-in { animation-name: kbIn; animation-duration: .5s; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes kbIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; transition: border-color .2s, box-shadow .25s, transform .25s var(--ease); }
.card:hover { border-color: var(--line-strong); box-shadow: 0 8px 22px -16px rgba(20, 30, 60, .35); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 14.5px; font-weight: 650; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); transform: scaleY(0); transform-origin: top; transition: transform .35s var(--ease); }
.kpi:hover::before { transform: none; }
.kpi:hover { transform: translateY(-2px); }
.kpi span { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.kpi b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kx { display: flex; gap: 6px; align-items: center; min-height: 16px; font-size: 12px; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .08em; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.3s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.g-ov { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.g-st { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; vertical-align: 0; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.feed li .sw { margin-top: 5px; }
.feed b { display: block; font-size: 13px; font-weight: 600; }
.feed small { color: var(--muted); font-size: 12px; }
.feed li.fresh { animation: fIn .6s var(--spring); }
@keyframes fIn { from { opacity: 0; transform: translateX(-12px); background: color-mix(in srgb, var(--accent) 10%, transparent); } }

/* ---------- Sankey (signature) ---------- */
.sankey { overflow: visible; }
.band { opacity: .3; transition: opacity .2s; cursor: default; }
.band.on { opacity: .75; }
.sankey:hover .band:not(.on) { opacity: .16; }
.band.k-anim { transform-box: view-box; transform-origin: 100px 50%; animation: bandIn 1.2s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms); }
@keyframes bandIn { from { transform: scaleX(0); opacity: 0; } }
.pt { opacity: 0; offset-rotate: 0deg; animation: flow 3.4s ease-in-out 3 backwards; animation-delay: 1.2s; pointer-events: none; }
@keyframes flow { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: .95; } 88% { opacity: .95; } 100% { offset-distance: 100%; opacity: 0; } }
.cnode { fill: var(--muted); opacity: .55; }
.sk-l { font-size: 11.5px; font-weight: 600; fill: var(--ink); }

/* ---------- Drawers and small tables ---------- */
.dmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 16px; }
.steps span { position: relative; padding: 18px 2px 0; font-size: 11.5px; text-align: center; color: var(--muted); }
.steps span::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 5px; border-radius: 3px; background: var(--surface2); }
.steps span.on { color: var(--ink); font-weight: 600; }
.steps span.on::before { background: var(--accent); animation: stepIn .5s var(--ease) backwards; }
@keyframes stepIn { from { transform: scaleX(0); transform-origin: left; } }
.mini { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 12px; }
.mini td { padding: 8px 0; border-bottom: 1px solid var(--line); }
.mini small { color: var(--muted); }
.mini .num { text-align: right; white-space: nowrap; }
.mini .tot td { font-weight: 700; border: 0; padding-top: 10px; }
.dcust { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; }
.dcust b, .dcust small { display: block; }
.dcust small { color: var(--muted); font-size: 12px; }
.mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.mini3 div { padding: 9px 10px; border-radius: 8px; background: var(--surface2); }
.mini3 small { display: block; color: var(--muted); font-size: 11.5px; }
.mini3 b { font-size: 15px; }
.dh { font-size: 13px; margin: 14px 0 6px; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; }
.plain li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.plain li > span { flex: 1; min-width: 0; }
.plain small { color: var(--muted); }
.pthumb { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--t); background: color-mix(in srgb, var(--t) 15%, transparent); flex: none; }
.sz { display: inline-block; padding: 1px 6px; margin: 0 3px 2px 0; border-radius: 5px; border: 1px solid var(--line-strong); font-size: 11px; color: var(--muted); }
.prog { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; width: 140px; margin-bottom: 3px; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--c1), var(--accent)); border-radius: inherit; animation: kW 1s var(--ease) backwards; }
td small { color: var(--muted); font-size: 11.5px; }

/* ---------- Returns board ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { padding: 10px; background: var(--surface2); display: flex; flex-direction: column; min-height: 320px; transition: outline-color .2s, background-color .2s; }
.col header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 10px; font-size: 13px; }
.col header span { color: var(--muted); font-size: 12px; }
.col-b { display: grid; gap: 8px; align-content: start; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; cursor: grab; transition: transform .2s var(--spring), box-shadow .2s; user-select: none; }
.rcard:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -14px rgba(20, 30, 60, .45); }
.rc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.rc-h b { font-size: 13px; }
.k-x.sm { width: 26px; height: 26px; }
.rcard small { color: var(--muted); font-size: 11.5px; }
.rcard p { margin: 6px 0 8px; font-size: 12.5px; }
.rc-f { display: flex; align-items: center; gap: 6px; }
.rc-f b { margin-left: auto; font-size: 13px; }
.k-over { background: color-mix(in srgb, var(--accent) 8%, var(--surface2)); }

/* ---------- Promotions timeline ---------- */
.tline { position: relative; display: grid; gap: 8px; padding: 34px 0 6px; min-height: 140px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 7)); }
.tl-grid { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11.5px; color: var(--muted); }
.tl-grid span { padding-left: 6px; }
.tl-now { position: absolute; top: 22px; bottom: 0; width: 2px; background: var(--accent); font-style: normal; z-index: 2; }
.tl-now b { position: absolute; top: -2px; left: 4px; font-size: 10.5px; color: var(--accent); }
.tl-bar { position: relative; display: block; height: 28px; border: 0; border-radius: 7px; padding: 0 10px; text-align: left; font-size: 12.5px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--c1); transform-origin: left; animation: barX .8s var(--ease) backwards; animation-delay: calc(var(--i) * 80ms + .1s); transition: filter .2s, transform .2s; }
.tl-bar:hover { filter: brightness(1.08); transform: translateY(-1px); }
.tl-bar.live { background: linear-gradient(90deg, var(--ok), color-mix(in srgb, var(--ok) 70%, var(--c2))); }
.tl-bar.scheduled { background: var(--c1); }
.tl-bar.ended { background: var(--muted); opacity: .7; }
.tl-bar.paused { background: repeating-linear-gradient(135deg, var(--warn) 0 8px, color-mix(in srgb, var(--warn) 75%, #fff) 8px 16px); }
@keyframes barX { from { transform: scaleX(0); } }

/* ---------- Inventory matrix ---------- */
.inv { min-width: 760px; }
.cell { min-width: 44px; padding: 4px 8px; border-radius: 6px; border: 1px solid transparent; background: var(--surface2); font-weight: 600; font-variant-numeric: tabular-nums; transition: border-color .2s, transform .15s; }
.cell:hover { border-color: var(--line-strong); transform: scale(1.06); }
.cell.low { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.cell.out { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }

/* ---------- Stores map ---------- */
.mapc { display: grid; place-items: center; background: radial-gradient(circle at 60% 40%, color-mix(in srgb, var(--c1) 10%, var(--surface)), var(--surface) 70%); }
.map { width: 100%; max-width: 360px; height: auto; overflow: visible; }
.land { fill: color-mix(in srgb, var(--c2) 12%, var(--surface2)); }
.coast { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 900; stroke-dashoffset: 900; animation: coast 2.2s var(--ease) forwards; }
@keyframes coast { to { stroke-dashoffset: 0; } }
.pin { cursor: pointer; animation: pinDrop .8s var(--spring) backwards; animation-delay: calc(.4s + var(--i) * 140ms); }
@keyframes pinDrop { from { translate: 0 -46px; opacity: 0; } }
.pin .halo { opacity: 0; }
.pin.on .halo { animation: halo 1.8s ease-out 3; }
@keyframes halo { 0% { opacity: .45; r: 4; } 100% { opacity: 0; r: 26; } }
.pin text { font-size: 10px; font-weight: 700; fill: var(--ink); }
.pin.on text { fill: var(--accent); }
.pin:focus-visible { outline: none; }
.pin:focus-visible path { stroke: var(--focus); stroke-width: 3; }
.stc .k-gauge { display: block; margin: 0 auto; width: max-content; }

/* ---------- Reports and settings ---------- */
.rep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 14px; }
.rep { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rep > div:nth-child(2) { flex: 1; min-width: 150px; }
.rep b { display: block; font-size: 14px; }
.rep small { color: var(--muted); font-size: 12.5px; }
.rep-i { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.rep-a { display: flex; gap: 6px; }
.tog { position: relative; width: 42px; height: 24px; border-radius: 12px; border: 0; padding: 0; background: var(--line-strong); flex: none; transition: background-color .25s; }
.tog i { position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .3s var(--spring); }
.tog[aria-checked="true"] { background: var(--ok); }
.tog[aria-checked="true"] i { transform: translateX(18px); }
.sched li span { font-size: 13.5px; }
.set-f { display: flex; justify-content: flex-end; margin-top: 14px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.set-row b { display: block; } .set-row small { color: var(--muted); font-size: 12.5px; }

/* ---------- Responsive ---------- */
@media (max-width: 1200px) {

}

function series(days, base, o = {}) {

function byRange(arr, r) {
  const n = arr.length, t0 = today0();
  if (r !== "12M") {
    const k = Math.min(n, parseInt(r, 10) || 30), data = arr.slice(n - k);

  }
  const m = new Map();
  arr.forEach((v, i) => { const d = new Date(t0 - (n - 1 - i) * DAY), key = d.getFullYear() * 12 + d.getMonth(); m.set(key, (m.get(key) || 0) + v); });

  return { labels: keys.map((k) => MON[k % 12]), data: keys.map((k) => m.get(k)) };

    { id: "PR5", name: "Store card double points", type: "pct", v: 5, scope: "Stores", cat: "All", start: t0 + 12 * DAY, end: t0 + 26 * DAY, uses: 0, on: false }

/* ---------- 3. Live: new sales arrive across channels ---------- */
function liveTick() {
  const online = chance(0.5), ci = online ? ri(0, 1) : ri(2, 5), c = CH[ci], p = pick(S.products), amt = p.price * pick([1, 1, 2]);
  S.d.rev[ci][D - 1] += amt; S.d.cnt[ci][D - 1] += 1;
  let label;
  if (online) { const cu = pick(S.customers), collect = S.cfg.collect && chance(0.3); const o = { id: "KO-" + ++S.seq, t: Date.now(), cust: cu.id, name: cu.name, city: cu.city, ch: c.id, items: [{ id: p.id, name: p.name, price: p.price, qty: amt / p.price, size: pick(p.sizes) }], total: amt, fulfil: collect ? "Collect" : "Ship", store: collect ? pick(STORES).id : "", status: "New" }; S.orders.unshift(o); label = `${o.id} on the ${c.name.toLowerCase()} · ${money(amt)}`; }
  else { const sf = S.staff.filter((e) => e.loc === c.id && e.role !== "Online ops"); const x = { id: "KS-" + ++S.sseq, t: Date.now(), store: c.id, reg: "Till 1", staff: pick(sf).name, lines: [{ id: p.id, name: p.name, price: p.price, qty: amt / p.price }], sub: amt, total: amt, method: pick(["Card", "Cash"]), status: "Paid" }; S.sales.unshift(x); const e = S.staff.find((s) => s.name === x.staff); if (e) e.mtd += amt; label = `${c.name} store sale · ${money(amt)}`; }
  const loc = online ? 0 : ci - 1; p.stock[loc] = Math.max(0, p.stock[loc] - 1);

}

/* ---------- 5. Signature: the channel flow (Sankey) ---------- */
function sankey(el, r, opts = {}) {
  chart(el, (anim) => {
    const W = chartW(el), H = opts.h || 300, nw = 12, padL = 96, padR = 96, gap = 8;
    const flows = CH.map((c, i) => CATS.map((_, k) => (inScope(c) ? rangeSum(S.d.rev[i], r) * S.mix[i][k] / sum(S.mix[i]) : 0)));
    const tot = sum(flows.flat()) || 1, chT = flows.map((f) => sum(f)), catT = CATS.map((_, k) => sum(flows, (f) => f[k]));
    const usable = (n) => H - gap * (n - 1), sc = Math.min(usable(CH.length), usable(CATS.length)) / tot;
    let y = 0; const L = chT.map((v) => { const n = { y, h: Math.max(v * sc, v > 0 ? 2 : 0) }; y += n.h + gap; return n; });
    y = 0; const R = catT.map((v) => { const n = { y, h: Math.max(v * sc, 2) }; y += n.h + gap; return n; });
    const x0 = padL, x1 = W - padR, xm = (x0 + x1) / 2, lo = L.map((n) => n.y), ro = R.map((n) => n.y);
    let bands = "", dots = "";
    flows.forEach((f, i) => f.forEach((v, k) => {
      if (v <= 0) return; const h = v * sc, a0 = lo[i], b0 = ro[k]; lo[i] += h; ro[k] += h;
      const d = `M${x0 + nw},${a0}C${xm},${a0} ${xm},${b0} ${x1},${b0}L${x1},${b0 + h}C${xm},${b0 + h} ${xm},${a0 + h} ${x0 + nw},${a0 + h}Z`;
      const mid = `M${x0 + nw},${a0 + h / 2}C${xm},${a0 + h / 2} ${xm},${b0 + h / 2} ${x1},${b0 + h / 2}`;
      bands += `<path class="band${anim ? " k-anim" : ""}" data-i="${i}" data-k="${k}" d="${d}" style="fill:${CH[i].col};--i:${i}"/>`;
      if (anim && !reduced() && h > 3) dots += `<circle r="${Math.min(4, 1.5 + h / 12)}" class="pt" style="offset-path:path('${mid}');fill:${CH[i].col};animation-delay:${(i * 0.25 + k * 0.4).toFixed(2)}s"/>`;
    }));
    const nodes = L.map((n, i) => (n.h ? `<rect x="${x0}" y="${n.y}" width="${nw}" height="${n.h}" rx="3" style="fill:${CH[i].col}"/><text class="k-axis sk-l" x="${x0 - 8}" y="${n.y + n.h / 2 + 4}" text-anchor="end">${esc(CH[i].name)}</text>` : "")).join("") + R.map((n, k) => `<rect x="${x1}" y="${n.y}" width="${nw}" height="${n.h}" rx="3" class="cnode"/><text class="k-axis sk-l" x="${x1 + nw + 8}" y="${n.y + n.h / 2 + 4}">${esc(CATS[k])}</text>`).join("");
    el.innerHTML = `<svg class="k-chart sankey" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Sales flowing from each channel into each category">${bands}${dots}${nodes}</svg>`;
    const svg = el.firstElementChild;
    svg.addEventListener("pointermove", (e) => { const b = e.target.closest(".band"); $$(".band.on", svg).forEach((x) => x !== b && x.classList.remove("on")); if (!b) return Tip.hide(); b.classList.add("on"); const i = +b.dataset.i, k = +b.dataset.k, v = flows[i][k]; Tip.show(`<b>${esc(CH[i].name)} → ${esc(CATS[k])}</b><div>${money(Math.round(v))} · ${pct(v / tot)} of sales</div>`, e.clientX, e.clientY); });
    svg.addEventListener("pointerleave", () => { Tip.hide(); $$(".band.on", svg).forEach((x) => x.classList.remove("on")); });
  });
}

});
Object.assign(ACT, {
  prevRep: (b) => { const r = REPORTS[+b.dataset.i], rows = r[2](); openModal({ title: esc(r[0]), wide: true, body: `<div class="k-tw"><table class="k-table"><thead><tr>${rows[0].map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1, 13).map((row) => `<tr>${row.map((c) => `<td class="${typeof c === "number" ? "num" : ""}">${typeof c === "number" ? num(c) : esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="k-hint">Showing ${Math.min(12, rows.length - 1)} of ${rows.length - 1} rows.</p>`, foot: `<button type="button" class="btn" data-close>Close</button><button type="button" class="btn primary" data-act="dlRep" data-i="${b.dataset.i}">${ic("download")} Download CSV</button>` }); },
  dlRep: (b) => { const r = REPORTS[+b.dataset.i], rows = r[2](); csv("kerbside-" + r[0].toLowerCase().replace(/\s+/g, "-") + ".csv", rows.slice(1), rows[0].map((h, i) => [h, (row) => row[i]])); },
  sched: (b) => { const k = b.dataset.k; S.schedules[k] = !S.schedules[k]; b.setAttribute("aria-checked", String(S.schedules[k])); save(); toast(`${k}: ${S.schedules[k] ? "emailed every week" : "off"}`); }
});
Router.add("settings", "Settings", (v) => {
  const c = S.cfg;
  v.innerHTML = head("Settings", "Brand, channels and how this dashboard looks.", "")
    + `<div class="g-ov"><form class="card" id="setF" novalidate><div class="card-h"><h2>Brand</h2></div>${fieldsHTML([{ k: "brand", label: "Brand name", req: true, full: true }, { k: "tax", label: "Sales tax inside prices (%)", type: "number", min: 0, max: 30, req: true }, { k: "freeShip", label: "Free delivery over (Rs)", type: "number", min: 0, req: true }], c)}<div class="set-f"><button class="btn primary" type="submit">Save</button></div></form>
    <div class="card"><div class="card-h"><h2>Channels</h2></div><ul class="plain sched">${[["web", "Web shop"], ["app", "Mobile app"], ["collect", "Click and collect in stores"]].map(([k, l]) => `<li><span>${l}</span><button type="button" class="tog" role="switch" aria-checked="${!!c[k]}" data-act="chTog" data-k="${k}" aria-label="${l}"><i></i></button></li>`).join("")}</ul><div class="set-row"><div><b>Theme</b><small>Light or dark</small></div><button type="button" class="btn" data-act="theme">${ic("moon")} Switch</button></div><div class="set-row"><div><b>Sidebar</b><small>Show only icons</small></div><button type="button" class="btn" data-act="collapse">${ic("layers")} Toggle</button></div><div class="set-row"><div><b>Reset demo data</b><small>Restores the sample brand</small></div><button type="button" class="btn danger" data-act="reset">${ic("refresh")} Reset</button></div></div></div>`;
  const f = $("#setF", v);
  f.addEventListener("submit", (e) => { e.preventDefault(); const x = readForm(f, [{ k: "brand", label: "Brand name", req: true }, { k: "tax", label: "Tax", type: "number", min: 0, max: 30, req: true }, { k: "freeShip", label: "Free delivery", type: "number", min: 0, req: true }]); if (!x) return; Object.assign(c, x); save(); paintChrome(); toast("Settings saved"); });
});
Object.assign(ACT, {
  chTog: (b) => { const k = b.dataset.k; S.cfg[k] = !S.cfg[k]; b.setAttribute("aria-checked", String(S.cfg[k])); save(); toast(`${b.getAttribute("aria-label")} ${S.cfg[k] ? "on" : "off"}`); },
  collapse: () => { S.collapsed = !S.collapsed; save(); paintChrome(); setTimeout(() => { Router.mark(); redrawCharts(); }, 320); },
  reset: () => confirmBox("Reset all demo data on this device?", () => { Store.clear(); seedData(); S.ver = VER; S.day0 = today0(); feed = []; save(); paintChrome(); Router.refresh(); toast("Demo data reset"); }, { yes: "Reset" })
});

/* ---------- 15. Chrome and boot ---------- */
function paintChrome() {
  $("#app").classList.toggle("mini", !!S.collapsed);
  $("#brandSub").textContent = S.cfg.brand;
  const n = S.orders.filter((o) => o.status === "New").length, e = $("#nOrd"); e.textContent = n; e.hidden = !n;
  $("#meBox").innerHTML = avatar("Ayesha Raza");
}
function paintScope() { $("#scope").innerHTML = seg("sc", ["All channels", "Online", "Stores"], S.scope, "Channel filter"); }
segWire($("#scope"), "sc", (x) => { S.scope = x; save(); toast("Showing " + x.toLowerCase()); Router.refresh(); });
on("route", (id) => { const c = $("#crumb"); if (c) c.textContent = Router.pages[id].title; });
S = loadState(seedData, VER);
paintIcons(); Theme.label(); paintChrome(); paintScope();
CMDS = [{ label: "Transfer stock", run: ACT.transfer }, { label: "New promotion", run: () => promoForm(null) }, { label: "Log a return", run: ACT.newReturn }, { label: "Show online only", run: () => { S.scope = "Online"; paintScope(); Router.refresh(); } }, { label: "Show stores only", run: () => { S.scope = "Stores"; paintScope(); Router.refresh(); } }, { label: "Switch theme", run: () => Theme.toggle() }];
Notes.add(`${S.orders.filter((o) => o.status === "Ready to collect").length} click and collect orders are waiting in stores`, "info");
Notes.add(`${S.products.filter((p) => p.stock.slice(1).some((s) => s === 0)).length} products are out in at least one store`, "warn");
Notes.add("Winter launch is live everywhere", "ok");
Router.start();

</script>
</body>
</html>
