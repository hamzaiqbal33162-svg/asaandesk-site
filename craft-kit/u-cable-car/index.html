<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cable Car · cloud sync</title>
<script>
  // Theme: ?theme=light|dark overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    color-scheme: light;
    --bg1: #fff1e3;
    --bg2: #e9d8cf;
    --sky1: #ffd2ad;
    --sky2: #c7e6ff;
    --sun: #ffad5c;
    --hill1: #a6d8a0;
    --hill2: #7fc08f;
    --tree: #4f9d62;
    --cable: #3a3b48;
    --cloud: #ffffff;
    --cloudline: #c9dcf3;
    --cabin: #ef4444;
    --cabin2: #b91c1c;
    --glass: #ffe9a8;
    --device: #273043;
    --screen: #eaf3ff;
    --card: rgba(255, 255, 255, .88);
    --edge: #ecdccf;
    --ink: #1d2433;
    --soft: #67707f;
    --row: #f7f1ea;
    --pend: #f59e0b;
    --ok: #16a34a;
    --accent: #ef4444;
    --focus: #2563eb;
    --stars: 0;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg1: #191a33;
      --bg2: #07070f;
      --sky1: #0b1533;
      --sky2: #2b2457;
      --sun: #f4efd9;
      --hill1: #1e3b36;
      --hill2: #162e29;
      --tree: #24493f;
      --cable: #a7b0c8;
      --cloud: #d8e0f5;
      --cloudline: #8e9cc3;
      --glass: #ffd36b;
      --device: #0d111b;
      --screen: #1d2a44;
      --card: rgba(22, 24, 44, .9);
      --edge: #2c2e4c;
      --ink: #e9ebf7;
      --soft: #9ea3c0;
      --row: #1f2140;
      --pend: #fbbf24;
      --ok: #34d399;
      --accent: #f87171;
      --focus: #93c5fd;
      --stars: 1;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #191a33;
    --bg2: #07070f;
    --sky1: #0b1533;
    --sky2: #2b2457;
    --sun: #f4efd9;
    --hill1: #1e3b36;
    --hill2: #162e29;
    --tree: #24493f;
    --cable: #a7b0c8;
    --cloud: #d8e0f5;
    --cloudline: #8e9cc3;
    --glass: #ffd36b;
    --device: #0d111b;
    --screen: #1d2a44;
    --card: rgba(22, 24, 44, .9);
    --edge: #2c2e4c;
    --ink: #e9ebf7;
    --soft: #9ea3c0;
    --row: #1f2140;
    --pend: #fbbf24;
    --ok: #34d399;
    --accent: #f87171;
    --focus: #93c5fd;
    --stars: 1;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body, .stage { grid-template-columns: minmax(0, 1fr); } /* fixed-width cards never widen the page */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2) 90%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .stage { width: 100%; padding: 20px 16px; display: grid; place-items: center; }
  .wrap { width: 660px; max-width: 100%; border-radius: 26px; overflow: hidden; background: var(--card); border: 1px solid var(--edge); box-shadow: 0 30px 60px -36px rgba(40, 20, 40, .7); }

  /* ---------- Scene ---------- */
  .scene { display: block; width: 100%; height: auto; }
  .k1 { stop-color: var(--sky1); }
  .k2 { stop-color: var(--sky2); }
  .sun { fill: var(--sun); }
  .stars circle { fill: #fff; opacity: calc(var(--stars) * .85); animation: tw 2.8s ease-in-out infinite; }
  .stars circle:nth-child(2n) { animation-delay: -1.4s; }
  .hill1 { fill: var(--hill1); }
  .hill2 { fill: var(--hill2); }
  .tree rect { fill: #8b5e3c; }
  .tree circle { fill: var(--tree); }
  .bird { fill: none; stroke: var(--cable); stroke-width: 1.8; stroke-linecap: round; opacity: .7; }
  .drift.b { animation-duration: 19s; animation-direction: alternate-reverse; }
  .cable { fill: none; stroke: var(--cable); stroke-width: 2; }
  .cable.haul { stroke-width: 1; opacity: .5; }
  .mast { stroke: var(--cable); stroke-width: 4; stroke-linecap: round; }
  .cloudshape { fill: var(--cloud); stroke: var(--cloudline); stroke-width: 2; }
  .cloudring { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; opacity: 0; }
  .device { fill: var(--device); }
  .screen { fill: var(--screen); }
  .scrline { fill: var(--cloudline); opacity: .7; }
  .badge circle { stroke: var(--card); stroke-width: 2; }
  .badge text { fill: #fff; font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; font-family: inherit; }
  .cabin { fill: var(--cabin); stroke: var(--cabin2); stroke-width: 1.5; }
  .window { fill: var(--glass); }
  .hanger { stroke: var(--cable); stroke-width: 2.5; }
  .trolley { fill: var(--cable); }
  .fly { fill: #fff; stroke: #64748b; stroke-width: 1; }
  .drift { animation: drift 14s ease-in-out infinite alternate; }
  .bob { animation: bob 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(14px); } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes tw { 50% { opacity: calc(var(--stars) * .25); } }

  /* ---------- Panel under the scene ---------- */
  .panel { padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status { flex: 1; min-width: 170px; margin: 0; font-size: 13.5px; color: var(--soft); }
  .status b { color: var(--ink); }
  .switch { display: inline-flex; align-items: center; gap: 9px; padding: 6px 4px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer; }
  .switch .track { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--edge); transition: background .3s; }
  .switch .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .3); transition: transform .45s var(--spring); }
  .switch[aria-checked="true"] .track { background: var(--ok); }
  .switch[aria-checked="true"] .track::after { transform: translateX(18px); }
  .btn { padding: 10px 16px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; box-shadow: 0 10px 18px -12px var(--accent); transition: transform .3s var(--spring), opacity .2s; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, .switch:focus-visible, .field input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dev { padding: 10px; border-radius: 16px; background: var(--row); min-width: 0; }
  .dev h2 { margin: 0 0 8px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .dev h2 svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
  .dev ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; min-height: 120px; align-content: start; }
  .dev li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--card); font-size: 13px; min-width: 0; }
  .dev li.new { animation: pop .55s var(--spring); }
  .dev li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev li .k { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; background: var(--row); }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--pend); box-shadow: 0 0 0 3px rgba(245, 158, 11, .2); }
  .dot.ok { background: var(--ok); box-shadow: none; position: relative; width: 14px; height: 14px; }
  .dot.ok::after { content: ""; position: absolute; left: 4.5px; top: 2px; width: 3px; height: 6px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .field { display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--edge); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.9); } }

  @media (max-width: 460px) {
    .lists { grid-template-columns: 1fr; }
    .dev ul { min-height: 0; }
    .status { flex-basis: 100%; }
    .switch { margin-right: auto; }
    .field { flex-wrap: wrap; }
    .field input { flex-basis: 100%; }
    .field .btn { flex: 1; }
  }

  /* Calm mode: same steps, no big motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="wrap" aria-labelledby="st">
    <svg class="scene" viewBox="0 0 600 290" aria-hidden="true">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="k1" offset="0" /><stop class="k2" offset="1" /></linearGradient></defs>
      <rect width="600" height="290" fill="url(#sky)" />
      <g class="stars"><circle cx="40" cy="30" r="1.5" /><circle cx="140" cy="54" r="1.1" /><circle cx="470" cy="34" r="1.4" /><circle cx="560" cy="80" r="1.1" /><circle cx="210" cy="20" r="1" /><circle cx="400" cy="60" r="1.2" /></g>
      <circle class="sun" cx="508" cy="64" r="22" />
      <g class="drift"><path class="cloudshape" d="M40 110h46a12 12 0 0 0-4-23 15 15 0 0 0-28-4 11 11 0 0 0-14 27z" opacity=".55" /></g>
      <path class="hill2" d="M0 290 V236 Q70 196 150 232 T330 250 T600 226 V290Z" />
      <path class="hill1" d="M0 290 V252 Q80 230 160 258 T380 262 Q480 238 600 256 V290Z" />
      <!-- trees and birds -->
      <g class="tree"><rect x="168" y="232" width="4" height="14" rx="1" /><circle cx="170" cy="228" r="10" /></g>
      <g class="tree"><rect x="194" y="238" width="3" height="11" rx="1" /><circle cx="195.5" cy="235" r="7.5" /></g>
      <g class="tree"><rect x="392" y="244" width="4" height="14" rx="1" /><circle cx="394" cy="240" r="10" /></g>
      <g class="tree"><rect x="418" y="242" width="3" height="11" rx="1" /><circle cx="419.5" cy="239" r="7" /></g>
      <g class="drift b"><path class="bird" d="M150 70q6-6 12 0q6-6 12 0" /><path class="bird" d="M178 58q4-4 8 0q4-4 8 0" /></g>

      <!-- masts and cables: phone station, cloud, laptop station -->
      <line class="mast" x1="80" y1="164" x2="80" y2="114" />
      <line class="mast" x1="533" y1="176" x2="533" y2="118" />
      <path class="cable haul" d="M80 122 Q190 136 300 94 Q410 136 533 126" />
      <path class="cable" id="cable" d="M80 116 Q190 130 300 88 Q410 130 533 120" />

      <!-- the cloud station -->
      <g id="cloudG" class="bob">
        <path class="cloudshape" d="M232 96h138a26 26 0 0 0-8-51 34 34 0 0 0-62-12 26 26 0 0 0-43 9 22 22 0 0 0-25 54z" />
        <path d="M282 66l18-14 18 14M300 52v26" fill="none" stroke="var(--cloudline)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <circle class="cloudring" id="ring" cx="300" cy="62" r="40" />
      </g>

      <!-- phone -->
      <g>
        <rect class="device" x="56" y="164" width="48" height="84" rx="9" />
        <rect class="screen" x="60" y="172" width="40" height="66" rx="4" />
        <rect class="scrline" x="65" y="180" width="26" height="5" rx="2" />
        <rect class="scrline" x="65" y="191" width="30" height="5" rx="2" />
        <rect class="scrline" x="65" y="202" width="20" height="5" rx="2" />
        <rect class="scrline" x="65" y="213" width="28" height="5" rx="2" />
        <g class="badge" id="phoneBadge" transform="translate(102 166)"><circle r="10" fill="var(--pend)" /><text id="phoneN">0</text></g>
      </g>
      <!-- laptop -->
      <g>
        <rect class="device" x="486" y="176" width="94" height="60" rx="6" />
        <rect class="screen" x="491" y="181" width="84" height="50" rx="3" />
        <g id="laptopTiles"></g>
        <path class="device" d="M476 236 H590 L584 244 H482Z" />
        <g class="badge" transform="translate(580 178)"><circle r="10" fill="var(--ok)" /><text id="laptopN">0</text></g>

      <!-- the gondola -->
      <g id="car">
        <circle class="trolley" r="4.5" />
        <g id="swing">

          <rect class="cabin" x="-19" y="15" width="38" height="28" rx="7" />
          <rect class="window" x="-14" y="20" width="28" height="11" rx="3" />
          <path d="M-19 36 H19" stroke="var(--cabin2)" stroke-width="2" />
          <g class="badge" id="cargo" transform="translate(17 16)" opacity="0"><circle r="8" fill="#1d4ed8" /><text id="cargoN" style="font-size:9.5px">0</text></g>
        </g>
      </g>
      <g id="flights"></g>
    </svg>

    <div class="panel">
      <div class="bar">
        <p class="status" id="st"><b>Sync is on.</b> Changes on your phone ride up to the cloud.</p>
        <button class="switch" type="button" role="switch" aria-checked="true" id="auto"><span class="track"></span>Auto sync</button>
        <button class="btn" type="button" id="syncNow">Sync now</button>

        <div class="dev">

        </div>
        <div class="dev">
          <h2><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1.5" /><path d="M1 13.5h14" /></svg>Laptop</h2>

        <input id="note" type="text" maxlength="40" placeholder="Write a note on the phone…" autocomplete="off">
        <button class="btn ghost" type="submit">Add note</button>
        <button class="btn ghost" type="button" id="addFile">Add file</button>

  </section>
</main>

<script>
  // ---------- Cable Car cloud sync ----------
  const $ = (s) => document.querySelector(s);
  const cable = $("#cable"), car = $("#car"), swing = $("#swing"), cargo = $("#cargo"), cargoN = $("#cargoN");
  const flights = $("#flights"), ring = $("#ring"), cloudG = $("#cloudG");
  const phoneList = $("#phoneList"), laptopList = $("#laptopList"), phoneN = $("#phoneN"), laptopN = $("#laptopN");
  const st = $("#st"), live = $("#live"), autoBtn = $("#auto"), syncBtn = $("#syncNow"), noteIn = $("#note"), picker = $("#picker");
  const NS = "http://www.w3.org/2000/svg";
  const SPRING = "cubic-bezier(.34, 1.56, .64, 1)";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));

  // ---------- Data: what each device holds ----------
  let seq = 0;
  const phone = [
    { id: ++seq, name: "Hunza road trip.jpg", icon: "img", synced: true },
    { id: ++seq, name: "Grocery list", icon: "note", synced: false },
    { id: ++seq, name: "IMG_2041.jpg", icon: "img", synced: false }
  ];
  const laptop = [{ id: 1, name: "Hunza road trip.jpg", icon: "img" }];
  let auto = true;
  try { auto = localStorage.getItem("cc-cable-car-auto") !== "off"; } catch (e) { /* storage blocked: keep the default */ }

  // Tiny line icons for each kind of item
  const KIND = {
    img: ['<rect x="2" y="3" width="12" height="10" rx="2" /><path d="M3 12l3.5-4 2.5 3 1.5-1.5L13 12" /><circle cx="10.5" cy="6" r="1" />', "#3b82f6"],
    note: ['<path d="M4 2.5h8v11H4zM6 6h4M6 8.5h4M6 11h2" />', "#f59e0b"],
    file: ['<path d="M4 2h5l3 3v9H4zM9 2v3h3" />', "#8b5cf6"],
    audio: ['<path d="M6 12V4l7-1.5v8" /><circle cx="4.5" cy="12" r="1.8" /><circle cx="11.5" cy="10.5" r="1.8" />', "#ec4899"]
  };
  function li(item, isNew, pending) {
    const el = document.createElement("li");
    if (isNew) el.className = "new";
    el.innerHTML = '<span class="k" aria-hidden="true"></span><span class="n"></span><span></span>';
    const kind = KIND[item.icon] || KIND.file;
    el.querySelector(".k").innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="' + kind[1] + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + kind[0] + "</svg>";
    el.querySelector(".n").textContent = item.name;
    const d = el.lastChild;
    d.className = pending ? "dot" : "dot ok";
    d.setAttribute("role", "img");
    d.setAttribute("aria-label", pending ? "waiting to sync" : "synced");
    return el;
  }
  // Keep the lists short: the oldest synced items roll off
  function trim() {
    while (phone.length > 4) { const i = phone.findIndex((x) => x.synced); if (i < 0) break; phone.splice(i, 1); }
    while (laptop.length > 4) laptop.shift();
  }
  function render(newIds = []) {
    trim();
    phoneList.replaceChildren(...phone.map((x) => li(x, newIds.includes("p" + x.id), !x.synced)));
    laptopList.replaceChildren(...laptop.map((x) => li(x, newIds.includes("l" + x.id), false)));
    const pend = phone.filter((x) => !x.synced).length;
    phoneN.textContent = pend;
    $("#phoneBadge").style.opacity = pend ? 1 : .35;
    laptopN.textContent = laptop.length;
    // little file tiles on the laptop screen
    const tiles = $("#laptopTiles");
    tiles.replaceChildren();
    laptop.forEach((x, i) => {
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", 497 + (i % 4) * 19); r.setAttribute("y", 190 + Math.floor(i / 4) * 18);
      r.setAttribute("width", 14); r.setAttribute("height", 14); r.setAttribute("rx", 3);
      r.setAttribute("fill", ["#60a5fa", "#f472b6", "#34d399", "#fbbf24"][x.id % 4]);
      tiles.appendChild(r);
    });
  }

  // ---------- Gondola physics: position along the cable, pendulum swing ----------
  const L = cable.getTotalLength();
  let sCloud = 0;
  for (let s = 0, best = 1e9; s <= L; s += 2) { const y = cable.getPointAtLength(s).y; if (y < best) { best = y; sCloud = s; } }
  const S_PHONE = 66, S_LAPTOP = L - 84;            // rest stops, clear of the phone badge and the laptop screen
  const sim = { s: S_PHONE, v: 0, ang: 0, w: 0 };
  let tween = null, lastT = performance.now();

  function travel(to, ms) {
    return new Promise((resolve) => {
      if (calm()) { sim.s = to; resolve(); return; }
      tween = { from: sim.s, to, t0: performance.now(), ms, resolve };
    });
  }
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  (function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    const prev = sim.s;
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / tween.ms);
      sim.s = tween.from + (tween.to - tween.from) * ease(k);
      if (k >= 1) { const r = tween.resolve; tween = null; r(); }
    }
    const v = (sim.s - prev) / Math.max(dt, .001);
    const acc = Math.max(-1500, Math.min(1500, (v - sim.v) / Math.max(dt, .001)));
    sim.v = v;
    // the cabin lags behind when the car speeds up and swings on when it stops
    if (calm()) sim.ang = 0;
    else {
      sim.w += (-38 * sim.ang - 2.2 * sim.w + acc * .006) * dt;   // positive angle = cabin swings back
      sim.ang += sim.w * dt;
      sim.ang = Math.max(-.35, Math.min(.35, sim.ang));
    }
    const p = cable.getPointAtLength(sim.s);
    car.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    swing.setAttribute("transform", `rotate(${((sim.ang + (calm() ? 0 : Math.sin(now / 1100) * .05)) * 57.3).toFixed(2)}) scale(1.3)`);
    requestAnimationFrame(frame);
  })(lastT);

  // A small paper card flies between two points in an arc
  function fly(x1, y1, x2, y2, delay) {
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("class", "fly");
    r.setAttribute("width", 14); r.setAttribute("height", 17); r.setAttribute("rx", 2);
    r.setAttribute("x", -7); r.setAttribute("y", -8.5);
    r.setAttribute("transform", `translate(${x1} ${y1})`);
    r.style.opacity = 0;
    flights.appendChild(r);
    if (calm()) { r.remove(); return sleep(delay); }
    const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 34;
    return r.animate([
      { transform: `translate(${x1}px, ${y1}px) rotate(0) scale(.6)`, opacity: 0 },
      { transform: `translate(${mx}px, ${my}px) rotate(-14deg) scale(1)`, opacity: 1, offset: .5 },
      { transform: `translate(${x2}px, ${y2}px) rotate(8deg) scale(.5)`, opacity: .2 }
    ], { duration: 640, delay, easing: "cubic-bezier(.3,.6,.4,1)", fill: "backwards" }).finished.catch(() => {}).then(() => r.remove());
  }
  const carPos = () => { const p = cable.getPointAtLength(sim.s); return { x: p.x, y: p.y + 37 }; };
  function sparkle(x, y) {
    if (calm()) return;
    for (let i = 0; i < 10; i++) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("r", 3);
      c.setAttribute("fill", ["#fbbf24", "#34d399", "#60a5fa", "#f472b6"][i % 4]);
      flights.appendChild(c);
      const a = (i / 10) * Math.PI * 2, d = 34 + Math.random() * 20;
      c.animate([{ transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1 }, { transform: `translate(${x + Math.cos(a) * d}px, ${y + Math.sin(a) * d}px) scale(.2)`, opacity: 0 }], { duration: 800, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => c.remove();
    }
  }
  const say = (html, words) => { st.innerHTML = html; live.textContent = words || st.textContent; };

  // ---------- The sync ride ----------
  let syncing = false, lastSync = null;
  async function sync() {
    if (syncing) return;
    const items = phone.filter((x) => !x.synced);
    if (!items.length) {
      say("<b>Everything is up to date.</b> Nothing waiting on the phone.");
      sim.w += 1.4;
      return;
    }
    syncing = true;
    syncBtn.disabled = true;
    const n = items.length, word = n + " item" + (n > 1 ? "s" : "");

    // 1. Anticipation: the cabin rocks and the waiting rows pulse
    say("<b>Loading " + word + "…</b>");
    sim.w -= 2.4;
    phoneList.querySelectorAll(".dot:not(.ok)").forEach((d) => play(d, [{ transform: "scale(1)" }, { transform: "scale(1.8)" }, { transform: "scale(1)" }], { duration: 500, easing: SPRING }));
    await sleep(280);

    // 2. Cards fly from the phone into the cabin
    const c0 = carPos();
    await Promise.all(items.slice(0, 4).map((x, i) => fly(80, 196, c0.x, c0.y, i * 150)));
    cargoN.textContent = n;
    cargo.setAttribute("opacity", 1);
    play(cargo, [{ transform: "translate(17px,16px) scale(0)" }, { transform: "translate(17px,16px) scale(1)" }], { duration: 400, easing: SPRING });

    // 3. Up to the cloud
    say("<b>Riding up to the cloud…</b> " + word);
    await travel(sCloud, 1500);
    play(cloudG, [{ transform: "scale(1)" }, { transform: "scale(1.06, .95)" }, { transform: "scale(1)" }], { duration: 520, easing: SPRING });
    ring.style.opacity = 1;
    ring.setAttribute("stroke-dasharray", "252");
    play(ring, [{ strokeDashoffset: 252, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, offset: .8 }, { strokeDashoffset: 0, opacity: 0 }], { duration: 900, easing: "ease-in-out" });
    say("<b>Saved in the cloud.</b> Sending on to your laptop…");
    await sleep(calm() ? 200 : 900);
    ring.style.opacity = 0;

    // 4. Down to the laptop and unload
    await travel(S_LAPTOP, 1400);
    const c1 = carPos();
    await Promise.all(items.slice(0, 4).map((x, i) => fly(c1.x, c1.y, 533, 205, i * 140)));
    cargo.setAttribute("opacity", 0);
    const fresh = [];
    items.forEach((x) => { x.synced = true; laptop.push({ id: x.id, name: x.name, icon: x.icon }); fresh.push("l" + x.id); });
    render(fresh);
    sparkle(533, 196);
    sparkle(300, 60);
    lastSync = new Date();
    const time = lastSync.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    say("<b>Synced at " + time + ".</b> " + word + " now on your laptop.", "Sync complete. " + word + " copied to the laptop.");

    // 5. The empty car glides home
    await travel(S_PHONE, 1700);
    syncing = false;
    syncBtn.disabled = false;
    if (auto && phone.some((x) => !x.synced)) setTimeout(sync, 500);
  }

  // ---------- Adding things on the phone ----------
  function addToPhone(name, icon) {
    const item = { id: ++seq, name, icon, synced: false };
    phone.push(item);
    render(["p" + item.id]);
    say(auto ? "<b>New on the phone:</b> " + name.replace(/[<>&]/g, "") + ". Syncing…" : "<b>Waiting:</b> " + phone.filter((x) => !x.synced).length + " to sync. Auto sync is off.");
    if (auto) setTimeout(sync, 700);
  }
  $("#form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = noteIn.value.trim();
    if (!v) { noteIn.focus(); say("<b>Type a note first.</b>"); return; }
    addToPhone(v, "note");
    noteIn.value = "";
  });
  $("#addFile").addEventListener("click", () => picker.click());
  picker.addEventListener("change", () => {
    [...picker.files].slice(0, 4).forEach((f) => addToPhone(f.name, /^image\//.test(f.type) ? "img" : /^audio\//.test(f.type) ? "audio" : "file"));
    picker.value = "";
  });
  syncBtn.addEventListener("click", () => { play(syncBtn, [{ transform: "scale(1)" }, { transform: "scale(.92)" }, { transform: "scale(1)" }], { duration: 260 }); sync(); });

  function paintAuto() {
    autoBtn.setAttribute("aria-checked", auto ? "true" : "false");
    if (!syncing) say(auto ? "<b>Sync is on.</b> Changes on your phone ride up to the cloud." : "<b>Auto sync is off.</b> Press Sync now when you are ready.");
  }
  autoBtn.addEventListener("click", () => {
    auto = !auto;
    try { localStorage.setItem("cc-cable-car-auto", auto ? "on" : "off"); } catch (e) { /* not saved */ }
    paintAuto();
    if (auto && phone.some((x) => !x.synced)) setTimeout(sync, 500);
  });

  render();
  paintAuto();

  // ---------- Auto demo: sync what is waiting, then write notes, until the visitor takes over ----------
  const NOTES = ["Pay electricity bill", "Ammi's birthday cake", "Book Murree hotel", "Send invoice to Ali"];
  let demoOn = true, noteIx = 0;
  async function demo() {
    await sleep(420);
    if (!demoOn) return;
    const wasAuto = auto;
    auto = true;
    await sync();
    auto = wasAuto;
    while (demoOn) {
      await sleep(1800);
      if (!demoOn || syncing) continue;
      const text = NOTES[noteIx++ % NOTES.length];
      for (let i = 1; i <= text.length && demoOn; i++) { noteIn.value = text.slice(0, i); await sleep(45); }
      if (!demoOn) return;
      await sleep(250);
      noteIn.value = "";
      phone.push({ id: ++seq, name: text, icon: "note", synced: false });
      render(["p" + seq]);
      say("<b>New on the phone:</b> " + text + ". Syncing…");
      await sleep(600);
      if (demoOn) await sync();
    }
  }
  function takeOver(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false;
    if (noteIn.value && document.activeElement !== noteIn) noteIn.value = "";
  }
  ["pointerdown", "keydown"].forEach((t) => addEventListener(t, takeOver, true));
  demo();
</script>
</body>
</html>
