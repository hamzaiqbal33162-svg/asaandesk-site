<!doctype html>
<!-- Chill & Craft · Paper Boat · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Boat · fold a wish and set it sailing</title>
<script>
  // Theme: ?theme=light or ?theme=dark in the URL overrides the system setting
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ---------- Colour tokens: light = fresh after the rain, dark = drizzly evening ---------- */
  :root {
    --page: #eef6f2; --page2: #dff0f4; --ink: #17323a; --muted: #557078;
    --sky1: #a9d8ea; --sky2: #e8f5ef; --bank1: #7cbf6a; --bank2: #4f9a55; --tree1: #3f9a58; --tree2: #2f7f4a; --tree3: #5bb36a;
    --house1: #f2d4b0; --house2: #e9b9a1; --house3: #cfe0e8; --reed: #3e7d4a; --rainbow: 0.38; --moon: 0;
    --chip: rgba(255, 255, 255, 0.78); --chip-line: rgba(23, 50, 58, 0.14);
    --on: #17323a; --on-ink: #f2fbf8; --focus: #d9480f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #071117; --page2: #11222e; --ink: #e2f0f2; --muted: #8fa9b0;
      --sky1: #142440; --sky2: #36486a; --bank1: #24503a; --bank2: #183a2b; --tree1: #1d4733; --tree2: #133526; --tree3: #2a5d40;
      --house1: #4a3f4a; --house2: #3e3446; --house3: #2f3a4e; --reed: #1f4a33; --rainbow: 0; --moon: 1;
      --chip: rgba(16, 32, 40, 0.78); --chip-line: rgba(255, 255, 255, 0.1);
      --on: #ffe3a3; --on-ink: #1d1606; --focus: #ffc078;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #071117; --page2: #11222e; --ink: #e2f0f2; --muted: #8fa9b0;
    --sky1: #142440; --sky2: #36486a; --bank1: #24503a; --bank2: #183a2b; --tree1: #1d4733; --tree2: #133526; --tree3: #2a5d40;
    --house1: #4a3f4a; --house2: #3e3446; --house3: #2f3a4e; --reed: #1f4a33; --rainbow: 0; --moon: 1;
    --chip: rgba(16, 32, 40, 0.78); --chip-line: rgba(255, 255, 255, 0.1);
    --on: #ffe3a3; --on-ink: #1d1606; --focus: #ffc078;
    color-scheme: dark;
  }

  /* ---------- Page and stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: radial-gradient(100% 60% at 50% 0%, var(--page2), transparent 70%), var(--page);
  }
  .stage { width: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap, .scene, .wishbar { width: min(500px, 100%, calc((100vh - 230px) * 0.8)); min-width: 280px; }
  .cap { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); padding: 0 4px; }
  .cap b { font-size: 15px; color: var(--ink); }
  .scene {
    position: relative; aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; isolation: isolate;
    touch-action: manipulation; cursor: pointer;
    box-shadow: 0 30px 60px -22px rgba(10, 40, 50, 0.5), 0 12px 24px -12px rgba(10, 40, 50, 0.35);
  }
  .scene > svg, .scene > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Drawn parts ---------- */
  .sk1 { stop-color: var(--sky1); } .sk2 { stop-color: var(--sky2); }
  .bk1 { stop-color: var(--bank1); } .bk2 { stop-color: var(--bank2); }
  .t1 { fill: var(--tree1); } .t2 { fill: var(--tree2); } .t3 { fill: var(--tree3); }
  .h1 { fill: var(--house1); } .h2 { fill: var(--house2); } .h3 { fill: var(--house3); }
  .rainbow { opacity: var(--rainbow); }
  .moon { opacity: var(--moon); }
  .lampglow { opacity: calc(0.25 + var(--moon) * 0.75); }
  .trees { transform-box: view-box; transform-origin: 200px 330px; }
  .trees.gust { animation: gust 1.4s cubic-bezier(.3, .7, .3, 1); }
  @keyframes gust { 25% { transform: skewX(-4deg); } 55% { transform: skewX(2deg); } 80% { transform: skewX(-1deg); } }
  .reed { fill: var(--reed); transform-box: fill-box; transform-origin: 50% 100%; animation: reed 4s ease-in-out infinite; }
  @keyframes reed { 50% { transform: rotate(4deg); } }
  .paper { fill: #fdfcf6; stroke: #c9c2b0; stroke-width: 0.8; stroke-linejoin: round; }
  .rule { stroke: #9cc3e6; stroke-width: 0.7; }
  .margin { stroke: #f08a8a; stroke-width: 0.8; }
  .hand { font: italic 600 11px "Bradley Hand", "Segoe Print", "Snell Roundhand", cursive; fill: #2b4a8c; }
  .hull { font: italic 700 7.5px "Bradley Hand", "Segoe Print", "Snell Roundhand", cursive; fill: #2b4a8c; }

  /* ---------- Controls ---------- */
  .wishbar { display: flex; gap: 8px; }
  .wishbar input {
    flex: 1 1 0; width: 0; min-width: 0; font: 500 15px/1.2 system-ui, sans-serif; color: var(--ink); background: var(--chip);
    border: 1px solid var(--chip-line); border-radius: 999px; padding: 11px 16px;
  }
  .wishbar input::placeholder { color: var(--muted); }
  .wishbar input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn {
    appearance: none; border: 1px solid transparent; background: var(--on); color: var(--on-ink); white-space: nowrap;
    font: 650 14px/1 system-ui, sans-serif; padding: 11px 16px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.25s cubic-bezier(.34, 1.56, .64, 1), box-shadow 0.25s ease, opacity 0.2s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(0, 0, 0, 0.5); }
  .btn:active { transform: scale(0.95); }
  .btn[aria-disabled="true"] { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .log { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 26px; margin: 0; padding: 0; list-style: none; max-width: min(500px, 100%); }
  .log li {
    font: 600 12px/1 system-ui, sans-serif; color: var(--muted); padding: 6px 10px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--chip-line); animation: pop 0.5s cubic-bezier(.34, 1.7, .5, 1);
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 600; text-align: center; }
  .hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .reed, .trees.gust, .log li { animation: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1 class="sr">Paper Boat: write a wish, fold it into a paper boat and let it sail</h1>
  <div class="cap"><b>Paper Boat</b><span id="count">0 boats sailed</span></div>
  <div class="scene" id="scene" aria-describedby="hint">
    <!-- far bank: sky, rainbow or moon, houses, trees and a lamp -->
    <svg viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sk1"/><stop offset="1" class="sk2"/></linearGradient>
        <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="bk1"/><stop offset="1" class="bk2"/></linearGradient>
        <radialGradient id="lampG"><stop offset="0" stop-color="#ffe2a0" stop-opacity="0.9"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="400" height="340" fill="url(#sky)"/>
      <g class="rainbow" fill="none" stroke-width="7">
        <circle cx="310" cy="330" r="190" stroke="#ff8a8a"/><circle cx="310" cy="330" r="183" stroke="#ffc46b"/>
        <circle cx="310" cy="330" r="176" stroke="#fff08a"/><circle cx="310" cy="330" r="169" stroke="#9fe39a"/>
        <circle cx="310" cy="330" r="162" stroke="#8ccfff"/><circle cx="310" cy="330" r="155" stroke="#b9a2ff"/>
      </g>
      <g class="moon"><circle cx="86" cy="70" r="16" fill="#f4efdc"/><circle cx="80" cy="66" r="3" fill="#ddd6bf"/><circle cx="91" cy="76" r="2" fill="#ddd6bf"/></g>
      <g id="clouds" opacity="0.85">
        <g id="c1"><ellipse cx="0" cy="0" rx="34" ry="11" fill="#fff"/><ellipse cx="-10" cy="-8" rx="16" ry="12" fill="#fff"/><ellipse cx="10" cy="-10" rx="18" ry="14" fill="#fff"/></g>
        <g id="c2"><ellipse cx="0" cy="0" rx="26" ry="9" fill="#fff"/><ellipse cx="8" cy="-8" rx="14" ry="11" fill="#fff"/></g>
      </g>
      <!-- flat-roof houses with water tanks -->
      <g>
        <rect class="h1" x="18" y="250" width="58" height="62"/><rect class="h3" x="30" y="241" width="12" height="9"/>
        <rect class="h2" x="76" y="236" width="50" height="76"/><rect class="h3" x="102" y="227" width="12" height="9"/>
        <rect class="h3" x="232" y="246" width="54" height="66"/><rect class="h1" x="286" y="232" width="46" height="80"/>
        <rect class="h2" x="332" y="256" width="60" height="56"/><rect class="h3" x="350" y="247" width="12" height="9"/>
        <g fill="#5b6f8a" opacity="0.55">
          <rect x="28" y="262" width="8" height="10"/><rect x="50" y="262" width="8" height="10"/><rect x="88" y="250" width="8" height="10"/><rect x="106" y="250" width="8" height="10"/>
          <rect x="88" y="276" width="8" height="10"/><rect x="244" y="260" width="8" height="10"/><rect x="264" y="260" width="8" height="10"/>
          <rect x="296" y="246" width="8" height="10"/><rect x="314" y="246" width="8" height="10"/><rect x="346" y="268" width="8" height="10"/><rect x="368" y="268" width="8" height="10"/>
        </g>
      </g>
      <g class="trees" id="trees">
        <rect x="150" y="260" width="5" height="56" fill="#5a3f2a"/>
        <circle class="t2" cx="152" cy="250" r="26"/><circle class="t1" cx="136" cy="262" r="18"/><circle class="t3" cx="166" cy="240" r="16"/>
        <rect x="204" y="272" width="4" height="44" fill="#5a3f2a"/>
        <circle class="t1" cx="206" cy="264" r="19"/><circle class="t3" cx="196" cy="256" r="12"/>
      </g>
      <circle class="lampglow" cx="350" cy="276" r="26" fill="url(#lampG)"/>
      <rect x="348.5" y="278" width="3" height="40" fill="#2d3a40"/>
      <rect x="344" y="272" width="12" height="7" rx="2" fill="#2d3a40"/><rect x="346" y="276" width="8" height="3" fill="#ffe2a0"/>
      <path fill="url(#bank)" d="M0 318 C80 310 150 322 220 314 C290 306 340 318 400 312 V342 H0Z"/>
    </svg>
    <!-- the water behind the boats -->
    <canvas id="back" aria-hidden="true"></canvas>
    <!-- the sheet of paper and the boats -->
    <svg viewBox="0 0 400 500" aria-hidden="true"><g id="boats"></g></svg>
    <!-- a see-through layer of water in front, splashes and rain -->
    <canvas id="front" aria-hidden="true"></canvas>
    <svg viewBox="0 0 400 500" aria-hidden="true">
      <path class="reed" d="M10 500 C12 452 18 426 26 404 C22 432 22 460 24 500Z"/>
      <path class="reed" style="animation-delay:-1.2s" d="M22 500 C26 462 36 440 48 424 C40 450 36 470 36 500Z"/>
      <path class="reed" style="animation-delay:-2.4s" d="M372 500 C372 456 366 432 360 414 C372 436 380 460 384 500Z"/>
      <path class="reed" style="animation-delay:-0.6s" d="M386 500 C386 470 390 450 398 438 C396 460 394 480 396 500Z"/>
      <ellipse cx="36" cy="410" rx="3" ry="9" fill="#7a5132"/><ellipse cx="364" cy="420" rx="3" ry="9" fill="#7a5132"/>
    </svg>
  </div>

  <form class="wishbar" id="form">
    <label for="wish" class="sr">Your wish for the boat</label>
    <input id="wish" maxlength="24" placeholder="Write a wish…" autocomplete="off">
    <button class="btn" id="go" type="submit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15h18l-3 5H6zM12 3l5 11H7z" fill="currentColor"/></svg>
      Fold &amp; sail
    </button>
  </form>
  <ul class="log" id="log" aria-label="Wishes that sailed away"></ul>
  <p id="status" class="status" role="status" aria-live="polite">A fresh sheet is waiting. Write a wish on it.</p>
  <p id="hint" class="hint">Tap the water to make ripples that push the boats, or tap the sky for a breeze.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg", TAU = Math.PI * 2, W = 400, H = 500, REST = 340;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)");
  var darkMQ = matchMedia("(prefers-color-scheme: dark)");
  function isDark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : darkMQ.matches; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  var scene = $("scene"), back = $("back"), bc = back.getContext("2d"), front = $("front"), fc = front.getContext("2d");
  var statusEl = $("status"), input = $("wish");
  function say(m) { statusEl.textContent = m; }

  /* ---------- 1. Water: a row of springs ---------- */
  var N = 81, hh = new Float32Array(N), hv = new Float32Array(N);
  function surf(x, t) {
    var f = clamp(x / 5, 0, N - 1.001), i = Math.floor(f), k = f - i;
    return REST + hh[i] + (hh[i + 1] - hh[i]) * k + Math.sin(x * 0.05 - t * 2) * 1.4 + Math.sin(x * 0.11 + t * 1.3) * 0.7;
  }
  function poke(x, force) {
    var c = Math.round(x / 5);
    for (var i = -3; i <= 3; i++) { var j = c + i; if (j >= 0 && j < N) hv[j] += force * (1 - Math.abs(i) / 4); }
  }
  function stepWater(dt) {
    for (var i = 0; i < N; i++) { hv[i] += (-hh[i] * 60 - hv[i] * 2.2) * dt; hh[i] += hv[i] * dt; }
    for (var pass = 0; pass < 2; pass++) {
      for (i = 1; i < N - 1; i++) { var d = (hh[i - 1] + hh[i + 1] - 2 * hh[i]) * 0.18; hv[i] += d * 60 * dt; }
    }
  }

  /* ---------- 2. Paper: one shape that morphs sheet → folded → hat → boat ---------- */
  var K = {
    sheet: [[-60, -42], [-30, -42], [0, -42], [30, -42], [60, -42], [60, 42], [-60, 42]],
    half: [[-60, 0], [-30, 0], [0, 0], [30, 0], [60, 0], [60, 42], [-60, 42]],
    hat: [[-58, 22], [-30, -8], [0, -40], [30, -8], [58, 22], [58, 38], [-58, 38]],
    boat: [[-66, 6], [-26, 6], [0, -44], [26, 6], [66, 6], [44, 30], [-44, 30]]
  };
  function lerpPts(a, b, k) { return a.map(function (p, i) { return [p[0] + (b[i][0] - p[0]) * k, p[1] + (b[i][1] - p[1]) * k]; }); }
  function ptsStr(p) { return p.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "); }
  function easeBack(k) { var c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }
  function easeIO(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function wrap(text) { // up to two handwritten lines
    var words = text.split(/\s+/), lines = [""];
    words.forEach(function (w) {
      var cur = lines[lines.length - 1];
      if ((cur + " " + w).trim().length > 15 && cur) { if (lines.length < 2) lines.push(w); else lines[1] += "…"; }
      else lines[lines.length - 1] = (cur + " " + w).trim();
    });
    return lines;
  }
  function makePaper() {
    var g = el("g", {}, $("boats"));
    var p = { g: g, phase: "idle", t: 0, x: 200, y: 168, vy: 0, vx: 0, rot: 0, rv: 0, scale: 1, text: "" };
    p.poly = el("polygon", { "class": "paper", points: ptsStr(K.sheet) }, g);
    p.lower = el("g", {}, g); // rule lines on the bottom half
    [10, 22, 34].forEach(function (y) { el("line", { "class": "rule", x1: -56, x2: 56, y1: y, y2: y }, p.lower); });
    p.shade = el("polygon", { fill: "#d9d3c2", opacity: 0, points: "0,0 0,0 0,0" }, g);
    p.crease = el("line", { stroke: "#b7ae98", "stroke-width": 0.8, opacity: 0 }, g);
    p.flap = el("polygon", { "class": "paper", points: "" }, g);
    p.upper = el("g", {}, g); // the top half with the wish written on it
    [-34, -22, -10].forEach(function (y) { el("line", { "class": "rule", x1: -56, x2: 56, y1: y, y2: y }, p.upper); });
    el("line", { "class": "margin", x1: -44, x2: -44, y1: -42, y2: 0 }, p.upper);
    el("line", { "class": "margin", x1: -44, x2: -44, y1: 0, y2: 42 }, p.lower);
    p.l1 = el("text", { "class": "hand", x: -40, y: -24 }, p.upper);
    p.l2 = el("text", { "class": "hand", x: -40, y: -12 }, p.upper);
    p.hull = el("text", { "class": "hull", x: 0, y: 22, "text-anchor": "middle", opacity: 0 }, g);
    setText(p, "");
    return p;
  }
  function setText(p, text) {
    p.text = text;
    var lines = wrap(text || "Write a wish…");
    p.l1.textContent = lines[0]; p.l2.textContent = lines[1] || "";
    p.l1.setAttribute("opacity", text ? 1 : 0.4); p.l2.setAttribute("opacity", text ? 1 : 0.4);
    p.hull.textContent = text.length > 14 ? text.slice(0, 13) + "…" : text;
  }
  // Fold timeline (seconds): 0–0.4 fold in half, 0.4–0.8 corners down, 0.8–1.25 open into a boat, then drop
  function shapeAt(p) {
    var t = p.t, pts, flapY = null, shade = 0, crease = 0, lowerA = 1, hullA = 0;
    if (p.phase === "idle") pts = K.sheet;
    else if (t < 0.4) { pts = K.half; flapY = -42 + 84 * easeIO(t / 0.4); }
    else if (t < 0.8) { var k1 = easeBack((t - 0.4) / 0.4); pts = lerpPts(K.half, K.hat, k1); lowerA = 1 - clamp(k1 * 2, 0, 1); shade = 0.35 * k1; crease = 0.5 * k1; }
    else if (t < 1.25) { var k2 = easeBack((t - 0.8) / 0.45); pts = lerpPts(K.hat, K.boat, k2); lowerA = 0; shade = 0.35 + 0.2 * k2; crease = 0.5; hullA = clamp(k2, 0, 1); }
    else { pts = K.boat; lowerA = 0; shade = 0.55; crease = 0.5; hullA = 1; }
    p.poly.setAttribute("points", ptsStr(pts));
    p.lower.setAttribute("opacity", lowerA.toFixed(2));
    if (flapY !== null) {
      // the top half swings down over the fold: its front (with the wish) squashes, then its back shows
      p.flap.setAttribute("points", ptsStr([[-60, 0], [60, 0], [60, flapY], [-60, flapY]]));
      p.flap.style.fill = flapY < 0 ? "#fdfcf6" : "#ebe6d8";
      p.upper.setAttribute("transform", "scale(1 " + Math.max(0.001, -flapY / 42).toFixed(3) + ")");
      p.upper.setAttribute("opacity", flapY < 0 ? 1 : 0);
    } else {
      p.flap.setAttribute("points", p.phase === "idle" ? ptsStr([[-60, 0], [60, 0], [60, -42], [-60, -42]]) : "0,0");
      p.flap.style.fill = "#fdfcf6";
      p.upper.setAttribute("transform", "scale(1 1)");
      p.upper.setAttribute("opacity", p.phase === "idle" ? 1 : 0);
    }
    p.shade.setAttribute("points", ptsStr([pts[1], pts[2], pts[3]]));
    p.shade.setAttribute("opacity", shade.toFixed(2));
    var mid = [(pts[1][0] + pts[3][0]) / 2, (pts[1][1] + pts[3][1]) / 2];
    p.crease.setAttribute("x1", pts[2][0].toFixed(1)); p.crease.setAttribute("y1", pts[2][1].toFixed(1));
    p.crease.setAttribute("x2", mid[0].toFixed(1)); p.crease.setAttribute("y2", mid[1].toFixed(1));
    p.crease.setAttribute("opacity", crease);
    p.hull.setAttribute("opacity", hullA.toFixed(2));
  }

  /* ---------- 3. Sheets and boats ---------- */
  var sheet = null, boats = [], sailed = 0, drops = [], rings = [], rain = [];
  function newSheet() {
    sheet = makePaper(); sheet.scale = 0.2; sheet.sv = 0;
    setText(sheet, input.value.trim());
    $("go").setAttribute("aria-disabled", "false");
  }
  function launch() {
    // the button stays clickable (aria-disabled) so a press while folding just explains the wait
    if (!sheet || sheet.phase !== "idle") { say("One moment, the last boat is still being folded."); return; }
    var text = input.value.trim() || "A little wish";
    setText(sheet, text);
    input.value = ""; // ready for the next wish
    sheet.phase = "fold"; sheet.t = 0;
    $("go").setAttribute("aria-disabled", "true");
    say("Folding your wish into a boat…");
  }
  function landed(b) {
    var calm = reduce.matches;
    poke(b.x, calm ? 40 : 160);
    for (var i = 0; i < (calm ? 4 : 18); i++) drops.push({ x: b.x + rnd(-30, 30), y: REST - 2, vx: rnd(-70, 70), vy: rnd(-180, -60), life: 1 });
    rings.push({ x: b.x, t: 0, big: true });
    say("Splash! “" + b.text + "” is sailing.");
  }
  function sailAway(b) {
    sailed++;
    $("count").textContent = sailed + " boat" + (sailed === 1 ? "" : "s") + " sailed";
    var li = document.createElement("li");
    var ic = el("svg", { viewBox: "0 0 24 24", width: 12, height: 12, "aria-hidden": "true", style: "vertical-align:-1px;margin-right:5px" }, li);
    el("path", { d: "M3 15h18l-3 5H6zM12 3l5 11H7z", fill: "currentColor" }, ic);
    li.appendChild(document.createTextNode(b.text));
    var log = $("log"); log.insertBefore(li, log.firstChild);
    while (log.children.length > 3) log.removeChild(log.lastChild);
    say("“" + b.text + "” sailed out of sight. Safe travels!");
    b.g.remove();
  }
  function gust() {
    var tr = $("trees"); tr.classList.remove("gust"); void tr.getBoundingClientRect(); tr.classList.add("gust");
    boats.forEach(function (b) { b.vx += reduce.matches ? 10 : 34; b.rv += 2; });
    if (sheet && sheet.phase === "idle") sheet.rv += 3;
    say("A breeze! The boats pick up speed.");
  }
  function rippleAt(x) {
    poke(x, reduce.matches ? 60 : 200);
    rings.push({ x: x, t: 0, big: false });
    for (var i = 0; i < (reduce.matches ? 2 : 8); i++) drops.push({ x: x + rnd(-8, 8), y: REST - 2, vx: rnd(-40, 40), vy: rnd(-150, -70), life: 1 });
    boats.forEach(function (b) {
      var d = b.x - x;
      if (Math.abs(d) < 130) { b.vx += Math.sign(d || 1) * 46 * (1 - Math.abs(d) / 130); b.rv += Math.sign(d || 1) * 2; }
    });
  }

  /* ---------- 4. Input ---------- */
  $("form").addEventListener("submit", function (e) { e.preventDefault(); launch(); });
  input.addEventListener("input", function () { if (sheet && sheet.phase === "idle") setText(sheet, input.value.trim()); });
  function toScene(e) { var r = scene.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  scene.addEventListener("pointerdown", function (e) {
    var p = toScene(e);
    if (p.y > REST - 14) { rippleAt(p.x); say("Plip! Ripples spread across the water."); }
    else if (sheet && sheet.phase === "idle" && Math.abs(p.x - sheet.x) < 70 && Math.abs(p.y - sheet.y) < 50) { input.focus(); say("Write your wish below, then fold it."); }
    else gust();
  });

  /* ---------- 5. Auto demo: type a wish, fold it, launch it ---------- */
  var WISHES = ["Sail to Karachi", "Rain, rain, stay", "Chai on the roof", "Hello, Lahore", "Make it to the sea"];
  var demoOn = true, demoT = [], wi = 0;
  function later(ms, fn) { demoT.push(setTimeout(fn, ms)); }
  function demo() {
    if (!demoOn) return;
    var w = WISHES[wi++ % WISHES.length];
    input.value = ""; if (sheet) setText(sheet, "");
    for (var i = 1; i <= w.length; i++) (function (k) {
      later(k * 55, function () { input.value = w.slice(0, k); if (sheet && sheet.phase === "idle") setText(sheet, input.value); });
    })(i);
    later(w.length * 55 + 250, launch);
    later(w.length * 55 + 3300, function () { if (boats.length) rippleAt(clamp(boats[boats.length - 1].x - 50, 30, 370)); });
    later(w.length * 55 + 6200, demo);
  }
  function stopDemo(e) {
    if (!e.isTrusted || !demoOn) return;
    demoOn = false; demoT.forEach(clearTimeout);
    if (sheet && sheet.phase === "idle" && e.target !== input) { input.value = ""; setText(sheet, ""); }
  }
  ["pointerdown", "keydown", "wheel"].forEach(function (t) { window.addEventListener(t, stopDemo, { capture: true, passive: true }); });

  /* ---------- 6. Main loop ---------- */
  var S = 1;
  function resize() {
    var r = scene.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    S = Math.max(0.5, r.width / W * dpr);
    back.width = front.width = Math.round(W * S); back.height = front.height = Math.round(H * S);
  }
  window.addEventListener("resize", resize);
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000), t = now / 1000, calm = reduce.matches, dark = isDark();
    last = now;
    stepWater(dt);

    // the waiting sheet floats in the breeze; a folding one runs its timeline
    if (sheet) {
      var p = sheet;
      if (p.phase === "idle") {
        p.sv += ((1 - p.scale) * 150 - p.sv * 11) * dt; p.scale += p.sv * dt;
        p.rv += (-p.rot * 20 - p.rv * 3) * dt; p.rot += p.rv * dt;
        var bob = calm ? 0 : Math.sin(t * 1.4) * 3;
        p.g.setAttribute("transform", "translate(200 " + (168 + bob).toFixed(1) + ") rotate(" + (p.rot + (calm ? 0 : Math.sin(t * 0.9) * 2)).toFixed(2) + ") scale(" + p.scale.toFixed(3) + ")");
      } else if (p.phase === "fold") {
        p.t += dt * (calm ? 1.6 : 1);
        var pop = p.t > 1.25 && p.t < 1.6 ? 1 + Math.sin((p.t - 1.25) / 0.35 * Math.PI) * 0.08 : 1;
        p.g.setAttribute("transform", "translate(200 168) scale(" + pop.toFixed(3) + ")");
        if (p.t > 1.6) {
          // let go: the boat drops toward the water and a new sheet appears
          p.phase = "drop"; p.vy = 0; p.scale = 1; boats.push(p); sheet = null;
          setTimeout(newSheet, calm ? 300 : 900);
        }
      }
      if (sheet) shapeAt(sheet);
    }
    boats.forEach(function (b) {
      if (b.phase === "drop") {
        shapeAt(b);
        b.vy += 700 * dt; b.y += b.vy * dt;
        b.scale += (0.86 - b.scale) * Math.min(1, dt * 4);
        if (b.y >= surf(b.x, t) - 18) { b.phase = "float"; b.vy *= 0.25; b.vx = 10; landed(b); }
      } else {
        // floating: buoyancy toward the surface, tilt along the slope, carried by the current
        var sy = surf(b.x, t) - 19 * b.scale / 0.86;
        b.vy += ((sy - b.y) * (calm ? 40 : 26) - b.vy * 5) * dt; b.y += b.vy * dt;
        var slope = Math.atan2(surf(b.x + 12, t) - surf(b.x - 12, t), 24) * 180 / Math.PI;
        b.rv += ((slope * 1.2 - b.rot) * 30 - b.rv * 5) * dt; b.rot += b.rv * dt;
        b.vx += (22 - b.vx) * dt * 0.5; b.x += b.vx * dt;
        b.scale += (0.86 - b.scale) * Math.min(1, dt * 4);
        if (b.x > 470 || b.x < -70) b.gone = true;
      }
      b.g.setAttribute("transform", "translate(" + b.x.toFixed(1) + " " + b.y.toFixed(1) + ") rotate(" + b.rot.toFixed(2) + ") scale(" + b.scale.toFixed(3) + ")");
    });
    boats = boats.filter(function (b) { if (b.gone) { sailAway(b); return false; } return true; });

    // splashes, rings and light rain
    drops.forEach(function (d) { d.vy += 520 * dt; d.x += d.vx * dt; d.y += d.vy * dt; if (d.y > REST + 4 && d.vy > 0) { d.life = 0; poke(d.x, 6); } });
    drops = drops.filter(function (d) { return d.life > 0; });
    rings.forEach(function (r) { r.t += dt; });
    rings = rings.filter(function (r) { return r.t < 1.4; });
    if (!calm && Math.random() < dt * (dark ? 9 : 2.5)) rain.push({ x: rnd(0, W), y: rnd(-30, 0), v: rnd(320, 420) });
    rain.forEach(function (r) { r.y += r.v * dt; r.x += r.v * dt * 0.08; if (r.y > surf(r.x, t)) { r.hit = true; poke(r.x, 18); rings.push({ x: r.x, t: 0.4, big: false }); } });
    rain = rain.filter(function (r) { return !r.hit; });
    $("c1").setAttribute("transform", "translate(" + ((t * 6) % 520 - 60).toFixed(1) + " 70)");
    $("c2").setAttribute("transform", "translate(" + ((t * 4 + 260) % 520 - 60).toFixed(1) + " 118)");

    drawWater(t, dark);
    requestAnimationFrame(loop);
  }
  function waterPath(c, t, top) {
    c.beginPath(); c.moveTo(0, H);
    for (var x = 0; x <= W; x += 5) c.lineTo(x, surf(x, t) + top);
    c.lineTo(W, H); c.closePath();
  }
  function drawWater(t, dark) {
    var c = bc, g;
    c.setTransform(S, 0, 0, S, 0, 0); c.clearRect(0, 0, W, H);
    waterPath(c, t, 0);
    g = c.createLinearGradient(0, REST, 0, H);
    g.addColorStop(0, dark ? "#2a4d70" : "#7fcad1"); g.addColorStop(1, dark ? "#0b1c33" : "#2c7a8e");
    c.fillStyle = g; c.fill();
    // reflection of the bank and trees, and of the lamp
    c.save(); waterPath(c, t, 0); c.clip();
    g = c.createLinearGradient(0, REST, 0, REST + 50);
    g.addColorStop(0, dark ? "rgba(20,50,35,0.55)" : "rgba(60,140,80,0.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(0, REST - 10, W, 70);
    c.fillStyle = dark ? "rgba(255,226,160,0.5)" : "rgba(255,255,255,0.25)";
    for (var k = 0; k < 9; k++) {
      var y = REST + 6 + k * 9 + ((t * 8) % 9), w = 10 - k * 0.6 + Math.sin(t * 2 + k) * 3;
      c.fillRect(350 - w / 2 + Math.sin(t * 1.6 + k) * 2, y, w, 1.6);
    }
    // lily pads riding the waves
    [[64, 1], [118, 0.8], [276, 1.1]].forEach(function (lp) {
      var y = surf(lp[0], t) + 4;
      c.fillStyle = dark ? "#2c6a48" : "#4fae5c";
      c.beginPath(); c.ellipse(lp[0], y, 15 * lp[1], 4 * lp[1], 0, 0.25, TAU - 0.25); c.lineTo(lp[0], y); c.fill();
    });
    c.restore();

    // front: see-through water over the hulls, highlights, splashes, rings and rain
    c = fc;
    c.setTransform(S, 0, 0, S, 0, 0); c.clearRect(0, 0, W, H);
    waterPath(c, t, 2);
    c.fillStyle = dark ? "rgba(30,70,100,0.38)" : "rgba(80,170,185,0.38)"; c.fill();
    c.beginPath();
    for (var x = 0; x <= W; x += 5) { var sy = surf(x, t); if (x) c.lineTo(x, sy); else c.moveTo(x, sy); }
    c.strokeStyle = dark ? "rgba(200,225,255,0.45)" : "rgba(255,255,255,0.75)"; c.lineWidth = 1.4; c.stroke();
    rings.forEach(function (r) {
      var k = r.t / 1.4, rad = (r.big ? 70 : 34) * k + 4;
      c.strokeStyle = "rgba(255,255,255," + ((1 - k) * 0.7).toFixed(2) + ")"; c.lineWidth = 1.2;
      c.beginPath(); c.ellipse(r.x, surf(r.x, t) + 1, rad, rad * 0.18, 0, 0, TAU); c.stroke();
    });
    c.fillStyle = dark ? "rgba(210,230,255,0.85)" : "rgba(255,255,255,0.9)";
    drops.forEach(function (d) { c.beginPath(); c.arc(d.x, d.y, 1.8, 0, TAU); c.fill(); });
    c.strokeStyle = dark ? "rgba(190,210,240,0.45)" : "rgba(90,130,150,0.35)"; c.lineWidth = 1;
    c.beginPath(); rain.forEach(function (r) { c.moveTo(r.x, r.y); c.lineTo(r.x - 1.2, r.y - 12); }); c.stroke();
  }

  resize();
  newSheet(); sheet.scale = 1;
  requestAnimationFrame(loop);
  demoT.push(setTimeout(demo, 300));
})();
</script>
</body>
</html>
