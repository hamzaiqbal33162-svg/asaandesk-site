<title>Lucky Lever · Slot machine lever button</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg-a: #e3f2ee;
    --bg-b: #b9dcd4;
    --ink: #0d2b29;
    --muted: #4d6f6b;
    --body-a: #126360;
    --body-b: #083b39;
    --gold: #f0c14e;
    --gold-b: #b8862a;
    --cherry: #e23d4f;
    --glass: #fff9ea;
    --reel-ink: #1d2a28;
    --ticket: #fffdf6;
    --focus: #e23d4f;
    --shadow: rgba(10, 60, 55, 0.45);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg-a: #0f2624;
    --bg-b: #030a09;
    --ink: #e4f4f1;
    --muted: #8fb5af;
    --body-a: #0f5754;
    --body-b: #052826;
    --ticket: #f6f0e1;
    --focus: #f0c14e;
    --shadow: rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg-b); }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; background: radial-gradient(90% 70% at 50% 25%, var(--bg-a), var(--bg-b)); }
  .wrap { position: relative; width: min(400px, 100%); display: grid; justify-items: center; }
  .intro { justify-self: start; margin: 0 0 12px 6px; }
  .eyebrow { margin: 0 0 2px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 850; }

  /* ---------- Cabinet ---------- */
  .machine { position: relative; width: calc(100% - 50px); margin-right: 50px; }
  .cab { position: relative; padding: 0 14px 16px; border-radius: 30px 30px 22px 22px; background: linear-gradient(180deg, var(--body-a), var(--body-b)); box-shadow: inset 0 0 0 3px var(--gold-b), inset 0 0 0 5px rgba(255, 255, 255, 0.08), 0 30px 50px -30px var(--shadow); }
  .marquee { position: relative; margin: 0 -14px 14px; padding: 18px 16px 14px; border-radius: 30px 30px 14px 14px; background: linear-gradient(180deg, #1b807b, #0d4f4c); text-align: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), inset 0 0 0 3px var(--gold-b); }
  .marquee b { display: block; font-size: 1.35rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 0 #7a5410, 0 0 18px rgba(240, 193, 78, 0.55); }
  .marquee small { display: block; margin-top: 2px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.65); }
  .bulbs { position: absolute; inset: 6px; pointer-events: none; }
  .bulbs i { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #fff1c2; box-shadow: 0 0 8px 2px rgba(255, 220, 120, 0.9); opacity: 0.25; animation: chase 1.4s linear infinite; }
  .machine.fast .bulbs i { animation-duration: 0.45s; }
  .machine.win .bulbs i { animation: flash 0.3s steps(1) infinite; }
  @keyframes chase { 0%, 20% { opacity: 1; } 35%, 100% { opacity: 0.25; } }
  @keyframes flash { 50% { opacity: 1; background: #ffd34d; } }
  .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .col { display: grid; gap: 6px; min-width: 0; }
  .col > span { font-size: 0.62rem; font-weight: 850; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; color: rgba(255, 255, 255, 0.6); }
  .rw { position: relative; height: 128px; border-radius: 14px; overflow: hidden; background: var(--glass); box-shadow: inset 0 0 0 3px var(--gold-b), inset 0 8px 14px rgba(0, 0, 0, 0.18); }
  /* the curved glass: shade at the top and bottom, a shine across the middle, a pay line */
  .rw::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(8, 40, 38, 0.55), rgba(8, 40, 38, 0) 30%, rgba(255, 255, 255, 0) 45%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0) 56%, rgba(8, 40, 38, 0) 70%, rgba(8, 40, 38, 0.55)); }
  .rw::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; margin-top: -1px; z-index: 1; background: rgba(226, 61, 79, 0.35); }
  .strip { position: absolute; left: 0; right: 0; top: 0; margin: 0; padding: 0; list-style: none; will-change: transform; }
  .strip li { height: 56px; display: grid; place-items: center; align-content: center; gap: 2px; padding: 0 4px; color: var(--reel-ink); text-align: center; }
  .strip svg { width: 22px; height: 22px; }
  .strip b { font-size: 0.72rem; font-weight: 850; line-height: 1.1; }
  .col.blur .strip { filter: blur(1.4px); }
  .hold { height: 30px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.82); font: inherit; font-size: 0.7rem; font-weight: 850; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.3s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .hold:active { transform: scale(0.93); }
  .hold[aria-pressed="true"] { background: var(--cherry); color: #fff; box-shadow: 0 0 14px rgba(226, 61, 79, 0.6); }
  .hold:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .col.held .rw { box-shadow: inset 0 0 0 3px var(--cherry), inset 0 8px 14px rgba(0, 0, 0, 0.18); }
  .slot { height: 8px; margin: 14px 18px 0; border-radius: 4px; background: #031716; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.1); }

  /* ---------- Lever (drawn with SVG, driven by script) ---------- */
  .lever { position: absolute; right: -50px; top: 70px; width: 52px; height: 280px; padding: 0; border: 0; background: transparent; cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .lever:active { cursor: grabbing; }
  .lever:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 26px; }
  .lever svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- Ticket ---------- */
  .tk-wrap { position: relative; width: calc(100% - 90px); margin: -4px 0 0 -50px; height: 96px; overflow: hidden; }
  .ticket { position: absolute; left: 0; right: 0; top: 0; padding: 12px 14px 14px; border-radius: 0 0 10px 10px; background: var(--ticket); color: #1d2a28; transform: translateY(-105%); box-shadow: 0 10px 18px -12px rgba(0, 0, 0, 0.5);
    -webkit-mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) -6px 0 / 12px 100% repeat-x; mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) -6px 0 / 12px 100% repeat-x; }
  .ticket small { display: block; font-size: 0.62rem; font-weight: 850; letter-spacing: 0.16em; text-transform: uppercase; color: #6b7a77; }
  .ticket p { margin: 4px 0 0; font-size: 0.86rem; font-weight: 750; line-height: 1.3; }
  .ticket p b { color: var(--cherry); }
  .status { margin: 8px 0 0 -50px; min-height: 1.3em; font-size: 0.82rem; font-weight: 700; color: var(--muted); text-align: center; }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
  .fx i { position: absolute; width: 10px; height: 10px; margin: -5px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 370px) { .rw { height: 118px; } .strip b { font-size: 0.66rem; } .marquee b { font-size: 1.15rem; } }
  @media (min-width: 1100px) and (min-height: 820px) { .wrap { scale: 1.12; } }
  @media (prefers-reduced-motion: reduce) { .bulbs i { animation: none; opacity: 0.8; } .hold { transition: none; } .col.blur .strip { filter: none; } }
</style>
</head>
<body>
  <main class="stage">
    <section class="wrap" id="wrap" aria-labelledby="ttl">
      <div class="intro"><p class="eyebrow">No plans yet?</p><h1 id="ttl">Lucky Lever</h1></div>
      <div class="machine" id="machine">
        <button class="lever" id="lever" type="button" aria-label="Pull the lever to spin" aria-describedby="status">
          <svg viewBox="0 0 52 280" aria-hidden="true">
            <defs>
              <linearGradient id="rod" x1="0" x2="1"><stop offset="0" stop-color="#8f99a3" /><stop offset="0.45" stop-color="#ffffff" /><stop offset="1" stop-color="#7c858f" /></linearGradient>
              <radialGradient id="ball" cx="0.36" cy="0.32" r="0.7"><stop offset="0" stop-color="#ffb3bb" /><stop offset="0.35" stop-color="#e23d4f" /><stop offset="1" stop-color="#7d1422" /></radialGradient>
              <linearGradient id="mount" x1="0" x2="1"><stop offset="0" stop-color="#b8862a" /><stop offset="0.5" stop-color="#f7d77b" /><stop offset="1" stop-color="#9c6f1e" /></linearGradient>
            </defs>
            <rect x="0" y="132" width="20" height="52" rx="8" fill="url(#mount)" />
            <rect id="rod-r" x="13" y="40" width="10" height="118" rx="5" fill="url(#rod)" />
            <circle cx="18" cy="158" r="11" fill="url(#mount)" stroke="#7a5410" stroke-width="1.5" />
            <circle id="ball-c" cx="18" cy="40" r="17" fill="url(#ball)" />
            <ellipse id="ball-hi" cx="12" cy="33" rx="5" ry="3.4" fill="rgba(255,255,255,0.65)" />
          </svg>
        </button>
        <div class="cab">
          <div class="marquee"><span class="bulbs" id="bulbs" aria-hidden="true"></span><b>Weekend Plan</b><small>Pull for a Saturday</small></div>
          <div class="reels" id="reels"></div>
          <div class="slot" aria-hidden="true"></div>
        </div>
        <div class="fx" id="fx" aria-hidden="true"></div>
      </div>
      <div class="tk-wrap" aria-hidden="true"><div class="ticket" id="ticket"><small>Your Saturday</small><p id="tk-text"></p></div></div>
      <p class="status" id="status" role="status" aria-live="polite">Pull the lever, or hold a reel you like first</p>
    </section>
  </main>

<script>
  // Lucky Lever: a lever button that spins three reels into a weekend plan.
  // Pull (click, Space or drag the red ball down) = the lever swings down and springs back with a wobble → the reels
  // nudge up, blur into a spin and stop one by one with a clack and a bounce → a ticket prints out with the plan,
  // and a perfect place + activity pair sets off the lights and a burst of stars. Hold keeps a reel you like.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var NS = "http://www.w3.org/2000/svg";
    var machine = $("machine"), lever = $("lever"), rod = $("rod-r"), ball = $("ball-c"), ballHi = $("ball-hi"), status = $("status"), ticket = $("ticket"), tkText = $("tk-text"), fx = $("fx");

    // ---------- Reels ----------
    var ICON = {
      where: "M12 2.5a6.5 6.5 0 0 0-6.5 6.5c0 4.9 6.5 12.5 6.5 12.5s6.5-7.6 6.5-12.5A6.5 6.5 0 0 0 12 2.5zm0 9a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z",
      what: "M12 2l2.6 6.2L21 9l-4.8 4.3L17.6 20 12 16.6 6.4 20l1.4-6.7L3 9l6.4-.8z",
      eat: "M4 10h16a8 8 0 0 1-16 0zm2-2c0-2.5 2.5-5 6-5s6 2.5 6 5zM9 21h6"
    };
    var DEFS = [
      { key: "where", label: "Where", items: ["Islamabad Trails", "Clifton Beach", "Lahore Fort", "Hunza Valley", "Old Bazaar", "Lake View Park"], colors: ["#2f9e6a", "#2f8fd1", "#c5533b", "#7a5cd6", "#d48b1f", "#1f9fa0"] },
      { key: "what", label: "Do", items: ["Sunrise hike", "Boat ride", "Photo walk", "Stargazing", "Kite flying", "Book café"], colors: ["#e07a2e", "#2b7fd1", "#b8487a", "#4a4ad0", "#d4a017", "#7a5236"] },
      { key: "eat", label: "Eat", items: ["Mango shake", "BBQ night", "Pancake brunch", "Roasted corn", "Ice cream", "Fish and chips"], colors: ["#e8a317", "#c4442c", "#c98a3c", "#b59a1c", "#d9578f", "#3a86c4"] }
    ];
    // place + activity pairs that make a perfect plan
    var PAIRS = { "Islamabad Trails|Sunrise hike": 1, "Clifton Beach|Boat ride": 1, "Lahore Fort|Photo walk": 1, "Hunza Valley|Stargazing": 1, "Lake View Park|Kite flying": 1, "Old Bazaar|Book café": 1 };
    var IH = 56, N = 6, reels = [];
    var reelBox = $("reels");
    DEFS.forEach(function (d, ri) {
      var col = document.createElement("div");
      col.className = "col";
      col.innerHTML = '<span>' + d.label + '</span><div class="rw"><ul class="strip" aria-hidden="true"></ul></div><button class="hold" type="button" aria-pressed="false">Hold</button>';
      var strip = col.querySelector(".strip");
      for (var c = 0; c < 3; c++) d.items.forEach(function (name, i) {
        var li = document.createElement("li");
        li.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="' + d.colors[i] + '" stroke="' + d.colors[i] + '" stroke-width="' + (d.key === "eat" ? 1.5 : 0) + '" stroke-linecap="round" d="' + ICON[d.key] + '"/></svg><b></b>';
        li.querySelector("b").textContent = name;
        strip.appendChild(li);
      });
      reelBox.appendChild(col);
      var r = { d: d, col: col, strip: strip, win: col.querySelector(".rw"), hold: col.querySelector(".hold"), held: false, pos: (N - ((ri * 2 + 1) % N)) % N, v: 0, phase: "idle", t: 0 };
      r.hold.addEventListener("click", function () { setHold(r, !r.held); });
      reels.push(r);
    });
    // the strip holds three copies; the centre of the window shows copy item 2N - pos (so the reel rolls downwards)
    function shown(r) { var m = Math.round(r.pos); return ((N - (((m % N) + N) % N)) % N); }
    function paint(r) {
      var m = ((r.pos % N) + N) % N, off = ((r.win.clientHeight || 128) - IH) / 2;
      r.strip.style.transform = "translateY(" + (off - (2 * N - m) * IH).toFixed(2) + "px)";
    }
    function labelHold(r) { r.hold.setAttribute("aria-label", (r.held ? "Release" : "Hold") + " the " + r.d.label + " reel, showing " + r.d.items[shown(r)]); }
    function setHold(r, on) {
      r.held = on;
      r.hold.setAttribute("aria-pressed", String(on));
      r.hold.textContent = on ? "Held" : "Hold";
      r.col.classList.toggle("held", on);
      labelHold(r);
      status.textContent = on ? r.d.label + " reel held on " + r.d.items[shown(r)] + "." : r.d.label + " reel released.";
    }
    reels.forEach(function (r) { paint(r); labelHold(r); });
    addEventListener("resize", function () { reels.forEach(paint); });

    // marquee bulbs around the edge
    (function () {
      var box = $("bulbs"), n = 18;
      for (var i = 0; i < n; i++) {
        var b = document.createElement("i"), p = i / n, x, y;
        if (p < 0.5) { x = 4 + (p / 0.5) * 92; y = 4; } else { x = 96 - ((p - 0.5) / 0.5) * 92; y = 96; }
        b.style.left = x + "%"; b.style.top = y + "%";
        b.style.animationDelay = (-(1.4 * (1 - p))).toFixed(2) + "s";
        box.appendChild(b);
      }
    })();

    // ---------- Lever: angle 0 = up, about 150 degrees = pulled all the way down (towards you) ----------
    var L = { a: 0, v: 0, to: 0, drag: null, auto: false };
    var PIV = { x: 18, y: 158 }, LEN = 118;
    function drawLever() {
      var rad = (L.a * Math.PI) / 180, y = PIV.y - LEN * Math.cos(rad), s = 1 + 0.28 * Math.sin(Math.max(0, rad));
      var top = Math.min(y, PIV.y), h = Math.abs(PIV.y - y);
      rod.setAttribute("y", top.toFixed(1)); rod.setAttribute("height", Math.max(2, h).toFixed(1));
      ball.setAttribute("cy", y.toFixed(1)); ball.setAttribute("r", (17 * s).toFixed(2));
      ballHi.setAttribute("cy", (y - 7 * s).toFixed(1)); ballHi.setAttribute("rx", (5 * s).toFixed(2)); ballHi.setAttribute("ry", (3.4 * s).toFixed(2));
    }
    function pull() {
      if (L.auto) return;
      if (calm.matches) { spin(); return; }
      L.auto = true;
      var t0 = performance.now(), from = L.a;
      (function down(n) {
        var p = Math.min(1, (n - t0) / 260);
        L.a = from + (150 - from) * p * p;
        if (p < 1) requestAnimationFrame(down);
        else { L.auto = false; release(true); }
      })(t0);
    }
    function release(fire) {
      L.to = 0; L.v = -60;   // spring back up with a wobble
      if (fire) spin();
    }
    lever.addEventListener("pointerdown", function (e) {
      if (calm.matches) return;
      L.drag = { id: e.pointerId, y: e.clientY, a: L.a, moved: false };
      try { lever.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
    });
    lever.addEventListener("pointermove", function (e) {
      if (!L.drag || e.pointerId !== L.drag.id) return;
      var dy = e.clientY - L.drag.y;
      if (Math.abs(dy) > 5) L.drag.moved = true;
      if (L.drag.moved) { L.a = Math.max(0, Math.min(155, L.drag.a + dy * 0.9)); L.v = 0; }
    });
    var skipClick = false;
    function endDrag() {
      if (!L.drag) return;
      var moved = L.drag.moved;
      L.drag = null;
      if (moved) { skipClick = true; setTimeout(function () { skipClick = false; }, 60); release(L.a > 100); if (L.a <= 100) status.textContent = "Pull it further down to spin."; }
    }
    lever.addEventListener("pointerup", endDrag);
    lever.addEventListener("pointercancel", endDrag);
    lever.addEventListener("click", function () { if (skipClick) { skipClick = false; return; } pull(); });

    // ---------- Spin ----------
    var S = { busy: false, stops: [] };
    function spin() {
      if (S.busy) { status.textContent = "The reels are still turning…"; return; }
      var free = reels.filter(function (r) { return !r.held; });
      if (!free.length) { status.textContent = "Release a hold to spin."; return; }
      S.busy = true;
      machine.classList.remove("win");
      machine.classList.add("fast");
      status.textContent = "Spinning…";
      tearTicket();
      var now = performance.now();
      free.forEach(function (r, i) {
        r.phase = "wind"; r.t = now; r.start = r.pos;
        r.stopAt = now + 900 + i * 480 + Math.random() * 160;
        r.target = Math.floor(Math.random() * N);
        if (r.target === shown(r)) r.target = (r.target + 1 + Math.floor(Math.random() * (N - 1))) % N;
      });
      if (calm.matches) {
        free.forEach(function (r) { r.pos = (N - r.target) % N; r.phase = "idle"; paint(r); });
        finish();
      }
    }
    function land(r) {
      if (calm.matches) return;
      r.win.animate([{ filter: "brightness(1)" }, { filter: "brightness(1.25)" }, { filter: "brightness(1)" }], { duration: 260 });
      labelHold(r);
      var li = r.strip.children[2 * N - (((Math.round(r.pos) % N) + N) % N)];
      if (li) li.animate([{ transform: "scale(1)" }, { transform: "scale(1.16)" }, { transform: "scale(1)" }], { duration: 360, easing: "cubic-bezier(.3,1.6,.5,1)" });
    }
    function finish() {
      S.busy = false;
      machine.classList.remove("fast");
      var pick = reels.map(function (r) { return r.d.items[shown(r)]; });
      reels.forEach(labelHold);
      var perfect = PAIRS[pick[0] + "|" + pick[1]];
      writeTicket(pick, perfect);
      printTicket();
      status.textContent = pick[1] + " at " + pick[0] + ", then " + pick[2].toLowerCase() + "." + (perfect ? " Perfect pair!" : " Pull again for another plan.");
      if (perfect) { machine.classList.add("win"); stars(); setTimeout(function () { machine.classList.remove("win"); }, 2200); }
    }
    function printTicket() {
      if (calm.matches) { ticket.style.transform = "translateY(0)"; return; }
      ticket.getAnimations().forEach(function (a) { a.cancel(); });
      ticket.style.transform = "translateY(0)";
      // printed in little steps, then a settle
      ticket.animate([
        { transform: "translateY(-105%)" }, { transform: "translateY(-75%)", offset: 0.2 }, { transform: "translateY(-75%)", offset: 0.3 },
        { transform: "translateY(-45%)", offset: 0.5 }, { transform: "translateY(-45%)", offset: 0.6 }, { transform: "translateY(-12%)", offset: 0.8 },
        { transform: "translateY(3%)", offset: 0.92 }, { transform: "translateY(0)" }
      ], { duration: 900, easing: "ease-out" });
    }
    function tearTicket() {
      if (ticket.style.transform !== "translateY(0)") return;
      ticket.style.transform = "translateY(-105%)";
      if (!calm.matches) ticket.animate([{ transform: "translateY(0) rotate(0)", opacity: 1 }, { transform: "translateY(40%) translateX(30%) rotate(8deg)", opacity: 0 }], { duration: 380, easing: "ease-in" });
    }
    function stars() {
      if (calm.matches) return;
      var cols = ["#f0c14e", "#e23d4f", "#ffffff", "#5fd3c4"], w = machine.clientWidth;
      for (var i = 0; i < 26; i++) {
        (function () {
          var s = document.createElement("i"), x = w / 2 + (Math.random() - 0.5) * 60, ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, d = 90 + Math.random() * 120;
          s.style.left = x + "px"; s.style.top = "70px"; s.style.background = cols[i % cols.length];
          fx.appendChild(s);
          s.animate([
            { transform: "translate(0,0) scale(0.4) rotate(0)", opacity: 1 },
            { transform: "translate(" + Math.cos(ang) * d + "px," + Math.sin(ang) * d + "px) scale(1.3) rotate(180deg)", opacity: 1, offset: 0.6 },
            { transform: "translate(" + Math.cos(ang) * d * 1.1 + "px," + (Math.sin(ang) * d + 80) + "px) scale(0.6) rotate(320deg)", opacity: 0 }
          ], { duration: 1300 + Math.random() * 500, easing: "cubic-bezier(.15,.7,.3,1)" }).onfinish = function () { s.remove(); };
        })();
      }
    }

    // ---------- Main loop: lever spring + reel motion ----------
    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
      last = now;
      if (!L.drag && !L.auto) { L.v += (-(L.a - L.to) * 160 - L.v * 9) * dt; L.a += L.v * dt; if (L.a < -14) { L.a = -14; L.v *= -0.4; } }
      drawLever();
      var anySpin = false;
      reels.forEach(function (r) {
        if (r.phase === "idle") return;
        anySpin = true;
        var t = (now - r.t) / 1000;
        if (r.phase === "wind") {
          // anticipation: the reel creeps the wrong way first
          r.pos = r.start - Math.sin(Math.min(1, t / 0.16) * Math.PI / 2) * 0.28;
          if (t >= 0.16) { r.phase = "spin"; r.t = now; r.v = 0; }
        } else if (r.phase === "spin") {
          r.v += (17 - r.v) * Math.min(1, dt * 5);
          r.pos += r.v * dt;
          r.col.classList.toggle("blur", r.v > 8);
          if (now >= r.stopAt) {
            // pick the stop so the reel can ease down to it from its speed
            var want = (N - r.target) % N, F = Math.ceil(r.pos + r.v * 0.28);
            while (((F % N) + N) % N !== want) F++;
            r.phase = "stop"; r.t = now; r.p0 = r.pos; r.v0 = r.v; r.F = F; r.D = (2 * (F - r.pos)) / r.v;
          }
        } else if (r.phase === "stop") {
          var tt = Math.min(t, r.D);
          r.pos = r.p0 + r.v0 * tt - (r.v0 * r.v0 / (4 * (r.F - r.p0))) * tt * tt;
          if (r.v0 * (1 - tt / r.D) < 8) r.col.classList.remove("blur");
          if (t >= r.D) { r.pos = r.F; r.phase = "land"; r.t = now; land(r); }
        } else if (r.phase === "land") {
          r.pos = r.F + 0.16 * Math.exp(-t / 0.11) * Math.sin(t * 30);
          if (t > 0.5) {
            r.pos = r.F; r.phase = "idle";
            if (reels.every(function (q) { return q.phase === "idle"; }) && S.busy) finish();
          }
        }
        paint(r);
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---------- Auto demo: pull, then hold a reel and pull again ----------
    var demoOn = !calm.matches, timer = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function later(ms) { return new Promise(function (r) { timer = setTimeout(r, ms); }); }
    async function demo() {
      var round = 0;
      await later(550);
      while (demoOn) {
        if (round % 3 === 1) { setHold(reels[0], true); await later(700); if (!demoOn) return; }
        if (round % 3 === 2 && reels[0].held) setHold(reels[0], false);
        pull();
        await later(5400); if (!demoOn) return;
        round++;
      }
    }
    // the ticket text: "<activity> at <place>, then <treat>."
    function writeTicket(pick, perfect) {
      tkText.innerHTML = "<b></b> at <span></span>, then <span></span>." + (perfect ? " <b>Perfect pair!</b>" : "");
      var spans = tkText.querySelectorAll("span");
      tkText.querySelector("b").textContent = pick[1];
      spans[0].textContent = pick[0]; spans[1].textContent = pick[2].toLowerCase();
    }
    // a first plan is already printed when the page opens
    writeTicket(reels.map(function (r) { return r.d.items[shown(r)]; }), false);
    ticket.style.transform = "translateY(0)";

    if (demoOn) demo();
  })();
</script>
</body>
