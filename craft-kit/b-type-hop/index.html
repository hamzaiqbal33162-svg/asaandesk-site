<!doctype html>
<!-- Chill & Craft · Type Hop · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Type Hop · Buttons with moving letters</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours: a bold poster palette ---------- */
  :root {
    --paper: #fbf6ec;
    --dots: rgba(20, 20, 20, 0.08);
    --ink: #151515;
    --muted: #6a645a;
    --lime: #c4f135;
    --cobalt: #2a4bff;
    --tomato: #ff5a36;
    --on-ink: #fbf6ec;
    --flash: #c4f135;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #121212;
    --dots: rgba(255, 255, 255, 0.07);
    --ink: #f4f1ea;
    --muted: #a19c92;
    --cobalt: #5b78ff;
    --tomato: #ff6a48;
    --on-ink: #121212;
    --flash: #5b78ff;
    color-scheme: dark;
  }
  *,
  *::before,
  *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  .stage {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow: hidden;
    background-image: radial-gradient(var(--dots) 1.2px, transparent 1.4px);
    background-size: 18px 18px;
  }
  .wrap { width: min(560px, 100%); text-align: center; }
  .eyebrow { margin: 0 0 26px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 18px; justify-items: center; }
  @media (max-width: 460px) { .grid { grid-template-columns: 1fr; gap: 26px; } }

  /* ---------- Shared button base ---------- */
  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    border: 0;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    cursor: pointer;
    padding: 15px 28px;
    line-height: 1.2;
    white-space: nowrap;
    transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1), box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 5px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vis { display: inline-flex; pointer-events: none; }
  .ch { display: inline-block; white-space: pre; }
  .glyph { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 1rem; pointer-events: none; z-index: 5; }

  /* 1. Hop: letters jump in a wave; on press an arrow slides in */
  .hop { background: var(--ink); color: var(--on-ink); border-radius: 999px; }
  .hop:hover { transform: translateY(-2px); }
  .hop:active { transform: scale(0.95); transition-duration: 0.1s; }
  .hop:hover .ch, .hop:focus-visible .ch, .hop.play .ch { animation: hop 0.55s cubic-bezier(0.3, 0.7, 0.4, 1.4) calc(var(--i) * 38ms) both; }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-9px); color: var(--flash); } 100% { transform: translateY(0); } }
  .arrow { display: inline-block; width: 0; opacity: 0; overflow: hidden; color: var(--flash); transition: width 0.5s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s; }
  .arrow svg { width: 1.1em; height: 1.1em; margin-left: 8px; vertical-align: -0.2em; }
  .hop.go .arrow { width: 1.6em; opacity: 1; }
  .hop.go .arrow svg { animation: nudge 0.6s ease-in-out 0.3s 2; }
  @keyframes nudge { 50% { transform: translateX(5px); } }

  /* 2. Roll: letters roll up on hover; on press they spin like slot reels */
  .roll { background: var(--cobalt); color: #fff; border-radius: 6px; box-shadow: 5px 5px 0 var(--ink); }
  .roll:hover { transform: translate(-1px, -1px); box-shadow: 7px 7px 0 var(--ink); }
  .roll:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--ink); transition-duration: 0.08s; }
  .roll .ch { height: 1.2em; overflow: hidden; vertical-align: top; }
  .roll .ch span { display: block; height: 1.2em; transition: transform 0.42s cubic-bezier(0.7, 0, 0.2, 1) calc(var(--i) * 28ms); }
  .roll .ch span:nth-child(2) { color: var(--lime); }
  .roll .ch span:nth-child(3) { color: #ffd84d; }
  .roll:hover .ch span, .roll:focus-visible .ch span, .roll.play .ch span { transform: translateY(-100%); }
  .tag {
    position: absolute;
    right: -14px;
    top: -16px;
    padding: 4px 8px;
    border-radius: 4px;
    background: var(--lime);
    color: #151515;
    font-size: 0.75rem;
    font-weight: 900;
    border: 2px solid #151515;
    opacity: 0;
    pointer-events: none;
  }

  /* 3. Swing: letters tilt on hover; on press the sign swings from a pin */
  .swing { background: transparent; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 16px 4px 16px 4px; transform-origin: 50% -26px; }
  .swing:hover { transform: translateY(-2px); }
  .swing:active { transform: translateY(2px); transition-duration: 0.1s; }
  .swing .ch { transition: transform 0.4s cubic-bezier(0.3, 0.8, 0.3, 1.6) calc(var(--i) * 22ms), color 0.3s; transform-origin: 50% 0; }
  .swing:hover .ch:nth-child(odd), .swing:focus-visible .ch:nth-child(odd), .swing.play .ch:nth-child(odd) { transform: rotate(14deg) translateY(2px); color: var(--tomato); }
  .swing:hover .ch:nth-child(even), .swing:focus-visible .ch:nth-child(even), .swing.play .ch:nth-child(even) { transform: rotate(-12deg) translateY(-2px); }
  .strings { position: absolute; left: 0; bottom: 100%; width: 100%; height: 26px; overflow: visible; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .swing.hang .strings { opacity: 1; }
  .strings line { stroke: var(--ink); stroke-width: 1.5; }
  .strings circle { fill: var(--tomato); }

  /* 4. Shuffle: letters scramble; on press they lock in one by one and a tick appears */
  .shuffle { background: var(--tomato); color: #fff; border-radius: 4px 999px 999px 4px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.04em; }
  .shuffle:hover { transform: translateY(-2px); }
  .shuffle:active { transform: scale(0.95); transition-duration: 0.1s; }
  .shuffle .ch { min-width: 0.62em; text-align: center; }
  .shuffle .ch.busy { color: #151515; }
  .tickmark { display: inline-block; width: 0; overflow: hidden; opacity: 0; transition: width 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s; }
  .tickmark svg { width: 1.1em; height: 1.1em; margin-left: 8px; vertical-align: -0.2em; }
  .shuffle.locked .tickmark { width: 1.6em; opacity: 1; }

  .note { margin: 26px 0 0; min-height: 1.4em; font-size: 0.9rem; color: var(--muted); }
  .note b { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .btn, .arrow, .tickmark, .roll .ch span, .swing .ch { transition: none; }
    .hop:hover .ch, .hop:focus-visible .ch, .hop.play .ch { animation: none; color: var(--flash); }
    .hop.go .arrow svg { animation: none; }
    .swing:hover .ch:nth-child(odd), .swing:focus-visible .ch:nth-child(odd), .swing.play .ch:nth-child(odd),
    .swing:hover .ch:nth-child(even), .swing:focus-visible .ch:nth-child(even), .swing.play .ch:nth-child(even) { transform: none; }
    .glyph { display: none; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="wrap">
      <p class="eyebrow">Hover for a wiggle · press for the full show</p>
      <div class="grid">
        <button class="btn hop" type="button"><span class="sr">Get started</span><span class="vis" aria-hidden="true">Get started</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h14m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span></button>
        <button class="btn roll" type="button"><span class="sr">Shop the sale</span><span class="vis" aria-hidden="true">Shop the sale</span><span class="tag" aria-hidden="true">-30%</span></button>
        <button class="btn swing" type="button"><svg class="strings" aria-hidden="true"><line x1="50%" y1="0" x2="12%" y2="26" /><line x1="50%" y1="0" x2="88%" y2="26" /><circle cx="50%" cy="2" r="3.5" /></svg><span class="sr">See our work</span><span class="vis" aria-hidden="true">See our work</span></button>
        <button class="btn shuffle" type="button"><span class="sr">Join for free</span><span class="vis" aria-hidden="true">Join for free</span><span class="tickmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg></span></button>
      </div>
      <p class="note" id="note" role="status" aria-live="polite">Each button moves its letters in its own way.</p>
    </div>
  </main>

<script>
  // Type Hop: split each label into letters, wiggle them on hover, and play a full sequence on press.
  (function () {
    var stage = document.getElementById("stage");
    var note = document.getElementById("note");
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".btn"));
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var GLYPHS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=?";

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function rnd(s) { return s[Math.floor(Math.random() * s.length)]; }

    // Spring helper: samples a damped spring from 0 to 1 (overshoots, then settles)
    function springCurve(stiffness, damping) {
      var x = 0, v = 0, out = [0], dt = 1 / 60;
      for (var i = 0; i < 300; i++) {
        v += (-stiffness * (x - 1) - damping * v) * dt;
        x += v * dt;
        out.push(x);
        if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break;
      }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiffness, damping, delay) {
      var c = springCurve(stiffness || 260, damping || 14);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear", delay: delay || 0, fill: "backwards" });
    }

    // Letter confetti: little copies of the label's letters fly out and fall
    function glyphBurst(btn, chars, colors, n) {
      var s = stage.getBoundingClientRect(), r = btn.getBoundingClientRect();
      var cx = r.left + r.width / 2 - s.left, cy = r.top + r.height / 2 - s.top;
      for (var i = 0; i < n; i++) {
        var g = document.createElement("span");
        g.className = "glyph";
        g.textContent = chars[i % chars.length];
        g.style.color = colors[i % colors.length];
        stage.appendChild(g);
        var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
        var sp = 70 + Math.random() * 60, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
        var x0 = cx + (Math.random() - 0.5) * r.width * 0.6, spin = (Math.random() - 0.5) * 540, frames = [];
        for (var k = 0; k <= 10; k++) {
          var t = k / 10, e = 1 - Math.pow(1 - t, 2);
          frames.push({ transform: "translate(" + (x0 + vx * e).toFixed(1) + "px," + (cy + vy * e + 110 * t * t).toFixed(1) + "px) rotate(" + (spin * t).toFixed(0) + "deg) scale(" + (1.2 - t * 0.6).toFixed(2) + ")", opacity: t > 0.7 ? (1 - t) / 0.3 : 1 });
        }
        g.animate(frames, { duration: 800 + Math.random() * 400, easing: "linear", fill: "forwards" }).onfinish = (function (el) { return function () { el.remove(); }; })(g);
      }
    }

    // Turns "Shop" into letter spans (roll gets a reel; the last copy covers the spring overshoot)
    function split(btn) {
      var vis = btn.querySelector(".vis");
      var text = vis.textContent;
      vis.textContent = "";
      Array.prototype.forEach.call(text, function (c, i) {
        var ch = document.createElement("span");
        ch.className = "ch";
        ch.style.setProperty("--i", i);
        var glyph = c === " " ? "\u00a0" : c;
        ch.dataset.c = glyph;
        if (btn.classList.contains("roll")) {
          [glyph, glyph, c === " " ? "\u00a0" : rnd(GLYPHS), glyph, glyph].forEach(function (t) {
            var s = document.createElement("span");
            s.textContent = t;
            ch.appendChild(s);
          });
        } else ch.textContent = glyph;
        vis.appendChild(ch);
      });
    }

    // Shuffle hover effect: letters flicker, then lock from left to right
    function scramble(btn, onLock) {
      if (btn.dataset.running) return Promise.resolve();
      btn.dataset.running = "1";
      var chars = Array.prototype.slice.call(btn.querySelectorAll(".ch"));
      var frame = 0, locked = {};
      return new Promise(function (resolve) {
        var id = setInterval(function () {
          frame++;
          chars.forEach(function (ch, i) {
            var real = ch.dataset.c;
            if (real === "\u00a0" || locked[i]) return;
            if (frame > 5 + i * 1.6) {
              ch.textContent = real;
              ch.classList.remove("busy");
              locked[i] = true;
              if (onLock) onLock(ch, i);
            } else {
              ch.textContent = rnd(GLYPHS);
              ch.classList.add("busy");
            }
          });
          if (frame > 6 + chars.length * 1.6) {
            clearInterval(id);
            delete btn.dataset.running;
            resolve();
          }
        }, 34);
      });
    }

    function letters(btn) { return Array.prototype.slice.call(btn.querySelectorAll(".ch")); }

    // ---------- Press sequences ----------
    var SEQ = {
      hop: async function (btn) {
        var ls = letters(btn);
        // anticipation: letters squash down
        ls.forEach(function (l) { l.animate([{ transform: "none" }, { transform: "translateY(3px) scale(1.15, 0.7)" }], { duration: 120, easing: "ease-in", fill: "forwards" }); });
        await wait(130);
        // main: a big wave jump that lands on a spring
        var flash = getComputedStyle(document.documentElement).getPropertyValue("--flash").trim() || "#c4f135";
        ls.forEach(function (l, i) {
          l.getAnimations().forEach(function (a) { a.cancel(); });
          l.animate([{ transform: "translateY(0) scale(1.15, 0.7)" }, { transform: "translateY(-18px) scale(0.9, 1.15)", color: flash, offset: 0.4 }, { transform: "translateY(2px) scale(1.1, 0.85)", offset: 0.75 }, { transform: "none" }], { duration: 520, delay: i * 30, easing: "ease-in-out", fill: "backwards" });
        });
        // action: the arrow slides in and nudges
        await wait(260);
        btn.classList.add("go");
        await wait(380);
        // finish: letter confetti
        glyphBurst(btn, "GETSTARTED", ["#c4f135", "#2a4bff", "#ff5a36"], 14);
        await wait(1100);
        btn.classList.remove("go");
      },
      roll: async function (btn) {
        var tag = btn.querySelector(".tag");
        // main: every letter spins like a slot reel and stops left to right
        letters(btn).forEach(function (l, i) {
          Array.prototype.forEach.call(l.children, function (s) {
            springTo(s, function (p) { return { transform: "translateY(" + (-300 * p).toFixed(1) + "%)" }; }, 200, 17, i * 55);
          });
        });
        await wait(380 + letters(btn).length * 55);
        // action: a sale tag stamps onto the corner
        springTo(tag, function (p) { return { opacity: Math.min(1, p * 2), transform: "translateY(" + ((1 - p) * -24).toFixed(1) + "px) rotate(" + (12 - (1 - p) * 40).toFixed(1) + "deg) scale(" + (1.6 - 0.6 * p).toFixed(3) + ")" }; }, 300, 12).onfinish = function () { tag.style.opacity = "1"; tag.style.transform = "rotate(12deg)"; };
        springTo(btn, function (p) { return { transform: "translate(" + (3 - 3 * p).toFixed(2) + "px," + (3 - 3 * p).toFixed(2) + "px)" }; }, 300, 10);
        await wait(160);
        // finish: coloured squares burst
        glyphBurst(btn, "%$■■", ["#c4f135", "#ffd84d", "#2a4bff"], 12);
        await wait(1500);
        tag.animate([{ opacity: 1, transform: "rotate(12deg)" }, { opacity: 0, transform: "translateY(-14px) rotate(30deg) scale(0.6)" }], { duration: 260, easing: "ease-in" }).onfinish = function () { tag.style.opacity = ""; tag.style.transform = ""; };
      },
      swing: async function (btn) {
        // anticipation: the sign lifts on its strings
        btn.classList.add("hang");
        await btn.animate([{ transform: "none" }, { transform: "translateY(-6px) rotate(-6deg)" }], { duration: 160, easing: "ease-out", fill: "forwards" }).finished;
        btn.getAnimations().forEach(function (a) { a.cancel(); });
        // main: a damped pendulum swing, letters lag behind the frame
        var c = springCurve(90, 5);
        btn.animate(c.map(function (p) { return { transform: "rotate(" + ((1 - p) * -16).toFixed(2) + "deg)" }; }), { duration: (c.length * 1000) / 60, easing: "linear" });
        letters(btn).forEach(function (l, i) {
          l.animate(c.map(function (p) { return { transform: "rotate(" + ((1 - p) * 10).toFixed(2) + "deg)" }; }), { duration: (c.length * 1000) / 60, delay: 40 + i * 12, easing: "linear", fill: "backwards" });
        });
        await wait(500);
        // finish: cartoon pop lines from both sides
        glyphBurst(btn, "✦✧", ["#ff5a36", "#151515", "#2a4bff"], 10);
        await wait(Math.max(400, (c.length * 1000) / 60 - 500));
        btn.classList.remove("hang");
      },
      shuffle: async function (btn) {
        // anticipation: letters squeeze together
        var vis = btn.querySelector(".vis");
        vis.animate([{ transform: "none" }, { transform: "scaleX(0.86)" }], { duration: 140, easing: "ease-in", fill: "forwards" });
        await wait(150);
        springTo(vis, function (p) { return { transform: "scaleX(" + (0.86 + 0.14 * p).toFixed(3) + ")" }; }, 320, 11).onfinish = function () { vis.getAnimations().forEach(function (a) { a.cancel(); }); };
        // main + action: scramble, each letter pops as it locks in (wait for any hover scramble first)
        while (btn.dataset.running) await wait(40);
        await scramble(btn, function (ch) {
          ch.animate([{ transform: "scale(1.6)", color: "#151515" }, { transform: "scale(1)", color: "#ffffff" }], { duration: 260, easing: "cubic-bezier(0.3, 1.6, 0.5, 1)" });
        });
        // finish: a tick slides in and code symbols burst out
        btn.classList.add("locked");
        glyphBurst(btn, "01#*+{}", ["#ff5a36", "#151515", "#c4f135"], 12);
        await wait(1500);
        btn.classList.remove("locked");
      }
    };

    // Touch screens have no hover, so a tap plays the hover motion too
    function play(btn) {
      btn.classList.remove("play");
      void btn.offsetWidth;
      btn.classList.add("play");
      clearTimeout(btn._t);
      btn._t = setTimeout(function () { btn.classList.remove("play"); }, 900);
    }

    buttons.forEach(function (btn) {
      split(btn);
      var label = btn.querySelector(".sr").textContent;
      var kind = ["hop", "roll", "swing", "shuffle"].filter(function (k) { return btn.classList.contains(k); })[0];
      if (kind === "shuffle") {
        btn.addEventListener("mouseenter", function () { if (!calm.matches && !btn.dataset.busy) scramble(btn); });
        btn.addEventListener("focus", function () { if (!calm.matches && !btn.dataset.busy) scramble(btn); });
      }
      btn.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") play(btn); });
      btn.addEventListener("click", function () {
        note.innerHTML = "You pressed <b>" + label + "</b>.";
        if (calm.matches || btn.dataset.busy) return;
        btn.dataset.busy = "1";
        SEQ[kind](btn).then(function () { delete btn.dataset.busy; }, function () { delete btn.dataset.busy; });
      });
    });
  })();
</script>
</body>
</html>
