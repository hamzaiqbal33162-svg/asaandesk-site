/* =====================================================================
   SIGNATURE 1 · the split-flap token board with its chime light
   Each character is a tile: the old top half folds down, the new
   bottom half folds into place. Tiles step through the alphabet.
   ===================================================================== */
const FLAP_SEQ = "-ABCDEF0123456789";
const PRE_C = { teal: "#5fe0cd", amber: "#ffc864", rose: "#ff9cc6", indigo: "#aab5ff", sky: "#8fd3ff", olive: "#cfe57f" };
const FLIP_MS = { calm: 120, normal: 78, quick: 48 };
const flapsHTML = (str) => [...str].map((ch, i) => `<span class="flap${i === 0 ? " pre" : ""}" data-ch="${ch}"><span class="ft"><b>${ch}</b></span><span class="fb"><b>${ch}</b></span></span>`).join("");
function setTile(tile, ch) { tile.dataset.ch = ch; $(".ft b", tile).textContent = ch; $(".fb b", tile).textContent = ch; }
function flipOnce(tile, b, ms) {
  const a = tile.dataset.ch;
  tile.dataset.ch = b;
  $(".ft b", tile).textContent = b; /* behind the falling flap: the new top half */
  $(".fb b", tile).textContent = a; /* until the new bottom half lands: the old one */
  const f1 = document.createElement("span"), f2 = document.createElement("span");
  f1.className = "ff1"; f1.innerHTML = `<b>${a}</b>`;
  f2.className = "ff2"; f2.innerHTML = `<b>${b}</b>`;
  tile.style.setProperty("--fd", ms + "ms");

}
function flipTo(box, str, opts = {}) {
  if (!box) return;
  const ms = opts.ms || FLIP_MS[S.cfg.flip] || 78, stagger = opts.stagger == null ? 90 : opts.stagger, maxSteps = opts.max || 5;
  const tiles = $$(".flap", box);
  [...str].forEach((ch, i) => {
    const tile = tiles[i];
    if (!tile) return;
    (tile._q || []).forEach(clearTimeout);
    const from = tile.dataset.ch;
    if (from === ch && !opts.force) return;
    if (RM) { setTile(tile, ch); return; }
    let a = FLAP_SEQ.indexOf(from), b = FLAP_SEQ.indexOf(ch);
    if (a < 0) a = 0;
    if (b < 0) { setTile(tile, ch); return; }
    let path = [];
    for (let k = a; k !== b || (opts.force && !path.length); ) { k = (k + 1) % FLAP_SEQ.length; path.push(FLAP_SEQ[k]); if (path.length > 40) break; }
    if (path.length > maxSteps) path = path.slice(-maxSteps);

/* The chime light: the lamp glows and ripples, a light runs across the board, and (if turned on) a soft two-note chime */

/* =====================================================================
   SIGNATURE 2 · a live waiting-time ring per doctor

/* A token for a walk-in or a booked patient */

/* The live demo: walk-ins arrive, doctors finish, the lab moves, payments come in */
function walkIn() {

  if (!docs.length) return;
  const d = docs.slice().sort((a, b) => waitingFor(a.id).length - waitingFor(b.id).length)[chance(0.6) ? 0 : randi(0, docs.length - 1)];
  const today = new Set(S.toks.map((t) => t.pat));
  const fits = { d2: (p) => p.kid, d3: (p) => !p.kid && p.sex === "F" && p.age < 46, d4: (p) => !p.kid && p.age > 34 }[d.id] || ((p) => !p.kid);
  let p = S.pats.find((x) => !today.has(x.id) && fits(x) && chance(0.3));
  if (!p) {
    const kid = d.id === "d2", sex = kid ? (chance(0.5) ? "F" : "M") : d.id === "d3" ? "F" : chance(0.5) ? "F" : "M";

  issueToken(p.id, d.id, r[0], p.visits.length ? "follow" : "new", chance(0.08) ? "urgent" : "normal", p.panel ? "panel" : chance(0.7) ? "cash" : "card");

function labStep() {

  if (!l) return false;
  l.stage++; l.stageAt = NOW();
  const T = testOf(l.test), p = patOf(l.pat);
  if (l.stage === 3) { l.res = fakeResult(T); feedAdd("lab", `${T.short} report ready for ${esc(p.name)}`); noteAdd("flask", `${T.short} report ready for ${p.name}`, "Hand it over or send it by SMS"); }
  else feedAdd("lab", `${T.short} for ${esc(p.name)}: ${LAB_STAGES[l.stage][0].toLowerCase()}`);

function payStep() {
  const b = unpaid()[0];

  const md = S.meds[pick([0, 8, 9, 11, 18, 29])];
  const q = md.form === "Tablet" ? randi(6, 20) : 1;
  if (md.stock < q) return;
  md.stock -= q;
  newBill(S, null, NOW(), [{ t: "rx", label: md.name + " " + md.str + " × " + q, amt: md.price * q }], chance(0.75) ? "cash" : "card", "paid", { walkin: "Counter sale" });
  feedAdd("rx", `Counter sale: ${esc(md.name)} ${esc(md.str)} × ${q} · ${rs(md.price * q)}`);

function simStep() {
  if (!S.live) return;
  const docs = activeDocs().filter((d) => d.status === "in");
  /* a free room with people waiting gets the next token (auto-call) */
  if (S.cfg.autoCall) { const free = docs.find((d) => !inRoom(d.id) && waitingFor(d.id).length && isOnShift(d)); if (free && chance(0.7)) { callNext(free.id, true); return; } }
  const r = R();
  if (r < 0.4) {
    const busy = docs.filter((d) => { const t = inRoom(d.id); return t && NOW() - t.called > 75; });
    if (busy.length) {
      const d = pick(busy);
      if (S.cfg.autoCall && waitingFor(d.id).length) { callNext(d.id, true); return; }
      finishTok(inRoom(d.id)); afterChange(); drawBoardText();
      return;
    }
  }
  if (r < 0.66 && S.toks.filter((t) => t.status === "wait").length < 16) { walkIn(); return; }
  if (r < 0.84 && labStep()) return;
  payStep();
}

/* Token actions: the ⋯ menu on every token card */
function tokMenu(btn, id) {
  const t = tokOf(id);
  if (!t) return;
  const items = t.status === "wait" ? [
    { id: "now", label: "Call to the room now", icon: "bell" }, { id: "move", label: "Move to another doctor", icon: "move" },
    { id: "pri", label: t.pri === "urgent" ? "Mark as normal" : "Mark as urgent", icon: "bolt" }, { id: "edit", label: "Edit reason", icon: "edit" }, "-",
    { id: "pat", label: "Open patient", icon: "user" }, { id: "noshow", label: "Not here (no-show)", icon: "noshow" }, { id: "cancel", label: "Cancel token", icon: "trash", danger: true },
  ] : t.status === "room" ? [
    { id: "finish", label: "Finish visit", icon: "check" }, { id: "back", label: "Send back to waiting", icon: "undo" }, "-", { id: "pat", label: "Open patient", icon: "user" },
  ] : [{ id: "pat", label: "Open patient", icon: "user" }, { id: "bill", label: "Open bill", icon: "receipt" }];
  menu(btn, items, (k) => tokAction(t, k));
}
async function tokAction(t, k) {
  const d = docOf(t.doc), p = patOf(t.pat);
  if (k === "now") {
    const cur = inRoom(t.doc);
    if (cur) finishTok(cur);
    t.status = "room"; t.called = NOW(); S.board[t.doc] = t.id;
    feedAdd("call", `<b>${code(t)}</b> called to Room ${d.room} · ${esc(p.name)}`);
    afterChange(); showCall(t);
  } else if (k === "move") {
    const others = activeDocs().filter((x) => x.id !== t.doc && x.status !== "break");
    const anchor = $(`.tok[data-tok="${t.id}"] [data-act="tokmenu"]`) || $("#newTok");
    menu(anchor, [{ head: "Move " + code(t) + " to" }, ...others.map((x) => ({ id: x.id, label: x.name, icon: "steth", sub: `${waitingFor(x.id).length} waiting` }))], (nd) => {
      const nx = docOf(nd);
      const no = nextTokNo(nx.pre); S.seq.tok[nx.pre] = no;
      const old = code(t);
      t.doc = nd; t.pre = nx.pre; t.no = no;
      feedAdd("walk", `<b>${old}</b> moved to ${esc(nx.name)} as <b>${code(t)}</b>`);
      toast(`${old} is now ${code(t)} with ${nx.name}`, "", "move");
      afterChange();
    }, 260);
  } else if (k === "pri") { t.pri = t.pri === "urgent" ? (p.age >= 65 ? "elderly" : "normal") : "urgent"; toast(`${code(t)} marked ${t.pri === "urgent" ? "urgent: moves to the front" : "normal"}`, "", "bolt"); afterChange(); }
  else if (k === "edit") {
    formModal({ title: "Edit " + code(t), sub: p.name, fields: [{ k: "reason", label: "Reason for visit", req: true, list: REASONS[KIND_OF[t.doc]].map((r) => r[0]) }, { k: "kind", label: "Visit", type: "radio", options: [["new", "New visit"], ["follow", "Follow-up"], ["proc", "Procedure"]] }], values: { reason: t.reason, kind: t.kind },
      onSubmit(v) { t.reason = v.reason; t.kind = v.kind; toast("Token updated"); afterChange(); } });
  } else if (k === "pat") openPatient(t.pat);
  else if (k === "bill") openBill(t.bill);
  else if (k === "noshow") { t.status = "noshow"; feedAdd("walk", `<b>${code(t)}</b> marked as not here`); toast(`${code(t)} marked as a no-show`, "", "noshow"); afterChange(); }
  else if (k === "cancel") {
    if (!(await confirmBox("Cancel " + code(t) + "?", `${esc(p.name)} leaves the queue. A paid fee is refunded in cash.`, "Cancel token"))) return;
    t.status = "cancel";
    const b = billOf(t.bill);
    if (b) b.status = b.status === "paid" ? "refund" : "refund";
    feedAdd("walk", `<b>${code(t)}</b> cancelled, fee refunded`);
    toast(`${code(t)} cancelled and refunded`);
    afterChange();
  } else if (k === "finish") { finishTok(t); toast(`${d.name} finished with ${code(t)}`); afterChange(); drawBoardText(); }
  else if (k === "back") { t.status = "wait"; t.called = null; S.board[t.doc] = null; toast(`${code(t)} is waiting again`); afterChange(); }
}

/* =====================================================================

const PAT_PER = 12;
function patList() {
  const q = UI.pat.q.trim().toLowerCase();
  let list = S.pats.filter((p) => !q || p.name.toLowerCase().includes(q) || String(p.mr).includes(q) || p.phone.replace("-", "").includes(q.replace("-", "")));
  const f = UI.pat.seg;
  if (f === "kids") list = list.filter((p) => p.kid);
  else if (f === "panel") list = list.filter((p) => p.panel);
  else if (f === "long") list = list.filter((p) => p.cond.length);
  else if (f === "allergy") list = list.filter((p) => p.allergies.length);
  const last = (p) => (S.toks.some((t) => t.pat === p.id) ? TODAY_ISO : p.visits[0] ? p.visits[0].date : p.since);
  const key = { name: (p) => p.name, age: (p) => +p.age, last, visits: (p) => p.visits.length + (S.toks.some((t) => t.pat === p.id) ? 1 : 0) }[UI.pat.sort] || last;
  return list.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * UI.pat.dir; });
}

  const list = patList();
  const pages = Math.max(1, Math.ceil(list.length / PAT_PER));

  const rows = list.slice(UI.pat.page * PAT_PER, UI.pat.page * PAT_PER + PAT_PER);
  if (!UI.pat.sel || !S.pats.some((p) => p.id === UI.pat.sel)) UI.pat.sel = rows[0] ? rows[0].id : null;

const SH = 22, DAY0 = HM(9), DAY1 = HM(21);

  const out = [];

function counterSale() {

  const fields = [0, 1, 2].flatMap((i) => [
    { k: "m" + i, label: i ? "Another medicine" : "Medicine", type: "select", options: i ? [["", "None"], ...opts] : opts, value: i ? "" : opts[0][0] },
    { k: "q" + i, label: "Quantity", type: "number", min: 0, max: 1000, half: true, value: i ? 0 : 10 },
  ]).map((f) => (f.type === "select" ? { ...f, half: true } : f));
  fields.push({ k: "pay", label: "Payment", type: "radio", options: [["cash", "Cash"], ["card", "Card"]] }, { k: "sum", type: "html", html: '<div class="sumline" id="saleSum"><span>Total</span><b>Rs 0</b></div>' });

    foot,

function billDialog(o) {
  const items = ["Consultation", "Dressing", "Injection fee", "ECG", "Nebulisation", "Blood pressure check", "Medical certificate", "Stitches", "Drip (IV) fee"];
  const fields = [{ k: "pat", label: "Patient", list: S.pats.map(patLabel), ph: "Leave empty for a walk-in", check: (v) => (!v || findPat(v) ? "" : "Pick a registered patient or leave it empty") }];
  [0, 1, 2].forEach((i) => fields.push({ k: "l" + i, label: i ? "Item" : "First item", req: !i, half: true, list: items, ph: i ? "Optional" : "e.g. Dressing" }, { k: "a" + i, label: "Amount (PKR)", type: "number", min: 0, max: 500000, req: !i, half: true, check: (v, all) => (!i && !(v > 0) ? "Enter an amount" : all["l" + i] && !(v > 0) ? "Enter an amount" : "") }));
  fields.push({ k: "disc", label: "Discount (PKR)", type: "number", min: 0, max: 500000, half: true }, { k: "pay", label: "Payment", type: "radio", half: true, options: [["cash", "Cash"], ["card", "Card"], ["later", "Later"]] }, { k: "sum", type: "html", html: '<div class="sumline" id="billSum"><span>Total</span><b>Rs 0</b></div>' });
  const lines = (v) => [0, 1, 2].filter((i) => v["l" + i] && v["a" + i] > 0).map((i) => ({ t: /consult/i.test(v["l" + i]) ? "consult" : "other", label: v["l" + i], amt: +v["a" + i] }));
  formModal({
    title: "New bill", sub: "For services at the desk: dressings, injections, certificates", fields, values: { pat: o.pat ? patLabel(patOf(o.pat)) : "", disc: 0, pay: "cash", l0: "", a0: "" }, submit: "Save bill",
    onInput(v, form) { const s = $("#billSum b", form); if (s) s.textContent = rs(Math.max(0, sum(lines(v).map((l) => l.amt)) - (+v.disc || 0))); },
    onSubmit(v) {
      const p = findPat(v.pat);
      const b = newBill(S, p ? p.id : null, NOW(), lines(v), v.pay === "later" ? "cash" : v.pay, v.pay === "later" ? "unpaid" : "paid", p ? {} : { walkin: "Walk-in" });
      b.disc = Math.min(+v.disc || 0, sum(b.lines.map((l) => l.amt)));
      feedAdd("pay", `${billNo(b)} · ${rs(billTotal(b))}${p ? " for " + esc(p.name) : ""}`);
      toast(`${billNo(b)} saved · ${rs(billTotal(b))}`, "", "receipt");
      afterChange();
    },
  });
}
function cashCount() {
  const D = [5000, 1000, 500, 100, 50, 20, 10];
  const exp = drawerExpected();
  const m = openModal({
    title: "Count the cash drawer", sub: `It should hold ${rs(exp)} (float ${rs(S.drawer.float)} plus today's cash)`,
    html: `<div class="denoms">${D.map((d) => `<div class="denom"><label for="dn-${d}">Rs ${num(d)}</label><input class="input" id="dn-${d}" type="number" min="0" max="9999" value="" placeholder="0" inputmode="numeric"><span id="dv-${d}">Rs 0</span></div>`).join("")}</div><div class="sumline" style="margin-top:14px" id="cashSum"><span>Counted</span><b>Rs 0</b></div><p class="muted" id="cashDiff" style="font-size:12.5px;margin-top:8px"></p>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Save count</button>`,
    onOpen(box) {
      const calc = () => { let t = 0; D.forEach((d) => { const n = Math.max(0, +$("#dn-" + d, box).value || 0); t += n * d; $("#dv-" + d, box).textContent = rs(n * d); }); $("#cashSum b", box).textContent = rs(t); const diff = t - exp; $("#cashDiff", box).innerHTML = !t ? "Enter how many notes and coins of each kind are in the drawer." : diff === 0 ? '<b style="color:var(--good)">Exact. Well counted.</b>' : `<b style="color:var(--coral-ink)">${diff > 0 ? "Over" : "Short"} by ${rs(Math.abs(diff))}</b>: count again or add a note.`; return t; };
      box.addEventListener("input", calc);
      $("[data-ok]", box).addEventListener("click", () => {
        const t = calc();
        if (!t) { toast("Enter the notes in the drawer first", "warn"); return; }
        S.drawer.counted = { at: NOW(), total: t, diff: t - exp };
        toast(t === exp ? "Drawer counted: exact" : `Drawer counted: ${t > exp ? "over" : "short"} by ${rs(Math.abs(t - exp))}`, t === exp ? "" : "warn", "cash");
        m.close(); afterChange();
      });
    },
  });
}

function todayRow() {
  const seen = S.toks.filter((t) => t.status === "done" || t.status === "room");
  const src = (t) => sum(S.bills.filter((b) => b.status !== "refund").flatMap((b) => b.lines.filter((l) => l.t === t).map((l) => l.amt)));
  const hours = Array.from({ length: 12 }, (_, h) => S.toks.filter((t) => Math.floor(t.at / 3600) === 9 + h).length);
  const ap = apptsOn(TODAY_ISO);
  return { date: TODAY_ISO, dow: TODAY.getDay(), pts: seen.length, fresh: seen.filter((t) => t.kind !== "follow").length, follow: seen.filter((t) => t.kind === "follow").length, wait: +(avg(seen.filter((t) => t.called).map((t) => t.called - t.at)) / 60).toFixed(1), noshow: ap.length ? (ap.filter((a) => a.status === "noshow").length / ap.length) * 100 : 0, consult: src("consult"), lab: src("lab"), rx: src("rx") + src("other"), hours, byDoc: Object.fromEntries(S.docs.map((d) => [d.id, S.toks.filter((t) => t.doc === d.id && (t.status === "done" || t.status === "room")).length])) };
}

/* =====================================================================
   Issue a token (the most used dialog) and the printed token slip
   ===================================================================== */
function newTokenDialog(o = {}) {
  const docs = S.docs.filter((d) => isOnShift(d) && d.status !== "break");
  if (!docs.length) { toast("No doctor is taking patients right now", "warn"); return; }
  const best = docs.slice().sort((a, b) => expectWait(a.id) - expectWait(b.id))[0];
  const p0 = o.pat ? patOf(o.pat) : null;
  const allReasons = [...new Set(Object.values(REASONS).flat().map((r) => r[0]))];
  formModal({
    title: "Issue a token", sub: "The fee is taken now and the token joins the doctor's queue",
    fields: [
      { k: "pat", label: "Patient", req: true, list: S.pats.map(patLabel), ph: "Type a name, MR number, or a new name", check: (v) => (findPat(v) || v.trim().split(/\s+/).length >= 2 ? "" : "For a new patient enter the full name") },
      { k: "age", label: "Age", type: "number", min: 0, max: 110, half: true, check: (v, all) => (!findPat(all.pat) && v === "" ? "Needed for a new patient" : "") },
      { k: "sex", label: "Sex", type: "radio", half: true, options: [["F", "Female"], ["M", "Male"]] },
      { k: "phone", label: "Mobile", half: true, ph: "0300-1234567", pattern: /^03\d{2}-?\d{7}$/, patternMsg: "Use a mobile number like 0300-1234567" },
      { k: "doc", label: "Doctor", type: "select", half: true, options: docs.map((d) => [d.id, `${d.name} · ${waitingFor(d.id).length} waiting`]) },
      { k: "reason", label: "Reason for visit", req: true, list: allReasons, ph: "e.g. Fever and body ache" },
      { k: "kind", label: "Visit", type: "radio", half: true, options: [["new", "New"], ["follow", "Follow-up"], ["proc", "Procedure"]] },
      { k: "pri", label: "Priority", type: "radio", half: true, options: [["normal", "Normal"], ["urgent", "Urgent"], ["elderly", "Elderly"]] },
      { k: "pay", label: "Payment", type: "radio", options: [["cash", "Cash"], ["card", "Card"], ["panel", "Company panel"], ["later", "After the visit"]], check: (v, all) => (v === "panel" && !(findPat(all.pat) || {}).panel ? "This patient is not on a company panel" : "") },
      { k: "sum", type: "html", html: '<div class="sumline" id="tokSum"><span>Fee</span><b>Rs 0</b></div>' },
    ],
    values: { pat: p0 ? patLabel(p0) : "", age: p0 ? p0.age : "", sex: p0 ? p0.sex : "F", phone: p0 ? p0.phone : "", doc: o.doc || best.id, kind: p0 && p0.visits.length ? "follow" : "new", pri: "normal", pay: p0 && p0.panel ? "panel" : "cash" },
    submit: "Issue token",
    onInput(v, form) {
      const p = findPat(v.pat), d = docOf(v.doc);
      if (p && form.dataset.pid !== p.id) {
        form.dataset.pid = p.id;
        form.age.value = p.age; form.phone.value = p.phone;
        const sx = form.querySelector(`[name="sex"][value="${p.sex}"]`); if (sx) sx.checked = true;
        const kd = form.querySelector(`[name="kind"][value="${p.visits.length ? "follow" : "new"}"]`); if (kd) kd.checked = true;
        if (p.panel) { const pp = form.querySelector('[name="pay"][value="panel"]'); if (pp) pp.checked = true; }
      }
      const kind = (form.querySelector('[name="kind"]:checked') || {}).value || v.kind;
      const fee = kind === "follow" ? d.ffee : kind === "proc" ? 800 : d.fee;
      const s = $("#tokSum", form);
      if (s) s.innerHTML = `<span>${d.pre}-${String(nextTokNo(d.pre)).padStart(3, "0")} · ${waitingFor(d.id).length} ahead · about ${expectWait(d.id)} min${p && p.panel ? " · " + esc(panelOf(p.panel).short) + " panel" : p ? "" : v.pat ? " · new patient" : ""}</span><b>${rs(fee)}</b>`;
    },
    onSubmit(v) {
      let p = findPat(v.pat);
      if (!p) { p = newPatient({ name: v.pat.trim().replace(/\s+/g, " "), age: v.age, sex: v.sex, phone: v.phone }); toast(`${p.name} registered as MR-${p.mr}`, "", "user"); }
      const t = issueToken(p.id, v.doc, v.reason, v.kind, v.pri, v.pay);
      setTimeout(() => tokenSlip(t), 260);
    },
  });
}
function tokenSlip(t) {
  const d = docOf(t.doc), p = patOf(t.pat), ahead = sortQueue(waitingFor(t.doc)).indexOf(t);
  openModal({
    title: "Token issued", sub: `${esc(p.name)} · ${esc(d.name)}`,
    html: `<div class="slip"><b class="big">${esc(S.cfg.clinic)}</b><p>${fday(TODAY)} · ${fmtT(t.at)}</p><div class="flaps" id="slipFlaps" style="--pc:${PRE_C[d.c]}">${flapsHTML("----")}</div><p><b style="color:var(--ink)">Room ${d.room} · ${esc(d.name)}</b><br>${ahead <= 0 ? "Next in line" : ahead + " ahead of you"} · about ${expectWait(t.doc)} min<br>Please wait until your number shows on the board.</p></div>`,
    foot: `<button class="btn" data-k="print">${ic("print")}Print slip</button><button class="btn pri" data-close>Done</button>`,
    onOpen(box, m) {
      setTimeout(() => flipTo($("#slipFlaps", box), flapCode(t), { stagger: 80, max: 6 }), 150);
      $("[data-k]", box).addEventListener("click", () => printModal(m));
    },
  });
}


/* =====================================================================
   BOOT · draw the shell, start the router, the clock and the live demo
   ===================================================================== */
function tick() {
  S.clock++;
  const t = fmtT(NOW());
  $("#clock").textContent = t;
  const bc = $("#bClock");
  if (bc) bc.textContent = t;
  /* every running timer on screen (waiting, in room, lab stages) */
  $$("[data-since]").forEach((el) => {
    const s = +el.dataset.since, span = el.querySelector("span") || el;
    span.textContent = dur(NOW() - s);
    if (el.closest(".tok") && !el.closest(".inroom")) el.classList.toggle("late", NOW() - s > S.cfg.target * 60);
  });
  if (S.clock % 5 === 0) updRings();
  if (S.clock % 15 === 0) save();
}
function boot() {
  drawNav();
  const q = new URLSearchParams(location.search).get("theme");
  if (!q && (S.cfg.theme === "light" || S.cfg.theme === "dark")) document.documentElement.dataset.theme = S.cfg.theme;
  applyTheme(document.documentElement.dataset.theme);
  drawSide(); drawBell(); initTips();
  $("#clock").textContent = fmtT(NOW());
  if (!/^#\/[\w-]+/.test(location.hash)) history.replaceState(null, "", "#/queue");
  route();
  addEventListener("hashchange", route);

  /* top bar and sidebar */
  $("#searchBtn").addEventListener("click", () => cmdk());
  $("#bell").addEventListener("click", () => openBell($("#bell")));
  $("#themeBtn").addEventListener("click", toggleTheme);
  $("#newTok").addEventListener("click", () => newTokenDialog());
  $("#menuBtn").addEventListener("click", openSide);
  $("#sideScrim").addEventListener("click", closeSide);
  $("#nav").addEventListener("click", closeSide);
  $("#bnav").addEventListener("click", (e) => { if (e.target.closest("#moreBtn")) openSide(); });
  $("#signOut").addEventListener("click", () => toast("This is a demo, so you stay signed in", "", "logout"));
  $("#sideDocs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-doc]");
    if (!b) return;
    const d = docOf(b.dataset.doc);
    if (isOnShift(d) || inRoom(d.id)) { UI.board.room = d.id; if (CUR === "queue") { selectRoom(d.id); const col = $(`.qcol[data-doc="${d.id}"]`); if (col) col.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "nearest", inline: "nearest" }); } else go("queue"); }
    else go("doctors");
    closeSide();
  });
  /* keyboard: Ctrl+K search, Esc closes the top layer, Tab stays inside dialogs */
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!modals.length) cmdk(); return; }
    if (e.key === "Escape") {
      if (pop) { closePop(); return; }
      if (modals.length) { modals[modals.length - 1].close(); return; }
      closeSide();
    }
    if (e.key === "Tab" && modals.length) trapTab(e);
  });
  document.addEventListener("mousedown", (e) => { if (pop && !pop.el.contains(e.target) && !pop.anchor.contains(e.target)) closePop(); });
  addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 4), { passive: true });
  addEventListener("resize", () => { updateNav(); placeNow(); });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => { if (!q && (!S.cfg.theme || S.cfg.theme === "system")) applyTheme(e.matches ? "dark" : "light"); });

  /* the clock ticks every second; the clinic moves every few seconds */
  every(1000, tick);
  every(6500, simStep);
  addEventListener("pagehide", () => store.set(KEY, S));
}
boot();
</script>
</body>
