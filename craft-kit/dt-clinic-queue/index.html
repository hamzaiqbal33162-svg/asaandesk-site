<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Desk · Clinic front desk and token queue</title>
<script>
  /* Theme: ?theme=light|dark wins, otherwise follow the system setting */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = q === "light" || q === "dark" ? q : dark ? "dark" : "light";
  })();
</script>
<style>
  /* ---------- Theme: clean teal and white, coral for alerts ---------- */
  :root {
    --bg: #f2f6f5; --side: #ffffff; --band: #e1f0ec; --band-2: #d3e9e3;
    --card: #ffffff; --card-2: #f6faf9; --sunk: #ecf3f1; --panel: #ffffff;
    --ink: #0e2826; --ink-2: #2c4643; --muted: #5f7774; --faint: #8ba29f;
    --line: rgba(14,40,38,.09); --line-2: rgba(14,40,38,.15);
    --teal: #0c8678; --teal-h: #0a7266; --teal-soft: #d2ede7; --teal-tint: #eaf6f3;
    --coral: #e5533d; --coral-ink: #c4402b; --coral-soft: #fde2dc;
    --amber: #c5860f; --amber-ink: #9a6600; --amber-soft: #faeed0;
    --indigo: #5163c9; --indigo-soft: #e2e6fa; --rose: #bf4479; --rose-soft: #f8e0eb;
    --sky: #2a7fb8; --sky-soft: #dcecf7; --olive: #6f8a2a; --olive-soft: #ebf1d8;
    --good: #198c62; --good-soft: #d8f1e6;
    --accent: var(--teal); --accent-ink: #ffffff; --focus: #0c8678;
    --board: #0b2a27; --board-2: #10342f; --flap-a: #1a4540; --flap-b: #12322f; --board-ink: #effcf9; --board-muted: #8ebcb4; --board-line: rgba(255,255,255,.09);
    --shadow: 0 1px 2px rgba(14,40,38,.05), 0 8px 22px -16px rgba(14,40,38,.28);
    --shadow-h: 0 2px 4px rgba(14,40,38,.06), 0 18px 34px -18px rgba(14,40,38,.36);
    --radius: 14px; --radius-sm: 10px;
    --overlay: rgba(10,32,30,.34); --tip-bg: #0e2826; --tip-ink: #fff;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0a1413; --side: #0d1918; --band: #0f201e; --band-2: #132825;
    --card: #11201e; --card-2: #152624; --sunk: #182c29; --panel: #132321;
    --ink: #e5f2ef; --ink-2: #bfd3cf; --muted: #8ea8a4; --faint: #67827e;
    --line: rgba(255,255,255,.075); --line-2: rgba(255,255,255,.13);
    --teal: #36c2b0; --teal-h: #52d3c2; --teal-soft: rgba(54,194,176,.15); --teal-tint: rgba(54,194,176,.07);
    --coral: #ff7a64; --coral-ink: #ff8f7c; --coral-soft: rgba(255,122,100,.15);
    --amber: #f0b445; --amber-ink: #f4c46b; --amber-soft: rgba(240,180,69,.14);
    --indigo: #8f9cff; --indigo-soft: rgba(143,156,255,.15); --rose: #f07bb0; --rose-soft: rgba(240,123,176,.14);
    --sky: #6bb8ec; --sky-soft: rgba(107,184,236,.14); --olive: #b0cc63; --olive-soft: rgba(176,204,99,.13);
    --good: #4fd19b; --good-soft: rgba(79,209,155,.14);
    --accent-ink: #062320; --focus: #52d3c2;
    --board: #061412; --board-2: #0b201d; --flap-a: #173b36; --flap-b: #0f2a26;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.75);
    --shadow-h: 0 2px 4px rgba(0,0,0,.35), 0 20px 38px -18px rgba(0,0,0,.85);
    --overlay: rgba(0,0,0,.52); --tip-bg: #e9f4f1; --tip-ink: #0b1716;
    color-scheme: dark;
  }
  /* One colour per doctor (token prefix, column, ring) */
  .c-teal { --c: var(--teal); --cs: var(--teal-soft); }
  .c-amber { --c: var(--amber); --cs: var(--amber-soft); }
  .c-rose { --c: var(--rose); --cs: var(--rose-soft); }
  .c-indigo { --c: var(--indigo); --cs: var(--indigo-soft); }
  .c-sky { --c: var(--sky); --cs: var(--sky-soft); }
  .c-olive { --c: var(--olive); --cs: var(--olive-soft); }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: clip; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  /* one-column grids whose items hold nowrap text must not grow past their card */
  .mini-list, .qlist, .feed, .tl, .rx-items, .hbars, .tok, .lt, .rx, .doc, .lab-col, .req { grid-template-columns: minmax(0, 1fr); }
  .fi b { white-space: nowrap; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Buttons, chips, inputs ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; }
  .btn:hover { border-color: var(--teal); }
  .btn:active { transform: translateY(1px); }
  .btn.pri { background: var(--teal); border-color: var(--teal); color: var(--accent-ink); box-shadow: 0 6px 16px -8px var(--teal); }
  .btn.pri:hover { background: var(--teal-h); }
  .btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
  .btn.danger { color: var(--coral-ink); border-color: color-mix(in srgb, var(--coral) 40%, transparent); }
  .btn.danger:hover { background: var(--coral-soft); border-color: var(--coral); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--sunk); border-color: transparent; }
  .btn.sm { height: 27px; padding: 0 9px; font-size: 12px; border-radius: 8px; }
  .btn.icon { width: 32px; padding: 0; }
  .btn.icon.sm { width: 27px; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .tag .ic { width: 12px; height: 12px; }
  .tag.teal { background: var(--teal-soft); color: var(--teal); }
  .tag.coral { background: var(--coral-soft); color: var(--coral-ink); }
  .tag.amber { background: var(--amber-soft); color: var(--amber-ink); }
  .tag.indigo { background: var(--indigo-soft); color: var(--indigo); }
  .tag.rose { background: var(--rose-soft); color: var(--rose); }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .tag.line { background: transparent; border: 1px solid var(--line-2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
  .input, .select, textarea.input { height: 34px; width: 100%; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-size: 13px; transition: border-color .15s, box-shadow .15s; }
  textarea.input { height: auto; min-height: 70px; padding: 8px 10px; resize: vertical; }
  .input:focus, .select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
  .input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
  .searchbox { position: relative; display: flex; align-items: center; }
  .searchbox .ic { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
  .searchbox .input { padding-left: 32px; height: 32px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--sunk); position: relative; }
  .seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button .n { margin-left: 4px; color: var(--faint); font-weight: 500; }
  .switch { position: relative; width: 36px; height: 21px; border-radius: 11px; border: 0; background: var(--line-2); flex: none; transition: background .2s; padding: 0; }
  .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
  .switch[aria-checked="true"] { background: var(--teal); }
  .switch[aria-checked="true"]::after { transform: translateX(15px); }
  kbd { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 5px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--muted); }

  /* ---------- Forms in dialogs ---------- */
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .field { display: grid; gap: 5px; grid-column: span 2; align-content: start; }
  .field.half { grid-column: span 1; }
  .field > label, .field > .lab { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field .hint { font-size: 11.5px; color: var(--muted); }
  .field .err { font-size: 11.5px; color: var(--coral-ink); font-weight: 600; min-height: 0; }
  .field .err:empty { display: none; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt:has(input:checked) { border-color: var(--teal); background: var(--teal-tint); color: var(--teal); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .check { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 12.5px; cursor: pointer; }
  .check:has(input:checked) { border-color: var(--teal); background: var(--teal-tint); }
  .check input { accent-color: var(--teal); margin: 0; }
  .check .p { margin-left: auto; color: var(--muted); font-size: 12px; }
  .sumline { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 13px; grid-column: span 2; }
  .sumline b { font-size: 16px; }

  /* ---------- Dialogs, drawers, toasts, popovers, tooltip, command search ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: grid; place-items: center; padding: 20px; opacity: 0; transition: opacity .2s; }
  .scrim.in { opacity: 1; }
  .scrim.out { opacity: 0; }
  .modal { width: min(520px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); transform: translateY(10px) scale(.98); transition: transform .25s cubic-bezier(.2,.9,.3,1.1); outline: none; }
  .modal.wide { width: min(720px, 100%); }
  .scrim.in .modal { transform: none; }
  .scrim.for-drawer { place-items: stretch end; padding: 0; }
  .drawer { width: min(440px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -30px 0 60px -30px rgba(0,0,0,.4); transform: translateX(30px); transition: transform .28s cubic-bezier(.2,.9,.3,1); outline: none; }
  .scrim.in .drawer { transform: none; }
  .m-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .m-head > div { flex: 1; min-width: 0; }
  .m-head h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .m-head p { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  .m-body { padding: 16px 18px; overflow: auto; flex: 1; }
  .m-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .m-foot .left { margin-right: auto; }
  #toasts { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 9px; max-width: 380px; padding: 10px 14px; border-radius: 11px; background: var(--tip-bg); color: var(--tip-ink); font-size: 12.5px; font-weight: 500; box-shadow: 0 14px 34px -12px rgba(0,0,0,.45); animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2); pointer-events: auto; }
  .toast .ic { color: var(--teal-h); }
  [data-theme="dark"] .toast .ic { color: var(--teal-h); }
  .toast.warn .ic { color: var(--coral); }
  .toast.out { opacity: 0; transform: translateY(6px); transition: .25s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .pop { position: fixed; z-index: 70; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow-h); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
  .pop.in { opacity: 1; transform: none; }
  .pop .mi { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 12.5px; }
  .pop .mi:hover, .pop .mi:focus-visible { background: var(--sunk); outline: none; }
  .pop .mi.danger { color: var(--coral-ink); }
  .pop .mi small { margin-left: auto; color: var(--muted); }
  .pop .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  .pop .ph { padding: 6px 9px 4px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { display: flex; gap: 10px; padding: 9px; border-radius: 9px; font-size: 12.5px; }
  .note + .note { border-top: 1px solid var(--line); border-radius: 0; }
  .note .ni { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); flex: none; }
  .note.alert .ni { background: var(--coral-soft); color: var(--coral-ink); }
  .note.unread b::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--coral); vertical-align: middle; }
  .note small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  #tip { position: fixed; z-index: 95; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--tip-bg); color: var(--tip-ink); font-size: 11.5px; line-height: 1.35; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 240px; }
  #tip.on { opacity: 1; transform: none; }
  .cmdk { width: min(580px, 100%); align-self: start; margin-top: 12vh; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); overflow: hidden; transform: translateY(-8px); transition: transform .22s; }
  .scrim.in .cmdk { transform: none; }
  .cmdk-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .cmdk-in input { flex: 1; height: 52px; border: 0; background: none; font-size: 15px; outline: none; }
  .cmdk-list { max-height: 360px; overflow: auto; padding: 6px; }
  .cmdk-g { padding: 8px 10px 4px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .cmdk-i { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  .cmdk-i .ci { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); flex: none; }
  .cmdk-i small { color: var(--muted); margin-left: auto; font-size: 11.5px; }
  .cmdk-i.on { background: var(--teal-tint); }
  .cmdk-i.on .ci { background: var(--teal); color: var(--accent-ink); }
  .cmdk-foot { display: flex; gap: 14px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

  /* ---------- App shell: sidebar, top bar ---------- */
  .side { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 236px; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px 12px; overflow-y: auto; scrollbar-width: thin; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; text-decoration: none; }
  .brand .mark { width: 34px; height: 34px; flex: none; }
  .brand b { display: block; font-size: 16px; font-weight: 750; letter-spacing: -.02em; }
  .brand small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.25; }
  .nav { position: relative; display: grid; gap: 1px; }
  .nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 35px; padding: 0 10px; border-radius: 9px; text-decoration: none; color: var(--ink-2); font-size: 13px; font-weight: 550; transition: color .15s, background .15s; }
  .nav a:hover { background: var(--sunk); }
  .nav a[aria-current="page"] { color: var(--ink); font-weight: 650; }
  .nav a[aria-current="page"] .ic { color: var(--teal); }
  .nav a .n { margin-left: auto; min-width: 22px; height: 19px; padding: 0 6px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--sunk); color: var(--muted); }
  .nav a .n.hot { background: var(--coral-soft); color: var(--coral-ink); }
  .nav a .n:empty { display: none; }
  .nav .marker { position: absolute; z-index: 0; left: 0; right: 0; height: 35px; border-radius: 9px; background: var(--teal-tint); box-shadow: inset 3px 0 0 var(--teal); transition: transform .32s cubic-bezier(.3,1.2,.4,1), opacity .2s; pointer-events: none; }
  .side-sec { margin-top: 18px; }
  .side-h { display: flex; justify-content: space-between; padding: 0 10px 6px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .sdoc { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border: 0; border-radius: 9px; background: none; text-align: left; }
  .sdoc:hover { background: var(--sunk); }
  .sdoc b { display: block; font-size: 12.5px; font-weight: 600; }
  .sdoc small { display: block; font-size: 11px; color: var(--muted); }
  .sdoc .ring { width: 32px; height: 32px; }
  .side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding-left: 6px; }
  .side-foot b { display: block; font-size: 12.5px; }
  .side-foot small { display: block; font-size: 11px; color: var(--muted); }
  .av { --h: 170; width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: hsl(var(--h) 45% 28%); background: hsl(var(--h) 55% 88%); position: relative; }
  [data-theme="dark"] .av { color: hsl(var(--h) 60% 82%); background: hsl(var(--h) 30% 24%); }
  .av.lg { width: 46px; height: 46px; font-size: 15px; }
  .av.xl { width: 58px; height: 58px; font-size: 18px; }
  .av.on::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); border: 2px solid var(--side); }
  .main { margin-left: 236px; min-height: 100vh; overflow-x: clip; }
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 24px; background: var(--band); transition: box-shadow .2s, background .2s; }
  .top.scrolled { box-shadow: 0 1px 0 var(--line), 0 8px 20px -16px rgba(0,0,0,.3); }
  .search { display: flex; align-items: center; gap: 9px; width: 360px; height: 36px; padding: 0 8px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 80%, transparent); color: var(--muted); font-size: 13px; text-align: left; }
  .search:hover { border-color: var(--teal); }
  .search span { flex: 1; }
  .top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .clock { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .clock b { color: var(--ink); font-size: 13px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 0 var(--teal); animation: live 2s infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  .bell { position: relative; }
  .bell .badge { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--band); }
  .bell .badge:empty { display: none; }
  .menu-btn, .bnav { display: none; }

  /* ---------- Page band (tinted header with title, KPIs and a side panel) ---------- */
  .view { min-height: calc(100vh - 60px); }
  .band { background: var(--band); padding: 6px 24px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 452px; gap: 28px; align-items: start; border-bottom: 1px solid var(--line); overflow-x: clip; }
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .crumb i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
  .band h1 { margin-top: 6px; font-size: 30px; line-height: 1.12; font-weight: 750; letter-spacing: -.025em; }
  .lede { margin-top: 8px; max-width: 600px; color: var(--ink-2); font-size: 13.5px; }
  .band-acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border-top: 1px solid var(--line-2); padding-top: 16px; }
  .kpi { padding: 0 16px; border-left: 1px solid var(--line-2); min-width: 0; }
  .kpi:first-child { padding-left: 0; border-left: 0; }
  .kpi .l { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 550; }
  .kpi .l .ic { width: 14px; height: 14px; }
  .kpi .v { display: block; margin-top: 6px; font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .v small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 3px; }
  .kpi .s { display: block; margin-top: 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .s b { color: var(--ink-2); }
  .kpi .s .up { color: var(--good); font-weight: 650; }
  .kpi .s .down { color: var(--coral-ink); font-weight: 650; }
  .meter { height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--teal); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .meter.warn i { background: var(--amber); }
  .meter.bad i { background: var(--coral); }

  /* ---------- Content, cards, tables ---------- */
  .content { padding: 20px 24px 36px; display: grid; gap: 16px; }
  .grid { display: grid; gap: 16px; align-items: start; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; transition: transform .2s, box-shadow .2s; }
  .card.lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 13px 16px 0; min-height: 44px; flex-wrap: wrap; }
  .card-h h3 { font-size: 14px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .card-h h3 small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .card-h .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card-b { padding: 12px 16px 16px; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; }
  .toolbar .searchbox { width: 240px; }
  .empty { padding: 18px 10px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); position: sticky; top: 0; z-index: 1; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
  .tbl th:last-child, .tbl td:last-child { padding-right: 16px; }
  .tbl th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; align-items: center; gap: 3px; }
  .tbl th button .ic { width: 12px; height: 12px; opacity: .45; }
  .tbl th[aria-sort] button { color: var(--ink); }
  .tbl th[aria-sort] .ic { opacity: 1; color: var(--teal); }
  .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr { transition: background .12s; }
  .tbl tbody tr.click { cursor: pointer; }
  .tbl tbody tr.click:hover { background: var(--card-2); }
  .tbl tbody tr.sel { background: var(--teal-tint); box-shadow: inset 3px 0 0 var(--teal); }
  .tbl td b { font-weight: 650; }
  .tbl td small { display: block; color: var(--muted); font-size: 11.5px; }
  .tbl .r { text-align: right; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .pager .btn { margin-left: 4px; }
  .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .who > div { min-width: 0; }

  /* ---------- Photo cards ---------- */
  .photo { position: relative; overflow: hidden; border-radius: var(--radius); background: var(--sunk); }
  .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform 6s ease; }
  .photo:hover img { transform: scale(1.04); }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; color: #fff; background: linear-gradient(transparent, rgba(4,24,22,.82)); }
  .photo .cap b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .photo .cap span { font-size: 12px; opacity: .88; }
  .photo .pill { position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 8px; background: rgba(255,255,255,.92); color: #0e2826; font-size: 11.5px; font-weight: 650; }
  .side-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .side-card .photo { border-radius: 0; height: 150px; }
  .side-card .sc-b { padding: 12px 14px 14px; }
  .mini-list { display: grid; gap: 2px; }
  .mini-list .mrow { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 12.5px; border-top: 1px solid var(--line); }
  .mini-list .mrow:first-child { border-top: 0; }
  .mini-list .mrow .grow small { display: block; color: var(--muted); font-size: 11.5px; }

  /* ---------- Rings: the live waiting time per doctor ---------- */
  .ring { display: block; width: 44px; height: 44px; flex: none; overflow: visible; }
  .ring .trk { fill: none; stroke: var(--line-2); stroke-width: 4; }
  .ring .ticks { stroke: var(--line-2); stroke-width: 1.2; }
  .ring .arc { fill: none; stroke: var(--teal); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 24px 24px; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1), stroke .4s; }
  .ring.warn .arc { stroke: var(--amber); }
  .ring.late .arc { stroke: var(--coral); }
  .ring .sweep { transform-origin: 24px 24px; animation: sweep 4s linear infinite; }
  .ring .sweep circle { fill: var(--teal); }
  .ring.warn .sweep circle { fill: var(--amber); }
  .ring.late .sweep circle { fill: var(--coral); }
  .ring.idle .sweep { display: none; }
  .ring text { font-size: 12px; font-weight: 750; fill: var(--ink); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .ring text.u { font-size: 7px; font-weight: 600; fill: var(--muted); }
  .ring.draw .arc { animation: arcIn 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
  .ring.compact text { font-size: 15px; }
  @keyframes arcIn { from { stroke-dasharray: 0 100; } }
  @keyframes sweep { to { transform: rotate(360deg); } }

  /* ---------- Signature: the split-flap token board with its chime light ---------- */
  .board { --fw: 54px; --fh: 76px; --fs: 50px; position: relative; overflow: hidden; border-radius: 18px; padding: 14px 16px 14px; color: var(--board-ink); background: radial-gradient(120% 80% at 0% 0%, #164a44 0%, transparent 55%), linear-gradient(160deg, var(--board-2), var(--board)); box-shadow: 0 24px 48px -26px rgba(4,30,27,.75), inset 0 1px 0 rgba(255,255,255,.07); }
  .board::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: box-shadow .4s; }
  .b-top { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--board-muted); font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
  .b-top .b-clock { margin-left: auto; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; color: var(--board-ink); font-weight: 600; }
  .lamp { position: relative; width: 14px; height: 14px; border-radius: 50%; background: #3f6f68; box-shadow: inset 0 -2px 3px rgba(0,0,0,.35); flex: none; transition: background .3s, box-shadow .3s; }
  .lamp::before, .lamp::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid #ff9a83; opacity: 0; }
  .b-main { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
  .b-who { min-width: 0; display: grid; gap: 2px; }
  .b-who .b-room { font-size: 12px; font-weight: 700; color: #ffb4a3; letter-spacing: .04em; text-transform: uppercase; }
  .b-who b { font-size: 15px; font-weight: 700; color: var(--board-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-who span { font-size: 12px; color: var(--board-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flaps { display: inline-flex; gap: 4px; flex: none; }
  .flap { position: relative; width: var(--fw); height: var(--fh); border-radius: 7px; perspective: 260px; font-weight: 750; font-variant-numeric: tabular-nums; color: #f4fffc; box-shadow: 0 3px 8px rgba(0,0,0,.35); }
  .flap.pre { color: var(--pc, #ffd27a); }
  .flap > span { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; backface-visibility: hidden; }
  .flap .ft, .flap .ff1 { top: 0; border-radius: 7px 7px 0 0; background: linear-gradient(180deg, var(--flap-a), var(--flap-b)); }
  .flap .fb, .flap .ff2 { bottom: 0; border-radius: 0 0 7px 7px; background: linear-gradient(180deg, var(--flap-b), var(--flap-a)); }
  .flap b { position: absolute; left: 0; right: 0; height: var(--fh); line-height: var(--fh); text-align: center; font-size: var(--fs); font-weight: 750; }
  .flap .ft b, .flap .ff1 b { top: 0; }
  .flap .fb b, .flap .ff2 b { bottom: 0; }
  .flap .ff1 { z-index: 2; transform-origin: 50% 100%; animation: fold1 var(--fd, 90ms) ease-in both; }
  .flap .ff2 { z-index: 2; transform-origin: 50% 0; animation: fold2 var(--fd, 90ms) ease-out var(--fd, 90ms) both; }
  .flap::after { content: ""; position: absolute; z-index: 3; left: 0; right: 0; top: calc(50% - .5px); height: 1px; background: rgba(0,0,0,.55); }
  .flap::before { content: ""; position: absolute; z-index: 3; left: -2px; top: calc(50% - 3px); width: 3px; height: 6px; border-radius: 2px; background: #071a18; }
  @keyframes fold1 { from { transform: rotateX(0); filter: brightness(1); } to { transform: rotateX(-90deg); filter: brightness(.6); } }
  @keyframes fold2 { from { transform: rotateX(90deg); filter: brightness(1.4); } to { transform: rotateX(0); filter: brightness(1); } }
  .b-rooms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--board-line); }
  .b-rm { --fw: 17px; --fh: 25px; --fs: 15px; position: relative; display: grid; gap: 5px; justify-items: start; padding: 7px 8px 8px; border-radius: 10px; border: 1px solid transparent; background: rgba(255,255,255,.04); color: var(--board-ink); text-align: left; transition: background .2s, border-color .2s; }
  .b-rm:hover { background: rgba(255,255,255,.08); }
  .b-rm[aria-pressed="true"] { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.09); }
  .b-rm .rl { display: flex; align-items: center; gap: 6px; width: 100%; font-size: 11px; font-weight: 650; color: var(--board-muted); }
  .b-rm .rl i { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #5fd6a6; box-shadow: 0 0 8px #5fd6a6; }
  .b-rm .rl i.free { background: #ffb14d; box-shadow: 0 0 8px #ffb14d; animation: blink 1.2s infinite; }
  .b-rm .rl i.off { background: #4b6763; box-shadow: none; }
  .b-rm .flaps { gap: 2px; }
  .b-rm .flap { border-radius: 4px; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .b-rm .flap .ft, .b-rm .flap .ff1 { border-radius: 4px 4px 0 0; }
  .b-rm .flap .fb, .b-rm .flap .ff2 { border-radius: 0 0 4px 4px; }
  .b-rm .flap::before { display: none; }
  .b-rm.flash { animation: rmFlash 1.4s ease; }
  @keyframes rmFlash { 0%, 60% { background: rgba(255,154,131,.25); border-color: #ff9a83; } }
  @keyframes blink { 50% { opacity: .35; } }
  .b-act { display: flex; gap: 8px; margin-top: 12px; }
  .b-act .call { flex: 1; height: 38px; font-size: 13.5px; background: #2fc0ad; border-color: #2fc0ad; color: #04201d; box-shadow: 0 10px 24px -12px #2fc0ad; }
  .b-act .call:hover { background: #47d4c1; }
  .b-act .bg { height: 38px; background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); color: var(--board-ink); }
  .b-act .bg:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
  .b-sweep { position: absolute; left: 0; top: 0; height: 2px; width: 40%; background: linear-gradient(90deg, transparent, #ffb4a3, transparent); opacity: 0; pointer-events: none; }
  .board.chiming .lamp { background: #ff8a70; box-shadow: 0 0 14px 3px rgba(255,138,112,.85), inset 0 -2px 3px rgba(0,0,0,.2); }
  .board.chiming .lamp::before { animation: ripple 1.3s ease-out; }
  .board.chiming .lamp::after { animation: ripple 1.3s ease-out .35s; }
  .board.chiming::before { box-shadow: inset 0 0 0 1px rgba(255,154,131,.55), inset 0 0 40px rgba(255,138,112,.12); }
  .board.chiming .b-sweep { animation: bsweep 1.1s ease-in-out; }
  @keyframes ripple { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.6); } }
  @keyframes bsweep { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 0; transform: translateX(260%); } }

  /* ---------- Queue page ---------- */
  .qboard { padding: 0 0 6px; }
  .qcols { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; padding: 12px 16px 12px; }
  .qcol { min-width: 0; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .qcol-h { display: flex; align-items: center; gap: 9px; }
  .qcol-h .t { min-width: 0; flex: 1; }
  .qcol-h .t b { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qcol-h .t span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qstats { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); padding: 0 2px; }
  .qstats b { color: var(--ink); font-weight: 700; }
  .qstats .est { margin-left: auto; }
  .tok { position: relative; display: grid; gap: 4px; padding: 9px 10px 9px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: transform .18s, box-shadow .18s, border-color .18s; }
  .tok::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); opacity: .85; }
  .tok:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
  .tok.urgent { border-color: color-mix(in srgb, var(--coral) 45%, transparent); }
  .tok.urgent::before { background: var(--coral); }
  .tok.inroom { background: linear-gradient(180deg, var(--teal-tint), var(--card)); border-color: color-mix(in srgb, var(--teal) 40%, transparent); }
  .tok.called { animation: called 1.6s ease; }
  @keyframes called { 0%, 40% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 45%, transparent); } }
  .tok-h { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .tno { flex: none; height: 21px; padding: 0 6px; border-radius: 6px; display: grid; place-items: center; font-size: 11.5px; font-weight: 750; font-variant-numeric: tabular-nums; background: var(--cs); color: var(--c); letter-spacing: .02em; }
  .tok-h b { min-width: 0; flex: 1; font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tok-h .btn { margin: -4px -6px -4px 0; width: 24px; height: 24px; color: var(--muted); }
  .tok-m { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tok-f { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .tok-f .tags { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
  .tok-f .tag { height: 18px; font-size: 10.5px; padding: 0 5px; }
  .wait { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .wait .ic { width: 12px; height: 12px; }
  .wait.late { color: var(--coral-ink); }
  .inroom .wait { color: var(--teal); }
  .room-free { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; border: 1px dashed var(--line-2); font-size: 12px; color: var(--muted); }
  .room-free .btn { margin-left: auto; }
  .qlist { display: grid; gap: 6px; }
  .qmore { font-size: 11.5px; color: var(--muted); text-align: center; padding: 2px; }
  .feed { display: grid; }
  .fi { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; align-items: flex-start; }
  .fi:first-child { border-top: 0; }
  .fi .fic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--teal-soft); color: var(--teal); }
  .fi .fic .ic { width: 14px; height: 14px; }
  .fi.k-call .fic { background: var(--coral-soft); color: var(--coral-ink); }
  .fi.k-pay .fic { background: var(--good-soft); color: var(--good); }
  .fi.k-lab .fic { background: var(--indigo-soft); color: var(--indigo); }
  .fi.k-rx .fic { background: var(--amber-soft); color: var(--amber-ink); }
  .fi .ft { flex: 1; min-width: 0; line-height: 1.4; }
  .fi time { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fi.new { animation: feedIn .5s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-8px); background: var(--teal-tint); } }
  .seats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .seat { aspect-ratio: 1.15; border-radius: 5px 5px 3px 3px; background: var(--sunk); border: 1px solid var(--line); transition: background .4s, border-color .4s; }
  .seat.on { background: var(--c); border-color: transparent; opacity: .85; }
  .wroom { display: grid; grid-template-columns: 132px 1fr; gap: 14px; }
  .wroom .photo { height: 100%; min-height: 150px; border-radius: 10px; }
  .wroom .photo img { object-position: 78% 78%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--teal)); }

  /* ---------- Doctors page ---------- */
  .docs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .doc { padding: 14px; display: grid; gap: 12px; }
  .doc-h { display: flex; gap: 10px; align-items: flex-start; }
  .doc-h .grow b { display: block; font-size: 14px; font-weight: 700; }
  .doc-h .grow span { display: block; font-size: 12px; color: var(--muted); }
  .doc-mid { display: flex; align-items: center; gap: 14px; }
  .doc-mid .ring { width: 76px; height: 76px; flex: none; }
  .doc-mid .ring text { font-size: 12px; }
  .doc-mid .ring text.u { font-size: 6px; }
  .doc-h .grow { min-width: 0; }
  .doc-h .grow span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dstats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .dstats div { font-size: 11.5px; color: var(--muted); }
  .dstats b { display: block; font-size: 15px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .doc-f { display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .doc-f .acts { margin-left: auto; display: flex; gap: 6px; }
  .doc.off { opacity: .78; }
  .roster { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 12px; }
  .roster th { font-size: 11.5px; color: var(--muted); font-weight: 650; text-align: left; padding: 2px 4px; }
  .roster th.today { color: var(--teal); }
  .roster td.nm { white-space: nowrap; padding-right: 10px; font-weight: 600; }
  .shift { width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); color: var(--muted); font-size: 11.5px; font-weight: 650; display: grid; place-items: center; transition: background .2s, transform .15s; }
  .shift:hover { transform: translateY(-1px); border-color: var(--teal); }
  .shift.m { background: var(--teal-soft); color: var(--teal); border-color: transparent; }
  .shift.e { background: var(--indigo-soft); color: var(--indigo); border-color: transparent; }
  .shift.me { background: linear-gradient(90deg, var(--teal-soft) 50%, var(--indigo-soft) 50%); color: var(--ink-2); border-color: transparent; }
  .shift.pop-in { animation: popIn .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popIn { from { transform: scale(.85); } }

  /* ---------- Patients page ---------- */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 16px; align-items: start; }
  .sticky { position: sticky; top: 76px; }
  .pd-h { display: flex; gap: 12px; align-items: center; padding: 16px 16px 12px; }
  .pd-h b { display: block; font-size: 16px; font-weight: 700; }
  .pd-h small { display: block; font-size: 12px; color: var(--muted); }
  .pd-tags { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 16px; }
  .vitals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px 4px; }
  .vital { padding: 9px 10px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); min-width: 0; }
  .vital small { display: block; font-size: 11px; color: var(--muted); }
  .vital b { display: block; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .vital svg { display: block; width: 100%; height: 22px; margin-top: 3px; }
  .spark { fill: none; stroke: var(--teal); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .spark.coral { stroke: var(--coral); }
  .sec-t { padding: 14px 16px 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; }
  .tl { padding: 2px 16px 6px; display: grid; }
  .tl-i { position: relative; padding: 0 0 12px 18px; font-size: 12.5px; }
  .tl-i::before { content: ""; position: absolute; left: 3px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--card); border: 2px solid var(--c, var(--teal)); }
  .tl-i::after { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 1px; background: var(--line-2); }
  .tl-i:last-child::after { display: none; }
  .tl-i b { font-weight: 650; }
  .tl-i small { display: block; color: var(--muted); font-size: 11.5px; }
  .pd-acts { display: flex; gap: 6px; padding: 12px 16px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }

  /* ---------- Appointments page ---------- */
  .days { display: flex; gap: 6px; padding: 12px 16px 0; overflow-x: auto; scrollbar-width: none; }
  .day { flex: 1; min-width: 74px; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); text-align: left; transition: border-color .15s, background .15s, transform .15s; }
  .day:hover { transform: translateY(-1px); border-color: var(--teal); }
  .day small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .day b { display: block; font-size: 15px; font-weight: 750; }
  .day span { font-size: 11px; color: var(--muted); }
  .day[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--accent-ink); }
  .day[aria-pressed="true"] small, .day[aria-pressed="true"] span { color: inherit; opacity: .85; }
  .plan { position: relative; margin: 12px 16px 16px; border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: 590px; }
  .plan-grid { position: relative; display: grid; grid-template-columns: 58px repeat(var(--n), minmax(132px, 1fr)); min-width: calc(58px + var(--n) * 132px); }
  .plan-h { position: sticky; top: 0; z-index: 3; padding: 8px 10px; background: var(--card); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); font-size: 12px; min-width: 0; }
  .plan-h:first-child { border-left: 0; left: 0; z-index: 4; }
  .plan-h b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .plan-h small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan-t { position: sticky; left: 0; z-index: 2; background: var(--card); font-size: 11px; color: var(--muted); text-align: right; padding: 0 8px 0 0; border-right: 1px solid var(--line); }
  .plan-t span { display: block; height: var(--sh); line-height: 1; transform: translateY(-5px); font-variant-numeric: tabular-nums; }
  .plan-col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(180deg, transparent 0 calc(var(--sh) * 2 - 1px), var(--line) calc(var(--sh) * 2 - 1px) calc(var(--sh) * 2)); }
  .plan-col.off { background-color: var(--card-2); }
  .slot { position: absolute; left: 0; right: 0; height: var(--sh); border: 0; background: transparent; padding: 0; }
  .slot:hover { background: var(--teal-tint); }
  .slot:hover::after { content: "+ Book"; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 650; color: var(--teal); }
  .appt { position: absolute; left: 4px; right: 4px; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 7px; border: 0; background: var(--cs); color: var(--ink); font-size: 11.5px; text-align: left; overflow: hidden; border-left: 3px solid var(--c); transition: transform .15s, box-shadow .15s; }
  .appt:hover { transform: translateY(-1px); box-shadow: var(--shadow-h); z-index: 2; }
  .appt b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .appt .ic { width: 12px; height: 12px; flex: none; margin-left: auto; }
  .appt.done { opacity: .55; }
  .appt.noshow { background: var(--coral-soft); border-left-color: var(--coral); text-decoration: line-through; opacity: .8; }
  .appt.checked { box-shadow: inset 0 0 0 1px var(--c); }
  .offh { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--card-2) 0 6px, var(--sunk) 6px 7px); pointer-events: none; }
  .nowline { position: absolute; left: 58px; right: 0; z-index: 2; height: 2px; background: var(--coral); pointer-events: none; }
  .nowline::before { content: attr(data-t); position: absolute; left: -56px; top: -8px; height: 17px; padding: 0 5px; border-radius: 5px; background: var(--coral); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  .req { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .req:first-child { border-top: 0; padding-top: 0; }
  .req .acts { display: flex; gap: 6px; }

  /* ---------- Pharmacy and lab ---------- */
  .rxgrid { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); }
  .rx { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); display: grid; gap: 8px; transition: transform .18s, box-shadow .18s, opacity .3s; }
  .rx:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
  .rx-h { display: flex; align-items: center; gap: 8px; }
  .rx-h b { font-size: 13px; font-weight: 700; }
  .rx-h small { color: var(--muted); font-size: 11.5px; }
  .rx-items { display: grid; gap: 3px; font-size: 12px; }
  .rx-items div { display: flex; gap: 6px; align-items: center; }
  .rx-items .ic { width: 13px; height: 13px; color: var(--good); }
  .rx-items .no .ic { color: var(--coral); }
  .rx-items span.q { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rx-f { display: flex; align-items: center; gap: 6px; }
  .rx-f .grow { font-size: 13px; font-weight: 700; }
  .stock { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .stock .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
  .stock .bar i { display: block; height: 100%; border-radius: 3px; background: var(--teal); width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .stock.low .bar i { background: var(--amber); }
  .stock.out .bar i { background: var(--coral); }
  .stock b { font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; font-weight: 650; }
  .lab-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 12px 16px 16px; }
  .lab-col { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 220px; }
  .lab-col h4 { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; padding: 2px 2px 4px; }
  .lab-col h4 .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .lab-col h4 i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .lt { padding: 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 5px; transition: transform .18s, box-shadow .18s; }
  .lt:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
  .lt.moved { animation: ltIn .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes ltIn { from { opacity: 0; transform: translateX(-14px) scale(.97); } }
  .lt-h { display: flex; gap: 6px; align-items: center; }
  .lt-h b { font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-m { font-size: 11.5px; color: var(--muted); }
  .lt-f { display: flex; align-items: center; gap: 6px; }
  .lt-f .btn { margin-left: auto; }
  .res { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .res td, .res th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .res th { font-size: 11.5px; color: var(--muted); font-weight: 650; }
  .res .flag { font-weight: 700; color: var(--coral-ink); }

  /* ---------- Billing ---------- */
  .donut { display: block; }
  .donut circle { fill: none; stroke-width: 13; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .donut .seg { animation: segIn 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes segIn { from { stroke-dasharray: 0 100; } }
  .donut text { text-anchor: middle; fill: var(--ink); font-weight: 750; font-variant-numeric: tabular-nums; }
  .donut text.s { fill: var(--muted); font-weight: 600; }
  .mix { display: flex; align-items: center; gap: 16px; }
  .mix .legend { display: grid; gap: 8px; flex: 1; font-size: 12.5px; }
  .mix .legend span { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-2); }
  .mix .legend b { font-variant-numeric: tabular-nums; }
  .drawer-cash { display: grid; gap: 6px; font-size: 12.5px; }
  .drawer-cash div { display: flex; justify-content: space-between; }
  .drawer-cash .tot { padding-top: 8px; border-top: 1px dashed var(--line-2); font-weight: 700; font-size: 14px; }
  .denoms { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .denom { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .denom label { width: 62px; font-weight: 650; }
  .denom .input { width: 80px; height: 30px; }
  .denom span { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .panel-row:first-child { border-top: 0; }
  .panel-row .pi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--indigo-soft); color: var(--indigo); flex: none; }
  .panel-row small { display: block; color: var(--muted); font-size: 11.5px; }
  .inv-lines { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .inv-lines td { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .inv-lines td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .inv-lines tr.tot td { font-weight: 750; font-size: 14px; border-bottom: 0; padding-top: 10px; }
  .slip { text-align: center; padding: 6px 0 2px; }
  .slip .flaps { --fw: 48px; --fh: 68px; --fs: 44px; margin: 6px auto 10px; }
  .slip .flaps .flap .ft, .slip .flaps .flap .ff1 { background: linear-gradient(180deg, #1a4540, #12322f); }
  .slip .flaps .flap .fb, .slip .flaps .flap .ff2 { background: linear-gradient(180deg, #12322f, #1a4540); }
  .slip p { color: var(--muted); font-size: 12.5px; }
  .slip b.big { display: block; font-size: 15px; margin-bottom: 2px; }

  /* ---------- Charts ---------- */
  .chart { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .gl { stroke: var(--line); stroke-width: 1; }
  .chart .ax { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .chart .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 18ms); }
  .chart .bar:hover { filter: brightness(1.1); }
  @keyframes barUp { from { transform: scaleY(0); } }
  .chart .ln { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.3s cubic-bezier(.4,0,.2,1) both; }
  .chart .area { opacity: .16; animation: fadeIn 1.2s .3s both; }
  .chart .target { stroke: var(--coral); stroke-width: 1.3; stroke-dasharray: 4 4; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  @keyframes fadeIn { from { opacity: 0; } }
  .heat { display: grid; grid-template-columns: 34px repeat(12, 1fr); gap: 3px; font-size: 10.5px; color: var(--muted); }
  .heat i { aspect-ratio: 1.5; border-radius: 4px; background: var(--teal); animation: fadeIn .6s both; animation-delay: calc(var(--i) * 6ms); }
  .heat span { display: flex; align-items: center; }
  .heat .hx { text-align: center; }
  .hbars { display: grid; gap: 9px; }
  .hbar { display: grid; grid-template-columns: 150px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; }
  .hbar .bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
  .hbar .bar i { display: block; height: 100%; border-radius: 4px; background: var(--teal); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Settings ---------- */
  .set-grid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
  .set-nav { padding: 6px; display: grid; gap: 2px; }
  .set-nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 9px; background: none; text-align: left; }
  .set-nav button:hover { background: var(--sunk); }
  .set-nav button[aria-current="true"] { background: var(--teal-tint); box-shadow: inset 3px 0 0 var(--teal); }
  .set-nav b { display: block; font-size: 12.5px; font-weight: 650; }
  .set-nav small { display: block; font-size: 11.5px; color: var(--muted); }
  .set-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .set-row:first-child { border-top: 0; }
  .set-row > div:first-child { flex: 1; min-width: 0; }
  .set-row b { display: block; font-size: 13px; font-weight: 650; }
  .set-row small { display: block; font-size: 12px; color: var(--muted); }
  .set-row input[type="range"] { width: 200px; accent-color: var(--teal); }
  .profile { display: grid; grid-template-columns: 168px 1fr; gap: 18px; align-items: start; }
  .profile .photo { height: 168px; border-radius: 12px; }
  .profile .photo img { object-position: 80% 75%; }

  /* ---------- Skeleton shimmer and page entrance ---------- */
  .sk { border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(100deg, var(--band) 0%, var(--band) 30%, var(--card) 45%, var(--band) 60%, var(--band) 100%); background-size: 260% 100%; animation: shimmer 1.1s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  .view.enter { animation: viewIn .3s cubic-bezier(.2,.8,.2,1) both; }
  .view.enter .rise { animation: rise .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms + 40ms); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .noanim .rise, .noanim .bar, .noanim .ln, .noanim .area, .noanim .seg, .noanim .heat i, .noanim .ring.draw .arc { animation: none !important; }

  /* ---------- Responsive: 1280 laptop, tablet drawer, 390 phone ---------- */
  @media (max-width: 1360px) {
    .side { width: 218px; }
    .main { margin-left: 218px; }
    .band { grid-template-columns: minmax(0, 1fr) 420px; gap: 22px; }
    .board { --fw: 48px; --fh: 68px; --fs: 44px; }
    .kpi { padding: 0 12px; }
    .kpi .v { font-size: 23px; }
    .search { width: 300px; }
    .clock small { display: none; }
    .split { grid-template-columns: minmax(0, 1fr) 340px; }
  }
  @media (max-width: 1180px) {
    .band { grid-template-columns: minmax(0, 1fr); }
    .band-l, .band-r { min-width: 0; }
    .band-r { max-width: 560px; }
    .docs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split, .set-grid, .rxgrid { grid-template-columns: 1fr; }
    .sticky { position: static; }
    .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lab-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 1023px) {
    .side { transform: translateX(-100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: 20px 0 50px -20px rgba(0,0,0,.4); z-index: 50; width: 260px; }
    .side.open { transform: none; }
    .side-scrim { position: fixed; inset: 0; z-index: 45; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .side.open + .side-scrim { opacity: 1; pointer-events: auto; }
    .main { margin-left: 0; }
    .menu-btn { display: inline-flex; }
    .qcols { grid-template-columns: repeat(var(--n, 4), minmax(250px, 1fr)); overflow-x: auto; scroll-snap-type: x mandatory; }
    .qcol { scroll-snap-align: start; }
  }
  @media (max-width: 720px) {
    body { padding-bottom: 64px; }
    .top { padding: 0 12px; gap: 6px; height: 56px; }
    .search { width: auto; flex: 1; min-width: 0; }
    .search span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search kbd, .clock, .newtok-l { display: none; }
    .band { padding: 4px 14px 18px; gap: 16px; }
    .band h1 { font-size: 25px; }
    .lede { font-size: 13px; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 14px 0; }
    .kpi:nth-child(3) { padding-left: 0; border-left: 0; }
    .kpi .v { font-size: 22px; }
    .board { --fw: 42px; --fh: 60px; --fs: 38px; padding: 12px; }
    .b-rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .b-act .call { min-width: 0; }
    .b-act .bg { width: 42px; padding: 0; }
    .b-act .bg .bl { display: none; }
    .content { padding: 14px 12px 28px; }
    .g2, .g3, .docs, .lab-cols { grid-template-columns: 1fr; }
    .qcols { grid-template-columns: repeat(var(--n, 4), 84%); padding: 12px; }
    .toolbar .searchbox { width: 100%; }
    .wroom { grid-template-columns: 96px 1fr; }
    .vitals { grid-template-columns: 1fr 1fr 1fr; }
    .hbar { grid-template-columns: 110px 1fr 34px; }
    .profile { grid-template-columns: 1fr; }
    .form { grid-template-columns: 1fr; }
    .field.half { grid-column: span 2; }
    .checks, .denoms { grid-template-columns: 1fr; }

  const pad = { l: 40, r: 8, t: 10, b: 24 };
  const n = labels.length, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

  labels.forEach((lb, i) => {

    const tip = `<b>${esc(lb)}</b><br>` + series.map((s) => `${s.name}: ${fmt(s.values[i])}`).join("<br>");
    series.forEach((s, si) => {
      const bh = (ih * s.values[i]) / max;

      const top = si === series.length - 1 || !series.slice(si + 1).some((t) => t.values[i] > 0);
      out += `<rect class="bar" style="--i:${i}" x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${(bw - gap).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="${top ? Math.min(3, (bw - gap) / 2) : 0}" fill="${s.color}" data-tip="${esc(tip)}"/>`;
    });
    if (i % ev === 0) out += `<text class="ax" x="${(x + (bw - gap) / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(lb)}</text>`;

/* ---------- Building the demo data ---------- */
function makePatients(S) {
  const used = new Set();
  for (let i = 0; i < 86; i++) {
    const kid = i % 4 === 1;
    const sex = kid ? (i % 8 === 1 ? "F" : "M") : i % 5 === 0 || i % 5 === 3 ? "M" : "F";
    let name;
    do {
      const fn = kid ? pick(sex === "F" ? KID_F : KID_M) : pick(sex === "F" ? F_NAMES : M_NAMES);
      name = fn + " " + pick(LAST);
    } while (used.has(name));
    used.add(name);
    const age = kid ? randi(1, 12) : i % 9 === 4 ? randi(65, 79) : i % 3 === 2 ? randi(20, 38) : randi(26, 64);
    const cond = [];
    if (!kid && age > 38 && chance(0.4)) cond.push("Diabetes");
    if (!kid && age > 40 && chance(0.35)) cond.push("High blood pressure");
    if (chance(0.08)) cond.push("Asthma");
    if (!kid && sex === "F" && chance(0.08)) cond.push("Thyroid");
    const allergies = chance(0.16) ? ["Penicillin"] : chance(0.06) ? ["Sulfa drugs"] : chance(0.05) ? ["Dust"] : [];
    const p = {
      id: "p" + (i + 1), mr: 10231 + i, name, age, sex, kid, phone: phoneNo(), area: pick(AREAS),
      blood: pick(["B+", "B+", "O+", "O+", "A+", "A+", "AB+", "O-", "B-", "A-"]),
      panel: !kid && chance(0.22) ? pick(PANELS0).id : null, cond, allergies,
      since: iso(addDays(TODAY, -randi(20, 1100))), visits: [], vit: null,
    };
    /* earlier visits (about one patient in eight registered this month) */
    const recent = i % 8 === 3;
    const nv = recent ? 1 : randi(1, 5);
    let back = recent ? randi(3, 26) : randi(4, 40);
    for (let k = 0; k < nv; k++) {
      const doc = kid ? "d2" : cond.includes("Diabetes") && chance(0.7) ? "d4" : sex === "F" && age < 42 && chance(0.4) ? "d3" : chance(0.15) ? "d6" : chance(0.5) ? "d1" : "d5";
      const r = pick(REASONS[KIND_OF[doc]]);
      const d0 = DOCS0.find((d) => d.id === doc);
      p.visits.push({ date: iso(addDays(TODAY, -back)), doc, reason: r[0], dx: r[1], fee: k === nv - 1 ? d0.fee : d0.ffee });
      back += randi(14, 120);
    }
    p.since = recent ? p.visits[p.visits.length - 1].date : iso(addDays(parseIso(p.visits[p.visits.length - 1].date), -randi(0, 400)));
    const sys0 = kid ? 100 : cond.includes("High blood pressure") ? randi(138, 152) : randi(112, 130);
    p.vit = {
      sys: Array.from({ length: 6 }, () => sys0 + randi(-8, 8)), dia: Array.from({ length: 6 }, () => Math.round(sys0 * 0.64) + randi(-5, 5)),
      wt: kid ? Array.from({ length: 6 }, (_, j) => +(8 + age * 2.3 + j * 0.3).toFixed(1)) : (() => { const w = randi(52, 92); return Array.from({ length: 6 }, (_, j) => +(w + Math.sin(j) * 1.4 + j * 0.2).toFixed(1)); })(),
      sugar: cond.includes("Diabetes") ? Array.from({ length: 6 }, () => randi(128, 214)) : null,
    };
    S.pats.push(p);
  }
}

function newBill(S, pat, at, lines, method, status, extra = {}) {
  const b = { id: "b" + ++S.seq.bill, no: S.seq.bill, pat, at, lines, disc: 0, method, panel: method === "panel" ? (patOf(pat, S).panel || "p1") : null, status, claim: method === "panel" ? "pending" : null, ...extra };
  S.bills.push(b);
  return b;
}
const payWay = (S, pid) => (patOf(pid, S).panel ? "panel" : chance(0.68) ? "cash" : "card");
const statusFor = (m) => (m === "panel" ? "claim" : "paid");

function seed(keepCfg) {
  R = seeded(2611);
  const now = HM(11, 40);
  const S = {
    v: 1, day: TODAY_ISO, clock: now, live: true,
    cfg: keepCfg || { clinic: "Greenbelt Family Clinic", area: "Johar Town, Lahore", phone: "042-3517 2290", opd: "9:00 am – 9:00 pm", target: 20, urgentFirst: true, elderlyFirst: true, autoCall: true, chime: true, sound: false, flip: "normal", dailyReset: true },
    docs: DOCS0.map((d) => ({ ...d, status: "in" })), roster: {}, panels: PANELS0.map((p) => ({ ...p })),
    pats: [], toks: [], appts: [], reqs: [], meds: [], rx: [], labs: [], bills: [], feed: [], notes: [],
    seq: { bill: 4180, lab: 3040, mr: 10231 + 86, tok: {} }, drawer: { float: 5000, counted: null }, board: {}, last: null, handed: 0,
    team: TEAM0.map((m) => ({ ...m })), log: LOG0.map((l) => ({ ...l })),
  };
  /* weekly roster: everyone works today; days off are spread over the rest of the week */
  const dow = TODAY.getDay();
  S.docs.forEach((d, i) => {
    const off = (dow + 1 + ((i * 2) % 6)) % 7;
    S.roster[d.id] = Array.from({ length: 7 }, (_, k) => (k === off ? "" : d.shift));
    if (d.id === "d1") S.roster.d1[(dow + 3) % 7] = "me";
    if (d.id === "d5") S.roster.d5[(dow + 2) % 7] = "";
  });
  makePatients(S);
  S.meds = MEDS0.map((m, i) => ({
    id: "m" + (i + 1), name: m[0], str: m[1], form: m[2], price: m[3], stock: m[4], reorder: m[5],
    batch: "B" + randi(2401, 2689) + "-" + String.fromCharCode(65 + (i % 6)),
    exp: iso(addDays(TODAY, [14, 15, 16, 4, 17].includes(i) ? randi(20, 55) : randi(140, 720))), rack: "R" + (1 + (i % 6)) + "-" + (1 + (i % 4)),
  }));

  /* today's tokens, built backwards from now for the four morning doctors */
  const pool = S.pats.slice();
  const take = (test) => {
    if (!pool.length) return S.pats[randi(0, S.pats.length - 1)];
    let i = pool.findIndex(test);
    if (i < 0) i = pool.findIndex((p) => !p.kid);
    return pool.splice(Math.max(0, i), 1)[0];
  };
  const want = { d1: (p) => !p.kid && chance(0.85), d2: (p) => p.kid, d3: (p) => p.sex === "F" && !p.kid && p.age < 46, d4: (p) => !p.kid && p.age > 34 && (p.cond.includes("Diabetes") || chance(0.3)) };
  const waitN = { d1: 4, d2: 3, d3: 3, d4: 2 };
  ["d1", "d2", "d3", "d4"].forEach((did) => {
    const d = S.docs.find((x) => x.id === did);
    /* in room: called a few minutes ago; earlier ones spaced by a consult and a gap */
    const calls = [];
    let t = now - randi(2, 6) * 60 - randi(0, 59);
    while (t > d.from + 120) { calls.unshift(t); t -= Math.round(d.consult * 60 * rand(1.15, 1.75)); }
    const list = [];
    calls.forEach((c, k) => {
      const p = take(want[did]);
      const r = pick(REASONS[KIND_OF[did]]);
      const last = k === calls.length - 1;
      list.push({ id: "t" + uid(), pre: d.pre, no: k + 1, doc: did, pat: p.id, reason: r[0], dx: r[1], kind: p.visits.length && chance(0.6) ? "follow" : "new", pri: p.age >= 65 ? "elderly" : "normal", at: Math.max(d.from - 1200, c - randi(4, 26) * 60), called: c, done: last ? null : Math.round(c + d.consult * 60 * rand(0.75, 1.25)), status: last ? "room" : "done" });
    });
    for (let k = 0; k < waitN[did]; k++) {
      const p = take(want[did]);
      const r = pick(REASONS[KIND_OF[did]]);
      list.push({ id: "t" + uid(), pre: d.pre, no: list.length + 1, doc: did, pat: p.id, reason: r[0], dx: r[1], kind: p.visits.length && chance(0.5) ? "follow" : "new", pri: p.age >= 65 ? "elderly" : "normal", at: now - (waitN[did] - k) * randi(240, 420) - randi(0, 59), called: null, done: null, status: "wait" });
    }
    S.seq.tok[d.pre] = list.length;
    S.board[did] = list.find((x) => x.status === "room");
    S.toks.push(...list);
  });
  /* one urgent walk-in waiting for the general physician */
  const urg = S.toks.find((x) => x.doc === "d1" && x.status === "wait" && x.pri === "normal");
  if (urg) { urg.pri = "urgent"; urg.reason = "High fever and vomiting"; }
  S.board = Object.fromEntries(Object.entries(S.board).map(([k, v]) => [k, v ? v.id : null]));
  S.last = S.board.d1;

  /* bills: the fee is taken when the token is issued */
  S.toks.slice().sort((a, b) => a.at - b.at).forEach((t, i) => {
    const d = S.docs.find((x) => x.id === t.doc);
    const m = payWay(S, t.pat);
    const late = t.status === "wait" && i % 5 === 0;
    t.bill = newBill(S, t.pat, t.at + 40, [{ t: "consult", label: "Consultation · " + d.name, amt: t.kind === "follow" ? d.ffee : d.fee }], late ? "cash" : m, late ? "unpaid" : statusFor(m)).id;
  });
  /* prescriptions and lab orders from finished visits */
  S.toks.filter((t) => t.status === "done").forEach((t, i) => {
    const kind = KIND_OF[t.doc];
    if (chance(0.62)) {
      const items = [];
      const opts = RX_OF[kind].slice();
      for (let k = 0, n = randi(1, 3); k < n && opts.length; k++) { const o = opts.splice(randi(0, opts.length - 1), 1)[0]; items.push({ m: "m" + (o[0] + 1), q: o[1], dose: o[2] }); }
      const fresh = t.done > now - 1500;
      const rx = { id: "r" + uid(), tok: t.id, pat: t.pat, doc: t.doc, at: t.done + 60, items, status: fresh ? "wait" : "done" };
      if (!fresh) {
        const m = payWay(S, t.pat) === "panel" ? "cash" : payWay(S, t.pat);
        rx.bill = newBill(S, t.pat, t.done + randi(180, 600), items.map((it) => { const md = S.meds.find((x) => x.id === it.m); return { t: "rx", label: md.name + " " + md.str + " × " + it.q, amt: md.price * it.q }; }), m, "paid").id;
      }
      S.rx.push(rx);
    }
    if (chance(0.27) || (t.doc === "d4" && chance(0.5))) {
      const tid = pick(TESTS_OF[kind]);
      const T = TESTS.find((x) => x.id === tid);
      const age = now - t.done;
      const stage = age > T.tat * 1800 ? 3 : age > 2400 ? 2 : age > 900 ? 1 : 0;
      const lab = { id: "l" + uid(), no: ++S.seq.lab, pat: t.pat, doc: t.doc, test: tid, at: t.done + 120, stageAt: Math.min(now - 60, t.done + 120 + stage * 900), stage, res: null, sent: false };
      if (stage === 3) lab.res = fakeResult(T);
      const m = payWay(S, t.pat);
      lab.bill = newBill(S, t.pat, lab.at, [{ t: "lab", label: T.name, amt: T.price }], m, statusFor(m)).id;
      S.labs.push(lab);
    }
  });
  /* a few walk-in counter sales (no consultation) */
  for (let k = 0; k < 6; k++) {
    const md = S.meds[pick([0, 8, 9, 11, 18, 21, 29])];
    const q = md.form === "Tablet" ? randi(6, 20) : randi(1, 2);
    newBill(S, null, HM(9, 10) + k * 1500 + randi(0, 600), [{ t: "rx", label: md.name + " " + md.str + " × " + q, amt: md.price * q }], chance(0.8) ? "cash" : "card", "paid", { walkin: "Counter sale" });
  }
  /* one refund and older panel claims already submitted */
  const rf = S.bills.find((b) => b.method === "cash" && b.lines[0].t === "rx");
  if (rf) { rf.status = "refund"; rf.note = "Medicine returned unopened"; }
  S.bills.filter((b) => b.method === "panel").slice(0, 3).forEach((b) => (b.claim = "submitted"));

  /* appointments: some came in today and got tokens, the rest are later or on other days */
  const toAppt = (t, status) => S.appts.push({ id: "a" + uid(), pat: t.pat, doc: t.doc, date: TODAY_ISO, time: Math.max(S.docs.find((d) => d.id === t.doc).from, Math.round(t.at / 900) * 900), kind: t.kind, status, tok: t.id, note: "", src: chance(0.5) ? "Phone" : "Online" });
  ["d1", "d2", "d3", "d4"].forEach((did) => {
    const mine = S.toks.filter((t) => t.doc === did);
    mine.filter((t) => t.status === "done").filter((_, i) => i % 3 === 1).forEach((t) => toAppt(t, "done"));
    const w = mine.find((t) => t.status === "wait");
    if (w) toAppt(w, "checked");
  });
  const later = (did, n, from) => {
    const d = S.docs.find((x) => x.id === did);
    const slots = [];
    for (let t = Math.max(d.from, from); t < d.to - 600; t += 900) slots.push(t);
    for (let k = 0; k < n && slots.length; k++) {
      const t = slots.splice(randi(0, Math.min(slots.length - 1, 6)), 1)[0];
      const p = take(want[did] || ((x) => !x.kid));
      S.appts.push({ id: "a" + uid(), pat: p.id, doc: did, date: TODAY_ISO, time: t, kind: p.visits.length ? "follow" : "new", status: "booked", tok: null, note: "", src: chance(0.55) ? "Online" : "Phone" });
    }
  };
  later("d1", 3, now + 900); later("d2", 4, now + 600); later("d3", 3, now + 1200); later("d4", 3, now + 900);
  later("d5", 6, HM(17)); later("d6", 5, HM(17));
  /* two no-shows this morning */
  ["d2", "d4"].forEach((did, i) => { const p = S.pats[40 + i * 7]; S.appts.push({ id: "a" + uid(), pat: p.id, doc: did, date: TODAY_ISO, time: HM(10, 15 + i * 30), kind: "follow", status: "noshow", tok: null, note: "Did not answer the reminder call", src: "Phone" }); });
  /* next six days */
  for (let dd = 1; dd <= 6; dd++) {
    const date = addDays(TODAY, dd);
    S.docs.forEach((d) => {
      if (!S.roster[d.id][date.getDay()]) return;
      const n = randi(1, 4);
      for (let k = 0; k < n; k++) {
        const p = S.pats[randi(0, S.pats.length - 1)];
        S.appts.push({ id: "a" + uid(), pat: p.id, doc: d.id, date: iso(date), time: d.from + randi(0, 14) * 900, kind: "follow", status: "booked", tok: null, note: "", src: chance(0.5) ? "Online" : "Phone" });
      }
    });
  }
  /* online booking requests waiting for the front desk */
  [["d2", 1, HM(12, 30), "Fever since last night, 4 year old"], ["d4", 1, HM(10), "Sugar report review"], ["d6", 0, HM(18, 15), "Rash on both arms"]].forEach(([did, dd, t, note], i) => {
    const p = S.pats[60 + i * 5];
    S.reqs.push({ id: "q" + uid(), pat: p.id, doc: did, date: iso(addDays(TODAY, dd)), time: t, note, at: now - randi(5, 90) * 60 });
  });

  /* live feed: the last things that happened */
  const ev = [];
  S.toks.forEach((t) => {
    const p = patOf(t.pat, S), d = S.docs.find((x) => x.id === t.doc);
    if (t.called && t.called > now - 2400) ev.push({ at: t.called, k: "call", text: `<b>${code(t)}</b> called to Room ${d.room} · ${esc(p.name)}` });
    if (t.done && t.done > now - 2400) ev.push({ at: t.done, k: "done", text: `${esc(d.name)} finished with <b>${code(t)}</b> (${mins(t.done - t.called)} min)` });
  });
  S.labs.filter((l) => l.stage === 3).slice(-2).forEach((l) => ev.push({ at: l.stageAt, k: "lab", text: `${TESTS.find((x) => x.id === l.test).short} report ready for ${esc(patOf(l.pat, S).name)}` }));
  S.feed = ev.sort((a, b) => b.at - a.at).slice(0, 12).map((e) => ({ id: uid(), ...e }));
  /* alerts */
  S.notes = [
    { id: uid(), k: "alert", icon: "box", text: "Ciprofloxacin 500 mg is out of stock", sub: "Reorder from the supplier", at: now - 3600, read: false },
    { id: uid(), k: "alert", icon: "pill", text: "Amoxicillin 500 mg is low: 96 left", sub: "Reorder level is 200", at: now - 2900, read: false },
    { id: uid(), k: "", icon: "flask", text: "Lab reports are ready to hand over", sub: "See the Ready column", at: now - 1500, read: false },
    { id: uid(), k: "", icon: "shield", text: "Meridian Health Cover approved 6 claims", sub: "Rs 14,500 will be paid on Friday", at: now - 7200, read: true },
  ];
  return S;
}
/* Lab results: mostly normal, sometimes a little high or low */
function fakeResult(T) {
  const r = {};
  T.p.forEach(([n, u, lo, hi]) => {
    const span = hi - lo || hi || 1;
    let v = lo + span * rand(0.15, 0.85);
    if (chance(0.25)) v = hi + span * rand(0.05, 0.35);
    r[n] = +v.toFixed(hi < 10 ? 1 : 0);
  });
  return r;
}

/* ---------- Look-ups and derived numbers ---------- */
let S = null;
let saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(() => store.set(KEY, S), 250); }
function patOf(id, st = S) { return st.pats.find((p) => p.id === id) || { id, name: "Walk-in customer", age: "", sex: "", mr: "", visits: [], cond: [], allergies: [], vit: { sys: [], dia: [], wt: [] }, panel: null, phone: "" }; }
const docOf = (id) => S.docs.find((d) => d.id === id) || S.docs[0];
const medOf = (id) => S.meds.find((m) => m.id === id);
const testOf = (id) => TESTS.find((t) => t.id === id) || TESTS[0];
const panelOf = (id) => S.panels.find((p) => p.id === id);
const billOf = (id) => S.bills.find((b) => b.id === id);

const code = (t) => t.pre + "-" + String(t.no).padStart(3, "0");
