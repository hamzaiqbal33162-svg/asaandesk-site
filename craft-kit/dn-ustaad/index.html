<!doctype html>
<!-- Chill & Craft · Ustaad · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ustaad · Tuition academy desk</title>
<style>
/* ===== Shared base: reset, overlays, forms, tables, charts (themed by the variables below) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* page entrance: each app picks --enter-anim */
.enter{animation:var(--enter-anim,rise) .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
@keyframes flipin{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px)}}
@keyframes blurin{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.row-in{animation:fadein .4s ease both;animation-delay:calc(var(--i,0) * 28ms)}

/* buttons press in */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm,10px);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;background:var(--surface2);color:var(--text);transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface);color:var(--text);position:relative;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;animation:pop .35s}

/* chips and segmented control */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent,#fff)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .4s cubic-bezier(.3,1.3,.5,1),width .4s}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:800;background:hsl(var(--h) 60% 86%);color:hsl(var(--h) 50% 28%)}
[data-theme="dark"] .av{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 82%)}

/* tooltip, toasts, popovers */
#tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tip-bg,#111827);color:var(--tip-ink,#f9fafb);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:240px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
#toasts{position:fixed;z-index:130;right:16px;bottom:16px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--tip-bg,#111827);color:var(--tip-ink,#fff);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:toastin .45s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{color:var(--good)}
.toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--warn)}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.pop{position:fixed;z-index:110;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm,12px);box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;animation:pop .2s ease-out}
.pop [role="menuitem"]{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pop [role="menuitem"]:hover,.pop [role="menuitem"]:focus{background:var(--surface2);outline:none}
.pop-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{display:grid;gap:2px;padding:9px 10px 9px 22px;border-radius:8px;text-decoration:none;position:relative}
.note:hover{background:var(--surface2)}
.note.unread::before{content:"";position:absolute;left:9px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}

/* modal and drawer */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,12,20,.48);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.backdrop.side{place-items:stretch end;padding:0}
.modal{background:var(--surface);color:var(--text);border-radius:var(--r,16px);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:modalin .38s cubic-bezier(.2,1.1,.3,1)}
.modal.wide{max-width:760px}
.modal.drawer{max-width:min(500px,100vw);height:100%;max-height:none;border-radius:var(--r,16px) 0 0 var(--r,16px);animation:drawerin .4s cubic-bezier(.2,.9,.2,1)}
.backdrop.out{animation:fadein .22s reverse forwards}
.backdrop.out .modal{animation:modalin .22s reverse forwards}
.backdrop.out .drawer{animation:drawerin .25s reverse forwards}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes drawerin{from{transform:translateX(100%)}}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px}
.m-x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.m-body{padding:18px}
.m-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 18px;background:var(--surface);border-top:1px solid var(--line)}

/* forms with inline errors */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;min-width:0;padding:10px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line);background:var(--surface2);color:var(--text);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);animation:shake .35s}
.field .hint{color:var(--muted);font-size:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

/* data tables */
.tbl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-search input{width:min(260px,100%);padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tbl-search{flex:1 1 180px;max-width:280px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .15s}
.tbl tr.click:hover,.tbl tr.click:focus{background:var(--surface2);outline:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.sort-ic{width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.3;transition:transform .2s}
th[aria-sort] .sort-ic{opacity:1}
th[aria-sort="ascending"] .sort-ic{transform:rotate(180deg) translateY(4px)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.pager button[disabled]{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.6,.1,.2,1) forwards}
.chart .fade{animation:fadein 1s .35s both}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hover{transition:opacity .15s;pointer-events:none}
.chart .hover circle{stroke:var(--surface);stroke-width:2.5}
.chart .grow{animation:grow .75s cubic-bezier(.2,.9,.3,1.15) both}
.chart .bcol{transition:opacity .2s}
.chart.hovering .bcol{opacity:.45}
.chart.hovering .bcol.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i,.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.donut{position:relative;flex:none}
.donut svg{overflow:visible}
.donut .seg-c{fill:none;transition:stroke-width .2s}
.donut .seg-c:hover{stroke-width:calc(var(--sw) * 1.25)}
.donut .sweep{animation:sweep .9s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 var(--C)}}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;flex:1 1 140px;min-width:0}
.lg li{display:flex;align-items:center;gap:4px}
.lg b{margin-left:auto;padding-left:10px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.hb-f{display:block;height:100%;border-radius:999px;transform-origin:left}
.hb-f.growx{animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.ring-v{animation:ringin 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringin{from{stroke-dasharray:0 1}}
.gauge .g-v{animation:ringin 1.3s cubic-bezier(.3,.9,.3,1) both}
.hm{display:grid;gap:3px}
.hm-c{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0;animation:pop .4s both}
.spark{height:38px}

/* drag and drop */
.dragging{opacity:.35}
.ghost{position:fixed;z-index:140;pointer-events:none;margin:0;box-shadow:0 22px 50px rgba(0,0,0,.3);opacity:.95;transition:none!important;animation:none!important}
.drop-hot{outline:2px dashed var(--accent);outline-offset:3px}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* command search */
.cmdk .m-body{padding:12px}
.cmdk-in{width:100%;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.cmdk-list{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto}
.cmdk-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk-list li[aria-selected="true"]{background:var(--accent);color:var(--on-accent,#fff)}
.cmdk-list li small{opacity:.7}
.cmdk-k{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* mobile nav drawer (sidebar apps) */
.scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.menu-btn{display:none!important}
@media (max-width:860px){
  .menu-btn{display:inline-grid!important}
  .side{position:fixed!important;z-index:60;top:0;bottom:0;left:0;width:min(280px,84vw)!important;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* theme switch reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,0))}}

/* print only the chosen area */
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important}body.printing #print-root{display:block}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Ustaad look: frosted glass over an indigo, lime and pink mesh; icon rail ===== */
:root{--font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;--bg:#eceefb;--surface:rgba(255,255,255,.66);--surface-solid:#fbfbff;--surface2:rgba(91,76,240,.08);--text:#17153a;--muted:#5d5c85;--line:rgba(23,21,58,.11);--accent:#5b4cf0;--on-accent:#fff;--lime:#a8d916;--pink:#ff5fa2;--good:#14a06a;--warn:#d98a00;--bad:#e5484d;--c1:#5b4cf0;--c2:#86b80f;--c3:#ff5fa2;--c4:#1ea7e4;--c5:#ff9b3d;--r:22px;--r-sm:12px;--tip-bg:#17153a;--enter-anim:blurin;--b1:#7c6cff;--b2:#c6f432;--b3:#ff7ab6}
[data-theme="dark"]{--bg:#0b0a22;--surface:rgba(30,28,74,.55);--surface-solid:#1a1844;--surface2:rgba(198,244,50,.07);--text:#eeedff;--muted:#a4a3d2;--line:rgba(255,255,255,.1);--accent:#c6f432;--on-accent:#14122e;--good:#4ade9a;--warn:#ffc04d;--bad:#ff6b6f;--c1:#8f84ff;--c2:#c6f432;--c3:#ff6fb0;--c4:#4cc4ff;--c5:#ffad5c;--tip-bg:#000;--b1:#3b2fd6;--b2:#5d7a0a;--b3:#8a1f57}
body{background:var(--bg)}
.modal,.pop{background:var(--surface-solid)}
.m-head,.m-foot{background:var(--surface-solid)}
/* drawn mesh backdrop for the glass */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 24s ease-in-out infinite alternate}
.mesh i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--b1)}
.mesh i:nth-child(2){width:34vw;height:34vw;right:-6vw;top:20vh;background:var(--b2);animation-delay:-8s}
.mesh i:nth-child(3){width:38vw;height:38vw;left:30vw;bottom:-18vw;background:var(--b3);animation-delay:-16s}
@keyframes drift{to{transform:translate(4vw,3vh) scale(1.08)}}
.glass{background:var(--surface);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 40px -18px rgba(40,30,120,.45)}
[data-theme="dark"] .glass{border-color:rgba(255,255,255,.09)}
.shell{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100vh;overflow-x:clip}
/* icon rail */
.side{position:sticky;top:0;height:100vh;padding:14px 10px;display:flex;flex-direction:column;align-items:stretch;gap:16px;border-radius:0 26px 26px 0;border-left:0}
.brand{display:grid;justify-items:center;gap:4px;text-decoration:none;color:inherit;font-weight:900;font-size:13px;letter-spacing:.02em}
.nav{position:relative;display:grid;gap:4px}
.nav a{position:relative;z-index:1;display:grid;justify-items:center;gap:3px;padding:9px 4px;border-radius:16px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;text-align:center;transition:color .25s,transform .2s}
.nav a:hover{color:var(--text);transform:translateY(-1px)}
.nav a[aria-current="page"]{color:var(--on-accent)}
.nav-marker{position:absolute;left:0;right:0;top:0;border-radius:16px;background:var(--accent);box-shadow:0 8px 24px -6px var(--accent);transition:transform .55s cubic-bezier(.3,1.4,.4,1),height .3s;z-index:0}
.nav-marker::before{content:"";position:absolute;left:-10px;top:30%;bottom:30%;width:4px;border-radius:4px;background:var(--lime)}
.rail-foot{margin-top:auto;display:grid;justify-items:center;gap:8px}
@media (max-width:860px){.side{width:min(260px,84vw)!important;border-radius:0}.nav a{grid-template-columns:auto 1fr;justify-items:start;font-size:14px;padding:12px}.brand{grid-auto-flow:column;justify-content:start}}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:16px 26px 6px}
.top-t{flex:1;min-width:0}
.top-t h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:0;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border-radius:14px;background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.search-btn{display:flex;align-items:center;gap:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:9px 14px;color:var(--muted);min-width:200px}
.search-btn kbd{margin-left:auto;font:inherit;font-size:11px;opacity:.7}
#view{padding:14px 26px 30px;flex:1}
.card{border-radius:var(--r);padding:20px;min-width:0;transition:transform .3s cubic-bezier(.3,1.3,.5,1),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 50px -22px rgba(40,30,120,.55)}
.btn{border-radius:12px}
.btn.primary{box-shadow:0 8px 20px -8px var(--accent)}
.btn.lime{background:var(--lime);color:#14122e}
.btn.wa{background:#1f9d55;color:#fff}
.chip{background:var(--surface)}
.h2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.h2 h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.7fr 1fr}
.g2{grid-template-columns:1fr 1fr}
.mt{margin-top:18px}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.kpi .k-i{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--surface2);color:var(--accent)}
.kpi .k-v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
/* live day timeline (signature) */
.hero{display:grid;gap:14px}
.hero h2{margin:0;font-size:22px;letter-spacing:-.02em}
.tl{position:relative;padding:6px 0 0 70px}
.tl-hours{position:relative;height:18px;margin-bottom:6px}
.tl-hours span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:700}
.lane{position:relative;height:38px;margin-bottom:6px;border-radius:12px;background:var(--surface2)}
.lane-l{position:absolute;left:-70px;top:0;bottom:0;width:62px;display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.sess{position:absolute;top:3px;bottom:3px;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;border:0;animation:grow .7s cubic-bezier(.3,1.3,.5,1) both;transform-origin:left;text-align:left}
.sess.done{opacity:.55}
.sess.live{box-shadow:0 0 0 3px var(--lime),0 8px 22px -6px var(--accent)}
.needle{position:absolute;top:0;bottom:-4px;width:2px;background:var(--pink);border-radius:2px;transition:left 1s linear;z-index:3}
.needle::before{content:attr(data-t);position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:8px;white-space:nowrap}
.needle::after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 var(--pink);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
@keyframes grow{from{transform:scaleX(0)}}
/* batches */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.bat{display:grid;gap:10px;position:relative;overflow:hidden}
.bat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--bc);opacity:.18}
.bat h3{margin:0;font-size:18px;letter-spacing:-.02em}
.bat .meta{display:flex;flex-wrap:wrap;gap:6px}
.bat .row{display:flex;align-items:center;gap:12px}
.cap{position:relative;flex:none}
.cap b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700}
/* tests */
.marks td input{width:76px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);text-align:right;font-variant-numeric:tabular-nums}
.marks td input[aria-invalid="true"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface-solid))}
.rank{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--surface2);font-weight:800;font-size:13px}
.rank.r1{background:#ffd34d;color:#3b2a00}.rank.r2{background:#d9dde8;color:#2a2f3d}.rank.r3{background:#f0b07a;color:#3d1f05}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:210px;padding-top:10px}
.pod{display:grid;justify-items:center;gap:6px;width:31%;max-width:120px}
.pod .av{width:44px;height:44px;font-size:15px;box-shadow:0 0 0 3px var(--surface-solid)}
.pod b{font-size:12.5px;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font-weight:900;font-size:24px;color:#fff;transform-origin:bottom;animation:rise .9s cubic-bezier(.3,1.4,.5,1) both}
.pod:nth-child(1) .blk{height:90px;background:linear-gradient(#c9ccd8,#9aa0b5);animation-delay:.25s}
.pod:nth-child(2) .blk{height:126px;background:linear-gradient(#ffd34d,#f0a500)}
.pod:nth-child(3) .blk{height:66px;background:linear-gradient(#f0b07a,#c9773a);animation-delay:.45s}
@keyframes rise{from{transform:scaleY(0)}}
.medal{animation:pop .5s .9s cubic-bezier(.3,1.6,.5,1) both}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rk li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--surface2);font-size:13.5px}
.rk li .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800;font-variant-numeric:tabular-nums}
/* timetable */
.tt-wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:62px repeat(6,minmax(118px,1fr));gap:6px;min-width:780px}
.tt .hd{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:4px}
.tt .tm{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.cell{min-height:74px;border-radius:14px;background:var(--surface2);padding:4px;display:grid;gap:4px;align-content:start;transition:background .2s,outline-color .2s}
.blk2{position:relative;display:grid;gap:1px;padding:6px 26px 6px 8px;border-radius:10px;color:#fff;font-size:11.5px;line-height:1.25;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .15s,opacity .2s;animation:pop .35s both}
.blk2:hover{transform:translateY(-2px)}
.blk2 b{font-size:12px}
.blk2 .mv{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;border:0;background:rgba(255,255,255,.25);color:#fff;display:grid;place-items:center;padding:0;touch-action:none}
.blk2.dim{opacity:.22}
.blk2.clash{box-shadow:0 0 0 2px var(--bad)}
.legend-t{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pname{display:flex;align-items:center;gap:10px}
.tbl td,.tbl th{border-color:var(--line)}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.top{padding:12px 14px 4px}#view{padding:10px 14px 24px}.search-btn{min-width:0}.search-btn span,.search-btn kbd{display:none}.g2{grid-template-columns:1fr}.tl{padding-left:56px}.lane-l{left:-56px;width:50px;font-size:11px}}
@media (max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:12px}.kpi .k-v{font-size:22px}.top-t h1{font-size:21px}.top-t p{display:none}.card{padding:16px;border-radius:18px}.sess{font-size:10.5px;padding:0 6px}}
</style>
</head>

  const wks=[...new Set([...S.tests.filter(t=>t.bid===TB).map(t=>t.wk),iso(thisMon)])].sort();if(!wks.includes(TW))TW=wks[wks.length-1];
  let t=S.tests.find(x=>x.bid===TB&&x.wk===TW);const ks=kidsOf(TB);
  el.innerHTML=`<section class="card glass"><div class="h2"><div style="display:flex;gap:10px;flex-wrap:wrap"><label><span class="sr">Batch</span><select class="inp" id="tB">${S.batches.map(x=>`<option value="${x.id}" ${x.id===TB?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label><span class="sr">Week</span><select class="inp" id="tW">${wks.map(w=>`<option value="${w}" ${w===TW?'selected':''}>Week of ${dd(w)}</option>`).join('')}</select></label></div>${t?`<span class="pill">${esc(t.topic)} · out of ${t.total}</span>`:`<button class="btn primary" id="newT">${ic('plus',16)}Start this week's test</button>`}</div>
  ${t?`<div class="grid g21"><div class="tbl-wrap"><table class="tbl marks"><thead><tr><th>Student</th><th class="num">Marks</th><th class="num">%</th><th class="num">Rank</th></tr></thead><tbody id="mB">${ks.map(s=>`<tr data-sid="${s.id}"><td><span class="pname">${av(s.name)}${esc(s.name)}</span></td><td class="num"><label class="sr" for="mk_${s.id}">Marks for ${esc(s.name)}</label><input id="mk_${s.id}" type="number" min="0" max="${t.total}" inputmode="numeric" value="${t.marks[s.id]??''}" placeholder="absent"></td><td class="num" data-p></td><td class="num" data-r></td></tr>`).join('')}</tbody></table></div>
  <div><div class="grid g2" style="gap:10px"><div class="card glass" style="padding:14px"><div class="muted" style="font-size:12px">CLASS AVERAGE</div><b style="font-size:26px" id="tAvg" aria-live="polite">-</b></div><div class="card glass" style="padding:14px"><div class="muted" style="font-size:12px">HIGHEST · PASS RATE</div><b style="font-size:20px" id="tHi">-</b></div></div><div class="podium" id="pod" aria-label="Top three"></div></div></div>`:'<p class="empty">No test recorded for this week yet.</p>'}</section>
  <div class="grid g2 mt"><section class="card glass"><div class="h2"><h2>${esc(b.name)} average by week</h2></div><div class="chart" id="tL"></div></section><section class="card glass"><div class="h2"><h2>Grade spread this week</h2></div><div class="chart" id="tG"></div></section></div>`;
  $('#tB',el).addEventListener('change',e=>{TB=e.target.value;TW='';refresh()});$('#tW',el).addEventListener('change',e=>{TW=e.target.value;refresh()});
  const nt=$('#newT',el);if(nt)nt.addEventListener('click',()=>{const T=TC(b.tid),F=[{k:'topic',label:'Topic',req:true,val:(TOPICS[T&&T.subject]||['Revision'])[0]},{k:'total',label:'Total marks',type:'number',req:true,min:5,max:200,val:25}];modal({title:'New weekly test · '+esc(b.name),body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Create test',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;S.tests.push({id:uid('x'),bid:TB,wk:TW,total:v.total,topic:v.topic,marks:{}});save();refresh();toast('Test created. Type the marks in.')}}]})});
  const charts=()=>{const ts=S.tests.filter(x=>x.bid===TB).sort((a,c)=>a.wk.localeCompare(c.wk));lineChart($('#tL',el),{labels:ts.map(x=>dd(x.wk)),series:[{name:'Average',data:ts.map(x=>r1(avgOf(x))),color:b.color}],fmt:v=>Math.round(v)+'%',max:100,h:210});
    const G=[['A+',90],['A',80],['B',70],['C',60],['D',50],['F',0]],cn=G.map(()=>0);if(t)Object.values(t.marks).forEach(v=>{if(v==null)return;const p=v/t.total*100;cn[G.findIndex(g=>p>=g[1])]++});barChart($('#tG',el),{labels:G.map(g=>g[0]),series:[{name:'Students',data:cn,color:'var(--c1)'}],fmt:num,h:210,padL:34})};
  if(!t){charts();return}
  const upd=(flip)=>{const rl=rankList(t),rm=Object.fromEntries(rl.map(x=>[x.sid,x.rank])),vals=rl.map(x=>x.v);
    $$('#mB tr',el).forEach(tr=>{const sid=tr.dataset.sid,v=t.marks[sid];$('[data-p]',tr).textContent=v==null?'-':Math.round(v/t.total*100)+'%';const r=rm[sid];$('[data-r]',tr).innerHTML=r?`<span class="rank ${r<=3?'r'+r:''}">${r}</span>`:'-'});
    $('#tAvg',el).textContent=vals.length?pct(sum(vals)/vals.length/t.total*100,1):'-';$('#tHi',el).textContent=vals.length?vals[0]+'/'+t.total+' · '+Math.round(vals.filter(v=>v/t.total>=.5).length/vals.length*100)+'%':'-';
    const top=rl.slice(0,3),order=[top[1],top[0],top[2]];const key=top.map(x=>x.sid+x.v).join();const pod=$('#pod',el);if(pod.dataset.k===key&&!flip)return;pod.dataset.k=key;
    pod.innerHTML=order.map((x,i)=>{if(!x)return '<div class="pod"></div>';const s=SD(x.sid);return `<div class="pod">${av(s?s.name:'?')}<b>${esc(s?s.name.split(' ')[0]:'')}</b><span class="muted" style="font-size:12px">${x.v}/${t.total}</span><div class="blk"><span class="medal">${[2,1,3][i]}</span></div></div>`}).join('')};
  upd(true);charts();
  let tm;$('#mB',el).addEventListener('input',e=>{const inp=e.target;if(inp.tagName!=='INPUT')return;const sid=inp.closest('tr').dataset.sid,raw=inp.value.trim();const n=+raw;if(raw!==''&&(isNaN(n)||n<0||n>t.total)){inp.setAttribute('aria-invalid','true');inp.title='Between 0 and '+t.total;return}inp.setAttribute('aria-invalid','false');if(raw==='')t.marks[sid]=null;else t.marks[sid]=n;save();upd(false);clearTimeout(tm);tm=setTimeout(()=>charts(),600)})}

/* fees */
let FM=MONTH;
function pgFees(el){const ms=Object.keys(S.fees).sort();if(!S.fees[FM])FM=ms[ms.length-1];head('Fees','Monthly fee status with reminders to parents');const L=S.students.filter(s=>feeSt(s,FM)!=='New'),paid=L.filter(s=>feeSt(s,FM)==='Paid');
  el.innerHTML=`<div class="h2">${segHTML('fm',ms.map(m=>[m,mlabel(m)]),FM,'Month')}<span class="muted" style="font-size:13px">Due by the ${S.cfg.dueDay}th of each month</span></div>
  <div class="grid g4">${[['Expected',sum(L,feeOf),L.length+' students'],['Collected',sum(paid,feeOf),paid.length+' paid'],['Pending',sum(L.filter(s=>feeSt(s,FM)!=='Paid'),feeOf),L.length-paid.length+' students'],['Collection rate',L.length?paid.length/L.length*100:0,'of students paid']].map((k,i)=>`<article class="card glass kpi"><div class="k-l">${k[0]}</div><div class="k-v">${cnt(k[1],i===3?'pct':'rsk','f'+i+FM)}</div><div class="k-s">${k[2]}</div></article>`).join('')}</div>
  <div class="grid g21 mt"><section class="card glass"><div id="fT"></div></section><section class="card glass"><div class="h2"><h2>Last 6 months</h2></div><div class="chart" id="fC"></div></section></div>`;
  bindSeg(el,'fm',v=>{FM=v;refresh()});
  table($('#fT',el),{id:'fee'+FM,search:'Search student',chips:['All','Paid','Due','Late'],chipFn:(s,c)=>feeSt(s,FM)===c,rows:()=>L,pageSize:9,sortCol:3,cols:[{label:'Student',k:'name',f:s=>`<b>${esc(s.name)}</b><br><small class="muted">${s.bids.length} batch${s.bids.length>1?'es':''} · ${esc(s.grade)}</small>`},{label:'Fee',num:true,v:feeOf,f:s=>rs(feeOf(s))},{label:'Paid on',v:s=>((S.fees[FM]||{})[s.id]||{}).date||'',f:s=>{const f=(S.fees[FM]||{})[s.id];return f?dd(f.date)+' <small class="muted">'+esc(f.method)+'</small>':'-'}},{label:'Status',v:s=>({Late:0,Due:1,Paid:2})[feeSt(s,FM)],f:s=>ftag(feeSt(s,FM))},{label:'',nosort:true,f:s=>feeSt(s,FM)==='Paid'?`<button class="btn sm ghost" data-undo="${s.id}">Undo</button>`:`<span style="display:inline-flex;gap:6px">${waA(s,FM)}<button class="btn sm primary" data-col="${s.id}">Collect</button></span>`}],onRow:id=>openStudent(id)});
  const six=ms.slice(-6);barChart($('#fC',el),{labels:six.map(mlabel),series:[{name:'Collected',data:six.map(m=>sum(S.students.filter(s=>feeSt(s,m)==='Paid'),feeOf)),color:'var(--c2)'},{name:'Pending',data:six.map(m=>sum(S.students.filter(s=>['Due','Late'].includes(feeSt(s,m))),feeOf)),color:'var(--c3)'}],stacked:true,fmt:rsk,tfmt:rs,h:260});
  el.addEventListener('click',e=>{const c=e.target.closest('[data-col]'),u=e.target.closest('[data-undo]');
    if(c){const s=SD(c.dataset.col),F=[{k:'method',label:'Paid by',type:'select',opts:['Cash','Bank transfer','Mobile wallet']},{k:'amt',label:'Amount (Rs)',type:'money',req:true,min:feeOf(s),max:feeOf(s)*2,val:feeOf(s)}];modal({title:'Collect fee · '+esc(s.name),body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Save',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;(S.fees[FM]||(S.fees[FM]={}))[s.id]={date:today,method:v.method};save();refresh();toast(rs(v.amt)+' collected from '+s.name);confetti(innerWidth/2,innerHeight/2,50)}}]})}
    if(u){const s=SD(u.dataset.undo);confirmBox(`Mark ${esc(s.name)}'s ${mlabel(FM)} fee as unpaid?`,()=>{delete S.fees[FM][s.id];save();refresh();toast('Fee marked unpaid')},'Mark unpaid')}})}

/* timetable with drag and drop, clash checks, keyboard move */
let TF='';
function moveSess(id,day,slot){const s=S.sessions.find(x=>x.id===id),b=s&&BT(s.bid);if(!s)return;if(s.day===day&&s.slot===slot)return;
  const here=S.sessions.filter(x=>x!==s&&x.day===day&&x.slot===slot),tclash=here.find(x=>BT(x.bid).tid===b.tid);
  if(tclash){toast(TC(b.tid).name+' already teaches '+BT(tclash.bid).name+' then','bad');return}
  let room=s.room;if(here.some(x=>x.room===room)){room=ROOMS.find(r=>!here.some(x=>x.room===r));if(!room){toast('All rooms are busy at '+DAYS[day]+' '+slotLabel(slot),'bad');return}}
  s.day=day;s.slot=slot;s.room=room;save();refresh();toast(b.name+' moved to '+DAYS[day]+' '+slotLabel(slot)+' · '+room)}
function pgTimetable(el){head('Timetable','Drag a class to another slot, or use its move button');const hrs={};S.sessions.forEach(s=>{const t=BT(s.bid).tid;hrs[t]=(hrs[t]||0)+1});
  el.innerHTML=`<section class="card glass"><div class="h2"><div class="legend-t" role="group" aria-label="Highlight a teacher"><button class="chip" data-tf="" aria-pressed="${!TF}">All teachers</button>${S.teachers.map(t=>`<button class="chip" data-tf="${t.id}" aria-pressed="${TF===t.id}">${esc(t.name.replace(/^(Sir|Miss) /,''))} · ${hrs[t.id]||0}h</button>`).join('')}</div></div>
  <div class="tt-wrap"><div class="tt" id="tt"><span></span>${DAYS.map((d,i)=>`<span class="hd">${d}${TODAY.getDay()-1===i?' · today':''}</span>`).join('')}${SLOTS.map((sl,si)=>`<span class="tm">${sl}</span>`+DAYS.map((d,di)=>`<div class="cell" data-zone="${di}-${si}" aria-label="${d} ${slotLabel(si)}">${S.sessions.filter(s=>s.day===di&&s.slot===si).map((s,k)=>{const b=BT(s.bid),t=TC(b.tid);return `<div class="blk2 ${TF&&b.tid!==TF?'dim':''}" data-id="${s.id}" style="background:${b.color};animation-delay:${(di*6+si)*12}ms"><b>${esc(b.name)}</b><span>${esc(t?t.name.replace(/^(Sir|Miss) /,''):'')} · ${esc(s.room)}</span><button class="mv" data-mv="${s.id}" aria-label="Move ${esc(b.name)} on ${d}">${ic('grid',12)}</button></div>`}).join('')}</div>`).join('')).join('')}</div></div><p class="muted" style="font-size:12.5px;margin:10px 0 0">A class cannot go where its teacher is already teaching; the room changes by itself if needed.</p></section>
  <div class="grid g2 mt"><section class="card glass"><div class="h2"><h2>Teacher load (hours a week)</h2></div><div id="tH"></div></section><section class="card glass"><div class="h2"><h2>Room use</h2></div><div id="tR"></div></section></div>`;
  dnd($('#tt',el),{item:'.blk2',zone:'.cell',handle:'.mv',onDrop:(id,z)=>{const[d,s]=z.split('-').map(Number);moveSess(id,d,s)}});
  el.addEventListener('click',e=>{const f=e.target.closest('[data-tf]');if(f){TF=f.dataset.tf;refresh();return}const mv=e.target.closest('[data-mv]');if(mv){const s=S.sessions.find(x=>x.id===mv.dataset.mv),F=[{k:'day',label:'Day',type:'select',opts:DAYS.map((d,i)=>[i,d]),val:s.day},{k:'slot',label:'Time',type:'select',opts:SLOTS.map((t,i)=>[i,slotLabel(i)]),val:s.slot}];modal({title:'Move '+esc(BT(s.bid).name),body:formHTML(F),actions:[{label:'Cancel',cls:'ghost'},{label:'Move class',cls:'primary',fn:m=>{const v=readForm(m,F);if(!v)return false;moveSess(s.id,+v.day,+v.slot)}}]})}});
  hbars($('#tH',el),{items:S.teachers.map(t=>({label:t.name.replace(/^(Sir|Miss) /,''),value:hrs[t.id]||0,color:'var(--c1)'})),fmt:v=>v+' h'});
  donut($('#tR',el),{items:ROOMS.map((r,i)=>({label:r,value:S.sessions.filter(s=>s.room===r).length,color:['var(--c1)','var(--c3)','var(--c4)','var(--c2)'][i]})),tfmt:v=>v+' classes',sub:'classes a week',size:150})}

/* teachers */
function pgTeachers(el){head('Teachers','Subjects, hours, results and fee share');const shareOf=t=>{const bs=S.batches.filter(b=>b.tid===t.id);return Math.round(sum(S.students.filter(s=>feeSt(s,MONTH)==='Paid'),s=>sum(s.bids.filter(x=>bs.some(b=>b.id===x)),x=>BT(x).fee*(1-(s.disc||0)/100)))*t.share/100)};
  el.innerHTML=`<div class="h2"><span class="muted">Teachers get a share of the fees collected for their batches.</span><button class="btn primary" id="addT">${ic('plus',16)}Add teacher</button></div><div class="bgrid">${S.teachers.map(t=>{const bs=S.batches.filter(b=>b.tid===t.id),h=S.sessions.filter(s=>bs.some(b=>b.id===s.bid)).length,ts=S.tests.filter(x=>bs.some(b=>b.id===x.bid)),avg=ts.length?sum(ts,avgOf)/ts.length:0;return `<article class="card glass bat" style="--bc:var(--c1)"><div class="pname">${av(t.name)}<div><h3>${esc(t.name)}</h3><span class="muted" style="font-size:13px">${esc(t.subject)} · ${esc(t.phone)}</span></div></div><div class="meta">${bs.map(bchip).join('')||'<span class="muted">No batches</span>'}</div><div class="grid g2" style="gap:8px"><div><div class="muted" style="font-size:12px">HOURS / WEEK</div><b style="font-size:20px">${h}</b></div><div><div class="muted" style="font-size:12px">TEST AVERAGE</div><b style="font-size:20px">${ts.length?Math.round(avg)+'%':'-'}</b></div><div><div class="muted" style="font-size:12px">SHARE</div><b style="font-size:20px">${t.share}%</b></div><div><div class="muted" style="font-size:12px">EARNED ${MON[TODAY.getMonth()].toUpperCase()}</div><b style="font-size:20px">${rsk(shareOf(t))}</b></div></div><button class="btn sm ghost" data-te="${t.id}">${ic('edit',14)}Edit</button></article>`}).join('')}</div>`;
  const tF=[{k:'name',label:'Name',req:true,ph:'Miss Amna Khan'},{k:'subject',label:'Subject',type:'select',opts:Object.keys(TOPICS)},{k:'phone',label:'Mobile',type:'tel',req:true},{k:'share',label:'Fee share (%)',type:'number',min:0,max:100,req:true}];
  el.addEventListener('click',e=>{const ed=e.target.closest('[data-te]');const t=ed&&TC(ed.dataset.te);if(ed||e.target.closest('#addT'))modal({title:t?'Edit teacher':'Add teacher',body:formHTML(tF,t||{share:40}),actions:[{label:'Cancel',cls:'ghost'},{label:'Save',cls:'primary',fn:m=>{const v=readForm(m,tF);if(!v)return false;if(t)Object.assign(t,v);else S.teachers.push({id:uid('t'),...v});save();refresh();toast('Teacher saved')}}]})})}

/* settings */
function pgSettings(el){head('Settings','Academy details, fee rules and reminder text');const F=[{k:'name',label:'Academy name',req:true},{k:'area',label:'Area',req:true},{k:'city',label:'City',req:true},{k:'phone',label:'Office mobile',type:'tel',req:true},{k:'dueDay',label:'Fee due day',type:'number',min:1,max:28,req:true},{k:'tpl',label:'Fee reminder (WhatsApp text)',type:'textarea',full:true,req:true,hint:'Use {academy}, {student}, {month}, {amount} and {due}. The link opens WhatsApp with this text; nothing is sent by itself.'}];
  el.innerHTML=`<div class="grid g21"><section class="card glass"><div class="h2"><h2>Academy</h2></div><div id="sf">${formHTML(F,S.cfg)}</div><button class="btn primary" id="sv" style="margin-top:14px">${ic('check',16)}Save</button></section><section class="card glass"><div class="h2"><h2>Demo data</h2></div><p class="muted" style="margin:0 0 12px">Restore 6 teachers, 10 batches, 64 students, 8 weeks of tests and 6 months of fees.</p><button class="btn danger" id="rs">${ic('refresh',16)}Reset demo data</button></section></div>`;
  $('#sv',el).addEventListener('click',()=>{const v=readForm($('#sf',el),F);if(!v)return;Object.assign(S.cfg,v);save();refresh();toast('Settings saved')});
  $('#rs',el).addEventListener('click',()=>confirmBox('Reset all demo data?',()=>{S=seed();save();Object.keys(TS).forEach(k=>delete TS[k]);TB='';TW='';FM=MONTH;TF='';refresh();toast('Demo data reset')},'Reset'))}

/* ---------- boot ---------- */
$('[data-menu]').innerHTML=ic('menu');$('[data-cmdk]').innerHTML=ic('search',17)+'<span>Search or jump</span><kbd>Ctrl K</kbd>';
const NAVI={overview:'home',batches:'layers',students:'users',tests:'trophy',fees:'cash',timetable:'cal',teachers:'user',settings:'gear'};$$('.nav a').forEach(a=>{a.innerHTML=ic(NAVI[a.dataset.route],22)+'<span>'+a.textContent+'</span>'});
boot({name:'Ustaad',key:KEY,routes:[{path:'overview',label:'Today',render:pgOverview},{path:'batches',label:'Batches',render:pgBatches},{path:'students',label:'Students',render:pgStudents},{path:'tests',label:'Weekly tests',render:pgTests},{path:'fees',label:'Fees',render:pgFees},{path:'timetable',label:'Timetable',render:pgTimetable},{path:'teachers',label:'Teachers',render:pgTeachers},{path:'settings',label:'Settings',render:pgSettings}],
  commands:[{label:'Enrol a student',run:()=>stForm()},{label:'New batch',run:()=>batForm()},{label:'Enter test marks',run:()=>go('tests')},{label:'Late fees list',run:()=>{TS['fee'+FM]={q:'',chip:'Late',sort:3,dir:1,page:0};go('fees')}}],
  notes:()=>{const n=[],late=S.students.filter(s=>feeSt(s,MONTH)==='Late');if(late.length)n.push({id:'late-'+MONTH+late.length,text:late.length+' students have not paid '+mlabel(MONTH),sub:rs(sum(late,feeOf))+' pending',href:'#/fees'});S.batches.filter(b=>kidsOf(b.id).length>=b.cap).forEach(b=>n.push({id:'full-'+b.id,text:b.name+' is full',sub:b.cap+' seats taken',href:'#/batches'}));S.batches.filter(b=>!S.tests.some(t=>t.bid===b.id&&t.wk===iso(thisMon))).slice(0,3).forEach(b=>n.push({id:'test-'+b.id+iso(thisMon),text:'No test yet this week: '+b.name,sub:'Week of '+dd(iso(thisMon)),href:'#/tests'}));return n}});
</script>
