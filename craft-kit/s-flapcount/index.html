<!doctype html>
<!-- Chill & Craft · Flapcount · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flapcount · Newsletter signup with a split-flap board</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg: #f2e8d2;
    --ray: rgba(214, 140, 20, 0.1);
    --card: #fffaf0;
    --ink: #14213d;
    --muted: #6b6250;
    --line: rgba(20, 33, 61, 0.12);
    --field: #ffffff;
    --tomato: #e4473b;
    --teal: #1f8a7a;
    --mustard: #f6b93b;
    --board: #14213d;
    --cell: #1f2f55;
    --glyph: #ffd479;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c1220;
    --ray: rgba(246, 185, 59, 0.06);
    --card: #151d31;
    --ink: #f4ead6;
    --muted: #a59d8a;
    --line: rgba(244, 234, 214, 0.12);
    --field: #0f1627;
    --tomato: #f05d50;
    --teal: #2fb39f;
    --board: #0a1122;
    --cell: #1b2847;
    --glyph: #ffd479;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Stage: slow retro sunburst ---------- */
  .stage { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 22px 16px; overflow: hidden; isolation: isolate; }
  .stage::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax; background: repeating-conic-gradient(var(--ray) 0 6deg, transparent 6deg 12deg); -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 75%); mask: radial-gradient(closest-side, #000 20%, transparent 75%); animation: turn 120s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ---------- Card ---------- */
  .card { position: relative; width: min(460px, 100%); padding: 22px 22px 18px; border-radius: 24px; background: var(--card); box-shadow: 0 40px 70px -44px rgba(20, 33, 61, 0.6), 0 0 0 1px var(--line); animation: rise 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
  .mast { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--tomato); color: #fff8ec; }
  .logo svg { width: 24px; height: 24px; overflow: visible; }
  .logo .steam { animation: steam 2.6s ease-in-out infinite; }
  @keyframes steam { 0%, 100% { transform: translateY(1px); opacity: 0.5; } 50% { transform: translateY(-2px); opacity: 1; } }
  .mast h1 { margin: 0; font-family: ui-serif, Georgia, "Times New Roman", serif; font-size: 1.45rem; line-height: 1.1; letter-spacing: -0.01em; }
  .mast .tag { margin-left: auto; padding: 5px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: var(--mustard); color: #14213d; white-space: nowrap; }
  .sub { margin: 10px 0 16px; font-size: 0.9rem; line-height: 1.45; color: var(--muted); }

  /* ---------- Split-flap board ---------- */
  .board { --cw: clamp(17px, 5.1vw, 25px); --ch: calc(var(--cw) * 1.48); position: relative; padding: 12px 12px 14px; border-radius: 16px; background: var(--board); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.06), inset 0 -3px 0 rgba(0, 0, 0, 0.35), 0 16px 26px -18px rgba(10, 17, 34, 0.9); }
  .board::before, .board::after { content: ""; position: absolute; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8a95b3, #3a4766); }
  .board::before { left: 8px; }
  .board::after { right: 8px; }
  .lights { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 0 0 12px; }
  .lights i { width: 7px; height: 7px; border-radius: 50%; background: #ffd166; box-shadow: 0 0 8px #ffb703; opacity: 0.3; animation: twinkle 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.41s); }
  .board.party .lights i { animation: chase 0.7s linear infinite; animation-delay: calc(var(--i) * 0.05s); }
  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  @keyframes chase { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 25% { opacity: 1; transform: scale(1.35); } }
  .slot { width: 92px; height: 8px; margin: 0 6px; border-radius: 4px; background: #050a16; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.1); }
  .row { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .row + .row { margin-top: 9px; }
  .row .lbl { margin-right: 10px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; color: #8f9bbd; }
  .row .gap { width: 8px; }
  .cell { position: relative; width: var(--cw); height: var(--ch); flex: none; perspective: 220px; font: 800 calc(var(--ch) * 0.6) / var(--ch) ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; color: var(--glyph); }
  .row.big .cell { --cw: clamp(22px, 7vw, 34px); --ch: calc(var(--cw) * 1.42); }
  .half, .flap { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: var(--cell); }
  .top, .ft { top: 0; border-radius: 4px 4px 0 0; background: linear-gradient(var(--cell), color-mix(in srgb, var(--cell) 88%, #000)); }
  .bot, .fb { bottom: 0; border-radius: 0 0 4px 4px; }
  .half b, .flap b { position: absolute; left: 0; right: 0; height: var(--ch); text-align: center; }
  .top b, .ft b { top: 0; }
  .bot b, .fb b { bottom: 0; }
  .ft { transform-origin: 50% 100%; backface-visibility: hidden; z-index: 2; }
  .fb { transform-origin: 50% 0; transform: rotateX(90deg); backface-visibility: hidden; z-index: 2; }
  .cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px; background: rgba(0, 0, 0, 0.55); z-index: 3; }
  .row.warn .cell { color: #ff8a7a; }
  .row.good .cell { color: #8ff0c9; }
  .plus { position: absolute; right: 14px; top: 34px; padding: 3px 8px; border-radius: 999px; background: var(--teal); color: #fff; font-size: 0.7rem; font-weight: 800; pointer-events: none; opacity: 0; }

  /* ---------- Form ---------- */
  .form { display: flex; gap: 8px; margin-top: 16px; }
  .field { position: relative; flex: 1; min-width: 0; }
  .field svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--muted); pointer-events: none; }
  #email { width: 100%; height: 50px; padding: 0 14px 0 42px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--field); color: var(--ink); font: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  #email::placeholder { color: var(--muted); }
  #email:focus-visible { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(246, 185, 59, 0.35); }
  #email[aria-invalid="true"] { border-color: var(--tomato); }
  .go {
    position: relative;
    height: 50px;
    padding: 0 20px;
    border: 0;
    border-radius: 14px;
    background: var(--tomato);
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--tomato) 60%, #000), 0 14px 22px -14px var(--tomato);
    transition: background 0.35s, box-shadow 0.35s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--tomato) 60%, #000); }
  .go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .go.ok { background: var(--teal); box-shadow: 0 4px 0 color-mix(in srgb, var(--teal) 60%, #000), 0 14px 22px -14px var(--teal); }
  .go .in { display: inline-flex; align-items: center; gap: 7px; }
  .go svg { width: 18px; height: 18px; }
  .go .dots i { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: currentColor; animation: dot 0.9s ease-in-out infinite; }
  .go .dots i:nth-child(2) { animation-delay: 0.12s; }
  .go .dots i:nth-child(3) { animation-delay: 0.24s; }
  @keyframes dot { 0%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
  .fine { margin: 10px 2px 0; min-height: 1.3em; font-size: 0.78rem; color: var(--muted); }
  .fine.err { color: var(--tomato); font-weight: 600; }
  .fine.yay { color: var(--teal); font-weight: 600; }

  .ticket { position: fixed; z-index: 30; padding: 7px 12px 7px 16px; border-radius: 6px; background: #fff3d6; color: #14213d; font: 700 0.78rem/1.2 ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; pointer-events: none; box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.45); background-image: radial-gradient(circle at 0 50%, transparent 4px, #fff3d6 4.5px); }
  .confetti { position: fixed; z-index: 31; width: 7px; height: 13px; border-radius: 2px; pointer-events: none; }

  @media (max-width: 420px) {
    .card { padding: 18px 14px 14px; }
    .form { flex-direction: column; }
    .go { width: 100%; }
    .mast .tag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage::before, .card, .lights i, .board.party .lights i, .logo .steam, .go .dots i { animation: none; }
    .lights i { opacity: 0.7; }
    .ticket, .confetti { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <div class="mast">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="steam" d="M9 3c-1 1.2 1 2 0 3.2M13 3c-1 1.2 1 2 0 3.2" /><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z" /><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17" /><path d="M3 21h16" /></svg></span>
        <h1 id="title">The Sunday Brew</h1>
        <span class="tag">Weekly · Free</span>
      </div>
      <p class="sub">A short letter on chai, books and small business. Every Sunday at 7 am, straight to your inbox.</p>

      <div class="board" id="board" role="group" aria-label="Reader board">
        <div class="lights" id="lights" aria-hidden="true"></div>
        <div class="row big" id="rowCount" aria-hidden="true"><span class="lbl">READERS</span></div>
        <div class="row" id="rowMsg" aria-hidden="true"></div>
        <span class="plus" id="plus" aria-hidden="true">+1</span>
        <p class="sr-only" id="boardText" aria-live="polite"></p>
      </div>

      <form class="form" id="form" novalidate>
        <div class="field">
          <label class="sr-only" for="email">Email address</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="m4 7 8 6 8-6" /></svg>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-describedby="fine" />
        </div>
        <button class="go" id="go" type="submit"><span class="in">Subscribe</span></button>
      </form>
      <p class="fine" id="fine" aria-live="polite">One letter a week. No spam, leave any time.</p>
    </section>
  </main>

<script>
  // ---------- Flapcount: newsletter signup that posts a ticket into a split-flap reader board ----------
  const $ = (s) => document.querySelector(s);
  const board = $("#board");
  const lights = $("#lights");
  const rowCount = $("#rowCount");
  const rowMsg = $("#rowMsg");
  const plus = $("#plus");
  const boardText = $("#boardText");
  const form = $("#form");
  const email = $("#email");
  const go = $("#go");
  const fine = $("#fine");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => reduce.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function play(el, frames, opts) {
    if (calm() || !el || !el.animate) return Promise.resolve();
    return el.animate(frames, opts).finished.catch(() => {});
  }

  // ---------- Lights + slot ----------
  for (let i = 0; i < 12; i++) {
    if (i === 6) { const s = document.createElement("span"); s.className = "slot"; s.id = "slot"; lights.appendChild(s); }
    const b = document.createElement("i");
    b.style.setProperty("--i", i);
    lights.appendChild(b);
  }
  const slot = $("#slot");

  // ---------- Split-flap cells ----------
  // Each cell: static top + bottom halves, plus two flaps that fold over them (top falls, bottom lands).
  const LETTERS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ!";
  const DIGITS = "0123456789";
  function makeCell(ch) {
    const c = document.createElement("span");
    c.className = "cell";
    c.innerHTML = '<span class="half top"><b></b></span><span class="half bot"><b></b></span><span class="flap ft"><b></b></span><span class="flap fb"><b></b></span>';
    const b = c.querySelectorAll("b");
    c.p = { top: b[0], bot: b[1], ftb: b[2], fbb: b[3], ft: c.children[2], fb: c.children[3] };
    b.forEach((x) => { x.textContent = ch; });
    c.ch = ch;
    c.q = Promise.resolve();
    return c;
  }
  async function flipOnce(c, B, d) {
    const p = c.p;
    const A = c.ch;
    if (A === B) return;
    c.ch = B;
    p.top.textContent = B;
    p.ftb.textContent = A;
    p.fbb.textContent = B;
    p.bot.textContent = A;
    if (!calm() && p.ft.animate) {
      await p.ft.animate([{ transform: "rotateX(0deg)", filter: "brightness(1)" }, { transform: "rotateX(-90deg)", filter: "brightness(1.6)" }], { duration: d, easing: "ease-in" }).finished.catch(() => {});
      p.ftb.textContent = B;
      await p.fb.animate([
        { transform: "rotateX(90deg)", filter: "brightness(.5)" },
        { transform: "rotateX(0deg)", filter: "brightness(1)", offset: 0.72 },
        { transform: "rotateX(14deg)", offset: 0.86 },
        { transform: "rotateX(0deg)" }
      ], { duration: d * 1.5, easing: "ease-out" }).finished.catch(() => {});
    }
    p.ftb.textContent = B;
    p.bot.textContent = B;
  }
  // Queue flips per cell so overlapping updates never tangle; shuffle through a few characters first
  function flipTo(c, target, shuffle, set, delay, d) {
    c.q = c.q.then(async () => {
      if (delay) await wait(delay);
      if (c.ch === target) return;
      for (let i = 0; i < shuffle && !calm(); i++) await flipOnce(c, set[(set.indexOf(c.ch) + 1 + Math.floor(Math.random() * (set.length - 1))) % set.length], d);
      await flipOnce(c, target, d);
    });
    return c.q;
  }

  const COUNT_CELLS = 6;
  const MSG_CELLS = 12;
  const countCells = [];
  const msgCells = [];
  let readers = 12480;
  const fmt = (n) => n.toLocaleString("en-US").padStart(COUNT_CELLS, " ").slice(-COUNT_CELLS);
  fmt(readers).split("").forEach((ch) => { const c = makeCell(ch); countCells.push(c); rowCount.appendChild(c); });
  for (let i = 0; i < MSG_CELLS; i++) { const c = makeCell(" "); msgCells.push(c); rowMsg.appendChild(c); }

  const centre = (t) => { t = t.slice(0, MSG_CELLS); const l = Math.floor((MSG_CELLS - t.length) / 2); return (" ".repeat(l) + t).padEnd(MSG_CELLS, " "); };
  function setMessage(text, tone, shuffle) {
    rowMsg.classList.toggle("warn", tone === "warn");
    rowMsg.classList.toggle("good", tone === "good");
    boardText.textContent = text;
    const t = centre(text);
    return Promise.all(msgCells.map((c, i) => flipTo(c, t[i], shuffle == null ? 2 : shuffle, LETTERS + DIGITS, i * 45, 70)));
  }
  function setCount(n, shuffle) {
    const t = fmt(n);
    return Promise.all(countCells.map((c, i) => flipTo(c, t[i], c.ch === t[i] ? 0 : shuffle, DIGITS, (COUNT_CELLS - i) * 40, 80)));
  }

  // Opening: the board settles on its idle message
  setMessage("NEXT SUN 7AM", null, 3);

  // ---------- Confetti from the board ----------
  function confetti() {
    if (calm()) return;
    const r = board.getBoundingClientRect();
    const cols = ["#e4473b", "#f6b93b", "#1f8a7a", "#ffd479", "#5b7bd5"];
    for (let i = 0; i < 34; i++) {
      const s = document.createElement("i");
      s.className = "confetti";
      s.style.background = cols[i % cols.length];
      s.style.left = r.left + r.width * (0.15 + Math.random() * 0.7) + "px";
      s.style.top = r.top + 14 + "px";
      document.body.appendChild(s);
      const dx = (Math.random() - 0.5) * 260;
      const up = 60 + Math.random() * 110;
      const spin = (Math.random() - 0.5) * 900;
      s.animate([
        { transform: "translate(0,0) rotate(0) scale(.6)", opacity: 1 },
        { transform: "translate(" + dx * 0.6 + "px," + -up + "px) rotate(" + spin * 0.4 + "deg) scale(1)", opacity: 1, offset: 0.35 },
        { transform: "translate(" + dx + "px," + (r.height + 60) + "px) rotate(" + spin + "deg) rotateY(540deg)", opacity: 0 }
      ], { duration: 1500 + Math.random() * 800, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Button content ----------
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10" /></svg>';
  function setButton(html) {
    const span = go.querySelector(".in");
    play(span, [{ transform: "none", opacity: 1 }, { transform: "translateY(-120%)", opacity: 0 }], { duration: 160, easing: "ease-in" }).then(() => {
      span.innerHTML = html;
      play(span, [{ transform: "translateY(120%)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: "cubic-bezier(.3,1.6,.5,1)" });
    });
  }

  // ---------- Subscribe ----------
  const joined = new Set();
  let busy = false;
  const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  const firstName = (v) => (v.split("@")[0].split(/[._+\-0-9]/)[0] || "friend").replace(/[^a-z]/gi, "").toUpperCase().slice(0, 9) || "FRIEND";

  function complain(boardMsg, text) {
    email.setAttribute("aria-invalid", "true");
    fine.className = "fine err";
    fine.textContent = text;
    play(email, [{ transform: "none" }, { transform: "translateX(-8px)" }, { transform: "translateX(7px)" }, { transform: "translateX(-4px)" }, { transform: "translateX(2px)" }, { transform: "none" }], { duration: 440 });
    setMessage(boardMsg, "warn", 1).then(() => wait(1600)).then(() => { if (!busy) setMessage("NEXT SUN 7AM", null, 1); });
  }
  email.addEventListener("input", () => {
    if (email.getAttribute("aria-invalid") === "true") { email.removeAttribute("aria-invalid"); fine.className = "fine"; fine.textContent = "One letter a week. No spam, leave any time."; }
  });

  form.addEventListener("submit", (e) => { e.preventDefault(); subscribe(); });

  async function subscribe() {
    if (busy) return;
    const v = email.value.trim().toLowerCase();
    if (!validEmail(v)) { complain("CHECK EMAIL", v ? "That address looks incomplete. Try name@example.com." : "Type your email address first."); if (!demoOn) email.focus(); return; }
    if (joined.has(v)) { complain("ALREADY IN!", "You are already on the list. See you on Sunday."); return; }
    busy = true;
    joined.add(v);
    const name = firstName(v);

    // 1. Anticipation: the button sinks and the email lifts out of the field as a paper ticket
    play(go, [{ transform: "translateY(0)" }, { transform: "translateY(3px) scale(.97)" }, { transform: "translateY(0)" }], { duration: 260, easing: "ease-out" });
    setButton('<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> Subscribing');
    fine.className = "fine";
    fine.textContent = "Posting your ticket…";
    const from = email.getBoundingClientRect();
    email.value = "";

    // 2. The ticket flies to the slot on the board and slides in
    if (!calm()) {
      const t = document.createElement("div");
      t.className = "ticket";
      t.textContent = v;
      document.body.appendChild(t);
      const tw = t.offsetWidth, th = t.offsetHeight;
      const s = slot.getBoundingClientRect();
      const left = s.left + s.width / 2 - tw / 2;
      const top = s.top + s.height / 2 - th;
      t.style.left = left + "px";
      t.style.top = top + "px";
      const dx = from.left + 38 - left;
      const dy = from.top + (from.height - th) / 2 - top;
      await t.animate([
        { transform: "translate(" + dx + "px," + dy + "px) scale(.92)", opacity: 0, clipPath: "inset(0 0 0 0)" },
        { transform: "translate(" + dx + "px," + (dy - 18) + "px) rotate(-4deg) scale(1)", opacity: 1, clipPath: "inset(0 0 0 0)", offset: 0.18 },
        { transform: "translate(0px,-34px) rotate(3deg)", opacity: 1, clipPath: "inset(0 0 0 0)", offset: 0.62 },
        { transform: "translate(0px,0px) rotate(0deg)", opacity: 1, clipPath: "inset(0 0 0 0)", offset: 0.76 },
        { transform: "translate(0px," + th + "px)", opacity: 1, clipPath: "inset(0 0 100% 0)" }
      ], { duration: 1050, easing: "cubic-bezier(.45,.05,.35,1)" }).finished.catch(() => {});
      t.remove();
    }

    // 3. Clack: the board jolts, the lights chase and the message row shuffles
    play(board, [{ transform: "translateY(0)" }, { transform: "translateY(3px) scale(1.005)" }, { transform: "translateY(-1px)" }, { transform: "none" }], { duration: 300, easing: "ease-out" });
    play(slot, [{ boxShadow: "inset 0 2px 3px rgba(0,0,0,.9), 0 0 0 0 rgba(255,209,102,.8)" }, { boxShadow: "inset 0 2px 3px rgba(0,0,0,.9), 0 0 0 8px rgba(255,209,102,0)" }], { duration: 500 });
    board.classList.add("party");
    await setMessage("SIGNING UP", null, 2);
    await wait(250);

    // 4. Count goes up, the board greets you by name, confetti flies
    readers += 1;
    setCount(readers, 3);
    play(plus, [{ transform: "translateY(6px) scale(.6)", opacity: 0 }, { transform: "translateY(-6px) scale(1.1)", opacity: 1, offset: 0.3 }, { transform: "translateY(-22px) scale(1)", opacity: 0 }], { duration: 1300, easing: "ease-out" });
    await setMessage("HI " + name + "!", "good", 2);
    go.classList.add("ok");
    setButton(CHECK + " You're in");
    fine.className = "fine yay";
    fine.textContent = "Welcome, " + name.charAt(0) + name.slice(1).toLowerCase() + ". Check your inbox to confirm.";
    confetti();
    await wait(1800);
    board.classList.remove("party");

    // 5. Reset: the board goes back to the next issue and the button returns
    await setMessage("SEE YOU SUN", null, 1);
    await wait(1400);
    go.classList.remove("ok");
    setButton("Subscribe");
    fine.className = "fine";
    fine.textContent = "One letter a week. No spam, leave any time.";
    await setMessage("NEXT SUN 7AM", null, 1);
    busy = false;
    if (demoOn) queueDemo(2200);
  }

  // ---------- Idle life: now and then another reader joins somewhere ----------
  const CITIES = ["LAHORE", "KARACHI", "QUETTA", "MULTAN", "SKARDU", "PESHAWAR"];
  let cityIndex = 0;
  (function someoneJoins() {
    setTimeout(async () => {
      if (!busy && !document.hidden) {
        readers += 1;
        setCount(readers, 2);
        play(plus, [{ transform: "translateY(6px) scale(.6)", opacity: 0 }, { transform: "translateY(-6px)", opacity: 1, offset: 0.3 }, { transform: "translateY(-20px)", opacity: 0 }], { duration: 1200, easing: "ease-out" });
        if (!demoOn) { await setMessage("+1 " + CITIES[cityIndex++ % CITIES.length], null, 1); await wait(1600); if (!busy) setMessage("NEXT SUN 7AM", null, 1); }
      }
      someoneJoins();
    }, 9000 + Math.random() * 6000);
  })();

  // ---------- Auto-demo: types a sample address and subscribes, repeats while idle ----------
  let demoOn = true;
  let demoTimer = 0;
  function stopDemo() { if (!demoOn) return; demoOn = false; clearTimeout(demoTimer); }
  ["pointerdown", "keydown", "touchstart"].forEach((t) => window.addEventListener(t, (e) => { if (e.isTrusted) stopDemo(); }, { capture: true, passive: true }));
  function queueDemo(ms) { clearTimeout(demoTimer); if (demoOn) demoTimer = setTimeout(runDemo, ms); }
  const SAMPLES = ["ayesha.rana@mail.example", "bilal.ahmed@mail.example", "hina.baig@mail.example", "omar.farooq@mail.example", "sana.malik@mail.example"];
  let sampleIndex = 0;
  async function runDemo() {
    if (!demoOn) return;
    if (busy) { queueDemo(1500); return; }
    const text = SAMPLES[sampleIndex++ % SAMPLES.length];
    email.value = "";
    for (const ch of text) {
      if (!demoOn) return;
      email.value += ch;
      await wait(calm() ? 8 : 22 + Math.random() * 22);
    }
    await wait(220);
    joined.delete(text); // the demo reuses its sample addresses
    if (demoOn) subscribe();
  }
  queueDemo(450);
</script>
