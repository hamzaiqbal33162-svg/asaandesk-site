<title>Replay Disc · reorder a past order in one tap</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: a record shop in mustard, teal and cream ---------- */
  :root {
    color-scheme: light;
    --bg1: #fff3df;
    --bg2: #f0d3a4;
    --ink: #2b1d14;
    --muted: #806a58;
    --panel: #fffaf2;
    --well: #f8eedf;
    --line: #eddcc3;
    --wood: #8a5a33;
    --wood-d: #5e3a1e;
    --mustard: #e9a72c;
    --teal: #167171;
    --teal-l: #22a0a0;
    --up: #c2410c;
    --down: #15803d;
    --focus: #2563eb;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #2d1d33;
    --bg2: #0d0810;
    --ink: #f7ede2;
    --muted: #b3a090;
    --panel: #1a1218;
    --well: #231922;
    --line: #34262f;
    --wood: #6b4529;
    --wood-d: #43291a;
    --teal: #22a0a0;
    --teal-l: #35c2c2;
    --up: #fb923c;
    --down: #4ade80;
    --focus: #93c5fd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(520px 360px at 50% 30%, rgba(34, 160, 160, .16), transparent 70%), radial-gradient(900px 640px at 50% 0%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; overflow: clip; }
  .card {
    width: min(392px, 100%);
    padding: 16px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(80, 40, 10, .5), 0 8px 20px -12px rgba(80, 40, 10, .25);
    animation: rise .7s var(--spring) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .head h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .cart { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; background: var(--ink); color: var(--panel); font-size: 12px; font-weight: 750; white-space: nowrap; }
  .cart svg { width: 15px; height: 15px; }

  /* ---------- Turntable ---------- */
  .deck { position: relative; margin-top: 10px; aspect-ratio: 200 / 150; }
  .deck > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arm { z-index: 3; pointer-events: none; }
  #armG { transform-origin: 176px 24px; transition: transform .7s var(--spring); }
  .rec { position: absolute; z-index: 2; left: 9%; top: 3.33%; width: 66%; aspect-ratio: 1; border-radius: 50%; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .35)); }
  .rec svg { display: block; width: 100%; height: 100%; }
  .sheen { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 30deg, rgba(255, 255, 255, .16) 50deg, transparent 72deg 210deg, rgba(255, 255, 255, .12) 232deg, transparent 254deg); animation: sheen 5s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes sheen { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .led { transition: fill .3s, filter .3s; }
  .on .led { fill: #4ade80; filter: drop-shadow(0 0 4px #4ade80); }

  /* ---------- Sleeves (past orders) ---------- */
  .sleeves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .sl {
    display: grid;
    gap: 7px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform .4s var(--spring);
  }
  .sl .cover { position: relative; aspect-ratio: 1.45; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 14px -10px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .15); transition: box-shadow .3s; }
  .sl .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .35) 45%, transparent 60%) -120% 0 / 250% 100% no-repeat; animation: shine 6s ease-in-out infinite; }
  .sl:nth-child(2) .cover::after { animation-delay: 2s; } .sl:nth-child(3) .cover::after { animation-delay: 4s; }
  @keyframes shine { 0%, 70% { background-position: -120% 0; } 100% { background-position: 220% 0; } }
  .sl .cover svg { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; }
  .sl b { font-size: 12px; line-height: 1.15; }
  .sl small { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sl[aria-pressed="true"] { transform: translateY(-4px); }
  .sl[aria-pressed="true"] .cover { box-shadow: 0 0 0 2.5px var(--panel), 0 0 0 5px var(--teal), 0 12px 18px -10px rgba(0, 0, 0, .6); }
  .c0 { background: repeating-conic-gradient(from 0deg at 30% 120%, #e9a72c 0 9deg, #d2561f 9deg 18deg); }
  .c1 { background: linear-gradient(45deg, #167171 25%, transparent 25% 75%, #167171 75%) 0 0 / 18px 18px, linear-gradient(45deg, #167171 25%, #0f5252 25% 75%, #167171 75%) 9px 9px / 18px 18px; }
  .c2 { background: radial-gradient(circle at 70% 30%, #ffd3e1 0 14%, transparent 15%), radial-gradient(circle at 25% 70%, #ff8fb1 0 22%, transparent 23%), #c2316b; }

  /* ---------- Track list ---------- */
  .tracks { list-style: none; margin: 10px 0 0; padding: 8px 10px; border-radius: 14px; background: var(--well); display: grid; gap: 1px; counter-reset: t; }
  .tracks li { position: relative; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; min-height: 25px; font-size: 12.5px; border-radius: 8px; padding: 0 6px; transition: background .25s; }
  .tracks li .n { font-size: 10.5px; color: var(--muted); font-weight: 750; font-variant-numeric: tabular-nums; }
  .tracks li .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tracks li .pr { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 650; }
  .tracks li .pr s { margin-right: 4px; color: var(--muted); font-weight: 500; }
  .tracks li .chg { margin-left: 4px; font-size: 10px; font-weight: 800; }
  .tracks li .chg.up { color: var(--up); } .tracks li .chg.down { color: var(--down); }
  .tracks li.swap .nm em { font-style: normal; font-size: 10.5px; color: var(--up); font-weight: 750; }
  .tracks li.now { background: color-mix(in srgb, var(--teal) 14%, transparent); }
  .tracks li.done .n { color: var(--teal); }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 11px; }
  .eq i { width: 3px; background: var(--teal); border-radius: 1px; animation: eq .5s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; }
  @keyframes eq { from { height: 3px; } to { height: 11px; } }
  .tracks li.now .eq { display: flex; } .tracks li.now .n b { display: none; }
  .cmp { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 0 4px; font-size: 12.5px; color: var(--muted); }
  .cmp b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .go {
    position: relative;
    width: 100%;
    height: 50px;
    margin-top: 8px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--teal-l), var(--teal));
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 12px 22px -12px var(--teal);
    transition: transform .3s var(--spring), background .3s;
  }
  .go:hover { transform: translateY(-2px); }
  .go[aria-disabled="true"] { cursor: progress; }
  .go.ok { background: linear-gradient(180deg, #f2b33d, #c98612); color: #2b1d14; }
  .sl:focus-visible .cover, .go:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .sl:focus-visible { outline: none; }
  .note { margin: 6px 0 0; min-height: 1.3em; text-align: center; font-size: 12px; color: var(--muted); }
  .fly { position: fixed; left: 0; top: 0; z-index: 30; width: 22px; height: 22px; pointer-events: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="ttl">
    <header class="head">
      <div><h1 id="ttl">Order it again</h1><p>Pick a past order and replay it into your cart.</p></div>
      <span class="cart" id="cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19.5 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="9" cy="19" r="1.6" fill="currentColor" /><circle cx="17" cy="19" r="1.6" fill="currentColor" /></svg><span id="cartN">0 items</span></span>
    </header>

    <div class="deck" id="deck" aria-hidden="true">
      <!-- plinth and platter -->
      <svg viewBox="0 0 200 150">
        <defs>
          <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wood)" /><stop offset="1" stop-color="var(--wood-d)" /></linearGradient>
          <radialGradient id="platG"><stop offset=".85" stop-color="#2a2a2e" /><stop offset=".93" stop-color="#9aa0aa" /><stop offset="1" stop-color="#5a5f68" /></radialGradient>
        </defs>
        <rect x="2" y="0" width="196" height="148" rx="14" fill="url(#plinth)" />
        <rect x="6" y="4" width="188" height="140" rx="11" fill="none" stroke="#fff" stroke-opacity=".12" />
        <circle cx="84" cy="71" r="69" fill="url(#platG)" />
        <circle cx="176" cy="24" r="12" fill="#3a3a40" /><circle cx="176" cy="24" r="7" fill="#9aa0aa" />
        <g id="power"><circle class="led" cx="188" cy="129.5" r="3.4" fill="#6b5545" /><text x="167" y="133" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#f1dcc2" opacity=".7">33</text></g>
        <rect x="128" y="126" width="30" height="7" rx="3.5" fill="#3a3a40" /><circle id="knob" cx="133" cy="129.5" r="4.6" fill="#d9dde4" />
      </svg>
      <!-- the record on the platter -->
      <div class="rec" id="rec">
        <svg viewBox="0 0 140 140" id="disc">
          <circle cx="70" cy="70" r="70" fill="#141416" />
          <g fill="none" stroke="#2b2b30" stroke-width=".8" id="grooves"></g>
          <circle cx="70" cy="70" r="27" id="lab" fill="#e9a72c" />
          <circle cx="70" cy="70" r="27" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="2" />
          <text id="labT" x="70" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5.6" font-weight="800" fill="#2b1d14">BIRYANI NIGHT</text>
          <text id="labS" x="70" y="81" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5.4" font-weight="600" fill="#2b1d14" opacity=".75">12 OCT</text>
          <circle cx="70" cy="70" r="2.6" fill="#141416" />
          <path d="M70 46a24 24 0 0 1 22 14" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none" />
        </svg>
        <div class="sheen"></div>
      </div>
      <!-- the tone arm swings in from the pivot at the top right -->
      <svg class="arm" viewBox="0 0 200 150">
        <g id="armG" style="transform: rotate(0deg)">
          <rect x="183" y="12" width="12" height="10" rx="3" fill="#6b7280" />
          <path d="M176 24L172 92L150 116" fill="none" stroke="#d9dde4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M176 24L172 92L150 116" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="141" y="110" width="14" height="9" rx="2" fill="#2f3138" transform="rotate(-42 148 114.5)" />
          <circle cx="176" cy="24" r="4" fill="#4b5563" />
        </g>
      </svg>
    </div>

    <div class="sleeves" id="sleeves" role="group" aria-label="Past orders"></div>

    <ol class="tracks" id="tracks" aria-label="Items in this order"></ol>
    <div class="cmp"><span>Last time <b id="was">PKR 0</b></span><span>Today <b id="now">PKR 0</b></span></div>
    <button class="go" id="go" type="button"><span id="goTxt">Order again</span></button>
    <p class="note" id="note" aria-live="polite">Prices are checked again before anything goes in your cart.</p>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Replay Disc: past orders are records; playing one puts every item back in the cart ----------
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 60) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const E = { out: (t) => 1 - Math.pow(1 - t, 3), in: (t) => t * t * t, inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), back: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) };
  function tween(ms, fn, ease) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.max(0, Math.min(1, (now - s) / ms)); fn((ease || E.out)(t)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }
  let busy = false, queued = null;
  function run(fn) {
    return new Promise((res) => {
      const go = async () => { busy = true; try { await fn(); } finally { busy = false; res(); if (queued) { const q = queued; queued = null; q(); } } };
      if (busy) queued = go; else go();
    });
  }
  const note = (t) => { $("note").textContent = t; };

  // ---------- Past orders: what was paid then, and what each item costs today (PKR) ----------
  // swap: the item is out of stock today and this one takes its place
  const ORDERS = [
    { t: "Biryani night", d: "12 Oct", cls: "c0", lab: "#e9a72c", ink: "#2b1d14", icon: '<path d="M4 11h16l-1.5 7a2 2 0 0 1-2 1.5h-9a2 2 0 0 1-2-1.5zM8 11c0-3 2-5 4-5s4 2 4 5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>',
      items: [{ n: "Chicken biryani", q: 2, was: 1100, now: 1100 }, { n: "Raita", q: 2, was: 220, now: 240 }, { n: "Shami kebab", q: 4, was: 110, now: 110 }, { n: "Mango lassi", q: 2, was: 180, now: 0, swap: "Sweet lassi", sp: 170 }] },
    { t: "Weekly basket", d: "3 Nov", cls: "c1", lab: "#22a0a0", ink: "#06302f", icon: '<path d="M5 9h14l-1.2 9.5a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3zM9 9l3-5 3 5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>',
      items: [{ n: "Basmati rice 5 kg", q: 1, was: 2150, now: 2150 }, { n: "Cooking oil 3 L", q: 1, was: 1890, now: 1850 }, { n: "Red lentils 1 kg", q: 2, was: 420, now: 420 }, { n: "Black tea 450 g", q: 1, was: 980, now: 1020 }] },
    { t: "Chai break", d: "15 Nov", cls: "c2", lab: "#ff8fb1", ink: "#4a0f27", icon: '<path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 6c0-1 1-1 1-2M12 6c0-1 1-1 1-2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
      items: [{ n: "Doodh patti", q: 3, was: 180, now: 180 }, { n: "Samosa", q: 6, was: 60, now: 70 }, { n: "Bun kebab", q: 2, was: 250, now: 250 }, { n: "Gulab jamun box", q: 1, was: 450, now: 450 }] },
  ];
  const unitNow = (it) => (it.swap ? it.sp : it.now);
  const wasTotal = (o) => o.items.reduce((a, it) => a + it.q * it.was, 0);
  const nowTotal = (o) => o.items.reduce((a, it) => a + it.q * unitNow(it), 0);
  let cur = -1, playing = false, cartItems = 0;

  // grooves on the record
  for (let r = 31; r <= 67; r += 2.4) $("grooves").insertAdjacentHTML("beforeend", `<circle cx="70" cy="70" r="${r.toFixed(1)}" stroke-opacity="${(.5 + Math.random() * .5).toFixed(2)}"/>`);

  // ---------- Sleeves ----------
  const sleeves = ORDERS.map((o, k) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sl";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", `${o.t}, ${o.d}, ${o.items.length} items, paid ${fmt(wasTotal(o))}`);
    b.innerHTML = `<span class="cover ${o.cls}"><svg viewBox="0 0 24 24" aria-hidden="true">${o.icon}</svg></span><b>${o.t}</b><small>${o.d} · ${fmt(wasTotal(o))}</small>`;
    b.addEventListener("click", () => run(() => load(k)));
    $("sleeves").appendChild(b);
    return b;
  });
  $("sleeves").addEventListener("keydown", (e) => {
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key], i = sleeves.indexOf(document.activeElement);
    if (!d || i < 0) return;
    e.preventDefault();
    const j = (i + d + 3) % 3;
    sleeves[j].focus();
    run(() => load(j));
  });

  // ---------- Record spin: speed eases toward a target, the angle keeps going ----------
  let ang = 0, speed = 0, target = 0, spinning = false, last = 0;
  function spinTo(v) {
    target = v;
    if (spinning || calm()) return;
    spinning = true;
    last = performance.now();
    requestAnimationFrame(function f(now) {
      const dt = Math.max(0, Math.min(50, now - last));
      last = now;
      speed += (target - speed) * Math.min(1, dt / 260);
      ang = (ang + speed * dt) % 360;
      $("disc").style.transform = `rotate(${ang.toFixed(2)}deg)`;
      if (target === 0 && speed < .002) { speed = 0; spinning = false; return; }
      requestAnimationFrame(f);
    });
  }
  const arm = (deg) => { $("armG").style.transform = `rotate(${deg}deg)`; };

  // ---------- Load a record: the old one slides away, the new one slides out of its sleeve and drops on ----------
  function trackHTML(it, i) {
    const nm = it.swap ? `${it.swap} <em>for ${it.n}</em>` : it.n;
    return `<span class="n"><b>${i + 1}</b><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span><span class="nm">${it.q} × ${nm}</span><span class="pr">${fmt(it.q * it.was)}</span>`;
  }
  async function load(k) {
    if (playing) return;
    if (k === cur) { play($("rec"), [{ transform: "none" }, { transform: "translateY(-6px) scale(1.02)" }, { transform: "none" }], { duration: 380, easing: "ease-out" }); return; }
    const o = ORDERS[k], rec = $("rec");
    sleeves.forEach((b, i) => b.setAttribute("aria-pressed", String(i === k)));
    if (cur >= 0) await play(rec, [{ transform: "none", opacity: 1 }, { transform: "translateX(-40%) rotate(-60deg)", opacity: 0 }], { duration: 300, easing: "ease-in", fill: "forwards" });
    cur = k;
    $("lab").setAttribute("fill", o.lab);
    $("labT").textContent = o.t.toUpperCase();
    $("labT").setAttribute("fill", o.ink);
    $("labS").textContent = o.d.toUpperCase();
    $("labS").setAttribute("fill", o.ink);
    // tracks
    $("tracks").innerHTML = o.items.map((it, i) => `<li>${trackHTML(it, i)}</li>`).join("");
    [...$("tracks").children].forEach((li, i) => play(li, [{ opacity: 0, transform: "translateX(-10px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: 60 * i, easing: "ease-out", fill: "backwards" }));
    $("was").textContent = fmt(wasTotal(o));
    $("now").textContent = "checking…";
    $("goTxt").textContent = `Order again · ${fmt(nowTotal(o))}`;
    // slide in from the sleeve (measure the record at rest, after the slide-out is cancelled)
    rec.getAnimations().forEach((a) => a.cancel());
    const s = sleeves[k].getBoundingClientRect(), d = $("deck").getBoundingClientRect(), r = rec.getBoundingClientRect();
    const dx = s.left + s.width / 2 - (r.left + r.width / 2), dy = s.top - (r.top + r.height / 2);
    await play(rec, [{ transform: `translate(${dx}px, ${dy}px) scale(.45) rotate(-120deg)`, opacity: 0 }, { transform: `translate(${dx * .3}px, ${-d.height * .08}px) scale(1.08) rotate(-20deg)`, opacity: 1, offset: .6 }, { transform: "scale(1.04)", offset: .85 }, { transform: "none" }], { duration: 640, easing: "cubic-bezier(.3,.7,.3,1)" });
    $("now").textContent = fmt(nowTotal(o));
    const diff = nowTotal(o) - wasTotal(o);
    note(`${o.t}, ${o.d}: ${o.items.length} items. ${diff === 0 ? "Same price as last time." : diff > 0 ? `${fmt(diff)} more than last time.` : `${fmt(-diff)} less than last time.`}`);
  }

  // ---------- Order again: arm on, record spins, each track plays into the cart ----------
  async function reorder() {
    const btn = $("go");
    if (playing) return;
    if (cur < 0) { await load(0); }
    const o = ORDERS[cur];
    playing = true;
    btn.setAttribute("aria-disabled", "true");
    $("goTxt").textContent = "Replaying…";
    $("deck").classList.add("on");
    play($("knob"), [{ transform: "none" }, { transform: "translateX(18px)" }], { duration: 300, fill: "forwards", easing: "ease-out" });
    spinTo(.2);
    arm(11);
    await wait(700);
    const rows = [...$("tracks").children];
    let added = 0;
    for (let i = 0; i < o.items.length; i++) {
      const it = o.items[i], li = rows[i];
      arm(11 + (i + 1) * 4);
      li.classList.add("now");
      await wait(420);
      // price check: show what changed since last time
      const p = unitNow(it) * it.q, was = it.q * it.was;
      if (it.swap) li.classList.add("swap");
      li.querySelector(".pr").innerHTML = p === was ? fmt(p) : `<s>${fmt(was)}</s>${fmt(p)}<span class="chg ${p > was ? "up" : "down"}">${p > was ? "▲" : "▼"}</span>`;
      play(li.querySelector(".pr"), [{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 300 });
      await flyNote(li);
      added += it.q;
      cartItems += it.q;
      $("cartN").textContent = `${cartItems} items`;
      play($("cart"), [{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 320, easing: "ease-out" });
      li.classList.remove("now");
      li.classList.add("done");
      li.querySelector(".n b").textContent = "✓";
    }
    // finish: spin down, arm home, notes burst
    spinTo(0);
    arm(0);
    $("deck").classList.remove("on");
    play($("knob"), [{ transform: "translateX(18px)" }, { transform: "none" }], { duration: 300, fill: "forwards", easing: "ease-out" });
    const r = $("rec").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 34);
    btn.classList.add("ok");
    btn.removeAttribute("aria-disabled");
    $("goTxt").textContent = `${added} items in your cart · ${fmt(nowTotal(o))}`;
    const swaps = o.items.filter((it) => it.swap).map((it) => `${it.swap} replaces ${it.n}`);
    note(`${o.t} is back in your cart for ${fmt(nowTotal(o))}.${swaps.length ? " " + swaps.join(", ") + " (out of stock)." : ""}`);
    await wait(2000);
    btn.classList.remove("ok");
    $("goTxt").textContent = `Order again · ${fmt(nowTotal(o))}`;
    rows.forEach((li, i) => { li.classList.remove("done", "swap"); li.querySelector(".n b").textContent = i + 1; });
    playing = false;
  }
  $("go").addEventListener("click", () => run(reorder));

  // a music note leaves the track and flies into the cart pill
  async function flyNote(li) {
    if (calm()) return;
    const a = li.getBoundingClientRect(), b = $("cart").getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "fly";
    f.innerHTML = '<svg viewBox="0 0 22 22"><path d="M8 16V4l10-2v12" fill="none" stroke="#167171" stroke-width="2.4"/><circle cx="5.5" cy="16.5" r="3.2" fill="#e9a72c"/><circle cx="15.5" cy="14.5" r="3.2" fill="#e9a72c"/></svg>';
    document.body.appendChild(f);
    const x0 = a.left + 20, y0 = a.top + a.height / 2 - 11, x1 = b.left + 12, y1 = b.top + 4;
    const cx = Math.min(innerWidth - 30, Math.max(x0, x1) + 60), cy = Math.min(y0, y1) - 40;
    await tween(560, (t) => {
      const u = 1 - t, x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
      f.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(Math.sin(t * 9) * 18).toFixed(1)}deg) scale(${(1.2 - t * .5).toFixed(2)})`;
    }, E.inOut);
    f.remove();
  }

  // ---------- Music-note confetti ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  function sizeFx() { const r = devicePixelRatio || 1; fx.width = innerWidth * r; fx.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  sizeFx();
  addEventListener("resize", sizeFx);
  const COLS = ["#e9a72c", "#22a0a0", "#ff8fb1", "#d2561f", "#fff4e0"];
  function burst(x, y, n) {
    if (calm()) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2.5, c: COLS[i % COLS.length], life: 1, note: i % 3 === 0, r: 2 + Math.random() * 2, rot: (Math.random() - .5), vr: (Math.random() - .5) * .1 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
  }
  function drawFx() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .1; p.vx *= .985; p.life -= .016; p.rot += p.vr;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = ctx.strokeStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.note) { ctx.beginPath(); ctx.ellipse(0, 0, 3.6, 2.8, -.4, 0, 7); ctx.fill(); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(3, -1); ctx.lineTo(3, -12); ctx.lineTo(8, -9); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Auto-demo: load a record, replay it, load the next ----------
  const demo = { on: true, t: 0, n: 0 };
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.t); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  async function demoLoop() {
    if (!demo.on) return;
    const k = demo.n++ % 3;
    await run(() => load(k));
    if (!demo.on) return;
    await wait(900);
    if (!demo.on) return;
    await run(reorder);
    if (demo.on) demo.t = setTimeout(demoLoop, 900);
  }
  run(() => load(0)).then(() => { if (demo.on) demo.t = setTimeout(demoLoop, 500); });
</script>
</body>
</html>
