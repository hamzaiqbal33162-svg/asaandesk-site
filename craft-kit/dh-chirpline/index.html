<!doctype html>
<!-- Chill & Craft · Chirpline · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirpline · Customer messaging</title>
<meta name="description" content="An eight-page customer messaging dashboard for SMS, WhatsApp and email: a shared inbox, contacts, campaigns with a phone preview, templates, automations, reports and settings.">
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice, then the system setting
  (function () { var k = "chirpline:theme", u = new URLSearchParams(location.search).get("theme"), s = null;
    try { s = JSON.parse(localStorage.getItem(k)); } catch (e) { s = null; }
    var t = u === "light" || u === "dark" ? u : s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
/* =========================================================
   1. Colour tokens: emerald and tangerine
   ========================================================= */
:root {
  color-scheme: light;
  --font: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --r: 18px; --r-sm: 12px;
  --bg: #f3f8f5; --surface: #ffffff; --surface2: #eef5f1; --ink: #13261d; --muted: #5f7468; --line: #dbe8e0;
  --accent: #0f9d6b; --accent-ink: #fff; --focus: #0f9d6b; --tang: #ff8a1f; --ok: #12a06a; --warn: #d98100; --bad: #e0483e; --info: #2b86e0;
  --c1: #0f9d6b; --c2: #ff8a1f; --c3: #2b86e0; --c4: #8a5cf0; --c5: #9aaba1;
  --rail: #0c6e4c; --rail2: #0a5c40; --rail-ink: #d8f3e6; --sms: #2b86e0; --wa: #0f9d6b; --mail: #ff8a1f;
  --me: #d9f7e8; --them: #ffffff; --chat-bg: #e8f1ec; --tip-bg: #13261d;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1712; --surface: #13211a; --surface2: #0f1c15; --ink: #e2f2e9; --muted: #8fa99b; --line: #20352a;
  --accent: #2fd08f; --accent-ink: #052016; --focus: #2fd08f; --tang: #ff9d45; --ok: #2fd08f; --warn: #ffb44a; --bad: #ff6b60; --info: #5aa8ff;
  --c1: #2fd08f; --c2: #ff9d45; --c3: #5aa8ff; --c4: #a98bff; --c5: #5e7568;
  --rail: #0a2a1d; --rail2: #08231a; --rail-ink: #bfe9d4; --sms: #5aa8ff; --wa: #2fd08f; --mail: #ff9d45;
  --me: #164a35; --them: #1a2b22; --chat-bg: #0f1c15;
}
/* ---------- Core pieces (tables, dialogs, charts…) styled from the colour tokens above ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.grow1 { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active, .icon-btn:active, .chip:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: var(--r-sm, 8px); background: transparent; color: inherit; position: relative; transition: background .2s, transform .12s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.link:hover { text-decoration: underline; }

/* pills, avatars, switches */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.pill.acc { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; font-size: 11.5px; font-weight: 700; background: hsl(var(--h) 65% 86%); color: hsl(var(--h) 55% 26%); }
[data-theme="dark"] .av { background: hsl(var(--h) 38% 30%); color: hsl(var(--h) 80% 88%); }
.av.lg { width: 44px; height: 44px; font-size: 15px; }
.sw { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw-t { width: 38px; height: 22px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; transition: background .25s; }
.sw-t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(16px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.empty-st { display: grid; justify-items: center; gap: 8px; padding: 28px 12px; color: var(--muted); text-align: center; }
.empty-st .ic { width: 30px; height: 30px; opacity: .6; }

/* forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .field.full, .form-grid .field:has(textarea) { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; align-content: start; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, .inp { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.err:empty { display: none; }
.help { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input { flex: 1; accent-color: var(--accent); }
.range-row output { min-width: 34px; font-weight: 700; text-align: right; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* dialogs: modal, drawer, command search */
.layer-back { position: fixed; inset: 0; z-index: 80; display: grid; background: rgba(8, 10, 20, 0); transition: background .24s; }
.layer-back.in { background: rgba(8, 10, 20, .46); backdrop-filter: blur(3px); }
.layer-back.out { background: rgba(8, 10, 20, 0); backdrop-filter: none; }
.layer { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 100%; outline: none; }
.layer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
.layer-h h2 { font-size: 17px; }
.layer-b { padding: 6px 18px 16px; overflow: auto; }
.layer-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.layer-f .push { margin-right: auto; }
.modal-back { place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); border-radius: var(--r, 14px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; }
.modal.wide { width: min(820px, 100%); }
.in .modal { transform: none; opacity: 1; }
.out .modal { transform: translateY(10px) scale(.98); opacity: 0; }
.confirm { width: min(420px, 100%); }
.drawer-back { justify-items: end; }
.drawer { width: min(480px, 100%); height: 100%; border-radius: var(--r, 14px) 0 0 var(--r, 14px); transform: translateX(104%); transition: transform .34s cubic-bezier(.2,.9,.25,1); }
.drawer.wide { width: min(680px, 100%); }
.in .drawer { transform: none; }
.out .drawer { transform: translateX(104%); }
.drawer .layer-b { flex: 1; }
.cmdk-back { place-items: start center; padding: 12vh 16px 16px; }
.cmdk { width: min(560px, 100%); border-radius: var(--r, 14px); transform: translateY(-10px); opacity: 0; transition: transform .22s, opacity .18s; }
.in .cmdk { transform: none; opacity: 1; }
.cmdk .layer-h { display: none; }
.cmdk .layer-b { padding: 10px; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.cmdk-in input { flex: 1; border: 0; background: none; font-size: 16px; padding: 8px 0; outline: none; }
.cmdk-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.cmdk-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm, 8px); cursor: pointer; }
.cmdk-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.cmdk-list em { font-style: normal; font-size: 12px; color: var(--muted); }
.cmdk-list .none { color: var(--muted); cursor: default; }
.cmdk-hint { font-size: 11.5px; color: var(--muted); padding: 8px 12px 2px; }

/* popovers, menus, notifications */
.pop { position: fixed; z-index: 90; min-width: 190px; max-width: min(360px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm, 10px); box-shadow: 0 18px 50px rgba(0,0,0,.22); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
.pop.in { opacity: 1; transform: none; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop-notes { width: 340px; padding: 0; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.notes ul { list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow: auto; }
.notes li { display: grid; gap: 2px; padding: 9px 10px 9px 22px; border-radius: 6px; position: relative; font-size: 13px; }
.notes li.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes li.k-bad.unread::before { background: var(--bad); }
.notes li.k-warn.unread::before { background: var(--warn); }
.notes time { font-size: 11.5px; color: var(--muted); }
.notes .none { color: var(--muted); padding-left: 10px; }
.bell-n { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.ring .ic { animation: ring 2.6s ease-in-out infinite; transform-origin: 50% 10%; }
@keyframes ring { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(14deg); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }

/* toasts and tooltip */
#toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r-sm, 10px); background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); }
.toast.out { opacity: 0; transform: translateY(8px); transition: .3s; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.warn .toast-dot { background: var(--warn); } .toast.bad .toast-dot { background: var(--bad); } .toast.info .toast-dot { background: var(--info); }
.toast-act { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0 0 0 6px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
#tip { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--tip-bg, #10131c); color: #f2f4fa; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .12s; max-width: 260px; }
#tip.on { opacity: 1; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
#tip div { white-space: nowrap; }

/* segmented range switch */
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: var(--r-sm, 9px); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: calc(var(--r-sm, 9px) - 2px); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: calc(var(--r-sm, 9px) - 2px); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .32s cubic-bezier(.3,1.3,.5,1), width .32s; }

/* tables */
.tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.tbl-search { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); background: var(--surface2, var(--surface)); color: var(--muted); }
.tbl-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); padding: 7px 0; }
.tbl-search:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: .2s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-n { font-size: 11px; opacity: .7; }
.tbl-wrap { overflow-x: auto; border-radius: var(--r-sm, 8px); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr[data-id] { cursor: pointer; transition: background .15s; }
.tbl tbody.anim tr[data-id] { animation: rowIn .4s both; animation-delay: calc(var(--i) * 25ms); }
.tbl tbody tr.fresh td { animation: rowFresh 1.2s ease-out; }
@keyframes rowFresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.tbl tbody tr[data-id]:hover, .tbl tbody tr[data-id]:focus-visible { background: color-mix(in srgb, var(--accent) 7%, transparent); outline: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(5px); } }
.tbl .r { text-align: right; } .tbl th.r .th-btn { justify-content: flex-end; width: 100%; }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.sort-ic { width: 0; height: 0; border: 4px solid transparent; border-top-color: currentColor; opacity: .25; margin-top: 4px; }
[aria-sort="ascending"] .sort-ic { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 0 4px; opacity: .9; }
[aria-sort="descending"] .sort-ic { opacity: .9; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.pg-btns { display: inline-flex; align-items: center; gap: 4px; }
.cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cell-main b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-main small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* charts */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart-svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart-svg .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; transition: cy .12s; }
.chart-empty { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fadeIn 1s .25s both; }
@keyframes fadeIn { from { opacity: 0; } }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.bar { transition: opacity .15s; } .bar:hover { opacity: .8; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-v { display: grid; gap: 7px; margin: 0; flex: 1; min-width: 150px; }
.lg-v li { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; }
.lg-v b { color: var(--ink); font-weight: 600; } .lg-v em { font-style: normal; text-align: right; }
.donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-ring { position: relative; flex: none; }
.donut-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 8%, transparent); }
.dseg { fill: none; }
.dseg { transition: opacity .15s; } .dseg:hover { opacity: .78; }
.sweep { animation: sweep 1.1s cubic-bezier(.4,0,.2,1) both; }
@keyframes sweep { from { stroke-dasharray: 0 var(--c); } }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c b { font-size: 22px; line-height: 1.1; } .donut-c span { font-size: 11.5px; color: var(--muted); }
.spark { display: block; overflow: visible; } .spark path.draw { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hbars { display: grid; gap: 11px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
.hb-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 7%, transparent); overflow: hidden; }
.hb-fill { height: 100%; width: var(--w); border-radius: inherit; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes hbIn { from { width: 0; } }
.heat { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }
.heat .hx { text-align: center; } .heat .hy { padding-right: 6px; align-self: center; white-space: nowrap; }
.hc { aspect-ratio: 1.5; min-height: 10px; border-radius: 3px; opacity: var(--a); animation: cellIn .45s var(--d) both; }
.hc:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
@keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
.gauge { position: relative; margin: 0 auto; width: 100%; }
.gauge svg { display: block; overflow: visible; }
.g-bg, .g-val { fill: none; stroke-width: 14; stroke-linecap: round; }
.g-bg { stroke: color-mix(in srgb, var(--ink) 9%, transparent); }
.gsweep { animation: gsweep 1.3s cubic-bezier(.3,0,.2,1) both; }
@keyframes gsweep { from { stroke-dasharray: 0 1; } }
.g-num { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; display: grid; }
.g-num b { font-size: 28px; line-height: 1; } .g-num span { font-size: 12px; color: var(--muted); }
.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 8px; }
.fn-bar { width: var(--w); min-width: fit-content; display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm, 8px); color: #fff; font-size: 12.5px; animation: hbIn 1s cubic-bezier(.2,.8,.2,1) both; overflow: hidden; white-space: nowrap; }
.fn-row em { font-style: normal; font-size: 12px; color: var(--muted); text-align: right; }

/* drag board */
.kboard { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.kcol { display: flex; flex-direction: column; min-height: 220px; border-radius: var(--r, 12px); }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.kcol-h h3 { font-size: 13.5px; flex: 1; }
.kdot { width: 9px; height: 9px; border-radius: 50%; }
.kcount { font-size: 12px; color: var(--muted); }
.klist { display: grid; gap: 9px; padding: 6px 8px 12px; min-height: 80px; flex: 1; align-content: start; border-radius: var(--r, 12px); transition: background .2s; }
.klist.kover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.kcard { position: relative; padding: 11px 12px; padding-right: 36px; border-radius: var(--r-sm, 10px); background: var(--surface); border: 1px solid var(--line); cursor: grab; user-select: none; transition: transform .15s, box-shadow .2s; }
@media (pointer: fine) { .kcard { touch-action: none; } }
.kcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
.kmove { position: absolute; top: 5px; right: 4px; width: 28px; height: 28px; }
.kdragging { opacity: .25; }
.kghost { position: fixed; left: 0; top: 0; z-index: 110; pointer-events: none; box-shadow: 0 22px 48px rgba(0,0,0,.3); cursor: grabbing; }
.kph { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: var(--r-sm, 10px); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.kempty { padding: 18px 8px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-sm, 10px); }
.kdrop { animation: kdrop .6s cubic-bezier(.2,.9,.3,1.4); }
@keyframes kdrop { 0% { transform: scale(.92); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 60% { box-shadow: 0 0 0 10px transparent; } 100% { transform: none; } }

/* page entrance (each app restyles @keyframes rise) */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .drawer { border-radius: 0; } }

/* =========================================================
   2. Shell: an emerald sidebar with a notched active tab
   ========================================================= */
.skip { position: absolute; left: -999px; top: 8px; z-index: 200; background: var(--tang); color: #fff; padding: 8px 12px; border-radius: 12px; }
.skip:focus { left: 8px; }
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; overflow-x: clip; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 0 16px 14px; background: linear-gradient(170deg, var(--rail), var(--rail2)); color: var(--rail-ink); overflow-y: auto; scrollbar-width: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 18px 6px; text-decoration: none; color: #fff; }
.brand svg { width: 38px; height: 38px; }
.brand b { font-size: 19px; font-weight: 900; letter-spacing: -.02em; }
.brand small { display: block; font-size: 11.5px; opacity: .75; font-weight: 600; }
.nav { position: relative; display: grid; gap: 4px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 16px 0 0 16px; text-decoration: none; color: var(--rail-ink); font-weight: 750; font-size: 14.5px; transition: color .25s; }
.nav a .ic { width: 20px; height: 20px; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: var(--accent); }
[data-theme="dark"] .nav a[aria-current="page"] { color: var(--accent); }
.nav-n { margin-left: auto; margin-right: 6px; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--tang); color: #fff; font-size: 11px; line-height: 20px; text-align: center; font-weight: 900; }
.nav-n:empty { display: none; }
.nav-marker { position: absolute; left: 0; right: 0; top: 0; background: var(--bg); border-radius: 16px 0 0 16px; transition: transform .45s cubic-bezier(.3, 1.3, .4, 1), height .3s; pointer-events: none; }
.nav-marker::before, .nav-marker::after { content: ""; position: absolute; right: 0; width: 18px; height: 18px; background: transparent; }
.nav-marker::before { top: -18px; border-bottom-right-radius: 18px; box-shadow: 6px 6px 0 6px var(--bg); }
.nav-marker::after { bottom: -18px; border-top-right-radius: 18px; box-shadow: 6px -6px 0 6px var(--bg); }
.side-card { margin: auto 14px 0 0; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, .1); font-size: 12.5px; }
.side-card b { display: block; color: #fff; font-size: 20px; }
.side-card .hb-track { background: rgba(255, 255, 255, .15); margin-top: 8px; }
.main { min-width: 0; padding: 18px 26px 50px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.menu-btn { display: none; }
.find { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 420px; height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); text-align: left; }
.find span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 11px var(--mono); padding: 1px 6px; border-radius: 6px; background: var(--surface2); }
.tops { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { border-radius: 14px; }
.t-ic .i-sun { display: none; } [data-theme="dark"] .t-ic .i-sun { display: block; } [data-theme="dark"] .t-ic .i-moon { display: none; }
.nav-scrim { display: none; }
.view { outline: none; }

/* =========================================================
   3. Cards and bits
   ========================================================= */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.ph h1 { font-size: 28px; font-weight: 900; letter-spacing: -.03em; }
.ph h1:focus { outline: none; }
.ph p { color: var(--muted); margin-top: 3px; font-weight: 600; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 99px; font-weight: 800; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.tang { background: var(--tang); border-color: var(--tang); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
.card, .kpi { background: var(--surface); border-radius: var(--r); padding: 18px; border: 1px solid var(--line); min-width: 0; transition: transform .25s cubic-bezier(.3, 1.5, .5, 1), box-shadow .25s; }
.card:hover, .kpi:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -18px rgba(12, 110, 76, .45); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 900; }
.kpi { display: grid; gap: 4px; position: relative; overflow: hidden; }
.kpi span { color: var(--muted); font-size: 13px; font-weight: 750; }
.kpi b { font-size: 28px; font-weight: 900; letter-spacing: -.03em; }
.kpi small { font-size: 12px; font-weight: 700; color: var(--muted); }
.kpi small.up { color: var(--ok); }
.kpi .k-ic { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--kc) 15%, transparent); color: var(--kc); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.pill { border-radius: 99px; font-weight: 800; }
.chip { font-weight: 800; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ch { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 800; color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); white-space: nowrap; }
.ch .ic { width: 13px; height: 13px; }
.ch.SMS { --cc: var(--sms); } .ch.WhatsApp { --cc: var(--wa); } .ch.Email { --cc: var(--mail); }
.av { font-weight: 900; }

/* inbox: three panes */
.inbox { display: grid; grid-template-columns: 310px minmax(0, 1fr) 270px; height: calc(100vh - 150px); min-height: 520px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.convs { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
.convs-h { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.convs-h .tbl-search { max-width: none; }
.conv-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.conv { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px; border: 0; border-radius: 14px; background: none; text-align: left; transition: background .2s; }
.conv:hover { background: var(--surface2); }
.conv[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.conv .av { width: 40px; height: 40px; }
.conv b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv small { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .meta { display: grid; justify-items: end; gap: 4px; font-size: 11px; color: var(--muted); }
.conv .un { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--tang); color: #fff; font-size: 11px; line-height: 20px; text-align: center; font-weight: 900; }
.conv.unread b { font-weight: 900; } .conv.unread small { color: var(--ink); font-weight: 700; }
.conv.bump { animation: bump .6s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes bump { 30% { transform: scale(1.03); background: color-mix(in srgb, var(--tang) 14%, transparent); } }
.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat-bg); background-image: radial-gradient(color-mix(in srgb, var(--accent) 10%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
.th-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.th-h b { display: block; } .th-h small { color: var(--muted); font-size: 12px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.bub { max-width: min(76%, 460px); padding: 9px 12px 6px; border-radius: 16px 16px 16px 4px; background: var(--them); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); font-size: 14px; animation: bubIn .35s cubic-bezier(.2, 1.3, .4, 1) both; }
.bub.me { align-self: flex-end; border-radius: 16px 16px 4px 16px; background: var(--me); }
.bub p { white-space: pre-wrap; overflow-wrap: anywhere; }
.bub footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; font-size: 11px; color: var(--muted); }
@keyframes bubIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }
.tick { display: inline-flex; width: 18px; height: 12px; color: var(--muted); transition: color .3s; }
.tick svg { width: 18px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tick .t2 { opacity: 0; transition: opacity .3s; }
.tick.delivered .t2, .tick.read .t2 { opacity: 1; }
.tick.read { color: var(--info); }
.day-sep { align-self: center; font-size: 11.5px; font-weight: 800; color: var(--muted); background: var(--surface); padding: 3px 10px; border-radius: 99px; }
.typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--them); }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dotb 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dotb { 50% { transform: translateY(-4px); opacity: .45; } }
.compose { display: flex; gap: 8px; align-items: flex-end; padding: 10px; background: var(--surface); border-top: 1px solid var(--line); }
.compose textarea { flex: 1; min-height: 42px; max-height: 120px; resize: none; border-radius: 20px; padding: 10px 14px; }
.compose .btn { min-height: 42px; }
.send-b { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; transition: transform .15s; }
.send-b:active { transform: scale(.9) rotate(-10deg); }
.cinfo { border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.cinfo h3 { font-size: 16px; font-weight: 900; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts div { padding: 9px 10px; border-radius: 12px; background: var(--surface2); }
.facts span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; } .facts b { font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 800; background: var(--surface2); }
.back-btn { display: none; }

/* phone preview and campaign sending */
.phone { width: 250px; margin: 0 auto; padding: 12px; border-radius: 34px; background: #0e1612; box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .5), inset 0 0 0 2px #2b3a33; }
.screen { position: relative; height: 430px; border-radius: 24px; overflow: hidden; background: var(--chat-bg); display: flex; flex-direction: column; }
.screen-h { display: flex; align-items: center; gap: 8px; padding: 22px 12px 10px; background: var(--rail); color: #fff; font-size: 12.5px; font-weight: 800; }
.screen-h .av { width: 26px; height: 26px; font-size: 10px; }
.notch { position: absolute; top: 6px; left: 50%; width: 70px; height: 16px; margin-left: -35px; border-radius: 99px; background: #0e1612; }
.screen .msgs { padding: 12px; }
.screen .bub { font-size: 12.5px; max-width: 88%; }
.screen.mail { background: #fff; color: #222; }
.mail-prev { padding: 14px; font-size: 12.5px; display: grid; gap: 8px; color: #222; }
.mail-prev b { font-size: 14px; }
.steps-nav { display: flex; gap: 6px; margin-bottom: 14px; }
.steps-nav span { flex: 1; height: 6px; border-radius: 99px; background: var(--line); transition: background .3s; }
.steps-nav span.on { background: var(--accent); }
.wiz { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; }
.chan-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chan-pick label { display: grid; justify-items: center; gap: 6px; padding: 14px 8px; border: 2px solid var(--line); border-radius: 16px; cursor: pointer; font-weight: 800; font-size: 13px; transition: border-color .2s, transform .15s; }
.chan-pick label:hover { transform: translateY(-2px); }
.chan-pick input { position: absolute; opacity: 0; }
.chan-pick label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.chan-pick label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.flock { position: relative; height: 120px; margin-top: 12px; border-radius: 16px; background: var(--surface2); overflow: hidden; }
.flock i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
.flock i.got { background: var(--accent); transform: scale(1.3); }
.flock i.read { background: var(--info); }
.flock .plane { position: absolute; left: 10px; top: 50%; color: var(--tang); }
.sending { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.sending i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--accent), var(--tang)); transition: width .3s; }
.camp-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.camp-stats b { color: var(--ink); }
.tpl-grid, .auto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.tpl { display: grid; gap: 10px; align-content: start; }
.tpl .bub { max-width: 100%; animation: none; background: var(--me); }
.tpl-prev { padding: 12px; border-radius: 14px; background: var(--chat-bg); }
.auto { display: grid; gap: 10px; }
.auto-flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
.auto-flow span { padding: 6px 10px; border-radius: 12px; background: var(--surface2); }
.auto-flow .arrow { background: none; color: var(--muted); padding: 0; }
.tester { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row small { display: block; color: var(--muted); font-size: 12.5px; }

/* =========================================================
   4. Responsive
   ========================================================= */
@media (max-width: 1260px) { .inbox { grid-template-columns: 290px minmax(0, 1fr); } .cinfo { display: none; } }
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: 1 / -1; } .wiz, .tester { grid-template-columns: 1fr; } }
@media (max-width: 880px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: 240px; height: auto; transform: translateX(-104%); transition: transform .32s cubic-bezier(.2, .9, .3, 1); }
  .nav-open .side { transform: none; box-shadow: 20px 0 50px rgba(0, 0, 0, .3); }
  .nav-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(5, 25, 15, .45); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav-open .nav-scrim { opacity: 1; pointer-events: auto; }
  .menu-btn { display: inline-grid; }
  .main { padding: 14px 14px 40px; }
  .inbox { grid-template-columns: 1fr; height: calc(100vh - 130px); }
  .inbox .thread { display: none; } .inbox.open .thread { display: flex; } .inbox.open .convs { display: none; }
  .back-btn { display: inline-grid; }
}
@media (max-width: 560px) { .s3, .s6 { grid-column: 1 / -1; } .ph h1 { font-size: 23px; } .find span, .find kbd { display: none; } .find { flex: 0 0 42px; padding: 0; justify-content: center; } .chan-pick { grid-template-columns: 1fr 1fr 1fr; } .phone { width: 220px; } }
</style>
</head>

    <nav class="nav" aria-label="Pages">

function sendAnim(cp) {

  modal({ title: "Sending", body, actions: [{ label: "Run in background", kind: "ghost" }] });
  const is = $$(".flock i", body), bar = $(".sending i", body); let k = 0;
  const fin = () => { cp.status = "Sent"; cp.sent = n; cp.del = Math.round(n * 0.97); cp.read = Math.round(cp.del * (cp.ch === "Email" ? 0.32 : 0.74)); cp.click = Math.round(cp.read * 0.2); cp.rep = Math.round(cp.read * 0.06); spend(cp.ch, n); save(); chrome(); Notes.add(`“${cp.name}” sent to ${fmt(n)} people`, "info"); if (App.cur === "campaigns") rerender(); };

  const t = setInterval(() => { k++; const f = Math.min(1, k / 30); bar.style.setProperty("--w", f * 100 + "%"); is.forEach((d, i) => { if (i / is.length < f) d.classList.add("got"); if (i / is.length < f - 0.35) d.classList.add("read"); }); const s = $("#sa-s", body); if (s) { s.textContent = fmt(Math.round(n * f)); $("#sa-d", body).textContent = fmt(Math.round(n * f * 0.97)); $("#sa-r", body).textContent = fmt(Math.round(n * Math.max(0, f - 0.35) * 0.74)); } if (k >= 30) { clearInterval(t); fin(); toast(`“${cp.name}” sent`); } }, 100);

  funnel($("#rp-f"), [{ label: "Sent", value: sum(s, (c) => c.sent), color: "var(--c5)" }, { label: "Delivered", value: sum(s, (c) => c.del), color: "var(--c3)" }, { label: "Read", value: sum(s, (c) => c.read), color: "var(--c1)" }, { label: "Clicked", value: sum(s, (c) => c.click), color: "var(--c4)" }, { label: "Replied", value: sum(s, (c) => c.rep), color: "var(--c2)" }]);
  barChart($("#rp-b"), { labels: rangeLabels("12M").slice(-6), series: CH.map((c, i) => ({ name: c, data: wave(6, [76, 58, 31][i], { noise: 0.08, trend: 0.1 }), color: ["var(--wa)", "var(--sms)", "var(--mail)"][i] })), h: 230, fmt: (x) => x + "%", label: "Read rate by channel" });
  heatmap($("#rp-h"), { rows: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], cols: Array.from({ length: 15 }, (_, h) => String(h + 8).padStart(2, "0")), color: "var(--accent)", fmt: (x) => x + "% read in 1 hour", val: (r, c) => Math.round(30 + 40 * Math.exp(-(((c - 4) / 3) ** 2)) + 30 * Math.exp(-(((c - 12) / 2) ** 2)) - (r === 4 ? 12 : 0) + (r > 4 ? 6 : 0)) });
  donut($("#rp-c"), { data: CH.map((c, i) => ({ label: c, value: Math.round(sum(DB.daily[i]) * COST[c]), color: ["var(--wa)", "var(--sms)", "var(--mail)"][i] })), size: 140, thick: 20, sub: "this month", cfmt: "rsk", fmt: rs });
  $("#rp-csv").onclick = () => download("chirpline-campaigns.csv", toCSV(DB.camps, [{ k: "name", label: "Campaign" }, { k: "ch", label: "Channel" }, { k: "status", label: "Status" }, { k: "sent", label: "Sent" }, { k: "del", label: "Delivered" }, { k: "read", label: "Read" }, { k: "rep", label: "Replies" }]));
} };

/* ---------- Settings ---------- */
App.pages.settings = { title: "Settings", render(v) {
  v.innerHTML = head("Settings", "Numbers, shop hours, team and credit") + `
  <div class="grid"><section class="card s6"><div class="card-h"><h2>Channels</h2></div>${CH.map((c) => `<div class="set-row"><div class="row">${chB(c)}<div><b>${esc(DB.chans[c])}</b><small>${c === "WhatsApp" ? "Business number, verified" : c === "SMS" ? "Approved sender name" : "Domain checked and signed"}</small></div></div><button type="button" class="btn sm" data-chan="${c}">${ic("edit")}Change</button></div>`).join("")}</section>
  <section class="card s6"><div class="card-h"><h2>Shop and messages</h2></div><form id="sf" class="form-grid" novalidate><div class="field"><label for="sf-h">Reply hours</label><input id="sf-h" value="${esc(DB.prefs.hours)}" aria-describedby="sf-h-e"><p class="err" id="sf-h-e"></p></div><div class="field"><label for="sf-s">Email signature</label><input id="sf-s" value="${esc(DB.prefs.sig)}"></div><div class="full set-row" style="padding:4px 0"><div><b>Quiet hours</b><small>No campaigns after 9 pm</small></div>${sw("sf-q", DB.prefs.quiet, "Quiet hours")}</div><div class="full"><button type="submit" class="btn primary">Save</button></div></form></section>
  <section class="card s6"><div class="card-h"><h2>Team</h2><button type="button" class="btn sm" id="tm-add">${ic("plus")}Add</button></div><div id="tm"></div></section>
  <section class="card s6"><div class="card-h"><h2>Credit and data</h2></div><div class="set-row"><div><b>${rs(DB.credit)} left</b><small>About ${fmt(Math.round(DB.credit / COST.WhatsApp))} WhatsApp chats</small></div><button type="button" class="btn sm tang" id="cr-add">${ic("plus")}Top up</button></div><div class="set-row"><div><b>Dark theme</b><small>Deep green at night</small></div>${sw("st-dark", Theme.get() === "dark", "Dark theme")}</div><div class="set-row"><div><b>Reset demo data</b><small>Chats, contacts and campaigns go back to the sample</small></div><button type="button" class="btn sm danger ghost" id="st-reset">${ic("refresh")}Reset</button></div></section></div>`;
  const team = () => { $("#tm").innerHTML = DB.team.map((t, i) => `<div class="set-row"><div class="row">${av(t.name)}<div><b>${esc(t.name)}</b><small>${t.role}</small></div></div>${i ? `<button type="button" class="icon-btn" data-rm="${i}" aria-label="Remove ${esc(t.name)}">${ic("trash")}</button>` : pill("Owner", "acc")}</div>`).join(""); };
  team();
  on(v, "click", "[data-chan]", (e, b) => { const c = b.dataset.chan; formLayer({ title: "Change " + c, values: { val: DB.chans[c] }, fields: [{ k: "val", label: c === "WhatsApp" ? "Business number" : c === "SMS" ? "Sender name" : "From address", req: true, full: true, check: (x) => (c === "Email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x) ? "Enter an email address" : c === "WhatsApp" && !/^\+92 ?3\d{2} ?\d{7}$/.test(x) ? "Use +92 3xx xxxxxxx" : "") }], onSubmit: (x) => { DB.chans[c] = x.val; save(); rerender(); toast(c + " updated"); } }); });
  $("#sf").onsubmit = (e) => { e.preventDefault(); const h = $("#sf-h").value.trim(); $("#sf-h-e").textContent = /^\d{2}:\d{2} to \d{2}:\d{2}$/.test(h) ? "" : "Write it like 10:00 to 21:00"; if ($("#sf-h-e").textContent) return $("#sf-h").focus(); Object.assign(DB.prefs, { hours: h, sig: $("#sf-s").value.trim(), quiet: $("#sf-q").checked }); save(); toast("Saved"); };
  on($("#tm"), "click", "[data-rm]", async (e, b) => { const t = DB.team[+b.dataset.rm]; if (await confirmBox("Remove " + t.name + "?", "Their chats move to you.", "Remove")) { DB.convs.forEach((c) => { if (c.owner === t.name) c.owner = ME; }); DB.team.splice(+b.dataset.rm, 1); save(); team(); toast(t.name + " removed", "warn"); } });
  $("#tm-add").onclick = () => formLayer({ title: "Add a teammate", fields: [{ k: "name", label: "Name", req: true }, { k: "role", label: "Role", type: "select", options: ["Sales", "Support", "Manager"] }], onSubmit: (x) => { DB.team.push(x); save(); team(); toast(x.name + " added"); } });
  $("#cr-add").onclick = () => formLayer({ title: "Top up credit", submit: "Add credit", fields: [{ k: "amt", label: "Amount (Rs)", type: "number", min: 500, max: 200000, req: true, value: 5000 }, { k: "via", label: "Pay by", type: "select", options: ["Bank transfer", "Card", "Mobile wallet"] }], onSubmit: (x) => { DB.credit += x.amt; save(); chrome(); rerender(); toast(`${rs(x.amt)} added by ${x.via.toLowerCase()}`); } });
  $("#st-dark").onchange = (e) => Theme.set(e.target.checked ? "dark" : "light");
  $("#st-reset").onclick = async () => { if (await confirmBox("Reset demo data?", "Everything returns to the sample shop.", "Reset")) { store.del(KEY); DB = seed(); cvSel = null; chrome(); rerender(); toast("Demo data reset"); } };
} };

/* ---------- Live: customers keep writing in ---------- */
every(8000, () => {
  if (chance(0.35)) return;
  const cv = pick(DB.convs); if (!cv) return; const c = C(cv.contact), m = { from: "them", text: pick(ASK), t: Date.now(), st: "read" };
  cv.msgs.push(m); cv.status = "Open"; DB.daily[CH.indexOf(cv.ch)][29]++;
  if (App.cur === "inbox" && cvSel === cv.id && $("#msgs")) { $("#msgs").insertAdjacentHTML("beforeend", bubble(m)); $("#msgs").scrollTop = 1e6; } else { cv.unread++; Notes.add(`${c.name} on ${cv.ch}: “${m.text.slice(0, 40)}…”`, "info"); }
  save(); chrome();
  if (App.cur === "inbox" && App.inboxDraw) { App.inboxDraw(); const b = $(`.conv[data-cv="${cv.id}"]`); b && b.classList.add("bump"); }
  const k = $("#k-today"); k && countUp(k, sum(DB.daily, (d) => d[29]), fmt, 400);
});
App.commands = () => [{ label: "New campaign", hint: "Campaigns", run: newCampaign }, { label: "Add a contact", hint: "Contacts", run: () => editContact(null) }, ...DB.convs.slice(0, 12).map((cv) => ({ label: "Chat with " + C(cv.contact).name, hint: cv.ch, run: () => { cvSel = cv.id; go("#/inbox"); } })), ...DB.camps.map((cp) => ({ label: cp.name, hint: "Campaign", run: () => openCamp(cp) }))];
App.onTheme = (t) => { const s = $("#st-dark"); if (s) s.checked = t === "dark"; };
[["Hina Akhtar on WhatsApp: “Is the lawn suit in sky blue…”", "info", 6], ["Template new_arrivals is waiting for approval", "warn", 90], ["“Winter lawn launch” got 214 replies", "info", 400]].forEach(([t, k, m]) => Notes.add(t, k, Date.now() - m * MIN));
chrome();
boot({ title: "Chirpline", key: "chirpline", def: "overview" });
</script>
</body>
</html>
