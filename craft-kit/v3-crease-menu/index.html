<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crease Menu · origami hamburger menu</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: washi paper, vermilion and indigo ink ---------- */
  :root {
    color-scheme: light;
    --bg: #f3ebdd;
    --bg2: #ead9c0;
    --site: #fbf6ec;
    --paper: #fffaf1;
    --paper2: #f1e5cf;
    --back: #eadcc3;
    --rule: #e6d9c2;
    --ink: #1f2436;
    --ink2: #5e6172;
    --soft: #a59f94;
    --red: #e0442d;
    --red2: #b9321f;
    --indigo: #263364;
    --cream: #f6e7c8;
    --cream2: #e4cfa4;
    --shadow: rgba(60, 40, 20, .25);
    --focus: #263364;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1324;
    --bg2: #1b2142;
    --site: #151a30;
    --paper: #212844;
    --paper2: #1b2139;
    --back: #2a3152;
    --rule: #2b3354;
    --ink: #eef0f8;
    --ink2: #a8adc4;
    --soft: #6c7290;
    --red: #ff6a4f;
    --red2: #d9482f;
    --indigo: #8ea4ff;
    --cream: #e9dcc0;
    --cream2: #c9b68e;
    --shadow: rgba(0, 0, 0, .6);
    --focus: #ffb199;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(55% 45% at 85% 10%, var(--bg2), transparent 70%),
      repeating-linear-gradient(115deg, rgba(120, 90, 40, .035) 0 1px, transparent 1px 7px),
      var(--bg);
  }
  .stage { position: relative; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 18px 14px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .site {
    position: relative;
    width: min(840px, 100%);
    min-height: 500px;
    border-radius: 28px;
    background:
      repeating-linear-gradient(35deg, rgba(120, 90, 40, .03) 0 1px, transparent 1px 9px),
      var(--site);
    box-shadow: 0 44px 90px -50px var(--shadow), 0 0 0 1px var(--rule);
    overflow: hidden;
  }

  /* ---------- Header + the folding hamburger ---------- */
  .top { position: relative; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 38px; height: 38px; flex: none; }
  .brand b { display: block; font: 700 18px var(--serif); letter-spacing: -.01em; }
  .brand small { display: block; font-size: 12px; color: var(--ink2); }
  .menu {
    position: relative; display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 14px 9px 12px; border: 0; border-radius: 14px;
    background: var(--paper); box-shadow: 0 0 0 1px var(--rule), 0 10px 18px -14px var(--shadow);
    font-size: 14px; font-weight: 750;
    transition: transform .3s var(--spring);
  }
  .menu:active { transform: scale(.95); }
  .ham { position: relative; width: 26px; height: 22px; flex: none; }
  .ham i { position: absolute; left: 2px; right: 2px; height: 3px; border-radius: 2px; background: var(--ink); transform-origin: 50% 50%; }
  .ham i:nth-child(1) { top: 4px; }
  .ham i:nth-child(2) { top: 9.5px; right: 8px; animation: breathe 3.4s ease-in-out infinite; }
  .ham i:nth-child(3) { top: 15px; }
  @keyframes breathe { 50% { right: 2px; } }
  .sq { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 2px; background: linear-gradient(135deg, var(--cream) 50%, var(--cream2) 50%); box-shadow: 0 2px 4px rgba(0, 0, 0, .15); opacity: 0; transform: scale(.2) rotate(45deg); }
  .lbl { position: relative; display: inline-grid; overflow: hidden; height: 20px; line-height: 20px; }
  .lbl span { grid-area: 1 / 1; transition: transform .45s var(--spring), opacity .3s; }
  .lbl span:last-child { transform: translateY(100%); opacity: 0; }
  .menu[aria-expanded="true"] .lbl span:first-child { transform: translateY(-100%); opacity: 0; }
  .menu[aria-expanded="true"] .lbl span:last-child { transform: none; opacity: 1; }

  /* ---------- Hero (changes with the page you pick) ---------- */
  .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: center; gap: 18px; padding: 18px 30px 34px; min-height: 400px; }
  .kick { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  .kick::before { content: ""; width: 22px; height: 2px; background: currentColor; }
  .hl { position: relative; overflow: hidden; }
  .hero h1 { margin: 0 0 12px; font: 700 clamp(30px, 5.4vw, 48px)/1.04 var(--serif); letter-spacing: -.02em; }
  .hero p { margin: 0 0 20px; max-width: 40ch; color: var(--ink2); font-size: 15.5px; line-height: 1.55; }
  .cta { display: inline-flex; align-items: center; gap: 9px; padding: 12px 18px; border: 0; border-radius: 14px; background: var(--red); color: #fff; font-weight: 750; box-shadow: 0 14px 24px -14px var(--red2); transition: transform .3s var(--spring); }
  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: scale(.96); }
  .cta.done { background: var(--indigo); }
  :root[data-theme="dark"] .cta.done { color: #10142a; }
  .art { position: relative; display: grid; place-items: center; height: 280px; perspective: 900px; }
  .art svg { width: min(300px, 100%); height: auto; filter: drop-shadow(0 24px 22px var(--shadow)); animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-2deg); } }
  .shadow { position: absolute; bottom: 18px; left: 50%; width: 170px; height: 18px; margin-left: -85px; border-radius: 50%; background: radial-gradient(closest-side, var(--shadow), transparent); animation: shadow 6s ease-in-out infinite; }
  @keyframes shadow { 50% { transform: scaleX(.85); opacity: .7; } }
  .tape { position: absolute; width: 70px; height: 18px; border-radius: 2px; background: color-mix(in srgb, var(--red) 30%, transparent); transform: rotate(-12deg); }

  /* ---------- The origami sheet: six panels that unfold one from another ---------- */
  .veil { position: absolute; inset: 0; z-index: 4; background: color-mix(in srgb, var(--site) 70%, transparent); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .veil.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; z-index: 5; right: 18px; top: 74px;
    width: min(560px, calc(100% - 36px));
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 112px);
    perspective: 1300px;
    filter: drop-shadow(0 26px 26px var(--shadow));
  }
  .sheet[hidden] { display: none; }
  .pn { position: relative; display: block; transform-style: preserve-3d; visibility: hidden; }
  .pn .fr, .pn .bk { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .pn .fr {
    display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; align-content: center; column-gap: 12px;
    padding: 14px 16px;
    background:
      repeating-linear-gradient(80deg, rgba(120, 90, 40, .04) 0 1px, transparent 1px 6px),
      linear-gradient(135deg, var(--paper), var(--paper2));
    box-shadow: inset 0 0 0 .5px rgba(120, 90, 40, .18);
    transition: background .25s;
  }
  .pn .bk { background: repeating-linear-gradient(-30deg, rgba(0, 0, 0, .04) 0 2px, transparent 2px 8px), var(--back); }
  .pn.g .bk { display: none; }
  .pn.y .bk { transform: rotateY(180deg); }
  .pn.x .bk { transform: rotateX(180deg); }
  .pn .shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .pn.y .shade { background: linear-gradient(270deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, 0) 70%); }
  .pn.x .shade { background: linear-gradient(180deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, 0) 70%); }
  .pn:nth-child(1) .fr { border-radius: 10px 0 0 0; }
  .pn:nth-child(2) .fr, .pn:nth-child(2) .bk { border-radius: 0 10px 0 0; }
  .pn:nth-child(5) .fr, .pn:nth-child(5) .bk { border-radius: 0 0 0 10px; }
  .pn:nth-child(6) .fr, .pn:nth-child(6) .bk { border-radius: 0 0 10px 0; }
  .pn:nth-child(1) .bk { border-radius: 10px 0 0 0; }
  .num { grid-row: span 2; align-self: center; font: 700 30px var(--serif); color: var(--red); letter-spacing: -.03em; line-height: 1; }
  .nm { font: 700 18px var(--serif); letter-spacing: -.01em; align-self: end; }
  .cap { font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .here { position: absolute; right: 12px; top: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 22%, transparent); opacity: 0; transform: scale(.4); transition: opacity .3s, transform .4s var(--spring); }
  .pn[aria-current="page"] .here { opacity: 1; transform: none; }
  .pn:hover .fr, .pn.hov .fr { background: repeating-linear-gradient(80deg, rgba(120, 90, 40, .04) 0 1px, transparent 1px 6px), linear-gradient(135deg, var(--cream), var(--paper)); }
  .pn:hover .num, .pn.hov .num { animation: nod .5s var(--spring); }
  @keyframes nod { 40% { transform: translateY(-4px) rotate(-6deg); } }
  .pn:focus-visible { outline: none; }
  .pn:focus-visible .fr { box-shadow: inset 0 0 0 3px var(--focus); }
  .bit { position: absolute; z-index: 8; width: 10px; height: 10px; pointer-events: none; clip-path: polygon(0 0, 100% 50%, 0 100%); }

  @media (max-width: 640px) {
    .site { border-radius: 22px; min-height: 560px; }
    .top { padding: 14px; }
    .hero { grid-template-columns: 1fr; padding: 6px 18px 26px; gap: 0; }
    .art { height: 190px; order: -1; }
    .art svg { width: 210px; }
    .sheet { left: 12px; right: 12px; width: auto; top: 70px; grid-template-rows: repeat(3, 104px); }
    .pn .fr { padding: 12px; column-gap: 8px; }
    .num { font-size: 22px; }
    .nm { font-size: 16px; }
    .cap { font-size: 11.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="site" id="site">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 38 38" aria-hidden="true"><path d="M4 30 L19 4 L34 30 Z" fill="var(--red)"/><path d="M19 4 L19 30 L34 30 Z" fill="var(--red2)"/><path d="M4 30 L19 22 L34 30 Z" fill="var(--indigo)" opacity=".85"/></svg>
        <div><b>Fold &amp; Ink</b><small>Paper studio · Lahore</small></div>
      </div>
      <button class="menu" id="menuBtn" type="button" aria-expanded="false" aria-controls="sheet">
        <span class="ham" aria-hidden="true"><i></i><i></i><i></i><span class="sq"></span></span>
        <span class="lbl"><span>Menu</span><span>Close</span></span>
      </button>
    </header>

    <section class="hero" aria-live="off">
      <div>
        <p class="kick" id="kick">Welcome</p>
        <div class="hl"><h1 id="h1">Paper, folded with care</h1></div>
        <p id="lead">Handmade notebooks, cards and folding kits from a small studio in Lahore. Open the menu: it unfolds like the paper we sell.</p>
        <button class="cta" id="cta" type="button">Browse the shop</button>
      </div>
      <div class="art" id="art" aria-hidden="true"><span class="tape" style="left:12%;top:16%"></span><span class="shadow"></span></div>
    </section>

    <div class="veil" id="veil" aria-hidden="true"></div>
    <nav class="sheet" id="sheet" aria-label="Main menu" hidden></nav>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </div>
</main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const live = $("#live");
  const say = (t) => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 40); };

  // ---------- Pages and their folded-paper drawings ----------
  const R = "var(--red)", R2 = "var(--red2)", I = "var(--indigo)", C = "var(--cream)", C2 = "var(--cream2)";
  const poly = (pts, f, o) => '<polygon points="' + pts + '" fill="' + f + '"' + (o ? ' opacity="' + o + '"' : "") + "/>";
  const ART = {
    home: poly("80,14 80,74 34,74", C) + poly("80,14 80,74 126,74", C2) + poly("18,74 142,74 118,104 42,104", R) + poly("42,104 80,86 118,104", R2) + '<path d="M10 114 C 40 106 60 122 90 114 S 140 106 152 114" fill="none" stroke="' + I + '" stroke-width="3" stroke-linecap="round" opacity=".5"/>',
    shop: poly("34,40 80,22 126,40 80,58", C) + poly("34,40 80,58 80,110 34,92", R) + poly("126,40 80,58 80,110 126,92", R2) + poly("52,33 80,22 108,33 80,44", C2) + '<path d="M62 32 C 62 6 98 6 98 32" fill="none" stroke="' + I + '" stroke-width="4" stroke-linecap="round"/>',
    workshops: poly("80,8 80,62 96,48", C) + poly("80,8 80,62 64,48", C2) + poly("152,48 80,62 104,74", R) + poly("152,48 80,62 96,48", R2) + poly("124,112 80,62 104,74", C2) + poly("124,112 80,62 80,88", C) + poly("36,112 80,62 80,88", R2) + poly("36,112 80,62 56,74", R) + poly("8,48 80,62 56,74", C) + poly("8,48 80,62 64,48", C2),
    journal: poly("20,30 140,30 140,104 20,104", C) + poly("20,104 80,64 140,104", C2) + poly("20,30 80,74 140,30", R) + poly("20,30 80,52 140,30", R2) + '<circle cx="80" cy="66" r="8" fill="' + I + '"/>',
    about: poly("80,12 140,58 20,58", R) + poly("80,12 140,58 80,58", R2) + poly("30,58 130,58 130,110 30,110", C) + poly("80,58 130,58 130,110 80,110", C2) + poly("66,78 94,78 94,110 66,110", I, ".85"),
    contact: poly("10,62 150,18 64,78", C) + poly("150,18 64,78 78,108", C2) + poly("150,18 78,108 92,80", R) + poly("64,78 78,108 70,84", R2) + '<path d="M18 92 C 34 96 44 104 56 112" fill="none" stroke="' + I + '" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>'
  };
  const PAGES = [
    { id: "home", n: "01", name: "Home", cap: "Start here", kick: "Welcome", h: "Paper, folded with care", p: "Handmade notebooks, cards and folding kits from a small studio in Lahore. Open the menu: it unfolds like the paper we sell.", cta: "Browse the shop" },
    { id: "shop", n: "02", name: "Shop", cap: "Notebooks, cards, kits", kick: "Shop", h: "Notebooks that lie flat", p: "Thread-sewn notebooks from PKR 950, letterpress cards from PKR 300 and gift sets wrapped in block-printed paper.", cta: "Add a notebook" },
    { id: "workshops", n: "03", name: "Workshops", cap: "Saturdays, 11 am", kick: "Workshops", h: "Fold a star with us", p: "Two-hour Saturday classes for ten people. Paper, tea and a little patience are included; you take home everything you fold.", cta: "Save a seat" },
    { id: "journal", n: "04", name: "Journal", cap: "Notes from the studio", kick: "Journal", h: "Notes from the studio", p: "How we choose paper, why grain direction matters and the story of a notebook that crossed three cities in a tiffin box.", cta: "Read the latest" },
    { id: "about", n: "05", name: "About", cap: "Two sisters, one table", kick: "About", h: "Two sisters, one big table", p: "Maryam and Iqra started folding paper at their grandfather's desk. Today the studio has four makers and one very old guillotine.", cta: "Meet the makers" },
    { id: "contact", n: "06", name: "Contact", cap: "Write or visit", kick: "Contact", h: "Send us a note", p: "Studio 4, Gulberg III, Lahore. Open Tuesday to Saturday, 11 am to 7 pm. Orders by email ship across Pakistan in three days.", cta: "Copy our email" }
  ];
  // Unfold plan by grid cell (0..5 in reading order): cell 1 grows out of the button, the rest unfold from a neighbour
  const PLAN = [
    { cell: 1, kind: "grow", at: 0 },
    { cell: 0, kind: "y", at: 260 },
    { cell: 3, kind: "x", at: 500 },
    { cell: 2, kind: "x", at: 560 },
    { cell: 5, kind: "x", at: 760 },
    { cell: 4, kind: "x", at: 820 }
  ];

  // ---------- Build the sheet ----------
  const sheet = $("#sheet"), btn = $("#menuBtn"), veil = $("#veil"), site = $("#site");
  const panels = PAGES.map((pg, k) => {
    const a = document.createElement("a");
    a.href = "#" + pg.id;
    a.className = "pn " + (k === 1 ? "g" : k === 0 ? "y" : "x");
    a.dataset.k = k;
    a.innerHTML = '<span class="fr"><span class="num" aria-hidden="true">' + pg.n + '</span><span class="nm">' + pg.name + '</span><span class="cap">' + pg.cap + '</span><span class="here" aria-hidden="true"></span><span class="shade"></span></span><span class="bk" aria-hidden="true"></span>';
    a.style.transformOrigin = k === 0 ? "100% 50%" : "50% 0";
    sheet.appendChild(a);
    return a;
  });
  const shadeOf = (p) => p.querySelector(".shade");
  let open = false, busy = false, cur = 0;
  const anims = [];
  const run = (el, frames, opts) => { if (reduce) return null; const a = el.animate(frames, Object.assign({ fill: "both" }, opts)); anims.push(a); return a; };
  const clearAnims = () => { while (anims.length) anims.pop().cancel(); };
  const bars = [...btn.querySelectorAll(".ham i")], sq = btn.querySelector(".sq");

  function markCurrent() { panels.forEach((p, k) => { if (k === cur) p.setAttribute("aria-current", "page"); else p.removeAttribute("aria-current"); }); }

  // ---------- Open: bars squeeze into a paper square, the square grows into a panel, the panels unfold ----------
  async function openMenu(fromUser) {
    if (open || busy) return;
    busy = true; open = true;
    btn.setAttribute("aria-expanded", "true");
    sheet.hidden = false;
    veil.classList.add("on");
    clearAnims();
    panels.forEach((p) => { p.style.visibility = "hidden"; p.style.transform = ""; });
    say("Menu open");
    if (reduce) { panels.forEach((p) => { p.style.visibility = "visible"; }); busy = false; if (fromUser) panels[cur].focus(); return; }

    bars.forEach((b, i) => run(b, [{ transform: "none", opacity: 1 }, { transform: "translateY(" + (5.5 - i * 5.5) + "px) scaleX(.5)", opacity: 1, offset: .6 }, { transform: "translateY(" + (5.5 - i * 5.5) + "px) scaleX(0)", opacity: 0 }], { duration: 260, delay: i * 30, easing: "cubic-bezier(.5,0,.5,1)" }));
    run(sq, [{ opacity: 0, transform: "scale(.2) rotate(45deg)" }, { opacity: 1, transform: "scale(1.15) rotate(-6deg)", offset: .7 }, { opacity: 1, transform: "scale(1) rotate(0)" }], { duration: 320, delay: 160, easing: "ease-out" });
    await sleep(430);

    const sr = sq.getBoundingClientRect();
    PLAN.forEach((st) => {
      const p = panels[st.cell];
      setTimeout(() => {
        if (!open) return;
        p.style.visibility = "visible";
        if (st.kind === "grow") {
          const pr = p.getBoundingClientRect();
          const dx = sr.left + sr.width / 2 - (pr.left + pr.width / 2), dy = sr.top + sr.height / 2 - (pr.top + pr.height / 2), s = sr.width / pr.width;
          run(p, [{ transform: "translate(" + dx + "px," + dy + "px) scale(" + s + "," + (sr.height / pr.height) + ") rotate(0deg)" }, { transform: "translate(" + dx * .2 + "px," + dy * .2 + "px) scale(.92) rotate(2deg)", offset: .6 }, { transform: "none" }], { duration: 380, easing: "cubic-bezier(.3,.7,.35,1)" });
          run(sq, [{ opacity: 1 }, { opacity: 0 }], { duration: 90 });
          // the outer bars come back crossed: the button now reads as Close
          run(bars[0], [{ transform: "translateY(5.5px) rotate(0) scaleX(0)", opacity: 0 }, { transform: "translateY(5.5px) rotate(45deg) scaleX(1)", opacity: 1 }], { duration: 420, delay: 180, easing: "cubic-bezier(.34,1.56,.64,1)" });
          run(bars[2], [{ transform: "translateY(-5.5px) rotate(0) scaleX(0)", opacity: 0 }, { transform: "translateY(-5.5px) rotate(-45deg) scaleX(1)", opacity: 1 }], { duration: 420, delay: 240, easing: "cubic-bezier(.34,1.56,.64,1)" });
        } else {
          const axis = st.kind === "y" ? "rotateY" : "rotateX";
          run(p, [{ transform: axis + "(180deg)" }, { transform: axis + "(-8deg)", offset: .82 }, { transform: axis + "(0deg)" }], { duration: 420, easing: "cubic-bezier(.4,.1,.3,1)" });
          run(shadeOf(p), [{ opacity: .9 }, { opacity: 0 }], { duration: 480, easing: "ease-out" });
        }
      }, st.at);
    });
    await sleep(1260);
    busy = false;
    if (open && fromUser) panels[cur].focus({ preventScroll: true });
  }

  // ---------- Close: fold back in reverse, the square shrinks into the button, the bars spring out ----------
  async function closeMenu(focusBtn) {
    if (!open || busy) return;
    busy = true; open = false;
    btn.setAttribute("aria-expanded", "false");
    veil.classList.remove("on");
    say("Menu closed");
    if (reduce) { sheet.hidden = true; busy = false; if (focusBtn) btn.focus(); return; }
    bars.forEach((b) => { b.style.opacity = "0"; }); // keep the bars hidden while the paper folds away
    clearAnims();
    panels.forEach((p) => { p.style.visibility = "visible"; });
    // fold back level by level: each folded panel hides the moment its parent starts to fold
    const LEVELS = [[4, 5], [2, 3], [0], [1]];
    let t = 0;
    for (const lv of LEVELS) {
      for (const cell of lv) {
        const p = panels[cell], st = PLAN.find((s) => s.cell === cell);
        if (st.kind === "grow") {
          const sr = sq.getBoundingClientRect(), pr = p.getBoundingClientRect();
          const dx = sr.left + sr.width / 2 - (pr.left + pr.width / 2), dy = sr.top + sr.height / 2 - (pr.top + pr.height / 2);
          run(p, [{ transform: "none" }, { transform: "translate(" + dx + "px," + dy + "px) scale(" + (sr.width / pr.width) + "," + (sr.height / pr.height) + ")" }], { duration: 330, delay: t, easing: "cubic-bezier(.6,0,.4,1)" });
          run(sq, [{ opacity: 0, transform: "scale(1)" }, { opacity: 1, transform: "scale(1)", offset: .5 }, { opacity: 1, transform: "scale(1)" }], { duration: 200, delay: t + 230 });
        } else {
          const axis = st.kind === "y" ? "rotateY" : "rotateX";
          run(p, [{ transform: axis + "(0deg)" }, { transform: axis + "(180deg)" }], { duration: 250, delay: t, easing: "cubic-bezier(.55,0,.45,1)" });
          run(shadeOf(p), [{ opacity: 0 }, { opacity: .9 }], { duration: 250, delay: t });
          setTimeout(() => { p.style.visibility = "hidden"; }, t + 252);
        }
      }
      t += lv[0] === 1 ? 330 : 250;
    }
    await sleep(t + 40);
    sheet.hidden = true;
    clearAnims();
    run(sq, [{ opacity: 1, transform: "scale(1) rotate(0)" }, { opacity: 0, transform: "scale(.2) rotate(45deg)" }], { duration: 220, easing: "ease-in" });
    bars.forEach((b, i) => run(b, [{ transform: "translateY(" + (5.5 - i * 5.5) + "px) scaleX(0)", opacity: 0 }, { transform: "scaleX(1.12)", opacity: 1, offset: .65 }, { transform: "none", opacity: 1 }], { duration: 440, delay: 120 + i * 60, easing: "cubic-bezier(.3,.8,.4,1)" }));
    await sleep(640);
    bars.forEach((b) => { b.style.opacity = ""; });
    clearAnims();
    busy = false;
    if (focusBtn) btn.focus();
  }

  // ---------- Picking a page: the panel bows, paper bits fly, the menu folds, the hero refolds ----------
  function bits(el) {
    if (reduce) return;
    const r = el.getBoundingClientRect(), s = site.getBoundingClientRect();
    const cx = r.left - s.left + r.width / 2, cy = r.top - s.top + r.height / 2;
    const cols = ["var(--red)", "var(--indigo)", "var(--cream2)", "var(--red2)"];
    for (let i = 0; i < 16; i++) {
      const b = document.createElement("i");
      b.className = "bit";
      b.style.left = cx + "px"; b.style.top = cy + "px"; b.style.background = cols[i % 4];
      site.appendChild(b);
      const a = (i / 16) * Math.PI * 2, v = 60 + Math.random() * 70;
      b.animate([
        { transform: "translate(-50%,-50%) rotate(0) scale(.6)", opacity: 1 },
        { transform: "translate(" + (Math.cos(a) * v) + "px," + (Math.sin(a) * v * .7 + 40) + "px) rotate(" + (200 + Math.random() * 300) + "deg) scale(1)", opacity: 0 }
      ], { duration: 900 + Math.random() * 300, easing: "cubic-bezier(.15,.7,.3,1)" }).onfinish = () => b.remove();
    }
  }
  const art = $("#art");
  function drawArt(id, animate) {
    const old = art.querySelector("svg");
    const svg = '<svg viewBox="0 0 160 124">' + ART[id] + "</svg>";
    if (!animate || reduce) { if (old) old.remove(); art.insertAdjacentHTML("beforeend", svg); return; }
    const go = () => {
      if (old) old.remove();
      art.insertAdjacentHTML("beforeend", svg);
      art.querySelector("svg").animate([{ transform: "rotateX(-90deg) scale(.8)", opacity: 0 }, { transform: "rotateX(12deg) scale(1.03)", opacity: 1, offset: .7 }, { transform: "none", opacity: 1 }], { duration: 640, easing: "cubic-bezier(.3,.7,.3,1)" });
    };
    if (old) old.animate([{ transform: "none", opacity: 1 }, { transform: "rotateX(90deg) scale(.8)", opacity: 0 }], { duration: 300, easing: "ease-in", fill: "forwards" }).onfinish = go;
    else go();
  }
  function showPage(k, animate) {
    const pg = PAGES[k];
    const kick = $("#kick"), h1 = $("#h1"), lead = $("#lead"), cta = $("#cta");
    const apply = () => { kick.textContent = pg.kick; h1.textContent = pg.h; lead.textContent = pg.p; cta.textContent = pg.cta; cta.classList.remove("done"); };
    drawArt(pg.id, animate);
    if (!animate || reduce) { apply(); return; }
    h1.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-100%)", opacity: 0 }], { duration: 260, easing: "ease-in" }).onfinish = () => {
      apply();
      h1.animate([{ transform: "translateY(100%)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 560, easing: "cubic-bezier(.34,1.4,.64,1)" });
      [kick, lead, cta].forEach((el, i) => el.animate([{ transform: "translateY(10px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 480, delay: 80 + i * 80, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }));
    };
  }
  async function choose(k, fromUser) {
    if (busy) return;
    const p = panels[k];
    if (!reduce) {
      p.animate([{ transform: "none" }, { transform: "translateZ(-40px) scale(.96)" }, { transform: "none" }], { duration: 300, easing: "ease-out" });
      bits(p);
      await sleep(260);
    }
    cur = k;
    markCurrent();
    await closeMenu(false);
    showPage(k, true);
    say(PAGES[k].name + " page");
    if (fromUser) btn.focus({ preventScroll: true });
  }

  // ---------- Input ----------
  btn.addEventListener("click", () => { if (open) closeMenu(true); else openMenu(true); });
  veil.addEventListener("click", () => closeMenu(true));
  sheet.addEventListener("click", (e) => { const a = e.target.closest(".pn"); if (!a) return; e.preventDefault(); choose(Number(a.dataset.k), true); });
  sheet.addEventListener("keydown", (e) => {
    const a = e.target.closest(".pn"); if (!a) return;
    const k = Number(a.dataset.k), map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 2, ArrowUp: -2 };
    if (map[e.key] !== undefined) { e.preventDefault(); const n = (k + map[e.key] + 6) % 6; panels[n].focus(); }
  });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && open) closeMenu(true); });
  $("#cta").addEventListener("click", async (e) => {
    const b = e.currentTarget; // keep the button before any await
    const pg = PAGES[cur];
    if (pg.id === "contact") {
      let ok = false;
      try { await navigator.clipboard.writeText("studio@foldandink.example"); ok = true; } catch (err) { ok = false; }
      b.textContent = ok ? "Copied: studio@foldandink.example" : "studio@foldandink.example";
    } else {
      b.textContent = { home: "Opening the shop…", shop: "Added to your bag ✓", workshops: "Seat saved for Saturday ✓", journal: "Opening the journal…", about: "Say hello on Contact" }[pg.id];
    }
    b.classList.add("done");
    b.animate([{ transform: "scale(1)" }, { transform: "scale(1.06)" }, { transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(.34,1.56,.64,1)" });
    say(b.textContent);
    if (pg.id === "home") { await sleep(700); cur = 1; markCurrent(); showPage(1, true); }
  });

  // ---------- Start ----------
  markCurrent();
  showPage(0, false);
  if (!reduce) {
    const items = [...document.querySelectorAll(".brand, .menu, #kick, .hl, #lead, #cta")];
    items.forEach((el, i) => el.animate([{ transform: "translateY(14px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 560, delay: 60 + i * 70, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" }));
    art.querySelector("svg").animate([{ transform: "rotateX(-90deg) scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 700, delay: 200, easing: "cubic-bezier(.3,.7,.3,1)", fill: "backwards" });
  }

  // ---------- Auto demo: open, browse the panels, pick one, until you touch anything ----------
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) { demo = false; panels.forEach((p) => p.classList.remove("hov")); } };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  (async () => {
    await sleep(900);
    const tour = [1, 2, 4, 3, 5, 0];
    let k = 0;
    while (demo) {
      await openMenu(false);
      if (!demo) break;
      const n = tour[k++ % tour.length];
      for (const h of [cur, n]) { panels.forEach((p) => p.classList.toggle("hov", p === panels[h])); await sleep(420); if (!demo) break; }
      panels.forEach((p) => p.classList.remove("hov"));
      if (!demo) break;
      await choose(n);
      await sleep(2600);
    }
  })();
})();
</script>
</body>
