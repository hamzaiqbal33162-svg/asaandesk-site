<!doctype html>
<!-- Chill & Craft · Dye Vat · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dye Vat · colour and size picker</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: linen studio, brass tape, dye tub ---------- */
  :root {
    color-scheme: light;
    --bg1: #fbf4e8;
    --bg2: #e7d6bb;
    --ink: #2a2017;
    --muted: #7d6b55;
    --panel: #fffaf1;
    --well: #f6eddd;
    --line: #e8dbc6;
    --wood: #b07a43;
    --wood-d: #7a4e27;
    --tub: #5d6672;
    --tub-d: #3b424c;
    --tape: #f2d06a;
    --tape-d: #c79f35;
    --brass: #b8893b;
    --btn: #2a2017;
    --btn-ink: #fff8ec;
    --focus: #2563eb;
    --dye: #34479a;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #2a2340;
    --bg2: #0c0a14;
    --ink: #f4ede1;
    --muted: #ab9d8b;
    --panel: #18141f;
    --well: #211b2a;
    --line: #2f2839;
    --tub: #48515e;
    --tub-d: #2a3039;
    --btn: #f4ede1;
    --btn-ink: #1a1420;
    --focus: #93c5fd;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(520px 360px at 50% 30%, color-mix(in srgb, var(--dye) 22%, transparent), transparent 70%),
      radial-gradient(900px 640px at 50% 0%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
    transition: background .6s;
  }
  /* the stage clips anything that slides in, so the page never grows wider than the window */
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; overflow: clip; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .card {
    position: relative;
    width: min(392px, 100%);
    padding: 16px 16px 14px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 30px 60px -30px rgba(60, 35, 10, .45), 0 8px 20px -12px rgba(60, 35, 10, .25);
    animation: rise .7s var(--spring) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }

  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .head h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .price { text-align: right; font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .price b { display: block; font-size: 19px; letter-spacing: -.02em; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- The dye scene ---------- */
  .scene { position: relative; margin: 8px -4px 0; border-radius: 18px; background: radial-gradient(160px 120px at 50% 40%, color-mix(in srgb, var(--dye) 16%, transparent), transparent 75%), var(--well); overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }
  #sway { transform-origin: 160px 6px; animation: sway 3.8s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  .liq { transition: fill .45s ease; }
  .glint { animation: glint 4.5s ease-in-out infinite alternate; }
  @keyframes glint { from { transform: translateX(-26px); } to { transform: translateX(30px); } }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: 0; animation: steam 3.6s ease-out infinite; }
  .steam path:nth-child(2) { animation-delay: 1.2s; }
  .steam path:nth-child(3) { animation-delay: 2.4s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .35; } 100% { opacity: 0; transform: translateY(-26px); } }
  .rp, .drop, .spl { transform-box: fill-box; transform-origin: center; }

  /* ---------- Options ---------- */
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .lab { font-size: 10.5px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .lab em { display: block; margin-top: 2px; font-style: normal; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .swatches { display: flex; gap: 11px; }
  .sw {
    position: relative;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .55), transparent 42%), var(--c);
    box-shadow: inset 0 -5px 9px rgba(0, 0, 0, .25), 0 6px 12px -6px var(--c);
    transition: transform .4s var(--spring), box-shadow .3s;
  }
  .sw:hover { transform: translateY(-2px); }
  .sw[aria-pressed="true"] { transform: translateY(-3px) scale(1.06); box-shadow: inset 0 -5px 9px rgba(0, 0, 0, .25), 0 0 0 3px var(--panel), 0 0 0 5.5px var(--c), 0 10px 16px -8px var(--c); }
  .sw svg { position: absolute; inset: 10px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .35s .1s; }
  .sw[aria-pressed="true"] svg { stroke-dashoffset: 0; }
  .sw:focus-visible, .chip:focus-visible, .add:focus-visible, .step button:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  /* ---------- Tape measure size picker ---------- */
  .tape { position: relative; height: 76px; margin-top: 6px; }
  .strip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4px;
    height: 26px;
    border-radius: 5px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tape) 80%, #fff), var(--tape) 40%, var(--tape-d));
    box-shadow: 0 6px 10px -6px rgba(90, 60, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .6);
    animation: unroll 1.1s .25s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes unroll { from { clip-path: inset(0 100% 0 0 round 5px); } to { clip-path: inset(0 0 0 0 round 5px); } }
  .strip::before {
    content: "";
    position: absolute;
    inset: 0 10px;
    background:
      linear-gradient(90deg, rgba(70, 45, 0, .75) 0 1.5px, transparent 1.5px) 0 0 / calc(100% / 12) 11px repeat-x,
      linear-gradient(90deg, rgba(70, 45, 0, .45) 0 1px, transparent 1px) 0 0 / calc(100% / 24) 6px repeat-x;
  }
  .strip .n { position: absolute; bottom: 2px; transform: translateX(-50%); font-size: 9.5px; font-weight: 750; color: rgba(70, 45, 0, .8); font-variant-numeric: tabular-nums; }
  .marker {
    position: absolute;
    bottom: 17px;
    left: var(--x);
    width: 4px;
    height: 20px;
    margin-left: -2px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--brass), #e7c16d, var(--brass));
    box-shadow: 0 3px 6px rgba(80, 50, 0, .4);
    transition: left .6s var(--spring);
  }
  .marker::before { content: ""; position: absolute; left: -5px; top: -6px; width: 14px; height: 10px; border-radius: 4px 4px 7px 7px; background: var(--brass); }
  .chip {
    position: absolute;
    bottom: 40px;
    left: var(--x);
    min-width: 46px;
    height: 30px;
    padding: 0 8px;
    transform: translateX(-50%);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
    transition: transform .4s var(--spring), background .25s, color .25s, border-color .25s;
  }
  .chip::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 8px; background: var(--line); }
  .chip:hover { transform: translateX(-50%) translateY(-2px); }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); transform: translateX(-50%) translateY(-3px); }
  .chip.sold { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }

  /* ---------- Add button ---------- */
  .add {
    position: relative;
    width: 100%;
    height: 50px;
    margin-top: 10px;
    border: 0;
    border-radius: 16px;
    overflow: hidden;
    background: var(--btn);
    color: var(--btn-ink);
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 12px 22px -14px rgba(40, 20, 0, .8);
    transition: transform .3s var(--spring), background .3s;
  }
  .add::before { content: ""; position: absolute; left: 14px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--dye); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dye) 35%, transparent); transition: background .4s; }
  .add:hover { transform: translateY(-2px); }
  .add.ok { background: #1f8a5b; color: #fff; }
  .add[aria-disabled="true"] { cursor: not-allowed; opacity: .6; }
  .add span { position: relative; }
  .note { margin: 6px 0 0; min-height: 1.3em; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------- Bag ---------- */
  .bag { margin-top: 8px; padding: 8px 12px 4px; border-radius: 16px; background: var(--well); }
  .bag-h { display: flex; align-items: center; gap: 10px; height: 34px; font-size: 13px; font-weight: 700; }
  .bag-ico { position: relative; width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink); }
  .bag-ico svg { width: 22px; height: 22px; }
  .badge { position: absolute; right: -6px; top: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--dye); color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; transition: background .4s; }
  .bag-h .tot { margin-left: auto; font-size: 15px; font-variant-numeric: tabular-nums; }
  .lines { list-style: none; margin: 0; padding: 0; max-height: 132px; overflow-y: auto; }
  .ln { display: grid; grid-template-columns: 16px 1fr auto 82px; align-items: center; gap: 9px; height: 44px; border-top: 1px dashed var(--line); overflow: hidden; font-size: 13px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .25); }
  .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); color: var(--ink); font: inherit; font-size: 15px; line-height: 1; cursor: pointer; }
  .step output { min-width: 16px; text-align: center; font-weight: 750; font-variant-numeric: tabular-nums; }
  .lt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { margin: 0; padding: 12px 0; text-align: center; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); }

  .flyer { position: fixed; left: 0; top: 0; width: 36px; height: 36px; z-index: 30; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .3)); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  @media (max-width: 360px) { .sw { width: 36px; height: 36px; } .swatches { gap: 8px; } .sw svg { inset: 8px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="ttl">
    <header class="head">
      <div><h1 id="ttl">Block-print kurta</h1><p id="sub">Indigo · M · cotton lawn</p></div>
      <div class="price">Price<b id="price">PKR 3,450</b></div>
    </header>

    <!-- The scene: a kurta on a rope pulley above a dye tub. All drawing is SVG. -->
    <div class="scene" id="scene" aria-hidden="true">
      <svg viewBox="0 0 320 196">
        <defs>
          <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d49a5c" /><stop offset="1" stop-color="#7a4e27" /></linearGradient>
          <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22" /><stop offset=".3" stop-color="#000" stop-opacity="0" /><stop offset=".72" stop-color="#fff" stop-opacity=".06" /><stop offset="1" stop-color="#000" stop-opacity=".24" /></linearGradient>
          <linearGradient id="wetG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0" /><stop offset=".5" stop-color="#000" stop-opacity=".28" /><stop offset="1" stop-color="#000" stop-opacity="0" /></linearGradient>
          <linearGradient id="tubG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--tub-d)" /><stop offset=".45" stop-color="var(--tub)" /><stop offset="1" stop-color="var(--tub-d)" /></linearGradient>
          <pattern id="print" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M7 2.6l2.3 4.4L7 11.4 4.7 7z" fill="#fff" opacity=".2" /><circle cx="0" cy="0" r="1.4" fill="#fff" opacity=".26" /><circle cx="14" cy="0" r="1.4" fill="#fff" opacity=".26" /><circle cx="0" cy="14" r="1.4" fill="#fff" opacity=".26" /><circle cx="14" cy="14" r="1.4" fill="#fff" opacity=".26" /></pattern>
          <pattern id="stitch" width="6" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1.5" fill="#fff6df" opacity=".9" /></pattern>
          <clipPath id="shape"><path id="kp" d="M58 8Q80 24 102 8L130 18L156 70L138 80L124 50L126 184Q80 191 34 184L36 50L22 80L4 70L30 18Z" /></clipPath>
          <clipPath id="tubClip"><rect x="0" y="0" width="320" height="172" /></clipPath>
        </defs>

        <line id="rope" x1="160" y1="-4" x2="160" y2="8" stroke="var(--wood-d)" stroke-width="2" />
        <g class="steam" transform="translate(0 0)"><path d="M70 150q-6-8 0-16t0-16" /><path d="M252 152q6-8 0-16t0-16" /><path d="M88 146q-5-7 0-14t0-14" /></g>
        <!-- tub back rim -->
        <ellipse cx="160" cy="171" rx="122" ry="12" fill="var(--tub-d)" />
        <!-- the hanging part: clipped at the dye surface so the dipped half disappears into the tub -->
        <g clip-path="url(#tubClip)">
          <g id="hang">
            <g id="sway">
              <path d="M160 2a5 5 0 1 1 0 8" fill="none" stroke="var(--wood-d)" stroke-width="2.4" stroke-linecap="round" />
              <path d="M160 10L116 28M160 10L204 28" stroke="var(--wood-d)" stroke-width="1.6" />
              <g id="kurta" transform="translate(112 26) scale(.6 .68)">
                <g id="fit">
                  <g clip-path="url(#shape)">
                    <rect id="oldFill" x="-20" y="0" width="200" height="200" fill="#34479a" />
                    <rect id="newFill" x="-20" y="200" width="200" height="200" fill="#34479a" />
                    <rect id="wet" x="-20" y="196" width="200" height="12" fill="url(#wetG)" />
                    <rect x="-20" y="0" width="200" height="200" fill="url(#print)" />
                    <rect x="-20" y="0" width="200" height="200" fill="url(#shade)" />
                    <rect x="-20" y="164" width="200" height="11" fill="url(#stitch)" />
                    <path d="M151.3 60.6L156 70L138 80L134.5 72.5ZM8.7 60.6L4 70L22 80L25.5 72.5Z" fill="#fff6df" opacity=".55" />
                    <path d="M40 150L40 186M120 150L120 186" stroke="#000" stroke-opacity=".25" stroke-width="2" />
                  </g>
                  <path d="M58 8Q80 24 102 8L130 18L156 70L138 80L124 50L126 184Q80 191 34 184L36 50L22 80L4 70L30 18Z" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="1.5" stroke-linejoin="round" />
                  <path d="M54 12Q80 32 106 12" fill="none" stroke="#fff6df" stroke-width="2" stroke-dasharray="3 3" opacity=".9" />
                  <path d="M80 18V62" stroke="#000" stroke-opacity=".25" stroke-width="2" />
                  <circle cx="80" cy="30" r="2.6" fill="#fff6df" /><circle cx="80" cy="42" r="2.6" fill="#fff6df" /><circle cx="80" cy="54" r="2.6" fill="#fff6df" />
                </g>
              </g>
              <rect x="104" y="25" width="112" height="8" rx="4" fill="url(#woodG)" />
              <circle cx="108" cy="29" r="2" fill="#5a3518" /><circle cx="212" cy="29" r="2" fill="#5a3518" />
            </g>
          </g>
        </g>
        <!-- dye surface and the tub front -->
        <ellipse id="liq" class="liq" cx="160" cy="173" rx="114" ry="9" fill="#34479a" />
        <ellipse class="glint" cx="140" cy="171" rx="30" ry="2.4" fill="#fff" opacity=".28" />
        <ellipse id="ripple" class="rp" cx="160" cy="173" rx="70" ry="6" fill="none" stroke="#fff" stroke-width="1.6" opacity="0" />
        <g id="drops"></g>
        <path d="M36 172Q38 196 60 196H260Q282 196 284 172Q260 186 160 186T36 172Z" fill="url(#tubG)" />
        <path d="M38 171a122 12 0 0 0 244 0" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2" />
        <rect x="150" y="186" width="20" height="5" rx="2.5" fill="var(--brass)" />
      </svg>
    </div>

    <div class="opt">
      <div class="lab">Colour<em id="dyeName">Indigo</em></div>
      <div class="swatches" id="sw" role="group" aria-label="Colour"></div>
    </div>

    <div class="opt" style="margin-top:10px">
      <div class="lab">Size</div>
      <div class="lab" style="text-align:right"><em id="chest">Chest 38 in</em></div>
    </div>
    <div class="tape" id="tape" role="group" aria-label="Size">
      <div class="strip" id="strip"></div>
      <i class="marker" id="marker" aria-hidden="true"></i>
    </div>

    <button class="add" id="add" type="button"><span id="addTxt">Add to bag · PKR 3,450</span></button>
    <p class="note" id="note" aria-live="polite">Pick a dye and a size.</p>

    <section class="bag" aria-label="Your bag">
      <div class="bag-h">
        <span class="bag-ico" id="bagIco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /><path d="M9 10V6.5a3 3 0 0 1 6 0V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg><b class="badge" id="badge">1</b></span>
        <span>Your bag</span>
        <b class="tot" id="tot">PKR 3,450</b>
      </div>
      <ul class="lines" id="lines"></ul>
      <p class="empty" id="empty" hidden>Your bag is empty. Dye one up.</p>
    </section>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Dye Vat: the kurta dips into the tub to take its colour; the tape measure picks the size ----------
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 80) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const E = {
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    back: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2),
  };
  function tween(ms, fn, ease) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.max(0, Math.min(1, (now - s) / ms)); fn((ease || E.out)(t)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }
  // One animation at a time: a click during a running sequence waits for it (the newest click wins)
  let busy = false, queued = null;
  function run(fn) {
    return new Promise((res) => {
      const go = async () => {
        busy = true;
        try { await fn(); } finally { busy = false; res(); if (queued) { const q = queued; queued = null; q(); } }
      };
      if (busy) queued = go; else go();
    });
  }

  // ---------- Product data (prices in PKR) ----------
  const DYES = [
    { k: "indigo", name: "Indigo", c: "#34479a" },
    { k: "madder", name: "Madder red", c: "#b63c3a" },
    { k: "turmeric", name: "Turmeric", c: "#d99a1e" },
    { k: "jade", name: "Jade", c: "#1c8b6d" },
  ];
  const SIZES = [
    { k: "S", chest: 36, add: 0, sx: .9 },
    { k: "M", chest: 38, add: 0, sx: 1 },
    { k: "L", chest: 41, add: 200, sx: 1.07 },
    { k: "XL", chest: 44, add: 200, sx: 1.14 },
  ];
  const BASE = 3450, MAXQ = 6;
  const SOLD = { "jade-XL": true }; // one sold-out combination, so that state is designed too
  const unit = (s) => BASE + SIZES[s].add;
  const vkey = (d, s) => DYES[d].k + "-" + SIZES[s].k;
  let dye = 0, size = 1, fit = 1;
  const bag = [{ d: 0, s: 1, q: 1 }];

  const note = (t) => { $("note").textContent = t; };
  const tapeX = (inch) => `calc(10px + (100% - 20px) * ${(inch - 34) / 12})`;

  // ---------- Build the swatches and the tape ----------
  DYES.forEach((D, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sw";
    b.style.setProperty("--c", D.c);
    b.setAttribute("aria-label", D.name);
    b.setAttribute("aria-pressed", String(i === dye));
    b.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 7" /></svg>';
    b.addEventListener("click", () => run(() => dyeTo(i)));
    $("sw").appendChild(b);
  });
  for (let n = 34; n <= 46; n += 2) $("strip").insertAdjacentHTML("beforeend", `<span class="n" style="left:${tapeX(n)}">${n}</span>`);
  SIZES.forEach((S, j) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.style.setProperty("--x", tapeX(S.chest));
    b.textContent = S.k;
    b.setAttribute("aria-label", `Size ${S.k}, chest ${S.chest} inches${S.add ? ", plus PKR " + S.add : ""}`);
    b.setAttribute("aria-pressed", String(j === size));
    b.addEventListener("click", () => run(() => sizeTo(j)));
    $("tape").appendChild(b);
  });
  $("marker").style.setProperty("--x", tapeX(SIZES[size].chest));

  // Arrow keys move through a button group and pick
  function arrows(group, pick) {
    group.addEventListener("keydown", (e) => {
      const bs = [...group.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
      const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (i < 0 || !d) return;
      e.preventDefault();
      const j = (i + d + bs.length) % bs.length;
      bs[j].focus();
      run(() => pick(j));
    });
  }
  arrows($("sw"), (i) => dyeTo(i));
  arrows($("tape"), (j) => sizeTo(j));

  // ---------- Scene helpers ----------
  const SVGNS = "http://www.w3.org/2000/svg";
  const DIP = 72, WICK = 100; // how far the kurta sinks, and the kurta row that reaches the dye surface
  function setDrop(y) { $("hang").setAttribute("transform", `translate(0 ${y.toFixed(1)})`); $("rope").setAttribute("y2", (8 + y).toFixed(1)); }
  function setRise(y) { $("newFill").setAttribute("y", y.toFixed(1)); $("wet").setAttribute("y", (y - 6).toFixed(1)); }
  function setFit(sx) { fit = sx; $("fit").setAttribute("transform", `translate(80 0) scale(${sx.toFixed(3)} 1) translate(-80 0)`); }
  function ripple(big) {
    play($("ripple"), [{ transform: "scale(.2)", opacity: .9 }, { transform: `scale(${big ? 1.5 : 1.1})`, opacity: 0 }], { duration: big ? 900 : 700, easing: "cubic-bezier(.2,.7,.3,1)" });
  }
  // droplets thrown up by the splash: each one follows a small parabola
  function splash(color) {
    if (calm()) return;
    for (let i = 0; i < 9; i++) {
      const c = document.createElementNS(SVGNS, "circle");
      const x = 112 + Math.random() * 96, dx = (Math.random() - .5) * 60, h = 18 + Math.random() * 34;
      c.setAttribute("cx", x); c.setAttribute("cy", 170); c.setAttribute("r", 1.6 + Math.random() * 2);
      c.setAttribute("fill", color); c.setAttribute("class", "spl");
      $("drops").appendChild(c);
      const k = [0, .25, .5, .75, 1].map((t) => ({ transform: `translate(${(dx * t).toFixed(1)}px, ${(-4 * h * t * (1 - t) + 6 * t).toFixed(1)}px)`, opacity: t < .9 ? 1 : 0 }));
      play(c, k, { duration: 520 + Math.random() * 260, easing: "linear" }).then(() => c.remove());
    }
  }
  // drips that fall off the hem after the dip, stretching as they fall
  function drips(color) {
    if (calm()) return;
    [137, 152, 167, 181].forEach((x, i) => {
      const c = document.createElementNS(SVGNS, "ellipse");
      c.setAttribute("cx", x + Math.random() * 6); c.setAttribute("cy", 150); c.setAttribute("rx", 2.2); c.setAttribute("ry", 2.6);
      c.setAttribute("fill", color); c.setAttribute("class", "drop");
      $("drops").appendChild(c);
      play(c, [{ transform: "translateY(0) scale(.4)", opacity: 0 }, { transform: "translateY(0) scale(1)", opacity: 1, offset: .25 }, { transform: "translateY(20px) scale(.8,1.5)", opacity: 1, offset: .9 }, { transform: "translateY(22px) scale(1.8,.4)", opacity: 0 }], { duration: 760, delay: 500 + i * 230, easing: "cubic-bezier(.5,0,.9,.6)", fill: "backwards" }).then(() => { c.remove(); ripple(false); });
    });
  }

  // ---------- Colour: lift, dip, wick the dye up the fabric, drip, settle ----------
  async function dyeTo(i) {
    const btns = [...$("sw").children];
    if (i === dye) { play(btns[i], [{ transform: "translateY(-3px) scale(1.06)" }, { transform: "translateY(-6px) scale(1.12)" }, { transform: "translateY(-3px) scale(1.06)" }], { duration: 320 }); await play($("sway"), [{ transform: "rotate(0)" }, { transform: "rotate(-4deg)" }, { transform: "rotate(3deg)" }, { transform: "rotate(0)" }], { duration: 700 }); return; }
    const D = DYES[i];
    btns.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    note(`Dipping in ${D.name}…`);
    // anticipation: the pulley lifts the kurta a little while the tub takes the new dye
    $("liq").setAttribute("fill", D.c);
    ripple(true);
    await tween(240, (t) => setDrop(-10 * t), E.out);
    // the dip
    await tween(440, (t) => setDrop(-10 + (DIP + 10) * t), E.in);
    splash(D.c);
    ripple(true);
    $("newFill").setAttribute("fill", D.c);
    setRise(WICK);
    await wait(260);
    // the rise: springs out of the tub while the colour wicks up to the shoulders
    drips(D.c);
    await Promise.all([
      tween(900, (t) => setDrop(DIP * (1 - t)), E.back),
      tween(1150, (t) => setRise(WICK * (1 - t) - 8 * t), E.inOut),
    ]);
    $("oldFill").setAttribute("fill", D.c);
    setRise(200);
    play($("sway"), [{ transform: "rotate(0)" }, { transform: "rotate(3.5deg)" }, { transform: "rotate(-2deg)" }, { transform: "rotate(0)" }], { duration: 900, easing: "ease-out" });
    dye = i;
    document.documentElement.style.setProperty("--dye", D.c);
    refreshPicker();
    note(`Dyed ${D.name}. Size ${SIZES[size].k}, ${fmt(unit(size))}.`);
  }

  // ---------- Size: the brass marker slides along the tape and the kurta grows or shrinks ----------
  async function sizeTo(j) {
    const chips = [...$("tape").querySelectorAll(".chip")];
    chips.forEach((b, k) => b.setAttribute("aria-pressed", String(k === j)));
    $("marker").style.setProperty("--x", tapeX(SIZES[j].chest));
    const from = fit, to = SIZES[j].sx, was = size;
    size = j;
    refreshPicker(was !== j);
    play(chips[j], [{ transform: "translateX(-50%) translateY(-3px) scale(1)" }, { transform: "translateX(-50%) translateY(-8px) scale(1.12)" }, { transform: "translateX(-50%) translateY(-3px) scale(1)" }], { duration: 420, easing: "ease-out" });
    await tween(620, (t) => setFit(from + (to - from) * t), E.back);
    note(SOLD[vkey(dye, j)] ? `${DYES[dye].name} in ${SIZES[j].k} is sold out. Try another size.` : `Size ${SIZES[j].k}, chest ${SIZES[j].chest} in. ${fmt(unit(j))}.`);
  }

  // Header, labels and the add button follow the current pick
  let shownPrice = unit(size);
  function refreshPicker(rollPrice) {
    const D = DYES[dye], S = SIZES[size], p = unit(size), sold = SOLD[vkey(dye, size)];
    $("sub").textContent = `${D.name} · ${S.k} · cotton lawn`;
    $("dyeName").textContent = D.name;
    $("chest").textContent = `Chest ${S.chest} in${S.add ? " · + PKR " + S.add : ""}`;
    [...$("tape").querySelectorAll(".chip")].forEach((b, k) => b.classList.toggle("sold", !!SOLD[vkey(dye, k)]));
    $("add").setAttribute("aria-disabled", String(!!sold));
    if (!$("add").classList.contains("ok")) $("addTxt").textContent = sold ? `${D.name} · ${S.k} is sold out` : `Add to bag · ${fmt(p)}`;
    if (rollPrice && p !== shownPrice) { const a = shownPrice; tween(460, (t) => { $("price").textContent = fmt(a + (p - a) * t); }); } else $("price").textContent = fmt(p);
    shownPrice = p;
  }

  // ---------- Bag ----------
  const linesEl = $("lines");
  let shownTotal = 0;
  function lineHTML(l) {
    const D = DYES[l.d], S = SIZES[l.s];
    return `<i class="dot" style="--c:${D.c}"></i><span class="nm"><b>${D.name}</b> · ${S.k}</span>` +
      `<span class="step"><button type="button" data-a="-1" aria-label="One less ${D.name} ${S.k}">−</button><output>${l.q}</output>` +
      `<button type="button" data-a="1" aria-label="One more ${D.name} ${S.k}">+</button></span><b class="lt">${fmt(unit(l.s) * l.q)}</b>`;
  }
  const lineEl = (l) => linesEl.querySelector(`[data-k="${vkey(l.d, l.s)}"]`);
  function addLineEl(l, animate) {
    const li = document.createElement("li");
    li.className = "ln";
    li.dataset.k = vkey(l.d, l.s);
    li.innerHTML = lineHTML(l);
    linesEl.appendChild(li);
    if (animate) { play(li, [{ height: "0px", opacity: 0, transform: "translateX(-14px)" }, { height: "44px", opacity: 1, transform: "none" }], { duration: 460, easing: "cubic-bezier(.2,.9,.3,1.2)" }); linesEl.scrollTop = linesEl.scrollHeight; }
  }
  function updateLine(l) {
    const li = lineEl(l);
    if (!li) return;
    li.querySelector("output").textContent = l.q;
    li.querySelector(".lt").textContent = fmt(unit(l.s) * l.q);
    play(li.querySelector("output"), [{ transform: "scale(1)" }, { transform: "scale(1.5)", color: DYES[l.d].c }, { transform: "scale(1)" }], { duration: 380, easing: "ease-out" });
  }
  function refreshTotals() {
    const n = bag.reduce((a, l) => a + l.q, 0), sum = bag.reduce((a, l) => a + l.q * unit(l.s), 0);
    $("badge").textContent = n;
    $("empty").hidden = n > 0;
    const a = shownTotal;
    shownTotal = sum;
    tween(520, (t) => { $("tot").textContent = fmt(a + (sum - a) * t); });
    play($("badge"), [{ transform: "scale(1)" }, { transform: "scale(1.45)" }, { transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(.34,1.56,.64,1)" });
    return { n, sum };
  }
  async function changeQty(k, delta) {
    const l = bag.find((x) => vkey(x.d, x.s) === k);
    if (!l) return;
    const q = Math.max(0, Math.min(MAXQ, l.q + delta));
    if (q === l.q) { note(`Up to ${MAXQ} of one size per order.`); return; }
    l.q = q;
    if (q === 0) {
      const li = lineEl(l);
      bag.splice(bag.indexOf(l), 1);
      await play(li, [{ height: "44px", opacity: 1, transform: "none" }, { height: "0px", opacity: 0, transform: "translateX(30px)" }], { duration: 360, easing: "cubic-bezier(.5,0,.75,0)" });
      li.remove();
      const t = refreshTotals();
      note(`Removed ${DYES[l.d].name} ${SIZES[l.s].k}. ${t.n ? t.n + " in your bag, " + fmt(t.sum) : "Your bag is empty"}.`);
    } else {
      updateLine(l);
      const t = refreshTotals();
      note(`${DYES[l.d].name} ${SIZES[l.s].k} × ${q}. Bag ${fmt(t.sum)}.`);
    }
  }
  linesEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-a]");
    if (b) run(() => changeQty(b.closest("li").dataset.k, +b.dataset.a));
  });

  // A small folded kurta flies from the scene into the bag along an arc
  async function flyToBag(color) {
    if (calm()) return;
    const a = $("scene").getBoundingClientRect(), b = $("bagIco").getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "flyer";
    f.innerHTML = `<svg viewBox="0 0 36 36"><rect x="4" y="7" width="28" height="24" rx="5" fill="${color}"/><rect x="4" y="22" width="28" height="4" fill="#fff6df" opacity=".6"/><path d="M12 7l6 7 6-7" fill="none" stroke="#fff6df" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
    document.body.appendChild(f);
    const x0 = a.left + a.width / 2 - 18, y0 = a.top + a.height * .42 - 18, x1 = b.left + b.width / 2 - 18, y1 = b.top + b.height / 2 - 18;
    const cx = Math.min(innerWidth - 40, Math.max(x0, x1) + 130), cy = (y0 + y1) / 2 - 30;
    await tween(820, (t) => {
      const u = 1 - t, x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
      const s = t < .15 ? .4 + t * 4 : 1 - t * .55;
      f.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(t * 320).toFixed(0)}deg) scale(${s.toFixed(3)})`;
    }, E.inOut);
    f.remove();
  }

  // ---------- Add to bag ----------
  async function addToBag() {
    const btn = $("add");
    if (SOLD[vkey(dye, size)]) {
      play(btn, [{ transform: "translateX(0)" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "translateX(0)" }], { duration: 380 });
      note(`${DYES[dye].name} in ${SIZES[size].k} is sold out. Try ${SIZES[size - 1].k}.`);
      return;
    }
    const D = DYES[dye], S = SIZES[size];
    let l = bag.find((x) => x.d === dye && x.s === size);
    if (l && l.q >= MAXQ) { note(`Up to ${MAXQ} of one size per order.`); return; }
    play(btn, [{ transform: "scale(1)" }, { transform: "scale(.95)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
    play($("sway"), [{ transform: "rotate(0)" }, { transform: "rotate(-5deg)" }, { transform: "rotate(2deg)" }, { transform: "rotate(0)" }], { duration: 700 });
    await wait(120);
    await flyToBag(D.c);
    if (l) { l.q++; updateLine(l); } else { l = { d: dye, s: size, q: 1 }; bag.push(l); addLineEl(l, true); }
    play($("bagIco"), [{ transform: "scale(1)" }, { transform: "scale(1.3,.78)" }, { transform: "scale(.9,1.14)" }, { transform: "scale(1)" }], { duration: 540, easing: "ease-out" });
    const r = $("bagIco").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, [D.c, "#f2d06a", "#fff6df", D.c]);
    const t = refreshTotals();
    btn.classList.add("ok");
    $("addTxt").textContent = "Added to bag";
    note(`Added ${D.name}, ${S.k}. ${t.n} in your bag, ${fmt(t.sum)}.`);
    setTimeout(() => { btn.classList.remove("ok"); refreshPicker(); }, 1100);
  }
  $("add").addEventListener("click", () => run(addToBag));

  // ---------- Sparkles on a full-window canvas ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  function sizeFx() { const r = devicePixelRatio || 1; fx.width = innerWidth * r; fx.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  sizeFx();
  addEventListener("resize", sizeFx);
  function burst(x, y, colors) {
    if (calm()) return;
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2.2, r: 1.6 + Math.random() * 2.4, c: colors[i % colors.length], life: 1, sq: i % 3 === 0, rot: Math.random() * 6, vr: (Math.random() - .5) * .3 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
  }
  function drawFx() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .16; p.vx *= .98; p.life -= .024; p.rot += p.vr;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.sq) ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Start: the kurta drops in on its rope, then the demo plays ----------
  bag.forEach((l) => addLineEl(l, false));
  refreshPicker();
  refreshTotals();
  setDrop(-150);
  tween(950, (t) => setDrop(-150 * (1 - t)), E.back).then(() => ripple(false));

  // Auto-demo: dyes, resizes and adds, looping until someone touches the page
  const demo = { on: true, n: 0, t: 0 };
  const PLAN = [[1, 2], [2, 0], [3, 1], [0, 3]];
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.t); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  async function demoStep() {
    if (!demo.on) return;
    const [d, s] = PLAN[demo.n++ % PLAN.length];
    await run(() => dyeTo(d));
    if (!demo.on) return;
    await wait(450);
    if (!demo.on) return;
    await run(() => sizeTo(s));
    if (!demo.on) return;
    await wait(500);
    if (!demo.on) return;
    await run(addToBag);
    if (demo.on && bag.length > 2) { await wait(900); if (demo.on) await run(() => changeQty(vkey(bag[0].d, bag[0].s), -bag[0].q)); }
    if (demo.on) demo.t = setTimeout(demoStep, 1600);
  }
  demo.t = setTimeout(demoStep, 1000);
</script>
</body>
</html>
