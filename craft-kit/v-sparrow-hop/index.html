<title>Sparrow Hop · bottom tab bar</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and keep following it)
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var m = matchMedia("(prefers-color-scheme: dark)");
    function set() { document.documentElement.setAttribute("data-theme", q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"); }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colours: warm sunset, plum ink and a coral accent ---------- */
  :root {
    color-scheme: light;
    --bg1: #ffd9c4;
    --bg2: #f6b7a8;
    --bg3: #c9a7d6;
    --screen: #fff8f2;
    --screen2: #fdeee4;
    --bar: rgba(255, 250, 245, .92);
    --line: #f1dfd3;
    --ink: #2d2235;
    --ink2: #6b5d70;
    --soft: #a3929f;
    --accent: #ff6b4a;
    --accent2: #ffb36b;
    --wire: #3b2f40;
    --card1: #ffb38f;
    --card2: #f46f7c;
    --hill: #8d5a86;
    --bird: #a8714a;
    --bird2: #7a4a2c;
    --crown: #8c8a92;
    --belly: #f1e3cf;
    --bib: #231d1f;
    --leg: #9a7154;
    --focus: #ff6b4a;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #2b1b33;
    --bg2: #170f1d;
    --bg3: #3b1f2c;
    --screen: #1b1521;
    --screen2: #241c2b;
    --bar: rgba(34, 26, 41, .94);
    --line: #33283b;
    --ink: #f6ebf1;
    --ink2: #c3b2c2;
    --soft: #8d7d8f;
    --accent: #ff8a6a;
    --accent2: #ffc07c;
    --wire: #c8bccd;
    --card1: #7a3d5c;
    --card2: #c2546a;
    --hill: #3c2346;
    --bird: #b98058;
    --bird2: #8a5a3a;
    --crown: #a19fa8;
    --belly: #efe0cb;
    --bib: #120e10;
    --leg: #b08a6c;
  }

  /* ---------- Stage ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(60% 50% at 20% 15%, var(--bg1), transparent 70%),
      radial-gradient(60% 60% at 85% 85%, var(--bg3), transparent 70%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow: hidden;
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 20px; position: relative; }
  .sun { position: absolute; width: 340px; height: 340px; left: 50%; top: 50%; margin: -330px 0 0 -440px; border-radius: 50%; background: radial-gradient(circle, var(--accent2), transparent 68%); opacity: .5; filter: blur(8px); animation: float 9s ease-in-out infinite; pointer-events: none; }
  @keyframes float { 50% { transform: translate(20px, 16px); } }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 12px; }

  /* ---------- Phone ---------- */
  .phone {
    position: relative;
    width: min(380px, 100%);
    height: min(760px, calc(100vh - 50px));
    min-height: 560px;
    padding: 10px;
    border-radius: 48px;
    background: linear-gradient(145deg, #3b2f40, #19121d);
    box-shadow: 0 60px 90px -50px rgba(60, 20, 40, .8), 0 0 0 1.5px rgba(255, 255, 255, .12) inset;
  }
  .screen {
    position: relative;
    display: flex; flex-direction: column;
    height: 100%;
    border-radius: 38px;
    background: linear-gradient(180deg, var(--screen), var(--screen2));
    overflow: hidden;
  }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 14px 26px 4px; font-size: 13px; font-weight: 650; }
  .status svg { width: 54px; height: 12px; fill: var(--ink); }
  .apphead { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 2px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 750; font-size: 15px; letter-spacing: .01em; }
  .brand i { width: 22px; height: 22px; border-radius: 8px; background: linear-gradient(135deg, var(--accent2), var(--accent)); }
  .me { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #f6b37a, #d9667a); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }

  /* page content */
  .view { position: relative; flex: 1; overflow: hidden; }
  .page { position: absolute; inset: 0; padding: 10px 20px 0; }
  .page h1 { margin: 6px 0 2px; font-size: 26px; letter-spacing: -.02em; }
  .page .sub { margin: 0 0 14px; color: var(--ink2); font-size: 14px; }
  .big {
    position: relative; overflow: hidden;
    height: 150px; border-radius: 22px; padding: 16px;
    color: #fff;
    background: linear-gradient(150deg, var(--c1, var(--card1)), var(--c2, var(--card2)));
    box-shadow: 0 20px 30px -24px var(--card2);
  }
  .big svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 70%; }
  .big .hl { fill: var(--hill); opacity: .55; }
  .big .hl2 { fill: var(--hill); opacity: .85; }
  .big .ssun { fill: #fff3c8; opacity: .9; }
  .big b { position: relative; display: block; font-size: 17px; }
  .big span { position: relative; font-size: 12.5px; opacity: .9; }
  .big .stat { position: absolute; right: 14px; top: 14px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .22); font-size: 12px; font-weight: 650; }
  .rows { display: grid; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
  .rows li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--screen); box-shadow: 0 1px 0 var(--line), 0 8px 18px -16px rgba(60, 20, 40, .5); }
  .av { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; background: var(--c); }
  .rows b { display: block; font-size: 14px; }
  .rows small { color: var(--soft); font-size: 12px; }
  .rows .go { margin-left: auto; color: var(--soft); font-size: 18px; }

  /* ---------- Tab bar with the wire ---------- */
  .tabbar { position: relative; flex: none; height: 102px; background: var(--bar); border-top: 1px solid var(--line); backdrop-filter: blur(10px); }
  .tabbar ul { display: flex; height: 100%; margin: 0; padding: 34px 6px 18px; list-style: none; }
  .tabbar li { flex: 1; }
  .tab {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px;
    width: 100%; height: 100%; padding: 6px 0 0;
    border: 0; border-radius: 14px; background: none; cursor: pointer;
    color: var(--soft);
    -webkit-tap-highlight-color: transparent;
  }
  .tab svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: color .2s; }
  .tab .fillme { fill: transparent; transition: fill .3s; }
  .tab .lb { font-size: 11.5px; font-weight: 650; opacity: .75; transform: translateY(1px); transition: opacity .3s, transform .45s var(--spring), color .3s; }
  .tab.on { color: var(--accent); }
  .tab.on .fillme { fill: color-mix(in srgb, var(--accent) 28%, transparent); }
  .tab.on .lb { opacity: 1; color: var(--ink); transform: translateY(0); }
  .tab .ic { display: grid; transition: transform .2s; }
  .tab.pop .ic { animation: pop .65s var(--spring); }
  @keyframes pop { 0% { transform: scale(.7) translateY(3px); } 55% { transform: scale(1.22) translateY(-2px); } 100% { transform: none; } }
  .tab:active .ic { transform: scale(.88); }
  .badge {
    position: absolute; top: 2px; left: calc(50% + 6px);
    min-width: 18px; height: 18px; padding: 0 5px;
    display: grid; place-items: center;
    border-radius: 9px; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 800;
    box-shadow: 0 0 0 2px var(--screen);
    transition: transform .45s var(--spring), opacity .3s;
  }
  .badge.off { transform: scale(1.9) translateY(-8px); opacity: 0; }
  .home-ind { position: absolute; left: 50%; bottom: 7px; width: 120px; height: 5px; margin-left: -60px; border-radius: 3px; background: var(--ink); opacity: .85; }

  .sky { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
  .wire { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-linecap: round; }
  .pin { fill: var(--wire); }
  .b-body { fill: var(--bird); }
  .b-wing { fill: var(--bird2); }
  .b-stripe { fill: none; stroke: var(--belly); stroke-width: 1.1; stroke-linecap: round; opacity: .8; }
  .b-belly { fill: var(--belly); }
  .b-crown { fill: var(--crown); }
  .b-cheek { fill: #fffaf3; }
  .b-bib { fill: var(--bib); }
  .b-eye { fill: #1b1414; }
  .b-glint { fill: #fff; }
  .b-beak { fill: #3b302a; }
  .b-leg { fill: none; stroke: var(--leg); stroke-width: 1.5; stroke-linecap: round; }
  .feather { fill: var(--bird); }
  .note { fill: var(--accent); }

  /* ---------- Full screen app on small phones ---------- */
  @media (max-width: 400px) {
    .stage { padding: 0; }
    .phone { width: 100%; height: 100vh; min-height: 0; padding: 0; border-radius: 0; box-shadow: none; background: none; }
    .screen { border-radius: 0; }
    .sun { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="sun" aria-hidden="true"></div>
  <div class="phone">
    <div class="screen">
      <div class="status" aria-hidden="true"><span>9:41</span><svg viewBox="0 0 54 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M26 4.5a9 9 0 0 1 12 0l-1.6 1.7a6.6 6.6 0 0 0-8.8 0zM29.3 8a4.4 4.4 0 0 1 5.4 0L32 11z"/><rect x="42" y="1" width="11" height="10" rx="2.5" opacity=".35"/><rect x="43.5" y="2.5" width="7" height="7" rx="1.5"/></svg></div>
      <div class="apphead"><span class="brand"><i aria-hidden="true"></i>Perch</span><span class="me" aria-hidden="true">AK</span></div>
      <div class="view" id="view" aria-live="polite"></div>
      <nav class="tabbar" id="bar" aria-label="Main">

          <g id="bird">

              <g id="tail"><path class="b-wing" d="M-9-9.5-22-5l.6-4.2L-9-14z"/></g>
              <path class="b-body" d="M-11-10C-11-20-2-24 6-22c8 2 10 10 7 16-3 5-13 6-19 4-4-2-5-5-5-8z"/>
              <path class="b-belly" d="M-5-3c6 2 14 0 17-4-1-5-5-5-9-3-4 2-7 4-8 7z"/>
              <g id="head">
                <circle class="b-body" cx="10.5" cy="-21.5" r="7.6"/>
                <path class="b-crown" d="M3.4-23.6c1-5 5.6-7.4 10-6.6 2.6.5 4.4 2 5.2 3.8-3.4-.6-7.2-.2-10.4 1.2-1.6.7-3.2 1.4-4.8 1.6z"/>
                <ellipse class="b-cheek" cx="11.6" cy="-19.4" rx="4.2" ry="3.1"/>
                <path class="b-bib" d="M14.6-17.4c1.8 2.6 1 6-1.6 7.6-1.6-2-1.4-5 .2-7.2z"/>
                <g id="eye"><circle class="b-eye" cx="13.8" cy="-23.4" r="1.45"/><circle class="b-glint" cx="14.3" cy="-23.9" r=".45"/></g>
                <path class="b-beak" d="M17.6-23.2 22.4-21.6 17.6-19.8z"/>

              <g id="wing"><path class="b-wing" d="M-9-13.5c5-6.5 15-5 18 1.2-4.6 3.4-13 3.6-18-1.2z"/><path class="b-stripe" d="M-4-13.6c3-1.4 7-1.2 9.6.2"/></g>
            </g>
          </g>
        </svg>
        <span class="home-ind" aria-hidden="true"></span>
      </nav>
    </div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const NS = "http://www.w3.org/2000/svg";
  let run = 0; // hop token: a newer hop stops an older one

  // fn(eased, raw) every frame for ms; stops early (false) when a newer hop starts. token Infinity = never stopped.
  function tween(ms, fn, ease = (t) => t, token = run) {
    return new Promise((res) => {
      const t0 = performance.now();
      const f = (now) => {
        if (token !== Infinity && token !== run) return res(false);
        const p = Math.max(0, Math.min(1, (now - t0) / ms));
        fn(ease(p), p);
        if (p < 1) requestAnimationFrame(f); else res(true);
      };
      requestAnimationFrame(f);
    });
  }
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);

  // ---------- Tabs and their pages ----------
  const ICONS = {
    Home: '<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" class="fillme"/>',
    Explore: '<circle cx="12" cy="12" r="8.5" class="fillme"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
    Saved: '<path d="M6.5 4h11v16l-5.5-4-5.5 4z" class="fillme"/>',
    Inbox: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5" class="fillme"/><path d="m4 7 8 6 8-6"/>',
    Me: '<circle cx="12" cy="8.5" r="4" class="fillme"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>',
  };
  const PAGES = [
    { tab: "Home", title: "Good evening, Ayesha", sub: "Three walks planned this week", big: ["Margalla Trail 3", "Sunset 5:12 pm · 4.6 km loop", "Tonight"], c: ["", ""],
      rows: [["D", "Daman-e-Koh lookout", "2.1 km · easy", "#f59e7b"], ["L", "Lake View Park", "3.4 km · flat path", "#e2789a"], ["S", "Shakarparian hills", "1.8 km · shady", "#b086d6"]] },
    { tab: "Explore", title: "Birds near you", sub: "Seen in Islamabad today", big: ["House sparrow", "12 sightings within 2 km", "Common"], c: ["#7fc8a9", "#3f8f84"],
      rows: [["M", "Common myna", "8 sightings · parks", "#6cb79a"], ["R", "Indian robin", "3 sightings · gardens", "#e09a5b"], ["K", "White-throated kingfisher", "1 sighting · Rawal Lake", "#4f8fd6"]] },
    { tab: "Saved", title: "Saved spots", sub: "12 places, 3 with notes", big: ["Rawal Lake bank", "Best at 7 am · bring binoculars", "Saved"], c: ["#8fb3f0", "#5b6fd6"],
      rows: [["F", "Fatima Jinnah Park", "North gate benches", "#6e8be0"], ["T", "Trail 5 stream", "Kingfishers in March", "#4fb0c6"], ["P", "Pir Sohawa road", "Sunrise, cold wind", "#9a7be0"]] },
    { tab: "Inbox", title: "Inbox", sub: "3 new notes from friends", big: ["Saturday bird walk", "Islamabad Birders Club · 14 going", "New"], c: ["#ffc46b", "#f08a4b"],
      rows: [["B", "Bilal Ahmed", "Saw a hoopoe at F-9 park!", "#f0a04b"], ["S", "Sana Tariq", "Sharing my Trail 3 photos", "#e46f8f"], ["C", "Club news", "New spotting checklist is up", "#5fae8f"]] },
    { tab: "Me", title: "Ayesha Khan", sub: "Level 4 · 86 birds logged", big: ["Early bird badge", "Five dawn walks in a row", "Level 4"], c: ["#c89bf0", "#8a5ad6"],
      rows: [["86", "Birds logged", "+6 this month", "#a77be0"], ["41", "Walks done", "128 km in total", "#f08a7b"], ["12", "Badges", "2 close to unlocking", "#5fb0a0"]] },
  ];
  const tabs = $("tabs"), view = $("view"), bar = $("bar"), live = $("live");
  PAGES.forEach((p) => {
    const li = document.createElement("li");
    li.innerHTML = `<button class="tab" type="button"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[p.tab]}</svg></span><span class="lb">${p.tab}</span>${p.tab === "Inbox" ? '<span class="badge" id="badge">3</span>' : ""}</button>`;
    tabs.appendChild(li);
  });
  const tb = [...tabs.querySelectorAll(".tab")];
  const badge = $("badge");

  function pageHTML(p) {
    const style = p.c[0] ? `--c1:${p.c[0]};--c2:${p.c[1]}` : "";
    return `<h1>${p.title}</h1><p class="sub">${p.sub}</p>
      <div class="big" style="${style}"><b>${p.big[0]}</b><span>${p.big[1]}</span><span class="stat">${p.big[2]}</span>
        <svg viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"><circle class="ssun" cx="232" cy="46" r="16"/><path class="hl" d="M0 70C40 40 80 52 120 60s90-34 140-20 40 20 40 20v40H0z"/><path class="hl2" d="M0 86c50-20 90-6 140-2s110-16 160-6v22H0z"/></svg></div>
      <ul class="rows">${p.rows.map((r) => `<li><span class="av" style="--c:${r[3]}">${r[0]}</span><span><b>${r[1]}</b><small>${r[2]}</small></span><span class="go" aria-hidden="true">›</span></li>`).join("")}</ul>`;
  }
  // slide the new page in from the side the sparrow is flying towards, its parts one after another
  function showPage(i, dir) {
    const old = view.querySelector(".page");
    const pg = document.createElement("section");
    pg.className = "page";
    pg.setAttribute("aria-label", PAGES[i].tab);
    pg.innerHTML = pageHTML(PAGES[i]);
    view.appendChild(pg);
    if (reduce) { if (old) old.remove(); return; }
    if (old) old.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-dir * 36}px) scale(.98)` }], { duration: 260, easing: "ease-in", fill: "forwards" }).onfinish = () => old.remove();
    [...pg.querySelectorAll("h1, .sub, .big, .rows li")].forEach((el, k) => {
      el.animate([{ opacity: 0, transform: `translateX(${dir * 46}px)` }, { opacity: 1, transform: "none" }], { duration: 560, delay: 90 + k * 55, easing: "cubic-bezier(.3,1.35,.5,1)", fill: "backwards" });
    });
  }

  // ---------- Sparrow and wire state, drawn every frame ----------
  const sky = $("sky"), wire = $("wire"), birdG = $("bird"), pose = $("bpose"), wingG = $("wing"), tailG = $("tail"), headG = $("head"), eyeG = $("eye"), fx = $("fx");
  const B = { x: 0, y: 0, dir: 1, flip: 1, sx: 1, sy: 1, rot: 0, wing: 0, tail: 0, head: 0, eye: 1, on: true };
  const W = { y0: 24, sag: 0, v: 0, at: 0, push: 0, w: 300 };
  const BS = 1.5; // sparrow size
  let cur = 0;

  function measure() {
    const r = bar.getBoundingClientRect();
    W.w = r.width;
    sky.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
    $("pinL").setAttribute("cx", 10); $("pinL").setAttribute("cy", W.y0);
    $("pinR").setAttribute("cx", r.width - 10); $("pinR").setAttribute("cy", W.y0);
  }
  const tabX = (i) => { const r = bar.getBoundingClientRect(), t = tb[i].getBoundingClientRect(); return t.left - r.left + t.width / 2; };
  // the bird stands a little to the side of the icon centre so it does not hide the icon
  const perchX = (i) => tabX(i) - 2;

  function frame() {
    // wire: a damped spring that sags under the bird and wobbles when it leaves or lands
    const target = (B.on ? 8 : 0) + W.push;
    W.v += (190 * (target - W.sag) - 9 * W.v) / 60;
    W.sag += W.v / 60;
    if (B.on) W.at = B.x;
    const a = Math.max(20, Math.min(W.w - 20, W.at)), y = W.y0, s = W.sag;
    wire.setAttribute("d", `M10 ${y}Q${(10 + a) / 2} ${y + s * .55} ${a} ${y + s}Q${(a + W.w - 10) / 2} ${y + s * .55} ${W.w - 10} ${y}`);
    if (B.on) B.y = W.y0 + W.sag;
    birdG.setAttribute("transform", `translate(${B.x.toFixed(1)} ${B.y.toFixed(1)})`);
    pose.setAttribute("transform", `rotate(${B.rot.toFixed(1)}) scale(${(BS * B.flip * B.sx).toFixed(3)} ${(BS * B.sy).toFixed(3)})`);
    wingG.setAttribute("transform", `rotate(${B.wing.toFixed(1)} 2 -15)`);
    tailG.setAttribute("transform", `rotate(${B.tail.toFixed(1)} -9 -11)`);
    headG.setAttribute("transform", `rotate(${B.head.toFixed(1)} 8 -16)`);
    eyeG.setAttribute("transform", `translate(0 ${(-23.4 * (1 - B.eye)).toFixed(2)}) scale(1 ${B.eye.toFixed(2)})`);
    requestAnimationFrame(frame);
  }

  // little feathers drift down and music notes float up after a landing
  function puff(x, y) {
    if (reduce) return;
    for (let k = 0; k < 3; k++) {
      const f = document.createElementNS(NS, "ellipse");
      f.setAttribute("class", "feather"); f.setAttribute("rx", 3.2); f.setAttribute("ry", 1.1);
      fx.appendChild(f);
      const vx = (k - 1) * 9 + (Math.random() - .5) * 6;
      f.animate([
        { transform: `translate(${x}px, ${y - 14}px) rotate(0deg)`, opacity: .9 },
        { transform: `translate(${x + vx}px, ${y + 8}px) rotate(${120 + k * 60}deg)`, opacity: .8, offset: .5 },
        { transform: `translate(${x + vx * 1.6}px, ${y + 30}px) rotate(${260 + k * 40}deg)`, opacity: 0 },
      ], { duration: 1000 + k * 160, easing: "ease-out" }).onfinish = () => f.remove();
    }
    for (let k = 0; k < 2; k++) {
      const n = document.createElementNS(NS, "path");
      n.setAttribute("class", "note");
      n.setAttribute("d", "M0 0a2.4 1.9 0 1 1-1-1.6V-9l5-1.4v2.2l-3.6 1V0z");
      fx.appendChild(n);
      const sx = x + B.dir * 24, sy = y - 40;
      n.animate([
        { transform: `translate(${sx}px, ${sy}px) scale(.4)`, opacity: 0 },
        { transform: `translate(${sx + B.dir * 6}px, ${sy - 12}px) scale(1) rotate(-8deg)`, opacity: 1, offset: .3 },
        { transform: `translate(${sx + B.dir * (2 + k * 10)}px, ${sy - 34 - k * 6}px) scale(.9) rotate(10deg)`, opacity: 0 },
      ], { duration: 1100, delay: 120 + k * 260, easing: "ease-out", fill: "backwards" }).onfinish = () => n.remove();
    }
  }

  // ---------- The hop: turn and crouch, spring off the wire, flap across on an arc, land with a squash ----------
  async function hop(to) {
    if (to === cur && B.on) return;
    const token = ++run, from = cur;
    cur = to;
    tb.forEach((b, k) => (k === to ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    const p = PAGES[to];
    live.textContent = `${p.tab}. ${p.title}. ${p.sub}.`;
    const xa = B.x, xb = perchX(to), dir = Math.sign(xb - xa) || B.dir;
    showPage(to, dir);
    tb[from].classList.remove("on");
    if (reduce) {
      B.x = xb; B.dir = dir; B.flip = dir; B.on = true;
      land(to);
      return;
    }
    W.push = 0;
    const perched = B.on;
    // 1. turn round if needed, then crouch (the wire dips under the push); skipped when a hop is re-aimed mid-air
    if (B.flip !== dir) {
      const f0 = B.flip;
      if (!(await tween(perched ? 150 : 90, (e) => { B.flip = f0 + (dir - f0) * e; }, outCubic, token))) return;
    }
    B.dir = dir;
    if (perched && !(await tween(130, (e) => { B.sy = 1 - .2 * e; B.sx = 1 + .12 * e; B.rot = -6 * dir * e; W.push = 4 * e; B.tail = 14 * e; }, outCubic, token))) return;
    // 2. take off: the wire springs back up
    if (perched) W.v -= 60;
    B.on = false; W.push = 0;
    const dist = Math.abs(xb - B.x), T = Math.min(860, 380 + dist * .95), H = 24 + Math.min(72, dist * .26), y0 = W.y0, ys = B.y, xs = B.x;
    const ok = await tween(T, (e, raw) => {
      const pp = (1 - Math.cos(raw * Math.PI)) / 2; // gentle start and end along the way
      B.x = xs + (xb - xs) * pp;
      B.y = ys + (y0 - ys) * raw - 4 * H * raw * (1 - raw);
      const vy = 4 * H * (2 * raw - 1); // + when falling
      B.rot = Math.max(-24, Math.min(24, vy * .12)) * dir;
      B.wing = raw > .92 ? 0 : -55 + 70 * (.5 + .5 * Math.sin(raw * T / 1000 * Math.PI * 2 * 11));
      B.tail = -vy * .12;
      const st = Math.sin(raw * Math.PI);
      B.sy = 1 + .14 * st; B.sx = 1 - .1 * st;
    }, (t) => t, token);
    if (!ok) return;
    // 3. land: squash, wire bounces, then settle with a wobble
    B.on = true; B.wing = 0; W.v += 90;
    land(to);
    await tween(560, (e) => {
      const k = Math.exp(-5 * e) * Math.cos(e * 10);
      B.sy = 1 - .24 * k; B.sx = 1 + .16 * k; B.rot = 4 * dir * k; B.tail = -10 * k;
    }, (t) => t, token);
  }
  function land(i) {
    tb.forEach((b, k) => b.classList.toggle("on", k === i));
    tb[i].classList.remove("pop"); void tb[i].offsetWidth; tb[i].classList.add("pop");
    if (PAGES[i].tab === "Inbox" && badge && !badge.classList.contains("off")) {
      badge.classList.add("off");
      // a new note arrives a little later so the badge comes back
      setTimeout(() => { if (cur !== i) { badge.textContent = "1"; badge.classList.remove("off"); } }, 6000);
    }
    puff(B.x, W.y0);
  }

  // ---------- Idle life: blink, look around, peck and flick the tail ----------
  let busyIdle = false;
  async function idle() {
    if (reduce || busyIdle || !B.on) return;
    busyIdle = true;
    const r = Math.random(), t = run;
    const still = () => t === run;
    if (r < .45) {
      await tween(90, (e) => { B.eye = 1 - .9 * e; }, (x) => x, Infinity);
      await tween(110, (e) => { B.eye = .1 + .9 * e; }, (x) => x, Infinity);
    } else if (r < .7) {
      const a = (Math.random() < .5 ? -1 : 1) * 14;
      await tween(220, (e) => { B.head = a * outCubic(e); }, (x) => x, Infinity);
      await sleep(500);
      await tween(260, (e) => { B.head = a * (1 - outCubic(e)); }, (x) => x, Infinity);
    } else if (r < .88 && still()) {
      for (let k = 0; k < 2 && still(); k++) {
        await tween(120, (e) => { if (still()) B.rot = 22 * B.dir * e; }, (x) => x, Infinity);
        await tween(160, (e) => { if (still()) B.rot = 22 * B.dir * (1 - e); }, (x) => x, Infinity);
      }
    } else {
      await tween(300, (e) => { B.tail = Math.sin(e * Math.PI * 3) * 16 * (1 - e); }, (x) => x, Infinity);
    }
    busyIdle = false;
  }

  // ---------- Input ----------
  tb.forEach((b, i) => {
    b.addEventListener("click", () => hop(i));
    b.addEventListener("keydown", (e) => {
      const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (!k) return;
      e.preventDefault();
      const n = (i + k + tb.length) % tb.length;
      tb[n].focus();
      hop(n);
    });
  });
  addEventListener("resize", () => { measure(); if (B.on) B.x = perchX(cur); });

  // ---------- Start: the sparrow flies in, then a demo tour until someone takes over ----------
  measure();
  showPage(0, 1);
  tb[0].setAttribute("aria-current", "page");
  B.x = reduce ? perchX(0) : -30; B.y = reduce ? W.y0 : -60; B.on = reduce;
  W.at = perchX(0);
  requestAnimationFrame(frame);
  let demo = !reduce;
  const stop = (e) => { if (e.isTrusted) demo = false; };
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach((t) => addEventListener(t, stop, { capture: true, passive: true }));
  (async () => {
    if (reduce) { land(0); return; }
    // fly in from the top left onto Home
    const token = ++run, xb = perchX(0);
    await tween(700, (e, raw) => {
      B.x = -30 + (xb + 30) * outCubic(raw);
      B.y = -60 + (W.y0 + 60) * (raw * raw);
      B.wing = raw > .9 ? 0 : -55 + 70 * (.5 + .5 * Math.sin(raw * 7 * Math.PI * 2));
      B.rot = 10;
    }, (t) => t, token);
    B.on = true; B.rot = 0; B.wing = 0; W.v += 80;
    land(0);
    await tween(500, (e) => { const k = Math.exp(-5 * e) * Math.cos(e * 10); B.sy = 1 - .22 * k; B.sx = 1 + .14 * k; }, (t) => t, token);
    const order = [2, 1, 3, 4, 0, 3, 1];
    let k = 0;
    while (demo) {
      await sleep(1700);
      if (!demo) break;
      await hop(order[k++ % order.length]);
    }
  })();
  setInterval(idle, 1900);
})();
</script>
</body>
</html>
