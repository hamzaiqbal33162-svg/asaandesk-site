<!doctype html>
<!-- Chill and Craft · Glow Loop · free to use (asaandesk.com/craft) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glow Loop · tab bar with a stretching ring of light</title>
<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light";
    }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours (light first, dark below) ---------- */
  :root {
    --bg: #ebe8f5;
    --bg-2: #f7e9f0;
    --phone: #ffffff;
    --edge: #d9d4ea;
    --screen: #f6f5fb;
    --ink: #1c1a30;
    --muted: #6f6c88;
    --card: #ffffff;
    --line: #e6e2f1;
    --bar: #ffffff;
    --bar-edge: #ece8f6;
    --icon: #9592ad;
    --ring-a: #ff9a3d;
    --ring-b: #ff4f8b;
    --ring-c: #7b6bff;
    --ring-fill: #fff3f7;
    --glow: rgba(255, 79, 139, 0.35);
    --focus: #7b6bff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #05060d;
    --bg-2: #120a1c;
    --phone: #0c0e1c;
    --edge: #1d2040;
    --screen: #0c0e1c;
    --ink: #f2f0ff;
    --muted: #8c8baa;
    --card: #141731;
    --line: #22264a;
    --bar: #121530;
    --bar-edge: #1f2348;
    --icon: #6c6f95;
    --ring-fill: #1b1634;
    --glow: rgba(255, 79, 139, 0.62);
    --focus: #ffb36b;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 60%);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  /* ---------- Stage + phone frame ---------- */
  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .phone {
    width: min(340px, 100%);
    height: min(580px, calc(100vh - 32px));
    min-height: 460px;
    background: var(--phone);
    border: 1px solid var(--edge);
    border-radius: 38px;
    padding: 10px;
    box-shadow: 0 30px 60px -30px rgba(20, 10, 60, 0.45), 0 0 0 6px rgba(127, 110, 200, 0.06);
    display: flex;
  }
  .screen {
    flex: 1;
    min-width: 0;
    background: var(--screen);
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 22px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .status-bar svg { width: 34px; height: 12px; }

  /* ---------- Content that changes per tab ---------- */
  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 18px 8px;
  }
  .eyebrow { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .content h1 { margin: 2px 0 14px; font-size: 24px; letter-spacing: -0.02em; }
  .view.enter { animation: rise 0.42s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .hero {
    border-radius: 20px;
    padding: 16px;
    color: #fff;
    background: linear-gradient(135deg, var(--ring-a), var(--ring-b) 55%, var(--ring-c));
    box-shadow: 0 14px 30px -18px var(--ring-b);
  }
  .hero p { margin: 0; font-size: 12px; opacity: 0.9; }
  .hero strong { display: block; font-size: 26px; margin-top: 4px; letter-spacing: -0.02em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stats span { background: rgba(255, 255, 255, 0.18); border-radius: 12px; padding: 8px; font-size: 11px; }
  .stats b { display: block; font-size: 15px; }

  .rows { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .rows li {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 10px 12px; font-size: 13px;
  }
  .rows small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .rows .amt { margin-left: auto; font-weight: 600; font-size: 13px; }
  .dot {
    flex: none; width: 34px; height: 34px; border-radius: 12px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
  }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    height: 98px; border-radius: 18px; padding: 12px; color: #fff;
    display: flex; align-items: flex-end; font-size: 13px; font-weight: 600;
  }
  .me { text-align: center; padding: 6px 0 4px; }
  .me .avatar {
    width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%;
    background: conic-gradient(from 200deg, var(--ring-a), var(--ring-b), var(--ring-c), var(--ring-a));
    padding: 3px;
  }
  .me .avatar span {
    display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%;
    background: var(--card); font-size: 22px; font-weight: 700;
  }
  .me p { margin: 0; color: var(--muted); font-size: 12px; }

  /* ---------- The tab bar ---------- */
  .bar {
    position: relative;
    margin: 6px 10px 12px;
    height: 74px;
    border-radius: 26px;
    background: var(--bar);
    border: 1px solid var(--bar-edge);
    display: flex;
    padding: 0 4px;
    box-shadow: 0 12px 28px -16px rgba(10, 0, 40, 0.5);
  }
  .tab {
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;
    border: 0;
    background: none;
    color: var(--icon);
    font: inherit;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 7px 0 0;
    cursor: pointer;
    border-radius: 18px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.3s;
  }
  .tab .ico { width: 44px; height: 44px; display: grid; place-items: center; transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .tab .lbl { white-space: nowrap; transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1), letter-spacing 0.35s; }
  .tab:hover { color: var(--ink); }
  .tab:hover .ico { transform: translateY(-2px); }
  .tab:active .ico { transform: scale(0.82); transition-duration: 0.08s; }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab[aria-current="page"] .lbl { font-weight: 650; transform: translateY(1px); letter-spacing: 0.02em; }
  .tab:focus-visible { outline-offset: -2px; }

  /* Each icon reacts in its own way when its tab is chosen */
  .tab[aria-current="page"][data-anim="hop"] svg { animation: hop 0.65s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .tab[aria-current="page"][data-anim="spin"] .needle { animation: spin 0.9s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .tab[aria-current="page"][data-anim="flip"] svg { animation: flip 0.7s cubic-bezier(0.3, 1.2, 0.5, 1); }
  .tab[aria-current="page"][data-anim="wiggle"] svg { animation: wiggle 0.7s ease-out; }
  .tab[aria-current="page"][data-anim="nod"] svg { animation: nod 0.6s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .needle { transform-box: fill-box; transform-origin: center; }
  @keyframes hop {
    30% { transform: translateY(-7px) scale(0.94, 1.1); }
    60% { transform: translateY(0) scale(1.14, 0.84); }
    80% { transform: scale(0.97, 1.03); }
  }
  @keyframes spin { from { transform: rotate(-220deg); } }
  @keyframes flip { 45% { transform: perspective(80px) rotateY(180deg) scale(1.12); } 100% { transform: perspective(80px) rotateY(360deg); } }
  @keyframes wiggle { 20% { transform: rotate(-16deg) scale(1.1); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(3deg); } }
  @keyframes nod { 30% { transform: translateY(3px) scale(1.1, 0.88); } 65% { transform: translateY(-3px) scale(0.96, 1.05); } }

  /* staggered entrance for the screen content */
  .in { animation: card-in 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards; }
  @keyframes card-in { from { opacity: 0; transform: translateY(18px) scale(0.95); } }
  .rows li, .tile { transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1), box-shadow 0.25s; }
  .rows li:hover, .tile:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -14px rgba(20, 10, 60, 0.6); }

  /* The ring of light. JS moves its left edge and width, so it can stretch. */
  .ring {
    position: absolute;
    top: 7px;
    left: 0;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 2px solid transparent;
    background:
      linear-gradient(var(--ring-fill), var(--ring-fill)) padding-box,
      linear-gradient(90deg, var(--ring-a), var(--ring-b), var(--ring-c)) border-box;
    box-shadow: 0 0 16px var(--glow), 0 0 3px var(--glow);
    pointer-events: none;
    animation: breathe 2.6s ease-in-out infinite;
  }
  /* soft light spilling onto the bar under the ring */
  .ring::after {
    content: "";
    position: absolute;
    left: 15%;
    right: 15%;
    bottom: -12px;
    height: 8px;
    border-radius: 50%;
    background: var(--ring-b);
    filter: blur(8px);
    opacity: 0.55;
  }
  @keyframes breathe { 50% { box-shadow: 0 0 26px var(--glow), 0 0 6px var(--glow); } }

  /* A soft afterglow that trails behind the ring like a comet tail */
  .trail {
    position: absolute;
    top: 7px;
    left: 0;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: radial-gradient(closest-side, var(--glow), transparent);
    filter: blur(5px);
    pointer-events: none;
    transition: left 0.6s cubic-bezier(0.2, 0.9, 0.3, 1), width 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  /* sparks that fly off when the ring lands */
  .burst { position: absolute; top: 7px; left: 0; width: 44px; height: 44px; pointer-events: none; z-index: 2; }
  .burst i {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px;
    border-radius: 50%; background: var(--ring-a); opacity: 0;
  }
  .burst i:nth-child(2n) { background: var(--ring-b); }
  .burst i:nth-child(3n) { background: var(--ring-c); }
  .burst.go i { animation: spark 0.6s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .burst i:nth-child(1) { --a: 0deg; } .burst i:nth-child(2) { --a: 60deg; } .burst i:nth-child(3) { --a: 120deg; }
  .burst i:nth-child(4) { --a: 180deg; } .burst i:nth-child(5) { --a: 240deg; } .burst i:nth-child(6) { --a: 300deg; }
  @keyframes spark {
    0% { opacity: 1; transform: rotate(var(--a)) translateY(-16px) scale(1.2); }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-34px) scale(0.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="phone">
    <div class="screen">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <svg viewBox="0 0 34 12"><rect x="0" y="6" width="3" height="6" rx="1" fill="currentColor"/><rect x="5" y="4" width="3" height="8" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="18" y="1" width="14" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="20" y="3" width="8" height="6" rx="1.5" fill="currentColor"/></svg>
      </div>

      <section class="content" id="panel" aria-labelledby="title">
        <div class="view" id="view">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
          <div id="body"></div>
        </div>
      </section>

      <nav class="bar" aria-label="Main">
        <span class="trail" aria-hidden="true"></span>
        <span class="ring" aria-hidden="true"></span>
        <span class="burst" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <button class="tab" type="button" data-anim="hop" aria-current="page">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7v8.5a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg></span>
          <span class="lbl">Home</span>
        </button>
        <button class="tab" type="button" data-anim="spin">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path class="needle" d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg></span>
          <span class="lbl">Explore</span>
        </button>
        <button class="tab" type="button" data-anim="flip">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h14.5a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7.5 15 4v3.5"/><circle cx="16.3" cy="13.8" r="1.2"/></svg></span>
          <span class="lbl">Wallet</span>
        </button>
        <button class="tab" type="button" data-anim="wiggle">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9.5L4 20.5z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span>
          <span class="lbl">Inbox</span>
        </button>
        <button class="tab" type="button" data-anim="nod">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.4-3.9 4.3-5.8 7.5-5.8s6.1 1.9 7.5 5.8"/></svg></span>
          <span class="lbl">Profile</span>
        </button>
      </nav>
    </div>
  </div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
  (function () {
    var bar = document.querySelector(".bar");
    var ring = bar.querySelector(".ring");
    var trail = bar.querySelector(".trail");
    var burst = bar.querySelector(".burst");
    var tabs = Array.prototype.slice.call(bar.querySelectorAll(".tab"));
    var view = document.getElementById("view");
    var eyebrow = document.getElementById("eyebrow");
    var title = document.getElementById("title");
    var body = document.getElementById("body");
    var status = document.getElementById("status");
    var reduce = matchMedia("(prefers-reduced-motion: reduce)");
    var SIZE = 44; // ring diameter in px
    var current = 0;
    var ringX = 0;
    var timer = 0;

    // ---------- Demo screens, one per tab ----------
    function row(color, letter, name, sub, amt) {
      return '<li><span class="dot" style="background:' + color + '">' + letter + "</span><span>" + name +
        "<small>" + sub + "</small></span>" + (amt ? '<span class="amt">' + amt + "</span>" : "") + "</li>";
    }
    function tile(a, b, text) {
      return '<div class="tile" style="background:linear-gradient(140deg,' + a + "," + b + ')">' + text + "</div>";
    }
    var screens = [
      { eyebrow: "Good evening, Areeba", title: "Home", html:
        '<div class="hero"><p>Steps today</p><strong>7,420</strong><div class="stats">' +
        "<span><b>32</b>min walk</span><span><b>6</b>glasses</span><span><b>7h</b>sleep</span></div></div>" +
        '<ul class="rows">' + row("#7b6bff", "Y", "Yoga with Nida", "Tomorrow, 7:00 am") + row("#ff9a3d", "M", "Meal plan ready", "5 new recipes") + "</ul>" },
      { eyebrow: "Ideas for the weekend", title: "Explore", html:
        '<div class="tiles">' + tile("#ff9a3d", "#ff4f8b", "Food streets") + tile("#7b6bff", "#3fb6ff", "Hill trips") +
        tile("#1fbf8f", "#9be15d", "Book cafés") + tile("#ff4f8b", "#7b6bff", "Night markets") + "</div>" },
      { eyebrow: "Available balance", title: "PKR 48,250", html:
        '<ul class="rows">' + row("#1fbf8f", "S", "Salary", "1 Nov", "+65,000") + row("#ff4f8b", "G", "Groceries", "Yesterday", "−3,480") +
        row("#7b6bff", "B", "Electricity bill", "14 Nov", "−6,120") + "</ul>" },
      { eyebrow: "3 unread", title: "Inbox", html:
        '<ul class="rows">' + row("#ff9a3d", "H", "Hassan", "Are we still on for Friday?") + row("#7b6bff", "Z", "Zainab", "Sent you the photos") +
        row("#1fbf8f", "T", "Team Orbit", "Stand-up moved to 11") + "</ul>" },
      { eyebrow: "Your account", title: "Profile", html:
        '<div class="me"><div class="avatar"><span>AK</span></div><p>Areeba Khan · Lahore</p></div>' +
        '<ul class="rows">' + row("#7b6bff", "N", "Notifications", "On, quiet after 10 pm") + row("#ff4f8b", "P", "Privacy", "Only friends") + "</ul>" }
    ];

    function render(i, quiet) {
      var s = screens[i];
      eyebrow.textContent = s.eyebrow;
      title.textContent = s.title;
      body.innerHTML = s.html;
      if (quiet) return;
      view.classList.remove("enter");
      void view.offsetWidth; // restart the enter animation
      view.classList.add("enter");
      // cards arrive one after another
      Array.prototype.forEach.call(body.querySelectorAll(".hero, .rows li, .tile, .me"), function (el, k) {
        el.style.animationDelay = 80 + k * 70 + "ms";
        el.classList.add("in");
      });
    }

    // ---------- Ring geometry ----------
    function targetFor(i) {
      var b = bar.getBoundingClientRect();
      var ico = tabs[i].querySelector(".ico").getBoundingClientRect();
      return {
        x: ico.left - b.left + ico.width / 2 - SIZE / 2 - bar.clientLeft,
        y: ico.top - b.top + ico.height / 2 - SIZE / 2 - bar.clientTop
      };
    }
    function place(x, w, transition) {
      ring.style.transition = transition || "none";
      ring.style.left = x + "px";
      ring.style.width = w + "px";
    }
    function moveRing(i, instant) {
      var t = targetFor(i);
      ring.style.top = trail.style.top = burst.style.top = t.y + "px";
      clearTimeout(timer);
      if (instant || reduce.matches) {
        place(t.x, SIZE);
        trail.style.transition = "none";
        trail.style.left = t.x + "px";
        void trail.offsetWidth;
        trail.style.transition = "";
        ringX = t.x;
        return;
      }
      // the afterglow simply drifts to the target, so it lags behind the ring
      trail.style.left = t.x + "px";
      burst.style.left = t.x + "px";
      burst.classList.remove("go");
      setTimeout(function () { burst.classList.add("go"); }, 240);
      var from = ringX;
      // 1) Stretch: the leading edge races to the new tab, the trailing edge stays put.
      place(Math.min(from, t.x), Math.abs(t.x - from) + SIZE,
        "left .18s cubic-bezier(.45,0,.55,1), width .18s cubic-bezier(.45,0,.55,1)");
      // 2) Snap: the tail catches up and the light springs back into a ring.
      timer = setTimeout(function () {
        place(t.x, SIZE, "left .46s cubic-bezier(.3,1.45,.5,1), width .34s cubic-bezier(.2,.8,.2,1)");
      }, 180);
      ringX = t.x;
    }

    // ---------- Selecting a tab ----------
    function select(i) {
      if (i === current) return;
      tabs[current].removeAttribute("aria-current");
      tabs[i].setAttribute("aria-current", "page");
      current = i;
      moveRing(i);
      render(i);
      status.textContent = tabs[i].textContent.trim() + " tab selected";
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () { select(i); });
      // Arrow keys move along the bar, Home and End jump to the ends.
      tab.addEventListener("keydown", function (e) {
        var next = null;
        if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
        else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = tabs.length - 1;
        if (next === null) return;
        e.preventDefault();
        tabs[next].focus();
        select(next);
      });
    });

    window.addEventListener("resize", function () { moveRing(current, true); });

    render(0);
    requestAnimationFrame(function () { moveRing(0, true); });
  })();
</script>
</body>
</html>
