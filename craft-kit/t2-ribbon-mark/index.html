<script>
  // Theme: ?theme=light|dark in the URL wins, otherwise follow the system setting.
  (function () {
    var pick = new URLSearchParams(location.search).get("theme");
    var mq = matchMedia("(prefers-color-scheme: dark)");
    function apply() { document.documentElement.dataset.theme = pick === "light" || pick === "dark" ? pick : mq.matches ? "dark" : "light"; }
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
  })();
</script>
<style>
  /* ---------- Colours ---------- */
  :root {
    --bg-a: #f4eddf;
    --bg-b: #e3d7bf;
    --card: #fffaf1;
    --ink: #22302a;
    --muted: #6d786e;
    --line: rgba(34, 48, 42, 0.12);
    --chip: #f3ead8;
    --plank-a: #c2925f;
    --plank-b: #8d6139;
    --brass-a: #f3d48a;
    --brass-b: #b98a2e;
    --beam: rgba(255, 239, 196, 0.7);
    --mote: rgba(255, 246, 214, 0.95);
    --focus: #1f6f5c;
    --shadow: rgba(60, 42, 18, 0.45);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg-a: #11251e;
    --bg-b: #08140f;
    --card: #182e27;
    --ink: #f3ebdc;
    --muted: #a3b2a7;
    --line: rgba(243, 235, 220, 0.12);
    --chip: #213b33;
    --plank-a: #6b4a2c;
    --plank-b: #3d2817;
    --brass-a: #f0cd7a;
    --brass-b: #a07524;
    --beam: rgba(255, 222, 150, 0.08);
    --mote: rgba(255, 226, 160, 0.55);
    --focus: #f0cd7a;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg-b);
  }

  /* ---------- Stage: a quiet reading room with a slanted window beam and floating dust ---------- */
  .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 34px 16px 24px; overflow: hidden; background: radial-gradient(120% 90% at 30% 0%, var(--bg-a), var(--bg-b)); }
  .beam { position: absolute; top: -20%; left: 8%; width: 34%; height: 150%; transform: rotate(24deg); background: linear-gradient(90deg, transparent, var(--beam) 40%, var(--beam) 60%, transparent); filter: blur(6px); pointer-events: none; }
  .mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--mote); pointer-events: none; animation: float 14s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translate(0, 0); opacity: 0.2; } 50% { transform: translate(26px, -40px); opacity: 1; } }

  /* ---------- Reading list card ---------- */
  .desk { position: relative; width: min(620px, 100%); padding: clamp(16px, 4vw, 26px) clamp(16px, 4vw, 28px) 18px; border-radius: 26px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 40px 80px -46px var(--shadow); }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 30px; }
  .eyebrow { margin: 0 0 4px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 700 clamp(1.05rem, 3.6vw, 1.4rem)/1.2 ui-serif, Georgia, Cambria, "Times New Roman", serif; }
  .tally { flex: none; display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--chip); font-size: 0.82rem; font-weight: 650; color: var(--muted); }
  .tally svg { width: 14px; height: 14px; color: var(--brass-b); }
  .num { position: relative; display: inline-block; height: 1.2em; min-width: 0.7em; overflow: hidden; color: var(--ink); font-variant-numeric: tabular-nums; }
  .num span { display: block; line-height: 1.2em; }

  /* ---------- Books ---------- */
  .books { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(12px, 3.4vw, 26px); }
  .book { position: relative; min-width: 0; }
  .lift { position: relative; transform-origin: 50% 100%; }
  .cover {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 4px 10px 10px 4px;
    overflow: visible;
    background: linear-gradient(160deg, var(--c1), var(--c2));
    box-shadow: inset 6px 0 0 rgba(0, 0, 0, 0.16), inset 8px 0 6px -4px rgba(255, 255, 255, 0.18), 0 18px 26px -18px var(--shadow), 0 2px 4px rgba(0, 0, 0, 0.12);
  }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; display: block; }
  .ttl { position: absolute; left: 12%; right: 10%; bottom: 9%; margin: 0; color: #fff6e6; font: 700 clamp(0.66rem, 2.5vw, 1rem)/1.12 ui-serif, Georgia, Cambria, "Times New Roman", serif; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
  .ttl small { display: block; margin-top: 4px; font: 600 clamp(0.52rem, 1.8vw, 0.7rem)/1.2 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8; }
  .info { margin: 10px 0 0; font-size: clamp(0.68rem, 2.2vw, 0.8rem); color: var(--muted); }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .twinkle:nth-child(2n) { animation-delay: -1.4s; }
  @keyframes twinkle { 50% { opacity: 0.25; } }
  .rain line { animation: rain 1.6s linear infinite; }
  @keyframes rain { from { transform: translateY(-10px); opacity: 0; } 30% { opacity: 0.8; } to { transform: translateY(18px); opacity: 0; } }

  /* the silk ribbon is drawn on an SVG layer that hangs over the cover */
  .ribbon { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
  .ribbon .stitch { fill: none; stroke: rgba(255, 255, 255, 0.45); stroke-width: 0.9; stroke-dasharray: 2.4 2.6; }

  /* the brass clasp button the ribbon hangs from */
  .mark {
    position: absolute;
    z-index: 3;
    top: -17px;
    left: calc(78% - 17px);
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: #5a3f0c;
    background: radial-gradient(circle at 35% 30%, #fff3c8, var(--brass-a) 45%, var(--brass-b));
    box-shadow: 0 0 0 2px var(--card), 0 6px 12px -4px var(--shadow), inset 0 -2px 3px rgba(0, 0, 0, 0.18);
    transition: transform 0.4s cubic-bezier(0.3, 1.8, 0.5, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .mark:hover { transform: translateY(-2px) rotate(-8deg); }
  .mark:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .mark svg { width: 16px; height: 16px; display: block; overflow: visible; }
  .mark .o { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .mark .f { fill: currentColor; transform-origin: 50% 0; transform: scaleY(0); transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .mark[aria-pressed="true"] .f { transform: scaleY(1); }
  .spark { position: absolute; left: 0; top: 0; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: var(--brass-a); transform: rotate(45deg); pointer-events: none; z-index: 4; border-radius: 1px; }

  /* ---------- Shelf: saved books stand here as spines ---------- */
  .shelf { position: relative; margin-top: 22px; }
  .spines { position: relative; display: flex; align-items: flex-end; gap: 5px; min-height: 66px; padding: 0 10px; overflow-x: clip; }
  .spine { position: relative; width: 22px; border-radius: 3px 3px 1px 1px; background: linear-gradient(90deg, rgba(0, 0, 0, 0.18), transparent 30%, rgba(255, 255, 255, 0.16) 60%, rgba(0, 0, 0, 0.12)), var(--c); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.2); transform-origin: 50% 100%; }
  .spine::before, .spine::after { content: ""; position: absolute; left: 3px; right: 3px; height: 2px; border-radius: 1px; background: rgba(255, 236, 190, 0.75); }
  .spine::before { top: 9px; }
  .spine::after { bottom: 10px; }
  .spine b { position: absolute; left: 50%; top: 18px; width: 4px; height: 12px; margin-left: -2px; border-radius: 0 0 2px 2px; background: var(--r); }
  .empty { position: absolute; left: 12px; bottom: 10px; margin: 0; font-size: 0.78rem; color: var(--muted); transition: opacity 0.3s; }
  .empty.gone { opacity: 0; }
  .plank { display: block; height: 12px; border-radius: 3px; background: linear-gradient(180deg, var(--plank-a), var(--plank-b)); box-shadow: 0 10px 16px -10px var(--shadow); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* roomy screens (full-screen view): draw the piece larger */
  @media (min-width: 1100px) and (min-height: 780px) { .desk { scale: 1.22; } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .twinkle, .rain line { animation: none; }
    .mark, .mark .f, .empty { transition: none; }
  }
</style>

<script>
  // Ribbon Mark: bookmark toggles with a real silk ribbon.
  // Save = the clasp squashes and the book lifts (anticipation) → a satin ribbon unrolls down the cover, swings on a
  // little cloth simulation and catches a sheen of light → gold sparks fly and the book's spine drops onto the shelf.
  // Unsave = the ribbon is pulled back up into the clasp with a whip and the spine slides off the shelf.
  // The ribbon keeps breathing in a soft breeze and moves away when your pointer brushes it.
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var calm = matchMedia("(prefers-reduced-motion: reduce)");
    var desk = $("desk"), num = $("num"), status = $("status"), spines = $("spines"), empty = $("empty"), tallyText = $("tally-text");
    var N = 14; // points in each ribbon chain
    var saved = 0;

    function spring(stiff, damp) {
      var x = 0, v = 0, out = [0];
      for (var i = 0; i < 240; i++) { v += (-stiff * (x - 1) - damp * v) / 60; x += v / 60; out.push(x); if (Math.abs(v) < 0.01 && Math.abs(x - 1) < 0.002) break; }
      out[out.length - 1] = 1;
      return out;
    }
    function springTo(el, frame, stiff, damp) {
      var c = spring(stiff, damp);
      return el.animate(c.map(frame), { duration: (c.length * 1000) / 60, easing: "linear" });
    }
    // lighten (t > 0) or darken (t < 0) a #rrggbb colour
    function shade(hex, t) {
      var n = parseInt(hex.slice(1), 16), out = "#";
      [16, 8, 0].forEach(function (s) {
        var c = (n >> s) & 255;
        c = Math.round(t > 0 ? c + (255 - c) * t : c * (1 + t));
        out += ("0" + c.toString(16)).slice(-2);
      });
      return out;
    }

    // ---------- Build each book's ribbon layer ----------
    var items = [].slice.call(document.querySelectorAll(".book")).map(function (li, i) {
      var rib = li.dataset.ribbon, svg = li.querySelector(".ribbon");
      svg.innerHTML =
        '<defs>' +
        '<linearGradient id="satin' + i + '" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0" stop-color="' + shade(rib, -0.35) + '"/><stop offset="0.28" stop-color="' + rib + '"/>' +
        '<stop offset="0.52" stop-color="' + shade(rib, 0.32) + '"/><stop offset="0.76" stop-color="' + rib + '"/>' +
        '<stop offset="1" stop-color="' + shade(rib, -0.4) + '"/></linearGradient>' +
        '<linearGradient id="sheen' + i + '" gradientUnits="userSpaceOnUse" x1="0" y1="-200" x2="0" y2="-150">' +
        '<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
        '<filter id="soft' + i + '" x="-60%" y="-20%" width="220%" height="150%"><feGaussianBlur stdDeviation="2.4"/></filter>' +
        '</defs>' +
        '<path class="shade" fill="rgba(0,0,0,0.35)" filter="url(#soft' + i + ')"/>' +
        '<path class="body" fill="url(#satin' + i + ')"/>' +
        '<path class="sheen" fill="url(#sheen' + i + ')"/>' +
        '<path class="stitch"/>';
      var it = {
        i: i, li: li, title: li.dataset.title, rib: rib, c1: getComputedStyle(li).getPropertyValue("--c1").trim() || rib,
        btn: li.querySelector(".mark"), cover: li.querySelector(".cover"), lift: li.querySelector(".lift"), svg: svg,
        body: svg.querySelector(".body"), shadeP: svg.querySelector(".shade"), sheenP: svg.querySelector(".sheen"), stitch: svg.querySelector(".stitch"),
        sheenG: svg.querySelector("#sheen" + i),
        on: false, len: 0, lv: 0, target: 0, sheen: -1, sheenAt: 0, pts: [], spine: null, run: 0,
        sh: 50 + ((i * 7) % 13)
      };
      for (var k = 0; k < N; k++) it.pts.push({ x: 0, y: 0, px: 0, py: 0 });
      return it;
    });

    // measure the cover (in its own unscaled pixels) and set the ribbon's size from it
    function layout(it) {
      it.w = it.cover.offsetWidth; it.h = it.cover.offsetHeight;
      it.svg.setAttribute("viewBox", "0 0 " + it.w + " " + it.h);
      it.ax = it.w * 0.78; it.ay = 0;
      it.W = Math.max(11, Math.min(24, it.w * 0.15));
      it.L = it.h * 0.5;
      if (it.on) it.target = it.L;
      if (!it.on && it.len === 0) it.pts.forEach(function (p) { p.x = p.px = it.ax; p.y = p.py = it.ay; });
      if (calm.matches) straighten(it);
    }
    function straighten(it) {
      it.len = it.target; it.lv = 0;
      it.pts.forEach(function (p, k) { p.x = p.px = it.ax; p.y = p.py = it.ay + (it.len * k) / (N - 1); });
      draw(it);
    }

    // ---------- Cloth: a Verlet chain hanging from the clasp ----------
    function step(it, t) {
      // the ribbon's length follows its target on a soft spring, so it drops, stretches a touch and settles
      it.lv = (it.lv + (it.target - it.len) * 0.075) * 0.8;
      it.len = Math.max(0, it.len + it.lv);
      var P = it.pts, seg = it.len / (N - 1);
      var breeze = it.on ? Math.sin(t * 0.0012 + it.i * 1.9) * 0.05 + Math.sin(t * 0.0031 + it.i) * 0.025 : 0;
      for (var k = 1; k < N; k++) {
        var p = P[k], vx = (p.x - p.px) * 0.965, vy = (p.y - p.py) * 0.965;
        p.px = p.x; p.py = p.y;
        p.x += vx + breeze * (k / N);
        p.y += vy + 0.42;
      }
      P[0].x = P[0].px = it.ax; P[0].y = P[0].py = it.ay;
      for (var r = 0; r < 10; r++) {
        for (k = 0; k < N - 1; k++) {
          var a = P[k], b = P[k + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.0001, diff = (d - seg) / d;
          if (k === 0) { b.x -= dx * diff; b.y -= dy * diff; }
          else { a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; }
        }
      }
      for (k = 1; k < N; k++) if (P[k].y < it.ay) P[k].y = it.ay; // never above the cover's top edge
    }

    // turn the chain into a satin strip with a V-notched tail and stitched edges
    function draw(it) {
      var P = it.pts;
      if (it.len < 0.6 && it.target === 0) { it.body.setAttribute("d", ""); it.shadeP.setAttribute("d", ""); it.sheenP.setAttribute("d", ""); it.stitch.setAttribute("d", ""); return; }
      var W = it.W * Math.min(1, it.len / 18 + 0.25), h = W / 2, L = [], R = [], SL = [], SR = [];
      for (var k = 0; k < N; k++) {
        var a = P[Math.max(0, k - 1)], b = P[Math.min(N - 1, k + 1)], tx = b.x - a.x, ty = b.y - a.y, tl = Math.sqrt(tx * tx + ty * ty) || 1;
        tx /= tl; ty /= tl;
        if (tl < 0.01) { tx = 0; ty = 1; }
        var nx = -ty, ny = tx, p = P[k];
        L.push([p.x + nx * h, p.y + ny * h]); R.push([p.x - nx * h, p.y - ny * h]);
        SL.push([p.x + nx * (h - 2.6), p.y + ny * (h - 2.6)]); SR.push([p.x - nx * (h - 2.6), p.y - ny * (h - 2.6)]);
        if (k === N - 1) it.tail = { x: p.x - tx * W * 0.55, y: p.y - ty * W * 0.55 };
      }
      function pts(arr) { return arr.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L"); }
      var d = "M" + pts(L) + " L" + it.tail.x.toFixed(1) + " " + it.tail.y.toFixed(1) + " L" + pts(R.slice().reverse()) + " Z";
      it.body.setAttribute("d", d);
      it.sheenP.setAttribute("d", d);
      it.shadeP.setAttribute("d", d);
      it.shadeP.setAttribute("transform", "translate(2.5 4)");
      it.stitch.setAttribute("d", it.len > 20 ? "M" + pts(SL.slice(1, -1)) + " M" + pts(SR.slice(1, -1)) : "");
      // the sheen band slides down the ribbon after it lands
      var y = it.ay + it.sheen * it.L;
      it.sheenG.setAttribute("y1", (y - 22).toFixed(1));
      it.sheenG.setAttribute("y2", (y + 22).toFixed(1));
    }

    function loop(t) {
      items.forEach(function (it) {
        if (calm.matches) return;
        if (it.len === 0 && it.target === 0) return;
        if (it.sheenAt) { it.sheen = Math.min(1.4, (t - it.sheenAt) / 800 - 0.3); if (it.sheen >= 1.4) it.sheenAt = 0; }
        step(it, t);
        if (it.target === 0 && it.len < 0.6) { it.len = 0; it.lv = 0; }
        draw(it);
      });
      requestAnimationFrame(loop);
    }

    // brushing the ribbon with the pointer pushes the cloth
    var last = null;
    desk.addEventListener("pointermove", function (e) {
      if (calm.matches) return;
      if (last) {
        var mx = e.clientX - last.x, my = e.clientY - last.y;
        items.forEach(function (it) {
          if (it.len < 10) return;
          var r = it.cover.getBoundingClientRect(), k = r.width / it.w || 1;
          var x = (e.clientX - r.left) / k, y = (e.clientY - r.top) / k;
          it.pts.forEach(function (p, j) {
            if (j === 0) return;
            var dx = p.x - x, dy = p.y - y;
            if (dx * dx + dy * dy < 26 * 26) { p.px -= (mx / k) * 0.4; p.py -= (my / k) * 0.15; }
          });
        });
      }
      last = { x: e.clientX, y: e.clientY };
    });
    desk.addEventListener("pointerleave", function () { last = null; });

    // ---------- Count, sparks and shelf ----------
    function roll(text, up) {
      while (num.children.length > 1) num.removeChild(num.firstElementChild);
      var old = num.firstElementChild;
      old.getAnimations().forEach(function (a) { a.cancel(); });
      var next = document.createElement("span");
      next.textContent = text;
      if (calm.matches) { num.replaceChild(next, old); return; }
      next.style.cssText = "position:absolute;left:0;top:0";
      num.appendChild(next);
      var d = up ? 1 : -1;
      old.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(" + -100 * d + "%)", opacity: 0 }], { duration: 200, easing: "ease-in", fill: "forwards" })
        .finished.then(function () { old.remove(); next.style.position = ""; }).catch(function () {});
      springTo(next, function (p) { return { transform: "translateY(" + ((1 - p) * 100 * d).toFixed(1) + "%)" }; }, 300, 15);
    }
    function sparks(it) {
      var cx = it.btn.offsetLeft + 17, cy = it.btn.offsetTop + 17;
      for (var s = 0; s < 8; s++) {
        var e = document.createElement("i");
        e.className = "spark";
        it.cover.appendChild(e);
        var a = -Math.PI * 0.95 + (s / 7) * Math.PI * 0.9 + (Math.random() - 0.5) * 0.3, r = 26 + Math.random() * 18;
        var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        e.animate([
          { transform: "translate(" + cx + "px," + cy + "px) rotate(45deg) scale(0.2)", opacity: 1 },
          { transform: "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(225deg) scale(1)", opacity: 1, offset: 0.6 },
          { transform: "translate(" + x.toFixed(1) + "px," + (y + 8).toFixed(1) + "px) rotate(300deg) scale(0.3)", opacity: 0 }
        ], { duration: 640 + s * 20, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)" }).finished.then((function (el) { return function () { el.remove(); }; })(e), (function (el) { return function () { el.remove(); }; })(e));
      }
    }
    // slide the other spines into their new places (FLIP)
    function flipSpines(change) {
      var before = new Map();
      [].forEach.call(spines.children, function (c) { before.set(c, c.offsetLeft); });
      change();
      if (calm.matches) return;
      [].forEach.call(spines.children, function (c) {
        if (!before.has(c)) return;
        var dx = before.get(c) - c.offsetLeft;
        if (dx) c.animate([{ transform: "translateX(" + dx + "px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(0.3, 1.4, 0.5, 1)" });
      });
    }
    function shelf(it, on) {
      if (on) {
        var s = document.createElement("i");
        s.className = "spine";
        s.style.setProperty("--c", it.c1);
        s.style.setProperty("--r", it.rib);
        s.style.height = it.sh + "px";
        s.dataset.i = it.i;
        s.innerHTML = "<b></b>";
        it.spine = s;
        flipSpines(function () {
          var before = null;
          [].forEach.call(spines.children, function (c) { if (!before && !c.dataset.out && +c.dataset.i > it.i) before = c; });
          spines.insertBefore(s, before);
        });
        if (!calm.matches) springTo(s, function (p) { return { transform: "translateY(" + ((1 - p) * -60).toFixed(1) + "px) rotate(" + ((1 - p) * -16).toFixed(1) + "deg)", opacity: Math.min(1, p * 3) }; }, 190, 10);
      } else if (it.spine) {
        var old = it.spine;
        it.spine = null;
        old.dataset.out = "1";
        var gone = function () { flipSpines(function () { old.remove(); }); };
        if (calm.matches) gone();
        else old.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(-14px) rotate(12deg)", opacity: 0 }], { duration: 300, easing: "ease-in", fill: "forwards" }).finished.then(gone, gone);
      }
      empty.classList.toggle("gone", saved > 0);
    }

    // ---------- Save and unsave ----------
    function setSaved(it, on) {
      if (it.on === on) return;
      var id = ++it.run;
      it.on = on;
      saved += on ? 1 : -1;
      it.btn.setAttribute("aria-pressed", String(on));
      roll(String(saved), on);
      tallyText.textContent = saved + (saved === 1 ? " book saved" : " books saved");
      status.textContent = (on ? "Bookmarked " : "Bookmark removed from ") + it.title + ". " + tallyText.textContent + ".";
      shelf(it, on);
      if (calm.matches) { it.target = on ? it.L : 0; straighten(it); return; }
      it.btn.getAnimations().forEach(function (a) { a.cancel(); });
      it.lift.getAnimations().forEach(function (a) { a.cancel(); });
      if (on) {
        // anticipation: the clasp squashes and the book rises off the desk
        it.btn.animate([{ transform: "scale(1)" }, { transform: "scale(0.78) rotate(-12deg)" }, { transform: "scale(1.12) rotate(6deg)" }, { transform: "scale(1)" }], { duration: 460, easing: "cubic-bezier(0.3, 1.4, 0.5, 1)" });
        springTo(it.lift, function (p) { var s = Math.sin(p * Math.PI); return { transform: "translateY(" + (-7 * s).toFixed(2) + "px) rotate(" + (-1.4 * s).toFixed(2) + "deg)" }; }, 160, 9);
        setTimeout(function () {
          if (id !== it.run) return;
          // the ribbon unrolls with a sideways kick so it swings as it falls
          it.target = it.L; it.lv = 3.2;
          it.pts.forEach(function (p, k) { p.px = p.x - (k / N) * 2.6; });
          sparks(it);
          it.sheenAt = performance.now() + 380;
        }, 120);
      } else {
        it.btn.animate([{ transform: "rotate(0)" }, { transform: "rotate(-16deg)" }, { transform: "rotate(12deg)" }, { transform: "rotate(-5deg)" }, { transform: "rotate(0)" }], { duration: 480, easing: "ease-out" });
        it.target = 0; it.lv = -1.6;
        it.pts.forEach(function (p, k) { p.py = p.y + (k / N) * 3.5; p.px = p.x + (k / N) * 1.8; }); // a whip upwards
        it.lift.animate([{ transform: "none" }, { transform: "translateY(2px) rotate(0.8deg)" }, { transform: "none" }], { duration: 380, easing: "ease-out" });
      }
    }

    items.forEach(function (it) {
      it.btn.addEventListener("click", function () { setSaved(it, !it.on); });
    });

    function relayout() { items.forEach(layout); }
    relayout();
    addEventListener("resize", relayout);
    if (window.ResizeObserver) new ResizeObserver(relayout).observe(desk);
    requestAnimationFrame(loop);

    // ---------- Auto demo: save and unsave books in turn until a real input ----------
    var demoOn = !calm.matches, timer = 0, order = [1, 0, 2, 1, 0, 2], step_ = 0;
    function stopDemo(e) { if (e.isTrusted && demoOn) { demoOn = false; clearTimeout(timer); } }
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) { addEventListener(t, stopDemo, { capture: true, passive: true }); });
    function demo() {
      if (!demoOn) return;
      var it = items[order[step_ % order.length]];
      step_++;
      setSaved(it, !it.on);
      timer = setTimeout(demo, 2100);
    }
    if (demoOn) timer = setTimeout(demo, 400);
  })();
</script>
</body>
</html>
