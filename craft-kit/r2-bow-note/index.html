<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bow Note · gift wrap and note step</title>
<script>
  // Theme: ?theme=light|dark wins, otherwise follow the system setting (and its changes)
  (function () {
    var d = document.documentElement, q = new URLSearchParams(location.search).get("theme"), m = matchMedia("(prefers-color-scheme: dark)");
    function set() { d.dataset.theme = q === "light" || q === "dark" ? q : m.matches ? "dark" : "light"; }
    set();
    if (m.addEventListener) m.addEventListener("change", set);
  })();
</script>
<style>
  /* ---------- Colour tokens: blush paper, plum ink, gold ribbon ---------- */
  :root {
    color-scheme: light;
    --bg1: #fdf2f6;
    --bg2: #ead3e4;
    --ink: #2d1830;
    --muted: #82657f;
    --panel: #fffbfd;
    --well: #f9eef4;
    --line: #efdbe7;
    --plum: #7b2d6b;
    --plum-l: #a1458f;
    --box: #c8a27a;
    --box-d: #a07a52;
    --focus: #0e7490;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #321b33;
    --bg2: #0e070f;
    --ink: #fbeefa;
    --muted: #bf9fbd;
    --panel: #1c111d;
    --well: #261827;
    --line: #382639;
    --plum: #c76bb3;
    --plum-l: #e08bcc;
    --focus: #67e8f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(520px 360px at 50% 30%, rgba(226, 179, 74, .18), transparent 70%), radial-gradient(900px 640px at 50% 0%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
  }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 16px; overflow: clip; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .card {
    width: min(396px, 100%);
    padding: 16px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px -30px rgba(80, 20, 70, .45), 0 8px 20px -12px rgba(80, 20, 70, .25);
    animation: rise .7s var(--spring) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .head h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

  /* switches */
  .sw { position: relative; flex: none; width: 50px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: var(--line); cursor: pointer; transition: background .3s; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .3); transition: transform .4s var(--spring); }
  .sw[aria-checked="true"] { background: var(--plum); }
  .sw[aria-checked="true"]::after { transform: translateX(20px); }
  .sw.sm { width: 42px; height: 24px; }
  .sw.sm::after { width: 18px; height: 18px; }
  .sw.sm[aria-checked="true"]::after { transform: translateX(18px); }

  /* ---------- Gift scene ---------- */
  .scene { position: relative; margin-top: 10px; border-radius: 18px; background: radial-gradient(180px 110px at 50% 60%, color-mix(in srgb, var(--plum) 12%, transparent), transparent 75%), var(--well); overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }
  .fl { transform-box: fill-box; }
  #boxG { transform-box: fill-box; transform-origin: 50% 100%; }
  #bow { transform-box: fill-box; transform-origin: 50% 70%; }
  .tag {
    position: absolute;
    left: 73%;
    top: 31%;
    width: 25%;
    min-height: 34%;
    padding: 16px 7px 8px;
    border-radius: 6px 6px 10px 10px;
    background: linear-gradient(180deg, #fffaf0, #f6ead2);
    color: #4a2a44;
    box-shadow: 0 8px 14px -8px rgba(60, 20, 50, .6);
    font: italic 500 11.5px/1.3 Georgia, "Times New Roman", serif;
    transform-origin: 50% -14px;
    opacity: 0;
  }
  .tag::before { content: ""; position: absolute; top: 5px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--bg2); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .3); }
  .tag p { margin: 0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .tag small { display: block; margin-top: 4px; text-align: right; font-size: 10.5px; }
  .tag em[hidden] { display: none; }
  .tag em { display: block; margin-top: 4px; font: 700 8.5px/1.2 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #9b6b8f; font-style: normal; }
  .tag.idle { animation: dangle 3s ease-in-out infinite alternate; }
  @keyframes dangle { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }

  /* ---------- Controls ---------- */
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; transition: opacity .3s; }
  fieldset:disabled { opacity: .45; }
  .opts { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .grp { display: grid; gap: 5px; }
  .grp > span { font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 7px; }
  .pp, .rb { position: relative; padding: 0; border: 0; cursor: pointer; transition: transform .35s var(--spring), box-shadow .25s; }
  .pp { width: 38px; height: 38px; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
  .pp svg { display: block; width: 100%; height: 100%; }
  .rb { width: 30px; height: 30px; margin-top: 4px; border-radius: 50%; background: linear-gradient(135deg, var(--c), var(--d)); box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .2); }
  .pp:hover, .rb:hover { transform: translateY(-2px); }
  .pp[aria-pressed="true"], .rb[aria-pressed="true"] { transform: translateY(-2px); box-shadow: 0 0 0 2.5px var(--panel), 0 0 0 5px var(--plum); }
  .msg { display: grid; gap: 4px; margin-top: 10px; }
  .msg label, .from label { font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .msg label b { font-weight: 600; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  textarea, .from input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--well); color: var(--ink); font: inherit; font-size: 14px; }
  textarea { height: 56px; padding: 8px 10px; resize: none; }
  .two { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-top: 8px; }
  .from { display: grid; gap: 4px; }
  .from input { height: 36px; padding: 0 10px; }
  .rcpt { display: flex; align-items: center; gap: 8px; height: 36px; font-size: 12px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  textarea:focus, .from input:focus { border-color: var(--plum); background: var(--panel); outline: none; }
  .sw:focus-visible, .pp:focus-visible, .rb:focus-visible, textarea:focus-visible, .from input:focus-visible, .go:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .sum { display: grid; gap: 2px; margin-top: 10px; font-size: 13px; }
  .sum div { display: flex; justify-content: space-between; color: var(--muted); }
  .sum b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sum .t { margin-top: 3px; padding-top: 5px; border-top: 1px dashed var(--line); font-size: 15px; color: var(--ink); font-weight: 700; }
  .go {
    width: 100%;
    height: 50px;
    margin-top: 8px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--plum-l), var(--plum));
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 12px 22px -12px var(--plum);
    transition: transform .3s var(--spring), background .3s;
  }
  .go:hover { transform: translateY(-2px); }
  .go.ok { background: linear-gradient(180deg, #e2b34a, #b0821f); color: #2d1830; }
  .note { margin: 6px 0 0; min-height: 1.3em; text-align: center; font-size: 12px; color: var(--muted); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  @media (max-width: 370px) { .pp { width: 33px; height: 33px; } .rb { width: 27px; height: 27px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="ttl">
    <header class="head">
      <div><h1 id="ttl">Make it a gift</h1><p>Paper, ribbon and a tag · PKR 250</p></div>
      <button class="sw" id="gift" type="button" role="switch" aria-checked="false" aria-label="Gift wrap this order"></button>
    </header>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 320 190" id="svg">
        <defs>
          <pattern id="p-stars" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#1f6b4f" /><path d="M7 3l1.3 2.7 3 .4-2.2 2 .6 3L7 9.6l-2.7 1.5.6-3-2.2-2 3-.4z" fill="#e8c35a" /><path d="M19 14a4.2 4.2 0 1 0 3.3 7 3.4 3.4 0 1 1-3.3-7z" fill="#e8c35a" /></pattern>
          <pattern id="p-dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#ef9fb3" /><circle cx="4" cy="4" r="2.4" fill="#fff" /><circle cx="12" cy="12" r="2.4" fill="#fff" /></pattern>
          <pattern id="p-kraft" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#c99b68" /><path d="M0 14L14 0M-4 4L4-4M10 18l8-8" stroke="#b0844f" stroke-width="1.2" /><path d="M7 9.5c-2.2-1.6-2.2-3.6-1-4 .6-.2 1 .2 1 .6 0-.4.4-.8 1-.6 1.2.4 1.2 2.4-1 4z" fill="#8a3b3b" opacity=".75" /></pattern>
          <pattern id="p-night" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#1f2a5c" /><path d="M4 5l3 2M14 15l2 3M16 4l-1 3M5 16l3-1" stroke="#e8c35a" stroke-width="1.6" stroke-linecap="round" /><circle cx="11" cy="10" r="1" fill="#fff" opacity=".8" /></pattern>
          <linearGradient id="foldL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".18" /><stop offset=".85" stop-color="#fff" stop-opacity=".08" /><stop offset="1" stop-color="#000" stop-opacity=".12" /></linearGradient>
          <linearGradient id="foldR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".12" /><stop offset=".15" stop-color="#fff" stop-opacity=".06" /><stop offset="1" stop-color="#000" stop-opacity=".24" /></linearGradient>
          <linearGradient id="foldT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18" /><stop offset="1" stop-color="#000" stop-opacity=".18" /></linearGradient>
        </defs>
        <ellipse cx="160" cy="178" rx="96" ry="8" fill="#000" opacity=".12" />
        <path id="string" d="M160 60C198 42 240 44 274 61" fill="none" stroke="var(--muted)" stroke-width="1.2" opacity="0" />
        <g id="boxG">
          <!-- the plain cardboard box -->
          <rect x="90" y="84" width="140" height="94" rx="4" fill="var(--box)" />
          <rect x="84" y="62" width="152" height="26" rx="4" fill="var(--box-d)" />
          <rect x="146" y="62" width="28" height="26" fill="#e6d3b3" opacity=".7" />
          <path d="M96 92h128" stroke="#000" stroke-opacity=".12" />
          <!-- paper flaps: left and right halves fold round the body, the top folds over the lid -->
          <g id="flapL" class="fl" style="transform-origin: 0 50%; transform: scaleX(0)"><rect x="90" y="84" width="70" height="94" rx="4" fill="url(#p-stars)" class="pf" /><rect x="90" y="84" width="70" height="94" fill="url(#foldL)" /></g>
          <g id="flapR" class="fl" style="transform-origin: 100% 50%; transform: scaleX(0)"><rect x="160" y="84" width="70" height="94" rx="4" fill="url(#p-stars)" class="pf" /><rect x="160" y="84" width="70" height="94" fill="url(#foldR)" /></g>
          <g id="flapT" class="fl" style="transform-origin: 50% 0; transform: scaleY(0)"><rect x="84" y="62" width="152" height="26" rx="4" fill="url(#p-stars)" class="pf" /><rect x="84" y="62" width="152" height="26" rx="4" fill="url(#foldT)" /><path d="M86 87h148" stroke="#000" stroke-opacity=".25" stroke-width="2" /></g>
          <!-- ribbon -->
          <rect id="ribV" class="fl rib" x="152" y="62" width="16" height="116" style="transform-origin: 50% 0; transform: scaleY(0)" />
          <rect id="ribH" class="fl rib" x="90" y="122" width="140" height="14" style="transform-origin: 50% 50%; transform: scaleX(0)" />
          <g id="bow" style="transform: scale(0)">
            <path class="rib" d="M160 62C136 38 116 50 126 66S152 68 160 62Z" />
            <path class="rib" d="M160 62C184 38 204 50 194 66S168 68 160 62Z" />
            <path class="ribD" d="M160 62C150 52 138 52 136 58M160 62C170 52 182 52 184 58" fill="none" stroke-width="2" />
            <path class="ribD" d="M160 62l-12 26 7-2 3 6zM160 62l12 26-7-2-3 6z" />
            <circle class="ribD" cx="160" cy="62" r="7" />
          </g>
        </g>
      </svg>
      <div class="tag" id="tag"><p id="tagTxt">Happy Eid!</p><small id="tagFrom">Ayesha</small><em id="tagRc" hidden>Gift receipt inside</em></div>
    </div>

    <fieldset id="opts" disabled>
      <legend class="vh">Gift options</legend>
      <div class="opts">
        <div class="grp"><span>Paper</span><div class="row" id="papers"></div></div>
        <div class="grp"><span>Ribbon</span><div class="row" id="ribbons"></div></div>
      </div>
      <div class="msg">
        <label for="msg">Note on the tag <b id="cnt">0 / 120</b></label>
        <textarea id="msg" maxlength="120" placeholder="Write a few words for the tag"></textarea>
      </div>
      <div class="two">
        <div class="from"><label for="from">From</label><input id="from" maxlength="24" value="Ayesha" autocomplete="given-name"></div>
        <div class="rcpt"><button class="sw sm" id="rc" type="button" role="switch" aria-checked="false" aria-labelledby="rcL"></button><span id="rcL">Gift receipt, no prices</span></div>
      </div>
    </fieldset>

    <div class="sum">
      <div><span>Order · 2 items</span><b>PKR 4,200</b></div>
      <div><span>Gift wrap and tag</span><b id="wrapFee">PKR 0</b></div>
      <div class="t"><span>Total</span><b id="total">PKR 4,200</b></div>
    </div>
    <button class="go" id="go" type="button"><span id="goTxt">Continue without wrap</span></button>
    <p class="note" id="note" aria-live="polite">Switch on gift wrap to choose paper, ribbon and a note.</p>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
  // ---------- Bow Note: the box wraps itself in the paper you pick, ties the ribbon and hangs your note ----------
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => "PKR " + Math.round(n).toLocaleString("en-US");
  const calmQ = matchMedia("(prefers-reduced-motion: reduce)");
  const calm = () => calmQ.matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm() ? Math.min(ms, 60) : ms));
  const play = (el, frames, opts) => (calm() || !el.animate ? Promise.resolve() : el.animate(frames, opts).finished.catch(() => {}));
  const E = { out: (t) => 1 - Math.pow(1 - t, 3), in: (t) => t * t * t, inOut: (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), back: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) };
  function tween(ms, fn, ease) {
    return new Promise((res) => {
      if (calm()) { fn(1); res(); return; }
      const s = performance.now();
      requestAnimationFrame(function f(now) { const t = Math.max(0, Math.min(1, (now - s) / ms)); fn((ease || E.out)(t)); t < 1 ? requestAnimationFrame(f) : res(); });
    });
  }
  let busy = false, queued = null;
  function run(fn) {
    return new Promise((res) => {
      const go = async () => { busy = true; try { await fn(); } finally { busy = false; res(); if (queued) { const q = queued; queued = null; q(); } } };
      if (busy) queued = go; else go();
    });
  }
  const note = (t) => { $("note").textContent = t; };

  // ---------- Options ----------
  const ORDER = 4200, FEE = 250;
  const PAPERS = [{ k: "stars", name: "Eid stars" }, { k: "dots", name: "Rose dots" }, { k: "kraft", name: "Kraft hearts" }, { k: "night", name: "Midnight gold" }];
  const RIBBONS = [{ k: "gold", name: "Gold", c: "#e2b34a", d: "#a87a18" }, { k: "pearl", name: "Pearl", c: "#f8f3ea", d: "#c9bea9" }, { k: "crimson", name: "Crimson", c: "#c2264b", d: "#851330" }];
  let gift = false, paper = 0, ribbon = 0, wrapped = false, receipt = false;

  PAPERS.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pp";
    b.setAttribute("aria-label", p.name + " paper");
    b.setAttribute("aria-pressed", String(i === paper));
    b.innerHTML = `<svg viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" fill="url(#p-${p.k})"/></svg>`;
    b.addEventListener("click", () => run(() => setPaper(i)));
    $("papers").appendChild(b);
  });
  RIBBONS.forEach((r, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "rb";
    b.style.setProperty("--c", r.c);
    b.style.setProperty("--d", r.d);
    b.setAttribute("aria-label", r.name + " ribbon");
    b.setAttribute("aria-pressed", String(i === ribbon));
    b.addEventListener("click", () => run(() => setRibbon(i)));
    $("ribbons").appendChild(b);
  });
  // arrow keys inside each swatch row
  ["papers", "ribbons"].forEach((id) => $(id).addEventListener("keydown", (e) => {
    const bs = [...$(id).children], i = bs.indexOf(document.activeElement), d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (i < 0 || !d) return;
    e.preventDefault();
    const j = (i + d + bs.length) % bs.length;
    bs[j].focus();
    bs[j].click();
  }));
  function paintRibbon() {
    const r = RIBBONS[ribbon];
    document.querySelectorAll("#svg .rib").forEach((el) => el.setAttribute("fill", r.c));
    document.querySelectorAll("#svg .ribD").forEach((el) => { el.getAttribute("fill") === "none" ? el.setAttribute("stroke", r.d) : el.setAttribute("fill", r.d); });
  }
  const paintPaper = () => document.querySelectorAll("#svg .pf").forEach((el) => el.setAttribute("fill", `url(#p-${PAPERS[paper].k})`));
  const S = (id, v) => { $(id).style.transform = v; };

  // ---------- Wrap and unwrap ----------
  async function wrap() {
    paintPaper();
    paintRibbon();
    play($("boxG"), [{ transform: "none" }, { transform: "translateY(-8px) scale(1.02, .98)" }, { transform: "none" }], { duration: 380, easing: "ease-out" });
    await tween(300, (t) => S("flapL", `scaleX(${t})`), E.back);
    await tween(300, (t) => S("flapR", `scaleX(${t})`), E.back);
    await tween(280, (t) => S("flapT", `scaleY(${t})`), E.back);
    sparkle(160, 86, 10);
    await tween(240, (t) => S("ribV", `scaleY(${t})`), E.out);
    await tween(240, (t) => S("ribH", `scaleX(${t})`), E.out);
    await tween(520, (t) => S("bow", `rotate(${(-30 * (1 - t)).toFixed(1)}deg) scale(${t})`), E.back);
    sparkle(160, 62, 18);
    wrapped = true;
    await showTag(true);
  }
  async function unwrap(fast) {
    const k = fast ? .55 : 1;
    await showTag(false);
    await tween(200 * k, (t) => S("bow", `scale(${1 - t})`), E.in);
    await tween(160 * k, (t) => { S("ribH", `scaleX(${1 - t})`); S("ribV", `scaleY(${1 - t})`); }, E.in);
    await tween(180 * k, (t) => S("flapT", `scaleY(${1 - t})`), E.in);
    await tween(220 * k, (t) => { S("flapL", `scaleX(${1 - t})`); S("flapR", `scaleX(${1 - t})`); }, E.in);
    wrapped = false;
  }
  // The tag swings in on its string from the bow
  async function showTag(on) {
    const tag = $("tag");
    tag.classList.remove("idle");
    if (on) {
      $("string").setAttribute("opacity", "1");
      tag.style.opacity = 1;
      await play(tag, [{ transform: "rotate(-70deg) scale(.6)", opacity: 0 }, { transform: "rotate(14deg) scale(1.02)", opacity: 1, offset: .55 }, { transform: "rotate(-6deg)", offset: .8 }, { transform: "rotate(0)" }], { duration: 760, easing: "ease-out" });
      tag.classList.add("idle");
    } else {
      await play(tag, [{ transform: "rotate(0)", opacity: 1 }, { transform: "rotate(40deg) scale(.7)", opacity: 0 }], { duration: 240, easing: "ease-in" });
      tag.style.opacity = 0;
      $("string").setAttribute("opacity", "0");
    }
  }

  // ---------- Option changes ----------
  async function setGift(on) {
    if (on === gift) return;
    gift = on;
    $("gift").setAttribute("aria-checked", String(on));
    $("opts").disabled = !on;
    refreshTotals();
    if (on) { note("Wrapping it up…"); await wrap(); note(`Wrapped in ${PAPERS[paper].name} with a ${RIBBONS[ribbon].name.toLowerCase()} ribbon. ${fmt(FEE)} added.`); }
    else { note("Gift wrap removed."); await unwrap(false); }
  }
  async function setPaper(i) {
    [...$("papers").children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    if (i === paper && wrapped) { await play($("boxG"), [{ transform: "none" }, { transform: "rotate(-3deg)" }, { transform: "rotate(2deg)" }, { transform: "none" }], { duration: 420 }); return; }
    paper = i;
    if (!gift) return;
    note(`Re-wrapping in ${PAPERS[i].name}…`);
    if (wrapped) await unwrap(true);
    await wrap();
    note(`Wrapped in ${PAPERS[i].name}.`);
  }
  async function setRibbon(i) {
    [...$("ribbons").children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    ribbon = i;
    if (!wrapped) return;
    // the ribbon slips off and a new one is tied: bands shrink, recolour, grow, the bow pops
    await tween(160, (t) => { S("ribH", `scaleX(${1 - t})`); S("bow", `scale(${1 - t * .7})`); }, E.in);
    paintRibbon();
    await tween(220, (t) => S("ribH", `scaleX(${t})`), E.out);
    await tween(420, (t) => S("bow", `scale(${.3 + .7 * t})`), E.back);
    sparkle(160, 62, 12);
    note(`${RIBBONS[i].name} ribbon tied.`);
  }
  function refreshTotals() {
    $("wrapFee").textContent = fmt(gift ? FEE : 0);
    $("total").textContent = fmt(ORDER + (gift ? FEE : 0));
    if (!$("go").classList.contains("ok")) $("goTxt").textContent = gift ? `Save gift options · ${fmt(ORDER + FEE)}` : "Continue without wrap";
  }
  // Writing on the tag: live text, a small swing when you pause
  let swingT = 0;
  function syncTag() {
    const v = $("msg").value;
    $("cnt").textContent = `${v.length} / 120`;
    $("tagTxt").textContent = v.trim() || "Your note goes here";
    $("tagFrom").textContent = $("from").value.trim() ? "— " + $("from").value.trim() : "";
    clearTimeout(swingT);
    swingT = setTimeout(() => { if (wrapped) play($("tag"), [{ transform: "rotate(0)" }, { transform: "rotate(7deg)" }, { transform: "rotate(-3deg)" }, { transform: "rotate(0)" }], { duration: 700, easing: "ease-out" }); }, 450);
  }
  $("msg").addEventListener("input", syncTag);
  $("from").addEventListener("input", syncTag);
  $("gift").addEventListener("click", () => run(() => setGift(!gift)));
  $("rc").addEventListener("click", () => {
    receipt = !receipt;
    $("rc").setAttribute("aria-checked", String(receipt));
    $("tagRc").hidden = !receipt;
    note(receipt ? "A gift receipt without prices goes in the box." : "The normal receipt goes in the box.");
  });

  // ---------- Save: the box hops, the bow tightens, sparkles, the tag flips with a heart ----------
  async function save() {
    const btn = $("go");
    if (!gift) {
      play(btn, [{ transform: "scale(1)" }, { transform: "scale(.96)" }, { transform: "scale(1)" }], { duration: 300 });
      play($("gift"), [{ transform: "scale(1)" }, { transform: "scale(1.2)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
      note(`Going on without gift wrap. Total ${fmt(ORDER)}. Want it wrapped? Flip the switch.`);
      return;
    }
    if (!wrapped) await wrap();
    $("goTxt").textContent = "Saving…";
    await play($("boxG"), [{ transform: "none" }, { transform: "scale(1.04, .9)", offset: .25 }, { transform: "translateY(-18px) scale(.97, 1.05)", offset: .55 }, { transform: "translateY(0) scale(1.03, .96)", offset: .8 }, { transform: "none" }], { duration: 700, easing: "ease-in-out" });
    await tween(260, (t) => S("bow", `scale(${1 + .25 * Math.sin(t * Math.PI)})`), E.inOut);
    const r = $("svg").getBoundingClientRect();
    hearts(r.left + r.width / 2, r.top + r.height * .3);
    btn.classList.add("ok");
    $("goTxt").textContent = "Gift options saved";
    const msg = $("msg").value.trim();
    note(`Wrapped in ${PAPERS[paper].name}, ${RIBBONS[ribbon].name.toLowerCase()} ribbon${msg ? `, tag: “${msg.slice(0, 40)}${msg.length > 40 ? "…" : ""}”` : ""}. Total ${fmt(ORDER + FEE)}.`);
    await wait(1800);
    btn.classList.remove("ok");
    refreshTotals();
  }
  $("go").addEventListener("click", () => run(save));

  // ---------- Sparkles and hearts ----------
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  function sizeFx() { const r = devicePixelRatio || 1; fx.width = innerWidth * r; fx.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  sizeFx();
  addEventListener("resize", sizeFx);
  function add(x, y, n, power, kind) {
    if (calm()) return;
    const cols = kind === "heart" ? ["#e0567a", "#c2264b", "#f4a3b5", "#e2b34a"] : ["#e2b34a", "#fff6d8", "#f4a3b5", "#ffffff"];
    for (let i = 0; i < n; i++) {
      const a = kind === "heart" ? -Math.PI / 2 + (Math.random() - .5) * 2.4 : Math.random() * Math.PI * 2, s = (1 + Math.random() * 3) * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (kind === "heart" ? 1 : 1.5), r: kind === "heart" ? 4 + Math.random() * 3 : 1.4 + Math.random() * 2, c: cols[i % cols.length], life: 1, kind, rot: (Math.random() - .5) * .6 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
  }
  function sparkle(sx, sy, n) { const r = $("svg").getBoundingClientRect(); add(r.left + sx / 320 * r.width, r.top + sy / 190 * r.height, n, 1); }
  const hearts = (x, y) => add(x, y, 34, 2.2, "heart");
  function drawFx() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += p.kind === "heart" ? .08 : .12; p.vx *= .98; p.life -= .018;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.kind === "heart") {
        const s = p.r / 4;
        ctx.beginPath(); ctx.moveTo(0, 3 * s); ctx.bezierCurveTo(-6 * s, -1 * s, -3 * s, -6 * s, 0, -2.5 * s); ctx.bezierCurveTo(3 * s, -6 * s, 6 * s, -1 * s, 0, 3 * s); ctx.fill();
      } else { ctx.beginPath(); ctx.moveTo(0, -p.r * 1.6); ctx.lineTo(p.r * .45, 0); ctx.lineTo(0, p.r * 1.6); ctx.lineTo(-p.r * .45, 0); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Auto-demo: wraps, writes a note, changes paper and ribbon, saves ----------
  const demo = { on: true, t: 0, n: 0 };
  function stopDemo() { if (demo.on) { demo.on = false; clearTimeout(demo.t); } }
  addEventListener("pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  addEventListener("keydown", (e) => { if (e.isTrusted) stopDemo(); }, true);
  const NOTES = ["Happy Eid, Hina! Wear it to the wedding.", "Congratulations on the new job, Bilal!", "For the best sister in Karachi."];
  async function typeNote(text) {
    $("msg").value = "";
    syncTag();
    for (const ch of text) { if (!demo.on) return; $("msg").value += ch; syncTag(); await wait(38); }
  }
  async function demoLoop() {
    const n = demo.n++;
    const steps = [
      [() => run(() => setGift(true)), 300],
      [() => typeNote(NOTES[n % NOTES.length]), 700],
      [() => run(() => setPaper((paper + 1) % 4)), 600],
      [() => run(() => setRibbon((ribbon + 1) % 3)), 700],
      [() => run(save), 1600],
      [() => run(() => setGift(false)), 900],
    ];
    for (const [fn, pause] of steps) {
      if (!demo.on) return;
      await fn();
      if (!demo.on) return;
      await wait(pause);
    }
    if (demo.on) demo.t = setTimeout(demoLoop, 300);
  }
  paintRibbon();
  syncTag();
  refreshTotals();
  demo.t = setTimeout(demoLoop, 700);
</script>
</body>
</html>
