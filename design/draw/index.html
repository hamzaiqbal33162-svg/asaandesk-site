<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Draw and paint in your browser with layers, brushes and pen pressure. Free, private, works offline.">
<meta name="theme-color" content="#ffffff">
<title>Draw | AsaanDesk</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="app.css">
<link rel="modulepreload" href="paint.js">
</head>
<body data-tool="pen">
<header class="ad-bar top" id="topBar">
  <a class="ad-brand" href="/design/"><span class="ad-brand-mark" aria-hidden="true">a</span>AsaanDesk <span>Draw</span></a>
  <button class="btn sq phone-only" id="moreBtn" aria-label="File menu" aria-expanded="false" aria-controls="fileGroup">☰</button>
  <div class="grp file" id="fileGroup">
    <button class="btn" id="newBtn" title="Start a new drawing">New</button>
    <button class="btn" id="drawingsBtn" title="Your saved drawings">My drawings</button>
    <label class="btn" for="importInput" title="Add a picture as a new layer">Add image</label>
    <input id="importInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    <label class="btn" for="openFile" title="Open a .asaandesk-draw.json file">Open file</label>
    <input id="openFile" type="file" accept=".json,application/json" hidden>
  </div>
  <input class="ad-input doc-name desk-only" id="docName" aria-label="Drawing name" maxlength="80" value="My drawing">
  <span class="spacer"></span>
  <div class="grp hist">
    <button class="btn sq" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
    <button class="btn sq" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>↷</button>
  </div>
  <div class="grp zoom">
    <button class="btn sq desk-only" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out">−</button>
    <button class="btn zoom-pct" id="zoomPct" title="Fit to screen (0)" aria-label="Fit to screen">100%</button>
    <button class="btn sq desk-only" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
  </div>
  <span class="save-status" id="saveStatus" role="status" aria-live="polite" data-state="saved"><i aria-hidden="true"></i><span>Saved</span></span>
  <div class="export-wrap">
    <button class="btn primary" id="exportBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">Export</button>
    <div class="menu ad-panel" id="exportMenu" role="menu" hidden>
      <button role="menuitem" data-export="png">PNG <small>with background</small></button>
      <button role="menuitem" data-export="png-clear">PNG <small>transparent</small></button>
      <button role="menuitem" data-export="jpg">JPG <small>smaller file</small></button>
      <button role="menuitem" data-export="json">Drawing file <small>keeps layers</small></button>
    </div>
  </div>
</header>

<main class="work">
  <nav class="tools" id="tools" role="toolbar" aria-label="Tools">
    <button class="tool" data-tool="pencil" title="Pencil (P)" aria-label="Pencil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.6L15.6 5a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/></svg><span>Pencil</span></button>
    <button class="tool on" data-tool="pen" title="Pen (B)" aria-label="Pen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5.5 8.5L12 21l-5.5-9.5z"/><path d="M12 11.5V21"/><circle cx="12" cy="10.5" r="1.2"/></svg><span>Pen</span></button>
    <button class="tool" data-tool="marker" title="Marker (M)" aria-label="Marker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v9H8z"/><path d="M8 12l-1.5 4h11L16 12"/><path d="M9 16l1 5h4l1-5"/></svg><span>Marker</span></button>
    <button class="tool" data-tool="airbrush" title="Airbrush (A)" aria-label="Airbrush"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="9" width="9" height="12" rx="2.2"/><path d="M7.5 9V6h4v3"/><path d="M17 6h.01M20 4h.01M19.5 8h.01M17 10h.01M21 11h.01"/></svg><span>Airbrush</span></button>
    <button class="tool" data-tool="calligraphy" title="Calligraphy (K)" aria-label="Calligraphy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-5 2-3-3z"/><path d="M12 9l-6 9 2 1 6-7"/><path d="M3 21c3 0 4-1 5-2"/></svg><span>Calligraphy</span></button>
    <button class="tool" data-tool="smudge" title="Smudge (S)" aria-label="Smudge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20v-7.5a1.6 1.6 0 0 1 3.2 0V10a1.6 1.6 0 0 1 3.2 0v1a1.6 1.6 0 0 1 3.1.4V15a6 6 0 0 1-6 6h-1A2.5 2.5 0 0 1 9 20z"/><path d="M3 7c2-2 4 2 6 0"/></svg><span>Smudge</span></button>
    <button class="tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5L13.5 6a2 2 0 0 1 2.8 0l3.7 3.7a2 2 0 0 1 0 2.8L13 19.5H8z"/><path d="M8.5 11l6.5 6.5M8 19.5h12"/></svg><span>Eraser</span></button>
    <span class="tool-sep" aria-hidden="true"></span>
    <button class="tool" data-tool="fill" title="Paint bucket (G)" aria-label="Paint bucket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5l7-7 7.5 7.5-7 7z"/><path d="M4.5 11.5h14.5"/><path d="M20.5 15s1.8 2.6 1.8 3.9a1.8 1.8 0 0 1-3.6 0c0-1.3 1.8-3.9 1.8-3.9z"/></svg><span>Fill</span></button>
    <button class="tool" data-tool="shape" title="Shapes (U)" aria-label="Shapes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/><circle cx="16" cy="16" r="5"/></svg><span>Shapes</span></button>
    <button class="tool" data-tool="text" title="Text (T)" aria-label="Text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></svg><span>Text</span></button>
    <button class="tool" data-tool="picker" title="Pick a colour from the drawing (I)" aria-label="Colour picker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5a2.5 2.5 0 0 1 3.5 0l1.5 1.5a2.5 2.5 0 0 1 0 3.5L17 12l-5-5z"/><path d="M12.5 7.5L4 16v4h4l8.5-8.5"/></svg><span>Picker</span></button>
    <button class="tool" data-tool="hand" title="Move the view (H, or hold Space)" aria-label="Move the view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14c0 4-3 7-6.5 7S5 18.5 4 15.5l-1.4-3a1.5 1.5 0 0 1 2.6-1.4L8 13"/></svg><span>Move</span></button>
    <span class="tool-sep phone-only" aria-hidden="true"></span>
    <button class="tool phone-only" id="colorChip" aria-label="Colour and brush settings"><span class="chip" aria-hidden="true"></span><span>Colour</span></button>
    <button class="tool phone-only" id="brushSheetBtn" aria-label="Brush settings" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Brush</span></button>
    <button class="tool phone-only" id="layersSheetBtn" aria-label="Layers" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 17l9 5 9-5"/></svg><span>Layers</span></button>
  </nav>

  <section class="stage" id="stage" aria-label="Drawing canvas. Use the tools to paint." tabindex="-1">
    <canvas id="view" aria-hidden="true"></canvas>
    <textarea id="textInput" class="text-input" rows="1" wrap="off" spellcheck="false" aria-label="Type your text, then press Enter" hidden></textarea>
  </section>

  <aside class="side" id="side" aria-label="Settings">
    <section class="ad-panel sheet" id="brushPanel" aria-labelledby="brushTitle">
      <div class="sheet-head"><h2 id="brushTitle">Pen</h2><button class="btn sq phone-only sheet-close" data-close-sheet aria-label="Close">✕</button></div>
      <div class="color-row">
        <label class="color-well" title="Pick any colour"><input type="color" id="colorInput" value="#1f2937" aria-label="Colour"><span class="chip" aria-hidden="true"></span></label>
        <input class="ad-input hex" id="colorHex" value="#1f2937" maxlength="7" aria-label="Colour code" spellcheck="false" autocomplete="off">
      </div>
      <div class="swatches" id="brandColors" aria-label="Brand colours"></div>
      <div class="swatches recent" id="recentColors" aria-label="Recent colours"></div>
      <div class="opt" data-for="brush shape text"><label for="sizeRange"><span id="sizeLabel">Size</span> <output id="sizeVal">8 px</output></label><input type="range" id="sizeRange" min="1" max="200" value="8"></div>
      <div class="opt" data-for="brush shape text fill"><label for="opacityRange"><span id="opacityLabel">Opacity</span> <output id="opacityVal">100%</output></label><input type="range" id="opacityRange" min="1" max="100" value="100"></div>
      <div class="opt" data-for="brush"><label for="smoothRange">Smoothing <output id="smoothVal">45%</output></label><input type="range" id="smoothRange" min="0" max="90" value="45"></div>
      <div class="opt" data-for="fill"><label for="tolRange">Colour range <output id="tolVal">32</output></label><input type="range" id="tolRange" min="0" max="160" value="32"></div>
      <label class="check opt" data-for="fill"><input type="checkbox" id="sampleAll"> Look at all layers</label>
      <div class="opt" data-for="shape"><span class="lbl">Shape</span>
        <div class="seg" id="shapeKinds" role="radiogroup" aria-label="Shape">
          <button role="radio" data-kind="line" aria-checked="false">Line</button>
          <button role="radio" data-kind="rect" aria-checked="true" class="on">Box</button>
          <button role="radio" data-kind="ellipse" aria-checked="false">Circle</button>
        </div>
      </div>
      <label class="check opt" data-for="shape"><input type="checkbox" id="shapeFill"> Filled</label>
      <div class="opt" data-for="text"><label for="fontSel">Font</label><select class="ad-input" id="fontSel"></select></div>
      <label class="check opt" data-for="text"><input type="checkbox" id="textBold"> Bold</label>
      <p class="hint" id="toolHint"></p>
    </section>

    <section class="ad-panel sheet" id="layersPanel" aria-labelledby="layersTitle">
      <div class="sheet-head"><h2 id="layersTitle">Layers</h2>
        <button class="btn sm" id="addLayer" title="Add a layer on top">+ Add</button>
        <button class="btn sq phone-only sheet-close" data-close-sheet aria-label="Close">✕</button></div>
      <ul class="layer-list" id="layerList" role="listbox" aria-label="Layers, top first"></ul>
      <div class="opt"><label for="layerOpacity">Layer opacity <output id="layerOpacityVal">100%</output></label><input type="range" id="layerOpacity" min="0" max="100" value="100"></div>
      <div class="layer-actions">
        <button class="btn sm" id="layerUp" title="Move layer up" aria-label="Move layer up">↑ Up</button>
        <button class="btn sm" id="layerDown" title="Move layer down" aria-label="Move layer down">↓ Down</button>
        <button class="btn sm" id="layerDup" title="Duplicate layer">Copy</button>
        <button class="btn sm" id="layerMerge" title="Merge into the layer below">Merge</button>
        <button class="btn sm danger" id="layerDel" title="Delete layer">Delete</button>
      </div>
      <div class="canvas-info">
        <label class="bg-pick">Paper <input type="color" id="bgColor" value="#ffffff" aria-label="Paper colour"></label>
        <span id="sizeInfo">1080 × 1080 px</span>
      </div>
    </section>
  </aside>
</main>

<dialog id="newDialog" aria-labelledby="newTitle">
  <div class="dlg">
    <h2 id="newTitle">New drawing</h2>
    <div class="presets" id="presetList" role="radiogroup" aria-label="Canvas size"></div>
    <div class="custom-size" id="customSize" hidden>
      <label>Width <input class="ad-input" type="number" id="customW" min="16" max="4096" value="1200"></label>
      <label>Height <input class="ad-input" type="number" id="customH" min="16" max="4096" value="800"></label>
      <span class="muted">px</span>
    </div>
    <label class="bg-pick">Paper colour <input type="color" id="newBg" value="#ffffff"></label>
    <p class="muted small">Your current drawing is saved in this browser. Find it in My drawings.</p>
    <div class="row end"><button class="btn" id="newCancel">Cancel</button><button class="btn primary" id="newCreate">Create</button></div>
  </div>
</dialog>

<dialog id="drawingsDialog" aria-labelledby="drawingsTitle">
  <div class="dlg wide">
    <div class="row"><h2 id="drawingsTitle">My drawings</h2><span class="spacer"></span><button class="btn sq" id="drawingsClose" aria-label="Close">✕</button></div>
    <p class="muted small">Saved only in this browser on this device. Export a drawing file to keep a copy.</p>
    <ul class="drawings" id="drawingsList"></ul>
  </div>
</dialog>

<div class="ad-toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
