<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AsaanDesk Studio: free online design editor</title>
  <meta name="description" content="Design social posts, presentations, logos, cards, flyers, posters, T-shirts and more in your browser. Templates, brand kit, Magic Resize, animations and print-ready PDF. Free, private, saved on your device.">
  <link rel="canonical" href="https://asaandesk.com/design/studio/">
  <meta name="theme-color" content="#5b4cf0">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/editor-shell.css">
  <link rel="stylesheet" href="studio.css">
  <!-- Fetch the editor's modules in parallel instead of one import level at a time (faster first open). -->
  <link rel="modulepreload" href="app.js"><link rel="modulepreload" href="state.js"><link rel="modulepreload" href="editor.js"><link rel="modulepreload" href="panels.js">
  <link rel="modulepreload" href="presets.js"><link rel="modulepreload" href="model.js"><link rel="modulepreload" href="templates.js"><link rel="modulepreload" href="gallery.js">
  <link rel="modulepreload" href="templates-decks.js"><link rel="modulepreload" href="templates-print.js"><link rel="modulepreload" href="templates-merch.js"><link rel="modulepreload" href="templates-xtra-print.js">
  <link rel="modulepreload" href="templates-xtra-merch.js"><link rel="modulepreload" href="templates-xtra-cards.js"><link rel="modulepreload" href="templates-xtra-social.js"><link rel="modulepreload" href="templates-xtra4-print.js">
  <link rel="modulepreload" href="templates-xtra4-merch.js"><link rel="modulepreload" href="templates-xtra6-a.js"><link rel="modulepreload" href="templates-xtra6-b.js"><link rel="modulepreload" href="ctxbar.js"><link rel="modulepreload" href="garment.js">
  <link rel="modulepreload" href="svg.js"><link rel="modulepreload" href="shapes.js"><link rel="modulepreload" href="textlayout.js"><link rel="modulepreload" href="fontmetrics.js">
  <link rel="modulepreload" href="geometry.js"><link rel="modulepreload" href="canvas.js"><link rel="modulepreload" href="exporter.js"><link rel="modulepreload" href="pdf.js">
  <link rel="modulepreload" href="resize.js"><link rel="modulepreload" href="collage.js"><link rel="modulepreload" href="animate.js"><link rel="modulepreload" href="brandkit.js">
  <link rel="modulepreload" href="mockup.js"><link rel="modulepreload" href="motion.js"><link rel="modulepreload" href="gif.js"><link rel="modulepreload" href="webm.js">
  <link rel="modulepreload" href="present.js"><link rel="modulepreload" href="draw.js"><link rel="modulepreload" href="textfx.js"><link rel="modulepreload" href="pagetools.js"><link rel="modulepreload" href="panels3.js"><link rel="modulepreload" href="download.js"><link rel="modulepreload" href="tableops.js"><link rel="modulepreload" href="chartsx.js"><link rel="modulepreload" href="../shared/store.js"><link rel="modulepreload" href="../shared/brand.js">
  <link rel="modulepreload" href="../shared/ai.js"><link rel="modulepreload" href="../shared/editor-shell.js"><link rel="modulepreload" href="../../pdf-editor/elements.js">
</head>
<body class="start">
  <header class="ad-bar st-bar">
    <a class="ad-brand" href="/design/" aria-label="AsaanDesk Design home"><span class="ad-brand-mark">A</span><span class="st-brandname">Studio</span></a>
    <button class="btn st-edonly" id="homeBtn" type="button" title="All designs" aria-label="All designs">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span class="st-hide-sm">Home</span>
    </button>
    <input class="ad-input st-name st-edonly" id="nameInput" type="text" aria-label="Design name" maxlength="80" spellcheck="false">
    <span class="st-saved st-edonly st-hide-sm" id="saveState" aria-live="polite"></span>
    <span class="st-grow"></span>
    <div class="st-tools st-edonly">
      <button class="btn icon" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
      <button class="btn icon" id="redoBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>↷</button>
      <span class="st-zoom st-hide-sm" role="group" aria-label="Zoom">
        <button class="btn icon" id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button class="btn st-zpct" id="zoomFit" type="button" title="Fit to screen (Ctrl+0)" aria-label="Fit to screen"><span id="zoomPct">100%</span></button>
        <button class="btn icon" id="zoomIn" type="button" aria-label="Zoom in">+</button>
      </span>
      <button class="btn" id="presentBtn" type="button" title="Present full screen" aria-label="Present">▶<span class="st-hide-sm"> Present</span></button>
      <button class="btn primary" id="downloadBtn" type="button" aria-label="Download">Download</button>
    </div>
  </header>

  <p id="bootMsg" class="st-boot" role="status">Opening the AsaanDesk editor…</p>
  <main id="startView" class="st-start" aria-label="Start"></main>

  <div id="editorView" class="st-editor" hidden>
    <nav id="rail" class="st-rail" aria-label="Tools"></nav>
    <aside id="side" class="st-side" hidden aria-label="Panel">
      <div class="st-sidehead">
        <button class="btn small ghost st-side-back" type="button" aria-label="Back to magic tools" hidden>‹ Back</button>
        <h2 class="st-side-title"></h2>
        <button class="btn small ghost st-side-close" type="button" aria-label="Close panel">✕</button>
      </div>
      <div class="st-side-body"></div>
    </aside>
    <section class="st-center">
      <div id="viewport" class="st-viewport" tabindex="0" aria-label="Design canvas. Click to select, drag to move, arrows to nudge.">
        <button id="merchChip" class="btn st-merchchip" type="button" hidden></button>
      </div>
      <div id="pagebar" class="st-pagebar" aria-label="Pages">
        <div class="st-pthumbs"></div>
        <div class="st-pacts">
          <span class="st-pinfo st-hide-sm"></span>
          <button class="btn small" type="button" data-act="left" aria-label="Move page earlier" title="Move page earlier">◀</button>
          <button class="btn small" type="button" data-act="right" aria-label="Move page later" title="Move page later">▶</button>
          <button class="btn small" type="button" data-act="dup" aria-label="Duplicate page" title="Duplicate page">⧉</button>
          <button class="btn small" type="button" data-act="del" aria-label="Delete page" title="Delete page">🗑</button>
          <button class="btn small primary" type="button" data-act="add" aria-label="Add page" title="Add page">+ Add page</button>
        </div>
      </div>
    </section>
    <aside id="props" class="st-props" aria-label="Properties">
      <div class="st-propshead"><h2 class="st-props-title">Page</h2><button class="btn small ghost st-props-close" type="button" aria-label="Close properties">✕</button></div>
      <div class="st-props-body"></div>
    </aside>
  </div>

  <dialog id="exportDlg" aria-labelledby="exportTitle">
    <form class="st-dlg" method="dialog">
      <h2 id="exportTitle">Download</h2>
      <label class="st-field"><span>File type</span>
        <select class="ad-input" name="format" aria-label="File type">
          <option value="png">PNG (best for graphics, can be see-through)</option>
          <option value="jpg">JPG (small files, best for photos)</option>
          <option value="webp">WebP (smallest, for websites)</option>
          <option value="pdf">PDF Standard (share and read)</option>
          <option value="pdfprint">PDF Print (300 dpi, bleed and crop marks)</option>
          <option value="svg">SVG (vector, any size)</option>
          <option value="pptx">PowerPoint (.pptx, editable text)</option>
          <option value="mp4">MP4 video</option>
          <option value="gif">GIF (animated)</option>
          <option value="webm">WebM video</option>
          <option value="zip">All pages as PNG (ZIP)</option>
          <option value="json">Design file (.asaandesk.json)</option>
        </select></label>
      <label class="st-field st-scale"><span>Size</span>
        <select class="ad-input" name="scale" aria-label="Size"><option value="0.5">0.5×</option><option value="1">1× (screen)</option><option value="1.5">1.5×</option><option value="2">2× (sharper)</option><option value="3">3× (largest)</option><option value="print">Print quality</option></select></label>
      <label class="st-field st-quality"><span>Quality</span>
        <select class="ad-input" name="quality" aria-label="Quality"></select></label>
      <label class="st-field st-limit" hidden><span>Largest file size (KB)</span>
        <input class="ad-input" type="number" name="limitKB" min="5" max="1000000" value="500" aria-label="Largest file size in KB"></label>
      <label class="st-field st-vq" hidden><span>Video quality</span>
        <select class="ad-input" name="vq" aria-label="Video quality"><option value="480">480p</option><option value="720">720p</option><option value="1080" selected>1080p</option></select></label>
      <label class="st-check"><input type="checkbox" name="bleed"> <span>Include bleed (for printing to the edge)</span></label>
      <label class="st-check"><input type="checkbox" name="marks"> <span>Crop marks</span></label>
      <label class="st-check st-flatten"><input type="checkbox" name="flatten"> <span>Flatten PDF (each page one picture)</span></label>
      <label class="st-check st-compress"><input type="checkbox" name="compress"> <span>Compress PDF (smaller photos, smaller file)</span></label>
      <p class="st-hint st-cmyk" hidden>Colour profile: RGB. CMYK is not made here; most print shops convert RGB PDFs for you.</p>
      <label class="st-check st-clear"><input type="checkbox" name="clear"> <span>Transparent background</span></label>
      <label class="st-field st-pages"><span>Pages</span>
        <select class="ad-input" name="pages" aria-label="Pages"><option value="all">All pages</option><option value="current">This page</option><option value="custom">Choose pages…</option></select></label>
      <div class="st-pagepick" hidden>
        <input class="ad-input" type="text" name="range" placeholder="e.g. 1-3, 5" aria-label="Pages to download (e.g. 1-3, 5)">
        <div class="st-pagechecks" role="group" aria-label="Pages to download"></div>
      </div>
      <label class="st-check"><input type="checkbox" name="save"> <span>Save download settings</span></label>
      <p class="st-pxinfo st-hint"></p>
      <p class="st-dlgstatus st-status" role="status"></p>
      <div class="st-row st-end"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="exportGo" type="submit">Download</button></div>
    </form>
  </dialog>

  <noscript><p class="st-noscript">AsaanDesk Studio needs JavaScript turned on.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
