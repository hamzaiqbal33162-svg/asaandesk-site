<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo editor · AsaanDesk Design</title>
<meta name="description" content="Free photo editor in your browser: crop, adjust, filters, text and stickers, background remover, magic eraser, image enhancer and passport photos.">
<link rel="icon" href="/pdf-editor/icons/icon32.png">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/editor-shell.css">
<link rel="stylesheet" href="photo.css">
<script type="module" src="app.js"></script>
</head>
<body data-mode="full">
<header class="ad-bar">
  <a class="ad-brand" href="/design/" aria-label="AsaanDesk Design home"><span class="ad-brand-mark">A</span><span class="brand-text">Design</span></a>
  <span class="app-name" id="appName">Photo editor</span>
  <a class="full-link-top" id="fullLink" href="./" hidden>Full editor</a>
  <span class="spacer"></span>
  <span class="saved" id="saved" aria-live="polite"></span>
  <div class="bar-actions" id="barActions" hidden>
    <button class="btn icon" id="openBtn" aria-label="Open another photo" title="Open another photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg></button>
    <button class="btn icon" id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn icon" id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn" id="compareBtn" aria-label="Hold to see the original photo" title="Hold to see the original (or hold \)">Before</button>
    <button class="btn" id="splitBtn" aria-pressed="false" aria-label="Before and after side by side" title="Before | after">Split</button>
    <button class="btn primary" id="downloadBtn">Download</button>
  </div>
</header>
<input type="file" id="openInput" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif,image/*" hidden>
<input type="file" id="bgImageInput" accept="image/*,.heic,.heif" hidden>
<input type="file" id="bulkInput" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif,image/*" multiple hidden>

<div id="photoWork" class="photo-work">
<main id="start" class="start">
  <div class="hero">
    <h1 id="heroTitle">Edit a photo</h1>
    <p id="heroText"></p>
  </div>
  <div id="startSoon" class="start-soon" hidden></div>
  <div class="drop" id="dropZone">
    <button class="btn primary big" id="pickBtn">Open a photo</button>
    <p>or drop it here, or paste it (Ctrl+V)</p>
    <p class="small">JPG, PNG, WebP or HEIC · stays on your device</p>
    <button class="linkish bulk-start" id="bulkStart" type="button">Many photos? Remove all their backgrounds at once (up to 50)</button>
  </div>
  <div id="recent" class="recent"></div>
</main>

<main id="editor" class="editor" hidden>
  <nav class="tools" id="tools" role="tablist" aria-label="Photo tools"></nav>
  <section class="stage" id="stage" aria-label="Photo">
    <div class="canvas-wrap" id="wrap">
      <canvas id="view" aria-label="Your edited photo"></canvas>
      <canvas id="beforeView" hidden aria-label="The original photo"></canvas>
      <div class="split-handle" id="splitHandle" hidden role="slider" aria-label="Before and after divider"></div>
      <canvas id="brush" hidden aria-label="Brush over what to erase"></canvas>
      <div class="crop-box" id="crop" hidden tabindex="0" aria-label="Crop box: drag to move, arrow keys to nudge">
        <i class="grid"></i>
        <b data-h="nw"></b><b data-h="n"></b><b data-h="ne"></b><b data-h="e"></b><b data-h="se"></b><b data-h="s"></b><b data-h="sw"></b><b data-h="w"></b>
      </div>
      <div class="sel" id="sel" hidden><b class="h-scale" data-h="scale" title="Drag to resize"></b><b class="h-rot" data-h="rot" title="Drag to turn"></b></div>
    </div>
  </section>
  <aside class="panel" id="panel" aria-label="Tool settings"></aside>
</main>
</div>

<div class="busy" id="busy" hidden role="alert" aria-live="assertive">
  <div class="busy-card"><div class="spinner" aria-hidden="true"></div><p id="busyText">Working…</p><div class="progress" hidden><span id="busyBar"></span></div></div>
</div>
<div class="ad-toast" id="toast" hidden role="status"></div>
</body>
</html>
