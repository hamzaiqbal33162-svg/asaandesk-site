<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Make small website widgets (countdown, pricing table, FAQ, QR code and more) and copy the code. Works offline.">
<title>Code generator | AsaanDesk</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="ad-bar">
  <a class="ad-brand" href="/design/"><span class="ad-brand-mark" aria-hidden="true">a</span>AsaanDesk <span>Code generator</span></a>
  <div class="ad-tabs mode-tabs" role="tablist" aria-label="How to make your widget">
    <button type="button" role="tab" id="tabTemplates" aria-selected="true" aria-controls="templatesView" class="on">Templates</button>
    <button type="button" role="tab" id="tabAi" aria-selected="false" aria-controls="aiView" tabindex="-1">Describe with AI</button>
  </div>
  <span class="bar-note" title="The templates run in your browser. Nothing is uploaded.">Works offline</span>
</header>

<main class="layout" id="layout" data-mode="templates">
  <nav class="picker" id="picker" aria-label="Widgets">
    <h2 class="picker-title">Widgets</h2>
    <div class="pick-list" id="pickList"></div>
  </nav>

  <section class="settings ad-panel" id="templatesView" role="tabpanel" aria-labelledby="tabTemplates">
    <div class="settings-head">
      <div>
        <h2 id="setTitle">Widget</h2>
        <p class="blurb" id="setBlurb"></p>
      </div>
      <button type="button" class="btn small" id="resetBtn" title="Put back the starting text and colours">Reset</button>
    </div>
    <ul class="warnings" id="warnings" aria-live="polite"></ul>
    <form id="opts" class="opts" autocomplete="off" novalidate></form>
  </section>

  <section class="settings ad-panel" id="aiView" role="tabpanel" aria-labelledby="tabAi" hidden>
    <h2>Describe the widget you want</h2>
    <div id="aiSoon"></div>
    <form id="aiForm" class="ai-form" hidden>
      <label class="field" for="aiPrompt"><span>What should it do and look like?</span>
        <textarea id="aiPrompt" class="ad-input" rows="6" maxlength="2000" placeholder="For example: a card that shows our delivery charges by area, with a search box"></textarea>
      </label>
      <button type="submit" class="btn primary" id="aiGo">Make it</button>
      <p class="ai-status" id="aiStatus" role="status" aria-live="polite"></p>
    </form>
    <button type="button" class="btn" id="backToTemplates">Use a template instead</button>
  </section>

  <section class="output" aria-label="Preview and code">
    <div class="ad-panel preview-panel">
      <div class="panel-head">
        <h2>Preview</h2>
        <div class="ad-tabs device-tabs" role="group" aria-label="Preview size">
          <button type="button" id="devDesktop" class="on" aria-pressed="true">Desktop</button>
          <button type="button" id="devPhone" aria-pressed="false">Phone</button>
        </div>
        <button type="button" class="btn small" id="reloadBtn" title="Start the preview again">Restart</button>
      </div>
      <div class="frame-wrap" id="frameWrap">
        <iframe id="preview" title="Widget preview" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads" referrerpolicy="no-referrer"></iframe>
        <p class="frame-empty" id="frameEmpty" hidden>Your widget will show here.</p>
      </div>
    </div>

    <div class="ad-panel code-panel">
      <div class="panel-head">
        <h2>Code</h2>
        <div class="ad-tabs code-tabs" role="group" aria-label="Which code">
          <button type="button" id="viewPage" class="on" aria-pressed="true" title="A complete web page">Full page</button>
          <button type="button" id="viewSnippet" aria-pressed="false" title="Paste this part into your own website">Snippet</button>
        </div>
        <span class="code-size" id="codeSize"></span>
      </div>
      <div class="actions" id="actions" role="toolbar" aria-label="Use the code">
        <button type="button" class="btn primary" id="copyBtn">Copy code</button>
        <button type="button" class="btn" id="downloadBtn">Download HTML</button>
        <button type="button" class="btn" id="openBtn">Open in new tab</button>
      </div>
      <pre class="code" id="code" tabindex="0" aria-label="Widget code"><code id="codeText"></code></pre>
    </div>
  </section>
</main>
<div class="ad-toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
